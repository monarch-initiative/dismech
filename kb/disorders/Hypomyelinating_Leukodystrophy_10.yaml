    evidence:
    - reference: PMID:36548190
      reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, these results indicate that an HLD10-associated PYCR2 mutation leads to the formation of large mitochondria with decreased activities, inhibiting oligodendroglial cell morphological differentiation."
      explanation: Supports the model as informative for the oligodendroglial differentiation node.
- name: CRISPR-Cas9 PYCR2-deficient HEK293FT cell line
  experimental_model_type: CELL_LINE
  publication: PMID:25865492
  description: >-
    An isogenic PYCR2 knockout generated by CRISPR-Cas9 in HEK293FT cells,
    showing decreased mitochondrial membrane potential and increased apoptosis
    under oxidative stress.
  modeled_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress Susceptibility
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Isogenic loss-of-function evidence isolating the mitochondrial and
      apoptotic consequences of PYCR2 loss from genetic background.
    limitations: >-
      A non-neural embryonic kidney line; the readouts establish that PYCR2 loss
      has these consequences in principle, not that they occur in patient
      oligodendrocytes or neurons.
    evidence:
    - reference: PMID:25865492
      reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A PYCR2-deficient HEK293FT cell line generated by genome editing with the clustered regularly interspaced short palindromic repeat (CRISPR)-Cas9 system showed that PYCR2 loss of function led to decreased mitochondrial membrane potential and increased susceptibility to apoptosis under oxidative stress."
      explanation: Supports the model as informative for the mitochondrial-dysfunction node.
discussions:
- discussion_id: hld10_mechanism_beyond_proline
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Preserved Bulk Proline Supply by Paralogue Redundancy
  status: OPEN
  prompt: >-
    If proline is not depleted, what exactly does the cell lose when PYCR2 is
    absent, and why is the deficit restricted to the CNS?
  rationale: >-
    Every measurement to date - patient plasma and CSF, patient plasma
    metabolomics, mouse serum and fibroblast lysates - finds proline normal, and
    the paralogues are largely redundant for bulk proline supply. Yet PYCR2 loss
    produces a severe, CNS-restricted disease. Three non-exclusive candidate
    answers are on the table: a local proline or P5C pool in a compartment or cell
    type that bulk measurement cannot resolve; a redox role, since PYCR2 also
    cycles NAD(P)H/NAD(P)+; and the SHMT2/glycine diversion, which is the only one
    with a rescue experiment behind it. Distinguishing them matters
    therapeutically, because proline supplementation, redox support and glycine
    lowering are entirely different interventions - and the mouse dietary
    experiment already shows proline availability modulates severity even though
    proline is not depleted.
  evidence:
  - reference: PMID:38709052
    reference_title: "Exploring metabolic alterations in PYCR2 deficiency: Unveiling pathways and clinical presentations of hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings and all the previous reports suggest that proline auxotrophy is not the central disease mechanism."
    explanation: "States the gap - the obvious metabolic explanation has been excluded."
  - reference: PMID:33734376
    reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, Pycr1 and -2 have redundant functions in proline biosynthesis, and their loss makes proline a semi-essential amino acid."
    explanation: >-
      Frames the paradox - redundancy for bulk supply, yet a severe phenotype and
      a diet-dependent modulation of severity.
- discussion_id: hld10_mouse_hypomyelination_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Oligodendroglial Differentiation and CNS Hypomyelination
  status: OPEN
  prompt: >-
    Do Pycr2-null mice actually reproduce the CNS hypomyelination and progressive
    microcephaly that define HLD10 in humans?
  rationale: >-
    The two published Pycr2 mouse lines are described very differently. One is
    reported to phenocopy the human disorder and is the source of the cerebral
    glycine finding; the other, characterised in detail, reports a neurological
    and neuromuscular syndrome of kyphosis, hind-limb clasping and weight loss,
    with only mild peripheral axonal atrophy and no reported assessment of
    myelination or head size. Since hypomyelination and postnatal progressive
    microcephaly are precisely the features that define the human disease, the
    hypomyelination arm of the mechanism currently rests on a heterologous
    oligodendroglial cell line rather than on any in vivo model. Until a mouse is
    shown to be hypomyelinated, mouse rescue experiments cannot be read as
    evidence about the human white-matter phenotype.
  proposed_experiments:
  - experiment_id: hld10_mouse_myelin_quantification
    name: Myelin quantification in Pycr2-null mouse CNS
    description: >-
      Quantify myelin content and oligodendrocyte maturation in Pycr2-null mouse
      brain across postnatal development - MBP and CNPase immunoblotting and
      immunohistochemistry, electron-microscopic g-ratio measurement of corpus
      callosum axons, and serial head or brain-volume measurement - to establish
      whether the model is hypomyelinated and microcephalic or only neurologically
      impaired.
  evidence:
  - reference: PMID:33734376
    reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with recessive loss-of-function mutations in Pycr2 showed phenotypes consistent with neurological and neuromuscular disorders, including weight loss, kyphosis, and hind-limb clasping."
    explanation: >-
      The detailed characterisation names a neurological syndrome but not
      hypomyelination or microcephaly, which is the mismatch.
  - reference: PMID:32330411
    reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We find that knocking out Pycr2 in mice phenocopies the human disorder and depletes PYCR1 levels in neural lineages."
    explanation: >-
      The competing claim of full phenocopy, stated without a reported myelin or
      head-size measurement in the abstract.
- discussion_id: hld10_leukodystrophy_vs_leukoencephalopathy
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Progressive Neuronal Loss and Brain Atrophy
  status: OPEN
  prompt: >-
    Is HLD10 a true hypomyelinating leukodystrophy, or a primary neuronal
    disorder with secondary hypomyelination that is misplaced in the HLD series?
  rationale: >-
    The name says leukodystrophy, but the largest cohort argued the opposite. Its
    authors noted that imaging ranged from subtle white-matter T2 hyperintensity
    to progressive brain atrophy, and that the clinical picture of early-onset
    intellectual disability, microcephaly, epilepsy and atrophy points to primary
    neuronal dysfunction with a secondary myelination deficit - which is the
    definition of a genetic leukoencephalopathy rather than a classical HLD. This
    is not merely nosological: it determines whether oligodendrocyte-directed or
    neuron-directed interventions are the rational target. The cell-biology
    evidence has since given the oligodendrocyte arm independent support, so the
    honest current position is that both processes are real and their relative
    primacy is unsettled.
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features of early onset intellectual disability, microcephaly, epilepsy, and brain atrophy suggest primary neuronal dysfunction with secondary deficit in myelination"
    explanation: States the primary-neuronal position from the largest cohort.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although this condition has been classified as a hypomyelinating leukodystrophy, we found that the imaging features were variable ranging from subtle white matter T2 hyperintensities to progressive brain atrophy."
    explanation: Records the imaging variability that motivates the reclassification argument.
  - reference: PMID:36548190
    reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Taken together, these results indicate that an HLD10-associated PYCR2 mutation leads to the formation of large mitochondria with decreased activities, inhibiting oligodendroglial cell morphological differentiation."
    explanation: >-
      Counters the purely-neuronal reading by demonstrating a cell-autonomous
      oligodendroglial differentiation defect caused by the disease alleles.

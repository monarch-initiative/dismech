  modality: MRI
  description: >-
    Hypomyelination or delayed myelination of deep and subcortical white matter,
    hyperintense on T2 and isointense on T1, with generalized reduction of
    cerebral white-matter volume. This is the radiographic hallmark of HLD10.
  frequency: VERY_FREQUENT
  notes: >-
    Described as the typical radiographic feature across the 35 patients
    reviewed in PMID:34037307 and present in all patients of PMID:27860360.
  phenotype_term:

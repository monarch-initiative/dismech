name: Hypomyelinating Leukodystrophy 10
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 10 (HLD10, MIM 616420) is an ultra-rare
  autosomal recessive neurodevelopmental and neurodegenerative disorder caused by
  biallelic variants in PYCR2, which encodes the mitochondrial NAD(P)H-dependent
  enzyme pyrroline-5-carboxylate reductase 2. PYCR2 catalyses the terminal step
  of L-proline biosynthesis, reducing delta-1-pyrroline-5-carboxylate (P5C) to
  L-proline. Affected children are typically born with normal or near-normal
  growth parameters and then develop postnatally acquired, progressive
  microcephaly, profound global developmental delay, failure to thrive, a
  characteristic craniofacial gestalt (triangular facies, malar hypoplasia,
  large malformed ears, upturned bulbous nose, long smooth philtrum), axial
  hypotonia with appendicular spasticity, hyperkinetic movements, and seizures.
  Brain imaging shows CNS hypomyelination or delayed myelination with reduced
  cerebral white-matter volume, a thin corpus callosum, and progressive global
  brain atrophy, while the cerebellum, brainstem and deep grey nuclei are
  relatively spared. In the largest reported cohort no individual survived beyond
  the first decade.

  The mechanism is not simple proline auxotrophy. Plasma and CSF proline are
  normal, routine metabolic screens are unremarkable, and Pycr2-null mice do not
  show reduced serum proline - PYCR1 and PYCR2 are largely functionally redundant
  for bulk proline supply. (The third paralogue PYCR3 is cytosolic and draws its
  P5C from ornithine rather than glutamate, and was not tested for redundancy in
  that work, so it is not part of this claim.) Disease-associated variants
  instead destabilise the protein or impair its dimerisation and catalytic
  efficiency, producing mitochondrial dysfunction (depolarised, enlarged,
  fusion-shifted mitochondria and increased apoptosis under oxidative stress),
  a failure of oligodendroglial morphological differentiation that accounts for
  the hypomyelination, and a downstream one-carbon perturbation in which SHMT2 is
  upregulated and cerebral glycine accumulates. The glycine arm is the principal
  proposed intervention point.

  The allelic spectrum extends beyond the classical severe phenotype. A homozygous
  p.Val128Ala missense variant has been reported in two related families in which
  hereditary spastic paraplegia beginning in late childhood was the only
  manifestation, with normal white-matter myelination but glycine peaks on MR
  spectroscopy (PMID:37141741); separately, spastic paraplegia as the sole symptom
  has been reported in two adult-onset patients carrying a different novel PYCR2
  variant (PMID:32920934). The mild end of this spectrum is therefore not a
  single-family observation.
notes: >-
  Named-entity-confusion guardrail. This entry is anchored strictly on
  MONDO:0014632 / OMIM:616420 / PYCR2 (hgnc:30262). "Hypomyelinating
  leukodystrophy N" is a numbered series (HLD1-HLD13) whose members share nothing
  but the numeral, so the anchor was fixed before curation with
  `uv run runoak -i sqlite:obo:mondo info MONDO:0014632 -O obo`, which returns
  `relationship: RO:0004003 HGNC:30262 ! PYCR2` and `xref: OMIM:616420`.
  `just preflight-dr` on the deep-research report returned PASS
  (PYCR2 mentioned 44 times, next-most-mentioned gene PYCR1 at 6; report OMIM
  616420 matches the MONDO xref).

  Two deep-research reports were run and both are in `research/`: `claude_code`
  (14 web searches, 10/10 citations resolved, 0 unresolved) and `openscientist`
  (14/14 citations resolved, 0 unresolved). Falcon was attempted first and failed
  with HTTP 402 (the Edison account is out of credit), so it is absent by
  circumstance rather than by choice. `just preflight-dr` returned PASS on the
  claude_code report and WARN on the openscientist one; the WARN is a false
  positive of the rival-gene heuristic, since the "rival" it flags is SHMT2 at 26
  mentions against PYCR2 at 60, and SHMT2 is this disease's own downstream
  mechanism gene (PMID:32330411), not a second disease entity. Both reports agree
  on OMIM 616420.

  Neither report's identifiers were trusted. The claude_code report asserted
  "PYCR2, HGNC:23364" - that CURIE is ST6GALNAC6, not PYCR2, confirmed by
  `uv run runoak -i sqlite:obo:hgnc info hgnc:23364`. The openscientist report
  gave the disease as MONDO:0014635, which is not this entity. The bindings used
  here - hgnc:30262 and MONDO:0014632 - come from the MONDO record and were
  independently confirmed with OAK. Beyond those two: the great majority of the PYCR2
  literature is cancer biology in which PYCR2 is OVEREXPRESSED and its INHIBITION
  is the proposed therapy - the mechanistic opposite of this recessive
  loss-of-function disorder. A PubMed query for `PYCR2[tiab] OR "hypomyelinating
  leukodystrophy 10"[tiab] OR "HLD10"[tiab]` run on 2026-08-19 returned 59
  records, of which roughly two thirds are oncology or unrelated. None of those is
  cited here and no PYCR2 inhibitor is curated as a treatment.

  The paralogue PYCR1 is the third confusable. PYCR1 deficiency causes autosomal
  recessive cutis laxa type 2B (MONDO:0013051) and is a different disease despite
  acting at the same pathway step; it is recorded here only as a differential
  diagnosis. Note that PYCR1-related ARCL2B is NOT itself curated in dismech - the
  existing `ALDH18A1_Cutis_Laxa` and `ALDH18A1_De_Barsy_Spectrum` entries are keyed
  on ALDH18A1/P5CS, one step upstream, which is a different gene again. Claims
  about PYCR1 are never used as evidence for PYCR2 disease.

  No GeneReviews chapter exists for PYCR2 or HLD10. Searched on 2026-08-19 with
  `PYCR2 GeneReviews[All Fields]` and `hypomyelinating leukodystrophy 10
  GeneReviews[All Fields]`; both returned zero records. The phenotype baseline is
  therefore taken from the primary cohort literature (PMID:27130255, 14 patients
  from 11 families; PMID:27860360, 5 patients from 3 families; PMID:34037307,
  which additionally reviews all 35 patients reported to that date).

  No `datasets:` block is curated, deliberately. HLD10 has roughly 38 published
  patients and no omics resource of its own, while PYCR2 is a heavily studied
  cancer gene - so a gene-keyed accession search returns colorectal, hepatocellular
  and renal-carcinoma series that would resolve perfectly and be about the wrong
  disease. That is exactly the Named Entity Confusion reached through dataset
  search that the curation SOP warns about, and an empty block is the honest
  result rather than an oversight.

  Frequency discipline. Bands are asserted only where a published cohort gives an
  explicit numerator or percentage, and every such phenotype carries the source
  figure in its `notes:`. Percentages are quoted from PMID:27130255 (n=14) unless
  stated otherwise. Where a feature is described only as "common" or "in some
  patients", `frequency:` is omitted rather than guessed. Three features
  (progressive microcephaly, global developmental delay, failure to thrive) are
  reported in 100 percent of patients in every cohort and would map to `OBLIGATE`;
  they are deliberately banded one step down at `VERY_FREQUENT`, because the whole
  published denominator is about 38 patients drawn from consanguineous pedigrees
  ascertained on exactly those features - too small and too ascertainment-biased
  to support an obligate claim.

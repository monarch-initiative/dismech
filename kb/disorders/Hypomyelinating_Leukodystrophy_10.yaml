      reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, these results indicate that an HLD10-associated PYCR2 mutation leads to the formation of large mitochondria with decreased activities, inhibiting oligodendroglial cell morphological differentiation."
      explanation: States exactly the mitochondria-to-differentiation edge asserted here.
  - target: Progressive Neuronal Loss and Brain Atrophy

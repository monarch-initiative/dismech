- name: Severe Neurodevelopmental Impairment and Early Mortality
  biological_scale: ORGANISM
  description: >-
    The clinical convergence point. Affected children stagnate at roughly a
    4-to-5-month developmental level, never acquire meaningful language, fine
    motor skills or independent ambulation, and develop failure to thrive by one
    year of age. In the largest cohort no patient survived beyond the first
    decade, with death from pulmonary infection, fever of unknown origin or
    failure to thrive.
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic clinical presentation of patients with PYCR2 mutations included failure to thrive, microcephaly, craniofacial dysmorphism, progressive psychomotor disability, hyperkinetic movements, and axial hypotonia with variable appendicular spasticity."
    explanation: Defines the clinical syndrome that this node represents.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients did not survive beyond the first decade of life."
    explanation: Establishes the mortality outcome in the reference cohort.

    reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report mutations in PYCR2, which encodes an enzyme in the proline biosynthesis pathway, as the cause of a unique syndrome characterized by postnatal microcephaly, hypomyelination, and reduced cerebral white-matter volume"
    explanation: Establishes PYCR2 as the causal gene and names the proline-biosynthesis role of its product.
  - reference: PMID:25865492
    reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When mutant cDNAs were transfected into HEK293FT cells, both variant proteins retained normal mitochondrial localization but had lower amounts than the wild-type protein, suggesting that the variant proteins were less stable."
    explanation: >-
      Shows the two founding missense alleles reduce protein abundance rather
      than mislocalise the enzyme, i.e. a loss-of-function mechanism.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations clustered in the dimerization domain of the protein, and several tested mutations impaired multimerization."
    explanation: Identifies impaired multimerisation as a second route to loss of function.
  - reference: PMID:33771508
    reference_title: "Disease variants of human Δ(1)-pyrroline-5-carboxylate reductase 2 (PYCR2)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depending on whether NADPH or NADH was used, the catalytic efficiency of the R119C protein variant was 40 or 366 times lower than that of the wild-type enzyme, while the catalytic efficiency of the R251C protein variant was 7 or 26 times lower than that of the wild-type enzyme."
    explanation: Quantifies the catalytic penalty of the two founding disease variants.
  - reference: PMID:33771508
    reference_title: "Disease variants of human Δ(1)-pyrroline-5-carboxylate reductase 2 (PYCR2)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, thermostability and circular dichroism measurements suggest that the R251C protein variant has a pronounced folding defect."
    explanation: Documents a folding defect as the structural basis of instability for p.Arg251Cys.
  - reference: PMID:32330411
    reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we report the crystal structure of the PYCR2 apo-enzyme and show that a novel germline p.Gly249Val mutation lies at the dimer interface and lowers its enzymatic activity"
    explanation: Structural confirmation that a disease allele at the dimer interface lowers enzymatic activity.

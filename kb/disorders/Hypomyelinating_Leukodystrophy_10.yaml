biochemical:
- name: Routine Metabolic Abnormality
  context: >-
    A negative but diagnostically important finding: standard biochemical
    screening is normal in HLD10. Serum creatinine, BUN, CPK, ammonia, lactate,
    plasma amino acids and urine organic acids are all unremarkable, and plasma
    and CSF proline are normal. HLD10 is therefore not detectable by routine
    metabolic panels or newborn biochemical screening, and molecular testing is
    required.
  presence: ABSENT
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic profile including serum creatinine, BUN, CPK, ammonia, lactate, plasma amino acids and urine organic acids were normal in all patients."
    explanation: Enumerates the routine analytes found normal in all 14 patients.
  - reference: PMID:27860360
    reference_title: "Homozygous variants in pyrroline-5-carboxylate reductase 2 (PYCR2) in patients with progressive microcephaly and hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the metabolic role of PYCR2, routine serum metabolic test in these patients were normal."
    explanation: Independent confirmation that routine metabolic testing is uninformative.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PYCR2-related syndrome represents a clinically recognizable condition in which PYCR2 mutations lead to protein dysfunction, not detectable on routine biochemical assessments."
    explanation: States the diagnostic consequence of the normal biochemistry.
- name: Elevated Plasma and CSF Purine Metabolites
  context: >-
    Untargeted metabolomics of plasma and CSF in three related patients showed
    marked increases of inosine and xanthine, together with mild increases of
    glutamate, alpha-ketoglutarate and L-glutamate semialdehyde. This points to a
    purine/pyrimidine-pathway perturbation in addition to the mild proline-pathway
    changes, and is a candidate biochemical signature - not an established
    diagnostic marker.
  presence: PRESENT
  notes: >-
    Based on three genetically related patients from a single family
    (PMID:38709052); has not been replicated in an independent cohort.
  evidence:
  - reference: PMID:38709052
    reference_title: "Exploring metabolic alterations in PYCR2 deficiency: Unveiling pathways and clinical presentations of hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While plasma and CSF proline levels were found to be totally normal, untargeted metabolomic profiling revealed mild increases of glutamate, alpha-ketoglutarate, and l-glutamate semialdehyde and marked increases of inosine and xanthine."
    explanation: Reports the metabolomic changes recorded here.
  - reference: PMID:38709052
    reference_title: "Exploring metabolic alterations in PYCR2 deficiency: Unveiling pathways and clinical presentations of hypomyelinating leukodystrophy 10."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Untargeted metabolomics point to mild changes in proline pathway and also in purine/pyrimidine pathway."
    explanation: >-
      Supports the purine/pyrimidine interpretation, marked PARTIAL because the
      authors themselves describe the proline-pathway changes as mild and the
      finding rests on one family.
- name: Mildly Elevated Urinary Glutamate
  context: >-
    Urine amino acids, available in two families, showed mildly elevated glutamate
    (84 and 109 nmol/mg creatinine against a reference of <76) compared with
    unaffected carriers. A subtle finding consistent with a block downstream of
    glutamate, but far too inconsistently measured to be diagnostic.
  presence: PRESENT
  notes: Measured in only 2 of 11 families in PMID:27130255.
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Urine amino acids were available in two families (2206 and 2664), which showed mildly elevated glutamate levels at 84 and 109 nmol/mg creatinine (reference level <76 nmol/mg creatinine) respectively, compared to unaffected carriers who had normal levels."
    explanation: >-
      Reports the raw values and the carrier comparison; PARTIAL because the
      measurement was available for only two of eleven families.
genetic:
- name: PYCR2
  notes: >-
    PYCR2 (1q42.12) encodes pyrroline-5-carboxylate reductase 2, a mitochondrial
    NAD(P)H-dependent oxidoreductase that catalyses the terminal step of
    L-proline biosynthesis. Biallelic variants cause HLD10. Reported pathogenic
    alleles include the founding missense pair p.Arg119Cys and p.Arg251Cys; the
    recurrent nonsense allele p.Arg266Ter (shared by five of eleven families in
    the largest cohort); missense alleles p.Cys232Gly, p.Arg199Trp, p.Val184Ala,
    p.Gly159Arg, p.Val193Met, p.Gly249Val, p.Val86Gly, p.Val134Met and the
    mild-phenotype allele p.Val128Ala; the additional nonsense allele p.Glu10Ter;
    and a 3-prime splice-site variant of intron 2. The Thai c.400G>A
    (p.Val134Met) allele is a founder variant on a shared 2.3 Mb haplotype
    estimated at about 1450 years old.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PYCR2
    term:
      id: hgnc:30262
      label: PYCR2
  evidence:
  - reference: PMID:25865492
    reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report mutations in PYCR2, which encodes an enzyme in the proline biosynthesis pathway, as the cause of a unique syndrome characterized by postnatal microcephaly, hypomyelination, and reduced cerebral white-matter volume"
    explanation: Original identification of PYCR2 as the causal gene by linkage and exome sequencing.
  - reference: PMID:25865492
    reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morpholino-based knockdown of a zebrafish PYCR2 ortholog, pycr1b, recapitulated the human microcephaly phenotype, which was rescued by wild-type human PYCR2 mRNA, but not by mutant mRNAs, further supporting the pathogenicity of the identified variants."
    explanation: Functional confirmation of variant pathogenicity by orthologue knockdown and allele-specific rescue.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both nonsense and missense mutations were identified, which impaired protein multimerization."
    explanation: >-
      Establishes the allelic classes seen across the largest cohort. Tagged
      IN_VITRO because the multimerisation half of the sentence is a 293T
      co-immunoprecipitation result, matching how the same claim is classified in
      the pathophysiology section.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is an autosomal recessive disorder mapped to chromosome 1q42.12 due to mutations in the PYCR2 gene, encoding an enzyme involved in proline synthesis in mitochondria."
    explanation: Gives the chromosomal locus and the mitochondrial proline-synthesis role of the gene product.
  - reference: PMID:34037307
    reference_title: "Expanding the genotypic spectrum of PYCR2 and a common ancestry in Thai patients with hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haplotype analysis revealed that the two families' members shared a 2.3 Mb region covering the c.400G>A variant, indicating a common ancestry. The variant was estimated to age 1450 years ago."
    explanation: Documents the Thai founder haplotype and its estimated age.
  - reference: PMID:27860360
    reference_title: "Homozygous variants in pyrroline-5-carboxylate reductase 2 (PYCR2) in patients with progressive microcephaly and hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified homozygous variants in PYCR2 in the proband from each family: c.28C>T (p.(Glu10Ter)), c.796C>T (p.(Arg266Ter)), and c.577G>A (p.(Val193Met))."
    explanation: Names three additional homozygous pathogenic alleles identified by clinical exome sequencing.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. Case counts are the only
    defensible figure: about 35 patients reviewed in 2021 (PMID:34037307) and
    about 38 by 2024 (PMID:38709052). Reported families cluster in populations
    with high consanguinity (Egyptian, Pakistani, Omani, Indian, Iranian, Thai),
    so the distribution is strongly ascertainment-biased and no rate per 100000
    is asserted.
  evidence:
  - reference: PMID:38709052
    reference_title: "Exploring metabolic alterations in PYCR2 deficiency: Unveiling pathways and clinical presentations of hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up until now, to our knowledge around 38 patients with PYCR2 defect have been reported."
    explanation: Gives the published case count underpinning the ULTRA_RARE class.
  - reference: PMID:34037307
    reference_title: "Expanding the genotypic spectrum of PYCR2 and a common ancestry in Thai patients with hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also reviewed the phenotype and genotype of all 35 previously reported PYCR2 patients and found that majorities of cases were homozygous with a consanguineous family history"
    explanation: >-
      Independent case count three years earlier, and documents the consanguinity
      clustering that biases ascertainment.
progression:
- phase: Onset
  age_range: 2 months to 1 year
  notes: >-
    Birth parameters including weight, height and head circumference are normal
    or only mildly reduced; presentation follows postnatally.
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients presented with profound psychomotor delay, microcephaly, truncal hypotonia with variable appendicular spasticity, and failure to thrive from the ages of 2 months to 1 year."
    explanation: Gives the age window of first presentation.
- phase: Progressive decline
  notes: >-
    Microcephaly deepens, motor and intellectual function worsen over serial
    follow-up, and seizures typically appear before one year of age.
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial clinical follow up demonstrated progression of symptoms in patients."
    explanation: Documents the progressive rather than static course.
- phase: Mortality
  age_range: before 10 years
  notes: >-
    In the largest cohort five study patients died at or before age 6 and no
    patient survived beyond age 10, from pulmonary infection, fever of unknown
    origin or failure to thrive. Survival is not uniform across the spectrum -
    the mild spastic-paraplegia families include affected adults up to 26 years
    of age (PMID:37141741).
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients did not survive beyond the first decade of life."
    explanation: States the mortality ceiling in the reference cohort.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "died at or before age 6 years due to complications of pulmonary infection, fever of unknown origin and/ failure to thrive, and no patient survived beyond age 10 years"
    explanation: Gives the causes of death and confirms the survival ceiling.
diagnosis:
- name: Molecular Genetic Testing of PYCR2
  description: >-
    Diagnosis rests on identifying biallelic PYCR2 variants. Because routine
    biochemistry is normal, molecular testing - clinical exome or genome
    sequencing, a leukodystrophy or microcephaly gene panel, or targeted PYCR2
    sequencing once a familial variant is known - is required. Homozygosity
    mapping is informative in consanguineous families.
  evidence:
  - reference: PMID:34055512
    reference_title: "PYCR2 Mutation Causing Hypomyelination and Microcephaly in an Indian Child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further genetic testing in the form of clinical exome sequencing revealed compound heterozygous mutation of the PYCR2 gene and matching the clinical phenotype with the genotype."
    explanation: Illustrates clinical exome sequencing as the route to diagnosis.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PYCR2-related syndrome represents a clinically recognizable condition in which PYCR2 mutations lead to protein dysfunction, not detectable on routine biochemical assessments."
    explanation: Explains why molecular rather than biochemical testing is required.
differential_diagnoses:
- name: Autosomal recessive cutis laxa type 2B (PYCR1)
  description: >-
    The paralogue disorder and the single most important differential.
    PYCR1 deficiency acts at the same step of proline biosynthesis but produces
    cutis laxa with progeroid features. Lax, wrinkly skin is characteristically
    ABSENT in HLD10, and hypomyelination is not a feature of PYCR1 disease.
  disease_term:
    preferred_term: Autosomal recessive cutis laxa type 2B (PYCR1)
    term:
      id: MONDO:0013051
      label: autosomal recessive cutis laxa type 2B
  distinguishing_features:
  - Cutis laxa and wrinkly skin, absent in HLD10
  - Progeroid facial appearance, absent in HLD10
  - CNS hypomyelination, absent in PYCR1 disease
  - Postnatal progressive microcephaly with death in the first decade, absent in PYCR1 disease
  evidence:
  - reference: PMID:25865492
    reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypomyelination and the absence of lax, wrinkly skin distinguishes this condition from that caused by previously reported mutations in the gene encoding PYCR2's isozyme, PYCR1, suggesting a unique and indispensable role for PYCR2 in the human CNS during development."
    explanation: Names the two discriminating features between the paralogue disorders.
- name: Pelizaeus-Merzbacher disease
  description: >-
    The prototypic hypomyelinating leukodystrophy (HLD1, PLP1). Shares CNS
    hypomyelination but is X-linked, typically presents with nystagmus and
    cerebellar signs without severe progressive microcephaly, failure to thrive
    or the HLD10 craniofacial gestalt. Curated separately in dismech as
    `Pelizaeus_Merzbacher_Disease`.
  disease_term:
    preferred_term: Pelizaeus-Merzbacher disease
    term:
      id: MONDO:0010714
      label: Pelizaeus-Merzbacher spectrum disorder
  distinguishing_features:
  - X-linked PLP1 inheritance rather than autosomal recessive PYCR2
  - Prominent nystagmus and cerebellar ataxia
  - No progressive postnatal microcephaly
  - No severe diffuse cerebral atrophy
  evidence:
  - reference: PMID:36548190
    reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PMD is now known as the prototypic disorder of hypomyelinating leukodystrophies (HLDs)"
    explanation: Establishes Pelizaeus-Merzbacher disease as the prototype of the HLD group HLD10 belongs to.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in contrast to most patients with HLD, often presenting with cerebellar ataxia, axial hypotonia, spasticity, and nystagmus, without severe diffuse cerebral atrophy"
    explanation: >-
      Contrasts the typical HLD presentation with the microcephaly-and-atrophy
      picture of HLD10.
- name: AGC1 deficiency (SLC25A12)
  description: >-
    Aspartate-glutamate carrier 1 deficiency, an ultra-rare recessive disorder of
    the malate-aspartate shuttle. Included because it is the closest mechanistic
    analogue of the open question this entry curates: like HLD10 it presents with
    neurodevelopmental delay, epilepsy, hypotonia, cerebral atrophy and
    hypomyelination, and the literature debates in the same terms whether its
    hypomyelination is primary or secondary to a neuronal defect. Serial imaging in
    AGC1 deficiency shows early hypomyelination followed by later progression of
    myelination, which is the discriminator - HLD10 myelination does not catch up.
  disease_term:
    preferred_term: AGC1 deficiency
    term:
      id: MONDO:0013056
      label: developmental and epileptic encephalopathy, 39
  distinguishing_features:
  - Caused by SLC25A12 rather than PYCR2
  - Early hypomyelination with subsequent progression of myelination on serial MRI
  - Classified as a leuko-axonopathy rather than a hypomyelinating leukodystrophy
  evidence:
  - reference: PMID:31403263
    reference_title: "Novel compound heterozygous variants in SLC25A12 and clinical findings in the oldest individual with AGC1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients were clinically characterized by neurodevelopmental delay, epilepsy, hypotonia, cerebral atrophy, and hypomyelination; however, there has been discussion in the literature as to whether this hypomyelination is primary or secondary to a neuronal defect."
    explanation: >-
      Documents both the phenotypic overlap with HLD10 and the identical
      primary-versus-secondary hypomyelination debate.
  - reference: PMID:31403263
    reference_title: "Novel compound heterozygous variants in SLC25A12 and clinical findings in the oldest individual with AGC1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The serial neuroimaging findings are notable for cerebral atrophy with white matter involvement, namely, early hypomyelination yet subsequent progression of myelination."
    explanation: Gives the serial-imaging feature that distinguishes AGC1 deficiency from HLD10.
treatments:
- name: Antiseizure Pharmacotherapy
  description: >-
    Anticonvulsant medication for the focal myoclonic and generalized tonic-clonic
    seizures. In the largest cohort seizures were controlled with anticonvulsants,
    making this the single symptomatic intervention with documented efficacy in
    HLD10.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures were seen in 57% of patients with onset usually before 1 year of age, consisting of focal myoclonic and generalized tonic-clonic seizures, controlled with anticonvulsant medications."
    explanation: Documents seizure control with anticonvulsant medication in the reference cohort.
- name: Nutritional Support for Failure to Thrive
  description: >-
    Nutritional support, including gastrostomy feeding where dysphagia is severe,
    for the universal failure to thrive. Failure to thrive is itself among the
    listed causes of death in the reference cohort, which is the rationale.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_phenotypes:
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  notes: >-
    Curated as standard supportive care extrapolated from the documented severity
    and mortality contribution of failure to thrive; no HLD10-specific trial or
    outcome study of nutritional support exists.
  evidence:
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "died at or before age 6 years due to complications of pulmonary infection, fever of unknown origin and/ failure to thrive, and no patient survived beyond age 10 years"
    explanation: >-
      Supports the rationale by naming failure to thrive as a cause of death.
      PARTIAL because it evidences the need, not the efficacy, of nutritional
      support.
- name: Physical Therapy and Rehabilitation
  description: >-
    Physiotherapy, positioning and orthotic management for spasticity, contracture

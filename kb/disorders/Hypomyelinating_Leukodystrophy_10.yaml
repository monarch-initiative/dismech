- name: Impaired Oligodendroglial Differentiation and CNS Hypomyelination
  biological_scale: TISSUE
  description: >-
    Oligodendroglial cells expressing the HLD10 missense proteins fail to undergo
    the morphological differentiation that precedes myelination, with reduced
    expression of differentiation and myelin marker proteins. Because myelination
    is highly energy-dependent, the enlarged, hypoactive mitochondria provide a
    direct link from the enzymatic lesion to the white-matter phenotype. The
    resulting CNS hypomyelination and reduced cerebral white-matter volume are
    the imaging hallmark of the disease.

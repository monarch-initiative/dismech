  - reference: PMID:25865492
    reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A PYCR2-deficient HEK293FT cell line generated by genome editing with the clustered regularly interspaced short palindromic repeat (CRISPR)-Cas9 system showed that PYCR2 loss of function led to decreased mitochondrial membrane potential and increased susceptibility to apoptosis under oxidative stress."
    explanation: >-
      Isogenic knockout evidence that PYCR2 loss depolarises mitochondria and
      sensitises cells to oxidative-stress-induced apoptosis.
  - reference: PMID:36548190
    reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of each of the mutated R119C and R251C proteins in cells increased the fusion abilities in mitochondria and decreased their fission abilities relatively."
    explanation: Establishes the fusion-shifted mitochondrial dynamics caused by the disease missense proteins.
  - reference: PMID:36548190
    reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The respective mutant proteins, but not wild type proteins also decreased the activities of mitochondria."
    explanation: Shows the enlarged mitochondria are functionally impaired, not merely morphologically abnormal.
  downstream:
  - target: Impaired Oligodendroglial Differentiation and CNS Hypomyelination
    causal_link_type: DIRECT
    description: >-
      Mitochondrial dysfunction in oligodendroglial cells blocks the
      morphological differentiation required to produce myelin.
    evidence:

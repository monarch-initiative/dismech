- name: SHMT2 Upregulation and Cerebral Glycine Accumulation
  biological_scale: MOLECULAR
  description: >-
    Loss of PYCR2 upregulates serine hydroxymethyltransferase 2 (SHMT2), the
    mitochondrial one-carbon enzyme responsible for glycine synthesis, and
    cerebral glycine rises in both Pycr2-null mice and patients. The excess
    glycine is not a bystander: knocking down SHMT2 partially reverses it and
    rescues the axonal beading and shortened neurites of cultured Pycr2-knockout
    neurons, identifying the glycine pathway as the leading candidate
    intervention point. Elevated brain glycine is detectable non-invasively as
    an MR-spectroscopy glycine peak, including in the mild
    spastic-paraplegia-only phenotype where white matter is normally myelinated.
  biological_processes:
  - preferred_term: glycine biosynthetic process

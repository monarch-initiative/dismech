prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 10 affected individuals across four unrelated families have been
    reported in the peer-reviewed literature (PMID:24079343; PMID:29936144;
    PMID:30657919); population-based birth or point prevalence has not been
    established.
  evidence:
  - reference: PMID:30657919
    reference_title: "A homozygous pathogenic missense variant broadens the phenotypic and mutational spectrum of CREB3L1-related osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deficiency of OASIS is linked to a severe form of autosomal recessive
      osteogenesis imperfecta (OI), but only few patients have been reported.
    explanation: >-
      Confirms that CREB3L1-related OI (OI type XVI) is an ultra-rare disorder
      known from only a few reported families.
  - reference: PMID:29936144
    reference_title: "Homozygosity for CREB3L1 premature stop codon in first case of recessive osteogenesis imperfecta associated with OASIS-deficiency to survive infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we expand the clinical spectrum by a detailed phenotypic
      characterization of the first case of OASIS-associated OI surviving the
      neonatal period, with heterozygous family members being unaffected.
    explanation: >-
      Documents the third reported family and the first patient known to survive
      beyond the neonatal period.
pathophysiology:
- name: CREB3L1 Biallelic Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline loss-of-function variants in CREB3L1 — including
    homozygous 11p11.2 genomic deletions, premature stop codons, and missense
    variants within the conserved basic leucine zipper (bZIP) domain — abolish or
    severely impair the DNA-binding transcription factor activity of OASIS.

diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XVI is suspected in an infant or fetus with severe recessive OI
    (recurrent prenatal/postnatal fractures, low bone mineral density, deformity)
    when COL1A1/COL1A2 and other recessive OI genes are negative. Diagnosis is
    confirmed by identifying a biallelic CREB3L1 (OASIS) loss-of-function lesion —
    the 11p11.2 contiguous deletion, a premature stop codon, or a bZIP-domain
    missense variant — by deletion analysis and gene-panel or exome sequencing.
    Supportive cellular findings include markedly reduced CREB3L1 mRNA and type I
    collagen in cultured osteoblasts with abnormal rough-ER ultrastructure.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:29936144
    reference_title: "Homozygosity for CREB3L1 premature stop codon in first case of recessive osteogenesis imperfecta associated with OASIS-deficiency to survive infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous CREB3L1 stop codon mutation was detected by sequencing, while
      several family members were heterozygotes.
    explanation: >-
      Molecular sequencing identification of a biallelic CREB3L1 variant
      establishes the diagnosis of OI type XVI.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid) are the
    pharmacological mainstay of severe OI, increasing bone mineral density and
    reducing fracture frequency; in OI type XVI, life-long bisphosphonate
    treatment steadily increased bone mineral density although fractures
    persisted. They are antiresorptive and do not correct the underlying
    transcriptional collagen defect. The OASIS-deficient mouse responds to
    risedronate with increased trabecular bone and improved osteoblast rough-ER
    ultrastructure, supporting bisphosphonate efficacy in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: risedronic acid
      term:
        id: CHEBI:8869
        label: Risedronic acid
  target_mechanisms:
  - target: Collagen-Poor Bone Matrix, Low Bone Mass, and Skeletal Fragility
    description: >-
      Inhibits osteoclast-mediated bone resorption to increase trabecular bone
      mass and bone mineral density despite persistent osteoblast collagen
      deficiency.
  evidence:
  - reference: PMID:29936144
    reference_title: "Homozygosity for CREB3L1 premature stop codon in first case of recessive osteogenesis imperfecta associated with OASIS-deficiency to survive infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical response to life-long bisphosphonate treatment was as expected in
      severe OI with steadily increasing bone mineral density, but despite this
      the boy suffered repeated childhood fractures.
    explanation: >-
      Documents the clinical use and bone mineral density response of
      bisphosphonate therapy in a molecularly confirmed OI type XVI patient.
  - reference: PMID:20024590
    reference_title: "Effects of the bisphosphonate risedronate on osteopenia in OASIS-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological and histomorphometric analyses revealed that the trabecular
      bones increased dramatically in OASIS-/- mice treated with RIS, owing to
      the inhibition of bone resorption.
    explanation: >-
      Model-organism evidence that bisphosphonate (risedronate) treatment
      improves bone mass in the OASIS-deficient model of OI type XVI.
- name: Orthopedic Surgery and Intramedullary Rodding
  description: >-
    Intramedullary (telescoping) rod fixation and corrective osteotomy stabilize
    fracture-prone, deformed long bones; spinal surgery addresses progressive
    scoliosis. Surgical management is standard in severe OI such as OI type XVI.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Bone Deformity
    description: >-
      Intramedullary rodding provides anatomical alignment and stabilization of
      deformed, fracture-prone long bones.
  - target: Recurrent Fractures
    description: >-
      Internal fixation stabilizes fragile long bones against recurrent
      deforming fractures.
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intramedullary rodding when
      indicated to provide anatomic positioning of limbs
    explanation: >-
      GeneReviews documents intramedullary rodding as standard orthopedic
      management for OI long-bone fractures and deformity, applicable to OI type
      XVI.
- name: Physical Therapy and Rehabilitation
  description: >-
    Physical and occupational therapy increase bone stability, improve mobility
    and muscle strength, and prevent contractures and deformity; early physical
    therapy follows brief post-fracture immobilization.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Recurrent Fractures
    description: >-
      Early post-cast mobilization and guided physical therapy limit
      immobilization osteopenia and improve muscle support around fragile bones.
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fractures are treated with as
      short a period of immobility as is practical, small and lightweight casts, and
      physical therapy as soon as casts are removed
    explanation: >-
      GeneReviews documents early physical therapy and brief immobilization as
      part of standard OI fracture rehabilitation.
animal_models:
- name: OASIS-deficient (Creb3l1-/-) mouse
  species: Mouse
  genotype: Creb3l1-/- (OASIS-/-) constitutive knockout
  publication: PMID:19767743
  description: >-
    Constitutive knockout mice lacking OASIS (Creb3l1-/-) develop severe
    osteopenia, spontaneous fractures, reduced bone-matrix type I collagen, and
    abnormally expanded osteoblast rough endoplasmic reticulum, and show
    trabecular bone improvement upon risedronate treatment.
  modeled_mechanisms:
  - target: Reduced Transcriptional Activation of COL1A1 and Type I Collagen Synthesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      OASIS-/- osteoblasts fail to activate Col1a1 transcription via its
      UPRE-like promoter element, resulting in markedly reduced bone-matrix type
      I collagen and engorged rough ER.
    evidence:
    - reference: PMID:19767743
      reference_title: "Signalling mediated by the endoplasmic reticulum stress transducer OASIS is involved in bone formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we identify the gene for type 1 collagen, Col1a1, as a target of
        OASIS, and demonstrate that OASIS activates the transcription of Col1a1
        through an unfolded protein response element (UPRE)-like sequence in the
        osteoblast-specific Col1a1 promoter region.
      explanation: >-
        Demonstrates that murine OASIS deficiency directly impairs osteoblast
        Col1a1 transcriptional activation.
  - target: Collagen-Poor Bone Matrix, Low Bone Mass, and Skeletal Fragility
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Recapitulates severe osteopenia, collagen-poor bone matrix, spontaneous
      fractures, and antiresorptive response to risedronate.
    evidence:
    - reference: PMID:19767743
      reference_title: "Signalling mediated by the endoplasmic reticulum stress transducer OASIS is involved in bone formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        OASIS(-/-) mice exhibited severe osteopenia, involving a decrease in type
        I collagen in the bone matrix and a decline in the activity of
        osteoblasts, which showed abnormally expanded rough ER, containing of a
        large amount of bone matrix proteins.
      explanation: >-
        Demonstrates severe osteopenia and reduced bone-matrix type I collagen
        in OASIS-/- mice.
    - reference: PMID:29936144
      reference_title: "Homozygosity for CREB3L1 premature stop codon in first case of recessive osteogenesis imperfecta associated with OASIS-deficiency to survive infancy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        OASIS is a transcription factor highly expressed in osteoblasts, and
        OASIS-/- mice exhibit severe osteopenia and spontaneous fractures.
      explanation: >-
        Notes spontaneous fractures alongside severe osteopenia in OASIS-/- mice,
        mirroring human OI type XVI skeletal fragility.

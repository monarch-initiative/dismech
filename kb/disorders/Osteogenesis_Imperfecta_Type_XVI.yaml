progression:
- phase: Perinatal-Lethal to Severe Childhood Course
  age_range: Prenatal and neonatal period to childhood
  notes: >-
    Biallelic CREB3L1 loss-of-function frequently presents with prenatal-onset
    skeletal fragility incompatible with surviving the neonatal period, as
    observed in the initial whole-gene deletion and missense families, though
    survival into childhood with repeated fractures and increasing bone mineral
    density on life-long bisphosphonate therapy has been documented.
  evidence:
  - reference: PMID:29936144
    reference_title: "Homozygosity for CREB3L1 premature stop codon in first case of recessive osteogenesis imperfecta associated with OASIS-deficiency to survive infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Mutations of the endoplasmic reticulum (ER)-stress transducer OASIS
      (encoded by CREB3L1), cause severe recessive osteogenesis imperfecta (OI)
      not compatible with surviving the neonatal period, as has been shown in
      two unrelated families through a whole gene deletion vs. a qualitative
      alteration of OASIS.
    explanation: >-
      Documents neonatal lethality across the first two reported unrelated
      families with biallelic CREB3L1 deficiency, contrasted with childhood
      survival in the reported nonsense-allele patient.
  - reference: PMID:30657919
    reference_title: "A homozygous pathogenic missense variant broadens the phenotypic and mutational spectrum of CREB3L1-related osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a patient with lethal OI, which is located within the highly conserved
      basic leucine zipper domain, four amino acids upstream of the DNA binding
      domain.
    explanation: >-
      Confirms lethal perinatal/neonatal OI presentation in a patient
      homozygous for CREB3L1 p.(Ala304Val).

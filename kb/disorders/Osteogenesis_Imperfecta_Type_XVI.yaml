- name: Reduced Transcriptional Activation of COL1A1 and Type I Collagen Synthesis
  biological_scale: CELLULAR
  description: >-
    OASIS directly activates transcription of the type I collagen gene COL1A1
    through an unfolded protein response element (UPRE)-like sequence in the
    osteoblast-specific Col1a1 promoter and supports COPII-mediated ER-to-Golgi
    secretion (via SEC23A and SEC24D) of bone matrix proteins. When OASIS is lost
    or its DNA-binding/bZIP activity is impaired, COL1A1 transcriptional
    activation and COPII component expression fall, and osteoblasts synthesize
    markedly less type I collagen with pathological rough-ER alterations.

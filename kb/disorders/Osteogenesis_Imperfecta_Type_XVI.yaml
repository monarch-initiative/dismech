- name: Collagen-Poor Bone Matrix, Low Bone Mass, and Skeletal Fragility
  biological_scale: TISSUE
  description: >-
    Reduced osteoblast type I collagen production and glycosaminoglycan secretion
    yield a defective, collagen-deficient bone extracellular matrix with low
    trabecular thickness, reduced mineral apposition rate, hypermineralized
    residual matrix, and impaired mechanical strength, producing very low bone
    mass and extreme skeletal fragility. Clinically this manifests as perinatal
    lethality or severe childhood OI with recurrent fractures, reduced bone
    mineral density, and bone deformity.

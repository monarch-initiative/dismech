- name: Loss of the C-Terminal Effector Domain
  description: >-
    The structural specification of what the disease alleles take away. EPS8's
    barbed-end capping activity resides in its conserved carboxy-terminal effector
    domain, and within that domain capping and bundling are separable: capping by an
    amphipathic helix inserting into the hydrophobic pocket at the filament barbed end,
    bundling by a compact four-helix bundle contacting the filament. A nonsense codon at
    residue 30 of an 822-residue protein removes both.

    This node exists because the separability matters for interpretation rather than for
    these patients: a hypothetical missense allele sparing one activity would be a
    different disease state, and none has been reported.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

variants:
- name: EPS8 c.88C>T p.Gln30*
  description: >-
    The founding DFNB102 allele, homozygous in two Algerian siblings. A nonsense codon
    at residue 30 of an 822 residue protein, so essentially the whole coding sequence
    is lost. It was absent from 120 Algerian normal-hearing controls and from the Exome
    Variant Server.
  variant_type: single nucleotide variant
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:24741995
    reference_title: "EPS8, encoding an actin-binding protein of cochlear hair cell stereocilia, is a new causal gene for autosomal recessive profound deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation predicts a truncated inactive protein or no protein at all."
    explanation: >-
      The authors' reading of the allele's consequence, which is what licenses treating
      the mouse null as the relevant model.
  - reference: PMID:24741995
    reference_title: "EPS8, encoding an actin-binding protein of cochlear hair cell stereocilia, is a new causal gene for autosomal recessive profound deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was not found in 120 Algerian normal hearing control individuals or in the Exome Variant Server database."
    explanation: >-
      Population absence, the frequency argument for pathogenicity in a consanguineous
      family study.
- name: EPS8 c.1435-2A>T in trans with a 65.9 kb intragenic deletion
  description: >-
    A compound-heterozygous genotype in a non-consanguineous Chinese infant that trio
    exome sequencing first read as homozygous for the splice variant. Copy-number
    analysis found a 65.9 kb intragenic deletion covering intron 14 on the maternal
    allele, which explained the apparent homozygosity.

    Recorded because of what it implies for diagnosis rather than for mechanism: a
    DFNB102 genotype can be missed, or mis-assigned as homozygous, by sequencing alone.
  variant_type: deletion
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:34637946
    reference_title: "Apparent homozygosity for a novel splicing variant in EPS8 causes congenital profound hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion is covering intron 14 that could account for the apparent homozygosity of the patient."
    explanation: >-
      The copy-number finding and its diagnostic consequence, in the report that made it.

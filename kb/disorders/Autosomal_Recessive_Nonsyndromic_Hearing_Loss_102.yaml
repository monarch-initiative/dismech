discussions:
- discussion_id: eps8_vestibular_silence_in_humans
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do humans with biallelic EPS8 loss have subclinical vestibular dysfunction, as the
    mouse hair-cell data predict they should, and has anyone looked?
  attaches_to:
  - pathophysiology#Arrested Functional Maturation of Inner Hair Cells
  rationale: >-
    The mouse gives an unusually specific prediction here, and it is a prediction about
    a negative. Eps8-null vestibular hair cells have significantly shorter stereocilia
    but keep a normal basolateral channel pattern and normal voltage responses, and
    the animals show no vestibular deficit. The authors' own explanation is that
    vestibular deficits are sometimes centrally compensated, which is a statement about
    detectability rather than about absence.

    The human side is silent rather than concordant. The founding family is described
    as having isolated deafness, which is the basis for calling the entity
    non-syndromic, but the paper reports no vestibular testing - and a shortened
    vestibular hair bundle that is centrally compensated is exactly what a clinical
    history would miss. So "non-syndromic" here rests on the absence of a reported
    complaint in two individuals, against a model that predicts a measurable
    abnormality with no complaint.

    This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the evidence
    exists and is good; what is open is whether the mouse's compensated-vestibular
    state translates, and the answer would change what a family is told about balance
    and about late vestibular decompensation.
  proposed_experiments:
  - experiment_id: eps8_vestibular_function_testing
    name: Vestibular function testing in EPS8 biallelic carriers
    description: >-
      Video head impulse testing and vestibular evoked myogenic potentials in reported
      EPS8 biallelic individuals, against age-matched deaf controls with a gene
      unrelated to the hair bundle. Central compensation preserves clinical balance but
      not the reflex measurements, so the measurements are where the mouse prediction
      is testable.
    readouts:
    - name: Vestibulo-ocular reflex gain on video head impulse testing
      target: pathophysiology#Arrested Functional Maturation of Inner Hair Cells
      direction: DECREASED
      interpretation: >-
        Reduced gain with no balance complaint would reproduce the mouse's compensated
        state in humans; normal gain would mean the human vestibular system tolerates
        EPS8 loss better than the mouse's does.
    would_support:
    - pathophysiology#Arrested Functional Maturation of Inner Hair Cells
    supporting_outcome:
    - >-
      Reduced vestibulo-ocular reflex gain or absent vestibular evoked myogenic
      potentials in EPS8 biallelic individuals who report no balance symptoms.
    refuting_outcome:
    - >-
      Vestibular reflex measurements indistinguishable from deaf controls, indicating
      the human vestibular system is unaffected rather than compensated.
notes: >-
  Ontology gaps, and where specificity was deliberately not manufactured.

  "Failure of Stereocilia Elongation" binds CL:0000202 auditory hair cell rather than
  the narrower CL:0000589 cochlear inner hair cell or CL:0000601 cochlear outer hair
  cell, because the cited result is explicitly about both types - "both inner and outer
  hair cells from Eps8 knockout (KO) mice showed abnormally short stereocilia". Binding
  either narrow term would assert a cell-type restriction the source denies. The
  maturation node does bind CL:0000589, because there the source restricts it.

  A negative-existence note in an earlier draft of this entry was WRONG and is recorded
  here rather than quietly deleted, because the mistake is the one CLAUDE.md warns about
  by name. The draft said no GO term names "barbed-end actin filament capping", on the
  strength of grepping cache/go/terms.csv and getting no rows. The term exists:
  GO:0051016 barbed-end actin filament capping, confirmed with
  `runoak -i ols:go info GO:0051016` and `runoak -i ols:go search "l~barbed-end actin
  filament capping"`, which also returns the three regulation terms beneath it. The
  cache was empty because nothing in kb/ had bound it yet, and an empty cache is silence,
  not a negative answer - the cache-first contract read backwards. GO:0051016 is now
  bound on the molecular node and on the effector-domain node, where it is the exact
  process the disease alleles remove. The error was caught by the committed
  OpenScientist deep-research report, which named the CURIE.

  The GeneReviews baseline for this disorder is PMID:20301607 Genetic Hearing Loss
  Overview; it is tagged in `references:` and carries no evidence item, because nothing
  in it is quoted. There is no EPS8-specific or DFNB102-specific GeneReviews chapter -
  verified offline against cache/bookshelf/genereviews.csv.
review_notes: >-
  The mouse's extra-auditory phenotype is recorded as a divergence marked IMMATERIAL, and
  the wording there is careful on purpose. Eps8-null mice have 25 percent shorter
  intestinal microvilli with a metabolic phenotype; humans with biallelic EPS8 loss are
  described as having isolated deafness. But "isolated" in those reports means no
  reported syndromic feature in a handful of patients, not a negative metabolic workup -
  nobody has looked. Microvilli and stereocilia are the same kind of actin-cored
  structure, so this is a place where the human silence may be absence of evidence.

  Evidence base. Five pathogenic EPS8 variants had been described by 2023, across
  Algerian, Chinese and Iranian families. The founding family is two siblings with a
  homozygous nonsense allele; the pathograph is carried by mouse and in vitro work
  rather than by the patients. An earlier draft of this entry said "one human family"
  and was corrected after the deep-research report surfaced the later reports - the
  original framing came from reading the founding paper and stopping there.

  Every pathophysiology node below the molecular one is evidenced from mouse or in
  vitro work, and each is graded MODEL_ORGANISM or IN_VITRO accordingly. The only
  HUMAN_CLINICAL evidence in the pathograph is the allele itself and the authors'
  closing inference about sound pressures, which is graded PRIMARY_RESULT but is an
  inference and is flagged as one in its explanation. A reviewer should read the
  mechanism as mouse-derived.

  Two records carry no evidence block, both deliberately and both saying so in their own
  description: the Cochlear implantation treatment, because no publication cited here
  reports implantation outcomes in an EPS8 patient, and the phenotype below.

  One phenotype, Delayed speech and language development, carries no evidence block.
  This is deliberate and is stated in its own description: it is a real consequence of
  prelingual profound deafness and a real causal edge, but no source in this entry
  reports it for an EPS8 patient. The alternatives were to drop a true edge or to cite
  a paper that does not say it. If a reviewer prefers the node removed rather than
  uncited, that is a reasonable call and I will take it.

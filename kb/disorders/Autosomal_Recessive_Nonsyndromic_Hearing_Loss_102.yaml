name: Autosomal Recessive Nonsyndromic Hearing Loss 102
category: Mendelian
creation_date: "2026-09-22T13:20:00Z"
synonyms:
- DFNB102
- deafness, autosomal recessive 102
- autosomal recessive nonsyndromic deafness 102
- EPS8-related nonsyndromic hearing loss
description: >-
  DFNB102 is isolated, profound, congenital sensorineural hearing loss caused by
  biallelic loss of EPS8, the epidermal growth factor receptor pathway substrate 8.
  It was defined in two siblings of consanguineous Algerian parents who carried a
  homozygous nonsense allele, p.Gln30*, found by exome sequencing after the common
  DFNB genes had been excluded. It is very rare: by 2023 only five pathogenic EPS8
  variants had been described, in Algerian, Chinese and Iranian families among others,
  and one of those required copy-number analysis to resolve - an apparently homozygous
  splice variant turned out to be a splice allele in trans with a 65.9 kb intragenic
  deletion.

  **The disease alleles remove the part of the protein that does the work.** EPS8's
  barbed-end capping activity resides in its conserved carboxy-terminal effector domain,
  and structural work separates the two activities within it: bundling through a compact
  four-helix bundle contacting three actin subunits along the filament, capping through
  an amphipathic helix that inserts into the hydrophobic pocket at the barbed end and
  blocks monomer addition. Point mutations can dissociate the two. The DFNB102 alleles
  are truncating or deleting, so both are lost together - which is why this entry has no
  capping-versus-bundling distinction to make at the level of patients, only at the level
  of the protein.

  **EPS8 sets stereocilia length.** Each stereocilium in a hair bundle is a bundle of
  tightly packed, uniformly polarized actin filaments whose growth is regulated at the
  barbed ends, at the stereociliary tip. EPS8 has actin binding, bundling and
  barbed-end capping activities, localizes predominantly to the stereocilia tip, and
  is required for normal elongation. Eps8 knockout mice are profoundly deaf and have
  abnormally short hair bundle stereocilia. The link from allele to phenotype is
  therefore a structural one: the sensory antenna is built too short to detect
  physiological sound pressures.

  **There is a second, non-structural arm, and it is confined to inner hair cells.**
  In Eps8-null mice, inner and outer hair cells both have short stereocilia, but only
  inner hair cells additionally fail to acquire their mature basolateral ion channel
  complement, so they do not complete the transition into functional sensory
  receptors. That is a maturation defect rather than a bundle defect, and it is the
  reason this entry carries two parallel downstream arms from one molecular lesion
  rather than one.

  **Why it is non-syndromic has a mechanistic answer.** EPS8 is expressed in
  vestibular hair cells too, and those cells also have significantly shorter
  stereocilia in the null mouse - yet the mice show no vestibular deficit. The
  difference is that vestibular hair cells keep a normal pattern of basolateral
  voltage-dependent channels and can still respond to a stimulus, where inner hair
  cells lose the ability to synchronize their responses. So the restriction of the
  phenotype to hearing is not "EPS8 is only needed in the cochlea"; it is that the
  same bundle abnormality is functionally tolerated in one organ and not the other.

  **EPS8 is one node of a tip complex, not a solo actor.** It works with MYO15A,
  whirlin and GPSM2-Gai in a tip-complex density that has been reconstituted in vitro
  and behaves as a phase-separated condensate promoting actin bundling; MYO15A
  delivers EPS8 to the tip as cargo, and EPS8 in turn is required to localize
  BAIAP2L2 there. Several of those partners are themselves deafness genes, which is
  the argument for reading DFNB102 as one lesion in a shared machine.

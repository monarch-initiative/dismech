- name: EPS8 as a Node of the Stereocilia Tip Complex
  description: >-
    EPS8 does not act alone at the tip. It is delivered there as cargo of the motor
    protein MYO15A, it is in turn required for BAIAP2L2 to localize at the tips of the
    transducing stereocilia, and reconstituted Whirlin-MYO15-EPS8 assemblies form
    phase-separated condensates that promote actin bundling. Several partners in that
    complex are themselves deafness genes, so DFNB102 is best read as removing one
    component of a shared machine rather than as an isolated gene defect.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: stereocilium tip
    term:
      id: GO:0032426
      label: stereocilium tip
  biological_processes:
  - preferred_term: actin filament bundle assembly
    term:
      id: GO:0051017
      label: actin filament bundle assembly
  downstream:
  - target: Failure of Stereocilia Elongation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Drawn as an indirect link because the complex's role is the context in which the
      elongation failure happens, and the reconstitution work was not done on the
      DFNB102 allele.
  evidence:
  - reference: PMID:33626355
    reference_title: "Phase separation-mediated condensation of Whirlin-Myo15-Eps8 stereocilia tip complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we discover that the specific multivalent interactions among the Whirlin-myosin 15 (Myo15)-Eps8 complex lead to the formation of the TCD-like condensates through liquid-liquid phase separation."
    explanation: >-
      The reconstitution showing EPS8 is one of three components of a condensate, not a
      free protein at the tip.
  - reference: PMID:33626355
    reference_title: "Phase separation-mediated condensation of Whirlin-Myo15-Eps8 stereocilia tip complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The reconstituted TCD-like condensates effectively promote actin bundling."
    explanation: >-
      Connects the complex to the actin activity that the disease lesion removes.
  - reference: PMID:21236676
    reference_title: "Regulation of stereocilia length by myosin XVa and whirlin depends on the actin-regulatory protein Eps8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MyoXVa, whirlin, and Eps8 are integral components of the stereocilia tip complex"
    explanation: >-
      Names the three components of the tip complex and places EPS8 among them, which is
      the basis for reading DFNB102 as one lesion in a shared machine.
  - reference: PMID:33151556
    reference_title: "Loss of Baiap2l2 destabilizes the transducing stereocilia of cochlear hair cells and leads to deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BAIAP2L2 localization to stereocilia tips is dependent on the motor protein MYO15A and its cargo EPS8"
    explanation: >-
      Places EPS8 downstream of MYO15A and upstream of BAIAP2L2 in the delivery
      hierarchy, which is what makes the complex an ordered assembly rather than a list.
phenotypes:
- category: Auditory
  name: Profound congenital sensorineural hearing impairment
  description: >-
    Isolated, profound congenital deafness in both affected siblings of the founding
    family. Profound is the reported severity, and congenital is the reported onset.
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  evidence:
  - reference: PMID:24741995
    reference_title: "EPS8, encoding an actin-binding protein of cochlear hair cell stereocilia, is a new causal gene for autosomal recessive profound deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the study of two siblings born to consanguineous Algerian parents and affected by isolated, profound congenital deafness."
    explanation: >-
      The phenotype as observed in the only reported family: isolated, profound, and
      congenital.
- category: Neurologic
  name: Delayed speech and language development
  description: >-
    Expected downstream of prelingual profound deafness without early intervention.
    This phenotype is recorded WITHOUT evidence because no publication in this entry
    reports speech and language outcomes in an EPS8 patient - the founding family is
    described only as having isolated profound congenital deafness. It is here because
    the causal edge from the hearing node is real and standard, not because a source
    states it for DFNB102.
treatments:
- name: Cochlear implantation
  description: >-
    Prelingual profound sensorineural hearing loss from a hair-bundle lesion is the
    indication cochlear implantation exists for: the sensory transduction step fails
    while the auditory nerve is intact, so direct electrical stimulation bypasses the
    defect. This entry records the intervention without an evidence block, because no
    publication cited here reports implantation outcomes in an EPS8 patient - the
    reported cohorts are genetics papers. It is what these children receive, not
    something a source in this entry demonstrates for them.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  therapeutic_modality: DEVICE
animal_models:
- name: Eps8 knockout mouse
  species: Mouse
  genotype: Eps8 homozygous knockout
  publication: PMID:21526224
  description: >-
    The model that carries this entry's mechanism. Eps8-null mice are profoundly deaf
    with abnormally short stereocilia in both cochlear hair cell types, and inner hair
    cells additionally fail to mature.

    The same animal also has a phenotype with no human counterpart, which is worth
    recording rather than filtering out: reduced body weight, partial resistance to
    diet-induced obesity, improved metabolic status and increased lifespan, correlated
    with about 25 percent shorter intestinal microvilli. Microvilli are actin-cored
    protrusions like stereocilia, so this is the same molecular lesion in a different
    actin-based structure - and it is absent from the human disease, where EPS8 loss
    gives isolated deafness.
  modeled_mechanisms:
  - target: Failure of Stereocilia Elongation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Short stereocilia in both inner and outer hair cells, with profound deafness.
    limitations: >-
      The mouse is a constitutive null and the human founding allele is a nonsense codon
      at residue 30 predicted to give truncated inactive protein or none, so the
      genotypes correspond unusually well here. What does not correspond is the
      extra-auditory phenotype: the mouse has an intestinal and metabolic syndrome that
      humans with biallelic EPS8 loss do not report.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        The null mouse has a 25 percent reduction in intestinal microvilli length with
        an associated metabolic phenotype; human EPS8 disease is isolated deafness.
        Marked IMMATERIAL because it does not bear on this link's claim about
        stereocilia - but it is recorded because a reader should know the model carries
        a phenotype the disease does not, and because microvilli and stereocilia are
        the same kind of structure, which makes the human silence informative rather
        than merely reassuring.
    readouts:
    - name: Stereocilia length in cochlear hair cells
      target: Failure of Stereocilia Elongation
      direction: DECREASED

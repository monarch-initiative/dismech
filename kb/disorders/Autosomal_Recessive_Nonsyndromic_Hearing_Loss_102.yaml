      The structural mechanism of capping, and the basis for treating capping and
      bundling as separable activities of one domain. Note the source's own typo, "a
      amphipathic", is preserved because a snippet quotes rather than corrects.
- name: Failure of Stereocilia Elongation
  description: >-
    Without EPS8 at the barbed ends, the actin core does not reach its normal length.
    Both inner and outer hair cells in the Eps8-null mouse have abnormally short
    stereocilia. This is a failure to build rather than a degeneration: the elongation
    step itself does not complete.

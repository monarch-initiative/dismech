inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic EPS8 loss of function. In the founding family the nonsense allele was
    homozygous in both affected siblings, present heterozygously in both unaffected
    parents and in one unaffected sibling, and absent from two other unaffected
    siblings - the full segregation pattern for a recessive allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24741995
    reference_title: "EPS8, encoding an actin-binding protein of cochlear hair cell stereocilia, is a new causal gene for autosomal recessive profound deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was also present, in the heterozygous state, in one clinically unaffected sibling and in both unaffected parents, and was absent from the other two unaffected siblings."
    explanation: >-
      The segregation data. Heterozygous carriers are unaffected, which is what
      establishes the recessive mode rather than merely being consistent with it.

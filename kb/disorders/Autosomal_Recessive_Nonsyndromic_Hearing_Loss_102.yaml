- name: Arrested Functional Maturation of Inner Hair Cells
  description: >-
    Inner hair cells do not complete the developmental transition into mature sensory
    receptors. They fail to acquire the mature-type basolateral ion channels, and they
    lose the ability to synchronize their responses to a sinusoidal stimulus. This is
    separable from the stereocilia defect: vestibular hair cells in the same animal
    have short stereocilia and a normal basolateral channel pattern.

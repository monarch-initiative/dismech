    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these additional three CASQ2 CPVT families suggest that CASQ2 mutations are more common than previously thought and produce a severe form of CPVT"
    explanation: Supports both the allelic spectrum and the severity of biallelic CASQ2-CPVT.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32693635
    reference_title: An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

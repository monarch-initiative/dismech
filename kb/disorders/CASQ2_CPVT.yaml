prevalence:
- population: Clinically ascertained international CASQ2 families in the 2020 multicenter study
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The study assembled 112 genotype-positive people from 36 families: 24 biallelic and 12 heterozygous probands plus 76 relatives. Not all relatives were phenotype positive, and inclusion permitted variants of uncertain significance. This is a cohort size, not a count of 112 confirmed affected patients or a population-prevalence estimate.
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 112 individuals, including 36 CPVT probands (24 homozygotes/compound heterozygotes and 12 heterozygotes) and 76 family members possessing at least 1 presumed pathogenic CASQ2 variant, were identified."
    explanation: Reports the composition of an ascertained family cohort; no population prevalence can be calculated from it.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
inheritance:
- name: Autosomal Recessive
  description: >-
    The definitive, predominant association is autosomal recessive. Pathogenic variants may be homozygous or compound heterozygous. In the selected 2020 family cohort, 33/34 biallelic carriers were phenotype positive; the remaining four-year-old had Holter monitoring but no exercise test. This age- and ascertainment-dependent observation is not a population penetrance estimate.
  inheritance_term:

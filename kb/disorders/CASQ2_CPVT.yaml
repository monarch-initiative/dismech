- name: Recombinant Candidate Dominant CASQ2 Proteins
  experimental_model_type: OTHER
  publication: PMID:32693635
  description: Purified proteins were examined by turbidity, size-exclusion and structural mapping. Assays identify assembly defects but do not directly model mixed mutant/wild-type filaments in human cardiomyocytes.
  cell_source: Recombinant CASQ2 proteins
  modeled_mechanisms:
  - target: Impaired CASQ2 Filament Assembly
    description: Candidate missense proteins show assay-dependent filamentation defects.
    evidence:
    - reference: PMID:32693635
      reference_title: An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In vitro turbidity assays revealed that p.R33Q and all 6 candidate dominant CASQ2 missense variants evaluated exhibited filamentation defects, but only p.R33Q convincingly failed to dimerize.
      explanation: Purified-protein assembly result.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: MOLECULAR
    limitations: R251H required acidic pH, Y55C showed disulfide-related behavior and W361R could not be expressed. Dominant interference was not directly tested by protein mixing.

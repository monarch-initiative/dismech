- name: Casq2 Null Myocytes for Flecainide Mechanism Dissection
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:33297863
  description: Permeabilized cells, sodium-channel blockade and flecainide analogues separate sodium-channel from RyR2 contributions.
  cell_source: Isolated Casq2-null mouse ventricular myocytes
  modeled_mechanisms:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    description: Flecainide inhibits spontaneous release even without functional sarcolemmal sodium channels.
    evidence:
    - reference: PMID:33297863
      reference_title: RYR2 Channel Inhibition Is the Principal Mechanism of Flecainide Action in CPVT.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In membrane-permeabilized Casq2-/- cardiomyocytes-lacking intact sarcolemma and devoid of sodium channel contribution-flecainide, but not its analogues, suppressed RyR2-mediated Ca release at clinically relevant concentrations.
      explanation: Direct intracellular mechanism experiment.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Demonstrates an independent RyR2 contribution in this assay, not an exclusive mechanism in treated patients.
    fidelity: MODERATE
  notes: ''
- name: Casq2 Null Myocytes for SK and Mitochondrial Studies
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:40438932
  description: Voltage clamp, calcium imaging and mitochondrial assays assess NS309 responses in null ventricular myocytes.
  cell_source: Isolated Casq2-null mouse ventricular myocytes
  modeled_mechanisms:
  - target: Reduced Sarcolemmal SK Current
    description: Reduced current was measured directly by voltage clamp.
    evidence:
    - reference: PMID:40438932
      reference_title: Pharmacological Enhancement of Small Conductance Ca(2+)-Activated K(+) Channels Suppresses Cardiac Arrhythmias in a Mouse Model of Catecholaminergic Polymorphic Ventricular Tachycardia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Voltage-clamp experiments in isolated VMs treated with β-adrenergic agonist isoproterenol showed a reduction of sarcolemmal SK channel current (ISK) density in CPVT VMs.
      explanation: Reduced functional SK current despite increased surface SK3 protein in the detailed study.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Increased surface SK3 protein does not imply increased current; mitochondrial effects complicate drug specificity.
    fidelity: MODERATE
  - target: Increased Mitochondrial Reactive Oxygen Species
    description: NS309 reduces excess mitochondrial ROS.
    evidence:
    - reference: PMID:40438932
      reference_title: Pharmacological Enhancement of Small Conductance Ca(2+)-Activated K(+) Channels Suppresses Cardiac Arrhythmias in a Mouse Model of Catecholaminergic Polymorphic Ventricular Tachycardia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: SK channel enhancement reversed the increased rate of reactive oxygen species production by mitochondria in CPVT VMs.
      explanation: Null-mouse ventricular myocytes show excess mitochondrial ROS, reduced by NS309.
    relationship: RESCUES
    model_scale: CELLULAR
    limitations: Incomplete antagonism by membrane-impermeable apamin suggests a mitochondrial component, but does not genetically isolate it.
    fidelity: MODERATE
  notes: ''
computational_models:
- name: Stochastic CASQ2-Deficient Guinea-Pig Myocyte Simulation
  model_type: PHYSIOLOGICAL
  publication: PMID:36672764
  description: A stochastic local-control ventricular-myocyte model approximates G112+5X-associated changes in CASQ2 buffering and calcium-release-unit parameters. Rapid pacing with adrenergic stimulation produces alternans; a rapid-to-slow transition produces EADs, not a direct experimental demonstration of DADs.
  modeled_mechanisms:
  - target: Reduced Sarcoplasmic Reticulum Calcium Buffering
    description: The model varies luminal-buffer and release parameters to explore instability.
    evidence:
    - reference: PMID:36672764
      reference_title: Pacing Dynamics Determines the Arrhythmogenic Mechanism of the CPVT2-Causing CASQ2(G112+5X) Mutation in a Guinea Pig Ventricular Myocyte Computational Model.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In the simulation studies under rapid pacing (6 Hz), electromechanically concordant cellular alternans appeared under β-adrenergic stimulation in the CPVT mutant but not in the wild-type nor in the non-β-stimulated mutant.
      explanation: Computational alternans under a defined pacing protocol.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Species and parameter assumptions, no modeled calcium-wave propagation, and protocol-dependent EADs limit transfer to human DAD-mediated disease.
    fidelity: MODERATE
- name: Multiscale RyR2 Open- and Closed-Block Model
  model_type: KINETIC
  publication: PMID:42363594
  description: The 2026 dynamic model couples experimentally determined RyR2 gating with SERCA uptake to explain why flecainide and tetracaine can differ despite both inhibiting channels.
  modeled_mechanisms:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    description: Different blocking kinetics produce different steady-state spark and SR-load behavior.
    evidence:
    - reference: PMID:42363594
      reference_title: Different actions of RyR2 open and closed channel block explained by a multiscale Ca(2+) release model.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Acute closed block also decreased spark frequency due to reduced frequency of RyR2 opening. This resulted in a much stronger inhibition of overall spark Ca2+ leak and a larger increase in SR load to achieve a new steady state.
      explanation: A model prediction explaining compensation to closed-channel block.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Permeabilized-cell calcium-release model, not a whole-heart arrhythmia or clinical drug-efficacy trial.
    fidelity: MODERATE

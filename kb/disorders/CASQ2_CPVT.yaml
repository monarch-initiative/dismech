    causal_link_type: DIRECT
- name: Beta-Adrenergic Stimulation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Physical exertion or acute emotional stress produces a catecholamine surge
    that acts on the genetically primed, calsequestrin-deficient calcium-release
    apparatus. Beta-adrenergic signalling increases SR calcium loading and
    phosphorylation of the release machinery, converting a latent instability
    into overt diastolic leak. This node is the therapeutic target of
    beta-blockade, left cardiac sympathetic denervation, and exercise
    restriction.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell

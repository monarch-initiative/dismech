differential_diagnoses:
- name: RYR2-related CPVT (CPVT1)
  disease_term:
    preferred_term: catecholaminergic polymorphic ventricular tachycardia 1
    term:
      id: MONDO:0011484
      label: catecholaminergic polymorphic ventricular tachycardia 1
  description: >-
    Clinically indistinguishable at the bedside: identical exercise-induced
    bidirectional/polymorphic ventricular tachycardia, structurally normal
    heart, and normal resting ECG. RYR2 gain-of-function accounts for the large
    majority of genetically confirmed CPVT. Curated in this knowledge base as
    `RYR2_CPVT`, which also serves as the CPVT umbrella entry.
  distinguishing_features:
  - RYR2-associated CPVT is usually autosomal dominant; the established CASQ2 association is usually recessive.
  - The primary lesion affects the release channel in RYR2 disease and its luminal regulatory protein in CASQ2 disease.
  - Molecular testing and variant-specific interpretation distinguish clinically overlapping forms.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RYR2-, CALM1-, CALM2-, CALM3-, and KCNJ2-related CPVT are inherited in an autosomal dominant manner"
    explanation: Contrasts the dominant inheritance of RYR2-CPVT with the recessive inheritance of CASQ2-CPVT.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: TRDN- and TECRL-related CPVT
  description: >-
    The other autosomal recessive CPVT genes. TRDN encodes triadin, which
    anchors calsequestrin to the RyR2 complex, so triadin loss produces a
    closely related junctional-SR lesion; TECRL-related disease overlaps
    clinically with long QT syndrome.
  distinguishing_features:
  - Molecular genetic testing distinguishes these overlapping recessive calcium-handling disorders.
  - QT prolongation can accompany TECRL- and TRDN-associated disease.
  - TRDN loss may also involve skeletal-muscle weakness.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TECRL- and TRDN-related CPVT are inherited in an autosomal recessive manner"
    explanation: Identifies the other recessive CPVT genes that must be distinguished from CASQ2 by molecular testing.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
discussions:
- discussion_id: gap_intra_sr_calcium_kinetics_casq2
  prompt: >-
    How do allele-specific buffering, release-channel regulation and SR compensation combine to determine spontaneous release?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Sarcoplasmic Reticulum Calcium Buffering
  rationale: >-
    Free luminal calcium has been measured in a heterozygous null model and was unchanged despite increased leak. Complete-null hearts also compensate by increasing SR volume. These observations support a regulatory contribution alongside buffering and leave variant-specific dynamic release thresholds unresolved.
  proposed_experiments:
  - experiment_id: exp_casq2_luminal_calcium_kinetics
    name: Direct luminal calcium kinetics in calsequestrin-deficient cardiomyocytes
    description: >-
      Measure free intra-SR calcium kinetics with a targeted luminal calcium
      sensor in calsequestrin-deficient versus wild-type cardiomyocytes during
      beta-adrenergic stimulation, testing whether free luminal calcium near
      RyR2 rises faster and reaches the spontaneous-release threshold sooner.
    experiment_type:
      preferred_term: luminal sarcoplasmic reticulum calcium imaging experiment
  - experiment_id: exp_casq2_truncating_vs_missense_kinetics
    name: Truncating versus filament-defective CASQ2 allele comparison
    description: >-
      Compare intra-SR calcium kinetics between truncating CASQ2 alleles
      (complete protein loss) and missense alleles that retain protein but
      impair filament assembly, to separate the pure buffering deficit from
      the RyR2-regulatory deficit.
    experiment_type:
      preferred_term: allele-series calcium handling comparison
  evidence:
  - reference: PMID:17656677
    reference_title: Modest reductions of cardiac calsequestrin increase sarcoplasmic reticulum Ca2+ leak independent of luminal Ca2+ and trigger ventricular arrhythmias in mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: SR luminal Ca2+ measured using Mag-Fura-2 was not altered by Casq2 reduction.
    explanation: A measured negative result contradicts a blanket claim that all relevant luminal-calcium measurements are absent.
- discussion_id: mismatch_purkinje_casq2_tissue_origin
  prompt: >-
    How do cardiac conduction-system and working-myocardial contributions to arrhythmia differ between Casq2 mice and human CASQ2 disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Triggered Cardiomyocyte Action Potentials
  - pathophysiology#Sinoatrial Node Dysfunction
  rationale: >-
    The 2018 conditional study found that concurrent loss in the conduction system and working myocardium was needed for CPVT, while conduction-system rescue prevented it. The targeted system includes sinoatrial tissue and is not equivalent to the Purkinje network alone. These mouse results do not establish the tissue origin in genotype-confirmed human CASQ2 disease, and general CPVT mapping studies should not be assumed to be CASQ2-specific.
  proposed_experiments:
  - experiment_id: exp_casq2_human_endocardial_mapping
    name: High-density endocardial mapping in genotyped CASQ2-CPVT patients
    description: >-
      Where electrophysiological mapping is clinically indicated, compare trigger localization in genotype-confirmed CASQ2 cases, separating conduction-system from working-myocardial origins without extrapolating from mixed-genotype CPVT series.
    experiment_type:
      preferred_term: high-density endocardial electroanatomic mapping study
  - experiment_id: exp_casq2_ipsc_conduction_vs_working
    name: CASQ2-mutant iPSC cardiomyocyte lineage comparison
    description: >-
      Compare triggered-activity thresholds in patient-derived CASQ2-mutant
      iPSC cardiomyocytes differentiated toward conduction-system versus
      working-myocardial identity, in a human cellular background.
    experiment_type:
      preferred_term: iPSC-derived cardiomyocyte lineage comparison experiment
  evidence:
  - reference: PMID:29452352
    reference_title: Conditional ablation and conditional rescue models for Casq2 elucidate the role of development and of cell-type specific expression of Casq2 in the CPVT2 phenotype.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Our study shows that the CPVT phenotype is dependent upon concurrent loss of Casq2 function in both the CCS and in working cardiomyocytes. Accordingly, restoration of Casq2 in only the CCS prevents CPVT.
    explanation: The study already performed conduction-system rescue; proposed work must address the remaining human or lineage-specific uncertainty.
- discussion_id: gap_dominant_casq2_prevalence_mechanism
  prompt: >-
    How common are dominant-acting CASQ2 variants, and by what mechanism does a
    single defective allele impair calsequestrin filament function enough to
    cause CPVT?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired CASQ2 Filament Assembly
  - genetic#CASQ2 heterozygous variants
  rationale: >-
    The selected 2020 families and the K180R pedigree support a heterozygous association but do not measure population penetrance. Biochemical filamentation defects do not directly test wild-type/mutant interference, and a corrected K180R iPSC resource is available without reported functional rescue in that resource paper. Variant-specific segregation, isogenic physiology and population ascertainment remain important.
  proposed_experiments:
  - experiment_id: exp_casq2_dominant_allele_penetrance
    name: Population-scale penetrance estimation for candidate dominant CASQ2 alleles
    description: >-
      Ascertain CASQ2 missense carriers at population scale and phenotype them
      by exercise stress testing, to estimate the penetrance of candidate
      dominant-acting alleles independently of clinically ascertained families.
    experiment_type:
      preferred_term: population-scale genotype-first penetrance study
  - experiment_id: exp_casq2_heterozygous_knockin_model
    name: Heterozygous filament-interface CASQ2 knock-in models
    description: >-
      Use isogenic mutant/corrected human cardiomyocytes, including the available K180R control resource, and selected heterozygous knock-in models to distinguish dominant interference from dosage effects under matched maturation and adrenergic protocols.
    experiment_type:
      preferred_term: heterozygous knock-in disease model
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More work is needed to understand the physiological role of calsequestrin in the EC coupling cycle, to determine the prevalence of autosomal-dominant calsequestrin mutations, and to understand how they cause CPVT."
    explanation: The review names the prevalence and mechanism of dominant CASQ2 variants as explicit open questions.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
notes: >-
  This entry represents the CASQ2-specific CPVT2 disease (MONDO:0012762). Most detailed molecular findings derive from mutant proteins, patient-derived cardiomyocytes or engineered mouse models and are not direct measurements in patient hearts. GeneReviews supplies the broader CPVT clinical baseline; the 2025 AHA/ACC statement updates exercise-participation guidance. The 2020 multicenter family cohort is clinically ascertained and includes uncertain variants, so its fractions are not population penetrance. ClinGen distinguishes Definitive recessive validity from Moderate dominant validity. Contemporary human trials with a CASQ2 transgene may target RYR2-associated disease and do not thereby establish eligibility or efficacy in CASQ2-CPVT. The Korean case reporting apparent homozygous Glu74* had a heterozygous father and a variant-negative mother without resolved deletion/UPD/technical testing. The 2026 convulsive-syncope report also contains discordant nucleotide/protein notation. These reports support their observed clinical presentations without establishing the uncertain segregation or exact variant annotation.
clinical_trials:
- name: NCT01117454
  description: Completed randomized placebo-controlled crossover trial of flecainide added to standard beta-blocker therapy. One of 13 treated participants had CASQ2-associated disease; 12 had paired outcome tests. Exercise ectopy improved in the mixed cohort, but the trial did not establish a CASQ2-specific effect or reduction in sudden death.
  phase: NOT_APPLICABLE
  status: COMPLETED
  evidence:
  - reference: clinicaltrials:NCT01117454
    reference_title: A Prospective Randomized Crossover Trial of Oral Flecainide for Catecholaminergic Polymorphic Ventricular Tachycardia
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The purpose of this study is to test whether the addition of oral flecainide to standard therapy will reduce ventricular ectopy on exercise test compared to placebo plus standard therapy in patients with Catecholaminergic Polymorphic Ventricular Tachycardia.
    explanation: Registry describes the add-on trial question.
  - reference: PMID:28492868
    reference_title: 'Efficacy of Flecainide in the Treatment of Catecholaminergic Polymorphic Ventricular Tachycardia: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Putative pathogenic mutations were present in RYR2 in 10 patients and CASQ2 in 1; 2 patients had negative genetic findings.
    explanation: The randomized trial included one CASQ2 participant; the pooled response cannot be interpreted as a CASQ2-specific effect estimate.
  notes: The registry status and eligibility were checked on October 1, 2026. The original ICD-therapy endpoint was replaced with an exercise-ectopy endpoint after recruitment fell short. Contemporary SGT-501 (NCT07148089) and AGP100 (NCT07263139) trials require an RYR2 mutation and are not CASQ2-eligible trials, even though SGT-501 delivers CASQ2.

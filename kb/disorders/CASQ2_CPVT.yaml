- name: Sinoatrial Node Dysfunction
  role: amplifier
  biological_scale: TISSUE
  description: >-
    Calsequestrin deficiency also depresses sinoatrial pacemaker function,
    producing low resting sinus rates. This is not merely a coincidental
    finding: long diastolic intervals give spontaneous SR calcium release time
    to occur before the next beat empties the store, so sinus node dysfunction
    contributes mechanistically to ventricular arrhythmia risk. Selective
    re-expression of Casq2 in the sinoatrial node of adult Casq2-knockout mice
    accelerated sinus rates and prevented CPVT.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DECREASED
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we were able to re-express Casq2 in the SA node of adult Casq2 KO mice, which accelerated sinus heart rates and prevented CPVT"
    explanation: Tissue-targeted rescue in the Casq2-knockout mouse shows the sinoatrial node is causally involved in CPVT2 arrhythmogenesis.
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A likely explanation is that low sinus rates prolong the diastolic interval, allowing the spontaneous SR calcium release to occur before CICR during the next action potential can empty the SR and reset the SR calcium clock."
    explanation: States the proposed mechanism linking bradycardia to increased spontaneous calcium release.
  notes: >-
    Deliberately NOT declared as conforming to
    `cardiac_ion_channel_repolarization#Sinoatrial Node Pacemaker Dysfunction`.
    That module node models loss-of-function pacemaker-current channelopathy
    (HCN4, SCN5A), which is a different mechanism from the
    calsequestrin-dependent sinoatrial depression modelled here.
  downstream:
  - target: Delayed Afterdepolarizations and Triggered Activity
    description: >-
      Slow sinus rates lengthen diastole, giving spontaneous calcium release
      more opportunity to reach the DAD threshold.
    causal_link_type: DIRECT
  - target: Bradycardia
    description: Depressed sinoatrial automaticity produces low resting sinus rates.
    causal_link_type: DIRECT
- name: Atrial Triggered Activity
  role: effector
  biological_scale: TISSUE
  description: >-
    Calcium-triggered activity is not confined to the ventricle. Optical
    mapping of calsequestrin-null mouse atria showed spontaneous calcium
    release events driving atrial DADs and triggered beats, providing a
    mechanistic account of the atrial tachyarrhythmias that frequently precede
    or accompany ventricular tachycardia in CPVT. Human CASQ2-specific
    confirmation of this atrial arm is not yet available, so it is modelled
    here as a mechanism branch rather than asserted as a CPVT2 clinical
    phenotype.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Based on optical mapping data from a calsequestrin null mouse model, the atrial tachyarrhythmias are driven by spontaneous calcium release events in atrial myocardium that cause DADs and atrial triggered beats"
    explanation: Mouse optical-mapping evidence for a calsequestrin-dependent atrial triggered-activity arm.
- name: Bidirectional and Polymorphic Ventricular Tachycardia
  conforms_to: "cardiac_ion_channel_repolarization#Ventricular Tachyarrhythmia"
  role: effector
  biological_scale: ORGANISM
  description: >-
    Triggered beats organise into the hallmark arrhythmia of CPVT: fast
    ventricular tachycardia with a beat-to-beat alternating QRS axis
    (bidirectional VT) that may become polymorphic and degenerate to
    ventricular fibrillation. Onset is reproducibly provoked by exercise or
    emotion and the heart is structurally normal.
  biological_processes:
  - preferred_term: cardiac conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: ABNORMAL
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The underlying cause of these episodes is the onset of fast ventricular tachycardia (bidirectional or polymorphic)."
    explanation: GeneReviews identifies bidirectional or polymorphic VT as the arrhythmia underlying CPVT episodes.
  - reference: PMID:16908766
    reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a child with stress-induced ventricular tachycardia and cardiac arrest"
    explanation: Human CASQ2-mutant case presenting with stress-induced ventricular tachycardia and cardiac arrest.
  downstream:
  - target: Effort-Induced Polymorphic Ventricular Tachycardia
    description: The arrhythmia is reproducibly provoked by exertion or emotional stress.
    causal_link_type: DIRECT
  - target: Bidirectional Ventricular Tachycardia
    description: Alternating-axis QRS complexes during the tachycardia.
    causal_link_type: DIRECT
  - target: Ventricular Fibrillation
    description: Polymorphic ventricular tachycardia may degenerate into ventricular fibrillation.
    causal_link_type: DIRECT
  - target: Syncope and Sudden Cardiac Death
    description: >-
      Sustained ventricular tachyarrhythmia abolishes effective cardiac output.
    causal_link_type: DIRECT
- name: Syncope and Sudden Cardiac Death
  conforms_to: "cardiac_ion_channel_repolarization#Syncope and Sudden Cardiac Death"
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Loss of effective cardiac output during the arrhythmia causes transient
    cerebral hypoperfusion (syncope, sometimes with convulsive features that
    are misdiagnosed as epilepsy) and, if the rhythm does not self-terminate,
    cardiac arrest and sudden death. In the international CASQ2 cohort a
    potentially fatal arrhythmic event occurred at a median age of 7 years in
    biallelic carriers, and homozygote/compound-heterozygote status conferred a
    markedly increased hazard relative to heterozygosity.
  evidence:
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by episodes of syncope, seizures, or sudden death, in response to physical activity or emotional stress"
    explanation: Describes the clinical endpoints of catecholamine-induced polymorphic VT in the families in which CASQ2 was identified.
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "26 of 34 (76.5%) individuals had experienced a potentially fatal arrhythmic event with a median age of onset of 7 years"
    explanation: Quantifies the arrhythmic-event burden and early age of onset in biallelic CASQ2-CPVT.
  downstream:
  - target: Syncope
    description: Transient cerebral hypoperfusion during the arrhythmia causes loss of consciousness.
    causal_link_type: DIRECT
  - target: Convulsive Syncope
    description: >-
      Prolonged cerebral hypoperfusion during an arrhythmic episode can produce
      convulsive movements that are frequently misattributed to a primary
      seizure disorder.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cerebral hypoperfusion
  - target: Cardiac Arrest
    description: A non-terminating ventricular arrhythmia produces cardiac arrest.
    causal_link_type: DIRECT
  - target: Sudden Cardiac Death
    description: Unresuscitated cardiac arrest results in sudden cardiac death.
    causal_link_type: DIRECT
phenotypes:
- category: Cardiovascular
  name: Effort-Induced Polymorphic Ventricular Tachycardia
  description: >-
    The defining phenotype of CPVT2: polymorphic ventricular tachycardia
    reproducibly provoked by exercise or acute emotion in a structurally
    normal heart with a normal resting ECG.
  phenotype_term:
    preferred_term: Effort-induced polymorphic ventricular tachycardia
    term:
      id: HP:0004758
      label: Effort-induced polymorphic ventricular tachycardia
    onset:
      onset_category: JUVENILE
      mean_age_years: 7.0
      notes: >-
        HP:0003621 Juvenile onset spans 5-15 years, which is the band both cited
        figures fall in: the CASQ2-specific cohort reports a median age of onset
        of 7 years, and GeneReviews gives a mean of seven to 12 years. The value
        in mean_age_years is the cohort MEDIAN (7 years, PMID:32693635); the slot
        has no median field, so it is recorded here and disambiguated in this
        note, following the pattern in PARK7-Related_Early-Onset_Parkinson_Disease.
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "26 of 34 (76.5%) individuals had experienced a potentially fatal arrhythmic event with a median age of onset of 7 years"
    explanation: CASQ2-specific source for the childhood onset category and the age-of-onset value on this phenotype.
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CPVT is established in the presence of a structurally normal heart, normal resting EKG, and exercise- or emotion-induced bidirectional or polymorphic ventricular tachycardia"
    explanation: GeneReviews defines exercise- or emotion-induced polymorphic VT as the diagnostic phenotype of CPVT, including its CASQ2 form.
  - reference: PMID:16908766
    reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a child with stress-induced ventricular tachycardia and cardiac arrest"
    explanation: Documents stress-induced ventricular tachycardia in a child carrying a homozygous CASQ2 truncating variant.
- category: Cardiovascular
  name: Bidirectional Ventricular Tachycardia
  description: >-
    Ventricular tachycardia with beat-to-beat alternation of the QRS axis, the
    pattern most characteristic of catecholaminergic calcium-handling
    arrhythmia.
  phenotype_term:
    preferred_term: Bidirectional ventricular tachycardia
    term:
      id: HP:0034040
      label: Bidirectional ventricular tachycardia
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The underlying cause of these episodes is the onset of fast ventricular tachycardia (bidirectional or polymorphic)."
    explanation: GeneReviews identifies bidirectional VT as the arrhythmia underlying CPVT episodes.
- category: Cardiovascular
  name: Syncope
  description: >-
    Transient loss of consciousness during exercise or acute emotion, usually
    the presenting symptom. In the CASQ2 nonsense-mutation families, homozygous
    carriers had syncope before age 7 years while a heterozygous carrier had
    onset from age 11 years, illustrating the genotype-severity gradient.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
    onset:
      onset_category: CHILDHOOD
      notes: >-
        Deliberately CHILDHOOD (1-5 years) rather than JUVENILE, unlike the
        ventricular-tachycardia node above. The syncope evidence is split by
        genotype: homozygotes had syncope "before the age of 7 years" while the
        heterozygote's began "from the age of 11 years". CHILDHOOD is retained
        because it reflects the earlier biallelic presentation, which is the
        severe end this entry is anchored on; the heterozygous onset is later and
        is described in the phenotype text rather than forced into one band.
  evidence:
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients who experienced syncopes before the age of 7 years were homozygous carriers, suggesting a complete absence of calsequestrin 2."
    explanation: Direct CASQ2-specific evidence for early-childhood syncope in biallelic carriers.
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient was heterozygous for the stop codon and experienced syncopes from the age of 11 years."
    explanation: Documents later-onset syncope in a heterozygous CASQ2 carrier.
- category: Cardiovascular
  name: Cardiac Arrest
  description: >-
    Abrupt cessation of effective cardiac output from a sustained ventricular
    arrhythmia. Aborted cardiac arrest is one component of the composite
    arrhythmic endpoint that affected roughly three-quarters of biallelic CASQ2
    carriers in the international cohort.
  phenotype_term:
    preferred_term: Cardiac arrest
    term:
      id: HP:0001695
      label: Cardiac arrest
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased hazard of a composite of cardiac syncope, aborted cardiac arrest, and sudden cardiac death"
    explanation: Aborted cardiac arrest is an explicit component of the arrhythmic endpoint studied in the CASQ2-CPVT cohort.
  - reference: PMID:16908766
    reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a child with stress-induced ventricular tachycardia and cardiac arrest"
    explanation: Cardiac arrest in a child with a homozygous CASQ2 truncating variant.
- category: Cardiovascular
  name: Sudden Cardiac Death
  description: >-
    Unexpected death from a ventricular arrhythmia that does not terminate;
    it may be the first manifestation of CPVT2 and is the endpoint that
    motivates cascade screening of relatives.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by episodes of syncope, seizures, or sudden death, in response to physical activity or emotional stress"
    explanation: Sudden death is part of the presenting spectrum in the families in which CASQ2 was identified.
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased hazard of a composite of cardiac syncope, aborted cardiac arrest, and sudden cardiac death"
    explanation: Sudden cardiac death is an explicit endpoint in the CASQ2-CPVT risk analysis.
- category: Cardiovascular
  name: Ventricular Fibrillation
  description: >-
    Degeneration of polymorphic ventricular tachycardia into disorganised
    fibrillation, the terminal rhythm of a fatal CPVT episode.
  phenotype_term:
    preferred_term: Ventricular fibrillation
    term:
      id: HP:0001663
      label: Ventricular fibrillation
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ventricular tachycardia may degenerate into ventricular fibrillation and cause sudden death if cardiopulmonary resuscitation is not readily available"
    explanation: GeneReviews describes degeneration to ventricular fibrillation as the mechanism of sudden death in CPVT.
- category: Cardiovascular
  name: Bradycardia
  description: >-
    Low resting sinus rate from sinoatrial node dysfunction. In CPVT this is
    not an incidental finding but a mechanistic contributor, because long
    diastolic intervals permit spontaneous SR calcium release.
  phenotype_term:
    preferred_term: Bradycardia
    term:
      id: HP:0001662
      label: Bradycardia
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sinus node dysfunction and bradycardia are well-documented phenotypes of CPVT in humans and in mouse models of CPVT"
    explanation: Review evidence for bradycardia as a documented CPVT phenotype in humans and in the calsequestrin-null mouse model.
  notes: >-
    The cited review statement covers CPVT as a whole rather than CASQ2-CPVT
    specifically; the calsequestrin-specific mechanistic work behind it (the
    sinoatrial Casq2 re-expression rescue) is mouse data, curated on the
    Sinoatrial Node Dysfunction pathophysiology node.
- category: Cardiovascular
  name: Palpitations
  description: >-
    Awareness of rapid or irregular heart action, the mildest symptomatic
    expression of triggered ectopy and often the symptom that precedes more
    severe arrhythmic events.
  phenotype_term:
    preferred_term: Palpitations
    term:
      id: HP:0001962
      label: Palpitations
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms range from palpitations to cardiac arrest"
    explanation: Review evidence placing palpitations at the mild end of the CPVT symptom spectrum.
  notes: >-
    As for Bradycardia, the cited review statement describes CPVT as a whole
    rather than CASQ2-CPVT specifically; no CASQ2-restricted symptom-frequency
    series reports palpitations separately, so no frequency band is asserted.
- category: Neurological
  name: Convulsive Syncope
  description: >-
    Convulsive movements during an arrhythmic syncopal episode. These are
    secondary to cerebral hypoperfusion rather than a primary epileptic
    disorder, but are a recognised cause of misdiagnosis as epilepsy and of
    delayed cardiac evaluation in CPVT.
  evidence:
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by episodes of syncope, seizures, or sudden death, in response to physical activity or emotional stress"
    explanation: Seizure-like episodes are part of the presenting spectrum described in the CASQ2 mapping study.
  notes: >-
    Deliberately left unbound to an HPO term. HPO has no term for convulsive
    (anoxic) syncope: the nearest candidate, HP:0001250 (Seizure), denotes
    abnormal excessive or synchronous neuronal activity, whereas the mechanism
    here is arrhythmic cerebral hypoperfusion with a structurally and
    electrically normal brain. Binding HP:0001250 would over-claim a primary
    epileptic phenotype and would wrongly conflate this with the genuine
    neuronal phenotype reported in some RYR2 variant carriers in `RYR2_CPVT`,
    so no term is asserted rather than a misleading one.
genetic:
- name: CASQ2 biallelic loss-of-function variants
  association: Causative
  subtype: Biallelic CPVT2
  features: >-
    Homozygous or compound heterozygous loss-of-function variants in CASQ2,
    encoding cardiac calsequestrin 2. The originally reported allele is the
    founder p.D307H missense variant, which segregated fully in seven
    consanguineous Israeli Bedouin families; protein-truncating alleles
    (nonsense p.R33X, a 532+1 G>A splice variant, and a 62delA frameshift)
    were subsequently described, as were compound heterozygous combinations of
    a truncating and a missense allele.
  gene_term:
    preferred_term: CASQ2
    term:
      id: hgnc:1513
      label: CASQ2
  evidence:
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation, which is in full segregation in seven Bedouin families affected by the disorder"
    explanation: Establishes full segregation of the founder CASQ2 missense allele with recessive CPVT.
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three mutations, a nonsense R33X, a splicing 532+1 G>A, and a 1-bp deletion, 62delA, are thought to induce premature stop codons."
    explanation: Documents the protein-truncating allelic class in CASQ2-CPVT.
  - reference: PMID:16908766
    reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the first CPVT patient carrier of compound heterozygous CASQ2 mutations"
    explanation: Documents compound heterozygosity as a route to biallelic CASQ2 loss of function.
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these additional three CASQ2 CPVT families suggest that CASQ2 mutations are more common than previously thought and produce a severe form of CPVT"
    explanation: Supports both the allelic spectrum and the severity of biallelic CASQ2-CPVT.
- name: CASQ2 heterozygous dominant-negative missense variants
  association: Causative
  subtype: Heterozygous CPVT2
  features: >-
    A subset of heterozygous CASQ2 missense variants produces a CPVT phenotype.
    Structural mapping onto the calsequestrin filament localised several of
    these to an electronegative pocket required for back-to-back binding of
    calsequestrin dimers, and turbidity assays showed filamentation defects,
    supporting a dominant-negative rather than haploinsufficiency mechanism.
    The recessive p.R33Q allele, by contrast, failed to dimerize at all.
  gene_term:
    preferred_term: CASQ2
    term:
      id: hgnc:1513
      label: CASQ2
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro turbidity assays revealed that p.R33Q and all 6 candidate dominant CASQ2 missense variants evaluated exhibited filamentation defects, but only p.R33Q convincingly failed to dimerize."
    explanation: Biochemical characterisation distinguishing the dominant-negative filamentation defect from complete loss of dimerization.
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structural analysis revealed that 3 of these 6 putative dominant negative missense variants localized to an electronegative pocket considered critical for back-to-back binding of dimers."
    explanation: Structural mapping onto the calsequestrin filament rationalises the dominant-negative mechanism.
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For autosomal-dominant CPVT2, the current hypothesis is that calsequestrin mutations affect the ability for polymerization to occur."
    explanation: Independent review statement of the polymerization-defect hypothesis for dominant CPVT2.
diagnosis:
- name: Exercise stress testing
  description: >-
    Graded treadmill or bicycle exercise testing is the key provocative
    diagnostic test for CPVT2. Ventricular ectopy appears at a reproducible
    heart-rate threshold and progresses to bidirectional and then polymorphic
    ventricular tachycardia as workload increases. It is also the principal
    tool for evaluating at-risk relatives when the familial variant is not
    known, and for titrating therapy.
  results: >-
    Reproducible, rate-dependent ventricular ectopy progressing to
    bidirectional or polymorphic ventricular tachycardia in a structurally
    normal heart supports the diagnosis; a negative test does not exclude
    CPVT2 in a genotype-positive individual.
  diagnosis_term:
    preferred_term: exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all first-degree relatives of an affected individual should be evaluated with resting EKG, Holter monitoring, echocardiography"
    explanation: GeneReviews sets out the evaluation of at-risk relatives, of which exercise stress testing is the central component.
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 of them had ventricular arrhythmias at ECG on exercise tests"
    explanation: CASQ2-specific demonstration that exercise testing unmasks arrhythmia in otherwise asymptomatic heterozygous carriers.
- name: Molecular genetic testing of CASQ2
  description: >-
    Identification of biallelic pathogenic CASQ2 variants establishes the
    diagnosis of CPVT2 and enables cascade testing. Because a subset of
    heterozygous CASQ2 variants is itself arrhythmogenic, heterozygous
    relatives identified by cascade testing require clinical evaluation rather
    than reassurance.
  results: >-
    Biallelic pathogenic CASQ2 variants confirm CPVT2; a single heterozygous
    pathogenic CASQ2 variant is reportable and warrants clinical screening.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a heterozygous pathogenic variant in RYR2, CALM1, CALM2, CALM3, CASQ2, or KCNJ2 or biallelic pathogenic variants in CASQ2, TECRL, or TRDN"
    explanation: GeneReviews lists biallelic CASQ2 variants as diagnostic for CPVT.
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirms that pathogenic heterozygous CASQ2 variants may manifest with a CPVT phenotype, indicating a need to clinically screen these individuals"
    explanation: Sets the screening obligation for heterozygous carriers identified by cascade genetic testing.
- name: Resting ECG and structural cardiac assessment
  description: >-
    The resting 12-lead ECG and echocardiogram are normal in CPVT2 and serve
    to exclude structural heart disease and other channelopathies (notably
    long QT syndrome, in which the resting QTc is prolonged). A normal resting
    study is therefore part of the positive diagnostic criteria rather than
    evidence against the diagnosis.
  results: >-
    Structurally normal heart with a normal resting ECG.
  diagnosis_term:
    preferred_term: resting electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  notes: >-
    The NCIT electrocardiography term covers the resting 12-lead ECG component
    of this assessment; the accompanying echocardiographic exclusion of
    structural heart disease is described in the name and description rather
    than separately coded.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CPVT is established in the presence of a structurally normal heart, normal resting EKG, and exercise- or emotion-induced bidirectional or polymorphic ventricular tachycardia"
    explanation: A structurally normal heart and normal resting ECG are explicit components of the diagnostic criteria.
- name: Longitudinal cardiology surveillance
  description: >-
    Ongoing follow-up rather than a one-off diagnostic act. Review by a
    cardiologist every six to twelve months, with the interval set by disease
    severity, is important throughout growth because rapid weight gain in
    childhood and adolescence means beta-blocker dosing must be adjusted
    continually to stay protective. Serial exercise stress testing is the
    instrument that both monitors control and individualises permitted
    exercise intensity.
  results: >-
    Recurrence or worsening of exercise-induced ectopy on serial testing
    indicates loss of arrhythmia control and prompts dose escalation or
    escalation of therapy.
  diagnosis_term:
    preferred_term: exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up visits with a cardiologist every six to 12 months (depending on disease severity) are very important, especially until puberty, since body weight increases rapidly and drug dosages must be continually adjusted."
    explanation: GeneReviews surveillance recommendation, including the growth-related rationale for continual dose adjustment.
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "allowed exercise intensity should be individualized based on exercise stress test results"
    explanation: Serial exercise stress testing is the basis for individualising activity restriction during surveillance.
treatments:
- name: Nonselective Beta-Blocker Therapy (Nadolol)
  description: >-
    First-line therapy for all clinically or genetically diagnosed CPVT2.
    Nonselective beta-blockers, and nadolol in particular, blunt the
    catecholamine surge that precipitates diastolic calcium leak. Beta-blockade
    is indicated even in genotype-positive individuals with a negative exercise
    stress test, because sudden death can be the first manifestation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nadolol
      term:
        id: CHEBI:7444
        label: nadolol
  target_mechanisms:
  - target: Beta-Adrenergic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Nonselective beta-blockade attenuates the beta-adrenergic drive that
      unmasks the latent calsequestrin-deficient calcium instability.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nadolol is the most effective beta blocker in CPVT"
    explanation: GeneReviews identifies nadolol as the most effective beta blocker in CPVT.
  - reference: PMID:26432584
    reference_title: Nadolol decreases the incidence and severity of ventricular arrhythmias during exercise stress testing compared with beta1-selective beta-blockers in patients with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence and severity of ventricular arrhythmias decreased during treatment with nadolol compared with during treatment with β1-selective β-blockers"
    explanation: Human comparative data supporting nonselective over beta1-selective blockade in CPVT.
  notes: >-
    The nadolol comparative study enrolled a mixed-genotype CPVT cohort rather
    than a CASQ2-only cohort; no CASQ2-restricted randomised comparison exists.
- name: Flecainide
  description: >-
    Add-on antiarrhythmic for breakthrough arrhythmia on maximally tolerated
    beta-blockade, and for primary prevention when beta-blockers alone do not
    suppress exercise-induced ectopy. Flecainide acts on the CPVT2 mechanism
    directly: it blocks RyR2 in the open state, reducing calcium spark mass and
    the probability that sparks propagate into arrhythmogenic calcium waves.
    Notably, the defining mechanistic experiments were performed in
    calsequestrin-null (Casq2-/-) myocytes, making this evidence directly
    relevant to CPVT2 rather than borrowed from RYR2-CPVT.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: flecainide
      term:
        id: CHEBI:75984
        label: flecainide
  target_mechanisms:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    treatment_effect: INHIBITS
    description: >-
      Open-state block of RyR2 reduces calcium spark mass and suppresses the
      propagating diastolic calcium waves that are the central effector of
      CPVT2.
  evidence:
  - reference: PMID:19835880
    reference_title: Flecainide inhibits arrhythmogenic Ca2+ waves by open state block of ryanodine receptor Ca2+ release channels and reduction of Ca2+ spark mass.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "flecainide significantly reduced the amplitude, duration and spatial width of Ca2+ sparks in Casq2-/- myocytes"
    explanation: Demonstrates the spark-mass mechanism of flecainide specifically in calsequestrin-null myocytes.
  - reference: PMID:19835880
    reference_title: Flecainide inhibits arrhythmogenic Ca2+ waves by open state block of ryanodine receptor Ca2+ release channels and reduction of Ca2+ spark mass.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Flecainide induced a sustained decrease in the frequency of spontaneous Ca2+ waves, whereas tetracaine was ineffective"
    explanation: Establishes flecainide efficacy against arrhythmogenic calcium waves in Casq2-null myocytes, and distinguishes it from tetracaine.
  - reference: PMID:19835880
    reference_title: Flecainide inhibits arrhythmogenic Ca2+ waves by open state block of ryanodine receptor Ca2+ release channels and reduction of Ca2+ spark mass.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the drug flecainide inhibits RyR2 channels and prevents CPVT in mice and humans"
    explanation: Summarises the in vivo antiarrhythmic efficacy of flecainide that the cellular experiments in this paper set out to explain.
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flecainide can be added for primary prevention of a cardiac arrest when beta blockers alone cannot control the onset of arrhythmias during an exercise stress test."
    explanation: GeneReviews management guidance for adding flecainide to beta-blockade in CPVT.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Surgical removal of the left stellate ganglion and upper thoracic
    sympathetic ganglia to reduce sympathetic drive to the heart. Reserved for
    breakthrough arrhythmia despite optimal beta-blocker and flecainide
    therapy, or for patients intolerant of pharmacotherapy. It is an adjunct
    rather than a cure: a significant residual arrhythmic burden persists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Beta-Adrenergic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Interrupting left-sided sympathetic input reduces the catecholaminergic
      drive that precipitates the calcium leak and triggered activity.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a significant burden of life-threatening arrhythmias persists after left cardiac sympathetic denervation"
    explanation: GeneReviews recognises LCSD as a CPVT intervention while documenting the residual arrhythmic burden.
- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    Device therapy for patients whose arrhythmias are not adequately controlled
    by drug therapy, and for survivors of cardiac arrest. Programming must be
    conservative: an inappropriate or painful shock triggers its own
    catecholamine surge and can precipitate an arrhythmic storm in CPVT.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an implantable cardioverter defibrillator is effective for those individuals in whom arrhythmias are not adequately controlled by drug therapy"
    explanation: GeneReviews management guidance for ICD implantation in CPVT.
- name: Exercise Restriction and Trigger Avoidance
  description: >-
    Avoidance of competitive sports and strenuous exercise, and of digitalis,
    is a cornerstone of CPVT management because these are the precipitants of
    the adrenergic surge that unmasks the arrhythmia. Permitted exercise
    intensity should be individualised on the basis of exercise stress testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: exercise restriction and trigger avoidance
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Beta-Adrenergic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Avoiding the precipitating exertional and emotional triggers reduces the
      catecholamine surges that unmask the calcium instability.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Competitive sports and other strenuous exercise; use of digitalis."
    explanation: GeneReviews lists competitive sports, strenuous exercise, and digitalis as agents and circumstances to avoid in CPVT.
- name: Genetic Counseling and Cascade Family Screening
  description: >-
    Because CPVT2 is usually recessive, sibling recurrence risk is 25% and both
    parents are obligate heterozygotes; but because some heterozygous CASQ2
    variants are themselves arrhythmogenic, heterozygous relatives should be
    clinically screened rather than reassured. Counselling therefore differs
    substantively from the dominant RYR2 form curated in `RYR2_CPVT`.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of inheriting biallelic pathogenic variants and being affected"
    explanation: GeneReviews recurrence risk for the recessive CASQ2 form, the basis of counselling.
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical screening is indicated accordingly in individuals who are heterozygous for a CASQ2 pathogenic variant"
    explanation: GeneReviews requires clinical screening of CASQ2 heterozygotes, a CASQ2-specific counselling point.
differential_diagnoses:
- name: RYR2-related CPVT (CPVT1)
  disease_term:
    preferred_term: catecholaminergic polymorphic ventricular tachycardia 1
    term:
      id: MONDO:0011484
      label: catecholaminergic polymorphic ventricular tachycardia 1
  description: >-
    Clinically indistinguishable at the bedside: identical exercise-induced
    bidirectional/polymorphic ventricular tachycardia, structurally normal
    heart, and normal resting ECG. RYR2 gain-of-function accounts for the large
    majority of genetically confirmed CPVT. Curated in this knowledge base as
    `RYR2_CPVT`, which also serves as the CPVT umbrella entry.
  distinguishing_features:
  - Autosomal dominant rather than autosomal recessive inheritance
  - Gain-of-function variant in the RyR2 release channel itself rather than loss
    of the luminal calcium buffer calsequestrin 2
  - Unaffected relatives are typically variant-negative rather than obligate
    heterozygous carriers
  - Some RYR2 variant carriers show extra-cardiac neurological features
    (epilepsy, neurodevelopmental delay) that are not a feature of CPVT2
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RYR2-, CALM1-, CALM2-, CALM3-, and KCNJ2-related CPVT are inherited in an autosomal dominant manner"
    explanation: Contrasts the dominant inheritance of RYR2-CPVT with the recessive inheritance of CASQ2-CPVT.
- name: TRDN- and TECRL-related CPVT
  description: >-
    The other autosomal recessive CPVT genes. TRDN encodes triadin, which
    anchors calsequestrin to the RyR2 complex, so triadin loss produces a
    closely related junctional-SR lesion; TECRL-related disease overlaps
    clinically with long QT syndrome.
  distinguishing_features:
  - Distinguished from CPVT2 only by molecular genetic testing
  - TECRL carriers often show QT prolongation, which is absent in CPVT2
  - TRDN loss can be accompanied by T-wave inversion, QT prolongation, and mild
    skeletal muscle weakness
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TECRL- and TRDN-related CPVT are inherited in an autosomal recessive manner"
    explanation: Identifies the other recessive CPVT genes that must be distinguished from CASQ2 by molecular testing.
discussions:
- discussion_id: gap_intra_sr_calcium_kinetics_casq2
  prompt: >-
    Does loss of calsequestrin actually accelerate the rise of free intra-SR
    calcium near RyR2, as the accepted buffering model of CPVT2 predicts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Sarcoplasmic Reticulum Calcium Buffering
  rationale: >-
    The buffering model is the standard mechanistic account of CPVT2 and the
    justification for treating CASQ2 loss as functionally equivalent to a
    RyR2 gain-of-function lesion, but the key predicted intermediate has never
    been measured directly. Without it, the alternative account (that
    calsequestrin loss acts principally by destabilising RyR2 regulation
    through the triadin/junctin anchor) cannot be excluded, and the two
    predict different responses to therapies that modulate SR load.
  proposed_experiments:
  - experiment_id: exp_casq2_luminal_calcium_kinetics
    name: Direct luminal calcium kinetics in calsequestrin-deficient cardiomyocytes
    description: >-
      Measure free intra-SR calcium kinetics with a targeted luminal calcium
      sensor in calsequestrin-deficient versus wild-type cardiomyocytes during
      beta-adrenergic stimulation, testing whether free luminal calcium near
      RyR2 rises faster and reaches the spontaneous-release threshold sooner.
    experiment_type:
      preferred_term: luminal sarcoplasmic reticulum calcium imaging experiment
  - experiment_id: exp_casq2_truncating_vs_missense_kinetics
    name: Truncating versus filament-defective CASQ2 allele comparison
    description: >-
      Compare intra-SR calcium kinetics between truncating CASQ2 alleles
      (complete protein loss) and missense alleles that retain protein but
      impair filament assembly, to separate the pure buffering deficit from
      the RyR2-regulatory deficit.
    experiment_type:
      preferred_term: allele-series calcium handling comparison
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although intra-SR calcium kinetics have not yet been measured experimentally in calsequestrin CPVT models"
    explanation: The review states explicitly that the predicted intermediate of the buffering model has not been measured.
- discussion_id: mismatch_purkinje_casq2_tissue_origin
  prompt: >-
    Does the failure of Purkinje-restricted calsequestrin deletion to produce
    CPVT in mice mean that human CASQ2-CPVT arrhythmia originates in the
    working ventricular myocardium rather than the conduction system?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Delayed Afterdepolarizations and Triggered Activity
  rationale: >-
    Clinical mapping in CPVT patients localises most ventricular ectopy to the
    outflow tracts, and the bidirectional-VT pattern has classically been
    attributed to alternating activation of the His-Purkinje system. Yet
    tissue-targeted deletion of calsequestrin in the murine Purkinje network,
    where the molecular lesion of CPVT2 is exactly reproduced, failed to
    generate the phenotype. This is a model-fidelity question rather than a
    simple absence of evidence: the murine conduction system differs in size,
    source-sink relationships, and Purkinje distribution from the human heart,
    so a negative mouse result may not transfer. Resolving it matters because
    ablation strategies targeting Purkinje triggers presuppose the conduction
    system is the source.
  proposed_experiments:
  - experiment_id: exp_casq2_purkinje_rescue_sufficiency
    name: Purkinje-restricted calsequestrin rescue in the Casq2-null mouse
    description: >-
      Perform tissue-targeted calsequestrin re-expression (rather than
      deletion) restricted to the murine Purkinje network in an otherwise
      Casq2-null background, testing sufficiency of the conduction system as
      well as necessity.
    experiment_type:
      preferred_term: conditional tissue-restricted gene rescue experiment
  - experiment_id: exp_casq2_human_endocardial_mapping
    name: High-density endocardial mapping in genotyped CASQ2-CPVT patients
    description: >-
      Map arrhythmia origin at high density in genotype-confirmed human
      CASQ2-CPVT patients during provoked ectopy, distinguishing Purkinje from
      working-myocardial trigger sites.
    experiment_type:
      preferred_term: high-density endocardial electroanatomic mapping study
  - experiment_id: exp_casq2_ipsc_conduction_vs_working
    name: CASQ2-mutant iPSC cardiomyocyte lineage comparison
    description: >-
      Compare triggered-activity thresholds in patient-derived CASQ2-mutant
      iPSC cardiomyocytes differentiated toward conduction-system versus
      working-myocardial identity, in a human cellular background.
    experiment_type:
      preferred_term: iPSC-derived cardiomyocyte lineage comparison experiment
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the deletion of calsequestrin in the Purkinje network did not produce a CPVT phenotype"
    explanation: The negative tissue-targeted mouse result that creates the mismatch with the human mapping data.
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More research with tissue-targeted genetic models such as those in Fig. 5 is needed to determine the tissue origin of CPVT"
    explanation: The review states the tissue origin of CPVT remains unresolved.
- discussion_id: gap_dominant_casq2_prevalence_mechanism
  prompt: >-
    How common are dominant-acting CASQ2 variants, and by what mechanism does a
    single defective allele impair calsequestrin filament function enough to
    cause CPVT?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#CASQ2 Loss of Function
  rationale: >-
    CPVT2 was defined for two decades as a recessive disease, and heterozygous
    relatives were routinely reassured. The demonstration that a third of
    clinically evaluated CASQ2 heterozygotes met CPVT criteria, and that
    specific missense alleles disrupt dimer-dimer filament contacts, inverts
    that counselling posture. But the population frequency of dominant-acting
    alleles is unknown, no in vivo model of the dominant-negative mechanism has
    been reported, and it is unclear which biochemical assay best predicts
    which heterozygous variants confer risk. This directly affects variant
    interpretation and cascade-screening policy.
  proposed_experiments:
  - experiment_id: exp_casq2_dominant_allele_penetrance
    name: Population-scale penetrance estimation for candidate dominant CASQ2 alleles
    description: >-
      Ascertain CASQ2 missense carriers at population scale and phenotype them
      by exercise stress testing, to estimate the penetrance of candidate
      dominant-acting alleles independently of clinically ascertained families.
    experiment_type:
      preferred_term: population-scale genotype-first penetrance study
  - experiment_id: exp_casq2_heterozygous_knockin_model
    name: Heterozygous filament-interface CASQ2 knock-in models
    description: >-
      Generate heterozygous knock-in mouse and human iPSC-cardiomyocyte models
      of filament-interface CASQ2 missense variants to test the
      dominant-negative mechanism in vivo and in a human cellular background.
    experiment_type:
      preferred_term: heterozygous knock-in disease model
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More work is needed to understand the physiological role of calsequestrin in the EC coupling cycle, to determine the prevalence of autosomal-dominant calsequestrin mutations, and to understand how they cause CPVT."
    explanation: The review names the prevalence and mechanism of dominant CASQ2 variants as explicit open questions.
notes: >-
  Scope and relationship to `RYR2_CPVT`. This entry is the gene-specific CPVT2
  (CASQ2, MONDO:0012762) entity. `RYR2_CPVT` is keyed to the CPVT umbrella term
  MONDO:0017990 and carries the disease-level gene spectrum, including a CASQ2
  trigger node and a CASQ2 genetic row. That overlap is deliberate: the
  umbrella entry needs the full gene spectrum to be coherent, while CPVT2
  warrants its own entry because inheritance, molecular lesion, natural
  history, and counselling all differ. The two entries should be kept
  consistent; the CASQ2-specific mechanism, subtypes, and evidence are curated
  here, and general CPVT epidemiology remains on the umbrella entry.

  Module conformance. Five nodes declare conformance to
  `cardiac_ion_channel_repolarization`. The module is framed around
  repolarization and action-potential duration, which is NOT how CPVT2 works:
  the resting ECG and action-potential duration are normal. Conformance was
  therefore claimed only where the module node genuinely covers the CPVT2
  physiology - the module trigger node explicitly admits calcium-handling
  variants, its central-effector node explicitly covers ryanodine-receptor
  calcium leak, and its substrate node explicitly covers delayed
  afterdepolarizations. No conformance is claimed for any repolarization,
  APD-dispersion, or early-afterdepolarization aspect of the module, and the
  module Sinoatrial Node Pacemaker Dysfunction node was deliberately NOT
  claimed by the Sinoatrial Node Dysfunction node here, because that module
  node models loss-of-function pacemaker-current channelopathy (HCN4, SCN5A),
  a different mechanism from the calsequestrin-dependent sinoatrial depression
  seen in CPVT2.

  Evidence boundaries. Care was taken not to let RYR2-CPVT literature stand in
  for CASQ2 evidence. Where a cited source speaks about CPVT in general rather
  than CPVT2 specifically (the GeneReviews management statements, the nadolol
  comparative study, and the review statement on bradycardia), that is stated
  in the relevant notes or explanation. The flecainide mechanistic evidence is
  CASQ2-specific because the defining experiments used Casq2-null myocytes.

  Not curated, and why. (1) No ClinGen gene-disease validity assertion is
  cited: the pinned ClinGen gene_validity.csv snapshot failed its manifest
  checksum on refresh during this curation session, and hand-editing the
  reference cache is prohibited. (2) No Orphanet record is cited because no
  ORPHA cache file for CPVT exists in this repository. (3) No `frequency:` band
  is asserted on any phenotype: the available CASQ2-specific numbers (97.1%
  penetrance, 76.5% arrhythmic events, 33.3% of heterozygotes meeting criteria)
  attach to penetrance and to a composite endpoint rather than to any single
  HPO phenotype, and per the frequency-evidence guidelines it is better to omit
  the band than to back-derive it. (4) Atrial fibrillation is modelled as a
  mechanism branch (`Atrial Triggered Activity`) rather than a CPVT2 phenotype,
  because the only calsequestrin-specific evidence is mouse optical mapping.
  (5) No clinical trials are listed; there are no CASQ2-restricted
  interventional trials.

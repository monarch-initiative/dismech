name: CASQ2 CPVT
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Catecholaminergic polymorphic ventricular tachycardia 2 (CPVT2) is the
  CASQ2-related form of CPVT: a calcium-handling cardiac channelopathy in which
  loss of cardiac calsequestrin 2, the high-capacity luminal calcium buffer of
  the junctional sarcoplasmic reticulum (SR), destabilises SR calcium storage
  and RyR2 gating. Under beta-adrenergic stimulation (exercise or acute
  emotion), diastolic SR calcium leak produces cytosolic calcium overload,
  delayed afterdepolarizations (DADs) and triggered beats, manifesting as
  bidirectional or polymorphic ventricular tachycardia, syncope, and sudden
  cardiac death in a structurally normal heart with a normal resting ECG.
  CPVT2 is classically autosomal recessive (biallelic nonsense, frameshift,
  splice or missense CASQ2 variants; the founder p.D307H missense allele was
  mapped in consanguineous Israeli Bedouin families), but an international
  multicenter study has since shown that certain heterozygous missense variants
  that disrupt calsequestrin filament assembly can produce a CPVT phenotype
  through a dominant-negative mechanism.

  Scope and lump-vs-split: this entry is the gene-specific CPVT2 entity
  (MONDO:0012762, CASQ2). It is deliberately kept SEPARATE from the existing
  `RYR2_CPVT` entry, which is keyed to the CPVT umbrella term MONDO:0017990
  and models the dominant RYR2 gain-of-function form (CPVT1, about 95% of
  genetically confirmed CPVT) together with the disease-level gene spectrum.
  The split is justified because CPVT2 differs from CPVT1 in mode of
  inheritance (recessive vs dominant), in the molecular lesion (loss of a
  luminal calcium buffer vs gain of function in the release channel itself),
  and in genetic-counselling and cascade-screening implications, even though
  both converge on the same diastolic SR calcium leak. Cross-reference
  `RYR2_CPVT` for the umbrella CPVT view and the other CPVT genes (TRDN,
  TECRL, CALM1/2/3).
synonyms:

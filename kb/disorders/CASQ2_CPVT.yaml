- name: Cytosolic Calcium Overload
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Excess cytosolic calcium during diastole is extruded by the sodium-calcium
    exchanger (NCX) operating in forward mode, which moves three sodium ions
    inward for each calcium ion removed. The resulting net inward (depolarizing)
    current is the electrogenic bridge between the calcium disturbance and the
    electrical disturbance.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: calcium ion transport
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: INCREASED

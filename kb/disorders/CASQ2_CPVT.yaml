treatments:
- name: Nonselective Beta-Blocker Therapy (Nadolol)
  description: >-
    Nonselective beta-blockade, commonly nadolol or propranolol, is first-line therapy for clinically affected CPVT and for established disease genotypes assessed by a specialist. It attenuates cardiac adrenergic receptor signaling rather than the catecholamine surge. Dose, adherence, bradycardia and exercise-test response require monitoring. The 2020 CASQ2 family study does not mandate treatment of every phenotype-negative heterozygous carrier.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nadolol
      term:
        id: CHEBI:7444
        label: nadolol
  target_mechanisms:
  - target: Beta-Adrenergic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Nonselective beta-blockade attenuates the beta-adrenergic drive that
      unmasks the latent calsequestrin-deficient calcium instability.
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "nadolol is the most effective beta blocker in CPVT"
    explanation: GeneReviews identifies nadolol as the most effective beta blocker in CPVT.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:26432584
    reference_title: Nadolol decreases the incidence and severity of ventricular arrhythmias during exercise stress testing compared with beta1-selective beta-blockers in patients with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence and severity of ventricular arrhythmias decreased during treatment with nadolol compared with during treatment with β1-selective β-blockers"
    explanation: Human comparative data supporting nonselective over beta1-selective blockade in CPVT.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  notes: >-
    The comparative nadolol study had 34 participants, 30 with RYR2 variants; it does not provide a CASQ2-specific randomized comparison. General genotype-positive guidance should not automatically classify every heterozygous CASQ2 VUS as disease.
- name: Flecainide
  description: >-
    Flecainide added to beta-blockade suppresses exercise-induced ventricular arrhythmias in CASQ2-associated CPVT, but residual clinical events can occur despite a normal exercise test. It blocks cardiac sodium channels and, in CASQ2-model experiments, inhibits RyR2-mediated release. The relative contribution of these mechanisms in patients is not established by isolated-cell or mouse experiments.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: flecainide
      term:
        id: CHEBI:75984
        label: flecainide
  target_mechanisms:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    treatment_effect: INHIBITS
    description: >-
      Flecainide reduces the propagation of spontaneous calcium waves in null myocytes; spark mass falls while spark frequency can rise, so net SR leak and SR content need not decrease.
  - target: Triggered Cardiomyocyte Action Potentials
    treatment_effect: INHIBITS
    description: Sodium-channel block reduces excitation; CASQ2-model experiments support an additional contribution from RyR2 block.
  evidence:
  - reference: PMID:19835880
    reference_title: Flecainide inhibits arrhythmogenic Ca2+ waves by open state block of ryanodine receptor Ca2+ release channels and reduction of Ca2+ spark mass.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "flecainide significantly reduced the amplitude, duration and spatial width of Ca2+ sparks in Casq2-/- myocytes"
    explanation: Demonstrates the spark-mass mechanism of flecainide specifically in calsequestrin-null myocytes.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

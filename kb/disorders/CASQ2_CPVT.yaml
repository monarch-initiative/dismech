prevalence:
- population: International multicenter CASQ2-CPVT cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists for CPVT2 specifically. The
    largest assembled series to date is the international multicenter CASQ2-CPVT
    collaboration, which identified 112 individuals (36 CPVT probands plus 76
    genotype-positive family members) across contributing centres worldwide.
    Population prevalence of CPVT as a whole (all genes) is estimated at
    1:5,000 to 1:10,000 and is curated on the umbrella `RYR2_CPVT` entry;
    CASQ2 accounts for only a small minority of genetically confirmed CPVT.
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 112 individuals, including 36 CPVT probands (24 homozygotes/compound heterozygotes and 12 heterozygotes) and 76 family members possessing at least 1 presumed pathogenic CASQ2 variant, were identified."
    explanation: Quantifies the size of the largest assembled CASQ2-CPVT case series, the best available proxy for CPVT2 occurrence.
inheritance:
- name: Autosomal Recessive
  description: >-
    The classic and predominant mode of inheritance for CASQ2-related CPVT.
    Affected individuals carry biallelic (homozygous or compound heterozygous)
    loss-of-function CASQ2 variants; the founder p.D307H missense allele
    segregated fully in seven consanguineous Israeli Bedouin families, and
    nonsense/frameshift/splice alleles were subsequently reported in unrelated
    families. Clinical penetrance among biallelic carriers is near-complete.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance_percentage: '97.1'
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CASQ2-related CPVT is typically inherited in an autosomal recessive manner"
    explanation: GeneReviews states that CASQ2-related CPVT is typically autosomal recessive.
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a missense mutation in a highly conserved region of the calsequestrin 2 gene (CASQ2) as the potential cause of the autosomal recessive form"
    explanation: The original CASQ2 mapping study established the recessive mode of inheritance for CPVT2.
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among CASQ2 homozygotes and compound heterozygotes, clinical penetrance was 97.1%"
    explanation: Quantifies near-complete clinical penetrance among biallelic CASQ2 carriers, the source of the penetrance_percentage value.
- name: Autosomal Dominant
  description: >-
    An emerging, variant-specific dominant arm. A subset of heterozygous CASQ2
    missense variants localised to the dimer-dimer interface of the
    calsequestrin filament behave as dominant negatives and can manifest a CPVT
    phenotype; in the international multicenter cohort a third of clinically
    evaluated heterozygous relatives met diagnostic criteria for CPVT. This is
    a per-variant property rather than a property of CASQ2 as a whole, so
    CPVT2 should not be reclassified wholesale as a dominant disorder, but
    heterozygotes warrant clinical screening.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-one of 66 CASQ2 heterozygous family members had undergone clinical evaluation, and 17 of 51 (33.3%) met diagnostic criteria for CPVT."
    explanation: Directly quantifies the CPVT phenotype among CASQ2 heterozygotes, supporting a dominant arm for some variants.
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A dominant mode of inheritance appears intrinsic to certain missense variants because of their location and function within the CASQ2 filament structure."
    explanation: States that dominance is a property of specific missense variants rather than of the gene as a whole.
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "because a subset of individuals (still unquantified but rare) with heterozygous CASQ2 pathogenic variants show a mild CPVT phenotype, autosomal dominant inheritance may not be ruled out for CASQ2-related CPVT"
    explanation: GeneReviews explicitly leaves autosomal dominant inheritance open for CASQ2-related CPVT.

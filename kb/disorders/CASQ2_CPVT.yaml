    evidence_source: IN_VITRO
    snippet: "the 2 CASQ2 mutations identified in CPVT create distinct abnormalities that lead to abnormal intracellular calcium regulation, thus facilitating the development of tachyarrhythmias"
    explanation: Links the CASQ2-driven intracellular calcium disturbance to arrhythmia facilitation.
  notes: >-
    The forward-mode sodium-calcium-exchanger step is textbook cardiac
    electrophysiology and is not separately evidenced with a CASQ2-specific
    citation; the CASQ2-specific evidence sits on the flanking nodes (calcium
    leak upstream, delayed afterdepolarizations downstream).
  downstream:
  - target: Delayed Afterdepolarizations and Triggered Activity
    description: >-
      The inward NCX current depolarizes the membrane after repolarization is
      complete, producing delayed afterdepolarizations.
    causal_link_type: DIRECT
- name: Delayed Afterdepolarizations and Triggered Activity
  conforms_to: "cardiac_ion_channel_repolarization#Arrhythmogenic Substrate and Triggered Activity"
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Delayed afterdepolarizations (DADs) that reach action-potential threshold
    generate premature, non-driven beats (triggered activity). In CPVT2 these
    have been demonstrated directly in CASQ2-mutant myocytes exposed to
    isoproterenol and in calsequestrin-null mouse myocytes. Note that this node
    is a DAD/triggered-activity node, not an early-afterdepolarization or
    repolarization-dispersion node: CPVT2 is a calcium-handling disease with a
    normal resting ECG and normal action-potential duration, so only the
    calcium-leak arm of the module substrate node applies.

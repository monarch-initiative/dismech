genetic:
- name: CASQ2 biallelic loss-of-function variants
  subtype: Biallelic CPVT2
  features: >-
    Biallelic pathogenic missense, stop-gain, splice-site and small frameshift-deletion variants cause recessive CPVT. The D307H founder segregated in seven related Bedouin families, not seven independent alleles. Protein loss and abnormal function vary by allele; early reports predicted absence from truncation rather than measuring protein in every patient. The combined 2020 cohort/literature catalogue included 55 presumed culprit variants: 22 missense, 32 truncating (10 nonsense, 13 splice site/region and nine frameshift), and one large deletion. The large deletion expands the reported physical variant spectrum beyond the point mutations and small coding deletion modeled explicitly.
  gene_term:
    preferred_term: CASQ2
    term:
      id: hgnc:1513
      label: CASQ2
  evidence:
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation, which is in full segregation in seven Bedouin families affected by the disorder"
    explanation: Establishes full segregation of the founder CASQ2 missense allele with recessive CPVT.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three mutations, a nonsense R33X, a splicing 532+1 G>A, and a 1-bp deletion, 62delA, are thought to induce premature stop codons."
    explanation: Documents the protein-truncating allelic class in CASQ2-CPVT.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:16908766
    reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the first CPVT patient carrier of compound heterozygous CASQ2 mutations"
    explanation: Documents compound heterozygosity as a route to biallelic CASQ2 loss of function.
    quote_role: PRIMARY_RESULT

has_subtypes:
- name: Biallelic CPVT2
  display_name: Biallelic (recessive) CASQ2-CPVT
  description: >-
    Biallelic pathogenic CASQ2 variants produce the established recessive form, with substantial childhood arrhythmic risk. The 2020 cohort recorded a composite first arrhythmic event in 26/34 carriers at median age seven; this is neither a mean age of ventricular-tachycardia onset nor a population risk.
  genes:
  - preferred_term: CASQ2
    term:
      id: hgnc:1513
      label: CASQ2
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "26 of 34 (76.5%) individuals had experienced a potentially fatal arrhythmic event with a median age of onset of 7 years"
    explanation: Characterises the arrhythmic burden and early onset of the biallelic subtype.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Heterozygous CPVT2
  display_name: Putative heterozygous CASQ2-associated CPVT
  description: >-
    CPVT has been reported with selected heterozygous CASQ2 variants. The association is less secure than the recessive form and is not invariably mild: heterozygous probands can have severe events. Risk in screened relatives was lower than in biallelic relatives, but variant-specific penetrance and mechanisms remain unresolved.
  genes:
  - preferred_term: CASQ2
    term:
      id: hgnc:1513
      label: CASQ2
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirms that pathogenic heterozygous CASQ2 variants may manifest with a CPVT phenotype, indicating a need to clinically screen these individuals"
    explanation: Supports clinical evaluation of heterozygous relatives, without upgrading every allele to a dominant cause.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

    snippet: 55 presumed culprit CASQ2 variants were identified, including 22 missense, 32 truncating (10 nonsense, 13 splice site/region, and 9 frameshift), and 1 large deletion
    explanation: Combined clinical/literature variant catalogue; includes a large deletion without implying all catalogued variants have identical pathogenic certainty.

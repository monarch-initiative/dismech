- name: G112+5X and L167H Expression in Rat Myocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:16908766
  description: Expression of two mutant proteins distinguishes calcium binding from effective store capacity.
  cell_source: Rat cardiomyocytes expressing mutant CASQ2
  modeled_mechanisms:
  - target: Reduced Sarcoplasmic Reticulum Calcium Buffering
    description: Both variants reduce calcium-storing capacity despite differing calcium-binding effects.
    evidence:
    - reference: PMID:16908766
      reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: When expressed in rat myocytes, both mutants decreased the sarcoplasmic reticulum Ca2+-storing capacity
      explanation: Mutant expression perturbs SR storage.
    relationship: PERTURBS
    model_scale: CELLULAR
    limitations: Heterologous expression and dosage may differ from patient cardiomyocytes; normal binding by L167H excludes universal binding loss as an explanation.

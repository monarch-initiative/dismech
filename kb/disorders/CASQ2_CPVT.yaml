- name: Reduced CASQ2 Protein Abundance
  description: Reduced functional calsequestrin abundance removes both a luminal calcium buffer and a regulator of the junctional release complex. Some missense alleles destabilize protein despite preserved transcript; truncating variants need not share the same degradation pathway. The decreased calcium-binding annotation refers to the smaller protein pool, not an intrinsic binding defect in every remaining mutant molecule.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:42770222
    reference_title: Calpain-Dependent Protein Degradation Contributes to CASQ2-R33Q CPVT.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Inhibition of the proteasome or autophagy in neonatal cardiomyocytes and adult mice partially restored CASQ2 but not TRDN levels, suggesting distinct degradation mechanisms.
    explanation: R33Q protein loss is partly reversible through different proteolytic pathways; this finding is model and allele specific.
  - reference: PMID:32902830
    reference_title: 'Molecular adaptation to calsequestrin 2 (CASQ2) point mutations leading to catecholaminergic polymorphic ventricular tachycardia (CPVT): comparative analysis of R33Q and D307H mutants.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we confirmed the drastic reduction of expression of D307H CASQ2, as compared to control (14.4 ± 1.5%, p < 0.005)
    explanation: Direct protein depletion in the young D307H knock-in heart, independent of the R33Q degradation experiment.

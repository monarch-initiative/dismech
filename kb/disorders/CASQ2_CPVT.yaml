- name: Autosomal Dominant
  description: >-
    A heterozygous, variant-dependent association is supported at Moderate ClinGen validity. In the 2020 cohort, 17/51 evaluated heterozygous relatives met study CPVT criteria, but only four had polymorphic or bidirectional ventricular tachycardia. These selected families cannot estimate population penetrance. Candidate variants include missense and truncating/splice alleles; biochemical filamentation defects do not by themselves prove dominant interference. Clinical screening is warranted, while a heterozygous genotype alone should not automatically establish CPVT or mandate treatment in a phenotype-negative relative.
  inheritance_term:

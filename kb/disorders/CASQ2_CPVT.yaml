  evidence:
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CASQ2 protein serves as the major Ca(2+) reservoir within the SR of cardiac myocytes and is part of a protein complex that contains the ryanodine receptor"
    explanation: Establishes calsequestrin 2 as the SR luminal calcium reservoir within the RyR2 release complex, the protein lost in CPVT2.
  - reference: PMID:11704930
    reference_title: A missense mutation in a highly conserved region of CASQ2 is associated with autosomal recessive catecholamine-induced polymorphic ventricular tachycardia in Bedouin families from Israel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "converts a negatively charged aspartic acid into a positively charged histidine, in a highly negatively charged domain, and is likely to exert its deleterious effect by disrupting Ca(2+) binding"
    explanation: Describes the molecular consequence of the founder p.D307H missense allele on calcium binding.
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first nonsense mutations in the cardiac calsequestrin gene, CASQ2, in three CPVT families."
    explanation: Documents protein-truncating CASQ2 alleles as a distinct class of CPVT2 lesion.
  downstream:
  - target: Reduced Sarcoplasmic Reticulum Calcium Buffering
    description: >-
      Loss or functional impairment of calsequestrin 2 removes the
      high-capacity luminal calcium buffer of the junctional SR.
    causal_link_type: DIRECT
  - target: Destabilized RyR2 Closed State
    description: >-
      Because calsequestrin is anchored to RyR2 by triadin and junctin and
      contributes to luminal regulation of the release channel, its loss also
      destabilises RyR2 gating independently of the buffering deficit.
    causal_link_type: DIRECT
- name: Reduced Sarcoplasmic Reticulum Calcium Buffering
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Without functional calsequestrin, the junctional SR loses its low-affinity,
    high-capacity calcium sink. Free intra-SR calcium therefore rises much
    faster during refilling, and the calcium-release refractory period is
    shortened. In vitro expression of CPVT2 mutants in myocytes reduces SR
    calcium-storing capacity, and Casq2-null hearts compensate anatomically
    (increased SR volume, loss of triadin-1 and junctin) yet remain functionally
    unstable.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: sarcoplasmic reticulum calcium ion transport
    term:
      id: GO:0070296
      label: sarcoplasmic reticulum calcium ion transport
    modifier: DYSREGULATED
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:
  - reference: PMID:16908766
    reference_title: Clinical phenotype and functional characterization of CASQ2 mutations associated with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When expressed in rat myocytes, both mutants decreased the sarcoplasmic reticulum Ca2+-storing capacity"
    explanation: Direct in-vitro demonstration that CPVT2-causing CASQ2 mutants reduce SR calcium-storing capacity.
  - reference: PMID:16932808
    reference_title: "Casq2 deletion causes sarcoplasmic reticulum volume increase, premature Ca2+ release, and catecholaminergic polymorphic ventricular tachycardia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mice exhibited striking increases in SR volume and near absence of the Casq2-binding proteins triadin-1 and junctin"
    explanation: The Casq2-null mouse shows the structural and complex-composition remodelling that accompanies loss of the luminal buffer.
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "there is extensive evidence that absence of calsequestrin in mice leads to hyperactive RyR2 channels, impaired calcium-release termination, a shortened calcium release refractory period, and enhanced spontaneous release of calcium"
    explanation: Review summary of the mechanistic consequences of calsequestrin loss, framed as the accepted model for CPVT2.
  downstream:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    description: >-
      Impaired luminal buffering allows free intra-SR calcium near RyR2 to rise
      rapidly during diastole, lowering the threshold for spontaneous release.
    causal_link_type: DIRECT
  - target: Sinoatrial Node Dysfunction
    description: >-
      The same calsequestrin deficit acts in sinoatrial pacemaker tissue,
      depressing sinus rate; this is the bradyarrhythmic branch of CPVT2.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Destabilized RyR2 Closed State
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Calsequestrin loss renders RyR2 hyperactive and impairs termination of
    calcium release, so the channel spends more time open during diastole than
    it should. This is mechanistically distinct from CPVT1, in which the RyR2
    channel itself carries the gain-of-function lesion, but the two converge on
    the same release-channel behaviour.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:

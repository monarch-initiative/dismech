- name: CASQ2 heterozygous variants
  subtype: Heterozygous CPVT2
  features: >-
    Selected heterozygous missense and truncating/splice variants occur in CPVT families. K180R segregated with a phenotype in a small ascertained pedigree, while the 2020 multicenter cohort also included uncertain variants. Dominant-negative filament interference is proposed for some missense variants but has not been established for all reported alleles. The 2020 study found a collective gnomAD allele frequency of 0.0997% for presumed culprit variants and 0.049% for truncating variants. Its estimated carrier prevalence was at least 398-fold greater than expected CASQ2-CPVT prevalence, supporting incomplete penetrance and/or uncertain variant attribution rather than a penetrance estimate for any particular allele.
  gene_term:
    preferred_term: CASQ2
    term:
      id: hgnc:1513
      label: CASQ2
  evidence:
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty-one of 66 CASQ2 heterozygous family members had undergone clinical evaluation, and 17 of 51 (33.3%) met diagnostic criteria for CPVT."
    explanation: The 17/51 result is from clinically ascertained families and is not general penetrance of CASQ2 heterozygosity.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:27157848
    reference_title: A novel heterozygous mutation in cardiac calsequestrin causes autosomal dominant catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Exome sequencing identified a novel heterozygous missense variant in CASQ2 (Lys180Arg) affecting a highly conserved residue, which cosegregated with disease and was absent in unaffected family members.
    explanation: Segregation in the K180R pedigree supports an allele-specific association; the abstract death count includes an ungenotyped motor-vehicle-accident death and is not used as a confirmed CASQ2 death count.
  - reference: PMID:32693635
    reference_title: An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the collective prevalence of presumed pathogenic CASQ2 variants in gnomAD is at least 398-fold greater than the expected prevalence of CASQ2-CPVT

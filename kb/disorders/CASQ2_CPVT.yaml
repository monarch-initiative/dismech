diagnosis:
- name: Exercise stress testing
  description: >-
    Supervised exercise testing is the principal provocative test, assessing progressively complex ventricular ectopy and bidirectional or polymorphic tachycardia. Results also guide treatment and activity advice. A normal resting ECG or brief Holter does not exclude disease, and a young child unable to exercise may not have been adequately challenged.
  results: >-
    Exercise-related complex ventricular ectopy in an otherwise compatible cardiac assessment supports CPVT. A negative test does not establish zero future risk or complete protection on treatment.
  diagnosis_term:
    preferred_term: exercise cardiac stress test
    term:
      id: NCIT:C168192
      label: Exercise Cardiac Stress Test
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1289/?report=reader
    reference_title: Catecholaminergic Polymorphic Ventricular Tachycardia - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The exercise stress test is the single most important diagnostic test.
    explanation: Expert guidance supports provocative exercise testing rather than relying on a normal resting ECG or Holter.
  - reference: PMID:12386154
    reference_title: Absence of calsequestrin 2 causes severe forms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2 of them had ventricular arrhythmias at ECG on exercise tests"
    explanation: CASQ2-specific demonstration that exercise testing unmasks arrhythmia in otherwise asymptomatic heterozygous carriers.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Molecular genetic testing of CASQ2
  description: >-
    Biallelic pathogenic CASQ2 variants support the established recessive diagnosis. A single heterozygous finding requires phenotype, segregation and variant-level assessment because the dominant association has Moderate validity. Apparent homozygosity should be checked against parental results; discordance may require investigation for an undetected deletion, uniparental disomy or technical allele dropout.
  results: >-
    Distinguish pathogenic/likely pathogenic variants from VUS, verify phase or apparent homozygosity where possible, and clinically evaluate heterozygous relatives without equating carrier status with a confirmed dominant diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301466
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a heterozygous pathogenic variant in RYR2, CALM1, CALM2, CALM3, CASQ2, or KCNJ2 or biallelic pathogenic variants in CASQ2, TECRL, or TRDN"
    explanation: GeneReviews lists biallelic CASQ2 variants and selected heterozygous variants; the latter require interpretation in light of weaker gene-validity evidence.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:32693635
    reference_title: "An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirms that pathogenic heterozygous CASQ2 variants may manifest with a CPVT phenotype, indicating a need to clinically screen these individuals"
    explanation: Sets the screening obligation for heterozygous carriers identified by cascade genetic testing.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

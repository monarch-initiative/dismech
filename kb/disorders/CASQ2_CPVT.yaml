- name: Heterozygous CPVT2
  display_name: Heterozygous (dominant-negative) CASQ2-CPVT
  description: >-
    A milder, variant-specific dominant form caused by single heterozygous
    CASQ2 missense alleles that impair filament assembly. Arrhythmic risk is
    substantially lower than in biallelic carriers but is not negligible, so
    heterozygous relatives require clinical evaluation rather than reassurance.
  genes:
  - preferred_term: CASQ2
    term:
      id: hgnc:1513

    supports: SUPPORT
    evidence_source: OTHER
    snippet: "missense mutations (e.g. R33Q) may alter calsequestrin interaction with RyR2 in addition to reducing calcium buffering"
    explanation: Supports a direct RyR2-regulatory arm of CASQ2 pathogenesis beyond the buffering deficit.
  downstream:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak

- name: Impaired CASQ2 Filament Assembly
  description: Some pathogenic or candidate missense proteins show abnormal dimerization or higher-order filamentation. In 2020 assays five of six candidate dominant proteins were abnormal at pH 7.4, whereas R251H required pH 5.6. Five retained near-wild-type dimerization; Y55C showed a partly reversible disulfide-related abnormality. Dominant interference in mixed wild-type/mutant complexes is inferred rather than directly demonstrated.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32693635
    reference_title: An International Multicenter Evaluation of Inheritance Patterns, Arrhythmic Risks, and Underlying Mechanisms of CASQ2-Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In vitro turbidity assays revealed that p.R33Q and all 6 candidate dominant CASQ2 missense variants evaluated exhibited filamentation defects, but only p.R33Q convincingly failed to dimerize.
    explanation: Assay-specific assembly defects support a biochemical phenotype, with the pH and protein-mixing limitations described above.
  downstream:
  - target: Destabilized RyR2 Closed State
    description: Altered calsequestrin assembly may disrupt its regulation of the release complex.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced Sarcoplasmic Reticulum Calcium Buffering
    description: Abnormal assembly can impair effective store capacity, although calcium binding is not reduced by every missense allele.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Sarcoplasmic Reticulum Calcium Buffering
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Loss of the calsequestrin calcium-binding pool reduces luminal buffering, but total SR content is partially preserved by structural compensation. In rat myocytes both G112+5X and L167H reduce store capacity, although L167H retains normal calcium binding. Buffering loss is therefore not the only route to abnormal release. Free luminal calcium, release threshold and total store content are distinct measurements.
  cell_types:

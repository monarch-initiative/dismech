    reference_title: Generation of an isogenic CRISPR/Cas9-corrected control induced pluripotent stem cell line from a patient with autosomal dominant catecholaminergic polymorphic ventricular tachycardia with a heterozygous variant in cardiac calsequestrin-2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT

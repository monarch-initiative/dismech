- name: Diastolic Sarcoplasmic Reticulum Calcium Leak
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The convergent central effector of CPVT2: spontaneous, premature calcium
    release from the sarcoplasmic reticulum during diastole. In
    calsequestrin-deficient myocytes exposed to catecholamines, spontaneous
    releases propagate as calcium waves ahead of the next paced beat. This is
    the identical central effector on which the RYR2, TRDN, TECRL and
    CALM1/2/3 forms of CPVT converge (see `RYR2_CPVT`), reached here from a
    luminal-buffering rather than a release-channel lesion.

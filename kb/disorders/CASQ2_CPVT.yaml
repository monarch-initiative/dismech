  description: >-
    The classic recessive form. Homozygous or compound heterozygous
    loss-of-function CASQ2 variants abolish or severely reduce functional
    calsequestrin 2. Penetrance is near-complete, arrhythmic events begin in
    early childhood, and the median age of the first potentially fatal
    arrhythmic event is 7 years.

name: CASQ2 CPVT
creation_date: '2026-07-31T00:00:00Z'
description: >-
  CASQ2-related catecholaminergic polymorphic ventricular tachycardia (CPVT2) is a cardiac calcium-handling disorder, usually caused by biallelic pathogenic CASQ2 variants. Reduced calsequestrin abundance or altered protein assembly disrupts sarcoplasmic-reticulum calcium buffering and regulation of RyR2-mediated release. Adrenergic stress promotes spontaneous diastolic calcium release, delayed afterdepolarizations and triggered ventricular arrhythmias, which can cause syncope, cardiac arrest or sudden death despite a usually structurally normal heart. The recessive gene–disease association is definitive. A variant-dependent heterozygous association has moderate ClinGen validity; a dominant-negative mechanism remains a hypothesis for selected missense alleles rather than an established property of every heterozygous CASQ2 variant.

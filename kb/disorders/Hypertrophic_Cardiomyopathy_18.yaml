pathophysiology:
- name: PLN L39X Truncating Variant
  description: >-
    The best-characterised CMH18 lesion is the heterozygous nonsense allele
    c.116T>G, p.Leu39Ter (L39X, L39stop), which truncates phospholamban within
    its second transmembrane segment. Expressed in cells, the truncated protein
    is barely detectable, does not inhibit SERCA2a, and is misrouted away from
    the sarcoplasmic reticulum when it is made; co-expression with wild-type
    phospholamban shows no dominant-negative effect. A heterozygote therefore
    carries roughly half the normal amount of functional phospholamban.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    gene:
      preferred_term: PLN
      term:
        id: hgnc:9080
        label: PLN
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Nonsense allele c.116T>G, p.Leu39Ter. Loss of function is shown
      biochemically and by absent protein in a homozygous explanted heart;
      haploinsufficiency in heterozygotes is inferred from the absence of a
      dominant-negative effect.

discussions:
- discussion_id: pln_null_mouse_human_hypertrophy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does partial or complete loss of phospholamban produce hypertrophy and
    later dilatation in humans when total loss in the mouse produces a
    lifelong hypercontractile heart without hypertrophy or failure?
  attaches_to:
  - pathophysiology#Enhanced Sarcoplasmic Reticulum Calcium Uptake and Contractility
  - pathophysiology#Cardiomyocyte Hypertrophic Remodeling
  - animal_models#Mouse
  rationale: >-
    The mouse evidence is abundant and points the other way: Pln-null mice are
    hypercontractile, tolerate it into old age, and were once taken as a model
    for phospholamban suppression as heart-failure therapy. The human L39X
    carriers instead develop hypertrophy (heterozygotes) or lethal dilated
    cardiomyopathy (homozygotes). The causal chain in this entry therefore
    passes through a hypercontractility node shown only in the mouse and a
    hypertrophy step shown only in humans. No heterozygous Pln model and no
    patient-derived or isogenic L39X iPSC cardiomyocyte has been studied for
    hypertrophic signalling.
  evidence:
  - reference: PMID:12639993
    reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to reported benefits of PLN ablation in mouse heart failure, humans lacking PLN develop lethal dilated cardiomyopathy."
    explanation: Explicit statement of the species divergence.
  - reference: PMID:8062415
    reference_title: "Targeted ablation of the phospholamban gene is associated with markedly enhanced myocardial contractility and loss of beta-agonist stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phospholamban-deficient mice showed no gross developmental abnormalities but exhibited enhanced myocardial performance without changes in heart rate."
    explanation: The mouse side of the mismatch.
- discussion_id: pln_dosage_direction_in_hcm
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do HCM-associated PLN alleles that should lower phospholamban (L39X,
    -42C>G) and one that should raise it (-77A>G) really converge on
    hypertrophy, and if so through what common step?
  attaches_to:
  - pathophysiology#PLN L39X Truncating Variant
  - pathophysiology#PLN Promoter Variant Altering Phospholamban Expression
  rationale: >-
    The truncating allele and the -42C>G promoter variant reduce functional
    phospholamban, whereas the -77A>G promoter variant increases promoter
    activity, which would strengthen SERCA2a inhibition. Each promoter
    variant rests on one proband or family and reporter assays in non-human
    or non-cardiac cells, and none has been shown to change phospholamban
    protein in human heart. ClinGen states that the specific genetic
    mechanism of PLN cardiomyopathy is unclear. Either the promoter variants
    are not causal, or PLN-related hypertrophy is a response to disturbed
    calcium regulation in either direction; current data cannot separate
    these.
  evidence:
  - reference: PMID:12705874
    reference_title: "Mutation of the phospholamban promoter associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using neonatal rat cardiomyocytes, the mutation, -77A-->G, increased the phospholamban promoter activity."
    explanation: The gain-of-expression direction.
  - reference: PMID:16829191
    reference_title: "Mutational screening of phospholamban gene in hypertrophic and idiopathic dilated cardiomyopathy and functional study of the PLN -42 C>G mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation decreased phospholamban promoter activity by 43% and 47%, in C6 and C2C12 cell lines respectively."
    explanation: The loss-of-expression direction.
  - reference: CGGV:assertion_f49f65fb-a2df-4e86-9a89-da2325b207c8-2021-02-12T170000.000Z
    reference_title: "PLN / intrinsic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "While the distinct genetic mechanism of PLN-mediated cardiomyopathy is unclear, the overall disease mechanism for PLN associated cardiomyopathy is dysregulation of SERCA2 function, Ca2+ handling, and disrupted relaxation and contraction of the heart."
    explanation: ClinGen's own acknowledgement that the genetic mechanism is unresolved.
- discussion_id: pln_hcm_atrial_fibrillation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Is atrial fibrillation a specific feature of PLN-related HCM, and by what mechanism?
  attaches_to:
  - phenotypes#Atrial fibrillation
  rationale: >-
    All four PLN-HCM probands reported by 2011 had atrial fibrillation,
    against 21% in the general Mayo HCM cohort, but four late-diagnosed cases
    are too few to separate a gene effect from age, left atrial enlargement or
    ascertainment. No study has examined atrial calcium handling in PLN
    variant carriers, so the phenotype is left unconnected to the mechanism
    chain.
  evidence:
  - reference: PMID:21167350
    reference_title: "PLN-encoded phospholamban mutation in a large cohort of hypertrophic cardiomyopathy cases: summary of the literature and implications for genetic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Again, further studies are required to elucidate any potential association between PLN function and atrial fibrillation."
    explanation: The authors flag the association as unexplained.
notes: >-
  GeneReviews: no PLN- or CMH18-specific chapter exists. The Nonsyndromic
  Hypertrophic Cardiomyopathy Overview (PMID:20301725) covers HCM generally
  and is tagged in references without evidence items. The clinical picture
  of CMH18 rests on four probands with HCM (two L39X, two promoter variants),
  the Mayo L39X pedigree and the two Athens L39stop kindreds, so
  symptoms and arrhythmias recorded here are single-case observations and no
  frequency bands are assigned. The p.Arg14del and p.Arg9Cys alleles cause
  dilated and arrhythmogenic cardiomyopathy through different mechanisms
  (SERCA2a superinhibition and protein kinase A trapping) and are curated in
  Dilated_Cardiomyopathy_1P, not here. No genotype-specific outcome data or
  trials exist for CMH18; management follows general HCM guidelines.
  Sudden cardiac death is not curated as a phenotype because no PLN-HCM
  carrier with sudden death is reported; the Mayo proband had no family
  history of it.

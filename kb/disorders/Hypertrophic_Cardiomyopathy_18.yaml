name: Hypertrophic Cardiomyopathy 18
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
synonyms:
- CMH18
- cardiomyopathy, hypertrophic, 18
- cardiomyopathy, familial hypertrophic, 18
- hypertrophic cardiomyopathy type 18
- PLN-related hypertrophic cardiomyopathy
description: >-
  Hypertrophic cardiomyopathy 18 (CMH18) is the PLN-attributed member of the
  numbered familial hypertrophic cardiomyopathy series. PLN encodes
  phospholamban, a 52-amino-acid sarcoplasmic reticulum membrane protein that
  restrains the cardiac calcium pump SERCA2a until protein kinase A or CaMKII
  phosphorylation releases it. The lesion therefore sits in calcium reuptake,
  the relaxation arm of excitation-contraction coupling, rather than in the
  sarcomere, which makes CMH18 one of the rare non-sarcomeric, calcium-handling
  forms of HCM.

  The hypertrophic presentation rests on a small number of families. The
  truncating p.Leu39Ter (L39X, L39stop) allele is a functional null.
  Heterozygous carriers in North American and Australian HCM families and in
  two kindreds studied in Athens developed left ventricular hypertrophy, with
  preserved systolic function where it was measured, and in the one pedigree
  studied for it the allele cosegregated with HCM with incomplete penetrance.
  Seven further HCM probands carried rare promoter variants absent from
  controls; the two tested in reporter assays raise (-77A>G) or lower
  (-42C>G) PLN promoter activity. Across six screened HCM cohorts PLN accounts
  for roughly 0.65% of probands. The four reported probands were diagnosed
  between 51 and 67 years, all with atrial fibrillation, although one carrier
  child was affected at 3 years. The same L39X allele causes
  lethal dilated cardiomyopathy in homozygotes, and some heterozygotes also
  develop dilated cardiomyopathy, so CMH18 is allelic with dilated
  cardiomyopathy 1P (curated separately as Dilated_Cardiomyopathy_1P); ClinGen
  merges both into a single PLN-related intrinsic cardiomyopathy. Why loss of
  phospholamban, which makes the mouse heart hypercontractile without
  hypertrophy, produces hypertrophy in humans is not established.

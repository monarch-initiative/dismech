genetic:
- name: PLN
  gene_term:
    preferred_term: PLN
    term:
      id: hgnc:9080
      label: PLN
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PLN (6q22.31) has a single coding exon encoding the 52-amino-acid
    phospholamban. relationship_type is CAUSATIVE on HCM-specific evidence:
    a heterozygous truncating allele cosegregates with HCM in a
    multigenerational family and was found independently in a second familial
    HCM cohort; heterozygotes in the original L39stop kindreds were
    hypertrophic; and in a large HCM case-series burden analysis PLN rare
    variation showed a Bonferroni-significant excess over ExAC reference
    samples. The
    attributable share is small (about 0.65% of probands). ClinGen has no
    PLN record filed against hypertrophic cardiomyopathy or against
    MONDO:0013475. Its Hypertrophic Cardiomyopathy Gene Curation Expert Panel
    lumped CMH18 (MIM 613874) with dilated cardiomyopathy 1P (MIM 609909) and
    classified PLN as Definitive (autosomal dominant) for intrinsic
    cardiomyopathy, MONDO:0000591. That is a broader disease concept than this
    entry, so it is cited as evidence and deliberately not recorded in
    gene_disease_validity; the 2024 expert-panel reappraisal kept the same
    lumped Definitive call. The Definitive tier rests largely on dilated and
    arrhythmogenic PLN disease (p.Arg14del, p.Arg9Cys), whose mechanisms
    differ from the hypertrophic L39X and promoter alleles curated here.
    Separately, ClinGen rates PLN Moderate for arrhythmogenic right
    ventricular cardiomyopathy, a different disease.
  variants:
  - name: PLN p.Leu39Ter
    description: >-
      c.116T>G (T116G), p.Leu39Ter, also written L39X or L39stop. Nonsense
      allele truncating phospholamban in transmembrane domain II; a functional
      null with no dominant-negative effect. Reported heterozygous in HCM
      probands from North America (Mayo Clinic) and Australia and in two
      kindreds studied in Athens, where heterozygotes were hypertrophic or, in one
      kindred, dilated, and homozygotes had lethal dilated cardiomyopathy.
      Absent from 600 reference alleles in the Mayo study. Landstrom et al.
      describe position 39 as a possible relative mutational hot spot.
    clinical_significance: PATHOGENIC
    type: nonsense
    evidence:
    - reference: PMID:21167350
      reference_title: "PLN-encoded phospholamban mutation in a large cohort of hypertrophic cardiomyopathy cases: summary of the literature and implications for genetic testing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation was absent in 600 reference alleles (200 African American, 400 Caucasian American)."
      explanation: Absence from controls in the Mayo study.
  - name: PLN promoter -77A>G
    description: >-
      Heterozygous A-to-G change 77 bp upstream of the transcription start
      site, in one Japanese woman with familial HCM diagnosed at 56 with
      paroxysmal atrial fibrillation; absent from 296 controls and raised
      promoter activity in neonatal rat cardiomyocytes. Pathogenicity is not
      established.
    type: promoter
    evidence:
    - reference: PMID:12705874
      reference_title: "Mutation of the phospholamban promoter associated with hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This nucleotide change was not found in 296 control subjects."
      explanation: Absence from controls.
  - name: PLN promoter -42C>G
    description: >-
      Promoter variant in one Spanish family with late-onset benign apical
      HCM, including a healthy adult carrier; lowered promoter activity in
      reporter assays. Pathogenicity is not established.
    type: promoter
    evidence:
    - reference: PMID:16829191
      reference_title: "Mutational screening of phospholamban gene in hypertrophic and idiopathic dilated cardiomyopathy and functional study of the PLN -42 C>G mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The PLN -42 C>G mutation is associated with a benign form of apical hypertrophic cardiomyopathy in this family, though the presence of a healthy adult carrier suggests that other genetic and environmental factors could be involved."
      explanation: Family-level association with incomplete penetrance.
  case_fractions:

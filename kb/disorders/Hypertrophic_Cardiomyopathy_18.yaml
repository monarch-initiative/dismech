animal_models:
- name: Pln-null mouse
  species: Mouse
  genotype: Pln-/- (targeted germline ablation)
  publication: PMID:8062415
  description: >-
    Phospholamban-deficient mice develop normally, with faster relaxation,
    higher +/-dP/dt and raised SERCA calcium affinity, reaching baseline
    values equal to those of maximally beta-stimulated wild-type hearts. They
    do not develop hypertrophy or failure, unlike human L39X carriers.
  modeled_mechanisms:
  - target: Enhanced Sarcoplasmic Reticulum Calcium Uptake and Contractility
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Complete phospholamban loss raises SERCA calcium affinity and basal contractility.
    limitations: >-
      Homozygous null rather than the heterozygous human state; mouse calcium
      handling relies more on SERCA than the human heart does.
    readouts:
    - name: Intraventricular pressure derivatives and SERCA calcium affinity
      target: Enhanced Sarcoplasmic Reticulum Calcium Uptake and Contractility
      direction: INCREASED
      interpretation: Contractility and pump calcium affinity rise without phospholamban.
      evidence:
      - reference: PMID:8062415
        reference_title: "Targeted ablation of the phospholamban gene is associated with markedly enhanced myocardial contractility and loss of beta-agonist stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The first derivatives of intraventricular pressure (+/- dP/dt) were also significantly elevated, and this was associated with an increase in the affinity of the SR Ca(2+)-ATPase for Ca2+ in the phospholamban-deficient hearts."
        explanation: Reports the contractility and calcium-affinity readouts.
    evidence:
    - reference: PMID:8062415
      reference_title: "Targeted ablation of the phospholamban gene is associated with markedly enhanced myocardial contractility and loss of beta-agonist stimulation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The phospholamban-deficient mice showed no gross developmental abnormalities but exhibited enhanced myocardial performance without changes in heart rate."
      explanation: Supports the model as informative for the hypercontractility node.
  - target: Cardiomyocyte Hypertrophic Remodeling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: Lifelong hypercontractility in the null mouse is not followed by hypertrophy or failure.
    limitations: >-
      Species difference in reliance on phospholamban regulation; a complete
      null, not a heterozygote; hypertrophy has not been specifically assessed
      in heterozygous Pln mice in the cited work.
    evidence:
    - reference: PMID:12639993
      reference_title: "Human phospholamban null results in lethal dilated cardiomyopathy revealing a critical difference between mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Whereas the PLN-null mouse displays chronically increased basal cardiac contractile function without developing heart failure, even in advanced age"
      explanation: The null mouse does not develop the human remodelling and failure phenotype.

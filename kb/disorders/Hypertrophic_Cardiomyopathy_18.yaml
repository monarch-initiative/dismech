- name: PLN Promoter Variant Altering Phospholamban Expression
  description: >-
    Seven HCM probands in three cohorts carried rare single-nucleotide
    variants in the PLN promoter that were absent from controls. In reporter assays -77A>G raised
    promoter activity in neonatal rat cardiomyocytes, whereas -42C>G lowered it
    by 43-47% in C6 and C2C12 cells; five further promoter variants found in
    the Mayo cohort have no functional data. If the reporter results hold in
    the heart, these alleles would move phospholamban expression, and with it
    SERCA2a inhibition, in opposite directions. The node is HYPOTHETICAL: each
    variant rests on a single family or proband, none has been shown to alter
    phospholamban protein in human myocardium, and their causal role in HCM is
    not established.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  genetic_context:
    gene:
      preferred_term: PLN
      term:
        id: hgnc:9080
        label: PLN
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Promoter single-nucleotide variants -77A>G and -42C>G (relative to the
      transcription start site), plus unstudied -235C>T, -198A>C, -120A>G,
      -114T>C and -47G>T. Recorded as UNKNOWN because the two studied alleles
      change reporter activity in opposite directions.

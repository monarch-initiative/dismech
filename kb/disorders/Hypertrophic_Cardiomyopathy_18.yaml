- name: Enhanced Sarcoplasmic Reticulum Calcium Uptake and Contractility
  description: >-
    With the brake partly released, sarcoplasmic reticulum calcium reuptake is
    faster and basal contractility rises, as in a heart under continuous
    beta-adrenergic stimulation. This is directly demonstrated only in the
    phospholamban-null mouse. The human counterpart is indirect: L39X
    heterozygotes have normal or high ejection fractions (the Mayo proband
    reached 90% at peak exertion), and the original authors proposed that
    years of increased cardiac work lead to hypertrophy. Calcium transients in
    human heterozygous myocardium have not been measured.

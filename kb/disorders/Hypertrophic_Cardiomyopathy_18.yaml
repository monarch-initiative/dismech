inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous PLN variants segregate with HCM as an autosomal dominant trait
    with incomplete penetrance: in the Mayo L39X pedigree an adult
    genotype-positive daughter was unaffected while her carrier child had HCM,
    in the two Athens L39stop kindreds only four of nine heterozygotes had left
    ventricular hypertrophy, and the -42C>G promoter family included a healthy
    adult carrier. Expressivity is variable, from isolated hypertrophy with
    normal function to dilated cardiomyopathy in some heterozygotes. Two
    L39X alleles produce a more severe, dilated phenotype, which ClinGen
    describes as a dosage effect or semidominance; that is a property of the
    allele rather than a separate recessive form of CMH18 and is recorded here
    rather than as autosomal recessive inheritance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE

genetic:
- name: YY1
  gene_term:
    preferred_term: YY1
    term:
      id: hgnc:12856
      label: YY1
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous intragenic YY1 variants (frameshift, nonsense, splice and
    zinc-finger missense) or 14q32.2 deletions including YY1. Larger
    deletions also remove neighboring genes. ClinGen's Definitive AD
    classification for YY1 is recorded against "complex neurodevelopmental
    disorder" (MONDO:0100038), a broader disease, so it is not copied here as
    a gene-disease validity assertion for this entry.
  evidence:
  - reference: PMID:31145572
    reference_title: "Gabriele-de Vries Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Gabriele-de Vries syndrome is established in a proband
      by the identification of a heterozygous pathogenic variant involving YY1
      or a heterozygous deletion of 14q32.2 involving only YY1.
    explanation: GeneReviews defines the causal genotype.
  variants:
  - name: p.Glu231Ilefs*25
    description: >-
      De novo frameshift NM_003403:c.690delA reported in an Iranian boy with
      motor and speech delay, ataxia and autistic behavior.
    variant_type: deletion
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34729769
      reference_title: "Clinical features of patients with Yin Yang 1 deficiency causing Gabriele-de Vries syndrome: A new case and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The novel de novo pathogenic variant detected in this study
        (NM_003403:c.690delA, p.Glu231Ilefs*25) was identified by whole-exome
        sequencing and confirmed by Sanger sequencing.
      explanation: Reports the variant as de novo and pathogenic.
  - name: p.Val153fs*97
    description: Novel heterozygous frameshift NM_003403.5:c.458_476del.
    variant_type: deletion
    evidence:
    - reference: PMID:37658636
      reference_title: "Clinical analysis of Gabriele-de Vries caused by YY1 mutations and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A novel heterozygous frameshift mutation NM_003403.5:c.458_476del (p. V153fs*97) in the YY1 gene was detected in the proband.
      explanation: Reports the variant in a GADEVS proband.
  - name: p.Cys303Arg
    description: >-
      De novo missense NM_003403.4:c.907T>C in a woman with mild intellectual
      disability and a complex movement disorder (action tremor, cerebellar
      ataxia, dystonia).
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC

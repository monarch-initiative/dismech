    Heterozygous, de novo YY1 alleles (frameshift and nonsense variants,
    whole-gene or 14q32.2 deletions, and missense variants in the zinc-finger
    DNA-binding domain) reduce the dose of functional YY1. Patient clinical and
    molecular data define the syndrome as a haploinsufficiency disorder.

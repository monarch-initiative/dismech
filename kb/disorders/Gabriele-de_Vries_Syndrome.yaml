- name: Impaired YY1 Zinc-Finger DNA Binding
  description: >-
    Disease-associated missense variants cluster in the four C-terminal zinc
    fingers that form the YY1 DNA-binding domain. The recurrent p.Asp380Tyr
    substitution alters YY1 structure only modestly but impairs the
    specificity of DNA binding, so missense alleles can reduce effective YY1
    function without reducing protein amount.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL

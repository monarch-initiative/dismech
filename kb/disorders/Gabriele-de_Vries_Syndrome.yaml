        (NM_003403.5:c.1106A > G; p.Asn369Ser)
      explanation: Reports the variant as de novo and pathogenic.
  - name: p.Asp380Tyr
    description: >-
      Recurrent zinc-finger missense substitution that impairs DNA-binding
      specificity in vitro.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:32077676
      reference_title: "The effect of D380Y pathogenic mutation in human Yin Yang 1 on the protein's structure and function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        a repetitively occurring substitution of aspartate-380 for tyrosine was
        analyzed to assess its impact on Yin Yang 1's structure and DNA binding
      explanation: Describes the variant as recurrent and characterizes it functionally.
diagnosis:
- name: YY1 Molecular Genetic Testing
  description: >-
    Diagnosis requires a heterozygous pathogenic YY1 variant or a 14q32.2
    deletion involving YY1, because the clinical features are variable and
    nonspecific. Exome sequencing with Sanger confirmation identified the
    variants in several case reports.
  diagnosis_term:
    preferred_term: molecular genetic testing for YY1
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous pathogenic YY1 sequence variant or a deletion including
    YY1.
  evidence:
  - reference: PMID:31145572
    reference_title: "Gabriele-de Vries Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Gabriele-de Vries syndrome is established in a proband
      by the identification of a heterozygous pathogenic variant involving YY1
      or a heterozygous deletion of 14q32.2 involving only YY1.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:34729769
    reference_title: "Clinical features of patients with Yin Yang 1 deficiency causing Gabriele-de Vries syndrome: A new case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The investigations for a suspected case of Gabriele-de Vries Syndrome
      must involve molecular diagnosis of the disease and its underlying
      genetic defect because the clinical investigations are generally
      variable and nonspecific.
    explanation: Clinical features alone are insufficient for diagnosis.
- name: Peripheral Blood DNA Methylation Episignature
  description: >-
    A GADEVS-specific peripheral-blood DNA methylation episignature,
    derived from 13 individuals, supports classification of YY1 variants of
    uncertain significance. It is a diagnostic biomarker, not a demonstrated
    step in the causal chain.
  diagnosis_term:
    preferred_term: DNA methylation episignature analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  evidence:
  - reference: PMID:35027293
    reference_title: "DNA methylation episignature in Gabriele-de Vries syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also highlighted the utility of DNA methylation episignature analysis
      for classification of variants of unknown clinical significance.
    explanation: Establishes the episignature as a variant-classification aid.
treatments:
- name: Symptom-Directed Supportive Care
  description: >-
    No disease-modifying therapy exists. Developmental delay, craniofacial
    anomalies, feeding difficulties, reflux, constipation, seizures,
    behavioral manifestations, eye findings, congenital heart and renal
    anomalies, cryptorchidism and skeletal anomalies are each treated per
    standard practice.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31145572
    reference_title: "Gabriele-de Vries Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Developmental delay / intellectual
      disability, craniofacial anomalies (Pierre Robin sequence, cleft palate,
      craniosynostosis, abnormalities of the lacrimal duct), feeding
      difficulties, gastroesophageal reflux, constipation, seizures,
      behavioral manifestations, strabismus, refractive error, congenital
      heart defects, renal anomalies, cryptorchidism, and skeletal anomalies
      are treated per standard practice.
    explanation: GeneReviews management is symptom-directed standard care.
- name: Pallidal Deep Brain Stimulation for Dystonia
  description: >-
    Bilateral globus pallidus internus deep brain stimulation has been used
    for medication-refractory generalized dystonia; evidence is limited to
    case reports.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: bilateral GPi deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_phenotypes:
  - preferred_term: Dystonia
    term:
      id: HP:0001332
      label: Dystonia
  evidence:
  - reference: PMID:41554999
    reference_title: "Long-term benefit of GPi-DBS in YY1-related dystonia: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Burke-Fahn-Marsden motor score decreased from 100 to 50, and the
      disability score decreased from 20 to 14 at six months.
    explanation: >-
      Single-patient report of improvement after GPi-DBS; it notes only one
      similar case had been reported.
- name: Levothyroxine for Hypothyroidism
  description: >-
    Hypothyroidism, including autoimmune thyroiditis, is treated with
    standard levothyroxine replacement.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: NCIT:C62080
        label: Levothyroxine
  target_phenotypes:
  - preferred_term: Hypothyroidism
    term:
      id: HP:0000821
      label: Hypothyroidism
  evidence:
  - reference: PMID:40655401
    reference_title: "Hashimoto's thyroiditis and nanophthalmos in Gabriele-de Vries syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Levothyroxine replacement therapy successfully corrected the hypothyroidism.
    explanation: Single-case report of treated hypothyroidism.
experimental_models:
- name: Patient iPSC-derived cortical organoids and NGN2 neurons
  description: >-
    2D and 3D patient-derived neural lineages (cortical organoids,
    NGN2-induced excitatory neurons, and neuron-astrocyte co-culture)
    analyzed by imaging, single-cell multiomics and gene regulatory network
    reconstruction.
  experimental_model_type: ORGANOID
  publication: PMID:39987231
  modeled_mechanisms:
  - target: Disrupted Corticogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      In vitro organoids lack vasculature and whole-brain context; the link
      from organoid cytoarchitecture to patient brain findings is by analogy.
    evidence:
    - reference: PMID:39987231
      reference_title: "YY1 mutations disrupt corticogenesis through a cell type specific rewiring of cell-autonomous and non-cell-autonomous transcriptional programs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we combined large-scale imaging, single-cell multiomics and gene
        regulatory network reconstruction in 2D and 3D patient-derived
        physiopathologically relevant cell lineages
      explanation: Describes the patient-derived model systems.
  - target: Non-Cell-Autonomous Astrocyte Pro-Inflammatory Activation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: >-
      Co-culture system; whether astrocyte activation occurs in patient brain
      is untested.
    evidence:
    - reference: PMID:39987231
      reference_title: "YY1 mutations disrupt corticogenesis through a cell type specific rewiring of cell-autonomous and non-cell-autonomous transcriptional programs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transcriptional alterations in neurons propagated to neighboring
        astrocytes through a major non-cell autonomous pro-inflammatory effect
      explanation: Co-culture readout of astrocyte activation.
- name: Patient lymphoblastoid cell lines
  description: >-
    Lymphoblastoid cells from affected individuals carrying YY1 deletions or
    missense variants, used for YY1 and histone ChIP-seq and RNA-seq.
  experimental_model_type: CELL_LINE
  publication: PMID:28575647
  modeled_mechanisms:
  - target: Reduced YY1 Chromatin Occupancy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Transformed blood-derived cells; chromatin findings may not transfer to
      developing neural cells.
    evidence:
    - reference: PMID:28575647
      reference_title: "YY1 Haploinsufficiency Causes an Intellectual Disability Syndrome Featuring Transcriptional and Chromatin Dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Through immunoprecipitation of YY1-bound chromatin from affected
        individuals' cells with antibodies recognizing both ends of the protein
      explanation: ChIP in patient-derived cells.
  - target: Loss of H3K27 Acetylation at YY1-Bound Enhancers
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Transformed blood-derived cells; enhancer landscapes differ from those
      of neural progenitors.
    evidence:
    - reference: PMID:28575647
      reference_title: "YY1 Haploinsufficiency Causes an Intellectual Disability Syndrome Featuring Transcriptional and Chromatin Dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we uncover a widespread loss of H3K27 acetylation in particular on the
        YY1-bound enhancers
      explanation: Histone ChIP in patient-derived cells.

name: Gabriele-de Vries Syndrome
creation_date: "2026-10-18T00:00:00Z"
synonyms:
- Gabriele de Vries syndrome
- GADEVS
- YY1 syndrome
- YY1 haploinsufficiency syndrome
description: >-
  Gabriele-de Vries syndrome (GADEVS) is an autosomal dominant
  neurodevelopmental and multiple-congenital-anomaly syndrome caused by
  heterozygous pathogenic variants in YY1, or by deletions of 14q32.2 that
  include YY1, which in all tested families have arisen de novo. YY1 is a
  zinc-finger transcription factor that acts as both activator and repressor
  and regulates enhancer activity. Truncating alleles, whole-gene deletions
  and missense variants in the C-terminal zinc-finger DNA-binding domain
  converge on haploinsufficiency: in patient-derived cells YY1 chromatin
  occupancy is globally reduced, H3K27 acetylation is lost at YY1-bound
  enhancers, and in patient iPSC-derived cortical organoids and neurons
  cell-type-specific transcriptional networks of neural progenitors and
  excitatory neurons are disrupted. Clinically, mild-to-profound
  developmental delay or intellectual disability is present in all affected
  individuals, accompanied by speech and motor delay, intrauterine growth
  restriction or low birth weight, feeding difficulties, hypotonia and gait
  abnormalities, behavioral features (ADHD, anxiety, autistic behavior),
  facial dysmorphism, and variable congenital anomalies of the brain, eye,
  heart, kidney, genitalia and skeleton. A subset develop a juvenile- or
  adult-onset movement disorder dominated by dystonia. A peripheral-blood DNA
  methylation episignature supports variant classification. Management is
  supportive.

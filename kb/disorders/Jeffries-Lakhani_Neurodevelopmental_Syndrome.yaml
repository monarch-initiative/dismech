discussions:
- discussion_id: jelans_recurrent_infection_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    T cell-specific Creld1 knockout mice lose T cells with age, but patients
    with recurrent infections had normal proportions of T cells, including
    naive CD4+ T cells. What explains the infections in patients?
  attaches_to:
  - phenotypes#Recurrent infections
  rationale: >
    The mouse result came from a complete conditional knockout, while patients
    retain partial CRELD1 function, and the patient testing was a single
    baseline flow cytometry panel in four individuals. Infections may instead
    follow aspiration, neurological disability or a functional immune defect
    that subset proportions would not reveal; T cell activation, proliferation
    and apoptosis, which were abnormal in the mouse, have not been measured in
    patient cells.
  evidence:
  - reference: PMID:33169013
    reference_title: CRELD1 modulates homeostasis of the immune system in mice and humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Loss of Creld1 was associated with simultaneous overactivation and
      increased apoptosis, resulting in a net loss of T cells with age.
    explanation: The mouse T cell phenotype that patients did not show.
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Finally, baseline analyses of peripheral blood mononuclear cells showed
      similar proportions of immune cell subtypes in patients compared with
      healthy donors.
    explanation: The patient result that does not match the mouse.
- discussion_id: jelans_seizure_and_arrhythmia_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which CRELD1 function, acetylcholine receptor assembly, ER-mitochondria
    signalling or calcineurin-NFAT signalling, accounts for the epilepsy and
    the cardiac arrhythmias, and why do arrhythmia and early death cluster
    with the p.(Cys192Tyr)-plus-frameshift genotype?
  attaches_to:
  - pathophysiology#Increased Seizure Susceptibility
  - phenotypes#Cardiac arrhythmia
  - pathophysiology#Biallelic Hypomorphic CRELD1 Variants
  rationale: >
    Each candidate function rests on model systems: AChR assembly in C.
    elegans, mitochondrial dynamics in flies and HeLa cells, and
    calcineurin-NFAT signalling in the developing mouse heart. None has been
    tested in patient-derived neurons or cardiomyocytes. The Xenopus seizure
    phenotype is provoked by a muscarinic agonist, which the founding authors
    note runs opposite to the prediction from reduced AChR assembly. In the
    overexpression assay p.(Cys192Tyr) retained more function than other
    missense alleles, yet it is the allele associated with arrhythmia and
    death, so the assay may not measure the function that matters.
  evidence:
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      We also note, however, that the p.(Cys192Tyr) displayed greater protein
      function than some of the other variants tested in our overexpression
      assay.
    explanation: The overexpression assay does not track the clinically severe allele.

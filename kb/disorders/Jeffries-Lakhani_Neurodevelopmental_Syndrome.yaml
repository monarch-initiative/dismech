prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Jeffries et al. 2024 report 18 individuals from 14 families from the United
    States, Canada and the United Kingdom; Archer et al. 2025 add three and
    D'Alessandro et al. 2025 add one. Chundru et al. 2024 found six probands
    with damaging biallelic CRELD1 genotypes in a 29,745-proband gene-burden
    analysis that includes GeneDx data, so some of them may overlap the GeneDx
    patients of the founding cohort. No population estimate exists. The two
    commonest alleles are found mainly in non-Finnish Europeans.
  evidence:

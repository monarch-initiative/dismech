  modeled_mechanisms:
  - target: Mitochondrial Hyperfusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Creld loss causes mitochondrial hyperfusion, altered ER-mitochondria
      contacts and reduced complex I activity, with a locomotion defect rescued
      by Creld in neurons.
    limitations: >-
      A complete null of the fly gene, whereas patients retain partial
      function; mitochondrial dynamics have not been studied in patient cells.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-

pathophysiology:
- name: Biallelic Hypomorphic CRELD1 Variants
  biological_scale: MOLECULAR
  description: >-
    One frameshift allele, presumed null, in trans with a missense allele that
    retains reduced function. Complete loss is thought to be incompatible with
    life, as in Creld1 knockout mice, and heterozygous loss is tolerated, so
    the disease is attributed to residual CRELD1 function below about half of
    normal. CRELD1 acts as an ER-resident protein disulfide isomerase; whether
    the patient missense alleles reduce that activity has not been measured.
  genes:
  - preferred_term: CRELD1
    term:
      id: hgnc:14630
      label: CRELD1
  molecular_functions:
  - preferred_term: protein disulfide isomerase activity
    modifier: DECREASED
    term:
      id: GO:0003756
      label: protein disulfide isomerase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additionally, human CRELD1 harboring missense variants from affected
      individuals had reduced protein function, indicated by a diminished
      ability to induce craniofacial defects when overexpressed in X
      tropicalis.
    explanation: Patient missense alleles are hypomorphic in an in vivo overexpression assay.
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were no patients with two predicted loss-of-function frameshift
      variants.
    explanation: The genotype distribution points to partial rather than complete loss of function.
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Additionally, as heterozygous parents harboring frameshift variants are
      healthy, simple haploinsufficiency does not appear to be the mechanism
      for disease.
    explanation: Heterozygous frameshift carriers are unaffected, which excludes haploinsufficiency.
  - reference: PMID:30407909
    reference_title: CRELD1 is an evolutionarily-conserved maturational enhancer of ionotropic acetylcholine receptors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT

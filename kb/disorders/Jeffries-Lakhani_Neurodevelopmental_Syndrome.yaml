    label: Jeffries-Lakhani neurodevelopmental syndrome
parents:
- Neurodevelopmental Disorder
notes: >-
  Distinct from CRELD1-associated atrioventricular septal defect
  (kb/disorders/Atrioventricular_Septal_Defect.yaml), where heterozygous
  CRELD1 missense variants are incompletely penetrant susceptibility alleles.
  In this recessive syndrome the heterozygous parents are clinically
  unaffected and structural septal defects are rare (two of 18 patients in the
  founding cohort, both ventricular septal defects with or without an atrial
  septal defect, and none atrioventricular). The entry
  Neurodevelopmental_Disorder_With_Seizures_Spasticity_And_Complete_Or_Partial_Agenesis_Of_The_Corpus_Callosum
  names CRELD1 only as a co-listed gene in a recessive gene-burden table; that
  entry is the HECTD4 disorder. Variant names follow NM_015513 as used by
  Jeffries et al. and Archer et al.; D'Alessandro et al. use NM_001077415.3,
  on which their patient's novel missense is p.Cys292Tyr, a residue distinct
  from the recurrent Cys192. No GeneReviews chapter exists for this disorder.

    quote_role: PRIMARY_RESULT
    snippet: >-
      Biallelic variants in CRELD1 were found in 18 participants from 14
      families.
    explanation: The founding case series.
genetic:
- name: CRELD1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    CRELD1 (3p25.3) encodes cysteine-rich with EGF-like domains 1. The causal
    call rests on the 14-family founding cohort with functional testing of
    patient missense alleles in Xenopus (Jeffries et al. 2024), on a
    recessive gene-burden excess in which CRELD1 passed Bonferroni correction
    (Chundru et al. 2024, which may share GeneDx patients with the founding
    cohort), and on later case reports. ClinGen has classified CRELD1 only for
    autosomal dominant congenital heart disease (Limited, MONDO:0005453),
    which is a different disease, so gene_disease_validity is left absent.
    The recurrent alleles are p.(Cys192Tyr) in the first EGF-like domain and
    the frameshifts p.(Gln320Argfs*25) and p.(Ala377Thrfs); no patient has two
    frameshift alleles.
  gene_term:

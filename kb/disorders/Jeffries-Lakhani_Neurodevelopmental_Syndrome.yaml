- name: Reduced Acetylcholine Receptor Assembly
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    CRELD1 binds ionotropic acetylcholine receptor subunits in the ER and
    promotes their assembly, so reduced CRELD1 function lowers the number of
    mature receptors reaching the cell surface. Shown in C. elegans, in mouse
    muscle cells and, for the patient alleles, in worm knock-ins only.
  cellular_components:
  - preferred_term: acetylcholine-gated channel complex
    modifier: DECREASED
    term:
      id: GO:0005892
      label: acetylcholine-gated channel complex
  evidence:
  - reference: PMID:30407909
    reference_title: CRELD1 is an evolutionarily-conserved maturational enhancer of ionotropic acetylcholine receptors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      It physically interacts with AChRs and promotes the assembly of AChR
      subunits in the ER.
    explanation: CRELD1 orthologue function in AChR assembly.
  - reference: PMID:40980404
    reference_title: Biallelic CRELD1 variants cause severe muscle weakness and infantile epilepsy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      We were able to model these heterozygous variants and observed a
      decrease in AChRs at the neuromuscular junction.
    explanation: Patient-equivalent alleles reduce AChRs at the worm neuromuscular junction.
  downstream:
  - target: Muscle weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - achr_biogenesis
    description: >-
      Proposed by the authors; the founding cohort found no signs of a
      neuromuscular junction defect, and repetitive nerve stimulation was
      normal in the one patient in whom it was tolerated.
    evidence:
    - reference: PMID:40980404
      reference_title: Biallelic CRELD1 variants cause severe muscle weakness and infantile epilepsy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Since CRELD1 controls the maturation of muscle AChRs, we could
        speculate that the compound CRELD1 variants found in the patient could
        reduce the amount of mature AChRs reaching the muscle surface, thus
        accounting for an AMC-like phenotype.
      explanation: Stated as speculation from the worm and cell data.
  - target: Arthrogryposis multiplex congenita
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - achr_biogenesis
    description: >-
      By analogy with the arthrogryposis caused by variants in AChR subunit
      genes; seen in a single CRELD1 patient.
    evidence:
    - reference: PMID:40980404
      reference_title: Biallelic CRELD1 variants cause severe muscle weakness and infantile epilepsy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Since CRELD1 controls the maturation of muscle AChRs, we could
        speculate that the compound CRELD1 variants found in the patient could
        reduce the amount of mature AChRs reaching the muscle surface, thus
        accounting for an AMC-like phenotype.
      explanation: Stated as speculation from the worm and cell data.
- name: Mitochondrial Hyperfusion
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Loss of CRELD1 or its fly orthologue alters ER-mitochondria contacts and
    shifts mitochondria toward a fused, elongated network with reduced complex
    I activity and reduced hydrogen peroxide signalling. In flies this
    impairs neuronal activity and locomotion. In patients, one post-mortem
    muscle biopsy showed pleomorphic mitochondria with abnormal cristae; no
    patient-cell study of mitochondrial dynamics exists.
  biological_processes:
  - preferred_term: mitochondrial fusion
    modifier: INCREASED
    term:
      id: GO:0008053
      label: mitochondrial fusion
  evidence:
  - reference: PMID:35867795
    reference_title: The ER protein Creld regulates ER-mitochondria contact dynamics and respiratory complex 1 activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      mitochondria are mostly fragmented in controls (35) but are fused,
      elongated, and network-like in cells that knock down CRELD1
    explanation: CRELD1 knockdown in human HeLa cells causes mitochondrial hyperfusion.
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      She also had post-mortem muscle analysis that showed fiber size
      variation, a predominance of Type 1 fibers, and pleiomorphic mitochondria
      with abnormal cristae and paracrystalline-like inclusions
    explanation: >-
      Abnormal mitochondria in one patient's muscle; consistent with, but not
      a demonstration of, altered mitochondrial dynamics.
  downstream:
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mitochondrial_dynamics
    description: >-
      Suggested by the fly locomotion defect; the founding authors call the
      connection unclarified.
    evidence:
    - reference: PMID:37947183
      reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A mechanistic link may be provided from Drosophila Creld mutants with
        locomotion defects, reduced neuronal function, and mitochondrial
        impairments, though further work will be required to clarify any
        connection
      explanation: A proposed, untested link from the fly model to patient hypotonia.
- name: Increased Seizure Susceptibility
  biological_scale: TISSUE
  description: >-
    Lowered seizure threshold of the brain. creld1-depleted Xenopus tadpoles
    show no spontaneous seizures but seize more often than controls after a
    low dose of pilocarpine. In patients seizures are frequently triggered by
    elevated body temperature. The cellular basis is unknown; reduced
    neuronal AChR assembly and altered mitochondrial signalling have both been
    proposed.
  evidence:
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, when treated with a minimally-phenotypic dose of the chemical
      convulsant pilocarpine (50mM), CRELD1-MO tadpoles displayed more robust
      seizure behaviors within 30 minutes of treatment (mean 79%, n=78)
      compared to control MO (mean 33%, n=80) and uninjected control tadpoles
      (mean 41%, n=81)
    explanation: Provoked-seizure susceptibility after creld1 knockdown.
  - reference: PMID:37947183
    reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Still, the precise mechanism of seizures in these patients remains
      unclear.
    explanation: Records that the mechanism is not established.
  downstream:
  - target: Early-onset epilepsy
    causal_link_type: DIRECT
  - target: Seizure precipitated by febrile infection
    causal_link_type: DIRECT
  - target: Epileptic spasm
    causal_link_type: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: achr_biogenesis
  hypothesis_label: Reduced ionotropic acetylcholine receptor assembly
  status: EMERGING
  description: >-
    Reduced CRELD1 disulfide isomerase function lowers assembly of ionotropic
    acetylcholine receptors in the ER, reducing receptor numbers at
    neuromuscular and possibly central synapses. Proposed to explain muscle
    weakness and arthrogryposis, and possibly part of the epilepsy. Supported
    by C. elegans knock-ins of patient-equivalent alleles; untested in patient
    tissue, and the founding cohort did not find neuromuscular junction signs.
  evidence:
  - reference: PMID:40980404
    reference_title: Biallelic CRELD1 variants cause severe muscle weakness and infantile epilepsy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, we can also hypothesize that specific CRELD1 compound variants
      affect the expression of some subtypes of AChRs and ultimately contribute
      to the neurodevelopmental and epileptic phenotypes observed in our
      patient.
    explanation: The authors' hypothesis, extended from the neuromuscular to the central phenotypes.
- hypothesis_group_id: mitochondrial_dynamics
  hypothesis_label: Altered ER-mitochondria contacts and mitochondrial hyperfusion
  status: EMERGING
  description: >-
    Reduced CRELD1 alters ER-mitochondria contacts, causing mitochondrial
    hyperfusion, lower complex I activity and reduced hydrogen peroxide
    signalling that impairs neuronal function. Proposed to underlie the
    hypotonia and motor impairment. Supported in flies and human cell lines;
    untested with patient alleles.
  evidence:
  - reference: PMID:35867795
    reference_title: The ER protein Creld regulates ER-mitochondria contact dynamics and respiratory complex 1 activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The resulting low-hydrogen peroxide levels are linked to disturbed
      neuronal activity and lead to impaired locomotion, but not
      neurodegeneration, in Creld mutants.
    explanation: In flies, the mitochondrial defect impairs neuronal activity and locomotion.

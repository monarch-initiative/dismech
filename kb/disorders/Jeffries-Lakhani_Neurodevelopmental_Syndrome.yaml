animal_models:
- name: Xenopus tropicalis creld1 knockdown
  species: Western clawed frog
  genotype: creld1 start-site morpholino or CRISPR/Cas9-mutated F0 tadpoles
  publication: PMID:37947183
  description: >-
    Tadpoles depleted of creld1 by morpholino or by CRISPR F0 editing, tested
    for gross development and for seizures provoked by a low dose of
    pilocarpine.
  modeled_mechanisms:
  - target: Increased Seizure Susceptibility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      creld1 depletion raises the fraction of tadpoles that seize after a
      minimally phenotypic pilocarpine dose.
    limitations: >-
      Knockdown or F0 mosaic editing rather than the patient missense and
      frameshift combination; no spontaneous seizures, unlike the patients;
      pilocarpine is a muscarinic agonist with additional inflammatory and
      blood-brain barrier effects, so the provoked phenotype does not identify
      the pathway involved.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The readout is the fraction of tadpoles showing seizure behaviour after
        pilocarpine, standing in for the spontaneous epilepsy of patients,
        which the tadpoles did not show.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        An amphibian larval nervous system, tested at a single early stage,
        stands in for the developing human brain.
    readouts:
    - name: Pilocarpine-induced seizure behaviour
      target: Increased Seizure Susceptibility
      direction: INCREASED
      interpretation: More creld1-depleted tadpoles than controls seized within 30 minutes of pilocarpine.
      evidence:
      - reference: PMID:37947183
        reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          However, when treated with a minimally-phenotypic dose of the
          chemical convulsant pilocarpine (50mM), CRELD1-MO tadpoles displayed
          more robust seizure behaviors within 30 minutes of treatment (mean
          79%, n=78) compared to control MO (mean 33%, n=80) and uninjected
          control tadpoles (mean 41%, n=81)
        explanation: The measured seizure readout.
    - name: Spontaneous seizures
      target: Increased Seizure Susceptibility
      direction: UNCHANGED
      interpretation: No spontaneous seizures were seen in either knockdown.
      evidence:
      - reference: PMID:37947183
        reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          Spontaneous seizures were not observed in either CRELD1-CRISPR or
          CRELD1-MO tadpoles.
        explanation: A negative readout that limits the model.
    evidence:
    - reference: PMID:37947183
      reference_title: "Biallelic CRELD1 variants cause a multisystem syndrome, including neurodevelopmental phenotypes, cardiac dysrhythmias, and frequent infections."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        X tropicalis tadpoles with creld1 knockdown displayed developmental
        defects along with increased susceptibility to induced seizures
        compared with controls.
      explanation: The model is informative for provoked seizure susceptibility.
- name: C. elegans crld-1a patient-equivalent knock-ins
  species: Nematode
  genotype: crld-1a(C228Y)/crld-1(I257*) compound heterozygotes and crld-1a(C187Y) homozygotes
  publication: PMID:40980404
  description: >-
    CRISPR knock-ins of the orthologous positions of human Cys292Tyr,
    Gln320Argfs*25 and Cys192Tyr in the single worm CRELD gene, scored for
    levamisole sensitivity and for levamisole-sensitive AChR levels at the
    neuromuscular junction.
  modeled_mechanisms:
  - target: Reduced Acetylcholine Receptor Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The patient-equivalent compound heterozygous genotype lowers synaptic
      AChRs and makes worms resistant to the cholinergic agonist levamisole;
      the recurrent Cys192Tyr equivalent has a milder effect.
    limitations: >-
      Worm neuromuscular AChRs are the readout; whether CRELD1 variants reduce
      AChRs at the human neuromuscular junction or in the brain has not been
      measured, and the founding cohort found no clinical neuromuscular
      junction defect.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Nematode levamisole-sensitive receptors at the body-wall
        neuromuscular junction stand in for human muscle and neuronal
        nicotinic receptors.
    readouts:
    - name: Levamisole-sensitive AChR fluorescence at the ventral nerve cord
      target: Reduced Acetylcholine Receptor Assembly
      direction: DECREASED
      interpretation: Synaptic AChR levels fall by 45% in the compound heterozygous knock-in.
      evidence:
      - reference: PMID:40980404
        reference_title: Biallelic CRELD1 variants cause severe muscle weakness and infantile epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          We found that the fluorescence intensity of L-AChRs present at the
          ventral nerve cord was decreased by 45% in animals expressing the
          compound heterozygous variants (C228Y/I257*) as compared to the wild
          type
        explanation: The measured AChR readout.
    evidence:
    - reference: PMID:40980404
      reference_title: Biallelic CRELD1 variants cause severe muscle weakness and infantile epilepsy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        C228Y/I257* mutants are largely resistant to levamisole.
      explanation: The compound knock-in has a functional cholinergic phenotype.

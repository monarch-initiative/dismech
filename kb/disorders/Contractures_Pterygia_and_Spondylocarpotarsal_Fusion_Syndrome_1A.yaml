    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 variants underlie both dominantly and recessively inherited Contractures, \nPterygia, and Spondylocarpotarsal Fusion syndromes (CPSFS) which are \ncharacterized by extensive bony abnormalities in addition to congenital \ncontractures."
    explanation: Identifies MYH3 as the gene underlying CPSFS, including the dominant form.
  - reference: PMID:21531865
    reference_title: Exome sequencing identifies an MYH3 mutation in a family with distal arthrogryposis type 1.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of an MYH3 mutation in this family with distal \narthrogryposis type 1 broadens the phenotype associated with MYH3 mutations to \ninclude distal arthrogryposis types 1, 2A (Freeman-Sheldon syndrome), and 2B \n(Sheldon-Hall syndrome)."
    explanation: >-
      Establishes the breadth of the MYH3 allelic series. Indirect for CPSFS1A
      specifically: the families studied had DA1, not CPSFS, so this supports the
      claim that one gene produces several contracture phenotypes rather than
      characterizing CPSFS itself.
  - reference: PMID:25256237
    reference_title: Genotype-phenotype relationships in Freeman-Sheldon syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic \nseverity varied significantly by genotype (P=0.0055)."
    explanation: >-
      Shows that within one MYH3 disorder the specific allele, not merely the presence
      of a variant, sets severity. Indirect: the cohort was DA2A, so this motivates
      rather than demonstrates an allele-specific explanation for why some MYH3
      variants produce the CPSFS skeletal-fusion phenotype.
pathophysiology:
- name: MYH3 Motor Domain Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Missense variants alter residue interactions within the embryonic myosin motor
    domain, changing how it engages actin and nucleotide. This is the studied lesion
    class and the one the mechanistic work below rests on - a change in motor behaviour
    rather than an absence of motor. It is not the only allele class reported in this
    part of the MYH3 spectrum: the recurrent CPSFS/spondylocarpotarsal allele is
    c.-9+1G>A, a 5'UTR splice variant that cannot alter motor-domain residue
    interactions at all and points instead at reduced expression. Note that where it has
    been described alongside this phenotype it was compound heterozygous, in trans with
    a head-region missense - so it is not established as a dominant-acting allele, and
    the dominant disease this entry covers may not be the setting in which it operates.
    See the REFUTE items below and the knowledge gap.
  molecular_functions:
  - preferred_term: embryonic myosin motor activity
    term:
      id: GO:0000146
      label: microfilament motor activity
    modifier: DECREASED
  - preferred_term: actin binding by embryonic myosin
    term:
      id: GO:0003779
      label: actin binding
    modifier: INCREASED
  evidence:
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "molecular modeling \nstudies, which indicate that the F437I and A234T mutations affect specific amino \nacid residue interactions within the myosin motor domain that may alter \ninteraction with actin and nucleotide"
    explanation: >-
      Locates the lesion in the motor domain's actin and nucleotide interfaces. Indirect
      and computational: this is in silico modeling of two DA alleles, not CPSFS alleles.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathogenic variants in CHRNG, MYH3 and TPM2 described to date have been associated with loss of function mutations"
    explanation: >-
      Contradicts this node as a general account of CPSFS. On the pterygium and
      skeletal-fusion end of the MYH3 spectrum the reported allele class is loss of
      function, which a gain-of-mechanical-function motor lesion does not describe.
      Indirect because the statement is made of a multiple pterygium syndrome cohort
      rather than of CPSFS1A. Retained rather than reconciled because both readings
      have support.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the MYH3 c.-9+1G > A variant was initially described in individuals with spondylocarpotarsal synostosis syndrome"
    explanation: >-
      Names the recurrent allele on the spondylocarpotarsal side as a 5'UTR splice
      variant. A 5'UTR splice lesion cannot alter residue interactions in the motor
      domain, so for that allele this node's mechanism does not apply. Indirect, and by
      two steps: the observation is made in a multiple pterygium syndrome cohort, and
      the patient carrying it was compound heterozygous (c.-9+1G>A in trans with
      p.Ala183Pro), so it is a biallelic presentation rather than the dominant disease
      this entry is scoped to.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense is not present in gnomAD and affects the head region of MYH3, a domain where pathogenic missense variants are frequently observed"
    explanation: >-
      The counterweight to the two REFUTE items above, from the same paper and the same
      patient: motor-domain (head region) missense is a recognized and frequent
      pathogenic class in MYH3. This is why the entry carries both readings rather than
      replacing one with the other.
  downstream:
  - target: Prolonged Actomyosin Interaction
    causal_link_type: DIRECT
    description: >-
      Tighter actin binding with slower nucleotide turnover keeps myosin heads attached
      through a larger fraction of the cycle.
- name: Prolonged Actomyosin Interaction
  biological_scale: MOLECULAR
  description: >-
    Mutant embryonic myosin hydrolyses ATP more slowly and stays bound to actin longer,
    with the rate-limiting step falling around phosphate release and the power stroke.
    The functional consequence is a muscle that is stiffer and stronger per unit but
    produces less usable power.
  molecular_functions:
  - preferred_term: actin-activated myosin ATPase cycling
    term:
      id: GO:0000146
      label: microfilament motor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These data in conjunction with our sinusoidal analysis of fibers \nsuggest prolonged myosin binding to actin and a slowed step associated with Pi \nrelease and/or the power stroke."
    explanation: >-
      Directly measures the prolonged actomyosin interaction this node asserts. Indirect
      for CPSFS1A: the measurement is in transgenic Drosophila carrying DA alleles.
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "isolated DA1 myosin \nshowed significantly reduced myosin ATPase activity and in vitro actin filament \nmotility"
    explanation: >-
      Biochemical measurement on isolated mutant myosin, separate from the fiber
      mechanics above. Graded IN_VITRO because the assay is on purified protein.
  downstream:
  - target: Myofibril Assembly and Stability Defect
    causal_link_type: DIRECT
    description: >-
      Abnormal cross-bridge kinetics degrade sarcomere assembly and maintenance in the
      developing muscle.
- name: Myofibril Assembly and Stability Defect
  biological_scale: CELLULAR
  description: >-
    Developing muscle fibers assemble myofibrils poorly and fail to maintain them,
    with reduced power output alongside increased stiffness and passive force - the
    combination that makes this a mechanically abnormal rather than simply weak muscle.

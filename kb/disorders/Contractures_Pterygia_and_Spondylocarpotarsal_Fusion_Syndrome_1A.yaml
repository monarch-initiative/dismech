- name: Skeletal radiography
  description: >-
    Anteroposterior and lateral spine radiographs plus hand and foot radiographs to
    detect cervical/thoracic/lumbar/sacral block vertebrae, progressive intervertebral
    disc narrowing, scoliosis, and carpal and tarsal coalitions.
  diagnosis_term:
    preferred_term: skeletal radiography
    term:
      id: NCIT:C137876
      label: Bone Radiography
  evidence:
  - reference: PMID:28205584
    reference_title: A postnatal role for embryonic myosin revealed by MYH3 mutations that alter TGFβ signaling and cause autosomal dominant spondylocarpotarsal synostosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs (Fig. 1) demonstrate the progressive nature of the vertebral fusions, ranging from mild disc space narrowing in a three-year-old to vertebral fusions and severe scoliosis in an affected adult."
    explanation: Demonstrates serial spine radiography for detecting intervertebral disc narrowing, progressive vertebral synostosis, and scoliosis.
  - reference: PMID:27381093
    reference_title: Protein-altering MYH3 variants are associated with a spectrum of phenotypes extending to spondylocarpotarsal synostosis syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hand and feet X-rays confirmed carpal and tarsal synostosis (Figures 2c and d)."
    explanation: Confirms diagnostic utility of hand and foot radiographs for carpal and tarsal coalitions.
- name: MYH3 molecular genetic testing
  description: >-
    Whole-exome/genome or targeted sequencing (postnatally or via prenatal
    amniocentesis) to identify heterozygous pathogenic MYH3 variants and distinguish
    CPSFS1A from recessive CPSFS1B, FLNB-related spondylocarpotarsal synostosis, and
    CHRNG-related Escobar syndrome.
  diagnosis_term:
    preferred_term: MYH3 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32767732
    reference_title: "Identification of a novel pathogenic variant in the MYH3 gene in a five-generation family with CPSFS1A (Contractures, Pterygia, and Spondylocarpotarsal Fusion Syndrome 1A)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES provides an accurate method in the prenatal diagnosis of CPSFS1A."
    explanation: Demonstrates whole-exome sequencing with Sanger confirmation for definitive postnatal and prenatal molecular diagnosis of CPSFS1A.
  - reference: PMID:28205584
    reference_title: A postnatal role for embryonic myosin revealed by MYH3 mutations that alter TGFβ signaling and cause autosomal dominant spondylocarpotarsal synostosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequence analysis of three SCT patients negative for FLNB mutations identified an autosomal dominant form of the disease due to heterozygosity for missense or nonsense mutations in MYH3, which encodes embryonic myosin."
    explanation: Demonstrates exome sequencing differentiating dominant MYH3 disease from FLNB-related spondylocarpotarsal synostosis.
treatments:
- name: Spinal Bracing and Serial Casting
  description: >-
    Non-operative management of early-onset scoliosis. It buys time during early
    growth rather than reversing structural fusion, and in severe or malignant
    early-onset curves that window can be short.
  treatment_term:
    preferred_term: spinal bracing and serial casting
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: DEVICE
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  target_mechanisms:
  - target: Axial and Appendicular Bony Fusion
    treatment_effect: MODULATES
    description: >-
      Bracing and casting modulate progression of the spinal curve produced by
      asymmetric vertebral fusion during early childhood growth.
    evidence:
    - reference: PMID:34440395
      reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Bracing and serial spine casting appear to be beneficial for a few \nyears; non-fusion spinal instrumentation may be needed to modulate more severe \ncurves during growth and spontaneous spine fusions may occur in those cases."
      explanation: Documents temporary curve control with bracing and serial spine casting in MPS/MYH3 early-onset scoliosis.
  evidence:
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bracing and serial spine casting appear to be beneficial for a few \nyears; non-fusion spinal instrumentation may be needed to modulate more severe \ncurves during growth and spontaneous spine fusions may occur in those cases."
    explanation: >-
      Reports the benefit and its time limit, and the escalation to instrumentation,
      in a multiple pterygium syndrome series that included MYH3 patients.
- name: Orthopedic Spinal Stabilization and Soft-Tissue Release Surgery
  description: >-
    Growth-friendly non-fusion spinal instrumentation for severe or malignant
    early-onset scoliosis, cervical spinal fusion/epiphysiodesis when vertebral
    instability threatens the spinal cord, and surgical release of severe limb
    pterygia or contractures. Spontaneous uninstrumented vertebral autofusions
    frequently occur during growth-friendly instrumentation.
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  - preferred_term: Pterygium
    term:
      id: HP:0001059
      label: Pterygium
  target_mechanisms:
  - target: Axial and Appendicular Bony Fusion
    treatment_effect: MODULATES
    description: >-
      Growth-friendly spinal instrumentation and targeted cervical fusion stabilize
      severe deformity and segmental instability arising from vertebral anomalies.
    evidence:
    - reference: PMID:27381093
      reference_title: Protein-altering MYH3 variants are associated with a spectrum of phenotypes extending to spondylocarpotarsal synostosis syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgery was necessary on the popliteal pterygium. At 4 years of age, C4–C5 dislocation with spinal cord involvement was diagnosed and an anterior epiphysiodesis was performed."
      explanation: Directly documents popliteal pterygium surgery and C3-C6 anterior cervical epiphysiodesis in a child with dominant MYH3 disease.
  - target: Periarticular Soft Tissue Webbing
    treatment_effect: MODULATES
    description: Surgical release addresses severe functional limitation from popliteal or limb pterygia.
    evidence:
    - reference: PMID:27381093
      reference_title: Protein-altering MYH3 variants are associated with a spectrum of phenotypes extending to spondylocarpotarsal synostosis syndrome.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgery was necessary on the popliteal pterygium. At 4 years of age, C4–C5 dislocation with spinal cord involvement was diagnosed and an anterior epiphysiodesis was performed."
      explanation: Directly documents surgical intervention for popliteal pterygium in dominant MYH3 disease.
  evidence:
  - reference: PMID:27381093
    reference_title: Protein-altering MYH3 variants are associated with a spectrum of phenotypes extending to spondylocarpotarsal synostosis syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery was necessary on the popliteal pterygium. At 4 years of age, C4–C5 dislocation with spinal cord involvement was diagnosed and an anterior epiphysiodesis was performed."
    explanation: Directly documents orthopedic surgical management of popliteal pterygium and cervical instability in dominant MYH3 disease.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT

name: Contractures, Pterygia, and Spondylocarpotarsal Fusion Syndrome 1A
creation_date: "2026-09-03T20:10:00Z"
category: Musculoskeletal Disorder
parents:
- Distal Arthrogryposis
- Congenital Limb Malformation
disease_term:
  preferred_term: contractures, pterygia, and spondylocarpotarsal fusion syndrome 1A
  term:
    id: MONDO:0008338
    label: contractures, pterygia, and spondylocarpotarsal fusion syndrome 1A
synonyms:
- CPSFS1A
- CPSFS1, autosomal dominant
- contractures, pterygia, and variable skeletal fusions syndrome 1A
description: >-
  CPSFS1A is the autosomal dominant form of a MYH3-related congenital contracture
  syndrome that sits at the skeletal end of the distal arthrogryposis spectrum. MYH3
  encodes embryonic myosin heavy chain, the motor isoform that powers skeletal muscle
  contraction during the fetal window in which limb joints acquire their range of
  motion. What distinguishes CPSFS from its allelic neighbours - Freeman-Sheldon
  (DA2A), Sheldon-Hall (DA2B) and DA1 - is not a different gene but the addition of
  extensive bony abnormality: vertebral, carpal and tarsal fusions and severe
  early-onset scoliosis on top of the contractures and pterygia those conditions
  share. The mechanism is contested, and this entry does not settle it. The
  best-characterized MYH3 alleles are motor-domain missense variants that behave as a
  gain of mechanical function rather than a loss - mutant embryonic myosin binds actin
  too tightly and cycles too slowly, so the muscle is stiff and poorly powered rather
  than absent - and on that model it is sustained abnormal tension across developing
  joints, not weakness, that fixes them. But that work was done on distal
  arthrogryposis alleles, and the pterygium and skeletal-fusion end of the spectrum
  that CPSFS occupies has instead been described as loss of function, with a recurrent
  5'UTR splice allele rather than a missense. Both readings are carried here with their
  evidence.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    CPSFS1A is the dominantly inherited form; heterozygous MYH3 variants are sufficient.
    A separate recessive form (CPSFS1B) is caused by biallelic variants in the same gene,
    so MYH3 dose and allele class, not the gene itself, set the inheritance pattern.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 variants underlie both dominantly and recessively inherited Contractures, \nPterygia, and Spondylocarpotarsal Fusion syndromes (CPSFS) which are \ncharacterized by extensive bony abnormalities in addition to congenital \ncontractures."
    explanation: >-
      States that CPSFS occurs in both dominant and recessive forms, which is what
      separates CPSFS1A from CPSFS1B, and names the extensive bony abnormality that
      distinguishes CPSFS from the other MYH3 arthrogryposes.
genetic:
- name: MYH3

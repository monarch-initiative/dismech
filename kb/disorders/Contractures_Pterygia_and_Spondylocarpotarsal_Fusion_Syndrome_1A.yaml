    explanation: >-
      Establishes persistent postnatal Myh3 expression in cervical and thoracic
      multifidus muscles stabilizing intervertebral joints, whereas IVD annulus
      fibrosus and nucleus pulposus lack Myh3 expression.
  - reference: PMID:28205584

- name: Physical Therapy
  description: >-
    Stretching, splinting, and range-of-motion rehabilitation for congenital limb
    contractures across the distal arthrogryposis spectrum.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Congenital contracture
    term:
      id: HP:0002803
      label: Congenital contracture
  target_mechanisms:
  - target: Congenital contracture
    treatment_effect: MODULATES
    description: >-
      Stretching and splinting act on established joint contractures to improve
      functional range of motion.
  notes: >-
    Supportive standard of care across MYH3 distal arthrogryposes; published CPSFS1A
    family reports focus on genetic and orthopedic surgical outcomes rather than

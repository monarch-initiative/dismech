pathophysiology:
- name: MYH3 Motor Domain Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Heterozygous pathogenic MYH3 variants in CPSFS1A and autosomal dominant
    spondylocarpotarsal synostosis perturb embryonic myosin heavy chain either in the
    globular motor head (e.g., p.Phe645Cys in actin-binding loop 2, p.Ser243del near
    the ATP-binding pocket with reduced protein stability, p.Thr333Arg) or in the
    coiled-coil rod/tail domain (e.g., p.Leu900fs9, p.E1015_D1016delinsVNLF,
    p.Leu1344Pro). On the distal arthrogryposis model, motor-head missense variants
    alter actin and nucleotide interactions rather than abolishing protein expression,
    while dominant rod/tail missense, indel, and truncating variants perturb the
    coiled-coil backbone and downstream paraspinal signaling without touching active-site
    motor-head residues.

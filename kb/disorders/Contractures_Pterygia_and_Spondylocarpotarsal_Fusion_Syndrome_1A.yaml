- name: Abnormal Paraspinal Loading of Intervertebral Disc
  biological_scale: TISSUE
  description: >-
    Embryonic myosin persists postnatally in the small cervical and thoracic multifidus
    muscles attaching to the distal neural arches of the spine (and in fetal/postnatal
    bone), whereas it is absent from the intervertebral disc annulus fibrosus, nucleus
    pulposus, and growth-plate chondrocytes. Impaired function of these paraspinal
    stabilizing muscles is hypothesized to expose intervertebral discs to extraneous
    mechanical pressure, driving progressive postnatal disc space narrowing and
    collapse.
  locations:
  - preferred_term: intervertebral disk
    term:

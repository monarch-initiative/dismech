description: >-
  CPSFS1A is the autosomal dominant form of a MYH3-related congenital contracture
  syndrome that sits at the skeletal end of the distal arthrogryposis spectrum. MYH3
  encodes embryonic myosin heavy chain, the motor isoform that powers skeletal muscle
  contraction during the fetal window in which limb joints acquire their range of
  motion and that persists postnatally in small multifidus muscles joining the
  vertebral neural arches. What distinguishes CPSFS from its allelic neighbours -
  Freeman-Sheldon (DA2A), Sheldon-Hall (DA2B) and DA1 - is not a different gene but
  the addition of extensive bony abnormality: progressive vertebral, carpal and
  tarsal fusions and severe early-onset scoliosis on top of congenital contractures
  and pterygia. Heterozygous CPSFS1A / autosomal dominant spondylocarpotarsal alleles
  span motor-head missense/in-frame variants (such as p.Thr333Arg, p.Phe645Cys, and
  p.Ser243del) and coiled-coil rod/tail missense, indel, or truncating variants
  (such as p.Leu1344Pro, p.E1015_D1016delinsVNLF, and p.Leu900fs9). Beyond fetal
  hypomobility from altered cross-bridge cycling, dominant MYH3 variants attenuate
  canonical Smad3 and non-canonical p38 MAPK TGF-beta signaling and perturb postnatal
  multifidus paraspinal mechanics across the intervertebral disc, driving progressive
  disc space narrowing and bony synostosis.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    CPSFS1A is the dominantly inherited form; heterozygous MYH3 variants (either
    inherited vertically across generations or arising de novo) are sufficient. A
    separate recessive form (CPSFS1B) is caused by biallelic variants in the same
    gene, so MYH3 dose and allele class set the inheritance pattern.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

name: Contractures, Pterygia, and Spondylocarpotarsal Fusion Syndrome 1A
creation_date: "2026-09-03T20:10:00Z"
category: Musculoskeletal Disorder
parents:
- Distal Arthrogryposis
- Congenital Limb Malformation
disease_term:
  preferred_term: contractures, pterygia, and spondylocarpotarsal fusion syndrome 1A
  term:
    id: MONDO:0008338
    label: contractures, pterygia, and spondylocarpotarsal fusion syndrome 1A
synonyms:
- CPSFS1A
- CPSFS1, autosomal dominant
- contractures, pterygia, and variable skeletal fusions syndrome 1A
description: >-
  CPSFS1A is the autosomal dominant form of a MYH3-related congenital contracture
  syndrome that sits at the skeletal end of the distal arthrogryposis spectrum. MYH3
  encodes embryonic myosin heavy chain, the motor isoform that powers skeletal muscle
  contraction during the fetal window in which limb joints acquire their range of
  motion. What distinguishes CPSFS from its allelic neighbours - Freeman-Sheldon
  (DA2A), Sheldon-Hall (DA2B) and DA1 - is not a different gene but the addition of
  extensive bony abnormality: vertebral, carpal and tarsal fusions and severe
  early-onset scoliosis on top of the contractures and pterygia those conditions
  share. The mechanism is a gain of mechanical function rather than a loss: mutant
  embryonic myosin binds actin too tightly and cycles too slowly, so the fetal muscle
  is stiff and poorly powered rather than absent, and it is that sustained abnormal
  tension across developing joints - not muscle weakness - that is thought to fix them
  in contracture and drive the secondary skeletal changes.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    CPSFS1A is the dominantly inherited form; heterozygous MYH3 variants are sufficient.
    A separate recessive form (CPSFS1B) is caused by biallelic variants in the same gene,
    so MYH3 dose and allele class, not the gene itself, set the inheritance pattern.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 variants underlie both dominantly and recessively inherited Contractures, \nPterygia, and Spondylocarpotarsal Fusion syndromes (CPSFS) which are \ncharacterized by extensive bony abnormalities in addition to congenital \ncontractures."
    explanation: >-
      States that CPSFS occurs in both dominant and recessive forms, which is what
      separates CPSFS1A from CPSFS1B, and names the extensive bony abnormality that
      distinguishes CPSFS from the other MYH3 arthrogryposes.
genetic:
- name: MYH3
  gene_term:
    preferred_term: MYH3
    term:
      id: hgnc:7573
      label: MYH3
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    Embryonic myosin heavy chain. The same gene causes DA1, DA2A (Freeman-Sheldon),
    DA2B (Sheldon-Hall), multiple pterygium syndrome and both CPSFS forms, so the
    gene alone does not predict which phenotype a patient has.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 variants underlie both dominantly and recessively inherited Contractures, \nPterygia, and Spondylocarpotarsal Fusion syndromes (CPSFS) which are \ncharacterized by extensive bony abnormalities in addition to congenital \ncontractures."
    explanation: Identifies MYH3 as the gene underlying CPSFS, including the dominant form.
  - reference: PMID:21531865
    reference_title: Exome sequencing identifies an MYH3 mutation in a family with distal arthrogryposis type 1.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of an MYH3 mutation in this family with distal \narthrogryposis type 1 broadens the phenotype associated with MYH3 mutations to \ninclude distal arthrogryposis types 1, 2A (Freeman-Sheldon syndrome), and 2B \n(Sheldon-Hall syndrome)."
    explanation: >-
      Establishes the breadth of the MYH3 allelic series. Indirect for CPSFS1A
      specifically: the families studied had DA1, not CPSFS, so this supports the
      claim that one gene produces several contracture phenotypes rather than
      characterizing CPSFS itself.
  - reference: PMID:25256237
    reference_title: Genotype-phenotype relationships in Freeman-Sheldon syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic \nseverity varied significantly by genotype (P=0.0055)."
    explanation: >-
      Shows that within one MYH3 disorder the specific allele, not merely the presence
      of a variant, sets severity. Indirect: the cohort was DA2A, so this motivates
      rather than demonstrates an allele-specific explanation for why some MYH3
      variants produce the CPSFS skeletal-fusion phenotype.
pathophysiology:
- name: MYH3 Motor Domain Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Missense variants alter residue interactions within the embryonic myosin motor
    domain, changing how it engages actin and nucleotide. This is the initiating
    molecular lesion; note it is a change in motor behaviour, not an absence of motor.
  molecular_functions:
  - preferred_term: embryonic myosin motor activity
    term:
      id: GO:0000146
      label: microfilament motor activity
    modifier: DECREASED
  - preferred_term: actin binding by embryonic myosin
    term:
      id: GO:0003779
      label: actin binding
    modifier: INCREASED
  evidence:
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "molecular modeling \nstudies, which indicate that the F437I and A234T mutations affect specific amino \nacid residue interactions within the myosin motor domain that may alter \ninteraction with actin and nucleotide"
    explanation: >-
      Locates the lesion in the motor domain's actin and nucleotide interfaces. Indirect
      and computational: this is in silico modeling of two DA alleles, not CPSFS alleles.
  downstream:
  - target: Prolonged Actomyosin Interaction
    causal_link_type: DIRECT
    description: >-
      Tighter actin binding with slower nucleotide turnover keeps myosin heads attached
      through a larger fraction of the cycle.
- name: Prolonged Actomyosin Interaction
  biological_scale: MOLECULAR
  description: >-
    Mutant embryonic myosin hydrolyses ATP more slowly and stays bound to actin longer,
    with the rate-limiting step falling around phosphate release and the power stroke.
    The functional consequence is a muscle that is stiffer and stronger per unit but
    produces less usable power.
  molecular_functions:
  - preferred_term: actin-activated myosin ATPase cycling
    term:
      id: GO:0000146
      label: microfilament motor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These data in conjunction with our sinusoidal analysis of fibers \nsuggest prolonged myosin binding to actin and a slowed step associated with Pi \nrelease and/or the power stroke."
    explanation: >-
      Directly measures the prolonged actomyosin interaction this node asserts. Indirect
      for CPSFS1A: the measurement is in transgenic Drosophila carrying DA alleles.
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "isolated DA1 myosin \nshowed significantly reduced myosin ATPase activity and in vitro actin filament \nmotility"
    explanation: >-
      Biochemical measurement on isolated mutant myosin, separate from the fiber
      mechanics above. Graded IN_VITRO because the assay is on purified protein.
  downstream:
  - target: Myofibril Assembly and Stability Defect
    causal_link_type: DIRECT
    description: >-
      Abnormal cross-bridge kinetics degrade sarcomere assembly and maintenance in the
      developing muscle.
- name: Myofibril Assembly and Stability Defect
  biological_scale: CELLULAR
  description: >-
    Developing muscle fibers assemble myofibrils poorly and fail to maintain them,
    with reduced power output alongside increased stiffness and passive force - the
    combination that makes this a mechanically abnormal rather than simply weak muscle.
  cell_types:
  - preferred_term: fetal skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: differentiating myotube
    term:
      id: CL:0002372
      label: myotube
  biological_processes:
  - preferred_term: myofibril assembly
    term:
      id: GO:0030239
      label: myofibril assembly
    modifier: DECREASED
  - preferred_term: skeletal muscle contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed significant defects in DA1 and DA2B Drosophila flight and \njump ability, as well as myofibril assembly and stability"
    explanation: >-
      Reports the myofibril assembly and stability defect this node asserts, in an
      invertebrate model of two DA alleles.
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanical studies of indirect flight muscle fibers from DA1 \nheterozygotes revealed reduced power output along with increased stiffness and \nforce production, compared to wild-type controls."
    explanation: >-
      Quantifies the stiff-but-underpowered fiber phenotype, and does so in
      heterozygotes, which is the relevant dose for a dominant disorder.
  downstream:
  - target: Reduced Fetal Movement
    causal_link_type: DIRECT
    description: >-
      Mechanically compromised fetal muscle moves the limbs less through the period when
      joint mobility is established.
- name: Reduced Fetal Movement
  biological_scale: ORGANISM
  description: >-
    Diminished fetal movement during the window in which embryonic myosin is the
    dominant sarcomeric isoform. This is the convergence point at which a molecular
    motor defect becomes a structural birth defect, and it is the step shared with the
    other akinesia-related contracture syndromes.
  biological_processes:
  - preferred_term: skeletal muscle tissue development
    term:
      id: GO:0007519
      label: skeletal muscle tissue development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple pterygium syndrome (MPS) is a genetically heterogeneous \nrare form of arthrogryposis multiplex congenita characterized by joint \ncontractures and webbing or pterygia, as well as distinctive facial features \nrelated to diminished fetal movement."
    explanation: >-
      Attributes the contracture-plus-pterygium-plus-facial phenotype to diminished
      fetal movement. Indirect: stated for multiple pterygium syndrome, an allelic and
      clinically overlapping MYH3 condition, not for CPSFS1A.
  downstream:
  - target: Congenital contracture
    causal_link_type: DIRECT
    description: Joints held immobile through development become fixed in flexion.
  - target: Periarticular Soft Tissue Webbing
    causal_link_type: DIRECT
    description: >-
      Skin and soft tissue across a persistently flexed joint fail to expand, producing
      a web.
  - target: Axial and Appendicular Bony Fusion
    causal_link_type: DIRECT
    description: >-
      Absent joint motion permits adjacent skeletal elements to fuse rather than
      cavitate and separate.
- name: Periarticular Soft Tissue Webbing
  biological_scale: TISSUE
  description: >-
    Soft tissue spanning a chronically flexed joint becomes a fixed web, most often
    across the popliteal, antecubital and cervical regions.
  downstream:
  - target: Pterygium
    causal_link_type: DIRECT
- name: Axial and Appendicular Bony Fusion
  biological_scale: TISSUE
  description: >-
    Vertebral, carpal and tarsal elements fuse. This is the node that distinguishes
    CPSFS from the other MYH3 contracture syndromes, and it is also what makes the
    resulting spinal deformity structural rather than positional.
  downstream:
  - target: Vertebral fusion
    causal_link_type: DIRECT
  - target: Carpal synostosis
    causal_link_type: DIRECT
  - target: Tarsal synostosis
    causal_link_type: DIRECT
  - target: Scoliosis
    causal_link_type: DIRECT
    description: >-
      Asymmetric vertebral fusion produces a curve that progresses with growth rather
      than responding to bracing alone.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 variants underlie both dominantly and recessively inherited Contractures, \nPterygia, and Spondylocarpotarsal Fusion syndromes (CPSFS) which are \ncharacterized by extensive bony abnormalities in addition to congenital \ncontractures."
    explanation: >-
      Names extensive bony abnormality as the defining feature of CPSFS over the other
      MYH3 contracture syndromes, which is what this node asserts.

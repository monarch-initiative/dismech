- name: Spinal Bracing and Serial Casting
  description: >-
    Non-operative management of early-onset scoliosis. It buys time rather than
    correcting the deformity, and in the malignant curves characteristic of MYH3
    disease that window is short.
  treatment_term:
    preferred_term: spinal bracing and serial casting
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: DEVICE
  target_phenotypes:
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  evidence:
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bracing and serial spine casting appear to be beneficial for a few \nyears; non-fusion spinal instrumentation may be needed to modulate more severe \ncurves during growth and spontaneous spine fusions may occur in those cases."
    explanation: >-
      Reports the benefit and its time limit, and the escalation to instrumentation.
      Indirect: observed in a multiple pterygium syndrome series that included MYH3
      patients rather than a CPSFS cohort.

differential_diagnoses:
- name: Freeman-Sheldon syndrome (DA2A)
  description: >-
    The severe facial-contracture end of the MYH3 distal arthrogryposis spectrum, with
    whistling-face contractures and scoliosis but without the carpal and tarsal
    fusions that define CPSFS1A. Three recurrent motor-head alleles explain most cases.
  evidence:
  - reference: PMID:25256237
    reference_title: Genotype-phenotype relationships in Freeman-Sheldon syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 mutations were found in 43/46 (93%) kindreds, with three mutations \n(p.T178I, p.R672C, and p.R672H) explaining 39/43 (91%) of cases."
    explanation: >-
      Establishes the recurrent-allele architecture of DA2A, which helps separate it
      from CPSFS1A on molecular testing.
- name: Sheldon-Hall syndrome (DA2B)
  description: >-
    Moderate-severity MYH3 distal arthrogryposis without the carpal and tarsal fusions
    characteristic of CPSFS1A.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Heterozygous variants in MYH3 have been identified to \ncause the dominantly-inherited distal arthrogryposis conditions, Freeman-Sheldon \nsyndrome, Sheldon-Hall syndrome, and multiple pterygium syndrome."
    explanation: >-
      Lists the dominant MYH3 conditions that must be separated from CPSFS1A
      clinically and radiographically, since all involve heterozygous MYH3 variants.
- name: Spondylocarpotarsal synostosis syndrome (FLNB)
  disease_term:
    preferred_term: spondylocarpotarsal synostosis syndrome
    term:
      id: MONDO:0010094
      label: spondylocarpotarsal synostosis syndrome
  description: >-
    Produces the same progressive vertebral, carpal, and tarsal fusions and short-trunk
    short stature, but is inherited as an autosomal recessive FLNB loss-of-function
    disorder acting directly in intervertebral disc annulus fibrosus cells rather than
    through paraspinal embryonic myosin; pterygia and severe distal contractures are
    typically absent.
  evidence:
  - reference: PMID:28205584
    reference_title: A postnatal role for embryonic myosin revealed by MYH3 mutations that alter TGFβ signaling and cause autosomal dominant spondylocarpotarsal synostosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of affected individuals have an autosomal recessive form of SCT and are homozygous or compound heterozygous for nonsense mutations in the gene that encodes the cytoskeletal protein filamin B (FLNB), but a subset do not have FLNB mutations."
    explanation: Contrasts classic autosomal recessive FLNB-related SCT with autosomal dominant MYH3-related SCT.
- name: Multiple pterygium syndrome, Escobar variant (CHRNG)
  disease_term:
    preferred_term: autosomal recessive multiple pterygium syndrome
    term:
      id: MONDO:0009926
      label: autosomal recessive multiple pterygium syndrome
  description: >-
    Overlaps closely in congenital contractures, multiple pterygia, and early-onset
    scoliosis, but is autosomal recessive and most commonly caused by biallelic
    loss-of-function variants in CHRNG encoding the fetal acetylcholine receptor gamma
    subunit.
  evidence:
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A molecular diagnosis was confirmed in seven; two with MYH3 variants and five with CHRNG."
    explanation: Demonstrates that CHRNG is the leading genetic differential to exclude alongside MYH3 in non-lethal multiple pterygium cohorts.
discussions:
- discussion_id: cpsfs1a_mechanism_is_borrowed_from_da_alleles
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do CPSFS1A-associated MYH3 head and coiled-coil rod alleles share the enhanced
    actin-affinity cross-bridge defect established for DA1 and DA2B alleles, and how
    do cross-bridge mechanics interact with suppressed paraspinal Smad3/p38 TGF-beta
    signaling to determine whether an allele causes contractures alone versus
    vertebral and carpotarsal fusions?
  attaches_to:
  - pathophysiology#Prolonged Actomyosin Interaction
  - pathophysiology#Axial and Appendicular Bony Fusion
  rationale: >-
    Direct cross-bridge kinetic measurements (prolonged actin binding, slowed Pi
    release, reduced ATPase rate) were performed on DA1 (F437I) and DA2B (A234T)
    alleles in transgenic Drosophila and purified myosin rather than on CPSFS1A
    alleles. Meanwhile, Zieba et al. (PMID:28205584) showed that three autosomal
    dominant MYH3 spondylocarpotarsal alleles (p.Phe645Cys, p.Ser243del — also
    reported in DA8/CPSFS1A — and p.Leu900fs9) suppress canonical Smad3 and
    non-canonical p38 MAPK TGF-beta signaling in human cells and highlighted
    persistent postnatal Myh3 expression in paraspinal multifidus muscles, while
    Carapito et al. (PMID:27381093) and Zhang et al. (PMID:32767732) identified
    dominant CPSFS1A/MPS variants in the coiled-coil rod/tail domain (p.Leu1344Pro,
    p.E1015_D1016delinsVNLF) that cannot directly alter motor-head active-site
    residues. In addition, recessive CPSFS1B / pterygium presentations often carry
    loss-of-function or hypomorphic alleles such as the 5'UTR splice variant
    c.-9+1G>A (PMID:34440395). Whether dominant CPSFS1A head and rod alleles converge
    on stiff/hypocontractile cross-bridge mechanics, dominant-negative thick-filament
    incorporation, or mechanotransductive TGF-beta suppression remains unresolved.
  proposed_experiments:
  - experiment_id: cpsfs1a_allele_biochemistry
    name: CPSFS1A head and rod allele mechanics and TGF-beta signaling against DA alleles
    description: >-
      Express dominant CPSFS1A head (p.Ser243del, p.Thr333Arg, p.Phe645Cys) and
      coiled-coil rod (p.E1015_D1016delinsVNLF, p.Leu1344Pro) MYH3 alleles alongside
      DA1/DA2B alleles (F437I, A234T), comparing actin affinity, ATPase cycling,
      thick-filament assembly, and TGF-beta1-stimulated Smad3/p38 phosphorylation in
      differentiating myotubes.
    would_support:
    - pathophysiology#Prolonged Actomyosin Interaction
    supporting_outcome:
    - >-
        CPSFS1A alleles show enhanced actin affinity and reduced ATPase cycling
        comparable to DA alleles, placing the skeletal-fusion divergence downstream in
        postnatal paraspinal signaling/loading.
    refuting_outcome:
    - >-
        CPSFS1A rod and head alleles show normal actin affinity or pure loss of motor
        force while reproducing Smad3/p38 suppression, indicating that the DA1/DA2B
        enhanced-actin-affinity node does not generalize to CPSFS1A.
notes: >-
  Scope: MONDO:0008338 covers the autosomal dominant MYH3 form (CPSFS1A, formerly
  distal arthrogryposis type 8 / autosomal dominant multiple pterygium syndrome,
  OMIM:178110). Within dominant MYH3 families, expressivity spans classical CPSFS1A
  (congenital contractures, cervical/limb pterygia, scoliosis, and vertebral/carpal/tarsal
  fusions) and autosomal dominant spondylocarpotarsal synostosis without prominent
  pterygia — notably, p.Ser243del has presented as both DA8/CPSFS1A and AD SCT across
  families (PMID:28205584). The autosomal recessive biallelic MYH3 disorder (CPSFS1B)
  and the parent grouping term (MONDO:0020937) are distinct entities.
review_notes: >-
  Primary autosomal dominant CPSFS1A and MYH3-spondylocarpotarsal clinical/mechanistic
  studies (PMID:27381093, PMID:28205584, PMID:32767732) establish direct human
  phenotype, radiographic/molecular diagnostic, and postnatal paraspinal TGF-beta
  signaling evidence, while fiber cross-bridge kinetics on Prolonged Actomyosin
  Interaction and Myofibril Assembly and Stability Defect remain graded INDIRECT from
  allelic MYH3 distal arthrogryposis models (PMID:32799913) pending direct biophysical
  characterization of CPSFS1A alleles.

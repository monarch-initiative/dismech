differential_diagnoses:
- name: Freeman-Sheldon syndrome (DA2A)
  description: >-
    The severe end of the MYH3 distal arthrogryposis spectrum, with facial contractures
    and congenital scoliosis but without the carpal and tarsal fusions that define
    CPSFS. Three recurrent alleles explain most cases.
  evidence:
  - reference: PMID:25256237
    reference_title: Genotype-phenotype relationships in Freeman-Sheldon syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "MYH3 mutations were found in 43/46 (93%) kindreds, with three mutations \n(p.T178I, p.R672C, and p.R672H) explaining 39/43 (91%) of cases."
    explanation: >-
      Establishes the recurrent-allele architecture of DA2A, which is the practical
      basis for distinguishing it from CPSFS on sequencing.
- name: Sheldon-Hall syndrome (DA2B)
  description: >-
    Moderate-severity MYH3 distal arthrogryposis, again without the CPSFS bony fusions.
  evidence:
  - reference: PMID:38856159
    reference_title: Bi-allelic variants in MYH3 cause recessively-inherited arthrogryposis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous variants in MYH3 have been identified to \ncause the dominantly-inherited distal arthrogryposis conditions, Freeman-Sheldon \nsyndrome, Sheldon-Hall syndrome, and multiple pterygium syndrome."
    explanation: >-
      Lists the dominant MYH3 conditions that must be separated from CPSFS1A clinically,
      since all are heterozygous MYH3.
- name: Spondylocarpotarsal synostosis syndrome (FLNB)
  disease_term:
    preferred_term: spondylocarpotarsal synostosis syndrome
    term:
      id: MONDO:0010094
      label: spondylocarpotarsal synostosis syndrome
  description: >-
    The closest mimic, and the reason the naming is confusing: it produces the same
    vertebral, carpal and tarsal fusions but is usually a recessive FLNB defect rather
    than a MYH3 one. Contractures and pterygia are less prominent. Already curated in
    dismech as Spondylocarpotarsal_Synostosis_Syndrome.
- name: Multiple pterygium syndrome, Escobar variant (CHRNG)
  description: >-
    Overlaps closely enough to be diagnosed as CPSFS clinically; CHRNG is the more
    common cause in a molecularly solved pterygium cohort, with MYH3 the main
    alternative to exclude. Already curated in dismech as
    Autosomal_Recessive_Multiple_Pterygium_Syndrome.
discussions:
- discussion_id: cpsfs1a_mechanism_is_borrowed_from_da_alleles
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the enhanced-actin-affinity mechanism established for DA1 and DA2B alleles
    actually hold for the MYH3 alleles that cause CPSFS1A, and if so what makes those
    alleles produce bony fusion rather than contractures alone?
  attaches_to:
  - pathophysiology#Prolonged Actomyosin Interaction
  - pathophysiology#Axial and Appendicular Bony Fusion
  rationale: >-
    Every mechanistic evidence item on the molecular and cellular nodes of this entry
    comes from work on DA1 (F437I) and DA2B (A234T) alleles in transgenic Drosophila
    and on purified myosin - not from CPSFS alleles, and not from human muscle. The
    causal chain from motor defect to contracture is therefore borrowed from allelic
    neighbours. That borrowing is defensible for the shared contracture phenotype, but
    it explains nothing about the feature that actually defines CPSFS: the vertebral,
    carpal and tarsal fusions.

    There is now a concrete candidate for the distinct-allele-class possibility, and it
    is the reason this gap is not merely an absence of evidence. PMID:34440395 states
    that MYH3 variants on the pterygium end of the spectrum have been associated with
    loss of function, and names the recurrent CPSFS/spondylocarpotarsal allele as
    c.-9+1G>A, a 5'UTR splice variant. A 5'UTR splice lesion cannot produce enhanced
    actin affinity in the motor domain, so if it is the representative CPSFS allele then
    the chain on this entry describes a different disorder than the one it is filed
    under. The same paper's other MYH3 patient carried a head-region missense, and notes
    that motor-domain missense is a frequent pathogenic class - so the honest position
    is two competing allele classes, not a settled answer either way. Both are carried
    structurally on the MYH3 Motor Domain Dysfunction node, as SUPPORT and REFUTE.
    Curators should not read the INDIRECT gradings on this entry as a formality.
  proposed_experiments:
  - experiment_id: cpsfs1a_allele_biochemistry
    name: CPSFS allele biochemistry against DA alleles
    description: >-
      Express CPSFS1A-associated MYH3 alleles alongside F437I and A234T and compare
      actin affinity, ATPase rate and in vitro motility. Include c.-9+1G>A, which the
      biochemical assay cannot address directly and which needs an expression-level
      readout instead - that asymmetry is itself the point.
    would_support:
    - pathophysiology#Prolonged Actomyosin Interaction
    supporting_outcome:
    - >-
        CPSFS alleles show the same enhanced actin affinity and reduced ATPase rate as
        the DA alleles, placing the skeletal difference downstream of this node.
    refuting_outcome:
    - >-
        CPSFS alleles show normal actin affinity and ATPase kinetics, in which case the
        borrowed DA mechanism on this node needs replacing rather than annotating.
notes: >-
  Scope: MONDO:0008338 is the autosomal dominant form (CPSFS1A). The recessive form
  (CPSFS1B) and the parent term contractures, pterygia, and variable skeletal fusions
  syndrome (MONDO:0020937) are separate concepts; the parent appears in dismech today
  only as a differential_diagnoses entry on Autosomal_Recessive_Multiple_Pterygium_Syndrome
  and is not curated in its own right.
review_notes: >-
  Curated in an environment with no outbound access to PubMed, Crossref or OLS, so
  every reference here was already present in references_cache/ and nothing new could
  be fetched. Three things a reviewer should weigh.

  First, there is no CPSFS-specific clinical series among the citable sources. The only
  source naming CPSFS is PMID:38856159, whose own subject is a recessive distal
  arthrogryposis family, so phenotype and treatment evidence leans on allelic MYH3
  conditions and is graded INDIRECT wherever the source speaks about a neighbouring
  condition rather than CPSFS. DIRECT is reserved for the handful of claims a source
  makes about CPSFS itself - the inheritance split, MYH3 causation, the defining bony
  abnormality and the congenital contractures.

  Second, the mechanism is genuinely contested and the entry carries both sides rather
  than picking one. The molecular chain rests on motor-domain missense alleles studied
  in Drosophila and purified protein; PMID:34440395 reports loss of function on the
  pterygium end of the spectrum and a recurrent 5'UTR splice allele on the CPSFS side.
  Those appear as REFUTE items on the initiating node, with the same paper's
  head-region-missense observation as the counterweight. Do not collapse this to one
  reading without new evidence.

  Third, MONDO:0008338 was absent from cache/mondo/terms.csv and from the diseaseterm
  enum cache, and OLS was unreachable, so that one CURIE could not be validated locally
  and its two generated cache rows could not be produced. It comes from the stub's
  enrich-stubs MONDO extract; CI, or any curator with network, resolves it. Prevalence
  is omitted because no CPSFS1A figure was citable, and no ISDS skeletal category or
  OMIM mapping is asserted because neither was verifiable from the cache - the ISDS
  nosology (PMID:31633310) is cached abstract-only and does not mention MYH3.

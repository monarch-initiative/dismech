  evidence:
  - reference: PMID:28205584
    reference_title: A postnatal role for embryonic myosin revealed by MYH3 mutations that alter TGFβ signaling and cause autosomal dominant spondylocarpotarsal synostosis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Plasmids harboring the p.Phe645Cys and p.Ser243del substitutions both produced full length proteins, extended by the GFP tag, when probed with embryonic myosin antibody (Fig. 3A). However, the p.Ser243del protein was less stable when compared to WT MYH3 (p = 0.003) and the p.Phe645Cys protein (p = 0.01) (Fig. 3C)."
    explanation: >-
      Directly characterizes human autosomal dominant MYH3 SCT/DA8 motor-domain
      alleles (including p.Ser243del, shared between DA8/CPSFS1A and AD SCT) in
      transfected human cells, showing full-length protein synthesis with reduced
      stability for p.Ser243del.
  - reference: PMID:32799913
    reference_title: Drosophila myosin mutants model the disparate severity of type 1 and type 2B distal arthrogryposis and indicate an enhanced actin affinity mechanism.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "molecular modeling \nstudies, which indicate that the F437I and A234T mutations affect specific amino \nacid residue interactions within the myosin motor domain that may alter \ninteraction with actin and nucleotide"
    explanation: >-
      Locates the lesion in the motor domain's actin and nucleotide interfaces in two
      allelic DA mutations.
  - reference: PMID:34440395
    reference_title: "The Clinical and Genotypic Spectrum of Scoliosis in Multiple Pterygium Syndrome: A Case Series on 12 Children."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense is not present in gnomAD and affects the head region of MYH3, a domain where pathogenic missense variants are frequently observed"
    explanation: >-
      Confirms that motor-domain (head region) missense variants remain a frequent
      pathogenic class in MYH3 pterygium/scoliosis presentations.
  downstream:
  - target: Prolonged Actomyosin Interaction
    causal_link_type: DIRECT
    description: >-
      Tighter actin binding with slower nucleotide turnover keeps myosin heads attached
      through a larger fraction of the cycle.
  - target: Reduced Embryonic-Myosin-Dependent TGF-beta Signaling
    causal_link_type: DIRECT
    description: >-
      Dominant MYH3 head and rod variants suppress canonical Smad3 and non-canonical

    evidence_source: HUMAN_CLINICAL
    snippet: "Bracing and serial spine casting appear to be beneficial for a few \nyears; non-fusion spinal instrumentation may be needed to modulate more severe \ncurves during growth and spontaneous spine fusions may occur in those cases."
    explanation: >-
      Names non-fusion instrumentation as the escalation for severe early-onset curves

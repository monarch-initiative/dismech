  - preferred_term: MYH3
    term:
      id: hgnc:7573
      label: MYH3
  molecular_functions:
  - preferred_term: embryonic myosin motor activity
    term:
      id: GO:0000146
      label: microfilament motor activity
    modifier: DECREASED

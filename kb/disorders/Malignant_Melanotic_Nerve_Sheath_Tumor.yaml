- name: T2 hypointensity
  modality: MRI
  imaging_finding_term:
    preferred_term: T2 hypointensity
    term:
      id: NCIT:C182326
      label: Hypointensity
  description: >-
    Dark signal on T2-weighted images, which an imaging review and three case reports describe as
    usual (one of them as iso- to hypointense), two of them relating it to melanin, but which a
    2023 series found to predominate in only 2 of its tumours with MRI, against 10 that were
    predominantly hyperintense. A 2020 imaging review of head and neck nerve sheath tumours says the
    tumour shows hypointense signal on T2-weighted images; a 2018 report of an intracranial tumour
    says such tumours usually appear iso- to hypointense on T2-weighted sequences because of the
    melanin stored in their cells; a 2018 report on intracranial tumours of this kind calls them
    T2-hypointense, by which they can be differentiated from schwannomas, classically
    T2-hyperintense; and a 2024 case report says MRI typically shows low T2 signal, which it relates
    to melanin, and cites a series in which 70.6% had a low T2 signal. The 2023 series graded signal
    against muscle, and calls T2 hyperintensity non-specific.

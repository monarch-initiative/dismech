notes: >-
  The entry follows the WHO name. MONDO files the tumour under schwannoma with the older name
  (melanotic neurilemmoma, MONDO:0002558) and keeps a parallel class under malignant peripheral
  nerve sheath tumour (MONDO:0003863), recorded here as a close match. MONDO also has a mediastinal
  term (MONDO:0003894); the 2014 series counts three mediastinal tumours among 40 without describing
  them as a separate form, so the entry has no mediastinal subtype row. MONDO files the psammomatous
  subtype's term (MONDO:0003862) under MONDO:0003863 rather than under the entry's own term, and
  gives the isolated subtype's term (MONDO:0035136) no definition; the entry takes isolated to mean
  outside the Carney complex, which the cited sources call sporadic.

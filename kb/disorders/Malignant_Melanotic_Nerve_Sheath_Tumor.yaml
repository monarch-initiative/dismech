  - >-
    SMARCB1: the uncommon epithelioid variant arises from a pre-existing schwannoma and harbours
    SMARCB1 mutations, whereas SMARCB1 has been reported intact in this tumour; the case report's
    own tumour kept nuclear INI1 (SMARCB1) staining.

progression:
- phase: Outcome
  description: >-
    Local recurrence and metastasis are common, and histology predicts them poorly. In the 2014
    series of 40, the 26 patients with follow-up (mean 55 months) had local recurrences in 35% and
    metastases in 44%, and 7 died of the disease; only a mitotic rate above 2 per 10 high-power
    fields correlated with metastasis, and a 2022 case report's discussion notes that over half the
    tumours that metastasized did not show increased mitoses. A 2018 review notes that strict
    criteria of malignancy are not well developed, although a combination of worrisome histological
    features, among them brisk mitotic activity and necrosis, raises concern for aggressive
    behaviour. A 2025 case report's tumour showed no recurrence on MRI at 18 months and stayed free
    of recurrence for 24 months after gross total resection. A 2024 systematic review gives pooled
    rates of 42% for local recurrence, 27% for distant metastasis and 26% for mortality. Recurrences
    have been documented up to 20 years after diagnosis, so long-term follow-up is recommended.
  evidence:
  - reference: PMID:24145644
    reference_title: >-
      Malignant melanotic schwannian tumor: a clinicopathologic, immunohistochemical, and gene
      expression profiling study of 40 cases, with a proposal for the reclassification of "melanotic
      schwannoma".
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical follow-up (26/40, 65%; mean 55 mo; range, 1 to 300 mo) showed local recurrences in
      9/26 (35%) and metastases in 11/26 (44%) patients.
    explanation: >-
      Recurrence and metastasis in the 26 of 40 patients with follow-up.
  - reference: PMID:24145644
    reference_title: >-

epidemiology:
- name: Age at onset and diagnosis
  description: >-
    In the cited series and reviews the mean or median age is 38 to 43 years, over a wide range: in
    a 2014 series of 40 tumours the mean age was 41 years (range 11 to 84); in a 2024 systematic
    review the mean age at diagnosis was 43 years both in the authors' own patients and in the
    published cases, whose incidence peaked between the fourth and fifth decades of life; and a
    2023 review gives a median age at presentation of 38 years and says the tumour is often
    diagnosed in young adults between 10 and 40 years. Orphanet lists onset in childhood,
    adolescence, adulthood and old age for the isolated form. The Isolated subtype row gives an
    average age at presentation of 33.2 years for sporadic tumours, from a 2022 case report's
    discussion.
  minimum_value: 11
  maximum_value: 84
  mean_range: '41-43'
  unit: years
  notes: >-
    The minimum and maximum are the range of the 2014 series, and the mean range spans the
    two overall means (41 and 43 years); the 2023 review's figure is a median, and the 2022 case
    report's 33.2-year average is for sporadic tumours.
  evidence:
  - reference: PMID:24145644
    reference_title: >-
      Malignant melanotic schwannian tumor: a clinicopathologic, immunohistochemical, and gene
      expression profiling study of 40 cases, with a proposal for the reclassification of "melanotic
      schwannoma".
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The tumors occurred in 18 male and 22 female patients (mean age 41 y; range, 11 to 84 y)
    explanation: >-
      Mean age 41 years, range 11 to 84, in the 2014 series of 40 tumours.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors' patients and those in the literature had the same mean age at diagnosis
      (43 years).
    explanation: >-
      Mean age at diagnosis 43 years, in the authors' own patients and in the published cases, in a
      2024 systematic review.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT

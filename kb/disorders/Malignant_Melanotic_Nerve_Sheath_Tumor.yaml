progression:
- phase: Outcome
  description: >-
    Local recurrence and metastasis are common, how often they are found depends on the series and
    on how long its patients were followed, and histology predicts them poorly. In the 2014 series
    of 40, the 26 patients with follow-up (mean 55 months) had local recurrences in 9 (35%) and
    metastases in 11 (which the abstract gives as 44%), and 7 died of the disease. Of the 12 of
    31 patients followed in a 2023 single-centre series (mean 4.8 years), 6 were disease-free, 2 had
    recurrence or metastases and 4 had died of metastases; the other 19 were second-opinion cases.
    In a 2005 series of 13 patients with nonpsammomatous tumours, 7 of the 11 followed for over
    2 years (mean 5.9 years) had no recurrence or metastasis. In a 1999 series of 5 spinal tumours
    followed for 3 to 7 years, 4 behaved malignantly and 3 patients died of metastases; in its
    review of 57 published cases, its own 5 among them, 15% recurred and 26.3% metastasized, and
    53% of those followed for more than 5 years were free of disease against 67.5% of those followed
    for less (the abstract adds that 20 further cases had no follow-up). A 2020 systematic review
    found local recurrence or metastasis in 19 of the 37 published extramedullary spinal cases with
    information on metastasis, and calls follow-up across its source studies highly variable. A
    2024 systematic review gives pooled rates of 42% for local recurrence, 27% for distant
    metastasis and 26% for mortality, and at its authors' institution 5 of 8 patients developed
    metastasis, 6 a long-term recurrence and 5 died. A 2025 case report's patient had no recurrence
    on MRI at 18 months and, in its discussion, none for 24 months after the gross total resection;
    its abstract counts the 18 months from the gross total resection, but its case description
    counts them from the first, partial operation five months earlier and calls that scan the most
    recent. Only a mitotic rate above 2 per 10 high-power fields correlated with metastasis in the
    2014 series, and a 2022 case report's discussion, citing one study in which the same threshold
    correlated with metastases, adds that over half the tumours that eventually metastasized did not
    show increased mitoses; the primary tumours of the 1999 series showed no high mitotic count,
    atypia or necrosis although 4 of 5 behaved malignantly; and in a 2020 series of 7 cranial and
    spinal tumours, one of the two recurrences its abstract reports came from a tumour without
    mitoses. A 2018 review notes that strict criteria of malignancy are not well developed, although
    a combination of worrisome histological features, among them brisk mitotic activity and
    necrosis, raises concern for aggressive behaviour, and a 2025 case report's discussion says that
    apart from increased mitotic activity no morphological feature that reliably predicts behaviour
    has yet been identified. Recurrences have been documented up to 20 years after diagnosis, so
    long-term follow-up is recommended.
  evidence:
  - reference: PMID:24145644
    reference_title: >-
      Malignant melanotic schwannian tumor: a clinicopathologic, immunohistochemical, and gene

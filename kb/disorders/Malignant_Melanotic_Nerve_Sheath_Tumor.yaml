    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI revealed a lesion in the posterior fossa, effacing the median aperture and cisterna
      magna, which was hyperintense on T1-weighted imaging and isointense on T2-weighted imaging,
      with significant blooming on susceptibility-weighted imaging.
    explanation: >-
      A different signal in one intracranial tumour.
  - reference: PMID:41030562

    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next generation sequencing testing was completed in 84.6% (11/13) of cases, and 72.7% (8/11)
      had PRKAR1A loss-of-function mutation.
    explanation: >-
      PRKAR1A loss-of-function mutations in 8 of 11 sequenced cases, in a 2026 conference abstract
      that does not say whether they were germline or somatic.

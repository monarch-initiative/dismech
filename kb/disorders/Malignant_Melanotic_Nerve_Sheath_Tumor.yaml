      The histopathological and immunohistochemical appearance of CCSs resembles those of PMSs.
    explanation: >-
      The resemblance, in the case report's abstract.
  - reference: PMID:36639332
    reference_title: >-
      Mesenchymal tumours with melanocytic expression: a potential pitfall in the differential

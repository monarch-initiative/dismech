- name: Clear cell sarcoma
  disease_term:
    preferred_term: clear cell sarcoma
    term:
      id: MONDO:0002926
      label: clear cell sarcoma
  description: >-
    Clear cell sarcoma, also called malignant melanoma of soft tissue, has a histological and
    immunohistochemical appearance that resembles that of psammomatous melanotic schwannoma; a
    2023 review lists both among the mesenchymal tumours that closely mimic melanoma. A 2006 case
    report describes a clear cell sarcoma of the S1 nerve root first diagnosed as psammomatous
    melanotic schwannoma; despite total resection, the patient returned with disseminated disease at
    the 18-month follow-up visit.
  distinguishing_features:
  - >-
    Clear cell sarcoma is defined by EWSR1-ATF1 or EWSR1-CREB1 fusions, according to the background
    of a 2026 cohort study of clear cell and dendritic or histiocytic cell sarcomas whose abstract
    does not mention this tumour; the abstracts of the 2006 case report and the 2023 review name
    no test that separates the two.
  evidence:
  - reference: PMID:17341045
    reference_title: >-
      Is clear cell sarcoma a malignant form of psammomatous melanotic schwannoma? Case report.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors present a case of clear cell sarcoma (CCS) in which the tumor originated in the
      S-1 nerve root and had been previously diagnosed as psammomatous melanotic schwannoma (PMS).
    explanation: >-
      The 2006 case: a clear cell sarcoma of the S1 nerve root first diagnosed as psammomatous
      melanotic schwannoma.
  - reference: PMID:17341045
    reference_title: >-
      Is clear cell sarcoma a malignant form of psammomatous melanotic schwannoma? Case report.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The new histopathological diagnosis was CCS (malignant melanoma of soft tissue). Despite total
      resection, the patient returned with disseminated disease at the 18-month follow-up visit.
    explanation: >-
      Its revised diagnosis and its dissemination despite total resection.
  - reference: PMID:17341045
    reference_title: >-
      Is clear cell sarcoma a malignant form of psammomatous melanotic schwannoma? Case report.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL

- name: Adjuvant radiotherapy
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: adjuvant radiotherapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  description: >-
    Radiotherapy after resection, conventionally fractionated in most reports, given in reported
    cases after subtotal or gross total resection or after positive margins, and offered for
    aggressive histological features or significant residual tumour; a 2023 review says radiation
    therapy, with or without chemotherapy, may be considered for residual disease or unresectable
    tumours. Its potential benefit remains unclear, there are no formal guidelines and its use is
    controversial, and the available data are limited and come largely from case reports and small
    series. Of six patients irradiated after subtotal and three after gross total resection in a
    systematic review of 63 patients, four developed local recurrence and four metastatic disease,
    as a 2026 series reports it. The findings of a 2024 systematic review of 8 institutional and
    63 published patients suggest a trend favouring gross total resection alone or subtotal
    resection with radiation therapy over subtotal resection alone, with similar mortality
    regardless. Single cases that the 2026 series and a 2021 case report cite in their discussions
    had no evidence of recurrence 16 months after a gross total resection that was followed by
    55 Gy, and none after 2 years of follow-up when 60 Gy followed positive margins, while in a
    2013 case report, local recurrence and lung metastatic dissemination appeared six months after
    40 Gy given after total resection; in a 2020 series of 7, three patients were offered adjuvant
    radiotherapy and one showed a good clinical response.
  evidence:
  - reference: PMID:42559342
    reference_title: >-
      Stereotactic Radiosurgery for Malignant Melanotic Nerve Sheath Tumors: A Case Series.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL

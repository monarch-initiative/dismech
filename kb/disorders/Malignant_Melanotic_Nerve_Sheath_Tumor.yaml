- name: Dumbbell-shaped spinal mass
  modality: MRI
  imaging_finding_term:
    preferred_term: dumbbell-shaped intradural extramedullary mass
  description: >-
    In the spine the tumour is usually an intradural extramedullary mass of dumbbell shape, an
    intraspinal and an extraspinal component joined by a narrower waist through a neural foramen;
    the 2023 series says that, as in its own study, most cases in a review of 45 case reports and
    series, which included 79 spinal tumours, are intradural extramedullary spinal lesions, with
    dumbbell morphology cited by the review's authors as a common feature. In the 2023 series all
    9 spinal tumours with MRI had this shape, 8 were circumscribed and 5 involved more than
    one level; 9 of its 12 tumours with MRI were spinal, and 6 of those 9 were in the lumbar or
    lumbosacral spine. The series concludes that the tumour usually presents as a
    T1-hyperintense, enhancing, dumbbell-shaped mass in the spine.
  located_in:
    preferred_term: spinal nerve root
    term:
      id: UBERON:0009623
      label: spinal nerve root
  notes: >-
    Against conventional schwannoma the shape is shared: like other spinal nerve sheath tumours, the
    series' tumours were mostly well-circumscribed intradural extramedullary dumbbell-shaped masses,
    but unlike non-melanotic spinal schwannoma they were T1-hyperintense, and over half showed bone
    destruction and multilevel involvement. The classic signs of a nerve sheath tumour were
    uncommon: a fascicular sign in 2 of the 12, a split fat sign in 1 and a target sign in none.
    Against other T1-hyperintense spinal tumours, the series argues that a dumbbell shape with
    diffuse T1 hyperintensity should raise suspicion of this tumour: myxopapillary ependymoma and
    spinal paraganglioma may also have T1-hyperintense elements from haemorrhage, but theirs are
    more focal and they lack the dumbbell shape. The finding is left unbound. On 21 Nov 2026 the
    labels of the local NCIT build contained dumbbell only in Dumbbell Ossification
    (NCIT:C124528), and dumb-bell, dumb bell and hourglass in none. An OLS search of HP the same
    day, which matches more than labels, returned, for dumbbell, Dumbbell-shaped metaphyses
    (HP:0002810), Dumbbell-shaped humerus (HP:0005009), Dumbbell-shaped femur
    (HP:0006375), Dumbbell-shaped long bone (HP:0000947), Malignant melanotic nerve sheath tumor
    (HP:0020338) and the PATO quality dumbbell-shaped (PATO:0001876); for dumb-bell and for dumb
    bell, only Preretinal hemorrhage (HP:0025240); and for hourglass, nothing. None of them is an
    imaging finding of a soft tissue mass.
  evidence:

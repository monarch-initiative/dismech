- name: Meningeal melanocytoma
  disease_term:
    preferred_term: meningeal melanocytoma
    term:
      id: MONDO:0016746
      label: meningeal melanocytoma
  description: >-
    Both tumours are neural crest-derived and generally positive for S100 and melanocytic markers
    such as Melan-A and HMB-45, so immunohistochemistry is often of little help, and their sites
    overlap: melanocytoma occurs especially at the cervical and thoracic spinal levels, in the
    posterior cranial fossa and in Meckel's cave, and this tumour frequently on cranial nerves,
    spinal nerve roots and the paraspinal sympathetic chain. Of the 25 tumours first diagnosed as
    melanotic schwannoma in the 2010 series, 4 were reclassified as melanocytoma and 2 could not be
    classified with certainty as either; in the 2026 cohort, integrating histological and molecular
    findings changed the diagnosis of two tumours classed histologically as this tumour to
    melanocytoma.
  distinguishing_features:
  - >-
    Growth and contents: by the criteria the 2010 series used, this tumour is circumscribed, often
    encapsulated, and may contain psammoma bodies or fat, and in that series 8 of its 9 tumours held
    psammoma bodies and 1 large empty vacuoles resembling fat. By the same criteria, melanocytoma is
    circumscribed but not encapsulated and made of nests or fascicles of cells with little nuclear
    atypia. The series' discussion adds that psammoma bodies are generally absent in melanocytic
    tumours, although one psammomatous melanoma, arising in an intradermal nevus, has been
    described.
  - >-
    S100 and basement membrane: in the 2010 series S100 was diffuse and strong in all nine tumours
    of this kind but only focal in the melanocytomas. Stains for basement membrane (reticulin,
    collagen IV and laminin) outlined individual tumour cells in 4 of the 9 and showed a biphasic
    pattern, around single cells in some areas and around nests in others, in 5; in the
    melanocytomas they outlined nests and vessels but not single cells. On biopsy material the
    biphasic pattern might lead to the tumour being misread as melanocytic.
  - >-
    GNAQ: a GNAQ mutation supports a melanocytic lesion. In the 2010 series, with the authors'
    earlier study of leptomeningeal melanocytic lesions included, GNAQ mutations were 100% specific
    for those lesions against this tumour, with a sensitivity of 43%, and lack of a mutation does
    not rule a melanocytic lesion out. The 2010 series tested exon 5 of GNAQ; a 2022 case report's
    discussion notes that an important study comparing this tumour with melanocytic lesions
    sequenced only exon 5 of GNAQ, so that hotspot mutations at codons T96, Y101 and R183, in exons
    2 and 4, could not have been detected in it.
  - >-
    Reported GNAQ and GNA11 mutations in tumours diagnosed as this one: a 2015 review cites a series
    of 14 such tumours in which one carried a GNAQ and one a GNA11 mutation, both with DNA
    methylation profiles that clustered with melanocytomas, which suggests they may have been
    melanocytomas; and a 2017 case report found a GNA11 mutation in a mesenteric tumour of this kind
    with some histological features of melanocytoma (a term its introduction uses for tumours mainly
    of the skin or mucosal surfaces). From that finding its authors conclude that a gene defect
    cannot be used as the sole factor to classify the different melanotic tumours.
  - >-
    DNA methylation: the 2026 cohort confirms that meningeal melanocytic tumours and this tumour are
    epigenetically distinct, but its discussion adds that the analysis may be limited by high
    melanin content, which precludes successful profiling in a substantial proportion of cases.
  - >-
    Mitotic activity: this tumour may show low mitotic activity and mimic a benign melanocytoma. In
    the 2026 cohort the mitotic index of its tumours of this kind was below 0.5 per mm2 in
    6, between 0.5 and 1.4 in 5 and 1.5 or more in 1; these ranges match the mitotic thresholds that
    the WHO uses, with necrosis and CNS invasion, to grade meningeal melanocytic tumours.
  evidence:

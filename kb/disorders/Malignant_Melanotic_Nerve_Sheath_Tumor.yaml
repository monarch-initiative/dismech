- name: Cellular blue nevus
  disease_term:
    preferred_term: cellular blue nevus
    term:
      id: MONDO:0006680
      label: blue nevus
  description: >-
    A dermal melanocytic tumour that this tumour may histologically closely resemble. The
    2010 series says the histological differential between melanotic schwannoma, primary
    leptomeningeal melanocytic lesions and cellular blue nevus can be challenging, and reclassified
    one tumour first diagnosed elsewhere as a peripherally located melanotic schwannoma as a
    cellular blue nevus.
  distinguishing_features:
  - >-
    Architecture: a primary dermal lesion with a biphasic architecture, especially at its base, of
    nodules and sheets of pale oval melanocytes mixed with pigmented dendritic melanocytes in
    sclerotic stroma; these are the criteria the 2010 series used.
  - >-
    GNAQ: codon 209 mutations are reported in up to 83% of blue nevi, so the 2010 series suggests
    GNAQ testing can also help with a peripherally located tumour of this kind; its blue nevus
    carried one, and none of its melanotic or conventional schwannomas did.
  evidence:
  - reference: PMID:20865267
    reference_title: >-
      Improved discrimination of melanotic schwannoma from melanocytic lesions by combined
      morphological and GNAQ mutational analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, melanotic schwannomas may histologically closely resemble leptomeningeal
      melanocytomas and cellular blue nevi
    explanation: >-
      That this tumour may closely resemble cellular blue nevus, from the 2010 series' introduction.
  - reference: PMID:20865267
    reference_title: >-
      Improved discrimination of melanotic schwannoma from melanocytic lesions by combined
      morphological and GNAQ mutational analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL

  relationship_type: SOMATIC_DRIVER
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    Germline in most patients with the Carney complex, in whom, according to GeneReviews, a
    heterozygous germline PRKAR1A pathogenic variant establishes the molecular diagnosis; somatic
    loss-of-function mutations are reported in sporadic and in Carney complex-associated tumours.
    The cached ClinGen file classifies PRKAR1A only for Carney complex, type 1 (MONDO:0008057), a
    different disease, so no gene-disease validity assertion is recorded here.

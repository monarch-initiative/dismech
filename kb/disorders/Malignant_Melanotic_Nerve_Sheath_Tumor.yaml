    hypointense on T1-weighted and hyperintense on T2-weighted images, with variable
    enhancement, but an intracranial tumour in a 2025 case report was hyperintense
    on T1-weighted and isointense on T2-weighted images, and the discussion of a
    2025 report of a cervical tumour notes that melanin makes intramedullary
    melanotic neoplasms bright on T1-weighted and dark on T2-weighted images. In the

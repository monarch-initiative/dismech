  description: >-
    Reported in a single 2026 case report: a woman with recurrent disease and multiple lung
    metastases was treated first with four cycles of doxorubicin, ifosfamide and bevacizumab, and
    after her neck mass had grown by January 2022 she received anlotinib (12 mg a day for 14 days of
    each 21-day cycle) with 52.5 Gy in 15 fractions to the neck mass. The authors report
    progression-free survival of more than 32 months and no grade 3 or higher adverse events; the
    case description also records a new brain metastasis in March 2024, treated with stereotactic
    radiotherapy while anlotinib continued, and a new liver metastasis with growing lung lesions in
    October 2024. The authors describe the report as a single case without systematic biomarker
    profiling.

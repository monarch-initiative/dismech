mappings:
  mondo_mappings:
  - term:
      id: MONDO:0003863
      label: malignant melanocytic neoplasm of the peripheral nerve sheath
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO keeps this class under malignant peripheral nerve sheath tumor (MONDO:0017827), parallel
      to the entry's own term, melanotic neurilemmoma (MONDO:0002558), under schwannoma; its exact
      synonyms include malignant melanotic peripheral nerve sheath tumor. The WHO classifications
      treat the tumour as one entity, formerly called melanotic schwannoma and distinct from
      schwannoma, while MONDO splits it between a schwannoma class and a malignant peripheral nerve
      sheath tumor class, so the relation is recorded as close rather than exact.
definitions:
- name: WHO renaming and classification
  definition_type: OTHER
  scope: >-
    WHO Classification of Soft Tissue and Bone Tumours (2020) and of Central Nervous System Tumours
    (2021)
  description: >-
    The 2020 WHO classification of soft tissue tumours and the 2021 WHO classification of central
    nervous system tumours replaced the name melanotic schwannoma with malignant melanotic nerve
    sheath tumour, and treat it as a distinct tumour among the cranial and paraspinal nerve tumours
    rather than a variant of schwannoma.
  evidence:
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This change is reflected in both the recently published 2020 World Health Organization (WHO)
      Classification of tumors of the Soft Tissue and the 2021 WHO Classification of The Central
      Nervous System in which, the term melanocytic Schwannoma has been changed to MMNST.
    explanation: >-
      The renaming in both WHO classifications, in a 2023 review.
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This change also signifies the recognition of MMNST as a distinct tumor entity, under the
      umbrella of cranial and paraspinal nerve tumors and is no longer considered a variant of
      conventional Schwannoma.
    explanation: >-
      A distinct tumour rather than a schwannoma variant, in the same review.
has_subtypes:
- name: Psammomatous
  display_name: Psammomatous malignant melanotic nerve sheath tumor
  subtype_term:
    preferred_term: psammomatous malignant melanotic nerve sheath tumor
    term:
      id: MONDO:0003862
      label: melanotic psammomatous malignant peripheral nerve sheath tumor
  classification: histological
  description: >-
    One of the two histological forms, with psammoma bodies and sometimes fat; it is the form
    more often seen with the Carney complex, in which a 2023 review says the tumour is often
    described as heavily pigmented, calcified and with a high incidence of metastatic disease. In
    the 2014 series of 40 tumours, those with and without psammoma bodies did not differ
    clinically or pathologically. In a 1990 series of the psammomatous form, 11 of its 40 tumours
    arose on posterior spinal nerve roots and 11 in the alimentary tract, and 3 of the 31
    patients died of metastasis.
  evidence:
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are two major histologic subtypes of MMNST, namely psammomatous and nonpsammomatous
      MMNST.
    explanation: >-
      The two histological forms, in a 2023 review.

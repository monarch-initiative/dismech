- name: Craniospinal irradiation for leptomeningeal spread
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: craniospinal irradiation
    term:
      id: NCIT:C116437
      label: Craniospinal Irradiation
  description: >-
    For leptomeningeal spread, reported in a single 2022 case report: a left foraminal L5/S1 tumour,
    given no adjuvant radiotherapy because there was no evidence of residual tumour after gross
    total resection, recurred locally and spread through the leptomeninges along the neuraxis within
    four postoperative months. Craniospinal irradiation was given after a ventricular drain was
    placed, and the patient was discharged three months later, with residual distal lower-limb
    weakness in the abstract's words and wheelchair-bound in the full text's account of the case.
    The authors suggest craniospinal radiation with focal boosts for recurrent tumours or
    leptomeningeal spread, and say radiotherapy is often offered only after local recurrence or
    distant metastases, for palliative symptom control.

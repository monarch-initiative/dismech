  description: >-
    Studies of chemotherapy are limited; the discussions of two case reports describe low response
    rates and, in one, no benefit in mortality, in the other a limited impact on it. The
    2026 discussion reports that ifosfamide with doxorubicin is the most reported regimen for
    metastatic disease, and the 2021 one that in two cases refractory to it carboplatin with
    etoposide led to partial remission. In a 2026 case report, doxorubicin, ifosfamide and
    bevacizumab failed to control the disease, possibly because grade IV myelosuppression required
    dose reduction (the case description records grade IV myelosuppression in December 2021 and a
    change to doxorubicin with bevacizumab), and cisplatin, etoposide and sintilimab were later
    followed by further progression. In a 2013 case report, local recurrence and lung metastatic
    dissemination six months after radiotherapy were treated by lung segmentectomy, chemotherapy
    with dacarbazine, cisplatin and interferon, and radiosurgery; the patient developed febrile
    neutropenia and died three months later of respiratory complications, respiratory or infectious
    in the case description's words.

- name: Stereotactic radiosurgery
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: stereotactic radiosurgery
    term:
      id: NCIT:C15358
      label: Stereotactic Radiosurgery
  description: >-
    Radiosurgery after subtotal or gross total resection, one of them a repeat resection with
    positive margins, or as the only treatment. A 2026 series of four patients, which the authors
    say includes one patient whose final diagnosis was not typical of this tumour, gave 27 Gy in
    three fractions in two patients, 40 Gy in five fractions with 25 Gy to a margin in one, and
    24 Gy in three fractions in one who declined resection; the series' abstract instead describes
    all four as treated after partial or gross total resection. All tumours remained controlled,
    without metastasis, at follow-up the series gives as 1.6, 1.8, 3.5 and 6.0 years in its abstract
    and as 1.8, 1.9, 3.5 and 6.0 years in its discussion, while its case description gives the
    latest follow-up of the patient who declined resection as 2.4 years. All patients tolerated
    treatment well in the authors' words, though adverse events were not graded systematically;
    pre-existing neuropathic symptoms may worsen transiently with swelling after radiosurgery. In
    one patient, the tumour was stable at 3.5 years, when she had developed lower-limb numbness, toe
    weakness and neuropathic pain; her sciatic symptoms later improved, though foot pain, thought to
    be musculoskeletal rather than neuropathic, persisted. The authors suggest that radiosurgery may
    be a reasonable option for selected patients, and note the small sample, retrospective design,
    lack of systematic adverse-event grading and single definitively treated patient.

definitions:
- name: WHO renaming and classification
  definition_type: OTHER
  scope: >-
    WHO Classification of Soft Tissue and Bone Tumours (2020) and of Central Nervous System Tumours
    (2021)
  description: >-
    The 2020 WHO classification of soft tissue tumours and the 2021 WHO classification of central
    nervous system tumours replaced the name melanotic schwannoma with malignant melanotic nerve
    sheath tumour, redefining it as a potentially aggressive entity after case series and long-term
    data showed frequent metastasis and recurrence, and treat it as a distinct tumour among the
    cranial and paraspinal nerve tumours rather than a variant of schwannoma.
  evidence:
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, over the past decade, multiple case series and long-term data led to its
      reclassification into a malignant tumor. This was a result of many observations of high
      incidence of metastases and recurrences, contributing to a poorer prognostic outlook compared
      to what have been initially observed.
    explanation: >-
      The reason for the reclassification: frequent metastasis and recurrence in case series and
      long-term data, in a 2023 review.
  - reference: PMID:41030562
    reference_title: >-
      Cervical Malignant Melanotic Nerve Sheath Tumor with retained PRKAR1A expression and a
      clinically benign course: a case report and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously classified as benign melanotic schwannomas, they were redefined as a potentially
      aggressive entity in the 2020 WHO classification of soft tissue tumors and later included in
      the 2021 WHO CNS classification.
    explanation: >-
      The redefinition as a potentially aggressive entity, from a 2025 case report's background.
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This change is reflected in both the recently published 2020 World Health Organization (WHO)
      Classification of tumors of the Soft Tissue and the 2021 WHO Classification of The Central
      Nervous System in which, the term melanocytic Schwannoma has been changed to MMNST.
    explanation: >-
      The renaming in both WHO classifications, in a 2023 review.
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This change also signifies the recognition of MMNST as a distinct tumor entity, under the
      umbrella of cranial and paraspinal nerve tumors and is no longer considered a variant of
      conventional Schwannoma.
    explanation: >-
      A distinct tumour rather than a schwannoma variant, in the same review.
has_subtypes:
- name: Psammomatous
  display_name: Psammomatous malignant melanotic nerve sheath tumor
  subtype_term:
    preferred_term: psammomatous malignant melanotic nerve sheath tumor
    term:
      id: MONDO:0003862
      label: melanotic psammomatous malignant peripheral nerve sheath tumor
  mappings:
    ncit_mappings:
    - term:
        id: NCIT:C6910
        label: Malignant Melanotic Psammomatous Peripheral Nerve Sheath Tumor
      mapping_predicate: skos:exactMatch
      mapping_source: NCIT
      mapping_justification: >-
        MONDO cross-references the subtype's term (MONDO:0003862) to this class, which NCIT defines
        as a malignant peripheral nerve sheath tumor with malignant cells that contain melanin and
        form psammoma bodies, and files under Malignant Melanotic Peripheral Nerve Sheath Tumor
        (NCIT:C4748).
  classification: histological
  description: >-
    One of the two histological forms, with psammoma bodies and sometimes fat; it is the form
    more often seen with the Carney complex, in which a 2023 review says the tumour is often
    described as heavily pigmented, calcified and with a high incidence of metastatic disease. In
    the 2014 series of 40 tumours, those with and without psammoma bodies did not differ
    clinically or pathologically. In a 1990 series of the psammomatous form, 11 of its 40 tumours
    arose on posterior spinal nerve roots and 11 in the alimentary tract, and 3 of the 31
    patients died of metastasis.
  evidence:
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are two major histologic subtypes of MMNST, namely psammomatous and nonpsammomatous
      MMNST.
    explanation: >-
      The two histological forms, in a 2023 review.
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Psammomatous MMNST is associated with carney's complex, which are neoplastic cells containing
      psammoma bodies. ... These will sometimes be associated with adipose-like cells or
      vacuolations within the cytoplasm.
    explanation: >-
      Psammoma bodies, and sometimes adipose-like cells, in the psammomatous form, in a 2023 review;
      the omission is a citation marker.
  - reference: PMID:41030562
    reference_title: >-
      Cervical Malignant Melanotic Nerve Sheath Tumor with retained PRKAR1A expression and a
      clinically benign course: a case report and review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MMNSTs associated with Carney complex more frequently display psammomatous morphology
    explanation: >-
      The psammomatous form goes with the Carney complex more often, from a 2025 case report's
      discussion.
  - reference: PMID:24145644
    reference_title: >-
      Malignant melanotic schwannian tumor: a clinicopathologic, immunohistochemical, and gene
      expression profiling study of 40 cases, with a proposal for the reclassification of "melanotic
      schwannoma".
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinicopathologic features of tumors with and without psammoma bodies were identical.
    explanation: >-
      No difference between the two forms in the 2014 series of 40.
  - reference: PMID:2305928
    reference_title: >-
      Psammomatous melanotic schwannoma. A distinctive, heritable tumor with special associations,
      including cardiac myxoma and the Cushing syndrome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor sites included posterior spinal nerve roots (11 tumors), alimentary tract (11 tumors),
      and bone (three tumors).
    explanation: >-
      Sites in the 1990 series of the psammomatous form.
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MMNST seen in carney's complex is quite distinct as it is associated with the presence of
      psammoma bodies and adipose-like cell. Moreover, it is often described as heavily pigmented,
      calcified, with a high incidence of metastatic disease.
    explanation: >-
      How the tumour in the Carney complex is described, with psammoma bodies and adipose-like
      cells, in a 2023 review's Carney complex paragraph.
  - reference: PMID:2305928
    reference_title: >-
      Psammomatous melanotic schwannoma. A distinctive, heritable tumor with special associations,
      including cardiac myxoma and the Cushing syndrome.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients died, three (10%) as a result of metastasis.
    explanation: >-
      Deaths in the 1990 series of the psammomatous form: three of 31 patients from metastasis.

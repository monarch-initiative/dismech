      morphological and GNAQ mutational analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One lesion initially diagnosed elsewhere as a ‘peripherally located melanotic schwannoma’ was

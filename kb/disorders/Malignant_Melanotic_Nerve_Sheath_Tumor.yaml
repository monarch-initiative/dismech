differential_diagnoses:
- name: Conventional schwannoma
  disease_term:
    preferred_term: conventional schwannoma
    term:
      id: MONDO:0002546
      label: schwannoma
  description: >-
    A schwannoma without this tumour's melanocytic markers, Melan-A and HMB-45. The differential is
    difficult: in a 2010 series only 9 of 25 tumours first diagnosed as melanotic schwannoma kept
    that diagnosis on review, and 9 were reclassified as conventional schwannoma. Most of the
    malignant melanotic nerve sheath tumours in a 2026 cohort had DNA methylation profiles
    compatible with or suggestive of schwannoma; two matched the methylation class of this tumour
    with the Heidelberg classifier, and none did with the Bethesda classifier.
  distinguishing_features:
  - >-
    Melanocytic markers and GFAP: a 2023 review says this tumour tends to stain for HMB-45 and
    Melan-A and to be negative for GFAP, which differentiates it from conventional schwannoma; a
    2012 review reports GFAP in a subset of schwannomas. The 2010 series did not keep its
    nine reclassified tumours as melanotic schwannoma because both Melan-A and HMB-45 were negative.
  - >-
    Architecture: the nine reclassified tumours showed frequent Antoni A and B areas, nuclear
    palisading, hyalinized vessels and wavy nuclei. A 2022 case report's discussion says this tumour
    generally lacks Antoni A and B regions and hyalinized vessels, although in the 2010 series some
    tumours of this kind showed nuclear palisading and one had Antoni A and B areas with Verocay
    bodies.
  - >-
    Pigment: all nine reclassified tumours held some focal, fine Schmorl-positive pigment, which the
    2010 series suggests is autophagosome-related, such as neuromelanin or lipofuscin, rather than
    melanin in true melanosomes, because Melan-A and HMB-45 were negative.
  - >-
    Gene expression: compared with schwannoma, this tumour showed downregulation of Schwann cell
    genes such as PMP22, PMP2 and MPZ and upregulation of genes related to melanin synthesis, as the
    2022 case report's discussion reports it.
  - >-
    Site and age: this tumour tends to occur on posterior spinal nerves and ganglia, while
    schwannomas may also involve other nerves, including cranial nerves, and it peaks a decade
    younger, in the same discussion.
  evidence:
  - reference: PMID:20865267
    reference_title: >-
      Improved discrimination of melanotic schwannoma from melanocytic lesions by combined
      morphological and GNAQ mutational analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fact that in only 9 of 25 cases the initial diagnosis melanotic schwannoma remained
      unchanged after review illustrates the difficult differential diagnosis with esp. conventional
      schwannoma and leptomeningeal melanocytic lesions.
    explanation: >-
      That only 9 of the series' 25 tumours kept the diagnosis on review, which its authors say
      illustrates the difficult differential diagnosis with conventional schwannoma and
      leptomeningeal melanocytic lesions.
  - reference: PMID:20865267
    reference_title: >-
      Improved discrimination of melanotic schwannoma from melanocytic lesions by combined
      morphological and GNAQ mutational analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine lesions initially diagnosed elsewhere as melanotic schwannoma were reclassified as
      conventional schwannomas. These lesions showed the typical histological features of
      schwannomas with frequent Antoni A and B areas, nuclear palisading, blood vessel hyalinization
      and wavy nuclei. We did not classify them as melanotic schwannoma, because positivity for both

treatments:
- name: Surgical resection
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: complete surgical resection with negative margins
    term:
      id: NCIT:C158758
      label: Resection
  description: >-
    There is no standard of care; the accepted approach for a localized tumour is complete resection
    with negative margins. In a 2024 systematic review two thirds of published patients had gross
    total resection, and recurrence-free, metastasis-free and overall survival did not differ
    significantly between treatment approaches, though the review sees a trend favouring gross total
    resection alone or subtotal resection with radiotherapy over subtotal resection alone. In the
    Carney complex, GeneReviews lists surgery to remove primary and metastatic tumours.
  target_mechanisms:
  - target: Melanotic Schwann Cell Tumour Growth
    treatment_effect: INHIBITS
    description: >-
      Resection removes the tumour; a 2022 case report's discussion cites a 20-year remission rate
      of 67% after total resection.
    evidence:
    - reference: PMID:37284154
      reference_title: >-
        Malignant melanotic nerve sheath tumor with PRKAR1A, KMT2C, and GNAQ mutations.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One study reports a 20-year remission rate of 67% with total resection
      explanation: >-
        Long remission after total resection, from a case report's discussion. INDIRECT: an outcome
        of the treatment, cited for the tissue it removes.
  evidence:
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Owing to the rarity of disease and variability in reported outcomes, there is no standard of
      care when it comes to the management of MMNST. Nonetheless, the accepted treatment strategy
      generally involves complete surgical resection with negative margins for localized tumors.
    explanation: >-
      No standard of care, and the accepted approach, in a 2023 review.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients underwent gross-total resection (GTR) (n = 41, 66.1%), followed by subtotal
      resection (STR) (n = 12, 19.4%), STR with radiation therapy (9.7%), and GTR with radiation
      therapy (4.8%).
    explanation: >-
      How published patients were treated, in a 2024 systematic review.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kaplan-Meier analyses showed no significant differences among treatment approaches in terms of
      recurrence-free, metastasis-free, and overall survival (p > 0.05).
    explanation: >-
      No significant survival difference between approaches in the review.
  - reference: PMID:37862711
    reference_title: >-

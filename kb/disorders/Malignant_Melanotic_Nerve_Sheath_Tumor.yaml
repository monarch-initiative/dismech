name: Malignant Melanotic Nerve Sheath Tumor
creation_date: '2026-11-21T03:10:00Z'
category: Neoplastic
categories:
- Rare Cancer
- Peripheral Nerve Sheath Tumor
synonyms:
- MMNST
- Melanotic schwannoma
- Melanocytic schwannoma
- Melanotic neurilemmoma
- Malignant melanotic schwannian tumor
- Melanotic malignant peripheral nerve sheath tumor
description: >-
  Malignant melanotic nerve sheath tumour (MMNST) is a rare tumour of Schwann cells that make
  melanin. It arises most often from spinal or paraspinal nerve roots, and also from the sympathetic
  chain and the gastrointestinal tract, mostly in adults; a paraspinal tumour presents as a mass
  with pain or with signs of nerve root or spinal cord compression. Formerly called melanotic
  schwannoma, it was renamed and redefined as a potentially aggressive tumour in the 2020 WHO
  classification of soft tissue tumours and the 2021 WHO classification of central nervous system
  tumours, after case series and long-term data showed frequent metastasis and recurrence, and it is
  treated as a distinct tumour rather than a variant of schwannoma. In a series of 40, 35% of the
  patients with follow-up had a local recurrence and 44% metastases, and only a mitotic rate above 2
  per 10 high-power fields correlated with metastasis. Some patients have the Carney complex, an
  autosomal dominant syndrome usually caused by germline PRKAR1A variants, and PRKAR1A loss of
  function is also reported in sporadic tumours; losing this regulatory subunit leaves protein
  kinase A unopposed. Complete resection is the accepted treatment, but there is no standard of
  care.

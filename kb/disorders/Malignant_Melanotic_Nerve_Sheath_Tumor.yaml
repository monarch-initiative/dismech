imaging_findings:
- name: T1 hyperintensity
  modality: MRI
  imaging_finding_term:
    preferred_term: T1 hyperintensity
    term:
      id: NCIT:C182328
      label: Hyperintensity
  description: >-
    Bright signal on T1-weighted images. In a 2023 single-centre series of 31 patients,
    pre-treatment MRI was available for 12, and 10 of their tumours were hyperintense to skeletal
    muscle on T1-weighted images, with bright elements making up more than two-thirds of the tumour
    in 7 and between one-third and two-thirds in 3; the other 2 were isointense. The series calls
    intrinsic T1 hyperintensity a distinguishing feature of many of its tumours, presumably due to
    their melanin, and a 2019 review relates it to the paramagnetic free radicals in melanin.
  notes: >-
    What the signal cannot separate. The 2023 series could not reliably tell whether the
    T1 hyperintensity of its tumours was due to haemorrhage, melanin or both. Fat and haemorrhage
    are the other common causes of T1 hyperintensity in soft tissue tumours; the series says fat
    seldom poses a challenge to detect, but that in its experience haemorrhage and melanin can be
    difficult to tell apart. Melanoma is in the differential: a 2018 report of an intracranial
    tumour, in Meckel's cave, says the differential should include other melanotic lesions such as
    malignant melanoma, pigmented meningioma and medulloblastoma, and that the final preoperative
    diagnosis is difficult because the imaging characteristics are subtle and inconsistent. The
    signal is not universal: a 2024 case report calls its tumour's low T1 and high T2 signal
    atypical.
  evidence:
  - reference: PMID:36069993
    reference_title: >-
      Magnetic resonance imaging features and clinical course of malignant melanotic nerve sheath
      tumors: single institution experience over two decades.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This IRB-approved retrospective study searched 31 patients (20 male: 11 female, mean age
      48; range 15-76) with histologically confirmed MMNST in a single tertiary cancer center over
      22 years. Pre-treatment MR was available in 12 patients and evaluated by two radiologists in
      consensus regarding lesion location, size, morphology, signal characteristics, contrast
      enhancement, local invasion, and presence of classic signs of peripheral nerve sheath tumors.
    explanation: >-
      The 2023 series: 31 patients, pre-treatment MRI read in 12.
  - reference: PMID:36069993
    reference_title: >-
      Magnetic resonance imaging features and clinical course of malignant melanotic nerve sheath
      tumors: single institution experience over two decades.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MR signal intensities of the lesions on T1-weighted (T1w), T2-weighted (T2w) and post
      gadolinium T1w sequences were compared with those of skeletal muscle.
    explanation: >-
      What the series compares signal with: skeletal muscle.
  - reference: PMID:36069993
    reference_title: >-
      Magnetic resonance imaging features and clinical course of malignant melanotic nerve sheath

    term:
      id: NCIT:C131060
      label: Checkpoint Blockade Immunotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  description: >-
    Reported in a single 2021 case report: a retrocaval tumour, presumptively diagnosed as
    metastatic melanoma, was treated with pembrolizumab every three weeks before definitive
    resection. Pain improved after the first dose, the tumour was stable after four cycles, its
    maximum standardized uptake on FDG-PET fell from 8.2 to 5.9, and the resected tumour showed
    extensive necrosis that the authors suggest may be a treatment effect. The authors conclude that
    anti-PD-1 therapy may be beneficial but remains investigational.

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0003863
      label: malignant melanocytic neoplasm of the peripheral nerve sheath
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO keeps this class under malignant peripheral nerve sheath tumor (MONDO:0017827), parallel
      to the entry's own term, melanotic neurilemmoma (MONDO:0002558), under schwannoma; its exact
      synonyms include malignant melanotic peripheral nerve sheath tumor. The WHO classifications
      treat the tumour as one entity, formerly called melanotic schwannoma and distinct from
      schwannoma, while MONDO splits it between a schwannoma class and a malignant peripheral nerve
      sheath tumor class, so the relation is recorded as close rather than exact.
  ncit_mappings:
  - term:
      id: NCIT:C6970
      label: Melanotic Schwannoma
    mapping_predicate: skos:exactMatch
    mapping_source: NCIT
    mapping_justification: >-
      MONDO cross-references the entry's term, melanotic neurilemmoma (MONDO:0002558), to this
      class. NCIT defines it as a rare, grossly pigmented nerve sheath tumour of cells with the
      features of Schwann cells that contain melanosomes and are positive for melanoma markers, and
      files it under Nerve Sheath Neoplasm (NCIT:C4972).
  - term:
      id: NCIT:C4748
      label: Malignant Melanotic Peripheral Nerve Sheath Tumor
    mapping_predicate: skos:closeMatch
    mapping_source: NCIT
    mapping_justification: >-
      NCIT keeps this class, a rare variant of malignant peripheral nerve sheath tumor with
      malignant cells that contain melanin, under Malignant Peripheral Nerve Sheath Tumor
      (NCIT:C3798), parallel to Melanotic Schwannoma, as MONDO does with MONDO:0003863, to which
      MONDO cross-references it. The WHO classifications treat the tumour as one entity, so the
      relation is recorded as close rather than exact.

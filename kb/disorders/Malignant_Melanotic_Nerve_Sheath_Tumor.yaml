    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These tumors typically arise from the paraspinal nerve roots or sympathetic chain. ... Other
      extremely rare primary tumor locations include intracranial, visceral, soft tissue, and skin.
    explanation: >-
      Where this tumour typically arises, and skin as an extremely rare primary site, in a
      2023 review.
  notes: >-
    MONDO has no class for the pigmented variant: a case-insensitive search of all labels and exact,
    related, narrow and broad synonyms in the local MONDO build (release 2026-09-01, obsolete

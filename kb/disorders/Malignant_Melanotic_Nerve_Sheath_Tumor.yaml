inheritance:
- name: Autosomal dominant predisposition (Carney complex)
  inheritance_term:
    preferred_term: autosomal dominant
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A 2022 case report's discussion states that the majority of tumours are sporadic. Others arise
    in people with the Carney complex, an autosomal dominant multiple neoplasia syndrome in which,
    according to GeneReviews, about 70% of those diagnosed have an affected parent and about 30% a
    de novo pathogenic variant, and in which a psammomatous melanotic schwannoma occurs in an
    estimated 10%. How often the complex is present varies widely with the series: 17 of 31 patients
    (55%) in a 1990 series of psammomatous tumours, 2 of the 40 patients in the 2014 series with
    known Carney complex, and 19 of the published patients (31.1%) in a 2024 systematic review; a
    2025 case report's discussion cites over 50% in some series and under 5% in others.

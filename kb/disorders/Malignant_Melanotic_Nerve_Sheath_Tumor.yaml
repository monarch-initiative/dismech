    explanation: >-
      The criteria for cellular blue nevus that the series used.
  - reference: PMID:20865267
    reference_title: >-
      Improved discrimination of melanotic schwannoma from melanocytic lesions by combined
      morphological and GNAQ mutational analysis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GNAQ codon 209 mutations in blue nevi have been reported in up to 83% ... This high mutation
      frequency suggests that GNAQ mutational analysis can also be useful in the differential
      diagnosis of peripherally located melanotic schwannoma with blue nevus.
    explanation: >-
      The rate of GNAQ mutation in blue nevi and what the series draws from it.
  - reference: PMID:20865267

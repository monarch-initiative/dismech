- phase: Late recurrence and metastatic spread
  description: >-
    Recurrence and metastasis can come late, and spread is reported most often to the lungs. The
    authors of a 1999 series of spinal tumours warn that the tumour may recur or metastasize after
    more than 5 years, even without overt malignant histological features, and a 2023 review cites
    case series showing delayed metastases and relapses when patients were followed for long enough;
    recurrences have been documented up to 20 years after diagnosis (the Outcome phase). A 2025 case
    report, citing earlier reports, names the lungs, liver and bones as the commonest sites of
    metastasis, and in its discussion calls the lungs the most common and advises regular lung
    assessment during follow-up.

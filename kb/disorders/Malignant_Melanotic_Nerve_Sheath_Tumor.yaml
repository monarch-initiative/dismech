      The histological differential diagnosis between melanotic schwannoma, primary leptomeningeal
      melanocytic lesions and cellular blue nevus can be challenging.
    explanation: >-
      The differential named in the 2010 series' abstract.
  - reference: PMID:20865267
    reference_title: >-

- name: Primary leptomeningeal melanoma
  disease_term:
    preferred_term: primary leptomeningeal melanoma
    term:
      id: MONDO:0003761
      label: leptomeningeal melanoma
  description: >-
    The malignant end of the circumscribed primary melanocytic tumours of the leptomeninges, which
    run from melanocytoma through lesions of intermediate grade to melanoma. It occurs along the
    neuraxis, slightly more often in the spinal cord and posterior fossa, and most often in adults,
    particularly men, with a peak in the fifth decade. In the 2026 cohort one tumour diagnosed
    histologically as melanoma was this tumour on integrated diagnosis.
  distinguishing_features:
  - >-
    Reticulin: in a 2015 review's illustrated case of primary leptomeningeal melanoma, reticulin
    fibres encircled nests of tumour cells rather than individual cells, indicating melanocytic
    rather than schwannian differentiation, and a GNAQ Q209L mutation fully supported a primary
    melanocytic tumour of the CNS over a metastatic cutaneous melanoma or this tumour.
  - >-
    GNAQ and GNA11: in published series GNAQ mutations are found in about 17% and GNA11 mutations in
    about 29% of primary leptomeningeal melanomas, according to the 2015 review, which notes
    elsewhere that the number of primary leptomeningeal melanomas analysed is limited.
  - >-
    PRAME: proposed as a potential adjunctive marker in the differential diagnosis of primary CNS
    melanocytic tumours, but not judged by the 2026 cohort, whose two melanomas were PRAME-negative;
    its authors say this precludes definitive conclusions on PRAME in distinguishing primary
    leptomeningeal melanoma from melanocytoma or this tumour.

    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MMNST exhibited downregulation of genes involved in Schwann cell function, e.g.,
      PMP22, PMP2, and MPZ, while genes related to melanin synthesis were upregulated in MMNST
      compared to schwannoma.
    explanation: >-

- name: Malignant peripheral nerve sheath tumour
  disease_term:
    preferred_term: malignant peripheral nerve sheath tumour
    term:
      id: MONDO:0017827
      label: malignant peripheral nerve sheath tumor
  description: >-
    Conventional malignant peripheral nerve sheath tumours usually arise from peripheral nerves or
    extraneural soft tissue and are commonly seen in neurofibromatosis type 1, in which this tumour
    only rarely occurs, according to a 2022 case report's discussion.
  distinguishing_features:
  - >-
    Histology and pigment: monomorphic spindle cells in broad, intersecting herringbone fascicles,
    alternating hyper- and hypocellular areas, a high mitotic count and geographic necrosis; these
    tumours also generally lack pigment and are negative for melanocytic markers.
  - >-
    SMARCB1: the uncommon epithelioid variant arises from a pre-existing schwannoma and harbours
    SMARCB1 mutations, whereas SMARCB1 has been reported intact in this tumour; the case report's
    own tumour kept nuclear INI1 (SMARCB1) staining.
  evidence:
  - reference: PMID:37284154
    reference_title: >-
      Malignant melanotic nerve sheath tumor with PRKAR1A, KMT2C, and GNAQ mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to MMNST, conventional MPNST usually arise from peripheral nerves or extraneural
      soft tissue and are commonly seen in neurofibromatosis type 1 (NF1) ... while MMNST only
      rarely occurs in NF1
    explanation: >-
      Site and the neurofibromatosis type 1 setting, in the 2022 case report's discussion.
  - reference: PMID:37284154
    reference_title: >-
      Malignant melanotic nerve sheath tumor with PRKAR1A, KMT2C, and GNAQ mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MPNST histologic features include monomorphic spindle cells with broad, intersecting,
      herringbone fascicles, alternating hyper- and hypocellular areas, a high mitotic count, and
      geographic necrosis ... MPNST also generally lack pigment and are negative for melanotic
      markers.
    explanation: >-
      Histology and pigment, in the 2022 case report's discussion.
  - reference: PMID:37284154
    reference_title: >-
      Malignant melanotic nerve sheath tumor with PRKAR1A, KMT2C, and GNAQ mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The uncommon epithelioid variant of MPNST arises from a pre-existing schwannoma and harbors
      SMARCB1 mutations ... whereas SMARCB1 has been reported to be intact in MMNST
    explanation: >-
      SMARCB1 in the epithelioid variant and in this tumour, in the 2022 case report's discussion.
  - reference: PMID:37284154
    reference_title: >-
      Malignant melanotic nerve sheath tumor with PRKAR1A, KMT2C, and GNAQ mutations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      INI1 (SMARCB1) was positive in tumor cell nuclei.
    explanation: >-
      Retained INI1 (SMARCB1) in the case report's tumour.
  notes: >-
    MONDO places three terms for this tumour under malignant peripheral nerve sheath tumor:
    malignant melanocytic neoplasm of the peripheral nerve sheath (MONDO:0003863), melanotic
    psammomatous malignant peripheral nerve sheath tumor (MONDO:0003862) and malignant melanocytic
    peripheral nerve sheath tumor of mediastinum (MONDO:0004098). The row means the conventional and
    epithelioid tumours, not these. MONDO also has a mediastinal term in the schwannoma branch,
    mediastinal melanocytic neurilemmoma (MONDO:0003894), which the entry's notes name.
treatments:
- name: Surgical resection
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: complete surgical resection with negative margins
    term:
      id: NCIT:C158758
      label: Resection
  description: >-
    There is no standard of care; the accepted approach for a localized tumour is complete resection
    with negative margins. In a 2024 systematic review two thirds of published patients had gross
    total resection, and recurrence-free, metastasis-free and overall survival did not differ
    significantly between treatment approaches, though the review sees a trend favouring gross total
    resection alone or subtotal resection with radiotherapy over subtotal resection alone. In the
    Carney complex, GeneReviews lists surgery to remove primary and metastatic tumours.
  target_mechanisms:
  - target: Melanotic Schwann Cell Tumour Growth
    treatment_effect: INHIBITS
    description: >-
      Resection removes the tumour; a 2022 case report's discussion cites a 20-year remission rate
      of 67% after total resection.
    evidence:
    - reference: PMID:37284154
      reference_title: >-
        Malignant melanotic nerve sheath tumor with PRKAR1A, KMT2C, and GNAQ mutations.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One study reports a 20-year remission rate of 67% with total resection
      explanation: >-
        Long remission after total resection, from a case report's discussion. INDIRECT: an outcome
        of the treatment, cited for the tissue it removes.
  evidence:
  - reference: PMID:38025185
    reference_title: >-
      Malignant Melanotic Nerve Sheath Tumors: A Review of Clinicopathologic and Molecular
      Characteristics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Owing to the rarity of disease and variability in reported outcomes, there is no standard of
      care when it comes to the management of MMNST. Nonetheless, the accepted treatment strategy
      generally involves complete surgical resection with negative margins for localized tumors.
    explanation: >-
      No standard of care, and the accepted approach, in a 2023 review.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients underwent gross-total resection (GTR) (n = 41, 66.1%), followed by subtotal
      resection (STR) (n = 12, 19.4%), STR with radiation therapy (9.7%), and GTR with radiation
      therapy (4.8%).
    explanation: >-
      How published patients were treated, in a 2024 systematic review.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kaplan-Meier analyses showed no significant differences among treatment approaches in terms of
      recurrence-free, metastasis-free, and overall survival (p > 0.05).
    explanation: >-
      No significant survival difference between approaches in the review.
  - reference: PMID:37862711
    reference_title: >-
      Surgical management of malignant melanotic nerve sheath tumors: an institutional experience
      and systematic review of the literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings from this study suggest a trend favoring the use of GTR alone or STR with
      radiation therapy over STR alone.
    explanation: >-
      The trend the review reads into its results.
  - reference: PMID:20301463
    reference_title: >-
      Carney Complex.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      surgery to remove primary and/or metastatic PMS
    explanation: >-
      The GeneReviews treatment for the tumour in the Carney complex.
references:
- reference: PMID:20301463
  title: "Carney Complex."
  tags:
  - GeneReviews
notes: >-
  The entry follows the WHO name. MONDO files the tumour under schwannoma with the older name
  (melanotic neurilemmoma, MONDO:0002558) and keeps a parallel class under malignant peripheral
  nerve sheath tumour (MONDO:0003863), recorded here as a close match. MONDO also has a mediastinal
  term (MONDO:0003894); the 2014 series counts three mediastinal tumours among 40 without describing
  them as a separate form, so the entry has no mediastinal subtype row. MONDO files the psammomatous
  subtype's term (MONDO:0003862) under MONDO:0003863 rather than under the entry's own term, and
  gives the isolated subtype's term (MONDO:0035136) no definition; the entry takes isolated to mean
  outside the Carney complex, which the cited sources call sporadic.

pathophysiology:
- name: PRKAR1A Loss of Function
  description: >-
    A lesion often reported in this tumour: loss of function of PRKAR1A, which encodes the type 1A
    regulatory subunit of protein kinase A. A 2023 review states that somatic PRKAR1A
    loss-of-function mutations occur in both sporadic and Carney complex-associated tumours. How
    often it is found varies: in a 2026 conference abstract of 13 patients, 8 of the 11 sequenced
    cases had a PRKAR1A loss-of-function mutation, without saying whether germline or somatic; in
    the 2014 series PRKAR1A protein was lost in 7 of 20 tumours stained; and a 2025 case report's
    background notes that not all tumours show PRKAR1A loss and that sporadic tumours frequently
    retain its expression. In the Carney complex the predisposing lesion is usually a heterozygous
    germline PRKAR1A variant.

- name: Confluent T2-hypointense bands
  modality: MRI
  imaging_finding_term:
    preferred_term: confluent bands of T2 hypointensity
    term:
      id: NCIT:C182326
      label: Hypointensity
  description: >-
    Confluent bands of low T2 signal within the tumour, seen in half of the 12 tumours with MRI in
    the 2023 series, which calls them a feature not previously described in nerve sheath tumours and
    likens them to the collagenous components of desmoid tumours. In some tumours, histology showed
    bands of collagen next to melanin-containing tumour cells, potentially accounting for the
    low-signal bands, but the series could not confirm this by correlating imaging and histology
    side by side.

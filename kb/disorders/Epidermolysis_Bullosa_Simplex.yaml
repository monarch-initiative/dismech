name: Epidermolysis Bullosa Simplex
creation_date: '2026-03-10T00:00:00Z'
category: Mendelian
description: >-
  Epidermolysis bullosa simplex (EBS) is the most common form of EB,
  characterized by intraepidermal blistering within the basal cell layer.
  Most cases are caused by dominant-negative mutations in KRT5 or KRT14
  encoding keratins 5 and 14 in basal keratinocytes. Blisters generally heal
  without significant scarring. Subtypes range from localized palmoplantar
  blistering to severe generalized forms with herpetiform blistering, and
  include EBS with muscular dystrophy caused by PLEC mutations. Beyond the two
  keratins and plectin, four further genes reach the same clinical picture:
  DST (loss of the hemidesmosomal inner plaque),
  EXPH5 (disordered keratinocyte vesicle trafficking), KLHL24 (a stabilized
  ubiquitin-ligase receptor that degrades keratin 14 without any keratin
  mutation), and CD151. Two subtypes blister above the basal layer rather
  than within it, through loss of the desmosomal plaque proteins plakophilin
  1 (PKP1) or desmoplakin (DSP); MONDO files these under this entry's term
  through suprabasal epidermolysis bullosa simplex, and they are curated here
  as suprabasal rows with their own mechanism node.
parents:
- Dermatological Disease
- Genetic Disease

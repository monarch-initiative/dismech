- name: EBS Severe (formerly Dowling-Meara)
  display_name: EBS, generalized severe (EBS-gen sev; formerly Dowling-Meara)
  subtype_term:
    preferred_term: epidermolysis bullosa simplex, generalized severe
    term:
      id: MONDO:0007550
      label: epidermolysis bullosa simplex 1A, generalized severe
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0030489
        label: epidermolysis bullosa simplex 2A, generalized severe
      mapping_predicate: skos:closeMatch
      mapping_source: MONDO
      mapping_justification: >-
        The KRT5-side term for the same clinical subtype; EBS1A
        (MONDO:0007550) carries MONDO's KRT14 association and EBS2A
        (MONDO:0030489) the KRT5 one. Recorded as a close match for the same
        reason as the localized and intermediate rows.
  description: >
    Grouped herpetiform blistering, palmoplantar keratoderma, and nail
    dystrophy. The most severe keratin-associated form of EBS. Blistering
    tends to improve with age, likely due to the suprabasal switch from
    K5/K14 to K1/K10 during keratinocyte differentiation reducing
    dependence on mutant basal keratins. Improvement with age is common
    in all variants of EBS but is not invariable. The pathognomonic
    transmission electron microscopy (TEM) finding is tonofilament
    (keratin) clumping in basal cells. Laryngeal involvement may occur.
    Caused by heterozygous dominant-negative variants in either KRT14 or
    KRT5, typically in the central rod domain.
  genes:
  - preferred_term: KRT14
    term:
      id: hgnc:6416
      label: KRT14
  - preferred_term: KRT5
    term:
      id: hgnc:6442

has_subtypes:
- name: EBS Localized (formerly Weber-Cockayne)
  display_name: EBS localized (EBS-loc; formerly Weber-Cockayne)
  subtype_term:
    preferred_term: epidermolysis bullosa simplex 1C, localized
    term:
      id: MONDO:0007551
      label: epidermolysis bullosa simplex 1C, localized
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0030527
        label: epidermolysis bullosa simplex 2C, localized
      mapping_predicate: skos:closeMatch
      mapping_source: MONDO
      mapping_justification: >-
        OMIM and MONDO split localized EBS by causal keratin gene. EBS1C
        (MONDO:0007551, OMIM 131800) carries MONDO's KRT14 gene association;
        EBS2C (MONDO:0030527, OMIM 619594) carries the KRT5 one. This row is
        the single clinical localized subtype and covers both routes, so the
        KRT5-side term is recorded here as a close match. Deliberately not an
        exact or narrow match, which would retire an uncurated concept from the
        curation queue.
  description: >
    Blistering mainly confined to hands and feet, exacerbated by heat and
    increased physical activity. The mildest form of EBS and one of its most
    frequent variants. Onset typically in infancy or early childhood. Caused by
    heterozygous dominant-negative variants in either KRT14 or KRT5, which OMIM
    and MONDO now code as two separate terms (EBS1C and EBS2C respectively)
    despite the same clinical picture. This row binds MONDO:0007551, the term
    that carries the Weber-Cockayne eponym together with the Orphanet
    localized-EBS and SNOMED cross-references, and records the KRT5-side term
    as a mapping.
  genes:
  - preferred_term: KRT14
    term:
      id: hgnc:6416
      label: KRT14
  - preferred_term: KRT5
    term:
      id: hgnc:6442
      label: KRT5
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:9804357
    reference_title: "Novel K5 and K14 mutations in German patients with the Weber-Cockayne variant of epidermolysis bullosa simplex."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report novel keratin 5 and 14 gene mutations in four unrelated German families with the localized subtype of the dominantly inherited blistering disease epidermolysis bullosa simplex Weber-Cockayne (MIM# 131800)"
    explanation: >-
      Ties this row's three identities together in one sentence: the localized
      subtype, the Weber-Cockayne eponym, and MIM 131800 - the OMIM number that
      MONDO:0007551 cross-references. Also shows that both KRT14 and KRT5
      variants produce the localized phenotype, and that it is dominantly
      inherited.
  - reference: PMID:7688477
    reference_title: "The genetic basis of Weber-Cockayne epidermolysis bullosa simplex."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that the mildest type of EBS, Weber-Cockayne, is also a disorder of these keratins"
    explanation: Supports describing the localized/Weber-Cockayne form as the mildest EBS type and places it in the same basal-keratin disease family as the generalized forms.
  - reference: PMID:26432462
    reference_title: "Novel sporadic and recurrent mutations in KRT5 and KRT14 genes in Polish epidermolysis bullosa simplex patients: further insights into epidemiology and genotype-phenotype correlation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent variants are: EBS, localised (EBS-loc) with blistering confined to the hands and feet"
    explanation: >-
      Supports both the frequency claim and the palmoplantar distribution. The
      sentence sits in the paper's introduction restating the established
      classification rather than reporting its own cohort, hence BACKGROUND.

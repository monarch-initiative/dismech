notes: >
  MONDO ANCHOR AND THE SUBTYPE SERIES. This entry's `disease_term`,
  MONDO:0017610 'epidermolysis bullosa simplex', is the EBS group term: its
  only asserted parent is MONDO:0019276, and every numbered EBS subtype
  concept resolves as one of its descendants. Fourteen are direct children;
  the two suprabasal concepts (MONDO:0011472 plakophilin deficiency and
  MONDO:0012323 lethal acantholytic epidermolysis bullosa) descend through
  MONDO:0015550 'suprabasal epidermolysis bullosa simplex', itself a direct
  child. The term is therefore at the right level to carry the subtype rows
  below, and the narrowMatch re-anchoring described in dismech#12184 does not
  apply to it.

  THE CAUSAL GENE SET. The GeneReviews Epidermolysis Bullosa Simplex chapter
  (PMID:20301543, 2022 update) establishes seven genes: KRT5, KRT14, PLEC,
  KLHL24, CD151, DST and EXPH5. PKP1 and DSP are curated here in addition. The
  chapter does not cover those two because it scopes itself to blistering
  within basal keratinocytes, whereas MONDO places both under this entry's
  term: its definitions describe them as suprabasal subtypes of epidermolysis
  bullosa simplex, and both descend through MONDO:0015550. Their cleavage
  plane and mechanism differ from the basal routes, so they are drawn as their
  own pathophysiology node rather than folded into the keratin and
  hemidesmosome chain.

  OMIM AND MONDO SPLIT THREE CLINICAL SUBTYPES BY KERATIN GENE. Localized,
  generalized intermediate and generalized severe EBS each have two MONDO
  terms, a 1x term carrying MONDO's KRT14 gene association and a 2x term
  carrying the KRT5 one, for the same clinical picture. Each is a single row
  binding the 1x term and recording the 2x term as a `skos:closeMatch` -
  deliberately not an exact or narrow match, which would retire an uncurated
  concept from the curation queue. The recessive pair is handled the other
  way: EBS 1D (KRT14) and EBS 2d (KRT5) are separate rows, because the two
  were established by separate reports with different phenotypic ranges, and
  the recessive KRT5 route was not reported at all until 2019.

  MONDO:0030535 CARRIES A LOWERCASE SUBTYPE LETTER. Its label is
  'epidermolysis bullosa simplex 2d, generalized, intermediate or severe,
  autosomal recessive', where every sibling in the series uses an uppercase
  letter (2A, 2B, 2C, 2E, 2F). The label is copied here exactly as MONDO
  publishes it, as term labels always are.

  MONDO:0012190 (EBS 7, CD151) IS CURATED ELSEWHERE. It has its own Disease
  entry, Epidermolysis_Bullosa_Simplex_7_With_Nephropathy_And_Deafness, which
  binds that term and CD151 (hgnc:1630). CD151 is named in this entry's
  description as one of the EBS genes but carries no `genetic:` record here: a
  second binding would add no coverage, and would leave a gene on this entry
  that no pathophysiology node reaches.

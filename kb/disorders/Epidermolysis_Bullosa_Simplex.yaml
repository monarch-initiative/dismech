  - reference: PMID:12925204
    reference_title: A usual frameshift and delayed termination codon mutation in keratin 5 causes a novel type of epidermolysis bullosa simplex with migratory circinate erythema.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

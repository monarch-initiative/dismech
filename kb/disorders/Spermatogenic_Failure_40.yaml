  description: >-
    Sperm concentration is moderately low in several patients but normal in
    others.
  phenotype_term:
    preferred_term: Oligozoospermia
    term:
      id: HP:0000798
      label: Oligozoospermia
  evidence:
  - reference: PMID:42875786
    reference_title: "Identification and splicing assessment of a novel homozygous CFAP65 splice-site variant associated with oligozoospermia and complete asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study investigated a novel homozygous CFAP65 splice-site variant identified in a consanguineous family in which the proband presented with oligozoospermia and complete asthenozoospermia."
    explanation: Oligozoospermia in a splice-site proband.
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semen analysis showed a reduced sperm count (5.3–6.9×106/mL) with 100% sperm immobility"
    explanation: Low count in one of three probands.
- category: Respiratory
  name: Recurrent respiratory infections
  description: >-
    Reported in two of three probands in one series (chronic wet cough, nasal
    obstruction, pneumonia), not confirmed by ciliary testing, and absent in
    the other reported patients. Evidence is weak; see the respiratory
    hypothesis.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these symptoms gradually developed into recurrent airway infections, bronchitis and rhinosinusitis"
    explanation: Recurrent airway infections in one proband.
  - reference: PMID:42477516
    reference_title: "A novel homozygous frameshift mutation in CFAP65 is associated with multiple morphological abnormalities of sperm flagella in a consanguineous Pakistani family."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on clinical history and chest X-ray, the affected individuals reported no chronic respiratory symptoms and had no situs inversus, suggesting an isolated sperm-specific phenotype."
    explanation: No respiratory disease in two homozygous brothers.
  - reference: PMID:39853433
    reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, the patients exhibited MMAF and infertility without respiratory symptoms."
    explanation: No respiratory symptoms in two further patients.
genetic:
- name: CFAP65
  association: Causal
  gene_term:
    preferred_term: CFAP65
    term:
      id: hgnc:25325
      label: CFAP65
  notes: >-
    Reported alleles are predominantly nonsense, frameshift and splice-site
    variants, homozygous or compound heterozygous, with one missense variant
    (p.Asn1007Lys) in trans with a frameshift. Biallelic CFAP65 variants
    accounted for 6.7% (3/45 families) of a severe asthenozoospermia cohort and
    6 of 88 probands in an MMAF cohort. ClinGen has not classified this
    gene-disease pair, so no validity tier is recorded.
  evidence:
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No biallelic deleterious variants of CFAP65 were detected in the control cohort of 637 individuals."
    explanation: Biallelic variants in three probands and none in 637 controls.
  - reference: PMID:31501240
    reference_title: "Biallelic mutations in CFAP65 cause male infertility with multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP65 homozygous mutations were identified in four unrelated consanguineous families, and CFAP65 compound heterozygous mutations were found in two unrelated cases with MMAF."
    explanation: Replication in six Chinese families.
  - reference: PMID:31571197
    reference_title: "A novel homozygous CFAP65 mutation in humans causes male infertility with multiple morphological abnormalities of the sperm flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our experimental observations on human subjects suggested that CFAP65 is involved in sperm flagellum structure and assembly and that loss-of-function mutations could lead to male infertility in humans by causing the MMAF phenotype."
    explanation: A further homozygous nonsense (p.Trp892*) proband with MMAF.
  - reference: PMID:42477516
    reference_title: "A novel homozygous frameshift mutation in CFAP65 is associated with multiple morphological abnormalities of sperm flagella in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous frameshift mutation in CFAP65 (c.582_587delinsCG; p.Q194Hfs*4) was identified."
    explanation: A Pakistani family extends the ancestry range.
animal_models:
- name: Cfap65 frameshift mouse
  species: Mouse
  genotype: Cfap65 CRISPR-Cas9 frameshift allele, homozygous
  publication: PMID:31501240
  description: >-
    Male mice homozygous for a CRISPR-induced frameshift in Cfap65 have sperm
    phenotypes consistent with human MMAF.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The mutant reproduces the human MMAF semen phenotype.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse sperm have a hooked head and longer flagellum than human sperm,
        so head and flagellar defects are scored on a different baseline.
    evidence:
    - reference: PMID:31501240
      reference_title: "Biallelic mutations in CFAP65 cause male infertility with multiple morphological abnormalities of the sperm flagella in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Remarkably, the phenotypes of Cfap65-mutated male mice were consistent with human MMAF."
      explanation: Authors' statement that the mutant matches human MMAF.
- name: Cfap65 knockout mouse
  species: Mouse
  genotype: Cfap65-/- (knockout), homozygous
  publication: PMID:39853433
  description: >-
    Knockout males have severe MMAF, acrosome and manchette defects and
    reduced sperm counts; females remain fertile. Respiratory cilia lose the
    C2a projection without overt disease, and on a pure C57BL/6 background
    over two-thirds of pups develop hydrocephalus, most dying before three
    weeks of age.
  modeled_mechanisms:
  - target: Disintegration of the Sperm Axonemal Central Apparatus
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: The same central apparatus proteins are lost from knockout and patient sperm.
    evidence:
    - reference: PMID:39853433
      reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In motile cilia/flagella of Cfap65−/− mice, the same CA components defects were also observed in the sperm flagella, without DMT proteins defects"
      explanation: Knockout sperm lose the same central apparatus components as patient sperm.
  - target: Defective Acrosome Biogenesis and Sperm Head Shaping
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Knockout spermatids show manchette, acrosome and nuclear condensation defects that match the head defects in patients.
    limitations: >-
      Manchette dynamics and protamine processing were examined only in mice;
      patients show the end result (thin or absent acrosomes, misshapen heads)
      but the developmental steps have not been observed in human testis.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse spermatid head shaping produces a hooked head, unlike the
        spatulate human head, so the hyper-constricted mouse head is not a
        direct counterpart of the tapered or small human head.
    evidence:
    - reference: PMID:39853433
      reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of CFAP65 caused disorganization of the sperm head-shaping microtubule structure and impaired protamine precursor removal, leading to nuclear condensation defects and poor assisted reproductive outcomes."
      explanation: Manchette and nuclear condensation defects in knockout spermatids.
  - target: Sperm Flagellar Axoneme and Mitochondrial Sheath Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Knockout flagella show complete axonemal disorganization.
    limitations: >-
      Knockout mice also develop hydrocephalus at high frequency on a
      C57BL/6 background, which has not been reported in patients.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: IMMATERIAL
      description: >-
        Hydrocephalus in knockout mice reflects ependymal cilia, which are
        outside this node; it does not bear on the flagellar claim but shows
        the mouse is not a clean model of the human whole-body phenotype.
    evidence:
    - reference: PMID:39853433
      reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The knockout mice displayed severe sperm flagellar defects (MMAF), high hydrocephalus incidence, but no significant impact on respiratory cilia."
      explanation: Severe flagellar defects in knockout males.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI is the only route to biological parenthood, and patient sperm can
    fertilize oocytes, but outcomes have been poor: three couples underwent
    two cycles each with fertilization rates of 22-69% and only biochemical
    pregnancies that miscarried, and ICSI outcomes for two further patients
    were also unfavorable. Head defects, acrosome hypoplasia and impaired
    nuclear condensation are the proposed reasons. Assisted oocyte
    activation and other strategies have been suggested but not reported.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection bypasses the flagellar defect but not the head and nuclear defects.
    evidence:
    - reference: PMID:31413122
      reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fertilisation rates ranged from 22.2% (2/9) to 69.2% (9/13)."
      explanation: Injected sperm with MMAF can fertilize oocytes.
  evidence:
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Each couple had undergone two ICSI cycles, but clinical pregnancy was not achieved."
    explanation: No clinical pregnancy in six ICSI cycles across three couples.
  - reference: PMID:39853433
    reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Unfortunately, the ICSI outcomes for the patients and Cfap65−/− mice were not favorable"
    explanation: Unfavorable ICSI outcomes in two further patients.
- name: Genetic Counseling
  description: >-
    Counselling on autosomal recessive recurrence and carrier testing of
    relatives once the familial CFAP65 alleles are known, including the
    expectation of poor ICSI outcomes.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding may also have important clinical implications for genetic and reproductive counselling of affected families."
    explanation: The authors name genetic and reproductive counselling as the application.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis. Probands have been identified by whole-exome
    sequencing with Sanger confirmation; minigene assays can confirm splice
    effects.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31501240
    reference_title: "Biallelic mutations in CFAP65 cause male infertility with multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted genetic analysis using whole-exome sequencing in 88 Han Chinese MMAF probands."
    explanation: Whole-exome sequencing identified the causal alleles.
- name: Semen Analysis
  description: >-
    Shows severe asthenozoospermia, usually complete immotility, with MMAF and
    often misshapen heads; sperm concentration may be low.
  evidence:
  - reference: PMID:42875786
    reference_title: "Identification and splicing assessment of a novel homozygous CFAP65 splice-site variant associated with oligozoospermia and complete asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Semen analysis showed a sperm concentration of 8.1 × 10⁶/mL, with total and progressive motility of 0%."
    explanation: Semen analysis reveals the motility defect.
- name: Transmission Electron Microscopy of Sperm
  description: >-
    Shows a 9+0 axoneme or disorganized doublets, poorly assembled
    mitochondrial sheath and, in many patients, thin or absent acrosomes.
  diagnosis_term:
    preferred_term: Transmission Electron Microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrastructural and immunostaining analyses of spermatozoa from two patients showed highly aberrant sperm morphology with severe defects such as acrosome hypoplasia, disruption of the mitochondrial sheath and absence of the central pair complex."
    explanation: Ultrastructure shows the combined head and flagellar lesion.

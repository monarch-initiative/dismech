mechanistic_hypotheses:
- hypothesis_group_id: cfap65_respiratory_cilia_spared
  hypothesis_label: CFAP65 loss disrupts sperm flagella but spares respiratory ciliary function
  status: EMERGING
  description: >-
    In knockout mice respiratory cilia lose the C2a projection but keep a
    normal 9+2 arrangement and show no respiratory disease, attributed to the
    lower structural demand of short cilia; ependymal cilia are partly
    affected and many mice develop hydrocephalus. Most patients have isolated
    infertility, including all those in the two most recent reports. Against
    this, two of three probands in the first report had chronic wet cough,
    nasal obstruction and pneumonia, one with later bronchitis and
    rhinosinusitis, but neither had ciliary biopsy or nasal nitric oxide
    testing, and one had normal sinus and chest CT. The refuting evidence is
    therefore weak and unconfirmed, and hydrocephalus has not been reported in
    patients.
  evidence:
  - reference: PMID:39853433
    reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The knockout mice displayed severe sperm flagellar defects (MMAF), high hydrocephalus incidence, but no significant impact on respiratory cilia."
    explanation: Respiratory cilia are functionally spared in knockout mice.
  - reference: PMID:39853433
    reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, the patients exhibited MMAF and infertility without respiratory symptoms."
    explanation: Two further patients without respiratory symptoms.
  - reference: PMID:42477516
    reference_title: "A novel homozygous frameshift mutation in CFAP65 is associated with multiple morphological abnormalities of sperm flagella in a consanguineous Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on clinical history and chest X-ray, the affected individuals reported no chronic respiratory symptoms and had no situs inversus, suggesting an isolated sperm-specific phenotype."
    explanation: No respiratory or laterality findings in two homozygous brothers.
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "F1: II-2 exhibited classic PCD-like symptoms from early life, including a positive history of chronic wet cough, nasal obstruction and pneumonia"
    explanation: >-
      One homozygous proband had a PCD-like respiratory history. No ciliary
      biopsy or nasal nitric oxide test was performed.
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "F2: II-2 also exhibited a positive history of chronic wet cough, nasal obstruction and pneumonia."
    explanation: A second proband with the same history, though his sinus and chest CT were normal.

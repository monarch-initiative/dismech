name: Spermatogenic Failure 40
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF40
- spermatogenic failure 40
- CFAP65-related multiple morphological abnormalities of the sperm flagella
- CFAP65-related asthenoteratozoospermia with acrosome hypoplasia
description: >-
  Spermatogenic failure 40 (SPGF40) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in CFAP65 (formerly CCDC108),
  which encodes a large testis-enriched cilia- and flagella-associated protein.
  CFAP65 is a structural component at the base of the C2a projection of the
  axonemal central apparatus; without it the C2a projection and the wider
  central apparatus disintegrate in the sperm flagellum. Almost all reported
  alleles are nonsense, frameshift or splice-site variants.

  Affected men have severe asthenoteratozoospermia, usually with completely
  immotile sperm and multiple morphological abnormalities of the sperm
  flagella (MMAF): absent, short, bent, coiled and irregular flagella with
  poorly assembled mitochondrial sheaths and a 9+0 axoneme lacking the
  central pair. Many patients also have acrosome hypoplasia and misshapen
  heads, reflecting a second role in acrosome biogenesis and in head shaping
  by the manchette. Sperm counts are normal to moderately low.

  Most patients have isolated infertility, but a few have reported chronic
  cough, sinusitis or pneumonia; in knockout mice respiratory cilia lose the
  C2a projection without overt disease, while many mice develop
  hydrocephalus. ICSI achieves fertilization, but reported pregnancy outcomes
  are poor.
disease_term:
  preferred_term: spermatogenic failure 40
  term:
    id: MONDO:0032859
    label: spermatogenic failure 40
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 618664; the CFAP65 gene entry
  is OMIM 614270. ClinGen has no gene-disease validity classification for
  CFAP65: the ClinGen gene-validity export snapshot of 2026-10-14
  (data/clingen/gene_validity.csv) has no CFAP65 row. The ClinGen record for
  CFAP47 and X-linked spermatogenic failure 3 mentions CFAP65 only as an
  interacting protein. No GeneReviews chapter covers this disease (Bookshelf
  index snapshot 2026-09-10). Abstract-only caches: PMID:31501240,
  PMID:31571197, PMID:34231842 and PMID:42875786; PMID:31413122,
  PMID:39853433 and PMID:42477516 are full text. Reports disagree on where
  CFAP65 sits in sperm (acrosome and midpiece by immunostaining, or the
  central apparatus by interactome and ultrastructure); this entry follows
  the central apparatus placement for the flagellar defect and keeps the
  acrosomal defect as a separate node.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP65 variants: homozygous variants in
    consanguineous Chinese, Pakistani, Tunisian and Iranian families, and
    compound heterozygous variants in non-consanguineous families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31501240
    reference_title: "Biallelic mutations in CFAP65 cause male infertility with multiple morphological abnormalities of the sperm flagella in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP65 homozygous mutations were identified in four unrelated consanguineous families, and CFAP65 compound heterozygous mutations were found in two unrelated cases with MMAF."
    explanation: Homozygous and compound heterozygous variants across six families.
  - reference: PMID:42875786
    reference_title: "Identification and splicing assessment of a novel homozygous CFAP65 splice-site variant associated with oligozoospermia and complete asthenozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ROH analysis showed increased autosomal homozygosity in the proband (FROH = 7.88%), supporting parental consanguinity."
    explanation: Homozygous variant within a run of homozygosity in a consanguineous family.
pathophysiology:
- name: Loss of CFAP65 Protein in Sperm
  description: >-
    Biallelic nonsense, frameshift and splice-site variants abolish CFAP65 in
    patient sperm. CFAP65 binds central apparatus proteins of the C2a
    projection (CFAP70, MYCBPAP, SPAG16, SPATA4) and anchors at the base of
    that projection, acting as a structural stabilizer rather than an enzyme.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP65
    term:
      id: hgnc:25325
      label: CFAP65
  molecular_functions:
  - preferred_term: structural molecule activity
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  cellular_components:
  - preferred_term: Axonemal central apparatus
    term:
      id: GO:1990716
      label: axonemal central apparatus
  downstream:
  - target: Disintegration of the Sperm Axonemal Central Apparatus
    causal_link_type: DIRECT
    description: Without CFAP65 the C2a projection it anchors falls apart, taking the central apparatus with it in sperm.
    evidence:
    - reference: PMID:39853433
      reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, CFAP65 deficiency led to the disintegration of the C2a projection, compromising ciliary and flagellar integrity."
      explanation: Knockout mice lose the C2a projection when CFAP65 is absent.
  - target: Defective Acrosome Biogenesis and Sperm Head Shaping
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How CFAP65 loss disturbs the acrosome and manchette is not settled; it
      may follow from manchette microtubule disorganization or reflect a
      separate acrosomal role.
  evidence:
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP65 staining is present in the acrosome and flagellar midpiece of spermatozoa from normal controls (NCs), but absent in spermatozoa from F1: II-2 and F2: II-2."
    explanation: Protein absent from patient sperm.
  - reference: PMID:39853433
    reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CFAP65 was found to anchor at the base of the C2a projection of the axoneme, interacting with proteins such as CFAP70 and MYCBPAP."
    explanation: Structural placement of CFAP65 in the central apparatus from mouse interactome and ultrastructure.
  - reference: PMID:42875786
    reference_title: "Identification and splicing assessment of a novel homozygous CFAP65 splice-site variant associated with oligozoospermia and complete asthenozoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The minigene assay demonstrated complete exon 6 skipping, resulting in a 103-bp transcript deletion and a predicted frameshifted truncated protein p.(Pro182ArgfsTer29)."
    explanation: A splice allele shown to produce a frameshifted, truncated product.
- name: Disintegration of the Sperm Axonemal Central Apparatus
  description: >-
    In patient sperm, central apparatus proteins (CFAP70, MYCBPAP, MYCBP,
    SPAG16, SPATA4, HYDIN) are lost while doublet-associated proteins
    (dyneins, N-DRC, radial spokes) are retained, and most flagellar
    cross-sections show a 9+0 axoneme.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Axonemal central apparatus
    term:
      id: GO:1990716
      label: axonemal central apparatus
  biological_processes:
  - preferred_term: Axonemal central apparatus assembly
    modifier: DECREASED
    term:
      id: GO:1904158
      label: axonemal central apparatus assembly
  downstream:
  - target: Sperm Flagellar Axoneme and Mitochondrial Sheath Disorganization
    causal_link_type: DIRECT
    description: >-
      The long sperm flagellum depends heavily on central apparatus integrity
      for stability, so its loss leads to wholesale axonemal disorganization.
  - target: Absent sperm axoneme central pair complex
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39853433
    reference_title: "CFAP65 is essential for C2a projection integrity in axonemes: implications for organ-specific ciliary dysfunction and infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IF results showed that CA components, including CFAP70, MYCBPAP, MYCBP, SPAG16, SPATA4, and HYDIN, were absent in sperm of the patient, while DMT-associated components such as DRC1 (N-DRC), DNAH1, DNAH5 (dyneins), IQUB, NME5, RSPH9 (RSs), were normally assembled"
    explanation: Selective loss of central apparatus proteins in patient sperm.
  - reference: PMID:31413122
    reference_title: "Biallelic mutations in CFAP65 lead to severe asthenoteratospermia due to acrosome hypoplasia and flagellum malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "93.3% (28/30) of F1: II-2 and 83.9% (26/31) of F2: II-2 spermatozoa lacked a central pair complex (CPC) in the axoneme (9+0 structure)"
    explanation: Most flagellar cross-sections lack the central pair.
- name: Sperm Flagellar Axoneme and Mitochondrial Sheath Disorganization

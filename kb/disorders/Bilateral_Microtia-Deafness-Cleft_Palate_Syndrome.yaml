    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft palates and die within 24 hr of birth."
    explanation: >-
      Cleft palate in the homozygous mouse null provides model evidence for developmental relevance; the abstract
      does not supply a penetrance denominator.

- name: External Auditory Canal Stenosis
  description: >-
    Three imaged recessive relatives had severe bilateral canal narrowing, with near-atresia of portions of
    the bony canal. Canals were normally formed in the characterized p.Gln235* dominant family.

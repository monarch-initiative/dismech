  description: >-
    Discuss the identified genotype and variable phenotype with the family. When both parents carry a recessive
    pathogenic allele, each pregnancy has a 25% probability of an affected child; a heterozygous parent with
    a dominant pathogenic allele has a 50% transmission probability. These are Mendelian expectations conditional
    on parental genotypes, not empirically measured penetrance. Severity and hearing status cannot be predicted
    from transmission probability alone.

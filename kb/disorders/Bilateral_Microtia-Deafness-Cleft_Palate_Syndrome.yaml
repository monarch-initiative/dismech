- name: Speech and Language Therapy
  description: >-
    Assess speech and language development in either subtype when hearing impairment or a palatal defect is
    present. Coordinate early intervention, educational support and targeted therapy. Speech therapy can address
    learned articulation errors; structural velopharyngeal dysfunction requires a separate surgical or prosthetic

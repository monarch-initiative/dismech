- name: Mis-Attachment of the Extrinsic Tongue and Hyoid Muscles
  biological_scale: TISSUE
  description: >-
    In Hoxa2 mutant mice the attachments and trajectories of the extrinsic
    tongue and hyoid muscles are abnormal. The abnormal trajectory of two of
    them, the styloglossus and the stylohyoideus, blocks the attachment of the
    hyoglossus to the greater horn of the hyoid, and that blocked attachment
    correlated exactly with the presence of cleft palate in those animals. The
    node is mouse-derived; no comparable observation has been reported in
    HOXA2-mutant patients, in whom tongue and hyoid muscle anatomy has not been
    described.
  biological_processes:

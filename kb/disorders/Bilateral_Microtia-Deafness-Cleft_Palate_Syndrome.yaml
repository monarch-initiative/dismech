- name: Cleft Palate Repair
  description: >-
    For patients with cleft palate, craniofacial-team assessment determines whether and when palatoplasty is
    indicated. General ACPA guidance places primary repair commonly at 9–14 months and ideally by 18 months,
    with individual readiness and airway risk considered. The source supplies general care recommendations,
    not genotype-specific efficacy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cleft palate repair
    term:
      id: NCIT:C168380
      label: Palatorrhaphy
  target_mechanisms:
  - target: Cleft Palate
    treatment_effect: BYPASSES
    description: >-
      Palatoplasty restores palatal continuity and function after the congenital cleft has formed; it does
      not correct the embryonic HOXA2 mechanism.
    evidence:
    - reference: url:https://acpacares.org/wp-content/uploads/2025/02/2024-ACPA_ParametersOfCare_Final.pdf
      reference_title: https://acpacares.org/wp-content/uploads/2025/02/2024-ACPA_ParametersOfCare_Final.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The goal of cleft palate surgery is to obtain normal function for speech and swallowing, as well as
        to optimize airway and dental facial relations.
      explanation: >-
        General cleft-palate guidance applied when a HOXA2 patient has a cleft; this source does not report
        HOXA2-specific outcomes.
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    Relevant to the cleft phenotype documented in AR-MHIC. Assess feeding, speech and the airway before and
    after surgery; neither mouse cleft mechanism defines the surgical approach.

- name: Loss of Second Pharyngeal Arch Neural Crest Identity
  biological_scale: CELLULAR
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation"
  description: >-
    Hoxa2-null mouse embryos retain rhombomeric and neural crest segmentation but lose normal second-arch mesenchymal
    identity, producing first-arch-like skeletal derivatives. This supports an identity-assignment role. The
    cited abstract does not separately demonstrate normal migration, cell number or survival, and the complete-null
    result should not be equated with every human HOXA2 allele.
  cell_types:
  - preferred_term: second-arch neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: ABNORMAL
    term:
      id: GO:0014032
      label: neural crest cell development
  - preferred_term: pharyngeal system development
    modifier: ABNORMAL
    term:
      id: GO:0060037
      label: pharyngeal system development
  locations:
  - preferred_term: second pharyngeal arch
    term:
      id: UBERON:0003066
      label: pharyngeal arch 2
  evidence:
  - reference: PMID:7903601
    reference_title: "A homeotic transformation is generated in the rostral branchial region of the head by disruption of Hoxa-2, which acts as a selector gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While rhombomeric and neural crest cell (NCC) segmentation was not affected, mesenchymal NCC derivatives of the second arch were lacking, and second arch mesenchymal NCC identity was changed to first arch identity, resulting in homeotic transformation of second to first arch skeletal elements."
    explanation: >-
      Direct mouse evidence for preserved segmentation with changed second-arch identity; migration and survival
      were not separately established by this quotation.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/4143470/
    reference_title: 'The genetics of auricular development and malformation: new findings in model systems driving future directions for microtia research - PMC'
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      By definition, the pinna encompasses all external structures of the ear, including the tragus and root.
    explanation: >-
      This review qualifies the terminology of the mouse lineage claim; it is not a new lineage-tracing experiment.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Homeotic Transformation of Second-Arch Skeletal Derivatives
    description: >-
      Mis-specified second-arch crest builds first-arch structures instead of
      second-arch ones.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7903600
      reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological analysis suggested that this duplication resulted from the transformation of skeletal elements derived from the second branchial arch into more anterior structures, resulting in a duplication of Meckel's cartilage adjacent to the otic capsule."
      explanation: >-
        Independently documents the transformation of second-arch skeletal
        elements toward anterior (first-arch) structures.
  - target: Failed Auricular Morphogenesis
    description: >-
      Hoxa2-expressing second-arch mesenchyme supplies the auricular territory examined in the mouse fate-mapping
      study. Its loss disrupts that territory; the result should not be generalized to every human external-ear
      structure.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24067355
      reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By genetic fate mapping we found that the mouse auricle (or pinna) derives from the Hoxa2-expressing neural crest-derived mesenchyme of the second pharyngeal arch, and not from a composite of first and second arch mesenchyme as previously proposed based on morphological observation of human embryos."
      explanation: >-
        Mouse fate mapping supports a major second-arch contribution. The extent depends on how the auricle
        is defined; the tragus and root require separate consideration.
  - target: Mis-Attachment of the Extrinsic Tongue and Hyoid Muscles
    description: >-
      The same rhombencephalic neural crest that builds the craniofacial
      skeleton also patterns the craniofacial muscles, and Hoxa2 mutants have
      abnormal attachments and trajectories of the extrinsic tongue and hyoid
      muscles. How the arch-identity lesion produces that particular
      mis-routing was not worked out, so the intermediates are recorded as
      unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:10529419
      reference_title: Compensatory defects associated with mutations in Hoxa1 restore normal palatogenesis to Hoxa2 mutants.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The rhombencephalic neural crest play several roles in craniofacial development. They give rise to the cranial sensory ganglia and much of the craniofacial skeleton, and are vital for patterning of the craniofacial muscles."
      explanation: >-
        States that craniofacial muscle patterning depends on the same neural
        crest population whose identity is lost at this node.

  - target: Middle-Ear Ossicular Dysplasia
    description: >-
      The relationship of second-arch patterning to human ossicular dysplasia is inferred from developmental
      models and family anatomy; the intervening human developmental steps have not been measured.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
      reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        In all three patients the malformed ossicular chain seemed fixated by an incomplete atretic plate.
      explanation: >-
        CT findings in the three examined members of the recessive family; fixation was described as apparent
        on imaging.
- name: Homeotic Transformation of Second-Arch Skeletal Derivatives
  biological_scale: TISSUE
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis"
  description: >-
    Hoxa2-null mice lose second-arch skeletal elements and develop duplicated first-arch structures, including
    middle-ear ossification centers and a second Meckel cartilage beside the otic capsule. This is a model-organism
    developmental phenotype. Human imaging and surgery establish ossicular dysplasia and fixation, but do not
    demonstrate this complete homeotic duplication.

has_subtypes:
- name: AR-MHIC
  display_name: Autosomal recessive microtia, hearing impairment and cleft palate (HOXA2 p.Q186K)
  description: >-
    The original consanguineous Iranian family has homozygous p.Gln186Lys with bilateral microtia, prelingual
    severe to profound mixed hearing impairment and partial cleft palate. Three examined relatives had marked
    canal stenosis and ossicular abnormalities; one had unilateral inner-ear agenesis. These observations do
    not establish universal features of all biallelic HOXA2 variants.
  genes:
  - preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: >-
      Defines the recessive subtype's three-component phenotype in the family
      the disease concept is named for.
- name: AD-Microtia
  display_name: Autosomal dominant nonsyndromic bilateral microtia (HOXA2 haploinsufficiency)
  description: >-
    Heterozygous truncating HOXA2 variants segregate with dominant bilateral microtia. Hearing varies among
    families: the p.Gln235* family studied by Brown and colleagues includes mild to severe mixed loss, whereas
    the examined p.Glu224* family members had normal hearing. The characterized dominant families do not show
    the cleft-palate presentation of the original recessive family. Haploinsufficiency is proposed; transcript
    decay and an exact reduction in patient protein abundance were not measured in these reports.
  genes:
  - preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data extend these conclusions and define HOXA2 haploinsufficiency as the first genetic cause for autosomal-dominant nonsyndromic microtia."
    explanation: Establishes the dominant, haploinsufficiency-driven subtype.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a five-generation family with isolated bilateral microtia segregating as an autosomal dominant trait."
    explanation: >-
      A second, independent dominant family in which the microtia is isolated.

inheritance:
- name: Autosomal recessive
  description: >-
    Homozygosity for the HOXA2 homeodomain missense p.Q186K in a consanguineous
    Iranian family, mapped by genome-wide linkage to 7p14.3-p15.3.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: >-
      Recessive segregation in a consanguineous pedigree establishes the
      biallelic mode for this subtype.
- name: Autosomal dominant
  description: >-
    Heterozygous truncating HOXA2 variants segregate with bilateral microtia in multigeneration pedigrees.
    Hearing impairment is variable, so auricular morphology and audiology both contribute to family assessment.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HOXA2 variant was segregated with microtia and hearing loss in the family and was not seen in 6,500 individuals sequenced by the NHLBI Exome Sequencing Project or in 218 control individuals sequenced in this study."
    explanation: >-
      Co-segregation with the trait plus absence from large control sets
      supports the dominant allele's causality.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our family, sequence analysis detected a heterozygous protein truncating nonsense variant"
    explanation: >-
      Full segregation of a second heterozygous truncating allele in an
      independent family.

pathophysiology:
- name: HOXA2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Disease-associated alleles include heterozygous truncating variants p.Lys213*, p.Glu224* and p.Gln235*,
    and the recessive homeodomain missense p.Gln186Lys. Dominant haploinsufficiency is inferred from segregation
    and variant class, with impaired enhancer activation measured for two truncating alleles. The p.Gln186Lys
    DNA-binding effect is a homology-model prediction; the founding study did not measure residual protein
    activity or show functional complementation.
  genes:
  - preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: anterior/posterior pattern specification
    modifier: ABNORMAL
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of affected family members detected only seven shared, rare, heterozygous, nonsynonymous variants, including one protein truncating variant, a HOXA2 nonsense change (c.703C>T, p.Q235*)."
    explanation: Identifies the truncating allele class underlying the dominant form.
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent DNA sequence analysis of the HOXA1 and HOXA2 homeobox genes from the candidate region identified an interesting HOXA2 homeodomain variant: a change in a highly conserved amino acid (p.Q186K)."
    explanation: Identifies the recessive homeodomain missense allele.
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "In the model of the mutant homeodomain, the position of the mutant lysine side chain is consistently farther away from a nearby phosphate group; this altered position results in the loss of a hydrogen bond and affects the DNA-binding activity."
    explanation: >-
      The DNA-binding consequence of p.Q186K is a homology-modelling prediction,
      not a measurement; recorded as computational and indirect.
  downstream:
  - target: Impaired Transactivation of the Long-Range HMX1 Enhancer
    description: >-
      The p.Lys213* and p.Gln235* variants impair activation of the long-range HMX1 enhancer in a dual-luciferase
      assay; the abstract does not establish complete abolition of activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using dual luciferase reporter assays, we showed that both HOXA2 mutations have impaired activation of the long-range enhancer of HMX1."
      explanation: >-
        The reporter assay directly measures impaired enhancer activation by these two variants, rather than
        proving complete absence of activity in patients.
  - target: Loss of Second Pharyngeal Arch Neural Crest Identity
    description: >-
      HOXA2 is the selector gene that assigns second-arch identity to the
      cranial neural crest cells populating that arch; without it they adopt
      first-arch identity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7903601
      reference_title: "A homeotic transformation is generated in the rostral branchial region of the head by disruption of Hoxa-2, which acts as a selector gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ground pattern program appears to be modified in the mouse first arch by a Hox-independent process, whereas Hoxa-2 acts as a selector gene in the second arch."
      explanation: >-
        Establishes HOXA2's selector-gene role in the second arch, the step this
        edge represents.
  - target: Intrinsic Palatal Shelf Fusion Defect
    description: >-
      A route that does not run through the pharyngeal arches at all. Hoxa2 is
      expressed in the palate itself, and knocking it down there reduces the
      rate at which the shelves fuse. The intermediates the authors name -
      increased cell proliferation, and de-repression of the Hoxa2 targets
      Msx1, Bmp4, Barx1 and Ptx1 - are candidates they identify but do not
      trace to the fusion failure.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19653318
      reference_title: Hoxa2 plays a direct role in murine palate development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Knocking down Hoxa2 expression with antisense retroviral constructs resulted in decreased fusion rates than corresponding controls."
      explanation: >-
        Loss of Hoxa2 in the palate reduces shelf fusion, the step this edge
        represents; the experiment is a knockdown in palate culture.
      directness: INDIRECT
    - reference: PMID:19653318
      reference_title: Hoxa2 plays a direct role in murine palate development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hoxa2 also repressed the expression of its downstream targets Msx1, Bmp4, Barx1, and Ptx1 within the palate."
      explanation: >-
        Altered target-gene expression provides candidates, but the study does not trace a complete causal
        chain from any one target to failed fusion.

      directness: INDIRECT
  - target: External Auditory Canal Stenosis
    description: >-
      The HOXA2 genotype segregates with canal narrowing in the recessive family; the specific developmental
      intermediates remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
      reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The results of high-resolution CT scanning confirmed that the external auditory canal was severely
        narrowed bilaterally in the cartilaginous part of the auditory canal and almost atretic in part of
        the bony portion in all patients.
      explanation: >-
        CT in the three examined recessive-family members, not every person with HOXA2-related disease.
  - target: Unilateral Inner-Ear Aplasia
    description: >-
      The inner-ear malformation co-occurs with homozygous p.Gln186Lys in one relative. Its developmental relation
      to HOXA2 remains uncertain and should not be attributed to ossicular homeosis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
      reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The inner-ear structures were normal in patients V: 2 and V: 3, but there were no inner-ear structures
        on the left side for IV: 3.
      explanation: >-
        Unilateral inner-ear agenesis in one recessive-family member, with normal inner-ear anatomy in the
        other two imaged relatives.
  - target: Unilateral Facial Paresis
    description: >-
      Facial weakness was observed in one homozygous relative; a specific neural developmental mechanism was
      not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
      reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Individual number V: 2 also had a paresis on the right side of the face.
      explanation: >-
        Single affected relative; facial-nerve hypoplasia was suspected clinically but was not confirmed by
        brain MRI.

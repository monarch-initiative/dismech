name: Bilateral Microtia-Deafness-Cleft Palate Syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  Bilateral microtia-deafness-cleft palate syndrome is the HOXA2-related
  external- and middle-ear malformation spectrum. HOXA2 is the selector gene of
  the second pharyngeal arch: the cranial neural crest cells that populate that
  arch require HOXA2 to hold second-arch identity, and the auricle (pinna)
  derives from exactly this HOXA2-expressing second-arch mesenchyme. Loss of
  HOXA2 function therefore removes or mis-specifies the second-arch skeletal
  program, giving bilateral microtia with malformation of the middle-ear
  ossicles and consequent hearing impairment.

  Two allelic presentations are recognised, and MONDO lumps them under this one
  concept. A consanguineous Iranian family homozygous for the homeodomain
  missense p.Q186K has autosomal recessive bilateral microtia with severe to
  profound mixed hearing impairment and partial cleft palate; four subsequently
  reported families carry heterozygous nonsense alleles and have autosomal
  dominant, largely isolated bilateral microtia with variable hearing
  impairment and no cleft palate. Haploinsufficiency is the dominant mechanism,
  and impaired transactivation of the long-range HMX1 enhancer has been shown
  for two of the nonsense alleles.

  The mouse is unusually informative here and unusually divergent. Hoxa2-null
  mice die at birth with cleft palate and a full homeotic transformation of
  second-arch skeletal elements into first-arch structures, including
  duplication of the middle-ear ossification centres; late conditional
  inactivation instead produces a hypomorphic auricle that resembles the human
  condition. The lethal null phenotype is therefore not the human disease, and
  the severity difference is recorded here as a model-fidelity question rather
  than assumed away.

- name: Tongue-free Hoxa2 mutant palate organ culture
  experimental_model_type: OTHER
  description: >-
    Null palatal shelves cultured without a tongue have reduced fusion; antisense Hoxa2 knockdown also reduces
    fusion. This demonstrates an intrinsic component in the mouse system alongside the separate tongue-mechanics
    hypothesis.
  modeled_mechanisms:
  - target: Intrinsic Palatal Shelf Fusion Defect
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: >-
      Explant fusion rates do not quantify in-vivo penetrance or establish the relative mechanism of the human
      partial cleft.
    evidence:

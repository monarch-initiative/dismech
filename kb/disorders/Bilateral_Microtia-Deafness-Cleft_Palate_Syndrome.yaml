    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The results of high-resolution CT scanning confirmed that the external auditory canal was severely narrowed
      bilaterally in the cartilaginous part of the auditory canal and almost atretic in part of the bony portion
      in all patients.

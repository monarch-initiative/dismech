discussions:
- discussion_id: hoxa2_mouse_null_lethality_vs_human_viability
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does complete Hoxa2 loss kill mice at birth with a full second-to-first
    arch homeotic transformation, while human HOXA2 loss-of-function alleles
    produce a viable, largely isolated ear malformation?
  attaches_to:
  - pathophysiology#Homeotic Transformation of Second-Arch Skeletal Derivatives
  - animal_models#Hoxa2 null mouse (Rijli 1993)
  - animal_models#Hoxa-2 null mouse (Gendron-Maguire 1993)
  rationale: >-
    The complete mouse null is perinatally lethal with extensive skeletal homeosis, whereas characterized human
    heterozygous truncating and homozygous p.Gln186Lys genotypes are viable. Dose, developmental timing and
    species differences may contribute. Mouse hypomorphic alleles establish dose sensitivity, but residual
    activity of the human missense allele was not measured in the founding study. Human ossicular dysplasia
    therefore should not be described as proven partial homeotic duplication.
  evidence:
  - reference: PMID:7903600
    reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft palates and die within 24 hr of birth."
    explanation: The lethal mouse null phenotype at one end of the mismatch.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a five-generation family with isolated bilateral microtia segregating as an autosomal dominant trait."
    explanation: >-
      A five-generation pedigree of viable, isolated human disease at the other
      end of the mismatch.
  - reference: PMID:24067355
    reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, Hoxa2 inactivation at early gestational stages results in external auditory canal (EAC) duplication and absence of the auricle, whereas its late inactivation results in a hypomorphic auricle, mimicking the human HOXA2 mutant condition."
    explanation: >-
      Shows that timing of Hoxa2 loss alone spans much of the severity gap,
      which is part of the candidate resolution.
- discussion_id: hoxa2_sensorineural_component_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    What explains the sensorineural component of hearing loss in HOXA2-affected ears without demonstrated inner-ear
    agenesis?
  attaches_to:
  - phenotypes#Mixed Hearing Impairment
  rationale: >-
    The original recessive family includes one left inner-ear agenesis confirmed by CT and MRI, while two other
    examined relatives had normal inner-ear structures despite mixed hearing loss. Mixed loss also occurs in
    the p.Gln235* dominant family. Thus the gap is not absence of any human inner-ear characterization: the
    unresolved question is why sensorineural dysfunction occurs in other ears, and how it relates to HOXA2
    development.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
    reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The inner-ear structures were normal in patients V: 2 and V: 3, but there were no inner-ear structures
      on the left side for IV: 3.
    explanation: >-
      Unilateral inner-ear agenesis in one recessive-family member, with normal inner-ear anatomy in the other
      two imaged relatives.
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Audiometric testing was performed on three of the affected family members and showed mild to severe bilateral
      mixed hearing loss (Fig. 1C).
    explanation: >-
      Direct dominant-family audiology. The figure caption includes a mild conductive-only left ear in one
      relative, so not every tested ear had both components.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
    reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      All four affected family individuals showed bilateral symmetric severe to profound mixed hearing impairment
      affecting all frequencies and leading to a flat audiometric shape.
    explanation: >-
      The four affected members of the original recessive family; this severity should not be transferred to
      all dominant cases.
- discussion_id: hoxa2_cleft_palate_tongue_versus_intrinsic_palate
  kind: CONTROVERSY
  prompt: >-
    Is the Hoxa2-associated cleft palate secondary to abnormal tongue
    musculature, intrinsic to the palatal shelves, or both?
  attaches_to:
  - pathophysiology#Abnormal Tongue Posture Obstructing Palatal Shelf Closure
  - pathophysiology#Intrinsic Palatal Shelf Fusion Defect
  - phenotypes#Cleft Palate
  rationale: >-
    Two mouse accounts are on record and they are not the same claim. Barrow
    and Capecchi report that mis-attachment of the hyoglossus correlates
    exactly with cleft palate in Hoxa2 mutants and suggest that the resulting
    tongue posture blocks the shelves, with a genetic rescue in Hoxa1/Hoxa2
    double mutants as support. Smith and colleagues report Hoxa2 expression in
    the palate itself and reduced fusion of Hoxa2-null shelves cultured without
    a tongue, and conclude explicitly that the cleft is not solely due to the
    tongue musculature. The two are compatible - a mechanical obstruction and a
    shelf-intrinsic fusion defect could both contribute - but their relative
    contribution has not been quantified, and neither has been examined in a
    HOXA2-mutant patient, in whom the cleft is partial rather than complete.
    Until that is settled, this entry carries both nodes and asserts neither as
    the mechanism of the human cleft.
  evidence:
  - reference: PMID:10529419
    reference_title: Compensatory defects associated with mutations in Hoxa1 restore normal palatogenesis to Hoxa2 mutants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We suggest that the hyoglossus, whose function is to depress the lateral edges of the tongue, when unable to make its proper attachment to the greater horn of the hyoid, forces the tongue to adopt an abnormal posture which blocks closure of the palatal shelves."
    explanation: The tongue-musculature position, in its authors' own hedged wording.
  - reference: PMID:19653318

genetic:
- name: HOXA2 pathogenic variants
  association: Causal
  relationship_type: CAUSATIVE
  presence: Pathogenic
  gene_term:
    preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  notes: >-
    HOXA2 lies in the HOXA cluster at 7p15.2. Linkage and segregation established the recessive family; exome
    or targeted sequencing identified dominant truncating alleles. The curated variants are examples, not an
    exhaustive or current worldwide allele count. Haploinsufficiency is inferred, and the cited family studies
    did not measure patient nonsense-mediated decay or a precise 50% protein reduction.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide linkage analysis localized the responsible gene to chromosome 7p14.3-p15.3 with a maximum multi-point LOD score of 4.17."
    explanation: >-
      Linkage to the HOXA cluster interval is the mapping evidence that
      identified the gene.
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next generation sequencing identified two heterozygous nonsense HOXA2 mutations, one in each family."
    explanation: >-
      Two independent families carrying heterozygous nonsense alleles; p.Gln235* recurs from an earlier pedigree.
  variants:
  - name: p.Q186K homeodomain missense (recessive)
    description: >-
      Homozygous homeodomain missense p.Gln186Lys segregated in the original recessive family and was absent
      from the reported control panels. The founding paper predicts altered DNA binding by homology modeling
      but does not measure residual function. Protein notation avoids conflating historical nucleotide numbering
      with a normalized transcript-specific HGVS description.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18394579
      reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was not found in 231 Iranian and 109 Belgian control samples."
      explanation: Control-panel absence supporting pathogenicity of p.Q186K.
  - name: p.Q235* nonsense (dominant)
    description: >-
      A recurrent heterozygous nonsense allele, found independently in a
      three-generation US family and in one of the two Chinese families.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One mutation (c.637A > T, p.Lys213*) is newly reported, while the other one (c.703C > T,p.Gln235*) is consistent with a previous report."
      explanation: Documents recurrence of p.Gln235* across unrelated families.
  - name: p.E224* nonsense (dominant)
    description: >-
      A heterozygous truncating allele segregating in all affected members of a
      five-generation Italian family and absent from public databases.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27503514
      reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our family, sequence analysis detected a heterozygous protein truncating nonsense variant"
      explanation: Defines the allele and its segregation.

    - reference: url:https://fair.unifg.it/retrieve/de2a638f-fc40-8577-e053-3705fe0aa5f3/tesi%20definitiva.pdf
      reference_title: https://fair.unifg.it/retrieve/de2a638f-fc40-8577-e053-3705fe0aa5f3/tesi%20definitiva.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Sanger analysis of the index patient (V:1) identified a previously unreported heterozygous variant
        ... NM_006735.3: c.670G>T, p.(Glu224*) ... in the second exon of the HOXA2 gene (Figure 17a).
      explanation: >-
        Primary thesis data identifying p.Glu224* in the same Italian pedigree as the journal article.
  - name: p.Lys213* nonsense (dominant)
    description: >-
      Heterozygous p.Lys213* was found in one Chinese family; a dual-luciferase assay showed impaired HMX1
      enhancer activation. The result supports loss of activity without establishing patient transcript decay.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One mutation (c.637A > T, p.Lys213*) is newly reported, while the other one (c.703C > T,p.Gln235*) is consistent with a previous report."
      explanation: >-
        Identifies the newly reported p.Lys213* allele and distinguishes it from recurrent p.Gln235*.
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: >-
        Using dual luciferase reporter assays, we showed that both HOXA2 mutations have impaired activation
        of the long-range enhancer of HMX1.
      explanation: >-
        Direct reporter result for p.Lys213* and p.Gln235*; impairment is not equivalent to a proven null effect.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Published evidence consists of a small number of pedigrees. No HOXA2-specific population prevalence is
    established by these reports; all-cause microtia birth prevalence should not be assigned to this molecular
    disorder.
  evidence:
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only four HOXA2 mutations were reported in families with autosomal-recessive or dominant microtia, with or without hearing impairment."
    explanation: >-
      A time-specific literature summary illustrates sparse pedigree evidence; it does not establish a current
      worldwide family count or population prevalence.
    quote_role: BACKGROUND
diagnosis:
- name: Clinical and audiological examination
  description: >-
    Inspect both auricles, ear canals, palate and facial movement, and obtain age-appropriate air- and bone-conduction
    hearing thresholds. Mixed loss can occur in either inheritance subtype, and a normal hearing result does
    not exclude dominant HOXA2 microtia. General microtia guidance recommends diagnostic ABR by two to three
    months, followed by behavioral assessment as development permits.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: >-
      The clinical and audiological characterisation that defines the
      presentation.
  - reference: DOI:10.3389/fsurg.2022.944223
    reference_title: Integrated microtia and aural atresia management
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      A diagnostic ABR should be performed as early as possible.
    explanation: >-
      General microtia diagnostic guidance, extrapolated to affected infants.
    quote_role: REVIEW_SYNTHESIS
  - reference: DOI:10.3389/fsurg.2022.944223
    reference_title: Integrated microtia and aural atresia management
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Air conduction and bone conduction testing should performed.
    explanation: >-
      The source recommends testing both pathways; the quotation preserves its grammatical omission.
    quote_role: REVIEW_SYNTHESIS
- name: HOXA2 sequencing
  description: >-
    Identify a phenotype-compatible HOXA2 variant through targeted sequencing, a relevant hearing/craniofacial
    panel or exome analysis, and test segregation where feasible. Interpret variant class, zygosity and family
    phenotype together; a rare missense finding alone is not diagnostic. Heterozygous truncating alleles and
    the original homozygous p.Gln186Lys allele have different inheritance and clinical associations.
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of affected family members detected only seven shared, rare, heterozygous, nonsynonymous variants, including one protein truncating variant, a HOXA2 nonsense change (c.703C>T, p.Q235*)."
    explanation: Exome sequencing as the diagnostic route in a dominant family.

  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Both of these nonsynonymous changes affect leucine residues with high evolutionary conservation; however,
      each of these variants was also found in one control, indicating that either these variants are benign
      or that these variants in combination with another undetected HOXA2 variant (possibly in a noncoding
      portion of the gene) are responsible for microtia in these patients.
    explanation: >-
      The study itself did not establish causality for every rare missense variant; the proposed second-variant
      explanation was untested.
- name: Temporal-bone imaging when clinically indicated
  description: >-
    CT characterizes canal narrowing, atretic plates and ossicles; MRI can assess inner-ear and neural anatomy.
    The original recessive family had both ossicular abnormalities and one unilateral inner-ear agenesis. General
    microtia guidance reserves routine reconstructive CT for surgical planning or suspected cholesteatoma rather
    than the newborn period; unusual mixed loss or neurologic findings require individualized specialist assessment.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/2427268/
    reference_title: A Mutation in HOXA2 Is Responsible for Autosomal-Recessive Microtia in an Iranian Family - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The MRI of the auditory system in individual V: 3 was unremarkable for the inner ear and cerebellopontine
      angle, but an MRI confirmed the inner-ear agenesis on the left side of individual IV: 3 as seen on CT-images.
    explanation: >-
      Human diagnostic imaging, with both normal and abnormal findings.
  - reference: DOI:10.3389/fsurg.2022.944223
    reference_title: Integrated microtia and aural atresia management
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      A CT scan of the temporal bone is not recommended in the newborn period.
    explanation: >-
      General microtia imaging guidance; this does not preclude individualized imaging for a specific diagnostic
      concern.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Auricular Reconstruction
  description: >-
    Discuss observation, an external prosthesis, autologous cartilage reconstruction and alloplastic reconstruction
    according to the individual goals and anatomy. Reconstruction is elective; coordinate its sequence with
    any hearing implant or canal surgery. The recommendations come from general microtia care, not a HOXA2
    outcome series.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: auricular reconstruction
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  target_mechanisms:
  - target: Bilateral Microtia
    treatment_effect: BYPASSES
    description: >-
      Reconstruction changes the visible auricular manifestation; it does not reverse the prenatal HOXA2 patterning
      defect.
    evidence:
    - reference: DOI:10.3389/fsurg.2022.944223
      reference_title: Integrated microtia and aural atresia management
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        In discussing the spectrum of reconstructive options, observation should be presented with associated
        bene ﬁts and drawbacks.
      explanation: >-
        General microtia/atresia guidance applied to the relevant HOXA2 phenotype; no HOXA2-specific treatment
        effect is measured.
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    Observation is a legitimate choice. Choice and timing of reconstruction should account for the patient
    wishes, hearing rehabilitation and surgical risks.

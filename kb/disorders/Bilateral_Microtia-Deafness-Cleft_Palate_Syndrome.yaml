    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of stained skeletons revealed that homozygous mutant animals contained multiple cranial skeletal defects, including a duplication of the ossification centers of the bones of the middle ear."
    explanation: >-
      Documents the middle-ear skeletal consequence of the second-arch

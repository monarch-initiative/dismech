    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HOXA2 variant was segregated with microtia and hearing loss in the family and was not seen in 6,500 individuals sequenced by the NHLBI Exome Sequencing Project or in 218 control individuals sequenced in this study."
    explanation: >-
      Co-segregation with the trait plus absence from large control sets
      supports the dominant allele's causality.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our family, sequence analysis detected a heterozygous protein truncating nonsense variant"
    explanation: >-
      Full segregation of a second heterozygous truncating allele in an
      independent family.

pathophysiology:
- name: HOXA2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two allele classes have been reported. Heterozygous nonsense alleles
    (p.Lys213*, p.Glu224*, p.Gln235*) truncate the protein and act by
    haploinsufficiency. The recessive allele is instead a homeodomain missense,
    p.Q186K, at a highly conserved residue; homology modelling predicts the
    mutant lysine side chain sits further from a nearby phosphate group, losing
    a hydrogen bond and impairing DNA binding.
  genes:
  - preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: anterior/posterior pattern specification
    modifier: ABNORMAL
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of affected family members detected only seven shared, rare, heterozygous, nonsynonymous variants, including one protein truncating variant, a HOXA2 nonsense change (c.703C>T, p.Q235*)."
    explanation: Identifies the truncating allele class underlying the dominant form.
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent DNA sequence analysis of the HOXA1 and HOXA2 homeobox genes from the candidate region identified an interesting HOXA2 homeodomain variant: a change in a highly conserved amino acid (p.Q186K)."
    explanation: Identifies the recessive homeodomain missense allele.
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "In the model of the mutant homeodomain, the position of the mutant lysine side chain is consistently farther away from a nearby phosphate group; this altered position results in the loss of a hydrogen bond and affects the DNA-binding activity."
    explanation: >-
      The DNA-binding consequence of p.Q186K is a homology-modelling prediction,
      not a measurement; recorded as computational and indirect.
  downstream:
  - target: Impaired Transactivation of the Long-Range HMX1 Enhancer
    description: >-
      Truncated HOXA2 protein cannot activate the distant HMX1 enhancer it
      normally binds.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using dual luciferase reporter assays, we showed that both HOXA2 mutations have impaired activation of the long-range enhancer of HMX1."
      explanation: >-
        A reporter assay directly measures the loss of enhancer transactivation
        by the two nonsense alleles.
  - target: Loss of Second Pharyngeal Arch Neural Crest Identity
    description: >-
      HOXA2 is the selector gene that assigns second-arch identity to the
      cranial neural crest cells populating that arch; without it they adopt
      first-arch identity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7903601
      reference_title: "A homeotic transformation is generated in the rostral branchial region of the head by disruption of Hoxa-2, which acts as a selector gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ground pattern program appears to be modified in the mouse first arch by a Hox-independent process, whereas Hoxa-2 acts as a selector gene in the second arch."
      explanation: >-
        Establishes HOXA2's selector-gene role in the second arch, the step this
        edge represents.

- name: Impaired Transactivation of the Long-Range HMX1 Enhancer
  biological_scale: MOLECULAR
  description: >-
    HOXA2 binds a long-range enhancer of HMX1, itself a transcription factor
    required for eye and ear development, and both reported Chinese nonsense
    alleles fail to activate it in reporter assays. This is the one
    HOXA2 target so far tied experimentally to the human microtia alleles.
  genes:
  - preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  biological_processes:
  - preferred_term: ear morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042471
      label: ear morphogenesis
  evidence:
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mouse, Hoxa2 can bind to a long-range enhancer and regulate expression of the Hmx1 gene, which is a crucial transcription factor in eye and ear development."
    explanation: >-
      Establishes the HOXA2-HMX1 enhancer relationship; demonstrated in mouse.
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results also provide molecular insights about how these nonsense HOXA2 mutations could affect the activation of its downstream target HMX1 by interacting with the long-range enhancer."
    explanation: >-
      The authors frame the reporter result as molecular insight into how the
      alleles act, stated as a possible rather than established route.
  downstream:
  - target: Failed Auricular Morphogenesis
    description: >-
      Reduced HMX1 activation is the candidate route from the HOXA2 alleles to
      the external ear defect; the link to the human auricle phenotype is
      inferred, not measured in patient tissue.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mouse, Hoxa2 can bind to a long-range enhancer and regulate expression of the Hmx1 gene, which is a crucial transcription factor in eye and ear development."
      explanation: >-
        Supports HMX1 as an ear-development effector downstream of HOXA2;
        the connection to the human auricle is an inference from this.

- name: Loss of Second Pharyngeal Arch Neural Crest Identity
  biological_scale: CELLULAR
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation"
  description: >-
    In Hoxa2-null mice, rhombomeric segmentation and neural crest migration are
    intact, but the mesenchymal neural crest derivatives of the second arch are
    missing and the surviving second-arch mesenchymal crest adopts first-arch
    identity. The lesion is one of identity assignment rather than of crest
    generation or survival - which distinguishes it from the
    ribosome-biogenesis neurocristopathies that conform to the same module node.
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: ABNORMAL
    term:
      id: GO:0014032
      label: neural crest cell development
  - preferred_term: pharyngeal system development
    modifier: ABNORMAL
    term:
      id: GO:0060037
      label: pharyngeal system development
  locations:
  - preferred_term: second pharyngeal arch
    term:
      id: UBERON:0003066
      label: pharyngeal arch 2
  evidence:
  - reference: PMID:7903601
    reference_title: "A homeotic transformation is generated in the rostral branchial region of the head by disruption of Hoxa-2, which acts as a selector gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While rhombomeric and neural crest cell (NCC) segmentation was not affected, mesenchymal NCC derivatives of the second arch were lacking, and second arch mesenchymal NCC identity was changed to first arch identity, resulting in homeotic transformation of second to first arch skeletal elements."
    explanation: >-
      States precisely the identity-change lesion this node models, and rules
      out a segmentation or migration defect.
  downstream:
  - target: Homeotic Transformation of Second-Arch Skeletal Derivatives
    description: >-
      Mis-specified second-arch crest builds first-arch structures instead of
      second-arch ones.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7903600
      reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Histological analysis suggested that this duplication resulted from the transformation of skeletal elements derived from the second branchial arch into more anterior structures, resulting in a duplication of Meckel's cartilage adjacent to the otic capsule."
      explanation: >-
        Independently documents the transformation of second-arch skeletal
        elements toward anterior (first-arch) structures.
  - target: Failed Auricular Morphogenesis
    description: >-
      The pinna is built by the HOXA2-expressing second-arch neural crest
      mesenchyme, so loss of that identity removes the auricular program.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24067355
      reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By genetic fate mapping we found that the mouse auricle (or pinna) derives from the Hoxa2-expressing neural crest-derived mesenchyme of the second pharyngeal arch, and not from a composite of first and second arch mesenchyme as previously proposed based on morphological observation of human embryos."
      explanation: >-
        Genetic fate mapping establishes the second-arch, HOXA2-expressing
        origin of the pinna that makes this edge causal.

- name: Homeotic Transformation of Second-Arch Skeletal Derivatives
  biological_scale: TISSUE
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis"
  description: >-
    In the mouse null, second-arch skeletal elements are absent and are replaced
    by duplicated first-arch structures, including duplicated ossification
    centres of the middle-ear bones and a second Meckel's cartilage beside the
    otic capsule. Because the middle-ear ossicles are second- and first-arch
    derivatives, this is the developmental origin of the conductive component of
    the hearing impairment.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
  - preferred_term: embryonic skeletal system morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
  locations:
  - preferred_term: auditory ossicle
    term:
      id: UBERON:0001686
      label: auditory ossicle bone
  evidence:
  - reference: PMID:7903600
    reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of stained skeletons revealed that homozygous mutant animals contained multiple cranial skeletal defects, including a duplication of the ossification centers of the bones of the middle ear."
    explanation: >-
      Documents the middle-ear skeletal consequence of the second-arch
      transformation.
  - reference: PMID:7903600
    reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Skeletal elements normally derived from the second arch were absent in the mutants."
    explanation: >-
      Confirms loss, not merely mis-shaping, of the second-arch skeletal
      derivatives.
  downstream:
  - target: Hearing Impairment
    description: >-
      Malformation of the middle-ear ossicular chain, a second- and first-arch
      derivative, is the developmental basis of the conductive component of the
      hearing loss.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23775976
      reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HOXA2 has been shown to be critical for outer and middle ear development through mouse models and has previously been associated with autosomal recessive bilateral microtia."
      explanation: >-
        States that HOXA2 is required for middle- as well as outer-ear
        development, the link between the ossicular defect and the hearing
        phenotype.
  - target: Mixed Hearing Impairment
    description: >-
      In the recessive subtype the hearing loss is characterised as mixed, and
      the same ossicular malformation accounts for its conductive half. Only
      that half follows from this node. The sensorineural half has no published
      mechanistic account in either the human family or the mouse models, which
      is the subject of the hoxa2_sensorineural_component_unexplained
      discussion; the edge is drawn to the mixed phenotype because that is how
      the recessive family's audiology is reported, not because this node
      explains both components.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23775976
      reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HOXA2 has been shown to be critical for outer and middle ear development through mouse models and has previously been associated with autosomal recessive bilateral microtia."
      explanation: >-
        Supports the middle-ear route from the arch-skeletal lesion to the
        conductive component of the mixed hearing loss. It says nothing about
        the sensorineural component, which this edge does not claim to explain.
  - target: Cleft Palate
    description: >-
      Palatal clefting accompanies the arch-patterning lesion in the recessive
      human subtype and in the mouse null.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:7903600
      reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft palates and die within 24 hr of birth."
      explanation: >-
        Cleft palate is a constant feature of the mouse null, matching the
        recessive human subtype.

- name: Failed Auricular Morphogenesis
  biological_scale: TISSUE
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Serially Homologous Craniofacial Malformation Across Arch Derivatives"
  description: >-
    The auricle fails to form normally. Timing determines severity in the mouse:
    early Hoxa2 inactivation abolishes the auricle and duplicates the external
    auditory canal, while late inactivation leaves a hypomorphic auricle
    resembling the human phenotype. Hoxa2 acts on pinna morphogenesis partly
    through BMP signalling and Eya1 expression.
  biological_processes:
  - preferred_term: ear morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042471
      label: ear morphogenesis
  - preferred_term: face morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060325
      label: face morphogenesis
  locations:
  - preferred_term: auricle
    term:
      id: UBERON:0001757
      label: pinna
  evidence:
  - reference: PMID:24067355
    reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, Hoxa2 inactivation at early gestational stages results in external auditory canal (EAC) duplication and absence of the auricle, whereas its late inactivation results in a hypomorphic auricle, mimicking the human HOXA2 mutant condition."
    explanation: >-
      Establishes both the auricular defect and its dependence on the timing of
      Hoxa2 loss.
  - reference: PMID:24067355
    reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hoxa2 partly controls the morphogenesis of the pinna through the BMP signalling pathway and expression of Eya1, which in humans is involved in branchio-oto-renal syndrome."
    explanation: >-
      Names the downstream effectors through which HOXA2 shapes the pinna;
      the authors qualify this as partial control.
  downstream:
  - target: Bilateral Microtia
    description: >-
      Failure of pinna morphogenesis presents clinically as bilateral microtia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24067355
      reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, Hoxa2 loss- and gain-of-function approaches in mice provide a suitable model to investigate the molecular aetiology of microtia and auricle duplication."
      explanation: >-
        The authors position the Hoxa2 auricular phenotype as the model of human
        microtia aetiology.

phenotypes:
- name: Bilateral Microtia
  category: Craniofacial
  description: >-
    The defining feature and the only one present in every reported family:
    bilateral malformation or reduction of the external ear. It is bilateral in
    all reported pedigrees, recessive and dominant alike.
  phenotype_term:
    preferred_term: Bilateral microtia
    term:
      id: HP:0008551
      label: Microtia
  notes: >-
    Reported in all five citable published HOXA2 families - one recessive
    (PMID:18394579) and four dominant (PMID:23775976, PMID:27503514, and two
    families in PMID:32649979). A sixth family (PMID:31567444) exists but has no
    abstract in PubMed and so carries no quotable evidence; see the entry-level
    notes. No frequency band is asserted, because the denominator is a handful of
    families rather than a systematically ascertained cohort.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: Bilateral microtia in the recessive family.
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a three-generation family with bilateral microtia and hearing loss segregating as an autosomal dominant trait."
    explanation: Bilateral microtia in the first dominant family.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a five-generation family with isolated bilateral microtia segregating as an autosomal dominant trait."
    explanation: Bilateral microtia in a second dominant family.
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we collect two Chinese families with non-syndromic bilateral microtia."
    explanation: Bilateral microtia in two further dominant families.

- name: Hearing Impairment
  category: Auditory
  description: >-
    Hearing impairment is present in the recessive family and in some but not
    all dominant families; where characterised it is mixed, symmetrical and
    severe to profound. The published series describe the dominant phenotype as
    microtia "with or without hearing impairment", so it is a variable feature
    of that subtype.
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  notes: >-
    Present in the recessive family (PMID:18394579, mixed and severe to profound)
    and in one dominant family (PMID:23775976). PMID:32649979 describes the
    reported HOXA2 families collectively as having microtia "with or without
    hearing impairment", so no band is asserted.
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a three-generation family with bilateral microtia and hearing loss segregating as an autosomal dominant trait."
    explanation: Hearing loss co-segregating in a dominant family.
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, only four HOXA2 mutations were reported in families with autosomal-recessive or dominant microtia, with or without hearing impairment."
    explanation: >-
      The literature summary records hearing impairment as a variable rather
      than constant feature of HOXA2-related microtia.

- name: Mixed Hearing Impairment
  category: Auditory
  subtype: AR-MHIC
  description: >-
    In the recessive family the hearing impairment is specifically mixed -
    conductive and sensorineural components together - symmetrical, and severe
    to profound. The conductive component is attributable to the ossicular
    malformation; the sensorineural component is not mechanistically accounted
    for by any published human or mouse observation.
  phenotype_term:
    preferred_term: Mixed hearing impairment
    term:
      id: HP:0000410
      label: Mixed hearing impairment
  notes: >-
    Reported in the single recessive family (PMID:18394579). Not reported in any
    dominant family, where audiological characterisation is not given in the
    abstracts.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: >-
      Specifies the mixed, symmetrical, severe-to-profound character of the
      recessive subtype's hearing loss.

- name: Cleft Palate
  category: Craniofacial
  subtype: AR-MHIC
  description: >-
    Partial cleft palate is reported only in the biallelic recessive family, and
    is the feature that distinguishes the recessive from the dominant subtype.
    The mouse Hoxa2 null is likewise born with cleft palate.
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  notes: >-
    Reported in the recessive family only (PMID:18394579), and explicitly
    described as incomplete when that family is summarised by later authors
    (PMID:27503514). Absent from all four dominant families.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: Partial cleft palate in the recessive family.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HOXA2 biallelic mutations were also described in an inbreed family with autosomal recessive microtia, hearing impairment and incomplete cleft palate."
    explanation: >-
      Independently characterises the recessive family's cleft as incomplete,
      and contrasts it with the authors' own dominant, isolated family.

genetic:
- name: HOXA2 pathogenic variants
  association: Causal
  relationship_type: CAUSATIVE
  presence: Pathogenic
  gene_term:
    preferred_term: HOXA2
    term:
      id: hgnc:5103
      label: HOXA2
  notes: >-
    HOXA2 lies in the HOXA cluster at 7p15.2 and was reached by genome-wide
    linkage in the original recessive family before exome sequencing found the
    dominant nonsense alleles. Four HOXA2 alleles had been reported before the
    Chinese families added a fifth.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide linkage analysis localized the responsible gene to chromosome 7p14.3-p15.3 with a maximum multi-point LOD score of 4.17."
    explanation: >-
      Linkage to the HOXA cluster interval is the mapping evidence that
      identified the gene.
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next generation sequencing identified two heterozygous nonsense HOXA2 mutations, one in each family."
    explanation: Two further independent nonsense alleles.
  variants:
  - name: p.Q186K homeodomain missense (recessive)
    description: >-
      A homozygous missense change at a highly conserved homeodomain residue,
      absent from 231 Iranian and 109 Belgian controls. Homology modelling
      predicts impaired DNA binding; the variant has not been assayed
      functionally.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18394579
      reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was not found in 231 Iranian and 109 Belgian control samples."
      explanation: Control-panel absence supporting pathogenicity of p.Q186K.
  - name: p.Q235* nonsense (dominant)
    description: >-
      A recurrent heterozygous nonsense allele, found independently in a
      three-generation US family and in one of the two Chinese families.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32649979
      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One mutation (c.637A > T, p.Lys213*) is newly reported, while the other one (c.703C > T,p.Gln235*) is consistent with a previous report."
      explanation: Documents recurrence of p.Gln235* across unrelated families.
  - name: p.E224* nonsense (dominant)
    description: >-
      A heterozygous truncating allele segregating in all affected members of a
      five-generation Italian family and absent from public databases.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27503514
      reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our family, sequence analysis detected a heterozygous protein truncating nonsense variant"
      explanation: Defines the allele and its segregation.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four HOXA2 alleles had been published when the two Chinese families were
    reported, bringing the total to five families that this entry can cite. At
    least one further family is published (PMID:31567444) without a quotable
    abstract, so the true count is a floor rather than an exact figure - which
    does not move the ULTRA_RARE band. Microtia overall occurs in roughly 1 in
    8,000-10,000 births, but HOXA2 accounts for only a small fraction of it; no
    HOXA2-specific population estimate exists.
  evidence:
  - reference: PMID:32649979
    reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, only four HOXA2 mutations were reported in families with autosomal-recessive or dominant microtia, with or without hearing impairment."
    explanation: The literature count establishing the ultra-rare band.
- population: All causes of microtia, worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 11.0
  rate_low: 10.0
  rate_high: 12.5
  notes: >-
    Background birth prevalence of microtia from all causes, quoted as 1 in
    8,000-10,000 births, converted to 10.0-12.5 per 100,000 with the midpoint
    recorded. This is the context figure for the phenotype, not the prevalence
    of HOXA2-related disease, which is a small subset.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microtia, a congenital deformity manifesting as an abnormally shaped or absent external ear, occurs in one out of 8,000-10,000 births."
    explanation: >-
      Source of the all-cause microtia birth prevalence quoted as context.

diagnosis:
- name: Clinical and audiological examination
  description: >-
    Bilateral microtia is apparent at birth. Audiological assessment
    characterises the hearing loss and its conductive versus sensorineural
    components, which in the recessive family was mixed and symmetrical.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: >-
      The clinical and audiological characterisation that defines the
      presentation.
- name: HOXA2 sequencing
  description: >-
    Molecular confirmation is by sequencing HOXA2, reached by targeted analysis,
    exome sequencing, or a microtia gene panel. In a dominant pedigree a
    heterozygous truncating allele segregating with the trait is the expected
    finding.
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing of affected family members detected only seven shared, rare, heterozygous, nonsynonymous variants, including one protein truncating variant, a HOXA2 nonsense change (c.703C>T, p.Q235*)."
    explanation: Exome sequencing as the diagnostic route in a dominant family.

treatments:
- name: Auricular Reconstruction
  description: >-
    Staged surgical reconstruction of the external ear, using autologous costal
    cartilage or an alloplastic framework, is the standard management of
    bilateral microtia. No HOXA2-specific surgical series exists; management
    follows general microtia practice.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: auricular reconstruction
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  target_mechanisms:
  - target: Bilateral Microtia
    treatment_effect: BYPASSES
    description: >-
      Surgery targets the manifestation, not the mechanism. The auricle is built
      from costal cartilage or an alloplastic framework after the fact; nothing
      about the second-arch identity lesion or the failed morphogenesis that
      produced the malformation is corrected, and the developmental window
      closed before birth. The link is recorded at the phenotype rather than at
      Failed Auricular Morphogenesis for that reason.
  notes: >-
    No citable HOXA2-specific outcome data. Recorded as standard management for
    the phenotype rather than as an evidence-backed disease-specific claim. The
    target_mechanisms link carries no evidence for the same reason: no published
    series reports surgical outcomes in HOXA2-mutant patients specifically, and
    manufacturing a quote from the general microtia literature would attribute
    to this disease something no source says about it.
- name: Cleft Palate Repair
  description: >-
    Surgical closure of the palatal cleft (palatoplasty), relevant only to the
    biallelic recessive subtype, in which partial cleft palate is reported. It
    is undertaken in infancy to protect feeding, middle-ear ventilation and
    speech development, and is the standard of care for cleft palate of any
    cause. No HOXA2-specific surgical series exists; management follows general
    cleft-palate practice.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cleft palate repair
    term:
      id: NCIT:C168380
      label: Palatorrhaphy
  target_mechanisms:
  - target: Cleft Palate
    treatment_effect: BYPASSES
    description: >-
      Palatoplasty closes the cleft after the fact. The developmental lesion
      behind it - ectopic second-arch cartilage obstructing elevation of the
      palatal shelves - is prenatal and is untouched by the operation, which
      restores anatomical continuity of the palate without correcting the
      arch-identity defect that produced the cleft. The link is recorded at the
      phenotype rather than at the arch-transformation node for that reason,
      matching auricular reconstruction.
  notes: >-
    Scoped to the AR-MHIC subtype, the only one in which cleft palate is
    reported. The Treatment class has no subtype slot - no entry in the KB
    carries one - so the restriction is recorded here rather than as a
    structured field. As with auricular reconstruction and hearing
    amplification, this treatment and its target_mechanisms link carry no
    evidence: no published series reports palatoplasty outcomes in
    HOXA2-mutant patients, none of the seven cited references contains any
    management content, and quoting the general cleft-palate literature would
    attribute to this disease something no source says about it.
- name: Hearing Amplification
  description: >-
    Amplification, typically bone-conduction in the presence of aural atresia,
    addresses the conductive component of the hearing loss and is fitted early
    to protect speech and language development.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification
    term:
      id: NCIT:C15747
      label: Supportive Care
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Hearing Impairment
    treatment_effect: BYPASSES
    description: >-
      Amplification routes sound around the malformed conductive apparatus
      rather than repairing it, which is why bone conduction is used where the
      ear canal is atretic. It addresses the conductive component; the
      sensorineural component reported in the recessive family is not corrected
      by it.
  notes: >-
    NCIT's hearing-aid term names the device and is not reachable from
    NCIT:C25218, so the clinical action is bound and the device carried as a
    qualifier, per the device pattern in CLAUDE.md. As with auricular
    reconstruction, the target_mechanisms link carries no evidence because no
    published series reports amplification outcomes in HOXA2-mutant patients.
- name: Speech and Language Therapy
  description: >-
    Indicated for the recessive subtype, where cleft palate and severe to
    profound hearing impairment both threaten speech development.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
- name: Genetic Counseling
  description: >-
    The counselling differs sharply between subtypes: a 25% sibling recurrence
    risk for the biallelic recessive form, against 50% transmission from an
    affected parent carrying a nonsense allele. Establishing which allele class
    is present is therefore the practical purpose of molecular testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data extend these conclusions and define HOXA2 haploinsufficiency as the first genetic cause for autosomal-dominant nonsyndromic microtia."
    explanation: >-
      Establishing a dominant mechanism is what changes the recurrence risk
      counselled for.

animal_models:
- name: Hoxa2 null mouse (Rijli 1993)
  species: Mouse
  genotype: Hoxa2 homozygous null (targeted disruption)
  publication: PMID:7903601
  description: >-
    The original targeted disruption. Homozygotes die at birth. Rhombomeric
    segmentation and neural crest migration are normal, but second-arch
    mesenchymal crest derivatives are missing and the surviving second-arch
    crest is transformed to first-arch identity, establishing Hoxa2 as the
    second-arch selector gene.
  modeled_mechanisms:
  - target: Loss of Second Pharyngeal Arch Neural Crest Identity
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model defines the identity-assignment lesion this node represents.
    limitations: >-
      Homozygous null; the human dominant subtype is heterozygous and the human
      recessive allele is a missense with residual protein, so the mouse
      represents complete rather than partial loss of function.
    readouts:
    - name: Second-arch neural crest identity
      target: Loss of Second Pharyngeal Arch Neural Crest Identity
      direction: ALTERED
      interpretation: >-
        Second-arch crest adopts first-arch identity, the defining readout of
        the selector-gene lesion.
      evidence:
      - reference: PMID:7903601
        reference_title: "A homeotic transformation is generated in the rostral branchial region of the head by disruption of Hoxa-2, which acts as a selector gene."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "While rhombomeric and neural crest cell (NCC) segmentation was not affected, mesenchymal NCC derivatives of the second arch were lacking, and second arch mesenchymal NCC identity was changed to first arch identity, resulting in homeotic transformation of second to first arch skeletal elements."
        explanation: The identity-change readout behind this link.
    evidence:
    - reference: PMID:7903601
      reference_title: "A homeotic transformation is generated in the rostral branchial region of the head by disruption of Hoxa-2, which acts as a selector gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ground pattern program appears to be modified in the mouse first arch by a Hox-independent process, whereas Hoxa-2 acts as a selector gene in the second arch."
      explanation: >-
        Establishes the model as informative for HOXA2's second-arch selector
        function.
- name: Hoxa-2 null mouse (Gendron-Maguire 1993)
  species: Mouse
  genotype: Hoxa-2 (Hox 1.11) homozygous targeted mutation
  publication: PMID:7903600
  description: >-
    An independent null allele reported simultaneously. Homozygotes are born
    with cleft palate and die within 24 hours, with duplicated middle-ear
    ossification centres and a second Meckel's cartilage beside the otic
    capsule.
  modeled_mechanisms:
  - target: Homeotic Transformation of Second-Arch Skeletal Derivatives
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the skeletal consequence of the arch-identity lesion, including
      the middle-ear element that underlies the conductive hearing loss.
    limitations: >-
      Perinatally lethal with a complete homeotic transformation, which no human
      patient shows; the human phenotype is a partial, viable version of it.
    readouts:
    - name: Middle-ear ossification centre duplication
      target: Homeotic Transformation of Second-Arch Skeletal Derivatives
      direction: INCREASED
      interpretation: >-
        Duplicated ossification centres are the skeletal signature of
        second-to-first arch transformation.
      evidence:
      - reference: PMID:7903600
        reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analysis of stained skeletons revealed that homozygous mutant animals contained multiple cranial skeletal defects, including a duplication of the ossification centers of the bones of the middle ear."
        explanation: The skeletal readout behind this link.
    evidence:
    - reference: PMID:7903600
      reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Skeletal elements normally derived from the second arch were absent in the mutants."
      explanation: >-
        Establishes the model as informative for loss of second-arch skeletal
        derivatives.
  - target: Cleft Palate
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cleft palate is constant in the mouse null and matches the recessive human
      subtype.
    limitations: >-
      The mouse cleft is complete and lethal, whereas the human recessive
      subtype has a partial cleft and normal survival; and the dominant human
      subtype has no cleft at all.
    readouts:
    - name: Palatal closure
      target: Cleft Palate
      direction: ABOLISHED
      interpretation: Palatal closure fails in every homozygous null animal.
      evidence:
      - reference: PMID:7903600
        reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft palates and die within 24 hr of birth."
        explanation: The palatal readout behind this link.
    evidence:
    - reference: PMID:7903600
      reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft palates and die within 24 hr of birth."
      explanation: >-
        Establishes the model as informative for the palatal phenotype of the
        recessive subtype.
- name: Conditional Hoxa2 inactivation mouse (Minoux 2013)
  species: Mouse
  genotype: Conditional Hoxa2 inactivation at early versus late gestational stages, plus conditional ectopic Hoxa2 in first-arch neural crest
  publication: PMID:24067355
  description: >-
    Stage-specific conditional inactivation separates the auricular phenotype
    from the lethal null. Early inactivation abolishes the auricle and
    duplicates the external auditory canal; late inactivation yields a
    hypomorphic auricle that the authors take to mimic the human HOXA2 mutant
    condition. The reciprocal gain-of-function experiment - ectopic Hoxa2 in
    first-arch crest - duplicates the pinna and eliminates the canal.
  modeled_mechanisms:
  - target: Failed Auricular Morphogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The late-inactivation arm is the closest available model of the human
      auricular phenotype, and the fate-mapping arm establishes the second-arch
      origin of the pinna that the mechanism depends on.
    limitations: >-
      Mouse and human pinna morphology differ substantially, and the model's
      resemblance to the human condition is the authors' assessment rather than
      a quantified comparison.
    readouts:
    - name: Auricle size and presence by stage of Hoxa2 inactivation
      target: Failed Auricular Morphogenesis
      direction: DECREASED
      interpretation: >-
        Auricular severity tracks the developmental stage at which Hoxa2 is
        removed, from complete absence to hypoplasia.
      evidence:
      - reference: PMID:24067355
        reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mice, Hoxa2 inactivation at early gestational stages results in external auditory canal (EAC) duplication and absence of the auricle, whereas its late inactivation results in a hypomorphic auricle, mimicking the human HOXA2 mutant condition."
        explanation: The stage-dependent auricular readout behind this link.
    - name: Pinna lineage by genetic fate mapping
      target: Failed Auricular Morphogenesis
      direction: ALTERED
      interpretation: >-
        Fate mapping assigns the entire pinna to Hoxa2-expressing second-arch
        neural crest, correcting the earlier composite first/second-arch model.
      evidence:
      - reference: PMID:24067355
        reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "By genetic fate mapping we found that the mouse auricle (or pinna) derives from the Hoxa2-expressing neural crest-derived mesenchyme of the second pharyngeal arch, and not from a composite of first and second arch mesenchyme as previously proposed based on morphological observation of human embryos."
        explanation: The lineage readout behind this link.
    evidence:
    - reference: PMID:24067355
      reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, Hoxa2 loss- and gain-of-function approaches in mice provide a suitable model to investigate the molecular aetiology of microtia and auricle duplication."
      explanation: >-
        The authors' own statement that the model is suitable for the human
        aetiology this node represents.

discussions:
- discussion_id: hoxa2_mouse_null_lethality_vs_human_viability
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does complete Hoxa2 loss kill mice at birth with a full second-to-first
    arch homeotic transformation, while human HOXA2 loss-of-function alleles
    produce a viable, largely isolated ear malformation?
  attaches_to:
  - pathophysiology#Homeotic Transformation of Second-Arch Skeletal Derivatives
  - animal_models#Hoxa2 null mouse (Rijli 1993)
  - animal_models#Hoxa-2 null mouse (Gendron-Maguire 1993)
  rationale: >-
    The two 1993 mouse nulls die within 24 hours with cleft palate, absent
    second-arch skeletal elements, and duplicated middle-ear ossification
    centres. No reported human patient has anything approaching this: the
    recessive family has bilateral microtia, mixed hearing loss and a partial
    cleft palate with normal survival, and the four dominant families have
    largely isolated microtia. Part of the gap is dose - human dominant disease
    is heterozygous and the human recessive allele is a missense with residual
    protein rather than a null - and the conditional study shows that the timing
    of Hoxa2 removal alone spans absent to merely hypoplastic auricle. But no
    human biallelic null has been reported, so whether a human HOXA2 null would
    be lethal is unknown, and the relative contribution of dose, timing, and
    species difference in arch patterning has not been separated. This matters
    for interpreting the mouse skeletal phenotype as a model of the human
    ossicular defect.
  evidence:
  - reference: PMID:7903600
    reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived from cranial neural crest.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft palates and die within 24 hr of birth."
    explanation: The lethal mouse null phenotype at one end of the mismatch.
  - reference: PMID:27503514
    reference_title: Identification of a second HOXA2 nonsense mutation in a family with autosomal dominant non-syndromic microtia and distinctive ear morphology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a five-generation family with isolated bilateral microtia segregating as an autosomal dominant trait."
    explanation: >-
      A five-generation pedigree of viable, isolated human disease at the other
      end of the mismatch.
  - reference: PMID:24067355
    reference_title: Mouse Hoxa2 mutations provide a model for microtia and auricle duplication.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, Hoxa2 inactivation at early gestational stages results in external auditory canal (EAC) duplication and absence of the auricle, whereas its late inactivation results in a hypomorphic auricle, mimicking the human HOXA2 mutant condition."
    explanation: >-
      Shows that timing of Hoxa2 loss alone spans much of the severity gap,
      which is part of the candidate resolution.
- discussion_id: hoxa2_sensorineural_component_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    What accounts for the sensorineural component of the mixed hearing
    impairment in the recessive HOXA2 family?
  attaches_to:
  - phenotypes#Mixed Hearing Impairment
  rationale: >-
    The arch-patterning mechanism accounts naturally for a conductive loss,
    since the middle-ear ossicles are arch derivatives and are duplicated or
    absent in the mouse null. The recessive family's loss is explicitly mixed
    and severe to profound, so a cochlear or neural component is present that
    the second-arch skeletal lesion does not explain. Neither the human reports
    nor the mouse studies cited here characterise inner-ear structure or
    function in HOXA2 loss of function, and the dominant families' hearing
    impairment is not audiologically subtyped in the published abstracts, so it
    is not known whether a sensorineural component is general to the disorder or
    specific to the p.Q186K family.
  evidence:
  - reference: PMID:18394579
    reference_title: A mutation in HOXA2 is responsible for autosomal-recessive microtia in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate."
    explanation: >-
      Records the mixed character of the hearing loss that this gap concerns.
  - reference: PMID:23775976
    reference_title: HOXA2 haploinsufficiency in dominant bilateral microtia and hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HOXA2 has been shown to be critical for outer and middle ear development through mouse models and has previously been associated with autosomal recessive bilateral microtia."
    explanation: >-
      The established HOXA2 role covers outer and middle ear, not the inner ear
      - which is why the sensorineural component is unaccounted for.

notes: >-
  Naming and lumping: MONDO:0012854 is labelled for the recessive
  microtia-deafness-cleft palate presentation, but its synonym set also carries
  "microtia with or without hearing impairment", the dominant form. Both are
  HOXA2 allelic disorders acting through the same second-arch mechanism, so
  they are curated here as one entry with two has_subtypes rather than as
  separate diseases; the cleft palate is the discriminating feature and appears
  only in the biallelic family.

  Conformance: three nodes conform to
  kb/modules/pharyngeal_arch_patterning_serial_homology.yaml. HOXA2 is a
  distinct trigger from the module's worked examples - it is an arch-identity
  selector lesion, not a ribosome-biogenesis neurocristopathy and not an
  EDN1-EDNRA-DLX5/6 dorsoventral-code lesion - and the module's own description
  invites exactly this substitution at the trigger node.

  Frequency bands are deliberately absent from the phenotype records. Five
  published families is a case-series denominator, not a cohort; per-family
  counts are recorded in each phenotype's notes instead.

  Not curated for want of a citable source: the audiological subtype of the
  hearing loss in the dominant families, the specific auricular morphology
  described as distinctive in PMID:27503514 (which appears only in that
  paper's title), external auditory canal atresia status, any longitudinal
  or surgical outcome data, the Marx grade of the microtia (the falcon report
  gives type II), and unilateral cochlear absence in one of the four affected
  members of the Iranian family. That last one bears directly on the
  hoxa2_sensorineural_component_unexplained discussion - it is the only
  reported inner-ear finding in the disease - but the falcon report sources it
  to Alasti's 2009 thesis, which carries no PMID and no DOI, so it cannot be
  cached or quoted and is recorded here instead.

  Deep-research retrieval pass. A falcon report was run on 2026-09-04 and is
  committed at
  research/Bilateral_Microtia-Deafness-Cleft_Palate_Syndrome-deep-research-falcon.md
  (30 citations; 11 of 11 references verified, 2 on topic, 1 flagged off topic).
  It surfaced one real gap and two leads that were checked and not taken.

  The gap is a sixth published HOXA2 family: Meddaugh and Zambrano 2020
  (PMID:31567444), a four-generation pedigree with microtia and variable
  hearing impairment, which the manual sweep missed. It cannot be curated as
  evidence. Its PubMed record carries no abstract - the cached reference is
  title-only - so there is no quotable sentence, and a title is not a finding.
  It is therefore recorded here rather than added to references: as a
  tagged-but-not-mined citation. The report attributes a truncating allele
  around Glu229 to it, distinct from the p.E224* and p.Q235* alleles curated
  below; that attribution is unverified and is not asserted anywhere in this
  entry. Every family-count statement in this entry enumerates the five
  families it can cite and should be read that way.

  Lead not taken: Wilderman et al. 2024 describe a roughly 600-kb noncoding
  global control region between NPVF and NFE2L3 that drives anterior HOXA
  expression in embryonic craniofacial tissue, whose deletion in mouse produces
  orofacial clefts resembling the Hoxa2 null. That is upstream regulatory
  architecture for the HOXA cluster, not a HOXA2 lesion in any reported patient
  with this disease, and the report says so itself. It is a candidate for a
  future regulatory-variant node, not a claim this entry can make now.

  Confirmed rather than changed: the report's management citations are the
  general microtia and aural-atresia literature (international consensus
  recommendations, integrated atresia management, a national treatment
  guideline), none of it HOXA2-specific. That independently supports the
  treatments section's statement that no HOXA2-specific outcome data exists,
  which had rested on the curator's own search.


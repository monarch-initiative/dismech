    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The cleft palate exhibited by Hoxa2 null murine embryos has been described as being secondary to abnormalities of tongue musculature, and Hoxa2 was presumed to not play a direct role in palate development."

- name: Intrinsic Palatal Shelf Fusion Defect
  biological_scale: TISSUE
  description: >-
    A second, independent route to the same cleft. Hoxa2 is expressed in the
    developing palate itself between E12.5 and E15.5, and Hoxa2-null palatal
    shelves cultured in the absence of the tongue fuse at lower rates than
    heterozygous or wild-type shelves, as do shelves in which Hoxa2 is knocked
    down with antisense constructs. Null palates show an overall increase in
    cell proliferation, and Hoxa2 represses Msx1, Bmp4, Barx1 and Ptx1 within
    the palate. On the authors' reading the mouse cleft is therefore not solely
    secondary to the tongue. Whether either route operates in HOXA2-mutant
    humans is unknown.
  biological_processes:
  - preferred_term: secondary palate development
    modifier: ABNORMAL
    term:
      id: GO:0062009
      label: secondary palate development

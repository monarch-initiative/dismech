  - reference: url:https://acpacares.org/wp-content/uploads/2025/02/2024-ACPA_ParametersOfCare_Final.pdf
    reference_title: https://acpacares.org/wp-content/uploads/2025/02/2024-ACPA_ParametersOfCare_Final.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Primary surgery of cleft palate often occurs between 9-14 months of age. The timing should take into
      account the patient and/or family readiness (physically and emotionally). Ideally, the cleft palate should
      be closed by the age of 18 months.
    explanation: >-
      General cleft-palate guidance applied when a HOXA2 patient has a cleft; this source does not report HOXA2-specific
      outcomes. Timing is individualized, rather than an outcome established for this genotype.
    quote_role: REVIEW_SYNTHESIS
- name: Hearing Amplification
  description: >-
    Provide early hearing rehabilitation according to per-ear thresholds, canal anatomy and cochlear reserve.
    General bilateral microtia/atresia guidance recommends amplification by four months and early intervention
    by three to six months. Worn bone-conduction devices can bypass a narrowed or atretic canal; patients with
    patent canals may use conventional amplification if appropriate. Mixed loss requires assessment of the
    sensorineural component and device limits, rather than assuming normal cochlear function.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing amplification
    term:
      id: NCIT:C15747
      label: Supportive Care
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Hearing Impairment
    treatment_effect: BYPASSES
    description: >-
      Amplification improves access to sound within the usable cochlear reserve. Bone conduction bypasses canal
      and middle-ear transmission abnormalities but does not repair inner-ear agenesis or restore intrinsic
      cochlear function.
    evidence:
    - reference: DOI:10.3389/fsurg.2022.944223
      reference_title: Integrated microtia and aural atresia management
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Diagnostic audiological assessment should be completed by 2 – 3 months of age and the infant provided
        with hearing ampli ﬁcation by 4 months of age and enrolled in early intervention (EI) by 3 – 6 months
        of age to optimize speech and language development.
      explanation: >-
        General microtia/atresia guidance applied to the relevant HOXA2 phenotype; no HOXA2-specific treatment
        effect is measured. The timing recommendation is for bilateral microtia with atresia.
      quote_role: REVIEW_SYNTHESIS
  notes: >-
    Do not delay early hearing support while deciding on cosmetic ear reconstruction. Device and implant selection
    requires current specialist assessment; historical regulatory age cutoffs in the 2022 guidance are not
    generalized here.

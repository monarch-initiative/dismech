notes: >-
  This entry covers the recessive microtia-hearing impairment-cleft palate presentation and dominant HOXA2-related
  microtia as allelic subtypes of one developmental disorder. Cleft palate is documented in the original recessive
  family, but phenotype breadth and hearing severity require individual assessment. Pedigree-based observations
  do not support population frequency bands. General microtia/atresia and cleft-palate care recommendations
  are extrapolated to the relevant manifestations; HOXA2-specific treatment outcomes have not been established
  by the cited sources.


name: Bilateral Microtia-Deafness-Cleft Palate Syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  HOXA2-related bilateral microtia is a developmental ear-malformation spectrum with autosomal recessive and
  dominant presentations. A homozygous homeodomain p.Gln186Lys allele in an Iranian family is associated with
  grade II bilateral microtia, severe to profound mixed hearing impairment and partial cleft palate. Heterozygous
  truncating alleles cause dominant bilateral microtia with variable hearing impairment; mixed loss is documented
  in a dominant family, whereas examined members of another family had normal hearing. These allelic presentations
  are retained as separate subtypes of the same entry.

  HOXA2 assigns second-pharyngeal-arch identity and supports auricular and middle-ear development. Mouse null
  and conditional experiments establish dose- and timing-sensitive developmental functions, but do not demonstrate
  that human ossicular malformations reproduce the complete homeotic transformation of a mouse null. Most of
  the auricle is linked to second-arch mesenchyme; descriptions that include the tragus and auricular root
  require first-arch contributions to be considered. Haploinsufficiency is an inferred mechanism for dominant
  truncating alleles, with impaired HMX1 enhancer activation shown in reporter assays for p.Lys213* and p.Gln235*.
  Residual function of p.Gln186Lys and the relative contributions of tongue mechanics and intrinsic palatal
  fusion to the human cleft remain unresolved.

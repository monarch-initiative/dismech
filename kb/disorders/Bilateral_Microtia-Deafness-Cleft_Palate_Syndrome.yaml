    description: >-
      Barrow and Capecchi's interpretation of the correlation: the hyoglossus,
      unable to reach the greater horn, cannot depress the lateral edges of the
      tongue. Support for the link is the rescue arm - restoring the attachment
      in Hoxa1/Hoxa2 double mutants restores palatal closure over a flattened
      tongue - rather than direct observation of tongue posture in the single
      mutants.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

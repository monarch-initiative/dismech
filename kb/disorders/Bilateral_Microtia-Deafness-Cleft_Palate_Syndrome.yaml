      reference_title: Identification of loss-of-function HOXA2 mutations in Chinese families with dominant bilateral microtia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mouse, Hoxa2 can bind to a long-range enhancer and regulate expression of the Hmx1 gene, which is a crucial transcription factor in eye and ear development."
      explanation: >-
        Supports HMX1 as an ear-development effector downstream of HOXA2;

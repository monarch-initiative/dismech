        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation (Doxycycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the bacterial 30S ribosomal subunit and arrests
      rickettsial protein synthesis.
  - target: Intracytosolic Rickettsia africae Niche
    treatment_effect: BYPASSES
    description: Doxycycline can reach the cytosolic rickettsial compartment.
  evidence:

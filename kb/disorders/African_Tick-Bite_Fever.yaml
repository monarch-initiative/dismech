  evidence:
  - reference: PMID:20233665
    reference_title: "African tick-bite fever: a new entity in the differential diagnosis of multiple eschars in travelers. Description of five cases imported from South Africa to Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The etiological agent of ATBF is Rickettsia africae, an emerging

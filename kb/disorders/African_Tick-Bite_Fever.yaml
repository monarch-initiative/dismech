    explanation: The case series and review names R. africae as the etiologic bacterium of ATBF.

transmission:
- name: Amblyomma tick bite transmission
  description: >-
    Rickettsia africae is transmitted to humans by infected Amblyomma ticks,
    whose host-hunting behavior helps explain the multiple inoculation skin
    lesions and clustered cases characteristic of ATBF.
  evidence:
  - reference: PMID:20233665
    reference_title: "African tick-bite fever: a new entity in the differential diagnosis of multiple eschars in travelers. Description of five cases imported from South Africa to Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is caused by the bite of an infected Amblyomma tick, whose hunting
      habits explain the typical presence of multiple inoculation skin lesions
      and the occurrence of clustered cases.
    explanation: >-
      Imported traveler cases support infected Amblyomma tick bites as the
      clinically relevant route of acquisition.

epidemiology:
- name: Returned-traveler ATBF risk after rural sub-Saharan Africa exposure
  description: >-
    African tick-bite fever is enriched among travelers with rural or game
    exposure in sub-Saharan Africa and can present as case clusters after shared
    exposure to Amblyomma ticks.
  factors:
  - sub-Saharan Africa travel
  - rural tick exposure
  - Amblyomma tick exposure
  evidence:
  - reference: PMID:20233665
    reference_title: "African tick-bite fever: a new entity in the differential diagnosis of multiple eschars in travelers. Description of five cases imported from South Africa to Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      African tick-bite fever (ATBF) is a newly described spotted fever
      rickettsiosis that frequently presents with multiple eschars in travelers
      returning from sub-Saharan Africa and, to a lesser extent, from the West
      Indies.
    explanation: >-
      The case series and review identify sub-Saharan African travel, plus a
      smaller West Indies signal, as the usual imported-case epidemiologic
      context.
  - reference: PMID:28544092
    reference_title: "Fever and Multiple Eschars After an African Safari: Report of Three Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATBF has been reported as the second most commonly documented etiology of fever, after malaria"
    explanation: ATBF is the second most common documented cause of fever after malaria in ill travelers returning from sub-Saharan Africa.

pathophysiology:
- name: Amblyomma-Borne Rickettsia africae Inoculation
  role: trigger
  description: >-
    Infected Amblyomma ticks inoculate R. africae into the dermis. Because
    Amblyomma ticks actively hunt hosts, one exposure can create multiple
    inoculation lesions and clustered illness among co-travelers.
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:20233665
    reference_title: "African tick-bite fever: a new entity in the differential diagnosis of multiple eschars in travelers. Description of five cases imported from South Africa to Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is caused by the bite of an infected Amblyomma tick, whose hunting
      habits explain the typical presence of multiple inoculation skin lesions
      and the occurrence of clustered cases.
    explanation: >-
      The review ties the initiating infected-tick bite to the multiple
      inoculation lesions that distinguish ATBF from many other spotted fevers.
  downstream:
  - target: Dermal Mononuclear Phagocyte Infection
    causal_link_type: DIRECT
    description: Dermal inoculation exposes macrophage or dendritic target cells to R. africae.

- name: Dermal Mononuclear Phagocyte Infection
  role: primary_infection
  description: >-
    After dermal inoculation, R. africae first infects mononuclear phagocytes
    (CD68+ macrophages and dendritic cells) at the bite site, establishing the
    local dermal infection.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathogenic sequence of events that occur in rickettsial infection
      begins with the entry of organisms inoculated by the feeding tick or mite
      or scratched into the skin from infected louse or flea feces deposited on
      the skin.
    explanation: >-
      The rickettsial pathogenesis review supports skin inoculation as the first
      step of arthropod-borne rickettsial infection.
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The initial target cells of infection are CD68+ cells (macrophages and/or
      dendritic cells)
    explanation: >-
      The review identifies dermal mononuclear phagocytes as the first infected
      host cells.
  downstream:
  - target: Multiple Inoculation Eschars
    causal_link_type: DIRECT
    description: Local dermal infection creates one or more tache-noire eschars.
  - target: Lymphatic Dissemination to Regional Nodes
    causal_link_type: DIRECT
    description: Dermal infection spreads through lymphatic vessels to draining lymph nodes.
  - target: Rickettsial Ribosomal Translation (Doxycycline Target)
    causal_link_type: DIRECT
    description: R. africae depends on bacterial ribosomal protein synthesis.
  - target: Intracytosolic Rickettsia africae Niche
    causal_link_type: DIRECT
    description: R. africae resides in host-cell cytosol during infection.

- name: Lymphatic Dissemination to Regional Nodes
  role: primary_infection
  description: >-
    R. africae spreads through dermal lymphatic vessels to regional draining
    lymph nodes and then seeds the bloodstream and microvascular endothelium.
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The initial target cells of infection are CD68+ cells (macrophages and/or
      dendritic cells)
    explanation: >-
      Extrapolated from the general rickettsial pathogenesis sequence; regional
      lymphatic spread from the dermal infection precedes systemic seeding.
  downstream:
  - target: Regional Lymphadenopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Lymphatic spread to draining nodes contributes to regional lymphadenopathy.
  - target: Mild Systemic Endothelial Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Lymphatic and hematogenous spread seeds endothelial infection.

- name: Mild Systemic Endothelial Activation
  role: vascular_response
  description: >-
    Compared with R. conorii in Mediterranean spotted fever, R. africae provokes
    only modest IL-8 and adhesion-molecule induction in endothelial cells and in
    patient serum, fitting the usually self-limited ATBF course.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:19091423
    reference_title: Relative chemokine and adhesion molecule expression in Mediterranean spotted fever and African tick bite fever.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R. conorii induced a marked increase in MCP-1, IL-8, and adhesion
      molecules in endothelial cells, involving toll-like receptor 4 activation.
      In contrast, R. africae induced MCP-1 expression, but only modest or no
      responses were seen on IL-8 and adhesion molecules.
    explanation: >-
      Human endothelial-cell stimulation directly supports the attenuated
      cytokine and adhesion-molecule response to R. africae.
  - reference: PMID:19091423
    reference_title: Relative chemokine and adhesion molecule expression in Mediterranean spotted fever and African tick bite fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparable to the in vitro response, levels of IL-8 and adhesion molecules
      showed no or only a modest increase in ATBF patients while these
      inflammatory markers were markedly elevated during MSF.
    explanation: >-
      Patient serum findings mirror the endothelial-cell experiment and support
      modest systemic endothelial activation in ATBF.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic inflammatory signaling drives the acute febrile syndrome.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic infection produces headache as part of the flu-like syndrome.
  - target: Myalgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic infection produces myalgia as part of the flu-like syndrome.
  - target: Papulovesicular Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous microvascular infection and inflammation produce the variable rash.
  - target: Chills
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The systemic febrile illness is accompanied by chills.
  - target: Aphthous stomatitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Mucosal involvement can produce an enanthema with aphthous stomatitis.
  - target: Myocarditis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe disease, described in elderly patients, can include myocarditis.

- name: Rickettsial Ribosomal Translation (Doxycycline Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    R. africae, like other bacteria, depends on 70S ribosomal translation of its
    mRNA; doxycycline binds the 30S ribosomal subunit and blocks bacterial
    protein synthesis.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence for the bacterial ribosome as the conserved target class
      for tetracyclines such as doxycycline; the ATBF treatment item below
      establishes that doxycycline is used for tick-borne rickettsioses.

- name: Intracytosolic Rickettsia africae Niche
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >-
    Spotted-fever-group rickettsiae live free in the host-cell cytosol and
    exploit intracellular host metabolites, so effective drugs for ATBF must
    reach an intracytosolic bacterial compartment.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many necessary
      components via transport mechanisms instead of maintaining genes for
      synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The review supports the free cytosolic niche for Rickettsia species and
      the metabolic dependence represented by the shared intracellular-pathogen
      persistence module.

phenotypes:
- name: Multiple Inoculation Eschars
  category: Dermatologic
  frequency: FREQUENT
  description: >-
    ATBF commonly produces at least one inoculation eschar, and the Amblyomma
    tick exposure pattern often yields multiple eschars.
  notes: >-
    The eschar's local mechanism (dermal vasculitic necrosis at the inoculation
    site) is extrapolated from spotted-fever-group rickettsioses in general; no
    ATBF-specific histopathology snippet is cited for the local lesion.
  phenotype_term:
    preferred_term: Eschar
    term:
      id: HP:6000793
      label: Eschar
  sequelae:
  - target: Cellulitis
    description: An inoculation eschar can be a risk factor for secondary cellulitis.
  evidence:
  - reference: PMID:20233665
    reference_title: "African tick-bite fever: a new entity in the differential diagnosis of multiple eschars in travelers. Description of five cases imported from South Africa to Switzerland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indeed, the presence of at least one inoculation eschar is observed in
      53-100% of cases and multiple eschars in 21-54%.
    explanation: >-
      The review quantifies eschars as present in a majority of reported ATBF
      cases and multiple eschars as a distinctive subset.

- name: Regional Lymphadenopathy
  category: Immune
  description: Regional lymph-node enlargement accompanies local eschar infection.
  notes: >-
    Bound to the general term HP:0002716 Lymphadenopathy; no localized/regional
    lymphadenopathy HPO term was found on searching cache/hp/terms.csv, so the
    regional qualifier is carried in preferred_term.
  phenotype_term:
    preferred_term: Regional lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:27172113
    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with African tick bite fever typically have fever, headache,
      myalgia, one or more inoculation eschars, regional lymphadenopathy, and
      sometimes maculopapular or vesicular rash
    explanation: The CDC report lists regional lymphadenopathy as a typical ATBF feature.

- name: Fever
  category: Constitutional
  description: Fever is part of the acute systemic ATBF syndrome.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:12766836
    reference_title: African tick bite fever in travelers to rural sub-Equatorial Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 80% of the patients had fever, headache, and/or myalgia, whereas
      specific clinical features such as inoculation eschars, lymphadenitis,
      cutaneous rash, and aphthous stomatitis were seen in < or = 50% of
      patients.
    explanation: >-
      The prospective traveler cohort places fever in the dominant acute
      symptom complex; the greater-than-80% figure is a disjunction across
      fever, headache, and myalgia and is not used as a frequency for fever
      alone.

- name: Headache
  category: Neurological
  description: Headache is part of the flu-like systemic ATBF presentation.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:12766836
    reference_title: African tick bite fever in travelers to rural sub-Equatorial Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 80% of the patients had fever, headache, and/or myalgia, whereas
      specific clinical features such as inoculation eschars, lymphadenitis,
      cutaneous rash, and aphthous stomatitis were seen in < or = 50% of

    reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne
      rickettsial diseases in patients of all ages, including children aged <8
      years, and should be initiated immediately in persons with signs and
      symptoms suggestive of rickettsial disease
    explanation: >-
      The CDC recommendation covers ATBF as a tick-borne rickettsial disease and
      supports immediate empiric doxycycline for clinically compatible illness.

- name: Personal protection against tick bites
  description: >-
    No vaccine exists, so personal protection against ticks -- skin repellents,
    permethrin-impregnated clothing, and behavioral measures -- is the principal
    means of preventing ATBF.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: personal tick-bite protection
  evidence:
  - reference: PMID:21302476
    reference_title: "[Personal protection measures against blood-sucking insects and ticks]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Personal protection measures (PPM) are essential and often the only means"
    explanation: The review establishes personal protection measures as the essential means of preventing tick-borne infection.

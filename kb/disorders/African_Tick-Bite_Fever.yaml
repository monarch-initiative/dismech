name: African Tick-Bite Fever
creation_date: "2026-09-25T11:07:39Z"
updated_date: "2026-09-25T11:07:39Z"
category: Infectious Disease
description: >-
  African tick-bite fever is an acute, usually self-limited spotted fever group
  rickettsiosis caused by the obligately intracellular bacterium Rickettsia
  africae. Infection follows bites from Amblyomma ticks, whose hunting habits
  explain the frequent multiple-eschar and case-cluster presentations. Dermal
  inoculation produces one or more eschars and regional lymphadenopathy, while
  the systemic illness is a febrile headache-myalgia syndrome with only modest
  endothelial inflammatory activation compared with more severe spotted fevers.
disease_term:
  preferred_term: African tick-bite fever
  term:
    id: MONDO:0000227
    label: African tick-bite fever
parents:
- Spotted fever rickettsiosis
synonyms:
- African tick bite fever
- African tick typhus
- Rickettsia africae infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:20233665
      reference_title: "African tick-bite fever: a new entity in the differential diagnosis of multiple eschars in travelers. Description of five cases imported from South Africa to Switzerland."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The etiological agent of ATBF is Rickettsia africae, an emerging
        tick-borne pathogenic bacterium.
      explanation: >-
        The traveler case series and review identifies African tick-bite fever
        as a bacterial spotted-fever rickettsiosis, placing it in Harrison's
        Infectious Diseases Part.


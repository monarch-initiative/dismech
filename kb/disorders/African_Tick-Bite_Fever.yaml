diagnosis:
- name: Clinical diagnosis with retrospective laboratory confirmation
  description: >-
    Initial diagnosis is usually clinical, based on a compatible fever-eschar
    syndrome after travel or tick exposure, because early laboratory tests are
    insensitive or unavailable at symptom onset.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Compatible travel or Amblyomma tick exposure plus fever and one or more
    eschars supports empiric treatment before confirmatory testing returns.
  evidence:
  - reference: PMID:27488618
    reference_title: Molecular diagnosis of African tick bite fever using eschar swabs in a traveller returning from Tanzania.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of African tick bite fever is often based on clinical
      grounds due to a lack of reliable diagnostic tests at commencement of
      symptoms.
    explanation: >-
      The case report's introduction states the acute diagnostic constraint that
      makes clinical diagnosis necessary at presentation.

- name: Eschar-swab PCR for Rickettsia africae
  description: >-
    PCR on material swabbed non-invasively from an eschar can detect R. africae
    DNA during early disease, including after doxycycline has already been
    started in at least one reported imported case.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: A positive eschar-swab PCR identifies the R. africae DNA in an inoculation lesion.
  evidence:
  - reference: PMID:27488618
    reference_title: Molecular diagnosis of African tick bite fever using eschar swabs in a traveller returning from Tanzania.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this patient direct molecular detection of R. africae was performed by
      PCR from a sample obtained non-invasively with a swab from the rickettsial
      eschar.
    explanation: >-
      The imported Tanzanian case demonstrates noninvasive molecular detection
      from an eschar swab.

- name: Indirect immunofluorescence serology
  description: >-
    Retrospective confirmation uses indirect immunofluorescence antibody
    serology, but antibodies cross-react across spotted-fever-group species
    (notably R. conorii), so serology alone does not distinguish ATBF from
    Mediterranean spotted fever.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Rising anti-spotted-fever-group antibody titers confirm rickettsiosis
    retrospectively; species-level distinction requires molecular methods.
  evidence:
  - reference: PMID:9916419
    reference_title: "[Two cases of spotted fever group rickettsiosis contracted in southern parts of Africa]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "apparent cross reaction between the two organisms hampers the use of conventional antibody"
    explanation: The report documents serologic cross-reaction between R. africae and R. conorii, limiting species-level serology.
  - reference: PMID:9916419
    reference_title: "[Two cases of spotted fever group rickettsiosis contracted in southern parts of Africa]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "beta-lactam antibiotics commonly used as an empiric therapy are not effective"
    explanation: >-
      The report notes that empiric beta-lactam antibiotics are ineffective
      against spotted-fever-group rickettsioses, underscoring the need for
      doxycycline.

progression:
- phase: Self-limited acute illness
  notes: >-
    ATBF is usually a mild, self-limited illness; in one traveler outbreak most
    patients recovered spontaneously before antibiotics were started, though
    recovery can be slow, especially in elderly patients.
  evidence:
  - reference: PMID:11939395
    reference_title: Outbreak of African tick-bite fever in six Italian tourists returning from South Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all but one of the patients recovered spontaneously before antibiotic treatment was initiated."
    explanation: The Italian outbreak shows spontaneous recovery in most patients, supporting the self-limited course.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is first-line therapy for tick-borne rickettsial diseases,
    including ATBF, because the drug arrests the bacterial 30S-ribosomal target
    and penetrates the host-cell cytosol where R. africae resides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:

notes: MONDO:0044322 cross-references OMIM:617532 and carries a direct gene-disease relationship (RO:0004003)
  to SLC45A1 (hgnc:17939), confirming the seed OMIM id and ruling out named-entity confusion with GLUT1
  deficiency syndrome (SLC2A1) or other SLC-transporter disorders. Orphanet ORPHA:88616 was checked as
  a seed identifier but as of this curation the Orphadata cache under references_cache/ has no ORPHA_88616.md
  entry; the primary literature anchor used here is the MONDO/OMIM record above. Only three usable primary/case
  reports were identified in PubMed as of 2026-07-06 (Srour et al. 2017, PMID:28434495; Zhou et al. 2024,
  PMID:39003656; Semal et al. 2025, PMID:40541196), consistent with this being an ultra-rare, recently
  described gene-disease association.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: All reported affected individuals carry biallelic (homozygous or compound heterozygous)
    SLC45A1 variants segregating with the phenotype in consanguineous or non-consanguineous families.
  evidence:
  - reference: PMID:28434495
    reference_title: Dysfunction of the Cerebral Glucose Transporter SLC45A1 in Individuals with Intellectual
      Disability and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: glucose transporter, in two consanguineous multiplex families with moderate to severe ID,
      epilepsy, and variable neuropsychiatric features. The variants segregate with the phenotype in these
      families
    explanation: Establishes biallelic (homozygous) SLC45A1 variants segregating with disease in consanguineous
      multiplex families.
  - reference: PMID:40541196
    reference_title: 'Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal
      Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome analysis revealed compound heterozygous variants p.Pro560Leu and p.Arg57Cys in the
      SLC45A1 gene.
    explanation: A fifth, unrelated patient also carries biallelic (compound heterozygous) SLC45A1 variants,
      reinforcing autosomal recessive inheritance.
pathophysiology:
- name: SLC45A1 Loss of Function
  description: Biallelic SLC45A1 variants reduce the glucose transport activity of the encoded protein,
    a cerebral glucose transporter expressed in the developing and adult brain (cortex and cerebellum).
    Missense variants tested in transfected COS-7/COS7 cells show substantially reduced intracellular
    glucose transport activity relative to wild-type SLC45A1, in one case attributable to failure of the
    mutant protein to localize correctly to the cytomembrane.
  genes:
  - preferred_term: SLC45A1
    term:
      id: hgnc:17939
      label: SLC45A1
  molecular_functions:
  - preferred_term: D-glucose transmembrane transporter activity
    term:
      id: GO:0055056
      label: D-glucose transmembrane transporter activity
    modifier: DECREASED

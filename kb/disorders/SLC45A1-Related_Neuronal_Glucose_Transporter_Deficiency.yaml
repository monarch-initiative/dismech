name: SLC45A1-Related Neuronal Glucose Transporter Deficiency
creation_date: '2026-07-06T00:00:00Z'
category: Mendelian
synonyms:
- Intellectual developmental disorder with neuropsychiatric features
- IDDNPF
- SLC45A1-related intellectual disability and epilepsy
description: SLC45A1-related neuronal glucose transporter deficiency is an ultra-rare autosomal recessive
  neurodevelopmental disorder caused by biallelic loss-of-function variants in SLC45A1, which encodes
  the second known cerebral glucose transporter (after GLUT1/SLC2A1). Reported individuals present with
  moderate to severe intellectual disability, epilepsy (including focal-onset seizures), and variable
  neuropsychiatric features such as anxiety and autistic behaviors, with mild facial dysmorphism in some.
  Only a handful of families have been reported to date.

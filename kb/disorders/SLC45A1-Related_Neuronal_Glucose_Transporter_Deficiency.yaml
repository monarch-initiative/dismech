    reference_title: 'Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal
      Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Solute carrier family 45 member A1 (SLC45A1) is a glucose brain transporter predominantly
      expressed in the developing and adult brain, including the cortex and cerebellum.
    explanation: Confirms SLC45A1 as a brain-expressed glucose transporter, supporting the proposed neuronal
      glucose transport deficit.
  downstream:
  - target: Intellectual Disability
    description: Impaired neuronal glucose uptake across developing and adult cortex and cerebellum leads
      to moderate-to-severe intellectual disability.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28434495
      reference_title: Dysfunction of the Cerebral Glucose Transporter SLC45A1 in Individuals with Intellectual
        Disability and Epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All together, our data strongly suggest that recessive mutations in SLC45A1 cause ID and
        epilepsy.
      explanation: Connects recessive loss-of-function variants in the cerebral glucose transporter SLC45A1
        to intellectual disability.
  - target: Seizures
    description: Deficient cerebral glucose transport into neurons leads to focal and generalized epilepsy
      responsive to ketogenic diet.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40541196
      reference_title: 'Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal
        Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Meanwhile, a KD was introduced, and the child became seizure-free with cognitive improvement.
      explanation: Seizure freedom on ketogenic diet (which supplies an alternative brain fuel source)
        supports impaired neuronal glucose transport as the cause of epilepsy.
      directness: INDIRECT
  - target: Neuropsychiatric Features
    description: Impaired cerebral glucose transport contributes to variable neuropsychiatric manifestations
      in affected individuals.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28434495
      reference_title: Dysfunction of the Cerebral Glucose Transporter SLC45A1 in Individuals with Intellectual
        Disability and Epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: in two consanguineous multiplex families with moderate to severe ID, epilepsy, and variable
        neuropsychiatric features.
      explanation: Associates cerebral glucose transporter SLC45A1 dysfunction with neuropsychiatric features
        alongside intellectual disability and epilepsy.
  - target: Developmental Delay
    description: Impaired neuronal glucose transport in the developing brain causes global developmental
      delay.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40541196
      reference_title: 'Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal
        Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A 3-year-old boy presented with developmental delay and unexpected nighttime arousals followed
        by sudden right arm extension suggestive of epilepsy.
      explanation: Documents early developmental delay in SLC45A1 cerebral glucose transporter deficiency.

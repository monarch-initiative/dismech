  evidence:
  - reference: PMID:28434495
    reference_title: Dysfunction of the Cerebral Glucose Transporter SLC45A1 in Individuals with Intellectual
      Disability and Epilepsy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: glucose transport activity of the p.Arg176Trp and p.Ala210Val SLC45A1 variants, measured
      in transfected COS-7 cells, was approximately 50% (p = 0.013) and 33% (p = 0.008) lower, respectively,
      than that of intact SLC45A1.
    explanation: Direct functional evidence that disease-associated SLC45A1 missense variants reduce glucose
      transport activity in a cell-based assay.
  - reference: PMID:39003656
    reference_title: Compound heterozygous variants in SLC45A1 might cause syndromic intellectual disability
      by localization failure and activity attenuation in cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In SLC45A1 variants, the hydrogen bonds surrounding the 35th and 404th amino acid were changed,
      location on the cytomembrane was failed, their activity to transport glucose was also significantly
      decreased to contrast with SLC45A1-WT.
    explanation: Independent functional replication showing mutant SLC45A1 mislocalizes and has attenuated
      glucose transport activity relative to wild-type.
  downstream:
  - target: Impaired Neuronal Glucose Transport
    description: Reduced SLC45A1 glucose transport activity is proposed to impair glucose uptake into
      neural cells, analogous to the mechanism of GLUT1 (SLC2A1) deficiency, the only other known cerebral
      glucose transporter disorder.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28434495
      reference_title: Dysfunction of the Cerebral Glucose Transporter SLC45A1 in Individuals with Intellectual
        Disability and Epilepsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Glucose transport across the blood brain barrier and into neural cells is critical for
        normal cerebral physiologic function. Dysfunction of the cerebral glucose transporter GLUT1 (encoded
        by SLC2A1) is known to result in epilepsy, intellectual disability (ID), and movement disorder.
      explanation: The paper frames SLC45A1 as a second cerebral glucose transporter whose dysfunction
        is mechanistically analogous to GLUT1 deficiency, which is caused by impaired neuronal glucose
        uptake.
- name: Impaired Neuronal Glucose Transport
  description: Impaired glucose transport into neural cells is the proposed proximate mechanism linking
    SLC45A1 dysfunction to the neurodevelopmental phenotype, though (unlike GLUT1 deficiency) CSF glucose
    has not been reported as reduced in the published SLC45A1 cases.

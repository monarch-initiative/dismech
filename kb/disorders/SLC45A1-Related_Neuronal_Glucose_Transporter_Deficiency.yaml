treatments:
- name: Ketogenic Diet
  description: A ketogenic diet was used in one reported patient with SLC45A1-related focal refractory
    epilepsy and produced seizure freedom with cognitive improvement; seizures relapsed after the diet
    was stopped.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ketogenic diet intake
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_mechanisms:
  - target: Impaired Neuronal Glucose Transport
    treatment_effect: BYPASSES
    description: Ketogenic diet provides ketone bodies as an alternative cerebral energy substrate, bypassing
      the defective SLC45A1-mediated neuronal glucose transport.
    evidence:
    - reference: PMID:40541196
      reference_title: 'Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal
        Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Meanwhile, a KD was introduced, and the child became seizure-free with cognitive improvement.
        After 2 years, the KD was stopped, and seizures relapsed.
      explanation: Consistent with ketogenic diet bypassing the proposed cerebral glucose transport deficit
        by supplying ketone bodies to achieve seizure freedom and cognitive improvement.
      directness: INDIRECT
  evidence:
  - reference: PMID:40541196
    reference_title: 'Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal
      Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Meanwhile, a KD was introduced, and the child became seizure-free with cognitive improvement.
      After 2 years, the KD was stopped, and seizures relapsed.
    explanation: Directly documents ketogenic diet efficacy (seizure freedom) and relapse on discontinuation
      in a genetically confirmed SLC45A1 patient.
- name: Acetazolamide
  description: Acetazolamide was introduced after ketogenic-diet relapse in one reported patient and achieved
    seizure freedom for 10 months.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

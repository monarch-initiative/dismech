genetic:
- name: SLC45A1 biallelic loss-of-function/hypomorphic variants
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SLC45A1
    term:
      id: hgnc:17939
      label: SLC45A1
  variant_origin: GERMLINE
  notes: >-
    As of this curation (2026-07-06), only five affected individuals across
    three families have been reported in the literature (two consanguineous
    families in Srour et al. 2017, one family in Zhou et al. 2024, and one
    sporadic patient in Semal et al. 2025).
  evidence:
  - reference: PMID:28434495
    reference_title: Dysfunction of the Cerebral Glucose Transporter SLC45A1 in Individuals with Intellectual Disability and Epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants segregate with the phenotype in these families, affect
      well-conserved amino acids, and are predicted to be damaging by in
      silico programs.
    explanation: >-
      Establishes segregation of the SLC45A1 variants with disease in the
      founding families.
  - reference: PMID:39003656
    reference_title: Compound heterozygous variants in SLC45A1 might cause syndromic intellectual disability by localization failure and activity attenuation in cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through trio-based exome sequencing, the missense mutations of SLC45A1
      c.103G>A (p.V35M) and c.1211T>G (p.F404C) were identified in the
      proband with syndromic ID.
    explanation: >-
      Independent trio exome sequencing identifies compound heterozygous
      SLC45A1 missense variants in a proband with syndromic intellectual
      disability.
  - reference: PMID:40541196
    reference_title: "Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in SLC45A1 have been described in four patients
      from two unrelated families with dysmorphic features, intellectual
      disability, and focal epilepsy. We describe the fifth SLC45A1 patient
    explanation: >-
      Confirms the small total number of reported SLC45A1 patients and adds
      a fifth case with compound heterozygous variants.
treatments:
- name: Ketogenic Diet
  description: >-
    A ketogenic diet was used in one reported patient with SLC45A1-related
    focal refractory epilepsy and produced seizure freedom with cognitive
    improvement; seizures relapsed after the diet was stopped.
  treatment_term:
    preferred_term: ketogenic diet intake
    term:
      id: MAXO:0030010
      label: ketogenic diet intake
  evidence:
  - reference: PMID:40541196
    reference_title: "Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meanwhile, a KD was introduced, and the child became seizure-free
      with cognitive improvement. After 2 years, the KD was stopped, and
      seizures relapsed.
    explanation: >-
      Directly documents ketogenic diet efficacy (seizure freedom) and
      relapse on discontinuation in a genetically confirmed SLC45A1 patient.
- name: Acetazolamide
  description: >-
    Acetazolamide was introduced after ketogenic-diet relapse in one
    reported patient and achieved seizure freedom for 10 months.
  treatment_term:

    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:40541196
    reference_title: "Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Solute carrier family 45 member A1 (SLC45A1) is a glucose brain
      transporter predominantly expressed in the developing and adult brain,
      including the cortex and cerebellum.
    explanation: >-
      Confirms SLC45A1 as a brain-expressed glucose transporter, supporting
      the proposed neuronal glucose transport deficit.
  downstream:
  - target: Neurodevelopmental and Epileptic Phenotype
    description: >-
      Impaired neuronal glucose transport is hypothesized to underlie the
      combination of intellectual disability, epilepsy, and neuropsychiatric
      features seen in affected individuals, and is consistent with the
      response of seizures to ketogenic diet (which provides an alternative,
      transporter-independent brain fuel source) reported in one patient.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40541196
      reference_title: "Solute Carrier 45A1: A New Cerebral Glucose Transporter Brain Disorder with Focal Refractory Epilepsy Responsive to Ketogenic Diet and Acetazolamide."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Meanwhile, a KD was introduced, and the child became seizure-free
        with cognitive improvement.
      explanation: >-
        Clinical response to ketogenic diet (an alternative brain-fuel
        strategy used in other cerebral-glucose-transport disorders such as
        GLUT1 deficiency) is consistent with an underlying neuronal glucose
        transport deficit, though the paper does not directly measure CSF
        glucose in this patient.

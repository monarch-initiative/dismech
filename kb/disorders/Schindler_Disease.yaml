progression:
- phase: Infantile onset and rapid neurodegeneration
  age_range: Onset around second year of life; typically fatal before age 6 years
  evidence:
  - reference: PMID:31890708
    reference_title: "A New Case of Schindler Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Schindler disease type I generally develops around the second year of
      life, presenting with hypotonia, areflexia, rigidity, spasticity,
      deafness, blindness and mental deterioration. This typically results in
      death before the age of 6 years.
    explanation: >-
      Summarizes the infantile onset around 1-2 years of age and early-childhood
      mortality of Schindler disease type I.

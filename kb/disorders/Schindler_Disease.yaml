notes: >-
  No GeneReviews or StatPearls chapter covers Schindler disease (MONDO:0012221).
  ClinGen classifies NAGA as Definitive for umbrella
  alpha-N-acetylgalactosaminidase deficiency (MONDO:0017779) rather than
  separately for type 1 (MONDO:0012221), so no subtype-specific
  gene_disease_validity assertion is recorded here.

  Orphanet's annotation set for ORPHA:79279 also lists cutaneous, vascular,
  cardiac, and adult or intermediate features characteristic of type II
  (Kanzaki disease, MONDO:0012222) or type III NAGA deficiency (hyperkeratosis,
  telangiectasia of the skin, lymphedema, hypertrophic cardiomyopathy, vertigo,
  paresthesia, and autism), which are deliberately excluded from this infantile
  neuroaxonal dystrophy entry; Orphanet's Global developmental delay (HP:0001263)
  row is covered more specifically by Developmental regression and Severe
  intellectual disability.

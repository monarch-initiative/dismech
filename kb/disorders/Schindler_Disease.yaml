    reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Axonal 'spheroids' were observed histologically in the grey matter, and
      ultrastructural examination revealed the characteristic formations in
      dystrophic axons in the myenteric plexus and neocortex.
    explanation: >-
      Establishes neocortical grey-matter and myenteric dystrophic axonal
      spheroids as the histopathological hallmark of Schindler disease.
  downstream:
  - target: Central nervous system axonal spheroids
    description: Dystrophic preterminal axonal swelling directly manifests histologically as grey-matter axonal spheroids.
  - target: Developmental regression
    description: Rapid cortical neurodegeneration causes loss of acquired developmental milestones in infancy.
  - target: Severe intellectual disability
    description: Rapid cortical neuroaxonal degeneration culminates in profound cognitive impairment in early childhood.
  - target: Hypotonia
    description: Early central and peripheral neuroaxonal dysfunction presents with infantile hypotonia.
  - target: Muscle weakness
    description: Progressive central and neuromuscular axonal dystrophy causes generalized muscle weakness.
  - target: Generalized amyotrophy
    description: Progressive neuroaxonal degeneration and disuse produce generalized muscle wasting.
  - target: Spasticity
    description: Progressive corticospinal tract degeneration produces spasticity and rigidity.
  - target: Abnormal pyramidal sign
    description: Corticospinal tract neuroaxonal degeneration produces pyramidal tract signs.
  - target: Areflexia
    description: Progressive neuroaxonal degeneration is accompanied by loss of deep tendon reflexes.
  - target: Seizures
    description: Progressive neocortical grey-matter degeneration provokes epileptic seizures.
  - target: Myoclonus
    description: Cortical and subcortical neuroaxonal degeneration produces myoclonic jerks.
  - target: Abnormal brainstem morphology
    description: Widespread central neuroaxonal degeneration involves brainstem structures.
  - target: Optic atrophy
    description: Progressive visual-pathway neuroaxonal degeneration is accompanied by optic nerve atrophy.
  - target: Cerebral visual impairment
    description: Neocortical visual-pathway neurodegeneration causes cortical visual impairment.
  - target: Blindness
    description: Progressive optic pathway and cerebral visual cortex degeneration culminates in blindness.
  - target: Nystagmus
    description: Oculomotor and visual-pathway neurodegeneration manifests with nystagmus.
  - target: Strabismus
    description: Central oculomotor and visual dysfunction manifests with strabismus.
  - target: Hearing impairment
    description: Progressive auditory pathway neurodegeneration causes sensorineural hearing loss.

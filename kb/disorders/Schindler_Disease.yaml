name: Schindler Disease
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Schindler disease (alpha-N-acetylgalactosaminidase deficiency type 1) is the
  severe, infantile-onset neuroaxonal-dystrophy form of NAGA deficiency, an
  autosomal recessive lysosomal glycoproteinosis caused by biallelic NAGA
  variants that abolish lysosomal alpha-N-acetylgalactosaminidase activity.
  Enzyme deficiency impairs catabolism of O-linked glycopeptides and
  glycoconjugates bearing terminal alpha-N-acetylgalactosamine, producing
  lysosomal substrate storage, urinary glycopeptide excretion, grey-matter
  axonal spheroids, and rapidly progressive infantile neurodegeneration with
  developmental regression, hypotonia, spasticity, seizures, optic atrophy,
  blindness, and deafness, typically fatal before 6 years of age, in contrast
  to the adult-onset Kanzaki (type II) form.
synonyms:
- alpha-N-acetylgalactosaminidase deficiency type 1
- Schindler disease type I
- Schindler disease type 1
- NAGA deficiency type 1
- infantile neuroaxonal dystrophy due to alpha-NAGA deficiency
- NAGA deficiency, infantile

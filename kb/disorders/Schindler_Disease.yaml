  description: >-
    Classic infantile neuroaxonal dystrophy (Seitelberger disease, usually
    PLA2G6-related) shares grey-matter axonal spheroids and infantile
    neurodegeneration with Schindler disease but exhibits normal alpha-NAGA
    enzymatic activity, distinguishing it biochemically.

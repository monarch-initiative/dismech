      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: c.973G>A (p.Glu325Lys / E325K)
    description: >-
      Homozygous missense substitution identified in the original affected
      brothers of family D; disrupts an internal E325-R316 ion pair and
      abolishes catalytic alpha-NAGA activity.
    evidence:
    - reference: PMID:2243144
      reference_title: "Schindler disease: the molecular lesion in the alpha-N-acetylgalactosaminidase gene that causes an infantile neuroaxonal dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A single G to A transition at nucleotide 973 was detected in multiple
        subclones containing the PCR products. This point mutation resulted in a
        glutamic acid to lysine substitution in residue 325 (E325K) of the
        alpha-GalNAc polypeptide.
      explanation: Identifies the homozygous c.973G>A (p.Glu325Lys) lesion in the index Schindler disease family.
  notes: >-
    Biallelic loss-of-function NAGA variants cause Schindler disease; the
    original family D brothers were homozygous for the E325K (p.Glu325Lys)
    substitution, which abolishes enzyme activity.
  evidence:
  - reference: PMID:2243144
    reference_title: "Schindler disease: the molecular lesion in the alpha-N-acetylgalactosaminidase gene that causes an infantile neuroaxonal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Schindler disease is a recently recognized infantile neuroaxonal dystrophy
      resulting from the deficient activity of the lysosomal hydrolase,
      alpha-N-acetylgalctosaminidase (alpha-GalNAc).
    explanation: Establishes biallelic NAGA deficiency as the genetic basis of Schindler disease.
diagnosis:
- name: Enzyme assay and molecular testing
  description: >-
    Diagnosis rests on demonstrating markedly deficient alpha-NAGA enzymatic
    activity in leukocytes, plasma, or fibroblasts using fluorogenic substrate
    (4-methylumbelliferyl-alpha-N-acetylgalactosaminide), supported by urinary
    oligosaccharide/glycopeptide chromatography and confirmed by NAGA
    sequencing.
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  measurements:
  - preferred_term: Alpha-NAGA activity
    term:
      id: LOINC:LP14015-9
      label: Alpha-N-acetylgalactosaminidase
  notes: >-
    Bound the specimen-generic Part code: this row's own evidence names "a
    blood test" rather than a single bound specimen type, and this disease is
    the severe, infantile-onset end of the same alpha-N-acetylgalactosaminidase
    (NAGA) deficiency spectrum as Kanzaki disease (type 2), which already uses
    this code for its own enzyme assay. No reference_ranges band is recorded:
    the source states "diminished" activity qualitatively, with no numeric
    cut-off.
  evidence:
  - reference: PMID:2122121
    reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a newly synthesized fluorogenic substrate,
      4-methylumbelliferyl-alpha-N-acetylgalactosaminide, the markedly deficient
      activity of alpha-N-acetylgalactosaminidase was demonstrated in the
      affected brothers while their consanguineous parents had intermediate
      activities, consistent with the autosomal recessive transmission of this
      disease.
    explanation: >-
      Establishes fluorogenic enzymatic assay of alpha-NAGA activity as the
      primary biochemical diagnostic test.
  - reference: PMID:31890708
    reference_title: "A New Case of Schindler Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Enzymatic analysis through a blood test shows diminished α-NAGA activity."
    explanation: Blood enzymatic assay shows diminished alpha-NAGA activity.
- name: Molecular genetic testing of NAGA
  description: >-
    PCR amplification and sequencing of the NAGA gene confirms biallelic
    pathogenic variants and serves as the molecular diagnostic gold standard.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31890708
    reference_title: "A New Case of Schindler Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, genetics testing (PCR) is the gold-standard method for diagnosis."
    explanation: Molecular genetic testing of NAGA is the gold-standard confirmatory diagnostic method.

pathophysiology:
- name: Alpha-N-Acetylgalactosaminidase Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic NAGA loss-of-function variants (such as the E325K substitution,
    which disrupts the buried E325-R316 salt bridge and destabilizes the
    homodimeric glycoside hydrolase) abolish lysosomal
    alpha-N-acetylgalactosaminidase activity required to cleave terminal
    alpha-N-acetylgalactosamine residues from glycopeptides and glycolipids.
  gene:
    preferred_term: NAGA
    term:
      id: hgnc:7631
      label: NAGA
  molecular_functions:
  - preferred_term: alpha-N-acetylgalactosaminidase activity
    term:
      id: GO:0008456
      label: alpha-N-acetylgalactosaminidase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: glycoprotein catabolic process
    term:
      id: GO:0006516
      label: glycoprotein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:2243144
    reference_title: "Schindler disease: the molecular lesion in the alpha-N-acetylgalactosaminidase gene that causes an infantile neuroaxonal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, transient expression of an alpha-GalNAc construct containing
      the E325K mutation resulted in the expression of an immunoreactive
      polypeptide which had no detectable alpha-GalNAc activity.
    explanation: >-
      Demonstrates functionally that the Schindler disease E325K NAGA variant
      abolishes catalytic alpha-N-acetylgalactosaminidase activity.
  - reference: PMID:19683538
    reference_title: "The 1.9 a structure of human alpha-N-acetylgalactosaminidase: The molecular basis of Schindler and Kanzaki diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The E325K substitution leads to the loss of an ion pair between E325 and
      R316, resulting in the energetically unfavorable clustering of three basic
      residues (R316, K319, and E325K) within 3 Å of each other.
    explanation: >-
      High-resolution X-ray crystal structure elucidating how E325K disrupts the
      alpha-NAGAL fold.
  downstream:
  - target: Lysosomal Glycopeptide Accumulation
    description: Loss of lysosomal alpha-NAGA exoglycosidase activity prevents degradation of O-linked glycopeptides and blood-group-A glycoconjugates.
- name: Lysosomal Glycopeptide Accumulation
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Failure to cleave terminal alpha-N-acetylgalactosamine causes
    intralysosomal accumulation and urinary excretion of O-linked sialylated
    and asialoglycopeptides and blood-group-A trisaccharide glycoconjugates.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:2122121
    reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analytical studies identified four of the accumulating urinary compounds,
      the blood group A trisaccharide GalNAc alpha 1----3(Fuc alpha 1----2)Gal
      and three O-linked glycopeptides, GalNAc alpha 1----O-serine and
      -threonine, NeuNAc alpha 2----3Gal beta 1----3(NeuNAc alpha 2----6)GalNAc
      alpha 1----O-serine and -threonine, and NeuNAc alpha 2----3Gal beta
      1----4GlcNAc beta 1----6(NeuNAc alpha 2----3Gal beta 1----3)GalNAc alpha
      1----O-serine and -threonine.
    explanation: >-
      Identifies the exact O-linked glycopeptides and blood-group-A
      trisaccharide accumulating in Schindler disease patients.
  - reference: PMID:14685826
    reference_title: "Structural and immunocytochemical studies on alpha-N-acetylgalactosaminidase deficiency (Schindler/Kanzaki disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "a wide spectrum including an early onset neuroaxonal dystrophy (Schindler disease) and late onset angiokeratoma corporis diffusum (Kanzaki disease)"
    explanation: Situates Schindler disease at the severe infantile neuroaxonal-dystrophy end of the alpha-NAGA storage spectrum.
  downstream:
  - target: Neuroaxonal Dystrophy and Neurodegeneration
    description: Neuronal glycopeptide and glycoconjugate storage leads to dystrophic axonal spheroid formation and progressive neurodegeneration.
- name: Neuroaxonal Dystrophy and Neurodegeneration
  conforms_to: "lysosomal_substrate_accumulation#Progressive Multisystem and Neurodegenerative Disease"
  biological_scale: TISSUE
  description: >-
    Progressive neuronal and axonal pathology produces widespread dystrophic
    axonal spheroids in neocortical grey matter and myenteric plexus, driving
    rapidly progressive psychomotor regression, pyramidal and neuromuscular
    signs, seizures, and visual and auditory loss.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:

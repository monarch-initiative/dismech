classifications:
  lysosomal_storage_category:
    classification_value: glycoproteinosis
    evidence:
    - reference: PMID:2122121
      reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings document the first delineation of a metabolic defect in
        an inherited neuroaxonal dystrophy and suggest that the axonal pathology
        in this disorder, and perhaps in the other neuroaxonal dystrophies,
        results from abnormal glycoprotein metabolism involving O-linked
        glycopeptides.
      explanation: >-
        Establishes Schindler disease as a lysosomal glycoproteinosis with
        impaired catabolism and storage of O-linked glycopeptides.
  icimd_category:
  - classification_value: glycoprotein_degradation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      glycoprotein degradation" under category 20 "Disorders of complex
      molecule degradation".
    evidence:
    - reference: PMID:33340416
      reference_title: "An international classification of inherited metabolic disorders (ICIMD)."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This category comprises what is generally known as lysosomal disorders –
        such as the disorders of sphingolipid, glycosaminoglycan, or
        glycoprotein degradation and the neuronal ceroid lipofuscinoses – as
        well as the disorders of autophagy and some other disorders.
      explanation: >-
        Places lysosomal glycoprotein-degradation defects under ICIMD category
        20 (Disorders of complex molecule degradation).
    - reference: PMID:2122121
      reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings document the first delineation of a metabolic defect in
        an inherited neuroaxonal dystrophy and suggest that the axonal pathology
        in this disorder, and perhaps in the other neuroaxonal dystrophies,
        results from abnormal glycoprotein metabolism involving O-linked
        glycopeptides.
      explanation: >-
        Confirms alpha-N-acetylgalactosaminidase deficiency as a disorder of
        lysosomal O-linked glycoprotein degradation.
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: PMID:2122121
      reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical, pathological and biochemical features of a neuroaxonal
        dystrophy resulting from the deficient activity of lysosomal
        alpha-N-acetylgalactosaminidase are described.
      explanation: >-
        Places Schindler disease among inherited lysosomal metabolic storage
        disorders.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:2122121
      reference_title: "Schindler disease: an inherited neuroaxonal dystrophy due to alpha-N-acetylgalactosaminidase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Axonal 'spheroids' were observed histologically in the grey matter, and
        ultrastructural examination revealed the characteristic formations in
        dystrophic axons in the myenteric plexus and neocortex.
      explanation: >-
        Documents severe central and enteric neuroaxonal dystrophy as the
        defining neurological pathology.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:2243144
      reference_title: "Schindler disease: the molecular lesion in the alpha-N-acetylgalactosaminidase gene that causes an infantile neuroaxonal dystrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The recent isolation and expression of the full-length cDNA encoding
        alpha-GalNAc facilitated the identification of the molecular lesions in
        the affected brothers from family D, the first cases described with this
        autosomal recessive disease.
      explanation: >-
        Establishes monogenic autosomal recessive etiology due to biallelic NAGA
        mutations.

  evidence:
  - reference: PMID:31588537
    reference_title: Hereditary Neurohypophyseal Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Current data show that retained mutants fail to be eliminated by the cell's quality control system and accumulate in fibrillar aggregations within the ER."
    explanation: States both halves of this node - quality-control failure and fibrillar
      aggregation in the ER.
  - reference: PMID:31785344
    reference_title: Role of protein aggregation and degradation in autosomal dominant neurohypophyseal
      diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A portion of these mutants is eliminated via ER-associated degradation (ERAD) by proteasomes after retrotranslocation to the cytosol. Another portion forms large disulfide-linked fibrillar aggregates within the ER, in which wild-type precursor is trapped."
    explanation: >-
      Gives the two fates of the retained precursor and, decisively for the
      dominance of the disease, records that wild-type precursor is trapped in
      the aggregate.
  - reference: PMID:29961215
    reference_title: A novel mechanism of autophagy-associated cell death of vasopressin neurons in
      familial neurohypophysial diabetes insipidus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electron microscopic analyses revealed that aggregates were confined to a sub-compartment of the endoplasmic reticulum (ER), ER-associated compartment (ERAC), in AVP neurons of FNDI mice under normal conditions."
    explanation: Establishes the in-vivo ultrastructure of the aggregate in the neuron the
      disease actually affects, and its initial containment.
  - reference: PMID:34232487
    reference_title: Functional analyses of three different mutations in the AVP-NPII gene causing
      familial neurohypophyseal diabetes insipidus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fluorescence imaging studies showed that a substantial portion of the mutant p.G45C and p.G88V AVP-NPII precursors appeared to be located in the endoplasmic reticulum (ER), whereas 207_209delGGC and WT AVP-NPII precursors were distributed throughout the cytoplasm."
    explanation: >-
      Independent allele-level confirmation of ER localisation, and a useful
      negative control: an in-frame deletion that did not retain traffic
      normally, so retention is a property of particular alleles rather than of
      any AVP change.
  - reference: PMID:28920920
    reference_title: ER-associated degradation is required for vasopressin prohormone processing and
      systemic water homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, we found that ERAD deficiency causes marked ER retention and aggregation of a large proportion of all proAVP protein."
    explanation: >-
      The converse experiment, and the strongest evidence that ERAD capacity is
      what stands between a vasopressin neuron and this node: remove the
      Sel1L-Hrd1 machinery and even entirely wild-type proAVP is retained and
      aggregates. It establishes ERAD saturation as a sufficient cause of the
      aggregation step rather than an incidental accompaniment of it.
  downstream:
  - target: Vasopressin Neuron Secretory Dysfunction
    causal_link_type: DIRECT
    description: >-
      Aggregate accumulation disables hormone production and release before any
      cell is lost, which is the step that makes polyuria precede
      neurodegeneration.
    evidence:
    - reference: PMID:19297548
      reference_title: Progressive polyuria without vasopressin neuron loss in a mouse model for familial
        neurohypophysial diabetes insipidus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data suggest that cell death is not the primary cause of polyuria in FNDI, and that the aggregates accumulated in the ER might be involved in the dysfunction of AVP neurons that lead to the progressive polyuria."
      explanation: >-
        The authors' own statement of this edge - the aggregate causes neuronal
        dysfunction, and that dysfunction rather than cell death is what
        produces the polyuria.
  - target: Endoplasmic Reticulum Stress and Autophagy Induction
    causal_link_type: DIRECT
    description: >-
      Once aggregates exceed the ER-associated compartment that contains them
      and spill into a dilating ER lumen, the cell turns to autophagy.
    evidence:

  - reference: PMID:31588537
    reference_title: Hereditary Neurohypophyseal Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal dominant neurohypophyseal DI may thus be viewed as a neurodegenerative disease confined to vasopressinergic neurons."
    explanation: States the framing this node adopts, including the cell-type restriction
      that distinguishes it from a general proteinopathy.
  - reference: PMID:29961215
    reference_title: A novel mechanism of autophagy-associated cell death of vasopressin neurons in
      familial neurohypophysial diabetes insipidus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, the cytoplasm was entirely occupied with large vacuoles in AVP neurons of FNDI mice subjected to water deprivation for 12 weeks, at which stage 30-40% of AVP neurons were lost."
    explanation: Quantifies the loss in vivo and ties its rate to osmotic demand on the
      mutant neurons.
  downstream:
  - target: Progressive Arginine Vasopressin Deficiency
    causal_link_type: DIRECT
    description: >-
      Neurons that have died cannot be recruited, so this arm makes the
      deficiency irreversible where the secretory-dysfunction arm alone might
      not be.

- name: Secreted Weakly Active Vasopressin
  description: >-
    The recessive contrast mechanism, present only in the AR P26L subtype. The
    p.Pro26Leu precursor is not folding incompetent: it moves through the
    secretory pathway, is packaged into granules in the cell processes and is
    released, so there is no ER retention, no aggregate and no proteotoxic
    threat to the neuron. What reaches the circulation is a poor V2 receptor
    agonist. Immunoreactive vasopressin in serum is therefore high, not low -
    the opposite of the dominant disease - while antidiuresis fails all the
    same. This node is included because the recessive form is otherwise easy to
    read as a milder version of the same disease, and it is not.
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  subtypes:
  - AR P26L
  genes:
  - preferred_term: AVP
    term:
      id: hgnc:894
      label: AVP
  evidence:
  - reference: PMID:15356057
    reference_title: 'Differential cellular handling of defective arginine vasopressin (AVP) prohormones
      in cells expressing mutations of the AVP gene associated with autosomal dominant and recessive
      familial neurohypophyseal diabetes insipidus.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Confocal laser scanning microscopy showed accumulation of the Y21H prohormone in the endoplasmic reticulum, whereas the P26L prohormone and/or processed products were localized in secretory granules in the cellular processes."
    explanation: >-
      Side-by-side demonstration in one experiment that the dominant allele is
      ER-retained and the recessive one is not, which is the whole basis for
      modelling them as different mechanisms.
  - reference: PMID:15356057
    reference_title: 'Differential cellular handling of defective arginine vasopressin (AVP) prohormones
      in cells expressing mutations of the AVP gene associated with autosomal dominant and recessive
      familial neurohypophyseal diabetes insipidus.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the recessive mutation does not seem to affect the intracellular trafficking but rather the final processing of the prohormone."
    explanation: The authors' summary of where the recessive defect lies, which is downstream
      of everything the dominant mechanism turns on.
  - reference: PMID:10369876
    reference_title: Autosomal recessive familial neurohypophyseal diabetes insipidus with continued
      secretion of mutant weakly active vasopressin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measured by radioimmunoassay with a synthetic Leu-AVP standard, serum Leu-AVP levels were elevated in all three children and further increased during water deprivation to as high as 30 times normal."
    explanation: >-
      Establishes in patients that the mutant hormone is made, secreted and
      osmotically regulated - so the deficiency in this subtype is of hormone
      action, not of hormone supply.
  downstream:
  - target: Impaired Renal Free Water Reabsorption
    causal_link_type: DIRECT
    description: >-
      A weak V2 agonist circulating at high concentration still fails to
      generate an adequate antidiuretic signal at the collecting duct.
    evidence:
    - reference: PMID:31588537
      reference_title: Hereditary Neurohypophyseal Diabetes Insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Symptoms result from the lack of hormone, or from the inability of mutant AVP to activate its renal receptor, and respond to treatment with desmopressin (DDAVP)."
      explanation: >-
        Names both routes to the same renal endpoint and assigns the second one
        - receptor activation failure - to exactly this situation.

- name: Progressive Arginine Vasopressin Deficiency
  description: >-
    The systemic consequence: circulating arginine vasopressin falls below what
    is needed to concentrate urine, and continues to fall over years as more
    neurons become dysfunctional and then die. Partial deficiency is common
    early, so the water deprivation test can be equivocal in a child who will
    later have unmistakable disease. Osmoregulated thirst is intact, which is
    what keeps most patients in water balance and turns the deficiency into a
    drinking problem rather than a hypernatraemia problem.
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  chemical_entities:
  - preferred_term: arginine vasopressin
    term:
      id: CHEBI:34543
      label: argipressin
    modifier: DECREASED
  evidence:
  - reference: PMID:31588537
    reference_title: Hereditary Neurohypophyseal Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dominant mutations cause retention of the hormone precursor in the endoplasmic reticulum (ER) of vasopressinergic neurons in the hypothalamus, resulting in cellular dysfunction and eventually neuronal death."
    explanation: Traces the chain from ER retention through dysfunction to death, the two
      upstream arms that converge on this node.
  - reference: PMID:29961215
    reference_title: A novel mechanism of autophagy-associated cell death of vasopressin neurons in
      familial neurohypophysial diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Familial neurohypophysial diabetes insipidus (FNDI), characterized by delayed-onset progressive polyuria and loss of arginine vasopressin (AVP) neuron, is an autosomal dominant disorder caused by AVP gene mutations."
    explanation: States the delayed onset and progressive character that this node is
      responsible for, as opposed to a congenital fixed deficit.
  downstream:
  - target: Impaired Renal Free Water Reabsorption
    causal_link_type: DIRECT
    description: >-
      The endocrine-to-renal step. Circulating vasopressin is the ligand for the
      V2 receptor on the collecting duct principal cell, and without it the
      aquaporin-2 trafficking that makes the duct water-permeable does not
      happen.
    evidence:
    - reference: PMID:29421628
      reference_title: '[Nephrogenic diabetes insipidus].'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Binding of AVP to the arginine-vasopressin receptor type-2 in the basolateral membrane leads to translocation of aquaporin-2 water channels to the apical membrane of the principal cells of the collecting duct, inducing water permeability of the membrane."
      explanation: >-
        Gives the molecular mechanism of this edge in the forward direction.
        The paper is about the nephrogenic disease, where the same axis fails at
        the receptor rather than at the ligand, so the physiology it states
        supports this edge by inference rather than by studying it.
      directness: INDIRECT

- name: Impaired Renal Free Water Reabsorption
  description: >-
    Without an adequate vasopressin signal at the V2 receptor of the collecting
    duct principal cell, aquaporin-2 is not inserted into the apical membrane,
    the duct stays water-impermeable and the osmotic gradient of the medulla
    cannot be used. Large volumes of maximally dilute urine are lost. Everything
    clinical in this disease follows from here.
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: renal water absorption
    term:
      id: GO:0070295
      label: renal water absorption
    modifier: DECREASED
  locations:
  - preferred_term: collecting duct of renal tubule
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  evidence:
  - reference: PMID:27156762
    reference_title: Genetic forms of neurohypophyseal diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurohypophyseal diabetes insipidus is characterized by polyuria and polydipsia owing to partial or complete deficiency of the antidiuretic hormone, arginine vasopressin (AVP)."
    explanation: States that the renal water-handling failure and its clinical expression
      follow from vasopressin deficiency, which is the step this node carries.
  downstream:
  - target: Polyuria
    causal_link_type: DIRECT
    description: >-
      Water that is not reabsorbed in the collecting duct is excreted, so the
      urine volume is large and its osmolality low.
    evidence:
    - reference: PMID:29421628
      reference_title: '[Nephrogenic diabetes insipidus].'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This results in water reabsorption in the collecting duct of the nephron following an osmotic gradient."
      explanation: >-
        States the reabsorption step whose failure produces the polyuria. The
        quote gives the normal physiology, so it supports the edge by
        inference rather than by measuring it in this disease.
      directness: INDIRECT
  - target: Hyposthenuria
    causal_link_type: DIRECT
    description: >-
      The same failure of collecting-duct water permeability that raises the
      volume lowers the concentration, so the two renal phenotypes are one
      event measured two ways.
  - target: Nocturia
    causal_link_type: DIRECT
    description: >-
      Antidiuresis fails around the clock, so the obligate water loss continues
      overnight when drinking has stopped.
  - target: Polydipsia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Urinary water loss raises plasma osmolality, and intact osmoreceptor-driven
      thirst then produces the compensatory drinking.
  - target: Hypernatremic Dehydration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Only when thirst cannot be acted on - in an infant, or in anyone without
      free access to water - does the water loss become a sodium and volume
      emergency.
phenotypes:
- category: Renal
  name: Polyuria
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Excretion of large volumes of hypotonic urine, conventionally more than
    50 mL per kg body weight per 24 hours. It is the presenting complaint and the
    phenotype that defines the polyuria-polydipsia syndrome this disease belongs
    to. It appears postnatally rather than at birth, and worsens over childhood.
  phenotype_term:
    preferred_term: Polyuria
    term:
      id: HP:0000103
      label: Polyuria
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The polyuria-polydipsia syndrome is characterized by a high urinary output of more than 50 ml per kg body weight per 24 h, accompanied by polydipsia of more than 3 L a day"
    explanation: Gives the quantitative threshold used clinically to call the urine output
      polyuric, and pairs it with the polydipsia phenotype below.
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically present between 1 and 6 years of age with polyuria and polydipsia."
    explanation: Establishes polyuria as the typical presenting phenotype and gives the age
      window, which is the postnatal-onset claim this entry rests on.
- category: Renal
  name: Polydipsia
  frequency: OBLIGATE
  description: >-
    Compensatory drinking driven by intact osmoregulated thirst. It is what
    keeps most patients eunatraemic despite losing many litres a day, and it is
    also why the disease is survivable at all before diagnosis. Loss of free
    access to water converts a manageable disorder into a dangerous one within
    hours.
  phenotype_term:
    preferred_term: Polydipsia
    term:
      id: HP:0001959
      label: Polydipsia
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most patients, osmoregulated thirst perception is intact and adequate fluid intake compensates for urinary water loss"
    explanation: Establishes that the polydipsia is intact-thirst compensation rather than a
      primary drinking disorder, which is the distinction the differential turns on.
  - reference: PMID:33433888
    reference_title: 'Familial neurohypophyseal diabetes insipidus: clinical, genetic and functional
      studies of novel mutations in the arginine vasopressin gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showed progressive symptoms of polyuria and polydipsia, but with wide variability in severity and age at onset."
    explanation: Documents the paired phenotype across five kindreds and records the
      variability in onset and severity that complicates family screening.
- category: Renal
  name: Hyposthenuria
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Persistently dilute urine. Urine osmolality stays far below plasma even when
    plasma osmolality is high, which is the finding that separates this disease
    from an osmotic diuresis and is the measurement the water deprivation test
    is built around.
  phenotype_term:
    preferred_term: Hyposthenuria
    term:
      id: HP:0003158
      label: Hyposthenuria
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients developed hypernatremia (154-163 mmol/l) and serum hyperosmolality (>320 mOsm/kg), while urine osmolality remained between 73 and 229 mOsm/kg."
    explanation: >-
      The defining dissociation, with numbers: serum hyperosmolality above
      320 mOsm/kg alongside urine osmolality as low as 73 mOsm/kg.
- category: Metabolic
  name: Hypernatremic Dehydration
  frequency: OCCASIONAL
  description: >-
    Hypernatraemia with serum hyperosmolality, seen when water intake cannot
    match the loss. It is the presentation of the recessive infantile form, and
    in the dominant form it is the complication of illness, fasting,
    hospitalisation or any other interruption of drinking rather than a routine
    feature.
  phenotype_term:
    preferred_term: Hypernatremic dehydration
    term:
      id: HP:0004906
      label: Hypernatremic dehydration
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients developed hypernatremia (154-163 mmol/l) and serum hyperosmolality (>320 mOsm/kg)"
    explanation: Documents the hypernatraemic presentation with measured sodium and osmolality
      in infants who could not drink to compensate.
- category: Constitutional
  name: Failure to Thrive in Infancy
  frequency: OCCASIONAL
  description: >-
    In infants, who cannot ask for water, the disease presents not as thirst but
    as poor growth with vomiting, irritability and unexplained fever - a
    presentation easily attributed to feeding difficulty or infection. This is
    the recorded presentation of the recessive P26L kindred and is the reason
    the recessive form is diagnosed so much earlier than the dominant one.
  phenotype_term:
    preferred_term: Failure to thrive in infancy
    term:
      id: HP:0001531
      label: Failure to thrive in infancy
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three Palestinian cousins presented with failure to thrive, vomiting, irritability, and fever."
    explanation: Records the infantile presentation directly, including the non-specific
      symptoms that accompany it.
- category: Constitutional
  name: Vomiting
  frequency: OCCASIONAL
  description: >-
    Reported as part of the infantile presentation, alongside failure to thrive
    and irritability. It is not a feature of the disease in older children and
    adults, where thirst dominates the picture.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three Palestinian cousins presented with failure to thrive, vomiting, irritability, and fever."
    explanation: Names vomiting as one of the presenting features in affected infants.
- category: Renal
  name: Nocturia
  frequency: FREQUENT
  description: >-
    Night-time urination, which is usually the first symptom desmopressin is
    prescribed to control and therefore the practical endpoint of initial
    dosing. Its prominence follows from the fact that antidiuresis fails around
    the clock while drinking is voluntary and daytime.
  phenotype_term:
    preferred_term: Nocturia
    term:
      id: HP:0000017
      label: Nocturia
    temporality: NOCTURNAL
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial treatment aim is to reduce nocturia, and therefore, the first desmopressin dose is usually given at bedtime, and if needed, a daytime dose is added."
    explanation: >-
      Establishes nocturia as a recognised and clinically targeted manifestation.
      The quote supports it through the treatment aim rather than by naming a
      frequency, hence directness INDIRECT.
    directness: INDIRECT
biochemical:
- name: Plasma arginine vasopressin
  presence: Decreased
  context: >-
    The direct measure of the deficiency in the dominant form. It falls
    progressively over childhood in parallel with urinary AVP. Note the sign
    reverses in the recessive P26L subtype, where immunoreactive hormone is
    high because a poorly active peptide is still being secreted - so a normal
    or elevated result does not exclude hereditary disease until the subtype is
    known. In practice AVP itself is rarely measured now; copeptin has replaced
    it because AVP is unstable and largely platelet-bound.
  biomarker_term:
    preferred_term: arginine vasopressin
    term:
      id: NCIT:C2285
      label: Arginine-Vasopressin
  readouts:
  - target: Progressive Arginine Vasopressin Deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Directly reports the circulating hormone concentration that this node
      is about.
    evidence:
    - reference: PMID:10443701
      reference_title: 'Clinical and molecular evidence of abnormal processing and trafficking of the
        vasopressin preprohormone in a large kindred with familial neurohypophyseal diabetes insipidus
        due to a signal peptide mutation.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical studies showed a severe progressive deficiency of plasma and urinary AVP that manifested during childhood."
      explanation: Reports the analyte, its direction and its progressive course in an
        affected kindred.
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma AVP levels were low, and the posterior pituitary bright spot was absent on magnetic resonance imaging (MRI)."
    explanation: Documents low plasma AVP measured in affected patients, together with the
      imaging correlate.
- name: Plasma copeptin
  presence: Decreased
  context: >-
    Copeptin is the C-terminal glycopeptide of the same prepro-vasopressin
    precursor, released in equimolar amounts with the hormone but far more
    stable, and it has displaced AVP as the assay of record. A stimulated
    copeptin that stays low is the diagnostic finding; a high unstimulated
    copeptin instead points to vasopressin resistance. Copeptin is also one of
    the two domains of the precursor that confers aggregation capacity, so in
    this disease the marker and the toxic species are parts of one molecule.
  biomarker_term:
    preferred_term: copeptin (C-terminal pro-vasopressin)
    term:
      id: NCIT:C26089
      label: Vasopressin-Neurophysin 2-Copeptin
  readouts:
  - target: Progressive Arginine Vasopressin Deficiency
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: A surrogate for vasopressin secretion, measured after osmotic stimulation
      so that a low value means failure to secrete rather than absence of a stimulus.
    evidence:
    - reference: PMID:30067922
      reference_title: A Copeptin-Based Approach in the Diagnosis of Diabetes Insipidus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the latter test, plasma copeptin was measured when the plasma sodium level had increased to at least 150 mmol per liter after infusion of hypertonic saline."
      explanation: Specifies how the readout is obtained - the osmotic stimulus that makes a
        low copeptin interpretable.
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the pre-defined copeptin cut-off of ≤ 4.9 mmol/L, patients with AVP-D were reliably distinguished from patients with primary polydipsia with a diagnostic accuracy of 97%."
    explanation: >-
      Gives the operating threshold and its accuracy. Note the review prints the
      unit as mmol/L where the primary trial reports pmol per litre; the snippet
      quotes the cached source exactly and the correct unit is picked up from
      PMID:30067922 in the diagnosis section.
  - reference: PMID:31785344
    reference_title: Role of protein aggregation and degradation in autosomal dominant neurohypophyseal
      diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aggregation capacity is independently conferred by two domains of the prohormone, namely the AVP moiety and the C-terminal glycopeptide (copeptin)."
    explanation: Records that copeptin is one of the aggregation-competent domains, which is
      why this marker is mechanistically as well as diagnostically interesting here.
- name: Urine osmolality
  presence: Decreased
  context: >-
    Inappropriately low urine osmolality in the face of a rising plasma
    osmolality is the physiological signature of the disease. Values below
    300 mOsm/kg after water deprivation, rising by more than 50 per cent on
    desmopressin, define complete arginine vasopressin deficiency; partial
    deficiency lands in an intermediate band that the water deprivation test
    handles poorly.
  biomarker_term:
    preferred_term: urine osmolality
    term:
      id: NCIT:C89824
      label: Osmolality
  readouts:
  - target: Impaired Renal Free Water Reabsorption
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reports the collecting duct's failure to concentrate, which is the renal
      node itself rather than the hormone deficit upstream of it.
    evidence:
    - reference: PMID:38087160
      reference_title: New insights on diagnosis and treatment of AVP deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients were urinary osmolality stays below 300 mosm/kg but increases over 50% upon desmopressin administration are diagnosed as having complete AVP-D."
      explanation: >-
        Gives the diagnostic thresholds for this readout. The sentence is
        garbled in the source ("Patients were urinary osmolality stays") and is
        quoted verbatim as required.
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while urine osmolality remained between 73 and 229 mOsm/kg"
    explanation: Measured values in affected patients, showing how far below plasma the urine
      osmolality sits.
- name: Serum sodium
  presence: Increased
  context: >-
    Normal in a compensated patient with free access to water, so a normal
    sodium never excludes the diagnosis. It rises when compensation fails, and
    it is also the parameter that has to be watched in the opposite direction
    once desmopressin is started, because dilutional hyponatraemia is the main
    treatment complication.
  biomarker_term:
    preferred_term: sodium
    term:
      id: NCIT:C830
      label: Sodium
  readouts:
  - target: Hypernatremic Dehydration
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Reports the decompensated state, and is monitored bidirectionally once
      desmopressin is in use.
    evidence:
    - reference: PMID:19897608
      reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
        infancy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients developed hypernatremia (154-163 mmol/l) and serum hyperosmolality (>320 mOsm/kg)"
      explanation: Gives the measured sodium range in decompensated affected patients.
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first days of treatment should be followed by monitoring of plasma sodium to avoid hyponatremia. Once a stable dose of desmopressin is established, annual monitoring of plasma sodium and kidney function should be performed."
    explanation: Establishes plasma sodium as the monitored analyte on treatment, which is
      the other half of why it is recorded here.
genetic:
- name: AVP
  gene_term:
    preferred_term: AVP
    term:
      id: hgnc:894
      label: AVP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Heterozygous mutation of the signal peptide or neurophysin II moiety,

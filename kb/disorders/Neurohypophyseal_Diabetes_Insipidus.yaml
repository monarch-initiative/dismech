    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical studies showed a severe progressive deficiency of plasma and urinary AVP that manifested during childhood."
    explanation: The human counterpart of the same claim, measured as hormone output in an
      affected kindred rather than as transcript in a mouse.
  downstream:
  - target: Progressive Arginine Vasopressin Deficiency
    causal_link_type: DIRECT
    description: >-
      Neurons that cannot transcribe, process or release the hormone deliver
      less of it to the circulation, and do so increasingly over time.
    evidence:
    - reference: PMID:24121282
      reference_title: 'Endoplasmic reticulum stress in vasopressin neurons of familial diabetes insipidus
        model mice: aggregate formation and mRNA poly(A) tail shortening.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite polyuria, which could potentially induce dehydration, AVP mRNA expression was decreased in the supraoptic nucleus, and the AVP mRNA poly(A) tail length was shortened in FNDI mice compared with wild-type mice."
      explanation: >-
        Demonstrates the failure of hormone supply against the strongest
        possible physiological stimulus to increase it - the animals are
        polyuric and dehydrating, and expression still falls.

- name: Magnocellular Vasopressin Neuron Loss
  description: >-
    The end state of the proteotoxic cascade. Vasopressinergic magnocellular
    neurons of the supraoptic and paraventricular nuclei degenerate, which is
    what post-mortem examination of affected adults shows and what makes this
    disease, in Rutishauser's phrase, a neurodegeneration confined to one
    neuronal population. Loss is not all-or-nothing and is accelerated by
    osmotic demand: in the knock-in mouse, sustained water deprivation - which
    forces the mutant neurons to work - destroys 30 to 40 per cent of them
    within twelve weeks. Oxytocin magnocellular neurons in the same nuclei are
    spared, because they do not make the mutant cargo.
  biological_scale: CELLULAR
  role: consequence
  mechanism_confidence: ESTABLISHED
  conforms_to: "loss_of_proteostasis#Proteotoxic Cell Dysfunction and Neurodegeneration"
  cell_types:

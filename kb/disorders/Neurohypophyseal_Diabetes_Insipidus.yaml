    - reference: PMID:27156762
      reference_title: Genetic forms of neurohypophyseal diabetes insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In most affected families, the disease is transmitted in an autosomal dominant manner, whereas autosomal recessive forms are much less frequent."
      explanation: Assigns dominant transmission to the majority of affected families, which
        is what makes this the default subtype.
  evidence:
  - reference: PMID:31785344
    reference_title: Role of protein aggregation and degradation in autosomal dominant neurohypophyseal
      diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease, manifesting in infancy or early childhood and gradually progressing in severity, is caused by fully penetrant heterozygous mutations in the gene encoding prepro-vasopressin-neurophysin II, the precursor of the antidiuretic hormone arginine vasopressin (AVP)."
    explanation: >-
      Establishes the dominant subtype as fully penetrant, heterozygous, of
      postnatal onset and progressive - the four features that separate it from
      the recessive subtype below.
- name: AR P26L
  display_name: Autosomal recessive familial neurohypophyseal diabetes insipidus (AVP p.Pro26Leu)
  description: >-
    A rare recessive form, reported in consanguineous Palestinian kindreds
    homozygous for AVP c.301C>T, replacing Pro26 of the precursor - Pro7 of the
    mature nonapeptide - with leucine. Heterozygous parents are unaffected. The
    mechanism is entirely different from the dominant form: the prohormone
    traffics through the secretory pathway normally and reaches the circulation,
    but the hormone it delivers binds the V2 receptor roughly thirtyfold less
    well, so circulating immunoreactive vasopressin is high while antidiuretic
    activity is low. This is a hormone-activity defect, not an ER storage
    disease, and there is no reason to expect vasopressinergic neurodegeneration
    in it.
  genes:
  - preferred_term: AVP
    term:
      id: hgnc:894
      label: AVP
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:10369876
      reference_title: Autosomal recessive familial neurohypophyseal diabetes insipidus with continued
        secretion of mutant weakly active vasopressin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We studied an unusual Palestinian family consisting of asymptomatic first cousin parents and three children affected with neurohypophyseal diabetes insipidus, suggesting autosomal recessive inheritance."
      explanation: The pedigree that establishes recessive transmission for this subtype, with
        unaffected heterozygous parents.
  evidence:
  - reference: PMID:10369876
    reference_title: Autosomal recessive familial neurohypophyseal diabetes insipidus with continued
      secretion of mutant weakly active vasopressin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three affected children were homozygous and the parents heterozygous for a single novel mutation (C301->T) in exon 1, replacing Pro7 of mature AVP with Leu (Leu-AVP)."
    explanation: >-
      Establishes the recessive segregation and the causal allele, numbered here
      by residue of the mature hormone rather than of the precursor.
  - reference: PMID:10369876
    reference_title: Autosomal recessive familial neurohypophyseal diabetes insipidus with continued
      secretion of mutant weakly active vasopressin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Leu-AVP was a weak agonist with approximately 30-fold reduced binding to the human V2 receptor."
    explanation: >-
      Quantifies the receptor-binding defect that makes this a hormone-activity
      subtype rather than a hormone-deficiency subtype.
  - reference: PMID:27156762
    reference_title: Genetic forms of neurohypophyseal diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recessive transmission results from AVP with reduced biologic activity or the deletion of the locus."
    explanation: >-
      Confirms that recessive inheritance in this disease has a distinct
      mechanistic basis, and records the second recessive route - locus deletion
      - which is not covered by the p.Pro26Leu allele.

notes: >-
  Scope. This entry is the hereditary neurohypophyseal entity, MONDO:0007450,
  and nothing else. Central diabetes insipidus is overwhelmingly acquired -
  surgical, traumatic, infiltrative, autoimmune, neoplastic - and nephrogenic
  diabetes insipidus is a different disease of the kidney, caused by AVPR2 or
  AQP2 defects. Neither is curated here. PMID:29421628 is a nephrogenic
  diabetes insipidus review and is cited only for the normal
  vasopressin-to-aquaporin-2 physiology of the collecting duct, with
  directness INDIRECT on both of its evidence items to record that. This is the
  first diabetes insipidus entry of any kind in the knowledge base, so the scope
  boundary is stated explicitly rather than left to be inferred from sibling
  entries.

  Naming. The field has largely renamed this condition arginine vasopressin
  deficiency (AVP-D), on patient-safety grounds: confusion with diabetes
  mellitus has caused deaths. The MONDO label is retained as disease_term
  because that is the schema contract, with AVP-D recorded as a synonym, and
  recent sources cited here use the new name throughout.

  The mechanism model, and why it has two arms. The entry deliberately splits
  the consequence of ER aggregation into "Vasopressin Neuron Secretory
  Dysfunction" and "Magnocellular Vasopressin Neuron Loss" rather than modelling
  a single neurodegeneration node, because the two are separable in time and the
  literature is explicit about it. PMID:19297548 counted AVP-mRNA-expressing
  cells in the knock-in mouse and found polyuria advancing substantially with no
  neuronal loss, concluding that cell death is not the primary cause of the
  polyuria. PMID:31785344 makes the same point for the transgenic models.
  Collapsing the two would assert, wrongly, that the polyuria is a consequence
  of cell death. Both arms converge on Progressive Arginine Vasopressin
  Deficiency, which is where the disease becomes systemic. The secretory-failure
  arm is reached by two routes that are modelled as separate edges: direct
  interference with the regulated secretory pathway by the retained aggregate,
  and an ER-stress-driven shortening of the AVP mRNA poly(A) tail that lowers
  transcript expression (PMID:24121282) - a throttling of supply that the cell
  performs on itself to reduce its unfolded-protein load.

  Gain of function, and which slot carries it. The variant consequence is
  recorded on the pathophysiology node's genetic_context as
  functional_impact_category: DOMINANT_NEGATIVE, not as
  modifier: GAIN_OF_FUNCTION on a process descriptor. Both terms are defensible
  descriptions of a toxic dominant allele, and the schema's decision table
  settles which slot they belong in: functional_impact_category is for the
  consequence of a variant, and this is a variant consequence. DOMINANT_NEGATIVE
  was chosen over NEOMORPHIC because it is what the primary literature
  demonstrates - PMID:10085151 showed mutant precursors heterodimerise with
  wild-type and block its ER-to-Golgi transit, and PMID:31785344 records
  wild-type precursor trapped inside the fibrillar aggregates. The toxic-gain
  framing, which is the broader and equally true statement, is carried in the
  node descriptions rather than forced into a single-valued enum.

  Module conformance. Two nodes conform to loss_of_proteostasis. The
  ER-aggregation node maps to "Misfolded-Protein Aggregation" and the
  neuron-loss node to "Proteotoxic Cell Dysfunction and Neurodegeneration". That
  module is tagged AGING, and this is a paediatric Mendelian disease, but
  conformance is per-node and the module's own description invites disorder
  entries to substitute their disease-specific aggregating protein; nine other
  Mendelian entries already conform to it. The module's upstream node,
  "Proteostasis Network Decline", is deliberately not conformed to, because
  nothing here suggests a general age-related decline of the proteostasis
  network - the network is normal and the client protein is not. The
  amyloidogenesis module was considered and rejected: it scopes itself to
  extracellular deposits, and these aggregates are inside the ER lumen.
  er_protein_storage_disease was also considered and rejected: it is explicitly
  a hepatocellular module ending in stellate-cell fibrosis, and although the
  first two steps of its chain are the same idea, conforming a hypothalamic
  neuron to a node named "Hepatic Protein Aggregation" would be wrong.

  The recessive subtype is modelled as a contrast, not as a milder variant. AR
  P26L has its own pathophysiology node, "Secreted Weakly Active Vasopressin",
  which enters the graph at the renal step and bypasses every ER node. This is
  the honest reading of PMID:15356057, which ran the dominant Y21H and the
  recessive P26L prohormones side by side in one experiment and found the first
  in the endoplasmic reticulum and the second in secretory granules; and of
  PMID:10369876, which measured serum Leu-AVP thirty times above normal in
  affected children. The clinical corollary is recorded in progression: the
  recessive form presents neonatally, and PMID:19897608 reads that timing as an
  argument against gradual neuronal destruction in that form.

  Negative and qualified models are recorded on purpose. The knock-in mouse only
  PARTIALLY recapitulates neuron loss, because without an osmotic challenge its
  polyuria progresses with no cell loss at all, and the Brattleboro rat carries
  a FAILS_TO_RECAPITULATE link against the neuron-loss node, because it is a
  recessive frameshift with preserved magnocellular neurons and no
  neurotoxicity. The Brattleboro rat is the workhorse of vasopressin physiology
  and it would be easy to list it here as the animal model of this disease; it
  is not one, and its own authors say results from it are only partially
  applicable. The Sel1L-Hrd1 ERAD-deficient mouse is included for the opposite
  reason: it carries no AVP mutation at all, and the fact that it still
  develops the disease is the cleanest evidence that ERAD capacity is what the
  mechanism turns on.

  Deep research. Two providers ran. Asta returned in five seconds
  (research/Neurohypophyseal_Diabetes_Insipidus-deep-research-asta.md; 37/37
  references resolved, none unresolved, no ontology CURIEs proposed) but its
  retrieval was poor for this disease - of twenty papers returned, most were
  about diabetes mellitus and its complications, and only three were about the
  right disease. Falcon returned after twelve minutes
  (research/Neurohypophyseal_Diabetes_Insipidus-deep-research-falcon.md; 18/20
  references resolved, 2 unverifiable, 1 flagged possibly off topic, and
  needs_review true because it labelled MONDO:0007450 "if available", which is
  template boilerplate echoed back rather than a term error). Falcon's report is
  scoped more broadly than this entry - it covers acquired central diabetes
  insipidus as well - and it cites by author-year key with no PMIDs, so nothing
  was quoted from it directly. Its ordered causal chain independently matches
  the model built here, including the caution that neuronal death is not
  required for early disease, and it supplied three leads that were then located
  in PubMed and cited: the Sel1L-Hrd1 ERAD mouse (PMID:28920920), the
  poly(A)-tail-shortening mechanism (PMID:24121282), and the Brattleboro rat as
  a model to be careful with (PMID:9756087). Everything else came from a
  systematic PubMed sweep. Falcon's prevalence figure of 1 in 25,000 was not
  used: it is keyed to unresolvable author-year citations, and it is a figure
  for arginine vasopressin deficiency overall, which is overwhelmingly acquired,
  not for the hereditary entity this entry covers.

  No GeneReviews chapter exists. PubMed was searched three ways - the disease
  name with GeneReviews, the GeneReviews[Book] publication type crossed with
  vasopressin, neurohypophyseal and central diabetes insipidus, and AVP in the
  title with GeneReviews - and the only diabetes insipidus chapter in
  GeneReviews is Hereditary Nephrogenic Diabetes Insipidus (PMID:20301356),
  which is a different disease and is not cited here. WFS1 Spectrum Disorder
  (PMID:20301750) also surfaced and is likewise a different entity, although
  Wolfram syndrome is the differential worth remembering in a child with central
  diabetes insipidus. The mandatory GeneReviews phenotype baseline could
  therefore not be applied; the phenotype set is drawn from the primary clinical
  literature instead.

  Quoting notes. Four cached sources contain errors that are reproduced verbatim
  in snippets, as the evidence rules require, and each is flagged in its own
  explanation: PMID:10443701 prints the allele as "Ala(- 1)Thr" with a stray
  space; PMID:38087160 gives the copeptin cut-off unit as mmol/L where the
  primary trial (PMID:30067922) reports pmol per litre, and also contains a
  garbled sentence beginning "Patients were urinary osmolality stays"; and
  PMID:28920920 prints the gene as "Se1L" for Sel1L. None of these were
  corrected in the quotes.

  Two phenotypes are deliberately left unconnected in the causal graph. Failure
  to Thrive in Infancy and Vomiting are reported by PMID:19897608 as the
  presenting features of the recessive infants, with hypernatraemia and
  hyperosmolality recorded as something the patients subsequently "developed".
  Wiring them as sequelae of Hypernatremic Dehydration would therefore invert
  the order the source reports, and no source was found that establishes the
  direction, so they are left as unconnected phenotype nodes. Two renal edges
  that are physiologically certain - impaired free water reabsorption to
  hyposthenuria and to nocturia - are drawn but carry no separate edge
  citation, since the only quotes available support the nodes rather than the
  step between them.

  Known extension points. Clinical trials, for which no trial specific to the
  hereditary form was identified. Datasets, none found for this disease.
  Computational models. A comorbidity or grouping link to the other ER storage
  diseases, which would be a better home for the cross-disease comparison than
  this entry's notes. Oxytocin deficiency, which recent work raises as a
  possible contributor to the psychological morbidity reported in this
  population, and which would need its own evidence rather than the general
  statements available now. And 4-phenylbutyrate, which is recorded here only as
  a rescue arm on the mouse model - if it ever reaches a human trial it becomes
  a treatment entry with a disease-modifying target_mechanisms link to the
  aggregation node rather than the bypass link desmopressin has.

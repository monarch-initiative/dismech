- name: AD FNDI
  display_name: Autosomal dominant familial neurohypophyseal diabetes insipidus
  description: >-
    The usual form, accounting for the great majority of families. A single
    heterozygous AVP allele encoding a folding-incompetent precursor is
    sufficient to cause disease, through retention and aggregation of the
    precursor in the endoplasmic reticulum of vasopressinergic neurons rather
    than through loss of hormone dosage. Onset is postnatal and the deficiency
    deepens with age.
  genes:

      in a mouse model of familial neurohypophysial diabetes insipidus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Three-dimensional analysis revealed that phagophores enveloped aggregates located within the dilated ER. Serial imaging further demonstrated a physical connection between these phagophores and intact ER membranes."
    explanation: >-
      Three-dimensional electron microscopy of the affected neuron showing the
      autophagic machinery engaging the aggregate-containing ER directly, and
      forming from ER membrane rather than arriving from elsewhere.
  - reference: PMID:12153465
    reference_title: Autophagy in hypothalamic neurones of rats expressing a familial neurohypophysial
      diabetes insipidus transgene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Swollen vesicles containing Cys67stop are immunoreactive for cathepsin D (a lysosomal protease), endolyn (a marker of late endosomes) and lysosomal associated membrane protein 1, suggesting that they may be degradative autolysosomes."
    explanation: Identifies the vesicles that accumulate around the mutant protein as
      degradative autolysosomes, which is the autophagic arm of this node.
  downstream:
  - target: Magnocellular Vasopressin Neuron Loss
    causal_link_type: DIRECT
    description: >-
      Unrelenting autophagy consumes the neuron's organelles and ends in cell
      death rather than in clearance.
    evidence:
    - reference: PMID:29961215
      reference_title: A novel mechanism of autophagy-associated cell death of vasopressin neurons in
        familial neurohypophysial diabetes insipidus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data demonstrated that although autophagy should primarily be a protective mechanism, continuous autophagy leads to gradual loss of organelles including ER, resulting in autophagy-associated cell death of AVP neurons in FNDI mice."
      explanation: >-
        States the edge and names the death mode, and is careful about the
        direction: autophagy is protective first and lethal only when it
        persists.
  - target: Vasopressin Neuron Secretory Dysfunction
    causal_link_type: DIRECT
    description: >-
      A second, transcript-level route from the same stress. ER stress shortens
      the poly(A) tail of AVP mRNA and lowers its expression, which throttles
      the supply of new precursor. The cell is reducing the unfolded-protein
      load it has to handle, and the price is hormone output.
    evidence:
    - reference: PMID:24121282
      reference_title: 'Endoplasmic reticulum stress in vasopressin neurons of familial diabetes insipidus
        model mice: aggregate formation and mRNA poly(A) tail shortening.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Incubation of hypothalamic explants of wild-type mice with ER stressors caused shortening of the poly(A) tail length of AVP mRNA, accompanied by decreases in the expression."
      explanation: >-
        Establishes the direction of this edge experimentally rather than by
        correlation: applying ER stress to wild-type tissue reproduces the
        transcript change seen in the mutant animals.

- name: Vasopressin Neuron Secretory Dysfunction
  description: >-
    Before any neuron dies, the surviving neurons stop working. AVP mRNA in the
    supraoptic nucleus falls, mature hormone output collapses, and the regulated
    secretory pathway is starved of cargo because the precursor never reaches
    the trans-Golgi network. This node is the reason the disease is progressive
    from an early age and yet compatible with a normal neuron count for a long
    time, and it is separated from the neuron-loss node deliberately: the mouse
    data show polyuria advancing substantially while the AVP-expressing cell
    count is still intact.
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: vasopressin-secreting magnocellular cell
    term:
      id: CL:4023109
      label: vasopressin-secreting magnocellular cell

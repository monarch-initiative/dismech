      snippet: "These data support the proposal that Cys67stop mutant protein aggregates within the ER, which is targeted for lysosomal degradation by autophagy."
      explanation: >-
        States the causal step this edge asserts, in vivo, in the vasopressin
        magnocellular neurons of a transgenic rat.

- name: Endoplasmic Reticulum Stress and Autophagy Induction
  description: >-
    The aggregate burden imposes sustained stress on the ER of the vasopressin
    neuron and drives autophagy. Phagophores form around the aggregate-laden ER
    and engulf it. This is initially a protective response: it is the cell's
    attempt to clear what ERAD could not. It becomes destructive because it does
    not stop - continuous autophagy strips the neuron of organelles, including
    the ER itself.
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  cell_types:

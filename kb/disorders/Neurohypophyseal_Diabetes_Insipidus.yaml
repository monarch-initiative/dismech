pathophysiology:
- name: Mutant Prepro-Vasopressin Misfolding
  description: >-
    The initiating lesion. A heterozygous point mutation in AVP - typically in
    the signal peptide or at a residue of the neurophysin II moiety that the
    precursor needs in order to fold and dimerise - yields a prepro-vasopressin
    that is folding incompetent. Signal-peptide alleles such as Ala(-1)Thr
    additionally prevent cleavage of the signal sequence, so an uncleaved
    23-kDa precursor accumulates. The lesion is in the precursor's ability to
    fold, not in the hormone it eventually encodes, which is why the mature
    nonapeptide is normal in these families and why a hormone-replacement drug
    works while the neuronal disease continues.
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: AVP
    term:
      id: hgnc:894
      label: AVP
  biological_processes:
  - preferred_term: protein folding in endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
    modifier: ABNORMAL
  genetic_context:
    genes:
    - preferred_term: AVP
      term:
        id: hgnc:894
        label: AVP
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      The consequence of the variant is not loss of the encoded hormone's
      activity. The mutant precursor acquires a toxic aggregation property and,
      because it still dimerises with the product of the normal allele, drags
      wild-type precursor into the same ER-retained aggregate. That is a
      dominant-negative consequence layered on a toxic gain, and it is why the
      single normal allele does not rescue the phenotype. Contrast the recessive
      p.Pro26Leu allele, where the consequence really is reduced activity of the
      secreted hormone and heterozygotes are well.
  evidence:
  - reference: PMID:31785344
    reference_title: Role of protein aggregation and degradation in autosomal dominant neurohypophyseal
      diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Studies in cells expressing pathogenic mutants and knock-in rodent models have shown that the mutant precursors are folding incompetent and fail to exit the endoplasmic reticulum (ER), as occurs normally with proteins that have entered the regulated secretory pathway."
    explanation: States the folding-incompetence of the mutant precursor, which is the
      lesion this node models.
  - reference: PMID:10369876
    reference_title: Autosomal recessive familial neurohypophyseal diabetes insipidus with continued
      secretion of mutant weakly active vasopressin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All published mutations affect the signal peptide or the neurophysin-II carrier protein and are presumed to interfere with processing of the preprohormone, leading to neuronal damage."
    explanation: Gives the position of the dominant alleles within the precursor, which is
      the structural regularity this node depends on.
  - reference: PMID:10443701
    reference_title: 'Clinical and molecular evidence of abnormal processing and trafficking of the
      vasopressin preprohormone in a large kindred with familial neurohypophyseal diabetes insipidus
      due to a signal peptide mutation.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ala(- 1)Thr mutant cells produced 8-fold less AVP than wild-type cells and accumulated excessive amounts of 23-kDa NPII protein corresponding to uncleaved prepro-AVP-NPII."
    explanation: >-
      Shows the specific signal-peptide failure - the signal sequence is not
      cleaved, so uncleaved precursor accumulates and mature hormone output
      falls eightfold. Note the cached abstract prints the allele with a stray
      space as "Ala(- 1)Thr"; the snippet reproduces the source exactly.
  - reference: PMID:15356057
    reference_title: 'Differential cellular handling of defective arginine vasopressin (AVP) prohormones
      in cells expressing mutations of the AVP gene associated with autosomal dominant and recessive
      familial neurohypophyseal diabetes insipidus.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results provide an important negative control in support of the hypothesis that autosomal dominant inheritance of FNDI is caused by mutations in the AVP gene that alter amino acid residues important for folding and/or dimerization of the neurophysin II moiety of the AVP prohormone and subsequent transport from the endoplasmic reticulum."
    explanation: >-
      States the folding-and-dimerisation hypothesis for the neurophysin II
      alleles, and does so from a study whose recessive comparator is the
      negative control that makes the argument.
  downstream:
  - target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
    causal_link_type: DIRECT
    description: >-
      A precursor that cannot fold cannot pass ER quality control, so it is
      retained rather than packaged into dense-core secretory granules.
    evidence:
    - reference: PMID:33433888
      reference_title: 'Familial neurohypophyseal diabetes insipidus: clinical, genetic and functional
        studies of novel mutations in the arginine vasopressin gene.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro transfection of neuronal cells with expression vectors containing each mutation showed that the mutations resulted in intracellular retention of the vasopressin prohormone."
      explanation: >-
        Directly links the mutations to intracellular retention of the
        prohormone, across five independent alleles spanning the signal peptide
        and neurophysin II, which is the step this edge asserts.

- name: Endoplasmic Reticulum Retention and Fibrillar Aggregation
  description: >-
    The retained precursor accumulates in the ER lumen of vasopressinergic
    magnocellular neurons. Some is retrotranslocated and destroyed by
    ER-associated degradation, but ERAD capacity is finite; the remainder
    self-associates into large disulfide-linked fibrillar aggregates. Crucially
    the aggregates are not pure mutant: wild-type precursor made from the normal
    allele is trapped in them, so one bad allele removes more than half the
    hormone-making capacity. In the knock-in mouse the aggregates are initially
    walled off in a sub-compartment of the ER and only later scatter through a
    dilated ER lumen, which is the ultrastructural correlate of the disease
    becoming progressive.
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  cell_types:
  - preferred_term: vasopressin-secreting magnocellular cell
    term:

    The mutational spectrum is the mechanistic argument. Alleles cluster in the
    signal peptide and in neurophysin II - the parts of the precursor needed for
    signal cleavage, folding and dimerisation - and spare the mature nonapeptide
    in the dominant form. Nonsense, missense and initiation-codon alleles all
    produce the same phenotype, which is what a folding-and-retention mechanism
    predicts and a simple loss-of-hormone mechanism does not. Genotype does not
    predict age at onset or severity even within one small cohort, so molecular
    testing confirms the diagnosis but does not stratify it. The one allele that
    breaks the pattern is p.Pro26Leu, which sits in the mature hormone, is
    recessive, and works by a different mechanism entirely.
  evidence:
  - reference: PMID:33433888
    reference_title: 'Familial neurohypophyseal diabetes insipidus: clinical, genetic and functional
      studies of novel mutations in the arginine vasopressin gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These consisted of one initiation codon mutation in the signal peptide coding region (c.2T > C, p.Met1?), three missense mutations in the neurophysin II (NPII) coding region (c.154T > C, p.Cys52Arg; c.289C > G, p.Arg97Gly; and c.293G > C, p.Cys98Ser), and one nonsense mutation in the NPII coding region (c.343G > T, p.Glu115Ter)."
    explanation: Illustrates the allelic spectrum and its confinement to the signal peptide
      and neurophysin II across one cohort of five families.
  - reference: PMID:33433888
    reference_title: 'Familial neurohypophyseal diabetes insipidus: clinical, genetic and functional
      studies of novel mutations in the arginine vasopressin gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showed progressive symptoms of polyuria and polydipsia, but with wide variability in severity and age at onset. No clear genotype-phenotype correlation was observed."
    explanation: The basis for the statement that genotype does not stratify the phenotype.
  - reference: PMID:31588537
    reference_title: Hereditary Neurohypophyseal Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary neurohypophyseal DI is caused by mutations in the gene encoding the antidiuretic hormone vasopressin (AVP) and its carrier protein neurophysin II (NPII)."
    explanation: Establishes AVP as the causative gene for the hereditary disease, covering
      both the hormone and the carrier-protein moieties of the same transcript.
inheritance:
- name: Autosomal dominant
  description: >-
    The usual mode. Fully penetrant heterozygous AVP mutations transmit through
    successive generations, and each child of an affected parent is at 50 per
    cent risk. Penetrance being complete does not mean expression is uniform:
    age at onset and severity vary widely between and within families, so an
    apparently mildly affected relative is still a carrier.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31785344
    reference_title: Role of protein aggregation and degradation in autosomal dominant neurohypophyseal
      diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease, manifesting in infancy or early childhood and gradually progressing in severity, is caused by fully penetrant heterozygous mutations in the gene encoding prepro-vasopressin-neurophysin II, the precursor of the antidiuretic hormone arginine vasopressin (AVP)."
    explanation: States full penetrance and heterozygosity, which together define the
      dominant mode here.
  - reference: PMID:31588537
    reference_title: Hereditary Neurohypophyseal Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most commonly, the disease is transmitted in an autosomal dominant fashion; very rarely, autosomal recessive inheritance has been observed."
    explanation: Gives the relative frequency of the two modes, which is why the dominant
      form is treated as the default in this entry.
- name: Autosomal recessive
  description: >-
    Rare, and reported in consanguineous families. Homozygosity for AVP
    p.Pro26Leu causes disease while heterozygous parents are entirely
    asymptomatic - the clean genetic demonstration that this allele does not
    have the dominant alleles' toxic property. Deletion of the AVP locus is the
    other recorded recessive route.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10369876
    reference_title: Autosomal recessive familial neurohypophyseal diabetes insipidus with continued
      secretion of mutant weakly active vasopressin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied an unusual Palestinian family consisting of asymptomatic first cousin parents and three children affected with neurohypophyseal diabetes insipidus, suggesting autosomal recessive inheritance."
    explanation: The pedigree evidence for recessive transmission, including the unaffected
      heterozygous parents.
  - reference: PMID:27156762
    reference_title: Genetic forms of neurohypophyseal diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In most affected families, the disease is transmitted in an autosomal dominant manner, whereas autosomal recessive forms are much less frequent."
    explanation: Places the recessive mode as much less frequent, which is how it is
      weighted in this entry.
progression:
- phase: Infancy
  notes: >-
    In the dominant form there is characteristically nothing at birth. This is
    the single most informative feature of the natural history and it is what
    rules out simple haploinsufficiency: a dosage problem would be present from
    the start, whereas a slowly accumulating aggregate needs time. In the
    recessive P26L form, by contrast, disease is manifest in the neonatal period
    with hypernatraemic dehydration - which the authors of that series read as
    direct evidence against the gradual-destruction mechanism operating there.
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first description of autosomal recessive FNDI presenting in the neonatal period. The unusual early clinical and radiological (MRI) presentation argues against gradual destruction of AVP-secreting neurons as the pathophysiological mechanism."
    explanation: >-
      Both halves of the claim in one sentence pair: the recessive form can
      present neonatally, and that timing is itself the argument that its
      mechanism is not progressive neuronal destruction.
- phase: Childhood
  notes: >-
    Polyuria and polydipsia appear, typically between one and six years of age,
    and deepen. Bedwetting and nocturia are often what brings the child to
    attention. The deficiency is frequently partial at this stage, so a water
    deprivation test can be equivocal in a child whose disease is unambiguous a
    few years later.
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients typically present between 1 and 6 years of age with polyuria and polydipsia."
    explanation: Gives the age window for the typical dominant presentation.
  - reference: PMID:10443701
    reference_title: 'Clinical and molecular evidence of abnormal processing and trafficking of the
      vasopressin preprohormone in a large kindred with familial neurohypophyseal diabetes insipidus
      due to a signal peptide mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autosomal dominant form of familial neurohypophyseal diabetes insipidus (adFNDI) is a rare disease characterized by postnatal onset of polyuria and a deficient neurosecretion of the antidiuretic hormone, arginine vasopressin (AVP)."
    explanation: States the postnatal - not congenital - onset that defines this phase.
- phase: Adulthood
  notes: >-
    The hormone deficit is by now severe and does not remit; desmopressin
    dependence is lifelong. Post-mortem series in affected adults show frank
    degeneration of the vasopressinergic hypothalamic nuclei, so what began as
    reversible cellular dysfunction has become structural loss. The clinical
    burden shifts from the polyuria itself, which desmopressin controls, to the
    hazards of treatment and of interrupted access to it: dilutional
    hyponatraemia on one side, hypernatraemic dehydration during illness,
    fasting or hospitalisation on the other.
  evidence:
  - reference: PMID:31785344
    reference_title: Role of protein aggregation and degradation in autosomal dominant neurohypophyseal
      diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post mortem studies in affected adults have shown cell degeneration in vasopressinergic hypothalamic nuclei."
    explanation: The structural endpoint that distinguishes this phase from the earlier
      functional one.
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, limited access to fluids or excessive fluid loss, for example, by non-availability or restricted intake, vomiting or diarrheal illnesses, unconsciousness, or acute concurrent illness, can lead to life-threatening dehydration"
    explanation: Names the circumstances that make this a dangerous condition in adult life
      despite effective replacement therapy.
diagnosis:
- name: Hypertonic saline-stimulated copeptin
  presence: PRESENT
  description: >-
    The current reference test. Plasma sodium is raised to at least 150 mmol/L
    with hypertonic saline and copeptin is measured at that point; a value at or
    below 4.9 pmol/L identifies vasopressin deficiency. It replaced the indirect
    water deprivation test on a head-to-head comparison in which it was
    substantially more accurate. It demands rapid bedside sodium measurement and
    close supervision, which is its practical cost.
  evidence:
  - reference: PMID:30067922
    reference_title: A Copeptin-Based Approach in the Diagnosis of Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, among the 141 patients included in the analysis, the indirect water-deprivation test determined the correct diagnosis in 108 patients (diagnostic accuracy, 76.6%; 95% confidence interval [CI], 68.9 to 83.2), and the hypertonic saline infusion test (with a copeptin cutoff level of >4.9 pmol per liter) determined the correct diagnosis in 136 patients (96.5%; 95% CI, 92.1 to 98.6; P<0.001)."
    explanation: The head-to-head accuracy comparison and the copeptin threshold, in the
      trial that established both.
- name: Indirect water deprivation test
  presence: PRESENT
  description: >-
    The historical gold standard, still widely performed. Urine concentrating
    ability is assessed over a fluid-restriction period and then challenged with
    desmopressin. Its weakness is precisely where this disease often sits early
    on - partial deficiency - and its published cutoffs were derived from a
    single small study that was never prospectively validated.
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In view of these limitations, it was not surprising that two prospective studies evaluating the diagnostic accuracy of the indirect water deprivation test found the diagnostic accuracy to be only 70–77%, with especially low accuracy in the difficult differentiation between partial AVP-D and PP patients"
    explanation: Quantifies the test's accuracy and locates its failure in the partial-deficiency
      differential that matters most in this disease.
- name: Absent posterior pituitary bright spot on T1 MRI
  presence: PRESENT
  description: >-
    The T1 hyperintensity of the normal posterior pituitary is attributed to
    vasopressin stored in neurosecretory granules, so its loss is the imaging
    correlate of the depleted and degenerating neurohypophyseal system and is
    the classic supporting observation in this disease. It is supporting rather
    than decisive: the bright spot is absent in only about 70 per cent of
    patients with vasopressin deficiency and in 39 per cent of patients with
    primary polydipsia, it disappears with age in healthy people, and it
    persists in some genuinely affected patients.
  evidence:
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma AVP levels were low, and the posterior pituitary bright spot was absent on magnetic resonance imaging (MRI)."
    explanation: Records the finding in molecularly confirmed hereditary disease, alongside
      the low hormone level it is taken to reflect.
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its absence was shown in 70% of patients with AVP-D but also 39% of patients with primary polydipsia"
    explanation: >-
      The numbers that make this a supporting rather than a pathognomonic sign,
      and the reason the entry does not model it as a phenotype.
- name: AVP molecular genetic testing
  presence: PRESENT
  description: >-
    Sequencing AVP confirms the diagnosis, distinguishes the dominant from the
    recessive form, and is what makes presymptomatic testing of at-risk
    relatives possible - which matters because in the dominant form the
    biochemical abnormality lags the genotype by years. It does not predict when
    the disease will start or how severe it will be.
  evidence:
  - reference: PMID:33433888
    reference_title: 'Familial neurohypophyseal diabetes insipidus: clinical, genetic and functional
      studies of novel mutations in the arginine vasopressin gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five Portuguese families with autosomal dominant FNDI underwent sequencing of the AVP gene and the identified mutations were functionally characterized by in vitro studies."
    explanation: >-
      Documents AVP sequencing as the diagnostic route in familial disease. The
      quote establishes the practice rather than asserting a diagnostic yield,
      hence directness INDIRECT.
    directness: INDIRECT
treatments:
- name: Desmopressin
  description: >-
    The standard of care and, in practice, the whole of treatment. Desmopressin
    is a synthetic vasopressin analogue differing by two amino acids, which
    lengthen its half-life and remove the vasopressor activity, leaving a
    selective V2 agonist. Oral, intranasal and parenteral formulations exist;
    oral is now preferred on tolerability and safety grounds. It replaces the
    missing hormone and does nothing whatever to the aggregating precursor
    upstream, so the neuronal disease continues underneath a controlled
    phenotype - which is why disease-modifying approaches are of interest even
    though symptom control is good. Dosing is individualised and starts at
    bedtime to control nocturia.
  action_category: THERAPEUTIC
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
  target_mechanisms:
  - target: Impaired Renal Free Water Reabsorption
    treatment_effect: BYPASSES
    description: >-
      Supplying an exogenous V2 agonist restores aquaporin-mediated water
      reabsorption at the collecting duct without restoring endogenous hormone
      production, so it bypasses every upstream node rather than correcting any
      of them.
    evidence:
    - reference: PMID:38087160
      reference_title: New insights on diagnosis and treatment of AVP deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Desmopressin differs from AVP by two amino acids and is available in parenteral, oral and nasal formulations, providing effective long-term control of polyuria."
      explanation: Identifies the agent as a hormone analogue acting at the renal receptor and
        records that it controls the renal phenotype long term.
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmopressin, a synthetic AVP analogue and selective V2 receptor agonist, is the current standard of care and is usually initiated after the diagnosis of AVP-D is confirmed"
    explanation: Establishes desmopressin as the standard of care and names its
      pharmacological class.
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmopressin treatment provides immediate symptomatic relief; however, the main complication is dilutional hyponatremia and its associated risk of cerebral edema, seizure, coma and even death"
    explanation: >-
      The principal hazard of the treatment. It is recorded on the treatment
      itself rather than as a phenotype because it is iatrogenic, not a feature
      of the disease.
  - reference: PMID:19897608
    reference_title: 'Autosomal recessive familial neurohypophyseal diabetes insipidus: onset in early
      infancy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients responded to desmopressin."
    explanation: >-
      Confirms responsiveness in the recessive subtype specifically, which is
      not obvious a priori: the endogenous hormone there is present but weak, so
      the drug works by supplying a full agonist rather than by filling a void.
  notes: >-
    Hyponatraemia is common enough on treatment - reported at up to 30 per cent
    in outpatients - that deliberate periodic omission of a dose to allow
    aquaresis, so-called desmopressin escape, is recommended, and patients need
    explicit education on the symptoms.
- name: Assured Access to Water and Fluid Management
  description: >-
    Not an afterthought. Because osmoregulated thirst is intact in almost all
    patients, free access to water is what actually maintains water balance, and
    the situations that remove it - fasting for surgery, vomiting or diarrhoeal
    illness, unconsciousness, an inpatient team unfamiliar with the condition -
    are the ones that kill. The management of dehydration when it occurs is
    replacement of roughly half the calculated free water deficit over the first
    24 hours with hypotonic fluid.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Hypernatremic Dehydration
    treatment_effect: INHIBITS
    description: >-
      Maintaining intake against an obligate renal water loss prevents the
      hypertonic decompensation, which is the only life-threatening event in the
      natural history of a treated patient.
    evidence:
    - reference: PMID:38087160
      reference_title: New insights on diagnosis and treatment of AVP deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therefore, hypernatremia, an indicator of inadequate fluid balance, rarely occurs in AVP-D patients with free access to fluids"
      explanation: States the protective effect directly - free access to fluids is what keeps
        hypernatraemia rare.
  evidence:
  - reference: PMID:38087160
    reference_title: New insights on diagnosis and treatment of AVP deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main treatment goals in patients with AVP-D are the correction of pre-existing water deficits and the reduction of excessive urinary water loss."
    explanation: States the two treatment goals, of which this intervention addresses the
      first and desmopressin the second.
animal_models:
- name: FNDI knock-in mouse (mutant neurophysin II)
  species: Mouse
  genotype: Heterozygous Avp knock-in encoding a mutant neurophysin II
  publication: PMID:19297548
  description: >-
    The workhorse model of this disease and the source of nearly everything
    known about the timing of the mechanism. Heterozygous mice develop
    progressive polyuria as patients do, and the model has been used to separate
    the two arms of the cascade in time: aggregates accumulate and AVP
    transcription falls first, and neuronal death follows only later and only
    under osmotic load. Because the phenotype can be accelerated by intermittent
    water deprivation, the model also permits the neuron-loss endpoint to be
    reached in weeks rather than in the animal's whole lifespan.
  genes:
  - preferred_term: AVP
    term:
      id: hgnc:894
      label: AVP
  evidence:
  - reference: PMID:19297548
    reference_title: Progressive polyuria without vasopressin neuron loss in a mouse model for familial
      neurohypophysial diabetes insipidus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we analyzed knockin mice expressing mutant NPII that causes FNDI in humans. The heterozygous mice manifested progressive polyuria as do patients with FNDI."
    explanation: Establishes the model, the human allele class it carries, and the cardinal
      phenotype it reproduces.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Aggregates form in the endoplasmic reticulum of supraoptic AVP neurons and
      grow in step with urine volume, so the model reproduces the retained
      aggregate in the correct cell type and in the correct temporal relation to
      the phenotype.
    limitations: >-
      The aggregates are not stained by antibodies to mutant neurophysin II,
      normal neurophysin II or AVP, so their exact composition in vivo is not
      established by the immunohistochemistry alone.
    readouts:
    - name: Inclusion body size in supraoptic nucleus AVP cells
      target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
      direction: INCREASED
      interpretation: Morphological measure of the accumulating aggregate, tracked against
        urine volume in the same animals.
      evidence:
      - reference: PMID:19297548
        reference_title: Progressive polyuria without vasopressin neuron loss in a mouse model for familial
          neurohypophysial diabetes insipidus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the size of inclusion bodies gradually increased in parallel with the increases in urine volume"
        explanation: Reports the measurement and its direction, and ties it quantitatively to
          the phenotype.
    evidence:
    - reference: PMID:19297548
      reference_title: Progressive polyuria without vasopressin neuron loss in a mouse model for familial
        neurohypophysial diabetes insipidus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At 12 mo, dilated ER filled with aggregates occupied the cytoplasm of AVP cells, while few aggregates were found in the nucleus."
      explanation: Ultrastructural confirmation that the aggregate is where the mechanism says
        it should be, in a dilated ER of the affected neuron.
  - target: Vasopressin Neuron Secretory Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      AVP mRNA in the supraoptic nucleus falls while the AVP-expressing cell
      count is unchanged, which is the direct in-vivo demonstration that
      secretory failure precedes cell loss.
    readouts:
    - name: AVP mRNA expression in supraoptic nucleus
      target: Vasopressin Neuron Secretory Dysfunction
      direction: DECREASED
      interpretation: In situ hybridisation measure of hormone-gene expression in the
        surviving neurons.
      evidence:
      - reference: PMID:19297548
        reference_title: Progressive polyuria without vasopressin neuron loss in a mouse model for familial
          neurohypophysial diabetes insipidus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analyses with in situ hybridization revealed that expression of AVP mRNA was significantly decreased in the SON in the heterozygous mice compared with that in wild-type mice."
        explanation: The measurement and its direction.
  - target: Magnocellular Vasopressin Neuron Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Neuronal loss does occur, but only when the mutant neurons are driven by
      sustained osmotic demand; 30 to 40 per cent of AVP neurons are lost after
      twelve weeks of water deprivation.
    limitations: >-
      In unstressed animals the polyuria progresses substantially with no
      neuronal loss at all, so the timing of loss in this model is set by an
      experimental manipulation and cannot be read straight across to the human
      natural history. What the model shows is that loss is possible and
      demand-dependent, not when it happens in a patient.
    readouts:
    - name: Surviving AVP neuron count after intermittent water deprivation
      target: Magnocellular Vasopressin Neuron Loss
      direction: DECREASED
      interpretation: Cell counts after a defined osmotic challenge, the endpoint that
        establishes the degenerative arm of the mechanism.
      evidence:
      - reference: PMID:29961215
        reference_title: A novel mechanism of autophagy-associated cell death of vasopressin neurons in
          familial neurohypophysial diabetes insipidus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "at which stage 30-40% of AVP neurons were lost"
        explanation: The quantitative loss measured at the twelve-week water-deprivation
          endpoint.
    evidence:
    - reference: PMID:19297548
      reference_title: Progressive polyuria without vasopressin neuron loss in a mouse model for familial
        neurohypophysial diabetes insipidus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Counting cells expressing AVP mRNA in the SON indicated that polyuria had progressed substantially in the absence of neuronal loss."
      explanation: >-
        The negative half of the same claim, and the reason this link is
        PARTIALLY_RECAPITULATES rather than RECAPITULATES: without an osmotic
        challenge the model's polyuria is not accompanied by cell loss.
  - target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The chemical chaperone 4-phenylbutyrate reduced mutant protein
      accumulation in the ER of these mice, increased AVP release, cut urine
      volume and attenuated neuron loss under salt loading. This is the
      pharmacological test of the mechanism: relieving the ER burden improves
      both the hormone deficit and the degeneration, which is what a
      proteotoxicity model predicts and a haploinsufficiency model does not.
    limitations: >-
      A preclinical result in mice with no human trial in this disease; the entry
      records no corresponding treatment. It also does not establish which of the
      several downstream consequences of ER burden the benefit runs through.
    readouts:
    - name: Urine volume on 4-phenylbutyrate
      target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
      direction: RESTORED
      interpretation: The organism-level output used to judge the rescue, alongside the
        molecular readout of reduced ER accumulation.
      evidence:
      - reference: PMID:29886132
        reference_title: Chemical chaperone 4-phenylbutylate reduces mutant protein accumulation in the
          endoplasmic reticulum of arginine vasopressin neurons in a mouse model for familial neurohypophysial
          diabetes insipidus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treatment with 4-PBA reduced mutant protein accumulation in the ER of FNDI mice and increased AVP release, leading to reduced urine volumes."
        explanation: Reports the intervention and the direction of both the molecular and the
          physiological readout.
    evidence:
    - reference: PMID:29886132
      reference_title: Chemical chaperone 4-phenylbutylate reduces mutant protein accumulation in the
        endoplasmic reticulum of arginine vasopressin neurons in a mouse model for familial neurohypophysial
        diabetes insipidus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, AVP neuron loss under salt loading was attenuated by 4-PBA treatment."
      explanation: Shows the rescue reaches the degenerative endpoint and not only the
        molecular one, which is what makes the ER burden causal rather than incidental.
- name: Cys67stop FNDI transgenic rat
  species: Rat
  genotype: Cys67stop mutant vasopressin transgene expressed in magnocellular neurons
  publication: PMID:12153465
  description: >-
    An earlier transgenic rat expressing a truncating FNDI allele in vasopressin
    magnocellular neurons. Its contribution is the autophagy arm: it showed that
    the mutant protein accumulates in a swollen, distended ER that also holds
    wild-type endogenous vasopressin, and that the resulting vesicles are
    degradative autolysosomes rather than secretory structures.
  genes:
  - preferred_term: AVP
    term:
      id: hgnc:894
      label: AVP
  evidence:
  - reference: PMID:12153465
    reference_title: Autophagy in hypothalamic neurones of rats expressing a familial neurohypophysial
      diabetes insipidus transgene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In rats expressing an FNDI mutant transgene (Cys67stop) in vasopressin magnocellular neurones, the mutant protein fails to enter the regulated secretory pathway, and accumulates in a swollen and distended endoplasmic reticulum (ER) that also contains wild-type, endogenous vasopressin."
    explanation: >-
      Establishes the model and, in the same sentence, the co-retention of
      wild-type hormone that underlies the dominance of the human disease.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Stress and Autophagy Induction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Lysosomal and late-endosomal markers are upregulated specifically in the
      cells expressing the mutant transgene, and the aggregate-containing
      vesicles are immunoreactive for cathepsin D, endolyn and LAMP1.
    limitations: >-
      A transgene overexpressing a truncated allele rather than a knock-in of a
      patient mutation at the endogenous locus, so expression level and the
      species of retained protein both differ from the human situation. The
      readouts are marker immunoreactivity rather than flux measurements, so
      autophagic activity is inferred from the presence of autolysosomes.
    evidence:
    - reference: PMID:12153465
      reference_title: Autophagy in hypothalamic neurones of rats expressing a familial neurohypophysial
        diabetes insipidus transgene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have now examined the expression of vesicular markers in our transgenic rats, and demonstrate that activation of autolysosomal processes is a consequence of the expression of Cys67stop."
      explanation: >-
        Attests that this model is informative for the autophagy node
        specifically, and states the causal direction the authors claim -
        autolysosomal activation is a consequence of expressing the mutant.
    readouts:
    - name: Lysosomal marker expression in transgene-expressing neurons
      target: Endoplasmic Reticulum Stress and Autophagy Induction
      direction: INCREASED
      interpretation: Cell-type-restricted upregulation of lysosomal markers, the evidence that
        autophagy is engaged by the mutant protein specifically.
      evidence:
      - reference: PMID:12153465
        reference_title: Autophagy in hypothalamic neurones of rats expressing a familial neurohypophysial
          diabetes insipidus transgene.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, there is an up-regulation of lysosomal markers specifically in cells expressing Cys67stop."
        explanation: The measurement, its direction and its restriction to the affected cells.
- name: Sel1L-Hrd1 ERAD-deficient mouse
  species: Mouse
  genotype: Global or AVP-neuron-specific ablation of Sel1L-Hrd1 ER-associated degradation
  publication: PMID:28920920
  description: >-
    Not a model of the mutation, but a model of the mechanism's capacity limit,
    and for that reason one of the most informative animals in this literature.
    Removing the Sel1L-Hrd1 ERAD complex from vasopressin neurons that carry two
    normal AVP alleles is sufficient to produce ER retention, disulfide-bonded
    aggregation of proAVP and progressive diabetes insipidus. It shows that the
    disease phenotype follows from ERAD being overwhelmed, whichever side of the
    balance moves - a mutant client the machinery cannot handle, or intact
    clients with no machinery.
  evidence:
  - reference: PMID:28920920
    reference_title: ER-associated degradation is required for vasopressin prohormone processing and
      systemic water homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with global or AVP neuron-specific ablation of Se1L-Hrd1 ERAD progressively developed polyuria and polydipsia, characteristics of diabetes insipidus."
    explanation: >-
      Establishes the model and the phenotype it produces. The abstract prints
      the gene as "Se1L" for Sel1L; the snippet reproduces the source exactly.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reproduces the ER retention and intermolecular disulfide-bonded
      aggregation of proAVP that the human dominant alleles produce, and
      identifies protein disulfide isomerase activity as what drives the
      inappropriate cross-linking.
    limitations: >-
      The genetic lesion is in the quality-control machinery, not in AVP, so the
      model speaks to why retention is pathogenic and not to why a particular
      patient allele is retained. Loss of Sel1L-Hrd1 also removes ERAD for every
      other client in the neuron, so some of the phenotype may not run through
      proAVP at all.
    readouts:
    - name: Disulfide-bonded proAVP aggregate formation
      target: Endoplasmic Reticulum Retention and Fibrillar Aggregation
      direction: INCREASED
      interpretation: Biochemical measure of the aggregate species, in animals whose proAVP
        sequence is entirely normal.
      evidence:
      - reference: PMID:28920920
        reference_title: ER-associated degradation is required for vasopressin prohormone processing
          and systemic water homeostasis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The inability to clear misfolded proAVP with highly reactive cysteine thiols in the absence of Sel1L-Hrd1 ERAD causes proAVP to accumulate and participate in inappropriate intermolecular disulfide-bonded aggregates, promoted by the enzymatic activity of protein disulfide isomerase (PDI)."
        explanation: Reports the aggregate species and the chemistry that forms it, which is
          the same disulfide-linked fibrillar aggregate described in patients' alleles.
    evidence:
    - reference: PMID:28920920
      reference_title: ER-associated degradation is required for vasopressin prohormone processing and
        systemic water homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further, we show that proAVP is an endogenous substrate of Sel1L-Hrd1 ERAD."
      explanation: >-
        Establishes that this model acts on the node's own substrate rather than
        on the neuron generically, which is what makes the link informative.
- name: Brattleboro rat
  species: Rat
  genotype: Homozygous Avp single-guanine deletion in the neurophysin coding region (frameshift)
  publication: PMID:9756087
  description: >-
    The classical rodent model of central diabetes insipidus and the animal
    almost every physiological study of vasopressin replacement has used. It is
    recorded here for what it does not model. The lesion is a recessive
    frameshift that removes the normal stop codon and extends the C-terminus;
    the precursor is trapped in the ER, but the magnocellular neurons are
    preserved and there is no neurotoxicity, and the animals are affected only
    when homozygous. Every one of those is the opposite of the human dominant
    disease, so results obtained in this rat should not be read across to it.
  evidence:
  - reference: PMID:9756087
    reference_title: 'Vasopressin processing defects in the Brattleboro rat: implications for hereditary
      central diabetes insipidus in humans?'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutated AVP gene precursor of Brattleboro rat has a deletion of a single base, guanine, in the neurophysin coding region that leads to a frameshift resulting in the loss of the normal stop codon."
    explanation: Establishes the model and its causal allele, which is the basis for the
      comparison drawn below.
  modeled_mechanisms:
  - target: Magnocellular Vasopressin Neuron Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The Brattleboro rat retains its magnocellular vasopressin neurons. It has
      the hormone deficiency without the neurodegeneration, so it cannot be used
      to study the proteotoxic arm of the human disease and cannot be used to
      argue that the arm is unnecessary.
    limitations: >-
      Recessive rather than dominant, a frameshift with a read-through
      C-terminus rather than a missense or nonsense allele, and neurons
      preserved rather than lost. The source itself concludes that findings in
      this animal are only partially applicable to human hereditary disease.
    evidence:
    - reference: PMID:9756087
      reference_title: 'Vasopressin processing defects in the Brattleboro rat: implications for hereditary
        central diabetes insipidus in humans?'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, in contrast to the recessive defect in the Brattleboro rat, in human CDI, neurotoxicity and denigration of the magnocellular neurons have been observed, and dominant inheritance occurs."
      explanation: >-
        States the failure directly: neurotoxicity and magnocellular
        degeneration are human findings that this recessive rat does not show.
    - reference: PMID:9756087
      reference_title: 'Vasopressin processing defects in the Brattleboro rat: implications for hereditary
        central diabetes insipidus in humans?'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, the results from studies in the Brattleboro rat may only be partially applicable to hereditary CDI in humans."
      explanation: The authors' own limitation on transfer, which is the reason this model is
        recorded as a negative rather than omitted.

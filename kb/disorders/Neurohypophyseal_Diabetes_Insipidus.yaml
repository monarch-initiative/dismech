name: Neurohypophyseal Diabetes Insipidus
creation_date: '2026-09-05T18:20:00Z'
description: >-
  A hereditary deficiency of arginine vasopressin, transmitted in almost every
  family as an autosomal dominant trait, that presents in infancy or early
  childhood with hypotonic polyuria and compensatory polydipsia and worsens over
  years. The disease is not caused by loss of one working copy of AVP. A
  heterozygous mutation - almost always in the signal peptide or in the
  neurophysin II moiety of the prepro-vasopressin precursor - yields a
  folding-incompetent precursor that cannot leave the endoplasmic reticulum of
  the magnocellular neurons of the supraoptic and paraventricular nuclei. Part
  of it is cleared by ER-associated degradation; the rest forms disulfide-linked
  fibrillar aggregates that also trap the wild-type precursor made from the
  normal allele. The retained aggregate first disables hormone synthesis and
  secretion and then, over a longer timescale, kills the neuron by
  autophagy-associated death. That two-stage toxic gain of function is what
  explains the two features a haploinsufficiency model cannot: onset months to
  years after birth rather than at birth, and relentless progression despite one
  intact allele. Treatment is desmopressin, which replaces the missing hormone
  without touching the neuronal disease. A separate and much rarer autosomal
  recessive form exists, caused by homozygosity for AVP p.Pro26Leu, in which a
  weakly active hormone is synthesised, trafficked and secreted normally; there
  is no ER retention and no neuronal loss, and it is modelled here as a subtype
  precisely because its mechanism is the contrast case.
categories:
- Mendelian
- Protein Misfolding Disorder
- Disorder of the Neurohypophysis

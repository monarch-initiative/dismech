    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analyses with in situ hybridization revealed that expression of AVP mRNA was significantly decreased in the SON in the heterozygous mice compared with that in wild-type mice. Counting cells expressing AVP mRNA in the SON indicated that polyuria had progressed substantially in the absence of neuronal loss."
    explanation: >-
      The direct evidence for this node as a distinct step - transcript and
      function fall while the cells are still there and still counted.
  - reference: PMID:10443701
    reference_title: 'Clinical and molecular evidence of abnormal processing and trafficking of the

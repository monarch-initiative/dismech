- name: Multidisciplinary Surveillance
  description: >-
    A defined surveillance schedule rather than open-ended follow-up: routine
    swallowing and feeding evaluations to reduce aspiration risk, nutritional
    support against malnutrition, and orthopaedic assessment for joint
    dislocation and scoliosis; at least yearly medical evaluation of growth and
    medications with occupational, physical, speech and rehabilitation review;
    and annual neurologic assessment together with cardiac evaluation. The
    cardiac component is easy to overlook in a disorder framed as a
    leukodystrophy and is stated explicitly by the source.

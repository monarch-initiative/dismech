inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    H-ABC is caused by a heterozygous TUBB4A pathogenic variant, which in the
    great majority of reported patients has arisen de novo. Parental somatic
    mosaicism has been documented in at least one family, so recurrence risk is
    not zero even when both parents test negative on blood.
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis is established in a proband with characteristic clinical
      and/or brain MRI findings and a heterozygous TUBB4A pathogenic variant
      identified by molecular genetic testing.
    explanation: >-
      Establishes that a single heterozygous TUBB4A allele is sufficient, i.e.
      dominant inheritance rather than the biallelic pattern of most
      hypomyelinating leukodystrophies.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 11 patients described in that publication had the same heterozygous
      c.745G>A (p.D249N) mutation, which was a de novo change in all patients
      studied, except in one family where somatic mosaicism was detected in the
      clinically unaffected mother.
    explanation: >-
      Documents both the de novo origin that is typical of H-ABC and the
      mosaicism exception that keeps recurrence risk above zero.
pathophysiology:
- name: TUBB4A Heterozygous Missense Variant in Brain-Specific Beta-Tubulin
  conforms_to: "cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant alters beta-tubulin 4A, the brain-specific
    beta-tubulin isotype whose highest expression is in white matter, cerebellum,
    and basal ganglia. The regional expression pattern is the simplest available
    explanation for why a mutation in a ubiquitous cytoskeletal building block
    produces disease confined to those three structures. The recurrent p.D249N
    allele accounts for most reported H-ABC; p.C239F and p.R262H are further
    H-ABC alleles, while p.R2G and p.Q424H at different positions produce the
    mild dystonia-only end of the spectrum instead.
  gene:
    preferred_term: TUBB4A
    term:
      id: hgnc:20774
      label: TUBB4A
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TUBB4A is predominantly expressed in the central nervous system. Brain
      regions with the highest expression levels are the white matter, the
      cerebellum, and the basal ganglia
    explanation: >-
      Supplies the expression basis for the disease's regional selectivity: the
      three structures named in H-ABC are the three with highest TUBB4A
      expression. Evidence source is OTHER because this statement summarizes
      prior expression profiling rather than reporting a new experiment.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A p.C239F mutation was found in one of the originally described H-ABC
      patients, for whom we provide follow-up 11 years after the original
      publication. The second novel mutation, p.R262H, was found in a patient
      with a typical clinical presentation for H-ABC
    explanation: >-
      Establishes that H-ABC is not restricted to the recurrent p.D249N allele,
      which is why this node is written around the gene rather than one variant.
  downstream:
  - target: Altered Microtubule Dynamics in Oligodendrocytes
    description: >-
      The mutant heterodimer is incorporated into microtubules but changes how
      they polymerize.

- name: Altered Microtubule Dynamics in Oligodendrocytes
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"
  biological_scale: CELLULAR
  description: >-
    Mutant TUBB4A is still incorporated into microtubules - this is not a
    null-allele mechanism - but it changes their behaviour. Live-cell imaging in
    disease-relevant oligodendrocytes and TIRF microscopy of whole-cell lysates
    show divergent effects on microtubule polymerization and on integration of
    the mutant subunit, and the direction and magnitude of those effects track
    with where a given variant sits on the H-ABC-to-dystonia severity spectrum.
    Because an oligodendrocyte must extend and maintain a large process
    arborization to myelinate, a cytoskeleton that polymerizes abnormally
    compromises the lineage's capacity to differentiate and wrap axons.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: microtubule polymerization
    term:
      id: GO:0046785
      label: microtubule polymerization
    modifier: DYSREGULATED
  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using live-cell imaging of disease-relevant oligodendrocytes and total
      internal reflection fluorescence microscopy of whole-cell lysates, we
      observed divergent impact on microtubule polymerization and microtubule
      integration, partially reflecting the observed pleiotropy.
    explanation: >-
      Directly measures the microtubule defect in the disease-relevant cell type
      and links its magnitude to clinical severity. Evidence source is IN_VITRO
      because the measurements are made in cultured oligodendrocytes and
      cell lysates.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, all TUBB4A forms could integrate into the microtubules,
      represented by colocalized GFP-tagged tubulin and endogenous tubulin
      signals.
    explanation: >-
      Rules out simple failure of incorporation, which is why this node is
      curated as altered dynamics of an assembled microtubule rather than as
      loss of the subunit.
  downstream:
  - target: Diffuse Central Hypomyelination
    description: >-
      An oligodendrocyte with a compromised cytoskeleton fails to deposit
      adequate myelin.
  - target: Basal Ganglia and Cerebellar Neurodegeneration
    description: >-
      Mouse H-ABC models show neuronal as well as glial pathology, so the
      neuronal arm is not simply secondary to hypomyelination.

- name: Diffuse Central Hypomyelination
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  biological_scale: TISSUE
  description: >-
    Myelin is never adequately deposited, producing the diffuse central
    hypomyelination that gives the disorder its leukodystrophy classification.
    This is hypomyelination rather than demyelination: the deficit is a failure
    to lay myelin down, and follow-up imaging in some patients shows no
    progression of myelination over years rather than loss of a normally formed
    sheath. Its extent is variable, and a minority of patients have focal and
    milder hypomyelination with partial myelination of the corpus callosum and
    internal capsule.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  locations:
  - preferred_term: cerebral white matter
    term:
      id: UBERON:0002316
      label: white matter
  evidence:
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      H-ABC is a leukodystrophy characterized by diffuse central hypomyelination,
      atrophy of the caudate, putamen, and cerebellum (particularly the vermis),
      and normal thalamus and globus pallidus.
    explanation: >-
      States the defining imaging triad, including the sparing of thalamus and
      globus pallidus that distinguishes H-ABC from other hypomyelinating
      leukodystrophies with basal ganglia change.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypomyelination was found in all patients and was generalized in Patients 1
    explanation: >-
      Confirms hypomyelination in every patient of the reported series while
      recording that its extent varied, which is why this node is written as
      variable in degree rather than uniform.
  downstream:
  - target: Progressive Pyramidal, Extrapyramidal, and Cerebellar Dysfunction
    description: >-
      Deficient central myelination impairs conduction in the long motor tracts.

- name: Basal Ganglia and Cerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >-
    In parallel with the white-matter lesion, the caudate, putamen, and
    cerebellum - especially the vermis - undergo progressive atrophy, while the
    thalamus and globus pallidus are spared. Serial imaging shows the atrophy
    developing over years in individual patients rather than being a static
    hypoplasia. Whether the neuronal loss is a primary consequence of mutant
    TUBB4A in neurons or is secondary to the white-matter lesion is not settled
    from human data, but a knock-in mouse carrying the H-ABC p.D249N allele shows
    both neuronal and glial pathology with altered microtubule dynamics in
    cortical neurons, which argues for a primary neuronal contribution. This node
    deliberately does not conform to cns_myelin_failure, because the module's
    consequence node is axonal degeneration secondary to sheath loss and this is
    a separate grey-matter arm.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Patients 1 and 2, progressive atrophy of the head of the caudate was
      noted
    explanation: >-
      Documents the atrophy as progressive on serial imaging within individual
      patients, which is the basis for curating it as degeneration rather than
      as a developmental hypoplasia.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In a mouse model with an H-ABC
    explanation: >-
      Introduces the H-ABC knock-in mouse in which both neuronal and glial
      pathology were found, the model evidence for a primary neuronal arm.
      Evidence source is MODEL_ORGANISM because the finding is from a mouse.
  downstream:
  - target: Progressive Pyramidal, Extrapyramidal, and Cerebellar Dysfunction
    description: >-
      Striatal and cerebellar neuronal loss produces the extrapyramidal and
      cerebellar components of the syndrome.

- name: Progressive Pyramidal, Extrapyramidal, and Cerebellar Dysfunction
  conforms_to: "cns_myelin_failure#Axonal Degeneration and Progressive White Matter Dysfunction"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint combines three motor systems whose anatomical
    substrates are the three structures TUBB4A is most highly expressed in.
    Pyramidal involvement gives spasticity, brisk reflexes, and Babinski signs;
    extrapyramidal involvement gives rigidity, dystonia, choreoathetosis, and
    oculogyric crises; cerebellar involvement gives ataxia, intention tremor, and
    dysmetria; and bulbar involvement gives dysarthria, dysphonia, and swallowing
    difficulty. Cognition is variably affected and is usually less severely
    affected than motor function, so a severely motor-disabled H-ABC patient may
    retain near-intact comprehension. Most patients lose independent ambulation.
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive neurologic findings reflect involvement of the pyramidal tracts
      (spasticity, brisk deep tendon reflexes, and Babinski sign), extrapyramidal
      system (rigidity, dystonia, choreoathetosis, oculogyric crisis, and
      perioral dyskinesia), cerebellum (ataxia, intention tremor, dysmetria), and
      bulbar function (dysarthria, dysphonia, and swallowing).
    explanation: >-
      Enumerates the four systems involved and the signs each contributes, which
      is the content of this node.
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognition is variably affected and is usually less severely affected than
      motor function. The rate of progression varies with disease severity.
    explanation: >-
      Supports the motor-cognitive dissociation recorded in this node and the
      variable tempo, which is why no single rate of decline is asserted.

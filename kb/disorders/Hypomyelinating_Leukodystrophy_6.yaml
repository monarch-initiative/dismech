name: Hypomyelinating Leukodystrophy 6
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
synonyms:
- H-ABC
- HABC
- HLD6
- hypomyelination with atrophy of the basal ganglia and cerebellum
- leukodystrophy, hypomyelinating, with atrophy of the basal ganglia and cerebellum
- hypomyelinating leukodystrophy type 6
description: >-
  Hypomyelinating leukodystrophy 6, universally known as H-ABC (hypomyelination
  with atrophy of the basal ganglia and cerebellum), is a severe hypomyelinating
  leukodystrophy caused by heterozygous, usually de novo, pathogenic variants in
  TUBB4A. TUBB4A encodes the brain-specific beta-tubulin 4A isotype, whose
  highest expression is in exactly the three structures the disease names: white
  matter, cerebellum, and basal ganglia. The imaging signature is diffuse central
  hypomyelination together with atrophy of the caudate, putamen, and cerebellum,
  characteristically sparing the thalamus and globus pallidus. Clinically the
  disease combines pyramidal, extrapyramidal, and cerebellar features -
  spasticity in essentially every patient, with dystonia, ataxia, dysarthria,
  rigidity, and choreoathetosis - and cognition is typically less severely
  affected than motor function. H-ABC sits at the severe end of a pleiotropic
  TUBB4A spectrum whose mild end is the adult-onset isolated dystonia DYT-TUBB4A,
  and the two ends are separated by which TUBB4A residue is altered rather than
  by any difference in gene dosage.

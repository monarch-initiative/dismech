      label: TUBB4A
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense variants, usually de novo. The recurrent p.D249N allele
    accounts for the majority of reported H-ABC; p.C239F and p.R262H are further
    H-ABC alleles. Variants at other residues (p.R2G, p.Q424H) produce
    DYT-TUBB4A, the isolated-dystonia end of the same gene's spectrum, so
    genotype rather than dosage determines where a patient falls on it.
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the brain-specific β-tubulin 4A (TUBB4A) gene cause a broad
      spectrum of diseases, ranging from dystonia (DYT-TUBB4A) to hypomyelination
      with atrophy of the basal ganglia and cerebellum (H-ABC).
    explanation: >-
      Establishes TUBB4A as causative and situates H-ABC at the severe end of the
      allelic spectrum. Evidence source is OTHER because this framing statement
      summarizes the prior clinical genetics literature.
treatments:
- name: Supportive and Rehabilitative Care
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    multidisciplinary: physiotherapy and orthopaedic care for spasticity and
    contractures, antispasticity pharmacotherapy, gastrostomy feeding for
    swallowing dysfunction and recurrent aspiration, and respiratory support.
    Levodopa/carbidopa and trihexyphenidyl have been tried for the movement
    disorder without demonstrated benefit in reported patients.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was treated with levodopa/carbidopa and trihexyphenidyl without benefit,
      and is currently on baclofen for his increased muscle tone, with
      questionable effect.
    explanation: >-
      Records the observed lack of benefit from dopaminergic and anticholinergic
      therapy in a reported H-ABC patient, which is why no disease-specific
      pharmacotherapy is curated as effective here.
notes: >-
  H-ABC is the severe pole of a pleiotropic TUBB4A spectrum. The dystonia-only
  pole, DYT-TUBB4A, is a separate clinical entity and should not be conflated
  with this entry; the mechanistic question of how two variants at the same
  residue (p.R2G and p.R2W) produce two different diseases remains open, and
  destabilized beta-tubulin mRNA autoregulation has been argued to be
  insufficient to explain it.


  The relationship between the white-matter and grey-matter arms is not settled
  from human data. The taiep rat, homozygous for TUBB4A p.A302T, shows purely
  glial impairment in the form of hypomyelination, whereas the p.D249N knock-in
  mouse shows both neuronal and glial pathology - so which arm dominates appears
  to be allele-dependent, and this entry curates the two arms as parallel rather
  than asserting that one causes the other.

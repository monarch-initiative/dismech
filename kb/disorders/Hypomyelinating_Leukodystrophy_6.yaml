genetic:
- name: TUBB4A pathogenic variants
  gene_term:
    preferred_term: TUBB4A
    term:
      id: hgnc:20774
      label: TUBB4A
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense variants, usually de novo. The recurrent p.D249N allele
    accounts for the majority of reported H-ABC; p.C239F and p.R262H are further
    H-ABC alleles. Variants at other residues (p.R2G, p.Q424H) produce
    DYT-TUBB4A, the isolated-dystonia end of the same gene's spectrum, so
    genotype rather than dosage determines where a patient falls on it.
  evidence:
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the brain-specific β-tubulin 4A (TUBB4A) gene cause a broad
      spectrum of diseases, ranging from dystonia (DYT-TUBB4A) to hypomyelination
      with atrophy of the basal ganglia and cerebellum (H-ABC).
    explanation: >-
      Establishes TUBB4A as causative and situates H-ABC at the severe end of the
      allelic spectrum. Evidence source is OTHER because this framing statement
      summarizes the prior clinical genetics literature.

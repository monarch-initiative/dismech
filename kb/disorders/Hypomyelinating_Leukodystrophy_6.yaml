notes: >-
  H-ABC is the severe pole of a pleiotropic TUBB4A spectrum. The dystonia-only
  pole, DYT-TUBB4A, is a separate clinical entity and should not be conflated
  with this entry; the mechanistic question of how two variants at the same
  residue (p.R2G and p.R2W) produce two different diseases remains open, and
  destabilized beta-tubulin mRNA autoregulation has been argued to be
  insufficient to explain it.


  The relationship between the white-matter and grey-matter arms is not settled
  from human data. The taiep rat, homozygous for TUBB4A p.A302T, shows purely
  glial impairment in the form of hypomyelination, whereas the p.D249N knock-in
  mouse shows both neuronal and glial pathology - so which arm dominates appears
  to be allele-dependent, and this entry curates the two arms as parallel rather
  than asserting that one causes the other.

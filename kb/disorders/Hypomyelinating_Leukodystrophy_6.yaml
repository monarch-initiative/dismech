  evidence:
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      H-ABC is a leukodystrophy characterized by diffuse central hypomyelination,
      atrophy of the caudate, putamen, and cerebellum (particularly the vermis),
      and normal thalamus and globus pallidus.
    explanation: >-
      States the defining imaging triad, including the sparing of thalamus and
      globus pallidus that distinguishes H-ABC from other hypomyelinating
      leukodystrophies with basal ganglia change.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypomyelination was found in all patients and was generalized in Patients 1
      (Fig. 1B,D) and 2 (Fig. 1F,H), but focal and milder in Patient 3.
    explanation: >-
      Confirms hypomyelination in every patient of the reported series while
      recording that its extent varied - generalized in two patients, focal and
      milder in the third - which is why this node is written as variable in
      degree rather than uniform.
  downstream:
  - target: Progressive Pyramidal, Extrapyramidal, and Cerebellar Dysfunction
    description: >-
      Deficient central myelination impairs conduction in the long motor tracts.

- name: Basal Ganglia and Cerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >-
    In parallel with the white-matter lesion, the caudate, putamen, and
    cerebellum - especially the vermis - undergo progressive atrophy, while the
    thalamus and globus pallidus are spared. Serial imaging shows the atrophy
    developing over years in individual patients rather than being a static
    hypoplasia. Whether the neuronal loss is a primary consequence of mutant
    TUBB4A in neurons or is secondary to the white-matter lesion is not settled
    from human data, but a knock-in mouse carrying the H-ABC p.D249N allele shows
    both neuronal and glial pathology with altered microtubule dynamics in
    cortical neurons, which argues for a primary neuronal contribution. This node
    deliberately does not conform to cns_myelin_failure, because the module's
    consequence node is axonal degeneration secondary to sheath loss and this is
    a separate grey-matter arm.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Patients 1 and 2, progressive atrophy of the head of the caudate was
      noted
    explanation: >-
      Documents the atrophy as progressive on serial imaging within individual
      patients, which is the basis for curating it as degeneration rather than
      as a developmental hypoplasia.
  - reference: PMID:24706558
    reference_title: Novel TUBB4A mutations and expansion of the neuroimaging phenotype of hypomyelination with atrophy of the basal ganglia and cerebellum (H-ABC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At follow-up, we saw cerebellar atrophy in all patients
    explanation: >-
      Supports the cerebellar half of this node, which the caudate-atrophy
      evidence does not cover. Atrophy was present in every patient at follow-up
      though not on every first scan, consistent with a degenerative course.
  - reference: PMID:35275727
    reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      both neuronal and glial pathologies were detected, and altered microtubule
      dynamics were found in cortical neurons
    explanation: >-
      Reports the finding that motivates curating a primary neuronal arm rather
      than treating the grey-matter lesion as secondary to hypomyelination: in
      the H-ABC p.D249N knock-in mouse both neuronal and glial pathology are
      present, with altered microtubule dynamics in cortical neurons. Evidence
      source is MODEL_ORGANISM because the finding is from a mouse.
  downstream:
  - target: Progressive Pyramidal, Extrapyramidal, and Cerebellar Dysfunction
    description: >-
      Striatal and cerebellar neuronal loss produces the extrapyramidal and
      cerebellar components of the syndrome.

- name: Progressive Pyramidal, Extrapyramidal, and Cerebellar Dysfunction
  conforms_to: "cns_myelin_failure#Axonal Degeneration and Progressive White Matter Dysfunction"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint combines three motor systems whose anatomical
    substrates are the three structures TUBB4A is most highly expressed in.
    Pyramidal involvement gives spasticity, brisk reflexes, and Babinski signs;
    extrapyramidal involvement gives rigidity, dystonia, choreoathetosis, and
    oculogyric crises; cerebellar involvement gives ataxia, intention tremor, and
    dysmetria; and bulbar involvement gives dysarthria, dysphonia, and swallowing
    difficulty. Cognition is variably affected and is usually less severely
    affected than motor function, so a severely motor-disabled H-ABC patient may
    retain near-intact comprehension. Most patients lose independent ambulation.
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  evidence:
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive neurologic findings reflect involvement of the pyramidal tracts
      (spasticity, brisk deep tendon reflexes, and Babinski sign), extrapyramidal
      system (rigidity, dystonia, choreoathetosis, oculogyric crisis, and
      perioral dyskinesia), cerebellum (ataxia, intention tremor, dysmetria), and
      bulbar function (dysarthria, dysphonia, and swallowing).
    explanation: >-
      Enumerates the four systems involved and the signs each contributes, which
      is the content of this node.
  - reference: PMID:27809427
    reference_title: TUBB4A-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognition is variably affected and is usually less severely affected than
      motor function. The rate of progression varies with disease severity.
    explanation: >-
      Supports the motor-cognitive dissociation recorded in this node and the
      variable tempo, which is why no single rate of decline is asserted.

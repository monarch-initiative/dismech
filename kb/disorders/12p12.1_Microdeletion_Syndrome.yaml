name: 12p12.1 Microdeletion Syndrome
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
description: >-
  The 12p12.1 microdeletion syndrome is the deletion form of Lamb-Shaffer syndrome, a
  neurodevelopmental disorder caused by haploinsufficiency of SOX5. The clinical picture is
  global developmental delay with disproportionately prominent speech delay, mild to
  moderate intellectual disability, behavioural features including autistic traits, and
  subtle characteristic facial features.

  The name is regional but the disease is not. Deletions at 12p12.1 were how the entity was
  found and they remain the commonest mutational class, but three other classes produce the
  same phenotype: intragenic deletions, truncating and missense point variants, and
  balanced translocations whose breakpoint falls inside SOX5. A translocation carries no
  copy-number change at all, and the affected individuals reported with one are clinically
  indistinguishable. So the deleted region is not the disease-defining feature; loss of one
  functional SOX5 allele is, and this entry is curated on that basis with the deletion
  treated as one route to it.

  The missense variants are what make the haploinsufficiency claim more than an inference
  from gene dose. They cluster in the SOX-specific high-mobility-group domain, and the ones
  that do cluster there abolish DNA binding and transactivation in vitro, while missense
  variants elsewhere in the protein do neither and are generally better tolerated
  clinically. That is a structure-function-phenotype correspondence at three levels for one
  gene, and it is the strongest evidence in this entry.

  What is absent is equally worth stating: across a cohort of 41 patients no clear
  genotype-phenotype correlation was found beyond the tolerance of out-of-domain missense
  variants. Deletion size does not predict severity, and this entry therefore makes no
  claim that it does.
synonyms:
- Lamb-Shaffer syndrome
- LAMSHF
- SOX5 haploinsufficiency
- monosomy 12p12.1
- del(12)(p12.1)

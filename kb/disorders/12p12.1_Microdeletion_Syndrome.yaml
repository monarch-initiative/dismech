genetic:
- name: SOX5
  gene_term:
    preferred_term: SOX5
    term:
      id: hgnc:11201
      label: SOX5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SRY-box transcription factor 5, a SOXD-family transcription factor regulating cell fate
    and differentiation in neurogenesis. The disease-relevant lesions affect the two long
    isoforms. Disease-associated missense variants cluster in the SOX-specific
    high-mobility-group domain and abolish DNA binding and transactivation; missense
    variants elsewhere do not and are better tolerated.
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The latter variants prevented SOX5 from binding DNA and promoting transactivation in
      vitro, whereas missense variants located outside the high-mobility-group domain did
      not.
    explanation: >-
      Functional demonstration for the missense class, with the out-of-domain variants
      serving as an internal negative control.
  - reference: PMID:29477873
    reference_title: "Clinical and genetic characterization of a patient with SOX5 haploinsufficiency caused by a de novo balanced reciprocal translocation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We determined the translocation breakpoints of the patient to be in intron 4 of SOX5
      and the intergenic region in 20p12.3 via FISH and nucleotide sequence analyses.
    explanation: >-
      Localises a disease-causing breakpoint inside SOX5, which is what makes a balanced
      rearrangement an SOX5 lesion rather than a positional coincidence.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, and in the great majority of reported cases de novo. Parental
    gonadal mosaicism has been documented, which is the counselling point: a couple with
    one affected child and an apparently de novo variant does not have a negligible
    recurrence risk.
  evidence:
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This cohort provides further evidence of gonadal mosaicism in SOX5 variants; this
      should be considered when providing genetic counseling for couples with one affected
      child and an apparently de novo variant.
    explanation: >-
      States both the observation and the counselling consequence the authors draw from it.
animal_models:
- name: Sox5 null mouse
  species: Mouse
  genotype: Sox5(-/-)
  publication: PMID:18215621
  description: >-
    A constitutive Sox5 knockout, used to establish what the transcription factor does in
    corticogenesis rather than to model the human disease. It is the only in vivo system
    cited in this entry, and its relationship to the human lesion is a real limitation
    rather than a formality: the mouse is homozygous null and the patients are heterozygous.
  modeled_mechanisms:
  - target: Disrupted Neurodevelopmental Transcriptional Program
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Identifies the programme SOX5 controls - temporal ordering of corticofugal neuron
      subtype generation - and shows what its loss does to that ordering.
    limitations: >-
      Sox5(-/-) is a homozygous null; the human disease is heterozygous haploinsufficiency,
      so the model tests whether SOX5 is required for the programme rather than whether
      halving it disturbs the programme. The readouts are neuronal subtype identity and
      timing in mouse cortex, not the clinical phenotypes this entry curates, and no
      behavioural or cognitive correspondence is claimed. Species divergence in cortical
      development is a further gap that the source does not address.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse corticogenesis lacks the expanded outer subventricular zone and the
        human-specific progenitor populations that shape human cortical layering, so
        subtype-timing conclusions may not transfer directly.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model observes neuronal subtype identity in cortex at the cellular level, while
        the node it is linked to is a tissue-level transcriptional programme, so the tissue
        claim is inferred from cellular readouts.
    readouts:
    - name: Corticofugal neuron subtype identity
      target: Disrupted Neurodevelopmental Transcriptional Program
      direction: ALTERED
      interpretation: >-
        Overlapping rather than distinct subtype identities is the structural correlate of
        a mistimed generation programme.
      evidence:
      - reference: PMID:18215621
        reference_title: "SOX5 controls the sequential generation of distinct corticofugal neuron subtypes."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          SOX5 loss-of-function causes striking overlap of the identities of the three
          principal sequentially born corticofugal neuron subtypes: subplate neurons,
          corticothalamic neurons, and subcerebral projection neurons.
        explanation: The measured outcome and its direction in the knockout.
    - name: Subtype-specific differentiation timing
      target: Disrupted Neurodevelopmental Transcriptional Program
      direction: ALTERED
      interpretation: >-
        Each of the three subtypes is affected differently, which is what distinguishes a
        timing defect from a general failure of differentiation.
      evidence:
      - reference: PMID:18215621
        reference_title: "SOX5 controls the sequential generation of distinct corticofugal neuron subtypes."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In Sox5(-/-) cortex, subplate neurons aberrantly develop molecular hallmarks and
          connectivity of subcerebral projection neurons; corticothalamic neurons are
          imprecisely differentiated, while differentiation of subcerebral projection
          neurons is accelerated.
        explanation: >-
          Resolves the phenotype per subtype, including an acceleration, which is the
          observation that makes "premature emergence" the right description.
  evidence:
  - reference: PMID:18215621
    reference_title: "SOX5 controls the sequential generation of distinct corticofugal neuron subtypes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that the transcription factor SOX5 controls the sequential generation of
      distinct corticofugal neuron subtypes by preventing premature emergence of normally
      later-born corticofugal neurons.
    explanation: >-
      Supports treating this model as informative for the node. INDIRECT: the study is about
      SOX5 biology in mouse and was not designed as a disease model, so its relevance to the
      human disorder is an inference.
treatments:
- name: Aripiprazole after Risperidone Intolerance
  description: >-
    Not a treatment recommendation, and it should not be read as one. A single reported
    child with Lamb-Shaffer syndrome developed paradoxical behavioural activation on very
    low-dose risperidone given for irritability and self-injury, and subsequently tolerated
    aripiprazole. It is curated because behavioural disturbance is a core part of this
    syndrome, psychotropic prescribing is therefore common, and this is the only
    disease-specific pharmacological observation in the literature - n=1, uncontrolled, and
    a paradoxical reaction to one agent in one child is not evidence about the class.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:41531626
    reference_title: "Risperidone-Induced Paradoxical Agitation in a Child With Lamb-Shaffer Syndrome, Autism Spectrum Disorder, and Attention Deficit Hyperactivity Disorder: A Case Report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data on psychotropic response profiles in Lamb-Shaffer syndrome are extremely limited.
    explanation: >-
      Curated as its own evidence item because it is the qualifier that governs how the
      efficacy observation should be read, and there is no slot for a strength qualifier on
      the item it qualifies.
  - reference: PMID:41531626
    reference_title: "Risperidone-Induced Paradoxical Agitation in a Child With Lamb-Shaffer Syndrome, Autism Spectrum Disorder, and Attention Deficit Hyperactivity Disorder: A Case Report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a six-year-five-month-old boy with de novo Lamb-Shaffer syndrome, autism
      spectrum disorder (ASD) of mild-to-moderate severity, attention deficit hyperactivity
      disorder, and query intellectual disability who developed paradoxical behavioral
      activation after initiation of very low-dose risperidone oral solution (0.12 mg once
      daily) for mild-to-moderate irritability, aggression, and self-injurious head banging.
    explanation: >-
      The observation itself, with its full denominator visible in the quote: one boy, one
      dose, one agent.
diagnosis:
- name: Chromosomal Microarray
  description: >-
    Detects the 12p12.1 and intragenic deletions, which is how the syndrome was originally
    defined. It will not detect the point variants that make up most of a contemporary
    cohort, nor a balanced translocation.
  evidence:
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "7/16 have intragenic deletions of SOX5 and 9/16 have single nucleotide variants (including both truncating and missense variants)."
    explanation: >-
      Supports the limitation rather than the test: in this series a majority of lesions
      are point variants, which a microarray cannot see. INDIRECT because the inference
      from the mutational split to the test's sensitivity is the curator's.
- name: SOX5 Sequencing
  description: >-
    Detects the truncating and missense variants that a microarray misses, and is what a
    contemporary exome or gene panel does. In practice most diagnoses now arrive through
    broad sequencing rather than through a targeted test.
  evidence:
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 16 SOX5 variants all of which meet American College of Medical Genetics/Association for Clinical Genomic Science ACMG/ACGS criteria class IV or V."
    explanation: >-
      Establishes that the sequence variants reported are classified pathogenic or likely
      pathogenic under a named standard, which is what makes a sequencing result actionable.
discussions:
- discussion_id: entity_is_gene_not_region
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#12p12.1 Microdeletion Syndrome
  - pathophysiology#Loss of One Functional SOX5 Allele
  prompt: >-
    Should this concept be named and modelled as a chromosomal microdeletion syndrome at
    all, given that most reported lesions are not deletions?
  rationale: >-
    MONDO:0017781 names a cytogenetic region and sits under "chromosome 12p deletion". The
    disease it labels is SOX5 haploinsufficiency, and in the most recent series nine of
    sixteen lesions were single nucleotide variants rather than deletions, while two
    reported patients have balanced translocations with no copy-number change at all. A
    region-named class implies that contiguous-gene effects matter, and nothing in the
    literature cited here suggests they do: no second gene in the interval has been
    implicated, and deletion size does not track severity. This entry is therefore curated
    as SOX5 haploinsufficiency with the deletion as one mutational class, and the mismatch
    between that and the MONDO label is recorded rather than papered over. It is an
    upstream question for MONDO whether Lamb-Shaffer syndrome should be the primary class.
  evidence:
  - reference: PMID:29477873
    reference_title: "Clinical and genetic characterization of a patient with SOX5 haploinsufficiency caused by a de novo balanced reciprocal translocation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the present patient has SOX5 haploinsufficiency affecting 2 long forms of SOX5
      and is the second reported case of Lamb-Shaffer syndrome caused by a de novo balanced
      reciprocal translocation.
    explanation: >-
      A patient with the disease and no deletion. This is the single observation that most
      directly undercuts a region-based definition.
  - reference: PMID:23220431
    reference_title: "Haploinsufficiency of SOX5, a member of the SOX (SRY-related HMG-box) family of transcription factors is a cause of intellectual disability."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The smallest deletion helps to narrow down the critical region to a genomic segment
      (chr12:23,924,800-24,041,698, build 37/hg19) encompassing only one gene, SOX5.
    explanation: >-
      Settles the "no second gene in the interval" claim from the deletion side rather than
      by absence of evidence. Intersecting deletions of different sizes leaves a critical
      region containing SOX5 alone, which is what a contiguous-gene account would have to
      contradict.
- discussion_id: no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of One Functional SOX5 Allele
  - phenotypes#Microcephaly
  prompt: >-
    Why is the clinical severity of SOX5 haploinsufficiency so variable when the molecular
    lesion is uniform, and does the microcephaly signal in point-variant patients survive a
    larger cohort?
  rationale: >-
    A 41-patient study found no clear genotype-phenotype correlation beyond the tolerance
    of out-of-domain missense variants, and severity nonetheless varies widely. Two
    readings are open. If the lesion really is uniform haploinsufficiency, the variability
    must come from modifiers or from the genetic background, and nothing has been done to
    look. Alternatively the lesions are not equivalent, and the later observation that
    point-variant patients tend toward lower growth parameters and microcephaly than
    deletion patients hints at that - which would be counterintuitive, since a whole-gene
    deletion is the more complete loss. That observation is a tendency in sixteen patients
    and needs replication before it is treated as a correlation. Until then this entry
    makes no claim that lesion class predicts severity.
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No clear genotype-phenotype correlations were found, except that missense variants
      outside the high-mobility-group domain were generally better tolerated.
    explanation: >-
      The negative result this gap is built on, stated in the largest available cohort, with
      its one exception.
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations and severity varied among patients."
    explanation: States the variability that the absent correlation fails to explain.
- discussion_id: no_model_system
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disrupted Neurodevelopmental Transcriptional Program
  - animal_models#Mouse
  prompt: >-
    Does halving SOXFive in a human brain mistime corticofugal subtype generation the way
    abolishing it does in a mouse?
  rationale: >-
    This is a mismatch rather than an absence, which is why it is typed
    HUMAN_MODEL_MISMATCH. Evidence exists and it is good: the Sox5 null mouse identifies the
    programme SOX5 controls and shows precisely how its loss disorders corticofugal subtype
    timing. What it cannot establish is the step this disease turns on. The mouse is a
    homozygous null and every reported patient is heterozygous, so the experiment answers
    "is SOX5 required" and the disease asks "what does half of it do". A dosage-sensitive
    transcription factor is exactly the case where those can come apart.

    Two further gaps sit alongside it and are genuinely absences. No patient-derived neural
    material has been transcriptionally characterised, so the human targets are unidentified.
    And mouse corticogenesis lacks the expanded outer subventricular zone that shapes human
    cortical layering, so even a heterozygous mouse would leave a species question open.

    Until that is addressed, the mechanism node stays PROVISIONAL and no therapeutic target
    follows from it.
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study was aimed at increasing our understanding of LAMSHF, its clinical
      and genetic spectrum, and the pathophysiological mechanisms involved.
    explanation: >-
      The largest study of the disorder states mechanism as an aim, and what it delivered
      on that aim was the in vitro DNA-binding result rather than anything in neural tissue.
      INDIRECT: this supports the gap by what the literature does not contain.
notes: >-
  Lump/split decision: DISEASE. MONDO:0017781 names one entity with one conserved
  pathograph, and the stub is retired accordingly. Its MONDO parent, chromosome 12p
  deletion (MONDO:0022174), is itself an uncurated open stub, so nothing here duplicates an
  existing entry.

  The entry is curated as SOX5 haploinsufficiency rather than as a copy-number lesion,
  and that is the substantive decision. Deletions at 12p12.1 are how the syndrome was
  found and gave it its name, but intragenic deletions, truncating and missense point
  variants and balanced translocations all produce the same disease, and in the most
  recent series point variants outnumber deletions. The root pathophysiology node is
  therefore "Loss of One Functional SOX5 Allele" and the deletion is one route to it. The
  mismatch between that model and the region-based MONDO label is recorded as its own
  knowledge gap rather than resolved here, since it is an upstream question.

  Lamb-Shaffer syndrome is carried as a synonym rather than as a separate concept. The
  literature uses the two names for one disease and has done since the deletions and the
  point variants were recognised as equivalent.

  One evidence-metadata limitation worth naming, because it shapes how this entry should
  be read. Almost every clinical statement here comes from a cohort, and the cohorts differ
  by an order of magnitude in size and by ascertainment route - 41 patients collected
  through GeneMatcher, 16 through a national database, a single translocation case report.
  dismech's EvidenceItem records the paper and the study type but not the sample size, so
  a reader cannot tell a 41-patient finding from a 1-patient one without opening the
  reference. This entry compensates by choosing snippets that carry their own denominators
  where such a sentence exists, which is why several quotes here include counts that a
  tidier summary sentence would have dropped.

  The treatments section carries one row and it is deliberately not a recommendation. There
  is no disease-modifying therapy and no published management guideline for this disorder.
  What does exist is a single case of paradoxical activation on low-dose risperidone with
  subsequent aripiprazole tolerance, which is curated because behavioural disturbance is
  core to the syndrome and psychotropic prescribing is therefore common. Its own source
  says data on psychotropic response in this syndrome are extremely limited, and that
  sentence is curated as its own evidence item so the qualifier travels with the claim.

  A note on how this entry was revised. The first version cited 3 of the 20 references its
  own deep-research run had fetched and committed, and review correctly identified that
  several of the uncited ones were the papers that would settle the entry's open questions.
  Two changed the content rather than merely padding it: the smallest-deletion critical
  region is a stronger argument for the single-gene reading than the translocation case
  alone, and the Sox5 null mouse supplies the mechanism the transcriptional-program node had
  been left holding open. A third corrected an overstatement - the first version generalised
  "point variants outnumber deletions" from a 16-patient series, and the 83-variant
  cumulative count is roughly even at 47 to 53 per cent. The lump/split decision is
  unchanged, and is now better supported.

  One item from that review was not adopted: it attributed "There is currently no treatment
  for LSS" to PMID:40163633, and that sentence is not in the cached text of that reference.
  The claim is probably true and no source cited here states it, so the entry says it in
  prose here rather than as a quoted evidence item.

  The deep-research report generated for this entry is committed alongside it under
  research/. Unlike the report for the KIDAR entry in the same run, it is on-target: it
  names SOX5 throughout and identifies Lamb-Shaffer syndrome correctly. Reference selection
  and every snippet here were nonetheless taken from the fetched reference cache rather
  than from the report.

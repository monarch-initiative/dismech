prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2019 spectrum-widening study described 41 novel patients against "just over two
    dozen" previously reported, and a 2023 series added 16 more against 71 previously
    reported. So the reported population has grown from roughly 25 to roughly 90 across
    five years, which is a fact about ascertainment through exome sequencing and matchmaking
    rather than about incidence. No population rate is available.
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lamb-Shaffer syndrome (LAMSHF) is a neurodevelopmental disorder described in just
      over two dozen patients with heterozygous genetic alterations involving SOX5, a gene
      encoding a transcription factor regulating cell fate and differentiation in
      neurogenesis and other discrete developmental processes.
    explanation: >-
      Gives the reported population at the time and, in the same sentence, the gene's
      normal role.
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This cohort of 16 patients is compared with the 71 previously reported cases and corroborates previous phenotypic findings."
    explanation: >-
      The later count, which is what makes the growth of the reported population visible
      rather than having to be inferred.
pathophysiology:
- name: Loss of One Functional SOX5 Allele
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous lesion that removes or disables one SOX5 allele. Four mutational classes
    are described and they converge here: microdeletions at 12p12.1, intragenic deletions,
    truncating and missense point variants, and balanced translocations with a breakpoint
    inside the gene. This node, rather than any one of those lesions, is what the entry is
    curated on.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: SOX5
      term:
        id: hgnc:11201
        label: SOX5
    description: >-
      Usually de novo. Parental gonadal mosaicism has been documented in at least one
      family, which matters for counselling: an apparently de novo variant does not
      guarantee a negligible recurrence risk.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microdeletions and truncating variants occurred throughout SOX5."
    explanation: >-
      Establishes that the causal lesions are distributed across the gene rather than
      confined to the deleted region the syndrome is named after.
  - reference: PMID:29477873
    reference_title: "Clinical and genetic characterization of a patient with SOX5 haploinsufficiency caused by a de novo balanced reciprocal translocation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the present patient has SOX5 haploinsufficiency affecting 2 long forms of SOX5
      and is the second reported case of Lamb-Shaffer syndrome caused by a de novo balanced
      reciprocal translocation.
    explanation: >-
      A patient with no copy-number change at all and the same disease, which is the
      observation that makes SOX5 dosage rather than the deleted interval the operative
      variable.
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "7/16 have intragenic deletions of SOX5 and 9/16 have single nucleotide variants (including both truncating and missense variants)."
    explanation: >-
      Quantifies the mutational classes in a contemporary series, and shows that in a
      sequencing-era cohort point variants outnumber deletions.
  downstream:
  - target: Impaired SOX5 DNA Binding and Transactivation
    description: >-
      For the missense class the mechanism is directly demonstrated rather than inferred
      from dose: variants in the high-mobility-group domain abolish both DNA binding and
      transactivation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31578471
      reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The latter variants prevented SOX5 from binding DNA and promoting transactivation
        in vitro, whereas missense variants located outside the high-mobility-group domain
        did not.
      explanation: >-
        Both halves matter. The in-domain variants lose function, and the out-of-domain
        ones do not, which is an internal control that makes the assay interpretable.
- name: Impaired SOX5 DNA Binding and Transactivation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    SOX5 fails to bind its target DNA and to drive transcription. The functional lesion is
    localised to the SOX-specific high-mobility-group domain, which is where the
    disease-associated missense variants cluster.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."

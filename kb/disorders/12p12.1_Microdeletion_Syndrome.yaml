diagnosis:
- name: Chromosomal Microarray
  description: >-
    Detects the 12p12.1 and intragenic deletions, which is how the syndrome was originally
    defined. It will not detect the point variants that make up most of a contemporary
    cohort, nor a balanced translocation.
  evidence:
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "7/16 have intragenic deletions of SOX5 and 9/16 have single nucleotide variants (including both truncating and missense variants)."
    explanation: >-
      Supports the limitation rather than the test: in this series a majority of lesions
      are point variants, which a microarray cannot see. INDIRECT because the inference
      from the mutational split to the test's sensitivity is the curator's.
- name: SOX5 Sequencing
  description: >-
    Detects the truncating and missense variants that a microarray misses, and is what a
    contemporary exome or gene panel does. In practice most diagnoses now arrive through
    broad sequencing rather than through a targeted test.
  evidence:
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 16 SOX5 variants all of which meet American College of Medical Genetics/Association for Clinical Genomic Science ACMG/ACGS criteria class IV or V."
    explanation: >-
      Establishes that the sequence variants reported are classified pathogenic or likely
      pathogenic under a named standard, which is what makes a sequencing result actionable.
discussions:
- discussion_id: entity_is_gene_not_region
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#12p12.1 Microdeletion Syndrome
  - pathophysiology#Loss of One Functional SOX5 Allele
  prompt: >-
    Should this concept be named and modelled as a chromosomal microdeletion syndrome at
    all, given that most reported lesions are not deletions?
  rationale: >-
    MONDO:0017781 names a cytogenetic region and sits under "chromosome 12p deletion". The
    disease it labels is SOX5 haploinsufficiency, and in the most recent series nine of
    sixteen lesions were single nucleotide variants rather than deletions, while two
    reported patients have balanced translocations with no copy-number change at all. A
    region-named class implies that contiguous-gene effects matter, and nothing in the
    literature cited here suggests they do: no second gene in the interval has been
    implicated, and deletion size does not track severity. This entry is therefore curated
    as SOX5 haploinsufficiency with the deletion as one mutational class, and the mismatch
    between that and the MONDO label is recorded rather than papered over. It is an
    upstream question for MONDO whether Lamb-Shaffer syndrome should be the primary class.
  evidence:
  - reference: PMID:29477873
    reference_title: "Clinical and genetic characterization of a patient with SOX5 haploinsufficiency caused by a de novo balanced reciprocal translocation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the present patient has SOX5 haploinsufficiency affecting 2 long forms of SOX5
      and is the second reported case of Lamb-Shaffer syndrome caused by a de novo balanced
      reciprocal translocation.
    explanation: >-
      A patient with the disease and no deletion. This is the single observation that most
      directly undercuts a region-based definition.
- discussion_id: no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of One Functional SOX5 Allele
  - phenotypes#Microcephaly
  prompt: >-
    Why is the clinical severity of SOX5 haploinsufficiency so variable when the molecular
    lesion is uniform, and does the microcephaly signal in point-variant patients survive a
    larger cohort?
  rationale: >-
    A 41-patient study found no clear genotype-phenotype correlation beyond the tolerance
    of out-of-domain missense variants, and severity nonetheless varies widely. Two
    readings are open. If the lesion really is uniform haploinsufficiency, the variability
    must come from modifiers or from the genetic background, and nothing has been done to
    look. Alternatively the lesions are not equivalent, and the later observation that
    point-variant patients tend toward lower growth parameters and microcephaly than
    deletion patients hints at that - which would be counterintuitive, since a whole-gene
    deletion is the more complete loss. That observation is a tendency in sixteen patients
    and needs replication before it is treated as a correlation. Until then this entry
    makes no claim that lesion class predicts severity.
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No clear genotype-phenotype correlations were found, except that missense variants
      outside the high-mobility-group domain were generally better tolerated.
    explanation: >-
      The negative result this gap is built on, stated in the largest available cohort, with
      its one exception.
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations and severity varied among patients."
    explanation: States the variability that the absent correlation fails to explain.
- discussion_id: no_model_system
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Disrupted Neurodevelopmental Transcriptional Program
  prompt: >-
    Which neural cell types and which SOX5 target genes are actually perturbed in this
    disease?
  rationale: >-
    The pathograph in this entry is well supported from the allele down to DNA binding and
    well supported from the clinic up to the phenotypes, and the node in between is marked
    HYPOTHETICAL because nothing joins them. No patient-derived neural model, no
    transcriptomic characterisation, and no animal model of the human lesion is reported in
    the sources cited here. Until one exists, the disease is understood as a dose effect on
    a transcription factor whose relevant targets in the human developing brain are
    unidentified, which is also why there is no treatments section.
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study was aimed at increasing our understanding of LAMSHF, its clinical
      and genetic spectrum, and the pathophysiological mechanisms involved.
    explanation: >-
      The largest study of the disorder states mechanism as an aim, and what it delivered

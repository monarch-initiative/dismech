- name: Disrupted Neurodevelopmental Transcriptional Program
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The downstream transcriptional consequence in the developing nervous system. This node
    is marked HYPOTHETICAL deliberately. It is where the pathograph stops being supported
    by measurement: SOX5's role in neurogenesis is established from developmental biology,
    but nothing cited here characterises the transcriptional program in patient-derived
    neural cells, and no model system for this disorder is reported in these sources. The
    node is the honest name for the gap between a demonstrated molecular lesion and a
    clinical phenotype.

      aracterization of a Spanish LSS cohort of new 20 patients and review all the patients
      published so far which amount for 111 patients.
    explanation: >-
      The largest cumulative count available, from a cohort study that also performed the
      literature review. Quoted from mid-sentence because the cached abstract text begins
      the sentence with a truncated word.
  - reference: PMID:39075495
    reference_title: "Clinical cases series and pathogenesis of Lamb-Shaffer syndrome in China."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

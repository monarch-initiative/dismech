pathophysiology:
- name: Loss of One Functional SOX5 Allele
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous lesion that removes or disables one SOX5 allele. Four mutational classes
    are described and they converge here: microdeletions at 12p12.1, intragenic deletions,
    truncating and missense point variants, and balanced translocations with a breakpoint
    inside the gene. This node, rather than any one of those lesions, is what the entry is
    curated on.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: SOX5
      term:
        id: hgnc:11201
        label: SOX5
    description: >-
      Usually de novo. Parental gonadal mosaicism has been documented in at least one
      family, which matters for counselling: an apparently de novo variant does not
      guarantee a negligible recurrence risk.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microdeletions and truncating variants occurred throughout SOX5."
    explanation: >-
      Establishes that the causal lesions are distributed across the gene rather than
      confined to the deleted region the syndrome is named after.
  - reference: PMID:29477873
    reference_title: "Clinical and genetic characterization of a patient with SOX5 haploinsufficiency caused by a de novo balanced reciprocal translocation."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the present patient has SOX5 haploinsufficiency affecting 2 long forms of SOX5
      and is the second reported case of Lamb-Shaffer syndrome caused by a de novo balanced
      reciprocal translocation.
    explanation: >-
      A patient with no copy-number change at all and the same disease, which is the
      observation that makes SOX5 dosage rather than the deleted interval the operative
      variable.
  - reference: PMID:23220431
    reference_title: "Haploinsufficiency of SOX5, a member of the SOX (SRY-related HMG-box) family of transcription factors is a cause of intellectual disability."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The smallest deletion helps to narrow down the critical region to a genomic segment
      (chr12:23,924,800-24,041,698, build 37/hg19) encompassing only one gene, SOX5.
    explanation: >-
      The strongest single statement that this is a one-gene disease rather than a
      contiguous-gene one. It reaches that conclusion from the deletion side, independently
      of the translocation case, by intersecting deletions of different sizes.
  - reference: PMID:22290657
    reference_title: "Haploinsufficiency of SOX5 at 12p12.1 is associated with developmental delays with prominent language delay, behavior problems, and mild dysmorphic features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report one individual with a reciprocal translocation breakpoint within SOX5, eight
      individuals with intragenic SOX5 deletions (four are apparently de novo and one
      inherited from an affected parent), and seven individuals with larger 12p12 deletions
      encompassing SOX5.
    explanation: >-
      The founding series, and the one that establishes the point directly: three different
      lesion types, one phenotype. It is also where the disorder's eponym comes from.
  - reference: PMID:36861937
    reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "7/16 have intragenic deletions of SOX5 and 9/16 have single nucleotide variants (including both truncating and missense variants)."
    explanation: >-
      Quantifies the mutational classes in one contemporary series. Read alongside the
      next item rather than alone: the larger cumulative count gives a roughly even split,
      so this series' majority of point variants should not be generalised.
  - reference: PMID:37702321
    reference_title: "Lamb-Shaffer syndrome: 20 Spanish patients and literature review expands the view of neurodevelopmental disorders caused by SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-three variants have been reported so far, single nucleotide variants (SNV) and
      copy number variants represent 47% and 53%, respectively, from the total of variants
      reported.
    explanation: >-
      The better-powered mutational-class split, over 83 variants rather than 16. It points
      the opposite way from the 16-patient series and is the figure this entry relies on.
      Note that it does not weaken the lump/split decision, which rests on the critical
      region and the translocation rather than on a headcount.
  downstream:
  - target: Impaired SOX5 DNA Binding and Transactivation
    description: >-
      For the missense class the mechanism is directly demonstrated rather than inferred
      from dose: variants in the high-mobility-group domain abolish both DNA binding and
      transactivation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31578471
      reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The latter variants prevented SOX5 from binding DNA and promoting transactivation
        in vitro, whereas missense variants located outside the high-mobility-group domain
        did not.
      explanation: >-
        Both halves matter. The in-domain variants lose function, and the out-of-domain
        ones do not, which is an internal control that makes the assay interpretable.
- name: Impaired SOX5 DNA Binding and Transactivation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    SOX5 fails to bind its target DNA and to drive transcription. The functional lesion is
    localised to the SOX-specific high-mobility-group domain, which is where the
    disease-associated missense variants cluster.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, most missense variants clustered in the pivotal SOX-specific high-mobility-group domain."
    explanation: >-
      The clustering is what links the structural domain to disease causation in patients,
      independently of the in vitro assay.
  downstream:
  - target: Disrupted Neurodevelopmental Transcriptional Program
    description: >-
      SOX5 regulates cell fate and differentiation during neurogenesis; halving its
      effective activity perturbs that program.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31578471
      reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Lamb-Shaffer syndrome (LAMSHF) is a neurodevelopmental disorder described in just
        over two dozen patients with heterozygous genetic alterations involving SOX5, a gene
        encoding a transcription factor regulating cell fate and differentiation in
        neurogenesis and other discrete developmental processes.
      explanation: >-
        States SOX5's normal role in neurogenesis. INDIRECT: the step from "regulates cell
        fate in neurogenesis" to "its partial loss disrupts the program in these patients"
        is an inference, and no source cited here measures the transcriptional program in
        patient neural tissue.
- name: Disrupted Neurodevelopmental Transcriptional Program
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The downstream transcriptional consequence in the developing nervous system. Mouse
    genetics gives this node real content rather than leaving it a placeholder: losing SOX5
    causes the three principal sequentially born corticofugal neuron subtypes to overlap in
    identity, because SOX5 normally prevents later-born subtypes from appearing early. So
    the program SOX5 controls is a temporal one, and the defect is mistiming of subtype
    generation rather than failure of neurogenesis as such.

    The node is PROVISIONAL rather than ESTABLISHED for a specific reason, not as a hedge.
    The mouse result comes from a homozygous null, and the human lesion is a heterozygous
    dosage reduction; whether halving SOX5 mistimes the same programme is not shown. Nor has
    the transcriptional programme been characterised in any patient-derived neural material.
    Those are two different gaps and the second is recorded separately.
  biological_processes:
  - preferred_term: central nervous system development
    modifier: DECREASED
    term:
      id: GO:0007417
      label: central nervous system development
  evidence:
  - reference: PMID:31578471
    reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Lamb-Shaffer syndrome (LAMSHF) is a neurodevelopmental disorder described in just
      over two dozen patients with heterozygous genetic alterations involving SOX5, a gene
      encoding a transcription factor regulating cell fate and differentiation in
      neurogenesis and other discrete developmental processes.
    explanation: >-
      States SOX5's normal role in neurogenesis in the human-genetics literature.
  - reference: PMID:18215621
    reference_title: "SOX5 controls the sequential generation of distinct corticofugal neuron subtypes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that the transcription factor SOX5 controls the sequential generation of
      distinct corticofugal neuron subtypes by preventing premature emergence of normally
      later-born corticofugal neurons.
    explanation: >-
      Identifies what the disrupted programme actually is: temporal control of corticofugal
      subtype generation. INDIRECT because the experiment is a mouse homozygous null and the
      human disease is a heterozygous dosage lesion, so the step to this node in humans is
      an inference across both species and zygosity.
  downstream:
  - target: Global Developmental Delay
    description: The clinical expression of the disrupted program.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31578471
      reference_title: "Widening of the genetic and clinical spectrum of Lamb-Shaffer syndrome, a neurodevelopmental disorder due to SOX5 haploinsufficiency."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This study extends the clinical and genetic spectrum associated with LAMSHF and
        consolidates evidence that SOX5 haploinsufficiency leads to variable degrees of
        intellectual disability, language delay, and other clinical features.
      explanation: >-
        States the gene-to-phenotype relationship. The intermediates between the
        transcriptional lesion and the clinical delay are not established, which the edge
        type records.
  - target: Delayed Speech and Language Development
    description: >-
      Speech delay is disproportionately prominent relative to the general developmental
      delay, which is the feature clinicians use to recognise the syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36861937
      reference_title: "SOX5: Lamb-Shaffer syndrome-A case series further expanding the phenotypic spectrum."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        As expected, the most common findings include global developmental delay with
        prominent speech delay, mild to moderate intellectual disability, behavioral
        abnormalities and sometimes subtle characteristic facial features.
      explanation: >-
        Names speech delay as prominent within the general delay, in a series assembled
        specifically to corroborate the phenotype.

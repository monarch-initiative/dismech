notes: >-
  Lump/split decision: DISEASE. MONDO:0017781 names one entity with one conserved
  pathograph, and the stub is retired accordingly. Its MONDO parent, chromosome 12p
  deletion (MONDO:0022174), is itself an uncurated open stub, so nothing here duplicates an
  existing entry.

  The entry is curated as SOX5 haploinsufficiency rather than as a copy-number lesion,
  and that is the substantive decision. Deletions at 12p12.1 are how the syndrome was
  found and gave it its name, but intragenic deletions, truncating and missense point
  variants and balanced translocations all produce the same disease, and in the most
  recent series point variants outnumber deletions. The root pathophysiology node is
  therefore "Loss of One Functional SOX5 Allele" and the deletion is one route to it. The
  mismatch between that model and the region-based MONDO label is recorded as its own
  knowledge gap rather than resolved here, since it is an upstream question.

  Lamb-Shaffer syndrome is carried as a synonym rather than as a separate concept. The
  literature uses the two names for one disease and has done since the deletions and the
  point variants were recognised as equivalent.

  One evidence-metadata limitation worth naming, because it shapes how this entry should
  be read. Almost every clinical statement here comes from a cohort, and the cohorts differ
  by an order of magnitude in size and by ascertainment route - 41 patients collected
  through GeneMatcher, 16 through a national database, a single translocation case report.
  dismech's EvidenceItem records the paper and the study type but not the sample size, so
  a reader cannot tell a 41-patient finding from a 1-patient one without opening the
  reference. This entry compensates by choosing snippets that carry their own denominators
  where such a sentence exists, which is why several quotes here include counts that a
  tidier summary sentence would have dropped.

  No treatments section. Management is developmental and educational support, which no
  source cited here states for this disorder specifically, and no disease-modifying therapy
  exists. Recording a supportive-care row on general principles would assert clinical
  content the cited literature does not carry.

  The deep-research report generated for this entry is committed alongside it under
  research/. Unlike the report for the KIDAR entry in the same run, it is on-target: it
  names SOX5 throughout and identifies Lamb-Shaffer syndrome correctly. Reference selection
  and every snippet here were nonetheless taken from the fetched reference cache rather
  than from the report.

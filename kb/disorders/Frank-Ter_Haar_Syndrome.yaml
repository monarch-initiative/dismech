name: Frank-Ter Haar Syndrome
creation_date: "2026-09-04T02:08:02Z"
category: Mendelian
synonyms:
- Ter Haar syndrome
- FTHS
- Borrone dermatocardioskeletal syndrome
- megalocornea, multiple skeletal anomalies, and developmental delay
description: >-
  Frank-Ter Haar syndrome is a rare autosomal recessive connective-tissue and
  skeletal dysplasia caused by biallelic loss-of-function variants in SH3PXD2B,
  which encodes the SRC-substrate podosome adaptor protein TKS4. Affected
  children present with a distinctive craniofacial appearance (brachycephaly,
  prominent forehead, hypertelorism, wide/late-closing fontanelles, full cheeks,
  small chin), ophthalmologic anomalies (megalocornea, prominent eyes, increased
  intraocular pressure and congenital glaucoma), skeletal anomalies (bowing of
  the long bones, camptodactyly, joint contractures) and congenital
  cardiovascular malformations. TKS4 is a scaffold required for podosome
  formation and growth-factor-driven, MT1-MMP-dependent extracellular-matrix
  degradation; its loss impairs podosome-mediated matrix remodeling, and the
  resulting matrix accumulation is hypothesized to underlie the connective-tissue,
  skeletal, craniofacial and ocular phenotype. Only ~40 patients have been
  reported, and roughly half of clinically diagnosed families carry an SH3PXD2B
  mutation, indicating genetic heterogeneity. Borrone dermato-cardio-skeletal
  syndrome is allelic with FTHS (also SH3PXD2B loss of function) and is curated
  here as part of the same phenotypic spectrum in a single entry.

- name: Molecular genetic testing of SH3PXD2B
  description: >-
    Identification of biallelic (homozygous or compound-heterozygous)
    loss-of-function SH3PXD2B variants by gene or exome sequencing confirms the
    diagnosis in a proband with suggestive findings. Because FTHS is genetically
    heterogeneous, an SH3PXD2B-negative result does not exclude the clinical
    diagnosis - roughly half of clinically diagnosed FTHS/Borrone families carry
    no detectable SH3PXD2B mutation - so molecular testing distinguishes the
    SH3PXD2B-positive cases from the SH3PXD2B-negative end of the same
    phenotypic spectrum.
  diagnosis_term:
    preferred_term: SH3PXD2B gene/exome sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Biallelic loss-of-function SH3PXD2B variant
  evidence:
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis was confirmed by the identification of a previously known homozygous mutation c.969delG, p.(Arg324Glyfs*19) in SH3PXD2B."
    explanation: >-
      Molecular identification of the biallelic SH3PXD2B variant confirmed the
      diagnosis in a clinically suspected patient.
  - reference: PMID:31809395
    reference_title: "A Rare Case Report of Frank Ter Haar Syndrome in a Sibling Pair Presenting With Congenital Glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic clinical features with the underlying genetic defects confirmed the diagnosis of FTHS."
    explanation: >-
      States that molecular confirmation of the SH3PXD2B defect together with
      the clinical features established the FTHS diagnosis.
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No SH3PXD2B mutations were detected in six other FTHS families, demonstrating the genetic heterogeneity of this condition."
    explanation: >-
      Documents that an SH3PXD2B-negative result does not exclude FTHS, the
      caveat that shapes interpretation of molecular testing.
  - reference: PMID:24105366
    reference_title: "Mutations in SH3PXD2B cause Borrone dermato-cardio-skeletal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping and sequence analysis in a second published BDCS family (BDCS2) excluded SH3PXD2B."
    explanation: >-
      Shows sequencing separating an SH3PXD2B-negative family from the
      SH3PXD2B-positive cases within the same FTHS/Borrone spectrum.

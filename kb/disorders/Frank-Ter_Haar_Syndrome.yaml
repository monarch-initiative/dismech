  - reference: PMID:31809395
    reference_title: "A Rare Case Report of Frank Ter Haar Syndrome in a Sibling Pair Presenting With Congenital Glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis and treatment of congenital glaucoma preserved vision in the children."
    explanation: >-
      Supports early ophthalmologic detection and treatment of the congenital

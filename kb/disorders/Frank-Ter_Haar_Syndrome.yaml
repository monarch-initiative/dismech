    reference_title: "A Rare Case Report of Frank Ter Haar Syndrome in a Sibling Pair Presenting With Congenital Glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trabeculotomy combined with trabeculectomy was performed in both siblings to control intraocular pressure."
    explanation: Reports the surgical glaucoma management used in FTHS siblings.
  - reference: PMID:31809395

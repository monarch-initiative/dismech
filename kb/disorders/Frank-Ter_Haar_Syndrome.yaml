prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Forty patients reported with a clinical diagnosis as of 2020, of whom only
    20 had an identified mutation. The gap between the two counts reflects the
    genetic heterogeneity recorded in the genetic block, not incomplete testing
    alone -- SH3PXD2B accounted for only 7 of 13 families in the founding study.
  evidence:
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 40 patients have been reported in the literature with a clinical diagnosis of FTHS, only 20 patients having identified mutations."
    explanation: >-
      Gives the total reported case count and the molecularly confirmed subset,
      establishing the ultra-rare band.
diagnosis:
- name: Molecular confirmation by SH3PXD2B sequencing
  description: >-
    Clinical suspicion from the craniofacial, ocular, skeletal and cardiac
    features is confirmed by identifying biallelic SH3PXD2B variants. Because
    SH3PXD2B accounts for only part of clinically diagnosed FTHS, a negative
    result does not exclude the diagnosis, and exome sequencing has been used to
    reach it in suspected cases.
  evidence:
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis was confirmed by the identification of a previously known homozygous mutation c.969delG, p.(Arg324Glyfs*19) in SH3PXD2B."
    explanation: >-
      Documents molecular confirmation as the diagnostic step in a reported
      patient.
  - reference: PMID:28694206
    reference_title: "Identification of two novel SH3PXD2B gene mutations in Frank-Ter Haar syndrome by exome sequencing: Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "exome sequencing is a powerful and a cost-effective tool for the diagnosis of a supposed genetically heterogeneous disorder such FTHS"
    explanation: >-
      Supports exome sequencing as the practical diagnostic route given the
      genetic heterogeneity of the syndrome.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    There is no therapy directed at the underlying podosome defect. The
    pathogenesis of the defective collagen remodelling disorders is
    incompletely understood and therapeutic options are correspondingly limited,
    so management is supportive and organised around the affected systems. This
    entry claims no target_mechanisms link because no reported intervention acts
    on the mechanism.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33234702
    reference_title: "The novel zebrafish model pretzel demonstrates a central role for SH3PXD2B in defective collagen remodelling and fibrosis in Frank-Ter Haar syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogenesis of DECORS is still incompletely understood and, as a result, therapeutic options are limited."
    explanation: >-
      States directly that therapeutic options for this disease group are
      limited, which is the basis for supportive-only management.
- name: Glaucoma and Intraocular Pressure Management
  description: >-
    Treatment of the raised intraocular pressure that accompanies the ocular
    phenotype. The entry records this as frequently unsatisfactory rather than
    curative: in the severe reported case the glaucoma was refractory and
    buphthalmos progressed despite treatment, which is consistent with the
    proposed matrix-accumulation mechanism continuing to operate.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which might explain the coarsening of the facial features and the severe refractory glaucoma"
    explanation: >-
      Records the glaucoma as refractory, establishing the limits of ocular
      pressure management in this disease.

genetic:
- name: SH3PXD2B loss of function
  gene_term:
    preferred_term: SH3PXD2B
    term:
      id: hgnc:29242
      label: SH3PXD2B
  relationship_type: CAUSATIVE
  notes: >-
    Homozygous or compound heterozygous loss-of-function variants and deletions
    at 5q35.1. Genetic heterogeneity is established: only 7 of 13 FTHS families
    in the founding study carried SH3PXD2B mutations, and one mutation-negative
    individual still had reduced TKS4 protein in dermal fibroblasts, implying a
    shared final mechanism reachable by other genetic routes. A proportion of
    Borrone dermato-cardio-skeletal syndrome is allelic with FTHS, though a third
    published BDCS family was excluded from this locus.
  evidence:
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis revealed five different homozygous mutations in SH3PXD2B in seven FTHS families."
    explanation: >-
      Establishes the causative allelic spectrum across multiple families.
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No SH3PXD2B mutations were detected in six other FTHS families, demonstrating the genetic heterogeneity of this condition."
    explanation: >-
      Documents that SH3PXD2B does not account for all clinically diagnosed FTHS,
      an important limit on the gene-disease claim.
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dermal fibroblasts from one of the individuals without an SH3PXD2B mutation nevertheless expressed lower levels of the TKS4 protein, suggesting a common mechanism underlying disease causation"
    explanation: >-
      Supports a shared TKS4-deficient final mechanism even in mutation-negative
      patients, which is why the pathograph is keyed on TKS4 loss rather than on
      the genotype.
  - reference: PMID:24105366
    reference_title: "Mutations in SH3PXD2B cause Borrone dermato-cardio-skeletal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FTHS and BDCS share some overlapping clinical features; therefore, our results demonstrate that a proportion of BDCS and FTHS cases are allelic."
    explanation: >-
      Establishes the allelic relationship with Borrone syndrome, justifying its
      treatment as a synonym for the SH3PXD2B-mutant subset.
animal_models:
- name: Tks4-null mouse
  species: Mouse
  genotype: Tks4 (Sh3pxd2b) null
  publication: PMID:20137777
  description: >-
    Mice lacking Tks4 develop skeletal, eye and cardiac abnormalities,
    phenocopying most of the human syndrome. This is the model that established
    the gene-disease relationship as causal rather than positional.
  modeled_mechanisms:
  - target: Skeletal and Craniofacial Malformation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces the three-organ-system malformation phenotype of the human
      disease from the orthologous gene knockout.
    limitations: >-
      Phenocopies the majority, not all, of the human defects; the report does
      not claim complete reproduction of the phenotype.
    evidence:
    - reference: PMID:20137777
      reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking Tks4 also showed pronounced skeletal, eye, and cardiac abnormalities and phenocopied the majority of the defects associated with FTHS."
      explanation: >-
        Reports the knockout phenotype and the extent of its correspondence to
        the human disease.
- name: pretzel zebrafish (sh3pxd2b mutant)
  species: Zebrafish
  genotype: sh3pxd2b mutant (pretzel)
  publication: PMID:33234702
  description: >-
    A sh3pxd2b mutant zebrafish that develops dermal and musculoskeletal fibrosis
    with contraction-driven deformity, isolating the fibrotic arm of the disease
    with comparatively mild skeletal change.
  modeled_mechanisms:
  - target: Fibrotic Soft-Tissue Change
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the dermal and musculoskeletal fibrosis and contractures, but
      only mild skeletal abnormalities, so it models one arm of the disease
      rather than the whole.
    limitations: >-
      The authors note that the discrepancy between the sh3pxd2b and mmp14a/b
      zebrafish mutants implies the spatiotemporal dependence of ECM remodelling
      on these genes differs between fish and humans, so the division of labour
      seen in this model may not transfer. Skeletal involvement, prominent in
      human disease, is relatively mild here.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        In zebrafish, ECM remodelling depends on sh3pxd2b and mmp14a/b with a
        different spatiotemporal division than in humans, which is the authors'
        own explanation for why this mutant is fibrosis-dominant while the
        mmp14a/b mutant is bone-dominant.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The skeletal dysplasia that defines the human syndrome is effectively
        outside what this model represents: skeletal abnormalities in pretzel are
        relatively mild, so bone phenotypes cannot be read off it and the
        sibling mmp14a/b mutant carries that arm instead.
    evidence:
    - reference: PMID:33234702
      reference_title: "The novel zebrafish model pretzel demonstrates a central role for SH3PXD2B in defective collagen remodelling and fibrosis in Frank-Ter Haar syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition to relatively mild skeletal abnormalities, pretzel mutants develop dermal and musculoskeletal fibrosis"
      explanation: >-
        Reports the model's fibrotic phenotype and the mildness of its skeletal
        involvement, supporting both the link and its limitation.
    - reference: PMID:33234702
      reference_title: "The novel zebrafish model pretzel demonstrates a central role for SH3PXD2B in defective collagen remodelling and fibrosis in Frank-Ter Haar syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The discrepancy in phenotypes between mmp14a/b and sh3pxd2b mutants suggests that in fish, as opposed to humans, there are differences in spatiotemporal dependence of ECM remodelling on either sh3pxd2b or mmp14a/b"
      explanation: >-
        The authors' own statement of the species divergence recorded in the
        divergences block.

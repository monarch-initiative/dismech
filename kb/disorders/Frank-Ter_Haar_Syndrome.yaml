- name: Skeletal and Craniofacial Malformation
  biological_scale: ORGANISM
  description: >-
    Failure of matrix remodelling during development produces the skeletal
    dysplasia and craniofacial phenotype: coarse facies, hypertelorism, wide
    anterior fontanelle, brachydactyly and vertebral abnormalities including
    scoliosis. Cardiac malformation arises in the same developmental window and
    is reproduced in the Tks4-null mouse.
  evidence:
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frank-Ter Haar syndrome (FTHS), also known as Ter Haar syndrome, is an autosomal-recessive disorder characterized by skeletal, cardiovascular, and eye abnormalities"
    explanation: >-
      Defines the three-system malformation phenotype produced by the mechanism.
  downstream:
  - target: Camptodactyly
    causal_link_type: DIRECT
  - target: Coarse Facial Features
    causal_link_type: DIRECT
  - target: Hypertelorism
    causal_link_type: DIRECT
  - target: Wide Anterior Fontanelle
    causal_link_type: DIRECT
  - target: Scoliosis
    causal_link_type: DIRECT
  - target: Ventricular Septal Defect
    causal_link_type: DIRECT
- name: Fibrotic Soft-Tissue Change
  biological_scale: TISSUE
  description: >-
    Beyond malformation, retained matrix drives dermal and musculoskeletal
    fibrosis with joint contractures. The zebrafish sh3pxd2b mutant isolates this
    arm particularly clearly, developing dermal and musculoskeletal fibrosis
    whose contraction produces gross deformity, with comparatively mild skeletal
    change.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:33234702
    reference_title: "The novel zebrafish model pretzel demonstrates a central role for SH3PXD2B in defective collagen remodelling and fibrosis in Frank-Ter Haar syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "which is characterised by craniofacial abnormalities, skeletal malformations and fibrotic soft tissues changes including dermal fibrosis and joint contractures"
    explanation: >-
      Records dermal fibrosis and joint contractures as part of the human
      phenotype, not only the model phenotype.
  downstream:
  - target: Joint Contractures
    causal_link_type: DIRECT

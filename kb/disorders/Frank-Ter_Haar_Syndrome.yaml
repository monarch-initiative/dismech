name: Frank-Ter Haar Syndrome
creation_date: "2026-09-04T03:30:00Z"
category: Genetic
description: >-
  Frank-Ter Haar syndrome is a rare autosomal recessive skeletal dysplasia caused
  by biallelic loss-of-function variants in SH3PXD2B, which encodes the adaptor
  protein TKS4. TKS4 is required for functional podosomes — actin-rich membrane
  protrusions that couple pericellular proteolysis to cell migration — and its
  loss leaves podosome formation incomplete and prevents recruitment of the
  membrane-tethered protease MT1-MMP to those structures. The consequence is a
  cell that can no longer degrade and remodel extracellular matrix at its own
  surface, which places the disease in the defective collagen remodelling
  spectrum alongside the MMP14-related multicentric osteolytic syndromes.
  Clinically it presents with craniofacial dysmorphism, megalocornea with
  frequently severe glaucoma, brachydactyly and other skeletal malformations,
  congenital heart defects, and fibrotic soft-tissue change with joint
  contractures. Severity varies widely, from survival into adulthood to lethal
  respiratory failure in infancy, and the same variant has produced both.
disease_term:
  preferred_term: Frank-Ter Haar syndrome
  term:
    id: MONDO:0009579
    label: Frank-Ter Haar syndrome
synonyms:
- FTHS
- Ter Haar syndrome
- Borrone dermato-cardio-skeletal syndrome
- megalocornea, multiple skeletal anomalies, and developmental delay
parents:
- Defective Collagen Remodelling Spectrum
notes: >-
  Two synonyms carried on the stub need different treatment, and conflating them
  would corrupt the entry.

  "Borrone dermato-cardio-skeletal syndrome" is a genuine synonym for the
  SH3PXD2B-mutant cases. Linkage and sequencing in two BDCS kindreds found
  homozygous SH3PXD2B mutations with complete loss of protein, establishing that
  a proportion of BDCS and FTHS are allelic. Its case reports are usable here.
  Note the qualifier "a proportion": a third published BDCS family was excluded
  from the locus, so BDCS is not wholly the same entity.

  "Melnick-Needles syndrome, autosomal recessive" is a historical misattribution
  and must NOT be treated as a synonym for evidence purposes. Melnick-Needles
  syndrome is X-linked and caused by FLNA variants; it is a different disease
  with a different gene and inheritance. Do not import its literature.

  Genetic heterogeneity is real and should not be smoothed over: SH3PXD2B
  mutations were found in only 7 of 13 FTHS families in the founding study.
  One mutation-negative individual nevertheless had reduced TKS4 protein in
  dermal fibroblasts, which suggests a shared final mechanism reached by more
  than one genetic route.

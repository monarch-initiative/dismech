pathophysiology:
- name: TKS4 Adaptor Loss of Function
  biological_scale: MOLECULAR
  description: >-
    SH3PXD2B encodes TKS4, a phox homology (PX) and SH3 domain-containing adaptor
    protein and Src substrate. Homozygosity mapping across FTHS families
    localised the disease to 5q35.1, and a homozygous deletion in one family
    mapped exactly to the smallest region of overlapping homozygosity, which
    contains SH3PXD2B alone. Patient fibroblasts from Borrone-phenotype families
    show complete loss of the protein on western blot, confirming that the
    molecular lesion is absence of functional TKS4.
  gene:
    preferred_term: SH3PXD2B
    term:
      id: hgnc:29242
      label: SH3PXD2B
  evidence:
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For one family, a homozygous deletion mapped exactly to the smallest region of overlapping homozygosity, which contains a single gene, SH3PXD2B."
    explanation: >-
      Positional evidence isolating SH3PXD2B as the single gene in the critical
      interval.
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This gene encodes the TKS4 protein, a phox homology (PX) and Src homology 3 (SH3) domain-containing adaptor protein and Src substrate."
    explanation: >-
      Identifies the gene product and its adaptor/Src-substrate nature, the
      molecular entity lost in this disease.
  - reference: PMID:24105366
    reference_title: "Mutations in SH3PXD2B cause Borrone dermato-cardio-skeletal syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analysis of patient fibroblasts derived from affected individuals in both families demonstrated complete loss of SH3PXD2B."
    explanation: >-
      Direct protein-level demonstration that the causative variants abolish
      TKS4, establishing loss of function.
  downstream:
  - target: Incomplete Podosome Formation and Failed MT1-MMP Recruitment
    causal_link_type: DIRECT
- name: Incomplete Podosome Formation and Failed MT1-MMP Recruitment
  biological_scale: CELLULAR
  description: >-
    TKS4 is required for podosomes and invadopodia, actin-rich membrane
    protrusions that coordinate pericellular proteolysis with cell migration.
    Fibroblasts lacking Tks4 form only incomplete podosomes, and crucially fail
    to recruit membrane type-1 matrix metalloproteinase (MT1-MMP) to them. The
    rescue experiments locate the defect precisely: reintroducing Tks4 restores
    both podosome formation and matrix degradation, whereas overexpressing the
    related Tks5 restores podosome formation only. TKS4 therefore carries a
    non-redundant role in the proteolytic arm specifically, which is the step
    that fails in this disease.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cellular_components:
  - preferred_term: podosome
    term:
      id: GO:0002102
      label: podosome
    modifier: DECREASED
  evidence:
  - reference: PMID:19144821
    reference_title: "The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that lack of Tks4 resulted in incomplete podosome formation and inhibited ECM degradation."
    explanation: >-
      Directly demonstrates that TKS4 loss impairs podosome formation and matrix
      degradation.
  - reference: PMID:19144821
    reference_title: "The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, in the absence of Tks4, membrane type-1 matrix metalloproteinase (MT1-MMP) was not recruited to the incomplete podosomes."
    explanation: >-
      Identifies failed MT1-MMP recruitment as the specific molecular
      consequence, linking this disease to the MMP14/collagen-remodelling axis.
  - reference: PMID:19144821
    reference_title: "The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both phenotypes were rescued by reintroduction of Tks4, whereas only podosome formation, but not ECM degradation, was rescued by overexpression of Tks5."
    explanation: >-
      The differential rescue establishes that TKS4's role in matrix degradation
      is non-redundant with TKS5, explaining why its loss alone causes disease.
  downstream:
  - target: Defective Pericellular Matrix Remodelling
    causal_link_type: DIRECT
- name: Defective Pericellular Matrix Remodelling
  biological_scale: TISSUE
  description: >-
    Without podosome-localised proteolysis, cells cannot degrade and remodel the
    extracellular matrix immediately around them. Extracellular matrix therefore
    accumulates rather than turning over, which is the proposed explanation for
    the progressive coarsening of facial features and for glaucoma refractory to
    treatment. This places FTHS within the defective collagen remodelling
    spectrum, whose other members carry MMP14 lesions — the protease that TKS4
    fails to deliver.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: DECREASED
  - preferred_term: cell migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: DECREASED
  evidence:
  - reference: PMID:33234702
    reference_title: "The novel zebrafish model pretzel demonstrates a central role for SH3PXD2B in defective collagen remodelling and fibrosis in Frank-Ter Haar syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SH3PXD2B encodes an adaptor protein with the same name, which is required for full functionality of podosomes, specialised membrane structures involved in extracellular matrix (ECM) remodelling."
    explanation: >-
      States the ECM-remodelling role of podosomes that is lost in this disease.
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we hypothesize that the alteration of podosomes function could lead to a reduction of the extracellular matrix degradation and accumulation of the latter in the extracellular space, which might explain the coarsening of the facial features and the severe refractory glaucoma"
    explanation: >-
      Proposes matrix accumulation as the link from the podosome defect to two
      specific clinical features. Explicitly a hypothesis, and recorded as such.
    directness: INDIRECT
  downstream:

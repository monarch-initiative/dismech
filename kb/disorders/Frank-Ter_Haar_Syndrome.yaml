- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function variants in SH3PXD2B; parental consanguinity is
    frequently reported.
  evidence:
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frank-Ter Haar syndrome (FTHS), also known as Ter Haar syndrome, is an autosomal-recessive disorder characterized by skeletal, cardiovascular, and eye abnormalities"
    explanation: States the autosomal recessive inheritance of FTHS.
genetic:
- name: SH3PXD2B
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SH3PXD2B
    term:
      id: hgnc:29242
      label: SH3PXD2B
  notes: >-
    SH3PXD2B (5q35.1) encodes TKS4, an SRC-substrate podosome adaptor. Reported
    disease alleles are homozygous or compound-heterozygous truncating and
    splice variants predicting loss of function. FTHS is genetically
    heterogeneous: SH3PXD2B mutations account for roughly half of clinically
    diagnosed families. Borrone dermato-cardio-skeletal syndrome is allelic and
    also results from SH3PXD2B loss of function.
  evidence:
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This gene encodes the TKS4 protein, a phox homology (PX) and Src homology 3 (SH3) domain-containing adaptor protein and Src substrate."
    explanation: Identifies SH3PXD2B/TKS4 as the causative gene and its protein product.
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No SH3PXD2B mutations were detected in six other FTHS families, demonstrating the genetic heterogeneity of this condition."
    explanation: Documents genetic heterogeneity - not all FTHS families carry SH3PXD2B mutations.
  - reference: PMID:24105366
    reference_title: "Mutations in SH3PXD2B cause Borrone dermato-cardio-skeletal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FTHS and BDCS share some overlapping clinical features; therefore, our results demonstrate that a proportion of BDCS and FTHS cases are allelic."
    explanation: Establishes that Borrone dermato-cardio-skeletal syndrome is allelic with FTHS at SH3PXD2B.

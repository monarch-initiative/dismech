    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis and treatment of congenital glaucoma preserved vision in the children."
    explanation: Supports early glaucoma treatment as vision-preserving in FTHS.
- name: Multidisciplinary Supportive Care

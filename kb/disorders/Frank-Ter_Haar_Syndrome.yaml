pathophysiology:
- name: Biallelic SH3PXD2B Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in SH3PXD2B abolish production of
    functional TKS4 (SH3 and PX domain-containing protein 2B), a phox-homology
    and SH3-domain-containing SRC-substrate adaptor protein.
  genes:
  - preferred_term: SH3PXD2B
    term:
      id: hgnc:29242
      label: SH3PXD2B
  genetic_context:
    gene:
      preferred_term: SH3PXD2B
      term:
        id: hgnc:29242
        label: SH3PXD2B
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:20137777
    reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis revealed five different homozygous mutations in SH3PXD2B in seven FTHS families."
    explanation: >-
      Establishes biallelic SH3PXD2B mutation as the molecular cause in FTHS
      families.
  - reference: PMID:24105366
    reference_title: "Mutations in SH3PXD2B cause Borrone dermato-cardio-skeletal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot analysis of patient fibroblasts derived from affected individuals in both families demonstrated complete loss of SH3PXD2B."
    explanation: >-
      Confirms that the disease alleles result in complete loss of the SH3PXD2B
      protein (loss of function).
  downstream:
  - target: Defective Podosome Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19144821
      reference_title: "The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that lack of Tks4 resulted in incomplete podosome formation and inhibited ECM degradation."
      explanation: >-
        Loss of TKS4 in fibroblasts directly impairs podosome formation, linking
        SH3PXD2B loss to the podosome defect.
- name: Defective Podosome Formation
  biological_scale: CELLULAR
  description: >-
    TKS4 is a scaffold that localizes to podosomes/invadopodia, actin-rich
    matrix-contacting adhesion structures. Loss of TKS4 yields incomplete,
    non-functional podosomes.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: podosome assembly
    modifier: DECREASED
    term:
      id: GO:0071800
      label: podosome assembly
  evidence:
  - reference: PMID:19144821
    reference_title: "The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In Src-transformed fibroblasts, Tks4 is tyrosine phosphorylated and predominantly localized to rosettes of podosomes."
    explanation: >-
      Localizes TKS4 to podosomes, identifying it as a podosome component whose
      loss disrupts these structures.
  downstream:
  - target: Impaired Extracellular Matrix Degradation and Remodeling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19144821
      reference_title: "The novel adaptor protein Tks4 (SH3PXD2B) is required for functional podosome formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, in the absence of Tks4, membrane type-1 matrix metalloproteinase (MT1-MMP) was not recruited to the incomplete podosomes."
      explanation: >-
        Defective podosomes fail to recruit MT1-MMP, mechanistically linking the
        podosome defect to impaired matrix degradation.
- name: Impaired Extracellular Matrix Degradation and Remodeling
  biological_scale: TISSUE
  description: >-
    Podosomes mediate localized, growth-factor-driven, MT1-MMP-dependent
    degradation of the extracellular matrix. Defective podosomes impair matrix
    degradation; the accumulating, poorly remodeled matrix is proposed to drive
    the connective-tissue phenotype.
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: DECREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  evidence:
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "we hypothesize that the alteration of podosomes function could lead to a reduction of the extracellular matrix degradation and accumulation of the latter in the extracellular space, which might explain the coarsening of the facial features and the severe refractory glaucoma."
    explanation: >-
      Clinical review proposes reduced ECM degradation with matrix accumulation
      as the mechanism connecting podosome dysfunction to the FTHS phenotype;
      framed as a hypothesis, hence INDIRECT.
  downstream:
  - target: Abnormal Connective Tissue and Skeletal Morphogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20137777
      reference_title: "Disruption of the podosome adaptor protein TKS4 (SH3PXD2B) causes the skeletal dysplasia, eye, and cardiac abnormalities of Frank-Ter Haar Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking Tks4 also showed pronounced skeletal, eye, and cardiac abnormalities and phenocopied the majority of the defects associated with FTHS."
      explanation: >-
        Tks4-null mice recapitulate the skeletal, ocular and cardiac defects,
        linking loss of TKS4 function to abnormal morphogenesis; the causal edge
        rests on the mouse model, hence INDIRECT.
- name: Abnormal Connective Tissue and Skeletal Morphogenesis
  biological_scale: ORGANISM
  description: >-
    Disturbed matrix remodeling produces the craniofacial, skeletal, ocular and
    cardiovascular malformations of the disorder.
  evidence:
  - reference: PMID:31978614
    reference_title: "A severe case of Frank-ter Haar syndrome and literature review: Further delineation of the phenotypical spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FTHS is characterized by facial dysmorphism, megalocornea, inconstant glaucoma, variable developmental delay, skeletal and cardiac anomalies."
    explanation: >-
      Summarizes the multisystem malformation phenotype that is the endpoint of
      the mechanism.

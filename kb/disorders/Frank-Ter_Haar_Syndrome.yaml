    Surgical control of intraocular pressure (e.g. trabeculotomy combined with
    trabeculectomy) for the congenital glaucoma of FTHS; early diagnosis and
    treatment can preserve vision.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: glaucoma surgery (trabeculotomy with trabeculectomy)
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:

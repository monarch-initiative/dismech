diagnosis:
- name: Clinical and radiographic recognition of the characteristic phenotype
  description: >-
    The diagnosis is first suspected from the recognizable constellation of
    craniofacial dysmorphism (brachycephaly, prominent forehead, wide fontanels,
    hypertelorism, prominent eyes, full cheeks, small chin) together with the
    ophthalmologic and skeletal signs (megalocornea with or without glaucoma,
    bowing of the long bones, camptodactyly). Radiographic skeletal signs -
    notably a prominent coccyx and cortical bone changes - reinforce clinical
    suspicion; the prominent coccyx and protruding ears are regarded as
    additional diagnostic pointers.
  diagnosis_term:
    preferred_term: clinical and radiographic dysmorphology assessment
    term:
      id: NCIT:C20989
      label: Physical Examination
  presence: Characteristic craniofacial, ocular and skeletal constellation
  evidence:
  - reference: PMID:15523657
    reference_title: "Further delineation of Frank-ter Haar syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main characteristics are brachycephaly, wide fontanels, prominent forehead, hypertelorism, prominent eyes, macrocornea with or without glaucoma, full cheeks, small chin, bowing of the long bones, and flexion deformity of the fingers."
    explanation: >-
      Enumerates the craniofacial, ocular and skeletal constellation that is the
      basis of clinical recognition.
  - reference: PMID:15523657
    reference_title: "Further delineation of Frank-ter Haar syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protruding, simple ears, and prominent coccyx bone can be also regarded as important diagnostic signs."
    explanation: >-
      Identifies the prominent coccyx and protruding ears as additional
      recognized diagnostic signs.
- name: Ophthalmologic evaluation for megalocornea and congenital glaucoma
  description: >-
    Congenital glaucoma with megalocornea is frequently an early presenting
    feature, so ophthalmologic examination with intraocular-pressure measurement
    is an important early diagnostic and management step; early detection and
    treatment of the glaucoma can preserve vision.
  diagnosis_term:

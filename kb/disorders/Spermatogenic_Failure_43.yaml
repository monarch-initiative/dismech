inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected men carry biallelic SPEF2 variants — homozygous in consanguineous
    families and compound heterozygous in outbred ones — with heterozygous
    parents. The reported alleles are truncating (nonsense, frameshift), splice
    or deleterious missense, and are absent or extremely rare in population
    databases.
  evidence:
  - reference: PMID:31048344
    reference_title: "Homozygous mutations in SPEF2 induce multiple morphological abnormalities of the sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two homozygous stop-gain variants (c.910C>T (p.Arg304*) and c.3400delA
      (p.Ile1134Serfs*13)) of the SPEF2 (sperm flagellar 2) gene were identified
      in two unrelated consanguineous families.
    explanation: >-
      Documents homozygous truncating genotypes segregating in consanguineous
      pedigrees.
  - reference: PMID:31151990
    reference_title: "Loss-of-function mutations in SPEF2 cause multiple morphological abnormalities of the sperm flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By screening gene variants in 42 patients with MMAF using whole exome
      sequencing, we identified the c. 12delC, c. 1745-2A > G, c. 4102 G > T and
      c. 4323dupA mutations in the SPEF2 gene from two patients.
    explanation: >-
      Documents the compound heterozygous allele combinations in the founding
      cohort, showing the disorder also occurs outside consanguineous families.
  - reference: CGGV:assertion_e137eed5-fcd8-4497-a6dc-6651062d1cf3-2025-01-09T170000.000Z
    reference_title: "SPEF2 / primary ciliary dyskinesia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SPEF2 | HGNC:26293 | primary ciliary dyskinesia | MONDO:0016575 | AR | Definitive | SOP11 | Motile Ciliopathy Gene Curation Expert Panel | 2025-01-09T17:00:00.000Z"
    explanation: >-
      ClinGen's Motile Ciliopathy expert panel records autosomal recessive
      inheritance for biallelic SPEF2 disease. Note the disease entity on that
      record is primary ciliary dyskinesia, not spermatogenic failure 43 — the
      reason is curated in the open discussion on this entry.
pathophysiology:
- name: SPEF2 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic loss-of-function variants remove or truncate SPEF2, a component of
    the C1b projection of the ciliary and flagellar central pair apparatus. The
    variants reported in affected men fall in the long, testis-expressed SPEF2
    transcripts that encode the IFT20-binding domain, and patient spermatozoa
    show markedly reduced or absent SPEF2 protein on western blot and
    immunofluorescence.
  genes:
  - preferred_term: SPEF2
    term:
      id: hgnc:26293
      label: SPEF2
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Germline biallelic nonsense, frameshift, canonical-splice and deleterious
      missense variants, absent or extremely rare in population databases.
  cellular_components:
  - preferred_term: axoneme
    term:
      id: GO:0005930
      label: axoneme
  evidence:
  - reference: PMID:31151990
    reference_title: "Loss-of-function mutations in SPEF2 cause multiple morphological abnormalities of the sperm flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SPEF2 protein level was significantly decreased in the spermatozoa of
      the patients revealed by Western blot (WB) and immunofluorescence (IF)
      analyses.
    explanation: >-
      Demonstrates that the variants produce loss of SPEF2 protein in the
      affected cell, rather than only a predicted consequence.
  - reference: PMID:31048344
    reference_title: "Homozygous mutations in SPEF2 induce multiple morphological abnormalities of the sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these variants affected the long SPEF2 transcripts that are expressed
      in the testis and encode the IFT20 (intraflagellar transport 20) binding
      domain, important for sperm tail development.
    explanation: >-
      Localises the reported alleles to the testis-expressed transcripts carrying
      the IFT20-binding domain, which is what connects the lesion to the transport
      step downstream.
  - reference: PMID:31278745
    reference_title: "Biallelic mutations in Sperm flagellum 2 cause human multiple morphological abnormalities of the sperm flagella (MMAF) phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The expression of truncated SPEF2 protein was reduced significantly in the
      patient's spermatozoa.
    explanation: >-
      Independent replication of reduced SPEF2 protein in patient spermatozoa.
  downstream:
  - target: Impaired Manchette and Intraflagellar Cargo Transport
    causal_link_type: DIRECT
    description: >-
      SPEF2 is the linker; losing it is what removes the transport function.
- name: Impaired Manchette and Intraflagellar Cargo Transport
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    SPEF2 binds the intraflagellar transport protein IFT20 and cytoplasmic
    dynein 1, and localises to the Golgi complex, manchette and basal body of
    differentiating spermatids. In the male-germ-cell-specific Spef2 knockout
    mouse, IFT20 transport from the Golgi to the manchette is delayed and the
    manchette fails to migrate, so SPEF2 acts as a cargo linker for
    dynein-1-mediated transport along the microtubule tracks that build the
    tail. The human evidence for this step is the IFT20 and RSPH9 binding shown
    in a heterologous assay plus the transcript localisation of the patient
    alleles; the transport defect itself has been demonstrated in mouse rather
    than in human spermatids, which is why this node is marked PROVISIONAL
    rather than ESTABLISHED.
  cell_types:
  - preferred_term: spermatid
    term:
      id: CL:0000018
      label: spermatid
  biological_processes:
  - preferred_term: intraciliary transport
    modifier: DECREASED
    term:
      id: GO:0042073
      label: intraciliary transport
  cellular_components:
  - preferred_term: sperm flagellum
    term:
      id: GO:0036126
      label: sperm flagellum
  evidence:
  - reference: PMID:19889948
    reference_title: "Expression of SPEF2 during mouse spermatogenesis and identification of IFT20 as an interacting protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Using yeast two-hybrid assay and coimmunoprecipitation experiments, we
      identified an interaction between SPEF2 and the intraflagellar transport
      protein IFT20 in the testis.
    explanation: >-
      Establishes the SPEF2-IFT20 interaction in testis, the molecular basis of
      the transport role. Indirect because the experiment is in mouse testis.
  - reference: PMID:28619825
    reference_title: "SPEF2 functions in microtubule-mediated transport in elongating spermatids to ensure proper male germ cell differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Furthermore, the transport of a known SPEF2-binding protein, IFT20, from
      the Golgi complex to the manchette was delayed in the absence of SPEF2.
    explanation: >-
      The direct functional demonstration that losing SPEF2 delays cargo
      transport. Indirect because it is a mouse germ-cell conditional knockout.
  - reference: PMID:28619825
    reference_title: "SPEF2 functions in microtubule-mediated transport in elongating spermatids to ensure proper male germ cell differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We identified cytoplasmic dynein 1 and GOLGA3 as novel interaction partners
      for SPEF2.
    explanation: >-
      Identifies the motor SPEF2 links cargo to, which is why the node is
      described as a transport-linker failure rather than a structural one.
  - reference: PMID:34755699
    reference_title: "Sperm flagellar 2 (SPEF2) is essential for sperm flagellar assembly in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Furthermore, we showed that SPEF2 interacts with radial spoke head
      component 9 (RSPH9) and IFT20 in vitro, which are well-studied components
      of radial spokes or intra-flagellar transport and are essential for
      flagellar assembly.
    explanation: >-
      Confirms the IFT20 interaction for the human protein. Indirect because the
      co-immunoprecipitation was performed in transfected HEK293T cells, not in
      spermatids.
  downstream:
  - target: Sperm Flagellar Central Pair Apparatus Failure
    causal_link_type: DIRECT
    description: >-
      Cargo that is not delivered to the growing tail cannot be built into the
      axoneme.
- name: Sperm Flagellar Central Pair Apparatus Failure
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The sperm axoneme is assembled without its central pair. Transmission
    electron microscopy of patient spermatozoa shows a 9+0 rather than the
    normal 9+2 configuration and disorganised accessory structures, and
    immunofluorescence shows loss of SPEF2 itself together with other central
    pair and axonemal proteins, including the MMAF-associated CFAP69. Sperm
    proteomics from three SPEF2-mutant men found over a thousand differentially
    expressed proteins, so the lesion propagates well beyond the C1b projection.

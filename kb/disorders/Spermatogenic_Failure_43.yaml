    defect; men are ascertained through severe asthenozoospermia or
    asthenoteratozoospermia rather than through azoospermia.
  phenotype_term:
    preferred_term: Reduced sperm motility
    term:
      id: HP:0012207
      label: Reduced sperm motility
  evidence:
  - reference: CGGV:assertion_e137eed5-fcd8-4497-a6dc-6651062d1cf3-2025-01-09T170000.000Z
    reference_title: "SPEF2 / primary ciliary dyskinesia (Definitive)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands diagnosed with spermatogenic failure displayed male infertility
      and reduced sperm motility, often without reported details of respiratory
      examinations, but sometimes in the confirmed absence of respiratory
      features
    explanation: >-
      ClinGen's summary of the reproductive presentation across published SPEF2
      spermatogenic-failure probands records reduced sperm motility.
  - reference: PMID:34755699
    reference_title: "Sperm flagellar 2 (SPEF2) is essential for sperm flagellar assembly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous studies have reported that sperm flagellar 2 (SPEF2) deficiency
      causes severe asthenoteratozoospermia owing to spermiogenesis failure, but
      the underlying molecular mechanism in humans remains unclear.
    explanation: >-
      Asthenoteratozoospermia is by definition reduced motility together with
      abnormal morphology.
genetic:
- name: SPEF2
  gene_term:
    preferred_term: SPEF2
    term:
      id: hgnc:26293
      label: SPEF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: 2 of 42 MMAF probands in the founding cohort; separately 4 of 45 families with severe asthenozoospermia
  notes: >-
    SPEF2 (5p13.2) encodes a component of the C1b projection of the ciliary and
    flagellar central pair apparatus that also links cargo to cytoplasmic dynein
    1 during spermiogenesis. Reported yields are 2 of 42 Han Chinese MMAF
    probands in the founding cohort, 2 of 50 in a second Han Chinese MMAF cohort
    plus one Iranian proband from a separate cohort, and 4 of 45 unrelated
    Chinese families ascertained for severe asthenozoospermia.

    Read those denominators carefully: none of them is SPGF43. They are the
    fraction of MMAF or severe-asthenozoospermia probands in whom SPEF2 was the
    cause, not the prevalence of SPGF43 and not a share of SPGF43 cases —
    SPGF43 is by definition entirely SPEF2, so no per-gene case fraction applies
    here.

    The alleles reported to date are truncating (nonsense and frameshift),
    canonical splice, and deleterious missense, and the ones characterised in
    detail fall in the long testis-expressed transcripts that carry the
    IFT20-binding domain. One report suggests missense alleles may produce
    milder spermatozoal damage than truncating ones, but that observation is
    drawn from a series covering FSIP2 and SPEF2 together and is not
    SPEF2-specific.

    The same gene causes primary ciliary dyskinesia, where ClinGen classifies
    the relationship as Definitive. A SPEF2 genotype found in an infertility
    workup should therefore prompt a respiratory history.
  evidence:
  - reference: PMID:31151990
    reference_title: "Loss-of-function mutations in SPEF2 cause multiple morphological abnormalities of the sperm flagella (MMAF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By screening gene variants in 42 patients with MMAF using whole exome
      sequencing, we identified the c. 12delC, c. 1745-2A > G, c. 4102 G > T and
      c. 4323dupA mutations in the SPEF2 gene from two patients.
    explanation: >-
      Establishes the founding cohort size against which the two probands should
      be read.
  - reference: PMID:31048344
    reference_title: "Homozygous mutations in SPEF2 induce multiple morphological abnormalities of the sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted genetic analyses using whole-exome sequencing in 50 Han
      Chinese probands with MMAF.
    explanation: >-
      The denominator for the second independent cohort.
  - reference: PMID:31942643
    reference_title: "Novel mutations in SPEF2 causing different defects between flagella and cilia bridge: the phenotypic link between MMAF and PCD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four novel biallelic mutations in SPEF2 (8.9%, 4/45) in six
      affected individuals (12.8%, 6/47), while no deleterious biallelic variants
      in SPEF2 were detected in 637 controls
    explanation: >-
      A third independent cohort with an explicit denominator and a control
      series in which no biallelic SPEF2 genotype was found.
  - reference: CGGV:assertion_e137eed5-fcd8-4497-a6dc-6651062d1cf3-2025-01-09T170000.000Z
    reference_title: "SPEF2 / primary ciliary dyskinesia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in SPEF2 had also been previously identified in individuals
      affected with multiple morphologic abnormalities of the flagella
    explanation: >-
      ClinGen's own record of the SPEF2-MMAF relationship, on the gene-disease
      validity curation that classifies SPEF2 as Definitive for the motile
      ciliopathy phenotype.
  - reference: PMID:39753944
    reference_title: "Novel variants of FSIP2 and SPEF2 cause varying degrees of spermatozoa damage in MMAF patients and favorable ART outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our work revealed that missense variations of FSIP2 or SPEF2 might cause a
      milder spermatozoa damage.
    explanation: >-
      Suggests an allele-class effect on severity. The claim is made across FSIP2
      and SPEF2 jointly rather than for SPEF2 alone, which is why the notes on
      this entry state it as a suggestion and not as a SPEF2 genotype-phenotype
      rule.
animal_models:
- name: Spef2 big giant head (bgh) mouse
  species: Mouse
  genotype: Spef2 bgh, homozygous nonsense
  publication: PMID:21715716
  description: >-
    A spontaneous mouse mutant positionally cloned to a nonsense variant in
    Spef2. It is the model that established SPEF2 as a motile-ciliopathy gene,
    and it is informative for this entry in two directions: it reproduces the
    flagellar assembly defect, and it demonstrates that whole-animal loss of
    SPEF2 produces full primary ciliary dyskinesia rather than isolated
    infertility.
  modeled_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous males are infertile with shortened flagella and disorganised
      axonemal and accessory structures in elongating spermatids and mature
      sperm, matching the human flagellar phenotype.
    limitations: >-
      A nonsense allele in mouse is not equivalent to the compound heterozygous
      and missense genotypes reported in men, and the mouse also has
      hydrocephalus and sinusitis, which are not part of the curated human
      reproductive phenotype.
    readouts:
    - name: Sperm flagellar structure in elongating spermatids and mature sperm
      target: Multiple Morphological Abnormalities of the Sperm Flagella
      direction: ALTERED
      interpretation: >-
        Shortened flagella with disorganised axonemal and accessory structures.
      evidence:
      - reference: PMID:21715716
        reference_title: "Loss of SPEF2 function in mice results in spermatogenesis defects and primary ciliary dyskinesia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Histopathological, immunofluorescence, and electron microscopic
          analyses demonstrate that the male infertility results from shortened
          flagella and disorganized axonemal and accessory structures in
          elongating spermatids and mature sperm.
        explanation: >-
          The histological and ultrastructural measurement behind this readout.
    - name: Elongating spermatid and epididymal sperm number
      target: Multiple Morphological Abnormalities of the Sperm Flagella
      direction: DECREASED
      interpretation: >-
        Fewer elongating spermatids during spermatogenesis and fewer mature sperm
        in the epididymis.
      evidence:
      - reference: PMID:21715716
        reference_title: "Loss of SPEF2 function in mice results in spermatogenesis defects and primary ciliary dyskinesia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, there is a reduced number of elongating spermatids during
          spermatogenesis and mature sperm in the epididymis.
        explanation: >-
          The quantitative germ-cell measurement behind this readout.
    evidence:
    - reference: PMID:21715716
      reference_title: "Loss of SPEF2 function in mice results in spermatogenesis defects and primary ciliary dyskinesia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Through a positional cloning approach, we identified two sequence
        variants in the gene encoding sperm flagellar protein 2 (SPEF2), which
        has been postulated to play an important role in spermatogenesis and
        flagellar assembly.
      explanation: >-
        Establishes that the bgh phenotype is caused by loss of the same gene,
        which is what makes the model informative for this node.
  - target: Male Infertility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous males are infertile, matching the human endpoint. But they are
      infertile as one component of full PCD — hydrocephalus and sinusitis
      alongside — rather than in isolation.
    limitations: >-
      The mouse phenotype is broader than the curated human phenotype. It cannot
      be used to argue that isolated spermatogenic failure is the expected
      consequence of SPEF2 loss; that mismatch is the substance of the open
      phenotypic-boundary discussion on this entry.
    readouts:
    - name: Male fertility
      target: Male Infertility
      direction: DECREASED
      interpretation: >-
        Homozygous males are infertile, alongside hydrocephalus and sinusitis.
      evidence:
      - reference: PMID:21715716
        reference_title: "Loss of SPEF2 function in mice results in spermatogenesis defects and primary ciliary dyskinesia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mice homozygous for the mutation big giant head (bgh) have several
          abnormalities commonly associated with PCD, including hydrocephalus,
          male infertility, and sinusitis.
        explanation: >-
          Documents infertility in the model while making explicit that it occurs
          as part of full PCD.
    evidence:
    - reference: PMID:21715716
      reference_title: "Loss of SPEF2 function in mice results in spermatogenesis defects and primary ciliary dyskinesia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Taken together, the data in this study demonstrate that SPEF2 is required
        for cilia function and identify a new genetic cause of PCD in mice.
      explanation: >-
        The authors' own conclusion, which frames the model as a PCD model rather
        than an isolated-infertility model.
- name: Male germ cell-specific Spef2 conditional knockout mouse
  species: Mouse
  genotype: Spef2 conditional knockout, male germ cell-specific
  publication: PMID:28619825
  description: >-
    A germ-cell-restricted Spef2 knockout, which isolates the spermiogenesis
    phenotype from the hydrocephalus and airway disease of the whole-animal
    mutant. It is the model that demonstrated the transport function of SPEF2.
  modeled_mechanisms:
  - target: Impaired Manchette and Intraflagellar Cargo Transport
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of SPEF2 in male germ cells delays IFT20 transport from the Golgi
      complex to the manchette and causes the manchette to fail to migrate,
      which is the transport failure this node asserts.
    limitations: >-
      The transport measurements are in mouse spermatids; the equivalent
      experiment has not been done in human germ cells, where the evidence is
      limited to protein-protein interaction in a heterologous cell line and to
      the transcript position of the patient alleles. A complete germ-cell
      knockout also does not model the hypomorphic missense alleles seen in some
      men.
    readouts:
    - name: IFT20 transport from Golgi complex to manchette
      target: Impaired Manchette and Intraflagellar Cargo Transport
      direction: DECREASED
      interpretation: >-
        Delivery of the SPEF2 cargo IFT20 to the manchette is delayed when SPEF2
        is absent.
      evidence:
      - reference: PMID:28619825
        reference_title: "SPEF2 functions in microtubule-mediated transport in elongating spermatids to ensure proper male germ cell differentiation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, the transport of a known SPEF2-binding protein, IFT20,
          from the Golgi complex to the manchette was delayed in the absence of
          SPEF2.
        explanation: >-
          The transport measurement behind this readout.
    - name: Manchette migration and basal body number
      target: Impaired Manchette and Intraflagellar Cargo Transport
      direction: ALTERED
      interpretation: >-
        Failure of manchette migration with basal body duplication and abnormal
        spermatid head shape.
      evidence:
      - reference: PMID:28619825
        reference_title: "SPEF2 functions in microtubule-mediated transport in elongating spermatids to ensure proper male germ cell differentiation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition to defects in sperm tail development, we observed a
          duplication of the basal body and failure in manchette migration
          resulting in an abnormal head shape.
        explanation: >-
          The structural measurement behind this readout.
    evidence:
    - reference: PMID:28619825
      reference_title: "SPEF2 functions in microtubule-mediated transport in elongating spermatids to ensure proper male germ cell differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In this study we investigated the function of SPEF2 during
        spermatogenesis using a male germ cell-specific Spef2 knockout mouse
        model.
      explanation: >-
        Establishes the model and its germ-cell restriction, which is what makes
        it informative for the spermiogenesis transport node specifically.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    The primary diagnostic modality, and the only one that establishes the
    diagnosis. Every reported proband was ascertained by whole-exome sequencing
    or a targeted MMAF/PCD panel that includes SPEF2, with biallelic status and
    parental phase confirmed by Sanger sequencing. Splice-aware and
    copy-number-aware analysis matters here, because reported alleles include
    canonical splice variants and the founding pig disease is an intronic
    insertion acting through aberrant splicing. Semen analysis and ultrastructure
    raise the suspicion of a flagellar gene; they do not name it, since MMAF is
    genetically heterogeneous and more than twenty other genes produce the same
    semen picture.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31048344
    reference_title: "Homozygous mutations in SPEF2 induce multiple morphological abnormalities of the sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conducted genetic analyses using whole-exome sequencing in 50 Han
      Chinese probands with MMAF.
    explanation: >-
      Whole-exome sequencing of an MMAF cohort is the route by which these
      probands were identified.
  - reference: PMID:36873931
    reference_title: "Pathogenic gene variants in CCDC39, CCDC40, RSPH1, RSPH9, HYDIN, and SPEF2 cause defects of sperm flagella composition and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we performed genetic testing by next generation sequencing
      techniques, PCD diagnostics including immunofluorescence-, transmission
      electron-, and high-speed video microscopy on sperm flagella and
      andrological work up including semen analyses.
    explanation: >-
      Describes the combined workup in which next-generation sequencing is the
      genetic arm, alongside the sperm immunofluorescence curated below.
- name: Immunofluorescence Staining of SPEF2 in Sperm Flagella
  description: >-
    Immunofluorescence microscopy of ejaculated spermatozoa for SPEF2 and its
    axonemal partners is a practical adjunct to sequencing. It converts an
    uncertain variant into a demonstrated protein defect, which matters here
    because several reported alleles are missense.
  evidence:
  - reference: PMID:36873931
    reference_title: "Pathogenic gene variants in CCDC39, CCDC40, RSPH1, RSPH9, HYDIN, and SPEF2 cause defects of sperm flagella composition and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that immunofluorescence microscopy in sperm cells
      is a valuable tool to identify flagellar defects related to the axonemal
      ruler, radial spoke head and the central pair apparatus, thus aiding the
      diagnosis of male infertility.
    explanation: >-
      States the diagnostic utility of sperm immunofluorescence for central pair
      apparatus defects, the class SPEF2 belongs to.
- name: Caveat - Central Pair Defects Evade the Standard PCD Diagnostic Algorithm
  notes: >-
    Recorded here because it bears directly on this entry's scope rather than on
    its own diagnosis. A man given a SPEF2 spermatogenic-failure diagnosis cannot
    be cleared of airway disease by the usual ciliary tests: in central pair
    defects the ciliary beating abnormality is very subtle, the ciliary
    ultrastructure is normal and situs is normal, so the standard PCD algorithm
    returns normal results. In SPEF2 disease specifically, the respiratory cilia
    of affected men have a normal 9+2 axoneme even while their sperm flagella do
    not. Assessing for PCD therefore rests on respiratory history and on
    immunofluorescence for SPEF2 in respiratory cells, not on electron
    microscopy.
  evidence:
  - reference: PMID:31545650
    reference_title: "SPEF2- and HYDIN-Mutant Cilia Lack the Central Pair-associated Protein SPEF2, Aiding Primary Ciliary Dyskinesia Diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it is difficult to establish a diagnosis in individuals with PCD
      and central pair (CP) defects, and alternative strategies are required
      because of very subtle ciliary beating abnormalities, a normal ciliary
      ultrastructure, and normal situs composition.
    explanation: >-
      Documents that the standard PCD diagnostic modalities read normal in
      central pair defects.
  - reference: PMID:31545650
    reference_title: "SPEF2- and HYDIN-Mutant Cilia Lack the Central Pair-associated Protein SPEF2, Aiding Primary Ciliary Dyskinesia Diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that SPEF2 IF analyses can facilitate the detection of CP
      defects and evaluation of the pathogenicity of HYDIN variants, thus aiding
      the molecular diagnosis of CP defects.
    explanation: >-
      Names the alternative that does work — immunofluorescence for SPEF2 in
      respiratory cells.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI bypasses the motility and morphology defect by injecting a single
    spermatozoon directly into the oocyte. Every man in the largest reported
    SPEF2 series to undergo ICSI achieved a live birth, so a SPEF2 diagnosis
    carries a usable prognostic message and not only an explanatory one. The
    series is three men, so this is a favourable signal rather than a success
    rate.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Male Infertility
    treatment_effect: BYPASSES
    description: >-
      ICSI does not repair the flagellum. It circumvents the requirement for
      sperm propulsion, so it acts on the clinical endpoint rather than on any
      upstream assembly node.
    evidence:
    - reference: PMID:38568462
      reference_title: "Novel SPEF2 variants cause male infertility and likely primary ciliary dyskinesia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients carrying SPEF2 variants underwent one ICSI cycle and
        delivered healthy infants.
      explanation: >-
        Direct evidence that ICSI achieves live birth despite the flagellar
        defect.
  evidence:
  - reference: PMID:39753944
    reference_title: "Novel variants of FSIP2 and SPEF2 cause varying degrees of spermatozoa damage in MMAF patients and favorable ART outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infertility caused by FSIP2 and SPEF2 variants can be mitigated through
      ICSI or even IVF.
    explanation: >-
      A second series reaching the same conclusion. Its quantitative outcome
      rates are pooled across FSIP2 and SPEF2 probands, so only the qualitative
      conclusion is curated here.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence counselling for the couple, cascade carrier
    testing for relatives, and — because the same genotype causes primary
    ciliary dyskinesia — an explicit discussion of respiratory risk for the
    proband and for any biallelic relative of either sex. Once the familial
    alleles are known, preimplantation genetic testing for monogenic disease
    (PGT-M) and prenatal diagnosis become available options alongside the ICSI
    cycle, subject to local regulation and the couple's preferences.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38568462
    reference_title: "Novel SPEF2 variants cause male infertility and likely primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study reported four novel pathogenic variants of SPEF2 in three male
      patients with infertility and PCD/PCD-like phenotypes, which not only
      extend the spectrum of SPEF2 mutations but also provide information for
      genetic counseling and treatment of such conditions.
    explanation: >-
      The authors state genetic counselling as the application of the molecular
      diagnosis, and in the same sentence tie it to the PCD-overlapping
      phenotype.
differential_diagnoses:
- name: SPEF2-related primary ciliary dyskinesia
  disease_term:
    preferred_term: primary ciliary dyskinesia
    term:
      id: MONDO:0016575
      label: primary ciliary dyskinesia
  distinguishing_features:
  - >-
    Chronic upper and lower airway disease — recurrent airway infection,
    bronchitis, rhinosinusitis, bronchiectasis. This is what separates the two
    presentations clinically, and it is not part of the reproductive phenotype
    curated here.
  - >-
    Situs is normal in both, so laterality does not separate them.
  - >-
    Neither does ciliary ultrastructure. Respiratory cilia in SPEF2 disease have
    a normal 9+2 axoneme even in men whose sperm flagella are 9+0, so
    transmission electron microscopy of respiratory cells cannot make the call.
  - >-
    The PCD presentation is not male-restricted: reported SPEF2 PCD patients
    include women, in whom the reproductive phenotype of this entry cannot
    arise at all.
  description: >-
    Not merely a differential but the same gene, and ClinGen classifies the
    SPEF2-PCD relationship as Definitive. The distinction rests on respiratory
    history rather than on any ciliary assay, and the standard PCD diagnostic
    algorithm is known to read normal in central pair defects, so a man
    diagnosed with SPEF2 spermatogenic failure may have unrecognised airway
    disease.
  evidence:
  - reference: PMID:31545650
    reference_title: "SPEF2- and HYDIN-Mutant Cilia Lack the Central Pair-associated Protein SPEF2, Aiding Primary Ciliary Dyskinesia Diagnostics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a mutation of SPEF2 that is causative for PCD with a CP
      defect.
    explanation: >-
      The report that first established SPEF2 as a PCD gene, making this a
      same-gene differential rather than a coincidental one.
  - reference: PMID:36615117
    reference_title: "Novel SPEF2 Variant in a Japanese Patient with Primary Ciliary Dyskinesia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome analysis and identified novel biallelic variants
      of SPEF2 in the homozygous state (c.1860_1861insCT).
    explanation: >-
      A biallelic SPEF2 genotype in a woman with severe progressive PCD, showing
      the PCD presentation occurs in patients for whom the spermatogenic
      phenotype is not applicable.
discussions:
- discussion_id: spgf43_reproductive_versus_pcd_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is SPEF2-related spermatogenic failure a distinct entity from SPEF2-related
    primary ciliary dyskinesia, or is every biallelic SPEF2 man a PCD patient
    whose airway disease was or was not looked for?
  attaches_to:
  - "pathophysiology#SPEF2 Loss of Function"
  - "pathophysiology#Male Infertility"
  rationale: >-
    This is the central nosological question for the entry and it is left open
    deliberately. The evidence points both ways and the two directions are not
    symmetrical in strength.

    Toward one spectrum. In the cohort that took a respiratory history
    systematically, all six biallelic SPEF2 men had PCD-like symptoms —
    recurrent airway infections, bronchitis and rhinosinusitis — and the authors
    explicitly framed their result as bridging MMAF and PCD. That cohort is the
    load-bearing one, because it was ascertained on severe asthenozoospermia
    alone; a later series in which all three men had infertility with PCD or
    likely PCD was ascertained on both features together, so its 3/3 is a
    description of who was recruited rather than an independent frequency. The
    whole-animal bgh mouse has full PCD, not isolated infertility. ClinGen's
    Motile Ciliopathy expert panel applied the Lumping and Splitting criteria
    and lumped all SPEF2 disease into primary ciliary dyskinesia. And the
    standard PCD diagnostic algorithm cannot exclude airway disease in a central
    pair defect, so an infertility proband called PCD-negative on nasal nitric
    oxide, electron microscopy and high-speed videomicroscopy has not really
    been cleared.

    Toward two entities. At least one proband was reported in the confirmed
    absence of respiratory features rather than merely without them being
    looked for. There is also a genuine tissue-level dissociation: in the same
    men, respiratory cilia keep a normal 9+2 axoneme while sperm flagella are
    9+0, which the authors read as SPEF2 having different roles in the two
    tissues. A transcript explanation has been proposed — that alleles hitting
    only the long testis-expressed transcripts give isolated infertility while
    alleles hitting broadly expressed isoforms add airway disease — and it is
    not hand-waving: the naturally occurring immotile short-tail sperm defect of
    Finnish Yorkshire pigs is exactly that, an intronic SPEF2/KPL2 insertion
    whose aberrantly spliced exon is expressed predominantly in testis, giving a
    sperm-restricted disease with cilia elsewhere unaffected. What has not been
    done is testing it against the human genotypes, so it is cited here as a
    plausible and precedented mechanism rather than curated as this disease's
    mechanism.

    What this entry does about it. dismech curates SPGF43 as its own record
    while recording the divergence from ClinGen rather than leaving it implicit.
    MONDO retains both concepts — MONDO:0032898 for SPGF43 and MONDO:0016575 for
    PCD — and dismech entries are keyed to MONDO concepts, so curating SPGF43 is
    not an assertion that ClinGen is wrong about gene-disease validity, which is
    a different question from disease-concept granularity. The same call was made
    for CFAP54 in Spermatogenic_Failure_98, on the same reasoning. If MONDO
    merges the two terms, this entry should be merged with them.
  evidence:
  - reference: PMID:31942643
    reference_title: "Novel mutations in SPEF2 causing different defects between flagella and cilia bridge: the phenotypic link between MMAF and PCD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, all six patients exhibited PCD-like symptoms, including recurrent
      airway infections, bronchitis, and rhinosinusitis.
    explanation: >-
      The strongest evidence for one spectrum: when respiratory history was taken
      systematically in a SPEF2 infertility cohort, every man had airway
      symptoms.
  - reference: PMID:31942643
    reference_title: "Novel mutations in SPEF2 causing different defects between flagella and cilia bridge: the phenotypic link between MMAF and PCD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural analysis revealed normal 9 + 2 axonemes of respiratory
      cilia but consistently abnormal 9 + 0 axoneme or disordered accessory
      structures of sperm flagella, indicating different roles of SPEF2 in sperm
      flagella and respiratory cilia.
    explanation: >-
      Evidence in the other direction, from the same study: the two tissues are
      not affected identically, so the shared genotype does not imply an
      identical lesion.
  - reference: PMID:31942643
    reference_title: "Novel mutations in SPEF2 causing different defects between flagella and cilia bridge: the phenotypic link between MMAF and PCD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent studies have revealed that SPEF2 mutations lead to multiple
      morphological abnormalities of the sperm flagella (MMAF) without primary
      ciliary dyskinesia (PCD) symptoms in males, but PCD phenotype was also
      found in one female individual.
    explanation: >-
      States the position of the field before this study: SPEF2 infertility had
      been reported without PCD symptoms in men, which is the observation the
      study then complicated.
  - reference: CGGV:assertion_e137eed5-fcd8-4497-a6dc-6651062d1cf3-2025-01-09T170000.000Z
    reference_title: "SPEF2 / primary ciliary dyskinesia (Definitive)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Per the recommendations of the ClinGen Lumping & Splitting Working Group,
      the GCEP found consistencies between the mode of inheritance (autosomal
      recessive) and molecular mechanism (biallelic SPEF2 loss-of-function)
      between patients diagnosed with either infertility or primary ciliary
      dyskinesia, while their overlapping phenotypes formed a single spectrum
      that included both infertility and respiratory features.
    explanation: >-
      ClinGen's formal conclusion, which argues against curating SPGF43 as a
      separate entity. Recorded as REFUTE against the split rather than omitted,
      so the divergence stated in the rationale is visible in the evidence and not
      only asserted in prose.
  - reference: CGGV:assertion_e137eed5-fcd8-4497-a6dc-6651062d1cf3-2025-01-09T170000.000Z
    reference_title: "SPEF2 / primary ciliary dyskinesia (Definitive)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands diagnosed with spermatogenic failure displayed male infertility
      and reduced sperm motility, often without reported details of respiratory
      examinations, but sometimes in the confirmed absence of respiratory
      features
    explanation: >-
      Evidence for two entities, and the reason the question is open rather than
      settled: at least one proband had respiratory features confirmed absent
      rather than merely unexamined, though most were simply not examined.
  - reference: PMID:21715716
    reference_title: "Loss of SPEF2 function in mice results in spermatogenesis defects and primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      In contrast to the sperm phenotype, electron microscopy demonstrates that
      mutant respiratory epithelial cilia are ultrastructurally normal, but video
      microscopic analysis shows that their beat frequency is lower than that of
      wild-type cilia.
    explanation: >-
      The mouse reproduces the human tissue dissociation exactly — normal
      respiratory ciliary ultrastructure with a functional beat defect — so the
      dissociation is a property of SPEF2 loss and not an artefact of how the
      human cohorts were examined.
  - reference: PMID:16549801
    reference_title: "An intronic insertion in KPL2 results in aberrant splicing and causes the immotile short-tail sperm defect in the pig."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Further work revealed that the aberrantly spliced exon is expressed
      predominantly in testicular tissue, which explains the tissue-specificity
      of the immotile short-tail sperm defect.
    explanation: >-
      A naturally occurring SPEF2 allele that produces sperm-restricted disease
      through testis-predominant splicing. It does not settle the human
      question, but it shows the transcript explanation is a demonstrated
      mechanism for this gene rather than a speculation. Indirect because it is
      a pig disease.
  - reference: PMID:16549801
    reference_title: "An intronic insertion in KPL2 results in aberrant splicing and causes the immotile short-tail sperm defect in the pig."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      This disease specifically affects the axoneme structure of sperm flagella,
      whereas cilia in other tissues appear unaffected.
    explanation: >-
      States the tissue restriction directly: a SPEF2 genotype that damages the
      sperm flagellum and spares other cilia exists in nature, which is the
      strongest single argument that isolated spermatogenic failure is a real
      presentation of SPEF2 loss and not only an unexamined one.
  proposed_experiments:
  - experiment_id: exp_spgf43_respiratory_phenotyping_of_infertility_probands
    name: Respiratory phenotyping of SPEF2 infertility probands
    description: >-
      Systematically assess reported and newly identified SPEF2 infertility
      probands for airway disease using methods that work in central pair
      defects — structured respiratory history, high-speed video microscopy and
      immunofluorescence for SPEF2 in respiratory cells — rather than the
      standard algorithm, which returns normal nasal nitric oxide and normal
      electron microscopy in this defect class.
  - experiment_id: exp_spgf43_transcript_stratified_genotype_comparison
    name: Transcript-stratified comparison of infertility-only and PCD genotypes
    description: >-
      Test the proposed transcript explanation directly: map every reported SPEF2
      allele onto the long testis-specific and the broadly expressed transcripts,
      and ask whether transcript coverage separates probands with isolated
      infertility from those with airway disease, or whether the genotypes
      overlap.
notes: >-
  Scope, and what this entry deliberately does not claim. This entry curates
  SPGF43 (MONDO:0032898), the male reproductive presentation of biallelic SPEF2
  disease. It does not curate SPEF2-related primary ciliary dyskinesia, and it
  does not list airway phenotypes — recurrent airway infection, bronchitis,
  rhinosinusitis, bronchiectasis — among its `phenotypes`. That is an explicit
  decision, not an oversight, and it is the harder of the two calls available:
  in the one SPEF2 infertility cohort that took a respiratory history
  systematically, every affected man had PCD-like symptoms. Three things decided
  it. The airway mechanism is already curated in
  `Primary_Ciliary_Dyskinesia.yaml`, which carries SPEF2 as an established PCD
  gene, so listing it here would duplicate rather than add. MONDO keys the two
  concepts separately and dismech entries follow MONDO. And
  `Spermatogenic_Failure_98` made the same split for CFAP54, whose situation is
  structurally identical. The co-occurrence is not hidden by the decision: it is
  stated in the description, carried in the differential diagnosis, and the
  boundary itself is an OPEN knowledge gap in the discussions with the evidence
  from both sides attached.

  Cross-reference. `Primary_Ciliary_Dyskinesia.yaml` carries SPEF2 as a PCD gene
  with the ClinGen Definitive assertion and includes it among the central pair
  apparatus genes. Between them the two entries document the range of one gene:
  the airway presentation there, the male reproductive presentation here.

  Why the MMAF node conforms to the ciliopathy module. The sperm flagellum and
  the motile cilium share axonemal architecture, so loss of a central pair
  component impairs beating in both. The conformance to
  `ciliopathy_dysfunction#Motile Cilia Beat Dysfunction` is a claim about shared
  mechanism, not about the patient having airway disease. It is a weaker claim
  for SPEF2 than for a gene that damages both tissues identically, because
  respiratory cilia in SPEF2 disease retain a normal 9+2 ultrastructure while
  sperm flagella do not; what is shared is the beat defect, demonstrated in the
  bgh mouse, rather than the structural lesion.

  Evidence base. Two probands from a 42-proband MMAF cohort, two from a
  50-proband MMAF cohort plus one Iranian proband from a separate cohort, six
  affected men from 45 families ascertained for severe asthenozoospermia, three
  from a later series, and two within a ten-man axonemal-gene cohort. Add sperm
  proteomics from three mutant men, a spontaneous whole-animal mouse mutant, a
  male-germ-cell conditional knockout, and naturally occurring SPEF2 sperm-tail
  defects in pig and cattle. The human series are small and every one of them is
  ascertained through infertility or PCD clinics, so the reported phenotype
  range is bounded by how the probands were found.

  No prevalence record. No prevalence, incidence or carrier-frequency estimate
  exists for SPGF43, and the cohort yields reported in the `genetic` section are
  not substitutes: their denominators are MMAF and severe-asthenozoospermia
  cohorts, not the general population and not SPGF43. A prevalence record is
  omitted rather than filled with a number that would misstate what was
  measured.

  Oligozoospermia is not curated as a phenotype. Sperm concentration is reported
  for only three men (9.3, 10.4 and 21.0 million/mL), and the third of those is
  above the WHO lower reference limit, so the reported values do not support a
  claim that reduced sperm concentration is a feature of this disorder. The
  disorder as reported is one of sperm quality rather than sperm number; men are
  ascertained through severe asthenoteratozoospermia, not through oligozoospermia
  or azoospermia. If a larger series reports concentrations, this should be
  revisited.

  Why the PCD GeneReviews chapter is listed but not mined. PMID:20301301 is the
  authoritative clinical source for the PCD diagnostic algorithm that this
  entry's differential and open discussion both turn on, so it is listed in
  `references:` and tagged GeneReviews for navigability. It is not cited as
  evidence anywhere: the cached record is `content_type: abstract_only` and
  holds only a purpose statement, with no Clinical Characteristics, Diagnosis or
  Management content, so the only quotable text in it is the title — and quoting
  a title as a finding is the anti-pattern the evidence SOP forbids. It also
  does not mention SPEF2.

  Livestock SPEF2 disease is cited but not curated as a model. The Finnish
  Yorkshire pig immotile short-tail sperm defect is a naturally occurring
  SPEF2/KPL2 disease with a sperm-restricted phenotype and a demonstrated
  testis-predominant splicing mechanism, and it is cited in the open discussion
  because it bears directly on the boundary question. It is not entered as an
  `animal_model`, because it is a spontaneous disease of a farmed species rather
  than a model built to represent this disorder, and the two mouse models
  already carry every mechanism link the pathograph needs. A comparable cattle
  SPEF2 sperm defect exists but was not read in its primary sources here and is
  not cited.

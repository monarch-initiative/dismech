name: Spermatogenic failure 43
creation_date: "2026-09-03T00:00:00Z"
description: >-
  Spermatogenic failure 43 is male infertility caused by biallelic variants in
  SPEF2, which encodes sperm flagellar protein 2, a component of the C1b
  projection of the central pair apparatus that also acts as a linker for
  dynein-1-dependent cargo transport along the spermatid manchette. Loss of
  SPEF2 delays delivery of flagellar cargo — IFT20 among it — to the growing
  tail, so the central pair fails to assemble and the sperm flagellum is built
  wrong: patient spermatozoa show multiple morphological abnormalities of the
  sperm flagella (MMAF) with a 9+0 rather than 9+2 axoneme, severely reduced
  motility, and disorganised mitochondrial sheath and accessory structures.
  SPEF2 is not an infertility-only gene. The same biallelic loss of function
  causes primary ciliary dyskinesia, ClinGen classifies the SPEF2-PCD
  relationship as Definitive, and in the one cohort that took a respiratory
  history systematically every SPEF2-biallelic man had PCD-like airway symptoms.
  Whether isolated spermatogenic failure and SPEF2-related PCD are distinct
  entities or one spectrum is unresolved; this entry curates the reproductive
  presentation and records the boundary as an open question rather than assuming
  it. Fertility is achievable: intracytoplasmic sperm injection has produced
  healthy live births using these men's sperm.
category: Mendelian
parents:
- hereditary disease
synonyms:

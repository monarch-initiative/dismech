- name: Multiple Morphological Abnormalities of the Sperm Flagella
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "ciliopathy_dysfunction#Motile Cilia Beat Dysfunction"
  description: >-
    The malformed axoneme yields the MMAF phenotype — absent, short, coiled,
    bent and irregular-calibre tails with severely reduced motility — together
    with mitochondrial-sheath and accessory-structure disorganisation. This is
    the sperm-flagellar instance of the motile-axoneme beat failure that
    produces impaired ciliary beating in the airway, which is why the node
    conforms to the motile-cilia arm of the ciliopathy module. The conformance
    is a claim about shared mechanism, not about the patient having airway
    disease; note also that in SPEF2 disease the two tissues are not affected
    identically, since respiratory cilia of the same men retain a normal 9+2
    ultrastructure while their sperm flagella do not.

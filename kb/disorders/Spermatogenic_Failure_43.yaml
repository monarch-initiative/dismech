    reference_title: "Novel SPEF2 variants cause male infertility and likely primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural analyses of the spermatozoa of the patients revealed the

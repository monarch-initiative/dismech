  - reference: PMID:31048344
    reference_title: "Homozygous mutations in SPEF2 induce multiple morphological abnormalities of the sperm flagella and male infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our further functional studies using immunofluorescence assays showed the

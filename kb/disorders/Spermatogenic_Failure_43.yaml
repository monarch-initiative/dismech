    explanation: >-
      Independent cohort confirming loss of SPEF2 from the sperm flagellum, and
      placing it in a dependency with HYDIN in the central pair apparatus.
  - reference: PMID:34755699
    reference_title: "Sperm flagellar 2 (SPEF2) is essential for sperm flagellar assembly in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 1262 differentially expressed proteins were detected, including
      486 upregulated and 776 downregulated.
    explanation: >-
      Quantifies how far the proteomic disturbance in patient spermatozoa extends

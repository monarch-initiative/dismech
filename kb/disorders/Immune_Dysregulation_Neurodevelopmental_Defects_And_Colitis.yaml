  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "suggesting that defects in these cells may relate more to TGF-β signaling rather than integrin signaling per se"
    explanation: >-
      Normal focal adhesions point to TGF-beta signaling, not adhesion, as the
      main cellular defect.
  downstream:
  - target: Defective Intestinal Immune Tolerance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In mice, TGF-beta activated by alphaVbeta8 on dendritic cells is needed to
      induce colonic regulatory T cells.
  - target: Impaired Microglial Development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Local TGF-beta activation by alphaVbeta8 is required for microglia to
      mature; the itgav knockout zebrafish loses microglia.
  - target: Defective Brain and Retinal Vascular Development
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Glial and neural alphaVbeta8 activates TGF-beta that signals to
      endothelial cells during cerebral and retinal vessel development.
- name: Defective Intestinal Immune Tolerance
  description: >-
    In mice, deleting alphaV from myeloid cells, or alphaVbeta8 from dendritic
    cells, reduces colonic regulatory T cells, increases activated T cells and
    causes severe colitis and autoimmunity. Gut macrophages and dendritic cells
    lacking alphaV also clear apoptotic cells poorly. Patients with ITGAV
    deficiency develop very early onset colitis refractory to medical therapy,
    and itgav knockout zebrafish develop colitis with raised inflammatory
    cytokine expression.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    modifier: DECREASED

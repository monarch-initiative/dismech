name: Immune Dysregulation, Neurodevelopmental Defects, And Colitis
creation_date: "2026-10-22T00:00:00Z"
category: Mendelian
synonyms:
- ITGAV deficiency
disease_term:
  preferred_term: immune dysregulation, neurodevelopmental defects, and colitis
  term:
    id: MONDO:0980702
    label: immune dysregulation, neurodevelopmental defects, and colitis
parents:
- Inborn error of immunity
- Monogenic very early onset inflammatory bowel disease
- Mendelian neurodevelopmental disorder
description: >-
  Immune dysregulation, neurodevelopmental defects, and colitis (OMIM 621375)
  is an ultra-rare autosomal recessive disorder caused by biallelic variants in
  ITGAV, the gene for the integrin alpha-V subunit that pairs with the beta1,
  beta3, beta5, beta6 and beta8 subunits. It was delineated in 2024 in three
  families: two liveborn patients and four fetuses from a third family. The
  reported variants act by loss of function, either through abnormal splicing
  and nonsense-mediated decay or through a missense change that prevents the
  integrin from reaching the cell surface. Partial loss of function produced
  very early onset, treatment-refractory colitis, atopy (atopic dermatitis,
  multiple allergies, raised IgE, eosinophilia, eosinophilic enteropathy),
  chronic infections, developmental delay, visual impairment with exudative
  vitreoretinopathy, seizures, and structural brain abnormalities including
  polymicrogyria, delayed myelination, white matter loss, calcifications and a
  dysplastic corpus callosum. Near-complete loss of function in the third family
  produced severe prenatal brain malformations (Dandy-Walker malformation,
  ventriculomegaly, corpus callosum agenesis) with cleft palate and abdominal
  wall defects. alphaV integrins are the principal activators of latent
  TGF-beta; patient cells and colon showed reduced SMAD3 signaling, and an itgav
  knockout zebrafish reproduced brain hemorrhage, retinal vascular defects, loss
  of microglia and colitis. The atopic and B-cell features may also reflect loss
  of alphaVbeta3-mediated restraint of Toll-like receptor signaling.
notes: >-
  The phenotype rests on six affected individuals from three families in a
  single report (PMID:39526957), so no phenotype frequencies are given. A 2022
  exome study of Arab twins with early onset inflammatory bowel disease
  (PMID:35692981) proposed digenic homozygous ITGAV and FN1 missense variants
  on computational grounds only; it is not counted as a case of this disorder
  here (see the discussion).
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic ITGAV variants: homozygous in the two
    liveborn patients, and compound heterozygous with one allele from each
    parent in the third family.
  evidence:
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified biallelic variants in the gene coding for Integrin alpha V (ITGAV) in three independent families (two patients and four fetuses) that either caused abnormal mRNA and the loss of functional protein or caused mistargeting of the integrin."
    explanation: >-
      Biallelic variants in three independent families establish recessive
      inheritance.
genetic:
- name: ITGAV
  gene_term:
    preferred_term: ITGAV
    term:
      id: hgnc:6150
      label: ITGAV
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Reported alleles (NM_002210): homozygous c.432G>C, which creates a stronger
    cryptic acceptor splice site in exon 4 and a frameshift
    (p.Ala137AsnfsTer1), leaving about 15% of normal mRNA and protein;
    homozygous c.1136A>T (p.Asp379Val), which disrupts a calcium-coordinating
    residue of the beta-propeller and abolishes surface expression of alphaV
    and its partner beta3; and compound heterozygous c.1564_1564+3delAGTA
    (splice donor loss, p.Cys502*) with c.2247-1G>A (exon 23 skipping) in the
    third family, where ITGAV transcripts were nearly undetectable.
  evidence:
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the ITGAV variant created a novel acceptor splice site in exon 4 that was predicted to be stronger than the canonical acceptor site."
    explanation: >-
      The c.432G>C variant in patient 1 acts through aberrant splicing rather
      than through its predicted missense change.
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ITGAV mRNA and Integrin αV protein were reduced to ∼15% of normal levels in patient-derived fibroblasts"
    explanation: >-
      Patient fibroblasts retain only a small fraction of normal alphaV,
      consistent with partial loss of function.
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA sequencing of cDNA from fibroblasts obtained from F3 showed that ITGAV transcripts were nearly undetectable compared with 100 control samples"
    explanation: >-
      The compound heterozygous splice alleles in the third family abolish
      nearly all ITGAV transcript, the near-complete loss of function seen in
      the fetal cases.
pathophysiology:
- name: ITGAV Biallelic Loss of Function
  description: >-
    Biallelic ITGAV variants reduce or abolish functional integrin alphaV,
    either by aberrant splicing with nonsense-mediated decay or by a missense
    change that blocks trafficking of the alphaV heterodimer to the cell
    surface. Every alphaV integrin (alphaVbeta1, beta3, beta5, beta6, beta8) is
    affected because alphaV is their shared subunit. This is the initiating
    lesion.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ITGAV
    modifier: DECREASED
    term:
      id: hgnc:6150
      label: ITGAV
  molecular_functions:
  - preferred_term: transforming growth factor beta binding
    modifier: DECREASED
    term:
      id: GO:0050431
      label: transforming growth factor beta binding
  evidence:
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified biallelic variants in the gene coding for Integrin alpha V (ITGAV) in three independent families (two patients and four fetuses) that either caused abnormal mRNA and the loss of functional protein or caused mistargeting of the integrin."
    explanation: >-
      The reported variants act through loss of alphaV protein or its
      mistargeting.
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the surface expression of Integrin αV and one of its associated β subunits, ITGB3, which are both normally well-expressed in lymphocytes, was virtually undetected in P2 compared with his healthy brother"
    explanation: >-
      The p.Asp379Val variant abolishes surface alphaV and its beta3 partner in
      patient lymphoblastoid cells.
  downstream:
  - target: Impaired Integrin-Mediated Latent TGF-beta Activation
    causal_link_type: DIRECT
    description: >-
      alphaV integrins bind the RGD motif of the latency-associated peptide and
      release or present active TGF-beta; without alphaV this activation step
      fails.
  - target: Loss of alphaVbeta3-Mediated Restraint of TLR Signaling
    causal_link_type: DIRECT
    description: >-
      Loss of alphaVbeta3 removes a brake on Toll-like receptor signaling in B
      cells and plasmacytoid dendritic cells.
- name: Impaired Integrin-Mediated Latent TGF-beta Activation
  description: >-
    TGF-beta is secreted bound to its latency-associated peptide and needs the
    RGD-binding integrins alphaVbeta6 and alphaVbeta8 to become active. In mice,
    abolishing the integrin-binding RGD motif of latent TGF-beta1 reproduces the
    vascular, inflammatory and immune features of TGF-beta1 deficiency even
    though latent TGF-beta1 is made normally. ITGAV deficiency removes both
    activating integrins at once.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:17353357
    reference_title: "Absence of integrin-mediated TGFbeta1 activation in vivo recapitulates the phenotype of TGFbeta1-null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings indicate that RGD-binding integrins are requisite latent TGFbeta1 activators during development and in the immune system."
    explanation: >-
      Establishes that integrin binding is required to activate latent
      TGF-beta1 in vivo during development and in the immune system.
  - reference: PMID:39526957
    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This would suggest a failure to activate TGF-β in culture to then promote TGF-β receptor signaling and SMAD activation in an autocrine fashion."
    explanation: >-
      The authors interpret the reduced SMAD3 activation in patient fibroblasts
      as a failure to activate TGF-beta.
  downstream:
  - target: Reduced SMAD3-Dependent TGF-beta Signaling
    causal_link_type: DIRECT
- name: Reduced SMAD3-Dependent TGF-beta Signaling
  description: >-
    Patient fibroblasts have reduced total and phosphorylated SMAD3 at rest and
    after TGF-beta1 stimulation, and dysregulated expression of TGF-beta and
    SMAD target genes; colon from patient 1 has fewer SMAD3-positive nuclei
    than inflamed control colon. Focal adhesions in patient fibroblasts look
    normal, so the authors place the main defect in TGF-beta signaling rather
    than in integrin adhesion. itgav knockout zebrafish show the same loss of
    smad3 in the gut.
  biological_scale: CELLULAR
  biological_processes:

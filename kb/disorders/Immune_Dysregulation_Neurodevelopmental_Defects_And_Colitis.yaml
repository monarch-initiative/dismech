  evidence:
  - reference: PMID:17694047
    reference_title: "Loss of integrin alpha(v)beta8 on dendritic cells causes autoimmunity and colitis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that dendritic cells lacking alpha(v)beta8 fail to induce regulatory T cells (T(R) cells) in vitro, an effect that depends on TGF-beta activity."
    explanation: >-
      Links alphaVbeta8-dependent TGF-beta activity in dendritic cells to
      regulatory T cell induction.
  - reference: PMID:17895374
    reference_title: "Ulcerative colitis and autoimmunity induced by loss of myeloid alphav integrins."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice lacking immune cell alphav have fewer regulatory T (Treg) cells in the colon and corresponding increases in activated T cells and T cell cytokine production, leading to colitis."
    explanation: >-
      Loss of alphaV in immune cells depletes colonic regulatory T cells and
      causes colitis in mice.
  downstream:
  - target: Very early onset colitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Loss of alphaVbeta3-Mediated Restraint of TLR Signaling
  description: >-
    alphaVbeta3 directs ligated Toll-like receptors to degradative compartments
    in B cells, and alphaV-deficient mouse lymphocytes show increased and
    prolonged TLR signaling, enhanced B cell activation and antibody
    production, and autoimmunity. The authors of the human report suggest this
    TGF-beta-independent function may explain part of the atopy and immune
    dysregulation; it has not been tested in patient cells.

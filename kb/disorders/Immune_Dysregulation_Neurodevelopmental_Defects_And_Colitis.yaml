animal_models:
- name: itgav knockout zebrafish
  species: Zebrafish
  genotype: itgav-/- (CRISPR/Cas9 3-bp deletion in exon 4 with early stop codon)
  publication: PMID:39526957
  description: >-
    About 10% of larvae die before 8 days post fertilization with brain
    hemorrhage; larvae have disrupted intraocular vasculature and fewer
    microglia, and surviving juveniles develop colitis with reduced smad3.
  modeled_mechanisms:
  - target: Impaired Microglial Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Zebrafish carry duplicated beta1 and beta3 integrin genes, and microglia
      were counted only at larval stages.
    evidence:
    - reference: PMID:39526957
      reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we found that the CNS of itgav−/− larvae showed a pronounced reduction of resident microglia"
      explanation: Larval microglia are depleted in the knockout.
  - target: Defective Intestinal Immune Tolerance
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Zebrafish have no colon in the mammalian sense, and the gut phenotype was
      read at a single juvenile age.
    evidence:
    - reference: PMID:39526957
      reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "(Immuno)histological analysis of the intestine of the juvenile itgav−/− zebrafish showed IBD-associated pathology including cryptitis and gross disruption of the normal intestinal architecture"
      explanation: Juvenile knockouts develop IBD-like intestinal pathology.
  - target: Defective Brain and Retinal Vascular Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:39526957
      reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Approximately, 10% of the itgav−/− larvae died before 8 days post fertilization (dpf) and showed brain hemorrhage"
      explanation: Larval brain hemorrhage in the knockout.
- name: Itgav-null mouse
  species: Mouse
  genotype: Itgav-/-
  publication: PMID:9827803
  description: >-
    Loss of all five alphaV integrins; most embryos die at mid-gestation, and
    the 20% born alive have intracerebral and intestinal hemorrhage and cleft
    palate.
  modeled_mechanisms:
  - target: Defective Brain and Retinal Vascular Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Complete germline loss is more severe than the partial loss of function
      in the liveborn patients and resembles the fetal cases more closely.
    evidence:
    - reference: PMID:9827803
      reference_title: "Extensive vasculogenesis, angiogenesis, and organogenesis precede lethality in mice lacking all alpha v integrins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These liveborn alphav-null mice consistently exhibit intracerebral and intestinal hemorrhages and cleft palates."
      explanation: Liveborn alphaV-null mice have intracerebral hemorrhage.
- name: Myeloid Itgav conditional knockout mouse
  species: Mouse
  genotype: Itgav conditional deletion in myeloid cells
  publication: PMID:17895374
  description: >-
    Deletion of alphaV in the immune system, attributable to myeloid cells,
    causes colitis, autoimmunity and cancer, with fewer colonic regulatory T
    cells.
  modeled_mechanisms:
  - target: Defective Intestinal Immune Tolerance
    relationship: RECAPITULATES
    fidelity: HIGH
    evidence:
    - reference: PMID:17895374
      reference_title: "Ulcerative colitis and autoimmunity induced by loss of myeloid alphav integrins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We report that deletion of alphav in the immune system causes severe colitis, autoimmunity, and cancer."
      explanation: Immune-cell alphaV loss causes colitis and autoimmunity.
discussions:
- discussion_id: itgav_atopy_mechanism_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of alphaVbeta3-Mediated Restraint of TLR Signaling
  - phenotypes#Increased circulating IgE concentration
  - phenotypes#Gastrointestinal eosinophilia
  prompt: >-
    Is the atopy of ITGAV deficiency (raised IgE, eosinophilia, allergies,
    atopic dermatitis) caused by failed TGF-beta activation, by loss of
    alphaVbeta3 control of TLR signaling in B cells, or both?
  rationale: >-
    The human report names both routes but tested neither in patient immune
    cells, so the clinical picture alone does not distinguish them.
- discussion_id: itgav_brain_malformation_mechanism_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Polymicrogyria
  - phenotypes#Dandy-Walker malformation
  - phenotypes#Abnormal corpus callosum morphology
  - phenotypes#Microcephaly
  prompt: >-
    Which alphaV-dependent process produces the cortical, posterior fossa and
    callosal malformations of ITGAV deficiency?
  rationale: >-
    The human report links reduced TGF-beta signaling to microglial loss and
    vascular defects, and mouse alphaV loss causes cerebral hemorrhage, but
    neither mechanism has been shown to produce polymicrogyria, Dandy-Walker
    malformation or corpus callosum agenesis. These phenotypes are therefore
    left without a causal edge.
- discussion_id: itgav_fn1_digenic_ibd_status
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#ITGAV
  prompt: >-
    Do homozygous ITGAV missense variants without neurodevelopmental features
    cause isolated early onset inflammatory bowel disease?
  rationale: >-
    One family of Arab twins with early onset IBD was reported with homozygous
    ITGAV and FN1 variants judged deleterious by prediction and modelling only,
    with no functional study of the integrin. It is not clear whether this is a
    milder end of the same disorder, a different entity, or a chance finding.
  evidence:
  - reference: PMID:35692981
    reference_title: "Exome Sequencing Identifies the Extremely Rare ITGAV and FN1 Variants in Early Onset Inflammatory Bowel Disease Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening has identified the digenic autosomal recessive mode of inheritance of ITGAV (G58V) and FN1 (G313V) variants in IBD twins with early onset IBD."
    explanation: >-
      The claim of the 2022 report, made from genetic screening of human twins;
      the pathogenicity of the variants rests on segregation and in silico
      prediction.

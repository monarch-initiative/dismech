      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "(Immuno)histological analysis of the intestine of the juvenile itgav−/− zebrafish showed IBD-associated pathology including cryptitis and gross disruption of the normal intestinal architecture"
      explanation: >-
        Loss of itgav alone is sufficient to cause colitis in zebrafish.
  - target: Gastrointestinal eosinophilia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Microglial Development
  description: >-
    Microglia need locally activated TGF-beta to mature. In mice, deleting the
    alphaVbeta8 integrin from the central nervous system arrests microglia in a
    dysmature state and causes a neurodevelopmental syndrome with
    oligodendrocyte maturation arrest, interneuron loss and spastic neuromotor
    dysfunction. itgav knockout zebrafish lose resident microglia, and the
    authors of the human report propose microglial dysfunction as a contributor
    to the brain disease of ITGAV deficiency.
  biological_scale: CELLULAR
  biological_processes:

- name: Defective Brain and Retinal Vascular Development
  description: >-
    alphaV integrins on glial and neural cells, not on endothelium, are needed
    for cerebral vessels to develop; alphaV-null mice and mice lacking glial
    alphaV have intracerebral hemorrhage. Retinal alphaVbeta8 activates
    TGF-beta that signals to endothelial cells, and its loss disrupts retinal
    vascular plexus formation. itgav knockout zebrafish have brain hemorrhage
    and a disrupted intraocular vasculature; patient 1 had exudative
    vitreoretinopathy.
  biological_scale: TISSUE

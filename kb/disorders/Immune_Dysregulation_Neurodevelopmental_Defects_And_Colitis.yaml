    reference_title: "Human ITGAV variants are associated with immune dysregulation, brain abnormalities, and colitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the P1-derived fibroblasts had reduced total SMAD3, which regulates its own transcription, and reduced phosphorylation of SMAD3 even at rest and also when activated by TGF-β1"
    explanation: >-

name: Cutaneous Melanoma
creation_date: '2026-03-28T21:05:00Z'
description: >-
  Cutaneous melanoma is a malignant tumor of epidermal melanocytes, driven in
  most cases by ultraviolet mutagenesis on a MAPK-pathway backbone of BRAF,
  NRAS, or NF1 alterations. Advanced disease disseminates to distant skin,
  lymph node, lung, liver, bone, and brain sites, with the metastatic
  phenotype shaped by transcriptional plasticity, immune escape through
  PD-1/PD-L1 and related checkpoints, and pronounced brain tropism. The
  driver-defined subsets are curated in depth in the separate
  BRAF_V600_Mutant_Melanoma, NRAS_Mutant_Melanoma, and KIT_Mutant_Melanoma
  entries; this entry carries the shared cutaneous-melanoma biology and the
  metastatic stage.
categories:
- Skin Cancer
- Solid Tumor
parents:
- melanoma
disease_term:
  preferred_term: cutaneous melanoma
  term:
    id: MONDO:0005012
    label: cutaneous melanoma
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005012
      label: cutaneous melanoma
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO provides an exact disease term for cutaneous melanoma. This entry
      was reconstituted from the former Metastatic_Melanoma entry (cancer
      granularity ladder, design decisions §3a): stage is not a taxon, so the
      metastatic view now lives in this entry's Metastatic stage.
classifications:
  icdo_morphology:
    classification_value: Melanoma
    notes: >-
      Derived from this entry's disease term MONDO:0005012 (cutaneous melanoma).
      Its NCIT cross-reference NCIT:C3510 (Cutaneous Melanoma) is a descendant of
      NCIT:C3224 (Melanoma), the term this enum value is bound to. The MONDO
      parent MONDO:0005105 (melanoma) additionally carries the cross-reference
      ICDO:8720/3. Metastatic disease does not change the morphology axis, which
      records the histological type of the primary tumor.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Melanoma is managed as a solid-tumor oncology problem
      (checkpoint blockade, BRAF/MEK-targeted therapy).
has_subtypes:
- name: BRAF V600-mutant
  display_name: BRAF V600-Mutant Melanoma
  description: >-
    Pointer subtype (design decisions section 3a(d)): curated in depth as the
    separate BRAF_V600_Mutant_Melanoma entry, which carries the V600E/K driver
    biology and BRAF/MEK-inhibitor therapy.
- name: NRAS-mutant
  display_name: NRAS-Mutant Melanoma
  description: >-
    Pointer subtype: curated in depth as the separate NRAS_Mutant_Melanoma
    entry.
- name: KIT-mutant
  display_name: KIT-Mutant Melanoma
  description: >-
    Pointer subtype: curated in depth as the separate KIT_Mutant_Melanoma
    entry, which carries its own MONDO term (MONDO:0003865).
stages:
- name: Localized
  description: >-
    Primary cutaneous melanoma without nodal or distant spread, managed with
    wide local excision and sentinel-node assessment; most thin melanomas are
    cured surgically.
- name: Metastatic
  description: >-
    Advanced melanoma with dissemination to distant skin, lymph node, lung,
    liver, bone, and brain sites. Brain tropism is pronounced, and checkpoint
    blockade and BRAF/MEK-targeted therapy are the systemic mainstays.
  notes: >-
    This stage carries the content of the former Metastatic_Melanoma entry
    (cancer granularity ladder, design decisions §3a). Melanoma brain
    metastases affect up to 60% of advanced melanoma cases.
  evidence:
  - reference: PMID:40609368
    reference_title: "Evolving treatment paradigms for melanoma brain metastases: A systematic review of current modalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Melanoma brain metastases (MBM) affect up to 60 % of advanced melanoma cases and are associated with poor prognosis and significant neurologic morbidity.
    explanation: Provides a direct estimate for the burden of brain dissemination in advanced melanoma.
  - reference: PMID:31343665
    reference_title: "Five-Year Survival and Correlates Among Patients With Advanced Melanoma, Renal Cell Carcinoma, or Non-Small Cell Lung Cancer Treated With Nivolumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Overall survival curves showed estimated 5-year rates of 34.2% among patients with melanoma, 27.7% among patients with RCC, and 15.6% among patients with NSCLC.
    explanation: Provides a 5-year survival benchmark for the metastatic stage.

pathophysiology:
- name: MAPK-Driven Metastatic Fitness
  description: >-
    Activating BRAF and NRAS mutations, together with NF1 loss, sustain MAPK signaling
    that promotes proliferation, invasion, therapy resistance, and metastatic competence.
    These drivers remain central even as melanoma cells transition between proliferative
    and invasive transcriptional states.
  evidence:
  - reference: PMID:40023845
    reference_title: "The NF1 tumor suppressor regulates PD-L1 and immune evasion in melanoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Hotspot BRAF, hotspot NRAS, and NF1 loss-of-function mutations are found in approximately 50%, 25%, and 15% of cutaneous melanomas, respectively.
    explanation: This supports the dominant mutational architecture underlying metastatic melanoma biology.
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: PD-L1-Mediated Immune Escape
    description: >-
      NF1 loss within this driver set raises PD-L1 expression, coupling the MAPK
      lesion to checkpoint-mediated escape from cytotoxic T cells.
  - target: Invasive Plasticity and Migration
    description: >-
      Sustained MAPK signalling supports the transition between differentiated and
      invasive transcriptional states that gives melanoma cells metastatic
      competence.
- name: Invasive Plasticity and Migration
  conforms_to: "invasion_and_metastasis#Epithelial-Mesenchymal Transition Activation"
  description: >-
    Melanoma cells toggle between differentiated and invasive states, enabling tissue
    invasion, vascular entry, and colonization of distant organs. This phenotype is
    supported by EMT-like programs even in a non-epithelial lineage and is strongly
    linked
    to brain and visceral dissemination.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  - preferred_term: positive regulation of cell migration
    modifier: INCREASED
    term:
      id: GO:0030335
      label: positive regulation of cell migration
  downstream:
  - target: Brain Metastatic Colonization
    description: >-
      Invasive, migratory melanoma cells traverse the blood-brain barrier and adapt
      to the neural microenvironment, the basis of melanoma's marked neurotropism.
- name: PD-L1-Mediated Immune Escape
  description: >-
    PD-L1 expression and checkpoint signaling permit metastatic melanoma cells to
    evade
    cytotoxic T-cell killing. This immune escape program shapes metastatic site behavior
    and contributes to heterogeneous responses across cerebral and extracerebral lesions.
  evidence:
  - reference: PMID:25788491
    reference_title: "Characterization of PD-L1 Expression and Associated T-cell Infiltrates in Metastatic Melanoma Samples from Variable Anatomic Sites."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Programmed death ligand-1 (PD-L1) tumor expression represents a mechanism of immune escape for melanoma cells.
    explanation: This directly supports PD-L1-mediated immune evasion in metastatic melanoma.
  biological_processes:
  - preferred_term: negative regulation of immune response
    modifier: INCREASED
    term:
      id: GO:0050777
      label: negative regulation of immune response
- name: Brain Metastatic Colonization
  conforms_to: "invasion_and_metastasis#Metastatic Colonization"
  description: >-
    Melanoma has marked neurotropism, and brain metastases arise through blood-brain
    barrier
    traversal, adaptation to the neural microenvironment, and coordination of targeted
    and
    immune resistance programs. Brain lesions are a major cause of neurologic morbidity.
  evidence:
  - reference: PMID:40609368
    reference_title: "Evolving treatment paradigms for melanoma brain metastases: A systematic review of current modalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Melanoma brain metastases (MBM) affect up to 60 % of advanced melanoma cases and are associated with poor prognosis and significant neurologic morbidity.
    explanation: This supports brain tropism as a defining feature of advanced melanoma.
  biological_processes:
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  downstream:
  - target: Angiogenic Support of Distant Lesions
    description: >-
      Established cerebral and visceral deposits require angiogenic remodelling and
      vascular permeability changes to sustain outgrowth.
- name: Angiogenic Support of Distant Lesions
  description: >-
    Melanoma metastases require angiogenic remodeling to sustain outgrowth in visceral
    and
    cerebral sites, with vascular permeability and local neovascularization supporting
    both
    tumor expansion and treatment resistance.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis

experimental_models:
- name: Xmrk-activated melanocytes in three-dimensional dermal collagen
  experimental_model_type: CELL_LINE
  culture_system: Three-dimensional type I collagen gel reconstituting the dermal environment
  publication: PMID:12183442
  description: >-
    Melanocytes carrying the Xiphophorus melanoma receptor tyrosine kinase Xmrk
    are embedded in a three-dimensional collagen I gel, the matrix that normally
    kills melanocytes that leave the epidermis. The assay asks what an activated
    receptor has to supply for a pigment cell to survive in the dermis, which is
    the step a melanoma must take to move from radial to vertical growth.
    Differential display in this system identified osteopontin as the secreted
    factor that permits it, and osteopontin has since become a prognostic marker
    in human melanoma. The system is the in-vitro arm of the Xiphophorus melanoma
    model and is how a fish oncogene was used to name a human invasion mechanism.
  modeled_mechanisms:
  - target: Invasive Plasticity and Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reconstitutes the survival barrier a melanocyte meets on entering the
      dermis, and identifies receptor-driven osteopontin secretion acting through
      integrin alpha-v beta-3 as the autocrine loop that overcomes it.
    limitations: >-
      A three-dimensional gel is not a vascularized dermis and reports survival
      and spreading rather than true invasion, vascular entry, or distant
      colonization, so it covers only the first step of the node. The driving
      receptor is the fish Xmrk oncogene rather than a human melanoma driver,
      and the assay carries no immune or stromal compartment. The responding
      cell is a cultured melanocyte line rather than a human melanocyte in situ,
      so any species difference between that host cell and human melanocytes is
      uncontrolled here and is a second translational gap alongside the fish
      receptor. Treat it as evidence for the osteopontin mechanism, not for
      metastatic competence.
    readouts:
    - name: Melanocyte survival and spreading in collagen I with and without osteopontin
      target: Invasive Plasticity and Migration
      description: >-
        Adhesion, spreading, and apoptosis of melanocytes in three-dimensional
        collagen gels, scored against osteopontin availability in the medium.
      direction: RESTORED
      interpretation: >-
        Osteopontin is sufficient to rescue melanocytes from matrix-induced
        apoptosis and necessary for the receptor-driven rescue, which is what
        identifies it as the effector of dermal survival.
      evidence:
      - reference: PMID:12183442
        reference_title: Autocrine stimulation by osteopontin contributes to antiapoptotic signalling of melanocytes in dermal collagen.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Addition of exogenous OPN allowed melanocytes to adhere, spread, and survive in three-dimensional collagen gels, whereas in the absence of OPN, the cells underwent apoptosis.
        explanation: Reports the add-back experiment that grounds this readout in both directions.
    evidence:
    - reference: PMID:12183442
      reference_title: Autocrine stimulation by osteopontin contributes to antiapoptotic signalling of melanocytes in dermal collagen.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In melanocytes, expression of the secreted adhesion protein OPN was up-regulated by the melanoma-inducing receptor tyrosine kinase Xmrk
      explanation: >-
        Links the fish melanoma oncogene to induction of the secreted factor that
        licenses melanocyte survival in dermal matrix.
    - reference: PMID:38299666
      reference_title: Validity of Xiphophorus fish as models for human disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: the secreted glycoprotein osteopontin was first identified in Xiphophorus melanoma as a key factor for the transition from radial to vertical growth
      explanation: >-
        States that the radial-to-vertical transition factor described by this
        node was first identified through the Xiphophorus system.
  findings:
  - statement: >-
      Osteopontin secreted downstream of Xmrk acts through integrin alpha-v
      beta-3 to sustain melanocytes in dermal collagen, identifying an autocrine
      growth-factor-receptor-to-integrin crosstalk that permits dermal invasion.
    supporting_text: Activation of both receptors triggered survival of melanocytes in three-dimensional dermal collagen gels.

discussions:
- discussion_id: gap_cutaneous_melanoma_primary_tumour_mechanism
  prompt: >-
    What are the primary-tumour mechanisms of cutaneous melanoma - UV mutagenesis,
    melanocyte transformation, and radial-to-vertical growth-phase progression - and
    how do they connect to the metastatic mechanisms this entry already models?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#
  - stages#Localized
  rationale: >-
    This entry was reconstituted from the former Metastatic_Melanoma entry when the
    cancer granularity ladder (design decisions section 3a) established that stage is
    not a taxon and no base cutaneous melanoma entry existed. Every pathophysiology
    node it inherited is metastasis biology, so the Localized stage currently carries
    no mechanism content: UV-induced mutagenesis, melanocyte transformation, nevus
    precursor biology, and the radial-to-vertical growth-phase transition are all
    absent. The UV exposure is recorded in the environmental section but has no
    pathophysiology node to act on. Recording this as an open gap keeps the entry
    honest about what it does and does not yet model, rather than leaving readers to
    infer coverage from the disease-level description.

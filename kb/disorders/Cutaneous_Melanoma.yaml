- accession: ega:EGAS00001002698
  title: Gut microbiome modulates response to anti PD1 immunotherapy in metastatic melanoma patients
  description: There is a growing appreciation of the role of the microbiome in cancer, and evidence in pre-clinical models that the gut microbiome may modulate responses to immune checkpoint blockade though this has not been well-characterized in patients. We analyzed the oral (n=86)and gut (n=43) 16S microbiome in melanoma patients on PD-1 blockade. Significant differences were noted in the diversity and composition of the gut microbiome between responders and non-responders in patients with a fecal microbiome sample, with significantly higher alpha diversity and relative abundance of Ruminococcaceae bacteria) in R.

    causal_link_type: DIRECT
    description: >-
      Reduced EF-Tu activity limits delivery of charged aminoacyl-tRNAs to the
      mitochondrial ribosome, which is the elongation step itself.

- name: Impaired Elongation of Mitochondrial Translation
  biological_scale: MOLECULAR
  description: >-
    Mitochondria run a translation apparatus of their own, separate from the
    cytosolic one, dedicated to the thirteen proteins encoded by mitochondrial
    DNA. EF-Tu is a shared component of that apparatus, not a subunit-specific
    factor, so limiting it throttles synthesis of all thirteen products
    simultaneously rather than any one of them selectively.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: mitochondrial translational elongation
    term:
      id: GO:0070125
      label: mitochondrial translational elongation
    modifier: DECREASED
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:38630895
    reference_title: "A very rare presentation of mitochondrial elongation factor Tu
      deficiency-TUFM mutation and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If it is activated, it delivers the aminoacyl-tRNAs to the mitochondrial
      ribosome."
    explanation: States the specific elongation function that is lost, namely delivery
      of aminoacyl-tRNA to the mitoribosome.
  - reference: PMID:17160893
    reference_title: "Infantile encephalopathy and defective mitochondrial DNA translation
      in patients with mutations of mitochondrial elongation factors EFG1 and EFTu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic investigation involving patients with defective mitochondrial
      translation led us to the discovery of novel mutations in the mitochondrial elongation
      factor G1 (EFG1) in one affected baby and, for the first time, in the mitochondrial
      elongation factor Tu (EFTu) in another one."
    explanation: Places these patients within the class of defective mitochondrial
      translation, which is the phenotype the gene search started from.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      The thirteen mtDNA-encoded subunits are distributed across complexes I,
      III, IV and V, so under-supplying all of them makes those four complexes
      fail together while complex II, built entirely from nuclear-encoded
      subunits, is spared.

- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  description: >-
    Complexes I, III, IV and V each contain at least one mtDNA-encoded subunit
    and cannot be assembled in normal amounts when mitochondrial translation is
    limiting. Complex II contains none and is spared. That pattern - several
    complexes down together with complex II normal - is the diagnostic
    signature that distinguishes a translation defect from a lesion in an
    individual complex, and it is what the "combined" in the disease name
    denotes.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex assembly
    term:
      id: GO:0033108
      label: mitochondrial respiratory chain complex assembly
    modifier: DECREASED
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:30903008
    reference_title: "A novel TUFM homozygous variant in a child with mitochondrial
      cardiomyopathy expands the phenotype of combined oxidative phosphorylation deficiency
      4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to combined oxidative phosphorylation deficiency 4 (COXPD4)
      characterized by severe early-onset lactic acidosis and progressive fatal infantile
      encephalopathy"
    explanation: Names the combined oxidative phosphorylation deficiency that TUFM
      variants produce.
  notes: >-
    The sparing of complex II is stated here from the biochemistry of subunit
    origin, which is standard for this disease class, rather than from a
    complex-by-complex assay reported in a TUFM patient specifically. See the
    corresponding entry under discussions.
  downstream:
  - target: Cellular Energy Failure and Lactate Accumulation
    causal_link_type: DIRECT

- name: Cellular Energy Failure and Lactate Accumulation
  biological_scale: ORGANISM
  description: >-
    With oxidative phosphorylation impaired, cells rely on glycolysis and
    convert the resulting pyruvate to lactate. Lactate accumulates in blood and
    cerebrospinal fluid, producing the severe, early-onset and persistent
    lactic acidosis that is the most consistent laboratory finding in this
    disease and the feature present across every reported phenotypic variant.
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:17160893
    reference_title: "Infantile encephalopathy and defective mitochondrial DNA translation
      in patients with mutations of mitochondrial elongation factors EFG1 and EFTu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients were affected by severe lactic acidosis and rapidly progressive,
      fatal encephalopathy."
    explanation: Reports the severe lactic acidosis in the index patients.
  downstream:
  - target: Progressive Infantile Encephalopathy
    causal_link_type: DIRECT
    description: >-
      The developing brain has a high and inflexible oxidative demand, which is
      why it is the organ most consistently and most severely affected.
  - target: Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cardiac muscle is likewise oxidative-dependent. This branch dominates in
      at least one reported patient and is absent in others, so it is drawn as
      an indirect, variably expressed consequence rather than an obligate one.

- name: Progressive Infantile Encephalopathy
  biological_scale: ORGANISM
  description: >-
    The dominant clinical picture in the classical presentation: rapidly
    progressive, frequently fatal encephalopathy from the neonatal or early
    infantile period, with microcephaly. Neuroimaging in the index EF-Tu
    patient showed severe infantile macrocystic leukodystrophy with
    micropolygyria, and MONDO's description of the disease likewise records
    polymicrogyria with white-matter abnormality - a malformation of cortical
    development alongside the destructive white-matter change, indicating that
    the energy deficit acts during brain formation and not only after it.
  evidence:
  - reference: PMID:17160893
    reference_title: "Infantile encephalopathy and defective mitochondrial DNA translation
      in patients with mutations of mitochondrial elongation factors EFG1 and EFTu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the EFTu-mutant patient had severe infantile macrocystic leukodystrophy
      with micropolygyria"
    explanation: Describes the neuroimaging and neuropathological phenotype of the
      index TUFM patient.
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is characterized by microcephaly, severe early-onset lactic
      acidosis, and progressive, often fatal, infantile encephalopathy."
    explanation: Characterises the core clinical triad of the disease.

- name: Cardiomyopathy
  biological_scale: ORGANISM
  description: >-
    A dilated cardiomyopathy that in at least one patient was the presenting
    and dominant problem, occurring with lactic acidosis but without
    progressive encephalopathy. That case is the basis for including TUFM in
    the differential diagnosis of metabolic cardiomyopathy, and it is the
    clearest evidence that the disease is not obligately neurological.
  evidence:
  - reference: PMID:30903008
    reference_title: "A novel TUFM homozygous variant in a child with mitochondrial
      cardiomyopathy expands the phenotype of combined oxidative phosphorylation deficiency
      4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented here expands the phenotypic features of TUFM-related
      disease, exhibiting lactic acidosis and dilated cardiomyopathy without progressive
      encephalopathy."
    explanation: Reports the cardiomyopathy-predominant presentation that this node
      records.

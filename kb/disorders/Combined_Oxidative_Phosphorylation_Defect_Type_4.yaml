name: Combined Oxidative Phosphorylation Defect Type 4
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Combined oxidative phosphorylation defect type 4
  term:
    id: MONDO:0012534
    label: combined oxidative phosphorylation defect type 4
synonyms:
- COXPD4
- combined oxidative phosphorylation deficiency 4
- TUFM combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in TUFM
description: >-
  Combined oxidative phosphorylation defect type 4 (COXPD4) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in TUFM, which
  encodes mitochondrial elongation factor Tu (EF-Tu). EF-Tu is the GTPase that
  delivers charged aminoacyl-tRNAs to the mitochondrial ribosome, so the lesion
  sits at the elongation step of mitochondrial translation itself rather than
  in any single respiratory-chain subunit.

  The consequence follows directly from where mitochondria draw their proteins.
  Thirteen respiratory-chain subunits are encoded by mitochondrial DNA and made
  by the mitochondrial ribosome; everything else is nuclear-encoded and
  imported. Breaking elongation starves the synthesis of all thirteen at once,
  so complexes I, III, IV and V fail together - the "combined" of the name.
  Complex II is built entirely from nuclear-encoded subunits and is spared,
  which is the biochemical signature that points at translation rather than at
  an individual complex.

  The classical presentation is neonatal or early-infantile: severe lactic
  acidosis, rapidly progressive and often fatal encephalopathy, microcephaly,
  and on neuroimaging polymicrogyria with white-matter abnormality. The
  reported phenotypic range has since widened - one patient presented with
  dilated cardiomyopathy and lactic acidosis without progressive
  encephalopathy, and another with liver dysfunction and optic atrophy against
  only mild encephalopathy - so TUFM belongs in the differential for metabolic
  cardiomyopathy as well as for infantile encephalopathy. Fewer than ten
  patients had been reported at the time of the most recent case series.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients carry biallelic TUFM variants, most often homozygous
    missense substitutions in consanguineous families. No patient with a
    biallelic null genotype has been described, consistent with mitochondrial
    translation being essential.
  evidence:
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only 8 patients with biallelic TUFM variants have been reported."
    explanation: Confirms the biallelic requirement and gives the size of the reported
      cohort.
genetic:
- name: TUFM
  gene_term:
    preferred_term: TUFM
    term:
      id: hgnc:12420
      label: TUFM
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    TUFM encodes mitochondrial elongation factor Tu, a GTPase that binds
    charged aminoacyl-tRNAs and delivers them to the A site of the
    mitochondrial ribosome. It is one of three nuclear-encoded elongation
    factors of the mitochondrial translation apparatus, alongside TSFM (EF-Ts)
    and GFM1 (EF-G1); pathogenic variants in each cause a combined oxidative
    phosphorylation deficiency, and the three were among the first
    nuclear-gene causes of a mitochondrial translation defect to be identified.
    Reported TUFM alleles are missense, so residual elongation capacity is
    retained.
  variants:
  - name: "TUFM c.1016G>A (p.Arg339Gln)"
    description: >-
      A recurrent allele reported in four separate publications, found in
      patients from Turkey and proposed as a founder mutation in that
      population.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41409307
      reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
        Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Arg339Gln variant was found in all patients from Turkey and is considered
        a potential founder mutation."
      explanation: Establishes recurrence and the proposed founder effect for this
        allele.
  - name: "TUFM c.344A>C (p.His115Pro)"
    description: >-
      Homozygous missense allele in the patient who presented with dilated
      cardiomyopathy and lactic acidosis rather than progressive
      encephalopathy.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30903008
      reference_title: "A novel TUFM homozygous variant in a child with mitochondrial
        cardiomyopathy expands the phenotype of combined oxidative phosphorylation
        deficiency 4."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a patient with an unusual phenotype and a novel homozygous
        missense variant in TUFM (c.344A>C; p.His115Pro), encoding mtDNA translation
        elongating factor Tu (EFTu)."
      explanation: Documents the allele and the cardiomyopathy-predominant presentation
        it produced.
  - name: "TUFM c.1025T>G (p.Val342Gly)"
    description: >-
      Homozygous allele in the only reported adult patient, whose presentation
      was hypertrophic cardiomyopathy, chronic kidney failure and sensorineural
      hearing loss with little neurological involvement.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41866827
      reference_title: "Expanding the Phenotype of TUFM-Related Combined Oxidative
        Phosphorylation Deficiency 4."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our proband has a homozygous TUFM c.1025T>G, p.(Val342Gly) variant."
      explanation: Names the allele carried by the adult proband.
  evidence:
  - reference: PMID:17160893
    reference_title: "Infantile encephalopathy and defective mitochondrial DNA translation
      in patients with mutations of mitochondrial elongation factors EFG1 and EFTu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "novel mutations in the mitochondrial elongation factor G1 (EFG1) in
      one affected baby and, for the first time, in the mitochondrial elongation factor
      Tu (EFTu) in another one"
    explanation: The founding report identifying TUFM/EF-Tu as a human disease gene.
pathophysiology:
- name: Biallelic TUFM Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic missense variants in TUFM reduce the function of mitochondrial
    elongation factor Tu. EF-Tu is a GTPase whose job is to bind charged
    aminoacyl-tRNAs and escort them to the mitochondrial ribosome, so a
    hypomorphic EF-Tu limits the rate at which the ribosome can be supplied
    with substrate. The pathogenicity of the alleles was established
    experimentally by functional complementation rather than inferred from
    conservation alone.
  genetic_context:
    genes:
    - preferred_term: TUFM
      term:
        id: hgnc:12420
        label: TUFM
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline missense variants, including
      the recurrent p.Arg339Gln founder allele and the p.His115Pro allele of
      the cardiomyopathy-predominant patient.

      label: Decreased liver function
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38630895
    reference_title: "A very rare presentation of mitochondrial elongation factor Tu
      deficiency-TUFM mutation and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented here had the phenotypic features of TUFM-related
      disease, lactic acidosis, hypotonia, liver dysfunction, optic atrophy, and mild
      encephalopathy."
    explanation: Reports liver dysfunction in a patient with a confirmed homozygous
      TUFM variant.
animal_models:
- name: Zebrafish tufm-null mutant
  species: Zebrafish
  genotype: tufm-/-
  publication: PMID:38825039
  description: >-
    A zebrafish tufm knockout generated specifically as a COXPD4 model. It
    reproduces the proximal half of the human mechanism directly - impaired
    mitochondrial protein translation and consequent oxidative phosphorylation
    defects - and adds a metabolic readout, suppression of the tricarboxylic
    acid cycle, that has not been measured in patients.
  modeled_mechanisms:
  - target: Impaired Elongation of Mitochondrial Translation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mutant shows compromised mitochondrial protein translation, which is
      the step EF-Tu performs, measured directly rather than inferred.
    limitations: >-
      A full knockout rather than a knock-in of a patient missense allele, so it
      models complete loss of EF-Tu while every reported human genotype is
      missense with residual activity. That difference matters for this disease
      specifically, because allele severity is the candidate explanation for the
      organ selectivity seen in patients. Zebrafish larvae also differ from
      human infants in oxygen delivery and in reliance on glycolysis.
    readouts:
    - name: Mitochondrial protein translation
      target: Impaired Elongation of Mitochondrial Translation
      direction: DECREASED
      interpretation: >-
        Direct measurement of the step the human mechanism asserts is broken.
      evidence:
      - reference: PMID:38825039
        reference_title: "A zebrafish tufm mutant model for the COXPD4 syndrome of aberrant
          mitochondrial function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In this study, we construct a zebrafish tufm-/- mutant that closely
          resembles the COXPD4 syndrome, exhibiting compromised mitochondrial protein
          translation, dysfunctional mitochondria with oxidative phosphorylation defects,
          and significant metabolic suppression of the tricarboxylic acid cycle."
        explanation: Reports impaired mitochondrial protein translation in the mutant.
    evidence:
    - reference: PMID:38825039
      reference_title: "A zebrafish tufm mutant model for the COXPD4 syndrome of aberrant
        mitochondrial function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutations in the TUFM gene are known to cause combined oxidative phosphorylation
        deficiency 4 (COXPD4), a rare mitochondrial disorder characterized by a comprehensive
        quantitative deficiency in mitochondrial respiratory chain (MRC) complexes."
      explanation: States the disease the model was built to represent.
  - target: Combined Respiratory Chain Complex Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mutant shows dysfunctional mitochondria with oxidative phosphorylation
      defects, the cellular consequence this node records.
    limitations: >-
      The source reports an oxidative phosphorylation defect without a
      complex-by-complex breakdown, so the model does not resolve whether
      complex II is spared - which is the open question on the human node.
    readouts:
    - name: Oxidative phosphorylation capacity
      target: Combined Respiratory Chain Complex Deficiency
      direction: DECREASED
      interpretation: >-
        Confirms the translation defect propagates to respiratory function in a
        whole organism.
      evidence:
      - reference: PMID:38825039
        reference_title: "A zebrafish tufm mutant model for the COXPD4 syndrome of aberrant
          mitochondrial function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In this study, we construct a zebrafish tufm-/- mutant that closely
          resembles the COXPD4 syndrome, exhibiting compromised mitochondrial protein
          translation, dysfunctional mitochondria with oxidative phosphorylation defects,
          and significant metabolic suppression of the tricarboxylic acid cycle."
        explanation: Reports the oxidative phosphorylation defect in the mutant.
    evidence:
    - reference: PMID:38825039
      reference_title: "A zebrafish tufm mutant model for the COXPD4 syndrome of aberrant
        mitochondrial function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we construct a zebrafish tufm-/- mutant that closely
        resembles the COXPD4 syndrome, exhibiting compromised mitochondrial protein
        translation, dysfunctional mitochondria with oxidative phosphorylation defects,
        and significant metabolic suppression of the tricarboxylic acid cycle."
      explanation: Supports treating this model as informative for the combined respiratory
        chain defect.
  - target: Combined Respiratory Chain Complex Deficiency
    relationship: RESCUES
    fidelity: LOW
    description: >-
      The same study screened for interventions and put forward probucol as a
      candidate for managing COXPD4. This is the only therapeutic lead reported
      for the disease, and it is entirely preclinical.
    limitations: >-
      The abstract states probucol is a promising approach without reporting
      which readout it corrected or by how much, so the rescue is recorded as a
      claim made by the source rather than a quantified effect, and no readout
      is attached. It is also a rescue in a full knockout, while every reported
      human genotype is missense with residual EF-Tu - so even a real effect
      here would not straightforwardly predict benefit in patients. Fidelity is
      LOW for that reason, and nothing about this link should be read as
      clinical evidence.
    evidence:
    - reference: PMID:38825039
      reference_title: "A zebrafish tufm mutant model for the COXPD4 syndrome of aberrant
        mitochondrial function."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "identify probucol as a promising therapeutic approach for managing
        COXPD4"
      explanation: Reports the therapeutic candidate. Graded partial because the source
        asserts promise without giving the measured outcome behind it.

biochemical:
- name: Blood lactate
  biomarker_term:
    preferred_term: Increased circulating lactate concentration
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  frequency: VERY_FREQUENT
  notes: >-
    Severe, early-onset and persistent, with episodes of metabolic crisis. It
    is the one finding common to every reported presentation of the disease -
    the encephalopathic, the cardiomyopathic and the hepatic - and so is the
    most reliable single pointer toward the diagnosis, though it is entirely
    non-specific among mitochondrial disorders.
  evidence:
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is characterized by microcephaly, severe early-onset lactic
      acidosis, and progressive, often fatal, infantile encephalopathy."
    explanation: Establishes severe early-onset lactic acidosis as a defining laboratory
      feature.
- name: CSF lactate
  biomarker_term:
    preferred_term: Increased CSF lactate
    term:
      id: HP:0002490
      label: Increased CSF lactate
  notes: >-
    Recorded as the expected companion finding to raised blood lactate in a
    mitochondrial translation defect with brain involvement. None of the four
    sources cited in this entry reports a CSF lactate value in a TUFM patient,
    so this marker carries no evidence item; it is listed because a negative
    CSF result would be informative and its absence from the literature is
    itself worth surfacing.

differential_diagnoses:
- name: TSFM-related combined oxidative phosphorylation deficiency
  description: >-
    TSFM encodes mitochondrial elongation factor Ts, the guanine-nucleotide
    exchange factor that recycles EF-Tu between rounds of elongation. Loss of
    either protein breaks the same step, so the biochemical phenotype - a
    combined complex I/III/IV deficiency with spared complex II - and the
    infantile encephalopathy or cardiomyopathy presentation are largely
    indistinguishable at the bedside.
  distinguishing_features:
  - Not separable clinically or by respiratory chain enzymology; the distinction is
    molecular, which is the practical argument for sequencing the whole mitochondrial
    translation apparatus rather than TUFM alone.
  notes: >-
    Left without an evidence item deliberately. None of the sources cited in
    this entry reports a TSFM patient, so the claim that the two are clinically
    indistinguishable rests on the shared biochemistry of the elongation step
    rather than on a comparison anyone has published. A curator with a TSFM
    series should evidence it or correct it.
- name: GFM1-related combined oxidative phosphorylation deficiency
  description: >-
    GFM1 encodes mitochondrial elongation factor G1, which catalyses
    translocation. It was reported in the same 2007 study that first identified
    TUFM, in a patient who presented with early-onset Leigh syndrome rather
    than the macrocystic leukodystrophy seen in the EF-Tu patient.
  distinguishing_features:
  - Neuroimaging may differ, with Leigh-pattern basal ganglia and brainstem lesions
    for GFM1 against macrocystic leukodystrophy with polymicrogyria in the index TUFM
    patient, but this rests on single patients and should not be relied on.
  - The distinction is ultimately molecular.
  evidence:
  - reference: PMID:17160893
    reference_title: "Infantile encephalopathy and defective mitochondrial DNA translation
      in patients with mutations of mitochondrial elongation factors EFG1 and EFTu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The EFG1-mutant patient had early-onset Leigh syndrome, whereas the EFTu-mutant
      patient had severe infantile macrocystic leukodystrophy with micropolygyria."
    explanation: Contrasts the two elongation-factor phenotypes reported side by side
      in the founding study.

diagnosis:
- name: Respiratory chain enzymology showing a combined defect with spared complex II
  description: >-
    Reduced activity of complexes I, III and IV with preserved complex II in
    muscle or fibroblasts points at mitochondrial translation rather than at
    any single complex, and narrows the search to the nuclear genes of the
    mitochondrial translation apparatus. The discriminating value comes from
    complex II being normal, not from the other complexes being low.

    The reduced-I/III/IV half of that pattern is now directly reported: an adult
    proband had reduced activity in complexes I, III and IV on endomyocardial
    biopsy. The complex II *sparing* is still inference from the nuclear origin
    of its subunits rather than a reported measurement, so the two halves of
    this claim do not rest on the same footing. Note also that the informative
    tissue varied - the reported assay was cardiac, not muscle or fibroblast.
  evidence:
  - reference: PMID:41866827
    reference_title: "Expanding the Phenotype of TUFM-Related Combined Oxidative
      Phosphorylation Deficiency 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He has sensorineural hearing loss, hyperlactatemia with mild illness,
      and reduced activity in mitochondrial complexes I, III, and IV on endomyocardial
      biopsy."
    explanation: The first complex-by-complex respiratory chain measurement reported
      in a TUFM patient in the sources cited here.
  - reference: PMID:30903008
    reference_title: "A novel TUFM homozygous variant in a child with mitochondrial
      cardiomyopathy expands the phenotype of combined oxidative phosphorylation deficiency
      4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to combined oxidative phosphorylation deficiency 4 (COXPD4)
      characterized by severe early-onset lactic acidosis and progressive fatal infantile
      encephalopathy"
    explanation: Identifies the disease as a combined oxidative phosphorylation deficiency,
      which is the biochemical pattern this test detects.
- name: Sequencing of TUFM and the mitochondrial translation apparatus
  description: >-
    Definitive diagnosis requires demonstrating biallelic TUFM variants. Because
    the presentation may be a metabolic cardiomyopathy or a hepatopathy rather
    than an encephalopathy, a panel restricted to encephalopathy genes can miss
    it. In patients of Turkish ancestry the recurrent p.Arg339Gln allele is
    worth specific attention.
  evidence:
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed homozygous c.1016G>A (p.Arg339Gln) variant
      in the TUFM gene, which has previously been reported in three other COXPD4 cases."
    explanation: Illustrates molecular confirmation and the recurrence of the founder
      allele.
discussions:
- discussion_id: complex_ii_sparing_not_directly_assayed
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Has the sparing of complex II been measured in TUFM patients specifically,
    or is it inferred from the nuclear origin of its subunits?
  attaches_to:
  - pathophysiology#Combined Respiratory Chain Complex Deficiency
  - diagnosis#Respiratory chain enzymology showing a combined defect with spared complex
    II
  rationale: >-
    Half of this claim is now measured and half is not, and the two should not
    be read as equally supported. Reduced complex I, III and IV activity is
    directly reported on endomyocardial biopsy in an adult proband. Preserved
    complex II is not: no source cited here reports a complex II value in a
    TUFM patient, and the sparing is inferred from the fact that complex II
    contains no mtDNA-encoded subunit. That inference is sound biochemistry and
    is why the disease class is called combined, but it remains an inference.

    It matters because the discriminating value of the test is asserted to come
    from complex II being normal. A curator who finds a series reporting
    complex II activity in TUFM patients should replace the inference with the
    measured values and close this gap.
- discussion_id: organ_selectivity_unexplained
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does the same class of TUFM missense allele produce a fatal
    encephalopathy in some patients and a cardiomyopathy or hepatopathy with
    little brain involvement in others?
  attaches_to:
  - pathophysiology#Cellular Energy Failure
  rationale: >-
    All reported alleles are missense and all patients share severe lactic
    acidosis, so the divergence is not a simple null-versus-hypomorph
    difference in the way it often is for other recessive disorders. The
    recurrent p.Arg339Gln allele has been reported in several patients, which
    should make allele-matched comparison possible, but no study has related
    residual EF-Tu activity to which organ fails. Until that is done, the
    branch from energy failure to cardiomyopathy is drawn as indirect and
    variably expressed, and the entry cannot say what determines the split.
- discussion_id: tufm_moonlighting_role_relevance
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does TUFM's non-translational role in autophagy and innate immunity
    contribute to COXPD4, or is the disease purely a translation defect?
  attaches_to:
  - pathophysiology#Biallelic TUFM Loss of Function
  rationale: >-
    TUFM is reported to interact with the autophagy machinery and with NLRX1,
    and several viruses exploit it to dampen type I interferon responses. If
    those functions are also lost in patients, the disease could have an
    immunological or autophagic component that the pure-translation model does
    not predict.

    No reported COXPD4 patient has been described with an infection phenotype
    or an autophagy defect, and no study has tested whether the patient
    missense alleles affect these interactions as opposed to the translation
    function. The entry therefore models COXPD4 strictly as a translation
    defect. This is recorded so a curator does not later mistake the absence of
    an immunological arm for an oversight; the literature simply has not asked
    the question in this disease.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight patients with biallelic TUFM variants had been reported at the time
    of the most recent case report, which added the ninth. The reported count
    rose from four in 2019 to six in 2024 to eight in 2025, so the literature
    is growing slowly. No population prevalence estimate exists.
  evidence:
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only 8 patients with biallelic TUFM variants have been reported."
    explanation: Gives the reported case count for the disease.
progression:
- phase: Fatal infantile course
  age_range: birth to 12 months
  notes: >-
    In the classical presentation, severe metabolic acidosis and respiratory
    distress begin in the neonatal period, followed by rapidly progressive
    encephalopathy and death in infancy; the most recently reported patient
    died at seven months. This is not universal, and the exceptions are
    substantial: the patient with dilated cardiomyopathy had no progressive
    encephalopathy, and another had only mild encephalopathy.
  evidence:
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case of a female infant with microcephaly who died from
      severe lactic acidosis at 7 months of age."
    explanation: Documents the fatal infantile course in a recent patient.
notes: >-
  Entity identity. MONDO:0012534 is combined oxidative phosphorylation defect
  type 4, cross-referenced to OMIM:610678, and its causal gene is TUFM. The
  numbered COXPD series is keyed to different nuclear genes of mitochondrial
  biogenesis and translation, so the number alone is not informative about
  mechanism; this entry is the EF-Tu one. The sibling factors TSFM (EF-Ts) and
  GFM1 (EF-G1) cause their own combined oxidative phosphorylation deficiencies
  by the same route, and GFM1 was reported in the same 2007 study that first
  identified TUFM.

  Precedent. The KB already curates numbered COXPD leaves as standalone entries
  rather than as subtypes of a general term, in
  Combined_Oxidative_Phosphorylation_Defect_Type_21.yaml (TARS2) and
  Combined_Oxidative_Phosphorylation_Deficiency_42.yaml. This entry follows
  that practice.

  No treatments section, but not because nothing has been reported. Management
  in every published case was supportive and directed at the metabolic crises,
  and no therapy has been trialled in patients. There is one preclinical lead:
  the zebrafish study proposes probucol as a candidate for managing COXPD4, and
  that is recorded where it belongs, as a RESCUES link on the animal model with
  LOW fidelity, rather than as a treatment. A treatments entry would imply a
  clinical option that does not exist. This is a different kind of statement
  from the GeneReviews negative below, which is a search that returned nothing.

  GeneReviews. A PubMed search for a GeneReviews chapter covering TUFM or
  combined oxidative phosphorylation deficiency 4 returns none, which is
  expected for a nine-patient entity. Recorded here so the absence reads as a
  checked negative rather than an omission, following the sibling
  Combined_Oxidative_Phosphorylation_Defect_Type_21 entry.

  Evidence base. Six case reports and case series, with the pathogenicity of
  the founding alleles established by functional complementation in yeast and
  mammalian cells, plus a zebrafish tufm-null model. The model is a full
  knockout rather than a knock-in of a patient missense allele, which matters
  here because allele severity is the candidate explanation for the organ
  selectivity seen in patients - so it speaks to the shared proximal mechanism
  and not to what distinguishes one patient from another. The steps between
  reduced EF-Tu activity and the organ-level phenotypes remain largely inferred
  from the biochemistry of mitochondrial translation, and the two discussion
  entries say where that inference is load bearing.

  Deep research. An openscientist run for this entry is committed under
  research/. Unlike the run for CMS15 in the sibling PR, it passed
  just preflight-dr against MONDO:0012534 (TUFM mentioned 47 times, canonical
  gene matched, OMIM 610678 agreeing), and it earned its place: two of its
  leads, both verified against PubMed before use, are now the entry's
  strongest evidence - the adult proband with endomyocardial enzymology, and
  the zebrafish model.

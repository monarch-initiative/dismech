progression:
- phase: Fatal infantile course
  age_range: birth to 12 months
  notes: >-
    In the classical presentation, severe metabolic acidosis and respiratory
    distress begin in the neonatal period, followed by rapidly progressive
    encephalopathy and death in infancy; the most recently reported patient
    died at seven months. This is not universal, and the exceptions are
    substantial: the patient with dilated cardiomyopathy had no progressive
    encephalopathy, and another had only mild encephalopathy.
  evidence:
  - reference: PMID:41409307
    reference_title: "Arg339Gln Is a Recurrent Variant in Rare Combined Oxidative
      Phosphorylation Deficiency 4: A New Patient with Biallelic TUFM Gene Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case of a female infant with microcephaly who died from
      severe lactic acidosis at 7 months of age."
    explanation: Documents the fatal infantile course in a recent patient.
notes: >-
  Entity identity. MONDO:0012534 is combined oxidative phosphorylation defect
  type 4, cross-referenced to OMIM:610678, and its causal gene is TUFM. The
  numbered COXPD series is keyed to different nuclear genes of mitochondrial
  biogenesis and translation, so the number alone is not informative about
  mechanism; this entry is the EF-Tu one. The sibling factors TSFM (EF-Ts) and
  GFM1 (EF-G1) cause their own combined oxidative phosphorylation deficiencies
  by the same route, and GFM1 was reported in the same 2007 study that first
  identified TUFM.

  Precedent. The KB already curates numbered COXPD leaves as standalone entries
  rather than as subtypes of a general term, in
  Combined_Oxidative_Phosphorylation_Defect_Type_21.yaml (TARS2) and
  Combined_Oxidative_Phosphorylation_Deficiency_42.yaml. This entry follows
  that practice.

  No treatments section. No disease-directed therapy has been reported for
  COXPD4; management in the published cases was supportive and directed at the
  metabolic crises. Rather than record a generic supportive-care entry with
  nothing citable behind it, the section is left absent.

  Evidence base. Four case reports and case series covering a total of nine
  patients, with the pathogenicity of the founding alleles established by
  functional complementation in yeast and mammalian cells. There is no animal
  model of a TUFM patient allele and no patient-derived cell model reported in
  these sources, so the entry carries no model sections; the mechanistic steps
  between reduced EF-Tu activity and the organ-level phenotypes are inferred
  from the biochemistry of mitochondrial translation rather than measured in
  patients, and the two discussion entries say where that inference is load
  bearing.

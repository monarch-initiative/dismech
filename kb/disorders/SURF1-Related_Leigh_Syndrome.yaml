discussions:
- discussion_id: mismatch_surf1_mouse_mild_cox_defect
  prompt: >-
    Does the Surf1(-/-) knockout mouse — the principal mammalian model of SURF1
    deficiency — faithfully recapitulate the severe human COX-deficient Leigh
    syndrome, given that the mouse knockout produces only a mild COX defect and
    no necrotizing encephalopathy, reflecting a species-specific difference in
    how dependent complex IV assembly is on SURF1?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#SURF1 Loss and Defective Complex IV Assembly
  - pathophysiology#Impaired Terminal Electron Transfer and ATP Synthesis
  rationale: >-
    The Surf1(-/-) mouse validates the molecular lesion — loss of the SURF1 COX
    assembly factor reduces complex IV — but it does not reproduce the human
    disease severity: mouse fibroblasts show only a mild, more stable COX
    reduction and the animals develop no Leigh-type necrotizing encephalopathy
    (some reports even describe extended lifespan). Comparative fibroblast work
    shows human COX biogenesis is far more SURF1-dependent than mouse, so
    rodent efficacy or mechanism signals systematically underdetermine the human
    neurodegenerative phenotype. This is a translational-validity gap (evidence
    exists in the mouse but does not phenocopy human disease), not an absence of
    evidence, so it is flagged as HUMAN_MODEL_MISMATCH rather than a generic
    knowledge gap. Human iPSC-derived neurons/organoids are the emerging route
    to a faithful model.
  proposed_experiments:
  - experiment_id: exp_surf1_ipsc_neuron_cox
    name: SURF1-null human iPSC-derived neuron COX-assembly and bioenergetics assay
    description: >-
      Generate isogenic SURF1-null human iPSC-derived neurons and quantify
      complex IV assembly intermediates, COX monomer/supercomplex distribution,
      oxygen consumption, and susceptibility to metabolic stress relative to
      controls, testing whether the human-specific SURF1 dependence produces the
      severe bioenergetic failure that the mouse model lacks.
    experiment_type:
      preferred_term: iPSC-derived neuron perturbation assay
    model_systems:
    - name: Human iPSC-derived neuron
      description: >-
        Neurons differentiated from SURF1-edited human iPSCs, preserving the
        human-specific dependence of complex IV assembly on SURF1 that the mouse
        knockout does not capture.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:26804654
    reference_title: "Tissue- and species-specific differences in cytochrome c oxidase assembly induced by SURF1 defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SURF1 gene mutations cause a severe COX deficiency manifesting as the Leigh syndrome in humans, whereas in mice SURF1(-/-) knockout leads only to a mild COX defect."
    explanation: States the species mismatch — SURF1 mutations cause severe Leigh syndrome in humans but only a mild COX defect in Surf1(-/-) mice.
  - reference: PMID:26804654
    reference_title: "Tissue- and species-specific differences in cytochrome c oxidase assembly induced by SURF1 defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "COX assembly is much more dependent on SURF1 in humans than in mice."
    explanation: Comparative fibroblast analysis showing greater human SURF1-dependence, the mechanistic basis of the mouse mismatch.
differential_diagnoses:
- name: Charcot-Marie-Tooth Disease Type 4K
  description: >-
    The same gene produces a peripheral-nerve-predominant phenotype curated
    separately as Charcot-Marie-Tooth Disease Type 4K (MONDO:0014733). Patients
    present with severe childhood-onset demyelinating neuropathy and develop the
    putaminal and periaqueductal lesions of Leigh syndrome only years later.
    Complex IV remains partially functional in muscle and fibroblasts in those
    patients, which is the proposed reason the presentation differs.
  distinguishing_features:
  - Demyelinating polyneuropathy as the presenting feature
  - Motor nerve conduction velocities below 25 m/s
  - Partially retained complex IV activity in muscle and fibroblasts
  evidence:
  - reference: PMID:24027061
    reference_title: "SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.107-2A>G mutation produced no normally spliced transcript, leading to SURF1 absence. However, complex IV remained partially functional in muscle and fibroblasts."
    explanation: >-
      Documents the partially retained complex IV function that distinguishes
      the CMT4K presentation from Leigh syndrome despite identical gene loss.

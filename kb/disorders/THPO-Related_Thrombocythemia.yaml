name: THPO-Related Thrombocythemia
creation_date: "2026-11-10T00:00:00Z"
category: Mendelian
synonyms:
- thrombocythemia 1
- THCYT1
- thrombocythemia type 1
- THPO-related hereditary thrombocythemia
- familial essential thrombocythemia due to THPO mutation
disease_term:
  preferred_term: thrombocythemia 1
  term:
    id: MONDO:0008554
    label: thrombocythemia 1
parents:
- familial thrombocytosis
description: >-
  THPO-related thrombocythemia (thrombocythemia 1, THCYT1, OMIM 187950) is an
  autosomal dominant hereditary thrombocythemia caused by germline
  gain-of-function variants in THPO, the gene for thrombopoietin. The variants
  lie in the 5' untranslated region or at the intron 3 splice donor and do not
  change the thrombopoietin protein. Each disables an inhibitory upstream open
  reading frame that normally keeps translation of THPO mRNA low, either
  directly or by skipping the exon that carries it, so the same amount of mRNA
  yields more thrombopoietin. Serum thrombopoietin is often raised, although in
  the largest series most affected members had only slightly raised or normal
  levels; the excess ligand
  overstimulates its receptor MPL on megakaryocyte progenitors, and the bone
  marrow shows megakaryocytic hyperplasia resembling essential thrombocythemia.
  Affected individuals have a lifelong raised platelet count from childhood.
  The best-characterized pedigree had mainly brief, aspirin-responsive
  microcirculatory episodes of fainting and dizziness, with thrombotic and
  hemorrhagic event rates similar to those in sporadic essential
  thrombocythemia. Congenital transverse limb defects have been reported in
  three families, and single family members have developed multiple myeloma,
  chronic myeloid leukemia or a cutaneous lymphoma.
notes: >-
  Scope. This entry covers the dominant gain-of-function THPO disorder only.
  The allelic loss-of-function THPO disorders, monoallelic thrombocytopenia 9
  (kb/disorders/Thrombocytopenia_9.yaml) and biallelic congenital
  amegakaryocytic thrombocytopenia 2 with trilineage marrow failure (covered in
  kb/disorders/Inherited_Aplastic_Anemia.yaml), have the opposite phenotype and
  are out of scope. MPL-related hereditary thrombocythemia (thrombocythemia 2)
  and germline JAK2 hereditary thrombocythemia (thrombocythemia 3) are separate
  entities and appear here only as differential diagnoses. Name. The entry uses
  the dyadic name THPO-related thrombocythemia, a MONDO EXACT synonym of
  MONDO:0008554 attributed to ClinGen; the MONDO label "thrombocythemia 1" is
  kept as a synonym. GeneReviews has no chapter for this disease or for THPO;
  the phenotype baseline comes from the pedigree reports, chiefly the 23
  affected members of the Dutch and Polish families (PMID:18367486). MONDO also
  places this term under non-syndromic limb reduction defect, reflecting the
  families with transverse limb defects (PMID:19553636, PMID:22453305, and a
  Korean case with absent distal phalanges of the left hand in PMID:32067437,
  a letter with no abstract, so that family is described in prose rather than
  quoted).
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single gain-of-function THPO allele causes the disease. The variant
    co-segregates with thrombocytosis in the reported pedigrees, and with a
    raised serum thrombopoietin in several of them, although the level is not a
    reliable marker of carrier status. De novo variants are documented, so a negative family
    history does not exclude the diagnosis. The hematological phenotype appears
    fully penetrant, while thrombosis, bleeding, limb defects and malignancy
    occur only in some carriers.
  evidence:
  - reference: PMID:9425899
    reference_title: "An activating splice donor mutation in the thrombopoietin gene causes hereditary thrombocythaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary thrombocythaemia (HT) with autosomal-dominant transmission has been described with manifestations similar to those of sporadic ET."
    explanation: Dominant transmission of hereditary thrombocythemia.
  - reference: PMID:10583217
    reference_title: "Hereditary thrombocythaemia in a Japanese family is caused by a novel point mutation in the thrombopoietin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a G --> T transversion at position 516 of the TPO mRNA (G516T) that co-segregated with the HT phenotype in all affected family members"
    explanation: Complete co-segregation of the variant with the phenotype.
  - reference: PMID:18367486
    reference_title: "A de novo splice donor mutation in the thrombopoietin gene causes hereditary thrombocythemia in a Polish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation in THPO occurred de novo in the same position as in a previously described family with hereditary thrombocythemia."
    explanation: De novo occurrence of the causal variant.
  - reference: PMID:27100794
    reference_title: "Thrombopoietin Measurement as a Key Component in the Evaluation of Pediatric Thrombocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing revealed a de novo, germline stopgain mutation in the uORF, explaining the elevated TPO and thrombocytosis."
    explanation: A second de novo case, a child with no family history.
genetic:
- name: THPO
  gene_term:
    preferred_term: THPO
    term:
      id: hgnc:11795
      label: THPO
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported variants fall in two groups. Splice variants at the end of exon 3
    or in the intron 3 splice donor (c.13G>A, c.13+1G>C, c.13+1G>A, c.13+2T>C,
    c.13+5G>A) cause exon 3 skipping; the c.13+1G>C allele arose independently
    in the Dutch and Polish families, and an intron 2 donor variant causing
    exon 2 skipping was reported in a Filipino family. Variants in the 5'
    untranslated region act on the inhibitory upstream reading frame: c.-47delG
    (the one-base deletion of the Hokkaido family) and c.-31G>T, which is the
    same allele reported as G516T in a Japanese family and as G185T in an
    Italian family under a different numbering, and which also yields some exon
    3 skipping. The de novo c.-34C>T stopgain inside the reading frame is a
    further 5' untranslated region allele. None of these variants alters the
    amino acid sequence of secreted thrombopoietin; c.13G>A is the last base of
    exon 3 and acts by destroying the splice donor. Reaching the diagnosis by
    sequencing is more often an interpretation problem than a coverage one: in
    the reported pediatric case the causal variant was present in the original
    clinical exome data and had been filtered out because it was novel,
    noncoding and not predicted to affect splicing. A panel or exome report is
    therefore only as useful as its treatment of the 5' untranslated region.
  evidence:
  - reference: PMID:9425899
    reference_title: "An activating splice donor mutation in the thrombopoietin gene causes hereditary thrombocythaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This resulted in a lod score of 3.5 at theta=0. A G-->C transversion was found in the splice donor site of intron 3 of the THPO gene in all affected family members."
    explanation: Linkage and segregation of a THPO splice donor variant in the founding Dutch family.
  - reference: PMID:9694695
    reference_title: "Familial essential thrombocythemia associated with one-base deletion in the 5'-untranslated region of the thrombopoietin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a one-base deletion in the 5'-untranslated region of the TPO gene in affected but not in nonaffected family members"
    explanation: A 5' untranslated region deletion segregating with the disease.
  - reference: PMID:19553636
    reference_title: "Association of hereditary thrombocythemia and distal limb defects with a thrombopoietin gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a family with segregation of G185T TPO mutation in the 5' UTR region in 4 subjects with thrombocythemia"
    explanation: A further 5' untranslated region variant in an Italian family.
  - reference: PMID:22453305
    reference_title: "Hereditary thrombocythemia caused by a thrombopoietin (THPO) gain-of-function mutation associated with multiple myeloma and congenital limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report two families with HT resulting from a THPO c.13+1 G>C mutation in the splice donor of intron 3."
    explanation: Two German families with the recurrent splice donor variant.
  - reference: PMID:18367486
    reference_title: "A de novo splice donor mutation in the thrombopoietin gene causes hereditary thrombocythemia in a Polish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haplotype analysis using single nucleotide polymorphisms surrounding the mutation indicated that the mutations arose independently in the two families."
    explanation: The intron 3 splice donor is a recurrent mutation site, not a founder allele.
  - reference: PMID:38548144
    reference_title: "Relative impact of THPO mutation causing hereditary thrombocythemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We cloned six distinct THPO mutations (THPO c.-47delG, THPO c.-31G>T, THPO c.13G>A, THPO c.13+1G>A, THPO c.13+2T>C, and THPO c.13+5G>A) and compared the molecular mechanisms that underlie the increased production of THPO protein."
    explanation: Lists the six known variants in current nomenclature.

- name: Excess Thrombopoietin Engagement of MPL
  conforms_to: "jak_stat_pathway_activation#Activating Lesion or Sustained Ligand Drive Upstream of JAK"
  description: >-
    The excess ligand binds a structurally normal MPL receptor on hematopoietic
    stem and megakaryocyte progenitor cells, driving the cytokine
    receptor-JAK-STAT axis above its physiological set point. The lesion is in
    the ligand, not in MPL, JAK2 or a STAT, so the pathway is over-driven
    rather than constitutively active, and in principle it remains switchable
    by removing the ligand.

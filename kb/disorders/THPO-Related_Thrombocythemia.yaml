    raised thrombopoietin in a patient with thrombocytosis and no somatic
    driver mutation points towards THPO, but the finding is not universal: in
    the Polish and Dutch pedigrees most affected members had only slightly
    raised or normal levels, so a normal thrombopoietin does not exclude the
    disease.

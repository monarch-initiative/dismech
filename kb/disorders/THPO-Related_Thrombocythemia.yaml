- name: Loss of uORF-Mediated Translational Repression of THPO mRNA
  description: >-
    Normally, AUG codons in the THPO 5' untranslated region define short
    upstream open reading frames that capture scanning ribosomes and keep
    initiation at the thrombopoietin start codon low, so the two main mRNA
    isoforms are almost completely repressed. Removing or disabling the
    repressive ORF7 releases this brake.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: negative regulation of translation
    modifier: DECREASED
    term:
      id: GO:0017148
      label: negative regulation of translation
  evidence:
  - reference: PMID:9834204
    reference_title: Thrombopoietin production is inhibited by a translational mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "physiologically the translation of these TPO mRNA isoforms is strongly inhibited by the presence of AUG codons, which define several short open reading frames (ORFs) in the 5'-UTR and suppress efficient initiation at the physiologic start site"
    explanation: The normal translational brake that the disease variants remove.
  - reference: PMID:38548144
    reference_title: "Relative impact of THPO mutation causing hereditary thrombocythemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The common mechanisms of hereditary thrombocytosis due to THPO mutations are unleashed THPO translations, which are usually suppressed by upstream out-of-frame ORF7."
    explanation: All six variants converge on loss of repression by the upstream reading frame.
  - reference: PMID:10828006
    reference_title: "Translational pathophysiology: a novel molecular mechanism of human disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary thrombocythemia (sometimes called familial essential thrombocythemia or familial thrombocytosis) can be caused by mutations in upstream AUG codons in the 5'-UTR of the TPO mRNA that normally function as translational repressors."
    explanation: Review placing the disease among disorders of translational control.
  downstream:

    snippet: "In one family there were coexisting distal limb defects, whereas in the other one member developed early-onset multiple myeloma."
    explanation: >-
      A second, independent family with limb defects, carrying a different
      variant from the Italian family.
- category: Hematological
  name: Splenomegaly
  description: >-
    Palpable splenomegaly, present in 6 of 23 affected members of the Polish
    and Dutch series and described as mild or minimal in the individual case
    reports; mild hepatosplenomegaly was also recorded in the reported
    pediatric case.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
    severity: MILD
  notes: >-
    The proportion is from Table 3 of PMID:18367486 and the individual
    descriptions from its case reports; the pediatric case is PMID:27100794.
    None of these passages is in the papers' abstracts, which is why the
    phenotype carries no quoted evidence item. No source states how the
    spleen enlarges in this disease, so no causal edge reaches this
    phenotype.
- category: Hematological
  name: Transient myeloproliferative syndrome
  description: >-
    A reversible myeloproliferative picture in infancy has been reported in a
    carrier of a germline THPO variant, and transient myeloproliferative
    disease is listed for THPO families in a pediatric review; a Korean infant
    with the intron 3 variant had leukocytosis that resolved spontaneously at
    four months. The relationship between this transient picture and the
    lifelong thrombocytosis is unexplained, and no source places it downstream
    of a particular step, so no causal edge reaches this phenotype.
  phenotype_term:
    preferred_term: Transient myeloproliferative syndrome
    term:
      id: HP:0005534
      label: Transient myeloproliferative syndrome
  evidence:
  - reference: PMID:25728710
    reference_title: Somatic thrombopoietin (THPO) gene mutations in childhood myeloid leukemias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report, for the first time, a non-syndromic infant with a reversible myeloproliferative disease that harbors a germline hereditary thrombopoietin (THPO) gene mutation, a condition that is known to induce familial thrombocytosis at increasing age."
    explanation: >-
      A reversible infantile myeloproliferative disease in a germline THPO
      variant carrier.
diagnosis:
- name: Serum thrombopoietin measurement
  description: >-
    A raised serum thrombopoietin in a patient with thrombocytosis, after
    reactive causes and somatic JAK2, CALR and MPL mutations are excluded,
    redirects the workup to THPO sequencing. A raised level alone is not
    specific, since thrombopoietin is often raised in sporadic and reactive
    thrombocytosis too.
  diagnosis_term:
    preferred_term: thrombopoietin measurement
    term:
      id: NCIT:C74873
      label: Thrombopoietin Measurement
  evidence:
  - reference: PMID:27100794
    reference_title: "Thrombopoietin Measurement as a Key Component in the Evaluation of Pediatric Thrombocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding suggests that screening TPO levels and, if elevated, THPO 5' UTR sequencing could be diagnostic."
    explanation: The thrombopoietin level is the gateway to THPO sequencing.
  - reference: PMID:9375739
    reference_title: Thrombopoietin levels in patients with primary and reactive thrombocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant difference was found between the two groups of patients, indicating that serum TPO levels cannot differentiate between primary and reactive thrombocytosis."
    explanation: Why a raised thrombopoietin is a pointer rather than a diagnosis.
- name: Genetic testing
  description: >-
    Sequencing has to cover the THPO 5' untranslated region and the intron 3
    splice donor, and the result has to be interpreted with those regions in
    mind: in the reported pediatric case the variant was already in the
    clinical exome data and had been filtered out as a novel noncoding change
    with no predicted splicing effect, and a targeted exome panel found the
    intron 3 variant in another case. A novel non-coding variant usually needs
    functional testing of translation or protein output. If THPO is negative,
    MPL and germline JAK2 are the other known genes, and some families stay
    genetically unexplained.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31808840
    reference_title: Diagnostic workflow for hereditary erythrocytosis and thrombocytosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary thrombocytosis has been shown to be accounted for by mutations in THPO, MPL, and JAK2 genes."
    explanation: The genes to test in suspected hereditary thrombocytosis.
  - reference: PMID:31808840
    reference_title: Diagnostic workflow for hereditary erythrocytosis and thrombocytosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There remain individuals who appear to have a hereditary disorder in whom a genetic lesion cannot currently be identified."
    explanation: Some families remain genetically unexplained.
  - reference: PMID:27100794
    reference_title: "Thrombopoietin Measurement as a Key Component in the Evaluation of Pediatric Thrombocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a child with suspected ET and normal JAK2, MPL, and CALR analyses."
    explanation: The diagnosis follows a negative somatic driver panel.
- name: Bone marrow biopsy
  description: >-
    Shows megakaryocytic hyperplasia resembling essential thrombocythemia, so
    on its own it does not separate the hereditary disease from the neoplasm.
  diagnosis_term:
    preferred_term: bone marrow biopsy
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  evidence:
  - reference: PMID:37962621
    reference_title: "Hereditary thrombocythemia due to splicing donor site mutation of THPO in a Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow biopsy showed increased megakaryocytes mimicking essential thrombocythemia."
    explanation: The marrow mimics essential thrombocythemia.
treatments:
- name: Low-Dose Aspirin
  description: >-
    Low-dose aspirin relieved the microcirculatory episodes in the Dutch and
    Polish families, whose authors concluded that cytoreductive treatment was
    not needed. The evidence is from these pedigrees only; no trial exists, and
    whether aspirin lowers the risk of major thrombosis in this disease has not
    been studied.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: low-dose aspirin therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Impaired Microcirculation
  evidence:
  - reference: PMID:18367486
    reference_title: "A de novo splice donor mutation in the thrombopoietin gene causes hereditary thrombocythemia in a Polish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with this mutation have elevated serum levels of thrombopoietin and a phenotype that responds to aspirin and does not require cytoreductive treatment."
    explanation: Aspirin response, and no need for cytoreduction, in these families.
differential_diagnoses:
- name: Essential thrombocythemia
  description: >-
    Sporadic clonal myeloproliferative neoplasm driven by somatic JAK2, CALR or
    MPL mutations. The marrow can look the same, but onset is later,
    hematopoiesis is clonal, and the hereditary THPO variants are absent from
    sporadic cases.
  distinguishing_features:
  - Somatic JAK2 V617F, CALR or MPL mutation.
  - Clonal hematopoiesis.
  - Later onset and no Mendelian family history.
  disease_term:
    preferred_term: essential thrombocythemia
    term:
      id: MONDO:0005029
      label: essential thrombocythemia
  evidence:
  - reference: PMID:9753068
    reference_title: The activating splice mutation in intron 3 of the thrombopoietin gene is not found in patients with non-familial essential thrombocythaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have therefore screened 51 patients diagnosed with non-familial ET for the presence of this mutation, but it was not detected in any patient."
    explanation: The intron 3 variant is absent from sporadic essential thrombocythemia.
  - reference: PMID:11860444
    reference_title: "Lack of pathogenic mutations in the 5'-untranslated region of the thrombopoietin gene in patients with non-familial essential thrombocythaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results demonstrate that mutations in the 5' UTR of the TPO gene are not the cause of the normal or elevated TPO levels in acquired ET."
    explanation: 5' untranslated region variants are absent from acquired disease.
  - reference: PMID:21303356
    reference_title: Advances in understanding the pathogenesis of familial thrombocythaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It must be underlined that these two categories represent two well separate entities, with different patterns of proliferation and different transmission modalities."
    explanation: Review separating Mendelian polyclonal thrombocytosis from inherited neoplasm predisposition.
- name: Thrombocythemia 2
  description: >-
    Hereditary thrombocythemia caused by germline MPL variants, a
    receptor-intrinsic lesion. MPL sequencing is positive and THPO is normal.
  distinguishing_features:
  - Germline MPL variant rather than a THPO variant.
  disease_term:
    preferred_term: thrombocythemia 2
    term:
      id: MONDO:0011173
      label: thrombocythemia 2
  evidence:
  - reference: PMID:28955303
    reference_title: Genetic Alterations of the Thrombopoietin/MPL/JAK2 Axis Impacting Megakaryopoiesis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thrombocytosis can be due to genetic alterations that affect either the intrinsic MPL signaling through gain-of-function (GOF) activity (MPL, JAK2, CALR)"
    explanation: MPL gain of function acts on receptor-intrinsic signalling.
- name: Thrombocythemia 3
  description: >-
    Hereditary thrombocythemia caused by germline JAK2 variants that are
    distinct from the somatic V617F mutation of the neoplasms.
  distinguishing_features:
  - Germline JAK2 variant rather than a THPO variant.
  disease_term:
    preferred_term: thrombocythemia 3
    term:
      id: MONDO:0013794
      label: thrombocythemia 3
  evidence:
  - reference: PMID:25189721
    reference_title: "Hereditary erythrocytosis, thrombocytosis and neutrophilia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More recently, germline mutations in JAK2, distinct from JAK2 V617F, and mutation of the gelsolin gene, were uncovered in several pedigrees of hereditary thrombocytosis."
    explanation: Germline JAK2 hereditary thrombocytosis as a separate entity.
- name: Reactive thrombocytosis
  description: >-
    Thrombocytosis secondary to infection, inflammation or iron deficiency;
    much commoner than any hereditary cause, especially in children, and it
    resolves when the cause is treated.
  distinguishing_features:
  - An identifiable inflammatory, infectious or iron-deficiency cause.
  - Resolves when the underlying cause is treated.
  disease_term:
    preferred_term: reactive thrombocytosis
    term:
      id: MONDO:0024518
      label: reactive thrombocytosis
  evidence:
  - reference: PMID:33712866
    reference_title: "Thrombocytosis in children and adolescents-classification, diagnostic approach, and clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Secondary thrombocytosis is a frequent secondary finding in childhood infection and inflammation."
    explanation: Reactive thrombocytosis is the common alternative, particularly in children.
experimental_models:
- name: THPO variant expression constructs and cell-free translation
  experimental_model_type: OTHER
  description: >-
    Wild-type and patient-variant THPO constructs expressed in cell lines, and
    variant mRNA translated in reticulocyte lysate. These assays measure the
    quantity that is abnormal in patients, the protein yield from a given
    amount of message, and are how pathogenicity of a new non-coding variant is
    established.
  modeled_mechanisms:
  - target: Increased THPO mRNA Translation
    relationship: RECAPITULATES
    fidelity: HIGH
    limitations: >-
      Heterologous cell lines and cell-free lysate rather than hepatocytes, and
      cDNA constructs may not reproduce endogenous promoter and isoform usage.
    evidence:
    - reference: PMID:10583217
      reference_title: "Hereditary thrombocythaemia in a Japanese family is caused by a novel point mutation in the thrombopoietin gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "when assayed in reticulocyte lysates, improved translational efficiency of in vitro transcribed TPO mRNA"
      explanation: Cell-free translation reproduces the translational gain.
  - target: THPO Exon 3 Skipping
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: Splicing is measured from expression constructs, not from patient liver.
    evidence:
    - reference: PMID:38548144
      reference_title: "Relative impact of THPO mutation causing hereditary thrombocythemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We cloned six distinct THPO mutations (THPO c.-47delG, THPO c.-31G>T, THPO c.13G>A, THPO c.13+1G>A, THPO c.13+2T>C, and THPO c.13+5G>A) and compared the molecular mechanisms that underlie the increased production of THPO protein."
      explanation: Constructs for all six variants reproduce the transcript and protein changes.
animal_models:
- name: Megakaryocyte- and platelet-specific Mpl knockout mouse
  species: Mouse
  genotype: Mpl(PF4cre/PF4cre)
  publication: PMID:24711413
  description: >-
    Mice that keep Mpl on stem and progenitor cells but lack it on
    megakaryocytes and platelets develop megakaryocytosis and thrombocytosis
    from thrombopoietin that the platelet compartment no longer consumes, with
    a normal circulating level. It models the response of the progenitor
    compartment to chronic thrombopoietin overstimulation, not the THPO
    lesion. No knock-in of a human THPO 5' untranslated region variant has
    been reported in any species.
  modeled_mechanisms:
  - target: Increased Megakaryocyte Progenitor Proliferation and Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      The thrombopoietin excess comes from reduced consumption, with a normal
      circulating level in the PF4-cre model, rather than from increased
      synthesis as in patients.
    evidence:
    - reference: PMID:24711413
      reference_title: Mpl expression on megakaryocytes and platelets is dispensable for thrombopoiesis but essential to prevent myeloproliferation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a remarkable expansion of megakaryocyte-committed and multipotential progenitor cells, the latter displaying biological responses and a gene expression signature indicative of chronic TPO overstimulation as the underlying causative mechanism"
      explanation: Progenitor expansion under chronic thrombopoietin overstimulation.
- name: Mpl-transgenic mouse with low platelet Mpl
  species: Mouse
  genotype: Mpl transgene on an Mpl(-/-) background
  publication: PMID:18845793
  description: >-
    A full-length Mpl transgene whose expression falls during late
    megakaryocyte maturation leaves little Mpl protein in platelets. These mice
    develop marked thrombocytosis, which the authors attribute to a shifted
    equilibrium in the feedback loop by which platelets consume
    thrombopoietin. It is the closest available model of the reduced platelet
    MPL arm of this disease.
  modeled_mechanisms:
  - target: Reduced Platelet MPL Protein
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Platelet Mpl is lowered by transgene design, not by chronic ligand excess
      as proposed in patients, and the ligand itself is normal.
    evidence:
    - reference: PMID:18845793
      reference_title: Pronounced thrombocytosis in transgenic mice expressing reduced levels of Mpl in platelets and terminally differentiated megakaryocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice developed thrombocytosis with platelet levels approximately 5-fold higher than wild-type controls and markedly increased megakaryocyte numbers."
      explanation: Low platelet Mpl is sufficient for thrombocytosis in mice.
- name: Thpo knockout mouse
  species: Mouse
  genotype: Thpo-/- and Thpo+/-
  publication: PMID:8627177
  description: >-
    The inverse model. Loss of thrombopoietin depletes megakaryocytes and
    platelets selectively, and the gene-dosage effect in heterozygotes
    establishes that thrombopoietin is made constitutively and that its
    circulating level is set by platelet mass. The direction of the lesion is
    opposite to this disease, so the model carries the physiology rather than
    the disease state.
  modeled_mechanisms:
  - target: Increased Megakaryocyte Progenitor Proliferation and Differentiation
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Thrombopoietin is absent rather than in excess, so the model establishes
      the direction of the relationship and not the disease state.
    evidence:
    - reference: PMID:8627177
      reference_title: Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bone marrow from TPO-/- mice have decreased numbers of megakaryocyte-committed progenitors as well as lower ploidy in the megakaryocytes that are present."
      explanation: Thrombopoietin loss reduces megakaryocyte progenitors, the inverse of this disease.
discussions:
- discussion_id: thcyt1_thrombosis_risk_vs_et
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the thrombotic and hemorrhagic risk of THPO-related thrombocythemia
    really the same as in sporadic essential thrombocythemia, and does it track
    the platelet count or the thrombopoietin level?
  attaches_to:
  - "phenotypes#Abnormal thrombosis"
  - "phenotypes#Abnormal bleeding"
  rationale: >-
    The only comparison comes from 23 affected members of two families
    carrying the same splice donor variant, and it says the event frequencies
    resemble essential thrombocythemia. Onset is earlier, so lifetime exposure
    is longer. Yet those families mostly had mild microcirculatory symptoms and
    were judged not to need cytoreduction, and risk in sporadic disease depends
    partly on clonal features that this disease does not have. Risk scores
    built for the neoplasm cannot be assumed to transfer. The mechanism of
    thrombosis here is also unstudied: there are no platelet activation,
    coagulation or flow data in THPO carriers, so nothing is known about
    whether the raised count acts through the same steps as thrombosis in the
    neoplasm. The full text of the same report gives rates of 6.1 thrombotic
    and 0.6 hemorrhagic events per 100 patient-years, against 7.0 and 1.8 in
    the comparison essential thrombocythemia group, and records two deaths
    from stroke among the 23 affected members.
  proposed_experiments:
  - experiment_id: exp_thcyt1_pooled_pedigree_registry
    experiment_design: HUMAN_OBSERVATIONAL
    name: Pooled registry of THPO variant carriers with event ascertainment
    description: >-
      Pool the reported THPO pedigrees and carriers found by cascade testing,
      record platelet count, serum thrombopoietin, arterial and venous events,
      bleeding and antiplatelet use, and compare event rates against an
      age-matched sporadic essential thrombocythemia cohort.
  evidence:
  - reference: PMID:18367486
    reference_title: "A de novo splice donor mutation in the thrombopoietin gene causes hereditary thrombocythemia in a Polish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset is earlier in patients with hereditary thrombocythemia than in those with essential thrombocythemia, but the frequencies of thrombotic, vascular and hemorrhagic events are similar in the two groups."
    explanation: The single comparison available, and the basis for the gap.
- discussion_id: thcyt1_clonality_and_malignancy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    The disease is polyclonal, yet single carriers have developed multiple
    myeloma and chronic myeloid leukemia. Does lifelong thrombopoietin excess
    predispose to clonal hematopoiesis or malignancy?
  attaches_to:
  - "pathophysiology#Excess Thrombopoietin Engagement of MPL"
  - "genetic#THPO"
  rationale: >-
    Familial thrombocytosis with Mendelian inheritance and high penetrance is
    polyclonal, unlike sporadic essential thrombocythemia. Thrombopoietin also
    acts on hematopoietic stem cells, and chronic overstimulation expands
    multipotential progenitors in mice, so a predisposition is biologically
    plausible. Malignancies have been reported in single members of separate
    families: an early-onset multiple myeloma, a chronic myeloid leukemia, and
    a childhood cutaneous lymphoma and separately acute myeloid leukemia with
    myelofibrosis listed in later reviews of the same pedigrees. Scattered
    single events among roughly a dozen families cannot separate a causal
    effect from chance, and somatic THPO gain-of-function variants are
    extremely rare in sporadic pediatric myeloid disease. Marrow fibrosis is
    likewise unquantified: the largest series reports an occasional mild
    increase in reticulin fibers and no myelofibrosis over its follow-up. None
    of this is recorded as a phenotype, because none of it is established as
    part of the disease.
  proposed_experiments:
  - experiment_id: exp_thcyt1_clonal_hematopoiesis_sequencing
    experiment_design: HUMAN_OBSERVATIONAL
    name: Deep sequencing for clonal hematopoiesis in THPO carriers
    description: >-
      Error-corrected sequencing of myeloid driver genes in blood from THPO
      carriers across a range of ages, against age-matched relatives without
      the variant, to test whether thrombopoietin excess accelerates clonal
      hematopoiesis.
  evidence:
  - reference: PMID:21303356
    reference_title: Advances in understanding the pathogenesis of familial thrombocythaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first includes inherited syndromes that affect only the megakaryocytic lineage with Mendelian inheritance, high penetrance and polyclonal haematopoiesis."
    explanation: The THPO disorder belongs to the polyclonal category.
  - reference: PMID:22453305
    reference_title: "Hereditary thrombocythemia caused by a thrombopoietin (THPO) gain-of-function mutation associated with multiple myeloma and congenital limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overstimulation of the THPO pathway might therefore predispose to clonal hematopoietic disease and to congenital abnormalities."
    explanation: The predisposition hypothesis, with the authors' own hedge.
  - reference: PMID:37962621
    reference_title: "Hereditary thrombocythemia due to splicing donor site mutation of THPO in a Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow biopsy showed increased megakaryocytes mimicking essential thrombocythemia. One affected family member developed chronic myeloid leukemia."
    explanation: A second malignancy, in a separate family.
  - reference: PMID:25728710
    reference_title: Somatic thrombopoietin (THPO) gene mutations in childhood myeloid leukemias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "show that gain-of-function THPO mutations are extremely rare in sporadic pediatric myeloproliferative diseases"
    explanation: THPO gain of function is not a common driver of sporadic myeloid disease.
- discussion_id: thcyt1_tpo_high_despite_platelet_mass
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Platelets consume thrombopoietin through MPL, so a raised platelet mass
    should lower the free level. Why does serum thrombopoietin stay high in
    this disease?
  attaches_to:
  - "pathophysiology#Elevated Circulating Thrombopoietin"
  - "pathophysiology#Reduced Platelet MPL Protein"
  rationale: >-
    The question is sharper than it first looks, because the level is often not
    high. All affected members of the Japanese family had markedly raised
    levels, whereas in the Polish and Dutch families only two of eleven did and
    the rest were slightly raised or normal, with no correlation to the platelet
    count. Three things are in play and they are not exclusive: synthesis
    outrunning clearance, since thrombopoietin is made constitutively and the
    variant constructs secrete several-fold more protein; clearance by the
    expanded platelet and megakaryocyte mass pulling the level back towards
    normal, which is the explanation the Polish authors give for their own
    near-normal values; and reduced clearance per platelet, since patient
    platelets carry little MPL protein with normal message, thrombopoietin
    binding internalizes platelet MPL without recycling, and low platelet Mpl
    alone causes thrombocytosis in mice. Nobody has measured thrombopoietin
    clearance per platelet in a carrier, which is what would separate them.
    Until that is done, a serum level is a pointer to the diagnosis in some
    families and uninformative in others.
  proposed_experiments:
  - experiment_id: exp_thcyt1_platelet_tpo_clearance
    experiment_design: HUMAN_OBSERVATIONAL
    name: Platelet thrombopoietin binding and clearance in THPO carriers
    description: >-
      Measure platelet surface MPL, thrombopoietin binding sites per platelet
      and ex vivo thrombopoietin clearance in carriers and non-carrier
      relatives, and relate them to serum thrombopoietin and platelet count.
  evidence:
  - reference: PMID:8627177
    reference_title: Physiological regulation of early and late stages of megakaryocytopoiesis by thrombopoietin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A gene dosage effect observed in heterozygous mice suggests that the TPO gene is constitutively expressed and that the circulating TPO level is directly regulated by the platelet mass."
    explanation: The normal relationship between platelet mass and thrombopoietin level.
  - reference: PMID:9108396
    reference_title: Human platelets as a model for the binding and degradation of thrombopoietin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, these data show that human platelets specifically bind rhTPO with high affinity, internalize, and then degrade the rhTPO."
    explanation: Human platelets are the clearance route for thrombopoietin.
  - reference: PMID:18367486
    reference_title: "A de novo splice donor mutation in the thrombopoietin gene causes hereditary thrombocythemia in a Polish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPL protein levels, but not mRNA levels, were low in platelets from affected family members."
    explanation: The patient observation that makes reduced clearance plausible.
  - reference: PMID:18845793
    reference_title: Pronounced thrombocytosis in transgenic mice expressing reduced levels of Mpl in platelets and terminally differentiated megakaryocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our results suggest that lowering Mpl protein in platelets could contribute to raising the platelet count"
    explanation: Low platelet Mpl can amplify thrombocytosis in its own right.
- discussion_id: thcyt1_management_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What treatment intensity is right for THPO-related thrombocythemia, and
    when, if ever, is cytoreduction indicated?
  attaches_to:
  - "treatments#Low-Dose Aspirin"
  rationale: >-
    The only management statement specific to this disease is that the Dutch
    and Polish families responded to aspirin and did not need cytoreductive
    treatment. There is no trial, no registry, and no guideline for pediatric
    thrombocytosis at all. Treating a carrier as though they had a clonal
    neoplasm risks unnecessary hydroxyurea or anagrelide in a young person,
    while the reported event rates argue against leaving the disease alone.
    One attempt at cytoreduction is on record and it failed: hydroxyurea did
    not relieve the symptoms of the Polish proband, who then did well on
    low-dose aspirin, and ticlopidine was used alongside aspirin in another
    member. Thrombopoietin receptor agonists would add to an existing ligand
    excess and are mechanistically inappropriate here, though no source states
    a formal contraindication.
  evidence:
  - reference: PMID:18367486
    reference_title: "A de novo splice donor mutation in the thrombopoietin gene causes hereditary thrombocythemia in a Polish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with this mutation have elevated serum levels of thrombopoietin and a phenotype that responds to aspirin and does not require cytoreductive treatment."
    explanation: The only disease-specific management evidence that exists.
  - reference: PMID:33712866
    reference_title: "Thrombocytosis in children and adolescents-classification, diagnostic approach, and clinical management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, data on childhood thrombocytosis are rare, and no consensus guidelines for pediatric thrombocytosis exist."
    explanation: No pediatric guidance exists to fall back on.
- discussion_id: thcyt1_distinction_from_receptor_driven_disease
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should this disease be placed relative to MPL-, JAK2- and CALR-driven
    thrombocythemia, given that all of them converge on MPL-JAK2 signalling?
  attaches_to:
  - "pathophysiology#Excess Thrombopoietin Engagement of MPL"
  - "pathophysiology#JAK2 Activation Downstream of MPL"
  rationale: >-
    In MPL-, JAK2- and CALR-driven disease the lesion sits in the receptor
    complex and signalling becomes constitutive or ligand independent. Here
    every protein in the pathway is normal and MPL is over-driven by an excess
    of its ligand, which the reviews of this axis call its extrinsic rather
    than intrinsic activation. Nobody has shown constitutive or
    ligand-independent kinase or STAT activity in a THPO carrier, and in
    principle removing the ligand would switch the pathway off, which is not
    true of a receptor or kinase lesion. Clinically the distinction
    matters because the hereditary variants are absent from sporadic essential
    thrombocythemia, so a raised thrombopoietin in sporadic disease is not a
    reason to suspect THPO. Whether a JAK inhibitor would work in this disease
    is untested.
  evidence:
  - reference: PMID:28955303
    reference_title: Genetic Alterations of the Thrombopoietin/MPL/JAK2 Axis Impacting Megakaryopoiesis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thrombocytosis can be due to genetic alterations that affect either the intrinsic MPL signaling through gain-of-function (GOF) activity (MPL, JAK2, CALR) and loss-of-function (LOF) activity of negative regulators (CBL, LNK) or the extrinsic MPL signaling by THPO GOF mutations leading to increased TPO synthesis."
    explanation: The intrinsic versus extrinsic distinction this discussion turns on.
  - reference: PMID:9753068
    reference_title: The activating splice mutation in intron 3 of the thrombopoietin gene is not found in patients with non-familial essential thrombocythaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The constitutional presence of this mutation is therefore unlikely to contribute to the pathogenesis of ET."
    explanation: The hereditary variant has no role in the sporadic neoplasm.
- discussion_id: thcyt1_limb_defect_hemangioblast_hypothesis
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Does thrombopoietin excess during embryogenesis cause transverse limb
    defects by acting on the hemangioblast and disturbing limb vasculogenesis?
  attaches_to:
  - "pathophysiology#Proposed Hemangioblast Dysregulation"
  - "phenotypes#Transverse terminal limb defect"
  rationale: >-
    Three families carrying two different THPO variants had congenital
    transverse limb defects, which argues against coincidence, and a systemic
    germline lesion producing a focal unilateral defect fits a stochastic
    vascular-disruption mechanism. Against it: most families, including others
    carrying the same splice donor variant, have no limb anomaly, within the
    Italian family only three of four carriers were affected, and no
    experimental system has tested the idea. The steps from thrombopoietin
    excess to a missing distal limb are therefore recorded as proposals with
    unknown intermediates, not as established causation.
  proposed_experiments:
  - experiment_id: exp_thcyt1_embryonic_tpo_excess_limb
    experiment_design: TARGETED_PERTURBATION
    name: Embryonic thrombopoietin excess and limb vascular development
    description: >-
      Knock a patient THPO 5' untranslated region or splice donor variant into
      the mouse Thpo locus, or raise thrombopoietin in zebrafish embryos, and
      image hemangioblast specification and limb-bud vasculature for
      disruption and distal limb loss.
  evidence:
  - reference: PMID:19553636
    reference_title: Association of hereditary thrombocythemia and distal limb defects with a thrombopoietin gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reports of inherited unilateral limb defects are extremely rare."
    explanation: Why an inherited unilateral defect called for a mechanism at all.
  - reference: PMID:22453305
    reference_title: "Hereditary thrombocythemia caused by a thrombopoietin (THPO) gain-of-function mutation associated with multiple myeloma and congenital limb defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These observations, together with previously reported patients, suggest that THPO gain of function may dysregulate the hemangioblast and disturb vasculogenesis and hematopoietic development."
    explanation: The hypothesis stated across families.
- discussion_id: thcyt1_no_animal_model_of_the_lesion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the human THPO translational lesion be modelled in an animal, and is
    the inhibitory upstream open reading frame conserved in mouse Thpo?
  attaches_to:
  - "pathophysiology#Loss of uORF-Mediated Translational Repression of THPO mRNA"
  rationale: >-
    The initiating mechanism is captured well by cell-free translation and by
    transfected cell lines, which measure exactly the quantity that is
    abnormal in patients. Every animal model of thrombopoietin excess reaches
    the downstream state by another route, usually reduced platelet Mpl, so
    none reproduces the normal-message, high-protein state, and none reports
    the microcirculatory symptoms, the limb defects or a malignancy. A knock-in
    of a patient variant at the endogenous locus would test the whole chain,
    but only if the repressive upstream reading frame architecture is
    conserved, which has not been examined.
  proposed_experiments:
  - experiment_id: exp_thcyt1_thpo_uorf_knockin_mouse
    experiment_design: TARGETED_PERTURBATION
    name: Thpo upstream open reading frame knock-in mouse
    description: >-
      Compare the mouse and human THPO 5' untranslated regions for the
      repressive reading frame, then introduce the equivalent of c.13+1G>C or
      c.-47delG at the endogenous locus and measure hepatic Thpo mRNA, serum
      thrombopoietin, platelet Mpl, megakaryocyte numbers and platelet count.
  evidence:
  - reference: PMID:9834204
    reference_title: Thrombopoietin production is inhibited by a translational mechanism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, inhibition of translation of the TPO mRNA is an efficient mechanism to prevent overproduction of this highly potent cytokine."
    explanation: The physiological brake whose loss is the disease, and what a model would have to carry.

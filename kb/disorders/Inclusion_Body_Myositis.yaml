discussions:
- discussion_id: ibm_autoimmune_vs_degenerative_primacy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is sporadic inclusion body myositis primarily a T cell-mediated autoimmune
    disease with secondary degeneration, or primarily a cell-autonomous
    degenerative myopathy with secondary inflammation?
  attaches_to:
  - pathophysiology#Cytotoxic T Cell Invasion of Non-Necrotic Myofibres
  - pathophysiology#Autophagy-Lysosome Failure and Rimmed Vacuole Formation
  rationale: >-
    This is the central unresolved question in IBM and it determines therapeutic
    strategy. The autoimmune-primary case rests on the HLA association, the
    anti-cN1A autoantibody, the clonal cytotoxic T cell signature, and the
    observation that invasion of non-necrotic fibres is far more common than
    aggregate-bearing fibres (fewer than 1% of myofibres). The
    degeneration-primary case rests on the consistent failure of
    immunosuppression and on the xenograft experiment showing rimmed vacuoles
    and TDP-43 loss of function persist after T cell depletion. The two models
    are not mutually exclusive; the disputed point is which arm is upstream and
    therefore which is the therapeutic target. The single most informative test
    has now reported: the registrational anti-KLRG1 (ulviprubart) MUSCLE trial
    depleted precisely the effector population the autoimmune model implicates,
    sparing broader immunity in a way conventional immunosuppression does not,
    and per sponsor topline announcements it missed its primary and key
    secondary endpoints in the overall population. If that result holds on
    peer-reviewed publication it is substantial negative evidence for the
    autoimmune-primary model as a complete account, and shifts weight toward the
    degeneration-primary arm or toward a model in which immune injury initiates
    but does not sustain the disease. The `autoimmune_primary` hypothesis is
    retained as CANONICAL for now because it remains the dominant published
    interpretation and the trial result is not yet peer-reviewed; that status
    should be revisited when it is.
  proposed_experiments:
  - experiment_id: ibm_klrg1_trial_peer_reviewed_publication
    name: Peer-reviewed publication of the anti-KLRG1 MUSCLE trial with target engagement
    description: >-
      Publish the full MUSCLE (ulviprubart, NCT05721573) dataset in the
      peer-reviewed literature, reporting functional outcomes alongside
      confirmed pharmacodynamic depletion of KLRG1+ T cells in blood and muscle.
      The topline result is already announced as negative in the overall
      population, so the decisive remaining question is whether the effector
      population was actually cleared from muscle.
    would_support:
    - >-
      A null functional result together with documented near-complete depletion
      of muscle-invading KLRG1+ T cells would be strong evidence against the
      autoimmune-primary model, since the mechanism was engaged and the disease
      progressed anyway.
    would_refute:
    - >-
      A null functional result with poor muscle-compartment depletion would
      leave the autoimmune-primary model intact and reframe the trial as a
      pharmacokinetic rather than a mechanistic failure.
  - experiment_id: ibm_paired_biopsy_temporal_ordering
    name: Longitudinal paired-biopsy ordering of the two arms
    description: >-
      Serial paired muscle biopsies measuring TDP-43 cryptic exon burden
      alongside quantified cytotoxic T cell infiltration in the same patients
      over time.
    decision_criterion: >-
      Whichever readout rises first, and predicts subsequent change in the
      other, identifies the upstream arm.
  evidence:
  - reference: PMID:35044790
    reference_title: "Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a xenograft model of sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sporadic inclusion body myositis (IBM) is the most common acquired muscle
      disease in adults over age 50, yet it remains unclear whether the disease
      is primarily driven by T cell-mediated autoimmunity.
    explanation: >-
      Explicitly states the controversy as an open question in the primary
      literature.
- discussion_id: ibm_amyloid_beta_specificity
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are amyloid-beta and its precursor APP abnormally and specifically present
    in inclusion body myositis muscle, and if some amyloid-beta is genuinely
    present, is it a cause of myofibre injury or a downstream marker?
  attaches_to:
  - pathophysiology#Amyloid-beta and APP Accumulation in Myofibres
  - pathophysiology#Autophagy-Lysosome Failure and Rimmed Vacuole Formation
  rationale: >-
    The two halves of the claim have different answers and should not be
    resolved together.

    SPECIFICITY is settled in the negative. Amyloid-positive, ubiquitinated
    filamentous rimmed vacuoles indistinguishable from those of IBM occur in
    long-standing denervation after poliomyelitis and in congenital myopathies
    of children, so the finding indexes chronic myofibre injury rather than IBM.
    Oculopharyngeal muscular dystrophy is not part of this argument: it shares
    the ubiquitinated filamentous inclusions, but the single study here that
    applied a beta-amyloid antibody to it found labelling in IBM and not in
    OPMD, so it is used below only as an experimental control arm.
    Quantitatively the marker performs
    poorly: in the series that compared markers head to head, sarcoplasmic
    TDP-43 was present in 23% of IBM myofibres while focal beta-amyloid
    immunoreactivity was present in 0.00% and Congo-red material in 0.57%.
    TDP-43 mislocalization has displaced amyloid as the specific molecular
    signature of IBM.

    ABNORMAL PRESENCE remains genuinely open, and is the reason this discussion
    is filed as a CONTROVERSY rather than closed. Immunoblot and ADDL data
    reporting Abeta oligomers in every IBM sample and no control exist and have
    not been formally retracted or directly rebutted, but they issue almost
    entirely from the laboratory that proposed the hypothesis; the corresponding
    negative is largely an absence — unbiased laser-capture proteomics of rimmed
    vacuoles does not report amyloid-beta or APP among 213 enriched proteins —
    and absence of detection in a spectral-count experiment is weak evidence of
    absence for a small, aggregation-prone, poorly soluble peptide. What makes
    the open question tractable is that nobody has run the decisive experiment:
    a blinded, multi-centre, targeted mass-spectrometric quantification of
    amyloid-beta peptides in IBM versus disease-control muscle.

    Two further considerations bear on how much weight the existing literature
    can carry. The companion phospho-tau claim was shown to rest on antibodies
    that stain normal myonuclei and bind proteins other than tau, which impugns
    the reagent class the histological arm depended on; and a citation-network
    analysis taking this precise belief as its subject found its authority built
    by citation bias, amplification and invention rather than by data. Both
    argue for resolving the question with orthogonal, antibody-independent
    methods rather than with more immunohistochemistry.
  proposed_experiments:
  - experiment_id: ibm_targeted_ms_amyloid_quantification
    name: Blinded targeted mass-spectrometric quantification of amyloid-beta in IBM versus disease-control muscle
    description: >-
      Parallel reaction monitoring or immunoprecipitation-mass spectrometry with
      stable-isotope-labelled Abeta40/Abeta42 internal standards, applied to
      whole muscle lysates and to laser-captured rimmed vacuoles, from IBM,
      polymyositis, dermatomyositis, chronically denervated, oculopharyngeal
      muscular dystrophy and age-matched normal muscle, with samples blinded and
      analysed in more than one laboratory. This is antibody-independent and so
      is not vulnerable to the cross-reactivity that undermined the
      immunohistochemical literature.
    would_support:
    - >-
      Quantifiable Abeta42 above disease controls, in IBM muscle, reproduced
      across laboratories, would establish abnormal presence and reopen the
      question of whether it is specific and upstream.
    would_refute:
    - >-
      Abeta peptides at or below disease-control levels, with adequate
      sensitivity demonstrated on spiked standards, would close the abnormal
      presence claim and retire the hypothesis outright.
  - experiment_id: ibm_lcm_ms_peptide_library_reinterrogation
    name: Targeted re-interrogation of existing rimmed-vacuole LCM-MS peptide libraries for APP and amyloid-beta
    description: >-
      Re-query the already-acquired laser-capture mass-spectrometry peptide
      libraries from the rimmed-vacuole proteomics study for APP and
      amyloid-beta peptides specifically, reporting detection limits and
      spiked-standard sensitivity. The published analysis reports 213 enriched
      proteins but does not state whether these peptides were sought, so "not
      reported" cannot currently be read as "absent".
    would_support:
    - >-
      Detection of APP or amyloid-beta peptides enriched in rimmed vacuoles
      would restore a constituent role for amyloid in the defining lesion.
    would_refute:
    - >-
      Confirmed non-detection at a demonstrated spiked-standard sensitivity
      would convert the present silence in the published analysis into a real
      negative. This is far cheaper than a new prospective study and should
      precede one.
  - experiment_id: ibm_independent_abeta_oligomer_replication
    name: Independent replication of the Abeta oligomer immunoblot result
    description: >-
      Replication of the Abeta-dimer/trimer/tetramer and ADDL immunoblot
      findings in an independent laboratory with pre-registered antibodies,
      peptide-competition controls, and disease controls that include
      chronically denervated and oculopharyngeal muscular dystrophy muscle
      rather than normal muscle alone.
    would_support:
    - >-
      Reproduction of the oligomer signal in IBM but not in chronic-denervation
      or OPMD controls would restore the hypothesis to ALTERNATIVE status.
    would_refute:
    - >-
      Failure to reproduce the signal, or an equal signal in the chronic-injury
      controls, would confirm the DEPRECATED assessment.
  - experiment_id: ibm_amyloid_burden_versus_progression
    name: Amyloid burden against clinical progression
    description: >-
      Test whether quantified muscle amyloid-beta burden at biopsy predicts
      subsequent rate of functional decline, independently of T cell infiltrate
      density and TDP-43 cryptic exon burden, in a prospectively followed
      cohort.
    would_support:
    - >-
      An association between amyloid burden and subsequent decline that
      survives adjustment for T cell infiltrate density and TDP-43 cryptic exon
      burden would support a causal role even at low fibre frequency.
    would_refute:
    - >-
      No independent association would confirm amyloid as a bystander marker of
      chronic fibre injury.
  evidence:
  - reference: PMID:19533646
    reference_title: "Sarcoplasmic redistribution of nuclear TDP-43 in inclusion body myositis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of as little as >1% of myofibers with nonnuclear sarcoplasmic
      TDP-43 was highly sensitive (91%) and specific (100%) to IBM among 50
      inflammatory myopathy patient samples
    explanation: >-
      Establishes the marker that displaced amyloid-beta: TDP-43
      mislocalization, not amyloid, carries the diagnostic specificity that the
      amyloid hypothesis claimed.
  - reference: PMID:9781653
    reference_title: "Rimmed vacuoles with beta-amyloid and ubiquitinated filamentous deposits in the muscles of patients with long-standing denervation (postpoliomyelitis muscular atrophy): similarities with inclusion body myositis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The chronicity of the underlying disease, rather than the cause, may lead
      to vacuolar formation, amyloid deposition, and accumulation of
      ubiquitinated filaments.
    explanation: >-
      States the alternative reading directly: amyloid deposition indexes
      chronicity of muscle injury and is therefore not specific to IBM.
  - reference: PMID:20711838
    reference_title: "Novel demonstration of amyloid-β oligomers in sporadic inclusion-body myositis muscle fibers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dot-immunoblots using highly specific anti-ADDL monoclonal antibodies also
      showed highly increased ADDLs in all s-IBM biopsies studied, while
      controls were negative.
    explanation: >-
      The unrebutted positive result that keeps the abnormal-presence half of
      this controversy open; note the controls are normal and disease controls
      generally rather than the chronic-injury controls the specificity
      literature identifies as the relevant comparison.
- discussion_id: ibm_muscle_selectivity_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why are the quadriceps and the deep finger flexors selectively vulnerable in
    inclusion body myositis?
  attaches_to:
  - pathophysiology#Progressive Myofibre Degeneration and Selective Muscle Loss
  rationale: >-
    The weakness distribution is the single most reliable diagnostic feature of
    IBM and is unique among muscle diseases, yet no proposed mechanism explains
    it. Neither the HLA-restricted autoimmune arm nor the proteostasis and
    mitochondrial arms predict selective involvement of these particular
    muscles. Selective type 2 myofibre vulnerability and a functional
    denervation program have been demonstrated at the transcriptomic level, but
    these are fibre-type rather than muscle-group explanations and do not
    account for the specific anatomical pattern.
  proposed_experiments:
  - experiment_id: ibm_affected_vs_spared_transcriptomics
    name: Affected-versus-spared muscle transcriptomic comparison
    description: >-
      Comparative single-nucleus and spatial transcriptomics of affected
      (quadriceps, flexor digitorum profundus) versus clinically spared muscles
      sampled from the same patients.
    decision_criterion: >-
      Identification of muscle-group-intrinsic transcriptional programs that
      segregate with clinical involvement independently of fibre type would
      supply the missing determinant of selectivity.
  - experiment_id: ibm_regional_lesion_burden_mapping
    name: Regional molecular lesion burden mapping
    description: >-
      Quantify somatic mtDNA deletion burden and TDP-43 cryptic exon load across
      affected versus spared muscle groups in the same individuals.
    decision_criterion: >-
      A gradient of lesion burden tracking clinical involvement would place the
      selectivity determinant within the degenerative arm rather than the immune
      arm.
  evidence:
  - reference: PMID:38834884
    reference_title: "Cell type mapping of inflammatory muscle diseases highlights selective myofiber vulnerability in inclusion body myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, causal factors and molecular drivers of IBM progression are
      largely unknown.
    explanation: >-
      Confirms that the molecular drivers underlying IBM progression, including
      the selective pattern of muscle involvement, remain unexplained.
- discussion_id: ibm_no_faithful_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can any available experimental model reproduce sporadic IBM faithfully
    enough to establish drug efficacy, given that no animal model recapitulates
    the combination of HLA-restricted clonal autoimmunity, aging stroma,
    selective muscle distribution and decade-long progression?
  attaches_to:
  - pathophysiology#Clonal Expansion of Highly Differentiated Cytotoxic CD8+ T Cells
  rationale: >-
    VCP-mutant mice model hereditary VCP multisystem proteinopathy, not sporadic
    IBM, and were nonetheless part of the preclinical rationale for arimoclomol,
    which subsequently failed in humans. The human muscle xenograft model is the
    closest available system and reproduces both inflammatory and degenerative
    features, but it is short-term and cannot capture years-long progression.
    Cultured myoblasts cannot recreate chronic HLA-restricted immunity or aging
    stroma. This model gap is a plausible contributor to the repeated
    translational failures in IBM and should temper confidence in any mechanism
    supported only by model-system evidence.
  proposed_experiments:
  - experiment_id: ibm_xenograft_autologous_t_cell_reconstitution
    name: Autologous T cell reconstitution of the IBM muscle xenograft
    description: >-
      Extend the human IBM muscle xenograft model with autologous
      reconstitution of the patient's clonal KLRG1+ T cell population.
    would_support:
    - >-
      De novo emergence of degenerative pathology in previously unaffected
      grafted muscle would establish that the immune arm is sufficient to
      initiate degeneration.
    would_refute:
    - >-
      Absence of new degenerative pathology despite robust T cell engraftment
      would indicate the immune arm is not sufficient.
  - experiment_id: ibm_xenograft_prospective_benchmarking
    name: Prospective xenograft benchmarking of candidate therapies
    description: >-
      Test candidate therapies against the human muscle xenograft model before
      committing to phase 3 trials, using TDP-43 cryptic exon burden as a
      molecular endpoint.
    decision_criterion: >-
      Concordance between xenograft molecular response and subsequent human
      trial outcomes would qualify the model as a translational filter; repeated
      discordance would confirm the model gap.
  evidence:
  - reference: PMID:35044790
    reference_title: "Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a xenograft model of sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To determine the role of T cells in pathogenesis, we generated a xenograft
      model by transplanting human IBM muscle into the hindlimb of
      immunodeficient mice.
    explanation: >-
      Describes the human-muscle xenograft as the model developed precisely
      because no conventional animal model of sporadic IBM exists.
  - reference: PMID:37739573
    reference_title: "Safety and efficacy of arimoclomol for inclusion body myositis: a multicentre, randomised, double-blind, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arimoclomol is an oral co-inducer of the cellular heat shock response that
      was safe and well-tolerated in a pilot study of inclusion body myositis,
      reduced key pathological markers of inclusion body myositis in two
      in-vitro models representing degenerative and inflammatory components of
      this disease, and improved disease pathology and muscle function in mutant
      valosin-containing protein mice.
    explanation: >-
      Documents a case where in-vitro and VCP-mutant-mouse efficacy did not
      translate to human benefit, illustrating the model-fidelity problem.
notes: >-
  Entity boundary: this entry covers sporadic inclusion body myositis
  (MONDO:0007827) only. The hereditary inclusion body myopathies are separate
  diseases with separate entries or scope: GNE myopathy, VCP-associated
  multisystem proteinopathy, and inclusion body myopathy with Paget disease of
  bone and frontotemporal dementia. They share rimmed vacuole and aggregate
  pathology but lack the endomysial inflammation, MHC class I upregulation and
  characteristic weakness distribution of sporadic IBM, and they are monogenic.
  Deep-research reports for this entry were screened for named entity confusion
  against this boundary.
datasets:
- accession: geo:GSE227124
  title: Plasma cell infiltrate populating the muscle tissue of patients with inclusion body myositis feature distinct BCR repertoire properties

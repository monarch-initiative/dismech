  title: Cell type mapping of inflammatory muscle diseases highlights selective myofiber vulnerability in inclusion body myositis
  description: Inclusion body myositis (IBM) is the most prevalent inflammatory muscle disease in older adults with no effective therapy available. In contrast to other inflammatory myopathies like subacute immune-mediated necrotizing myopathy (IMNM), IBM follows a chronic disease course with both inflammatory and degenerative features of pathology. Moreover, causal factors and molecular drivers of IBM progression are largely unknown. Therefore, we paired single-nucleus RNA sequencing with spatial transcriptomics from patient muscle biopsies to map cell type-specific drivers underlying IBM pathogenesis compared to IMNM muscles and non-inflammatory skeletal muscle samples.

    releases (24 February 2026 topline; detailed data presented 26 March 2026),
    which are NOT peer-reviewed and are NOT yet posted as results on
    ClinicalTrials.gov (the registry record still reports hasResults=false as of
    the 2026-01-29 last update). It is therefore recorded here as a note rather
    than as a snippet-validated evidence item, per the repository rule that an
    unquotable claim belongs in notes. The subgroup trend must NOT be read as
    efficacy: it is a subgroup analysis in a trial that missed its primary
    endpoint. Replace this note with proper evidence when the peer-reviewed
    publication or registry results appear.

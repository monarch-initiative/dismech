    curated fact. Amyloid-beta immunoreactivity is detectable in only a very
    small minority of IBM myofibres and in one quantitative series in none at
    all, it is not specific to IBM (the same amyloid-positive filamentous
    vacuoles occur in chronic denervation and in congenital childhood
    myopathies), unbiased proteomics of rimmed vacuoles
    does not report it as an enriched constituent, and cultured IBM myofibres do
    not accumulate APP. Any real amyloid-beta present is best read as one
    constituent of the aggregate pathology captured by the
    `Autophagy-Lysosome Failure and Rimmed Vacuole Formation` node rather than
    as a specific or upstream driver. No IBM therapeutic has targeted it.

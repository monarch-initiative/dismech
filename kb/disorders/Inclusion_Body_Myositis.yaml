  description: >-
    A monoclonal antibody designed to deplete highly differentiated KLRG1+
    cytotoxic T cells while sparing naive and regulatory compartments, directly
    targeting the effector population identified as pathogenic in IBM. The
    registrational phase 2/3 MUSCLE trial (NCT05721573, 272 participants,
    primary endpoint IBMFRS change at week 76) completed in November 2025.
    Sponsor topline announcements report that the trial did NOT meet its primary
    endpoint or key secondary endpoints in the overall population, with
    favourable trends limited to a mild-to-moderate disease subgroup. This is
    the most direct test of the autoimmune-primary hypothesis conducted to date
    and its failure is meaningful negative evidence for that model. See notes
    for the important provenance caveat.
  notes: >-

phenotypes:
- name: Deep Finger Flexor Weakness
  category: Musculoskeletal
  description: >-
    Selective, often asymmetric weakness and atrophy of the deep finger flexors
    (flexor digitorum profundus) producing loss of grip strength and fine hand
    function. Together with quadriceps weakness this is the defining clinical
    signature of IBM and distinguishes it from other inflammatory myopathies.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Deep finger flexor weakness
    term:
      id: HP:0031177
      label: Finger flexor weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical clinical phenotype is characterized by prominent involvement
      of deep finger flexors and quadriceps muscles.
    explanation: >-
      Establishes deep finger flexor involvement as part of the typical, i.e.
      very frequent, clinical phenotype of IBM.
  - reference: PMID:30837708
    reference_title: "Inclusion body myositis: clinical features and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its clinical features (finger flexor and quadriceps weakness) and
      pathological features (invasion of myofibres by cytotoxic T cells) are
      unique among muscle diseases.
    explanation: >-
      Confirms finger flexor weakness as a defining and disease-specific
      clinical feature.
- name: Quadriceps Weakness
  category: Musculoskeletal
  description: >-
    Early, often asymmetric weakness and atrophy of the knee extensors, causing
    knee buckling, difficulty rising from a chair or climbing stairs, and falls.
    Progressive quadriceps failure is the principal driver of loss of ambulation.
  frequency: VERY_FREQUENT
  diagnostic: true

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inclusion body myositis (IBM) belongs to the group of idiopathic
      inflammatory myopathies and is characterized by a slowly progressive
      disease course with asymmetric muscle weakness of predominantly the finger
      flexors and knee extensors.
    explanation: >-

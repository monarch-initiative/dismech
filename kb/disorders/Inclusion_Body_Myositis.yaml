name: Inclusion Body Myositis
creation_date: '2026-07-30T00:00:00Z'
category: Autoimmune
parents:
- Inflammatory Myopathy
- Autoimmune Disease
disease_term:
  preferred_term: Sporadic Inclusion Body Myositis
  term:
    id: MONDO:0007827
    label: inclusion body myositis
synonyms:
- sporadic inclusion body myositis
- sIBM
- IBM
description: >-
  Sporadic inclusion body myositis (sIBM) is the most common acquired myopathy
  after age 50. It is characterized by slowly progressive, frequently asymmetric
  weakness with a distinctive predilection for the knee extensors (quadriceps)
  and the deep finger flexors, together with frequent oropharyngeal dysphagia.
  Muscle biopsy shows a unique combination of an inflammatory component
  (clonally expanded, highly differentiated cytotoxic CD8+ T cells invading
  non-necrotic fibres that overexpress MHC class I) and a degenerative component
  (rimmed vacuoles, p62/TDP-43 protein aggregates, COX-negative fibres). Unlike
  the other idiopathic inflammatory myopathies it is refractory to
  corticosteroids and conventional immunosuppression, and no disease-modifying
  drug therapy is established. Sporadic IBM must be distinguished from the
  hereditary inclusion body myopathies (GNE myopathy, VCP multisystem
  proteinopathy), which share degenerative biopsy features but lack the
  characteristic inflammation and weakness distribution.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
mechanistic_hypotheses:
- hypothesis_group_id: autoimmune_primary
  hypothesis_label: >-
    IBM is primarily a T cell-mediated autoimmune disease; protein aggregation
    is a downstream or secondary marker
  status: CANONICAL
  description: >-
    The dominant contemporary model holds that clonally expanded, highly
    differentiated cytotoxic CD8+ T cells are the primary pathogenic effectors,
    and that the degenerative pathology (rimmed vacuoles, aggregates) is
    downstream of, or secondary to, chronic immune injury. Supporting arguments
    are the HLA association, the circulating anti-cN1A autoantibody, the marked
    cytotoxic T cell transcriptomic signature, the clonality and persistence of
    the effector population, and the observation that invasion of non-necrotic
    fibres is far more frequent than amyloid-containing fibres. The treatment
    refractoriness is explained on this model by the effector cells being
    terminally differentiated and resistant to conventional immunotherapy
    rather than by the disease being non-immune.
  evidence:
  - reference: PMID:30837708
    reference_title: "Inclusion body myositis: clinical features and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings from the past decade that implicate autoimmunity in IBM include
      the identification of a circulating autoantibody (anti-cN1A); the absence
      of any statistically significant genetic risk factor other than the common
      autoimmune disease 8.1 MHC haplotype in whole-genome sequencing studies;
      the presence of a marked cytotoxic T cell signature in gene expression
      studies; and the identification in muscle and blood of large populations
      of clonal highly differentiated cytotoxic CD8+ T cells that are resistant
      to many immunotherapies.
    explanation: >-
      Enumerates the principal lines of evidence marshalled in support of the
      autoimmune-primary model.
- hypothesis_group_id: degeneration_primary
  hypothesis_label: >-
    IBM is primarily a cell-autonomous degenerative myopathy with secondary or
    non-essential inflammation
  status: ALTERNATIVE
  description: >-
    A competing model holds that cell-autonomous myofibre degeneration
    (proteostasis failure, TDP-43 loss of function, mitochondrial damage) drives
    the disease and that the inflammatory infiltrate, while conspicuous, is not
    the essential driver. The strongest direct evidence is the IBM muscle
    xenograft experiment in which depleting human T cells suppressed myofibre
    MHC class I upregulation but left rimmed vacuoles and TDP-43 loss of
    function intact. The consistent failure of immunosuppression to alter
    functional decline is the main clinical argument. Note that this model is
    not mutually exclusive with the autoimmune-primary model; both arms are
    likely to operate, and the disputed question is which is upstream.
  evidence:
  - reference: PMID:35044790
    reference_title: "Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a xenograft model of sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reduction of human T cells within IBM xenografts by treating mice
      intraperitoneally with anti-CD3 (OKT3) suppressed MHC-I up-regulation.
      However, rimmed vacuoles and loss of TDP-43 function persisted. These data
      suggest that T cell depletion does not alter muscle degenerative pathology
      in IBM.
    explanation: >-
      Direct experimental dissociation of the degenerative arm from T cell
      activity in a human-muscle xenograft, the key evidence for the
      degeneration-primary model.
- hypothesis_group_id: amyloid_beta_proteotoxicity
  hypothesis_label: >-
    Amyloid-beta and its precursor APP are abnormally and specifically
    over-produced in IBM myofibres and are the upstream proteotoxic driver of
    the disease
  status: DEPRECATED
  description: >-
    Proposed by Askanas and Engel from the early 1990s, this model cast sporadic
    IBM as a muscle analogue of Alzheimer disease: increased APP transcription
    in vacuolated fibres leads to intracellular accumulation of APP and its
    proteolytic fragment amyloid-beta, preferentially the more aggregation-prone
    Abeta42, whose soluble oligomers are cytotoxic and sit upstream of tau
    phosphorylation, oxidative stress, proteasome inhibition, ER stress and
    vacuolar degeneration. It was the dominant degenerative account of IBM for
    roughly two decades and supplied the rationale for the Congo red / amyloid
    criterion in older diagnostic schemes.

    It is recorded here as DEPRECATED, and the two claims embedded in the label
    fail for different reasons.

    The claim of SPECIFICITY fails outright: beta-amyloid-immunoreactive,
    Congo-red-positive rimmed vacuoles with tubulofilaments occur in
    long-standing denervation (postpoliomyelitis muscular atrophy) and in
    congenital myopathies of childhood, so the finding tracks chronicity of
    fibre injury rather than IBM itself. (Oculopharyngeal muscular dystrophy is
    deliberately excluded from this list: it shares the ubiquitinated
    filamentous inclusions, but the one study here that stained it for
    beta-amyloid found labelling in IBM and not in OPMD.) Comparative
    quantification puts the point sharply: in the same
    biopsies in which sarcoplasmic TDP-43 marked 23% of myofibres, focal
    beta-amyloid immunoreactivity (R1282) was found in 0.00% and fluorescent
    Congo red material in 0.57%. TDP-43 mislocalization, not amyloid, is now the
    sensitive and specific molecular marker of IBM.

    The claim of ABNORMAL PRESENCE is weaker than the literature suggests rather
    than plainly false. Positive immunoblot and ADDL data exist, but almost
    entirely from the originating laboratory; unbiased laser-capture mass
    spectrometry of rimmed vacuoles recovered 213 enriched proteins dominated by
    protein-folding and autophagy machinery without reporting amyloid-beta or
    APP enrichment; cultured IBM myotubes from the same laboratory do not
    accumulate betaAPP, so any accumulation is not cell-autonomous; the
    companion phospho-tau claim was shown to rest on antibodies that stain
    normal myonuclei and recognize proteins other than tau, which impugns the
    reagent class the histological arm depended on; and a formal citation-network
    analysis of the entire literature on this belief found its authority
    inflated by citation bias, amplification and invention rather than by
    accumulated data.

    What survives is modest and is retained in the entry: protein aggregates of
    several kinds, amyloid-beta among them, are demonstrable in a small minority
    of IBM myofibres and are best read as a marker of overwhelmed proteostasis
    (see the `Autophagy-Lysosome Failure and Rimmed Vacuole Formation` node)
    rather than as a specific or upstream cause. Neither of the two live models
    for IBM requires amyloid-beta, and no anti-amyloid therapeutic strategy has
    been taken into IBM trials.
  evidence:
  - reference: PMID:8394158
    reference_title: "beta-Amyloid precursor protein mRNA is increased in inclusion-body myositis muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vacuolated muscle fibers in muscle biopsies of 8 out of 8 inclusion body
      myositis (IBM) patients, including 2 hereditary patients, manifested
      increased mRNA for the beta-amyloid precursor protein (beta APP) that
      contains Kunitz-type protease inhibitor motif.
    explanation: >-
      The founding observation of the hypothesis: increased APP transcript in
      vacuolated IBM fibres, offered as evidence that APP accumulation is
      generated locally rather than deposited.
  - reference: PMID:16432144
    reference_title: "Inclusion-body myositis: a myodegenerative conformational disorder associated with Abeta, protein misfolding, and proteasome inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In s-IBM, abnormal accumulation of the amyloid-beta (Abeta) precursor
      protein and its proteolytic fragment, Abeta, associated with the aging
      intracellular milieu of the muscle fiber, appear to be key upstream
      pathogenic events.
    explanation: >-
      The canonical statement of the hypothesis by its originators, asserting
      APP/Abeta accumulation as the key upstream pathogenic event.
  - reference: PMID:20711838
    reference_title: "Novel demonstration of amyloid-β oligomers in sporadic inclusion-body myositis muscle fibers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report for the first time that in s-IBM muscle biopsies Aβ-dimer,
      -trimer, and -tetramer are identifiable by immunoblots. While all the
      s-IBM samples we studied had Aβ-oligomers, their molecular weights and
      intensity varied between the patient samples. None of the control muscle
      biopsies had Aβ oligomers.
    explanation: >-
      The strongest biochemical evidence offered for the hypothesis, and the
      closest thing to a direct test of abnormal presence; it reports oligomers
      in every IBM sample and none in controls, but comes from the originating
      laboratory and has not been widely replicated independently.
  - reference: PMID:19533646
    reference_title: "Sarcoplasmic redistribution of nuclear TDP-43 in inclusion body myositis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found TDP-43 sarcoplasmic immunoreactivity in 23% of IBM myofibers,
      while other reported IBM biomarkers were less frequent, with rimmed
      vacuoles in 2.8%, fluorescent Congo red material in 0.57%, SMI-31
      immunoreactivity in 0.83%, and focal R1282 beta-amyloid immunoreactivity
      in 0.00% of myofibers.
    explanation: >-
      Head-to-head quantification in the same biopsies: beta-amyloid
      immunoreactivity was detected in no myofibres at all, while TDP-43
      mislocalization marked 23%. Directly refutes amyloid-beta as the
      characteristic or specific molecular lesion of IBM.
  - reference: PMID:9781653
    reference_title: "Rimmed vacuoles with beta-amyloid and ubiquitinated filamentous deposits in the muscles of patients with long-standing denervation (postpoliomyelitis muscular atrophy): similarities with inclusion body myositis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that vacuolated muscle fibers containing filamentous
      inclusions positive for amyloid and ubiquitin are not unique to IBM and
      the other vacuolar myopathies but can also occur in a chronic neurogenic
      condition, such as postpoliomyelitis.
    explanation: >-
      Refutes the specificity claim directly: identical amyloid-positive
      ubiquitinated filamentous vacuoles arise in chronic denervation, so the
      finding tracks chronicity of fibre injury rather than IBM.
  - reference: PMID:16788822
    reference_title: "Rimmed vacuoles with beta-amyloid and tau protein deposits in the muscle of children with hereditary myopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our studies demonstrate for the first time that the full morphological
      phenotype of IBM including beta-amyloid and tau protein deposits may also
      develop in children, and that congenital, probably genetic, muscle defects
      may lead to abnormal protein aggregation in IBM-like inclusions.
    explanation: >-
      Further refutes specificity, and removes ageing as a necessary condition:
      the complete beta-amyloid-plus-tau morphology occurs in congenital
      myopathy in children.
  - reference: PMID:8268725
    reference_title: "Ubiquitin and beta-amyloid-protein in inclusion body myositis (IBM), familial IBM-like disorder and oculopharyngeal muscular dystrophy: an immunocytochemical study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Labelling with anti-beta-amyloid-protein antibody was seen in a few fibres
      in IBM but not in the other two conditions. The structures labelled with
      this antibody have yet to be determined.
    explanation: >-
      Mixed: beta-amyloid labelling did discriminate IBM from OPMD and familial
      IBM-like disorder in this series, but only in a few fibres, and the
      authors explicitly decline to say what structure the antibody bound.
  - reference: PMID:10599804
    reference_title: "Cultured inclusion-body myositis muscle fibers do not accumulate beta-amyloid precursor protein and can be innervated."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Cultured muscle fibers from patients with sporadic inclusion-body myositis
      (s-IBM), similar to normal control muscle fibers, 1) did not have
      beta-amyloid precursor protein (betaAPP) immunoreactivity
    explanation: >-
      From the originating laboratory: IBM myotubes in culture do not accumulate
      betaAPP, so the accumulation is not a cell-autonomous property of the IBM
      myofibre and cannot be a primary intrinsic lesion.
  - reference: PMID:19626672
    reference_title: "Nature of \"Tau\" immunoreactivity in normal myonuclei and inclusion body myositis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antibodies previously reported to indicate abnormal accumulation of
      phosphorylated-tau in IBM myofibers react to normal myonuclei and
      recognize proteins other than tau.
    explanation: >-
      Refutes the companion phospho-tau limb of the Alzheimer-analogy model and
      demonstrates that the immunohistochemical reagent class on which the
      histological arm of the hypothesis rested can report protein accumulation
      that is not there.
  - reference: PMID:28009083
    reference_title: "Proteomics of rimmed vacuoles define new risk allele in inclusion body myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteins associated with protein folding and autophagy were the largest
      group represented.
    explanation: >-
      Unbiased laser-capture mass spectrometry of the rimmed vacuole itself
      returns a proteostasis-machinery signature; the paper reports 213 enriched
      proteins and does not report amyloid-beta or APP among them, which is what
      the hypothesis would predict to dominate.
  - reference: PMID:39757935
    reference_title: "Loss of TDP-43 Splicing Repression Occurs in Myonuclei of Inclusion Body Myositis Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, cryptic HDGFL2 immunoreactivity was absent in 197 muscle
      biopsies from a variety of disease controls, except for 2 patients with
      vacuolar myopathies.
    explanation: >-
      The positive counter-example to the specificity claim. A TDP-43-dependent
      cryptic HDGFL2 peptide was found in 79 of 122 IBM biopsies and was absent
      across 197 disease controls, demonstrating that a genuinely IBM-specific
      molecular marker exists and that it is not amyloid. Graded PARTIAL rather
      than REFUTE deliberately: this study never measures amyloid, so it
      displaces amyloid from the role of specific marker without directly
      testing amyloid's specificity.
  - reference: PMID:23496965
    reference_title: "Cell stress molecules in the skeletal muscle of GNE myopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mRNA-expression of APP, NCAM, iNOS, TNF-α and TGF-β was higher in GNE
      myopathy compared to controls, yet this was not statistically significant.
    explanation: >-
      A further non-specificity observation: APP is raised in GNE myopathy too,
      and its expression correlates with generic cell-stress and
      pro-inflammatory markers, consistent with a shared stress response rather
      than an IBM-specific lesion. Graded PARTIAL, not REFUTE, because the
      quoted APP elevation did not reach statistical significance; a null result
      cannot carry a refutation, and the significant finding here is the
      correlation with cell-stress markers rather than the elevation itself.
  - reference: PMID:21518451
    reference_title: "Expression of human amyloid precursor protein in the skeletal muscles of Drosophila results in age- and activity-dependent muscle weakness."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Muscles from transgenic animals did not display protein aggregates or
      structural abnormalities at the light or transmission electron microscopic
      levels.
    explanation: >-
      Cuts against the histological arm of the hypothesis. Human APP expressed
      in fly muscle produced age- and activity-dependent weakness with no
      aggregates at all, dissociating APP toxicity from amyloid deposition and
      implying that the deposits used as the diagnostic criterion are not the
      toxic species.
  - reference: PMID:19622839
    reference_title: "How citation distortions create unfounded authority: analysis of a citation network."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Unfounded authority was established by citation bias against papers that
      refuted or weakened the belief; amplification, the marked expansion of the
      belief system by papers presenting no data addressing it; and forms of
      invention such as the conversion of hypothesis into fact through citation
      alone.
    explanation: >-
      A formal citation-network analysis whose subject was precisely this belief
      about beta-amyloid in IBM. It does not measure muscle, but it explains why
      the apparent weight of literature behind the hypothesis overstates the
      underlying data, and is the reason this hypothesis is curated as
      DEPRECATED rather than merely ALTERNATIVE.
  notes: >-
    Retained rather than deleted because the hypothesis remains widely cited in
    reviews, textbooks and older diagnostic criteria, and curators encountering
    amyloid claims in the IBM literature need the assessment recorded rather
    than silently absent.
pathophysiology:
- name: HLA-Associated Autoimmune Susceptibility
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The HLA/MHC region carries by far the strongest genetic risk for sporadic
    IBM, with HLA-DRB1*03:01 (part of the 8.1 ancestral haplotype) the leading
    association. Fine-mapping attributes the risk to specific amino acid
    residues within the peptide-binding groove of the DR-beta 1 chain,
    implicating altered peptide presentation as the susceptibility mechanism.
    No non-HLA locus has reached genome-wide significance, and there is no
    Mendelian causal gene.
  biological_processes:
  - preferred_term: antigen processing and presentation via MHC class II
    term:
      id: GO:0002504
      label: antigen processing and presentation of peptide or polysaccharide antigen
        via MHC class II
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28086002
    reference_title: "Immune-Array Analysis in Sporadic Inclusion Body Myositis Reveals HLA-DRB1 Amino Acid Heterogeneity Across the Myositis Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The HLA region was confirmed as the most strongly associated region in IBM
    explanation: >-
      The largest immune-array genetic association study of IBM confirms the HLA
      region as the dominant risk locus.
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a study of 252 IBM patients, the class II MHC allele HLA-DRB1*03:01
      showed the most significant association with IBM, and that risk could be
      largely attributed to amino acids within the peptide-binding pocket.
    explanation: >-
      Localizes the HLA risk to peptide-binding-groove residues, supporting
      altered antigen presentation as the susceptibility mechanism.
  downstream:
  - target: Clonal Expansion of Highly Differentiated Cytotoxic CD8+ T Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HLA-restricted presentation of an as-yet-unidentified antigen is presumed
      to prime and sustain the pathogenic cytotoxic T cell population, but the
      inciting antigen is unknown.
    evidence:
    - reference: PMID:30837708
      reference_title: "Inclusion body myositis: clinical features and pathogenesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the absence of any statistically significant genetic risk factor other
        than the common autoimmune disease 8.1 MHC haplotype in whole-genome
        sequencing studies
      explanation: >-
        Establishes the 8.1 MHC haplotype as the sole significant genetic risk
        factor, which is what links this susceptibility node to the downstream T
        cell response. The intervening antigen remains unidentified, hence
        PARTIAL and an INDIRECT_UNKNOWN_INTERMEDIATES link type.
- name: Clonal Expansion of Highly Differentiated Cytotoxic CD8+ T Cells
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Large clonal populations of terminally differentiated, KLRG1-positive
    effector-memory and TEMRA CD8+ T cells accumulate in blood and muscle. These
    cells are minimally proliferative, persist over years, and in a majority of
    patients meet standard diagnostic criteria for T cell large granular
    lymphocytic leukaemia. Their terminally differentiated, apoptosis-resistant
    phenotype is the leading explanation for why IBM resists conventional
    immunosuppression, and it is the rationale for KLRG1-directed depleting
    therapy.
  cell_types:
  - preferred_term: KLRG1+ terminally differentiated cytotoxic CD8+ T cell
    term:
      id: CL:0000794
      label: CD8-positive, alpha-beta cytotoxic T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
    modifier: INCREASED
  evidence:
  - reference: PMID:31326977
    reference_title: "Highly differentiated cytotoxic T cells in inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a signature of T-cell cytotoxicity in inclusion body
      myositis muscle coupled with a signature of highly differentiated CD8
      T-cell effector memory and terminally differentiated effector cells
    explanation: >-
      Establishes the highly differentiated cytotoxic CD8+ T cell signature as a
      defining feature of IBM muscle.
  - reference: PMID:31326977
    reference_title: "Highly differentiated cytotoxic T cells in inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified the presence of KLRG1 on pathogenic inclusion body myositis
      muscle invading T cells and an increase in KLRG1 expressing T cells in
      inclusion body myositis blood
    explanation: >-
      Identifies KLRG1 as a surface marker of the pathogenic population in both
      muscle and blood, the basis for KLRG1-targeted therapy.
  - reference: PMID:35131904
    reference_title: "Immunophenotyping of Inclusion Body Myositis Blood T and NK Cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that a population of KLRG1+ Tem and TemRA were expanded in both
      the CD4+ and CD8+ T-cell subpopulations in patients with IBM.
    explanation: >-
      Independent flow-cytometric confirmation in 51 IBM patients that the
      KLRG1+ expansion is confined to highly differentiated memory compartments.
  - reference: PMID:26920676
    reference_title: "Association of inclusion body myositis with T cell large granular lymphocytic leukaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most (22/38; 58%) patients with inclusion body myositis had aberrant
      populations of large granular lymphocytes in their blood meeting standard
      diagnostic criteria for T cell large granular lymphocytic leukaemia. These
      T cell populations were clonal in 20/20 patients and stably present on
      follow-up testing in 15 patients a median of 350 days later.
    explanation: >-
      Demonstrates that the expanded cytotoxic population is clonal, persistent,
      and in most patients formally leukaemic, supporting a long-lived
      autonomous effector clone rather than a conventional activated response.
  downstream:
  - target: Cytotoxic T Cell Invasion of Non-Necrotic Myofibres
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoimmune_primary
    description: >-
      The expanded cytotoxic clone invades and attacks myofibres via
      perforin/granzyme-mediated cytotoxicity.
    evidence:
    - reference: PMID:26920676
      reference_title: "Association of inclusion body myositis with T cell large granular lymphocytic leukaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Muscle immunohistochemistry demonstrated invasion of large granular
        lymphocytes into muscle in 15/15 inclusion body myositis patients but in
        only 1/28 patients with dermatomyositis or polymyositis.
      explanation: >-
        Links the circulating clonal population directly to the myofibre-invading
        cells, and shows this is specific to IBM among inflammatory myopathies.
  - target: Refractoriness to Conventional Immunosuppression
    causal_link_type: DIRECT
    description: >-
      Terminally differentiated, minimally proliferative effector cells are
      intrinsically resistant to immunosuppressants that act on proliferating
      lymphocytes.
    evidence:
    - reference: PMID:31326977
      reference_title: "Highly differentiated cytotoxic T cells in inclusion body myositis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        diseased muscle-invading T cells are minimally or non-proliferative, in
        accordance with known properties of highly differentiated or terminally
        differentiated T cells
      explanation: >-
        The non-proliferative state of the effector cells provides the
        mechanistic basis for resistance to antiproliferative immunosuppression.
- name: Myofibre MHC Class I Overexpression
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Non-necrotic myofibres aberrantly and widely overexpress MHC class I on the
    sarcolemma and in the sarcoplasm, driven largely by interferon-gamma from
    the infiltrating T cells. This makes the fibre a target for CD8+ T cell
    recognition and is also a cell-intrinsic endoplasmic reticulum stressor.
    MHC class I upregulation is one of the few pathological features shown
    experimentally to be T cell-dependent.
  cell_types:
  - preferred_term: Skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: antigen processing and presentation via MHC class I
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
    modifier: INCREASED
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  evidence:
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histological features of IBM include rimmed vacuoles, protein aggregates,
      cytochrome oxidase (COX)-deficient fibers, MHC-I upregulation, and an
      endomysial inflammatory infiltrate containing autoaggressive CD8+ T cells
    explanation: >-
      Establishes MHC class I upregulation as a canonical histological feature
      of IBM alongside the degenerative markers.
  - reference: PMID:35044790
    reference_title: "Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a xenograft model of sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Myofibers in IBM xenografts showed invasion by human, oligoclonal CD8+ T
      cells and exhibited MHC-I up-regulation, rimmed vacuoles, mitochondrial
      pathology, p62-positive inclusions, and nuclear clearance and cytoplasmic
      aggregation of TDP-43, associated with cryptic exon inclusion.
    explanation: >-
      The xenograft model recapitulates MHC-I upregulation together with the full
      degenerative phenotype, and the same study shows this feature is T
      cell-dependent.
  downstream:
  - target: Cytotoxic T Cell Invasion of Non-Necrotic Myofibres
    causal_link_type: DIRECT
    hypothesis_groups:
    - autoimmune_primary
    description: >-
      MHC class I presentation on non-necrotic fibres is the substrate for CD8+
      T cell recognition and attack.
    evidence:
    - reference: PMID:29611059
      reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-

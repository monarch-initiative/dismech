biochemical:
- name: Anti-cN1A (NT5C1A) Autoantibody
  notes: >-
    Autoantibodies against cytosolic 5'-nucleotidase 1A (cN1A / NT5C1A / Mup44),
    the first and only myositis-associated autoantibody described in IBM.
    Reported sensitivity varies widely with assay and threshold (roughly
    33-70%) while specificity against other muscle diseases is high (about
    92-98%). A negative test does not exclude IBM, and anti-cN1A also occurs in
    Sjogren disease and lupus, so a positive result supports the diagnosis only
    in the appropriate clinical context. cN1A also accumulates in perinuclear
    regions and rimmed vacuoles in IBM muscle, potentially linking the
    autoimmune and degenerative arms of the disease.
  presence: PRESENT
  specificity: >-
    High specificity against other muscle diseases (approximately 92-98%
    depending on reactivity threshold), but anti-cN1A is also found in Sjogren
    disease and systemic lupus erythematosus.
  evidence:
  - reference: PMID:23460448
    reference_title: "Autoantibodies to cytosolic 5'-nucleotidase 1A in inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By immunoprecipitation of recombinant cN1A, high concentrations of
      anti-Mup44 autoantibodies were detected in 33% of sIBM patient sera,
      whereas their prevalence in dermatomyositis, polymyositis, and other
      neuromuscular disorders appeared to be rare (4.2%, 4.5%, and 3.2%,
      respectively).
    explanation: >-
      Original identification of the cN1A autoantigen, quantifying frequency in
      IBM against comparator neuromuscular diseases.
  - reference: PMID:23596012
    reference_title: "Cytosolic 5'-nucleotidase 1A autoimmunity in sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moderate reactivity of anti-cN1A autoantibodies was 70% sensitive and 92%
      specific, and high reactivity was 34% sensitive and 98% specific for the
      diagnosis of IBM.
    explanation: >-
      Provides the threshold-dependent sensitivity and specificity figures for
      anti-cN1A as a diagnostic test.
  - reference: PMID:23596012
    reference_title: "Cytosolic 5'-nucleotidase 1A autoimmunity in sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cN1A reactivity by immunohistochemistry accumulated in perinuclear regions
      and rimmed vacuoles in IBM muscle, localizing to areas of myonuclear
      degeneration.
    explanation: >-
      Localizes the autoantigen to the degenerative lesions themselves,
      supporting a link between the autoimmune and myodegenerative arms.
- name: TDP-43 Cryptic Exon Inclusion in Muscle
  notes: >-
    RT-PCR detection of cryptic exons arising from loss of TDP-43-mediated
    splicing repression in muscle tissue. In a 119-biopsy series this was 84%
    sensitive and 99% specific for IBM, making it the most disease-specific
    molecular readout yet described. It is a research assay, not a validated
    routine clinical diagnostic.
  presence: PRESENT
  evidence:
  - reference: PMID:35044790
    reference_title: "Loss of TDP-43 function and rimmed vacuoles persist after T cell depletion in a xenograft model of sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 119 muscle biopsies tested, RT-PCR-mediated detection of cryptic exon
      inclusion was able to diagnose IBM with 84% sensitivity and 99%
      specificity.
    explanation: >-
      Quantifies the diagnostic performance of cryptic exon detection in a large
      biopsy series.
genetic:
- name: HLA-DRB1
  notes: >-
    HLA-DRB1*03:01, carried on the 8.1 ancestral haplotype, is the strongest
    genetic risk factor for sporadic IBM. High-resolution genotyping refines the
    association to DRB1*03:01:01 and implicates arginine-74 of the DR-beta 1
    chain. This is common susceptibility variation of moderate effect, not a
    Mendelian causal gene; IBM has no causal gene and no established Mendelian
    inheritance. High-resolution sequencing additionally identifies
    DRB4*01:01:01 and DQA1*01:02:01 as protective, and shows the allele acts as
    an age-of-onset modifier: carriers of the risk genotype develop symptoms on
    average five years earlier.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  evidence:
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a study of 252 IBM patients, the class II MHC allele HLA-DRB1*03:01
      showed the most significant association with IBM, and that risk could be
      largely attributed to amino acids within the peptide-binding pocket.
    explanation: >-
      Establishes HLA-DRB1*03:01 as the leading susceptibility allele and
      localizes the effect to the peptide-binding pocket.
  - reference: PMID:38043487
    reference_title: "High-resolution HLA genotyping in inclusion body myositis refines 8.1 ancestral haplotype association to DRB1*03:01:01 and highlights pathogenic role of arginine-74 of DRβ1 chain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human Leukocyte Antigens (HLA) is the highest genetic risk factor for
      developing IBM.
    explanation: >-
      Confirms HLA as the dominant genetic risk factor; the same study refines
      the association to DRB1*03:01:01 and arginine-74 of the DR-beta 1 chain.
  - reference: PMID:28086002
    reference_title: "Immune-Array Analysis in Sporadic Inclusion Body Myositis Reveals HLA-DRB1 Amino Acid Heterogeneity Across the Myositis Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No association with anti-cytosolic 5'-nucleotidase 1A-positive status was
      found independent of HLA-DRB1*03:01.
    explanation: >-
      Shows the HLA signal does not stratify by anti-cN1A serostatus, relevant
      to whether seropositive IBM is a genetically distinct subgroup.
  - reference: PMID:38043487
    reference_title: High-resolution HLA genotyping in inclusion body myositis refines
      8.1 ancestral haplotype association to DRB1*03:01:01 and highlights pathogenic
      role of arginine-74 of DRbeta1 chain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, DRB4*01:01:01 and DQA1*01:02:01 were found to have protective
      effects; the carriers of DRB1*03:01:01 that did not possess these alleles
      had a fourteenfold increased risk of developing IBM over the general
      Caucasian population.
    explanation: >-
      Quantifies the risk conferred by DRB1*03:01:01 in the absence of the
      protective alleles, and identifies the protective haplotypes.
  - reference: PMID:38043487
    reference_title: High-resolution HLA genotyping in inclusion body myositis refines
      8.1 ancestral haplotype association to DRB1*03:01:01 and highlights pathogenic
      role of arginine-74 of DRbeta1 chain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, patients with the abovementioned genotype developed symptoms
      on average five years earlier than patients without.
    explanation: >-
      Establishes the HLA genotype as an age-of-onset modifier, not only a
      susceptibility factor.
- name: NT5C1A
  notes: >-
    NT5C1A encodes cytosolic 5'-nucleotidase 1A (cN1A / Mup44), the target
    autoantigen of the IBM-associated autoantibody. It is curated here as the
    autoantigen underpinning a diagnostic biomarker, not as a susceptibility or
    causal gene; no disease-associated NT5C1A coding variation has been
    established in IBM.
  relationship_type: BIOMARKER
  gene_term:
    preferred_term: NT5C1A
    term:
      id: hgnc:17819
      label: NT5C1A
  evidence:
  - reference: PMID:23596012
    reference_title: "Cytosolic 5'-nucleotidase 1A autoimmunity in sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoantibodies against cN1A are common in and highly specific to IBM among
      muscle diseases, and may provide a link between IBM's dual processes of
      autoimmunity and myodegeneration.
    explanation: >-
      Identifies cN1A (NT5C1A) as the IBM autoantigen and frames it as a
      candidate bridge between the autoimmune and degenerative arms.
- name: VCP and SQSTM1 (rare proteostasis variants)
  notes: >-
    Candidate gene sequencing has identified rare missense variants in
    proteostasis regulators including VCP and SQSTM1 in sporadic IBM cohorts.
    These are unvalidated risk contributors, not monogenic causes. Note the
    distinct entity boundary: pathogenic VCP variants cause VCP-associated
    multisystem proteinopathy / inclusion body myopathy with Paget disease of
    bone and frontotemporal dementia, which is a hereditary disease separate
    from sporadic IBM.
  relationship_type: DISPUTED
  evidence:
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Candidate gene sequencing identified rare missense variants in proteins
      regulating protein homeostasis including VCP and SQSTM1.
    explanation: >-
      Reports the rare proteostasis-gene variants; the same review notes only
      the HLA association has reached genome-wide significance, so these remain
      unvalidated.
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many variants have been reported at an increased frequency in IBM in small
      studies; however, only HLA association has shown genome-wide significance.
    explanation: >-
      Explicitly limits the confidence that can be placed in non-HLA candidate
      variants in IBM.
prevalence:
- population: Worldwide (meta-analysis of general-population studies)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.48
  rate_low: 2.0
  rate_high: 2.96
  notes: >-
    Meta-prevalence 24.8 per 1,000,000 (95% CI 20.0-29.6) across 9 studies,
    equivalent to 2.48 per 100,000. Reported estimates vary widely with
    ascertainment and diagnostic criteria.
  evidence:
  - reference: PMID:28505979
    reference_title: "A Systematic Review and Meta-Analysis of Prevalence Studies of Sporadic Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The meta-prevalence estimate from 9 papers was 24.8/1,000,000 (95% CI:
      20.0-29.6).
    explanation: >-
      Systematic review and meta-analysis of sIBM prevalence studies.
- population: Olmsted County, Minnesota, USA; residents aged 50 years and older
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 18.2
  notes: >-
    Highest reported sIBM prevalence to date; restricted to the population aged
    50 and over, which raises the estimate substantially relative to
    general-population figures.
  evidence:
  - reference: PMID:33879596
    reference_title: "Epidemiology and Natural History of Inclusion Body Myositis: A 40-Year Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    myopathy, IBM does not respond to glucocorticoids, methotrexate,
    azathioprine or most tested biologics. This is a defining clinical property
    of the disease and a diagnostic clue: steroid-refractory "polymyositis",
    particularly with finger-flexor or quadriceps selectivity, should prompt

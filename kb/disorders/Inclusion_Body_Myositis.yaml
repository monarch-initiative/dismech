      The prevalence of sIBM in 2010 was 18.20 per 100,000 people ≥50 years old.
    explanation: >-
      40-year population-based cohort giving an age-restricted prevalence
      estimate.
progression:
- notes: >-
    Onset is insidious, usually after age 45-50, with diagnostic delay commonly
    extending several years. The course is chronic and steadily progressive
    rather than relapsing-remitting; spontaneous or durable treatment-induced
    remission is not a feature. Most patients lose the ability to ambulate 10-15
    years after diagnosis. Longevity is mildly reduced, with aspiration
    pneumonia and respiratory complications the leading disease-related causes
    of death.
  evidence:
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sporadic Inclusion Body myositis (IBM) is the most common myopathy in
      individuals over the age of 50, and patients typically lose the ability to
      ambulate 10 to 15 years after diagnosis
    explanation: >-
      Quantifies the interval from diagnosis to loss of ambulation.
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, IBM mildly affects longevity with aspiration pneumonia and
      respiratory complications being the most common cause of death.
    explanation: >-
      Establishes the modest survival effect and the dominant causes of
      disease-related death.
  - reference: PMID:33879596
    reference_title: "Epidemiology and Natural History of Inclusion Body Myositis: A 40-Year Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with sIBM have similar risk of cancer, but slightly shorter life
      expectancy compared to matched patients without sIBM.
    explanation: >-
      Population-based confirmation of modestly reduced life expectancy and, in
      contrast to dermatomyositis, no excess cancer risk.
epidemiology:
- name: Age distribution and onset
  description: >-
    Sporadic IBM is a late-onset disease. Symptom onset is typically after age
    45-50 and it is the most common myopathy in people over 50; onset before 45
    is exceptional and should prompt reconsideration of a hereditary inclusion
    body myopathy. Diagnostic delay of several years from symptom onset is
    common because early quadriceps and finger-flexor weakness is easily
    attributed to ageing.
  notes: >-
    A male predominance of roughly 2:1 and a mean onset in the seventh decade
    are consistently reported in the deep-research literature but are NOT
    curated here as evidence, because no quotable statement of either figure
    appears in the abstracts cached for this entry. Add them when a source
    reporting them directly is fetched.
  evidence:
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inclusion body myositis (IBM) is a progressive muscle disease affecting
      patients over the age of 40, with distinctive clinical and
      histopathological features.
    explanation: >-
      Establishes the late-onset age distribution of the disease.
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sporadic Inclusion Body myositis (IBM) is the most common myopathy in
      individuals over the age of 50
    explanation: >-
      Positions IBM as the leading myopathy in the over-50 population, the
      demographic core of the disease.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    IBM causes progressive, irreversible loss of hand function and ambulation,
    with the majority of patients eventually wheelchair-dependent, plus
    dysphagia requiring feeding-tube support in a substantial minority. There is
    no disease-modifying therapy, so the entire burden accrues unmitigated over
    a course measured in decades.
  evidence:
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IBM is associated with marked morbidity as majority of patients eventually
      become wheelchair dependent with limited use of their hands and marked
      dysphagia.
    explanation: >-
      Directly characterizes the morbidity burden as marked and affecting
      mobility, hand function and swallowing.
diagnosis:
- name: ENMC Diagnostic Criteria for Inclusion Body Myositis
  description: >-
    Diagnosis rests on the characteristic weakness distribution combined with
    supportive laboratory, imaging, serological and biopsy findings. The 2013
    ENMC criteria were revised at the 272nd ENMC workshop (2023, published
    2024), which incorporated muscle MRI and ultrasound and anti-cN1A serology
    as diagnostic tools alongside the classical clinicopathological features.
  evidence:
  - reference: PMID:38522330
    reference_title: "272nd ENMC international workshop: 10 Years of progress - revision of the ENMC 2013 diagnostic criteria for inclusion body myositis and clinical trial readiness. 16-18 June 2023, Hoofddorp, The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel diagnostic tools include muscle imaging techniques such as MRI and
      ultrasound, and serological testing for cytosolic 5'-nucleotidase-1A
      antibodies.
    explanation: >-
      Documents the diagnostic modalities incorporated into the revised ENMC
      criteria.
  - reference: PMID:38522330
    reference_title: "272nd ENMC international workshop: 10 Years of progress - revision of the ENMC 2013 diagnostic criteria for inclusion body myositis and clinical trial readiness. 16-18 June 2023, Hoofddorp, The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report is composed of two parts, the first part providing new
      diagnostic criteria on which consensus was achieved.
    explanation: >-
      Confirms that the 272nd ENMC workshop produced consensus revised
      diagnostic criteria.
differential_diagnoses:
- name: Polymyositis
  description: >-
    Historically the most common misdiagnosis. Contemporary opinion holds that
    many cases labelled polymyositis are better classified as IBM,
    immune-mediated necrotizing myopathy or antisynthetase syndrome.
    Steroid-refractory "polymyositis", especially with finger-flexor or
    quadriceps selectivity, should prompt reassessment for IBM.
  disease_term:
    preferred_term: Polymyositis
    term:
      id: MONDO:0019127
      label: polymyositis
  distinguishing_features:
  - Selective deep finger flexor and quadriceps weakness in IBM
  - Rimmed vacuoles and p62/TDP-43 aggregates on biopsy in IBM, absent in polymyositis
  - Refractoriness to corticosteroids in IBM
  - Invasion of muscle by large granular lymphocytes in IBM but rarely in polymyositis
  evidence:
  - reference: PMID:26920676
    reference_title: "Association of inclusion body myositis with T cell large granular lymphocytic leukaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle immunohistochemistry demonstrated invasion of large granular
      lymphocytes into muscle in 15/15 inclusion body myositis patients but in
      only 1/28 patients with dermatomyositis or polymyositis.
    explanation: >-
      Provides a discriminating pathological feature between IBM and
      polymyositis/dermatomyositis.
- name: GNE Myopathy (hereditary inclusion body myopathy)
  description: >-
    An autosomal recessive hereditary myopathy that shares rimmed vacuoles and
    protein inclusions on biopsy but is a mechanistically distinct disease. It
    is the most important hereditary mimic of IBM and a recurring source of
    entity confusion.
  distinguishing_features:
  - Onset typically before age 40
  - Characteristic sparing of the quadriceps
  - Absence of endomysial inflammatory infiltrate and MHC class I upregulation
  - Autosomal recessive GNE variants identifiable
  evidence:
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For example, hIBM2 caused by autosomal recessive inheritance of mutations
      in the GNE gene typically spares the quadriceps, and biopsy shows rimmed
      vacuoles and protein inclusions but lacks inflammation.
    explanation: >-
      States the specific features distinguishing GNE myopathy from sporadic IBM.
- name: VCP-Associated Multisystem Proteinopathy
  description: >-
    Autosomal dominant VCP-related inclusion body myopathy with Paget disease of
    bone and frontotemporal dementia. Shares the rimmed vacuole and TDP-43
    pathology of IBM but is monogenic and multisystem.
  distinguishing_features:
  - Earlier onset and positive family history
  - Extramuscular features (Paget disease of bone, frontotemporal dementia, motor
    neuron disease)
  - Identifiable pathogenic VCP variant
  evidence:
  - reference: PMID:29611059
    reference_title: "New Developments in the Genetics of Inclusion Body Myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, mutations in known hIBM genes cause syndromes that share degenerative
      features on biopsy but otherwise are clinically distinct from IBM.
    explanation: >-
      Supports the general boundary between hereditary inclusion body myopathy
      genes (including VCP) and sporadic IBM; the snippet covers the class
      rather than VCP specifically.
- name: T Cell Large Granular Lymphocytic Leukaemia
  description: >-
    Not merely a mimic but a genuine overlap: the majority of IBM patients meet
    standard diagnostic criteria for T-LGL leukaemia on blood flow cytometry.
    This is better understood as a shared clonal cytotoxic T cell process than
    as a differential to exclude, and it can prompt inappropriate haematological
    workup if not recognized. Retained here because it is a real bedside
    diagnostic consideration, but the association itself is modelled properly in
    kb/comorbidities/com_Inclusion_Body_Myositis__T_Cell_Large_Granular_Lymphocytic_Leukemia.yaml,
    which is the authoritative record for it.
  distinguishing_features:
  - Large granular lymphocyte expansion is present in the majority of IBM patients
    and does not by itself indicate a separate haematological disease
  evidence:
  - reference: PMID:26920676
    reference_title: "Association of inclusion body myositis with T cell large granular lymphocytic leukaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most (22/38; 58%) patients with inclusion body myositis had aberrant
      populations of large granular lymphocytes in their blood meeting standard
      diagnostic criteria for T cell large granular lymphocytic leukaemia.
    explanation: >-
      Quantifies the overlap between IBM and formal T-LGL leukaemia criteria.
treatments:
- name: Resistance and Aerobic Exercise Therapy
  description: >-
    Individualized supervised resistance and aerobic exercise, with contracture
    prevention, energy conservation, orthoses, mobility aids and fall
    prevention. Exercise appears safe and may improve strength or conditioning,
    but consistent mobility benefit has not been demonstrated. Together with
    swallowing and respiratory surveillance this constitutes the mainstay of
    management.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monitoring for swallowing and respiratory complications, exercise, and
      addressing mobility issues are the mainstay of management.
    explanation: >-
      Establishes exercise and supportive monitoring as the standard of care in
      the absence of pharmacotherapy.
- name: Dysphagia Management
  description: >-
    Multidisciplinary swallowing care: periodic symptom screening,
    speech-language assessment, videofluoroscopy or endoscopy when indicated,
    texture and volume adaptation, nutrition support and aspiration precautions,
    with rehabilitative swallowing exercise protocols. Cricopharyngeal dilation,
    botulinum toxin injection or myotomy may help selected obstructive cases;
    myotomy is irreversible.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:37678324
    reference_title: "Update on the evaluation and management of dysphagia in sporadic inclusion body myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Small scale research and clinical anecdotal data support a
      multidisciplinary and multipronged patient-centered approach, including
      rehabilitative exercise protocols, for dysphagia management in IBM.
    explanation: >-
      Supports the multidisciplinary rehabilitative approach while indicating the
      evidence base is small-scale.
  - reference: PMID:37678324
    reference_title: "Update on the evaluation and management of dysphagia in sporadic inclusion body myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A paucity exists in the literature to effectively guide clinical
      decision-making for patients with IBM and dysphagia.
    explanation: >-
      Documents the weak evidence base underlying dysphagia management
      recommendations in IBM.
- name: Occupational Therapy and Assistive Devices
  description: >-
    Occupational therapy for the hand disability that follows deep finger flexor
    weakness: adaptive grip aids, built-up utensils, home modification and
    energy conservation. Ankle-foot orthoses for foot drop, and canes, walkers,
    wheelchairs and transfer devices as ambulation declines. Because there is no
    disease-modifying therapy, maintaining function and independence with
    assistive technology is a substantial part of actual care rather than an
    adjunct.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  evidence:
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monitoring for swallowing and respiratory complications, exercise, and
      addressing mobility issues are the mainstay of management.
    explanation: >-
      Establishes addressing mobility issues, which is what assistive devices
      and occupational therapy deliver, as a mainstay of IBM management.
  - reference: PMID:36237625
    reference_title: "Inclusion body myositis: Update on the diagnostic and therapeutic landscape."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IBM is associated with marked morbidity as majority of patients eventually
      become wheelchair dependent with limited use of their hands and marked
      dysphagia.
    explanation: >-
      Documents the hand-function and mobility disability that occupational
      therapy and assistive devices are directed at.
- name: Falls Prevention
  description: >-
    Structured fall-risk assessment, home safety modification, gait aids and
    balance work. Falls are a leading cause of injury in IBM and were the single
    most frequent adverse event across all arms of the RESILIENT trial,
    including placebo, which indicates the background rate in this population
    rather than a drug effect.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Frequent falls
    term:
      id: HP:0002359
      label: Frequent falls
  evidence:
  - reference: PMID:31397289
    reference_title: "Safety and efficacy of intravenous bimagrumab in inclusion body myositis (RESILIENT): a randomised, double-blind, placebo-controlled phase 2b trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Falls were the most frequent adverse event
    explanation: >-
      Quantifies falls as the dominant adverse event in a large IBM trial
      population, establishing the clinical need for fall prevention.
- name: Intravenous Immunoglobulin (IVIG)
  description: >-
    IVIG has been tested in randomised controlled trials in IBM without
    demonstrating a sustained strength benefit; the Cochrane review could not
    pool the trials or draw conclusions from them. It retains a limited,
    non-consensus role in selected patients with refractory dysphagia, where
    transient swallowing improvement has been reported, but it does not alter
    the overall course of the disease.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin infusion therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_phenotypes:
  - preferred_term: Oral-pharyngeal dysphagia
    term:
      id: HP:0200136
      label: Oral-pharyngeal dysphagia
  evidence:
  - reference: PMID:35658164
    reference_title: "Treatment for inclusion body myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three trials (n = 78) compared intravenous immunoglobulin (combined in one
      trial with prednisone) to a placebo, but we were unable to perform
      meta-analysis because of variations in study analysis and presentation of
      trial data, with no access to the primary data for re-analysis.
    explanation: >-
      Documents that IVIG has been trialled in IBM but that the evidence base is
      too weak and heterogeneous to support pooling, so no efficacy claim is
      made.
  - reference: PMID:35658164
    reference_title: "Treatment for inclusion body myositis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We were unable to draw conclusions from trials of IVIg, oxandrolone, and
      AZA plus MTX versus MTX.
    explanation: >-
      The Cochrane authors explicitly decline to draw any conclusion on IVIG,
      which is why this treatment is curated as PARTIAL rather than SUPPORT or
      REFUTE.
- name: Interventional Dysphagia Procedures
  description: >-
    When conservative swallowing management fails, interventional options are
    used for the obstructive cricopharyngeal component: balloon dilation,
    botulinum toxin injection of the cricopharyngeus, and cricopharyngeal
    myotomy. Myotomy is irreversible. Gastrostomy (PEG) placement is used for
    nutritional support once oral intake becomes unsafe; roughly half of
    patients in a population-based cohort eventually required a feeding tube.
    Evidence is limited to small series and clinical experience rather than
    randomised trials.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Oral-pharyngeal dysphagia
    term:
      id: HP:0200136
      label: Oral-pharyngeal dysphagia
  evidence:
  - reference: PMID:41161903
    reference_title: "Emerging Treatment Options for Inclusion Body Myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysphagia, a major contributor to morbidity, is receiving increased
      attention through both conservative and interventional approaches.
    explanation: >-
      Confirms that interventional (procedural) approaches to dysphagia sit
      alongside conservative management in contemporary IBM practice.
  - reference: PMID:33879596
    reference_title: "Epidemiology and Natural History of Inclusion Body Myositis: A 40-Year Population-Based Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two-thirds of patients developed dysphagia, and half required a feeding
      tube.
    explanation: >-
      Quantifies the proportion progressing to gastrostomy-level nutritional
      support, establishing the clinical need for this treatment category.
- name: Conventional Immunosuppression (corticosteroids, methotrexate, azathioprine)
  description: >-
    Glucocorticoids and conventional immunosuppressants are NOT effective in
    IBM and are not recommended. They add toxicity without durable functional
    benefit. This entry is retained deliberately to record a negative treatment
    result: failure to respond to corticosteroids is itself a diagnostic clue
    that should prompt reassessment of a "polymyositis" label.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  evidence:
  - reference: PMID:38273639
    reference_title: "Sirolimus for treatment of patients with inclusion body myositis: a randomised, double-blind, placebo-controlled, proof-of-concept, phase 2b trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical immunosuppressants are ineffective in treating inclusion body
      myositis, and to date there are no recommendations for pharmacological
      approaches to treatment.
    explanation: >-
      Directly refutes any therapeutic claim for conventional immunosuppression
      in IBM.
- name: Sirolimus (rapamycin)
  description: >-
    An mTOR inhibitor that blocks effector T cell proliferation while relatively
    sparing regulatory T cells and inducing autophagy, targeting both the
    immune and degenerative arms of IBM. A 44-patient phase 2b trial missed its
    primary endpoint of knee extension strength but showed significant
    differences favouring sirolimus on several secondary outcomes. Sirolimus is
    investigational, not established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Clonal Expansion of Highly Differentiated Cytotoxic CD8+ T Cells
    treatment_effect: INHIBITS
    description: >-
      mTOR inhibition blocks effector T cell proliferation while relatively
      sparing regulatory T cells.
  evidence:
  - reference: PMID:38273639
    reference_title: "Sirolimus for treatment of patients with inclusion body myositis: a randomised, double-blind, placebo-controlled, proof-of-concept, phase 2b trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed no difference in the primary outcome of relative percentage
      change from baseline to month 12 of the maximal voluntary isometric knee
      extension strength (median difference 3·78, 95% CI -10·61 to 17·31;
      p=0·85).
    explanation: >-
      The primary endpoint was negative, so any therapeutic claim must be
      qualified as at best partially supported.
  - reference: PMID:38273639
    reference_title: "Sirolimus for treatment of patients with inclusion body myositis: a randomised, double-blind, placebo-controlled, proof-of-concept, phase 2b trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, we observed significant differences in favour of sirolimus
      between the study groups for HAQ-DI, forced vital capacity, thigh fat
      fraction, and 6-min walking distance.
    explanation: >-
      Secondary-endpoint signals that motivated further trials, but which do not
      establish efficacy given the negative primary endpoint.
  - reference: PMID:38273639
    reference_title: "Sirolimus for treatment of patients with inclusion body myositis: a randomised, double-blind, placebo-controlled, proof-of-concept, phase 2b trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When used after organ transplantation, sirolimus can block the
      proliferation of effector T cells, while preserving T regulatory cells,
      and induce autophagy, all of which are processes that are impaired in
      inclusion body myositis.
    explanation: >-
      States the mechanistic rationale linking sirolimus to the effector T cell
      and autophagy nodes of the IBM pathograph.
- name: Arimoclomol
  description: >-
    An oral co-inducer of the cellular heat shock response intended to enhance
    proteostasis. Despite encouraging preclinical and pilot data it failed to
    improve the IBM Functional Rating Scale in a 150-participant, 20-month
    randomised placebo-controlled trial and is not standard care. Recorded here
    as a negative result relevant to the degeneration-primary hypothesis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: arimoclomol
      term:
        id: CHEBI:747211
        label: arimoclomol
  evidence:
  - reference: PMID:37739573
    reference_title: "Safety and efficacy of arimoclomol for inclusion body myositis: a multicentre, randomised, double-blind, placebo-controlled trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Arimoclomol did not improve efficacy outcomes, relative to placebo, but
      had an acceptable safety profile in individuals with inclusion body
      myositis.
    explanation: >-
      Refutes efficacy of heat-shock-response co-induction as a treatment
      strategy in IBM.
- name: Bimagrumab
  description: >-
    A fully human anti-activin type II receptor monoclonal antibody intended to
    increase muscle mass by blocking myostatin signalling. It targeted the
    atrophy arm rather than disease causation, increased lean mass, but failed
    its primary 6-minute walking distance endpoint in the 251-participant
    RESILIENT phase 2b trial.
  therapeutic_modality: MONOCLONAL_ANTIBODY

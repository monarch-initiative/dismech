    model, IBM myofibres transcribe APP at increased levels, accumulate APP and
    its cleavage product amyloid-beta intracellularly (preferentially Abeta42),
    and are injured by soluble Abeta oligomers upstream of proteostasis failure
    and vacuolar degeneration.


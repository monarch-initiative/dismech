name: Combined Malonic and Methylmalonic Aciduria
category: Mendelian
creation_date: '2026-07-06T02:20:39Z'
synonyms:
- CMAMMA
- Combined malonic and methylmalonic acidemia
- ACSF3 deficiency
- Non-classic combined malonic and methylmalonic aciduria
description: 'Combined malonic and methylmalonic aciduria (CMAMMA) is an autosomal recessive metabolite-repair/proofreading
  disorder caused by biallelic ACSF3 variants. ACSF3 encodes a mitochondrial malonyl-CoA synthetase that
  also activates methylmalonate; loss of this activity impairs mitochondrial conversion of malonate and
  methylmalonate to their CoA thioesters. The biochemical signature is increased malonic acid and methylmalonic
  acid, usually with methylmalonic acid greater than malonic acid. Clinical expressivity is broad: selected
  clinical series include childhood metabolic and neurologic presentations and adult neurologic or psychiatric
  manifestations, while an unselected Quebec screening cohort had a favorable course in most patients.'
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: Inborn error of organic acid and mitochondrial intermediary metabolism.
    evidence:
    - reference: PMID:21841779
      reference_title: Exome sequencing identifies ACSF3 as a cause of combined malonic and methylmalonic
        aciduria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: CMAMMA is the first human disorder caused by mutations in a member of the acyl-CoA synthetase
        family, a diverse group of evolutionarily conserved proteins, and may emerge as one of the more
        common human metabolic disorders.
      explanation: Establishes CMAMMA as an inherited metabolic disorder caused by acyl-CoA synthetase
        deficiency.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Autosomal recessive Mendelian disorder caused by biallelic ACSF3 pathogenic variants.
    evidence:
    - reference: PMID:21841779
      reference_title: Exome sequencing identifies ACSF3 as a cause of combined malonic and methylmalonic
        aciduria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We establish ACSF3 mutations as the cause of CMAMMA and describe the first disease association
        with a member of the acyl-CoA synthetase (ACS) family, enzymes that activate fatty acids for intermediary
        metabolism4.
      explanation: Establishes the monogenic basis of CMAMMA.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: ACSF3 is a mitochondrial matrix malonyl-CoA synthetase required for mitochondrial protein malonylation
      and mitochondrial bioenergetic efficiency.
    evidence:
    - reference: PMID:28479296
      reference_title: The Mammalian Malonyl-CoA Synthetase ACSF3 Is Required for Mitochondrial Protein
        Malonylation and Metabolic Efficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ACSF3 KO cells exhibited elevated malonate and impaired mitochondrial metabolism.
      explanation: Demonstrates that ACSF3 deficiency directly impairs mitochondrial metabolism.
  icimd_category:
  - classification_value: metabolite_proofreading
    notes: 'ICIMD package WP-031 classifies ACSF3-related CMAMMA under Intermediary Metabolism: Others
      -> Disorders of metabolite repair/proofreading because the primary defect is failure to repair/recycle
      mitochondrial malonate and methylmalonate by thioesterification.'

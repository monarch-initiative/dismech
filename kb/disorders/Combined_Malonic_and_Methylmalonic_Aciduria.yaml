biochemical:
- name: Methylmalonic acid
  presence: INCREASED
  context: Methylmalonic acid is elevated in CMAMMA and usually exceeds malonic acid.
  biomarker_term:
    preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
  readouts:
  - target: Malonate and methylmalonate activation failure
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Increased methylmalonic acid reports failure to recycle methylmalonate through ACSF3.
    evidence:
    - reference: PMID:21841779
      reference_title: Exome sequencing identifies ACSF3 as a cause of combined malonic and methylmalonic
        aciduria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Methylmalonic and malonic aciduria with urinary MMA/MA >5 was present in seven of nine
        affecteds
      explanation: The discovery cohort links increased methylmalonic aciduria to ACSF3-related CMAMMA.
  evidence:
  - reference: PMID:21841779
    reference_title: Exome sequencing identifies ACSF3 as a cause of combined malonic and methylmalonic
      aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Methylmalonic and malonic aciduria with urinary MMA/MA >5 was present in seven of nine affecteds
    explanation: The discovery cohort documents elevated methylmalonic acid together with malonic acid.
- name: Malonic acid
  presence: INCREASED
  context: Malonic acid is elevated with methylmalonic acid and is required to distinguish CMAMMA from
    classic methylmalonic acidemia.
  biomarker_term:
    preferred_term: malonic acid
    term:
      id: CHEBI:30794
      label: malonic acid
  readouts:
  - target: Malonate and methylmalonate activation failure
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Increased malonic acid reports failure to activate malonate through ACSF3.
    evidence:
    - reference: PMID:26915364
      reference_title: A New Approach for Fast Metabolic Diagnostics in CMAMMA.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The presence of increased urinary concentrations of both methylmalonic acid (MMA) and malonic
        acid (MA) is assumed to differentiate combined malonic and methylmalonic aciduria (CMAMMA), due
        to mutations in the ACSF3 gene, from other causes of methylmalonic aciduria (classic MMAemia).
      explanation: The diagnostic study supports malonic acid as part of the defining biochemical readout.
  evidence:
  - reference: PMID:30740739
    reference_title: 'Combined malonic and methylmalonic aciduria due to ACSF3 mutations: Benign clinical
      course in an unselected cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: median urine malonic acid (MA) levels ranged from 9 to 280 mmol/mol creatinine (<5).
    explanation: The unselected cohort quantified elevated urinary malonic acid.
genetic:
- name: ACSF3
  gene_term:
    preferred_term: ACSF3
    term:
      id: hgnc:27288
      label: ACSF3
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: Biallelic ACSF3 pathogenic variants
    description: Reported pathogenic variants include missense, in-frame deletion, and nonsense alleles
      affecting conserved acyl-CoA synthetase motifs.
  features: ACSF3 encodes the mitochondrial malonyl-CoA/methylmalonyl-CoA synthetase disrupted in CMAMMA.
  evidence:
  - reference: PMID:21841779
    reference_title: Exome sequencing identifies ACSF3 as a cause of combined malonic and methylmalonic
      aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified nine missense, one in-frame deletion and one nonsense mutation (Figure 1).
    explanation: The discovery study describes multiple pathogenic ACSF3 variant classes in CMAMMA.
  - reference: PMID:30740739
    reference_title: 'Combined malonic and methylmalonic aciduria due to ACSF3 mutations: Benign clinical
      course in an unselected cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Causal ACSF3 mutations were identified in all patients for whom genotyping was performed
      (76% of cases).
    explanation: The unselected cohort confirms ACSF3 as the causal gene in genotyped patients.
diagnosis:
- name: Organic Acid Analysis in Urine and Plasma
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: Gas chromatography-mass spectrometry (GC/MS) of urine and ultra-performance liquid chromatography-tandem
    mass spectrometry (UPLC-MS/MS) of plasma to measure methylmalonic acid (MMA) and malonic acid (MA)
    concentrations and calculate the MA/MMA ratio, differentiating CMAMMA from classic methylmalonic acidemia.
  presence: Elevated MMA and MA with urinary MMA/MA ratio > 5 and characteristic plasma MA/MMA ratio;
    normal serum vitamin B12 and acylcarnitines.
  results: Persistently elevated urinary and plasma MMA and MA with MMA consistently exceeding MA.
  evidence:
  - reference: PMID:26915364
    reference_title: A New Approach for Fast Metabolic Diagnostics in CMAMMA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Calculating the MA/MMA ratio in plasma allows differentiation between CMAMMA and classic
      MMAemia.
    explanation: Establishes plasma and urinary organic acid profiling and MA/MMA ratio calculation as
      the rapid metabolic diagnostic method for CMAMMA.
- name: ACSF3 Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Targeted sequencing or exome sequencing of ACSF3 to confirm biallelic pathogenic variants
    in individuals with combined malonic and methylmalonic aciduria.
  presence: Biallelic pathogenic variants in ACSF3.
  results: Homozygous or compound heterozygous missense, nonsense, or in-frame deletion variants in ACSF3.
  evidence:
  - reference: PMID:30740739
    reference_title: 'Combined malonic and methylmalonic aciduria due to ACSF3 mutations: Benign clinical
      course in an unselected cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Causal ACSF3 mutations were identified in all patients for whom genotyping was performed
      (76% of cases).
    explanation: In an unselected cohort, ACSF3 genotyping identified causal variants in every patient
      tested, supporting molecular testing as confirmation of a biochemical diagnosis.
  - reference: PMID:26915364
    reference_title: A New Approach for Fast Metabolic Diagnostics in CMAMMA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compound heterozygosity for mutations in the ACSF3 gene was detected in two female siblings
      using diagnostic exome sequencing.
    explanation: An example of exome sequencing confirming biallelic ACSF3 variants in CMAMMA.
treatments:
- name: Clinical Monitoring and Conservative Management
  action_category: MONITORING
  description: Unselected newborn-screened cohorts demonstrate a favorable natural history regardless
    of dietary protein restriction or vitamin B12 supplementation; clinical surveillance and conservative
    symptom-directed management are used while avoiding unnecessary aggressive metabolic restriction in
    asymptomatic individuals.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30740739
    reference_title: 'Combined malonic and methylmalonic aciduria due to ACSF3 mutations: Benign clinical
      course in an unselected cohort.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified 25 CMAMMA patients (6 months to 30 years old) with a favorable outcome regardless
      of treatment.
    explanation: Shows that unselected CMAMMA patients have a favorable outcome without specialized metabolic
      treatment, supporting conservative clinical monitoring.
  notes: Bound to Supportive Care because the NCIT monitoring terms are outside the treatment-action
    enum, which is rooted at NCIT:C25218. OLS lists Patient Monitoring (NCIT:C53607) under Monitoring
    (NCIT:C61256) and Activity, and Surveillance (NCIT:C15719) under Observational Study, with no NCIT:C25218
    ancestor for either.
notes: 'WP-031 placement decision: curate CMAMMA as its own disease entry rather than as a subtype of
  classic methylmalonic acidemia, because independent sources and MONDO distinguish ACSF3-related combined
  malonic and methylmalonic aciduria from MUT/cobalamin-pathway methylmalonic acidemias. The package code
  is 12.1.22.01; the current ICIMD enum exposes the broader metabolite_proofreading value.'

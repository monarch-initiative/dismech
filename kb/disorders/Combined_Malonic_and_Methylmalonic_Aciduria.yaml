mechanistic_hypotheses:
- hypothesis_group_id: symptomatic_cmamma_mitochondrial_model
  hypothesis_label: Mitochondrial inefficiency as the cause of symptomatic CMAMMA
  status: EMERGING
  description: Selected clinical series report childhood metabolic decompensation and adult neurologic
    or psychiatric disease in individuals with CMAMMA, and ACSF3 knockout cells show impaired mitochondrial
    metabolism. Whether that mitochondrial defect causes these clinical features is unsettled. An unselected,
    newborn-screened cohort had a favorable course regardless of treatment, and its authors suggest that
    CMAMMA is probably benign and that symptomatic cases may reflect ascertainment bias. The edges from
    the mitochondrial node to clinical phenotypes are grouped here so they read as a contested model rather
    than an established causal chain.
  evidence:
  - reference: PMID:21841779
    reference_title: Exome sequencing identifies ACSF3 as a cause of combined malonic and methylmalonic
      aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After uneventful early decades, four patients were diagnosed in adulthood with neurological
      manifestations (seizures, memory problems, psychiatric disease, and/or cognitive decline) without
      vitamin B12 deficiency.
    explanation: The discovery case series reports clinical disease in individuals with CMAMMA, which
      the model sets out to explain.
  - reference: PMID:30740739
    reference_title: 'Combined malonic and methylmalonic aciduria due to ACSF3 mutations: Benign clinical
      course in an unselected cohort.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, the favorable clinical course observed suggests that CMAMMA is probably a benign
      condition, although we cannot exclude the possibility that a small minority of patients may present
      symptoms attributable to CMAMMA
    explanation: In an unselected cohort, the authors conclude CMAMMA is probably benign, which argues
      against the biochemical defect routinely causing the clinical features in this model.

diagnosis:
- name: Differentiation from Wolfram Syndrome
  description: >-
    Wolfram syndrome is the nearest differential - it also has childhood-onset diabetes with
    progressive beta-cell dysfunction, developmental delay and deafness. The separating
    features run in both directions: Wolfram has optic atrophy, diabetes insipidus and
    urological defects, which MANF syndrome lacks; MANF syndrome has short stature and
    microcephaly, which are not reported in Wolfram.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it lacks optic atrophy, diabetes insipidus, and urological defects that are
      common in Wolfram syndrome. Furthermore, the short stature and microcephaly seen in
      MANF syndrome are not reported in Wolfram syndrome.
    explanation: The bidirectional discriminating features, stated by the authors.

- name: Inclusion of MANF in Monogenic Diabetes Gene Panels
  description: >-
    The authors' own recommendation, and the practical consequence of the entry: a child
    with autoantibody-negative childhood diabetes plus microcephaly, deafness, developmental
    delay or short stature should have MANF sequenced.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, homozygous MANF mutations constitute a novel form of childhood-onset diabetes
      caused by dysregulated ER stress, and therefore, MANF should be included in the gene
      panels testing for monogenic diabetes.
    explanation: The testing recommendation.

treatments:
- name: Insulin Replacement
  description: >-
    Both patients are on insulin. The course in case 1 is informative about the natural
    history as well as the treatment: ten days of insulin at diagnosis, then diet alone
    controlled the diabetes for eighteen months before insulin was needed again. That is the
    trajectory expected of a beta-cell mass that formed normally and is failing
    progressively, rather than one destroyed at presentation.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Case 1 had brief treatment (10 days) with insulin followed by diet to control diabetes
      for 1.5 years. Both patients are currently on insulin.
    explanation: >-
      The treatment actually given, and the interval off insulin that argues for progressive
      functional failure rather than destruction.

experimental_models:
- name: MANF-knockout human embryonic stem cell-derived pancreatic islet endocrine cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    CRISPR/Cas9 MANF knockout in human embryonic stem cells, differentiated into pancreatic
    endocrine cells and additionally implanted into immunocompromised mice. This is the
    experiment that carries the human mechanism, because with two patients in the world there
    is no clinical population in which to test it.
  publication: PMID:33500254
  modeled_mechanisms:
  - target: Loss of Beta-Cell Reserve Against Folding Challenge
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the defining human feature - normal beta-cell development with lost
      tolerance of a secretory challenge - in isogenic human cells.
    limitations: >-
      A knockout in an embryonic stem cell line is not the patients' genotype, which is a

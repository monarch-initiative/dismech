- reference: PMID:33500254
  title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
- reference: PMID:24726366
  title: "MANF is indispensable for the proliferation and survival of pancreatic β cells."

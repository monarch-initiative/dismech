animal_models:
- name: Manf-deficient mouse
  species: Mouse
  genotype: MANF-deficient (constitutive)
  publication: PMID:24726366
  modeled_mechanisms:
  - target: Childhood-Onset Insulin-Deficient Diabetes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the diabetes endpoint, and reproduces the chronic UPR activation in islets,
      but reaches them by a route the human cells do not take.
    limitations: >-
      The mouse loses beta-cell mass postnatally through decreased proliferation and
      increased apoptosis - a developmental and survival failure. Human MANF-knockout
      beta-like cells develop normally and fail only under secretory challenge. Treating the
      mouse mechanism as the human one would predict a reduced beta-cell mass that the human
      data do not support, and would misdirect any therapeutic reasoning about beta-cell
      regeneration in these patients.
    readouts:
    - name: Pancreatic beta cell mass
      target: Childhood-Onset Insulin-Deficient Diabetes
      direction: DECREASED
      interpretation: >-
        Progressive postnatal loss of beta-cell mass, the mouse route to diabetes.
      evidence:
      - reference: PMID:24726366
        reference_title: "MANF is indispensable for the proliferation and survival of pancreatic β cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We generated MANF-deficient mice that strikingly develop severe diabetes due to
          progressive postnatal reduction of β cell mass, caused by decreased proliferation and
          increased apoptosis.
        explanation: The mouse mechanism, stated at the level of proliferation and apoptosis.
    evidence:
    - reference: PMID:24726366
      reference_title: "MANF is indispensable for the proliferation and survival of pancreatic β cells."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, we show that lack of MANF in vivo in mouse leads to chronic unfolded
        protein response (UPR) activation in pancreatic islets.
      explanation: >-
        The shared element - chronic UPR activation in islets - which is why the model is
        informative at all despite the divergent cellular route.

discussions:
- discussion_id: human_model_mismatch_manf_beta_cell_route
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Manf-null mouse, in which beta-cell mass is lost postnatally through reduced
    proliferation and increased apoptosis, model the human disease, in which MANF-knockout
    beta cells develop normally and fail only under secretory challenge?
  attaches_to:
  - pathophysiology#Loss of Beta-Cell Reserve Against Folding Challenge
  rationale: >-
    The two systems agree on the endpoint and disagree on the route. Both develop diabetes,
    and both show chronic UPR activation in islets. But the mouse gets there by losing
    beta-cell mass, and the human knockout does not lose beta cells at all - it loses their
    tolerance of a block in secretory export.

    The distinction is not academic. A mass-loss mechanism makes beta-cell regeneration the
    obvious therapeutic target, and MANF overexpression enhancing beta-cell regeneration in
    diabetic mice is exactly the conclusion the mouse paper draws. A reserve-loss mechanism
    points instead at reducing folding or trafficking demand in a beta-cell mass that is
    already there. Which of these is right for the two patients is unresolved, and this
    entry's pathograph is built on the human result because it is the human result.

    Two things keep this a mismatch to be resolved rather than a verdict against the mouse.
    The authors themselves read the difference partly as one of rate: their patients were
    diagnosed at ten and seventeen years, against severe early-onset diabetes in the mouse,
    which they take to mean slower beta-cell failure in humans rather than a different
    failure. And outside the pancreas the mouse looks like the patients - the paper states
    that Manf-null mouse neurological phenotypes resemble the human ones.

    A caveat in the other direction: the human evidence is an isogenic embryonic-stem-cell
    knockout, not a patient-derived line carrying either observed variant, and differentiated
    beta-like cells are developmentally immature. A developmental phenotype appearing only in
    a mature islet over years would be invisible in that system - and the paper's own in vivo
    arm is consistent with that reading, since deterioration became obvious only once the
    grafted cells carried the insulin demand of a diabetic host.
  proposed_experiments:
  - experiment_id: manf_patient_ipsc_islet_mass_and_challenge
    name: Patient-derived iPSC islet organoids, mass versus challenge tolerance
    description: >-
      Derive induced pluripotent stem cells from both reported patients, differentiate to
      islet organoids, and compare beta-cell yield and proliferation index against isogenic
      corrected controls as well as challenge tolerance, so that the mass question and the
      reserve question are answered in the same patient genotype.
  - experiment_id: manf_longitudinal_beta_cell_function_in_patients
    name: Longitudinal stimulated C-peptide in the reported patients
    description: >-
      Follow C-peptide longitudinally in the reported patients against mixed-meal stimulation,
      to distinguish a progressively shrinking beta-cell mass from a stable mass with impaired
      stimulated secretion.
  evidence:
  - reference: PMID:24726366
    reference_title: "MANF is indispensable for the proliferation and survival of pancreatic β cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated MANF-deficient mice that strikingly develop severe diabetes due to
      progressive postnatal reduction of β cell mass, caused by decreased proliferation and
      increased apoptosis.
    explanation: The mouse route.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that lack of MANF does not affect the development of human β-cells but
      increases their susceptibility to ER stress–induced functional failure.
    explanation: The human route, in the authors' own words, and the direct contradiction.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two patients identified in this study were diagnosed with diabetes at 10 and 17
      years of age, suggesting a slower progression of the β-cell failure in humans.
    explanation: >-
      The authors' own reading of the species difference as partly a matter of rate, which is
      why this discussion does not treat the mouse as simply wrong.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MANF-KO mice present neurological phenotypes that resemble those in the human MANF-KO
      patients.
    explanation: >-
      Outside the pancreas the mouse is concordant, which bounds the mismatch to the beta-cell
      arm rather than to the model as a whole.

- discussion_id: gap_extrapancreatic_features_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the microcephaly, developmental delay, deafness and short stature of MANF syndrome
    caused by the same ER-stress mechanism as the diabetes, and is the short stature in
    case 2 a direct consequence of MANF loss or secondary to that patient's hypopituitarism?
  attaches_to:
  - pathophysiology#Extrapancreatic Neurodevelopmental and Growth Phenotype
  rationale: >-
    A mechanism is proposed for each extrapancreatic feature, and none is measured in these
    patients. The neurological argument is by analogy - the brain is ER-stress-sensitive and
    is affected in the other ER-stress diabetes syndromes, so it is inferred to be affected
    here. The cochlear and growth arguments rest on mouse experiments. Nothing has been
    assayed in patient tissue, which with two patients is unsurprising but leaves the whole
    extrapancreatic arm resting on inference.

    The sharpest concrete question is the short stature, because the two patients are not
    alike. Case 2 has partial hypopituitarism including growth hormone deficiency, which is
    a sufficient explanation for short stature on its own. Case 1 had no hypopituitarism by
    fourteen. Either short stature has two routes in two patients, or the hypopituitarism is
    itself a MANF consequence and case 1 has not manifested it yet. The mouse data favour a
    direct route, since Manf-null mice are short independently of their diabetes, but the
    mouse growth defect has not been shown to be pituitary-independent either.
  proposed_experiments:
  - experiment_id: manf_pituitary_axis_longitudinal
    name: Longitudinal pituitary axis testing in both patients
    description: >-
      Serial growth hormone, thyroid-stimulating hormone and gonadotropin testing in case 1
      into adulthood, to establish whether hypopituitarism is a late and universal feature of
      MANF loss or a finding specific to case 2.
  - experiment_id: manf_mouse_growth_pituitary_independence
    name: Pituitary-independent growth defect in Manf-null mice
    description: >-
      Test whether the diabetes-independent growth defect of Manf-null mice also persists
      under growth hormone replacement, separating a direct skeletal or systemic effect from
      a pituitary one.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brain is sensitive to ER stress–mediated damage and almost always affected along
      with pancreas in other ER stress–mediated monogenic diabetes forms (33). This strongly
      suggests that MANF deficiency is etiological also for these features.
    explanation: >-
      The strength of the claim is the gap: "strongly suggests", from the behaviour of other
      genes, is the best evidence available for four of the five syndrome features.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Case 2 also has partial hypopituitarism with deficiency in growth hormone,
      thyroid-stimulating hormone, and gonadotropins. Hypopituitarism has not been detected in
      case 1 by 14 years of age.
    explanation: The discordance between the two patients that the concrete question turns on.

- discussion_id: interpretation_two_patients_bounds_every_frequency
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should phenotype frequencies be curated for a disease with two described patients?
  attaches_to:
  - pathophysiology#Extrapancreatic Neurodevelopmental and Growth Phenotype
  rationale: >-
    Every phenotype in this entry is banded OBLIGATE, and every one of those bands rests on
    n=2. That is technically accurate and epistemically almost empty: two patients cannot
    distinguish an obligate feature from a common one, and both were ascertained through a
    cohort selected for syndromic diabetes, which guarantees the diabetes and biases towards
    multisystem presentations.

    The authors bounded the rarity themselves. Sanger sequencing MANF in 187 further patients
    with diabetes plus microcephaly, developmental delay, deafness or short stature, together
    with individuals homozygous across the region, found no additional cases. So the absence
    of more patients is a measured result rather than an unsearched gap - but it also means
    the milder end of the phenotype, if there is one, was never eligible to be found, since
    the screen required the syndromic features.

    Recorded so that a future curator adding a third patient knows the existing bands were
    always provisional and should be recomputed rather than reinforced.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing of MANF from additional 187 patients presenting with diabetes and
      microcephaly, developmental delay, deafness, or short stature and/or are homozygous for
      the region incorporating MANF did not identify additional case subjects.
    explanation: >-
      The negative screen that bounds the disease's rarity, and whose inclusion criteria bound
      what it could have found.

notes: >-
  Curated from a Perplexity sonar-deep-research report
  (research/Diabetes_Deafness_Developmental_Delay_and_Short_Stature_Syndrome-deep-research-perplexity.md),
  which passed `just preflight-dr` against MONDO:0957997 with the canonical gene MANF
  mentioned 244 times and OMIM 620651 matching the MONDO xref. The report also names OMIM
  222300 and 601916 - Wolfram syndrome and WFS1 - which are the expected differential for a
  syndromic diabetes-plus-deafness disorder, not a sign of entity confusion.

  The report validated only three references and its citations file carried a single PubMed
  link, so this entry rests on that paper plus the mouse study, both located and read
  directly. That is a thin corpus, and it is thin because the disease is: two patients in the
  literature, with a negative screen of 187 further candidates.

  One treatment is curated - insulin, which both patients receive. It is worth recording how
  it was found, because the first draft of this entry asserted that no reference described a
  treatment given to a patient with this syndrome, and that was wrong. Grepping the cached
  full text for treatment terms surfaced "Both patients are currently on insulin" and, in the
  same passage, a metformin statement that turns out to describe the *heterozygous father* of
  case 1 with ordinary type 2 diabetes. The metformin is not a treatment for this disease and
  is not curated; the insulin is.

  The same pass corrected two other false negatives in the first draft: it had claimed no
  mechanism was offered for the extrapancreatic features (the discussion proposes brain
  ER-stress sensitivity by analogy, and cites mouse inner-ear and growth data), and it had
  missed case 2's partial hypopituitarism entirely, which is a phenotype and also an
  alternative explanation for that patient's short stature.

  MANF's own preclinical promise as a beta-cell protective agent is deliberately not curated
  as a treatment. It is a proposal about diabetes in general resting on the mouse
  regeneration mechanism that this entry's HUMAN_MODEL_MISMATCH discussion explicitly
  declines to adopt for these patients.

  Several evidence snippets are quoted from the cached full text rather than the abstract,
  because the discriminating experimental detail - which ER stressors did and did not
  separate the genotypes, the C-peptide values, the negative screen, the hypopituitarism - is
  not in the abstract.

  Review round 1 corrected four things. Two diagnosis entries had been appended into the
  `inheritance:` list by an insertion that anchored on the wrong section, so content making no
  inheritance claim was sitting in the inheritance block; they are now under `diagnosis:`. The
  deafness term was `HP:0000407`, dropping the laterality the phenotype's own name asserts, and
  is now `HP:0008619`. The extrapancreatic node had no incoming edge, leaving the pathograph in
  two components; it is now wired to the ER-stress node as
  `INDIRECT_UNKNOWN_INTERMEDIATES`, which is the honest link type - the edge rests on the
  authors' argument from related syndromes and on two different variants producing the same
  features, not on a traced pathway. And the brefeldin A result was overstated as "29% of
  knockout cells against far fewer wild-type" when the source says 29% against 18%; both
  numbers are now in the narrative and in the snippet, because against an 18% baseline this is
  a shift in susceptibility rather than a switch between survival and death.


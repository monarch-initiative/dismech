name: Diabetes Deafness Developmental Delay and Short Stature Syndrome
creation_date: "2026-08-23T22:45:00Z"
category: Mendelian
disease_term:
  preferred_term: diabetes, deafness, developmental delay, and short stature syndrome
  term:
    id: MONDO:0957997
    label: diabetes, deafness, developmental delay, and short stature syndrome
description: >-
  An autosomal recessive multisystem disorder caused by biallelic loss of function at
  MANF, reported in two unrelated consanguineous families and, so far as the literature
  curated here records, nowhere else. Its features are childhood-onset diabetes, severe
  short stature, bilateral sensorineural deafness, microcephaly and developmental delay.

  MANF is an endoplasmic-reticulum-resident protein that attenuates the ER stress
  response. The beta cell is the tissue where losing that attenuation matters most,
  because it carries an unusually heavy protein-folding load: proinsulin must fold to its
  native conformation in the ER before it can be packaged and secreted, so a cell type
  defined by secretory output is also the one closest to its folding ceiling.

  The entry is worth reading for what the human experiment showed that the mouse did not.
  Manf-null mice lose beta-cell mass postnatally through reduced proliferation and
  increased apoptosis - a developmental failure. Human MANF-knockout embryonic stem cells
  differentiate into beta-like cells perfectly well; what they lose is the reserve to
  survive a folding challenge. The same gene produces a developmental phenotype in mouse
  and a stress-tolerance phenotype in human, and the pathograph below is built on the
  human result with the divergence recorded rather than smoothed over.
parents:
- Syndromic Monogenic Diabetes
- Neurodevelopmental Disorder

pathophysiology:

- name: Biallelic MANF Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Both reported patients are homozygous for protein-truncating variants: a frameshift in
    one family and an essential donor splice-site change in the other. Neither variant type
    is compatible with a functional protein, and no homozygous protein-truncating MANF
    variant appears in population databases totalling more than 280,000 exomes and genomes,
    which is what made the gene a candidate in the first place.
  biological_processes:
  - preferred_term: MANF-dependent attenuation of the ER stress response
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two patients from different families with childhood diabetes and a
      neurodevelopmental disorder associated with homozygous loss-of-function mutations in
      the MANF gene.
    explanation: The causal observation, and the entire ascertained patient population.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of these population databases had any homozygous protein–truncating or rare
      homozygous missense (minor allele frequency <0.01) variants
    explanation: >-
      Population-level absence of biallelic loss of function, which is the constraint
      argument that made MANF a plausible recessive disease gene.
  downstream:
  - target: Loss of ER Stress Attenuation
    causal_link_type: DIRECT
    description: No MANF protein, no MANF-dependent damping of the stress response.

- name: Loss of ER Stress Attenuation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting state. MANF does not fold proteins; it attenuates the response to
    their misfolding. Losing it therefore does not create a folding defect, it removes a
    buffer - which is why the resulting disease is one of reduced tolerance rather than of
    baseline dysfunction, and why its severity should be expected to track folding demand
    across tissues.
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mesencephalic astrocyte-derived neurotrophic factor (MANF) is an endoplasmic reticulum
      (ER)-resident protein that plays a crucial role in attenuating ER stress responses.
    explanation: MANF's function, which is what this node models the loss of.
  downstream:
  - target: Beta-Cell ER Stress Under Proinsulin Folding Load
    causal_link_type: DIRECT
    description: >-
      The buffer is removed in the cell type nearest its folding ceiling.
  - target: Extrapancreatic Neurodevelopmental and Growth Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same loss of ER stress attenuation is inferred to act in brain, cochlea and the
      growth axis, but no intermediate step is established in any of them. The link type
      records that honestly: the edge is asserted because two patients with different
      variants share the features and because related ER-stress diabetes syndromes behave the
      same way, not because a pathway has been traced. The knowledge gap attached to the
      target node carries the open question.
    evidence:
    - reference: PMID:33500254
      reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The brain is sensitive to ER stress–mediated damage and almost always affected along
        with pancreas in other ER stress–mediated monogenic diabetes forms (33). This strongly
        suggests that MANF deficiency is etiological also for these features.
      explanation: >-
        The authors' own argument for this edge, and its strength: "strongly suggests", from
        the behaviour of other genes. Curated as PARTIAL because that is an inference, not a
        traced mechanism.
    - reference: PMID:33500254
      reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both patients with different homozygous mutations have strikingly similar extra
        pancreatic phenotypes with microcephaly, developmental delay, sensorineural deafness,
        and short stature.
      explanation: >-
        Two different variants, the same extrapancreatic picture - which argues the features
        belong to MANF loss rather than to either family's background.

- name: Beta-Cell ER Stress Under Proinsulin Folding Load
  role: effector
  biological_scale: CELLULAR
  description: >-
    Beta cells are under high demand for insulin synthesis, folding and secretion, and
    proinsulin folds in the ER before it can be packaged. That standing load is why the
    beta cell is where an ER stress buffer is worth most, and it is the reason a
    ubiquitously relevant chaperone deficit produces diabetes as its cardinal feature.

    In MANF-knockout human beta-like cells the ER stress markers BiP, GRP170 and TXNIP
    trend upward and proinsulin accumulates. The stress is real but mild at baseline - the
    phenotype needs a challenge to become visible, which is the point of the next node.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: protein folding in the endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of MANF induced mild ER stress and impaired insulin-processing capacity of β-cells
      in vitro.
    explanation: >-
      The two in vitro findings, and the authors' own characterisation of the stress as mild.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we confirmed our findings by quantifying the mRNA levels of ER stress
      markers using RT-qPCR, which showed an increasing trend in the expression levels of BiP
      (HSPA5), GRP170 (HYOU1), and TXNIP in MANF-KO cells
    explanation: >-
      The molecular readout behind the stress claim. Note the authors write "an increasing
      trend", which is why this node describes the baseline stress as mild rather than
      established.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      β-Cells are under high demand for insulin synthesis, folding, and secretion.
    explanation: The standing folding load that makes this cell type the sensitive one.
  downstream:
  - target: Loss of Beta-Cell Reserve Against Folding Challenge
    causal_link_type: DIRECT
    description: >-
      A cell already near its folding ceiling with the buffer removed has no headroom.

- name: Loss of Beta-Cell Reserve Against Folding Challenge
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The node that carries the actual human finding, and the one that distinguishes this
    disease from a developmental beta-cell disorder. MANF-null human beta-like cells
    develop normally; they fail when challenged.

    The challenge experiments are discriminating rather than uniformly positive, which is
    informative about the mechanism. Tunicamycin (blocking N-linked glycosylation) and
    thapsigargin (depleting ER calcium) killed knockout and wild-type cells about equally.
    Brefeldin A, which blocks ER-to-Golgi cargo transfer, killed 29% of knockout cells
    against 18% of wild-type - a significant difference, and a modest one. So the
    vulnerability is not to ER stress in general but to a block in secretory export: a defect
    of the trafficking arm rather than of the folding arm.

    Both numbers are stated deliberately. Against a wild-type baseline of 18%, this is a
    shift in susceptibility rather than a switch between survival and death, and an entry
    that reported only the 29% would imply a starker result than the experiment produced.

    Transplantation supplies the in vivo counterpart: knockout grafts failed particularly
    in recipient mice that were themselves diabetic, i.e. under metabolic demand.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that lack of MANF does not affect the development of human β-cells but
      increases their susceptibility to ER stress–induced functional failure.
    explanation: >-
      The central claim of the entry: normal development, lost reserve. This is also where
      the human result parts company with the mouse.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Upon the induction of experimental ER stress using TM, an inhibitor of N-linked
      glycosylation, or TG, which depletes ER calcium (30), the percentage of apoptotic
      β-like cells increased similarly in both genotypes
    explanation: >-
      Curated as PARTIAL because it is a negative result for two of the three challenges. It
      is what keeps this node from claiming a general ER-stress vulnerability.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, upon the treatment with brefeldin A, an inhibitor of ER-to-Golgi cargo transfer
      (31), the percentage of MANF-KO apoptotic β-like cells was significantly higher than WT
      (29% vs. 18%)
    explanation: >-
      The one challenge that discriminated, quoted to include both arms of the comparison so the
      effect size is visible: 29% against 18%, significant but modest.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Upon implantation to immunocompromised mice, the MANF knockout grafts presented elevated
      ER stress and functional failure, particularly in recipients with diabetes.
    explanation: >-
      The in vivo counterpart, and the demand-dependence: failure was worst where metabolic
      demand was highest.
  downstream:
  - target: Childhood-Onset Insulin-Deficient Diabetes
    causal_link_type: DIRECT
    description: >-
      Progressive functional failure of a beta-cell mass that formed normally.

- name: Childhood-Onset Insulin-Deficient Diabetes
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Diabetes of childhood onset, autoantibody-negative and therefore not type 1. Both
    patients retained measurable endogenous insulin secretion for at least four years after
    diagnosis, with C-peptide of 240 and 330 pmol/L - which fits a beta-cell mass that
    formed normally and is failing functionally, rather than one that was destroyed.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They did not have autoantibodies associated with type 1 diabetes and have persistence of
      endogenous insulin secretion for ≥4 years postdiagnosis, with C-peptide levels of 240
      pmol/L and 330 pmol/L, respectively.
    explanation: >-
      Both the exclusion of autoimmune diabetes and the preserved C-peptide that argues for
      functional failure rather than beta-cell destruction.

- name: Extrapancreatic Neurodevelopmental and Growth Phenotype
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Severe short stature, bilateral sensorineural deafness, microcephaly and developmental
    delay accompany the diabetes and give the syndrome its name. The two patients have
    different homozygous variants and strikingly similar extrapancreatic features, which is
    itself an argument that these belong to the disease rather than to either family.

    The authors do offer a reason, and it is an argument from company rather than a
    demonstration: the brain is sensitive to ER-stress-mediated damage and is almost always
    affected alongside the pancreas in the other ER-stress monogenic diabetes syndromes, so
    the same is inferred here. For the cochlea there is a mouse experiment - inner-ear MANF
    inactivation kills outer hair cells progressively with hearing loss - and Manf-null mice
    also show a growth defect independent of their diabetes. So the extrapancreatic arm has
    a proposed mechanism supported by analogy and by mouse data, and no measurement in these
    patients. The entry curates it at that strength; the residual uncertainty is a knowledge
    gap below.

    One asymmetry between the two patients bears directly on the short stature: case 2 has
    partial hypopituitarism with growth hormone, thyroid-stimulating hormone and gonadotropin
    deficiency, while case 1 had none by fourteen years of age. Short stature in this
    syndrome may therefore not have a single route even across two patients.
  evidence:
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that homozygous loss-of-function variants in MANF cause a novel multisystem
      disorder characterized by childhood-onset diabetes, short stature, deafness,
      developmental delay, and microcephaly.
    explanation: The full syndrome definition, from the paper that established it.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brain is sensitive to ER stress–mediated damage and almost always affected along
      with pancreas in other ER stress–mediated monogenic diabetes forms (33). This strongly
      suggests that MANF deficiency is etiological also for these features.
    explanation: >-
      The authors' proposed mechanism for the neurological arm. Curated as PARTIAL because it
      is an inference from the behaviour of related syndromes, not a measurement in these
      patients - the authors' own verb is "suggests".
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MANF inactivation in the mouse inner ear leads to a progressive death of outer hair
      cells of the cochlea accompanied with hearing loss (35). Similarly to the patients,
      MANF-KO mice show a growth defect and short stature that is independent of diabetes (6).
    explanation: >-
      Mouse evidence for the cochlear and growth arms, including the point that the mouse
      growth defect is not secondary to its diabetes.
  - reference: PMID:33500254
    reference_title: "Loss of MANF Causes Childhood-Onset Syndromic Diabetes Due to Increased Endoplasmic Reticulum Stress."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Case 2 also has partial hypopituitarism with deficiency in growth hormone,
      thyroid-stimulating hormone, and gonadotropins. Hypopituitarism has not been detected in
      case 1 by 14 years of age.
    explanation: >-
      The between-patient asymmetry, and a plausible alternative route to short stature in one
      of the two.


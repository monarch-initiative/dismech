name: Beck-Fahrner Syndrome
creation_date: "2026-08-22T18:45:00Z"
category: Genetic
synonyms:
- BEFAHRS
- TET3-BEFAHRS
- TET3-related Beck-Fahrner syndrome
- TET3 deficiency
description: >
  Beck-Fahrner syndrome is a neurodevelopmental disorder caused by pathogenic
  variants in TET3, and it belongs squarely to the Mendelian disorders of the
  epigenetic machinery (MDEMs, or chromatinopathies) - GeneReviews places it
  "within the spectrum" of that group. It sits in the **eraser** class of that
  machinery, and specifically on the DNA rather than the histone arm: TET3 is a
  ten-eleven translocation methylcytosine dioxygenase that oxidises
  5-methylcytosine to 5-hydroxymethylcytosine, the committed first step of the
  two known DNA-demethylation routes. Losing TET3 dosage therefore does not
  merely fail to add a mark; it leaves methylated cytosine unable to be cleared,
  shifting the balance of chromatin states at the loci TET3 acts on.

  The clinical picture is intellectual disability and developmental delay
  spanning mild to severe and affecting motor and language skills, with infantile
  hypotonia that compounds motor and expressive-speech delay and can cause
  feeding difficulty severe enough to need tube feeding. About a third have
  epilepsy. Autism, anxiety and ADHD are common. Roughly half have strabismus or
  refractive error, and both conductive and sensorineural hearing loss occur.

  Two features are worth curating carefully because they cut against the usual
  MDEM expectation. First, **growth is disrupted in only about half of affected
  individuals, and when it is, overgrowth is more common than undergrowth**, with
  macrocephaly the commonest manifestation - the opposite direction from Kabuki
  or Cornelia de Lange. This is why the module this entry conforms to states the
  growth output as "disruption" rather than as short stature: the direction
  varies across the class while the dysregulation does not. Second, the facial
  features, though frequently present, are **nonspecific**, so unlike most
  chromatinopathies there is no recognisable gestalt to diagnose from.

  Inheritance is autosomal dominant, most often de novo. Biallelic cases exist,
  inherited from two heterozygous parents who themselves have milder features,
  but GeneReviews now reads these as autosomal dominant inheritance with variable
  expressivity rather than as recessive disease - a reinterpretation this entry
  follows and records explicitly, because the earlier recessive framing is still
  in circulation.

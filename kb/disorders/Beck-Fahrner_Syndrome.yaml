notes: >-
  Curated as part of a review of Mendelian intellectual disability coverage. The
  entry conforms to the `epigenetic_machinery_neurodevelopmental_dysregulation`
  module at the trigger, transcriptional and clinical-output nodes, and is the
  module's worked example of the **eraser** class acting on DNA methylation
  rather than on histone marks.

  Deliberately not asserted: GeneReviews notes that "DNA methylation profiling
  can help confirm variant pathogenicity", i.e. that BEFAHRS has a usable
  episignature. That is curated here as a diagnostic aid only. Consistent with
  the module's standing KNOWLEDGE_GAP, no claim is made that the measured
  methylation changes mediate the neurodevelopmental phenotype.

  Prevalence is not curated: no population estimate is available for this
  recently delineated disorder, and inventing a band would be worse than the
  gap.
inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most probands carry a de novo heterozygous TET3 variant, though inherited
    variants are reported. Rare individuals carry biallelic variants inherited
    from two mildly affected heterozygous parents; this is now interpreted as
    dominant inheritance with variable expressivity rather than as recessive
    disease.
  evidence:
  - reference: PMID:37200470
    reference_title: "TET3-Related Beck-Fahrner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rarely, affected individuals can have biallelic pathogenic variants
      inherited from both heterozygous parents who have milder features of
      TET3-BEFAHRS. This is now thought to represent autosomal dominant
      inheritance with variable expressivity as opposed to autosomal recessive
      inheritance.
    explanation: >-
      Directly supports the dominant-with-variable-expressivity reading and the
      explicit retraction of the earlier recessive framing.
genetic:
- name: TET3
  gene_term:
    preferred_term: TET3
    term:
      id: hgnc:28313
      label: TET3
  relationship_type: CAUSATIVE
  notes: >-
    TET3 encodes a ten-eleven translocation methylcytosine dioxygenase. Loss of
    TET3 function is the cause of Beck-Fahrner syndrome; heterozygous pathogenic
    variants are the usual finding.
  evidence:
  - reference: PMID:37200470
    reference_title: "TET3-Related Beck-Fahrner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of TET3-BEFAHRS is established in a proband with suggestive
      findings and a heterozygous pathogenic variant in TET3 identified by
      molecular genetic testing.
    explanation: >-
      Establishes TET3 as the causal gene and the heterozygous state as the
      diagnostic finding.
pathophysiology:
- name: TET3 Dioxygenase Deficiency
  description: >-
    Loss-of-function variation reduces the dosage of TET3, a member of the TET
    family of 5-methylcytosine oxidases. This places Beck-Fahrner syndrome in the
    eraser class of the epigenetic machinery, acting on DNA methylation rather
    than on histone marks.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  molecular_functions:
  - preferred_term: DNA 5-methylcytosine dioxygenase activity (TET3)
    term:
      id: GO:0070579
      label: DNA 5-methylcytosine dioxygenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31965999
    reference_title: "TET methylcytosine oxidases: new insights from a decade of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the TET (Ten- Eleven Translocation) family of 5-methylcytosine oxidases,
      which use reduced iron, molecular oxygen and the tricarboxylic acid cycle
      metabolite 2-oxoglutarate (also known as a-ketoglutarate) to oxidise the
      methyl group of 5mC to 5-hydroxymethylcytosine (5hmC) and beyond
    explanation: >-
      Defines the enzymatic activity lost at this node. Source is a review by the
      laboratory that discovered the enzyme family.
  downstream:
  - target: Impaired 5-Methylcytosine Oxidation and DNA Demethylation
    causal_link_type: DIRECT

- name: Impaired 5-Methylcytosine Oxidation and DNA Demethylation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  description: >-
    Reduced TET3 activity impairs oxidation of 5-methylcytosine to
    5-hydroxymethylcytosine, the committed first step of both replication-dependent
    and replication-independent DNA demethylation. Methylated cytosine that should
    be cleared at TET3 target loci is retained, shifting the local chromatin state
    toward repression. This is the DNA-methylation counterpart of the
    histone-mark imbalance seen in the writer-class chromatinopathies.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:31965999
    reference_title: "TET methylcytosine oxidases: new insights from a decade of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TET-generated oxidised methylcytosines are intermediates in at least two
      pathways of DNA demethylation, which differ in their dependence on DNA
      replication.
    explanation: >-
      Establishes that the oxidation step lost upstream is required for DNA
      demethylation by either route, which is what makes reduced TET3 activity a
      demethylation defect rather than only a missing oxidation product.
  - reference: PMID:37200470
    reference_title: "TET3-Related Beck-Fahrner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA methylation profiling can help confirm variant pathogenicity.
    explanation: >-
      Weak, corroborative evidence only: the sentence states that methylation
      profiling has diagnostic utility for TET3 variants, which is consistent
      with a methylation defect at this node but does not itself measure one.
      Explicitly NOT a claim that the methylation profile mediates the
      phenotype - see the module's standing KNOWLEDGE_GAP on episignatures.
  downstream:
  - target: Dysregulated Neurodevelopmental Gene Expression
    causal_link_type: DIRECT

- name: Dysregulated Neurodevelopmental Gene Expression
  description: >-
    Retained methylation at TET3 target loci dysregulates the developmental gene
    programs those loci encode. This is the point at which Beck-Fahrner syndrome
    converges with the rest of the chromatinopathies, whichever machinery
    component they lesion, and it is why TET3 deficiency produces a clinical
    picture recognisable as an MDEM rather than a metabolic or structural brain
    disorder.
  role: central_effector
  biological_scale: MOLECULAR
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: LOSS_OF_FUNCTION
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: DECREASED
  evidence:
  - reference: PMID:31965999
    reference_title: "TET methylcytosine oxidases: new insights from a decade of research."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the decade since their discovery, TET enzymes have been shown to have
      important roles in embryonic development, cell lineage specification,
      neuronal function and cancer.
    explanation: >-
      Establishes that TET enzymes have demonstrated roles in embryonic
      development, cell lineage specification and neuronal function. That is the
      dependence this node relies on; the step from losing TET3 to dysregulated
      neurodevelopmental transcription specifically is an inference from it,
      supported for this disorder by the MDEM classification in the next item.
  - reference: PMID:37200470
    reference_title: "TET3-Related Beck-Fahrner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TET3-related Beck-Fahrner syndrome (TET3-BEFAHRS) is a condition within the
      spectrum of mendelian disorders of the epigenetic machinery (MDEMs) or
      chromatinopathies.
    explanation: >-
      Explicit classification of this disorder into the MDEM class, which is the
      warrant for the conforms_to edge on this node.
  downstream:
  - target: Neurodevelopmental and Growth Phenotype
    causal_link_type: DIRECT

- name: Neurodevelopmental and Growth Phenotype
  description: >-
    The clinical output: intellectual disability and developmental delay across
    motor and language domains, infantile hypotonia, epilepsy in about a third,
    neurobehavioural features, sensory involvement, and growth disruption in about
    half - biased toward overgrowth and macrocephaly rather than the growth
    restriction typical of several other chromatinopathies.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Intellectual Disability with Growth and Craniofacial Dysmorphism"
  biological_processes:
  - preferred_term: learning or memory
    term:
      id: GO:0007611
      label: learning or memory
    modifier: DECREASED
  evidence:
  - reference: PMID:37200470
    reference_title: "TET3-Related Beck-Fahrner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical features typically include intellectual disability /
      developmental delay ranging from mild to severe affecting both motor and
      language skills.
    explanation: >-
      States the core cognitive and developmental output of the chain.
  - reference: PMID:37200470
    reference_title: "TET3-Related Beck-Fahrner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half of individuals exhibit typical growth and half exhibit
      growth abnormalities, with overgrowth being more common than undergrowth
      and macrocephaly being the most common manifestation of altered growth.
    explanation: >-
      Supports the growth arm of this node and, importantly, its direction:
      overgrowth predominates, which is why the conforming module node is phrased
      as growth disruption rather than growth restriction.

- reference: PMID:41817446
  title: "Expanding the phenotypic spectrum of neurodevelopmental disorder with seizures and gingival overgrowth: a case caused by a novel TBC1D2B variant, with hypertrichosis, white matter abnormalities, and progressive neurological decline."
notes: >-
  Lump/split: MONDO:0859148 (OMIM:619323) is the TBC1D2B disorder. MONDO keeps
  Ramon syndrome (MONDO:0009954, OMIM:266270) as a separate term; one 2024 report
  equates the two and a Thai patient with the Ramon phenotype and biallelic
  TBC1D2B variants is counted here by genotype, while the Lebanese family with
  a homozygous ELMO2 variant and a Ramon diagnosis (PMID:29095483) is not; Ramon
  syndrome is kept as a differential. The heterozygous TBC1D2B p.Tyr824Cys variant in a family with
  isolated gingival fibromatosis (PMID:39201553) is not treated as this disease.
  Not cited, and why: PMID:41817446 (2026 case report with hypertrichosis,
  white matter abnormalities and progressive decline) returned no abstract or
  full text on the fetches made, so no snippet could be taken from it.
  No GeneReviews chapter exists for this disorder (just check-genereviews).
  A TBC1D2B ClinGen gene-disease validity record was not found in the local
  cache. Death in early adulthood (three of ten subjects in the 2024 series,
  at 21 to 39 years) is recorded in the description because HP:0100613 Death
  in early adulthood lies outside the phenotype enum, which is rooted at
  HP:0000118 Phenotypic abnormality.

prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Published patients with biallelic TBC1D2B variants: three in the 2020
    defining report, two brothers in 2022, five more in 2024 (the 2024 series
    pools these into ten subjects from eight families), one Thai girl reported
    under the label Ramon syndrome in 2024, four children from one
    consanguineous Turkish family in 2025, three patients from two families in
    2026, and one further 2026 case report whose text was not retrievable. That
    is about 22 individuals from about 13 families. The 2025 Turkish family
    carries p.(Phe108Ter), not the c.360+1G>T splice variant of the Turkish
    siblings in the 2024 series, so it is a separate family; its abstract does
    not say whether any patient was reported before. No population estimate
    exists.
  evidence:
  - reference: PMID:38374468
    reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here, we report five new subjects with biallelic TBC1D2B variants,
      including two siblings, and delineate the molecular and clinical features
      in the ten subjects known to date.
    explanation: Ten subjects known by 2024.
  - reference: PMID:42375022
    reference_title: "TBC1D2B-Related Neurodevelopmental Disorder With Gingival Overgrowth and Movement Disorders: A Case Series and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Herein, we report three new patients with TBC1D2B variants, expanding the phenotypic spectrum.
    explanation: Three further patients in 2026.
  - reference: PMID:40898781
    reference_title: "A Novel Homozygous TBC1D2B Variant Disrupts Functional Domains and Suggests Impaired Rab-GTPase Regulation in Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      This study reports four affected children from a consanguineous family in
      Türkiye, in whom a novel variant in this gene was identified.
    explanation: Four further patients from one family.
genetic:
- name: TBC1D2B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TBC1D2B (15q24.3-q25.1) encodes TBC1 domain family member 2B. Causality
    rests on biallelic predicted or shown loss-of-function variants in more than
    ten unrelated families from several ancestries, affected siblings sharing
    the genotype in four families (with heterozygous parents shown in three),
    absent or reduced TBC1D2B protein in patient fibroblasts, and a consistent
    phenotype. This is strong human genetic evidence, but functional data come from patient fibroblasts and a knockout
    HeLa line only, and no animal model exists. No ClinGen gene-disease
    validity record for TBC1D2B was found in the local ClinGen cache
    (cache/clingen/gene_validity.csv, export of 2026-01-24), so
    gene_disease_validity is left absent. A heterozygous TBC1D2B missense
    variant (p.Tyr824Cys) co-segregating with a KREMEN2 variant in a Cambodian
    family with isolated hereditary gingival fibromatosis is a separate,
    unconfirmed observation and is not part of this recessive disease.
  gene_term:
    preferred_term: TBC1D2B
    term:
      id: hgnc:29183
      label: TBC1D2B
  evidence:
  - reference: PMID:32623794
    reference_title: "Biallelic loss-of-function variants in TBC1D2B cause a neurodevelopmental disorder with seizures and gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We report biallelic loss-of-function variants in TBC1D2B, encoding a
      member of the TBC/RABGAP family with yet unknown function, as the
      underlying cause of cognitive impairment, seizures, and/or gingival
      overgrowth in three individuals from unrelated families.
    explanation: Defining report, three unrelated families.
  - reference: PMID:38374468
    reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The molecular spectrum included 12 different TBC1D2B variants: seven
      nonsense, three frameshifts, one splice site, and one missense variant.
    explanation: Allelic series dominated by truncating variants.
  - reference: PMID:36029130
    reference_title: "Biallelic frameshift variant in the TBC1D2B gene in two siblings with progressive gingival overgrowth, fibrous dysplasia of face, and mental deterioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These results support that loss of TBC1D2B is the cause of this rare
      condition.
    explanation: Independent replication in a further family.
  - reference: PMID:39201553
    reference_title: "Genetic Variants in the TBC1D2B Gene Are Associated with Ramon Syndrome and Hereditary Gingival Fibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Exome sequencing identified rare variants in TBC1D2B in both conditions: a
      novel homozygous variant (c.1879_1880del, p.Glu627LysfsTer61) in a Thai
      patient with Ramon syndrome
    explanation: >-
      A further homozygous frameshift in a patient with gingival fibromatosis,
      cherubism-like jaw lesions and focal epilepsy, reported under the Ramon
      syndrome label.
  variants:
  - name: c.360+1G>T
    description: >
      Homozygous intron 1 splice-donor variant in two Turkish siblings. It
      activates a cryptic donor 33 bp upstream, and total TBC1D2B mRNA in
      leukocytes falls to 15-21% of control.
    evidence:
    - reference: PMID:38374468
      reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Quantitative real-time PCR identified a statistically significantly
        reduced TBC1D2B mRNA level to 15–21% in leukocytes of subject 8
        compared with controls
      explanation: Transcript loss measured in patient leukocytes.
  - name: p.Arg862Cys
    description: >
      The only reported missense allele, in the RABGAP domain, found in trans
      with p.Arg920*. The missense protein appears stable, and the authors
      suggest it may have impaired GAP activity; this has not been measured.
    evidence:
    - reference: PMID:38374468
      reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        In contrast, the data indicate the TBC1D2B-Arg862Cys mutant protein is
        normally produced and stable, and may have an impaired GAP activity.
      explanation: Protein level data from patient fibroblasts; GAP activity is the authors' suggestion.
pathophysiology:
- name: Biallelic TBC1D2B Loss of Function
  biological_scale: MOLECULAR
  description: >
    Nonsense, frameshift and splice alleles abolish or sharply reduce TBC1D2B
    mRNA and protein in patient cells; in the one compound heterozygote with a
    missense allele, protein is halved. TBC1D2B is a TBC-domain RAB
    GTPase-activating protein, so its loss removes a RAB GAP activity, whose
    best-characterised substrate is RAB7.
  genes:
  - preferred_term: TBC1D2B
    term:
      id: hgnc:29183
      label: TBC1D2B
  molecular_functions:
  - preferred_term: RAB GTPase activator activity
    modifier: DECREASED
    term:
      id: GO:0005096
      label: GTPase activator activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:32623794
    reference_title: "Biallelic loss-of-function variants in TBC1D2B cause a neurodevelopmental disorder with seizures and gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      TBC1D2B messenger RNA amount was drastically reduced, and the protein was
      absent in fibroblasts of two patients.
    explanation: Protein loss in patient fibroblasts.
  - reference: PMID:38374468
    reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Together, the disease-associated TBC1D2B alleles identified up to date
      likely lead to complete loss of TBC1D2B or significantly impaired TBC1D2B
      function.
    explanation: The authors' summary of the allelic series as loss of function.
  - reference: PMID:39051763
    reference_title: "RAB22A sorts epithelial growth factor receptor (EGFR) from early endosomes to recycling endosomes for microvesicles release."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      RAB22A recruits TBC1D2B, a GTPase-activating protein (GAP) of RAB7A, to
      inactivate RAB7A, thus preventing EGFR from being transported to late
      endosomes and lysosomes.
    explanation: Experimental support for the RAB7 GAP activity bound on this node, in cultured cells.
  - reference: PMID:32958903
    reference_title: "RAB31 marks and controls an ESCRT-independent exosome pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Meanwhile, RAB31 recruits GTPase-activating protein TBC1D2B to inactivate
      RAB7, thereby preventing the fusion of MVEs with lysosomes and enabling
      the secretion of ILVs as exosomes.
    explanation: Independent cell-line evidence that TBC1D2B inactivates RAB7.
  downstream:
  - target: Impaired Early Endocytosis
    causal_link_type: DIRECT
    description: >
      Shown in TBC1D2B knockout HeLa cells, not in patient cells or neurons.
    evidence:
    - reference: PMID:32623794
      reference_title: "Biallelic loss-of-function variants in TBC1D2B cause a neurodevelopmental disorder with seizures and gingival overgrowth."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        In two independent TBC1D2B CRISPR/Cas9 knockout HeLa cell lines that
        serve as cellular model of TBC1D2B deficiency, epidermal growth factor
        internalization was significantly reduced compared with the parental
        HeLa cell line suggesting a role of TBC1D2B in early endocytosis.
      explanation: Knockout cancer cell line; INDIRECT for the patient disease.
  - target: Dysregulated RAB7-Dependent Endolysosomal Trafficking
    causal_link_type: DIRECT
    description: >
      Inferred from wild-type TBC1D2B function as the RAB7 GAP recruited by
      RAB22A and RAB31; RAB7 activity has not been measured in patient cells.
    evidence:
    - reference: PMID:39051763
      reference_title: "RAB22A sorts epithelial growth factor receptor (EGFR) from early endosomes to recycling endosomes for microvesicles release."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        When there is a high protein level of RAB22A on early endosome, TBC1D2B
        is recruited and acts as a brake to prevent early endosomes from
        maturing into late endosomes
      explanation: Normal function of TBC1D2B in endosome maturation, from cultured cells.
  - target: Impaired Autophagy Initiation
    causal_link_type: DIRECT
    description: >
      Inferred from wild-type TBC1D2B function in cultured cells; autophagy has
      not been measured in patient cells.
    evidence:
    - reference: PMID:38226533
      reference_title: "TBC1D2B undergoes phase separation and mediates autophagy initiation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        We show that TBC1D2B contains a functional canonical LIR motif and acts
        at an early stage of autophagy by binding to both LC3/GABARAP and ATG12
        conjugation complexes.
      explanation: Normal function in cultured cells; INDIRECT for loss in patients.
  - target: Reduced Cell Survival Under Stress
    causal_link_type: DIRECT
    description: Shown in TBC1D2B knockout HeLa cells after serum deprivation.
    evidence:
    - reference: PMID:32623794
      reference_title: "Biallelic loss-of-function variants in TBC1D2B cause a neurodevelopmental disorder with seizures and gingival overgrowth."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Serum deprivation of TBC1D2B-deficient HeLa cell lines caused a decrease
        in cell viability and an increase in apoptosis.
      explanation: Knockout cancer cell line; INDIRECT for neurons.
  - target: Gingival Epithelial E-cadherin Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Hypothesis: TBC1D2B restrains E-cadherin internalisation in epithelial
      cells, so its loss could reduce surface E-cadherin in gingival epithelium.
      The E-cadherin result comes from lung cancer cells overexpressing
      TBC1D2B, and gingival E-cadherin has been examined in one patient only.
    evidence:
    - reference: PMID:31719531
      reference_title: "ZEB1/NuRD complex suppresses TBC1D2b to stimulate E-cadherin internalization and promote metastasis in lung cancer."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Mechanistically, we find that aberrant suppression of TBC1D2b
        contributes to the endocytosis and degradation of E-cadherin to promote
        EMT.
      explanation: Lung cancer cell lines; extrapolated to gingiva.
  - target: Fibrous dysplasia of the mandible
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The jaw lesions occur only with biallelic loss of TBC1D2B, but no study
      has examined how. The proposed route through RAB5, RAC1 and NF-kB/NFATc1
      signalling in osteoclast progenitors is a hypothesis.
    evidence:
    - reference: PMID:39201553
      reference_title: "Genetic Variants in the TBC1D2B Gene Are Associated with Ramon Syndrome and Hereditary Gingival Fibromatosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Thus, the alteration in the TBC1D2B protein may also lead to a
        cherubism-like phenotype via the abnormal activation of downstream RAB5,
        overactivation of RAC1, abnormal NFkB, and NFACT1 signaling in
        osteoclast progenitor cells
      explanation: The authors' proposed mechanism; not tested.
  - target: Mandibular prognathia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Co-occurrence with TBC1D2B loss; no mechanism studied.
    evidence:
    - reference: PMID:38374468
      reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        the TBC1D2B disorder is a progressive neurological disease with
        gingival overgrowth and mandibular prognathia or cherubism as
        characteristic associated abnormalities
      explanation: Mandibular prognathia is a characteristic feature of the disorder; the causal step is not shown.

- name: Gingival Epithelial E-cadherin Loss
  biological_scale: TISSUE
  description: >
    In one patient's overgrown gingiva, E-cadherin staining appeared decreased
    in the basal epithelium, with increased BCL-2 and beta-catenin, which the
    authors read as epithelial-to-mesenchymal transition. The gingiva shows
    elongated rete ridges over markedly thickened fibrous connective tissue
    with normal fibroblast density. This is one patient, by
    immunohistochemistry.
  locations:
  - preferred_term: gingiva
    term:
      id: UBERON:0001828
      label: gingiva
  evidence:
  - reference: PMID:39201553
    reference_title: "Genetic Variants in the TBC1D2B Gene Are Associated with Ramon Syndrome and Hereditary Gingival Fibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Our immunohistochemical study showed decreased expression of E-cadherin in
      the gingiva of the patient with Ramon syndrome (patient 1), supporting the
      involvement of the epithelial-to-mesenchymal transition in the
      pathogenesis of Ramon syndrome.
    explanation: Patient gingival tissue.
  downstream:
  - target: Gingival overgrowth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Proposed: epithelial-to-mesenchymal transition drives gingival
      overgrowth. Not tested experimentally for TBC1D2B.
    evidence:
    - reference: PMID:39201553
      reference_title: "Genetic Variants in the TBC1D2B Gene Are Associated with Ramon Syndrome and Hereditary Gingival Fibromatosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Thus, it is hypothesized that aberrant TBC1D2B activity may lead to an
        increased epithelial-to-mesenchymal transition, degradation of
        E-cadherin, and subsequent epithelial dysplasia.
      explanation: The authors' hypothesis.

- name: Hereditary gingival fibromatosis
  disease_term:
    preferred_term: hereditary gingival fibromatosis
    term:
      id: MONDO:0016070
      label: hereditary gingival fibromatosis
  description: >-
    Isolated, slowly progressive, non-inflammatory gingival overgrowth, usually
    autosomal dominant.
  distinguishing_features:
  - No seizures, developmental delay or neurological deterioration.
  - Overgrowth usually begins with eruption of the permanent teeth rather than in early childhood.
  evidence:
  - reference: PMID:39201553
    reference_title: "Genetic Variants in the TBC1D2B Gene Are Associated with Ramon Syndrome and Hereditary Gingival Fibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In most patients, overgrown gingiva begins at the time when the permanent
      teeth erupt; however, in rare occasions it may appear along with the
      eruption of the primary teeth
    explanation: Typical age of onset of isolated hereditary gingival fibromatosis.
discussions:
- discussion_id: nedsgo_mechanism_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which TBC1D2B-dependent process (RAB7 inactivation, early endocytosis,
    autophagy initiation or stress survival) fails in neurons, gingival
    epithelium and jaw osteoclast lineage cells, and why does the disease
    progress in only some patients with predicted loss-of-function alleles?
  attaches_to:
  - pathophysiology#CNS Neuronal Dysfunction and Degeneration
  - pathophysiology#Gingival Epithelial E-cadherin Loss
  rationale: >
    All functional data come from patient fibroblasts and leukocytes, a
    knockout HeLa line and cancer cell lines; there is no neuronal model, no
    animal model and no neuropathology. The gingival E-cadherin finding rests on
    one patient. A homozygous p.(Glu9*) adult had a mild course while a
    compound heterozygote died at 26, so modifiers are likely.

differential_diagnoses:
- name: Ramon syndrome
  disease_term:
    preferred_term: Ramon syndrome
    term:
      id: MONDO:0009954
      label: Ramon syndrome
  description: >-
    Gingival fibromatosis, cherubism, seizures and intellectual disability, with
    hypertrichosis and short stature. A homozygous ELMO2 missense variant was
    reported in one Lebanese family with this diagnosis; a Thai patient with the
    Ramon phenotype carried a homozygous TBC1D2B frameshift and is counted in
    this entry.
  distinguishing_features:
  - Developmental or cognitive regression has not been described in Ramon syndrome.
  - >-
    Hypertrichosis is part of Ramon syndrome; none of the ten subjects in the
    2024 TBC1D2B series had it, though the title of a 2026 TBC1D2B case report
    (PMID:41817446, text not retrieved) names it.
  - Biallelic ELMO2 rather than TBC1D2B variants in the ELMO2-associated family.
  evidence:
  - reference: PMID:38374468
    reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While a hallmark of the TBC1D2B disorder is mental deterioration
      associated with cerebellar and/or cerebral atrophy and lateral
      ventricular dilatation, developmental or cognitive regression has not
      been described in Ramon syndrome
    explanation: The distinguishing feature named by the 2024 series.
  - reference: PMID:38374468
    reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, subjects with biallelic TBC1D2B variants did not have
      hypertrichosis and hypoplastic distal phalanges of fingers and/or toes.
    explanation: Hypertrichosis was absent in the 2024 TBC1D2B series.
  - reference: PMID:29095483
    reference_title: "Homozygous mutation in ELMO2 may cause Ramon syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Whole exome sequencing studies performed on the family revealed the
      presence of a novel homozygous missense mutation in ELMO2 gene, p.I606S
      in the affected individuals.
    explanation: ELMO2 as a cause of Ramon syndrome.

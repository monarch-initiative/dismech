name: Neurodevelopmental Disorder With Seizures And Gingival Overgrowth
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
description: >
  Neurodevelopmental disorder with seizures and gingival overgrowth (NEDSGO) is
  an autosomal recessive disorder caused by biallelic loss-of-function variants
  in TBC1D2B, which encodes a TBC-domain RAB GTPase-activating protein. It was
  defined in 2020 in three unrelated individuals and has since been reported in
  roughly 20 affected individuals from about a dozen families. Gingival
  overgrowth usually starts in early childhood, and most patients develop
  seizures, with onset anywhere from infancy to the fourth decade. Early
  development may be normal or delayed. In about half of the reported patients
  the disease is progressive: mental deterioration with gait ataxia and slurred
  speech begins between about 5 and 20 years, with cerebellar and/or cerebral
  atrophy, movement disorders (tremor, dystonia, myoclonus), flexion
  contractures, visual loss and, at the severe end, loss of ambulation,
  respiratory failure needing ventilation and death in early adulthood. The jaw
  is often abnormal, with mandibular prognathia and, in a few patients, fibrous
  dysplasia of the mandible or maxilla diagnosed as cherubism. Low blood counts,
  hearing loss and facial freckling have been reported in some patients.

  Disease alleles are nonsense, frameshift, splice and one missense variant;
  patient fibroblasts show absent or reduced TBC1D2B protein. TBC1D2B is a GAP
  for RAB7 recruited by RAB31 and RAB22A, localises to RAB5-positive early
  endocytic vesicles, binds LC3/GABARAP proteins, and promotes autophagy
  initiation. TBC1D2B-knockout
  HeLa cells internalise less epidermal growth factor and die more readily
  under serum starvation. How these cellular defects produce the
  neurodegeneration, the seizures and the gingival and jaw overgrowth has not
  been studied in neurons, gingiva, bone or an animal model, so every edge
  beyond the cell-line findings is recorded as inferred. Treatment is
  symptomatic: antiseizure medication and gingivectomy.
synonyms:
- NEDSGO
- TBC1D2B-related neurodevelopmental disorder
- TBC1D2B-related disorder

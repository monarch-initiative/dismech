      reference_title: "Loss of TBC1D2B causes a progressive neurological disorder with gingival overgrowth."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        As TBC1D2B has been shown to positively regulate autophagy, defects in
        autophagy and the endolysosomal system could be associated with neuronal
        dysfunction and the neurodegenerative disease in the affected
        individuals.
      explanation: The authors' hypothesis.

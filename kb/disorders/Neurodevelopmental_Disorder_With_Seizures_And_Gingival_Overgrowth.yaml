- name: Dysregulated RAB7-Dependent Endolysosomal Trafficking
  biological_scale: CELLULAR
  description: >
    In cultured cells RAB22A and RAB31 recruit TBC1D2B to endosomes, where it
    inactivates RAB7 and so restrains endosome maturation and fusion of
    late endosomes with lysosomes. Loss of this brake is expected to change
    endolysosomal flux; the direction and consequence in neurons are unknown.
  biological_processes:
  - preferred_term: endosomal transport
    modifier: ABNORMAL
    term:
      id: GO:0016197
      label: endosomal transport
  evidence:
  - reference: PMID:32958903
    reference_title: "RAB31 marks and controls an ESCRT-independent exosome pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Taking together, these results reveal that RAB31 recruits TBC1D2B to
      inactivate RAB7, which in turn suppresses the fusion of late
      endosomes/MVEs with lysosomes.
    explanation: Normal role of TBC1D2B in the endolysosomal pathway.
  downstream:
  - target: CNS Neuronal Dysfunction and Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Proposed by the 2024 series; endolysosomal defects in neurons have not
      been shown.
    evidence:

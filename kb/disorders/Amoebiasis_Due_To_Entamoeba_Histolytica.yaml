treatments:
- name: Nitroimidazole tissue amoebicide therapy
  description: >-
    Symptomatic intestinal or extraintestinal amoebiasis is treated first with a
    systemic nitroimidazole tissue amoebicide such as metronidazole or
    tinidazole to kill invasive trophozoites in tissue.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: tinidazole
      term:
        id: CHEBI:63627
        label: tinidazole
  target_mechanisms:
  - target: Cysteine-protease inflammatory invasion
    treatment_effect: INHIBITS
    description: >-
      Nitroimidazoles kill tissue-invasive trophozoites driving amoebic colitis.
  - target: Amoebic liver abscess formation
    treatment_effect: INHIBITS
    description: >-
      Nitroimidazoles treat extraintestinal invasive trophozoites within amoebic
      liver abscesses.
  evidence:

references:
- reference: PMID:41809248
  title: Recent advances in the diagnosis and management of amoebiasis.
  findings:
  - statement: >-
      The review covers modern amoebiasis diagnosis and treatment, including
      serology, tissue plus luminal amoebicides, and drainage indications for
      selected liver abscesses.
    supporting_text: >-
      Diagnostic methods comprise faecal microscopy, microscopy of rectal
      scrapes, serology, histopathology and nucleic acid detection
- reference: PMID:36519347
  title: Pathogenicity and virulence of Entamoeba histolytica, the agent of amoebiasis.
  findings:
  - statement: >-
      E. histolytica virulence depends on adhesion, contact-dependent host-cell
      killing, proteases, and inflammation.
    supporting_text: >-
      Trophozoites acquire a virulent phenotype which, when non-controlled, leads
      to intestinal invasion with the onset of amoebiasis symptoms.
- reference: PMID:30046644
  title: >-
    A Review of the Global Burden, New Diagnostics, and Current Therapeutics for
    Amebiasis.
  findings:
  - statement: >-
      The review summarizes fecal-oral transmission, excystation, encystation,
      and species-specific diagnostics for E. histolytica.
    supporting_text: >-
      Following ingestion, excystation to trophozoites occurs, and the released
      trophozoites migrate to the large intestine, multiplying by binary fission
      to produce more cysts.

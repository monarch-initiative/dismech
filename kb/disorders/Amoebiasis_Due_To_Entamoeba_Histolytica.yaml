diagnosis:
- name: E. histolytica stool or liver-aspirate PCR
  description: >-
    Species-specific DNA amplification on stool or liver abscess aspirate
    distinguishes E. histolytica from non-pathogenic Entamoeba species.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These are performed on stool samples or liver abscess aspirate and can
      accurately differentiate E. histolytica from non-pathogenic species.
    explanation: >-
      Supports PCR on stool or aspirate as a species-discriminating diagnostic
      test.
- name: E. histolytica Gal/GalNAc lectin antigen ELISA
  description: >-
    Monoclonal-antibody antigen ELISA detects E. histolytica Gal/GalNAc lectin
    in stool samples or liver abscess aspirates.
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antigen detection using ELISA is a simple and readily available technique,
      using a monoclonal antibody to E. histolytica Gal/GalNAc lectin in stool
      samples and liver abscess aspirate.
    explanation: >-
      Supports E. histolytica lectin antigen detection in stool and liver
      aspirates.
treatments:
- name: Nitroimidazole plus luminal amoebicide therapy
  description: >-
    Symptomatic intestinal or extraintestinal amoebiasis is treated with a
    systemic nitroimidazole tissue amoebicide such as metronidazole or
    tinidazole, followed by a luminal agent such as paromomycin to eradicate
    intraluminal cyst carriage and reduce recurrence.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: tinidazole
      term:
        id: CHEBI:63627
        label: tinidazole
    - preferred_term: paromomycin
      term:
        id: CHEBI:7934
        label: paromomycin
  target_mechanisms:
  - target: Colonic epithelial adhesion and cytolysis
    treatment_effect: INHIBITS
    description: >-
      Nitroimidazole tissue amoebicides kill invasive trophozoites that injure
      colonic epithelium.
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tissue amoebicidal agents are nitroimidazole antibiotics, such as
      metronidazole and tinidazole
    explanation: >-
      Identifies metronidazole and tinidazole as systemic tissue-active
      nitroimidazoles.
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Luminal amoebicides include paromomycin, diloxanide furoate (no longer
      available in the UK), iodoquinol and nitazoxanide.
    explanation: >-
      Identifies paromomycin as a luminal cyst-eradicating amoebicide.

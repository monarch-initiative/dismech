name: Amoebiasis due to Entamoeba histolytica
creation_date: '2026-11-14T00:00:00Z'
category: Infectious Disease
description: >-
  Amoebiasis due to Entamoeba histolytica is a fecal-orally transmitted
  protozoal infection in which environmentally resistant cysts are ingested from
  fecally contaminated food, water, hands, or fecal sexual exposure, excyst into
  trophozoites in the intestine, and either remain as asymptomatic luminal
  carriage or invade the colonic mucosa. Invasive trophozoites adhere to and
  lyse colonic epithelial cells, release cysteine proteases and induce
  inflammatory injury that produces amoebic colitis with bloody diarrhea, and
  can enter the portal circulation to seed extraintestinal amoebic liver
  abscesses.
disease_term:
  preferred_term: amoebiasis due to Entamoeba histolytica
  term:
    id: MONDO:0019028
    label: amoebiasis due to Entamoeba histolytica
parents:
- parasitic infectious disease
synonyms:
- Entamoeba histolytica infection
- Amebiasis
notes: >-
  Lump/split decision: this entry covers intestinal and extraintestinal
  amoebiasis caused by E. histolytica. It is separate from the free-living
  amoebae stub, which covers Acanthamoeba, Balamuthia, Naegleria, and Sappinia
  central-nervous-system or ocular diseases rather than fecal-orally transmitted
  Entamoeba colitis and liver abscess.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:41809248
      reference_title: Recent advances in the diagnosis and management of amoebiasis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Entamoeba histolytica is the only species of the protozoal genus
        Entamoeba known to cause the disease known as amoebiasis.
      explanation: >-
        Establishes E. histolytica amoebiasis as a protozoal infectious disease.
definitions:
- name: Entamoeba histolytica intestinal or extraintestinal infection
  definition_type: CASE_DEFINITION
  description: >-
    Human amoebiasis is infection with E. histolytica, spanning asymptomatic
    luminal cyst passage, invasive amoebic colitis, and extraintestinal
    dissemination most commonly manifesting as amoebic liver abscess.
  scope: Clinical root for E. histolytica intestinal and extraintestinal disease
  evidence:
  - reference: PMID:36519347
    reference_title: >-
      Pathogenicity and virulence of Entamoeba histolytica, the agent of
      amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The amoeba parasite Entamoeba histolytica is the causative agent of human
      amebiasis, an enteropathic disease affecting millions of people worldwide.
    explanation: >-
      Identifies E. histolytica as the cause of human amoebiasis.
  - reference: PMID:36519347
    reference_title: >-
      Pathogenicity and virulence of Entamoeba histolytica, the agent of
      amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Asymptomatic infections are most common, while symptoms of invasive
      amoebiasis develop in about 10% of infected people
    explanation: >-
      Supports a disease frame that includes both asymptomatic carriage and
      invasive disease.
infectious_agent:
- name: Entamoeba histolytica
  infectious_agent_term:
    preferred_term: Entamoeba histolytica
    term:
      id: NCBITaxon:5759
      label: Entamoeba histolytica
  description: >-
    Invasive enteric amoebozoan parasite with a two-form cyst and trophozoite
    life cycle in humans.
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Entamoeba histolytica is the only species of the protozoal genus Entamoeba
      known to cause the disease known as amoebiasis.
    explanation: >-
      Names E. histolytica as the Entamoeba species causing amoebiasis.
agent_life_cycle:
  description: >-
    E. histolytica alternates between a fecally shed, environmentally resistant
    cyst that infects new hosts by ingestion and a motile trophozoite that
    emerges after excystation, migrates to the large intestine, multiplies,
    encysts for fecal shedding, or invades the colonic epithelium.
  hosts:
  - preferred_term: humans
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: reservoir and clinical host
  life_cycle_stages:
  - name: Fecally shed mature cyst
    description: >-
      Mature cysts are the environmentally resistant form shed in stool and
      transmitted to a new person by fecal-oral contamination.
    evidence:
    - reference: PMID:36519347
      reference_title: >-
        Pathogenicity and virulence of Entamoeba histolytica, the agent of
        amoebiasis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Mature cysts are excreted in the host’s stool and are transferred to
        another human via a faecal-oral route through contaminated food or water
        or person-to-person contact
      explanation: >-
        Places cysts in the fecal shedding and fecal-oral transmission phase.
  - name: Excysted trophozoites in the large intestine
    description: >-
      Ingested cysts excyst to release trophozoites, which migrate to the large
      intestine, divide, and produce new cysts.
    evidence:
    - reference: PMID:30046644
      reference_title: >-
        A Review of the Global Burden, New Diagnostics, and Current Therapeutics
        for Amebiasis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Following ingestion, excystation to trophozoites occurs, and the released
        trophozoites migrate to the large intestine, multiplying by binary
        fission to produce more cysts.
      explanation: >-
        Supports intestinal excystation, large-intestinal trophozoite
        multiplication, and encystation.
  - name: Invasive trophozoites
    description: >-
      Trophozoites can acquire a virulent phenotype and invade the colonic
      mucosa or pass through the hepatic portal circulation to the liver and
      other extraintestinal sites.
    evidence:
    - reference: PMID:36519347
      reference_title: >-
        Pathogenicity and virulence of Entamoeba histolytica, the agent of
        amoebiasis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Trophozoites acquire a virulent phenotype which, when non-controlled,
        leads to intestinal invasion with the onset of amoebiasis symptoms.
      explanation: >-
        Identifies trophozoites as the invasive symptomatic stage.
transmission:
- name: Fecal-oral cyst transmission
  description: >-
    Humans ingest infectious E. histolytica cysts from fecally contaminated food,
    water, or hands.
  evidence:
  - reference: PMID:30046644
    reference_title: >-
      A Review of the Global Burden, New Diagnostics, and Current Therapeutics
      for Amebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmission occurs after the ingestion of the infectious cyst. This most
      commonly arises from fecally contaminated hands, food, or water
    explanation: >-
      Identifies ingestion of fecally contaminated cysts as the dominant route.
- name: Sexual fecal exposure
  description: >-
    Exposure to fecal material during sex can deliver infectious E. histolytica
    cysts.
  evidence:
  - reference: PMID:30046644
    reference_title: >-
      A Review of the Global Burden, New Diagnostics, and Current Therapeutics
      for Amebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      exposure to fecal matter may occur during sexual contact, in particular
      among MSM groups
    explanation: Supports fecal sexual exposure as a recognized route.
prevalence:
- population: Global
  measure_type: ANNUAL_INCIDENCE
  notes: >-
    The 2025 clinical review reports a worldwide estimate of 50 million
    E. histolytica infections per year with about 55,000 deaths and 2.2 million
    disability-adjusted life-years lost annually, concentrated in low-income
    settings with contaminated water and poor sanitation.
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An estimated 50 million people worldwide are reported to be infected every
      year with E. histolytica
    explanation: Provides the annual global infection estimate.
pathophysiology:
- name: Colonic epithelial adhesion and cytolysis
  description: >-
    E. histolytica trophozoites adhere to colonic epithelium through the
    Gal/GalNAc lectin and damage host cells through amoebapores, cysteine
    proteases, and inflammatory signaling.
  locations:
  - preferred_term: colonic epithelium
    term:
      id: UBERON:0000397
      label: colonic epithelium
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The galactose/N-acetylgalactosamine (Gal/GalNAc) specific lectin 17 19
      allows trophozoites to adhere to the colonic epithelium and cause tissue
      injury by the formation of amoebapores that rupture the host cell
    explanation: >-
      Supports adhesion to colonic epithelium and amoebapore-mediated cell
      injury.
  downstream:
  - target: Cysteine-protease inflammatory invasion
    description: >-
      Adherent trophozoites rupture cells and release cysteine proteases that
      further disrupt mucus, epithelial, and connective-tissue barriers.
- name: Cysteine-protease inflammatory invasion
  description: >-
    Cysteine protease release and interleukin-1/interleukin-8-linked
    inflammation allow trophozoites to invade through the colonic mucosa.
  locations:
  - preferred_term: colonic mucosa
    term:
      id: UBERON:0000317
      label: colonic mucosa
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      release of cysteine proteases and induction of an interleukin-1 and
      interleukin-8-mediated inflammatory response, leading to trophozoite
      invasion and the formation of pathognomonic flask shaped ulceration in the
      submucosa.
    explanation: >-
      Links cysteine proteases and inflammatory signaling to invasive flask-like
      colonic ulcers.
  downstream:
  - target: Amoebic colitis
    description: >-
      Trophozoite invasion and ulceration in the colonic mucosa produce amoebic
      colitis with dysentery.
  - target: Portal dissemination to the liver
    description: >-
      Invasive trophozoites can reach the portal circulation from the
      gastrointestinal tract and disseminate to the liver.
- name: Amoebic colitis
  description: >-
    Intestinal invasion produces amoebic colitis, often manifesting as bloody
    diarrhea.
  locations:
  - preferred_term: colon
    term:
      id: UBERON:0001155
      label: colon
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      those that do develop symptoms will most commonly suffer bloody diarrhoea
      (amoebic colitis) and/or liver abscess
    explanation: >
      Identifies amoebic colitis and bloody diarrhea as common symptomatic
      manifestations of amoebiasis.
- name: Portal dissemination to the liver
  description: >-
    Trophozoites can pass from the gastrointestinal tract into the hepatic portal
    circulation and disseminate extraintestinally, most often to the liver.
  locations:
  - preferred_term: hepatic portal vein
    term:
      id: UBERON:0001639
      label: hepatic portal vein
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:41809248
    reference_title: Recent advances in the diagnosis and management of amoebiasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Access to the portal circulation via the gastrointestinal tract permits
      extraintestinal dissemination, most commonly leading to liver abscess
      formation.
    explanation: >-
      Supports portal spread from the intestine to extraintestinal liver abscess.

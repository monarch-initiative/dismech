inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All major PCH forms show autosomal recessive inheritance. Most cases result from
    homozygous founder mutations (e.g., TSEN54 A307S in PCH2) or compound heterozygous
    loss-of-function alleles.
  evidence:
  - reference: PMID:21749694
    reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pontocerebellar Hypoplasia (PCH) is group of very rare, inherited progressive neurodegenerative disorders with prenatal onset."
    explanation: Review confirming PCH as an inherited neurodegenerative group, consistent with autosomal recessive inheritance established across all subtypes.
  - reference: PMID:20301773
    reference_title: TSEN54 Pontocerebellar Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TSEN54-PCH is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the recessive inheritance of the largest PCH subtype
      group directly.
  - reference: PMID:20301773
    reference_title: TSEN54 Pontocerebellar Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If both parents are known to be heterozygous for a TSEN54 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of inheriting both pathogenic variants and being affected, a 50% chance of
      inheriting one pathogenic variant and being an unaffected carrier, and a
      25% chance of inheriting both normal alleles.
    explanation: >-
      Gives the recurrence risks that follow from the recessive mode recorded
      here.


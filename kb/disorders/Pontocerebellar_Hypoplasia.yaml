    term:
      id: GO:0006388
      label: tRNA splicing, via endonucleolytic cleavage and ligation
    modifier: DECREASED
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  cell_types:

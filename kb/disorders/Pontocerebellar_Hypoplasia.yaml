- name: PCLO mutations (PCH3)
  gene_term:
    preferred_term: PCLO
    term:
      id: hgnc:13406
      label: PCLO
  association: Causative
  subtype: PCH3
  notes: >-
    PCLO encodes Piccolo, a presynaptic active zone scaffold protein. A
    homozygous nonsense PCLO variant underlies PCH3, historically described as
    cerebellar atrophy with progressive microcephaly, making PCH3 the one
    synaptic rather than RNA-processing or metabolic PCH mechanism in this
    entry.
  evidence:
  - reference: PMID:25832664
    reference_title: "Loss of PCLO function underlies pontocerebellar hypoplasia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that a homozygous, nonsense PCLO mutation underlies the
      autosomal recessive neurodegenerative disorder, PCH3.
    explanation: >-
      Establishes biallelic PCLO loss of function as the cause of PCH3.

- name: TOE1 mutations (PCH7)
  gene_term:
    preferred_term: TOE1
    term:
      id: hgnc:15954
      label: TOE1
  association: Causative
  subtype: PCH7
  notes: >-
    TOE1 encodes a deadenylase that trims the 3' ends of small nuclear RNAs.
    Biallelic TOE1 variants cause PCH7, distinguished from other PCH subtypes by
    genital abnormality, presenting as PCH with a 46,XY disorder of sex
    development in individuals with an XY karyotype.
  evidence:
  - reference: PMID:38605133
    reference_title: "Role of TOE1 variants at the nuclear localization motif in pontocerebellar hypoplasia 7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Biallelic TOE1 variants can cause pontocerebellar hypoplasia type 7
      (PCH7), a condition characterized by pontocerebellar hypoplasia with
      genital abnormality.
    explanation: >-
      States the TOE1-PCH7 assignment and the distinguishing genital feature.
  - reference: PMID:42178111
    reference_title: "Pontocerebellar hypoplasia linked mutations of the deadenylase Target of EGR1 (TOE1) impair thermal stability, ribonuclease activity, and oligomerization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We performed characterization of the thermal stability and activity of
      eleven PCH-linked TOE1 variants and found that eight variants have
      significant reduced protein thermal stability and that all but two
      variants impair TOE1's ribonuclease activity, particularly its exonuclease
      activity.
    explanation: >-
      Shows that PCH-linked TOE1 variants reduce the protein's ribonuclease
      activity, supporting loss of function.

- name: CHMP1A mutations (PCH8)
  gene_term:
    preferred_term: CHMP1A
    term:
      id: hgnc:8740
      label: CHMP1A
  association: Causative
  subtype: PCH8
  notes: >-
    CHMP1A encodes a subunit of the ESCRT-III membrane-remodelling complex.
    Biallelic loss of function causes PCH8, reported as reduced cerebellar size
    together with microcephaly. The gene is wired to its own ESCRT-III and
    progenitor-proliferation node rather than being grouped with TBC1D23,
    because no source cited here places CHMP1A in Golgi retrograde transport.
  evidence:
  - reference: PMID:23023333
    reference_title: "CHMP1A encodes an essential regulator of BMI1-INK4A in cerebellar development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that loss-of-function mutations in human CHMP1A cause
      reduced cerebellar size (pontocerebellar hypoplasia) and reduced cerebral
      cortical size (microcephaly).
    explanation: >-
      Establishes biallelic CHMP1A loss of function as a cause of
      pontocerebellar hypoplasia with microcephaly.

- name: AMPD2 mutations (PCH9)
  gene_term:
    preferred_term: AMPD2
    term:
      id: hgnc:469
      label: AMPD2
  association: Causative
  subtype: PCH9
  notes: >-
    AMPD2 encodes adenosine monophosphate deaminase 2. Biallelic variants

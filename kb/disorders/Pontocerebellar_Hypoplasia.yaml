    mice, loss of Chmp1a impairs intraluminal vesicle formation in multivesicular
    bodies and Sonic hedgehog secretion, and the cortical and cerebellar
    progenitors fail to proliferate; in patient cells the proliferation defect
    tracks increased INK4A expression and loss of its normal BMI1 repression.
    Biallelic loss of function gives PCH8. The proliferation arm rather than the
    trafficking arm is what the cited sources tie to reduced cerebellar size, so
    this node is kept separate from the TBC1D23 Golgi node.

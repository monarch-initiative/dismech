- name: SLC25A46 mutations (PCH1E)
  gene_term:
    preferred_term: SLC25A46
    term:
      id: hgnc:25198
      label: SLC25A46
  association: Causative
  subtype: PCH1E
  notes: >-
    SLC25A46 encodes a mitochondrial outer-membrane protein regulating
    mitochondrial fission and fusion. Complete loss of function causes the
    lethal congenital PCH1E phenotype; milder alleles of the same gene cause
    optic atrophy and hereditary motor and sensory neuropathy.
  evidence:
  - reference: PMID:27543974
    reference_title: "Loss of function of SLC25A46 causes lethal congenital pontocerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In siblings from two unrelated families who died soon after birth with a
      profound neurodevelopmental disorder characterized by pontocerebellar
      hypoplasia and apnoea, we discovered a missense mutation and an exonic
      deletion in the SLC25A46 gene encoding a mitochondrial protein recently
      implicated in optic atrophy spectrum disorder.
    explanation: >-
      Reports the biallelic SLC25A46 lesions underlying lethal congenital
      pontocerebellar hypoplasia.
  - reference: PMID:40428407
    reference_title: "Pontocerebellar Hypoplasia Type 1 and Associated Neuronopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PCH1 is defined as PCH variant associated with anterior horn degeneration
      in the spinal cord with muscle weakness and hypotonia, and is associated
      with recessive variants in genes VRK1, EXOSC3, EXOSC8, EXOSC9 and
      SLC25A46.
    explanation: >-
      Places SLC25A46 among the recessive PCH1 genes.

- name: TSEN2 mutations (PCH2B)
  gene_term:
    preferred_term: TSEN2
    term:
      id: hgnc:28422
      label: TSEN2
  association: Causative
  subtype: PCH2B
  notes: >-
    TSEN2 encodes a catalytic subunit of the tRNA splicing endonuclease complex.
    Biallelic TSEN2 variants cause PCH2B, a far rarer PCH2 form than the
    TSEN54-associated PCH2A.
  evidence:
  - reference: PMID:41621844
    reference_title: "[Pontocerebellar hypoplasia type 2B due to compound heterozygous variants of TSEN2 gene: A case report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Literature review has identified six PCH2B patients with missense,
      nonsense, frameshift, and splice site variants of the TSEN2 gene.
    explanation: >-
      Assigns TSEN2 variants to PCH2B and indicates how few cases are reported.
  - reference: PMID:20803644
    reference_title: "Molecular and neuroimaging findings in pontocerebellar hypoplasia type 2 (PCH2): is prenatal diagnosis possible?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Most patients with PCH2 have mutations in TSEN54, with occasional
      mutations found in TSEN34 or TSEN2, genes that encode subunits of tRNA
      splicing endonuclease.
    explanation: >-
      Supports TSEN2 as an infrequent PCH2 gene relative to TSEN54.

- name: TSEN34 mutations (PCH2C)

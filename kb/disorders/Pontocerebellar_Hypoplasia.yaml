- name: Impaired Cerebellar Development and Progressive Degeneration
  description: >
    Convergent downstream consequence of TSEN complex dysfunction, mitochondrial
    tRNA synthetase deficiency, and motor neuron degeneration. Pontocerebellar
    neurons fail to develop normally in utero (prenatal onset), followed by progressive
    postnatal degeneration. Neuropathology shows reduced cerebellar volume, simplified
    or absent foliation, and hypoplastic pons with loss of pontine nuclei. The cerebral
    cortex is relatively spared. MRI shows the characteristic dragonfly or butterfly
    sign of hypoplastic cerebellar hemispheres with preserved vermis in PCH2.
  evidence:
  - reference: PMID:20952379
    reference_title: "Clinical, neuroradiological and genetic findings in pontocerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common characteristics are cerebellar hypoplasia with variable atrophy of the cerebellum and the ventral pons."
    explanation: Confirms cerebellar and pontine hypoplasia as the universal neuropathological endpoint across PCH subtypes.
  - reference: PMID:20952379
    reference_title: "Clinical, neuroradiological and genetic findings in pontocerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a strong correlation (P < 0.0005) between TSEN54 mutations and a dragonfly-like cerebellar pattern on magnetic resonance imaging, in which the cerebellar hemispheres are flat and
      severely reduced in size and the vermis is relatively spared."
    explanation: Establishes the characteristic dragonfly MRI pattern as a radiological correlate of the cerebellar degeneration in TSEN54-related PCH.
  downstream:
  - target: Cerebellar Hypoplasia
    description: >-
      Cerebellar hypoplasia with prenatal onset and progressive postnatal atrophy is the cardinal structural consequence of the converged mechanism.
    evidence:
    - reference: PMID:21749694
      reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All subtypes share common characteristics, including hypoplasia/atrophy of
        cerebellum and pons, progressive microcephaly, and variable cerebral
        involvement.
      explanation: >-
        Names cerebellar hypoplasia as a characteristic shared across all PCH subtypes.
  - target: Hypoplasia of the Pons
    description: >-
      Loss of pontine nuclei and transverse fibres accompanies the cerebellar lesion in most subtypes.
    evidence:
    - reference: PMID:21749694
      reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All subtypes share common characteristics, including hypoplasia/atrophy of
        cerebellum and pons, progressive microcephaly, and variable cerebral
        involvement.
      explanation: >-
        Names pontine hypoplasia or atrophy as a characteristic shared across all PCH subtypes.
  - target: Progressive Microcephaly
    description: >-
      Continuing postnatal degeneration produces head growth that falls progressively away from the normal range.
    evidence:
    - reference: PMID:21749694
      reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All subtypes share common characteristics, including hypoplasia/atrophy of
        cerebellum and pons, progressive microcephaly, and variable cerebral
        involvement.
      explanation: >-
        Names progressive microcephaly as a characteristic shared across all PCH subtypes.
  - target: Severe Intellectual Disability
    description: >-
      Failure of pontocerebellar development and ongoing degeneration leave profound cognitive impairment.
    evidence:
    - reference: PMID:21749694
      reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients have severe cognitive and motor handicaps and seizures are often
        reported.
      explanation: >-
        States that patients have severe cognitive handicaps.
  - target: Seizures
    description: >-
      Cortical and subcortical involvement accompanying the pontocerebellar lesion gives rise to seizures in a large fraction of patients.
    evidence:
    - reference: PMID:21749694
      reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients have severe cognitive and motor handicaps and seizures are often
        reported.
      explanation: >-
        States that seizures are often reported in PCH.
  - target: Progressive Neurodegeneration and Poor Survival
    description: >-
      Degeneration continues after birth and determines the poor prognosis of the group.
    evidence:
    - reference: PMID:21749694
      reference_title: "Classification, diagnosis and potential mechanisms in pontocerebellar hypoplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

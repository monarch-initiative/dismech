- name: Spliceosome and snRNA Maturation Failure
  description: >-
    Two PCH genes act on the maturation and function of small nuclear RNAs and
    the major spliceosome rather than on tRNA. TOE1 is a deadenylase that trims
    snRNA 3' ends, and PPIL1 is a peptidyl-prolyl isomerase component of the
    spliceosome. These are two steps in one pathway rather than two categories:
    the snRNAs TOE1 matures are components of the spliceosome PPIL1 belongs to,
    so biallelic loss of either gene converges on the same defect, loss of
    splicing integrity in developing neurons, giving PCH7 and PCH14
    respectively.

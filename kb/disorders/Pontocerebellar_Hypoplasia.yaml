- name: RNA Exosome Dysfunction (PCH1B/1C/1D)
  description: >
    Biallelic mutations in the structural subunits of the nine-subunit RNA exosome
    impair RNA processing and turnover and cause the PCH1 subtypes: EXOSC3 gives
    PCH1B, EXOSC8 gives PCH1C, and EXOSC9 gives PCH1D. This mechanism produces
    pontocerebellar hypoplasia with spinal muscular atrophy-like weakness and global
    developmental delay, but survival and clinical severity vary by genotype. In
    zebrafish and human cell models, loss of exosome subunits stabilises p53 and
    perturbs ribosome biogenesis, which has been proposed as the route from exosome
    deficiency to the neuronal loss seen in PCH1.

    - reference: PMID:29903031
      reference_title: "What's new in pontocerebellar hypoplasia? An update on genes and subtypes."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Seventeen PCH-related genes are now listed in the OMIM database, most of
        them have a function in RNA processing or translation.
      explanation: >-
        States that RNA processing and translation is the dominant but not universal
        functional theme across PCH genes.
  - statement: >-
      The PCH classification has been criticised as confusing because it bundles
      non-degenerative and postnatal-onset disorders with the classical prenatal ones.
    evidence:
    - reference: PMID:29903031
      reference_title: "What's new in pontocerebellar hypoplasia? An update on genes and subtypes."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        By including such a broad range of phenotypes, including non-degenerative
        and postnatal onset disorders, the current classification gives rise to
        confusion.
      explanation: >-

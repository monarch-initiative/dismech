  description: >-
    Pontocerebellar hypoplasia type 1E is the SLC25A46-associated form of PCH1.
    SLC25A46 encodes a mitochondrial outer-membrane protein of the fission and
    fusion machinery rather than an RNA-processing factor, so PCH1E reaches the
    PCH1 phenotype by a mechanism distinct from the RNA exosome subtypes. Loss
    of function was first reported in neonatally lethal pontocerebellar
    hypoplasia with apnoea; milder SLC25A46 alleles cause optic atrophy and
    peripheral neuropathy.

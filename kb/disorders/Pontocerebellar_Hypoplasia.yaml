        entry's has_subtypes list follows.

notes: >-
  PCH encompasses many molecularly defined subtypes sharing prenatal-onset cerebellar
  and pontine hypoplasia; the `has_subtypes` list on this entry enumerates the ones curated
  so far, each anchored to its own MONDO term and causal gene. PCH2E (VPS53) and the
  VPS51-related PCH13 phenotype, and PCH2D (SEPSECS), are curated as separate dismech
  entries rather than as rows here. PCH15 (MONDO:0030259) is not curated anywhere in
  dismech and MONDO records no causal gene for it.
  Key distinguishing features: PCH2 (TSEN54) shows the
  characteristic dragonfly MRI pattern with flat hemispheres and relative vermis sparing,
  progressive microcephaly, and dyskinesia; PCH4 (TSEN54 null alleles) is neonatal lethal;
  PCH1A (VRK1) adds spinal muscular atrophy-like anterior horn cell degeneration; PCH6 (RARS2)
  has elevated CSF lactate reflecting mitochondrial dysfunction. RNA processing and tRNA
  metabolism are central pathogenic themes across subtypes. No curative therapy exists.
  Prognosis is poor with most patients dying in infancy or childhood.

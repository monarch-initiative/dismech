name: Pontocerebellar Hypoplasia
creation_date: "2026-04-25T00:00:00Z"
category: Mendelian
description: >
  Pontocerebellar hypoplasia (PCH) is a clinically and genetically heterogeneous group of
  autosomal recessive neurodegenerative disorders characterized by prenatal-onset hypoplasia and
  progressive atrophy of the cerebellum and ventral pons, severe intellectual disability,
  limited motor development, and variable extra-neural features. PCH is divided into numbered
  subtypes, each defined by its causal gene; most of the genes function in RNA processing or
  translation, the tRNA splicing endonuclease (TSEN) complex and the RNA exosome being the
  largest groups among the subtypes curated here, and PCH2 (TSEN54) is the most common form.
  Several subtypes fall outside that theme entirely: PCH3 is a presynaptic active zone defect
  (PCLO), PCH8 an ESCRT-III defect in which cerebellar progenitors fail to proliferate (CHMP1A),
  PCH11 a Golgi retrograde-trafficking defect (TBC1D23), PCH9, PCH12 and PCH16 metabolic enzyme
  deficiencies (AMPD2, COASY, MINPP1), PCH1E a mitochondrial dynamics defect (SLC25A46), and
  PCH17 a failure of cerebellar GABAergic neuron specification (PRDM13). No disease-modifying
  therapy exists and management remains supportive.

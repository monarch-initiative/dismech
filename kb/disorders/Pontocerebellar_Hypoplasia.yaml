- name: PRDM13 mutations (PCH17)
  gene_term:
    preferred_term: PRDM13
    term:
      id: hgnc:13998
      label: PRDM13
  association: Causative
  subtype: PCH17
  notes: >-
    PRDM13 encodes a transcriptional repressor expressed in cerebellar
    ventricular zone progenitors. Biallelic PRDM13 variants cause PCH17, a fatal
    perinatal brainstem phenotype with cerebellar hypoplasia and disrupted
    Purkinje cell differentiation. A separate PRDM13 phenotype combines
    cerebellar dysfunction with hypogonadotropic hypogonadism.
  evidence:
  - reference: PMID:35390279
    reference_title: "Recessive PRDM13 mutations cause fatal perinatal brainstem dysfunction with cerebellar hypoplasia and disrupt Purkinje cell differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe four families with children presenting with severe neonatal
      brainstem dysfunction and pronounced deficits in cognitive and motor
      development associated with four different bi-allelic mutations in PRDM13,
      including homozygous truncating variants in the most severely affected
      individuals.
    explanation: >-
      Establishes biallelic PRDM13 mutation as the cause of this PCH-like
      perinatal phenotype.
  - reference: PMID:35390279
    reference_title: "Recessive PRDM13 mutations cause fatal perinatal brainstem dysfunction with cerebellar hypoplasia and disrupt Purkinje cell differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      snRNA-seq data mining and in situ hybridization in humans show that PRDM13
      is expressed at early stages in the progenitors of the cerebellar
      ventricular zone, which gives rise to cerebellar GABAergic neurons,
      including Purkinje cells.
    explanation: >-
      Sources the cerebellar ventricular zone progenitor expression described
      here.

diagnosis:
- name: Neuroimaging and Clinical Subtype Assessment
  description: >
    Brain MRI is central to recognizing PCH, documenting cerebellar and ventral
    pontine hypoplasia, and distinguishing subtype patterns such as the
    TSEN54-related dragonfly-like cerebellar pattern. Serial clinical and imaging
    data help separate prenatal maldevelopment from progressive postnatal
    atrophy.
  diagnosis_term:
    preferred_term: MRI of the brain
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: DOI:10.1093/braincomms/fcaf298
    reference_title: "Pontocerebellar hypoplasia: a review from 1912 to 2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can be diagnosed prenatally or postnatally with a combination of clinical, neuroimaging and genetic data obtained over time."
    explanation: Supports integrated clinical and neuroimaging assessment as part of PCH diagnosis.
  - reference: PMID:20952379
    reference_title: "Clinical, neuroradiological and genetic findings in pontocerebellar hypoplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a strong correlation (P < 0.0005) between TSEN54 mutations and a dragonfly-like cerebellar pattern on magnetic resonance imaging, in which the cerebellar hemispheres are flat and
      severely reduced in size and the vermis is relatively spared."
    explanation: Supports brain MRI as a subtype-informative diagnostic procedure, especially for TSEN54-related PCH2/PCH4.

- name: Molecular Genetic Testing
  description: >
    Multigene panel, exome, or genome testing should evaluate the broad PCH gene
    spectrum and classify subtype-specific causes, including TSEN54/TSEN genes,
    RARS2, VRK1, EXOSC3, and CLP1. Biallelic variant interpretation is essential
    for subtype assignment, recurrence-risk counseling, and prenatal options.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: DOI:10.1093/braincomms/fcaf298
    reference_title: "Pontocerebellar hypoplasia: a review from 1912 to 2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis conveys significant implications for the affected individual and their families and requires a combination of clinical, neuroradiographic, and genetic testing to best inform
      type/subtype categorization of pontocerebellar hypoplasia."
    explanation: Supports genetic testing as a diagnostic requirement for PCH type/subtype categorization.
  - reference: PMID:20301773
    reference_title: TSEN54 Pontocerebellar Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      is confirmed by the presence of biallelic TSEN54 pathogenic variants.
    explanation: >-
      GeneReviews states that biallelic variant detection is what confirms the
      diagnosis in the TSEN54 subtypes.
  - reference: PMID:25144110
    reference_title: EXOSC3 Pontocerebellar Hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      is confirmed by the presence of biallelic EXOSC3 pathogenic variants

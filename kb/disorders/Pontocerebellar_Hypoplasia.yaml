  evidence:
  - reference: PMID:29463858
    reference_title: "Clinical and genetic spectrum of AMPD2-related pontocerebellar hypoplasia type 9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified homozygous or compound heterozygous AMPD2 variants in eight
      PCH-affected individuals from six families.
    explanation: >-
      Establishes biallelic AMPD2 variants as a cause of pontocerebellar
      hypoplasia.
  - reference: PMID:29463858
    reference_title: "Clinical and genetic spectrum of AMPD2-related pontocerebellar hypoplasia type 9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The existence of various AMPD2 isoforms with different functions possibly

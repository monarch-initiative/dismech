      loss, retinitis pigmentosa and distinctive facies.
    explanation: >-
      Assigns biallelic EXOSC9 variants to PCH1D.
  - reference: PMID:31768969
    reference_title: "The RNA Exosome and Human Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      mutations in the structural exosome gene EXOSC9 cause a PCH-like disease

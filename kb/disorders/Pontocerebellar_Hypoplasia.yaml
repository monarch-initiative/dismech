    term:
      id: MONDO:0016759
      label: pontocerebellar hypoplasia type 2
  description: >
    The most common form of PCH, caused by TSEN54 mutations (most commonly the A307S
    founder allele). Characterized by progressive microcephaly, dyskinesia, and seizures
    with relative preservation of the brainstem. This row is the PCH2 group term;
    the gene-specific forms are enumerated separately as PCH2A (TSEN54), PCH2B
    (TSEN2), PCH2C (TSEN34) and PCH2F (TSEN15). PCH2D is caused by SEPSECS and
    PCH2E by VPS53; neither is curated on this entry, and VPS53-related PCH2E has
    its own dismech entry. MONDO:0016759.

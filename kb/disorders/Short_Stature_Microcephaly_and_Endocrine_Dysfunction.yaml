name: Short Stature, Microcephaly, and Endocrine Dysfunction
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- SSMED
- XRCC4-related microcephalic primordial dwarfism
- XRCC4 deficiency
description: >
  Short stature, microcephaly, and endocrine dysfunction (SSMED) is a rare
  autosomal recessive microcephalic primordial dwarfism caused by biallelic
  hypomorphic variants in XRCC4, an obligate scaffold of the non-homologous
  end-joining (NHEJ) DNA double-strand-break repair pathway (the binding
  partner of DNA ligase IV / LIG4). Impaired NHEJ produces increased genomic
  instability, prenatal-onset (primordial) extreme growth failure, primary
  microcephaly, facial dysmorphism, and a spectrum of endocrine dysfunction
  (primary gonadal failure, early-onset metabolic syndrome, and in some
  reports hypothyroidism), with possible tumor predisposition. Unlike LIG4
  syndrome and other NHEJ disorders that present with severe combined
  immunodeficiency, XRCC4 deficiency characteristically does NOT cause overt
  immunodeficiency, reflecting differential developmental requirements for NHEJ
  proteins.
disease_term:
  preferred_term: short stature, microcephaly, and endocrine dysfunction
  term:
    id: MONDO:0014686
    label: short stature, microcephaly, and endocrine dysfunction
parents:
- Autosomal recessive disease
- Primordial dwarfism
classifications:
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0190, listed as "Microcephalic osteodysplastic
      primordial dwarfism, XRCC4-related" against OMIM 616541 - the SSMED
      entry this dismech file curates. As with the Seckel rows in the same
      group, dyadic naming means the table carries neither "SSMED" nor "XRCC4
      deficiency", so the OMIM number is what identifies the row. The
      assignment is 1:1: the nosology lists exactly one XRCC4 row and this
      entry curates exactly that entity. Note that the sibling NHEJ disorder
      LIG4 syndrome is not in the 2023 table at all, so its absence here is
      not an oversight to correct.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence estimate has been published. SSMED is
    known from a small number of families reported since 2015 (biallelic XRCC4
    variants identified in several consanguineous and non-consanguineous
    families). Ascertainment is genotype-first, so case counts are not a
    population rate.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic (homozygous or compound heterozygous) hypomorphic XRCC4 variants
    cause the disorder; reported in multiple consanguineous families.
  evidence:
  - reference: PMID:25839420
    reference_title: "Mutations in XRCC4 cause primary microcephaly, short stature and increased genomic instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified in three affected brothers of a consanguineous Turkish family a \nhomozygous mutation, c.482G>A, in the XRCC4 gene"
    explanation: >
      Homozygous XRCC4 variant in three affected brothers of a consanguineous
      family, consistent with autosomal recessive inheritance.
genetic:
- name: XRCC4
  gene_term:
    preferred_term: XRCC4
    term:
      id: hgnc:12831
      label: XRCC4
  relationship_type: CAUSATIVE
  notes: >
    XRCC4 (5q14.2) encodes an obligate scaffold of the NHEJ DNA double-strand
    break repair complex (the binding partner of DNA ligase IV / LIG4).
    Reported biallelic hypomorphic variants include homozygous c.482G>A (a
    splice-affecting variant), compound heterozygous c.25delG (p.His9Thrfs*8)
    and c.823C>T (p.Arg275*), and an in-frame splice deletion of 23 amino acids.
  evidence:
  - reference: PMID:25728776
    reference_title: "Mutations in the NHEJ component XRCC4 cause primordial dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the identification of biallelic mutations in XRCC4 in five families"
    explanation: >
      Establishes biallelic XRCC4 variants as the cause of microcephalic
      primordial dwarfism across five families.
  - reference: PMID:25839420
    reference_title: "Mutations in XRCC4 cause primary microcephaly, short stature and increased genomic instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compound heterozygous mutations c.25delG (p.His9Thrfs*8) and \nc.823C>T (p.Arg275*) in XRCC4"
    explanation: >
      Documents additional loss-of-function XRCC4 variants in an independent
      patient.
pathophysiology:
- name: Impaired Non-Homologous End Joining
  biological_scale: MOLECULAR
  description: >
    XRCC4 is indispensable for non-homologous end joining (NHEJ), the major
    pathway repairing DNA double-strand breaks, acting as the obligate binding
    partner of DNA ligase IV. Biallelic hypomorphic XRCC4 variants impair NHEJ
    and defective double-strand-break repair.
  biological_processes:
  - preferred_term: double-strand break repair via nonhomologous end joining
    term:
      id: GO:0006303
      label: double-strand break repair via nonhomologous end joining
    modifier: DECREASED
  downstream:
  - target: Genomic Instability and Impaired Cell Proliferation
  evidence:
  - reference: PMID:27169690
    reference_title: "Mutations in XRCC4 cause primordial dwarfism without causing immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XRCC4 is indispensable for non-homologous end joining (NHEJ), the \nmajor pathway for repairing DNA double-strand breaks"
    explanation: >
      Establishes XRCC4 as an essential NHEJ component, the function lost in
      disease.
  - reference: PMID:25728776
    reference_title: "Mutations in the NHEJ component XRCC4 cause primordial dwarfism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "immunoglobulin levels are normal, and individuals \nlack overt signs of immunodeficiency"
    explanation: >
      Although XRCC4 NHEJ deficiency impairs immunoglobulin junctional
      diversification, immunoglobulin levels remain normal and patients lack
      overt immunodeficiency — the differential developmental requirement for
      NHEJ proteins that distinguishes XRCC4 deficiency from SCID-causing NHEJ
      disorders (e.g. LIG4 syndrome), as asserted in the entry description.
- name: Genomic Instability and Impaired Cell Proliferation
  biological_scale: CELLULAR
  description: >
    Defective NHEJ leaves DNA double-strand breaks unrepaired, causing
    hypersensitivity to DSB-inducing agents, increased cell death, and genomic
    instability. Impaired proliferation and survival of progenitor cells during
    development is proposed to drive the prenatal-onset growth failure and
    primary microcephaly.
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:25839420
    reference_title: "Mutations in XRCC4 cause primary microcephaly, short stature and increased genomic instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "XRCC4 deficiency leads to hypersensitivity to \nDSB-inducing agents and defective DSB repair, which results in increased cell \ndeath after exposure to genotoxic agents"
    explanation: >
      Patient-cell studies show defective DSB repair and increased cell death,
      the cellular basis of genomic instability and impaired proliferation.
  - reference: PMID:25839420
    reference_title: "Mutations in XRCC4 cause primary microcephaly, short stature and increased genomic instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive mutations in XRCC4 induce increased genomic instability and cause a NHEJ-related syndrome defined by facial dysmorphism, primary microcephaly and short stature"
    explanation: >
      Links XRCC4-driven genomic instability to the core clinical syndrome.

    snippet: "Consensus was achieved on recommendations covering different interventions, aimed at (a) behavioural changes, supragingival biofilm, gingival inflammation and risk factor control; (b) supra- and sub-gingival instrumentation, with and without adjunctive therapies; (c) different types of periodontal surgical interventions; and (d) the necessary supportive periodontal care to extend benefits over time."
    explanation: >

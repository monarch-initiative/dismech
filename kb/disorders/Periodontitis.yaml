discussions:
- discussion_id: oral_gut_axis_human_causality
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Expansion and Ingestion of Oral Pathobionts"
  - "pathophysiology#Ectopic Intestinal Colonisation by Oral Pathobionts"
  - "pathophysiology#Gut-Homing Oral-Pathobiont-Reactive T Cell Induction"
  prompt: >
    Does the oral-to-gut pathobiont translocation chain established in murine and
    gnotobiotic models operate causally in humans with periodontitis, or is the human
    oral-gut association confounded by shared risk factors (smoking, diet, glycaemic
    state) and by the fact that both niches are sampled from the same individual?
  rationale: >
    Every step of the chain modelled here — periodontitis-driven expansion of Klebsiella
    and Enterobacter, ingestion and gut translocation, inflammasome activation in colonic
    mononuclear phagocytes, and gut-tropic imprinting of oral pathobiont-reactive Th17
    cells — rests on murine periodontitis-colitis models and gnotobiotic colonisation of
    germ-free mice. Human data are largely cross-sectional co-detection of oral taxa in
    stool. The review that motivated this curation names causal verification as the
    field's primary open challenge. This is a HUMAN_MODEL_MISMATCH rather than a
    KNOWLEDGE_GAP: the evidence exists and is mechanistically detailed, but its
    translational validity to human periodontitis is unresolved.
  proposed_experiments:
  - experiment_id: exp_perio_oral_gut_strain_tracking
    name: Paired oral-faecal strain-resolved metagenomics through periodontal therapy
    description: >
      Longitudinally sample saliva/subgingival plaque and stool from patients with
      stage III-IV periodontitis before and after a full course of subgingival
      instrumentation, and use strain-resolved metagenomics to test whether
      oral-origin Klebsiella/Enterobacter strains detectable in stool decline as the
      periodontal lesion resolves. Untreated periodontitis patients and periodontally
      healthy controls serve as comparators.
    experiment_type:
      preferred_term: longitudinal human strain-resolved metagenomic cohort study
    decision_criterion: >
      A treatment-associated fall in gut carriage of oral-origin strains, absent in
      untreated controls, would support directional oral-to-gut seeding in humans.
    would_support:
    - >
      Oral pathobionts seed the human gut and the mouth is the upstream reservoir.
    would_refute:
    - >
      Gut carriage of oral-type strains is unchanged by periodontal resolution,
      indicating shared exposure or independent gut colonisation rather than seeding.
  - experiment_id: exp_perio_therapy_ibd_endpoint_trial
    name: Periodontal therapy trial in inflammatory bowel disease with gut endpoints
    description: >
      Randomised trial of intensive versus standard periodontal therapy in patients
      with both periodontitis and inflammatory bowel disease, powered on intestinal
      inflammatory endpoints (faecal calprotectin, endoscopic activity) rather than on
      periodontal outcomes.
    experiment_type:
      preferred_term: randomised interventional clinical trial
    decision_criterion: >
      A significant reduction in intestinal inflammatory activity in the intensive arm
      would establish a causal oral-to-gut contribution in humans.
    would_support:
    - >
      Oral inflammation causally aggravates human intestinal inflammation.
    would_refute:
    - >
      No gut benefit despite periodontal resolution, indicating the murine intermucosal
      connection does not dominate in human disease.
  - experiment_id: exp_perio_gut_homing_t_cell_tracking
    name: Antigen-specific tracking of oral pathobiont-reactive T cells in humans
    description: >
      Identify oral pathobiont-reactive T cells in blood and paired gut biopsies from
      patients with periodontitis, and test whether they carry gut-homing integrin and
      chemokine-receptor imprints, as reported in mice.
    experiment_type:
      preferred_term: human antigen-specific T cell phenotyping study
    decision_criterion: >
      Detection of oral pathobiont-reactive, gut-homing-imprinted T cells in human gut
      tissue would translate the murine T cell arm.
    would_support:
    - >
      The cellular arm of the oral-gut axis operates in humans.
    would_refute:
    - >
      No such population is detectable, leaving only the microbial arm as a candidate
      human mechanism.
  evidence:
  - reference: PMID:42396665
    reference_title: "Oral-gut axis in systemic disease: A barrier-metabolism-immunity three-dimensional regulatory model (Review)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Current challenges include difficulties in causal verification, substantial interindividual variability in intervention efficacy"
    explanation: >
      The source review identifies causal verification as the unresolved problem, which
      is the substance of this mismatch.
- discussion_id: periodontal_therapy_comorbidity_outcomes
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Chronic Systemic Inflammatory Burden and Comorbidity Risk"
  prompt: >
    Does treating periodontitis improve hard clinical outcomes in the associated
    comorbidities, or only surrogate markers?
  rationale: >
    The interventional evidence base for the periodontal-systemic link is largely built
    on surrogate endpoints. The one quantified outcome curated here is a roughly 0.4%
    HbA1c reduction in diabetes; for cardiovascular disease the joint EFP/WHF consensus
    stops at independent association. Without event-driven trials the direction and
    magnitude of any causal benefit remain open, and the comorbidity node should not be
    read as asserting that periodontitis causes its associated diseases.
  proposed_experiments:
  - experiment_id: exp_perio_mace_outcome_trial
    name: Event-driven periodontal therapy trial with cardiovascular endpoints
    description: >
      Randomised trial of intensive versus standard periodontal therapy in patients at
      elevated cardiovascular risk, with major adverse cardiovascular events as the
      primary endpoint rather than surrogate markers such as endothelial function or
      C-reactive protein.
    experiment_type:
      preferred_term: event-driven randomised outcome trial
    decision_criterion: >
      A significant reduction in major adverse cardiovascular events in the intensive
      arm.
    would_support:
    - >
      Periodontal inflammation causally contributes to cardiovascular events.
    would_refute:
    - >
      Surrogate-marker improvement without event reduction, indicating the association
      is largely confounded or non-causal.
  - experiment_id: exp_perio_mendelian_randomisation
    name: Mendelian randomisation of periodontitis against cardio-metabolic outcomes
    description: >
      Use periodontitis-associated germline variants as instruments to estimate the
      causal effect of periodontitis liability on cardio-metabolic outcomes, separating
      association from shared-risk-factor confounding.
    experiment_type:
      preferred_term: Mendelian randomisation analysis
    decision_criterion: >
      A significant instrumented effect surviving pleiotropy-robust sensitivity
      analyses.
    would_support:
    - >
      A causal contribution of periodontitis liability to cardio-metabolic disease.
    would_refute:
    - >
      A null instrumented effect, favouring confounding by smoking and metabolic state.
  evidence:
  - reference: PMID:33510490
    reference_title: "Local and systemic mechanisms linking periodontal disease and inflammatory comorbidities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Emerging evidence from interventional studies indicates that local treatment of periodontitis ameliorates surrogate markers of comorbid conditions."
    explanation: >
      Explicitly characterises the interventional evidence as acting on surrogate
      markers, which is the gap recorded here.
- discussion_id: oral_gut_axis_module_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: >
    Should the oral-gut translocation arm be promoted from disease-level pathophysiology
    to a `kb/modules/` mechanism module?
  rationale: >-
    Issue 6098 asked whether the published barrier-metabolism-immunity oral-gut
    framework warrants a module. The barrier and immunity dimensions are already covered
    by `intestinal_barrier_dysfunction`, `epithelial_barrier_dysfunction`, `gut_dysbiosis`
    and `molecular_mimicry_autoimmunity`, so a three-dimensional module would largely
    duplicate them. The non-redundant kernel is the directional oral-to-gut pathobiont
    route curated here. A module becomes worthwhile once a second conformer exists — the
    natural candidates are `Inflammatory_Bowel_Disease` (the gut end of the same chain)
    and `Rheumatoid_Arthritis` (which already names Porphyromonas gingivalis and
    Aggregatibacter actinomycetemcomitans in the notes of its mucosal-immune-activation
    node without modelling them structurally). Until then, one disease entry does not
    justify a module.

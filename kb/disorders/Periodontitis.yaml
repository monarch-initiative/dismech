name: Periodontitis
creation_date: "2026-08-07T00:00:00Z"
category: Complex
disease_term:
  preferred_term: periodontitis
  term:
    id: MONDO:0005076
    label: periodontitis
parents:
- Oral Cavity Disease
- Inflammatory Disease

synonyms:
- Chronic Periodontitis
- Aggressive Periodontitis
- Periodontal Disease

description: >
  Periodontitis is a chronic, biofilm-driven inflammatory disease of the tooth-supporting
  apparatus — gingiva, periodontal ligament, cementum and alveolar bone. It is not a
  classical infection by a single pathogen but a dysbiosis: an ecological shift in the
  subgingival plaque community that provokes a dysregulated host inflammatory response,
  and it is that host response — not the bacteria directly — that destroys the
  periodontium. A low-abundance keystone organism (canonically Porphyromonas gingivalis)
  can remodel an otherwise commensal community into a dysbiotic one by subverting
  complement and innate immune surveillance. The resulting IL-17/Th17-polarised,
  neutrophil-rich lesion drives osteoclast-mediated resorption of alveolar bone and
  degradation of the periodontal ligament, producing clinical attachment loss, periodontal
  pocketing and, eventually, tooth loss.

  Beyond the mouth, periodontitis is a persistent source of systemic inflammatory burden.
  Periodontal pathogens and inflammatory mediators disseminate haematogenously, and — the
  arm this entry models explicitly — amassed oral pathobionts are also swallowed, seeding
  the gut. This oral-gut route is mechanistically distinct from haematogenous spread and
  is the non-redundant core of the oral-gut axis framework (see notes).
notes: >
  **Scope and modelling decisions.**

  1. *Periodontitis versus dental caries.* Both are oral-biofilm dysbiosis diseases and
     share ecological framing with the `Dental_Caries` entry, but the microbial shift,
     the host response and the destroyed tissue differ: caries is an acidogenic,
     acid-tolerant community demineralising tooth hard tissue; periodontitis is an
     anaerobic, Gram-negative-enriched community driving inflammatory destruction of the
     tooth-supporting soft tissue and bone.

  2. *Necrotizing periodontal diseases, endodontic-periodontal lesions and periodontal
     abscesses* remain distinct categories in the 2017 World Workshop classification
     (PMID:29926951) and are deliberately out of scope here.

  3. *Chronic versus aggressive periodontitis.* The 2017 classification collapsed these
     into a single periodontitis category characterised by stage (I-IV) and grade (A-C)
     rather than by named subtype, so this entry does not model them as `has_subtypes`.
     The synonyms are retained because most of the cited literature predates the
     reclassification.

  4. *Oral-gut axis.* This entry curates the oral-to-gut translocation arm as explicit
     pathophysiology nodes rather than deferring to a new oral-gut axis module. The
     barrier and immunity dimensions of the published three-dimensional framework
     (PMID:42396665) are already covered by existing dismech modules
     (`intestinal_barrier_dysfunction`, `epithelial_barrier_dysfunction`, `gut_dysbiosis`,
     `molecular_mimicry_autoimmunity`); the genuinely non-redundant mechanism is the
     directional one — oral pathobionts amassed in the mouth being ingested and
     ectopically colonising the intestine. See issue 6098 and the
     `oral_gut_axis_module_scope` discussion below.

  5. *Genetic architecture.* Periodontitis is a complex trait; no common-variant locus is
     curated here because the entry's evidence standard requires a verified quotable
     snippet per claim. The monogenic entry point retained is leukocyte adhesion
     deficiency type I (ITGB2/CD18), in which severe periodontal bone loss is invariable
     and mechanistically informative — it demonstrates that defective neutrophil
     recruitment, not neutrophil excess, can drive IL-17-dependent bone loss.

mechanistic_hypotheses:
- hypothesis_group_id: keystone_pathogen_polymicrobial_synergy
  hypothesis_label: Keystone-Pathogen / Polymicrobial Synergy and Dysbiosis Model
  status: CANONICAL
  description: >
    The prevailing model: a low-abundance keystone organism (P. gingivalis) elevates the
    virulence of the whole subgingival community by subverting complement and innate
    immune surveillance, converting a commensal biofilm into a dysbiotic one that the
    host then over-responds to. Disease severity tracks the dysregulated host response
    rather than total bacterial load.
  evidence:
  - reference: PMID:22941505
    reference_title: "The keystone-pathogen hypothesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The keystone-pathogen hypothesis holds that certain low-abundance microbial pathogens can orchestrate inflammatory disease by remodelling a normally benign microbiota into a dysbiotic one."
    explanation: >
      States the hypothesis in its canonical form; periodontitis is its exemplar disease.
  - reference: PMID:25534621
    reference_title: "Periodontitis: from microbial immune subversion to systemic inflammation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Periodontitis is a dysbiotic inflammatory disease with an adverse impact on systemic health."
    explanation: >
      Review framing of periodontitis as dysbiotic-inflammatory rather than classically
      infectious.
- hypothesis_group_id: oral_gut_translocation_model
  hypothesis_label: Oral-to-Gut Pathobiont Translocation Model
  status: EMERGING
  description: >
    Periodontitis expands oral pathobionts (Klebsiella, Enterobacter) that are ingested
    and ectopically colonise the intestine, where they activate the inflammasome in
    colonic mononuclear phagocytes; in parallel, oral pathobiont-reactive Th17 cells
    generated in the mouth are imprinted with gut tropism and migrate to the intestine.
    This supplies an enteral, non-haematogenous route by which oral inflammation
    aggravates extra-oral disease. The causal chain is established in gnotobiotic and
    murine models; direct human causal verification is the open question (see the
    HUMAN_MODEL_MISMATCH discussion).
  evidence:
  - reference: PMID:32758418
    reference_title: "The Intermucosal Connection between the Mouth and Gut in Commensal Pathobiont-Driven Colitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, oral inflammation, such as periodontitis, exacerbates gut inflammation by supplying the gut with both colitogenic pathobionts and pathogenic T cells."
    explanation: >
      States the model's central claim as the study's own conclusion, in a murine
      periodontitis-colitis system.
  - reference: PMID:42396665
    reference_title: "Oral-gut axis in systemic disease: A barrier-metabolism-immunity three-dimensional regulatory model (Review)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "It sustains systemic homeostasis through bidirectional microbial translocation, metabolite signaling and immune crosstalk."
    explanation: >
      The review that motivated this curation frames the axis as bidirectional; this
      entry models only the oral-to-gut direction, for which experimental causal
      evidence exists.
- hypothesis_group_id: periodontal_citrullination_autoimmunity_model
  hypothesis_label: Periodontal Hypercitrullination Trigger of Autoimmunity
  status: EMERGING
  description: >
    A specific periodontal pathogen, Aggregatibacter actinomycetemcomitans, secretes the
    pore-forming leukotoxin A, which dysregulates neutrophil citrullinating enzymes and
    produces a citrullinome mirroring that of the rheumatoid joint — proposing the
    periodontium as a mucosal initiation site for anti-citrullinated protein autoimmunity.
    Candidate-trigger status, not established causation.
  evidence:
  - reference: PMID:27974664
    reference_title: "Aggregatibacter actinomycetemcomitans-induced hypercitrullination links periodontal infection to autoimmunity in rheumatoid arthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies identify the periodontal pathogen Aa as a candidate bacterial trigger of autoimmunity in RA."
    explanation: >
      The authors themselves stop at candidate trigger, which is the epistemic level
      recorded here.

pathophysiology:
- name: Dysbiotic Subgingival Biofilm Formation
  role: trigger
  biological_scale: TISSUE
  description: >
    Accumulation of supragingival and subgingival plaque, unchecked by oral hygiene,
    permits an ecological shift in the resident periodontal community away from
    health-associated taxa. Disease initiation and propagation follow from this dysbiosis
    interacting with host immune defences, rather than from acquisition of an exogenous
    pathogen.
  biological_processes:
  - preferred_term: subgingival plaque biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
    modifier: INCREASED
  locations:
  - preferred_term: gingiva
    term:
      id: UBERON:0001828
      label: gingiva
  downstream:
  - target: Keystone-Pathogen Remodelling and Complement Subversion
    causal_link_type: DIRECT
    hypothesis_groups:
    - keystone_pathogen_polymicrobial_synergy
    description: >
      The dysbiotic community is the substrate on which a keystone organism acts.
  - target: Neutrophil Hypercitrullination by Leukotoxin A
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - periodontal_citrullination_autoimmunity_model
    description: >
      Periodontal dysbiosis supplies the Aggregatibacter actinomycetemcomitans burden
      whose leukotoxin drives neutrophil hypercitrullination.
  evidence:
  - reference: PMID:28805207
    reference_title: "Periodontal diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periodontal disease initiation and propagation is through a dysbiosis of the commensal oral microbiota (dental plaque), which then interacts with the immune defences of the host, leading to inflammation and disease."
    explanation: >
      Disease-primer statement that dysbiosis of the commensal plaque community, not
      exogenous infection, initiates and propagates periodontal disease.

- name: Keystone-Pathogen Remodelling and Complement Subversion
  role: mechanism
  biological_scale: CELLULAR
  description: >
    Porphyromonas gingivalis, present at very low abundance, disproportionately raises the
    pathogenicity of the whole community by manipulating complement receptor signalling
    (C3a/C5a receptors) and innate immune surveillance. In experimental periodontitis both
    an intact commensal microbiota and an intact complement system are required for
    P. gingivalis to cause bone loss, establishing that the organism acts through the
    community and the host rather than by direct tissue damage.
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  downstream:
  - target: Th17 Expansion and Neutrophil-Rich Periodontal Inflammation
    causal_link_type: DIRECT
    hypothesis_groups:
    - keystone_pathogen_polymicrobial_synergy
  evidence:
  - reference: PMID:22036469
    reference_title: "Low-abundance biofilm species orchestrates inflammatory periodontal disease through the commensal microbiota and complement."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that P. gingivalis, at very low colonization levels, triggers changes to the amount and composition of the oral commensal microbiota leading to inflammatory periodontal bone loss."
    explanation: >
      Demonstrates the keystone effect in mice: a low-abundance species remodels the
      community and causes bone loss.
  - reference: PMID:22036469
    reference_title: "Low-abundance biofilm species orchestrates inflammatory periodontal disease through the commensal microbiota and complement."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The commensal microbiota and complement were both required for P. gingivalis-induced bone loss, as germ-free mice or conventionally raised C3a and C5a receptor-deficient mice did not develop bone loss after inoculation with P. gingivalis."
    explanation: >
      Genetic requirement for C3aR/C5aR establishes complement as an obligatory
      intermediate in the keystone mechanism.
  notes: >
    Both supporting experiments are murine; the complement requirement has not been
    demonstrated by genetic ablation in humans.

- name: Th17 Expansion and Neutrophil-Rich Periodontal Inflammation
  role: mechanism
  biological_scale: CELLULAR
  description: >
    The dysbiotic community drives local proliferation of resident memory Th17 cells in
    the gingiva in an IL-6- and IL-23-dependent manner, with accompanying neutrophil
    accumulation. This IL-17-polarised infiltrate — not bacterial burden per se — is the
    proximate effector of periodontal tissue destruction. Human genetic experiments of
    nature run in both directions: individuals with defective Th17 differentiation show
    diminished periodontal inflammation and bone loss, while individuals with defective
    neutrophil recruitment (leukocyte adhesion deficiency type I) show excessive local
    IL-17 and severe bone loss.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: gingival epithelial cell
    term:
      id: CL:0002621
      label: gingival epithelial cell
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: INCREASED
  - preferred_term: interleukin-17 production
    term:
      id: GO:0032620
      label: interleukin-17 production
    modifier: INCREASED
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Osteoclast-Mediated Alveolar Bone Resorption
    causal_link_type: DIRECT
    hypothesis_groups:
    - keystone_pathogen_polymicrobial_synergy
  - target: Connective Tissue Attachment Loss and Pocket Formation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30333238
    reference_title: "A dysbiotic microbiome triggers T(H)17 cells to mediate oral mucosal immunopathology in mice and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we demonstrate an expansion of resident memory T helper 17 (TH17) cells in human periodontitis."
    explanation: >
      Establishes the Th17 expansion in human, not just murine, periodontitis.
  - reference: PMID:30333238
    reference_title: "A dysbiotic microbiome triggers T(H)17 cells to mediate oral mucosal immunopathology in mice and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "periodontitis-associated expansion of TH17 cells was dependent on the local dysbiotic microbiome and required both IL-6 and IL-23"
    explanation: >
      Places the Th17 expansion causally downstream of dysbiosis and identifies the
      required cytokines.
  - reference: PMID:30333238
    reference_title: "A dysbiotic microbiome triggers T(H)17 cells to mediate oral mucosal immunopathology in mice and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the oral cavity, human TH17 cell defects were associated with diminished periodontal inflammation and bone loss, despite increased prevalence of recurrent oral fungal infections."
    explanation: >
      Loss-of-function human evidence that Th17 cells are required for periodontal
      immunopathology.
  - reference: PMID:24670684
    reference_title: "Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAD-I is invariably associated with severe periodontal bone loss, which historically has been attributed to the lack of neutrophil surveillance of the periodontal infection."
    explanation: >
      The LAD-I phenotype anchors the counterintuitive direction: impaired neutrophil
      recruitment, not neutrophil excess, produces severe bone loss.
  - reference: PMID:24670684
    reference_title: "Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Local treatment with antibodies to IL-17 or IL-23 in LFA-1-deficient mice not only blocked inflammatory periodontal bone loss but also caused a reduction in the total bacterial burden, suggesting that the IL-17-driven pathogenesis of LAD-I periodontitis leads to dysbiosis."
    explanation: >
      Interventional murine evidence that IL-17/IL-23 blockade is sufficient to block
      periodontal bone loss.

- name: Osteoclast-Mediated Alveolar Bone Resorption
  role: consequence
  biological_scale: CELLULAR
  conforms_to: "osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption"
  description: >
    Sustained IL-17-driven inflammation in the periodontium recruits and activates
    osteoclasts at the alveolar crest, tipping remodelling toward net resorption. Bone
    loss is the structural readout by which experimental periodontitis is quantified and
    the basis of radiographic staging in patients.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    term:
      id: GO:0030316
      label: osteoclast differentiation
    modifier: INCREASED
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  downstream:
  - target: Connective Tissue Attachment Loss and Pocket Formation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30333238
    reference_title: "A dysbiotic microbiome triggers T(H)17 cells to mediate oral mucosal immunopathology in mice and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TH17 cells and associated neutrophil accumulation were necessary for inflammatory tissue destruction in experimental periodontitis."
    explanation: >
      Establishes the immune infiltrate as necessary for the destructive phase that
      includes bone loss.
  notes: >
    Conforms to the shared osteoclastic-resorption node of
    `osteoporosis_bone_resorption`; the substituted context is the alveolar crest and an
    IL-17/dysbiosis-driven rather than oestrogen-withdrawal/ageing driver. No verified
    quotable RANKL/OPG-ratio snippet was available at curation time, so the specific
    RANKL mechanism is deliberately not asserted here.

- name: Connective Tissue Attachment Loss and Pocket Formation
  role: consequence
  biological_scale: TISSUE
  description: >
    Proteolytic degradation of the periodontal ligament and gingival connective tissue
    detaches the soft tissue from the root surface, converting the physiological gingival
    sulcus into a pathological periodontal pocket. Pocket depth and clinical attachment
    loss are the defining measurements of the disease and drive the 2017 staging system;
    the pocket itself is an anaerobic niche that further favours the dysbiotic community.
  locations:
  - preferred_term: periodontal ligament
    term:
      id: UBERON:0008266
      label: periodontal ligament
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  downstream:
  - target: Systemic Dissemination of Periodontal Pathogens and Inflammatory Mediators
    causal_link_type: DIRECT
  - target: Expansion and Ingestion of Oral Pathobionts
    causal_link_type: DIRECT
    hypothesis_groups:
    - oral_gut_translocation_model
  evidence:
  - reference: PMID:28805207
    reference_title: "Periodontal diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periodontal diseases comprise a wide range of inflammatory conditions that affect the supporting structures of the teeth (the gingiva, bone and periodontal ligament), which could lead to tooth loss and contribute to systemic inflammation."
    explanation: >
      Identifies the destroyed tissues and the two downstream consequences modelled
      here — tooth loss and systemic inflammation.
  - reference: PMID:29926952
    reference_title: "Staging and grading of periodontitis: Framework and proposal of a new classification and case definition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Stage I to IV of periodontitis is defined based on severity (primarily periodontal breakdown with reference to root length and periodontitis-associated tooth loss), complexity of management (pocket depth, infrabony defects, furcation involvement, tooth hypermobility, masticatory dysfunction) and additionally described as extent (localized or generalized)."
    explanation: >
      Confirms that periodontal breakdown, pocket depth and attachment/tooth loss are
      the operative clinical measurements of this node.

- name: Systemic Dissemination of Periodontal Pathogens and Inflammatory Mediators
  role: consequence
  biological_scale: ORGANISM
  description: >
    The ulcerated pocket epithelium is a large, chronically breached surface through which
    periodontal bacteria and locally generated inflammatory mediators enter the
    circulation. Disseminated pathogens and periodontitis-associated systemic inflammation
    — including adaptation of bone marrow haematopoietic progenitors — are the proposed
    mechanistic bridge to extra-oral comorbidity.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Chronic Systemic Inflammatory Burden and Comorbidity Risk
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33510490
    reference_title: "Local and systemic mechanisms linking periodontal disease and inflammatory comorbidities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Understanding how certain extra-oral pathologies are affected by disseminated periodontal pathogens and periodontitis-associated systemic inflammation, including adaptation of bone marrow haematopoietic progenitors, may provide new therapeutic options to reduce the risk of periodontitis-associated comorbidities."
    explanation: >
      Names the two dissemination channels — organisms and systemic inflammation —
      modelled by this node.
  - reference: PMID:30746447
    reference_title: "Porphyromonas gingivalis in Alzheimer's disease brains: Evidence for disease causation and treatment with small-molecule inhibitors."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Oral P. gingivalis infection in mice resulted in brain colonization"
    explanation: >
      Direct demonstration that an oral periodontal pathogen can reach an extra-oral
      organ after oral infection. Cited for the dissemination step only; this entry
      does not assert the paper's causal claim about Alzheimer disease.
  notes: >
    The P. gingivalis / Alzheimer citation is included as dissemination evidence only.
    Its disease-causation claim is contested; do not upgrade this to a causal assertion
    about neurodegeneration without new human evidence.

- name: Expansion and Ingestion of Oral Pathobionts
  role: mechanism
  biological_scale: ORGANISM
  description: >
    Periodontal inflammation expands specific oral pathobionts — notably Klebsiella and
    Enterobacter species — in the oral cavity. Because saliva is continuously swallowed,
    this amassed oral population is delivered enterally to the gut. This is the entry
    point of the oral-gut axis and is mechanistically distinct from the haematogenous
    dissemination node above.
  downstream:
  - target: Ectopic Intestinal Colonisation by Oral Pathobionts
    causal_link_type: DIRECT
    hypothesis_groups:
    - oral_gut_translocation_model
  - target: Gut-Homing Oral-Pathobiont-Reactive T Cell Induction
    causal_link_type: DIRECT
    hypothesis_groups:
    - oral_gut_translocation_model
  evidence:
  - reference: PMID:32758418
    reference_title: "The Intermucosal Connection between the Mouth and Gut in Commensal Pathobiont-Driven Colitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Periodontitis leads to expansion of oral pathobionts, including Klebsiella and Enterobacter species, in the oral cavity. Amassed oral pathobionts are ingested and translocate to the gut, where they activate the inflammasome in colonic mononuclear phagocytes, triggering inflammation."
    explanation: >
      States both halves of this node: periodontitis-driven oral expansion, and
      ingestion as the route to the gut.

- name: Ectopic Intestinal Colonisation by Oral Pathobionts
  role: consequence
  biological_scale: CELLULAR
  description: >
    Oral-derived strains that reach the intestine can colonise it ectopically when the
    resident gut community is already dysbiotic, activating the inflammasome in colonic
    mononuclear phagocytes and inducing intestinal T helper 1 responses. Salivary
    Klebsiella isolates are strong TH1 inducers in gnotobiotic colonisation, are
    multi-drug resistant, and elicit severe gut inflammation in a genetically susceptible
    host.
  cell_types:
  - preferred_term: colonic mononuclear phagocyte
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Chronic Systemic Inflammatory Burden and Comorbidity Risk
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - oral_gut_translocation_model
  evidence:
  - reference: PMID:29051379
    reference_title: "Ectopic colonization of oral bacteria in the intestine drives T(H)1 cell induction and inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that strains of Klebsiella spp. isolated from the salivary microbiota are strong inducers of T helper 1 (TH1) cells when they colonize in the gut"
    explanation: >
      Gnotobiotic evidence that salivary-origin organisms colonising the gut drive a
      distinct intestinal T cell response.
  - reference: PMID:29051379
    reference_title: "Ectopic colonization of oral bacteria in the intestine drives T(H)1 cell induction and inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings suggest that the oral cavity may serve as a reservoir for potential intestinal pathobionts that can exacerbate intestinal disease."
    explanation: >
      States the reservoir model that this node encodes.
  notes: >
    The `preferred_term` is the source study's own cell description; CL has no dedicated
    colonic mononuclear phagocyte class, so it is bound to the nearest suitable ancestor,
    CL:0000235 macrophage.

- name: Gut-Homing Oral-Pathobiont-Reactive T Cell Induction
  role: mechanism
  biological_scale: CELLULAR
  description: >
    In parallel with the microbial route, periodontitis generates oral pathobiont-reactive
    Th17 cells in the oral cavity that are imprinted with gut tropism and migrate to the
    inflamed intestine. Once there they are activated by the translocated oral
    pathobionts — but not by gut-resident microbes — so the cellular and the microbial
    arms are jointly required.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: INCREASED
  downstream:
  - target: Chronic Systemic Inflammatory Burden and Comorbidity Risk
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - oral_gut_translocation_model
  evidence:
  - reference: PMID:32758418
    reference_title: "The Intermucosal Connection between the Mouth and Gut in Commensal Pathobiont-Driven Colitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In parallel, periodontitis results in generation of oral pathobiont-reactive Th17 cells in the oral cavity. Oral pathobiont-reactive Th17 cells are imprinted with gut tropism and migrate to the inflamed gut."
    explanation: >
      Establishes the T cell arm and its gut-homing imprint.

- name: Neutrophil Hypercitrullination by Leukotoxin A
  role: mechanism
  biological_scale: MOLECULAR
  description: >
    Aggregatibacter actinomycetemcomitans secretes the pore-forming toxin leukotoxin A,
    which permeabilises neutrophils and dysregulates their citrullinating enzymes. The
    resulting periodontal citrullinome mirrors the hypercitrullination pattern of the
    rheumatoid joint, and neutrophil morphological changes resembling extracellular trap
    formation release the hypercitrullinated cargo into the periodontal tissue.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Chronic Systemic Inflammatory Burden and Comorbidity Risk
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - periodontal_citrullination_autoimmunity_model
    description: >
      Proposed route from a periodontal mucosal trigger to systemic anti-citrullinated
      protein autoimmunity; the intervening steps in humans are not established.
  evidence:
  - reference: PMID:27974664
    reference_title: "Aggregatibacter actinomycetemcomitans-induced hypercitrullination links periodontal infection to autoimmunity in rheumatoid arthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Periodontitis was characterized by the presence of citrullinated autoantigens that are primary immune targets in RA."
    explanation: >
      Human gingival crevicular fluid proteomics showing the periodontal citrullinome.
  - reference: PMID:27974664
    reference_title: "Aggregatibacter actinomycetemcomitans-induced hypercitrullination links periodontal infection to autoimmunity in rheumatoid arthritis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified the pore-forming toxin leukotoxin A (LtxA) as the molecular mechanism by which Aa triggers dysregulated activation of citrullinating enzymes in neutrophils, mimicking membranolytic pathways that sustain autoantigen citrullination in the RA joint."
    explanation: >
      Identifies the molecular effector modelled by this node.

- name: Chronic Systemic Inflammatory Burden and Comorbidity Risk
  role: outcome
  biological_scale: ORGANISM
  description: >
    The convergent endpoint of the haematogenous, enteral and autoimmune arms:
    a sustained systemic inflammatory state epidemiologically associated with
    cardio-metabolic, neurodegenerative and autoimmune disease and with cancer. The
    relationship with diabetes is explicitly bidirectional — diabetes roughly triples
    periodontitis susceptibility, and periodontal inflammation worsens glycaemic control.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:33510490
    reference_title: "Local and systemic mechanisms linking periodontal disease and inflammatory comorbidities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Periodontitis, a major inflammatory disease of the oral mucosa, is epidemiologically associated with other chronic inflammation-driven disorders, including cardio-metabolic, neurodegenerative and autoimmune diseases and cancer."
    explanation: >
      Scope statement for the comorbidity set represented by this node.
  - reference: PMID:22057194
    reference_title: "Periodontitis and diabetes: a two-way relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is emerging evidence to support the existence of a two-way relationship between diabetes and periodontitis, with diabetes increasing the risk for periodontitis, and periodontal inflammation negatively affecting glycaemic control."
    explanation: >
      Supports the bidirectional framing rather than a one-way periodontitis-to-diabetes
      claim.
  - reference: PMID:32011025
    reference_title: "Periodontitis and cardiovascular diseases: Consensus report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There is now a significant body of evidence to support independent associations between severe periodontitis and several NCDs, in particular CVD."
    explanation: >
      Consensus statement of association; deliberately recorded as PARTIAL because
      association is not causation and the workshop stops short of the latter.

phenotypes:
- category: Oral
  name: Periodontitis

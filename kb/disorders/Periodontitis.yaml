genetic:
- name: ITGB2
  gene_term:
    preferred_term: ITGB2
    term:
      id: hgnc:6155
      label: ITGB2
  relationship_type: CAUSATIVE
  notes: >
    Biallelic ITGB2 (CD18) loss of function causes leukocyte adhesion deficiency type I,
    in which severe periodontal bone loss is an invariable feature. This is a syndromic,
    monogenic route to the periodontitis phenotype rather than a susceptibility locus for
    common periodontitis; it is curated here because the mechanism it exposes —
    IL-17-driven bone loss secondary to failed neutrophil recruitment — constrains the
    model of the common disease.
  evidence:
  - reference: PMID:24670684
    reference_title: "Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAD-I is invariably associated with severe periodontal bone loss, which historically has been attributed to the lack of neutrophil surveillance of the periodontal infection."
    explanation: >
      Establishes the invariable periodontal phenotype of the ITGB2/CD18 deficiency
      syndrome.


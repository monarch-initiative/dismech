name: Neutrophil Immunodeficiency Syndrome
creation_date: "2026-08-23T17:00:00Z"
category: Mendelian
synonyms:
- Immunodeficiency 73A with defective neutrophil chemotaxis and leukocytosis
- IMD73A
- RAC2 dominant-negative neutrophil immunodeficiency
- Human neutrophil immunodeficiency syndrome
description: >-
  Neutrophil immunodeficiency syndrome (IMD73A) is caused by the
  dominant-negative RAC2 p.Asp57Asn allele and presents in early infancy with
  severe bacterial soft-tissue infection, poor wound healing, and a
  characteristic absence of pus at infected sites despite peripheral
  neutrophilia. RAC2 is a haematopoietic-restricted Rho-family GTPase that
  constitutes over 96% of the Rac in neutrophils, and it sits at a single branch
  point controlling two separate effector arms: assembly and activation of the
  NOX2 NADPH oxidase, and chemoattractant-driven actin polymerization with
  directed migration. One allele therefore disables both killing and getting
  there. Asp57 is invariant across GTP-binding proteins; the mutant binds GDP
  but not GTP and acts dominant-negatively by sequestering exchange factors and
  effectors, so a single mutant allele poisons the wild-type product.

  The resulting picture is a leukocyte-adhesion-deficiency mimic rather than a
  chronic granulomatous disease mimic, even though the oxidase is also broken -
  neutrophils are produced and released but cannot reach tissue or kill once
  there. CD11b expression is normal, which is what excludes LAD-I.

  SCOPE: this entry covers the DOMINANT-NEGATIVE arm only. RAC2 disease is a
  four-way allele-class spectrum in which constitutively active RAS-like alleles
  cause neonatal SCID and dominant-activating alleles cause a later-onset
  combined immunodeficiency; those are different diseases with different graphs
  and are not curated here.
disease_term:
  preferred_term: Neutrophil Immunodeficiency Syndrome
  term:
    id: MONDO:0011988
    label: neutrophil immunodeficiency syndrome
parents:
- Inborn Error of Immunity
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous RAC2 p.Asp57Asn allele is sufficient, because the
    mutant protein acts dominant-negatively on the wild-type product rather than
    simply failing. The index patient carried the point mutation in one allele.
  evidence:
  - reference: PMID:10758162
    reference_title: >-
      Human neutrophil immunodeficiency syndrome is associated with an
      inhibitory Rac2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis identified a point mutation in one allele of the Rac2
      gene resulting in the substitution of Asp57 by an Asn (Rac2(D57N)).
    explanation: >-
      Establishes heterozygosity for the causal allele, consistent with a
      dominant mechanism.
genetic:
- name: RAC2
  gene_term:
    preferred_term: RAC2
    term:
      id: hgnc:9802
      label: RAC2
  association: >-
    The dominant-negative p.Asp57Asn allele, arising from a G to A change at
    nucleotide 169 of the coding sequence. Asp57 is invariant in all defined
    GTP-binding proteins and is directly involved in nucleotide binding.
  evidence:
  - reference: PMID:10961859
    reference_title: >-
      Dominant negative mutation of the hematopoietic-specific Rho GTPase, Rac2,
      is associated with a human phagocyte immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular methods were used to clone the expressed Rac2 cDNA from this
      patient, and a single base pair change (G-->A at nucleotide 169) in the
      coding sequence was identified. This results in an asparagine for aspartic
      acid mutation at amino acid 57 (D57N), a residue that is involved in
      nucleotide binding and is conserved in all mammalian Rho GTPases.
    explanation: >-
      Gives the nucleotide-level change and the conservation of the affected
      residue, quoted verbatim because secondary summaries of this variant's
      cDNA nomenclature disagree with the source.
  notes: >-
    Quote the nucleotide change from the primary source. Secondary summaries
    render this variant inconsistently, and at least one renders it as a C to A
    change, which contradicts the source's own "G to A at nucleotide 169".
pathophysiology:
- name: RAC2 p.Asp57Asn Dominant-Negative Allele
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Asp57 is invariant across GTP-binding proteins and
    participates directly in nucleotide binding. The mutant protein binds GDP
    but not GTP, so it is locked in the inactive conformation, and it acts
    dominant-negatively rather than as a simple null: it sequesters guanine
    nucleotide exchange factors and effectors away from the wild-type protein.
    That is why one allele is enough.
  genes:
  - preferred_term: RAC2
    term:
      id: hgnc:9802
      label: RAC2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline p.Asp57Asn. The functional impact is recorded as
      DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION because the mutant actively
      inhibits the wild-type allele's product; a heterozygous null at this locus
      does not produce the disease.
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:10758162
    reference_title: >-
      Human neutrophil immunodeficiency syndrome is associated with an
      inhibitory Rac2 mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Asp57 is invariant in all defined GTP-binding proteins. Rac2(D57N) binds
      GDP but not GTP and inhibits oxidase activation and O(2)(-) production in
      vitro.
    explanation: >-
      Establishes the nucleotide-binding defect and its inhibitory - not merely
      absent - effect on oxidase activation.
  - reference: PMID:10961859
    reference_title: >-
      Dominant negative mutation of the hematopoietic-specific Rho GTPase, Rac2,
      is associated with a human phagocyte immunodeficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies demonstrated that the D57N mutant behaves in a
      dominant-negative fashion at the cellular level.
    explanation: >-
      Direct support for the DOMINANT_NEGATIVE functional impact category rather
      than a loss-of-function assignment.
  downstream:
  - target: Failed NOX2 Oxidase Activation and Superoxide Production
    causal_link_type: DIRECT
    description: >-
      RAC2 is the GTPase component required to activate the NADPH oxidase; the
      GDP-locked mutant cannot deliver that activation and actively inhibits it.
  - target: Failed Chemoattractant-Driven Actin Assembly and Directed Migration
    causal_link_type: DIRECT
    description: >-
      The same GTPase drives chemoattractant-induced actin polymerization and
      polarization, so one allele disables a second, independent effector arm.
- name: Failed NOX2 Oxidase Activation and Superoxide Production
  biological_scale: CELLULAR
  description: >-
    The first of the two effector arms. RAC2 is required for activation of the
    NOX2 NADPH oxidase, and the D57N protein inhibits oxidase activation in
    vitro. The defect is at the level of the ACTIVATOR, not the catalytic
    complex, which is what distinguishes this from chronic granulomatous
    disease even though the downstream consequence - failed respiratory burst -
    is shared. The decisive reconstitution experiment is that adding recombinant
    Rac to patient neutrophil extracts restores superoxide production.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: superoxide anion generation
    term:
      id: GO:0042554
      label: superoxide anion generation
    modifier: DECREASED
  evidence:
  - reference: PMID:10758162
    reference_title: >-
      Human neutrophil immunodeficiency syndrome is associated with an
      inhibitory Rac2 mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Addition of recombinant Rac to extracts of the patient neutrophils
      reconstituted O(2)(-) production in an in vitro assay system.
    explanation: >-
      A reconstitution result: the oxidase machinery itself is intact and only
      its RAC2 activator is missing, which is the mechanistic distinction from
      chronic granulomatous disease.
  downstream:
  - target: Neutrophils Released but Unable to Reach or Kill in Tissue
    causal_link_type: DIRECT
    description: >-
      Loss of the respiratory burst removes oxidative microbial killing.
- name: Failed Chemoattractant-Driven Actin Assembly and Directed Migration
  biological_scale: CELLULAR
  description: >-
    The second effector arm, and the one chronic granulomatous disease does not
    have. Patient neutrophils show decreased chemotaxis, polarization and
    azurophilic granule secretion. In the Rac2-null mouse the same arm fails
    through defective F-actin generation, impaired p38 and p42/p44 MAP kinase
    activation, and loss of shear-dependent L-selectin-mediated capture, so the
    defect spans capture, polarization and migration rather than any single
    step. This is curated as a separate node from the oxidase arm rather than
    bundled into one "neutrophil dysfunction" node, because the two are
    independent effector routes from the same GTPase.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: DECREASED
  - preferred_term: actin filament polymerization
    term:
      id: GO:0030041
      label: actin filament polymerization
    modifier: DECREASED
  evidence:
  - reference: PMID:10758162
    reference_title: >-
      Human neutrophil immunodeficiency syndrome is associated with an
      inhibitory Rac2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neutrophils from this patient exhibited decreased chemotaxis,
      polarization, azurophilic granule secretion, and superoxide anion
      (O(2)(-)) production but had normal expression and up-regulation of CD11b.
    explanation: >-
      Documents both effector arms failing in the same patient, and the normal
      CD11b that excludes leukocyte adhesion deficiency type I.
  - reference: PMID:10072071
    reference_title: >-
      Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is
      characterized by abnormalities in neutrophil function and host defense.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      rac2-/- neutrophils displayed significant defects in chemotaxis, in
      shear-dependent L-selectin-mediated capture on the endothelial substrate
      Glycam-1, and in both F-actin generation and p38 and, unexpectedly,
      p42/p44 MAP kinase activation induced by chemoattractants.
    explanation: >-
      Resolves the migration arm into its component steps - capture, actin
      assembly and MAP kinase signalling - in the knockout mouse.
  downstream:
  - target: Neutrophils Released but Unable to Reach or Kill in Tissue
    causal_link_type: DIRECT
    description: >-
      Loss of directed migration prevents neutrophils reaching the site of
      infection.
- name: Neutrophils Released but Unable to Reach or Kill in Tissue
  biological_scale: TISSUE
  description: >-
    The two arms converge here, and the convergence explains the syndrome's most
    distinctive feature: peripheral neutrophilia coexisting with an absence of
    neutrophils where they are needed. Neutrophils are produced and released
    normally but do not accumulate at infected sites, so infections proceed
    without pus formation and wounds heal poorly. The Rac2-null mouse reproduces
    exactly this pairing - baseline neutrophilia in the blood alongside reduced
    inflammatory peritoneal exudate.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:
  - reference: PMID:10072071
    reference_title: >-
      Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is
      characterized by abnormalities in neutrophil function and host defense.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These defects were reflected in vivo by baseline neutrophilia, reduced
      inflammatory peritoneal exudate formation, and increased mortality when
      challenged with Aspergillus fumigatus.
    explanation: >-
      The mouse correlate of "leukocytosis without pus": neutrophilia in blood
      with failure to form a tissue exudate, plus a host-defence consequence.
  downstream:
  - target: Severe Early-Onset Bacterial Infection and Poor Wound Healing
    causal_link_type: DIRECT
    description: >-
      Failure of tissue neutrophil function permits uncontrolled bacterial
      infection.
- name: Severe Early-Onset Bacterial Infection and Poor Wound Healing
  biological_scale: ORGANISM
  description: >-
    The clinical presentation, in the index case at five weeks of age. Routine
    screening tests are normal, so the diagnosis is easily missed: the
    neutrophil count is high rather than low, CD11b is normal, and the defect is
    functional rather than numerical.
  evidence:
  - reference: PMID:10758162
    reference_title: >-
      Human neutrophil immunodeficiency syndrome is associated with an
      inhibitory Rac2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 5-week-old male infant presented with severe bacterial infections and
      poor wound healing, suggesting a neutrophil defect.
    explanation: Establishes the age and mode of presentation.
  - reference: PMID:11445809
    reference_title: >-
      Clinical features of a human Rac2 mutation: a complex neutrophil
      dysfunction disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite features suggesting a neutrophil disorder, results of screening
      tests of phagocyte function were normal.
    explanation: >-
      The diagnostic trap: routine phagocyte screening does not detect this
      disease, which is why it is missed despite a suggestive clinical picture.

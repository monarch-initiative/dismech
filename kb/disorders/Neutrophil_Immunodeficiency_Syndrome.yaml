    explanation: Documents the oxidative burst defect and its molecular cause.
prevalence:
- population: Reported RAC2 dominant-negative (D57N) patients in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five patients in the largest assembled cohort, which collected 54 RAC2
    patients from 37 families across the whole allele spectrum. This is a count
    of ascertained cases, not a population rate, and the dominant-negative arm
    is the smallest of the three presentations.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were grouped by presentation: neonatal SCID (n = 5), infantile
      LAD-like disease (n = 5), or CID (n = 44).
    explanation: >-
      Gives the size of the dominant-negative LAD-like group within the cohort.
animal_models:
- name: Rac2-null mouse
  species: Mouse
  genotype: Rac2 knockout, homozygous (rac2-/-)
  publication: PMID:10072071
  description: >-
    Reproduces the defining paradox of the human disease - neutrophilia in blood
    with failure to form a tissue exudate - and resolves the migration arm into
    capture, actin assembly and MAP kinase components.
  modeled_mechanisms:
  - target: Failed Chemoattractant-Driven Actin Assembly and Directed Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Defective chemotaxis, shear-dependent L-selectin capture, F-actin
      generation, and p38 and p42/p44 MAP kinase activation.
    limitations: >-
      A complete null, whereas the human disease is caused by a heterozygous
      dominant-negative allele that poisons the wild-type product. The endpoints
      converge but the genetic mechanisms differ, so the model cannot speak to
      dominant-negative sequestration itself. Superoxide production was reduced
      in bone marrow neutrophils but NORMAL in activated peritoneal exudate
      neutrophils, so the oxidase arm is only partially reproduced and that node
      is deliberately not claimed.
    readouts:
    - name: Neutrophil chemotaxis
      target: Failed Chemoattractant-Driven Actin Assembly and Directed Migration
      direction: DECREASED
      interpretation: Direct measure of the migration arm.
      evidence:
      - reference: PMID:10072071
        reference_title: >-
          Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2
          is characterized by abnormalities in neutrophil function and host
          defense.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          rac2-/- neutrophils displayed significant defects in chemotaxis, in
          shear-dependent L-selectin-mediated capture on the endothelial
          substrate Glycam-1, and in both F-actin generation and p38 and,
          unexpectedly, p42/p44 MAP kinase activation induced by
          chemoattractants.
        explanation: Reports the chemotaxis and actin-assembly defects.
    evidence:
    - reference: PMID:10072071
      reference_title: >-
        Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is
        characterized by abnormalities in neutrophil function and host defense.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Rac2 is an essential regulator of multiple specialized neutrophil
        functions.
      explanation: >-
        The authors' summary supporting the model as informative for
        RAC2-dependent neutrophil function.
  - target: Neutrophils Released but Unable to Reach or Kill in Tissue
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Baseline neutrophilia with reduced inflammatory peritoneal exudate
      formation, the murine correlate of leukocytosis without pus, together with
      increased mortality on Aspergillus challenge.
    limitations: >-
      Complete null rather than dominant-negative heterozygote, and the exudate
      readout is a peritonitis model rather than the soft-tissue abscess setting
      in which the human phenotype is recognised.
    readouts:
    - name: Inflammatory peritoneal exudate formation
      target: Neutrophils Released but Unable to Reach or Kill in Tissue
      direction: DECREASED
      interpretation: >-
        Failure of tissue neutrophil accumulation despite blood neutrophilia -
        the model's expression of the absent-pus phenotype.
      evidence:
      - reference: PMID:10072071
        reference_title: >-
          Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2
          is characterized by abnormalities in neutrophil function and host
          defense.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These defects were reflected in vivo by baseline neutrophilia, reduced
          inflammatory peritoneal exudate formation, and increased mortality
          when challenged with Aspergillus fumigatus.
        explanation: Reports the neutrophilia and reduced exudate together.
    evidence:
    - reference: PMID:10072071
      reference_title: >-
        Deficiency of the hematopoietic cell-specific Rho family GTPase Rac2 is
        characterized by abnormalities in neutrophil function and host defense.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These defects were reflected in vivo by baseline neutrophilia, reduced
        inflammatory peritoneal exudate formation, and increased mortality when
        challenged with Aspergillus fumigatus.
      explanation: >-
        Supports the model as informative for the tissue-recruitment failure
        node.
- name: Rac2D57N transgenic zebrafish
  species: Zebrafish
  genotype: Neutrophil-restricted expression of the human inhibitory Rac2 D57N allele
  publication: PMID:22014524
  description: >-
    The only available model carrying the actual human allele this entry is
    scoped to, rather than a null. That distinction matters: the mouse knockout
    models absence of the protein, while this model expresses the same
    dominant-negative protein patients carry, and so speaks to the sequestration
    mechanism the null cannot address. Expressing D57N in neutrophils alone is
    sufficient to produce the immunodeficiency phenotype, which localises the
    disease to the neutrophil rather than to some broader haematopoietic effect.
  modeled_mechanisms:
  - target: Failed Chemoattractant-Driven Actin Assembly and Directed Migration
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Live imaging shows loss of three-dimensional motility and of the
      polarization of F-actin dynamics and PI3K signalling in vivo, in
      neutrophils expressing the human D57N allele.
    limitations: >-
      Zebrafish neutrophils differ from human in tissue context and the model is
      transgenic overexpression in a wild-type rac2 background, so it reports
      the dominant-negative effect rather than the human heterozygous dosage
      exactly. It also does not address the oxidase arm.
    readouts:
    - name: Neutrophil 3D motility and F-actin polarization
      target: Failed Chemoattractant-Driven Actin Assembly and Directed Migration
      direction: DECREASED
      interpretation: >-
        In-vivo confirmation that the human allele itself, not merely loss of
        the protein, disables directed migration.
      evidence:
      - reference: PMID:22014524
        reference_title: >-
          Dual roles for Rac2 in neutrophil motility and active retention in
          zebrafish hematopoietic tissue.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Noninvasive live imaging of Rac2 morphants or Rac2D57N zebrafish
          larvae demonstrates an essential role for Rac2 in regulating 3D
          motility and the polarization of F-actin dynamics and PI(3)K signaling
          in vivo.
        explanation: Direct in-vivo measurement of the migration arm.
    evidence:
    - reference: PMID:22014524
      reference_title: >-
        Dual roles for Rac2 in neutrophil motility and active retention in
        zebrafish hematopoietic tissue.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we identify dual roles for Rac2 during neutrophil homeostasis using
        a zebrafish model of primary immune deficiency induced by the human
        inhibitory Rac2D57N mutation in neutrophils.
      explanation: >-
        Establishes the model as carrying the human disease allele, which is
        what makes it informative in a way the mouse null is not.
  - target: Neutrophils Released but Unable to Reach or Kill in Tissue
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies a mechanism for the peripheral neutrophilia that the entry
      otherwise curates only as an observation: RAC2 is required for
      CXCR4-mediated RETENTION of neutrophils in haematopoietic tissue, so
      losing it increases mobilization into the circulation. Neutrophilia is
      therefore not merely a failure to consume neutrophils at tissue sites - it
      is partly an active over-release.
    limitations: >-
      The retention finding is established in zebrafish haematopoietic tissue,
      which is not anatomically equivalent to human bone marrow, and the rescue
      experiment that demonstrates it uses a CXCR4 gain-of-function background
      from a different disease.
    readouts:
    - name: Neutrophil mobilization from haematopoietic tissue
      target: Neutrophils Released but Unable to Reach or Kill in Tissue
      direction: INCREASED
      interpretation: >-
        Active over-mobilization, distinct from and additive to failed tissue
        recruitment.
      evidence:
      - reference: PMID:22014524
        reference_title: >-
          Dual roles for Rac2 in neutrophil motility and active retention in
          zebrafish hematopoietic tissue.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Tracking of photolabeled Rac2-deficient neutrophils from hematopoietic
          tissue also shows increased mobilization into the circulation,
          indicating that neutrophil mobilization does not require traditionally
          defined cell motility.
        explanation: >-
          Measures increased mobilization and dissociates it from motility,
          which is why neutrophilia and failed migration can coexist.
    evidence:
    - reference: PMID:22014524
      reference_title: >-
        Dual roles for Rac2 in neutrophil motility and active retention in
        zebrafish hematopoietic tissue.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings reveal that Rac2 signaling is necessary for both
        neutrophil 3D motility and CXCR4-mediated neutrophil retention in
        hematopoietic tissue, thereby limiting neutrophil mobilization, a
        critical first step in the innate immune response.
      explanation: >-
        The dual-role conclusion, which supplies the retention mechanism behind
        the peripheral neutrophilia.
diagnosis:
- name: Normal CD11b flow cytometry excluding leukocyte adhesion deficiency type I
  presence: Normal
  description: >-
    The single most useful discriminating test, and a negative one. The clinical
    picture is a LAD mimic, so LAD-I is the first differential; normal CD11b
    expression and upregulation excludes it and redirects toward a signalling
    rather than an adhesion-molecule defect.
  evidence:
  - reference: PMID:10758162
    reference_title: >-
      Human neutrophil immunodeficiency syndrome is associated with an
      inhibitory Rac2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neutrophils from this patient exhibited decreased chemotaxis,
      polarization, azurophilic granule secretion, and superoxide anion
      (O(2)(-)) production but had normal expression and up-regulation of CD11b.
    explanation: >-
      Documents normal CD11b alongside the functional defects, which is what
      separates this from LAD-I.
- name: Functional neutrophil assays
  description: >-
    Because the defect is functional rather than numerical, diagnosis requires
    assays of what neutrophils DO - chemotaxis, oxidative burst, degranulation,
    bactericidal activity - not a count. Six such functions are documented to
    fail. The trap is that routine screening tests of phagocyte function come
    back normal.
  evidence:
  - reference: PMID:11445809
    reference_title: >-
      Clinical features of a human Rac2 mutation: a complex neutrophil
      dysfunction disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel, multifaceted leukocyte disorder-distinguished by defects in shape
      change, chemotaxis, ingestion, degranulation, superoxide anion production,
      and bactericidal activity-was established secondary to a defect in Rac2.
    explanation: Enumerates the six functional assays that are abnormal.
  - reference: PMID:11445809
    reference_title: >-
      Clinical features of a human Rac2 mutation: a complex neutrophil
      dysfunction disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite features suggesting a neutrophil disorder, results of screening
      tests of phagocyte function were normal.
    explanation: >-
      The reason functional testing must be specific: routine phagocyte
      screening does not detect this disease.
- name: RAC2 sequencing with functional characterisation of the variant
  presence: Positive
  description: >-
    Molecular testing identifies the variant, but for RAC2 it does not by itself
    give the diagnosis, because the disease depends on the allele CLASS rather
    than merely on the gene. A variant must be characterised functionally to
    know whether it is dominant-negative, constitutively active or
    dominant-activating - which determines whether the patient has this disease,
    neonatal SCID, or a combined immunodeficiency. The cohort that established
    that mapping found no single assay sufficient.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All tested RAC2 mutant proteins exhibited aberrant function; no single
      assay was sufficient to determine functional consequence.
    explanation: >-
      Establishes that a panel of functional assays, not one test, is needed to
      assign a RAC2 variant to its allele class - and therefore to its disease.
treatments:
- name: Haematopoietic stem cell transplantation
  description: >-
    The definitive therapy. RAC2 is expressed only in haematopoietic cells, so
    replacing the haematopoietic compartment replaces the entire diseased tissue
    - there is no other organ carrying the lesion. In the RAC2 cohort most
    patients with dominant-negative disease were transplanted within the first
    year of life.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: RAC2 p.Asp57Asn Dominant-Negative Allele
    treatment_effect: INHIBITS
    description: >-
      Acts at the initiating node by replacing the cells that express the mutant
      allele, rather than on any downstream effector arm. This is why it is
      curative where symptomatic measures are not.
    evidence:
    - reference: PMID:10758162
      reference_title: >-
        Human neutrophil immunodeficiency syndrome is associated with an
        inhibitory Rac2 mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rac2, which constitutes >96% of the Rac in neutrophils, is a member of
        the Rho family of GTPases that regulates the actin cytoskeleton and
        O(2)(-) production.
      explanation: >-
        RAC2 carries essentially all Rac function in the neutrophil, so
        replacing the haematopoietic compartment replaces the whole diseased
        tissue rather than correcting part of it.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with constitutively active and DN disease underwent
      hematopoietic stem cell transplantation (HSCT) within the first months
      (constitutively active) to first year (DN D57N) of life
    explanation: >-
      Documents HSCT as the standard course for dominant-negative disease and
      the age at which it is undertaken.
- name: Antimicrobial therapy and prophylaxis
  description: >-
    Supportive rather than corrective. Because the neutrophils cannot reach or
    kill, bacterial infection is aggressive and rapidly progressive, so
    antimicrobial management is the mainstay until transplantation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:11445809
    reference_title: >-
      Clinical features of a human Rac2 mutation: a complex neutrophil
      dysfunction disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The case of an infant with multiple, rapidly progressive, soft-tissue
      infections is presented.
    explanation: >-
      Establishes the infection burden that antimicrobial management addresses.
discussions:
- discussion_id: scope_rac2_allele_class_spectrum
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#RAC2 p.Asp57Asn Dominant-Negative Allele
  prompt: >-
    RAC2 disease is an allele-class spectrum. Should the other classes be
    curated as separate Disease entries, as subtypes, or under a shared parent?
  rationale: >-
    This entry deliberately covers only the dominant-negative arm. The
    definitive cohort separates the spectrum by RAC2 activity: constitutively
    active RAS-like alleles cause neonatal SCID, dominant-negative alleles cause
    the LAD-like disease curated here, and dominant-activating alleles cause a
    later-onset combined immunodeficiency, which accounted for 44 of 54
    patients. Those are different graphs and should not be blended into this
    one. MONDO already gives IMD73B and IMD73C separate terms under a shared
    RAC2 combined-immunodeficiency parent, so the natural shape is one further
    Disease entry for the CID entity with 73B and 73C as subtypes; the
    constitutively active neonatal SCID arm appears to have no distinct MONDO
    term. Curating those is out of scope here and is left explicit rather than
    implied by omission.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease correlated to RAC2 activity: constitutively active RAS-like
      mutations caused neonatal SCID, dominant-negative mutations caused
      LAD-like disease, whereas dominant-activating mutations caused CID.
    explanation: >-
      The genotype-to-phenotype mapping that defines the scope boundary of this
      entry, from a 54-patient cohort in which every variant was functionally
      assayed.
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were grouped by presentation: neonatal SCID (n = 5), infantile
      LAD-like disease (n = 5), or CID (n = 44).
    explanation: >-
      Gives the relative sizes of the three arms, showing the dominant-negative
      LAD-like arm curated here is the smallest.
- discussion_id: gap_rac2_mondo_scid_parent
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Severe Early-Onset Bacterial Infection and Poor Wound Healing
  prompt: >-
    Is MONDO:0017855 (T-B- severe combined immunodeficiency) a correct parent
    for MONDO:0011988?
  rationale: >-
    MONDO gives this term two parents: functional neutrophil defect, which fits,
    and T-B- severe combined immunodeficiency, which does not obviously fit the
    dominant-negative arm. The cohort data place the dominant-negative alleles
    in the phagocyte/LAD-like group with normal-to-elevated neutrophil counts,
    while the T-B- SCID picture belongs to the constitutively active alleles at
    the same gene. This looks like gene-level classification applied to an
    allele-level term. Recorded here rather than acted on, because it is an
    upstream ontology question; the whole IMD73 series shares that parent, so it
    is likely one fix rather than three.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease correlated to RAC2 activity: constitutively active RAS-like
      mutations caused neonatal SCID, dominant-negative mutations caused
      LAD-like disease, whereas dominant-activating mutations caused CID.
    explanation: >-
      Assigns the SCID presentation to a different allele class from the one
      this MONDO term denotes, which is the basis for questioning the parent.
notes: >-
  Relationship to chronic granulomatous disease: both diseases end in a failed
  respiratory burst, but the lesion differs in kind. In CGD the catalytic NOX2
  complex itself is broken; here the complex is intact and only its RAC2
  activator is missing, which is why adding recombinant Rac to patient extracts
  restores superoxide production. RAC2 disease also has a second, independent
  arm - failed chemotaxis and actin assembly - that CGD does not, and it is that
  arm which makes the clinical picture a leukocyte adhesion deficiency mimic
  rather than a CGD mimic. A phagocyte_oxidative_burst_failure module factoring
  out the shared NOX2 chain would have CGD and this entry as its first two
  conformers; that is noted as a follow-up rather than created here.

  On the absent references: block. That block is GeneReviews-specific by schema
  - its tags slot permits exactly one value - and there is no GeneReviews
  chapter for RAC2 deficiency: a PubMed search of the GeneReviews book index for
  RAC2 returns no results. The absence is therefore correct rather than an
  omission, and is recorded here so it does not have to be rechecked.

  The diagnostic content that previously sat in this notes block as free text -
  normal CD11b as the LAD-I discriminator, the functional rather than numerical
  nature of the defect, and the normal routine screening - is now curated as a
  diagnosis: section with its own evidence, and is not duplicated here.

  Curation provenance: a Perplexity deep-research report was generated
  (research/Neutrophil_Immunodeficiency_Syndrome-deep-research-perplexity.md)
  and passed the NEC preflight against MONDO:0011988, with RAC2 mentioned 210
  times. The gene-level preflight is weak evidence here, because every RAC2
  allele class would pass it - the real risk was a report nominally about RAC2
  immunodeficiency but substantively about the dominant-activating CID cohort,
  which accounts for 44 of the 54 patients in the flagship series. That was
  checked separately at the allele level: the report mentions D57N 58 times and
  the activating alleles E62K, G12R and Q61 not at all, so it is squarely about
  the arm curated here. Recording the check because the preflight tool cannot
  perform it - NEC risk in a gene with an allele-class spectrum lives in the
  variant, not the gene symbol.

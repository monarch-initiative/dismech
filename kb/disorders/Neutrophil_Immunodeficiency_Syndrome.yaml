discussions:
- discussion_id: scope_rac2_allele_class_spectrum
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#RAC2 p.Asp57Asn Dominant-Negative Allele
  prompt: >-
    RAC2 disease is an allele-class spectrum. Should the other classes be
    curated as separate Disease entries, as subtypes, or under a shared parent?
  rationale: >-
    This entry deliberately covers only the dominant-negative arm. The
    definitive cohort separates the spectrum by RAC2 activity: constitutively
    active RAS-like alleles cause neonatal SCID, dominant-negative alleles cause
    the LAD-like disease curated here, and dominant-activating alleles cause a
    later-onset combined immunodeficiency, which accounted for 44 of 54
    patients. Those are different graphs and should not be blended into this
    one. MONDO already gives IMD73B and IMD73C separate terms under a shared
    RAC2 combined-immunodeficiency parent, so the natural shape is one further
    Disease entry for the CID entity with 73B and 73C as subtypes; the
    constitutively active neonatal SCID arm appears to have no distinct MONDO
    term. Curating those is out of scope here and is left explicit rather than
    implied by omission.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease correlated to RAC2 activity: constitutively active RAS-like
      mutations caused neonatal SCID, dominant-negative mutations caused
      LAD-like disease, whereas dominant-activating mutations caused CID.
    explanation: >-
      The genotype-to-phenotype mapping that defines the scope boundary of this
      entry, from a 54-patient cohort in which every variant was functionally
      assayed.
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were grouped by presentation: neonatal SCID (n = 5), infantile
      LAD-like disease (n = 5), or CID (n = 44).
    explanation: >-
      Gives the relative sizes of the three arms, showing the dominant-negative
      LAD-like arm curated here is the smallest.
- discussion_id: gap_rac2_mondo_scid_parent
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Severe Early-Onset Bacterial Infection and Poor Wound Healing
  prompt: >-
    Is MONDO:0017855 (T-B- severe combined immunodeficiency) a correct parent
    for MONDO:0011988?
  rationale: >-
    MONDO gives this term two parents: functional neutrophil defect, which fits,
    and T-B- severe combined immunodeficiency, which does not obviously fit the
    dominant-negative arm. The cohort data place the dominant-negative alleles
    in the phagocyte/LAD-like group with normal-to-elevated neutrophil counts,
    while the T-B- SCID picture belongs to the constitutively active alleles at
    the same gene. This looks like gene-level classification applied to an
    allele-level term. Recorded here rather than acted on, because it is an
    upstream ontology question; the whole IMD73 series shares that parent, so it
    is likely one fix rather than three.
  evidence:
  - reference: PMID:38194689
    reference_title: Clinical and functional spectrum of RAC2-related immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease correlated to RAC2 activity: constitutively active RAS-like
      mutations caused neonatal SCID, dominant-negative mutations caused
      LAD-like disease, whereas dominant-activating mutations caused CID.
    explanation: >-
      Assigns the SCID presentation to a different allele class from the one
      this MONDO term denotes, which is the basis for questioning the parent.
notes: >-
  Relationship to chronic granulomatous disease: both diseases end in a failed
  respiratory burst, but the lesion differs in kind. In CGD the catalytic NOX2
  complex itself is broken; here the complex is intact and only its RAC2
  activator is missing, which is why adding recombinant Rac to patient extracts
  restores superoxide production. RAC2 disease also has a second, independent
  arm - failed chemotaxis and actin assembly - that CGD does not, and it is that
  arm which makes the clinical picture a leukocyte adhesion deficiency mimic
  rather than a CGD mimic. A phagocyte_oxidative_burst_failure module factoring
  out the shared NOX2 chain would have CGD and this entry as its first two
  conformers; that is noted as a follow-up rather than created here.

  Diagnostic note worth preserving: routine screening is normal. The neutrophil
  count is high rather than low, CD11b expression is normal, and the defect is
  functional. Normal CD11b is what excludes leukocyte adhesion deficiency type
  I, which this otherwise resembles.

  Curation provenance: a Perplexity deep-research report was generated
  (research/Neutrophil_Immunodeficiency_Syndrome-deep-research-perplexity.md)
  and passed the NEC preflight against MONDO:0011988, with RAC2 mentioned 210
  times. The gene-level preflight is weak evidence here, because every RAC2
  allele class would pass it - the real risk was a report nominally about RAC2
  immunodeficiency but substantively about the dominant-activating CID cohort,
  which accounts for 44 of the 54 patients in the flagship series. That was
  checked separately at the allele level: the report mentions D57N 58 times and
  the activating alleles E62K, G12R and Q61 not at all, so it is squarely about
  the arm curated here. Recording the check because the preflight tool cannot
  perform it - NEC risk in a gene with an allele-class spectrum lives in the
  variant, not the gene symbol.

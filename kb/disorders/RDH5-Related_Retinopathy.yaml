genetic:
- name: RDH5 pathogenic variants
  gene_term:
    preferred_term: RDH5
    term:
      id: hgnc:9940
      label: RDH5
  association: Causative
  features: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants in
    RDH5 cause the disease. In Japanese cohorts the recurrent variant
    p.L310delinsEV accounts for a majority of disease alleles and has been
    detected in patients both with and without the progressive cone dystrophy
    subtype, indicating that this specific allele alone does not fully predict
    progression.

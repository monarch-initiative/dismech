        RDH5-related retinopathy.
  evidence:
  - reference: PMID:32232344
    reference_title: RDH5-Related Fundus Albipunctatus in a Large Japanese Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently observed variant was p.L310delinsEV (65.2%, 30/46 alleles)."
    explanation: >-
      This large Japanese cohort study establishes p.L310delinsEV as the
      predominant recurrent RDH5 allele.
  - reference: PMID:11053295
    reference_title: A high association with cone dystrophy in Fundus albipunctatus caused by mutations of the RDH5 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nt 928 C to GAAG mutation was detected in patients with and without cone dystrophy."
    explanation: >-
      This finding (the nt928 C-to-GAAG variant corresponds to p.L310delinsEV)
      demonstrates that this single recurrent allele alone does not fully
      determine progression to the cone dystrophy subtype.
treatments:
- name: Oral 9-cis-beta-carotene supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An investigational, non-FDA-approved chromophore-analog supplementation
    strategy. In a small open-label phase I pilot study, daily oral high-dose
    9-cis-beta-carotene for 90 days significantly improved peripheral visual
    field and rod ERG recovery kinetics in patients with fundus albipunctatus,
    with no reported complications. This is proof-of-concept evidence for
    visual-cycle bypass supplementation rather than an established standard of
    care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 9-cis-beta-carotene
      term:
        id: CHEBI:67188
        label: 9-cis-beta-carotene
  evidence:
  - reference: PMID:19955196
    reference_title: "Treatment of a retinal dystrophy, fundus albipunctatus, with oral 9-cis-{beta}-carotene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed significant improvements in peripheral visual field (mean deviation improved from -4.77+/-2.0 to -3.28+/-2.28, p=0.009, t test) and a highly significant improvement in rod recovery rates measured electroretinographically (maximal scotopic b-wave amplitude responses, improved from 197+/-49 muV to 292+/-48 muV, p<0.001, t test)."
    explanation: >-
      This phase I pilot study (n=7) provides the quantitative efficacy data for
      the investigational chromophore-supplementation approach.
  - reference: PMID:19955196
    reference_title: "Treatment of a retinal dystrophy, fundus albipunctatus, with oral 9-cis-{beta}-carotene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral treatment with 9-cis-beta-carotene led to reversal of a human retinal dystrophy."
    explanation: >-
      This is the study's own summary conclusion characterizing the treatment
      effect observed in the pilot trial.
- name: Supportive care and monitoring
  therapeutic_modality: OTHER
  description: >-
    In the absence of an approved disease-modifying therapy, management for the
    typical stationary form consists of reassurance and routine ophthalmological
    follow-up given the generally favorable long-term prognosis. Patients who
    develop the progressive cone/macular subtype warrant closer monitoring
    (visual acuity, photopic ERG, OCT) and low vision support as needed.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:12906118
    reference_title: "RDH5 gene mutations and electroretinogram in fundus albipunctatus with or without macular dystrophy: RDH5 mutations and ERG in fundus albipunctatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype including electrophysiological responses varied among patients with the RDH5 gene mutations."
    explanation: >-
      This variability in clinical course across patients supports individualized
      monitoring rather than a uniform management pathway.
- name: Genetic counseling
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling is indicated given the autosomal recessive inheritance
    pattern, the availability of molecular confirmation, and the incomplete
    genotype-phenotype correlation for the progressive cone/macular subtype.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:25820994
    reference_title: "Fundus albipunctatus: review of the literature and report of a novel RDH5 gene mutation affecting the invariant tyrosine (p.Tyr175Phe)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This disorder shows autosomal recessive inheritance and is caused mostly by mutations in the RDH5 gene."
    explanation: >-
      Confirms the autosomal recessive inheritance pattern that underlies
      genetic counseling recommendations for affected families.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: NEUROLOGIC
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of RDH5 (and, when negative, the phenocopy genes RLBP1 and RPE65)
    confirms the diagnosis and distinguishes RDH5-related retinopathy from other
    flecked-retina syndromes and phenocopies.
  results: >-
    Identification of biallelic pathogenic RDH5 variants confirms the diagnosis.
    A negative RDH5 result in a patient with a fundus-albipunctatus-like
    phenotype should prompt consideration of RLBP1 or RPE65 as phenocopy genes.
  evidence:
  - reference: PMID:22669287
    reference_title: "Multimodal fundus imaging in fundus albipunctatus with RDH5 mutation: a newly identified compound heterozygous mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ERG and genetic study remain the most reliable tests for making the diagnosis"
    explanation: >-
      This review confirms genetic testing alongside ERG as the most reliable
      diagnostic standard, more definitive than retinal imaging alone.
- name: Prolonged dark-adaptation electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Serial ERG testing after a short (20-30 minute) versus a prolonged (2-3 hour)
    dark-adaptation period is the classic diagnostic maneuver for fundus
    albipunctatus.
  results: >-
    Recovery of rod and cone ERG amplitudes to normal after prolonged dark
    adaptation indicates the stationary form; persistent subnormal amplitudes
    after prolonged dark adaptation indicate the progressive/macular subtype.
  evidence:
  - reference: PMID:12906118
    reference_title: "RDH5 gene mutations and electroretinogram in fundus albipunctatus with or without macular dystrophy: RDH5 mutations and ERG in fundus albipunctatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the waveform attained normal amplitudes in patients without macular dystrophy but the a-waves were still subnormal in patients with macular dystrophy"
    explanation: >-
      This directly establishes the ERG recovery pattern as a functional
      differentiator between the stationary and progressive/macular subtypes.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: multimodal retinal imaging
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  description: >-
    Near-infrared reflectance imaging, fundus autofluorescence, and optical
    coherence tomography (OCT) characterize the retinal flecks and detect
    macular involvement.
  results: >-
    Near-infrared imaging shows a characteristic "target sign" corresponding to
    the yellow flecks in nearly all patients regardless of ethnicity or specific
    RDH5 variant; SD-OCT localizes lesions to the level between the external
    limiting membrane and retinal pigment epithelium.
  evidence:
  - reference: PMID:35250012
    reference_title: "THE TARGET SIGN: A Near Infrared Feature and Multimodal Imaging in a Pluri-Ethnic Cohort with RDH5-Related Fundus Albipunctatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All eyes (n = 36, 100%) showed small circular findings seen on near-infrared images, termed as the \"target sign,\" correlating to the yellowish dots seen clinically"
    explanation: >-
      This multicenter, multiethnic cohort establishes the target sign as a
      consistent near-infrared imaging finding across genetic and ethnic
      backgrounds.
epidemiology:
- name: Rarity and variant spectrum
  description: >-
    RDH5-related retinopathy is rare without an established population
    prevalence estimate. The RDH5 variant spectrum is enriched for a small
    number of recurrent alleles in specific populations; in Japanese cohorts the
    p.L310delinsEV variant accounts for the majority of disease alleles.
  evidence:
  - reference: PMID:25820994
    reference_title: "Fundus albipunctatus: review of the literature and report of a novel RDH5 gene mutation affecting the invariant tyrosine (p.Tyr175Phe)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fundus albipunctatus (FA) is a rare, congenital form of night blindness with rod system impairment"
    explanation: >-
      This review characterizes fundus albipunctatus as a rare disease without
      a precise population prevalence figure in the literature.
  - reference: PMID:32232344
    reference_title: RDH5-Related Fundus Albipunctatus in a Large Japanese Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently observed variant was p.L310delinsEV (65.2%, 30/46 alleles)."
    explanation: >-
      This is the largest reported single-population cohort and quantifies the
      dominant recurrent allele in the Japanese RDH5 variant spectrum.
progression:
- phase: Congenital stationary night blindness with flecked fundus
  age_range: Childhood through early adulthood
  notes: >-
    Night blindness is typically apparent from childhood. ERG demonstrates
    delayed but recoverable dark adaptation. Long-term follow-up in this form
    usually shows no progression of rod dysfunction.
  evidence:
  - reference: PMID:25820994
    reference_title: "Fundus albipunctatus: review of the literature and report of a novel RDH5 gene mutation affecting the invariant tyrosine (p.Tyr175Phe)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although long-term follow-up usually shows no progression in rods dysfunction in patients with this form of night blindness, some patients, especially the elderly, reveal progressive cone dystrophy"
    explanation: >-
      This establishes the typical stationary natural history through
      adulthood in the majority of patients.
- phase: Age-associated progressive cone dystrophy and macular atrophy in a subset
  age_range: Typically after age 40
  notes: >-
    A minority of patients, more often after age 40, develop progressive cone
    dysfunction and/or macular atrophy with declining visual acuity; in the most
    advanced reported case (a 76-year-old patient) the classic white dots had
    faded entirely, leaving only macular atrophy.
  evidence:
  - reference: PMID:11053295
    reference_title: A high association with cone dystrophy in Fundus albipunctatus caused by mutations of the RDH5 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cone dystrophy was most frequently seen in patients over 40 years old."
    explanation: >-
      This directly documents the age-associated onset of the progressive
      cone dystrophy phase.
  - reference: PMID:12967826
    reference_title: A novel RDH5 gene mutation in a patient with fundus albipunctatus presenting with macular atrophy and fading white dots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first reported long-term case of fundus albipunctatus demonstrating macular atrophy with fading of the typical white dots."
    explanation: >-
      This 76-year-old case represents the most advanced documented endpoint of
      the progressive natural history trajectory.

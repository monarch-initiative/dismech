name: RDH5-Related Retinopathy
creation_date: "2026-07-21T22:25:59Z"
category: Mendelian
description: >-
  RDH5-related retinopathy is an autosomal recessive inherited retinal disease caused
  by biallelic pathogenic variants in RDH5, encoding 11-cis-retinol dehydrogenase, a
  microsomal short-chain dehydrogenase/reductase abundant in the retinal pigment
  epithelium (RPE) that catalyzes the oxidation of 11-cis-retinol to 11-cis-retinal,
  the chromophore shared by rod and cone opsins. Loss of this enzymatic activity
  delays regeneration of both rod and cone photopigments and causes accumulation of
  cis-retinoid intermediates in the RPE. The classic clinical presentation, fundus
  albipunctatus, is a congenital, largely stationary form of night blindness with
  numerous small yellow-white deep retinal flecks sparing the fovea and a
  characteristic negative-configuration electroretinogram (ERG) that normalizes after
  prolonged (2-3 hour) dark adaptation. A subset of patients, more often after age 40
  and with variable expressivity even among relatives sharing an identical genotype,
  develop a distinct, progressive course of cone dysfunction and macular atrophy
  superimposed on the flecked-retina background.
disease_term:
  preferred_term: RDH5-related retinopathy
  term:
    id: MONDO:0100443
    label: RDH5-related retinopathy
synonyms:
- Fundus albipunctatus
- RDH5 retinopathy
- Pigmentary retinal dystrophy
- Retinitis punctata albescens
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  "Retinitis punctata albescens" is included as a historical synonym because MONDO
  lists it as a narrow synonym of MONDO:0100443, but the term is genetically
  heterogeneous in the broader literature and can also arise from RLBP1 or PRPH2
  variants; a curator encountering that label alone should not assume an RDH5 cause
  without confirmatory genetic testing. RPE65 mutations are a separate, non-allelic
  phenocopy of the fundus albipunctatus phenotype (a distinct disease mechanism, not
  a modifier or digenic interaction with RDH5) — no literature was found supporting a
  true RDH5+RPE65 digenic or modifier mechanism despite this being a plausible a
  priori hypothesis given both genes act in the same visual cycle. Reported fundus
  autofluorescence findings at the fleck lesions are inconsistent across studies
  (decreased in some series, small hyperautofluorescent dots in others), likely
  reflecting different lesion maturity/stage rather than a single characteristic FAF
  signature. The disease is part of the broader "flecked retina syndrome" group
  (which also includes Stargardt disease/fundus flavimaculatus, familial drusen, and
  fleck retina of Kandori) and must be distinguished from unrelated "white dot
  syndromes" of inflammatory/uveitic origin.
has_subtypes:
- name: Stationary
  display_name: Stationary Fundus Albipunctatus
  description: >-
    The classic, typically non-progressive presentation: congenital night blindness
    with numerous yellow-white retinal flecks sparing the fovea and a negative
    dark-adapted ERG that normalizes to typical amplitudes after prolonged (2-3 hour)
    dark adaptation. Long-term follow-up usually shows no progression of the rod
    dysfunction in this form.
  evidence:
  - reference: PMID:25820994
    reference_title: "Fundus albipunctatus: review of the literature and report of a novel RDH5 gene mutation affecting the invariant tyrosine (p.Tyr175Phe)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although long-term follow-up usually shows no progression in rods dysfunction in patients with this form of night blindness, some patients, especially the elderly, reveal progressive cone dystrophy"
    explanation: >-
      This review confirms that the rod-dominant night blindness of fundus
      albipunctatus is typically stationary over long-term follow-up, distinguishing
      this subtype from the progressive cone dystrophy subset.
- name: Progressive Cone Dystrophy
  display_name: Progressive Cone Dystrophy and Macular Atrophy
  description: >-
    A subset of RDH5 patients, most frequently over age 40, develop progressive cone
    dysfunction and/or macular atrophy superimposed on the flecked fundus, with
    declining photopic ERG amplitudes, reduced visual acuity, and in some cases
    fading of the classic white dots over decades. Genotype-phenotype correlation is
    incomplete: siblings homozygous for the identical RDH5 variant have been reported
    with discordant macular involvement, suggesting unidentified genetic or
    environmental modifiers.
  evidence:
  - reference: PMID:11053295
    reference_title: A high association with cone dystrophy in Fundus albipunctatus caused by mutations of the RDH5 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cone dystrophy was most frequently seen in patients over 40 years old."
    explanation: >-
      This case series establishes the age-associated onset of the progressive
      cone dystrophy subtype among RDH5 patients.
  - reference: PMID:12788147
    reference_title: Macular dystrophy in a Japanese family with fundus albipunctatus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He also had bull's-eye maculopathy and prepappillary arterial loops, whereas she did not, and his best-corrected visual acuity was impaired, whereas hers was normal."
    explanation: >-
      A sibling pair homozygous for the identical Gly107Arg RDH5 mutation showed
      discordant macular phenotypes, demonstrating incomplete genotype-phenotype
      correlation for the progressive subtype.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    RDH5-related retinopathy is caused by biallelic (homozygous or compound
    heterozygous) loss-of-function variants in RDH5.
  evidence:
  - reference: PMID:25820994
    reference_title: "Fundus albipunctatus: review of the literature and report of a novel RDH5 gene mutation affecting the invariant tyrosine (p.Tyr175Phe)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This disorder shows autosomal recessive inheritance and is caused mostly by mutations in the RDH5 gene."
    explanation: >-
      This review confirms autosomal recessive inheritance as the primary mode for
      RDH5-related retinopathy.
pathophysiology:
- name: RDH5 11-cis-Retinol Dehydrogenase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic RDH5 variants reduce or abolish the enzymatic activity of
    11-cis-retinol dehydrogenase, a microsomal enzyme abundant in the RPE proposed
    to catalyze the oxidation of 11-cis-retinol to 11-cis-retinal. Recombinant mutant
    enzyme shows directly reduced activity compared with wild-type enzyme.
  gene:
    preferred_term: RDH5
    modifier: DECREASED
    term:
      id: hgnc:9940
      label: RDH5
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: retinol metabolic process
    modifier: DECREASED
    term:
      id: GO:0042572
      label: retinol metabolic process
  - preferred_term: retinoid metabolic process
    modifier: DECREASED
    term:
      id: GO:0001523
      label: retinoid metabolic process
  downstream:
  - target: Delayed Chromophore Regeneration and Retinoid Intermediate Accumulation
    description: >-
      Loss of 11-cis-retinol dehydrogenase activity blocks the final oxidation step
      of the visual cycle, preventing efficient regeneration of the 11-cis-retinal
      chromophore.
    evidence:
    - reference: PMID:10369264
      reference_title: Mutations in the gene encoding 11-cis retinol dehydrogenase cause delayed dark adaptation and fundus albipunctatus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This microsomal enzyme is abundant in the retinal pigment epithelium, where it has been proposed to catalyse the conversion of 11-cis retinol to 11-cis retinal."
      explanation: >-
        This original genetic-discovery paper establishes RDH5's proposed enzymatic
        role in the RPE, the proximal step disrupted by pathogenic variants.
  evidence:
  - reference: PMID:10369264
    reference_title: Mutations in the gene encoding 11-cis retinol dehydrogenase cause delayed dark adaptation and fundus albipunctatus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant mutant 11-cis retinol dehydrogenases had reduced activity compared with recombinant enzyme with wild-type sequence."
    explanation: >-
      This biochemical comparison of recombinant mutant versus wild-type enzyme
      directly demonstrates the loss-of-function mechanism of RDH5 pathogenic
      variants.
  - reference: PMID:11418621
    reference_title: Characterization of a dehydrogenase activity responsible for oxidation of 11-cis-retinol in the retinal pigment epithelium of mice with a disrupted RDH5 gene. A model for the human hereditary disease fundus albipunctatus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The RDH5 gene encodes a dehydrogenase that is responsible for the majority of RDH activity."
    explanation: >-
      This Rdh5-knockout mouse study confirms RDH5 accounts for the majority of
      11-cis-retinol dehydrogenase activity in the RPE.
- name: Delayed Chromophore Regeneration and Retinoid Intermediate Accumulation
  biological_scale: MOLECULAR
  description: >-
    Loss of RDH5 activity delays regeneration of 11-cis-retinal for both rod and
    cone photopigments and causes accumulation of cis-retinoid intermediates
    (particularly 13-cis-isomers) in the RPE, directly demonstrated in an
    Rdh5-knockout mouse model of the human disease.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Prolonged Rod and Cone Photopigment Regeneration Kinetics
    description: >-
      The core stationary-phenotype consequence: both rod and cone photopigment
      regeneration is delayed but ultimately complete, producing a reversible
      dark-adaptation defect rather than permanent photoreceptor signaling loss.
    evidence:
    - reference: PMID:10369264
      reference_title: Mutations in the gene encoding 11-cis retinol dehydrogenase cause delayed dark adaptation and fundus albipunctatus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "a rare form of stationary night blindness characterized by a delay in the regeneration of cone and rod photopigments"
      explanation: >-
        This defines the core mechanistic consequence of RDH5 loss: delayed, not
        absent, regeneration of both rod and cone photopigments.
  - target: Age-Associated Chronic Retinoid Stress and Cone Photoreceptor Vulnerability
    description: >-
      In a subset of patients, ongoing impaired chromophore supply and/or retinoid
      intermediate accumulation produces cumulative cone photoreceptor and RPE
      stress that becomes clinically apparent with age, diverging from the typical
      stationary course.
    evidence:
    - reference: PMID:11053295
      reference_title: A high association with cone dystrophy in Fundus albipunctatus caused by mutations of the RDH5 gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the mutations of the RDH5 gene caused a progressive cone dystrophy as well as night blindness"
      explanation: >-
        This case series establishes that a subset of RDH5 mutations produce
        progressive cone dystrophy in addition to the stationary night blindness,
        diverging from the purely stationary mechanistic path.
  evidence:
  - reference: PMID:11418621
    reference_title: Characterization of a dehydrogenase activity responsible for oxidation of 11-cis-retinol in the retinal pigment epithelium of mice with a disrupted RDH5 gene. A model for the human hereditary disease fundus albipunctatus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lack of 11-cis-RDH leads to an accumulation of cis-retinoids, particularly 13-cis-isomers."
    explanation: >-
      This Rdh5-knockout mouse study directly demonstrates retinoid intermediate
      accumulation as the biochemical consequence of RDH5 loss.
- name: Prolonged Rod and Cone Photopigment Regeneration Kinetics
  biological_scale: TISSUE
  description: >-
    Clinically, delayed but ultimately complete photopigment regeneration produces
    the classic reversible dark-adaptation defect of fundus albipunctatus: a
    negative-configuration, reduced-amplitude ERG after a short (20-30 minute)
    dark-adaptation period that normalizes to typical amplitudes after prolonged
    (2-3 hour) dark adaptation in patients without macular involvement. This
    recoverable pattern distinguishes stationary fundus albipunctatus from other
    congenital stationary night blindness disorders with permanently subnormal ERGs.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:12906118
    reference_title: "RDH5 gene mutations and electroretinogram in fundus albipunctatus with or without macular dystrophy: RDH5 mutations and ERG in fundus albipunctatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bright-flash, mixed rod-cone ERG had a negative configuration with reduced a-wave amplitudes after a short period of dark-adaptation (20 or 30 min). After a prolonged dark-adaptation period (2 or 3 h), the waveform attained normal amplitudes in patients without macular dystrophy but the a-waves were still subnormal in patients with macular dystrophy."
    explanation: >-
      This cohort study of 21 patients establishes the diagnostic ERG recovery
      pattern that defines the stationary form and distinguishes it electrophysiologically
      from the progressive/macular subtype.
  - reference: PMID:22669287
    reference_title: "Multimodal fundus imaging in fundus albipunctatus with RDH5 mutation: a newly identified compound heterozygous mutation and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroretinography (ERG) showed improved dark-adapted responses after a prolonged 2.5-h dark adaptation."
    explanation: >-
      This case confirms the characteristic ERG recovery after prolonged dark
      adaptation in a genetically confirmed RDH5 patient.
- name: Age-Associated Chronic Retinoid Stress and Cone Photoreceptor Vulnerability
  biological_scale: CELLULAR
  description: >-
    In a subset of patients, more frequently after age 40 and with variable
    expressivity even among relatives sharing an identical RDH5 genotype, chronic
    impairment of chromophore supply produces cumulative cone photoreceptor stress
    that diverges from the typical stationary course.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  downstream:
  - target: Progressive Cone Dystrophy and Macular Atrophy
    description: >-
      Sustained cone photoreceptor and RPE stress in the vulnerable subset
      progresses to measurable macular atrophy and declining cone-mediated visual
      function.
    evidence:
    - reference: PMID:38945349
      reference_title: "RDH5 and RLBP1-Associated Inherited Retinal Diseases: Refining the Spectrum of Stationary and Progressive Phenotypes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Progressive MA in addition to congenital night blindness can be identified in adult patients with RDH5-associated retinopathy."
      explanation: >-
        This retrospective cohort study directly documents progressive macular
        atrophy as a distinct clinical trajectory in adult RDH5 patients.
  evidence:
  - reference: PMID:12788147
    reference_title: Macular dystrophy in a Japanese family with fundus albipunctatus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous Gly107Arg mutation in the RDH5 gene was detected in both siblings."
    explanation: >-
      Despite an identical homozygous genotype, this sibling pair showed discordant
      macular involvement, supporting variable expressivity of the progressive
      cone/macular subtype rather than strict genotype-determined severity.
- name: Progressive Cone Dystrophy and Macular Atrophy
  biological_scale: TISSUE
  description: >-
    In the vulnerable subset, cone dysfunction and macular atrophy progress over
    years to decades, with significant measurable macular volume loss, declining
    photopic (cone) ERG amplitudes, and in the most advanced cases fading of the
    classic white flecks and reduced central visual acuity. This represents a
    materially different prognosis and monitoring need than the typical stationary
    course. Unlike the photoreceptor_degeneration module's rod-first apoptosis
    followed by non-cell-autonomous secondary cone loss, RDH5 cone dysfunction
    arises directly from the same chronic RPE chromophore-supply defect that
    affects rods, not as a bystander effect of rod death, so this node does not
    declare conforms_to either module node.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:38945349
    reference_title: "RDH5 and RLBP1-Associated Inherited Retinal Diseases: Refining the Spectrum of Stationary and Progressive Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a significant annual rate of macular volume loss, estimated at -0.007 mm3/y (95% CI, -0.012 to -0.001; P = .02), without any significant difference between the two genotypes"
    explanation: >-
      This retrospective cohort quantifies the annual rate of macular volume loss
      in RDH5-associated retinopathy, confirming a measurable progressive
      trajectory in adult patients.
  - reference: PMID:32232344
    reference_title: RDH5-Related Fundus Albipunctatus in a Large Japanese Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "macular involvement was observed in 12 patients (24 eyes)"
    explanation: >-
      This large Japanese cohort (25 patients) quantifies the proportion of
      patients with OCT-confirmed macular involvement.
  - reference: PMID:32232344
    reference_title: RDH5-Related Fundus Albipunctatus in a Large Japanese Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "decreased cone responses were seen in 17 patients (73.9%)"
    explanation: >-
      This confirms decreased cone (photopic) ERG responses as a common finding
      in this large RDH5 cohort, consistent with the progressive cone dystrophy
      mechanism.
  - reference: PMID:12967826
    reference_title: A novel RDH5 gene mutation in a patient with fundus albipunctatus presenting with macular atrophy and fading white dots.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fundoscopy revealed only macular atrophy with notable absence of white dots."
    explanation: >-
      This long-term case (76-year-old patient) documents the most advanced end
      of the progressive trajectory: macular atrophy with disappearance of the
      classic flecks.

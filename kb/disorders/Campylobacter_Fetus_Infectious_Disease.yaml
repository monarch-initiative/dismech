name: Campylobacter fetus Infectious Disease
creation_date: '2026-09-29T00:00:00Z'
category: Infectious Disease
description: >-
  A zoonotic Campylobacteriosis subtype caused by Campylobacter fetus, notable
  for serum-resistant bloodstream infection and secondary vascular, central
  nervous system, soft-tissue, osteoarticular, and perinatal localizations.
disease_term:
  preferred_term: Campylobacter fetus infectious disease
  term:
    id: MONDO:0040728
    label: Campylobacter fetus infectious disease
parents:
- Campylobacteriosis
synonyms:
- Campylobacter fetus infection
- C. fetus infection
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:41241280
      reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Campylobacter fetus is a rare but serious pathogen, mainly affecting immunocompromised patients."
      explanation: Supports classification as an infectious disease caused by a named bacterial pathogen.
definitions:
- name: Culture-confirmed Campylobacter fetus invasive infection
  definition_type: CASE_DEFINITION
  description: >-
    Confirmed C. fetus infection in humans is often recognized by positive blood
    cultures and may progress from bacteremia to secondary vascular and other
    extraintestinal foci.
  scope: Human Campylobacter fetus infection
  evidence:
  - reference: PMID:37877803
    reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 991 patients with isolated Campylobacter spp. strains, we identified 39 (4%) with culture-positive C. fetus infections, of which 33 had complete records and underwent further analysis; 21 had documented bacteremia and 12 did not."
    explanation: >-
      Defines the curated human syndrome as culture-positive C. fetus infection
      and documents that bacteremia is common in confirmed disease.
infectious_agent:
- name: Campylobacter fetus
  infectious_agent_term:
    preferred_term: Campylobacter fetus
    term:
      id: NCBITaxon:196
      label: Campylobacter fetus
  description: >-
    Gram-negative zoonotic Campylobacter species whose S-layer proteins confer
    serum resistance and enable invasive human infection.
  has_subtypes:
  - name: Campylobacter fetus subsp. fetus
    classification: subspecies
    description: >-
      Frequent subspecies among reported C. fetus meningitis isolates.
    subtype_term:
      preferred_term: Campylobacter fetus subsp. fetus
      term:
        id: NCBITaxon:32019
        label: Campylobacter fetus subsp. fetus
    evidence:
    - reference: PMID:41241280
      reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Of 38 isolates, 24 were subspeciated: Cff was most frequent (18/24, 75 %), followed by C. fetus subsp. intestinalis and venerealis (2 each), and single isolates of jejuni and Spirillum serpens."
      explanation: Supports C. fetus subsp. fetus as a human systemic-infection subspecies.
  - name: Campylobacter fetus subsp. venerealis
    classification: subspecies
    description: >-
      Bovine genital subspecies that causes reproductive disease in cattle and
      illustrates the species' genital-reservoir branch.
    subtype_term:
      preferred_term: Campylobacter fetus subsp. venerealis
      term:
        id: NCBITaxon:32020
        label: Campylobacter fetus subsp. venerealis
    evidence:
    - reference: PMID:32867004
      reference_title: Genotyping and antibiotic resistance patterns of Campylobacter fetus subsp.venerealis from cattle farms in India.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Bovine genital campylobacteriosis caused by Campylobacter fetus subsp. venerealis (Cfv) is of considerable economic importance to the cattle industry worldwide.
      explanation: Identifies C. fetus subsp. venerealis as the bovine genital disease subspecies.
    - reference: PMID:38133216
      reference_title: The History of Bovine Genital Campylobacteriosis in the Face of Political Turmoil and Structural Change in Cattle Farming in Germany.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: It is caused by Campylobacter fetus subsp. venerealis (Cfv), one of three subspecies of Campylobacter fetus. Bulls are the reservoir but BGC may also be spread by artificial insemination (AI).
      explanation: Supports Cfv as the bovine venereal lineage maintained in bulls.
  - name: Campylobacter fetus subsp. testudinum
    classification: subspecies
    description: >-
      Reptile-associated subspecies detected in chelonians and in a reported
      invasive human bloodstream isolate.
    subtype_term:
      preferred_term: Campylobacter fetus subsp. testudinum
      term:
        id: NCBITaxon:1507806
        label: Campylobacter fetus subsp. testudinum
    evidence:
    - reference: PMID:31928704
      reference_title: Occurrence and diversity of Campylobacter species in captive chelonians.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Out of 452 samples, five (1.1%) tested positive: three for C. iguaniorum (two Testudo graeca and one Testudo hermanni), one for C. fetus subsp. testudinum (Stigmochelys pardalis) and one for C. geochelonis (Testudo hermanni)."
      explanation: Supports chelonians as a documented C. fetus subsp. testudinum host context.
    - reference: PMID:40484837
      reference_title: "[Genomic characteristics of sequence type 80 of Campylobacter fetus subsp. testudinum from bacteremia]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: To analyze the genomic characteristics of Campylobacter fetus subsp. testudinum (Cft) sequence type (ST) 80 from bacteremia patient.
      explanation: Supports C. fetus subsp. testudinum as a reported human bloodstream-infection subspecies.
  evidence:
  - reference: PMID:9851986
    reference_title: Campylobacter fetus surface layer proteins are transported by a type I secretion system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The virulence of Campylobacter fetus, a bacterial pathogen of ungulates and humans, is mediated in part by the presence of a paracrystalline surface layer (S-layer) that confers serum resistance."
    explanation: Identifies C. fetus as a human pathogen and ties a named surface structure to virulence.
agent_life_cycle:
  description: >-
    C. fetus is maintained in ungulate intestinal and genital reservoirs, with
    subspecies-specific expansion into bovine venereal infection and occasional
    reptile-associated human infection.
  hosts:
  - preferred_term: cattle
    term:
      id: NCBITaxon:9913
      label: Bos taurus
    role: reservoir host
  - preferred_term: sheep
    term:
      id: NCBITaxon:9940
      label: Ovis aries
    role: reservoir host
  - preferred_term: chelonians
    term:
      id: NCBITaxon:8459
      label: Testudines
    role: rare reptile host
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Campylobacter fetus is a recognized pathogen of cattle and sheep, though human infection has also been reported.
    explanation: Supports cattle and sheep as established animal hosts for C. fetus.
  - reference: PMID:31928704
    reference_title: Occurrence and diversity of Campylobacter species in captive chelonians.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study suggests that Campylobacter spp. are not common in chelonians, but a variety of species can be detected in these hosts, including those potentially pathogenic for humans."
    explanation: Supports chelonians as a reptile host context for Campylobacter species including C. fetus subsp. testudinum.
transmission:
- name: Foodborne or waterborne zoonotic exposure
  description: >-
    Human C. fetus infection can follow ingestion-mediated exposure from
    contaminated food or water, a route proposed for both human and animal
    infection.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ingestion of contaminated food or water is a proposed route of transmission for both humans and animals.
    explanation: Supports foodborne or waterborne ingestion as a proposed transmission route.
pathophysiology:
- name: Animal-reservoir exposure to Campylobacter fetus
  description: >-
    Human infection begins after exposure to C. fetus from an animal reservoir,
    most plausibly by ingestion of contaminated food or water or by contact with
    reservoir animals and their environments.
  role: trigger
  downstream:
  - target: Fibronectin-enhanced mucosal adhesion
    description: >-
      The exposed organism reaches mucosal surfaces where fibronectin binding
      can promote initial attachment to extracellular matrix and epithelial cells.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ingestion of contaminated food or water is a proposed route of transmission for both humans and animals.
    explanation: Supports ingestion-mediated reservoir exposure as a proposed route into the host.
- name: Fibronectin-enhanced mucosal adhesion
  description: >-
    C. fetus binds fibronectin and can use soluble fibronectin to increase
    attachment to intestinal epithelial cells, establishing close contact with
    mucosal and submucosal surfaces.
  downstream:
  - target: Transcellular epithelial translocation
    description: Adhesion is an upstream step that positions organisms for epithelial invasion and egress.
  evidence:
  - reference: PMID:18388970
    reference_title: Fibronectin enhances Campylobacter fetus interaction with extracellular matrix components and INT 407 cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, this data suggests that C. fetus can bind to immobilized fibronectin and use soluble fibronectin to enhance attachment to other ECM components and intestinal epithelial cells."
    explanation: Supports fibronectin-enhanced attachment to intestinal epithelial cells.
- name: Transcellular epithelial translocation
  description: >-
    C. fetus crosses model intestinal epithelial monolayers by entering and
    exiting epithelial cells rather than by paracellular barrier disruption.
  downstream:
  - target: S-layer-mediated serum resistance
    description: Barrier traversal moves C. fetus toward the bloodstream, where S-layer proteins support serum survival.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, translocation without disrupting monolayer integrity, invasion and egression from Caco-2 cells, electron microscopy observations and the requirement of a functional tubulin cytoskeleton for translocation, support a transcellular mechanism of C. fetus translocation across Caco-2 cell monolayers."
    explanation: Supports an epithelial translocation node rather than a paracellular leak node.
- name: S-layer-mediated serum resistance
  description: >-
    Paracrystalline S-layer proteins on the C. fetus surface confer resistance
    to serum and complement killing and undergo antigenic variation.
  downstream:
  - target: Sustained Campylobacter fetus bacteremia
    description: Serum-resistant S-layer-expressing organisms are selected for survival after bloodstream entry.
    evidence:
    - reference: PMID:2318963
      reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: High-grade bacteremia in HA/ICR mice occurred after oral challenge with S-plus C. fetus strains and continued for at least 2 d, but was not present in any mice challenged with S-minus strains.
      explanation: Supports the S-layer-positive state as a driver of sustained bacteremia after oral challenge.
  evidence:
  - reference: PMID:7885229
    reference_title: High-frequency S-layer protein variation in Campylobacter fetus revealed by sapA mutagenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Campylobacter fetus utilizes paracrystalline surface (S-) layer proteins that confer complement resistance and that undergo antigenic variation to facilitate persistent mucosal colonization in ungulates.
    explanation: Supports S-layer-mediated complement resistance and antigenic variation.
  - reference: PMID:9851986
    reference_title: Campylobacter fetus surface layer proteins are transported by a type I secretion system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The subunits of the S-layer are S-layer proteins (SLPs) that are secreted in the absence of an N-terminal signal sequence and attach to either type A or B C. fetus lipopolysaccharide in a serospecific manner.
    explanation: Supports the C. fetus S-layer protein surface-transport mechanism.
- name: Sustained Campylobacter fetus bacteremia
  description: >-
    Serum-resistant organisms persist in blood, making C. fetus one of the
    leading species recovered in Campylobacter bacteremia cohorts.
  downstream:
  - target: Bacteremia
    description: Bacterial persistence in blood is the mechanistic counterpart of the bacteremia phenotype.
  - target: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
    description: Bloodstream infection enables metastatic seeding of endovascular and other secondary sites.
    evidence:
    - reference: PMID:37877803
      reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Secondary localizations were reported for 7 (33%) patients with C. fetus bacteremia, of which 5 exhibited a predilection for vascular infections (including 3 with mycotic aneurysm).
      explanation: Supports secondary localization downstream of documented C. fetus bacteremia.
  evidence:
  - reference: PMID:34849656
    reference_title: "Retrospective Multicentric Study on Campylobacter spp. Bacteremia in France: The Campylobacteremia Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 592 patients, Campylobacter jejuni and Campylobacter fetus were the most commonly identified species (in 42.9% and 42.6%, respectively)."
    explanation: Supports C. fetus as a leading cause of Campylobacter bacteremia in a multicenter human cohort.
- name: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
  description: >-
    C. fetus bacteremia can seed vascular foci, meninges, skin, bones or joints,
    and, during pregnancy, the placenta and fetus.
  role: consequence
  downstream:
  - target: Endocarditis
    description: Endovascular seeding can involve the endocardium and prosthetic intracardiac material.
  - target: Meningitis
    description: Bloodborne dissemination can seed the central nervous system.
  - target: Cellulitis
    description: Bloodstream infection can localize to skin and soft tissue.
  evidence:
  - reference: PMID:34849656
    reference_title: "Retrospective Multicentric Study on Campylobacter spp. Bacteremia in France: The Campylobacteremia Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C. jejuni and Campylobacter coli were associated with gastrointestinal signs, and C. fetus was associated with secondary localizations."
    explanation: Supports the species association between C. fetus bacteremia and secondary localization.
  - reference: PMID:7246658
    reference_title: Campylobacter infections in pregnancy. Case report and literature review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Systemic maternal infection may present either as prolonged febrile illness or fulminant sepsis, and transplacental spread may result in abortion, stillbirth, or early neonatal meningitis.
    explanation: Supports placental and fetal seeding as a pregnancy-specific branch of systemic campylobacter infection.
phenotypes:
- name: Bacteremia
  description: Bloodstream infection is a common invasive manifestation of confirmed C. fetus infection.
  phenotype_term:
    preferred_term: Bacteremia
    term:
      id: HP:0031864
      label: Bacteremia
  evidence:
  - reference: PMID:37877803
    reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 991 patients with isolated Campylobacter spp. strains, we identified 39 (4%) with culture-positive C. fetus infections, of which 33 had complete records and underwent further analysis; 21 had documented bacteremia and 12 did not."
    explanation: Supports bacteremia as a frequent documented finding in culture-positive C. fetus infection.
- name: Endocarditis
  description: A rare but severe endovascular secondary localization of C. fetus bacteremia.
  phenotype_term:
    preferred_term: Endocarditis
    term:
      id: HP:0100584
      label: Endocarditis
  evidence:
  - reference: PMID:7771897
    reference_title: "[Campylobacter fetus subspecies fetus endoaortitis on a Bentall tube prosthesis. Apropos of a case]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Campylobacter fetus is a rare cause of endocarditis and endoaortitis: the authors believe this to be the second reported case of infection of an intracardiac prosthesis."
    explanation: Supports endocarditis and endoaortitis as vascular complications of C. fetus infection.
- name: Meningitis
  description: C. fetus can cause bacterial meningitis in disseminated infection.
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  evidence:
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We report meningitis and bacteremia caused by C. fetus subsp. fetus (Cff) in a 70-year-old man with liver transplantation and splenectomy for hepatitis C virus-related cirrhosis, on long-term immunosuppression."
    explanation: Supports meningitis as a documented C. fetus manifestation.
- name: Cellulitis
  description: Skin and soft-tissue localization can accompany C. fetus bloodstream infection.
  phenotype_term:
    preferred_term: Cellulitis
    term:
      id: HP:0100658
      label: Cellulitis
  evidence:
  - reference: PMID:17999095
    reference_title: "Campylobacter fetus bloodstream infection: risk factors and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical features were fever with (62% of cases) or without (38%) extra-intestinal symptoms. These included mycotic aneurysm of the abdominal aorta (24%) and cellulitis (19%)."
    explanation: Supports cellulitis as an extraintestinal feature in a C. fetus bloodstream-infection series.
treatments:
- name: Ampicillin-gentamicin therapy
  description: Ampicillin with gentamicin has been used successfully in neonatal sepsis from C. fetus infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  target_mechanisms:
  - target: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
    treatment_effect: INHIBITS
    description: >-
      Combination beta-lactam and aminoglycoside therapy targets established
      perinatal C. fetus sepsis after maternal-fetal spread.
  evidence:
  - reference: PMID:3523697
    reference_title: Abortion and perinatal sepsis associated with campylobacter infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: As reported herein, one case of premature labor and neonatal sepsis due to Campylobacter fetus subspecies fetus was treated successfully with ampicillin and gentamicin.
    explanation: Supports ampicillin plus gentamicin as a reported regimen for perinatal C. fetus infection.
- name: Carbapenem therapy for severe invasive infection
  description: Imipenem or meropenem can be used for severe invasive C. fetus infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: imipenem
      term:
        id: CHEBI:471744
        label: imipenem
    - preferred_term: meropenem
      term:
        id: CHEBI:43968
        label: meropenem
  target_mechanisms:
  - target: Sustained Campylobacter fetus bacteremia
    treatment_effect: INHIBITS
    description: Carbapenem therapy targets bloodstream infection by C. fetus.
  - target: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
    treatment_effect: INHIBITS
    description: Carbapenems have been used in severe invasive or CNS-localized C. fetus infection.
  evidence:
  - reference: PMID:17999095
    reference_title: "Campylobacter fetus bloodstream infection: risk factors and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients initially treated with imipenem had a favourable outcome.
    explanation: Supports imipenem use in a C. fetus bloodstream-infection series.
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy was changed from cefmetazole to meropenem and vancomycin, then de-escalated to high-dose ampicillin."
    explanation: Supports meropenem use in a reported C. fetus meningitis and bacteremia case.
- name: Resistance-guided antimicrobial selection
  description: >-
    Definitive therapy should account for high quinolone and third-generation
    cephalosporin MICs reported in Campylobacter bloodstream isolates.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Sustained Campylobacter fetus bacteremia
    treatment_effect: INHIBITS
    description: Susceptibility-guided therapy avoids empiric agents that may be inactive.
  evidence:
  - reference: PMID:22771419
    reference_title: "Bacteremia caused by antimicrobial resistant Campylobacter species at a medical center in Taiwan, 1998-2008."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the isolates were resistant to third-generation cephalosporins and quinolones, with minimum inhibitory concentration (MIC(90)) values of 32 mg/L for cefotaxime, 128 mg/L for ceftriaxone, and 32 mg/L for both ciprofloxacin and levofloxacin."
    explanation: Supports avoiding unverified cephalosporin or quinolone monotherapy for invasive Campylobacter bacteremia.
  - reference: PMID:9534967
    reference_title: Development of quinolone-resistant Campylobacter fetus bacteremia in human immunodeficiency virus-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapsing C. fetus infections in quinolone-treated HIV-infected patients may be associated with the acquisition of resistance to these agents, and this resistance may be multifactorial.
    explanation: Supports acquired quinolone resistance as a treatment hazard in relapsing C. fetus bacteremia.

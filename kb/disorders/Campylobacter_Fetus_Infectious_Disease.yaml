name: Campylobacter fetus Infectious Disease
creation_date: '2026-09-29T00:00:00Z'
updated_date: '2026-11-12T00:00:00Z'
category: Infectious Disease
description: >-
  A zoonotic campylobacteriosis subtype caused by Campylobacter fetus, notable
  for paracrystalline S-layer-mediated complement resistance, sustained
  bloodstream infection in older or immunocompromised adults, and secondary
  endovascular (mycotic aortic aneurysm, endocarditis), central nervous system,
  soft-tissue, osteoarticular, peritoneal, and transplacental perinatal
  localizations.
disease_term:
  preferred_term: Campylobacter fetus infectious disease
  term:
    id: MONDO:0040728
    label: Campylobacter fetus infectious disease
parents:
- Campylobacteriosis
synonyms:
- Campylobacter fetus infection
- C. fetus infection
- infection by Campylobacter fetus
- infection by Campylobacter foetus
prevalence:
- population: Hospitalized campylobacteriosis cohorts (France)
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Accounts for approximately 1-4% of isolated human Campylobacter spp.
    infections overall, with a disproportionately high rate of bloodstream
    invasion and mortality compared with enteric Campylobacter species.
  evidence:
  - reference: PMID:37877803
    reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Campylobacter fetus accounts for 1% of Campylobacter spp. infections, but prevalence of bacteremia and risk for death are high."
    explanation: Establishes C. fetus as a rare (~1%) share of total human Campylobacter infections with disproportionately high invasive bacteremia risk.
  - reference: PMID:37877803
    reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 991 patients with isolated Campylobacter spp. strains, we identified 39 (4%) with culture-positive C. fetus infections, of which 33 had complete records and underwent further analysis; 21 had documented bacteremia and 12 did not."
    explanation: Quantifies C. fetus at 4% (39/991) of inpatient Campylobacter isolates in a 22-year French hospital series.
- population: Campylobacter spp. bacteremia cohorts (France)
  measure_type: UNKNOWN
  notes: >-
    Represents 42.6% of all Campylobacter spp. bacteremia episodes (252/592,
    co-leading alongside C. jejuni at 42.9%) in French national multicenter
    surveillance; recorded as an etiologic share of bacteremias rather than
    general-population prevalence.
  evidence:
  - reference: PMID:34849656
    reference_title: "Retrospective Multicentric Study on Campylobacter spp. Bacteremia in France: The Campylobacteremia Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 592 patients, Campylobacter jejuni and Campylobacter fetus were the most commonly identified species (in 42.9% and 42.6%, respectively)."
    explanation: Demonstrates that despite its rarity among enteric campylobacterioses, C. fetus accounts for nearly half of Campylobacter bloodstream infections.
progression:
- phase: Acute bacteremic onset
  age_range: Predominantly older or immunocompromised adults (median age 68-78 years)
  notes: >-
    Typically presents with acute or intermittent fever in elderly patients or
    hosts with immunodepression, malignancy, liver cirrhosis, diabetes, or
    underlying cardiovascular disease, often without prominent antecedent
    diarrhea.
  evidence:
  - reference: PMID:17999095
    reference_title: "Campylobacter fetus bloodstream infection: risk factors and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of the patients was 78 years. Most of them (62%) had a significant underlying disease, such as diabetes, immunodeficiency or cardiovascular disease. The main clinical features were fever with (62% of cases) or without (38%) extra-intestinal symptoms."
    explanation: Characterizes the typical febrile bloodstream presentation in older adults with comorbidities.
  - reference: PMID:34849656
    reference_title: "Retrospective Multicentric Study on Campylobacter spp. Bacteremia in France: The Campylobacteremia Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were elderly (median age 68 years), and most had underlying conditions, mainly immunodepression (43.4%), hematologic cancers (25.9%), solid neoplasms (23%), and diabetes (22.3%)."
    explanation: Multicenter cohort confirms older age and immunocompromised or neoplastic comorbidities at bacteremic onset.
- phase: Metastatic endovascular and extraintestinal seeding
  notes: >-
    Secondary localizations complicate up to one-third of C. fetus bacteremias,
    exhibiting strong vascular tropism (mycotic abdominal aortic aneurysm,
    endocarditis) as well as meningeal, osteoarticular, cellulitic, ascitic, and
    transplacental perinatal spread, with 30-day mortality of 11.7-33%.
  evidence:
  - reference: PMID:37877803
    reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary localizations were reported for 7 (33%) patients with C. fetus bacteremia, of which 5 exhibited a predilection for vascular infections (including 3 with mycotic aneurysm). Another 7 (33%) patients with C. fetus bacteremia died within 30 days."
    explanation: Quantifies secondary endovascular seeding and 30-day mortality following C. fetus bacteremia.
- phase: Post-treatment relapse
  notes: >-
    Relapsing bacteremia or meningitis occurs in up to 22% of CNS cases and in
    immunocompromised or quinolone-treated patients, driven by both
    high-frequency sapA S-layer antigenic variation and emergent antimicrobial
    resistance, necessitating prolonged parenteral beta-lactam or carbapenem
    therapy and post-treatment surveillance.
  evidence:
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Relapse occurred in 22 %, and mortality was 5 %."
    explanation: Literature review of 37 adult C. fetus meningitis cases documents a 22% relapse rate.
  - reference: PMID:9534967
    reference_title: Development of quinolone-resistant Campylobacter fetus bacteremia in human immunodeficiency virus-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relapsing C. fetus infections in quinolone-treated HIV-infected patients may be associated with the acquisition of resistance to these agents, and this resistance may be multifactorial."
    explanation: Links relapsing C. fetus bacteremia in immunocompromised hosts to emergent antimicrobial resistance.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:41241280
      reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Campylobacter fetus is a rare but serious pathogen, mainly affecting immunocompromised patients."
      explanation: Supports classification as an opportunistic bacterial infectious disease.
definitions:
- name: Culture-confirmed Campylobacter fetus invasive infection
  definition_type: CASE_DEFINITION
  description: >-
    Confirmed C. fetus infection in humans is typically established by isolation
    from blood or sterile extraintestinal site cultures and may progress from
    bacteremia to secondary vascular and other extraintestinal foci.
  scope: Human Campylobacter fetus infection
  evidence:
  - reference: PMID:37877803
    reference_title: "Campylobacter fetus Invasive Infections and Risks for Death, France, 2000-2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 991 patients with isolated Campylobacter spp. strains, we identified 39 (4%) with culture-positive C. fetus infections, of which 33 had complete records and underwent further analysis; 21 had documented bacteremia and 12 did not."
    explanation: >-
      Defines the curated human syndrome as culture-positive C. fetus infection
      and documents that bacteremia is common in confirmed disease.
infectious_agent:
- name: Campylobacter fetus
  infectious_agent_term:
    preferred_term: Campylobacter fetus
    term:
      id: NCBITaxon:196
      label: Campylobacter fetus
  description: >-
    Gram-negative microaerophilic zoonotic Campylobacter species whose
    paracrystalline S-layer proteins confer complement resistance and enable
    invasive human bloodstream and endovascular infection.
  has_subtypes:
  - name: Campylobacter fetus subsp. fetus
    classification: subspecies
    description: >-
      Predominant subspecies isolated in human invasive bloodstream and central
      nervous system infections.
    subtype_term:
      preferred_term: Campylobacter fetus subsp. fetus
      term:
        id: NCBITaxon:32019
        label: Campylobacter fetus subsp. fetus
    evidence:
    - reference: PMID:41241280
      reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Of 38 isolates, 24 were subspeciated: Cff was most frequent (18/24, 75 %), followed by C. fetus subsp. intestinalis and venerealis (2 each), and single isolates of jejuni and Spirillum serpens."
      explanation: Supports C. fetus subsp. fetus as the predominant human systemic-infection subspecies.
  - name: Campylobacter fetus subsp. venerealis
    classification: subspecies
    description: >-
      Bovine genital subspecies that causes reproductive disease in cattle and
      occasionally appears among reported human isolates.
    subtype_term:
      preferred_term: Campylobacter fetus subsp. venerealis
      term:
        id: NCBITaxon:32020
        label: Campylobacter fetus subsp. venerealis
    evidence:
    - reference: PMID:32867004
      reference_title: Genotyping and antibiotic resistance patterns of Campylobacter fetus subsp.venerealis from cattle farms in India.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: Bovine genital campylobacteriosis caused by Campylobacter fetus subsp. venerealis (Cfv) is of considerable economic importance to the cattle industry worldwide.
      explanation: Identifies C. fetus subsp. venerealis as the bovine genital disease subspecies.
    - reference: PMID:38133216
      reference_title: The History of Bovine Genital Campylobacteriosis in the Face of Political Turmoil and Structural Change in Cattle Farming in Germany.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: It is caused by Campylobacter fetus subsp. venerealis (Cfv), one of three subspecies of Campylobacter fetus. Bulls are the reservoir but BGC may also be spread by artificial insemination (AI).
      explanation: Supports Cfv as the bovine venereal lineage maintained in bulls.
  - name: Campylobacter fetus subsp. testudinum
    classification: subspecies
    description: >-
      Reptile-associated subspecies detected in chelonians and in invasive human
      bloodstream isolates.
    subtype_term:
      preferred_term: Campylobacter fetus subsp. testudinum
      term:
        id: NCBITaxon:1507806
        label: Campylobacter fetus subsp. testudinum
    evidence:
    - reference: PMID:31928704
      reference_title: Occurrence and diversity of Campylobacter species in captive chelonians.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Out of 452 samples, five (1.1%) tested positive: three for C. iguaniorum (two Testudo graeca and one Testudo hermanni), one for C. fetus subsp. testudinum (Stigmochelys pardalis) and one for C. geochelonis (Testudo hermanni)."
      explanation: Supports chelonians as a documented C. fetus subsp. testudinum host context.
    - reference: PMID:40484837
      reference_title: "[Genomic characteristics of sequence type 80 of Campylobacter fetus subsp. testudinum from bacteremia]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: To analyze the genomic characteristics of Campylobacter fetus subsp. testudinum (Cft) sequence type (ST) 80 from bacteremia patient.
      explanation: Supports C. fetus subsp. testudinum as a reported human bloodstream-infection subspecies.
  evidence:
  - reference: PMID:9851986
    reference_title: Campylobacter fetus surface layer proteins are transported by a type I secretion system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The virulence of Campylobacter fetus, a bacterial pathogen of ungulates and humans, is mediated in part by the presence of a paracrystalline surface layer (S-layer) that confers serum resistance."
    explanation: Identifies C. fetus as a pathogen of ungulates and humans whose paracrystalline S-layer mediates serum resistance.
agent_life_cycle:
  description: >-
    C. fetus is maintained in ungulate intestinal and genital reservoirs (cattle
    and sheep), with subspecies-specific adaptation to bovine venereal
    transmission and a distinct reptile-associated lineage in chelonians.
  hosts:
  - preferred_term: cattle
    term:
      id: NCBITaxon:9913
      label: Bos taurus
    role: reservoir host
  - preferred_term: sheep
    term:
      id: NCBITaxon:9940
      label: Ovis aries
    role: reservoir host
  - preferred_term: chelonians
    term:
      id: NCBITaxon:8459
      label: Testudines
    role: rare reptile host
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: Campylobacter fetus is a recognized pathogen of cattle and sheep, though human infection has also been reported.
    explanation: Supports cattle and sheep as established animal reservoir hosts for C. fetus.
  - reference: PMID:31928704
    reference_title: Occurrence and diversity of Campylobacter species in captive chelonians.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study suggests that Campylobacter spp. are not common in chelonians, but a variety of species can be detected in these hosts, including those potentially pathogenic for humans."
    explanation: Supports chelonians as a reptile host context for Campylobacter species including C. fetus subsp. testudinum.
transmission:
- name: Foodborne or waterborne zoonotic exposure
  description: >-
    Human C. fetus infection follows oral ingestion of contaminated food or
    water or direct contact with ungulate or reptile animal reservoirs, though
    many immunocompromised patients have no recalled exposure.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Ingestion of contaminated food or water is a proposed route of transmission for both humans and animals.
    explanation: Supports foodborne or waterborne ingestion as a proposed transmission route into humans.
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Exposure risks were reported in 43 %, though absent in 54 %."
    explanation: Documents recognized epidemiological exposure risks in nearly half of adult invasive cases while noting frequent occult exposure.
environmental:
- name: Contaminated foodborne or waterborne exposure
  description: >-
    Oral ingestion of food (such as unpasteurized dairy or undercooked meat) or
    water contaminated with Campylobacter fetus introduces the pathogen into the
    gastrointestinal tract.
  presence: Positive
  disease_effect: TRIGGERS
  exposure_term:
    preferred_term: Contaminated foodborne or waterborne exposure
    term:
      id: ECTO:9002126
      label: exposure to environmental food contaminant
  influences_mechanisms:
  - target: Animal-reservoir exposure to Campylobacter fetus
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Ingestion of C. fetus-contaminated food or water delivers viable bacteria to the intestinal lumen.
    evidence:
    - reference: PMID:20600794
      reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: Ingestion of contaminated food or water is a proposed route of transmission for both humans and animals.
      explanation: Supports ingestion of contaminated food or water as an initiating environmental exposure route.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Ingestion of contaminated food or water is a proposed route of transmission for both humans and animals.
    explanation: Establishes contaminated food or water ingestion as an environmental trigger of C. fetus infection.
- name: Zoonotic ungulate or reptile reservoir contact
  description: >-
    Direct or indirect exposure to colonized livestock (cattle, sheep) or
    chelonian reptile reservoirs (such as pet or foodborne turtles for C. fetus
    subsp. testudinum) facilitates zoonotic spillover into susceptible human
    hosts.
  presence: Positive
  disease_effect: TRIGGERS
  exposure_term:
    preferred_term: Zoonotic livestock or reptile host contact
    term:
      id: ECTO:3000000
      label: exposure to organism
  influences_mechanisms:
  - target: Animal-reservoir exposure to Campylobacter fetus
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Contact with or consumption from colonized ungulate or chelonian hosts transmits C. fetus across the zoonotic interface.
    evidence:
    - reference: PMID:40484837
      reference_title: "[Genomic characteristics of sequence type 80 of Campylobacter fetus subsp. testudinum from bacteremia]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Soft-shelled turtles may be a potential new host of Cft infection or a vector of foodborne invasive cases due to their biological characteristics of fusion recombinant.
      explanation: Links chelonian reservoir/vector exposure to invasive human C. fetus subsp. testudinum infection.
  evidence:
  - reference: PMID:40484837
    reference_title: "[Genomic characteristics of sequence type 80 of Campylobacter fetus subsp. testudinum from bacteremia]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Soft-shelled turtles may be a potential new host of Cft infection or a vector of foodborne invasive cases due to their biological characteristics of fusion recombinant.
    explanation: Documents chelonian host/foodborne vector exposure in invasive human C. fetus subsp. testudinum bacteremia and aortic infection.
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Exposure risks were reported in 43 %, though absent in 54 %."
    explanation: Quantifies documented epidemiological exposure histories in adult invasive C. fetus disease.
pathophysiology:
- name: Animal-reservoir exposure to Campylobacter fetus
  description: >-
    Human infection begins after oral ingestion of C. fetus via contaminated
    food or water or contact with colonized livestock or reptile reservoirs,
    delivering viable bacteria to the gastrointestinal lumen.
  role: trigger
  biological_scale: ORGANISM
  node_class: INFECTIOUS_AGENT
  locations:
  - preferred_term: Intestine
    term:
      id: UBERON:0000160
      label: intestine
  downstream:
  - target: Fibronectin-enhanced mucosal adhesion
    description: >-
      Luminal C. fetus reaches intestinal mucosal surfaces where fibronectin
      binding promotes attachment to extracellular matrix and epithelial cells.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Ingestion of contaminated food or water is a proposed route of transmission for both humans and animals.
    explanation: Supports ingestion-mediated reservoir exposure as the entry step into the gastrointestinal tract.
- name: Fibronectin-enhanced mucosal adhesion
  description: >-
    C. fetus binds immobilized fibronectin and utilizes soluble fibronectin to
    enhance attachment to extracellular matrix components and intestinal
    epithelial cells, establishing intimate mucosal colonization.
  biological_scale: CELLULAR
  node_class: PATHOGEN_SPREAD_AND_TISSUE_INVASION
  cell_types:
  - preferred_term: Intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  locations:
  - preferred_term: Intestinal epithelium
    term:
      id: UBERON:0001277
      label: intestinal epithelium
  biological_processes:
  - preferred_term: Symbiont adhesion to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
    modifier: INCREASED
  - preferred_term: Cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: INCREASED
  downstream:
  - target: Transcellular epithelial translocation
    description: Fibronectin-mediated epithelial adhesion positions bacteria for transcellular invasion and basolateral egress.
  evidence:
  - reference: PMID:18388970
    reference_title: Fibronectin enhances Campylobacter fetus interaction with extracellular matrix components and INT 407 cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, this data suggests that C. fetus can bind to immobilized fibronectin and use soluble fibronectin to enhance attachment to other ECM components and intestinal epithelial cells."
    explanation: Demonstrates fibronectin-enhanced C. fetus attachment to extracellular matrix and human intestinal epithelial cells.
- name: Transcellular epithelial translocation
  description: >-
    C. fetus traverses polarized intestinal epithelial monolayers via a
    tubulin-cytoskeleton-dependent transcellular invasion and egress pathway
    without disrupting tight-junction monolayer integrity, granting access to
    submucosal vasculature.
  biological_scale: CELLULAR
  node_class: PATHOGEN_SPREAD_AND_TISSUE_INVASION
  cell_types:
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  locations:
  - preferred_term: Intestinal epithelium
    term:
      id: UBERON:0001277
      label: intestinal epithelium
  biological_processes:
  - preferred_term: Symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
    modifier: INCREASED
  downstream:
  - target: S-layer-mediated serum resistance
    description: Epithelial traversal delivers C. fetus into the submucosal microcirculation and bloodstream, where S-layer proteins prevent complement lysis.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, translocation without disrupting monolayer integrity, invasion and egression from Caco-2 cells, electron microscopy observations and the requirement of a functional tubulin cytoskeleton for translocation, support a transcellular mechanism of C. fetus translocation across Caco-2 cell monolayers."
    explanation: Establishes transcellular microtubule-dependent traversal of human enterocyte monolayers without paracellular barrier disruption.
- name: S-layer-mediated serum resistance
  description: >-
    Type I-secreted paracrystalline surface-layer (S-layer) proteins attached
    serospecifically to type A or B C. fetus lipopolysaccharide form a surface
    capsule that blocks C3b binding and complement-mediated bactericidal
    activity in blood.
  biological_scale: MOLECULAR
  node_class: IMMUNE_EVASION_AND_IMMUNOSUPPRESSIVE_MICROENVIRONMENT
  locations:
  - preferred_term: Blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: Symbiont evasion of host innate immune response
    term:
      id: GO:0141043
      label: symbiont-mediated evasion of host innate immune response
    modifier: INCREASED
  - preferred_term: Complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: DECREASED
  downstream:
  - target: Sustained Campylobacter fetus bacteremia
    description: Complement-resistant S-layer-positive organisms survive intravascular clearance and sustain high-grade bacteremia.
    evidence:
    - reference: PMID:2318963
      reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: High-grade bacteremia in HA/ICR mice occurred after oral challenge with S-plus C. fetus strains and continued for at least 2 d, but was not present in any mice challenged with S-minus strains.
      explanation: Demonstrates in vivo that S-layer expression is required for sustained bacteremia after oral challenge.
  - target: S-layer sapA antigenic variation
    description: Intravascular survival of S-layer-bearing C. fetus populations enables ongoing sapA recombination and selection of novel surface-protein variants under adaptive immune pressure.
  evidence:
  - reference: PMID:7885229
    reference_title: High-frequency S-layer protein variation in Campylobacter fetus revealed by sapA mutagenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: Campylobacter fetus utilizes paracrystalline surface (S-) layer proteins that confer complement resistance and that undergo antigenic variation to facilitate persistent mucosal colonization in ungulates.
    explanation: Establishes S-layer-mediated complement resistance.
  - reference: PMID:9851986
    reference_title: Campylobacter fetus surface layer proteins are transported by a type I secretion system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The subunits of the S-layer are S-layer proteins (SLPs) that are secreted in the absence of an N-terminal signal sequence and attach to either type A or B C. fetus lipopolysaccharide in a serospecific manner.
    explanation: Defines Type I secretion and serospecific LPS attachment of S-layer subunits on the bacterial surface.
- name: S-layer sapA antigenic variation
  description: >-
    Reciprocal DNA recombination among multiple chromosomal sapA homologues
    switches expressed full-length S-layer protein isoforms (e.g., 98, 127, or
    149 kDa) at high frequency while preserving complement resistance, allowing
    C. fetus to evade adaptive opsonic antibodies and sustain or relapse
    systemic infection.
  biological_scale: MOLECULAR
  node_class: IMMUNE_EVASION_AND_IMMUNOSUPPRESSIVE_MICROENVIRONMENT
  locations:
  - preferred_term: Blood
    term:
      id: UBERON:0000178
      label: blood
  biological_processes:
  - preferred_term: Antigenic variation
    term:
      id: GO:0020033
      label: antigenic variation
    modifier: INCREASED
  - preferred_term: DNA recombination
    term:
      id: GO:0006310
      label: DNA recombination
    modifier: INCREASED
  - preferred_term: Symbiont evasion of host immune response
    term:
      id: GO:0042783
      label: symbiont-mediated evasion of host immune response
    modifier: INCREASED
  downstream:
  - target: Sustained Campylobacter fetus bacteremia
    description: High-frequency switching among serum-resistant sapA S-layer isoforms evades opsonic antibody clearance and promotes persistent or relapsing bacteremia.
  evidence:
  - reference: PMID:7885229
    reference_title: High-frequency S-layer protein variation in Campylobacter fetus revealed by sapA mutagenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Southern hybridizations of the revertants showed rearrangement of sapA homologues and retention of the km marker. These results indicate that there exists high-frequency generation of C. fetus sapA antigenic variants, and that intracellular mechanisms acting at the level of DNA reciprocal recombination play key roles in this phenomenon."
    explanation: Demonstrates high-frequency generation of sapA antigenic variants via reciprocal DNA recombination among chromosomal sapA homologues.
  - reference: PMID:7885229
    reference_title: High-frequency S-layer protein variation in Campylobacter fetus revealed by sapA mutagenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblots of survivors showed that phenotypic reversion involving high-level production of full-length (98, 127 or 149 kDa) S-layer proteins had occurred."
    explanation: Shows serum-selected switching to alternative full-length 98, 127, or 149 kDa S-layer isoforms that retain serum survival.
- name: Sustained Campylobacter fetus bacteremia
  description: >-
    Serum-resistant C. fetus persists in the systemic circulation, particularly
    in elderly or immunocompromised hosts, triggering systemic febrile
    inflammation and sepsis while enabling hematogenous dissemination.
  biological_scale: ORGANISM
  node_class: SYSTEMIC_INFLAMMATORY_STATE

    snippet: "C. jejuni and Campylobacter coli were associated with gastrointestinal signs, and C. fetus was associated with secondary localizations. Among the 80 patients (13.5%) with secondary localizations, 12 had endocarditis, 38 vascular, 24 osteoarticular, and 9 ascitic fluid infections."
    explanation: Quantifies the endocardial, vascular, osteoarticular, and ascitic secondary localizations characteristic of C. fetus bacteremia.

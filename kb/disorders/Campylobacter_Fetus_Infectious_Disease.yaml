  downstream:
  - target: Bacteremia
    description: Intravascular bacterial persistence directly manifests as culture-positive bacteremia.
  - target: Fever
    description: Bloodstream infection elicits a systemic pyrogenic cytokine response manifesting as acute or relapsing fever.
  - target: Sepsis
    description: Uncontrolled bloodstream proliferation can progress to sepsis and septic shock.
  - target: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
    description: Sustained bacteremia seeds damaged vascular endothelium and distant extraintestinal organs.
    evidence:

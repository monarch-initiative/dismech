    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 991 patients with isolated Campylobacter spp. strains, we identified 39 (4%) with culture-positive C. fetus infections, of which 33 had complete records and underwent further analysis; 21 had documented bacteremia and 12 did not."
    explanation: Documented bacteremia occurred in 21 of 33 (64%) analyzed culture-positive C. fetus infections.
- name: Sepsis
  category: Constitutional
  description: Severe systemic infection and septic shock complicating invasive C. fetus bacteremia or aneurysm rupture, strongly associated with 30-day mortality.

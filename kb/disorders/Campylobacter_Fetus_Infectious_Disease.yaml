    snippet: "The main clinical features were fever with (62% of cases) or without (38%) extra-intestinal symptoms."
    explanation: Fever was present across the 21-patient C. fetus bloodstream infection cohort (62% with and 38% without extraintestinal symptoms).
- name: Bacteremia
  category: Hematological
  diagnostic: true
  frequency: FREQUENT

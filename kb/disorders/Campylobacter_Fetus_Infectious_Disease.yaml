  - target: Cellulitis
    description: Cutaneous microvascular seeding produces deep skin and soft-tissue cellulitis.
  - target: Aortic aneurysm
    description: Infection of atherosclerotic abdominal aortic wall causes destructive mycotic aortic aneurysm.
  - target: Septic arthritis
    description: Synovial seeding produces purulent septic arthritis.
  - target: Peritonitis
    description: Peritoneal and ascitic fluid seeding causes spontaneous or secondary bacterial peritonitis, particularly in cirrhotic hosts.
  - target: Neonatal sepsis
    description: Transplacental invasion during maternal bacteremia causes chorioamnionitis and early-onset neonatal sepsis.
  - target: Stillbirth
    description: Feto-placental seeding during maternal C. fetus bacteremia causes intrauterine fetal demise, spontaneous abortion, or stillbirth.
  - target: Premature birth
    description: Uteroplacental C. fetus infection precipitates preterm labor and premature delivery at 13-32 weeks of gestation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant risk factors associated with death within 30 days were dyspnea, quick sequential organ failure assessment score >2 at admission, and septic shock."
    explanation: Identifies septic shock and acute organ dysfunction as major clinical predictors of 30-day mortality in invasive C. fetus infection.
- name: Aortic aneurysm

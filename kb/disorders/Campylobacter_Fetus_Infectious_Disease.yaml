diagnosis:
- name: Blood and Cerebrospinal Fluid Microbial Culture
  description: >-
    Microbiological isolation of C. fetus from blood cultures (which often turn
    positive earlier than focal cultures) and sterile-site specimens such as
    cerebrospinal, synovial, or ascitic fluid establishes definitive diagnosis.
  diagnosis_term:
    preferred_term: Blood and CSF bacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both blood and CSF cultures are essential, with blood cultures often positive earlier."
    explanation: Confirms blood and cerebrospinal fluid microbial culture as essential diagnostic procedures for invasive C. fetus infection.
- name: Species Confirmation and Antimicrobial Susceptibility Testing
  description: >-
    Species-level identification by 16S rRNA gene sequencing or multiplex PCR
    (targeting cadF, hipO, and asp), supported phenotypically by negative
    hippurate hydrolysis (unlike hippurate-positive C. jejuni) and negative H2S
    production on Triple Sugar Iron agar, distinguishes C. fetus from other
    Campylobacter species, while minimum inhibitory concentration testing
    detects resistance to fluoroquinolones and third-generation cephalosporins.
  diagnosis_term:
    preferred_term: Antimicrobial susceptibility testing
    term:
      id: NCIT:C85540
      label: Microbial Susceptibility Test
  evidence:
  - reference: PMID:22771419
    reference_title: "Bacteremia caused by antimicrobial resistant Campylobacter species at a medical center in Taiwan, 1998-2008."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All isolates from the 24 patients were confirmed to the species level by multiplex PCR (cadF, hipO and asp gene) and 16S RNA gene sequencing."
    explanation: Documents molecular species-level confirmation of bloodstream Campylobacter isolates alongside MIC susceptibility testing.
  - reference: PMID:3175020
    reference_title: Identification of campylobacters from bovine and ovine faeces.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hippurate hydrolisis was used to differentiate C. jejuni (positive) from all the other Campylobacter spp (negative). The production of hydrogen sulphide in Triple Sugar Iron was used to separate C. hyointestinalis and the C. fecalis - C. sputorum subsp. bubulus group (positive) from C. fetus (negative)."
    explanation: Establishes negative hippurate hydrolysis and negative Triple Sugar Iron H2S production as classic phenotypic discriminators of C. fetus from C. jejuni and C. hyointestinalis.
- name: Echocardiography for Endovascular Involvement
  description: >-
    Transthoracic or transesophageal echocardiography evaluates suspected native
    or prosthetic valve endocarditis and ascending endoaortitis in patients with
    sustained C. fetus bacteremia.
  diagnosis_term:
    preferred_term: Echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:7771897
    reference_title: "[Campylobacter fetus subspecies fetus endoaortitis on a Bentall tube prosthesis. Apropos of a case]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was confirmed by positive blood cultures and transoesophageal echocardiography."
    explanation: Demonstrates transesophageal echocardiography combined with blood cultures to diagnose C. fetus prosthetic endoaortitis/endocarditis.
treatments:
- name: Carbapenem therapy for severe invasive infection
  description: >-
    Parenteral carbapenem therapy (imipenem or meropenem) is the preferred
    first-line regimen for severe invasive, endovascular, or central nervous
    system C. fetus infections.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: imipenem
      term:
        id: CHEBI:471744
        label: imipenem
    - preferred_term: meropenem
      term:
        id: CHEBI:43968
        label: meropenem
  target_mechanisms:
  - target: Sustained Campylobacter fetus bacteremia
    treatment_effect: INHIBITS
    description: Bactericidal beta-lactam cell-wall synthesis inhibition clears serum-resistant C. fetus bloodstream infection.
    evidence:
    - reference: PMID:17999095
      reference_title: "Campylobacter fetus bloodstream infection: risk factors and clinical features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All patients initially treated with imipenem had a favourable outcome.
      explanation: Demonstrates clinical clearance of C. fetus bloodstream infection with initial imipenem therapy.
  - target: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
    treatment_effect: INHIBITS
    description: Meropenem and imipenem achieve bactericidal activity in meningeal and endovascular foci of disseminated C. fetus infection.
    evidence:
    - reference: PMID:41241280
      reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Therapy was changed from cefmetazole to meropenem and vancomycin, then de-escalated to high-dose ampicillin. After 23 days of antibiotics, he fully recovered without sequelae."
      explanation: Supports meropenem followed by high-dose ampicillin for CNS-seeded C. fetus meningitis and bacteremia.
  evidence:
  - reference: PMID:17999095
    reference_title: "Campylobacter fetus bloodstream infection: risk factors and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients initially treated with imipenem had a favourable outcome.
    explanation: Supports imipenem as highly active therapy in C. fetus bloodstream infection.
  - reference: PMID:41241280
    reference_title: "Campylobacter fetus meningitis and bacteremia: A case report in a post-liver transplant and post-splenectomy patient and a restructured literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy was changed from cefmetazole to meropenem and vancomycin, then de-escalated to high-dose ampicillin."
    explanation: Supports meropenem use in C. fetus meningitis and bacteremia.

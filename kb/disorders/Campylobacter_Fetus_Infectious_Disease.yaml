  evidence:
  - reference: PMID:3523697
    reference_title: Abortion and perinatal sepsis associated with campylobacter infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As reported herein, one case of premature labor and neonatal sepsis due to Campylobacter fetus subspecies fetus was treated successfully with ampicillin and gentamicin.
    explanation: Supports ampicillin plus gentamicin as an effective regimen for perinatal C. fetus infection.
- name: Resistance-guided antimicrobial selection
  description: >-
    Definitive antimicrobial selection guided by susceptibility testing avoids
    empiric third-generation cephalosporin or fluoroquinolone monotherapy, to
    which bloodstream Campylobacter isolates frequently exhibit elevated MICs or
    on-therapy resistance acquisition.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Sustained Campylobacter fetus bacteremia
    treatment_effect: INHIBITS
    description: Selecting active parenteral agents based on susceptibility testing prevents treatment failure and bacteremic relapse.
    evidence:
    - reference: PMID:34849656
      reference_title: "Retrospective Multicentric Study on Campylobacter spp. Bacteremia in France: The Campylobacteremia Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 30-day mortality rate was 11.7%, and an appropriate antibiotic treatment was independently associated with 30-day survival (odds ratio, 0.47 [95% confidence interval, .24-.93]; P = .03)."
      explanation: Demonstrates that appropriate susceptibility-matched antibiotic therapy independently improves 30-day survival in Campylobacter bacteremia.
  evidence:
  - reference: PMID:22771419
    reference_title: "Bacteremia caused by antimicrobial resistant Campylobacter species at a medical center in Taiwan, 1998-2008."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the isolates were resistant to third-generation cephalosporins and quinolones, with minimum inhibitory concentration (MIC(90)) values of 32 mg/L for cefotaxime, 128 mg/L for ceftriaxone, and 32 mg/L for both ciprofloxacin and levofloxacin."
    explanation: Supports avoiding unverified third-generation cephalosporin or fluoroquinolone monotherapy for invasive Campylobacter bacteremia.
  - reference: PMID:9534967
    reference_title: Development of quinolone-resistant Campylobacter fetus bacteremia in human immunodeficiency virus-infected patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapsing C. fetus infections in quinolone-treated HIV-infected patients may be associated with the acquisition of resistance to these agents, and this resistance may be multifactorial.
    explanation: Supports acquired quinolone resistance as a driver of relapsing C. fetus bacteremia.
- name: Surgical source control for endovascular infection
  description: >-
    Surgical source control — including aortic resection/graft replacement and
    branch artery reconstruction or prosthetic valve/tube surgery alongside
    prolonged parenteral antibiotics — is employed for mycotic aortic aneurysm,
    infected aortic dissection, and prosthetic endoaortitis, although outcomes
    in ruptured intracardiac prosthetic infections remain frequently fatal.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Endovascular or prosthetic surgical source control
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Secondary vascular, CNS, skin, osteoarticular, and perinatal seeding
    treatment_effect: INHIBITS
    description: Surgical resection and reconstruction remove infected aortic wall or prosthetic endovascular foci that cannot be sterilized by antibiotics alone.
    evidence:
    - reference: PMID:40484837
      reference_title: "[Genomic characteristics of sequence type 80 of Campylobacter fetus subsp. testudinum from bacteremia]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The patient was treated with piperacillin/tazobactam sodium combined with doxycycline and azithromycin for 20 d and discharged after thoracoabdominal aortic replacement and branch artery reconstruction.
      explanation: Demonstrates clinical cure and hospital discharge after combined antimicrobial therapy and thoracoabdominal aortic replacement for C. fetus aortic infection.
  evidence:
  - reference: PMID:40484837
    reference_title: "[Genomic characteristics of sequence type 80 of Campylobacter fetus subsp. testudinum from bacteremia]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient was treated with piperacillin/tazobactam sodium combined with doxycycline and azithromycin for 20 d and discharged after thoracoabdominal aortic replacement and branch artery reconstruction.
    explanation: Supports surgical aortic replacement and branch reconstruction combined with parenteral antimicrobials for C. fetus endovascular aortic infection.
  - reference: PMID:7771897
    reference_title: "[Campylobacter fetus subspecies fetus endoaortitis on a Bentall tube prosthesis. Apropos of a case]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The outcome was rapidly fatal despite antibiotic therapy and surgery, because of the seriousness of the lesions (pseudo-aneurysm of the aorta ruptured into the right atrium), the precarity of the terrain and surgical difficulties."
    explanation: Documents surgical intervention alongside antibiotics in prosthetic C. fetus endoaortitis while highlighting high perioperative lethality after pseudoaneurysm rupture.
animal_models:
- name: Ferric chloride-pretreated HA/ICR mouse Campylobacter fetus challenge model
  species: Mouse
  genotype: Outbred HA/ICR (with C3H/HeN LPSn vs C3H/HeJ LPSd inbred comparison); S-plus (84-32) vs spontaneous S-minus (84-54) C. fetus challenge
  background: HA/ICR pretreated with ferric chloride
  publication: PMID:2318963
  description: >-
    Adult HA/ICR mice pretreated with ferric chloride and challenged orally or
    systemically with isogenic S-layer-positive (84-32) versus spontaneous
    S-layer-negative (84-54) C. fetus strains establish the in vivo causal role
    of the paracrystalline S-layer capsule in intravascular survival, sustained
    bacteremia, and lethality, while C3H/HeN versus C3H/HeJ comparisons show
    host LPS responsiveness modulates mortality.
  modeled_mechanisms:
  - target: S-layer-mediated serum resistance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Demonstrates that surface-bound S-layer expression lowers the murine LD50
      43.3-fold relative to an S-minus mutant and that anti-S-protein antiserum
      reduces 30-minute bacteremia 51.6-fold, proving surface S-layer-mediated
      protection against intravascular clearance.
    limitations: >-
      Requires ferric chloride iron-overload pretreatment to render adult
      HA/ICR mice susceptible to lethal challenge and does not reproduce human
      endovascular tropism (mycotic aortic aneurysm, endocarditis) or focal
      metastatic seeding.
    readouts:
    - name: Lethal dose 50 (LD50) of S-plus strain 84-32 versus S-minus mutant 84-54
      target: S-layer-mediated serum resistance
      direction: DECREASED
      interpretation: >-
        A 43.3-fold lower LD50 for S-plus strain 84-32 relative to spontaneous
        S-minus mutant 84-54 establishes markedly higher in vivo virulence when
        the surface S-layer capsule is present.
      evidence:
      - reference: PMID:2318963
        reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In adult HA/ICR mice pretreated with ferric chloride, the LD50 for S-plus strain 84-32 was 43.3 times lower than its spontaneous S-minus mutant 84-54."
        explanation: Quantifies the 43.3-fold virulence enhancement conferred by S-layer expression in ferric chloride-pretreated mice.
    - name: Early (30-minute) bacteremia after anti-S-protein rabbit antiserum pretreatment
      target: S-layer-mediated serum resistance
      direction: DECREASED
      interpretation: >-
        Passive immunization with antiserum against purified S-protein lowers
        30-minute bacteremia 51.6-fold compared with normal rabbit serum,
        confirming that targeting the S-layer restores intravascular bacterial
        clearance.
      evidence:
      - reference: PMID:2318963
        reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Bacteremia at 30 min after challenge was 51.6-fold lower in mice pretreated with 10 microliters of rabbit antiserum to purified S-protein than after pretreatment with normal rabbit serum.
        explanation: Shows 51.6-fold reduction of early bacteremia upon antibody blockade of the S-layer protein.
    evidence:
    - reference: PMID:2318963
      reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings in a mouse model point toward the central role of the S-protein in the pathogenesis of C. fetus infection. The S-protein is not toxic per se, but enhances virulence when present on the bacterial cell surface as a capsule."
      explanation: Establishes that S-protein enhances C. fetus virulence specifically as a surface capsule rather than a direct toxin.
  - target: Sustained Campylobacter fetus bacteremia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Oral challenge with S-plus C. fetus produces high-grade bacteremia
      persisting for at least 2 days (absent with S-minus challenge), while
      systemic challenge in LPS-responsive C3H/HeN versus LPS-defective C3H/HeJ
      mice demonstrates host endotoxin-response contribution to bacteremic
      mortality (90% vs 40%).
    limitations: >-
      Requires ferric chloride pretreatment for lethal susceptibility and
      captures acute 2-day bacteremia and endotoxin-modulated mortality without
      reproducing chronic human endovascular aneurysm, meningeal, or placental
      seeding.
    readouts:
    - name: High-grade bacteremia (>=2 days) after oral S-plus versus S-minus challenge
      target: Sustained Campylobacter fetus bacteremia
      direction: INCREASED
      interpretation: >-
        Sustained (>=2 d) high-grade bacteremia after oral challenge occurs
        exclusively with S-plus strains and in zero mice challenged with S-minus
        mutants.
      evidence:
      - reference: PMID:2318963
        reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: High-grade bacteremia in HA/ICR mice occurred after oral challenge with S-plus C. fetus strains and continued for at least 2 d, but was not present in any mice challenged with S-minus strains.
        explanation: Demonstrates S-layer dependence of sustained oral-to-bloodstream C. fetus bacteremia in mice.
    - name: Mortality in LPS-responsive C3H/HeN versus LPS-defective C3H/HeJ mice
      target: Sustained Campylobacter fetus bacteremia
      direction: INCREASED
      interpretation: >-
        Higher mortality in LPS-responsive C3H/HeN (90%) than LPS-defective
        C3H/HeJ (40%) mice shows host innate LPS responsiveness amplifies
        lethal sepsis during S-plus bacteremia.
      evidence:
      - reference: PMID:2318963
        reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast to the findings with Salmonella typhimurium by others, 3 X 10(7) CFU of strain 84-32 caused 90% mortality in C3H/HeN (LPSn) mice and 40% mortality in C3H/HeJ (LPSd) mice."
        explanation: Contrasts 90% versus 40% mortality between LPS-responsive and LPS-hyporesponsive inbred mouse strains.
    evidence:
    - reference: PMID:2318963
      reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: High-grade bacteremia in HA/ICR mice occurred after oral challenge with S-plus C. fetus strains and continued for at least 2 d, but was not present in any mice challenged with S-minus strains.
      explanation: Confirms recapitulation of sustained S-plus C. fetus bacteremia after oral challenge.
  evidence:
  - reference: PMID:2318963
    reference_title: Pathogenesis of Campylobacter fetus infections. Role of surface array proteins in virulence in a mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We developed a mouse model to compare the virulence of Campylobacter fetus strains with (S-plus) and without (S-minus) surface array protein (S-protein) capsules.
    explanation: Primary description of the HA/ICR mouse virulence model comparing S-plus and S-minus C. fetus strains.
experimental_models:
- name: Polarized human Caco-2 intestinal epithelial monolayer
  experimental_model_type: CELL_LINE
  cell_source: Immortalized human colorectal adenocarcinoma enterocyte-like cell line (Caco-2)
  culture_system: Polarized monolayer cultured on porous membrane transwell supports
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: Intestinal epithelium
    term:
      id: UBERON:0001277
      label: intestinal epithelium
  cell_types:
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  publication: PMID:20600794
  description: >-
    Polarized human Caco-2 monolayers grown on porous transwell membranes model
    bidirectional apical-to-basolateral and basolateral-to-apical C. fetus
    epithelial traversal, invasion, and egress without tight-junction barrier
    disruption.
  modeled_mechanisms:
  - target: Transcellular epithelial translocation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Demonstrates S-layer-independent, tubulin-cytoskeleton-dependent
      transcellular traversal of polarized human enterocyte monolayers with
      intact transepithelial electrical resistance and no paracellular
      FITC-inulin flux.
    limitations: >-
      Immortalized adenocarcinoma monolayer lacks lamina propria immune cells,
      mucus-secreting goblet cells, and submucosal vascular endothelium.
    readouts:
    - name: Bidirectional transcellular bacterial translocation after colchicine or vinblastine tubulin disruption
      target: Transcellular epithelial translocation
      direction: DECREASED
      interpretation: >-
        Inhibition of monolayer translocation by colchicine and vinblastine
        without tight-junction permeability loss establishes a microtubule-dependent
        transcellular traversal route.
      evidence:
      - reference: PMID:20600794
        reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Tubulin cytoskeleton disrupting agents, colchicine and vinblastine, did inhibit C. fetus translocation though entry into Caco-2 cells remained unaffected."
        explanation: Demonstrates requirement of an intact tubulin cytoskeleton for transcellular C. fetus translocation across Caco-2 monolayers.
    evidence:
    - reference: PMID:20600794
      reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Together, translocation without disrupting monolayer integrity, invasion and egression from Caco-2 cells, electron microscopy observations and the requirement of a functional tubulin cytoskeleton for translocation, support a transcellular mechanism of C. fetus translocation across Caco-2 cell monolayers."
      explanation: Establishes Caco-2 transwell monolayers as the experimental model defining transcellular C. fetus epithelial translocation.
  evidence:
  - reference: PMID:20600794
    reference_title: Campylobacter fetus translocation across Caco-2 cell monolayers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "To determine how C. fetus disseminates from the intestine, Caco-2 cells cultured on porous membrane supports, were used as model intestinal epithelial cell monolayers."
    explanation: Identifies porous-membrane Caco-2 monolayers as the in vitro human intestinal barrier model for C. fetus dissemination.
- name: Human INT 407 epithelial cell and ECM fibronectin-adhesion system
  experimental_model_type: CELL_LINE
  cell_source: Immortalized human epithelial cell line (INT 407) with solid-phase ECM assays
  culture_system: Monolayer adherence and immobilized/soluble extracellular matrix binding assays
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  tissue_term:
    preferred_term: Intestinal epithelium
    term:
      id: UBERON:0001277
      label: intestinal epithelium
  cell_types:
  - preferred_term: Intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  publication: PMID:18388970
  description: >-
    Human INT 407 epithelial adherence assays paired with solid-phase
    extracellular matrix binding assays dissect S-layer- and integrin
    (RGD)-mediated fibronectin bridging during C. fetus mucosal attachment.
  modeled_mechanisms:
  - target: Fibronectin-enhanced mucosal adhesion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows that C. fetus binds immobilized fibronectin, uses soluble
      fibronectin to enhance attachment to INT 407 cells and ECM components,
      and requires host RGD-binding integrins for fibronectin-enhanced cellular
      adherence.
    limitations: >-
      Immortalized epithelial cell culture (INT 407 carries HeLa-derived
      contamination history) lacks native mucosal architecture, peristalsis,
      and luminal microbiota.
    readouts:
    - name: Soluble fibronectin-enhanced C. fetus adherence to INT 407 cells upon RGD peptide competition
      target: Fibronectin-enhanced mucosal adhesion
      direction: DECREASED
      interpretation: >-
        Inhibition of soluble-fibronectin-enhanced bacterial adherence by
        synthetic RGD peptides implicates host integrin receptors in fibronectin
        bridging.
      evidence:
      - reference: PMID:18388970
        reference_title: Fibronectin enhances Campylobacter fetus interaction with extracellular matrix components and INT 407 cells.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Soluble fibronectin also increased C. fetus adherence to INT 407 cells. This adherence was inhibited when INT 407 cells were incubated with synthetic peptides containing an RGD sequence, indicating that integrin receptors were involved in fibronectin-mediated attachment."
        explanation: Demonstrates soluble-fibronectin enhancement of INT 407 adherence and its blockade by RGD integrin-competing peptides.
    evidence:
    - reference: PMID:18388970
      reference_title: Fibronectin enhances Campylobacter fetus interaction with extracellular matrix components and INT 407 cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Together, this data suggests that C. fetus can bind to immobilized fibronectin and use soluble fibronectin to enhance attachment to other ECM components and intestinal epithelial cells."
      explanation: Confirms INT 407 and solid-phase ECM assays as the model system establishing fibronectin-enhanced C. fetus adhesion.
  evidence:
  - reference: PMID:18388970
    reference_title: Fibronectin enhances Campylobacter fetus interaction with extracellular matrix components and INT 407 cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, this data suggests that C. fetus can bind to immobilized fibronectin and use soluble fibronectin to enhance attachment to other ECM components and intestinal epithelial cells."
    explanation: Primary experimental evidence for fibronectin-enhanced C. fetus attachment in INT 407 and ECM assays.

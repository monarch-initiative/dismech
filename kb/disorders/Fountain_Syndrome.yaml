name: Fountain Syndrome
category: Mendelian
creation_date: "2026-07-30T00:00:00Z"
synonyms:
- Fountain's syndrome
- Deafness-skeletal dysplasia-coarse face with full lips syndrome
- Deafness-skeletal dysplasia-lip granuloma syndrome
- Mental retardation, sensorineural deafness, skeletal abnormalities, and coarse face with full lips
description: >-
  Fountain syndrome is an extremely rare, clinically defined autosomal recessive
  multisystem disorder first described by Fountain in 1974 and confirmed as a
  distinct entity by Fryns and colleagues in 1987. Its cardinal features are
  intellectual disability, congenital sensorineural deafness attributable to an
  anatomical inner-ear anomaly, skeletal abnormalities (broad, stubby hands and
  feet, hyperkyphosis, and short stature), and a characteristically coarse face
  with progressive swelling of the subcutaneous tissue of the cheeks and lips
  ("full lips"). Early-onset generalized seizures, macrocephaly (large head
  circumference), and distinctive behavioral features are important accessory
  findings, and the facial and connective-tissue features become more evident
  with advancing age. The molecular basis remains unknown; no causal gene has
  been established, and the diagnosis rests on the recognizable clinical gestalt
  in a child with affected siblings born to unaffected parents. It is a clinical
  diagnosis of exclusion, and modern workup uses exome/genome sequencing to
  exclude molecularly defined mimics (notably USP7-related Hao-Fountain syndrome
  and the ATP6V1B2-related DDOD/DOORS/Zimmermann-Laband spectrum).

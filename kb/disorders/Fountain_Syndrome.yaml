inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Fountain syndrome segregates as an autosomal recessive trait; the occurrence
    of affected siblings of both sexes born to unaffected parents supports
    recessive inheritance. The reported families were not documented as
    consanguineous. No causal gene has been identified.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      early-onset, generalized seizures can be added to the symptom complex of
      this autosomal recessive trait
    explanation: >-
      Fryns and colleagues classify Fountain syndrome as an autosomal recessive
      trait based on affected sibs born to unaffected parents.

pathophysiology:
- name: Unknown Molecular Etiology
  biological_scale: MOLECULAR
  description: >-
    Fountain syndrome remains a clinically defined syndrome with no established
    causal gene or molecular mechanism. It is inherited as an autosomal
    recessive trait, but the underlying gene has not been mapped or identified,
    and the pathogenesis of the connective-tissue and inner-ear features is not
    understood.
  downstream:
  - target: Inner-Ear Malformation and Sensorineural Deafness
    description: >-
      The unidentified recessive defect is presumed to disrupt inner-ear
      development, producing the anatomical inner-ear anomaly; the intervening
      molecular and developmental steps are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:3565469
      reference_title: >-
        Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        congenital deafness due to an anatomical inner ear anomaly, the same
        manifestations that were present in the 4 sibs reported by Fountain
      explanation: >-
        PARTIAL. Establishes that the inner-ear malformation recurs across
        independent sibships of the same recessive trait, which supports a
        shared inherited cause upstream of this node; the abstract asserts no
        molecular mechanism, so the causal intermediates remain unknown.
  - target: Subcutaneous Connective-Tissue Swelling of the Face
    description: >-
      The unidentified recessive defect is presumed to underlie the progressive
      facial and lip soft-tissue swelling; the intervening mechanism (e.g.,
      connective-tissue accumulation versus lymphedema) is unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:3565469
      reference_title: >-
        Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a peculiar "coarse" face with swelling of the subcutaneous tissue,
        particularly of cheeks and lips
      explanation: >-
        PARTIAL. Documents the facial soft-tissue swelling as a constituent
        manifestation of the same inherited trait, supporting a shared upstream
        cause; no mechanism linking the (unknown) genetic defect to the swelling
        is established.
  - target: Central Nervous System Developmental Dysfunction
    description: >-
      The unidentified recessive defect is presumed to disrupt CNS development
      and excitability, producing intellectual disability and early-onset
      seizures; the intervening molecular steps are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:3565469
      reference_title: >-
        Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        early-onset, generalized seizures can be added to the symptom complex of
        this autosomal recessive trait
      explanation: >-
        PARTIAL. Attributes the CNS manifestations to the autosomal recessive
        trait itself rather than to an acquired or secondary cause, supporting
        the edge from the unknown genetic defect; the intervening
        neurodevelopmental steps are not addressed.
  - target: Generalized Skeletal Dysplasia
    description: >-
      The unidentified recessive defect is presumed to disturb bone modeling and
      remodeling, producing the broad/short hands and feet, hyperkyphosis, and
      calvarial thickening; the intervening molecular steps are unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:3565469
      reference_title: >-
        Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        skeletal abnormalities with broad, stubby hands and feet and
        hyperkyphosis
      explanation: >-
        PARTIAL. Documents the skeletal dysplasia as part of the same recessive
        symptom complex, supporting a shared inherited cause upstream of this
        node; no bone-biology mechanism is demonstrated.
  notes: >-
    OMIM #229120 remains a phenotype-only entry with no linked HGNC gene, and
    the 1987 series noted normal chromosomes and an unrevealing biochemical and
    metabolic workup — i.e., the absence of an identified molecular cause is an
    argument from absence, not a positively evidenced negative. See the
    KNOWLEDGE_GAP discussion 'fountain_causal_gene_unknown'.
  evidence:
  - reference: PMID:8897038
    reference_title: >-
      Fountain syndrome: further delineation of the clinical syndrome and follow-up data.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an autosomal recessive entity with mental retardation, deafness, skeletal
      abnormalities and coarse face with full lips as cardinal features
    explanation: >-
      Establishes that Fountain syndrome is defined clinically as an autosomal
      recessive entity (the basis for modeling an unknown recessive molecular
      trigger upstream of the phenotypic domains).
- name: Inner-Ear Malformation and Sensorineural Deafness
  biological_scale: TISSUE
  description: >-
    Congenital deafness in Fountain syndrome is sensorineural and attributable
    to an anatomical anomaly of the inner ear, distinguishing it from
    conductive or purely neural hearing loss.
  evidence:
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      congenital deafness due to an anatomical inner ear anomaly
    explanation: >-
      The deafness is linked to a structural inner-ear malformation in affected
      individuals.
- name: Subcutaneous Connective-Tissue Swelling of the Face
  biological_scale: TISSUE
  description: >-
    The coarse facial appearance results from swelling of the subcutaneous
    tissue, particularly of the cheeks and lips, producing the characteristic
    full-lipped, coarse face that becomes more pronounced with age.
  evidence:
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a peculiar "coarse" face with swelling of the subcutaneous tissue,
      particularly of cheeks and lips
    explanation: >-
      The facial coarseness is explicitly attributed to subcutaneous tissue
      swelling of the cheeks and lips.
- name: Central Nervous System Developmental Dysfunction
  biological_scale: TISSUE
  description: >-
    The presumed developmental CNS involvement underlies the moderate-to-severe
    intellectual disability and the early-onset generalized seizures. No
    structural neuroimaging lesion is consistently reported, and the molecular
    substrate is unknown.
  evidence:
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      early-onset, generalized seizures can be added to the symptom complex
    explanation: >-
      Documents the CNS excitability component (early-onset generalized
      seizures) that, with intellectual disability, defines the CNS arm.
- name: Generalized Skeletal Dysplasia
  biological_scale: TISSUE
  description: >-
    A generalized skeletal dysplasia affecting bone modeling produces the broad,
    stubby hands and feet, hyperkyphosis, and (reported in several patients)
    calvarial thickening. No bone histopathology or radiographic-molecular
    correlation has been published.
  evidence:
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      skeletal abnormalities with broad, stubby hands and feet and hyperkyphosis
    explanation: >-
      Documents the skeletal dysplasia arm (broad stubby hands/feet and
      hyperkyphosis).


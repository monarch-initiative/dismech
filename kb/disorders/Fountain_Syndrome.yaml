    Management is supportive and symptomatic: hearing rehabilitation for
    sensorineural deafness, antiepileptic treatment for seizures, and
    developmental and educational support for intellectual disability. No
    disease-modifying therapy exists because the molecular basis is unknown.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care

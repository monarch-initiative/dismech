progression:
- phase: Congenital and infantile presentation
  age_range: Birth to early childhood
  notes: >-
    Deafness is congenital and attributable to a structural inner-ear anomaly,
    and the generalized seizures are early-onset, so the neurologic and auditory
    arms of the syndrome are manifest from infancy. Intellectual disability is
    apparent as developmental delay in the same period.
  evidence:
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      congenital deafness due to an anatomical inner ear anomaly
    explanation: >-
      Establishes the deafness as congenital, fixing the earliest phase of the
      natural history.
  - reference: PMID:3565469
    reference_title: >-
      Mental retardation, deafness, skeletal abnormalities, and coarse face with full lips: confirmation of the Fountain syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      early-onset, generalized seizures can be added to the symptom complex
    explanation: >-
      Places seizure onset early in the course rather than as a late
      complication.
- phase: Age-dependent accentuation of the clinical gestalt
  age_range: Childhood through adulthood
  notes: >-
    The syndrome is not degenerative, but its recognizability increases with
    age: the coarse facies, subcutaneous cheek/lip swelling, and skeletal
    features become progressively more evident, which is why the diagnosis is
    often made or confirmed later than the congenital deafness. This is a
    change in phenotypic expression rather than documented neurologic decline;
    no natural-history cohort, survival, or staging data exist.
  evidence:
  - reference: PMID:8897038
    reference_title: >-
      Fountain syndrome: further delineation of the clinical syndrome and follow-up data.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of this syndrome become more evident with advancing
      age
    explanation: >-
      The follow-up series explicitly reports age-dependent accentuation of the
      clinical features, which is the only documented temporal trend for this
      syndrome.
  - reference: PMID:8897038
    reference_title: >-
      Fountain syndrome: further delineation of the clinical syndrome and follow-up data.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two new isolated cases, and present follow-up data on three
      previously reported patients
    explanation: >-
      Documents that the age-dependent trend rests on longitudinal follow-up of
      only three previously reported patients plus two new cases (PARTIAL — the
      denominator is too small to quantify a progression rate).

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence, incidence, birth prevalence, or registry estimate exists.
    Fewer than ~10 patients (one extended sibship plus a few additional cases)
    have been reported since the original 1974 description, supporting only an
    ultra-rare qualitative tier rather than a numeric band. GARD/Orphanet
    informally list it as <1/1,000,000, but that numeric estimate is not
    quotable from a cached source here.
  evidence:
  - reference: PMID:8897038
    reference_title: >-
      Fountain syndrome: further delineation of the clinical syndrome and follow-up data.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this rare syndrome
    explanation: >-
      Supports the qualitative characterization of Fountain syndrome as rare;
      the review aggregates all cases reported to date without a population rate.

treatments:
# No disease-modifying therapy exists (molecular basis unknown). Management is
# entirely symptomatic/supportive; the primary papers describe clinical
# follow-up but no therapy trial, so these entries carry descriptions without
# evidence snippets (CLAUDE.md §4 Option C).
- name: Anticonvulsant Therapy
  description: >-
    Antiseizure medication is used to control the early-onset generalized
    seizures. This is symptomatic and does not modify the underlying disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: MAXO:0000167
      label: anticonvulsant agent therapy
  target_mechanisms:
  - target: Central Nervous System Developmental Dysfunction
    treatment_effect: MODULATES
    description: >-
      Anticonvulsants suppress seizure activity symptomatically; they do not
      address the unknown underlying CNS developmental defect.
- name: Hearing Rehabilitation
  description: >-
    Hearing aids (and, where appropriate, cochlear-implant evaluation) address
    the congenital sensorineural deafness. Symptomatic sensory rehabilitation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid usage
    term:
      id: MAXO:0009030
      label: hearing aid usage
  target_mechanisms:
  - target: Inner-Ear Malformation and Sensorineural Deafness
    treatment_effect: MODULATES
    description: >-
      Amplification compensates for the sensorineural deficit produced by the
      inner-ear malformation without correcting the malformation itself.
- name: Speech and Language Therapy
  description: >-
    Speech and language therapy supports communication in the context of
    deafness and intellectual disability.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: MAXO:0000930
      label: speech therapy
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the autosomal recessive recurrence risk
    (25% for future siblings) despite the absence of a molecular test.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
- name: Supportive and Developmental Care
  description: >-
    Multidisciplinary developmental, educational, and supportive care for the
    intellectual disability and multisystem needs.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care

differential_diagnoses:
- name: Hao-Fountain syndrome
  description: >-
    Shares the "Fountain" eponym (coincidentally) and includes intellectual
    disability with dysmorphism, so it is the primary Named-Entity-Confusion
    trap. It is a molecularly and clinically distinct disorder.
  distinguishing_features:
  - >-
    Caused by pathogenic USP7 variants (16p13.2) with autosomal DOMINANT (usually
    de novo) inheritance, not autosomal recessive; lacks the defining
    Fountain-syndrome triad of congenital sensorineural deafness with inner-ear
    malformation, coarse face with full-lip/soft-tissue swelling, and the broad
    stubby-hand skeletal dysplasia. Confirmed by USP7 sequencing.
  disease_term:
    preferred_term: Hao-Fountain syndrome
    term:
      id: MONDO:0014805
      label: Hao-Fountain syndrome
  evidence:
  - reference: PMID:41343689
    reference_title: >-
      USP7-Related Hao-Fountain Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      USP7-related Hao-Fountain syndrome is an autosomal dominant disorder
      typically caused by a de novo pathogenic variant
    explanation: >-
      GeneReviews establishes the mode of inheritance of Hao-Fountain syndrome as
      autosomal dominant and usually de novo, contrasting with the autosomal
      recessive sib-recurrence pattern of classic Fountain syndrome — the primary
      discriminator between the two eponymously confusable entities.
  - reference: PMID:41343689
    reference_title: >-
      USP7-Related Hao-Fountain Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      established in a proband with suggestive findings and a heterozygous
      pathogenic variant in USP7
    explanation: >-
      Hao-Fountain syndrome has a definitive molecular test (heterozygous USP7
      variant), whereas classic Fountain syndrome has no known gene; a positive
      USP7 result therefore excludes classic Fountain syndrome.
  - reference: PMID:41343689
    reference_title: >-
      USP7-Related Hao-Fountain Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings in fewer than 50% of individuals include epilepsy, sleep
      disturbance, hypogonadism, scoliosis, and hearing loss
    explanation: >-
      Hearing loss is a minority finding in Hao-Fountain syndrome, whereas
      congenital sensorineural deafness from an inner-ear anomaly is an obligate
      cardinal feature of classic Fountain syndrome — a further discriminator.
- name: DOORS syndrome and the ATP6V1B2 deafness-onychodystrophy spectrum
  description: >-
    Deafness, ONychodystrophy, Osteodystrophy, mental Retardation, and Seizures
    (DOORS), together with dominant deafness-onychodystrophy (DDOD) and
    Zimmermann-Laband syndrome, overlaps with Fountain syndrome on the
    deafness + skeletal + intellectual-disability + seizures profile.
  distinguishing_features:
  - >-
    ATP6V1B2-related (DDOD/ZLS) or TBC1D24-biallelic (DOORS) with defined
    molecular tests; nail/distal-phalanx (onychodystrophy, triphalangeal thumbs)
    and gingival findings dominate, rather than Fountain's coarse full-lipped
    facies with progressive soft-tissue swelling and inner-ear malformation.
  disease_term:
    preferred_term: DOORS syndrome
    term:
      id: MONDO:0009079
      label: DOORS syndrome
  evidence:
  - reference: PMID:25719194
    reference_title: >-
      TBC1D24-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DOORS syndrome (deafness, onychodystrophy, osteodystrophy, mental
      retardation, and seizures), with profound sensorineural hearing loss,
      onychodystrophy, osteodystrophy, intellectual disability / developmental
      delay, and seizures
    explanation: >-
      Establishes the DOORS phenotype, which overlaps classic Fountain syndrome
      on sensorineural deafness, skeletal/bone involvement, intellectual
      disability, and seizures; the discriminating feature is onychodystrophy
      (nail/distal-phalanx involvement), which is not part of Fountain syndrome.
  - reference: PMID:25719194
    reference_title: >-
      TBC1D24-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic TBC1D24 pathogenic variants when the mode of inheritance is
      autosomal recessive
    explanation: >-
      DOORS syndrome is also autosomal recessive but has a defined molecular test
      (biallelic TBC1D24 variants); classic Fountain syndrome has no known gene,
      so a positive TBC1D24 result reassigns the diagnosis.
- name: Melkersson-Rosenthal syndrome
  description: >-
    Shares recurrent orofacial (lip) swelling, superficially resembling the
    progressive lip/cheek soft-tissue swelling and historical lip "granuloma" of
    Fountain syndrome; Fryns explicitly distinguished the two.
  distinguishing_features:
  - >-
    An acquired orofacial granulomatosis with the triad of recurrent orofacial
    edema, facial-nerve palsy, and fissured tongue; not a congenital recessive
    multisystem syndrome and lacks congenital sensorineural deafness,
    intellectual disability, and the skeletal dysplasia.
  disease_term:
    preferred_term: Melkersson-Rosenthal syndrome
    term:
      id: MONDO:0007969
      label: Melkersson-Rosenthal syndrome
  evidence:
  - reference: PMID:33422123
    reference_title: >-
      Melkersson-Rosenthal syndrome misdiagnosed as recurrent Bell's palsy: a case report and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      clinically characterized by a triad of recurrent facial palsy, orofacial
      swelling, and fissured tongue
    explanation: >-
      Defines the Melkersson-Rosenthal triad. Only the orofacial swelling
      overlaps Fountain syndrome; recurrent facial palsy and fissured tongue are
      absent in Fountain syndrome, and Melkersson-Rosenthal lacks congenital
      deafness, intellectual disability, and skeletal dysplasia.
  - reference: PMID:33422123
    reference_title: >-
      Melkersson-Rosenthal syndrome misdiagnosed as recurrent Bell's palsy: a case report and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is frequently seen in females in their second and third decades of life
    explanation: >-
      Melkersson-Rosenthal syndrome is an acquired disorder presenting in young
      adulthood, whereas Fountain syndrome is a congenital recessive disorder
      recognized in infancy or childhood — a decisive temporal discriminator.
  - reference: PMID:29261927
    reference_title: >-
      Cheilitis Granulomatosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Melkersson-Rosenthal syndrome (MRS) is characterized, in its complete
      form, by a classical triad of symptoms: recurrent or persistent orofacial
      edema (facial and lip edemas), plicated or fissured tongue (lingua
      plicata), and relapsing peripheral facial nerve paralysis
    explanation: >-
      Independently corroborates the Melkersson-Rosenthal triad and places it in
      the orofacial granulomatosis group — the differential most relevant to
      Fountain syndrome's lip/cheek swelling and historical lip "granuloma".

discussions:
- discussion_id: fountain_causal_gene_unknown
  prompt: >-
    What is the causal gene or locus of classic Fountain syndrome
    (MONDO:0009241, OMIM:229120)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unknown Molecular Etiology
  rationale: >-
    Fountain syndrome has been recognized as a distinct autosomal recessive
    entity since 1974, but no linkage, homozygosity-mapping, or exome/genome
    sequencing study of the reported kindreds has ever identified a causal gene.
    OMIM #229120 remains a purely clinical (phenotype-only) entry with no linked
    HGNC gene. Resolving the molecular basis would enable molecular diagnosis,
    distinguish the syndrome from phenotypic mimics (USP7-related Hao-Fountain
    syndrome, ATP6V1B2-related DDOD/DOORS/Zimmermann-Laband spectrum), and
    permit mechanistic study of the cochlear malformation and connective-tissue
    swelling.
  proposed_experiments:
  - name: Trio exome/genome sequencing of reported kindreds
    experiment_id: fountain_wes_reported_kindreds
    description: >-
      Re-contact and perform trio exome or genome sequencing (with homozygosity
      mapping given the presumed autosomal recessive inheritance) on surviving
      members of the originally reported Fountain and Fryns kindreds and any
      newly ascertained clinically compatible families, to identify a shared
      biallelic candidate gene.


notes: >-
  External identifiers: OMIM:229120, ORPHA:3219, GARD:0000064, UMLS:C0795944.
  A handful of additional features reported in single patients or small
  case-level series are not modeled as discrete HP-termed phenotypes here
  because they are not quotable from the BODY of any cached reference:
  thickened calvaria (HP:0002684), hypotonia, scoliosis, gingival overgrowth,
  and myopia/visual impairment. Note that some of these do appear in cached
  MeSH frontmatter — PMID:4431800 carries "Gingival Diseases/genetics" and
  PMID:2585470 carries "Skull/abnormalities" — but frontmatter keywords are not
  part of the validated body text, so they cannot serve as evidence snippets
  and are not a route around the ceiling. The temporal-bone tomography/CT (cochlear
  anomaly), skull and hand radiographs, audiology, and EEG that make up the
  diagnostic workup are described in the primary reports. This is a clinical
  diagnosis of exclusion; exome/genome sequencing is used to rule out the
  molecularly defined mimics listed under differential_diagnoses.

  GeneReviews baseline: NO GeneReviews chapter exists for classic Fountain
  syndrome, so no GeneReviews-derived phenotype baseline is available for this
  entry. The GeneReviews chapters cited here — PMID:41343689 (USP7-Related
  Hao-Fountain Syndrome), PMID:25719194 (TBC1D24-Related Disorders, covering
  DOORS), and PMID:20301341 (Mucopolysaccharidosis Type I) — document
  DIFFERENTIAL DIAGNOSES, not this disease. IMPORTANT for anyone reading a
  `GeneReviews` tag on this entry: `scripts/tag_references.py` detects
  GeneReviews purely by substring-matching the cached text, so it will and does
  auto-tag these three PMIDs in the top-level references block. That tag
  therefore does NOT indicate that a GeneReviews baseline exists for classic
  Fountain syndrome, and this entry should not be counted as satisfying a
  "GeneReviews chapter tagged?" review check on the strength of it.

  Literature ceiling: a PubMed search for "Fountain syndrome" returns 26
  records, only two of which (PMID:3565469, PMID:8897038) concern the classic
  syndrome; every record from 2022 onward concerns USP7-related Hao-Fountain
  syndrome. Two further classic papers (PMID:4431800 Fountain 1974 and
  PMID:2585470 Fryns 1989) are indexed under other titles and are title-only
  PubMed records with no abstract. So only PMID:3565469 and PMID:8897038 yield
  quotable snippets about the disease itself, apart from the 1974 report's
  title, which is quoted as the (explicitly labelled) source for the lip
  granuloma phenotype. This is the hard evidence ceiling for the entry, not a
  curation shortfall.

  Gene-attribution guardrail (do NOT attach a gene to this entry): two spurious
  gene associations recur in AI/deep-research output for this disease name and
  were explicitly rejected during curation. (1) USP7 — belongs to Hao-Fountain
  syndrome (MONDO:0014805, OMIM:616863), a different, autosomal DOMINANT
  disorder; see differential_diagnoses. (2) KCTD3 (1q41) — surfaced in the
  2026-07-31 claude_code deep-research pass as a keyword co-occurrence artifact
  (KCTD3/HCN3 mouse-brain interaction literature) with no publication linking it
  to OMIM:229120. Neither gene has any evidenced relationship to classic
  Fountain syndrome, whose causal gene remains unknown. Note that the KCTD3
  artifact is specific to the 2026-07-31 re-run: the superseded 2026-07-30
  claude_code run (preserved as
  research/Fountain_Syndrome-deep-research-claude_code-2026-07-30.md) does NOT
  contain it and asserts the correct MONDO:0009241. Two runs of the same
  provider on the same disease therefore differ in their hallucinations, which
  is itself a reason to keep both rather than overwrite in place.

  Identifier guardrail (verified against MONDO, do NOT trust deep-research
  output here): the correct identifiers are MONDO:0009241, OMIM:229120,
  ORPHA:3219, GARD:0000064, MEDGEN:208650, MESH:C537270, UMLS:C0795944 — all
  confirmed as xrefs of MONDO:0009241 via OAK. The 2026-07-31 openscientist
  deep-research pass asserted two WRONG identifiers for this disease in its
  summary and identifier table: MONDO:0008788, which is actually IRIDA syndrome
  (iron-refractory iron deficiency anemia, an unrelated disorder), and
  ORPHA:2001. Its narrative content about the syndrome is otherwise accurate and
  correctly separated from Hao-Fountain, which is precisely why the wrong IDs
  are dangerous: they sit inside an otherwise trustworthy report. Always
  re-derive identifiers with `runoak -i sqlite:obo:mondo info MONDO:0009241 -O
  obo` rather than copying them from a deep-research report.

  Orphanet: ORPHA:3219 could not be cached as a structured reference because
  `just refresh-orphadata` currently fails on a sha256 mismatch for
  en_product1.xml against the pinned data/orphadata/MANIFEST.yaml (upstream
  Orphadata has been republished). Re-pinning the manifest would invalidate all
  322 existing references_cache/ORPHA_*.md files and is out of scope for a
  single-disorder curation PR. Once the manifest is refreshed repo-wide, the
  Orphanet HPO-frequency table for ORPHA:3219 would be the best available source
  for the phenotype frequencies and the additional features listed above.

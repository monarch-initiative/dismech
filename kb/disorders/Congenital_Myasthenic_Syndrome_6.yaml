name: Congenital Myasthenic Syndrome 6
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Congenital Myasthenic Syndrome 6
  term:
    id: MONDO:0009689
    label: congenital myasthenic syndrome 6
parents:
- Congenital Myasthenic Syndrome
description: >-
  Congenital myasthenic syndrome 6 (CMS6, CMS with episodic apnea/CMS-EA,
  CHAT-CMS, historically "familial infantile myasthenia") is an autosomal
  recessive presynaptic congenital myasthenic syndrome caused by biallelic
  pathogenic variants in CHAT, encoding choline acetyltransferase (ChAT), the
  enzyme that synthesizes acetylcholine (ACh) from acetyl-CoA and choline at
  the motor nerve terminal. It is the prototype and most common presynaptic
  CMS. Unlike postsynaptic or synaptic CMS, endplate acetylcholine receptor
  density and acetylcholinesterase activity are normal; the defect is a
  use-dependent failure to resynthesize/repackage ACh under sustained
  functional demand. Patients classically present at birth or in early
  infancy with hypotonia, ptosis, and bulbar weakness, and experience sudden,
  recurrent, potentially fatal apneic crises precipitated by fever, infection,
  excitement, or exertion, with only mild or no myasthenic symptoms between
  crises. A phenotypic spectrum is increasingly recognized: alongside this
  classic severe neonatal/infantile presentation, a milder, later-onset
  (childhood) phenotype has been described in which exercise-induced leg
  fatigability is the sole or presenting manifestation, without apnea, ptosis,
  or ophthalmoparesis, and without progression over years of follow-up.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported CMS6 patients carry biallelic (homozygous or compound
    heterozygous) CHAT variants inherited from unaffected heterozygous
    carrier parents; heterozygous CHAT null-allele carriers are asymptomatic.
  evidence:
  - reference: PMID:11172068
    reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Restriction analysis of DNA from relatives revealed that a living affected sibling harbors both mutations, the asymptomatic parents carry a single mutation, and other unaffected relatives carry either no or a single mutation (data not shown). Therefore, each mutation is heteroallelic and recessive."
    explanation: Establishes the autosomal recessive, biallelic segregation of CHAT mutations in CMS6 families.
pathophysiology:
- name: Choline Acetyltransferase Catalytic Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic CHAT missense, nonsense, or frameshift variants reduce ChAT
    protein expression and/or catalytic efficiency for its two substrates,
    acetyl-CoA and choline. Mutant severity spans a spectrum: null/frameshift
    alleles abolish expression entirely, while missense substitutions near the
    active-site tunnel or substrate-binding domains variably impair
    acetyl-CoA/choline affinity and catalytic turnover, reducing acetylcholine
    (ACh) biosynthesis at the presynaptic nerve terminal. Endplate AChR
    density and acetylcholinesterase activity are unaffected.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Acetylcholine biosynthetic process
    term:
      id: GO:0008292
      label: acetylcholine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:11172068
    reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of CHAT reveals 10 recessive mutations in five patients with CMS-EA. One mutation (523insCC) is a frameshifting null mutation. Three mutations (I305T, R420C, and E441K) markedly reduce ChAT expression in COS cells."
    explanation: Establishes recessive CHAT loss-of-function mutations, including a null frameshift allele and missense alleles with reduced expression, as the molecular lesion in CMS6.
  - reference: PMID:11172068
    reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Kinetic studies of nine bacterially expressed ChAT mutants demonstrate that one mutant (E441K) lacks catalytic activity, and eight mutants (L210P, P211A, I305T, R420C, R482G, S498L, V506L, and R560H) have significantly impaired catalytic efficiencies."
    explanation: Direct biochemical demonstration that CMS6 CHAT mutants are catalytically deficient for ACh synthesis.
  - reference: PMID:26080897
    reference_title: "Choline Acetyltransferase Mutations Causing Congenital Myasthenic Syndrome: Molecular Findings and Genotype-Phenotype Correlations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The characterization of mutants showed a decrease in the overall catalytic efficiency of ChAT; in particular, those located near the active-site tunnel produced the most seriously disruptive phenotypic effects."
    explanation: Confirms reduced ChAT catalytic efficiency as the shared biochemical consequence of CMS6-causing mutations and links mutation location/severity to disease severity.
  downstream:
  - target: Use-Dependent Failure of Acetylcholine Resynthesis and Vesicular Repackaging
    causal_link_type: DIRECT
    description: >-
      Reduced ChAT catalytic activity limits the rate at which cytoplasmic ACh
      can be resynthesized to keep pace with vesicular release, producing a
      use-dependent (rather than resting) neurotransmission defect.
- name: Use-Dependent Failure of Acetylcholine Resynthesis and Vesicular Repackaging
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  biological_scale: CELLULAR
  description: >-
    In contrast to postsynaptic or synaptic CMS, resting (unstimulated)
    neuromuscular transmission in CMS6 is essentially normal: endplate AChR
    number, quantal content of the endplate potential, and miniature endplate
    potential (MEPP) amplitude are all normal at rest. The defect only
    manifests under sustained functional demand — after a conditioning train
    of high-frequency (10 Hz) nerve stimulation, MEPP amplitude falls
    (consistent with fewer ACh molecules per synaptic vesicle) because
    depleted synaptic vesicles cannot be adequately refilled with newly
    synthesized ACh. Neuromuscular junction ultrastructure is normal on
    electron microscopy.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Skeletal muscle fiber endplate
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: Neurotransmitter loading into synaptic vesicle
    term:
      id: GO:0098700
      label: neurotransmitter loading into synaptic vesicle
    modifier: DECREASED
  evidence:
  - reference: PMID:11172068
    reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies of the neuromuscular junction in this disease show a stimulation-dependent decrease of the amplitude of the miniature endplate potential and no deficiency of the ACh receptor."
    explanation: Documents the defining electrophysiological signature of CMS6 - a stimulation-dependent, not resting, defect - with normal AChR number.
  - reference: PMID:26080897
    reference_title: "Choline Acetyltransferase Mutations Causing Congenital Myasthenic Syndrome: Molecular Findings and Genotype-Phenotype Correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Instead, there is a use-dependent reduction of the quantal size due to a decrease in the number of ACh molecules per synaptic vesicle (Engel and Lambert, 1987; Mora et al., 1987) with normal ultrastructure of the neuromuscular junction (NMJ) (Maselli et al., 2003)."
    explanation: Confirms the mechanism as a use-dependent fall in vesicular ACh quantal content rather than a structural NMJ defect.
  downstream:
  - target: Impaired Neuromuscular Junction Transmission
    causal_link_type: DIRECT
    description: >-
      Insufficient ACh resynthesis during sustained nerve activity lowers
      endplate potential amplitude below the threshold needed to reliably
      trigger a muscle fiber action potential, especially during repetitive or
      prolonged demand.
- name: Impaired Neuromuscular Junction Transmission
  conforms_to: "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission"
  biological_scale: CELLULAR
  description: >-
    The terminal shared mechanism of CMS6: a use-dependent reduction of the
    safety factor of cholinergic neuromuscular transmission. Because the
    defect only becomes electrophysiologically and clinically apparent under
    sustained or repetitive demand, basal (2 Hz) repetitive nerve stimulation
    and single-fiber EMG can be falsely normal, particularly in neonates; a
    decremental compound muscle action potential (CMAP) response classically
    appears only after a prolonged conditioning train of high-frequency (10
    Hz, 5 minute) stimulation.
  cell_types:
  - preferred_term: Skeletal muscle fiber (postsynaptic motor endplate)
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: Neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:23292760
    reference_title: "Congenital myasthenic syndrome due to choline acetyltransferase mutations in infants: clinical suspicion and comprehensive electrophysiological assessment are important for early diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electromyography showed myogenic signs, and basal repetitive nerve stimulation yielded negative findings. ... Prolonged subtetanic repetitive nerve stimulation disclosed a marked decremental response compatible with suspected congenital myasthenic syndrome with episodic apnea."
    explanation: Demonstrates that basal RNS can be falsely negative in CMS6 and that the use-dependent transmission defect requires prolonged high-frequency stimulation to unmask.
  - reference: PMID:11172068
    reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electromyographic studies in the five patients between crises revealed no decremental response on 2-Hz stimulation of motor nerves, but such a response appeared after a conditioning train of 10-Hz stimuli for 5 min."
    explanation: Establishes the classic CMS6 electrodiagnostic pattern of a normal 2 Hz response with a decrement unmasked only by prolonged 10 Hz conditioning stimulation.
  downstream:
  - target: Sudden Episodic Apnea
    causal_link_type: DIRECT
    description: >-
      Acute, severe demand-driven failure of ACh resynthesis at the
      diaphragm and respiratory accessory muscle endplates during fever,
      infection, excitement, or exertion produces abrupt, sometimes fatal,
      respiratory failure.
    evidence:
    - reference: PMID:11172068
      reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "If the infant survives, the symptoms improve, but the crises recur abruptly with infections, fever, excitement, vomiting, or overexertion. During crises, episodes of apnea can cause sudden death or anoxic brain injury."
      explanation: Establishes fever/infection/excitement/exertion as the precipitants of the life-threatening apneic crises characteristic of CMS6.
  - target: Fatigable Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      Between crises, the reduced safety factor of transmission produces
      exertion-induced fatigable weakness of ocular, bulbar, and limb
      muscles.

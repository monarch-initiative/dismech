genetic:
- name: CHAT
  gene_term:
    preferred_term: CHAT
    term:
      id: hgnc:1912
      label: CHAT
  association: Causal
  relationship_type: CAUSATIVE
  notes: >-
    CHAT (10q11.2, in the cholinergic gene locus that also harbors SLC18A3
    within its first intron) encodes choline acetyltransferase (ChAT), the
    sole enzyme identified to date whose deficiency causes congenital ACh
    synthesis defects. Reported CMS6 alleles include frameshift/nonsense
    null variants and missense variants scattered throughout the coding
    region with no apparent mutational hotspot; missense substitutions
    predominantly reduce affinity for the acetyl-CoA and/or choline
    substrates and/or reduce protein expression/stability. Phenotypic
    severity correlates with the degree of residual catalytic
    efficiency/expression, but can vary even between patients or siblings
    sharing an identical genotype.
  evidence:
  - reference: PMID:11172068
    reference_title: "Choline acetyltransferase mutations cause myasthenic syndrome associated with episodic apnea in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Choline acetyltransferase (ChAT; EC ) catalyzes the reversible synthesis of acetylcholine (ACh) from acetyl CoA and choline at cholinergic synapses. ... Here we report that mutations in CHAT cause a congenital myasthenic syndrome associated with frequently fatal episodes of apnea (CMS-EA)."
    explanation: Founding report identifying CHAT as the CMS6-causing gene.
  - reference: PMID:19520274
    reference_title: "Congenital myasthenic syndrome with episodic apnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations identified to date, including the current ones, have mostly been scattered throughout the gene, with no apparent \"hotspots\"."
    explanation: Documents the lack of a CHAT mutational hotspot across reported CMS6 alleles.
  - reference: PMID:15701560
    reference_title: "Clinical variability of CMS-EA (congenital myasthenic syndrome with episodic apnea) due to identical CHAT mutations in two infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sequencing of the CHAT gene revealed identical, compound heterozygous mutations S694C and T354M in both children. These findings are in line with a remarkable clinical heterogeneity observed in patients with CHAT mutations"
    explanation: Documents marked clinical variability despite an identical CHAT genotype, indicating additional modifying factors beyond the primary CHAT lesion.
treatments:
- name: Acetylcholinesterase Inhibitor Therapy
  description: >-
    Pyridostigmine is the primary and first-line therapy for CMS6: by
    prolonging ACh action at the endplate, it compensates for reduced ACh
    availability and can prevent or mitigate apneic crises and stabilize
    respiratory status, though response can be partial in severely affected
    patients.

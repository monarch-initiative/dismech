description: >-
  Congenital myasthenic syndrome 6 (CMS6, CMS with episodic apnea, CHAT-CMS) is
  an autosomal recessive presynaptic congenital myasthenic syndrome caused by
  biallelic pathogenic variants in CHAT, encoding choline acetyltransferase,
  the enzyme that synthesizes acetylcholine from choline and acetyl-CoA at the
  motor nerve terminal. It is the prototype and most common presynaptic CMS,
  classically presenting with sudden, life-threatening apneic crises
  (precipitated by fever, infection, or excitement) superimposed on a
  background of fluctuating fatigable weakness, often from birth or early
  infancy.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Routine surveillance of growth parameters and calculation of BMI after age two years. Monitor developmental
      progress and educational needs and provide behavioral assessment at each visit.
    explanation: >-
      Supports growth, developmental, and behavioral surveillance.
  - reference: PMID:20301775
    reference_title: 16p11.2 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

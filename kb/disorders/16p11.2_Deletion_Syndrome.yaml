name: 16p11.2 Deletion Syndrome
creation_date: '2026-08-22T00:00:00Z'
description: >-
  The proximal recurrent 16p11.2 BP4-BP5 deletion is a heterozygous copy-number loss of approximately
  600 kb. Reduced dosage of multiple genes produces variable neurodevelopmental, neurologic, and metabolic
  manifestations. Speech and language impairment and motor coordination difficulties are prominent; most
  carriers do not meet criteria for intellectual disability. Autism and seizures affect a minority, and
  obesity commonly develops through childhood. The reciprocal duplication and the distal BP2-BP3 deletion
  are distinct genomic disorders.
category: Genetic
synonyms:
- proximal 16p11.2 microdeletion syndrome
- 16p11.2 BP4-BP5 deletion
- 16p11.2 microdeletion syndrome
parents:
- hereditary disease
- chromosomal disorder
disease_term:
  preferred_term: proximal 16p11.2 microdeletion syndrome
  term:
    id: MONDO:0012756
    label: proximal 16p11.2 microdeletion syndrome
inheritance:
- name: Autosomal dominant recurrent microdeletion, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: >-
    Most probands; approximately 7% inherit the deletion in the cohorts summarized by Chung et al. (2021).
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    A heterozygous deletion can be transmitted in an autosomal dominant manner. The one-in-two transmission
    risk follows from Mendelian segregation; it does not predict the severity or presence of any individual
    manifestation. Penetrance varies with phenotype and age, and expressivity is variable.
  evidence:
  - reference: PMID:20301775
    reference_title: 16p11.2 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 16p11.2 recurrent deletion is de novo in most probands. Less commonly, the deletion is transmitted
      from a parent to a child in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the mode of inheritance and that transmission, when it occurs, is autosomal dominant.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The deletion is most often de novo but is inherited in approximately 7% of probands.
    explanation: >-
      Provides the inherited fraction; this is not a population penetrance estimate.
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Penetrance is age-dependent and can be considered for each of the individual associated features
      (head size, brain volume, ASD, intellectual disability, language and coordination disorders, seizures,
      obesity, or congenital anomalies).
    explanation: >-
      Supports phenotype-specific and age-dependent penetrance rather than a single syndrome-wide estimate.
prevalence:
- population: General population
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 50.0
  notes: >-
    Approximately 1 in 2,000 people, equivalent to 50 per 100,000. The full-text review identifies this
    as general-population prevalence, not birth incidence.
  evidence:
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reciprocal deletions and duplications are observed with a prevalence of approximately 1/2000 and
      1/1100 in the general population, respectively [1].
    explanation: >-
      The first estimate applies to deletion carriers; the second to duplication carriers.
pathophysiology:
- name: 16p11.2 (BP4-BP5) Microdeletion
  biological_scale: MOLECULAR
  description: >-
    Loss of one copy of the proximal BP4-BP5 interval, approximately 600 kb, between homologous low-copy
    repeats.
  evidence:
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The recurrent ~600 kb copy number variant (CNV) at 16p11.2 BP4 and BP5 deletion is flanked by highly
      homologous blocks of low-copy repeats (Figure 1) and is one of the most frequent etiologies of neurodevelopmental
      disorders.
    explanation: >-
      Defines the recurrent interval and flanking genomic architecture.
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A pair of long direct genomic repeats (shown in orange) can mediate 0.6-Mb recurrent deletions.
    explanation: >-
      The figure description supports repeat-mediated recurrent deletion.
  downstream:
  - target: Reduced 16p11.2 Gene Dosage
    causal_link_type: DIRECT
    description: Loss of one copy of the interval genes reduces their dosage.
    evidence:
    - reference: PMID:28984295
      reference_title: R-Baclofen Reverses Cognitive Deficits and Improves Social Interactions in Two Lines of 16p11.2 Deletion Mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Caused by a single copy deletion of ~27 genes, 16p11.2 microdeletion syndrome is characterized
        by ID, impaired language, communication and socialization skills, and ASD.
      explanation: >-
        The introductory summary identifies multigene copy-number loss; it does not establish a precise
        gene count across annotation releases.
- name: Reduced 16p11.2 Gene Dosage
  biological_scale: MOLECULAR
  description: >-
    The deletion reduces copy number of multiple genes in the proximal interval. No single gene accounts
    for the complete syndrome, and gene-specific dosage sensitivity differs across manifestations.
  evidence:
  - reference: PMID:36531974
    reference_title: Clinical Characteristics of Seizures and Epilepsy in Individuals With Recurrent Deletions and Duplications in the 16p11.2 Region.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Heterozygous pathogenic variants in PRRT2 are not clearly associated with ASD, and therefore, the
      CNV phenotype definitely extends beyond this single gene and is likely related to other genes contained
      in the deleted or duplicated segment.
    explanation: >-
      Supports a multigene interpretation rather than attributing the complete syndrome to PRRT2.
  downstream:
  - target: Delayed Speech and Language Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The deletion is associated with this manifestation; intervening gene-specific mechanisms are not
      established.
    evidence:
    - reference: PMID:33667823
      reference_title: 16p11.2 deletion syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Deletion carriers have delays in early neurodevelopment that most specifically impair speech, phonology and language in 70%.
      explanation: Speech, phonology, and language are impaired in 70% of deletion carriers.
      quote_role: REVIEW_SYNTHESIS
  - target: Neurodevelopmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The deletion is associated with this manifestation; intervening gene-specific mechanisms are not
      established.
    evidence:

    evidence:
    - reference: PMID:33667823
      reference_title: 16p11.2 deletion syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        We conducted a comprehensive chart review and in person examination by a child neurologist of
        136 deletion carriers and identified features including symmetric hypotonia (50%), abnormal agility
        or clumsiness (47%), tremor (equivalent to essential tremor-25%) and increased reflexes/clonus
        (13%) in deletion carriers [28].
      explanation: >-
        The review reports this finding in a neurologically examined cohort; the increased-reflexes frequency
        is grouped with clonus.

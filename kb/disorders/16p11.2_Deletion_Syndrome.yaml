genetic:
- name: 16p11.2 (BP4-BP5) deletion
  association: Causal
  notes: >-
    Heterozygous proximal BP4-BP5 copy-number loss. No single gene explains the complete syndrome; PRRT2
    and TBX6 have phenotype-specific contributions.
  evidence:
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 16p11.2 BP4 and BP5 region, is a recurrent ∼600kb copy number variant (CNV), and deletions are one of the most frequent etiologies of neurodevelopmental disorders and autism spectrum disorder with an incidence of approximately 1/2000.
    explanation: Defines the recurrent BP4-BP5 ~600 kb CNV as the causal lesion.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301775
    reference_title: 16p11.2 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of 16p11.2 recurrent deletion is established by detection of a heterozygous ~593-kb recurrent deletion at the approximate position of chr16:29638676-30188531 in the reference genome (NCBI Build 38).
    explanation: GeneReviews gives the diagnostic interval and heterozygous dosage state of the recurrent deletion.
    quote_role: REVIEW_SYNTHESIS
  relationship_type: CAUSATIVE
- name: PRRT2
  gene_term:
    preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  relationship_type: RISK_FACTOR
  notes: >-
    Deleted gene with a provisional contribution to self-limited infantile epilepsy; not a monogenic explanation
    of the full syndrome.
  evidence:
  - reference: PMID:36531974
    reference_title: Clinical Characteristics of Seizures and Epilepsy in Individuals With Recurrent Deletions and Duplications in the 16p11.2 Region.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      We can postulate that Se(F)IE syndrome seen in the deletion group is related, at least partly, to
      the loss-of-function of the PRRT2 gene.
    explanation: >-
      The authors explicitly present PRRT2 attribution as a postulate, not a complete causal account.
- name: TBX6
  gene_term:
    preferred_term: TBX6
    term:
      id: hgnc:11605
      label: TBX6
  relationship_type: MODIFIER
  notes: >-
    The nondeleted allele modifies congenital-scoliosis risk. The T-C-A haplotype comprises the nonreference
    alleles of rs2289292, rs3809624, and rs3809627; it is not required for the neurodevelopmental syndrome.
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The red bracket represents the deletion allele, and the nonreference alleles of rs2289292, rs3809624,
      and rs3809627 on the nondeletion chromosomes are shown in blue.
    explanation: >-
      The figure legend locates the three risk-haplotype variants on the nondeleted chromosome; the carrier
      association is documented in the TBX6 dosage node.

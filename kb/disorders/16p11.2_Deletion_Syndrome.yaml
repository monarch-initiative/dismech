      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Altered satiety presents prior to the onset of obesity (Maillard et al. 2016), serving as a flag
        to control portion size.
      explanation: >-
        Links altered satiety to the metabolic phenotype while leaving the responsible proximal-interval
        genes unresolved.
  - target: Hyperphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hyperphagia occurs in deletion carriers; the responsible gene-to-appetite pathway is unresolved.
    evidence:

pathophysiology:
- name: 16p11.2 (BP4-BP5) Microdeletion
  biological_scale: MOLECULAR
  description: >-
    A recurrent ~600 kb deletion of the proximal 16p11.2 (BP4-BP5) interval,
    generated by non-allelic homologous recombination between flanking segmental
    duplications, removing one copy of the ~27 genes in the interval.
  evidence:
  - reference: PMID:33667823
    reference_title: "16p11.2 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletions are one of the most frequent etiologies of neurodevelopmental disorders and autism spectrum disorder with an incidence of approximately 1/2000"
    explanation: Establishes the recurrent BP4-BP5 deletion as a frequent cause of neurodevelopmental disorders.
  downstream:
  - target: Haploinsufficiency of 16p11.2 Genes
    causal_link_type: DIRECT
    description: Loss of one copy of the interval genes reduces their dosage.
- name: Haploinsufficiency of 16p11.2 Genes
  biological_scale: MOLECULAR
  description: >-
    Reduced dosage of the ~27 genes in the BP4-BP5 interval disrupts
    neurodevelopment (language, cognition, coordination, social function) and
    energy-balance regulation, producing a variably penetrant neurobehavioral and
    metabolic phenotype rather than acting through a single established gene.

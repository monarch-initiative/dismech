      reference_title: 16p11.2 Recurrent Deletion.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        While most, if not all, individuals with the 16p11.2 recurrent deletion experience some degree
        of developmental delay, the severity varies significantly.
      explanation: >-
        GeneReviews supports the very frequent developmental delay while emphasizing variable severity.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The deletion is associated with this manifestation; intervening gene-specific mechanisms are not
      established.
    evidence:
    - reference: PMID:20301775

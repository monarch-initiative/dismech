      reference_title: 16p11.2 deletion syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Among adults, ~75% are obese and among all adult obese patients 45% are morbidly obese, associated
        with hyperphagia [11].
      explanation: >-
        Documents hyperphagia accompanying obesity without assigning it the obesity frequency.
- name: PRRT2 Dosage Reduction
  biological_scale: MOLECULAR
  description: >-
    Loss of one PRRT2 copy is a candidate contributor to the self-limited infantile epilepsy phenotype
    within the multigene deletion syndrome.
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: PRRT2
    term:
      id: hgnc:30500
      label: PRRT2
  evidence:
  - reference: PMID:36531974
    reference_title: Clinical Characteristics of Seizures and Epilepsy in Individuals With Recurrent Deletions and Duplications in the 16p11.2 Region.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      We can postulate that Se(F)IE syndrome seen in the deletion group is related, at least partly, to
      the loss-of-function of the PRRT2 gene.
    explanation: >-
      The authors explicitly present PRRT2 attribution as a postulate, not a complete causal account.
  downstream:

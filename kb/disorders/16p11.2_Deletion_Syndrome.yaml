    reference_title: "16p11.2 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intelligence quotient is shifted 1.8 standard deviations lower than family controls without the deletion."
    explanation: Quantifies the cognitive impact of the deletion relative to family controls.
  downstream:

      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Most affected individuals do not have intellectual disability (defined as an IQ of <70), but many
        have below average cognition and learning disabilities in both verbal and nonverbal domains.
      explanation: >-
        Distinguishes intellectual disability from the more prevalent cognitive and learning difficulties.

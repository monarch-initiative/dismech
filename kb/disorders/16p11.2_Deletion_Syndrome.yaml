- name: TBX6 Dosage Reduction
  biological_scale: MOLECULAR
  description: >-
    The deletion removes one TBX6 allele. For congenital scoliosis, the dosage of the remaining allele
    modifies the effect of this null allele.
  genes:
  - preferred_term: TBX6
    term:
      id: hgnc:11605
      label: TBX6
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, the discordant intrafamilial phenotypes of 16p11.2 deletion carriers suggest that heterozygous
      TBX6 null mutation is insufficient to cause congenital scoliosis.
    explanation: >-
      Loss of one copy alone does not explain penetrance of the vertebral phenotype.
  downstream:
  - target: TBX6 Compound Dosage Deficiency
    causal_link_type: DIRECT
    description: >-
      This branch applies when the remaining TBX6 allele is hypomorphic.
    evidence:
    - reference: PMID:25564734
      reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Replication studies involving additional persons with congenital scoliosis who carried a deletion
        affecting TBX6 confirmed this compound inheritance model.
      explanation: >-
        Supports the interaction of the deletion with the remaining hypomorphic allele.
- name: TBX6 Compound Dosage Deficiency
  biological_scale: MOLECULAR
  description: >-
    A hypomorphic TBX6 allele in trans to the deletion further reduces effective TBX6 dosage. The T-C-A
    risk haplotype is a documented modifier of congenital scoliosis in deletion carriers.
  genes:
  - preferred_term: TBX6
    term:
      id: hgnc:11605
      label: TBX6
  evidence:
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      In vitro functional assays suggested that the risk haplotype is a hypomorphic allele.
    explanation: >-
      Functional assays support reduced activity of the second allele.
  - reference: PMID:25564734
    reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The T-C-A risk haplotype was a significant risk factor for congenital scoliosis in series 3 (5 of
      6 persons with congenital scoliosis vs. 5 of 30 persons without scoliosis, P=0.004 by Fisher’s exact
      test), which further supports the TBX6 compound inheritance model of the disorder.
    explanation: >-
      The comparison is specifically among recurrent deletion carriers.
  downstream:
  - target: Vertebral Anomalies
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The pathway acts through disturbed embryonic vertebral formation; not every vertebral anomaly in
      deletion carriers is attributed to this genotype.
    evidence:
    - reference: PMID:25564734
      reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        All 23 persons with TBX6-associated congenital scoliosis had one or more hemivertebrae (Table
        1 and Fig. 2).
      explanation: >-
        Links TBX6 compound inheritance to vertebral formation defects; the cohort includes both deletion
        and sequence-null carriers.

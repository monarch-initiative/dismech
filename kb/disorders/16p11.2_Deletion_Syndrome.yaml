name: 16p11.2 Deletion Syndrome
creation_date: "2026-08-22T00:00:00Z"
description: >-
  16p11.2 deletion syndrome (proximal, BP4-BP5) is a recurrent ~600 kb copy-number
  variant generated by non-allelic homologous recombination between flanking
  segmental duplications. Haploinsufficiency of the deleted genes is one of the most
  frequent genetic causes of neurodevelopmental disorders and autism spectrum
  disorder, with an incidence around 1 in 2,000. The phenotype includes early
  developmental and language delay, a downward shift in IQ, motor-coordination
  difficulties, autism, readily treated seizures, and progressive childhood-onset
  obesity, with incomplete penetrance and variable expressivity. The reciprocal
  16p11.2 duplication tends toward the opposite weight phenotype (underweight).
category: Genetic
synonyms:
- proximal 16p11.2 microdeletion syndrome
- 16p11.2 BP4-BP5 deletion
- 16p11.2 microdeletion syndrome

genetic:
- name: 16p11.2 (BP4-BP5) deletion
  association: Causal
  notes: >-
    Recurrent ~600 kb deletion of the proximal 16p11.2 (BP4-BP5) interval
    (copy-number loss), mediated by non-allelic homologous recombination between
    flanking segmental duplications. Penetrance is incomplete and expressivity
    variable; the interval contains ~27 genes and no single causal gene is
    established. No coordinate slot exists in the schema; the deletion is recorded
    here in prose.
  evidence:
  - reference: PMID:33667823
    reference_title: "16p11.2 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 16p11.2 BP4 and BP5 region, is a recurrent ∼600kb copy number variant (CNV), and deletions are one of the most frequent etiologies of neurodevelopmental disorders and autism spectrum disorder with an incidence of approximately 1/2000."
    explanation: Defines the recurrent BP4-BP5 ~600 kb CNV as the causal lesion.
  - reference: PMID:20301775
    reference_title: "16p11.2 Recurrent Deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of 16p11.2 recurrent deletion is established by detection of a heterozygous ~593-kb recurrent deletion at the approximate position of chr16:29638676-30188531 in the reference genome (NCBI Build 38)."
    explanation: GeneReviews gives the diagnostic interval and heterozygous dosage state of the recurrent deletion.

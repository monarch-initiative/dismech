      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Although head circumference is smaller at birth, there is an overall increase in head circumference
        by 2 years of age and macrocephaly (Z score ≥2) is present in 17% of carriers (Figure 2a) [10].
      explanation: >-
        Supports the 17% frequency and postnatal emergence of macrocephaly.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

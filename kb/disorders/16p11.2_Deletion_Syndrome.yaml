animal_models:
- name: Mills and Dolmetsch 16p11.2 deletion mouse lines
  species: Mouse
  genotype: Heterozygous deletion of the mouse region syntenic to human proximal 16p11.2
  description: >-
    Two independently generated lines show behavioral deficits and selective responses to chronic oral
    arbaclofen. Human language and intellectual disability are not directly measured by these behavioral
    assays.
  publication: PMID:28984295
  modeled_mechanisms:
  - target: Reduced 16p11.2 Gene Dosage
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Syntenic copy-number loss provides a model for downstream behavioral effects of multigene dosage
      reduction.
    limitations: >-
      The lines differ in background and behavior. Novelty detection and social-interaction assays are
      proxies for selected human functions, not human speech or IQ; the mice have reduced body weight
      rather than the typical adult human obesity.
    evidence:
    - reference: PMID:28984295
      reference_title: R-Baclofen Reverses Cognitive Deficits and Improves Social Interactions in Two Lines of 16p11.2 Deletion Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Studies in animal models where a single copy of the syntenic 16p11.2 region has been deleted have
        revealed morphological, behavioral, and electrophysiological abnormalities.
      explanation: >-
        Supports partial modeling of dosage-associated phenotypes.
  evidence:
  - reference: PMID:28984295
    reference_title: R-Baclofen Reverses Cognitive Deficits and Improves Social Interactions in Two Lines of 16p11.2 Deletion Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Neither laboratory observed any improvement in the hyperlocomotion exhibited by the 16p11.2 df/+
      mice with chronic R-baclofen administration.
    explanation: >-
      Records an unrescued behavioral endpoint alongside the positive findings.
imaging_findings:
- name: Increased Brain Volume
  modality: MRI
  description: >-
    Quantitative MRI studies show increased total brain and regional volumes in proximal deletion carriers.
  evidence:
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The 16p11.2 deletion was associated with increased volumetric measures of brain structures (as well
      as total brain size and intracranial volume, ICV) (Figure 2b) [29]
    explanation: >-
      Describes quantitative brain-volume differences without assuming that they mediate all neurobehavioral
      findings.
- name: Altered White Matter Microstructure
  modality: MRI
  description: >-
    Diffusion tensor imaging shows widespread increased fractional anisotropy. Its relationship to conduction,
    synaptic transmission, and clinical deficits remains unresolved.
  evidence:
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When considering brain white matter microstructural properties derived from diffusion tensor imaging
      (DTI), 16p11.2 deletion was associated with widespread increases in diffusion ‘fractional anisotropy’
    explanation: >-
      The review identifies increased fractional anisotropy. Its cellular basis and causal relationship
      to clinical deficits remain unresolved.
- name: Cerebellar Tonsillar Ectopia
  modality: MRI
  description: >-
    Cerebellar tonsillar ectopia was observed in 30% of a clinical MRI cohort, while 9% had radiologically
    defined Chiari I malformation. These overlapping findings should not be counted as independent phenotypes.
  evidence:
  - reference: PMID:33667823
    reference_title: 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Indeed, we found that deletion carriers had a thicker corpus callosum compared to controls and that
      30% of the deletion carriers had cerebellar tonsillar ectopia and 9% had radiologically defined
      Chiari I malformations [31].
    explanation: >-
      Keeps tonsillar ectopia distinct from the more specific Chiari I diagnosis.
  notes: >-
    The OLS HP search for "cerebellar tonsillar ectopia" returned Chiari malformation; that binding would
    imply a diagnosis the broader imaging appearance alone does not establish.
review_notes: >-
  Reviewed both originally cited sources, regenerated the Chung 2021 reference to full PMC text, and read
  the GeneReviews full chapter. New evidence also uses cached full texts of the 2022 seizure cohort, health-supervision
  review, TBX6 compound-inheritance study, and arbaclofen mouse study. The neighboring 16p12.2-p11.2 deep-research
  report concerns a larger deletion and was excluded. Hearing impairment, sacral dimples, nonspecific
  facial dysmorphism, and Chiari I remain without causal edges because the reviewed sources do not establish
  their intermediates. Imaging findings are retained as observations, without claiming that they causally
  explain language or cognition. The health-supervision review mentions probiotics from indirect preclinical
  work; this is not promoted to an established human treatment.

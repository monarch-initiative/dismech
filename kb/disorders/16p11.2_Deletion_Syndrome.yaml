  - target: PRRT2 Dosage Reduction
    causal_link_type: DIRECT
    description: >-
      The deleted interval includes PRRT2, a candidate contributor to the infantile epilepsy phenotype.
    evidence:
    - reference: PMID:36531974
      reference_title: Clinical Characteristics of Seizures and Epilepsy in Individuals With Recurrent Deletions and Duplications in the 16p11.2 Region.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        There are at least 28 genes located in the 16p11.2 region. It remains unclear at this point, however,
        whether single genes are responsible for certain phenotypes. For a potential role in epilepsy,
        the most studied gene in this region is PRRT2.
      explanation: >-
        The cohort discussion locates PRRT2 within the recurrent interval; deletion of the interval therefore
        removes one copy.
  - target: TBX6 Dosage Reduction
    causal_link_type: DIRECT
    description: >-
      Loss of one TBX6 copy is part of the recurrent deletion.
    evidence:
    - reference: PMID:25564734
      reference_title: TBX6 null variants and a common hypomorphic allele in congenital scoliosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        These null alleles include copy-number variants (12 instances of a 16p11.2 deletion affecting

    describes the study design and outcome measures, not a demonstrated clinical benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: arbaclofen
      term:
        id: CHEBI:190735
        label: Arbaclofen
  evidence:
  - reference: PMID:42080302
    reference_title: Rationale and study design for the first precision medicine randomized placebo-controlled trial in the 16p11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      L16hthouse is the first randomized trial in 16p11.2 deletion syndrome and uses an array of novel
      outcome measures to assess potential benefit in this population.
    explanation: >-
      Establishes investigational testing without asserting efficacy.
  - reference: PMID:28984295
    reference_title: R-Baclofen Reverses Cognitive Deficits and Improves Social Interactions in Two Lines of 16p11.2 Deletion Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      In studies performed across two independent laboratories, we found that chronic activation of GABAB
      receptors improved performance on a series of cognitive and social tasks known to be impaired in
      two different 16p11.2 deletion mouse models.
    explanation: >-
      Mouse behavioral improvement motivates clinical investigation; it does not establish efficacy in
      people.
  - reference: PMID:28984295
    reference_title: R-Baclofen Reverses Cognitive Deficits and Improves Social Interactions in Two Lines of 16p11.2 Deletion Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      On the other hand, the finding that the hyperlocomotion and vocalization phenotypes were not improved
      by our treatment indicates that not all aberrant behavioral phenotypes associated with 16p11.2 deletion
      mice respond to this treatment.
    explanation: >-
      Supports the stated limitation of selective rather than comprehensive behavioral rescue in mice.
  notes: >-
    The mouse study did not improve every measured behavioral endpoint; hyperlocomotion and vocalization
    phenotypes were not rescued.

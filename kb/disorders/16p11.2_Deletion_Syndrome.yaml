notes: >-
  This entry covers the proximal BP4-BP5 interval. It does not combine the distal SH2B1-containing deletion
  or the much larger 16p12.2-p11.2 deletion with this syndrome. Phenotype frequencies are cohort- and
  age-dependent. Most gene-to-neurobehavioral pathways remain unresolved; clinical associations are not
  evidence for a single universal causal gene.

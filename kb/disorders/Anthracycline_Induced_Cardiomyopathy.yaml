- name: Heart-failure pharmacotherapy
  description: Treat symptomatic dysfunction or asymptomatic moderate/severe anthracycline-related dysfunction with guideline-based heart-failure therapy. ESC lists an ACE inhibitor/ARB or ARNI, beta-blocker, SGLT2 inhibitor and mineralocorticoid receptor antagonist as appropriate and tolerated, with titration and monitoring. This imports heart-failure management evidence rather than proving each drug reverses anthracycline DNA or mitochondrial injury.

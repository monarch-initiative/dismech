  downstream:
  - target: Mitochondrial Injury
    causal_link_type: DIRECT
    description: >-
      Oxidative stress damages mitochondria in a mitochondria-dense cell.
- name: Mitochondrial Injury
  description: >-
    Cardiomyocytes are among the most mitochondria-dense cells in the body, so
    injury registers first as loss of mitochondrial integrity. TOP2B knockdown
    preserves mitochondrial morphology, which places this node causally downstream
    of the trigger rather than as a parallel consequence.

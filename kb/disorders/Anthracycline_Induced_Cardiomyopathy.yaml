    reference_title: 'Atorvastatin for Anthracycline-Associated Cardiac Dysfunction: The STOP-CA Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The incidence of the primary end point was 9% (13/150) in the atorvastatin group and 22% (33/150) in the placebo group (P = .002).
    explanation: The primary endpoint was a fall of at least 10 LVEF percentage points to below 55% at 12 months, not clinical heart failure.
  - &id031
    reference: PMID:37552303
    reference_title: 'Atorvastatin for Anthracycline-Associated Cardiac Dysfunction: The STOP-CA Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There was no difference in the rates of incident heart failure between study groups (3% with atorvastatin, 6% with placebo; P = .26).
    explanation: The trial did not establish prevention of clinical heart failure; nonsignificance does not demonstrate equivalence.

    relationship: PERTURBS
    model_scale: CELLULAR
    description: Knockdown preserves sarcomere alignment in the same culture experiment.
    limitations: Shared time-point preservation does not establish a mitochondrial-to-sarcomere causal sequence or whole-heart contractile recovery.
    evidence: &id025
    - *id023
    readouts:
    - name: TEM structural preservation
      target: Sarcomere Disruption
      direction: RESTORED
      description: TOP2B knockdown attenuates the structural abnormality relative to doxorubicin exposure alone; this is partial morphological preservation.
      evidence: *id025
  notes: MTT benefit exceeds the tested dexrazoxane condition whereas LDH reduction is comparable. cTnT is a transcript readout, not blood troponin. No cancer-cell killing, in-vivo delivery or long-term safety outcome establishes clinical superiority or preservation of antitumor efficacy.
- name: Neonatal rat cardiomyocyte iron-transport perturbation
  experimental_model_type: OTHER
  description: Doxorubicin preferentially accumulates in mitochondria in this culture system. Neonatal rat cardiomyocytes are exposed to doxorubicin with ABCB8 knockdown or overexpression. Compartmental iron, cellular oxidant probes, viability and TUNEL are assessed. Separate TOP2B and ABCB8 manipulations support parallel contributions to injury.
  evidence:
  - reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: While ABCB8 siRNA did not affect baseline cellular ROS levels, it resulted in a significantly higher ROS after DOX treatment
    explanation: The culture perturbation changes the oxidant response after drug exposure.
  - reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: cell death, as assessed by MTS assay and TUNEL staining, was significantly higher after DOX treatment in response to ABCB8 silencing than in cells transfected with control siRNA
    explanation: Iron-export perturbation changes cell-injury readouts.
  - reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In isolated cardiomyocytes, doxorubicin became concentrated in the mitochondria and increased both mitochondrial iron and cellular ROS levels.
    explanation: The observed co-occurrence is retained as experimental context without imposing a causal sequestration-to-iron arrow.
  modeled_mechanisms:
  - target: Mitochondrial Iron Accumulation
    relationship: PERTURBS
    model_scale: CELLULAR
    description: Manipulation of an iron-export regulator changes compartmental iron accumulation.
    limitations: Neonatal rat cultures and short high-concentration exposure differ from adult human myocardium. These assays do not identify ferroptosis specifically or establish clinical benefit of nonspecific chelation.
    evidence:
    - *id026
    readouts:
    - name: Mitochondrial iron after ABCB8 knockdown
      target: Mitochondrial Iron Accumulation

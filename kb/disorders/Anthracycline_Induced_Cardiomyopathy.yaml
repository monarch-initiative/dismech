- name: Ventricular Remodeling
  biological_scale: TISSUE
  description: Structural changes after myocardial injury can include chamber dilation and wall thinning. These changes vary with age, treatment and follow-up; pediatric survivors may develop a restrictive pattern. Remodeling is not assumed inevitable or irreversible.
  evidence: &id006
  - reference: PMID:39479333
    reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Late onset cardiotoxicity, which becomes clinically evident more than 1 year after exposure, typically presents as hypokinetic and/or dilated cardiomyopathy with overt HF symptoms.
    explanation: The review describes a late structural and functional presentation.
  conforms_to: cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling
  locations: &id007

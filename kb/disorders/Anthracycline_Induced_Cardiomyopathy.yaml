    reference_title: "Anthracycline Chemotherapy and Cardiotoxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anthracycline chemotherapy maintains a prominent role in treating many forms
      of cancer.
    explanation: >-
      Establishes that the exposure remains in widespread current use, which is
      why the toxicity continues to matter clinically.
treatments:
- name: Dexrazoxane
  description: >-
    The only agent specifically licensed to reduce anthracycline cardiotoxicity. It
    is an iron chelator that also interferes with topoisomerase II-beta, and it acts
    on the initiating injury rather than on established remodelling, which is why it
    is given alongside the anthracycline rather than after cardiomyopathy appears.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Anthracycline Exposure and Topoisomerase II-beta-Mediated Cardiomyocyte Injury
    treatment_effect: INHIBITS
    description: >-
      Acts on the trigger node, reducing the initiating cardiomyocyte injury rather
      than opposing its downstream consequences.
  evidence:
  - reference: PMID:28185035
    reference_title: "Anthracycline Chemotherapy and Cardiotoxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardioprotective treatments are few and those that have been examined include
      renin angiotensin system blockade, beta blockers, or the iron chelator
      dexrazoxane.
    explanation: >-
      Names dexrazoxane among the examined cardioprotective strategies, and records
      honestly that the available options are few.

experimental_models:
- name: Commercial human iPSC-derived cardiomyocyte TOP2B knockdown
  experimental_model_type: OTHER
  description: Commercial CDI cardiomyocytes receive pooled TOP2B siRNAs or dexrazoxane pretreatment before 48-hour doxorubicin exposure. Knockdown improves several viability, electrical, oxidant-probe and ultrastructural readouts. It does not uniformly outperform dexrazoxane across assays or completely normalize calcium transients.
  evidence:
  - reference: PMID:40158615
    reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.

- name: Anthracycline interruption and individualized rechallenge
  description: Discontinue anthracyclines for severe symptomatic dysfunction; temporarily interrupt for moderate symptomatic or moderate/severe asymptomatic dysfunction. Mild symptomatic cases require multidisciplinary benefit-risk discussion. Mild asymptomatic dysfunction with preserved LVEF generally permits continued treatment with close monitoring and selected cardioprotection. Restarting after recovery requires an oncology-cardiology decision; dose minimization, liposomal formulation and dexrazoxane may be considered, with monitoring every 1–2 cycles. These measures do not guarantee safe rechallenge.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Discontinuation of anthracycline chemotherapy is recommended in patients with cancer who develop severe symptomatic CTRCD.
    explanation: This recommendation concerns clinical HF severity, not EF alone.
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Temporary interruption of anthracycline chemotherapy and initiation of HF therapy is recommended in patients who develop asymptomatic moderate or severe CTRCD.
    explanation: The anthracycline rule differs from the HER2-targeted therapy continuation rule.
- name: Selected ACE inhibitor or ARB and beta-blocker cardioprotection
  description: Preventive neurohormonal therapy may be considered in adults at high or very high risk. For mild asymptomatic dysfunction during anthracyclines, ACE inhibitor/ARB and/or beta-blocker consideration is stronger for a significant GLS fall or troponin rise than for isolated natriuretic-peptide elevation. Avoid hypotension. Prevention trials predominantly measure LVEF and have not established a universal mortality or overt-HF benefit.
  evidence: &id017
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT

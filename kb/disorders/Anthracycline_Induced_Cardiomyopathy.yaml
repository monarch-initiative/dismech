  description: STOP-CA was a randomized, placebo-controlled trial of atorvastatin during anthracycline-based lymphoma treatment. The primary publication reports 300 randomized adults and a lower 12-month LVEF-decline endpoint with atorvastatin, without a significant difference in clinical heart failure over 24 months.
  notes: The official registry record was checked on 2026-09-21; status was COMPLETED, with actual completion in October 2023 and last posted update in May 2025. Patients with baseline LVEF below 50% or an existing statin indication were excluded. Registry results fields label some percentage values as participant counts; outcome denominators here come from the peer-reviewed publication. The full registry JSON and the publication abstract were read; attempts to retrieve the publication full body returned access challenges.

    explanation: The DCM overview explicitly limits translation of chemotherapy-associated genetic findings.
- name: Risk-adapted cardiac surveillance
  description: Obtain baseline echocardiography before anthracyclines and reassess according to risk, cumulative exposure and new findings. ESC recommends an echocardiogram within 12 months after completion in all adults; high/very-high-risk patients require more frequent imaging and biomarkers. Continue risk-adapted survivorship follow-up because a normal early assessment does not eliminate late risk.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf

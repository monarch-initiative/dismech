  notes: HEK293T cells retain endogenous retinoic-acid receptors, which complicates the size of the allele effect. H9c2 is a rat cell line, not a patient heart. The experiment does not quantify patient-specific TOP2B-DNA complexes or prove clinical utility of genotype-guided cardioprotection.

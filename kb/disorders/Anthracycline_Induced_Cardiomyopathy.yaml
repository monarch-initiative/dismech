- name: Cardiovascular risk-factor management
  description: Assess and manage hypertension, diabetes, dyslipidemia, smoking and other modifiable risks before, during and after therapy. Coordinate oncology, cardiology and primary care; background risk and combined treatments modify vulnerability.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Management of CVRF according to the 2021 ESC Guidelines on CVD prevention in clinical practice is recommended before,
    explanation: The guideline recommends ongoing risk-factor care, without assigning a molecular target.
- name: Exercise and cardiovascular rehabilitation
  description: Individualize aerobic activity and rehabilitation to cardiac status, cancer treatment and functional capacity. This supports cardiovascular health and recovery; it does not establish reversal of the molecular injury or replace HF therapy.
  evidence:
  - reference: PMID:39479333
    reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Participating in exercise programs is known to have significant cardiac health benefits and is particularly important for cancer patients at risk of cardiotoxicity.
    explanation: The cardio-oncology review supports tailored exercise-based care.
- name: Atorvastatin prevention in selected lymphoma patients
  description: STOP-CA randomized 300 adults receiving anthracycline-based lymphoma treatment to atorvastatin 40 mg daily or placebo for 12 months. Atorvastatin reduced the prespecified LVEF-decline endpoint (13/150 versus 33/150), while incident heart failure over 24 months did not differ significantly. This supports a preventive option for selected patients with lymphoma; it does not establish benefit across all cancers, treatment of established cardiomyopathy, or mortality benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

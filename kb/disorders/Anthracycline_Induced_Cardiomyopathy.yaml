    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In all adults receiving anthracycline chemotherapy, an echocardiogram is recommended within 12 months after completing treatment.
    explanation: The guideline gives a general adult post-treatment assessment.
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In high- and very high-risk patients, echocardiography is recommended every two cycles and within 3 months after completing treatment.
    explanation: More frequent imaging is reserved for the specified risk group.
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf

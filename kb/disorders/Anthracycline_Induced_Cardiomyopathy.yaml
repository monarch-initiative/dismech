      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: cell death, as assessed by MTS assay and TUNEL staining, was significantly higher after DOX treatment in response to ABCB8 silencing than in cells transfected with control siRNA
      explanation: The ABCB8 experiment supports an additional iron-associated injury route.
- name: Increased Reactive Oxygen Species
  biological_scale: MOLECULAR
  description: Anthracycline redox cycling and mitochondrial iron can increase reactive oxygen species. The iron and TOP2B-associated transcriptional branches can converge on oxidative stress. Probe-based culture readouts do not identify every radical species or show that oxidative injury is the sole human mechanism.
  evidence:
  - reference: PMID:28185035
    reference_title: Anthracycline Chemotherapy and Cardiotoxicity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: ROS levels may also be increased by free cellular iron and potentiating ferrous-ferric cycling of molecular iron
    explanation: The review provides the chemical rationale for the iron-associated oxidant branch.
  - reference: PMID:40158615
    reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Representative images (Fig. 7A) show a marked increase in mitochondrial ROS in Dox-treated hiPSC-CMs, which was reduced with Dex and TOP2B-KD interventions.
    explanation: The human culture study measures a mitochondrial oxidant-probe signal.
  biological_processes:
  - preferred_term: reactive oxygen species biosynthetic process
    term:
      id: GO:1903409
      label: reactive oxygen species biosynthetic process
  downstream:
  - target: Mitochondrial Structural Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Oxidative injury can damage mitochondrial structure; this synthesis does not make the simultaneous probe and TEM endpoints a mediator-specific epistasis test.
    evidence:
    - reference: PMID:28185035
      reference_title: Anthracycline Chemotherapy and Cardiotoxicity.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: The doxorubicin-iron complexes form toxic radical and reac- tive nitrogen species, resulting in increased nitrosative stress and mitochondrial dysfunction [18].
      explanation: The review connects iron-associated radical production to mitochondrial injury.
- name: Mitochondrial Structural Injury
  biological_scale: CELLULAR
  description: Doxorubicin-exposed human iPSC-derived cardiomyocytes develop swollen or fragmented mitochondria and disrupted cristae. TOP2B knockdown attenuates these changes. Ultrastructure is not treated as a direct measurement of ATP production, respiratory flux or complete functional restoration.
  evidence: &id004
  - reference: PMID:40158615
    reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: TEM images (Fig. 7D) indicated fragmented and swollen mitochondria with disrupted cristae in Dox treated hiPSC-CMs, along with irregular sarcomere alignment.
    explanation: TEM resolves the mitochondrial lesion separately from the concurrent contractile-structure lesion.
  cell_types: *id003
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
- name: Sarcomere Disruption
  biological_scale: CELLULAR
  description: Irregular sarcomere alignment is a distinct ultrastructural lesion in doxorubicin-exposed human cardiomyocyte cultures. TOP2B knockdown partly preserves it. The study does not establish that mitochondrial structural injury necessarily occurs first or directly causes this lesion.
  evidence: *id004
  cell_types: *id003
  biological_processes:
  - preferred_term: sarcomere organization
    term:
      id: GO:0045214
      label: sarcomere organization
  downstream:
  - target: Reduced Ventricular Contractile Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Damage to the contractile apparatus may impair ventricular performance, but extrapolation from culture ultrastructure to patient ejection fraction is indirect.
    evidence: *id004
- name: Cardiomyocyte Death
  biological_scale: CELLULAR
  description: Loss of cardiomyocytes contributes to anthracycline injury. DNA damage and mitochondrial stress are experimentally implicated routes. TUNEL and viability assays support injury and death but do not establish a universal exclusive death program, or identify ferroptosis from iron accumulation alone.
  evidence:
  - reference: PMID:40158615
    reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: TOP2B-KD resulted in a marked decrease in the number of TUNEL-positive cells
    explanation: TOP2B perturbation reduces terminal DNA-fragmentation-positive cells.
  - *id005
  cell_types: *id003
  downstream:
  - target: Ventricular Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cumulative myocyte injury can drive maladaptive chamber remodeling through incompletely resolved tissue responses; recovery remains possible.
    evidence:
    - reference: PMID:28185035

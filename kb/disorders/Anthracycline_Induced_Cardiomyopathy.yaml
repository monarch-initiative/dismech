    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Lifelong sur- veillance for high-risk survivors is recommended.
    explanation: The survivorship section supports continued surveillance in high-risk survivors.
treatments:
- name: Dexrazoxane cardioprotection
  description: Dexrazoxane is considered before anthracycline administration for selected patients at high or very high cardiac-toxicity risk or requiring substantial cumulative exposure. ESC adult prevention guidance is broader than product-label eligibility and should not be read as a universal indication. The pediatric IGHG guideline makes a moderate recommendation when anticipated cumulative doxorubicin-equivalent exposure is at least 250 mg/m²; it makes no recommendation below that threshold because evidence is insufficient. Historical secondary-neoplasm concerns remain part of benefit-risk discussion, not proof that the drug causes such cancers. TOP2B-associated DNA damage and mitochondrial iron handling are proposed cardioprotective mechanisms, distinct from clinical proof of prevention. A later survivor follow-up analyzed 195 people from legacy trials, mostly originally randomized, with modest systolic-function differences after about 18 years. The prespecified structural measure did not differ significantly, and only 41% of potentially eligible survivors enrolled; this is incomplete protection, not proven elimination of lifetime heart-failure risk.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Dexrazoxane should be considered in adult patients with cancer at high and very high CV toxicity risk when anthracycline chemotherapy is indicated.
    explanation: ESC recommends consideration for the specified adult risk group, rather than universal administration.
  - reference: PMID:36174614
    reference_title: 'Primary cardioprotection with dexrazoxane in patients with childhood cancer who are expected to receive anthracyclines: recommendations from the International Late Effects of Childhood Cancer Guideline Harmonization Group.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the benefits of dexrazoxane probably outweigh the risk of subsequent neoplasms when the cumulative doxorubicin or equivalent dose is at least 250 mg/m2 (moderate recommendation).
    explanation: The pediatric guideline weighs benefit and uncertain harm at the stated anticipated cumulative exposure.
  - reference: PMID:36174614
    reference_title: 'Primary cardioprotection with dexrazoxane in patients with childhood cancer who are expected to receive anthracyclines: recommendations from the International Late Effects of Childhood Cancer Guideline Harmonization Group.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: No recommendation could be formulated for cumulative doxorubicin or equivalent doses of lower than 250 mg/m2
    explanation: Insufficient evidence below the threshold is not a contraindication.
  - reference: PMID:26598513
    reference_title: 'Cardioprotection and Second Malignant Neoplasms Associated With Dexrazoxane in Children Receiving Anthracycline Chemotherapy: A Systematic Review and Meta-Analysis.'
    supports: SUPPORT
    evidence_source: OTHER

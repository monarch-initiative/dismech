    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Recovery occurred in both groups, although the final mean LVEF was more depressed in patients with TTNtvs
    explanation: The full body qualifies the abstract wording about impaired recovery.
  - reference: PMID:30987448
    reference_title: Genetic Variants Associated With Cancer Therapy-Induced Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A more ideal comparison group would have been patients treated with chemotherapy who did not develop cardiomyopathy.
    explanation: The authors acknowledge the comparator limitation.
- name: CBR3
  gene_term:
    preferred_term: CBR3
    term:
      id: hgnc:1549
      label: CBR3
  relationship_type: SUSCEPTIBILITY
  notes: In a matched study of 170 childhood-cancer survivors with cardiomyopathy and 317 controls, CBR3 rs1056892 (V244M) GG was associated with greater risk than GA/AA within the 1–250 mg/m² anthracycline-exposure stratum (OR 3.30, 95% CI 1.41–7.73). High-dose exposure was associated with disease in both genotype groups. Most participants were non-Hispanic White; 114 controls lacked echocardiography, and fatal cases were excluded by survivor ascertainment. This observational result does not establish a safe dose for any genotype, population penetrance, or benefit from genotype-guided prescribing. The later CELF4 study overlapped this cohort substantially and is not independent CBR3 replication. CBR1 rs9024 (1096G>A) was a candidate susceptibility variant in the same survivor study, but the full results found no overall association. The low/moderate-dose GG association was borderline before CBR3 adjustment (OR 3.29, P=.05) and nonsignificant after adjustment (OR 2.63, P=.11). CBR1 is recorded as an investigated candidate, not an established risk determinant. Proposed effects on alcohol-metabolite production are background from prior experiments and do not prove mediation of the observed
    clinical associations.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3383117/?pdf=render
    reference_title: 'Anthracycline-Related Cardiomyopathy After Childhood Cancer: Role of Polymorphisms in Carbonyl Reductase Genes—A Report From the Children&#x27;s Oncology Group - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: One hundred seventy patient cases with cardiomyopathy and 317 matched controls participated in this study.
    explanation: Defines the selected childhood-cancer survivor case-control sample.
  - reference: PMID:22124095
    reference_title: 'Anthracycline-related cardiomyopathy after childhood cancer: role of polymorphisms in carbonyl reductase genes--a report from the Children''s Oncology Group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Among individuals with CBR3 V244M homozygous G genotypes (CBR3:GG), exposure to low- to moderate-dose anthracyclines increased cardiomyopathy risk when compared with individuals with CBR3:GA/AA genotypes unexposed to anthracyclines (OR, 5.48; P = .003), as well as exposed to low- to moderate-dose anthracyclines (OR, 3.30; P = .006).
    explanation: The abstract supplies the within-exposure CBR3 comparison; the full body and Table 4 were also reviewed.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3383117/?pdf=render

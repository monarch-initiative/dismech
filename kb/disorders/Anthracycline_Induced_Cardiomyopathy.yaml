      label: mitochondrion
  evidence:
  - reference: PMID:40158615
    reference_title: "SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      transmission electron microscopy (TEM) data revealed that TOP2B knockdown
      preserves mitochondrial morphology and sarcomere structure
    explanation: >-
      Ultrastructural evidence that mitochondrial and sarcomere integrity are
      downstream of TOP2B-mediated injury, since removing the upstream lesion
      preserves both.
  downstream:
  - target: Progressive Contractile Dysfunction
    causal_link_type: DIRECT
    description: >-
      Loss of mitochondrial and contractile-apparatus integrity reduces
      contractile reserve.
- name: Progressive Contractile Dysfunction
  description: >-
    Cumulative cardiomyocyte loss reduces left ventricular ejection fraction. The
    dose-limiting nature of this toxicity is what caps cumulative anthracycline
    exposure in treatment protocols, and because cardiomyocytes do not
    meaningfully regenerate, the deficit can declare itself years or decades after
    treatment ends in patients who were cured of their cancer.
  role: effector
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:28185035
    reference_title: "Anthracycline Chemotherapy and Cardiotoxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiotoxic side effects limit their dosing and improved cancer outcomes
      expose the cancer survivor to increased cardiovascular morbidity and
      mortality.
    explanation: >-
      Supports both the dose-limiting character of the toxicity and its
      long-term expression in cancer survivors.
environmental:
- name: Cumulative anthracycline chemotherapy exposure
  description: >-
    Exposure is therapeutic and intentional rather than accidental, which is what
    separates this from the environmental toxicant entries: the dose is known,
    recorded, and capped precisely because of this toxicity.
  exposure_term:
    preferred_term: exposure to anthracycline chemotherapy

- name: Reduced Ventricular Contractile Function
  biological_scale: ORGANISM
  description: Anthracycline-associated left ventricular systolic dysfunction may be asymptomatic or present as heart failure. It can improve with treatment, remain impaired or emerge late. Loss of myocardium, contractile-structure injury and remodeling can contribute without a single demonstrated universal sequence.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Maladaptive chamber geometry and tissue remodeling can reduce contractile performance; dysfunction can also precede marked dilation.
    evidence: *id006
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT

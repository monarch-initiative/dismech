      why the toxicity continues to matter clinically.
treatments:
- name: Dexrazoxane
  description: >-
    The only agent specifically licensed to reduce anthracycline cardiotoxicity. It
    is an iron chelator that also interferes with topoisomerase II-beta, and it acts
    on the initiating injury rather than on established remodelling, which is why it
    is given alongside the anthracycline rather than after cardiomyopathy appears.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Anthracycline Exposure and Topoisomerase II-beta-Mediated Cardiomyocyte Injury
    treatment_effect: INHIBITS
    description: >-
      Acts on the trigger node, reducing the initiating cardiomyocyte injury rather
      than opposing its downstream consequences.
  evidence:
  - reference: PMID:40970189
    reference_title: "Pharmacological interventions to prevent cardiotoxicity in patients undergoing anthracycline-based chemotherapy: a network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For reducing cardiac events, Dexrazoxane [OR = 0.28, 95% CI (0.16, 0.50)]
      and Vitamin E combined with Levocarnitine [OR = 0.27, 95% CI (0.08, 0.90)]
      were the most effective interventions.
    explanation: >-
      Network meta-analytic effect estimate for the outcome that matters
      clinically. This replaces an earlier snippet that established only that
      dexrazoxane had been examined, not that it works.
  - reference: PMID:26598513
    reference_title: "Cardioprotection and Second Malignant Neoplasms Associated With Dexrazoxane in Children Receiving Anthracycline Chemotherapy: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several randomized controlled trials (RCTs) have demonstrated that
      dexrazoxane reduces anthracycline cardiotoxicity in adults, but use in
      children has been hindered by lack of direct evidence of cardioprotection
      and concerns regarding second malignant neoplasms (SMNs).
    explanation: >-
      Retained deliberately alongside the favourable effect estimate, because it
      records that the paediatric evidence is weaker and that a second-malignancy
      concern has constrained use. An entry citing only the network meta-analysis
      would misrepresent how this drug is actually deployed. Graded SUPPORT
      because treatments[].evidence does not admit PARTIAL; the qualification
      lives in this explanation and in the treatment description.
- name: Spironolactone
  description: >-
    A mineralocorticoid receptor antagonist. In a network meta-analysis of 28
    randomised trials it produced the largest improvement in ejection fraction of
    any agent studied, acting on the remodelling response rather than on the
    initiating cardiomyocyte injury.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Ventricular Remodeling
    treatment_effect: INHIBITS
    description: >-
      Opposes the neurohormonally driven remodelling step rather than the
      topoisomerase injury upstream of it, which is why it is given for
      established dysfunction rather than as pre-exposure protection.
  evidence:
  - reference: PMID:40970189
    reference_title: "Pharmacological interventions to prevent cardiotoxicity in patients undergoing anthracycline-based chemotherapy: a network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spironolactone demonstrated the most significant improvement in (LVEF [MD =
      12.10, 95% CI (7.50, 16.70)]
    explanation: >-
      Effect estimate for ejection fraction, the parameter this entry models as
      the measurable expression of contractile dysfunction.
  - reference: PMID:40970189
    reference_title: "Pharmacological interventions to prevent cardiotoxicity in patients undergoing anthracycline-based chemotherapy: a network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      28 randomized controlled trials involving 2,858 patients were finally
      included.
    explanation: >-
      Records the size of the evidence base behind these estimates.

- name: Spironolactone prevention evidence
  description: A small randomized study of 83 women with breast cancer tested concurrent spironolactone and reported preservation of LVEF and diastolic measures. A later network meta-analysis ranked its LVEF effect highly, but small indirect comparisons and risk of bias limit ranking-based claims. This is limited primary-prevention evidence, distinct from mineralocorticoid receptor antagonists as established guideline HF therapy; no clinical superiority or direct antifibrotic effect in these patients is inferred.
  evidence: &id018
  - reference: PMID:25410653
    reference_title: Protective effects of spironolactone against anthracycline-induced cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Eighty-three female patients who were diagnosed with breast cancer were included in the study. The study population was randomized into spironolactone and control groups.
    explanation: The primary trial defines its small breast-cancer population.
  - reference: PMID:25410653
    reference_title: Protective effects of spironolactone against anthracycline-induced cardiomyopathy.
    supports: SUPPORT

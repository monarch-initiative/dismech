    snippet: 'The hiPSC-CMs procured from CDI (Cat. #R1007, FUJIFILM Cellular Dynamics Inc.) were cultured according to the manufacturer’s protocol.'
    explanation: The system is a commercial culture, not an identified multi-patient cohort.
  - &id023
    reference: PMID:40158615
    reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO

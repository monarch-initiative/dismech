- name: Liposomal anthracycline substitution
  description: When oncologically appropriate, liposomal anthracyclines can reduce cardiotoxicity through altered distribution and are an ESC consideration for high or very high risk adults. Available formulations and indications differ by cancer. This is not proof of absent cardiac risk or equivalent efficacy in every malignancy.

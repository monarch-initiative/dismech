    explanation: TEM shows attenuation of two structural lesions after siRNA pretreatment.
  - reference: PMID:40158615
    reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Treatment with Dox, Dox + Dex, and Dox + TOP2B-KD resulted in a significant decrease in transient amplitude
    explanation: The calcium-amplitude defect persists in treated groups.
  modeled_mechanisms:
  - target: Mitochondrial Structural Injury
    relationship: PERTURBS
    model_scale: CELLULAR
    description: TOP2B knockdown attenuates the ultrastructural lesion.
    limitations: No direct ATP, oxygen-consumption or biogenesis assay is reported. Donor diversity is unspecified; pooled siRNAs lack a re-expression rescue. Pretreatment addresses acute prevention, not established cardiomyopathy.
    evidence: &id024
    - *id023

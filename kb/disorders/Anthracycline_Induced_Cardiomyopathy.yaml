name: Anthracycline-Induced Cardiomyopathy
creation_date: '2026-09-01T14:00:00Z'
description: Anthracycline-induced cardiomyopathy is cardiac muscle dysfunction associated with exposure to agents such as doxorubicin, daunorubicin, epirubicin and idarubicin. Risk is related to cumulative exposure and modified by baseline cardiovascular disease, age, other cancer treatments and genetic susceptibility. Experimentally implicated pathways include TOP2B-associated DNA injury, altered mitochondrial biology and compartmental iron loading. Clinical expression ranges from asymptomatic ventricular dysfunction to heart failure, sometimes years after treatment. Recovery is possible; neither universal irreversibility nor one obligatory molecular pathway is established.
categories:
- Treatment Toxicity
- Cardiovascular Disorder
category: Complex
parents:
- Cardiomyopathy
disease_term:
  preferred_term: anthracycline-induced cardiomyopathy
  term:
    id: MONDO:0022653
    label: cardiomyopathy due to anthracyclines
updated_date: '2026-09-21T10:18:17Z'
review_notes: All six original cited sources were reviewed using the complete scientific body where available. Genuine full texts additionally cover mitochondrial iron experiments, modern cardio-oncology synthesis, pediatric dexrazoxane guidance and long-term survivor follow-up, and the applicable ESC 2022 guideline sections. The canonical TOP2B knockout, Cardinale recovery cohort and spironolactone trial remain abstract-limited after retrieval attempts. The DCM GeneReviews overview was consulted for definition and genetic context; it explicitly excludes acquired DCM from later evaluation, management and counseling sections, so these domains are supplied by anthracycline-specific guidance. Experimental concentrations, prevention designs and human cohort denominators are retained locally. No general disease frequency is inferred from selected exposed or cardiomyopathy cohorts. Arrhythmias can accompany anthracycline exposure or established heart failure, but this entry centers on myocardial dysfunction; it does not treat every acute rhythm toxicity as cardiomyopathy. Treatment drug classes and the liposomal carrier are explicitly annotated. The ESC guideline retains its complete, already
  audited PDF quotation source, with its canonical PMID, DOI and publisher record identified in the bibliography.
pathophysiology:
- name: Anthracycline-TOP2B-DNA Complex Formation
  biological_scale: MOLECULAR
  description: Anthracyclines interfere with TOP2B-associated DNA cleavage and religation in cardiomyocytes. The drug-enzyme-DNA complex is distinguished from the ensuing DNA lesion and cell death. TOP2B contributes to cardiac injury in experimental systems; its expression does not imply that all cardiac toxicity follows one obligatory pathway.
  evidence: &id029
  - reference: PMID:39479333
    reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Anthracyclines target the Top2b-cleaved DNA complex, causing accumulation of double-strand DNA breaks and subsequent apoptosis.
    explanation: The mechanistic synthesis identifies the TOP2B-associated DNA complex and its downstream damage.
  role: trigger
  conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
  cell_types: &id003
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: DNA Double-Strand Break Accumulation
    causal_link_type: DIRECT
    description: Interference with the TOP2B-DNA cleavage complex prevents normal resolution of enzyme-associated breaks.
    evidence:
    - reference: PMID:39479333
      reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Anthracyclines target the Top2b-cleaved DNA complex, causing accumulation of double-strand DNA breaks and subsequent apoptosis.
      explanation: The review directly links the targeted complex to accumulated breaks.
  - target: Impaired Mitochondrial Biogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: TOP2B-dependent transcriptome changes connect the initiating drug interaction to impaired mitochondrial biogenesis; individual transcriptional intermediates are not resolved in this entry.
    evidence: &id001
    - reference: PMID:23104132
      reference_title: Identification of the molecular basis of doxorubicin-induced cardiotoxicity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: transcriptome changes that are responsible for defective mitochondrial biogenesis and ROS formation.
      explanation: The primary abstract reports transcription-associated impairment; detailed dosing and transcriptional mediators are not available in its cache.
  - target: Mitochondrial Structural Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: TOP2B knockdown attenuates the mitochondrial lesion, supporting a contribution through unresolved downstream mediators. Shared endpoints do not establish a strict sequence through every mapped mitochondrial process.
    evidence:
    - reference: PMID:40158615
      reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: TOP2B knockdown preserves mitochondrial morphology and sarcomere structure
      explanation: Perturbation supports TOP2B involvement but not a serial ordering of the two structural lesions.
  - target: Sarcomere Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: TOP2B depletion attenuates sarcomere injury in culture; the downstream mediators remain unresolved.
    evidence:
    - reference: PMID:40158615
      reference_title: SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: TOP2B knockdown preserves mitochondrial morphology and sarcomere structure
      explanation: The intervention affects both readouts without ordering them.
  - target: Increased Reactive Oxygen Species
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: TOP2B-dependent transcriptome changes are associated with ROS formation in the mouse experiment. The source does not establish impaired biogenesis as the mediator of ROS, so these outcomes are parallel downstream branches.
    evidence: *id001
- name: DNA Double-Strand Break Accumulation
  biological_scale: MOLECULAR
  description: Persistent TOP2B-associated DNA lesions accumulate after doxorubicin exposure. Cardiomyocyte-specific Top2b deletion protects against these breaks in mice. TUNEL in the separate human cardiomyocyte culture study measures terminal fragmentation and is not used as a direct assay of the initiating double-strand break.
  evidence:
  - reference: PMID:23104132
    reference_title: Identification of the molecular basis of doxorubicin-induced cardiotoxicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: cardiomyocyte-specific deletion of Top2b (encoding topoisomerase-IIβ) protects cardiomyocytes from doxorubicin-induced DNA double-strand breaks
    explanation: The genetic mouse experiment implicates TOP2B in the initial DNA injury.
  downstream:
  - target: Cardiomyocyte Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Persistent DNA injury can engage downstream death responses; the mapped evidence does not isolate one necessary p53 or caspase sequence.
    evidence:
    - reference: PMID:39479333
      reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Anthracyclines target the Top2b-cleaved DNA complex, causing accumulation of double-strand DNA breaks and subsequent apoptosis.
      explanation: The synthesis links accumulated DNA breaks to apoptosis through downstream signaling.
- name: Impaired Mitochondrial Biogenesis
  biological_scale: CELLULAR
  description: Doxorubicin-induced, TOP2B-dependent transcriptional changes impair mitochondrial biogenesis in the genetic mouse study. This process is separate from iron accumulation and ultrastructural injury; the later human siRNA culture study did not measure biogenesis or respiratory flux.
  evidence: *id001
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
- name: Reduced ABCB8 Expression
  biological_scale: MOLECULAR
  description: Doxorubicin reduces the abundance of the mitochondrial iron-export regulator ABCB8 in neonatal rat cardiomyocytes and mouse hearts. The data implicate regulation at the mRNA level; direct binding of doxorubicin to the ABCB8 promoter or a measured transport-blocking interaction is not established.
  evidence: &id030
  - reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: DOX significantly reduced the mRNA and protein levels of ABCB8
    explanation: The culture and mouse expression data establish reduced abundance.
  - reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: These results suggest that DOX regulates ABCB8 at the mRNA level and that this regulation is independent of cytotoxic effects of the drug.
    explanation: The experiment localizes the regulatory effect to mRNA-level expression rather than proving direct promoter binding.
  downstream:
  - target: Mitochondrial Iron Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Lower ABCB8 abundance can reduce iron export and favor mitochondrial retention. Knockdown and overexpression support this route without proving the complete export machinery.
    evidence:
    - &id026
      reference: PMID:24382354
      reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: In the presence of DOX, ABCB8 siRNA resulted in a fur- ther increase in mitochondrial iron levels
      explanation: ABCB8 depletion increases the mitochondrial iron measurement under doxorubicin exposure.
    - reference: PMID:24382354
      reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Overexpression of ABCB8, a mitochondrial protein that facilitates iron export, in vitro and in the hearts of transgenic mice decreased mitochondrial iron
      explanation: Gain of expression lowers the measured mitochondrial iron pool.
- name: Mitochondrial Iron Accumulation
  biological_scale: CELLULAR
  description: Doxorubicin exposure increases mitochondrial iron in cardiomyocyte cultures and mouse hearts. ABCB8 manipulation supports a contribution of impaired export. Human transplant explants show the same compartmental association, but the small end-stage series cannot establish temporal causation or a clinical iron-removal treatment effect.
  evidence:
  - &id002
    reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Overexpression of ABCB8, a mitochondrial protein that facilitates iron export, in vitro and in the hearts of transgenic mice decreased mitochondrial iron and cellular ROS
    explanation: The culture and transgenic experiments test iron export as a modifiable process.
  - reference: PMID:24382354
    reference_title: Cardiotoxicity of doxorubicin is mediated through mitochondrial iron accumulation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: hearts from patients with doxorubicin-induced cardiomyopathy had markedly higher mitochondrial iron levels than hearts from patients with other types of cardiomyopathies or normal cardiac function.
    explanation: The explant comparison is human tissue association, not an intervention trial.
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Increased Reactive Oxygen Species
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: An expanded mitochondrial iron pool can promote iron-dependent redox reactions. ABCB8 manipulation lowers both iron and oxidant readouts; these experiments do not resolve every reaction or exclude parallel sources.
    evidence:
    - *id002
  - target: Cardiomyocyte Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ABCB8-dependent iron handling modifies culture injury, with oxidative and other mitochondrial intermediates unresolved.
    evidence:

    reference_title: Early detection of anthracycline cardiotoxicity and improvement with heart failure therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Twenty-five (11%) patients had full recovery, and 160 (71%) patients had partial recovery.
    explanation: The cohort distinguishes return to baseline from partial improvement.

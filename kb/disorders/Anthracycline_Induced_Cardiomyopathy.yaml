    snippet: the interaction of LVEF decrease between groups was significantly lower in the spironolactone group than in the control group (P < 0.001).
    explanation: The endpoint is a ventricular-function comparison, not mortality.
  - reference: PMID:40970189
    reference_title: 'Pharmacological interventions to prevent cardiotoxicity in patients undergoing anthracycline-based chemotherapy: a network meta-analysis.'
    supports: SUPPORT

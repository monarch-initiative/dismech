name: Anthracycline-Induced Cardiomyopathy
creation_date: '2026-09-01T14:00:00Z'
description: >-
  Anthracycline-induced cardiomyopathy is a treatment-toxicity cardiomyopathy caused
  by cumulative exposure to anthracycline chemotherapy (doxorubicin, daunorubicin,
  epirubicin, idarubicin). It is the archetypal dose-limiting cardiotoxicity of
  cytotoxic cancer therapy, and it is the reason cumulative anthracycline dose is
  capped in treatment protocols. Cardiomyocytes are injured through topoisomerase
  II-beta-mediated DNA damage and mitochondrial dysfunction rather than through the
  proliferative mechanism that makes anthracyclines effective against tumour cells,
  which is why the heart is preferentially affected. The resulting cardiomyocyte loss
  drives the conserved maladaptive remodelling sequence shared by structural
  cardiomyopathies, producing progressive contractile dysfunction and heart failure
  that may present years or decades after treatment ends.
categories:
- Treatment Toxicity
- Cardiovascular Disorder
category: Complex
parents:
- Cardiomyopathy
disease_term:
  preferred_term: anthracycline-induced cardiomyopathy
  term:
    id: MONDO:0022653
    label: cardiomyopathy due to anthracyclines
pathophysiology:
- name: Anthracycline Exposure and Topoisomerase II-beta-Mediated Cardiomyocyte Injury
  description: >-
    Cumulative anthracycline exposure injures cardiomyocytes through two direct
    routes: reactive oxygen species generation, and interference with
    topoisomerase II. The cardiac selectivity comes from the isoform. Proliferating
    tumour cells express topoisomerase II-alpha, which is what makes anthracyclines
    effective; quiescent cardiomyocytes express topoisomerase II-beta instead, and it
    is disruption of that isoform that drives cardiac damage. Silencing TOP2B in human
    iPSC-derived cardiomyocytes reduces doxorubicin-induced apoptosis and preserves
    mitochondrial and sarcomere structure, which is the evidence that the isoform is
    causal rather than incidental.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:40158615
    reference_title: "SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Doxorubicin (Dox) is a potent chemotherapeutic agent, but its use is limited
      by cardiotoxicity, primarily due to the disruption of Topoisomerase-2 beta
      (TOP2B) activity.
    explanation: >-
      Names topoisomerase II-beta disruption as the primary route to
      anthracycline cardiotoxicity, which is what distinguishes the cardiac
      target from the topoisomerase II-alpha antitumour target.
  - reference: PMID:40158615
    reference_title: "SiRNA-mediated knockdown of TOP2B protects hiPSC-derived cardiomyocytes from doxorubicin-induced toxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results demonstrate that TOP2B silencing significantly decreases
      apoptosis and improved cell viability, as compared to the Dex treatment.
    explanation: >-
      Loss-of-function evidence in human iPSC-derived cardiomyocytes that TOP2B
      is causal for the apoptotic injury, not merely associated with it.
  - reference: PMID:28185035
    reference_title: "Anthracycline Chemotherapy and Cardiotoxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The basic mechanisms of cardiotoxicity may involve direct pathways for
      reactive oxygen species generation and topoisomerase 2 as well as other
      indirect pathways.
    explanation: >-
      Independent review placing reactive oxygen species and topoisomerase 2
      alongside one another as the direct mechanisms, supporting a node that
      carries both rather than either alone.
  downstream:
  - target: Mitochondrial Injury and Sarcomere Disruption
    causal_link_type: DIRECT
    description: >-
      Topoisomerase II-beta disruption and oxidative stress damage mitochondria
      and the contractile apparatus.
- name: Mitochondrial Injury and Sarcomere Disruption
  description: >-
    Cardiomyocytes are among the most mitochondria-dense cells in the body, so
    oxidative and topoisomerase-mediated injury registers first as loss of
    mitochondrial integrity and disorganisation of the sarcomere. Preserving both
    is what TOP2B knockdown achieves, which places this node causally downstream of
    the trigger rather than as a parallel consequence.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:
  - preferred_term: mitochondrion
    term:

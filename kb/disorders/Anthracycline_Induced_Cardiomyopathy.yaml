diagnosis:
- name: Integrated clinical and cardiac assessment
  description: Evaluate new cardiac symptoms and signs in the context of anthracycline dose, timing, other cancer treatments and baseline cardiovascular disease. Integrate imaging and biomarkers and consider alternative cardiac or systemic explanations. Cancer therapy-related cardiac dysfunction includes subclinical injury and is broader than established symptomatic cardiomyopathy.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: dysfunction includes new CV symptoms, new abnormalities in cardiac function on CV imaging
    explanation: The diagnosis integrates the clinical, imaging and biomarker picture.
- name: Echocardiography and global longitudinal strain
  description: Compare LVEF and GLS with baseline, using the same modality and strain vendor when possible. ESC asymptomatic severe dysfunction is a new LVEF below 40%; moderate dysfunction is a decline of at least 10 percentage points to 40–49%, or a smaller decline to that range with a new relative GLS fall over 15% or biomarker rise. Mild dysfunction requires LVEF at least 50% plus a new relative GLS fall over 15% and/or a biomarker rise. Symptomatic severity is graded clinically and is not interchangeable with these EF strata.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Current deﬁnitions of CTRCD are based on a reduction of LVEF and/or relative changes in global longitudinal strain (GLS)
    explanation: The guideline uses functional change rather than a single universal EF threshold.
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: New LVEF reduction by ≥10 percentage points to an LVEF of 40–49%
    explanation: This is one of the moderate asymptomatic criteria.
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: to use the same vendor to analyse GLS during cancer treatment to accurately compare values over time.
    explanation: Consistent acquisition and analysis reduce measurement variability.
- name: Cardiac magnetic resonance when echocardiography is limited
  description: CMR can clarify ventricular function when echocardiographic images are inadequate or borderline and can characterize tissue when a specific alternative diagnosis is suspected. Tissue iron or fibrosis measurements do not by themselves establish anthracycline causation.
  evidence:
  - reference: PMID:39479333
    reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: CMR is mainly used for evaluating LVEF when echocardiography is limited by a poor acoustic window or provides borderline values
    explanation: The review identifies an adjunctive clinical indication.
- name: Assessment of inherited cardiomyopathy susceptibility
  description: 'Family history and the cardiac phenotype may prompt a cardiomyopathy genetics assessment. RARG and TTN findings do not establish a universal predictive panel: ESC 2022 does not recommend routine genetic testing solely to assess cardiac-toxicity risk before cancer therapy. The DCM GeneReviews overview recognizes an emerging genetic contribution to chemotherapy-associated DCM but explicitly excludes acquired DCM from its later evaluation and counseling recommendations.'
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Routine use of genetic testing for the assessment of CTR-CVT risk prior to initiation of cancer therapy is not currently recommended.
    explanation: The guideline limits routine pre-treatment susceptibility testing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/
    reference_title: Dilated Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER

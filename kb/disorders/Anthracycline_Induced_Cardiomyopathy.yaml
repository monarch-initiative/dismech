    term:
      id: hgnc:9866
      label: RARG
  relationship_type: SUSCEPTIBILITY
  notes: RARG rs2229774 (p.Ser427Leu) was associated with cardiotoxicity after treatment for childhood cancer. The discovery and replication groups contained 280, 96 and 80 participants, with 73 cases among 456 in the combined selected sample. The reported adjusted per-allele odds ratio was 4.7, distinct from a carrier-versus-noncarrier estimate. Non-European replication was small and had no variant carriers among controls. HEK293T reporter and rat H9c2 transfection studies support altered receptor function and weaker Top2b repression; they are not patient-heart measurements or a validated treatment-selection test.
  evidence:
  - reference: PMID:26237429
    reference_title: A coding variant in RARG confers susceptibility to anthracycline-induced cardiotoxicity in childhood cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We identified a nonsynonymous variant (rs2229774, p.Ser427Leu) in RARG highly associated with ACT
    explanation: The childhood case-control study establishes a susceptibility association.
  - reference: PMID:26237429
    reference_title: A coding variant in RARG confers susceptibility to anthracycline-induced cardiotoxicity in childhood cancer.

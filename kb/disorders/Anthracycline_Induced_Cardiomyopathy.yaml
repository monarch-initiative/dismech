phenotypes:
- name: Reduced left ventricular ejection fraction
  description: Systolic dysfunction is a central measurable manifestation. It may initially be asymptomatic and can improve; mild cancer therapy-related dysfunction may instead have preserved ejection fraction with new strain or biomarker abnormalities.
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: New LVEF reduction by ≥10 percentage points to an LVEF of 40–49%
    explanation: The guideline provides one moderate asymptomatic dysfunction criterion, rather than a universal threshold for all cardiac injury.
- name: Dilated cardiomyopathy
  description: Some patients develop a dilated, hypokinetic ventricular phenotype, including late presentations. It is not required for every stage of anthracycline-related dysfunction.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:39479333
    reference_title: 'Anthracycline Cardiotoxicity in Adult Cancer Patients: JACC: CardioOncology State-of-the-Art Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Late onset cardiotoxicity, which becomes clinically evident more than 1 year after exposure, typically presents as hypokinetic and/or dilated cardiomyopathy with overt HF symptoms.
    explanation: The review describes the late dilated phenotype.
- name: Congestive heart failure
  description: Symptomatic pump failure can occur during treatment or later in survivorship, but asymptomatic dysfunction does not invariably progress to heart failure.

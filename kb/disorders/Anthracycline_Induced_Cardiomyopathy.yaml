    explanation: A transfected reporter assay measures partial functional alteration, not human clinical receptor activity.
- name: TTN
  gene_term:
    preferred_term: TTN
    term:
      id: hgnc:12403
      label: TTN
  relationship_type: SUSCEPTIBILITY
  notes: TTN truncating variants were present in 16/213 selected cancer therapy-related cardiomyopathy cases (7.5%); 90% had anthracycline exposure and some adults also received trastuzumab. This is neither population penetrance nor an anthracycline-only prevalence. TCGA comparator cardiac status and individual treatment exposure were not established. Adult carriers had more heart-failure admissions and atrial fibrillation and a lower mean final LVEF; recovery occurred in both groups and recovery occurrence was not significantly correlated with TTN status. A heterozygous A-band mouse model supports prolonged dysfunction after doxorubicin.
  evidence:
  - reference: PMID:30987448
    reference_title: Genetic Variants Associated With Cancer Therapy-Induced Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: TTNtvs were identified in 16 of 213 CCM cases (7.5%)
    explanation: The numerator and denominator belong to selected mixed-treatment cases.
  - reference: PMID:30987448

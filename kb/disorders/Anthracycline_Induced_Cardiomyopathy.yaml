- name: CELF4
  gene_term:
    preferred_term: CELF4
    term:
      id: hgnc:14015
      label: CELF4
  relationship_type: SUSCEPTIBILITY
  notes: A two-step genome-wide gene-by-dose analysis implicated rs1786814 in 331 non-Hispanic White childhood-cancer survivors after quality control (112 cases, 219 controls). No marginal SNP association passed the study threshold. The reported 10.16-fold odds ratio compares GG with >300 mg/m² exposure against GA/AA with ≤300 mg/m², changing both genotype and dose. Replication included 54 cases without controls and tested genotype-dose association, not the same disease-risk contrast. In 33 healthy heart samples, embryonic/adult TNNT2 isoform coexpression was observed in 19/21 GG versus 5/12 GA/AA samples. This supports a molecular association; neither variant perturbation nor anthracycline-exposed myocardial contractility was measured. Clinical prediction and treatment selection remain unvalidated.
  evidence:
  - reference: PMID:26811534
    reference_title: 'CELF4 Variant and Anthracycline-Related Cardiomyopathy: A Children''s Oncology Group Genome-Wide Association Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No SNP was marginally associated with cardiomyopathy. However, SNP rs1786814 on the CELF4 gene passed the significance cutoff for gene-environment interaction (Pge = 1.14 × 10(-5)).
    explanation: The discovery result concerns gene-by-exposure interaction rather than a marginal genome-wide disease association.
  - reference: PMID:26811534
    reference_title: 'CELF4 Variant and Anthracycline-Related Cardiomyopathy: A Children''s Oncology Group Genome-Wide Association Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Compared with cases who had GA/AA genotype, the odds of cases who had the GG genotype being in the greater-than–300-mg/m2 versus the 300-mg/m2 –or-less anthracycline group were 5.09 times higher
    explanation: The replication comparison is explicitly restricted to cases and dose category.
  - reference: PMID:26811534
    reference_title: 'CELF4 Variant and Anthracycline-Related Cardiomyopathy: A Children''s Oncology Group Genome-Wide Association Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'The embryonic splicing variant of TNNT2 was found in 24 of the 33 heart samples and was more likely to coexist with the adult TNNT2 splicing variant in hearts homozygous for the high-risk rs1786814 genotype (GG: 19 (90.5%) of 21 samples; GA/AA: 5 (41.7%) of 12 samples; P = .005, Fisher’s exact test; Data Supplement).'
    explanation: Healthy-heart tissue associates genotype with isoform coexpression; it does not directly test a drug-injury mechanism.
progression:
- phase: Variable onset and clinical expression
  notes: Injury can become apparent during treatment, within the first year, or years later. The dose, age, coexisting cardiovascular disease and additional therapies modify risk. A closely monitored 2625-person cohort detected 226 cases (9%), 98% of them within the first year; this cohort observation does not exclude late disease or establish a general population incidence.
  evidence:
  - reference: url:https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    reference_title: https://cardio-onco.fr/wp-content/uploads/2023/06/ehac244.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Anthracycline-induced CTRCD is a dose-dependent and cumulative process of variable onset that may present with symptomatic or asymptomatic CTRCD.
    explanation: The guideline recognizes variable timing and symptom status.
  - reference: PMID:25948538
    reference_title: Early detection of anthracycline cardiotoxicity and improvement with heart failure therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The overall incidence of cardiotoxicity was 9% (n=226).
    explanation: The estimate comes from the particular serial-monitoring cohort.
- phase: Recovery or persistent dysfunction
  notes: Anthracycline cardiomyopathy is not uniformly irreversible. In the serial-monitoring cohort, prompt heart-failure treatment was followed by full recovery in 11% and partial recovery in 71% of affected patients. These observational results lack a randomized untreated comparator and do not guarantee recovery. Childhood survivors can later develop a restrictive physiological pattern despite periods of compensated systolic function.
  evidence:

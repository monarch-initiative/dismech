    series across Hispanic/Native American, Korean, Japanese, Chinese, and
    other ancestries), distinct from the population-based prevalence figures
    available for classical LHON (see the sibling Leber_Hereditary_Optic_
    Neuropathy.yaml entry).
  evidence:
  - reference: PMID:31776719
    reference_title: "Leber hereditary optic neuropathy plus dystonia, and transverse myelitis due to double mutations in MT-ND4 and MT-ND6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of LHON with spastic dystonia (LDYT) is also rare (OMIM#500001)"
    explanation: States directly that LDYT is a rare presentation, distinct from classical LHON.

diagnosis:
- name: Targeted then Complete mtDNA Sequencing with Heteroplasmy Quantification
  description: >
    Diagnosis rests on identifying a complex I mtDNA variant, most often
    m.14459G>A in MT-ND6, in a proband with optic neuropathy and/or dystonia
    plus bilateral basal ganglia lesions. Because mutant load can differ
    substantially between tissues, testing more than one accessible tissue
    (blood, urine sediment, buccal mucosa, or skin fibroblasts) is important
    when a low-level or discordant heteroplasmy result is suspected, rather
    than relying on blood alone.
  evidence:
  - reference: PMID:28503604
    reference_title: "A De Novo Mutation in MTND6 Causes Generalized Dystonia in 2 Unrelated Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heteroplasmy level in the urinary sediment was 91% and in buccal mucosa 89% in patient 1, but in patient 2 the heteroplasmy level was 59% in fibroblasts."
    explanation: Documents markedly tissue-dependent heteroplasmy levels for the m.14459G>A variant across urine sediment, buccal mucosa, and fibroblasts, supporting multi-tissue testing.
  - reference: PMID:28503604
    reference_title: "A De Novo Mutation in MTND6 Causes Generalized Dystonia in 2 Unrelated Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total DNA was extracted from skeletal muscle, skin fibroblasts, blood, urinary sediment, and buccal smears"
    explanation: Documents the panel of accessible tissues sampled for mtDNA heteroplasmy testing in genetically confirmed cases.
- name: Targeted mtDNA Testing for the Three Common LHON Variants First
  description: >
    Because the three common LHON mtDNA variants account for the great
    majority of molecularly diagnosed LHON, targeted testing for these
    should be performed first even when dystonia or basal ganglia disease
    accompanies the optic neuropathy; only when this is negative does
    testing proceed to complete mtDNA sequencing that can detect m.14459G>A
    and other rare complex I loci.
  evidence:
  - reference: PMID:36317462
    reference_title: "The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "92% (184/199) carrying one of the three main pathogenic variants of mitochondrial DNA (m.11778G>A, 66.5%; m.3460G>A, 15% and m.14484T>C, 11%)"
    explanation: Quantifies that the three common LHON variants explain the great majority of molecularly diagnosed LHON, supporting them as the appropriate first-line targeted test before broader mtDNA sequencing that would detect rarer LDYT-associated loci.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of LHON is established in a proband with a consistent clinical history and/or one of three common mitochondrial DNA (mtDNA) pathogenic variants identified on molecular genetic testing."
    explanation: GeneReviews defines the general LHON diagnostic basis around the three common variants; recorded PARTIAL because LDYT commonly requires testing beyond those three, which is exactly the nuance captured by this entry's first diagnosis entry.

treatments:
- name: Idebenone
  description: >
    A short-chain quinone that can bypass a defective complex I by
    accepting electrons via NQO1 and delivering them downstream to complex
    III. It is authorised for LHON generally (EMA, exceptional
    circumstances) but its benefit has not been separately established for
    the LDYT/dystonia phenotype specifically.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  evidence:
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Idebenone (Raxone\u00ae) has been approved for the treatment of LHON by the European Medicines Agency under exceptional circumstances."
    explanation: GeneReviews documents EMA approval and some visual benefit for idebenone in LHON generally; recorded as PARTIAL because the benefit is established for LHON broadly, not specifically for the LDYT/dystonia phenotype modeled in this entry.
- name: Oral Dystonia Pharmacotherapy Trial
  description: >
    Empiric oral dystonia agents (levodopa, baclofen, tizanidine) have been
    trialed in LDYT; non-response has been documented in at least one
    genetically confirmed case, consistent with LDYT being a
    non-dopa-responsive dystonia. This contrasts with the symptomatic relief
    obtained from botulinum toxin and deep brain stimulation in other
    reported cases.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40190371
    reference_title: "Adult-Onset Bilateral Optic Neuropathy in a Patient with Non-Familial Childhood-Onset Generalized Dystonia Associated with Mitochondrial DNA 14459G>A Mutation: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her generalized dystonia was non-responsive to L-dopa, baclofen, and tizanidine treatment trials."
    explanation: Documents non-response to standard oral dystonia agents in a genetically confirmed m.14459G>A LDYT patient, the negative but clinically informative finding behind the description's non-dopa-responsive characterization.
- name: Visual Aids and Occupational Rehabilitation
  description: >
    General LHON supportive care (visual aids, occupational rehabilitation,
    and registration with relevant social services) is the standard
    management for the optic-neuropathy branch of LDYT, extrapolated from
    LHON overall since no LDYT-specific supportive-care study exists.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Management of affected individuals remains mostly supportive, and includes provision of visual aids, occupational rehabilitation, and registration with the relevant social services."
    explanation: GeneReviews' general LHON supportive-care recommendation; recorded PARTIAL because it is written for LHON overall rather than demonstrated specifically in LDYT.
- name: Multidisciplinary Management of Extraocular Neurologic Features
  description: >
    A multidisciplinary approach (neurology, physical/occupational therapy,
    and cardiology) is recommended for the extraocular neurologic features
    of LHON-plus disease, which is directly on point for LDYT since its
    defining feature is extraocular (dystonia, ataxia, peripheral
    neuropathy). Cardiology referral is additionally recommended for any
    LHON-causing mtDNA variant carrier found to have pre-excitation on EKG.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A multidisciplinary approach for those affected individuals with extraocular neurologic features (ataxia, peripheral neuropathy, nonspecific myopathy, and movement disorders) should be considered to minimize the functional consequences of these complications."
    explanation: GeneReviews recommends multidisciplinary management specifically for the extraocular neurologic features that define LHON-plus disease, directly applicable to LDYT's dystonia/ataxia presentation.
  - reference: PMID:20301353
    reference_title: "Leber Hereditary Optic Neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Referral to a cardiologist for individuals with pre-excitation syndrome on EKG is recommended; treatment for symptomatic individuals is per standard practice."
    explanation: GeneReviews' general LHON recommendation for cardiology referral on EKG pre-excitation; recorded PARTIAL because it is written for LHON overall rather than demonstrated specifically in LDYT pedigrees.
- name: Botulinum Toxin Injection
  description: >
    Used for symptomatic relief of focal or segmental dystonic posturing,
    for example of the arm, in LDYT patients with generalized dystonia.
  treatment_term:
    preferred_term: botulinum toxin therapy
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
  evidence:
  - reference: PMID:28503604
    reference_title: "A De Novo Mutation in MTND6 Causes Generalized Dystonia in 2 Unrelated Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he has received significant symptomatic relief with Botox injections"
    explanation: Documents symptomatic benefit from botulinum toxin injection for dystonic limb posturing in a genetically confirmed m.14459G>A case.
- name: Globus Pallidus Internus Deep Brain Stimulation
  description: >
    Considered for medically refractory generalized dystonia in LDYT,
    extrapolated from its established use in other genetic and idiopathic
    dystonias; no LDYT-specific response rate has been established.
  treatment_term:
    preferred_term: deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  evidence:
  - reference: PMID:40190371
    reference_title: "Adult-Onset Bilateral Optic Neuropathy in a Patient with Non-Familial Childhood-Onset Generalized Dystonia Associated with Mitochondrial DNA 14459G>A Mutation: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she was implanted with a Bilateral Globus Pallidus Internal Deep Brain Stimulator (DBS) at age 15 years"
    explanation: Documents bilateral globus pallidus internus DBS used to manage refractory generalized dystonia in a genetically confirmed m.14459G>A LDYT patient.


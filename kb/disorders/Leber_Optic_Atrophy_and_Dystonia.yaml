      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The positive diagnosis rate in individuals referred for Leber hereditary optic neuropathy testing was 18% (199/1126 index cases), with 92% (184/199) carrying one of the three main pathogenic variants of mitochondrial DNA (m.11778G>A, 66.5%; m.3460G>A, 15% and m.14484T>C, 11%)."
      explanation: Establishes that m.14459G>A LDYT-type optic neuropathy is a rare residual fraction of diagnosed LHON, distinguishing it as a mechanistically related but numerically minor variant class within the same clinical endpoint.

- name: Striatal Neurodegeneration and Bilateral Basal Ganglia Necrosis

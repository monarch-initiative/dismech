  description: >
    Bilateral, usually symmetric degeneration of the caudate nucleus and
    putamen produces the neuroimaging hallmark of LDYT: bilateral basal
    ganglia lucencies on CT or MRI, which can progress to frank necrosis.
    This lesion is the anatomical substrate for the disease's dystonic and
    associated pyramidal/bulbar features.

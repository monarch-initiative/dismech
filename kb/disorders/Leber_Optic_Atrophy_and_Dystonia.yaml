      snippet: "Brain MRI showed the presence of bilateral symmetric tissue losses in both the putamen and caudate nucleus"
      explanation: Documents the specific striatal structures (putamen and caudate nucleus) affected by bilateral necrosis.

- name: Retinal Ganglion Cell Degeneration and Optic Atrophy
  biological_scale: TISSUE
  description: >
    As in classical LHON, retinal ganglion cell loss produces progressive
    optic nerve atrophy and permanent central visual impairment. Optic
    atrophy and increased T2 signal on optic-nerve/orbital MRI are the
    imaging correlates, and central scotoma with dyschromatopsia are the
    characteristic visual-field and color-vision consequences when this
    branch of the disease is expressed.

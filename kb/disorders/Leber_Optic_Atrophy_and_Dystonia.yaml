    reference_title: "Variable clinical manifestation of homoplasmic G14459A mitochondrial DNA mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of the brain demonstrated bilateral, symmetric basal ganglia lucencies associated with cerebral and systemic lactic acidosis."
    explanation: Documents the clinical redox/metabolic correlate (lactic acidosis) accompanying the basal ganglia lesions.
  downstream:
  - target: Tissue-Selective Neuronal Bioenergetic Vulnerability
    description: >
      A generalized, systemic bioenergetic deficit is converted into a
      tissue-restricted disease by the disproportionate vulnerability of
      specific long-axon, high-energy-demand neuronal populations.
    evidence:
    - reference: PMID:19001017
      reference_title: "Inherited mitochondrial optic neuropathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The selective vulnerability of retinal ganglion cells (RGCs)"
      explanation: Establishes the general principle of selective neuronal vulnerability underlying mitochondrial optic neuropathies, which LDYT extends to a second, striatal cell population.

- name: Tissue-Selective Neuronal Bioenergetic Vulnerability
  biological_scale: CELLULAR
  description: >
    Two neuronal populations with disproportionately high, spatially
    distributed ATP demand are selectively vulnerable to the complex I
    defect: retinal ganglion cells, whose long, partly unmyelinated
    intraretinal axons (as in classical LHON) impose an especially high
    energy burden, and striatal projection neurons of the basal ganglia.
    Why these two populations specifically decompensate, while most other
    tissues remain clinically unaffected, is not fully resolved, but tissue-
    and cell-type-specific mutant load (heteroplasmy) is the best-supported
    explanation: a Japanese series found homoplasmic mutant load producing
    infantile dystonia while a heteroplasmic variant of the same mutation
    produced later-onset truncal ataxia and parkinsonism, and involvement of
    the visual pathway is generally a later event than dystonia in patients
    who develop both.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  - preferred_term: Medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:40190371
    reference_title: "Adult-Onset Bilateral Optic Neuropathy in a Patient with Non-Familial Childhood-Onset Generalized Dystonia Associated with Mitochondrial DNA 14459G>A Mutation: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was seen in a Japanese series with homoplasmic mutations resulting in infantile dystonia and heteroplasmic variant showing a later juvenile onset truncal ataxia and parkinsonism."
    explanation: Supports tissue- and load-dependent selective vulnerability as the basis for divergent phenotypes from the same mtDNA variant.
  - reference: PMID:40190371
    reference_title: "Adult-Onset Bilateral Optic Neuropathy in a Patient with Non-Familial Childhood-Onset Generalized Dystonia Associated with Mitochondrial DNA 14459G>A Mutation: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The involvement of visual pathways in 14459G>A-mutated patients is generally a later event in contrast to dystonia that develops in the early childhood."
    explanation: Documents the differential temporal vulnerability of the two affected neuronal populations.
  downstream:
  - target: Retinal Ganglion Cell Degeneration and Optic Atrophy
    description: >
      In individuals whose bioenergetic threshold is crossed in the visual
      pathway, retinal ganglion cells degenerate, producing optic atrophy
      and central vision loss.
    evidence:
    - reference: PMID:32045392
      reference_title: "Clinical Features of Chinese Sporadic Leber Hereditary Optic Neuropathy Caused by Rare Primary mtDNA Mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient with LHON plus dystonia demonstrated optic atrophy and increased T2 signal in basal ganglia."
      explanation: Documents optic atrophy occurring alongside basal ganglia disease in the single m.14459G>A LHON-plus-dystonia patient of this cohort.
  - target: Striatal Neurodegeneration and Bilateral Basal Ganglia Necrosis
    description: >
      In individuals whose bioenergetic threshold is crossed in the
      striatum, medium spiny projection neurons of the caudate and putamen
      degenerate, producing bilateral basal ganglia lesions ranging from
      MRI/CT lucencies to frank necrosis.
    evidence:
    - reference: PMID:20052369

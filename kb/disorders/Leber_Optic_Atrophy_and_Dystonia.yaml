    explanation: Documents the clinical redox/metabolic correlate (lactic acidosis) accompanying the basal ganglia lesions.
  downstream:
  - target: Tissue-Selective Neuronal Bioenergetic Vulnerability
    description: >
      A generalized, systemic bioenergetic deficit is converted into a
      tissue-restricted disease by the disproportionate vulnerability of
      specific long-axon, high-energy-demand neuronal populations.
    evidence:
    - reference: PMID:19001017
      reference_title: "Inherited mitochondrial optic neuropathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The selective vulnerability of retinal ganglion cells (RGCs)"
      explanation: Establishes the general principle of selective neuronal vulnerability underlying mitochondrial optic neuropathies, which LDYT extends to a second, striatal cell population.

- name: Tissue-Selective Neuronal Bioenergetic Vulnerability
  biological_scale: CELLULAR
  description: >
    Two neuronal populations with disproportionately high, spatially
    distributed ATP demand are selectively vulnerable to the complex I
    defect: retinal ganglion cells, whose long, partly unmyelinated
    intraretinal axons (as in classical LHON) impose an especially high
    energy burden, and striatal projection neurons of the basal ganglia.
    Why these two populations specifically decompensate, while most other
    tissues remain clinically unaffected, is not fully resolved, but tissue-
    and cell-type-specific mutant load (heteroplasmy) is the best-supported
    explanation: a Japanese series found homoplasmic mutant load producing
    infantile dystonia while a heteroplasmic variant of the same mutation
    produced later-onset truncal ataxia and parkinsonism, and involvement of
    the visual pathway is generally a later event than dystonia in patients
    who develop both.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  - preferred_term: Medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:

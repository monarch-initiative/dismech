pathophysiology:
- name: MT-ND6 m.14459G>A Missense Mutation
  biological_scale: MOLECULAR
  description: >
    The initiating lesion is most often a homoplasmic or heteroplasmic
    G-to-A transition at mtDNA position 14459 within MT-ND6, encoding
    NADH:ubiquinone oxidoreductase core subunit 6 of respiratory-chain
    complex I. The substitution changes a moderately conserved alanine to a
    valine at ND6 residue 72 (p.Ala72Val), within the most evolutionarily
    conserved region of the protein. Rarer alternate lesions at other
    complex I loci (MT-ND1, MT-ND3, MT-ND4, or a second MT-ND6 site) produce
    a mechanistically analogous complex I defect in individual families.
    Because mtDNA is present in every cell, the lesion itself is systemic;
    the resulting disease phenotype is not.
  genes:
  - preferred_term: MT-ND6
    term:
      id: hgnc:7462
      label: MT-ND6
  - preferred_term: MT-ND1
    term:
      id: hgnc:7455
      label: MT-ND1
  - preferred_term: MT-ND4
    term:
      id: hgnc:7459
      label: MT-ND4
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:8016139
    reference_title: "A mitochondrial DNA mutation at nucleotide pair 14459 of the NADH dehydrogenase subunit 6 gene associated with maternally inherited Leber hereditary optic neuropathy and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a G-to-A transition at nucleotide pair (np) 14459, changed a moderately conserved alanine to a valine at NADH dehydrogenase subunit 6 (ND6) residue 72"
    explanation: Identifies the founding molecular lesion and its amino-acid consequence.
  - reference: PMID:7654063
    reference_title: "Leber's hereditary optic neuropathy plus dystonia is caused by a mitochondrial DNA point mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel point mutation in the ND6 subunit of complex I at position 14,459 of the mitochondrial DNA (MTND6*LDY T14459A) was identified as a candidate mutation for the highly tissue-specific disease. Leber's hereditary optic neuropathy plus dystonia."
    explanation: Independently confirms the ND6 np 14459 mutation as the candidate cause of the LDYT phenotype in additional pedigrees.
  downstream:
  - target: Complex I Assembly and Coenzyme Q-Binding Site Defect
    description: >
      The p.Ala72Val substitution impairs assembly and/or catalytic function
      of the complex I holoenzyme, most directly documented through altered
      binding of the coenzyme Q substrate analog.
    evidence:
    - reference: PMID:8622678
      reference_title: "Use of transmitochondrial cybrids to assign a complex I defect to the mitochondrial DNA-encoded NADH dehydrogenase subunit 6 gene mutation at nucleotide pair 14459 that causes Leber hereditary optic neuropathy and dystonia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This ND6 np 14459 mutation changes a moderately conserved alanine to a valine at amino acid position 72 of the ND6 protein."
      explanation: Confirms the specific amino acid substitution is the mutation being assigned a biochemical complex I defect in this study.

- name: Complex I Assembly and Coenzyme Q-Binding Site Defect
  biological_scale: MOLECULAR
  description: >
    Transmitochondrial cybrid experiments — in which patient
    Epstein-Barr-virus-transformed lymphoblasts were enucleated and fused to
    a mtDNA-deficient recipient cell line — assign a partial complex I
    biochemical defect directly to the ND6 m.14459G>A mutation, separating
    the mtDNA effect from nuclear genetic background. Submitochondrial
    particles from patient cell lines showed a 60% reduction in complex
    I-specific activity relative to controls, with normal activity for
    complexes II+III, III, and IV; cybrid lines carrying the mutation showed
    a smaller but still significant 39% reduction. Kinetic analysis found a
    reduced Vmax with unchanged Km, and specific activity was inhibited by
    increasing concentrations of a reduced coenzyme Q analog (decylubiquinol),
    suggesting the mutation alters the coenzyme Q-binding site of the enzyme
    rather than abolishing catalysis outright.

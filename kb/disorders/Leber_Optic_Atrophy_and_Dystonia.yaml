name: Leber Optic Atrophy and Dystonia
creation_date: "2026-08-18T04:02:08Z"
category: Mendelian
disease_term:
  preferred_term: Leber optic atrophy and dystonia
  term:
    id: MONDO:0010772
    label: Leber optic atrophy and dystonia
description: >
  Leber optic atrophy and dystonia (LDYT; also called LHON-dystonia or LHOND;
  OMIM #500001) is an extremely rare mitochondrial DNA (mtDNA) disorder in
  which a complex I missense variant produces some combination of Leber
  hereditary optic neuropathy (LHON)-type bilateral optic atrophy and
  childhood- to adult-onset dystonia with bilateral basal ganglia (striatal)
  lesions. It is a distinct entity from isolated LHON: the overwhelming
  majority of molecularly confirmed cases carry the homoplasmic or
  heteroplasmic MT-ND6 m.14459G>A variant, which is essentially never found
  among patients with isolated classical LHON (caused by m.11778G>A, m.3460G>A,
  or m.14484T>C) or with isolated Leigh syndrome, indicating high tissue and
  phenotype specificity for this single amino-acid substitution (p.Ala72Val).
  A handful of other complex I loci (MT-ND1, MT-ND3, MT-ND4, and a second
  MT-ND6 site) have been linked to the same LDYT clinical picture in isolated
  families. Cybrid experiments assign a partial complex I biochemical defect
  directly to the m.14459G>A mtDNA lesion, altering the coenzyme Q-binding
  site of the enzyme and lowering NADH dehydrogenase-specific activity.
  Clinical expression is markedly heterogeneous even within a single
  maternal pedigree, ranging from asymptomatic carriage to isolated optic
  neuropathy, isolated pediatric-onset generalized dystonia with bilateral
  striatal necrosis, combined optic-atrophy-plus-dystonia, or (in homoplasmic
  infants) a fatal Leigh-like encephalomyopathy — a spectrum thought to
  reflect tissue-specific mutant load (heteroplasmy) and additional nuclear
  genetic modifiers rather than the primary mtDNA genotype alone. Because
  LDYT is maternally (mitochondrially) inherited, unlike autosomal or
  X-linked optic-atrophy-plus-dystonia phenocopies, targeted or whole
  mitochondrial genome sequencing is central to diagnosis whenever dystonia
  accompanies otherwise-unexplained bilateral optic neuropathy, or vice versa.
  There is no LDYT-specific approved therapy; management is extrapolated from
  general LHON visual care and standard symptomatic dystonia treatment
  (oral agents, botulinum toxin, and deep brain stimulation in refractory
  cases). LDYT must not be confused with Leber congenital amaurosis, an
  unrelated early-onset retinal dystrophy, nor with TIMM8A-related
  Mohr-Tranebjaerg (deafness-dystonia-optic neuronopathy) syndrome, an
  X-linked nuclear-encoded mitochondrial import disorder in which
  progressive sensorineural deafness, not maternal mtDNA transmission, is the
  presenting and defining feature.
synonyms:
- LDYT
- LHON-dystonia
- LHOND
- Leber's hereditary optic neuropathy with dystonia
- LHON and dystonia
- dystonia, familial, with visual failure and striatal lucencies
parents:
- Leber Hereditary Optic Neuropathy
- Mitochondrial Disease

inheritance:
- name: Mitochondrial inheritance
  description: >
    LDYT is caused by pathogenic variants in the mitochondrial genome and is
    transmitted down the maternal line, most often the MT-ND6 m.14459G>A
    variant. Both homoplasmic and heteroplasmic transmission have been
    documented, and the same homoplasmic genotype can produce markedly
    different phenotypes (asymptomatic carriage, isolated dystonia, isolated
    optic neuropathy, or combined disease) even among siblings and other
    close maternal relatives within one pedigree, supporting a role for
    additional nuclear genetic modifiers. Heteroplasmic de novo occurrence
    has also been reported, in which the variant is undetectable in the
    unaffected mother's blood, urine sediment, and cultured fibroblasts.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:8016139
    reference_title: "A mitochondrial DNA mutation at nucleotide pair 14459 of the NADH dehydrogenase subunit 6 gene associated with maternally inherited Leber hereditary optic neuropathy and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A five-generation Hispanic family expressing maternally transmitted Leber hereditary optic neuropathy and/or early-onset dystonia associated with bilateral basal ganglia lesions was studied."
    explanation: Original description establishes maternal transmission of the m.14459G>A variant across five generations.
  - reference: PMID:8016139
    reference_title: "A mitochondrial DNA mutation at nucleotide pair 14459 of the NADH dehydrogenase subunit 6 gene associated with maternally inherited Leber hereditary optic neuropathy and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six maternal relatives in three generations were tested and were found to harbor the mutation, with one female affected with Leber hereditary optic neuropathy being heteroplasmic."
    explanation: Documents both homoplasmic and heteroplasmic transmission of the variant within the same maternal pedigree.
  - reference: PMID:14735585
    reference_title: "Variable clinical manifestation of homoplasmic G14459A mitochondrial DNA mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supports the hypothesis that nuclear genes may play a role in modifying the clinical expression of mitochondrial disease"
    explanation: Reports markedly variable clinical expression of the identical homoplasmic mtDNA genotype within one family, implicating nuclear modifiers.
  - reference: PMID:28503604
    reference_title: "A De Novo Mutation in MTND6 Causes Generalized Dystonia in 2 Unrelated Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report heteroplasmic 14459G>A mutations in 2 unrelated children with nonmaternally inherited generalized dystonia"
    explanation: Documents de novo (non-maternally-inherited) heteroplasmic occurrence of the variant, an exception to strict maternal transmission.
  - reference: PMID:20052369
    reference_title: "Pediatric-onset dystonia associated with bilateral striatal necrosis and G14459A mutation in a Korean family: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of homoplasmic G14459A mutation in asymptomatic individuals"
    explanation: Demonstrates incomplete penetrance, with homoplasmic carriers who remain clinically asymptomatic.

has_subtypes:
- name: MT-ND6 m.14459G>A
  display_name: "m.14459G>A (MT-ND6, p.Ala72Val)"
  description: >
    The canonical and by far the most frequently reported LDYT variant,
    accounting for the great majority of molecularly confirmed cases across
    Hispanic, Native American, Korean, Japanese, Chinese, and other
    pedigrees. It changes a moderately conserved alanine to a valine at ND6
    residue 72, within the most evolutionarily conserved region of the
    protein, and has never been found in unaffected population reference
    panels or in patients with unrelated LHON or Leigh disease pedigrees
    lacking the LDYT phenotype.
  genes:
  - preferred_term: MT-ND6
    term:
      id: hgnc:7462
      label: MT-ND6
  evidence:
  - reference: PMID:8016139
    reference_title: "A mitochondrial DNA mutation at nucleotide pair 14459 of the NADH dehydrogenase subunit 6 gene associated with maternally inherited Leber hereditary optic neuropathy and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "changed a moderately conserved alanine to a valine at NADH dehydrogenase subunit 6 (ND6) residue 72"
    explanation: Identifies the specific amino-acid substitution caused by the m.14459G>A variant.
  - reference: PMID:7654063
    reference_title: "Leber's hereditary optic neuropathy plus dystonia is caused by a mitochondrial DNA point mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient groups that included individuals with Leigh's disease, dystonia plus complex neurodegeneration, and Leber's hereditary optic neuropathy did not harbor the MTND6*LDYT14459A mutation, suggesting that this mutation displays a high degree of tissue specificity"
    explanation: Confirms the variant is specific to the LDYT phenotype and absent from unrelated LHON, Leigh disease, and dystonia cohorts.
- name: Other Complex I Loci
  display_name: "Rare Allelic and Locus Heterogeneity (ND1, ND3, ND4, second ND6 site)"
  description: >
    A small number of unrelated families with an LDYT-like phenotype
    (optic atrophy, spastic dystonia, and basal ganglia lesions) instead
    carry a different complex I mtDNA variant: a second MT-ND6 site
    (m.14596T>A), MT-ND4 m.11696A>G, or MT-ND1 m.3697G>A; a further variant,
    MT-ND3 m.10197G>A, has been reported as a rare primary LHON mutation.
    Double mutations (e.g., co-occurring MT-ND4 and MT-ND6 common LHON
    variants) have also produced an LDYT-like optic-neuropathy-plus-dystonia
    picture, sometimes with additional multisystem features such as
    transverse myelitis, illustrating that the clinical syndrome has
    meaningful locus and allelic heterogeneity beyond the single dominant
    m.14459G>A variant.
  genes:
  - preferred_term: MT-ND1
    term:
      id: hgnc:7455
      label: MT-ND1
  - preferred_term: MT-ND3
    term:
      id: hgnc:7458
      label: MT-ND3
  - preferred_term: MT-ND4
    term:
      id: hgnc:7459
      label: MT-ND4
  evidence:
  - reference: PMID:31776719
    reference_title: "Leber hereditary optic neuropathy plus dystonia, and transverse myelitis due to double mutations in MT-ND4 and MT-ND6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "at least five single mutations have been pathogenically associated with LDYT: MT-ND6 m.14459G>A and m.14596T>A, MT-ND4 m.11696A>G, MT-ND1 m.3697G>A and MT-ND3 m.10197G>A"
    explanation: Enumerates the rare non-m.14459G>A complex I loci reported to cause the LDYT clinical picture.
  - reference: PMID:31776719
    reference_title: "Leber hereditary optic neuropathy plus dystonia, and transverse myelitis due to double mutations in MT-ND4 and MT-ND6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical characteristics of LDYT are: optic atrophy, spastic dystonia, basal ganglia lesions, and nearly absent complex I activity."
    explanation: Confirms these alternate loci reproduce the same core LDYT clinical triad, supporting locus heterogeneity within a single clinical entity.

phenotypes:
- category: Neurological
  name: Generalized Dystonia
  description: >
    Progressive, often severe generalized dystonia is the defining
    extraocular manifestation of LDYT, frequently starting distally
    (foot, hand) and becoming generalized over months to years. Onset is
    typically before age 5 years in pediatric-onset pedigrees, though
    adult-onset cases occur.
  phenotype_term:
    preferred_term: Generalized dystonia
    term:
      id: HP:0007325
      label: Generalized dystonia
    clinical_course: PROGRESSIVE
  evidence:

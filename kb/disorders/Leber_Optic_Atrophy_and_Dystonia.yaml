environmental:
- name: Tobacco Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Tissue-Selective Neuronal Bioenergetic Vulnerability
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mitochondrial-toxic exposures are thought to further load a
      bioenergetic system already compromised by the primary complex I
      lesion, pushing vulnerable retinal ganglion cells and striatal neurons
      past a functional threshold. This is the same penetrance-gating logic
      established for classical LHON; the quantitative smoking-penetrance
      study underlying it (93% clinical penetrance in male smokers) was
      conducted in classical LHON pedigrees, not specifically in m.14459G>A
      LDYT families, so the link is extrapolated rather than independently
      demonstrated for this entity.
    evidence:
    - reference: PMID:20301353
      reference_title: "Leber Hereditary Optic Neuropathy."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Individuals in whom a LHON-causing mtDNA variant has been identified should be strongly advised not to smoke and to moderate alcohol intake, avoiding binge-drinking episodes."
      explanation: GeneReviews advises carriers of any LHON-causing mtDNA variant, the class that includes MT-ND6 m.14459G>A, to avoid smoking; recorded PARTIAL because the underlying penetrance evidence was generated in classical LHON cohorts rather than in LDYT pedigrees specifically.
  description: >
    General LHON avoidance counselling (no smoking) is extrapolated to LDYT
    carriers because the underlying complex I lesion and bioenergetic
    threshold logic are shared with classical LHON, even though
    smoking-penetrance data have not been separately generated for
    m.14459G>A pedigrees.

  association: >
    The homoplasmic or heteroplasmic m.14459G>A variant (p.Ala72Val) is the
    predominant molecular cause of LDYT, identified in maternal pedigrees of
    diverse ancestry and, in a minority of cases, as a de novo heteroplasmic
    occurrence.
  evidence:
  - reference: PMID:8016139
    reference_title: "A mitochondrial DNA mutation at nucleotide pair 14459 of the NADH dehydrogenase subunit 6 gene associated with maternally inherited Leber hereditary optic neuropathy and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the np 14459 G-to-A missense mutation is specific to this family, alters a moderately conserved amino acid in a complex I gene, is a unique mtDNA variant in Native American haplogroup D, and is heteroplasmic, suggesting that it is the disease-causing mutation"
    explanation: Original genetic evidence identifying the m.14459G>A MT-ND6 variant as the disease-causing mutation.

treatments:
- name: Idebenone
  description: >
    A short-chain quinone that can bypass a defective complex I by
    accepting electrons via NQO1 and delivering them downstream to complex
    III. It is authorised for LHON generally (EMA, exceptional
    circumstances) but its benefit has not been separately established for
    the LDYT/dystonia phenotype specifically.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  evidence:
  - reference: PMID:40190371
    reference_title: "Adult-Onset Bilateral Optic Neuropathy in a Patient with Non-Familial Childhood-Onset Generalized Dystonia Associated with Mitochondrial DNA 14459G>A Mutation: A Case Report and Review of Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in LHON, there is no evidence of benefit"
    explanation: Notes that corticosteroids (used empirically pending genetic diagnosis) show no evidence of benefit in LHON; recorded as PARTIAL context for the absence of a proven LDYT-specific pharmacotherapy rather than direct support for idebenone efficacy.
- name: Botulinum Toxin Injection
  description: >
    Used for symptomatic relief of focal or segmental dystonic posturing,
    for example of the arm, in LDYT patients with generalized dystonia.
  treatment_term:

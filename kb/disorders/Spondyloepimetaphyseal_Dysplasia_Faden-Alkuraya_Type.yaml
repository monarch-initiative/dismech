progression:
- phase: Infancy
  age_range: First two years
  notes: >-
    Birth and the early postnatal period may be unremarkable, and anthropometric
    parameters at birth are not consistently recorded. Gross-motor milestones can
    be mildly delayed.
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Birth and postnatal periods were unremarkable.
    explanation: Documents an unremarkable perinatal course in an affected sibling.
- phase: Early childhood onset of limb deformity
  age_range: Two to four years
  notes: >-
    Lower-limb malformation is typically first noticed between two and four years
    of age, together with short stature and painful walking, and progresses
    thereafter.
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral lower limb malformation was observed at 4 years of age, which is
      progressive. She could not walk long distances due to pain.
    explanation: Dates the onset of the limb deformity and its progressive character.
- phase: Childhood through adolescence
  age_range: Childhood to skeletal maturity
  notes: >-
    Vertebral deformity worsens with age and the dysplasia is explicitly
    progressive, which is the feature that separates this entity from static
    spondyloepimetaphyseal dysplasias. No adult natural-history data have been
    published.
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The severity of vertebral deformities increases with age.
    explanation: Direct statement of progression over childhood.
diagnosis:
- name: Clinical and Radiographic Recognition
  description: >-
    The combination of the facial gestalt, disproportionate short stature, short
    fourth metatarsals, cono-brachydactyly, and progressive spondylar plus
    epimetaphyseal change on skeletal survey is distinctive enough to raise the
    diagnosis before molecular testing.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe a clinically recognizable autosomal-recessive disorder
    explanation: The founding report frames the entity as clinically recognizable.
- name: Molecular Confirmation by Exome or Targeted RSPRY1 Sequencing
  description: >-
    Diagnosis is confirmed by identifying biallelic pathogenic RSPRY1 variants.
    In practice this has been achieved by exome sequencing — combined with
    autozygosity mapping in consanguineous families — or by targeted sequencing
    once RSPRY1 is suspected.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined autozygome/exome analysis identified a homozygous frameshift
      mutation in RSPRY1 with resulting nonsense-mediated decay.
    explanation: Describes the diagnostic strategy that established the first molecular diagnosis.
  - reference: PMID:39706863
    reference_title: Genetic and allelic heterogeneity in 248 Indians with skeletal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We expand the phenotypic and genotypic spectrum of rarely reported
      conditions (RAB33B, TRIP11, NEPRO, RPL13, COL27A1, PTHR1, EXOC6B, PRKACA,
      FUZ and RSPRY1)
    explanation: >-
      A national skeletal-dysplasia sequencing cohort shows that RSPRY1 disease is
      reached through broad exome/genome testing rather than a dedicated assay.
differential_diagnoses:
- name: Spondyloepimetaphyseal Dysplasia Strudwick Type
  description: >-
    Another spondyloepimetaphyseal dysplasia with vertebral, epiphyseal, and
    metaphyseal involvement, so the radiographic pattern overlaps.
  distinguishing_features:
  - >-
    Strudwick type is autosomal dominant and caused by COL2A1 variants, has
    dappled irregular metaphyses, and is not associated with intellectual
    disability, short fourth metatarsals, or craniosynostosis.
- name: Spondyloepimetaphyseal Dysplasia with Joint Laxity
  description: >-
    Shares spondyloepimetaphyseal radiographic changes and, since joint
    dislocation was reported in RSPRY1 disease, some clinical overlap.
  distinguishing_features:
  - >-
    In SEMD with joint laxity, generalized joint laxity and dislocation are core
    defining features present from early life, and the digits are typically
    slender (leptodactylic) rather than showing cono-brachydactyly.
- name: Syndromic Craniosynostosis
  description: >-
    When craniosynostosis dominates the presentation, the syndromic
    craniosynostoses enter the differential.
  distinguishing_features:
  - >-
    The syndromic craniosynostoses lack the progressive spondylar and
    epimetaphyseal dysplasia, the short fourth metatarsals, and the
    cono-brachydactyly that define this entity, and most are autosomal dominant.
treatments:
- name: Supportive and Symptom-Directed Management
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    multidisciplinary, directed at the skeletal deformity, developmental needs,
    and any associated anomalies. No trial or management protocol specific to
    RSPRY1 disease has been published.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  notes: >-
    Curated without an evidence item because the published literature on this
    disorder contains no management study; the entry records the absence of
    disease-specific therapy rather than asserting a supported intervention.
- name: Surgical Correction of Associated Anomalies
  description: >-
    Surgery has been used in reported patients for associated anomalies —
    corrective surgery for patent ductus arteriosus in one child — and is the
    standard route for craniosynostosis and for progressive limb malalignment in
    skeletal dysplasia generally.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was diagnosed with congenital heart disease, patent ductus arteriosus
      (PDA), and underwent corrective surgery at 3 years of age.
    explanation: >-
      Documents a surgical intervention actually performed in a reported patient.
      It supports surgery for an associated anomaly, not a disease-modifying
      effect, hence PARTIAL.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance carries a 25 percent recurrence risk for
    carrier couples, and reported families have generally been consanguineous, so
    counseling and — once the familial variants are known — the option of
    prenatal or preimplantation testing are central to family management.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a clinically recognizable autosomal-recessive disorder in four
      affected siblings from a consanguineous Saudi family
    explanation: >-
      Establishes the autosomal recessive, consanguinity-associated inheritance
      that makes counseling and recurrence-risk discussion the relevant action.
experimental_models:
- name: SEMDFA patient-derived dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Dermal fibroblasts obtained by skin biopsy from two patients homozygous for
    the RSPRY1 c.377delT frameshift allele, compared with commercial control
    human dermal fibroblasts by bulk RNA sequencing.
  cell_source: Patient-derived (skin biopsy)
  culture_system: Two-dimensional monolayer culture, passage 3
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  publication: PMID:39940902
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      frameshift mutation in exon 2 of the RSPRY1 gene (NM_133368). Dermal
      fibroblasts were obtained from the patients via skin biopsy.
    explanation: >-
      Establishes the genotype and tissue source of the patient-derived
      fibroblast model.
  modeled_mechanisms:
  - target: Constitutive TGF-beta/SMAD3 Signaling Activation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Patient fibroblast transcriptomes identify TGF-beta regulation of the
      extracellular matrix as the dominant dysregulated pathway, with SMAD2 and
      SMAD3 the top enriched transcription factors.
    limitations: >-
      Dermal fibroblasts are a patient-accessible surrogate. RSPRY1 is normally
      concentrated in osteoblasts and periosteal cells of the developing
      endochondral skeleton, so the pathway readout is not measured in the
      disease-relevant bone lineage.
    readouts:
    - name: TGF-beta regulation of extracellular matrix pathway enrichment
      target: Constitutive TGF-beta/SMAD3 Signaling Activation
      direction: INCREASED
      interpretation: >-
        The most strongly enriched pathway among differentially expressed genes in
        patient versus control fibroblasts.
      evidence:
      - reference: PMID:39940902
        reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The pathway enrichment analysis of DEGs showed there were several
          significantly enriched pathways, with TGF-β regulation of the ECM
          pathway being the most prominent.
        explanation: Reports the enrichment result behind this readout.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transcriptome analysis of fibroblasts from patients with homozygous RSPRY1
        mutations showed there was significant enrichment of transforming growth
        factor beta (TGF-β) signaling and ECM-related pathways.
      explanation: Establishes the model as informative for the TGF-beta activation node.
- name: CRISPR-Cas9 RSPRY1 and RSPRY1/SMAD3 knockout human dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Isogenic RSPRY1 knockout, SMAD3 knockout, and RSPRY1 plus SMAD3 double
    knockout human dermal fibroblasts generated with Cas9 ribonucleoprotein
    complexes, used for wound-healing, proliferation, senescence, and apoptosis
    assays with and without recombinant TGF-beta1.
  cell_source: Gene-edited human dermal fibroblasts
  culture_system: Two-dimensional monolayer culture with and without recombinant TGF-beta1
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  publication: PMID:39940902
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To further investigate the role of RSPRY1 and its interaction with SMAD3 in
      cellular processes, RSPRY1 KO, SMAD3 KO, and RSPRY1 + SMAD3 double KO
      fibroblasts were generated.
    explanation: Establishes the isogenic knockout panel that constitutes this model.
  modeled_mechanisms:
  - target: Disordered Extracellular Matrix Dynamics and Cell Motility
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Removing RSPRY1 increases fibroblast motility, and additionally removing
      SMAD3 abolishes that increase, establishing SMAD3 as the required mediator.
    limitations: >-
      Wound closure in dermal fibroblasts is a proxy for matrix-regulated cell
      behavior, not a measurement of growth-plate or osteoblast function, and the
      link to endochondral ossification remains inferred.
    readouts:
    - name: Wound closure rate in RSPRY1 knockout fibroblasts
      target: Disordered Extracellular Matrix Dynamics and Cell Motility
      direction: INCREASED
      interpretation: Faster wound closure indicates enhanced cell motility after RSPRY1 loss.
      evidence:
      - reference: PMID:39940902
        reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          RSPRY1 KO fibroblasts exhibited a significant increase in wound closure
          ability, as compared to CTRL fibroblasts, which indicated that RSPRY1
          deficiency enhanced cell motility
        explanation: Reports the wound-closure measurement and its direction.
    - name: Wound closure rate in RSPRY1 plus SMAD3 double knockout fibroblasts
      target: Disordered Extracellular Matrix Dynamics and Cell Motility
      direction: ABOLISHED
      interpretation: >-
        Loss of the motility gain in the double knockout shows the effect requires
        SMAD3.
      evidence:
      - reference: PMID:39940902
        reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          this improved wound-healing capacity was not observed in the RSPRY1 +
          SMAD3 double KO fibroblasts, indicating that SMAD3 plays a critical role
          in mediating the effects of RSPRY1 loss on cell motility
        explanation: Reports the epistasis result behind this readout.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional wound healing assays showed that RSPRY1 knockout fibroblasts
        exhibited enhanced motility, a phenotype that was abrogated in RSPRY1 +
        SMAD3 double knockout fibroblasts, highlighting the SMAD3-dependence of
        RSPRY1's effects.
      explanation: Establishes the edited-fibroblast system as the perturbation model for this node.
discussions:
- discussion_id: rspry1_biochemical_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the biochemical activity of RSPRY1, and does its RING domain
    ubiquitinate a component of the TGF-beta pathway?
  attaches_to:
  - pathophysiology#Loss of RSPRY1 Regulatory Activity in Skeletal Tissue
  rationale: >-
    RSPRY1 was described at discovery as a protein of unknown physiological
    function, and that has not changed. The RING domain and the ubiquitin-ligase
    interaction partners recovered from interaction databases motivate an E3
    ligase hypothesis, but no substrate has been identified and no ligase
    activity has been demonstrated. Without it, the step between loss of the
    protein and activation of TGF-beta signaling is a correlation, not a
    mechanism.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RSPRY1 encodes a hypothetical RING and SPRY domain-containing protein of
      unknown physiological function.
    explanation: States the gap directly at the point of gene discovery.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Identifying the possible ubiquitination targets of RSPRY1 in this context
      and detailing the effects of these targets in the TGF-β signaling pathway
      may provide important information to elucidate the functional mechanism of
      RSPRY1
    explanation: >-
      The mechanistic study itself names substrate identification as the
      outstanding question.
  - reference: PMID:26497270
    reference_title: "Isolation, expression analysis and characterization of NEFA-interacting nuclear protein 30 and RING finger and SPRY domain containing 1 in skeletal muscle."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      GFP-tagged Nip30 was found to localize to the nucleus, while GFP-tagged
      Rspry1 was found to localize to the cytoplasm of muscle cells.
    explanation: >-
      The only other functional characterization of the protein places tagged
      Rspry1 in the cytoplasm of muscle cells, which sits awkwardly beside the
      description of RSPRY1 as a secreted protein acting on the extracellular
      matrix. The compartment in which it acts is itself unsettled.
  - reference: PMID:33092958
    reference_title: Substrate recognition by TRIM and TRIM-like proteins in innate immunity.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      We focus on those containing PRY-SPRY, the domain most frequently used for
      substrate recognition
    explanation: >-
      RSPRY1's RING-plus-SPRY architecture is the TRIM-family arrangement, in
      which the PRY-SPRY domain typically picks the substrate. This is the
      structural argument for the E3-ligase hypothesis, and it is an argument
      from domain analogy rather than evidence about RSPRY1 itself.
  proposed_experiments:
  - experiment_id: exp_rspry1_interactome_and_ubiquitination
    name: Define the RSPRY1 interactome and test for ubiquitination of a TGF-beta pathway component
    description: >-
      Use affinity-purification mass spectrometry on endogenously tagged RSPRY1
      to recover its interactors, then test candidate TGF-beta pathway
      components in in vitro and cellular ubiquitination assays with wild-type
      RSPRY1 versus a RING-domain mutant.
    decision_criterion: >-
      Recovery of a TGF-beta pathway component as a RING-dependent
      ubiquitination substrate would convert the curated correlation between
      RSPRY1 loss and pathway activation into a mechanism; failure to find one
      would leave the E3-ligase framing as domain analogy and reopen
      alternatives such as a purely extracellular role.
  - experiment_id: exp_rspry1_subcellular_localization
    name: Resolve the secreted-versus-intracellular localization of endogenous RSPRY1
    description: >-
      Combine endogenous tagging with immunofluorescence and secretome analysis
      in a bone-lineage cell type. The protein is annotated as secreted and has
      been described as acting on the extracellular matrix, yet tagged Rspry1
      was reported in the cytoplasm of muscle cells and a RING-dependent
      ubiquitin-ligase role would require intracellular access. The compartment
      determines which mechanistic models remain possible.
- discussion_id: fibroblast_proxy_for_bone_lineage
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the constitutive TGF-beta/SMAD3 activation seen in patient dermal
    fibroblasts also occur in the osteoblast, periosteal, and growth-plate
    chondrocyte lineages where RSPRY1 is actually expressed?
  attaches_to:
  - pathophysiology#Impaired Endochondral Ossification and Growth-Plate Function
  rationale: >-
    The entire cellular mechanism for this disorder rests on dermal fibroblasts,
    chosen because they are the accessible patient tissue. RSPRY1 protein is
    concentrated in murine embryonic osteoblasts and periosteal cells during
    primary endochondral ossification, which is a different cell context with
    different TGF-beta set points. The authors are explicit that fibroblasts may
    only partly capture the effects of RSPRY1 loss in other tissues, so the
    fibroblast-to-bone step is the weakest link in the curated chain and is
    marked INDIRECT_UNKNOWN_INTERMEDIATES accordingly.
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The present study focused on fibroblast cell models derived from two
      patients with homozygous RSPRY1 mutations, which, while informative, might
      only partially capture the effects of RSPRY1 deficiency in other cell types
      or tissues.
    explanation: The authors state the translational limitation of their own model.
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, we detect strong RSPRY1 protein localization in murine embryonic
      osteoblasts and periosteal cells during primary endochondral ossification,
      consistent with a role in bone development.
    explanation: Identifies the bone-lineage cell types in which the mechanism actually needs testing.
  proposed_experiments:
  - experiment_id: exp_semdfa_bone_lineage_tgfb_validation
    name: Test constitutive TGF-beta/SMAD3 activation in patient-derived chondrocytes and osteoblasts
    description: >-
      Differentiate patient iPSCs carrying biallelic RSPRY1 alleles into
      chondrocytes and osteoblasts, and quantify phospho-SMAD3 and TGF-beta
      target-gene output against isogenic corrected controls, with and without
      an ALK5 (TGFBR1) inhibitor. The fibroblast result predicts elevated basal
      phospho-SMAD3 and a blunted response to exogenous TGF-beta1 in the bone
      lineage as well.
    decision_criterion: >-
      Elevated basal phospho-SMAD3 with a blunted exogenous-ligand response in
      the bone lineage would carry the mechanism across the fibroblast-to-bone
      gap; a normal bone-lineage TGF-beta set point would confine the fibroblast
      finding to that cell type and leave the skeletal mechanism unexplained.
  - experiment_id: exp_semdfa_rspry1_null_mouse_skeleton
    name: Skeletal phenotyping of a global and cartilage-specific Rspry1 knockout mouse
    description: >-
      Characterize growth-plate architecture, endochondral ossification, and
      cranial sutures in global and cartilage-specific Rspry1-null mice. No
      Rspry1-null skeletal phenotype has been reported despite knockout alleles
      existing in repositories, so this is the missing in vivo test of whether
      loss of the gene reproduces the human skeleton.
- discussion_id: neurodevelopmental_mechanism_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does RSPRY1 loss cause intellectual disability?
  attaches_to:
  - pathophysiology#Loss of RSPRY1 Regulatory Activity in Skeletal Tissue
  rationale: >-
    Intellectual disability is one of the five defining features of the disorder
    and was present in every patient of the delineation series, yet no curated
    causal path connects RSPRY1 loss to it. All functional work to date is
    skeletal or fibroblast-based, and there is no published study of RSPRY1 in
    neural tissue. The pathograph therefore deliberately stops at the skeletal
    arm rather than asserting an unevidenced neurodevelopmental edge.
  evidence:
  - reference: PMID:30063090
    reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients have short stature, extremity deformities, facial dysmorphism and intellectual disability.
    explanation: Establishes that the unexplained phenotype is consistently present.
- discussion_id: tgf_beta_targeted_therapy_rationale
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Could pharmacological inhibition of TGF-beta/SMAD3 signaling modify the
    skeletal phenotype of RSPRY1 deficiency?
  attaches_to:
  - pathophysiology#Constitutive TGF-beta/SMAD3 Signaling Activation
  rationale: >-
    Constitutive, SMAD3-dependent TGF-beta activation is the only druggable node
    identified so far, and the authors of the mechanistic study raise
    TGF-beta-directed therapy on that basis. Nothing has been tested: there is no
    animal model with a demonstrated skeletal phenotype, no in vivo proof that
    the pathway is activated in bone, and no trial. This is recorded as a
    hypothesis and deliberately not curated as a treatment.
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      An improvement in our understanding of the molecular roles of RSPRY1 might
      yield novel therapeutic strategies that target TGF-β signaling in patients
      with SEMD and other skeletal dysplasias.
    explanation: >-
      The authors frame TGF-beta-directed therapy as a prospect arising from their
      findings, not as a demonstrated intervention.
- discussion_id: contiguous_gene_deletion_haploinsufficiency
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does single-copy loss of RSPRY1, as part of a 16q contiguous-gene deletion,
    contribute to the skeletal phenotype of that deletion syndrome?
  attaches_to:
  - pathophysiology#Biallelic RSPRY1 Loss of Function
  rationale: >-
    SEMDFA is recessive, and every reported patient is homozygous, so the
    curated trigger node requires biallelic loss. A patient with a 16q12.2q21
    interstitial deletion spanning RSPRY1 was nonetheless proposed to owe the
    skeletal part of their phenotype to loss of this gene. If that is right, one
    copy is sometimes not enough for the skeleton, which would put a partial
    dosage effect underneath a disorder curated here as a null phenotype. The
    proposal is a candidate-gene inference from a single deletion patient, not a
    dosage experiment, so it is recorded as an open question rather than a
    curated modifier or a second genetic entry.
  evidence:
  - reference: PMID:27230627
    reference_title: "A 16q12.2q21 deletion identified in a patient with developmental delay, epilepsy, short stature, and distinctive features."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because RSPRY1 was been discovered as the cause of progressive skeletal
      dysplasia, a loss of this gene might explain the skeletal defects observed
      in the patient.
    explanation: >-
      The deletion report states the hypothesis in its own hedged terms
      ("might explain"), which is the level at which it is recorded here. The
      quote reproduces the source's own wording, including its grammatical slip.
clinical_trials: []
datasets: []
notes: >-
  Curated from primary literature plus claude_code and openscientist
  deep-research reports. Fewer
  than fifteen molecularly confirmed patients have been published, so most
  phenotype frequency bands are drawn from small case series and several
  single-patient findings (patent ductus arteriosus, myopia, ossifying fibroma of
  the maxilla, joint dislocation) are deliberately curated without a frequency.
  An Orphanet structured record for ORPHA:457395 could not be built at curation
  time because the upstream Orphadata bulk XML no longer matches the checksum
  pinned in data/orphadata/MANIFEST.yaml; refreshing that pin is a separate
  maintenance task and would rewrite the whole ORPHA cache. Reports of
  microcephaly, seizures, hypotonia, and corpus-callosum thinning appear in
  secondary sources but could not be traced to a quotable passage in the cached
  primary references, so they are omitted rather than cited loosely — note in
  particular that the delineation series states most patients were normocephalic.

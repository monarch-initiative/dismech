name: Spondyloepimetaphyseal Dysplasia Faden-Alkuraya Type
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >-
  Spondyloepimetaphyseal dysplasia, Faden-Alkuraya type (SEMDFA; OMIM #616723)
  is an ultra-rare autosomal recessive, progressive skeletal dysplasia caused by
  biallelic loss-of-function variants in RSPRY1, which encodes a RING- and
  SPRY-domain protein expressed in embryonic osteoblasts and periosteal cells
  during primary endochondral ossification. Affected individuals have
  postnatal-onset disproportionate short stature, progressive vertebral
  (spondylar) dysplasia, epimetaphyseal dysplasia of the long bones with coxa
  vara and genu valgum, brachydactyly with cone-shaped epiphyses, short fourth
  metatarsals, recognizable facial dysmorphism, and intellectual disability;
  craniosynostosis is present in some families. Patient-derived fibroblast work
  implicates constitutive TGF-beta/SMAD3 signaling and disordered extracellular
  matrix dynamics as the proximate cellular mechanism, but the biochemical
  function of RSPRY1 itself remains undetermined.
disease_term:
  preferred_term: spondyloepimetaphyseal dysplasia, Faden-Alkuraya type
  term:
    id: MONDO:0014748
    label: progressive spondyloepimetaphyseal dysplasia-short stature-short fourth metatarsals-intellectual disability syndrome
synonyms:
- SEMDFA
- Spondyloepimetaphyseal dysplasia, Faden-Alkuraya type
- RSPRY1-related spondyloepimetaphyseal dysplasia
- Spondyloepimetaphyseal dysplasia, progressive, with short stature, facial dysmorphism,
  short fourth metatarsals, and intellectual disability, with or without craniosynostosis
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: spondylo_epi_metaphyseal_dysplasias
    notes: >-
      RSPRY1 is named among the SE(M)D genes of the ISDS Nosology and
      Classification of Genetic Skeletal Disorders group "Spondyloepi(meta)physeal
      dysplasias (SE(M)D)".
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 15 molecularly confirmed individuals have been published. Ten
    individuals from four unrelated Saudi, Peruvian, and Turkish families were
    on record by 2018, with two further Indian sisters reported in 2024 and
    additional Indian cases ascertained in a national skeletal-dysplasia cohort.
    No population-based prevalence estimate exists.
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 10 individuals with SEMD, RSPRY1 type, are reported from 4
      unrelated families from Saudi Arabia, Peru, and Turkey
    explanation: >-
      The 2024 report tallies the entire published caseload at ten individuals
      from four families before adding its own two, establishing the
      cases-in-literature scale of the disorder.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SEMDFA segregates as an autosomal recessive trait. Every reported family has
    been consanguineous or the proband homozygous for a single RSPRY1 allele;
    heterozygous parents are unaffected.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a clinically recognizable autosomal-recessive disorder in four
      affected siblings from a consanguineous Saudi family
    explanation: >-
      The founding report establishes autosomal recessive segregation in a
      consanguineous multiplex family.
genetic:
- name: Biallelic RSPRY1 Loss-of-Function Variants
  gene_term:
    preferred_term: RSPRY1
    term:
      id: hgnc:29420
      label: RSPRY1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported causative alleles are homozygous and span frameshift (c.377delT,
    p.Ile126fs, and the founding Saudi frameshift subject to nonsense-mediated
    decay), canonical splice-site (c.516+2T>A at the exon 4/intron 4 border),
    and missense (c.1652G>A, p.Cys551Tyr) classes. RSPRY1 lies at 16q13 and
    encodes a 576-amino-acid protein carrying a RING finger domain and a SPRY
    domain.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined autozygome/exome analysis identified a homozygous frameshift
      mutation in RSPRY1 with resulting nonsense-mediated decay.
    explanation: >-
      The founding family carries a homozygous frameshift allele whose transcript
      undergoes nonsense-mediated decay, establishing loss of function.
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we were able to identify a Peruvian simplex case subject whose phenotype is
      strikingly similar to the original Saudi family and whose exome sequencing
      had revealed a likely pathogenic homozygous missense variant in the same gene
    explanation: >-
      A second, independently ascertained family with a homozygous missense allele
      and a matching phenotype supplied the replication that established the
      gene-disease relationship.
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two siblings presenting with short stature, facial dysmorphism, progressive
      vertebral defects, small epiphysis, cupping and fraying of metaphyses,
      brachydactyly, and short metatarsals harbored a homozygous missense variant
      c.1652G>A;p.(Cys551Tyr) in the RSPRY1 gene.
    explanation: Documents a further homozygous missense allele segregating with the phenotype.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The RSPRY1 gene is located on chromosome 16q13 and encodes a 576-amino acid
      protein containing two functional domains: the RING (really interesting new
      gene) finger domain, known for its role in protein–protein interactions
      (PPIs) and ubiquitination processes, and the SPRY (SPla and the RYanodine
      receptor) domain, which facilitates protein binding and cellular signaling
    explanation: Supplies the locus and the two-domain architecture of the encoded protein.
pathophysiology:
- name: Biallelic RSPRY1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous frameshift, splice-site, or missense RSPRY1 variants abolish or
    impair the RING- and SPRY-domain protein. The founding frameshift allele
    triggers nonsense-mediated decay of the transcript, so the shared initiating
    lesion is absence of functional RSPRY1 protein.
  genes:
  - preferred_term: RSPRY1
    term:
      id: hgnc:29420
      label: RSPRY1
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined autozygome/exome analysis identified a homozygous frameshift
      mutation in RSPRY1 with resulting nonsense-mediated decay.
    explanation: Establishes nonsense-mediated decay of the mutant transcript as the initiating molecular lesion.
  downstream:
  - target: Loss of RSPRY1 Regulatory Activity in Skeletal Tissue
    causal_link_type: DIRECT
    description: >-
      Absent RSPRY1 protein removes its regulatory activity from the cells in
      which it is normally expressed during skeletogenesis.
    evidence:
    - reference: PMID:26365341
      reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, we detect strong RSPRY1 protein localization in murine embryonic
        osteoblasts and periosteal cells during primary endochondral ossification,
        consistent with a role in bone development.
      explanation: >-
        Murine expression mapping places RSPRY1 in the osteoblast and periosteal
        compartments of the developing endochondral skeleton, identifying the
        tissue in which its loss acts.
- name: Loss of RSPRY1 Regulatory Activity in Skeletal Tissue
  biological_scale: MOLECULAR
  description: >-
    RSPRY1 carries a RING finger domain associated with ubiquitin-ligase
    chemistry and a SPRY protein-interaction domain, and interacts with
    ubiquitin ligases. Its physiological substrate and biochemical activity are
    not established, so this node records loss of an incompletely defined
    regulatory function rather than a specific enzymatic step. No GO molecular
    function is bound here deliberately: an E3 ligase annotation would assert an
    activity that has never been demonstrated for this protein.
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      RSPRY1 encodes a hypothetical RING and SPRY domain-containing protein of
      unknown physiological function.
    explanation: >-
      The founding report is explicit that the protein's physiological function is
      unknown, which is why this node is framed as loss of an undefined regulatory
      activity.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      BioGRID database analyses revealed that RSPRY1 has many ubiquitin ligases
      among its interaction partners.
    explanation: >-
      Interaction-database analysis motivates the ubiquitin-ligase framing, but
      remains an in-silico inference rather than a demonstrated enzymatic activity.
  downstream:
  - target: Constitutive TGF-beta/SMAD3 Signaling Activation
    causal_link_type: DIRECT
    description: >-
      RSPRY1-deficient patient fibroblasts show transcriptomes dominated by
      TGF-beta pathway enrichment and behave as though the pathway is already
      maximally engaged.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transcriptome analysis of fibroblasts from patients with homozygous RSPRY1
        mutations showed there was significant enrichment of transforming growth
        factor beta (TGF-β) signaling and ECM-related pathways.
      explanation: >-
        Patient-derived transcriptomes place TGF-beta signaling immediately
        downstream of RSPRY1 loss.
- name: Constitutive TGF-beta/SMAD3 Signaling Activation
  biological_scale: MOLECULAR
  description: >-
    In RSPRY1-deficient cells, TGF-beta regulation of the extracellular matrix is
    the most strongly enriched pathway, SMAD2 and SMAD3 are the dominant enriched
    transcription factors, and cells respond only weakly to exogenous TGF-beta1 —
    the signature of a pathway that is already constitutively active. Knocking out
    SMAD3 in the RSPRY1-null background abolishes the cellular phenotype, showing
    the effect is SMAD3-dependent.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The observed limited response to exogenous TGF-β in RSPRY1-deficient cells
      indicated that there was constitutive pathway activation.
    explanation: >-
      Blunted responsiveness to added ligand is the experimental basis for calling
      the pathway constitutively active rather than merely upregulated.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The pathway enrichment analysis of DEGs showed there were several
      significantly enriched pathways, with TGF-β regulation of the ECM pathway
      being the most prominent.
    explanation: TGF-beta regulation of the extracellular matrix is the top-ranked enriched pathway.
  downstream:
  - target: Disordered Extracellular Matrix Dynamics and Cell Motility
    causal_link_type: DIRECT
    description: >-
      Constitutive SMAD3-dependent signaling drives the matrix and motility
      phenotype; the phenotype disappears when SMAD3 is removed.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional wound healing assays showed that RSPRY1 knockout fibroblasts
        exhibited enhanced motility, a phenotype that was abrogated in RSPRY1 +
        SMAD3 double knockout fibroblasts, highlighting the SMAD3-dependence of
        RSPRY1's effects.
      explanation: >-
        The double-knockout rescue establishes SMAD3 as the required mediator
        between RSPRY1 loss and the cellular phenotype.
- name: Disordered Extracellular Matrix Dynamics and Cell Motility
  biological_scale: CELLULAR
  description: >-
    Differentially expressed genes in RSPRY1-deficient fibroblasts are enriched
    for collagen-containing extracellular matrix, cartilage development,
    extracellular matrix organization, and chondrocyte differentiation, and the
    cells are hypermotile in wound-closure assays. Proliferation and senescence
    are unchanged, so the defect is one of matrix regulation and cell behavior
    rather than of cell number.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  - preferred_term: cell migration
    term:
      id: GO:0016477
      label: cell migration
    modifier: INCREASED
  evidence:
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The most prominent BPs enriched included cartilage development, ECM
      organization, and chondrocyte differentiation
    explanation: >-
      The transcriptomic signature of patient fibroblasts is dominated by matrix
      and cartilage-differentiation programs.
  - reference: PMID:39940902
    reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RSPRY1 KO fibroblasts exhibited a significant increase in wound closure
      ability, as compared to CTRL fibroblasts, which indicated that RSPRY1
      deficiency enhanced cell motility
    explanation: Direct functional demonstration of the motility phenotype.
  downstream:
  - target: Impaired Endochondral Ossification and Growth-Plate Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Matrix and TGF-beta dysregulation in the osteoblast/periosteal compartment
      where RSPRY1 is expressed is the proposed route to defective endochondral
      bone formation. The functional data come from dermal fibroblasts rather
      than growth-plate cells, so this step is inferred.
    evidence:
    - reference: PMID:39940902
      reference_title: "Unraveling the Role of RSPRY1 in TGF-β Pathway Dysregulation: Insights into the Pathogenesis of Spondyloepimetaphyseal Dysplasia."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        The altered expression of these genes suggests that RSPRY1 deficiency
        might impair TGF-β-driven pathways essential for proper endochondral
        ossification and bone homeostasis.
      explanation: >-
        The authors themselves frame the link to endochondral ossification as a
        suggestion drawn from fibroblast expression data, which is why this edge
        is curated as indirect and PARTIAL.
- name: Impaired Endochondral Ossification and Growth-Plate Function
  biological_scale: TISSUE
  description: >-
    Defective endochondral bone formation at the vertebral bodies, epiphyses, and
    metaphyses produces the spondylar, epiphyseal, and metaphyseal dysplasia that
    defines the disorder, and limits longitudinal growth.
  cell_types:
  - preferred_term: growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, we detect strong RSPRY1 protein localization in murine embryonic
      osteoblasts and periosteal cells during primary endochondral ossification,
      consistent with a role in bone development.
    explanation: >-
      Places the normal protein at the site and stage of endochondral ossification
      whose failure is proposed here.
  - reference: PMID:30063090
    reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The skeletal hallmarks include (a) mild spondylar dysplasia, (b)
      epimetaphyseal dysplasia of the long bones associated with coxa vara and
      genu valgum, (c) brachymesophalangy with cone-shaped epiphyses, and (d)
      craniosynostosis.
    explanation: >-
      The radiographic hallmarks map directly onto vertebral, epiphyseal, and
      metaphyseal endochondral growth sites.
  downstream:
  - target: Progressive Skeletal Deformity and Short Stature
    causal_link_type: DIRECT
    description: >-
      Cumulative growth-plate failure produces worsening deformity and
      progressive loss of height standard deviation over childhood.
    evidence:
    - reference: PMID:38562122
      reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The severity of vertebral deformities increases with age.
      explanation: Documents the progressive character of the skeletal lesion.
  - target: Premature Cranial Suture Fusion
    causal_link_type: DIRECT
    description: >-
      Membranous cranial bone growth is affected in a subset of families,
      producing craniosynostosis. This branch is not present in every reported
      family and is therefore curated as a conditional consequence.
    evidence:
    - reference: PMID:30063090
      reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        all share the clinical findings including craniosynostosis, varying
        degrees of intellectual disability, facial dysmorphism, and skeletal
        findings including pes planus, prominent heels, and pectus deformity
      explanation: >-
        Craniosynostosis was universal in the two families of the delineation
        series, establishing the branch.
- name: Progressive Skeletal Deformity and Short Stature
  biological_scale: ORGANISM
  description: >-
    Growth deceleration is postnatal and deformity accrues over childhood:
    lower-limb malformation is typically noticed between two and four years of
    age and worsens, with painful walking, wind-swept deformity, and progressive
    vertebral change.
  evidence:
  - reference: PMID:38562122
    reference_title: Two sisters with RSPRY1-related spondyloepimetaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral lower limb malformation was observed at 4 years of age, which is
      progressive. She could not walk long distances due to pain.
    explanation: Documents the childhood onset, progression, and functional cost of the deformity.
  - reference: PMID:26365341
    reference_title: Identification of a Recognizable Progressive Skeletal Dysplasia Caused by RSPRY1 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      comprising progressive spondyloepimetaphyseal dysplasia, short stature,
      facial dysmorphism, short fourth metatarsals, and intellectual disability
    explanation: The defining clinical description names progression and short stature as core features.
- name: Premature Cranial Suture Fusion
  biological_scale: TISSUE
  description: >-
    Craniosynostosis occurs in a subset of affected individuals and was present
    in all five patients of the two-family delineation series, where most
    patients were nonetheless normocephalic.
  evidence:
  - reference: PMID:30063090
    reference_title: "Further delineation of spondyloepimetaphyseal dysplasia Faden-Alkuraya type: A RSPRY1-associated spondylo-epi-metaphyseal dysplasia with cono-brachydactyly and craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike the previously reported clinical findings, all patients except one
      are normocephalic
    explanation: >-
      Records that craniosynostosis in this disorder usually occurs without
      microcephaly, distinguishing it from syndromic craniosynostoses with head
      size reduction.

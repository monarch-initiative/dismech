  genes:
  - preferred_term: ITGA8
    term:
      id: hgnc:6144
      label: ITGA8
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Both ITGA8 alleles must be affected; the discovery families were
      consanguineous with recessive segregation.
    evidence:
    - reference: PMID:24439109
      reference_title: Integrin alpha 8 recessive mutations are responsible for bilateral renal agenesis in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These results demonstrate that mutations of ITGA8 are a genetic cause of bilateral renal agenesis and that, at least in some cases, bilateral renal agenesis is an autosomal-recessive disease.
      explanation: >-
        The discovery report states the recessive mode for ITGA8-related
        bilateral renal agenesis.
  evidence:
  - reference: PMID:24439109
    reference_title: Integrin alpha 8 recessive mutations are responsible for bilateral renal agenesis in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results demonstrate that mutations of ITGA8 are a genetic cause of bilateral renal agenesis and that, at least in some cases, bilateral renal agenesis is an autosomal-recessive disease.
    explanation: >-
      The discovery report's conclusion is the gene-disease claim this subtype
      row makes.
  - reference: PMID:24439109
    reference_title: Integrin alpha 8 recessive mutations are responsible for bilateral renal agenesis in humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Renal hypodysplasia (RHD) is a heterogeneous condition encompassing a spectrum of kidney development defects including renal agenesis, hypoplasia, and (cystic) dysplasia.
    explanation: >-
      A classification statement rather than a result, and the reason the MONDO
      series is named renal hypodysplasia/aplasia rather than renal agenesis:
      the underlying clinical concept spans agenesis, hypoplasia and dysplasia.
  - reference: PMID:33020172
    reference_title: Biallelic Pathogenic GFRA1 Variants Cause Autosomal Recessive Bilateral Renal Agenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Currently, only three genes are known to cause nonsyndromic BRA in humans.
    explanation: >-
      The three genes are ITGA8, GREB1L and FGF20, so this is the source for
      calling the ITGA8 form nonsyndromic and for moving the ITGA8, GREB1L and

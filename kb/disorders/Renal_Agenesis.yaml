- name: RHDA2
  display_name: Renal Hypodysplasia/Aplasia 2 (FGF20-Related)
  classification: molecular
  subtype_term:
    preferred_term: renal hypodysplasia/aplasia 2
    term:
      id: MONDO:0014319
      label: renal hypodysplasia/aplasia 2
  description: >-
    Renal agenesis from loss of FGF20, a niche ligand that maintains nephron
    progenitor stemness. MONDO defines this class as any renal agenesis whose
    cause is a mutation in the FGF20 gene and cross-references it to
    OMIM:615721. No inheritance block is recorded on this row: the discovery
    report's cached abstract states that loss of FGF20 in humans results in
    kidney agenesis without giving the transmission mode, and a Europe PMC
    search for FGF20 with renal agenesis, and the same search with recessive

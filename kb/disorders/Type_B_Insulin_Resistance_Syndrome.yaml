notes: >-
  Type B insulin resistance is frequently reported with systemic autoimmune
  disease and historically in middle-aged Black or African American women, but
  recent cases demonstrate that it can occur in younger people and across ethnic
  groups. Coexisting autoimmunity is an associated host context, not an external
  environmental exposure, so it is no longer modeled under `environmental`.
  Evidence for the demographic and autoimmune association includes:
  PMID:27254267 reports that the disorder is most frequently described in
  middle-aged Black women and associated with other autoimmune diseases, while
  PMID:42255432 explicitly notes younger and ethnically diverse presentations.

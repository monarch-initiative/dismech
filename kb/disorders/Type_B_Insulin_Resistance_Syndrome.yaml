name: Type B Insulin Resistance Syndrome
creation_date: "2026-07-25T00:00:00Z"
category: Autoimmune
parents:
- Autoimmune Disease
- Endocrine Disorder
disease_term:
  preferred_term: Type B Insulin Resistance Syndrome
  term:
    id: MONDO:0016464
    label: insulin-resistance syndrome type B
description: >-
  A rare acquired autoimmune disorder in which polyclonal IgG autoantibodies
  directed against the insulin receptor cause extreme insulin resistance. The
  autoantibodies act as partial agonists of the receptor, so glycemic control is
  characteristically bimodal and titer-dependent: high antibody titers block
  insulin action and produce refractory hyperglycemia with hypercatabolism,
  severe acanthosis nigricans, and hyperandrogenism in women, whereas lower
  titers may stimulate the receptor and produce fasting/autoimmune hypoglycemia.
  The syndrome most often affects middle-aged women (classically of African
  ancestry) and is almost invariably associated with other autoimmune diseases,
  most commonly systemic lupus erythematosus. It is one of the classic "extreme
  insulin resistance" syndromes, distinguished from the genetic (type A,
  Donohue, Rabson-Mendenhall) forms by its autoimmune, acquired basis. Treatment
  centers on immunomodulation to suppress pathogenic autoantibody production.
pathophysiology:
- name: Anti-Insulin Receptor Autoantibody Production
  biological_scale: CELLULAR
  description: >-
    Loss of B-cell tolerance in a predisposed, frequently autoimmune host leads
    to production of polyclonal IgG autoantibodies directed against the insulin
    receptor. This humoral autoimmunity is the primary lesion of the syndrome
    and is the target of immunomodulatory therapy.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: Plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  downstream:
  - target: Insulin Receptor Blockade and Partial Agonism
    description: >-
      Secreted anti-insulin-receptor IgG binds the cell-surface insulin receptor,
      initiating receptor blockade and partial agonism.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42438801
    reference_title: "Type B insulin resistance syndrome coexisting with aplastic anemia responsive to early immunosuppressive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type B insulin resistance syndrome (IRS) is a rare autoimmune disorder
      characterized by severe insulin resistance caused by autoantibodies against
      the insulin receptor."
    explanation: >-
      Establishes the primary autoimmune lesion — autoantibodies against the insulin
      receptor as the cause of the syndrome.
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type B insulin resistance belongs to a class of diseases caused by an
      autoantibody to a cell surface receptor."
    explanation: >-
      Classifies type B insulin resistance among autoantibody-to-cell-surface-receptor
      diseases, supporting the humoral autoimmune mechanism.
- name: Insulin Receptor Blockade and Partial Agonism
  biological_scale: MOLECULAR
  description: >-
    The autoantibodies bind the insulin receptor and behave as partial agonists.
    At high titer they predominantly block insulin binding/signaling, producing
    severe insulin resistance; at low titer they can stimulate the receptor,
    producing hypoglycemia. This titer-dependent partial agonism explains the
    hallmark bimodal glycemic course.
  downstream:
  - target: Impaired Insulin Signaling and Extreme Insulin Resistance
    description: >-
      At high antibody titer, receptor blockade impairs downstream insulin
      signaling, driving extreme insulin resistance and hyperglycemia.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These antibodies act as partial agonists, resulting in severe insulin
      resistance and hyperglycemia at high titer, and hypoglycemia at low titer."
    explanation: >-
      Directly documents the partial-agonist behavior of the anti-receptor antibodies
      and the titer-dependent bimodal glycemic consequence.
- name: Impaired Insulin Signaling and Extreme Insulin Resistance
  biological_scale: CELLULAR
  description: >-
    Antibody-mediated blockade of the insulin receptor impairs the downstream
    insulin receptor signaling pathway in insulin target tissues (liver, muscle,
    adipose), producing extreme insulin resistance, refractory hyperglycemia,
    compensatory hyperinsulinemia, hypercatabolism/weight loss, acanthosis
    nigricans, and hyperandrogenism in women.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: Adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: Skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  biological_processes:
  - preferred_term: Insulin receptor signaling pathway
    term:
      id: GO:0008286
      label: insulin receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blockade of insulin action results in hyperglycemia, hypercatabolism,
      severe acanthosis nigricans, and hyperandrogenism in women."
    explanation: >-
      Links receptor blockade to the downstream metabolic and dermatologic phenotype
      of the syndrome.
  - reference: PMID:27254267
    reference_title: "Type B insulin resistance syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "refractory transient hyperglycemia and extreme insulin resistance are
      the cardinal features, but hypoglycemia may also occur"
    explanation: >-
      Identifies refractory hyperglycemia and extreme insulin resistance as the cardinal
      metabolic consequences.
phenotypes:
- name: Severe Insulin Resistance
  description: >-
    Extreme, often refractory insulin resistance requiring very high exogenous
    insulin doses; a cardinal feature of the syndrome.
  phenotype_term:
    preferred_term: Insulin resistance
    term:
      id: HP:0000855
      label: Insulin resistance
    severity: SEVERE
  evidence:
  - reference: PMID:27254267
    reference_title: "Type B insulin resistance syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "refractory transient hyperglycemia and extreme insulin resistance are
      the cardinal features, but hypoglycemia may also occur"
    explanation: >-
      Extreme insulin resistance is named as a cardinal feature of the syndrome.
- name: Refractory Hyperglycemia
  description: >-
    Severe hyperglycemia that is often refractory to very high doses of exogenous
    insulin, corresponding to high autoantibody titers.
  phenotype_term:
    preferred_term: Hyperglycemia
    term:
      id: HP:0003074
      label: Hyperglycemia
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had cachexia, acanthosis nigricans, and persistent hyperglycemia
      despite intravenous insulin infusion exceeding 4 units/kg/day."
    explanation: >-
      Documents refractory hyperglycemia persisting despite extraordinarily high insulin
      infusion rates.
- name: Autoimmune Hypoglycemia
  description: >-
    Fasting or intractable hypoglycemia without exogenous insulin, occurring when
    antibody titers are low and the autoantibodies act as receptor agonists.
    Historically a major driver of mortality.
  phenotype_term:
    preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
  evidence:
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fluctuating glucose levels (ranging from hyperglycemia with extreme insulin
      resistance to intractable hypoglycemia without exogenous insulin administration)"
    explanation: >-
      Documents intractable hypoglycemia without exogenous insulin as part of the fluctuating
      glycemic course.
- name: Acanthosis Nigricans
  description: >-
    Hyperpigmented, velvety skin thickening characteristic of severe insulin
    resistance states, typically severe in type B insulin resistance.
  phenotype_term:
    preferred_term: Acanthosis nigricans
    term:
      id: HP:0000956
      label: Acanthosis nigricans
  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blockade of insulin action results in hyperglycemia, hypercatabolism,
      severe acanthosis nigricans, and hyperandrogenism in women."
    explanation: >-
      Names severe acanthosis nigricans as a consequence of insulin-receptor blockade.
- name: Hyperandrogenism
  description: >-
    Signs of androgen excess (e.g., hirsutism, elevated testosterone) in affected
    women, reflecting the hyperinsulinemic/insulin-resistant state.
  phenotype_term:
    preferred_term: Hyperandrogenism
    term:
      id: HP:0030088
      label: Increased serum testosterone level
  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blockade of insulin action results in hyperglycemia, hypercatabolism,
      severe acanthosis nigricans, and hyperandrogenism in women."
    explanation: >-
      Names hyperandrogenism in women as a feature of the syndrome.
- name: Weight Loss and Hypercatabolism
  description: >-
    Marked hypercatabolism with weight loss (cachexia) accompanies the severe
    insulin-resistant, hyperglycemic phase.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had cachexia, acanthosis nigricans, and persistent hyperglycemia
      despite intravenous insulin infusion exceeding 4 units/kg/day."
    explanation: >-
      Documents cachexia (weight loss/hypercatabolism) accompanying the hyperglycemic phase.
biochemical:
- name: Insulin Receptor Autoantibodies
  notes: >-
    Circulating IgG autoantibodies against the insulin receptor are the defining
    laboratory abnormality; markedly elevated titers confirm the diagnosis and
    fall with successful immunomodulatory therapy.
  evidence:
  - reference: PMID:42438801
    reference_title: "Type B insulin resistance syndrome coexisting with aplastic anemia responsive to early immunosuppressive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markedly elevated insulin receptor autoantibody titers (85.9%) confirmed
      the diagnosis of type B IRS."
    explanation: >-
      Insulin receptor autoantibody titer is the confirmatory diagnostic marker.
- name: Hyperinsulinemia
  notes: >-
    High serum insulin concentrations accompany the insulin-resistant state,
    present in both the hyperglycemic and hypoglycemic phases.
  evidence:
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "high serum insulin levels, and insulin receptor autoantibodies"
    explanation: >-
      Documents high serum insulin levels as a laboratory feature of the syndrome.
environmental:
- name: Coexisting Autoimmune Disease
  description: >-
    Type B insulin resistance is almost invariably associated with another
    autoimmune disorder, most classically systemic lupus erythematosus, which
    reflects the underlying autoimmune diathesis rather than an external exposure.
  evidence:
  - reference: PMID:27254267
    reference_title: "Type B insulin resistance syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder is most frequently reported in middle-aged black women
      and is invariably associated with other autoimmune diseases."
    explanation: >-
      Establishes the near-invariable association with other autoimmune diseases and
      the classic demographic.
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases occur in the African American population in association with
      other underlying autoimmune systemic diseases."
    explanation: >-
      Corroborates the demographic predominance and autoimmune association.
treatments:
- name: Combination Immunomodulatory Therapy (Rituximab, Cyclophosphamide, Pulse Corticosteroids)
  description: >-
    The NIH combination protocol of rituximab, cyclophosphamide, and pulse
    corticosteroids is aimed at suppressing pathogenic anti-insulin-receptor
    autoantibody production and has induced durable remission in treated patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: cyclophosphamide
      term:
        id: NCIT:C405
        label: Cyclophosphamide
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Anti-Insulin Receptor Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Immunomodulation depletes B cells and suppresses pathogenic autoantibody
      production, the primary lesion of the syndrome.
  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report focuses on seven patients who were treated with an intensive
      combination protocol of rituximab, cyclophosphamide, and pulse corticosteroids
      aimed at control of pathogenic autoantibody production."
    explanation: >-
      Describes the combination immunomodulatory protocol and its rationale.
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All seven treated patients achieved remission, defined as amelioration
      of hyperglycemia, discontinuation of insulin therapy, and resolution of hyperandrogenism."
    explanation: >-
      Documents remission of the metabolic and endocrine phenotype after the protocol.
- name: Glucocorticoid Therapy
  description: >-
    Glucocorticoids are used to suppress autoantibody production; their addition
    can produce rapid clinical improvement and a marked fall in insulin receptor
    autoantibody titers.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:42438801
    reference_title: "Type B insulin resistance syndrome coexisting with aplastic anemia responsive to early immunosuppressive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The addition of glucocorticoid therapy resulted in rapid clinical improvement
      and marked reduction in the insulin receptor autoantibody titers"
    explanation: >-
      Documents glucocorticoid-induced improvement and autoantibody titer reduction.
- name: Plasmapheresis
  description: >-
    Therapeutic plasma exchange has been used to lower circulating autoantibody
    burden, with variable outcomes, in patients without spontaneous remission.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  evidence:
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatments with high-dose steroids, immunosuppressants, and plasmapheresis
      have been used, with variable outcomes, in patients without spontaneous remission."
    explanation: >-
      Lists plasmapheresis among treatments used, with variable outcomes.
- name: High-Dose Insulin Therapy (Supportive)
  description: >-
    Very high doses of exogenous insulin (including concentrated U-500 insulin
    and intravenous infusion) are used to control hyperglycemia during the
    insulin-resistant phase, though hyperglycemia is often refractory.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "She had cachexia, acanthosis nigricans, and persistent hyperglycemia
      despite intravenous insulin infusion exceeding 4 units/kg/day."
    explanation: >-
      Illustrates the use of very high-dose intravenous insulin and its frequent inadequacy,
      supporting insulin as supportive (not curative) therapy.

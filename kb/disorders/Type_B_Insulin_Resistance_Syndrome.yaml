- name: High-Titer Insulin Receptor Antagonism
  role: CENTRAL_EFFECTOR
  biological_scale: MOLECULAR
  description: >-
    At high antibody titer, insulin-receptor binding predominantly blocks insulin
    action and initiates the severe insulin-resistant, hyperglycemic state.
  downstream:
  - target: Impaired Insulin Receptor Signaling

  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blockade of insulin action results in hyperglycemia, hypercatabolism, severe acanthosis nigricans, and hyperandrogenism in women."
    explanation: >-
      Names hyperandrogenism in women as a feature of the syndrome.
- name: Weight Loss
  description: >-
    Marked hypercatabolism with weight loss (cachexia) accompanies the severe
    insulin-resistant, hyperglycemic phase.
  phenotype_term:
    preferred_term: Weight loss
    term:
      id: HP:0001824
      label: Weight loss
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had cachexia, acanthosis nigricans, and persistent hyperglycemia despite intravenous insulin infusion exceeding 4 units/kg/day."
    explanation: >-
      Documents cachexia (weight loss/hypercatabolism) accompanying the hyperglycemic phase.
- name: Autoimmunity
  description: >-
    Coexisting systemic autoimmune disease is a common host context for type B
    insulin resistance; it is represented as a phenotype rather than an external
    environmental exposure.
  phenotype_term:
    preferred_term: Autoimmunity
    term:
      id: HP:0002960
      label: Autoimmunity
  evidence:
  - reference: PMID:27254267
    reference_title: "Type B insulin resistance syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This disorder is most frequently reported in middle-aged black women and is invariably associated with other autoimmune diseases."
    explanation: Narrative review supports structured representation of the autoimmune host context while newer cases caution against treating the demographic as exclusive.
- name: Diabetic Ketoacidosis
  description: >-
    Diabetic ketoacidosis can be an initial manifestation of the severe
    insulin-resistant hyperglycemic phase; it is retained as a directly observed
    rare presentation without a frequency band or a stronger causal edge.
  phenotype_term:
    preferred_term: Diabetic ketoacidosis
    term:
      id: HP:0001953
      label: Diabetic ketoacidosis
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 20-year-old Hispanic woman who presented with diabetic ketoacidosis (DKA), severe refractory hyperglycemia, and extreme insulin resistance requiring high doses of U-500 insulin."
    explanation: Directly documents DKA as the presenting manifestation in a confirmed type B insulin resistance case.
biochemical:
- name: Insulin Receptor Autoantibodies
  notes: >-
    Circulating IgG autoantibodies against the insulin receptor are the defining
    laboratory abnormality; markedly elevated titers confirm the diagnosis and
    fall with successful immunomodulatory therapy.
  evidence:
  - reference: PMID:42438801
    reference_title: "Type B insulin resistance syndrome coexisting with aplastic anemia responsive to early immunosuppressive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markedly elevated insulin receptor autoantibody titers (85.9%) confirmed the diagnosis of type B IRS."
    explanation: >-
      Insulin receptor autoantibody titer is the confirmatory diagnostic marker.
- name: Hyperinsulinemia
  notes: >-
    High serum insulin concentrations can accompany both hyperglycemic and
    hypoglycemic phases in the classic phenotype. A rare isolated-hypoglycemia
    subgroup instead has suppressed insulin.
  evidence:
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "high serum insulin levels, and insulin receptor autoantibodies"
    explanation: >-
      Documents high serum insulin levels as a laboratory feature of the syndrome.
- name: Elevated adiponectin
  notes: >-
    Paradoxically elevated adiponectin, often with preserved or elevated C-peptide,
    supports receptor-level severe insulin resistance rather than typical metabolic
    syndrome physiology.
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings showed elevated C-peptide and adiponectin, with positive antinuclear and anti-Smith ribonucleoprotein antibodies."
    explanation: Directly documents elevated adiponectin and C-peptide in a confirmed TBIR case.
prevalence:
- population: Worldwide
  prevalence_class: UNKNOWN
  notes: >-
    The syndrome is rare, and available literature does not establish a
    denominator-based prevalence estimate or a well-defined natural history.
  evidence:
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exact prevalence and disease course are not well known because of the rarity of this syndrome."
    explanation: The review explicitly states that prevalence is unknown.
progression:
- phase: High-titer insulin-resistant phase
  age_range: Acquired disease, most often reported in adulthood
  notes: >-
    High antibody titers can produce abrupt or refractory hyperglycemia, extreme
    insulin resistance, cachexia, and very high insulin requirements.
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had cachexia, acanthosis nigricans, and persistent hyperglycemia despite intravenous insulin infusion exceeding 4 units/kg/day."
    explanation: A human case documents the severe high-titer clinical phase.
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These antibodies act as partial agonists, resulting in severe insulin resistance and hyperglycemia at high titer, and hypoglycemia at low titer."
    explanation: Supports the antibody-titer framing of the insulin-resistant phase.
- phase: Low-titer hypoglycemic phase
  age_range: May follow or alternate with the insulin-resistant phase
  notes: >-
    As antibody concentration and functional balance change, patients may
    transition to spontaneous fasting or recurrent hypoglycemia; isolated
    low-insulin hypoglycemia is a rare subgroup.
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This biphasic glycemic course underscores the complex immunopathophysiology of TBIR."
    explanation: The report explicitly characterizes the hyperglycemia-to-hypoglycemia course as biphasic.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Extreme insulin resistance may require thousands of insulin units per day,
    while a later hypoglycemic phase can be refractory and fatal. Management
    requires vigilant glucose monitoring and immunosuppression, and historical
    mortality was strongly associated with hypoglycemia despite modern gains.
  evidence:
  - reference: PMID:27254267
    reference_title: "Type B insulin resistance syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Traditionally, the high reported mortality rate was typically attributed to the hypoglycemia."
    explanation: Review supports the high burden and mortality associated with the hypoglycemic phase.
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment in the hyperglycemic phase is usually with high doses of insulin (average, 5100 U/d in some studies)"
    explanation: Supports the exceptionally intensive treatment burden of the hyperglycemic phase.

name: Type B Insulin Resistance Syndrome
creation_date: "2026-07-25T00:00:00Z"
category: Autoimmune
parents:
- Autoimmune Disease
- Endocrine Disorder
disease_term:
  preferred_term: Type B Insulin Resistance Syndrome
  term:
    id: MONDO:0016464
    label: insulin-resistance syndrome type B
description: >-
  A rare acquired autoimmune disorder in which polyclonal IgG autoantibodies
  directed against the insulin receptor cause extreme insulin resistance. The
  autoantibodies act as partial agonists of the receptor, so glycemic control is
  characteristically bimodal and titer-dependent: high antibody titers block
  insulin action and produce refractory hyperglycemia with hypercatabolism,
  severe acanthosis nigricans, and hyperandrogenism in women, whereas lower
  titers may stimulate the receptor and produce fasting/autoimmune hypoglycemia.
  The syndrome has been reported most often in middle-aged women (classically
  of African ancestry) and is frequently associated with systemic autoimmune
  disease. It is one of the classic "extreme
  insulin resistance" syndromes, distinguished from the genetic (type A,
  Donohue, Rabson-Mendenhall) forms by its autoimmune, acquired basis. Treatment
  centers on immunomodulation to suppress pathogenic autoantibody production.
pathophysiology:
- name: Pathogenic Anti-Insulin-Receptor Autoantibody Production
  role: TRIGGER
  biological_scale: CELLULAR
  description: >-
    Autoreactive B-cell and plasma-cell activity produces the pathogenic IgG
    autoantibodies directed against the insulin receptor. This cellular source
    is the principal target of combination immunomodulatory therapy.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: Plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  downstream:
  - target: Anti-Insulin Receptor Autoantibodies
    description: Autoantibody production generates the circulating receptor-directed IgG lesion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20484479
      reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report focuses on seven patients who were treated with an intensive combination protocol of rituximab, cyclophosphamide, and pulse corticosteroids aimed at control of pathogenic autoantibody production."
      explanation: The response to a regimen explicitly aimed at production supports this cellular source of the pathogenic antibodies.
  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report focuses on seven patients who were treated with an intensive combination protocol of rituximab, cyclophosphamide, and pulse corticosteroids aimed at control of pathogenic autoantibody production."
    explanation: Directly identifies pathogenic autoantibody production as the therapeutic target.
- name: Anti-Insulin Receptor Autoantibodies
  role: CENTRAL_EFFECTOR
  biological_scale: MOLECULAR
  description: >-
    Circulating IgG autoantibodies directed against the cell-surface insulin
    receptor are the defining acquired autoimmune lesion. Antibody concentration
    determines opposing hyperglycemic and hypoglycemic receptor effects.
  downstream:
  - target: High-Titer Insulin Receptor Antagonism
    description: >-
      At high titer, the receptor-directed antibodies predominantly antagonize
      insulin action.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42255432
      reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These antibodies act as partial agonists, resulting in severe insulin resistance and hyperglycemia at high titer, and hypoglycemia at low titer."
      explanation: Directly supports a high-titer antagonistic state causing severe insulin resistance and hyperglycemia.
  - target: Low-Titer Insulin Receptor Agonism
    description: At low titer, the same receptor-directed antibodies can act as insulin mimetics.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42255432
      reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These antibodies act as partial agonists, resulting in severe insulin resistance and hyperglycemia at high titer, and hypoglycemia at low titer."
      explanation: Directly supports low-titer agonistic antibody activity and hypoglycemia.
  evidence:
  - reference: PMID:42438801
    reference_title: "Type B insulin resistance syndrome coexisting with aplastic anemia responsive to early immunosuppressive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type B insulin resistance syndrome (IRS) is a rare autoimmune disorder characterized by severe insulin resistance caused by autoantibodies against the insulin receptor."
    explanation: >-
      Establishes the primary autoimmune lesion — autoantibodies against the insulin
      receptor as the cause of the syndrome.
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type B insulin resistance belongs to a class of diseases caused by an autoantibody to a cell surface receptor."
    explanation: >-
      Classifies type B insulin resistance among autoantibody-to-cell-surface-receptor

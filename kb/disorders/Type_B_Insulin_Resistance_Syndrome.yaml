phenotypes:
- name: Severe Insulin Resistance
  description: >-
    Extreme, often refractory insulin resistance requiring very high exogenous
    insulin doses; a cardinal feature of the syndrome.
  phenotype_term:
    preferred_term: Insulin resistance
    term:
      id: HP:0000855
      label: Insulin resistance
    severity: SEVERE
  evidence:
  - reference: PMID:27254267
    reference_title: "Type B insulin resistance syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "refractory transient hyperglycemia and extreme insulin resistance are the cardinal features, but hypoglycemia may also occur"
    explanation: >-
      Extreme insulin resistance is named as a cardinal feature of the syndrome.
- name: Refractory Hyperglycemia
  description: >-
    Severe hyperglycemia that is often refractory to very high doses of exogenous
    insulin, corresponding to high autoantibody titers.
  phenotype_term:
    preferred_term: Hyperglycemia
    term:
      id: HP:0003074
      label: Hyperglycemia
  evidence:
  - reference: PMID:42255432
    reference_title: "Type B insulin resistance with glycemic extremes: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She had cachexia, acanthosis nigricans, and persistent hyperglycemia despite intravenous insulin infusion exceeding 4 units/kg/day."
    explanation: >-
      Documents refractory hyperglycemia persisting despite extraordinarily high insulin
      infusion rates.
- name: Autoimmune Hypoglycemia
  description: >-
    Fasting or intractable hypoglycemia without exogenous insulin, occurring when
    antibody titers are low and the autoantibodies act as receptor agonists.
    Historically a major driver of mortality. A rare subgroup has isolated
    hypoglycemia with suppressed, rather than elevated, insulin and may have a
    delayed association with aggressive lymphoma.
  phenotype_term:
    preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
  evidence:
  - reference: PMID:29264467
    reference_title: "Immunosuppressive Therapy in Treatment of Refractory Hypoglycemia in Type B Insulin Resistance: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fluctuating glucose levels (ranging from hyperglycemia with extreme insulin resistance to intractable hypoglycemia without exogenous insulin administration)"
    explanation: >-
      Documents intractable hypoglycemia without exogenous insulin as part of the fluctuating
      glycemic course.
  - reference: PMID:37552775
    reference_title: "Systematic Review-Type B Insulin Resistance With Isolated Hypoglycemia and Suppressed Insulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated hypoglycemia with low insulin forms a rare subgroup of type B insulin
      resistance. These patients lack the common characteristics of hyperinsulinemic
      hypoglycemia and hyperglycemia/insulin resistance. Furthermore, while coexisting
      autoimmune disease is commonly observed, there is potentially an association
      with aggressive lymphoma, the onset of which may be delayed.
    explanation: >-
      A systematic review defines the low-insulin isolated-hypoglycemia subgroup
      and reports a possible delayed association with aggressive lymphoma.
- name: Acanthosis Nigricans
  description: >-
    Hyperpigmented, velvety skin thickening characteristic of severe insulin
    resistance states, typically severe in type B insulin resistance.
  phenotype_term:
    preferred_term: Acanthosis nigricans
    term:
      id: HP:0000956
      label: Acanthosis nigricans
  evidence:
  - reference: PMID:20484479
    reference_title: "Treatment of type B insulin resistance: a novel approach to reduce insulin receptor autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blockade of insulin action results in hyperglycemia, hypercatabolism, severe acanthosis nigricans, and hyperandrogenism in women."
    explanation: >-
      Names severe acanthosis nigricans as a consequence of insulin-receptor blockade.
- name: Hyperandrogenism
  description: >-
    Signs of androgen excess (e.g., hirsutism, elevated testosterone) in affected
    women, reflecting the hyperinsulinemic/insulin-resistant state.
  phenotype_term:
    preferred_term: Hyperandrogenism
    term:
      id: HP:0030348

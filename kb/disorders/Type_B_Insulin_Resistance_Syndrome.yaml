review_notes: >-
  Review was anchored to the acquired autoimmune MONDO entity rather than the
  inherited type A and receptoropathy syndromes. No causal genetic lesion,
  disease-specific public molecular dataset, or evidence-supported experimental
  or animal model was identified in the retained repository sources, so those
  sections are explicitly empty. The pathograph separates high-titer receptor
  antagonism from low-titer receptor agonism and gives every causal edge its own
  evidence. A Monarch D2P audit returned 44 additional Orphanet assertions,
  including many associated autoimmune diseases and nonspecific laboratory
  findings without local source evidence; these were screened rather than
  imported wholesale. DKA was added because the retained case source directly
  documents it, but it remains unwired because that observation alone does not
  establish the exact causal intermediates. Demographic language is descriptive
  rather than exclusive because younger and ethnically diverse cases occur. The
  cellular autoantibody-production node is retained separately from the antibody
  molecule because B/plasma-cell production is the direct target of the reported
  immunomodulatory regimens. Coexisting autoimmunity is structured as a phenotype,
  not an ECTO exposure. Phase-specific supportive therapies and elevated adiponectin
  were added from the retained 2026 case report. No phenotype frequency band was
  assigned without a denominator or source-mapped qualitative frequency.

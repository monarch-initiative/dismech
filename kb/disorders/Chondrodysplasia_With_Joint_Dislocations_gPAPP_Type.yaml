      label: BPNT2
  relationship_type: CAUSATIVE
  evidence:
  - reference: DOI:10.3389/fgene.2021.717535
    reference_title: Congenital Disorders of Deficiency in Glycosaminoglycan Biosynthesis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in IMPAD1 cause chondrodysplasia with joint
      dislocations
    explanation: >-
      States the gene-disease relationship for the gene now symbolised BPNT2.
  notes: >-
    HGNC identifier taken from the MONDO:0013561
    has_material_basis_in_germline_mutation_in axiom
    (identifiers.org/hgnc/26019 ! BPNT2), which matches the stub. Issue #10762
    quotes hgnc:26428 for BPNT2; that identifier is not the one MONDO carries
    and was not used. BPNT2 (previously IMPAD1) lies at 8q12.1 and encodes
    inositol monophosphatase domain-containing protein 1, also called Golgi
    3'-phosphoadenosine 5'-phosphate 3'-phosphatase (gPAPP). The allele
    spectrum is not curated here: no cached reference enumerates the reported
    variants, and the deep-research report committed with this entry describes
    missense substitutions near the phosphatase active site alongside nonsense
    and frameshift alleles without a verifiable source, so nothing about allele
    class is asserted.
pathophysiology:
- name: Biallelic BPNT2 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function BPNT2/IMPAD1 alleles abolish or severely reduce
    the catalytic activity of gPAPP, the Golgi-lumenal 3'-phosphatase whose
    known substrate is the sulfotransferase by-product 3'-phosphoadenosine
    5'-phosphate (PAP). Loss of
    this activity removes the only characterised route for clearing PAP from
    the Golgi lumen.
  genes:

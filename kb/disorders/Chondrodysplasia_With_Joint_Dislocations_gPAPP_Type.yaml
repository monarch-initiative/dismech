      explanation: >-
        States the causal step from failure to clear the reaction product to
        inhibition of the sulfotransferases. The review's own hedge ("may") is
        preserved in this node's description; the step is a proposal, not a
        measured inhibition constant.
- name: Product Inhibition of Golgi Sulfotransferases
  biological_scale: MOLECULAR
  description: >
    Accumulated PAP is understood to inhibit the Golgi glycosaminoglycan
    sulfotransferases, so sulfate transfer onto growing chondroitin and heparan
    sulfate chains falls even though the transferases themselves are intact and
    the donor PAPS is made normally. This distinguishes gPAPP deficiency from
    CHST3 disease (a single transferase is absent), from SLC26A2 disease
    (sulfate uptake fails) and from PAPSS2 disease (donor synthesis fails).
  molecular_functions:

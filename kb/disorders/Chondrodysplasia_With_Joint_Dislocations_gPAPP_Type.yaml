classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal recessive monogenic primary skeletal dysplasia caused by
      biallelic germline loss-of-function variants in BPNT2 (IMPAD1).
    evidence:
    - reference: ORPHA:280586
      reference_title: "Chondrodysplasia with joint dislocations, gPAPP type"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        A rare, genetic, primary bone dysplasia characterized by prenatal onset
        of disproportionate short stature, shortening of the limbs, congenital
        joint dislocations, micrognathia, posterior cleft palate, brachydactyly,
        short metacarpals and irregular size of the metacarpal epiphyses,
        supernumerary carpal ossification centers and dysmorphic facial features.
      explanation: >-
        Orphanet classifies gPAPP deficiency as a rare genetic primary bone
        dysplasia.
  icimd_category:
  - classification_value: o_linked_protein_glycosylation
    notes: >-
      Defective Golgi clearance of 3'-phosphoadenosine 5'-phosphate (PAP)
      secondary to BPNT2/gPAPP deficiency impairs glycosaminoglycan sulfation on
      proteoglycans; curated by the ClinGen Congenital Disorders of
      Glycosylation Gene Curation Expert Panel.
    evidence:
    - reference: CGGV:assertion_f0edef29-df91-4320-b66d-4cc6a4ec3f94-2024-05-16T160000.000Z
      reference_title: "BPNT2 / chondrodysplasia with joint dislocations, gPAPP type (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The encoded protein is localized to the Golgi apparatus and catalyzes
        the hydrolysis of phosphoadebbnosine phosphate (PAP) to adenosine
        monophosphate (AMP).
      explanation: >-
        Establishes the Golgi PAP phosphatase defect underlying impaired
        proteoglycan glycosaminoglycan sulfation.
  isds_skeletal_category:
  - classification_value: sulphation_disorders
    notes: >-
      Group 4 (Sulfation disorders, NOS 04-0060) of the ISDS Nosology, 2023
      revision (Unger et al., PMID:36779427), alongside SLC26A2, PAPSS2, CHST3
      and CHST14/DSE. Mechanistically distinct from the "Dysplasias with
      multiple joint dislocations" group, which collects the glycosaminoglycan
      linkeropathies (CANT1, XYLT1, B3GAT3) that share overlapping congenital
      dislocation and Catel-Manzke-like clinical features.
inheritance:
- name: Autosomal Recessive
  description: >
    Reported patients carry homozygous BPNT2/IMPAD1 variants, frequently in the
    setting of consanguinity; heterozygous carriers are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: DOI:10.3389/fgene.2021.717535
    reference_title: Congenital Disorders of Deficiency in Glycosaminoglycan Biosynthesis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in IMPAD1 cause chondrodysplasia with joint
      dislocations
    explanation: >-
      A homozygous requirement in the reported patients is the direct expression
      of biallelic, recessive inheritance for this gene.
  - reference: PMID:22887726
    reference_title: "IMPAD1 mutations in two Catel-Manzke like patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two homozygous loss-of-function IMPAD1 mutations in the two
      Catel-Manzke like patients (p.Arg187X and p.Ser108ArgfsX48).
    explanation: >-
      Confirms homozygous loss-of-function BPNT2/IMPAD1 alleles in affected
      individuals.

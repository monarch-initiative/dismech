    observation, and it carries no evidence item.
- name: Disorganised Endochondral Ossification
  biological_scale: TISSUE
  description: >
    Reduced growth-plate signalling and proliferation acting on a defective
    cartilage template disorganise endochondral bone formation, producing the
    chondrodysplasia: shortening of the long bones and marked shortening of the
    tubular bones of the hands.
  biological_processes:

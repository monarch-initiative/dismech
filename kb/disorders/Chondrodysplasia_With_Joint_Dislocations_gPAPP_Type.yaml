    causal_link_type: DIRECT
  - target: Brachydactyly
    causal_link_type: DIRECT
- name: Incompetent Periarticular Soft Tissue
  biological_scale: TISSUE
  description: >
    Joint capsule, ligament and articular surfaces built from undersulfated
    proteoglycan lose the mechanical competence needed to hold the large joints
    reduced, which is the presumed basis of the congenital dislocations that
    name the disorder. The intervening steps have not been demonstrated in
    BPNT2-deficient tissue.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  downstream:
  - target: Multiple congenital joint dislocations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  notes: >-
    Asserted mechanistically, not observed. This node is the weakest link in
    the chain and is the obvious target for the primary literature that could
    not be retrieved during this curation session.

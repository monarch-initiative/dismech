name: Chondrodysplasia With Joint Dislocations gPAPP Type
synonyms:
- gPAPP deficiency
- BPNT2-related chondrodysplasia with congenital joint dislocations
- IMPAD1-related chondrodysplasia with joint dislocations
- Chondrodysplasia with joint dislocations, GPAPP type
creation_date: '2026-09-03T22:30:00Z'
category: Mendelian
description: >
  Chondrodysplasia with joint dislocations, gPAPP type is an autosomal recessive
  skeletal dysplasia caused by homozygous or compound heterozygous variants in
  BPNT2 (formerly IMPAD1), which encodes the Golgi-resident 3'-phosphoadenosine
  5'-phosphate (PAP) 3'-phosphatase gPAPP. Every Golgi sulfotransferase reaction
  transfers sulfate from the donor PAPS and releases PAP as its by-product;
  gPAPP hydrolyses that by-product to AMP. When gPAPP activity is lost, PAP is
  not cleared from the Golgi lumen and is understood to inhibit the
  glycosaminoglycan sulfotransferases that generated it, so cartilage
  proteoglycan chains are assembled but left undersulfated. The disorder
  therefore belongs to the sulfation group of skeletal dysplasias alongside
  SLC26A2, CHST3 and PAPSS2 disease, but is distinguished by acting on the
  disposal of the sulfotransferase reaction product rather than on sulfate
  uptake, donor synthesis, or a single transferase. Clinically it presents with
  short stature, pronounced brachydactyly, congenital dislocation of multiple
  joints, cleft palate, micrognathia and facial dysmorphism.

      reference_title: Sulfation of chondroitin sulfate proteoglycans is necessary for proper
        Indian hedgehog signaling in the developing growth plate.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In situ hybridization and immunohistochemical analysis of bm
        limb growth plates showed diminished Indian hedgehog (Ihh) signaling and

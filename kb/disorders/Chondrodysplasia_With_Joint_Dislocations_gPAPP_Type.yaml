  biological_scale: TISSUE
  description: >
    The large joints do not form or do not remain reduced, which is the basis
    of the congenital dislocations that name the disorder. The node is
    deliberately named for the outcome rather than for a mechanism, because
    two different mechanisms are on the table and neither is established in
    BPNT2-deficient tissue. One is mechanical: joint capsule, ligament and
    articular surfaces built from undersulfated proteoglycan lack the
    competence to hold a joint reduced. The other is developmental: the
    Impad1-null mouse is reported to misposition and misorient its
    interphalangeal joints, which would make this a patterning failure rather
    than a failure of tissue strength. The developmental account fits the
    congenital onset better, and the two are distinguishable by whether joints
    form in the wrong place or form correctly and then fail.
  locations:
  - preferred_term: synovial joint
    term:
      id: UBERON:0002217
      label: synovial joint
  - preferred_term: skeletal joint
    term:
      id: UBERON:0000982
      label: skeletal joint
  biological_processes:
  - preferred_term: embryonic skeletal joint development
    term:
      id: GO:0072498
      label: embryonic skeletal joint development
    modifier: ABNORMAL
  downstream:
  - target: Multiple congenital joint dislocations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Joint hypermobility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  notes: >-
    Named for the joint-level outcome rather than committing to either
    mechanical capsular laxity or embryonic joint-patterning failure, because
    direct histological studies of human BPNT2-deficient joint tissue have not
    resolved between the two mechanisms.

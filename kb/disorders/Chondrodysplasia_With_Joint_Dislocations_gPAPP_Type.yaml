      bone formation.
    causal_link_type: DIRECT
  - target: Incompetent Periarticular Soft Tissue
    description: >-
      The same proteoglycan defect is present in the joint capsule and
      periarticular connective tissue, which depend on it for mechanical
      competence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  notes: >-
    No source available to this curation session examines cartilage or joint
    tissue from a BPNT2-deficient human or mouse, so this node is asserted from

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, the catabolic abnormality in the reaction product of donor
      substrate including 3 ′-phosphoadenosine 5′-phosphate may result in
      the inhibition of GAG-sulfotransferases
    explanation: >-
      States that the reaction product PAP is not catabolised, which is the
      accumulation this node asserts. Quoted as a whole sentence so the claim,
      and the review's own hedge on what follows from it, are both visible.
  downstream:
  - target: Product Inhibition of Golgi Sulfotransferases
    description: >-
      Unhydrolysed PAP is proposed to feed back on the glycosaminoglycan

    Indian hedgehog binds chondroitin sulfate chains, and in particular
    chondroitin-4-sulfate, on the major cartilage proteoglycan aggrecan.
    Undersulfation disturbs its distribution in the extracellular matrix and
    reduces hedgehog signalling in the growth plate, with a measurable fall in
    chondrocyte proliferation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in IMPAD1 cause chondrodysplasia with joint
      dislocations
    explanation: >-
      A homozygous requirement in the reported patients is the direct expression
      of biallelic, recessive inheritance for this gene.

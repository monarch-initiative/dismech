discussions:
- discussion_id: gap_gpapp_human_tissue_undersulfation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Has undersulfation of cartilage glycosaminoglycans been demonstrated
    directly in tissue or cells from a person with BPNT2/gPAPP deficiency,
    rather than inferred from the Impad1-null mouse?
  attaches_to:
  - pathophysiology#Undersulfation of Cartilage Glycosaminoglycans
  rationale: >-
    The biochemical claim at the centre of this entry rests on a mouse
    knockout. Patient fibroblast or cartilage glycosaminoglycan analysis is
    routine in the sibling sulfation disorders (it is how CHST3 deficiency is
    distinguished from SLC26A2 deficiency), so its presence or absence for
    BPNT2 is a concrete and answerable question.
- discussion_id: gap_gpapp_joint_dislocation_route
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does undersulfated proteoglycan produce congenital
    dislocation of multiple joints, and why are the large joints affected
    disproportionately?
  attaches_to:
  - pathophysiology#Incompetent Periarticular Soft Tissue
  rationale: >-
    Congenital joint dislocation is the feature that names this disorder and
    that it shares with CHST3 disease, recessive Larsen syndrome and Desbuquois
    dysplasia, yet the step from a matrix sulfation defect to a dislocated
    joint is asserted in every one of them and demonstrated in none.
- discussion_id: gap_gpapp_craniofacial_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of gPAPP produce cleft palate and micrognathia, and is the
    route the same proteoglycan-sulfation defect that acts in the growth plate?
  attaches_to:
  - phenotypes#Cleft palate
  - phenotypes#Micrognathia
  rationale: >-
    The cleft palate and micrognathia of this disorder are recorded here as
    phenotypes with no upstream mechanism node, because no source available to
    this curation session connects them to the sulfation defect. The connection
    is plausible - the palatal shelves and Meckel's cartilage are built from
    the same proteoglycan-rich mesenchyme, and the same craniofacial pairing
    recurs in CANT1 and PAPSS2 disease - but plausibility across a disease
    group is not a demonstrated route, and the edge was deliberately left out
    rather than asserted.
review_notes: >-
  Curated under a network-restricted session in which all literature and
  ontology services (NCBI E-utilities, Europe PMC, Crossref, OLS, OBO PURLs,
  genenames.org) were blocked by egress policy, so no new reference could be
  fetched into references_cache/. Every evidence item therefore cites a
  reference that was already committed to the cache. The primary reports of
  this disorder - Vissers et al. 2011 (AJHG, PMID:21549340), Nizon et al. 2012
  (Am J Med Genet A), Frederick et al. 2008 (the Impad1-null mouse) and
  Venkatapuram et al. 2022 - are cited here only at second hand through the
  Mizumoto and Yamada 2021 review, and should be fetched and cited directly
  when the entry is next revised. Treatments, clinical burden, progression,
  diagnostic criteria, radiographic features and datasets are absent for the
  same reason rather than because they were judged out of scope.

  A deep-research run was performed with the claude_code provider
  (research/Chondrodysplasia_With_Joint_Dislocations_gPAPP_Type-deep-research-claude_code.md).
  It ran under the same egress restriction, so its own reference- and
  term-validation passes could not execute and it states that its quotations
  are reconstructed from search-result summaries rather than fetched full text.
  Nothing from that report is cited here. It is committed as a lead list for
  the next revision, and the leads worth following are: Vissers et al. 2011
  (PMID:21549340, disease-gene discovery); Nizon et al. 2012 (PMID:22887726,
  two Turkish patients with a Catel-Manzke-like phenotype and nonsense and
  frameshift alleles); Venkatapuram et al. 2022 (DOI:10.1002/ajmg.a.62622,
  fetal presentation); and Sohaskey et al. 2008 (PMID:18539921), the
  Impad1-null "Jaws" mouse, whose reported ectopic interphalangeal joints are a
  more specific account of the joint phenotype than the matrix-competence
  argument this entry currently makes, and whose perinatal lethality against a
  postnatally viable human phenotype looks like a HUMAN_MODEL_MISMATCH worth
  recording once it can be cited. The report also lists phenotypes this entry
  does not carry - prenatal-onset limb shortening, short metacarpals with
  irregular epiphyses, supernumerary carpal ossification centres, carpal
  synostosis, hearing impairment and mild psychomotor delay - which are absent
  here only because no cached reference supports them. Its suggested HP
  bindings should not be reused without checking: it gives HP:0001374 as

- name: Altered Cartilage Extracellular Matrix
  biological_scale: TISSUE
  description: >
    Undersulfated chondroitin sulfate chains change the charge density,
    hydration and ligand-binding behaviour of the proteoglycan-rich matrix of
    hyaline, epiphyseal and articular cartilage and of the periarticular
    connective tissue built on it.

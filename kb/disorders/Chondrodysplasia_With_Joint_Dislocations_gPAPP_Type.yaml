    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      may result in the inhibition of GAG-sulfotransferases
    explanation: >-
      Identifies the enzyme's compartment and reaction: the review describes
      gPAPP as the Golgi phosphatase acting on the sulfotransferase reaction
      product, and attributes the disease to failure of that step.
  downstream:
  - target: Golgi Accumulation of PAP
    description: >-
      With no phosphatase to hydrolyse it, the sulfotransferase by-product is
      not removed from the compartment in which it is produced.
    causal_link_type: DIRECT
- name: Golgi Accumulation of PAP
  biological_scale: MOLECULAR
  description: >
    Each Golgi sulfotransferase reaction consumes PAPS and releases
    3'-phosphoadenosine 5'-phosphate (PAP). gPAPP normally hydrolyses PAP to
    adenosine 5'-monophosphate; without it the by-product accumulates in the
    Golgi lumen.

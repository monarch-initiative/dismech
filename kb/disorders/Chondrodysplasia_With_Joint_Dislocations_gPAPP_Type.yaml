  downstream:
  - target: Impaired Indian Hedgehog Signalling in the Growth Plate
    description: >-
      Indian hedgehog binds cartilage proteoglycans through their chondroitin
      sulfate chains, so undersulfation degrades its distribution and signalling
      in the growth plate.
    causal_link_type: DIRECT
    evidence:

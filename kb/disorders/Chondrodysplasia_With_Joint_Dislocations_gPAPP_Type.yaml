- name: Undersulfation of Cartilage Glycosaminoglycans
  conforms_to: "growth_plate_chondrocyte_failure#Cartilage Matrix, Signalling or Chondrocyte Biosynthetic Lesion"
  biological_scale: MOLECULAR
  description: >
    Chondroitin sulfate chains are assembled but undersulfated. In the
    Impad1-null mouse the change is a fall in 4-O-sulfated chondroitin sulfate
    with a reciprocal rise in the non-sulfated species, together with a smaller
    shift of the same kind in heparan sulfate; the heparan sulfate shift was
    measured in lung. Chain synthesis itself is not blocked, which separates
    this disorder from the linkeropathies and the chain-elongation defects.
  chemical_entities:

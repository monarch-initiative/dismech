progression:
- phase: Infantile severe presentation
  notes: >-
    The severe extreme of the reported range. A one-year-old with severe left ventricular
    dilation and dysfunction, carrying a de novo ACTC1 p.Ala222Thr allele together with a
    paternally inherited TTN variant, died suddenly. The fatal outcome is recorded here rather
    than as a phenotype because HPO files death in infancy under clinical course. The double
    genotype means this case cannot be used to characterise the ACTC1 allele on its own.
  evidence:
  - reference: PMID:39759977
    reference_title: "A De Novo Mutation in ACTC1 and a TTN Variant Linked to a Severe Sporadic Infant Dilated Cardiomyopathy Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "In conclusion, our findings suggest a likely pathogenic de novo mutation in ACTC1 in coexpression of a TTN variant as possible causes of an early onset of a severe DCM and premature death."
    explanation: >-
      The authors' conclusion, quoted with both variants named, because the attribution to
      ACTC1 alone is exactly what they decline to make.
- phase: Adult-onset dilated cardiomyopathy
  notes: >-
    The typical presentation, and the one the founding families represent: hereditary
    idiopathic dilated cardiomyopathy diagnosed in adulthood. Across reported R312H carriers
    the age range runs from two to thirty-six years, so childhood presentation is possible but
    the mode is adult. The E361G mouse suggests a mechanism for late onset - the heart is
    normal until it is stressed - but that link has not been tested in patients.
  evidence:
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."

    explanation: >-
      The reported age range for the principal DCM allele. Indirect because it is a citing
      summary rather than a primary clinical series.
genetic:
- name: ACTC1
  notes: >-
    ACTC1 at 15q14 encodes cardiac alpha-actin, the thin-filament monomer of the cardiac
    sarcomere, and it was the first sarcomeric gene in which DCM-causing mutations were
    reported. The essential curation problem with this gene is that its alleles do not
    converge on one disease. The same gene underlies hypertrophic cardiomyopathy, left
    ventricular noncompaction, atrial septal defect and a distal arthrogryposis syndrome with
    congenital heart defects, and the HCM and congenital-heart literatures are considerably
    larger than the DCM one. A search on the gene symbol will return mostly material that does
    not belong in this entry.

    The evidence asymmetry is recorded by ClinGen: the Hypertrophic Cardiomyopathy Gene
    Curation Expert Panel classified ACTC1 for HCM as Definitive in 2021, while the Dilated
    Cardiomyopathy Gene Curation Expert Panel classified the same gene for DCM as Moderate in
    2026, in a curation keyed to MONDO:0013261 itself. ACTC1-DCM is a real gene-disease
    relationship on a weaker evidential footing than
    ACTC1-HCM.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ACTC1
    term:
      id: hgnc:143
      label: ACTC1
  variants:
  - name: p.Arg312His (R312H)
    description: >-
      The principal DCM allele and one of the two identified in 1998. Its interest is that the
      same codon carries an HCM allele: R312C is found in hypertrophic cardiomyopathy patients
      and R312H in dilated cardiomyopathy patients, which makes this pair the cleanest
      available demonstration that in ACTC1 the allele determines the phenotype. The
      biophysical characterisation of R312H is inconsistent across laboratories and is the
      basis for the three hypothesis groups in this entry. One source notes it has also been
      seen in HCM patients, so even this allele is not phenotypically exclusive.
    clinical_significance: PATHOGENIC
    type: missense_variant
    gene:
      preferred_term: ACTC1
      term:
        id: hgnc:143
        label: ACTC1
    evidence:
    - reference: PMID:39802493
      reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      snippet: "Of interest are two different substitution mutations at R312 on ACTC: R312H leads to DCM, while R312C was found in patients with HCM."
      explanation: The allele-determines-phenotype statement at a single codon.
    - reference: PMID:39510186
      reference_title: "Duality in disease: How two amino acid substitutions at actin residue 312 result in opposing forms of cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Though the pathogenicity is difficult to determine, R312C was found in patients clinically presenting with HCM (4), while R312H has been found in both HCM and DCM patients (3)"
      explanation: >-
        The important qualifier, and the reason this entry does not claim a clean one-allele
        one-disease rule: R312H itself has been reported in both phenotypes. Indirect because
        it is this paper's summary of the clinical literature rather than its own cohort.
    - reference: PMID:22590617

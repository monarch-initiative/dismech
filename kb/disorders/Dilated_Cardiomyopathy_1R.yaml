inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous ACTC1 missense variants transmitted as an autosomal dominant trait. The
    founding evidence is cosegregation in two unrelated kindreds with hereditary idiopathic
    dilated cardiomyopathy. A de novo heterozygous allele has also been reported in a
    sporadic infant case, so absence of family history does not exclude the diagnosis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9563954
    reference_title: "Actin mutations in dilated cardiomyopathy, a heritable form of heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Missense mutations in ACTC that cosegregate with IDC were identified in two unrelated families."
    explanation: >-
      The founding cosegregation evidence in two independent families, which is what
      established ACTC1 as a DCM gene.
  - reference: PMID:39759977
    reference_title: "A De Novo Mutation in ACTC1 and a TTN Variant Linked to a Severe Sporadic Infant Dilated Cardiomyopathy Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "For this reason, it was very interesting to find that the ACTC1 mutation in the subject of study was not segregated by either of the parents, denoting its de novo origin"
    explanation: >-
      A de novo heterozygous allele in a sporadic case, which is why a negative family
      history does not exclude an ACTC1 aetiology.
  - reference: CGGV:assertion_3e9b4048-3003-4180-b891-fcf10d25a814-2026-03-04T170000.000Z
    reference_title: "ACTC1 / dilated cardiomyopathy 1R (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "ACTC1 | HGNC:143 | dilated cardiomyopathy 1R | MONDO:0013261 | AD | Moderate"
    explanation: >-
      ClinGen records the mode of inheritance as autosomal dominant - and, in the same row,
      grades the strength of the ACTC1-DCM relationship as Moderate.
mechanistic_hypotheses:
- hypothesis_group_id: actc1_calcium_desensitization_model
  hypothesis_label: Thin-filament calcium-desensitization model
  status: CANONICAL
  description: >-
    The field's default account of sarcomeric cardiomyopathy: hypertrophic alleles increase
    the calcium sensitivity of the myofilament and dilated alleles decrease it, so at a given
    systolic calcium transient the mutant sarcomere generates less force, the ventricle is
    hypocontractile, and it dilates. Applied to ACTC1 this is the model that predicts the
    R312C/R312H split at a single codon. It is recorded as CANONICAL because it is the frame
    the whole literature is written against, not because ACTC1 confirms it - the direct
    measurements on the ACTC1 DCM alleles are inconsistent with it as often as not, which is
    the substance of the other two hypothesis groups.
  evidence:
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "HCM results from increases in calcium sensitivity and/or force production, while DCM results from reductions in these activities."
    explanation: The model stated in its own terms by a group that then goes on to test it on ACTC1.
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Characterization of variants of cardiac actin (ACTC) found in patients with HCM or DCM has generally supported the calcium sensitivity hypothesis."
    explanation: >-
      The general-case support, quoted with its hedge intact. The same paper reports the
      specific failure below.
  - reference: PMID:19799913
    reference_title: "Human actin mutations associated with hypertrophic and dilated cardiomyopathies demonstrate distinct thin filament regulatory properties in vitro."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "In contrast when compared to WT actin, the R312H mutation increased Ca++-sensitivity for velocity in the motility assay without effecting myosin strong-binding activation at pCa 10."
    explanation: >-
      A direct contradiction of the model for the principal ACTC1 DCM allele: the model
      requires R312H to be calcium-desensitising and this measurement makes it sensitising.
      Recorded as REFUTE rather than hidden in a note.
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "We performed regulated actomyosin assays to investigate the differences between R312H- and R312C-ACTC variants and found that both ACTC variants had similar changes in pCa curves relative to WT-ACTC, disproving the hypothesis that opposite changes should be observed if ACTC changes trigger different disease phenotypes from onset."
    explanation: >-
      The second contradiction, and a different one: the HCM and DCM alleles at residue 312
      shift calcium sensitivity in the same direction, so calcium sensitivity cannot be what
      separates the two diseases here.
  notes: >-
    The two REFUTE items disagree with each other as well as with the model - one laboratory
    reports R312H as calcium-sensitising and the other as desensitising. That disagreement
    is itself curated, in the knowledge-gap discussion, rather than resolved by picking a
    side.
- hypothesis_group_id: actc1_tni_phosphorylation_uncoupling_model
  hypothesis_label: Troponin-I phosphorylation uncoupling and loss of cardiac reserve
  status: ALTERNATIVE
  description: >-
    The model with the best in vivo support in ACTC1. Normally, PKA phosphorylation of
    troponin I during beta-adrenergic stimulation desensitises the myofilament to calcium,
    which speeds relaxation and supplies inotropic and lusitropic reserve. The ACTC1 E361G
    allele abolishes that phosphorylation-dependent shift: calcium sensitivity becomes fixed
    rather than modulable. The predicted consequence is a heart that is normal at rest and
    fails under demand, and that is exactly what the E361G mouse shows - unremarkable
    baseline contractility and cardiac dimensions out to eighteen months, a blunted response
    to dobutamine, and overt systolic dysfunction only after four weeks of angiotensin II
    stress. Under this model the primary lesion is a regulatory one, and dilation is the
    consequence of chronic inability to meet load rather than of weak sarcomeres.
  evidence:
  - reference: PMID:20600154
    reference_title: "Investigation of a transgenic mouse model of familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "We propose that the ACTC E361G mutation uncouples myofilament Ca(2+)-sensitivity from Troponin I phosphorylation and blunts the response to adrenergic stimulation, leading to a reduced cardiac reserve with consequent contractile dysfunction under stress, leading to dilated cardiomyopathy."
    explanation: The model stated in full by the group that generated the mouse.
  - reference: PMID:20600154
    reference_title: "Investigation of a transgenic mouse model of familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "For NTG actin-containing thin filaments EC(50) native/dPTn=3.0+/-0.3 but for E361G-containing thin filaments EC(50) native/dPTn=1.04+/-0.07."
    explanation: >-
      The measurement the model rests on: wild-type thin filaments shift threefold on
      troponin dephosphorylation, E361G filaments do not shift at all.
  - reference: PMID:26432839
    reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Thus as predicted, the uncoupling of the relationship between Ca2+ sensitivity and TnI phosphorylation by theACTCE361G DCM-causing mutation results in reduced physiological cardiac reserve."
    explanation: >-
      The prediction tested in intact heart muscle five years later, closing the loop from
      the reconstituted-filament measurement to whole-organ physiology.
  notes: >-
    Sourced entirely from one allele (E361G) in one transgenic line from one group. It is the
    most complete mechanistic account in ACTC1-DCM and also the narrowest, and no equivalent
    in vivo work exists for R312H.
- hypothesis_group_id: actc1_residual_activity_relaxation_model
  hypothesis_label: Residual myosin activity under relaxing conditions
  status: EMERGING
  description: >-
    The newest proposal, and the one that most directly displaces calcium sensitivity as the
    discriminator. Characterising R312C and R312H side by side, both variants shifted calcium
    sensitivity in the same direction, but they differed in how much actomyosin activity
    persisted at pCa 10, where tropomyosin should be blocking myosin entirely. R312H filaments
    were the most active of the three under those relaxing conditions - every filament moved,
    where some wild-type filaments did not - while producing lower force under load. The
    proposal is that a sarcomere which never fully switches off cannot relax properly, and
    that chronic failure of relaxation, not weak contraction, is what dilates the ventricle.
  evidence:
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "We observed a gradient of increased residual myosin activity with R312-ACTC variant proteins under relaxing conditions which may trigger different disease development."
    explanation: The proposal, stated with the authors' own hedge.
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "As opposed to WT-ACTC and R312C-ACTC where some filaments showed no movement, all R312H-ACTC filaments exhibited a velocity greater than zero."
    explanation: >-
      The concrete observation behind it, at the level of individual filaments under
      conditions where none should be moving.
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "R312H-ACTC had the significantly lower displacement force while R312C-ACTC displacement force was significantly higher (Table 2)."
    explanation: >-
      The force half of the same result, and the part that does fit the DCM direction: the
      DCM allele generates less force than wild type, the HCM allele more.
  - reference: PMID:39510186
    reference_title: "Duality in disease: How two amino acid substitutions at actin residue 312 result in opposing forms of cardiomyopathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: "Structural models of actin R312C and R312H variants were developed in silico, identifying structural rearrangements to the 'tropomyosin bumper' (Tm-bumper, residues 222-230) and changes to internal communication networks unique to each variant."
    explanation: >-
      Proposes a structural route from residue 312 to altered tropomyosin positioning, which
      is how a substitution far from the myosin interface could leave the filament
      incompletely switched off. Molecular dynamics, so COMPUTATIONAL and INDIRECT.
  notes: >-
    The same 2024 paper notes that this has a therapeutic consequence which cuts against
    standard reasoning: a myosin activator, the intuitive drug for a hypocontractile DCM,
    would amplify the lesion if the lesion is excess resting activity.
pathophysiology:
- name: ACTC1 Missense Variant in Cardiac Alpha-Actin
  biological_scale: MOLECULAR
  role: initiator
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous missense substitution in cardiac alpha-actin, the monomer that polymerises
    into the thin filament. The DCM-associated alleles are single amino-acid changes at
    conserved residues; the two founding ones, R312H and E361G, lie in the parts of actin
    that engage the Z band and the intercalated disc rather than in the myosin-binding
    surface, which is why the original interpretation was a force-transmission defect.
    Notably, the intrinsic properties of the mutant protein are barely changed - polymerisation
    kinetics, melting temperature and DNase-I inhibition are close to wild type - so the lesion
    is in how the filament is regulated, not in whether it forms.
  genes:
  - preferred_term: ACTC1
    term:
      id: hgnc:143
      label: ACTC1
  molecular_functions:
  - preferred_term: actin filament binding within the cardiac thin filament
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: ABNORMAL
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Altered Thin Filament Regulation of Actomyosin
    causal_link_type: DIRECT
    description: >-
      A substitution in the actin monomer changes the regulated filament it builds, which is
      the immediate molecular consequence.
  evidence:
  - reference: PMID:9563954
    reference_title: "Actin mutations in dilated cardiomyopathy, a heritable form of heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Both mutations affect universally conserved amino acids in domains of actin that attach to Z bands and intercalated discs."
    explanation: >-
      The structural localisation of the two founding alleles, and the basis for the original
      force-transmission interpretation.
  - reference: PMID:9563954
    reference_title: "Actin mutations in dilated cardiomyopathy, a heritable form of heart failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "these results raise the possibility that defective transmission of force in cardiac myocytes is a mechanism underlying heart failure"
    explanation: >-
      The authors' own inference, quoted with its hedge. Indirect: the sentence proposes a
      mechanism from variant position rather than reporting one measured.
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Our results here, however, do not reflect major changes in overall actin structure for either the R312C- or R312H-ACTC proteins compared to WT-ACTC, with similar polymerization rates, melting temperatures and DNase-I inhibition IC50 values."
    explanation: >-
      The negative result that localises the defect away from actin folding and
      polymerisation and toward filament regulation.
  - reference: PMID:22590617
    reference_title: "Subdomain location of mutations in cardiac actin correlate with type of functional change."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "The two ACTC mutants associated with DCM are R312H and E361G."
    explanation: >-
      Names the two DCM alleles explicitly, which is the statement the entry needs and which
      the 1998 abstract does not supply - it reports two missense mutations without naming
      them.
  - reference: PMID:22590617
    reference_title: "Subdomain location of mutations in cardiac actin correlate with type of functional change."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "the E361G mutation affects a-actinin binding"
    explanation: >-
      A measured protein-interaction consequence for the second DCM allele, and the closest
      thing to a demonstration of the 1998 force-transmission hypothesis: alpha-actinin is
      the Z-disc actin cross-linker. Indirect because the sentence is this paper's summary of
      prior work rather than its own result.
- name: Altered Thin Filament Regulation of Actomyosin
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The regulated thin filament - actin plus tropomyosin plus troponin - no longer switches
    between its blocked, closed and open states normally. What exactly goes wrong is where the
    three hypothesis groups diverge, and the downstream edges are tagged accordingly rather
    than being collapsed into one claim. Measurements that are agreed across laboratories:
    maximal calcium-activated filament velocity is reduced, and myosin's ADP release is slowed
    so it detaches more slowly. Measurements that are not agreed: the direction of the shift
    in calcium sensitivity, and whether the filament is fully inhibited in the absence of
    calcium.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: regulation of cardiac muscle contraction by the thin filament
    term:
      id: GO:0055117
      label: regulation of cardiac muscle contraction
    modifier: DYSREGULATED
  - preferred_term: actin-myosin filament sliding
    term:
      id: GO:0033275
      label: actin-myosin filament sliding
    modifier: DECREASED
  locations:
  - preferred_term: myofibril
    term:
      id: GO:0030016
      label: myofibril
  downstream:
  - target: Loss of Adrenergic Contractile and Lusitropic Reserve
    causal_link_type: DIRECT
    hypothesis_groups:
    - actc1_tni_phosphorylation_uncoupling_model
    description: >-
      Under the uncoupling model, fixing calcium sensitivity so that troponin I
      phosphorylation no longer shifts it is precisely what removes the reserve.
    evidence:
    - reference: PMID:26432839
      reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "The uncoupling of Ca2+sensitivity from TnI phosphorylation caused by the thin-filament DCM mutations, includingACTCE361G, blunts the response to adrenergic stimulation, compromising the lusitropic response and adversely affecting cardiac reserve."
      explanation: The edge stated as a causal chain by the group that measured both ends of it.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - actc1_calcium_desensitization_model
    - actc1_residual_activity_relaxation_model
    description: >-
      The direct route from a mis-regulated filament to a dilated ventricle, which the
      desensitisation and residual-activity models both assert and neither has demonstrated
      in an intact ACTC1 heart. Marked INDIRECT_UNKNOWN_INTERMEDIATES for that reason: the
      steps between an in vitro motility measurement and chamber remodelling are not filled in.
  evidence:
  - reference: PMID:19799913
    reference_title: "Human actin mutations associated with hypertrophic and dilated cardiomyopathies demonstrate distinct thin filament regulatory properties in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Both the HCM (E99K) and DCM (R312H) human actin mutations resulted in significant reductions in maximal Ca++-regulated thin filament velocity."
    explanation: >-
      One of the two findings that laboratories agree on, and notably one that does not
      separate the HCM allele from the DCM allele.
  - reference: PMID:19799913
    reference_title: "Human actin mutations associated with hypertrophic and dilated cardiomyopathies demonstrate distinct thin filament regulatory properties in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Without any demonstrable effect on k+ATP, these data suggest that both the E99K and the R312H mutation result in a decrease in ADP release kinetics"
    explanation: >-
      The kinetic step behind the velocity reduction: slower ADP release keeps myosin bound
      to actin for longer.
  - reference: PMID:22590617
    reference_title: "Subdomain location of mutations in cardiac actin correlate with type of functional change."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "The R312H variant exhibited reduced stability, with a T(m) of 53.6 °C compared to 56.8 °C for WT actin, accompanied with increased polymerization critical concentration and Pi release rate, and a marked increase in nucleotide release rates."
    explanation: >-
      A third laboratory's measurements on R312H, which disagree with the 2022 report of
      near-normal melting temperature and polymerisation quoted on the node above. Both are
      recorded; the disagreement is the point.
  - reference: PMID:26194323
    reference_title: "Do cardiac actin mutations lead to altered actomyosin interactions?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Based on our analysis of 8 ACTC mutants, we infer that mutations in ACTC lead to disease through various molecular mechanisms."
    explanation: >-
      A survey of eight ACTC alleles concluding that there is no single ACTC1 mechanism,
      which is the reason this node is PROVISIONAL and carries three hypothesis groups.
  notes: >-
    The same survey states that for the non-E99K mutants, including R312H, measurable changes
    in the core actin-myosin interaction do not appear to drive disease - a negative result
    that argues the lesion is regulatory rather than in the motor itself.
- name: Loss of Adrenergic Contractile and Lusitropic Reserve
  biological_scale: TISSUE
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    A ventricle that performs acceptably at rest but cannot increase its output or speed its
    relaxation when driven. In the E361G mouse, dobutamine raised cardiac output by 2,100
    microlitres per minute in wild-type animals and only 900 in mutants, and the relaxation
    indices moved by a quarter to a third of the wild-type amount. Baseline cardiac dimensions
    and systolic function were essentially normal over four to eighteen months. The clinical
    reading is that CMD1R may be a disease of failed reserve, which would explain why human
    onset can be late and why an intercurrent stress can precipitate presentation.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: regulation of the force of heart contraction
    term:
      id: GO:0002026
      label: regulation of the force of heart contraction
    modifier: DECREASED
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - actc1_tni_phosphorylation_uncoupling_model
    intermediate_mechanisms:
    - Chronic haemodynamic or neurohormonal stress that a reserve-less ventricle cannot meet.
    description: >-
      In the mouse this step required an experimental stress to appear: four weeks of
      angiotensin II infusion converted a normal-looking heart into a dilated, dysfunctional
      one, while wild-type animals were unaffected.
    evidence:
    - reference: PMID:26432839
      reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "The chronic stress treatment evoked systolic dysfunction in ACTC E361G mice but not in NTG."
      explanation: The stress-dependence of the transition, with the wild-type control stated.
    - reference: PMID:26432839
      reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "Ejection fraction and CO were reduced in the ACTC E361G mouse, indicating DCM."
      explanation: The measured endpoint that the authors read as dilated cardiomyopathy.
  evidence:
  - reference: PMID:26432839
    reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "The inotropic effect of dobutamine was also blunted in ACTC E361G mice, and the dobutamine-stimulated increase in cardiac output (CO) was reduced from 2,100 to 900 μl/min."
    explanation: The quantified loss of inotropic reserve.
  - reference: PMID:26432839
    reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Pressure-volume measurements showed increases in maximum rate of pressure decline and decreases in time constant of left ventricular pressure decay in the ACTC E361G mouse that were 25-30% of the changes in the NTG mouse, consistent with blunting of the lusitropic response."
    explanation: The lusitropic half, measured by conductance catheter in the intact animal.
  - reference: PMID:20600154
    reference_title: "Investigation of a transgenic mouse model of familial dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "We measured cardiac performance by cine-MRI, echocardiography and with a conductance catheter over a period of 4 to 18 months and found minimal systematic differences between NTG and ACTC E361G mice under basal conditions."
    explanation: >-
      The baseline-normal half of the phenotype, which is what makes this a reserve defect
      rather than a resting contractile defect.
  notes: >-
    PROVISIONAL and mouse-only. No human CMD1R study has measured contractile reserve - by
    stress echocardiography, cardiopulmonary exercise testing or any other route - so this
    node is a mechanism imported from a transgenic model, not one observed in patients.
- name: Left Ventricular Dilation and Systolic Dysfunction

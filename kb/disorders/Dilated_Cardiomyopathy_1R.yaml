name: Dilated Cardiomyopathy 1R
category: Mendelian
creation_date: "2026-09-03T00:00:00Z"
synonyms:
- CMD1R
- cardiomyopathy, dilated, 1R
- cardiomyopathy, dilated, type 1R
- dilated cardiomyopathy type 1R
- ACTC1 familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in ACTC1
description: >-
  CMD1R is familial isolated dilated cardiomyopathy caused by variants in ACTC1, the gene
  for cardiac alpha-actin. It was the first sarcomeric gene in which DCM-causing mutations
  were found: in 1998 two missense alleles, R312H and E361G, were shown to cosegregate with
  hereditary idiopathic dilated cardiomyopathy in two unrelated families, and the authors
  argued from their positions - in the regions of actin that anchor the thin filament to Z
  bands and intercalated discs - that the defect was in force transmission rather than force
  generation.

  The thing that makes this entry difficult is that the gene is not the diagnosis. ACTC1
  also causes hypertrophic cardiomyopathy, left ventricular noncompaction, atrial septal
  defect, and, since 2023, a distal arthrogryposis syndrome with congenital heart defects.
  Which disease a carrier gets is set by the allele, not by the gene, and the sharpest
  demonstration of that is a single codon: R312C is found in hypertrophic cardiomyopathy
  patients and R312H in dilated cardiomyopathy patients. Same residue, same gene, opposite
  ventricles. This entry is scoped to the phenotype MONDO defines for this term - familial
  isolated DCM - and deliberately excludes the atrial-septal-defect and distal-arthrogryposis
  literatures, which are larger and would otherwise dominate any search on the gene.

  The mechanism is genuinely unsettled, and the entry carries three competing models rather
  than one. The field's default is the calcium-sensitivity hypothesis: HCM alleles raise
  myofilament calcium sensitivity, DCM alleles lower it, and a desensitised sarcomere
  produces less force and dilates. For ACTC1 this holds only loosely. The most-studied DCM
  allele, R312H, has been reported with increased calcium sensitivity in one laboratory and
  decreased in another, and the most recent work finds it hyperactive under low-calcium
  relaxing conditions - which is the opposite of hypocontractility. The best in vivo evidence
  points somewhere else entirely: the E361G mouse has essentially normal baseline
  contractility and fails only under stress, because the mutation abolishes the normal
  coupling between troponin I phosphorylation and myofilament calcium sensitivity, so the
  heart cannot mount an adrenergic inotropic or lusitropic response and has no cardiac
  reserve to spend.

  A curator should also know the evidential footing. ClinGen's Dilated Cardiomyopathy Gene
  Curation Expert Panel classified ACTC1 for DCM as **Moderate** in March 2026, in a curation
  keyed directly to this MONDO term, while the
  Hypertrophic Cardiomyopathy panel classifies the same gene for HCM as **Definitive**. That
  asymmetry is not a technicality - it is the same allelic point restated as evidence
  strength, and it caps how firmly anything in this entry can be asserted.

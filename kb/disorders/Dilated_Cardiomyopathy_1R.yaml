diagnosis:
- name: Genetic testing on a dilated cardiomyopathy panel
  description: >-
    CMD1R has no distinguishing clinical or imaging feature. It is diagnosed by finding a
    pathogenic ACTC1 variant in a patient whose ventricle is dilated and hypocontractile
    without an adequate acquired explanation, usually on a multigene cardiomyopathy panel or
    exome sequencing. Two interpretation problems are specific to this gene. First, the ACTC1
    result must be read against the phenotype: the same gene yields HCM, LVNC, atrial septal
    defect and a skeletal-muscle syndrome, so the variant, not the gene, carries the
    diagnosis. Second, ClinGen grades the gene-disease relationship for DCM as Moderate, which
    is the tier at which a variant of uncertain significance should not be over-read.
  evidence:
  - reference: CGGV:assertion_3e9b4048-3003-4180-b891-fcf10d25a814-2026-03-04T170000.000Z
    reference_title: "ACTC1 / dilated cardiomyopathy 1R (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "ACTC1 | HGNC:143 | dilated cardiomyopathy 1R | MONDO:0013261 | AD | Moderate"
    explanation: >-
      The validity grade that should temper interpretation of an ACTC1 finding in a DCM
      patient.
  - reference: PMID:37457373
    reference_title: "Variants in ACTC1 underlie distal arthrogryposis accompanied by congenital heart defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Pathogenic variants in ACTC1 have been found previously to underlie atrial septal defect, dilated cardiomyopathy, hypertrophic cardiomyopathy, and left ventricular noncompaction."
    explanation: >-
      Why an ACTC1 hit does not by itself make a CMD1R diagnosis: four other phenotypes share
      the gene.
differential_diagnoses:
- name: ACTC1-related hypertrophic cardiomyopathy
  description: >-
    The same gene with a different allele, and the commonest way an ACTC1 result is
    misattributed. ClinGen grades ACTC1 for HCM as Definitive, against Moderate for DCM, and
    the HCM literature on this gene is substantially larger. The R312 pair is the sharpest
    example, with R312C in HCM patients and R312H in DCM patients.
  distinguishing_features:
  - The imaging phenotype decides it - a thickened, non-dilated left ventricle with preserved or supranormal ejection fraction is HCM, not CMD1R.
  - Approximately 10 to 20 percent of HCM progresses to a dilated, hypokinetic stage, so a dilated ventricle in a known ACTC1 carrier may be end-stage HCM rather than primary DCM.
  evidence:
  - reference: CGGV:assertion_2f62793b-0015-46eb-bb51-bddbae25ba0d-2021-06-23T201616.296Z
    reference_title: "ACTC1 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "ACTC1 | HGNC:143 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive"
    explanation: The competing ACTC1 gene-disease relationship, at the higher validity tier.
  - reference: PMID:39802493
    reference_title: "A gradient of force generation at rest differentiates cardiomyopathy outcomes with variants of actin located at the same residue."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Even when a mutation causes a shift in contraction, long term effects can complicate diagnosis and treatment; for example, approximately 10-20 % of HCM cases are believed to progress into DCM (known as H-DCM)"
    explanation: >-
      The quantitative basis for the second distinguishing feature, and the reason a dilated
      ACTC1 ventricle is not automatically CMD1R.
- name: ACTC1-related atrial septal defect with late-onset dilated cardiomyopathy
  description: >-
    A distinct ACTC1 phenotype in which a congenital septal defect is the presenting feature
    and dilated cardiomyopathy appears decades later. It is excluded from this entry because
    MONDO scopes this term to familial *isolated* dilated cardiomyopathy, and a kindred with
    penetrant atrial septal defect is not that. The distinction matters practically: the
    ACTC1 congenital-heart-defect literature is larger than the DCM literature and will
    otherwise be pulled into a CMD1R search.
  distinguishing_features:
  - A structural septal defect from birth, usually with a family history of the same defect, points to the ASD phenotype rather than to isolated CMD1R.
  - In CMD1R the ventricle is structurally normal until it dilates; there is no congenital malformation.
  evidence:
  - reference: PMID:37457373
    reference_title: "Variants in ACTC1 underlie distal arthrogryposis accompanied by congenital heart defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Pathogenic variants in ACTC1 have been found previously to underlie atrial septal defect, dilated cardiomyopathy, hypertrophic cardiomyopathy, and left ventricular noncompaction."
    explanation: >-
      Establishes atrial septal defect as a separate ACTC1 phenotype from dilated
      cardiomyopathy. Indirect because the sentence is background in a paper about a fifth
      phenotype.
- name: ACTC1-related distal arthrogryposis with congenital heart defects
  description: >-
    Reported in 2023 in five families: heterozygous ACTC1 missense variants causing a distal
    arthrogryposis syndrome, sometimes with cardiac malformation. It is a skeletal-muscle
    phenotype and is out of scope here, but it is the newest and largest reason that a
    literature search on ACTC1 returns material irrelevant to CMD1R.
  distinguishing_features:
  - Congenital contractures of the distal limbs are the presenting feature; CMD1R has no skeletal-muscle phenotype.
  evidence:
  - reference: PMID:37457373
    reference_title: "Variants in ACTC1 underlie distal arthrogryposis accompanied by congenital heart defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "We report five families with DA because of heterozygous missense variants in the gene actin, alpha, cardiac muscle 1 (ACTC1)."
    explanation: The primary report of this distinct ACTC1 phenotype.
- name: TTN-truncating and other higher-evidence genetic dilated cardiomyopathy
  description: >-
    TTN truncating variants are the commonest identifiable genetic cause of DCM, and LMNA,
    BAG3, FLNC, RBM20, DES and PLN account for much of the rest. All are clinically
    indistinguishable from CMD1R; the separation is molecular. This differential is not
    academic for ACTC1 - the one detailed CMD1R case in the literature also carried a TTN
    variant, and its authors could not assign causality to either gene alone.
  distinguishing_features:
  - Only sequencing separates the genotypes; imaging and clinical course overlap.
  - A second variant in a higher-evidence DCM gene in the same patient weakens attribution to ACTC1, as in the reported infant case.
  evidence:
  - reference: PMID:39759977
    reference_title: "A De Novo Mutation in ACTC1 and a TTN Variant Linked to a Severe Sporadic Infant Dilated Cardiomyopathy Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "For a matter of fact, its crucial role and its nucleotide length make TTN the major affected gene in DCM cases [38, 39]."
    explanation: >-
      TTN as the dominant genetic cause of DCM, stated in the very paper where a TTN variant
      complicated an ACTC1 attribution.
- name: Acquired dilated cardiomyopathy
  description: >-
    Coronary disease, hypertension, valvular disease, sustained tachyarrhythmia, alcohol and
    other cardiotoxins, myocarditis and the peripartum state all produce a dilated,
    hypocontractile ventricle and must be excluded before a genetic diagnosis is made.
  distinguishing_features:
  - A coronary-territory wall-motion abnormality or an ischaemic pattern of late gadolinium enhancement favours ischaemic cardiomyopathy.
  - An identified exposure or loading condition with recovery after its removal, and no family history, favours an acquired cause.
treatments:
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Standard medical therapy for heart failure with reduced ejection fraction: the four
    contemporary pillars - an angiotensin receptor-neprilysin inhibitor or ACE inhibitor or
    ARB, an evidence-based beta blocker, a mineralocorticoid receptor antagonist and an SGLT2
    inhibitor - with diuresis for congestion as required. It is not directed at the actin lesion, and no CMD1R
    outcome data exist. Recorded because it is what these patients actually receive, and
    without an efficacy claim.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin receptor-neprilysin inhibitor
      term:
        id: NCIT:C190796
        label: Angiotensin Receptor-Neprilysin Inhibitor
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: evidence-based beta blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: mineralocorticoid receptor antagonist
      term:
        id: NCIT:C101255
        label: Aldosterone Receptor Antagonist
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
  notes: >-
    All four pillars of contemporary HFrEF therapy are bound. The mineralocorticoid receptor
    antagonist is bound to `NCIT:C101255` Aldosterone Receptor Antagonist, which is the class
    term NCIT files it under; searching the "mineralocorticoid" spelling does not surface it.

    No treatment_effect and no target_mechanisms link. Neither exists in the CMD1R literature,
    and asserting one would claim a mechanism-level effect that has not been shown for this
    genotype. The E361G mouse suggests, without testing, that a therapy acting through
    beta-adrenergic signalling faces a sarcomere that cannot transduce it.
- name: Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for prevention of sudden cardiac death, indicated by general cardiomyopathy
    and arrhythmia criteria. There is no ACTC1-specific arrhythmic risk stratification, and
    the single reported sudden death in a CMD1R patient occurred in an infant who also carried
    a TTN variant, which is not a basis for a genotype-specific rule.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  notes: >-
    Deliberately carries no evidence item. Quoting the general DCM device literature here
    would attach a cohort denominator that is not CMD1R's.
- name: Heart Transplantation
  description: >-
    The endpoint for refractory advanced heart failure, on the same criteria as any other
    dilated cardiomyopathy. No CMD1R-specific transplant series exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
- name: Cascade Screening of At-Risk Relatives
  description: >-
    Cardiac surveillance of first-degree relatives with genetic testing where the familial
    variant is known. The rationale in CMD1R is the disease's own history: the gene was found
    by cosegregation in families, and the E361G mouse suggests carriers may look normal at
    rest until stressed, which is an argument for imaging relatives rather than waiting for
    symptoms. Contemporary implementation guidance for genotype-positive relatives of any
    cardiomyopathy gene suggests ECG plus echocardiography every one to three years before
    age sixty and every three to five years thereafter, individualised by variant, family
    history and phenotype. That interval is general cardiomyopathy practice, not an ACTC1
    finding, and no CMD1R-specific surveillance schedule has been validated.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic screening of at-risk relatives
    term:
      id: NCIT:C92803
      label: Genetic Screening
  evidence:
  - reference: PMID:20301486
    reference_title: "Dilated Cardiomyopathy Overview."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Provide a basic view of genetic risk assessment of at-risk asymptomatic"
    explanation: >-
      GeneReviews names risk assessment of asymptomatic relatives as one of the overview's
      purposes. Quoted short because the cached record for this chapter holds only the front
      matter, and indirect because it is generic to DCM rather than to ACTC1.
animal_models:
- name: ACTC E361G transgenic mouse
  species: Mouse
  genotype: Transgenic expressing human ACTC E361G at approximately 50% of total cardiac actin
  publication: PMID:20600154
  description: >-
    The only animal model of an ACTC1 dilated-cardiomyopathy allele. It expresses the human
    E361G actin at about half of total cardiac actin, which approximates the heterozygous
    human state better than most sarcomeric transgenics do. Its scientific value is that it
    is almost normal: baseline contractility, cardiac dimensions and myocyte function are
    unremarkable, and the phenotype only appears when the animal is challenged with
    dobutamine or with four weeks of angiotensin II.
  modeled_mechanisms:
  - target: Loss of Adrenergic Contractile and Lusitropic Reserve
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This node is defined by the mouse rather than merely supported by it. Blunted inotropic
      and lusitropic responses to dobutamine, measured by papillary muscle mechanics,
      conductance catheter and echocardiography, are the primary observations.
    limitations: >-
      A transgenic overexpression model rather than a knock-in, so the mutant protein competes
      with endogenous mouse actin at a ratio set by the transgene rather than by allelic
      balance. Mouse and human cardiac beta-adrenergic signalling and heart rates differ
      substantially, and the corresponding measurement - contractile reserve on stress testing
      - has never been made in a human ACTC1 carrier.
    readouts:
    - name: Dobutamine-stimulated increase in cardiac output
      target: Loss of Adrenergic Contractile and Lusitropic Reserve
      direction: DECREASED
      interpretation: >-
        The standard measure of inotropic reserve, and the one that falls furthest - from
        2,100 to 900 microlitres per minute.
      evidence:
      - reference: PMID:26432839
        reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "The combination of these effects is to reduce the dobutamine-stimulated increase in CO (a measure of cardiac reserve) from 2,100 to 900 μl/min."
        explanation: The measurement, with both values.
    - name: Peak rate of force decline normalised to force in papillary muscle under dobutamine
      target: Loss of Adrenergic Contractile and Lusitropic Reserve
      direction: DECREASED
      interpretation: >-
        The lusitropic readout. DECREASED refers to the dobutamine-induced *increment*: wild
        type gains about 50% and the mutant only 20 to 30%, so the drug-stimulated relaxation
        response is smaller, not that relaxation is slower at baseline.
      evidence:
      - reference: PMID:26432839
        reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "In papillary muscle at 37°C, dobutamine increased relaxation rates [∼50% increase of peak rate of force decline normalized to force (dF/dtmin/F), 25% reduction of time to 90% relaxation (t90) in nontransgenic (NTG) mice], but in the ACTC E361G mouse, dF/dtmin/F was increased 20-30%, and t90 was only reduced 10% at 10 Hz."
        explanation: >-
          The wild-type and mutant increments side by side, which is what makes this a blunted
          response rather than an absolute deficit.
    evidence:
    - reference: PMID:20600154
      reference_title: "Investigation of a transgenic mouse model of familial dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "However, the increase in septal thickening, ejection fraction, heart rate and cardiac output following dobutamine treatment was significantly less in ACTC E361G mice compared with NTG."
      explanation: >-
        Establishes the model as informative for this node: the reserve deficit is the
        phenotype it has.
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reaches a dilated, dysfunctional ventricle, but only after four weeks of
      angiotensin II infusion, and it passes through a hypertrophic stage on the way.
    limitations: >-
      PARTIALLY_RECAPITULATES because the model does not develop spontaneous dilated
      cardiomyopathy: over 4 to 18 months unstressed it is indistinguishable from wild type,
      and the DCM phenotype requires an experimental pressor stress that has no counterpart in
      the human disease. The authors also note that the response to chronic angiotensin II is
      strongly mouse-strain dependent, and that C57BL/6 animals are particularly resistant,
      which limits how far the stress protocol generalises.
    readouts:
    - name: Left ventricular ejection fraction after chronic angiotensin II
      target: Left Ventricular Dilation and Systolic Dysfunction
      direction: DECREASED
      interpretation: >-
        The endpoint the authors interpret as dilated cardiomyopathy in this model.
      evidence:
      - reference: PMID:26432839
        reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "Ejection fraction and CO were reduced in the ACTC E361G mouse, indicating DCM."
        explanation: The measured drop and the authors' reading of it.
    evidence:
    - reference: PMID:26432839
      reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "Altogether, these data suggest that under chronic angiotensin-induced stress,ACTCE361G mouse hearts develop hypertrophy initially and later dilation."
      explanation: >-
        Supports the model as informative for the dilation node, and states the hypertrophic
        intermediate stage that makes the recapitulation partial rather than complete.
    - reference: PMID:26432839
      reference_title: "A dilated cardiomyopathy mutation blunts adrenergic response and induces contractile dysfunction under chronic angiotensin II stress."
      supports: NO_EVIDENCE
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "A number of studies point to a significant effect of mouse strain, or even substrain, in determining the response to chronic cardiac stress, including chronic isoprenaline or angiotensin infusion (1,7,9,10,30), and it appears that C57BL/6 mice are particularly resistant to ANG II (25)."
      explanation: >-
        NO_EVIDENCE rather than REFUTE: the authors are stating a limitation of the stress
        protocol, not reporting an experiment that contradicts the finding. It bears on how
        far the model generalises without cutting either way on the claim.
- name: Acta1b p.T126I zebrafish
  species: Zebrafish
  genotype: Acta1b p.T126I, orthologous to human ACTC1 p.T126I
  publication: PMID:42563511
  description: >-
    A zebrafish knock-in carrying the fish orthologue of a human ACTC1 DCM allele, followed
    longitudinally and analysed separately by sex. Unlike the E361G mouse it develops
    spontaneous progressive dilated cardiomyopathy with ventricular dilation, pericardial
    effusion and reduced survival, without an imposed stress. Its most striking result is a
    sex effect: female mutants had earlier and sustained diastolic dysfunction, more
    remodelling and significantly worse survival.
  modeled_mechanisms:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Progressive dilation and pump failure arising without experimental provocation, which
      is the part of the human phenotype the mouse model does not reproduce unaided.
    limitations: >-
      Fidelity is LOW for a specific and important reason: the mutation was made in acta1b, a
      *skeletal* actin paralogue standing in for cardiac actin, because zebrafish gene
      duplication does not map one-to-one onto human ACTC1. The two-chambered zebrafish heart
      has no left ventricle, so "left ventricular dilation" is an interpretation of ventricular
      dilation in a single ventricle. The sexual dimorphism, which is the paper's headline
      finding, has no established counterpart in human ACTC1 disease.
    readouts:
    - name: Survival of adult mutants
      target: Left Ventricular Dilation and Systolic Dysfunction
      direction: DECREASED
      interpretation: >-
        Reduced survival accompanying progressive dilation, the organism-level consequence.
      evidence:
      - reference: PMID:42563511
        reference_title: "Early pre-symptomatic and sex-specific cardiac remodeling precedes heart failure in zebrafish with human actin mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "Mutants showed variable onset of cardiac dysfunction, with progressive DCM, pericardial effusion, ventricular dilation, and reduced survival in adults."
        explanation: The phenotype and the survival readout in one sentence.
    - name: nppb transcript at pre-symptomatic stage
      target: Left Ventricular Dilation and Systolic Dysfunction
      direction: INCREASED
      interpretation: >-
        The natriuretic-peptide marker of cardiac stress rising before overt dysfunction,
        which is what makes this model informative about the pre-symptomatic phase.
      evidence:
      - reference: PMID:42563511
        reference_title: "Early pre-symptomatic and sex-specific cardiac remodeling precedes heart failure in zebrafish with human actin mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: DIRECT
        snippet: "Molecular profiling at a pre-symptomatic stage identified upregulation of nppb, downregulation of hypertrophic transcription factors (gata4, mef2ca), and sex-specific alterations in calcium handling genes (serca2, pln1, slc8a1a) and proteostasis regulators (hsf1, bag3)."
        explanation: >-
          The pre-symptomatic transcriptional signature, with nppb up and the hypertrophic
          transcription factors down.
    evidence:
    - reference: PMID:42563511
      reference_title: "Early pre-symptomatic and sex-specific cardiac remodeling precedes heart failure in zebrafish with human actin mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: DIRECT
      snippet: "These findings demonstrate that the Acta1b p.T126I mutation drives progressive, sex-specific DCM in zebrafish, highlighting biological sex as a critical modifier of sarcomeric cardiomyopathy progression and targeted therapy development."
      explanation: >-
        Establishes the model as informative for a dilated-cardiomyopathy node, and states the
        sex modifier that its limitations qualify.
discussions:
- discussion_id: cmd1r_r312h_biophysics_disagreement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Thin Filament Regulation of Actomyosin
  - mechanistic_hypotheses#actc1_calcium_desensitization_model
  prompt: >-
    Does the ACTC1 R312H variant increase or decrease myofilament calcium sensitivity, and is
    the DCM allele hypocontractile at all?
  rationale: >-
    Three laboratories have measured R312H and reached incompatible answers. In 2010 it
    increased calcium sensitivity of velocity in the motility assay. In 2012 it had reduced
    thermal stability, a raised polymerisation critical concentration and markedly faster
    nucleotide release. In 2022 its melting temperature and polymerisation kinetics were
    indistinguishable from wild type, its calcium sensitivity was reduced rather than raised,
    and it was the most active of the three proteins under relaxing conditions. These are not
    small quantitative differences; they point in opposite directions on the axis the
    canonical model uses to separate DCM from HCM. Until they are reconciled, the mechanistic
    account of the principal ACTC1 DCM allele is unsettled, and this matters therapeutically:
    a myosin activator is the obvious drug for a hypocontractile sarcomere and would worsen
    one whose problem is that it never switches off.
  proposed_experiments:
  - experiment_id: cmd1r_exp_r312h_knockin_mouse
    name: Knock-in mouse or human iPSC-cardiomyocyte carrying ACTC1 R312H
    description: >-
      Generate a heterozygous R312H knock-in - in mouse, and independently in isogenic human
      iPSC-derived cardiomyocytes - and measure myofilament calcium sensitivity, resting
      tension, relaxation kinetics and contractile reserve in the same preparation, avoiding
      the recombinant-protein purification differences the authors themselves blame for the
      disagreement.
    would_support:
    - mechanistic_hypotheses#actc1_residual_activity_relaxation_model
    supporting_outcome:
    - >-
      Elevated resting tension and impaired relaxation with normal or near-normal peak systolic
      force, matching the residual-activity model rather than simple hypocontractility.
    would_refute:
    - mechanistic_hypotheses#actc1_residual_activity_relaxation_model
    refuting_outcome:
    - >-
      Reduced calcium sensitivity and reduced peak force with normal resting tension and normal
      relaxation, which would return the canonical desensitisation model to the field.
  notes: >-
    The 2022 authors propose a zebrafish knock-in as their own next step. A mammalian knock-in
    or an isogenic human iPSC pair is proposed here instead because the open question is
    calcium handling and adrenergic reserve, where zebrafish physiology diverges most.
- discussion_id: cmd1r_no_human_reserve_measurement
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Adrenergic Contractile and Lusitropic Reserve
  prompt: >-
    Do human ACTC1 carriers actually have reduced contractile reserve before their ventricles
    dilate?
  rationale: >-
    The most complete mechanistic account in this entry - troponin-I phosphorylation
    uncoupling producing a heart that is normal at rest and fails under stress - rests entirely
    on one transgenic mouse line carrying one allele, studied by one group. It is coherent and
    it is corroborated across reconstituted filaments, papillary muscle and intact animals, but
    every step of it is murine. No human CMD1R carrier has had contractile reserve measured. If
    the model is right it has an immediate clinical consequence: a genotype-positive relative
    with a normal resting echocardiogram might still be abnormal on stress testing, which would
    make stress echocardiography or cardiopulmonary exercise testing the right surveillance
    tool rather than serial resting imaging. If it is wrong, the mouse is describing a
    transgene artefact.
  proposed_experiments:
  - experiment_id: cmd1r_exp_human_stress_echo
    name: Stress echocardiography and cardiopulmonary exercise testing in genotype-positive ACTC1 carriers
    description: >-
      Recruit ACTC1 variant carriers identified by cascade screening, including those with
      normal resting ventricular dimensions and ejection fraction, and measure contractile and
      lusitropic reserve by dobutamine or exercise stress echocardiography alongside peak
      oxygen uptake, against genotype-negative relatives as controls.
    would_support:
    - pathophysiology#Loss of Adrenergic Contractile and Lusitropic Reserve
    supporting_outcome:
    - >-
      Blunted augmentation of ejection fraction and of relaxation indices on stress in carriers
      with normal resting studies, mirroring the dobutamine response of the E361G mouse.
    would_refute:
    - pathophysiology#Loss of Adrenergic Contractile and Lusitropic Reserve
    refuting_outcome:
    - >-
      Normal contractile and lusitropic reserve in phenotype-negative carriers, which would
      confine the uncoupling mechanism to the transgenic mouse and leave human dilation
      unexplained by it.
- discussion_id: cmd1r_zebrafish_sex_dimorphism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish
  notes: >-
    The anchor is `animal_models#Zebrafish` rather than the model's `name`, because the
    schema resolves `animal_models#` against the `species` slot. It reads oddly beside the
    model's own name and is nonetheless the correct reference.
  prompt: >-
    Is the sex difference in the zebrafish ACTC1 model - earlier diastolic dysfunction and
    worse survival in females - present in human ACTC1 carriers?
  rationale: >-
    The zebrafish acta1b p.T126I model reports pronounced sexual dimorphism as its central
    finding, with female mutants showing earlier and sustained diastolic dysfunction, greater
    remodelling and significantly lower survival. Human dilated cardiomyopathy in general does
    show sex differences, but in the opposite direction from what is usually assumed for
    sarcomeric disease, and no sex-stratified analysis of ACTC1 carriers exists. Two
    features make the translation genuinely uncertain rather than merely untested: the mutation
    is in a skeletal actin paralogue rather than a cardiac one, and zebrafish sex determination
    and cardiac physiology differ substantially from human. Recorded as a mismatch rather than a
    plain knowledge gap because the model evidence is strong and specific while its human
    validity is what is open.
  proposed_experiments:
  - experiment_id: cmd1r_exp_sex_stratified_carriers
    name: Sex-stratified natural-history analysis of ACTC1 dilated-cardiomyopathy carriers
    description: >-
      Pool ACTC1 DCM carriers across cardiomyopathy registries and analyse age at diagnosis,
      diastolic indices, remodelling and event-free survival stratified by sex, with
      non-ACTC1 sarcomeric DCM carriers as the comparison group so that any effect can be
      attributed to the gene rather than to DCM in general.
    would_support:
    - animal_models#Zebrafish
    supporting_outcome:
    - >-
      Earlier onset and worse outcomes in female ACTC1 carriers relative to male carriers, and
      relative to the sex difference seen in non-ACTC1 sarcomeric DCM.
    would_refute:
    - animal_models#Zebrafish
    refuting_outcome:
    - >-
      No sex difference in ACTC1 carriers beyond that seen in sarcomeric DCM generally, which
      would make the zebrafish dimorphism a property of the model rather than of the gene.
notes: >-
  Curated as a DISEASE. MONDO defines this term as familial isolated dilated cardiomyopathy
  caused by ACTC1 mutation, and per-subtype DCM entries are settled convention in this
  knowledge base. The entry has one conserved pathograph from an ACTC1 missense allele through
  altered thin-filament regulation to left ventricular dilation, so it is not a grouping, and
  it has a MONDO term and an OMIM entry of its own, so it is not a subtype line on the DCM
  umbrella. The stub is deleted.

  **How the ACTC1 HCM and congenital-heart literatures were kept out.** The gene-level
  preflight check passes trivially - ACTC1 is mentioned 89 times in the deep-research report -
  and tells you nothing, because every ACTC1 paper mentions ACTC1. The filter used instead was
  MONDO's own definition of this term, familial *isolated* dilated cardiomyopathy, applied
  per citation. Three candidate sources were excluded from the pathograph on that basis and
  moved to differential_diagnoses where they belong: the 2019 report of an ACTC1 p.Gly247Asp
  kindred with penetrant atrial septal defect plus late-onset dilated cardiomyopathy, whose
  myocardial ultrastructure and cardiomyocyte work is real DCM mechanism but comes from a
  non-isolated phenotype; the 2023 report of ACTC1 distal arthrogryposis with congenital heart
  defects, cited only for its one-sentence statement of the gene's allelic spectrum; and a
  2026 case of ACTC1-associated left ventricular noncompaction in a patient who also carried a
  COL4A4 variant. Every pathophysiology citation in this entry is about a DCM-phenotype
  allele - R312H, E361G or A222Thr.

  **Dual MONDO parentage and grouping membership.** MONDO:0013261 has two superclasses -
  familial isolated dilated cardiomyopathy (MONDO:0700335) and left ventricular noncompaction
  (MONDO:0018901) - and "left ventricular noncompaction 4" is among its synonyms. That matters
  because `kb/groupings/Familial_Dilated_Cardiomyopathy.yaml` deliberately excludes the left
  ventricular noncompaction entries as a distinct morphological entity. This entry is
  therefore **not** added to that grouping in this pull request. The reason is not that CMD1R
  fails to belong, but that adding a dual-parented CMD/LVNC term is a change to the grouping's
  own inclusion rule and should be argued in a pull request against the grouping, where the
  same question can be settled for every other dual-parented term at once, rather than settled
  by side effect here. The `parents:` list carries `Dilated Cardiomyopathy`, which is the
  claim the evidence in this entry actually supports.

  **Cross-reference.** `Hypertrophic_Cardiomyopathy_11` is the ACTC1 hypertrophic entry
  (CMH11) and already records that ACTC1 is allelically pleiotropic. The two entries are the
  same gene at opposite ends of the R312 contrast and should be read together.

  ClinGen's arrhythmogenic right ventricular cardiomyopathy panel classifies ACTC1 for ARVC as
  No Known Disease Relationship, which is cited in the genetic section. It is the one boundary
  of this gene's phenotype spectrum that is settled by an expert panel rather than merely
  unexplored.

  What is deliberately not curated: no biochemical markers, no clinical trials, no datasets,
  no environmental factors and no histopathology. Cardiomyocyte apoptosis, sarcomeric disarray
  and extracellular-matrix expansion have been described for an ACTC1 allele, but only in the
  atrial-septal-defect kindred, so importing them would breach the scoping rule above. No
  prevalence rate is asserted: DCM cohort denominators are not ACTC1 denominators.

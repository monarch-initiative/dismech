animal_models:
- name: Mfsd7c-null mouse
  species: Mouse
  genotype: Mfsd7c knockout (Mfsd7c-/-)
  publication: PMID:38302740
  description: >
    Constitutive knockout of the murine FLVCR2 ortholog. Metabolomics of knockout
    embryos shows choline-related metabolites altered in brain but not liver, which is
    what localises the defect to the blood-brain barrier rather than to systemic
    choline handling. The model is also the source of the directionality problem
    curated below: endothelial-specific deletion suppressed import of exogenous choline
    from blood yet raised brain choline, and stable-isotope tracing implicated the
    carrier in exporting lysophosphatidylcholine-derived choline instead.
  genes:
  - preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  modeled_mechanisms:
  - target: Failure of Brain Choline Supply
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >
      The knockout reproduces a brain-restricted disturbance of choline handling, which
      is the substrate-level claim of the node. It does not settle the direction of
      transport, and the brain choline concentration moved opposite to the direction a
      simple import failure predicts.
    limitations: >
      Mouse, and constitutive rather than allele-matched to any patient genotype. The
      central discrepancy is unresolved within the model itself: brain choline rose
      rather than fell on endothelial deletion, so the model supports a choline-handling
      defect without supporting brain choline deficiency as such.
    readouts:
    - name: Brain choline-related metabolite profile
      target: Failure of Brain Choline Supply
      direction: ALTERED
      interpretation: >
        Choline-related metabolites are altered in knockout brain but not liver,
        localising the transport defect to the blood-brain barrier.
      evidence:
      - reference: PMID:38302740
        reference_title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Particularly, we found that choline-related metabolites were altered in the brains but not in the livers of Mfsd7c-/- embryos."
        explanation: The measurement grounding this readout and its tissue specificity.
    - name: Brain choline concentration after endothelial-specific deletion
      target: Failure of Brain Choline Supply
      direction: INCREASED
      interpretation: >
        A negative result for the simple import model: suppressing blood-derived choline
        import raised rather than lowered brain choline.
      evidence:
      - reference: PMID:38302740
        reference_title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "Mice lacking Mfsd7c in endothelial cells of the central nervous system suppressed the import of exogenous choline from blood but unexpectedly had increased choline levels in the brain."
        explanation: >-
          Quantified in the direction opposite to that predicted by a pure import
          failure, which is why it is graded REFUTE against this node's claim.
    evidence:
    - reference: PMID:38302740
      reference_title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we used Mfsd7c knockout (Mfsd7c-/-) mice and cell-based assays to reveal that MFSD7c is a choline transporter at the blood-brain barrier (BBB)."
      explanation: Establishes the model and what it is informative for.
- name: Endothelial-specific Flvcr2 conditional knockout mouse
  species: Mouse
  genotype: Endothelial cell-specific Flvcr2 conditional knockout
  publication: PMID:42429482
  description: >
    Conditional deletion restricted to endothelium, assayed during post-natal retinal
    vascularization. It is the cleanest available demonstration that the angiogenic
    defect is endothelium-autonomous, and it reproduces the glomeruloid lesion itself
    in a tissue that can be imaged whole-mount.
  genes:
  - preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  modeled_mechanisms:
  - target: CNS Endothelial Angiogenic Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >
      Endothelium-restricted loss of Flvcr2 produces reduced vascular expansion and, in
      a subset, abnormal vascular glomeruloids - the human lesion - establishing that
      the angiogenic defect does not require loss of the transporter in any other cell
      type.
    limitations: >
      The vascular bed is retina rather than brain, and the timing is post-natal rather
      than the mid-gestation window in which the human disease destroys the brain. The
      severe phenotype is partially penetrant.
    readouts:
    - name: Retinal vascular plexus expansion
      target: CNS Endothelial Angiogenic Dysfunction
      direction: DECREASED
      interpretation: Reduced angiogenic outgrowth in both superficial and deep plexuses.
      evidence:
      - reference: PMID:42429482
        reference_title: FLVCR2 Regulation of Intracellular Heme Modulates Vascular Tip/Stalk Specification During Retinal Angiogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "led to reduced vascular expansion in both primary (superficial) and secondary (deep) vascular plexuses"
        explanation: The quantified angiogenic deficit behind this readout.
    evidence:
    - reference: PMID:42429482
      reference_title: FLVCR2 Regulation of Intracellular Heme Modulates Vascular Tip/Stalk Specification During Retinal Angiogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we use conditional knockout of Flvcr2 in mice and knockdown in primary bovine retinal endothelial cell culture to explore retinal development and associated mechanisms of angiogenic regulation by FLVCR2."
      explanation: Establishes the model system and its purpose.
mechanistic_hypotheses:
- hypothesis_group_id: choline_transport_model
  hypothesis_label: FLVCR2 Choline/Ethanolamine Transport Model
  status: CANONICAL
  description: >-
    FLVCR2 is a choline and ethanolamine carrier at the blood-brain barrier, selecting
    its substrates through cation-pi interactions in a conserved aromatic pocket.
    Disease alleles disrupt that transport, constraining the brain's supply of a
    nutrient it cannot make for itself, and the developing CNS vasculature fails. This
    is the current physiological account, established in 2024 by independent structural
    and functional work, and it is the model against which a clinical allele has been
    assayed directly.
  evidence:
  - reference: PMID:38693257
    reference_title: Structural and molecular basis of choline uptake into the brain by FLVCR2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate both in vivo and in vitro that FLVCR2 is a BBB choline transporter and is responsible for the majority of choline uptake into the brain."
    explanation: The primary demonstration that FLVCR2 is the blood-brain-barrier choline transporter.
  - reference: PMID:38778100
    reference_title: Molecular mechanism of choline and ethanolamine transport in humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that FLVCR1 and FLVCR2 facilitate the transport of choline and ethanolamine across the plasma membrane, using a concentration-driven substrate translocation process."
    explanation: Independent structural and biochemical identification of the substrates.
  - reference: PMID:40133703
    reference_title: A hypomorphic FLVCR2 variant resulting in moderate transport deficiency causes hydranencephaly syndrome with brain calcifications.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings suggest that FLVCR2 deficiency may be sufficient to cause PVHH even in the absence of a complete loss of transport activity, possibly involving extragenetic factors in the pathophysiology of this complex condition."
    explanation: >-
      Applies the model to a patient allele and finds partial transport loss sufficient,
      while flagging that extragenetic factors are likely involved.
- hypothesis_group_id: heme_import_model
  hypothesis_label: FLVCR2 Heme-Import Model
  status: ALTERNATIVE
  description: >-
    The original account, in which FLVCR2 imports heme and disease alleles produce an
    endothelial heme deficit. It was the field's working model from 2010 and was
    supported by structural interpretation of the patient mutation set, but it was never
    demonstrated in patient tissue and the 2024 substrate work states that conclusive
    evidence for it never existed. It is retained as ALTERNATIVE rather than DEPRECATED
    because endothelial heme content remains a measured, manipulable variable with a
    mechanistic route to the angiogenic phenotype: reducing it de-represses NOTCH and
    perturbs tip/stalk specification, and heme precursor or hemin reverses that.
  evidence:
  - reference: PMID:20823265
    reference_title: The Fowler syndrome-associated protein FLVCR2 is an importer of heme.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report the cellular function of FLVCR2 as an importer of heme, based on the following observations."
    explanation: The study that established the heme-import model.
  - reference: PMID:42429482
    reference_title: FLVCR2 Regulation of Intracellular Heme Modulates Vascular Tip/Stalk Specification During Retinal Angiogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Collectively, these data indicate a newly identified role for FLVCR2 and heme in the regulation of tip/stalk specification in angiogenesis."
    explanation: Recent in vivo work sustaining a heme-dependent route to the angiogenic phenotype.
  - reference: PMID:38778100
    reference_title: Molecular mechanism of choline and ethanolamine transport in humans.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Earlier studies concluded that FLVCR1 may function as a haem exporter8-12, whereas FLVCR2 was suggested to act as a haem importer13, yet conclusive biochemical and detailed molecular evidence remained elusive for the function of both transporters14-16."
    explanation: States that the biochemical basis for the heme-import assignment was never conclusive.
treatments:
- name: Genetic counseling and recurrence-risk assessment
  description: >
    There is no disease-modifying therapy. Management is prenatal diagnosis, counselling
    about the autosomal recessive recurrence risk, and discussion of options; several
    reported pregnancies ended in termination. Distinguishing Fowler syndrome at autopsy
    from other causes of hydrocephaly and hydranencephaly matters precisely because it
    carries a one-in-four recurrence risk where those other causes may not.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:12493052
    reference_title: First-trimester features of Fowler syndrome (hydrocephaly-hydranencephaly proliferative vasculopathy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of proliferative vasculopathy and hydrocephaly-hydranencephaly (Fowler syndrome) should be considered whenever hydrocephaly-hydranencephaly associated with a fetal akinetic sequence are encountered at the end of the first trimester. Genetic counseling is recommended."
    explanation: >-
      States the diagnostic trigger and the recommended management, which is
      counselling rather than any disease-modifying intervention.
  - reference: PMID:20014121
    reference_title: Fowler syndrome-a clinical, radiological, and pathological study of 14 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autopsy and study of the brain are essential to differentiate autosomal recessive Fowler syndrome from other causes of hydrocephaly and hydranencephaly, which may have a lower recurrence risk."
    explanation: Gives the recurrence-risk rationale for establishing the diagnosis.
inheritance:
- name: Autosomal recessive
  description: >
    Biallelic FLVCR2 variants. Affected sibships and consanguinity are both common: in
    one series of fourteen fetuses from ten families, sibs were affected in four
    families and the parents were consanguineous in six.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20206334
    reference_title: Mutations in FLVCR2 are associated with proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome (Fowler syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is an autosomal-recessively inherited prenatal lethal disorder"
    explanation: States the mode of inheritance.
  - reference: PMID:20014121
    reference_title: Fowler syndrome-a clinical, radiological, and pathological study of 14 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In four families sibs were affected and in six the parents were consanguineous."
    explanation: Documents the sibship recurrence and consanguinity consistent with recessive inheritance.
genetic:
- name: FLVCR2 variants
  gene_term:
    preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:25677735
      reference_title: Mutations in FLVCR2 associated with Fowler syndrome and survival beyond infancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "is a rare autosomal recessive disorder, caused by mutations in FLVCR2"
      explanation: Establishes biallelic FLVCR2 causation.
  variants:
  - name: Homozygous FLVCR2 c.1289C>T
    description: >
      The allele in the first reported patients to survive beyond infancy, a brother and
      sister homozygous for it, identified by whole-exome sequencing.
    evidence:
    - reference: PMID:25677735
      reference_title: Mutations in FLVCR2 associated with Fowler syndrome and survival beyond infancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Investigation with whole-exome sequencing (WES) revealed, in both patients, a homozygous pathogenic mutation in FLVCR2, c.1289C>T, compatible with a diagnosis of Fowler syndrome."
      explanation: Names the allele and the method by which it was found.
  - name: Compound heterozygous c.327T>A (p.Asn109Lys) and c.887C>T (p.Ser296Leu)
    description: >
      Shared by three siblings who survived into adulthood, two with the cerebral
      features seen in affected fetuses and one considerably milder - the clearest
      published demonstration that genotype does not fix phenotype in this disease.
    evidence:
    - reference: PMID:32333401
      reference_title: "Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival into adulthood and systematic review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although our three patients carry the same mutations (c.327T>A-p.Asn109Lys and c.887C>T-p.Ser296Leu) in FLVCR2, only two of them presented with the same cerebral features, ventriculomegaly and cerebral calcifications, as affected fetuses."
      explanation: Names the alleles and documents the intrafamilial discordance.
  - name: Compound heterozygous c.1124+3_1124+6del and p.(Arg492Trp)
    description: >
      A fetal case in which both alleles were functionally characterised: the splice
      variant impairs exon 5 splicing on minigene assay, and p.(Arg492Trp) was modelled
      as highly destabilising and shown to cut transport activity by half, leaving net
      activity of a quarter to a third.
    evidence:
    - reference: PMID:40133703
      reference_title: A hypomorphic FLVCR2 variant resulting in moderate transport deficiency causes hydranencephaly syndrome with brain calcifications.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Through exome sequencing, we identified two compound heterozygous FLVCR2 variants: the maternal c.1124+3_1124+6del and the paternal p.(Arg492Trp)."
      explanation: Names the two alleles in the functionally characterised fetal case.
  features: >
    Genetic homogeneity is the rule: no second locus has been reported since the gene
    was identified in 2010. No clear genotype-phenotype correlation exists, though some
    variants do appear to be associated with a phenotype mild enough to be compatible
    with life.
  evidence:
  - reference: PMID:29500860
    reference_title: "Proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome or Fowler syndrome: Report of a family and insight into the disease's mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present report confirms the genetic homogeneity of Fowler syndrome and describes a new FLVCR2 mutation affecting the protein function."
    explanation: States the genetic homogeneity of the disorder.
  - reference: PMID:32333401
    reference_title: "Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival into adulthood and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although no clear phenotype-genotype correlation exists, some variants appear to be associated with a less severe phenotype compatible with life."
    explanation: States the absence of a clear genotype-phenotype correlation.
discussions:
- discussion_id: flvcr2_transport_direction_and_substrate
  prompt: >-
    Does FLVCR2 import choline into the brain across the blood-brain barrier, export
    lysophosphatidylcholine-derived choline out of it, or act principally as a heme
    importer - and which of these, if any, is the step whose failure causes the
    vasculopathy?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
  - mechanistic_hypotheses#choline_transport_model
  - mechanistic_hypotheses#heme_import_model
  rationale: >-
    Three readings of the same protein are live in the literature at once, and they are
    not simply a chronological succession. The 2010 heme-import assignment rested on
    binding, uptake, knockdown and toxicity experiments in cells, and structural
    analysis of patient alleles was later read as supporting it; the 2024 structural
    work states that conclusive evidence for it never existed and identifies choline and
    ethanolamine as the physiological substrates. But the two 2024 choline papers
    disagree with each other on direction: one demonstrates FLVCR2 as the blood-brain
    barrier choline importer responsible for most brain choline uptake, while the other,
    from endothelial-specific knockouts, finds brain choline paradoxically increased and
    concludes the carrier exports lysophosphatidylcholine-derived choline instead. And a
    2026 retinal study revives heme as the operative variable, with a rescue arm. This
    entry therefore does not pick a winner: both substrate arms are curated as
    hypothesis groups converging on one endothelial node, and the causal edges from
    either substrate to the angiogenic defect are marked with unknown or named
    intermediates rather than asserted as mechanism.
  proposed_experiments:
  - experiment_id: exp_flvcr2_directional_flux_in_patient_derived_bbb
    name: Directional choline flux across patient-genotype brain endothelium
    description: >-
      Build a blood-brain-barrier model from iPSC-derived brain microvascular
      endothelial cells carrying defined patient FLVCR2 genotypes, including the
      hypomorphic p.(Arg492Trp), and measure luminal-to-abluminal and
      abluminal-to-luminal choline flux separately with stable-isotope tracing. The
      published import and export claims were made in different systems, so measuring
      both directions in one human system with matched genotypes is the discriminating
      experiment.
    perturbations:
    - name: Introduce patient FLVCR2 genotypes into iPSC-derived brain endothelium
      target: pathophysiology#Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
    readouts:
    - name: Direction-resolved choline flux
      target: pathophysiology#Failure of Brain Choline Supply
    would_support:
    - pathophysiology#Failure of Brain Choline Supply
  - experiment_id: exp_flvcr2_heme_vs_choline_rescue
    name: Substrate rescue arms in an angiogenic assay of FLVCR2-deficient endothelium
    description: >-
      In the same FLVCR2-deficient endothelial angiogenesis assay, compare rescue by
      heme precursor or cell-permeable hemin against rescue by choline or
      phosphatidylcholine supplementation. The heme rescue has been shown; the choline
      rescue has not been tested head to head against it, and whichever restores sprout
      organisation identifies the limiting substrate for the phenotype rather than for
      the transporter.
    perturbations:
    - name: Heme precursor versus choline supplementation of FLVCR2-deficient endothelium
      target: pathophysiology#Reduced Endothelial Heme Availability
    readouts:
    - name: Restoration of organised sprouting and loss of glomeruloid formation
      target: pathophysiology#CNS Endothelial Angiogenic Dysfunction
    would_support:
    - pathophysiology#Reduced Endothelial Heme Availability
  evidence:
  - reference: PMID:38302740
    reference_title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Collectively, our work identifies MFSD7c as a choline exporter at the BBB and provides a foundation for future work to reveal the disease mechanisms of Fowler syndrome."
    explanation: The export conclusion that sits against the import conclusion of the companion 2024 work.
  - reference: PMID:38693257
    reference_title: Structural and molecular basis of choline uptake into the brain by FLVCR2.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate both in vivo and in vitro that FLVCR2 is a BBB choline transporter and is responsible for the majority of choline uptake into the brain."
    explanation: >-
      Graded REFUTE against the export reading: the same year, in the same protein, this
      study concludes FLVCR2 is the importer responsible for most brain choline uptake.
- discussion_id: fowler_syndrome_survival_determinants
  prompt: >-
    Why do a small minority of patients with biallelic FLVCR2 variants survive beyond
    birth, and what determines phenotype when genotype does not?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Survival beyond infancy with profound disability
  - genetic#FLVCR2 variants
  rationale: >-
    Six of seventy-two published patients survived beyond birth, and no clear
    genotype-phenotype correlation explains which. The decisive observation is
    intrafamilial: three siblings carrying identical compound heterozygous alleles
    diverged, two showing the fetal cerebral phenotype and one markedly milder. Since
    the alleles are the same, whatever separates them is not the FLVCR2 genotype. The
    functional work points the same way - a patient allele retaining a quarter to a
    third of transport activity still produced the disease, and the authors explicitly
    raise extragenetic factors. Candidates include modifier loci acting on choline or
    heme handling, stochastic variation in the timing of the angiogenic insult relative
    to the vulnerable window of brain development, and maternal nutritional choline
    supply - none tested.
  proposed_experiments:
  - experiment_id: exp_fowler_survivor_modifier_search
    name: Genome-wide modifier search across the surviving cohort
    description: >-
      Sequence and compare survivors against lethal cases matched on FLVCR2 genotype
      where possible, beginning with the discordant sibships that already exist in the
      literature, and test candidate modifiers in the choline and heme handling pathways.
      The discordant-sibling families are the highest-information available material
      because they hold the primary genotype constant.
    readouts:
    - name: Modifier variants segregating with survival
      target: genetic#FLVCR2 variants
  evidence:
  - reference: PMID:32333401
    reference_title: "Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival into adulthood and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The third sibling has a surprisingly milder clinical and radiological phenotype, suggesting intrafamilial variability."
    explanation: The intrafamilial discordance at constant genotype that this gap records.
  - reference: PMID:40133703
    reference_title: A hypomorphic FLVCR2 variant resulting in moderate transport deficiency causes hydranencephaly syndrome with brain calcifications.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "possibly involving extragenetic factors in the pathophysiology of this complex condition"
    explanation: The authors' own statement that extragenetic factors are likely at work.
notes: >-
  Curated for IEMbase metabolic work-package WP-006 row 2.3.06.01 (issue #5561).
  NEC preflight on MONDO:0009168 "Fowler syndrome": xref OMIM:225790 matches the seed
  row, and Orphanet:221126 is the corresponding Orphanet concept. The disease-causing
  gene is FLVCR2 (hgnc:20105, gene OMIM 610865), read from the HGNC REST API in the same
  step the binding was written; note FLVCR1 (hgnc:24682) is a different gene causing
  different diseases and is already curated separately here as FLVCR1-Related
  Retinopathy, so the FLVCR1/FLVCR2 pair is a named-entity-confusion hazard for anything
  resolving "FLVCR" by prefix.

  Two audit notes for the next curator of this package. First, the WP-006 row list is
  stale on the polyamine arm: rows 2.4.11.01 (SMS) and 2.4.13.01 (ODC1) are already
  curated as Snyder-Robinson_Syndrome and Bachmann-Bupp_Syndrome, and SLC44A1 (2.3.04.01)
  and FLVCR1 (2.3.05.01) are likewise covered. Second, no conforms_to is declared. The
  KB has no CNS-angiogenesis or blood-brain-barrier-development module, and the nearest
  candidate, norrin_fzd4_retinal_vascular_development, scopes itself to
  Norrin-FZD4-beta-catenin signalling in retinal endothelium - a different pathway in a
  different bed. A CNS angiogenesis module would be the right home for the
  tip/stalk-specification and glomeruloid nodes if a second conformer appears.

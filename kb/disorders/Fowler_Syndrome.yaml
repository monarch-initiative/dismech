    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology of the brain showed the characteristic glomeruloid vascular proliferation of Fowler syndrome in all cases, but with variable extent of involvement of the central nervous system."
    explanation: Establishes the lesion as universal in the reported series with variable extent.
  - reference: PMID:20014121
    reference_title: Fowler syndrome-a clinical, radiological, and pathological study of 14 cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical proliferative vasculopathy was never observed outside the central nervous system and karyotypes were normal in the 10 fetuses studied."
    explanation: Establishes the CNS confinement of the vasculopathy asserted by this node.
  - reference: PMID:20206334
    reference_title: Mutations in FLVCR2 are associated with proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome (Fowler syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "glomeruloid vasculopathy of the central nervous system and retinal vessels"

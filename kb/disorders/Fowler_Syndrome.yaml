prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    Ultra-rare. A 2020 systematic review of thirty articles counted sixty-nine
    published patients and, including its own three, seventy-two in total. No
    population-based estimate exists, so the published case count is the
    meaningful figure and no numeric rate is asserted.
  evidence:
  - reference: PMID:32333401
    reference_title: "Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival into adulthood and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty articles were included, describing 69 individual patients. To date, including our clinical reports, 72 patients have been described with Fowler syndrome."
    explanation: Gives the worldwide published case count behind the ultra-rare class asserted here.
progression:
- phase: Prenatal detection
  notes: >
    Detection is usually by second-trimester ultrasound, between 13 and 27 weeks of
    gestation. First-trimester recognition is documented: in one pregnancy referred
    for a cystic hygroma at 12 weeks, ultrasound at 13 weeks already showed
    hydrocephaly-hydranencephaly with fetal akinesia and arthrogryposis.
  evidence:
  - reference: PMID:29500860
    reference_title: "Proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome or Fowler syndrome: Report of a family and insight into the disease's mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is almost invariably prenatally lethal, usually detected by ultrasound between the 13 and 27 weeks of gestation"
    explanation: States the usual gestational window of prenatal detection.
  - reference: PMID:12493052
    reference_title: First-trimester features of Fowler syndrome (hydrocephaly-hydranencephaly proliferative vasculopathy).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 13 weeks, ultrasound examination revealed hydrocephaly-hydranencephaly, fetal akinesia, and arthrogryposis associated with increased nuchal translucency."
    explanation: Documents first-trimester recognition of the full phenotype.
- phase: Prenatal or perinatal lethality
  notes: >
    The syndrome has long been regarded as prenatally lethal, and the great majority
    of reported patients die before or around birth.
  evidence:
  - reference: PMID:32333401
    reference_title: "Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival into adulthood and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 6/72 (8%) survived beyond birth."
    explanation: Quantifies the fraction of reported patients surviving past birth.
- phase: Survival beyond infancy with profound disability
  notes: >
    A minority survive. The first reported survivors, a brother and sister homozygous
    for FLVCR2 c.1289C>T, had severe intellectual and neurological disability with
    seizures, no functional movement and no means of communication, on a background of
    profound ventriculomegaly, calcifications and cerebellar hypoplasia. Intrafamilial
    variability is documented: of three siblings carrying identical alleles, only two
    showed the cerebral features seen in affected fetuses.
  evidence:
  - reference: PMID:25677735
    reference_title: Mutations in FLVCR2 associated with Fowler syndrome and survival beyond infancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients present a phenotype of severe intellectual and neurologic disability with seizures, absence of functional movements, and no means of communication."
    explanation: Describes the clinical course in the first documented survivors beyond infancy.
  - reference: PMID:32333401
    reference_title: "Expanding the clinical spectrum of Fowler syndrome: Three siblings with survival into adulthood and systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The third sibling has a surprisingly milder clinical and radiological phenotype, suggesting intrafamilial variability."
    explanation: Documents intrafamilial variability among siblings sharing the same genotype.
pathophysiology:
- name: Biallelic FLVCR2 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Autozygosity mapping in three consanguineous families localised the disorder to
    chromosome 14q24.3, and direct sequencing of candidate genes in the interval found
    five different germline FLVCR2 mutations across five families. FLVCR2 is a
    transmembrane carrier of the major facilitator superfamily. Reported alleles are
    predominantly missense; structural analysis of the published set has been
    interpreted as stabilising an occluded conformation or causing misfolding, and one
    splice-region deletion has been shown by minigene assay to impair splicing of
    exon 5.
  genes:
  - preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  genetic_context:
    description: >
      Biallelic germline FLVCR2 variants, homozygous in consanguineous kindreds and
      compound heterozygous in others. Complete transport-null alleles are not
      required: a compound heterozygote carrying p.(Arg492Trp) retained roughly a
      quarter to a third of wild-type transport activity.
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:20206334
    reference_title: Mutations in FLVCR2 are associated with proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome (Fowler syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of candidate genes within the target interval revealed five different germline mutations in FLVCR2 in five families with Fowler syndrome."
    explanation: The gene-discovery study establishing biallelic FLVCR2 variants as the cause.
  - reference: PMID:40133703
    reference_title: A hypomorphic FLVCR2 variant resulting in moderate transport deficiency causes hydranencephaly syndrome with brain calcifications.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The effects of the c.1124+3_1124+6del variant were investigated through a minigene assay, which showed impaired splicing of the exon 5 of FLVCR2."
    explanation: Functional demonstration that a clinical splice-region allele disrupts FLVCR2 splicing.
  downstream:
  - target: Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
    causal_link_type: DIRECT
    description: >
      Missense and splice-region alleles reduce the amount or the transport competence
      of FLVCR2 at the endothelial plasma membrane.
    evidence:
    - reference: PMID:40133703
      reference_title: A hypomorphic FLVCR2 variant resulting in moderate transport deficiency causes hydranencephaly syndrome with brain calcifications.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we performed a radiolabeled-choline or ethanolamine transport assays in HEK 293 cells and found that the p.(Arg492Trp) variant causes a 50-60% reduction of FLVCR2 transport activity, resulting in a net activity of 25-30%."
      explanation: Quantifies the transport deficit a clinical FLVCR2 allele produces.
- name: Impaired FLVCR2 Solute Transport at the CNS Endothelial Membrane
  biological_scale: MOLECULAR
  description: >
    FLVCR2 is expressed in the endothelial cells of brain blood vessels, and the
    murine ortholog Mfsd7c is an endothelial transporter whose loss causes brain
    angiogenic growth deficiency and lethality. This node is the convergence point of
    the disease and is deliberately stated in substrate-neutral terms: what the
    carrier moves is contested, and the two candidate substrates are modelled as
    separate downstream arms opting into distinct hypothesis groups. Patient missense
    alleles have been shown directly to abolish or reduce transport activity, and a
    hypomorphic allele retaining a quarter to a third of activity was still sufficient
    for disease, so the lesion is graded rather than all-or-none.
  genes:
  - preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  evidence:
  - reference: PMID:40133703
    reference_title: A hypomorphic FLVCR2 variant resulting in moderate transport deficiency causes hydranencephaly syndrome with brain calcifications.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The loss of the murine ortholog Mfsd7c, an endothelial transporter in brain blood vessels, causes brain angiogenic growth deficiency and lethality."
    explanation: Establishes FLVCR2 as an endothelial transporter of brain vessels whose loss impairs brain angiogenesis.
  - reference: PMID:38302740
    reference_title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also showed that several missense mutations identified in patients exhibiting Fowler syndrome had abolished or reduced choline transport activity."
    explanation: Patient alleles are directly shown to impair FLVCR2 transport function.
  downstream:
  - target: Failure of Brain Choline Supply
    causal_link_type: DIRECT
    hypothesis_groups:
    - choline_transport_model
    description: >
      Under the choline model, loss of FLVCR2 transport competence deprives the
      developing brain of the choline it cannot synthesise de novo and must import
      across the blood-brain barrier.
    evidence:
    - reference: PMID:38693257
      reference_title: Structural and molecular basis of choline uptake into the brain by FLVCR2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we demonstrate both in vivo and in vitro that FLVCR2 is a BBB choline transporter and is responsible for the majority of choline uptake into the brain."
      explanation: Establishes the substrate and the transport step this edge asserts.
  - target: Reduced Endothelial Heme Availability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - heme_import_model
    description: >
      Under the older heme model, the same alleles reduce heme import into endothelium.
      The edge is curated with unknown intermediates because the human evidence is
      structural inference over patient mutations rather than a measured heme deficit
      in patient tissue.
    evidence:
    - reference: PMID:29500860
      reference_title: "Proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome or Fowler syndrome: Report of a family and insight into the disease's mechanism."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The structural analysis of the present and previously published FLVCR2 mutations supports the hypothesis of a reduced heme import as the underlying disease's mechanism due to the stabilization of the occluded conformation or a protein misfolding."
      explanation: States the heme-import model and the structural reasoning it rests on.
- name: Failure of Brain Choline Supply
  biological_scale: MOLECULAR
  description: >
    Choline is required in large quantities for phosphatidylcholine synthesis, for
    betaine-dependent methylation and, in cholinergic neurons, for acetylcholine. The
    brain cannot synthesise it efficiently de novo and derives most of it from the
    circulation, so a blood-brain-barrier carrier defect constrains supply at its entry
    step. FLVCR1 and FLVCR2 select choline and ethanolamine through cation-pi
    interactions with conserved tryptophan and tyrosine residues, which is why the
    clinical missense alleles that line that pocket are transport-incompetent.
  genes:
  - preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  molecular_functions:
  - preferred_term: choline transmembrane transporter activity
    term:
      id: GO:0015220
      label: choline transmembrane transporter activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: choline transport
    term:
      id: GO:0015871
      label: choline transport
    modifier: DECREASED
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  evidence:
  - reference: PMID:38693257
    reference_title: Structural and molecular basis of choline uptake into the brain by FLVCR2.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Despite the brain’s high demand for choline, it cannot be efficiently synthesised de novo3. Instead, the brain derives the majority of its choline from systemic circulation, most of which originates from dietary sources1,3."
    explanation: >-
      States the dependence of the brain on imported choline that makes a carrier
      defect rate-limiting. The sentence is the paper's framing of established
      physiology rather than its own measurement, so it is graded OTHER and marked
      BACKGROUND.
  - reference: PMID:38778100
    reference_title: Molecular mechanism of choline and ethanolamine transport in humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fully conserved tryptophan and tyrosine residues form the binding pocket of both transporters and confer selectivity for choline and ethanolamine through cation-π interactions."
    explanation: Defines the substrate-selectivity mechanism whose disruption by patient alleles this node depends on.
  downstream:
  - target: CNS Endothelial Angiogenic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - choline_transport_model
    description: >
      How a constrained choline supply translates into defective CNS angiogenesis is
      not established. The transport defect and the angiogenic failure are each
      demonstrated, but no intermediate has been shown to connect them in patient or
      model tissue, so the edge is curated with unknown intermediates rather than as a
      mechanism.
    evidence:
    - reference: PMID:38302740
      reference_title: MFSD7c functions as a transporter of choline at the blood-brain barrier.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, our work identifies MFSD7c as a choline exporter at the BBB and provides a foundation for future work to reveal the disease mechanisms of Fowler syndrome."
      explanation: >-
        The authors present the choline-handling defect as a foundation for future work
        on disease mechanism, which is exactly the unresolved link this edge records.
- name: Reduced Endothelial Heme Availability
  biological_scale: MOLECULAR
  description: >
    The original cellular function assigned to FLVCR2 was heme import: the protein
    binds hemin-conjugated agarose competitively, cells and oocytes expressing it take
    up more heme, siRNA knockdown reduces heme import, and overexpressing cells are
    more heme-toxicity-sensitive. That account was never shown in patient tissue and
    has been displaced as the physiological function by the 2024 choline work, but it
    has not been abandoned: endothelial heme content remains the measured variable in
    the retinal angiogenesis arm below.
  genes:
  - preferred_term: FLVCR2
    term:
      id: hgnc:20105
      label: FLVCR2
  molecular_functions:
  - preferred_term: heme transmembrane transporter activity
    term:
      id: GO:0015232
      label: heme transmembrane transporter activity
    modifier: DECREASED
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:20823265
    reference_title: The Fowler syndrome-associated protein FLVCR2 is an importer of heme.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Second, mammalian cells and Xenopus laevis oocytes expressing FLVCR2 display enhanced heme uptake."
    explanation: The cell-based result behind the heme-import assignment this node represents.
  - reference: PMID:38778100
    reference_title: Molecular mechanism of choline and ethanolamine transport in humans.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Earlier studies concluded that FLVCR1 may function as a haem exporter8-12, whereas FLVCR2 was suggested to act as a haem importer13, yet conclusive biochemical and detailed molecular evidence remained elusive for the function of both transporters14-16."
    explanation: >-
      The structural and biochemical study that displaced heme import as FLVCR2's
      physiological function, stating that the evidence for it was never conclusive.
  downstream:
  - target: CNS Endothelial Angiogenic Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - heme_import_model
    description: >
      In retinal endothelium, reduced heme content de-represses NOTCH signalling and
      drives hyperproliferation, and adding a heme precursor or cell-permeable hemin
      reverses it. The named intermediate is NOTCH1 activation acting on tip/stalk
      specification.
    evidence:
    - reference: PMID:42429482
      reference_title: FLVCR2 Regulation of Intracellular Heme Modulates Vascular Tip/Stalk Specification During Retinal Angiogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, Flvcr2 knockdown in retinal endothelial cells led to reduced heme content and promoted NOTCH signaling and hyperproliferation that could be reversed with addition of a heme precursor."
      explanation: Supplies the heme-to-angiogenesis route, with NOTCH as the named intermediate and a rescue arm.
- name: CNS Endothelial Angiogenic Dysfunction
  biological_scale: CELLULAR
  description: >
    The primary cellular lesion is in the endothelium of the developing CNS
    vasculature, which fails to build an orderly vascular bed. Endothelial-specific
    deletion of Flvcr2 in mouse, or chemical inhibition of heme synthesis, reduces
    vascular expansion of both retinal plexuses and in a subset produces frankly
    abnormal vascular glomeruloids - the same lesion seen in human CNS. Mechanistically
    the defect sits at tip/stalk specification, with loss of FLVCR2 attenuating the
    normal restraint on NOTCH1 and on VEGF-induced proliferation.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  - preferred_term: retinal blood vessel endothelial cell
    term:
      id: CL:0002585
      label: retinal blood vessel endothelial cell
  biological_processes:
  - preferred_term: sprouting angiogenesis
    term:
      id: GO:0002040
      label: sprouting angiogenesis
    modifier: ABNORMAL
  - preferred_term: endothelial tip cell fate specification
    term:
      id: GO:0097102
      label: endothelial tip cell fate specification
    modifier: ABNORMAL
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:42429482
    reference_title: FLVCR2 Regulation of Intracellular Heme Modulates Vascular Tip/Stalk Specification During Retinal Angiogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Endothelial cell-specific deletion of Flvcr2 or chemical inhibition of heme synthesis during post-natal retinal vascularization led to reduced vascular expansion in both primary (superficial) and secondary (deep) vascular plexuses, and a more severe but partially penetrant phenotype with attenuation of retinal vascular development and formation of abnormal vascular glomeruloids."
    explanation: Shows endothelial-autonomous FLVCR2 loss produces impaired vascular expansion and glomeruloid formation.
  - reference: PMID:42429482
    reference_title: FLVCR2 Regulation of Intracellular Heme Modulates Vascular Tip/Stalk Specification During Retinal Angiogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we found that FLVCR2/heme signaling attenuates NOTCH1 activation and affects downstream tip/stalk cell specification, while also preventing VEGF-induced proliferation."
    explanation: Identifies the tip/stalk specification step as the cellular process FLVCR2 acts on.
  downstream:
  - target: Deficient Pericyte Coverage of CNS Vessels
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Immunohistology of affected fetal CNS shows a drastic reduction in the pericyte
      marker smooth muscle actin against matched control, from which the authors infer
      a pericyte-dependent remodelling defect. Whether the pericyte deficit is caused
      by the endothelial lesion or is a parallel consequence is not established.
    evidence:
    - reference: PMID:19635601
      reference_title: "Refining the clinicopathological pattern of cerebral proliferative glomeruloid vasculopathy (Fowler syndrome): report of 16 fetal cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interestingly in PGV, immunohistological response to a marker of pericytes (SMA, Smooth in PGV Muscle Actin), was drastically reduced as compared to a match control."
      explanation: The human histological observation of reduced pericyte marker this node records.
  - target: Glomeruloid Vascular Proliferation of CNS and Retinal Vessels
    causal_link_type: DIRECT
    description: >
      Disordered endothelial proliferation and failed sprout organisation produce the
      glomeruloid lesion itself.
    evidence:
    - reference: PMID:19635601
      reference_title: "Refining the clinicopathological pattern of cerebral proliferative glomeruloid vasculopathy (Fowler syndrome): report of 16 fetal cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cerebral proliferative glomeruloid vasculopathy (PGV) is a severe disorder of brain angiogenesis, resulting in abnormally thickened and aberrant perforating vessels, forming glomeruloids with inclusion-bearing endothelial cells."
      explanation: Defines the lesion as the product of a disorder of brain angiogenesis.

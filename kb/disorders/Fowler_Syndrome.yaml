name: Fowler Syndrome
category: Mendelian
creation_date: '2026-09-15T00:00:00Z'
synonyms:
- Proliferative vasculopathy and hydranencephaly-hydrocephaly syndrome
- PVHH
- Cerebral proliferative glomeruloid vasculopathy
- Encephaloclastic proliferative vasculopathy
- Hydrocephaly-hydranencephaly proliferative vasculopathy
description: >
  An autosomal recessive disorder of central nervous system angiogenesis caused by
  biallelic variants in FLVCR2, delineated by Fowler in 1972 as a stereotyped lethal
  fetal phenotype and molecularly solved in 2010. The defining lesion is not a
  malformation of brain tissue but of the vessels that supply it: abnormally
  thickened, aberrant perforating vessels form glomeruloids of poorly organised
  endothelium throughout the CNS and retina. Everything else follows from that
  vasculopathy. The brain is destroyed rather than mis-built - hydranencephaly and
  hydrocephaly arise from clastic ischaemic injury with dystrophic calcification and
  necrosis - and the spinal cord and brainstem lesions produce a fetal akinesia
  deformation sequence with neurogenic muscular atrophy, joint contractures and
  pterygia. The proliferative vasculopathy is confined to the CNS; it has never been
  observed outside it.

  What FLVCR2 actually transports is the live mechanistic question in this disease,
  and this entry curates it as one rather than resolving it. FLVCR2 is a major
  facilitator superfamily carrier expressed in brain endothelium. For over a decade
  the working model was heme import, from a 2010 demonstration that FLVCR2 mediates
  heme uptake and from structural modelling of patient alleles interpreted as
  stabilising an occluded conformation. In 2024 two independent structural and
  functional studies instead identified choline - and ethanolamine - as the
  physiological substrates, with FLVCR2 responsible for the majority of choline
  uptake into the brain across the blood-brain barrier. A patient allele has since
  been assayed directly against radiolabelled choline, and partial rather than
  complete transport loss was sufficient for disease. The two models are not simply
  successive: a 2026 retinal study revives a heme-dependent route through NOTCH
  tip/stalk specification, and the choline work itself splits on direction, with one
  group reading FLVCR2 as a luminal importer and another, from endothelial-specific
  knockouts with paradoxically raised brain choline, as an exporter of
  lysophosphatidylcholine-derived choline. The pathograph therefore carries both
  substrate arms as hypothesis groups converging on the same endothelial node.

  The disorder is almost invariably prenatally lethal and is usually detected on
  ultrasound between 13 and 27 weeks, though first-trimester recognition is
  documented. Survival is rare: across the systematic literature review, six of
  seventy-two reported patients lived beyond birth, with profound neurological
  disability and gross ventriculomegaly. There is no disease-modifying therapy.

  target_mechanisms:
  - target: Vmp-Switched Relapsing Bacteremia
    treatment_effect: INHIBITS
    description: Antibiotic clearance of bloodstream Borrelia stops recurrent bacteremic waves.
  - target: Antibiotic-Triggered Jarisch-Herxheimer Reaction
    treatment_effect: ACTIVATES
    description: >-
      The first antibiotic dose lyses the spirochetemia and can precipitate the
      Jarisch-Herxheimer reaction as an adverse effect of treatment.
  evidence:
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT

    snippet: "All patients recovered after antibiotic treatment with ceftriaxone and/or doxycycline."
    explanation: Reports recovery after ceftriaxone and/or doxycycline in a Swiss louse-borne relapsing-fever case series.
diagnosis:
- name: Blood-film microscopy with molecular and serologic confirmation
  description: >-
    Relapsing fever is diagnosed by visualizing spirochetes on Giemsa- or
    Wright-stained blood films drawn at the febrile peak, confirmed by 16S rRNA
    gene sequencing; GlpQ serology can discriminate relapsing-fever from Lyme
    Borrelia.
  diagnosis_term:
    preferred_term: blood-film microscopy
    term:
      id: NCIT:C16853
      label: Microscopy
  results: >-
    Spirochetes on stained blood films, with 16S rRNA sequencing or GlpQ
    serology confirmation, support the diagnosis.
  evidence:
  - reference: PMID:27188655
    reference_title: "Louse-borne relapsing fever - report of four cases in Switzerland, June-December 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple spirochetes were visualized on stained blood films which were identified as Borrelia recurrentis by 16S rRNA gene sequencing."
    explanation: The Swiss case series diagnoses LBRF by blood-film microscopy confirmed with 16S rRNA sequencing.
  - reference: PMID:32303256
    reference_title: "Assessment of Borrelia miyamotoi in febrile patients and ticks in Alsace, an endemic area for Lyme borreliosis in France."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "using direct (PCR) and indirect diagnosis (glycerophosphoryldiester-phosphodiesterase (GlpQ) serology)"
    explanation: The Alsace study applies PCR and GlpQ serology to detect relapsing-fever Borrelia in patients.
prevalence:
- population: Senegal (non-malarial febrile illness, metagenomic sequencing study)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 15500.0
  notes: >-
    In a cross-sectional metagenomic study of non-malarial febrile illness in
    Senegal, relapsing-fever Borrelia was the most common pathogen, found in
    15.5% of cases. This is the fraction within a febrile-patient cohort, not a
    general-population rate.
  evidence:
  - reference: PMID:38272885
    reference_title: Investigating the etiologies of non-malarial febrile illness in Senegal using metagenomic sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "relapsing fever Borrelia and spotted fever Rickettsia found in 15.5% and 3.8% of cases, respectively"
    explanation: Relapsing-fever Borrelia was the most common pathogen in the Senegalese non-malarial febrile-illness cohort.
- population: Europe (imported louse-borne relapsing fever, 2015)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A 2015 mini-review identified 26 imported louse-borne relapsing-fever cases
    among migrants reaching Europe, after nine years with no reported imported
    cases. A literature case count, not a population rate.
  evidence:
  - reference: PMID:27340042
    reference_title: "Fourth case of louse-borne relapsing fever in Young Migrant, Sicily, Italy, December 2015. Mini Review Article."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified 26 cases of LBRF between July and October 2015 in migrants recently arrived"
    explanation: The mini-review counts imported LBRF cases in European migrants in 2015.
animal_models:
- name: Inbred laboratory mouse Borrelia hermsii infection
  species: Mouse
  publication: PMID:19995898
  description: >-
    Inbred laboratory mice infected with B. hermsii recapitulate the cytopenias
    and the IgM/B1b-dependent serotype clearance of human relapsing fever.
  modeled_mechanisms:
  - target: Macrophage-Mediated Cytopenias
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The mouse model reproduces the thrombocytopenia and anemia of relapsing fever.
    limitations: Inbred strains differ in innate susceptibility, and mice are not the natural human host.
    evidence:
    - reference: PMID:19995898
      reference_title: Genetic control of the innate immune response to Borrelia hermsii influences the course of relapsing fever in inbred strains of mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the progression of the disease in mice was associated with thrombocytopenia and anemia."
      explanation: The B. hermsii mouse model reproduces the cytopenias seen in human relapsing fever.
  - target: B1b IgM Serotype Clearance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The mouse model establishes that secreted IgM is required to clear each bacteremic serotype.
    limitations: The clearance requirement is demonstrated in mice, not directly in humans.
    evidence:
    - reference: PMID:12646649
      reference_title: The resolution of relapsing fever borreliosis requires IgM and is concurrent with expansion of B1b lymphocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mice selectively incapable of secreting IgM, the dominant isotype produced by B1 cells, were completely unable to clear B. hermsii."
      explanation: IgM-deficient mice cannot clear B. hermsii, establishing the IgM/B1b clearance requirement.
- name: Peromyscus natural reservoir
  species: Peromyscus (deer mouse)
  publication: PMID:27381345
  description: >-
    Peromyscus reservoir rodents carry relapsing-fever Borrelia with partial
    resistance and infection tolerance, so they do not reproduce the severe
    human disease.
  modeled_mechanisms:
  - target: Severe Systemic Relapsing Fever
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The natural reservoir tolerates infection with little pathology, so it does
      not model the severe systemic disease seen in humans.
    limitations: >-
      Reservoir tolerance means the model shows little of the pathology it would
      need to reproduce; it is a contrast case, not a disease model.
    evidence:
    - reference: PMID:27381345
      reference_title: "Infection resistance and tolerance in Peromyscus spp., natural reservoirs of microbes that are virulent for humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "they display traits of infection tolerance, which reduces the damage of the infection."
      explanation: Peromyscus tolerate the infection with reduced damage, so they do not recapitulate severe human disease.

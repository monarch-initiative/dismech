pathophysiology:
- name: Arthropod-Mediated Borrelia Inoculation
  description: >-
    Lice, Ornithodoros soft ticks, and Ixodes hard ticks deliver relapsing-fever
    Borrelia from the vector cycle into a mammalian host.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Plasmin-Assisted Spirochete Dissemination
    description: Inoculated spirochetes acquire host proteolytic activity that supports invasion and dissemination.
  evidence:
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant lacking Vtp also colonized ticks but produced neither Vtp nor a Vmp in tick salivary glands, which rendered the spirochete noninfectious by tick bite."
    explanation: Demonstrates, in the B. hermsii tick model, that a tick-phase outer-surface protein is required for tick-bite infectivity.
- name: Plasmin-Assisted Spirochete Dissemination
  description: >-
    Relapsing-fever Borrelia bind host plasminogen and generate surface plasmin,
    giving the spirochete host proteolytic activity that degrades fibrin and
    extracellular matrix and facilitates bloodstream and tissue dissemination.
  biological_processes:
  - preferred_term: plasminogen activation
    modifier: INCREASED
    term:
      id: GO:0031639
      label: plasminogen activation
  - preferred_term: proteolysis
    modifier: INCREASED
    term:
      id: GO:0006508
      label: proteolysis
  downstream:
  - target: Vmp-Switched Relapsing Bacteremia
    description: Disseminated spirochetes produce high-density bacteremia and the antigenic variants that drive recurrent waves.
  - target: Macrophage-Mediated Cytopenias
    description: Bloodstream spirochetes interact with red cells and contribute to macrophage clearance in liver and spleen.
  evidence:
  - reference: PMID:25914944
    reference_title: Interaction of spirochetes with the host fibrinolytic system and potential roles in pathogenesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Spirochetes equipped with Pla activity have been shown to degrade extracellular matrix (ECM) components, in addition to digesting fibrin, facilitating bacterial invasion and dissemination."
    explanation: The review supports plasmin generation as a mechanism for spirochete dissemination through matrix and fibrin barriers.
- name: Vmp-Switched Relapsing Bacteremia
  description: >-
    Rare variants switch silent variable major protein cassettes into the single
    expression site, changing the dominant surface antigen after an antibody
    response clears the previous serotype and restarting bacteremia.
  biological_processes:
  - preferred_term: antigenic variation
    modifier: INCREASED
    term:
      id: GO:0020033
      label: antigenic variation
  - preferred_term: DNA recombination
    modifier: INCREASED
    term:
      id: GO:0006310
      label: DNA recombination
  downstream:
  - target: B1b IgM Serotype Clearance
    description: Each bacteremic serotype elicits a rapid IgM response that clears that wave.
  - target: Severe Systemic Relapsing Fever
    description: Uncontrolled high-density bacteremia can progress to severe systemic complications.
  - target: Chills
    description: Bacteremic febrile waves are accompanied by chills and rigors.
  - target: Arthralgia
    description: The systemic bacteremic illness commonly includes arthralgia.
  - target: Skin rash
    description: The systemic bacteremic illness can produce a rash.
  - target: Premature birth
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      High-density spirochetemia in pregnancy precipitates birth during the
      febrile attack.
  evidence:
  - reference: PMID:29250931
    reference_title: Cis-acting DNA elements flanking the variable major protein expression site of Borrelia hermsii are required for murine persistence.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Borrelia hermsii, antigenic variation occurs as a result of a nonreciprocal gene conversion event that places one of ~60 silent variable major protein genes downstream of a single, transcriptionally active promoter."
    explanation: Establishes gene conversion into the expression site as the B. hermsii Vmp-switching mechanism.
  - reference: PMID:24699793
    reference_title: Inactivation of genes for antigenic variation in the relapsing fever spirochete Borrelia hermsii reduces infectivity in mice and transmission by ticks.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "spirochetes repeatedly evade the host's acquired immune response by undergoing antigenic variation of the variable major proteins (Vmps) produced on their outer surface."
    explanation: Supports Vmp switching as immune escape that prolongs the relapsing bacteremia in mammals.
- name: B1b IgM Serotype Clearance
  description: >-
    A T-independent B1b-cell response secretes IgM against the current Borrelia
    serotype, clearing that bacteremic episode and selecting any Vmp-switched
    escape variant.
  cell_types:
  - preferred_term: B-1b B cell
    term:
      id: CL:0000821
      label: B-1b B cell
  biological_processes:
  - preferred_term: humoral immune response
    modifier: INCREASED
    term:
      id: GO:0006959
      label: humoral immune response
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  downstream:
  - target: Vmp-Switched Relapsing Bacteremia
    description: Serotype clearance leaves rare Vmp switch variants to seed the next bacteremic relapse.
  evidence:
  - reference: PMID:12646649
    reference_title: The resolution of relapsing fever borreliosis requires IgM and is concurrent with expansion of B1b lymphocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice selectively incapable of secreting IgM, the dominant isotype produced by B1 cells, were completely unable to clear B. hermsii."
    explanation: Shows in mice that IgM secretion is required to clear B. hermsii bacteremia.
- name: Macrophage-Mediated Cytopenias
  description: >-
    During relapsing-fever Borrelia bacteremia, spirochetes associate with
    erythrocytes and are removed in spleen and liver by tissue macrophages,
    linking the infection to anemia and accompanying hematologic abnormalities.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Anemia
    description: Tissue macrophage removal of erythrocytes contributes to anemia.
  - target: Thrombocytopenia
    description: Platelet counts fall during the high-level relapsing-fever bacteremia.
  evidence:
  - reference: PMID:19995898
    reference_title: Genetic control of the innate immune response to Borrelia hermsii influences the course of relapsing fever in inbred strains of mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the progression of the disease in mice was associated with thrombocytopenia and anemia."
    explanation: Shows that the B. hermsii mouse model recapitulates cytopenias seen in human relapsing fever.
  - reference: PMID:19995898
    reference_title: Genetic control of the innate immune response to Borrelia hermsii influences the course of relapsing fever in inbred strains of mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "red blood cells (RBCs) were removed by tissue-resident macrophages, a process that could lead to anemia."
    explanation: Supports tissue-macrophage erythrocyte clearance as a mechanism for anemia in the B. hermsii model.
- name: Severe Systemic Relapsing Fever
  description: >-
    In severe or untreated relapsing fever, high-burden bacteremia progresses to
    systemic inflammation, respiratory failure, shock, multi-organ failure, and
    death. This burden-driven progression is distinct from the iatrogenic
    Jarisch-Herxheimer reaction triggered by antibiotic initiation.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Recurrent Fever
    description: Bacteremic waves drive recurrent febrile episodes.
  - target: Acute Respiratory Distress Syndrome
    description: Severe disease can progress to acute respiratory distress syndrome.
  - target: Shock
    description: Severe disease can produce shock and hypotension.
  - target: Altered mental status
    description: Severe systemic disease can produce altered mental status.
  evidence:
  - reference: PMID:41418926
    reference_title: Determinant factors of mortality among patients diagnosed with relapsing fever in a resource-limited setting in Ethiopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complications were observed in 88.2% of cases, most commonly anemia (74.7%), acute respiratory distress syndrome (69.7%), shock (60.5%), and Jarisch-Herxheimer reaction (36.1%)."
    explanation: Quantifies the severe systemic complications in a hospitalized Ethiopian relapsing-fever cohort.
- name: Antibiotic-Triggered Jarisch-Herxheimer Reaction
  description: >-
    The first antibiotic dose lyses the high-density spirochetemia and
    precipitates a Jarisch-Herxheimer reaction: an iatrogenic surge of TNF-alpha,
    IL-6, and IL-8 with rigors, fever, and hypotension, distinct from the
    burden-driven progression of untreated disease.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Jarisch-Herxheimer reaction
    description: The transient cytokine surge manifests clinically as the Jarisch-Herxheimer reaction.
  evidence:
  - reference: PMID:1569394
    reference_title: "Detection of plasma tumor necrosis factor, interleukins 6, and 8 during the Jarisch-Herxheimer Reaction of relapsing fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a seven-, six-, and fourfold elevation of these plasma cytokine concentrations over admission levels was detected, respectively, occurring in transient form coincidental with observed pathophysiological changes of J-HR."
    explanation: Links the Jarisch-Herxheimer physiology to transient TNF, IL-6, and IL-8 spikes in louse-borne relapsing fever.
  - reference: PMID:8663853
    reference_title: Prevention of Jarisch-Herxheimer reactions by treatment with antibodies against tumor necrosis factor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of the 20 patients given anti-TNF-alpha Fab had Jarisch-Herxheimer reactions with rigors, as compared with 26 of the 29 control patients (P = 0.006)."
    explanation: >-
      The randomized trial shows anti-TNF-alpha Fab suppresses the reaction,
      establishing TNF-alpha as causal in the antibiotic-triggered J-HR.
phenotypes:
- name: Recurrent Fever
  category: Systemic
  description: Febrile episodes recur as antigenically switched Borrelia variants regrow after the prior serotype is cleared.
  phenotype_term:
    preferred_term: Recurrent fever
    term:
      id: HP:0001954
      label: Recurrent fever
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Main laboratory findings were thrombocytopenia, increased procalcitonin, and increased polymorphonucleates in the cerebrospinal fluid."
    explanation: Documents thrombocytopenia in louse-borne relapsing fever with meningeal involvement.
- name: Acute Respiratory Distress Syndrome
  category: Respiratory
  description: Severe relapsing fever may progress to acute respiratory distress syndrome and respiratory failure.
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome

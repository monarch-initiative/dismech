name: Relapsing Fever
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Relapsing fever is an arthropod-borne infection caused by relapsing-fever
  Borrelia species. Louse-borne disease is caused by Borrelia recurrentis,
  soft-tick-borne disease is caused by species such as B. hermsii and
  B. crocidurae, and hard-tick relapsing fever can be caused by B. miyamotoi.
  Its recurrent bacteremic fever waves arise when Vmp antigenic switching lets
  rare spirochete variants escape the IgM response that cleared the previous
  serotype.
disease_term:
  preferred_term: relapsing fever
  term:
    id: MONDO:0019633
    label: relapsing fever
parents:
- Bacterial Infection
- Vector-borne disease
synonyms:
- Borrelia relapsing fever
- Louse-borne relapsing fever
- Tick-borne relapsing fever
has_subtypes:
- name: Louse-borne relapsing fever
  description: >-
    Human-louse-transmitted B. recurrentis infection, classically maintained in
    crowded or displaced human populations.
  evidence:
  - reference: PMID:26938933
    reference_title: "Louse-Borne Relapsing Fever with Meningeal Involvement in an Immigrant from Somalia to Italy, October 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Borrelia recurrentis, transmitted by Pediculus humanus humanus, is the etiological agent of louse-borne relapsing fever (LBRF)."
    explanation: The Italian imported-case report identifies B. recurrentis and the human body louse as the defining LBRF agent-vector pair.
- name: Soft-tick-borne relapsing fever
  description: >-
    Zoonotic relapsing fever maintained by Ornithodoros soft ticks and small
    mammal reservoirs in region-specific enzootic cycles.
  evidence:
  - reference: PMID:26327444
    reference_title: Borrelia infection in small mammals in West Africa and its relationship with tick occurrence inside burrows.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tick-borne relapsing fever (TBRF) is a zoonotic disease caused by several Borrelia species transmitted to humans by Ornithodoros tick vectors."
    explanation: The West African reservoir survey defines soft-tick relapsing fever as an Ornithodoros-vectored zoonosis.
- name: Hard-tick relapsing fever
  description: B. miyamotoi relapsing-fever borreliosis transmitted by Ixodes hard ticks.
  evidence:
  - reference: PMID:37610298
    reference_title: "Characteristics of Hard Tick Relapsing Fever Caused by Borrelia miyamotoi, United States, 2013-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Borrelia miyamotoi, transmitted by Ixodes spp. ticks, was recognized as an agent of hard tick relapsing fever in the United States in 2013."
    explanation: CDC surveillance frames B. miyamotoi as the cause of hard-tick relapsing fever.

- name: Jarisch-Herxheimer reaction
  category: Systemic
  description: >-
    The Jarisch-Herxheimer reaction is a sudden fever, rigors, and hypotension
    that follows the first antibiotic dose; it occurred in 36.1% of a severe
    hospitalized cohort.
  phenotype_term:
    preferred_term: Jarisch-Herxheimer reaction
  evidence:
  - reference: PMID:8663853
    reference_title: Prevention of Jarisch-Herxheimer reactions by treatment with antibodies against tumor necrosis factor alpha.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "antimicrobial treatment is often followed by sudden fever, rigors, and persistent hypotension (Jarisch-Herxheimer reactions)"
    explanation: Defines the antibiotic-triggered Jarisch-Herxheimer reaction in louse-borne relapsing fever.
  - reference: PMID:41418926
    reference_title: Determinant factors of mortality among patients diagnosed with relapsing fever in a resource-limited setting in Ethiopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complications were observed in 88.2% of cases, most commonly anemia (74.7%), acute respiratory distress syndrome (69.7%), shock (60.5%), and Jarisch-Herxheimer reaction (36.1%)."
    explanation: The Jarisch-Herxheimer reaction occurred in 36.1% of the severe Ethiopian cohort.
- name: Premature birth

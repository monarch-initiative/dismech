    reference_title: "Characteristics of Hard Tick Relapsing Fever Caused by Borrelia miyamotoi, United States, 2013-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fever and headache were common symptoms; 28% of case-patients reported recurring fevers, 55% had arthralgia, and 16% had a rash."
    explanation: Shows recurrent fever in US hard-tick relapsing-fever surveillance.
- name: Anemia
  category: Hematologic
  description: Anemia is frequent in severe relapsing fever and is modeled by spirochete-associated erythrocyte clearance.
  phenotype_term:
    preferred_term: Anemia
    term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk of birth during the attack of TBRF was 58.0%, with an extremely high perinatal mortality of 436 per 1000 births."
    explanation: The Tanzanian case-control study quantifies birth during the febrile attack and its perinatal mortality.
treatments:
- name: Doxycycline or Ceftriaxone
  description: >-
    Antibacterial pharmacotherapy clears Borrelia and stops the recurrent
    bacteremic waves; a Swiss louse-borne relapsing fever series reported
    recovery after ceftriaxone and/or doxycycline.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

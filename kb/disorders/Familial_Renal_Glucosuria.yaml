name: Familial Renal Glucosuria
creation_date: '2026-07-06T00:00:00Z'
category: Mendelian
synonyms:
- Renal Glycosuria
- SGLT2 Deficiency
- Isolated Renal Glucosuria
description: |
  Familial renal glucosuria (FRG) is characterized by persistent isolated glucosuria in the absence of hyperglycemia and without a broader Fanconi-type proximal tubulopathy. The great majority of cases are caused by loss-of-function variants in SLC5A2, encoding the renal sodium-glucose cotransporter SGLT2, which mediates the bulk of proximal tubular glucose reabsorption. A minority of cases are caused by biallelic loss-of-function variants in PDZK1IP1, encoding MAP17, an obligate accessory protein required for SGLT2 transport activity; MAP17 deficiency produces a clinically indistinguishable glucosuric phenotype by impairing the SGLT2 complex rather than the transporter itself. FRG is usually benign and frequently an incidental finding; the main documented risks are osmotic polyuria and, in patients with more massive glucosuria, mild volume depletion with secondary renin-angiotensin-aldosterone activation. The pharmacological SGLT2 inhibitors ("gliflozins") used to treat type 2 diabetes and heart failure deliberately reproduce this same reduced proximal tubular glucose reabsorption mechanism, though that drug class is curated separately and is only noted here for mechanistic context.

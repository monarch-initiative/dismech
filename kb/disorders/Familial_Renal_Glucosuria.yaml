has_subtypes:
- name: SLC5A2-Related
  display_name: SLC5A2-Related Familial Renal Glucosuria (SGLT2 Deficiency)
  subtype_term:
    preferred_term: familial renal glucosuria
    term:
      id: MONDO:0009297
      label: familial renal glucosuria
  description: |
    The classic and common form of FRG, caused by loss-of-function variants in SLC5A2. Inheritance behaves as a semidominant/codominant trait with variable, incomplete penetrance: heterozygous carriers frequently show mild glucosuria, while individuals with two SLC5A2 variants (homozygous or compound heterozygous) present earlier and with substantially greater urinary glucose excretion.
  genes:
  - preferred_term: SLC5A2
    term:
      id: hgnc:11037
      label: SLC5A2
  evidence:
  - reference: PMID:14569097
    reference_title: Molecular analysis of the SGLT2 gene in patients with renal glucosuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that SGLT2 plays an important role in renal tubular glucose reabsorption. Inheritance
      of renal glucosuria shows characteristics of a codominant trait with variable penetrance.
    explanation: Founding molecular-genetic study establishing SLC5A2 as the cause of FRG and characterizing
      the codominant, variably penetrant inheritance pattern.
  - reference: PMID:22314875
    reference_title: 'Familial renal glucosuria: a clinicogenetic study of 23 additional cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pedigree analysis data were consistent with the inheritance of a codominant trait with incomplete
      penetrance.
    explanation: Independent Korean pediatric cohort confirms codominant inheritance with incomplete penetrance
      and a genotype-phenotype gradient between single- and double-variant carriers.
- name: PDZK1IP1-Related
  display_name: PDZK1IP1-Related Familial Renal Glucosuria (MAP17 Deficiency)
  subtype_term:
    preferred_term: familial renal glucosuria
    term:
      id: MONDO:0009297
      label: familial renal glucosuria
  description: |
    A rare genocopy of SLC5A2-related FRG caused by biallelic loss-of-function variants in PDZK1IP1, encoding MAP17, an accessory protein required for SGLT2 transport activity in the proximal tubule. Identified in a patient with a homozygous splicing variant (c.176+1G>A) and no identifiable SLC5A2 mutation, within a cohort of 60 individuals with FRG, and confirmed functionally: co-expression of SGLT2 with wild-type MAP17 stimulated glucose uptake far above SGLT2 alone, whereas co-expression with the mutant MAP17 did not. OMIM 607178 is the PDZK1IP1 gene locus record (no separate phenotype MIM has been assigned for this genocopy).
  genes:
  - preferred_term: PDZK1IP1
    term:
      id: hgnc:16887
      label: PDZK1IP1
  evidence:
  - reference: PMID:27288013
    reference_title: MAP17 Is a Necessary Activator of Renal Na+/Glucose Cotransporter SGLT2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To confirm the physiologic relevance of the MAP17-SGLT2 interaction, we studied a cohort
      of 60 individuals with familial renal glucosuria. One patient without any identifiable mutation
      in the SGLT2 coding gene (SLC5A2) displayed homozygosity for a splicing mutation (c.176+1G>A) in
      the MAP17 coding gene (PDZK1IP1).
    explanation: Direct clinical-genetic evidence that biallelic PDZK1IP1 loss-of-function causes an SLC5A2-negative
      case of familial renal glucosuria.
  - reference: PMID:27288013
    reference_title: MAP17 Is a Necessary Activator of Renal Na+/Glucose Cotransporter SGLT2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Using expression cloning, we identified an accessory protein, 17 kDa membrane-associated
      protein (MAP17), that increased SGLT2 activity in RNA-injected Xenopus oocytes by two orders of
      magnitude. Significant stimulation of SGLT2 activity also occurred in opossum kidney cells cotransfected
      with SGLT2 and MAP17.
    explanation: Functional evidence that MAP17 is required to activate SGLT2 transport activity, establishing
      the mechanistic basis for PDZK1IP1-related FRG.
  - reference: PMID:38344682
    reference_title: Genetic and clinical characterization of familial renal glucosuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We sequenced SLC5A2 and PDZK1IP1 in 21 FRG patients and measured the renal threshold of glucose
      (RTG) in 15 patients.
    explanation: Contemporary clinical-genetics cohort study that routinely sequences PDZK1IP1 alongside
      SLC5A2 in the diagnostic workup of FRG, confirming PDZK1IP1 as an accepted second causative gene
      for the same phenotype.
inheritance:
- name: Semidominant with incomplete penetrance
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  penetrance: INCOMPLETE
  description: |
    SLC5A2-related FRG behaves as a semidominant (codominant) trait: a single SLC5A2 variant is frequently sufficient to cause detectable, usually mild, glucosuria, but two variants (homozygous or compound heterozygous) are associated with earlier diagnosis and substantially higher urinary glucose excretion. Penetrance in heterozygotes is incomplete and variable - some heterozygous relatives of affected probands have normal urinary glucose. PDZK1IP1-related FRG has been described only in the biallelic (homozygous) state to date; monoallelic PDZK1IP1 penetrance has not been established.
  evidence:
  - reference: PMID:22314875
    reference_title: 'Familial renal glucosuria: a clinicogenetic study of 23 additional cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with two mutations were diagnosed earlier with larger amounts of urinary glucose
      excretion than patients with single mutations. Pedigree analysis data were consistent with the inheritance
      of a codominant trait with incomplete penetrance.
    explanation: Directly documents the gene-dosage effect (biallelic vs. monoallelic) and incomplete
      penetrance underlying the semidominant inheritance model.
pathophysiology:
- name: Reduced Proximal Tubular Glucose Reabsorption
  description: |
    The shared convergent mechanism across both genetic causes: failure of the SGLT2 transport complex in the S1/S2 segment of the proximal tubule lowers the renal threshold for glucose, so glucose that would normally be almost completely reabsorbed is excreted in the urine despite normal plasma glucose concentrations.
  cell_types:
  - preferred_term: Proximal tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: Renal D-glucose absorption
    term:
      id: GO:0035623
      label: renal D-glucose absorption
    modifier: DECREASED
  locations:
  - preferred_term: proximal convoluted tubule
    term:
      id: UBERON:0001287
      label: proximal convoluted tubule
  evidence:
  - reference: PMID:14569097
    reference_title: Molecular analysis of the SGLT2 gene in patients with renal glucosuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The role of SGLT2 (the gene for a renal sodium-dependent glucose transporter) in renal glucosuria
      was evaluated.
    explanation: Establishes SGLT2-mediated proximal tubular glucose reabsorption as the central mechanism
      disrupted in FRG.
  downstream:
  - target: Isolated Renal Glucosuria
    description: |
      Reduced SGLT2-mediated glucose reabsorption lowers the renal glucose threshold, so glucose appears in the urine at normal (non-diabetic) blood glucose concentrations.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38344682
      reference_title: Genetic and clinical characterization of familial renal glucosuria.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: RTG in our cohort ranged from 1.0 to 9.2 mmol/L.
      explanation: Quantifies the lowered renal threshold of glucose (RTG) directly produced by impaired
        SGLT2-mediated reabsorption.
  - target: Polyuria
    description: |
      Glucose left in the tubular lumen acts as an osmotic load and carries water with it, increasing urine volume.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - osmotic diuresis
    evidence:
    - reference: ORPHA:69076
      reference_title: "Familial renal glucosuria"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: The disorder is benign in the majority of cases although it may occasionally manifest with
        polyuria
      explanation: Orphanet reports polyuria in FRG. The osmotic-diuresis step linking it to glucose
        wasting is not stated in the source, so this is indirect support for the edge.
  - target: Mild Volume Depletion with Renin-Angiotensin-Aldosterone Activation
    description: |
      In severe FRG with massive glucosuria, osmotic diuresis and renal sodium wasting lead to mild volume depletion with secondary activation of the renin-angiotensin-aldosterone system.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - osmotic diuresis
    - renal sodium wasting
    evidence:
    - reference: PMID:16518345
      reference_title: 'Familial renal glucosuria: SLC5A2 mutation analysis and evidence of salt-wasting.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The patient homozygous for the p.A102V mutation had glucosuria of 65.6 g/1.73 m(2)/24 h,
        evidence of renal sodium wasting, mild volume depletion, and raised basal plasma renin and serum
        aldosterone levels.
      explanation: Links severe glucosuria from SGLT2 deficiency to renal sodium wasting, mild volume
        depletion, and secondary RAAS activation.

- name: PDZK1IP1/MAP17 Loss-of-Function Impairing SGLT2 Complex Function
  subtypes:
  - PDZK1IP1-Related
  description: |
    Biallelic loss-of-function variants in PDZK1IP1 abolish production or function of MAP17, the obligate accessory protein that activates SGLT2. MAP17 does not alter the amount of SGLT2 protein trafficked to the cell surface but is nonetheless required for its transport activity, so its loss produces a functional SGLT2 complex deficiency phenotypically equivalent to a direct SLC5A2 lesion.
  cell_types:
  - preferred_term: Proximal tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  locations:
  - preferred_term: proximal convoluted tubule
    term:
      id: UBERON:0001287
      label: proximal convoluted tubule

  - preferred_term: PDZK1IP1
    term:
      id: hgnc:16887
      label: PDZK1IP1
  molecular_functions:
  - preferred_term: SGLT2 transporter activator activity
    term:
      id: GO:0141109
      label: transporter activator activity
    modifier: DECREASED
  evidence:
  - reference: PMID:27288013
    reference_title: MAP17 Is a Necessary Activator of Renal Na+/Glucose Cotransporter SGLT2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, transfection with MAP17 did not change the quantity of SGLT2 protein at the cell
      surface in either cell type.
    explanation: Shows MAP17 loss impairs SGLT2 function without altering its surface abundance, i.e.
      a functional (not trafficking-quantity) complex defect.
  downstream:
  - target: Reduced Proximal Tubular Glucose Reabsorption
    description: |
      Loss of MAP17-mediated activation of SGLT2 reduces net SGLT2 transport activity, lowering proximal tubular glucose reabsorption to the same degree seen with direct SLC5A2 lesions.
    causal_link_type: DIRECT
    intermediate_mechanisms:
    - MAP17 (PDZK1IP1) forms a complex with SGLT2 in the proximal tubule apical membrane and is required
      to activate its transport activity; loss of this interaction reduces SGLT2-mediated glucose transport
      without depleting SGLT2 protein itself.
    evidence:
    - reference: PMID:27288013
      reference_title: MAP17 Is a Necessary Activator of Renal Na+/Glucose Cotransporter SGLT2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: One patient without any identifiable mutation in the SGLT2 coding gene (SLC5A2) displayed
        homozygosity for a splicing mutation (c.176+1G>A) in the MAP17 coding gene (PDZK1IP1).
      explanation: A patient with familial renal glucosuria and no SLC5A2 lesion carries a homozygous
        PDZK1IP1 splice variant, so loss of MAP17 alone is sufficient to produce the glucosuric defect.
    - reference: PMID:27288013
      reference_title: MAP17 Is a Necessary Activator of Renal Na+/Glucose Cotransporter SGLT2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Using expression cloning, we identified an accessory protein, 17 kDa membrane-associated
        protein (MAP17), that increased SGLT2 activity in RNA-injected Xenopus oocytes by two orders of
        magnitude. Significant stimulation of SGLT2 activity also occurred in opossum kidney cells cotransfected
        with SGLT2 and MAP17.
      explanation: MAP17 is required to activate SGLT2 transport, so its loss reduces SGLT2-mediated glucose
        transport.
phenotypes:
- category: Renal
  name: Isolated Renal Glucosuria
  frequency: OBLIGATE
  description: |
    Persistent glucosuria at normal fasting and postprandial blood glucose concentrations, without generalized proximal tubular dysfunction. Most patients are asymptomatic and the finding is often incidental (e.g. on routine urinalysis).
  phenotype_term:
    preferred_term: Glucosuria
    term:
      id: HP:0003076
      label: Glycosuria
  evidence:
  - reference: PMID:14569097
    reference_title: Molecular analysis of the SGLT2 gene in patients with renal glucosuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The role of SGLT2 (the gene for a renal sodium-dependent glucose transporter) in renal glucosuria
      was evaluated.
    explanation: Establishes glucosuria as the defining phenotype of FRG.
- category: Renal
  name: Mild Volume Depletion with Renin-Angiotensin-Aldosterone Activation
  description: |
    In patients with more massive glucosuria, osmotic diuresis can produce evidence of renal sodium wasting and mild volume depletion, with secondary activation of the renin-angiotensin-aldosterone system (raised basal plasma renin and serum aldosterone). This is the documented mechanistic basis for the dehydration risk described in FRG.
  phenotype_term:
    preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:16518345
    reference_title: 'Familial renal glucosuria: SLC5A2 mutation analysis and evidence of salt-wasting.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient homozygous for the p.A102V mutation had glucosuria of 65.6 g/1.73 m(2)/24 h,
      evidence of renal sodium wasting, mild volume depletion, and raised basal plasma renin and serum
      aldosterone levels.
    explanation: Documents mild volume depletion and secondary RAAS activation in a patient with massive
      glucosuria, supporting dehydration risk as an occasional but real complication of severe FRG.
- category: Renal
  name: Polyuria
  frequency: OCCASIONAL
  description: |
    Increased urine volume. Orphanet lists polyuria among the occasional manifestations of an otherwise usually benign disorder; the entry attributes it to the osmotic load of the excreted glucose.

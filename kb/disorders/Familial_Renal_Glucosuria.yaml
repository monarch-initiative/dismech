diagnosis:
- name: Renal Threshold of Glucose / Kidney Function Testing
  diagnosis_term:
    preferred_term: kidney function testing
    term:
      id: NCIT:C74972
      label: Renal Function Test
  description: >
    Diagnosis rests on demonstrating persistent glucosuria with normal
    fasting and post-prandial blood glucose (excluding diabetes mellitus),
    quantifying the renal threshold of glucose (RTG), and, critically,
    excluding other proximal tubular solute losses (generalized
    aminoaciduria, phosphaturia, bicarbonaturia/renal tubular acidosis, or
    low-molecular-weight proteinuria). This negative Fanconi workup is
    diagnostically important: it distinguishes isolated FRG from generalized
    proximal tubulopathies such as Fanconi-Bickel syndrome (SLC2A2-related)
    and other renal Fanconi syndromes, in which glucosuria accompanies
    multiple other tubular transport defects rather than occurring in
    isolation.
  evidence:
  - reference: PMID:38344682
    reference_title: Genetic and clinical characterization of familial renal glucosuria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced SLC5A2 and PDZK1IP1 in 21 FRG patients and measured the renal threshold of glucose (RTG) in 15 patients."
    explanation: >-
      Demonstrates the diagnostic workup (renal threshold of glucose
      quantification plus SLC5A2/PDZK1IP1 sequencing) used to characterize
      and confirm FRG.
differential_diagnoses:
- name: Fanconi-Bickel Syndrome / Renal Fanconi Syndrome
  description: >
    Generalized proximal tubulopathies (e.g. SLC2A2-related Fanconi-Bickel
    syndrome) present with glucosuria as one of several concurrent proximal
    tubular solute losses (generalized aminoaciduria, phosphaturia,
    bicarbonaturia), in contrast to the isolated glucosuria with otherwise
    normal tubular function that defines FRG. Curated as a separate dismech
    entry (SLC2A2-related Fanconi-Bickel syndrome).
  distinguishing_features:
  - Concurrent generalized aminoaciduria, phosphaturia, and bicarbonaturia (absent in isolated FRG)
  - Hepatomegaly and growth failure from glycogen storage (Fanconi-Bickel), absent in FRG
  - Different causative gene (SLC2A2/GLUT2) and cell-type localization (basolateral rather than apical transporter)
- name: Diabetes Mellitus
  description: >
    Diabetic glucosuria occurs secondary to hyperglycemia exceeding the
    normal renal glucose threshold, whereas FRG glucosuria occurs despite
    normal blood glucose concentrations.
  distinguishing_features:
  - Elevated fasting/postprandial blood glucose and abnormal HbA1c in diabetes, both normal in FRG
treatments:
- name: Hydration Counseling and Monitoring
  description: >
    FRG generally requires no specific treatment. Management is limited to
    reassurance (most patients are asymptomatic and the condition is
    benign), maintaining adequate fluid intake to offset osmotic diuresis,
    and monitoring during catabolic or volume-depleting stress (illness,
    fasting, pregnancy) when dehydration risk is increased. Because the
    mechanism (reduced SGLT2-mediated proximal tubular glucose reabsorption)
    is the same one deliberately induced pharmacologically by SGLT2
    inhibitors (gliflozins) in diabetes/heart failure/CKD, clinicians should
    be aware of the mechanistic parallel, though gliflozin pharmacology
    itself is out of scope for this entry.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:16518345
    reference_title: "Familial renal glucosuria: SLC5A2 mutation analysis and evidence of salt-wasting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial renal glucosuria (FRG) is an inherited renal tubular disorder characterized by persistent isolated glucosuria in the absence of hyperglycemia."
    explanation: >-
      Supports a supportive-care/monitoring approach, since FRG is a
      persistent but generally uncomplicated tubular transport trait rather
      than a disease requiring targeted therapy.

discussions:
- discussion_id: opa7_retinal_ganglion_cell_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does loss of a ubiquitously required complex I assembly factor produce isolated optic
    atrophy rather than the infantile encephalopathy seen with other complex I assembly
    defects?
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell Degeneration
  rationale: >-
    Complex I is needed in every cell, and loss of other nuclear complex I assembly factors
    causes multisystem infantile mitochondrial disease. TMEM126A loss causes an isolated
    complex I deficiency and yet presents, in most reported patients, as nonsyndromic optic
    atrophy. The explanation offered in the literature is not specific to this gene: it is
    the class-wide observation that retinal ganglion cells and their axons are especially
    susceptible to perturbed mitochondrial homeostasis. That may be correct, but it does not
    account for why this particular assembly factor spares the tissues that other assembly
    factors do not, and no study has compared residual complex I activity across tissues in
    TMEM126A-deficient material.
  notes: >-
    Testing this needs tissue-resolved complex I measurements in TMEM126A-deficient cells or
    an animal model. No animal model of OPA7 is reported, which is itself part of the gap.
- discussion_id: opa7_syndromic_tail_variable_expressivity
  kind: OPEN_QUESTION
  prompt: >-
    Are the auditory and peripheral neuropathies part of OPA7, or do they mark a distinct
    allele-dependent syndromic form?
  attaches_to:
  - phenotypes#Abnormal auditory evoked potentials
  - phenotypes#Peripheral axonal neuropathy
  rationale: >-
    Auditory neuropathy was found in both siblings of one family when it was looked for, and
    peripheral neuropathy in one proband but not in that proband's affected siblings, who
    share the genotype. Other families are described as nonsyndromic. Two readings fit: the
    extra features are variable expressivity of one disease, or they are present more often
    than reported and are simply not sought in patients referred for optic atrophy. The
    intrafamilial discordance argues for the first, while the fact that auditory neuropathy
    was found in both siblings of the one family that performed audiology argues for the
    second.
  notes: >-
    Resolving this needs systematic audiology and nerve conduction studies across the reported
    cohort rather than only in families where a second symptom prompted them.
notes: >-
  Curated from the primary TMEM126A literature together with an OpenScientist deep-research
  report (17/17 references verified, all assessed on topic). Five notes on the evidence.

  **The pathograph reaches the phenotypes through four edges of differing strength.** Optic
  atrophy is `DIRECT` from retinal ganglion cell degeneration, because they are the same
  event seen histologically and on fundoscopy. Acuity loss, central scotoma and
  dyschromatopsia are `INDIRECT_KNOWN_INTERMEDIATES`: the intermediate is degeneration of the
  papillomacular bundle, which the field-defect data locate directly - the severely affected
  proband has an absolute central scotoma and his milder siblings a relative one in the
  papillomacular area.

  **The gene and the mechanism come from twelve years apart, and the entry keeps them
  separate.** The 2009 identification paper describes the protein's function as unknown, and
  that sentence is quoted rather than paraphrased so a reader sees what that paper did and
  did not claim. The ND4-module assembly role is 2021 cell biology, cited to those studies
  and graded `IN_VITRO`.

  **The step from complex I deficiency to retinal ganglion cell degeneration is marked
  `INDIRECT_UNKNOWN_INTERMEDIATES` on the edge itself**, and its evidence is
  `REVIEW_SYNTHESIS` from a class-wide review. No source makes this argument for TMEM126A
  specifically. The `KNOWLEDGE_GAP` discussion records why that matters more here than it
  would elsewhere: other complex I assembly-factor defects cause multisystem infantile
  disease, so the tissue selectivity is a real question rather than a formality.

  **One ontology binding is deliberately imperfect.** HPO has no term for auditory neuropathy
  or auditory neuropathy spectrum disorder. The phenotype is bound to `HP:0006958` *Abnormal
  auditory evoked potentials*, which captures the electrophysiological half of the diagnosis,
  with the clinical entity in `preferred_term` and the reason in the phenotype's `notes`. The
  deep-research report offered `HP:0031604` for auditory neuropathy; that identifier is
  *Agenesis of the carotid canal*, and the report's own term validation caught it.

  **The LHON-derived therapeutic prospects are described but not curated as treatments.**
  Idebenone and AAV gene therapy are mechanism-based extrapolations that cross from a mtDNA
  subunit defect to a nuclear assembly-factor defect, and neither has been tested in OPA7.
  Curating them as treatments would imply a measured effect that does not exist.

  No GeneReviews chapter exists for OPA7 or TMEM126A-related optic atrophy; a PubMed search
  returned nothing.

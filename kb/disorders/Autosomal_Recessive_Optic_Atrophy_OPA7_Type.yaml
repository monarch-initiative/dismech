prevalence:
- population: Worldwide, reported families
  measure_type: CASES_IN_LITERATURE
  notes: OPA7 has been reported in small family series and diagnostic cohorts. Early reports were enriched for North African families carrying a recurrent allele, but subsequent reports extend the geographic distribution. No reliable population prevalence or penetrance estimate is established.
  evidence:
  - reference: PMID:31119195
    reference_title: First TMEM126A missense mutation in an Italian proband with optic atrophy and deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only 6 families of African ancestry (Algeria and Morocco) have been reported to date, all carrying the c.163C>T (p.Arg55X) mutation, suggesting a founder effect.
    explanation: This is the 2019 paper’s historical literature count, not a current census or population prevalence estimate.

    explanation: >-
      Places severe dyschromatopsia among the features distinguishing recessive optic atrophy
      from OPA1 disease. Marked INDIRECT and BACKGROUND because the sentence is this paper's
      introduction characterising the disease class rather than reporting its own patients.
- category: Audiologic
  name: Abnormal auditory evoked potentials
  description: >-
    Auditory neuropathy spectrum abnormalities, defining a syndromic form of OPA7. Reported
    in both siblings of the family in which audiology was performed, but absent from the
    families described as nonsyndromic, so it is a feature of some patients rather than of
    the disease.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: auditory neuropathy spectrum disorder
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  notes: >-
    HPO has no term for auditory neuropathy or for auditory neuropathy spectrum disorder.
    Bound here to the abnormal-auditory-evoked-potentials term, which captures the
    electrophysiological half of the diagnosis, with the clinical entity carried in
    `preferred_term`. The deep-research report offered `HP:0031604` for auditory neuropathy;
    that identifier is *Agenesis of the carotid canal* and was not used.
  evidence:
  - reference: PMID:20405026
    reference_title: Nonsense mutation in TMEM126A causing autosomal recessive optic atrophy and auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "audiological investigation in both siblings revealed abnormalities falling within the auditory neuropathy/dysynchrony spectrum"
    explanation: >-
      The audiological finding, quoted including the source's spelling "dysynchrony", since a
      snippet reproduces its source.
- category: Neurologic
  name: Peripheral axonal neuropathy
  description: >-
    Sensory-motor axonal neuropathy with demyelinating features, reported in one proband of a
    Moroccan family but not in that proband's affected siblings. Intrafamilial variability in
    a family sharing one genotype is the relevant observation here.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  evidence:
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband, but not the other affected siblings, had sensory-motor axonal neuropathy"
    explanation: >-
      Records the neuropathy and, in the same clause, that siblings with the same genotype
      did not have it, which is the evidence for variable expressivity rather than for a
      genotype-phenotype correlation.
prevalence:
- population: Worldwide, reported families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare, with a founder concentration rather than a uniform distribution: most
    reported patients are of Maghrebian ancestry and homozygous for one ancestral allele. No
    population prevalence has been estimated and none is asserted here. The closest available
    figure is the gene's share of a large diagnostic cohort, recorded under `genetic`.
  evidence:
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonsyndromic autosomal recessive optic atrophy (arOA) is extremely rare and its existence was disputed until a locus, optic atrophy 6 (OPA6), was mapped to 8q."
    explanation: >-
      States the rarity of the disease class, and records that it was doubted to exist at all
      before the loci were mapped.
treatments:
- name: Low-Vision Rehabilitation and Supportive Care
  description: >-
    No OPA7-specific therapy exists. Management is supportive: low-vision aids, hearing
    rehabilitation where the auditory neuropathy is present, and genetic counselling. Because
    the lesion is a complex I defect, idebenone and AAV gene therapy are mechanism-based
    prospects extrapolated from LHON; neither has been tested in OPA7, and the extrapolation
    crosses from a mtDNA subunit defect to a nuclear assembly-factor defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded without an evidence item because no treatment study exists for this disorder and
    no cited publication asserts an outcome in OPA7 patients. The LHON-derived prospects are
    described in the `description` as prospects rather than being curated as treatments,
    since curating them would imply a target and an effect that nothing has measured here.
diagnosis:
- name: Molecular diagnosis on a hereditary optic neuropathy gene panel
  description: >-
    Optic atrophy on examination with a compatible pedigree, then sequencing. TMEM126A sits on
    the standard nuclear optic neuropathy panels, and ancestry is informative: a Maghrebian
    patient with recessive optic atrophy is a candidate for the founder allele specifically.
    Full-field ERG is normal, which excludes a primary photoreceptor process, while pattern
    VEPs are grossly abnormal and OCT shows thinning of the retinal nerve fibre layer.
  evidence:
  - reference: PMID:36317462
    reference_title: The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The positive diagnosis rate in individuals referred for autosomal dominant or recessive optic neuropathies was 27% (451/1680 index cases), with 10 genes accounting together for 96% of this cohort."
    explanation: >-
      Quantifies the diagnostic yield of the panel approach that identifies this disease, and
      the concentration of diagnoses in a small set of genes including TMEM126A.
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the standard electroretinogram was normal, and OCT showed thinning of all RNFL bundles"
    explanation: >-
      The two structural and electrophysiological findings that place the lesion at the
      ganglion cell and axon rather than at the photoreceptor: a normal ERG excludes a
      primary retinal process, and OCT shows the axonal loss directly.

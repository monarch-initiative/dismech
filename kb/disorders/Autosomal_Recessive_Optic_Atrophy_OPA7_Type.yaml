inheritance:
- name: Autosomal recessive
  description: Autosomal recessive inheritance is supported by segregation in multiple families, including homozygous and compound-heterozygous genotypes. Many early North African families were consanguineous, but consanguinity is not universal. Small clinically ascertained series do not establish complete penetrance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19327736
    reference_title: TMEM126A, encoding a mitochondrial protein, is mutated in autosomal-recessive nonsyndromic optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using an approach of whole-genome homozygosity mapping and positional cloning, we have identified the first gene, to our knowledge, responsible for this condition, TMEM126A, in a large multiplex inbred Algerian family and subsequently in three other families originating from the Maghreb.
    explanation: Homozygosity mapping in consanguineous multiplex families is the method and the argument for recessive inheritance simultaneously.
  - reference: PMID:36071901
    reference_title: 'Genetic spectrum and characteristics of autosomal optic neuropathy in Korean: Use of next-generation sequencing in suspected hereditary optic atrophy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The targeted NGS showed the presence of the novel compound heterozygous TMEM126A c.28del:p.(Glu10Lysfs*3) / c.163C>T:p.(Arg55*) variants
    explanation: The Korean proband carried paternal c.28del and maternal c.163C>T, both reported as likely pathogenic in the variant table.
genetic:
- name: TMEM126A
  gene_term: &id001
    preferred_term: TMEM126A
    term:
      id: hgnc:25382
      label: TMEM126A
  relationship_type: CAUSATIVE
  notes: Biallelic TMEM126A variants cause OPA7, including homozygous and compound-heterozygous genotypes. The North African p.Arg55Ter founder allele is recurrent, while later Turkish, Iraqi, Italian, Chinese and Korean reports broaden the spectrum. RNA assays establish exon 2 skipping for c.86+2T>C, but complete loss of every protein isoform was not measured. Reports disagree on the classification of p.Ser36Leu; its segregation evidence and computational predictions should be distinguished from a direct functional assay.
  evidence:
  - reference: PMID:30961538
    reference_title: 'Novel likely pathogenic variants in TMEM126A identified in non-syndromic autosomal recessive optic atrophy: two case reports.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To date, all reports of pathogenic TMEM126A variants are from affected individuals of Maghrebian origin, who all carry an identical nonsense variant. Here we report two novel variants in the TMEM126A gene from non-Maghreb individuals, both found in affected individuals with an arOA phenotype.
    explanation: States both the founder-allele dominance of the earlier literature and the two alleles that broke it, which is the shape of the reported mutation spectrum.
  - reference: PMID:36317462
    reference_title: The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The identified top 10 nuclear genes included OPA1, WFS1, ACO2, SPG7, MFN2, AFG3L2, RTN4IP1, TMEM126A, NR2F1 and FDXR.
    explanation: TMEM126A was among the ten most frequently implicated nuclear genes in this referral cohort. The aggregate diagnostic yield is not the population prevalence of OPA7 or the yield attributable to TMEM126A alone.
  variants:
  - name: c.163C>T (p.Arg55Ter)
    gene: *id001
    description: Recurrent North African founder nonsense allele; homozygous in multiple families and in trans with c.28del in the Korean case. Phenotypic severity and extraocular findings vary within shared genotypes. The early stop lies upstream of an alternative translation start, so a complete null effect should not be presumed solely from its position.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2667974/
      reference_title: TMEM126A, Encoding a Mitochondrial Protein, Is Mutated in Autosomal-Recessive Nonsyndromic Optic Atrophy - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The mutation occurred in a CpG doublet, segregated with the disease in the family
      explanation: The recurrent homozygous p.Arg55Ter allele segregated in the founding family; three further North African families carried the same allele.
    - reference: PMID:36071901
      reference_title: 'Genetic spectrum and characteristics of autosomal optic neuropathy in Korean: Use of next-generation sequencing in suspected hereditary optic atrophy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The targeted NGS showed the presence of the novel compound heterozygous TMEM126A c.28del:p.(Glu10Lysfs*3) / c.163C>T:p.(Arg55*) variants
      explanation: The Korean proband carried paternal c.28del and maternal c.163C>T, both reported as likely pathogenic in the variant table.
    - reference: CGGV:assertion_bc3b00f9-e385-48c5-8d6d-fcbee7a33717-2024-09-19T160000.000Z
      reference_title: TMEM126A / autosomal recessive optic atrophy, OPA7 type (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Functional studies are not reported on this variant but the premature stop codon occurs in exon 3/5 upstream of a known alternative start codon of a protein coding transcript
      explanation: ClinGen cautions that the p.Arg55Ter stop is upstream of an alternative initiation site; genotype–phenotype segregation is stronger than the unmeasured assumption of complete protein absence.
  - name: c.86+2T>C
    gene: *id001
    description: Homozygous canonical splice-donor variant in a Turkish woman with childhood-onset optic atrophy. Blood cDNA showed loss of exon 2 from the major transcript, leaving the shorter isoform that can use an exon 3 initiation codon.
    evidence:
    - reference: PMID:30961538
      reference_title: 'Novel likely pathogenic variants in TMEM126A identified in non-syndromic autosomal recessive optic atrophy: two case reports.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Subsequent cDNA analysis based on RNA isolated from whole blood revealed a single transcript with complete skipping of exon 2
      explanation: The measured effect is exon 2 skipping, including the usual initiation codon; persistence of a shorter isoform prevents an unqualified all-protein-null claim.
  - name: c.107C>T (p.Ser36Leu)
    gene: *id001
    description: Homozygous in Iraqi siblings in 2019 and in affected members of Chinese family F98 in 2020. The first report explicitly classified it as VUS; the later report argued for pathogenic or likely pathogenic status from segregation, conservation and modeling. These are differing published interpretations without a direct allele-specific functional assay. The Chinese narrative calls the affected pair brothers, whereas its demographic table records one male and one female; sex-specific conclusions are not drawn.
    evidence:
    - reference: PMID:32855858
      reference_title: Mutation Screening of mtDNA Combined Targeted Exon Sequencing in a Cohort With Suspected Hereditary Optic Neuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Studies have reported that the two affected siblings from Iraqi descent detected the p.S36L variant and categorized the variant as unclear significance.
      explanation: The 2020 study acknowledges the 2019 VUS interpretation, then argues for pathogenic or likely pathogenic classification using segregation and computational evidence in a Chinese family.
  - name: c.497A>G (p.Gln166Arg)
    gene: *id001
    description: Homozygous missense variant in an Italian proband with childhood optic atrophy, mild bilateral sensorineural deafness and intermittent limb myoclonus. Likely parental consanguinity was reconstructed from ancestry rather than established as a documented relationship.
    evidence:
    - reference: PMID:31119195
      reference_title: First TMEM126A missense mutation in an Italian proband with optic atrophy and deafness.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: revealed the presence of a homozygous mutation affecting the TMEM126A gene (c.497A>G, p.Q166R), affecting one of the transmembrane helices.
      explanation: A homozygous missense variant was found in an Italian proband with optic atrophy and mild bilateral sensorineural hearing loss. The report relied on segregation and computational predictions without an allele-specific functional assay.
  - name: c.28del (p.Glu10LysfsTer3)
    gene: *id001
    description: Paternally inherited early frameshift in trans with maternal p.Arg55Ter in a Korean boy with optic atrophy and latent nystagmus. The 2022 report classified both variants as likely pathogenic on NM_032273.3.
    evidence:
    - reference: PMID:36071901
      reference_title: 'Genetic spectrum and characteristics of autosomal optic neuropathy in Korean: Use of next-generation sequencing in suspected hereditary optic atrophy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The targeted NGS showed the presence of the novel compound heterozygous TMEM126A c.28del:p.(Glu10Lysfs*3) / c.163C>T:p.(Arg55*) variants
      explanation: The Korean proband carried paternal c.28del and maternal c.163C>T, both reported as likely pathogenic in the variant table.
pathophysiology:
- name: TMEM126A Loss of Function
  description: Disease-associated TMEM126A genotypes include predicted truncating alleles and a splice variant with measured exon 2 skipping. The splice change removes the normal translation start from the major transcript; a shorter isoform persists, and complete absence of every functional protein product was not demonstrated. Reported missense alleles require variant-specific interpretation rather than an automatic null classification.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Impaired Complex I Assembly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Knockout and rescue establish a role in complex I biogenesis; ND4 association and secondary TMEM126B loss offer partly overlapping mechanistic explanations.
  - target: Impaired OXA1L-Dependent Nascent Protein Insertion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: TMEM126A associates with OXA1L, ribosomes and nascent chains; loss impairs their biogenesis. Cargo stalling is inferred from interaction, proteolysis and rescue experiments.
  - target: Reduced TMEM126B Abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: TMEM126B protein levels fall after TMEM126A depletion or knockout; the intermediate regulatory or stability mechanism remains unresolved.
  evidence:
  - reference: PMID:23500070
    reference_title: TMEM126A is a mitochondrial located mRNA (MLR) protein of the mitochondrial inner membrane.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TMEM126A mRNAs are strongly enriched in the vicinity of mitochondria and encode an inner mitochondrial membrane associated cristae protein.
    explanation: Establishes the inner-membrane localization this node binds, by cellular fractionation, proteolysis assays and electron microscopy. The 2009 identification paper below could say only "mitochondrial protein of unknown function", so the localization is cited to the paper that measured it rather than to the one that named the gene.
  - reference: PMID:19327736
    reference_title: TMEM126A, encoding a mitochondrial protein, is mutated in autosomal-recessive nonsyndromic optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TMEM126A is conserved in higher eukaryotes and encodes a transmembrane mitochondrial protein of unknown function, supporting the view that mitochondrial dysfunction may be a hallmark of inherited optic neuropathies including isolated autosomal-recessive forms.
    explanation: 'The original identification, quoted with its own admission that the protein''s function was unknown at the time. That matters for reading this entry: the mechanism below was established twelve years later and is not what this paper claimed.'
  genes:
  - preferred_term: TMEM126A
    term:
      id: hgnc:25382
      label: TMEM126A
- name: Impaired OXA1L-Dependent Nascent Protein Insertion
  description: TMEM126A interacts with the OXA1L insertase, mitochondrial ribosomes and newly synthesized mitochondrial polypeptides. Loss of this accessory protein is proposed to impede cotranslational membrane insertion and stall cargo at OXA1L. Direct cross-linking establishes nascent-chain association; the chaperone-like insertion role and cargo-stalled state remain mechanistic interpretations of the biochemical experiments.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our data reveal that TMEM126A cooperates with OXA1L in protein insertion into the membrane.
    explanation: Interaction, cross-linking and rescue experiments support cooperation during membrane protein biogenesis; this is not a direct structural observation of stalled cargo.
  downstream:
  - target: iAAA-Dependent OXA1L Turnover
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The proposed cargo-insertion defect is coupled to protease-dependent OXA1L fragmentation in TMEM126A-depleted cells and isolated mitochondria.
  - target: Loss of Nascent Mitochondrial Polypeptides
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The inferred insertion defect exposes nascent cargo to iAAA-dependent quality control. YME1L codepletion restores labeled proteins; this does not demonstrate that cleavage of OXA1L itself causes cargo loss.
    intermediate_mechanisms:
    - Proteolytic clearance of newly synthesized cargo associated with OXA1L
- name: iAAA-Dependent OXA1L Turnover
  description: OXA1L undergoes partial proteolytic cleavage after TMEM126A loss. Depletion of YME1L, PARL or SLP2 suppresses this cleavage, whereas AFG3L2 depletion does not. The observed turnover is interpreted as mitochondrial inner-membrane quality control acting on insertion complexes; it is not evidence of complete OXA1L depletion in every knockout condition.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Loss of the iAAA protease complex constituents PARL, SLP2, and YME1L, but not the loss of AFG3L2, blocked the observed OXA1L cleavage
    explanation: Protease perturbation identifies the machinery required for OXA1L fragmentation in this model.
- name: Loss of Nascent Mitochondrial Polypeptides
  description: Newly synthesized mitochondrial proteins are depleted after TMEM126A knockdown or knockout in the 2024 HEK293 study. YME1L codepletion restores labeled products, while mtDNA, mitochondrial RNA and tested ribosomal protein levels are preserved. Untagged TMEM126B rescues complex I but not this nascent-protein defect, distinguishing the two biochemical outcomes. The contribution of this broader proteostasis defect to human optic neuropathy remains unresolved.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: translation products were fully recovered to WT levels upon additional depletion of YME1L
    explanation: YME1L codepletion restores the labeled products, supporting degradation rather than a primary global translation defect as the explanation for their lower abundance.
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The reduction in newly synthesized mitochondrial translation products that was apparent in TMEM126A−/− cells was not complemented by TMEM126B
    explanation: This biochemical defect persists despite restoration of complex I by untagged TMEM126B.
- name: Reduced TMEM126B Abundance
  description: TMEM126B protein abundance decreases after TMEM126A depletion or knockout in HEK293 cells. Re-expression of untagged TMEM126B restores complex I assembly and activity, supporting secondary paralog depletion as a cause of that phenotype in this model. The mechanism lowering TMEM126B and its importance in patient retinal ganglion cells remain undetermined.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: in isolated mitochondria from TMEM126A knockdown cells, we observed that the TMEM126B steady-state levels were drastically reduced compared with the non-targeting control
    explanation: TMEM126B abundance decreases after TMEM126A knockdown; rescue establishes the relevance of this secondary loss to complex I in the same system.
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The expression of the untagged TMEM126B in TMEM126A−/− cells fully rescued the complex I defect as assessed by activity measurement and BN-PAGE
    explanation: Untagged TMEM126B restores the complex I phenotype in this model; tagged TMEM126B failed, and neither form restored nascent mitochondrial translation products.
  downstream:
  - target: Impaired Complex I Assembly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Loss of the ND2-module assembly factor TMEM126B compromises complex I biogenesis; untagged TMEM126B rescues assembly in TMEM126A-null cells.
    intermediate_mechanisms:
    - Reduced TMEM126B-dependent ND2-module biogenesis
- name: Impaired Complex I Assembly
  description: 'TMEM126A loss reduces assembled respiratory complex I. The 2021 HEK293T study found transient association with newly synthesized ND4 and slower ND4 labeling without faster turnover of the labeled pool, supporting an early biogenesis role. A 2024 HEK293 study instead attributed its complex I defect to secondary TMEM126B loss: untagged TMEM126B rescued assembly and activity, whereas C-terminally FLAG-tagged TMEM126B did not. These findings qualify the earlier tagged-paralog rescue experiment and do not establish unconditional non-interchangeability.'
  biological_scale: MOLECULAR
  biological_processes:

discussions:
- discussion_id: opa7_retinal_ganglion_cell_selectivity
  kind: KNOWLEDGE_GAP
  prompt: Which TMEM126A-dependent biochemical defects explain retinal ganglion-cell vulnerability and the variable extraocular involvement?
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell Degeneration
  rationale: Knockout cell models establish defects in complex I biogenesis and mitochondrial nascent-protein quality control, but neither system reproduces retinal ganglion-cell selectivity. Untagged TMEM126B rescues complex I without correcting nascent-protein loss, separating two candidate contributors. Founding patient fibroblasts showed normal respiratory-chain function in one patient and partial complex I deficiency in another. Tissue, allele and culture context therefore matter when relating biochemical findings to optic, auditory and peripheral neuropathy.
  notes: Patient-derived retinal ganglion-cell systems with allele-specific rescue could test which biochemical outcomes track neuronal injury. The cited human-cell knockout experiments establish molecular function but do not demonstrate retinal degeneration.
- discussion_id: opa7_syndromic_tail_variable_expressivity
  kind: OPEN_QUESTION
  prompt: Are the auditory and peripheral neuropathies part of OPA7, or do they mark a distinct allele-dependent syndromic form?
  attaches_to:
  - phenotypes#Abnormal auditory evoked potentials
  - phenotypes#Peripheral axonal neuropathy
  rationale: Auditory neuropathy was identified in asymptomatic Algerian siblings, and mild bilateral sensorineural hearing loss was subsequently detected in an Italian missense case. Peripheral neuropathy occurred in one Moroccan proband but not his affected siblings with the same genotype. A founding patient had hypertrophic cardiomyopathy. Incomplete and uneven assessment, variable expressivity and coincidental findings remain possible; the current evidence does not establish separate allele-defined syndromes.
  notes: Systematic audiology, neurological examination and appropriate cardiac assessment across molecularly characterized cases would clarify the extraocular spectrum. No single frequency estimate is supported by these differently investigated families.
- discussion_id: opa7_nd4_and_oxa1l_models
  kind: OPEN_QUESTION
  prompt: How do ND4-associated early assembly and OXA1L-dependent quality control contribute to the same disease?
  attaches_to:
  - pathophysiology#Impaired Complex I Assembly
  - pathophysiology#Loss of Nascent Mitochondrial Polypeptides
  rationale: The 2021 study found selective slower ND4 labeling without increased turnover of the labeled pool. The 2024 study found broader YME1L-dependent loss of nascent products and secondary TMEM126B depletion. Differences in cell background, perturbation and assay timing may contribute, but have not been resolved by a direct comparison. The 2024 untagged rescue specifically qualifies the earlier negative result obtained with tagged TMEM126B.
  evidence:
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The expression of the untagged TMEM126B in TMEM126A−/− cells fully rescued the complex I defect as assessed by activity measurement and BN-PAGE
    explanation: Untagged TMEM126B restores the complex I phenotype in this model; tagged TMEM126B failed, and neither form restored nascent mitochondrial translation products.
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: translation products were fully recovered to WT levels upon additional depletion of YME1L
    explanation: YME1L codepletion restores the labeled products, supporting degradation rather than a primary global translation defect as the explanation for their lower abundance.
- discussion_id: opa7_heterozygous_lhon_modifier
  kind: OPEN_QUESTION
  prompt: Does heterozygous TMEM126A variation modify LHON expression?
  attaches_to:
  - genetic#TMEM126A
  rationale: The 2020 Chinese series described an affected individual carrying both maternally inherited m.11778G>A and paternal heterozygous p.Arg55Ter, with unaffected paternal carriers and milder disease in the mother. This does not establish dominant OPA7 or a modifier effect, and should not be pooled with biallelic OPA7 cases.
  evidence:
  - reference: PMID:32855858
    reference_title: Mutation Screening of mtDNA Combined Targeted Exon Sequencing in a Cohort With Suspected Hereditary Optic Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The effect of the coexistence of mtDNA variants (m.11778G>A) and TMEM126A heterozygous variants (c.163C>T, p.Arg55Ter) on clinical manifestation is unknown, and its underlying mechanism remains to be explored.
    explanation: The authors explicitly leave the modifier question unresolved.
notes: Disease severity, onset and extraocular involvement vary between families and within a shared genotype. Lack of reported hearing symptoms is not equivalent to normal electrophysiology. Cellular complex I defects establish a molecular function for TMEM126A but do not alone explain the tissue selectivity or predict the functional effect of every human variant.

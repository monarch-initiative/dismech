    snippet: These VEP and pattern ERG abnormalities are consistent with bilateral retinal ganglion cell/optic nerve dysfunction.
    explanation: Combined electrophysiological findings directly support ganglion-cell/optic-nerve dysfunction in these patients, while full-field ERGs were normal.
  - reference: PMID:36155660
    reference_title: 'Understanding the molecular basis and pathogenesis of hereditary optic neuropathies: towards improved diagnosis and management.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: A unifying feature in the pathophysiology of these disorders appears to involve mitochondrial dysfunction, suggesting that the retinal ganglion cells and their axons are especially susceptible to perturbations in mitochondrial homoeostasis.
    explanation: The selectivity argument, stated across the hereditary optic neuropathies as a class rather than for TMEM126A. Marked INDIRECT and REVIEW_SYNTHESIS because it is a review's synthesis and because applying it here is an inference the source does not make about this gene.
  - reference: PMID:36317462
    reference_title: The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Hereditary optic neuropathies are caused by the degeneration of retinal ganglion cells whose axons form the optic nerves
    explanation: Establishes that retinal ganglion cell degeneration is the lesion underlying this disease class. Marked BACKGROUND because the sentence is the cohort study's framing of established pathology rather than one of its own results, and INDIRECT because it is about the class.
phenotypes:
- category: Ophthalmologic
  name: Optic atrophy
  description: Bilateral optic atrophy with temporal or diffuse optic disc pallor, the defining feature. Onset is typically in childhood, sometimes apparent from birth, occasionally not until adolescence.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: PMID:20405026
    reference_title: Nonsense mutation in TMEM126A causing autosomal recessive optic atrophy and auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fundus examination revealed marked bilateral temporal optic nerve pallor in both patients with otherwise normal retinal findings
    explanation: Direct examination established bilateral optic atrophy in the affected siblings.
- category: Ophthalmologic
  name: Reduced visual acuity
  description: Visual acuity varies substantially between and within families. Two Algerian siblings had poor vision from birth with reported progression. In a Moroccan family, the proband had abrupt severe loss at age 16 that did not subsequently progress, while his siblings had milder, slowly progressive childhood visual impairment.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:20405026
    reference_title: Nonsense mutation in TMEM126A causing autosomal recessive optic atrophy and auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: both affected subjects had poor vision from birth and complained of progressive visual loss over time
    explanation: Documents both the congenital onset and the progression in the two affected siblings.
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast with the proband, II:1, for which the disease occurred abruptly and the visual loss was severe and did not progress, the disease progressed slowly in the two siblings.
    explanation: The Moroccan proband remained stable after abrupt severe visual loss, contrasting with slowly progressive disease in his siblings.
- category: Ophthalmologic

name: Autosomal Recessive Optic Atrophy OPA7 Type
category: Mendelian
creation_date: "2026-09-14T00:00:00Z"
synonyms:
- OPA7
- TMEM126A-related optic atrophy
- autosomal recessive optic atrophy, OPA7
- nonsyndromic autosomal recessive optic atrophy
description: >-
  OPA7 is an ultra-rare, early-onset, bilateral progressive optic neuropathy caused by
  biallelic loss-of-function variants in TMEM126A. TMEM126A was the first gene identified
  for nonsyndromic autosomal recessive optic atrophy, a condition whose very existence was
  disputed until the OPA6 and OPA7 loci were mapped.

  **The mechanism was worked out backwards, and the order matters for how the evidence
  reads.** The gene was found in 2009 by homozygosity mapping in a consanguineous Algerian
  family, and the paper could say only that TMEM126A encodes a transmembrane mitochondrial
  protein of unknown function. The function arrived twelve years later: two independent 2021
  studies established that TMEM126A is an assembly factor for the **ND4 distal membrane
  module** of respiratory chain complex I, and that losing it produces an **isolated complex I
  deficiency**. So this entry's molecular nodes rest on recent cell biology while its genetic
  and clinical nodes rest on the older human genetics, and the two were connected only
  afterwards.

  **That makes OPA7 bioenergetically a sibling of LHON.** Leber hereditary optic neuropathy
  is caused by mtDNA-encoded complex I subunit mutations; OPA7 is caused by failure to
  assemble one of complex I's modules. Different genome, different lesion, same enzyme and
  the same downstream deficit. It is also a sibling of the nuclear complex I deficiency
  disorders, and a curator coming from either direction should notice that this disease
  presents as isolated optic atrophy rather than as an infantile encephalopathy. That is the
  interesting part, not an inconsistency to explain away.

  **Retinal ganglion cell selectivity is the unexplained step.** Complex I is needed in every
  cell. What the literature offers is an observation across the hereditary optic
  neuropathies, that retinal ganglion cells and their axons appear especially susceptible to
  perturbed mitochondrial homeostasis, rather than a mechanism specific to TMEM126A. This
  entry records that as the shared explanation it is, not as something demonstrated here.

  The recurrent Maghrebian founder allele c.163C>T p.Arg55* dominates the reported
  population, with a single ancestral origin confirmed by haplotype analysis; two later
  non-Maghreb alleles broadened the spectrum.
disease_term:
  preferred_term: autosomal recessive optic atrophy, OPA7 type
  term:

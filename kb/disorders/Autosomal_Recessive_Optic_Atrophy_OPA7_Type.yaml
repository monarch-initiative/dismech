    description: Reduced abundance of assembled enzyme lowers measured complex I activity, although residual active enzyme remains.
  evidence:
  - reference: PMID:33879611
    reference_title: Optic atrophy-associated TMEM126A is an assembly factor for the ND4-module of mitochondrial complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pulse-labeling interaction studies reveal that TMEM126A associates with the newly synthesized mitochondrial DNA (mtDNA)-encoded ND4 subunit of complex I. Our findings indicate that TMEM126A is involved in the assembly of the ND4 distal membrane module of complex I.
    explanation: The direct demonstration of what this node claims, by pulse-labelling and interaction studies in edited cells.
  - reference: PMID:33879611
    reference_title: Optic atrophy-associated TMEM126A is an assembly factor for the ND4-module of mitochondrial complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we find that the function of TMEM126A is distinct from its paralogue TMEM126B, which acts in assembly of the ND2-module of complex I
    explanation: The 2021 study assigned distinct module-associated roles. Its negative cross-rescue used C-terminally FLAG-tagged TMEM126B; the 2024 untagged rescue shows why this does not prove that TMEM126B cannot restore complex I.
  - reference: PMID:33882309
    reference_title: NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The process of degradation of the complex occurs in a hierarchical and modular fashion in which the ND4 module remains stable and bound to TMEM126A.
    explanation: NDUFS3 repression identified TMEM126A bound to an ND4-containing intermediate. The same study also directly examined TMEM126A-knockout HAP1 cells, which had reduced complex I assembly and activity.
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The expression of the untagged TMEM126B in TMEM126A−/− cells fully rescued the complex I defect as assessed by activity measurement and BN-PAGE
    explanation: Untagged TMEM126B restores the complex I phenotype in this model; tagged TMEM126B failed, and neither form restored nascent mitochondrial translation products.
- name: Complex I Deficiency
  description: TMEM126A-deficient HEK293T and HAP1 cells show reduced complex I assembly and activity, with residual active enzyme. Other respiratory complexes were relatively preserved in the 2021 models, whereas the 2024 HEK293 experiments also detected smaller or clone-dependent effects on other OXPHOS complexes. In HAP1 cells, basal respiration and substrate-driven ATP synthesis were preserved, but maximal respiratory capacity and viability under galactose stress were reduced. Patient fibroblast measurements were discordant in the founding families, and these cellular results do not establish uniform ATP depletion in retinal ganglion cells.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The step from a ubiquitous enzyme deficiency to a cell-type-restricted degeneration is exactly what is not explained for this disease, so the intermediates are recorded as unknown rather than asserted.
  evidence:
  - reference: PMID:33879611
    reference_title: Optic atrophy-associated TMEM126A is an assembly factor for the ND4-module of mitochondrial complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we find that loss of TMEM126A results in an isolated complex I deficiency and that TMEM126A interacts with a number of complex I subunits and assembly factors
    explanation: An isolated complex I defect was observed in this 2021 cell system. The 2024 study reports broader, smaller or clone-dependent effects, so isolated deficiency is not a universal property of TMEM126A loss.
  - reference: PMID:33882309
    reference_title: NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, ATP synthesis rates driven by CI and CII substrates were not affected by the isolated CI deficiency induced by the lack of TMEM126A
    explanation: Direct TMEM126A-knockout HAP1 experiments show that reduced complex I activity need not lower measured ATP synthesis under these conditions.
  - reference: PMID:38199007
    reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational quality control in mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In conclusion, loss of TMEM126A affects complex I and complex V in mitochondria.
    explanation: Complex I was most strongly affected; complex V reduction depended on the knockout clone.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2667974/
    reference_title: TMEM126A, Encoding a Mitochondrial Protein, Is Mutated in Autosomal-Recessive Nonsyndromic Optic Atrophy - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: showed normal respiratory chain function in patient III6 - family 1 but partial deficiency of Complex I in patient V1 - family 2
    explanation: Patient-derived fibroblasts did not show a uniform respiratory-chain phenotype despite the shared founder allele.
- name: Retinal Ganglion Cell Degeneration
  description: Retinal ganglion-cell and optic-nerve dysfunction is directly supported by pattern ERG and VEP abnormalities in affected siblings. OCT thinning and optic disc pallor support structural loss, although histological cell counts were not performed. The selective vulnerability of these cells to TMEM126A deficiency remains unresolved; general mitochondrial optic-neuropathy models provide context rather than a gene-specific explanation.

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic TMEM126A variants, with homozygosity predominating because most reported
    families are consanguineous and carry the Maghrebian founder allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19327736
    reference_title: "TMEM126A, encoding a mitochondrial protein, is mutated in autosomal-recessive nonsyndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using an approach of whole-genome homozygosity mapping and positional cloning, we have identified the first gene, to our knowledge, responsible for this condition, TMEM126A, in a large multiplex inbred Algerian family and subsequently in three other families originating from the Maghreb."
    explanation: >-
      Homozygosity mapping in consanguineous multiplex families is the method and the
      argument for recessive inheritance simultaneously.
genetic:
- name: TMEM126A
  gene_term:
    preferred_term: TMEM126A
    term:
      id: hgnc:25382
      label: TMEM126A
  relationship_type: CAUSATIVE
  notes: >-
    Encodes a mitochondrial inner membrane protein, later shown to be a complex I assembly
    factor for the ND4 distal membrane module. The recurrent founder allele is the nonsense
    variant c.163C>T p.Arg55*, shared by all early Maghrebian families on a single ancestral
    haplotype. Two later non-Maghreb alleles are a homozygous splice-donor variant c.86+2T>C
    in a Turkish patient and a homozygous missense p.Ser36Leu in Iraqi siblings. TMEM126A is
    among the top ten nuclear genes accounting for hereditary optic neuropathy diagnoses.
  evidence:
  - reference: PMID:30961538
    reference_title: "Novel likely pathogenic variants in TMEM126A identified in non-syndromic autosomal recessive optic atrophy: two case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, all reports of pathogenic TMEM126A variants are from affected individuals of Maghrebian origin, who all carry an identical nonsense variant. Here we report two novel variants in the TMEM126A gene from non-Maghreb individuals, both found in affected individuals with an arOA phenotype."
    explanation: >-
      States both the founder-allele dominance of the earlier literature and the two alleles
      that broke it, which is the shape of the reported mutation spectrum.
  - reference: PMID:36317462
    reference_title: The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified top 10 nuclear genes included OPA1, WFS1, ACO2, SPG7, MFN2, AFG3L2, RTN4IP1, TMEM126A, NR2F1 and FDXR."
    explanation: >-
      Places TMEM126A among the ten nuclear genes that together account for 96% of autosomal
      optic neuropathy diagnoses in a 2,186-proband cohort, which is the best available
      measure of how often this gene is the answer.
pathophysiology:
- name: TMEM126A Loss of Function
  description: >-
    Biallelic TMEM126A variants remove a mitochondrial inner membrane protein. The founder
    allele is a nonsense variant and the second reported allele is a splice-donor change
    producing an exon-skipped functional null, so the reported spectrum is dominated by
    complete loss rather than by hypomorphic change.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Failure of ND4 Module Assembly into Complex I
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23500070
    reference_title: TMEM126A is a mitochondrial located mRNA (MLR) protein of the mitochondrial inner membrane.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TMEM126A mRNAs are strongly enriched in the vicinity of mitochondria and encode an inner mitochondrial membrane associated cristae protein."
    explanation: >-
      Establishes the inner-membrane localization this node binds, by cellular fractionation,
      proteolysis assays and electron microscopy. The 2009 identification paper below could
      say only "mitochondrial protein of unknown function", so the localization is cited to
      the paper that measured it rather than to the one that named the gene.
  - reference: PMID:19327736
    reference_title: "TMEM126A, encoding a mitochondrial protein, is mutated in autosomal-recessive nonsyndromic optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TMEM126A is conserved in higher eukaryotes and encodes a transmembrane mitochondrial protein of unknown function, supporting the view that mitochondrial dysfunction may be a hallmark of inherited optic neuropathies including isolated autosomal-recessive forms."
    explanation: >-
      The original identification, quoted with its own admission that the protein's function
      was unknown at the time. That matters for reading this entry: the mechanism below was
      established twelve years later and is not what this paper claimed.
- name: Failure of ND4 Module Assembly into Complex I
  description: >-
    TMEM126A associates with the newly synthesised mtDNA-encoded ND4 subunit and is needed to
    build the ND4 distal membrane module of complex I. Its paralogue TMEM126B does the same
    job for the ND2 module, and the two are not interchangeable, which is why losing one
    produces a specific assembly failure rather than a general one.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33879611
    reference_title: Optic atrophy-associated TMEM126A is an assembly factor for the ND4-module of mitochondrial complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pulse-labeling interaction studies reveal that TMEM126A associates with the newly synthesized mitochondrial DNA (mtDNA)-encoded ND4 subunit of complex I. Our findings indicate that TMEM126A is involved in the assembly of the ND4 distal membrane module of complex I."
    explanation: The direct demonstration of what this node claims, by pulse-labelling and interaction studies in edited cells.
  - reference: PMID:33879611
    reference_title: Optic atrophy-associated TMEM126A is an assembly factor for the ND4-module of mitochondrial complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we find that the function of TMEM126A is distinct from its paralogue TMEM126B, which acts in assembly of the ND2-module of complex I"
    explanation: >-
      Establishes that the paralogue does not substitute, which is what makes the loss of one
      assembly factor sufficient to cause disease.
  - reference: PMID:33882309
    reference_title: NDUFS3 depletion permits complex I maturation and reveals TMEM126A/OPA7 as an assembly factor binding the ND4-module intermediate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The process of degradation of the complex occurs in a hierarchical and modular fashion in which the ND4 module remains stable and bound to TMEM126A."
    explanation: >-
      The second of the two independent 2021 studies, reaching the same conclusion from the
      opposite direction: rather than deleting TMEM126A, it watches complex I disassemble as
      a core subunit is depleted and finds TMEM126A still bound to the ND4 module. Two
      designs converging on one role is why the description calls the assignment established.
- name: Isolated Complex I Deficiency
  description: >-
    Complex I activity falls while the other respiratory chain complexes are spared. This is
    the same biochemical endpoint as the nuclear complex I deficiency disorders and as LHON,
    reached from a different direction, and it is where the shared bioenergetic reading of
    the hereditary optic neuropathies starts.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from a ubiquitous enzyme deficiency to a cell-type-restricted degeneration is
      exactly what is not explained for this disease, so the intermediates are recorded as
      unknown rather than asserted.
  evidence:
  - reference: PMID:33879611
    reference_title: Optic atrophy-associated TMEM126A is an assembly factor for the ND4-module of mitochondrial complex I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we find that loss of TMEM126A results in an isolated complex I deficiency and that TMEM126A interacts with a number of complex I subunits and assembly factors"
    explanation: States the isolated character of the deficiency, which distinguishes it from a general respiratory chain defect.
- name: Retinal Ganglion Cell Degeneration
  description: >-
    Retinal ganglion cells and the optic nerve axons they project degenerate, producing the
    optic atrophy. Why these cells and not others is not established for TMEM126A
    specifically; the available explanation is the general one offered across the hereditary
    optic neuropathies, that retinal ganglion cells are especially susceptible to
    perturbations of mitochondrial homeostasis. See `discussions`.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  downstream:
  - target: Optic atrophy
    causal_link_type: DIRECT
    description: >-
      Optic atrophy is the visible consequence of retinal ganglion cell and axon loss; the
      two are the same event seen histologically and on fundoscopy.
  - target: Reduced visual acuity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acuity loss follows from degeneration of the papillomacular bundle that carries central
      vision, which is the intermediate step.
  - target: Central scotoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Same papillomacular-bundle intermediate, measured as a field defect rather than as acuity.
  - target: Color vision defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dyschromatopsia follows from loss of the same central axon population, and is
      characteristically severe in this disorder.
  evidence:
  - reference: PMID:36155660
    reference_title: "Understanding the molecular basis and pathogenesis of hereditary optic neuropathies: towards improved diagnosis and management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A unifying feature in the pathophysiology of these disorders appears to involve mitochondrial dysfunction, suggesting that the retinal ganglion cells and their axons are especially susceptible to perturbations in mitochondrial homoeostasis."
    explanation: >-
      The selectivity argument, stated across the hereditary optic neuropathies as a class
      rather than for TMEM126A. Marked INDIRECT and REVIEW_SYNTHESIS because it is a review's
      synthesis and because applying it here is an inference the source does not make about
      this gene.
  - reference: PMID:36317462
    reference_title: The top 10 most frequently involved genes in hereditary optic neuropathies in 2186 probands.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hereditary optic neuropathies are caused by the degeneration of retinal ganglion cells whose axons form the optic nerves"
    explanation: >-
      Establishes that retinal ganglion cell degeneration is the lesion underlying this
      disease class. Marked BACKGROUND because the sentence is the cohort study's framing of
      established pathology rather than one of its own results, and INDIRECT because it is
      about the class.
phenotypes:
- category: Ophthalmologic
  name: Optic atrophy
  description: >-
    Bilateral optic atrophy with temporal or diffuse optic disc pallor, the defining feature.
    Onset is typically in childhood, sometimes apparent from birth, occasionally not until
    adolescence.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: PMID:20405026
    reference_title: Nonsense mutation in TMEM126A causing autosomal recessive optic atrophy and auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To define the phenotype and elucidate the molecular basis for an autosomal recessively inherited optic atrophy and auditory neuropathy in a consanguineous family with two affected children."
    explanation: Names optic atrophy as the phenotype under study in a molecularly confirmed family.
- category: Ophthalmologic
  name: Reduced visual acuity
  description: >-
    Reduced visual acuity, progressive over time. In the family described in detail, both
    affected siblings had poor vision from birth.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:20405026
    reference_title: Nonsense mutation in TMEM126A causing autosomal recessive optic atrophy and auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both affected subjects had poor vision from birth and complained of progressive visual loss over time"
    explanation: Documents both the congenital onset and the progression in the two affected siblings.
- category: Ophthalmologic
  name: Optic disc pallor
  description: >-
    Bilateral optic disc pallor, temporal or diffuse. Described as the hallmark clinical sign
    of this disease group.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Optic disc pallor
    term:
      id: HP:0000543
      label: Optic disc pallor
  evidence:
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hallmark clinical sign is optic disc pallor."
    explanation: The authors' own designation of the cardinal examination finding.
- category: Ophthalmologic
  name: Central scotoma
  description: >-
    Central or centrocecal scotoma, absolute in the severely affected proband and relative in
    the papillomacular area in his more mildly affected siblings.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Central scotoma
    term:
      id: HP:0000603
      label: Central scotoma
  evidence:
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His visual acuity was <20/400 bilaterally (at age 16), the optic discs showed bilateral pallor (Figure 2), the patient had an absolute central scotoma bilaterally (Figure 3A) and severe dyschromatopsia, the standard electroretinogram was normal, and OCT showed thinning of all RNFL bundles (Figure 4A)."
    explanation: >-
      Records the absolute bilateral central scotoma in the proband, alongside the acuity,
      disc pallor and dyschromatopsia from the same examination.
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "relative scotoma in the papillomacular area bilaterally"
    explanation: >-
      The milder siblings' field defect, which locates the lesion in the papillomacular bundle
      and shows the defect grades with severity rather than being all-or-none.
- category: Ophthalmologic
  name: Color vision defect
  description: >-
    Dyschromatopsia, characteristically severe, and one of the features distinguishing the
    recessive optic atrophies from OPA1-linked dominant disease.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: severe dyschromatopsia
    term:
      id: HP:0000551
      label: Color vision defect
  evidence:
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 16, he presented with sudden bilateral loss of visual acuity and dyschromatopsia."
    explanation: Records the dyschromatopsia at presentation, alongside the acuity loss.
  - reference: PMID:22815638
    reference_title: TMEM126A mutation in a Moroccan family with autosomal recessive optic atrophy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND

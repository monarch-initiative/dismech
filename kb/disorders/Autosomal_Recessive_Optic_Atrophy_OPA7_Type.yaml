    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The positive diagnosis rate in individuals referred for autosomal dominant or recessive optic neuropathies was 27% (451/1680 index cases), with 10 genes accounting together for 96% of this cohort.
    explanation: The referral cohort supports a broad molecular diagnostic approach. Its 27% yield and ten-gene aggregate apply to that cohort, not specifically to OPA7.

  evidence:
  - reference: PMID:36153118
    reference_title: Exosome-associated mitochondrial DNA from patients with myalgic encephalomyelitis/chronic fatigue syndrome stimulates human microglia to release IL-1β.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we show that mitochondrial DNA (mtDNA) associated with serum exosomes, is increased in ME/CFS patients only after exercise.
    explanation: The publication reports paired patient exercise-associated change; an equivalently exercised healthy-control series is not demonstrated.
  - reference: PMID:36153118
    reference_title: Exosome-associated mitochondrial DNA from patients with myalgic encephalomyelitis/chronic fatigue syndrome stimulates human microglia to release IL-1β.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, exosomes isolated from patients with ME/CFS stimulate significant release of IL-1β from cultured human microglia.
    explanation: Patient serum vesicle preparations have in vitro bioactivity. This does not establish mtDNA necessity, muscle origin, BBB passage or human brain inflammation.
- discussion_id: gap_mecfs_genetic_architecture
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which ME/CFS susceptibility variants act through which tissues and effector genes?
  rationale: The 2025 DecodeME preprint reports eight associated loci in up to 15,579 cases and 259,909 ancestry-matched controls. It is not peer reviewed, and nearby genes are not proven effector genes. HLA and GWAS findings support polygenic susceptibility without establishing Mendelian inheritance, a clinical test or this specific perfusion-to-PEM pathway.
  evidence:
  - reference: DOI:10.1101/2025.08.06.25333109
    reference_title: Initial findings from the DecodeME genome-wide association study of myalgic encephalomyelitis/chronic fatigue syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We recruited 21,620 ME/CFS cases and performed genome-wide association studies (GWAS) for up to 15,579 cases and 259,909 population controls with European genetic ancestry.
    explanation: DecodeME is a preprint; locus associations do not identify causal effector genes.
- discussion_id: gap_mecfs_upstream_alternatives
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Do receptor autoantibodies, microbial metabolites or central regulatory abnormalities initiate or maintain the observed neurovascular and immune states?
  rationale: These hypotheses may complement rather than exclude the perfusion model. Receptor-antibody concentration associations do not establish receptor agonism or causality; microbial metabolite associations do not prove barrier leakage. An older central activation study provides an alternative physiological direction. Negative rituximab evidence and extracellular rather than intravascular muscle amyloid deposits constrain overly simple autoimmune and microclot models.
  evidence:
  - reference: PMID:33889154
    reference_title: Delineating the Association Between Soluble CD26 and Autoantibodies Against G-Protein Coupled Receptors, Immunological and Cardiovascular Parameters Identifies Distinct Patterns in Post-Infectious vs. Non-Infection-Triggered Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: could not confirm diagnostic suitability
    explanation: sCD26 and autoantibody correlations were subgroup dependent and did not establish a diagnostic assay or receptor dysfunction.
  - reference: PMID:8423875
    reference_title: Central basis of muscle fatigue in chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The results indicate that patients with CFS have (1) normal fatigability and metabolism at both the intracellular and systemic levels, (2) normal muscle membrane function and excitation-contraction coupling, and (3) an inability to fully activate skeletal muscle during intense, sustained exercise.
    explanation: This older isometric-muscle study supports altered central activation in its cohort, not a psychiatric explanation or a universal exclusion of peripheral pathology.
  - reference: PMID:38177128
    reference_title: Muscle abnormalities worsen after post-exertional malaise in long COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that amyloid-containing deposits are not present within capillaries.
    explanation: The 25-person long-COVID PEM cohort and 21 recovered controls had paired biopsies. Deposits were extravascular; this contradicts equating the observation with occlusive muscle microclots.
  - reference: PMID:36758522
    reference_title: Deficient butyrate-producing capacity in the gut microbiome is associated with bacterial network disturbances and fatigue symptoms in ME/CFS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Functional metagenomics, qPCR, and metabolomics of fecal short-chain fatty acids confirmed a deficient microbial capacity for butyrate synthesis.
    explanation: Primary multi-omic study of 106 cases and 91 controls; lower butyrate-associated capacity is not proof of intestinal leakage or a cause of PEM.
  - reference: PMID:36758521
    reference_title: Multi-'omics of gut microbiome-host interactions in short- and long-term myalgic encephalomyelitis/chronic fatigue syndrome patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Short-term patients showed significant microbial dysbiosis, while long-term patients had largely resolved microbial dysbiosis but had metabolic and clinical aberrations.
    explanation: Cross-sectional illness-duration cohorts differ; this is not a within-person longitudinal demonstration of microbial recovery.
notes: 'Clinical diagnosis and supportive management are established; disease-wide causal mechanisms and biomarkers remain under investigation. Severity grades are not validated molecular subtypes. No disease-specific GeneReviews chapter was identified; clinical coverage was checked against NICE NG206 and CDC diagnostic guidance. The OpenScientist assessment distinguishes retained findings, methodological limitations, missed pre-report studies and later evidence. Literature and registry review date: 2026-09-04.'

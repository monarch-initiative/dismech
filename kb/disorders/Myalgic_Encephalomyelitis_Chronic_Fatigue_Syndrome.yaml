- name: Endothelial Vasodilator Dysfunction
  description: Reduced brachial flow-mediated dilation and skin reactive hyperemia indicate vascular dysfunction in some cohorts. These measurements do not directly demonstrate capillary obstruction or muscle ischemia.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36730360
    reference_title: Endothelial dysfunction in ME/CFS patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ME/CFS patients had markedly reduced FMD compared to healthy controls at baseline (5.1% vs. 8.2%, p< 0.0001, adjusted for arterial diameter and sex), and significantly lower microvascular regulation measured by PORH than healthy controls (1354 PU vs. 2208 PU, p = 0.002).
    explanation: Sandvik and colleagues studied 39 RituxME participants; macrovascular FMD and skin PORH are distinct from direct exercising-muscle perfusion. The two measures did not correlate.
  downstream:
  - target: Skeletal Muscle Bioenergetic Disturbance
    description: Possible impaired delivery to exercising muscle; the FMD/PORH study did not establish this causal bridge.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

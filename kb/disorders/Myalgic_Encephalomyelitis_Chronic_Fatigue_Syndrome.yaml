- name: Proposed Delayed Immunometabolic Amplification
  description: The integrated hypothesis proposes that exertion-related metabolic or injury signals produce delayed immune and central symptom amplification. Specific platelet, monocyte and CSF associations exist, but a consistent post-exercise cytokine cascade and peripheral-to-central direction are not established.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:38232699
    reference_title: Single-cell transcriptomics of the immune system in ME/CFS at baseline and following symptom provocation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Comparing the transcriptome at baseline and postexercise challenge, we discover patterns indicative of improper platelet activation in patients, with minimal changes elsewhere in the immune system.
    explanation: Exercise-associated platelet signatures do not establish a generalized cytokine cascade or occlusive microthrombosis.
  - reference: PMID:39941050
    reference_title: Exertional Exhaustion (Post-Exertional Malaise, PEM) Evaluated by the Effects of Exercise on Cerebrospinal Fluid Metabolomics-Lipidomics and Serine Pathway in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: two independent cohorts of subjects who had lumbar puncture without exercise (non-exercise group) or after the second of two bouts of submaximal exercise performed on two consecutive days
    explanation: The CSF comparison is between independent cohorts, not paired lumbar punctures or direct muscle-to-CSF tracing.
  - reference: PMID:10226888
    reference_title: Immunological response in chronic fatigue syndrome following a graded exercise test to exhaustion.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: No group differences were seen for any of the immune variables at baseline or after exercise
    explanation: Twenty female cases and fourteen sedentary controls had serial sampling through 24 hours despite increased patient fatigue. This limits a generalized proinflammatory cytokine bridge; it does not exclude every immune mechanism.
  - reference: PMID:24027260
    reference_title: Exercise and sleep deprivation do not change cytokine expression levels in patients with chronic fatigue syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: We found that these environmental manipulations did not produce clinically significant upregulation of proinflammatory cytokines.
    explanation: Repeated sampling after exercise and sleep deprivation did not support a generalized proinflammatory cytokine response. This limits a generalized proinflammatory cytokine bridge; it does not exclude every immune mechanism.
  - reference: PMID:39240417
    reference_title: 'Towards an understanding of physical activity-induced post-exertional malaise: Insights into microvascular alterations and immunometabolic interactions in post-COVID condition and myalgic encephalomyelitis/chronic fatigue syndrome.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The accumulation of molecules such as lactate, reactive oxygen species or prostaglandins might trigger local and systemic immune activation. Subsequent intensification of bioenergetic inflexibilities, muscular ionic disturbances and modulation of central nervous system functions can lead to an exacerbation of existing pathologies and symptoms.
    explanation: Narrative review explicitly proposes the integrated metabolic/immune/CNS sequence; it is not direct causal validation.
  downstream:
  - target: Post-Exertional Malaise
    description: Hypothesized delayed amplification of symptoms; clinical PEM is established while this molecular sequence remains unproven.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

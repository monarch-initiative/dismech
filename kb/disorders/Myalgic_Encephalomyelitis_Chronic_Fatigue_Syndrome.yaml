- name: Classical Monocyte State Dysregulation
  description: Single-cell profiles indicate altered differentiation and migration programs at baseline, including heterogeneous cell states within patients. Actual tissue invasion is not demonstrated by these data.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:38232699
    reference_title: Single-cell transcriptomics of the immune system in ME/CFS at baseline and following symptom provocation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At baseline, ME/CFS patients display classical monocyte dysregulation suggestive of inappropriate differentiation and migration to tissue.
    explanation: Single-cell transcriptional association; actual tissue migration and its causal contribution to PEM were not directly measured.
  cell_types:

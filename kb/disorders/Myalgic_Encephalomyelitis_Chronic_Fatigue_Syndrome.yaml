    term:
      id: GO:0006914
      label: autophagy
- name: Gut Microbial Butyrate-Related Dysbiosis
  description: Primary stool metagenomics and metabolomics show reduced butyrate-related capacity and altered microbial composition in some cohorts. Illness duration, diet, IBS and medication can influence results. Causality, epithelial barrier leakage and a gut-to-immune-to-PEM sequence remain unproven.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36758522
    reference_title: Deficient butyrate-producing capacity in the gut microbiome is associated with bacterial network disturbances and fatigue symptoms in ME/CFS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Functional metagenomics, qPCR, and metabolomics of fecal short-chain fatty acids confirmed a deficient microbial capacity for butyrate synthesis.
    explanation: Primary multi-omic study of 106 cases and 91 controls; lower butyrate-associated capacity is not proof of intestinal leakage or a cause of PEM.
  - reference: PMID:36758521
    reference_title: Multi-'omics of gut microbiome-host interactions in short- and long-term myalgic encephalomyelitis/chronic fatigue syndrome patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Short-term patients showed significant microbial dysbiosis, while long-term patients had largely resolved microbial dysbiosis but had metabolic and clinical aberrations.
    explanation: Cross-sectional illness-duration cohorts differ; this is not a within-person longitudinal demonstration of microbial recovery.
- name: Proposed Peripheral Vesicle-Microglial Signaling
  description: A 2022 study reports higher vesicle-associated serum mitochondrial DNA after exercise and microglial IL-1beta release after exposure to patient vesicle preparations. This supports a candidate peripheral inflammatory signal in vitro, without establishing which vesicle cargo is causal, a muscle source, blood-brain-barrier transport or an in vivo contribution to PEM. A matched healthy exercise series and independent donor-level bioactivity replication remain important.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:36153118
    reference_title: Exosome-associated mitochondrial DNA from patients with myalgic encephalomyelitis/chronic fatigue syndrome stimulates human microglia to release IL-1β.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we show that mitochondrial DNA (mtDNA) associated with serum exosomes, is increased in ME/CFS patients only after exercise.
    explanation: The publication reports paired patient exercise-associated change; an equivalently exercised healthy-control series is not demonstrated.
  - reference: PMID:36153118
    reference_title: Exosome-associated mitochondrial DNA from patients with myalgic encephalomyelitis/chronic fatigue syndrome stimulates human microglia to release IL-1β.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, exosomes isolated from patients with ME/CFS stimulate significant release of IL-1β from cultured human microglia.
    explanation: Patient serum vesicle preparations have in vitro bioactivity. This does not establish mtDNA necessity, muscle origin, BBB passage or human brain inflammation.
mechanistic_hypotheses:
- hypothesis_group_id: exertion_perfusion_muscle_immunometabolic_pem_model
  hypothesis_label: Exertion-Perfusion-Muscle Immunometabolic PEM Model
  status: EMERGING
  description: >-
    Exertion may expose neurovascular or muscle metabolic limitations in a subset of patients, followed
    by delayed immune and central amplification of symptoms. Low-flow preload failure, high-flow
    impaired extraction, tissue sodium changes and immune-state abnormalities are distinct observations.
    The ordering and necessity of the proposed links remain unresolved.
  notes: >-
    Retain EMERGING after source-level assessment of OpenScientist. Corrected its false absence of
    sodium MRI and acute hemodynamic intervention evidence, 50% small-fiber-neuropathy figure (31%
    in the cited cohort), review-as-primary EM attribution and cohort conflations. The 2024 EM study
    lacks healthy EM controls; the exercise-biopsy study is in long COVID and does not demonstrate
    intravascular microclots. A 2022 sodium MRI pilot measures mixed tissue sodium, not isolated
    intracellular sodium or calcium overload. Acute pyridostigmine improves exercise hemodynamics
    but does not establish durable PEM benefit. Positive and negative day-two CPET studies coexist.
    None of these findings proves an obligatory muscle-to-immune-to-CNS sequence or validated biological
    subtype boundaries.
  evidence:
  - reference: PMID:33577778
    reference_title: Insights From Invasive Cardiopulmonary Exercise Testing of Patients With Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results identify two types of peripheral neurovascular dysregulation that are biologically plausible contributors to ME/CFS exertional intolerance-depressed Qc from impaired venous return, and impaired peripheral oxygen extraction.
    explanation: 'Selected low-right-atrial-pressure cohort: low-flow impaired venous return and high-flow impaired extraction are separate physiological patterns, not one universal lesion.'
  - reference: PMID:36494667
    reference_title: Muscle sodium content in patients with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Baseline tissue sodium content was higher in all 5 lower leg muscle compartments in ME/CFS compared to controls.
    explanation: Six female cases and six matched controls underwent sodium MRI before and after three minutes of plantar flexion. The acquisition could not isolate intracellular from extracellular sodium.
  - reference: PMID:35526605
    reference_title: 'Neurovascular Dysregulation and Acute Exercise Intolerance in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome: A Randomized, Placebo-Controlled Trial of Pyridostigmine.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The peak Vo2 increased after pyridostigmine but decreased after placebo (13.3 ± 13.4 mL/min vs -40.2 ± 21.3 mL/min; P < .05).
    explanation: 'Randomized 45-person acute trial: 60 mg pyridostigmine between two iCPETs separated by 50 minutes improved the relative exercise response. This does not test delayed PEM or durable treatment benefit.'
  - reference: PMID:38338957
    reference_title: Functional and Morphological Differences of Muscle Mitochondria in Chronic Fatigue Syndrome and Post-COVID Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Due to the lack of an EM control group, the mean size and shape of CFS and PCS can only be compared between the respective syndromes.
    explanation: The direct 2024 study compared mitochondrial ultrastructure in 14 CFS and 14 PCS samples without healthy EM controls. OXPHOS used historical healthy controls; between-syndrome morphology does not prove calcium-mediated injury.
  - reference: PMID:9527150
    reference_title: Muscle fibre characteristics and lactate responses to exercise in chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No significant ultrastructural abnormalities were found.
    explanation: An older 105-case biopsy study examined 41 samples by EM; findings qualify a universal structural mitochondrial lesion.
  - reference: PMID:38965566
    reference_title: 'Cardiopulmonary and metabolic responses during a 2-day CPET in myalgic encephalomyelitis/chronic fatigue syndrome: translating reduced oxygen consumption to impairment status to treatment considerations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Abnormal post-exertional CPET responses persisted compared to CTL matched for aerobic capacity, indicating that fitness level does not predispose to exertion intolerance in ME/CFS.
    explanation: 'Canadian-criteria study: 84 cases and 71 sedentary controls, with 55 matched pairs; supports impaired recovery in this cohort.'
  - reference: PMID:42212259
    reference_title: Cardiopulmonary exercise test results do not change over two sequential days in patients with chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The data do not support using the 2-day CPET protocol to define PEM or disability.
    explanation: The 58-case and 25-control study required PEM and found no day-two VO2 decline. Absence of this physiological pattern does not exclude symptom-defined PEM or disability.
  - reference: PMID:10226888
    reference_title: Immunological response in chronic fatigue syndrome following a graded exercise test to exhaustion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No group differences were seen for any of the immune variables at baseline or after exercise
    explanation: Twenty female cases and fourteen sedentary controls had serial sampling through 24 hours despite increased patient fatigue.
  - reference: PMID:24027260
    reference_title: Exercise and sleep deprivation do not change cytokine expression levels in patients with chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that these environmental manipulations did not produce clinically significant upregulation of proinflammatory cytokines.
    explanation: Repeated sampling after exercise and sleep deprivation did not support a generalized proinflammatory cytokine response.
phenotypes:
- name: Post-Exertional Malaise
  category: Multisystem
  description: Disproportionate worsening after physical, cognitive, emotional or social activity, often delayed by hours or days and with prolonged recovery. Clinical PEM is not defined by a mandatory day-two VO2 fall.
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: has a prolonged recovery time that may last hours, days, weeks or longer.
    explanation: NICE clinical guidance describes this manifestation; frequency varies by case definition and severity.

- name: CD8 T-Cell Exhaustion-Associated State
  description: Transcription, chromatin accessibility and surface-marker data support an exhaustion-associated state in selected T-cell subsets. The causal antigen and clinical value of reversing this state remain unknown.
  mechanism_confidence: PROVISIONAL
  evidence:

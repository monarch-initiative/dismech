- name: Adaptive Immune Memory Dysregulation
  description: Naive and switched-memory B-cell shifts in a selected post-infectious cohort suggest altered immune history. Persistent antigen identity and a causal role in PEM are unproven; negative rituximab results limit simple therapeutic extrapolation.
  mechanism_confidence: PROVISIONAL
  evidence:

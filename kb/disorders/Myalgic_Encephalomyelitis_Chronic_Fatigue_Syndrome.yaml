name: Myalgic Encephalomyelitis/Chronic Fatigue Syndrome
creation_date: '2025-12-06T01:38:31Z'
description: >-
  ME/CFS is a chronic, fluctuating multisystem illness defined by substantial loss of previous function,
  post-exertional symptom exacerbation, unrefreshing sleep, and cognitive or orthostatic symptoms.
  Infection can precede onset, but no single cause, diagnostic biomarker or disease-modifying treatment
  is established. Neurovascular, immune, metabolic and central abnormalities vary by cohort; the
  integrated mechanism of delayed PEM remains unresolved.
category: Complex
parents:
- Neurological Disorder
- Immune Disorder
disease_term:
  preferred_term: myalgic encephalomyelitis
  term:
    id: MONDO:0005404
    label: myalgic encephalomeyelitis/chronic fatigue syndrome
synonyms:
- ME/CFS
- Chronic Fatigue Syndrome
- Systemic Exertion Intolerance Disease
pathophysiology:
- name: Small-Fiber Neuropathy
  description: Reduced epidermal small-fiber density occurs in a subset of selected patients. Autonomic small-fiber dysfunction could affect venous tone or distribution of muscle blood flow, but skin-fiber density does not directly establish either mechanism.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33577778
    reference_title: Insights From Invasive Cardiopulmonary Exercise Testing of Patients With Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among the 160 ME/CFS patient biopsies, 31% were consistent with SFN (epidermal innervation ≤5.0% of predicted; P < .0001). Denervation severity did not correlate with exertional measures.
    explanation: The ME/CFS biopsy proportion was 31%, not the report's approximately 50%; the latter is background POTS/fibromyalgia literature. A shunting mechanism is proposed rather than causally demonstrated.
  downstream:
  - target: Impaired Venous Return
    description: Proposed loss of effective venoconstriction; no correlation of biopsy severity with exercise physiology establishes this route.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

    reference_title: Muscle sodium content in patients with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Baseline tissue sodium content was higher in all 5 lower leg muscle compartments in ME/CFS compared to controls.
    explanation: Six female cases and six matched controls underwent sodium MRI before and after three minutes of plantar flexion. The acquisition could not isolate intracellular from extracellular sodium.
  downstream:
  - target: Skeletal Muscle Bioenergetic Disturbance
    description: Predicted calcium toxicity to myocytes and mitochondria; retain as a hypothetical link requiring compartment-specific measurement and perturbation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39727052
      reference_title: 'Key Pathophysiological Role of Skeletal Muscle Disturbance in Post COVID and Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS): Accumulated Evidence.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: we postulated that hypoperfusion and ischemia can result in excessive sodium and calcium overload in skeletal muscles of ME/CFS patients to cause mitochondrial damage.
      explanation: Explicit mechanistic hypothesis in a review; the MRI pilot does not directly demonstrate intracellular calcium toxicity.
    hypothesis_groups:

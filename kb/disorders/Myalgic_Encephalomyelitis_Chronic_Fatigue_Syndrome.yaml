- name: T-Cell Immunometabolic Dysfunction
  description: Resting T-cell glycolysis and CD8 mitochondrial membrane potential are reduced in patient-cell assays, with activation-dependent differences. This does not demonstrate a uniform defect in all tissues.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31830003
    reference_title: Myalgic encephalomyelitis/chronic fatigue syndrome patients exhibit altered T cell metabolism and cytokine associations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Both CD4+ and CD8+ T cells from patients with ME/CFS had reduced glycolysis at rest, whereas CD8+ T cells also had reduced glycolysis following activation.
    explanation: Primary patient-cell metabolism study with 53 cases and 45 controls; this does not establish universal mitochondrial respiratory failure.

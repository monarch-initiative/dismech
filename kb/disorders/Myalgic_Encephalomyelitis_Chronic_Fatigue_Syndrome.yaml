- name: Orthostatic Cerebral Hypoperfusion
  description: Orthostatic challenge produces disproportionate reductions in cerebral flow or flow velocity in specialty cohorts, including some patients with normal heart-rate and blood-pressure responses. Velocity and volumetric flow are different measurements.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:32140630
    reference_title: 'Cerebral blood flow is reduced in ME/CFS during head-up tilt testing even in the absence of hypotension or tachycardia: A quantitative, controlled study using Doppler echography.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During HUT, extracranial Doppler measurements demonstrate that CBF is reduced in ME/CFS patients with POTS, dOH, and even in those without HR/BP abnormalities.
    explanation: Specialty cohort of 429 cases and 44 controls; normal orthostatic heart rate and blood pressure do not exclude OI. Referral prevalence is not population prevalence.
  - reference: PMID:41576003
    reference_title: Shared autonomic phenotype of long COVID and myalgic encephalomyelitis/chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: reduced orthostatic CBFv (92%/88% in Long COVID/ME/CFS)
    explanation: This retrospective autonomic-referral cohort measures cerebral blood-flow velocity, not volumetric flow; it does not establish a muscle-to-brain causal pathway.
  downstream:

- name: Possible Neuroimmune Activation
  description: Small TSPO PET studies have conflicting findings. TSPO binding is not uniquely microglial activation, and neither generalized neuroinflammation nor a specific link from peripheral muscle signals is established.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:24665088
    reference_title: 'Neuroinflammation in Patients with Chronic Fatigue Syndrome/Myalgic Encephalomyelitis: An ¹¹C-(R)-PK11195 PET Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nine CFS/ME patients and 10 healthy controls underwent (11)C-(R)-PK11195 PET
    explanation: Small positive TSPO study; ligand binding is an indirect neuroimmune measure and does not uniquely identify activated microglia.
  - reference: PMID:34815320
    reference_title: No Signs of Neuroinflammation in Women With Chronic Fatigue Syndrome or Q Fever Fatigue Syndrome Using the TSPO Ligand [(11)C]-PK11195.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No statistically significant differences in BPND were found for patients with CFS or patients with QFS compared with HSs.
    explanation: Independent study of nine women with CFS, ten with Q-fever fatigue and nine controls found no group increase; small samples and differing case definitions limit both studies.
  locations:

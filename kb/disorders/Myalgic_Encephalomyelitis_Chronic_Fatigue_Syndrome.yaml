- accession: geo:GSE156792
  title: Genome-epigenome interactions associated with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome
  description: Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS) is a complex disease of unknown etiology. Multiple studies point to disruptions in immune functioning in ME/CFS patients as well as specific genetic polymorphisms and alterations of the DNA methylome in lymphocytes. However, potential interactions between DNA methylation and genetic background in relation to ME/CFS have not been examined. In this study we explored this association by characterizing the epigenetic (~480 thousand CpG loci) and genetic (~4.3 million SNPs) variation between cohorts of ME/CFS patients and healthy controls.

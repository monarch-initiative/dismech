- name: Patient Serum Vesicle-Microglia Assay
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  description: Human HM-SV40 microglia exposed to patient serum extracellular-vesicle preparations, with IL-1beta release as a readout. Published abstract and figure captions support bioactivity; detailed pooling/isolation information is available in the earlier author preprint, and final-version full methods were not accessible. Cargo identity, muscle origin and BBB crossing were not established.
  evidence:
  - reference: PMID:36153118
    reference_title: Exosome-associated mitochondrial DNA from patients with myalgic encephalomyelitis/chronic fatigue syndrome stimulates human microglia to release IL-1β.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, exosomes isolated from patients with ME/CFS stimulate significant release of IL-1β from cultured human microglia.
    explanation: Patient serum vesicle preparations have in vitro bioactivity. This does not establish mtDNA necessity, muscle origin, BBB passage or human brain inflammation.
  modeled_mechanisms:
  - target: Proposed Peripheral Vesicle-Microglial Signaling
    relationship: PERTURBS
    description: Adding patient vesicle preparations elicits a cultured microglial cytokine response.
    limitations: An immortalized cell assay does not reproduce brain exposure in vivo. Vesicle-preparation effects do not isolate mtDNA from other cargo or copurified material.

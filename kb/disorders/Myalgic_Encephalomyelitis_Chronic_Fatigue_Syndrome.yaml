has_subtypes:
- name: Mild ME/CFS
  description: Able to manage personal care and some domestic activity, often with reduced hours and loss of leisure or social activity. These NICE severity grades can fluctuate; they are not etiologic categories.
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: People with mild ME/CFS care for themselves
    explanation: NICE severity definitions guide support needs.
- name: Moderate ME/CFS
  description: Reduced mobility and restricted daily activities, usually unable to continue work or education and requiring daytime rest. These NICE severity grades can fluctuate; they are not etiologic categories.
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: People with moderate ME/CFS have reduced mobility
    explanation: NICE severity definitions guide support needs.
- name: Severe ME/CFS
  description: Minimal self-care, major cognitive and sensory burden, often housebound or predominantly bedbound. These NICE severity grades can fluctuate; they are not etiologic categories.
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: They may also spend most of their time in bed
    explanation: NICE severity definitions guide support needs.
- name: Very Severe ME/CFS
  description: Bedbound and dependent on care, with marked sensory intolerance and sometimes inability to swallow. These NICE severity grades can fluctuate; they are not etiologic categories.
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER

- accession: geo:GSE227375
  title: Sex-Dependent Transcriptional Changes in response to stress in patients with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome
  description: Myalgic encephalomyelitis/chronic fatigue syndrome (ME/CFS) is a complex, multi-symptom illness characterized by debilitating fatigue and post-exertional malaise (PEM). Numerous studies have reported sex differences at the epidemiological, cellular, and molecular levels between male and female ME/CFS patients. To gain further insight into these sex-dependent changes, we evaluated differential gene expression by RNA-sequencing in 35 ME/CFS patients (24 female, 11 male) and 34 matched healthy control participants (21 female and 13 male) during and after an exercise challenge intended to provoke PEM.

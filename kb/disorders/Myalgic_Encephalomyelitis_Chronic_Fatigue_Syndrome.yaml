- name: Autophagy-Associated Macrophage Dysfunction
  description: Atg13 gene depletion in mice disrupts autophagy and mitochondrial metabolism, promotes inflammatory macrophage polarization, and is associated with muscle nerve changes and post-treadmill weakness. This is a mechanistic model, not a validated cause of human ME/CFS or a complete model of delayed human PEM.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:41591477
    reference_title: Genetic depletion of the early autophagy protein ATG13 impairs mitochondrial energy metabolism, augments oxidative stress, induces the polarization of macrophages to the M1 inflammatory mode, and compromises myelin integrity in skeletal muscle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: ablation of the atg13 gene resulted in increased infiltration of M1Mφs into the muscle vasculature, deterioration of myelin integrity in nerve bundles, and a reduction in muscle strength following treadmill exercise.
    explanation: Genetically depleted mouse model supports autophagy-macrophage-muscle coupling; human ME/CFS ATG13 causation is unproven.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:

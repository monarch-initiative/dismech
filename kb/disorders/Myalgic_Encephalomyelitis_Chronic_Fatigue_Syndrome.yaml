diagnosis:
- name: Clinical Symptom and Functional Assessment
  description: 'Document pre-illness function, the delayed response to physical and cognitive activity, sleep, cognition, upright symptoms and duration. A symptom/activity diary can help. CDC/NAM-style criteria require at least six months of substantial functional impairment with fatigue, PEM and unrefreshing sleep, plus cognitive impairment or orthostatic intolerance (or both). NICE permits diagnosis after three months and requires all four domains: debilitating fatigue, PEM, unrefreshing sleep or sleep disturbance, and cognitive difficulties; OI is an additional feature. In either approach assess other explanations and coexisting conditions, and start symptom care while evaluation continues.'
  evidence:
  - reference: url:https://www.cdc.gov/me-cfs/hcp/diagnosis/index.html
    reference_title: Diagnosing ME/CFS | ME/CFS | CDC
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A thorough medical history, physical (including neurological) and mental health exam, and laboratory testing should be performed.
    explanation: CDC diagnostic approach requires clinical assessment and differential evaluation; the adjacent symptom list specifies PEM, sleep and cognitive/orthostatic features.
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: that have persisted for 3 months and are not explained by another condition.
    explanation: NICE diagnostic duration differs from the NAM-style six-month threshold.
- name: Evaluation for Alternative and Coexisting Conditions
  description: Use history, examination and targeted investigations rather than a universal exhaustive test panel. NICE examples include urinalysis, blood count, electrolytes, liver and thyroid tests, inflammatory markers, calcium/phosphate, HbA1c, ferritin, coeliac screening and creatine kinase; add B12/folate, vitamin D, infection tests or morning cortisol when indicated. Evaluate sleep disorders, medication effects, anemia, endocrine, inflammatory, neuromuscular and mental-health conditions as appropriate; comorbidities can coexist with ME/CFS.
  evidence:
  - reference: url:https://www.nice.org.uk/guidance/ng206/chapter/Recommendations
    reference_title: 'Recommendations | Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome: diagnosis and management  | Guidance | NICE'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: investigations to exclude other diagnoses
    explanation: NICE lists baseline investigations and clinical-judgment additions.
  - reference: url:https://www.cdc.gov/me-cfs/hcp/diagnosis/index.html
    reference_title: Diagnosing ME/CFS | ME/CFS | CDC
    supports: SUPPORT
    evidence_source: OTHER
    snippet: These steps are crucial to evaluate for other conditions that may explain symptoms.
    explanation: Differential assessment precedes diagnosis and continues during follow-up.
- name: Orthostatic Assessment
  description: Record upright symptoms and heart rate/blood pressure, using an adapted standing or specialist tilt assessment when clinically indicated and tolerated. Normal HR/BP does not rule out OI. Doppler cerebral-flow assays are research/specialist methods, not mandatory diagnostic tests.
  evidence:
  - reference: PMID:32140630
    reference_title: 'Cerebral blood flow is reduced in ME/CFS during head-up tilt testing even in the absence of hypotension or tachycardia: A quantitative, controlled study using Doppler echography.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During HUT, extracranial Doppler measurements demonstrate that CBF is reduced in ME/CFS patients with POTS, dOH, and even in those without HR/BP abnormalities.
    explanation: Specialty cohort of 429 cases and 44 controls; normal orthostatic heart rate and blood pressure do not exclude OI. Referral prevalence is not population prevalence.
  - reference: PMID:41576003
    reference_title: Shared autonomic phenotype of long COVID and myalgic encephalomyelitis/chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: reduced orthostatic CBFv (92%/88% in Long COVID/ME/CFS)
    explanation: This retrospective autonomic-referral cohort measures cerebral blood-flow velocity, not volumetric flow; it does not establish a muscle-to-brain causal pathway.
- name: Biomarker and Exercise-Test Limitations
  description: There is no confirmatory blood, imaging, genetic or exercise test. NK function, cytokines, metabolomics, sodium MRI and commercial ATP profiles are not established diagnostic assays. Two-day CPET can characterize impairment in selected research or specialist settings but is not required for diagnosis; it can provoke prolonged worsening, especially in severe disease, and a negative day-two decline does not exclude PEM.
  evidence:
  - reference: url:https://www.cdc.gov/me-cfs/hcp/diagnosis/index.html
    reference_title: Diagnosing ME/CFS | ME/CFS | CDC
    supports: SUPPORT
    evidence_source: OTHER
    snippet: There is no confirmatory test currently available to diagnose ME/CFS.
    explanation: CDC distinguishes biological abnormalities from diagnostic validation.
  - reference: PMID:31391529
    reference_title: Assessing cellular energy dysfunction in CFS/ME using a commercially available laboratory test.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The MES test does not have the reliability and reproducibility required of a diagnostic test and therefore should not currently be offered as a diagnostic test for CFS/ME.
    explanation: Independent ten-case/thirteen-control replication failed; sample-processing delay substantially affected the score.
  - reference: PMID:38965566
    reference_title: 'Cardiopulmonary and metabolic responses during a 2-day CPET in myalgic encephalomyelitis/chronic fatigue syndrome: translating reduced oxygen consumption to impairment status to treatment considerations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Abnormal post-exertional CPET responses persisted compared to CTL matched for aerobic capacity, indicating that fitness level does not predispose to exertion intolerance in ME/CFS.
    explanation: 'Canadian-criteria study: 84 cases and 71 sedentary controls, with 55 matched pairs; supports impaired recovery in this cohort.'
  - reference: PMID:42212259
    reference_title: Cardiopulmonary exercise test results do not change over two sequential days in patients with chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The data do not support using the 2-day CPET protocol to define PEM or disability.
    explanation: The 58-case and 25-control study required PEM and found no day-two VO2 decline. Absence of this physiological pattern does not exclude symptom-defined PEM or disability.
- name: Longitudinal Review
  description: Review symptoms, nutrition, function, medication effects and coexisting conditions regularly, adapting access to severity. Investigate new or changing symptoms rather than attributing every finding to ME/CFS.
  evidence:
  - reference: url:https://www.cdc.gov/me-cfs/hcp/diagnosis/index.html
    reference_title: Diagnosing ME/CFS | ME/CFS | CDC
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Patients with ME/CFS should be re-evaluated periodically.
    explanation: Continued assessment and usual preventive care remain appropriate.

environmental:
- name: Preceding Infection
  description: ME/CFS can follow viral or nonviral infection, although onset is not always linked to an identified infection. The Dubbo prospective cohort found persistent CFS in 28 of 253 participants after EBV, Ross River virus or Coxiella burnetii infection. SARS-CoV-2 can also precede a phenotype meeting ME/CFS criteria; long COVID and ME/CFS are overlapping, not identical populations.
  evidence:
  - reference: PMID:16950834
    reference_title: 'Post-infective and chronic fatigue syndromes precipitated by viral and non-viral pathogens: prospective cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: of whom 28 (11%) met the diagnostic criteria for chronic fatigue syndrome. This post-infective fatigue syndrome phenotype was stereotyped and occurred at a similar incidence after each infection.
    explanation: Prospective post-infectious cohort includes a bacterial trigger; it does not estimate the proportion of all ME/CFS with infectious onset.
- name: Exertion Beyond Individual Tolerance

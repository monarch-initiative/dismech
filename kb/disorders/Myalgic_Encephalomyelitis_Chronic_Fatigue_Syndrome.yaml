- name: Natural Killer Cell Dysfunction
  description: Average NK cytotoxicity is reduced across many studies, but methods and cohorts differ and some large studies are negative. The relationship to infection persistence, individual symptoms and treatment response remains unresolved.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:39483457
    reference_title: Meta-analysis of natural killer cell cytotoxicity in myalgic encephalomyelitis/chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cytotoxicity in ME/CFS was significantly reduced to about half of healthy control levels, with an overall Hedges' g of 0.96 (0.75-1.18). Heterogeneity was high but was explained by the range of E:T ratios, different methods, and potential outliers.
    explanation: The meta-analysis supports reduced average cytotoxicity, with assay heterogeneity; it is not a universal individual diagnostic marker.
  - reference: PMID:31057538
    reference_title: Cellular Immune Function in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Contrary to previous reports, no significant differences were observed in NK cell numbers, subtype proportions or in vitro responsiveness between ME/CFS patients and healthy control participants.
    explanation: The 251-case biobank study, including 54 severe cases, did not reproduce these NK abnormalities; its assays and sample handling differ from cytotoxicity studies.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
- name: TRPM3-Associated NK-Cell Calcium Dysregulation
  description: Patient NK cells show altered TRPM3 currents and stimulus-dependent calcium responses. Re-addition of extracellular calcium produced higher mitochondrial influx but lower cytosolic influx; pregnenolone-sulfate/TRPM3-dependent responses were reduced in both compartments. Ex vivo naltrexone rescue does not establish clinical benefit or the same defect in muscle or autonomic neurons.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31736966
    reference_title: Naltrexone Restores Impaired Transient Receptor Potential Melastatin 3 Ion Channel Function in Natural Killer Cells From Myalgic Encephalomyelitis/Chronic Fatigue Syndrome Patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: TRPM3 channel activity was restored in IL-2 stimulated NK cells isolated from ME/CFS patients after incubation for 24 h with NTX.
    explanation: Eight patient and eight control donors; ex vivo rescue does not demonstrate improvement of autonomic symptoms or PEM.
  - reference: PMID:42177403
    reference_title: Deficient TRPM3-linked mitochondrial Ca(2+) influx in natural killer cells associated with myalgic encephalomyelitis/chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cytosolic Ca2+ influx amplitude and slope were significantly reduced (p < 0.001), with a significantly shorter T1/2 response (p = 0.001) in ME/CFS compared to HC. Ca2+ influx amplitude (p < 0.001) and slope (p < 0.041) into the mitochondria were significantly higher in ME/CFS compared to HC. TRPM3 activation triggered pronounced cytosolic response (P < 0.001) accompanied by mitochondrial Ca2+ increase in HC. TRPM3-dependent cytosolic and mitochondrial Ca2+ mobilisation (P < 0.015) were significantly reduced with a shorter T1/2 response (p < 0.02) in ME/CFS compared to HC.
    explanation: 'Ten cases and ten controls: calcium re-addition produced higher mitochondrial influx despite lower cytosolic response, whereas pregnenolone-sulfate/TRPM3-dependent cytosolic and mitochondrial responses were both reduced. These are stimulus-specific NK-cell assays, not muscle calcium measurements.'
  cell_types:

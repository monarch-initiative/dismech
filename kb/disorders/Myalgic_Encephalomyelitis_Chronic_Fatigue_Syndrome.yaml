- name: Pyridostigmine
  description: Investigational for ME/CFS exertional intolerance. A 45-person randomized trial found an acute relative improvement of peak VO2, cardiac output and filling pressure after one 60-mg dose, with repeat iCPET after 50 minutes. This does not establish sustained symptom or PEM benefit; the ongoing LIFT trial tests longer-term treatment.
  evidence:
  - reference: PMID:35526605
    reference_title: 'Neurovascular Dysregulation and Acute Exercise Intolerance in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome: A Randomized, Placebo-Controlled Trial of Pyridostigmine.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The peak Vo2 increased after pyridostigmine but decreased after placebo (13.3 ± 13.4 mL/min vs -40.2 ± 21.3 mL/min; P < .05).
    explanation: 'Randomized 45-person acute trial: 60 mg pyridostigmine between two iCPETs separated by 50 minutes improved the relative exercise response. This does not test delayed PEM or durable treatment benefit.'
  target_mechanisms:
  - target: Reduced Exercise Cardiac Output
    treatment_effect: MODULATES
    description: Acute relative preservation of exercise cardiac output and increased filling pressure in the randomized iCPET experiment; durable symptom benefit remains unproven.
    evidence:
    - reference: PMID:35526605
      reference_title: 'Neurovascular Dysregulation and Acute Exercise Intolerance in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome: A Randomized, Placebo-Controlled Trial of Pyridostigmine.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The peak Vo2 increased after pyridostigmine but decreased after placebo (13.3 ± 13.4 mL/min vs -40.2 ± 21.3 mL/min; P < .05).
      explanation: 'Randomized 45-person acute trial: 60 mg pyridostigmine between two iCPETs separated by 50 minutes improved the relative exercise response. This does not test delayed PEM or durable treatment benefit.'
  - target: Impaired Venous Return
    treatment_effect: MODULATES
    description: Acute increase in filling pressure in the randomized iCPET study; this is not evidence of durable normalization of venous tone.
    evidence:
    - reference: PMID:35526605
      reference_title: 'Neurovascular Dysregulation and Acute Exercise Intolerance in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome: A Randomized, Placebo-Controlled Trial of Pyridostigmine.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Pyridostigmine improves peak Vo2 in ME/CFS by increasing cardiac output and right ventricular filling pressures.
      explanation: Acute physiological interpretation of the 45-person randomized trial; no long-term PEM outcome was tested.
  treatment_term:

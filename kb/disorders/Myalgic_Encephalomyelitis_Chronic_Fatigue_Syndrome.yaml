- name: Reduced Erythrocyte Deformability
  description: Patient erythrocytes had lower deformability in a small microfluidic study. This has not established in vivo capillary plugging, thrombosis, or a clinical diagnostic assay.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:30594919
    reference_title: Red blood cell deformability is diminished in patients with Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed from various measures of deformability that the RBCs isolated from ME/CFS patients were significantly stiffer than those from healthy controls.
    explanation: Sixteen case-control pairs tested in a microfluidic device; the proposed in vivo perfusion consequence and diagnostic performance remain unvalidated.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
- name: Skeletal Muscle Bioenergetic Disturbance
  description: Muscle studies suggest substrate-specific metabolic abnormalities and heterogeneous structural findings. In vitro glucose oxidation, cross-sectional EM and long-COVID paired biopsies address different questions. Neither universal fatty-acid oxidation failure nor a single primary mitochondrial lesion is established.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:33106563
    reference_title: Substrate utilisation of cultured skeletal muscle cells in patients with CFS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: galactose and fatty acids normally, indicating that the bioenergetic dysfunction lies upstream of the TCA cycle.
    explanation: Cultured myotubes from nine CFS and eleven control donors had substrate-dependent glucose-use abnormalities; persistence in culture is not proof of a genetic defect.
  - reference: PMID:38338957
    reference_title: Functional and Morphological Differences of Muscle Mitochondria in Chronic Fatigue Syndrome and Post-COVID Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Due to the lack of an EM control group, the mean size and shape of CFS and PCS can only be compared between the respective syndromes.
    explanation: The direct 2024 study compared mitochondrial ultrastructure in 14 CFS and 14 PCS samples without healthy EM controls. OXPHOS used historical healthy controls; between-syndrome morphology does not prove calcium-mediated injury.
  - reference: PMID:9527150
    reference_title: Muscle fibre characteristics and lactate responses to exercise in chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No significant ultrastructural abnormalities were found.
    explanation: An older 105-case biopsy study examined 41 samples by EM; findings qualify a universal structural mitochondrial lesion.
  - reference: PMID:38177128
    reference_title: Muscle abnormalities worsen after post-exertional malaise in long COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that amyloid-containing deposits are not present within capillaries.
    explanation: The 25-person long-COVID PEM cohort and 21 recovered controls had paired biopsies. Deposits were extravascular; this contradicts equating the observation with occlusive muscle microclots.
  - reference: PMID:38177128
    reference_title: Muscle abnormalities worsen after post-exertional malaise in long COVID.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Oxidative phosphorylation capacity decreased one day following the maximal exercise in both controls and patients
    explanation: A paired long-COVID exercise study supports muscle abnormalities, but this shared respiratory decrease alone is not a case-specific effect or proof of the complete ME/CFS chain.
  downstream:
  - target: Proposed Delayed Immunometabolic Amplification
    description: Proposed muscle metabolite or injury signals could amplify delayed symptoms. No source-to-target tracing or integrated perturbation demonstrates this step.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39240417
      reference_title: 'Towards an understanding of physical activity-induced post-exertional malaise: Insights into microvascular alterations and immunometabolic interactions in post-COVID condition and myalgic encephalomyelitis/chronic fatigue syndrome.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The accumulation of molecules such as lactate, reactive oxygen species or prostaglandins might trigger local and systemic immune activation. Subsequent intensification of bioenergetic inflexibilities, muscular ionic disturbances and modulation of central nervous system functions can lead to an exacerbation of existing pathologies and symptoms.
      explanation: Narrative review explicitly proposes the integrated metabolic/immune/CNS sequence; it is not direct causal validation.
    hypothesis_groups:
    - exertion_perfusion_muscle_immunometabolic_pem_model

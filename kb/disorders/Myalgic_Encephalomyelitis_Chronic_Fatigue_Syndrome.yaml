- name: Elevated Skeletal Muscle Tissue Sodium
  description: A 2022 pilot found higher MRI tissue sodium at rest and after brief exercise. Echo-time and compartment mixing prevent interpreting the signal as a direct measure of intracellular sodium or calcium overload.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:36494667
    reference_title: Muscle sodium content in patients with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Baseline tissue sodium content was higher in all 5 lower leg muscle compartments in ME/CFS compared to controls.
    explanation: Six female cases and six matched controls underwent sodium MRI before and after three minutes of plantar flexion. The acquisition could not isolate intracellular from extracellular sodium.
  cell_types:
  - preferred_term: cell of skeletal muscle
    term:
      id: CL:0000188
      label: cell of skeletal muscle
- name: Proposed Muscle Sodium-Calcium Loading
  description: The NHE1 sodium-loading, reduced Na/K-pump activity and reversed sodium/calcium-exchanger model predicts calcium-mediated mitochondrial injury. The sodium MRI pilot does not isolate intracellular sodium; direct human muscle calcium overload and exchanger reversal remain unverified.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:39727052
    reference_title: 'Key Pathophysiological Role of Skeletal Muscle Disturbance in Post COVID and Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS): Accumulated Evidence.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The sodium‐calcium exchanger (NCX) changes into reverse transport mode importing calcium instead of exporting it
    explanation: This is a proposed mechanism in a narrative review, not a direct human measurement.

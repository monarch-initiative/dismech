- name: Exercise Intolerance
  category: Musculoskeletal
  description: Reduced tolerance of exertion can reflect different neurovascular, metabolic or central physiological patterns. It is distinct from delayed multisystem PEM.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:33577778
    reference_title: Insights From Invasive Cardiopulmonary Exercise Testing of Patients With Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results identify two types of peripheral neurovascular dysregulation that are biologically plausible contributors to ME/CFS exertional intolerance-depressed Qc from impaired venous return, and impaired peripheral oxygen extraction.
    explanation: 'Selected low-right-atrial-pressure cohort: low-flow impaired venous return and high-flow impaired extraction are separate physiological patterns, not one universal lesion.'
  - reference: PMID:8423875
    reference_title: Central basis of muscle fatigue in chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The results indicate that patients with CFS have (1) normal fatigability and metabolism at both the intracellular and systemic levels, (2) normal muscle membrane function and excitation-contraction coupling, and (3) an inability to fully activate skeletal muscle during intense, sustained exercise.
    explanation: This older isometric-muscle study supports altered central activation in its cohort, not a psychiatric explanation or a universal exclusion of peripheral pathology.
  - reference: PMID:38965566
    reference_title: 'Cardiopulmonary and metabolic responses during a 2-day CPET in myalgic encephalomyelitis/chronic fatigue syndrome: translating reduced oxygen consumption to impairment status to treatment considerations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Abnormal post-exertional CPET responses persisted compared to CTL matched for aerobic capacity, indicating that fitness level does not predispose to exertion intolerance in ME/CFS.
    explanation: 'Canadian-criteria study: 84 cases and 71 sedentary controls, with 55 matched pairs; supports impaired recovery in this cohort.'
  - reference: PMID:42212259
    reference_title: Cardiopulmonary exercise test results do not change over two sequential days in patients with chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The data do not support using the 2-day CPET protocol to define PEM or disability.
    explanation: The 58-case and 25-control study required PEM and found no day-two VO2 decline. Absence of this physiological pattern does not exclude symptom-defined PEM or disability.
biochemical:
- name: Natural Killer Cell Cytotoxicity
  presence: Variable
  context: Candidate research phenotype; reduced on average in meta-analysis, not universal or diagnostically validated.
  evidence:
  - reference: PMID:39483457
    reference_title: Meta-analysis of natural killer cell cytotoxicity in myalgic encephalomyelitis/chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cytotoxicity in ME/CFS was significantly reduced to about half of healthy control levels, with an overall Hedges' g of 0.96 (0.75-1.18). Heterogeneity was high but was explained by the range of E:T ratios, different methods, and potential outliers.
    explanation: The meta-analysis supports reduced average cytotoxicity, with assay heterogeneity; it is not a universal individual diagnostic marker.
  - reference: PMID:31057538
    reference_title: Cellular Immune Function in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Contrary to previous reports, no significant differences were observed in NK cell numbers, subtype proportions or in vitro responsiveness between ME/CFS patients and healthy control participants.
    explanation: The 251-case biobank study, including 54 severe cases, did not reproduce these NK abnormalities; its assays and sample handling differ from cytotoxicity studies.
- name: Cytokine Profiles
  presence: Variable
  context: Case definition, sex, illness duration, severity, assays and timing influence results. Cross-sectional severity associations do not establish an early-disease or post-exercise cytokine surge.
  evidence:
  - reference: PMID:10226888
    reference_title: Immunological response in chronic fatigue syndrome following a graded exercise test to exhaustion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No group differences were seen for any of the immune variables at baseline or after exercise
    explanation: Twenty female cases and fourteen sedentary controls had serial sampling through 24 hours despite increased patient fatigue.
  - reference: PMID:24027260
    reference_title: Exercise and sleep deprivation do not change cytokine expression levels in patients with chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that these environmental manipulations did not produce clinically significant upregulation of proinflammatory cytokines.
    explanation: Repeated sampling after exercise and sleep deprivation did not support a generalized proinflammatory cytokine response.
- name: Plasma and Urine Metabolomic Profiles
  presence: Variable
  context: Purine, lipid and other concentration differences are research findings. Neither a uniform hypermetabolic nor hypometabolic state, diagnostic classifier or proven muscle-source signal is established.
  evidence:
  - reference: PMID:31277442
    reference_title: Post-Exertional Malaise Is Associated with Hypermetabolism, Hypoacetylation and Purine Metabolism Deregulation in ME/CFS Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The principal biochemical change related to the 7-day severity of PEM was the fall in the purine metabolite, hypoxanthine.
    explanation: Forty-seven cases reported recent PEM severity; a seven-day symptom window is not a serial provoked exercise experiment or a direct measurement of metabolic flux.
  - reference: PMID:27573827
    reference_title: Metabolic features of chronic fatigue syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eighty percent of the diagnostic metabolites were decreased, consistent with a hypometabolic syndrome.
    explanation: The study had 45 cases and 39 controls, 84 total. Concentration profiles and internal classification do not establish organism-wide metabolic shutdown or a validated diagnostic test.
- name: Muscle Tissue Sodium
  presence: Elevated in a small pilot cohort
  context: Research 23Na-MRI finding in six female cases; compartment mixing prevents equating it with intracellular sodium or calcium overload.
  evidence:
  - reference: PMID:36494667
    reference_title: Muscle sodium content in patients with Myalgic Encephalomyelitis/Chronic Fatigue Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Baseline tissue sodium content was higher in all 5 lower leg muscle compartments in ME/CFS compared to controls.
    explanation: Six female cases and six matched controls underwent sodium MRI before and after three minutes of plantar flexion. The acquisition could not isolate intracellular from extracellular sodium.

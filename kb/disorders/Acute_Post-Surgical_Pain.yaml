- name: NMDA-Antagonist Adjuvant (Ketamine)
  description: >-
    Perioperative low-dose ketamine, an NMDA-receptor antagonist, acts on the
    spinal central-sensitization node (the NMDA/glutamatergic "wind-up"
    component), reducing postoperative pain and opioid consumption and
    contributing preventive analgesia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ketamine
      term:
        id: CHEBI:6121
        label: ketamine
  target_mechanisms:
  - target: Spinal Central Sensitization
    treatment_effect: INHIBITS
    description: >-
      NMDA-receptor antagonism dampens the glutamatergic wind-up that drives
      spinal central sensitization, reducing pain and opioid requirement.
  evidence:
  - reference: PMID:15105220
    reference_title: A qualitative systematic review of the role of N-methyl-D-aspartate receptor antagonists in preventive analgesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dextromethorphan and ketamine were found to have significant immediate and
      preventive analgesic benefit in 67% and 58% of studies, respectively.
    explanation: >-
      Supports ketamine (NMDA antagonist) reducing postoperative pain/analgesic
      consumption. Evidence source HUMAN_CLINICAL (qualitative systematic review
      of perioperative randomized trials).
- name: Suzetrigine (NaV1.8 Inhibitor)
  description: >-
    Suzetrigine is an oral, first-in-class non-opioid analgesic for
    moderate-to-severe acute pain. It selectively inhibits peripheral NaV1.8
    channels; two large phase III postoperative trials after abdominoplasty and
    bunionectomy showed clinically meaningful pain reduction versus placebo and
    pain reduction similar to hydrocodone/acetaminophen over 48 hours.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: suzetrigine
      term:
        id: NCIT:C199115
        label: Suzetrigine
  target_mechanisms:
  - target: NaV1.8-Mediated Peripheral Nociceptive Signal Propagation
    treatment_effect: INHIBITS
    description: >-
      Selective NaV1.8 inhibition reduces action-potential firing and pain-signal
      transmission in peripheral human dorsal-root-ganglion sensory neurons.
    evidence:
    - reference: PMID:39775738
      reference_title: Pharmacology and Mechanism of Action of Suzetrigine, a Potent and Selective NaV1.8 Pain Signal Inhibitor for the Treatment of Moderate to Severe Pain.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This novel allosteric mechanism results in tonic inhibition of NaV1.8 and
        reduces pain signals in primary human DRG sensory neurons.
      explanation: >-
        Human sensory-neuron electrophysiology directly supports the modeled
        mechanism target and inhibitory treatment effect.
  evidence:
  - reference: PMID:40117446
    reference_title: "Suzetrigine, a Nonopioid NaV1.8 Inhibitor for Treatment of Moderate-to-severe Acute Pain: Two Phase 3 Randomized Clinical Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As compared with placebo, suzetrigine reduced moderate-to-severe acute pain
      over 48 h after abdominoplasty or bunionectomy. Pain reduction with
      suzetrigine was similar to that with hydrocodone bitartrate/acetaminophen.
    explanation: >-
      Two randomized, placebo- and active-controlled phase III postoperative-pain
      trials directly support clinical efficacy and appropriately limit the claim
      to the studied procedures and 48-hour endpoint.
- name: Spinal-Selective Hsp90 Inhibitor (Preclinical Opioid Adjuvant)
  description: >-
    A preclinical opioid-adjuvant strategy: spinal-cord-directed Hsp90 inhibition
    (intrathecal 17-AAG/tanespimycin, or spinal-selective Hsp90-beta/Grp94
    inhibitors) enhances mu-opioid antinociception in the paw-incision
    (post-surgical) pain model via microglial Src signaling, enabling opioid dose
    reduction and tolerance rescue. NOT an established human therapy - effect is
    spinal-compartment-specific and demonstrated only in rodents.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 17-AAG (tanespimycin)
      term:
        id: CHEBI:64153
        label: tanespimycin
  target_mechanisms:
  - target: Spinal Microglial Gating of Opioid Antinociception
    treatment_effect: ACTIVATES
    description: >-
      Spinal Hsp90 inhibition activates the microglial Src signaling that gates
      enhanced opioid antinociception, potentiating analgesia and rescuing
      tolerance in the paw-incision model (conforms to the
      spinal_hsp90_opioid_enhancement module).
  evidence:
  - reference: PMID:41031962
    reference_title: Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The enhanced antinociception seen with 17-AAG was completely abolished in
      the inhibitor groups in tail-flick and paw-incision pain models
    explanation: >-
      Supports the adjuvant mechanism specifically in the paw-incision
      (post-surgical) model. Evidence source MODEL_ORGANISM (mouse); this is a
      preclinical research target, not established therapy.

name: Acute Post-Surgical Pain
creation_date: "2026-07-25T00:00:00Z"
category: Iatrogenic
disease_term:
  preferred_term: Acute post-surgical pain
  # No MONDO term: MONDO has no human "acute post-surgical pain" disease entity
  # and obsolete or non-human postoperative-pain mappings are not appropriate.
  # Left intentionally unbound per curation decision; the closest human MONDO
  # relative is MONDO:0024317 (chronic pain syndrome) and the chronic sequela is
  # recognized in ICD-11 as MG30.21 chronic postsurgical pain. A disease-level
  # ICD-11 mapping is deliberately NOT added: MG30.21 codes the CHRONIC entity,
  # so mapping this ACUTE entry to it would be semantically incorrect.
parents:
- Pain
- Surgical Complication
notes: >-
  Acute post-surgical (post-operative) pain is the nociceptive/inflammatory pain
  arising directly from surgical tissue injury, normally resolving as the wound
  heals (days to weeks). It is common after surgery and clinically
  important out of proportion to its transience because its intensity is a
  leading predictor of the transition to chronic post-surgical pain (CPSP; ICD-11
  MG30.21). The pathophysiology chain here (incision -> inflammatory mediator
  release -> peripheral nociceptor sensitization -> spinal central sensitization
  -> resolution vs. transition to chronic post-surgical pain) is the substrate on
  which opioid-sparing multimodal analgesia acts. This entry is also the
  conformance home for the preclinical `spinal_hsp90_opioid_enhancement` module:
  the flagship study of that module (Bowden et al. 2026, PMID:41031962) tested the
  rat/mouse paw-incision (Brennan) model, the standard preclinical analogue of
  acute post-surgical pain.

  Publication review in 2026 expanded the original targeted-literature curation
  with contemporary prevalence and risk-factor evidence, functional pain
  assessment, regional analgesia guidance, and the pivotal postoperative trials
  of suzetrigine. The entry remains mechanism-first rather than a prescriptive
  peri-operative care protocol, consistent with DisMech scope.
pathophysiology:
- name: Surgical Incision and Nociceptor Activation
  description: >-
    The trigger. A surgical incision through skin, fascia, and muscle directly
    activates high-threshold A-delta and C-fiber nociceptors at the wound. In the
    Brennan rat plantar-incision model - the standard preclinical analogue of
    human post-surgical pain - a hindpaw incision produces reliable, quantifiable
    mechanical hyperalgesia lasting several days, with input carried by the sural
    and tibial nerves.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Nociceptor (A-delta / C-fiber primary afferent)
    term:
      id: CL:0000198
      label: pain receptor cell
  locations:
  - preferred_term: Skin and soft tissue at the surgical wound
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:8783314
    reference_title: Characterization of a rat model of incisional pain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a surgical incision of the rat foot causes a reliable and quantifiable
      mechanical hyperalgesia lasting for several days after surgery
    explanation: >-
      Establishes the trigger: surgical incision produces quantifiable mechanical
      hyperalgesia. Evidence source is MODEL_ORGANISM because this is the Brennan
      rat plantar-incision model, the standard preclinical analogue of acute
      post-surgical pain.
  - reference: PMID:8783314
    reference_title: Characterization of a rat model of incisional pain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This model should allow us to understand mechanisms of sensitization caused
      by surgery and investigate new therapies for postoperative pain in humans.
    explanation: >-
      The authors frame the incision model as the tool for studying surgery-caused
      sensitization and testing postoperative-pain therapies, motivating its use
      throughout this entry.
  downstream:
  - target: Inflammatory Mediator Release at the Wound
  - target: Acute post-surgical pain
- name: Inflammatory Mediator Release at the Wound
  description: >-
    The molecular amplifier. Incised and injured tissue and infiltrating immune
    cells release an inflammatory milieu (prostaglandins, bradykinin, protons,
    ATP, cytokines, and nerve growth factor). Receptors, mediators, and
    neurotransmitters driving sensitization after incision have been specifically
    characterized and are in part unique to incisional pain.
  role: amplifier
  biological_scale: MOLECULAR
  locations:
  - preferred_term: Skin and soft tissue at the surgical wound
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:29392204
    reference_title: Postoperative pain-from mechanisms to treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the role of certain receptors, mediators, and neurotransmitters involved in
      peripheral and central sensitization after incision were identified
    explanation: >-
      Supports characterized inflammatory mediators/receptors driving
      sensitization after incision. Evidence source is MODEL_ORGANISM because the
      snippet reports findings from rodent incision-model studies.
  downstream:
  - target: Peripheral Nociceptor Sensitization
- name: Peripheral Nociceptor Sensitization
  description: >-
    The cellular amplifier. The inflammatory milieu lowers nociceptor activation
    threshold and raises excitability, producing primary hyperalgesia at and
    immediately around the wound. In the incision model, distinct areas around the
    wound show altered withdrawal thresholds reflecting this peripheral
    sensitization.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sensitized nociceptor (A-delta / C-fiber primary afferent)
    term:
      id: CL:0000198
      label: pain receptor cell
  locations:
  - preferred_term: Skin and soft tissue at the surgical wound
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:8783314
    reference_title: Characterization of a rat model of incisional pain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Distinct areas around the wound had different withdrawal thresholds during
      the study period.
    explanation: >-
      Documents spatially graded threshold changes around the incision consistent
      with peripheral nociceptor sensitization. Evidence source MODEL_ORGANISM
      (Brennan rat incision model).
  downstream:
  - target: NaV1.8-Mediated Peripheral Nociceptive Signal Propagation
- name: NaV1.8-Mediated Peripheral Nociceptive Signal Propagation
  description: >-
    NaV1.8 voltage-gated sodium channels on peripheral pain-sensing neurons and
    dorsal-root-ganglion nociceptors sustain action-potential firing and transmit
    incisional pain signals toward the spinal cord. Human-neuron pharmacology
    identifies this peripheral signaling step as a tractable, non-opioid
    therapeutic target.
  role: signal_transmission
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Peripheral nociceptor
    term:
      id: CL:0000198
      label: pain receptor cell
  molecular_functions:
  - preferred_term: NaV1.8 voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  evidence:
  - reference: PMID:39775738
    reference_title: Pharmacology and Mechanism of Action of Suzetrigine, a Potent and Selective NaV1.8 Pain Signal Inhibitor for the Treatment of Moderate to Severe Pain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This novel allosteric mechanism results in tonic inhibition of NaV1.8 and
      reduces pain signals in primary human DRG sensory neurons.
    explanation: >-
      Human dorsal-root-ganglion neuron electrophysiology directly supports
      NaV1.8-dependent peripheral pain-signal propagation and its inhibition by
      suzetrigine. The evidence source is IN_VITRO because the quoted experiment
      used primary human sensory neurons outside an intact organism.
  downstream:
  - target: Spinal Central Sensitization
- name: Spinal Central Sensitization
  description: >-
    The central effector. Sustained nociceptor barrage into the spinal dorsal
    horn triggers activity-dependent synaptic plasticity - a prolonged, reversible
    increase in the excitability and synaptic efficacy of central nociceptive
    neurons (central sensitization), with a major NMDA-receptor/glutamatergic
    component ("wind-up") and a contribution from activated dorsal-horn microglia.
    Clinically it manifests as pain hypersensitivity beyond the wound: dynamic
    tactile allodynia and secondary hyperalgesia. Post-surgical pain is one of the
    conditions in which central sensitization is an established contributor.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Spinal dorsal horn microglia
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Activity-dependent synaptic potentiation (central sensitization)
    term:
      id: GO:0060291
      label: long-term synaptic potentiation
    modifier: INCREASED
  - preferred_term: NMDA/glutamatergic signaling in the dorsal horn
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: INCREASED
  - preferred_term: Dorsal-horn microglial activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  locations:
  - preferred_term: Spinal cord dorsal horn
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  evidence:
  - reference: PMID:20961685
    reference_title: "Central sensitization: implications for the diagnosis and treatment of pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nociceptor inputs can trigger a prolonged but reversible increase in the
      excitability and synaptic efficacy of neurons in central nociceptive
      pathways, the phenomenon of central sensitization.
    explanation: >-
      Defines central sensitization as nociceptor-input-driven amplification in
      central pathways. Evidence source HUMAN_CLINICAL because the review grounds
      central sensitization in human volunteer studies and clinical cohorts.
  - reference: PMID:20961685
    reference_title: "Central sensitization: implications for the diagnosis and treatment of pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Central sensitization manifests as pain hypersensitivity, particularly
      dynamic tactile allodynia, secondary punctate or pressure hyperalgesia
    explanation: >-
      Links central sensitization to allodynia and secondary hyperalgesia, the
      spread of pain beyond the wound seen after surgery.
  - reference: PMID:29392204
    reference_title: Postoperative pain-from mechanisms to treatment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Preclinical studies in rodent models characterized responses of primary
      afferent nociceptors and dorsal horn neurons as one neural basis for pain
      behavior
    explanation: >-
      Identifies dorsal-horn neuron responses as a neural basis of postoperative
      pain behavior. Evidence source MODEL_ORGANISM because the snippet reports
      rodent incision-model findings.
  downstream:
  - target: Spinal Microglial Gating of Opioid Antinociception
  - target: Resolution with Wound Healing
  - target: Transition to Chronic Post-Surgical Pain
  - target: Allodynia and secondary hyperalgesia
- name: Spinal Microglial Gating of Opioid Antinociception
  description: >-
    A preclinical therapeutic vulnerability at the same spinal dorsal-horn /
    microglial substrate as the central-sensitization node (its inbound edge). In
    the paw-incision (post-surgical) pain model, spinal Hsp90 inhibition activates
    microglial Src kinase signaling that enhances mu-opioid-receptor
    antinociception, enabling an opioid dose-reduction strategy; better acute
    analgesia via this route is hypothesized to blunt the acute-to-chronic
    transition (its downstream edge). This node conforms to the
    `spinal_hsp90_opioid_enhancement` module. IMPORTANT: the evidence is
    preclinical (mouse, intrathecal/isoform-selective dosing) and
    spinal-compartment-specific - brain/systemic non-selective Hsp90 inhibition
    blocks opioid antinociception - so this is a research target, not established
    human therapy.
  role: therapeutic_vulnerability
  biological_scale: CELLULAR
  conforms_to: "spinal_hsp90_opioid_enhancement#Microglial Src Kinase Activation"
  cell_types:
  - preferred_term: Spinal dorsal horn microglia
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Microglial modulation of spinal opioid antinociceptive signaling
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
    modifier: INCREASED
  locations:
  - preferred_term: Spinal cord dorsal horn
    term:
      id: UBERON:0002256
      label: dorsal horn of spinal cord
  evidence:
  - reference: PMID:41031962
    reference_title: Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The enhanced antinociception seen with 17-AAG was completely abolished in
      the inhibitor groups in tail-flick and paw-incision pain models
    explanation: >-
      Ties the module's opioid-enhancement mechanism directly to the paw-incision
      (post-surgical) pain model. Evidence source is MODEL_ORGANISM (mouse).
  - reference: PMID:41031962
    reference_title: Hsp90 inhibition in mouse spinal cord enhances Src kinase signaling in microglia to increase opioid antinociception.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      colocalization of activated Src with microglia
    explanation: >-
      Localizes the enhancing Src signaling to microglia, the cellular substrate
      of this therapeutic-vulnerability node and the module conformance target.
  downstream:
  - target: Transition to Chronic Post-Surgical Pain
- name: Resolution with Wound Healing
  description: >-
    The expected consequence. In most patients the sensitized state resolves as
    the surgical wound heals over days to weeks; only a minority progress to
    persistent pain.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:16698416
    reference_title: "Persistent postsurgical pain: risk factors and prevention."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute postoperative pain is followed by persistent pain in 10-50% of
      individuals after common operations
    explanation: >-
      The reported minority progressing to persistent pain implies that most
      patients do not develop chronic pain, but the quoted text does not directly
      establish wound healing as the mechanism of resolution; polarity is
      therefore PARTIAL.
- name: Transition to Chronic Post-Surgical Pain
  description: >-
    The adverse consequence. In a substantial minority the sensitized state
    persists as chronic post-surgical pain (CPSP) - reported in 10-50% of
    individuals after common operations, severe in ~2-10% - often with a
    neuropathic component from intraoperative nerve injury. The intensity of the
    acute pain is a key predictor of this transition, the rationale for
    aggressive, opioid-sparing acute pain control.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:16698416
    reference_title: "Persistent postsurgical pain: risk factors and prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute postoperative pain is followed by persistent pain in 10-50% of
      individuals after common operations, such as groin hernia repair, breast and
      thoracic surgery, leg amputation, and coronary artery bypass surgery.
    explanation: >-
      Quantifies the acute-to-chronic transition across common operations.
      Evidence source HUMAN_CLINICAL (human epidemiology in a clinical review).
  - reference: PMID:16698416
    reference_title: "Persistent postsurgical pain: risk factors and prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the intensity of acute postoperative pain correlates with the risk of
      developing a persistent pain state
    explanation: >-
      States the central clinical link modeled by this node: acute pain intensity
      predicts CPSP, motivating aggressive acute analgesia.
  - reference: PMID:16698416
    reference_title: "Persistent postsurgical pain: risk factors and prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iatrogenic neuropathic pain is probably the most important cause of
      long-term postsurgical pain.
    explanation: >-
      Attributes much long-term CPSP to iatrogenic neuropathic injury, the
      neuropathic component noted in this node.
  - reference: PMID:38809229
    reference_title: A prospective cohort study of chronic postsurgical pain after ambulatory surgeries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Every unit increase in pain over the first 24 h was significantly associated
      with increased odds of moderate-to-severe CPSP at 3 months; odds ratio =
      1.28, 95% CI = 1.04-1.58.
    explanation: >-
      A contemporary prospective ambulatory-surgery cohort quantifies the
      association between early acute pain intensity and moderate-to-severe CPSP.
  downstream:
  - target: Chronic post-surgical pain
phenotypes:
- name: Acute post-surgical pain
  category: Phenotype
  description: >-
    Acute nociceptive pain at and around the surgical wound. Moderate or severe
    pain affects nearly half of adults undergoing surgery despite contemporary
    peri-operative care.
  phenotype_term:
    preferred_term: Pain
    term:
      id: HP:0012531
      label: Pain
    temporality: ACUTE
  evidence:
  - reference: PMID:39319373
    reference_title: "Peri-operative pain management in adults: a multidisciplinary consensus statement from the Association of Anaesthetists and the British Pain Society."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly half of adult patients undergoing surgery experience moderate or
      severe postoperative pain.
    explanation: >-
      Provides a contemporary consensus-review estimate for clinically important
      acute postoperative pain in adults.
- name: Allodynia and secondary hyperalgesia
  category: Phenotype
  description: >-
    Pain from normally non-painful stimuli (tactile allodynia) and heightened pain
    in uninjured tissue surrounding the wound (secondary hyperalgesia), reflecting
    central sensitization.
  phenotype_term:
    preferred_term: Allodynia
    term:
      id: HP:0012533
      label: Allodynia
  evidence:
  - reference: PMID:20961685
    reference_title: "Central sensitization: implications for the diagnosis and treatment of pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Central sensitization manifests as pain hypersensitivity, particularly
      dynamic tactile allodynia, secondary punctate or pressure hyperalgesia
    explanation: >-
      Maps allodynia and secondary hyperalgesia to central sensitization.
      Evidence source HUMAN_CLINICAL (human volunteer/cohort grounding in the
      cited review).
- name: Chronic post-surgical pain
  category: Phenotype
  description: >-
    Persistent pain lasting beyond normal healing (>3 months) in a subset of
    surgical patients, often with a neuropathic component.
  phenotype_term:
    preferred_term: Chronic pain
    term:
      id: HP:0012532
      label: Chronic pain
    temporality: CHRONIC
  evidence:
  - reference: PMID:16698416
    reference_title: "Persistent postsurgical pain: risk factors and prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute postoperative pain is followed by persistent pain in 10-50% of
      individuals after common operations
    explanation: >-
      Supports chronic post-surgical pain as a sequela in a substantial subset
      (10-50% across common operations). Frequency band omitted because the source
      reports a wide range rather than a single enum-mappable band.
  - reference: PMID:38809229
    reference_title: A prospective cohort study of chronic postsurgical pain after ambulatory surgeries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CPSP was defined as chronic pain that developed or increased in intensity
      after the surgical procedure and is localized to the surgical field or
      within the innervation territory of a nerve in the surgical field, and has
      persisted for 3 months post-surgery, with the exclusion of other causes of
      pain.
    explanation: >-
      Supports the three-month duration, surgical-field localization, and
      exclusion-of-other-causes scope of the chronic sequela.
prevalence:
- population: Post-discharge surgical cohorts
  measure_type: PERIOD_PREVALENCE
  prevalence_class: COMMON
  rate_per_100000: 44500.0
  rate_low: 31000.0
  rate_high: 58000.0
  notes: >-
    Conditional prevalence among people who underwent surgery, measured during
    the first 1-14 days after hospital discharge; this is not general-population
    prevalence.
  evidence:
  - reference: PMID:37181639
    reference_title: "Prevalence of postoperative pain after hospital discharge: systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meta-analyses of combinable studies provided estimates of pooled prevalence
      rates of moderate-to-severe postoperative pain ranging from 31% 1 day after
      discharge to 58% 1 to 2 weeks after discharge.
    explanation: >-
      Quantifies the common conditional prevalence of moderate-to-severe pain
      after discharge across 27 studies and 22,108 surgical participants.
environmental:
- name: Pre-existing pain and heightened pain sensitivity
  description: >-
    Preoperative pain history and greater pain sensitivity are candidate
    risk-stratification domains for moderate-to-severe acute postsurgical pain.
  presence: Positive
  evidence:
  - reference: PMID:38799277
    reference_title: "Risk Factors for Acute Postsurgical Pain: A Narrative Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This review investigates the risk factors for APSP, including gender, age,
      obesity, smoking history, preoperative pain history, pain sensitivity,
      preoperative anxiety, depression, pain catastrophizing, expected
      postoperative pain, surgical fear, and genetic polymorphisms.
    explanation: >-
      The narrative review enumerates preoperative pain and pain sensitivity in
      its APSP risk-factor scope, but this abstract sentence does not quantify or
      independently confirm either association; polarity is therefore PARTIAL.
- name: Psychological vulnerability before surgery
  description: >-
    Preoperative anxiety, depression, pain catastrophizing, fear of surgery, and
    high expected postoperative pain are candidate psychological
    risk-stratification domains for acute postsurgical pain.
  presence: Positive
  evidence:
  - reference: PMID:38799277
    reference_title: "Risk Factors for Acute Postsurgical Pain: A Narrative Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This review investigates the risk factors for APSP, including gender, age,
      obesity, smoking history, preoperative pain history, pain sensitivity,
      preoperative anxiety, depression, pain catastrophizing, expected
      postoperative pain, surgical fear, and genetic polymorphisms.
    explanation: >-
      The narrative review enumerates these psychological variables in its APSP
      risk-factor scope, but this abstract sentence does not quantify or
      independently confirm each association; polarity is therefore PARTIAL.
diagnosis:
- name: Function-guided peri-operative pain assessment
  description: >-
    Repeated pain assessment across the peri-operative pathway should evaluate
    functional interference as well as pain intensity, guiding reassessment of
    analgesia rather than treating a unidimensional score alone.
  diagnosis_term:
    preferred_term: Pain assessment
    term:
      id: NCIT:C20992
      label: Pain Assessment
  results: >-
    Moderate or severe pain and pain that impairs recovery functions indicate
    inadequately controlled postoperative pain and the need to reassess the
    analgesic plan.
  evidence:
  - reference: PMID:39319373
    reference_title: "Peri-operative pain management in adults: a multidisciplinary consensus statement from the Association of Anaesthetists and the British Pain Society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      assessing pain to facilitate function; use of multimodal analgesia,
      including regional anaesthesia; non-pharmacological strategies; safe use of
      opioids; and use of protocols and training for staff in caring for patients
      with postoperative pain.
    explanation: >-
      The multidisciplinary consensus explicitly makes function-facilitating pain
      assessment a generic principle. Evidence source is OTHER because the claim
      is a Delphi consensus recommendation rather than a patient-level study.
treatments:
- name: Multimodal (Opioid-Sparing) Analgesia
  description: >-
    Combining analgesics and techniques with different mechanisms - non-opioid
    systemics (acetaminophen, NSAIDs/COX-2 inhibitors), regional/neuraxial local
    anesthesia, and adjuncts such as ketamine (modeled separately below) - to
    control acute pain while reducing opioid consumption and side effects and
    enhancing recovery.
  treatment_term:
    preferred_term: Multimodal analgesia (pain management)
    term:
      id: NCIT:C15180
      label: Pain Therapy
  evidence:
  - reference: PMID:29392204
    reference_title: Postoperative pain-from mechanisms to treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scientific evidence is able to point towards useful (and less useful)
      elements of multimodal analgesia able to reduce opioid consumption, improve
      pain management, and enhance recovery.
    explanation: >-
      Supports multimodal, opioid-sparing analgesia as the evidence-based approach.
      Evidence source HUMAN_CLINICAL (guideline/clinical-evidence synthesis).
  - reference: PMID:39319373
    reference_title: "Peri-operative pain management in adults: a multidisciplinary consensus statement from the Association of Anaesthetists and the British Pain Society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      use of multimodal analgesia, including regional anaesthesia;
      non-pharmacological strategies; safe use of opioids
    explanation: >-
      A contemporary multidisciplinary consensus endorses multimodal analgesia,
      regional techniques, non-pharmacological strategies, and safe opioid use.
      Evidence source is OTHER because the quoted claim is a Delphi consensus.
- name: Local and Regional Analgesia
  description: >-
    Regional techniques such as fascial-plane blocks can reduce early
    postoperative pain and opioid requirements for selected procedures.
    Technique selection is procedure-specific and requires trained staff and
    safety protocols.
  treatment_term:
    preferred_term: Regional anesthesia procedure
    term:
      id: NCIT:C64381
      label: Regional Anesthesia Procedure
  evidence:
  - reference: PMID:41363869
    reference_title: 2026 American Society of Anesthesiologists Practice Guideline on Perioperative Pain Management Using Local and Regional Analgesia for Cardiothoracic Surgeries, Mastectomy, and Abdominal Surgeries.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For adults, the American Society of Anesthesiologists (Schaumburg, Illinois)
      Task Force on Perioperative Pain Management strongly recommends fascial
      plane blocks to reduce pain and/or opioid requirements in the first 24 h
      postoperatively for open cardiothoracic, abdominal, retroperitoneal, and
      pelvic surgeries and mastectomy.
    explanation: >-
      The current ASA practice guideline directly supports regional fascial-plane
      blocks for early postoperative pain and opioid reduction. Evidence source is
      OTHER because the quoted statement is a guideline recommendation.
- name: Opioid Analgesic Therapy
  description: >-
    Mu-opioid agonists (e.g., morphine) can be used within multimodal care for
    moderate-to-severe acute post-surgical pain, but their adverse effects and
    persistent-use risk motivate safe-use and opioid-sparing strategies and, in
    preclinical research, opioid adjuvants.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: opioid analgesic agent therapy
    term:
      id: NCIT:C15180
      label: Pain Therapy
    therapeutic_agent:
    - preferred_term: morphine
      term:
        id: CHEBI:17303
        label: morphine
  evidence:
  - reference: PMID:39319373

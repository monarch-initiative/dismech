datasets:
- accession: geo:GSE125076
  title: A mouse model of acute post-surgical pain
  description: Pain is the leading cause of disability in the developed world but remains a poorly treated condition. Specifically, post-surgical pain continues to be a frequent and undermanaged condition. Here, we investigate the analgesic potential of pharmacological NaV1.7 inhibition in a mouse model of acute post-surgical pain, based on incision of the plantar skin and underlying muscle of the hind paw. We demonstrate that local and systemic treatment with the selective NaV1.7 inhibitor μ-theraphotoxin-Pn3a is effectively anti-allodynic in this model and completely reverses mechanical hypersensitivity in the absence of motor adverse effects.
  organism:

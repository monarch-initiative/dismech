discussions:
- discussion_id: gap_apsp_hsp90_adjuvant_translation
  prompt: >-
    Can spinal-selective Hsp90 inhibition translate into a human opioid-sparing
    adjuvant for acute post-surgical pain, and does reducing acute pain intensity
    by this route lower the incidence of chronic post-surgical pain?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Spinal Microglial Gating of Opioid Antinociception
  - pathophysiology#Transition to Chronic Post-Surgical Pain
  rationale: >-
    The Hsp90-adjuvant mechanism is established only in rodent incision models and
    is spinal-compartment-specific. Whether it is achievable and beneficial in
    humans - and whether better acute analgesia via this route reduces CPSP - is
    unknown.

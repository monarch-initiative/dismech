- accession: geo:GSE242389
  title: Human birth tissue products as a regenerative medicine for post-surgical pain through multi-modal action
  description: Post-surgical pain causes significant suffering. Extracts of the human amniotic membrane (AM) may be novel regenerative matrices, but little is known about their use in pain treatment. Locally applying FLO (particulates of AM) in mice acutely attenuated post-surgical pain hypersensitivity and inhibited its transition to a prolonged state after plantar-incision. Mechanistically, this was achieved through direct nociceptive neuronal inhibition via CD44-dependent mechanisms and indirect anti-pain effect by attenuating immune cell recruitment and promoting wound healing.

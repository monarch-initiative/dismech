    explanation: Reduced IFN-gamma in patient naive CD4 T cells.
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

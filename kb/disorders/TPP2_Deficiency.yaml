      cells (50%) compared to HC (average 5.4%)
    explanation: Senescence marker increase in a second, milder patient.
- name: Expansion of Age-Associated B Cells
  description: >-
    CD21-CD11c+ T-bet+ age-associated B cells are increased in TPP2-deficient
    patients and mice, together with antinuclear antibodies. The paper presents
    this as the link between premature immunosenescence and autoimmunity; that
    these cells produce the pathogenic anti-erythrocyte and anti-platelet
    antibodies has not been shown.

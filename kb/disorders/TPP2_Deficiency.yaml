name: TPP2 Deficiency
creation_date: "2026-11-16T14:25:26Z"
category: Mendelian
synonyms:
- immunodeficiency 78 with autoimmunity and developmental delay
- IMD78
- tripeptidyl peptidase II deficiency
- TRIANGLE disease
description: >-
  TPP2 deficiency is a very rare autosomal recessive inborn error of immunity
  caused by biallelic loss-of-function variants in TPP2, which encodes
  tripeptidyl peptidase II, a giant cytosolic serine exopeptidase acting
  downstream of the proteasome. Loss of TPP2 impairs cytosolic amino acid
  recycling; cells compensate by expanding the lysosomal compartment, which
  degrades hexokinase-2 and lowers glycolysis in activated lymphocytes, and
  lymphocytes acquire a stress-induced senescent phenotype. Patients present in
  infancy or early childhood with combined immunodeficiency (recurrent viral and
  respiratory infections, lymphopenia), severe and often refractory autoimmune
  cytopenias (Evans syndrome), and mild to moderate developmental delay.
  Hematopoietic stem cell transplantation can resolve the hematologic and
  immune disease. A family with a homozygous TPP2 missense variant and sterile
  brain inflammation mimicking multiple sclerosis has also been reported; whether
  that presentation belongs to the same disorder is unsettled.

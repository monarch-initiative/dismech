pathophysiology:
- name: TPP2 Loss of Function
  description: >-
    Biallelic TPP2 variants abolish TPPII protein (nonsense, frameshift, splice
    and multi-exon deletion alleles) or the giant multimeric complex and its
    enzyme activity (p.Gly500Asp). The cytosolic tripeptidyl exopeptidase step
    downstream of the proteasome is lost.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TPP2
    term:
      id: hgnc:12016
      label: TPP2
  molecular_functions:
  - preferred_term: tripeptidyl-peptidase activity
    modifier: DECREASED
    term:
      id: GO:0008240
      label: tripeptidyl-peptidase activity
  downstream:
  - target: Impaired Cytosolic Amino Acid Recycling
    causal_link_type: DIRECT
    description: >-
      TPPII trims tripeptides from proteasome-generated oligopeptides, so its
      loss interrupts the recycling of protein-derived free amino acids.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Indeed, total levels of intracellular free amino acids were markedly
        decreased within 4 hours of TPPII inhibition by BUTA treatment of mouse
        embryonic fibroblasts (MEF), at values ~20% to ~70% of controls
      explanation: >-
        Acute pharmacological TPPII inhibition lowers intracellular free amino
        acids in cultured cells.
  - target: Premature Lymphocyte Senescence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TPP2 deficiency activates stress-induced death and senescence programmes
      in lymphocytes and fibroblasts; the molecular link from the lost
      peptidase step to senescence is not established.
    evidence:
    - reference: PMID:18362329
      reference_title: "Activation of cellular death programs associated with immunosenescence-like phenotype in TPPII knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        TPPII deficiency activates cell type-specific death programs, including
        proliferative apoptosis in several T lineage subsets and premature
        cellular senescence in fibroblasts and CD8(+) T cells.
      explanation: >-
        TPPII-deficient mice show premature senescence of CD8 T cells.
  - target: Increased MHC Class I Surface Expression
    causal_link_type: DIRECT
    description: >-
      TPPII destroys peptides overall, so its loss raises MHC class I on the
      cell surface.
    evidence:
    - reference: PMID:19841172
      reference_title: "Analysis of the role of tripeptidyl peptidase II in MHC class I antigen presentation in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thymocytes from TPPII gene-trapped mice displayed more MHC class I on the
        cell surface, suggesting that TPPII normally limits Ag presentation by
        destroying peptides overall.
      explanation: >-
        Gene-trapped mice with >90% reduced TPPII show the same raised MHC class
        I seen in patient cells.
  evidence:
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TPPII protein is normally expressed at high levels in lymphocytes (Figure
      S2B) but was absent from T cells from both P1 and P2, consistent with
      nonsense-mediated mRNA decay
    explanation: Absent TPPII protein in patients carrying the nonsense allele.
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The residual protein lacked exopeptidase activity sensitive to the
      TPPII-specific inhibitor butabindide
    explanation: >-
      Residual missense protein from P3 and P4 lacks TPPII exopeptidase
      activity.
  - reference: PMID:25414442
    reference_title: "Early-onset Evans syndrome, immunodeficiency, and premature immunosenescence associated with tripeptidyl-peptidase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA available from one patient showed a homozygous frameshift mutation in
      tripeptidyl peptidase II (TPP2) abolishing protein expression.
    explanation: Frameshift allele abolishes protein expression.
- name: Impaired Cytosolic Amino Acid Recycling
  description: >-
    Without TPPII, proteasome-derived oligopeptides are not efficiently
    converted to free amino acids, and intracellular amino acid levels fall
    acutely, deactivating mTOR and sending TFEB to the nucleus.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: intracellular amino acid homeostasis
    modifier: DECREASED
    term:
      id: GO:0080144
      label: intracellular amino acid homeostasis
  downstream:
  - target: Compensatory Lysosomal Expansion
    causal_link_type: DIRECT
    description: >-
      Amino acid depletion triggers TFEB-dependent lysosomal biogenesis, which
      restores amino acid levels at the cost of an expanded lysosomal
      compartment.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Together, our results indicate that acute TPPII inhibition caused amino
        acid depletion, leading to mTOR deactivation, TFEB nuclear translocation,
        and TFEB-dependent gene induction, thereby adapting the cells to chronic
        TPPII inhibition.
      explanation: Orders amino acid depletion upstream of the TFEB response.
  evidence:
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, a major function of TPPII is to maintain amino acid levels in the
      cell, and during chronic TPPII inhibition a compensatory mechanism
      maintains amino acid homeostasis.
    explanation: Establishes TPPII as a maintainer of cellular amino acid levels.
- name: Compensatory Lysosomal Expansion
  description: >-
    TPPII-deficient cells of several lineages increase lysosome number and
    lysosomal proteolytic activity. Shown in patient T cells and fibroblasts,
    inhibitor-treated control cells, and Tpp2 knockout mouse liver.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  biological_processes:
  - preferred_term: lysosome organization
    modifier: INCREASED
    term:
      id: GO:0007040
      label: lysosome organization
  downstream:
  - target: Lysosomal Degradation of Hexokinase-2
    causal_link_type: DIRECT
    description: >-
      The overabundant lysosomes take up and degrade the glycolytic enzyme
      hexokinase-2 by chaperone-mediated autophagy.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, the overabundant lysosomes derange cellular metabolism by
        consuming the key glycolytic enzyme hexokinase-2 through
        chaperone-mediated autophagy.
      explanation: States the lysosome-to-HK2 step.
  evidence:
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed increased abundance of lysosomes in T cells from P1
    explanation: Patient T cells show the lysosomal expansion.
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The lysosomal markers LAMP1 and cathepsin B were increased in fibroblasts
      derived from P3 and P4, as well as in control fibroblasts treated with BUTA
    explanation: Patient-derived fibroblasts show increased lysosomal markers.
- name: Lysosomal Degradation of Hexokinase-2
  description: >-
    HK2 carries lysosomal targeting motifs recognized by HSC70 and enters
    lysosomes through the LAMP2A receptor; TPPII deficiency markedly increases
    its lysosomal degradation, so activated T cells fail to accumulate HK2.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chaperone-mediated autophagy
    modifier: INCREASED
    term:
      id: GO:0061684
      label: chaperone-mediated autophagy
  molecular_functions:
  - preferred_term: hexokinase activity
    modifier: DECREASED
    term:
      id: GO:0004396
      label: hexokinase activity
  downstream:
  - target: Reduced Glycolysis in Activated Lymphocytes
    causal_link_type: DIRECT
    description: >-
      HK2 loss limits glycolytic flux; overexpressing HK2 restored glycolysis in
      TPPII-inhibited T cells.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Thus, HK2's targeted entry into and degradation within lysosomes, which
        was markedly increased by TPPII deficiency, provides a molecular
        explanation for decreased glycolysis.
      explanation: Links HK2 lysosomal degradation to reduced glycolysis.
  evidence:
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Remarkably, treatment with BUTA greatly attenuated the induction of HK2 and
      PKM2 proteins, while minimally affecting HK1, PFKP, aldolase, GAPDH, and
      PGAM1
    explanation: TPPII inhibition selectively blunts HK2 induction in activated T cells.
- name: Reduced Glycolysis in Activated Lymphocytes
  description: >-
    Activated T cells must switch to aerobic glycolysis to support effector
    functions. TPPII deficiency reduced basal and maximal glycolysis in
    activated patient and inhibitor-treated T cells, but not in naive T cells
    that have not yet made the switch.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  downstream:
  - target: Impaired Effector Cytokine Production
    causal_link_type: DIRECT
    description: >-
      Reduced glycolysis impairs IFN-gamma and IL-2 production in T cells and
      IL-1beta in monocytic cells; HK2 overexpression rescues both glycolysis
      and IFN-gamma.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Importantly, overexpression of WT HK2 in TPPII-inhibited T cells
        restored both glycolysis and IFN-γ expression
      explanation: Rescue experiment linking the glycolytic defect to cytokine output.
  - target: Developmental delay
    causal_link_type: UNKNOWN
    description: >-
      Hypothesis only: the authors propose that defective aerobic glycolysis in
      neural cells underlies the neurodevelopmental delay, based on impaired
      glycolysis in a neuroblastoma line after TPPII inhibition.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Thus, our finding that TPPII inhibition impaired glycolysis in a
        neuroblastoma cell line suggests the intriguing hypothesis that the
        developmental delay in TPPII deficiency is mechanistically linked to
        defective aerobic glycolysis.
      explanation: >-
        The authors state this link as a hypothesis from a cell-line result,
        not as a demonstrated mechanism.
  evidence:
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TPPII deficiency reduced basal and/or maximal glycolysis in activated T
      cells from P2
    explanation: Reduced glycolysis measured in patient T cells.
- name: Impaired Effector Cytokine Production
  description: >-
    Naive CD4 T cells from patients and from Tpp2 knockout mice produce less
    IFN-gamma after activation, and TPPII-deficient monocytic cells produce
    less IL-1beta. This conflicts with the increased IFN-gamma reported in the
    senescent T cells of another patient.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: interferon-gamma production
    modifier: DECREASED
    term:
      id: GO:0032609
      label: type II interferon production
  downstream:
  - target: Recurrent viral infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors attribute the broad infection susceptibility to poor
      production of IFN-gamma, IL-2 and IL-1beta; the clinical link is inferred.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        In TPPII deficiency, adaptive and innate immune cells function poorly in
        elaborating IFN-γ, IL-2, and IL-1β, which explains the patients'
        susceptibility to a broad range of pathogens.
      explanation: Authors' inference from cell data to clinical infection risk.
  - target: Recurrent lower respiratory tract infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Same inferred link as for viral infections.
    evidence:
    - reference: PMID:25525876
      reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        In TPPII deficiency, adaptive and innate immune cells function poorly in

animal_models:
- name: TPPII knockout mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Tpp2 knockout
  publication: PMID:18362329
  description: >-
    TPPII-deficient mice show premature senescence of CD8 T cells and
    fibroblasts, proliferative apoptosis in T-lineage subsets, and, in mice
    older than one year, elevated mortality, thymic involution, lymphopenia and
    impaired T cell proliferation.
  modeled_mechanisms:
  - target: Premature Lymphocyte Senescence
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces stress-induced CD8 T cell senescence and the lymphopenia that
      follows, as seen in patient cells.
    limitations: >-
      Young knockout mice have normal thymic cellularity and the degenerative
      phenotype appears after one year, whereas patients present in infancy;
      the report does not describe Evans syndrome-like autoimmune cytopenias or
      a neurodevelopmental phenotype.
    evidence:
    - reference: PMID:18362329
      reference_title: "Activation of cellular death programs associated with immunosenescence-like phenotype in TPPII knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Whereas young TPPII KO mice had normal thymic cellularity, elderly (>1
        year) mice showed a more pronounced thymic involution compared with WT
        littermates
      explanation: Late onset of the thymic phenotype in the mouse.
  evidence:
  - reference: PMID:18362329
    reference_title: "Activation of cellular death programs associated with immunosenescence-like phenotype in TPPII knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Prominent degenerative alterations at the organismic level were a
      decreased lifespan and symptoms characteristic of immunohematopoietic
      senescence.
    explanation: Organism-level phenotype of the knockout.
- name: TPPII gene-trap mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: Tpp2 gene-trap hypomorph (>90% reduced TPPII)
  publication: PMID:19841172
  description: >-
    Gene-trapped mice with >90% reduced TPPII expression have more surface MHC
    class I on thymocytes but largely normal MHC class I antigen presentation
    and CD8 T cell responses to viral epitopes in vivo.
  modeled_mechanisms:
  - target: Increased MHC Class I Surface Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces the raised MHC class I seen on patient cells.
    limitations: >-
      Residual TPPII (<10%) remains, so this is a hypomorph rather than a null;
      CD8 T cell responses to viral epitopes were normal, which does not
      reproduce the patients' viral infection susceptibility.
    evidence:
    - reference: PMID:19841172
      reference_title: "Analysis of the role of tripeptidyl peptidase II in MHC class I antigen presentation in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In these mice, the expression level of TPPII was reduced by >90%
        compared with wild-type mice.
      explanation: Establishes that the model is a strong hypomorph.
  evidence:
  - reference: PMID:19841172
    reference_title: "Analysis of the role of tripeptidyl peptidase II in MHC class I antigen presentation in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TPPII gene-trapped mice responded as well as did wild-type mice to four
      epitopes from lymphocytic choriomeningitis virus.
    explanation: Normal antiviral CD8 response in the model.

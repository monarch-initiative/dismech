diagnosis:
- name: Lymphocyte immunophenotyping for senescent T and B cells
  description: >-
    Flow cytometry showing senescent CD8 T cells (CD28-CD57+) and expanded
    CD21-CD11c+ age-associated B cells; recommended in children with refractory
    multilineage cytopenias.
  evidence:
  - reference: PMID:25414442
    reference_title: "Early-onset Evans syndrome, immunodeficiency, and premature immunosenescence associated with tripeptidyl-peptidase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Determination of senescent lymphocytes should be part of the diagnostic
      evaluation of children with refractory multilineage cytopenias.
    explanation: Authors' diagnostic recommendation.
- name: Genome or exome sequencing of TPP2
  description: >-
    Molecular diagnosis is by sequencing. The Swiss founder 4.4 kb deletion was
    found only by genome analysis, so a negative exome does not exclude the
    diagnosis; TPP2 protein immunoblot can confirm loss of protein.
  evidence:
  - reference: PMID:33586135
    reference_title: "Immune deficiency, autoimmune disease and intellectual disability: A pleiotropic disorder caused by biallelic variants in the TPP2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four individuals from two families presented with a multisystemic
      condition of suspected genetic origin that was diagnosed only after genome
      analysis.
    explanation: Genome analysis was needed to detect the deletion.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative option for the immune and hematologic disease. The
    Stepensky index patient, refractory to steroids, IVIG, cyclosporine,
    mycophenolate, rituximab and sirolimus, was well with 97% donor chimerism
    six months after HLA-identical sibling HSCT. Of three published transplanted
    patients, one died after transplant. Correction of the neurodevelopmental
    features is not expected.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:25414442
    reference_title: "Early-onset Evans syndrome, immunodeficiency, and premature immunosenescence associated with tripeptidyl-peptidase II deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In October 2014, 6 months after HSCT, the child remains well with 97% donor
      cell chimerism and no infectious, autoimmune or lymphoproliferative
      manifestations.
    explanation: Single-patient early outcome.
  - reference: PMID:33682069
    reference_title: "Novel Case of Tripeptidyl Peptidase 2 Deficiency Associated with Mild Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of these patients have had hematological stem cell transplant with
      one patient death following transplant.
    explanation: Pooled transplant outcome across published cases.
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, although hematopoietic stem cell transplantation would be expected
      to cure the immune abnormalities in patients with TPPII deficiency,
      neurometabolic correction presents a greater challenge.
    explanation: Expected scope of benefit.

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic TPP2 variants are required. Every reported family is homozygous
    for its variant, reflecting consanguinity or founder haplotypes (a small
    isolated population in Lu et al., a shared Swiss chromosome 13 haplotype in
    Atallah et al.); heterozygous parents are unaffected carriers.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that autosomal recessive TPP2 mutations cause recurrent
      infections, autoimmunity, and neurodevelopmental delay in humans.
    explanation: >-
      The founding gene-disease report states recessive inheritance.
  - reference: PMID:25525876
    reference_title: "Dual proteolytic pathways govern glycolysis and immune competence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each patient bore a novel homozygous single nucleotide variant in TPP2,
      for which their parents were heterozygous carriers.
    explanation: >-
      Homozygous affected children of heterozygous unaffected parents in two
      families.
genetic:
- name: TPP2
  notes: >-
    TPP2 on 13q33.1 encodes tripeptidyl peptidase II, a subtilisin-family serine
    exopeptidase that assembles into a ~6 MDa spindle-shaped homo-oligomer and
    trims N-terminal tripeptides from proteasome-generated oligopeptides.
    Reported childhood-onset alleles (nonsense, frameshift, splice, multi-exon
    deletion, and a multimerization-disrupting missense) abolish protein or
    enzyme activity. The missense p.Cys28Gly allele reported in an adult family
    with MS-like sterile brain inflammation reduced protein abundance without a
    measurable loss of enzyme activity in blood cells (PMID:30533531), so its
    classification as a loss-of-function allele of this disease is uncertain.
    That family is not in the ClinGen proband count, and its brain inflammation
    is not curated as a phenotype of this entry.

classifications:
  isds_skeletal_category:
  - classification_value: spondylometaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), Table 1 group 12 "Spondylometaphyseal dysplasias (SMD)",
      entry NOS 12-0050, listed as "Spondylometaphyseal dysplasia with corneal
      dystrophy, PLCB3-related" (AR, PLCB3, MIM 618961). This is one of the two
      group-12 entries absent from dismech's own prose description of the group
      before this curation, the other being NOS 12-0060 (HHAT).
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  rate_per_100000: 0.0
  notes: >-
    Two affected first cousins from one consanguineous Emirati family constitute the
    entire published caseload. Skeletal dysplasias as a class are relatively common
    in the United Arab Emirates at 9.46 per 10,000 births, which is the ascertainment
    context in which this family was recognised, but no estimate exists for this
    disorder specifically; rate_per_100000 is recorded as 0.0 only to mark that the
    true rate is far below the resolution of any published survey.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report the clinical and molecular delineation of a new form of syndromic
      autosomal recessive spondylometaphyseal dysplasia (SMD) in two Emirati first
      cousins
    explanation: >-
      Establishes that the entire described cohort is two related individuals from a
      single family.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    SMDCD is autosomal recessive. Both affected cousins are homozygous for
    PLCB3 c.2632G>T; all four parents and all healthy siblings are heterozygous, and
    homozygosity mapping under a recessive model with complete penetrance is what
    localised the locus to 11q12.1-q13.1.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only the patients (IV-1 and IV-3) were found to be homozygous for these
      variants, while all healthy individuals were heterozygous
    explanation: >-
      Segregation consistent with autosomal recessive inheritance in an extended
      consanguineous pedigree.
genetic:
- name: Homozygous PLCB3 c.2632G>T (p.Ala878Ser)
  gene_term:
    preferred_term: PLCB3
    term:
      id: hgnc:9056
      label: PLCB3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    A single homozygous missense allele, PLCB3 NM_000932.2:c.2632G>T (p.Ala878Ser),
    at 11q13. The substituted alanine is highly conserved at both DNA and protein
    level across vertebrates and affects all three coding isoforms of PLCB3. The
    variant is absent from 200 ethnically matched control chromosomes and from dbSNP
    and EVS, with a heterozygous minor allele frequency of 1.824e-05 in ExAC.
    Structural modelling on the Gq-alpha-PLCbeta3 complex places it in the Ha2'
    element of the proximal C-terminal domain.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified variant (c.2632G>T) substitutes a serine for a highly conserved
      alanine within the Ha2' element of the proximal C-terminal domain.
    explanation: Names the allele and its structural location within the protein.
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant affects all three different coding isoforms of PLCB3, and this
      position is highly conserved at the DNA and protein levels between vertebrates
      and mammalians
    explanation: >-
      Conservation and isoform coverage are the population-genetic arguments for
      pathogenicity in a single-family report.
pathophysiology:
- name: Homozygous PLCB3 p.Ala878Ser
  biological_scale: MOLECULAR
  description: >-
    A conserved alanine in the Ha2' element of the proximal C-terminal domain is
    replaced by serine. The Ha2' element normally docks onto the catalytic core; the
    substitution disrupts that interaction.
  genes:
  - preferred_term: PLCB3
    term:
      id: hgnc:9056
      label: PLCB3
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified variant (c.2632G>T) substitutes a serine for a highly conserved
      alanine within the Ha2' element of the proximal C-terminal domain.
    explanation: The initiating molecular lesion.
  downstream:
  - target: Destabilised Phospholipase C Beta 3 with Reduced Activity
    causal_link_type: DIRECT
    description: >-
      Loss of the Ha2'-to-catalytic-core interaction destabilises the protein and
      reduces its enzymatic activity. The allele is hypomorphic rather than null,
      which matters because targeted disruption of Plcb3 in mouse is embryonic
      lethal.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This disrupts binding of the Ha2' element to the catalytic core and
        destabilises PLCB3.
      explanation: >-
        Establishes protein destabilisation as the direct consequence of the
        substitution.
- name: Destabilised Phospholipase C Beta 3 with Reduced Activity
  biological_scale: MOLECULAR
  description: >-
    PLCB3 catalyses production of diacylglycerol and inositol 1,4,5-trisphosphate
    from phosphatidylinositol 4,5-bisphosphate, and is activated by G-protein
    alpha-q and alpha-11 subunits and by beta-gamma subunits. The p.A878S protein is
    destabilised and hypomorphic, so signalling downstream of Gq-coupled receptors is
    attenuated and the substrate is not consumed.
  molecular_functions:
  - preferred_term: phospholipase C activity
    modifier: DECREASED
    term:
      id: GO:0004629
      label: C-type glycerophospholipase activity
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the identified PLCB3:NM_000932:c.2632G>T variant destabilises the protein and
      reduces its enzymatic activity, leading to PIP2 accumulation
    explanation: >-
      Links the destabilisation directly to reduced catalysis and to substrate
      accumulation.
  downstream:
  - target: Accumulation of Phosphatidylinositol 4,5-Bisphosphate
    causal_link_type: DIRECT
    description: >-
      With the hydrolysing enzyme impaired, its substrate builds up. This was
      measured directly in patient fibroblasts by anti-PtdIns(4,5)P2
      immunofluorescence.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that this hypomorphic variant leads to elevated levels of PIP2
        in patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
      explanation: >-
        Substrate accumulation demonstrated in patient-derived cells, together with
        its cytoskeletal consequence.
- name: Accumulation of Phosphatidylinositol 4,5-Bisphosphate
  biological_scale: MOLECULAR
  description: >-
    PIP2 is elevated in patient fibroblasts. PIP2 is not merely a signalling
    precursor but a direct regulator of actin-binding proteins at the plasma
    membrane, which is the route by which a signalling-enzyme defect becomes a
    structural cytoskeletal defect.
  biological_processes:
  - preferred_term: phosphatidylinositol-mediated signaling
    modifier: DECREASED
    term:
      id: GO:0048015
      label: phosphatidylinositol-mediated signaling
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that this hypomorphic variant leads to elevated levels of PIP2 in
      patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
    explanation: Measures the substrate accumulation in patient material.
  downstream:
  - target: F-Actin Cytoskeletal Disorganisation
    causal_link_type: DIRECT
    description: >-
      Excess PIP2 disorganises the actin cytoskeleton. The phenotype is the same one
      seen in Lowe syndrome fibroblasts, where the defect is in a different
      phosphoinositide-metabolising enzyme, which is the convergence argument that
      makes the link mechanistic rather than incidental.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This phenotype is strikingly similar to Lowe syndrome (MIM 309000)
        fibroblasts, which also display actin abnormalities due to defects in
        phosphoinositide signalling.
      explanation: >-
        The convergence with an independent phosphoinositide disorder supports the
        causal reading of the actin phenotype.
- name: F-Actin Cytoskeletal Disorganisation
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts are significantly larger than controls, with a weaker F-actin
    network and a more punctate appearance, scored blind to genotype using an
    established four-pattern classification of stress-fibre number and length. How
    this cellular phenotype produces a growth-plate lesion, a corneal opacity, and
    developmental delay is not established.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cellular_components:
  - preferred_term: actin filament
    term:
      id: GO:0005884
      label: actin filament
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient fibroblasts are significantly larger with a weaker F-actin network and
      more punctuate appearance.
    explanation: The measured cellular phenotype in patient-derived cells.
  downstream:
  - target: Spondylometaphyseal Skeletal Dysplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The skeletal lesion is attributed to disturbed phosphoinositide signalling
      during skeletal development, supported by expression of Plcb3 in bone,
      cartilage, and neural crest in zebrafish and by abnormal skeletal patterning
      with malformed facial and thoracic bones in zebrafish plcb3 null mutants. The
      intervening steps in human cartilage have not been demonstrated.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Plcb3 null mutants in zebra fish showed abnormal skeletal patterning with
        malformed facial and thoracic bones.
      explanation: >-
        A model-organism result establishing that Plcb3 loss disturbs skeletal
        patterning, without showing the mechanism in human cartilage.
  - target: Severe Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe global developmental delay is part of the syndrome and PLCB3 is most
      highly expressed in brain, but no step between the phosphoinositide defect and
      the neurodevelopmental phenotype has been demonstrated. Prematurity and chronic
      respiratory failure are uncontrolled confounders in both reported children.
  - target: Hypertelorism with Depressed Nasal Bridge
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A consistent facial gestalt across both affected cousins. Facial morphogenesis
      is neural-crest-dependent and zebrafish plcb3 is expressed in neural crest, but
      the connection is an inference from expression rather than a demonstrated
      mechanism.
  - target: Patent Ductus Arteriosus
    causal_link_type: UNKNOWN
    description: >-
      A large patent ductus arteriosus occurred in both affected children. Both were
      also born preterm — at 29 and 27 weeks — and prematurity alone is a sufficient
      explanation for a persistent duct, so this edge is left with directness
      UNKNOWN rather than asserted as part of the syndrome.
  - target: Corneal Dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The corneal opacity is present within days of birth and is confined to the
      cornea, with normal retinas, optic nerves, vitreous, and posterior lens on
      ophthalmological and B-scan assessment. No mechanism connecting the
      phosphoinositide defect to corneal stromal transparency has been proposed.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Opthalmological examination revealed bilateral corneal haziness with normal
        retinas.
      explanation: >-
        Establishes that the eye lesion is corneal and anterior-segment specific, but
        supplies no mechanism, hence the unknown-intermediates grading.
- name: Spondylometaphyseal Skeletal Dysplasia
  biological_scale: ORGANISM
  description: >-
    Profound limb shortening involving both proximal and distal segments, with short
    fingers and toes and a narrow chest. Radiographs show short long bones with wide
    metaphyses and coarse metaphyseal trabeculae, cupping of the distal radius and
    ulna, uncalcified distal femoral and proximal tibial epiphyses in the neonate,
    short ribs with a wide anterior aspect, anterior beaking of the lumbar and
    thoracic vertebrae with wide intervertebral spaces, and almost square, short iliac
    bones with medial projections. The iliac shape was close enough to Schneckenbecken
    dysplasia that SLC35D1 was sequenced and excluded before the locus was mapped.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skeletal survey (figure 1B) showed short long bones with wide metaphyses and
      some coarse trabecule at the metaphyses.
    explanation: The primary radiographic description of the skeletal lesion.
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lumbar and thoracic vertebrae had beaks at their anterior aspects, and the
      intervertebral spaces were wide.
    explanation: >-
      The vertebral component that makes this a spondylometaphyseal rather than a
      purely metaphyseal dysplasia.
  downstream:
  - target: Profound Limb Shortening
    causal_link_type: DIRECT
    description: >-
      Micromelia involving both proximal and distal segments, detectable on prenatal
      ultrasound.
  - target: Metaphyseal Widening
    causal_link_type: DIRECT
    description: Wide metaphyses with coarse trabeculae and distal forearm cupping.
  - target: Anterior Vertebral Beaking
    causal_link_type: DIRECT
    description: >-
      Anterior beaks on the lumbar and thoracic bodies with wide intervertebral
      spaces.
  - target: Severe Postnatal Growth Deficiency
    causal_link_type: DIRECT
    description: >-
      Growth deficiency that is postnatal in onset: birth weight was above the 25th
      centile in the proband, while weight and height were both far below the third
      by four years.
  - target: Narrow Chest with Pulmonary Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Short, anteriorly wide ribs give a narrow thorax that constrains lung growth.
      This is the feature that dominates the natural history and determines survival.
- name: Corneal Dystrophy
  biological_scale: ORGANISM
  description: >-
    Bilateral corneal clouding evident within the first days of life. In the second
    cousin the corneas showed vascularised opacities with central thickened white
    cream-coloured tissue and a thinner greyish periphery over an epithelialised
    surface. Both children underwent corneal grafting; one experienced graft
    rejection. Screening for a storage disease — white cell inclusions, urine
    mucopolysaccharides and oligosaccharides — was negative, which is the standard
    first differential for neonatal corneal clouding.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ophthalmological evaluation showed bilateral vascularised corneal opacities
      with central thickened white cream-coloured tissue and thinner greyish
      periphery; the surface of the cornea was epithelised.
    explanation: The detailed corneal description in the second affected cousin.
  downstream:
  - target: Corneal Clouding
    causal_link_type: DIRECT
    description: >-
      Bilateral corneal opacity apparent within the first two weeks of life, with
      normal retinas behind it.

    Postnatal growth deficiency. At four years the proband weighed 14 kg and measured
    85 cm, both well below the third centile, despite a birth weight above the 25th.
  phenotype_term:
    preferred_term: Severe short stature
    term:
      id: HP:0003510
      label: Severe short stature
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They displayed postnatal growth deficiency causing profound limb shortening
      with proximal and distal segments involvement, narrow chest, radiological
      abnormalities involving the spine, pelvis and metaphyses, corneal clouding and
      intellectual disability.
    explanation: >-
      The summary clinical description, establishing postnatal growth deficiency
      alongside the other core features.
progression:
- phase: Neonatal
  age_range: Birth to 1 month
  notes: >-
    Both children were born preterm — at 29 and 27 weeks — and were floppy at birth,
    requiring intubation and ventilation. Prenatal ultrasound had shown short limbs
    and a narrow thorax in the proband. Corneal clouding was apparent within the
    first two weeks.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal ultrasound revealed short limbs and narrow thorax. The baby was floppy
      at birth and required intubation and ventilation.
    explanation: Documents the prenatal detection and the neonatal respiratory course.
- phase: Infancy and childhood
  age_range: 1 month onward
  notes: >-
    Chronic lung disease with respiratory failure, requiring tracheostomy and
    continuous oxygen in the surviving child, plus gastrostomy for chronic reflux and
    repeated aspiration pneumonia. Corneal grafting was performed in both children.
    One died at eight months of septic shock with pulmonary hypertension; the other
    was alive at six years, wheelchair-bound with severe developmental delay.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He died at the age of 8 months of septic shock.
    explanation: Records the fatal outcome in the second affected cousin.
diagnosis:
- name: Neonatal Corneal Clouding with a Skeletal Dysplasia
  description: >-
    The combination that should prompt this diagnosis is neonatal corneal clouding
    with a spondylometaphyseal skeletal survey. Because that combination is
    classically a lysosomal storage disorder, storage screening comes first and was
    negative in both children — white cell inclusions, urine mucopolysaccharides, and
    urine oligosaccharides.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Basic screening for storage disease including white blood cell inclusions,
      urine mucopolysaccharides and oligosaccharides was negative.
    explanation: Documents the storage-disease exclusion that precedes the genetic diagnosis.
- name: PLCB3 Sequencing
  description: >-
    Biallelic PLCB3 variants confirm the diagnosis. With one family reported, the
    evidence base for interpreting a novel PLCB3 allele is thin; the founding report
    reached its assignment only after excluding three other homozygous variants in
    the same linkage interval by functional assay, which is a reminder of how weak
    homozygosity mapping alone is in a single consanguineous pedigree.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on these experiments we considered the variants in FEN1, INCENP and
      PRPF19 unlikely to be the cause of our patients
    explanation: >-
      Three competing homozygous candidates in the same interval had to be excluded
      functionally before PLCB3 could be assigned.
differential_diagnoses:
- name: Mucopolysaccharidoses and Other Lysosomal Storage Disorders
  description: >-
    Neonatal corneal clouding with a dysostotic skeletal survey is the classic
    presentation of a storage disorder, and both affected children were screened for
    one before the genetic diagnosis was reached. Anterior vertebral beaking in
    particular is a recognised storage-disease sign, which makes the radiographic
    overlap substantial.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Basic screening for storage disease including white blood cell inclusions,
      urine mucopolysaccharides and oligosaccharides was negative.
    explanation: >-
      The storage differential was actively pursued in the reported family, which is
      why it belongs here.
- name: Schneckenbecken Dysplasia
  description: >-
    The square, short iliac bones with medial projections resembled those of
    Schneckenbecken dysplasia closely enough that SLC35D1 was sequenced and excluded
    before the linkage analysis. Schneckenbecken dysplasia sits in ISDS group 14
    (severe spondylodysplastic dysplasias), so this is also a differential across
    nosology groups.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that the radiological features, particularly the shape of ilium, were
      similar to Schneckenbecken dysplasia (OMIM 269250), we sequenced SLC35D1 but
      did not find any pathogenic variants
    explanation: Documents the specific radiographic mimicry and its molecular exclusion.
- name: Spondylometaphyseal Dysplasias with Retinal Involvement
  description: >-
    Only two other spondylometaphyseal dysplasias involve the eye, and both affect
    the retina rather than the cornea: SMD with cone-rod dystrophy (PCYT1A) and axial
    SMD with retinal degeneration. An anterior-segment lesion with normal retinas
    therefore separates SMDCD from both at the bedside.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ophthalmological abnormalities have been reported in only two types of SMDs:
      SMD cone rod dystrophy (SMDCRD, MIM 608940)
    explanation: >-
      Establishes that eye involvement in the SMD group was previously confined to
      two retinal disorders, which is what makes the corneal phenotype diagnostic.
treatments:
- name: Corneal Grafting
  description: >-
    Both affected children underwent bilateral corneal grafting — one at six months,
    followed by tarsorrhaphy and keratoplasty. Outcomes were mixed: the second child
    experienced graft rejection, and the surviving proband still had blurred vision
    from corneal opacities at six years.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Corneal Dystrophy
    treatment_effect: MODULATES
    description: >-
      Grafting replaces the opacified tissue but does not address the underlying
      signalling defect, and the reported outcomes suggest the benefit is partial and
      not durable in every case.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        He had corneal grafting of the right eye followed by the left eye, but he
        experienced graft rejection.
      explanation: >-
        Graft rejection in one of the two treated children is why the effect is
        recorded as partial.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The child had bilateral corneal grafting at the age of 6 months followed by
      tarsorrhaphy and keratoplasty.
    explanation: Documents the intervention actually performed.
- name: Respiratory Support
  description: >-
    Intubation and ventilation from birth, progressing to tracheostomy and continuous
    supplemental oxygen for chronic respiratory failure. This is the dominant care
    burden and the determinant of survival.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He is developmentally delayed and has chronic lung disease with chronic
      respiratory failure requiring a tracheostomy and continuous oxygen
      supplementation.
    explanation: Documents the respiratory support required in the surviving child.
- name: Nutritional Support via Gastrostomy
  description: >-
    Gastrostomy feeding was required in the surviving child for chronic
    gastro-oesophageal reflux with repeated aspiration pneumonia.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He also has a gastrostomy tube to counteract chronic gastro-oesophageal reflux
      and repeated aspiration pneumonia.
    explanation: Documents the feeding intervention actually performed.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance in a consanguineous family carries a 25 percent
    recurrence risk, and the two affected children are cousins, so the risk extends
    across the wider pedigree. Carrier testing for the familial allele is
    straightforward once identified.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a consanguineous family from UAE with a new autosomal recessive
      (AR) SMD associated with intellectual disability and corneal dystrophy (SMDCD)
      caused by a homozygous variant in PLCB3.
    explanation: >-
      Establishes the consanguineous recessive family structure that makes
      recurrence-risk counselling and cascade carrier testing the relevant action.
experimental_models:
- name: SMDCD patient-derived dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary adherent fibroblasts from a skin biopsy of patient IV-1, assayed for
    PLCB3 protein level by immunoblot, for PIP2 by anti-PtdIns(4,5)P2
    immunofluorescence, and for F-actin organisation by phalloidin staining scored
    blind to genotype against a published four-pattern classification, with
    cytochalasin D as a cytoskeletal control.
  cell_source: Patient-derived (skin biopsy)
  culture_system: Two-dimensional monolayer culture on coverslips
  modeled_mechanisms:
  - target: F-Actin Cytoskeletal Disorganisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The patient fibroblast is the only human cellular system reported for this
      disorder and carries both the substrate-accumulation and the cytoskeletal
      findings.
    limitations: >-
      Dermal fibroblasts are not chondrocytes, corneal keratocytes, or neurons, and
      none of the three affected tissues has been modelled. The cellular phenotype is
      therefore a demonstration that the allele is functionally consequential rather
      than a model of any of the disease's organ lesions.
    readouts:
    - name: Anti-PtdIns(4,5)P2 immunofluorescence
      target: F-Actin Cytoskeletal Disorganisation
      direction: INCREASED
      interpretation: >-
        Elevated PIP2 in patient cells is the direct evidence that the variant
        impairs substrate turnover in vivo.
    - name: F-actin stress-fibre pattern score
      target: F-Actin Cytoskeletal Disorganisation
      direction: ALTERED
      interpretation: >-
        Blinded scoring of stress-fibre number and length shifts towards the weaker
        patterns in patient cells.
    evidence:
    - reference: PMID:29122926
      reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that this hypomorphic variant leads to elevated levels of PIP2
        in patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
      explanation: >-
        States both readouts and the causal claim the model is used to support.
discussions:
- discussion_id: smdcd_single_family_evidence_base
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Spondylometaphyseal Dysplasia with Corneal Dystrophy
  prompt: >-
    Is SMDCD an established gene-disease relationship, given that it rests on one
    homozygous missense allele in two cousins from a single family?
  rationale: >-
    Every clinical and molecular statement about this disorder comes from one report
    of one consanguineous pedigree. The linkage interval spanned 19.3 Mb and 487
    genes, and four homozygous candidate variants survived filtering; PLCB3 was
    selected partly on the prior that phospholipid-metabolism genes such as PLCB4 and
    PCYT1A cause bone dysplasia, and the three competitors were excluded by functional
    assays rather than by independent genetic replication. The functional work is
    good, but no second family has been published, so the relationship has not been
    replicated in the way a gene-disease assertion normally requires. The ISDS
    nosology nonetheless lists it as a distinct entity, which this entry follows while
    recording the limitation.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome homozygosity mapping localised the genetic cause to 11q12.1-q13.1,
      a region spanning 19.32 Mb with ~490 genes.
    explanation: >-
      The size of the linkage interval is what makes independent replication, rather
      than functional exclusion of competitors, the missing evidence.
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in genes involved in phospholipid metabolism, such as PLCB4
      and PCYT1A, are known to cause bone dysplasia with or without eye anomalies,
      which led us to select PLCB3 as a strong candidate.
    explanation: >-
      Candidate selection was partly driven by a pathway prior, which is a legitimate
      heuristic but not independent evidence.
  proposed_experiments:
  - experiment_id: exp_smdcd_independent_replication
    name: Seek independent PLCB3 families through matchmaking
    description: >-
      Submit the PLCB3 phenotype to GeneMatcher and equivalent matchmaking services
      and to skeletal dysplasia consortia, and reanalyse unsolved neonatal
      corneal-clouding-plus-skeletal-dysplasia exomes for biallelic PLCB3 variants.
    would_support:
    - pathophysiology#Homozygous PLCB3 p.Ala878Ser
    supporting_outcome:
    - >-
      A second unrelated family with biallelic PLCB3 variants and a matching
      phenotype would convert the assertion from single-family to replicated.
    would_refute:
    - pathophysiology#Homozygous PLCB3 p.Ala878Ser
    refuting_outcome:
    - >-
      Identification of a pathogenic variant in one of the other candidate genes in
      the interval in a second family with the same phenotype would reopen the gene
      assignment.
- discussion_id: smdcd_actin_to_organ_lesion_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#F-Actin Cytoskeletal Disorganisation
  prompt: >-
    How does a fibroblast actin phenotype account for a growth-plate dysplasia, a
    corneal opacity, and severe developmental delay?
  rationale: >-
    The mechanism is demonstrated as far as the fibroblast and stops there. Three
    distinct organ lesions are attributed to it, in tissues that were never assayed.
    Zebrafish plcb3 nulls give some support for the skeletal branch, but mouse Plcb3
    disruption is embryonic lethal and further knockout models gave discordant
    results that the authors attribute to how the gene was disrupted — so there is no
    settled animal model either. The corneal branch is the weakest: nothing connects
    phosphoinositide signalling to corneal stromal transparency, and the opacity is
    present within days of birth, implying a developmental rather than a degenerative
    process.
  evidence:
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, targeted disruption of plcb3 results in embryonic lethality.
    explanation: >-
      The lethality of the mouse null is why no mammalian model of the organ lesions
      exists.
  - reference: PMID:29122926
    reference_title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia with corneal dystrophy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, further Plcb3 knockout models showed discordant results.
    explanation: >-
      Discordance between knockout models means the existing animal evidence cannot
      arbitrate the organ mechanisms.
  proposed_experiments:
  - experiment_id: exp_smdcd_hypomorphic_knockin_and_tissue_models
    name: Hypomorphic Plcb3 knock-in and human tissue-specific models
    description: >-
      Generate a knock-in carrying the human p.A878S hypomorph rather than a null, so
      that animals survive, and phenotype the growth plate, cornea, and brain.
      Complement with patient iPSC-derived chondrocytes and corneal keratocytes
      assayed for PIP2, actin organisation, and tissue-specific differentiation.
    would_support:
    - pathophysiology#Corneal Dystrophy
    supporting_outcome:
    - >-
      Corneal opacity and a spondylometaphyseal skeletal phenotype in hypomorphic
      animals would establish that the single allele accounts for the organ lesions.
    would_refute:
    - pathophysiology#F-Actin Cytoskeletal Disorganisation
    refuting_outcome:
    - >-
      Normal actin organisation in patient-derived chondrocytes and keratocytes
      despite the skeletal and corneal phenotypes would show the fibroblast actin
      finding is not the operative mechanism in the affected tissues.
clinical_trials: []
datasets: []
notes: >-
  Curated as part of filling ISDS Nosology group 12 (Spondylometaphyseal
  dysplasias), which had no dismech entries. SMDCD is NOS 12-0050 in the 2023
  revision and was one of the two group-12 members missing from dismech's own
  description of the group. The whole entry rests on a single family, which is
  recorded explicitly as an open discussion rather than being smoothed over: the
  functional work in patient fibroblasts is solid, but the gene-disease relationship
  has not been independently replicated. Downstream edges from the cellular node to
  the three organ lesions are graded INDIRECT_UNKNOWN_INTERMEDIATES for the same
  reason.

pathophysiology:
- name: Destabilising PLCB3 Variant in the Proximal C-Terminal Domain
  biological_scale: MOLECULAR
  description: >-
    The c.2632G>T variant substitutes a serine for a highly conserved alanine in
    the Ha2' element of the proximal C-terminal domain. That element normally
    docks against the catalytic core; disrupting the contact destabilises the
    whole protein. The lesion is therefore not in the active site but in an
    intramolecular interface that the active site depends on.
  genes:
  - preferred_term: PLCB3
    term:
      id: hgnc:9056
      label: PLCB3
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The identified variant (c.2632G>T) substitutes a serine for a highly conserved alanine within the Ha2' element of the proximal C-terminal domain. This disrupts binding of the Ha2' element to the catalytic core and destabilises PLCB3.
    explanation: >-
      Establishes the variant and its structural consequence.
  downstream:
  - target: Accumulation of PIP2 from Impaired Phosphoinositide Hydrolysis
    description: >-
      A destabilised phospholipase C beta 3 hydrolyses less PIP2, which
      accumulates in patient cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29122926
      reference_title: >-
        Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that this hypomorphic variant leads to elevated levels of PIP2 in patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
      explanation: >-
        Patient-fibroblast measurement establishing the substrate accumulation.
- name: Accumulation of PIP2 from Impaired Phosphoinositide Hydrolysis
  biological_scale: CELLULAR
  description: >-
    PLCB3 converts phosphatidylinositol 4,5-bisphosphate into inositol
    1,4,5-trisphosphate and diacylglycerol, the two second messengers of the
    phosphoinositide pathway. Reduced hydrolysis leaves PIP2 elevated. PIP2 is
    not only a precursor but a direct regulator of actin-binding proteins at the
    plasma membrane, which is how a signalling-enzyme defect becomes a
    cytoskeletal one.
  biological_processes:
  - preferred_term: phosphatidylinositol-mediated signaling
    modifier: ABNORMAL
    term:
      id: GO:0048015
      label: phosphatidylinositol-mediated signaling
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This gene encodes phospholipase C β 3, an enzyme that converts phosphatidylinositol 4,5 bisphosphate (PIP2) to inositol 1,4,5 triphosphate (IP3) and diacylglycerol.
    explanation: >-
      Establishes the enzymatic reaction whose failure produces the substrate
      accumulation.
  downstream:
  - target: F-Actin Cytoskeletal Disorganisation
    description: >-
      Elevated PIP2 disorganises the F-actin cytoskeleton in patient
      fibroblasts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29122926
      reference_title: >-
        Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that this hypomorphic variant leads to elevated levels of PIP2 in patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
      explanation: >-
        States the causal link from PIP2 accumulation to cytoskeletal
        disorganisation.
- name: F-Actin Cytoskeletal Disorganisation
  biological_scale: CELLULAR
  description: >-
    The demonstrated cellular endpoint. Chondrocytes depend on actin
    organisation for their shape, their columnar arrangement in the growth plate
    and their mechanotransduction, and corneal stromal keratocytes depend on it
    for the lamellar collagen order that keeps the cornea clear - which makes
    this a plausible common route to the skeletal and corneal phenotypes,
    although the connection has not been shown in either tissue.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that this hypomorphic variant leads to elevated levels of PIP2 in patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
    explanation: >-
      The demonstrated cellular phenotype; the extension to chondrocytes and
      keratocytes is stated in this node as unproven.
  downstream:
  - target: Skeletal, Corneal and Neurodevelopmental Disease
    description: >-
      The clinical syndrome. The step from the fibroblast cytoskeletal defect to
      the affected tissues is inferred rather than demonstrated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29122926
      reference_title: >-
        Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results connect a homozygous loss of function variant in PLCB3 with a new SMD associated with corneal dystrophy and developmental delay (SMDCD).
      explanation: >-
        The authors claim a connection between the variant and the syndrome, not
        a demonstrated tissue mechanism, which is why this edge is indirect with
        unknown intermediates.

name: Spondylometaphyseal Dysplasia with Corneal Dystrophy
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia with corneal dystrophy (SMDCD; OMIM #618961) is an
  ultra-rare autosomal recessive skeletal dysplasia described in two Emirati first
  cousins and caused by a homozygous hypomorphic variant in PLCB3, encoding
  phospholipase C beta 3. The enzyme hydrolyses phosphatidylinositol
  4,5-bisphosphate to inositol 1,4,5-trisphosphate and diacylglycerol, so its
  impairment is a defect of phosphoinositide signalling rather than of a structural
  matrix protein. Affected infants are born preterm with profound limb shortening
  involving both proximal and distal segments, a narrow chest, and bilateral corneal
  clouding evident within days of birth; radiographs show short long bones with wide
  metaphyses, anterior vertebral beaking, and square short iliac bones. Intellectual
  disability is severe. The disease variant p.A878S sits in the Ha2' element of the
  proximal C-terminal domain, disrupts its binding to the catalytic core, and
  destabilises the protein; patient fibroblasts accumulate the substrate PIP2 and
  show a disorganised F-actin cytoskeleton strikingly similar to that of Lowe
  syndrome fibroblasts, which are also phosphoinositide-signalling mutants. SMDCD is
  one of only three spondylometaphyseal dysplasias with eye involvement, and the
  only one affecting the cornea rather than the retina.

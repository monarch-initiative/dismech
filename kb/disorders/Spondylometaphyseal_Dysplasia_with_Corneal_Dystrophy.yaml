name: Spondylometaphyseal dysplasia with corneal dystrophy
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia with corneal dystrophy (SMDCD) is an autosomal
  recessive skeletal dysplasia described in 2018 in two Emirati first cousins,
  combining profound limb shortening affecting both proximal and distal
  segments, a narrow chest, spinal, pelvic and metaphyseal changes, corneal
  clouding and intellectual disability. It is caused by a homozygous hypomorphic
  PLCB3 variant. PLCB3 encodes phospholipase C beta 3, which hydrolyses
  phosphatidylinositol 4,5-bisphosphate to inositol trisphosphate and
  diacylglycerol; the disease variant destabilises the enzyme by disrupting the
  proximal C-terminal domain's contact with the catalytic core, and patient
  fibroblasts accumulate PIP2 and show a disorganised F-actin cytoskeleton.
  The disorder is the second spondylometaphyseal dysplasia to be traced to a
  phospholipid pathway - the first being the PCYT1A-related cone-rod form - and
  the second in which an eye phenotype is part of the definition, which is what
  made PLCB3 a candidate in the first place.

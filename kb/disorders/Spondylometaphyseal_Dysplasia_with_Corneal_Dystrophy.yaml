biochemical: []
genetic:
- name: PLCB3
  association: Causal biallelic variant
  gene_term:
    preferred_term: PLCB3
    term:
      id: hgnc:9056
      label: PLCB3
  notes: >-
    A single homozygous hypomorphic variant, c.2632G>T, in one family. PLCB3 was
    selected as the candidate from four novel homozygous variants in the mapped
    interval because two other phospholipid-pathway genes, PLCB4 and PCYT1A,
    were already known to cause bone dysplasias with or without eye anomalies -
    a pathway-based inference rather than a statistical one.
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in genes involved in phospholipid metabolism, such as PLCB4 and PCYT1A, are known to cause bone dysplasia with or without eye anomalies, which led us to select PLCB3 as a strong candidate.
    explanation: >-
      The authors' own account of how the candidate was chosen, which is what
      makes the gene assignment pathway-based reasoning rather than segregation
      evidence alone.
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole exome sequencing, we identified four novel homozygous variants within the shared block of homozygosity.
    explanation: >-
      Documents that four candidate variants shared the homozygous block, which
      is the context for the candidate-selection step.

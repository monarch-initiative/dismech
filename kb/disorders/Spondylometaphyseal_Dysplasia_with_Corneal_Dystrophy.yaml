discussions:
- discussion_id: gap_smdcd_single_family_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does biallelic PLCB3 loss of function cause spondylometaphyseal dysplasia
    with corneal dystrophy in anyone outside the original family, and does the
    F-actin defect shown in fibroblasts actually operate in chondrocytes and
    corneal keratocytes?
  attaches_to:
  - genetic#PLCB3
  - pathophysiology#F-Actin Cytoskeletal Disorganisation
  - pathophysiology#Skeletal, Corneal and Neurodevelopmental Disease
  rationale: >-
    The disorder rests on one consanguineous family with two affected cousins,
    and PLCB3 was chosen from four homozygous candidate variants in the mapped
    interval on pathway reasoning rather than on independent segregation. The
    functional work is real but was done in dermal fibroblasts; no chondrocyte
    or corneal data exist, so the step from cytoskeletal disorganisation to the
    growth plate and the cornea is inference. A second unrelated family, or a
    demonstration of the same cellular defect in a skeletal or corneal cell
    type, would settle both questions at once.
  evidence:
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in genes involved in phospholipid metabolism, such as PLCB4 and PCYT1A, are known to cause bone dysplasia with or without eye anomalies, which led us to select PLCB3 as a strong candidate.
    explanation: >-
      The candidate-selection reasoning, which is what this gap asks to have
      independently confirmed.
  - reference: PMID:29122926
    reference_title: >-
      Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new form of spondylometaphyseal dysplasia.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that this hypomorphic variant leads to elevated levels of PIP2 in patient fibroblasts, causing disorganisation of the F-actin cytoskeleton.
    explanation: >-
      The functional result, obtained in fibroblasts rather than in either
      affected tissue.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cutaneous collagenous vasculopathy (CCV) is a rare idiopathic
        microangiopathy of the cutaneous vasculature characterized histologically
        by the presence of dilated small blood vessels with flat endothelial cells
        and thickened walls containing hyaline material in the upper dermis.
      explanation: >-
        Primary pathology of superficial dermal capillaries and postcapillary
        venules places CCV among microvascular disorders alongside dermatology.

diagnosis:
- name: Skin Biopsy with Periodic Acid-Schiff Histopathology
  description: >-
    Punch skin biopsy of affected telangiectatic skin is required to distinguish
    CCV from clinically indistinguishable generalized essential telangiectasia,
    demonstrating ectatic papillary dermal capillaries and postcapillary venules
    with PAS-positive, Congo-red-negative perivascular hyaline cuffs and absence
    of leukocytoclastic vasculitis.
  diagnosis_term:
    preferred_term: Skin Biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  presence: Dilated superficial dermal capillaries and postcapillary venules with PAS-positive hyaline vessel-wall thickening
  evidence:
  - reference: DOI:10.1097/DAD.0000000000000613
    reference_title: >-
      Cutaneous Collagenous Vasculopathy: Report of Two Cases Presenting as
      Disseminated Telangiectasias and Review of the Literature
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When faced with isolated acquired diffuse cutaneous telangiectasias,
      clinicians should perform a skin biopsy to rule out cutaneous collagenous
      vasculopathy.
    explanation: >-
      Establishes skin biopsy as essential to diagnose CCV in patients with
      acquired diffuse telangiectasias.
  - reference: DOI:10.1111/ajd.12444
    reference_title: >-
      Cutaneous collagenous vasculopathy: Report of first Japanese case and

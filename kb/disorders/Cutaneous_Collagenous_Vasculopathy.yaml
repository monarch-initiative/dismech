notes: >-
  Hypertension, cardiovascular disease, diabetes mellitus, and hyperlipidemia are
  the most commonly reported comorbidities in middle-aged and older adults with
  CCV; isolated cases have also been reported alongside hematologic or solid
  malignancy (multiple myeloma, pancreatic cancer), hypercoagulable states
  (prothrombin G20210A, cryofibrinogenemia, lupus anticoagulant), autoimmune
  serologies, or systemic medication exposures, although causal relationships to
  superficial dermal endothelial injury remain unestablished.

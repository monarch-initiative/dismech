treatments:
- name: Pulsed dye laser therapy
  description: >-
    Vascular laser photothermolysis (595-nm pulsed dye laser alone or multiplexed
    with 1064-nm Nd:YAG laser and intense pulsed light) selectively coagulates
    ectatic superficial dermal microvessels to clear cosmetically disfiguring
    telangiectatic patches.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Laser Therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_mechanisms:
  - target: Superficial Dermal Capillary and Postcapillary Venular Ectasia
    treatment_effect: MODULATES
    description: Selective vascular photothermolysis ablates dilated superficial dermal telangiectatic microvessels.
  evidence:
  - reference: DOI:10.1159/000439126
    reference_title: >-
      Cutaneous Collagenous Vasculopathy: A Rare Form of Microangiopathy
      Successfully Treated with a Combination of Multiplex Laser and Optimized
      Pulsed Light with a Review of the Literature
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with Multiplex PDL 595-nm/Nd:YAG 1,064-nm laser and
      optimized pulsed light. This approach, which has never been reported for
      CCV so far, resulted in a striking and almost complete clearance of the
      widespread lesions.
    explanation: >-
      Demonstrates near-complete clearance of widespread CCV telangiectatic
      lesions using 595-nm pulsed dye / 1064-nm Nd:YAG vascular laser and
      pulsed light therapy.
  - reference: DOI:10.12788/cutis.0892
    reference_title: Cutaneous Collagenous Vasculopathy With Ocular Involvement
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a patient with advanced CCV and ocular involvement that
      responded to a combination of pulsed dye laser (PDL) therapy and
      sclerotherapy for cutaneous lesions.
    explanation: >-
      Supports clinical response of CCV cutaneous lesions to pulsed dye laser
      therapy in combination with sclerotherapy.
- name: Polidocanol sclerotherapy
  description: >-
    Intravascular sclerotherapy with polidocanol has been used as an adjunct to
    pulsed dye laser therapy to obliterate refractory larger-caliber
    telangiectatic vessels on the lower extremities, although poor response to
    sclerotherapy has also been reported in an earlier case.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: sclerotherapy
    term:
      id: NCIT:C62732
      label: Sclerotherapy
    therapeutic_agent:
    - preferred_term: polidocanol
      term:
        id: CHEBI:46859
        label: polidocanol
  target_mechanisms:
  - target: Superficial Dermal Capillary and Postcapillary Venular Ectasia
    treatment_effect: MODULATES
    description: Endovenous sclerosant obliterates persistent ectatic superficial telangiectatic venules.
  evidence:
  - reference: DOI:10.12788/cutis.0892
    reference_title: Cutaneous Collagenous Vasculopathy With Ocular Involvement
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient did not achieve an adequate response with PDL, but the
      addition of sclerotherapy with polidocanol induced a successful response.
    explanation: >-
      Documents clearance of refractory CCV telangiectatic vessels following
      addition of polidocanol sclerotherapy to pulsed dye laser treatment.
  - reference: DOI:10.12788/cutis.0892
    reference_title: Cutaneous Collagenous Vasculopathy With Ocular Involvement
    supports: REFUTE
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One case report noted poor response to sclerotherapy.
    explanation: >-
      Documents a prior case report in which CCV lesions showed a poor response
      to sclerotherapy, qualifying efficacy expectations.

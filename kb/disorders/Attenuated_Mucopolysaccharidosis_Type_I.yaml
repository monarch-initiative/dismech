    explanation: >-
      Supports the phenotype-dependent difference in ventricular progression
      that distinguishes the attenuated cardiac picture from the severe one.
  downstream:
  - target: Mitral regurgitation
    causal_link_type: DIRECT
    description: Thickened, poorly mobile mitral leaflets regurgitate.
  - target: Aortic valve stenosis
    causal_link_type: DIRECT
    description: Aortic leaflet thickening produces left-sided outflow stenosis.
- name: Preserved central nervous system function
  biological_scale: ORGANISM
  description: >-
    A deliberately curated negative node. Preserved cognition is not the absence
    of a finding in attenuated MPS I - it is the defining feature, the thing
    that separates this entry from Hurler syndrome, and the reason the treatment
    algorithm differs. In a treated attenuated cohort followed for a median of
    ten years, 84 percent had normal cognitive development at last follow-up.
    Modeling this as a node rather than as prose keeps the contrast explicit in
    the pathograph: the heparan-sulfate arm of the storage hub terminates here
    rather than in neurodegeneration. It also has a direct clinical consequence,
    since it is why blood-brain-barrier penetration - the whole rationale for
    transplantation in severe MPS I - is not a requirement of therapy here.
  evidence:
  - reference: PMID:41353341
    reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the last follow-up, 84% attenuated patients had normal cognitive development."
    explanation: >-
      Quantifies preserved cognition in a followed attenuated cohort, which is
      the claim this node makes.
  - reference: PMID:41353341
    reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPS I is classified as severe (Hurler syndrome, OMIM#607014) with extensive multisystemic and CNS involvement, and attenuated ((Hurler/Scheie, OMIM#607015 and Scheie, OMIM#607016) with slower progression and minimal neurological involvement"
    explanation: >-
      States the severe-versus-attenuated classification in terms of CNS
      involvement, which is the basis for curating this as a node.
phenotypes:
- name: Limitation of joint mobility
  category: Musculoskeletal
  description: >-
    Progressive joint stiffness and contracture without inflammation, typically
    beginning in the small joints of the hand and producing the characteristic
    claw-hand deformity, then involving shoulders, elbows, hips, and knees. In
    the mildest patients this is the presenting and sometimes near-only feature,
    and it is the reason attenuated MPS I is repeatedly referred first to
    rheumatology as a suspected juvenile arthritis. The absence of joint
    inflammation and of raised inflammatory markers is what should redirect the
    workup.
  phenotype_term:
    preferred_term: Progressive joint stiffness and contracture
    term:
      id: HP:0001376
      label: Limitation of joint mobility
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:11172140
    reference_title: "Enzyme-replacement therapy in mucopolysaccharidosis I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean maximal range of motion of shoulder flexion and elbow extension increased significantly."
    explanation: >-
      Restricted shoulder and elbow range of motion at baseline, improving on
      therapy, documents joint mobility limitation in this MPS I treatment
      cohort.
- name: Constrictive median neuropathy
  category: Neurologic
  description: >-
    Carpal tunnel syndrome from GAG storage in the flexor retinaculum. Two
    features make it distinctive in MPS I and easy to miss. It develops far
    earlier than carpal tunnel syndrome in any other setting - median age of
    diagnosis 3.6 years, with the highest risk in the first six years of life -
    and it is usually clinically silent, so children do not report the
    paraesthesia that would prompt testing in an adult. Detection therefore
    depends on scheduled electrophysiological or ultrasound screening rather
    than on symptoms, and recurrence after carpal tunnel release is common.
  phenotype_term:
    preferred_term: Carpal tunnel syndrome
    term:
      id: HP:0012185
      label: Constrictive median neuropathy
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:41656624
    reference_title: "Carpal tunnel syndrome in mucopolysaccharidosis type I: clinical, surgical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-seven of 33 mucopolysaccharidosis type I patients, with a median age at the latest follow-up of 13 years (IQR 7.7 to 18.3), were diagnosed with carpal tunnel syndrome on electrophysiological tests or ultrasound at a median age of 3.6 years (IQR 2.8 to 5.2). Only a few patients exhibited clinical symptoms."
    explanation: >-
      Supplies the early median age at diagnosis and the clinically silent
      character. This cohort is all-MPS-I and not stratified by phenotype, so it
      supports the finding in MPS I generally rather than specifically in the
      attenuated arm.
  - reference: PMID:41656624
    reference_title: "Carpal tunnel syndrome in mucopolysaccharidosis type I: clinical, surgical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrence of carpal tunnel syndrome after carpal tunnel release surgery was common, occurring in 61.9% of patients."
    explanation: Documents the high recurrence rate after surgical release.
- name: Corneal opacity
  category: Ophthalmologic
  description: >-
    Progressive corneal clouding from stromal GAG deposition, which disrupts the
    collagen order responsible for corneal transparency. Present in attenuated
    as well as severe MPS I and, unlike in Hunter syndrome where corneal
    clouding is characteristically absent, it is a positive diagnostic clue.
    Slit-lamp examination in a child with unexplained joint stiffness is one of
    the cheapest ways to reach this diagnosis earlier than usual.
  phenotype_term:
    preferred_term: Progressive corneal clouding
    term:
      id: HP:0007957
      label: Corneal opacity
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32764324
    reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular manifestations of MPS I are caused by GAG deposits in the majority of ocular tissues and include corneal clouding, ocular hypertension/glaucoma, retinal degeneration, optic nerve swelling/atrophy"
    explanation: >-
      Documents corneal clouding, and the wider ocular involvement, as a
      consequence of ocular GAG deposition in MPS I.
- name: Mitral regurgitation
  category: Cardiovascular
  description: >-
    The commonest and earliest cardiac finding in attenuated MPS I, present in
    about three quarters of registry patients at a median age of 8 years.
    Thickened, poorly mobile leaflets regurgitate; the degree ranges from
    trivial to surgically significant.
  phenotype_term:
    preferred_term: Mitral regurgitation
    term:
      id: HP:0001653
      label: Mitral regurgitation
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:37850463
    reference_title: "Natural history of cardiac findings in mucopolysaccharidosis type I: report from an international registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mitral regurgitation was the most common and earliest finding for individuals with both severe (58.3%, median age 1.2 years) and attenuated (74.2%, median age 8.0 years) disease."
    explanation: >-
      Gives the attenuated-specific prevalence (74.2 percent) and median age
      (8.0 years) for mitral regurgitation.
- name: Aortic valve stenosis
  category: Cardiovascular
  description: >-
    Left-sided valve stenosis is common in attenuated MPS I, affecting the
    aortic valve in about a quarter and the mitral valve in about a third of
    registry patients. Aortic disease can eventually require valve replacement.
  phenotype_term:
    preferred_term: Aortic valve stenosis
    term:
      id: HP:0001650
      label: Aortic valve stenosis
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:37850463
    reference_title: "Natural history of cardiac findings in mucopolysaccharidosis type I: report from an international registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Left-sided valve stenosis was also common in individuals with attenuated disease (mitral 30.3%; aortic 25%)."
    explanation: >-
      Gives the attenuated-specific prevalence of aortic and mitral stenosis.
- name: Short stature
  category: Growth
  description: >-
    Growth deceleration rather than a fixed height deficit: height z-scores
    decline progressively through childhood, so the older the untreated patient,
    the greater the deficit. In the MPS I Registry the estimated average
    untreated height z-score at age 10 was -3.3 in females and -2.9 in males.
    This progressive character is what makes growth a usable treatment
    endpoint - enzyme replacement therapy slows the decline rather than
    correcting the deficit, and does so only when started early.
  phenotype_term:
    preferred_term: Progressive growth deceleration and short stature
    term:
      id: HP:0004322
      label: Short stature
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35869927
    reference_title: "Growth in individuals with attenuated mucopolysaccharidosis type I during untreated and treated periods: Data from the MPS I registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short stature and growth deceleration are common in individuals with the attenuated MPS I phenotype."
    explanation: >-
      States directly that short stature and growth deceleration characterize
      the attenuated phenotype specifically.
  - reference: PMID:35869927
    reference_title: "Growth in individuals with attenuated mucopolysaccharidosis type I during untreated and treated periods: Data from the MPS I registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Estimated average height z-scores in the ERT-treatment versus the natural history period at age 10 were -2.4 versus -3.3 in females and -1.4 versus -2.9 in males"
    explanation: >-
      Supplies the untreated height z-scores at age 10 quoted here, and the
      treated comparison.
- name: Dysostosis multiplex
  category: Skeletal
  description: >-
    The characteristic MPS skeletal complex - thickened calvaria, oar-shaped
    ribs, anterior vertebral beaking with thoracolumbar kyphosis, hypoplastic
    ilia, and proximally pointed metacarpals - present in attenuated as well as
    severe MPS I, though generally milder and later. Its recognition on a
    skeletal survey is often what converts a nonspecific orthopaedic referral
    into a metabolic one.
  phenotype_term:
    preferred_term: Dysostosis multiplex
    term:
      id: HP:0000943
      label: Dysostosis multiplex
  evidence:
  - reference: PMID:31211405
    reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestations are facial dysmorphism, hepatosplenomegaly, upper airway obstruction, skeletal deformity and cardiomyopathy."
    explanation: >-
      Lists skeletal deformity among the defining clinical manifestations of
      MPS I across its subtypes.
- name: Hepatosplenomegaly
  category: Gastrointestinal
  description: >-
    Storage-related organomegaly, present in attenuated MPS I though usually
    less marked than in Hurler syndrome. It is among the most enzyme-responsive
    features: liver size normalized for body weight and age in the majority of
    patients within 26 weeks of starting laronidase.
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:11172140
    reference_title: "Enzyme-replacement therapy in mucopolysaccharidosis I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hepatosplenomegaly decreased significantly in all patients, and the size of the liver was normal for body weight and age in eight patients by 26 weeks."
    explanation: >-
      Documents hepatosplenomegaly at baseline in this MPS I cohort and its
      responsiveness to enzyme replacement.
- name: Obstructive sleep apnea
  category: Respiratory
  description: >-
    Upper airway storage narrows the pharynx and produces obstructive sleep
    apnoea, which contributes to daytime somnolence, pulmonary hypertension, and
    perioperative risk. Sleep-disordered breathing responds partially to enzyme
    replacement therapy, with about a 60 percent reduction in apnoea-hypopnoea
    events reported in the original trial cohort.
  phenotype_term:
    preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea
  frequency: FREQUENT
  evidence:
  - reference: PMID:11172140
    reference_title: "Enzyme-replacement therapy in mucopolysaccharidosis I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The number of episodes of apnea and hypopnea during sleep decreased 61 percent."
    explanation: >-
      Documents sleep-disordered breathing at baseline and its partial response
      to enzyme replacement therapy.
- name: Reduced vital capacity
  category: Respiratory
  description: >-
    Combined restrictive and obstructive respiratory impairment from thoracic
    cage stiffness, spinal deformity, and airway storage. Forced vital capacity
    is the primary endpoint on which laronidase was licensed, and it is the
    respiratory measure that best tracks disease burden in attenuated patients.
  phenotype_term:
    preferred_term: Reduced forced vital capacity
    term:
      id: HP:0002792
      label: Reduced vital capacity
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:31211405
    reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The laronidase group achieved statistically significant improvements in per cent predicted forced vital capacity compared to placebo, MD 5.60 (95% confidence intervals 1.24 to 9.96)"
    explanation: >-
      Establishes reduced forced vital capacity as the licensing endpoint and
      documents its partial reversibility.
- name: Spinal cord compression
  category: Neurologic
  description: >-
    Storage in the craniocervical ligaments, dura, and spinal canal narrows the
    canal and can compress the cord. This is the most important
    surveillance-dependent complication in attenuated MPS I: it is insidious,
    it is a leading cause of avoidable disability, and it is not prevented by
    enzyme replacement therapy, which does not clear storage from these tissues
    effectively. Craniocervical imaging is therefore part of routine monitoring
    regardless of therapy.
  phenotype_term:
    preferred_term: Cervical cord compression from craniocervical storage
    term:
      id: HP:0002176
      label: Spinal cord compression
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:19117856
    reference_title: "Mucopolysaccharidosis I: management and treatment guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with mucopolysaccharidosis I should receive a comprehensive baseline evaluation, including neurologic, ophthalmologic, auditory, cardiac, respiratory, gastrointestinal, and musculoskeletal assessments, and should be monitored every 6 to 12 months"
    explanation: >-
      Supports the surveillance basis for detecting neurologic complications
      including cord compression. The specific neurological mechanism is stated
      in prose rather than claimed from this quote.
- name: Hearing impairment
  category: Otologic
  description: >-
    Mixed conductive and sensorineural hearing loss from middle-ear storage,
    recurrent effusions, and ossicular and cochlear involvement. Common enough
    that audiological assessment is part of the baseline and surveillance
    protocol.
  phenotype_term:
    preferred_term: Mixed conductive and sensorineural hearing loss
    term:
      id: HP:0000365
      label: Hearing impairment
  evidence:
  - reference: PMID:41353341
    reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ERT provided stable or consistent improvement in forced vital capacity, slowed progression of adverse cardiac course and improved auditory transmission in majority of the severe and attenuated patients."
    explanation: >-
      Documents auditory involvement as a tracked manifestation in attenuated as
      well as severe patients, and its partial response to therapy.
- name: Coarse facial features
  category: Craniofacial
  description: >-
    Coarse facies is present in attenuated MPS I but is milder and later than in
    Hurler syndrome, and in the mildest Scheie patients may be minimal or
    absent. Its subtlety is one reason attenuated MPS I is missed: the
    gestalt cue that prompts a clinician to think "storage disorder" is weak or
    unavailable.
  phenotype_term:
    preferred_term: Mild coarse facial features
    term:
      id: HP:0000280
      label: Coarse facial features
  frequency: FREQUENT
  evidence:
  - reference: PMID:31211405
    reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestations are facial dysmorphism, hepatosplenomegaly, upper airway obstruction, skeletal deformity and cardiomyopathy."
    explanation: >-
      Lists facial dysmorphism among the defining manifestations of MPS I. The
      attenuated-specific mildness is stated in prose, not claimed from this
      quote.
- name: Developmental Regression Absent
  category: Neurologic
  frequency: EXCLUDED
  diagnostic: true
  description: >-
    The exclusion that defines this entry and separates it from Hurler
    syndrome. Attenuated MPS I patients do not lose acquired skills: in a
    25-patient attenuated cohort followed for a median of ten years, none
    developed cognitive regression.

    This is deliberately curated as regression rather than as intellectual
    disability, and the distinction matters. Cognitive impairment is *not*
    excluded in attenuated MPS I - 16 percent of that same cohort had cognitive
    impairment before enzyme replacement therapy, and mild learning difficulty
    is recognised at the Hurler-Scheie end of the spectrum. What is excluded is
    the progressive neurodegenerative course. Asserting "normal intelligence" as
    an excluded phenotype here would overclaim and would contradict the cohort
    data; asserting absent regression does not.
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
    modifier: ABSENT
  evidence:
  - reference: PMID:41353341
    reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one (84%) of the 25 patients had normal cognitive development, and none of the patients developed cognitive regression."
    explanation: >-
      States directly that no patient in the attenuated cohort developed
      cognitive regression, and in the same sentence gives the 84 percent
      normal-cognition figure that is the reason intellectual disability is not
      also curated as an exclusion here.
biochemical:
- name: Urinary glycosaminoglycans
  presence: Elevated
  context: >-
    Total urinary GAG excretion is elevated, with dermatan and heparan sulfate
    the species involved. Unlike MPS X, the signal in MPS I is large enough to
    be detected by routine screening, so urinary GAG remains a useful first-line
    test. It is also the standard pharmacodynamic marker: excretion falls within
    three to four weeks of starting laronidase and the reduction is used to
    confirm biochemical response. In a long-term attenuated cohort, enzyme
    replacement therapy reduced urinary GAG by 71 percent, with 65 percent of
    attenuated patients reaching normal age-related levels.
  evidence:
  - reference: PMID:11172140
    reference_title: "Enzyme-replacement therapy in mucopolysaccharidosis I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urinary glycosaminoglycan excretion decreased after 3 to 4 weeks of treatment; the mean reduction was 63 percent of base-line values."
    explanation: >-
      Documents baseline urinary GAG elevation and the timing and magnitude of
      its fall on therapy.
  - reference: PMID:41353341
    reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ERT reduced the GAGus levels by 88% in severe MPS I and by 71% in attenuated MPS I, of which 47% and 65% patients, respectively achieved normal age-related GAG levels at the last follow-up."
    explanation: >-
      Supplies the attenuated-specific reduction and normalization figures
      quoted here.
- name: Leukocyte alpha-L-iduronidase activity
  presence: Reduced
  context: >-
    Reduced but not absent, which is the biochemical definition of the
    attenuated arm. Leukocyte or fibroblast enzyme assay is the confirmatory
    test after an abnormal urinary GAG screen or a positive newborn screen. The
    residual activity level correlates only loosely with phenotype in an
    individual patient, so enzyme activity alone does not reliably predict
    severe versus attenuated disease; genotype is the better predictor, and
    both are used together.
  evidence:
  - reference: PMID:11172140
    reference_title: "Enzyme-replacement therapy in mucopolysaccharidosis I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mucopolysaccharidosis I is a lysosomal storage disease caused by a deficiency of the enzyme alpha-L-iduronidase."
    explanation: >-
      States the enzyme deficiency that this assay measures. The previous quote
      here named the measurement without asserting a result, which is a method
      label rather than a finding.
genetic:
- name: IDUA pathogenic variants
  gene_term:
    preferred_term: IDUA
    term:
      id: hgnc:5391
      label: IDUA
  association: Causative
  inheritance:
  - name: Autosomal recessive
    description: Biallelic IDUA variants with at least one residual-activity allele.
    evidence:
    - reference: PMID:31211405
      reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is a rare, autosomal recessive disorder caused by a deficiency of alpha-L-iduronidase."
      explanation: States the inheritance mode and deficient enzyme.
  features: >-
    IDUA (hgnc:5391, chromosome 4p16.3) encodes alpha-L-iduronidase. Genotype is
    the strongest available predictor of position on the MPS I spectrum, and the
    prediction is directional rather than precise: two null alleles - nonsense
    variants or deletions - give severe disease, while attenuated disease
    requires at least one allele that retains some enzyme activity, typically a
    missense variant. The clinical stakes of this prediction have risen with
    newborn screening, since a screen-positive infant must be assigned a
    predicted phenotype before symptoms exist in order to choose between
    transplantation and enzyme replacement therapy. Prediction from genotype is
    nonetheless imperfect for individual novel variants, which is why ClinGen's
    lysosomal diseases expert panel has published an IDUA-specific ACMG/AMP
    variant classification specification.
  evidence:
  - reference: PMID:32764324
    reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe disease, i.e., MPS-IH, is caused by absence or extremely low levels of IDUA, associated with genotypes such as deletions and nonsense mutations."
    explanation: >-
      Supports the genotype-phenotype direction: null genotypes give severe
      disease, so attenuated disease implies residual-activity alleles.
  - reference: PMID:32764324
    reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is now appreciated that MPS I exists as a spectrum of disorders from an attenuated version to severe with many phenotypes in between."
    explanation: >-
      Supports the qualification this features text carries. Marked INDIRECT
      because the quote asserts a phenotypic continuum, from which the curated
      claim - that genotype predicts direction along the spectrum but not an
      individual patient's course - follows by an inference step rather than
      being stated outright.
diagnosis:
- name: Urinary glycosaminoglycan screening followed by enzyme assay and IDUA sequencing
  description: >-
    The conventional symptomatic diagnostic pathway. Elevated urinary GAG with
    a dermatan-and-heparan-sulfate pattern prompts leukocyte or fibroblast
    alpha-L-iduronidase assay, and biallelic IDUA variants confirm the
    diagnosis and inform the severe-versus-attenuated prediction. The
    limitation of this pathway in attenuated MPS I is not sensitivity but
    initiation: someone has to think of it. The presenting complaints - stiff
    joints, a hernia, a heart murmur, carpal tunnel syndrome, corneal haze - are
    each individually unremarkable and are usually managed by separate
    specialties, so the diagnosis often follows years of specialist care for the
    parts.
  evidence:
  - reference: PMID:11172140
    reference_title: "Enzyme-replacement therapy in mucopolysaccharidosis I."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urinary glycosaminoglycan excretion decreased after 3 to 4 weeks of treatment; the mean reduction was 63 percent of base-line values."
    explanation: >-
      Establishes urinary glycosaminoglycan excretion as a quantitative measure
      that is elevated at baseline and falls on therapy, which is what makes it
      usable as the screening arm of this pathway. Replaces a bare
      method-naming phrase that asserted no result.
- name: Comprehensive baseline multisystem evaluation and 6-to-12-month surveillance
  description: >-
    The consensus management framework, and in attenuated MPS I it is arguably
    more consequential than any single test, because the complications that
    determine outcome - cord compression, valve disease, respiratory decline,
    carpal tunnel syndrome - are silent until late and several are not prevented
    by enzyme replacement therapy. Baseline evaluation covers neurologic,
    ophthalmologic, auditory, cardiac, respiratory, gastrointestinal, and
    musculoskeletal systems, repeated every 6 to 12 months by a
    multidisciplinary team.
  evidence:
  - reference: PMID:19117856
    reference_title: "Mucopolysaccharidosis I: management and treatment guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with mucopolysaccharidosis I should receive a comprehensive baseline evaluation, including neurologic, ophthalmologic, auditory, cardiac, respiratory, gastrointestinal, and musculoskeletal assessments, and should be monitored every 6 to 12 months with individualized specialty assessments, to monitor disease progression and effects of intervention."
    explanation: >-
      States the baseline evaluation and surveillance interval this entry
      records as the management framework.
- name: Carrier testing and prenatal testing
  description: >-
    Once both familial IDUA variants are known, carrier testing can be offered
    to at-risk relatives and prenatal testing to pregnancies at increased risk.
    Molecular confirmation in the proband is therefore worth completing even
    where the diagnosis is already secure biochemically, because it is what
    makes counselling of the wider family possible. The recurrence risk being
    counselled is the standard autosomal recessive one - a one-in-four chance of
    an affected child for each pregnancy of a heterozygous couple.
  evidence:
  - reference: PMID:20301341
    reference_title: "Mucopolysaccharidosis Type I."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier testing for at-risk relatives and prenatal testing for pregnancies
      at increased risk are possible if both disease-causing IDUA variants have
      been identified in the family.
    explanation: >-
      States the availability of carrier and prenatal testing and the condition
      on which it depends - prior identification of both familial variants.
- name: Severe-versus-attenuated phenotype determination
  description: >-
    Not a test so much as the decision the tests feed, and the GeneReviews
    chapter places it first in management for the same reason this entry is
    curated separately from Hurler syndrome: it selects the therapy. Genotype,
    age at presentation, and developmental trajectory are combined to predict
    which arm of the spectrum a patient sits on, and with newborn screening that
    prediction increasingly has to be made before any symptom exists.
  evidence:
  - reference: PMID:20301341
    reference_title: "Mucopolysaccharidosis Type I."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An essential component of management is the determination of whether the
      proband has severe or attenuated MPS I.
    explanation: >-
      Identifies the severe-versus-attenuated determination as the first step in
      management of a newly diagnosed proband.
treatments:
- name: Laronidase enzyme replacement therapy
  description: >-
    Weekly intravenous recombinant human alpha-L-iduronidase, and the
    appropriate first-line disease-modifying therapy for attenuated MPS I. The
    reasoning is the mirror image of the severe case: laronidase does not cross
    the blood-brain barrier, which disqualifies it as sole therapy in
    neuronopathic MPS I, but in attenuated disease there is no CNS component to
    treat, so its inability to reach the brain costs nothing while its low
    procedural risk relative to transplantation counts for a great deal. In the
    pivotal randomized trial it improved percent-predicted forced vital capacity
    and six-minute walk distance and reduced urinary GAG; in long-term cohorts
    it stabilizes respiratory function, slows adverse cardiac progression,
    improves auditory transmission, and slows the decline in height z-scores
    when begun before about 9 years of age. What it does not do is reverse
    established skeletal, corneal, valvular, or spinal disease, which is why
    time to diagnosis dominates outcome. Infusion reactions are common but mild,
    and anti-laronidase antibodies develop in most treated patients without
    apparent clinical effect.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: laronidase
      term:
        id: NCIT:C83864
        label: Laronidase
  evidence:
  - reference: PMID:31211405
    reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The laronidase group achieved statistically significant improvements in per cent predicted forced vital capacity compared to placebo, MD 5.60 (95% confidence intervals 1.24 to 9.96) (low-quality evidence) and in the six-minute-walk test (mean improvement of 38.1 metres in the laronidase group; P = 0.039, when using a prospectively planned analysis of covariance) (low-quality evidence)."
    explanation: >-
      The randomized placebo-controlled efficacy evidence for laronidase on the
      two functional endpoints.

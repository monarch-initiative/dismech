        Early placement of ventilating tubes is recommended in severely affected individuals. Hearing aids should
        also be considered.
      explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Sleep and airway support
  description: >-
    Evaluate obstructive and possible central sleep-disordered breathing. Selected patients require positive airway
    pressure, supplementary oxygen or tracheostomy; requirements are individualized rather than inferred from a
    pooled MPS I frequency.
  therapeutic_modality: OTHER
  treatment_term: *id014
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sleep apnea may require tracheotomy or high-pressure continuous positive airway pressure with supplemented
      oxygen. Tracheostomy is often required to maintain the airway and control pulmonary hypertension and right
      heart failure.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Upper Airway Narrowing
    treatment_effect: BYPASSES
    description: Positive airway pressure supports patency, while tracheostomy can bypass an obstructed upper airway.

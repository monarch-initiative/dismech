    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 24 patients were homozygous for P533R; seven classified as severe and 17 classified as attenuated.
    explanation: The same homozygous genotype occurred in both clinical categories.

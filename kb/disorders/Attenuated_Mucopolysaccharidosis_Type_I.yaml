inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic IDUA variants cause disease. When both parents are confirmed carriers, each pregnancy has
    a 25% recurrence risk. Carrier enzyme testing is unreliable; familial molecular testing supports reproductive
    counseling.
  evidence:
  - &id011
    reference: PMID:20301341
    reference_title: Mucopolysaccharidosis Type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: MPS I is inherited in an autosomal recessive manner.
    explanation: Inheritance mode summarized in GeneReviews.
pathophysiology:
- name: Biallelic IDUA Pathogenic Variants
  description: >-
    Pathogenic variants in both IDUA alleles underlie the attenuated clinical spectrum. Allele-specific residual
    function varies, and clinical severity is not determined by a single enzyme-activity cutoff.
  biological_scale: MOLECULAR
  evidence:
  - &id002
    reference: PMID:32764324
    reference_title: 'Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mucopolysaccharidosis type I (MPS I) is a rare autosomal recessive inherited disease, caused by deficiency
      of the enzyme α-L-iduronidase, resulting in accumulation of the glycosaminoglycans (GAGs) dermatan and heparan
      sulfate in organs and tissues
    explanation: Established MPS I enzyme and storage mechanism; not a subtype-specific activity threshold.
  - &id012
    reference: PMID:31194252
    reference_title: >-

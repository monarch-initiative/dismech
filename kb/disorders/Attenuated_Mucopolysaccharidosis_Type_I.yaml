  discussion_id: inflammatory_therapy_evidence_is_not_attenuated_specific
  rationale: >-
    A small adalimumab crossover pilot in the tissue review enrolled one post-transplant Hurler patient and one
    patient with attenuated MPS II. It did not demonstrate treatment efficacy in attenuated MPS I. Parent-reported
    pain and some range-of-motion findings favored active treatment, but another pain measure, walking distance
    and handgrip did not improve, one family was effectively unblinded and safety follow-up was short. This supports
    further research rather than routine anti-TNF care or a proven human TLR4-to-TNF causal cascade.
  prompt: Does anti-inflammatory treatment benefit attenuated MPS I beyond existing care?

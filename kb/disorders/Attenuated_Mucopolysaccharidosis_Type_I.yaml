- name: Hematopoietic stem cell transplantation
  description: >-
    Not the standard of care in attenuated MPS I, and the reason why is worth
    stating explicitly because it is the opposite of the severe case. The
    rationale for transplantation in MPS I is that donor-derived cells cross
    into the central nervous system and supply enzyme there, preserving
    cognition - a benefit that only exists if there is neuronopathic disease to
    prevent, and one bought at the cost of transplant-related morbidity and
    mortality. In attenuated MPS I cognition is already preserved, so that
    benefit is unavailable while the risk is unchanged, and enzyme replacement
    therapy is preferred. The guideline frames the choice explicitly in terms of
    age, predicted phenotype, and developmental quotient. Transplantation
    remains under consideration in individual attenuated patients with severe
    progressive somatic disease inadequately controlled on enzyme replacement.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:19117856
    reference_title: "Mucopolysaccharidosis I: management and treatment guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's age (>2 years or < or =2 years), predicted phenotype, and developmental quotient help define the risk/benefit profile for hematopoietic stem cell transplantation (higher risk but can preserve central nervous system function) versus enzyme replacement therapy (low risk but cannot cross the blood-brain barrier)."
    explanation: >-
      States the exact risk-benefit reasoning this treatment entry records,
      including that the transplantation advantage is central nervous system
      preservation and that enzyme replacement cannot cross the blood-brain
      barrier.
- name: Carpal tunnel release
  description: >-
    Surgical decompression of the median nerve, indicated on
    electrophysiological or ultrasound findings rather than on symptoms, since
    carpal tunnel syndrome in MPS I is usually clinically silent in children.
    Recurrence after release is common - about 62 percent in one cohort - so a
    single operation should not be treated as definitive and continued screening
    is required afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:41656624
    reference_title: "Carpal tunnel syndrome in mucopolysaccharidosis type I: clinical, surgical and histopathological findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one patients underwent carpal tunnel release and 13 patients experienced recurrence."
    explanation: >-
      Documents surgical release as standard practice and quantifies the
      recurrence that qualifies it. As with the phenotype use of this paper,
      the cohort is all-MPS-I and not stratified by phenotype - it includes
      transplanted, therefore severe, patients - so the recurrence rate is an
      MPS I figure rather than an attenuated-specific one.
- name: Multidisciplinary supportive and surveillance care
  description: >-
    Attenuated MPS I generates a long list of manageable complications that no
    single specialty owns: orthopaedic care for joints and spine, cardiology for
    valve disease and eventual valve surgery, ENT and respiratory care for
    airway obstruction and sleep apnoea, ophthalmology for corneal disease and
    glaucoma, audiology, physiotherapy, and anaesthetic risk assessment. The
    guideline is explicit that patients are best treated by a multidisciplinary
    team, and in practice the coordination is as much of the treatment as any
    single intervention.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:19117856
    reference_title: "Mucopolysaccharidosis I: management and treatment guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are best treated by a multidisciplinary team. Treatments consist of palliative/supportive care, hematopoietic stem cell transplantation, and enzyme replacement therapy."
    explanation: >-
      States the multidisciplinary model and the three treatment modalities for
      MPS I.
differential_diagnoses:
- name: Hurler syndrome
  description: >-
    The same enzyme deficiency at the severe end of the spectrum. The
    distinction is not academic: it determines whether the patient is referred
    for transplantation or started on enzyme replacement therapy, and with
    newborn screening it must now often be made before any symptom has appeared.
    Genotype is the strongest predictor, supported by age at presentation and
    developmental trajectory.
  distinguishing_features:
  - Normal early development with preserved cognition favors attenuated MPS I.
  - Onset after infancy, often in later childhood or adulthood, favors attenuated MPS I.
  - Two null IDUA alleles (nonsense or deletion) favor Hurler syndrome.
  - Developmental regression in the first years of life favors Hurler syndrome.
  disease_term:
    preferred_term: Hurler syndrome
    term:
      id: MONDO:0011758
      label: Hurler syndrome
  evidence:
  - reference: PMID:41353341
    reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPS I is classified as severe (Hurler syndrome, OMIM#607014) with extensive multisystemic and CNS involvement, and attenuated ((Hurler/Scheie, OMIM#607015 and Scheie, OMIM#607016) with slower progression and minimal neurological involvement"
    explanation: >-
      States the classification and the CNS-involvement basis on which the two
      arms are distinguished.
- name: Hunter syndrome
  description: >-
    Attenuated MPS II is the closest clinical mimic of attenuated MPS I: the
    same two stored GAGs, the same somatic picture of joint stiffness, valve
    disease, airway obstruction, and dysostosis multiplex, and preserved
    cognition in the attenuated form. The two most useful discriminators are
    the absence of corneal clouding in MPS II and its X-linked inheritance, so
    a boy with an affected maternal uncle and clear corneas points to Hunter
    syndrome. Enzyme assay settles it.
  distinguishing_features:
  - Corneal clouding is characteristically absent in Hunter syndrome and present in MPS I.
  - X-linked inheritance and male-only affected relatives favor Hunter syndrome.
  - Deficient iduronate-2-sulfatase with normal alpha-L-iduronidase is definitive for Hunter syndrome.
  disease_term:
    preferred_term: Hunter syndrome
    term:
      id: MONDO:0010674
      label: mucopolysaccharidosis type 2
- name: Juvenile idiopathic arthritis
  description: >-
    The commonest wrong turn in the attenuated MPS I diagnostic pathway. A child
    with progressive stiffness of the small joints of the hand, restricted
    shoulders, and reduced function is a plausible juvenile arthritis referral,
    and the diagnosis is often held for years. The discriminating observation is
    that MPS joint disease is not inflammatory: there is stiffness and
    contracture without joint swelling, without warmth or effusion, and without
    raised inflammatory markers, and it does not respond to anti-inflammatory
    therapy.
  distinguishing_features:
  - Stiffness and contracture without joint swelling, warmth, or effusion favors MPS I.
  - Normal inflammatory markers with progressive contracture favors MPS I.
  - Corneal clouding, a heart murmur, or dysostosis multiplex on radiographs favors MPS I.
  - Absence of response to anti-inflammatory therapy favors MPS I.
- name: Maroteaux-Lamy syndrome
  description: >-
    MPS VI shares preserved intelligence with attenuated MPS I and produces a
    similar somatic picture with dysostosis multiplex, corneal clouding, valve
    disease, and carpal tunnel syndrome. It stores dermatan sulfate only, not
    heparan sulfate, so the urinary GAG pattern differs, and the deficient
    enzyme is arylsulfatase B.
  distinguishing_features:
  - Isolated dermatan sulfate excretion without heparan sulfate favors MPS VI.
  - Deficient arylsulfatase B with normal alpha-L-iduronidase is definitive for MPS VI.
  disease_term:
    preferred_term: Maroteaux-Lamy syndrome
    term:
      id: MONDO:0009661
      label: mucopolysaccharidosis type 6
prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 1.0
  notes: >-
    The quoted figure is for MPS I as a whole, approximately 1 per 100,000 live
    births, of which the attenuated forms are a substantial minority; no
    attenuated-specific birth prevalence is separately established here.
    Attenuated MPS I is likely underascertained in symptom-based case series,
    because mild disease can go undiagnosed into adulthood; newborn-screening
    cohorts are expected to give better estimates but also detect
    pseudodeficiency alleles and late-onset variants that complicate the
    denominator.

  downstream:
  - target: Extracellular matrix and collagen disorganization in connective tissue
    causal_link_type: DIRECT
    description: >-
      Accumulated dermatan sulfate proteoglycans disrupt the regulation of
      collagen fibril assembly in cartilage, tendon, cornea, and valve, which is
      the proximate cause of the connective-tissue disease.
    evidence:
    - reference: PMID:32764324
      reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The binding of proteoglycans to collagen regulates the lateral association of collagen molecules into proper fibrils, and protects collagen fibrils from proteolysis by sterically limiting the access of collagenases to their cleavage sites."
      explanation: >-
        Gives the mechanism by which dermatan sulfate proteoglycan
        dysregulation translates into disordered collagen architecture.
  - target: Preserved central nervous system function
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Residual enzyme activity keeps cerebral heparan sulfate storage below the
      threshold that causes neurodegeneration, so cognition is preserved. This
      is the defining negative feature of the attenuated arm.
    evidence:
    - reference: PMID:41353341
      reference_title: "Clinical outcomes of exclusive enzyme therapy (laronidase) in a cohort of patients with mucopolysaccharidosis type I."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hurler-Scheie and Scheie syndromes span a wide phenotypic spectrum, with mild or no cognitive impairment, progressive somatic and skeletal manifestations that significantly impact quality of life"
      explanation: >-
        States the defining combination of preserved cognition with progressive
        somatic disease that this node and its sibling encode.
- name: Extracellular matrix and collagen disorganization in connective tissue
  biological_scale: TISSUE
  description: >-
    The engine of attenuated MPS I. GAG-laden cells and excess extracellular
    dermatan sulfate distort collagen architecture in every tissue where
    dermatan sulfate proteoglycans regulate fibril assembly, and the clinical
    manifestations map onto that tissue list almost one for one: cornea
    (clouding, loss of transparency), cartilage and bone (dysostosis multiplex,
    short stature), tendon and joint capsule (stiffness, contracture, claw
    hand), flexor retinaculum (carpal tunnel syndrome), cardiac valve (thickened
    immobile leaflets with regurgitation and stenosis), airway and thoracic cage
    (obstructive and restrictive respiratory disease), and the craniocervical
    junction and spinal canal (cord compression). Because the process is
    additive rather than episodic, it progresses steadily over decades, which is
    why disease burden in attenuated MPS I is a function of how long the patient
    went undiagnosed.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Recovery from anesthesia may be slow and postoperative airway obstruction is a common problem.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Educational and developmental support
  description: >-
    Assess cognition and educational needs over time and provide individualized learning support. Normal early development
    does not remove the need for later review.
  therapeutic_modality: OTHER
  treatment_term: *id014
  evidence:
  - reference: PMID:20301341
    reference_title: Mucopolysaccharidosis Type I.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infant learning programs/special education for developmental delay; physical therapy, orthopedic surgery as
      needed, joint replacement for progressive arthropathy, atlanto-occipital stabilization; spinal cord decompression
      for cervical myelopathy
    explanation: >-
      GeneReviews supportive-care summary; the developmental component is relevant when individual needs are identified.
  target_mechanisms:

      Storage in the craniocervical ligaments and spinal canal narrows the canal
      and can compress the cord, a major cause of disability if unrecognised.
- name: Cardiac valve storage disease
  biological_scale: TISSUE
  description: >-
    Valvular disease is near-universal in attenuated MPS I and starts earlier
    than the diagnosis usually does. In the international MPS I Registry,
    mitral regurgitation was the commonest and earliest echocardiographic
    finding in attenuated patients, present in about three quarters of them at a
    median age of 8 years, and left-sided valve stenosis was also common
    (mitral 30 percent, aortic 25 percent). The pattern of progression differs
    from severe MPS I: ventricular wall and septal thickness z-scores rise with
    age in the severe phenotype but not in the attenuated one, so the attenuated
    arm is a valve disease rather than a progressive infiltrative cardiomyopathy.
    In practice this makes echocardiography a reasonable first-line
    investigation in a child with unexplained joint stiffness and corneal
    haze - the murmur is often there before anyone has thought of a storage
    disorder.
  locations:
  - preferred_term: cardiac valve
    term:
      id: UBERON:0000946
      label: cardiac valve
  - preferred_term: mitral valve

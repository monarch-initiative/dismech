- name: Audiologic and ENT support
  description: >-
    Identify conductive and sensorineural contributors, offer hearing aids, and consider ventilation tubes or upper-airway
    surgery where indicated. ENT procedures require disease-experienced anesthesia planning.
  therapeutic_modality: OTHER
  treatment_term: *id014
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tonsillectomy and adenoidectomy correct eustachian tube dysfunction and decrease upper airway obstruction.
      Early placement of ventilating tubes is recommended in severely affected individuals. Hearing aids should
      also be considered.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Hearing impairment
    treatment_effect: MODULATES
    description: Hearing aids and treatment of selected conductive contributors support hearing.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/

discussions:
- evidence:
  - *id020
  - &id022
    reference: PMID:31839529
    reference_title: >-
      Intrathecal enzyme replacement for cognitive decline in mucopolysaccharidosis type I, a randomized, open-label,
      controlled pilot study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Nor was there a significant difference between treatment and control groups in any of the neuropsychological
      tests. Subjects in the control group did not experience any significant decline over the 12 month untreated
      period in any neuropsychological test except the Brief Visuospatial Memory Test, where the treatment group
      also experienced decline.
    explanation: >-
      Eight-person randomized open-label pilot with ongoing intravenous ERT; no demonstrated cognitive benefit in
      this design.
  discussion_id: cognitive_and_treatment_heterogeneity
  rationale: >-
    Attenuated disease is not synonymous with absence of CNS involvement. In the French cohort, 21 of 25 had normal
    cognition, but four had pre-ERT impairment. The small intrathecal laronidase trial found no treatment-associated
    cognitive improvement; it does not establish that intrathecal delivery can never work. Eight participants, short
    controlled follow-up, stable controls and lack of a human brain-uptake assay limit interpretation.
  prompt: What predicts cognitive involvement and treatment responsiveness within attenuated MPS I?
  kind: INTERPRETATION
  status: OPEN
- evidence:
  - reference: PMID:37850463
    reference_title: >-
      Natural history of cardiac findings in mucopolysaccharidosis type I: report from an international registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All available echocardiography assessments completed prior to treatment initiation were used.
    explanation: Treatment censoring defines the natural-history period.
  - reference: PMID:37850463
    reference_title: >-
      Natural history of cardiac findings in mucopolysaccharidosis type I: report from an international registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Left ventricular hypertrophy of the posterior wall was the most common finding in both phenotypes (47.7 and
      31% in severe and attenuated, respectively).
    explanation: Primary echo finding; wall thickening is not histologic proof of infiltration.
  - reference: PMID:37850463
    reference_title: >-
      Natural history of cardiac findings in mucopolysaccharidosis type I: report from an international registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cardiac data elements did not include other components of more recent interest such as aortic dimensions,
      aortic root dilation, strain, and diastolic function.
    explanation: Missing cardiac domains limit mechanistic and prognostic inference.
  discussion_id: cardiac_natural_history_and_source_limitations
  rationale: >-
    The cardiac registry uses echocardiograms obtained before ERT or HSCT. It therefore does not demonstrate treatment-related
    stabilization. Valve findings are ever-observed during irregular follow-up, not graded incident events. Among
    attenuated patients, posterior-wall hypertrophy occurred in 27 of 87 with measurements, septal hypertrophy in
    14 of 86 and low shortening fraction in seven of 104. Normal group averages and stable modeled trajectories
    do not exclude individual myocardial involvement; histology, cardiac MRI, strain and diastolic measurements
    were unavailable.
  prompt: >-
    What can untreated echocardiographic registry findings establish about myocardial disease and treatment effects?
  kind: INTERPRETATION
  status: OPEN
- evidence:
  - *id010
  - *id012
  discussion_id: residual_activity_genotype_and_evidence_boundaries
  rationale: >-
    The enzyme-activity study uses a small number of cultured-cell lines and overlapping residual ranges, while
    the genotype registry uses clinician-assigned severity and incomplete phase information. Neither establishes
    a universal enzyme threshold that protects the human brain. The French treatment cohort has inconsistent mortality-by-treatment-age
    statements between narrative and Table 2; no claim that all attenuated deaths followed adult treatment initiation
    is adopted. Its growth, antibody and organ outcomes are uncontrolled observations, and follow-up denominators
    vary by measurement.
  prompt: How well do residual-activity assays and genotype predict individual outcomes?
  kind: INTERPRETATION
  status: OPEN
- evidence:
  - reference: PMID:28119823

      explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Evaluation and decompression of cervical myelopathy
  description: >-
    Urgently evaluate progressive activity loss, gait change or other myelopathic signs, with spinal imaging and
    neurosurgical assessment. Early decompression can limit further injury; established deficits may persist.
  therapeutic_modality: SURGERY
  treatment_term: *id013
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Progressive compression of the spinal cord with resulting cervical myelopathy should be aggressively and quickly
      evaluated in individuals with attenuated disease or those who have had HSCT. Early surgical intervention may
      prevent severe complications.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Cervical Spinal Cord Compression
    treatment_effect: INHIBITS
    description: Decompression addresses mechanical cord compromise.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
      reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT

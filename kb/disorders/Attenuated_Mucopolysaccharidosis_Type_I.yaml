- MPS I H/S
- MPS I S
- Hurler-Scheie syndrome
- Scheie syndrome
notes: >-
  This entry covers the attenuated MPS I spectrum, retaining Hurler-Scheie and Scheie as historical subtypes. Their
  clinical boundary is imprecise. The parent MPS I concept also includes severe Hurler syndrome, so it remains a
  broad mapping rather than an exact disease binding. Subtype-specific observations are distinguished from mixed
  MPS I data. In particular, the 2026 carpal-tunnel series contains 31 Hurler and only two Hurler-Scheie patients,
  all treated with transplantation, and cannot define attenuated phenotype frequencies or onset. The institutional
  PDF is Esmeralda Oussoren’s 2018 thesis, Studies on Cartilage and Bone Disease in Mucopolysaccharidoses and Mucolipidoses.
  Its chapter 3 reproduces the 2013 residual-IDUA study (PMID:23786846). The generated PDF cache records its URL
  as the title; citation metadata retains that value to satisfy authoritative title validation, while this note
  identifies the work by its actual title.

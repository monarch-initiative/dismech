- name: Urinary dermatan and heparan sulfate
  presence: Elevated
  context: >-
    Quantitative or qualitative urinary GAG analysis supports the diagnosis, but reduced sensitivity, especially
    in dilute urine, can complicate screening. Urinary GAG reduction after laronidase is a pharmacodynamic response
    and does not establish correction of all tissue storage or clinical endpoints. In the long-term French attenuated
    cohort, 11 of 17 patients with relevant measurements reached age-adjusted normal levels, rather than 65% of
    all 25 attenuated participants.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Analysis of urine glycosaminoglycans (GAG) (i.e., heparan and dermatan sulfate) may be quantitative (measurement
      of total urinary GAGs or specific GAG disaccharides) or qualitative (GAG electrophoresis to analyze the specific
      GAGs excreted).
    explanation: Clinical synthesis specific to the described MPS I manifestation.
  - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a80ac249-cae4-41f3-88bb-344088b20e60
    reference_title: DailyMed - ALDURAZYME- laronidase injection, solution, concentrate
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The responsiveness of urinary GAG to dosage alterations of ALDURAZYME is unknown, and the relationship of
      urinary GAG to other measures of clinical response has also not been established
    explanation: Current label limits use of urinary GAG as a clinical surrogate.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the presence of IDUA pseudodeficiency, the establishment of the diagnosis of MPS I requires the demonstration
      of BOTH deficiency of IDUA enzyme activity AND elevation of urine GAGs.
    explanation: >-
      Biochemical confirmation must distinguish deficient substrate degradation from artificial-substrate pseudodeficiency.
- name: Alpha-L-iduronidase activity
  presence: Reduced
  context: >-
    Deficient activity in leukocytes or cultured fibroblasts supports MPS I. Routine assays do not reliably separate
    severe from attenuated disease, and activity can be undetectable in either. Artificial-substrate pseudodeficiency
    requires interpretation with GAG metabolism and molecular findings. Specialized residual-activity assays show
    overlapping ranges and remain insufficient to establish a universal CNS-protection threshold.
  evidence:
  - *id010
  - &id018
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pseudodeficiency relates to the finding of reduced or undetectable IDUA enzyme activity with the use of artificial
      substrates, but no evidence of altered glycosaminoglycan metabolism with the use of radiolabeled
    explanation: Artificial-substrate deficiency can occur without the metabolic disease.
genetic:
- name: IDUA pathogenic variants
  gene_term: *id003
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    evidence:
    - *id011
  features: >-
    Attenuated disease is often associated with at least one missense allele, but splice, in-frame deletion and
    stop-loss alleles also occur. Genotype contributes to severity assessment alongside clinical trajectory. Novel
    variants, incomplete phase information and variable phenotypes for recurrent alleles limit individual prediction;
    a variant of uncertain significance is not diagnostic.
  evidence:
  - reference: PMID:31194252
    reference_title: >-
      Genotype-phenotype relationships in mucopolysaccharidosis type I (MPS I): Insights from the International
      MPS I Registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The genotype/ phenotype relationships identified in this large series of patients shows that many MPS I patients
      have unique variants and that certain variants have variable phenotypic effects.
    explanation: Registry association with clinician-assigned severity; no direct activity assay.
  - *id012
  review_notes: >-
    The registry reports inconsistent proportions for attenuated patients with a missense allele across abstract,
    Results, Discussion and Table 4; no exact proportion is adopted. Genotyping methods, parental phase confirmation
    and laboratory classifications were not collected. The nonsense variant p.Tyr343Ter can have an attenuating
    splice consequence, so all stop variants cannot be classified as null from their names alone.
diagnosis:
- name: Biochemical and molecular confirmation
  description: >-
    Assess urinary dermatan/heparan sulfate and IDUA enzyme activity, then interpret biallelic pathogenic or likely
    pathogenic IDUA variants with the biochemical findings. Urinary screening is neither subtype-specific nor perfectly
    sensitive; a reassuring screen alone should not terminate evaluation when clinical suspicion persists. Enzyme
    pseudodeficiency and variants of uncertain significance are important pitfalls. Parent testing can clarify phase.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the presence of IDUA pseudodeficiency, the establishment of the diagnosis of MPS I requires the demonstration
      of BOTH deficiency of IDUA enzyme activity AND elevation of urine GAGs.
    explanation: >-
      Biochemical confirmation must distinguish deficient substrate degradation from artificial-substrate pseudodeficiency.
  - &id017
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neither the quantitative nor the qualitative method can diagnose a specific lysosomal enzyme deficiency, including
      MPS I; however, an abnormality detected by either or both methods indicates the likely presence of an MPS
      disorder.
    explanation: Clinical synthesis specific to the described MPS I manifestation.
- name: Clinical severity assessment
  description: >-
    Integrate age at onset, developmental trajectory, organ involvement and genotype. Severe and attenuated MPS
    I form a continuum; neither detectable residual enzyme activity nor normal early cognition independently establishes
    the long-term phenotype.
  evidence:
  - &id016
    reference: PMID:20301341
    reference_title: Mucopolysaccharidosis Type I.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An essential component of management is the determination of whether the proband has severe or attenuated
      MPS I.
    explanation: Management requires a clinical severity assessment.
  - *id012
- name: Multisystem baseline evaluation and surveillance
  description: >-
    Arrange coordinated neurologic, ophthalmologic, auditory, cardiac, respiratory, gastrointestinal and musculoskeletal
    assessment. The management guideline recommends follow-up every six to twelve months with individualized intervals.
    Include echocardiography, pulmonary and sleep assessment, nerve-conduction studies, spinal examination and developmental
    or educational review; symptoms alone may miss carpal-tunnel or cord disease.
  evidence:
  - reference: PMID:19117856
    reference_title: 'Mucopolysaccharidosis I: management and treatment guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      All patients with mucopolysaccharidosis I should receive a comprehensive baseline evaluation, including neurologic,
      ophthalmologic, auditory, cardiac, respiratory, gastrointestinal, and musculoskeletal assessments, and should
      be monitored every 6 to 12 months with individualized specialty assessments, to monitor disease progression
      and effects of intervention.
    explanation: Expert guidance across MPS I, with assessments individualized to phenotype.
- name: At-risk family and reproductive testing
  description: >-
    Offer testing to at-risk siblings so disease can be identified before substantial progression. Known familial
    pathogenic variants enable carrier, prenatal and preimplantation testing; carrier enzyme assays alone are unreliable.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Testing of all at-risk sibs of any age is warranted in order to initiate therapy as early in the course of
      disease as possible.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  - &id015
    reference: PMID:20301341
    reference_title: Mucopolysaccharidosis Type I.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Carrier testing for at-risk relatives and prenatal testing for pregnancies at increased risk are possible
      if both disease-causing IDUA variants have been identified in the family.
    explanation: Familial molecular testing recommendation.
treatments:
- name: Intravenous laronidase enzyme replacement
  description: >-
    Weekly intravenous laronidase supplies recombinant IDUA for somatic disease. The current US label covers Hurler
    and Hurler-Scheie forms and Scheie disease with moderate-to-severe symptoms; efficacy and safety for mildly
    affected Scheie patients are not established. In the pivotal 26-week trial, 44 of 45 participants had attenuated
    disease. FVC improved; the walking-distance result was significant in a prespecified adjusted analysis but not
    the unadjusted comparison. Long-term observational data suggest some somatic benefit, but skeletal, corneal,
    valvular and spinal disease can persist or progress. CNS effects have not been established. Earlier treatment
    may help, but no validated age-nine cutoff follows from the uncontrolled growth cohorts.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: laronidase
      term:
        id: NCIT:C83864
        label: Laronidase
  evidence:
  - &id021
    reference: PMID:31211405
    reference_title: >-
      Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The laronidase group achieved statistically significant improvements in per cent predicted forced vital capacity
      compared to placebo, MD 5.60 (95% confidence intervals 1.24 to 9.96) (low-quality evidence) and in the six-minute-walk
      test (mean improvement of 38.1 metres in the laronidase group; P = 0.039, when using a prospectively planned
      analysis of covariance) (low-quality evidence).
    explanation: >-
      Cochrane synthesis of one 45-person, 26-week trial; walk-test significance depends on the prespecified adjusted
      analysis.
  - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a80ac249-cae4-41f3-88bb-344088b20e60
    reference_title: DailyMed - ALDURAZYME- laronidase injection, solution, concentrate
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The safety and effectiveness of treating mildly affected patients with the Scheie form have not been established.
    explanation: Current regulatory indication boundary.
  - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a80ac249-cae4-41f3-88bb-344088b20e60
    reference_title: DailyMed - ALDURAZYME- laronidase injection, solution, concentrate
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The effect of ALDURAZYME on central nervous system manifestations of the disorder has not been determined.
    explanation: Current regulatory CNS limitation.
  - reference: PMID:35869927
    reference_title: >-
      Growth in individuals with attenuated mucopolysaccharidosis type I during untreated and treated periods: Data
      from the MPS I registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While median height remained below CDC standards during both the natural history and ERT-treated periods for
      individuals with attenuated MPS I, laronidase ERT was associated with slower declines in height z-scores.
    explanation: Observational association, not a randomized age threshold.
  - reference: PMID:15126990
    reference_title: >-
      Enzyme replacement therapy for mucopolysaccharidosis I: a randomized, double-blinded, placebo-controlled,
      multinational study of recombinant human alpha-L-iduronidase (laronidase).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      After 26 weeks, patients receiving laronidase compared with placebo showed mean improvements of 5.6 percentage
      points in percent of predicted normal FVC (median, 3.0; P=.009) and 38.1 meters in 6MWT distance (median,
      38.5; P=.066; P=.039, analysis of covariance).
    explanation: Primary trial results; adjusted and unadjusted walk analyses differ.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC6581069/
    reference_title: >-
      Enzyme replacement therapy with laronidase (Aldurazyme®) for treating mucopolysaccharidosis type I - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      No measures of systolic and diastolic function, hypertrophy and valve disease were reported on in the included
      study
    explanation: Full Cochrane review specifies the cardiac outcomes absent from the pivotal trial.
  - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a80ac249-cae4-41f3-88bb-344088b20e60
    reference_title: DailyMed - ALDURAZYME- laronidase injection, solution, concentrate
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hypersensitivity reactions including anaphylaxis have been reported in patients during or up to 3 hours after
      ALDURAZYME infusions. Some of these reactions were life-threatening
    explanation: Boxed safety concern, including events after prior exposure.
  - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a80ac249-cae4-41f3-88bb-344088b20e60
    reference_title: DailyMed - ALDURAZYME- laronidase injection, solution, concentrate
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neutralizing antibodies that inhibited cellular uptake of laronidase were detected in 38 of 70 (54%) patients
      who developed ADA.
    explanation: Neutralizing uptake antibodies in the label population; not an attenuated-only prevalence.
  target_mechanisms:
  - target: Reduced Alpha-L-Iduronidase Activity
    treatment_effect: RESTORES
    description: >-
      Replacement enzyme adds lysosomal hydrolase activity; distribution and clinical correction remain incomplete.
    evidence:
    - reference: url:https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a80ac249-cae4-41f3-88bb-344088b20e60
      reference_title: DailyMed - ALDURAZYME- laronidase injection, solution, concentrate
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The rationale of ALDURAZYME therapy in MPS I is to provide exogenous enzyme for uptake into lysosomes and
        increase the catabolism of GAG. ALDURAZYME uptake by cells into lysosomes is most likely mediated by the
        mannose-6-phosphate-terminated oligosaccharide chains of laronidase binding to specific mannose-6-phosphate
        receptors.
      explanation: >-
        Label mechanism: lysosomal delivery of replacement enzyme; receptor contribution is qualified by the source.
  notes: >-
    Infusion reactions can be severe, including anaphylaxis and cardiorespiratory decompensation; label-directed
    monitoring and individualized premedication are required. Anti-drug antibodies are common. Cell-uptake neutralization
    and associations with reduced urinary-GAG response have been reported, so the absence of an FVC/6MWT correlation
    in trials does not establish that antibodies are always clinically irrelevant.
- name: Individualized transplantation assessment
  description: >-
    HSCT is primarily standard care for selected children with severe MPS I. For attenuated disease, decisions require
    specialist assessment of progression, genotype, development, age and transplant risk. Its potential benefits
    are not confined to cognition, but it does not reliably reverse established skeletal, corneal or valve disease.
    A universal preserved-cognition rationale for excluding transplantation is inappropriate.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the morbidity and mortality associated with HSCT, it is currently recommended primarily for children
      with severe MPS I.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  - reference: PMID:19117856
    reference_title: 'Mucopolysaccharidosis I: management and treatment guidelines.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The patient's age (>2 years or < or =2 years), predicted phenotype, and developmental quotient help define
      the risk/benefit profile for hematopoietic stem cell transplantation (higher risk but can preserve central
      nervous system function) versus enzyme replacement therapy (low risk but cannot cross the blood-brain barrier).
    explanation: Expert risk-benefit framework, not proof of benefit in all attenuated patients.
- name: Physical and occupational therapy
  description: >-
    Early range-of-motion work and functional support may preserve mobility and hand function. Established contractures
    may not reverse; tailor activity and assistive support to skeletal and neurologic limitations.
  therapeutic_modality: OTHER
  treatment_term: &id014
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Range of motion exercises appear to offer some benefits in preserving joint function and should be started
      early. Once significant joint limitation has occurred, increased range of motion may not be achieved without
      HSCT.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Limitation of joint mobility
    treatment_effect: MODULATES
    description: Exercises aim to preserve available movement rather than remove stored substrate.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
      reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT

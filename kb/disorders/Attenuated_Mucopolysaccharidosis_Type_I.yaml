- name: Gastrointestinal symptom and hernia care
  description: >-
    Treat constipation or diarrhea individually and assess symptomatic or recurrent hernias. Dietary measures and
    cautious laxative use may help bowel symptoms; surgical decisions include anesthetic risk assessment.
  therapeutic_modality: OTHER
  treatment_term: *id014
  evidence:

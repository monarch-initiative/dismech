synonyms:
- attenuated MPS I
- attenuated mucopolysaccharidosis type I
- MPS I H/S
- MPS I S
- Hurler-Scheie syndrome
- Scheie syndrome
- non-neuronopathic mucopolysaccharidosis type I
notes: >-
  Naming and entry-boundary rationale, because this is the part of MPS
  nosology most likely to confuse a reader or a curator.

  The eponyms are a historical three-way split of one enzyme deficiency:
  Hurler (severe), Hurler-Scheie (intermediate), Scheie (mildest). Scheie
  syndrome was for a time even numbered as a separate disorder, "MPS V", before
  it was recognised as the mild end of MPS I. Contemporary practice has largely
  abandoned the three-way eponymous split in favour of a two-way clinical one -
  severe (neuronopathic) versus attenuated (non-neuronopathic) - because that is
  the distinction that actually drives the treatment decision, and because the
  Hurler-Scheie/Scheie boundary is not reliably drawable in an individual
  patient. Registry studies and treatment cohorts are now reported as
  severe-versus-attenuated. This entry follows that practice: it is scoped to
  the attenuated arm, and carries Hurler-Scheie and Scheie as subtypes so the
  historical concepts and their MONDO identifiers remain addressable.

  Why this is a separate entry rather than a section of the Hurler syndrome
  entry. The two arms are not the same disease at two dial settings. They differ
  in age at presentation (infancy versus later childhood or adulthood), in which
  organ systems carry the morbidity (CNS and early cardiorespiratory failure
  versus joints, cornea, valves, and spinal cord), in the diagnostic pathway
  (developmental regression and coarse facies versus an orthopaedic or
  rheumatological referral years after symptom onset), and - most consequentially
  - in which of the two disease-modifying therapies is indicated. Newborn
  screening has made this boundary sharper rather than softer: a positive
  screen now forces an explicit severe-versus-attenuated prediction before
  symptoms appear, because that prediction determines whether the child is
  referred for transplantation or started on enzyme replacement therapy.

  Curation note on evidence. Much of the best evidence for attenuated MPS I is
  reported from mixed severe-and-attenuated cohorts (the MPS I Registry, the
  Lyon laronidase cohort) with the attenuated arm broken out separately. Where
  that is the case the snippet quoted here is the attenuated-specific figure,
  not the pooled one. The carpal-tunnel cohort is the one exception: it is an
  all-MPS-I cohort not stratified by phenotype, so the finding is annotated as
  MPS I generally and its relevance to the attenuated arm is stated in prose
  rather than claimed from the quote.
has_subtypes:
- name: Hurler-Scheie
  display_name: Hurler-Scheie syndrome (MPS I H/S)
  subtype_term:
    preferred_term: Hurler-Scheie syndrome
    term:
      id: MONDO:0011759
      label: Hurler-Scheie syndrome
  description: >-
    The intermediate attenuated phenotype. Somatic disease is progressive and
    clinically significant - dysostosis multiplex, joint contracture, corneal
    clouding, valve disease, airway obstruction, short stature - with onset
    typically in later childhood, but without the primary cognitive decline
    of Hurler syndrome. Some patients have mild learning difficulty. Untreated,
    survival is usually into the second or third decade. The boundary with
    Scheie syndrome is a matter of degree and is not reliably drawable
    prospectively in an individual patient.
  evidence:
  - reference: PMID:32764324
    reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three MPS I subtypes have been classified that differ in the severity of disease, ranging from mild (Scheie syndrome) to moderate (Hurler–Scheie) to severe (Hurler syndrome or MPS-IH)."
    explanation: >-
      Places Hurler-Scheie as the intermediate of the three classified MPS I
      subtypes, which is what this subtype records.
- name: Scheie
  display_name: Scheie syndrome (MPS I S, formerly MPS V)
  subtype_term:
    preferred_term: Scheie syndrome
    term:
      id: MONDO:0011760
      label: Scheie syndrome
  description: >-
    The mildest attenuated phenotype, and the one most often diagnosed in
    adulthood. Intelligence and lifespan are typically normal or near-normal.
    Disease is dominated by joint stiffness with claw-hand deformity, carpal
    tunnel syndrome, corneal clouding, and aortic valve disease; stature may be
    normal. Historically numbered MPS V before it was recognised as the mild end
    of the MPS I spectrum, which is why "MPS V" persists as a deprecated
    synonym in older literature and in some coding systems.
  evidence:
  - reference: PMID:31211405
    reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are more attenuated variants termed Hurler-Scheie or Scheie syndrome, with those affected potentially not presenting until adulthood."
    explanation: >-
      Supports both the attenuated grouping of Hurler-Scheie and Scheie and the
      characteristically late, sometimes adult, presentation.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Attenuated MPS I is autosomal recessive, caused by biallelic IDUA variants.
    Position on the severe-to-attenuated spectrum is largely genotype-driven:
    attenuated disease requires at least one allele retaining residual
    alpha-L-iduronidase activity, typically a missense allele, whereas two null
    alleles (nonsense or deletion) produce Hurler syndrome.
  evidence:
  - reference: PMID:31211405
    reference_title: "Enzyme replacement therapy with laronidase (Aldurazyme(®)) for treating mucopolysaccharidosis type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a rare, autosomal recessive disorder caused by a deficiency of alpha-L-iduronidase."
    explanation: States the inheritance mode and the deficient enzyme for MPS I.
  - reference: PMID:20301341
    reference_title: "Mucopolysaccharidosis Type I."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At conception, each child of a couple in which both parents are
      heterozygous for a IDUA pathogenic variant has a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance
      of being unaffected and not a carrier.
    explanation: >-
      Supplies the full recurrence risk for counselling a heterozygous couple:
      one in four affected, one in two an asymptomatic carrier, one in four
      neither.
pathophysiology:
- name: Partial IDUA deficiency with residual alpha-L-iduronidase activity
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic IDUA variants reduce but do not abolish alpha-L-iduronidase
    activity. This node is the point at which the attenuated and severe arms of
    MPS I diverge, and the divergence is quantitative at the enzyme and
    qualitative in the clinic. Severe MPS I arises from absent or extremely low
    enzyme, typically from two null alleles - deletions and nonsense variants.
    Attenuated MPS I requires residual activity, which in practice means at
    least one missense allele producing a partially functional enzyme. The
    residual activity is not enough to prevent progressive somatic storage, but
    is enough to keep storage in the developing brain below the threshold that
    produces neurodegeneration, which is why cognition is preserved.
  genes:
  - preferred_term: IDUA
    term:
      id: hgnc:5391
      label: IDUA
  molecular_functions:
  - preferred_term: alpha-L-iduronidase activity
    modifier: DECREASED

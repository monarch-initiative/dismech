    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiac involvement can present as progressive disease of the mitral and aortic valves with regurgitation
      and/or stenosis, for which valve replacement may be necessary.
    explanation: Clinical synthesis specific to the described MPS I manifestation.
- name: Mitral stenosis
  category: Cardiovascular
  description: Mitral valve thickening can produce stenosis in addition to regurgitation.
  phenotype_term:
    preferred_term: Mitral stenosis
    term:
      id: HP:0001718
      label: Mitral stenosis
  evidence: *id006
- name: Short stature
  category: Growth
  description: >-
    Growth deceleration is variable and may emerge later in childhood. Registry models associate laronidase with
    slower decline in height z scores, but growth often remains below population standards.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:35869927
    reference_title: >-
      Growth in individuals with attenuated mucopolysaccharidosis type I during untreated and treated periods: Data
      from the MPS I registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While median height remained below CDC standards during both the natural history and ERT-treated periods for
      individuals with attenuated MPS I, laronidase ERT was associated with slower declines in height z-scores.
    explanation: >-
      Observational attenuated growth registry; treatment and untreated periods overlap within participants.

    explanation: Clinical synthesis specific to the described MPS I manifestation.
experimental_models:
- name: Patient fibroblast residual-IDUA and thermal-stability assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Patient-derived skin fibroblasts and control fibroblasts
  description: >-
    Cultured fibroblast homogenates from severe, intermediate and mild MPS I were assayed with an artificial fluorogenic
    substrate under high-protein and prolonged-incubation conditions. The E276K-associated activity was unstable
    at 37 degrees Celsius and more stable at 23 degrees Celsius. The study proposes a residual-function approach
    but does not validate an individual prognostic classifier.
  publication: PMID:23786846
  evidence:
  - *id010
  - *id019
  - reference: url:https://repub.eur.nl/pub/112929/Opmaak-Esmee-Oussoren-mindiscussie.pdf
    reference_title: >-
      https://repub.eur.nl/pub/112929/Opmaak-Esmee-Oussoren-mindiscussie.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fibroblast homogenates were prepared by resuspending one cell pellet in 100 µL water followed by sonication
      for 10 sec at 130 W.
    explanation: >-
      Methods of the 2013 article reproduced in chapter 3 of Oussoren’s 2018 thesis, Studies on Cartilage and Bone
      Disease in Mucopolysaccharidoses and Mucolipidoses. This measures fibroblast-homogenate activity, not intact-brain
      or natural-substrate flux.
  modeled_mechanisms:
  - target: Reduced Alpha-L-Iduronidase Activity
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Residual activity was markedly reduced, with overlapping clinical-subtype ranges.
    limitations: >-
      Artificial 4-methylumbelliferyl substrate, high protein loading and extended incubation measure residual catalytic
      activity. Severe and attenuated ranges overlap. No neuronal activity threshold, natural-GAG turnover, intracellular
      protein half-life or clinical rescue was established. The abstract labels the Scheie group n=5, whereas the
      main Results and Table 1 include seven Scheie cell lines across five genotypes, including three E276K siblings.
      Those siblings are not independent genotype replications.
    divergences:
    - divergence_type: PROXY_QUANTITY
      description: >-
        Artificial-substrate activity in cultured-cell homogenates stands in for lysosomal hydrolysis in patient
        tissues; CNS protection and intact-cell protein turnover were not measured.
      materiality: QUALIFYING
    evidence:

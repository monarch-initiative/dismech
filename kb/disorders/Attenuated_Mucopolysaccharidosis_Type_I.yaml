        is successful for individuals with attenuated disease, although donor grafts eventually become cloudy. Individuals
        with clear grafts may still experience poor vision because of involvement of the retina and/or optic nerve
      explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Cardiac assessment and selected valve replacement
  description: >-
    Monitor valve and ventricular disease with cardiology and echocardiography. Hemodynamically important valve
    disease may require replacement. The untreated registry describes valve and myocardial abnormalities and cannot
    establish that laronidase prevents progression. Endocarditis prophylaxis should follow current indication-specific
    cardiology guidance rather than a blanket disease rule from older literature.
  therapeutic_modality: SURGERY
  treatment_term: *id013
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiac involvement can present as progressive disease of the mitral and aortic valves with regurgitation
      and/or stenosis, for which valve replacement may be necessary.
    explanation: Clinical synthesis supporting specialist consideration of valve surgery.
  target_mechanisms:
  - target: Mitral regurgitation
    treatment_effect: BYPASSES
    description: >-

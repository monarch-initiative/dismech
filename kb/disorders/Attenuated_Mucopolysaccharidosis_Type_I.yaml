  - target: Limitation of joint mobility
    causal_link_type: DIRECT
    description: >-
      Storage in joint capsule, tendon, and periarticular tissue produces
      progressive stiffness and contracture, including claw-hand deformity.
  - target: Constrictive median neuropathy
    causal_link_type: DIRECT
    description: >-
      Storage thickens the flexor retinaculum and compresses the median nerve,
      producing carpal tunnel syndrome that is often clinically silent.
  - target: Corneal opacity

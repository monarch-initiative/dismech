progression:
- phase: Variable attenuated course
  age_range: Usually childhood onset, with later recognition possible
  notes: >-
    Symptoms commonly begin between three and ten years. Progression ranges from life-threatening cardiorespiratory
    complications in early adulthood to a near-normal lifespan with substantial joint and multisystem disability.
    Normal early development is not a guarantee of lifelong preserved cognition.
  evidence:
  - reference: PMID:20301341
    reference_title: Mucopolysaccharidosis Type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

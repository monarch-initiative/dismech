        Range of motion exercises appear to offer some benefits in preserving joint function and should be started
        early. Once significant joint limitation has occurred, increased range of motion may not be achieved without
        HSCT.
      explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Individualized orthopedic surgery
  description: >-
    Joint replacement or spinal stabilization may be appropriate for selected progressive structural problems. Decisions
    account for other organ disease and major anesthetic risk; surgery does not correct the underlying enzyme deficiency.
  therapeutic_modality: SURGERY
  treatment_term: &id013
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Various orthopedic approaches can be undertaken, particularly in individuals with attenuated disease. Joint
      replacement and atlanto-occipital stabilization may be necessary. These procedures must be performed at appropriate
      times in the individual's clinical course and must take into account the presence of other disease complications.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Limitation of joint mobility
    treatment_effect: MODULATES
    description: Selected joint replacement addresses a structural contributor to disability.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
      reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Various orthopedic approaches can be undertaken, particularly in individuals with attenuated disease. Joint
        replacement and atlanto-occipital stabilization may be necessary. These procedures must be performed at
        appropriate times in the individual's clinical course and must take into account the presence of other disease
        complications.
      explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Carpal tunnel decompression
  description: >-
    Use early nerve-conduction assessment and specialist evaluation because typical sensory symptoms may be absent.
    Release can improve function, but recovery varies and surveillance continues for recurrence. The 13 recurrences
    among 21 operated patients in the 2026 series predominantly concern transplanted Hurler disease and are not
    an attenuated-specific rate.
  therapeutic_modality: SURGERY
  treatment_term: *id013
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      thus, nerve conduction studies should be used early in the course of disease to identify persons with carpal
      tunnel syndrome at a time when surgical release may be most beneficial. Surgical decompression of the median
      nerve results in variable restoration of motor hand activity
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  - reference: PMID:41656624
    reference_title: >-
      Carpal tunnel syndrome in mucopolysaccharidosis type I: clinical, surgical and histopathological findings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Twenty-one patients underwent carpal tunnel release and 13 patients experienced recurrence.
    explanation: Mostly severe post-HSCT cohort; scope does not establish attenuated recurrence probability.
  target_mechanisms:
  - target: Median Nerve Compression
    treatment_effect: INHIBITS
    description: Surgical release relieves pressure on the median nerve.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/

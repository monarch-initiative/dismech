name: Attenuated Mucopolysaccharidosis Type I
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >-
  Attenuated mucopolysaccharidosis type I comprises the historically named Hurler-Scheie and Scheie phenotypes within
  the continuous spectrum of biallelic IDUA-related disease. Deficient alpha-L-iduronidase impairs lysosomal degradation
  of dermatan and heparan sulfate. Progressive skeletal, joint, corneal, valvular, respiratory and peripheral neurologic
  disease can cause substantial disability despite slower progression than severe Hurler syndrome. Onset is commonly
  between three and ten years, with variable diagnostic delay. Normal early development does not exclude later learning
  difficulties or cognitive impairment. Laronidase treats selected somatic manifestations; neither residual enzyme
  activity nor a mild early presentation guarantees an unaffected CNS or reversal of established structural disease.
classifications:
  lysosomal_storage_category:
    classification_value: mucopolysaccharidosis
    notes: >-
      Attenuated MPS I is a mucopolysaccharidosis: lysosomal accumulation of the glycosaminoglycans dermatan sulfate
      and heparan sulfate arising from partial alpha-L-iduronidase deficiency.
  icimd_category:
  - classification_value: glycosaminoglycan_degradation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Glycosaminoglycan degradation" under category "Disorders
      of complex molecule degradation". Attenuated MPS I is alpha-L-iduronidase deficiency, the same enzyme defect
      as Hurler syndrome, with residual activity.
  isds_skeletal_category:
  - classification_value: lysosomal_storage_with_skeletal_involvement
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019 revision (Mortier et al., PMID:31633310),
      Table 1 group 27 "Lysosomal storage diseases with skeletal involvement (dysostosis multiplex group)"; MPS
      type 1 is listed there, and the attenuated forms carry the dysostosis multiplex phenotype that defines the
      group.

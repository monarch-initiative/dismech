differential_diagnoses:
- name: Severe MPS I
  disease_term:
    preferred_term: Hurler syndrome
    term:
      id: MONDO:0011758
      label: Hurler syndrome
  description: >-
    The severe end of the same IDUA spectrum. Early progressive developmental impairment and somatic disease support
    severe classification, but genotype and longitudinal examination are needed; normal early development or any
    single assay threshold cannot guarantee attenuated disease.
  distinguishing_features:
  - The clinical trajectory and predicted allele effects inform severity rather than a categorical detectable-versus-absent enzyme rule.
  evidence:
  - *id016
  - *id012
- name: Other mucopolysaccharidoses
  description: >-
    MPS II, VI and VII can overlap clinically. Disease-specific enzyme assays distinguish IDUA deficiency from iduronate-2-sulfatase,
    arylsulfatase B or beta-glucuronidase deficiency. Corneal and inheritance patterns help direct testing but do
    not replace biochemical confirmation.
  distinguishing_features:
  - A urinary GAG pattern alone does not identify the deficient enzyme.
  evidence:
  - *id017
- name: Juvenile idiopathic arthritis
  description: >-
    Progressive noninflammatory joint limitation can lead to an arthritis referral. Evaluate the joint pattern together
    with corneal, skeletal, cardiac and other storage-disease signs; no universal inflammatory-marker or treatment-response
    rule is assumed.
  distinguishing_features:
  - Multisystem storage-disease findings and deficient IDUA-mediated GAG degradation favor MPS I.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Persons with attenuated MPS I may present with noninflammatory arthritis at any age; thus, MPS I should be
      considered in the differential diagnosis of juvenile idiopathic arthritis
    explanation: Clinical synthesis specific to the described MPS I manifestation.
- name: IDUA pseudodeficiency
  description: >-
    Low activity against an artificial substrate can occur without disturbed GAG metabolism or clinical MPS I. Interpret
    enzyme results with substrate biomarkers, molecular classification and the clinical picture.
  distinguishing_features:
  - Reduced artificial-substrate activity without abnormal GAG metabolism is not sufficient to diagnose disease.
  evidence:
  - *id018

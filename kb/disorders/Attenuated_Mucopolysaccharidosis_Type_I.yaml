      explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Corneal and visual care
  description: >-
    Reduce glare and assess glaucoma, retinal and optic-nerve disease. Selected corneal transplantation may improve
    transparency, but graft clouding can recur and noncorneal disease can limit visual benefit.
  therapeutic_modality: OTHER
  treatment_term: *id014
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Wearing peaked caps or eye shades can help reduce glare resulting from corneal clouding. Corneal transplantation
      is successful for individuals with attenuated disease, although donor grafts eventually become cloudy. Individuals
      with clear grafts may still experience poor vision because of involvement of the retina and/or optic nerve
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Corneal opacity
    treatment_effect: MODULATES
    description: Symptom aids and selected transplantation address the consequences of corneal clouding.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
      reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf

phenotypes:
- name: Limitation of joint mobility
  category: Musculoskeletal
  description: >-
    Progressive stiffness and restricted movement affect multiple joints. This is a major cause of disability, including
    hand dysfunction.
  phenotype_term:
    preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Progressive arthropathy affecting all joints and eventually leading to loss of or severe restriction in range
      of motion is universal.
    explanation: Clinical synthesis specific to the described MPS I manifestation.
- name: Joint contracture
  category: Musculoskeletal
  description: >-
    Fixed limitation can develop with progressive arthropathy; no subtype-specific numerical frequency is inferred
    from treatment cohorts.
  phenotype_term:
    preferred_term: Joint contracture
    term:
      id: HP:0034392
      label: Joint contracture
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Progressive arthropathy affecting all joints and eventually leading to loss of or severe restriction in range
      of motion is universal.
    explanation: Attenuated-specific fixed and progressive joint limitation.
- name: Constrictive median neuropathy
  category: Neurologic
  description: >-
    Carpal tunnel syndrome may be present without typical pain or paresthesia. The attenuated registry median age
    was about ten years; the much younger pooled post-HSCT series is predominantly severe Hurler disease.
  phenotype_term:
    preferred_term: Constrictive median neuropathy
    term:
      id: HP:0012185
      label: Constrictive median neuropathy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Carpal tunnel syndrome was present at a median age of nine years 11 months in 138 individuals with attenuated
      MPS I included in the MPS I Registry
    explanation: Clinical synthesis specific to the described MPS I manifestation.
- name: Corneal opacity
  category: Ophthalmologic
  description: >-
    Progressive bilateral clouding may impair vision. The GeneReviews attenuated registry synthesis reports approximately
    82% at a median recognition age of 9.1 years, not an invariant finding at birth.
  phenotype_term:
    preferred_term: Corneal opacity
    term:
      id: HP:0007957
      label: Corneal opacity
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Corneal clouding, exhibited by approximately 82% of children with attenuated MPS I, was identified at a median
      age of 9.1 years
    explanation: Clinical synthesis specific to the described MPS I manifestation.
- name: Mitral regurgitation
  category: Cardiovascular
  description: >-
    Progressive mitral valve dysfunction can become hemodynamically important. Frequency depends on age and ascertainment.
    It was recorded in 196 of 264 attenuated patients with valve data during variable untreated follow-up; this
    is not a lifetime risk or valve-severity estimate.
  phenotype_term:
    preferred_term: Mitral regurgitation
    term:
      id: HP:0001653
      label: Mitral regurgitation
  evidence:
  - *id005
  - reference: PMID:37850463
    reference_title: >-
      Natural history of cardiac findings in mucopolysaccharidosis type I: report from an international registry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mitral regurgitation was the most common and earliest finding for individuals with both severe (58.3%, median
      age 1.2 years) and attenuated (74.2%, median age 8.0 years) disease.
    explanation: >-
      Voluntary registry; 196 of 264 attenuated patients with valve data had an ever-recorded finding before ERT
      or HSCT.
- name: Aortic valve stenosis
  category: Cardiovascular
  description: Aortic stenosis can develop during the attenuated course, sometimes requiring valve replacement.
  phenotype_term:
    preferred_term: Aortic valve stenosis
    term:
      id: HP:0001650
      label: Aortic valve stenosis
  evidence:
  - *id005
- name: Aortic regurgitation
  category: Cardiovascular
  description: Aortic valve involvement may cause regurgitation as well as stenosis.
  phenotype_term:
    preferred_term: Aortic regurgitation
    term:
      id: HP:0001659
      label: Aortic regurgitation
  evidence: &id006
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mitral regurgitation was the most common and earliest finding for individuals with both severe (58.3%, median age 1.2 years) and attenuated (74.2%, median age 8.0 years) disease. Left-sided valve stenosis was also common in individuals with attenuated disease (mitral 30.3%; aortic 25%)."
    explanation: >-
      Supplies the attenuated-specific prevalence and median age for mitral
      regurgitation and left-sided stenosis quoted in this node.
  - reference: PMID:37850463

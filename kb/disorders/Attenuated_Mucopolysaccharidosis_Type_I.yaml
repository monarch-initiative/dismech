    explanation: >-
      Establishes that the severe arm corresponds to absent or near-absent
      enzyme from null genotypes, which is the contrast that defines residual
      activity as the attenuating factor in this node.
  - reference: PMID:32764324
    reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mucopolysaccharidosis type 1 (MPS I) is caused by lack, or relative deficiency, of the enzyme α-L-iduronidase (IDUA), leading to the accumulation of dermatan and heparan sulfates"
    explanation: >-
      Distinguishes complete lack from relative deficiency as the two ways IDUA
      function is lost, which is exactly the distinction this node encodes.
  downstream:
  - target: Lysosomal dermatan and heparan sulfate accumulation
    causal_link_type: DIRECT
    description: >-
      Reduced alpha-L-iduronidase activity leaves dermatan and heparan sulfate
      incompletely degraded, so partially degraded chains accumulate in
      lysosomes and in the extracellular matrix.
    evidence:
    - reference: PMID:32764324
      reference_title: "Mucopolysaccharidosis Type I: A Review of the Natural History and Molecular Pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MPS patients are deficient in one of the lysosomal enzymes involved in the stepwise degradation of GAGs, leading to accumulation of partially degraded GAGs in lysosomes and the ECM."
      explanation: >-
        Directly links the enzyme deficiency to accumulation of partially
        degraded glycosaminoglycans in both lysosome and extracellular matrix.
- name: Lysosomal dermatan and heparan sulfate accumulation
  conforms_to: "mps_gag_storage#Lysosomal GAG Accumulation"
  biological_scale: CELLULAR
  description: >-
    Partially degraded dermatan and heparan sulfate accumulate in lysosomes and
    in the extracellular matrix. This is the GAG-accumulation hub of the
    mps_gag_storage module. In attenuated MPS I the dermatan-sulfate
    connective-tissue arm is fully engaged and drives the whole clinical
    picture, while the heparan-sulfate neuronopathic arm is engaged only weakly
    or not at all - the residual enzyme keeps cerebral heparan sulfate storage
    below the neurodegenerative threshold. That asymmetry is the mechanistic
    content of the word "attenuated": it does not mean uniformly milder disease,
    it means the CNS arm is spared while the connective-tissue arm continues to
    progress, sometimes to severe joint, valve, airway, and spinal morbidity.
    Extracellular accumulation matters as much as the lysosomal compartment
    here, because dermatan sulfate proteoglycans - decorin and biglycan - are
    the regulators of collagen fibril assembly in cartilage, tendon, cornea, and
    heart valve.

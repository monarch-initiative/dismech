- name: CSF diversion for progressive hydrocephalus
  description: >-
    Consider shunting when pressure and progressive ventricular enlargement support clinically important hydrocephalus.
    Ventriculomegaly alone is not equivalent to raised pressure; treatment is palliative and requires specialist
    assessment.
  therapeutic_modality: SURGERY
  treatment_term: *id013
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cerebrospinal fluid (CSF) pressure and progressive ventricular enlargement indicate need for a shunting procedure.
      Ventriculoperitoneal shunting in individuals with MPS I who have moderate-to-severe hydrocephalus is generally
      palliative and improves quality of life.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  target_mechanisms:
  - target: Hydrocephalus
    treatment_effect: MODULATES
    description: CSF diversion treats pressure and fluid accumulation.

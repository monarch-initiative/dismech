name: Attenuated Mucopolysaccharidosis Type I
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Attenuated mucopolysaccharidosis type I is the non-neuronopathic end of the
  MPS I spectrum, comprising the entities historically named Hurler-Scheie
  syndrome (MPS I H/S, intermediate) and Scheie syndrome (MPS I S, mildest).
  Like Hurler syndrome it is caused by biallelic IDUA variants and lysosomal
  accumulation of dermatan and heparan sulfate, but residual alpha-L-iduronidase
  activity is sufficient to spare the developing brain. The defining contrast
  with Hurler syndrome is therefore cognitive: attenuated patients have normal
  or near-normal intelligence and normal early development, and the disease
  presents not in infancy but in later childhood or adulthood with progressive
  somatic and connective-tissue disease - joint stiffness and contracture,
  carpal tunnel syndrome, corneal clouding, mitral and aortic valve disease,
  restrictive and obstructive airway disease, short stature, dysostosis
  multiplex, and cervical cord compression. Because the presenting complaints
  are orthopaedic and rheumatological rather than developmental, attenuated
  MPS I is characteristically diagnosed late, often years after the first
  symptom and sometimes in adulthood. That preserved cognition is also what
  reverses the therapeutic logic: hematopoietic stem cell transplantation is
  the standard of care for severe MPS I because it delivers enzyme across the
  blood-brain barrier, whereas in attenuated MPS I there is no CNS disease to
  rescue and enzyme replacement therapy with laronidase, which does not cross
  the blood-brain barrier, is the appropriate first-line treatment. Attenuated
  MPS I is curated as an entry separate from Hurler syndrome because the two
  differ in age at presentation, in the organ systems that drive morbidity, and
  in the treatment decision - not merely in severity.
classifications:
  lysosomal_storage_category:
    classification_value: mucopolysaccharidosis
    notes: >-
      Attenuated MPS I is a mucopolysaccharidosis: lysosomal accumulation of the
      glycosaminoglycans dermatan sulfate and heparan sulfate arising from
      partial alpha-L-iduronidase deficiency.
  icimd_category:
  - classification_value: glycosaminoglycan_degradation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Glycosaminoglycan
      degradation" under category "Disorders of complex molecule degradation".
      Attenuated MPS I is alpha-L-iduronidase deficiency, the same enzyme defect
      as Hurler syndrome, with residual activity.
  isds_skeletal_category:
  - classification_value: lysosomal_storage_with_skeletal_involvement
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 27 "Lysosomal
      storage diseases with skeletal involvement (dysostosis multiplex group)";
      MPS type 1 is listed there, and the attenuated forms carry the dysostosis
      multiplex phenotype that defines the group.

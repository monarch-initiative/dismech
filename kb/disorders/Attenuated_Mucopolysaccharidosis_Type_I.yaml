- name: Anesthetic precautions
  description: >-
    Use centers experienced with mucopolysaccharidoses. Anticipate a difficult narrowed airway, cervical instability,
    slow recovery and postoperative obstruction; plan positioning and airway equipment accordingly.
  therapeutic_modality: OTHER
  treatment_term: *id014
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/
    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dysostosis multiplex can lead to instability of the spine, including the atlanto-axial joint. Careful positioning
      and avoidance of hyperextension of the neck are necessary.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1162/

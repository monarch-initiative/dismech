    reference_title: Mucopolysaccharidosis Type I - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Some gastrointestinal symptoms (diarrhea and constipation) can be controlled by diet, including control of
      the amount of roughage. Increased roughage and the conservative use of laxatives may ease constipation.
    explanation: GeneReviews management recommendation; not a controlled outcome comparison.
- name: Genetic counseling and pregnancy planning
  description: >-
    Discuss autosomal recessive recurrence and available familial testing. Pregnancy care includes close assessment
    of cardiorespiratory and spinal disease; disease severity and treatment decisions require individualized multidisciplinary
    review.
  therapeutic_modality: OTHER
  treatment_term: *id014

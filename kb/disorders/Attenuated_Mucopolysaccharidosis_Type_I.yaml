    snippet: "disease rarity (approximately 1 case per 100,000 live births)"
    explanation: Supplies the birth prevalence figure for MPS I as a whole.
references:
- reference: PMID:20301341
  title: Mucopolysaccharidosis Type I.
  tags:
  - GeneReviews
  findings:
  - statement: Clinical onset in attenuated MPS I is usually between ages three and ten years.
    supporting_text: "Attenuated MPS I: Clinical onset is usually between ages three and ten years."
  - statement: >-
      Progression ranges from life-threatening complications and death in the
      second to third decade through to a normal lifespan complicated by
      significant disability from joint and cardiorespiratory disease.
    supporting_text: >-
      The severity and rate of disease progression range from serious
      life-threatening complications leading to death in the second to third
      decade, to a normal life span complicated by significant disability from
      progressive joint manifestations and cardiorespiratory disease.
  - statement: >-
      Learning disabilities and psychiatric manifestations can appear later in
      life even where psychomotor development was normal in early childhood, so
      preserved early cognition does not guarantee a wholly unaffected course.
    supporting_text: >-
      While some individuals have no neurologic involvement and psychomotor
      development may be normal in early childhood, learning disabilities and
      psychiatric manifestations can be present later in life.
  - statement: >-
      Laronidase improves sleep apnea specifically in attenuated disease, and
      the age at which enzyme replacement starts influences outcome.
    supporting_text: >-
      improves sleep apnea in persons with attenuated disease. The age of
      initiation of ERT influences the outcome.
  - statement: >-
      Determining whether a proband has severe or attenuated MPS I is the first
      step in management, because it selects between transplantation and enzyme
      replacement therapy.
    supporting_text: >-
      An essential component of management is the determination of whether the
      proband has severe or attenuated MPS I.
  - statement: >-
      Surveillance is annual assessment by a multidisciplinary team familiar
      with the multisystem nature of MPS I.
    supporting_text: >-
      Surveillance: Annual assessment by a team of physicians with knowledge of
      the multisystem nature of MPS I.
  - statement: >-
      Carrier testing for at-risk relatives and prenatal testing are available
      once both familial IDUA variants have been identified.
    supporting_text: >-
      Carrier testing for at-risk relatives and prenatal testing for pregnancies
      at increased risk are possible if both disease-causing IDUA variants have
      been identified in the family.

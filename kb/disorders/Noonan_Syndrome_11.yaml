  phenotype_term:
    preferred_term: Left ventricular hypertrophy
    term:
      id: HP:0001712
      label: Left ventricular hypertrophy
  evidence:
  - reference: PMID:36734411
    reference_title: "Natural history of MRAS-related Noonan syndrome: Evidence of mild adult-onset left ventricular hypertrophy and neuropsychiatric features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on the natural history of the first adult subject with NS

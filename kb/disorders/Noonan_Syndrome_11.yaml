      lymphangiectasia, consistent with NS pathology.
    explanation: >-
      Reports the microscopic findings at autopsy in the single NS11 patient
      examined histopathologically.
  notes: >-
    A single autopsy, so this is a description rather than a frequency claim; no
    other reported MRAS patient has had a published histopathological
    examination.
genetic:
- name: MRAS
  notes: >-
    MRAS encodes M-Ras (RAS-related protein 3, R-Ras3), a RAS-family small
    GTPase that transmits signal to RAF through the SHOC2-PP1 holophosphatase.
    NS11 is caused by heterozygous germline missense variants at a narrow set of
    conserved hotspot codons. Reported pathogenic changes are c.68G>T
    (p.Gly23Val), c.67G>C (p.Gly23Arg), c.203C>T (p.Thr68Ile — the most
    frequently recurrent) and c.212A>G (p.Gln71Arg); all reported occurrences
    have been de novo.
  gene_term:
    preferred_term: MRAS
    term:
      id: hgnc:7227
      label: MRAS
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  evidence:
  - reference: PMID:28289718
    reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we describe the discovery of mutations in MRAS in patients with NS
      and cardiac hypertrophy, establishing MRAS as the newest NS with cardiac
      hypertrophy-susceptibility gene.
    explanation: >-
      The founding report establishing MRAS as a Noonan syndrome gene.
  - reference: PMID:31108500
    reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted sequencing revealed de novo MRAS variants, c.203C > T
      (p.Thr68Ile) and c.67G > C (p.Gly23Arg) as causative events.
    explanation: >-
      Identifies two of the recurrent de novo pathogenic MRAS variants.
  - reference: PMID:31173466
    reference_title: "Severe Noonan syndrome phenotype associated with a germline Q71R MRAS variant: a recurrent substitution in RAS homologs in various cancers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a patient with a severe Noonan syndrome phenotype
      associated with a germline Q71R MRAS variant, which represents a recurrent
      substitution in RAS homologs in various cancers.
    explanation: >-
      Adds p.Gln71Arg to the pathogenic MRAS variant spectrum.
  - reference: CGGV:assertion_04ca29c1-6b44-474c-b54b-1c8be52de172-2022-12-14T170000.000Z
    reference_title: "MRAS / Noonan syndrome (Moderate)"

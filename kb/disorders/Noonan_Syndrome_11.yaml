inheritance:
- name: Autosomal Dominant
  description: >-
    NS11 is inherited in an autosomal dominant manner, in keeping with Noonan
    syndrome generally. Every reported MRAS-related case has arisen de novo,
    which is expected given the severity of the associated cardiomyopathy and
    the resulting limited reproductive fitness; no familial transmission of an
    MRAS variant has been described.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

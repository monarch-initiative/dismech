name: Noonan Syndrome 11
creation_date: "2026-08-18T00:00:00Z"
description: >-
  Noonan syndrome 11 (NS11) is the MRAS-related form of Noonan syndrome, an
  autosomal dominant RASopathy caused by germline activating missense variants
  in MRAS, which encodes the RAS-family GTPase M-Ras. Mutant M-Ras has impaired
  intrinsic GTPase activity and is constitutively GTP-loaded and membrane
  targeted; it binds SHOC2 and PPP1CB more avidly, promoting assembly of the
  MRAS-SHOC2-PP1 holophosphatase that dephosphorylates the inhibitory RAF S259
  site and drives RAF-MEK-ERK, with variably increased PI3K-AKT signalling.
  Clinically the entry is defined within the Noonan spectrum by a strong,
  variant-restricted association with hypertrophic cardiomyopathy: the reported
  cases cluster on a narrow set of codons (Gly23, Thr68, Gln71) and nearly all
  have had HCM, frequently severe, early onset and obstructive, with several
  neonatal or infant deaths. The phenotype is not uniform, however — a single
  adult with the recurrent p.Thr68Ile substitution presented instead with mild,
  late-onset left ventricular hypertrophy — so HCM severity should not be
  treated as an obligate feature. NS11 is an ultra-rare cause of Noonan
  syndrome: only a handful of unrelated patients have been reported since MRAS
  was implicated in 2017. General Noonan syndrome features (short stature,
  characteristic facies, developmental delay/intellectual disability) are
  present but are shared with the parent entry, Noonan Syndrome, which this
  entry cross-references rather than duplicates.
category: Genetic
parents:
- RASopathy
- Noonan Syndrome

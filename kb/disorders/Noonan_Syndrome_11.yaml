diagnosis:
- name: Molecular genetic testing on a RASopathy panel
  description: >-
    NS11 is a molecular diagnosis. Because the MRAS-associated cardiac phenotype
    overlaps sarcomeric hypertrophic cardiomyopathy, the index case was
    identified only by trio whole exome sequencing after negative clinical
    testing of the standard Noonan and myofilament HCM gene panels; MRAS is now
    included on RASopathy panels. A confirmed heterozygous pathogenic MRAS
    variant in a proband with suggestive findings establishes the diagnosis.
  evidence:
  - reference: PMID:28289718
    reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) and trio-based genomic triangulation of a
      15-year-old female with a clinical diagnosis of NS and concomitant cardiac
      hypertrophy and her unaffected parents identified a de novo variant in
      MRAS-encoded RAS-related protein 3 as the cause of her disease.
    explanation: >-
      Describes the trio exome approach that established the first molecular
      diagnosis of NS11.
  - reference: PMID:41517739
    reference_title: "Novel characterization of MRAS mutation-associated Noonan syndrome: Mild adult-onset hypertrophic cardiomyopathy combined with infective endocarditis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing identified a heterozygous MRAS c.203C>T
      (p.Thr68Ile) mutation affecting a highly conserved residue among
      RASopathy-associated GTPases, supporting the diagnosis of MRAS-associated
      Noonan syndrome complicated by infective endocarditis.
    explanation: >-
      A second worked example of exome-based molecular confirmation of NS11.
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Noonan is established in a proband with suggestive
      findings and a heterozygous pathogenic variant in BRAF, KRAS, MAP2K1,
      MRAS, NRAS, PTPN11, RAF1, RASA2, RIT1, RRAS2, SOS1, or SOS2 or either a
      heterozygous variant or biallelic pathogenic variants in LZTR1 identified
      by molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic criterion this section curates: a
      heterozygous pathogenic MRAS variant in a proband with suggestive findings
      establishes the molecular diagnosis.
differential_diagnoses:
- name: Sarcomeric hypertrophic cardiomyopathy
  description: >-
    NS11 presenting as isolated early severe hypertrophic cardiomyopathy is
    readily mistaken for a sarcomeric HCM; the index NS11 patient had already
    been screened negative on myofilament HCM gene panels before exome
    sequencing found the MRAS variant. Extracardiac Noonan features
    (dysmorphism, short stature, developmental delay) discriminate.
  evidence:
  - reference: PMID:28289718
    reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) and trio-based genomic triangulation of a
      15-year-old female with a clinical diagnosis of NS and concomitant cardiac
      hypertrophy and her unaffected parents identified a de novo variant in
      MRAS-encoded RAS-related protein 3 as the cause of her disease.
    explanation: >-
      The case was reached by exome sequencing after standard cardiomyopathy and
      Noonan panels were uninformative.
- name: Other RASopathies with hypertrophic cardiomyopathy
  description: >-
    RAF1-, RIT1- and PTPN11-related Noonan syndrome, Noonan syndrome with
    multiple lentigines, and Costello syndrome all include hypertrophic
    cardiomyopathy, and SHOC2- and PPP1CB-related disease shares the same
    MRAS-SHOC2-PP1 biochemical axis. Discrimination is molecular.
  evidence:
  - reference: PMID:31108500
    reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report provides additional evidence that a narrow spectrum of
      activating mutations in MRAS represents another rare cause of NS, and that
      MRAS has to be counted among the RASopathy genes predisposing to HCM.
    explanation: >-
      Places MRAS alongside the other HCM-predisposing RASopathy genes from
      which it must be distinguished.
progression:
- phase: Prenatal and neonatal severe cardiac disease
  age_range: fetal life to early infancy
  notes: >-
    Most reported NS11 patients have had early-onset, rapidly progressive and
    often obstructive hypertrophic cardiomyopathy, with deaths antenatally, in
    the neonatal period, and after infant myectomy.
  evidence:
  - reference: PMID:34080768
    reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a 2-month-old infant boy also presenting this cardiac anomaly
      that evolved to a fatal outcome after a surgical myectomy.
    explanation: >-
      Documents the severe, fatal early-infancy end of the NS11 cardiac natural
      history.
  - reference: PMID:41866303
    reference_title: "Hypertrophic Cardiomyopathy as a Key Feature of MRAS-Related Noonan Syndrome: New Case and Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on available follow-up data, the mortality rate reached 37.5% (three
      of eight individuals).
    explanation: >-
      Quantifies mortality across the whole reported MRAS series. The denominator
      is eight published patients, so this is a case-series figure and not a
      population survival estimate.
- phase: Mild adult-onset left ventricular hypertrophy
  age_range: adulthood
  notes: >-
    The severe early course is not obligate: the single reported adult with the
    recurrent p.Thr68Ile substitution had mild, late-onset left ventricular
    hypertrophy, so anticipatory guidance is needed across the whole age range.
  evidence:
  - reference: PMID:36734411
    reference_title: "Natural history of MRAS-related Noonan syndrome: Evidence of mild adult-onset left ventricular hypertrophy and neuropsychiatric features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It also adds new data about late-onset features suggesting that other
      unexpected complications might be observed in adult subjects providing
      anticipatory guidance for individuals of all age.
    explanation: >-
      Documents the mild adult-onset end of the NS11 cardiac natural history.
treatments:
- name: Cardiac surveillance and management of hypertrophic cardiomyopathy
  description: >-
    Because hypertrophic cardiomyopathy is present in essentially every reported
    NS11 patient and can be obstructive from infancy or emerge late in
    adulthood, echocardiographic surveillance is the central management task.
    Cardiovascular anomalies in Noonan syndrome are otherwise treated as in the
    general population. A recognized complication of outflow tract obstruction
    in this group is infective endocarditis, which prompted a call for careful
    cardiac surveillance in RASopathy patients.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiovascular anomalies in NS are usually treated as in the general
      population.
    explanation: >-
      GeneReviews management guidance for the cardiac manifestations of Noonan
      syndrome.
  - reference: PMID:41517739
    reference_title: "Novel characterization of MRAS mutation-associated Noonan syndrome: Mild adult-onset hypertrophic cardiomyopathy combined with infective endocarditis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It also identifies infective endocarditis as a previously unreported
      complication in MRAS-associated NS with outflow tract obstruction,
      highlighting the importance of careful cardiac surveillance in patients
      with RASopathies.
    explanation: >-
      Motivates cardiac surveillance specifically in MRAS-associated Noonan
      syndrome.
- name: Surgical septal myectomy
  description: >-
    Myectomy has been used to relieve outflow tract obstruction in NS11,
    including in the index patient at age 8. Outcomes have not been uniformly
    good — a 2-month-old infant died after myectomy — so the balance of risk in
    early infancy is unsettled.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:34080768
    reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on a 2-month-old infant boy also presenting this cardiac anomaly
      that evolved to a fatal outcome after a surgical myectomy.
    explanation: >-
      Documents myectomy being performed in NS11 and its poor outcome in this
      infant, supporting the treatment's use while qualifying its risk.
- name: Growth hormone therapy
  description: >-
    Growth hormone is used for the short stature of Noonan syndrome generally.
    No MRAS-specific growth hormone outcome data exist; this is inherited from
    the parent entry's management and should be applied with the usual caution
    in a patient with hypertrophic cardiomyopathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin (recombinant human growth hormone)
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth hormone (GH) treatment increases growth velocity.
    explanation: >-
      GeneReviews establishes growth hormone as standard management for the
      short stature of Noonan syndrome.
- name: MEK inhibition
  description: >-
    Because NS11 acts through RAF-MEK-ERK hyperactivation, MEK inhibitors are
    the mechanistically aligned targeted therapy and have been proposed for
    MRAS-related disease. This is a rationale, not established care: no MRAS
    -specific interventional trial has been reported.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: RAS-MAPK and PI3K-AKT Pathway Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      MEK inhibitors block the MEK-ERK arm downstream of the activated
      MRAS-SHOC2-PP1/RAF axis.
    evidence:
    - reference: PMID:41866303
      reference_title: "Hypertrophic Cardiomyopathy as a Key Feature of MRAS-Related Noonan Syndrome: New Case and Comprehensive Literature Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Moreover, emerging targeted therapies, such as MEK inhibitors, offer
        potential for treatment.
      explanation: >-
        Identifies MEK inhibition as the emerging targeted approach for
        MRAS-related Noonan syndrome; evidence source is OTHER because this is
        a review/case-report proposal rather than a reported intervention.
  evidence:
  - reference: PMID:41866303
    reference_title: "Hypertrophic Cardiomyopathy as a Key Feature of MRAS-Related Noonan Syndrome: New Case and Comprehensive Literature Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Moreover, emerging targeted therapies, such as MEK inhibitors, offer
      potential for treatment.
    explanation: >-
      Supports MEK inhibition only as an emerging, proposed option for
      MRAS-related Noonan syndrome, not as established therapy.
clinical_trials:
- name: NCT06555237
  phase: PHASE_II
  status: RECRUITING
  description: >-
    MEKinRAS, a randomised phase 2 trial of the MEK inhibitor trametinib added
    to standard therapy for hypertrophic cardiomyopathy in children with a
    genetically confirmed RASopathy. It is the trial most directly relevant to
    the NS11 cardiac phenotype, but eligibility is defined at the RAS/MAPK
    pathway level: the registry entry does not name MRAS or document
    MRAS-positive enrolment, so this is not MRAS-specific interventional
    evidence.
  target_phenotypes:
  - preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:
  - reference: clinicaltrials:NCT06555237
    reference_title: "MEK Inhibitors for the Treatment of Hypertrophic Cardiomyopathy in Patients With RASopathies (MEKinRAS) - Randomized Controlled Trial"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The goal of this study is to evaluate the effectiveness of trametinib
      treatment in patients with Hyperthropic cardiomyopathy and a genetic
      mutation in the RAS/MAPK pathway.
    explanation: >-
      Establishes an active MEK-inhibitor trial for RASopathy-associated
      hypertrophic cardiomyopathy; support is PARTIAL because eligibility is
      pathway-level rather than MRAS-specific.
experimental_models:
- name: MRAS p.Gly23Val patient-derived and isogenic iPSC-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Patient-derived iPSCs carrying MRAS p.Gly23Val, a CRISPR/Cas9-corrected
    isogenic control, and an unrelated control line into which the variant was
    introduced, differentiated to cardiomyocytes. The bidirectional design
    establishes both necessity and sufficiency of the variant for the
    hypertrophic phenotype.
  publication: PMID:31638832
  evidence:
  - reference: PMID:31638832
    reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CRISPR/Cas9 gene editing was used to correct the pathogenic
      p.Gly23Val-MRAS variant in patient cells (isogenic control) and to
      introduce the pathogenic variant into unrelated control cells (disease
      modeled) to determine the necessity and sufficiency of the p.Gly23Val-MRAS
      variant to elicit the disease phenotype in iPSC-derived cardiomyocytes
      (iPSC-CMs).
    explanation: >-
      Describes the bidirectional isogenic design of this model system.
  modeled_mechanisms:
  - target: Cardiomyocyte Hypertrophy and Calcium Handling Abnormality
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces cardiomyocyte enlargement, a hypertrophic gene-expression
      programme and abnormal calcium handling in a human genetic background,
      with isogenic controls on both sides.
    limitations: >-
      iPSC-derived cardiomyocytes are structurally and metabolically immature
      and cultured without haemodynamic load or the non-myocyte cell types of
      the myocardium, so ventricular remodelling and outflow tract obstruction
      cannot be modelled.
    readouts:
    - name: Cardiomyocyte cell size
      target: Cardiomyocyte Hypertrophy and Calcium Handling Abnormality
      direction: INCREASED
      interpretation: >-
        Cell enlargement is the defining in vitro correlate of the hypertrophy
        node.
      evidence:
      - reference: PMID:31638832
        reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Compared with controls, both patient and disease modeled iPSC-CMs were
          significantly larger and demonstrated changes in gene expression and
          intracellular pathway signaling characteristic of cardiac hypertrophy.
        explanation: >-
          Reports the cell-size measurement in both patient and disease-modelled
          lines.
    - name: Frequency of irregular calcium transients
      target: Cardiomyocyte Hypertrophy and Calcium Handling Abnormality
      direction: INCREASED
      interpretation: >-
        Disturbed calcium handling accompanies the hypertrophic phenotype and is
        a plausible arrhythmic substrate.
      evidence:
      - reference: PMID:31638832
        reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Additionally, patient and disease modeled iPSC-CMs displayed impaired
          Ca2+ handling, including increased frequency of irregular Ca2+
          transients and changes in Ca2+ handling kinetics.
        explanation: >-
          Reports the calcium-transient measurement.
    evidence:
    - reference: PMID:31638832
      reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        p.Gly23Val-MRAS is both necessary and sufficient to elicit a cardiac
        hypertrophy phenotype in iPSC-CMs that includes increased cell size,
        changes in cardiac gene expression, and abnormal calcium handling
      explanation: >-
        Supports treating this model as informative for the cardiomyocyte
        hypertrophy node.
- name: MRAS p.Gly23Val CRISPR knock-in iPSC line
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    A human iPSC line into which the NS11-associated MRAS p.Gly23Val variant was
    introduced by CRISPR/Cas9, distributed as a resource for studying
    MRAS-specific pathomechanisms and candidate therapies in disease-relevant
    lineages.
  publication: PMID:37141804
  modeled_mechanisms:
  - target: MRAS Activating Missense Variant
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Introduces the disease-causing allele into a human pluripotent background,
      providing the genetic perturbation from which disease-relevant cell types
      can be derived.
    limitations: >-
      This is a reagent report: the undifferentiated line itself carries no
      characterized disease phenotype, and downstream phenotypes must be
      established in each derived lineage.
    evidence:
    - reference: PMID:37141804
      reference_title: "Generation of a genetically-modified induced pluripotent stem cell line harboring a Noonan syndrome-associated gene variant MRAS p.G23V."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The established MRASG23V iPSC line allows to study MRAS-specific
        pathomechanisms and to test novel therapeutic strategies in various
        disease-relevant cell types and tissues.
      explanation: >-
        States the intended use of the line as a model of the MRAS variant.
  evidence:
  - reference: PMID:37141804
    reference_title: "Generation of a genetically-modified induced pluripotent stem cell line harboring a Noonan syndrome-associated gene variant MRAS p.G23V."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we describe the generation of a human iPSC line harboring the Noonan
      syndrome-associated MRAS p.G23V variant by using CRISPR/Cas9 technology.
    explanation: >-
      Establishes the existence and genotype of this model line.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:28289718
      reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Noonan syndrome (NS; MIM 163950) is an autosomal dominant disorder and a
        member of a family of developmental disorders termed "RASopathies,"
        which are caused mainly by gain-of-function mutations in genes encoding
        RAS/MAPK signaling pathway proteins.
      explanation: >-
        Places NS11 in the inherited, gain-of-function signalling-disorder class.
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: PMID:34080768
      reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This report reinforces the high frequency of HCM among individuals
        harboring MRAS variants, contrasting to the 20% overall prevalence of
        this cardiac anomaly in NS.
      explanation: >-
        The defining clinical burden of NS11 is cardiovascular.
discussions:
- discussion_id: ns11_mras_cancer_risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do germline activating MRAS variants confer an increased cancer risk, as the
    corresponding hotspot substitutions in other RAS homologs do?
  rationale: >-
    p.Gln71Arg is a recurrent oncogenic substitution in RAS homologs across
    various cancers, and other RASopathies carry defined tumour predisposition.
    No NS11 patient has been reported with a malignancy, but the reported cohort
    is tiny and several patients died in infancy, so the question is
    unanswerable from current data rather than answered in the negative.
  attaches_to:
  - pathophysiology#Constitutive M-Ras GTP Loading
  proposed_experiments:
  - experiment_id: ns11_tumour_surveillance_cohort
    name: Longitudinal tumour surveillance of a molecularly ascertained MRAS cohort
    description: >-
      Prospective, protocol-driven oncological follow-up of all surviving
      individuals with pathogenic MRAS variants, pooled internationally given
      the small numbers.
  evidence:
  - reference: PMID:34080768
    reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, long-term follow-up of these individuals and further
      descriptions are required to fully understand the complete phenotypic
      spectrum of NS associated with MRAS germline variants, including if these
      individuals present an increased risk for cancer.
    explanation: >-
      Explicitly names the cancer-risk question as unresolved for MRAS-related
      Noonan syndrome.
- discussion_id: ns11_cardiac_severity_variability
  kind: KNOWLEDGE_GAP
  prompt: >-
    What accounts for the wide variation in cardiac severity among carriers of
    the same recurrent MRAS substitution?
  rationale: >-
    p.Thr68Ile is the most frequently recurrent NS11 variant and has been
    reported both in a neonate who died of cardiac failure and in an adult with
    only mild, late-onset left ventricular hypertrophy. Identical genotype with
    opposite cardiac trajectories implies modifiers, mosaicism, or ascertainment
    bias towards severe paediatric cases, and the distinction matters directly
    for counselling and for whether early myectomy is offered.
  attaches_to:
  - pathophysiology#Hypertrophic Cardiomyopathy with Outflow Tract Obstruction
  proposed_experiments:
  - experiment_id: ns11_genotype_stratified_natural_history
    name: Genotype-stratified natural history study with modifier analysis
    description: >-
      Serial echocardiography in all reported and newly ascertained MRAS
      carriers, stratified by substitution, combined with exome-wide modifier
      screening and assessment of somatic mosaicism.
  evidence:
  - reference: PMID:36734411
    reference_title: "Natural history of MRAS-related Noonan syndrome: Evidence of mild adult-onset left ventricular hypertrophy and neuropsychiatric features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present case provides evidence that HCM does not represent an
      obligatory, early-onset and severe complication in subjects with MRAS
      variants.
    explanation: >-
      Establishes the intra-genotype discrepancy in cardiac severity that this
      gap concerns.
references:
- reference: PMID:20301303
  title: "Noonan Syndrome."
  tags:
  - GeneReviews
notes: >-
  Scope note: this entry deliberately models only the MRAS-specific arm of
  Noonan syndrome. Features shared with the wider Noonan spectrum (pulmonary
  valve stenosis, coagulation defects, cryptorchidism, lymphatic dysplasia in
  general, feeding difficulties, and the full management and surveillance
  protocol) are curated on the parent entry, Noonan Syndrome, which this entry
  lists under `parents` rather than duplicating. Pulmonary valve stenosis and
  the prenatal lymphatic findings are the deliberate exceptions: they are
  curated here because they are directly documented in the reported MRAS
  patients themselves, not inherited from the general Noonan description.

  Frequency note: the GeneReviews entry (PMID:20301303) is cited for
  genotype-independent statements only — diagnostic criteria, transmission risk
  and management. Its frequency bands ("50%-80% of individuals", "found in
  20%-50% of individuals") describe Noonan syndrome as a whole and were
  deliberately NOT inherited by this entry, because assigning general
  Noonan/RASopathy prevalence figures to the eight published MRAS patients would
  be unsupported. The single `frequency:` value in this file is the one figure
  reported for MRAS specifically (HCM in 100% of reported cases).

  Curation provenance note: the first falcon deep-research run for this entry
  resolved "Noonan syndrome 11" to autosomal dominant LZTR1-related Noonan
  syndrome (NS10, OMIM 616564) — a Named Entity Confusion within the numbered
  Noonan series. `just preflight-dr` returned WARN with LZTR1 mentioned 61 times
  against 5 for MRAS, and the report's own OMIM identifiers (605275, 616564)
  disagreed with the MONDO:0032786 xref (618499). That report was discarded and
  not cherry-picked; the entry was built from primary literature anchored on the
  OAK-verified causal gene MRAS (HGNC:7227).

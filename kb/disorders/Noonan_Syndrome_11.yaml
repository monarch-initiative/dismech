  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:34080768
    reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, these preliminary data suggest that variants in MRAS per se are high
      risk factors for the development of an early, severe HCM, mostly of them
      with left ventricle outflow tract obstruction, with poor prognosis.
    explanation: >-
      States that most reported MRAS cases have outflow tract obstruction.
  - reference: PMID:41517739
    reference_title: "Novel characterization of MRAS mutation-associated Noonan syndrome: Mild adult-onset hypertrophic cardiomyopathy combined with infective endocarditis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography demonstrated obstructive hypertrophic cardiomyopathy with

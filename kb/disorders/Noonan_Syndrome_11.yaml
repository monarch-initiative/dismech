    explanation: >-
      Documents late-onset left ventricular hypertrophy as the cardiac
      manifestation in the reported adult NS11 patient.
- category: Growth
  name: Short Stature
  description: >-
    Short stature, a cardinal Noonan syndrome feature, is present in reported

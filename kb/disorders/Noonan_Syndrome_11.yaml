histopathology:
- name: Myocardial hypertrophy with obliterative portal venopathy and lymphangiectasia
  description: >-
    Autopsy of the antenatally diagnosed eighth patient showed the cardiac
    hypertrophy expected of NS11 together with two findings not previously
    described in MRAS-related disease: obliterative portal venopathy (with
    portal-tract widening, hypoplastic or absent portal vein branches and
    increased hepatic arterial branches) and pulmonary lymphangiectasia. The
    reporting authors judged the hepatic and portal abnormalities to be
    manifestations of MRAS-related Noonan syndrome rather than incidental.
  evidence:
  - reference: PMID:41866303
    reference_title: "Hypertrophic Cardiomyopathy as a Key Feature of MRAS-Related Noonan Syndrome: New Case and Comprehensive Literature Review."

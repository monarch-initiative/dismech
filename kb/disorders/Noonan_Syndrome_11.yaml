disease_term:
  preferred_term: Noonan syndrome 11
  description: >-
    The MRAS-related form of Noonan syndrome, caused by germline activating
    missense variants in MRAS and strongly associated with hypertrophic
    cardiomyopathy.
  term:
    id: MONDO:0032786
    label: Noonan syndrome 11
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight unrelated patients with pathogenic MRAS variants had been reported as
    of the February 2025 literature review; MRAS accounts for a very small
    minority of molecularly solved Noonan syndrome.
  evidence:
  - reference: PMID:41866303
    reference_title: "Hypertrophic Cardiomyopathy as a Key Feature of MRAS-Related Noonan Syndrome: New Case and Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This article includes a review of the literature on NS with pathogenic
      MRAS variants and describes an eighth case, the first documented with
      early and severe antenatal manifestations.
    explanation: >-
      A targeted narrative literature review (the authors explicitly preferred
      this to a PRISMA systematic review) counts a total of eight reported
      patients, establishing the ultra-rare, case-report-level occurrence of
      NS11.
pathophysiology:
- name: MRAS Activating Missense Variant
  description: >-
    NS11 is initiated by a germline heterozygous missense substitution in MRAS,
    almost always at one of a narrow set of codons — Gly23 (p.Gly23Val,
    p.Gly23Arg), Thr68 (p.Thr68Ile) or Gln71 (p.Gln71Arg) — that correspond to
    known RASopathy and oncogenic hotspots in other RAS-family GTPases. The
    substitutions lie in or adjacent to the P-loop, switch regions and
    GTP-binding site, and are predicted to perturb effector-interaction surfaces
    and nucleotide handling.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: MRAS
    term:
      id: hgnc:7227
      label: MRAS
  evidence:
  - reference: PMID:28289718
    reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Mutation analysis using in silico mutation prediction tools and molecular
      dynamics simulations predicted the identified variant, p.Gly23Val-MRAS, to
      be damaging to normal protein function and adversely affect effector
      interaction regions and the GTP-binding site.
    explanation: >-
      In silico prediction and molecular dynamics simulation localizing the
      founding NS11 variant to the effector-interaction and GTP-binding
      surfaces of M-Ras. Computational arm of a mixed-source paper.
  - reference: PMID:31108500
    reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gly23 and Thr68 are highly conserved residues, and the corresponding
      codons are known hotspots for RASopathy-associated mutations in other RAS
      proteins.
    explanation: >-
      Establishes that the NS11 variant spectrum is confined to conserved
      RASopathy hotspot codons rather than being distributed across the gene.
  downstream:
  - target: Constitutive M-Ras GTP Loading
    causal_link_type: DIRECT
    description: >-
      Hotspot substitutions impair intrinsic GTP hydrolysis, locking M-Ras in
      its active, GTP-bound state.
    evidence:
    - reference: PMID:31108500
      reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional analyses documented high level of activation of MRAS mutants
        due to impaired GTPase activity, which was associated with constitutive
        plasma membrane targeting, prolonged localization in non-raft
        microdomains, enhanced binding to PPP1CB and SHOC2 protein, and variably
        increased MAPK and PI3K-AKT activation.
      explanation: >-
        Directly attributes the activation of the mutant protein to loss of
        GTPase activity.
- name: Constitutive M-Ras GTP Loading
  description: >-
    Impaired intrinsic GTP hydrolysis leaves mutant M-Ras persistently
    GTP-bound. Activation is quantitatively large: ectopic expression of
    p.Gly23Val-MRAS produced an approximately 40-fold increase in M-Ras
    activation relative to wild type. The GTP-loaded mutant is also
    constitutively targeted to the plasma membrane and dwells abnormally long in
    non-raft microdomains, so the active protein is retained where its effectors
    are engaged.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: M-Ras GTP hydrolysis
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: constitutive plasma membrane targeting of M-Ras
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: INCREASED
  evidence:
  - reference: PMID:28289718
    reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Subsequent ectopic expression experiments revealed a 40-fold increase in
      MRAS activation for p.Gly23Val-MRAS compared with WT-MRAS.
    explanation: >-
      Quantifies the gain of function at the level of M-Ras activation state.
  - reference: PMID:31108500
    reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analyses documented high level of activation of MRAS mutants
      due to impaired GTPase activity, which was associated with constitutive
      plasma membrane targeting, prolonged localization in non-raft
      microdomains, enhanced binding to PPP1CB and SHOC2 protein, and variably
      increased MAPK and PI3K-AKT activation.
    explanation: >-
      Supports both the impaired GTPase activity and the constitutive membrane
      localization of NS11 mutants.
  downstream:
  - target: Enhanced MRAS-SHOC2-PP1 Holophosphatase Assembly
    causal_link_type: DIRECT
    description: >-
      Persistently active, membrane-anchored M-Ras binds SHOC2 and the PP1
      catalytic subunit PPP1CB more avidly, promoting formation of the
      heterotrimeric holophosphatase.
    evidence:
    - reference: PMID:30348783
      reference_title: "SHOC2-MRAS-PP1 complex positively regulates RAF activity and contributes to Noonan syndrome pathogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        MRAS, SHOC2, and PPP1CB are mutated in Noonan syndrome, and we show that
        syndromic mutations invariably promote complex formation with each
        other, but not necessarily with other interactors.
      explanation: >-
        Shows that Noonan-causing MRAS mutations act by enhancing ternary
        complex formation with SHOC2 and PPP1CB.
- name: Enhanced MRAS-SHOC2-PP1 Holophosphatase Assembly
  description: >-
    M-Ras, the leucine-rich-repeat scaffold SHOC2 and protein phosphatase 1
    assemble into a heterotrimeric holoenzyme in which M-Ras and SHOC2 act as
    regulatory subunits conferring specificity for RAF, and M-Ras additionally
    acts as the membrane-targeting subunit. Noonan-causing substitutions in any
    of the three components — MRAS, SHOC2 or PPP1CB — promote assembly of this
    complex, which is the shared biochemical lesion linking NS11 to
    SHOC2-related and PPP1CB-related Noonan-spectrum disease.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: PP1 holoenzyme serine/threonine phosphatase activity
    term:
      id: GO:0004722
      label: protein serine/threonine phosphatase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:30348783
    reference_title: "SHOC2-MRAS-PP1 complex positively regulates RAF activity and contributes to Noonan syndrome pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The MRAS GTPase, a close relative of RAS oncoproteins, interacts with
      SHOC2 and protein phosphatase 1 (PP1) to form a heterotrimeric holoenzyme
      that dephosphorylates this S259 RAF site.
    explanation: >-
      Defines the holophosphatase and its substrate, the inhibitory RAF S259
      site.
  - reference: PMID:36175670
    reference_title: "Structure of the SHOC2-MRAS-PP1C complex provides insights into RAF activation and Noonan syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The SMP complex forms only when MRAS is in an active state and is
      dependent on SHOC2 functioning as a scaffolding protein in the complex by
      bringing PP1C and MRAS together.
    explanation: >-
      The crystal structure shows the holophosphatase assembles only around
      active, GTP-bound M-Ras, which is why a constitutively active NS11 mutant
      drives complex formation.
  downstream:
  - target: RAF S259 Dephosphorylation and RAF Activation
    causal_link_type: DIRECT
    description: >-
      The assembled holophosphatase removes the inhibitory S259 phosphate from
      CRAF (S365 on BRAF), relieving 14-3-3-mediated autoinhibition and
      permitting RAF activation.
    evidence:
    - reference: PMID:30348783
      reference_title: "SHOC2-MRAS-PP1 complex positively regulates RAF activity and contributes to Noonan syndrome pathogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        MRAS also functions as a targeting subunit as membrane localization is
        required for efficient RAF dephosphorylation and ERK pathway regulation
        in cells.
      explanation: >-
        Links the membrane-localized complex to RAF dephosphorylation and ERK
        pathway output.
- name: RAF S259 Dephosphorylation and RAF Activation
  description: >-
    Dephosphorylation of the inhibitory S259 site on CRAF (S365 on BRAF) by the
    MRAS-SHOC2-PP1 holophosphatase is a rate-limiting step in RAF activation.
    With mutant M-Ras driving complex assembly, this brake is released more
    readily and RAF signalling into MEK-ERK is potentiated.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: RAF S259 dephosphorylation
    term:
      id: GO:0006470
      label: protein dephosphorylation
    modifier: INCREASED
  evidence:
  - reference: PMID:30348783
    reference_title: "SHOC2-MRAS-PP1 complex positively regulates RAF activity and contributes to Noonan syndrome pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, Noonan syndrome in individuals with SHOC2, MRAS, or PPPC1B mutations
      is likely driven at the biochemical level by enhanced ternary complex
      formation and highlights the crucial role of this phosphatase holoenzyme
      in RAF S259 dephosphorylation, ERK pathway dynamics, and normal human
      development.
    explanation: >-
      States the mechanistic model connecting MRAS mutation, holophosphatase
      assembly and RAF S259 dephosphorylation to Noonan syndrome.
  downstream:
  - target: RAS-MAPK and PI3K-AKT Pathway Hyperactivation
    causal_link_type: DIRECT
    description: >-
      Released RAF drives increased MEK-ERK signal flux; NS11 mutants
      additionally raise PI3K-AKT output to a variable degree.
    evidence:
    - reference: PMID:28289718
      reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Additional biochemical assays demonstrated enhanced activation of both
        RAS/MAPK pathway signaling and downstream gene expression in cells
        expressing p.Gly23Val-MRAS.
      explanation: >-
        Demonstrates increased MAPK pathway output downstream of the NS11
        variant.
- name: RAS-MAPK and PI3K-AKT Pathway Hyperactivation
  description: >-
    The convergent cellular consequence of activating MRAS variants is
    upregulated signal flow through the RAF-MEK-ERK cascade, with variably
    increased PI3K-AKT signalling. This is the shared final common pathway of
    the RASopathies, and it accounts for the Noonan-spectrum craniofacial,
    growth and neurodevelopmental features that NS11 shares with the parent
    Noonan Syndrome entry.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: INCREASED
  - preferred_term: PI3K-AKT signalling
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:31108500
    reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, our findings further emphasize the relevance of the
      MRAS-SHOC2-PPP1CB axis in the control of MAPK signaling, and the
      contribution of both MAPK and PI3K-AKT pathways in MRAS functional
      upregulation.
    explanation: >-
      Establishes that both MAPK and PI3K-AKT arms are engaged by MRAS
      functional upregulation.
  - reference: PMID:28289718
    reference_title: "Elucidation of MRAS-mediated Noonan syndrome with cardiac hypertrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additional biochemical assays demonstrated enhanced activation of both
      RAS/MAPK pathway signaling and downstream gene expression in cells
      expressing p.Gly23Val-MRAS.
    explanation: >-
      Independent demonstration of RAS/MAPK hyperactivation by an NS11 variant.
  downstream:
  - target: Cardiomyocyte Hypertrophy and Calcium Handling Abnormality
    causal_link_type: DIRECT
    description: >-
      Pathway hyperactivation in cardiomyocytes produces cell enlargement, a
      hypertrophic gene-expression programme and disturbed calcium handling.
    evidence:
    - reference: PMID:31638832
      reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Compared with controls, both patient and disease modeled iPSC-CMs were
        significantly larger and demonstrated changes in gene expression and
        intracellular pathway signaling characteristic of cardiac hypertrophy.
      explanation: >-
        Directly links the NS11 variant, via altered intracellular pathway
        signalling, to a cardiomyocyte hypertrophy phenotype.
- name: Cardiomyocyte Hypertrophy and Calcium Handling Abnormality
  description: >-
    In patient-derived and CRISPR-engineered isogenic iPSC-derived
    cardiomyocytes, p.Gly23Val-MRAS is both necessary and sufficient to produce
    increased cell size, a cardiac hypertrophy gene-expression signature, and
    impaired calcium handling with an increased frequency of irregular calcium
    transients and altered kinetics. This is the cell-level substrate of the
    hypertrophic cardiomyopathy that defines NS11 clinically.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle hypertrophy
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    modifier: INCREASED
  - preferred_term: intracellular calcium ion homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31638832
    reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      p.Gly23Val-MRAS is both necessary and sufficient to elicit a cardiac
      hypertrophy phenotype in iPSC-CMs that includes increased cell size,
      changes in cardiac gene expression, and abnormal calcium handling
    explanation: >-
      Isogenic-control experiments establish necessity and sufficiency of the
      NS11 variant for the cardiomyocyte phenotype.
  - reference: PMID:31638832
    reference_title: "MRAS Variants Cause Cardiomyocyte Hypertrophy in Patient-Specific Induced Pluripotent Stem Cell-Derived Cardiomyocytes: Additional Evidence for MRAS as a Definitive Noonan Syndrome-Susceptibility Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, patient and disease modeled iPSC-CMs displayed impaired Ca2+
      handling, including increased frequency of irregular Ca2+ transients and
      changes in Ca2+ handling kinetics.
    explanation: >-
      Documents the calcium-handling component of the cellular phenotype.
  downstream:
  - target: Hypertrophic Cardiomyopathy with Outflow Tract Obstruction
    causal_link_type: DIRECT
    description: >-
      Cardiomyocyte hypertrophy at tissue scale produces ventricular wall
      thickening that in most reported NS11 patients obstructs the left
      ventricular outflow tract.
    evidence:
    - reference: PMID:34080768
      reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, these preliminary data suggest that variants in MRAS per se are
        high risk factors for the development of an early, severe HCM, mostly of
        them with left ventricle outflow tract obstruction, with poor prognosis.
      explanation: >-
        Connects MRAS variants specifically to obstructive, early and severe
        hypertrophic cardiomyopathy.
- name: Hypertrophic Cardiomyopathy with Outflow Tract Obstruction
  description: >-
    The organ-level lesion that distinguishes NS11 within the Noonan spectrum.
    Reported patients have shown hypertrophic cardiomyopathy far more
    consistently than Noonan syndrome overall, in which HCM affects roughly
    20-30%; the MRAS cases are additionally weighted towards early onset,
    outflow tract obstruction, and poor prognosis, with deaths in the neonatal
    and infant periods. The severity is nonetheless not invariant — an adult
    with the recurrent p.Thr68Ile substitution had only mild, late-onset left
    ventricular hypertrophy — so obligate early severe HCM is not a safe
    inference from genotype.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:34080768
    reference_title: "Atypical, severe hypertrophic cardiomyopathy in a newborn presenting Noonan syndrome harboring a recurrent heterozygous MRAS variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report reinforces the high frequency of HCM among individuals
      harboring MRAS variants, contrasting to the 20% overall prevalence of this
      cardiac anomaly in NS.
    explanation: >-
      Contrasts the near-universal HCM of MRAS-related disease against the much
      lower background rate in Noonan syndrome generally.
  - reference: PMID:36734411
    reference_title: "Natural history of MRAS-related Noonan syndrome: Evidence of mild adult-onset left ventricular hypertrophy and neuropsychiatric features."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present case provides evidence that HCM does not represent an
      obligatory, early-onset and severe complication in subjects with MRAS
      variants.
    explanation: >-
      Qualifies the severity claim: the cardiac phenotype is variable, and a
      mild late-onset course occurs.
phenotypes:
- category: Cardiovascular
  name: Hypertrophic Cardiomyopathy
  description: >-
    The cardinal and near-universal feature of MRAS-related Noonan syndrome. All
    unrelated patients reported to date have had HCM, most with early onset and
    a severe, often obstructive course; a minority present with mild late-onset
    left ventricular hypertrophy instead.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:41866303
    reference_title: "Hypertrophic Cardiomyopathy as a Key Feature of MRAS-Related Noonan Syndrome: New Case and Comprehensive Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that pathogenic MRAS variants confer a high risk of
      severe HCM (100% of cases).
    explanation: >-
      A literature review of all reported NS11 cases quantifies HCM at 100% of
      cases, supporting the VERY_FREQUENT band.
  - reference: PMID:31108500
    reference_title: "Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report provides additional evidence that a narrow spectrum of
      activating mutations in MRAS represents another rare cause of NS, and that
      MRAS has to be counted among the RASopathy genes predisposing to HCM.
    explanation: >-
      Independent case series placing MRAS among the HCM-predisposing RASopathy
      genes.
- category: Cardiovascular
  name: Left Ventricular Outflow Tract Obstruction
  description: >-
    Asymmetric hypertrophy in reported NS11 patients frequently obstructs the

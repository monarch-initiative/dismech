- name: Cochlear Hair Cell Degeneration
  description: >-
    Mice homozygous for the Tomt add missense allele show progressive degeneration of the
    organ of Corti. This follows the loss of transduction, but the steps in between are not
    known, and the human course is undocumented: no temporal bone from a DFNB63 patient has
    been studied, and the human hearing loss is usually described as congenital and profound
    rather than progressive.

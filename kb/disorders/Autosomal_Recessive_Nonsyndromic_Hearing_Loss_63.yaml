phenotypes:
- category: Auditory
  name: Profound sensorineural hearing impairment
  description: >-
    Most reported patients, including the founding Pakistani, Turkish and Tunisian families
    and the later Iranian and Mauritanian families, have profound hearing loss. Rarer
    compound heterozygous genotypes give milder loss (see the high-frequency and progressive
    phenotypes below), so profound loss is typical but not universal.
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  evidence:
  - reference: PMID:17066295
    reference_title: >-
      Autosomal recessive nonsyndromic deafness locus DFNB63 at chromosome 11q13.2-q13.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was used to identify DFNB63, a new locus for congenital profound sensorineural hearing
      loss
    explanation: >-
      The locus-defining family had congenital profound sensorineural loss.
  - reference: PMID:18953341
    reference_title: >-
      Mutations of LRTOMT, a fusion gene with alternative reading frames, cause nonsyndromic
      deafness in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations of LRTOMT are associated with profound nonsyndromic hearing loss at the DFNB63
      locus
    explanation: >-
      The gene-discovery families had profound nonsyndromic loss.
- category: Auditory
  name: Congenital sensorineural hearing impairment
  description: >-
    Hearing loss is present from birth or is prelingual in the reported families.
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  evidence:
  - reference: PMID:23053991
    reference_title: >-
      The c.242G>A mutation in LRTOMT gene is responsible for a high prevalence of deafness
      in the Moroccan population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that after the GJB2 gene mutation in LRTOMT gene is the second cause
      of congenital hearing impairment in Moroccan patients.
    explanation: >-
      Places the LRTOMT founder allele among the causes of congenital hearing impairment in
      a North African cohort.
- category: Auditory
  name: Bilateral sensorineural hearing impairment
  description: >-
    Where audiograms are reported, the loss affects both ears.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:32517708
    reference_title: >-
      A novel pathogenic variant in the LRTOMT gene causes autosomal recessive non-syndromic
      hearing loss in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiogram indicate sever-to-profound hearing loss in both ears.
    explanation: >-
      Bilateral severe-to-profound loss in the Iranian proband (the source's spelling is kept).
  - reference: PMID:36928321
    reference_title: >-
      Identification a novel pathogenic LRTOMT mutation in Mauritanian families with
      nonsyndromic deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proband, indicated by an arrow, had profound hearing loss in both ears.
    explanation: >-
      Bilateral profound loss in a Mauritanian proband homozygous for p.Leu60Pro.
- category: Auditory
  name: High-frequency hearing impairment
  description: >-
    A sloping, high-frequency (ski-slope) pattern of moderate loss has been reported in a
    Japanese compound heterozygote, and LRTOMT was among the genes found in a tertiary-centre
    series of patients with ski-slope hearing loss. This is the mild end of the spectrum and is
    uncommon.
  phenotype_term:
    preferred_term: High-frequency hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
  evidence:
  - reference: PMID:25788562
    reference_title: >-
      Novel mutations in LRTOMT associated with moderate progressive hearing loss in
      autosomal recessive inheritance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had moderate sloping hearing loss at high frequencies
    explanation: >-
      A single compound heterozygous patient with high-frequency loss.
  - reference: PMID:35212774
    reference_title: >-
      Molecular aetiology of ski-slope hearing loss and audiological course of cochlear
      implantees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TMC1, MYO7A, and TMPRSS3 variants were the most common, while LRTOMT was newly
      identified as a causative gene.
    explanation: >-
      LRTOMT found as a cause in a cohort selected for ski-slope (high-frequency) loss. The
      abstract does not give the number of LRTOMT patients.
- category: Auditory
  name: Progressive hearing impairment
  description: >-
    Progression has been documented in one patient, a Japanese compound heterozygote whose
    moderate loss worsened over six years. Most reports describe congenital profound loss
    with no follow-up data on progression.
  phenotype_term:
    preferred_term: Progressive hearing impairment
    term:
      id: HP:0001730
      label: Progressive hearing impairment
  evidence:
  - reference: PMID:25788562
    reference_title: >-
      Novel mutations in LRTOMT associated with moderate progressive hearing loss in
      autosomal recessive inheritance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which progressed at 1000 Hz and higher frequencies over a period of 6 years
    explanation: >-
      Serial audiograms in a single patient.
prevalence:
- population: Tunisian healthy controls of Berber origin (136 individuals)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 19110.0
  notes: >-
    Heterozygous carrier frequency of the c.242G>A founder allele, 19.11% in 136 Berber
    controls. The same study found a higher heterozygote frequency only among Tunisians of
    Berber origin, not in Andalusian or ethnically undefined Tunisian controls. This is a
    single-allele carrier frequency in a small control group, not a disease prevalence; no
    population prevalence of DFNB63 has been published.
  evidence:
  - reference: PMID:34514748
    reference_title: >-
      Deep analysis of the LRTOMTc.242G>A variant in non-syndromic hearing loss North
      African patients and the Berber population: Implications for genetic diagnosis and
      genealogical studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      revealed higher frequency for the heterozygous state among Tunisians of Berber origin
      only (19.11%)
    explanation: >-
      The heterozygote frequency of the founder allele in Berber controls.

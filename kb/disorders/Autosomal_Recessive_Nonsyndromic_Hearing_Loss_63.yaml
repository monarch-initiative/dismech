mechanistic_hypotheses:
- hypothesis_group_id: tomt_tmc_trafficking
  hypothesis_label: TOMT is required to traffic TMC1/TMC2 to the stereocilia, and its loss abolishes hair-cell mechanotransduction
  status: CANONICAL
  description: >-
    TOMT, the LRTOMT2 product, is a Golgi-enriched transmembrane protein that binds TMC1 and
    TMC2 and is required for their delivery to the hair bundle. Without it the
    mechanoelectrical transduction channel lacks its pore-forming subunits, hair cells have
    no transduction current, and they later degenerate. This function does not need the
    protein's methyltransferase activity. The model rests on mouse and zebrafish loss of
    function and on co-expression in heterologous cells; it has not been tested in human
    tissue.
  evidence:
  - reference: PMID:28504928
    reference_title: >-
      The murine catecholamine methyltransferase mTOMT is essential for mechanotransduction
      by cochlear hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Instead, mTOMT binds to putative components of the mechanotransduction channel in hair
      cells and is essential for the transport of some of these components into the
      mechanically sensitive stereocilia of hair cells.
    explanation: >-
      States the trafficking model from mouse hair cells, with binding shown by
      co-immunoprecipitation.
  - reference: PMID:28534737
    reference_title: >-
      Integration of Tmc1/2 into the mechanotransduction complex in zebrafish hair cells is
      regulated by Transmembrane O-methyltransferase (Tomt).
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, we propose a model of MET complex assembly where Tomt and the Tmcs interact
      within the secretory pathway to traffic Tmc proteins to the hair bundle.
    explanation: >-
      The same model reached independently in zebrafish.
- hypothesis_group_id: catecholamine_catabolism_defect
  hypothesis_label: Loss of COMT2/TOMT methyltransferase activity causes deafness through defective catecholamine catabolism
  status: DEPRECATED
  description: >-
    The first mouse study identified Tomt as a catechol-O-methyltransferase (COMT2), found
    its activity reduced by the add missense allele, and proposed that defective
    catecholamine catabolism causes the auditory and vestibular phenotypes. Two later studies
    argue against this. In mouse, the hair-cell role of TOMT is independent of its
    methyltransferase activity and COMT cannot replace it. In zebrafish, Tomt or mouse TOMT
    rescue mechanotransduction in tomt mutants but Comt does not. The hypothesis is kept here
    as the historical model; no causal edge in this entry depends on it.
  evidence:
  - reference: PMID:18794526
    reference_title: >-
      A catechol-O-methyltransferase that is essential for auditory function in mice and
      humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      COMT2 enzymatic activity is significantly reduced by the missense mutation, suggesting
      that a defect in catecholamine catabolism underlies the auditory and vestibular
      phenotypes.
    explanation: >-
      The original statement of the hypothesis, inferred from reduced enzyme activity in the
      add mouse.
  - reference: PMID:28504928
    reference_title: >-
      The murine catecholamine methyltransferase mTOMT is essential for mechanotransduction
      by cochlear hair cells.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The role of mTOMT in hair cells is independent of mTOMT methyltransferase function and
      mCOMT cannot substitute for mTOMT function.
    explanation: >-
      The hair-cell function of TOMT does not depend on methyltransferase activity, which
      contradicts a catecholamine-catabolism mechanism.
  - reference: PMID:28534737
    reference_title: >-
      Integration of Tmc1/2 into the mechanotransduction complex in zebrafish hair cells is
      regulated by Transmembrane O-methyltransferase (Tomt).
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanotransduction in mercury mutants can be rescued by transgenic expression of either
      zebrafish Tomt or mouse TOMT, but not with the closely related Comt enzyme.
    explanation: >-
      Rescue by TOMT but not by COMT, which has the catechol-O-methyltransferase activity,
      argues that loss of that activity is not the cause of the defect.
pathophysiology:
- name: LRTOMT2 (TOMT) Biallelic Loss of Function
  description: >-
    Homozygous or compound heterozygous LRTOMT variants remove or impair the LRTOMT2 (TOMT)
    product. The reported alleles include splice-site, frameshift and missense changes; the
    missense alleles of the discovery report lie in the methyltransferase-like domain and are
    predicted to destabilize it. TOMT is expressed in the sensory hair cells of the cochlea
    and vestibular organs. This is the initiating lesion and the node at which the disease
    specializes the generic cochlear sensory-epithelium insult of the sensorineural hair cell
    loss module.

      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    Deafness at the DFNB63 locus segregates as an autosomal recessive trait. Affected
    individuals are homozygous or compound heterozygous for LRTOMT variants, and heterozygous
    parents and siblings hear normally. Most reported families are consanguineous, and the
    locus was mapped three times independently by homozygosity linkage in Pakistani, Turkish
    and Tunisian pedigrees. Penetrance is recorded as COMPLETE because no unaffected biallelic
    individual has been described; this is inferred from ascertainment, since no penetrance
    study exists.
  evidence:
  - reference: PMID:18953341
    reference_title: >-
      Mutations of LRTOMT, a fusion gene with alternative reading frames, cause nonsyndromic
      deafness in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four mutations of LRTOMT co-segregate with deafness in these families, carriers
      have normal hearing
    explanation: >-
      Recessive segregation in the gene-discovery families: affected members are homozygous
      and heterozygous carriers hear normally.
  - reference: PMID:17066295
    reference_title: >-
      Autosomal recessive nonsyndromic deafness locus DFNB63 at chromosome 11q13.2-q13.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genome wide linkage analysis of nonsyndromic deafness segregating in a consanguineous
      Pakistani family (PKDF537) was used to identify DFNB63
    explanation: >-
      The locus was first defined by linkage in a consanguineous family, the pedigree
      structure expected for a recessive trait.
  - reference: PMID:25788562
    reference_title: >-
      Novel mutations in LRTOMT associated with moderate progressive hearing loss in
      autosomal recessive inheritance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygotes with a novel frame-shift mutation and a missense mutation were
      identified in the LRTOMT gene.
    explanation: >-
      A compound heterozygous genotype in a nonconsanguineous Japanese family, showing that
      the recessive mode is not limited to homozygous founder alleles.
genetic:
- name: LRTOMT
  gene_term:
    preferred_term: LRTOMT
    term:
      id: hgnc:25033
      label: LRTOMT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Leucine-rich transmembrane and O-methyltransferase domain containing gene at
    11q13.3-q13.4 (previous symbols LRRC51 and DFNB63; aliases include COMT2, LRTOMT1 and
    LRTOMT2). In primates it arose by fusion of two neighbouring ancestral genes that remain
    separate in rodents (Lrrc51 and Tomt). Exons 5, 7 and 8 are read in two frames, encoding
    either the C-terminus of the leucine-rich protein LRTOMT1 or the N-terminus of LRTOMT2,
    which carries a transmembrane helix and a catechol-O-methyltransferase-like domain. The
    mouse ortholog of LRTOMT2 is TOMT. ClinGen's Hearing Loss Gene Curation Expert Panel
    classifies LRTOMT for autosomal recessive nonsyndromic hearing loss 63 (MONDO:0012670)
    as Definitive, autosomal recessive, SOP4, dated 2017-02-15 (ClinGen assertion
    CGGCIEX:assertion_5662).
  notes: >-
    Reported pathogenic genotypes are homozygous in consanguineous families or compound
    heterozygous. In the gene-discovery report the families carried a splice-donor variant
    c.358+4G>A that skips exon 8 (Turkish family TR57) and the missense variants c.242G>A
    p.Arg81Gln (Tunisian), c.313T>C p.Trp105Arg (Tunisian) and c.328G>A p.Glu110Lys
    (Pakistani), named on LRTOMT2. Later reports added a 16-bp frameshift deletion
    p.Ala170Alafs*20 in exon 6 (Iranian), a homozygous missense c.179T>C p.Leu60Pro in four
    Mauritanian families, and a frameshift plus missense compound heterozygote in a Japanese
    patient with moderate loss. Du et al. reported a nonsense allele in the human ortholog of
    mouse Comt2. The three missense variants of the discovery report lie in the
    methyltransferase-like domain of LRTOMT2, and the authors could not exclude an effect on
    LRTOMT1 transcripts; the mouse and zebrafish work that defines the mechanism concerns the
    TOMT product. c.242G>A shares one haplotype across North African patients and is a
    founder allele. A screen of 157 pupils with recessive hearing loss from four provinces of
    north and west Iran found no LRTOMT variant.
  evidence:
  - reference: PMID:18953341
    reference_title: >-
      Mutations of LRTOMT, a fusion gene with alternative reading frames, cause nonsyndromic
      deafness in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here that mutations of LRTOMT are associated with profound nonsyndromic
      hearing loss at the DFNB63 locus on human chromosome 11q13.3-q13.4.
    explanation: >-
      The gene-discovery report assigning DFNB63 to LRTOMT by positional cloning in families
      linked to the locus.
  - reference: PMID:32517708
    reference_title: >-
      A novel pathogenic variant in the LRTOMT gene causes autosomal recessive non-syndromic
      hearing loss in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES results showed a novel frameshift (16 bp deletion) variant (p.Ala170Alafs*20) in the
      LRTOMT gene. This variant, which resides in exon 6, was found to be co-segregating in the
      family.
    explanation: >-
      An independent family with a truncating LRTOMT allele that co-segregates with
      recessive nonsyndromic hearing loss.
  - reference: PMID:36928321
    reference_title: >-
      Identification a novel pathogenic LRTOMT mutation in Mauritanian families with
      nonsyndromic deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one biallelic missense mutation, predicted as pathogenic (c.179 T > C;p.Leu60Pro)
      was found at homozygous state in four families.
    explanation: >-
      A further homozygous missense allele in an unrelated population.
  - reference: PMID:24551789
    reference_title: >-
      Investigation of LRTOMT gene (locus DFNB63) mutations in Iranian patients with
      autosomal recessive non-syndromic hearing loss.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PCR-SSCP/HA and the subsequent direct DNA sequencing showed no mutation in the
      population studied.
    explanation: >-
      A negative screen in 157 Iranian patients. It does not bear on whether LRTOMT causes
      DFNB63, but it shows that the contribution of the gene varies between populations.
  case_fractions:
  - population: >-
      105 unrelated Moroccan families with nonsyndromic hearing impairment
    case_fraction_percent: 8.75
    cohort_size: 105
    notes: >-
      Families homozygous for c.242G>A only. The screen covered exon 8 and no other LRTOMT

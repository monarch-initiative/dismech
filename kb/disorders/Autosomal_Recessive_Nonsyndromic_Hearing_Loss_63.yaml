      The heterozygote frequency of the founder allele in Moroccan controls.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis rests on finding biallelic LRTOMT variants in a person with nonsyndromic
    sensorineural hearing loss; the audiological picture is not specific. Exome sequencing
    after a negative GJB2 test identified the Iranian family. In North Africa, where c.242G>A
    is a founder allele, targeted testing for this variant has been proposed as a first step.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32517708
    reference_title: >-
      A novel pathogenic variant in the LRTOMT gene causes autosomal recessive non-syndromic
      hearing loss in an Iranian family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A proband from an Iranian consanguineous family was examined via WES, following GJB2
      sequencing.
    explanation: >-
      Exome sequencing after GJB2 testing was the route to the molecular diagnosis.
  - reference: PMID:34514748
    reference_title: >-
      Deep analysis of the LRTOMTc.242G>A variant in non-syndromic hearing loss North
      African patients and the Berber population: Implications for genetic diagnosis and
      genealogical studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the LRTOMT c.242G>A homozygous variant could be used as a useful deafness biomarker for
      North African ARNSHL patients
    explanation: >-
      The proposal to use the founder allele as a targeted test in North African patients.
treatments:
- name: Cochlear Implantation
  description: >-
    Cochlear implantation is used for the profound loss typical of DFNB63. The lesion is in
    the hair cell, so the auditory nerve that an implant stimulates is not the primary target
    of the disease. Outcome data are anecdotal: in the Mauritanian report, early implantation
    appeared to improve hearing in one carrier of the p.Leu60Pro genotype. No series of
    DFNB63 implant outcomes has been published.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  evidence:
  - reference: PMID:36928321
    reference_title: >-
      Identification a novel pathogenic LRTOMT mutation in Mauritanian families with
      nonsyndromic deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early fitting of a cochlear implant seemed to improve the audition ability of the
      mutation carrier.
    explanation: >-
      A single uncontrolled observation; it shows implantation is used and may help, not how
      well it works.
- name: Hearing Aid Amplification
  description: >-
    Hearing aids are an option where residual hearing allows useful benefit, most plausibly at
    the milder, high-frequency end of the spectrum. No DFNB63-specific outcome data exist: the
    only cited source is a ski-slope hearing loss series in which LRTOMT was one of several
    causal genes, and it does not report hearing-aid use by gene.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:

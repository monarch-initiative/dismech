name: Autosomal Recessive Nonsyndromic Hearing Loss 63
creation_date: "2026-11-16T14:25:26Z"
category: Mendelian
synonyms:
- DFNB63
- autosomal recessive nonsyndromic deafness type 63
- autosomal recessive deafness 63
- deafness, autosomal recessive 63
- autosomal recessive nonsyndromic deafness caused by mutation in LRTOMT
- LRTOMT-related nonsyndromic hearing loss
- TOMT-related hearing loss
description: >-
  DFNB63 is autosomal recessive, nonsyndromic sensorineural hearing loss caused by biallelic
  pathogenic variants in LRTOMT on chromosome 11q13.3-q13.4. LRTOMT is a primate fusion gene
  with two alternative reading frames; the disease-relevant product is LRTOMT2, the
  transmembrane O-methyltransferase (TOMT) moiety, which corresponds to the separate rodent
  gene Tomt (Comt2). Most affected individuals come from consanguineous families in North
  Africa, the Middle East, Turkey and Pakistan, and have congenital, bilateral, profound
  hearing loss. A recurrent founder allele, c.242G>A (p.Arg81Gln), accounts for a measurable
  share of recessive deafness in Morocco, Tunisia and Libya. Rarer compound heterozygous
  genotypes have been reported with moderate, high-frequency or progressive loss. In mouse and
  zebrafish, TOMT is a Golgi-enriched protein that binds TMC1 and TMC2 and is required to
  deliver them to the hair-cell stereocilia; without it, hair cells have no
  mechanoelectrical transduction current and later degenerate. This role does not depend on
  methyltransferase activity, which replaced the earlier proposal that DFNB63 is a disorder
  of catecholamine catabolism. Animal models also show vestibular dysfunction, which has not
  been described in patients. Management is auditory rehabilitation with hearing aids or
  cochlear implantation.

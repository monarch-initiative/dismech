- name: Failed TMC1 and TMC2 Trafficking to the Hair Bundle
  description: >-
    TOMT is enriched in the Golgi apparatus of hair cells and is itself excluded from the hair
    bundle. It binds TMC1 and TMC2, the pore-forming subunits of the mechanoelectrical
    transduction channel, and is needed to move them through the secretory pathway to the
    stereocilia. Without TOMT, TMC1 and TMC2 fail to reach the bundle, whereas other MET
    complex proteins still do. The interaction with TMC1 is modulated by His183 in the
    putative active site of TOMT, but the methyltransferase activity itself is not required.
    Evidence is from zebrafish and mouse hair cells and from HEK293 co-expression.
  biological_scale: CELLULAR
  role: central_effector

- name: Absent Hair Cell Mechanoelectrical Transduction
  description: >-
    Without TMC1 and TMC2 in the stereocilia, cochlear hair cells cannot convert hair-bundle
    deflection into a transduction current. In Tomt add/add mice, outer hair cell transducer
    currents are already very small at postnatal day 4 and absent by day 7, while membrane
    potential, outward currents and nonlinear capacitance are normal, so the defect is
    specific to transduction rather than a sign of a sick cell. Zebrafish tomt mutants lack
    transduction in both auditory and vestibular hair cells. This is the node at which the
    disease specializes the hair-cell mechanotransduction failure of the sensorineural hair
    cell loss module.
  biological_scale: CELLULAR
  conforms_to: "sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death"

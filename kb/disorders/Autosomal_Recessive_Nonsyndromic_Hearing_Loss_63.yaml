        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_phenotypes:
  - preferred_term: High-frequency hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
  evidence:
  - reference: PMID:35212774
    reference_title: >-
      Molecular aetiology of ski-slope hearing loss and audiological course of cochlear
      implantees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Twenty-five patients eventually received CI, while 13 continued to wear the hearing aid
    explanation: >-
      Hearing-aid use in a ski-slope hearing loss cohort that included LRTOMT patients. The
      abstract does not say which genes the hearing-aid users carried, so this is not
      DFNB63-specific.

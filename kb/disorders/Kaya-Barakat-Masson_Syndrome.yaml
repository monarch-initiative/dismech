genetic:
- name: YIF1B
  gene_term:
    preferred_term: YIF1B
    term:
      id: hgnc:30511
      label: YIF1B
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    YIF1B encodes a ubiquitous transmembrane protein of the anterograde
    endoplasmic-reticulum-to-cell-membrane trafficking machinery that also
    maintains Golgi apparatus morphology. Reported disease-causing variants are
    biallelic and loss-of-function (truncating, splice, and deletion).
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_c0891180-c48d-4c14-bbed-920418bb45cf-2024-08-16T160000.000Z
    evidence:
    - reference: CGGV:assertion_c0891180-c48d-4c14-bbed-920418bb45cf-2024-08-16T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "YIF1B | HGNC:30511 | Kaya-Barakat-Masson syndrome | MONDO:0030878 | AR | Definitive"
      explanation: ClinGen Syndromic Disorders GCEP classifies the YIF1B-Kaya-Barakat-Masson syndrome relationship as Definitive (autosomal recessive).
  variants:
  - name: p.Ala63fs
    description: >-
      Recurrent truncating variant (c.186dupT) identified in five independent
      families; a probable founder allele, previously found in Arab families and
      in a Spanish proband consistent with historic migration.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34373908
      reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "both p.Ala63fs and p.Glu200* are recurrent variants, identified in five and three independent families, respectively"
      explanation: Reports p.Ala63fs as a recurrent allele across five families.
  - name: p.Glu200*
    description: >-
      Recurrent truncating variant (c.598G>T) identified in three independent
      families of Somali descent, likely indicating a founder mechanism.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34373908
      reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "all families harbouring p.Glu200* are from Somali descent, likely indicating a founder mechanism"
      explanation: Reports p.Glu200* as a recurrent founder allele in Somali families.
  evidence:
  - reference: PMID:36948290
    reference_title: "YIF1B-related Kaya-Barakat-Masson Syndrome: Report of a new patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KABAMAS is caused by bi-allelic variants in the YIF1B gene which encodes a trafficking protein involved in the anterograde traffic from the endoplasmic reticulum to the cell membrane including neural cells"
    explanation: Establishes YIF1B biallelic variants as the cause and names the gene's trafficking function.
  - reference: PMID:34373908
    reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "24 individuals from 19 families have currently been identified, harbouring bi-allelic truncating/whole gene deletion (n = 18), or missense variants (n = 6) in YIF1B"
    explanation: Gives the biallelic variant spectrum (truncating/deletion vs missense) across the reported cohort.
  - reference: PMID:34373908
    reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "limited developmental milestones, such as head control, independent sitting, and limited speech were only observed in individuals harbouring missense variants"
    explanation: Reports the genotype-phenotype correlation - the milder milestones occurred only in the missense group, a difference the authors report as statistically significant after Bonferroni correction and attribute to residual YIF1B activity.

pathophysiology:
- name: YIF1B Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish or truncate YIF1B, a ubiquitous
    transmembrane protein that drives anterograde traffic from the endoplasmic
    reticulum to the cell membrane and maintains Golgi apparatus morphology.
  genes:
  - preferred_term: YIF1B
    term:
      id: hgnc:30511
      label: YIF1B
  molecular_functions:
  - preferred_term: protein binding
    term:
      id: GO:0005515
      label: protein binding
    modifier: DECREASED
  downstream:
  - target: Impaired Anterograde Membrane Trafficking
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33103737
    reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the autosomal YIF1B gene encoding a ubiquitous protein involved in anterograde traffic from the endoplasmic reticulum to the cell membrane, and in Golgi apparatus morphology"
    explanation: Identifies YIF1B as the gene and names the trafficking and Golgi functions lost.
- name: Impaired Anterograde Membrane Trafficking
  biological_scale: CELLULAR
  description: >-
    Loss of YIF1B disrupts anterograde endoplasmic-reticulum-to-cell-membrane
    transport and Golgi apparatus morphology in neurons, and secondarily impairs
    primary cilium architecture - the first reported disorder linking the Golgi
    trafficking machinery to a ciliary defect.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: Golgi organization
    term:
      id: GO:0007030
      label: Golgi organization
    modifier: DECREASED
  downstream:
  - target: Disrupted Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33103737
    reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "biallelic YIF1B mutations caused primary cilia abnormalities in skin fibroblasts from both patients and Yif1b-KO mice"
    explanation: Shows that loss of YIF1B disrupts primary cilium architecture in patient-derived cells, linking the trafficking defect to a ciliary phenotype.
  - reference: PMID:33103737
    reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In the CNS, mice lacking Yif1b displayed neuronal reduction, altered myelination of the motor cortex, cerebellar atrophy, enlargement of the ventricles"
    explanation: The Yif1b-knockout mouse recapitulates the CNS consequences of the trafficking defect.
- name: Disrupted Brain Development
  biological_scale: TISSUE
  description: >-
    Impaired neuronal trafficking disturbs brain growth and white-matter
    maturation, producing postnatal microcephaly and nonspecific MRI changes
    (corpus callosum hypoplasia, cerebellar hypoplasia, white-matter
    abnormalities) and underlying the severe neurodevelopmental, movement,
    ophthalmologic and autonomic phenotype.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Secondary microcephaly
    causal_link_type: DIRECT
  - target: Hypoplasia of the corpus callosum
    causal_link_type: DIRECT
  - target: Cerebellar hypoplasia
    causal_link_type: DIRECT
  - target: Abnormal myelination
    causal_link_type: DIRECT
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
  - target: Visual impairment
    causal_link_type: DIRECT
  - target: Hypoventilation
    causal_link_type: DIRECT
  - target: Feeding difficulties
    causal_link_type: DIRECT
  - target: Autistic behavior
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33103737
    reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients displayed global developmental delay, motor delay, visual deficits with brain MRI evidence of ventricle enlargement, myelination alterations and cerebellar atrophy."
    explanation: Links the trafficking defect to the patients' developmental, visual and structural brain phenotype.
  - reference: PMID:34373908
    reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-thirds of the individuals have brain imaging abnormalities, including white matter alterations, cerebral atrophy, corpus callosum hypoplasia and cerebellar hypoplasia."

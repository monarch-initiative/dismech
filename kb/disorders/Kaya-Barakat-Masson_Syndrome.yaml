name: Kaya-Barakat-Masson Syndrome
creation_date: "2026-11-03T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Kaya-Barakat-Masson syndrome
  term:
    id: MONDO:0030878
    label: Kaya-Barakat-Masson syndrome
synonyms:
- KABAMAS
- YIF1B-related neurodevelopmental disorder
- YIF1B-NDD
- neurodevelopmental disorder, Kaya-Barakat-Masson type
description: >-
  An autosomal recessive neurodevelopmental disorder caused by biallelic
  loss-of-function variants in YIF1B, which encodes a ubiquitous membrane
  protein required for anterograde endoplasmic-reticulum-to-cell-membrane
  trafficking, Golgi apparatus morphology, and primary cilium integrity in
  neurons. Affected individuals have severe-to-profound developmental delay with
  little or no speech, postnatal (secondary) microcephaly, a mixed movement
  disorder (axial hypotonia with peripheral hypertonia, dystonia, and
  dyskinesia), seizures, feeding difficulties, ophthalmologic involvement, and
  in a subset central hypoventilation. Brain MRI shows nonspecific changes,
  most often corpus callosum hypoplasia, cerebellar hypoplasia, and white-matter
  abnormalities.


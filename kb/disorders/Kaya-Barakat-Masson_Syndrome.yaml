animal_models:
- name: Yif1b-knockout mouse
  species: Mouse
  genotype: Yif1b-null (constitutive knockout)
  publication: PMID:33103737
  description: >-
    Constitutive Yif1b-knockout mouse reported alongside the patient cohort; it
    reproduces the central-nervous-system structural phenotype of the disorder.
  modeled_mechanisms:
  - target: Disrupted Brain Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Yif1b-null mice show neuronal reduction, altered cortical myelination,
      cerebellar atrophy and ventricular enlargement, recapitulating the CNS
      structural changes seen on patient brain MRI.
    limitations: >-
      A constitutive whole-body knockout models complete loss of function,
      whereas a subset of patients carry hypomorphic missense alleles with
      milder disease; murine and human brain development also differ.
    evidence:
    - reference: PMID:33103737
      reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the CNS, mice lacking Yif1b displayed neuronal reduction, altered myelination of the motor cortex, cerebellar atrophy, enlargement of the ventricles, and subcellular alterations of endoplasmic reticulum and Golgi apparatus compartments."
      explanation: The knockout recapitulates the CNS structural phenotype of the disorder.


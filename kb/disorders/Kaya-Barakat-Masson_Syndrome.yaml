    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the clinical features of 10 patients from six independent families with mutations in the autosomal YIF1B gene encoding a ubiquitous protein involved in anterograde traffic from the endoplasmic reticulum to the cell membrane, and in Golgi apparatus morphology."
    explanation: Identifies pathogenic mutations in YIF1B across affected families and summarizes its anterograde trafficking and Golgi functions.
  - reference: PMID:34373908
    reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In contrast, all tested YIF1B missense variants showed reduced co-localization with TAPL (Supplementary Fig. 10B and E)."
    explanation: Functional assay showing disease variants reduce YIF1B's protein-protein interaction with a known interactor (TAPL), grounding the decreased protein-binding activity.
- name: Impaired Anterograde Membrane Trafficking
  biological_scale: CELLULAR
  description: >-
    Loss of YIF1B disrupts anterograde endoplasmic-reticulum-to-cell-membrane
    transport and Golgi apparatus morphology in neurons, and secondarily impairs
    primary cilium architecture - the first reported disorder linking the Golgi
    trafficking machinery to a ciliary defect.
  cell_types:

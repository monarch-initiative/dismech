genetic:
- name: YIF1B
  gene_term:
    preferred_term: YIF1B
    term:
      id: hgnc:30511
      label: YIF1B
  association: Pathogenic Loss-of-Function Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    YIF1B encodes a ubiquitous transmembrane protein of the anterograde
    endoplasmic-reticulum-to-cell-membrane trafficking machinery that also
    maintains Golgi apparatus morphology. Most reported disease-causing variants
    are biallelic truncating, splice, or whole-gene-deletion alleles (18 of 24
    reported individuals); a minority are biallelic missense variants (6 of 24)
    that cluster in or near the transmembrane domains, retain partial
    (hypomorphic) YIF1B activity in vitro, and are associated with milder disease.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_c0891180-c48d-4c14-bbed-920418bb45cf-2024-08-16T160000.000Z
    evidence:
    - reference: CGGV:assertion_c0891180-c48d-4c14-bbed-920418bb45cf-2024-08-16T160000.000Z
      reference_title: YIF1B / Kaya-Barakat-Masson syndrome (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "YIF1B | HGNC:30511 | Kaya-Barakat-Masson syndrome | MONDO:0030878 | AR | Definitive"
      explanation: ClinGen Syndromic Disorders GCEP classifies the YIF1B-Kaya-Barakat-Masson syndrome relationship as Definitive (autosomal recessive).
  variants:
  - name: p.Ala63fs
    description: >-
      Recurrent truncating variant (c.186dupT) identified in five independent
      families; a probable founder allele, previously found in Arab families and
      in a Spanish proband consistent with historic migration.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34373908
      reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interestingly, both p.Ala63fs and p.Glu200* are recurrent variants, identified in five and three independent families, respectively."
      explanation: Reports p.Ala63fs as a recurrent allele across five families.
  - name: p.Glu200*
    description: >-
      Recurrent truncating variant (c.598G>T) identified in three independent
      families of Somali descent, likely indicating a founder mechanism.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34373908
      reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Similar, all families harbouring p.Glu200* are from Somali descent, likely indicating a founder mechanism."
      explanation: Reports p.Glu200* as a recurrent founder allele in Somali families.
  evidence:
  - reference: PMID:36948290
    reference_title: "YIF1B-related Kaya-Barakat-Masson Syndrome: Report of a new patient and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "KABAMAS is caused by bi-allelic variants in the YIF1B gene which encodes a trafficking protein involved in the anterograde traffic from the endoplasmic reticulum to the cell membrane including neural cells in association with other trafficking proteins and also Golgi apparatus morphology."
    explanation: Establishes YIF1B biallelic variants as the cause and names the gene's trafficking and protein-interaction function.
  - reference: PMID:34373908
    reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including the eight individuals described herein, 24 individuals from 19 families have currently been identified, harbouring bi-allelic truncating/whole gene deletion (n = 18), or missense variants (n = 6) in YIF1B (Table 1 and Supplementary Table 2)."
    explanation: Gives the biallelic variant spectrum (truncating/deletion vs missense) across the reported cohort.
  - reference: PMID:34373908
    reference_title: Expanding the mutational landscape and clinical phenotype of the YIF1B related brain disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, limited developmental milestones, such as head control, independent sitting, and limited speech were only observed in individuals harbouring missense variants, reaching statistical significant differences between the truncating and missense group after Bonferroni correction (P = 0.0001783, P = 0.001694, P = 0.001694, respectively)."
    explanation: Reports the genotype-phenotype correlation - the milder milestones occurred only in the missense group, a difference the authors report as statistically significant after Bonferroni correction and attribute to residual YIF1B activity.


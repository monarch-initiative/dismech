  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish or truncate YIF1B, a ubiquitous
    transmembrane protein that drives anterograde traffic from the endoplasmic
    reticulum to the cell membrane and maintains Golgi apparatus morphology.

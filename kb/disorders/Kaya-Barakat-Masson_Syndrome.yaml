treatments:
- name: Symptomatic and supportive management
  description: >-
    No disease-modifying therapy exists; management is supportive and
    multidisciplinary - developmental and feeding support (including gastrostomy
    when needed), and neurologist-directed treatment of the movement disorder
    and seizures.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39265055
    reference_title: YIF1B-Related Neurodevelopmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment of manifestations: Developmental and educational support; feeding therapy; gastrostomy tube placement if required for persistent feeding issues; standardized treatments for movement disorder and seizures by an experienced neurologist; treatment per ophthalmologist for refractive errors and strabismus; low vision services as needed; consider ventilation therapy when hypoventilation becomes evident; social work and family support."
    explanation: GeneReviews describes the supportive, symptom-directed management.

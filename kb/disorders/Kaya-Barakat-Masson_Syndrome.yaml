    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "standardized treatments for movement disorder and seizures by an experienced neurologist"
    explanation: GeneReviews describes the supportive, symptom-directed management.


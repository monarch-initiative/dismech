    reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Remarkably, although YIF1B was not detected in primary cilia, biallelic YIF1B mutations caused primary cilia abnormalities in skin fibroblasts from both patients and Yif1b-KO mice, and in ciliary architectural components in the Yif1b-KO brain."
    explanation: Shows that loss of YIF1B disrupts primary cilium architecture in patient-derived cells, linking the trafficking defect to a ciliary phenotype.
  - reference: PMID:33103737
    reference_title: YIF1B mutations cause a post-natal neurodevelopmental syndrome associated with Golgi and primary cilium alterations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In the CNS, mice lacking Yif1b displayed neuronal reduction, altered myelination of the motor cortex, cerebellar atrophy, enlargement of the ventricles, and subcellular alterations of endoplasmic reticulum and Golgi apparatus compartments."
    explanation: The Yif1b-knockout mouse recapitulates the ER, Golgi, and CNS structural consequences of the trafficking defect.

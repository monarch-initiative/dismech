name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 6
creation_date: "2026-11-27T14:30:35Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 6
  term:
    id: MONDO:0032869
    label: mitochondrial complex 5 (ATP synthase) deficiency, nuclear type 6
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 6 (MC5DN6) is
  the recessive disorder caused by biallelic splice-donor variants in ATP5MK
  (formerly USMG5), which encodes DAPIT, a small supernumerary subunit of ATP
  synthase located in the membrane domain next to the peripheral stalk. DAPIT
  has no known role in ATP production itself; it is required for ATP synthase
  to form dimers, and loss of the dimers disturbs crista architecture.

  The disease was defined in four children from three unrelated Ashkenazi
  Jewish families with Leigh syndrome, all homozygous for the founder variant
  c.87+1G>C (Ashkenazi allele frequency 0.57 percent), diagnosed between 6 and
  18 months of age with developmental delay and ataxia, and in some patients
  movement disorders, brain lesions, ophthalmoplegia, hypertrophic
  cardiomyopathy, fatty liver and testicular atrophy; two died at six and nine
  years. A fourth family, four brothers homozygous for c.87+1G>A at the same
  splice donor, had a progressive neurodegenerative disorder with regression
  of gross motor skills, intellectual disability, muscle weakness, spasticity
  with brisk reflexes and Babinski signs, scoliosis and pes cavus, and reached
  13 to 25 years of age.

  The variants cause skipping of exon 3 and loss of DAPIT protein. Monomeric
  ATP synthase is made in normal amounts, but dimers are almost absent, ATP
  synthesis falls, and cryo-electron tomography of patient fibroblasts shows
  profoundly disturbed cristae; wild-type ATP5MK cDNA restores dimerisation
  and ATP production. This is the first human disease attributed to a defect
  of ATP synthase dimerisation.

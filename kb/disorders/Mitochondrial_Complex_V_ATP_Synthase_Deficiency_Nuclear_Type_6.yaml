diagnosis:
- name: Exome sequencing
  diagnosis_term:
    preferred_term: Exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    The fourth family was diagnosed by exome sequencing and family screening.
    In Ashkenazi Jewish patients the founder variant c.87+1G>C is the specific
    allele to look for.
  evidence:
  - reference: PMID:40014158
    reference_title: "The fourth family in the world with a novel variant in the ATP5MK gene: four siblings with complex V (ATP synthase) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation in the ATP5MK gene was analyzed using the exome sequencing (ES) method."
    explanation: Exome sequencing identified the variant.
- name: Analysis of ATP synthase dimers in cultured skin fibroblasts
  diagnosis_term:
    preferred_term: Skin biopsy for fibroblast culture
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Native gel analysis of fibroblast mitochondria shows the characteristic
    pattern: normal amounts of monomeric ATP synthase but almost no dimers,
    with decreased ATP synthesis.
  evidence:
  - reference: PMID:29917077
    reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation did not alter monomeric CV expression, but reduced both CV dimer expression and ATP synthesis rate."
    explanation: The dimer-specific biochemical signature in patient fibroblasts.
treatments:
- name: Supportive and symptomatic care
  therapeutic_modality: OTHER
  description: No disease-specific therapy exists; management is supportive.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39016153
    reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, the therapy remains largely symptomatic, although, in many cases, it is crucial for the survival and quality of life of the patients."
    explanation: The 2024 systematic review of isolated ATP synthase defects states that treatment is symptomatic.
differential_diagnoses:
- name: Other nuclear causes of Leigh syndrome with complex V involvement
  description: >-
    ATP5PO, MT-ATP6 and other complex V defects also cause Leigh syndrome; in
    ATP5MK deficiency the monomeric enzyme is preserved and only the dimer is
    lost.
  distinguishing_features:
  - Normal monomeric ATP synthase with absent dimers
  - Biallelic ATP5MK splice-donor variants
- name: Hereditary spastic paraplegia
  description: >-
    The fourth family's progressive spastic paraparesis with pes cavus and
    scoliosis resembles hereditary spastic paraplegia, as do some dominant
    ATP5F1A and ATP5MC3 presentations.
  distinguishing_features:
  - Biallelic ATP5MK variants
notes: >-
  The GeneReviews Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview is in
  Overview format and is not a phenotype baseline for this disease; there is no
  gene-specific GeneReviews chapter. The founder-family phenotypes come from
  the 2024 systematic review (PMID:39016153), which summarises the founder
  report (PMID:29917077, cached as abstract only), and the fourth family from
  its abstract (PMID:40014158). The review also lists an accessory spleen,
  which is not recorded as a phenotype because it is a common incidental
  finding. The founder report and the cryo-electron tomography study describe
  the same founder families, and the tomography and cryo-FIB/SEM studies use
  fibroblasts from a founder-family patient, so they are not independent
  families. The MONDO label writes "complex 5"; the name here follows the OMIM
  title and the sibling entries.

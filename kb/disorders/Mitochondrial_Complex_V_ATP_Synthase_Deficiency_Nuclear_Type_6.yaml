genetic:
- name: ATP5MK
  notes: >-
    ATP5MK (10q24.33; previous symbols USMG5 and ATP5MD; the protein is DAPIT)
    encodes a small supernumerary subunit of ATP synthase. Two homozygous
    variants at the same exon 3 splice donor are reported: the Ashkenazi
    Jewish founder c.87+1G>C in three families and c.87+1G>A in a fourth.
    ClinGen classifies ATP5MK as Moderate (autosomal recessive) for Leigh
    syndrome (MONDO:0009723, 2020) and for the lumped concept mitochondrial
    disease (MONDO:0044970, 2024); neither is this entry's MONDO:0032869, so no
    tier is recorded under gene_disease_validity. relationship_type is UNKNOWN
    because ClinGen's classification of the gene for these phenotypes is
    Moderate, although four families and rescue of the cellular defect support
    the association.
  gene_term:
    preferred_term: ATP5MK
    term:
      id: hgnc:30889
      label: ATP5MK
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:40014158
      reference_title: "The fourth family in the world with a novel variant in the ATP5MK gene: four siblings with complex V (ATP synthase) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The parents were confirmed as heterozygous carriers, consistent with autosomal recessive inheritance."
      explanation: Carrier parents of four affected brothers.
  variants:
  - name: ATP5MK c.87+1G>C
    type: splice donor
    description: >-
      Ashkenazi Jewish founder variant (population allele frequency 0.57
      percent), homozygous in four patients from three families. It produces
      a wild-type transcript and one lacking exon 3, with reduced wild-type
      mRNA and no detectable protein.
    evidence:
    - reference: PMID:29917077
      reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report four Leigh syndrome subjects from three unrelated Ashkenazi Jewish families harboring a homozygous splice-site mutation (c.87 + 1G>C) in a novel CV subunit disease gene, USMG5."
      explanation: The founder variant in three unrelated families.
    - reference: PMID:29917077
      reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The Ashkenazi population allele frequency is 0.57%."
      explanation: Frequency of the founder allele in the Ashkenazi population.
  - name: ATP5MK c.87+1G>A
    type: splice donor
    description: Homozygous in four brothers of the fourth family; affects the same splice donor as the founder variant.
    evidence:
    - reference: PMID:40014158
      reference_title: "The fourth family in the world with a novel variant in the ATP5MK gene: four siblings with complex V (ATP synthase) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ES of the first case identified a homozygous splice donor variant (c.87 + 1G > A) in the ATP5MK gene as a novel variant, and family screening revealed the same variant in a biallelic state in the other three siblings."
      explanation: The variant in all four brothers.
  evidence:
  - reference: PMID:29917077
    reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rescue with wild-type USMG5 cDNA in proband fibroblasts restored USMG5 protein, increased CV dimerization and enhanced ATP production rate."
    explanation: Complementation of patient fibroblasts ties the cellular defect to the ATP5MK lesion.
  - reference: PMID:29917077
    reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate that a recurrent USMG5 splice-site founder mutation in the Ashkenazi Jewish population causes autosomal recessive Leigh syndrome by reduction of CV dimerization and ATP synthesis."
    explanation: The authors' conclusion linking the ATP5MK variant to the disease.
pathophysiology:
- name: Loss of DAPIT from Biallelic ATP5MK Splice-Donor Variants
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"
  description: >-
    DAPIT is a supernumerary rather than a core subunit and has no known role
    in ATP production itself; it sits in the membrane domain next to the
    peripheral stalk, where it is needed for ATP synthase dimerisation. The
    molecular function bound here, structural molecule activity, stands for
    that contribution to the integrity of the dimer, since GO records no
    molecular function for ATP5MK. The splice-donor variants skip exon 3, and
    patient fibroblasts have reduced wild-type mRNA and no detectable protein.
  genes:
  - preferred_term: ATP5MK
    term:
      id: hgnc:30889
      label: ATP5MK
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: DAPIT contribution to the ATP synthase dimer
    term:
      id: GO:0005198
      label: structural molecule activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30240627
    reference_title: "Three-Dimensional Analysis of Mitochondrial Crista Ultrastructure in a Patient with Leigh Syndrome by In Situ Cryoelectron Tomography."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Rather, it is thought to localize to the transmembrane domain associated with the peripheral stalk that is required for ATP synthase dimerization"
    explanation: The location and role of DAPIT in the enzyme.
  - reference: PMID:30240627
    reference_title: "Three-Dimensional Analysis of Mitochondrial Crista Ultrastructure in a Patient with Leigh Syndrome by In Situ Cryoelectron Tomography."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Unlike other OxPhos subunits linked to LS, including those within the ATP synthase, this protein has no known role in ATP production per se."
    explanation: DAPIT is not a catalytic or proton-translocating component.
  - reference: PMID:29917077
    reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts from two Leigh syndrome probands had reduced wild-type USMG5 mRNA expression and undetectable protein."
    explanation: The splice variant abolishes detectable DAPIT protein.
  - reference: PMID:39016153
    reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This splice site variant resulted in the loss of DAPIT protein due to skipping of exon 3."
    explanation: The splicing consequence of the founder variant.
  downstream:
  - target: Loss of ATP Synthase Dimers
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29917077
      reference_title: "USMG5 Ashkenazi Jewish founder mutation impairs mitochondrial complex V dimerization and ATP synthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Rescue with wild-type USMG5 cDNA in proband fibroblasts restored USMG5 protein, increased CV dimerization and enhanced ATP production rate."
      explanation: Restoring DAPIT restores dimerisation, so its loss is the cause of the dimer deficit.

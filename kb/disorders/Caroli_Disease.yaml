name: Caroli disease
creation_date: "2026-08-07T00:00:00Z"
category: Mendelian
description: >-
  Caroli disease is a congenital malformation with segmental non-obstructive dilatation of large intrahepatic
  bile ducts that communicate with the biliary tree. Simple Caroli disease lacks congenital hepatic fibrosis;
  Caroli syndrome combines duct ectasia with CHF and often PKHD1-associated renal disease. Bile stasis predisposes
  to stones, cholangitis, abscesses and sepsis. In Caroli syndrome, progressive peribiliary fibrosis causes
  portal hypertension, hypersplenism and variceal bleeding, often despite relatively preserved hepatic function.
  Cholangiocarcinoma is a recognized complication, but its population incidence remains uncertain. Care is
  complication-directed, with resection for selected localized disease and transplant assessment for unresectable
  recurrent cholangitis or severe portal complications.
synonyms:
- Caroli's disease
- Congenital dilatation of the intrahepatic bile ducts
- Congenital polycystic dilatation of intrahepatic bile ducts
- Cystic dilatation of the intrahepatic biliary tree
- Type V choledochal cyst

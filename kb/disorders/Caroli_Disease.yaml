name: Caroli disease
creation_date: "2026-08-07T00:00:00Z"
category: Mendelian
description: >-
  Caroli disease is a rare congenital disorder of the intrahepatic biliary tree in
  which segmental, non-obstructive saccular dilatations of the large intrahepatic
  bile ducts arise from a ductal plate malformation — a failure of the embryonic
  ductal plate to remodel normally. It belongs to the fibrocystic liver diseases,
  a group of cholangiociliopathies caused by dysfunction of proteins expressed in
  the primary cilium of cholangiocytes; the best-characterised gene is PKHD1,
  encoding fibrocystin/polyductin, which also causes autosomal recessive polycystic
  kidney disease. Two forms are distinguished by whether the small interlobular
  ducts are also affected: the simple (type I) form shows ductal ectasia alone,
  whereas Caroli syndrome (type II) combines the ductal dilatations with congenital
  hepatic fibrosis. Bile stasis within the dilated segments drives hepatolithiasis
  and recurrent bacterial cholangitis; peribiliary fibrosis produces presinusoidal
  portal hypertension with splenomegaly and variceal bleeding despite long-preserved
  hepatocellular synthetic function. Chronic biliary inflammation carries a
  substantially increased risk of cholangiocarcinoma. No targeted medical therapy
  exists; management controls complications, with hepatic resection for localised
  disease and liver (or combined liver-kidney) transplantation for diffuse disease
  or hepatic decompensation.
synonyms:
- Caroli's disease
- Congenital dilatation of the intrahepatic bile ducts
- Congenital polycystic dilatation of intrahepatic bile ducts
- Cystic dilatation of the intrahepatic biliary tree
- Type V choledochal cyst

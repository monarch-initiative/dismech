  findings:
  - statement: >-
      Clinical characteristics. The childhood-to-young-adult presentation of
      ARPKD-PKHD1 is the hepatobiliary one, and GeneReviews names that
      presentation Caroli disease and attributes it to defective biliary ductal
      plate remodeling — the same developmental mechanism this entry models.
    supporting_text: "The less common initial presentation in childhood (after age one year) to young adulthood can be associated with predominant hepatobiliary manifestations characterized by the clinical consequences of developmental anomalies of biliary ductal plate remodeling (also known as Caroli disease)."
  - statement: >-
      Diagnosis/testing. Molecular confirmation rests on biallelic PKHD1
      pathogenic variants in a proband with suggestive findings, consistent with
      the autosomal recessive PKHD1 genetics curated in the genetic block.
    supporting_text: "The molecular diagnosis of ARPKD-PKHD1 is established in a proband with suggestive findings and biallelic pathogenic variants in PKHD1 identified by molecular genetic testing."
  - statement: >-
      Management. The hepatobiliary complications requiring specialist management
      are ascending cholangitis, cholestasis, and portal hypertension — the three
      clinical endpoints of the bile-stasis and portal-hypertension arms of this
      entry's pathograph — with liver or combined liver-kidney transplantation as
      the definitive option.
    supporting_text: "hepatobiliary disease specialists to assure timely management of complications (that can include ascending cholangitis, cholestasis, and portal hypertension) and LTx/CLKTx"
  - statement: >-
      Genetic counseling. Autosomal recessive inheritance with a 25% recurrence
      risk per conception for sibs of an affected individual, supporting the
      inheritance block.
    supporting_text: "If both parents are known to be heterozygous for a PKHD1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of being unaffected and not a carrier."

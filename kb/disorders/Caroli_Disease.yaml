- name: Cholangiocarcinoma
  role: consequence
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Cholangiocarcinoma arises at rates far above the general population. Age at
    diagnosis is nonetheless predominantly beyond 40 years (mean 60.1 years in
    Caroli syndrome and isolated congenital hepatic fibrosis), so the excess risk
    is one of incidence rather than of markedly earlier onset.
    Reported incidence varies widely between series — from under 3% to over a third
    in small cohorts — but the two largest systematic assessments converge on
    roughly 6-7%. Tumours are frequently found incidentally in the resection
    specimen because preoperative imaging cannot reliably distinguish malignancy
    from the underlying cystic architecture, and outcomes once malignancy is present
    are poor. The node is marked PROVISIONAL because the inflammation-to-carcinoma
    link is inferred from the epidemiological association and from the general
    biliary-inflammation carcinogenesis model rather than demonstrated directly in
    Caroli tissue.
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Depending on the size of the study population the incidence of cholangiocarcinoma varied from 2.7% to 37.5% with an overall incidence of 6.6%."
    explanation: >-
      Provides the pooled cholangiocarcinoma incidence (6.6%) and the wide
      between-study range quoted in this node.
  - reference: PMID:34294522
    reference_title: "The rate of cholangiocarcinoma in Caroli Disease A German multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Contrast-enhanced CT or MRI of the abdomen may reveal a pathognomonic finding, the central dot sign. Histologically, this relates to a branch of the hepatic artery and a portal vein radical bridging a saccule resembling a central dot.
    explanation: >-
      Review connects the cross-sectional imaging finding with its vascular substrate.

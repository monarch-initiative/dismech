has_subtypes:
- name: Simple Caroli disease
  display_name: Simple (type I) Caroli disease — ductal ectasia without hepatic fibrosis
  description: >-
    Segmental saccular dilatation of the large intrahepatic bile ducts without
    congenital hepatic fibrosis. Clinical disease is dominated by bile stasis
    complications — hepatolithiasis, recurrent bacterial cholangitis and biliary
    sepsis — rather than by portal hypertension. Frequently segmental or monolobar,
    which makes curative hepatic resection possible.
  review_notes: >-
    The simple form uses the entry-level Caroli disease concept; Caroli syndrome has its own subtype term.
    Clinical findings and mechanisms sourced only from CHF/ARPKD are scoped to the syndromic component.
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital intrahepatic bile duct dilatation without fibrosis is called Caroli disease (CD), and is called Caroli syndrome (CS) when it has fibrotic and cirrhotic liver morphology."
    explanation: >-
      Defines the simple form as intrahepatic bile duct dilatation occurring without
      hepatic fibrosis, distinguishing it from the syndromic form.
    quote_role: REVIEW_SYNTHESIS
- name: Caroli syndrome
  display_name: Caroli syndrome (type II) — ductal ectasia with congenital hepatic fibrosis
  subtype_term:
    preferred_term: Caroli syndrome
    term:
      id: MONDO:0018808
      label: Caroli syndrome
  description: >-
    Caroli disease with congenital hepatic fibrosis involving smaller ducts. Often associated with ARPKD, with
    portal hypertension, hypersplenism and variceal bleeding. Distribution, renal function and severity of
    complications determine treatment; transplantation is not inevitable in every patient.
  genes:
  - preferred_term: PKHD1
    term:
      id: hgnc:9016
      label: PKHD1
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ductal dysgenesis may affect the biliary system at multiple levels, from the small intrahepatic bile ducts"
    explanation: >-
      States that the ductal dysgenesis affects the biliary tree at multiple levels,
      the basis for distinguishing Caroli syndrome (large plus small ducts) from
      simple Caroli disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34294522
    reference_title: "The rate of cholangiocarcinoma in Caroli Disease A German multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the multicenter study, 79 patients suffered from CD and 119 patients from CS, with a total number of 198 patients."
    explanation: >-
      In a 17-centre German surgical series the syndromic form outnumbered the simple
      form (119 vs 79). This is a surgical-referral cohort, so it does not establish
      the population-level ratio.
    quote_role: PRIMARY_RESULT
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The PKHD1-associated forms of Caroli disease — in particular Caroli syndrome
    with congenital hepatic fibrosis, which shares its genetic basis with autosomal
    recessive polycystic kidney disease — are inherited in an autosomal recessive
    pattern. Simple Caroli disease is frequently reported as sporadic, and the
    genetic basis of isolated large-duct disease is less completely defined.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHF, CD/CS, and ARPKD are caused by a number of mutations in polycystic kidney hepatic disease 1 (PKHD1), a gene that encodes for fibrocystin/polyductin"
    explanation: >-
      Attributes congenital hepatic fibrosis, Caroli disease/syndrome and ARPKD to
      mutations in PKHD1; ARPKD is by definition autosomal recessive.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301501
    reference_title: "Autosomal Recessive Polycystic Kidney Disease - PKHD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ARPKD-PKHD1 is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for a PKHD1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews states the autosomal recessive mode of inheritance for
      ARPKD-PKHD1 outright, with the 25% per-conception sib recurrence risk,
      rather than leaving it to be inferred from the ARPKD label.
    quote_role: REVIEW_SYNTHESIS
  expressivity: VARIABLE
pathophysiology:
- name: Fibrocystin Dysfunction in PKHD1-associated Disease
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic pathogenic PKHD1 variants impair fibrocystin/polyductin in the PKHD1-associated fibrocystic spectrum,
    particularly Caroli syndrome with ARPKD. This membrane and ciliary protein has incompletely resolved molecular
    functions. The PCK rat demonstrates loss of ciliary fibrocystin, but neither complete protein absence nor
    a single ciliary structural defect is established for every human variant or every sporadic simple Caroli
    case.

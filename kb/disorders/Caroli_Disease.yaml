    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case demonstrates the limitations of long-term endoscopic and pharmacological therapy in Caroli's disease complicated by portal hypertension and supports timely transplant referral before advanced hepatic decompensation occurs."
    explanation: >-
      Supports transplantation as the definitive option and argues for timely
      referral, the recommendation captured in this treatment.
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interventional radiology or surgical treatments, including liver transplantation, are used in selected cases."
    explanation: >-
      Confirms liver transplantation as an accepted treatment in selected cases of
      fibrocystic liver disease.
- name: Avoidance of Hepatotoxic and Nephrotoxic Agents
  description: >-
    Where Caroli disease occurs as the hepatobiliary presentation of ARPKD-PKHD1,
    GeneReviews advises minimising potentially hepatotoxic exposures — acetaminophen
    at doses above 30 mg/kg/day, herbal supplements and alcohol — alongside known
    nephrotoxic agents such as NSAIDs and aminoglycosides, on the rationale that
    hepatic and renal reserve are already committed by the underlying disease.
    Scope caveat: this guidance is written for ARPKD-PKHD1 and so applies to the
    PKHD1-associated Caroli syndrome form curated here; it should not be transferred
    wholesale to simple, frequently sporadic Caroli disease, whose genetic basis and
    renal involvement are not the same.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of hepatotoxic and nephrotoxic agents
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301501
    reference_title: "Autosomal Recessive Polycystic Kidney Disease - PKHD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Minimizing use of known nephrotoxic agents including nonsteroidal anti-inflammatory drugs (NSAIDs) and aminoglycosides (unless otherwise advised) and of potentially hepatotoxic agents (e.g., acetaminophen doses >30 mg/kg/day, herbal supplements, and alcohol) is advised."
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid guidance for ARPKD-PKHD1,
      recorded verbatim as the exposure-avoidance advice for the PKHD1-associated
      form of this entry.

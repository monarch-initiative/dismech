- name: Chronic Biliary Inflammation
  role: intermediate
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Decades of bile stasis and recurrent cholangitis expose the biliary epithelium
    to a sustained inflammatory and proliferative stimulus. The inflammatory state
    itself is well documented — it is the continuously destructive process that
    drives the clinical course — and it is separated here from the malignant
    transformation it is proposed to trigger, whose derivation is weaker.
  cell_types:
  - preferred_term: intrahepatic cholangiocyte
    term:
      id: CL:0002538
      label: intrahepatic cholangiocyte
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  downstream:
  - target: Biliary Malignant Transformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic biliary inflammation is a proposed route to epithelial dysplasia and carcinoma; this causal route
      remains provisional.
    evidence:
    - reference: PMID:32884228
      reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As one trigger for the malignant transformation, chronic inflammation of the biliary epithelium during cholangitis with consecutive dysplasia and carcinogenesis is postulated"
      explanation: >-
        The source presents inflammation-driven carcinogenesis as a hypothesis. The cancer occurrence itself
        is clinically established.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to focal inflammation, likely initiated by an intrauterine malformation of the bile ductal plate, the biliary tract is continuously destroyed over decades"
    explanation: >-
      Establishes sustained inflammatory destruction of the biliary tract over
      decades as the process this node describes.
    quote_role: REVIEW_SYNTHESIS
- name: Biliary Malignant Transformation
  role: consequence
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Cholangiocarcinoma is a documented complication of Caroli disease and syndrome. A systematic review of
    561 surgically treated patients reported 37 cancers (6.6%); a German surgical cohort found 14 among 198
    (7.1%). These selected retrospective proportions are not population incidence, and the datasets need not
    be independent. Preoperative recognition is difficult and malignancy is often found incidentally in surgical
    specimens. The specific causal route from chronic inflammation remains provisional.
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Depending on the size of the study population the incidence of cholangiocarcinoma varied from 2.7% to 37.5% with an overall incidence of 6.6%."
    explanation: >-
      The 6.6% proportion comes from selected retrospective surgical series, not an unselected population or
      person-time incidence study.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34294522
    reference_title: "The rate of cholangiocarcinoma in Caroli Disease A German multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 14 patients, CCA was found (Overall: 7,1%; CD: 6,3%, CS 7,6%)."
    explanation: >-
      The German surgical cohort reports 14 cancers among 198 patients. Independence from cohorts in other
      reviews is not assumed.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumor detection was an incidental finding of the surgical specimen in most cases because it is currently often impossible to detect tumor manifestation during preoperative diagnostics."
    explanation: >-
      Supports the statement that malignancy is usually found incidentally in the
      resection specimen rather than preoperatively.
    quote_role: PRIMARY_RESULT
  - reference: PMID:22197937
    reference_title: "Congenital hepatic fibrosis and autosomal recessive polycystic kidney disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one patients developed hepatobiliary cancer, with the majority having cholangiocarcinoma (n = 19)."
    explanation: >-
      Confirms cholangiocarcinoma as the dominant malignancy in this disease group.
    quote_role: PRIMARY_RESULT
  downstream:

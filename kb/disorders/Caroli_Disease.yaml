  downstream:
  - target: Presinusoidal Portal Hypertension
    causal_link_type: DIRECT
    description: >-
      Periportal fibrous expansion obstructs portal venous inflow at a presinusoidal
      level, raising portal pressure while sinusoidal and hepatocellular function
      remain relatively spared.

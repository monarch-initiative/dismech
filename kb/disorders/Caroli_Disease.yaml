    explanation: >-
      In a 17-centre German surgical series the syndromic form outnumbered the simple
      form (119 vs 79). This is a surgical-referral cohort, so it does not establish
      the population-level ratio.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The PKHD1-associated forms of Caroli disease — in particular Caroli syndrome
    with congenital hepatic fibrosis, which shares its genetic basis with autosomal
    recessive polycystic kidney disease — are inherited in an autosomal recessive
    pattern. Simple Caroli disease is frequently reported as sporadic, and the
    genetic basis of isolated large-duct disease is less completely defined.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHF, CD/CS, and ARPKD are caused by a number of mutations in polycystic kidney hepatic disease 1 (PKHD1), a gene that encodes for fibrocystin/polyductin"
    explanation: >-
      Attributes congenital hepatic fibrosis, Caroli disease/syndrome and ARPKD to
      mutations in PKHD1; ARPKD is by definition autosomal recessive.
  - reference: PMID:20301501
    reference_title: "Autosomal Recessive Polycystic Kidney Disease - PKHD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ARPKD-PKHD1 is inherited in an autosomal recessive manner. If both parents are known to be heterozygous for a PKHD1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      GeneReviews states the autosomal recessive mode of inheritance for
      ARPKD-PKHD1 outright, with the 25% per-conception sib recurrence risk,
      rather than leaving it to be inferred from the ARPKD label.
pathophysiology:
- name: Fibrocystin Loss from the Cholangiocyte Primary Cilium
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic PKHD1 variants reduce or abolish fibrocystin/polyductin, a large
    receptor-like protein that in normal biliary epithelium localises to the single
    primary cilium projecting from each cholangiocyte into the duct lumen. Loss of
    fibrocystin leaves the cilium structurally abnormal — shortened and with bulbous
    deformities — so the cholangiocyte can no longer transduce the ciliary signals
    that normally govern planar cell polarity and oriented growth of the developing
    duct. Because the same protein is required in renal tubular cilia, the biliary
    lesion is typically accompanied by the renal phenotype of autosomal recessive
    polycystic kidney disease.
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  gene:
    preferred_term: PKHD1
    term:
      id: hgnc:9016
      label: PKHD1
  cell_types:
  - preferred_term: intrahepatic cholangiocyte
    term:
      id: CL:0002538
      label: intrahepatic cholangiocyte
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: DECREASED
  - preferred_term: establishment of planar polarity
    term:
      id: GO:0001736
      label: establishment of planar polarity
    modifier: DECREASED
  downstream:
  - target: Ductal Plate Malformation of the Intrahepatic Biliary Tree
    causal_link_type: DIRECT
    description: >-
      Loss of ciliary signalling in the developing biliary epithelium prevents normal
      remodelling of the embryonic ductal plate.
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an abnormal development of the embryonic ductal plate caused by genetically-determined dysfunctions of proteins expressed in the primary cilia of cholangiocytes"
    explanation: >-
      Places the fibrocystic liver diseases, Caroli disease among them, in the
      cholangiociliopathy class — the defect is in proteins of the cholangiocyte
      primary cilium.
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "a protein of unclear function, but supposedly involved in planar cell polarity and other fundamental cell functions"
    explanation: >-
      Links fibrocystin/polyductin to planar cell polarity, the process annotated on
      this node, but the source explicitly hedges ("unclear function", "supposedly"),
      so this is PARTIAL rather than SUPPORT.
  - reference: PMID:14598246
    reference_title: "Defects in cholangiocyte fibrocystin expression and ciliary structure in the PCK rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In normal IBDUs, each cholangiocyte had a single cilium that expressed fibrocystin. In contrast, cilia in the PCK rat were abnormal with bulbous extensions and diminished length, and were devoid of fibrocystin."
    explanation: >-
      The orthologous PCK rat Pkhd1 model demonstrates that fibrocystin is a
      cholangiocyte ciliary protein and that its loss produces the shortened,
      bulbous cilia described in this node.
- name: Ductal Plate Malformation of the Intrahepatic Biliary Tree
  role: intermediate
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The intrahepatic bile ducts form from the ductal plate, a cylindrical sleeve of
    biliary precursors around each portal vein branch that is normally remodelled
    into tubular ducts during fetal life. In the fibrocystic liver diseases this
    remodelling fails, leaving persistent, abnormally shaped embryonic duct
    structures. Which level of the biliary tree is affected determines the clinical
    entity: dysgenesis of the small interlobular ducts produces congenital hepatic
    fibrosis, dysgenesis of the larger intrahepatic ducts produces Caroli disease,
    and involvement of both produces Caroli syndrome.
  cell_types:
  - preferred_term: intrahepatic cholangiocyte
    term:
      id: CL:0002538
      label: intrahepatic cholangiocyte
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  biological_processes:
  - preferred_term: intrahepatic bile duct development
    term:
      id: GO:0035622
      label: intrahepatic bile duct development
    modifier: ABNORMAL
  downstream:
  - target: Segmental Saccular Dilatation of the Large Intrahepatic Bile Ducts
    causal_link_type: DIRECT
    description: >-
      Persistent unremodelled ductal plate segments of the large intrahepatic ducts
      present as the saccular dilatations that define Caroli disease.
  - target: Progressive Peribiliary Fibrosis
    causal_link_type: DIRECT
    description: >-
      Ductal plate malformation of the small interlobular ducts is accompanied by
      deposition of dense peribiliary fibrous tissue — the congenital hepatic
      fibrosis component of Caroli syndrome.
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to biliary microhamartomas and segmental bile duct dilations. Biliary changes are accompanied by progressive deposition of abundant peribiliary fibrosis."
    explanation: >-
      Describes the two consequences of the ductal dysgenesis modelled as the
      downstream edges of this node: segmental duct dilatation and peribiliary
      fibrosis.
- name: Segmental Saccular Dilatation of the Large Intrahepatic Bile Ducts
  role: intermediate
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    The anatomical lesion that defines Caroli disease: multifocal, non-obstructive
    saccular or fusiform dilatations of the large intrahepatic ducts that remain in
    continuity with the biliary tree. Involvement may be confined to one segment or
    lobe or be diffuse and bilobar, and this distribution — not the histology — is
    what determines whether resection is feasible. The dilated segments are
    demonstrated non-invasively by MR cholangiopancreatography or CT.
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  downstream:
  - target: Bile Stasis in the Dilated Segments
    causal_link_type: DIRECT
    description: >-
      Bile pools within the saccular outpouchings, where it drains poorly from the
      dilated segments.
  evidence:
  - reference: PMID:34294522
    reference_title: "The rate of cholangiocarcinoma in Caroli Disease A German multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Caroli Disease (CD) and Caroli Syndrome (CS) are rare disorders presenting with dilation of the intrahepatic bile ducts."
    explanation: >-
      Identifies intrahepatic bile duct dilatation as the defining presenting lesion
      of both forms.
  - reference: PMID:25327281
    reference_title: "Clinical classification of Caroli's disease: an analysis of 30 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance cholangiopancreatography (MRCP) and computed tomography (CT) examinations were most useful in diagnosing CD."
    explanation: >-
      Supports the statement that the dilated ducts are demonstrated by MRCP and CT.
- name: Bile Stasis in the Dilated Segments
  role: intermediate
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Bile drains poorly from the saccular dilatations and stagnates within them.
    Stasis is the shared proximate cause of the two downstream complications:
    it supersaturates bile so that intrahepatic pigment stones form, and it
    permits ascending bacterial colonisation of the stagnant segments.
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  downstream:
  - target: Hepatolithiasis
    causal_link_type: DIRECT
    description: >-
      Stagnant bile supersaturates and precipitates intrahepatic pigment stones
      within the dilated segments.
  - target: Recurrent Bacterial Cholangitis
    causal_link_type: DIRECT
    description: >-
      Stagnant bile in segments that communicate with the biliary tree permits
      ascending bacterial colonisation and repeated infection.
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the further progression of this destructive inflammatory state leads to recurrent episodes of cholangitis, the development of biliary stones and malignant transformation in some cases"
    explanation: >-
      Places biliary stone formation and recurrent cholangitis together as
      consequences of the ongoing destructive biliary process, supporting stasis
      within the dilated segments as their shared proximate step.
- name: Hepatolithiasis
  role: intermediate
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Intrahepatic pigment stones form within the stagnant dilated segments. The
    stones are themselves obstructive, so they worsen the drainage failure that
    produced them and provide a nidus for bacterial colonisation, feeding the
    recurrent cholangitis.
  locations:
  - preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704
      label: intrahepatic bile duct
  downstream:
  - target: Recurrent Bacterial Cholangitis
    causal_link_type: DIRECT
    description: >-
      Intrahepatic stones further obstruct bile drainage and provide a nidus for
      bacterial colonisation, precipitating infective episodes.
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the further progression of this destructive inflammatory state leads to recurrent episodes of cholangitis, the development of biliary stones and malignant transformation in some cases"
    explanation: >-
      States directly that biliary stones develop as part of the disease course,
      the claim this node carries.
- name: Recurrent Bacterial Cholangitis
  role: intermediate
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Repeated ascending bacterial infection of the stagnant, stone-bearing segments
    produces the recurrent cholangitis that dominates the clinical course of the
    simple form — episodic fever, right upper quadrant pain and jaundice — and that
    can progress to biliary sepsis. Repeated infection also sustains the chronic
    inflammatory stimulus that underlies both the fibrotic and the neoplastic
    consequences below.
  locations:
  - preferred_term: intrahepatic bile duct
    term:

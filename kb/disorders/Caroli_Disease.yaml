has_subtypes:
- name: Simple Caroli disease
  display_name: Simple (type I) Caroli disease — ductal ectasia without hepatic fibrosis
  description: >-
    Segmental saccular dilatation of the large intrahepatic bile ducts without
    congenital hepatic fibrosis. Clinical disease is dominated by bile stasis
    complications — hepatolithiasis, recurrent bacterial cholangitis and biliary
    sepsis — rather than by portal hypertension. Frequently segmental or monolobar,
    which makes curative hepatic resection possible.
  review_notes: >-
    Intentionally has no `subtype_term`. MONDO has no separate term for the simple
    form — MONDO:0010913 (Caroli disease) *is* the term for ductal dilatation
    without hepatic fibrosis, and it is already the entry-level `disease_term`, so
    repeating it here would assert that the subtype and the whole entry are the same
    entity. Only the syndromic form has its own MONDO anchor (MONDO:0018808). The
    advisory `test_subtypes_have_disease_term` warning on this subtype is therefore
    expected, not an omission.
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital intrahepatic bile duct dilatation without fibrosis is called Caroli disease (CD), and is called Caroli syndrome (CS) when it has fibrotic and cirrhotic liver morphology."
    explanation: >-
      Defines the simple form as intrahepatic bile duct dilatation occurring without
      hepatic fibrosis, distinguishing it from the syndromic form.
- name: Caroli syndrome
  display_name: Caroli syndrome (type II) — ductal ectasia with congenital hepatic fibrosis
  subtype_term:
    preferred_term: Caroli syndrome
    term:
      id: MONDO:0018808
      label: Caroli syndrome
  description: >-
    Caroli disease coexisting with congenital hepatic fibrosis, reflecting ductal
    plate malformation of the small interlobular ducts in addition to the large
    intrahepatic ducts. It is strongly associated with autosomal recessive
    polycystic kidney disease. Presinusoidal portal hypertension with splenomegaly,
    hypersplenism and variceal bleeding dominates the clinical course, and diffuse
    involvement usually makes resection impossible so that transplantation becomes
    the definitive option.

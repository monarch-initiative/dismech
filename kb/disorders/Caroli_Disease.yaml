- name: Central dot sign
  modality: MRI
  description: >-
    On contrast-enhanced MRI or CT, a portal venous radicle and hepatic arterial branch within a dilated duct
    create an enhancing central dot. This supports Caroli disease in the appropriate ductal morphology.
  located_in:
    preferred_term: intrahepatic bile duct
    term:
      id: UBERON:0003704

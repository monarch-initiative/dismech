discussions:
- discussion_id: caroli_cca_incidence_uncertainty
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true incidence of cholangiocarcinoma in Caroli disease and Caroli
    syndrome, and can any risk factor stratify which patients will develop it?
  attaches_to:
  - pathophysiology#Biliary Malignant Transformation
  rationale: >-
    Cancer was reported in 6.6% of pooled surgical cases and 7.1% of a German surgical cohort. Selection bias,
    uncertain cohort independence and limited preoperative detection prevent interpretation as population incidence.
    Prospective disease-specific surveillance performance is also unknown.
  proposed_experiments:
  - experiment_id: exp_caroli_prospective_cca_incidence
    name: Prospective unselected-cohort cholangiocarcinoma incidence study
    description: >-
      Registry-based prospective follow-up of an unselected (not surgically
      referred) Caroli disease and Caroli syndrome cohort with standardised imaging
      surveillance, to estimate cholangiocarcinoma incidence free of surgical
      referral bias.
    decision_criterion: >-
      Estimate cancer incidence with person-time and uncertainty, and assess screening yield. Treatment recommendations
      additionally require evidence about benefits and harms.
  - experiment_id: exp_caroli_cca_risk_factor_case_control
    name: Nested case-control analysis of cholangiocarcinoma risk factors
    description: >-
      Within such a cohort, compare patients who did and did not develop
      cholangiocarcinoma, testing candidate risk factors (disease extent, cholangitis
      frequency, hepatolithiasis burden, age, PKHD1 genotype).
    decision_criterion: >-
      Validate candidate predictors prospectively before using them to personalize surveillance or surgery.
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The development of intrahepatic carcinoma is described in both conditions, but the reported incidence varies extensively. Potential risk factors for the malignant transformation were not described."
    explanation: >-
      States both halves of this knowledge gap explicitly — the incidence varies
      extensively and no risk factors for malignant transformation are known.
    quote_role: REVIEW_SYNTHESIS
- discussion_id: caroli_no_targeted_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the cholangiociliopathy mechanism be targeted therapeutically, rather than
    only managing the downstream biliary and portal complications?
  attaches_to:
  - pathophysiology#Fibrocystin Dysfunction in PKHD1-associated Disease
  rationale: >-
    Beta-catenin/STAT3, epithelial chemokine secretion, macrophage recruitment and integrin/TGF-beta signaling
    are experimentally tractable pathways. Translation to patient benefit remains unproven, particularly outside
    PKHD1-associated CHF.
  proposed_experiments:
  - experiment_id: exp_caroli_fibrocystin_function_organoid
    name: Fibrocystin function in patient-derived cholangiocyte organoids
    description: >-
      Define the molecular function of fibrocystin/polyductin in cholangiocyte cilia
      (interactome and ciliary signalling readouts) in human cholangiocyte organoids
      derived from PKHD1-mutant patients versus isogenic controls.
    decision_criterion: >-
      Demonstrate reproducible functional rescue in human disease-derived cells and establish applicability
      across genotypes.
  - experiment_id: exp_caroli_antifibrotic_pck_rat
    name: Antifibrotic intervention in complementary PKHD1 models
    description: >-
      Use the Pkhd1del4/del4 mouse for progressive portal fibrosis and the PCK rat for cystic/renal phenotypes,
      with human cell validation.
    decision_criterion: >-
      Replicated effects on fibrosis and clinically relevant physiology, with toxicity assessment, would support
      translational development.
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted medical therapy is not available yet and thus the current treatment aims at controlling the complications."
    explanation: >-
      States directly that no targeted medical therapy exists and that management is
      complication-directed.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26645994
    reference_title: Macrophage recruitment by fibrocystin-defective biliary epithelial cells promotes portal fibrosis in congenital hepatic fibrosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Consistent with these findings, clodronate-induced macrophage depletion results in a significant reduction of portal fibrosis and portal hypertension as well as of liver cysts.
    explanation: >-
      Preclinical pathway manipulation is available even though patient therapy is not established.
    quote_role: PRIMARY_RESULT
references:
- reference: PMID:20301501
  title: "Autosomal Recessive Polycystic Kidney Disease - PKHD1."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      Clinical characteristics. The childhood-to-young-adult presentation of
      ARPKD-PKHD1 is the hepatobiliary one, and GeneReviews names that
      presentation Caroli disease and attributes it to defective biliary ductal
      plate remodeling — the same developmental mechanism this entry models.
    supporting_text: "The less common initial presentation in childhood (after age one year) to young adulthood can be associated with predominant hepatobiliary manifestations characterized by the clinical consequences of developmental anomalies of biliary ductal plate remodeling (also known as Caroli disease)."
  - statement: >-
      Diagnosis/testing. Molecular confirmation rests on biallelic PKHD1
      pathogenic variants in a proband with suggestive findings, consistent with
      the autosomal recessive PKHD1 genetics curated in the genetic block.
    supporting_text: "The molecular diagnosis of ARPKD-PKHD1 is established in a proband with suggestive findings and biallelic pathogenic variants in PKHD1 identified by molecular genetic testing."
  - statement: >-
      Management. The hepatobiliary complications requiring specialist management
      are ascending cholangitis, cholestasis, and portal hypertension — the three
      clinical endpoints of the bile-stasis and portal-hypertension arms of this
      entry's pathograph — with liver or combined liver-kidney transplantation as
      the definitive option.
    supporting_text: "hepatobiliary disease specialists to assure timely management of complications (that can include ascending cholangitis, cholestasis, and portal hypertension) and LTx/CLKTx"
  - statement: >-
      Genetic counseling. Autosomal recessive inheritance with a 25% recurrence
      risk per conception for sibs of an affected individual, supporting the
      inheritance block.
    supporting_text: "If both parents are known to be heterozygous for a PKHD1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being heterozygous, and a 25% chance of being unaffected and not a carrier."
tracked_issues:
- url: https://github.com/monarch-initiative/dismech/issues/6526
  title: "[lit-scan:new] Caroli disease: congenital hepatic fibrosis, portal hypertension, and progressive cholestasis"
  tracked_issue_role: curation_followup
  tracked_issue_status: CLOSED
  notes: >-
    Original curation request for the entry, including the longitudinal portal-hypertension case report.
notes: >-
  This entry covers simple Caroli disease and Caroli syndrome together as large-duct malformation with or without
  the additional CHF component. Human isolated duct ectasia, human PKHD1-associated hepatorenal disease and
  experimental CHF models are distinguished throughout. Published one-in-a-million estimates are variably called
  incidence and lack a clear population denominator in the cited reviews; no population prevalence or lifetime
  cancer risk is inferred from them.
variants:
- name: Reported PKHD1 p.Arg781* / p.Val836Ala compound heterozygous genotype
  gene:
    preferred_term: PKHD1
    term:
      id: hgnc:9016
      label: PKHD1
  description: >-
    A 2014 report described c.2341C>T (p.Arg781*) and c.2507T>C (p.Val836Ala), on NM_138694.3, inherited from
    different parents in dizygotic twins. One twin had a severe syndromic phenotype and the other had isolated
    duct dilatation. These are historical pedigree observations; the missense allele was not functionally proven,
    and no current clinical-significance classification is asserted here.
  evidence:
  - reference: PMID:24710345
    reference_title: Whole exome sequencing identifies recessive PKHD1 mutations in a Chinese twin family with Caroli disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'RESULTS: A combination of WES and Sanger sequencing revealed the genetic defect to be a novel compound heterozygous genotype in PKHD1, including the missense mutation c.2507 T>C, predicted to cause a valine to alanine substitution at codon 836 (c.2507T>C, p.Val836Ala), and the nonsense mutation c.2341C>T, which is predicted to result in an arginine to stop codon at codon 781 (c.2341C>T, p.Arg781*). This compound heterozygous genotype co-segregates with the Caroli disease-affected pedigree members, but is absent in 200 normal chromosomes.'
    explanation: >-
      The primary report describes the genotype, segregation and control comparison.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24710345
    reference_title: Whole exome sequencing identifies recessive PKHD1 mutations in a Chinese twin family with Caroli disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The first twin (Patient B) had no obvious clinical symptoms except for intrahepatic bile duct dilatation.
    explanation: >-
      The twins illustrate phenotypic variability despite sharing the reported genotype.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24710345
    reference_title: Whole exome sequencing identifies recessive PKHD1 mutations in a Chinese twin family with Caroli disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The p.Val836Ala mutation results in an amino acid change from valine to alanine, but as both amino acids are neutral the potential impairment on protein function is unclear; however, the amino acid at position 836 is highly conserved between species.
    explanation: >-
      The authors explicitly leave the missense allele’s functional effect unresolved.
    quote_role: PRIMARY_RESULT

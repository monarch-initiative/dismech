    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peribiliary fibrosis and biliary cysts are the fundamental lesions of FLDs and are responsible for the main clinical manifestations, such as portal hypertension, recurrent cholangitis, cholestasis, sepsis and eventually cholangiocarcinoma."
    explanation: >-
      Names peribiliary fibrosis as one of the two fundamental lesions and links it
      directly to portal hypertension, the downstream node.
- name: Presinusoidal Portal Hypertension
  role: consequence
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Portal pressure rises because of the periportal fibrous obstruction, producing
    splenomegaly with hypersplenic cytopenias and portosystemic collaterals —
    principally oesophageal and gastric fundal varices that bleed recurrently. The
    presinusoidal site of obstruction explains the characteristic dissociation
    between severe portal hypertension and near-normal liver biochemistry early in
    the course. Over years, repeated decompensation and progressive cholestasis
    erode hepatic reserve, converting a compensated Child-Pugh class A patient into
    a transplant candidate.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:42438734
    reference_title: "Ten-year progression of Caroli's disease with portal hypertension despite endoscopic and pharmacological therapy: Implications for liver transplantation-A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At initial presentation in 2015, she had splenomegaly, severe esophagogastric fundal varices, preserved liver biochemistry, Child-Pugh class A disease, and a low model for end-stage liver disease score."

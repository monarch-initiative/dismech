      microenvironment in the biliary epithelium.
  - target: Progressive Peribiliary Fibrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Recurrent biliary inflammation contributes to periportal fibrogenesis in

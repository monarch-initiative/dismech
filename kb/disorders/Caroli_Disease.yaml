  title: "[lit-scan:new] Caroli disease: congenital hepatic fibrosis, portal hypertension, and progressive cholestasis"
  tracked_issue_role: curation_followup
  tracked_issue_status: OPEN
  notes: >-
    Issue that requested this entry. Remaining follow-ups noted there: structured
    Orphanet provenance (ORPHA:53035 / ORPHA:480520 are not yet in
    references_cache), a snippet-backed prevalence record, a
    hepatolithiasis-specific citation, and histopathology/imaging_findings blocks.
notes: >-
  Scope and naming. MONDO carries two live sibling terms — MONDO:0010913 (Caroli
  disease) and MONDO:0018808 (Caroli syndrome) — plus an obsolete MONDO:0000506.
  They are modelled here as one entry with two subtypes rather than two entries,
  because they share a single ductal plate malformation mechanism and differ only
  in which level of the biliary tree is malformed; the literature routinely reports
  them together as CD/CS. The older clinical literature labels the two forms type I
  and type II; both labelings are captured on the subtypes. Curators extending this
  entry should keep the distinction sharp, since a source about Caroli syndrome is
  not automatically a source about simple Caroli disease.

  Not yet curated. No prevalence record is included: no source in the current
  evidence set states a population rate with a quotable figure, and the commonly
  repeated 1-in-1,000,000 estimate is not traceable to a citable abstract here.
  Structured Orphanet records (ORPHA:53035, ORPHA:480520) would supply both the
  prevalence class and an HPO frequency table, but neither is present in
  references_cache and building them requires an Orphadata refresh. Phenotype
  frequency bands are omitted for the same reason — per the frequency-evidence
  guidelines, no band is asserted without its own quantitative support.
  Histopathology, imaging_findings and biochemical blocks are likewise left for a
  second pass.

discussions:
- discussion_id: caroli_cca_incidence_uncertainty
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true incidence of cholangiocarcinoma in Caroli disease and Caroli
    syndrome, and can any risk factor stratify which patients will develop it?
  attaches_to:
  - pathophysiology#Cholangiocarcinoma
  rationale: >-
    Reported cholangiocarcinoma incidence ranges from 2.7% to 37.5% across studies,
    with pooled estimates of 6.6% (systematic review) and 7.1% (German multicentre
    series). All available series are retrospective and drawn from surgical cohorts,
    so they are subject to referral bias, and no predictor of malignant
    transformation has been identified. This matters clinically because malignancy
    risk is one of the arguments used to justify prophylactic resection, yet the
    tumours are almost always found incidentally in the specimen because
    preoperative imaging cannot detect them.
  proposed_experiments:
  - experiment_id: exp_caroli_prospective_cca_incidence
    name: Prospective unselected-cohort cholangiocarcinoma incidence study
    description: >-
      Registry-based prospective follow-up of an unselected (not surgically
      referred) Caroli disease and Caroli syndrome cohort with standardised imaging
      surveillance, to estimate cholangiocarcinoma incidence free of surgical
      referral bias.
    decision_criterion: >-
      An incidence estimate with confidence intervals that exclude the extremes of
      the currently reported 2.7-37.5% range would settle whether prophylactic
      resection is justified by malignancy risk alone.
  - experiment_id: exp_caroli_cca_risk_factor_case_control
    name: Nested case-control analysis of cholangiocarcinoma risk factors
    description: >-
      Within such a cohort, compare patients who did and did not develop
      cholangiocarcinoma, testing candidate risk factors (disease extent, cholangitis
      frequency, hepatolithiasis burden, age, PKHD1 genotype).
    decision_criterion: >-
      Identification of any factor that stratifies risk would convert a uniform
      resection recommendation into a targeted surveillance strategy.
  evidence:
  - reference: PMID:32884228
    reference_title: "Risk of malignancy in Caroli disease and syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The development of intrahepatic carcinoma is described in both conditions, but the reported incidence varies extensively. Potential risk factors for the malignant transformation were not described."
    explanation: >-
      States both halves of this knowledge gap explicitly — the incidence varies
      extensively and no risk factors for malignant transformation are known.
- discussion_id: caroli_no_targeted_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the cholangiociliopathy mechanism be targeted therapeutically, rather than
    only managing the downstream biliary and portal complications?
  attaches_to:
  - pathophysiology#Fibrocystin Loss from the Cholangiocyte Primary Cilium
  rationale: >-
    Every treatment curated in this entry acts on a consequence — infection, portal
    pressure, variceal bleeding, or the malformed anatomy itself — and none acts on
    the ciliary defect or on peribiliary fibrogenesis. A contributing obstacle is
    that fibrocystin/polyductin's molecular function is still not established, so
    there is no well-defined pathway to drug.
  proposed_experiments:
  - experiment_id: exp_caroli_fibrocystin_function_organoid
    name: Fibrocystin function in patient-derived cholangiocyte organoids
    description: >-
      Define the molecular function of fibrocystin/polyductin in cholangiocyte cilia
      (interactome and ciliary signalling readouts) in human cholangiocyte organoids
      derived from PKHD1-mutant patients versus isogenic controls.
    decision_criterion: >-
      Identification of a defined signalling axis downstream of ciliary fibrocystin
      would provide the first druggable target in this disease.
  - experiment_id: exp_caroli_antifibrotic_pck_rat
    name: Antifibrotic intervention trial in the PCK rat
    description: >-
      Test antifibrotic candidates against peribiliary fibrogenesis in the PCK rat,
      using portal pressure and periportal collagen deposition as endpoints.
    decision_criterion: >-
      A reduction in portal pressure and periportal collagen relative to untreated
      PCK controls would justify translation toward a portal-hypertension-modifying
      therapy.
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted medical therapy is not available yet and thus the current treatment aims at controlling the complications."
    explanation: >-
      States directly that no targeted medical therapy exists and that management is
      complication-directed.

genetic:
- name: PKHD1
  notes: >-
    PKHD1 encodes fibrocystin/polyductin, a cholangiocyte and renal tubular ciliary
    protein. Biallelic variants cause autosomal recessive polycystic kidney disease
    together with the hepatic ductal plate malformation spectrum — congenital
    hepatic fibrosis, Caroli disease and Caroli syndrome. The protein's precise
    molecular function remains incompletely defined, with planar cell polarity the
    best-supported candidate role.
  gene_term:
    preferred_term: PKHD1
    term:
      id: hgnc:9016
      label: PKHD1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHF, CD/CS, and ARPKD are caused by a number of mutations in polycystic kidney hepatic disease 1 (PKHD1), a gene that encodes for fibrocystin/polyductin"
    explanation: >-
      Directly attributes Caroli disease and Caroli syndrome, alongside congenital
      hepatic fibrosis and ARPKD, to PKHD1 mutations.
  - reference: PMID:14598246
    reference_title: "Defects in cholangiocyte fibrocystin expression and ciliary structure in the PCK rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that fibrocystin is expressed in cholangiocyte cilia and that disruption of Pkhd1 by a germ line mutation in the PCK rat or by siRNA in IBDUs results in abnormalities in ciliary morphology and possibly biliary cystogenesis."
    explanation: >-
      Orthologous rat model evidence that Pkhd1 disruption causes ciliary
      abnormalities and biliary cystogenesis.

- name: Liver Transplantation
  description: >-
    The definitive option for diffuse bilobar disease that cannot be resected, for
    hepatic decompensation, and for portal hypertension refractory to endoscopic and
    pharmacological therapy. Combined liver-kidney transplantation is considered
    when ARPKD has produced concurrent renal failure. Referral before advanced
    decompensation is advocated, since hepatic reserve declines progressively while
    complications recur.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:

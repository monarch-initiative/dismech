    snippet: The Caroli disease is a very rare pathology that can be revealed early in childhood or in adulthood, whose diagnosis is based on Magnetic Resonance CholangioPancreatography, which shows the communication of these malformations with the rest of the biliary tree and allows to eliminate biliary stenosis.

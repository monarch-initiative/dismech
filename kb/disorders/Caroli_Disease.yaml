- name: Aberrant Notch-Hes1 Signaling
  role: intermediate
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Human Caroli liver specimens show increased nuclear Notch1 and biliary Hes1 with increased proliferative
    activity. This is an observational tissue association supporting a possible cyst-growth pathway, not proof
    that Notch activation initiates the congenital ductal defect.
  evidence:
  - reference: PMID:34166554
    reference_title: Notch-Hes1 signaling activation in Caroli disease and polycystic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The expression of Notch receptor 1 (Notch1) was increased in the nuclei of biliary epithelial cells in all cases of CD and PLD, whereas it remained at a low level in CHF and VMC.
    explanation: >-
      Primary human tissue study demonstrates nuclear Notch1, not universal Notch1–4 activation in Caroli tissue.
    quote_role: PRIMARY_RESULT
  - reference: PMID:34166554
    reference_title: Notch-Hes1 signaling activation in Caroli disease and polycystic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Accordingly, the Notch effector Hes1 was highly expressed in biliary epithelial cells of CD and PLD, and the cell proliferative activity was significantly higher in CD and PLD.
    explanation: >-
      Human tissue data associate pathway readout and proliferation.
    quote_role: PRIMARY_RESULT
  cell_types:

    evidence_source: HUMAN_CLINICAL
    snippet: The fibrosis is characterized by portal-portal bands with embedded elongated, tortuous, or branched bile duct structures.
    explanation: >-
      The CHF section describes the small-duct and fibrotic component of Caroli syndrome.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39130622
    reference_title: 'Heritable Chronic Cholestatic Liver Diseases: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The hepatic lobules typically have normal hepatocyte morphology unless there is progression to cirrhosis.
    explanation: >-
      This distinguishes typical CHF architecture from established cirrhosis.
    quote_role: REVIEW_SYNTHESIS
- name: Nuclear Notch1 and biliary Hes1 expression
  description: >-
    A human tissue study found increased nuclear Notch1 and Hes1 expression in Caroli disease, with higher
    biliary proliferative activity. These research observations do not establish a clinical diagnostic test
    or activation of all Notch receptors in Caroli disease.
  evidence:
  - reference: PMID:34166554
    reference_title: Notch-Hes1 signaling activation in Caroli disease and polycystic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The expression of Notch receptor 1 (Notch1) was increased in the nuclei of biliary epithelial cells in all cases of CD and PLD, whereas it remained at a low level in CHF and VMC.
    explanation: >-
      Primary human tissue study demonstrates nuclear Notch1, not universal Notch1–4 activation in Caroli tissue.
    quote_role: PRIMARY_RESULT

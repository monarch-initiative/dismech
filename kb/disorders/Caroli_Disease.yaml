genetic:
- name: PKHD1
  notes: >-
    Biallelic pathogenic PKHD1 variants cause the ARPKD/CHF spectrum, including Caroli syndrome. Reported variants
    include truncating, missense and splice variants, with occasional deep intronic variants and exon deletions.
    Biallelic truncating variants are associated with severe ARPKD overall, but exceptions and intrafamilial
    variability preclude predicting an individual Caroli phenotype from variant class alone. Sporadic isolated
    large-duct disease need not have an established PKHD1 cause.
  gene_term:
    preferred_term: PKHD1
    term:
      id: hgnc:9016
      label: PKHD1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHF, CD/CS, and ARPKD are caused by a number of mutations in polycystic kidney hepatic disease 1 (PKHD1), a gene that encodes for fibrocystin/polyductin"
    explanation: >-
      Directly attributes Caroli disease and Caroli syndrome, alongside congenital
      hepatic fibrosis and ARPKD, to PKHD1 mutations.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:14598246
    reference_title: "Defects in cholangiocyte fibrocystin expression and ciliary structure in the PCK rat."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that fibrocystin is expressed in cholangiocyte cilia and that disruption of Pkhd1 by a germ line mutation in the PCK rat or by siRNA in IBDUs results in abnormalities in ciliary morphology and possibly biliary cystogenesis."
    explanation: >-
      Orthologous rat model evidence that Pkhd1 disruption causes ciliary
      abnormalities and biliary cystogenesis.
    quote_role: PRIMARY_RESULT
  - reference: PMID:24710345
    reference_title: Whole exome sequencing identifies recessive PKHD1 mutations in a Chinese twin family with Caroli disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The father harbors the p.Val836Ala mutant, while the mother carries the p.Arg781* variant.
    explanation: >-
      The reported compound heterozygous genotype was inherited in trans. The pedigree provides segregation
      evidence, not a current expert-panel classification.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While the majority of PKHD1 pathogenic variants reported to date are within the coding or canonical splice site region, several pathogenic variants have been identified that are deep within intronic regions and are therefore likely to be identified by genome sequencing [Michel-Calemard et al 2009, Chen et al 2019, Doreille et al 2022, Liu et al 2022].
    explanation: >-
      GeneReviews describes coding, splice-site and deep intronic pathogenic variants in ARPKD-PKHD1.
    quote_role: REVIEW_SYNTHESIS
diagnosis:
- name: MR cholangiopancreatography
  description: >-
    MRCP demonstrates the saccular intrahepatic duct dilatations and their
    communication with the biliary tree, and is the mainstay of non-invasive
    diagnosis together with CT. No symptom, sign or laboratory value distinguishes
    Caroli disease from other biliary disorders.
  evidence:
  - reference: PMID:25327281
    reference_title: "Clinical classification of Caroli's disease: an analysis of 30 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No typical symptoms, signs or laboratory indicators are able to distinguish CD from other conditions. Both MRCP and CT were most valuable in diagnosis."
    explanation: >-
      Establishes cross-sectional/MRCP imaging as the diagnostic modality and the
      absence of a discriminating clinical or laboratory feature.
    quote_role: PRIMARY_RESULT
  - reference: clinicaltrials:NCT04007575
    reference_title: Magnetic Resonance CholangioPancreatography Signs for the Diagnosis of Caroli Disease
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Caroli disease is a very rare pathology that can be revealed early in childhood or in adulthood, whose diagnosis is based on Magnetic Resonance CholangioPancreatography, which shows the communication of these malformations with the rest of the biliary tree and allows to eliminate biliary stenosis.
    explanation: >-
      The diagnostic study protocol states the MRCP features used to establish Caroli disease.
    quote_role: PRIMARY_RESULT
  diagnosis_term:
    preferred_term: Magnetic Resonance Cholangiopancreatography
    term:
      id: NCIT:C113775
      label: Magnetic Resonance Cholangiopancreatography
- name: Assessment for congenital hepatic fibrosis and renal involvement
  description: >-
    Ductal ectasia should prompt assessment for CHF to distinguish Caroli syndrome, including liver stiffness,
    portal-hypertension findings and renal imaging. Renal and hepatic severity need not correlate. Histology
    can resolve uncertain fibrosis morphology when clinically indicated.
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ﬁnding of multiple segmental cystic or saccular di- latations of bile ducts should initiate a search for congenital hepatic ﬁbrosis in order to differentiate Caroli disease from Caroli syndrome (LoE 4, strong recommendation, 100% consensus).
    explanation: >-
      EASL recommends actively distinguishing simple from syndromic disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While the majority of patients with Caroli syndrome possess renal cystic lesions and renal impairment may ensue, there is no correlation between the severity of renal and hepatic manifestations.
    explanation: >-
      Renal lesions are common in Caroli syndrome but severity does not track hepatic severity.
    quote_role: REVIEW_SYNTHESIS
- name: Molecular diagnosis of PKHD1-associated disease
  description: >-
    In a compatible hepatorenal phenotype, biallelic pathogenic or likely pathogenic PKHD1 variants establish
    ARPKD-PKHD1. A phenotype-focused multigene panel or exome/genome testing may be appropriate. A VUS or a
    negative PKHD1 result does not by itself establish or exclude imaging-defined simple Caroli disease.
  evidence:
  - reference: PMID:20301501
    reference_title: Autosomal Recessive Polycystic Kidney Disease – PKHD1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The molecular diagnosis of ARPKD-PKHD1 is established in a proband with suggestive findings and biallelic pathogenic variants in PKHD1 identified by molecular genetic testing.
    explanation: >-
      GeneReviews molecular criteria apply to the PKHD1-associated hepatorenal subset.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of biallelic PKHD1 variants of uncertain significance (or of one known PKHD1 pathogenic variant and one PKHD1 variant of uncertain significance) does not establish or rule out the diagnosis.
    explanation: >-
      GeneReviews distinguishes uncertain from diagnostic variants.
    quote_role: REVIEW_SYNTHESIS
- name: Cholangiocarcinoma surveillance
  description: >-
    The 2022 EASL guideline permits MRCP every 12 months after Caroli diagnosis, as a weak recommendation based
    on low-level evidence. The guideline acknowledges a lack of disease-specific screening accuracy data. ERCP
    is not recommended for cancer screening because of infection risk, and CA19-9 has poor diagnostic performance
    in this setting.
  diagnosis_term:
    preferred_term: Magnetic Resonance Cholangiopancreatography
    term:
      id: NCIT:C113775
      label: Magnetic Resonance Cholangiopancreatography
  evidence:
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with Caroli disease and syndrome may receive surveillance for cholangiocarcinoma with magnetic reso- nance cholangiopancreaticography every 12 months after diagnosis (LoE 4, weak recommendation, 90% consensus).
    explanation: >-
      Annual MRCP is a weak, low-evidence recommendation, not proven outcome-improving screening.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We do not recommend endoscopic retrograde chol- angiopancreaticography for cholangiocarcinoma screening because this procedure is associated with increased risk of biliary infection.
    explanation: >-
      Guideline discourages ERCP as a screening procedure.
    quote_role: REVIEW_SYNTHESIS
- name: Hepatoportal and renal surveillance in ARPKD-associated Caroli syndrome
  description: >-
    Monitor blood pressure, kidney function, blood counts, synthetic liver function and nutritional/fat-soluble
    vitamin status. Ultrasound/Doppler, elastography and MRCP are selected according to complications and prior
    imaging; renal dysfunction affects contrast and transplant decisions.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hepatoportal involvement. Perform physical examination; obtain complete blood counts, prothrombin time, and serum concentrations of albumin, 25-hydroxyvitamin D, and other fat-soluble vitamins.
    explanation: >-
      GeneReviews specifies laboratory and examination surveillance for ARPKD-associated hepatobiliary disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Kidney function. Close monitoring for the complications of CKD should be undertaken by the treating pediatric nephrologist according to standard practices.
    explanation: >-
      Associated CKD requires nephrology surveillance.
    quote_role: REVIEW_SYNTHESIS
treatments:
- name: Antibiotic Therapy for Cholangitis
  description: >-
    Treat bacterial cholangitis promptly, with biliary drainage when obstruction requires it. In ARPKD-associated
    disease, chronic antibiotic prophylaxis is individualized: GeneReviews considers its routine use controversial
    and gives no general recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Recurrent Bacterial Cholangitis
    treatment_effect: INHIBITS
    description: >-
      Antimicrobials clear the bacterial infection of the stagnant biliary segments
      but do not correct the underlying stasis.
  evidence:
  - reference: PMID:32884228
    reference_title: 'Risk of malignancy in Caroli disease and syndrome: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initial treatment of CS and CD is often nonsurgical and supportive therapy using analgesia, antibiotics in case of biliary infections and ursodeoxycholic acid[31,32].
    explanation: >-
      The review explicitly documents antibiotic treatment of biliary infection.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The role of chronic antibiotic prophylaxis in all children with ARPKD remains controversial.
    explanation: >-
      Routine prophylaxis in all children with ARPKD is not established.
    quote_role: REVIEW_SYNTHESIS
- name: Nonselective Beta-Blocker Therapy for Portal Hypertension
  description: >-
    Nonselective beta-blockers such as propranolol or carvedilol are used for portal-hypertension/variceal
    prophylaxis. One Caroli case showed initial symptomatic improvement but recurrent bleeding over time; this
    does not establish durable Caroli-specific efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
  target_mechanisms:
  - target: Presinusoidal Portal Hypertension
    treatment_effect: INHIBITS
    description: >-
      Nonselective beta-blockade reduces portal inflow and portal pressure, the
      mechanism targeted for variceal bleeding prophylaxis.
  evidence:
  - reference: PMID:42438734
    reference_title: "Ten-year progression of Caroli's disease with portal hypertension despite endoscopic and pharmacological therapy: Implications for liver transplantation-A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms improved after nonselective beta-blocker therapy; however, longitudinal follow-up showed persistent portal hypertension, recurrent gastrointestinal bleeding, and progressive impairment of hepatic reserve."
    explanation: >-
      Single-patient observation supports reported use and its limitations, not a population treatment-effect
      estimate.
    quote_role: PRIMARY_RESULT
- name: Endoscopic Variceal Ligation
  description: >-
    Endoscopic band ligation of bleeding oesophageal varices. Effective for acute
    haemorrhage control but, in the documented long-term course, did not prevent
    recurrent bleeding when applied sequentially over years.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Endoscopic variceal band ligation
    term:
      id: NCIT:C15270
      label: Ligation
  target_mechanisms:
  - target: Gastrointestinal bleeding
    treatment_effect: INHIBITS
    description: >-
      Band ligation treats variceal hemorrhage by obliterating the collateral vessel; it does not directly
      lower portal pressure.
  evidence:
  - reference: PMID:42438734
    reference_title: "Ten-year progression of Caroli's disease with portal hypertension despite endoscopic and pharmacological therapy: Implications for liver transplantation-A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she experienced recurrent hematemesis and melena despite sequential endoscopic variceal ligation and beta-blocker therapy"
    explanation: >-
      Documents recurrent bleeding despite sequential band ligation, supporting the
      described limitation of endoscopic therapy.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Esophageal varices should be treated with endoscopic banding or sclerotherapy according to local standard procedures as for children with other causes of portal hypertension [Guay-Woodford et al 2014, Jeanniard-Malet et al 2017].
    explanation: >-
      GeneReviews supports endoscopic treatment in ARPKD-associated portal hypertension.
    quote_role: REVIEW_SYNTHESIS
- name: Hepatic Resection for Localised Disease
  description: >-
    Resection can relieve symptoms when disease is confined to a resectable segment or lobe, particularly without
    substantial fibrosis or portal hypertension. It removes the diseased territory but does not prove elimination
    of all future cancer risk in residual liver.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Hepatectomy
    term:
      id: NCIT:C15249
      label: Hepatectomy
  target_mechanisms:
  - target: Segmental Saccular Dilatation of the Large Intrahepatic Bile Ducts
    treatment_effect: INHIBITS
    description: >-
      Removes the malformed duct segments, eliminating the anatomical substrate for
      stasis, infection and carcinogenesis in the resected territory.
  evidence:
  - reference: PMID:34294522
    reference_title: "The rate of cholangiocarcinoma in Caroli Disease A German multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is risk of malignant transformation and patients with CD might also benefit from resection due to improvement of symptoms. Therefore, resection is strongly advised."
    explanation: >-
      Multicentre surgical series concludes that resection is strongly advised, on
      grounds of both malignancy risk and symptom relief.
    quote_role: PRIMARY_RESULT
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This may be feasible in symptomatic cases with monolobar involvement without liver ﬁbrosis or portal hyper- tension.
    explanation: >-
      EASL qualifies resection by distribution and absence of major fibrosis/portal hypertension.
    quote_role: REVIEW_SYNTHESIS
- name: Liver Transplantation
  description: >-
    Consider transplant referral for recurrent cholangitis with bilobar disease, or monolobar disease with
    fibrosis/portal hypertension when resection is excluded. Referral before acute infection or physical deterioration
    is advised. Combined liver-kidney transplantation requires individualized weighing of hepatic complications,
    CKD and operative risk.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Presinusoidal Portal Hypertension
    treatment_effect: INHIBITS
    description: >-
      Replacing the fibrotic, malformed liver removes the presinusoidal obstruction
      and with it the portal hypertension.
  evidence:
  - reference: PMID:42438734
    reference_title: "Ten-year progression of Caroli's disease with portal hypertension despite endoscopic and pharmacological therapy: Implications for liver transplantation-A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case demonstrates the limitations of long-term endoscopic and pharmacological therapy in Caroli's disease complicated by portal hypertension and supports timely transplant referral before advanced hepatic decompensation occurs."
    explanation: >-
      Supports transplantation as the definitive option and argues for timely
      referral, the recommendation captured in this treatment.
    quote_role: PRIMARY_RESULT
  - reference: PMID:33824930
    reference_title: "Fibrocystic liver disease: novel concepts and translational perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interventional radiology or surgical treatments, including liver transplantation, are used in selected cases."
    explanation: >-
      Confirms liver transplantation as an accepted treatment in selected cases of
      fibrocystic liver disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    reference_title: https://socgastro.org.br/novo/wp-content/uploads/2025/01/PIIS0168827822003476.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Referral for liver transplantation should be considered in patients with Caroli disease or syndrome with recurrent cholangitis and i) bilobar involvement, or ii) monolobar involvement in combination with liver ﬁbrosis or portal hypertension, when the possibility of liver resection has been excluded (LoE 3, strong recommendation, 96% consensus).
    explanation: >-
      Guideline gives the extent and complication criteria for transplant referral.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1326/pdf/Bookshelf_NBK1326.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In summary, individual decision making regarding single or combined transplantation is indispensable because clear-cut criteria evaluating risks and benefits for decision making in individuals with ARPKD remain to be defined.
    explanation: >-
      GeneReviews emphasizes individualized risk-benefit assessment.
    quote_role: REVIEW_SYNTHESIS
- name: Avoidance of Hepatotoxic and Nephrotoxic Agents
  description: >-
    Where Caroli disease occurs as the hepatobiliary presentation of ARPKD-PKHD1,
    GeneReviews advises minimising potentially hepatotoxic exposures — acetaminophen
    at doses above 30 mg/kg/day, herbal supplements and alcohol — alongside known
    nephrotoxic agents such as NSAIDs and aminoglycosides, on the rationale that
    hepatic and renal reserve are already committed by the underlying disease.
    Scope caveat: this guidance is written for ARPKD-PKHD1 and so applies to the
    PKHD1-associated Caroli syndrome form curated here; it should not be transferred
    wholesale to simple, frequently sporadic Caroli disease, whose genetic basis and
    renal involvement are not the same.

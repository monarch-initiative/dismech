progression:
- phase: Congenital and infantile presentation
  age_range: Birth to early childhood
  notes: >-
    Lesions are often present at birth or arise during infancy and early childhood,
    most commonly affecting the head, neck, and trunk as solitary or multicentric
    nodules.
  evidence:
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infantile myofibromatosis is one of the most prevalent soft tissue tumors of infancy and childhood."
    explanation: Establishes characteristic onset during infancy and childhood.
  - reference: PMID:19738495
    reference_title: "A rare case of infantile myofibromatosis and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 9-month-old boy presented with a swelling on the medial side of his proximal left tibia. The lesion which was present since birth, was well palpable, indolent, hard, and mobile in relation to the surrounding tissue."
    explanation: Illustrates congenital presentation with detection in infancy.
- phase: Spontaneous regression or late recurrence
  age_range: Infancy through long-term follow-up
  notes: >-
    Solitary and non-visceral bony or soft-tissue lesions typically undergo
    spontaneous regression within the first years of life, whereas visceral
    multicentric lesions can be life-threatening and recurrence can occur years
    after initial presentation.
  evidence:
  - reference: PMID:19738495
    reference_title: "A rare case of infantile myofibromatosis and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data of the literature review underline that a wait-and-see-policy should be considered as the first treatment of choice as in most instances the bony lesions regress spontaneously."
    explanation: Confirms spontaneous regression as the typical natural history of non-visceral lesions.
  - reference: PMID:33063933
    reference_title: "Diverse presentation and tailored treatment of infantile myofibromatosis: A single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term follow up is needed, since recurrence could appear years after initial presentation of the disease."
    explanation: Documents the risk of late recurrence years after initial presentation.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Familial infantile myofibromatosis (types 1 and 2) is inherited in an autosomal
    dominant manner with marked variable expressivity, ranging from solitary
    congenital nodules that regress spontaneously to multicentric visceral disease
    or late/adult-onset vascular and systemic manifestations in kindreds carrying
    germline PDGFRB variants.
  evidence:
  - reference: PMID:23731537
    reference_title: "A recurrent PDGFRB mutation causes familial infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate p.Arg561Cys substitution in PDGFR-β as a cause of the dominant form of this disease."
    explanation: Confirms autosomal dominant inheritance in familial infantile myofibromatosis.
  - reference: PMID:31017643
    reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although patients had no familial history, 3 of 25 mutations (12%) were likely to be germline, suggesting de novo heritable alterations."
    explanation: Demonstrates de novo germline heritable PDGFRB variants in apparently sporadic cases.
  - reference: PMID:32500973
    reference_title: "Activating variants in PDGFRB result in a spectrum of disorders responsive to imatinib monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven additional patients from a large family had variable expressivity and late-onset disease, including adult onset features and two individuals with sudden death."
    explanation: Demonstrates variable expressivity and late-onset disease in families with inherited activating PDGFRB variants.
- name: Somatic mosaicism
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    Most sporadic multicentric and solitary infantile myofibromatosis cases arise
    from post-zygotic somatic or mosaic activating PDGFRB mutations, with patients
    harboring either the same mosaic mutation across multiple separated lesions or
    independent somatic PDGFRB mutations across distinct nodules. Paired tumor and
    peripheral blood sequencing is required to distinguish low-level post-zygotic
    mosaicism from constitutional germline variants or lesion-restricted somatic
    hits.
  evidence:
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had the same mutation in multiple separated lesions. By contrast, a third patient had three different PDGFRB mutations in the three nodules analyzed."
    explanation: Identical PDGFRB mutations across anatomically separated lesions in sporadic patients demonstrate post-zygotic mosaicism, alongside independent somatic mutations in individual nodules.
  - reference: PMID:32500973
    reference_title: "Activating variants in PDGFRB result in a spectrum of disorders responsive to imatinib monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differences in reported phenotypes can be dramatic and correlate with advancing age, genotype, and to mosaicism in some individuals."
    explanation: Confirms that somatic mosaicism is a key determinant of phenotypic presentation across the PDGFRB activating variant spectrum.
  - reference: PMID:33683022
    reference_title: "Segmental overgrowth and aneurysms due to mosaic PDGFRB p.(Tyr562Cys)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Activating variants in the platelet-derived growth factor receptor β gene (PDGFRB) have been associated with Kosaki overgrowth syndrome, infantile myofibromatosis, and Penttinen premature aging syndrome. A recently described phenotype with fusiform aneurysm has been associated with mosaic PDGFRB c.1685A > G p.(Tyr562Cys) variant."
    explanation: Documents post-zygotic mosaic activating PDGFRB variants within the infantile myofibromatosis and PDGFRB-overgrowth/vascular spectrum.
genetic:
- name: PDGFRB Gain-of-Function Mutations
  gene_term:
    preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  association: Causative
  subtype: Infantile Myofibromatosis 1
  features: >-
    Heterozygous germline, post-zygotic mosaic, and/or lesion-restricted somatic
    gain-of-function mutations in PDGFRB (such as p.Arg561Cys, p.Asn666Lys, and
    p.Asp850Val) located in the transmembrane, juxtamembrane, and kinase domains
    cause constitutive receptor activation in the absence of ligand. Familial cases
    exhibit variable expressivity and frequently follow a two-hit model combining a
    weakly activating germline variant with a stronger somatic second hit in tumor
    tissue, whereas sporadic multicentric and solitary cases typically arise from
    somatic or mosaic mutations.
  notes: >-
    Gain-of-function PDGFRB variants cluster in the transmembrane, juxtamembrane,
    and kinase domains. While most mutants are sensitive to imatinib, the
    kinase-domain p.Asp850Val (D850V) substitution confers imatinib resistance
    while remaining sensitive to dasatinib and ponatinib.
  case_fractions:
  - population: Pediatric sporadic multicentric infantile myofibromatosis cohort
    case_fraction_percent: 68.4
    cohort_size: 19
    notes: 13 of 19 pediatric multicentric myofibromatosis cases carried gain-of-function PDGFRB mutations.
    evidence:
    - reference: PMID:31017643
      reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations were particularly associated with severe multicentric disease (13 of 19 myofibromatosis cases [68%])."
      explanation: Quantifies the PDGFRB mutation fraction (13/19, 68%) in pediatric multicentric infantile myofibromatosis.
  - population: Sporadic multicentric infantile myofibromatosis sequencing series
    case_fraction_percent: 75.0
    cohort_size: 8
    notes: 6 of 8 patients with sporadic multicentric infantile myofibromatosis harbored coding PDGFRB mutations.
    evidence:
    - reference: PMID:28334876
      reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the coding sequence of PDGFRB were identified in 6 out of 8 patients with the sporadic multicentric form of the disease and in 1 out of 8 patients with isolated myofibroma."
      explanation: Documents PDGFRB coding mutations in 6 of 8 (75%) sporadic multicentric cases.
  evidence:
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the coding sequence of PDGFRB were identified in 6 out of 8 patients with the sporadic multicentric form of the disease and in 1 out of 8 patients with isolated myofibroma."
    explanation: Demonstrates high frequency of PDGFRB mutations in sporadic multicentric myofibromatosis.
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one case, a weakly-activating germline variant was associated with a stronger somatic mutation, suggesting a two-hit model for familial myofibromatosis."
    explanation: Supports the two-hit germline plus somatic mutation mechanism in familial myofibromatosis.
  - reference: PMID:31017643
    reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gain-of-function PDGFRB mutations were found in samples from 25 children, with no mutation found in samples from adults."
    explanation: Largest cohort study confirming PDGFRB mutations in pediatric myofibromatosis.
  - reference: PMID:23731537
    reference_title: "A recurrent PDGFRB mutation causes familial infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a germline mutation c.1681C>T (p.Arg561Cys) in platelet-derived growth factor receptor β (PDGFRB) in all 11 affected individuals with familial IM, although none of the five individuals with nonfamilial IM had mutations in this gene."
    explanation: Identifies the recurrent germline p.Arg561Cys PDGFRB mutation in familial infantile myofibromatosis.
  - reference: PMID:32500973
    reference_title: "Activating variants in PDGFRB result in a spectrum of disorders responsive to imatinib monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven additional patients from a large family had variable expressivity and late-onset disease, including adult onset features and two individuals with sudden death."
    explanation: Documents variable expressivity and late-onset disease in familial PDGFRB variant carriers.
  - reference: PMID:33683022
    reference_title: "Segmental overgrowth and aneurysms due to mosaic PDGFRB p.(Tyr562Cys)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline and/or somatic testing for PDGFRB gene should be obtained when PDGFRB activating variant-related phenotypes are present."
    explanation: Emphasizes that both germline and somatic/mosaic PDGFRB variants contribute to PDGFRB-associated phenotypes including infantile myofibromatosis.
- name: NOTCH3 Gain-of-Function Mutation
  gene_term:
    preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Causative
  subtype: Infantile Myofibromatosis 2
  features: >-
    A heterozygous germline missense mutation in NOTCH3 (p.Leu1519Pro / L1519P)
    within the heterodimerization domain causes autosomal dominant familial
    infantile myofibromatosis type 2 by inducing ligand-independent NOTCH3
    receptor signaling and upregulating PDGFRB expression in fibroblasts.
  evidence:
  - reference: DOI:10.1242/dmm.046300
    reference_title: "The infantile myofibromatosis NOTCH3 L1519P mutation leads to hyperactivated ligand-independent Notch signaling and increased PDGFRB expression"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Autosomal-dominant forms of IMF are caused by mutations in the PDGFRB gene, but a family carrying a L1519P mutation in the NOTCH3 gene has also recently been identified."
    explanation: Documents the familial infantile myofibromatosis pedigree carrying the causative NOTCH3 L1519P mutation.
  - reference: DOI:10.1242/dmm.046300
    reference_title: "The infantile myofibromatosis NOTCH3 L1519P mutation leads to hyperactivated ligand-independent Notch signaling and increased PDGFRB expression"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The NOTCH3L1519P receptor generates enhanced downstream signaling in a ligand-independent manner."
    explanation: Demonstrates that the IMF-associated NOTCH3 L1519P mutation is a gain-of-function variant that hyperactivates Notch signaling independent of ligand.
  - reference: DOI:10.1242/dmm.046300
    reference_title: "The infantile myofibromatosis NOTCH3 L1519P mutation leads to hyperactivated ligand-independent Notch signaling and increased PDGFRB expression"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, NOTCH3L1519P upregulates PDGFRB expression in fibroblasts, supporting a functional link between Notch and PDGF dysregulation in IMF."
    explanation: Establishes the mechanistic link from mutated NOTCH3 to increased PDGFRB expression in fibroblasts.

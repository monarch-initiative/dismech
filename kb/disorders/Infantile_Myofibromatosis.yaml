diagnosis:
- name: Histopathological Biopsy and Immunohistochemistry
  description: >-
    Definitive diagnosis relies on tissue biopsy demonstrating spindle-shaped
    myofibroblastic cells with pale pink cytoplasm and elongated nuclei, confirmed
    by positive immunohistochemistry for vimentin and muscle-specific actin (HHF-35).
  diagnosis_term:
    preferred_term: biopsy and histopathologic examination
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: >-
    Spindle-shaped fibroblast/myofibroblast cells positive for vimentin and HHF-35;
    rapid frozen section alone can misclassify lesions as histiocytosis X.
  evidence:
  - reference: PMID:19738495
    reference_title: "A rare case of infantile myofibromatosis and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rapid frozen section biopsy hinted at the diagnosis of histiocytosis X. The definitive histological result 6 days later was infantile myofibromatosis."
    explanation: Demonstrates that definitive histological examination of biopsy tissue is required to establish the diagnosis and avoid misdiagnosis on frozen section.
  - reference: PMID:19738495
    reference_title: "A rare case of infantile myofibromatosis and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathologically, cells characteristically appear as spindle-shaped fibroblast cells with pale pink cytoplasm and elongated nuclei and the immunophenotype is defined with a positive reaction on smooth-muscle antigen vimentin and the muscle-specific antigen HHF-35."
    explanation: Specifies the histological and immunohistochemical criteria on biopsy.
- name: Total-Body Magnetic Resonance Imaging
  description: >-
    Total-body MRI is recommended at diagnosis and during follow-up for all patients
    presenting with one or more myofibroma lesions to evaluate soft-tissue and
    visceral disease extension and guide therapy.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Detection of multicentric soft-tissue, skeletal, cardiac, gastrointestinal, and
    central nervous system myofibromas.
  evidence:
  - reference: PMID:33063933
    reference_title: "Diverse presentation and tailored treatment of infantile myofibromatosis: A single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients underwent total-body magnetic resonance imaging (MRI) at diagnosis and during follow up, which revealed disease extension that aided in designing treatment."
    explanation: Demonstrates the diagnostic and staging utility of total-body MRI.
  - reference: PMID:33063933
    reference_title: "Diverse presentation and tailored treatment of infantile myofibromatosis: A single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest screening all patients with one or more IM lesions by means of total body MRI due to its inherent superior soft tissue resolution."
    explanation: Recommends total-body MRI screening for all patients with infantile myofibromatosis.
- name: PDGFRB Genetic Sequencing
  description: >-
    Paired deep sequencing or exome sequencing of both tumor biopsy tissue and
    germline (peripheral blood) DNA for activating PDGFRB variants supports
    diagnosis, distinguishes germline familial disease from post-zygotic somatic
    mosaicism, guides prognostic stratification for multicentric disease, and
    informs selection of tyrosine kinase inhibitor therapy. Because sporadic and
    multicentric cases are frequently somatic or mosaic—and separate nodules in the
    same patient can harbor either identical or independent somatic PDGFRB
    mutations—testing affected lesional tissue (and multiple separate nodules when
    available) alongside blood is essential when germline blood sequencing is
    negative.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of germline, somatic, or mosaic activating variants in PDGFRB,
    clustering in the transmembrane, juxtamembrane, and kinase domains.
  notes: >-
    Activating PDGFRB mutations in infantile myofibromatosis include juxtamembrane
    domain variants (such as p.Arg561Cys and p.Pro560_Arg561delinsHis), kinase
    domain variants (such as p.Asn666Lys and p.Asp850Val), and transmembrane domain
    substitutions.
  evidence:
  - reference: PMID:31017643
    reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PDGFRB sequencing appears to have a high value for diagnosis, prognosis, and therapy of soft-tissue tumors in children."
    explanation: Establishes the diagnostic, prognostic, and therapeutic value of PDGFRB sequencing.
  - reference: PMID:33683022
    reference_title: "Segmental overgrowth and aneurysms due to mosaic PDGFRB p.(Tyr562Cys)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline and/or somatic testing for PDGFRB gene should be obtained when PDGFRB activating variant-related phenotypes are present."
    explanation: Recommends obtaining both germline and somatic PDGFRB genetic testing to detect mosaic and somatic activating variants.
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients had the same mutation in multiple separated lesions. By contrast, a third patient had three different PDGFRB mutations in the three nodules analyzed."
    explanation: Demonstrates that multi-lesion tumor sequencing can distinguish post-zygotic mosaicism (shared mutation across nodules) from independent somatic hits across separate nodules.
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were located in the transmembrane, juxtamembrane and kinase domains of the receptor."
    explanation: Identifies the transmembrane, juxtamembrane, and kinase domain hotspots targeted during PDGFRB sequencing.
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results provide a genetic test to facilitate diagnosis, and preclinical data for development of molecular therapies."
    explanation: Supports PDGFRB genetic testing as a diagnostic tool in infantile myofibromatosis.
differential_diagnoses:
- name: Langerhans Cell Histiocytosis
  description: >-
    Langerhans cell histiocytosis (formerly histiocytosis X) can mimic infantile
    myofibromatosis radiographically and on rapid frozen section when patients
    present with osteolytic bone lesions with sclerotic rims and soft-tissue masses.
  distinguishing_features:
  - Definitive histopathology of infantile myofibromatosis shows spindle-shaped myofibroblasts positive for vimentin and HHF-35 rather than Langerhans histiocytes.
  - Presence of activating PDGFRB mutations confirms infantile myofibromatosis.
  disease_term:
    preferred_term: Langerhans cell histiocytosis
    term:
      id: MONDO:0018310
      label: Langerhans cell histiocytosis
  evidence:
  - reference: PMID:19738495
    reference_title: "A rare case of infantile myofibromatosis and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiologically often soft-tissue masses with calcifications and osteolytic lesions with sclerotic rims are described. These findings also can be interpreted as histiocytosis X, which is a potential differential diagnosis."
    explanation: Identifies histiocytosis X (Langerhans cell histiocytosis) as a key radiological and histological differential diagnosis.
- name: Kosaki Overgrowth Syndrome
  description: >-
    An allelic PDGFRB gain-of-function disorder characterized by somatic overgrowth,
    craniofacial dysmorphism, hyperelastic skin, and white matter lesions that
    overlaps phenotypically with infantile myofibromatosis within the PDGFRB
    activating variant spectrum.
  distinguishing_features:
  - Kosaki overgrowth syndrome is driven by more potent germline activating PDGFRB variants (such as p.Pro584Arg) and features generalized overgrowth and progressive neurological/white matter manifestations.
  - Infantile myofibromatosis predominantly presents in infancy with solitary or multicentric myofibromas and is frequently associated with p.Arg561Cys or somatic PDGFRB mutations.
  disease_term:
    preferred_term: Kosaki overgrowth syndrome
    term:
      id: MONDO:0014704
      label: skeletal overgrowth-craniofacial dysmorphism-hyperelastic skin-white matter lesions syndrome
  evidence:
  - reference: PMID:26455322
    reference_title: "PDGFRB mutants found in patients with familial infantile myofibromatosis or overgrowth syndrome are oncogenic and sensitive to imatinib."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In particular, the germline mutant identified in overgrowth syndrome, P584R, was a stronger oncogene than the germline R561C mutant associated with myofibromatosis. The distinct phenotypes associated with these two mutations could be related to this difference of potency."
    explanation: Explains the molecular and phenotypic distinction between Kosaki overgrowth syndrome and familial infantile myofibromatosis.
  - reference: PMID:32500973
    reference_title: "Activating variants in PDGFRB result in a spectrum of disorders responsive to imatinib monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 50 individuals with activating variants in the receptor tyrosine kinase PDGFRB have been reported, separated based on clinical features into solitary myofibromas, infantile myofibromatosis, Penttinen syndrome with premature aging and osteopenia, Kosaki overgrowth syndrome, and fusiform aneurysms."
    explanation: Places Kosaki overgrowth syndrome in the allelic differential spectrum of activating PDGFRB disorders.
- name: Penttinen Syndrome
  description: >-
    An allelic PDGFRB gain-of-function disorder characterized by premature aging,
    acroosteolysis, osteopenia, and keloid-like or myofibroma-like nodular skin
    lesions that can overlap clinically with infantile myofibromatosis.
  distinguishing_features:
  - Penttinen syndrome is typically caused by specific PDGFRB variants such as p.Val665Ala and features progressive lipoatrophy, acroosteolysis, osteopenia, and premature aging signs.
  disease_term:
    preferred_term: Penttinen syndrome
    term:
      id: MONDO:0011150
      label: acroosteolysis-keloid-like lesions-premature aging syndrome
  evidence:
  - reference: PMID:32500973
    reference_title: "Activating variants in PDGFRB result in a spectrum of disorders responsive to imatinib monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 50 individuals with activating variants in the receptor tyrosine kinase PDGFRB have been reported, separated based on clinical features into solitary myofibromas, infantile myofibromatosis, Penttinen syndrome with premature aging and osteopenia, Kosaki overgrowth syndrome, and fusiform aneurysms."
    explanation: Identifies Penttinen syndrome as an overlapping allelic disorder in the PDGFRB activating variant spectrum.
- name: Glomus Tumor
  description: >-
    A perivascular smooth muscle neoplasm that shares morphologic overlap with
    myofibroma and myofibromatosis within the pericytic tumor family.
  distinguishing_features:
  - Glomus tumors frequently harbor MIR143-NOTCH1/2/3 gene fusions rather than activating point mutations in PDGFRB.
  disease_term:
    preferred_term: glomus tumor
    term:
      id: MONDO:0018327
      label: glomus tumor
  evidence:
  - reference: PMID:23999936
    reference_title: "Novel MIR143-NOTCH fusions in benign and malignant glomus tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glomus tumors (GT) have been classified among tumors of perivascular smooth muscle differentiation, together with myopericytoma, myofibroma/tosis, and angioleiomyoma, based on their morphologic overlap."
    explanation: Documents morphologic overlap between glomus tumors and myofibroma/myofibromatosis among perivascular smooth muscle neoplasms.
treatments:
- name: Imatinib
  description: >-
    Tyrosine kinase inhibitor targeting PDGFRB. Constitutively active PDGFRB mutant
    receptors (except p.Asp850Val) are sensitive to imatinib at clinically relevant
    concentrations, producing rapid clinical responses in infants with multicentric
    myofibromatosis.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  target_mechanisms:
  - target: Constitutive PDGFRB Signaling
    treatment_effect: INHIBITS
    description: Directly inhibits constitutively active PDGFRB receptor tyrosine kinase mutants.
    evidence:
    - reference: PMID:31017643
      reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All of the PDGFRB mutations were associated with ligand-independent receptor activation, and all but one were sensitive to imatinib at clinically relevant concentrations."
      explanation: Confirms direct inhibition of ligand-independent PDGFRB mutant receptors by imatinib.
  target_phenotypes:
  - preferred_term: Myofibromatosis
    term:
      id: HP:0020135
      label: Myofibromatosis
  - preferred_term: Subcutaneous nodule
    term:
      id: HP:0001482
      label: Subcutaneous nodule
  evidence:
  - reference: PMID:31017643
    reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All of the PDGFRB mutations were associated with ligand-independent receptor activation, and all but one were sensitive to imatinib at clinically relevant concentrations."
    explanation: Demonstrates sensitivity of PDGFRB mutants to imatinib in functional assays.
  - reference: PMID:32500973
    reference_title: "Activating variants in PDGFRB result in a spectrum of disorders responsive to imatinib monotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients were treated with imatinib and had robust and rapid response, including the first two reported infants with multicentric myofibromas treated with imatinib monotherapy"
    explanation: Clinical evidence of rapid response to imatinib monotherapy in infants with multicentric myofibromas.
- name: Dasatinib and Ponatinib
  description: >-
    Second- and third-generation tyrosine kinase inhibitors that inhibit PDGFRB
    gain-of-function mutants including the kinase-domain p.Asp850Val (D850V) mutant
    that is resistant to imatinib.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: dasatinib
      term:
        id: CHEBI:49375
        label: dasatinib (anhydrous)
    - preferred_term: ponatinib
      term:
        id: CHEBI:78543
        label: ponatinib
  target_mechanisms:
  - target: Constitutive PDGFRB Signaling
    treatment_effect: INHIBITS
    description: Inhibits constitutively active PDGFRB mutants including the imatinib-resistant D850V variant.
    evidence:
    - reference: PMID:28334876
      reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, the mutant receptors were sensitive to the tyrosine kinase inhibitor imatinib, except D850V, which was inhibited by dasatinib and ponatinib, suggesting a targeted therapy for severe myofibromatosis."
      explanation: Demonstrates inhibition of the imatinib-resistant D850V PDGFRB mutant by dasatinib and ponatinib.
  target_phenotypes:

pathophysiology:
- name: Constitutive PDGFRB Signaling
  description: >-
    Gain-of-function mutations in the transmembrane, juxtamembrane, and kinase
    domains of PDGFRB—or increased PDGFRB expression driven by hyperactive NOTCH3
    signaling—lead to ligand-independent or enhanced receptor tyrosine kinase
    activation, transforming fibroblasts and promoting perivascular mesenchymal cell
    growth (both fibroblast and pericyte are bound in cell_types because the tumor
    cell of origin spans the perivascular pericyte-to-myofibroblast lineage
    continuum). In sporadic disease, activating PDGFRB mutations frequently arise as
    post-zygotic somatic mosaic events, reminiscent of multifocal venous
    malformations induced by TIE2 mutations.
  genes:
  - preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  genetic_context:
    gene:
      preferred_term: PDGFRB
      term:
        id: hgnc:8804
        label: PDGFRB
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Somatic or post-zygotic mosaic activating mutations in PDGFRB (or somatic
      second-hit activating mutations in familial disease) drive constitutive
      ligand-independent receptor tyrosine kinase signaling in perivascular
      myofibroblastic precursors.

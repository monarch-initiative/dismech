genetic:
- name: PDGFRB Gain-of-Function Mutations
  gene_term:
    preferred_term: PDGFRB
    term:
      id: hgnc:8804
      label: PDGFRB
  association: Causative
  features: >-
    Heterozygous germline and/or somatic gain-of-function mutations in PDGFRB
    (such as p.Arg561Cys, p.Asn666Lys, and p.Asp850Val) across the transmembrane,
    juxtamembrane, and kinase domains cause constitutive receptor activation in the
    absence of ligand. Familial cases frequently follow a two-hit model combining a
    weakly activating germline variant with a stronger somatic second hit in tumor
    tissue.
  case_fractions:
  - population: Pediatric sporadic multicentric infantile myofibromatosis cohort
    case_fraction_percent: 68.4
    cohort_size: 19
    notes: 13 of 19 pediatric multicentric myofibromatosis cases carried gain-of-function PDGFRB mutations.
    evidence:
    - reference: PMID:31017643
      reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations were particularly associated with severe multicentric disease (13 of 19 myofibromatosis cases [68%])."
      explanation: Quantifies the PDGFRB mutation fraction (13/19, 68%) in pediatric multicentric infantile myofibromatosis.
  - population: Sporadic multicentric infantile myofibromatosis sequencing series
    case_fraction_percent: 75.0
    cohort_size: 8
    notes: 6 of 8 patients with sporadic multicentric infantile myofibromatosis harbored coding PDGFRB mutations.
    evidence:
    - reference: PMID:28334876
      reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in the coding sequence of PDGFRB were identified in 6 out of 8 patients with the sporadic multicentric form of the disease and in 1 out of 8 patients with isolated myofibroma."
      explanation: Documents PDGFRB coding mutations in 6 of 8 (75%) sporadic multicentric cases.
  evidence:
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the coding sequence of PDGFRB were identified in 6 out of 8 patients with the sporadic multicentric form of the disease and in 1 out of 8 patients with isolated myofibroma."
    explanation: Demonstrates high frequency of PDGFRB mutations in sporadic multicentric myofibromatosis.
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one case, a weakly-activating germline variant was associated with a stronger somatic mutation, suggesting a two-hit model for familial myofibromatosis."
    explanation: Supports the two-hit germline plus somatic mutation mechanism in familial myofibromatosis.
  - reference: PMID:31017643
    reference_title: "Association of PDGFRB Mutations With Pediatric Myofibroma and Myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gain-of-function PDGFRB mutations were found in samples from 25 children, with no mutation found in samples from adults."
    explanation: Largest cohort study confirming PDGFRB mutations in pediatric myofibromatosis.
  - reference: PMID:23731537
    reference_title: "A recurrent PDGFRB mutation causes familial infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a germline mutation c.1681C>T (p.Arg561Cys) in platelet-derived growth factor receptor β (PDGFRB) in all 11 affected individuals with familial IM, although none of the five individuals with nonfamilial IM had mutations in this gene."
    explanation: Identifies the recurrent germline p.Arg561Cys PDGFRB mutation in familial infantile myofibromatosis.
- name: NOTCH3 Perivascular Signaling Alterations
  gene_term:
    preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  association: Candidate
  features: >-
    A subset of familial infantile myofibromatosis cases has been linked to genes
    beyond PDGFRB, and NOTCH3 regulates vascular smooth muscle development across
    the morphologic spectrum of perivascular smooth muscle neoplasms that includes
    myofibroma and myofibromatosis.
  evidence:
  - reference: PMID:28334876
    reference_title: "PDGFRB gain-of-function mutations in sporadic infantile myofibromatosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A few familial cases have been linked to mutations in various genes including PDGFRB."
    explanation: Notes that familial infantile myofibromatosis is genetically heterogeneous and linked to additional genes beyond PDGFRB.
  - reference: PMID:23999936
    reference_title: "Novel MIR143-NOTCH fusions in benign and malignant glomus tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As NOTCH3 shares similar functions with NOTCH2 in regulating vascular smooth muscle development, the study group was also investigated for abnormalities in this gene by FISH."
    explanation: Highlights the role of NOTCH3 in vascular smooth muscle development across the perivascular tumor group that includes myofibromatosis.

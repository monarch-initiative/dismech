    Gain-of-function mutations in the transmembrane, juxtamembrane, and kinase
    domains of PDGFRB lead to ligand-independent receptor tyrosine kinase
    activation, transforming fibroblasts and promoting perivascular mesenchymal cell
    growth. The mechanism is reminiscent of multifocal venous malformations induced
    by TIE2 mutations.

- name: Activating NOTCH3 Signaling in Perivascular Myofibroblastic Precursors
  description: >-
    In infantile myofibromatosis 2, the NOTCH3 p.Leu1519Pro (L1519P) variant in the
    negative regulatory region disrupts normal cell-surface localization, causing
    mutant receptor accumulation in the endoplasmic reticulum, enhanced S1/S2/S3
    proteolytic processing, and hyperactivated ligand-independent Notch3 canonical
    signaling. Hyperactive NOTCH3(L1519P) signaling directly upregulates PDGFRB
    expression in fibroblasts, functionally linking NOTCH3 gain of function to the
    PDGFRB signaling axis in infantile myofibromatosis.

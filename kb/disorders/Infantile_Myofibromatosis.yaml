description: >-
  Infantile myofibromatosis is one of the most prevalent soft tissue tumors of
  infancy and childhood, characterized by benign myofibroblastic and perivascular
  mesenchymal tumors arising in skin, subcutis, muscle, bone, and viscera. The
  familial form (type 1) and a majority of sporadic multicentric cases are caused by
  gain-of-function mutations in PDGFRB encoding platelet-derived growth factor
  receptor beta, arising either as autosomal dominant germline variants with
  variable expressivity (often following a two-hit model
  pairing a weakly activating germline variant with a somatic second hit) or as
  somatic/mosaic post-zygotic mutations, while familial infantile myofibromatosis
  type 2 is caused by a heterozygous activating NOTCH3 p.Leu1519Pro mutation that
  drives ligand-independent Notch signaling and upregulates PDGFRB expression.
  Solitary and non-visceral bony or soft-tissue lesions frequently regress
  spontaneously, whereas multifocal nodules with visceral involvement (cardiac,
  gastrointestinal, or central nervous system) carry a poor prognosis.
  Constitutively active PDGFRB mutants are sensitive to tyrosine kinase inhibitors
  such as imatinib (or dasatinib and ponatinib for the imatinib-resistant
  p.Asp850Val variant), and severe multicentric visceral disease also responds to
  low-dose methotrexate and vinblastine chemotherapy. Hereditary progressive
  mucinous histiocytosis, a very rare PDGFRB-associated condition with limited
  phenotypic data (single G2P phenotype), is considered part of the broader PDGFRB
  gain-of-function spectrum and is noted here rather than given a separate entry.

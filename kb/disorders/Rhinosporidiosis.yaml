name: Rhinosporidiosis
creation_date: '2026-11-14T09:18:58Z'
synonyms:
- rhinosporidium infection
category: Infectious Disease
description: >-
  Rhinosporidiosis is a chronic granulomatous mucosal infection caused by the
  aquatic protistan parasite Rhinosporidium seeberi, an ichthyosporean
  Mesomycetozoea organism formerly mistaken for a fungus. Its environmental
  source and definitive host are unresolved, but human cases are repeatedly
  linked to bathing or swimming in stagnant freshwater ponds, lakes, and rivers.
  In human tissue, released endospores develop into trophocytes and large
  endosporulating sporangia; mucosal sporangia with endospores drive localized
  polypoid granulomatous masses, most often in the nasal cavity or nasopharynx
  and less often in the conjunctiva or other mucosal sites. Nasal lesions
  produce a painless friable vascular polypoid mass, epistaxis, and obstructive
  symptoms; diagnosis is confirmed by histopathologic detection of characteristic
  sporangia and endospores, and treatment centers on complete surgical excision
  with cautery or coblation plus adjunctive postoperative dapsone in some cases
  to reduce recurrence.
disease_term:
  preferred_term: rhinosporidiosis
  term:
    id: MONDO:0005946
    label: rhinosporidiosis
parents:
- parasitic Ichthyosporea infectious disease
infectious_agent:
- name: Rhinosporidium seeberi
  infectious_agent_term:
    preferred_term: Rhinosporidium seeberi
    term:
      id: NCBITaxon:90339
      label: Rhinosporidium seeberi
  description: >-
    Hydrophilic, uncultivated ichthyosporean parasite in the Mesomycetozoea
    clade. R. seeberi was historically classified among protozoa and fungi, but
    18S small-subunit rDNA phylogeny placed it among aquatic protistan
    parasites rather than conventional fungal pathogens.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      R. seeberi has been considered to be a protozoan and a fungus and most
      recently has been placed in a novel clade of aquatic protistan parasites,
      the Mezomycetozoa
    explanation: >-
      The medical-mycology review explains the unusual taxonomy and supports
      retaining R. seeberi as an aquatic protistan parasite rather than forcing
      the disease into conventional fungal or protozoal categories.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      currently, it is classified as a parasitic protist of the eukaryotic
      group Mesomycetozoea—fungus-like thorough molecular technology
    explanation: >-
      A recent clinical review also describes the agent as a Mesomycetozoea
      parasitic protist.
agent_life_cycle:
  description: >-
    The environmental maintenance cycle of R. seeberi is not fully defined.
    Human disease is linked to aquatic exposure and thought to begin when free
    endospores reach susceptible, previously injured mucosal epithelium. In
    tissue, mature sporangia release endospores at the epithelial surface; those
    endospores activate locally and develop into trophocytes and then new
    sporangia, sustaining a local mucosal infection. Humans are incidental hosts
    rather than a source of documented cross-infection.
  hosts:
  - preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental host
    description: >-
      Humans develop localized or rarely disseminated mucosal disease, but
      person-to-person cross-infection has not been documented and no productive
      environmental cycle in humans is known.
  life_cycle_stages:
  - name: Free endospore at susceptible mucosal epithelium
    description: >-
      The presumed infectious form is an endospore released from a mature
      sporangium that reaches susceptible nasal or other mucosal epithelium,
      plausibly after aquatic exposure and microtrauma.
    evidence:
    - reference: PMID:33289469
      reference_title: "Case Report: Rhinosporidiosis Literature Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The presumed mode of infection of R. seeberi is through the epithelium
        (“transepithelial infection”) most commonly found in nasal sites; it is
        accepted that the infectious forms probably corresponds to the free
        endospores released to a previously injured epithelium.
      explanation: >-
        The review summarizes the still-presumptive endospore inoculation route.
  - name: Trophocyte and mature sporangium in tissue
    description: >-
      Liberated endospores develop into trophocytes. Trophocytes mature into
      large endosporulating sporangia with a zonal arrangement of immature,
      maturing, and mature sporangiospores; rupture at the epithelial surface
      releases additional endospores into adjacent tissue.
    evidence:
    - reference: PMID:15814958
      reference_title: Unusual fungal and pseudofungal infections of humans.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Two developmental forms of R. seeberi are seen in tissue (Table 1): the
        large endosporulating spherical form, or sporangia, and the smaller
        trophocyte (103).
      explanation: >-
        The review identifies trophocytes and mature sporangia as the tissue
        forms of R. seeberi.
    - reference: PMID:15814958
      reference_title: Unusual fungal and pseudofungal infections of humans.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Within the sporangium are numerous endospores (sporangiospores)
        arranged in a characteristic zonal formation
      explanation: >-
        Supports the distinctive internal endospore organization used to
        recognize mature sporangia histologically.
  evidence:
  - reference: PMID:33269573
    reference_title: "Rhinosporidium seeberi: Is It a Fungi or Parasite?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Considering that rhinosporidiosis is associated with exposure to water and
      the agent belongs to a branch of aquatic parasites, it has been proposed
      that aquatic animals are the natural hosts and that the mammalian hosts
      acquire infection by contacting contaminated water.
    explanation: >-
      This review supports aquatic exposure and a suspected nonhuman aquatic
      reservoir while noting that the reservoir hypothesis still requires study.
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The natural habitat and extent of distribution of R. seeberi is unknown,
      although studies have linked infection to swimming or bathing in
      freshwater ponds, lakes, or rivers (45).
    explanation: >-
      Supports recording freshwater exposure without asserting a resolved
      definitive host or natural habitat.
transmission:
- name: Freshwater-associated endospore exposure
  description: >-
    Infection is associated with bathing, swimming, or similar contact with
    stagnant freshwater ponds, lakes, and rivers; free endospores are presumed
    to inoculate injured nasal or other mucosal epithelium during that exposure.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      studies have linked infection to swimming or bathing in freshwater ponds,
      lakes, or rivers (45).
    explanation: >-
      Supports stagnant or fresh-water contact as the characteristic exposure
      pattern.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Presumably, the contact with the free spore in aquatic or marshy
      environments in susceptible human and animal hosts could be an
      explanation15
    explanation: >-
      The review frames aquatic free-spore contact as the leading explanation
      while preserving uncertainty in the exact route.
- name: No documented cross-infection
  description: >-
    Rhinosporidiosis is not documented to spread directly between people or from
    an infected animal to a person; cases are interpreted as environmental
    acquisitions or as local autoinoculation after surgical or traumatic
    endospore spillage.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There is no evidence that rhinosporidiosis is contagious.
    explanation: >-
      Supports excluding a person-to-person transmission route.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      cross-infection has never been documented between members of the same
      family or between animals and humans.
    explanation: >-
      Supports modeling humans as environmentally infected incidental hosts
      rather than an onward-transmitting host population.
epidemiology:
- name: Tropical and freshwater exposure setting
  description: >-
    Endemic disease is concentrated in tropical and subtropical regions,
    especially India and Sri Lanka, and is enriched among people with repeated
    freshwater contact through farming, fishing, sand work, or paddy
    cultivation.
  factors:
  - stagnant freshwater ponds
  - freshwater bathing
  - farming
  - fishing
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Approximately 90% of all known cases of rhinosporidiosis occur in India
      and Sri Lanka, where the prevalence is estimated at 1.4% (61).
    explanation: >-
      Supports India and Sri Lanka as the main endemic region in the historical
      case distribution.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it affects people of all ages, usually between 15 and 40 years;
      frequently involved in farming or fishing activities; sand workers; and
      paddy cultivators.
    explanation: >-
      Supports the age range and repeated freshwater or soil contact
      occupations common in reported endemic cases.
progression:
- phase: Localized mucosal disease
  notes: >-
    Most infections remain localized as slowly enlarging nasal, nasopharyngeal,
    conjunctival, or other mucosal polypoid masses.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rhinosporidiosis occurs primarily in young men, 20 to 40 years old, and
      manifests as slow-growing polypoid or tumor-like masses, usually of the
      nasal mucosa or conjunctiva (52).
    explanation: >-
      Supports a localized nasal or conjunctival polypoid phase as the dominant
      clinical presentation.
- phase: Rare cutaneous or disseminated disease
  notes: >-
    A minority of infections extend beyond the primary nasal focus, with
    distant skin lesions or rarely disseminated involvement of limbs, trunk,
    internal organs, or brain.
  evidence:
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As a result of hematologic or lymphatic dissemination, autoinoculation,
      or direct inoculation, skin lesions distant from the inoculation site
      (nose) may appear.
    explanation: >-
      Supports distant cutaneous lesions as a post-inoculation presentation.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The presence of a disseminated disease with simultaneous involvement of
      the limbs, trunk, and internal organs, even the brain, is rarely
      encountered in persons without preexisting immunocompromised conditions.
    explanation: >-
      Supports rare multisite disseminated rhinosporidiosis and its potential
      internal-organ or CNS involvement.
pathophysiology:
- name: Freshwater Endospore Mucosal Inoculation
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Susceptible humans probably acquire infection when R. seeberi endospores
    from aquatic or marshy environments contact nasal or other mucosal
    epithelium, especially after local epithelial injury.
  locations:
  - preferred_term: nasal cavity mucosa
    term:
      id: UBERON:0001826
      label: nasal cavity mucosa
  downstream:
  - target: Mucosal Trophocyte and Sporangium Development
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The presumed mode of infection of R. seeberi is through the epithelium
      (“transepithelial infection”) most commonly found in nasal sites
    explanation: >-
      Supports mucosal epithelial entry as the initiating event while keeping it
      explicitly presumptive.
- name: Mucosal Trophocyte and Sporangium Development
  biological_scale: TISSUE
  description: >-
    Endospores in mucosal tissue activate and mature through trophocyte forms
    into large sporangia packed with endospores at multiple developmental
    stages.
  locations:
  - preferred_term: nasal cavity mucosa
    term:
      id: UBERON:0001826
      label: nasal cavity mucosa
  - preferred_term: nasopharynx
    term:
      id: UBERON:0001728
      label: nasopharynx
  - preferred_term: conjunctiva
    term:
      id: UBERON:0001811
      label: conjunctiva
  downstream:
  - target: Endospore Release and Local Persistence
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The mature form of the microorganism known as sporangia contains multiple
      sporangiospores or endospores; when rupture of this structure occurs in
      the epithelial surface, the endospores are released and activated in
      contact with tissues
    explanation: >-
      Supports activation of released endospores in tissue and maturation to
      endospore-containing sporangia at mucosal surfaces.
- name: Endospore Release and Local Persistence
  biological_scale: TISSUE
  description: >-
    Mature sporangia rupture at the epithelial surface and release thousands of
    sporangiospores, which can seed adjacent mucosa and help explain local
    persistence or recurrence after incomplete removal.
  downstream:
  - target: Chronic Granulomatous Polypoid Inflammation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      continue with the persistence of local invasion and subsequent maturation
      into trophocytes (early and late), and the cycle begin again.
    explanation: >-
      Supports a local tissue cycle in which released endospores mature and
      continue the infection.
- name: Chronic Granulomatous Polypoid Inflammation
  biological_scale: TISSUE
  description: >-
    Sporangia embedded in mucosal tissue provoke chronic inflammatory and
    granulomatous tissue expansion, yielding friable hyperplastic polyps with
    neutrophils, lymphocytes, plasma cells, fibroblasts, and blood vessels.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: chronic inflammatory response
    term:
      id: GO:0002544
      label: chronic inflammatory response
    modifier: INCREASED
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
    modifier: INCREASED
  downstream:
  - target: Nasal Polypoid Mass
    causal_link_type: DIRECT
  - target: Nasal Obstruction
    causal_link_type: DIRECT
  - target: Epistaxis
    causal_link_type: DIRECT
  - target: Abnormal Conjunctiva Morphology
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rhinosporidiosis is a granulomatous disease of humans and animals that is
      characterized by the development of mucosal polyps that primarily affect
      the nasopharynx and ocular conjunctiva of infected individuals
    explanation: >-
      Supports granulomatous mucosal polyp formation as the conserved tissue
      process behind nasopharyngeal and conjunctival disease.
  - reference: PMID:35180588
    reference_title: "A new technique to resolve Nasal Rhinosporidiosis: A case report with review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hyperplastic squamous epithelium and oedematous fibro-connective tissue
      with many globular cysts, fibroblasts, and inflammatory cells such as
      neutrophils, lymphocytes, and plasma cells are found on histopathological
      examination.
    explanation: >-
      Supports neutrophils, lymphocytes, plasma cells, and fibroblasts as
      histologic constituents of rhinosporidial inflammatory polyps.
histopathology:
- name: Endosporulating Sporangia in Inflamed Mucosa
  description: >-
    Resected mucosal polyps show thick-walled sporangia at multiple stages of
    maturation, numerous endospores, and surrounding chronic inflammatory
    infiltrates; the pathognomonic zonal arrangement of sporangiospores helps
    distinguish R. seeberi from other large spherules in tissue.
  evidence:
  - reference: PMID:35180588
    reference_title: "A new technique to resolve Nasal Rhinosporidiosis: A case report with review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Each cyst contained a large number of thick-walled pathognomonic
      sporangia, which contained a large number of endospores at various stages
      of development.
    explanation: >-
      A nasal case confirmed by excision and histopathology showed thick-walled
      sporangia and endospores in different developmental stages.
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This zonal arrangement of immature, maturing, and fully mature
      sporangiospores within the sporangium is pathognomonic of R. seeberi
    explanation: >-
      The review identifies the sporangial zonation pattern as pathognomonic
      for R. seeberi in tissue.
phenotypes:
- name: Nasal Polypoid Mass
  description: >-
    Nasal rhinosporidiosis usually presents as a slow-growing, friable,
    reddish, unilateral polypoid mass in the nasal cavity or nasopharynx.
  evidence:
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The main characteristic of the disease is the occurrence of a polypoidal,
      reddish, friable, painless, pedunculated, hyperplastic soft tissue mass in
      the nasal area
    explanation: >-
      Supports a polypoid nasal mass as the typical nasal presentation.
- name: Nasal Obstruction
  phenotype_term:
    preferred_term: nasal obstruction
    term:
      id: HP:0001742
      label: Nasal congestion
  description: >-
    Slow enlargement of nasal or nasopharyngeal polypoid lesions commonly
    obstructs nasal airflow.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In most patients the disease remains localized, and symptoms are
      primarily nasal obstruction and epistaxis
    explanation: >-
      The review identifies nasal obstruction as a primary symptom in localized
      rhinosporidiosis.
  - reference: PMID:38440563
    reference_title: "Management of Rhinosporidiosis: by Coblation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Epistaxis and nasal obstruction are the most common findings. It may be
      unilateral or bilateral. The enlargement of these lesions occurs slowly
      over months or years.
    explanation: >-
      A coblation case-series report also describes nasal obstruction as one of
      the most common slowly enlarging lesion findings.
- name: Epistaxis
  phenotype_term:
    preferred_term: epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
  description: >-
    Friable vascular nasal lesions bleed easily and commonly manifest with
    epistaxis.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In most patients the disease remains localized, and symptoms are
      primarily nasal obstruction and epistaxis
    explanation: >-
      The review identifies epistaxis and nasal obstruction as the main
      symptoms of localized disease.
- name: Abnormal Conjunctiva Morphology
  phenotype_term:
    preferred_term: ocular conjunctival polypoid lesion
    term:
      id: HP:0000502
      label: Abnormal conjunctiva morphology
  description: >-
    Oculosporidiosis commonly involves the conjunctiva or lacrimal sac and
    accounts for a smaller but recurring subset of rhinosporidiosis.
  evidence:
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ocular lesions, particularly of conjunctiva and lachrymal sac, account for
      15% cases.
    explanation: >-
      Supports conjunctival and lacrimal involvement as the main ocular
      manifestation.
diagnosis:
- name: Histopathologic examination of resected tissue
  diagnosis_term:
    preferred_term: Histopathologic Examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  description: >-
    The definitive test is histopathologic examination of excised tissue showing
    diagnostic trophocytes and endosporulating sporangia in routine
    hematoxylin-and-eosin sections, with PAS, GMS, and mucicarmine stains able
    to highlight organism walls.
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rhinosporidiosis is diagnosed by histopathologic examination of the
      affected tissue. The distinctive appearance of the trophocytes and
      sporangia in routine H&E-stained sections is diagnostic
    explanation: >-
      Establishes histopathology as the definitive method and names the
      diagnostic organism forms.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: the definitive diagnosis is made by histopathology of the resected tissue
    explanation: >-
      A later review also identifies resected-tissue histopathology as the
      definitive diagnostic method.
treatments:
- name: Complete Excision with Base Cautery or Coblation
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: excision with cautery or coblation
    term:
      id: NCIT:C15232
      label: Excision
  description: >-
    Treatment centers on complete excision of visible lesions with cauterizing
    or coblation of the attachment base to remove sporangia and limit local
    seeding.
  target_mechanisms:
  - target: Endospore Release and Local Persistence
  - target: Chronic Granulomatous Polypoid Inflammation
  evidence:
  - reference: PMID:15814958
    reference_title: Unusual fungal and pseudofungal infections of humans.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The only effective treatment for rhinosporidiosis is surgical excision of
      the lesions. Recurrences are common
    explanation: >-
      Supports surgical excision as the core treatment and recurrence as a
      frequent post-excision problem.
  - reference: PMID:33269573
    reference_title: "Rhinosporidium seeberi: Is It a Fungi or Parasite?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      First line treatment is total surgical excision and electro-cauterization
      of polyp base. However, recurrens of the lesions are reported
    explanation: >-
      Supports total excision and cauterization of the polyp base as first-line
      therapy.
- name: Adjunct Dapsone
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dapsone
      term:
        id: CHEBI:4325
        label: dapsone
  description: >-
    Prolonged postoperative dapsone is used by some clinicians as an adjunct to
    inhibit sporangial maturation and promote stromal fibrosis, although
    clinical evidence for its use remains limited and inconsistent.
  target_mechanisms:
  - target: Mucosal Trophocyte and Sporangium Development
  evidence:
  - reference: PMID:35180588
    reference_title: "A new technique to resolve Nasal Rhinosporidiosis: A case report with review of literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The mode of action of Dapsone is to prevent the maturation of the
      sporangia and promote fibrosis in the stroma
    explanation: >-
      Identifies the proposed dapsone target as sporangial maturation and the
      host stromal response.
  - reference: PMID:33289469
    reference_title: "Case Report: Rhinosporidiosis Literature Review."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: still without sufficient evidence to support its use
    explanation: >-
      Caveats the dapsone mechanism and records that the clinical evidence base
      remains insufficient despite reported in vitro and variable in vivo
      responses.

mechanistic_hypotheses:
- hypothesis_group_id: raf1_mapk_brake_model
  hypothesis_label: c-Raf-1 Ser43 MAPK-Brake Model
  status: CANONICAL
  description: >-
    cGKII restrains the FGF-driven MAPK cascade in growth-plate chondrocytes by
    phosphorylating c-Raf-1 at Ser43, and pathogenic alleles lose that
    phosphorylation and with it the regulation it provides. The model is about
    the missing brake; it does not by itself specify how far ERK1/2 output moves
    in a growth plate. This is the canonical model for AMDP because it
    is the readout against which every human PRKG2 allele has been assayed:
    the founding nonsense and frameshift alleles, the p.Asp761Glufs*34 allele
    from an independent family, and the first missense allele p.Val470Gly all
    fail the same Raf-1/ERK test. It also connects AMDP to the wider growth-plate
    literature, where excess FGFR3-MAPK signalling is the established cause of
    achondroplasia and where CNP-cGMP is the physiological counterweight.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      alter the downstream mitogen activation protein kinase signalling pathway
      by failing to phosphorylate c-Raf 1 at Ser43 and subsequently reduce
      ERK1/2 activation in response to fibroblast growth factor 2
    explanation: The founding human study establishes the Raf-1/ERK readout for AMDP alleles.
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      functional studies of the novel missense variant, p.Val470Gly, revealed
      that it was unable to down-regulate FGF2-induced MAPK signaling and, thus,
      would be predicted to cause growth delay
    explanation: >-
      An independent allele class reproduces the same failure, which is what
      makes this the canonical model. This is also the one source that states
      the direction unambiguously - the mutant is unable to down-regulate MAPK
      signalling - where the other two abstracts phrase it in a way that reads
      both ways.
- hypothesis_group_id: sox9_nuclear_exclusion_switch
  hypothesis_label: SOX9 Nuclear-Exclusion Switch Model
  status: ALTERNATIVE
  description: >-
    cGKII acts as the switch that ends proliferation and starts hypertrophic
    differentiation by excluding SOX9 from the chondrocyte nucleus; without it,
    SOX9 persists and cells accumulate in a postmitotic but non-hypertrophic
    state. The model rests on the cGKII-deficient KMI rat, where SOX9 knockdown
    rescues the differentiation block, and it is attractive for AMDP because it
    predicts exactly the collagen shift measured in the human alleles: SOX9
    drives COL2A1 and represses COL10A1, and the human mutants upregulate COL2A1
    while downregulating COL10A1. It is curated as ALTERNATIVE rather than
    canonical because no human AMDP allele has been tested for SOX9
    localisation.
  evidence:
  - reference: PMID:15466490
    reference_title: Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation of chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a novel role of cGKII as a molecular switch, coupling the cessation of
      proliferation and the start of hypertrophic differentiation of
      chondrocytes through attenuation of Sox9 function
    explanation: States the model in full, in the naturally occurring rat cGKII mutant.
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: They also downregulate COL10A1 and upregulate COL2A1 expression through SOX9.
    explanation: >-
      The human alleles produce a SOX9-dependent collagen shift in the direction
      this model predicts, which is suggestive but does not localise SOX9.
- hypothesis_group_id: gsk3b_beta_catenin_route
  hypothesis_label: GSK-3beta / beta-Catenin Hypertrophy Route
  status: ALTERNATIVE
  description: >-
    cGKII phosphorylates and inactivates GSK-3beta, sparing beta-catenin and
    permitting the canonical Wnt output that drives chondrocyte hypertrophy.
    This is the only one of the three models tested by genetic epistasis in a
    mammal: removing one Gsk3b allele partially rescues the Prkg2-null growth
    plate. The rescue is partial, which is itself the argument that GSK-3beta is
    one route rather than the whole mechanism, and no human AMDP data address
    it.
  evidence:
  - reference: PMID:18551195
    reference_title: Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation of murine chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data indicate that hypertrophic differentiation of growth plate
      chondrocytes during skeletal growth is promoted by phosphorylation and
      inactivation of GSK-3beta by cGKII.
    explanation: States the model's central claim.
  - reference: PMID:18551195
    reference_title: Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation of murine chondrocytes.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      were partially rescued by haploinsufficiency of Gsk3b
    explanation: >-
      The rescue is explicitly partial, which is why this is curated as one
      contributing route rather than as the canonical mechanism.
  notes: >-
    The three groups are not mutually exclusive. A single kinase with several
    substrates can act through all of them at once, and the growth-plate
    phenotypes they predict overlap. What separates them for curation purposes
    is which has been tested in human AMDP alleles, which is only the first.

- name: Reduced cGKII Protein Abundance
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    Transient HEK293T expression yielded markedly reduced abundance of R569*, D761Efs*34 and V470G proteins
    relative to wild type. This is neither a direct protein-stability assay nor evidence that all patient tissues
    lack protein. The V470G paper reports slightly different reduction thresholds in its figure legend and
    results; no single precise percentage is assigned here.
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: For both variants, cGKII was detected at the predicted size

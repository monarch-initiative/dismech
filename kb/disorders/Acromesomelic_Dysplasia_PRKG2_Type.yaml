parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 16 "Acromesomelic dysplasias"; listed as the
      PRKG2-linked acromesomelic dysplasia type (OMIM 619636). This entity was
      first reported in 2020 and so appears in the 2023 revision but not in the
      2019 revision (PMID:31633310), which is why no 2019 group is recorded here.
    evidence:
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To date, four disease genes and seven distinct ACD subtypes with varying
        severity are recognised according to the 2023 revision of the nosology
        and classification of genetic skeletal disorders
      explanation: >-
        This is the sentence that ties the enumeration below to the 2023 ISDS
        nosology revision. It is quoted separately because the enumeration
        itself names diseases and OMIM numbers without repeating the nosology
        attribution, so on its own it would not support a group assignment.
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The remaining three ACD types encompass NPR2-linked Maroteaux type (OMIM
        #602875), the PRKG2-linked ACD type (OMIM #619636) and Osebold-Remondini
        type, which is not yet associated with a genomic locus (OMIM #112910).
      explanation: >-
        A 2024 report enumerating the seven acromesomelic chondrodysplasia types
        recognised by the 2023 nosology revision places the PRKG2-linked type
        inside that group.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. As of the 2024 mutational review only
    a handful of families had been reported, and the entity is described in the
    literature as extremely rare.
  evidence:
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, PRKG2 type (AMDP, MIM 619636), is an extremely
      rare autosomal recessive skeletal dysplasia characterized by severe
      disproportionate short stature presenting with acromesomelia, mild
      metaphyseal widening of the long bones and mild spondylar dysplasia.
    explanation: The mutational review characterises AMDP as extremely rare.
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only four variants have been reported; one nonsense, one
      splice-site, and two frameshifts in five AMDP families.
    explanation: Quantifies the published case count behind the ultra-rare classification.
progression:
- phase: Childhood
  age_range: Early childhood onward
  notes: >-
    Metaphyseal alteration of the long bones is described as progressively
    increasing rather than static, so a normal or near-normal early radiograph
    does not exclude the diagnosis.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing was performed in two girls with severe short stature due
      to acromesomelic limb shortening, brachydactyly, mild to moderate
      platyspondyly and progressively increasing metaphyseal alterations of the
      long bones.
    explanation: The founding series describes the metaphyseal changes as progressive.
- phase: Childhood to adulthood
  age_range: Age 5 to 20 years
  notes: >-
    Longitudinal follow-up of one sibling pair shows short stature worsening
    with age while the vertebral findings become less conspicuous, so spinal
    radiographs taken in adolescence may under-represent the earlier phenotype.
  evidence:
  - reference: PMID:36504352
    reference_title: Natural history of clinical features in two brothers with acromesomelic dysplasia related to PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annual follow-ups of the older brother from the age of 5 to 20 years
      revealed progression of short stature with age but platyspondyly and
      anterior beaking became less conspicuous.
    explanation: The natural-history report documents divergent trajectories for stature and spinal findings.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    AMDP results from biallelic PRKG2 loss of function. Reported families are
    consanguineous with homozygous variants, and heterozygous parents and
    siblings are unaffected.
  evidence:
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, PRKG2 type (AMDP, MIM 619636), is an extremely
      rare autosomal recessive skeletal dysplasia
    explanation: States the recessive mode of inheritance for the entity.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      four individuals from two independent families were identified harbouring
      homozygous frameshift or stop-gain variants in PRKG2
    explanation: Independent families carry homozygous biallelic variants, consistent with recessive inheritance.
  - reference: PMID:41574272
    reference_title: "Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype of acromesomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two novel compound-heterozygous variants in the PRKG2 gene
    explanation: >-
      Compound heterozygosity outside a consanguineous setting confirms that two
      damaged alleles, not homozygosity as such, are what is required.
genetic:
- name: Biallelic PRKG2 Loss-of-Function Variants
  gene_term:
    preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported causative alleles include nonsense, frameshift, splice-site, and
    missense variants, in homozygous and in compound-heterozygous configuration.
    Most are loss of function: truncating transcripts are subject to
    nonsense-mediated decay and the residual mutant proteins partially or
    completely lack the kinase domain, and the first reported missense allele,
    p.Val470Gly, retains the protein but abolishes downstream signalling
    regulation. Allele class is not always readable from the coding change - the
    p.Asp544Tyr missense variant acts by creating a cryptic splice site and
    yields two aberrant products rather than a single substituted protein.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two homozygous PRKG2 variants, a nonsense and a frameshift, were
      identified. The mutant transcripts are exposed to nonsense-mediated decay
      and the truncated mutant cGKII proteins, partially or completely lacking
      the kinase domain
    explanation: The founding study establishes the truncating allele class and its consequence for the kinase domain.
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the first missense variant and a second splice-site
      variant in PRKG2 in two patients with clinical and radiological features
      of acromesomelic dysplasia.
    explanation: Extends the allelic spectrum beyond truncating variants to missense and splice-site alleles.
  - reference: PMID:41574272
    reference_title: "Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype of acromesomelic dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis unveiled a unique dual pathogenic mechanism: the
      missense variant creates a cryptic splice site, resulting in two aberrant
      protein products - an in-frame deletion and a missense substitution.
    explanation: >-
      Shows that a PRKG2 missense change can act through splicing, so the coding
      consequence alone does not establish the allele's functional class.
pathophysiology:
- name: Biallelic PRKG2 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants on both PRKG2 alleles eliminate or cripple cGMP-dependent
    protein kinase II. Truncating transcripts are degraded by nonsense-mediated
    decay, and residual mutant protein is present at markedly reduced levels and
    lacks all or part of the catalytic kinase domain.
  genes:
  - preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  biological_processes:
  - preferred_term: Nonsense-mediated decay of PRKG2 transcripts
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two homozygous PRKG2 variants, a nonsense and a frameshift, were
      identified. The mutant transcripts are exposed to nonsense-mediated decay
      and the truncated mutant cGKII proteins, partially or completely lacking
      the kinase domain
    explanation: Establishes biallelic PRKG2 loss of function as the initiating lesion.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For both variants, cGKII was detected at the predicted size (figure 1C),
      although at dramatically reduced levels (>=80%) compared with the wild type
    explanation: Immunoblotting quantifies the loss of cGKII protein produced by two independent truncating alleles.
  downstream:
  - target: Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
    causal_link_type: DIRECT
    description: >-
      Absent or truncated cGKII directly removes the cGMP-activated kinase
      activity that transduces the CNP/NPR-B signal inside the chondrocyte.
    evidence:
    - reference: PMID:34782440
      reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PRKG2 encodes the cyclic guanosine monophosphate dependent protein
        kinase II (cGKII), which acts downstream of the natriuretic peptide
        receptor-B/C- natriuretic peptide (NPR-B/CNP).
      explanation: Places cGKII as the intracellular effector of the CNP/NPR-B axis whose activity the variants remove.
- name: Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    cGKII is the cGMP-activated kinase that carries the CNP/NPR-B growth signal
    forward inside growth-plate chondrocytes. This node is the mechanistic
    junction with acromesomelic dysplasia Maroteaux type: NPR2 variants disable
    the receptor that generates cGMP, PRKG2 variants disable the kinase that
    reads it, and the two disorders converge on the same downstream defect.
  molecular_functions:
  - preferred_term: cGMP-dependent protein kinase activity
    term:
      id: GO:0004692
      label: cGMP-dependent protein kinase activity
    modifier: LOSS_OF_FUNCTION
  - preferred_term: cGMP binding
    term:
      id: GO:0030553
      label: cGMP binding
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: Protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: DECREASED
  - preferred_term: Intracellular signal transduction
    term:
      id: GO:0035556
      label: intracellular signal transduction
    modifier: DECREASED
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: Growth-plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C-type natriuretic peptide (CNP), its endogenous receptor, natriuretic
      peptide receptor-B (NPR-B), as well as its downstream mediator, cyclic
      guanosine monophosphate (cGMP) dependent protein kinase II (cGKII), have
      been shown to play a pivotal role in chondrogenic differentiation and
      endochondral bone growth.
    explanation: Establishes cGKII as the downstream mediator of the CNP/NPR-B axis in chondrogenesis and bone growth.
  - reference: PMID:12193576
    reference_title: Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated endochondral ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that targeted expression of CNP in the growth plate
      chondrocytes fails to rescue the skeletal defect of Prkg2(-/-) mice.
    explanation: >-
      Genetic epistasis places cGKII strictly downstream of CNP: supplying the
      ligand cannot compensate for loss of the kinase, which is why this node,
      not cGMP production, is where the AMDP lesion sits.
  downstream:
  - target: Loss of cGKII Restraint on the c-Raf-1/ERK1/2 Cascade
    causal_link_type: DIRECT
    hypothesis_groups:
    - raf1_mapk_brake_model
    description: >-
      Wild-type cGKII phosphorylates c-Raf-1 at Ser43 to damp FGF-driven MAPK
      output. Mutant cGKII does not perform that phosphorylation, so the
      regulatory input is lost. What the assays measure is the loss of
      regulation; how far chondrocyte ERK output actually moves as a result has
      not been quantified.
    evidence:
    - reference: PMID:33106379
      reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        alter the downstream mitogen activation protein kinase signalling
        pathway by failing to phosphorylate c-Raf 1 at Ser43 and subsequently
        reduce ERK1/2 activation in response to fibroblast growth factor 2
      explanation: >-
        Functional assays show mutant cGKII cannot phosphorylate c-Raf-1 at
        Ser43, the step by which it normally regulates FGF2-induced ERK1/2
        signalling.
  - target: Persistent Nuclear SOX9 in Postmitotic Chondrocytes
    causal_link_type: DIRECT
    hypothesis_groups:
    - sox9_nuclear_exclusion_switch
    description: >-
      In the alternative model, the substrate that matters is SOX9 rather than
      c-Raf-1: cGKII normally blocks SOX9 nuclear entry, so losing the kinase
      leaves SOX9 in the nucleus.
    evidence:
    - reference: PMID:15466490
      reference_title: Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation of chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This attenuation of Sox9 was due to the cGKII inhibition of nuclear
        entry of Sox9.
      explanation: Identifies SOX9 nuclear exclusion as the direct action of cGKII in this model.
  - target: Loss of GSK-3beta Inhibition and Reduced beta-Catenin Signaling
    causal_link_type: DIRECT
    hypothesis_groups:
    - gsk3b_beta_catenin_route
    description: >-
      In the third model the critical substrate is GSK-3beta, which cGKII
      phosphorylates and thereby inactivates.
    evidence:
    - reference: PMID:18551195
      reference_title: Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation of murine chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we performed a kinase substrate array and identified glycogen synthase
        kinase-3beta (GSK-3beta; encoded by Gsk3b) as a principal
        phosphorylation target of cGKII
      explanation: An unbiased substrate screen nominates GSK-3beta as a principal cGKII target.
- name: Persistent Nuclear SOX9 in Postmitotic Chondrocytes
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    SOX9 sustains the proliferative and matrix-producing chondrocyte state and
    represses hypertrophic differentiation. cGKII normally excludes SOX9 from
    the nucleus at the point where chondrocytes stop dividing, and without that
    exclusion SOX9 activity persists in postmitotic cells, which stall before
    hypertrophy. This is the mechanism established in the cGKII-deficient KMI
    rat; whether it operates in human AMDP has not been tested.
  cell_types:
  - preferred_term: Growth-plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: Negative regulation of protein import into nucleus
    term:
      id: GO:0042308
      label: negative regulation of protein import into nucleus
    modifier: DECREASED
  - preferred_term: Chondrocyte hypertrophy
    term:
      id: GO:0003415
      label: chondrocyte hypertrophy
    modifier: DECREASED
  evidence:
  - reference: PMID:15466490
    reference_title: Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation of chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The expression of Sox9, an inhibitory regulator of hypertrophic
      differentiation, persisted in the nuclei of postmitotic chondrocytes of
      the KMI growth plate.
    explanation: Documents persistent nuclear SOX9 in the cGKII-deficient growth plate.
  - reference: PMID:15466490
    reference_title: Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation of chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The impaired differentiation of cultured KMI chondrocytes was restored by
      the silencing of Sox9 through RNA interference.
    explanation: >-
      Knocking SOX9 down rescues the differentiation block, which is the
      epistasis result that makes SOX9 causal rather than correlative here.
  downstream:
  - target: Dysregulated SOX9-Dependent Chondrocyte Collagen Program
    causal_link_type: DIRECT
    hypothesis_groups:
    - sox9_nuclear_exclusion_switch
    description: >-
      Retained nuclear SOX9 directly sustains its own transcriptional program,
      holding COL2A1 high and COL10A1 low.
    evidence:
    - reference: PMID:15466490
      reference_title: Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation of chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cGKII attenuated the Sox9 functions to induce the chondrogenic
        differentiation and to inhibit the hypertrophic differentiation of
        chondrocytes
      explanation: States the two transcriptional outputs of SOX9 that cGKII normally restrains.
- name: Loss of GSK-3beta Inhibition and Reduced beta-Catenin Signaling
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    cGKII phosphorylates GSK-3beta and thereby inhibits it, which spares
    beta-catenin from degradation and permits canonical Wnt transcriptional
    output that drives chondrocyte hypertrophy. Without cGKII, GSK-3beta stays
    active and beta-catenin levels fall. The genetic test of this model is that
    removing one Gsk3b allele partially rescues the Prkg2-null growth plate.
  cell_types:
  - preferred_term: Growth-plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: Protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: DECREASED
  - preferred_term: Canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:18551195
    reference_title: Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation of murine chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that beta-catenin levels decreased in Prkg2(-/-) mice, while
      overexpression of cGKII increased the accumulation and transactivation
      function of beta-catenin in mouse chondroprogenitor ATDC5 cells.
    explanation: Measures the beta-catenin consequence of losing cGKII in vivo and in vitro.
  - reference: PMID:18551195
    reference_title: Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation of murine chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analyses of mice with compound deficiencies in both protein kinases
      (Prkg2(-/-)Gsk3b(+/-)) demonstrated that the growth retardation and
      elongated growth plate associated with cGKII deficiency were partially
      rescued by haploinsufficiency of Gsk3b.
    explanation: >-
      The compound-mutant rescue is the genetic evidence that GSK-3beta is on
      the causal path, and its partiality is why this is curated as one route
      among several rather than the whole mechanism.
  downstream:
  - target: Impaired Endochondral Longitudinal Bone Growth
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - gsk3b_beta_catenin_route
    description: >-
      Reduced beta-catenin-dependent hypertrophic differentiation lengthens the
      growth plate and slows the conversion of cartilage into bone.
    evidence:
    - reference: PMID:18551195
      reference_title: Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation of murine chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we determined that this growth defect was a consequence of an elongated
        growth plate and impaired chondrocyte hypertrophy
      explanation: Links the differentiation block to the growth deficit in the Prkg2-null mouse.
- name: Loss of cGKII Restraint on the c-Raf-1/ERK1/2 Cascade
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    In chondrocytes, cGKII acts as an inhibitory input onto the FGF-MAPK
    cascade by phosphorylating c-Raf-1 at Ser43. Losing that input dysregulates
    FGF2-driven ERK1/2 signalling in a pathway whose excess activity is a
    well-established cause of impaired chondrocyte proliferation in the FGFR3
    chondrodysplasias. This node is deliberately named for the lesion rather
    than for a direction of change. Two of the three source abstracts phrase the
    mutant effect ambiguously - the clause reads equally as the mutant reducing
    ERK activation or as the mutant failing to reduce it - and only
    PMID:37789084 states it unambiguously, that the mutant was unable to
    down-regulate FGF2-induced MAPK signalling. Loss of restraint is therefore
    what the evidence supports; a quantified increase in chondrocyte ERK output
    is not.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: ABNORMAL
  - preferred_term: Negative regulation of ERK1 and ERK2 cascade
    term:
      id: GO:0070373
      label: negative regulation of ERK1 and ERK2 cascade
    modifier: DECREASED
  - preferred_term: Fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: ABNORMAL
  - preferred_term: Peptidyl-serine phosphorylation of c-Raf-1
    term:
      id: GO:0018105
      label: peptidyl-serine phosphorylation
    modifier: DECREASED
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Wild-type cGKII downregulated MAPK signalling by reducing ERK1/2
      activation through the upstream phosphorylation of Raf-1 at Ser-43 in a
      cGMP-dependent manner.
    explanation: Defines the normal inhibitory action of cGKII on the FGF-MAPK cascade that the disorder removes.
  - reference: PMID:15869918
    reference_title: Complementary antagonistic actions between C-type natriuretic peptide and the MAPK pathway through FGFR-3 in ATDC5 cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CNP and 8-bromo-cGMP strongly and dose-dependently inhibited the induction
      of ERK phosphorylation by FGF2 and FGF18 without changing the level of
      FGFR-3
    explanation: >-
      Shows the CNP-cGMP arm restraining FGF-driven ERK activation in
      chondrocytes, the brake that PRKG2 loss removes.
  - reference: PMID:15869918

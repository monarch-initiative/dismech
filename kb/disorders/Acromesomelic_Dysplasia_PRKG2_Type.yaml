    How do the measured RAF/ERK, SOX9 and GSK3β-related effects combine in patient growth-plate chondrocytes?
  rationale: >-
    The human-variant RAF/ERK assays are heterologous expression experiments. Rodent and engineered-cell studies
    support SOX9 and GSK3β contributions, but do not place GSK3β upstream of SOX9 exclusion or prove β-catenin
    necessity. Direct SOX9 phosphorylation is dispensable for the localization effect. The ERK assay direction

      Bovine growth-plate biology and body proportions differ from human, and
      the cattle phenotype is described as dwarfism without the acromesomelic
      radiographic detail used to define the human entity.
    readouts:
    - name: COL2 and COL10 mRNA expression
      target: Dysregulated SOX9-Dependent Chondrocyte Collagen Program
      direction: INCREASED
      interpretation: >-
        Loss of PRKG2 regulation raises collagen transcript levels in dwarf
        cattle, the same regulatory node dysregulated by the human alleles.
      evidence:
      - reference: PMID:19887637
        reference_title: A nonsense mutation in cGMP-dependent type II protein kinase (PRKG2) causes dwarfism in American Angus cattle.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          COL2 and COL10 mRNA expression was increased in dwarf cattle compared
          with unaffected cattle.
        explanation: Reports the direct transcript measurement in affected animals.
    evidence:
    - reference: PMID:19887637
      reference_title: A nonsense mutation in cGMP-dependent type II protein kinase (PRKG2) causes dwarfism in American Angus cattle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These experiments indicate that the R678X mutation is functional,
        resulting in a loss of PRKG2 regulation of COL2 and COL10 mRNA
        expression.
      explanation: Supports treating the bovine allele as informative for the collagen-program node.
- name: Dogo Argentino PRKG2 splice-site dwarfism
  species: Dog
  genotype: PRKG2 c.1634+1G>T homozygous
  publication: PMID:34680883
  genes:
  - preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  description: >-
    Two Dogo Argentino dogs with disproportionate dwarfism were homozygous for a
    PRKG2 splice-donor variant that segregated with the phenotype in a
    nine-animal family, a canine counterpart of the human splice-site alleles.
  modeled_mechanisms:
  - target: Impaired Endochondral Longitudinal Bone Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      A canine PRKG2 loss-of-function allele produces disproportionate dwarfism,
      supporting reduced longitudinal bone growth as the organism-level output of
      PRKG2 loss.
    limitations: >-
      The dogs were characterised clinically and genomically rather than
      histologically, so the growth-plate lesion itself was not measured, and

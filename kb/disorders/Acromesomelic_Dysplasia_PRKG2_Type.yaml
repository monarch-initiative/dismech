animal_models:
- name: Prkg2-null mouse
  species: Mouse
  genotype: Prkg2−/−
  publication: PMID:12193576
  description: >-
    Global cGKII deficiency causes dwarfism and a disorganized, elongated growth plate. Growth-plate CNP overexpression
    fails to rescue the skeletal defect. Later detailed mouse work shows a postmitotic, poorly hypertrophic
    intermediate layer, with growth-plate expansion most evident at two to four weeks and persistent bone shortening
    after that expansion subsides.
  modeled_mechanisms:
  - target: Impaired Hypertrophic Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces deficient growth-plate hypertrophic progression.
    limitations: >-
      A global null is more severe molecularly than some human alleles; the human regional pattern is not reproduced
      exactly.
    evidence:
    - reference: PMID:12193576
      reference_title: >-
        Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated
        endochondral ossification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        The type II cGK (cGKII)-deficient mice (Prkg2(-/-) mice) develop dwarfism as a result of impaired endochondral
        ossification
      explanation: Mouse knockout phenotype.
  - target: Impaired Endochondral Bone Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Prkg2 deficiency impairs skeletal growth, and growth-plate CNP overexpression does not rescue this defect.
    limitations: >-
      This is a global-null mouse experiment, not a human treatment trial; the skeletal-growth readout does
      not isolate a particular chondrocyte differentiation step.
    evidence:
    - reference: PMID:12193576
      reference_title: >-
        Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated
        endochondral ossification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        The type II cGK (cGKII)-deficient mice (Prkg2(-/-) mice) develop dwarfism as a result of impaired endochondral
        ossification
      explanation: The mouse model reproduces impaired endochondral skeletal growth.
    readouts:
    - name: Response to growth-plate CNP overexpression
      target: Impaired Endochondral Bone Growth
      direction: UNCHANGED
      interpretation: The upstream ligand did not rescue the skeletal growth defect in this null model.
      evidence:
      - reference: PMID:12193576
        reference_title: >-
          Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated
          endochondral ossification.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          targeted expression of CNP in the growth plate chondrocytes fails to rescue the skeletal defect of
          Prkg2(-/-) mice
        explanation: In-vivo negative rescue experiment.
- name: Prkg2-null mouse with Gsk3b haploinsufficiency
  species: Mouse
  genotype: Prkg2−/−; Gsk3b+/−
  publication: PMID:18551195
  description: >-
    Male compound-mutant mice show partial recovery of skeletal growth and growth-plate differentiation compared
    with Prkg2-null mice. Recovery is incomplete and refers to the deficit relative to wild type, not the proportion
    of normal bone length attained.
  modeled_mechanisms:
  - target: Impaired Hypertrophic Chondrocyte Differentiation
    relationship: PERTURBS
    fidelity: MODERATE
    description: Genetic reduction of GSK3β partially ameliorates the differentiation/growth defect.
    limitations: >-
      Global Gsk3b dosage reduction does not isolate a chondrocyte-autonomous effect. Only male mice were studied;
      no human therapeutic efficacy was tested.
    evidence:
    - reference: PMID:18551195
      reference_title: >-
        Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation
        of murine chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Genetic rescue of impaired skeletal growth in Prkg2–/– mice by suppression of GSK-3 β was significant,
        but incomplete
      explanation: The compound-genetic experiment establishes contribution of the GSK3β route.
    readouts:
    - name: Excess growth-plate height
      target: Impaired Hypertrophic Chondrocyte Differentiation
      direction: RESTORED
      interpretation: >-
        The report quantified 36% recovery of the excessive growth-plate height, with partial COL10 restoration.
      evidence:
      - reference: PMID:18551195
        reference_title: >-
          Phosphorylation of GSK-3beta by cGMP-dependent protein kinase II promotes hypertrophic differentiation
          of murine chondrocytes.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: The percentage recovery by the GSK-3 β insufficiency was 36.0%.
        explanation: Quantified partial growth-plate rescue.
- name: Komeda miniature rat Ishikawa
  species: Rat
  genotype: Homozygous mri deletion spanning Prkg2 exons 4–5
  publication: PMID:15466490
  description: >-
    The naturally occurring approximately 5-kb deletion creates a frameshift and predicted kinase-domain truncation.
    Rats grow normally initially, then develop shortened limbs and trunk from about four weeks. Growth plates
    accumulate postmitotic nonhypertrophic cells; experimental tibial fracture healing is also delayed.
  modeled_mechanisms:
  - target: Impaired Hypertrophic Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Rat histology demonstrates the abnormal intermediate layer.
    limitations: >-
      The postnatal onset, fracture experiment and molecular readouts are model observations, not established
      human clinical complications.
    evidence:
    - reference: PMID:15466490
      reference_title: >-
        Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation
        of chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        the intermediate layer chondrocytes were abnormal cells that had ceased proliferation but had not started
        hypertrophic differentiation.
      explanation: Rat histology distinguishes delayed differentiation from a hyperproliferative layer.
    readouts:
    - name: Postmitotic nonhypertrophic growth-plate cells
      target: Impaired Hypertrophic Chondrocyte Differentiation
      direction: INCREASED
      interpretation: BrdU-negative, ALP/COL10-negative cells accumulate between proliferative and hypertrophic zones.
      evidence:
      - reference: PMID:15466490
        reference_title: >-
          Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation
          of chondrocytes.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          the intermediate layer chondrocytes were abnormal cells that had ceased proliferation but had not
          started hypertrophic differentiation.
        explanation: Rat histology distinguishes delayed differentiation from a hyperproliferative layer.
  - target: Persistent SOX9 Nuclear Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: SOX9 persists in nuclei of the abnormal intermediate layer.
    limitations: >-
      Localization alone does not establish the intermediary; the causal silencing experiment was performed
      in isolated cells.
    evidence:
    - reference: PMID:15466490
      reference_title: >-
        Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation
        of chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        nuclear localization of Sox9 was clearly visible in the abnormal intermediate layer of the KMI growth
        plate
      explanation: Direct rat immunolocalization.
- name: Angus cattle with PRKG2 R678X
  species: Cattle
  genotype: Homozygous PRKG2 p.Arg678Ter
  publication: PMID:19887637
  description: >-
    A naturally occurring recessive nonsense variant cosegregated with dwarfism. The experimental breeding
    cohort comprised four homozygous affected calves and two heterozygous unaffected calves studied around
    seven months; long bones and stature were reduced. Growth-plate COL2 and COL10 RNA both increased, while
    total PRKG2 RNA did not differ detectably.
  modeled_mechanisms:
  - target: Impaired Endochondral Bone Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Naturally occurring disruption of the homologous gene produces impaired skeletal growth.
    limitations: >-
      Small cohort with heterozygous controls and shared ancestry. Its increased COL10 RNA differs from reduced
      COL10 in rat-cell experiments; no universal collagen-X direction or human fracture risk follows.
    evidence:
    - reference: PMID:19887637
      reference_title: >-
        A nonsense mutation in cGMP-dependent type II protein kinase (PRKG2) causes dwarfism in American Angus
        cattle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Animals predicted to be dwarfs by the R678X PRKG2 marker had shorter metatarsals
      explanation: Direct bone-length phenotype in the breeding cohort.
    - reference: PMID:19887637
      reference_title: >-
        A nonsense mutation in cGMP-dependent type II protein kinase (PRKG2) causes dwarfism in American Angus
        cattle.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Real-time PCR of COL10 indicated an increase in expression in dwarfs compared with normal individuals
      explanation: Measured cattle growth-plate RNA.
- name: Dogo Argentino PRKG2 splice-site candidate
  species: Dog
  genotype: Homozygous PRKG2 c.1634+1G>T
  publication: PMID:34680883
  description: >-
    Two affected half-siblings in a nine-dog family had disproportionate dwarfism. Detailed radiography and
    CT of the male showed forelimb deformity, premature distal ulnar physeal closure and impaired endochondral
    ossification. The splice-donor variant cosegregated with the phenotype and was prioritized against 795
    control genomes.
  modeled_mechanisms:
  - target: Impaired Endochondral Bone Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Comparative genetic evidence links the candidate splice defect to abnormal skeletal growth.
    limitations: >-
      No patient-derived RNA, protein or kinase assay established splice loss in the dogs; the variant remains
      a strongly supported candidate in this report. The detailed imaging was from one affected male.
    evidence:
    - reference: PMID:34680883
      reference_title: PRKG2 Splice Site Variant in Dogo Argentino Dogs with Disproportionate Dwarfism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT

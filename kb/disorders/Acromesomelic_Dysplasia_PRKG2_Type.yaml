differential_diagnoses:
- name: Acromesomelic Dysplasia, Maroteaux Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Maroteaux type
    term:
      id: MONDO:0011275
      label: acromesomelic dysplasia 1, Maroteaux type
  description: >-
    The closest differential and the immediate upstream disorder in the same signalling axis: biallelic NPR2
    variants disable the receptor that generates the cGMP signal cGKII transduces.
  distinguishing_features:
  - Biallelic NPR2 variants rather than biallelic PRKG2 variants establish AMDM.
  - >-
    Pronounced generalized cone-shaped epiphyses with phalangeal shortening are characteristic of AMDM. In
    the PRKG2 family presenting as spondylometaphyseal dysplasia, the subtle coning involved distal phalangeal
    metaphyses and was unaccompanied by shortening; these are anatomically distinct observations.
  evidence:
  - reference: PMID:33106379
    reference_title: >-
      Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, biallelic variants in NPR2, encoding NPR-B, cause acromesomelic dysplasia, type Maroteaux,
      while heterozygous variants in NPR2 (natriuretic peptide receptor 2) and NPPC (natriuretic peptide precursor
      C), encoding CNP, cause milder phenotypes.
    explanation: Identifies the upstream NPR2 disorder that AMDP most closely resembles.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metaphyses of the distal phalanges were somewhat cone-shaped in one child, but not pronounced, generalised
      or associated with shortening, as seen in AMDM.
    explanation: Gives the radiographic contrast between this PRKG2 family and AMDM.
- name: Spondylometaphyseal Dysplasia
  description: >-
    One PRKG2 family was referred with spondylometaphyseal dysplasia and had no acromesomelic shortening, so
    PRKG2 belongs in the differential of that radiographic category as well as of acromesomelic dysplasia.
  distinguishing_features:
  - >-
    Long slender femoral necks with platyspondyly and anterior vertebral body projections, without acromesomelic
    shortening, was the presenting pattern in the PRKG2 family reported by the 100,000 Genomes Project.
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, family 1 exhibited a skeletal phenotype characterised by spondylometaphyseal dysplasia, rather
      than acromesomelic dysplasia as expected in AMDP and AMDM.
    explanation: Documents the spondylometaphyseal presentation of biallelic PRKG2 loss.
- name: Hypochondroplasia
  description: >-
    The attenuated compound-heterozygous case was initially suspected to have hypochondroplasia before negative
    FGFR3 testing and subsequent identification of PRKG2 variants.
  distinguishing_features:
  - >-
    The PRKG2 presentation may include mild forearm and digital shortening with slender elongated femoral necks.
    Molecular testing distinguishes the conditions; the report does not define a validated radiographic decision
    rule.
  evidence:
  - reference: PMID:41574272
    reference_title: >-
      Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
      of acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      hypochondroplasia was initially suspected. However, no pathogenic variants in the FGFR3 gene were identified.
    explanation: Directly documents the diagnostic overlap.
mechanistic_hypotheses: []
discussions:
- kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced cGKII Kinase Function
  prompt: How do residual kinase function and tissue-specific effects explain severity across PRKG2 alleles?
  rationale: >-
    The attenuated compound-heterozygous case has direct RNA evidence, but the proposed residual function of
    its missense/in-frame-deletion products was not measured. The D761Efs*34 family has a predominantly spondylometaphyseal
    phenotype despite marked signaling defects in heterologous cells. These reports do not establish a quantitative
    genotype–phenotype rule.
  evidence:
  - reference: PMID:41574272
    reference_title: >-
      Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
      of acromesomelic dysplasia.
    supports: SUPPORT

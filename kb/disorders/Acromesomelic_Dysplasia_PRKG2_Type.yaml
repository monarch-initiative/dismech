- name: Reduced cGKII Kinase Function
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    cGKII is a cGMP-dependent kinase downstream of CNP/NPR-B. Tested human variants fail to provide normal
    regulation of RAF/ERK signaling, while the rat mutant lacks a cGMP-stimulated kinase response. Loss of
    cGMP binding itself has not been demonstrated for every allele.
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      neither R569* nor D761Efs*34 mutants were able to downregulate FGF2-induced ERK1/2 activation compared
      with WT
    explanation: Functional deficit in transient-expression assays. This is not a purified-kinase kinetic assay.
  - reference: PMID:15466490
    reference_title: >-
      Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation
      of chondrocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The in vitro kinase assay revealed that the wild-type extract showed a significant increase in the kinase
      activity by the stimulation with the cGMP analog 8-bromo-cGMP; however, the increase was not observed
      in the KMI extract
    explanation: The cGMP-stimulated kinase response was absent in rat brain extracts.
  molecular_functions:
  - preferred_term: cGMP-dependent protein kinase activity
    term:
      id: GO:0004692
      label: cGMP-dependent protein kinase activity
    modifier: DECREASED
  downstream:

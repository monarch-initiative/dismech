name: Acromesomelic Dysplasia PRKG2 Type
synonyms:
- AMDP
- Acromesomelic dysplasia 4
- Acromesomelic dysplasia, PRKG2-related
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Acromesomelic dysplasia, PRKG2 type (AMDP) is an ultra-rare autosomal
  recessive skeletal dysplasia caused by biallelic loss-of-function variants in
  PRKG2, which encodes cGMP-dependent protein kinase II (cGKII). cGKII is the
  intracellular effector immediately downstream of the C-type natriuretic
  peptide (CNP) / natriuretic peptide receptor-B (NPR-B) axis whose upstream
  receptor, NPR2, is mutated in acromesomelic dysplasia Maroteaux type. Loss of
  cGKII removes an inhibitory brake on fibroblast growth factor signaling in
  growth-plate chondrocytes: the mutant kinase fails to phosphorylate c-Raf-1 at
  Ser43, so FGF2-induced ERK1/2 activation is no longer restrained, and the
  SOX9-dependent chondrocyte collagen program is dysregulated with COL10A1
  downregulation and COL2A1 upregulation. The clinical result is severe
  disproportionate short stature with acromesomelic limb shortening,
  brachydactyly, mild to moderate platyspondyly with anterior vertebral beaking,
  and progressive metaphyseal alteration of the long bones. The phenotype is
  variable: one reported family presented as spondylometaphyseal dysplasia with
  no acromesomelic shortening at all, so PRKG2 should be considered across a
  wider radiographic range than the entity name suggests.
disease_term:
  preferred_term: acromesomelic dysplasia, PRKG2 type
  term:
    id: MONDO:0030553
    label: acromesomelic dysplasia 4
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 16 "Acromesomelic dysplasias"; listed as the
      PRKG2-linked acromesomelic dysplasia type (OMIM 619636). This entity was
      first reported in 2020 and so appears in the 2023 revision but not in the
      2019 revision (PMID:31633310), which is why no 2019 group is recorded here.
    evidence:
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The remaining three ACD types encompass NPR2-linked Maroteaux type (OMIM
        #602875), the PRKG2-linked ACD type (OMIM #619636) and Osebold-Remondini
        type, which is not yet associated with a genomic locus (OMIM #112910).
      explanation: >-
        A 2024 report enumerating the seven acromesomelic chondrodysplasia types
        recognised by the 2023 nosology revision places the PRKG2-linked type
        inside that group.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. As of the 2024 mutational review only
    a handful of families had been reported, and the entity is described in the
    literature as extremely rare.
  evidence:
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, PRKG2 type (AMDP, MIM 619636), is an extremely
      rare autosomal recessive skeletal dysplasia characterized by severe
      disproportionate short stature presenting with acromesomelia, mild
      metaphyseal widening of the long bones and mild spondylar dysplasia.
    explanation: The mutational review characterises AMDP as extremely rare.
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only four variants have been reported; one nonsense, one
      splice-site, and two frameshifts in five AMDP families.
    explanation: Quantifies the published case count behind the ultra-rare classification.
progression:
- phase: Childhood
  age_range: Early childhood onward
  notes: >-
    Metaphyseal alteration of the long bones is described as progressively
    increasing rather than static, so a normal or near-normal early radiograph
    does not exclude the diagnosis.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing was performed in two girls with severe short stature due
      to acromesomelic limb shortening, brachydactyly, mild to moderate
      platyspondyly and progressively increasing metaphyseal alterations of the
      long bones.
    explanation: The founding series describes the metaphyseal changes as progressive.
- phase: Childhood to adulthood
  age_range: Age 5 to 20 years
  notes: >-
    Longitudinal follow-up of one sibling pair shows short stature worsening
    with age while the vertebral findings become less conspicuous, so spinal
    radiographs taken in adolescence may under-represent the earlier phenotype.
  evidence:
  - reference: PMID:36504352
    reference_title: Natural history of clinical features in two brothers with acromesomelic dysplasia related to PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Annual follow-ups of the older brother from the age of 5 to 20 years
      revealed progression of short stature with age but platyspondyly and
      anterior beaking became less conspicuous.
    explanation: The natural-history report documents divergent trajectories for stature and spinal findings.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    AMDP results from biallelic PRKG2 loss of function. Reported families are
    consanguineous with homozygous variants, and heterozygous parents and
    siblings are unaffected.
  evidence:
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic dysplasia, PRKG2 type (AMDP, MIM 619636), is an extremely
      rare autosomal recessive skeletal dysplasia
    explanation: States the recessive mode of inheritance for the entity.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      four individuals from two independent families were identified harbouring
      homozygous frameshift or stop-gain variants in PRKG2
    explanation: Independent families carry homozygous biallelic variants, consistent with recessive inheritance.
  - reference: PMID:41574272
    reference_title: "Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype of acromesomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two novel compound-heterozygous variants in the PRKG2 gene
    explanation: >-
      Compound heterozygosity outside a consanguineous setting confirms that two
      damaged alleles, not homozygosity as such, are what is required.
genetic:
- name: Biallelic PRKG2 Loss-of-Function Variants
  gene_term:
    preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported causative alleles include nonsense, frameshift, splice-site, and
    missense variants, in homozygous and in compound-heterozygous configuration.
    Most are loss of function: truncating transcripts are subject to
    nonsense-mediated decay and the residual mutant proteins partially or
    completely lack the kinase domain, and the first reported missense allele,
    p.Val470Gly, retains the protein but abolishes downstream signalling
    regulation. Allele class is not always readable from the coding change - the
    p.Asp544Tyr missense variant acts by creating a cryptic splice site and
    yields two aberrant products rather than a single substituted protein.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two homozygous PRKG2 variants, a nonsense and a frameshift, were
      identified. The mutant transcripts are exposed to nonsense-mediated decay
      and the truncated mutant cGKII proteins, partially or completely lacking
      the kinase domain
    explanation: The founding study establishes the truncating allele class and its consequence for the kinase domain.
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the first missense variant and a second splice-site
      variant in PRKG2 in two patients with clinical and radiological features
      of acromesomelic dysplasia.
    explanation: Extends the allelic spectrum beyond truncating variants to missense and splice-site alleles.
  - reference: PMID:41574272
    reference_title: "Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype of acromesomelic dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis unveiled a unique dual pathogenic mechanism: the
      missense variant creates a cryptic splice site, resulting in two aberrant
      protein products - an in-frame deletion and a missense substitution.
    explanation: >-
      Shows that a PRKG2 missense change can act through splicing, so the coding
      consequence alone does not establish the allele's functional class.
pathophysiology:
- name: Biallelic PRKG2 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants on both PRKG2 alleles eliminate or cripple cGMP-dependent
    protein kinase II. Truncating transcripts are degraded by nonsense-mediated
    decay, and residual mutant protein is present at markedly reduced levels and
    lacks all or part of the catalytic kinase domain.
  genes:
  - preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two homozygous PRKG2 variants, a nonsense and a frameshift, were
      identified. The mutant transcripts are exposed to nonsense-mediated decay
      and the truncated mutant cGKII proteins, partially or completely lacking
      the kinase domain
    explanation: Establishes biallelic PRKG2 loss of function as the initiating lesion.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For both variants, cGKII was detected at the predicted size (figure 1C),
      although at dramatically reduced levels (>=80%) compared with the wild type
    explanation: Immunoblotting quantifies the loss of cGKII protein produced by two independent truncating alleles.
  downstream:
  - target: Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
    causal_link_type: DIRECT
    description: >-
      Absent or truncated cGKII directly removes the cGMP-activated kinase
      activity that transduces the CNP/NPR-B signal inside the chondrocyte.
    evidence:
    - reference: PMID:34782440
      reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PRKG2 encodes the cyclic guanosine monophosphate dependent protein
        kinase II (cGKII), which acts downstream of the natriuretic peptide
        receptor-B/C- natriuretic peptide (NPR-B/CNP).
      explanation: Places cGKII as the intracellular effector of the CNP/NPR-B axis whose activity the variants remove.
- name: Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    cGKII is the cGMP-activated kinase that carries the CNP/NPR-B growth signal
    forward inside growth-plate chondrocytes. This node is the mechanistic
    junction with acromesomelic dysplasia Maroteaux type: NPR2 variants disable
    the receptor that generates cGMP, PRKG2 variants disable the kinase that
    reads it, and the two disorders converge on the same downstream defect.
  molecular_functions:
  - preferred_term: cGMP-dependent protein kinase activity
    term:
      id: GO:0004692
      label: cGMP-dependent protein kinase activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C-type natriuretic peptide (CNP), its endogenous receptor, natriuretic
      peptide receptor-B (NPR-B), as well as its downstream mediator, cyclic
      guanosine monophosphate (cGMP) dependent protein kinase II (cGKII), have
      been shown to play a pivotal role in chondrogenic differentiation and
      endochondral bone growth.
    explanation: Establishes cGKII as the downstream mediator of the CNP/NPR-B axis in chondrogenesis and bone growth.
  downstream:
  - target: Unrestrained FGF2-Induced ERK1/2 Signaling
    causal_link_type: DIRECT
    description: >-
      Wild-type cGKII phosphorylates c-Raf-1 at Ser43 to damp FGF-driven MAPK
      output; mutant cGKII fails to perform this phosphorylation, so the brake
      is directly released.
    evidence:
    - reference: PMID:33106379
      reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        alter the downstream mitogen activation protein kinase signalling
        pathway by failing to phosphorylate c-Raf 1 at Ser43 and subsequently
        reduce ERK1/2 activation in response to fibroblast growth factor 2
      explanation: >-
        Functional assays show mutant cGKII cannot phosphorylate c-Raf-1 at
        Ser43, the step by which it normally regulates FGF2-induced ERK1/2
        signalling.
- name: Unrestrained FGF2-Induced ERK1/2 Signaling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    In chondrocytes, cGKII acts as an inhibitory input onto the FGF-MAPK
    cascade by phosphorylating c-Raf-1 at Ser43. Loss of that phosphorylation
    dysregulates FGF2-driven ERK1/2 signalling, a pathway whose excess activity
    is a well-established cause of impaired chondrocyte proliferation in the
    FGFR3 chondrodysplasias.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Wild-type cGKII downregulated MAPK signalling by reducing ERK1/2
      activation through the upstream phosphorylation of Raf-1 at Ser-43 in a
      cGMP-dependent manner.
    explanation: Defines the normal inhibitory action of cGKII on the FGF-MAPK cascade that the disorder removes.
  - reference: PMID:37789084
    reference_title: "Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the first missense variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      functional studies of the novel missense variant, p.Val470Gly, revealed
      that it was unable to down-regulate FGF2-induced MAPK signaling and, thus,
      would be predicted to cause growth delay
    explanation: An independent allele reproduces the same failure of MAPK downregulation, linking it to growth failure.
  downstream:
  - target: Dysregulated SOX9-Dependent Chondrocyte Collagen Program
    causal_link_type: DIRECT
    description: >-
      The altered MAPK output feeds directly into the SOX9-controlled collagen
      transcriptional program of the growth-plate chondrocyte.
    evidence:
    - reference: PMID:33106379
      reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: They also downregulate COL10A1 and upregulate COL2A1 expression through SOX9.
      explanation: The same mutant proteins alter SOX9-dependent COL10A1 and COL2A1 expression.
- name: Dysregulated SOX9-Dependent Chondrocyte Collagen Program
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    COL10A1 marks hypertrophic chondrocytes and COL2A1 marks the proliferative
    and resting zones. Downregulation of COL10A1 with upregulation of COL2A1
    indicates chondrocytes that fail to advance through hypertrophic
    maturation and remain in an earlier differentiation state.
  cell_types:
  - preferred_term: Growth-plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: ABNORMAL
  - preferred_term: Chondrocyte hypertrophy
    term:
      id: GO:0003415
      label: chondrocyte hypertrophy
    modifier: DECREASED
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: They also downregulate COL10A1 and upregulate COL2A1 expression through SOX9.
    explanation: Directly documents the shifted collagen expression program in the mutant setting.
  - reference: PMID:19887637
    reference_title: A nonsense mutation in cGMP-dependent type II protein kinase (PRKG2) causes dwarfism in American Angus cattle.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These experiments indicate that the R678X mutation is functional,
      resulting in a loss of PRKG2 regulation of COL2 and COL10 mRNA expression.
    explanation: >-
      A naturally occurring bovine PRKG2 nonsense allele independently shows loss
      of collagen-gene regulation. Evidence source is MODEL_ORGANISM because the
      measurement is in cattle.
  downstream:
  - target: Impaired Endochondral Longitudinal Bone Growth
    causal_link_type: DIRECT
    description: >-
      Chondrocytes that do not complete the proliferation-to-hypertrophy
      sequence directly reduce the rate of longitudinal growth generated at the
      physis.
    evidence:
    - reference: PMID:33106379
      reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        have been shown to play a pivotal role in chondrogenic differentiation
        and endochondral bone growth
      explanation: Ties the CNP/NPR-B/cGKII axis, and therefore its failure, to endochondral bone growth.
- name: Impaired Endochondral Longitudinal Bone Growth
  role: consequence
  biological_scale: TISSUE
  description: >-
    Reduced longitudinal growth at the physis produces the disproportionate

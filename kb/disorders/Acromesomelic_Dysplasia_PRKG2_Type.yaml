    explanation: Carrier fibroblast RNA establishes the splice consequence of c.1630G>T.
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
    modifier: ABNORMAL
- name: PRKG2 Transcript Depletion
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    Nonsense-mediated decay was reported for the original nonsense and frameshift alleles. The later p.Ala359Leufs*24
    carrier fibroblast sample showed a 92:8 wild-type:mutant RNA ratio, consistent with mutant-transcript depletion;
    that ratio alone is not a direct kinetic measurement of decay.
  evidence:
  - reference: PMID:33106379
    reference_title: >-
      Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: The mutant transcripts are exposed to nonsense-mediated decay
    explanation: >-
      Nonsense-mediated decay was reported for the two founding variants; this is allele-specific functional
      evidence.
  - reference: PMID:41574272
    reference_title: >-
      Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
      of acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: revealed a significant allelic imbalance (wt/mut ratio = 92/8)
    explanation: Allelic RNA imbalance in the carrier mother.
  biological_processes:
  - preferred_term: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  downstream:
  - target: Reduced cGKII Protein Abundance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Depletion of a coding transcript can reduce the amount of its protein through reduced available template.

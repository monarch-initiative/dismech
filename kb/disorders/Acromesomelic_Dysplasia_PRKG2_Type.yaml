genetic:
- name: Biallelic PRKG2 variants
  gene_term:
    preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported alleles include p.Asn164Lysfs*2, p.Arg569*, the C-terminal extension p.Asp761Glufs*34, canonical
    splice-site variants, and p.Val470Gly. The extension retains the kinase domain but impairs tested signaling,
    so not all frameshifts remove that domain. The p.Val470Gly protein has reduced abundance and deficient
    RAF/ERK regulation in transfected cells; an ATP-binding defect remains a structural hypothesis. The compound-heterozygous
    p.Ala359Leufs*24/p.Asp544Tyr case adds RNA evidence: c.1630G>T generates both a shortened exon-13 transcript
    and a transcript retaining the missense change. Its protein products and residual kinase activity were
    predicted rather than measured. The homozygous c.1154+1G>A splice-site variant in the Brazilian case was
    classified as likely pathogenic, with predicted splice disruption but no reported RNA assay or parental
    segregation.
  evidence:
  - reference: PMID:33106379
    reference_title: >-
      Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Two homozygous PRKG2 variants, a nonsense and a frameshift, were identified.
    explanation: The founding human genotypes.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In family 1, WGS and subsequent Sanger sequencing uncovered a homozygous pathogenic PRKG2 variant, NM_006259.3:c.2282dup
      (p.Asp761Glufs*34;
    explanation: The C-terminal-extension genotype occurred in three brothers.
  - reference: PMID:37789084
    reference_title: >-
      Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the
      first missense variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Parents were found to be heterozygous for the variant.
    explanation: Segregation of p.Val470Gly.
  - reference: PMID:37789084
    reference_title: >-
      Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the
      first missense variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Segregation analysis could not be performed in parents and maternal uncle due to lack of DNA samples.
    explanation: Limitation of the c.1154+1G>A family.
  - reference: PMID:41574272
    reference_title: >-
      Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
      of acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: This variant leads to the production of two aberrant transcript populations
    explanation: The newer missense annotation also conceals an experimentally demonstrated splice effect.
pathophysiology:
- name: Biallelic PRKG2 Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline PRKG2 variants initiate this disorder. Molecular consequences differ between alleles;
    the observed RNA, protein-abundance and signaling defects are represented separately.
  evidence:
  - reference: PMID:33106379
    reference_title: >-
      Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Two homozygous PRKG2 variants, a nonsense and a frameshift, were identified.
    explanation: Genetic initiating lesion in the original human cases.
  genes:
  - preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  downstream:
  - target: Aberrant PRKG2 Splicing
    causal_link_type: DIRECT
    description: The c.1630G>T allele activates a cryptic donor and changes exon-13 splicing.
    evidence:
    - reference: PMID:41574272
      reference_title: >-
        Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
        of acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Analysis of the proband’s father revealed aberrant transcripts, which were absent in controls and characterized
        by a 6-nucleotide truncation of exon 13
      explanation: Carrier fibroblast RNA establishes the splice consequence of c.1630G>T.
  - target: PRKG2 Transcript Depletion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Premature termination triggers transcript degradation for the founding variants; this is not universal
      across PRKG2 alleles.
    evidence:
    - reference: PMID:33106379
      reference_title: >-
        Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The mutant transcripts are exposed to nonsense-mediated decay
      explanation: >-
        Nonsense-mediated decay was reported for the two founding variants; this is allele-specific functional
        evidence.
    intermediate_mechanisms:
    - Nonsense-mediated decay
  - target: Reduced cGKII Protein Abundance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Some expressed human mutant constructs produce substantially less cGKII protein. These assays do not
      distinguish reduced synthesis from accelerated turnover.
    evidence:
    - reference: PMID:34782440
      reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: For both variants, cGKII was detected at the predicted size
      explanation: >-
        Immunoblotting detected the R569* and D761Efs*34 proteins; subsequent densitometry showed markedly
        reduced abundance.
  - target: Reduced cGKII Kinase Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered proteins fail to support the tested kinase-dependent signaling response; the relative contributions
      of low abundance and catalytic impairment are not resolved for every allele.
    evidence:
    - reference: PMID:34782440
      reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        neither R569* nor D761Efs*34 mutants were able to downregulate FGF2-induced ERK1/2 activation compared
        with WT
      explanation: Functional deficit in transient-expression assays. This is not a purified-kinase kinetic assay.
- name: Aberrant PRKG2 Splicing
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    The c.1630G>T allele produces two RNA populations: approximately half of variant-bearing transcripts in
    the carrier father have a six-nucleotide exon-13 deletion, while the rest retain the missense substitution.
    This is a transcript observation; the proposed p.Asp544_Arg545del and p.Asp544Tyr protein products were
    not assayed.
  evidence:
  - reference: PMID:41574272
    reference_title: >-
      Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
      of acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-

      evidence_source: MODEL_ORGANISM
      snippet: >-
        These experiments indicate that the R678X mutation is functional,
        resulting in a loss of PRKG2 regulation of COL2 and COL10 mRNA
        expression.
      explanation: Supports treating the bovine allele as informative for the collagen-program node.
- name: Dogo Argentino PRKG2 splice-site dwarfism
  species: Dog
  genotype: PRKG2 c.1634+1G>T homozygous
  publication: PMID:34680883
  genes:
  - preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  description: >-
    Two Dogo Argentino dogs with disproportionate dwarfism were homozygous for a
    PRKG2 splice-donor variant that segregated with the phenotype in a
    nine-animal family, a canine counterpart of the human splice-site alleles.
  modeled_mechanisms:
  - target: Impaired Endochondral Longitudinal Bone Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      A canine PRKG2 loss-of-function allele produces disproportionate dwarfism,
      supporting reduced longitudinal bone growth as the organism-level output of
      PRKG2 loss.
    limitations: >-
      The dogs were characterised clinically and genomically rather than
      histologically, so the growth-plate lesion itself was not measured, and
      canine breed conformation confounds proportionality assessment.
    evidence:
    - reference: PMID:34680883
      reference_title: PRKG2 Splice Site Variant in Dogo Argentino Dogs with Disproportionate Dwarfism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The genotypes of the PRKG2 variant were perfectly associated with the
        phenotype in the studied family of dogs.
      explanation: Segregation in a nine-animal family supports the allele as causal for the growth phenotype.
diagnosis:
- name: Molecular Confirmation of Biallelic PRKG2 Variants
  description: >-
    Diagnosis rests on identifying biallelic PRKG2 variants by exome or genome
    sequencing. Because the radiographic presentation overlaps AMDM and can
    resemble spondylometaphyseal dysplasia, PRKG2 is best reached through a
    broad skeletal-dysplasia panel or untargeted sequencing rather than a
    single-gene test.
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family 1, WGS and subsequent Sanger sequencing uncovered a homozygous
      pathogenic PRKG2 variant, NM_006259.3:c.2282dup (p.Asp761Glufs*34; online
      supplemental figure 1) in three brothers referred with spondylometaphyseal
      dysplasia
    explanation: >-
      Shows the diagnosis being made by genome sequencing in siblings whose
      referral diagnosis was a different radiographic category.
treatments: []
differential_diagnoses:
- name: Acromesomelic Dysplasia, Maroteaux Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Maroteaux type
    term:
      id: MONDO:0011275
      label: acromesomelic dysplasia 1, Maroteaux type
  description: >-
    The closest differential and the immediate upstream disorder in the same
    signalling axis: biallelic NPR2 variants disable the receptor that generates
    the cGMP signal cGKII transduces.
  distinguishing_features:
  - Biallelic NPR2 variants rather than biallelic PRKG2 variants establish AMDM.
  - >-
    Pronounced generalised cone-shaped epiphyses with phalangeal shortening are
    characteristic of AMDM; in the PRKG2 family presenting as spondylometaphyseal
    dysplasia, coning was subtle and unaccompanied by shortening.
  evidence:
  - reference: PMID:33106379
    reference_title: Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, biallelic variants in NPR2, encoding NPR-B, cause acromesomelic
      dysplasia, type Maroteaux, while heterozygous variants in NPR2 (natriuretic
      peptide receptor 2) and NPPC (natriuretic peptide precursor C), encoding
      CNP, cause milder phenotypes.
    explanation: Identifies the upstream NPR2 disorder that AMDP most closely resembles.
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metaphyses of the distal phalanges were somewhat cone-shaped in one
      child, but not pronounced, generalised or associated with shortening, as
      seen in AMDM.
    explanation: Gives the radiographic contrast between this PRKG2 family and AMDM.
- name: Spondylometaphyseal Dysplasia
  description: >-
    One PRKG2 family was referred with spondylometaphyseal dysplasia and had no
    acromesomelic shortening, so PRKG2 belongs in the differential of that
    radiographic category as well as of acromesomelic dysplasia.
  distinguishing_features:
  - >-
    Long slender femoral necks with platyspondyly and anterior vertebral body
    projections, without acromesomelic shortening, was the presenting pattern in
    the PRKG2 family reported by the 100,000 Genomes Project.
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, family 1 exhibited a skeletal phenotype characterised by
      spondylometaphyseal dysplasia, rather than acromesomelic dysplasia as
      expected in AMDP and AMDM.
    explanation: Documents the spondylometaphyseal presentation of biallelic PRKG2 loss.
discussions:
- discussion_id: cnp_axis_pharmacology_in_amdp
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  - pathophysiology#Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
  prompt: >-
    Would vosoritide, which acts upstream of cGKII, be expected to fail in AMDP
    where it succeeds in NPR2 deficiency?
  rationale: >-
    Vosoritide raises CNP signalling through NPR-B, which sits upstream of
    cGKII. A 2026 phase 2 basket trial reported a marked growth-velocity gain in
    children with heterozygous NPR2 variants, so the axis is pharmacologically
    tractable where receptor signalling is merely reduced. AMDP is the harder
    case in principle: the receptor is intact and it is the intracellular
    effector that is absent, so there may be nothing left to transduce the
    agonised signal. The mouse epistasis result points the same way, since
    growth-plate CNP overexpression fails to rescue the Prkg2-null skeleton.
    Against that, the human AMDP alleles are not all complete nulls and residual
    cGKII might be drivable. No treatment data of any kind have been published
    for AMDP, so this entry carries no treatments section rather than an
    inferred one. The `treatments: []` section is deliberately empty and present
    rather than absent, so that the absence of published management is a curated
    statement rather than an omission.
  evidence:
  - reference: PMID:41967490
    reference_title: A phase II basket trial of vosoritide in children with RASopathies, ACAN, and NPR2 deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vosoritide led to marked increases in growth velocity in children with
      RASopathies, ACAN, and NPR2 deficiency
    explanation: >-
      Establishes that CNP-analogue therapy works in a related axis disorder.
      Support is partial because the trial enrolled heterozygous NPR2 carriers,
      not AMDP or biallelic NPR2 disease.
  - reference: PMID:12193576
    reference_title: Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated endochondral ossification.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      targeted expression of CNP in the growth plate chondrocytes fails to
      rescue the skeletal defect of Prkg2(-/-) mice
    explanation: >-
      The mouse null is the closest available test of upstream agonism against
      cGKII loss, and it fails; support is partial because a complete mouse null
      may be a harsher test than a human hypomorphic genotype.
- discussion_id: prkg2_downstream_route_arbitration
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#raf1_mapk_brake_model
  - mechanistic_hypotheses#sox9_nuclear_exclusion_switch
  - mechanistic_hypotheses#gsk3b_beta_catenin_route
  prompt: >-
    Which cGKII substrate route carries the human AMDP phenotype, and in what
    proportion?
  rationale: >-
    Three routes have been proposed from the same kinase - c-Raf-1 Ser43 with
    MAPK restraint, SOX9 nuclear exclusion, and GSK-3beta inactivation with
    beta-catenin accumulation - each established in a different system, and none
    excludes the others. Only the first has been assayed against human AMDP
    alleles, and it was chosen as the assay largely because it was already the
    published readout rather than because it was shown to dominate. A single
    patient-derived chondrocyte or iPSC model measuring all three readouts on the
    same alleles would arbitrate this; the iPSC line already exists for one AMDP
    proband, so the experiment is tractable.
  proposed_experiments:
  - experiment_id: amdp_three_readout_arbitration
    name: Parallel three-readout assay of AMDP alleles in a chondrogenic model
    description: >-
      Express the reported AMDP alleles, spanning truncating, splice and missense
      classes, in a chondrogenic system and measure FGF2-induced ERK1/2
      phosphorylation, SOX9 nuclear localisation, and GSK-3beta phosphorylation
      with beta-catenin levels on the same samples, so the three proposed routes
      are compared rather than assumed.
    would_support:
    - pathophysiology#Loss of cGKII Restraint on the c-Raf-1/ERK1/2 Cascade
    - pathophysiology#Persistent Nuclear SOX9 in Postmitotic Chondrocytes
    - pathophysiology#Loss of GSK-3beta Inhibition and Reduced beta-Catenin Signaling
    supporting_outcome:
    - >-
      One readout is disturbed across all allele classes while the others track
      it only weakly, identifying the dominant route.
    - >-
      All three readouts move together across allele classes, supporting a
      genuinely multi-substrate mechanism rather than a single dominant route.
    refuting_outcome:
    - >-
      Allele severity in patients fails to correlate with any of the three
      readouts, indicating that the operative cGKII substrate in the human
      growth plate has not yet been identified.
- discussion_id: prkg2_residual_activity_and_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does residual cGKII activity set AMDP severity, as residual signalling does
    across the GDF5-BMPR1B acromesomelic dysplasias?
  rationale: >-
    A 2025 report attributes an attenuated phenotype to partial rather than
    complete loss of protein function, which is the same dose-response logic
    that separates du Pan syndrome from Grebe dysplasia in the other half of
    ISDS group 16. It is stated there as a hypothesis on one proband, and the
    reported PRKG2 families range from spondylometaphyseal dysplasia with no
    acromesomelic shortening to severe acromesomelic disease without a measured
    activity series to explain the spread. A systematic comparison of residual
    kinase activity against phenotype has not been done.
  attaches_to:
  - pathophysiology#Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
  - genetic#Biallelic PRKG2 Loss-of-Function Variants
  evidence:
  - reference: PMID:41574272
    reference_title: "Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype of acromesomelic dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesize that these alterations cause a partial, rather than a
      complete, loss of protein function, which may account for the patient's
      attenuated clinical phenotype.
    explanation: >-
      The dose-response account is offered as a hypothesis about a single
      proband, which is what makes this an open question rather than a curated
      mechanism.
- discussion_id: mapk_defect_direction_in_growth_plate
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of cGKII Restraint on the c-Raf-1/ERK1/2 Cascade
  prompt: >-
    By how much, and in which direction, does chondrocyte ERK1/2 output actually
    move when cGKII is lost?
  rationale: >-
    That cGKII restraint on the cascade is lost is established: mutant protein
    does not phosphorylate c-Raf-1 at Ser43, and one allele is reported as
    unable to down-regulate FGF2-induced MAPK signalling. What is not
    established is the magnitude or even the sign of the resulting change in a
    growth plate. The published assays are transfection experiments in HEK293T
    cells, and the abstract wording in two of the three reports is ambiguous
    between the mutant reducing ERK activation and the mutant failing to reduce
    it, which is a real hazard for anyone reading these entries against the
    sources. This entry therefore annotates the cascade ABNORMAL and its
    negative regulation DECREASED, names the node for the lesion, and leaves the
    output direction open. Measuring phospho-ERK in patient-derived or
    Prkg2-null growth-plate chondrocytes would close it.
notes: >-
  Curated as part of a review of ISDS 2023 nosology group 16 (acromesomelic
  dysplasias). No Orphanet structured record was cited: the pinned Orphadata
  snapshot in data/orphadata/MANIFEST.yaml no longer matches upstream, and
  re-pinning it would rewrite every ORPHA cache file in the repository, which is
  out of scope for this entry.

animal_models:
- name: Prkg2-null mouse
  species: Mouse
  genotype: Prkg2 knockout (homozygous null)
  publication: PMID:12193576
  genes:
  - preferred_term: PRKG2
    term:
      id: hgnc:9416
      label: PRKG2
  description: >-
    The engineered cGKII-null mouse is the reference genetic model. It is
    dwarfed with an elongated growth plate and impaired chondrocyte hypertrophy,
    and it is the model in which cGKII was placed downstream of CNP by showing
    that growth-plate CNP overexpression fails to rescue it.
  modeled_mechanisms:
  - target: Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      A complete genetic null of the same gene, giving the cleanest available
      readout of what losing cGKII does to the growth plate.
    limitations: >-
      Human AMDP alleles are mostly truncating but not always complete nulls,
      and mouse growth-plate proportions do not reproduce the human
      acromesomelic distribution of shortening.
    readouts:
    - name: Rescue of skeletal defect by growth-plate CNP overexpression
      target: Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
      direction: UNCHANGED
      interpretation: >-
        Supplying the upstream ligand does not correct the phenotype, placing the
        lesion downstream of CNP and cGMP production. This is the negative result
        that makes the epistasis argument.
      evidence:
      - reference: PMID:12193576
        reference_title: Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated endochondral ossification.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          targeted expression of CNP in the growth plate chondrocytes fails to
          rescue the skeletal defect of Prkg2(-/-) mice
        explanation: Reports the rescue failure directly.
    evidence:
    - reference: PMID:12193576
      reference_title: Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated endochondral ossification.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This study provides in vivo and in vitro genetic evidence that cGKII
        plays a critical role in CNP-mediated endochondral ossification.
      explanation: Supports treating the mouse null as informative for the cGKII node.
  - target: Loss of GSK-3beta Inhibition and Reduced beta-Catenin Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same null is the system in which the GSK-3beta route was identified
      and tested by compound genetics.
    limitations: >-
      The Gsk3b haploinsufficiency rescue is partial, so the model demonstrates
      that this route contributes without establishing how much of the phenotype
      it carries; nothing equivalent has been measured in human AMDP.
    readouts:
    - name: Growth plate length and chondrocyte hypertrophy under Gsk3b haploinsufficiency
      target: Loss of GSK-3beta Inhibition and Reduced beta-Catenin Signaling
      direction: RESTORED
      interpretation: >-
        Partial correction of the elongated growth plate when one Gsk3b allele is

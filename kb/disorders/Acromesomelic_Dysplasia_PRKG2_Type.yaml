- name: Impaired Hypertrophic Chondrocyte Differentiation
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    Delayed transition from postmitotic to hypertrophic chondrocytes produces an abnormal intermediate growth-plate
    layer in rodent models. In rat primary cultures, ALP and COL10 are reduced and recover after cGKII expression
    or SOX9 silencing. Collagen measurements are context dependent: Angus mutant growth plates showed increased
    COL2 and COL10 RNA, so reduced COL10 is not universal across models.
  evidence:
  - reference: PMID:15466490
    reference_title: >-
      Cyclic GMP-dependent protein kinase II is a molecular switch from proliferation to hypertrophic differentiation
      of chondrocytes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      the intermediate layer chondrocytes were abnormal cells that had ceased proliferation but had not started
      hypertrophic differentiation.
    explanation: Rat histology distinguishes delayed differentiation from a hyperproliferative layer.
  - reference: PMID:15466490
    reference_title: >-

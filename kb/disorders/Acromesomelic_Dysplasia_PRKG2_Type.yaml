notes: >-
  The 2022 middle brother with recurrent fractures, blue sclerae and osteopenia also had a de novo COL1A1 frameshift
  causing osteogenesis imperfecta; those findings are not assigned to PRKG2 disease here. Clinical evidence
  consists of small, selected families and cases, so no pooled phenotype frequencies are assigned. No PRKG2-specific
  GeneReviews or StatPearls chapter was identified in the repository inventories. There is no matching disorder-specific
  deep-research report; relevant PRKG2 passages in the related Maroteaux report were checked against primary
  literature. Full-text clinical studies and model papers were read, including the retrieved 2004 rat and 2024
  clinical articles; the founding 2020/2022 report, 2023 sibling study, 2002 CNP study, 2005 ATDC5 study and
  2021 iPSC report remain abstract-limited after retrieval attempts. The attempted institutional 2002 scan
  had no extractable cached text and the thesis contained only a citation to the founding study; neither is
  cited. Supplemental files were not independently reviewed. Source- and model-specific limitations are retained
  at the relevant claims.

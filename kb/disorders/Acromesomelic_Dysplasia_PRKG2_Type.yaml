    snippet: >-
      We hypothesize that these alterations cause a partial, rather than complete, loss of protein function
    explanation: The source explicitly presents hypomorphism as a hypothesis.
  discussion_id: residual_function
- kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced cGKII Kinase Function
  - pathophysiology#Impaired Endochondral Bone Growth
  prompt: Which interventions improve growth or function in molecularly confirmed PRKG2 disease?
  rationale: >-
    The reported growth-hormone exposure has no published outcome in that case report. CNP overexpression fails
    to rescue the Prkg2-null mouse, but this is not a human vosoritide trial and cannot settle responses of
    all partially functional alleles. The phase II vosoritide basket study included RASopathies, ACAN variants
    and heterozygous NPR2 variants, not PRKG2 disease; its efficacy cannot be transferred to this diagnosis.
  evidence:
  - reference: PMID:37789084
    reference_title: >-
      Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the
      first missense variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: GH treatment was started at the age of six.
    explanation: >-
      The paper reports treatment initiation in one patient but supplies no dose, subsequent height outcome
      or adverse-event assessment.
  - reference: PMID:12193576
    reference_title: >-
      Cyclic GMP-dependent protein kinase II plays a critical role in C-type natriuretic peptide-mediated endochondral
      ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      targeted expression of CNP in the growth plate chondrocytes fails to rescue the skeletal defect of Prkg2(-/-)
      mice
    explanation: Relevant negative model rescue, with an explicit limit on clinical extrapolation.
  - reference: PMID:41967490
    reference_title: A phase II basket trial of vosoritide in children with RASopathies, ACAN, and NPR2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

  downstream:
  - target: Reduced cGKII Kinase Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced available cGKII contributes to reduced signaling capacity, alongside any intrinsic catalytic
      defect.
    evidence:
    - reference: PMID:34782440
      reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: For both variants, cGKII was detected at the predicted size

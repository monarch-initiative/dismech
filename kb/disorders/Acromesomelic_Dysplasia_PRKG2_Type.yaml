    were challenged with a cGMP analog and FGF2; immunoblots measured cGKII abundance, RAF1 Ser43 phosphorylation
    and ERK1/2 activation. The studies used three biological experiments for their signaling comparisons.
  modeled_mechanisms:
  - target: Reduced cGKII Protein Abundance

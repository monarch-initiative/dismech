    explanation: RNA analysis clarifies a coding variant with an additional splice effect.
- name: Assessment of growth and skeletal maturation
  description: >-
    Endocrine and growth assessment complements skeletal imaging. Normal IGF-1 and other routine endocrine
    results occurred in reported cases; normal results do not exclude this primary skeletal disorder. Bone

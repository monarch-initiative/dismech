classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al., PMID:36779427), group 16 "Acromesomelic
      dysplasias"; listed as the PRKG2-linked acromesomelic dysplasia type (OMIM 619636). This entity was first
      reported in 2020 and so appears in the 2023 revision but not in the 2019 revision (PMID:31633310), which
      is why no 2019 group is recorded here.
    evidence:
    - reference: PMID:39441036
      reference_title: >-
        Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly
        as a Novel Clinical Finding.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        To date, four disease genes and seven distinct ACD subtypes with varying severity are recognised according
        to the 2023 revision of the nosology and classification of genetic skeletal disorders
      explanation: >-
        This is the sentence that ties the enumeration below to the 2023 ISDS nosology revision. It is quoted
        separately because the enumeration itself names diseases and OMIM numbers without repeating the nosology
        attribution, so on its own it would not support a group assignment.
    - reference: PMID:39441036
      reference_title: >-
        Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly
        as a Novel Clinical Finding.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The remaining three ACD types encompass NPR2-linked Maroteaux type (OMIM  # 602875), the PRKG2-linked
        ACD type (OMIM  # 619636) and Osebold-Remondini type, which is not yet associated with a genomic locus
        (OMIM  # 112910).
      explanation: >-
        A 2024 report enumerating the seven acromesomelic chondrodysplasia types recognised by the 2023 nosology
        revision places the PRKG2-linked type inside that group.
description: >-
  Acromesomelic dysplasia, PRKG2 type is a rare autosomal recessive skeletal dysplasia caused by biallelic
  PRKG2 variants that impair cGMP-dependent protein kinase II (cGKII). Reported presentations range from marked
  acromesomelic shortening and brachydactyly to a predominantly spondylometaphyseal dysplasia without obvious
  acromesomelia, and an attenuated presentation with moderate short stature. Vertebral, metaphyseal, digital
  and femoral-neck abnormalities vary between and within families. Human-variant cell assays demonstrate deficient
  regulation of FGF2-induced RAF/ERK signaling, while rodent experiments implicate impaired hypertrophic chondrocyte
  differentiation through distinct SOX9 and GSK3β-related routes. These experimental molecular findings have
  not been measured directly in patient growth plates.
prevalence:
- population: Published molecularly characterized families
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The 2024 report summarized ten individuals from seven families, including its two new patients. This is
    a dated literature count rather than a population prevalence estimate; the later compound-heterozygous
    case expands that literature.
  evidence:
  - reference: PMID:37789084
    reference_title: >-
      Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the
      first missense variant.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: variants have been reported in 10 individuals from seven different families
    explanation: >-
      The surrounding 2024 discussion counts six variants in ten individuals from seven families. No population
      denominator was studied.
progression:
- phase: Infancy and childhood
  notes: >-
    Growth deficiency may become apparent during infancy despite normal birth length, although prenatal long-bone
    shortening or short birth length has also been reported. In the attenuated case, height was −2.81 SD at
    one year, −3.0 SD at eight years and −2.81 SD at nine years; this does not establish universal progressive
    worsening.
  evidence:
  - reference: PMID:41574272
    reference_title: >-
      Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an attenuated phenotype
      of acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The parents first noticed growth retardation at the age of 6 months
    explanation: Infantile recognition in the attenuated case.
  - reference: PMID:37789084
    reference_title: >-
      Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the
      first missense variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Relative macrocephaly and slow linear growth were noted at 9 months old.
    explanation: Infantile recognition in the first 2024 patient.
  - reference: PMID:37789084
    reference_title: >-
      Two new patients with acromesomelic dysplasia, PRKG2 type-identification and characterization of the
      first missense variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: birth length 42 cm (−3.5 SDS)
    explanation: The second 2024 patient was short at birth.
- phase: Variable skeletal evolution
  notes: >-
    The founding two girls had progressively increasing metaphyseal alterations. Annual observation of one
    older brother from ages five to twenty showed worsening short stature but less conspicuous platyspondyly
    and anterior beaking. His younger brother had less severe short stature and greater vertebral involvement
    at comparable ages. These small case series do not define a uniform natural history.
  evidence:
  - reference: PMID:33106379
    reference_title: >-
      Biallelic cGMP-dependent type II protein kinase gene (PRKG2) variants cause a novel acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      mild to moderate platyspondyly and progressively increasing metaphyseal alterations of the long bones
    explanation: Founding two-patient observation.
  - reference: PMID:36504352
    reference_title: Natural history of clinical features in two brothers with acromesomelic dysplasia related to PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Annual follow-ups of the older brother from the age of 5 to 20 years revealed progression of short stature
      with age but platyspondyly and anterior beaking became less conspicuous.
    explanation: Longitudinal observation of one brother, not the whole syndrome.

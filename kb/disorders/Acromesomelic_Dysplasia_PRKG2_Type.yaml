diagnosis:
- name: Clinical and radiographic assessment with molecular confirmation
  description: >-
    Evaluate disproportionate growth and limb, hand, femoral-neck and spinal findings. A predominantly spondylometaphyseal
    presentation does not exclude PRKG2 disease. Exome or genome analysis can identify biallelic variants;
    segregation and, where needed, variant-specific RNA or functional studies help interpretation. A negative
    older panel can reflect omission of PRKG2.
  evidence:
  - reference: PMID:34782440
    reference_title: Variable skeletal phenotypes associated with biallelic variants in PRKG2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

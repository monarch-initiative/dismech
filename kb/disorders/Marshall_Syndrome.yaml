      label: Short stature
  evidence:
  - reference: PMID:10486316
    reference_title: Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been suggested that Marshall syndrome differs from Stickler syndrome in that patients with Marshall syndrome more often have short stature, deafness, and abnormalities in cranial ossification and more-pronounced dysmorphic features
    explanation: >-
      Names short stature as one of the features proposed to distinguish the two
      syndromes.
- name: Premature osteoarthritis
  category: Musculoskeletal
  description: >-
    Early-onset degenerative arthropathy, the long-term cost of a defective
    cartilage collagen matrix. It is the feature most likely to require surgery
    in adult life.
  phenotype_term:
    preferred_term: Premature osteoarthritis
    term:
      id: HP:0003088
      label: Premature osteoarthritis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:9188673
    reference_title: "Oto- spondylo-megaepiphyseal dysplasia (OSMED): clinical description of three patients homozygous for a missense mutation in the COL11A2 gene."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologic study of cartilage shows severe osteoarthritis, which may necessitate joint replacements in early adulthood.
    explanation: >-
      Documents the early severe arthropathy of collagen XI disease and its
      surgical consequence. Indirect because the patients studied carried
      COL11A2 variants (OSMED); the same paper argues on phenotypic grounds that
      Marshall syndrome is the COL11A1 counterpart.
- name: Glaucoma
  category: Ophthalmologic
  description: >-
    Reported with goniodysgenesis, so anterior-segment involvement belongs in
    the ophthalmic assessment alongside the vitreoretinal work.
  phenotype_term:
    preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:9235398
    reference_title: "[Lens coloboma and lens dislocation in Stickler (Marshall) syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We are reporting on a female patient with typical ocular and systemic manifestations of both syndromes: high myopia, glaucoma and goniodysgenesis, submucosal cleft palate, sensorineural hearing loss, and "flat" mid-face.
    explanation: >-
      Documents glaucoma with goniodysgenesis in a patient with the syndrome.
- name: Ectopia lentis
  category: Ophthalmologic
  description: >-
    Lens subluxation, reported rarely and in one case with a lens coloboma. It
    matters chiefly because it puts this disorder on the differential for
    inherited ectopia lentis, where it is not usually considered.
  phenotype_term:
    preferred_term: Ectopia lentis
    term:
      id: HP:0001083
      label: Ectopia lentis
  evidence:
  - reference: PMID:9235398
    reference_title: "[Lens coloboma and lens dislocation in Stickler (Marshall) syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Coloboma and subluxation of the lens have to be regarded as possible manifestations of the Stickler (Marshall) syndrome. The syndrome(s) should be included in the differential diagnosis of ectopia lentis-associated systemic diseases.
    explanation: >-
      The authors' conclusion that lens subluxation belongs in the phenotype and
      that the syndrome belongs on the ectopia lentis differential.
genetic:
- name: COL11A1
  association: Causal heterozygous variant
  gene_term:
    preferred_term: COL11A1
    term:
      id: hgnc:2186
      label: COL11A1
  frequency: The only gene associated with Marshall syndrome.
  notes: >-
    Two practical points about testing. First, the gene is around 250 kb with 68
    exons, and large intragenic deletions are a real and previously
    underestimated share of COL11A1 disease; exon sequencing alone will miss
    them, so a dosage assay belongs in the workup. Second, the variant class
    carries prognostic weight: a 54-bp C-terminal splice variant, and the intron
    50 hot spot in particular, predicts the Marshall end of the spectrum with
    its early severe deafness, while other lesion classes predict the
    overlapping Marshall/Stickler picture. That correlation is a tendency drawn
    from two modest cohorts, not a rule to counsel from.
  evidence:
  - reference: PMID:17236192
    reference_title: A report on 10 new patients with heterozygous mutations in the COL11A1 gene and a review of genotype-phenotype correlations in type XI collagenopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A series of 44 unrelated patients in whom COL2A1 screening demonstrated normal results but whose phenotype was nevertheless highly suggestive of either Stickler syndrome (with ocular involvement) or Marshall syndrome were investigated for mutations in the COL11A1 gene. Heterozygous COL11A1 mutations were found in 10 individuals.
    explanation: >-
      Gives both the causal gene and the yield in a clinically selected,
      COL2A1-negative series - 10 of 44.
  - reference: PMID:17236192
    reference_title: A report on 10 new patients with heterozygous mutations in the COL11A1 gene and a review of genotype-phenotype correlations in type XI collagenopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The remaining 6/10 patients had an overlapping Marshall-Stickler phenotype with less pronounced facial features. None of these had a mutation in the hot spot region of intron 50.
    explanation: >-
      The other half of the genotype-phenotype correlation: the overlapping
      phenotypes lacked the hot-spot variant.
  - reference: PMID:23621912
    reference_title: Deletions within COL11A1 in Type 2 stickler syndrome detected by multiplex ligation-dependent probe amplification (MLPA).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exon deletions appear to represent a significant proportion of type 2 Stickler syndrome. This observation was previously unknown and so diagnostic screening of COL11A1 should include assays capable of detecting both large and small deletions, in addition to exon sequencing.
    explanation: >-
      The basis for including a deletion assay in testing rather than relying on
      exon sequencing.
treatments:
- name: Retinal surveillance and prophylactic retinal intervention
  description: >-
    Regular dilated retinal examination from childhood, with prophylactic laser
    or cryotherapy to reduce detachment risk in selected eyes. This is the
    intervention with the most to gain and the least settled evidence: the
    systematic review that covers it found no consensus and no guidelines, so
    the practice is reasonable extrapolation rather than demonstrated benefit.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: prophylactic retinal laser therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  target_phenotypes:
  - preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  evidence:
  - reference: PMID:21466760
    reference_title: "The clinical effectiveness and safety of prophylactic retinal interventions to reduce the risk of retinal detachment and subsequent vision loss in adults and children with Stickler syndrome: a systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there is no consensus regarding best practice and no current guidelines on prophylactic interventions for this population.
    explanation: >-
      Records the state of the evidence honestly: the intervention is offered,
      and it is not standardised. Indirect because the review addresses Stickler
      syndrome, from which practice in Marshall syndrome is extrapolated.
- name: Hearing amplification and cochlear implantation
  description: >-
    Amplification early, to protect language acquisition, and cochlear
    implantation as the loss progresses. The cochlear localisation of the
    deficit is what makes implantation a rational option rather than a hopeful
    one.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:10889003
    reference_title: Audiovestibular phenotype associated with a COL11A1 mutation in Marshall syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study subjects have progressive sensorineural hearing loss that is predominantly cochlear in origin
    explanation: >-
      Establishes the cochlear site of the lesion, which is the premise for
      amplification and implantation. Indirect because the study characterises
      the deficit rather than reporting an intervention outcome.
- name: Joint replacement for degenerative arthropathy
  description: >-
    Arthroplasty for the early-onset osteoarthritis, which in the related
    COL11A2 disorder has been needed as early as young adulthood.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: joint arthroplasty
    term:
      id: NCIT:C51691
      label: Arthroplasty
  target_phenotypes:
  - preferred_term: Premature osteoarthritis
    term:
      id: HP:0003088
      label: Premature osteoarthritis
  evidence:
  - reference: PMID:9188673
    reference_title: "Oto- spondylo-megaepiphyseal dysplasia (OSMED): clinical description of three patients homozygous for a missense mutation in the COL11A2 gene."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologic study of cartilage shows severe osteoarthritis, which may necessitate joint replacements in early adulthood.
    explanation: >-
      The basis for anticipating arthroplasty. Indirect: the observation is from
      COL11A2 OSMED patients, and is applied here on the argument of collagen XI
      mechanism shared between the two genes.
- name: Genetic counselling
  description: >-
    Fifty per cent recurrence risk for the offspring of an affected parent in
    the usual dominant form, and 25 per cent in the reported recessive families
    once the biallelic variant is known. Counselling also has to cover the
    variable expressivity, which is wide enough within one family that a mildly
    affected parent is not a guide to how a child will be affected.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26367406
    reference_title: "[Marshall syndrome: Clinical, radiological and genetical features of a Tunisian family]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a variability of the clinical expression among the affected members of the study's family.
    explanation: >-
      Documents the within-family variability that counselling has to convey.
diagnosis:
- name: COL11A1 sequencing with a deletion/duplication assay
  description: >-
    Sequence COL11A1, and pair it with a dosage assay. In practice this is done
    within a type II/IX/XI collagenopathy panel, since the clinical picture does
    not reliably separate COL11A1 from COL2A1 or COL11A2 before testing.
  results: >-
    A heterozygous COL11A1 splice-site variant, most often at a 54-bp C-terminal
    exon; alternatively a glycine missense variant or a multi-exon deletion.
  evidence:
  - reference: PMID:23621912
    reference_title: Deletions within COL11A1 in Type 2 stickler syndrome detected by multiplex ligation-dependent probe amplification (MLPA).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have used Multiplex Ligation-Dependent Probe Amplification (MLPA) in conjunction with exon amplification and sequencing, to analyze patients with clinical features of Stickler syndrome, and have detected six novel deletions that were not found by exon sequencing alone.
    explanation: >-
      Demonstrates the deletions that sequencing alone misses, which is why the
      dosage assay is part of the recommended workup rather than a reflex test.
- name: Audiometry with temporal bone imaging
  description: >-
    Pure-tone audiometry to document the degree and progression of the
    sensorineural loss, with temporal bone CT. The expected imaging result is a
    normal osseous labyrinth; that normality is informative, because it places
    the lesion in the membranous labyrinth and argues against a malformation
    syndrome.
  results: >-
    Progressive, predominantly cochlear sensorineural hearing loss with normally
    formed temporal bone structures.
  evidence:
  - reference: PMID:10889003
    reference_title: Audiovestibular phenotype associated with a COL11A1 mutation in Marshall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical otolaryngologic, audiologic, vestibular, and radiologic evaluations of the auditory and vestibular systems.
    explanation: >-
      The assessment battery this recommendation is drawn from.
- name: Ophthalmologic assessment
  description: >-
    Refraction, slit-lamp examination for cataract and lens position, gonioscopy
    and tonometry, and dilated fundoscopy for vitreoretinal degeneration. The
    anterior-segment elements are easy to omit and have both been reported.
  results: >-
    High myopia, congenital or juvenile cataract, vitreoretinal degeneration,
    and in some patients goniodysgenesis with glaucoma or lens subluxation.
  evidence:
  - reference: PMID:9235398
    reference_title: "[Lens coloboma and lens dislocation in Stickler (Marshall) syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we observed subluxation of the ocular lens in one eye which was previously described in only a few cases.
    explanation: >-
      The rare anterior-segment finding that justifies examining lens position
      rather than stopping at refraction and fundoscopy.
differential_diagnoses:
- name: Stickler syndrome type 2
  description: >-
    The allelic neighbour, and the one that matters. Both are COL11A1. The
    working discriminators are the variant class (54-bp C-terminal splice
    variants track Marshall) and the audiological phenotype (earlier and more
    severe in Marshall), together with the facial gestalt. Neither is
    absolute, and patients with both phenotypes are reported.
  disease_term:
    preferred_term: Stickler syndrome type 2
    term:
      id: MONDO:0011493
      label: Stickler syndrome type 2
  distinguishing_features:
  - Splice variants of the 54-bp C-terminal COL11A1 exons, the intron 50 hot spot in particular
  - Earlier-onset and more severe sensorineural hearing loss
  - More pronounced midfacial hypoplasia and a more distinctive facial gestalt
  - Short stature reported more often
  evidence:
  - reference: PMID:17236192
    reference_title: A report on 10 new patients with heterozygous mutations in the COL11A1 gene and a review of genotype-phenotype correlations in type XI collagenopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4/10 patients the phenotype was classified as Marshall syndrome because of early-onset severe hearing loss and characteristic facial features. These four patients were all heterozygous for a splice site mutation in intron 50.
    explanation: >-
      Shows the clinical criteria actually used to split the two, and the
      genotype that accompanied the split in this cohort.
  - reference: PMID:9235398
    reference_title: "[Lens coloboma and lens dislocation in Stickler (Marshall) syndrome]."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probably, both syndromes represent the same entity with occasional partially different clinical manifestations.
    explanation: >-
      Recorded as a refutation of the separate-entity claim, not as a hedge.
      These authors, reporting a patient with features of both, take the view
      that Marshall and Stickler are one disorder. Curating the split without
      this dissent would overstate how settled the question is.
- name: Stickler syndrome type 1
  description: >-
    The COL2A1 form, and the most common. Distinguished by its hearing loss more
    than by anything else: mild, high-frequency, and no more progressive than
    presbycusis, against the early severe loss of Marshall syndrome. Retinal
    detachment risk is at least as high, so the distinction does not change
    ophthalmic surveillance.
  disease_term:
    preferred_term: Stickler syndrome type 1
    term:
      id: MONDO:0007160
      label: Stickler syndrome type 1
  distinguishing_features:
  - COL2A1 rather than COL11A1
  - Mild, non-progressive high-frequency sensorineural hearing loss
  - Hypermobile middle ear systems reported as a diagnostic feature
  evidence:
  - reference: PMID:11556853
    reference_title: Auditory dysfunction in Stickler syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall sensorineural hearing loss in type I Stickler syndrome is typically mild and not significantly progressive. It is less severe than that reported for types II and III Stickler syndrome linked to COL11A2 (OMIM 120290) and COL11A1 (OMIM 120280) mutations, respectively, or the closely related Marshall syndrome.
    explanation: >-
      The audiological contrast, drawn from 46 affected individuals in 29
      families, that makes hearing the most useful discriminator.
- name: Otospondylomegaepiphyseal dysplasia
  description: >-
    The COL11A2 disorder. It shares midface hypoplasia, deafness and epiphyseal
    dysplasia, and its recessive form is severe. The clean separator is ocular:
    COL11A2 is not expressed in vitreous, so OSMED has no myopia and no
    vitreoretinopathy, while the ocular features are central to Marshall
    syndrome.
  disease_term:
    preferred_term: otospondylomegaepiphyseal dysplasia, autosomal recessive
    term:
      id: MONDO:0044206
      label: otospondylomegaepiphyseal dysplasia, autosomal recessive
  distinguishing_features:
  - COL11A2 rather than COL11A1
  - No high myopia and no vitreoretinal degeneration
  - Megaepiphyses with severe epiphyseal dysplasia
  evidence:
  - reference: PMID:9188673
    reference_title: "Oto- spondylo-megaepiphyseal dysplasia (OSMED): clinical description of three patients homozygous for a missense mutation in the COL11A2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a syndrome of midface hypoplasia, non-progressive sensorineural deafness and epiphyseal dysplasia in 3 sibs born to consanguineous parents.
    explanation: >-
      Describes the overlapping OSMED phenotype in the three siblings this
      differential is drawn from.
  - reference: PMID:9188673
    reference_title: "Oto- spondylo-megaepiphyseal dysplasia (OSMED): clinical description of three patients homozygous for a missense mutation in the COL11A2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these, Marshall syndrome is very similar to OSMED. Considering these phenotypic similarities and the close association between the COL11A1 and COL11A2 gene products, we propose that Marshall syndrome may be caused by a mutation in COL11A1.
    explanation: >-
      The phenotypic similarity is strong enough that it was the argument by
      which COL11A1 was first predicted as the Marshall gene - which is also why
      OSMED is the differential most likely to be confused with it.
animal_models:
- name: cho/cho chondrodysplasia mouse
  species: Mouse
  genotype: Col11a1 cho allele, homozygous (single-cytidine deletion causing a frameshift and premature stop)
  publication: PMID:7859283
  description: >-
    A spontaneous Col11a1 null that mapped the gene and established what
    collagen XI does. It is the source of the cartilage mechanism in this entry
    and it is not a model of the human disease: it is recessive and null where
    the human disorder is dominant and dominant-negative, and it dies at birth.
  modeled_mechanisms:
  - target: Defective Heterotypic Collagen II/XI Fibril Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Cartilage collagen fibrils fail to form normally in the absence of
      collagen XI, which is the assertion this node makes.
    limitations: >-
      Complete loss of function, in the homozygote, of a gene that in humans
      causes disease in the heterozygous dominant-negative state. The null
      removes collagen XI; the human allele contaminates it. The two are not the
      same lesion and the mouse cannot show that a shortened chain is worse than
      no chain.
    evidence:
    - reference: PMID:7859283
      reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The data demonstrate that collagen XI is essential for normal formation of cartilage collagen fibrils and the cohesive properties of cartilage.
      explanation: >-
        The fibril-assembly conclusion the model supports.
  - target: Growth Plate Chondrocyte Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Growth-plate chondrocyte differentiation and spatial organisation depend
      on collagen XI in the matrix.
    limitations: >-
      Neonatally lethal, so it reports on skeletal morphogenesis only and can say
      nothing about the progressive postnatal features - the myopia, the
      vitreoretinal degeneration, the progressive deafness, the adult
      osteoarthritis - that make up most of the human disease burden.
    readouts:
    - name: Long bone length and metaphyseal width
      target: Growth Plate Chondrocyte Disorganization
      direction: DECREASED
      interpretation: >-
        Shortened, metaphyseally widened limb bones as the structural readout of
        disorganised growth-plate cartilage.
      evidence:
      - reference: PMID:7859283
        reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Limb bones of newborn cho/cho mice are wider at the metaphyses than normal bones and only about half the normal length.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:7859283
      reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The results also suggest that the normal differentiation and spatial organization of growth plate chondrocytes is critially dependent on the presence of type XI collagen in cartilage extracellular matrix.
      explanation: >-
        Links collagen XI loss to growth-plate chondrocyte organisation.
        Reproduces the source's spelling of "critially".
  evidence:
  - reference: PMID:7859283
    reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice that are homozygous for the autosomal recessive chondrodysplasia (cho) mutation die at birth with abnormalities in cartilage of limbs, ribs, mandible, and trachea.
    explanation: >-
      Describes the model and its neonatal lethality, which is the limit on what
      it can be used for.
- name: col11a1a morphant zebrafish
  species: Zebrafish
  genotype: col11a1a antisense morpholino knockdown
  publication: PMID:36278545
  description: >-
    A craniofacial knockdown model. Its value here is specificity: it shows the
    cartilage-organisation defect in Meckel's cartilage, the first pharyngeal
    arch cartilage that prefigures the lower jaw, which is the closest available
    experimental correlate of the human midface phenotype.
  modeled_mechanisms:
  - target: Growth Plate Chondrocyte Disorganization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Knockdown disorganises the chondrocytes of Meckel's cartilage and disturbs
      the adjacent bone formation.
    limitations: >-
      Morpholino knockdown rather than a genetic allele, so off-target and
      transient-knockdown caveats apply and no stable line is characterised.
      Zebrafish craniofacial cartilage is not a mammalian growth plate, and the
      human lesion is a dominant-negative chain rather than reduced gene
      product, so this supports the general requirement for col11a1a in
      cartilage organisation rather than the specific human mechanism.
    evidence:
    - reference: PMID:36278545
      reference_title: "The Shape of the Jaw-Zebrafish Col11a1a Regulates Meckel's Cartilage Morphogenesis and Mineralization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results demonstrate that zebrafish col11a1a knockdown impairs the cellular organization of Meckel's cartilage in the developing jaw and alters the bone formation that occurs adjacent to the Meckel's cartilage.
      explanation: >-
        The craniofacial cartilage result this link rests on.
discussions:
- discussion_id: gap_marshall_vs_stickler2_nosology
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are Marshall syndrome and Stickler syndrome type 2 two diseases or one, and
    does the 54-bp C-terminal splice correlation hold in a cohort large enough
    to counsel from?
  attaches_to:
  - disease#Marshall Syndrome
  - genetic#COL11A1
  - pathophysiology#Heterozygous COL11A1 54-bp Exon Splice-Site Variant
  rationale: >-
    dismech currently carries both as separate entries, and the evidence for
    that split is thinner than the separation implies. It rests on two cohorts:
    23 novel COL11A1 variants across a mixed Marshall/Stickler/Stickler-like
    screen, and a series in which 4 of 10 COL11A1-positive patients were
    labelled Marshall - and in that second series the label was assigned on
    clinical grounds first and the genotype correlation observed afterwards,
    which is a weaker design than it looks. Against the split: patients with
    features of both syndromes are reported in both cohorts and within a single
    Tunisian family, and at least one group states outright that the two are
    one entity. What would settle it is a COL11A1 cohort large enough to test
    whether the 54-bp C-terminal splice class separates from other classes on
    prospectively collected audiological and facial measures, rather than on
    labels assigned before genotyping.
- discussion_id: mismatch_marshall_dominant_negative_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every available animal model of Col11a1 is a loss-of-function null, while
    human Marshall syndrome is a dominant-negative disorder. Does the null
    phenotype tell us anything about what a shortened, co-assembling chain does?
  attaches_to:
  - pathophysiology#Dominant-Negative Poisoning of the Collagen XI Heterotrimer
  - animal_models#cho/cho chondrodysplasia mouse
  - animal_models#col11a1a morphant zebrafish
  rationale: >-
    This is a mismatch rather than a gap: the model evidence exists and is good,
    but it is evidence about the wrong lesion. The cho/cho mouse and the
    col11a1a morphant both remove collagen XI. The human allele does something
    different and, on the face of it, worse - it supplies a defective chain that
    enters the heterotrimer and disrupts a fibril the normal allele is also
    trying to build. The entry's cartilage mechanism is therefore borrowed from
    a null phenotype, and the specifically dominant-negative step is supported
    only by the in-frame/in-register argument from collagen gene structure. The
    mouse is also neonatally lethal in the homozygote, so it cannot report on any
    of the progressive postnatal features. A knock-in carrying a 54-bp
    C-terminal splice variant on one allele would test the mechanism directly;
    none has been reported.
  proposed_experiments:
  - experiment_id: exp_marshall_het_splice_knockin_mouse
    name: Heterozygous 54-bp exon splice knock-in mouse
    description: >-
      Engineer the intron 50 donor-site change (or the equivalent murine 54-bp
      C-terminal exon) as a single heterozygous allele and phenotype the animals
      into adulthood, rather than using a null.
    would_support:
    - pathophysiology#Dominant-Negative Poisoning of the Collagen XI Heterotrimer
    supporting_outcome:
    - >-
      Heterozygotes show cartilage fibril disorganisation, vitreous abnormality
      and progressive cochlear hearing loss, with a phenotype more severe than
      Col11a1 heterozygous nulls examined in parallel.
    refuting_outcome:
    - >-
      Heterozygous knock-in animals are indistinguishable from heterozygous
      nulls, which would place the mechanism at reduced collagen XI dosage
      rather than at active interference by the shortened chain.
notes: >-
  Three things a curator or reader should carry away from this entry.

  The eponym is ambiguous and the ambiguity is dangerous for automated
  literature work. "Marshall syndrome" also names PFAPA - periodic fever,
  aphthous stomatitis, pharyngitis and adenitis, a common paediatric
  autoinflammatory disease - and acquired cutis laxa type II. A keyword search
  on the name returns all three, and the PFAPA literature is by far the largest
  of the three. Every reference in this entry was checked to be about the
  COL11A1 disorder.

  The Marshall/Stickler type 2 split is recorded, not asserted. See the
  knowledge-gap discussion. The entry deliberately includes a published
  statement that the two are a single entity, graded REFUTE against the
  separate-entity claim, rather than only citing the sources that support the
  split.

  Several evidence items are marked directness INDIRECT because the study
  populations are neighbouring collagenopathies rather than Marshall syndrome
  itself - the retinal-detachment prophylaxis review and the auditory natural
  history study are Stickler cohorts, and the arthropathy and joint-replacement
  observations come from COL11A2 OSMED patients. That is the real evidence base
  for this ultra-rare disorder, and marking it is more useful than either
  omitting the claims or presenting borrowed evidence as direct.

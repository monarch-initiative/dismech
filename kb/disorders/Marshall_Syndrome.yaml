name: Marshall Syndrome
creation_date: "2026-09-11T11:40:00Z"
category: Mendelian
synonyms:
- MRSHS
- deafness, myopia, cataract, saddle nose-Marshall type
- Marshall syndrome (COL11A1)
description: >-
  Marshall syndrome is a dominantly inherited type XI collagenopathy caused by
  heterozygous COL11A1 variants, presenting from infancy with midfacial
  hypoplasia and a depressed nasal bridge, high myopia with congenital or
  juvenile cataract and vitreoretinal degeneration, and an early, severe,
  progressive sensorineural hearing loss that is predominantly cochlear. Short
  stature, cleft palate and early-onset osteoarthritis complete the picture.

  The mechanism is dominant negative rather than haploinsufficient, and that
  distinction is what organises the rest of the entry. The characteristic
  variant class is a splice-site change at one of the 54-bp exons in the
  C-terminal region of COL11A1. Because collagen exons are sized to keep the
  Gly-Xaa-Yaa repeat in register, skipping one leaves the message in frame, so
  the cell makes a shortened but stable proalpha1(XI) chain that still
  co-assembles into the collagen XI heterotrimer and poisons it. Collagen XI
  templates the diameter of heterotypic collagen II/XI fibrils, so the
  consequences fall on the three tissues that depend most on precisely
  organised fibrils: growth-plate cartilage, the ocular vitreous, and the
  membranous labyrinth.

  Whether Marshall syndrome is a disease distinct from Stickler syndrome type 2
  has been argued since the 1970s, and dismech does not treat the question as
  closed. The two are allelic - both are COL11A1 - and individual patients with
  features of both are reported repeatedly, including within a single family.
  What supports separating them is a genotype-phenotype correlation (the 54-bp
  C-terminal splice class tracks the Marshall end) and an audiological one (the
  hearing loss is earlier and more severe than in Stickler type 1). The entry
  records the correlation, the overlap, and a published argument that the two
  are one entity, rather than asserting the split and leaving the dissent out.

  A practical warning, because it is a live source of error rather than a
  curiosity: the eponym "Marshall syndrome" is also used for PFAPA (periodic
  fever, aphthous stomatitis, pharyngitis, adenitis) and for acquired cutis
  laxa type II. Neither has anything to do with COL11A1. A literature search on
  the name alone returns all three.

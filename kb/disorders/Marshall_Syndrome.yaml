  category: Otologic
  diagnostic: true
  description: >-
    Early-onset, severe, progressive and predominantly cochlear. Its severity
    and early onset are the single most useful clinical discriminator from
    Stickler type 1, where the hearing loss is mild and largely
    non-progressive.
  phenotype_term:

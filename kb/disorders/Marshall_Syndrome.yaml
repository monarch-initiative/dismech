    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study subjects have progressive sensorineural hearing loss that is predominantly cochlear in origin and asymptomatic dysfunction of the central and peripheral vestibular systems.
    explanation: >-
      Characterises the hearing loss as progressive and cochlear, and notes the
      subclinical vestibular involvement that accompanies it.
  - reference: PMID:11556853
    reference_title: Auditory dysfunction in Stickler syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall sensorineural hearing loss in type I Stickler syndrome is typically mild and not significantly progressive. It is less severe than that reported for types II and III Stickler syndrome linked to COL11A2 (OMIM 120290) and COL11A1 (OMIM 120280) mutations, respectively, or the closely related Marshall syndrome.
    explanation: >-
      Supports the severity claim by contrast. Indirect because the cohort
      studied was Stickler syndrome and the statement about Marshall syndrome is
      a comparison the authors draw rather than a measurement they made.

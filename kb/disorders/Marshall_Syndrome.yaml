inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The usual mode. A single heterozygous COL11A1 allele is sufficient because
    the mechanism is dominant negative: the shortened chain is made, is stable,
    and interferes with the heterotrimer that the normal allele also
    contributes to.
  evidence:
  - reference: PMID:10486316
    reference_title: Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stickler and Marshall syndromes are dominantly inherited chondrodysplasias characterized by midfacial hypoplasia, high myopia, and sensorineural-hearing deficit.
    explanation: >-
      States the dominant mode of inheritance alongside the cardinal triad.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A recessive form has been reported twice, both times from Saudi Arabia and
    both times with the same missense allele c.2702G>A (p.Gly901Glu) in
    homozygous form. It is recorded here because it is reproducible rather than
    anecdotal, but it is the exception; do not treat a negative parental
    examination as excluding the diagnosis in a consanguineous family.
  evidence:
  - reference: PMID:25073711
    reference_title: "Marshall syndrome: further evidence of a distinct phenotypic entity and report of new findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we describe the clinical presentations of seven patients with Marshall syndrome from three unrelated Saudi families, inherited as autosomal dominant (two families) and autosomal recessive (one family).
    explanation: >-
      Reports both modes segregating in one clinical series, with the recessive
      form in one of the three families.
  - reference: PMID:25073711
    reference_title: "Marshall syndrome: further evidence of a distinct phenotypic entity and report of new findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the first report of autosomal recessive Marshall syndrome was from Saudi Arabia caused by the same mutation (c.2702G > A, p.Gly901Glu) as in one of our families.
    explanation: >-
      Establishes that the recessive form has been seen twice with the same
      allele, which is why it is recorded as a mode rather than as a single
      unreplicated observation.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    The only figure in the literature, and it is a statement in a single case
    report rather than a population study. Treat it as an order-of-magnitude
    claim about rarity, not a measured rate. Case ascertainment is further
    confounded by the Marshall/Stickler boundary - a patient counted as
    Stickler type 2 in one centre may be counted as Marshall in another.
  evidence:
  - reference: PMID:38062645
    reference_title: "Growing up with Marshall syndrome: A case report from infancy to age 12.5 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Marshall syndrome is an extremely rare genetic disorder usually diagnosed in infancy with a prevalence of <1 in 1 million.
    explanation: >-
      The prevalence statement itself, together with the infancy onset.
pathophysiology:
- name: Heterozygous COL11A1 54-bp Exon Splice-Site Variant
  biological_scale: MOLECULAR
  description: >-
    A splice-site change affecting one of the 54-bp exons in the C-terminal
    region of COL11A1. Intron 50 (c.3816+1G>A) is a recurrent hot spot. Other
    COL11A1 lesion classes exist - missense glycine substitutions and large
    intragenic deletions - but they correlate with the overlapping
    Marshall/Stickler end of the spectrum rather than with the Marshall
    phenotype proper.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  genes:
  - preferred_term: COL11A1
    term:
      id: hgnc:2186
      label: COL11A1
  downstream:
  - target: In-Frame Exon Skipping and a Shortened proalpha1(XI) Chain
    causal_link_type: DIRECT
    description: >-
      Loss of the splice donor causes the adjacent exon to be skipped.
    evidence:
    - reference: PMID:23621912
      reference_title: Deletions within COL11A1 in Type 2 stickler syndrome detected by multiplex ligation-dependent probe amplification (MLPA).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Many of the mutations resulting in either Stickler or Marshall syndrome alter splice sites and result in exon skipping, which because of the exon structure of collagen genes usually leaves the message in-frame.
      explanation: >-
        The authors' statement of the established splice-to-skip step. Graded
        OTHER because it is a background assertion in the paper's framing
        rather than a result the paper reports.
  evidence:
  - reference: PMID:10486316
    reference_title: Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotypic-phenotypic comparison revealed an association between the Marshall syndrome phenotype and splicing mutations of 54-bp exons in the C-terminal region of the COL11A1 gene.
    explanation: >-
      The genotype-phenotype correlation that defines the Marshall-associated
      variant class.
  - reference: PMID:17236192
    reference_title: A report on 10 new patients with heterozygous mutations in the COL11A1 gene and a review of genotype-phenotype correlations in type XI collagenopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4/10 patients the phenotype was classified as Marshall syndrome because of early-onset severe hearing loss and characteristic facial features. These four patients were all heterozygous for a splice site mutation in intron 50.
    explanation: >-
      Independent replication of the correlation in a second cohort, and the
      source of the intron-50 hot spot.
- name: In-Frame Exon Skipping and a Shortened proalpha1(XI) Chain
  biological_scale: MOLECULAR
  description: >-
    Because fibrillar collagen exons are sized in multiples of the 9-residue
    Gly-Xaa-Yaa unit, skipping one keeps the reading frame and the triple-helix
    register intact. The cell therefore produces a stable, shortened chain
    rather than degrading a truncated one - which is precisely why the allele is
    harmful rather than merely null.
  downstream:
  - target: Dominant-Negative Poisoning of the Collagen XI Heterotrimer
    causal_link_type: DIRECT
    description: >-
      The shortened chain remains competent to enter the heterotrimer.
  evidence:
  - reference: PMID:23621912
    reference_title: Deletions within COL11A1 in Type 2 stickler syndrome detected by multiplex ligation-dependent probe amplification (MLPA).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because skipping of these exons leaves the message in-frame and the Gly-Xaa-Yaa repeating collagen motif in register, this results in mutant collagen α chains capable of co-assembly with α chains synthesized from the normal genes, resulting in a dominant negative effect
    explanation: >-
      States the in-frame/in-register argument and the co-assembly step it
      licenses.
- name: Dominant-Negative Poisoning of the Collagen XI Heterotrimer
  biological_scale: MOLECULAR
  description: >-
    The shortened proalpha1(XI) chain co-assembles with normal chains, so a
    heterozygote's collagen XI pool is contaminated rather than halved. This is
    the step that makes the disease dominant and that separates it from a
    haploinsufficiency model.
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent conferring tensile strength
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030020
      label: extracellular matrix structural constituent conferring tensile strength
  downstream:
  - target: Defective Heterotypic Collagen II/XI Fibril Assembly
    causal_link_type: DIRECT
    description: >-
      Collagen XI nucleates and limits the diameter of the collagen II fibril,
      so a poisoned heterotrimer is felt as a fibril-architecture defect.
  evidence:
  - reference: PMID:23621912
    reference_title: Deletions within COL11A1 in Type 2 stickler syndrome detected by multiplex ligation-dependent probe amplification (MLPA).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mutant protein then exerts a dominant negative effect as it co-assembles with other collagen gene products.
    explanation: >-
      The dominant-negative claim stated directly.
  - reference: PMID:25073711
    reference_title: "Marshall syndrome: further evidence of a distinct phenotypic entity and report of new findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagen XI is a minor fibrillar collagen co-expressed with collagen II in cartilage and the vitreous of the eye.
    explanation: >-
      Establishes where collagen XI acts, which is what makes the branch into
      cartilage and vitreous the expected one.
- name: Defective Heterotypic Collagen II/XI Fibril Assembly
  biological_scale: TISSUE
  description: >-
    The shared upstream lesion for every organ branch below. Collagen XI is a
    minor component by mass but a controlling one by function: it templates
    fibril nucleation and diameter in the collagen II matrices of cartilage,
    vitreous and the membranous labyrinth.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Growth Plate Chondrocyte Disorganization
    causal_link_type: DIRECT
  - target: Vitreoretinal Collagen Matrix Defect
    causal_link_type: DIRECT
  - target: Membranous Labyrinth Collagen Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Recorded as indirect because the cochlear step is inferred from the
      clinical and imaging phenotype rather than from a demonstrated
      labyrinthine matrix abnormality.
  evidence:
  - reference: PMID:7859283
    reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The data demonstrate that collagen XI is essential for normal formation of cartilage collagen fibrils and the cohesive properties of cartilage.
    explanation: >-
      The fibril-assembly requirement, demonstrated by a naturally occurring
      Col11a1 null mouse.
- name: Growth Plate Chondrocyte Disorganization
  biological_scale: TISSUE
  description: >-
    Loss of the fibril template disturbs the columnar organisation and
    differentiation of growth-plate chondrocytes. This is the branch behind the
    craniofacial and skeletal features, and it is the branch with the strongest
    animal-model support.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: cartilage development
    modifier: DECREASED
    term:
      id: GO:0051216
      label: cartilage development
  downstream:
  - target: Midface retrusion
    causal_link_type: DIRECT
  - target: Short stature
    causal_link_type: DIRECT
  - target: Premature osteoarthritis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:7859283
    reference_title: "A fibrillar collagen gene, Col11a1, is essential for skeletal morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results also suggest that the normal differentiation and spatial organization of growth plate chondrocytes is critially dependent on the presence of type XI collagen in cartilage extracellular matrix.
    explanation: >-
      Names growth-plate chondrocyte organisation as the collagen XI-dependent
      process. Quoted verbatim including the source's typographical error in
      "critially", since a snippet reproduces its source rather than correcting
      it.
  - reference: PMID:36278545
    reference_title: "The Shape of the Jaw-Zebrafish Col11a1a Regulates Meckel's Cartilage Morphogenesis and Mineralization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results demonstrate that zebrafish col11a1a knockdown impairs the cellular organization of Meckel's cartilage in the developing jaw and alters the bone formation that occurs adjacent to the Meckel's cartilage.
    explanation: >-
      Extends the cartilage-organisation defect specifically to the craniofacial
      cartilage that prefigures the midface phenotype.
- name: Vitreoretinal Collagen Matrix Defect
  biological_scale: TISSUE
  description: >-
    The vitreous is a collagen II/XI gel, so the same fibril defect presents as
    an abnormal vitreous with progressive vitreoretinal degeneration. The
    clinical consequence that matters is a lifelong risk of retinal detachment;
    the myopia and the lens changes travel with it.
  downstream:
  - target: High myopia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Retinal detachment
    causal_link_type: DIRECT
  - target: Cataract
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25073711
    reference_title: "Marshall syndrome: further evidence of a distinct phenotypic entity and report of new findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagen XI is a minor fibrillar collagen co-expressed with collagen II in cartilage and the vitreous of the eye.
    explanation: >-
      Places collagen XI in the vitreous, which is what makes the ocular branch
      a consequence of the same lesion rather than a separate association.
  - reference: PMID:9235398
    reference_title: "[Lens coloboma and lens dislocation in Stickler (Marshall) syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We are reporting on a female patient with typical ocular and systemic manifestations of both syndromes: high myopia, glaucoma and goniodysgenesis, submucosal cleft palate, sensorineural hearing loss, and "flat" mid-face.
    explanation: >-
      Documents the ocular spectrum, including the anterior-segment features
      that are less often listed.
- name: Membranous Labyrinth Collagen Defect
  biological_scale: TISSUE
  description: >-
    The hearing loss is cochlear, and imaging shows the bony labyrinth is
    normally formed - so the lesion is in the membranous labyrinth rather than
    in osseous morphogenesis. This node records that inference, which is what
    the audiovestibular study concluded rather than what it directly observed;
    no labyrinthine matrix has been examined histologically in a Marshall
    patient.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Progressive sensorineural hearing impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10889003
    reference_title: Audiovestibular phenotype associated with a COL11A1 mutation in Marshall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observed auditory and vestibular abnormalities are not caused by defective morphogenesis of the osseous labyrinth, but by more direct effects of the COL11A1 mutation on the membranous labyrinth and the central nervous system.
    explanation: >-
      The authors' localisation of the lesion, which this node restates.
  - reference: PMID:10889003
    reference_title: Audiovestibular phenotype associated with a COL11A1 mutation in Marshall syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Computed tomography detected no malformations of temporal bone structures.
    explanation: >-
      The negative imaging finding the localisation rests on. Indirect because
      a normal bony labyrinth excludes one explanation rather than
      demonstrating a membranous one.
phenotypes:
- name: Midface retrusion
  category: Craniofacial
  diagnostic: true
  description: >-
    Midfacial hypoplasia with a flat, retracted midface. With the depressed
    nasal bridge it forms the facial gestalt that, together with early severe
    deafness, is what makes a clinician call a COL11A1 patient "Marshall"
    rather than "Stickler type 2".
  phenotype_term:
    preferred_term: Midface retrusion
    term:
      id: HP:0011800
      label: Midface retrusion
  evidence:
  - reference: PMID:10486316
    reference_title: Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stickler and Marshall syndromes are dominantly inherited chondrodysplasias characterized by midfacial hypoplasia, high myopia, and sensorineural-hearing deficit.
    explanation: >-
      Names midfacial hypoplasia as a cardinal feature.
  - reference: PMID:17236192
    reference_title: A report on 10 new patients with heterozygous mutations in the COL11A1 gene and a review of genotype-phenotype correlations in type XI collagenopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4/10 patients the phenotype was classified as Marshall syndrome because of early-onset severe hearing loss and characteristic facial features.
    explanation: >-
      Records that the facial features are one of the two criteria used in
      practice to assign the Marshall label.
- name: Depressed nasal bridge
  category: Craniofacial
  description: >-
    The flat or saddle nasal bridge, with a short nose, anteverted nostrils and
    a long philtrum. It is present from birth and does not progress.
  phenotype_term:
    preferred_term: Depressed nasal bridge
    term:
      id: HP:0005280
      label: Depressed nasal bridge
  evidence:
  - reference: PMID:10486316
    reference_title: Splicing mutations of 54-bp exons in the COL11A1 gene cause Marshall syndrome, but other mutations cause overlapping Marshall/Stickler phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been suggested that Marshall syndrome differs from Stickler syndrome in that patients with Marshall syndrome more often have short stature, deafness, and abnormalities in cranial ossification and more-pronounced dysmorphic features, including a retracted midface with flat nasal bridge, short nose, anteverted nostrils, and a long philtrum.
    explanation: >-
      Describes the facial phenotype and states it as a proposed discriminator
      from Stickler syndrome.

genetic:
- name: MAPT
  gene_term:
    preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  relationship_type: RISK_FACTOR
  association: >-
    Predominantly sporadic disease; the MAPT H1 haplotype is a shared common
    genetic risk locus with PSP, and rare familial CBD is caused by MAPT
    (tau-protein) mutations.
  notes: >-
    Microtubule-associated protein tau gene (17q21.31). The H1/H1 haplotype is
    enriched in pathologically confirmed CBD, mirroring PSP; rare MAPT missense
    mutations (e.g., G389R, p.N410H, P301S) have been reported in sporadic CBS,
    alongside rare familial CBD cases carrying MAPT variants.
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A large genome-wide association study found significant genetic overlap between CBD and PSP in the MAPT H1 region"
    explanation: >-
      Establishes the MAPT H1 region as a shared genetic risk locus for CBD and PSP.
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Moreover, the G389R, p.N410H and P301S MAPT mutations have been described in cases of sporadic CBS"
    explanation: >-
      Documents MAPT missense mutations identified in patients presenting with CBS.
- name: GRN

genetic:
- name: MAPT (microtubule-associated protein tau)
  gene_term:
    preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  association: H1 haplotype is the strongest genetic risk factor for CBD; H2 is protective
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    Most CBS/CBD is sporadic. The common MAPT 17q21.31 H1 haplotype is the strongest
    genetic risk factor for corticobasal degeneration, mirroring its role in PSP and
    other 4R tauopathies; the H2 haplotype is protective. Rare familial CBS can occur
    with MAPT, GRN, or C9orf72 variants, but these are not the typical setting and the
    consensus "probable CBD" criteria specifically exclude known tau mutations.
  evidence:
  - reference: PMID:33287913
    reference_title: "MAPT subhaplotypes in corticobasal degeneration: assessing associations with disease risk, severity of tau pathology, and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The microtubule-associated protein tau (MAPT) H1 haplotype is the strongest genetic risk factor for corticobasal degeneration (CBD)."
    explanation: >-
      Directly states MAPT H1 as the strongest genetic risk factor for CBD.
  - reference: PMID:33287913
    reference_title: "MAPT subhaplotypes in corticobasal degeneration: assessing associations with disease risk, severity of tau pathology, and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the strong association between the MAPT H2 haplotype and decreased risk of CBD (Odds ratio = 0.26"
    explanation: >-
      Quantifies the protective MAPT H2 haplotype association (OR 0.26) in a
      neuropathologically confirmed CBD case-control analysis.
  - reference: PMID:32050258
    reference_title: "Novel tau filament fold in corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The H1 haplotype of MAPT (the tau gene) is present in cases of CBD at a higher frequency than in controls"
    explanation: >-
      Independent confirmation that the MAPT H1 haplotype is enriched in CBD versus
      controls.
treatments:
- name: Symptomatic and Supportive Management (No Disease-Modifying Therapy)
  description: >-
    No disease-modifying therapy is available for CBS/CBD. Management is symptomatic
    and supportive: a levodopa trial is reasonable but the parkinsonism is
    characteristically poorly responsive; botulinum toxin is used for focal limb
    dystonia; clonazepam/levetiracetam for myoclonus; and multidisciplinary
    rehabilitation (physical, occupational, and speech/swallow therapy) addresses
    apraxia, gait/falls, dysarthria, and dysphagia.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:24963675
    reference_title: "Corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the present time, no disease modifying therapies are available"
    explanation: >-
      Documents the absence of disease-modifying therapy, establishing the
      symptomatic/supportive nature of CBS management.

name: Corticobasal Syndrome
creation_date: "2026-07-14T12:00:00Z"
category: Complex
description: >-
  Corticobasal syndrome (CBS) is an adult-onset, progressive neurodegenerative
  syndrome characterized by markedly asymmetric akinetic-rigid parkinsonism
  combined with cortical dysfunction — limb apraxia, cortical sensory loss, the
  alien limb phenomenon, focal limb dystonia, and myoclonus. CBS is the clinical
  phenotype most classically produced by corticobasal degeneration (CBD), a
  pathologically defined four-repeat (4R) tauopathy in which hyperphosphorylated
  4R tau accumulates in neurons and glia, with astrocytic plaques as the
  pathognomonic lesion (distinguishing CBD from the tufted astrocytes of
  progressive supranuclear palsy). A central curatorial point is that CBS and CBD
  are not equivalent: only roughly half of clinically diagnosed CBS cases have CBD
  at autopsy, while Alzheimer disease, progressive supranuclear palsy, and
  frontotemporal lobar degeneration with TDP-43 can each present as CBS.
  Conversely CBD itself can present with non-CBS phenotypes (a
  nonfluent/agrammatic primary progressive aphasia, a frontal
  behavioral-dysexecutive-spatial syndrome, or a PSP-like Richardson syndrome).
  CBD/CBS is predominantly sporadic; the MAPT H1 haplotype is a shared risk locus
  with PSP, and rare familial cases occur (MAPT and GRN/progranulin mutations).
  There is no approved disease-modifying or symptomatic drug therapy; management
  is supportive.

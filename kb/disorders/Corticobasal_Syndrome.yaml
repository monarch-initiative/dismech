    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive supranuclear palsy, corticobasal degeneration, argyrophilic grain disease or glial globular tauopathy belong to the group of 4R-tauopathies."
    explanation: >-
      Places corticobasal degeneration within the 4R-tauopathies.
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "due to alternate splicing of exon 10 of the microtubule associated protein tau (MAPT) gene"
    explanation: >-
      Explains that 4R tau predominance derives from MAPT exon 10 splicing.
- name: Network-Specific Tau Propagation and Asymmetric Neurodegeneration
  description: >-
    CBD behaves as a neural-network-specific disorder. Pathology begins in the
    dorsolateral prefrontal cortex and basal ganglia circuits, with the astrocytic
    plaque as the earliest lesion, and spreads to more posterior regions as the
    disease advances; tau seeding and propagation are strain- and
    network-specific. The result is progressive, characteristically asymmetric
    frontoparietal, basal ganglia, and nigral neurodegeneration.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  downstream:
  - target: Asymmetric Parkinsonism with Cortical Dysfunction (Corticobasal Syndrome)
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It initially affects the dorsolateral prefrontal cortex and basal ganglia circuits, with more posterior regions affected as the disease progresses."
    explanation: >-
      Describes the network-specific spread of CBD pathology.
  - reference: PMID:27797812
    reference_title: "Astrogliopathy predominates the earliest stage of corticobasal degeneration pathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "tau seeding and propagation are strain- and neural network-specific"
    explanation: >-
      Animal-model evidence that tau seeding and propagation are network-specific,
      supporting the network-based spread of CBD.
  - reference: PMID:27797812
    reference_title: "Astrogliopathy predominates the earliest stage of corticobasal degeneration pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relatively greater tau burden in the anterior frontal cortex, striatum and subthalamic nucleus suggests the striatal afferent connection to the dorsolateral prefrontal cortex and basal ganglia circuitry are the earliest neural network connections affected by corticobasal degeneration-related tau pathology.
    explanation: >-
      Human preclinical cases identify the earliest network distribution of CBD tau pathology.
- name: Asymmetric Parkinsonism with Cortical Dysfunction (Corticobasal Syndrome)
  description: >-
    Asymmetric degeneration of frontoparietal cortex, basal ganglia, and
    substantia nigra produces the clinical corticobasal syndrome: an asymmetric,
    levodopa-resistant akinetic-rigid parkinsonism combined with cortical signs
    (limb apraxia, cortical sensory loss, alien limb phenomenon, focal dystonia,
    and myoclonus). Because phenotype tracks the topography and burden of tau
    pathology, CBD can also manifest as aphasic, behavioral, or PSP-like
    phenotypes rather than classic CBS.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:42438177
    reference_title: "A Randomized Controlled Trial of Dual Upper-Extremity Training [DUET]: Combining Neurologic Music Therapy with Noninvasive Brain Stimulation for Upper-Limb Performance in Corticobasal Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticobasal syndrome (CBS) is a progressive neurodegenerative condition characterized by asymmetric limb rigidity, apraxia, dystonia, and myoclonus"
    explanation: >-
      Summarizes the asymmetric motor and cortical clinical output of CBS.
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple pathologies, such as CBD, Alzheimer's disease and progressive supranuclear palsy may underlie a patient with CBS."
    explanation: >-
      Captures the clinicopathological heterogeneity: CBS is a syndrome with
      several possible underlying pathologies.
genetic:
- name: MAPT
  gene_term:
    preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  relationship_type: RISK_FACTOR
  association: >-
    Predominantly sporadic disease; the MAPT H1 haplotype is a shared common
    genetic risk locus with PSP, and rare familial CBD is caused by MAPT
    (tau-protein) mutations.
  notes: >-
    Microtubule-associated protein tau gene (17q21.31). The H1/H1 haplotype is
    enriched in pathologically confirmed CBD, mirroring PSP; rare causative MAPT
    mutations (e.g., N296N, G389R, P301S) have been reported in familial CBD and
    sporadic CBS.
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large genome-wide association study found significant genetic overlap between CBD and PSP in the MAPT H1 region"
    explanation: >-
      Establishes the MAPT H1 region as a shared genetic risk locus for CBD and PSP.
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CBD is a predominantly sporadic disease. Familial cases due to a microtubule associated tau protein (MAPT) mutation"
    explanation: >-
      Documents that CBD is predominantly sporadic with rare MAPT-mutation
      familial cases.
- name: GRN
  gene_term:
    preferred_term: GRN
    term:
      id: hgnc:4601
      label: GRN
  relationship_type: CAUSATIVE
  association: >-
    Progranulin (GRN) mutations, a cause of frontotemporal lobar degeneration
    with TDP-43 pathology, can present clinically as corticobasal syndrome.
  notes: >-
    GRN-related CBS is one of the non-CBD pathologies underlying the corticobasal
    syndrome and is enriched in familial CBS in some cohorts.
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progranulin (PGRN) mutations can present with variable phenotypes, including CBS"
    explanation: >-
      Establishes GRN/progranulin mutations as a cause of CBS (a non-CBD
      underlying pathology).

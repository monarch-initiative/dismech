    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classic clinical presentation is corticobasal syndrome, which typically presents as an asymmetric parkinsonism with a variable combination of ideomotor apraxia, rigidity, myoclonus, and dystonia, often associated with the presence of an alien limb phenomenon"
    explanation: >-
      Establishes asymmetric parkinsonism as the classic core presentation of CBS.

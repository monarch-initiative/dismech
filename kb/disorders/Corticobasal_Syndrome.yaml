diagnosis:
- name: Consensus Clinical Diagnostic Criteria (Armstrong Criteria)
  description: >-
    Clinical diagnosis relies on consensus criteria (Armstrong et al., 2013)
    combining asymmetric motor features (limb rigidity/akinesia, dystonia,
    myoclonus) with higher cortical signs (limb/orobuccal apraxia, cortical
    sensory deficit, alien limb phenomenon) and insidious progression over at
    least 1 year.
  diagnosis_term:
    preferred_term: Clinical Diagnosis
    term:
      id: NCIT:C15607
      label: Clinical Diagnosis
  evidence:

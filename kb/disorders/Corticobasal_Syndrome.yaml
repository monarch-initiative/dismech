    snippet: The imaging hallmark of CBD is the asymmetrical cortical atrophy, which is more pronounced in the peri-rolandic region (anterior and posterior central gyrus), posterior frontal and parietal lobes, contralaterally to the clinically more severely affected side.
    explanation: Describes the characteristic distribution of asymmetric cortical atrophy.
histopathology:
- name: Ballooned neurons and astrocytic tau plaques
  description: >-
    CBD pathology includes ballooned neurons and tau-positive astrocytic plaques,
    with neuronal inclusions, neuropil threads, and oligodendroglial coiled bodies.
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, it is now evident that tau pathology in astrocytes is more important in discriminating PSP from CBD. Thus, astrocytic plaques are pathognomonic of CBD, whereas PSP is characterized by tufted astrocytes.
    explanation: Defines the ballooned-neuron and astrocytic-plaque features of CBD pathology.
treatments:
- name: Symptomatic Pharmacotherapy
  description: >-
    No approved disease-modifying or symptomatic drug therapy exists for CBS. A
    levodopa trial is standard for the parkinsonian features but response is
    typically poor; myoclonus may be treated symptomatically (e.g., clonazepam or
    levetiracetam). Treatment is therefore symptomatic and supportive.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: clonazepam
      term:
        id: CHEBI:3756
        label: clonazepam
  evidence:
  - reference: PMID:42438177
    reference_title: "A Randomized Controlled Trial of Dual Upper-Extremity Training [DUET]: Combining Neurologic Music Therapy with Noninvasive Brain Stimulation for Upper-Limb Performance in Corticobasal Syndrome."

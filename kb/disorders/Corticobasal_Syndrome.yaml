progression:
- phase: Onset and course
  notes: >-
    Insidious adult onset (mean age at onset ~64 years) with gradual, relentless
    progression; probable-CBD clinical research criteria require insidious onset
    and gradual progression for at least 1 year with onset at age 50 or older.
    Mean survival is estimated at about 6.5 years.
  evidence:
  - reference: PMID:23359374
    reference_title: "Criteria for the diagnosis of corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "insidious onset and gradual progression for at least 1 year"
    explanation: >-
      States the insidious-onset, gradually progressive course required by the
      probable-CBD criteria.
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean survival is estimated at 6.5 years"
    explanation: >-
      Provides the estimated mean survival for CBD.

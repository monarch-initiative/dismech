- name: Asymmetric Parkinsonism with Cortical Dysfunction (Corticobasal Syndrome)
  biological_scale: ORGANISM
  description: >-
    Asymmetric degeneration of frontoparietal cortex, basal ganglia, and
    substantia nigra produces the clinical corticobasal syndrome: an asymmetric,
    levodopa-resistant akinetic-rigid parkinsonism combined with cortical signs
    (limb apraxia, cortical sensory loss, alien limb phenomenon, focal dystonia,
    and myoclonus). Because phenotype tracks the topography and burden of tau
    pathology, CBD can also manifest as aphasic, behavioral, or PSP-like
    phenotypes rather than classic CBS.

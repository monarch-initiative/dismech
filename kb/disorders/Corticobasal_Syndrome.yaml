pathophysiology:
- name: 4R-Tau Aggregation with Astrocytic Plaques
  biological_scale: MOLECULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Corticobasal degeneration, the archetypal pathology of CBS, is defined by the
    accumulation of aggregated, hyperphosphorylated four-repeat (4R) tau in
    neurons and glia. The pathognomonic lesion is the astrocytic plaque, which
    distinguishes CBD from the tufted astrocytes of PSP; ballooned achromatic
    neurons, neuropil threads, and oligodendroglial coiled bodies are additional
    lesions. 4R tau predominance arises from alternative splicing of MAPT exon 10.
    This is the upstream initiating lesion.

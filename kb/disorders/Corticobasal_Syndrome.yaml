discussions:
- discussion_id: gap_cbs_antemortem_pathology_biomarkers
  prompt: >-
    Which fluid, neuroimaging, or molecular PET biomarkers can reliably
    distinguish 4R-tau corticobasal degeneration from non-CBD pathologies
    (Alzheimer disease, progressive supranuclear palsy, FTLD-TDP) in living
    patients presenting with corticobasal syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#4R-Tau Aggregation with Astrocytic Plaques
  - pathophysiology#Asymmetric Parkinsonism with Cortical Dysfunction (Corticobasal Syndrome)
  rationale: >-
    Because clinically defined CBS is pathologically heterogeneous — with CBD
    accounting for only roughly half of autopsy-confirmed cases alongside AD,
    PSP, and FTLD-TDP — clinical trials of protein-specific disease-modifying
    therapies require validated antemortem biomarkers that identify the
    underlying molecular pathology in individual CBS patients beyond excluding
    typical Alzheimer CSF/PET profiles.
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This clinical-pathological overlap emphasizes the need for biomarkers to assist in the ante mortem etiological diagnosis of a patient with CBS. To this extent, structural and functional imaging modalities, as well as CSF biomarkers have been applied. Further research on biomarkers is critical, in view of specific protein-targeting, disease modifying treatments tested in clinical trials."
    explanation: >-
      Highlights the unresolved clinical need for antemortem etiological
      biomarkers in CBS to enable pathology-targeted clinical trials.
notes: >-
  Corticobasal syndrome (MONDO:0018696) denotes the clinical syndrome of
  asymmetric akinetic-rigid parkinsonism with higher cortical dysfunction,
  whereas corticobasal degeneration (CBD) denotes the 4R-tauopathy defined
  neuropathologically by astrocytic plaques. Although CBD is the archetypal
  pathological substrate modeled in the mechanism cascade, CBS exhibits marked
  clinicopathological heterogeneity, with Alzheimer disease, progressive
  supranuclear palsy, and FTLD-TDP accounting for a substantial fraction of
  clinically diagnosed cases.

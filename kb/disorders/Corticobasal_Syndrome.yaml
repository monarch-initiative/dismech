name: Corticobasal Syndrome
creation_date: "2026-07-14T12:00:00Z"
category: Complex
description: >-
  Corticobasal syndrome (CBS) is an adult-onset, gradually progressive
  neurodegenerative disorder of the atypical-parkinsonism ("parkinsonism-plus")
  spectrum, defined clinically by a strikingly asymmetric akinetic-rigid syndrome
  combining basal-ganglionic features (rigidity, akinesia/bradykinesia, limb
  dystonia, tremor) with higher-cortical dysfunction (ideomotor limb apraxia,
  cortical sensory loss, alien-limb phenomenon, myoclonus). CBS is a CLINICAL
  syndrome and must be distinguished from corticobasal degeneration (CBD), the
  specific 4-repeat (4R) tauopathy neuropathology first described by Rebeiz in 1967.
  CBD is the single most common pathology underlying CBS (roughly half of cases),
  but the same clinical picture is produced by other pathologies — Alzheimer disease,
  progressive supranuclear palsy, and FTLD-TDP among them — so an antemortem CBS
  diagnosis is not specific for CBD, and definitive CBD diagnosis still requires
  autopsy. When CBD pathology is present, hyperphosphorylated 4R tau accumulates in
  neurons and glia (the astrocytic plaque being pathognomonic) with asymmetric
  cortical atrophy maximal in the frontoparietal/perirolandic regions plus basal
  ganglia and nigral degeneration. The MAPT H1 haplotype is the strongest genetic
  risk factor for CBD; most disease is sporadic. No disease-modifying therapy exists,
  and management is symptomatic and supportive. This entry anchors on the clinical
  syndrome (MONDO:0018696) and is closely related to the in-repo tauopathy/FTLD
  cluster (Progressive Supranuclear Palsy, Pick Disease, Primary Progressive Apraxia
  of Speech, Semantic Dementia).
disease_term:
  preferred_term: Corticobasal Syndrome
  term:
    id: MONDO:0018696
    label: corticobasal syndrome
parents:
- Neurodegenerative Disease
- Parkinsonism
pathophysiology:
- name: Diverse Underlying Proteinopathy (Clinicopathological Heterogeneity of CBS)
  description: >-
    CBS is an etiologically heterogeneous clinical syndrome, not a single disease.
    The asymmetric cortical-plus-basal-ganglionic constellation initially considered
    characteristic of "corticobasal degeneration" is now recognized to arise from
    several distinct underlying pathologies. Corticobasal degeneration (a 4R
    tauopathy) is the most frequent, but Alzheimer disease, progressive supranuclear
    palsy, and TDP-43 proteinopathies (FTLD-TDP) can present with an
    indistinguishable corticobasal syndrome. This heterogeneity is the central
    diagnostic problem in CBS: current consensus criteria for "possible CBD" are
    deliberately inclusive and therefore also capture non-CBD tau- and non-tau
    pathologies. The term CBS is reserved for the clinical diagnosis and CBD for the
    histopathologic disorder.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Asymmetric Frontoparietal and Basal Ganglia Neurodegeneration
  evidence:
  - reference: PMID:21853287
    reference_title: "The multiple phenotypes of corticobasal syndrome and corticobasal degeneration: implications for further study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have shown considerable clinicopathologic heterogeneity, leading some to use the term"
    explanation: >-
      Establishes that CBS/CBD shows considerable clinicopathologic heterogeneity,
      motivating the split of the clinical term (CBS) from the histopathologic term
      (CBD).
  - reference: PMID:24521567
    reference_title: "Validation of the new consensus criteria for the diagnosis of corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with similar corticobasal syndromes can have neurodegenerative pathologies that are not CBD"
    explanation: >-
      Directly documents that a corticobasal syndrome can be produced by
      non-CBD neurodegenerative pathologies, i.e., CBS is not specific for CBD.
  - reference: PMID:24963675
    reference_title: "Corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple other neurodegenerative disorders with a different underlying pathology, such as Alzheimer disease (AD), can mimic its clinical course"
    explanation: >-
      Names Alzheimer disease as a common alternative pathology mimicking the
      corticobasal clinical course, supporting the heterogeneity node.
  - reference: PMID:23359374
    reference_title: "Criteria for the diagnosis of corticobasal degeneration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "broader criteria for possible CBD that are more inclusive but have a higher chance to detect other tau-based pathologies"
    explanation: >-
      The consensus criteria authors note that the broader "possible CBD" criteria
      are more inclusive and more likely to capture other tau-based pathologies —
      partial support, as this concerns criteria performance rather than direct
      pathology attribution.
- name: 4R-Tau Aggregation with Astrocytic Plaques (Corticobasal Degeneration Pathology)
  description: >-
    In the most common underlying pathology (CBD), hyperphosphorylated four-repeat
    (4R) tau accumulates as insoluble filamentous inclusions in neurons and glia.
    The astrocytic plaque is the pathognomonic astroglial lesion of CBD (the
    counterpart of the tufted astrocyte of PSP), and oligodendroglial coiled bodies
    and neuronal inclusions are also present. Tau aggregation disrupts microtubule
    biology and proteostasis. This 4R-tauopathy lesion is the upstream driver of
    neurodegeneration in CBD-pathology CBS and is shared, at the level of isoform
    composition, with PSP and other 4R tauopathies.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte (astrocytic plaque)
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: oligodendrocyte (coiled body)
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: Tau (amyloid-like) fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  - preferred_term: Tau hyperphosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: INCREASED
  - preferred_term: Disrupted microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: ABNORMAL
  downstream:
  - target: Asymmetric Frontoparietal and Basal Ganglia Neurodegeneration
  evidence:
  - reference: PMID:32050258
    reference_title: "Novel tau filament fold in corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By histology, astrocytic plaques are diagnostic of CBD"
    explanation: >-
      Establishes the astrocytic plaque as the diagnostic (pathognomonic)
      histologic lesion of CBD.
  - reference: PMID:32050258
    reference_title: "Novel tau filament fold in corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CBD is characterized by abundant filamentous tau inclusions that are made of isoforms with four microtubule-binding repeats"
    explanation: >-
      Confirms CBD as a 4-repeat (4R) tauopathy defined by filamentous 4R-tau
      inclusions.
  - reference: PMID:33089580
    reference_title: "Contribution of the astrocytic tau pathology to synapse loss in progressive supranuclear palsy and corticobasal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "astrocytes in PSP and CBD contain pathognomonic pTau aggregates - hence, lending the designation tufted astrocytes (TA) or astrocytic plaques (AP), respectively"
    explanation: >-
      Documents the pathognomonic astrocytic pTau lesions distinguishing CBD
      (astrocytic plaques) from PSP (tufted astrocytes).
- name: Asymmetric Frontoparietal and Basal Ganglia Neurodegeneration
  description: >-
    Regardless of the specific upstream proteinopathy, CBS is unified by asymmetric
    neurodegeneration that is typically maximal in the frontoparietal (perirolandic)
    cortex, together with basal ganglia and substantia nigra degeneration. The
    asymmetric cortical involvement produces the cortical signs (limb apraxia,
    cortical sensory loss, alien limb, myoclonus) contralateral to the more affected
    hemisphere, while nigrostriatal/basal-ganglia degeneration produces the
    asymmetric, typically levodopa-poorly-responsive akinetic-rigid parkinsonism and
    dystonia. Progressive spread underlies the relentless clinical course.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Neuronal apoptosis / neurodegeneration
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:21853287
    reference_title: "The multiple phenotypes of corticobasal syndrome and corticobasal degeneration: implications for further study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic findings at autopsy are asymmetric cortical atrophy that is typically maximal in the frontoparietal regions, as well as basal ganglia and nigral degeneration."
    explanation: >-
      Localizes the neurodegeneration to asymmetric frontoparietal cortex plus
      basal ganglia and nigra — the anatomic substrate of the corticobasal
      clinical signs.
  - reference: PMID:21853287
    reference_title: "The multiple phenotypes of corticobasal syndrome and corticobasal degeneration: implications for further study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal accumulations of the microtubule-associated tau protein are found in both neurons and glia"
    explanation: >-
      Confirms neuronal and glial tau accumulation as the microscopic correlate of
      the degeneration in CBD-pathology CBS.

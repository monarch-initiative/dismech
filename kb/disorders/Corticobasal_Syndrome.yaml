  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: No disease-modifying treatment has been approved for CBD. However, many symptoms of CBS can be symptomatically treated. Parkinsonism in CBS can be treated with levodopa, with poor and only transient response

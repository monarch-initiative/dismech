    quote_role: REVIEW_SYNTHESIS
    snippet: "Clinical CBD phenotypes and features were combined to create 2 sets of criteria: more specific clinical research criteria for probable CBD and broader criteria for possible CBD that are more inclusive but have a higher chance to detect other tau-based pathologies."
    explanation: >-
      Documents the international consensus clinical diagnostic criteria for
      probable and possible CBD/CBS.
- name: Asymmetric cortical atrophy on brain MRI
  description: >-
    MRI supports the diagnosis by showing asymmetric peri-rolandic,
    posterior-frontal, and parietal cortical atrophy contralateral to the more
    severely affected side; imaging does not by itself establish CBD pathology.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The imaging hallmark of CBD is the asymmetrical cortical atrophy, which is more pronounced in the peri-rolandic region (anterior and posterior central gyrus), posterior frontal and parietal lobes, contralaterally to the clinically more severely affected side.
    explanation: Describes the characteristic distribution of asymmetric cortical atrophy.
histopathology:
- name: Ballooned neurons and astrocytic tau plaques
  description: >-
    CBD pathology includes ballooned neurons and tau-positive astrocytic plaques,
    with neuronal inclusions, neuropil threads, and oligodendroglial coiled bodies.
  evidence:
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ballooned or achromatic neurons were considered pathognomonic of CBD by Rebeiz et al., particularly when located in the cortical gray matter or less commonly in basal ganglia"
    explanation: Documents ballooned (achromatic) cortical and basal ganglia neurons as a classic histopathological feature of CBD.
  - reference: PMID:34316603
    reference_title: "Corticobasal degeneration and corticobasal syndrome: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, it is now evident that tau pathology in astrocytes is more important in discriminating PSP from CBD. Thus, astrocytic plaques are pathognomonic of CBD, whereas PSP is characterized by tufted astrocytes."
    explanation: Establishes tau-positive astrocytic plaques as the pathognomonic lesion distinguishing CBD from PSP.
treatments:
- name: Symptomatic Pharmacotherapy
  description: >-
    No approved disease-modifying or symptomatic drug therapy exists for CBS. A
    levodopa trial is standard for the parkinsonian features but response is
    typically poor; myoclonus may be treated symptomatically (e.g., clonazepam or
    levetiracetam). Treatment is therefore symptomatic and supportive.
  therapeutic_modality: SMALL_MOLECULE

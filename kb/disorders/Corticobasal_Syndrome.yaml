- name: Neurorehabilitation and Neurologic Music Therapy
  description: >-
    Multidisciplinary rehabilitation (physical, occupational, and speech therapy)
    is the mainstay of CBS management. Neurologic music therapy (NMT), alone or
    combined with high-definition transcranial direct current stimulation
    (HD-tDCS), has shown feasibility and preliminary benefit for upper-limb motor
    performance in a randomized controlled trial.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:42438177
    reference_title: "A Randomized Controlled Trial of Dual Upper-Extremity Training [DUET]: Combining Neurologic Music Therapy with Noninvasive Brain Stimulation for Upper-Limb Performance in Corticobasal Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both NMT alone and combined NMT + HD-tDCS were feasible in CBS and were associated with improvements in selected upper-limb motor outcomes"
    explanation: >-
      Randomized-trial evidence supporting neurorehabilitation (neurologic music
      therapy, with or without HD-tDCS) for upper-limb motor performance in CBS.
notes: >-
  Curatorial note: this entry models the corticobasal SYNDROME (the clinical
  phenotype, MONDO:0018696), which is distinct from corticobasal DEGENERATION
  (the 4R-tauopathy pathology). The pathophysiology described is that of CBD, the
  most common substrate of CBS, but the clinicopathological dissociation (CBS may
  be caused by AD, PSP, FTLD-TDP, and others) is central and is captured
  explicitly. A knowledge-gap discussion on antemortem biomarkers that predict
  the underlying pathology of a given CBS patient is a good follow-up.

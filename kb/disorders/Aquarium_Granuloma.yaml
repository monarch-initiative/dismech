name: Aquarium Granuloma
creation_date: "2026-09-28T11:37:22Z"
category: Infectious Disease
description: >-
  Aquarium granuloma is a cutaneous nontuberculous mycobacterial infection
  caused by Mycobacterium marinum after traumatic inoculation from contaminated
  freshwater, saltwater, fish, or aquaria. It most often begins as a papule or
  nodule on a hand or extremity, can ulcerate or spread in a sporotrichoid
  lymphangitic pattern, and can extend to tendons, joints, or bone.
disease_term:
  preferred_term: Aquarium granuloma
  term:
    id: MONDO:0043314
    label: aquarium granuloma
parents:
- Bacterial Infection
synonyms:
- Fish tank granuloma
- Mycobacterium marinum skin disease
prevalence:
- population: Netherlands, 2011-2018 culture-confirmed infections
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.15
  rate_denominator: POPULATION_PER_YEAR
  evidence:
  - reference: PMID:35308482
    reference_title: "Treatment and Outcome of Culture-Confirmed Mycobacterium marinum Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The annual incidence rate was 0.15/100 000/year during the study period."
    explanation: >-
      The Dutch laboratory-based cohort provides a population annual-incidence
      estimate for culture-confirmed M. marinum disease.
progression:
- phase: Incubation after inoculation
  incubation_days: Median 21 days; range 5-270 days
  notes: >-
    Cutaneous disease can have a prolonged incubation, so the exposure history
    remains relevant for months before lesion onset.
  evidence:
  - reference: PMID:10987702
    reference_title: "Incubation period and sources of exposure for cutaneous Mycobacterium marinum infection: case report and review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Forty cases had known incubation periods (median, 21 days; range, 5-270 days)."
    explanation: >-
      The exposure review pooled reported cases with known incubation periods
      and quantified the median and range.
infectious_agent:
- name: Mycobacterium marinum
  infectious_agent_term:
    preferred_term: Mycobacterium marinum
    term:
      id: NCBITaxon:1781
      label: Mycobacterium marinum
  description: >-
    Slow-growing photochromogenic nontuberculous mycobacterium associated with
    aquatic exposures and cutaneous sporotrichoid infection.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      M. marinum is a slowly growing pigmented organism responsible for "fish
      tank granuloma"
    explanation: >-
      The cutaneous-mycobacteria review identifies M. marinum as the organism
      that causes fish tank granuloma. Evidence source is OTHER as this is a
      review.
transmission:
- name: Aquatic traumatic inoculation
  description: >-
    Exposure to contaminated fresh or salt water, fish, or aquaria after skin
    trauma introduces M. marinum into cooler superficial tissues of the hands and
    extremities.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases of cutaneous infections take place among individuals who
      suffered puncture injuries or other types of trauma in freshwater or salt
      water.
    explanation: >-
      Establishes traumatic inoculation during aquatic exposure as the usual
      acquisition route for cutaneous M. marinum infection. Evidence source is
      OTHER as this is a review.
environmental:
- name: Aquarium and fish-water exposure after skin trauma
  description: >-
    Contact with aquarium water, fish tanks, fish, shellfish, or salt or
    brackish water after a cut or puncture exposes dermal tissue to M. marinum.
  exposure_term:
    preferred_term: exposure to water
    term:
      id: ECTO:9000156
      label: exposure to water
  influences_mechanisms:
  - target: Dermal M. marinum Inoculation and Replication
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The aquatic exposure is the source event that places M. marinum into
      injured acral skin.
    evidence:
    - reference: PMID:10987702
      reference_title: "Incubation period and sources of exposure for cutaneous Mycobacterium marinum infection: case report and review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Of 193 infections with known exposures, 49% were aquarium-related, 27.4%
        were related to fish or shellfish injuries, and 8.8% were related to
        injuries associated with saltwater or brackish water.
      explanation: >-
        The pooled exposure review identifies the aquaria, fish or shellfish
        trauma, and salt or brackish water events that trigger cutaneous disease.
  evidence:
  - reference: PMID:12153378
    reference_title: "Sixty-three cases of Mycobacterium marinum infection: clinical features, treatment, and antibiotic susceptibility of causative isolates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 53 (84%) of the patients, inoculation was related to fish tank exposure."
    explanation: >-
      The French national culture-confirmed series quantifies fish-tank exposure
      as the dominant recorded inoculation setting.

- name: Local corticosteroid injection at the lesion site
  description: >-
    Intralesional corticosteroid exposure at the infected hand lesion can
    predispose to tenosynovial complication, plausibly by locally suppressing
    containment of an unrecognized mycobacterial infection.
  influences_mechanisms:
  - target: Deep Contiguous M. marinum Extension
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      The injection occurs locally at the lesion site and is associated with
      later tenosynovitis rather than with acquisition of the bacterium.
    evidence:
    - reference: PMID:40535516
      reference_title: "Cutaneous Infection Caused by Mycobacterium marinum in Thailand: A 14-Year Retrospective Cohort Analysis of Clinical Characteristics, Complication Risks, and Treatment Efficacy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Females, patients with a history of intralesional corticosteroid injection,
        and older patients are predisposed to tenosynovitis.
      explanation: >-
        The Thai cohort identifies intralesional corticosteroid injection history
        as one of the factors predisposing to M. marinum tenosynovitis.
  evidence:
  - reference: PMID:28387180
    reference_title: "Mycobacterium marinum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinics distinguished skin and soft tissue lesions (typically sporotrichoid
      or subacute hand nodules) and lesions disseminated to joint and bone, often
      related with the local use of corticosteroids.
    explanation: >-
      The M. marinum review links joint and bone dissemination to local
      corticosteroid use. Evidence source is OTHER as this is a review.
pathophysiology:
- name: Dermal M. marinum Inoculation and Replication
  description: >-
    Traumatic contact with contaminated water or fish introduces M. marinum into
    cooler superficial tissue, where its low-temperature growth preference lets
    bacilli persist in acral skin and soft tissue.
  evidence:
  - reference: PMID:28387180
    reference_title: "Mycobacterium marinum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is highly suspected by the mode of infection, which is related
      to the hobby of fishkeeping, professional handling of marine shells, or
      swimming in nonchlorinated pools.
    explanation: >-
      The review links cutaneous M. marinum infection to aquatic exposure routes.
      Evidence source is OTHER as this is a review.
  downstream:
  - target: Granulomatous Dermal Inflammation
    description: Inoculated M. marinum elicits granulomatous skin inflammation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29493404
      reference_title: "Mycobacterium marinum infection in fish and man: epidemiology, pathophysiology and management; a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Human infections with Mycobacterium marinum hypothetically are classified
        into four clinical categories (type I-type IV) and have been associated
        with the exposure of damaged skin to polluted water from fish pools or
        contacting objects contaminated with infected fish.
      explanation: >-
        The review places damaged-skin aquatic exposure upstream of the human
        granulomatous skin infection. Evidence source is OTHER as this is a review.

- name: Granulomatous Dermal Inflammation
  description: >-
    M. marinum infection in skin and synovium produces a chronic granulomatous
    tissue response, with suppurative lesions at the acute pole and numerous
    well-formed granulomas at the chronic pole.
  conforms_to: "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation"
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0002150
      label: epithelioid macrophage
  - preferred_term: multinucleated giant cell
    term:
      id: CL:0000647
      label: multinucleated giant cell
  biological_processes:
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
  evidence:
  - reference: PMID:3840985
    reference_title: "The histopathologic spectrum in Mycobacterium marinum infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A range of inflammatory changes were seen in both synovial and skin lesions,
      varying from mostly acute inflammation with suppuration to a more chronic
      process with numerous, well-formed granulomas.
    explanation: >-
      The histopathology case series directly establishes granulomatous
      inflammation in culture-positive M. marinum skin and synovial lesions.
  downstream:
  - target: Cutaneous Papule
    description: Granulomatous cutaneous infection can present as a papule.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical spectrum of cutaneous disease caused by M. marinum includes a
        solitary papule or nodule that may ulcerate and then spreads in a
        sporotrichoid pattern (lymphangitic spread)
      explanation: The review lists papules in the M. marinum cutaneous spectrum.
  - target: Cutaneous Nodule
    description: Granulomatous cutaneous infection can present as a skin nodule.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical spectrum of cutaneous disease caused by M. marinum includes a
        solitary papule or nodule that may ulcerate and then spreads in a
        sporotrichoid pattern (lymphangitic spread)
      explanation: The review lists nodules in the M. marinum cutaneous spectrum.
  - target: Skin Plaque
    description: M. marinum cutaneous infection can present as a plaque.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40535516
      reference_title: "Cutaneous Infection Caused by Mycobacterium marinum in Thailand: A 14-Year Retrospective Cohort Analysis of Clinical Characteristics, Complication Risks, and Treatment Efficacy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "plaques and nodules as the primary morphologies (51.9% and 29.6%, respectively)"
      explanation: The Thai cohort identifies plaques and nodules as the main lesion morphologies.
  - target: Skin Ulcer
    description: M. marinum papules or nodules can ulcerate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."

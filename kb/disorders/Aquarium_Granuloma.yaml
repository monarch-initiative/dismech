diagnosis:
- name: Tissue culture and histopathology
  description: >-
    Biopsy material should be sent for mycobacterial culture and histopathology.
    Cultures need explicit low-temperature incubation around 30 C and prolonged
    holding, because routine microscopy and cultures can be falsely negative.
  results: >-
    Isolation of M. marinum from a compatible skin, tendon-sheath, joint, or
    bone specimen confirms the diagnosis.
  evidence:
  - reference: PMID:26143432
    reference_title: "Nontuberculous Mycobacteria: Skin and Soft Tissue Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Obtaining tissue for mycobacterial culture and histopathology aids diagnosis."
    explanation: >-
      The skin-and-soft-tissue NTM review identifies tissue mycobacterial
      culture and histopathology as diagnostic material. Evidence source is
      OTHER as this is a review.
  - reference: PMID:28387180
    reference_title: "Mycobacterium marinum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      microscopy and culture are often negative because growth requires low
      temperature (30°C) and several weeks to succeed in primary cultivation
    explanation: >-
      The M. marinum-specific review explains the culture condition that can
      make routine microbiology falsely negative.

- name: T-SPOT.TB interferon-gamma release assay
  description: >-
    T-SPOT.TB can be positive in cutaneous M. marinum infection because the
    organism shares ESAT-6/CFP-10 antigens with M. tuberculosis, but it is an
    adjunctive rather than species-confirming test.
  results: >-
    A positive assay supports a compatible cutaneous mycobacterial infection
    after tuberculosis has been excluded.
  evidence:
  - reference: PMID:41147233
    reference_title: "Application of T-SPOT.TB in the Diagnosis of Cutaneous Myco-bacterium marinum Infections and Evaluation of Treatment Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The baseline T-SPOT.TB positivity rate was 71% (95% CI: 63.2-77.8%).
    explanation: >-
      The 145-patient retrospective series quantifies baseline T-SPOT.TB
      positivity among cutaneous M. marinum cases after excluding tuberculosis.

- name: Molecular species identification
  description: >-
    PCR-based or targeted next-generation sequencing assays can identify M.
    marinum from tissue or culture material when paired with the compatible
    clinical and histopathologic picture.
  results: >-
    Identification of M. marinum sequence confirms the causative nontuberculous
    mycobacterial species.
  evidence:
  - reference: PMID:42639276
    reference_title: "Mycobacterium marinum Infection: A Clinical Case Report and 5-Year Systematic Literature Review (2021-2025)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Histopathological examination of skin biopsy specimens demonstrated
      infectious granuloma formation, and combined bacterial culture, hsp65 PCR
      and next-generation sequencing (NGS) confirmed M. marinum as the causative
      pathogen.
    explanation: >-
      The case report and systematic review documents hsp65 PCR and NGS as
      species-identification tools. Evidence source is OTHER because this is a
      case report embedded in a review.

histopathology:
- name: Granulomatous and suppurative inflammation
  description: >-
    Biopsies of culture-positive skin or synovial lesions can show a spectrum
    from acute suppurative inflammation to chronic well-formed granulomas, and
    organisms may be absent from routine sections.
  finding_term:
    preferred_term: granulomatous and suppurative inflammation
  diagnostic: true
  notes: >-
    Left without a `term:` binding because the HistopathologyFindingTerm dynamic
    enum is rooted in NCIT histopathology-result concepts, and the true NCIT
    granuloma term is outside that branch.
  evidence:
  - reference: PMID:3840985
    reference_title: "The histopathologic spectrum in Mycobacterium marinum infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A range of inflammatory changes were seen in both synovial and skin lesions,
      varying from mostly acute inflammation with suppuration to a more chronic
      process with numerous, well-formed granulomas.
    explanation: >-
      The culture-confirmed histopathology series describes the key microscopic
      spectrum in M. marinum tissue.

treatments:
- name: Multidrug antimycobacterial therapy
  description: >-
    Localized cutaneous M. marinum is treated with a species-directed
    multidrug oral regimen, commonly combining agents such as a macrolide,
    rifamycin, ethambutol, trimethoprim-sulfamethoxazole, or a tetracycline.
    Regimen choice and duration vary with susceptibility and depth of disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Mycobacterial RNA Polymerase (Rifampicin Target)
    treatment_effect: INHIBITS
    description: The rifampicin component inhibits bacterial RNA polymerase.
  - target: Mycobacterial Ribosomal Translation
    treatment_effect: INHIBITS
    description: The macrolide or tetracycline component inhibits bacterial translation.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of this mycobacterial infection requires a combination of at
      least two drugs, including a macrolide, ethambutol,
      trimethoprim-sulfamethoxazole, or rifamycin
    explanation: >-
      The review supports multidrug therapy assembled from these active drug
      classes. Evidence source is OTHER as this is a review.
  - reference: PMID:28387180
    reference_title: "Mycobacterium marinum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The treatment is not standardized, and no randomized control trials have been done."
    explanation: >-
      The M. marinum review supports keeping the treatment description
      non-prescriptive rather than encoding a single definitive regimen.
  - reference: PMID:35308482
    reference_title: "Treatment and Outcome of Culture-Confirmed Mycobacterium marinum Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibiotic treatment cured 36/40 patients (90%) after a mean treatment duration of 25 weeks."
    explanation: >-
      The Dutch culture-confirmed cohort provides outcome evidence for prolonged
      antibiotic treatment.

- name: Surgical debridement for deep infection
  description: >-
    Deep hand or wrist disease with tenosynovial, joint, or bone involvement can
    require operative debridement in addition to antimycobacterial therapy.
  treatment_term:
    preferred_term: Debridement
    term:
      id: NCIT:C51682
      label: Debridement
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Deep Contiguous M. marinum Extension
    description: >-
      Debridement removes infected or necrotic deep tissue that antimicrobial
      therapy alone may not clear.
  evidence:
  - reference: PMID:20427845
    reference_title: "Review article: Mycobacterium marinum infection of the hand and wrist."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "debridement is indicated in patients with deep-seated infections"
    explanation: >-
      The hand/wrist review recommends debridement for deep-seated M. marinum
      infections. Evidence source is OTHER as this is a review.
  - reference: PMID:40535516
    reference_title: "Cutaneous Infection Caused by Mycobacterium marinum in Thailand: A 14-Year Retrospective Cohort Analysis of Clinical Characteristics, Complication Risks, and Treatment Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical debridement combined with oral antibiotics successfully treated
      all tenosynovitis patients, with no recurrence during the 1-year follow-up.
    explanation: >-
      The Thai cohort supports debridement as part of successful management for
      M. marinum tenosynovitis.

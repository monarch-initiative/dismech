name: Aquarium Granuloma
creation_date: "2026-09-28T11:37:22Z"
category: Infectious Disease
description: >-
  Aquarium granuloma is a cutaneous nontuberculous mycobacterial infection
  caused by Mycobacterium marinum after traumatic inoculation from contaminated
  freshwater, saltwater, fish, or aquaria. It most often begins as a papule or
  nodule on a hand or extremity, can ulcerate or spread in a sporotrichoid
  lymphangitic pattern, and can extend to tendons, joints, or bone.
disease_term:
  preferred_term: Aquarium granuloma
  term:
    id: MONDO:0043314
    label: aquarium granuloma
parents:
- Bacterial Infection
synonyms:
- Fish tank granuloma
- Mycobacterium marinum skin disease
infectious_agent:
- name: Mycobacterium marinum
  infectious_agent_term:
    preferred_term: Mycobacterium marinum
    term:
      id: NCBITaxon:1781
      label: Mycobacterium marinum
  description: >-
    Slow-growing photochromogenic nontuberculous mycobacterium associated with
    aquatic exposures and cutaneous sporotrichoid infection.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      M. marinum is a slowly growing pigmented organism responsible for "fish
      tank granuloma"
    explanation: >-
      The cutaneous-mycobacteria review identifies M. marinum as the organism
      that causes fish tank granuloma. Evidence source is OTHER as this is a
      review.
transmission:
- name: Aquatic traumatic inoculation
  description: >-
    Exposure to contaminated fresh or salt water, fish, or aquaria after skin
    trauma introduces M. marinum into cooler superficial tissues of the hands and
    extremities.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases of cutaneous infections take place among individuals who
      suffered puncture injuries or other types of trauma in freshwater or salt
      water.
    explanation: >-
      Establishes traumatic inoculation during aquatic exposure as the usual
      acquisition route for cutaneous M. marinum infection. Evidence source is
      OTHER as this is a review.
pathophysiology:
- name: Cutaneous M. marinum Granulomatous Infection
  description: >-
    Direct inoculation of M. marinum into cooler superficial tissue produces a
    localized granulomatous skin and soft-tissue infection. Lesions commonly
    present as a solitary papule or nodule, may ulcerate, and can track
    proximally along superficial lymphatics in a sporotrichoid nodular pattern.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical spectrum of cutaneous disease caused by M. marinum includes a
      solitary papule or nodule that may ulcerate and then spreads in a
      sporotrichoid pattern (lymphangitic spread)
    explanation: >-
      The review links cutaneous M. marinum infection to its characteristic
      papular or nodular morphology, ulceration, and lymphangitic spread.
  downstream:
  - target: Cutaneous Papule
    description: M. marinum cutaneous infection can present first as a papule.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical spectrum of cutaneous disease caused by M. marinum includes a
        solitary papule or nodule that may ulcerate and then spreads in a
        sporotrichoid pattern (lymphangitic spread)
      explanation: The review lists papules in the M. marinum cutaneous spectrum.
  - target: Cutaneous Nodule
    description: M. marinum cutaneous infection can present as a skin nodule.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical spectrum of cutaneous disease caused by M. marinum includes a
        solitary papule or nodule that may ulcerate and then spreads in a
        sporotrichoid pattern (lymphangitic spread)
      explanation: The review lists nodules in the M. marinum cutaneous spectrum.
  - target: Skin Ulcer
    description: M. marinum papules or nodules can ulcerate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical spectrum of cutaneous disease caused by M. marinum includes a
        solitary papule or nodule that may ulcerate and then spreads in a
        sporotrichoid pattern (lymphangitic spread)
      explanation: The review states that M. marinum papules or nodules may ulcerate.
  - target: Sporotrichoid Nodular Lymphangitis
    description: >-
      Cutaneous M. marinum infection can spread proximally along superficial
      lymphatics, producing sequential nodules in a sporotrichoid pattern.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Characteristic sporotrichoid nodular lymphangitic spread of Mycobacterium marinum."
      explanation: >-
        The figure caption in the review names M. marinum as a cause of
        sporotrichoid nodular lymphangitic spread.

- name: Deep M. marinum Extension
  description: >-
    In delayed or advanced infection, M. marinum can extend from skin and
    subcutaneous tissue into tendon sheaths, joints, or bone, causing
    tenosynovitis, septic arthritis, or osteomyelitis.
  evidence:
  - reference: PMID:11950119
    reference_title: "Mycobacterium marinum infection in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mycobacterium marinum often causes skin infections, tenosynovitis,
      arthritis, and osteomyelitis
    explanation: The clinical series lists tendon, joint, and bone disease in M. marinum infection.
  - reference: PMID:20427845
    reference_title: "Review article: Mycobacterium marinum infection of the hand and wrist."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "extension of the infection from the skin to the tenosynovium"
    explanation: The hand/wrist review links delayed management to deep tendon-sheath extension.
  downstream:
  - target: Tenosynovitis
    description: M. marinum can spread from skin into tendon sheaths.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11950119
      reference_title: "Mycobacterium marinum infection in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One patient had septic arthritis, the other 13 had skin infections and/or
        tenosynovitis.
      explanation: >-
        The Taiwan series observed tenosynovitis among patients with M. marinum
        infection.
  - target: Septic Arthritis
    description: M. marinum can involve joints and cause septic arthritis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11950119
      reference_title: "Mycobacterium marinum infection in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One patient had septic arthritis"
      explanation: The Taiwan series observed septic arthritis caused by M. marinum.
  - target: Osteomyelitis
    description: M. marinum can involve bone and cause osteomyelitis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11950119
      reference_title: "Mycobacterium marinum infection in Taiwan."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mycobacterium marinum often causes skin infections, tenosynovitis,
        arthritis, and osteomyelitis
      explanation: The Taiwan series lists osteomyelitis as a manifestation of M. marinum infection.

- name: Mycobacterial RNA Polymerase (Rifampicin Target)
  description: >-
    M. marinum depends on DNA-dependent RNA polymerase for transcription.
    Rifampicin, used as one component of multidrug regimens for this infection,
    inhibits bacterial RNA polymerase and is paired with companion drugs to
    avoid rifamycin monotherapy.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_rna_polymerase_inhibition#Bacterial RNA Polymerase (Rifamycin Target)"
  biological_processes:
  - preferred_term: DNA-Templated Transcription
    term:
      id: GO:0006351
      label: DNA-templated transcription
  evidence:
  - reference: PMID:32342856
    reference_title: "Inhibition of RNA Polymerase by Rifampicin and Rifamycin-Like Molecules."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most clinically important and extensively studied class of antibiotics
      known to inhibit bacterial RNAP are the rifamycins.
    explanation: >-
      Establishes bacterial RNA polymerase as the rifampicin target, the step
      this node represents. Evidence source is OTHER as this is a review.

- name: Mycobacterial Ribosomal Translation
  description: >-
    The bacterial ribosome is the shared target for macrolides and tetracyclines,
    drug classes used in M. marinum combination therapy. Inhibiting translation
    arrests mycobacterial protein synthesis.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ribosome is one of the main antibiotic targets in the bacterial cell."
    explanation: >-
      Establishes the bacterial ribosome as the target class for macrolides and
      tetracyclines. Evidence source is OTHER as this is a review.


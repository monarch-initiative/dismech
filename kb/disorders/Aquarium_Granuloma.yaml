      explanation: The review states that M. marinum papules or nodules may ulcerate.
  - target: Sporotrichoid Lymphatic Dissemination
    description: >-
      Granulomatous dermal infection can spread proximally along superficial
      lymphatic drainage in a sporotrichoid pattern.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical spectrum of cutaneous disease caused by M. marinum includes a

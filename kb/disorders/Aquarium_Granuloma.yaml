- name: Sporotrichoid Lymphatic Dissemination
  description: >-
    In some cutaneous infections, M. marinum spreads proximally along superficial
    lymphatic drainage and seeds successive nodules in a sporotrichoid pattern.
  evidence:
  - reference: PMID:30429139
    reference_title: "Cutaneous Mycobacterial Infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristic sporotrichoid nodular lymphangitic spread of Mycobacterium marinum."
    explanation: >-
      The review figure caption identifies M. marinum as a cause of
      sporotrichoid nodular lymphangitic spread.
  downstream:
  - target: Sporotrichoid Nodular Lymphangitis
    description: >-
      Cutaneous M. marinum infection can spread proximally along superficial
      lymphatics, producing sequential nodules in a sporotrichoid pattern.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30429139
      reference_title: "Cutaneous Mycobacterial Infections."
      supports: SUPPORT
      evidence_source: OTHER

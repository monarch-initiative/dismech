name: BEST1-Related Dominant Retinopathy
creation_date: "2026-06-23T00:00:00Z"
category: Mendelian
description: >-
  BEST1-related dominant retinopathy is the gene-level umbrella for retinal
  disease caused by a heterozygous pathogenic BEST1 variant. Its prototypic
  phenotype is Best vitelliform macular dystrophy (BVMD/Best disease), in which
  retinal pigment epithelium (RPE) dysfunction, abnormal subretinal material,
  reduced electrooculogram (EOG) light-rise, and slowly progressive central
  visual impairment form the core clinical picture. Adult-onset vitelliform
  macular dystrophy and autosomal dominant vitreoretinochoroidopathy are also
  recognized dominant BEST1 phenotypes, but the detailed causal and phenotype
  graph in this entry is intentionally BVMD-centered. Dominant variants can
  produce loss-of-function, dominant-negative, or gain-of-function effects,
  and penetrance and expressivity are variable. No approved disease-modifying
  treatment exists; OPGx-BEST1 gene augmentation is being evaluated in the
  recruiting BIRD-1 study (NCT07185256).

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a mean annual thickness loss of 5.7 and 5.2 μm, respectively."
    explanation: The imaging cohort quantifies slow bilateral central-retinal-thickness loss.
differential_diagnoses:
- name: Autosomal recessive bestrophinopathy
  description: >-
    ARB shares RPE dysfunction, abnormal EOG, subretinal fluid, and vitelliform
    material with dominant BEST1 disease. Demonstration of biallelic pathogenic
    BEST1 variants rather than a single heterozygous variant is the defining
    molecular discriminator.
  distinguishing_features:
  - Biallelic pathogenic BEST1 variants support ARB; one heterozygous pathogenic variant supports dominant BEST1 disease.
  - ARB is often a more diffuse retinal disease than the BVMD-centered macular pattern modeled here.
  disease_term:
    preferred_term: autosomal recessive bestrophinopathy
    term:
      id: MONDO:0012733
      label: autosomal recessive bestrophinopathy
  evidence:
  - reference: PMID:20301346
    reference_title: "Bestrophinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of autosomal recessive bestrophinopathy is established in a proband with suggestive findings and biallelic BEST1 pathogenic variants."
    explanation: GeneReviews directly states the biallelic molecular discriminator for ARB.
- name: Genetically heterogeneous adult-onset vitelliform macular dystrophy
  description: >-
    Adult-onset vitelliform lesions can be caused by BEST1, PRPH2, IMPG1,
    IMPG2, HTRA1, CTNNA1, or non-genetic mimics. Multigene testing and the
    complete retinal phenotype are therefore needed before assigning a
    gene-level BEST1 diagnosis.
  distinguishing_features:
  - A heterozygous pathogenic BEST1 variant establishes the BEST1-defined subtype in a compatible phenotype.
  - PRPH2 and other macular-dystrophy genes should be assessed when BEST1 testing is negative or the phenotype is atypical.
  evidence:
  - reference: DOI:10.1007/s10633-026-10093-y
    reference_title: "Review of the clinical electrooculogram - Part 2: the bestrophinopathies and modified protocols"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genetically heterogeneous, with PRPH2"
    explanation: >-
      The clinical review identifies adult-onset vitelliform presentations as
      genetically heterogeneous and lists multiple non-BEST1 genes.

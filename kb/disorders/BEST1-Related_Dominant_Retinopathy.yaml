definitions:
- name: Molecular definition of autosomal-dominant bestrophinopathy
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    A proband with suggestive ophthalmic findings and a heterozygous pathogenic
    or likely pathogenic BEST1 variant meets the GeneReviews molecular
    definition of autosomal-dominant bestrophinopathy.
  evidence:
  - reference: PMID:20301346
    reference_title: "Bestrophinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of autosomal dominant bestrophinopathy is established in a proband with suggestive findings and a heterozygous BEST1 pathogenic (or likely pathogenic) variant identified by molecular genetic testing."
    explanation: >-
      GeneReviews directly states the clinical-plus-molecular diagnostic
      definition for dominant BEST1 disease.
notes: >-
  MONDO:0700238 captures autosomal-dominant BEST1 retinopathies only. The
  broader bestrophinopathy spectrum (including autosomal recessive
  bestrophinopathy, ADVIRC, MRCS, and BEST1-associated RP) is covered in
  BEST1_Bestrophinopathies.yaml (MONDO:0000390). Adult-onset foveomacular
  vitelliform dystrophy (AVMD) includes BEST1-related cases as a gene-defined
  subtype in Adult_Onset_Foveomacular_Vitelliform_Dystrophy.yaml
  (MONDO:0011979). Autosomal recessive bestrophinopathy (ARB; OMIM 611809;
  MONDO:0012733, mapped from the gene-level grouping term MONDO:0700239
  "BEST1-related recessive retinopathy") requires biallelic BEST1 mutations
  and is not captured here. Because the available quantitative natural-history
  literature is predominantly about BVMD, frequency and progression statements
  below should not be generalized to every dominant BEST1 phenotype.
pathophysiology:
- name: BEST1 Calcium-Activated Chloride Channel Dysfunction
  description: >-
    Heterozygous pathogenic BEST1 variants produce mutant bestrophin-1 subunits
    that co-assemble with wild-type subunits in the homopentameric CaCC complex
    in the RPE basolateral membrane. The large majority of dominant BEST1
    pathogenic variants cause loss-of-function (LOF) or dominant-negative (DN)
    impairment of calcium-activated chloride conductance; a minority cause toxic
    gain-of-function (GOF) with excess channel activity. The resulting abnormal
    chloride transport disrupts RPE transepithelial ion flux and calcium
    homeostasis.

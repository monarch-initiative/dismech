review_notes: >-
  The 2026 re-review kept the entry at the ClinGen/MONDO gene-level dominant
  umbrella but made the detailed graph explicitly BVMD-centered. It added the
  definitive ClinGen assertion, molecular definition, diagnostic workflow,
  current trial records, a patient-derived iPSC-RPE model, current natural
  history and canine gene-therapy evidence, and open translational questions.
  All phenotype nodes are now connected to the causal graph. The accession-level
  GEO review identified no disease-specific public omics dataset, so datasets
  remains explicitly empty.

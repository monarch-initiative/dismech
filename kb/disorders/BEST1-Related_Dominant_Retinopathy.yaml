    subretinal OPGx-BEST1 injection in one eye of participants with BVMD or ARB.
    It evaluates safety, tolerability, dose selection, and exploratory efficacy
    over five years. The schema's PHASE_I value represents the combined early
    phase 1b/2a designation.

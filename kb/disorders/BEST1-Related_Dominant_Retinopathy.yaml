animal_models:
- species: Dog
  genotype: Best1 loss-of-function (CMR1/2/3 — canine multifocal retinopathy)
  description: >-
    Canine multifocal retinopathy (CMR) is a naturally occurring bestrophinopathy
    in multiple dog breeds caused by autosomal-recessive BEST1 mutations
    (cmr1: p.Arg25Ter in Great Pyrenees/mastiff; cmr2: p.Gly161Asp in Coton de
    Tulear; cmr3: two variants in Swedish Lapponian Herder). Although CMR
    inheritance is recessive (unlike human BVMD), it recapitulates key features:
    multifocal retinal microdetachments, lipofuscin accumulation, and RPE
    microvilli loss. Subretinal AAV2-mediated BEST1 gene augmentation therapy in
    CMR dogs reversed both clinically detectable subretinal lesions and the diffuse
    RPE-photoreceptor microdetachment and corrected the RPE-photoreceptor interface
    across three canine BEST1 genotypes, providing the key preclinical
    proof-of-concept for the OPGx-BEST1 gene therapy approach. A 2026
    dose-ranging study in 12 mutant dogs reported improved rod- and cone-mediated
    responses and retinal structure without systemic or ocular toxicity.
  evidence:
  - reference: PMID:29507198
    reference_title: "BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by light exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subretinal BEST1 gene augmentation therapy using adeno-associated virus 2 reversed not only clinically detectable subretinal lesions but also the diffuse microdetachments"
    explanation: >-
      In the canine BEST1 (CMR) model, subretinal AAV2-BEST1 gene augmentation
      reversed both clinically visible subretinal lesions and the diffuse
      RPE-photoreceptor microdetachment, the pivotal preclinical proof-of-concept
      underpinning the OPGx-BEST1 clinical gene therapy program.
  - reference: DOI:10.3390/cells9040882
    reference_title: "Large Animal Models of Inherited Retinal Degenerations: A Review"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Studies utilizing large animal models of inherited retinal degeneration (IRD) have proven important in not only the development of translational therapeutic approaches, but also in improving our understanding of disease mechanisms"
    explanation: >-
      Large animal model review establishes the critical translational role of
      canine IRD models for inherited retinal disease gene therapy development,
      including for bestrophinopathy.
  - reference: DOI:10.1007/s00335-024-10091-y
    reference_title: "Canine models of inherited retinal diseases: from neglect to well-recognized translational value"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Large animal models of inherited retinal diseases, particularly dogs, have been extensively used over the past decades to study disease natural history and evaluate therapeutic interventions"
    explanation: >-
      Canine IRD model review highlights the central role of dog models in
      bestrophinopathy translational research, from natural history to gene
      therapy preclinical evaluation.
  - reference: PMID:42411064
    reference_title: Evaluation of the Toxicity and Efficacy of an Adeno-Associated Viral Vector Expressing BEST1 Delivered by Subretinal Injection in a Canine Model of Human Bestrophinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electroretinography showed improved rod- and cone-mediated responses in eyes treated with OPGx-BEST1."
    explanation: The current dose-ranging study demonstrates functional rescue in treated mutant-dog eyes.
  - reference: PMID:42411064
    reference_title: Evaluation of the Toxicity and Efficacy of an Adeno-Associated Viral Vector Expressing BEST1 Delivered by Subretinal Injection in a Canine Model of Human Bestrophinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "showed improved structural integrity with a reduction or prevention of appearance of vitelliform lesions and reversal of microdetachments"
    explanation: OCT demonstrated structural benefit in treated retinal regions.
- species: Mouse
  genotype: Best1 W93C knock-in and Best1 knockout
  description: >-
    Best1 W93C knock-in mice (heterozygous and homozygous) exhibit an altered EOG
    light-peak luminance response reminiscent of BVMD patients, together with
    fluid- and debris-filled retinal detachments and enhanced RPE lipofuscin
    accumulation, yet retain normal chloride conductances — indicating that the
    dominant disease is not simply loss of bestrophin-1 chloride-channel function.
    The knock-in phenotype is distinct from that of Best1 knockout mice (with
    respect to lipofuscin accumulation and ATP-stimulated calcium responses), and
    the W93C knock-in is regarded as a valid model of BVMD. Overall, mouse models
    incompletely recapitulate human BVMD, limiting their translational utility
    relative to canine models and iPSC-RPE systems.
  evidence:
  - reference: PMID:20053664
    reference_title: "Suppression of Ca2+ signaling in a mouse model of Best disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both Best1(+/W93C)and Best1(W93C/W93C) mice had normal ERG a- and b-waves, but exhibited an altered LP luminance response reminiscent of that observed in BVMD patients"
    explanation: >-
      Knock-in mouse study shows the dominant BVMD-causing W93C variant produces
      the hallmark altered EOG light-peak (LP) response with normal ERG, modeling
      the human electrophysiological phenotype of BVMD.
  - reference: PMID:20053664
    reference_title: "Suppression of Ca2+ signaling in a mouse model of Best disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RPE cells from Best1(W93C) mice exhibited normal Cl(-) conductances"
    explanation: >-
      Despite reproducing the disease phenotype, W93C knock-in RPE retains normal
      chloride conductance, showing that dominant BVMD pathology is not simply
      loss of bestrophin-1 chloride-channel function.
experimental_models:
- name: Patient-derived Best disease iPSC-RPE model
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  cell_source: >-
    RPE differentiated from induced pluripotent stem cells from individuals
    with Best disease and their unaffected siblings
  culture_system: Polarized hiPSC-RPE with chronic photoreceptor-outer-segment feeding
  publication: PMID:23139242
  conditions:
  - Best disease patient-derived RPE
  - Unaffected sibling-derived RPE
  - Long-term photoreceptor-outer-segment feeding
  description: >-
    Patient-derived RPE reproduces abnormal fluid flux, delayed rhodopsin
    degradation, autofluorescent-material accumulation, altered stimulated
    calcium responses, and oxidative stress. The matched unaffected-sibling
    comparison provides a human cellular bridge between BEST1 variation and RPE
    handling of photoreceptor outer segments.
  modeled_mechanisms:
  - target: RPE Dysfunction and Impaired Phagocytosis
    description: Models RPE fluid transport, calcium signaling, and photoreceptor-outer-segment handling.
    evidence:
    - reference: PMID:23139242
      reference_title: "iPS cell modeling of Best disease: insights into the pathophysiology of an inherited macular degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RHODOPSIN degradation after POS feeding was delayed in BD hiPSC-RPE relative to unaffected sibling hiPSC-RPE, directly implicating impaired POS handling in the pathophysiology of the disease."
      explanation: The matched human model directly demonstrates impaired photoreceptor-outer-segment handling.
  - target: Vitelliform Material Accumulation
    description: Models accumulation of autofluorescent material after chronic outer-segment feeding.
    evidence:
    - reference: PMID:23139242
      reference_title: "iPS cell modeling of Best disease: insights into the pathophysiology of an inherited macular degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RPE from mutant hiPSCs displayed disrupted fluid flux and increased accrual of autofluorescent material after long-term POS feeding when compared with hiPSC-RPE from unaffected siblings."
      explanation: The disease model reproduces the material-accumulation phenotype.
  evidence:
  - reference: PMID:23139242
    reference_title: "iPS cell modeling of Best disease: insights into the pathophysiology of an inherited macular degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We employed human iPS cell (hiPSC) technology to generate RPE from BD patients and unaffected siblings"
    explanation: This establishes the patient-derived, sibling-controlled human RPE model.
discussions:
- discussion_id: best1_channel_versus_calcium_and_pos_handling
  prompt: >-
    To what extent does dominant BEST1 retinopathy result from altered chloride
    conductance versus calcium signaling, fluid transport, and handling of
    photoreceptor outer segments?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#BEST1 Calcium-Activated Chloride Channel Dysfunction
  - pathophysiology#RPE Dysfunction and Impaired Phagocytosis
  rationale: >-
    BEST1 is a calcium-activated chloride channel, yet a dominant W93C mouse
    model reproduces the light-peak phenotype with normal RPE chloride
    conductance, while patient-derived RPE implicates calcium-store regulation
    and outer-segment processing. The entry therefore does not reduce every
    dominant variant to a single channel-loss mechanism.
  evidence:
  - reference: PMID:20053664
    reference_title: "Suppression of Ca2+ signaling in a mouse model of Best disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RPE cells from Best1(W93C) mice exhibited normal Cl(-) conductances"
    explanation: The dominant mouse model separates a disease phenotype from simple chloride-conductance loss.
  - reference: PMID:23139242
    reference_title: "iPS cell modeling of Best disease: insights into the pathophysiology of an inherited macular degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "further linked BEST1 to the regulation and release of endoplasmic reticulum calcium stores."
    explanation: Patient-derived RPE provides an alternative calcium-regulatory mechanism.
- discussion_id: recessive_canine_model_for_dominant_human_disease
  prompt: >-
    How well does gene augmentation in recessive canine BEST1 disease predict
    efficacy across dominant-negative and gain-of-function human BVMD variants?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#BEST1 Calcium-Activated Chloride Channel Dysfunction
  rationale: >-
    The canine model supplies strong safety and structural-rescue evidence but
    uses homozygous or compound-heterozygous BEST1 genotypes. Dominant human
    alleles can interfere with wild-type subunits or increase channel activity,
    so rescue by augmentation may be variant-class dependent.
  evidence:
  - reference: PMID:42411064
    reference_title: Evaluation of the Toxicity and Efficacy of an Adeno-Associated Viral Vector Expressing BEST1 Delivered by Subretinal Injection in a Canine Model of Human Bestrophinopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "dogs that were homozygous mutant or compound heterozygotes for 3 naturally occurring mutations in BEST1."
    explanation: The IND-enabling model uses recessive genotypes rather than heterozygous dominant human variants.
  - reference: DOI:10.4103/sjopt.sjopt_175_23
    reference_title: "Gene therapy in bestrophinopathies: Insights from preclinical studies in preparation for clinical trials"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "individuals harboring GOF variants would require a combination of gene silencing and gene augmentation"
    explanation: Variant mechanism may limit direct extrapolation from recessive augmentation models.
- discussion_id: bvmd_trial_endpoints_for_slow_variable_progression
  prompt: >-
    Which structural or functional measures are sufficiently sensitive and
    reproducible for early-phase BVMD treatment trials?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Photoreceptor Damage and Vision Loss
  rationale: >-
    Visual acuity and retinal thickness decline slowly and variably, which can
    obscure treatment effects in small early-phase trials. Longitudinal lesion
    dimensions, outer-nuclear-layer thickness, and dark-adapted chromatic
    sensitivity are promising but remain to be qualified as endpoints.
  evidence:
  - reference: PMID:40086732
    reference_title: "Best Vitelliform Macular Dystrophy Natural History Study Report 2: Fundus Autofluorescence and OCT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The slow and variable disease course may pose a challenge in identification of early end points for therapeutic trials aimed at altering kinetics of degeneration."
    explanation: The large natural-history imaging study explicitly identifies the endpoint problem.
  - reference: PMID:40688488
    reference_title: "Multimodal Imaging and Dark-Adapted Chromatic Perimetry in BEST1 Vitelliform Macular Dystrophy: Identification of Outcome Measurements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may serve as valuable outcome measurements for treatment trials for BVMD."
    explanation: The longitudinal study nominates imaging and dark-adapted sensitivity measures for trials.

notes: >-
  Why this entry exists, and how it sits beside its neighbours. The knowledge base
  already curates `Dental_Fluorosis`, which is a different disease of the same
  agent: enamel fluorosis is fixed at the moment the enamel forms and does not
  progress, whereas skeletal fluorosis accrues for as long as the exposure lasts.
  They share exposures and co-occur, and the dental sign is the earlier sentinel,
  but nothing about one entry's mechanism carries over to the other.

  The disease's cause is not in dispute, which is why this entry has no
  `mechanistic_hypotheses` block. What is disputed is the mechanism between the
  exposure and the bone, and three of those disputes are curated as `discussions`
  rather than smoothed over: whether fluoride stimulates or suppresses osteoblasts
  (both, in different cell systems - and note the stimulatory result is at the
  *higher* fluoride concentration of the two, 3.8 mg/L against 2.26 mg/L, so this is
  not the low-stimulates/high-suppresses pattern "biphasic" would imply), whether
  oxidative stress is involved (a 2021 review calls it an essential mechanism and
  reports raised MDA in bone tissue; a direct antioxidant study in humans and rabbits
  found nothing - but measured blood, not bone), and which way TGF-beta signalling
  moves (up as ligand in an exposed population, down at the receptor through H3K9
  trimethylation). The entry still carries no oxidative-stress node, but for a
  narrower reason than the negative study: no source curated here measures oxidative
  stress in human fluorotic bone, so there is no tissue-level measurement to build
  the node on.

  The neurological chain deliberately runs through bone. Cord and root compression
  here is a consequence of canal and foraminal narrowing, and the cited review
  states that evidence for direct fluoride neurotoxicity is lacking. That is
  recorded as an INTERPRETATION rather than as settled fact, because "evidence is
  lacking" describes a literature at a date rather than demonstrating absence.

  On the animal models. Four are curated, and the reason they are records rather
  than only evidence items is that the rodent work here is load-bearing: two of the
  five treatments rest on it entirely. Making them records forces each one to say
  which node it speaks to, how faithfully, and where it fails. The inbred-strain
  panel is the one to read: it reproduces skeletal fluoride accumulation cleanly and
  then **fails to reproduce the density change the human disease is diagnosed on** -
  fluoride went into bone, mechanical quality degraded in the susceptible strain, and
  bone mineral density barely moved. That is a `FAILS_TO_RECAPITULATE` link with an
  `INVALIDATING` `SPECIES_MISMATCH` divergence, sitting beside a `RECAPITULATES` link
  from the same model to the accumulation node. One model, two links, opposite
  verdicts. It also pairs with the `genetic:` records, and locates susceptibility in
  bone *quality* rather than bone density.

  Negative and refuting results are curated on purpose. Seven `REFUTE` items sit
  next to the positive evidence, covering six distinct findings: the suppressive
  osteoblast result (cited twice, on the node and in the discussion), the two
  negative antioxidant measurements, the epigenetic repression of TGF-beta receptor
  signalling with COL1A1 falling, the null single-SNP results for ALOX15, and the
  null BMP2 association. That last one is the record most worth keeping: BMP
  signalling is the pathway the osteoblast-activation node runs through, so BMP2 is
  exactly the gene a reader would predict - and in 598 brick-tea drinkers it was not
  associated. Recording the null stops the next curator deriving it from
  plausibility.

  On the deep-research report. `falcon` was the requested provider and is not
  configured in this environment, so the run fell back to `claude_code` and recorded
  that itself - `fell_back: true`, `requested_provider: falcon` and the provider
  attempt list are in the report's own frontmatter rather than asserted here. Its
  reference resolution was clean (43/43 resolved, no confabulation) with one
  reference flagged off topic, `PMID:34769866`, a paper about school meal access
  during the COVID-19 pandemic; it is not cited here. Its term validation was not
  clean: six CURIEs are flagged as label mismatches. Five are real mis-namings and
  none of the five is bound anywhere in this entry - `UBERON:0002298` offered for
  "vertebral column" when it is *brainstem*, `UBERON:0004123` for "femur" when it is
  *myocardial layer*, `UBERON:0002417` for "posterior longitudinal ligament" when it
  is *abdominal segment of trunk*, `HP:0009758` for "enamel hypoplasia" when it is
  *pyramidal skinfold extending from the base to the top of the nails*, and
  `HP:0100774` for "Osteosclerosis" when HPO calls it *Hyperostosis*. The sixth is
  `MONDO:0400003`, this entry's own `disease_term`, and it is a false positive: the
  report gave the correct label "Skeletal fluorosis" and then listed "Ontology
  Lookup Service" beside it, which the validator counted as a second, wrong name.
  Every ontology term in this entry was resolved independently through OAK or OLS
  before binding, and every snippet was taken from a `references_cache` file fetched
  and read directly rather than from the report.

  On the spastic-weakness binding, because two plausible terms are wrong in
  different directions. The cited survey says "severe spastic *quadri*paresis in
  flexion". `HP:0002313` (Spastic paraparesis) is wrong on distribution - lower limbs
  only - and was bound in an earlier draft; `HP:0002510` (Spastic tetraplegia) has the
  right distribution but is defined as *paralysis*, so it over-claims severity. The
  entry binds `HP:0001285` (Spastic tetraparesis), whose definition is "Spastic
  weakness affecting all four limbs" and whose exact synonym is "Spastic
  quadriparesis" - a word-for-word match to the source.

  Two ECTO bindings were considered and not made, so the next curator does not
  re-derive the search. `ECTO:0900294`, offered as "exposure to fluoride via
  ingestion", resolves to no label in the ECTO build this repository validates
  against; there is no route-specific fluoride exposure term in it at all, only the
  generic `ECTO:9000423`. `ECTO:9001138` (exposure to hydrogen fluoride) does exist,
  but no source curated here identifies hydrogen fluoride as the species in coal
  smoke, and binding it would assert a chemical form the evidence does not name. All
  four exposure records therefore bind `ECTO:9000423` and carry their route and agent
  in `preferred_term`.

  On the datasets, and one rejection worth recording. GEO returns nothing on this
  disease from patient tissue; the three series curated here are all cell or mouse
  models, and each says so in its description. `just discover-datasets
  Skeletal_Fluorosis` returns 12 candidates, but every one is a `GENE_ONLY` match
  reached through this entry's own genes - BMP2 and ALOX15 - and none is about
  fluoride at all; that is the Named Entity Confusion pattern
  `docs/dataset-curation.md` describes, arriving through gene rather than disease
  search. The three series curated here were found by querying GEO directly. A fourth
  candidate, `geo:GSE22217` ("microarray-based gene expression analysis of human
  osteoblasts in response to roughness and fluoride treatment of titanium
  implants"), was rejected on relevance: it is a dental-implant surface-engineering
  study reached through the word "fluoride", and binding it would be Named Entity
  Confusion arriving through dataset search - the case `docs/dataset-curation.md`
  warns about. The enamel-focused fluoride series (`GSE337787`, `GSE57224`,
  `GSE5365`) were likewise left to `Dental_Fluorosis`.

  One thing deliberately not curated: a `HUMAN_MODEL_MISMATCH` discussion contrasting
  the rodent calcium/vitamin D rescue with human efficacy. The mismatch may well be
  real, but this entry holds no citable source reporting a human outcome for that
  intervention at all - and a discussion whose refuting half is unsourced would be
  asserting the mismatch rather than recording it. What *is* recorded is the rodent
  evidence, labelled rodent-only on the treatment record, on both of its model links,
  and in this section. The `limitations` on those links say what would have to be
  shown.

  Not curated. No GeneReviews article exists - PubMed returns nothing for
  `fluorosis[TI] AND GeneReviews[TI]`, which is expected for an environmentally
  caused disease and required no action. `PMID:28292354` ("Treatment and Prevention
  of Skeletal Fluorosis") was fetched and is *not* cited: its PubMed record carries
  no abstract text, so nothing in it can be quoted, and its cache file is therefore
  not committed either. Two things a reader might expect and will not find: there is no
  human interventional evidence anywhere in this entry - the two mechanism-directed
  treatments, calcium plus vitamin D and tryptophan supplementation, both rest on
  rodent studies and both say so on the record - and there is no oxidative-stress
  node, for the reason given above.

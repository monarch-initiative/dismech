pathophysiology:
- name: Chronic Excess Fluoride Intake
  description: >-
    The initiating exposure: fluoride taken in above the skeleton's tolerance for
    years to decades, by ingestion of groundwater, brick tea or coal-contaminated
    food, or by inhalation. The total quantity ingested, rather than the route, is
    what the older clinical literature identifies as the single determinant of how
    the disease runs.
  biological_scale: ORGANISM
  downstream:
  - target: Skeletal Fluoride Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3295994
      reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Elevated urinary fluoride and increased bone fluoride content are indicators of
        fluoride toxicity.
      explanation: >-
        Ties the ingested load to a raised bone fluoride content, which is the
        accumulation this edge asserts. Indirect because the review reports the two as
        markers of toxicity rather than measuring deposition as a consequence of intake.
  - target: Gut Microbial Tryptophan Metabolism Disruption
    causal_link_type: DIRECT
    description: >-
      The one arm of this chain that does not run through the skeleton: the cited
      work reports fluoride disrupting gut microbial tryptophan metabolism in both
      model rats and human patients, without locating that step relative to
      absorption.
    evidence:
    - reference: PMID:41380608
      reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        we found that fluoride disrupted gut microbial tryptophan metabolism, resulting
        in decreased serum levels of indole-3-acetic acid (3-IAA) in both SF model rats
        and human SF patients
      explanation: >-
        States the edge itself: fluoride exposure disrupts gut microbial tryptophan
        metabolism. Graded OTHER to match this entry's existing grading of the same
        sentence, which reports the finding in model rats and human patients together
        and so fits no single evidence_source cleanly.
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The total quantity of ingested fluoride is the single most important factor which determines the clinical course of the disease which is characterized by immobilization of joints of the axial skeleton and of the major joints of the extremities."
    explanation: >-
      Names dose as the determinant of clinical course, and names the outcome the
      chain below ends at. Graded OTHER: a review's synthesis rather than one study's
      measurement.
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "High concentrations of fluoride in the environment and drinking water are major causes"
    explanation: The dominant exposure route, from the current mechanistic review.

- name: Skeletal Fluoride Accumulation
  description: >-
    Fluoride leaving the circulation is fixed in calcified tissue, so the skeleton
    is both the store and the target. This is what makes the disease cumulative
    rather than dose-rate dependent, and it is why the neurological complications
    downstream are a consequence of bone rather than of nerve.
  biological_scale: TISSUE
  locations:
  - preferred_term: bone tissue
    term:
      id: UBERON:0002481
      label: bone tissue
  downstream:
  - target: Fluorapatite Substitution in Bone Mineral
    causal_link_type: DIRECT
  - target: Histone-Mediated Repression of TGF-beta Receptor Signalling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded INDIRECT_UNKNOWN_INTERMEDIATES: the chromatin changes were produced by
      exposing cells to fluoride, and nothing curated here connects skeletal fluoride
      burden to the histone mark as cause to effect.
    evidence:
    - reference: PMID:29275289
      reference_title: "Role of fluoride induced histone trimethylation in development of skeletal fluorosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        The expression of histone methyltransferases (EHMT1 and EHZ2) and level of
        global histone trimethylation (H3K9 and H3K27) have been assessed and observed
        to be increased significantly after fluoride exposure (8 mg/L).
      explanation: >-
        Establishes that fluoride raises H3K9 trimethylation, which is the chromatin
        change this edge ends at. Indirect for the reason the edge description already
        gives: the mark was produced by exposing cells to fluoride in medium, not by a
        skeletal fluoride burden.
  evidence:
  - reference: PMID:31501957
    reference_title: "Skeletal fluorosis: don't miss the diagnosis!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Skeletal fluorosis is a rare toxic osteopathy characterized by massive bone fixation of fluoride."
    explanation: >-
      "Massive bone fixation of fluoride" is this node in the source's own words.
      Graded OTHER as a review's characterisation of the disease.
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fluoride is a cumulative toxin which can alter accretion and resorption of bone tissue."
    explanation: >-
      States the cumulative-toxin property this node records, and that it acts on
      both accretion and resorption.

- name: Fluorapatite Substitution in Bone Mineral
  description: >-
    Fluoride entering bone mineral changes the mineral phase and the tissue's
    handling of calcium. The 1986 clinical review records increased avidity for
    calcium alongside increased turnover and impaired collagen synthesis as the
    three features of fluoride toxicity in bone; this entry curates them as three
    nodes because they have different downstream consequences.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: biomineral tissue development
    modifier: ABNORMAL
    term:
      id: GO:0031214
      label: biomineral tissue development
  downstream:
  - target: Osteoblast Proliferation and Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded INDIRECT_UNKNOWN_INTERMEDIATES: that fluoride in mineral is followed
      by osteoblast activation is not in dispute, but nothing curated here connects
      the altered mineral phase to the signalling changes below as cause to effect.
  - target: Impaired Collagen Synthesis and Matrix Mineralization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Secondary Hyperparathyroidism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Recorded INDIRECT_KNOWN_INTERMEDIATES because the intermediates are named in
      the cited sources rather than inferred: the skeleton's increased avidity for
      calcium, and fluoride's inhibition of vitamin D hydroxylation, which impairs
      calcium absorption.
    evidence:
    - reference: PMID:42336527
      reference_title: "Environmental fluoride exposure and bone metabolism: Molecular pathways and health implications."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It also inhibits vitamin D hydroxylation, decreasing active vitamin D bioavailability and impairing calcium and phosphorus absorption."
      explanation: >-
        The named intermediate step. Graded OTHER as a review's synthesis of
        mechanism rather than a study's own measurement.
  evidence:
  - reference: PMID:42336527
    reference_title: "Environmental fluoride exposure and bone metabolism: Molecular pathways and health implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Chronic fluoride exposure alters bone mineral crystals due to its high affinity for calcium, reducing mechanical strength and disturbing phosphorus balance."
    explanation: >-
      The mineral-phase claim this node is named for, and the mechanism behind it -
      fluoride's affinity for calcium alters the bone mineral crystal, at the cost of
      mechanical strength. Graded OTHER as a review's synthesis.
  - reference: PMID:38135514
    reference_title: "Prevalence of Skeletal Fluorosis in Northern Tanzania: A Follow-Up Study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Once ingested, fluoride is incorporated into calcium-rich areas, including the dental and skeletal systems."
    explanation: >-
      Graded INDIRECT: states that ingested fluoride is incorporated into the
      calcium-rich skeletal and dental tissues, which is the deposition step this
      node's substitution claim rests on rather than the substitution itself.
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Increased metabolic turnover of the bone, impaired bone collagen synthesis and increased avidity for calcium are features in fluoride toxicity."
    explanation: >-
      Names all three features this node branches into - turnover, collagen, and
      calcium avidity. Graded OTHER as a review synthesis.

- name: Osteoblast Proliferation and Activation
  description: >-
    Osteoblasts proliferate and switch on osteogenic markers under fluoride,
    through BMP/Smad and TGF-beta1/Smad2/3/CyclinD1 signalling and with
    Wnt/beta-catenin hyperactivated from the gut arm below. This is the node the
    field means by "active osteogenesis", and it is the reason skeletal fluorosis
    makes more bone rather than less.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  downstream:
  - target: Accelerated and Disordered Bone Turnover
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34769367
      reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        the PI3K/Akt signaling may cause excessive proliferation and differentiation of
        osteoblasts and accelerate bone turnover, resulting in osteosclerotic skeletal
        fluorosis
      explanation: >-
        Asserts the link in the direction this edge draws it: excessive osteoblast
        proliferation and differentiation accelerating bone turnover.
  evidence:
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, active osteogenesis and accelerated bone turnover are considered critical processes in the progression of skeletal fluorosis."
    explanation: >-
      The field's summary of what drives progression. Graded OTHER: a review's
      statement of consensus rather than its own result.
  - reference: PMID:23918166
    reference_title: "Fluoride promotes viability and differentiation of osteoblast-like Saos-2 cells via BMP/Smads signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that fluoride enhanced the proliferation of Saos-2 cells in a dose-dependent manner and 0.2 mM of fluoride resulted in a higher expression of osteoblast marker genes."
    explanation: The dose-dependent proliferative response in osteoblast-like cells.
  - reference: PMID:23918166
    reference_title: "Fluoride promotes viability and differentiation of osteoblast-like Saos-2 cells via BMP/Smads signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "immunofluorescence analysis showed that the promotion effects of 0.2 mM of fluoride on Saos-2 cells differentiation were associated with the activation of the BMP/Smad pathway."
    explanation: The pathway it runs through, with Smad4 knockdown as the test.
  - reference: PMID:34080770
    reference_title: "miR-486-3p regulates CyclinD1 and promotes fluoride-induced osteoblast proliferation and activation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the fluoride-challenged population, we observed that miR-486-3p expression decreased while CyclinD1 and transforming growth factor (TGF)-β1 increased"
    explanation: >-
      The same axis measured in an exposed human population rather than in culture -
      miR-486-3p down, CyclinD1 and TGF-beta1 up.
  - reference: PMID:34080770
    reference_title: "miR-486-3p regulates CyclinD1 and promotes fluoride-induced osteoblast proliferation and activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed that NaF activates the TGF-β1/Smad2/3/CyclinD1 axis"
    explanation: The mechanism behind that correlation, in human osteoblasts.
  - reference: PMID:29505816
    reference_title: "TGF-β1 acts as mediator in fluoride-induced autophagy in the mouse osteoblast cells."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our results demonstrated that sodium fluoride (NaF) (2.26 mg/L F-) exposure lead to a significant decrease in proliferation rate of mouse osteoblast cells in a dose-dependent manner with a concomitant increase in the expression levels of TGF-β1 and autophagic markers."
    explanation: >-
      Graded REFUTE against this node as stated. At 2.26 mg/L fluoride *decreased*
      mouse osteoblast proliferation, dose-dependently, with TGF-beta1 and autophagy
      up. Curated next to the positive results rather than instead of them - see the
      `sf_osteoblast_dose_response` discussion, which is what this contradiction is
      about.

- name: Gut Microbial Tryptophan Metabolism Disruption
  description: >-
    Fluoride disrupts tryptophan metabolism in the gut microbiota, lowering serum
    indole-3-acetic acid. Recorded as its own initiating arm because it is upstream
    of bone and is pharmacologically separable: restoring the metabolite, or the
    dietary tryptophan behind it, protects the skeleton.
  biological_scale: ORGANISM
  downstream:
  - target: Aryl Hydrocarbon Receptor Underactivation with Wnt Hyperactivation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41380608
      reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This deficiency in 3-IAA impaired the activation of aryl hydrocarbon receptor
        (AHR), leading to Wnt/β-Catenin pathway hyperactivation
      explanation: >-
        States both halves of this edge: loss of the microbial metabolite leaves AhR
        under-activated, and Wnt/beta-catenin hyperactivates in consequence.
  evidence:
  - reference: PMID:41380608
    reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we found that fluoride disrupted gut microbial tryptophan metabolism, resulting in decreased serum levels of indole-3-acetic acid (3-IAA) in both SF model rats and human SF patients."
    explanation: >-
      The finding this node records. Graded OTHER because the sentence reports the
      result in the rat model and in human patients together, and no single
      evidence source describes both halves.

- name: Aryl Hydrocarbon Receptor Underactivation with Wnt Hyperactivation
  description: >-
    Loss of the microbial metabolite leaves the aryl hydrocarbon receptor
    under-activated, and Wnt/beta-catenin signalling hyperactivates in consequence,
    driving excessive osteoblast differentiation and pathological bone formation.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  downstream:
  - target: Osteoblast Proliferation and Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24300170
      reference_title: "Fluoride promotes osteoblastic differentiation through canonical Wnt/β-catenin signaling pathway."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        the positive effect of fluoride on ALP activity and mRNA expressions of COL1A1,
        ALP, osteonection and Runx2 was abolished by DKK-1, a blocker of the
        Wnt/β-catenin receptor
      explanation: >-
        Blocking Wnt/beta-catenin abolishes the osteoblastic response, so the pathway is
        necessary for the activation this edge points at rather than merely co-occurring
        with it.
    - reference: PMID:41380608
      reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        leading to Wnt/β-Catenin pathway hyperactivation, excessive osteoblast
        differentiation/mineralization, and pathological bone formation
      explanation: >-
        Places excessive osteoblast differentiation immediately downstream of
        Wnt/beta-catenin hyperactivation in the same causal statement.
  evidence:
  - reference: PMID:41380608
    reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This deficiency in 3-IAA impaired the activation of aryl hydrocarbon receptor (AHR), leading to Wnt/β-Catenin pathway hyperactivation, excessive osteoblast differentiation/mineralization, and pathological bone formation."
    explanation: The signalling chain this node records, end to end.
  - reference: PMID:41380608
    reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Restoring 3-IAA levels, either through direct supplementation or an intermittent high-tryptophan diet-reactivated AHR, suppressed Wnt/β-Catenin signaling, and alleviated bone damage in vivo."
    explanation: >-
      The rescue arm, which is what makes this causal rather than correlated -
      restoring the metabolite suppressed Wnt signalling and reduced bone damage.
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "researchers have conducted extensive studies in fields of signaling pathways (Wnt/β-catenin, Notch, PI3K/Akt/mTOR, Hedgehog, parathyroid hormone, and insulin signaling pathways), stress pathways (oxidative stress and endoplasmic reticulum stress pathways), epigenetics (DNA methylation and non-coding RNAs), and their inter-regulation involved in the pathogenesis of skeletal fluorosis."
    explanation: >-
      Graded INDIRECT: the review names Wnt/beta-catenin among the pathways under
      study in this disease, which situates the node but does not establish the
      AHR route above it.

- name: Impaired Collagen Synthesis and Matrix Mineralization
  description: >-
    While osteoblast number and activity rise, the matrix they lay down is
    defective: type I collagen expression falls, and mineralization with it. This
    is the paradox at the centre of the disease - more bone, worse bone - and the
    reason the skeleton becomes both denser and more fragile.
  biological_scale: MOLECULAR
  notes: >-
    The COL1A1 direction conflict is curated on this node as a REFUTE item rather
    than described here, following the convention `sf_osteoblast_dose_response`
    states for the proliferation disagreement on the same node. What that item
    cannot carry: no study has compared the two systems directly, so nothing here
    resolves the discrepancy in favour of either.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Accelerated and Disordered Bone Turnover
    causal_link_type: DIRECT
    description: >-
      Curated without evidence: no source in this entry's reference set asserts that
      the collagen defect drives the turnover change, only that the two co-occur in
      fluoride toxicity. See discussion sf_collagen_turnover_link.
  evidence:
  - reference: PMID:37558119
    reference_title: "Chronic exposure to environmentally relevant concentration of fluoride impairs osteoblast's collagen synthesis and matrix mineralization: Involvement of epigenetic regulation in skeletal fluorosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of collagen Col1a1, Col1a2, COL1A1 was significantly reduced in treated mice."
    explanation: The collagen loss measured in mice given fluoride at an environmentally relevant dose.
  - reference: PMID:24300170
    reference_title: Fluoride promotes osteoblastic differentiation through canonical Wnt/β-catenin signaling pathway.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated that fluoride significantly promoted osteoblasts proliferation and
      alkaline phosphate (ALP) expression as well as the mRNA expression levels of bone
      differentiation markers, including type I collagen (COL1A1), ALP and osteonectin
    explanation: >-
      The opposite collagen direction, in primary rat osteoblasts: COL1A1 mRNA rises
      rather than falls. Graded REFUTE against this node's claim that type I collagen
      expression falls. The node keeps that claim because it rests on the in-vivo
      result at an environmentally relevant dose, while this is primary culture at a
      culture dose; the same paper is cited on the upstream Wnt edge for its DKK-1
      blockade, which is a separate finding and not a collagen direction.
  - reference: PMID:37558119
    reference_title: "Chronic exposure to environmentally relevant concentration of fluoride impairs osteoblast's collagen synthesis and matrix mineralization: Involvement of epigenetic regulation in skeletal fluorosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To unravel the pathogenesis of skeletal fluorosis, we established fluorosis mice by treating environmentally relevant concentration of F (15 ppm NaF) through drinking water for 4 months."
    explanation: >-
      The exposure that produced it - 15 ppm in drinking water for four months,
      which is within the range endemic populations drink.
  - reference: PMID:37558119
    reference_title: "Chronic exposure to environmentally relevant concentration of fluoride impairs osteoblast's collagen synthesis and matrix mineralization: Involvement of epigenetic regulation in skeletal fluorosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a study revealed the involvement of epigenetic regulation by promoter hypermethylation of Col1a1"
    explanation: The epigenetic route to it, by promoter hypermethylation of Col1a1.
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Increased metabolic turnover of the bone, impaired bone collagen synthesis and increased avidity for calcium are features in fluoride toxicity."
    explanation: >-
      Impaired collagen synthesis was already one of the three named features of
      fluoride bone toxicity in 1986, four decades before the epigenetic account.

- name: Histone-Mediated Repression of TGF-beta Receptor Signalling
  description: >-
    A second epigenetic route to the same defective matrix: fluoride raises H3K9
    trimethylation at the TGFBR2 and SMAD3 promoters, and expression of those genes
    and of COL1A1 falls with it. Curated separately from the methylation route
    because it points the opposite way on TGF-beta from the proliferation arm, which
    is a tension this entry records rather than resolves.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Collagen Synthesis and Matrix Mineralization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29275289
      reference_title: "Role of fluoride induced histone trimethylation in development of skeletal fluorosis."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Expression of two other vital genes COL1A1 and MMP13 involved in TGFBR2-SMAD
        signaling pathway was also found to be down-regulated with a decrease in
        expression of TGFBR2 and SMAD3
      explanation: >-
        Reports COL1A1 falling together with the repressed TGFBR2 and SMAD3, which is
        the collagen deficit this edge asserts follows the chromatin repression.
  evidence:
  - reference: PMID:29275289
    reference_title: "Role of fluoride induced histone trimethylation in development of skeletal fluorosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "H3K9 ChIP PCR array analysis identified hyper H3K9 trimethylation in promoter regions of TGFBR2 and SMAD3."
    explanation: The chromatin mark and the promoters it lands on, in a human osteosarcoma cell line.
  - reference: PMID:29275289
    reference_title: "Role of fluoride induced histone trimethylation in development of skeletal fluorosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of two other vital genes COL1A1 and MMP13 involved in TGFBR2-SMAD signaling pathway was also found to be down-regulated with a decrease in expression of TGFBR2 and SMAD3."
    explanation: >-
      The expression consequence, including COL1A1, which is what connects this node
      to the matrix node below it.


- name: Secondary Hyperparathyroidism
  description: >-
    The fluoridated skeleton takes up calcium avidly, and in a proportion of
    patients parathyroid drive rises in response, adding its own bone changes to
    the picture. Curated as a node rather than a comorbidity because it feeds back
    onto bone resorption.
  biological_scale: ORGANISM
  downstream:
  - target: Osteocyte-Driven Osteoclastogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Recorded INDIRECT_KNOWN_INTERMEDIATES because the intermediate is named: the
      osteocyte. The cited coculture work compares PTH with fluoride on
      osteocyte-driven osteoclast differentiation and finds fluoride's effect the
      larger, so this edge is an addition to the fluoride effect rather than the
      route for it.
    evidence:
    - reference: PMID:32156525
      reference_title: "Effect of fluoride on osteocyte-driven osteoclastic differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The impact of fluoride on osteocyte-driven osteoclast differentiation was stronger than that of PTH."
      explanation: >-
        Places PTH on the osteocyte-driven arm this edge runs through, and sizes it
        against fluoride's own effect.
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In a proportion of cases secondary hyperparathyroidism is observed with associated characteristic bone changes."
    explanation: >-
      States both the finding and its partial penetrance - "in a proportion of
      cases" - which is why this node is not on the main chain.

- name: Osteocyte-Driven Osteoclastogenesis
  description: >-
    Osteocytes exposed to fluoride drive osteoclast precursors toward
    differentiation, raising TRAP, RANK, JNK and NFATc1. This is the resorptive half
    of the accelerated turnover, and it is what stops the disease being a pure
    bone-forming disorder.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    modifier: INCREASED
    term:
      id: GO:0030316
      label: osteoclast differentiation
  downstream:
  - target: Accelerated and Disordered Bone Turnover
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34769367
      reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        By up-regulating RANKL and inhibiting SOST, PTH enhances the effectiveness of
        low-dose of fluoride in bone turnover promotion
      explanation: >-
        Connects osteocyte RANKL output to bone turnover promotion. Indirect because the
        sentence is framed around PTH modulating fluoride's effect rather than around
        osteoclastogenesis driving turnover directly.
  evidence:
  - reference: PMID:32156525
    reference_title: "Effect of fluoride on osteocyte-driven osteoclastic differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gene expression levels of TRAP, RANK, JNK and NFAtc1 significantly increased in fluoride affected osteoclast precursor cocultured with osteocyte-like cells."
    explanation: The osteoclastogenic markers raised in the transwell coculture this node describes.
  - reference: PMID:32156525
    reference_title: "Effect of fluoride on osteocyte-driven osteoclastic differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The impact of fluoride on osteocyte-driven osteoclast differentiation was stronger than that of PTH."
    explanation: >-
      The comparison that ranks the two drivers, and the reason the parathyroid edge
      above is recorded as additive rather than as the mechanism.

- name: Accelerated and Disordered Bone Turnover
  description: >-
    Formation and resorption both run fast, and the matrix produced is defective.
    The convergence point of every arm above, and the process the field identifies
    as critical to progression.
  biological_scale: TISSUE
  locations:
  - preferred_term: bone tissue
    term:
      id: UBERON:0002481
      label: bone tissue
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  downstream:
  - target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34769367
      reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: >-
        it can not only cause osteosclerosis by enhancing osteogenic activity but also
        lead to osteoporosis by promoting bone resorption
      explanation: >-
        Derives both poles of the mixed lesion from the two halves of the turnover
        imbalance, which is what makes this node mixed rather than a single lesion.
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Increased metabolic turnover of the bone, impaired bone collagen synthesis and increased avidity for calcium are features in fluoride toxicity."
    explanation: Names increased metabolic turnover as a defining feature of fluoride toxicity in bone.
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, active osteogenesis and accelerated bone turnover are considered critical processes in the progression of skeletal fluorosis."
    explanation: The current review's placement of this process at the centre of progression.

- name: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
  description: >-
    The skeletal lesion is not one thing. Osteosclerosis, osteomalacia and
    osteoporosis coexist in varying proportion, with exostosis formation on top.
    This entry does not force a single lesion, for the same reason it does not force
    a single mode of bone cell response.
  biological_scale: TISSUE
  locations:
  - preferred_term: bone element
    term:
      id: UBERON:0001474
      label: bone element
  downstream:
  - target: Ligament and Interosseous Membrane Ossification
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30415519
      reference_title: "Skeletal fluorosis in Vavuniya District: an observational study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The radiographic criteria of skeletal fluorosis were trabecular haziness,
        osteosclerosis, osteophytes, cortical thickening and ligamentous or muscle
        attachment ossification.
      explanation: >-
        Places osteosclerosis and ligamentous ossification in the same radiographic
        picture. Indirect: the criteria list establishes that the two occur together,
        not that the bone lesion produces the ligamentous one.
  - target: Joint Immobilization and Skeletal Deformity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3295994
      reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        The total quantity of ingested fluoride is the single most important factor
        which determines the clinical course of the disease which is characterized by
        immobilization of joints of the axial skeleton and of the major joints of the
        extremities.
      explanation: >-
        Names joint immobilization as the clinical course of the disease whose bone
        lesion this node describes. Indirect because the sentence runs from ingested
        dose to clinical outcome without asserting the lesion-to-immobilization step.
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A combination of osteosclerosis, osteomalacia and osteoporosis of varying degrees as well as exostosis formation characterizes the bone lesions."
    explanation: The mixed lesion this node is named for, stated as such.
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "patients with skeletal fluorosis mainly present with symptoms of osteosclerosis, osteochondrosis, osteoporosis, and degenerative changes in joint cartilage."
    explanation: >-
      The modern review lists the same mixture, adding osteochondrosis and
      degenerative joint cartilage change.

- name: Ligament and Interosseous Membrane Ossification
  description: >-
    Ossification spreads beyond bone into the ligaments and interosseous membranes,
    which is the radiographic signature of the disease and the step that converts a
    metabolic bone disorder into a mechanical one.
  biological_scale: TISSUE
  locations:
  - preferred_term: ligament
    term:
      id: UBERON:0000211
      label: ligament
  biological_processes:
  - preferred_term: ossification
    modifier: INCREASED
    term:
      id: GO:0001503
      label: ossification
  downstream:
  - target: Spinal Canal and Foraminal Narrowing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2172892
      reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        resulting in generalised sclerosis and osteophytosis, with reduction in the
        diameter of the intervertebral foramina and of the spinal canal
      explanation: >-
        States the narrowing as the consequence of the sclerosis and osteophytosis this
        edge starts from, in a survey of the endemic population.
  - target: Joint Immobilization and Skeletal Deformity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36583212
      reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Radiographic examination of SF may show increased bone matrix density and
        fibrous ossification, tendon attachment calcification, joint degeneration,
        degenerative hyperplasia, and ossification changes in the fibrous tissues
      explanation: >-
        Reports fibrous and tendon-attachment ossification alongside joint degeneration.
        Indirect: the two are listed as coexisting radiographic findings rather than as
        cause and effect.
  evidence:
  - reference: PMID:31501957
    reference_title: "Skeletal fluorosis: don't miss the diagnosis!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Radiographic presentation is mainly characterized by bone changes with osteocondensation and later ossification of many ligaments and interosseous membranes."
    explanation: >-
      The sequence this node records - osteocondensation first, then ossification of
      ligaments and interosseous membranes.
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A 20-30 years' occupational and/or environmental exposure to fluorine may cause osteosclerosis, especially of the spine and pelvic bones, and calcification of spinal ligaments."
    explanation: >-
      The same finding from the occupational literature, with the exposure duration
      it takes and the sites it favours.

- name: Spinal Canal and Foraminal Narrowing
  description: >-
    Generalised sclerosis and osteophytosis reduce the diameter of the spinal canal
    and of the intervertebral foramina. This is the node that makes the neurological
    disease mechanical, and it is why the chain runs through bone rather than
    through nerve.
  biological_scale: TISSUE
  locations:
  - preferred_term: vertebral canal
    term:
      id: UBERON:0006692
      label: vertebral canal
  downstream:
  - target: Compressive Myelopathy and Radiculopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:2172892
      reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These deficits were clearly found to be a consequence of fluoride deposition in
        bones, resulting in generalised sclerosis and osteophytosis, with reduction in
        the diameter of the intervertebral foramina and of the spinal conal.
      explanation: >-
        Names the reduction in canal and foraminal diameter, which is this edge's source
        node, and attributes the myelopathic and radiculopathic deficits to it.
    - reference: PMID:2172892
      reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Advanced osteosclerosis commonly causes severe spastic quadriparesis in flexion,
        accompanied by distressing spasms and urinary incontinence.
      explanation: >-
        Reports the neurological syndrome this edge ends at. Indirect because it
        attributes the syndrome to advanced osteosclerosis, which is upstream of this
        edge's source: reaching the narrowing takes an inference step.
  evidence:
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These deficits were clearly found to be a consequence of fluoride deposition in bones, resulting in generalised sclerosis and osteophytosis, with reduction in the diameter of the intervertebral foramina and of the spinal conal."
    explanation: >-
      Traces the deficits back through the narrowing to the bone deposition, in a
      decade of surveys in the Ethiopian Rift Valley.

- name: Compressive Myelopathy and Radiculopathy
  description: >-
    Cord and root compression from the narrowed canal and foramina, producing
    spastic paresis, spasms and sphincter disturbance in advanced disease. The
    mechanism is compression, not neurotoxicity - this entry curates that
    distinction explicitly, because it is the point on which the management of the
    neurological disease turns.
  biological_scale: ORGANISM
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The neurological manifestations in the forms of myelopathy with and without radiculopathy (respectively 72% and 28%) occurred after exposure to high fluoride (greater than 4 ppm) for longer than 10 years."
    explanation: >-
      The split between myelopathy with and without radiculopathy, and the exposure
      it takes to get there - above 4 ppm for more than ten years.
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advanced osteosclerosis commonly causes severe spastic quadriparesis in flexion, accompanied by distressing spasms and urinary incontinence."
    explanation: The advanced presentation, and what it costs the patient.
  - reference: PMID:19305069
    reference_title: "Neurology of endemic skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurological complications of endemic skeletal fluorosis, namely radiculopathy, myelopathy or both are mechanical in nature and till date the evidence for direct neurotoxicity of fluoride is lacking."
    explanation: >-
      The load-bearing statement for this node's causal_link_type and for the
      `sf_neuro_mechanism` discussion: the complications are mechanical, and direct
      fluoride neurotoxicity is not evidenced. Graded OTHER as a review's assessment
      of a literature rather than its own measurement.

- name: Joint Immobilization and Skeletal Deformity
  description: >-
    The clinical endpoint: the joints of the axial skeleton and the major limb
    joints stiffen and immobilise, with crippling deformity. This is what "crippling
    fluorosis" names.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The total quantity of ingested fluoride is the single most important factor which determines the clinical course of the disease which is characterized by immobilization of joints of the axial skeleton and of the major joints of the extremities."
    explanation: The distribution of the immobilization, axial first and then the large limb joints.
  - reference: PMID:12660366
    reference_title: "Antioxidant defense system and lipid peroxidation in patients with skeletal fluorosis and in fluoride-intoxicated rabbits."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main manifestations of skeletal fluorosis are crippling bone deformities, spinal compressions, and restricted movements of joints."
    explanation: >-
      The three manifestations named together - deformity, spinal compression and
      restricted joint movement - which are the three endpoints this chain reaches.
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Contrary to earlier thinking, severe crippling forms of skeletal fluorosis are seen in paediatric age group too."
    explanation: >-
      That the crippling form occurs in children too. Curated because the older
      assumption was that it did not, and the coal-burning surveys below confirm it.


phenotypes:
- category: Musculoskeletal
  name: Joint Pain and Stiffness
  description: Pain and stiffness in the spine and large joints, and usually the presenting complaint.
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  reports_on:
  - target: Joint Immobilization and Skeletal Deformity
    relationship: READOUT_OF
  evidence:
  - reference: PMID:12660366
    reference_title: "Antioxidant defense system and lipid peroxidation in patients with skeletal fluorosis and in fluoride-intoxicated rabbits."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main manifestations of skeletal fluorosis are crippling bone deformities, spinal compressions, and restricted movements of joints."
    explanation: Names restricted joint movement among the main manifestations.

- category: Musculoskeletal
  name: Restricted Joint Mobility
  description: >-
    Progressive limitation of movement, beginning in the axial skeleton and
    extending to the major limb joints, ending in immobilization.
  phenotype_term:
    preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  reports_on:
  - target: Joint Immobilization and Skeletal Deformity
    relationship: READOUT_OF
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The total quantity of ingested fluoride is the single most important factor which determines the clinical course of the disease which is characterized by immobilization of joints of the axial skeleton and of the major joints of the extremities."
    explanation: The distribution and course of the immobilization this phenotype records.

- category: Skeletal
  name: Osteosclerosis
  description: >-
    Increased bone density, most marked in the spine and pelvis, and the
    radiographic finding the diagnosis is usually made on.
  phenotype_term:
    preferred_term: generalized osteosclerosis
    term:
      id: HP:0005789
      label: Generalized osteosclerosis
  diagnostic: true
  reports_on:
  - target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
    relationship: READOUT_OF
  evidence:
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A 20-30 years' occupational and/or environmental exposure to fluorine may cause osteosclerosis, especially of the spine and pelvic bones, and calcification of spinal ligaments."
    explanation: Names the finding and the sites it favours.
  - reference: PMID:37883215
    reference_title: "Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiologic imaging performed for suspected fractures revealed periosteal reaction, cortical thickening with increased bone density, and ligament and tendon ossification, which were not present on imaging obtained 3 years before presentation."
    explanation: >-
      The radiographic picture in an individual patient, and unusually with a
      three-year-earlier normal comparison that dates its development.
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These deficits were clearly found to be a consequence of fluoride deposition in bones, resulting in generalised sclerosis and osteophytosis, with reduction in the diameter of the intervertebral foramina and of the spinal conal."
    explanation: >-
      Names the sclerosis as generalised, which is the binding this record makes.
  notes: >-
    Bound to `HP:0005789` (Generalized osteosclerosis). The Ethiopian field surveys
    describe "generalised sclerosis" and the occupational review "osteosclerosis,
    especially of the spine and pelvic bones", so the generalized term is what the
    cited evidence carries; the broader `HP:0011001` (Increased bone mineral
    density) would have lost that. Note the deep-research report offered `HP:0100774`
    for "Osteosclerosis"; HPO calls that term *Hyperostosis*, and it is not bound
    here.

- category: Musculoskeletal
  name: Neurogenic Muscle Atrophy
  description: >-
    Muscle wasting in established disease that is neurogenic in origin, not
    myopathic: biopsy shows type I atrophy and type I grouping with no myopathic
    change. Curated because the distinction is the same one the whole neurological
    arm of this entry turns on - the muscle is affected through the nerve.
  phenotype_term:
    preferred_term: Neurogenic skeletal muscle atrophy
    term:
      id: HP:0003202
      label: Skeletal muscle atrophy
  reports_on:
  - target: Compressive Myelopathy and Radiculopathy
    relationship: READOUT_OF
  evidence:
  - reference: PMID:10878791
    reference_title: "Studies on skeletal muscle biopsies in endemic skeletal fluorosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histochemistry and histopathology of muscle biopsies showed features of muscle atrophy, evidenced by 'type I' atrophy and 'type I' grouping. No myopathic changes were observed."
    explanation: >-
      The histological finding, and the absence of the myopathic alternative in the
      same biopsies.
  - reference: PMID:10878791
    reference_title: "Studies on skeletal muscle biopsies in endemic skeletal fluorosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study included 22 patients with established osteofluorosis. 16 of them showed only EMG changes of neurogenic muscle disease."
    explanation: >-
      Graded INDIRECT: the cohort and the electrophysiology behind the biopsy
      finding rather than the finding itself.
  notes: >-
    Filed under Musculoskeletal because the lesion is in muscle, but it is a
    neurological readout and `reports_on` points at the myelopathy node accordingly.
    A frequency is not recorded: 16 of 22 had neurogenic EMG changes, but the
    denominator is a biopsy series of patients with established disease, not a
    prevalence sample.

- category: Genitourinary
  name: Urinary Incontinence
  description: >-
    Sphincter disturbance accompanying the advanced compressive myelopathy, not a
    renal or bladder effect of fluoride.
  phenotype_term:
    preferred_term: Urinary incontinence
    term:
      id: HP:0000020
      label: Urinary incontinence
  reports_on:
  - target: Compressive Myelopathy and Radiculopathy
    relationship: READOUT_OF
  evidence:
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advanced osteosclerosis commonly causes severe spastic quadriparesis in flexion, accompanied by distressing spasms and urinary incontinence."
    explanation: >-
      Names urinary incontinence, with the spasms, as accompanying the advanced
      spastic presentation that advanced osteosclerosis causes.

- category: Skeletal
  name: Bone Pain
  description: Deep skeletal pain in the fluorotic skeleton.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
  reports_on:
  - target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis

epidemiology:
- name: Dose-Dependent Endemic Distribution with Co-Factors
  description: >-
    Occurrence tracks fluoride dose close to linearly up to about 5 mg/L in water,
    and the endemic literature names climate, physical labour, nutritional status,
    other trace elements in the water and renal disease as modifiers of who among
    the exposed is affected.
  evidence:
  - reference: PMID:37861949
    reference_title: "Fluoride Exposure and Skeletal Fluorosis: a Systematic Review and Dose-response Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dose-response curve based on a one-stage cubic spline regression model showed an almost linear positive relation between exposure and SF occurrence starting from relatively low concentrations up to 5 mg/L and 2.5 mg/L, respectively, for water and urinary fluoride, with no substantial increase above this threshold."
    explanation: The dose-response shape, including the plateau above the threshold.
  - reference: PMID:19305069
    reference_title: "Neurology of endemic skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Epidemiological and experimental studies in the endemic areas suggest the role of temperate climate, hard physical labor, nutritional status, presence of abnormal concentrations of trace elements like strontium, uranium, silica in water supplies, high fluoride levels in foods and presence of kidney disease in the development of skeletal fluorosis."
    explanation: >-
      The co-factor list. Renal disease is the mechanistically clearest of them,
      since the kidney is the principal organ of fluoride excretion - though no
      source curated here quantifies the renal share, so this record does not treat
      it as the sole route.
  - reference: PMID:20041010
    reference_title: "Child skeletal fluorosis from indoor burning of coal in southwestern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children aged 12-16 years were significantly more likely to be diagnosed with skeletal fluorosis than children aged 7-11 years (OR = 1.84, 95% CI: 1.17-2.90; P = .0082)."
    explanation: >-
      The age gradient within a childhood cohort, which is what cumulative dose
      predicts.


discussions:
- discussion_id: sf_collagen_turnover_link
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does defective collagen synthesis drive the accelerated bone turnover of skeletal
    fluorosis, or do the two simply co-occur under fluoride?
  rationale: >-
    The edge from `Impaired Collagen Synthesis and Matrix Mineralization` to
    `Accelerated and Disordered Bone Turnover` is curated `causal_link_type: DIRECT`,
    and nothing in this entry's reference set supports that grade. The only sentence
    naming both quantities is PMID:3295994's - "Increased metabolic turnover of the
    bone, impaired bone collagen synthesis and increased avidity for calcium are
    features in fluoride toxicity" - which lists them as features of the toxicity
    rather than deriving one from the other. Both are separately well evidenced as
    consequences of fluoride, so a shared upstream cause explains the co-occurrence
    without the edge. Two resolutions: find a source asserting the step, or weaken the
    link to INDIRECT_UNKNOWN_INTERMEDIATES, which is what the three edges out of
    `Fluorapatite Substitution in Bone Mineral` already carry for the same reason. Not
    changed here because it is a curation call rather than a defect in the evidence.
  attaches_to:
  - pathophysiology#Impaired Collagen Synthesis and Matrix Mineralization
  - pathophysiology#Accelerated and Disordered Bone Turnover

- discussion_id: sf_osteoblast_dose_response
  kind: INTERPRETATION
  prompt: >-
    Does fluoride stimulate or suppress osteoblasts in skeletal fluorosis?
  rationale: >-
    Both, in the curated evidence, and this entry does not choose. Stated in one
    unit so the comparison is visible: at 0.2 mM fluoride - about 3.8 mg/L of
    fluoride ion - proliferation of osteoblast-like human Saos-2 cells rose
    dose-dependently, with osteocalcin and bone alkaline phosphatase raised through
    BMP/Smad. At 2.26 mg/L, proliferation of mouse osteoblasts *fell*
    dose-dependently, with TGF-beta1 and autophagy markers rising. So the
    stimulatory result is at the *higher* dose, not the lower one, which is the
    opposite of the low-stimulates/high-suppresses pattern "biphasic" would imply -
    the word is therefore not used here. What separates the two results in the
    curated evidence is the cell system, human osteosarcoma line against mouse
    primary osteoblasts, and nothing curated here tests either dose in the other
    system. The `Osteoblast Proliferation and Activation` node is named for the
    stimulatory reading because that is what the field's reviews describe as driving
    progression, and the suppressive result is curated on the same node as a REFUTE
    rather than omitted.
  attaches_to:
  - pathophysiology#Osteoblast Proliferation and Activation
  - pathophysiology#Impaired Collagen Synthesis and Matrix Mineralization
  evidence:
  - reference: PMID:23918166
    reference_title: "Fluoride promotes viability and differentiation of osteoblast-like Saos-2 cells via BMP/Smads signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that fluoride enhanced the proliferation of Saos-2 cells in a dose-dependent manner and 0.2 mM of fluoride resulted in a higher expression of osteoblast marker genes."
    explanation: The stimulatory reading, with its dose.
  - reference: PMID:29505816
    reference_title: "TGF-β1 acts as mediator in fluoride-induced autophagy in the mouse osteoblast cells."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Our results demonstrated that sodium fluoride (NaF) (2.26 mg/L F-) exposure lead to a significant decrease in proliferation rate of mouse osteoblast cells in a dose-dependent manner with a concomitant increase in the expression levels of TGF-β1 and autophagic markers."
    explanation: The suppressive reading, with its dose. Graded REFUTE against the stimulatory claim.

- discussion_id: sf_oxidative_stress
  kind: CONTROVERSY
  prompt: >-
    Is oxidative stress part of the pathogenesis of skeletal fluorosis, or not?
  rationale: >-
    Two published positions, stated at their strongest on both sides. For: the 2021
    mechanism review calls oxidative stress "an essential mechanism in the
    pathogenesis of fluorosis" - not a hedge, and not merely a listing among pathways
    under study - and reports raised malondialdehyde in the fluoride-exposed group,
    with oxidative stress correlating positively with calcineurin activity.
    Against: a study measuring the antioxidant defence system directly, in patients
    from a 5 ppm endemic area and in rabbits given 150 ppm for six months, found no
    difference from controls in lipid peroxidation, glutathione, vitamin C, catalase,
    superoxide dismutase, glutathione peroxidase or glutathione S-transferase, and
    concluded against the theory.

    The two are less opposed than they look, and the reason matters: the negative
    study measured *blood*, and the review's positive finding is in *bone tissue*. A
    null result in erythrocytes does not settle what is happening in the osteocyte,
    so this entry does not read the negative as a refutation of the mechanism. What
    it does do is leave the mechanism unlocated: no source curated here measures
    oxidative stress in human fluorotic bone. That is why there is still no
    oxidative-stress node - the mechanism has no curated human tissue-level
    measurement to hang one on - rather than because the negative won. Both positions
    are curated so the next curator can see which measurement would settle it.
  attaches_to:
  - pathophysiology#Osteoblast Proliferation and Activation
  - pathophysiology#Accelerated and Disordered Bone Turnover
  evidence:
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oxidative stress is considered to be an essential mechanism in the pathogenesis of fluorosis."
    explanation: >-
      The strongest statement of the positive position in any source curated here,
      and the review's own assessment rather than a listing of what is studied.
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, malondialdehyde (MDA) levels of the fluoride-infected group were significantly higher than the control group, and oxidative stress levels were also positively correlated with CaN activity"
    explanation: >-
      A measurement behind that assessment rather than the assessment itself - raised
      malondialdehyde, correlating with calcineurin activity. Graded OTHER because the
      review reports it secondhand from the primary studies it cites.
  - reference: PMID:32207100
    reference_title: "Fluoride in Drinking Water and Skeletal Fluorosis: a Review of the Global Impact."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The review focuses on recent findings related to skeletal fluorosis and role of oxidative stress in its development."
    explanation: >-
      Graded INDIRECT: a second review's framing of its own scope, which reports the
      field's attention rather than a finding.
  - reference: PMID:12660366
    reference_title: "Antioxidant defense system and lipid peroxidation in patients with skeletal fluorosis and in fluoride-intoxicated rabbits."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "There was no significant difference in lipid peroxidation, glutathione, and vitamin C in the blood of human fluorotic patients and fluoride-intoxicated rabbits as compared to respective controls."
    explanation: >-
      The measurements, and the reason this discussion does not close: they are
      made in *blood*. Graded OTHER for source because the sentence reports human
      patients and fluoride-intoxicated rabbits together and no single evidence
      source describes both.
  - reference: PMID:12660366
    reference_title: "Antioxidant defense system and lipid peroxidation in patients with skeletal fluorosis and in fluoride-intoxicated rabbits."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "The results together do not subscribe to oxidative stress theory in fluorosis."
    explanation: >-
      The authors' own conclusion against the theory - stated for the whole of
      fluorosis, on blood measurements.

- discussion_id: sf_tgf_beta_direction
  kind: INTERPRETATION
  prompt: >-
    Is TGF-beta signalling up or down in fluoride-exposed bone?
  rationale: >-
    The curated evidence points both ways and the entry models both. On one side,
    TGF-beta1 is raised in a fluoride-exposed human population and NaF activates a
    TGF-beta1/Smad2/3/CyclinD1 axis driving osteoblast proliferation. On the other,
    fluoride raises H3K9 trimethylation at the TGFBR2 and SMAD3 promoters and
    expression of both, and of COL1A1, falls. These are compatible if the ligand and
    the receptor arm move independently, or if the two cell systems and doses differ
    enough - but nothing curated here demonstrates either reconciliation, so the
    entry carries the proliferative arm and the repressive arm as separate nodes
    reaching different consequences, and says so rather than picking one.
  attaches_to:
  - pathophysiology#Osteoblast Proliferation and Activation
  - pathophysiology#Histone-Mediated Repression of TGF-beta Receptor Signalling
  evidence:
  - reference: PMID:34080770
    reference_title: "miR-486-3p regulates CyclinD1 and promotes fluoride-induced osteoblast proliferation and activation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the fluoride-challenged population, we observed that miR-486-3p expression decreased while CyclinD1 and transforming growth factor (TGF)-β1 increased"
    explanation: TGF-beta1 raised in the exposed population, alongside CyclinD1.
  - reference: PMID:29275289
    reference_title: "Role of fluoride induced histone trimethylation in development of skeletal fluorosis."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Expression of two other vital genes COL1A1 and MMP13 involved in TGFBR2-SMAD signaling pathway was also found to be down-regulated with a decrease in expression of TGFBR2 and SMAD3."
    explanation: >-
      Graded REFUTE against a uniformly up-regulated reading: the receptor and SMAD3
      are epigenetically repressed, and COL1A1 falls with them.

- discussion_id: sf_neuro_mechanism
  kind: INTERPRETATION
  prompt: >-
    Are the neurological complications of skeletal fluorosis compressive, or is
    fluoride directly neurotoxic?
  rationale: >-
    Compressive, on the evidence curated here, and the distinction is not academic -
    it is why decompression is offered at all and why the neurological chain in this
    entry runs through bone rather than through nerve. The Ethiopian surveys traced
    the deficits to sclerosis and osteophytosis narrowing the canal and foramina, and
    the Indian review states that the complications are mechanical and that evidence
    for direct fluoride neurotoxicity is lacking. Recorded as an INTERPRETATION rather
    than settled because "evidence is lacking" is a statement about a literature at a
    date, not a demonstration of absence, and fluoride neurotoxicity is actively
    studied in other organs. A muscle-biopsy series adds a third line from the
    periphery - the wasting in established disease is neurogenic, with no primary
    myopathy - which rules out a different alternative than the one this discussion
    turns on, but points the same way.
  attaches_to:
  - pathophysiology#Spinal Canal and Foraminal Narrowing
  - pathophysiology#Compressive Myelopathy and Radiculopathy
  evidence:
  - reference: PMID:19305069
    reference_title: "Neurology of endemic skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurological complications of endemic skeletal fluorosis, namely radiculopathy, myelopathy or both are mechanical in nature and till date the evidence for direct neurotoxicity of fluoride is lacking."
    explanation: The statement this discussion turns on.
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These deficits were clearly found to be a consequence of fluoride deposition in bones, resulting in generalised sclerosis and osteophytosis, with reduction in the diameter of the intervertebral foramina and of the spinal conal."
    explanation: The anatomical route, traced in a decade of field surveys.
  - reference: PMID:10878791
    reference_title: "Studies on skeletal muscle biopsies in endemic skeletal fluorosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It may be concluded that the primary changes are related to the nerve, with muscle being affected secondarily."
    explanation: >-
      An independent line to the same conclusion, from the other end: muscle biopsies
      in established disease show the muscle is affected through the nerve, not
      directly.
  - reference: PMID:10878791
    reference_title: "Studies on skeletal muscle biopsies in endemic skeletal fluorosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of any primary muscle pathology due to fluorosis."
    explanation: >-
      The negative that the sentence above rests on. Note this closes off *primary
      myopathy*, which is a different alternative from the direct cord neurotoxicity
      this discussion is about - it narrows the space rather than settling it.


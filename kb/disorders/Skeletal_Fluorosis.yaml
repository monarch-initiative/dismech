  evidence:
  - reference: PMID:12660366
    reference_title: "Antioxidant defense system and lipid peroxidation in patients with skeletal fluorosis and in fluoride-intoxicated rabbits."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The main manifestations of skeletal fluorosis are crippling bone deformities, spinal compressions, and restricted movements of joints."
    explanation: >-
      Graded INDIRECT: the sentence names crippling bone deformities and restricted

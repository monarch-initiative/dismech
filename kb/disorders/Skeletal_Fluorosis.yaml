name: Skeletal Fluorosis
creation_date: "2026-09-07T17:10:22Z"
category: Environmental Osteopathy
parents:
- Metabolic Bone Disease
- Environmental Disease
disease_term:
  preferred_term: skeletal fluorosis
  term:
    id: MONDO:0400003
    label: skeletal fluorosis
synonyms:
- Fluorosis of the skeleton
- Endemic skeletal fluorosis
- Osteofluorosis
- Crippling fluorosis

description: >-
  Skeletal fluorosis is a crippling metabolic bone and joint disease caused by
  chronic ingestion or inhalation of excess fluoride. Fluoride is a cumulative
  toxin that fixes in calcified tissue, and the skeleton is where the dose
  accumulates: bone turnover accelerates, the matrix laid down is defective, and
  the result is a mixture of osteosclerosis, osteomalacia and osteoporosis with
  exostosis formation. Ligaments and interosseous membranes ossify. The joints of
  the axial skeleton and the large limb joints stiffen and finally immobilise,
  and where the spinal canal and intervertebral foramina narrow enough, the
  patient develops a compressive myelopathy or radiculopathy. Unlike its sibling
  dental fluorosis, which is fixed at the time the enamel forms, skeletal
  fluorosis accrues for as long as the exposure continues. The exposure is
  usually environmental - fluoride-rich groundwater above all, and in specific
  regions high-fluoride brick tea or food dried over indoor coal fires - but the
  same disease is produced by industrial inhalation and by deliberate inhalation
  of fluorocarbon propellants.


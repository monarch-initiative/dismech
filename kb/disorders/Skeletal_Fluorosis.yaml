  phenotype_term:
    preferred_term: Kyphosis
    term:
      id: HP:0002808
      label: Kyphosis
  reports_on:
  - target: Joint Immobilization and Skeletal Deformity
    relationship: READOUT_OF
  evidence:
  - reference: PMID:36426635
    reference_title: "Skeletal fluorosis secondary to harmful inhalant use."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs demonstrated diffuse periosteal new bone formation and sclerosis consistent with skeletal fluorosis."
    explanation: >-
      Graded INDIRECT: the radiographic description is of periosteal new bone and
      sclerosis rather than of kyphosis specifically. The same case presented with
      hand swelling and long bone deformities.
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Contrary to earlier thinking, severe crippling forms of skeletal fluorosis are seen in paediatric age group too."
    explanation: That the crippling deformity occurs in children as well as adults.

- category: Skeletal
  name: Exostoses
  description: >-
    Bony outgrowths at ligament and tendon attachments, listed with the
    osteosclerosis, osteomalacia and osteoporosis as part of the characteristic
    lesion rather than as a separate complication.
  phenotype_term:
    preferred_term: Exostoses
    term:
      id: HP:0100777
      label: Exostoses
  reports_on:
  - target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
    relationship: READOUT_OF
  evidence:
  - reference: PMID:3295994
    reference_title: "Skeletal fluorosis in humans: a review of recent progress in the understanding of the disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A combination of osteosclerosis, osteomalacia and osteoporosis of varying degrees as well as exostosis formation characterizes the bone lesions."
    explanation: >-
      Names exostosis formation alongside the three mineral lesions as what
      characterises the bone in this disease.

- category: Neurologic
  name: Spastic Paresis
  description: >-
    Spastic paresis from cord compression, with spasms and sphincter disturbance in
    advanced disease. Mechanical in origin.
  phenotype_term:
    preferred_term: Spastic quadriparesis in flexion
    term:
      id: HP:0001285
      label: Spastic tetraparesis
  reports_on:
  - target: Compressive Myelopathy and Radiculopathy
    relationship: READOUT_OF
  evidence:
  - reference: PMID:2172892
    reference_title: "Neurological complications of endemic skeletal fluorosis, with special emphasis on radiculo-myelopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advanced osteosclerosis commonly causes severe spastic quadriparesis in flexion, accompanied by distressing spasms and urinary incontinence."
    explanation: >-
      The advanced neurological presentation, and the binding is taken from it
      directly: the source says spastic *quadri*paresis, and `HP:0001285` carries
      "Spastic quadriparesis" as an exact synonym.
  notes: >-
    Bound to `HP:0001285` (Spastic tetraparesis), defined by HPO as "Spastic weakness
    affecting all four limbs" and carrying "Spastic quadriparesis" as an exact
    synonym - a word-for-word match to the cited survey's "severe spastic
    quadriparesis in flexion". Two nearby terms were considered and rejected.
    `HP:0002313` (Spastic paraparesis) was bound in an earlier draft and is wrong on
    distribution: it is a lower-limb deficit, and both the quote and the entry's own
    mechanism - compression at the cervical canal - point to four limbs.
    `HP:0002510` (Spastic tetraplegia) has the right distribution but is defined as
    "Spastic *paralysis* affecting all four limbs", so it over-claims severity
    against a source that says paresis. Nothing curated here describes the deficit at
    an earlier stage, so this record binds the presentation the evidence actually
    reports rather than a generalization the evidence does not.

environmental:
- name: Chronic ingestion of fluoride-rich groundwater
  description: >-
    The dominant exposure worldwide. Fluoride dissolved from bedrock into shallow
    groundwater, drunk for years. The dose-response is close to linear from
    relatively low concentrations, which is why this exposure is curated with a
    threshold rather than as a simple presence.
  exposure_term:
    preferred_term: exposure to fluoride in drinking water via ingestion
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: GENERAL_EXTERNAL
      notes: >-
        Recorded GENERAL_EXTERNAL because the determinant is the geochemistry of the
        local aquifer rather than a discrete personal exposure.
  influences_mechanisms:
  - target: Chronic Excess Fluoride Intake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: This is the intake the initiating node describes, by its commonest route.
    evidence:
    - reference: PMID:37861949
      reference_title: "Fluoride Exposure and Skeletal Fluorosis: a Systematic Review and Dose-response Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The dose-response curve based on a one-stage cubic spline regression model showed an almost linear positive relation between exposure and SF occurrence starting from relatively low concentrations up to 5 mg/L and 2.5 mg/L, respectively, for water and urinary fluoride, with no substantial increase above this threshold."
      explanation: >-
        The dose-response relation between water fluoride and disease occurrence,
        which is what makes this exposure causal rather than merely associated.
  evidence:
  - reference: PMID:34769367
    reference_title: "Progress of Signaling Pathways, Stress Pathways and Epigenetics in the Pathogenesis of Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "High concentrations of fluoride in the environment and drinking water are major causes"
    explanation: Names drinking water as a major cause.
  - reference: PMID:37861949
    reference_title: "Fluoride Exposure and Skeletal Fluorosis: a Systematic Review and Dose-response Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When comparing the highest versus the lowest fluoride category, the summary risk ratio (RR) for SF prevalence was 2.05 (95% CI 1.60; 2.64), with a value of 2.73 (95% CI 1.92; 3.90) for drinking water and 1.40 (95% CI 0.90; 2.17) for urinary fluoride."
    explanation: >-
      The pooled risk ratio across 23 studies, and the useful detail that the
      association is stronger for water fluoride than for urinary fluoride.

- name: Habitual consumption of high-fluoride brick tea
  description: >-
    Brick tea is pressed from older stems and leaves of the tea plant and its
    fluoride content exceeds China's national standard; in Tibetan, Kazakh and
    Mongolian communities it is drunk in quantity. Curated separately from
    groundwater because the intervention is different - the tea has to change, not
    the well.
  exposure_term:
    preferred_term: exposure to fluoride in brick tea via ingestion
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
      notes: >-
        Recorded SPECIFIC_EXTERNAL rather than GENERAL_EXTERNAL, unlike the
        groundwater entry: this is a dietary practice of particular communities, not
        a property of the region's water supply.
  influences_mechanisms:
  - target: Chronic Excess Fluoride Intake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: A second oral route to the same initiating node.
    evidence:
    - reference: PMID:26499132
      reference_title: "Prevalence of Brick Tea-Type Fluorosis in the Tibet Autonomous Region."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The average daily fluoride intake from drinking brick tea in all seven districts in Tibet was much higher than the national standard."
      explanation: >-
        The dose actually delivered by this route: measured daily fluoride intake
        from brick tea above the national standard across all seven Tibetan districts
        surveyed, which is the excess this edge asserts.
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The available evidence revealed that brick tea may be produced from older stems and leaves of the tea plant and that the fluoride content of brick tea exceeds the national standard."
    explanation: >-
      Why brick tea and not tea generally: it is made from older stems and leaves,
      and its fluoride content exceeds the national standard. Graded OTHER as a
      review's synthesis across studies.
  - reference: PMID:33660557
    reference_title: "Association between Bone Morphogenetic Protein 2 Gene Polymorphisms and Skeletal Fluorosis of The Brick-tea Type Fluorosis in Tibetans and Kazakhs, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the standard WS/192-2008 (China), 221 skeletal fluorosis cases were diagnosed, including 123 Tibetans and 98 Kazakhs."
    explanation: >-
      221 diagnosed cases among Tibetan and Kazakh brick-tea drinkers, against
      China's national diagnostic standard - the scale of this exposure's effect.

- name: Indoor combustion of fluoride-rich coal for cooking and food drying
  description: >-
    In parts of southwest China, high-fluoride coal is burned indoors on open
    stoves, and foodstuffs baked over the stove take up fluoride from the smoke. The
    route is both inhalational and dietary, and the cited survey found the disease in
    children exposed during growth.
  exposure_term:
    preferred_term: exposure to fluoride from indoor coal combustion
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
    - classification_value: ORAL
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  influences_mechanisms:
  - target: Chronic Excess Fluoride Intake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Recorded with both INHALATION and ORAL routes because the same practice
      contaminates the indoor air and the food dried in it.
    evidence:
    - reference: PMID:20041010
      reference_title: "Child skeletal fluorosis from indoor burning of coal in southwestern China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Any student lived in a household that burned coal, used an open-burning stove, or baked foodstuffs over a coal stove was deemed high-risk for skeletal fluorosis."
      explanation: The exposure definition the survey used, which names both the stove and the food.
  evidence:
  - reference: PMID:20041010
    reference_title: "Child skeletal fluorosis from indoor burning of coal in southwestern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall prevalence of child skeletal fluorosis due to indoor burning of coal was 7.5%."
    explanation: The prevalence this exposure produced in children in Guizhou.

- name: Occupational and industrial inhalation of fluoride
  description: >-
    Twenty to thirty years of industrial exposure produces the same osteosclerosis
    and spinal ligament calcification as the endemic dietary forms.
  exposure_term:
    preferred_term: occupational exposure to fluoride by inhalation
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  influences_mechanisms:
  - target: Chronic Excess Fluoride Intake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The inhalational route to the same initiating node.
    evidence:
    - reference: PMID:2661032
      reference_title: "Occupational skeletal fluorosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A 20-30 years' occupational and/or environmental exposure to fluorine may cause osteosclerosis, especially of the spine and pelvic bones, and calcification of spinal ligaments."
      explanation: The exposure duration and the skeletal result, from the occupational literature.
  evidence:
  - reference: PMID:28840484
    reference_title: "Pulmonary fluorosis: a review."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: "Although the systemic toxicity of fluoride has been extensively studied, still there is lacuna in the field of pulmonary fluoride toxicity."
    explanation: >-
      Graded NO_EVIDENCE and curated deliberately. This review of pulmonary fluoride
      toxicity is the natural place to look for the inhalational arm's mechanism and
      it says the field has a lacuna there. It bears on the lung rather than on the
      skeleton, so it supports no claim in this entry - but recording that the
      inhalational mechanism is not characterised stops the next curator assuming it
      was simply not looked for.

- name: Deliberate inhalation of fluorocarbon propellants
  description: >-
    Chronic huffing of difluoroethane-containing compressed gas dusters produces
    skeletal fluorosis outside any endemic area; two independent published cases are
    curated here. Recorded as a distinct route because it delivers the exposure with
    no endemic-area history to prompt the diagnosis - how commonly it does so is not
    established by this entry's evidence.
  exposure_term:
    preferred_term: exposure to 1,1-difluoroethane by deliberate inhalation
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: INHALATION
    exposure_duration:
    - classification_value: CHRONIC
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  influences_mechanisms:
  - target: Chronic Excess Fluoride Intake
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A non-endemic, non-dietary route to the same initiating node, at doses far
      above anything the environmental routes deliver.
    evidence:
    - reference: PMID:36426635
      reference_title: "Skeletal fluorosis secondary to harmful inhalant use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diagnostic testing demonstrated urine fluoride 64.5 mg/L (ref <3) and serum fluoride 1.8 mg/L (ref <0.13)."
      explanation: >-
        The measured burden, against the laboratory reference intervals - urine
        fluoride more than twenty times the upper limit.
  notes: >-
    `exposure_term` binds the generic `ECTO:9000423` (exposure to fluoride). ECTO
    was searched and has no term for 1,1-difluoroethane or for propellant inhalation;
    the specific agent and route are carried in `preferred_term`.
  evidence:
  - reference: PMID:36426635
    reference_title: "Skeletal fluorosis secondary to harmful inhalant use."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of skeletal fluorosis from chronic inhalation of an electronic duster product containing 1,1-difluoroethane."
    explanation: The exposure and the agent, in the index case.
  - reference: PMID:37883215
    reference_title: "Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiologic imaging performed for suspected fractures revealed periosteal reaction, cortical thickening with increased bone density, and ligament and tendon ossification, which were not present on imaging obtained 3 years before presentation."
    explanation: >-
      A second, independent case with the same agent - and imaging from three years
      earlier showing none of it, which dates the disease to the exposure.

genetic:
- name: ATP2B1 susceptibility variants
  gene_term:
    preferred_term: ATP2B1
    term:
      id: hgnc:814
      label: ATP2B1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    ATP2B1 encodes a plasma-membrane calcium pump, which is a plausible modifier for
    a disease whose bone shows increased avidity for calcium. Two loci were
    associated in a 962-subject Chinese cross-sectional study, and after confounder
    control the reported protective and risk effects are described within age, sex,
    urinary-fluoride, serum-calcium and serum-phosphorus strata - so this is a
    susceptibility signal in need of replication rather than an established modifier.
    `frequency` is deliberately absent: the source reports no allele frequency, and
    the slot is not a place to describe a study.
  evidence:
  - reference: PMID:37211801
    reference_title: "Association between polymorphism and haplotype of ATP2B1 gene and skeletal fluorosis in Han population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggested that rs17249754 and rs7136259 were associated with skeletal fluorosis."
    explanation: The two associated loci.
  - reference: PMID:37211801
    reference_title: "Association between polymorphism and haplotype of ATP2B1 gene and skeletal fluorosis in Han population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In China, 962 individuals were recruited, including 342 cases of skeletal fluorosis."
    explanation: The study size behind them.
  - reference: PMID:37211801
    reference_title: "Association between polymorphism and haplotype of ATP2B1 gene and skeletal fluorosis in Han population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After controlling confounders, the protective effect of GG genotype in rs17249754 was apparent in individuals over 45 years old, female, with urine fluoride concentration below 1.6 mg/L, serum calcium above 2.25 mmol/L or serum phosphorus between 1.1 and 1.3."
    explanation: >-
      The strata the effects are reported within, which is what this record's notes
      turn on.

- name: ALOX15 variants
  gene_term:
    preferred_term: ALOX15
    term:
      id: hgnc:433
      label: ALOX15
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    No single-SNP association was found; a haplotype effect was reported in Han
    participants only. (`frequency` is absent for the reason given on the ATP2B1
    record - the source reports no allele frequency.)
    Recorded DISPUTED rather than SUSCEPTIBILITY because the primary analysis was
    negative and the positive result is a haplotype effect confined to one of the
    three ethnic groups studied and to particular age and intake strata. Curated at
    all because the negative half is worth recording.
  evidence:
  - reference: PMID:31565963
    reference_title: "Association between ALOX15 gene polymorphism and brick-tea type skeletal fluorosis in Tibetans, Kazaks and Han, China."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The genotypes of ALOX15 rs7220870, rs2664593 and rs1107852 were not associated with the risk of SF."
    explanation: >-
      Graded REFUTE against a single-SNP association: none of the three genotypes was
      associated with risk across the 1,023-subject study.
  - reference: PMID:31565963
    reference_title: "Association between ALOX15 gene polymorphism and brick-tea type skeletal fluorosis in Tibetans, Kazaks and Han, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After reconstructing the haplotype of rs7220870 and rs11078528, the risk effect of haplotype CA was found in Han participants aged ≤45 years or with moderate fluoride intake."
    explanation: >-
      The positive half, and its limits - one ethnic group, and only in defined age
      and fluoride-intake strata.

- name: ESR1 rs9340799
  gene_term:
    preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  relationship_type: PROTECTIVE
  variant_origin: GERMLINE
  notes: >-
    Recorded PROTECTIVE, which is the direction reported: carrying the G allele
    lowered the odds of brick-tea-type fluorosis in a 989-subject cross-sectional
    study across Inner Mongolia, Qinghai and Xinjiang, diagnosed against the Chinese
    national standard WS192-2008. As with the other genetic records here this is a
    single unreplicated study, and the authors themselves frame the ethnic
    differences as modifiable by tea fluoride intake, sex and age.
  evidence:
  - reference: PMID:39824337
    reference_title: "Association between ESR1 and COL1A1 gene polymorphisms and skeletal fluorosis in Tibetan, Kazakh, Mongolian and Russian populations, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Binary logistic regression found that carried the ESR1 Rs9340799 G allele played a protective role in brick-tea-type fluorosis"
    explanation: The protective association, and the population it was found in.
  - reference: PMID:39824337
    reference_title: "Association between ESR1 and COL1A1 gene polymorphisms and skeletal fluorosis in Tibetan, Kazakh, Mongolian and Russian populations, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The X-ray of the participants were diagnosed according to the diagnostic criteria of Chinese endemic skeletal fluorosis (WS192-2008)."
    explanation: The case definition the association rests on.
  - reference: PMID:39824337
    reference_title: "Association between ESR1 and COL1A1 gene polymorphisms and skeletal fluorosis in Tibetan, Kazakh, Mongolian and Russian populations, China."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggested that there may be a genetic component to the risk of skeletal fluorosis in participants of different ethnicities and that this difference could modified by tea fluoride intake, sex or age."
    explanation: >-
      Graded INDIRECT: the authors' own summary of what the study establishes, which
      qualifies the individual association rather than asserting it.

- name: COL1A1 rs1800012
  gene_term:
    preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The reported risk effect is confined to Russian participants in the same
    989-subject study, and within them was significant in men on sex-stratified
    analysis. The confidence interval is very wide, which is what a subgroup effect
    in a small stratum looks like; recorded because COL1A1 encodes the collagen whose
    synthesis the `Impaired Collagen Synthesis and Matrix Mineralization` node is
    about, and a reader looking for that gene should find the evidence and its
    limits rather than nothing.
  evidence:
  - reference: PMID:39824337
    reference_title: "Association between ESR1 and COL1A1 gene polymorphisms and skeletal fluorosis in Tibetan, Kazakh, Mongolian and Russian populations, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Russians carried the COL1A1 Rs1800012 T allele had a significantly higher risk of developing skeletal fluorosis"
    explanation: The association, and the single ethnic group it was found in.
  - reference: PMID:39824337
    reference_title: "Association between ESR1 and COL1A1 gene polymorphisms and skeletal fluorosis in Tibetan, Kazakh, Mongolian and Russian populations, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When stratified by sex, carriage of the T allele in COL1A1 Rs1800012 significantly increased the risk of developing skeletal fluorosis in Russian men."
    explanation: The sex-stratified result, which narrows it further.

- name: BMP2 variants tested and not associated
  gene_term:
    preferred_term: BMP2
    term:
      id: hgnc:1069
      label: BMP2
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    A negative record kept on purpose. BMP signalling is the pathway the osteoblast
    activation node runs through, so BMP2 is exactly the gene a reader would expect
    to modify susceptibility - and in 598 Tibetan and Kazakh brick-tea drinkers it
    did not. `relationship_type: DISPUTED` because the vocabulary has no value for
    *tested and negative*: `DISPUTED` at least records that the claim was examined,
    where `UNKNOWN` - the other value that asserts no association - would read as
    untested.
  evidence:
  - reference: PMID:33660557
    reference_title: "Association between Bone Morphogenetic Protein 2 Gene Polymorphisms and Skeletal Fluorosis of The Brick-tea Type Fluorosis in Tibetans and Kazakhs, China."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Logistic regressions 2 analysis did not find the association between SNPs (Rs235764, Rs235739 and Rs996544) and skeletal fluorosis."
    explanation: >-
      Graded REFUTE against this record's own claim. Three SNPs tested, none
      associated, and the genetic-model, linkage-disequilibrium and haplotype
      analyses negative as well.
  - reference: PMID:33660557
    reference_title: "Association between Bone Morphogenetic Protein 2 Gene Polymorphisms and Skeletal Fluorosis of The Brick-tea Type Fluorosis in Tibetans and Kazakhs, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the standard WS/192-2008 (China), 221 skeletal fluorosis cases were diagnosed, including 123 Tibetans and 98 Kazakhs."
    explanation: The cohort and the diagnostic standard the negative rests on.


biochemical:
- name: Urinary fluoride
  presence: Increased
  biomarker_term:
    preferred_term: urinary fluoride concentration
    term:
      id: CHEBI:17051
      label: fluoride
  notes: >-
    The standard exposure biomarker, and the one the occupational diagnostic
    threshold is written against. Note it performs less well than water fluoride as
    a predictor of disease in the pooled analysis, which is recorded on its readout.
  readouts:
  - target: Chronic Excess Fluoride Intake
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Reports current intake. It is a weaker predictor of disease than water
      fluoride, which is expected of a short-half-life exposure marker for a disease
      that accumulates over decades.
    evidence:
    - reference: PMID:37861949
      reference_title: "Fluoride Exposure and Skeletal Fluorosis: a Systematic Review and Dose-response Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When comparing the highest versus the lowest fluoride category, the summary risk ratio (RR) for SF prevalence was 2.05 (95% CI 1.60; 2.64), with a value of 2.73 (95% CI 1.92; 3.90) for drinking water and 1.40 (95% CI 0.90; 2.17) for urinary fluoride."
      explanation: >-
        The pooled estimate for urinary fluoride, 1.40 with an interval crossing 1,
        against 2.73 for drinking water.
    - reference: PMID:37861949
      reference_title: "Fluoride Exposure and Skeletal Fluorosis: a Systematic Review and Dose-response Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The RR for developing moderate-severe forms increases at 5.00 mg/L and 2.5 mg/L of water and urinary fluoride, respectively."
      explanation: The urinary threshold above which moderate-severe disease risk rises.
  reference_ranges:
  - upper_bound: 3.0
    unit: mg/L
    evidence:
    - reference: PMID:36426635
      reference_title: "Skeletal fluorosis secondary to harmful inhalant use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diagnostic testing demonstrated urine fluoride 64.5 mg/L (ref <3) and serum fluoride 1.8 mg/L (ref <0.13)."
      explanation: >-
        The reference limit is quoted inline with the patient's value - urine
        fluoride 64.5 mg/L against a reference below 3.
    notes: >-
      `loinc_term` absent: no LOINC lookup was performed and the slot is
      `recommended`. This is a clinical laboratory's reference limit as quoted in a
      case report, not a population-derived interval.
  evidence:
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "early diagnosis is based on the history of occupational exposure, examination of urinary fluoride excretion (over 8 mg F-/litre in 24 hours) and radiological signs."
    explanation: >-
      The occupational diagnostic threshold, expressed as 24-hour excretion rather
      than concentration.

- name: Serum fluoride
  presence: Increased
  biomarker_term:
    preferred_term: serum fluoride concentration
    term:
      id: CHEBI:17051
      label: fluoride
  notes: >-
    Recorded separately from urinary fluoride because it is a different specimen
    with a much lower reference limit, and because the two were reported together in
    the inhalant cases where both were extreme.
  readouts:
  - target: Chronic Excess Fluoride Intake
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reports circulating fluoride, the fraction en route to the skeleton.
    evidence:
    - reference: PMID:36426635
      reference_title: "Skeletal fluorosis secondary to harmful inhalant use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diagnostic testing demonstrated urine fluoride 64.5 mg/L (ref <3) and serum fluoride 1.8 mg/L (ref <0.13)."
      explanation: Serum fluoride roughly fourteen times the upper reference limit in the index case.
  reference_ranges:
  - upper_bound: 0.13
    unit: mg/L
    evidence:
    - reference: PMID:36426635
      reference_title: "Skeletal fluorosis secondary to harmful inhalant use."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diagnostic testing demonstrated urine fluoride 64.5 mg/L (ref <3) and serum fluoride 1.8 mg/L (ref <0.13)."
      explanation: The serum reference limit, quoted inline with the patient's value.
    notes: >-
      As for urinary fluoride, this is a laboratory reference limit quoted in a case
      report rather than a population-derived interval, and `loinc_term` is absent
      for the same reason.

- name: Serum soluble Klotho
  presence: Increased
  biomarker_term:
    preferred_term: serum soluble Klotho
    term:
      id: NCIT:C98116
      label: Klotho
  notes: >-
    A candidate severity marker rather than an exposure marker. It rises with tea
    fluoride intake, rises with disease severity, and rose in fluoride-exposed rats.
    The direction is *up*, stated plainly on the record because an earlier draft of
    this entry had it backwards. The study reports it as a partial mediator, carrying
    17.76% of the effect of intake on severity, so it is neither the whole path nor a
    bystander. Single study, unreplicated, and this entry curates no account of what
    sKlotho is measuring in bone.
  readouts:
  - target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Recorded CORRELATES_WITH, not READOUT_OF: the study relates sKlotho to disease
      severity, and this entry curates no account of what sKlotho measures in bone.
    evidence:
    - reference: PMID:32721666
      reference_title: "sKlotho is associated with the severity of brick tea-type skeletal fluorosis in China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Serum sKlotho levels were also positively associated with the severity of SF"
      explanation: The association and its direction - positive, with severity.
    - reference: PMID:32721666
      reference_title: "sKlotho is associated with the severity of brick tea-type skeletal fluorosis in China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mediation analysis showed that serum sKlotho levels mediated 17.76% of the increase in the severity of SF caused by an increase of 1 mg/day of TFI."
      explanation: >-
        The mediated fraction, which is what makes this a candidate mechanism marker
        rather than only a correlate.
  evidence:
  - reference: PMID:32721666
    reference_title: "sKlotho is associated with the severity of brick tea-type skeletal fluorosis in China."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, a significant increase of serum sKlotho levels in fluoride-exposed groups was also seen in the rat model."
    explanation: >-
      The same direction in the rat model, which is the study's own verification of
      the human finding.
  - reference: PMID:32721666
    reference_title: "sKlotho is associated with the severity of brick tea-type skeletal fluorosis in China."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A cross sectional case control study was conducted in residents over 50 years old from brick-tea drinking areas in Qinghai and Xinjiang Provinces, China."
    explanation: >-
      Graded INDIRECT: the population and design the association rests on, rather than
      the result.

diagnosis:
- name: Radiographic Diagnosis
  description: >-
    The diagnosis is radiographic: increased bone density in the axial skeleton
    first, then ossification of ligaments and interosseous membranes.
  evidence:
  - reference: PMID:31501957
    reference_title: "Skeletal fluorosis: don't miss the diagnosis!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Radiographic presentation is mainly characterized by bone changes with osteocondensation and later ossification of many ligaments and interosseous membranes."
    explanation: The radiographic sequence the diagnosis rests on.
  - reference: PMID:37883215
    reference_title: "Skeletal Fluorosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiologic imaging performed for suspected fractures revealed periosteal reaction, cortical thickening with increased bone density, and ligament and tendon ossification, which were not present on imaging obtained 3 years before presentation."
    explanation: The same findings in an individual case, itemised.

- name: Exposure History and Urinary Fluoride
  description: >-
    Radiography alone does not distinguish this disease from several others, so the
    diagnosis rests on exposure history and fluoride measurement alongside it. The
    occupational literature sets a 24-hour urinary excretion threshold.
  evidence:
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "early diagnosis is based on the history of occupational exposure, examination of urinary fluoride excretion (over 8 mg F-/litre in 24 hours) and radiological signs."
    explanation: The three-part diagnostic basis, with the urinary threshold.
  notes: >-
    The threshold quoted is for occupational exposure and is expressed as 24-hour
    excretion, which is not interchangeable with the spot concentration reference
    limits recorded under `biochemical`. Both are curated; neither is converted into
    the other here.

- name: China National Diagnostic Standard WS/192-2008
  description: >-
    Chinese field studies diagnose against a national standard rather than
    study-specific criteria, which is what makes their prevalence figures comparable.
  evidence:
  - reference: PMID:33660557
    reference_title: "Association between Bone Morphogenetic Protein 2 Gene Polymorphisms and Skeletal Fluorosis of The Brick-tea Type Fluorosis in Tibetans and Kazakhs, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the standard WS/192-2008 (China), 221 skeletal fluorosis cases were diagnosed, including 123 Tibetans and 98 Kazakhs."
    explanation: Names the standard and shows it in use as the case definition.
  notes: >-
    The standard's own content is not curated here - its text was not obtained, and
    this record cites only the fact of its use.

differential_diagnoses:
- name: Ankylosing Spondylitis
  description: >-
    Spinal ligament calcification and axial stiffness overlap closely. The
    discriminators are the exposure history and the fluoride measurements, not the
    radiograph.
  evidence:
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The radiological picture may mimic many other diseases, especially ankylosing spondylitis, diffuse idiopathic hyperostosis, and rare bone diseases, such as Albers-Schönberg disease."
    explanation: Names this differential explicitly, alongside the others in this section.

- name: Diffuse Idiopathic Skeletal Hyperostosis
  description: >-
    Flowing ossification along the spine is the shared feature; DISH does not
    produce the generalised osteosclerosis or the interosseous membrane ossification.
  evidence:
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The radiological picture may mimic many other diseases, especially ankylosing spondylitis, diffuse idiopathic hyperostosis, and rare bone diseases, such as Albers-Schönberg disease."
    explanation: Named in the same list of radiological mimics.

- name: Osteopetrosis
  description: >-
    Albers-Schonberg disease shares the dense skeleton. It is congenital and lacks
    the ligamentous ossification and the exposure history.
  evidence:
  - reference: PMID:2661032
    reference_title: "Occupational skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The radiological picture may mimic many other diseases, especially ankylosing spondylitis, diffuse idiopathic hyperostosis, and rare bone diseases, such as Albers-Schönberg disease."
    explanation: Named among the rare bone diseases the radiological picture mimics.

- name: Rheumatological Disease Generally
  description: >-
    Before the radiograph is taken, the presentation is joint pain and stiffness,
    and the disease is not clinically obvious.
  evidence:
  - reference: PMID:31501957
    reference_title: "Skeletal fluorosis: don't miss the diagnosis!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Skeletal fluorosis is not clinically obvious and can be confused with other rheumatologic disorders."
    explanation: States the general confusion this record names.
  - reference: PMID:30415519
    reference_title: "Skeletal fluorosis in Vavuniya District: an observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 16 had been misdiagnosed as various types of arthritis."
    explanation: >-
      The confusion measured rather than asserted: every one of the sixteen Sri
      Lankan patients with confirmed fluoride bone disease had been carrying an
      arthritis diagnosis.

treatments:
- name: Water Improvement and Defluoridation
  description: >-
    Replacing or treating high-fluoride drinking water. The only intervention in
    this entry with pooled evidence that it reduces disease prevalence, and the one
    the public-health literature is built around.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: defluoridation of the drinking water supply
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Chronic Excess Fluoride Intake
    treatment_effect: INHIBITS
    description: Removes the exposure the initiating node describes.
    evidence:
    - reference: PMID:33333408
      reference_title: "Effects of water improvement and defluoridation on fluorosis-endemic areas in China: A meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With water improvement, water fluoride levels decreased from 2.72 mg/L to 0.54 mg/L (95% confidence intervals: -2.75, -1.58), which was below the standard for drinking water (1.5 mg/L)."
      explanation: >-
        Evidence for the link rather than the outcome: water fluoride fell from 2.72
        to 0.54 mg/L, below the 1.5 mg/L standard, which is the exposure node being
        acted on.
  evidence:
  - reference: PMID:33333408
    reference_title: "Effects of water improvement and defluoridation on fluorosis-endemic areas in China: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after water improvement, the prevalence of dental fluorosis decreased from 54.5% to 36.2% (95% confidence intervals: 0.12, 0.31) in children, and the prevalence of skeletal fluorosis decreased from 13.7% to 4.2% (95% confidence intervals: 0.16, 0.40) in adults."
    explanation: >-
      Adult skeletal fluorosis prevalence fell from 13.7% to 4.2% over an average of
      nearly sixteen years of water improvement.
  notes: >-
    `therapeutic_modality: OTHER` rather than BEHAVIORAL: replacing or treating a
    village water supply is public-works engineering, and nothing about the patient's
    behaviour changes.

- name: Symptomatic and Supportive Management
  description: >-
    Once established, the skeletal disease is not reversed by any treatment curated
    here, and management is directed at symptoms.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: symptomatic management
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Joint Immobilization and Skeletal Deformity
    treatment_effect: MODULATES
    description: >-
      Directed at the clinical endpoint. No treatment in this entry acts on a node
      upstream of it once exposure has stopped.
  evidence:
  - reference: PMID:31501957
    reference_title: "Skeletal fluorosis: don't miss the diagnosis!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Management of fluorosis generally focuses on symptom treatment."
    explanation: States the management position this record records.
  - reference: PMID:37558119
    reference_title: "Chronic exposure to environmentally relevant concentration of fluoride impairs osteoblast's collagen synthesis and matrix mineralization: Involvement of epigenetic regulation in skeletal fluorosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Globally, 200 million people are suffering from toxic manifestations of Fluoride(F), dental and skeletal fluorosis; unfortunately, there is no treatment."
    explanation: >-
      The blunter statement of the same thing, and the scale it applies at - 200
      million people, and no treatment. Graded OTHER as a paper's framing of its
      field rather than its own result.

- name: Surgical Decompression for Compressive Myelopathy
  description: >-
    Decompression for the neurological complications. Its role is limited and it is
    selected on imaging rather than offered routinely, which follows from the
    neurological disease being mechanical.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal cord decompression
    term:
      id: NCIT:C124141
      label: Spinal Cord Decompression
  target_mechanisms:
  - target: Compressive Myelopathy and Radiculopathy
    treatment_effect: BYPASSES
    description: >-
      Recorded BYPASSES: decompression relieves the compression without acting on
      the ossification producing it, which continues while exposure does.
    evidence:
    - reference: PMID:19305069
      reference_title: "Neurology of endemic skeletal fluorosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Surgery has a limited role in alleviating the neurological disability and should be tailored to the individual based on the imaging findings."
      explanation: >-
        States both the limited role and the imaging-led selection this record
        describes.
  evidence:
  - reference: PMID:19305069
    reference_title: "Neurology of endemic skeletal fluorosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Neurological complications of endemic skeletal fluorosis, namely radiculopathy, myelopathy or both are mechanical in nature and till date the evidence for direct neurotoxicity of fluoride is lacking."
    explanation: >-
      Graded INDIRECT: that the complications are mechanical is the rationale for
      offering decompression at all, but the sentence does not itself evaluate the
      operation.

- name: Calcium and Vitamin D Supplementation
  description: >-
    Calcium and vitamin D given alongside, or after, fluoride exposure. Two
    independent rodent studies report it alleviating established skeletal fluorosis:
    in mice it reduced fluoride deposition and restored the bone's elemental profile,
    and in rats low dietary calcium aggravated the disease while calcium plus
    fluoride-free water normalised bone turnover and restored osteocalcin,
    osteonectin and osteopontin expression. Rodent evidence only in this entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: calcium and vitamin D supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: calcium
      term:
        id: CHEBI:29108
        label: calcium(2+)
    - preferred_term: vitamin D
      term:
        id: CHEBI:27300
        label: vitamin D
  target_mechanisms:
  - target: Fluorapatite Substitution in Bone Mineral
    treatment_effect: INHIBITS
    description: >-
      Acts on the mineral node: supplementation reduced fluoride deposition in bone
      and retained its elemental homeostasis.
    evidence:
    - reference: PMID:33057951
      reference_title: "Calcium and Vitamin D Supplementation Effectively Alleviates Dental and Skeletal Fluorosis and Retain Elemental Homeostasis in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "supplementation of calcium and vitamin D effectively alleviated dental and skeletal fluorosis, reduced F deposition, and retained elemental homeostasis of the bone."
      explanation: The deposition and elemental-profile result, in vivo.
  - target: Accelerated and Disordered Bone Turnover
    treatment_effect: MODULATES
    description: >-
      Acts on the turnover node: bone turnover was normalised and the matrix-protein
      genes recovered in the reversal arm.
    evidence:
    - reference: PMID:32770327
      reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expressions of osteocalcin, osteonectin and osteopontin were upregulated after providing NCD and FFW."
      explanation: >-
        The matrix-protein expression recovering in the calcium-plus-fluoride-free
        water arm.
    - reference: PMID:32770327
      reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Bone turnover in group 4X was normalised."
      explanation: The turnover result itself, in the same reversal arm.
  evidence:
  - reference: PMID:32770327
    reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, low calcium aggravates skeletal fluorosis which could be mitigated on supplementation of Ca and FFW."
    explanation: >-
      The authors' own conclusion, and the reason this record exists in both
      directions: low calcium aggravates the disease, and supplementing it mitigates.
  - reference: PMID:42336527
    reference_title: "Environmental fluoride exposure and bone metabolism: Molecular pathways and health implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "It also inhibits vitamin D hydroxylation, decreasing active vitamin D bioavailability and impairing calcium and phosphorus absorption."
    explanation: >-
      Graded INDIRECT: a rationale rather than an outcome - fluoride inhibits vitamin
      D hydroxylation and impairs calcium absorption, which is the deficit this
      supplementation would be replacing.
  notes: >-
    Curated as rodent-evidenced, not as established human therapy. Both studies are
    animal models, and the two act through different comparisons - one supplements
    during and after exposure, the other supplements alongside removal of the
    fluoride source, so neither isolates the supplement from the exposure change. It
    is recorded because the clinical literature recommends it widely and a reader
    should find its actual evidence base here rather than an absence.

- name: Tryptophan Supplementation to Restore Gut-Derived AHR Signalling
  description: >-
    Restoring indole-3-acetic acid, by direct supplementation or an intermittent
    high-tryptophan diet, suppressed Wnt signalling and reduced bone damage in the
    rat model. Curated as an investigational lead, not a treatment - there is no
    human evidence here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: dietary tryptophan supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: L-tryptophan
      term:
        id: CHEBI:16828
        label: L-tryptophan
    - preferred_term: indole-3-acetic acid
      term:
        id: CHEBI:16411
        label: indole-3-acetic acid
  target_mechanisms:
  - target: Aryl Hydrocarbon Receptor Underactivation with Wnt Hyperactivation
    treatment_effect: INHIBITS
    description: Reactivates the receptor whose underactivation this node describes.
    evidence:
    - reference: PMID:41380608
      reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Restoring 3-IAA levels, either through direct supplementation or an intermittent high-tryptophan diet-reactivated AHR, suppressed Wnt/β-Catenin signaling, and alleviated bone damage in vivo."
      explanation: The rescue result, in vivo.
  notes: >-
    Rodent only. It is recorded because it targets a node the exposure-removal
    measures do not, but nothing here supports offering it to a patient. Both arms
    the source describes are curated in `therapeutic_agent`: the microbial metabolite
    3-IAA whose level is restored, and the tryptophan the high-tryptophan diet
    supplies. `NCIT:C15433` (Nutritional Support) is the treatment action because
    that is the NCIT clinical-action term for supplying a specific compound; the
    agents, not the action, carry the specificity.

animal_models:
- name: NaF-exposed Swiss albino mouse
  species: Mouse
  genotype: Wild type (Swiss albino)
  description: >-
    15 ppm sodium fluoride in drinking water for four or eight months, with arms for
    exposure withdrawal and for calcium plus vitamin D supplementation. The model
    this entry's calcium and vitamin D treatment record rests on.
  publication: PMID:33057951
  modeled_mechanisms:
  - target: Skeletal Fluoride Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Produces skeletal fluorosis with measurable fluoride deposition and an altered
      bone metal profile at a dose ten times the human permissible limit.
    limitations: >-
      Four to eight months in a mouse against years to decades in a human, at 15 ppm
      against the 1.5 ppm permissible limit - the exposure is compressed in time and
      raised in dose to fit a rodent lifespan.
    evidence:
    - reference: PMID:33057951
      reference_title: "Calcium and Vitamin D Supplementation Effectively Alleviates Dental and Skeletal Fluorosis and Retain Elemental Homeostasis in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NaF treatment caused dental fluorosis, skeletal fluorosis, and alteration of bone's metal profile."
      explanation: The model produces the disease this entry curates, plus its dental sibling.
  - target: Fluorapatite Substitution in Bone Mineral
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The supplementation arm: calcium and vitamin D reduced fluoride deposition and
      restored the bone's elemental homeostasis.
    limitations: >-
      A rescue in a rodent at a fixed supraphysiological dose. No human trial of this
      intervention is curated anywhere in this entry.
    readouts:
    - name: Bone fluoride deposition and elemental profile
      target: Fluorapatite Substitution in Bone Mineral
      direction: RESTORED
      interpretation: >-
        The measured outcome behind the calcium and vitamin D treatment record.
      evidence:
      - reference: PMID:33057951
        reference_title: "Calcium and Vitamin D Supplementation Effectively Alleviates Dental and Skeletal Fluorosis and Retain Elemental Homeostasis in Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "supplementation of calcium and vitamin D effectively alleviated dental and skeletal fluorosis, reduced F deposition, and retained elemental homeostasis of the bone."
        explanation: Deposition reduced and elemental homeostasis retained.
    evidence:
    - reference: PMID:33057951
      reference_title: "Calcium and Vitamin D Supplementation Effectively Alleviates Dental and Skeletal Fluorosis and Retain Elemental Homeostasis in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "supplementation of calcium and vitamin D effectively alleviated dental and skeletal fluorosis, reduced F deposition, and retained elemental homeostasis of the bone."
      explanation: The rescue this link records.

- name: Fluoride-intoxicated Wistar rat on manipulated dietary calcium
  species: Rat
  genotype: Wild type (Wistar)
  description: >-
    100 ppm fluoride in water for six months against normal (0.5%) and low (0.25%)
    calcium diets, then a three-month reversal phase with fluoride-free water. The
    model that separates fluoride's effect from dietary calcium's.
  publication: PMID:32770327
  modeled_mechanisms:
  - target: Accelerated and Disordered Bone Turnover
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the entry's central paradox directly: turnover up while bone mineral
      content and mechanical properties fall, with trabecular separation and porosity
      rising - denser activity, weaker bone.
    limitations: >-
      The effect is largest in the low-calcium arm, so the model as run confounds
      fluoride excess with dietary calcium deficiency; the normal-calcium arm is what
      isolates the fluoride effect.
    readouts:
    - name: Bone turnover, mineral content and biomechanical properties
      target: Accelerated and Disordered Bone Turnover
      direction: INCREASED
      interpretation: >-
        Turnover increased while mineral content and biomechanics decreased - the
        dissociation this node is about.
      evidence:
      - reference: PMID:32770327
        reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The results revealed that in phase I, bone turnover was significantly increased whereas bone mineral content and biomechanical properties of group 4 were significantly decreased"
        explanation: The measurement, in the low-calcium fluoride arm.
    - name: Trabecular separation and total porosity
      target: Accelerated and Disordered Bone Turnover
      direction: INCREASED
      interpretation: The microarchitectural correlate of the disordered turnover.
      evidence:
      - reference: PMID:32770327
        reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Trabecular separation and total porosity increased in groups 2 and 4."
        explanation: Both rose in the calcium-deficient arms.
    evidence:
    - reference: PMID:32770327
      reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results revealed that in phase I, bone turnover was significantly increased whereas bone mineral content and biomechanical properties of group 4 were significantly decreased"
      explanation: Establishes the model as informative for this node.
  - target: Impaired Collagen Synthesis and Matrix Mineralization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Osteocalcin, osteonectin and osteopontin were downregulated under fluoride and
      recovered in the reversal arm - matrix protein expression tracking the node.
    limitations: >-
      Transcript-level, in rat bone. The human node is built on COL1A1 and TGF-beta
      receptor work in cell systems, and nothing curated connects the two directly.
    readouts:
    - name: Osteocalcin, osteonectin and osteopontin expression
      target: Impaired Collagen Synthesis and Matrix Mineralization
      direction: DECREASED
      interpretation: Matrix protein transcription falling under fluoride.
      evidence:
      - reference: PMID:32770327
        reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Expression of osteocalcin, osteonectin and osteopontin genes was significantly downregulated in group 4."
        explanation: The downregulation, in the low-calcium fluoride arm.
    evidence:
    - reference: PMID:32770327
      reference_title: "Supplementation of Calcium and Fluoride-Free Water Mitigates Skeletal Fluorosis in Fluoride-Intoxicated Rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of osteocalcin, osteonectin and osteopontin genes was significantly downregulated in group 4."
      explanation: The matrix-protein result this link rests on.

- name: Inbred mouse strain panel for fluoride bone susceptibility
  species: Mouse
  genotype: Wild type, three inbred backgrounds
  background: A/J (susceptible), SWR/J (intermediate), 129P3/J (resistant)
  description: >-
    0, 25, 50 and 100 ppm fluoride across three inbred strains chosen for their
    different susceptibility to enamel fluorosis, with bone fluoride, DEXA and
    three-point bend, compression and femoral-neck fracture testing. The model that
    speaks to this entry's genetic susceptibility records.
  publication: PMID:16920415
  modeled_mechanisms:
  - target: Skeletal Fluoride Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Bone fluoride rose with dose in femora and vertebral bodies in every strain,
      which is this node with a dose-response attached.
    evidence:
    - reference: PMID:16920415
      reference_title: "The genetic influence on bone susceptibility to fluoride."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Concordant with increasing fluoride dose were significant increases of fluoride concentration in femora and vertebral bodies from all 3 strains."
      explanation: Accumulation, dose-dependent, in all three backgrounds.
  - target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model does not reproduce the finding the human disease is diagnosed on.
      Fluoride accumulated in bone and degraded bone quality, but bone mineral
      density barely moved - and increased bone mineral density is the radiographic
      sign this entry binds `HP:0005789` to and calls the diagnosis.
    limitations: >-
      A model that reproduces the exposure and the mechanical consequence while
      missing the density change cannot be used to argue about the sclerotic lesion.
      It remains informative about susceptibility and about bone quality, and it is
      the one curated source showing those two can come apart.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: >-
        The mouse accumulates skeletal fluoride at these doses without the density
        increase that defines the human radiographic lesion, so the defining feature
        of the human disease is absent from the model.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The exposure runs for a fraction of a mouse lifespan; human osteosclerosis is
        the product of years to decades of accumulation, and the study cannot say
        whether density would move later.
    readouts:
    - name: Bone mineral density by DEXA
      target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
      direction: UNCHANGED
      interpretation: >-
        A real negative, not a missing measurement: DEXA was performed in all three
        strains at all four doses and barely moved.
      evidence:
      - reference: PMID:16920415
        reference_title: "The genetic influence on bone susceptibility to fluoride."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Fluoride treatment had little effect on the bone mineral densities (BMD) in the 3 strains."
        explanation: The density measurement that did not change.
    - name: Bone quality by mechanical testing
      target: Mixed Osteosclerosis, Osteomalacia and Osteoporosis
      direction: DECREASED
      interpretation: >-
        Bone quality degraded in the susceptible strain and not at all in the
        resistant one, which is the susceptibility gradient this model exists to show.
      evidence:
      - reference: PMID:16920415
        reference_title: "The genetic influence on bone susceptibility to fluoride."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mechanical testing showed significant alterations in \"bone quality\" in the A/J strain, whereas moderate alterations in \"bone quality\" in the SWR/J strain and no effects in the 129P3/J strain were observed."
        explanation: The strain-dependent mechanical result.
    evidence:
    - reference: PMID:16920415
      reference_title: "The genetic influence on bone susceptibility to fluoride."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Fluoride treatment had little effect on the bone mineral densities (BMD) in the 3 strains."
      explanation: >-
        Graded REFUTE against reading this model as reproducing the human sclerotic
        lesion. It is the substantive negative claim the `FAILS_TO_RECAPITULATE`
        relationship makes.
    - reference: PMID:16920415
      reference_title: "The genetic influence on bone susceptibility to fluoride."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results suggest that genetic factors may contribute to the variation in bone response to fluoride exposure and that fluoride might affect bone properties without altering BMD."
      explanation: >-
        The authors' own reading, and the sentence that makes this model relevant to
        the genetic records: bone response varies with background, and fluoride can
        alter bone properties without altering BMD.
  notes: >-
    The pairing with `genetic:` is the point of curating this model. Three of the five
    genetic records here report human susceptibility variants and two report nulls;
    this is the animal counterpart, and it locates the susceptibility in bone quality
    rather than in bone density. The strains were originally selected for *enamel*
    fluorosis susceptibility, so the bone result is a transfer of that gradient rather
    than a bone-derived one, which is worth knowing before leaning on it.

- name: Skeletal fluorosis model rat for the gut-bone axis
  species: Rat
  genotype: Wild type
  description: >-
    The model behind this entry's gut arm. Serum 3-IAA was measured in model rats and
    in human patients together, and the rescue arms - direct supplementation and an
    intermittent high-tryptophan diet - were run in vivo.
  publication: PMID:41380608
  modeled_mechanisms:
  - target: Gut Microbial Tryptophan Metabolism Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The metabolite deficit was found in the model and in human patients in the same
      study, which is the strongest fidelity claim available for any model here.
    limitations: >-
      The mechanism downstream of the metabolite - AHR, then Wnt - is established in
      the rodent arm only, and the human arm of the study is the serum measurement.
    evidence:
    - reference: PMID:41380608
      reference_title: "Gut microbiota-derived indole-3-Acetic Acid attenuates skeletal fluorosis via AHR-mediated suppression of Wnt/β-Catenin signaling."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "we found that fluoride disrupted gut microbial tryptophan metabolism, resulting in decreased serum levels of indole-3-acetic acid (3-IAA) in both SF model rats and human SF patients."
      explanation: >-
        Graded OTHER because the sentence reports the model rats and the human
        patients together and no single `evidence_source` value describes both.
  - target: Aryl Hydrocarbon Receptor Underactivation with Wnt Hyperactivation
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Restoring 3-IAA reactivated AHR, suppressed Wnt signalling and reduced bone
      damage in vivo - the result the tryptophan treatment record rests on.
    limitations: >-

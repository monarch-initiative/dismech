    preferred_term: Hypoglycorrhachia
    term:
      id: HP:0011972
      label: Hypoglycorrhachia
  evidence:
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of Glut1DS is established in a proband with suggestive clinical findings,
      hypoglycorrhachia documented by lumbar puncture, and a (usually) heterozygous pathogenic
      variant in SLC2A1 identified by molecular genetic testing.
    explanation: >-
      Records hypoglycorrhachia as the diagnostic laboratory finding in SLC2A1 disease generally.
      INDIRECT because it is a statement about GLUT1 deficiency syndrome, and the step to sdCHC is an
      inference from sdCHC being a form of it rather than a measurement in an sdCHC patient.
- category: Hematologic
  name: Neonatal hyperbilirubinemia
  description: Reported at presentation in the fourth pedigree, consistent with neonatal hemolysis.
  phenotype_term:
    preferred_term: Neonatal hyperbilirubinemia
    term:
      id: HP:0003265
      label: Neonatal hyperbilirubinemia
  evidence:
  - reference: PMID:22492876
    reference_title: "An infant with pseudohyperkalemia, hemolysis, and seizures: cation-leaky GLUT1-deficiency syndrome due to a SLC2A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infant presented with erratic hyperkalemia, neonatal hyperbilirubinemia, anemia, hepatic
      dysfunction, and microcephaly.
    explanation: Records neonatal hyperbilirubinemia at presentation.
diagnosis:
- name: Red cell cation flux and temperature-dependence study
  description: >-
    Measurement of red cell sodium and potassium content and of the potassium leak across a
    temperature range. The cryohydrocytosis pattern is a leak that is minimal around 20 to 25 degrees
    C and rises steeply at 0 degrees C, which is what separates it from the other stomatocytoses.
  evidence:
  - reference: PMID:15180870
    reference_title: "Four new cases of stomatin-deficient hereditary stomatocytosis syndrome: association of the stomatin-deficient cryohydrocytosis variant with neurological dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three showed a simple monotonic temperature dependence, while two showed a minimum at around
      20-25 degrees C, such that the cells were extremely leaky at 0 degrees C, giving the phenotype
      known as 'cryohydrocytosis'.
    explanation: Defines the temperature-dependence pattern that the assay is looking for.
- name: SLC2A1 sequencing
  description: Molecular confirmation by sequencing SLC2A1.
  evidence:
  - reference: PMID:22492876
    reference_title: "An infant with pseudohyperkalemia, hemolysis, and seizures: cation-leaky GLUT1-deficiency syndrome due to a SLC2A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A trinucleotide deletion in SLC2A1, coding for the deletion of isoleucine 435 or 436 in GLUT1,
      was identified in the proband.
    explanation: Molecular confirmation in the fourth pedigree was by identifying the SLC2A1 variant.
treatments:
- name: Ketogenic Diet Therapy
  description: >-
    Ketone bodies reach the brain independently of GLUT1 and substitute for the glucose that cannot
    cross the barrier. This is the established treatment of the GLUT1 deficiency the brain arm of
    sdCHC shares; no trial has been reported in sdCHC itself, and it does not address the cation
    leak or the hemolysis. Valproic acid must be avoided while a patient is on a ketogenic diet: it
    raises the risk of a Reye-like illness and may itself inhibit glucose transport. That matters
    here because valproate is an obvious anticonvulsant to reach for in a child with seizures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: ketogenic diet therapy
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Cerebral Energy Failure
    description: Supplies the brain with a fuel that does not require GLUT1 to cross the barrier.
  evidence:
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Institution of ketogenic diet therapies (KDTs) helps with early neurologic growth and
      development and seizure control.
    explanation: >-
      States the benefit of ketogenic diet therapy in GLUT1 deficiency syndrome. sdCHC is a form of
      GLUT1 deficiency, so this supports the treatment by extension rather than from a study of
      sdCHC patients, hence INDIRECT.
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      avoidance of treatment of seizures with valproic acid, because it increases the risk of a
      Reye-like illness and may also inhibit glucose transport
    explanation: >-
      The GeneReviews Agents and Circumstances to Avoid section gives this contraindication for
      people with Glut1DS on a ketogenic diet. INDIRECT for the same reason as the treatment itself,
      that it is stated for Glut1DS rather than specifically for sdCHC.
differential_diagnoses:
- name: Dehydrated hereditary stomatocytosis
  description: >-
    Caused by PIEZO1 or KCNN4 variants, with a different leak behaviour and without the cataracts and
    neurological features of sdCHC.
  distinguishing_features:
  - Variants in PIEZO1 or KCNN4 rather than SLC2A1.
  - No cataracts, seizures or learning difficulty.
- name: Overhydrated hereditary stomatocytosis
  description: >-
    Caused by RHAG variants. Membrane stomatin is also reduced here, so stomatin deficiency alone does
    not distinguish the two.
  distinguishing_features:
  - Variants in RHAG rather than SLC2A1.
  - A leak that rises linearly with temperature rather than worsening in the cold.
  evidence:
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mutations in RHAG cause the very leaky condition over-hydrated stomatocytosis, and mutations in
      ABCB6 result in familial pseudohyperkalemia.
    explanation: Separates the overhydrated form and familial pseudohyperkalemia by their genes.
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The leak in OHSt increases with temperature in a linear pattern
    explanation: Sources the temperature behaviour that distinguishes the overhydrated form.
- name: Cryohydrocytosis due to SLC4A1 variants
  description: >-
    Shares the cold-enhanced leak and the cryohydrocytosis label but arises in band 3 and lacks the
    stomatin deficiency and the neurological syndrome.
  distinguishing_features:
  - Variants in SLC4A1 rather than SLC2A1.
  evidence:
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The cryohydrocytosis phenotype, including South-east Asian Ovalocytosis, results from mutations
      in SLC4A1, and the very rare condition, stomatin-deficient cryohydrocytosis, is caused by
      mutations in SLC2A1.
    explanation: Distinguishes the two cryohydrocytosis forms by gene.
- name: Classical GLUT1 deficiency syndrome
  description: >-
    Shares the SLC2A1 gene and the brain glucose deficit but has no red cell cation leak, so no
    stomatocytosis, hemolysis or pseudohyperkalemia.
  distinguishing_features:
  - No red cell cation leak and no hemolytic anemia.
- name: Paroxysmal exertion-induced dyskinesia due to SLC2A1 variants
  description: >-
    Another SLC2A1 disorder in which one pedigree did show a red cell cation leak, but with
    echinocytosis rather than stomatocytosis.
  distinguishing_features:
  - Exercise-induced involuntary movements as the presenting feature.
  - Echinocytes rather than stomatocytes on the blood film.
  evidence:
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unlike in sdCHC, these RBCs exhibited spiky protrusions (echinocytosis), which are often
      associated with cellular dehydration.
    explanation: States the morphological difference from sdCHC in the one PED pedigree with a leak.
references:
- reference: PMID:20301603
  title: Glucose Transporter Type 1 Deficiency Syndrome.
  tags:
  - GeneReviews
notes: >-
  Only four pedigrees have been reported, so every frequency statement in this entry would rest on
  single patients and none is recorded. The 2018 review counts three patients to that date and the
  2012 report describes the fourth pedigree.

  There is no GeneReviews chapter for sdCHC. The chapter tagged here, Glucose Transporter Type 1
  Deficiency Syndrome, is gene-scoped for SLC2A1 and covers the brain arm of this disease, so it is
  the phenotype baseline for the neurological and cerebrospinal findings only. It says nothing about
  the cation leak, the stomatocytosis or the hemolysis, which are taken from the primary reports.

  The deep-research report for this entry states that a ketogenic diet improved seizure control in
  the fourth pedigree, attributing it to the full text of PMID:22492876. That paper is cached as
  abstract only, a forced re-fetch does not retrieve a full text, and the word ketogenic does not
  appear anywhere in the cached record. The claim is therefore not used, and the ketogenic diet
  treatment keeps its INDIRECT grading from GLUT1 deficiency syndrome. If the full text does say it,
  this is the one claim in the entry that would move from extrapolated to reported, and it is worth
  the check by anyone holding that article.

  No sdCHC report consulted measures cerebrospinal fluid glucose. Hypoglycorrhachia is recorded as
  a phenotype because it is the expected consequence of the blood-brain-barrier transport defect and
  the test a clinician would order, but its evidence is marked INDIRECT and cites GeneReviews on
  GLUT1 deficiency syndrome rather than any sdCHC patient. Measuring it in a patient with this
  diagnosis would be worth publishing.

  Splenectomy is deliberately not recorded as a treatment or a contraindication. Both reviews read
  here warn against it, but each scopes that warning to dehydrated or overhydrated hereditary
  stomatocytosis rather than to sdCHC, and no source consulted states the position for sdCHC. The
  warning is recorded here rather than attached to a treatment so that it is not read as evidence
  about this disease.

  ClinGen rates SLC2A1 Definitive, but for GLUT1 deficiency syndrome (MONDO:0000188), the broader
  concept, not for MONDO:0012143. No gene_disease_validity assertion is recorded for that reason.

  The GeneReviews chapter's Agents and Circumstances to Avoid section is reflected on the ketogenic
  diet treatment: valproic acid is contraindicated on that diet. Like the diet itself, it is stated
  for Glut1DS rather than for sdCHC, so both are marked INDIRECT.

  The entry name follows MONDO. The literature almost always writes stomatin-deficient
  cryohydrocytosis or sdCHC, which is carried in synonyms.

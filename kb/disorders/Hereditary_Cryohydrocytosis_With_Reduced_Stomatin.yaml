name: Hereditary Cryohydrocytosis With Reduced Stomatin
creation_date: "2026-11-18T11:48:17Z"
category: Mendelian
description: >-
  Stomatin-deficient cryohydrocytosis (sdCHC) is a very rare hereditary stomatocytosis in which
  heterozygous SLC2A1 variants give the glucose transporter GLUT1 two separate defects at once: it
  stops carrying glucose, and it opens a non-selective monovalent cation pathway across the membrane
  it sits in. The two defects act in different tissues. At the blood-brain barrier the transport
  loss starves the brain of glucose, as in ordinary GLUT1 deficiency syndrome, giving seizures,
  developmental delay and a movement disorder. In the red cell, where GLUT1 is the dominant membrane
  transporter, the leak disturbs sodium and potassium handling, producing stomatocytic cells, chronic
  hemolysis and a potassium efflux on standing that is read in the laboratory as hyperkalemia. The
  leak is temperature dependent and worsens in the cold, which is what the name cryohydrocytosis
  records. Membrane stomatin is reduced as a secondary consequence rather than as the primary lesion.
  Cataracts and hepatosplenomegaly complete the picture. Only four pedigrees have been described.

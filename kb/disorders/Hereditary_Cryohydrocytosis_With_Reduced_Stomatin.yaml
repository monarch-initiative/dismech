inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Reported pedigrees carry a heterozygous SLC2A1 variant, and the hereditary stomatocytoses as a
    class are dominantly inherited. No source curated here states the mode of inheritance for sdCHC
    specifically, so this is read from the class and from the heterozygous state of the reported
    variants rather than from a segregation analysis of these four pedigrees.
  evidence:
  - reference: PMID:21791420
    reference_title: "Stomatin-deficient cryohydrocytosis results from mutations in SLC2A1: a novel form of GLUT1 deficiency syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hereditary stomatocytoses are a series of dominantly inherited hemolytic anemias in which
      the permeability of the erythrocyte membrane to monovalent cations is pathologically increased.
    explanation: >-
      States dominant inheritance for the hereditary stomatocytosis class that sdCHC belongs to. It
      does not assert the mode for sdCHC itself, hence INDIRECT.
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of Glut1DS is established in a proband with suggestive clinical findings,
      hypoglycorrhachia documented by lumbar puncture, and a (usually) heterozygous pathogenic
      variant in SLC2A1 identified by molecular genetic testing.
    explanation: >-
      GeneReviews records that SLC2A1 disease is usually caused by a heterozygous variant, which is
      the state of the variants reported in sdCHC.
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Glut1DS is most commonly caused by a heterozygous SLC2A1 pathogenic variant and inherited in an
      autosomal dominant manner.
    explanation: >-
      The GeneReviews Genetic Counseling section states autosomal dominant inheritance for SLC2A1
      disease directly. INDIRECT because it is stated for Glut1DS rather than for sdCHC.
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual with autosomal dominant Glut1DS has a 50% chance of inheriting the
      SLC2A1 pathogenic variant and being clinically affected.
    explanation: >-
      Gives the transmission risk that follows from dominant inheritance, again stated for Glut1DS.
genetic:
- name: SLC2A1
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  notes: >-
    SLC2A1 encodes GLUT1, the major glucose transporter of the erythrocyte membrane and of the
    blood-brain barrier. The sdCHC variants are not ordinary loss-of-function alleles: expressed in
    Xenopus oocytes they both abolish glucose transport and create a cation leak.
    ClinGen classifies SLC2A1 as Definitive for GLUT1 deficiency syndrome (MONDO:0000188), which is
    the broader concept, not this entry's disease_term. No ClinGen record exists for MONDO:0012143,
    so no gene_disease_validity assertion is recorded here.
  variants:
  - name: p.Gly286Asp
    description: Missense substitution found in the Montpellier pedigree.
  - name: p.Ile435del or p.Ile436del
    description: >-
      Single-amino-acid in-frame deletion found in the San Francisco pedigree and again in the
      fourth pedigree reported in 2012.
  evidence:
  - reference: PMID:21791420
    reference_title: "Stomatin-deficient cryohydrocytosis results from mutations in SLC2A1: a novel form of GLUT1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now show that sdCHC is associated with mutations in SLC2A1 that cause both loss of glucose
      transport and a cation leak, as shown by expression studies in Xenopus oocytes.
    explanation: Identifies SLC2A1 as the causative gene and states the dual functional consequence.
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the Montpellier pedigree a single amino acid substitution mutation was found (Gly286Asp),
      whilst the San Francisco pedigree exhibited a single amino acid deletion (Ile435 or Ile436).
    explanation: Names the two variants reported in the founding pedigrees.
  - reference: PMID:22492876
    reference_title: "An infant with pseudohyperkalemia, hemolysis, and seizures: cation-leaky GLUT1-deficiency syndrome due to a SLC2A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A trinucleotide deletion in SLC2A1, coding for the deletion of isoleucine 435 or 436 in GLUT1,
      was identified in the proband.
    explanation: Independent recurrence of the in-frame deletion allele in a fourth pedigree.
pathophysiology:
- name: Mutant GLUT1 With Abolished Transport and a Gained Cation Pathway
  biological_scale: MOLECULAR
  description: >-
    A heterozygous SLC2A1 variant, either p.Gly286Asp or an in-frame deletion of Ile435/436, yields a
    GLUT1 protein that no longer carries glucose and that instead admits monovalent cations. Both
    consequences were shown for both alleles in Xenopus oocytes. The node is tagged NEOMORPHIC for
    the pathway the protein gains, because that is what separates this disease from ordinary GLUT1
    deficiency syndrome; the transport loss it also carries is modelled as the separate downstream
    node below rather than being compressed into this one tag.
  genes:
  - preferred_term: SLC2A1
    term:
      id: hgnc:11005
      label: SLC2A1
  molecular_functions:
  - preferred_term: glucose transmembrane transporter activity
    term:
      id: GO:0055056
      label: D-glucose transmembrane transporter activity
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: Germline heterozygous SLC2A1 missense or single-codon in-frame deletion variant.
    variant_origin: GERMLINE
    functional_impact_category: NEOMORPHIC
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the GLUT1 mutants lost their ability to transport their usual substrate, and instead induced a
      cation leak when expressed heterologously in X. levis oocytes.
    explanation: States both halves of the lesion in one heterologous expression experiment.
  downstream:
  - target: Loss of GLUT1-Mediated Glucose Transport
    description: The mutant protein no longer carries its usual substrate.
    causal_link_type: DIRECT
  - target: Monovalent Cation Leak Across the GLUT1-Bearing Membrane
    description: The same mutant protein admits sodium and potassium.
    causal_link_type: DIRECT
- name: Loss of GLUT1-Mediated Glucose Transport
  biological_scale: MOLECULAR
  description: >-
    GLUT1 is the glucose transporter of the blood-brain barrier, so the transport defect reproduces
    the deficit of classical GLUT1 deficiency syndrome.
  molecular_functions:
  - preferred_term: glucose transmembrane transporter activity
    term:
      id: GO:0055056
      label: D-glucose transmembrane transporter activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:22492876
    reference_title: "An infant with pseudohyperkalemia, hemolysis, and seizures: cation-leaky GLUT1-deficiency syndrome due to a SLC2A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Very rare mutations not only disable carbohydrate transport but also cause the red cell
      membrane to be constitutively permeant to monovalent cations, namely sodium and potassium.
    explanation: States that these variants disable carbohydrate transport.
  downstream:
  - target: Reduced Glucose Delivery Across the Blood-Brain Barrier
    causal_link_type: DIRECT
- name: Reduced Glucose Delivery Across the Blood-Brain Barrier
  biological_scale: TISSUE
  description: >-
    Glucose is the brain's obligate fuel and crosses the barrier through GLUT1, so a transport defect
    leaves cerebrospinal glucose low and the brain underfuelled.
  biological_processes:
  - preferred_term: D-glucose transmembrane transport
    term:
      id: GO:1904659
      label: D-glucose transmembrane transport
    modifier: DECREASED
  evidence:

    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Glut1DS results from the inability of Glut1 to transfer sufficient glucose across the BBB to
      meet the glucose demands of the brain.
    explanation: States the blood-brain barrier step that the transport loss interrupts.
  downstream:
  - target: Cerebral Energy Failure
    causal_link_type: DIRECT
  - target: Hypoglycorrhachia
    causal_link_type: DIRECT
- name: Cerebral Energy Failure
  biological_scale: ORGANISM
  description: >-
    Chronic shortfall of the brain's principal fuel, which in GLUT1 deficiency produces
    pharmacoresistant seizures, developmental delay and a movement disorder.
  evidence:
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Glucose transporter type 1 deficiency syndrome (Glut1DS) is a disorder of brain energy
      metabolism.
    explanation: States that SLC2A1 disease is a disorder of brain energy metabolism, which is this node.
  - reference: PMID:20301603
    reference_title: Glucose Transporter Type 1 Deficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When first diagnosed in infancy to early childhood, the predominant clinical findings of
      Glut1DS are paroxysmal eye-head movements, pharmacoresistant seizures of varying types,
      deceleration of head growth, and developmental delay.
    explanation: Links the brain energy deficit to the neurological presentation.
  downstream:

- name: Monovalent Cation Leak Across the GLUT1-Bearing Membrane
  biological_scale: MOLECULAR
  description: >-
    The mutant transporter opens a pathway for sodium and potassium. The leak is unusual in being
    worse in the cold, and the mechanism is thought to lie in the protein's interactions with
    surrounding lipid and partner proteins rather than in the glucose channel itself: the review
    notes a lack of structural evidence for pore formation and suggests the leak may not be
    conducted directly through the transporter's own channel.
  biological_processes:
  - preferred_term: monoatomic cation transmembrane transport
    term:
      id: GO:0098655
      label: monoatomic cation transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At lower temperatures membranes become more rigid, which could exacerbate the poor fit of
      lipids around mutant proteins and their multi-protein complexes and provide an explanation for
      how and why the leaks worsen at low temperatures.
    explanation: >-
      Gives the proposed basis for the cold dependence that names the disease. It is the review's own
      speculation, not an experimental result, hence REVIEW_SYNTHESIS.
  - reference: PMID:15180870
    reference_title: "Four new cases of stomatin-deficient hereditary stomatocytosis syndrome: association of the stomatin-deficient cryohydrocytosis variant with neurological dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All showed pronounced cation leaks at 37 degrees C with markedly abnormal intracellular Na(+)
      and K(+) concentrations, like all other such stomatin-deficient cases.
    explanation: Measures the leak itself in patient red cells, which is the node's own claim.
  downstream:
  - target: Erythrocyte Cation and Water Imbalance
    causal_link_type: DIRECT
- name: Erythrocyte Cation and Water Imbalance
  biological_scale: CELLULAR
  description: >-
    GLUT1 is the dominant glucose transporter of the red cell membrane, so the leak falls hardest on
    the erythrocyte, whose sodium and potassium gradients and therefore water content are disturbed.
    Measured leak is roughly ten times normal at 37 degrees C.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:22492876
    reference_title: "An infant with pseudohyperkalemia, hemolysis, and seizures: cation-leaky GLUT1-deficiency syndrome due to a SLC2A1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measurements of red cell cation content showed extremely leaky red cells (causing the
      hemolysis) and temperature-dependent loss of potassium from red cells (explaining the
      hyperkalemia as pseudohyperkalemia).
    explanation: >-
      Ties the measured leak to both downstream consequences, the hemolysis and the spurious
      potassium reading.
  - reference: PMID:29713289
    reference_title: The Molecular Basis for Altered Cation Permeability in Hereditary Stomatocytic Human Red Blood Cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alongside a RBC cation leak that is 10 times greater than normal at 37°C
    explanation: Sources the size of the leak quoted in this node's description.
  downstream:
  - target: Stomatocytosis
    causal_link_type: DIRECT
  - target: Hemolytic anemia
    causal_link_type: DIRECT
  - target: Pseudohyperkalemia
    causal_link_type: DIRECT
  - target: Loss of Membrane Stomatin During Reticulocyte Maturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Loss of Membrane Stomatin During Reticulocyte Maturation
  biological_scale: CELLULAR
  description: >-
    Membrane stomatin is reduced in these red cells, and the loss happens as the reticulocyte
    matures, by endocytosis. This is a secondary consequence and a diagnostic marker, not the primary
    lesion; the disease was named for it before SLC2A1 was implicated.
  cell_types:
  - preferred_term: reticulocyte
    term:
      id: CL:0000558
      label: reticulocyte
  evidence:
  - reference: PMID:21791420
    reference_title: "Stomatin-deficient cryohydrocytosis results from mutations in SLC2A1: a novel form of GLUT1 deficiency syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We investigated the loss of stomatin during erythropoiesis and find this occurs during
      reticulocyte maturation and involves endocytosis.
    explanation: Locates the stomatin loss in reticulocyte maturation and gives its mechanism.
  - reference: PMID:15180870
    reference_title: "Four new cases of stomatin-deficient hereditary stomatocytosis syndrome: association of the stomatin-deficient cryohydrocytosis variant with neurological dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all cases, Western blotting of red cell membranes revealed a deficiency in the 32 kDa
      membrane protein, stomatin.
    explanation: Documents the membrane stomatin deficiency that gives the disease its name.

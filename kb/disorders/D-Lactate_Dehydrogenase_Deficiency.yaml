      explanation: Autosomal recessive transmission.
  variants:
  - name: p.Arg370Trp
    description: >-
      NM_153486.3:c.1108C>T, homozygous in a consanguineous Bedouin-Israeli
      kindred with hyperuricemia and gout and the highest D-lactate
      concentrations reported. Arg370 lies in the C-terminal substrate-binding
      domain and is a direct substrate-binding residue: in the mouse
      structure 8JDE its guanidinium group is 2.9 angstroms from each
      carboxylate oxygen of D-lactate and 4.2 angstroms from the manganese
      ion, it is fully buried, and it is held by a salt bridge to Glu300.
      Tryptophan cannot make these contacts and removes the positive charge
      that anchors the substrate carboxylate. Conserved from yeast to human.
      The mouse equivalent R347W keeps FAD at reduced occupancy and loses
      about 90 percent of activity.
    synonyms:
    - R370W
    - NM_194436.3:c.1039C>T (p.Arg347Trp)
    identifiers:
    - ClinVar:VCV000872931
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: D-lactate dehydrogenase activity
      description: >-
        Loss of the substrate carboxylate-binding arginine; about 90 percent
        loss of activity in the mouse equivalent.
      type: loss-of-function
    evidence:
    - reference: PMID:31638601
      reference_title: Hyperuricemia and gout caused by missense mutation in d-lactate dehydrogenase.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We demonstrate that gout can be caused by a mutation in LDHD within the
        putative catalytic site of the encoded d-lactate dehydrogenase,
        resulting in augmented blood levels of d-lactate
      explanation: Reports the variant and places it in the catalytic site.

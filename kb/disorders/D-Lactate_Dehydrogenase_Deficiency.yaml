      (P = 0.04) and urine (P = 0.06)
    explanation: >-
      Measured renal underexcretion of urate in homozygotes of a second
      family.
  - reference: PMID:12024214
    reference_title: Molecular identification of a renal urate anion exchanger that regulates blood urate levels.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Here we identify the long-hypothesized urate transporter in the human
      kidney (URAT1, encoded by SLC22A12), a urate anion exchanger regulating
      blood urate levels
    explanation: >-
      Establishes that human renal urate reabsorption runs through an anion
      exchanger; the paper does not study D-lactate or LDHD deficiency, so its
      bearing on this node is by inference.
  downstream:

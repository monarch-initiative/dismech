genetic:
- name: LDHD
  gene_term:
    preferred_term: LDHD
    term:
      id: hgnc:19708
      label: LDHD
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Eight pathogenic alleles have been reported in eight families: five
    missense substitutions, a splice-donor duplication, a last-exon frameshift
    and a multi-exon deletion. All are loss of function. Variant type does not
    predict whether a family presents with gout or with neurodevelopmental
    features.
  notes: >-
    Population data, queried from gnomAD v4 through its API on 2026-11-26:
    LDHD is not constrained against loss of function (pLI 0,
    observed/expected loss-of-function ratio 1.10 with upper bound 1.36; 58
    observed against 52.9 expected). On the MANE Select transcript
    ENST00000450168 (isoform 2), 168 high-confidence predicted
    loss-of-function variants have a combined allele frequency of about 4.9
    in 10,000, with one homozygous individual (c.835del, p.Leu279TrpfsTer5).
    The most frequent reported pathogenic allele, p.Thr463Met (listed in
    gnomAD as p.Thr440Met), adds 1.9 in 10,000 (306 alleles, no homozygotes).
    These figures imply that biallelic LDHD loss of function is more common
    than the twenty or so reported patients suggest, which fits a biochemical
    trait with gout as a late and incompletely penetrant consequence. A
    further 15 predicted loss-of-function variants are annotated only on
    ENST00000300051 (isoform 1) and must not be added to that total: the
    commonest, c.669G>A p.Trp223Ter (563 alleles, one homozygote), lies in
    the 69 nucleotides that only isoform 1 includes (residues 211-233) and is
    intronic in the MANE transcript, so it leaves isoform 2 intact. Isoform 2
    is sufficient for D-lactate clearance: it is the form whose cDNA
    (NM_194436.1) rescued the zebrafish mutant in PMID:30931947.
    ClinVar (queried 2026-11-26) holds 125 single-gene LDHD
    records, all on NM_194436, of which eight are classified pathogenic or
    likely pathogenic.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:37021930
      reference_title: Early-onset gout and rare deficient variants of the lactate dehydrogenase D gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rare, damaging LDHD variants can cause autosomal recessive early-onset
        gout, the diagnosis of which can be suspected by measuring high

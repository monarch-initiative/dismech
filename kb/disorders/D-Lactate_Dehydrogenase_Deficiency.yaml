- name: Putative Neurodevelopmental Toxicity of Accumulated D-2-Hydroxyacids
  description: >-
    A hypothetical node. About half of the reported patients have delayed
    motor and mental development, with hypotonia and in one case transient
    ataxia, and it has been proposed that accumulated D-lactate or
    branched-chain D-2-hydroxyacids disturb brain development. No mechanism
    has been shown. Three of the affected patients had another plausible
    cause, ldhd-null zebrafish larvae look normal, and the family with the
    highest D-lactate concentrations has no neurological disease. The node is
    kept so that the neurological phenotypes are attached to a stated,
    testable claim rather than left unexplained.

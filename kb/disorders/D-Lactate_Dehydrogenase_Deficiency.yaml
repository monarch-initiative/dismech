- Inborn Error of Metabolism
notes: >-
  Entry name. The MONDO label "lactic aciduria due to D-lactic acid" and the
  OMIM title "D-lactic aciduria" describe a urinary finding that also occurs
  without any LDHD defect, in D-lactic acidosis of short bowel syndrome. The
  entry is therefore named for the enzyme defect, as the case reports that
  define the disease do (PMID:30931947, PMID:34258137, PMID:40678184). No
  "LDHD-related" disease name is in use. No GeneReviews chapter, Orphanet
  record or ClinGen gene-disease validity curation exists for this disease:
  cache/bookshelf/genereviews.csv has no chapter naming D-lactate or LDHD,
  `grep -l -i "D-lactic" references_cache/ORPHA_*.md` returns nothing, and
  cache/clingen/gene_validity.csv has no LDHD row. Phenotypes are taken from
  the primary case reports and the literature table in PMID:40678184.
  Residue numbering. Three numberings of the same protein are in circulation.
  The case reports and this entry use UniProt Q86WU2-1 / NM_153486 (507
  residues). ClinVar and gnomAD use the MANE Select transcript NM_194436
  (484 residues, UniProt isoform 2, which lacks residues 211-233), so
  p.Arg370Trp is listed there as p.Arg347Trp, p.Trp374Cys as p.Trp351Cys,
  p.Thr463Met as p.Thr440Met and p.Thr251Met as p.Thr228Met; mouse LDHD
  (UniProt Q7TNG8, the protein in the crystal structures) has the same
  numbering as isoform 2 beyond residue 210. PMID:38373542 numbers the same
  two substitutions W323C and T412M, 51 lower than the precursor numbering.
  These correspondences were computed by translating the NM_153486.4 and
  NM_194436.3 coding sequences and aligning Q86WU2 to Q7TNG8, not taken from
  the papers.
mechanistic_hypotheses:
- hypothesis_group_id: ldhd_urate_exchange_gout_model
  hypothesis_label: Renal D-lactate excretion drives urate reabsorption
  status: CANONICAL
  description: >-
    D-lactate filtered and secreted by the kidney is exchanged for urate in
    the proximal tubule, so sustained D-lactate excretion raises urate
    reabsorption and serum urate and, over years, causes gout. Supported by
    the reduced fractional clearance of urate in homozygotes and by
    hyperuricemia after D-lactate injection in mice. The transporter that
    carries out the exchange has not been identified in patients or in the
    mouse experiment.
  evidence:
  - reference: PMID:31638601
    reference_title: Hyperuricemia and gout caused by missense mutation in d-lactate dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequent excessive renal secretion of d-lactate in exchange for uric
      acid reabsorption culminated in hyperuricemia and gout.
    explanation: States the exchange model for the gout presentation.
  - reference: PMID:37021930
    reference_title: Early-onset gout and rare deficient variants of the lactate dehydrogenase D gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      homozygotes had higher hyperuricaemia (P = 0.02), lower fractional
      clearance of urate (P = 0.002), and higher levels of d-lactate in blood
      (P = 0.04) and urine (P = 0.06)
    explanation: >-
      An independent family shows the renal urate underexcretion that the
      exchange model predicts.
- hypothesis_group_id: ldhd_hydroxyacid_neurotoxicity_model
  hypothesis_label: Accumulated D-2-hydroxyacids impair neurodevelopment
  status: EMERGING
  description: >-
    The developmental delay, hypotonia and ataxia seen in some patients are
    caused by LDHD deficiency itself, through D-lactate or, more specifically,
    through the branched-chain D-2-hydroxyacids that accumulate with it. The
    argument for the hydroxyacids over D-lactate is that the family with the
    highest plasma D-lactate has gout and no neurological signs, and that
    raised D-2-hydroxyacids have so far been reported only in patients with
    developmental delay. The hydroxyacids were not measured in the gout
    families, so the comparison is incomplete.
  evidence:
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      occurrence of urinary D‐2‐hydroxyacids other than D‐lactic acid has only
      been described in patients with psycho‐motor developmental delay and may
      be suggested to play a role in abnormal brain development
    explanation: >-
      The authors propose the D-2-hydroxyacids as the neurologically relevant
      metabolites; they state it as a suggestion.
  - reference: PMID:34258137
    reference_title: Human d-lactate dehydrogenase deficiency by LDHD mutation in a patient with neurological manifestations and mitochondrial complex IV deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The kindred in the second report with the highest level of d‐lactate
      seems to have the mildest presentation
    explanation: >-
      Counts against D-lactate concentration alone as the cause of
      neurological disease.
- hypothesis_group_id: ldhd_coincidental_neurology_model
  hypothesis_label: Neurological features are explained by co-occurring diagnoses
  status: ALTERNATIVE
  description: >-
    LDHD deficiency is a biochemical trait with gout as its only clinical
    consequence, and the neurological features of the index patients come
    from other causes found in the same individuals: an 11p13 deletion, a de
    novo CACNA1B variant with West syndrome, and reduced complex IV activity.
    Consistent with the lack of any visible phenotype in ldhd-null zebrafish
    and with LDHD being tolerant of loss-of-function variation in the general
    population.
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      given the phenotypic differences between our two patients, and the other
      genetic findings potentially explaining the rest of their phenotype, the
      loss-of-function LDHD phenotype in humans could represent a metabolic
      phenotype only
    explanation: The discovering authors raise the biochemical-only reading.
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The true fraction of patients with neuro‐developmental signs is uncertain
      because of the co‐occurrence of other diseases with probable neurological
      impact in three patients from this group
    explanation: >-
      Three of the patients with neurological features carried a second
      plausible cause.
pathophysiology:
- name: Methylglyoxal-Derived and Gut Bacterial D-Lactate Load
  description: >-
    D-lactate is not a product of mammalian glycolysis. It is formed
    continuously in small amounts when the cytosolic glyoxalase system
    detoxifies methylglyoxal, a by-product of triose phosphate metabolism, and
    it also enters the body from fermented foods and from carbohydrate
    fermentation by intestinal bacteria. This load is normal; in LDHD
    deficiency it is the substrate that can no longer be cleared.
  role: substrate source
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: methylglyoxal detoxification to D-lactate by the glyoxalase system
    term:
      id: GO:0051596
      label: methylglyoxal catabolic process
  chemical_entities:
  - preferred_term: D-lactate
    term:
      id: CHEBI:16004
      label: (R)-lactate
  - preferred_term: methylglyoxal
    term:
      id: CHEBI:17158
      label: methylglyoxal
  evidence:
  - reference: PMID:31173890
    reference_title: "Synthesis and metabolism of methylglyoxal, S-D-lactoylglutathione and D-lactate in cancer and Alzheimer's disease. Exploring the crossroad of eternal youth and premature aging."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Methylglyoxal is mainly detoxified via cytosolic glyoxalase route
      comprising glyoxalase 1 and glyoxalase 2 with the production of
      S-D-lactoylglutathione and D-lactate as intermediate and end-product,
      respectively.
    explanation: Endogenous D-lactate is the end product of the glyoxalase pathway.
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      D-lactate is acquired exogenously by consumption of foods, by metabolism
      of chemicals such as propylene glycol, by intestinal bacteria production,
      or endogenously by methylglyoxal metabolism
    explanation: Lists the exogenous and endogenous sources of D-lactate in humans.
  downstream:
  - target: Systemic D-Lactate Accumulation
    causal_link_type: DIRECT
    description: >-
      The continuous D-lactate load accumulates when it cannot be oxidised.
- name: Loss of Mitochondrial D-Lactate Dehydrogenase Activity
  description: >-
    LDHD is a mitochondrial flavoenzyme of the vanillyl-alcohol-oxidase
    (FAD-binding type 4) family, peripherally associated with the inner
    membrane. With FAD, and in the mouse enzyme a manganese ion, in the active
    site it oxidises D-lactate to pyruvate and, with the same chemistry, other
    D-2-hydroxyacids that carry a small hydrophobic side chain; it does not
    act on L-lactate. Purified human LDHD passes the electrons directly to
    cytochrome c, so D-lactate oxidation enters the respiratory chain
    downstream of complexes I and III. Which face of the inner membrane the
    enzyme occupies is not settled: activity measurements in rat liver
    mitochondria placed it on the matrix side, whereas direct reduction of
    cytochrome c implies access to the intermembrane space. Its oligomeric
    state is also unsettled (monomer, dimer, tetramer and hexamer have each
    been reported). Biallelic pathogenic variants remove the dehydrogenase
    activity. Null alleles (a deletion of exons 1-7, a splice-donor
    duplication whose transcript is not detectable, and a frameshift in the
    last exon that replaces the C-terminal 53 residues, which include the
    manganese ligand Glu465, the catalytic His466 and the FAD-binding Asn502)
    abolish the protein or its active site. The five reported missense changes fall into two
    structural classes when placed on the mouse LDHD crystal structure with
    FAD, manganese and D-lactate bound: Arg370 and Trp374 line the substrate
    and flavin pocket (the Arg370 guanidinium is 2.9 angstroms from both
    carboxylate oxygens of D-lactate; Trp374 is 3.4 angstroms from FAD),
    whereas Thr463, Thr251 and Val69 are buried second-shell or core residues
    whose substitution destabilises the fold or the FAD site. In recombinant
    mouse enzyme all four tested substitutions lose about 90 percent of
    activity and are thermally destabilised, and the two threonine
    substitutions also lose FAD. The disease mechanism is therefore loss of
    function; nothing reported suggests a gain of function or a
    dominant-negative effect, and carrier parents are unaffected.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:

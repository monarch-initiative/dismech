      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Notably, the p.R370W mutation had no effect on protein localization.
      explanation: >-
        The mutant protein still reaches mitochondria, so the defect is
        catalytic and not one of targeting.
    - reference: PMID:37863926
      reference_title: Lactate dehydrogenase D is a general dehydrogenase for D-2-hydroxyacids and is associated with D-lactic acidosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The T251M, R370W, W374C, and T463M mutations of hLDHD correspond to
        T228M, R347W, W351C, and T440M of mLDHD, respectively.
      explanation: Residue correspondence used for the recombinant mouse mutants.
  - name: p.Trp374Cys
    description: >-
      NM_153486.3:c.1122G>T, homozygous in a child of consanguineous Moluccan
      parents who also carried a de novo CACNA1B variant and had West
      syndrome. Trp374 is fully buried in the substrate-binding domain with
      its indole ring 3.4 angstroms from the FAD isoalloxazine and 4.1
      angstroms from D-lactate in 8JDE, so it forms part of the wall of the
      flavin and substrate pocket. Cysteine leaves a cavity there. Conserved
      in vertebrates; yeast and Arabidopsis have leucine. The mouse
      equivalent W351C keeps FAD at reduced occupancy, is thermally
      destabilised and loses about 90 percent of activity; human enzyme with
      the substitution (W323C in the numbering of PMID:38373542) has reduced
      activity.
    synonyms:
    - W374C
    - NM_194436.3:c.1053G>T (p.Trp351Cys)
    identifiers:
    - ClinVar:VCV000586968
    - dbSNP:rs1567502487
    variant_type: single nucleotide variant
    clinical_significance: LIKELY_PATHOGENIC
    functional_effects:
    - function: D-lactate dehydrogenase activity
      description: >-
        No rescue of D-lactate in ldhd-null zebrafish; reduced activity of
        recombinant human and mouse enzyme.
      type: loss-of-function
    evidence:
    - reference: PMID:30931947
      reference_title: Identification of human D lactate dehydrogenase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing of Patient 2 identifies a separate novel, homozygous
        nonsynonymous variant NM_153486.3:c.1122G>T, p.(Trp374Cys)
      explanation: Reports the variant.
    - reference: PMID:30931947
      reference_title: Identification of human D lactate dehydrogenase deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast, microinjection of variant Thr463Met LDHD or Trp374Cys LDHD
        mRNA did not rescue the metabolic phenotype
      explanation: Functional failure of the variant in zebrafish.
    - reference: PMID:38373542
      reference_title: The catalytic action of human d-lactate dehydrogenase is severely inhibited by oxalate and is impaired by mutations triggering d-lactate acidosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Interestingly, the mutations W323C and T412 M negatively affect the
        activity of hDLDH, most likely by impairing the enzyme electron-acceptor
        site.
      explanation: Reduced activity of the recombinant human mutant.
  - name: p.Thr463Met
    description: >-
      NM_153486.3:c.1388C>T, homozygous in the original 1977 patient, whose
      parents came from one Sicilian village and who also had an 11p13
      deletion. The most frequent pathogenic allele in population data.
      Thr463 is not in contact with the ligands (about 9 angstroms from the
      manganese ion and D-lactate in 8JDE) but sits two residues before the
      manganese ligand Glu465 and catalytic His466: its side-chain hydroxyl
      hydrogen-bonds to Asp390 and to the backbone amides of His466 and
      Gly467, holding the loop that carries the catalytic residues.
      Methionine removes those hydrogen bonds and adds bulk in a nearly
      buried position. Conserved from yeast to human. The mouse equivalent
      T440M loses FAD, is thermally destabilised and loses about 90 percent
      of activity.
    synonyms:
    - T463M
    - NM_194436.3:c.1319C>T (p.Thr440Met)
    identifiers:
    - ClinVar:VCV000586969
    - dbSNP:rs764877688
    variant_type: single nucleotide variant
    clinical_significance: LIKELY_PATHOGENIC
    functional_effects:
    - function: D-lactate dehydrogenase activity
      description: >-
        No rescue of D-lactate in ldhd-null zebrafish; loss of FAD binding and
        about 90 percent loss of activity in the mouse equivalent.
      type: loss-of-function
    evidence:
    - reference: PMID:30931947
      reference_title: Identification of human D lactate dehydrogenase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing of Patient 1 identifies a LDHD homozygous
        nonsynonymous variant NM_153486.3:c.1388C>T, p.(Thr463Met)
      explanation: Reports the variant.
    - reference: PMID:37863926
      reference_title: Lactate dehydrogenase D is a general dehydrogenase for D-2-hydroxyacids and is associated with D-lactic acidosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        in contrast, the T228M and T440M mutants do not exhibit the FAD
        characteristic absorption peak, suggesting the absence of FAD binding
      explanation: The mouse equivalents of p.Thr251Met and p.Thr463Met lose FAD.
  - name: p.Thr251Met
    description: >-
      NM_153486.3:c.752C>T, homozygous in a man with early-onset gout and in
      trans with c.469+1dup in a girl with developmental delay, so the same
      allele occurs in both presentations. Thr251 is in the FAD-binding
      domain, 5.5 angstroms from FAD in 8JDE and nearly buried, next to
      residues that contact the cofactor (human Glu249, Gly250 and Gly253 to
      Ile255 by alignment); its hydroxyl hydrogen-bonds to the backbone of
      Ser248. Conserved from yeast to human. The mouse equivalent T228M loses
      FAD, is thermally destabilised and loses about 90 percent of activity.
    synonyms:
    - T251M
    - NM_194436.3:c.683C>T (p.Thr228Met)
    identifiers:
    - ClinVar:VCV003381192
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: FAD binding
      description: Loss of FAD binding in the mouse equivalent T228M.
      type: loss-of-function
    evidence:
    - reference: PMID:37021930
      reference_title: Early-onset gout and rare deficient variants of the lactate dehydrogenase D gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Finally, a Moroccan man, with early-onset and high d-lactaturia, whose
        family was unavailable for testing, was homozygous for another rare
        LDHD variant
      explanation: Homozygous p.Thr251Met with gout.
    - reference: PMID:34258137
      reference_title: Human d-lactate dehydrogenase deficiency by LDHD mutation in a patient with neurological manifestations and mitochondrial complex IV deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified compound heterozygous variants in the LDHD gene, which
        encodes the d-lactate dehydrogenase, consisting of a splice site
        variant c.469+1dupG and a missense variant c.752C>T, p.(Thr251Met)
      explanation: The same missense allele in trans with a splice variant.
    - reference: PMID:37863926
      reference_title: Lactate dehydrogenase D is a general dehydrogenase for D-2-hydroxyacids and is associated with D-lactic acidosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        in contrast, the T228M and T440M mutants do not exhibit the FAD
        characteristic absorption peak, suggesting the absence of FAD binding
      explanation: Loss of FAD in the mouse equivalent.
  - name: p.Val69Ala
    description: >-
      NM_153486.3:c.206T>C, homozygous in three Melanesian siblings with
      juvenile-onset gout. The abstract of the report writes the change as
      c.206C>T; the reference base at c.206 is T (codon 69 GTG to GCG), as
      ClinVar and the later literature table have it. Val69 is at the start of
      the FAD-binding domain, fully buried in its hydrophobic core and 11
      angstroms from FAD in 8JDE, in contact with Trp71 and Cys113. Alanine
      removes two methyl groups from that core. This is the only reported
      missense variant with no enzyme assay; its effect is inferred from
      position and from the raised D-lactate of homozygotes.
    synonyms:
    - V69A
    - NM_194436.3:c.206T>C (p.Val69Ala)
    identifiers:
    - ClinVar:VCV003381191
    - dbSNP:rs1035398551
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37021930
      reference_title: Early-onset gout and rare deficient variants of the lactate dehydrogenase D gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In a Melanesian family, the variant was (NM_153486.3: c.206C>T;
        rs1035398551)
      explanation: >-
        Reports the variant. The base change is quoted as printed; see the
        description for the corrected direction.
  - name: c.1363dup
    description: >-
      NM_153486.3:c.1363dupG, homozygous in two Vietnamese siblings with
      severe juvenile-onset gout. The duplication is in codon 455 of the
      507-residue protein and in the last of 11 exons, so the transcript is
      predicted to escape nonsense-mediated decay and to produce a protein
      whose C-terminal 53 residues are replaced. The lost segment contains
      Thr463, the manganese ligand Glu465, the catalytic His466 and the
      FAD-binding residue Asn502. The report's protein-level name gives
      residue 432, which is the position in the 484-residue isoform 2.
    synonyms:
    - NM_153486.3:c.1363dupG
    - p.(AlaGly432fsTer58)
    - NM_194436.3:c.1294dup (p.Ala432fs)
    identifiers:
    - ClinVar:VCV003381194
    variant_type: duplication
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37021930
      reference_title: Early-onset gout and rare deficient variants of the lactate dehydrogenase D gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        very severe juvenile-onset gout was linked to homozygote carriage of an
        undescribed LDHD variant (NM_153486.3: c.1363dupG) leading to a
        frameshift followed by a stop codon
      explanation: Reports the frameshift.
  - name: c.469+1dup
    description: >-
      NM_153486.3:c.469+1dupG, a duplication at the splice donor of exon 4,
      found in trans with p.Thr251Met. No transcript from this allele was
      detected in the patient's fibroblasts, consistent with
      nonsense-mediated decay of a mis-spliced message.
    synonyms:
    - NM_153486.3:c.469+1dupG
    - NM_194436.3:c.469+1dup
    identifiers:
    - ClinVar:VCV003381193
    variant_type: duplication
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34258137
      reference_title: Human d-lactate dehydrogenase deficiency by LDHD mutation in a patient with neurological manifestations and mitochondrial complex IV deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sanger sequencing of the cDNA revealed that only the allele with the
        missense variant was expressed while cDNA with the splice site variant
        was not identified
      explanation: The splice allele produces no detectable transcript.
  - name: 16q23.1 deletion including LDHD exons 1-7
    description: >-
      A homozygous deletion of about 0.1 Mb removing the start codon and the
      first seven exons of LDHD together with CTRB2 and ZFP1, in a Danish boy
      of Iraqi descent with developmental delay and metabolic acidosis. A
      null allele.
    variant_type: deletion
    evidence:
    - reference: PMID:40678184
      reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole genome sequencing (WGS) revealed a homozygous 0.1 Mb loss of the
        long arm of chromosome 16 involving 3 protein coding genes, CTRB2,
        ZFP1, and exon 1-7 of the LDHD gene
      explanation: Reports the deletion.
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We illustrate this with the identification of two different homozygous
      variants resulting in enzymatic loss-of-function in LDHD, encoding
      lactate dehydrogenase D, in two unrelated patients with elevated
      D-lactate urinary excretion and plasma concentrations.
    explanation: Establishes LDHD as the causal gene.
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Altogether, there is no obvious correlation between the type of
      pathogenic variant of the LDHD gene and the phenotype.
    explanation: No genotype-phenotype correlation across reported families.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Affected individuals are homozygous or compound heterozygous; carrier
    parents are clinically and biochemically unaffected. Expression ranges
    from an isolated biochemical trait through gout to developmental delay.
  evidence:
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Four of the patients, including our patient, have consanguineous parents,
      and all patients, except one, have homozygous pathogenic variants in the
      LDHD gene of varying types.
    explanation: Biallelic variants in every reported patient.
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical findings observed in patients with LDHD deficiency occur in
      a broad phenotypic spectrum, with some patients having only increased
      plasma urate/gout and others presenting with neurological findings and
      early‐onset psycho‐motor developmental delay.
    explanation: Variable expressivity.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Nineteen patients from eight families had been reported by 2025. No
    population-based estimate exists; see the gnomAD figures under the LDHD
    genetic record for why the true frequency of the biochemical trait is
    likely to be higher.
  evidence:
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Besides our patient, pathogenic variants in the LDHD gene have been
      identified in 18 other patients (from seven families) described in other
      reports.
    explanation: Literature case count.
diagnosis:
- name: Isomer-specific D-lactate measurement in urine and plasma
  description: >-
    Chiral mass spectrometry or an enzymatic D-lactate assay. Suggested by
    heavy lactic aciduria on organic acid analysis with normal plasma
    L-lactate, by raised 2-hydroxyisovaleric and 2-hydroxyisocaproic acids, or
    by gout with onset before adulthood.
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The detection of D-lactate thus requires specific assays based on
      bacterial LDHD or stereospecific mass spectrometry methods, both methods
      not routinely applied
    explanation: The assay requirement.
- name: LDHD sequencing and copy-number analysis
  description: >-
    Confirms the diagnosis. Copy-number analysis is needed because one family
    carries a multi-exon deletion. Reports and databases use different
    residue numbering for the same variants (see the entry notes).
  evidence:
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome sequencing (WGS) revealed a homozygous 0.1 Mb loss of the
      long arm of chromosome 16 involving 3 protein coding genes, CTRB2, ZFP1,
      and exon 1-7 of the LDHD gene
    explanation: A deletion allele detectable only by copy-number-aware methods.
differential_diagnoses:
- name: D-lactic acidosis of short bowel syndrome
  disease_term:
    preferred_term: short bowel syndrome
    term:
      id: MONDO:0015183
      label: short bowel syndrome
  description: >-
    Acquired, episodic D-lactic acidosis with encephalopathy caused by
    bacterial overproduction of D-lactate after intestinal resection or
    bypass.
  distinguishing_features:
  - History of bowel resection, bypass or malabsorption
  - Episodic course related to carbohydrate intake, with overt acidosis and encephalopathy
  - D-lactate falls with antibiotics and carbohydrate restriction, whereas in LDHD deficiency it is constant and unaffected by antibiotics
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeated antibiotic treatments failed to correct D-lactate levels, making
      a bacterial origin of this elevated metabolite unlikely.
    explanation: Antibiotic non-response separates the inherited from the acquired form.
  - reference: PMID:9556700
    reference_title: "D-lactic acidosis. A review of clinical presentation, biochemical features, and pathophysiologic mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis should be considered in a patient who presents with
      metabolic acidosis and high serum anion gap, normal lactate level,
      negative Acetest, short bowel syndrome or other forms of malabsorption,
      and characteristic neurologic findings.
    explanation: Clinical setting of the acquired form.
animal_models:
- name: ldhd sa15623 zebrafish
  species: Zebrafish
  genotype: ldhd sa15623 homozygous, maternal-zygotic
  genes:
  - preferred_term: ldhd
    term:
      id: ZFIN:ZDB-GENE-030131-6140
      label: ldhd
  description: >-
    ENU-induced splice-donor allele after exon 3 causing a premature stop.
    Homozygotes are viable and fertile. Maternal-zygotic mutant larvae have
    raised D-lactate and normal L-lactate; human wild-type LDHD mRNA (the
    isoform 2 cDNA, NM_194436.1) restores D-lactate to baseline and the
    patient alleles p.Thr463Met and p.Trp374Cys do not.
  publication: PMID:30931947
  modeled_mechanisms:
  - target: Systemic D-Lactate Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Loss of ldhd raises whole-larva D-lactate and not L-lactate, as in
      patients.
    readouts:
    - name: Whole-larva D-lactate at 3 days post fertilization
      target: Systemic D-Lactate Accumulation
      direction: INCREASED
      interpretation: >-
        The biochemical hallmark of the human disease, reproduced and
        reversed by wild-type human LDHD.
      evidence:
      - reference: PMID:30931947
        reference_title: Identification of human D lactate dehydrogenase deficiency.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          LDHD loss-of-function in zebrafish results in increased
          concentrations of D-lactate
        explanation: D-lactate is raised in the mutant.
    evidence:
    - reference: PMID:30931947
      reference_title: Identification of human D lactate dehydrogenase deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        D-lactate levels are rescued by wildtype LDHD but not by patients'
        variant LDHD, confirming these variants' loss-of-function effect.
      explanation: Cross-species rescue shows the model reports on human LDHD function.
  - target: Putative Neurodevelopmental Toxicity of Accumulated D-2-Hydroxyacids
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Mutant larvae show no visible abnormality despite raised D-lactate.
    limitations: >-
      Assessment was by gross morphology at 3 and 5 days post fertilization;
      behaviour, later development, urate handling and D-2-hydroxyacids were
      not examined, so a subtle or late neurological effect is not excluded.
    evidence:
    - reference: PMID:30931947
      reference_title: Identification of human D lactate dehydrogenase deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This confirmed conservation of LDHD function in zebrafish and
        demonstrated the biochemical phenotype of LDHD loss-of-function,
        without evident clinical phenotype.
      explanation: No clinical phenotype in the mutant fish.
discussions:
- discussion_id: gap_ldhd_neurological_attribution
  prompt: >-
    Does LDHD deficiency itself cause developmental delay, hypotonia and
    ataxia, or is it a biochemical trait whose only clinical consequence is
    gout, with the neurological features of the index patients explained by
    co-occurring diagnoses?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Putative Neurodevelopmental Toxicity of Accumulated D-2-Hydroxyacids
  - mechanistic_hypotheses#ldhd_hydroxyacid_neurotoxicity_model
  - mechanistic_hypotheses#ldhd_coincidental_neurology_model
  - phenotypes#Global Developmental Delay
  rationale: >-
    The answer decides whether a child found to have LDHD deficiency should be
    counselled about neurodevelopmental risk and whether a neurological
    work-up can stop at this diagnosis. For: about half of reported patients
    have developmental delay, and one such patient has no other genetic
    finding. Against: three have another plausible cause, the gout families
    with the highest D-lactate are neurologically normal, null zebrafish look
    normal, and predicted loss-of-function alleles are frequent enough in
    population data that most biallelic individuals must be undiagnosed.
    Ascertainment also differs: the neurological patients were found by
    metabolic screening of children already under investigation.
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it remains to be elucidated whether LDHD deficiency is a biochemical
      anomaly only, or if it contributes to a human clinical phenotype
    explanation: The question as posed by the discovering authors.
  - reference: PMID:40678184
    reference_title: "Human D-Lactate Dehydrogenase Deficiency: A Case Report in a Young Boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The true fraction of patients with neuro‐developmental signs is uncertain
      because of the co‐occurrence of other diseases with probable neurological
      impact in three patients from this group
    explanation: The confounding that keeps the question open.
  proposed_experiments:
  - experiment_id: ldhd_hydroxyacids_in_gout_families
    name: Chiral organic acid profiling in the gout-only families
    description: >-
      Measure D-2-hydroxyisovaleric, D-2-hydroxyisocaproic and
      2-hydroxy-3-methylvaleric acids in urine and plasma of homozygotes from
      the families ascertained for gout, with formal developmental and
      neurological assessment.
    would_support:
    - mechanistic_hypotheses#ldhd_hydroxyacid_neurotoxicity_model
    would_refute:
    - mechanistic_hypotheses#ldhd_hydroxyacid_neurotoxicity_model
    supporting_outcome:
    - >-
      The hydroxyacids are absent or much lower in neurologically normal
      homozygotes than in those with developmental delay.
    refuting_outcome:
    - >-
      Neurologically normal homozygotes have the same hydroxyacid
      concentrations as those with developmental delay.
- discussion_id: gap_ldhd_urate_transporter
  prompt: >-
    Which renal transporter exchanges D-lactate for urate in LDHD deficiency,
    and why do some homozygotes with raised D-lactate have only marginal
    hyperuricemia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Renal Urate Retention Coupled to D-Lactate Excretion
  - mechanistic_hypotheses#ldhd_urate_exchange_gout_model
  rationale: >-
    The exchange model rests on reduced fractional urate clearance in
    homozygotes and on hyperuricemia after D-lactate injection in mice.
    Neither identifies the carrier. Knowing it would say whether a uricosuric
    that blocks URAT1 is the rational treatment for gout in this disease, as
    opposed to a xanthine oxidase inhibitor, and whether age or D-lactate
    concentration accounts for the children with near-normal urate.
- discussion_id: gap_ldhd_treatment
  prompt: >-
    Is there any treatment that lowers D-lactate or D-2-hydroxyacids in LDHD
    deficiency, and how should the gout be treated?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  - pathophysiology#Systemic D-Lactate Accumulation
  rationale: >-
    No disease-specific treatment has been reported and the treatments
    section is left empty on purpose. The measures used for bacterial
    D-lactic acidosis act on production in the gut and did not work in the
    one patient in whom antibiotics were tried. The abstracts of the gout
    reports do not state how the gout was treated or how it responded, so no
    urate-lowering treatment is recorded here.
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repeated antibiotic treatments failed to correct D-lactate levels, making
      a bacterial origin of this elevated metabolite unlikely.
    explanation: Antibiotics did not lower D-lactate.

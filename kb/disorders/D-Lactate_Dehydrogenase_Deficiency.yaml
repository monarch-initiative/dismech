- name: Renal Urate Retention Coupled to D-Lactate Excretion
  description: >-
    Homozygotes excrete a smaller fraction of filtered urate than their
    relatives, and their serum urate is raised. The proposed mechanism is
    anion exchange in the proximal tubule: D-lactate in the tubular lumen and
    cell is exchanged for urate, so the large D-lactate flux through the
    kidney drives urate back into blood. URAT1 (SLC22A12) is the known apical
    urate-anion exchanger of the human proximal tubule and is the obvious
    candidate, but no study of LDHD deficiency has tested which transporter is
    responsible.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: renal proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  biological_processes:

- name: Systemic D-Lactate Accumulation
  description: >-
    Plasma D-lactate, normally in the low micromolar range, rises to between
    about 0.3 and 3 mmol/L, and D-lactate is excreted in urine in very large
    amounts. L-lactate is unaffected, so routine lactate assays, which measure
    only the L isomer, miss the abnormality. The accumulation is constant, is
    not corrected by antibiotics, and adds an unmeasured anion to plasma.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED

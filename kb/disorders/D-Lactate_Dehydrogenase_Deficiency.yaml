- name: Accumulation of Branched-Chain D-2-Hydroxyacids
  description: >-
    D-2-hydroxyisovaleric acid and D-2-hydroxyisocaproic acid, and in some
    patients 2-hydroxy-3-methylvaleric acid, are raised in urine and plasma.
    These are the D-2-hydroxy analogues of the branched-chain oxoacids of
    valine, leucine and isoleucine and are oxidised by LDHD in vitro. Their
    origin in the body, endogenous or bacterial, is not established. They are
    a more specific marker of LDHD deficiency than D-lactate alone.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.

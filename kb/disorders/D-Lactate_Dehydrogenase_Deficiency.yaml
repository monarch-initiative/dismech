  - pdb_id: 8JDE
    description: >-
      Mouse LDHD (residues 22-484) with FAD, manganese and D-lactate bound.
      Used here to place the human disease residues; human and mouse LDHD are
      85 percent identical and mouse numbering equals human isoform 2
      numbering beyond residue 210.
    resolution_angstrom: 1.73
    method: X-ray
    ligand: FAD, Mn2+, D-lactate
    target_protein: Mouse D-lactate dehydrogenase, mitochondrial (Ldhd, UniProt Q7TNG8)
    publication: PMID:37863926
  notes: >-
    Structural placements are computed, not quoted. Method: UniProt Q86WU2
    (human) was aligned to Q7TNG8 (mouse) with BLOSUM62; distances are minimum
    heavy-atom distances in PDB 8JDE chain A, whose residue numbering matches
    Q7TNG8 with no mismatches; burial is relative side-chain solvent
    accessibility (Shrake-Rupley). In human numbering the manganese ligands
    are His421, His428 and Glu465, and the residues within 4 angstroms of
    D-lactate are Arg370, His421, His428, Glu465 and His466; the lactate C2
    atom lies 3.1 angstroms from FAD N5. The AlphaFold model of the human
    protein (AF-Q86WU2-F1, version 6) has mean pLDDT 89.8, with low confidence
    confined to the transit peptide (residues 1-52) and the isoform-1-specific
    insertion 211-233 (mean pLDDT 36.8), which PMID:37863926 describes as a
    surface loop away from the active site. No experimental structure of the
    human protein exists.
  evidence:
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We illustrate this with the identification of two different homozygous
      variants resulting in enzymatic loss-of-function in LDHD, encoding
      lactate dehydrogenase D, in two unrelated patients with elevated
      D-lactate urinary excretion and plasma concentrations.
    explanation: Biallelic loss-of-function variants in LDHD define the disease.
  - reference: PMID:30931947
    reference_title: Identification of human D lactate dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      D-lactate levels are rescued by wildtype LDHD but not by patients'
      variant LDHD, confirming these variants' loss-of-function effect.
    explanation: >-
      Zebrafish complementation shows the patient alleles are loss of
      function.
  - reference: PMID:37863926
    reference_title: Lactate dehydrogenase D is a general dehydrogenase for D-2-hydroxyacids and is associated with D-lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that mLDHD is an Mn2+-dependent general dehydrogenase
      which exhibits catalytic activity for D-lactate and other
      D-2-hydroxyacids containing hydrophobic moieties, but no activity for
      their L-isomers or D-2-hydroxyacids containing hydrophilic moieties.
    explanation: >-
      Defines the normal catalytic activity, metal dependence and substrate
      range of the enzyme, from recombinant mouse LDHD.
  - reference: PMID:37863926
    reference_title: Lactate dehydrogenase D is a general dehydrogenase for D-2-hydroxyacids and is associated with D-lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, the activity assay shows that all the mutants lose about 90% of
      the activity towards D-lactate
    explanation: >-
      The mouse equivalents of the four human missense variants tested
      (T251M, R370W, W374C, T463M) each lose about 90 percent of activity.
  - reference: PMID:38373542
    reference_title: The catalytic action of human d-lactate dehydrogenase is severely inhibited by oxalate and is impaired by mutations triggering d-lactate acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, the mutations W323C and T412 M negatively affect the
      activity of hDLDH, most likely by impairing the enzyme electron-acceptor
      site.
    explanation: >-
      Recombinant human enzyme carrying the two index substitutions
      (p.Trp374Cys and p.Thr463Met in precursor numbering) has reduced
      activity.
  - reference: PMID:11955284
    reference_title: D-Lactate transport and metabolism in rat liver mitochondria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the activity of the putative flavoprotein (D-lactate dehydrogenase) was
      detected in inside-out submitochondrial particles, but not in
      mitochondria and mitoplasts, as it is localized in the matrix phase of
      the mitochondrial inner membrane
    explanation: >-
      Places a D-lactate dehydrogenase activity on the matrix side of the
      inner membrane in isolated rat liver mitochondria. The study predates
      the identification of the gene and measured activity only, and its
      matrix-side assignment is in tension with direct cytochrome c reduction
      by the purified human enzyme.
  - reference: PMID:38413804
    reference_title: "PMF-seq: a highly scalable screening strategy for linking genetics to mitochondrial bioenergetics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using the purified LDHD, we could confirm direct electron transfer from
      d-lactate to cytochrome c by monitoring its haem absorbance (Fig. 3f).
    explanation: >-
      Purified human LDHD reduces cytochrome c directly, identifying the
      physiological electron acceptor.
  - reference: PMID:31638601
    reference_title: Hyperuricemia and gout caused by missense mutation in d-lactate dehydrogenase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      d-lactate dehydrogenase resides in the mitochondria of cells
      overexpressing the human LDHD gene
    explanation: Human LDHD is mitochondrial in transfected cells.

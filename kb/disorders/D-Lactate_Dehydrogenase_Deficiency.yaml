    reference_title: Hyperuricemia and gout caused by missense mutation in d-lactate dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequent excessive renal secretion of d-lactate in exchange for uric
      acid reabsorption culminated in hyperuricemia and gout.
    explanation: The authors' mechanism for hyperuricemia in the affected kindred.
  - reference: PMID:37021930
    reference_title: Early-onset gout and rare deficient variants of the lactate dehydrogenase D gene.

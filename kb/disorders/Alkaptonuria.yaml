discussions:
- discussion_id: alkaptonuria_hgd_mouse_ochronosis_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Why does the Hgdaku/aku mouse reproduce systemic HGA accumulation and its
    pharmacodynamic response to nitisinone but fail to develop human ochronosis?
  rationale: >
    The model is useful for HGA production and lowering, but absence of the
    defining pigment-deposition phenotype limits inference about
    connective-tissue degeneration and clinical disease modification.
    Comparative studies should identify the species-specific chemistry, matrix context, exposure
    duration, or protective pathways that prevent murine ochronosis.
  attaches_to:
  - pathophysiology#HGA oxidative polymerization and ochronotic pigment formation
  - pathophysiology#Ochronotic connective tissue degeneration
  - phenotypes#Ochronosis
  evidence:
  - reference: PMID:19862842
    reference_title: "Mutation spectrum of homogentisic acid oxidase (HGD) in alkaptonuria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hgdaku/aku mice have high levels of HGA in the urine and plasma but have no signs of ochronosis"
    explanation: The cited biochemical–tissue mismatch motivates the translational knowledge gap.

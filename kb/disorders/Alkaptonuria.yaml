notes: >-
  Publication review retained the direct Orphanet/MONDO mapping while separating
  HGA accumulation from oxidative pigment polymerization and adding provisional
  chondrocyte oxidative-stress and autophagy-lysosomal mechanisms supported by
  2025-2026 experiments. Treatment evidence distinguishes composite SONIA 2
  benefit from the absence of an observed arthroplasty reduction and from
  nitisinone-induced tyrosinemia management. The broad Orphanet terms
  HP:0000366 (abnormality of the nose) and HP:0001597 (abnormality of the nail)
  were reviewed but not modeled: neither source specifies a morphology or
  mechanism, and adding umbrella phenotypes would reduce computability rather
  than refine the already modeled ochronotic pigmentation spectrum.

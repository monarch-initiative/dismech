- name: HGA oxidative polymerization and ochronotic pigment formation
  biological_scale: MOLECULAR
  description: >
    HGA slowly polymerizes at physiological pH through semiquinone-mediated
    oxidative coupling, producing heterogeneous, negatively charged pigment
    polymers with phenolic ether and biphenyl linkages.
  chemical_entities:
  - preferred_term: homogentisic acid
    term:
      id: CHEBI:44747
      label: homogentisic acid
  evidence:
  - reference: PMID:41096940
    reference_title: "Ochronotic Deposition in Alkaptonuria: Semiquinone-Mediated Oxidative Coupling and Metabolic Drivers of Homogentisic Acid Accumulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At physiological pH, HGA polymerised slowly, while alkaline catalysis accelerated pigment formation while retaining the HGA aromatic scaffold."
    explanation: Direct NMR and EPR experiments define the chemistry of HGA pigment formation.
  - reference: PMID:41096940
    reference_title: "Ochronotic Deposition in Alkaptonuria: Semiquinone-Mediated Oxidative Coupling and Metabolic Drivers of Homogentisic Acid Accumulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pigments displayed a polydisperse molecular weight range (11-50 kDa) and a strong negative charge. Solid-state NMR has revealed the presence of phenolic ether and biphenyl linkages."
    explanation: NMR and electrophoretic characterization support the curated pigment structural properties.
  downstream:
  - target: Ochronotic connective tissue degeneration
    description: HGA-derived pigment deposits in collagen-rich connective tissues and cartilage.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

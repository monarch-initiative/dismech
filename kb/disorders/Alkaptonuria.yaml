treatments:
- name: Nitisinone therapy
  description: >
    Nitisinone inhibits an upstream tyrosine-degradation step to reduce HGA
    production. In SONIA 2, daily nitisinone markedly reduced urinary HGA and
    slowed composite clinical progression as measured by cAKUSSI. It increases
    serum tyrosine and can cause corneal keratopathy; a later arthroplasty
    analysis did not find a reduction in incident joint replacement.

inheritance:
- name: Autosomal recessive
  description: >
    Alkaptonuria is caused by biallelic pathogenic HGD variants. When both
    parents are carriers, each pregnancy has a 25% chance of an affected child,
    a 50% chance of an asymptomatic carrier, and a 25% chance of a child who is
    unaffected and not a carrier.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by bidirectional or polymorphic ventricular arrhythmia provoked by exercise or emotion"
    explanation: CPVT arrhythmia is provoked by exercise or emotion (catecholaminergic stimulation).
  downstream:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    description: The catecholamine surge increases SR calcium loading and RyR2 phosphorylation, unmasking the latent calcium leak.
- name: Reduced Luminal Calcium Activation Threshold
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Store-overload-induced calcium release (SOICR) model. CPVT-linked RYR2
    variants from all three hot-spot regions increase the sensitivity of the
    channel to activation by *luminal* (intra-SR) — but not cytosolic — calcium,
    lowering the store-calcium threshold at which spontaneous release occurs.
    Because beta-adrenergic stimulation raises SR calcium load, the lowered
    threshold is crossed precisely under exercise or emotional stress. This is
    the most widely adopted explanation and accounts for why the leak is
    adrenergically gated rather than constitutive.
  genes:
  - preferred_term: RYR2
    term:
      id: hgnc:10484
      label: RYR2
  molecular_functions:
  - preferred_term: ryanodine-sensitive calcium-release channel activity
    term:
      id: GO:0005219
      label: ryanodine-sensitive calcium-release channel activity
    modifier: INCREASED
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:
  - preferred_term: sarcoplasmic reticulum membrane
    term:
      id: GO:0033017
      label: sarcoplasmic reticulum membrane
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:16239587
    reference_title: Enhanced store overload-induced Ca2+ release and channel sensitivity to luminal Ca2+ activation are common defects of RyR2 mutations linked to ventricular tachycardia and sudden death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "disease-linked RyR2 mutations primarily increase the channel sensitivity to luminal, but not to cytosolic, Ca2+ activation"
    explanation: >-
      Single-channel recordings localize the shared defect to luminal calcium
      sensitivity specifically, which is the defining claim of the SOICR model.
  - reference: PMID:16239587
    reference_title: Enhanced store overload-induced Ca2+ release and channel sensitivity to luminal Ca2+ activation are common defects of RyR2 mutations linked to ventricular tachycardia and sudden death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enhanced SOICR activity and luminal Ca2+ activation represent common defects of RyR2 mutations associated with VT and sudden death"
    explanation: >-
      States the generalization across variants from different channel regions
      that makes SOICR a candidate unifying mechanism.
  downstream:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    description: >-
      Once the lowered luminal-calcium threshold is exceeded during adrenergic
      SR calcium loading, the channel releases spontaneously in diastole.
    hypothesis_groups:
    - soicr_luminal_calcium_sensing
- name: Calstabin-2 (FKBP12.6) Dissociation from RyR2
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Calstabin-2 (FKBP12.6) model. FKBP12.6 normally binds and stabilizes the
    closed state of RyR2. Under this model, CPVT-linked RYR2 variants reduce
    FKBP12.6 binding affinity, so the PKA phosphorylation that accompanies
    exercise strips the stabilizing subunit from the channel and leaves it
    "leaky". This model is the rationale for the Rycal class of RyR2
    stabilizers.

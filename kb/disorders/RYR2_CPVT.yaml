- name: RyR2 Interdomain Unzipping
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Domain-switch ("zipping/unzipping") model. In the resting channel the
    N-terminal (aa 1-600) and central (aa 2000-2500) domains are in close
    contact, an intrinsic brake on opening. A single CPVT variant weakens that
    interdomain contact — "unzipping" — and PKA phosphorylation during
    adrenergic stimulation deepens it further, lowering the luminal-calcium
    threshold for activation. This model addresses why variants scattered across a very large
    protein converge on a hot-spot-restricted phenotype.

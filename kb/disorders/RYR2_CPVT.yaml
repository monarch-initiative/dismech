- name: Adrenergic Stimulation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Physical exertion or acute emotional stress produces a catecholamine
    (beta-adrenergic) surge that acts on the genetically primed calcium-release
    apparatus, precipitating diastolic SR calcium leak and triggered arrhythmia.
    This adrenergic arm is the therapeutic target of beta-blockade and left
    cardiac sympathetic denervation.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948

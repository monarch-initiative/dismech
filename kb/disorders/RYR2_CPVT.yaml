mechanistic_hypotheses:
- hypothesis_group_id: soicr_luminal_calcium_sensing
  hypothesis_label: Store-Overload-Induced Calcium Release (Luminal Calcium Sensing) Model
  status: CANONICAL
  description: >-
    CPVT-linked RYR2 variants act by raising the channel's sensitivity to
    luminal (intra-SR) calcium, lowering the store-calcium threshold for
    spontaneous release (SOICR). The defect is specific to luminal — not
    cytosolic — activation, and is shared by variants from the N-terminal,
    central, and C-terminal hot-spot regions, which is what makes it a
    candidate unifying mechanism. Treated as canonical because it is the
    account most consistently reproduced across variants and the one that most
    directly explains adrenergic gating (beta-adrenergic stimulation raises SR
    load until the lowered threshold is crossed).
  applies_to_subtypes:
  - CPVT1
  evidence:
  - reference: PMID:16239587
    reference_title: Enhanced store overload-induced Ca2+ release and channel sensitivity to luminal Ca2+ activation are common defects of RyR2 mutations linked to ventricular tachycardia and sudden death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enhanced SOICR activity and luminal Ca2+ activation represent common defects of RyR2 mutations associated with VT and sudden death"
    explanation: The paper's own summary of the SOICR model as a common mechanism.
- hypothesis_group_id: calstabin2_dissociation
  hypothesis_label: Calstabin-2 (FKBP12.6) Dissociation Model
  status: ALTERNATIVE
  description: >-
    CPVT-linked RYR2 variants act by reducing the binding affinity of the
    stabilizing subunit FKBP12.6 (calstabin-2), so that exercise-associated PKA
    phosphorylation dissociates it and leaves the channel leaky. Recorded as
    ALTERNATIVE rather than DEPRECATED: the mouse genetics are strong
    (FKBP12.6-null mice have exercise-triggered arrhythmia and sudden death)
    and the model underpins the Rycal drug class, but the central claim that
    CPVT variants themselves weaken the FKBP12.6-RyR2 interaction was directly
    contradicted by the SOICR group and has never been fully reconciled.
  applies_to_subtypes:
  - CPVT1
  evidence:
  - reference: PMID:12837242
    reference_title: FKBP12.6 deficiency and defective calcium release channel (ryanodine receptor) function linked to exercise-induced sudden cardiac death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced the affinity of FKBP12.6 for RyR2 and increased single-channel activity under conditions that simulate exercise"
    explanation: The founding experimental claim of the calstabin-2 model.
  - reference: PMID:16239587
    reference_title: Enhanced store overload-induced Ca2+ release and channel sensitivity to luminal Ca2+ activation are common defects of RyR2 mutations linked to ventricular tachycardia and sudden death.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "we found no evidence that disease-linked RyR2 mutations alter the FKBP12.6-RyR2 interaction"
    explanation: >-
      The explicit failure to replicate that keeps this model alternative
      rather than canonical.
- hypothesis_group_id: interdomain_unzipping
  hypothesis_label: Interdomain Unzipping (Domain-Switch) Model
  status: ALTERNATIVE
  description: >-
    CPVT-linked RYR2 variants act by weakening the N-terminal/central
    interdomain contact that constrains the resting channel ("domain
    unzipping"), lowering the energy barrier to opening. Partly complementary
    rather than strictly competing with SOICR: the knock-in mouse work
    concludes that the reduced luminal-calcium threshold is itself *mediated
    by* the defective interdomain interaction, positioning unzipping upstream
    of the SOICR phenotype rather than as a rival endpoint.
  applies_to_subtypes:
  - CPVT1
  evidence:
  - reference: PMID:20224043
    reference_title: Catecholaminergic polymorphic ventricular tachycardia is caused by mutation-linked defective conformational regulation of the ryanodine receptor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "primarily mediated by defective interdomain interaction within the RyR2"
    explanation: >-
      States the causal ordering that distinguishes this model from a bare
      restatement of SOICR.
- hypothesis_group_id: primed_state_conformation
  hypothesis_label: RyR2 Primed-State Structural Model
  status: EMERGING
  description: >-
    Cryo-EM structures of RyR2 variants linked to inherited sudden cardiac
    death, and of remodelled RyR2 from failing hearts, all sit in a shared
    "primed" intermediate conformation between closed and open, proposed as the
    common structural substrate of calcium leak across genetic CPVT and
    acquired heart failure. Recorded as EMERGING: the structures are direct
    evidence, but the claim that the primed state *underlies* the arrhythmias
    is framed by the authors as a proposal, and the model has not yet been
    tested against the SOICR luminal-sensing account.
  applies_to_subtypes:
  - CPVT1
  evidence:
  - reference: PMID:39278969
    reference_title: Structural basis for ryanodine receptor type 2 leak in heart failure and arrhythmogenic disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All are in the primed state, part way between closed and open."
    explanation: The structural observation on which the model rests.
  notes: >-
    Same laboratory as the calstabin-2 model, and mechanistically continuous
    with it (calstabin-2 depletion is one route into the primed state), so the
    two are not fully independent lines of evidence.

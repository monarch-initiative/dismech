diagnosis:
- name: Clinical and exercise-stress-test diagnosis
  description: >-
    CPVT is diagnosed by exercise- or emotion-induced bidirectional or
    polymorphic ventricular tachycardia in a structurally normal heart with a
    normal resting ECG, or by identification of a heterozygous pathogenic
    variant in RYR2, CALM1, CALM2, CALM3, or CASQ2 (or biallelic variants in
    CASQ2, TECRL, or TRDN). Exercise (treadmill or bicycle) stress testing is
    the key provocative diagnostic test.
  evidence:
  - reference: PMID:20301466
    reference_title: Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CPVT is established in the presence of a structurally normal heart, normal resting EKG, and exercise- or emotion-induced bidirectional or polymorphic ventricular tachycardia"
    explanation: GeneReviews diagnostic criteria for CPVT.
treatments:
- name: Beta-Blocker Therapy (Nadolol)
  description: >-
    Nonselective beta-blockers, particularly nadolol, are first-line therapy
    for CPVT. Nadolol is superior to beta1-selective agents in reducing
    exercise-induced ventricular arrhythmias. All patients with a clinical
    or genetic diagnosis of CPVT should receive beta-blocker therapy and
    avoid competitive sports and strenuous exercise.
  treatment_term:
    preferred_term: nadolol therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Adrenergic Stimulation
    treatment_effect: INHIBITS
    description: >-
      Nonselective beta-blockade blunts the catecholaminergic (beta-adrenergic)
      surge that precipitates diastolic SR calcium leak and triggered arrhythmia.
  evidence:
  - reference: PMID:26432584
    reference_title: Nadolol decreases the incidence and severity of ventricular arrhythmias during exercise stress testing compared with beta1-selective beta-blockers in patients with catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence and severity of ventricular arrhythmias decreased during treatment with nadolol compared with during treatment with β1-selective β-blockers"
    explanation: Demonstrates nadolol superiority over selective beta-blockers in CPVT.
  - reference: PMID:20301466
    reference_title: Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nadolol is the most effective beta blocker in CPVT"
    explanation: GeneReviews identifies nadolol as the most effective beta blocker in CPVT.
- name: Flecainide
  description: >-
    Flecainide is used as add-on therapy in patients with breakthrough
    arrhythmias on beta-blockers. It directly inhibits RyR2 by open state
    block, reducing the mass of calcium sparks and preventing arrhythmogenic
    calcium waves.
  treatment_term:
    preferred_term: flecainide therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    treatment_effect: INHIBITS
    description: >-
      Flecainide directly inhibits RyR2 by open-state block, reducing calcium
      spark mass and suppressing the diastolic SR calcium leak that is the
      central effector of CPVT.
  evidence:
  - reference: PMID:19835880
    reference_title: Flecainide inhibits arrhythmogenic Ca2+ waves by open state block of ryanodine receptor Ca2+ release channels and reduction of Ca2+ spark mass.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "flecainide significantly reduced spark amplitude and spark width, resulting in a 40% reduction in spark mass"
    explanation: Demonstrates the mechanism by which flecainide suppresses arrhythmogenic calcium waves in isolated cardiomyocytes from a CPVT mouse model.
  - reference: PMID:19835880
    reference_title: Flecainide inhibits arrhythmogenic Ca2+ waves by open state block of ryanodine receptor Ca2+ release channels and reduction of Ca2+ spark mass.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we recently found that the drug flecainide inhibits RyR2 channels and prevents CPVT in mice and humans"
    explanation: Establishes flecainide as an effective CPVT therapy through RyR2 channel inhibition.
  - reference: PMID:39733778
    reference_title: "Treatment Outcomes in Children With Catecholaminergic Polymorphic Ventricular Tachycardia: A Single Institutional Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined beta-blocker and flecainide therapy demonstrated a lower risk of cardiac events than beta-blocker monotherapy"
    explanation: >-
      A pediatric CPVT cohort (23 patients, RYR2 variants in 17) quantifies the
      benefit of adding flecainide to beta-blockade over beta-blockade alone.
- name: Implantable Cardioverter-Defibrillator (ICD)
  description: >-
    ICD implantation is recommended for patients with inadequately controlled
    arrhythmias despite optimal pharmacotherapy, or survivors of cardiac
    arrest. ICD shocks can paradoxically trigger catecholamine surges and
    arrhythmia storms, so programming must be optimized.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ICD implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39835466
    reference_title: "Genetics, manifestations, and management of catecholaminergic polymorphic ventricular tachycardia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early genetic testing and personalized treatment, including beta-blockers, flecainide, and ICDs, is important in improving outcomes"
    explanation: ICDs are part of the standard CPVT management toolkit.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Left cardiac sympathetic denervation (LCSD) surgically removes the left
    stellate ganglion and the first thoracic sympathetic ganglia, reducing
    catecholaminergic drive to the heart. It is used for patients with
    breakthrough arrhythmias despite optimal beta-blocker and flecainide
    therapy, or those intolerant of pharmacotherapy. A significant residual
    burden of life-threatening arrhythmias can persist after LCSD, so it is
    an adjunct rather than a stand-alone cure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Adrenergic Stimulation
    treatment_effect: INHIBITS
    description: >-
      LCSD interrupts left-sided sympathetic input to the heart, reducing the
      catecholaminergic drive that precipitates the calcium leak and triggered
      arrhythmia.
  evidence:
  - reference: PMID:20301466
    reference_title: Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a significant burden of life-threatening arrhythmias persists after left cardiac sympathetic denervation"
    explanation: GeneReviews recognizes LCSD as a CPVT intervention while noting residual arrhythmia burden.
- name: Exercise Restriction
  description: >-
    Avoidance of competitive sports and strenuous exercise is a cornerstone
    of CPVT management. Exercise provokes catecholamine release that triggers
    arrhythmias in susceptible individuals. Agents/circumstances to avoid also
    include the use of digitalis, which can precipitate arrhythmias in CPVT.
  treatment_term:
    preferred_term: exercise restriction
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37558300
    reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia: A Review of Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by bidirectional or polymorphic ventricular arrhythmia provoked by exercise or emotion"
    explanation: Exercise provocation of arrhythmias is the basis for activity restriction recommendations.
  - reference: PMID:20301466
    reference_title: Catecholaminergic Polymorphic Ventricular Tachycardia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Competitive sports and other strenuous exercise; use of digitalis"
    explanation: GeneReviews "Agents/circumstances to avoid" lists competitive sports, strenuous exercise, and digitalis.
discussions:
- discussion_id: cpvt1_ryr2_leak_mechanism_controversy
  prompt: >-
    By what molecular mechanism does a single RYR2 missense substitution
    destabilize the channel — reduced luminal-calcium threshold (SOICR),
    calstabin-2 dissociation, interdomain unzipping, or entry into a primed
    conformational state — and are these four accounts rival explanations or
    successive descriptions of one process?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Luminal Calcium Activation Threshold
  - pathophysiology#Calstabin-2 (FKBP12.6) Dissociation from RyR2
  - pathophysiology#RyR2 Interdomain Unzipping
  - pathophysiology#RyR2 Primed-State Conformation
  rationale: >-
    This is a genuine, unresolved, and directly evidenced disagreement rather
    than a curation gap. The SOICR group reported an explicit failure to
    replicate the founding calstabin-2 claim ("no evidence that disease-linked
    RyR2 mutations alter the FKBP12.6-RyR2 interaction"), so at least two of
    the four models make incompatible assertions about the same molecular
    interaction. The other two are partially reconcilable rather than rival:
    the knock-in mouse work positions interdomain unzipping *upstream* of the
    lowered luminal-calcium threshold, and the primed-state structures come
    from the same laboratory as the calstabin-2 model and share its premise.
    The distinction matters therapeutically, because the
    calstabin-2/primed-state axis is the explicit rationale for the Rycal
    stabilizer class, whereas a purely luminal-sensing defect would motivate a
    different target.
    Curated as four `mechanistic_hypotheses` groups with the causal edges
    tagged, rather than collapsing to a single asserted chain.
  evidence:
  - reference: PMID:16239587
    reference_title: Enhanced store overload-induced Ca2+ release and channel sensitivity to luminal Ca2+ activation are common defects of RyR2 mutations linked to ventricular tachycardia and sudden death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RyR2 mutations have been linked to VT and sudden death, but their precise impacts on channel function remain largely undefined and controversial."
    explanation: >-
      The primary literature itself characterizes the functional impact of
      CPVT RYR2 variants as controversial.
- discussion_id: cpvt1_ryr2_loss_of_function_crds_boundary
  prompt: >-
    Should RYR2 loss-of-function variants be curated under CPVT1 at all, given
    that they produce calcium release deficiency syndrome (CRDS) — a distinct
    arrhythmia phenotype without inducible bidirectional VT?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#RYR2 Gain-of-Function Variant
  rationale: >-
    CPVT1 as modelled here is specifically a RYR2 *gain-of-function*
    channelopathy. Damaging loss-of-function RYR2 variants cause a separate
    entity, CRDS, in which patients are predisposed to sudden death but
    typically lack electrical abnormalities at rest or on stress
    electrocardiography — so the exercise stress test that establishes a CPVT
    diagnosis does not unmask CRDS, and an invasive long-burst, long-pause,
    short-coupled ventricular extra-stimulus protocol is required instead.
    This is a practical named-entity hazard: a gene-first search on "RYR2
    arrhythmia" will return CRDS literature that must not be curated as CPVT1
    evidence. Recorded as an explicit boundary rather than silently excluded.
    CRDS is not currently a dismech entry; whether to create one is left as a
    scoping decision rather than assumed here.
  evidence:
  - reference: PMID:37558302
    reference_title: "Calcium Release Deficiency Syndrome: A New Inherited Arrhythmia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calcium release deficiency syndrome (CRDS) is a newly described form of inherited arrhythmia caused by damaging loss-of-function variants in the cardiac ryanodine receptor (RyR2)."
    explanation: >-
      Establishes CRDS as a distinct RYR2 entity defined by loss- rather than
      gain-of-function.
  - reference: PMID:37558302
    reference_title: "Calcium Release Deficiency Syndrome: A New Inherited Arrhythmia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the prototypical RyR2 gain-of-function channelopathy, known as catecholaminergic polymorphic ventricular tachycardia, patients with CRDS are predisposed to sudden death usually in the absence of any electrical abnormalities at rest or during stress electrocardiography."
    explanation: >-
      States the diagnostic contrast with CPVT directly, which is the reason
      the two must be kept as separate entities.
notes: >-
  This entry lumps 4 Gene2Phenotype rows for RYR2. (1) CPVT definitive:
  the primary phenotype covered here. (2) CPVT with intellectual disability
  (limited): some RYR2 variants are associated with extracardiac neurological
  features including epilepsy and neurodevelopmental delay; these are captured
  in the phenotypes section. (3) ARVC (refuted): early reports suggested
  RYR2 variants could cause arrhythmogenic right ventricular cardiomyopathy,
  but this association has been refuted by subsequent studies and expert
  consensus. (4) HCM (limited): rare reports of hypertrophic cardiomyopathy
  in RYR2 variant carriers exist but evidence is very limited and not widely
  accepted.

  Gene spectrum: RYR2 (CPVT1) accounts for ~95% of genetically confirmed cases;
  CASQ2 (CPVT2), TRDN, and TECRL cause autosomal recessive forms, and
  CALM1/CALM2/CALM3 cause a dominant calmodulinopathy overlapping with long QT
  syndrome. KCNJ2 is included in the GeneReviews CPVT diagnostic gene list, but
  the monogenic KCNJ2-CPVT relationship has been classified as disputed by
  ClinGen (KCNJ2 variants primarily cause Andersen-Tawil syndrome), so it is
  noted here rather than curated as a causative gene.

  CPVT1 scoping: this file remains the disease-level CPVT root keyed to the
  umbrella term MONDO:0017990 (the design decision made in PR #1165 and
  extended in PR #7227), and CPVT1 is modelled *within* it rather than as a
  duplicate entry — as an explicit `has_subtypes` member bound to
  MONDO:0011484, plus a disease-level `skos:narrowMatch` mapping to the same
  term. The numbered series CPVT2-CPVT5 is carried alongside it as subtype
  stubs so the nosology is complete at the root; each stub's MONDO term and
  gene were verified against `sqlite:obo:mondo` (`RO:0004003`) and agree with
  the genes already curated in `genetic:`. CPVT2 (CASQ2) is additionally being
  curated as its own disease entry, so its stub here is deliberately thin and
  is not the place to add CASQ2-specific depth.

  The pathophysiology graph now models four competing molecular accounts of the
  RYR2 gain-of-function lesion (SOICR luminal-calcium sensing, calstabin-2
  dissociation, interdomain unzipping, and the primed-state conformation) as
  separate nodes whose causal edges opt into `mechanistic_hypotheses` groups,
  rather than asserting one as settled. Two of the four make directly
  incompatible claims about the FKBP12.6-RyR2 interaction; that disagreement is
  recorded as a `CONTROVERSY` discussion and as a `REFUTE` evidence item on the
  node it disputes. The hypothesis-agnostic summary edge from the RYR2 trigger
  straight to the calcium-leak node is retained so the graph still reads as a
  single chain for consumers that ignore hypothesis groups.

  Deliberately NOT curated here: RYR2 loss-of-function variants. These cause
  calcium release deficiency syndrome (CRDS), a separate entity with no
  inducible bidirectional VT on stress testing; the boundary is recorded as an
  `INTERPRETATION` discussion. Also not curated: the intellectual-disability
  and ADHD frequency figures from the pediatric cohorts. The 43.5% figure in
  the Korean series is a composite "neuropsychiatric manifestations" endpoint
  spanning several distinct HPO concepts, so per the frequency-evidence
  guidelines it was not back-derived into a `frequency:` band on any single
  phenotype; the existing Epilepsy phenotype keeps its qualitative band.

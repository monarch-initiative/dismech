name: RYR2 CPVT
creation_date: '2026-04-04T00:00:00Z'
description: >-
  Catecholaminergic polymorphic ventricular tachycardia (CPVT) is a heritable
  cardiac channelopathy of sarcoplasmic-reticulum calcium handling. The hallmark
  is exercise- or emotion-triggered bidirectional or polymorphic ventricular
  tachycardia in the setting of a structurally normal heart and normal resting
  ECG. If untreated, mortality rates of 30-50% by age 40 have been reported.
  The most common cause is a gain-of-function pathogenic variant in RYR2 (the
  cardiac ryanodine receptor); RYR2 variants are found in about 95% of patients
  with a genetically confirmed diagnosis of CPVT. Although RYR2 accounts for the large majority,
  CPVT is genetically heterogeneous: CASQ2 (CPVT2), TRDN, and TECRL cause
  autosomal recessive forms, and CALM1/CALM2/CALM3 cause a dominant
  calmodulinopathy that overlaps clinically with long QT syndrome. Estimated
  prevalence is 1:5,000 to 1:10,000. This entry (despite the RYR2-centric
  file name) is the disease-level CPVT root, keyed to the umbrella term
  MONDO:0017990. It absorbs 4 Gene2Phenotype rows for RYR2: definitive CPVT,
  limited CPVT with intellectual disability, refuted ARVC (noted only), and
  limited HCM (noted only).
synonyms:
- CPVT
- CPVT1
- catecholaminergic polymorphic ventricular tachycardia
- familial polymorphic ventricular tachycardia

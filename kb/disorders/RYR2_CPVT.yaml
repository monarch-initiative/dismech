pathophysiology:
- name: RYR2 Gain-of-Function Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  description: >-
    The upstream trigger of RYR2-CPVT is a pathogenic gain-of-function variant
    in RYR2, the gene encoding the cardiac ryanodine receptor calcium-release
    channel. Such variants sensitize RyR2 to sarcoplasmic-reticulum luminal
    calcium and increase the probability of spontaneous channel opening,
    predisposing to diastolic calcium release. RYR2 gain-of-function variants
    account for the large majority of genetically confirmed CPVT.
  genes:
  - preferred_term: RYR2
    term:
      id: hgnc:10484
      label: RYR2
  molecular_functions:
  - preferred_term: ryanodine-sensitive calcium-release channel activity
    term:
      id: GO:0005219
      label: ryanodine-sensitive calcium-release channel activity
    modifier: INCREASED
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gain-of-function mutations in the RYR2 gene are found in about 95% of patients with a genetically confirmed diagnosis of CPVT"
    explanation: Identifies gain-of-function RYR2 variants as the predominant genetic cause and upstream trigger of CPVT.
  downstream:
  - target: Diastolic Sarcoplasmic Reticulum Calcium Leak
    description: >-
      The gain-of-function variant sensitizes RyR2 to sarcoplasmic-reticulum
      luminal calcium, producing diastolic calcium leak. This summary edge is
      hypothesis-agnostic: the four mechanistic models below propose competing
      accounts of the intervening molecular step.
  - target: Reduced Luminal Calcium Activation Threshold
    description: >-
      Under the SOICR model the variant lowers the luminal calcium threshold at
      which the channel spontaneously releases.
    hypothesis_groups:
    - soicr_luminal_calcium_sensing
  - target: Calstabin-2 (FKBP12.6) Dissociation from RyR2
    description: >-
      Under the calstabin-2 model the variant reduces the affinity of FKBP12.6
      for RyR2, so beta-adrenergic PKA phosphorylation strips the stabilizing
      subunit from the channel.
    hypothesis_groups:
    - calstabin2_dissociation
  - target: RyR2 Interdomain Unzipping
    description: >-
      Under the domain-switch model the variant weakens the N-terminal/central
      interdomain contact that normally holds the channel closed.
    hypothesis_groups:
    - interdomain_unzipping
  - target: RyR2 Primed-State Conformation
    description: >-
      Under the structural model the variant traps the channel in a "primed"
      intermediate conformation part way between closed and open.
    hypothesis_groups:
    - primed_state_conformation
  - target: Epilepsy
    description: Some RYR2 variant carriers have extra-cardiac neurological manifestations, including epilepsy; the precise neuronal intermediate remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39835466
      reference_title: "Genetics, manifestations, and management of catecholaminergic polymorphic ventricular tachycardia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "recognition of the extra-cardiac manifestations such as epilepsy,"
      explanation: The CPVT review supports epilepsy as an extra-cardiac manifestation in RYR2 variant carriers, while leaving the intermediate mechanism open.

- name: Diastolic Sarcoplasmic Reticulum Calcium Leak
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: central_effector
  description: >-
    Aberrant diastolic calcium release ("calcium leak") from the sarcoplasmic
    reticulum through the RyR2 channel is the shared central effector on which
    the CPVT gene lesions converge: RYR2 gain-of-function directly sensitizes the
    channel, while CASQ2, TRDN, CALM1/2/3, and TECRL destabilize RyR2 regulation
    or SR calcium handling. During adrenergic stimulation (exercise or stress),
    beta-adrenergic signalling increases SR calcium loading and RyR2
    phosphorylation, driving unregulated pathological calcium release into the
    cytosol.

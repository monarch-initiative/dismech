name: Calvarial Doughnut Lesions-Bone Fragility Syndrome
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: calvarial doughnut lesions with bone fragility, with or without spondylometaphyseal dysplasia (SGMS2-related)
  term:
    id: MONDO:0007470
    label: calvarial doughnut lesions-bone fragility syndrome
description: >-
  Calvarial doughnut lesions with bone fragility (CDL) is an autosomal dominant
  skeletal disorder caused by heterozygous variants in SGMS2, the gene for
  sphingomyelin synthase 2 (SMS2). It pairs childhood-onset osteoporosis with
  recurrent spinal and peripheral fractures against a paradoxical local finding:
  sclerotic, ring-shaped ("doughnut") lesions in the cranial bones. The
  radiological entity was described by Keats and Holt in 1969 and stayed a purely
  clinical diagnosis for fifty years, until SGMS2 was identified in 2019.
  The mechanism is not a simple enzyme deficiency, and this is the entry's central
  point. SMS2 makes sphingomyelin - the most abundant sphingolipid of the plasma
  membrane - by transferring phosphocholine from phosphatidylcholine onto
  ceramide. It is synthesised in the endoplasmic reticulum and normally trafficked
  to the plasma membrane, where it does its work. The disease alleles fall into two
  classes with opposite biochemistry but a shared consequence, and the biochemically
  MILDER class is clinically the SEVERER one. The recurrent nonsense allele
  p.Arg50* yields a catalytically inactive enzyme; the missense alleles p.Ile62Ser
  and p.Met64Arg yield a FUNCTIONAL enzyme that is retained in the ER, and they
  actually increase the rate of de novo sphingomyelin production - yet they cause
  neonatal fractures, severe short stature and spondylometaphyseal dysplasia, while
  p.Arg50* carriers usually have osteoporosis with normal growth. The unifying
  reading is that what matters is sphingomyelin synthesised in the RIGHT PLACE:
  both allele classes misdirect SMS2 away from the plasma membrane, and it is the
  loss of plasma-membrane sphingomyelin and its asymmetry, not the total amount of
  sphingomyelin made, that breaks bone mineralization.
  The bone lesion has been characterised in unusual depth. Transiliac biopsies show
  normal bone turnover and normal osteoclast function but a specific defect of
  matrix mineralization - thin osteoid with a greatly prolonged mineralization lag
  time, low and heterogeneous matrix mineral, chaotically arranged collagen fibrils,
  and grossly abnormal osteocyte lacunae with a disrupted canalicular network. The
  disease also has an under-explained neurological arm: recurrent peripheral facial
  and other cranial nerve palsies, plus ocular findings, in a substantial minority
  of patients.
parents:
- hereditary disease
- Skeletal Dysplasia
- Bone Fragility Disorder
synonyms:
- CDL
- calvarial doughnut lesions with bone fragility
- calvarial doughnut lesions with bone fragility with or without spondylometaphyseal dysplasia
- doughnut lesions of skull, familial
- familial doughnut lesions of skull
- osteoporosis with calvarial doughnut lesions
- OP-CDL
- SGMS2-related osteoporosis
notes: >-
  Nosology. In the current classification of skeletal disorders CDL is grouped
  with osteogenesis imperfecta among the bone fragility disorders, and the
  differential in practice is OI - the French-Canadian proband carried a working
  diagnosis of OI type I for years and was offered four sequential gene panels
  before SGMS2 was found. The distinguishing feature is the cranial sclerotic
  lesion, which OI does not produce.

  Allele-severity inversion. The nonsense allele is the mild one and the missense
  alleles are the severe ones. Anyone reasoning from a loss-of-function default
  will get the genotype-phenotype prediction backwards here, which is why the
  description states it explicitly rather than leaving it to be inferred from the
  subtype blocks.

  Naming. The MONDO label is "calvarial doughnut lesions-bone fragility syndrome";
  the literature more often writes "calvarial doughnut lesions with bone fragility
  (CDL)" or "osteoporosis with calvarial doughnut lesions (OP-CDL)". OMIM #126550.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous SGMS2 variants transmitted dominantly, with documented segregation
    over as many as six generations in one family. Expressivity is markedly
    variable both between and within families carrying the identical recurrent
    allele, and penetrance of individual features (cranial lesions, nerve palsies)
    is incomplete.
  evidence:
  - reference: PMID:34504906
    reference_title: Calvarial doughnut lesions with bone fragility in a French-Canadian family; case report and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These reports further confirm the genetic basis of CDL, the recurrence of the same variant (p.Arg50*) in individuals of the same ancestry, and the variable penetrance of some of the clinical findings."
    explanation: Documents dominant transmission, the recurrent allele, and the variable penetrance recorded in this block.
  - reference: PMID:37175737
    reference_title: Clinical and Genetic Characteristics of Calvarial Doughnut Lesions with Bone Fragility in Three Families with a Reccurent SGMS2 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results show wide interfamilial and intrafamilial phenotypic variability in patients with a detected recurrent variant in the SGMS2 gene, the presence of which must be taken into consideration in the diagnosis of the disease."
    explanation: Establishes that variability is not explained by allele identity, since it occurs within families sharing one recurrent variant.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirteen affected subjects in six families in the 2019 discovery series; a
    2023 report counted 15 patients from eight families in the literature and
    added 11 more from three families. No population prevalence estimate exists.
  evidence:
  - reference: PMID:37175737
    reference_title: Clinical and Genetic Characteristics of Calvarial Doughnut Lesions with Bone Fragility in Three Families with a Reccurent SGMS2 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 15 patients from eight families with CDL with bone fragility have been described in the literature, and a recurrent variant c.148C>T (p.Arg50Ter) in the SGMS2 gene has been identified, which was found in patients from six families."
    explanation: Gives the published case count and the dominance of the recurrent allele among reported families.
has_subtypes:
- name: CDL-Osteoporosis
  display_name: Osteoporosis with calvarial doughnut lesions (p.Arg50* class)
  description: >-
    The commoner and milder pole, caused by the recurrent nonsense allele
    c.148C>T (p.Arg50*), which produces a catalytically inactive enzyme.
    Childhood-onset osteoporosis with spinal and peripheral fractures, with or
    without cranial sclerosis, and generally normal growth.
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects with p.Arg50* presented with childhood-onset osteoporosis with or without cranial sclerosis."
    explanation: Defines the milder subtype and ties it to the recurrent nonsense allele.
- name: CDL-SMD
  display_name: CDL with spondylometaphyseal dysplasia (p.Ile62Ser / p.Met64Arg class)
  description: >-
    The severe pole, caused by the missense alleles c.185T>G (p.Ile62Ser) and
    c.191T>G (p.Met64Arg), which retain catalytic activity but are trapped in the
    endoplasmic reticulum. Neonatal fractures, severe short stature, marked
    cranial sclerosis and spondylometaphyseal dysplasia.
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with p.Ile62Ser or p.Met64Arg had a more severe presentation, with neonatal fractures, severe short stature, and spondylometaphyseal dysplasia."
    explanation: Defines the severe subtype and ties it to the two missense alleles.
pathophysiology:
- name: Heterozygous SGMS2 Variants
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a heterozygous variant in SGMS2 on chromosome 4,
    encoding sphingomyelin synthase 2. The published allelic series was for years
    only three variants - the recurrent nonsense c.148C>T (p.Arg50*) and two
    missense alleles at adjacent residues, c.185T>G (p.Ile62Ser) and c.191T>G
    (p.Met64Arg) - which is a remarkably tight series for a dominant skeletal
    disease and is what made the allele-class comparison below possible. A
    frameshift allele with a high-bone-mass presentation has since been reported.
    SGMS2 is prominently expressed in cortical bone.
  genes:
  - preferred_term: SGMS2
    term:
      id: hgnc:28395
      label: SGMS2
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all the families, we identified a heterozygous variant in SGMS2, a gene prominently expressed in cortical bone and encoding the plasma membrane-resident sphingomyelin synthase SMS2."
    explanation: The discovery finding, establishing the gene, its heterozygous dominant action, its bone expression, and the normal plasma-membrane residence of its product.
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four unrelated families shared the same nonsense variant, c.148C>T (p.Arg50*), whereas the other families had a missense variant, c.185T>G (p.Ile62Ser) or c.191T>G (p.Met64Arg)."
    explanation: Names the three founding alleles and the two allele classes the mechanism turns on.
  downstream:
  - target: Mislocalisation of SMS2 Away from the Plasma Membrane
    causal_link_type: DIRECT
    description: >-
      Both allele classes displace SMS2 from its normal plasma-membrane site of
      action, by different routes.
- name: Mislocalisation of SMS2 Away from the Plasma Membrane
  biological_scale: MOLECULAR
  description: >-
    The convergence point, and the reason two biochemically opposite allele classes
    cause one disease. Normal SMS2 is made in the ER and trafficked to the plasma
    membrane, where it synthesises sphingomyelin and maintains membrane lipid
    asymmetry. The missense alleles hold a catalytically competent SMS2 in the ER
    by blocking its export; the p.Arg50* product is reported to be dislocated into
    the cis/medial-Golgi. In both cases sphingomyelin synthesis is misdirected away
    from the plasma membrane. The striking corollary is that the missense alleles
    INCREASE total de novo sphingomyelin production while causing the more severe
    disease, which rules out a simple sphingomyelin-deficiency model.
  genes:
  - preferred_term: SGMS2
    term:
      id: hgnc:28395
      label: SGMS2
  molecular_functions:
  - preferred_term: sphingomyelin synthase activity
    modifier: ABNORMAL
    term:
      id: GO:0033188
      label: sphingomyelin synthase activity
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    modifier: DECREASED
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While the p.Arg50* mutation yielded a catalytically inactive enzyme, p.Ile62Ser and p.Met64Arg each enhanced the rate of de novo sphingomyelin production by blocking export of a functional enzyme from the endoplasmic reticulum."
    explanation: The functional experiment establishing the two allele classes and, crucially, that the severe alleles increase rather than decrease sphingomyelin synthesis.
  - reference: PMID:40978119
    reference_title: Transcriptomic and lipidomic profiling provide novel insight into the pathogenesis of monogenic SGMS2-related osteoporosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The missense variants uphold SMS2 in the ER, while the p.Arg50* variant dislocates SMS2 into the cis/medial-Golgi."
    explanation: States the specific mislocalisation destination for each allele class, which is what makes mislocalisation rather than activity the shared lesion.
  - reference: PMID:40978119
    reference_title: Transcriptomic and lipidomic profiling provide novel insight into the pathogenesis of monogenic SGMS2-related osteoporosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, SGMS2 variants affect the cellular localization of SMS2 resulting in misdirected SM synthesis and disruption of plasma membrane SM asymmetry."
    explanation: Names the two proximate consequences - misdirected synthesis and loss of plasma-membrane asymmetry - that this node asserts.
  - reference: PMID:36102623
    reference_title: Pathogenic variants of sphingomyelin synthase SMS2 disrupt lipid landscapes in the secretory pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that SMS2 variants linked to the most severe bone phenotypes retain full enzymatic activity but fail to leave the ER owing to a defective autonomous ER export signal"
    explanation: >-
      The dedicated mechanistic study, and the primary source for this node's
      central claim: the severe alleles are fully active and the lesion is a
      defective ER export signal, not a loss of catalysis.
  - reference: PMID:36102623
    reference_title: Pathogenic variants of sphingomyelin synthase SMS2 disrupt lipid landscapes in the secretory pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells harboring pathogenic SMS2 variants accumulate sphingomyelin in the ER and display a disrupted transbilayer sphingomyelin asymmetry."
    explanation: Demonstrates the two lipid consequences - ectopic ER sphingomyelin and loss of transbilayer asymmetry - that follow from the export failure.
  downstream:
  - target: Disrupted Secretory-Pathway Lipid Landscape
    causal_link_type: DIRECT
    description: >-
      Sphingomyelin made in the wrong compartment perturbs the sphingomyelin/sterol
      gradient that organises the whole secretory pathway.
  - target: Defective Bone Matrix Mineralization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of plasma-membrane sphingomyelin impairs mineralization. The steps
      between the membrane lipid defect and the mineral defect are not established.
- name: Disrupted Secretory-Pathway Lipid Landscape
  biological_scale: CELLULAR
  description: >-
    The step that converts a mislocalised enzyme into a cell-biological defect.
    Sphingomyelin made in the trans-Golgi normally traps ER-synthesised cholesterol
    and builds a sphingomyelin/sterol gradient along the secretory pathway - a
    gradient that marks the physical transition in membrane properties defining
    organelle identity. Pathogenic SMS2 makes sphingomyelin in the ER instead, and
    the consequence is not confined to sphingomyelin: cholesterol organisation,
    glycerophospholipid profiles and membrane lipid order are all disturbed, in
    patient-derived fibroblasts as well as in engineered cells. The authors'
    proposal is that osteogenic cells cannot sustain the non-random lipid
    distributions their bone-forming activity requires.
  biological_processes:
  - preferred_term: sphingomyelin biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0006686
      label: sphingomyelin biosynthetic process
  mechanism_confidence: ESTABLISHED
  notes: >-
    The final inferential step - from disturbed lipid landscape to failed
    mineralization - is explicitly a postulate in the source, not a demonstration.
    The wording of the evidence explanation preserves that.
  evidence:
  - reference: PMID:36102623
    reference_title: Pathogenic variants of sphingomyelin synthase SMS2 disrupt lipid landscapes in the secretory pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These aberrant sphingomyelin distributions also occur in patient-derived fibroblasts and are accompanied by imbalances in cholesterol organization, glycerophospholipid profiles, and lipid order in the secretory pathway."
    explanation: >-
      Establishes that the lipid disturbance extends beyond sphingomyelin and is
      present in patient material, not only in engineered cell systems.
  - reference: PMID:36102623
    reference_title: Pathogenic variants of sphingomyelin synthase SMS2 disrupt lipid landscapes in the secretory pathway.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "We postulate that pathogenic SMS2 variants undermine the capacity of osteogenic cells to uphold nonrandom lipid distributions that are critical for their bone forming activity."
    explanation: >-
      Graded PARTIAL and quoted for its hedge. The authors postulate the link to
      bone-forming activity rather than demonstrate it, and this entry does not
      upgrade their claim.
  downstream:
  - target: Defective Bone Matrix Mineralization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How a disturbed membrane lipid landscape translates into a prolonged
      mineralization lag time is not established.
- name: Defective Bone Matrix Mineralization
  biological_scale: TISSUE
  description: >-
    The core skeletal lesion, and it is a MATERIAL defect rather than a turnover
    defect. Transiliac biopsies from two adult p.Arg50* carriers showed largely
    normal structural and turnover histomorphometry, but reduced osteoid thickness
    and mineralizing surface with increased osteoid surface - giving a greatly
    prolonged mineralization lag time - and low, heterogeneous matrix mineral on
    quantitative backscattered electron imaging, with collagen fibrils chaotically
    arranged under polarised light. Bone is being made at a normal rate and then
    mineralised badly.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: bone mineralization
    modifier: DECREASED
    term:
      id: GO:0030282
      label: bone mineralization
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone biopsies showed markedly altered bone material characteristics, including defective bone mineralization."
    explanation: The discovery cohort's biopsy finding of a bone material and mineralization defect.
  - reference: PMID:34761145
    reference_title: Abnormal Bone Tissue Organization and Osteocyte Lacunocanalicular Network in Early-Onset Osteoporosis Due to SGMS2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "qBEI showed low and heterogeneous matrix mineralization (CaPeak -2.41 SD, -3.72 SD; CaWidth +7.47 SD, +4.41 SD) with a chaotic arrangement of collagenous fibrils under polarized light."
    explanation: Quantifies the mineral defect and the collagen disorganisation by qBEI and polarised light microscopy.
  - reference: PMID:34761145
    reference_title: Abnormal Bone Tissue Organization and Osteocyte Lacunocanalicular Network in Early-Onset Osteoporosis Due to SGMS2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone histomorphometry portrayed largely normal values for structural and turnover parameters, but in both patient 1 and patient 2, respectively, osteoid thickness (-1.80 SD, -1.37 SD) and mineralizing surface (-1.03 SD, -2.73 SD) were reduced and osteoid surface increased (+9.03 SD, +0.98 SD), leading to elevated mineralization lag time (+8.16 SD, +4.10 SD)."
    explanation: The histomorphometric result showing normal turnover with a specifically prolonged mineralization lag time - the finding that makes this a material rather than a remodelling defect.
  downstream:
  - target: Bone Fragility and Fractures
    causal_link_type: DIRECT
    description: >-
      Poorly and heterogeneously mineralised matrix with disordered collagen is
      mechanically weak.
- name: Osteocyte Lacunocanalicular Network Disruption
  biological_scale: CELLULAR
  description: >-
    A second, independent tissue lesion. Osteocyte lacunae are abnormally large
    and round, and the canalicular network is severely disturbed, with short
    canaliculi lacking orderliness or continuity. This matters because the
    lacunocanalicular network is how bone senses mechanical load and coordinates
    remodelling; a plasma-membrane lipid defect impairing the formation of these
    fine cell processes is a mechanistically coherent - though not directly
    demonstrated - explanation.
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  mechanism_confidence: PROVISIONAL
  notes: >-
    Two limits on this node. It rests on transiliac biopsies from exactly two
    adult males, both carrying the same p.Arg50* allele, so it is not established
    for the missense class. And the link from plasma-membrane sphingomyelin to
    canalicular architecture is a proposal about membrane-shaping requirements,
    not a measured pathway.
  evidence:
  - reference: PMID:34761145
    reference_title: Abnormal Bone Tissue Organization and Osteocyte Lacunocanalicular Network in Early-Onset Osteoporosis Due to SGMS2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Last, osteocyte lacunae appeared abnormally large and round in shape and the canalicular network severely disturbed with short-spanned canaliculi lacking any orderliness or continuity."
    explanation: The direct microscopic observation of the lacunocanalicular defect.
  - reference: PMID:34761145
    reference_title: Abnormal Bone Tissue Organization and Osteocyte Lacunocanalicular Network in Early-Onset Osteoporosis Due to SGMS2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these data underline a central role for functional SMS2 in bone matrix organization and mineralization, lacunocanalicular network, and in maintaining skeletal strength and integrity."
    explanation: The authors' own synthesis linking SMS2 function to the three tissue-level defects this entry models.
  downstream:
  - target: Bone Fragility and Fractures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A disordered osteocyte network degrades bone quality independently of matrix
      mineral content.
- name: Preserved Osteoclast Function
  biological_scale: CELLULAR
  description: >-
    A deliberate negative node. Bone volume is reduced and the histology could
    superficially suggest increased resorption, but osteoclast formation and
    function in vitro were normal, and functional analysis found no difference in
    osteoclast morphology or resorptive capacity. This is what excludes the
    high-resorption model that would otherwise be the default reading of an
    osteoporosis phenotype - and it has a direct therapeutic implication, since
    antiresorptives are the standard osteoporosis drugs.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Osteoclast formation and function in vitro was normal."
    explanation: The negative result excluding an osteoclast-driven mechanism.
  - reference: PMID:40978119
    reference_title: Transcriptomic and lipidomic profiling provide novel insight into the pathogenesis of monogenic SGMS2-related osteoporosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although these findings suggest increased osteoclast numbers, functional analysis found no differences in osteoclast morphology or resorptive capacity."
    explanation: States explicitly that the histological appearance suggests increased osteoclasts but function is normal, which is why this node exists.
- name: Bone Fragility and Fractures
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: low bone mineral density with recurrent low-trauma
    spinal and peripheral fractures from childhood, ranging from vertebral
    compression fractures to dozens of long-bone fractures over a lifetime. The
    fracture burden can be extreme - one proband had sustained about 40 fractures
    by age 29.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34761145
    reference_title: Abnormal Bone Tissue Organization and Osteocyte Lacunocanalicular Network in Early-Onset Osteoporosis Due to SGMS2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease manifests as early-onset osteoporosis or a more severe skeletal dysplasia with low bone mineral density, frequent fractures, long-bone deformities, and multiple sclerotic cranial lesions."
    explanation: States the clinical fragility phenotype and its severity range.
- name: Calvarial Sclerotic Doughnut Lesions
  biological_scale: TISSUE
  description: >-
    The pathognomonic finding and the entry's most conspicuous unexplained
    feature: discrete ring-shaped sclerotic lesions in the cranial bones,
    coexisting with generalised low bone mineral density elsewhere. A disease that
    under-mineralises the skeleton produces focal HYPER-sclerosis in the calvaria,
    and no mechanism has been proposed for that inversion. The lesions are what
    distinguish CDL from other primary osteoporoses, including osteogenesis
    imperfecta.
  mechanism_confidence: PROVISIONAL
  notes: >-
    Modelled as a node with no incoming causal edge from the mineralization
    branch, because asserting one would claim a mechanism that does not exist in
    the literature. The lesions are also not fully penetrant and can appear over
    time - one severely affected boy had normal skull radiographs at birth and
    developed progressive severe cranial sclerosis - so they are a developing
    feature rather than a congenital one.
  evidence:
  - reference: PMID:34761145
    reference_title: Abnormal Bone Tissue Organization and Osteocyte Lacunocanalicular Network in Early-Onset Osteoporosis Due to SGMS2 Mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cranial sclerotic, circular lesions differentiate this skeletal disorder from other types of primary osteoporosis."
    explanation: Establishes the cranial lesions as the discriminating feature of the entity.
  - reference: PMID:34504906
    reference_title: Calvarial doughnut lesions with bone fragility in a French-Canadian family; case report and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Calvarial Doughnut Lesions with Bone Fragility (CDL) is an autosomal dominant genetic disease, characterized by low bone mineral density, multiple fractures starting in childhood, and sclerotic doughnut-shaped lesions in the cranial bones."
    explanation: States the coexistence of generalised low BMD with focal cranial sclerosis that this node records as unexplained.
- name: Cranial Neuropathy
  biological_scale: ORGANISM
  description: >-
    Recurrent transient peripheral facial nerve palsy is the commonest, together
    with trochlear, oculomotor and abducens palsies, transient diplopia and ptosis
    in individual patients. Two candidate explanations exist and have not been
    separated: mechanical compression of nerves in sclerotic cranial foramina, or
    a primary effect of disordered sphingomyelin metabolism on nerve or myelin -
    sphingomyelin being a major myelin lipid. A transcriptomic study found the
    differentially expressed genes enriched for neurological as well as skeletal
    processes and suggested an effect on neuron-supporting cells, which favours
    but does not establish the second.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several subjects had experienced peripheral facial nerve palsy or other neurological manifestations."
    explanation: Establishes the cranial neuropathy as part of the phenotype in the discovery cohort.
  - reference: PMID:40978119
    reference_title: Transcriptomic and lipidomic profiling provide novel insight into the pathogenesis of monogenic SGMS2-related osteoporosis.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These findings suggest that SGMS2 variants modulate circadian rhythm and gap junction assembly, adversely affecting bone health and homeostasis, and may affect neuron-supporting cells in SGMS2-related osteoporosis."
    explanation: >-
      Graded PARTIAL and cited for the hedge it contains - the authors say "may
      affect", from fibroblast transcriptomics rather than nerve tissue, so it
      supports a neural arm as a hypothesis and not as a demonstrated mechanism.
  - reference: PMID:37886644
    reference_title: SGMS2 in primary osteoporosis with facial nerve palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "several patients experience neurological symptoms, the most frequent being transitory, spontaneously resolving, and recurrent cranial nerve palsies"
    explanation: >-
      Characterises the palsies as transient, self-resolving and recurrent - the
      temporal profile this entry argues fits a conduction or lipid mechanism
      better than progressive foraminal compression.

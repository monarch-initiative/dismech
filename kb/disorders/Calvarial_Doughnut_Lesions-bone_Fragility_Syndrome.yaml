treatments:
- name: Bisphosphonate Therapy
  description: >-
    Bisphosphonates are the treatment actually used - pamidronate and alendronate
    in the French-Canadian proband from childhood, pamidronate courses in several
    of the discovery families and in the Belarusian kindred, with reported
    improvement in back pain, quality of life, bone mineral density, and in some
    patients cessation of further long-bone fractures.
    There is a mechanistic tension worth stating: bisphosphonates are
    ANTIRESORPTIVE, and osteoclast function in this disease was measured and found
    normal. So the drug is not correcting the demonstrated lesion, which is
    defective matrix mineralization on a normal-turnover background. The reported
    benefits are real but come from uncontrolled clinical observation in small
    families, not from a trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
    - preferred_term: alendronic acid
      term:
        id: CHEBI:2567
        label: alendronic acid
  target_mechanisms:
  - target: Bone Fragility and Fractures
    description: >-
      Treatment is directed at the fracture endpoint rather than at the
      mineralization defect that produces it.
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Bisphosphonate treatment resulted in notable improvement in back pain and quality of life."
    explanation: >-
      Reports symptomatic benefit in one family of the discovery cohort. Graded
      PARTIAL because it is uncontrolled clinical observation in a single patient
      within a case series, reporting symptoms rather than fracture rate.
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Bisphosphonate treatment was commenced at 2.6 years because of a radius fracture, lower limb bowing, and platyspondyly and discontinued at age 6 years; no new fractures have occurred thereafter."
    explanation: >-
      A fracture-free interval after treatment in one child. Graded PARTIAL - an
      uncontrolled single-patient observation, and fracture rates in this disease
      fall with age anyway, so the comparison is confounded.
discussions:
- discussion_id: cdl_calvarial_sclerosis_unexplained
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Calvarial Sclerotic Doughnut Lesions
  prompt: >-
    Why does a disease that under-mineralises the skeleton produce focal
    HYPER-sclerotic ring lesions in the calvaria?
  rationale: >-
    The doughnut lesions are the pathognomonic feature and the reason the entity
    was recognised in 1969, yet no mechanism connects them to the demonstrated
    mineralization defect - they point the opposite way. Candidate explanations
    (a site-specific difference between intramembranous calvarial and endochondral
    long-bone ossification, a reactive response to microdamage, a local difference
    in membrane lipid requirement) have not been tested. The node is deliberately
    left without an incoming causal edge from the mineralization branch, because
    drawing one would assert a mechanism nobody has proposed.
- discussion_id: cdl_missense_severity_inversion
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Mislocalisation of SMS2 Away from the Plasma Membrane
  prompt: >-
    Why are the missense alleles, which retain and even increase catalytic
    activity, more severe than the catalytically dead nonsense allele?
  rationale: >-
    This inverts the usual dose-response intuition and is the single most
    informative fact in the entry. The proposed reading - that ER-retained active
    SMS2 does harm beyond what simply losing the enzyme does, whether by consuming
    ceramide in the wrong compartment, generating diacylglycerol where it should
    not be, or acting as a dominant-negative on trafficking - has not been
    distinguished experimentally. Distinguishing them matters therapeutically: a
    substrate or enzyme-replacement strategy would help one model and worsen the
    other.
- discussion_id: cdl_neuropathy_compressive_vs_lipid
  kind: OPEN_QUESTION
  attaches_to:
  - pathophysiology#Cranial Neuropathy
  prompt: >-
    Are the recurrent cranial nerve palsies caused by compression at sclerotic
    cranial foramina, or by a primary sphingomyelin defect in nerve or myelin?
  rationale: >-
    Both are plausible and they predict different management. Compression would
    make the palsies a mechanical consequence of the calvarial lesions and
    potentially surgically addressable; a primary lipid effect on
    neuron-supporting cells would make them an independent arm of the disease.
    The transient, recurrent, fully recovering character of the palsies fits a
    lipid or conduction mechanism better than progressive compression, and one
    patient with palsies had no reported cranial sclerosis - but no study has
    imaged the foramina during an episode.
- discussion_id: cdl_bisphosphonate_mechanism_mismatch
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Bisphosphonate Therapy
  prompt: >-
    Are antiresorptives the right drug class for a disease with normal osteoclast
    function and a primary matrix mineralization defect?
  rationale: >-
    Osteoclast formation, morphology and resorptive capacity were all measured and
    found normal, and histomorphometry showed normal turnover. Bisphosphonates
    nonetheless are what patients receive, by analogy with osteoporosis generally,
    and uncontrolled reports describe benefit. Whether that benefit reflects a real
    effect on this mechanism, a nonspecific density gain, or the natural fall in
    fracture rate with age is untested. A bisphosphonate that further slows
    mineralization is at least mechanistically conceivable in a disease whose
    lesion is a prolonged mineralization lag time.
- discussion_id: cdl_mouse_isoform_divergence
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Defective Bone Matrix Mineralization
  prompt: >-
    Why does Sgms2 loss cause a skeletal disease in humans but no bone phenotype in
    the mouse null?
  rationale: >-
    Sms2-deficient mice have no apparent bone abnormality; the murine bone-formation
    deficit requires additional osteoblast-specific Sms1 deletion, so SMS1 appears
    to be the limiting isoform in mouse osteoblasts while SGMS2 is the disease gene
    in humans. This is the reason CDL has no mouse model and drove the move to
    zebrafish. There is a second reading that is at least as likely and is more
    useful: since the SEVERE human alleles retain full enzymatic activity and act by
    ER retention, they may be dominant and gain-of-mislocalisation rather than loss
    of function - in which case a mouse null models the wrong lesion entirely, and
    the informative experiment is a knock-in of p.Ile62Ser or p.Met64Arg, which has
    not been reported.
  proposed_experiments:
  - experiment_id: cdl_sgms2_missense_knockin_mouse
    name: Knock-in mouse carrying a human SGMS2 severe missense allele
    description: >-
      Generate a mouse carrying the orthologous p.Ile62Ser or p.Met64Arg
      substitution rather than an Sgms2 null, and assess bone mass, mineral
      apposition rate, matrix mineralization and osteocyte canalicular
      architecture against wild-type and Sgms2-null littermates.
    would_support:
    - pathophysiology#Mislocalisation of SMS2 Away from the Plasma Membrane
    supporting_outcome:
    - >-
      A skeletal phenotype in the missense knock-in that is absent in the
      Sgms2-null littermates, establishing the lesion as mislocalisation rather
      than loss of enzyme.
    would_refute:
    - pathophysiology#Mislocalisation of SMS2 Away from the Plasma Membrane
    refuting_outcome:
    - >-
      No skeletal phenotype in the missense knock-in either, indicating the
      species difference is in isoform dependence rather than in allele mechanism.
- discussion_id: cdl_lacunocanalicular_single_allele
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Osteocyte Lacunocanalicular Network Disruption
  prompt: >-
    Is the osteocyte lacunocanalicular defect present in the severe missense
    subtype, or only in p.Arg50* carriers?
  rationale: >-
    The lacunocanalicular finding comes from transiliac biopsies of two adult
    males, both carrying p.Arg50*. Since the two allele classes mislocalise SMS2 to
    different compartments and produce clinically opposite severities, it cannot be
    assumed the tissue lesion is the same in both. No biopsy data from a missense
    carrier has been published.
animal_models:
- name: Sms2-deficient mouse (SMS1f/f;SMS2-/-)
  species: Mouse
  genotype: SMS1-floxed, SMS2-null (SMS1f/f;SMS2-/-), without osteoblast Cre
  publication: PMID:31847800
  description: >-
    The germline Sms2-null mouse - the obvious model for a human SGMS2 disease, and
    the reason a zebrafish model had to be built instead.
  modeled_mechanisms:
  - target: Defective Bone Matrix Mineralization
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Sms2 deficiency alone does not reduce bone formation in mice. The
      bone-formation deficit appears only when Sms1 is additionally deleted in
      osteoblasts, implicating SMS1 rather than SMS2 as the isoform limiting for
      murine osteoblast differentiation.
    limitations: >-
      This is a species-level divergence in isoform dependence, and it has a
      specific consequence for how human data should be read: the human severe
      alleles are NOT nulls but ER-retained active enzyme, so a mouse null was
      arguably never the right model of the human lesion in the first place. A
      knock-in of a human missense allele has not been reported.
    evidence:
    - reference: PMID:31847800
      reference_title: Deficiency of sphingomyelin synthase 1 but not sphingomyelin synthase 2 reduces bone formation due to impaired osteoblast differentiation.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "we found that although cartilage formation is normal, Sp7-Cre;SMS1f/f;SMS2-/- mice showed reduced trabecular and cortical bone mass, had lower bone mineral density, and had a slower mineral apposition rate than control mice"
      explanation: >-
        Graded REFUTE against the Sms2-null mouse as a model of this disease. The
        bone phenotype required osteoblast Sms1 deletion on top of the Sms2-null
        background; the Sms2-null control mice, which are the direct analogue of
        the human genotype, were among the unaffected comparators.
- name: sgms2a/sgms2b CRISPR-Cas13d knockdown zebrafish
  species: Zebrafish
  genotype: sgms2a, sgms2b and sgms2a+b transient CRISPR-Cas13d knockdown
  publication: PMID:41143154
  description: >-
    Transient knockdown of the two zebrafish SGMS2 orthologues, developed
    specifically because Sgms2 knockout mice have no skeletal phenotype at all -
    the model of first resort fails for this disease.
  modeled_mechanisms:
  - target: Defective Bone Matrix Mineralization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Knockdown compromises notochord and craniofacial skeletal formation, and
      single-cell RNA sequencing localises sgms2a expression to osteogenic cells in
      juvenile calvaria, which supports a cell-autonomous skeletal role for the
      gene.
    limitations: >-
      The readout is embryonic craniofacial and notochord development, not adult
      bone matrix mineralization, so it does not model the human lesion. It is a
      transient knockdown rather than a stable genetic model, it is a
      loss-of-expression model while the severe human alleles are mislocalising
      rather than null, and the authors describe the models explicitly as
      preliminary platforms.
    evidence:
    - reference: PMID:41143154
      reference_title: Utilizing CRISPR-Cas13d-knockdown in zebrafish to study a rare monogenic bone fragility syndrome.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of sgms2a and sgms2b in zebrafish had detrimental effect on embryonic development and compromised notochord and craniofacial formation."
      explanation: The skeletal phenotype obtained, which is developmental rather than a model of adult bone fragility.
    - reference: PMID:41143154
      reference_title: Utilizing CRISPR-Cas13d-knockdown in zebrafish to study a rare monogenic bone fragility syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Single-cell RNA sequencing of juvenile WT zebrafish calvaria cells detected high sgms2a expression in osteogenic cells."
      explanation: Localises the orthologue's expression to osteogenic cells in calvaria, supporting a cell-autonomous role in the tissue the human disease affects.

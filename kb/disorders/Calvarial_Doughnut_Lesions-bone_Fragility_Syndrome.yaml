  variant_origin: GERMLINE
  notes: >-
    SGMS2 on chromosome 4 encodes sphingomyelin synthase 2. Inheritance is
    autosomal dominant through heterozygous variants. Three founding alleles
    dominate the literature: the recurrent nonsense c.148C>T (p.Arg50*), which is
    a hot spot found across most reported families and produces a catalytically
    inactive enzyme, and the missense c.185T>G (p.Ile62Ser) and c.191T>G
    (p.Met64Arg), which produce active enzyme trapped in the ER. A frameshift
    allele c.1052_1074dup has since been reported with a high-bone-mass
    presentation.

    Functional impact does not reduce to a single category, which is why it is
    described here rather than asserted in a slot: p.Arg50* is loss of function,
    while the missense alleles are better described as mislocalising - they retain
    and even increase catalytic output while acting dominantly and causing the
    more severe disease.
  evidence:
  - reference: PMID:30779713
    reference_title: Osteoporosis and skeletal dysplasia caused by pathogenic variants in SGMS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four unrelated families shared the same nonsense variant, c.148C>T (p.Arg50*), whereas the other families had a missense variant, c.185T>G (p.Ile62Ser) or c.191T>G (p.Met64Arg)."
    explanation: Names the three founding alleles recorded in this block.
  - reference: PMID:37175737
    reference_title: Clinical and Genetic Characteristics of Calvarial Doughnut Lesions with Bone Fragility in Three Families with a Reccurent SGMS2 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has thereafter been reported that about two additional families had this variant, confirming it to be the \"hot spot\" in the SGMS2 gene"
    explanation: Establishes c.148C>T as a recurrent hot spot rather than a private family allele.
  - reference: PMID:40123745
    reference_title: A novel SGMS2 mutation associated with high bone mass; description of an affected family with recurrent fragility fractures.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "He was found to have a heterozygous frameshift variant c.1052_1074dup in the SGMS2 gene."
    explanation: >-
      Adds a fourth allele class. Graded PARTIAL because it is a single case
      report and its high-bone-mass phenotype is the opposite of the established
      low-BMD presentation, so it broadens the series without being established.

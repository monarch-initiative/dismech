name: Familial Erythrocytosis 4
creation_date: "2026-10-14T15:02:40Z"
category: Mendelian
categories:
- Disorder of Oxygen Sensing
parents:
- Congenital Secondary Erythrocytosis
disease_term:
  preferred_term: erythrocytosis, familial, 4
  term:
    id: MONDO:0012729
    label: erythrocytosis, familial, 4
synonyms:
- ECYT4
- EPAS1 familial polycythemia
- HIF2A-related erythrocytosis
- erythrocytosis, familial, type 4
- familial polycythemia caused by mutation in EPAS1
description: >-
  Familial erythrocytosis 4 (ECYT4) is an autosomal dominant congenital
  secondary erythrocytosis caused by heterozygous germline gain-of-function
  missense variants in EPAS1, the gene encoding hypoxia-inducible factor 2 alpha
  (HIF-2-alpha). The reported variants cluster in exon 12, close to Pro531, the
  prolyl-hydroxyl-acceptor residue of HIF-2-alpha (for example G537W, G537R,
  M535V, M535I, M535T and P534L). In normoxia the prolyl hydroxylase domain
  protein 2 (PHD2) hydroxylates Pro531, which lets the von Hippel-Lindau protein
  recognise HIF-2-alpha and target it for proteasomal degradation; the
  erythrocytosis variants impair that hydroxylation and VHL binding, so
  HIF-2-alpha escapes degradation and is aberrantly stabilised despite adequate
  oxygen (pseudohypoxia). Stabilised HIF-2-alpha drives transcription of the
  erythropoietin gene, so serum erythropoietin is inappropriately normal or
  frankly elevated for the haemoglobin and red cell mass rises. Patients present
  at a young age with an isolated erythrocytosis: haemoglobin and haematocrit are
  raised while white cell and platelet counts are normal. Beyond the red cell
  mass, carriers are at increased risk of pulmonary hypertension and of arterial
  and venous thrombosis (stroke, infarction, pulmonary embolism). Unlike the
  somatic mosaic EPAS1 disorder Pacak-Zhuang syndrome, germline ECYT4 does not
  carry the paraganglioma/pheochromocytoma and somatostatinoma predisposition,
  and unlike Chuvash polycythemia (germline VHL) and EGLN1/PHD2-related
  erythrocytosis, the lesion here is a direct gain of function of HIF-2-alpha
  rather than loss of one of its negative regulators. Management is supportive
  (phlebotomy, low-dose aspirin/anticoagulation); HIF-2-alpha inhibition with
  belzutifan has been reported to normalise the erythrocytosis.
pathophysiology:
- name: Germline EPAS1/HIF-2-alpha Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline missense variant in EPAS1 alters a residue in or near
    the oxygen-dependent degradation domain of HIF-2-alpha, close to the
    prolyl-hydroxyl-acceptor Pro531 (reported changes include G537W, G537R, M535V,
    M535I, M535T and P534L). The variants are gain-of-function: they impair
    recognition of HIF-2-alpha by the PHD2 hydroxylase and by the von Hippel-Lindau
    protein. Functional characterisation across these alleles shows a common
    endpoint of impaired degradation despite distinct effects on PHD2 and VHL
    interaction.
  genes:
  - preferred_term: EPAS1
    term:
      id: hgnc:3374
      label: EPAS1
  molecular_functions:
  - preferred_term: HIF-2-alpha transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  downstream:
  - target: HIF-2-alpha Escape from Degradation and Stabilization
    description: >-
      Impaired Pro531 hydroxylation and VHL binding stop HIF-2-alpha being marked
      for proteasomal destruction.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18184961
    reference_title: A gain-of-function mutation in the HIF2A gene in familial erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a family with erythrocytosis and a mutation in the HIF2A gene, which encodes the HIF-2alpha protein"
    explanation: >-
      The sentinel report identifying a germline HIF2A/EPAS1 variant as the cause
      of familial erythrocytosis.
  - reference: PMID:19208626
    reference_title: Erythrocytosis-associated HIF-2alpha mutations demonstrate a critical role for residues C-terminal to the hydroxylacceptor proline.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that all result in impaired degradation and thus aberrant stabilization of HIF-2alpha. However, each exhibits a distinct profile with respect to their effects on PHD2 binding and von Hippel Lindau interaction"
    explanation: >-
      Functional characterisation of G537R, M535V and P534L showing the common
      gain-of-function endpoint (impaired degradation) with allele-specific
      effects on PHD2 and VHL binding.
- name: HIF-2-alpha Escape from Degradation and Stabilization
  biological_scale: MOLECULAR
  description: >-
    HIF-2-alpha is no longer efficiently hydroxylated and ubiquitinated, so it
    accumulates and dimerises with HIF-1-beta (ARNT) at normal oxygen tension,
    activating the hypoxia transcriptional program inappropriately (pseudohypoxia).
  biological_processes:
  - preferred_term: HIF-mediated hypoxia response in normoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Inappropriate Erythropoietin Transcription
    description: >-
      Stabilised HIF-2-alpha binds the hypoxia response element of the EPO gene
      and drives its transcription.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18184961
    reference_title: A gain-of-function mutation in the HIF2A gene in familial erythrocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our functional studies indicate that this mutation leads to stabilization of the HIF-2alpha protein and suggest that wild-type HIF-2alpha regulates erythropoietin production in adults"
    explanation: >-
      Establishes that the variant stabilises HIF-2-alpha and that HIF-2-alpha is
      the physiological regulator of erythropoietin.
  - reference: PMID:39426935
    reference_title: Current views on the role of HIF-2α in the pathogenesis and syndromic presentation of pheochromocytoma and paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "HIF-2α evades steady-state hydroxylation by the prolyl hydroxylase type 2 (PHD2), which accelerates von Hippel-Lindau (VHL)-mediated proteasomal degradation. In this situation, HIF-2α is stabilized and can translocate to the nucleus"
    explanation: >-
      States the hydroxylation-escape and nuclear-translocation steps that define
      this node when an EPAS1 gain-of-function variant is present.
- name: Inappropriate Erythropoietin Transcription
  biological_scale: TISSUE
  description: >-
    HIF-2-alpha drives EPO gene transcription in the EPO-producing renal
    interstitial cells, so erythropoietin output is inappropriate for the
    prevailing haemoglobin. Across reported carriers the serum erythropoietin is
    inappropriately normal to frankly elevated.
  cell_types:
  - preferred_term: EPO-producing kidney interstitial fibroblast
    term:
      id: CL:1000692
      label: kidney interstitial fibroblast
  biological_processes:
  - preferred_term: cellular response to hypoxia driving EPO transcription
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  downstream:
  - target: Erythroid Progenitor Expansion
    description: Raised erythropoietin signalling expands the erythroid compartment.
    causal_link_type: DIRECT
  - target: Elevated circulating erythropoietin concentration
    description: >-
      Erythropoietin is inappropriately normal to elevated for the haemoglobin.
  evidence:
  - reference: PMID:18378852
    reference_title: Novel exon 12 mutations in the HIF2A gene associated with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented at a young age with elevated serum Epo"
    explanation: >-
      Reports the inappropriately elevated erythropoietin in the HIF2A/EPAS1
      erythrocytosis cohort, the consequence of EPO transcriptional drive.
  - reference: PMID:33840141
    reference_title: Congenital erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "CE has been found to be caused by loss-of-function mutations in VHL and PHD2/EGLN1 as well as gain-of-function mutations in HIF-2α (EPAS1), all resulting in constitutive activation of EPO signaling"
    explanation: >-
      Places EPAS1 gain of function alongside VHL and EGLN1 loss of function as
      routes to the same endpoint, constitutive EPO signalling.
- name: Erythroid Progenitor Expansion
  biological_scale: TISSUE
  description: >-
    Erythropoietin-driven expansion of the erythroid compartment raises the red
    cell mass. The white cell and platelet lineages are not expanded, which
    distinguishes this secondary erythrocytosis from a myeloproliferative
    polycythemia. A cell-intrinsic contribution of HIF-2-alpha within erythroid
    progenitors has also been proposed.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: INCREASED
  downstream:
  - target: Polycythemia
    description: Erythroid expansion raises the red cell mass.
  - target: Increased circulating hemoglobin concentration
    description: Erythroid expansion raises haemoglobin.
  - target: Increased hematocrit
    description: Erythroid expansion raises haematocrit, the usual presenting abnormality.
  - target: Thromboembolism
    description: >-
      Erythrocytosis and hyperviscosity contribute to an increased risk of
      arterial and venous thrombosis.
  evidence:
  - reference: PMID:23716564
    reference_title: Congenital erythrocytosis associated with gain-of-function HIF2A gene mutations and erythropoietin levels in the normal range.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The erythroid precursors obtained from the peripheral blood of patients showed an altered phenotype, including an increased rate of growth and a modified expression of some HIF-2α target genes"
    explanation: >-
      Documents the expanded, altered erythroid progenitor phenotype in
      HIF2A/EPAS1 carriers, including a possible cell-intrinsic effect.
- name: Pulmonary Vascular Remodeling and Hypertension
  biological_scale: TISSUE
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Artery Smooth Muscle Cell Proliferation and Vasoconstriction"
  description: >-
    HIF-2-alpha dysregulation raises pulmonary vascular tone and promotes
    pulmonary vascular remodeling, producing pulmonary hypertension independent of
    the red cell mass. In humans with HIF-2-alpha gain-of-function, pulmonary
    hypertension is accompanied by increased cardiac output, heart rate and
    ventilation; in the knock-in mouse modeling the first human variant,
    pulmonary hypertension develops with high penetrance alongside the
    erythrocytosis.
  cell_types:
  - preferred_term: pulmonary artery smooth muscle cell
    term:
      id: CL:0002591
      label: smooth muscle cell of the pulmonary artery
  biological_processes:
  - preferred_term: pulmonary vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  downstream:
  - target: Pulmonary arterial hypertension
    description: Elevated pulmonary vascular tone and remodeling raise pulmonary artery pressure.
  evidence:
  - reference: PMID:21389259
    reference_title: "Cardiopulmonary function in two human disorders of the hypoxia-inducible factor (HIF) pathway: von Hippel-Lindau disease and HIF-2alpha gain-of-function mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIF-2α gain-of-function mutations were associated with pulmonary hypertension, increased cardiac output, increased heart rate, and increased pulmonary ventilation relative to metabolism"
    explanation: >-
      Direct human physiological evidence that HIF-2-alpha gain-of-function
      produces pulmonary hypertension and a hyperdynamic cardiopulmonary state.
  - reference: PMID:23640890
    reference_title: Erythrocytosis and pulmonary hypertension in a mouse model of human HIF2A gain of function mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these mice display, in a mutation dose-dependent manner, erythrocytosis and pulmonary hypertension with a high degree of penetrance"
    explanation: >-
      The G536W knock-in mouse (modeling human G537W) develops pulmonary
      hypertension with the erythrocytosis, establishing causality.

genetic:
- name: EPAS1 germline gain-of-function
  gene_term:
    preferred_term: EPAS1
    term:
      id: hgnc:3374
      label: EPAS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous germline missense variants in EPAS1 (HIF2A), clustered in exon
    12 close to the prolyl-hydroxyl-acceptor Pro531. Reported alleles include
    G537W (the first identified), G537R, M535V, M535I, M535T, P534L, and the
    more N-terminal D525G, L526F, G527K and A530S; the described causal span runs
    roughly from amino acid 525 to 537. The mechanism is gain of function: the
    variants impair PHD2-mediated hydroxylation and VHL binding, stabilising
    HIF-2-alpha. Serum erythropoietin is inappropriately normal to elevated.
  notes: >-
    Two points of granularity. Some residues (A530S, Y532C) have been reported
    both as germline variants causing erythrocytosis alone and at somatic state
    in tumours, so residue identity alone does not predict which presentation a
    carrier has. And although germline ECYT4 is characteristically
    erythrocytosis-only, one germline exon-9 variant (F374Y, inherited from the
    proband's mother) has been reported in a polycythemic patient who developed
    pheochromocytoma/paraganglioma; the reporting authors concluded the variant
    was predisposing rather than causative for the tumour, and no loss of
    heterozygosity or second somatic hit was found. No tumour phenotype is
    curated on this entry on the strength of that single case; the chromaffin
    tumour spectrum belongs to the somatic mosaic entity, Pacak-Zhuang syndrome.
  variants:
  - name: G537W
    description: >-
      The first identified ECYT4 allele (c.1609G>T), replacing the small conserved
      glycine with a bulky tryptophan in the oxygen-dependent degradation domain.
  - name: G537R
    description: Recurrent exon 12 missense variant at Gly537.
  - name: M535V
    description: Exon 12 missense variant near Pro531.
  - name: D525G
    description: >-
      One of four variants described close to Pro531 in the European EPAS1
      erythrocytosis collection, broadening the causal span N-terminally.
  - name: A530S
    description: >-
      Reported as a germline variant causing erythrocytosis alone, having
      previously been identified at somatic state in tumours.
  evidence:
  - reference: PMID:18378852
    reference_title: Novel exon 12 mutations in the HIF2A gene associated with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identify 4 additional patients with novel heterozygous Met535Val and Gly537Arg mutations"
    explanation: >-
      Reports the recurrent exon 12 EPAS1 missense variants (M535V, G537R) in an
      erythrocytosis cohort.
  - reference: PMID:36700397
    reference_title: Comprehensive in silico and functional studies for classification of EPAS1/HIF2A genetic variants identified in patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients described with a mutation in the EPAS1 gene developed erythrocytosis frequently associated with high EPO levels and are at increased risk of pulmonary hypertension and thrombotic events (thrombosis, infarction, pulmonary embolism)"
    explanation: >-
      The European collection summarising the EPAS1 germline genotype and its
      clinical consequences.
  - reference: PMID:36700397
    reference_title: Comprehensive in silico and functional studies for classification of EPAS1/HIF2A genetic variants identified in patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We described four new mutations (D525G, L526F, G527K, A530S) close to the key proline P531, which broadens the spectrum of mutations involved in erythrocytosis"
    explanation: >-
      Extends the causal variant spectrum N-terminally from the exon-12 Gly537
      cluster while keeping it adjacent to Pro531.
  - reference: PMID:36700397
    reference_title: Comprehensive in silico and functional studies for classification of EPAS1/HIF2A genetic variants identified in patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified patients with only erythrocytosis associated with germline mutations A530S and Y532C previously identified at somatic state in tumors, thereby raising the complexity of the genotype/phenotype correlations"
    explanation: >-
      Supports the notes: the same residues occur as germline erythrocytosis-only
      alleles and as somatic tumour alleles, so residue identity alone does not
      predict the presentation.
  - reference: PMID:23090011
    reference_title: A novel EPAS1/HIF2A germline mutation in a congenital polycythemia with paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now report a polycythemic patient with a novel germline HIF2A (F374Y) (exon 9) mutation, inherited from his mother, who developed PHEO/PGL. We show that this is a gain-of-function mutation"
    explanation: >-
      The single reported germline exon-9 EPAS1 gain-of-function variant, with
      transmission from a parent, in a polycythemic patient who also developed a
      chromaffin tumour.
  - reference: PMID:23090011
    reference_title: A novel EPAS1/HIF2A germline mutation in a congenital polycythemia with paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "demonstrate no loss-of-heterozygosity or additional somatic mutation of HIF2A in the tumor, indicating HIF2A (F374Y) may be predisposing rather than causative of PHEO/PGL"
    explanation: >-
      Why no tumour phenotype is curated here from that case: the authors read
      the germline variant as predisposing rather than causative, with no second
      hit demonstrated.

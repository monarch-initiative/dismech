    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hereditary erythrocytosis should be considered in longstanding erythrocytosis with a positive family history; causes include EPOR mutations (subnormal Epo), high oxygen affinity hemoglobin variants, PIEZO1 mutations, 2,3-bisphosphoglycerate deficiency, methemoglobinemia, and germline oxygen sensing pathway mutations (HIF2A-PHD2-VHL)"
    explanation: >-
      The differential within which ECYT4 sits, and the clinical features that
      prompt germline oxygen-sensing-pathway testing.
- name: Serum erythropoietin measurement
  description: >-
    Serum erythropoietin in the workup of the erythrocytosis; it is
    inappropriately normal to elevated for the haemoglobin, so a normal result
    does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: serum erythropoietin measurement
    term:
      id: NCIT:C74855
      label: Erythropoietin Measurement
  evidence:
  - reference: PMID:18378852
    reference_title: Novel exon 12 mutations in the HIF2A gene associated with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented at a young age with elevated serum Epo"
    explanation: >-
      Serum erythropoietin is the key laboratory discriminator and is elevated or
      inappropriately normal in ECYT4.
- name: Germline gene-panel sequencing
  description: >-
    EPAS1 is one of the oxygen-sensing-pathway genes (alongside VHL, EGLN1, EPOR)
    on congenital erythrocytosis gene panels; identifying the heterozygous EPAS1
    variant establishes the diagnosis.
  diagnosis_term:
    preferred_term: germline gene-panel testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27292716
    reference_title: EPAS1 p.M535T mutation in a Bulgarian family with congenital erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We applied a genetic approach including whole exome sequencing and Sanger sequencing for the identification of the causative germline mutation in a Bulgarian family with congential erythrocytosis"
    explanation: >-
      Illustrates the sequencing-based diagnosis of the causative germline EPAS1
      variant.
treatments:
- name: Therapeutic phlebotomy
  description: >-
    Phlebotomy on demand reduces the red cell mass and relieves
    hyperviscosity-related symptoms. It does not address the underlying HIF-2-alpha
    dysregulation. Current guidance positions it as symptom control rather than
    as treatment of the mechanism, and explicitly advises against cytoreductive
    therapy in this setting.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  target_mechanisms:
  - target: Erythroid Progenitor Expansion
    treatment_effect: INHIBITS
    description: >-
      Phlebotomy removes red cell mass to relieve symptoms without affecting the
      HIF-2-alpha drive.
  evidence:
  - reference: PMID:27292716
    reference_title: EPAS1 p.M535T mutation in a Bulgarian family with congenital erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "close clinical follow-up with phlebotomies on demand and regular intake of low doses of anticoagulants seem to prevent from serious complications such as thrombembolic events and pulmonary hypertension"
    explanation: >-
      Describes phlebotomy on demand as part of the supportive management of
      ECYT4 carriers.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cytoreductive therapy should be avoided. Phlebotomy should be considered for symptom control."
    explanation: >-
      Current guidance for JAK2-unmutated erythrocytosis, including the germline
      oxygen-sensing forms: phlebotomy for symptom control, and no cytoreduction.
- name: Low-dose aspirin and antithrombotic prophylaxis
  description: >-
    Low-dose aspirin or anticoagulation is used to reduce the increased arterial
    and venous thrombotic risk, by analogy with other erythrocytoses.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Thromboembolism
    treatment_effect: INHIBITS
    description: Antiplatelet/anticoagulant prophylaxis against thrombotic events.
  evidence:
  - reference: PMID:27292716
    reference_title: EPAS1 p.M535T mutation in a Bulgarian family with congenital erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "close clinical follow-up with phlebotomies on demand and regular intake of low doses of anticoagulants seem to prevent from serious complications such as thrombembolic events and pulmonary hypertension"
    explanation: >-
      Supports low-dose anticoagulation/antiplatelet prophylaxis to prevent
      thromboembolic complications in ECYT4.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cardiovascular risk optimization and low-dose aspirin are advised"
    explanation: >-
      Current guidance advising low-dose aspirin alongside cardiovascular risk
      optimisation in JAK2-unmutated erythrocytosis.
- name: HIF-2-alpha inhibition (belzutifan)
  description: >-
    HIF-2-alpha is the direct effector of the disease, so HIF-2-alpha inhibition is
    a mechanistically targeted therapy. Belzutifan, a HIF-2-alpha inhibitor, has
    been reported to normalise the haemoglobin in EPAS1-associated polycythemia
    without further phlebotomy. Carriers with a causal EPAS1 variant in the
    hydroxylation region are candidates for this treatment. The evidence is
    case-level: the 2026 management review of JAK2-unmutated erythrocytosis
    states that the role of HIF2A inhibitors remains unclear, so this is a
    mechanistically rational therapy whose place in care is not yet settled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: belzutifan
      term:
        id: CHEBI:757730
        label: belzutifan
  target_mechanisms:
  - target: HIF-2-alpha Escape from Degradation and Stabilization
    treatment_effect: INHIBITS
    description: >-
      Belzutifan blocks HIF-2-alpha, the stabilised effector driving the EPO
      transcription and erythrocytosis.
  evidence:
  - reference: PMID:40879399
    reference_title: Successful Use of Targeted HIF-2α Inhibition in EPAS1-Mutated Congenital Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The therapy has been well tolerated, and her hemoglobin was restored to normal levels without the need for additional phlebotomy"
    explanation: >-
      First reported use of belzutifan in EPAS1-associated congenital
      erythrocytosis, normalising the haemoglobin.
  - reference: PMID:36700397
    reference_title: Comprehensive in silico and functional studies for classification of EPAS1/HIF2A genetic variants identified in patients with erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all the patients carrying a causal mutation in EPAS1, located between amino acids 525 to 537, are theoretically eligible for HIF-2α inhibitor treatment"
    explanation: >-
      Supports HIF-2-alpha inhibition as a rational targeted therapy for the ECYT4
      variant spectrum.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the role of HIF2A inhibitors remains unclear"
    explanation: >-
      Supports the stated limit on this treatment: a 2026 management review holds
      the place of HIF2A inhibitors in care to be unsettled, against which the
      single case report should be read.
animal_models:
- name: Hif2a G536W knock-in mouse
  species: Mouse
  genotype: Hif2a G536W knock-in (models human HIF-2-alpha G537W)
  publication: PMID:23640890
  modeled_mechanisms:
  - target: Erythroid Progenitor Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The G536W knock-in allele, corresponding to the first human variant G537W,
      produces erythrocytosis in a mutation dose-dependent manner with high
      penetrance, formally establishing missense HIF-2-alpha variants as a cause
      of erythrocytosis.
    evidence:
    - reference: PMID:23640890
      reference_title: Erythrocytosis and pulmonary hypertension in a mouse model of human HIF2A gain of function mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings firmly establish missense mutations in HIF-2α as a cause of erythrocytosis, highlight the importance of this HIF-α isoform in erythropoiesis"
      explanation: >-
        Establishes this knock-in as a faithful model of the human erythroid
        phenotype and its genetic cause.
  - target: Pulmonary Vascular Remodeling and Hypertension
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The same knock-in mice develop pulmonary hypertension with the
      erythrocytosis, in a mutation dose-dependent manner.
    evidence:
    - reference: PMID:23640890
      reference_title: Erythrocytosis and pulmonary hypertension in a mouse model of human HIF2A gain of function mutation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "these mice display, in a mutation dose-dependent manner, erythrocytosis and pulmonary hypertension with a high degree of penetrance"
      explanation: >-
        The knock-in reproduces the pulmonary hypertension arm of the human
        disorder.

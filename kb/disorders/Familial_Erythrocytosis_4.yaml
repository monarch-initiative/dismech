- name: JAK2 mutation screening to exclude polycythemia vera
  description: >-
    The first step in an erythrocytosis workup is excluding polycythemia vera by
    JAK2 mutation screening across exons 12 to 15. A longstanding erythrocytosis
    with a positive family history is what moves a hereditary cause, including
    the oxygen-sensing-pathway genes, up the differential.

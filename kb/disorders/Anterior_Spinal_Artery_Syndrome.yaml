    explanation: The case supports symptom-directed spasticity treatment but not a general rehabilitation protocol.

discussions:
- discussion_id: asas_acute_reperfusion_strategy
  prompt: >-
    Which patients with hyperacute anterior spinal artery syndrome benefit from
    thrombolysis, spinal perfusion rescue, or other reperfusion strategies, and
    within what time window?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Cerebrospinal fluid drainage with blood-pressure augmentation in selected acute cases
  - treatments#Intravenous thrombolysis in carefully selected hyperacute occlusive ASAS
  rationale: >-
    Acute care is extrapolated from cerebral stroke, aortic-surgery prevention,
    and uncontrolled spinal cord infarction case reports. Etiologic heterogeneity
    is crucial: thrombolysis could be hazardous in aortic dissection or spinal
    hemorrhage, while CSF drainage has its own procedural risks. The record
    therefore presents these as selected, low-certainty strategies rather than
    universal treatment recommendations.
  proposed_experiments:
  - experiment_id: exp_asas_multicenter_acute_registry
    name: Prospective multicenter hyperacute ASAS treatment registry
    description: >-
      Enroll patients using standardized time-to-nadir, MRI/DWI, vascular
      etiology, contraindication, ASIA, treatment-timing, safety, and long-term
      functional-outcome fields so causal-adjusted comparisons of reperfusion
      strategies become possible despite disease rarity.
  evidence:
  - reference: PMID:26386968
    reference_title: "Systemic thrombolysis in anterior spinal artery syndrome: what has to be considered?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a lack of controlled clinical trials on acute treatment strategies in ASAS.
    explanation: This directly supports the unresolved acute-treatment evidence gap.
  - reference: PMID:39119546
    reference_title: Spinal cord ischemia - from diagnosis to treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although there are no specific guidelines regarding treatment, the
      administration of rt-PA might be an effective therapy for acute ischemic
      stroke, preventing permanent spinal dysfunction.
    explanation: This review explicitly notes the absence of specific guidelines while describing rt-PA as a possibility.

- discussion_id: asas_preclinical_secondary_injury_translation
  prompt: >-
    Which secondary ischemia-reperfusion and cell-death pathways demonstrated
    in animal spinal cord models are active, measurable, and therapeutically
    important in human anterior spinal artery syndrome?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hypoxic-ischemic spinal cord tissue injury
  rationale: >-
    Animal aortic-occlusion models consistently demonstrate gray-matter-predominant
    injury and are used to study oxidative, inflammatory, apoptotic, pyroptotic,
    and ferroptotic mechanisms. Human ASAS evidence is dominated by clinical
    phenotype and imaging, so those molecular pathways are not promoted to
    established human causal nodes without translational confirmation.
  proposed_experiments:
  - experiment_id: exp_asas_human_injury_biomarkers
    name: Human ASAS longitudinal imaging-biomarker study
    description: >-
      Collect acute and serial spinal DWI/perfusion imaging, CSF and blood
      injury/inflammation markers, treatment timing, and ASIA outcomes to test
      whether candidate secondary-injury pathways track tissue evolution and
      functional recovery in humans.
  evidence:
  - reference: DOI:10.1093/jnen/nlab084
    reference_title: Histological Findings After Aortic Cross-Clamping in Preclinical Animal Models
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Preclinical models have been developed to simulate the clinical paradigm
      to better understand the neuropathophysiology and develop therapeutic treatment.
    explanation: The systematic review explicitly identifies the mechanistic evidence base as preclinical modeling.


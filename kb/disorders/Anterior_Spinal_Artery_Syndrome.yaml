    modifier: INCREASED
    term:
      id: GO:0002931
      label: response to ischemia
  evidence:
  - reference: PMID:37456462
    reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anterior cord syndrome (ACS) occurs as a result of ischemia in the territory
      of the anterior spinal artery (ASA).
    explanation: This directly anchors the syndrome to ischemia in the anterior spinal artery territory.
  - reference: PMID:22962400
    reference_title: Thrombolysis in anterior spinal artery syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anterior spinal artery syndrome (ASAS) is often a devastating spinal stroke
      occurring when the anterior spinal artery or one of its supplying anterior
      medullary arteries are occluded.
    explanation: This clinical report supports occlusion of the artery or a supplying medullary artery as an ASAS mechanism.
  downstream:
  - target: Hypoxic-ischemic spinal cord tissue injury
    causal_link_type: DIRECT
    description: >-
      Inadequate anterior-territory perfusion directly produces hypoxic-ischemic
      stress in spinal cord tissue.
    evidence:

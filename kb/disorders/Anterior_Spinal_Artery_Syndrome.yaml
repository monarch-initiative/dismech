        presentation of an ASA stroke is paraparesis or paraplegia
      explanation: This directly supports that injury to the corticospinal tracts and anterior horns produces the paraparesis or paraplegia of ASA stroke.
  - target: Loss of pain and temperature sensation
    description: Injury to the anterolateral spinothalamic tracts produces dissociated loss of pain and temperature sensation with preserved proprioception.
    evidence:
    - reference: PMID:37456462
      reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        bilateral loss of
        pain and temperature sensation, and fecal or urinary incontinence; the
        underlying neural structures responsible for these symptoms include the
        corticospinal tracts and anterior horns, anterolateral spinothalamic tracts, and
        lateral horns, respectively.
      explanation: This directly attributes bilateral loss of pain and temperature sensation to injury of the anterolateral spinothalamic tracts.
  - target: Urinary incontinence
    description: Injury to lateral horn autonomic pathways disrupts bladder control, producing urinary incontinence.
    evidence:
    - reference: PMID:37456462
      reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

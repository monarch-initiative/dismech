review_notes: >-
  Scope was reconciled to MONDO:0006650. This entry represents ischemia or
  infarction in the anterior spinal artery distribution and remains distinct
  from the broader Spinal_Cord_Ischemia entry, which includes posterior,
  sulcal, and non-anterior territory infarcts. Fibrocartilaginous_Embolism is a
  separate etiologic disease that can produce this syndrome. Traumatic or
  compressive “anterior cord syndrome” without arterial ischemia is outside this
  MONDO scope. Cervical, thoracic, conus, complete, and incomplete presentations
  are anatomical/severity patterns rather than independently modeled MONDO
  subtypes. The 2026 re-review pruned a broad deep-research ledger to core

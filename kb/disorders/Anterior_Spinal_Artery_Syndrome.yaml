name: Anterior Spinal Artery Syndrome
creation_date: "2026-05-05T01:33:38Z"
description: >-
  Anterior spinal artery syndrome is an acute ischemic spinal cord syndrome
  caused by infarction or hypoperfusion in the anterior spinal artery
  territory, which supplies the ventral two-thirds of the cord. Injury to the
  anterior horns, corticospinal tracts, spinothalamic tracts, and lateral horns
  produces acute motor weakness or paralysis, dissociated loss of pain and
  temperature sensation with relative dorsal-column sparing, and autonomic
  dysfunction. The syndrome is a territory-defined manifestation of spinal
  cord ischemia rather than a single etiologic disease.
category: Complex
disease_term:
  preferred_term: anterior spinal artery syndrome
  term:
    id: MONDO:0006650
    label: anterior spinal artery syndrome
parents:
- Arterial disorder
synonyms:
- Anterior spinal cord infarction syndrome
- Ischemic anterior cord syndrome
- ASA syndrome

epidemiology:
- name: Rare and probably underrecognized spinal cord stroke syndrome
  description: >-
    Population incidence specific to anterior spinal artery syndrome is not
    established. Arterial spinal cord infarction is rare and probably
    underdiagnosed, while anterior/centromedullary territory involvement is the
    most common vascular pattern in clinical series.
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinal cord infarction (SCI) of arterial origin is a rare vascular event,
      and its incidence is probably underestimated.
    explanation: This human-focused review supports rarity and underrecognition without asserting an unsupported population rate.
  - reference: PMID:25398656
    reference_title: "Spinal cord ischemia: aetiology, clinical syndromes and imaging features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infarcts occurred in 38.2% at the cervical and thoracic level,
      respectively, and 49% of patients suffered from centromedullar syndrome
      caused by anterior spinal artery ischemia.
    explanation: A 55-patient series identifies anterior-spinal-artery centromedullary syndrome as the largest territory-defined subgroup.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    The syndrome can abruptly cause paraplegia or tetraplegia, sensory loss,
    sphincter dysfunction, long-term wheelchair dependence, and death. Burden
    varies with lesion level and severity at nadir, but substantial permanent
    disability is common in published spinal cord infarction cohorts.
  evidence:
  - reference: PMID:11641795
    reference_title: "Spinal cord infarction: prognosis and recovery in a series of 36 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute spinal cord ischemia syndrome has a severe prognosis with permanent
      and disabling sequelae.
    explanation: A clinical outcome series directly supports high disease burden and persistent disability.
progression:
- phase: Hyperacute ischemic presentation
  duration: Minutes to hours
  notes: >-
    Severe neurologic deficits usually reach their nadir rapidly. A slower or
    fluctuating course does not exclude infarction, but should broaden the
    differential diagnosis.
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The strongest predictor of SCI diagnosis is a clinical variable, i.e., a
      time to nadir of severe deficits < 12 h.
    explanation: The review identifies a severe-deficit nadir within 12 hours as the strongest diagnostic predictor.
- phase: Variable neurologic recovery with frequent residual disability
  duration: Months to years
  notes: >-
    Recovery is heterogeneous. Initial and nadir neurologic severity are the
    strongest prognostic indicators; anatomical level, etiology, age, and
    rehabilitation needs also shape outcome.
  evidence:
  - reference: PMID:26154150
    reference_title: Nontraumatic spinal cord ischaemic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A literature review of 11 patient series of nontraumatic SCI found that
      prognosis is primarily determined by the severity of motor or sensory
      involvement, in particular, initial and nadir ASIA A/B scores which
      strongly correlate with poor outcome.
    explanation: This review of clinical series supports severity at presentation and nadir as the dominant prognostic determinant.

pathophysiology:
- name: Aortic, arterial, or procedure-related spinal arterial supply compromise
  description: >-
    Aortic or vertebral atherosclerosis and dissection, embolic arterial
    occlusion, systemic hypoperfusion, and interruption of segmental or
    collateral supply during aortic or spine procedures can compromise inflow
    to the spinal cord. A substantial fraction of spontaneous infarcts
    nevertheless remain etiologically unexplained.
  locations:
  - preferred_term: aorta
    term:
      id: UBERON:0000947
      label: aorta
  - preferred_term: anterior spinal artery
    term:
      id: UBERON:0005431
      label: anterior spinal artery
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:25398656
    reference_title: "Spinal cord ischemia: aetiology, clinical syndromes and imaging features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aetiologies of infarcts were arteriosclerosis of the aorta and vertebral
      arteries (23.6%), aortic surgery or interventional aneurysm repair (11%)
      and aortic and vertebral artery dissection (11%), and in 23.6%, aetiology
      remained unclear.
    explanation: This clinical series quantifies major aortic/arterial and procedure-related etiologies while retaining the idiopathic fraction.
  - reference: PMID:34740806
    reference_title: A systematic review of spinal cord ischemia prevention and management after open and endovascular aortic repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many factors have been shown to increase the risk of this complication,
      including the extent of TAA repair, length of aortic and collateral
      network coverage, embolization, and reduced spinal cord perfusion pressure.
    explanation: This systematic review supports collateral-network interruption, embolization, and reduced perfusion pressure in the aortic-repair setting.
  downstream:
  - target: Anterior spinal artery territory perfusion failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Segmental or radiculomedullary arterial interruption
    - Collateral-network coverage or loss
    - Embolic or thrombotic occlusion
    - Reduced systemic or spinal cord perfusion pressure
    description: >-
      These etiologies converge on inadequate blood flow through the anterior
      spinal arterial and collateral network.
    evidence:
    - reference: PMID:34740806
      reference_title: A systematic review of spinal cord ischemia prevention and management after open and endovascular aortic repair.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Many factors have been shown to increase the risk of this complication,
        including the extent of TAA repair, length of aortic and collateral
        network coverage, embolization, and reduced spinal cord perfusion pressure.
      explanation: The review explicitly connects collateral coverage, embolization, and reduced perfusion pressure with spinal cord ischemia.

- name: Anterior spinal artery territory perfusion failure
  description: >-
    Occlusion or nonocclusive hypoperfusion in the anterior spinal artery or a
    supplying anterior medullary artery reduces delivery of oxygen and glucose
    to the ventral spinal cord. This is the common hemodynamic event that
    defines the ischemic form of anterior cord syndrome.
  locations:
  - preferred_term: anterior spinal artery
    term:
      id: UBERON:0005431
      label: anterior spinal artery
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  biological_processes:

        underlying neural structures responsible for these symptoms include the
        corticospinal tracts and anterior horns, anterolateral spinothalamic tracts, and
        lateral horns, respectively.
      explanation: This attributes fecal or urinary incontinence to injury of the lateral horn autonomic pathways.
prevalence:
- population: General population
  notes: >-
    Anterior spinal artery syndrome is the most common presentation of spinal
    cord infarction (spinal cord ischemia, SCI), which is itself a rare form of
    stroke diagnosed roughly 100 times less often than cerebral stroke. Precise
    population prevalence is not well established given the rarity and frequent
    under-recognition of the condition.
  evidence:
  - reference: PMID:39119546
    reference_title: "Spinal cord ischemia - from diagnosis to treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SCI, when compared to cerebral stroke, is a relatively rare disease, being
      diagnosed 100 times less often.
    explanation: >-
      Review of spinal cord ischemia documenting its rarity relative to cerebral
      stroke; anterior spinal artery syndrome is the predominant clinical form of SCI.

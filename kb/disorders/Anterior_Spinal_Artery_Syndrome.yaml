      reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Anterior cord syndrome (ACS) occurs as a result of ischemia in the territory
        of the anterior spinal artery (ASA).
      explanation: The syndrome definition directly links territory ischemia to cord injury.
  - target: Acute back or neck pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acute axial pain often accompanies onset, but its precise generator can
      vary with the vascular lesion, vertebral/disc context, and affected cord
      level; the graph therefore does not assert a single direct pain mechanism.
    evidence:
    - reference: PMID:30093205

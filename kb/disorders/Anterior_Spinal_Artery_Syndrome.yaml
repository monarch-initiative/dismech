      explanation: This directly supports the rapid severe-deficit trajectory.

- name: Hypoxic-ischemic spinal cord tissue injury
  description: >-
    Sustained perfusion failure initiates a hypoxic-ischemic injury cascade in
    neurons and supporting tissue. Human data establish the territory and
    clinical infarction; finer claims about oxidative stress, inflammatory cell
    death, or reperfusion injury remain derived mainly from animal models and
    are not presented here as proven human ASAS mechanisms.

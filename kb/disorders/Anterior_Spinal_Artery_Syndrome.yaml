diagnosis:
- name: Acute noncompressive myelopathy evaluated with spinal MRI and DWI
  description: >-
    Diagnosis integrates a hyperacute myelopathy, an anterior-territory motor,
    sensory, and autonomic pattern, and MRI exclusion of cord compression.
    Compatible T2 and diffusion findings strengthen the diagnosis, but early
    MRI can be incomplete or nondiagnostic and no single supportive sign is
    pathognomonic.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the lack of cord compression on Magnetic Resonance Imaging (MRI) is the
      only mandatory feature for diagnosis.
    explanation: This supports MRI exclusion of compression as the mandatory imaging criterion in the proposed diagnostic framework.
  - reference: PMID:39119546
    reference_title: Spinal cord ischemia - from diagnosis to treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging with diffusion- weighted contrast is a main
      tool with which to confirm SCI and rule out a broad spectrum of possible
      alternative diagnoses.
    explanation: This supports MRI with diffusion weighting as the main confirmatory and exclusionary imaging approach.

differential_diagnoses:
- name: Compressive myelopathy
  description: >-
    Epidural, vertebral, disc, hemorrhagic, or neoplastic compression can cause
    an acute anterior cord phenotype. Demonstrated cord compression shifts the
    diagnosis away from arterial spinal cord infarction and may require urgent
    cause-directed intervention.
  distinguishing_features:
  - Structural compression of the cord on MRI rather than a noncompressive vascular-territory lesion.
  - A mechanically explanatory lesion at the neurologic level.
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the lack of cord compression on Magnetic Resonance Imaging (MRI) is the
      only mandatory feature for diagnosis.
    explanation: The absence of compression is the mandatory diagnostic separator for spinal cord infarction in the cited framework.

- name: Inflammatory acute or subacute myelopathy
  description: >-
    Inflammatory myelitis can mimic acute spinal cord infarction. A severe
    deficit reaching nadir within hours and a compatible anterior-territory DWI
    pattern favor infarction, while slower evolution or inflammatory evidence
    should broaden the work-up; atypical infarcts still occur.
  distinguishing_features:
  - Severe neurologic nadir within 12 hours favors infarction over many inflammatory myelopathies.
  - Anterior-territory diffusion restriction supports infarction but is not universal.
  - Lack of cord compression is required for either noncompressive diagnostic pathway.
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, many cases may be misdiagnosed as other forms of acute and
      subacute myelopathies.
    explanation: The review explicitly identifies diagnostic confusion with other acute and subacute myelopathies.
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The strongest predictor of SCI diagnosis is a clinical variable, i.e., a
      time to nadir of severe deficits < 12 h.
    explanation: Rapid nadir provides a positive clinical discriminator while not excluding atypical cases.

treatments:
- name: Multimodal spinal cord ischemia prevention during high-risk aortic repair
  description: >-
    In patients undergoing descending thoracic or thoracoabdominal aortic
    repair, institutional prevention bundles may preserve collateral flow,
    stage extensive repairs, augment spinal cord perfusion, selectively drain
    cerebrospinal fluid, and maintain distal perfusion. This is prevention in a
    specific iatrogenic setting, not treatment for every spontaneous ASAS case.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  target_mechanisms:
  - target: Aortic, arterial, or procedure-related spinal arterial supply compromise
    treatment_effect: INHIBITS
    description: The bundle reduces procedural collateral loss and low spinal cord perfusion pressure.
    evidence:
    - reference: PMID:34740806
      reference_title: A systematic review of spinal cord ischemia prevention and management after open and endovascular aortic repair.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found that a multimodal approach, including a bundled institutional
        protocol, staging of multiple repairs, preservation of the collateral
        blood flow network, augmented spinal cord perfusion, selective
        cerebrospinal fluid drainage, and distal aortic perfusion during open TAA
        repairs, appears to be important in reducing the risk of SCI.
      explanation: The systematic review directly links multimodal prevention to the upstream procedural supply-compromise mechanism.
  evidence:
  - reference: PMID:34740806
    reference_title: A systematic review of spinal cord ischemia prevention and management after open and endovascular aortic repair.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that a multimodal approach, including a bundled institutional
      protocol, staging of multiple repairs, preservation of the collateral
      blood flow network, augmented spinal cord perfusion, selective
      cerebrospinal fluid drainage, and distal aortic perfusion during open TAA
      repairs, appears to be important in reducing the risk of SCI.
    explanation: This supports a bundled prevention strategy specifically for aortic-repair-associated ischemia.

- name: Cerebrospinal fluid drainage with blood-pressure augmentation in selected acute cases
  description: >-
    Lowering intrathecal pressure while augmenting mean arterial pressure can
    increase spinal cord perfusion pressure in selected acute spinal cord
    infarcts, especially after aortic or embolization procedures. Evidence
    for established ASAS is limited to small uncontrolled series and must be
    balanced against drain-related hemorrhage, infection, and procedural risk.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  target_mechanisms:
  - target: Anterior spinal artery territory perfusion failure
    treatment_effect: RESTORES
    description: CSF drainage plus MAP augmentation increases the pressure gradient driving spinal cord perfusion.
    evidence:
    - reference: PMID:30294499
      reference_title: Cerebrospinal fluid drainage and blood pressure elevation to treat acute spinal cord infarct.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lumbar cerebrospinal fluid drainage (CSFD) with blood pressure
        augmentation is utilized in the thoracic/thoracoabdominal aortic repair
        and thoracic endovascular aortic repair (TEVAR) populations to increase
        spinal perfusion pressure.
      explanation: The three-case report states the hemodynamic mechanism but does not provide controlled ASAS-specific efficacy evidence.
  evidence:
  - reference: PMID:30294499
    reference_title: Cerebrospinal fluid drainage and blood pressure elevation to treat acute spinal cord infarct.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was significant improvement in the motor examination (e.g., ASIA
      impairment scale grade B or C) to grade D utilizing both blood pressure
      augmentation and CSFD.
    explanation: Three uncontrolled acute spinal cord infarction cases improved after the combined intervention; this is low-certainty evidence.

- name: Intravenous thrombolysis in carefully selected hyperacute occlusive ASAS
  description: >-
    Intravenous thrombolysis has been reported within the cerebral-stroke time
    window after exclusion of aortic dissection, spinal hemorrhage, and other
    contraindications. It remains a candidate, not an established standard,
    because evidence consists of case reports and no controlled ASAS trials.
  treatment_term:
    preferred_term: Thrombolytic Therapy
    term:
      id: NCIT:C15338
      label: Thrombolytic Therapy
  target_mechanisms:
  - target: Anterior spinal artery territory perfusion failure
    treatment_effect: RESTORES
    description: In an occlusive mechanism, thrombolysis is intended to restore arterial perfusion before irreversible infarction.
    evidence:
    - reference: PMID:22962400
      reference_title: Thrombolysis in anterior spinal artery syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We believe thrombolysis should be considered in the acute phase of this
        condition, and present a case with ASAS who experienced partial recovery
        after treatment given 4.5 h after symptom onset.
      explanation: This is a single case and author recommendation, so it supports only candidate use rather than efficacy.
  evidence:
  - reference: PMID:26386968
    reference_title: "Systemic thrombolysis in anterior spinal artery syndrome: what has to be considered?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a lack of controlled clinical trials on acute treatment strategies in ASAS.
    explanation: This directly establishes the evidence limitation around acute thrombolysis.
  - reference: PMID:26386968
    reference_title: "Systemic thrombolysis in anterior spinal artery syndrome: what has to be considered?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemic thrombolysis seems to be justifiable in patients with ASAS after
      the rule-out of aortal dissection and spinal bleeding.
    explanation: The case report frames conditional candidate use after critical exclusions, not a guideline-level recommendation.

- name: Neurorehabilitation and symptom-directed spasticity management
  description: >-
    Rehabilitation addresses residual motor, mobility, autonomic, and daily
    living limitations. Baclofen or other symptom-directed measures may be used
    for delayed spasticity in selected survivors, but the cited ASAS evidence is
    case-level and does not establish comparative effectiveness.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Delayed spasticity and instability
    treatment_effect: MODULATES
    description: Rehabilitation and antispasticity management target chronic motor consequences rather than reversing established infarction.
    evidence:
    - reference: PMID:37456462
      reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report a case of incomplete or partial ACS presenting with delayed-onset
        spasticity and instability several months following EVAR, who was
        subsequently treated with intrathecal baclofen.
      explanation: This links intrathecal baclofen to delayed spasticity in one incomplete-ASAS case.
  evidence:
  - reference: PMID:37456462
    reference_title: Incomplete Anterior Spinal Artery Syndrome Responsive to Intrathecal Baclofen.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a case of incomplete or partial ACS presenting with delayed-onset
      spasticity and instability several months following EVAR, who was

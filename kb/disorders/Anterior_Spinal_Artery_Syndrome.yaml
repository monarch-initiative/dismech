      label: response to ischemia
  evidence:
  - reference: DOI:10.1093/jnen/nlab084
    reference_title: Histological Findings After Aortic Cross-Clamping in Preclinical Animal Models
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spinal cord ischemic injury and paralysis are devastating complications
      after open surgical repair of thoracoabdominal aortic aneurysms.
    explanation: A systematic review of preclinical aortic cross-clamping models supports ischemic cord injury while clearly limiting the evidence source to animal models.
  downstream:
  - target: Anterior gray matter and long-tract infarction
    causal_link_type: DIRECT
    description: >-
      Persistent hypoxic-ischemic injury causes tissue infarction, with marked
      vulnerability of anterior gray matter and variable white-matter tract
      involvement.
    evidence:
    - reference: DOI:10.1093/jnen/nlab084
      reference_title: Histological Findings After Aortic Cross-Clamping in Preclinical Animal Models
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our main finding is that damage is predominantly in the grey matter of
        the spinal cord, although white matter damage in the spinal cord is also
        reported.
      explanation: The systematic review supports predominant gray-matter and accompanying white-matter damage in preclinical ischemia models.


    Axial T2-weighted MRI can show paired anterior-horn hyperintensities (the
    owl-eye or snake-eye appearance). It is supportive of anterior gray-matter
    ischemia but is neither universal nor pathognomonic; the appearance has no
    dedicated validated NCIT/HP binding here.
  evidence:
  - reference: PMID:30093205
    reference_title: "Spinal Cord Infarction: Clinical and Radiological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      "owl eye" appearance on T2 axial (n = 6, 37.5%) images.
    explanation: The sign occurred in 6 of 16 anterior-territory infarcts, supporting utility without claiming universality.

- name: Diffusion restriction in the infarcted spinal cord

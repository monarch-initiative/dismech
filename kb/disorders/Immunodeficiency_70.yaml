name: Immunodeficiency 70
creation_date: "2026-09-11T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 70
  term:
    id: MONDO:0033542
    label: immunodeficiency 70
synonyms:
- IMD70
- IVNS1ABP haploinsufficiency
- NS1-BP haploinsufficiency
description: >-
  An inborn error of immunity attributed to haploinsufficiency of IVNS1ABP, which encodes
  the influenza virus NS1A-binding protein (NS1-BP), a BTB-Kelch protein that co-regulates
  mRNA splicing and nuclear export. The reported patients share severe warts and a
  distinctive naive T cell surface phenotype.

  The most important thing to say about this entry is how thin its evidence base is, and
  the entry is written around that rather than around a mechanism it cannot support.

  The gene-disease relationship rests on a single publication: a whole-genome sequencing
  study of 1,318 participants with primary immunodeficiency, in which a Bayesian
  association method flagged IVNS1ABP as a candidate. The signal is three independent
  heterozygous protein-truncating variants with none in controls, and the authors then
  did the work that turns a statistical hit into a claim - they confirmed roughly 50%
  protein, noted the gene's loss-of-function intolerance, and found a shared clinical and
  immunophenotypic picture across the three patients.

  That is a good-quality candidate-gene result. It is not a replicated disease
  description. There is no second cohort, no ClinGen gene-disease validity assertion, and
  no Orphanet record. The posterior probability of association the method itself reported
  was 0.33, which the entry records verbatim rather than paraphrasing as "supported",
  because a reader judging this evidence needs the number rather than an adjective.

  What the entry therefore does: it curates the human observations that were made, grades
  the mechanism as unestablished, and separates the rich non-disease literature on what
  NS1-BP does molecularly from the question of what its loss does to the immune system.
  No causal edge is drawn from the molecular function to the immune phenotype, because
  nobody has drawn one.

parents:
- Inborn Errors of Immunity

prevalence:
- population: UK sporadic primary immunodeficiency cohort (NIHR BioResource, 886 index cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Three patients, all from the single cohort in which the gene was identified. No
    prevalence estimate exists. The denominator is worth keeping in view: three carriers
    among 886 index cases in one national referral cohort, which is a rate within that
    cohort and not a population figure.
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BeviMed enrichment (PPA=0.33) of IVNS1ABP was driven by three independent
      heterozygous protein-truncating variants, suggesting haploinsufficiency, while no
      such variants were observed in controls
    explanation: >-
      Gives the patient count and the cohort context, and states the posterior probability
      of association, which is the number a reader needs to weigh this evidence.

pathophysiology:

- name: Heterozygous IVNS1ABP Protein-Truncating Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Three independent heterozygous protein-truncating variants, none seen in controls.
    The variants are heterozygous and the inferred mechanism is haploinsufficiency rather
    than dominant-negative action, which matters because it predicts that any truncating
    allele should behave alike.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BeviMed enrichment (PPA=0.33) of IVNS1ABP was driven by three independent
      heterozygous protein-truncating variants, suggesting haploinsufficiency, while no
      such variants were observed in controls
    explanation: >-
      The allele class and zygosity, with the case-control contrast.
  downstream:
  - target: NS1-BP Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      A truncating allele in a loss-of-function-intolerant gene halves protein dose.

- name: NS1-BP Haploinsufficiency
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    The core molecular claim, and the one part of this disease's mechanism that was
    measured rather than inferred: patient peripheral blood mononuclear cells carry about
    half the normal amount of IVNS1ABP protein. Two independent lines support treating
    this as pathogenic rather than tolerated - the direct protein measurement, and the
    gene's population-level intolerance to loss of function (pLI = 0.994).

    Note what does not follow. Halving the protein is established; which of NS1-BP's
    molecular activities becomes limiting at half dose is not, and no dose-response
    experiment has been reported.
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IVNS1ABP protein expression was around 50% of control, consistent with
      haploinsufficiency
    explanation: >-
      The direct measurement of protein dose in patient cells.
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      A pathogenic role for IVNS1ABP was supported by its intolerance to loss-of-function
      (pLI=0.994)
    explanation: >-
      Population constraint metrics are a computed prediction from reference sequencing
      data, not an observation in these patients, so this is graded COMPUTATIONAL and
      INDIRECT. It supports the haploinsufficiency interpretation by an inference step.
  downstream:
  - target: Aberrant Naive T Cell Surface Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Typed with unknown intermediates deliberately. The two observations are associated
      in three patients; no experiment connects reduced NS1-BP dose to the surface
      phenotype.
  - target: Susceptibility to Cutaneous HPV Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Likewise an association rather than a demonstrated causal chain.

- name: Aberrant Naive T Cell Surface Phenotype
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    The immunological finding shared by all three patients: low or normal CD4+ T cell and
    B cell numbers, with increased CD127 (IL-7 receptor alpha) and PD-1 on naive T cells.

    Worth reading carefully, because it is not the usual picture. The cell counts are
    essentially unremarkable - the authors say "low/normal" - so this is not a
    lymphopenia. What is abnormal is the surface phenotype of cells that are present, and
    on naive cells specifically, where raised PD-1 is not expected. The authors describe
    it as previously undescribed.
  cell_types:
  - preferred_term: naive T cell
    term:
      id: CL:0000898
      label: naive T cell
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients also shared a previously undescribed peripheral leukocyte phenotype –
      with low/normal CD4+ T cells and B cells and aberrant increased expression of CD127
      and PD-1 on naïve T cells
    explanation: >-
      The immunophenotype itself, including the authors' own hedge on cell counts
      ("low/normal") which is why this entry does not curate lymphopenia.

- name: Susceptibility to Cutaneous HPV Disease
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical convergence across the three patients, and the observation the authors
    singled out as the distinctive shared feature.

    Severe warts in an immunodeficiency point at a defect in keratinocyte-intrinsic or
    T-cell-mediated control of human papillomavirus, which is the pattern seen in several
    established inborn errors of immunity. Whether IVNS1ABP belongs in that group
    mechanistically is not established; the entry records the phenotype and the
    resemblance without asserting the mechanism.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a distinctive clinical similarity between the patients – all had severe warts
    explanation: >-
      The clinical convergence, in three of three patients.

phenotypes:

- category: Dermatologic
  name: Severe Cutaneous Warts
  frequency: OBLIGATE
  severity: SEVERE
  description: >-
    Present in all three reported patients and the feature that made them recognisable as
    a group. Graded OBLIGATE on three of three, which is a small denominator - the grading
    reflects the reported series rather than an established penetrance.
  phenotype_term:
    preferred_term: Verrucae
    term:
      id: HP:0200043
      label: Verrucae
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a distinctive clinical similarity between the patients – all had severe warts
    explanation: >-
      States the finding and that it was present in all patients.

- category: Immunologic
  name: Aberrant CD127 and PD-1 Expression on Naive T Cells
  frequency: OBLIGATE
  description: >-
    Increased CD127 and PD-1 on naive T cells, shared by all three patients and described
    by the authors as previously undescribed.

    This is bound to a broad HP term because the ontology has none for this specific
    surface-marker combination. The specificity is carried by preferred_term and by the
    description, which is the documented convention when the best available term is
    broader than the finding.
  phenotype_term:
    preferred_term: Increased CD127 and PD-1 expression on naive T cells
    term:
      id: HP:0031392
      label: Abnormal CD4+ T cell subset proportion
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aberrant increased expression of CD127 and PD-1 on naïve T cells
    explanation: >-
      The surface phenotype itself.
  notes: >-
    The binding is imperfect and is recorded as such rather than silently. HP:0031392
    describes an abnormal CD4+ T cell subset proportion; what was observed is an abnormal
    activation-marker profile on naive T cells, which is a related but distinct claim. No
    HPO term covers it. Following the ontology-term contract in CLAUDE.md, the broader
    term is bound and the precision is kept in preferred_term rather than a narrower term
    being manufactured.

genetic:

- name: IVNS1ABP
  gene_term:
    preferred_term: IVNS1ABP
    term:
      id: hgnc:16951
      label: IVNS1ABP
  relationship_type: CAUSATIVE
  notes: >-
    IVNS1ABP encodes NS1-BP, a BTB-Kelch family protein first identified through its
    interaction with the influenza A virus NS1 protein. It has an N-terminal BTB/POZ
    domain and five kelch-like tandem repeats.

    Three candidate cellular activities are described, in three separate literatures that
    have not met. Two are in mRNA processing: with hnRNP K it regulates splicing, and it
    competes with viral NS1 for the mRNA export receptor NXF1 to route transcripts out of
    the nucleus. The third is cytoskeletal - Kelch-family proteins associate with F-actin,
    and rat macrophage work links Ivns1abp to phagocytosis and to macrophage phenotype
    under inflammatory conditions.

    The third is the most immunologically plausible of the three, since actin defects are
    an established class of inborn errors of immunity, but it is also the least directly
    evidenced for this protein: the F-actin statement is a background claim about the
    Kelch family rather than a measurement of NS1-BP itself, and the functional work is in
    rat. None of the three has been connected to the patients' phenotype.

    Two cautions about how this gene's literature reads. First, most of the 31 indexed
    IVNS1ABP papers concern influenza virology or cancer biology rather than immunity, so
    a literature search on the gene symbol returns a great deal that is not about this
    disease. Second, relationship_type is recorded as CAUSATIVE because that is what the
    reporting study concludes, but the underlying evidence is a single cohort with a
    posterior probability of 0.33 plus functional follow-up. There is no ClinGen
    gene-disease validity assertion and no Orphanet record for this entity. A reader
    should weigh the relationship as a well-supported candidate rather than as an
    established one; the dismech schema has no slot in which to record that distinction,
    which is why it is stated here in prose.
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, these data implicate IVNS1ABP haploinsufficiency as a novel
      monogenic cause of PID
    explanation: >-
      The authors' own conclusion, quoted with its framing ("implicate", "novel")
      preserved rather than restated as an established fact.
  - reference: PMID:29921878
    reference_title: "Co-regulatory activity of hnRNP K and NS1-BP in influenza and human mRNA splicing."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, we show that hnRNP K and NS1-BP regulate host splicing events and that
      viral infection causes mis-splicing of some of these transcripts.
    explanation: >-
      Establishes that NS1-BP regulates host mRNA splicing, which is the best available
      candidate for what is lost at half dose. Graded NO_EVIDENCE with respect to the
      gene-disease claim deliberately: this paper is about NS1-BP's cell biology in an
      influenza context and says nothing about immunodeficiency, so it bears on what the
      protein does, not on whether its loss causes this disease.
  - reference: PMID:39384042
    reference_title: "Cellular NS1-BP protein interacts with the mRNA export receptor NXF1 to mediate nuclear export of influenza virus M mRNAs."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      NS1-BP competes with NS1 for NXF1 binding, allowing the recruitment of NXF1 to the M
      mRNAs after splicing.
    explanation: >-
      The second characterised activity, mRNA nuclear export via NXF1. Graded NO_EVIDENCE
      for the same reason as above - it is background on the protein, not evidence about
      the disease, and marking it SUPPORT would imply a mechanistic link to the immune
      phenotype that nobody has shown.
  - reference: PMID:9696811
    reference_title: "NS1-Binding protein (NS1-BP): a novel human protein that interacts with the influenza A virus nonstructural NS1 protein is relocalized in the nuclei of infected cells."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      NS1-BP contains an N-terminal BTB/POZ domain and five kelch-like tandem repeat
      elements of approximately 50 amino acids.
    explanation: >-
      The original identification of the protein, establishing the domain architecture the
      three candidate activities are attributed to. NO_EVIDENCE with respect to the
      gene-disease claim: a 1998 influenza virology paper says nothing about
      immunodeficiency.
  - reference: PMID:32943673
    reference_title: "The influenza virus NS1A binding protein gene modulates macrophages response to cytokines and phagocytic potential in inflammation."
    supports: NO_EVIDENCE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      belongs to the Kelch family of proteins that play a central role in actin
      cytoskeleton dynamics by directly associating with F-actin and by protecting against
      actin derangement.
    explanation: >-
      The third candidate activity, and the one most plausibly connected to immunity, since
      actin defects are an established class of inborn errors of immunity. Read the grading
      carefully: this sentence is a background statement in the paper's introduction
      attributing an actin role to Ivns1abp by Kelch-family membership, not a measurement
      of NS1-BP's own actin binding, and the paper's own experimental work is in rat
      macrophages. So it is INDIRECT, MODEL_ORGANISM, and NO_EVIDENCE with respect to the
      human gene-disease claim - three separate hedges, all of which apply.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous truncating variants acting through haploinsufficiency, so the expected
    mode is autosomal dominant. All three reported patients were sporadic cases within a
    cohort ascertained for non-familial disease, so segregation in families has not been
    demonstrated and the inheritance mode is inferred from zygosity and mechanism rather
    than observed.
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      three independent heterozygous protein-truncating variants, suggesting
      haploinsufficiency
    explanation: >-
      Establishes heterozygosity and the haploinsufficiency mechanism, from which the
      dominant mode follows. INDIRECT because the source reports zygosity and mechanism,
      not a pedigree.

diagnosis:

- name: Whole-Genome or Whole-Exome Sequencing
  description: >-
    There is no biochemical or functional screening test for this disease. It is found by
    sequencing, and in the only reported instance it was found by cohort-level statistical
    analysis rather than by a clinician recognising a syndrome.

    The practical consequence for a diagnostic laboratory is that a heterozygous truncating
    IVNS1ABP variant in a patient with severe warts is currently a candidate finding
    rather than a diagnosis, and should be reported as such.
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we address these challenges by performing whole-genome sequencing in a large
      PID cohort of 1,318 participants.
    explanation: >-
      The modality by which the entity was identified.

- name: Immunophenotyping of Naive T Cells
  description: >-
    Flow cytometry for CD127 and PD-1 on naive T cells is the one laboratory finding
    reported as shared across patients, so it is the natural supporting test for a
    candidate IVNS1ABP variant.

    It is not validated as a diagnostic assay. It has been measured in three patients
    against controls in one study, with no reported sensitivity, specificity or reference
    range, and the entry records it as a supporting observation rather than a test.
  evidence:
  - reference: PMID:32499645
    reference_title: "Whole-genome sequencing of a sporadic primary immunodeficiency cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aberrant increased expression of CD127 and PD-1 on naïve T cells
    explanation: >-
      The measurement this would look for.

treatments:

- name: Wart Management
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic procedure for cutaneous warts
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  description: >-
    Symptomatic management of the cutaneous HPV disease, which is the presenting problem.
    No IVNS1ABP-specific treatment data exist and no modality is recommended here on
    disease-specific grounds.
  notes: >-
    Recorded without an evidence item and with the generic therapeutic-procedure term,
    because the source reports no treatment of any kind. Naming a specific wart therapy
    would imply a disease-specific recommendation that has never been studied here.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Complicated by the state of the evidence rather than by the genetics. If the
    relationship is real and dominant, recurrence risk is 50% for an affected parent - but
    a counsellor should convey that this gene-disease relationship rests on one cohort and
    three patients, with no replication and no ClinGen validity assertion, and that
    penetrance is entirely unknown because all three patients were ascertained through
    disease.

differential_diagnoses:

- name: Other inborn errors of immunity presenting with severe warts
  description: >-
    Severe or recalcitrant warts are the presenting feature of a recognised group of
    inborn errors of immunity, and any of them is a more likely explanation than IMD70
    simply because they are established and this one is not. A patient with severe warts
    and an immunodeficiency should have those excluded before a heterozygous IVNS1ABP
    variant is treated as causal.

discussions:

- discussion_id: ivns1abp_gene_disease_validity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is IVNS1ABP haploinsufficiency an established monogenic cause of immunodeficiency, or
    a candidate association awaiting replication?
  rationale: >-
    This is the first question a reader of this entry should be able to answer, and the
    schema gives no structured way to record it, so it is recorded here.

    In favour: three independent truncating variants with none in controls, a
    loss-of-function-intolerant gene, protein measured at about half of control, and a
    shared clinical and immunophenotypic picture the authors describe as previously
    undescribed. That combination is more than a statistical hit.

    Against: one cohort, three patients, all sporadic with no family segregation, a
    reported posterior probability of 0.33, no replication cohort in the six years since,
    no ClinGen gene-disease validity assertion, and no Orphanet record. The confirmatory
    experiments establish that the variants reduce protein, not that reduced protein
    causes the phenotype.

    The gap is practical. Until it closes, a heterozygous IVNS1ABP truncating variant
    found in a diagnostic laboratory cannot be reported as diagnostic, and the recurrence
    risk quoted in counselling is conditional on a relationship that has not been
    independently confirmed.
  attaches_to:
  - genetic#IVNS1ABP
  - pathophysiology#NS1-BP Haploinsufficiency

- discussion_id: ivns1abp_molecular_to_immune_link
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which NS1-BP-dependent mRNA processing event, if any, becomes limiting at half protein
    dose and produces the naive T cell phenotype and the HPV susceptibility?
  rationale: >-
    NS1-BP has three described activities - splicing co-regulation with hnRNP K,
    NXF1-dependent mRNA export, and an F-actin association shared with the rest of the
    Kelch family - and none has been connected to the immune phenotype. The first two were
    characterised in the context of influenza infection, in cell lines, by investigators
    studying virology rather than immunity. The third comes from a rat macrophage study of
    inflammation. Three literatures, none of which cites the immunodeficiency.

    The actin route deserves the most attention despite having the weakest direct evidence,
    because actin defects are a recognised class of inborn errors of immunity - and because
    the very cohort paper that proposed IVNS1ABP also analysed ARPC1B, an actin-related
    immunodeficiency gene. If NS1-BP belongs in that class the disease has a ready-made
    mechanistic frame; the evidence for its actin role is currently a family-level
    generalisation plus rat phagocytosis data, which is not enough to curate as mechanism.

    This is why both causal edges out of the haploinsufficiency node in this entry are
    typed INDIRECT_UNKNOWN_INTERMEDIATES. It would be easy to write a plausible chain -
    NS1-BP regulates host splicing, splicing shapes lymphocyte differentiation, therefore
    a splicing defect alters naive T cells - but no step of it has been tested, and
    curating it would manufacture a mechanism.

    A concrete first step exists: transcriptome-wide splicing and export analysis of
    patient T cells against controls would say whether the characterised activities are
    even perturbed at half dose.
  attaches_to:
  - pathophysiology#NS1-BP Haploinsufficiency
  - pathophysiology#Aberrant Naive T Cell Surface Phenotype
  - pathophysiology#Susceptibility to Cutaneous HPV Disease
  proposed_experiments:
  - experiment_id: ivns1abp_patient_tcell_splicing
    name: Splicing and mRNA export profiling of patient naive T cells
    description: >-
      RNA sequencing with splice-junction and nuclear/cytoplasmic fractionation analysis
      of naive T cells from IVNS1ABP truncating-variant carriers against matched controls,
      to test whether NS1-BP's characterised activities are measurably impaired at half
      dose in the cell type that shows the phenotype.
    readouts:
    - name: Differential splice-junction usage in patient naive T cells
      target: pathophysiology#Aberrant Naive T Cell Surface Phenotype
      direction: ALTERED
      interpretation: >-
        Altered splicing of immune-relevant transcripts would give the missing first step
        of a mechanism.
    would_support:
    - pathophysiology#NS1-BP Haploinsufficiency
    supporting_outcome:
    - >-
      Reproducible mis-splicing or nuclear retention of transcripts with established roles
      in T cell differentiation or antiviral defence, absent in controls.
    would_refute:
    - pathophysiology#NS1-BP Haploinsufficiency
    refuting_outcome:
    - >-
      No detectable splicing or export abnormality in patient T cells, which would mean
      the disease mechanism is not the protein's characterised activity and would redirect
      the search.

notes: >-
  Deep research. An OpenScientist report is committed alongside this entry and was used
  as a lead-generator. Its most valuable contribution was surfacing a third candidate
  molecular activity - an F-actin association shared with the Kelch family, plus rat
  macrophage phagocytosis data - from a literature the influenza and immunodeficiency
  searches both miss. That lead was verified against its primary source before use, and
  the verification changed how it is recorded: the quoted sentence turns out to be a
  background claim about the Kelch family in a rat study rather than a measurement of
  NS1-BP itself, so it is graded INDIRECT / MODEL_ORGANISM / NO_EVIDENCE rather than as
  support for a mechanism. The report also asserts clinical detail (hypogammaglobulinemia,
  colitis, celiac disease, achalasia, retinal vasculitis, a subclinical transmitting
  mother) that traces to the source's Supplementary Note 1, which is not in the cached
  record; none of it is curated here, because none of it is quotable from what can be
  verified.

  Evidence base and how to read it. One clinical source. Every human observation in this
  entry - the three patients, the warts, the immunophenotype, the protein level, the
  inheritance inference - comes from PMID:32499645, a whole-genome sequencing cohort
  study in which IVNS1ABP was one of several candidate genes. The two other references
  describe what NS1-BP does molecularly, are graded NO_EVIDENCE with respect to the
  gene-disease claim, and are cited as background rather than as support.

  Three deliberate restraints. No lymphopenia is curated, because the source says
  "low/normal" CD4+ T cell and B cell counts and lymphopenia would overstate it. No causal
  edge runs from the molecular function to the immune phenotype, because none has been
  tested; both edges out of the haploinsufficiency node are typed
  INDIRECT_UNKNOWN_INTERMEDIATES. And the posterior probability of association (0.33) is
  quoted in an evidence snippet rather than summarised, because a reader weighing this
  entry needs the number.

  The claim issue that opened this curation described the phenotype from memory as
  "recalcitrant warts, HPV-driven skin disease, and lymphopenia". Warts are confirmed;
  lymphopenia is not, and has been corrected here and on the issue.

  Ontology limitation worth flagging. The shared immunophenotype - raised CD127 and PD-1
  on naive T cells - has no HPO term. It is bound to HP:0031392, which is broader and
  describes a different kind of abnormality, with the precision carried in preferred_term
  and the mismatch recorded in that phenotype's notes rather than left implicit.

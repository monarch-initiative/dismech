genetic:
- name: WNT4
  gene_term:
    preferred_term: WNT4
    term:
      id: hgnc:12783
      label: WNT4
  relationship_type: CAUSATIVE
  association: Heterozygous loss-of-function missense variants
  notes: >-
    Reported pathogenic alleles are E226G (index case), R83C, L12P and A233T,
    each in a single 46,XX patient and each supported by functional assays in
    OVCAR3 or other cells. No ClinGen gene-disease validity curation exists for
    WNT4 in this disease (checked against the ClinGen gene-validity download),
    so no validity tier is recorded. Biallelic WNT4 loss causes a different
    disease, SERKAL syndrome. Common WNT4 locus variants associated with
    endometriosis, uterine fibroids and gynecologic cancers are not relevant to
    this entry.
  evidence:
  - reference: PMID:15317892
    reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genetic evaluation revealed a loss-of-function mutation in the WNT4 gene."
    explanation: >-
      The founding gene-disease report.
  - reference: PMID:16959810
    reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient carried the novel R83C loss-of-function dominant negative mutation in her WNT4, confirming the role of WNT4 in the development and maintenance of the female phenotype in women."
    explanation: >-
      A second unrelated patient with the same phenotype and a different WNT4
      allele.
  - reference: PMID:18182450
    reference_title: "Identification and functional analysis of a new WNT4 gene mutation among 28 adolescent girls with primary amenorrhea and müllerian duct abnormalities: a French collaborative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This amino acid substitution is unlikely to be a polymorphism because it was not found in 100 DNAs from control subjects."
    explanation: >-
      A third allele, L12P, absent from controls.
  - reference: PMID:21377155
    reference_title: Molecular analysis of WNT4 gene in four adolescent girls with mullerian duct abnormality and hyperandrogenism (atypical Mayer-Rokitansky-Küster-Hauser syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of the WNT4 gene permitted us to identify a new mutation (p.A233T)."
    explanation: >-
      A fourth allele, A233T, in a series of 46,XX girls with Mullerian
      anomaly and hyperandrogenism.
diagnosis:
- name: WNT4 sequencing in Mullerian anomaly with hyperandrogenism
  description: >-
    WNT4 analysis is indicated in an adolescent with primary amenorrhea, an
    absent or hypoplastic uterus and clinical or biochemical hyperandrogenism.
    WNT4 screening of unselected Mullerian aplasia without androgen excess has
    a very low yield.
  evidence:
  - reference: PMID:18182450
    reference_title: "Identification and functional analysis of a new WNT4 gene mutation among 28 adolescent girls with primary amenorrhea and müllerian duct abnormalities: a French collaborative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that in adolescent girls with primary amenorrhea, müllerian duct abnormalities, and hyperandrogenism, a WNT4 mutation should be sought."
    explanation: >-
      States the clinical triad that should prompt WNT4 testing.
  - reference: PMID:22503279
    reference_title: Mutations in WNT4 are not responsible for Müllerian duct abnormalities in Chinese women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggest that WNT4 might not contribute to the aetiology of Müllerian duct abnormalities in Chinese women."
    explanation: >-
      An unselected Mullerian anomaly cohort without hyperandrogenism yielded
      no WNT4 cases.
treatments:
- name: Progressive Vaginal Dilation
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: progressive vaginal self-dilation
    term:
      id: NCIT:C93165
      label: Vaginal Dilation Therapy
  description: >-
    Non-surgical creation of a functional vagina by progressive dilation is
    the first-line approach in Mullerian agenesis, with surgical vaginoplasty
    reserved for failure or patient preference. No treatment study is
    specific to WNT4 deficiency; the recommendation is carried over from
    Mullerian agenesis in general, which shares the vaginal defect.
  target_mechanisms:
  - target: Aplasia of the Vagina
    treatment_effect: RESTORES
    description: >-
      Creates a functional vaginal canal by stretching the residual vaginal
      dimple, without correcting the developmental defect.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonsurgical vaginal elongation by dilation should be the first-line approach."
    explanation: >-
      Guideline recommendation for Mullerian agenesis, applied here because
      this disorder is a genetically defined form of Mullerian agenesis.
  - reference: PMID:28434104
    reference_title: "Mullerian dysgenesis: a critical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several non-surgical and surgical procedures have been reported for the creation of a functional neovagina; in general, non-surgical treatment should be the first initially pursued."
    explanation: >-
      A review of MRKH syndrome management reaching the same first-line
      recommendation.
- name: In Vitro Fertilization with a Gestational Carrier
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: in vitro fertilization with gestational surrogacy
    term:
      id: NCIT:C16580
      label: In Vitro Fertilization
  description: >-
    IVF with the patient's own oocytes and transfer to a gestational carrier
    is the established route to genetic parenthood in Mullerian agenesis, and
    uterus transplantation is an emerging alternative. In WNT4 deficiency the
    route depends on ovarian reserve, which may be reduced: follicle depletion
    was reported in one patient. No fertility outcomes specific to this
    disorder are published.
  target_mechanisms:
  - target: Aplasia of the Uterus
    treatment_effect: BYPASSES
    description: >-
      Bypasses the absent uterus by gestating the patient's genetic embryo in
      a carrier.
  evidence:
  - reference: PMID:29266078
    reference_title: "ACOG Committee Opinion No. 728: Müllerian Agenesis: Diagnosis, Management, And Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Assisted reproductive techniques with use of a gestational carrier (surrogate) have been shown to be successful for women with müllerian agenesis."
    explanation: >-
      Efficacy in Mullerian agenesis generally; not studied in WNT4
      deficiency specifically.
animal_models:
- name: Wnt4-null mouse
  species: Mouse
  genotype: Wnt4 homozygous null (knockout)
  publication: PMID:9989404
  description: >-
    Female Wnt4-null mice lack Mullerian ducts, retain Wolffian ducts and
    ectopically synthesize testosterone in the ovary, which is the
    combination seen in the human disease. Males are normal at birth. The
    knockout also fails to form nephrons and dies shortly after birth, so the
    adult reproductive phenotype cannot be studied in it.
  modeled_mechanisms:
  - target: Failed Mullerian Duct Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Complete absence of the Mullerian duct in female null embryos.
    limitations: >-
      The mouse is homozygous null whereas patients are heterozygous for
      missense alleles, some dominant negative; heterozygous mice are not
      reported to share the phenotype, so the model shows the requirement for
      WNT4 rather than the human dosage sensitivity.
    evidence:
    - reference: PMID:9989404
      reference_title: Female development in mammals is regulated by Wnt-4 signalling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Wnt-4-mutant females are masculinized-the Mullerian duct is absent while the Wolffian duct continues to develop."
      explanation: >-
        Reports the absent Mullerian duct in null females.
  - target: Derepressed Ovarian Androgen Biosynthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Null ovaries express testosterone biosynthetic enzymes and secrete
      testosterone into the embryonic circulation.
    limitations: >-
      Androgen excess in the mouse is fetal and is read out as Wolffian duct
      maintenance; the human phenotype is adolescent clinical
      hyperandrogenism, which the perinatal-lethal knockout cannot show.
    evidence:
    - reference: PMID:15932923
      reference_title: "The partial female to male sex reversal in Wnt-4-deficient females involves induced expression of testosterone biosynthetic genes and testosterone production, and depends on androgen action."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistent with this, the expression of several genes encoding enzymes in the pathway leading to the synthesis of testosterone in the mouse is induced in the Wnt-4-deficient ovary, including Cyp11a, Cyp17, Hsd3b1, Hsd17b1, and Hsd17b3."
      explanation: >-
        Measures the derepressed steroidogenic enzymes in the null ovary.
  - target: Impaired Nephron Tubulogenesis
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Null metanephric mesenchyme fails to form pretubular aggregates.
    limitations: >-
      The null mouse has a severe bilateral nephrogenesis defect, while the
      human disease shows at most unilateral renal agenesis in a single case;
      the model establishes the renal role of WNT4 but not that heterozygous
      human alleles act through it.
    evidence:
    - reference: PMID:7990960
      reference_title: Epithelial transformation of metanephric mesenchyme in the developing kidney regulated by Wnt-4.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking Wnt-4 activity fail to form pretubular cell aggregates; however, other aspects of mesenchymal and ureteric development are unaffected."
      explanation: >-
        Reports the tubulogenesis defect in the knockout kidney.
  evidence:
  - reference: PMID:9989404
    reference_title: Female development in mammals is regulated by Wnt-4 signalling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wnt-4 is initially required in both sexes for formation of the Mullerian duct, then Wnt-4 in the developing ovary appears to suppress the development of Leydig cells; consequently, Wnt-4-mutant females ectopically activate testosterone biosynthesis."
    explanation: >-
      Summarizes the two arms of the null phenotype that correspond to the
      human disease.
- name: Wnt4 mCherry hypomorphic mouse
  species: Mouse
  genotype: Wnt4 mCh/mCh (hypomorphic allele)
  publication: PMID:26721931
  description: >-
    A hypomorphic Wnt4 allele allows some animals to survive to adulthood.
    The Mullerian duct forms in only about 45 percent of cases, and the
    resulting reproductive tract shows a poorly coiled oviduct, no
    endometrial glands and an undifferentiated myometrium. The model shows
    that reduced rather than absent WNT4 activity can still prevent or
    distort Mullerian development, which bears on the partial-loss human
    alleles.
  modeled_mechanisms:
  - target: Failed Mullerian Duct Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Incompletely penetrant failure of Mullerian duct formation with reduced
      WNT4 dosage.
    limitations: >-
      The allele is a reporter fusion hypomorph in a homozygous state, not a
      heterozygous human missense variant, and ovarian androgen production
      was not reported.
    evidence:
    - reference: PMID:26721931
      reference_title: Wnt4 coordinates directional cell migration and extension of the Müllerian duct essential for ontogenesis of the female reproductive tract.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast to the Wnt4 null embryos, some Wnt4(monomeric cherry/monomeric cherry) (Wnt4(mCh/mCh)) hypomorphic mice survived to adulthood and formed MD in ∼45% of cases."
      explanation: >-
        Reduced Wnt4 dosage leaves Mullerian duct formation incompletely
        penetrant.
  evidence:
  - reference: PMID:26721931
    reference_title: Wnt4 coordinates directional cell migration and extension of the Müllerian duct essential for ontogenesis of the female reproductive tract.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Examination of the reproductive tract of the Wnt4(mCh/mCh) females indicated a poorly coiled oviduct, absence of the endometrial glands and an undifferentiated myometrium, and these mice were prone to develop a hydro-uterus."
    explanation: >-
      Describes the adult reproductive tract of the hypomorph.
- name: Amhr2-Cre Wnt4 and Wnt5a double conditional knockout mouse
  species: Mouse
  genotype: Wnt4 flox/flox; Wnt5a flox/flox; Amhr2-Cre
  publication: PMID:30010727
  description: >-
    Deleting Wnt4 together with Wnt5a in Mullerian duct mesenchyme causes
    partial agenesis of Mullerian derivatives in a third of females, with
    normal ovaries. It shows that WNT4 acts partly redundantly with WNT5A in
    the mesenchyme after the duct has formed.
  modeled_mechanisms:
  - target: Failed Mullerian Duct Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Partial Mullerian agenesis after combined mesenchymal loss of Wnt4 and
      Wnt5a.
    limitations: >-
      Requires loss of a second Wnt gene and acts after duct initiation, so it
      models a later and partly redundant WNT4 function rather than the
      single-gene human defect; the ovaries are normal, so the androgen arm is
      not modelled.
    evidence:
    - reference: PMID:30010727
      reference_title: Targeted ablation of Wnt4 and Wnt5a in Müllerian duct mesenchyme impedes endometrial gland development and causes partial Müllerian agenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, a third of Wnt4flox/flox; Wnt5aflox/flox; Amhr2cre/+ females had a partial agenesis of Müllerian duct-derived structures, but with normal oviducts and ovaries."
      explanation: >-
        Reports partial Mullerian agenesis in the double conditional knockout.
  evidence:
  - reference: PMID:30010727
    reference_title: Targeted ablation of Wnt4 and Wnt5a in Müllerian duct mesenchyme impedes endometrial gland development and causes partial Müllerian agenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Together, our results suggest that Wnt4 and Wnt5a play redundant roles in the development of the female reproductive tract, and may provide insight into the etiology of certain cases of Müllerian agenesis in women."
    explanation: >-
      States the redundancy conclusion and its relevance to human Mullerian
      agenesis.
differential_diagnoses:
- name: Mayer-Rokitansky-Kuster-Hauser syndrome
  disease_term:
    preferred_term: Mayer-Rokitansky-Kuster-Hauser syndrome
    term:
      id: MONDO:0017771
      label: Mayer-Rokitansky-Kuster-Hauser syndrome
  description: >-
    The closest mimic: congenital absence of the uterus and upper vagina in a
    46,XX woman with normal ovarian function, presenting as primary
    amenorrhea. Classic MRKH syndrome does not show clinical virilization, and
    WNT4 variants are not found in MRKH cohorts. Biochemical hyperandrogenemia
    alone does not separate the two, because raised androgen indices without
    clinical signs are common in MRKH syndrome. Acne or hirsutism with
    Mullerian aplasia should prompt WNT4 analysis.
  evidence:
  - reference: PMID:38699388
    reference_title: "Genetics of Mayer-Rokitansky-Küster-Hauser (MRKH) syndrome: advancements and implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "MD agenesis caused by WNT4 variants is associated with clinical and biochemical hyperandrogenism, representing a phenotype distinct from MRKH syndrome in general"
    explanation: >-
      A 2024 review of MRKH genetics separates WNT4 Mullerian agenesis from
      MRKH syndrome on the basis of hyperandrogenism.
  - reference: PMID:16959810
    reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that this might be a clinical entity distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome"
    explanation: >-
      The original argument for treating WNT4 deficiency as a separate entity.
  - reference: PMID:24641817
    reference_title: "Acne and PCOS are less frequent in women with Mayer-Rokitansky-Küster-Hauser syndrome despite a high rate of hyperandrogenemia: a cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As many as 42/69 (60.1%) showed hyperandrogenemia without other clinical signs of virilization"
    explanation: >-
      A second MRKH cohort with frequent, clinically silent
      hyperandrogenemia, reinforcing that biochemistry alone does not
      separate the two disorders.
  - reference: PMID:28246310
    reference_title: Hyperandrogenemia and high prolactin in congenital utero-vaginal aplasia patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, this study shows that over 52% of MRKH patients have hyperandrogenemia without clinical presentation and 14% hyperprolactinemia"
    explanation: >-
      In 215 MRKH patients, raised androgen indices were common but
      clinically silent, so a laboratory value alone does not distinguish the
      two disorders.
  - reference: PMID:28246310
    reference_title: Hyperandrogenemia and high prolactin in congenital utero-vaginal aplasia patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sequencing of WNT4, WNT5A, WNT7A and WNT9B demonstrated no significant mutations correlating with hyperandrogenemia."
    explanation: >-
      WNT4 variants do not account for the hyperandrogenemia seen in MRKH
      syndrome.
- name: MURCS association
  disease_term:
    preferred_term: MURCS association
    term:
      id: MONDO:0010989
      label: Mayer-Rokitansky-Küster-Hauser syndrome type 2
  description: >-
    Mullerian duct aplasia with renal anomalies and cervicothoracic somite
    dysplasia (MRKH syndrome type 2). It shares Mullerian aplasia and renal
    agenesis with this disorder and can coexist with clinical
    hyperandrogenism, but the vertebral and other skeletal anomalies
    distinguish it, and WNT4 is not mutated.
  evidence:
  - reference: PMID:24356390
    reference_title: Absence of WNT4 gene mutation in a patient with MURCS association.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an adolescent girl with the cardinal features of MURCS association, obesity, and clinical findings of hyperandrogenism who did not show any exonic mutation of the WNT4 gene."
    explanation: >-
      A MURCS patient with hyperandrogenism, the closest phenocopy, had no
      WNT4 variant.
- name: SERKAL syndrome
  disease_term:
    preferred_term: SERKAL syndrome
    term:
      id: MONDO:0012734
      label: SERKAL syndrome
  description: >-
    The allelic recessive WNT4 disorder. Homozygous loss-of-function WNT4
    variants cause 46,XX female-to-male sex reversal with dysgenesis of the
    kidneys, adrenals and lungs and other developmental defects, typically
    lethal in fetal life. It differs from this disorder in inheritance
    (biallelic versus a single dominant allele), in gonadal sex (testicular
    differentiation versus ovaries) and in the extent of organ involvement.
  evidence:
  - reference: PMID:18179883
    reference_title: "SERKAL syndrome: an autosomal-recessive disorder caused by a loss-of-function mutation in WNT4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a novel autosomal-recessive syndrome that consists of female to male sex reversal and renal, adrenal, and lung dysgenesis and is associated with additional developmental defects."
    explanation: >-
      Defines SERKAL syndrome, the distinct recessive WNT4 phenotype.
- name: Polycystic ovary syndrome
  disease_term:
    preferred_term: polycystic ovary syndrome
    term:
      id: MONDO:0008487
      label: polycystic ovary syndrome
  description: >-
    Shares ovarian hyperandrogenism with acne and hirsutism, and can present
    with amenorrhea, but the uterus is present and the amenorrhea is
    anovulatory. WNT4 coding variants were not found in a PCOS series, so
    WNT4 is not a cause of typical PCOS.
  evidence:
  - reference: PMID:17071531
    reference_title: Mutation analysis of the WNT-4 gene in patients with polycystic ovary syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polycystic ovary syndrome (PCOS) is one of the most common endocrinopathies in women of childbearing age and is characterized by chronic anovulation with either oligomenorrhea or amenorrhea and hyperandrogenism."
    explanation: >-
      States the features PCOS shares with this disorder.
  - reference: PMID:17071531
    reference_title: Mutation analysis of the WNT-4 gene in patients with polycystic ovary syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study demonstrates that, at least in the population studied, mutations of the open reading frame of WNT-4 gene or its intron/exon junctions are not the cause of PCOS."
    explanation: >-
      WNT4 coding variants were absent in 25 women with PCOS.

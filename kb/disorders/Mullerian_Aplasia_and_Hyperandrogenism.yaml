inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    All reported patients carry a single heterozygous WNT4 missense variant,
    and at least some of these alleles behave as dominant negatives in
    functional assays. Familial transmission has not been documented in the
    published abstracts, so the dominant mode rests on heterozygosity of the
    disease alleles rather than on pedigree segregation.
  evidence:
  - reference: PMID:40992710
    reference_title: "WNT4 deficiency impacts heart, diaphragm, and palate development: Insights from human genetics, machine learning, and mouse models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Autosomal dominant WNT4 missense variants have been shown to cause Mullerian aplasia and hyperandrogenism (MIM# 158330)."
    explanation: >-
      States the dominant mode of inheritance for this disease, named by its
      OMIM number, in the background of a SERKAL syndrome study.
  - reference: PMID:18987495
    reference_title: WNT4 and sex development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The recent demonstration of heterozygous WNT4 defects in patients with Mullerian agenesis and signs of ovarian hyperandrogenism added WNT4 to the growing list of genes"
    explanation: >-
      A review by the group that reported the first cases summarizes that the
      causal WNT4 defects are heterozygous.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population estimate exists. Four distinct pathogenic WNT4 alleles had
    been reported by 2011 (E226G, R83C, L12P and A233T), each in a single
    patient. Screening of Mullerian anomaly cohorts in China (189 women) and
    India (32 women) found no causal WNT4 variants, so the disorder accounts
    for a very small fraction of Mullerian aplasia.
  evidence:
  - reference: PMID:21377155
    reference_title: Molecular analysis of WNT4 gene in four adolescent girls with mullerian duct abnormality and hyperandrogenism (atypical Mayer-Rokitansky-Küster-Hauser syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This fourth new WNT4 mutation confirms that this signaling molecule is involved in mullerian development and androgen biosynthesis repression in the ovary."
    explanation: >-
      Identifies the A233T allele as the fourth reported WNT4 mutation, which
      is the size of the published case series at that point.
  - reference: PMID:22503279
    reference_title: Mutations in WNT4 are not responsible for Müllerian duct abnormalities in Chinese women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study screened WNT4 for mutation in 189 Chinese women with Müllerian duct abnormalities (10 Mayer-Rokitansky-Küster-Hauser syndrome, five Müllerian aplasia and 174 incomplete Müllerian fusion) and detected no perturbation that would indicate a major role for WNT4."
    explanation: >-
      A negative cohort screen that bounds how often WNT4 explains Mullerian
      anomalies.
  - reference: PMID:36738897
    reference_title: "Mutation analysis of WNT4 gene in SRY negative 46,XX DSD patients with Mullerian agenesis and/or gonadal dysgenesis- An Indian study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we could not find any indication about WNT4 involvement in the disease condition."
    explanation: >-
      A second negative screen, in 32 Indian 46,XX patients with Mullerian
      agenesis or gonadal dysgenesis, consistent with the disorder being rare.
pathophysiology:
- name: Heterozygous WNT4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants reduce WNT4 signalling. The four reported
    alleles (E226G, R83C, L12P, A233T) were each shown to be functionally
    defective, and R83C acts as a dominant negative, which would explain how a
    single allele produces a phenotype when heterozygous Wnt4 loss is silent in
    the mouse. The degree of loss differs between alleles: A233T only partly
    loses the ability to repress ovarian steroidogenic enzymes.
  genes:
  - preferred_term: WNT4
    term:
      id: hgnc:12783
      label: WNT4
  molecular_functions:
  - preferred_term: frizzled binding
    modifier: DECREASED
    term:
      id: GO:0005109
      label: frizzled binding
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  evidence:
  - reference: PMID:15317892
    reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genetic evaluation revealed a loss-of-function mutation in the WNT4 gene."
    explanation: >-
      The index case carries a loss-of-function WNT4 variant.
  - reference: PMID:16959810
    reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient carried the novel R83C loss-of-function dominant negative mutation in her WNT4"
    explanation: >-
      The second case carries an allele characterized as a dominant-negative
      loss of function; the functional characterization was done in human
      ovarian (OVCAR3) cells, as the same abstract states.
  - reference: PMID:40992710
    reference_title: "WNT4 deficiency impacts heart, diaphragm, and palate development: Insights from human genetics, machine learning, and mouse models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Functional studies suggest that at least a subset of these WNT4 missense variants act in a dominant negative fashion"
    explanation: >-
      Summarizes the functional work on the dominant alleles: a subset, not
      all, have been shown to be dominant negative.
  downstream:
  - target: Failed Mullerian Duct Formation
    causal_link_type: DIRECT
    description: >-
      WNT4 is required for the formation and elongation of the Mullerian duct,
      so loss of WNT4 signalling prevents the duct and its derivatives from
      forming.
    evidence:
    - reference: PMID:15317892
      reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "WNT4 appears to be important in the development and maintenance of the female phenotype in women, by means of the regulation of müllerian-duct formation and control of ovarian steroidogenesis."
      explanation: >-
        The authors attribute the patient's absent Mullerian structures to loss
        of WNT4 regulation of Mullerian duct formation.
    - reference: PMID:9989404
      reference_title: Female development in mammals is regulated by Wnt-4 signalling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Wnt-4 is initially required in both sexes for formation of the Mullerian duct"
      explanation: >-
        In the mouse, absence of Wnt-4 is sufficient to prevent Mullerian duct
        formation.
  - target: Derepressed Ovarian Androgen Biosynthesis
    causal_link_type: DIRECT
    description: >-
      WNT4 normally represses steroidogenic enzyme expression in the ovary;
      the mutant proteins fail to do so.
    evidence:
    - reference: PMID:18182450
      reference_title: "Identification and functional analysis of a new WNT4 gene mutation among 28 adolescent girls with primary amenorrhea and müllerian duct abnormalities: a French collaborative study."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional analysis revealed that the mutation induces significantly increased expression of the enzymes involved in androgen biosynthesis (3beta-hydroxysteroid dehydrogenase and 17alpha-hydroxylase)."
      explanation: >-
        The L12P allele, expressed in vitro, raises expression of the androgen
        biosynthetic enzymes that wild-type WNT4 represses.
    - reference: PMID:21377155
      reference_title: Molecular analysis of WNT4 gene in four adolescent girls with mullerian duct abnormality and hyperandrogenism (atypical Mayer-Rokitansky-Küster-Hauser syndrome).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies revealed partial repression of steroidogenic enzymes (normal repression of HSD3B2) contrasting with the abnormal reexpression of CYP17A1 enzyme in the OVCAR3 cell line."
      explanation: >-
        The A233T allele fails to repress CYP17A1 in ovarian cells, a partial
        version of the same defect.
  - target: Impaired Nephron Tubulogenesis
    causal_link_type: DIRECT
    description: >-
      Wnt4 is required in the metanephric mesenchyme for the
      mesenchyme-to-epithelium conversion that forms nephrons. This edge rests
      on homozygous null mouse data; whether a single human dominant allele
      disturbs kidney development by this route is not established.
    evidence:
    - reference: PMID:7990960
      reference_title: Epithelial transformation of metanephric mesenchyme in the developing kidney regulated by Wnt-4.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice lacking Wnt-4 activity fail to form pretubular cell aggregates; however, other aspects of mesenchymal and ureteric development are unaffected."
      explanation: >-
        Loss of Wnt-4 in the mouse blocks the first step of nephron formation.
- name: Failed Mullerian Duct Formation
  biological_scale: TISSUE
  description: >-
    The Mullerian (paramesonephric) duct is the anlage of the Fallopian tubes,
    uterus and upper vagina. WNT4 is needed for the migration of the cells that
    initiate the duct and for its posterior elongation; without it the duct
    fails to form, and its derivatives are absent or hypoplastic. In the
    reported patients the uterus was absent or hypoplastic while ovaries were
    present.
  biological_processes:
  - preferred_term: paramesonephric duct development
    modifier: DECREASED
    term:
      id: GO:0061205
      label: paramesonephric duct development
  evidence:
  - reference: PMID:26721931
    reference_title: Wnt4 coordinates directional cell migration and extension of the Müllerian duct essential for ontogenesis of the female reproductive tract.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, Wnt4 is required for the initiation of MD-forming cell migration."
    explanation: >-
      Mouse lineage tracing and antibody-blocking work places the WNT4
      requirement at the initiation and extension of the duct.
  - reference: PMID:9989404
    reference_title: Female development in mammals is regulated by Wnt-4 signalling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wnt-4-mutant females are masculinized-the Mullerian duct is absent while the Wolffian duct continues to develop."
    explanation: >-
      Female Wnt-4-null mice have no Mullerian duct.
  downstream:
  - target: Aplasia of the Uterus
    causal_link_type: DIRECT
    description: >-
      The uterus is a Mullerian duct derivative, so failure of duct formation
      leaves it absent.
    evidence:
    - reference: PMID:16959810
      reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This 19-year-old woman was affected by primary amenorrhoea, absence of Müllerian ducts derivatives, clinical (acne and hirsutism) and biochemical (repeatedly high levels of testosterone) signs of androgen excess."
      explanation: >-
        The R83C patient lacks Mullerian duct derivatives, the uterus among
        them.
  - target: Hypoplasia of the Uterus
    causal_link_type: DIRECT
    description: >-
      A hypomorphic allele may allow partial duct development, leaving a small
      uterus rather than none.
    evidence:
    - reference: PMID:18182450
      reference_title: "Identification and functional analysis of a new WNT4 gene mutation among 28 adolescent girls with primary amenorrhea and müllerian duct abnormalities: a French collaborative study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Moreover, our data confirm that WNT4 is involved in the regulation of müllerian duct development and ovarian androgen biosynthesis."
      explanation: >-
        The study reporting the L12P patient with uterine hypoplasia attributes
        the Mullerian abnormality to WNT4's role in duct development; that the
        hypoplasia reflects partial rather than absent duct formation is an
        inference.
  - target: Aplasia of the Vagina
    causal_link_type: DIRECT
    description: >-
      The upper vagina is a Mullerian duct derivative, so failure of duct
      formation can leave the vagina absent.
    evidence:
    - reference: PMID:24641817
      reference_title: "Acne and PCOS are less frequent in women with Mayer-Rokitansky-Küster-Hauser syndrome despite a high rate of hyperandrogenemia: a cross-sectional study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "the absence of the vagina and uterus and excess androgen levels are the pathognomonic signs of WNT4 defects"
      explanation: >-
        Attributes absence of the vagina, alongside the uterus, to WNT4
        defects.
  - target: Primary Amenorrhea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Without a functional uterus there is no menstruation, so failure of
      Mullerian duct formation presents as primary amenorrhea despite ovarian
      tissue.
    evidence:
    - reference: PMID:15317892
      reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An 18-year-old woman presented with primary amenorrhea and an absence of müllerian-derived structures"
      explanation: >-
        Primary amenorrhea is reported together with the absent Mullerian
        structures that account for it.
- name: Derepressed Ovarian Androgen Biosynthesis
  biological_scale: CELLULAR
  description: >-
    In the ovary WNT4 represses the steroidogenic enzymes of the androgen
    pathway (CYP17A1, HSD3B2, and in the mouse also Cyp11a1 and Hsd17b
    enzymes) and, in the fetal mouse gonad, keeps adrenal-type steroidogenic
    precursor cells from migrating in. Loss of WNT4 releases this repression
    and the ovary synthesizes testosterone. In mice the excess androgen
    maintains the Wolffian ducts; in women it produces acne, hirsutism and
    raised serum testosterone.
  biological_processes:
  - preferred_term: negative regulation of androgen biosynthetic process
    modifier: DECREASED
    term:
      id: GO:2000180
      label: negative regulation of androgen biosynthetic process
  - preferred_term: androgen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  evidence:
  - reference: PMID:15932923
    reference_title: "The partial female to male sex reversal in Wnt-4-deficient females involves induced expression of testosterone biosynthetic genes and testosterone production, and depends on androgen action."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate here that testosterone is produced by the ovary of Wnt-4-deficient female embryos and is also detected in the embryonic plasma."
    explanation: >-
      Direct demonstration in the mouse that loss of Wnt-4 makes the ovary
      synthesize testosterone.
  - reference: PMID:12835383
    reference_title: Endothelial and steroidogenic cell migration are regulated by WNT4 in the developing mammalian gonad.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that WNT4 represses mesonephric endothelial and steroidogenic cell migration in the XX gonad, preventing the formation of a male-specific coelomic blood vessel and the production of steroids."
    explanation: >-
      Identifies a cellular route for the repression in the fetal XX gonad:
      WNT4 keeps steroidogenic cells out.
  - reference: PMID:21377155
    reference_title: Molecular analysis of WNT4 gene in four adolescent girls with mullerian duct abnormality and hyperandrogenism (atypical Mayer-Rokitansky-Küster-Hauser syndrome).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, this mutant partially lacks the capability to repress ovarian steroidogenic enzymes, with abnormal expression of 17α- hydroxylase."
    explanation: >-
      In human ovarian cells a disease allele fails to repress 17alpha-hydroxylase
      (CYP17A1).
  downstream:
  - target: Increased Serum Testosterone
    causal_link_type: DIRECT
    description: >-
      Ovarian testosterone synthesis raises circulating testosterone.
    evidence:
    - reference: PMID:15932923
      reference_title: "The partial female to male sex reversal in Wnt-4-deficient females involves induced expression of testosterone biosynthetic genes and testosterone production, and depends on androgen action."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data imply that Wnt-4 signaling normally acts to suppress testosterone biosynthesis in the female, and that testosterone is the putative mediator of the masculinization phenotype in Wnt-4-deficient females."
      explanation: >-
        Places testosterone production downstream of Wnt-4 loss in the mouse
        ovary.
    - reference: PMID:18182450
      reference_title: "Identification and functional analysis of a new WNT4 gene mutation among 28 adolescent girls with primary amenorrhea and müllerian duct abnormalities: a French collaborative study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is interesting to note that the adolescent carrying the mutation was referred to our clinic for primary amenorrhea and hyperandrogenism (severe acne and plasma testosterone: 1.8 vs. 1.2 nmol/liter in controls)."
      explanation: >-
        The patient whose allele derepressed androgen enzymes in vitro had
        raised plasma testosterone.
  - target: Hirsutism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hirsutism is the androgen-dependent hair response to the raised
      circulating testosterone.
    evidence:
    - reference: PMID:16959810
      reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "clinical (acne and hirsutism) and biochemical (repeatedly high levels of testosterone) signs of androgen excess"
      explanation: >-
        The R83C patient's hirsutism is reported as a sign of her androgen
        excess.
  - target: Acne
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acne is a cutaneous sign of the androgen excess.
    evidence:
    - reference: PMID:16959810
      reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "clinical (acne and hirsutism) and biochemical (repeatedly high levels of testosterone) signs of androgen excess"
      explanation: >-
        Acne is reported as a clinical sign of the androgen excess.
- name: Impaired Nephron Tubulogenesis
  biological_scale: TISSUE
  description: >-
    In the developing kidney Wnt4 acts as an autoinducer of the conversion of
    metanephric mesenchyme into the epithelial tubules that become nephrons.
    Wnt4-null mice fail at this step. In this disease only the index patient
    had a renal anomaly (unilateral renal agenesis), so the kidney arm is
    poorly characterized in humans and the mechanism is extrapolated from the
    mouse.
  biological_processes:
  - preferred_term: mesenchymal to epithelial transition involved in metanephros morphogenesis
    modifier: DECREASED
    term:
      id: GO:0003337
      label: mesenchymal to epithelial transition involved in metanephros morphogenesis
  evidence:
  - reference: PMID:7990960
    reference_title: Epithelial transformation of metanephric mesenchyme in the developing kidney regulated by Wnt-4.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, Wnt-4 appears to act as an autoinducer of the mesenchyme to epithelial transition that underlies nephron development."
    explanation: >-
      Defines the renal function of Wnt-4 from the knockout mouse.
  downstream:
  - target: Unilateral Renal Agenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link between disturbed WNT4-dependent kidney development and the
      renal agenesis of the index patient. Renal agenesis normally reflects
      failure of the ureteric bud rather than of nephron induction, and mouse
      Wnt4 loss leaves ureteric development intact, so the intermediate steps
      are unknown.
    evidence:
    - reference: PMID:15317892
      reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "unilateral renal agenesis, and clinical signs of androgen excess--a phenotype resembling the Mayer-Rokitansky-Küster-Hauser syndrome and remarkably similar to that of female Wnt4-knockout mice."
      explanation: >-
        The authors relate the patient's combined phenotype, renal agenesis
        included, to the Wnt4-knockout mouse; the specific renal mechanism is
        not tested.
phenotypes:
- category: Genitourinary
  name: Aplasia of the Uterus
  description: >-
    Absence of the uterus with a 46,XX karyotype. The reporting group
    considers absence of the uterus, rather than other Mullerian anomalies,
    together with androgen excess, to be the pathognomonic combination for
    WNT4 deficiency.
  phenotype_term:
    preferred_term: Absent uterus
    term:
      id: HP:0000151
      label: Aplasia of the uterus
  evidence:
  - reference: PMID:16959810
    reference_title: "WNT4 deficiency--a clinical phenotype distinct from the classic Mayer-Rokitansky-Kuster-Hauser syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the absence of a uterus (and not other Müllerian abnormalities) and the androgen excess are the pathognomonic signs of WNT4 defects"
    explanation: >-
      Names uterine absence as one of the two defining signs.
  - reference: PMID:15317892
    reference_title: "A WNT4 mutation associated with Müllerian-duct regression and virilization in a 46,XX woman."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An 18-year-old woman presented with primary amenorrhea and an absence of müllerian-derived structures"
    explanation: >-
      The index case lacks Mullerian-derived structures, including the uterus.
- category: Genitourinary
  name: Hypoplasia of the Uterus
  description: >-
    A small uterus rather than complete absence, reported in the patient
    carrying the L12P allele.
  phenotype_term:
    preferred_term: Uterine hypoplasia
    term:
      id: HP:0000013
      label: Hypoplasia of the uterus
  evidence:
  - reference: PMID:18182450
    reference_title: "Identification and functional analysis of a new WNT4 gene mutation among 28 adolescent girls with primary amenorrhea and müllerian duct abnormalities: a French collaborative study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She also presented with uterine hypoplasia and follicle depletion."
    explanation: >-
      Reports uterine hypoplasia in a WNT4 L12P carrier.
- category: Genitourinary
  name: Aplasia of the Vagina
  description: >-
    Absence of the vagina, which in Mullerian aplasia means the upper,
    Mullerian-derived part. The primary case reports describe absent
    Mullerian derivatives without itemizing the vagina, and the R83C report
    stresses absence of the uterus rather than other Mullerian anomalies, so
    how consistently the vagina is involved is uncertain.
  phenotype_term:
    preferred_term: Vaginal aplasia
    term:
      id: HP:0003250
      label: Aplasia of the vagina
  evidence:
  - reference: PMID:24641817
    reference_title: "Acne and PCOS are less frequent in women with Mayer-Rokitansky-Küster-Hauser syndrome despite a high rate of hyperandrogenemia: a cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "the absence of the vagina and uterus and excess androgen levels are the pathognomonic signs of WNT4 defects"
    explanation: >-
      A later MRKH cohort study summarizes the WNT4 case literature as
      showing absence of both vagina and uterus.
- category: Genitourinary
  name: Primary Amenorrhea
  description: >-
    Absence of menarche, the usual reason for presentation in adolescence.

name: Mullerian Aplasia and Hyperandrogenism
creation_date: "2026-10-08T13:31:10Z"
category: Mendelian
description: >-
  Mullerian aplasia and hyperandrogenism (WNT4 deficiency) is a very rare 46,XX
  difference of sex development caused by heterozygous loss-of-function
  missense variants in WNT4, the secreted signal that is required to form the
  Mullerian ducts and that represses androgen synthesis in the developing and
  adult ovary. Affected women present in adolescence with primary amenorrhea
  and an absent or hypoplastic uterus, as in Mayer-Rokitansky-Kuster-Hauser
  (MRKH) syndrome, but in addition show clinical hyperandrogenism (acne,
  hirsutism) with raised serum testosterone of ovarian origin. Unilateral
  renal agenesis was present in the index case and ovarian follicle depletion
  in one later case. Functional studies of the reported variants show loss of
  WNT4 signalling, dominant-negative behaviour for at least some alleles, and
  derepression of the steroidogenic enzymes CYP17A1 and HSD3B2 in ovarian
  cells. The phenotype closely mirrors that of female Wnt4-null mice, which
  lack Mullerian ducts and ectopically synthesize testosterone in the ovary.
  It is distinct from SERKAL syndrome, the recessive WNT4 disorder of
  biallelic loss with 46,XX sex reversal and kidney, adrenal and lung
  dysgenesis, and from classic MRKH syndrome, in which WNT4 variants are not
  found.

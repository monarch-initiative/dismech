notes: >-
  OMIM 158330 and Orphanet ORPHA:247768 describe this disease; both are listed
  by MONDO as equivalents of MONDO:0008019. No GeneReviews chapter covers it.
  The published human evidence is four single-patient reports with functional
  assays, so phenotype frequencies are not given. Absence of the uterus is the
  defining Mullerian finding; vaginal involvement is recorded from a secondary
  summary of the case literature, because the primary abstracts describe
  absent Mullerian derivatives without itemizing the vagina. Treatment
  evidence is borrowed from Mullerian agenesis in general and no therapy has
  been studied in this disorder; management of the androgen excess is not
  described in any cited source.

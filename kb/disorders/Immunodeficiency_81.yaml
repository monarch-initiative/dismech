discussions:
- discussion_id: slp76_mouse_human_bcell_and_thymic_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The germline Slp76-null mouse shows a complete thymic block with no peripheral T
    cells and entirely normal B-cell development, whereas human IMD81 patients retain
    (dysregulated) peripheral T cells and have a B-cell antigen-receptor signaling
    defect with reduced memory B cells and antibody deficiency. Does the complete-null
    mouse therefore fail to model the human B-cell arm and overstate the T-cell
    developmental block, and is the human phenotype instead captured by hypomorphic
    Lcp2 alleles?
  attaches_to:
  - pathophysiology#Impaired Thymic T-Cell Development
  - pathophysiology#Combined T- and B-Cell Immunodeficiency
  rationale: >-
    This is a model-evidence-exists-and-diverges situation, not an absence of data.
    The complete Slp76 null causes an absolute block at the double-negative 3 stage
    with no peripheral T cells and normal B-cell development, while human patients
    carry hypomorphic or leaky alleles (splice, frameshift, proline-rich-domain
    missense) that leave residual SLP-76 and, consequently, dysregulated peripheral T
    cells skewed toward CD8 TEMRA plus a B-cell receptor signaling defect the null
    does not show. Homozygous Lcp2 splice-hypomorph mice that retain about 10% of
    wild-type SLP-76 protein reproduce the human pattern far better (a partial thymic
    block with dysregulated peripheral T cells), indicating that model fidelity to
    IMD81 depends on residual protein rather than on complete ablation. The B-cell arm
    of the human disease is therefore best modeled in patient cells and in the J14
    line, not in the null mouse.
  proposed_experiments:
  - experiment_id: exp_slp76_hypomorph_knockin
    name: Knock-in mouse carrying a human hypomorphic LCP2 allele
    description: >-
      Generate a mouse expressing an actual human IMD81 hypomorphic allele (e.g. the
      proline-rich-domain missense or the leaky splice variant) rather than a complete
      null, and test whether it reproduces the human combination of dysregulated
      peripheral T cells and a B-cell antigen-receptor signaling defect.
  - experiment_id: exp_slp76_bcr_signaling
    name: B-cell antigen-receptor signaling in a residual-protein model
    description: >-
      Measure BCR-induced calcium flux and class-switch/memory B-cell generation in a
      residual-SLP-76 model to determine whether the human B-cell phenotype requires
      partial rather than complete loss of the adaptor.

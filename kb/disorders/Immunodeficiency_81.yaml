prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    An ultra-rare entity. LCP2/SLP-76 deficiency was first linked to a human disease
    in 2021, and only a small number of unrelated patients have since been reported
    (an index infant with SCID, a patient with EBV-related lymphoma, and a
    compound-heterozygous patient with milder combined immunodeficiency). No
    population rate can be derived from these case reports.
  evidence:
  - reference: PMID:33231617
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our current study links this gene, for the first time, to a human
      immunodeficiency characterized by early-onset life-threatening infections,
      combined T and B cell immunodeficiency, severe neutrophil defects, and
      impaired platelet aggregation.
    explanation: >-
      Establishes IMD81 as a newly defined, first-reported human disease, consistent
      with an ultra-rare case-report-level entity.
genetic:
- name: LCP2
  gene_term:
    preferred_term: LCP2
    term:
      id: hgnc:6529
      label: LCP2
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic loss-of-function variants in LCP2 (encoding SLP-76) cause IMD81.
    Reported genotypes include novel biallelic mutations in the index infant, a
    homozygous frameshift (c.991delC; p.Q331Sfs*6), and compound heterozygous
    missense variants in the proline-rich repeat domain (p.P190R and p.R204W). The
    net functional consequence is loss of SLP-76 adaptor function. Inheritance is
    autosomal recessive.
  evidence:
  - reference: PMID:33231617
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe an infant with severe immunodeficiency who was found to have
      novel biallelic mutations in SLP76.
    explanation: >-
      Documents biallelic (recessive) LCP2/SLP76 mutations in the index patient.
  - reference: PMID:36474126
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed a novel homozygous mutation, c.991del.C; p.
      Q331Sfs*6 in the SLP76 gene.
    explanation: >-
      A homozygous frameshift allele, one of the loss-of-function genotypes reported
      for IMD81.
  - reference: PMID:37211057
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous missense variants were identified in LCP2, affecting the
      proline-rich repeat domain of SLP76 (p.P190R and p.R204W).
    explanation: >-
      A compound-heterozygous genotype affecting the SLP-76 proline-rich repeat
      domain, confirming biallelic LCP2 as causal and extending the allelic spectrum.
pathophysiology:
- name: LCP2 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in LCP2 reduce or abolish functional SLP-76
    protein. Frameshift alleles eliminate the protein; missense alleles in the
    proline-rich repeat domain reduce its expression and signalosome function.
  downstream:
  - target: Loss of SLP-76 Adaptor Function
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37211057
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, homozygous variants in LCP2 were reported to cause pediatric onset of
      severe combined immunodeficiency with neutrophil, platelet, and T- and B-cell
      defects.
    explanation: >-
      States that biallelic LCP2 variants are the genetic lesion initiating the
      disease.
- name: Loss of SLP-76 Adaptor Function
  biological_scale: MOLECULAR
  description: >-
    SLP-76 is a scaffold adaptor that, once recruited to phosphorylated LAT, nucleates
    the proximal TCR signalosome. Loss of the protein removes this assembly point for
    downstream TCR (and other hematopoietic immunoreceptor) signaling.
  molecular_functions:
  - preferred_term: SLP-76 signaling adaptor activity
    term:
      id: GO:0035591
      label: signaling adaptor activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired Proximal TCR Signaling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33231617
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLP76 is a key protein involved in TCR signaling and in other hematopoietic
      pathways.
    explanation: >-
      Identifies SLP-76 as a central adaptor for TCR and other hematopoietic
      signaling, whose loss removes the signalosome assembly point.
- name: Impaired Proximal TCR Signaling
  biological_scale: CELLULAR
  description: >-
    Without SLP-76, the LAT-SLP-76 signalosome fails to activate PLCgamma1, so
    downstream calcium mobilization and ERK/MAP-kinase signaling are blunted. Patient
    T and B cells show reduced ligand-induced phospho-PLCgamma1 and phospho-S6, and a
    SLP76-deficient T-cell line shows reduced ERK1/2 phosphorylation, CD69 induction,
    and calcium mobilization.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  - preferred_term: positive regulation of cytosolic calcium ion concentration
    term:
      id: GO:0007204
      label: positive regulation of cytosolic calcium ion concentration
    modifier: DECREASED
  downstream:
  - target: Impaired Thymic T-Cell Development
    causal_link_type: DIRECT
  - target: Defective T-Cell Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37211057
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tonic and ligand-induced levels of phosphorylated ribosomal protein S6 and
      ligand-induced phosphorylated PLCγ1 were decreased in the patient's B cells and
      CD4+ and CD8+ T cells.
    explanation: >-
      Directly shows impaired proximal antigen-receptor signaling (PLCgamma1, S6) in
      patient lymphocytes.
  - reference: PMID:36474126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Downstream TCR signaling events, including ERK1/2 phosphorylation, CD69
      expression, and Ca2 + mobilization, were reduced in cells harboring the reported
      mutation
    explanation: >-
      A SLP76-deficient Jurkat-derived T-cell line reconstituted with the patient
      mutation shows the reduced proximal TCR signaling this node describes.
- name: Impaired Thymic T-Cell Development
  biological_scale: CELLULAR
  description: >-
    SLP-76 integrates the pre-TCR signals that drive expansion of CD4+CD8+
    double-positive thymocytes. In the mouse Slp76 knockout, thymocyte development is
    blocked at the double-positive stage and peripheral T cells are absent, providing
    the developmental basis for the T-cell lymphopenia seen in severe human cases.
  cell_types:
  - preferred_term: CD4+CD8+ double-positive thymocyte
    term:
      id: CL:0000809
      label: double-positive, alpha-beta thymocyte
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
    modifier: DECREASED
  downstream:
  - target: Combined T- and B-Cell Immunodeficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:9695951
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of lymphoid cells revealed a profound block in thymic development with
      absence of double-positive CD4+8+ thymocytes and of peripheral T cells.
    explanation: >-
      The Slp76-null mouse establishes that loss of SLP-76 blocks thymic T-cell
      development; a non-human model, hence indirect for the human disease.
  - reference: PMID:9695951
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that SLP-76 collects all pre-TCR signals that drive the
      development and expansion of double-positive thymocytes.
    explanation: >-
      Identifies the developmental mechanism (pre-TCR signal integration) by which
      SLP-76 loss impairs thymic T-cell development.
- name: Defective T-Cell Activation
  biological_scale: CELLULAR
  description: >-
    Mature T cells that do develop cannot be properly activated through the TCR
    because the SLP-76 signalosome is required to couple receptor engagement to
    calcium/ERK signaling and activation-marker induction.
  biological_processes:
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: DECREASED
  downstream:
  - target: Combined T- and B-Cell Immunodeficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36474126
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In order to examine the effect of this new SLP76 mutation on T cell signaling, a
      SLP76-deficient Jurkat-derived T cell line was transduced either with wild-type
      (WT), or with the specific SLP76 mutant, or with a mock vector.
    explanation: >-
      Establishes the SLP76-deficient T-cell activation model whose reduced
      activation readouts (ERK, CD69, calcium) indicate defective T-cell activation.
- name: Combined T- and B-Cell Immunodeficiency
  biological_scale: ORGANISM
  description: >-
    The convergence of impaired T-cell development and activation, together with
    defective T-cell help for B cells, produces a combined immunodeficiency with
    failure of protective immunity. B-cell antigen-receptor signaling is itself
    impaired by SLP-76 loss, and specific antibody deficiency with reduced IgA and
    memory B cells is seen even when circulating cell numbers are near-normal.
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
  - target: Susceptibility to EBV-Driven Lymphoproliferation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37211057
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic variants in LCP2 impair neutrophil function and T-cell and B-cell
      antigen-receptor signaling and can cause combined immunodeficiency with
      early-onset immune dysregulation, even in the absence of platelet defects.
    explanation: >-
      States that biallelic LCP2 loss impairs both T- and B-cell receptor signaling
      and causes combined immunodeficiency, the central disease phenotype.
- name: Neutrophil Functional Defect
  biological_scale: CELLULAR
  description: >-
    SLP-76 is also required in myeloid immunoreceptor and integrin signaling, so its
    loss impairs neutrophil function independently of the lymphocyte defect,
    contributing to bacterial and fungal susceptibility.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Recurrent infections
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37211057
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, neutrophil function, numbers of unswitched and class-switched memory B
      cells, and serum IgA were decreased.
    explanation: >-
      Documents reduced neutrophil function (and B-cell/IgA deficits) in a patient
      with biallelic LCP2 variants.
- name: Defective Platelet GPVI/Integrin Signaling
  biological_scale: CELLULAR
  description: >-
    SLP-76 transmits signals from the platelet collagen receptor GPVI and integrin
    pathways, so its loss impairs platelet activation and aggregation. This arm is
    present in the severe index case but was spared in a milder compound-heterozygous
    patient, so it is not obligate.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  downstream:
  - target: Impaired platelet aggregation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33231617
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Understanding human diseases due to SLP76 deficiency is helpful in explaining
      the mixed T cell and neutrophil defects, providing a guide for exploring human
      SLP76 biology.
    explanation: >-
      Frames the multilineage (T-cell, neutrophil and, in the index case, platelet)
      hematopoietic consequences of SLP-76 loss that this node represents.
- name: Susceptibility to EBV-Driven Lymphoproliferation
  biological_scale: ORGANISM
  description: >-
    Loss of cytotoxic T-cell surveillance in combined immunodeficiency permits
    uncontrolled Epstein-Barr virus infection and EBV-driven B-cell proliferation,
    which in one reported patient progressed to diffuse large B-cell lymphoma.
  downstream:
  - target: B-cell lymphoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36474126
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SLP76 deficiency should be added to the growing list of monogenetic diseases
      that predispose affected individuals to acquire severe and uncontrolled EBV
      infections and to develop substantial complications.
    explanation: >-
      States that SLP76 deficiency predisposes to severe, uncontrolled EBV infection,
      the basis for EBV-driven lymphoproliferation.

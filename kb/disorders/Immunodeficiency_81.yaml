- name: Combined T- and B-Cell Immunodeficiency
  biological_scale: ORGANISM
  description: >-
    The convergence of impaired T-cell development and activation, together with
    defective T-cell help for B cells, produces a combined immunodeficiency with
    failure of protective immunity. B-cell antigen-receptor signaling is itself
    impaired by SLP-76 loss, and specific antibody deficiency with reduced IgA and
    memory B cells is seen even when circulating cell numbers are near-normal.
  downstream:

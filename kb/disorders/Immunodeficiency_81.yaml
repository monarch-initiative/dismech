treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the definitive treatment
    for the severe combined immunodeficiency form, replacing the SLP-76-deficient
    hematopoietic compartment. The index infant underwent haplo-identical HSCT but
    died of transplant-related complications; HSCT is the standard curative approach
    for T-B+ SCID generally.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Loss of SLP-76 Adaptor Function
    treatment_effect: RESTORES
    description: >-
      Allogeneic HSCT replaces the SLP-76-deficient hematopoietic compartment with
      donor cells that express functional SLP-76, restoring the adaptor at the root of
      the disease mechanism.
- name: Antimicrobial Prophylaxis and Treatment
  description: >-
    Broad antibacterial, antiviral, and antifungal prophylaxis and treatment to
    manage the recurrent and opportunistic infections of the combined immune and
    neutrophil defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-infective agent
      term:
        id: NCIT:C254
        label: Anti-Infective Agent
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Recurrent infections
    treatment_effect: INHIBITS
    description: >-
      Antibacterial, antiviral, and antifungal agents treat and prevent the recurrent
      opportunistic infections that result from the combined immune and neutrophil
      defect.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Immunoglobulin replacement supports the humoral immunodeficiency (antibody
    deficiency, reduced IgA and memory B cells) seen in these patients.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Combined T- and B-Cell Immunodeficiency
    treatment_effect: BYPASSES
    description: >-
      Passive immunoglobulin replaces the antibody the patient cannot make, bypassing
      the humoral arm of the combined immunodeficiency rather than correcting the
      underlying signaling defect.
- name: Supportive and Oncologic Care
  description: >-
    Supportive care and, when EBV-driven lymphoproliferation or lymphoma develops,

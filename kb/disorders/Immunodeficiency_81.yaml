treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the definitive treatment
    for the severe combined immunodeficiency form, replacing the SLP-76-deficient
    hematopoietic compartment. No transplant outcome was reported in the index
    infant; HSCT is the standard curative approach for T-B+ SCID generally.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
- name: Antimicrobial Prophylaxis and Treatment
  description: >-
    Broad antibacterial, antiviral, and antifungal prophylaxis and treatment to
    manage the recurrent and opportunistic infections of the combined immune and
    neutrophil defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-infective agent
      term:
        id: NCIT:C254
        label: Anti-Infective Agent
- name: Immunoglobulin Replacement Therapy
  description: >-
    Immunoglobulin replacement supports the humoral immunodeficiency (antibody
    deficiency, reduced IgA and memory B cells) seen in these patients.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
- name: Supportive and Oncologic Care
  description: >-
    Supportive care and, when EBV-driven lymphoproliferation or lymphoma develops,
    directed oncologic therapy. One reported patient developed and succumbed to
    EBV-related diffuse large B-cell lymphoma.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
notes: >-
  In the mouse Slp76 knockout, B-cell development was reportedly normal
  (PMID:9695951), whereas human patients show B-cell antigen-receptor signaling
  defects, reduced memory B cells, and antibody deficiency; the human B-cell
  phenotype is therefore modeled here as a downstream consequence of combined
  immunodeficiency and impaired B-cell receptor signaling rather than a
  developmental block. IMD81 corresponds to OMIM 619374 (immunodeficiency 81).

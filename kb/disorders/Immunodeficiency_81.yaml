    causal_link_type: DIRECT
  - target: Defective T-Cell Activation
    causal_link_type: DIRECT
  - target: Autoimmunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:37211057
    reference_title: "Combined immunodeficiency and impaired PI3K signaling in a patient with biallelic LCP2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tonic and ligand-induced levels of phosphorylated ribosomal protein S6 and
      ligand-induced phosphorylated PLCγ1 were decreased in the patient's B cells and
      CD4+ and CD8+ T cells.
    explanation: >-
      Directly shows impaired proximal antigen-receptor signaling (PLCgamma1, S6) in
      patient lymphocytes.
  - reference: PMID:36474126
    reference_title: "SLP76 Mutation Associated with Combined Immunodeficiency and EBV-Related Lymphoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Downstream TCR signaling events, including ERK1/2 phosphorylation, CD69
      expression, and Ca2 + mobilization, were reduced in cells harboring the reported
      mutation
    explanation: >-
      A SLP76-deficient Jurkat-derived T-cell line reconstituted with the patient
      mutation shows the reduced proximal TCR signaling this node describes.
  - reference: PMID:33231617
    reference_title: "Inherited SLP76 deficiency in humans causes severe combined immunodeficiency, neutrophil and platelet defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      downstream events, including the phosphorylation of ERK, PLC-γ1, and phospho-S6,
      all of which are dependent on the assembly of the LAT and SLP76 complex, were
      significantly reduced or absent
    explanation: >-
      Confirms in the index patient's primary T cells that ERK, PLC-gamma1 and S6
      phosphorylation downstream of the LAT-SLP76 signalosome are lost.
- name: Impaired Thymic T-Cell Development
  biological_scale: CELLULAR
  description: >-
    SLP-76 integrates the pre-TCR signals that drive expansion of CD4+CD8+
    double-positive thymocytes. In the mouse Slp76 knockout, thymocyte development is
    blocked at the double-negative 3 stage, with resulting absence of CD4+CD8+
    double-positive thymocytes and peripheral T cells, providing the developmental
    basis for the T-cell lymphopenia seen in severe human cases.

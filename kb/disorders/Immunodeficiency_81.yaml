name: Immunodeficiency 81
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
synonyms:
- IMD81
- LCP2 deficiency
- SLP76 deficiency
- T-B+ severe combined immunodeficiency due to SLP76 deficiency
description: >
  Immunodeficiency 81 is an autosomal recessive inborn error of immunity caused by
  biallelic loss-of-function variants in LCP2, the gene encoding SLP-76 (SH2
  domain-containing leukocyte protein of 76 kDa). SLP-76 is a cytosolic scaffold
  adaptor that sits immediately downstream of the T-cell receptor (TCR): once the
  receptor engages antigen and ZAP-70 phosphorylates the transmembrane adaptor LAT,
  SLP-76 is recruited into the LAT-SLP-76 signalosome, where it nucleates the
  assembly that activates phospholipase C-gamma-1 (PLCgamma1), calcium flux, and the
  ERK/MAP-kinase cascade. Because SLP-76 is the point at which these proximal
  signals converge, its loss collapses TCR signal transduction and, in parallel, the
  analogous immunoreceptor and integrin pathways in neutrophils and platelets on
  which SLP-76 is also required.

  The disease was first defined in 2021 in an infant with biallelic LCP2 mutations
  presenting with early-onset life-threatening infections, combined T- and B-cell
  immunodeficiency, severe neutrophil defects, and impaired platelet aggregation.
  Subsequently reported patients broaden the spectrum: a homozygous frameshift
  patient developed EBV-driven diffuse large B-cell lymphoma, and a compound
  heterozygous patient had a milder combined immunodeficiency with autoimmunity and
  inflammatory bowel disease but normal platelet function, showing that the platelet
  arm is not obligate. The mechanism is developmental as well as activational: in
  the mouse Slp76 knockout, thymocyte maturation is blocked at the double-negative 3
  stage, with resulting absence of CD4+CD8+ double-positive thymocytes and peripheral
  T cells, because SLP-76 integrates the pre-TCR signals that drive double-positive
  thymocyte expansion.

  IMD81 is very rare, with only a handful of reported kindreds. The clinical
  severity ranges from a T-B+ severe combined immunodeficiency phenotype to a
  later-onset combined immunodeficiency with immune dysregulation.

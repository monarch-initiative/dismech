    evidence:
    - reference: PMID:36474126
      reference_title: "SLP76 Mutation Associated with Combined Immunodeficiency and EBV-Related Lymphoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Downstream TCR signaling events, including ERK1/2 phosphorylation, CD69

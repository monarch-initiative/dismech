    snippet: >-
      Analysis of lymphoid cells revealed a profound block in thymic development with
      absence of double-positive CD4+8+ thymocytes and of peripheral T cells.
    explanation: >-
      The Slp76-null mouse establishes that loss of SLP-76 blocks thymic T-cell

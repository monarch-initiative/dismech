    description: >-
      Reproduces the granulocyte nuclear phenotype from an Lbr lesion, in vivo and across
      three independent alleles.
    limitations: >-
      Homozygous, where the defining human trait is heterozygous, so the model corresponds
      to the Homozygous PHA subtype rather than to the common presentation. It also carries

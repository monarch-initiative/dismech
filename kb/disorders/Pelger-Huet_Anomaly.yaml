  name: Hyposegmentation of Neutrophil Nuclei
  description: >-
    Neutrophil nuclei carry fewer lobes than normal - characteristically two, joined by a
    thin chromatin filament. This is the defining and usually the only finding.
  phenotype_term:
    preferred_term: Hyposegmentation of neutrophil nuclei
    term:
      id: HP:0011447
      label: Hyposegmentation of neutrophil nuclei
  evidence:
  - reference: PMID:19468205
    reference_title: "Pelger-Huët anomaly: a critical review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pelger-Huët anomaly (PHA), an autosomal dominant haematological trait is
      characterised by neutrophil nuclear hypolobulation and modified chromatin
      distribution.
    explanation: Names hypolobulation as the defining feature of the trait.
- category: Cellular
  name: Coarse Granulocyte Nuclear Chromatin
  description: >-
    Chromatin in the granulocyte nucleus appears coarse and clumped. No HP term is bound:
    the HPO has no class for granulocyte nuclear chromatin texture, and binding a generic
    neutrophil-morphology parent would assert less than the free-text name already says.
  phenotype_term:
    preferred_term: Coarse granulocyte nuclear chromatin
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals show hypolobulated neutrophil nuclei with coarse chromatin."
    explanation: Reports the chromatin finding in affected heterozygotes.
- category: Cellular
  name: Ovoid Granulocyte Nuclei
  subtype: Homozygous PHA
  description: >-
    With essentially no LBR the granulocyte nucleus does not segment at all and retains the
    ovoid shape typical of other cell types. Curated as a distinct phenotype from
    hyposegmentation rather than as its severe grade, because it marks the biallelic
    genotype.
  phenotype_term:
    preferred_term: Ovoid granulocyte nuclei
  evidence:
  - reference: PMID:17245605
    reference_title: "The granulocyte nucleus and lamin B receptor: avoiding the ovoid."

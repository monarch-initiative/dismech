name: Pelger-Huet Anomaly
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
description: >-
  Pelger-Huet anomaly is an autosomal dominant trait in which blood granulocytes fail to
  segment their nuclei. Neutrophils that should carry three to five lobes instead show two
  lobes joined by a thin filament - the "pince-nez" form - or a single unsegmented nucleus,
  and the chromatin inside them is unusually coarse. The cause is heterozygous
  loss-of-function variation in LBR, encoding the lamin B receptor, an inner nuclear
  membrane protein whose nucleoplasmic N-terminal domain tethers heterochromatin to the
  nuclear periphery. What makes the anomaly unusual mechanistically is that the phenotype
  tracks protein dose rather than any qualitative change: heterozygous cells carry reduced
  LBR and give hypolobulated nuclei, cells with two mutant alleles carry only traces and
  give frankly ovoid nuclei, and the relationship was shown to be dose-dependent in the
  same experiment that identified the gene. So the entry is a haploinsufficiency, not a
  dominant-negative one, and the "dominant" in autosomal dominant describes the pedigree
  rather than the allele's behaviour.

  The clinical point of the entry is almost entirely diagnostic rather than therapeutic.
  Carriers are healthy - neutrophil migration, phagocytosis and killing are not
  meaningfully impaired, and the trait is usually found incidentally on a blood film. Its
  importance is that the same morphology is acquired in myelodysplastic syndromes, acute
  leukaemia, severe infection and as a drug reaction, where it is called pseudo-Pelger-Huet
  anomaly and is a marker of dysplasia. Mistaking the inherited trait for the acquired one
  can precipitate a bone marrow biopsy and a haematological work-up in a well person;
  mistaking the acquired one for the inherited trait can delay a diagnosis of MDS.

  LBR carries a second, unrelated function in its transmembrane segments - the
  3-beta-hydroxysterol delta-14-reductase step of post-squalene cholesterol synthesis - and
  the allelic series at this locus separates the two. Alleles that reduce LBR protein level
  give this anomaly; alleles that abolish the reductase activity give the prenatally lethal
  Greenberg dysplasia, which is curated separately. The separation is not clean in the
  direction one would assume: a homozygous missense allele has been reported that produces a
  non-lethal skeletal dysplasia with no Pelger-Huet anomaly at all, so the nuclear-shape
  phenotype is not an obligate accompaniment of biallelic LBR disease.
synonyms:
- PHA
- Pelger-Huet nuclear anomaly
- Pelger anomaly
- Pelger-Huet nuclear hypolobulation

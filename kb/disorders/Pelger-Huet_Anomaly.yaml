has_subtypes:
- name: Heterozygous PHA
  display_name: Heterozygous Pelger-Huet anomaly (the classic trait)
  description: >-
    One LBR loss-of-function allele. Neutrophil nuclei are hypolobulated with coarse
    chromatin, and the carrier is otherwise healthy. This is what is meant by
    "Pelger-Huet anomaly" without qualification, and it is the state ascertained on blood
    films.
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals show hypolobulated neutrophil nuclei with coarse chromatin."
    explanation: States the morphology that defines the heterozygous trait.
- name: Homozygous PHA
  display_name: Homozygous Pelger-Huet anomaly (ovoid nuclei with systemic features)
  description: >-
    Two LBR loss-of-function alleles, with only trace amounts of the protein. Granulocyte
    nuclei are frankly ovoid rather than merely hypolobulated, and the reported
    individuals also carry developmental delay, epilepsy and skeletal abnormalities in
    varying degree - so the biallelic state is not simply a more marked version of the
    same benign trait. This is a distinct band of the LBR allelic series from Greenberg
    dysplasia, which is prenatally lethal and is curated separately.
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presumed homozygous individuals have ovoid neutrophil nuclei, as well as varying
      degrees of developmental delay, epilepsy and skeletal abnormalities.
    explanation: >-
      Establishes both the nuclear morphology and the extra-haematological features of the
      biallelic state. Note the authors' own hedge - "presumed homozygous" - which is why
      this entry does not treat the systemic features as fully established.
  - reference: PMID:42622427
    reference_title: "A homozygous lamin B receptor variant resulting in Pelger-Huët anomaly without skeletal dysplasia."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Already in 1981, a homozygous Pelger-Huët proband with ovoid neutrophil nuclei but
      without special clinical symptoms has been reported.
    explanation: >-
      Recorded as REFUTE against treating the systemic features as an obligate part of the
      biallelic state. A molecularly re-analysed homozygous proband had the ovoid nuclei
      and no clinical symptoms, so the developmental delay, epilepsy and skeletal
      abnormalities of the other report are not a necessary consequence of two mutant
      alleles. This is the strongest reason the entry keeps its hedge.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No reliable numeric estimate is curated here. Published figures rest on blood-film
    ascertainment, and the review literature says explicitly that the anomaly is often
    missed, so any denominator drawn from routine haematology under-counts by an unknown
    factor. Founder effects are described in specific populations, which makes a single
    worldwide rate misleading in any case.
  evidence:
  - reference: PMID:19468205
    reference_title: "Pelger-Huët anomaly: a critical review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to its asymptomatic nature or lack of observer familiarity, PHA is often overlooked."
    explanation: >-
      Supports the ascertainment caveat rather than a rate. Quoted as the reason no
      numeric prevalence is asserted, so the inference step from "often overlooked" to
      "published rates under-count" is why this is marked INDIRECT.
  - reference: PMID:35650273
    reference_title: Genetic architecture of band neutrophil fraction in Iceland.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To search for sequence variants affecting nuclear morphology of granulocytes, we
      performed a genome-wide association study using band neutrophil fraction from 88,101
      Icelanders.
    explanation: >-
      The one population-scale measurement available, and the reason this entry can say the
      LBR locus effect on nuclear morphology is not confined to rare pedigrees. It does not
      give a prevalence for the anomaly itself - band neutrophil fraction is a quantitative
      proxy, not a diagnosis - which is why it is INDIRECT and why no rate is asserted.
pathophysiology:
- name: LBR Loss-of-Function Allele
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline loss-of-function variant in LBR. The mutational spectrum
    reported with the anomaly is dominated by alleles that destroy or truncate the
    transcript rather than by missense alleles acting on a specific residue, which is the
    first hint that the mechanism is one of protein quantity.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: LBR
      term:
        id: hgnc:6518
        label: LBR
    description: >-
      Splice-site, frameshift and nonsense alleles account for the originally reported
      families; missense alleles are also described. The biallelic state, curated here as
      the Homozygous PHA subtype, gives ovoid nuclei rather than a qualitatively different
      disease.
  cellular_components:
  - preferred_term: inner nuclear membrane
    term:
      id: GO:0005637
      label: nuclear inner membrane
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four splice-site, two frameshift and two nonsense mutations in LBR, encoding the lamin B receptor."
    explanation: >-
      Identifies LBR as the causal gene and gives the mutational classes - all
      loss-of-function - found in the mapping families.
  - reference: PMID:14617022
    reference_title: "Lamin B-receptor mutations in Pelger-Huët anomaly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LBR gene (LBR) was also sequenced from a single English man with Pelger-Huët
      anomaly and a heterozygous C-->G mutation was found in codon 569 of exon 14,
      predicted to cause a proline-->arginine.
    explanation: >-
      Independent replication in a separate family, and the one that extends the spectrum
      to missense alleles.
  downstream:
  - target: Reduced Lamin B Receptor Protein Level
    description: >-
      A single null allele is not compensated: heterozygous cells carry measurably less
      LBR protein than controls.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12118250
      reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Lymphoblastoid cells from heterozygous individuals affected with PHA show reduced
        expression of the lamin B receptor, and cells homozygous with respect to PHA
        contain only trace amounts of it.
      explanation: >-
        Measures the protein level directly in patient-derived cells of both genotypes,
        which is what makes this a dosage lesion rather than an inferred one.
- name: Reduced Lamin B Receptor Protein Level
  biological_scale: MOLECULAR
  description: >-
    The quantity of lamin B receptor at the inner nuclear membrane falls below the level
    the differentiating granulocyte needs. This node, not the allele, is what the
    phenotype tracks: nuclear shape and chromatin distribution vary with LBR dose across
    the wild-type, heterozygous and biallelic states, so the same lesion at two doses
    gives hypolobulation and then frank ovoid nuclei.
  cellular_components:
  - preferred_term: inner nuclear membrane
    term:
      id: GO:0005637
      label: nuclear inner membrane
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "We found that expression of the lamin B receptor affects neutrophil nuclear shape and chromatin distribution in a dose-dependent manner."
    explanation: >-
      The dose-response is the substantive claim of this node, and it is what rules out a
      dominant-negative reading of the dominant pedigree.
  - reference: PMID:22338047
    reference_title: "Understanding and recognizing the Pelger-Huët anomaly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "PHA is caused by a decreased amount of the lamin B receptor (LBR)."
    explanation: >-
      An independent review states the mechanism as a quantity defect. Graded OTHER
      because it is a review's summary statement rather than a reported experiment.
  downstream:
  - target: Heterochromatin Redistribution in the Granulocyte Nucleus
    description: >-
      LBR's nucleoplasmic N-terminal domain is what holds heterochromatin against the
      nuclear periphery. With less of the protein, that peripheral tethering is lost and
      heterochromatin redistributes, which is seen on the film as the coarse chromatin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28858257
      reference_title: "Lamin B Receptor: Interplay between Structure, Function and Localization."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Its N-terminal domain tethers heterochromatin to the nuclear periphery, thus
        contributing to the shape of interphase nuclear architecture, while its
        transmembrane domains exhibit sterol reductase activity.
      explanation: >-
        Establishes the tethering function that this edge depends on. Marked INDIRECT
        because it states what the domain does in general, and the step to "therefore less
        LBR redistributes heterochromatin in granulocytes" is an inference.
    - reference: PMID:21327094
      reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In humans, a genetic deficiency of LBR produces Pelger-Huët anomaly, resulting in
        blood neutrophils that exhibit hypolobulated nuclei with redistributed
        heterochromatin.
      explanation: >-
        States the redistribution as an observed feature of the human neutrophils, tying
        the LBR deficiency to the chromatin change rather than only to the shape change.
  - target: Failure of Granulocyte Nuclear Lobulation
    description: >-
      LBR is required for the granulocyte nucleus to depart from the ovoid default shape
      of other cell types. The requirement is not merely correlative: reducing LBR is
      sufficient to keep the nucleus ovoid through induced granulopoiesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17245605
      reference_title: "The granulocyte nucleus and lamin B receptor: avoiding the ovoid."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: "Recent studies have demonstrated that lamin B receptor (LBR) is necessary for the non-ovoid shape."
      explanation: States the necessity relation this edge asserts.
    - reference: PMID:17245605
      reference_title: "The granulocyte nucleus and lamin B receptor: avoiding the ovoid."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A single dominant mutation in humans leads to neutrophils with hypolobulated
        nuclei (Pelger-Huet anomaly); homozygosity leads to ovoid granulocyte nuclei.
      explanation: >-
        Gives the two-step dose relation in human genotypes, which is the specific form
        this edge takes.
- name: Heterochromatin Redistribution in the Granulocyte Nucleus
  biological_scale: CELLULAR
  description: >-
    Heterochromatin that would sit against the inner nuclear membrane is released into the
    nuclear interior. On a stained film this is the "coarse", clumped chromatin that
    accompanies the shape change, and it is a separate observable from lobe count.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: heterochromatin organization
    modifier: DECREASED
    term:
      id: GO:0070828
      label: heterochromatin organization
  cellular_components:
  - preferred_term: heterochromatin
    term:
      id: GO:0000792
      label: heterochromatin
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pelger-Huët anomaly (PHA; OMIM *169400) is an autosomal dominant disorder characterized by abnormal nuclear shape and chromatin organization in blood granulocytes."
    explanation: >-
      Names chromatin organization as a defining abnormality alongside nuclear shape, so
      the two are curated as separate nodes rather than one.
  downstream:
  - target: Failure of Granulocyte Nuclear Lobulation
    description: >-
      Whether the chromatin change causes the shape change, or the two are parallel
      consequences of losing LBR, is not settled - see the knowledge gap recorded in
      discussions. The edge is drawn because the two are consistently reported together
      and heterochromatin tethering is the structural function LBR is losing, but it is
      the weakest link in this pathograph.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21327094
      reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
      supports: NO_EVIDENCE
      evidence_source: IN_VITRO
      snippet: "The exact mechanisms of this nuclear shape change and of heterochromatin redistribution remain largely unknown."
      explanation: >-
        Recorded as NO_EVIDENCE deliberately. The cited paper does not establish the
        direction of this edge; it states that the mechanism is unknown, which is the
        honest status of the link and the reason it is typed INDIRECT.
- name: Failure of Granulocyte Nuclear Lobulation
  biological_scale: CELLULAR
  description: >-
    The maturing granulocyte nucleus does not undergo the segmentation that normally
    converts it from a round to a multi-lobed shape. In the heterozygous state it stops at
    two lobes joined by a filament; with essentially no LBR it stays ovoid. The lobulated
    shape is thought to serve deformability during migration through tight tissue spaces,
    which is why the failure is a plausible candidate for functional consequence - and
    why the absence of one in carriers is itself worth recording.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  biological_processes:
  - preferred_term: granulocyte differentiation
    term:
      id: GO:0030851
      label: granulocyte differentiation
  evidence:
  - reference: PMID:21327094
    reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      During in vitro granulopoiesis induced with retinoic acid, the LBR knockdown cells
      retain an ovoid shaped nucleus with reduced levels of lamin A/C; while, the parent
      cells develop highly lobulated nuclei.
    explanation: >-
      An isogenic knockdown reproduces the failure of lobulation during granulopoiesis,
      which is the strongest available evidence that reduced LBR is sufficient for this
      node rather than merely associated with it.
  - reference: PMID:17245605
    reference_title: "The granulocyte nucleus and lamin B receptor: avoiding the ovoid."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "This deformable nucleus enhances rapid migration."
    explanation: >-
      Supplies the functional rationale for why nuclear lobulation exists at all. Marked
      INDIRECT: it is a statement about normal physiology, from which the significance of
      the failure follows by inference rather than by measurement in carriers.
  downstream:
  - target: Hyposegmentation of Neutrophil Nuclei
    description: >-
      The failure of lobulation is what is seen on the blood film as the bilobed
      "pince-nez" neutrophil, and it is the observation the diagnosis rests on.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19468205
      reference_title: "Pelger-Huët anomaly: a critical review of the literature."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pelger-Huët anomaly (PHA), an autosomal dominant haematological trait is
        characterised by neutrophil nuclear hypolobulation and modified chromatin
        distribution.
      explanation: Ties the cellular failure to the reported clinical morphology.
  - target: Coarse Granulocyte Nuclear Chromatin
    description: >-
      The second film finding, reported alongside hypolobulation rather than as a
      consequence of it.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:14617022
      reference_title: "Lamin B-receptor mutations in Pelger-Huët anomaly."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pelger-Huët anomaly is an inherited abnormality of neutrophils, characterized by
        reduced nuclear segmentation and an apparently looser chromatin structure.
      explanation: >-
        Reports the two film findings together. Note the authors' hedge, "apparently
        looser", which is preserved rather than smoothed into a firmer claim.
- name: Reduced LBR Sterol C14-Reductase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    LBR's transmembrane segments carry the 3-beta-hydroxysterol delta-14-reductase step of
    post-squalene cholesterol synthesis, and a variant that lowers LBR level or stability
    lowers that activity too. Whether this arm contributes to the granulocyte nuclear
    phenotype, or is simply the arm that produces the skeletal end of the allelic series,
    is unresolved - which is why the node is marked HYPOTHETICAL and carries no downstream
    edge to the nuclear nodes. It is recorded because one authoritative review places
    Pelger-Huet anomaly on the cholesterol-synthesis side, against the reading that the
    trait is a pure heterochromatin-tethering defect.
  molecular_functions:
  - preferred_term: 3-beta-hydroxysterol delta-14-reductase activity
    modifier: DECREASED
    term:
      id: GO:0050613
      label: Delta14-sterol reductase activity
  evidence:
  - reference: PMID:27830109
    reference_title: "Pelger-Huët anomaly and Greenberg skeletal dysplasia: LBR-associated diseases of cholesterol metabolism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The study furthermore determined that disease-associated LBR point mutations reduce
      sterol C14 reductase activity by decreasing the affinity of LBR for the reducing
      agent NADPH.
    explanation: >-
      Gives a mechanism by which disease alleles lower the enzymatic activity. INDIRECT
      because the assayed alleles are described as disease-associated for the LBR
      disorders as a class, and the quote does not separate the Pelger-Huet alleles from
      the Greenberg ones.
  - reference: PMID:27830109
    reference_title: "Pelger-Huët anomaly and Greenberg skeletal dysplasia: LBR-associated diseases of cholesterol metabolism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, two disease-associated LBR truncation mutants were found to be highly
      unstable at the protein level and are rapidly turned over by a novel nuclear
      membrane-based protein quality control pathway.
    explanation: >-
      Supplies a route from a truncating allele to reduced protein quantity, which is the
      node above. INDIRECT for the same reason - the alleles are not separated by
      phenotype in the quoted sentence.
phenotypes:

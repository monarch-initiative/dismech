  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      The encounter is haematological: the anomaly is found on a blood film, and the
      question it raises is whether the dysplastic-looking neutrophils are inherited or
      are a marker of myelodysplasia.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian autosomal dominant trait with a gene-dosage mechanism, and the
      counselling question for a carrier couple is the biallelic state.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008214
      label: Pelger-Huet anomaly
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The dismech entry and the MONDO class denote the same entity: the LBR-related
      inherited granulocyte nuclear hypolobulation trait. The other LBR phenotypes
      (Greenberg dysplasia, the mild biallelic anadysplasia-like spondylometaphyseal
      dysplasia, the reported non-lethal skeletal dysplasia without Pelger-Huet anomaly)
      are discussed here as an allelic series but are not part of this class.

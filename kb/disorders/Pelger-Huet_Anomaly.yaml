genetic:
- name: LBR
  gene_term:
    preferred_term: LBR
    term:
      id: hgnc:6518
      label: LBR
  relationship_type: CAUSATIVE
  review_notes: >-
    Lamin B receptor. An integral protein of the inner nuclear membrane with a
    nucleoplasmic N-terminal domain that tethers heterochromatin to the nuclear periphery
    and eight transmembrane segments that carry sterol C14-reductase activity. Pelger-Huet
    anomaly is the heterozygous loss-of-function phenotype at this locus; Greenberg
    dysplasia is the biallelic enzyme-null phenotype and is a separate dismech entry.
  evidence:
  - reference: PMID:12118250
    reference_title: "Mutations in the gene encoding the lamin B receptor produce an altered nuclear morphology in granulocytes (Pelger-Huët anomaly)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four splice-site, two frameshift and two nonsense mutations in LBR, encoding the lamin B receptor."
    explanation: Establishes the gene-disease relationship in the mapping families.
  - reference: PMID:28858257
    reference_title: "Lamin B Receptor: Interplay between Structure, Function and Localization."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Lamin B receptor (LBR) is an integral protein of the inner nuclear membrane,
      containing a hydrophilic N-terminal end protruding into the nucleoplasm, eight
      hydrophobic segments that span the membrane and a short, nucleoplasmic C-terminal
      tail.
    explanation: Describes the protein architecture the two functional domains sit in.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Transmitted as an autosomal dominant trait. The label describes the pedigree, not the
    allele's mode of action: the underlying lesion is haploinsufficiency, and the
    biallelic state is both viable and more severe, which a true dominant-negative would
    not predict in this form.
  evidence:
  - reference: PMID:19468205
    reference_title: "Pelger-Huët anomaly: a critical review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pelger-Huët anomaly (PHA), an autosomal dominant haematological trait is characterised by neutrophil nuclear hypolobulation and modified chromatin distribution."
    explanation: States the inheritance mode.
diagnosis:
- name: Peripheral Blood Film Morphology
  description: >-
    The anomaly is a morphological diagnosis made on a stained peripheral blood film, and
    it is usually incidental. The finding affects all granulocytes but is most easily seen
    in neutrophils. Because the same morphology is acquired in myelodysplasia and other
    states, recognising it should prompt the question of which it is, not a conclusion.
  evidence:
  - reference: PMID:22338047
    reference_title: "Understanding and recognizing the Pelger-Huët anomaly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "The Pelger-Huët anomaly (PHA) is a recognized morphologic variant affecting all granulocytes but is most evident in polymorphonuclear neutrophils (PMNs)."
    explanation: Establishes what is examined and in which cells the finding is clearest.
- name: LBR Sequencing
  description: >-
    Sequencing LBR confirms the inherited trait and is what separates it from an acquired
    pseudo-Pelger-Huet picture when the film alone cannot.
  evidence:
  - reference: PMID:22338047
    reference_title: "Understanding and recognizing the Pelger-Huët anomaly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Recognition of PHA morphologic features serves as a marker for mutations in the LBR gene."
    explanation: Ties the morphological finding to the confirmatory genetic test.
differential_diagnoses:
- name: Pseudo-Pelger-Huet anomaly
  description: >-
    Acquired hyposegmentation of neutrophil nuclei, seen in myelodysplastic syndromes,
    acute leukaemia, severe infection and as a drug effect. Morphologically it can be
    indistinguishable from the inherited trait on a single film, which is the whole
    clinical problem: here the finding is a marker of dysplasia and demands a
    haematological work-up, whereas in the inherited trait it demands nothing.
  distinguishing_features:
  - Acquired rather than lifelong, so an earlier normal film settles it where one exists
  - Typically affects a proportion of neutrophils rather than nearly all of them
  - Accompanied by other dysplastic features and by cytopenias
  - No LBR germline variant, and no affected first-degree relatives
  evidence:
  - reference: PMID:22338047
    reference_title: "Understanding and recognizing the Pelger-Huët anomaly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Guidance is given for distinguishing PHA from other hematologic disorders in which granulocytes may show similar changes."
    explanation: >-
      Confirms that other haematological disorders produce a similar granulocyte
      appearance and that the distinction is a recognised diagnostic task.
- name: Greenberg dysplasia
  description: >-
    The other end of the LBR allelic series: biallelic alleles that abolish sterol
    C14-reductase activity give a prenatally lethal skeletal dysplasia. It is not a severe
    form of this anomaly and is curated as a separate dismech entry.
  distinguishing_features:
  - Prenatally lethal, presenting as fetal hydrops with markedly short limbs
  - Driven by loss of the enzymatic function rather than by reduced protein quantity
  - Biallelic; obligate carriers are healthy apart from the Pelger-Huet trait
  evidence:
  - reference: PMID:27830109
    reference_title: "Pelger-Huët anomaly and Greenberg skeletal dysplasia: LBR-associated diseases of cholesterol metabolism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Lamin B Receptor (LBR) is an inner nuclear membrane protein associated with the rare
      human diseases Pelger-Huët anomaly and Greenberg skeletal dysplasia.
    explanation: Establishes the two as distinct diseases of the same gene.
- name: Non-LBR hyposegmentation of granulocytes in animals
  description: >-
    Hyposegmented granulocytes occur in domestic animals and are often called Pelger-Huet
    anomaly by analogy. That analogy should not be assumed to extend to the gene. In
    Australian Shepherd Dogs with an autosomal recessive hyposegmentation phenotype,
    linkage analysis excluded LBR and implicated LMBR1L instead. The row is here because a
    veterinary report of "Pelger-Huet anomaly" is not evidence about LBR, and a curator
    reaching for cross-species support should check which gene was actually mapped.
  distinguishing_features:
  - LBR excluded by linkage in the reported canine phenotype
  - Autosomal recessive with stillbirth in the affected litter, unlike the benign human heterozygous trait
  evidence:
  - reference: PMID:37347778
    reference_title: "Autosomal recessive hyposegmentation of granulocytes in Australian Shepherd Dogs indicates a role for LMBR1L in myeloid leukocytes."
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HG phenotypes have also been described in domestic animals and homology to human PHA
      has been claimed in the literature.
    explanation: >-
      Recorded as REFUTE against the assumption that animal hyposegmentation phenotypes are
      LBR-related. The sentence states the claim that the paper then goes on to test, and
      the study's own finding excludes LBR for this breed.
- name: LBR-related non-lethal skeletal dysplasia
  description: >-
    A biallelic LBR missense genotype reported in two adult sisters with a skeletal
    dysplasia milder than Greenberg dysplasia and, importantly, no Pelger-Huet anomaly at
    all. This matters to the present entry as a negative result: it shows the nuclear
    phenotype is not an obligate accompaniment of biallelic LBR disease, so a normal blood
    film does not exclude an LBR disorder.
  distinguishing_features:
  - Skeletal dysplasia with short stature and short limbs, surviving to adulthood
  - Blood film explicitly normal for Pelger-Huet anomaly despite two mutant alleles
  evidence:
  - reference: PMID:32827848
    reference_title: "A homozygous variant in the Lamin B receptor gene LBR results in a non-lethal skeletal dysplasia without Pelger-Huët anomaly."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report provides additional evidence of variability for Lamin B receptor-related disorders associated with a non-lethal skeletal dysplasia without Pelger-Huët anomaly."
    explanation: >-
      Documents a biallelic LBR genotype without the nuclear phenotype, which is the
      dissociation this row exists to record.
animal_models:
- name: Ichthyosis (ic) mouse
  species: Mouse
  genotype: Lbr(ic/ic), Lbr(icJ/icJ), Lbr(ic4J/ic4J) - nonsense and frameshift alleles
  publication: PMID:12490533
  description: >-
    The classical mouse counterpart, and a case where the mouse locus was known long before
    the gene. Mice homozygous at the ichthyosis locus have a blood phenotype like
    Pelger-Huet anomaly, and the causal mutations were shown to lie in Lbr. Note the mouse
    is homozygous where the human trait is heterozygous, and carries extra features -
    alopecia, variable syndactyly, hydrocephalus - that the human heterozygous trait does
    not.

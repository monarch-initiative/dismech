discussions:
- discussion_id: lbr_domain_attribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Heterochromatin Redistribution in the Granulocyte Nucleus
  - pathophysiology#Reduced LBR Sterol C14-Reductase Activity
  prompt: >-
    Does Pelger-Huet anomaly arise from loss of LBR's heterochromatin-tethering function,
    from loss of its sterol C14-reductase function, or from neither individually?
  rationale: >-
    Three positions are defended in the literature and they are not reconcilable by
    emphasis.

    The structural reading is that less LBR means less heterochromatin tethered at the
    nuclear periphery and therefore no lobulation. It is the intuitive one and is what the
    dose-response experiment is usually taken to show.

    The metabolic reading is that the mutations causing both Pelger-Huet anomaly and
    Greenberg dysplasia lie in the transmembrane segments and act through cholesterol
    synthesis, and that no harmful mutation of the anchoring function has been reported at
    all.

    Against the metabolic reading there is a direct mouse experiment, and it is the
    strongest single piece of evidence here. DHCR14 encodes a second sterol
    delta-14-reductase, so LBR is not the only one. Disrupting Dhcr14 in mice produces
    essentially normal animals, Lbr-null mice do not resemble the Dhcr14 mutants, and no
    sterol abnormalities were detected in liver or kidney of either. On that basis the
    authors argue these disorders are laminopathies rather than inborn errors of
    cholesterol synthesis. Note this cuts against the metabolic account for the LBR
    disorders as a class, which includes Greenberg dysplasia, where a separate line of
    yeast-complementation evidence supports the enzymatic reading - so the contradiction is
    live rather than settled.

    A third possibility, consistent with the truncation-instability finding, is that the
    operative variable is total LBR protein quantity and neither domain function is
    separately causal for the nuclear phenotype.

    The distinction is not academic: it determines whether the anomaly belongs with the
    laminopathies or with the inborn errors of sterol metabolism, and this entry lists both
    as parents rather than choosing.
  evidence:
  - reference: PMID:28858257
    reference_title: "Lamin B Receptor: Interplay between Structure, Function and Localization."
    supports: REFUTE
    directness: DIRECT
    evidence_source: OTHER
    snippet: >-
      Mutations within the transmembrane segments result in defects in cholesterol
      synthesis and are associated with diseases such as the Pelger-Huët anomaly and
      Greenberg skeletal dysplasia, whereas no such harmful mutations related to the
      anchoring properties of LBR have been reported so far.
    explanation: >-
      Recorded as REFUTE against the heterochromatin-tethering account of this disease.
      The sentence asserts that no disease-causing mutation of the anchoring function has
      been reported, which cuts directly against the reading that lost tethering is what
      produces the anomaly.
  - reference: PMID:21327094
    reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The exact mechanisms of this nuclear shape change and of heterochromatin redistribution remain largely unknown."
    explanation: >-
      An explicit statement from within the field that the mechanism is open, which is the
      claim this knowledge gap makes.
  - reference: PMID:17403717
    reference_title: "HEM dysplasia and ichthyosis are likely laminopathies and not due to 3beta-hydroxysterol Delta14-reductase deficiency."
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lbr(-/-), Dhcr14(Delta4-7/Delta4-7) and Lbr(+/-):Dhcr14(Delta4-7/Delta4-7) mutant mice
      have distinct physical and biochemical phenotypes.
    explanation: >-
      Recorded as REFUTE against the metabolic account. If the LBR phenotype were a sterol
      delta-14-reductase deficiency, disrupting the other delta-14-reductase should
      phenocopy it, and it does not. The title states the authors' conclusion outright.
  - reference: PMID:17403717
    reference_title: "HEM dysplasia and ichthyosis are likely laminopathies and not due to 3beta-hydroxysterol Delta14-reductase deficiency."
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Neither of these mutants resembles the ichthyosis mouse and biochemically, no sterol
      abnormalities were detected in either liver or kidney tissue.
    explanation: >-
      The negative biochemical result. A sterol-synthesis disorder that produces no
      detectable sterol abnormality in the tissues examined is a hard claim to sustain, and
      this is why the gap treats the metabolic reading as contested rather than as the
      accepted account.
- discussion_id: lobulation_function_without_burden
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Hyposegmentation of Neutrophil Nuclei
  prompt: >-
    If the lobulated granulocyte nucleus exists to make the cell deformable enough to
    migrate through tight tissue spaces, why are Pelger-Huet carriers not measurably more
    susceptible to infection?
  rationale: >-
    The functional rationale for nuclear lobulation is migration through constricted
    spaces, and the anomaly abolishes lobulation in essentially every granulocyte for life.
    The trait is nonetheless described as asymptomatic.

    Two mouse studies have asked the question directly and they disagree. A gene-trap Lbr
    mouse whose granulocytes lack a segmented nucleus kills Staphylococcus aureus normally,
    and its authors conclude LBR is needed for morphological but not functional granulocyte
    maturation. Neutrophils derived from the ichthyosis allele, by contrast, are reported as
    lacking critical functional responses, with chemotaxis and the respiratory burst the
    functions examined. Both are murine, both are homozygous, and they used different
    assays and different alleles, so the disagreement may be methodological rather than
    biological - but nothing in the cited literature adjudicates it.

    The human question is untouched either way. Both experiments are homozygous, and the
    human trait that is called asymptomatic is the heterozygous one, where far more LBR
    remains. Carriers are ascertained incidentally, so no cohort has been assembled to look
    for a mild susceptibility with adequate power. This entry records the absence of a
    clinical burden section as a claim about the literature rather than about the biology.
  evidence:
  - reference: PMID:17245605
    reference_title: "The granulocyte nucleus and lamin B receptor: avoiding the ovoid."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "This deformable nucleus enhances rapid migration."
    explanation: >-
      States the functional claim that makes the absence of a clinical phenotype
      surprising. INDIRECT: it describes normal physiology, and the tension with the
      asymptomatic trait is an inference from it.
  - reference: PMID:19468205
    reference_title: "Pelger-Huët anomaly: a critical review of the literature."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to its asymptomatic nature or lack of observer familiarity, PHA is often overlooked."
    explanation: >-
      States the asymptomatic nature, and simultaneously names the ascertainment problem
      that would hide a mild susceptibility.
  - reference: PMID:18621876
    reference_title: "The lamin B receptor under transcriptional control of C/EBPepsilon is required for morphological but not functional maturation of neutrophils."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite these changes in nuclear morphology, the innate granulocyte immune function in
      the killing of Staphylococcus aureus bacteria appears to be intact.
    explanation: >-
      Supports the asymptomatic reading: nuclear shape and bacterial killing come apart in
      this model. INDIRECT because it is a homozygous mouse and the human trait in question
      is heterozygous. Note the authors' own hedge, "appears to be intact".
  - reference: PMID:18550262
    reference_title: "Mouse neutrophils lacking lamin B-receptor expression exhibit aberrant development and lack critical functional responses."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A unique feature of the neutrophil is its highly lobulated nucleus, which is thought
      to facilitate chemotaxis, but may also play a role in other critical neutrophil
      functions.
    explanation: >-
      Recorded as REFUTE against the asymptomatic reading. This study's title states that
      LBR-null mouse neutrophils lack critical functional responses, which is the opposite
      conclusion to the gene-trap study above, from the same species and the same zygosity.
      The quoted sentence is the framing of the question rather than the result, because the

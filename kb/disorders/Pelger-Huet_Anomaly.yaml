experimental_models:
- name: LBR-knockdown HL-60 subline
  experimental_model_type: CELL_LINE
  description: >-
    A stable LBR-knockdown subline of the human promyelocytic HL-60 line, differentiated
    down the granulocyte lineage with retinoic acid. It is the closest thing to an
    isogenic in vitro model of the anomaly: the same genetic background with and without
    LBR, taken through granulopoiesis, so the nuclear phenotype can be attributed to LBR
    dose rather than to line-to-line variation.
  publication: PMID:21327094
  modeled_mechanisms:
  - target: Failure of Granulocyte Nuclear Lobulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Knockdown cells retain an ovoid nucleus through retinoic-acid-induced granulopoiesis
      while the parent line lobulates, reproducing the biallelic end of the human
      phenotype.
    limitations: >-
      HL-60 is a leukaemia-derived line carrying its own karyotypic abnormalities, and
      retinoic-acid-induced granulopoiesis in culture is not marrow granulopoiesis.
      Knockdown gives a graded reduction rather than the defined one- or two-allele human
      genotypes, so the model reproduces the ovoid extreme rather than the heterozygous
      hypolobulation that defines the trait clinically.
    readouts:
    - name: Nuclear shape after retinoic-acid-induced granulopoiesis
      target: Failure of Granulocyte Nuclear Lobulation
      direction: ALTERED
      interpretation: >-
        Ovoid rather than lobulated nuclei in the knockdown line is the structural
        correlate of this node.
      evidence:
      - reference: PMID:21327094
        reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        snippet: >-
          During in vitro granulopoiesis induced with retinoic acid, the LBR knockdown
          cells retain an ovoid shaped nucleus with reduced levels of lamin A/C; while,
          the parent cells develop highly lobulated nuclei.
        explanation: Reports the measurement and its direction against an isogenic control.
    - name: Nuclear shape after phorbol-ester-induced macrophage differentiation
      target: Failure of Granulocyte Nuclear Lobulation
      direction: UNCHANGED
      interpretation: >-
        A real negative result, and the one that gives the model its specificity: losing
        LBR does not disturb nuclear shape down the macrophage lineage, so the defect is
        specific to granulopoiesis rather than a general nuclear-morphology artefact of
        the knockdown.
      evidence:
      - reference: PMID:21327094
        reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        snippet: >-
          In contrast, macrophage forms induced in LBR knockdown cells by in vitro
          treatment with phorbol ester were indistinguishable from the parent cells,
          judged by both nuclear shape and attached cell morphology.
        explanation: >-
          Reports the lineage-specificity control. Recorded as UNCHANGED because the
          measurement was made and found equal, which is different from not having been
          made.
  evidence:
  - reference: PMID:21327094
    reference_title: "An in vitro model for Pelger-Huët anomaly: stable knockdown of lamin B receptor in HL-60 cells."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      As a tool to facilitate analysis of these mechanisms, a stable LBR knockdown subline

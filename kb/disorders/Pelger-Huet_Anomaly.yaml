        equivalent across species.
    - divergence_type: POPULATION_MISMATCH
      materiality: INVALIDATING
      description: >-
        The model is homozygous and the human trait this entry is named for is
        heterozygous. For a dosage-dependent phenotype that is the difference between the
        two bands of the allelic series, not a matter of degree.

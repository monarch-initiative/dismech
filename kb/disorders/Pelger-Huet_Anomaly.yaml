notes: >-
  Lump/split decision: DISEASE. MONDO:0008214 names one entity with one conserved
  pathograph - heterozygous LBR loss of function, reduced LBR protein, failure of
  granulocyte nuclear lobulation - and the stub is retired accordingly. The biallelic
  state is curated as a has_subtypes entry rather than a separate disease, because it is
  the same lesion at a different dose and the reported systemic features rest on
  genotypes the source itself calls "presumed homozygous". Greenberg dysplasia is a
  separate MONDO class and a separate dismech entry; it is not folded in here.

  On whether a benign trait belongs in a disease knowledge base: it does, and the reason
  is the differential rather than the biology. The morphology this entry describes is
  also the acquired marker of myelodysplasia, and the cost of confusing the two runs in
  both directions - an unnecessary marrow biopsy in a well carrier, or a missed MDS. A
  pathograph that says where the inherited finding comes from is what lets that
  distinction be made on grounds other than pattern recognition.

  No treatments section. Not an omission: there is no treatment, and none is indicated,
  because the heterozygous trait causes no impairment to treat. Recording an empty
  supportive-care row would assert more clinical content than exists.

  No clinical_burden section, for the same reason, but the absence is argued rather than
  assumed - see the second knowledge gap in discussions, which records that "asymptomatic"
  rests on incidental ascertainment and has not been tested in an assembled cohort.

  Two mouse models are curated and both carry a POPULATION_MISMATCH divergence marked
  INVALIDATING rather than QUALIFYING. That is deliberate. Both are homozygous and the
  trait this entry is named for is heterozygous, and since the phenotype tracks LBR protein
  dose, the difference between one and two mutant alleles is the difference between the two
  bands of the allelic series rather than a matter of degree. Any functional conclusion
  drawn from those mice applies to the Homozygous PHA subtype, not to the common trait.

  A note on how the entry was assembled. The deep-research run fetches references into
  references_cache/ as part of its own citation validation, and a first draft cited nine of
  the twenty-eight it produced. Review of a sibling PR in the same batch (#11619) flagged
  that pattern, and reading the rest before pushing changed this entry rather than padding
  it: a homozygous proband reported without clinical symptoms now refutes the systemic
  features of the biallelic state, a mouse cross-breeding experiment now argues against the
  cholesterol-synthesis account of the disorder class, and the second knowledge gap turned
  out to have two published answers that contradict each other. None of that was visible
  from the nine references the first draft used.

  The deep-research report is committed alongside the entry under research/. It is
  on-target, naming LBR throughout. Reference selection and every snippet here were
  nonetheless taken from the fetched reference cache rather than from the report.

differential_diagnoses:
- name: HSD10 mitochondrial disease (MRPP2/HSD17B10 deficiency)
  description: >-
    The other RNase P subunit disorder, and the closest biochemical mimic:
    HSD17B10 variants also produce accumulation of mitochondrial RNA precursors
    without depleting mature transcripts. The discriminator is direction of
    subunit loss — in HSD10 disease MRPP2 loss secondarily reduces MRPP1, whereas
    in COXPD30 MRPP1 falls while MRPP2 and MRPP3 are unchanged. HSD10 disease is
    also X-linked, against autosomal recessive here.
  evidence:
  - reference: PMID:24549042
    reference_title: "Mutation or knock-down of 17β-hydroxysteroid dehydrogenase type 10 cause loss of MRPP1 and impaired processing of mitochondrial heavy strand transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In HSD10 knock-down cells, MRPP1 protein content was also reduced,
      indicating that HSD10 is important for the maintenance of normal MRPP1
      protein levels.
    explanation: >-
      Establishes the secondary MRPP1 loss that distinguishes HSD10 disease from
      primary MRPP1 deficiency.
- name: Mitochondrial tRNA point mutation syndromes
  description: >-
    Primary mt-tRNA variants converge on the same downstream node — impaired
    mitochondrial translation with combined complex deficiency — and several of
    them act partly by degrading mt-RNase P handling of the mutant pre-tRNA. They
    are separated from COXPD30 by maternal rather than autosomal recessive
    inheritance and by heteroplasmy.
  evidence:
  - reference: PMID:33380464
    reference_title: "Disease-associated mutations in mitochondrial precursor tRNAs affect binding, m1R9 methylation, and tRNA processing by mtRNase P."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that several mutations weaken the pre-tRNA binding affinity
    explanation: >-
      Shows disease mt-tRNA variants degrade the same processing reaction from
      the substrate side, which is why the two converge biochemically.
discussions:
- discussion_id: trmt10c_null_phenotype_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does complete loss of TRMT10C cause a distinct or more severe human
    phenotype, or is it embryonic lethal?
  attaches_to:
  - pathophysiology#Biallelic TRMT10C Missense Variants
  rationale: >-
    Both reported alleles are missense and both leave residual, partially
    functional MRPP1. No human truncating or null genotype has been described. If
    MRPP1 is strictly required for mitochondrial gene expression, a true null may
    never be seen in a liveborn child, in which case the reported neonatal
    presentation is already the mild end of the allelic series rather than its
    severe end. This matters for interpreting a novel truncating TRMT10C variant
    found on exome, where the absence of a reported null is currently
    indistinguishable from the absence of a reportable phenotype.
- discussion_id: fibroblast_severity_mismatch
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the phenotype so severe when mature mt-tRNA and mt-mRNA levels are
    close to normal?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial RNase P 5' Processing
  rationale: >-
    The processing defect measured in fibroblasts is milder than the clinical
    course would suggest, and the authors say so explicitly. Possible
    reconciliations — a larger defect in muscle, heart or cochlea than in
    fibroblasts; a kinetic cost not visible in steady-state measurements; or a
    contribution from the MRPP1 scaffolding role in downstream maturation steps —
    have not been distinguished. Fibroblast steady-state RNA levels may simply be
    the wrong readout for this disease.
notes: >-
  Only two unrelated individuals have been reported, so every frequency, severity
  and organ-involvement statement in this entry is drawn from an n of 2 and
  should be read as the reported range rather than the disease spectrum.

  This entry deliberately keeps "Preserved m1R9 Methyltransferase Activity" as a
  pathophysiology node with no downstream edge. It is not a step in the causal
  chain; it is the negative control that assigns the lesion to the RNase P arm of
  MRPP1 rather than to its methyltransferase arm, and losing it would make the
  mechanism look less specific than the evidence actually supports. That node's
  GO descriptor carries no modifier because ModifierEnum has no permissible value
  for a process that was measured and found unchanged — the closest available
  values (ABNORMAL, DYSREGULATED) would assert the opposite of the finding.
  ExperimentalReadout.direction does have UNCHANGED for exactly this situation,
  so the gap is specific to descriptors.

  Not to be confused with combined oxidative phosphorylation deficiency 26
  (OMIM 616539), which is a TRMT5 disorder and genetically and clinically
  distinct. The two sit adjacent in the COXPD numbering and both concern mt-tRNA
  modification, which makes them an easy pair to conflate on a literature search.

  Death in infancy is recorded under progression rather than as a phenotype
  because HP:0001522 is a mortality term and is not a member of the schema's
  PhenotypeTerm dynamic enum; the phenotype list carries the terminal
  respiratory failure instead.

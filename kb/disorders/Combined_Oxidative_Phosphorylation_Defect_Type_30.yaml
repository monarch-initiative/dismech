inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic TRMT10C missense variants. One reported subject was compound
    heterozygous for c.542G>T (p.Arg181Leu) and c.814A>G (p.Thr272Ala); the
    other was homozygous for c.542G>T (p.Arg181Leu). Both reported alleles are
    missense rather than truncating, and both leave residual MRPP1 protein, so
    there is as yet no human observation of a complete TRMT10C null.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous c.542G>T (p.Arg181Leu) (ClinVar: SCV000264779.0) and
      c.814A>G (p.Thr272Ala) (ClinVar: SCV000264780.0) variants were identified
      in subject 1, whereas subject 2 was homozygous for the c.542G>T
      (p.Arg181Leu) variant, also identified in subject 1.
    explanation: >-
      Establishes biallelic inheritance and names the two reported genotypes.
mechanistic_hypotheses:
- hypothesis_group_id: mrpp1_mrpp3_interface_disruption
  hypothesis_label: >-
    The disease variants act by disrupting the MRPP1-MRPP3 interface rather than
    by depleting MRPP1 uniformly
  status: EMERGING
  description: >-
    The reported variants impair 5'-cleavage while leaving m1R9 methylation
    intact. Since methylation is carried out by the MRPP1-MRPP2 subcomplex and
    cleavage additionally requires MRPP3, which contributes the nuclease active
    site, an interface-selective defect would explain why one activity of MRPP1
    is lost and the other preserved. The alternative, that a simple reduction in
    MRPP1 abundance is enough to limit cleavage without limiting methylation,
    is not excluded by the available data. The two models are distinguishable
    experimentally and neither has been tested.
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, one attractive hypothesis is to suggest that the p.Arg181Leu and
      p.Thr272Ala TRM10C variants disrupt the interaction between MRPP1 and MRPP3
      without affecting the complex with MRPP2, although this requires future
      investigation.
    explanation: >-
      States the hypothesis and that it is unresolved, in the authors' own terms.
  - reference: PMID:34489609
    reference_title: "Structural basis of RNA processing by human mitochondrial RNase P."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The endonuclease PRORP is recruited and activated through interactions with
      its PPR and nuclease domains to ensure precise pre-tRNA cleavage.
    explanation: >-
      Cryo-EM shows MRPP3/PRORP is recruited and activated by interaction with the
      MRPP1-MRPP2 subcomplex rather than binding independently, which is what makes
      an interface-selective defect a structurally coherent way to lose cleavage
      while keeping methylation. Indirect because the structure is of wild-type
      complex and does not test the disease variants.
pathophysiology:
- name: Biallelic TRMT10C Missense Variants
  biological_scale: MOLECULAR
  description: >-
    Rare missense substitutions at evolutionarily conserved residues of MRPP1.
    Neither reported allele is truncating. In silico prediction was uninformative
    — the p.Arg181Leu substitution scores as relatively benign across SIFT,
    PolyPhen-2 and aGVGD — so pathogenicity rests on the functional work rather
    than on prediction, and the residue's proximity to the TRM10-type
    methyltransferase domain is a structural rather than a computed argument.

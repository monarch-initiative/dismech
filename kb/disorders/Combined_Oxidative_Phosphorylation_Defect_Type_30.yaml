    term:
      id: hgnc:26022
      label: TRMT10C
  genetic_context:
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    gene:
      preferred_term: TRMT10C
      term:
        id: hgnc:26022
        label: TRMT10C
    notes: >-
      Zygosity is recorded as homozygous for the second reported subject; the
      first was compound heterozygous for the same recurrent allele plus
      p.Thr272Ala. Both genotypes leave residual, partially active MRPP1, which
      is why the functional impact is recorded as partial rather than complete
      loss of function.
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both identified TRMT10C variants are predicted to result in amino acid
      substitutions affecting evolutionarily conserved residues (Figure 1H) and
      are rare
    explanation: >-
      Establishes the allele class and its rarity in population databases.
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In silico predictions via SIFT, PolyPhen-2, and aGVGD suggest that the
      biophysico impact of the p.Arg181Leu substitution are relatively benign
    explanation: >-
      Records that variant-effect prediction does not support pathogenicity for
      the recurrent allele, which is why the functional rescue experiment
      carries the argument.
  downstream:
  - target: MRPP1 Protein Destabilization
    description: >-
      The substitutions reduce the steady-state amount of MRPP1 protein rather
      than preventing its synthesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27132592
      reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These data showed that the steady-state levels of MRPP1 were markedly
        decreased in the subject cell lines, suggesting that the variants affect
        the stability of the protein
      explanation: >-
        Links the variants directly to reduced MRPP1 protein in patient
        fibroblasts.
- name: MRPP1 Protein Destabilization
  biological_scale: MOLECULAR
  description: >-
    MRPP1 steady-state levels fall in patient fibroblasts while its two RNase P
    partners, MRPP2 and MRPP3, are unchanged. The subunit stoichiometry of the
    holoenzyme is therefore skewed rather than the complex being globally lost,
    which is the opposite of the arrangement seen in MRPP2/HSD17B10 disease,
    where loss of MRPP2 secondarily drags MRPP1 down with it. Residual MRPP1
    protein is present in both subjects, and the amount does not order the
    severity: the compound heterozygote had the lower MRPP1 level but the milder
    translation defect, implying the p.Arg181Leu protein is more stable but less
    active than p.Thr272Ala.
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the other hand, levels of MRPP2 and MRPP3, the other two subunits of
      RNase P, were unchanged in fibroblasts from affected individuals
    explanation: >-
      Shows the defect is specific to MRPP1 rather than a collapse of the whole
      holoenzyme.
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      implying the p.Arg181Leu mutant protein is more stable but less active
      than the p.Thr272Ala mutant protein
    explanation: >-
      Establishes that residual MRPP1 abundance does not by itself predict
      functional severity.
  - reference: PMID:24549042
    reference_title: "Mutation or knock-down of 17β-hydroxysteroid dehydrogenase type 10 cause loss of MRPP1 and impaired processing of mitochondrial heavy strand transcripts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Our findings indicate that HSD10 is important for the maintenance of the
      MRPP1-HSD10 subcomplex of RNase P and that loss of HSD10 causes impaired
      mitochondrial precursor transcript processing
    explanation: >-
      Provides the contrasting arrangement in MRPP2/HSD10 disease, where MRPP1
      loss is secondary, against which the MRPP1-selective depletion here is
      read.
  downstream:
  - target: Impaired Mitochondrial RNase P 5' Processing
    description: >-
      Reduced MRPP1 lowers the throughput of the 5'-cleavage reaction that
      releases mt-tRNAs from the polycistronic precursor.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27132592
      reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analyses of fibroblasts from affected individuals harboring TRMT10C
        missense variants revealed decreased protein levels of MRPP1 and an
        increase in mt-RNA precursors indicative of impaired mt-RNA processing
        and defective mitochondrial protein synthesis.
      explanation: >-
        Connects reduced MRPP1 to precursor accumulation in the same cells.
- name: Impaired Mitochondrial RNase P 5' Processing
  biological_scale: MOLECULAR
  description: >-
    Unprocessed precursor accumulates at the gene boundaries where cleavage
    should occur — RNA19 rises on northern blot, and RNA-seq shows increased read
    depth specifically across junctions requiring processing. The defect is one
    of efficiency, not of completion: mature mt-tRNA and mt-mRNA steady-state
    levels are largely normal, consistent with slower cleavage of a product that
    is itself stable once made. Because the 3' nuclease ELAC2 is intact in these
    patients, the predicted intermediate is an mt-mRNA still carrying an
    uncleaved tRNA at its 5' side.
  biological_processes:
  - preferred_term: mitochondrial tRNA 5'-end processing
    modifier: DECREASED
    term:
      id: GO:0090646
      label: mitochondrial tRNA processing
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Northern blot analyses showed an increase in RNA precursor RNA19 when
      detected with either an MT-ND1 or MT-RNR2 probe
    explanation: >-
      Direct measurement of precursor accumulation in patient fibroblasts.
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we found an increase in the regions that span gene boundaries, where RNA
      processing is required to release individual mitochondrial RNAs from the
      precursor transcripts
    explanation: >-
      Localises the accumulation to processing junctions transcriptome-wide,
      rather than to a single transcript.
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      the steady-state levels of mt-tRNAs were not significantly altered in the
      affected individuals relative to controls, suggesting that the severe
      mitochondrial translation defect was not due to absence of cleaved
      mt-tRNAs
    explanation: >-
      Establishes that the lesion is reduced processing throughput rather than
      loss of the mature product, which is what makes this node quantitative.
  - reference: PMID:29040705
    reference_title: "The MRPP1/MRPP2 complex is a tRNA-maturation platform in human mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      MRPP1/2 is not only a component of the mitochondrial RNase P but that it
      retains the tRNA product from the 5'-processing step and significantly
      enhances the efficiency of ELAC2-catalyzed 3'-processing
    explanation: >-
      Shows MRPP1 also scaffolds the downstream maturation steps, so reduced
      MRPP1 plausibly costs more than the cleavage reaction alone.
  downstream:
  - target: Impaired Mitochondrial Protein Synthesis
    description: >-
      Inefficient release of mt-tRNAs and mt-mRNAs from the precursor limits
      mitochondrial translation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27132592
      reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The low steady-state levels of mtDNA-encoded proteins was due to impaired
        mitochondrial protein synthesis in subject fibroblasts as demonstrated by
        reduced incorporation of 35S-labeled methionine and cysteine
      explanation: >-
        Measures the translation defect directly by metabolic labelling.
- name: Preserved m1R9 Methyltransferase Activity
  biological_scale: MOLECULAR
  description: >-
    MRPP1 has a second activity, separable from RNase P: with MRPP2 it methylates
    position 9 of mt-tRNAs, a modification needed for most of them to fold into
    the canonical cloverleaf rather than an extended hairpin. This activity is
    measurably unaffected by the disease variants, tested two independent ways —
    primer extension on mt-tRNA-Leu(UUR), where the m1R9 mark stalls reverse
    transcriptase, and RNA-seq error rate at position 9. The node is included
    because it is the negative result that assigns the disease mechanism to the
    cleavage arm specifically; it is not a step in the causal chain and has no
    downstream edge. Note that the biological_processes descriptor below
    deliberately carries no modifier: the finding is that this process is
    unchanged, and ModifierEnum has no value for a measured normal result.
  biological_processes:
  - preferred_term: mt-tRNA m1R9 methylation, measured and found unaffected
    term:
      id: GO:0030488
      label: tRNA methylation
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data indicate that the m1R9 methyltransferase activity is not
      affected by the p.Arg181Leu and p.Thr272Ala MRPP1 variants.
    explanation: >-
      States the negative result that separates the two MRPP1 activities in this
      disease.
  - reference: PMID:33380464
    reference_title: "Disease-associated mutations in mitochondrial precursor tRNAs affect binding, m1R9 methylation, and tRNA processing by mtRNase P."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Additionally, one component of mtRNase P, mitochondrial RNase P protein 1
      (MRPP1), catalyzes methylation of the R9 base in pre-tRNAs.
    explanation: >-
      Establishes that m1R9 methylation is an MRPP1 activity, which is what
      makes its preservation here informative rather than incidental.
- name: Impaired Mitochondrial Protein Synthesis
  biological_scale: CELLULAR
  description: >-
    Reduced de novo synthesis of the 13 mtDNA-encoded polypeptides. Because those
    13 subunits are distributed across complexes I, III, IV and V but none sits in
    complex II, a translation-level lesion produces a characteristic biochemical
    signature: combined deficiency with complex II spared. This is the step that
    converts a single RNA-processing defect into a multi-complex respiratory
    chain phenotype.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The loss of MRPP1 protein level correlates with decreased steady-state
      levels of subunits of complex I (NDUFB8) and complex IV (COXI)
    explanation: >-
      Links reduced translation to depletion of specific mtDNA-encoded subunits.
  downstream:
  - target: Combined Respiratory Chain Complex I and IV Deficiency
    description: >-
      Fewer mtDNA-encoded subunits are available for assembly, so the complexes
      that contain them fail to accumulate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27132592
      reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We used blue native PAGE to determine the effects on the assembly and
        stability of the respiratory chain complexes16 and show a marked decrease
        of fully assembled complex I and complex IV, with a slight decrease in
        complex III levels
      explanation: >-
        Measures assembled complex levels directly by blue native PAGE.
- name: Combined Respiratory Chain Complex I and IV Deficiency
  biological_scale: CELLULAR
  description: >-
    Reduced amounts of assembled complex I and complex IV, with complex III
    variably involved and complex II preserved. The defect is demonstrable both
    as reduced enzyme activity in skeletal muscle and as reduced assembled
    holocomplex on blue native PAGE, and in muscle it is patchy rather than
    uniform — COX deficiency is mosaic across fibres, with subsarcolemmal
    mitochondrial accumulation producing ragged red fibres.
  biological_processes:

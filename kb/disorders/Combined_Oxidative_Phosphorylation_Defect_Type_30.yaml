name: Combined Oxidative Phosphorylation Defect Type 30
creation_date: "2026-08-31T16:45:00Z"
category: Mendelian
synonyms:
- COXPD30
- combined oxidative phosphorylation deficiency 30
- TRMT10C-related mitochondrial disease
- MRPP1 deficiency
- mitochondrial RNase P protein 1 deficiency
description: >-
  Combined oxidative phosphorylation defect type 30 (COXPD30) is an autosomal
  recessive mitochondrial disease caused by biallelic missense variants in
  TRMT10C, which encodes mitochondrial RNase P protein 1 (MRPP1, also called
  RG9MTD1). Human mitochondrial DNA is transcribed as long polycistronic
  precursors in which the 22 mt-tRNA genes act as punctuation marks between the
  rRNA and mRNA genes; releasing each transcript requires 5' cleavage by the
  three-subunit mitochondrial RNase P holoenzyme (MRPP1/TRMT10C,
  MRPP2/HSD17B10, MRPP3/KIAA0391) and 3' cleavage by RNase Z (ELAC2). MRPP1
  therefore sits at the first step of mitochondrial RNA maturation, and it has a
  second, separable job: with MRPP2 it forms a stable methyltransferase
  subcomplex that installs the m1R9 methyl mark needed for most mt-tRNAs to fold
  into a cloverleaf. The reported disease variants destabilise MRPP1 protein
  rather than abolishing it, and their consequence is a loss of 5'-processing
  efficiency that propagates to every mtDNA-encoded subunit at once, producing a
  combined rather than isolated respiratory chain defect — biochemically a
  complex I and complex IV deficiency with sparing of the wholly
  nuclear-encoded complex II.

  Two things make the mechanism unusual and are worth holding onto when reading
  the pathograph below. First, the lesion is quantitative and partial: mature
  mt-tRNA and mt-mRNA steady-state levels are largely preserved in patient
  fibroblasts, and what accumulates is unprocessed precursor spanning gene
  boundaries, so the translation defect reflects reduced throughput of the
  processing step rather than an absence of its product. Second, the m1R9
  methyltransferase arm of MRPP1 is measurably intact in these patients, which
  separates the two functions of the same protein and points the defect
  specifically at the RNase P cleavage reaction. Clinically the disease reported
  to date is a severe neonatal-onset presentation — lactic acidosis, hypotonia,
  feeding difficulty and sensorineural deafness from birth, with hypertrophic
  cardiac involvement and liver enzyme elevation, and death in infancy from
  respiratory failure. Only two unrelated individuals have been reported, so the
  full phenotypic range of TRMT10C deficiency, and whether milder hypomorphic
  presentations exist, is genuinely unknown.

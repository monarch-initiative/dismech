genetic:
- name: TRMT10C
  notes: >-
    Encodes MRPP1, the tRNA-methyltransferase-fold subunit of mitochondrial
    RNase P. Also known as MRPP1 and RG9MTD1. Both reported disease alleles are
    missense; the recurrent c.542G>T (p.Arg181Leu) allele is present at very low
    frequency in population databases, and c.814A>G (p.Thr272Ala) was absent from
    ExAC, ESP6500 and COSMIC.
  gene_term:
    preferred_term: TRMT10C
    term:
      id: hgnc:26022
      label: TRMT10C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data verify the pathogenicity of the c.542G>T (p.Arg181Leu) and
      c.814A>G (p.Thr272Ala) TRMT10C variants, establishing these variants as
      causative of mitochondrial disease associated with multiple respiratory
      chain abnormalities.
    explanation: >-
      States the causal conclusion after functional rescue.
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the c.542G>T (p.Arg181Leu) variant is present on the ExAC database
      (10/120,324 alleles) and ESP6500 (1/11,824 alleles) whereas the c.814A>G
      (p.Thr272Ala) TRMT10C variant is absent on ExAC, ESP6500, and COSMIC
    explanation: >-
      Gives the population frequency evidence for both alleles.
experimental_models:
- name: Lentiviral wild-type TRMT10C complementation of patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Patient-derived fibroblast lines transduced with a lentivirus carrying
    wild-type TRMT10C. This is the experiment that carries the causal argument
    for the entry, since variant-effect prediction was uninformative for the
    recurrent allele.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Protein Synthesis
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Restoring wild-type MRPP1 normalises mitochondrial translation, respiratory
      complex assembly and precursor levels in the patients' own cells.
    limitations: >-
      Fibroblasts are not an affected tissue in this disease; the muscle,
      cochlear and cardiac phenotypes are not modelled, and rescue was assessed
      only in the two available patient lines.
    readouts:
    - name: Mitochondrial de novo protein synthesis
      target: Impaired Mitochondrial Protein Synthesis
      direction: RESTORED
      interpretation: >-
        Translation recovers on restoring wild-type MRPP1, establishing the
        variants as the cause rather than a correlate.
      evidence:
      - reference: PMID:27132592
        reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The complemented cell lines displayed increased expression of MRPP1
          protein level (Figure 4A), leading to a restoration of mitochondrial
          translation (Figures 4A and 4B) and normal levels of fully assembled
          respiratory chain complexes (Figure 4C).
        explanation: >-
          Reports restoration of translation and complex assembly after
          transduction.
    - name: mt-RNA precursor abundance
      target: Impaired Mitochondrial Protein Synthesis
      direction: RESTORED
      interpretation: >-
        Precursor accumulation normalises, tying the translation rescue to the
        processing step rather than to a general effect of transduction.
      evidence:
      - reference: PMID:27132592
        reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Furthermore, the level of mt-RNA precursors, elevated in subject
          fibroblasts, normalized after lentiviral transduction with wild-type
          TRMT10C.
        explanation: >-
          Reports normalisation of the processing defect itself.
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblast cell lines from affected individuals were transfected with a
      lentiviral vector carrying a copy of the wild-type TRMT10C gene encoding
      MRPP1.
    explanation: >-
      Describes the model system used to establish causality.
diagnosis:
- name: Whole-exome sequencing
  description: >-
    Both reported subjects were diagnosed by whole-exome sequencing after
    mtDNA rearrangements, point mutations and copy-number change had been
    excluded in muscle. Because the muscle biochemistry shows a combined defect
    rather than an isolated one, nuclear genes of mitochondrial gene expression
    are the relevant search space.
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of muscle DNA from both subjects excluded mtDNA abnormalities
      (mtDNA rearrangements and point mutations) and mtDNA copy number was shown
      to be normal in each case
    explanation: >-
      Records the diagnostic sequence that preceded nuclear gene testing.
- name: Respiratory chain enzymology in skeletal muscle
  description: >-
    Spectrophotometric assay of complexes I-IV in a muscle biopsy. The pattern to
    look for is a combined complex I and IV deficiency with complex II preserved,
    which points to a lesion in mitochondrial gene expression rather than in a
    structural subunit.
  evidence:
  - reference: PMID:27132592
    reference_title: "Recessive Mutations in TRMT10C Cause Defects in Mitochondrial RNA Processing and Multiple Respiratory Chain Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical analysis of skeletal muscle samples identified clear
      mitochondrial enzyme defects involving both complex I and IV in both
      subjects, whereas complex III activity was normal in subject 1 but
      decreased in subject 2; both cases showed sparing of complex II activity
    explanation: >-
      Gives the enzymatic pattern that supports the diagnosis.

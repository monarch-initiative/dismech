    Affected individuals carry biallelic AIMP2 variants. The first two
    families were consanguineous and homozygous for p.(Tyr35Ter); the Iranian
    proband was homozygous for p.(Lys155Ter) with heterozygous carrier parents;
    and a compound heterozygous patient has since been reported.

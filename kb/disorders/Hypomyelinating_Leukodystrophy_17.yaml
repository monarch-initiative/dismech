    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells expressing the wild type proteins exhibit differentiated phenotypes with web-like structures bearing many processes following the induction of differentiation, whereas cells expressing the Y35X mutant proteins fail to differentiate."
    explanation: Direct observation of the differentiation block in an oligodendroglial cell model.
  downstream:
  - target: Deficient CNS Myelination
    description: >-
      Inferred: oligodendrocytes that fail to differentiate cannot lay down
      myelin. The cell-line study measured morphology, not myelin.
    hypothesis_groups:
    - mutant_aimp2_golgi_stress
- name: Deficient CNS Myelination
  description: >-
    Delayed and deficient myelination with white matter abnormality on MRI.
    In the one serially imaged patient, white matter signal was normal at 5
    days, myelination was mildly delayed at 2 months, and white matter loss
    with periventricular T2/FLAIR hyperintensity (which the authors thought
    might be gliosis) was present at 7 months. Published MRI descriptions
    emphasise atrophy more than a pure hypomyelination pattern, as in the
    AIMP1-related HLD3, and how much of the white matter change is primary
    myelin deficit rather than loss secondary to neuronal degeneration is not
    settled.
  biological_scale: TISSUE
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"

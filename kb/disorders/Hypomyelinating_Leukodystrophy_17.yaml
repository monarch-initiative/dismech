differential_diagnoses:
- name: Hypomyelinating Leukodystrophy 3 (AIMP1)
  description: >-
    Caused by the sibling MSC scaffold gene AIMP1, with progressive
    microcephaly, brain atrophy, spasticity and seizures; the founding HLD17
    report notes the marked phenotypic similarity.
  notes: >-
    The MONDO term (MONDO:0009843) is not bound here because the committed
    label cache and current MONDO disagree on its label.
  evidence:
  - reference: PMID:29215095
    reference_title: "Homozygosity for a nonsense variant in AIMP2 is associated with a progressive neurodevelopmental disorder with microcephaly, seizures, and spastic quadriparesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype noted in our subjects' shares marked similarity with that of hypomyelinating leukodystrophy-3 caused by mutations in closely related gene AIMP1."
    explanation: The founding report names HLD3 as the closest phenocopy.
- name: Hypomyelinating Leukodystrophy 9 (RARS1)
  description: >-
    Another multi-tRNA synthetase complex leukodystrophy; its severe form
    shares early refractory epilepsy, microcephaly and early brain atrophy.
- name: Hypomyelinating Leukodystrophy 15 (EPRS1)
  description: Another multi-tRNA synthetase complex leukodystrophy.
- name: Primary Microcephaly
  description: >-
    AIMP2 variants have been found in exome studies of congenital
    microcephaly; progressive atrophy, refractory seizures and white matter
    abnormality distinguish HLD17 from isolated primary microcephaly.

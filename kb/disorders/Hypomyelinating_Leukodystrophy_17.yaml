- name: Multi-tRNA Synthetase Complex Destabilization
  description: >-
    Loss or dysregulation of the cytoplasmic multi-tRNA synthetase complex. In
    the Aimp2 mutant mouse the complex was completely disassembled and the
    protein levels and catalytic activities of its synthetases and cofactors
    fell severely. In patient fibroblasts the only component reported is
    dysregulation of methionyl-tRNA synthetase (MARS1); full MSC assembly has
    not been reported in patient cells.
  biological_scale: MOLECULAR

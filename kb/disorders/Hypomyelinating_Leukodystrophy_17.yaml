    Serial MRI in one infant showed progression from minor microcephaly and
    atrophy with normal white matter signal at 5 days, to mildly delayed
    myelination and mild cortical atrophy at 2 months, to extreme cerebral
    atrophy with white matter loss and ventricular dilatation at 7 months.
  evidence:

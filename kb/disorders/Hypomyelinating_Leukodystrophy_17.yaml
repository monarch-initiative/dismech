      reference_title: Knockdown of Golgi Stress-Responsive Caspase-2 Ameliorates HLD17-Associated AIMP2 Mutant-Mediated Inhibition of Oligodendroglial Cell Morphological Differentiation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, CASP2 knockdown but not control knockdown reverses the phenotypes of cells expressing the mutant proteins."
      explanation: Rescue by caspase-2 knockdown supports a causal link from the Golgi stress to the differentiation block.
- name: Impaired Oligodendroglial Differentiation
  description: >-
    Failure of oligodendroglial cells to complete morphological
    differentiation. FBD-102b cells expressing p.Tyr35Ter AIMP2 did not form
    the web-like, process-bearing structures that cells expressing wild-type
    AIMP2 formed. This is the only direct evidence for an oligodendrocyte
    defect in HLD17, and it comes from an overexpression model in a mouse cell
    line.
  biological_scale: CELLULAR
  conforms_to: "cns_myelin_failure#Oligodendrocyte Differentiation Arrest and Death"
  cell_types:

mechanistic_hypotheses:
- hypothesis_group_id: msc_loss_reduced_translation
  hypothesis_label: Loss of the AIMP2 scaffold destabilises the multi-tRNA synthetase complex and reduces protein synthesis
  status: EMERGING
  description: >-
    Loss of AIMP2 protein disassembles or dysregulates the multi-tRNA
    synthetase complex, reducing protein synthesis capacity, and the developing
    brain responds with cell death and atrophy. Supported in patient
    fibroblasts and zebrafish; not yet measured in human brain or
    oligodendrocytes. It matches the reduced-translation-capacity proposal made
    for the cytoplasmic aminoacyl-tRNA synthetase leukodystrophies as a group.
  evidence:
  - reference: PMID:42719951
    reference_title: Newly identified human aminoacyl-tRNA synthetase complex interacting multifunctional protein 2 (AIMP2) loss-of-function mutations cause neurodevelopmental defects linked to cell death in a zebrafish model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show patient-derived fibroblast AIMP2 mutations cause decreased protein expression, attenuation of protein synthesis, and dysregulation of the MSC component, methionyl-tRNA synthetase (MARS1)."
    explanation: Patient-cell evidence for the protein loss, translation and MSC limbs of the hypothesis.
  - reference: PMID:29576217
    reference_title: "Bi-allelic Mutations in EPRS, Encoding the Glutamyl-Prolyl-Aminoacyl-tRNA Synthetase, Cause a Hypomyelinating Leukodystrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We therefore hypothesized that leukodystrophies caused by mutations in genes encoding cytoplasmic aminoacyl-tRNA synthetases share a common underlying mechanism, such as reduced protein availability, abnormal assembly of the multisynthetase complex, and/or abnormal aminoacylation, all resulting in reduced translation capacity and insufficient myelin deposition in the developing brain."
    explanation: >-
      The group-level hypothesis, stated for the synthetase leukodystrophies
      in an EPRS1 paper; applying it to the AIMP2 scaffold is an extension.
  - reference: PMID:33324001
    reference_title: Hypomyelinating leukodystrophies - unravelling myelin biology.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes associated with hypomyelination include those that encode structural myelin proteins but also many that encode proteins involved in RNA translation and some lysosomal proteins."
    explanation: >-
      A review places translation-machinery genes among the recognised causes
      of hypomyelination, the class this hypothesis assigns AIMP2 to.
- hypothesis_group_id: mutant_aimp2_golgi_stress
  hypothesis_label: Truncated AIMP2 aggregates in the Golgi and triggers caspase-2 Golgi stress that blocks oligodendrocyte differentiation
  status: EMERGING
  description: >-
    Overexpressed p.Tyr35Ter AIMP2 aggregates in the Golgi of a mouse
    oligodendroglial cell line, activates Golgi-stress caspase-2 signalling and
    prevents morphological differentiation, which caspase-2 knockdown reverses.
    This is a toxic-product model. ClinGen gives loss of function as the
    disease mechanism, and the model has not been tested in patient cells or
    with endogenous expression levels.
  evidence:
  - reference: PMID:34523057
    reference_title: Knockdown of Golgi Stress-Responsive Caspase-2 Ameliorates HLD17-Associated AIMP2 Mutant-Mediated Inhibition of Oligodendroglial Cell Morphological Differentiation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that HLD17-associated AIMP2 mutant proteins are localized in the Golgi bodies where their proteins stimulate Golgi stress-responsive CASP2 to inhibit differentiation; this effect is ameliorated by knockdown of CASP2."
    explanation: The authors' own statement of the model.

- name: AIMP2
  gene_term:
    preferred_term: AIMP2
    term:
      id: hgnc:20609
      label: AIMP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    AIMP2 (aliases p38, JTV-1) encodes aminoacyl tRNA synthetase complex
    interacting multifunctional protein 2, a non-catalytic scaffold of the
    multi-tRNA synthetase complex. ClinGen classifies AIMP2 for HLD17 as
    Definitive (autosomal recessive) on six variants in seven probands, and
    notes the c.105C>A p.(Tyr35Ter) allele as a likely founder variant in
    people of Indian descent.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ba6f8aa3-9aa9-4755-8dec-bb5c69005bbe-2025-09-03T160000.000Z
    evidence:

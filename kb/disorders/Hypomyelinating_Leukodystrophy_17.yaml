name: Hypomyelinating Leukodystrophy 17
creation_date: "2026-10-31T19:00:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 17 (HLD17) is an ultra-rare autosomal
  recessive neurodevelopmental disorder caused by biallelic loss-of-function
  variants in AIMP2. AIMP2 (also called p38 or JTV-1) is a non-enzymatic
  scaffold of the cytoplasmic multi-tRNA synthetase complex (MSC), the assembly
  of eight aminoacyl-tRNA synthetases and three scaffold proteins (AIMP1-3)
  that charges tRNAs for translation. Affected children, most from
  consanguineous families, have microcephaly (present at birth in some), early
  and often refractory seizures, spastic quadriparesis, severe developmental
  delay and intellectual disability. Brain MRI shows delayed myelination and
  white matter abnormality together with prominent and progressive atrophy of
  the cerebrum, cerebellum and spinal cord, a thin corpus callosum, an enlarged
  cisterna magna and T2-hypointense basal ganglia. The picture closely
  resembles hypomyelinating leukodystrophy 3, caused by the sibling scaffold
  gene AIMP1. ClinGen classifies the AIMP2 relationship as Definitive with
  loss of function as the mechanism. In patient fibroblasts the variants
  reduce AIMP2 protein, attenuate protein synthesis and dysregulate the MSC
  synthetase MARS1, and aimp2 disruption in zebrafish increases cell death and
  atrophy in the developing brain. A separate line of work, overexpression of
  the truncating p.Tyr35Ter product in a mouse oligodendroglial cell line,
  proposes Golgi stress and caspase-2 activation as a cause of failed
  oligodendrocyte differentiation; how far that applies to patients, whose
  alleles are loss of function, is open. AIMP2 also has functions outside the
  MSC (p53-mediated apoptosis, TNF and TGF-beta signalling), but none has been
  tested in this disease. No disease-modifying treatment is reported.

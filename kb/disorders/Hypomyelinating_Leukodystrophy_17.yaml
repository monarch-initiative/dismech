discussions:
- discussion_id: hld17_canonical_or_noncanonical_aimp2
  kind: KNOWLEDGE_GAP
  attaches_to:
  - mechanistic_hypotheses#msc_loss_reduced_translation
  - pathophysiology#Increased Neural Cell Death
  prompt: >-
    Is the brain cell death in AIMP2 deficiency caused by loss of the
    multi-tRNA synthetase complex, or by loss of AIMP2's functions outside it?
  rationale: >-
    Outside the MSC, AIMP2 promotes apoptosis: it stabilises p53 after DNA
    damage, and its depletion makes cells more resistant to DNA damage-induced
    apoptosis. Loss of that function would predict less cell death, not the
    increased brain cell death seen in aimp2-disrupted zebrafish, which points
    towards the MSC and translation route. But no study has separated the two
    in neural cells, and the TNF and TGF-beta roles of AIMP2 have not been
    looked at in this disease at all.
  evidence:
  - reference: PMID:18695251
    reference_title: "AIMP2/p38, the scaffold for the multi-tRNA synthetase complex, responds to genotoxic stresses via p53."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depletion of AIMP2 increased resistance to DNA damage-induced apoptosis, and introduction of AIMP2 into AIMP2-deficient cells restored the susceptibility to apoptosis."
    explanation: The pro-apoptotic non-canonical role of AIMP2, measured in cultured cells.
- discussion_id: hld17_golgi_stress_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Mutant AIMP2 Golgi Aggregation and Caspase-2 Golgi Stress
  prompt: >-
    Does a truncated AIMP2 product accumulate in patient cells, or is the
    Golgi-stress model a consequence of overexpression?
  rationale: >-
    The caspase-2 model rests on overexpressing p.Tyr35Ter AIMP2 in a mouse
    oligodendroglial line. Patient alleles are loss of function, and in patient
    fibroblasts AIMP2 protein is reduced. If no truncated product is made at
    endogenous levels, the Golgi aggregation cannot be the disease mechanism,
    however clean the knockdown rescue is in culture. Checking for the product
    and for Golgi stress in patient cells, or in oligodendrocytes derived from
    them, would settle it.
- discussion_id: hld17_mouse_lethality_versus_human_survival
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Multi-tRNA Synthetase Complex Destabilization
  prompt: >-
    Why is Aimp2 loss lethal within two days in the mouse while children
    homozygous for truncating AIMP2 alleles survive?
  rationale: >-
    The mouse is the only in vivo evidence that AIMP2 loss disassembles the
    MSC, but its neonatal lethality does not match the human course. The mouse
    allele may be more severe than the human ones, the human alleles may keep
    some function, or the species may differ in MSC dependence. Until that is
    known, the degree of MSC loss in patients cannot be read off the mouse.
- discussion_id: hld17_no_disease_modifying_treatment
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying treatment for HLD17?
  rationale: >-
    None is reported. Anticodon-engineered suppressor tRNAs raised the
    expression of AIMP2 nonsense variants in a laboratory system, which makes
    read-through a candidate for the nonsense alleles that dominate the
    reported genotypes, but this is a cell-based result and is not curated as
    a treatment.
  evidence:
  - reference: PMID:42719951
    reference_title: Newly identified human aminoacyl-tRNA synthetase complex interacting multifunctional protein 2 (AIMP2) loss-of-function mutations cause neurodevelopmental defects linked to cell death in a zebrafish model.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We tested anticodon engineered suppressor tRNAs on expression of disease-associated nonsense mutations and found that they dramatically increase protein expression of AIMP2 variants."
    explanation: The suppressor tRNA result that motivates the question.
notes: >-
  No GeneReviews chapter covers HLD17 or AIMP2 (checked with
  `just check-genereviews`). Two further reports cited by the ClinGen
  curation (PMID:26795593, an epilepsy exome cohort, and PMID:38374194, an
  Iranian clinical sequencing cohort) do not name AIMP2 in their PubMed
  abstract (first) or PMC full text (second), so their patients
  are not curated individually here.
  The name follows the existing numbered hypomyelinating leukodystrophy
  series; "AIMP2-related leukodystrophy" appears in one case report only and
  is kept as a synonym.

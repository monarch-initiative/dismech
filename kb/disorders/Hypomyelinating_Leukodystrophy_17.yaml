      reference_title: "AIMP2 / leukodystrophy, hypomyelinating, 17 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "AIMP2 | HGNC:20609 | leukodystrophy, hypomyelinating, 17 | MONDO:0054817 | AR | Definitive"
      explanation: ClinGen Definitive classification for AIMP2 in HLD17.
  evidence:
  - reference: CGGV:assertion_ba6f8aa3-9aa9-4755-8dec-bb5c69005bbe-2025-09-03T160000.000Z
    reference_title: "AIMP2 / leukodystrophy, hypomyelinating, 17 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Six variants (2 frameshift, 2 nonsense, 1 missense, 1 splice-site) that have been reported in 7 probands in 5 publications"
    explanation: Variant classes and proband count in the ClinGen curation.
  - reference: PMID:42719951
    reference_title: Newly identified human aminoacyl-tRNA synthetase complex interacting multifunctional protein 2 (AIMP2) loss-of-function mutations cause neurodevelopmental defects linked to cell death in a zebrafish model.
    supports: SUPPORT

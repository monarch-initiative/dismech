  description: >-
    Neurologic evaluation every six to twelve months for motor signs, gait,
    neuropsychiatric symptoms, cognition and treatment efficacy; neuropsychiatric
    and cognitive assessment as needed; orthostasis, blood pressure and
    constipation at each visit; echocardiography as needed in those on
    ergot-derived dopamine agonists.

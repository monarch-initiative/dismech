    term:
      id: NCIT:C81313
      label: Neurologic Examination
  evidence:
  - reference: PMID:28796472
    reference_title: VPS35-Related Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Neurologic evaluations to assess tremor, bradykinesia, rigidity, gait, neuropsychiatric symptoms, cognition, and treatment efficacy every six to 12 months or as needed; neuropsychiatric and cognitive assessments as needed; assess for symptoms of orthostasis, measure blood pressure, and assess for constipation at each visit; echocardiogram as needed in those treated with ergot-derived dopamine agonists; assess family and social work needs at each visit."

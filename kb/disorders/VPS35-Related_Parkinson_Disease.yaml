notes: >-
  Lump-vs-split rationale: this entry is kept separate from the
  `Parkinsons_Disease` basket (MONDO:0005180), which curates the common, mostly
  idiopathic alpha-synucleinopathy, and sits beside the other per-gene Mendelian
  entries (`LRRK2-Related_Parkinson_Disease`, `PRKN-Related_Juvenile_Parkinson_Disease`,
  `PINK1-Related_Early-Onset_Parkinson_Disease`, `PARK7-Related_Early-Onset_Parkinson_Disease`).
  The case for a separate entry is mechanistic: the root lesion is a retromer
  cargo-sorting defect with no counterpart in the basket's graph, and whether the
  disease is an alpha-synucleinopathy at all is open (one Lewy-body-negative
  autopsy; the three knock-in mouse lines disagree with one another on
  synuclein and tau), so the basket's alpha-synuclein anchor cannot be
  assumed. Clinically the disease is
  indistinguishable from sporadic Parkinson disease except for onset about a
  decade earlier, which is why GeneReviews says so in its first sentence and why
  the phenotype section here mirrors the basket's rather than adding to it. The
  basket keeps a thin PARK17 row in `has_subtypes` and a one-paragraph VPS35
  row in `genetic`; the mechanism is curated only here. Entry naming: the name
  is the GeneReviews chapter title (PMID:28796472, "VPS35-Related Parkinson
  Disease"), which design decision 18 counts as an established dyadic name; MONDO
  carries the synonyms "VPS35 Parkinson disease" and "PARK17", kept in `synonyms`.
  ClinGen note: the Parkinson's Disease GCEP classifies VPS35 as Definitive,
  autosomal dominant, against Parkinson disease (MONDO:0005180), not against
  MONDO:0013625, so the assertion is quoted on the `genetic` row and not copied
  into `gene_disease_validity` (same handling as the PINK1 entry).
  Named-entity-confusion preflight: MONDO:0013625 was read from OLS on 2026-11-17
  (label "Parkinson disease 17", synonyms "PARK17", "VPS35 Parkinson disease",
  "Parkinson disease caused by mutation in VPS35", parent MONDO:0008199 late-onset
  Parkinson disease). The only authenticated pathogenic allele is p.Asp620Asn;
  the other reported missense variants (p.Pro316Ser, p.Arg524Trp, p.Leu774Met,
  p.Gly51Ser) are recorded on the variant list with their uncertain status and
  are not asserted as pathogenic. The 2008 Swiss family (PMID:18342564) is the
  kindred in which the gene was later found (PMID:21763482 names "a Swiss
  kindred" with the same tremor-predominant, dopa-responsive, mean-onset-about-50
  phenotype); its autopsy is the only published neuropathology of a D620N carrier
  and is cited with that inference stated. Mechanism: the direction of the D620N
  effect is contested (partial loss of function in one knock-in line, a fully
  functional protein in another, and a gain of LRRK2-activating function), so the
  root node carries no `functional_impact_category` and the dispute is a
  CONTROVERSY discussion rather than a resolved slot value. Deep-research
  provenance: the falcon provider failed on authentication and openscientist on
  its daily spend limit, so the claude_code provider was run
  (`research/VPS35-Related_Parkinson_Disease-deep-research-claude_code.md`, 31
  citations, all resolved, `needs_review` set only for two mislabelled terms
  that were not used); `just preflight-dr` returned PASS. The report was used as
  a completeness cross-check and surfaced the mitochondrial-fission arm and the
  third knock-in line, both then read from their cached abstracts. Every claim
  here is sourced to a cached primary reference read directly; all snippets are
  quoted from abstracts, except two quotes from cached full texts that record
  negative results the abstracts omit (the Niu et al. tau non-replication and
  the Zavodszky et al. normal CIMPR localisation); each item says so in its
  explanation. Two further model systems named in the deep-research report are
  deliberately not recorded: a rat viral-overexpression model and a Drosophila
  study, both reached only through reviews and neither read from a primary
  cached source; the rat model is also supraphysiological expression. They are
  not re-nomination targets until a primary source is cached. Mis-recalled
  identifiers: of thirteen PMIDs first
  written from memory for this entry, seven resolved to unrelated papers and were
  discarded after fetching; every identifier in the entry was then found by a
  PubMed title search and its cached title checked, which is the procedure the
  repository's CURIE rule asks for.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous p.Asp620Asn segregates with disease in large kindreds with high
    but incomplete penetrance; about 90% of diagnosed individuals have a family
    history, and unaffected carriers are documented.
  evidence:
  - reference: PMID:28796472
    reference_title: VPS35-Related Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PARK-VPS35 is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance directly.
  - reference: PMID:21763483
    reference_title: "A mutation in VPS35, encoding a subunit of the retromer complex, causes late-onset Parkinson disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By screening additional PD cases, we saw the same variant cosegregating with the disease in an autosomal-dominant mode with high but incomplete penetrance in two further families with five and ten affected members, respectively."
    explanation: Cosegregation in an autosomal dominant mode with incomplete penetrance in the Austrian discovery families.
  - reference: PMID:22801713
    reference_title: Frequency of the D620N mutation in VPS35 in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An affected paternal aunt and 3 reportedly unaffected siblings were also found to be mutation carriers."
    explanation: Unaffected carriers in an extended family, the direct observation behind incomplete penetrance.
prevalence:
- population: Worldwide

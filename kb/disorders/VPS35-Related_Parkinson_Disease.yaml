discussions:
- discussion_id: ctrl_vps35_d620n_loss_vs_gain_of_function
  prompt: >-
    Is VPS35 p.Asp620Asn a partial loss of retromer function, a fully functional
    protein with a gain of LRRK2-activating function, or both, and which of these
    drives dopaminergic degeneration?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#VPS35 p.Asp620Asn Variant
  - pathophysiology#Enhanced LRRK2-Mediated Rab Phosphorylation
  - pathophysiology#Impaired Synaptic Receptor Recycling and Dopamine Release
  rationale: >-
    Three lines of evidence point in different directions. One knock-in line
    (compound heterozygous with a null allele, and with reduced dopamine release)
    reads the allele as a partial loss of function; another knock-in line finds a
    single D620N allele sufficient for survival and dopaminergic maintenance on a
    null background, so the protein is fully functional, while it still produces
    degeneration, pointing to a gain of function; and the allele strikingly
    raises LRRK2-mediated Rab phosphorylation, a gain of function in the LRRK2
    axis. In neurons the variant behaves as a loss of function for AMPA receptor
    recycling. These need not be exclusive: the WASH-binding defect is a loss of
    one interaction, and the LRRK2 effect may follow from it. The root node
    therefore carries no functional_impact_category. The question matters for
    therapy, since a LRRK2-dependent gain of function would be addressable with
    LRRK2 kinase inhibitors and a retromer loss of function would not.
  evidence:
  - reference: PMID:28173004
    reference_title: Impaired striatal dopamine release in homozygous Vps35 D620N knock-in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, these results suggest that Vps35 D620N allele is a partial-loss-of-function allele and that such a genetic predisposition and age-related alterations in the nigrostriatal dopamine system cooperatively influence the pathogenesis of PARK17."
    explanation: The partial-loss-of-function reading.
  - reference: PMID:30842285
    reference_title: "Parkinson's disease-linked D620N VPS35 knockin mice manifest tau neuropathology and dopaminergic neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, by crossing VPS35 KI and null mice, our data demonstrate that a single D620N VPS35 allele is sufficient for survival and early maintenance of dopaminergic neurons, indicating that the D620N VPS35 protein is fully functional."
    explanation: The fully-functional reading from a second knock-in line.
  - reference: PMID:29743203
    reference_title: "The Parkinson's disease VPS35[D620N] mutation enhances LRRK2-mediated Rab protein phosphorylation in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our observations indicate that VPS35 controls LRRK2 activity and that the VPS35 ... mutation results in a gain of function, potentially causing PD through hyperactivation of the LRRK2 kinase."
    explanation: The gain-of-function reading.
  - reference: PMID:25416282
    reference_title: "Retromer-dependent neurotransmitter receptor trafficking to synapses is altered by the Parkinson's disease VPS35 mutation p.D620N."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "VPS35 p.D620N acts as a loss-of-function mutation with respect to VPS35 activity regulating synaptic transmission and AMPAR recycling in mouse cortical neurons and dopamine neuron-like cells produced from induced pluripotent stem cells of human p.D620N carriers."
    explanation: The synaptic loss-of-function reading, in neurons and carrier-derived cells.
- discussion_id: kg_vps35_human_neuropathology
  prompt: >-
    What is the neuropathology of VPS35 p.Asp620Asn carriers, and is the disease
    an alpha-synucleinopathy, a tauopathy, or neither?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Alpha-Synuclein Accumulation
  - pathophysiology#Tau Pathology
  - pathophysiology#Mitochondrial Fragmentation via Enhanced VPS35-DLP1 Interaction
  - histopathology#Lewy-Body-Negative Parkinsonism in the One Autopsied Carrier
  rationale: >-
    A single autopsy exists, from the Swiss kindred before the gene was found,
    and it showed no Lewy bodies and no alpha-synuclein immunoreactivity. The
    knock-in lines disagree on both proteins: the Chen line lacks synuclein
    pathology but develops widespread hyperphosphorylated tau, while the Niu
    line accumulates and aggregates alpha-synuclein in nigral neurons at 14
    months and finds no tau pathology with the same antibodies; a
    VPS35-deficiency model also accumulates alpha-synuclein. The entry carries both an alpha-synuclein node,
    conformed to the module's anchor so the disagreement is visible, and a tau
    node, each at low confidence. Resolving this needs autopsy of genotyped
    carriers with synuclein and tau immunohistochemistry, and it decides whether
    this disease belongs with the synucleinopathies the basket entry models.
  proposed_experiments:
  - experiment_id: exp_vps35_carrier_autopsy_series
    name: Neuropathological series of genotyped VPS35 p.Asp620Asn carriers
    description: >-
      Collect brains from genotyped carriers through the existing kindreds and
      brain banks, and stain the substantia nigra, locus coeruleus, limbic and
      neocortical regions for alpha-synuclein, phospho-tau and TDP-43 with
      stereological nigral counts, scored against age-matched sporadic Parkinson
      disease and controls. Even a handful of cases would settle whether the
      knock-in mouse's tau pathology and the Swiss autopsy's absence of Lewy
      bodies generalise.
  evidence:
  - reference: PMID:18342564
    reference_title: Autosomal dominant dopa-responsive parkinsonism in a multigenerational Swiss family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathological examination demonstrated no Lewy bodies and immunostaining was negative for alpha-synuclein."
    explanation: The single human autopsy.
  - reference: PMID:30842285
    reference_title: "Parkinson's disease-linked D620N VPS35 knockin mice manifest tau neuropathology and dopaminergic neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, we find no evidence for α-synuclein-positive neuropathology in aged VPS35 KI mice, a hallmark of Lewy body pathology in PD."
    explanation: One knock-in mouse agrees with the autopsy on synuclein.
  - reference: PMID:33745227
    reference_title: "VPS35 D620N knockin mice recapitulate cardinal features of Parkinson's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data support the involvement of VPS35 in the development of α-synuclein pathology in vivo and revealed the important role of mitochondrial fragmentation/dysfunction in the pathogenesis of VPS35 D620N mutation-associated PD in vivo."
    explanation: The other knock-in line disagrees on synuclein.
  - reference: PMID:33745227
    reference_title: "VPS35 D620N knockin mice recapitulate cardinal features of Parkinson's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, we did not find any tau pathology stained in the SNpc area by either AT8 or MC‐1 (Figure 3a), nor in the cortex (not shown)."
    explanation: And disagrees on tau, from the cached full text.
  - reference: PMID:26203154
    reference_title: "VPS35 in Dopamine Neurons Is Required for Endosome-to-Golgi Retrieval of Lamp2a, a Receptor of Chaperone-Mediated Autophagy That Is Critical for α-Synuclein Degradation and Prevention of Pathogenesis of Parkinson's Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "VPS35-deficient mice exhibited PD-relevant deficits including accumulation of α-synuclein in SNpc-DA neurons, loss of DA transmitter and DA neurons in SNpc and STR, and impairment of locomotor behavior."
    explanation: The deficiency model that disagrees.
- discussion_id: eh_vps35_lrrk2_inhibitor_therapy
  prompt: >-
    Would LRRK2 kinase inhibitors, now in clinical trials for LRRK2-related
    disease, benefit VPS35 p.Asp620Asn carriers, given that the variant raises
    LRRK2 activity more than LRRK2's own pathogenic mutations do?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Enhanced LRRK2-Mediated Rab Phosphorylation
  rationale: >-
    The knock-in and patient-cell data place VPS35 upstream of LRRK2 and show
    Rab10 phosphorylation raised in carriers' blood cells, which is also a
    measurable pharmacodynamic readout. The hypothesis is recorded as a
    discussion and not as a treatment because no trial or case series has tested
    a LRRK2 inhibitor in a VPS35 carrier, and because the CONTROVERSY above
    leaves open whether the LRRK2 arm is the one that produces degeneration.
  evidence:
  - reference: PMID:29743203
    reference_title: "The Parkinson's disease VPS35[D620N] mutation enhances LRRK2-mediated Rab protein phosphorylation in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Moreover, patients with VPS35 ... associated Parkinson's might benefit from LRRK2 inhibitor treatment that have entered clinical trials in humans."
    explanation: The authors' therapeutic proposal; INDIRECT because it is an inference from the biochemistry.

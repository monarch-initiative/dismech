name: VPS35-Related Parkinson Disease
creation_date: "2026-11-17T18:00:00Z"
description: >-
  VPS35-related Parkinson disease (PARK17, PARK-VPS35) is an autosomal dominant,
  late-onset parkinsonism caused by the heterozygous p.Asp620Asn missense variant
  in VPS35, the cargo-recognition subunit of the retromer complex. The variant
  weakens retromer's association with the actin-nucleating WASH complex and
  perturbs endosome-to-Golgi retrieval of cargo such as the cation-independent
  mannose-6-phosphate receptor and the chaperone-mediated-autophagy receptor
  LAMP2A, with impaired autophagic and lysosomal degradation, enhanced
  LRRK2-mediated Rab phosphorylation, mitochondrial fragmentation through an
  increased VPS35-DLP1 interaction, and reduced synaptic receptor recycling and
  striatal dopamine release as the downstream cellular consequences. The clinical
  picture is indistinguishable from sporadic Parkinson disease apart from a
  median onset about a decade earlier (around 50 years), a usually milder course
  with fewer atypical signs, and a marked and sustained levodopa response.
  Penetrance is high but incomplete. The one autopsied carrier lacked Lewy
  bodies, and the knock-in mouse lines disagree on whether alpha-synuclein or
  tau pathology develops, so whether this is an alpha-synucleinopathy is
  unresolved.
category: Mendelian
parents:
- Neurodegenerative Disease
- Movement Disorder
disease_term:
  preferred_term: Parkinson disease 17
  term:

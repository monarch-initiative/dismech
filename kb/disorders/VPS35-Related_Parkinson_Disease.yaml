biochemical:
- name: LRRK2-phosphorylated Rab10 in peripheral blood cells
  presence: INCREASED
  context: >-
    Research-grade readout in neutrophils and monocytes; no clinical assay or
    reference interval exists.
  biomarker_term:
    preferred_term: LRRK2-phosphorylated Rab10 (pRab10) in neutrophils and monocytes
  notes: >-
    The one carrier-specific molecular readout reported in patients, and the
    candidate pharmacodynamic marker for the LRRK2-inhibitor hypothesis. No NCIT
    biomarker term is bound: the KB's NCIT cache holds no phospho-Rab10 concept,
    and NCIT has no term for a phosphorylated Rab GTPase.
  evidence:
  - reference: PMID:29743203
    reference_title: "The Parkinson's disease VPS35[D620N] mutation enhances LRRK2-mediated Rab protein phosphorylation in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, LRRK2-mediated Rab10 phosphorylation is increased in neutrophils as well as monocytes isolated from three Parkinson's patients with a heterozygous VPS35 ... mutation compared with healthy donors and idiopathic Parkinson's patients."
    explanation: The measurement in cells from three carriers.
  readouts:
  - target: Enhanced LRRK2-Mediated Rab Phosphorylation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: CANDIDATE_SURROGATE
    interpretation: >-
      Raised pRab10 in blood cells reads out LRRK2 hyperactivity downstream of
      the VPS35 variant and would fall under LRRK2 kinase inhibition; no regulator
      has accepted it as an endpoint.
    evidence:
    - reference: PMID:29743203
      reference_title: "The Parkinson's disease VPS35[D620N] mutation enhances LRRK2-mediated Rab protein phosphorylation in mouse and human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Furthermore, LRRK2-mediated Rab10 phosphorylation is increased in neutrophils as well as monocytes isolated from three Parkinson's patients with a heterozygous VPS35 ... mutation compared with healthy donors and idiopathic Parkinson's patients."
      explanation: The readout measured in carriers.
histopathology:
- name: Lewy-Body-Negative Parkinsonism in the One Autopsied Carrier
  description: >-
    The only published neuropathology of a p.Asp620Asn carrier, from the Swiss
    kindred in which the variant was later identified, showed no Lewy bodies and
    negative alpha-synuclein immunostaining. Whether VPS35-related disease is a
    synucleinopathy therefore remains open; the Chen et al. knock-in line
    likewise lacks synuclein pathology and instead shows tau pathology, while
    the Niu et al. line shows the reverse.
  finding_term:
    preferred_term: parkinsonism without Lewy bodies or alpha-synuclein immunoreactivity
    term:
      id: NCIT:C50774
      label: Tissue Degeneration
  diagnostic: false
  notes: >-
    The finding_term is bound to the generic NCIT morphologic finding Tissue
    Degeneration, as in the PRKN and PINK1 entries, because the
    HistopathologyFindingTerm branch has no term for absence of Lewy bodies. The
    carrier status of the autopsied individual is inferred from the kindred
    (PMID:21763482 describes the Swiss kindred of PMID:18342564 carrying
    p.Asp620Asn), which the evidence items state.
  evidence:
  - reference: PMID:18342564
    reference_title: Autosomal dominant dopa-responsive parkinsonism in a multigenerational Swiss family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Pathological examination demonstrated no Lewy bodies and immunostaining was negative for alpha-synuclein."
    explanation: The autopsy finding; INDIRECT because this 2008 report predates the gene and the carrier status follows from the kindred's later genotyping.
  - reference: PMID:21763482
    reference_title: VPS35 mutations in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study describes the application of next-generation sequencing technologies to a Swiss kindred presenting with autosomal-dominant, late-onset Parkinson disease (PD)."
    explanation: Identifies the Swiss kindred whose autopsy the first item reports.

    Treatment does not differ from sporadic Parkinson disease. Levodopa with
    carbidopa or benserazide is the mainstay and most individuals respond well.
    Drugs that may induce or exacerbate parkinsonism (neuroleptics,
    antidepressants, calcium channel blockers, valproate, lithium, amiodarone)
    are avoided.

    as a measured rate.
  evidence:
  - reference: PMID:22801713
    reference_title: Frequency of the D620N mutation in VPS35 in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "VPS35 mutations are a rare cause of PD in different populations."
    explanation: The authors' conclusion from screening 1,774 patients; it supports the rarity band without measuring population prevalence.
progression:
- phase: Age at onset
  notes: >-
    Median onset about 50 years, a decade earlier than sporadic Parkinson disease,
    with a range from the third to the eighth decade. The discovery families had
    mean onsets of about 51 and 53 years.
  evidence:
  - reference: PMID:28796472
    reference_title: VPS35-Related Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age of onset is approximately 50 years, with a range of onset spanning the third to eighth decade of life."
    explanation: GeneReviews gives the median and range of onset.
  - reference: PMID:21763482
    reference_title: VPS35 mutations in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The family has tremor-predominant dopa-responsive parkinsonism with a mean onset of 50.6 ± 7.3 years."
    explanation: Mean onset in the Swiss discovery kindred.
  - reference: PMID:21763483
    reference_title: "A mutation in VPS35, encoding a subunit of the retromer complex, causes late-onset Parkinson disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of onset in the affected individuals was 53 years."
    explanation: Mean onset in the Austrian discovery families.
- phase: Disease course
  notes: >-
    Usually milder than sporadic Parkinson disease, with fewer atypical signs,
    slow progression and a sustained levodopa response; motor fluctuations and
    dyskinesia occur. One carrier followed for 13 years progressed from
    Hoehn and Yahr stage 1 to 3.
  evidence:
  - reference: PMID:28796472
    reference_title: VPS35-Related Parkinson Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease course is usually milder than that of simplex Parkinson disease of unknown cause, with a decreased incidence of atypical signs."
    explanation: GeneReviews statement of the course.
  - reference: PMID:18342564
    reference_title: Autosomal dominant dopa-responsive parkinsonism in a multigenerational Swiss family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease progression was slow but severe motor fluctuations occurred."
    explanation: Slow progression with motor fluctuations in the Swiss kindred later shown to carry p.Asp620Asn.
  - reference: PMID:22801713
    reference_title: Frequency of the D620N mutation in VPS35 in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal follow-up over 13 years revealed a disease progression from Hoehn and Yahr stage 1 to 3."
    explanation: A documented 13-year course in a single carrier.
genetic:
- name: VPS35
  gene_term:
    preferred_term: VPS35
    term:
      id: hgnc:13487
      label: VPS35
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: present
  association: >-
    A heterozygous missense variant, c.1858G>A p.Asp620Asn, in VPS35 at 16q11.2
    causes autosomal dominant late-onset Parkinson disease. The gene encodes the
    796-residue cargo-recognition subunit of the retromer complex. The variant
    was found independently by exome sequencing of a Swiss and an Austrian kindred
    in 2011 and is the only VPS35 allele established as pathogenic.
  notes: >-
    The ClinGen Definitive tier quoted below is asserted against Parkinson
    disease (MONDO:0005180), not against this entry's MONDO term, and is
    therefore not recorded in `gene_disease_validity`. Other reported VPS35
    missense variants have not been shown pathogenic; they are listed under
    `variants` with their status rather than omitted, so they are not
    re-nominated as causal.
  evidence:
  - reference: PMID:21763482
    reference_title: VPS35 mutations in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome analysis suggests that an aspartic-acid-to-asparagine mutation within vacuolar protein sorting 35 (VPS35 c.1858G>A; p.Asp620Asn) is the genetic determinant of disease."
    explanation: The Swiss discovery report.
  - reference: PMID:21763482
    reference_title: VPS35 mutations in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VPS35 c.1858G>A was found in all affected members of the Swiss kindred and in three more families and one patient with sporadic PD, but it was not observed in 3,309 controls."
    explanation: Segregation and absence from controls.
  - reference: PMID:21763483
    reference_title: "A mutation in VPS35, encoding a subunit of the retromer complex, causes late-onset Parkinson disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a missense mutation, c.1858G>A (p.Asp620Asn), in the VPS35 gene in all seven affected family members who are alive."
    explanation: The independent Austrian discovery report.
  - reference: PMID:23125461
    reference_title: A multi-centre clinico-genetic analysis of the VPS35 gene in Parkinson disease indicates reduced penetrance for disease-associated variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study apart from identifying the p.Asp620Asn variant in familial cases also identified it in idiopathic Parkinson disease cases, and thus provides genetic evidence for a role of p.Asp620Asn in Parkinson disease in different populations worldwide."
    explanation: Replication across more than 15,000 individuals from 19 countries.
  - reference: CGGV:assertion_b0e546d6-8a44-4e9d-83aa-f781ec4ec166-2021-11-03T134517.796Z
    reference_title: VPS35 / Parkinson disease (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VPS35 | HGNC:13487 | Parkinson disease | MONDO:0005180 | AD | Definitive"
    explanation: >-
      ClinGen's Parkinson's Disease GCEP classifies the VPS35 gene-disease
      relationship as Definitive with autosomal dominant inheritance, against the
      broad term MONDO:0005180; quoted as evidence and not copied into
      `gene_disease_validity`.
  case_fractions:
  - population: Parkinson disease cases from 23 sites in 19 countries (Genetic Epidemiology of Parkinson disease Consortium)
    case_fraction_percent: 0.08
    cohort_size: 8870
    notes: >-
      p.Asp620Asn in 5 familial and 2 sporadic cases among 8,870 patients
      (0.08%); the two other variants screened, p.Leu774Met and p.Gly51Ser, showed
      no increased risk.
    evidence:
    - reference: PMID:23125461
      reference_title: A multi-centre clinico-genetic analysis of the VPS35 gene in Parkinson disease indicates reduced penetrance for disease-associated variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "p.Asp620Asn was detected in 5 familial and 2 sporadic PD cases and not in healthy controls, p.Leu774Met in 6 cases and 1 control, p.Gly51Ser in 3 cases and 2 controls."
      explanation: The carrier counts behind the fraction; the 8,870-case denominator is stated in the paper's methods.
  - population: Parkinson disease patients from tertiary centres in Germany, Serbia, Chile and the United States
    case_fraction_percent: 0.06
    cohort_size: 1774
    notes: One p.Asp620Asn carrier among 1,774 patients (0.06%).
    evidence:
    - reference: PMID:22801713
      reference_title: Frequency of the D620N mutation in VPS35 in Parkinson disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A single mutation carrier was identified."
      explanation: The numerator; the abstract gives the denominator of 1,774 patients.
  variants:
  - name: p.Asp620Asn
    description: >-
      c.1858G>A, the only VPS35 variant established as pathogenic. It segregates
      with disease in Swiss, Austrian and further kindreds and is absent from
      thousands of controls. The protein is correctly folded and binds its
      retromer partners VPS26 and VPS29 normally; its defect is in binding the
      WASH complex.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21763482
      reference_title: VPS35 mutations in Parkinson disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "VPS35 c.1858G>A was found in all affected members of the Swiss kindred and in three more families and one patient with sporadic PD, but it was not observed in 3,309 controls."
      explanation: Segregation and control data for the founding allele.
    - reference: PMID:24152121
      reference_title: "The Vps35 D620N mutation linked to Parkinson's disease disrupts the cargo sorting function of retromer."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Vps35 D620N is correctly folded and binds Vps29 and Vps26A with the same affinity as wild-type Vps35."
      explanation: The variant does not destabilise the retromer trimer itself.
  - name: p.Pro316Ser
    description: >-
      Found in one pedigree with two affected and one unaffected carriers in the
      Swiss discovery study; pathogenicity uncertain.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:21763482
      reference_title: VPS35 mutations in Parkinson disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Further sequencing of familial affected probands revealed only one other missense variant, VPS35 c.946C>T; (p.Pro316Ser), in a pedigree with one unaffected and two affected carriers, and thus the pathogenicity of this mutation remains uncertain."
      explanation: The authors' own statement of uncertainty.
  - name: p.Arg524Trp
    description: Detected in one sporadic case and predicted damaging in silico; not shown to segregate.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:21763483
      reference_title: "A mutation in VPS35, encoding a subunit of the retromer complex, causes late-onset Parkinson disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The familial mutation p.Asp620Asn and a further variant, c.1570C>T (p.Arg524Trp), detected in a sporadic PD case were predicted to be damaging by sequence-based and molecular-dynamics analyses."
      explanation: A single sporadic carrier with a computational prediction only.
  - name: p.Leu774Met
    description: Found in cases and in a control in the multi-centre screen, with no significant increase in risk.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:23125461
      reference_title: A multi-centre clinico-genetic analysis of the VPS35 gene in Parkinson disease indicates reduced penetrance for disease-associated variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall analyses did not reveal any significant increased risk for p.Leu774Met and p.Gly51Ser in our cohort."
      explanation: The negative association result for the two secondary variants.
pathophysiology:
- name: VPS35 p.Asp620Asn Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous missense change in the cargo-recognition subunit of the
    retromer complex. The mutant protein folds and assembles with VPS26 and VPS29
    normally, so the lesion is not loss of the complex but a change in what it
    can bind: the adaptor interaction with the WASH complex subunit FAM21 is
    weakened, which is the molecular function bound here. Whether the net effect is a partial loss of retromer function, a
    gain of function through LRRK2 activation, or both is contested (see the
    CONTROVERSY discussion), so no functional-impact category is asserted.
  genes:
  - preferred_term: VPS35
    term:
      id: hgnc:13487
      label: VPS35
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: Heterozygous c.1858G>A p.Asp620Asn; the direction of the functional effect is disputed and left unrecorded.
  molecular_functions:
  - preferred_term: retromer-to-WASH complex adaptor binding (FAM21)
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: retromer cargo-selective complex
    term:
      id: GO:0030906
      label: retromer, cargo-selective complex
  evidence:
  - reference: PMID:21763482
    reference_title: VPS35 mutations in Parkinson disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VPS35 is a central component of the retromer cargo-recognition complex, is critical for endosome-trans-golgi trafficking and membrane-protein recycling, and is evolutionarily highly conserved."
    explanation: The protein's place in the retromer complex.
  - reference: PMID:24152121
    reference_title: "The Vps35 D620N mutation linked to Parkinson's disease disrupts the cargo sorting function of retromer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Vps35 D620N is correctly folded and binds Vps29 and Vps26A with the same affinity as wild-type Vps35."
    explanation: Trimer assembly is intact, locating the defect downstream of complex formation.
  downstream:
  - target: Impaired Retromer-WASH Complex Association
    causal_link_type: DIRECT
    description: The variant lies in the surface that binds the WASH complex subunit FAM21 and lowers that affinity about two-fold.
    evidence:
    - reference: PMID:24980502
      reference_title: Retromer binding to FAM21 and the WASH complex is perturbed by the Parkinson disease-linked VPS35(D620N) mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Moreover, using isothermal calorimetry, we establish that the primary defect of the VPS35(D620N) mutant is a 2.2 ± 0.5-fold decrease in affinity for the WASH complex component FAM21."
      explanation: The quantified binding defect that the variant produces.
  - target: Mitochondrial Fragmentation via Enhanced VPS35-DLP1 Interaction
    causal_link_type: DIRECT
    description: Mutant VPS35 binds the fission GTPase DLP1 more strongly and accelerates turnover of mitochondrial DLP1 complexes, tipping the fission-fusion balance toward fragmentation.
    evidence:
    - reference: PMID:26618722
      reference_title: "Parkinson's disease-associated mutant VPS35 causes mitochondrial dysfunction by recycling DLP1 complexes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "VPS35 mutants showed increased interaction with dynamin-like protein (DLP) 1, which enhanced turnover of the mitochondrial DLP1 complexes via the mitochondria-derived vesicle-dependent trafficking of the complexes to lysosomes for degradation."
      explanation: The molecular interaction behind the mitochondrial arm.
  - target: Enhanced LRRK2-Mediated Rab Phosphorylation
    causal_link_type: DIRECT
    description: The knock-in variant raises LRRK2-dependent Rab phosphorylation in mouse tissues and in patient blood cells, so VPS35 controls LRRK2 activity by a route not yet resolved.
    evidence:
    - reference: PMID:29743203
      reference_title: "The Parkinson's disease VPS35[D620N] mutation enhances LRRK2-mediated Rab protein phosphorylation in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We reveal that the VPS35 ... knock-in mutation strikingly elevates LRRK2-mediated phosphorylation of Rab8A, Rab10, and Rab12 in mouse embryonic fibroblasts."
      explanation: The knock-in result that links the variant to LRRK2 activity.
- name: Impaired Retromer-WASH Complex Association
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Retromer recruits the actin-nucleating WASH complex to endosomes through the
    FAM21 tail. The D620N mutant associates poorly with the WASH complex and
    impairs its recruitment, and this is the primary molecular defect identified
    by interactome analysis; retromer's own assembly and its endosome-to-plasma
    membrane recycling of cargo such as GLUT1 are spared.
  cellular_components:
  - preferred_term: WASH complex
    term:
      id: GO:0071203
      label: WASH complex
  - preferred_term: endosome
    term:
      id: GO:0005768
      label: endosome
  biological_processes:
  - preferred_term: WASH-dependent actin nucleation on endosomes
    term:
      id: GO:0045010
      label: actin nucleation
    modifier: DECREASED
  evidence:
  - reference: PMID:24980502
    reference_title: Retromer binding to FAM21 and the WASH complex is perturbed by the Parkinson disease-linked VPS35(D620N) mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Through comparative stable isotope labeling by amino acids in cell culture (SILAC)-based analysis of wild-type VPS35 versus the VPS35(D620N) mutant interactomes, we establish that the major defect of the D620N mutation lies in the association to the actin-nucleating Wiskott-Aldrich syndrome and SCAR homolog (WASH) complex."
    explanation: The interactome result identifying the WASH complex as the lost partner.
  - reference: PMID:24819384
    reference_title: "Mutation in VPS35 associated with Parkinson's disease impairs WASH complex association and inhibits autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that this mutant associates poorly with the WASH complex and impairs WASH recruitment to endosomes."
    explanation: Independent demonstration of impaired WASH recruitment.
  downstream:
  - target: Defective Endosome-to-Golgi Cargo Retrieval
    causal_link_type: DIRECT
    description: Without normal WASH recruitment, retromer-dependent endosome-to-trans-Golgi transport of cargo is perturbed while plasma-membrane recycling is not.
    evidence:
    - reference: PMID:24980502
      reference_title: Retromer binding to FAM21 and the WASH complex is perturbed by the Parkinson disease-linked VPS35(D620N) mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we established that in cells expressing VPS35(D620N) there is a perturbation in endosome-to-TGN transport but not endosome-to-plasma membrane recycling, which we confirm in patient cells harboring the VPS35(D620N) mutation."
      explanation: The selective trafficking defect, confirmed in patient cells.
  - target: Impaired Autophagy and Lysosomal Degradation
    causal_link_type: DIRECT
    description: The WASH complex is needed for autophagosome formation through trafficking of ATG9A, so its lost recruitment impairs autophagy directly.
    evidence:
    - reference: PMID:24819384
      reference_title: "Mutation in VPS35 associated with Parkinson's disease impairs WASH complex association and inhibits autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Autophagy is impaired in cells expressing PD-mutant VPS35 or lacking WASH. The autophagy defects can be explained, at least in part, by abnormal trafficking of the autophagy protein ATG9A."
      explanation: Links the WASH defect to impaired autophagy through ATG9A trafficking.
- name: Defective Endosome-to-Golgi Cargo Retrieval
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Retromer-positive endosomes are enlarged and redistributed to a perinuclear
    position in D620N cells and patient fibroblasts, and retrieval of cargo from
    endosomes to the Golgi is impaired: the cation-independent
    mannose-6-phosphate receptor route that delivers cathepsin D to lysosomes,
    and in dopaminergic neurons the chaperone-mediated-autophagy receptor
    LAMP2A, which is instead degraded. The finding is contested: a third group
    saw apparently normal CIMPR and LAMP1 localisation in D620N cells. Two
    laboratories, one confirming the defect in patient-derived fibroblasts,
    outweigh one negative report, but the disagreement is recorded and the node
    is PROVISIONAL rather than ESTABLISHED.
  biological_processes:
  - preferred_term: retrograde endosome-to-Golgi transport

    evidence_source: HUMAN_CLINICAL
    snippet: "Drugs to treat motor manifestations include levodopa, in combination with a peripheral dopa decarboxylase inhibitor (carbidopa, benserazide), dopamine agonists, inhibitors of catechol-O-methyltransferase or monoamine oxidase-B, anticholinergics, and amantadine."

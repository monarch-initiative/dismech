inheritance:
- name: Autosomal Recessive
  description: >
    Biallelic GZF1 loss-of-function variants, homozygous in the consanguineous
    founding families and compound heterozygous in later reports. Penetrance in
    biallelic carriers appears high.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28475863
    reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a multiplex consanguineous Saudi family affected by severe and recurrent
      large joint dislocation and severe myopia, we identified a homozygous
      truncating variant in GZF1 through a combined autozygome and exome approach.
    explanation: >-
      Homozygous truncating variant segregating in a consanguineous multiplex family
      establishes recessive inheritance.
  - reference: PMID:42170786
    reference_title: "Expanding the Genetic and Clinical Spectrum of GZF1 -Related Phenotype: A Specific Ocular and Skeletal Disorder Distinguishable From Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only ten patients from five families have been reported, all of whom carry
      biallelic variants of GZF1.
    explanation: >-
      Confirms that every reported patient carries biallelic variants, supporting
      recessive inheritance across the whole reported series.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ten patients from five families before the 2026 series, which added three more.
    Reported families are predominantly consanguineous, so the case count reflects
    ascertainment in populations where autozygosity mapping is applied as much as
    it reflects true rarity. No population estimate exists.
  evidence:
  - reference: PMID:42170786
    reference_title: "Expanding the Genetic and Clinical Spectrum of GZF1 -Related Phenotype: A Specific Ocular and Skeletal Disorder Distinguishable From Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only ten patients from five families have been reported, all of whom carry
      biallelic variants of GZF1.
    explanation: Gives the cumulative reported patient and family count.
genetic:
- name: GZF1
  notes: >
    GZF1 (20p11.21) encodes GDNF-inducible zinc finger protein 1, a BTB/POZ-domain
    transcriptional repressor with tandem zinc fingers. Reported disease alleles are
    truncating: homozygous truncating variants in the two founding consanguineous
    families, compound heterozygous frameshifts (p.Leu133fs, p.Met492fs) in Chinese
    patients, and the recurrent c.1440del (p.His481IlefsTer26) both homozygous and
    compound heterozygous in a 2026 series. Functional work on two of the frameshift
    alleles shows loss of protein by different routes, which is direct evidence that
    the mechanism is loss of function rather than a dominant-negative effect.
  gene_term:
    preferred_term: GZF1
    term:
      id: hgnc:15808
      label: GZF1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:28475863
    reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independently, the same approach identified a second homozygous truncating GZF1
      variant in another multiplex consanguineous family affected by severe myopia,
      retinal detachment, and milder skeletal involvement.
    explanation: >-
      A second independent family with a homozygous truncating GZF1 variant, which is
      what establishes the gene-disease relationship rather than a single observation.
  - reference: PMID:33009817
    reference_title: "Novel GZF1 pathogenic variants identified in two Chinese patients with Larsen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggested that the two variants could lead to loss of function of
      GZF1.
    explanation: >-
      Functional confirmation that the reported frameshift alleles act by loss of
      function.
  - reference: PMID:33009817
    reference_title: "Novel GZF1 pathogenic variants identified in two Chinese patients with Larsen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mRNA expression level of L133fs-GZF1 did not significantly differ from that
      of WT-GZF1. However, no HA-conjugated mutant protein was detected by western
      blotting, which was also confirmed by immunofluorescence staining.
    explanation: >-
      Shows the two alleles reach loss of function by different routes, one at the
      protein level with preserved transcript, which is why transcript-based
      prediction alone would misclassify it.
  - reference: PMID:42170786
    reference_title: "Expanding the Genetic and Clinical Spectrum of GZF1 -Related Phenotype: A Specific Ocular and Skeletal Disorder Distinguishable From Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified the GZF1: c.1440del (p.His481IlefsTer26) variant in homozygosity
      in two affected sisters and compound heterozygosity in the third patient: the
      same c.1440del plus c.1451_1452del (p.Cys484fs).
    explanation: Documents a recurrent allele in both homozygous and compound heterozygous state.
pathophysiology:
- name: Biallelic GZF1 Loss of Function
  biological_scale: MOLECULAR
  description: >
    Truncating GZF1 variants abolish the functional transcriptional repressor.
    Functional work on two frameshift alleles shows loss reached by different
    routes: one has normal transcript but no detectable protein, the other has
    reduced transcript and protein plus mislocalisation to the cytoplasm.
  gene:
    preferred_term: GZF1
    term:
      id: hgnc:15808
      label: GZF1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:33009817
    reference_title: "Novel GZF1 pathogenic variants identified in two Chinese patients with Larsen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, both mRNA transcription and protein expression levels of
      M492fs-GZF1 were significantly lower than those of wild type, and HA-tagged
      M492fs-GZF1 was mainly distributed in the cytoplasm of HEK 293 T cells.
    explanation: >-
      Documents reduced expression plus cytoplasmic mislocalisation for one allele,
      establishing loss of nuclear transcription factor function.
  downstream:
  - target: Dysregulation of Extracellular Matrix Gene Expression
    causal_link_type: DIRECT
    description: >
      GZF1 is a transcriptional repressor, so its loss changes the expression of its
      target set. What that set is was determined empirically by profiling patient
      cells rather than predicted.
    evidence:
    - reference: PMID:28475863
      reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Global transcriptional profiling of cells from affected individuals revealed a
        shared pattern of gene dysregulation and significant enrichment of genes
        encoding matrix proteins, including P3H2, which hints at a potential disease
        mechanism.
      explanation: >-
        The direct transcriptional evidence that GZF1 loss dysregulates matrix genes
        in patient cells. Note the source frames it as a hint at a potential
        mechanism, and the entry keeps that hedge.
- name: Dysregulation of Extracellular Matrix Gene Expression
  biological_scale: CELLULAR
  description: >
    Patient cells show a shared pattern of gene dysregulation enriched for
    extracellular matrix genes, with P3H2 (LEPREL1) singled out as the most
    interesting because of what is independently known about it. This node records
    a measured transcriptional change; the step from it to tissue pathology is the
    inferential part of the entry.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:28475863
    reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Global transcriptional profiling of cells from affected individuals revealed a
      shared pattern of gene dysregulation and significant enrichment of genes
      encoding matrix proteins, including P3H2, which hints at a potential disease
      mechanism.
    explanation: >-
      Establishes matrix gene dysregulation as a measured feature of patient cells.
  downstream:
  - target: Defective Collagen Prolyl 3-Hydroxylation in Ocular Tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      This is the weakest edge in the entry and is marked as such. P3H2 appears in a
      dysregulated gene list from patient fibroblasts; no study has shown reduced
      collagen 3-hydroxylation in GZF1-deficient ocular tissue. The edge is included
      because the downstream anchor is unusually strong, not because the step itself
      has been demonstrated.
    evidence:
    - reference: PMID:28475863
      reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Global transcriptional profiling of cells from affected individuals revealed a
        shared pattern of gene dysregulation and significant enrichment of genes
        encoding matrix proteins, including P3H2, which hints at a potential disease
        mechanism.
      explanation: >-
        The only evidence for this step is P3H2's presence in a dysregulated gene set,
        which the authors themselves describe as a hint. Graded INDIRECT for that
        reason.
  - target: Generalised Connective Tissue Laxity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The skeletal arm is presumed to share the matrix-gene origin with the ocular arm.
      Unlike the ocular arm it has no candidate effector: the profiling result reports
      enrichment of matrix genes generally, and nothing cited identifies which of them
      produces capsular and ligamentous laxity. The edge is drawn so the skeletal
      features connect to the GZF1 root rather than floating, and is marked
      unknown-intermediates because the mediating gene is exactly what is missing.
    evidence:
    - reference: PMID:28475863
      reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Global transcriptional profiling of cells from affected individuals revealed a
        shared pattern of gene dysregulation and significant enrichment of genes
        encoding matrix proteins, including P3H2, which hints at a potential disease
        mechanism.
      explanation: >-
        Establishes matrix gene dysregulation as the shared origin proposed for both
        arms. Graded INDIRECT because no cited work connects that dysregulation to
        connective tissue laxity specifically.
- name: Defective Collagen Prolyl 3-Hydroxylation in Ocular Tissue
  biological_scale: TISSUE
  description: >
    Reduced P3H2-mediated 3-hydroxylation of collagen would leave scleral and other
    ocular collagen structurally defective. The reason this node is here at all is
    that biallelic P3H2/LEPREL1 loss is an independently established cause of severe
    non-syndromic high myopia with early-onset cataract and retinal degeneration,
    which is close to the ocular phenotype seen in JLSM.
  biological_processes:
  - preferred_term: peptidyl-proline hydroxylation
    modifier: DECREASED
    term:
      id: GO:0019511
      label: peptidyl-proline hydroxylation
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  evidence:
  - reference: PMID:24172257
    reference_title: "Homozygous loss-of-function mutation of the LEPREL1 gene causes severe non-syndromic high myopia with early-onset cataract."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LEPREL1 encodes a proline hydroxylase called prolyl 3-hydroxylase 2 (P3H2), a
      2-oxoglutarate-dependent dioxygenase that hydroxylates collagens.
    explanation: >-
      Identifies the enzymatic function whose loss this node describes. Graded
      INDIRECT because this paper is about a different disease (P3H2 deficiency), and
      is cited to establish what P3H2 does, not to evidence a finding in GZF1
      patients.
  - reference: PMID:24172257
    reference_title: "Homozygous loss-of-function mutation of the LEPREL1 gene causes severe non-syndromic high myopia with early-onset cataract."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recruited an autosomal-recessive high myopia family, with affected subjects
      who also present early-onset cataract, retinal degeneration and other
      complications.
    explanation: >-
      Establishes that loss of this enzyme produces an ocular phenotype closely
      resembling the JLSM one. This is the analogy that motivates the node, and is
      recorded as INDIRECT rather than presented as evidence about GZF1.
  - reference: PMID:25645914
    reference_title: "Post-translationally abnormal collagens of prolyl 3-hydroxylase-2 null mice offer a pathobiological mechanism for the high myopia linked to human LEPREL1 mutations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Almost every known site of prolyl 3-hydroxylation in types I and IV collagen
      from P3h2(n/n) mouse eye tissues was significantly under-hydroxylated compared
      with their wild-type littermates.
    explanation: >-
      The only cited work that measures collagen 3-hydroxylation in eye tissue rather
      than inferring it, showing that loss of P3H2 does reduce it in sclera and cornea.
      Graded INDIRECT because the model is a P3h2-null mouse, not a GZF1-deficient one,
      so it substantiates the consequence of losing the enzyme and not the claim that
      GZF1 loss reduces it.
  downstream:
  - target: High myopia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24172257
      reference_title: "Homozygous loss-of-function mutation of the LEPREL1 gene causes severe non-syndromic high myopia with early-onset cataract."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        LEPREL1 plays an important role in eye development and homozygous
        loss-of-function mutation of this gene can cause severely high myopia
      explanation: >-
        States the causal relationship between loss of this enzyme and high myopia, in
        the P3H2 disease rather than in GZF1 patients.
- name: Generalised Connective Tissue Laxity
  biological_scale: TISSUE
  description: >
    The skeletal arm of the disease: laxity of joint capsules and ligaments giving
    hypermobility and recurrent large-joint dislocation, with scoliosis and thoracic
    deformity. Presumed to share the matrix-gene origin with the ocular arm, but
    unlike the ocular arm there is no candidate effector gene identified, so no
    intermediate node is drawn.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:42170786
    reference_title: "Expanding the Genetic and Clinical Spectrum of GZF1 -Related Phenotype: A Specific Ocular and Skeletal Disorder Distinguishable From Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The comparison allows us to define a recognizable GZF1RP that includes severe
      ocular defects, short stature, facial dysmorphism, joint
      hypermobility/dislocations, scoliosis, thoracic deformity, progressive hearing
      loss, umbilical hernia, and hypodontia.
    explanation: >-
      Defines the connective-tissue features that constitute this node in the
      consolidated phenotype description.
  downstream:
  - target: Joint dislocation
    causal_link_type: DIRECT
    evidence:

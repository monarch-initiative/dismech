      reference_title: "Expanding the Genetic and Clinical Spectrum of GZF1 -Related Phenotype: A Specific Ocular and Skeletal Disorder Distinguishable From Larsen Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The comparison allows us to define a recognizable GZF1RP that includes severe
        ocular defects, short stature, facial dysmorphism, joint
        hypermobility/dislocations, scoliosis, thoracic deformity, progressive hearing
        loss, umbilical hernia, and hypodontia.
      explanation: >-
        Joint hypermobility is the direct articular expression of capsular and
        ligamentous laxity in the consolidated phenotype definition.
  - target: Scoliosis
    causal_link_type: DIRECT
    evidence:

name: Joint Laxity, Short Stature, and Myopia
creation_date: '2026-09-06T15:45:00Z'
category: Mendelian
description: >
  Joint laxity, short stature and myopia (JLSM), also called the GZF1-related
  phenotype, is an ultra-rare autosomal recessive connective tissue disorder
  caused by biallelic loss-of-function variants in GZF1, which encodes a
  GDNF-inducible BTB/POZ zinc finger transcriptional repressor. It was first
  defined molecularly in 2017 in two consanguineous families and has since been
  reported in roughly a dozen patients.

  It was described from within the Larsen syndrome literature and is still
  sometimes called autosomal recessive Larsen syndrome, but the current view is
  that it is a distinguishable entity. It shares short stature and large-joint
  dislocation with FLNB-related Larsen syndrome, and adds severe ocular disease
  that Larsen does not have: high myopia with retinal detachment and congenital
  glaucoma.

  The proposed mechanism is a transcription-factor disease acting on the
  extracellular matrix. Transcriptional profiling of patient cells showed
  enrichment of dysregulated matrix genes including P3H2, whose own biallelic
  loss independently causes non-syndromic high myopia, which is what makes it a
  credible route from a transcription factor to a scleral phenotype. That chain
  is an inference assembled from two separate findings rather than something
  demonstrated in a GZF1 patient's eye, and the entry grades and annotates it
  accordingly rather than presenting it as established.
synonyms:
- JLSM
- GZF1-related phenotype
- GZF1RP
- autosomal recessive Larsen syndrome
- Larsen syndrome, autosomal recessive

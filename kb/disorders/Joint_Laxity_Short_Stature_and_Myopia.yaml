diagnosis:
- name: Exome sequencing with autozygosity mapping
  description: >
    Both founding families were solved by combined autozygome-plus-exome analysis,
    which remains the efficient route in consanguineous pedigrees. Later cases were
    found by whole-exome sequencing without autozygosity mapping.
  evidence:
  - reference: PMID:28475863
    reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a multiplex consanguineous Saudi family affected by severe and recurrent
      large joint dislocation and severe myopia, we identified a homozygous truncating
      variant in GZF1 through a combined autozygome and exome approach.
    explanation: Names the diagnostic approach that established the disorder.
differential_diagnoses:
- name: FLNB-related Larsen syndrome
  description: >
    The disorder this one was carved out of, and the differential that matters. Both
    have short stature and large-joint dislocation. The discriminator is ocular:
    severe myopia, retinal detachment and congenital glaucoma are features of the
    GZF1 disorder and not of FLNB-related Larsen syndrome. Inheritance also differs,
    dominant FLNB against recessive GZF1.
  evidence:
  - reference: PMID:42170786
    reference_title: "Expanding the Genetic and Clinical Spectrum of GZF1 -Related Phenotype: A Specific Ocular and Skeletal Disorder Distinguishable From Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They share short stature and joint dislocation with LRS; however, they present
      with severe ocular manifestations, suggesting that GZF1RP may be specific.
    explanation: >-
      States both the overlap and the discriminating ocular feature, and is the basis
      for treating this as a distinct entity.
  - reference: PMID:28475863
    reference_title: "GZF1 Mutations Expand the Genetic Heterogeneity of Larsen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous FLNB mutations account for the majority of Larsen syndrome cases,
      but biallelic mutations in CHST3 and B4GALT7 have been more recently described,
      thus confirming the existence of recessive forms of the disease.
    explanation: >-
      Establishes the genetic landscape of Larsen syndrome into which GZF1 was added.
- name: P3H2 (LEPREL1) non-syndromic high myopia
  description: >
    Relevant twice over: as an ocular differential, and because it is the
    mechanistic anchor of this entry's proposed pathway. Biallelic P3H2 loss gives
    high myopia with early-onset cataract and retinal degeneration without the
    skeletal features.
  evidence:
  - reference: PMID:24172257
    reference_title: "Homozygous loss-of-function mutation of the LEPREL1 gene causes severe non-syndromic high myopia with early-onset cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using targeted capturing and whole exome sequencing, we identified a homozygous
      non-sense mutation in the LEPREL1 gene which causes premature termination of the
      translation at the fifth amino acid (c.13C>T; p.Q5X), co-segregating with the
      phenotypes.
    explanation: >-
      Establishes P3H2 loss of function as an independent cause of the ocular
      phenotype, which is what makes it a credible candidate effector here.
discussions:
- discussion_id: jlsm_p3h2_pathway_is_inferred
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is P3H2 under-expression actually the effector linking GZF1 loss to high myopia,
    or is it one dysregulated gene among many in a profiling experiment?
  attaches_to:
  - pathophysiology#Dysregulation of Extracellular Matrix Gene Expression
  - pathophysiology#Defective Collagen Prolyl 3-Hydroxylation in Ocular Tissue
  rationale: >
    The proposed pathway is assembled from two separate findings, neither of which
    is about the other. Finding one: P3H2 appears among enriched matrix genes in
    transcriptional profiling of GZF1 patient fibroblasts, which the authors describe
    as hinting at a potential mechanism. Finding two: biallelic P3H2 loss
    independently causes non-syndromic high myopia. Joining them is an attractive
    inference, and it is only an inference. No study has measured P3H2 protein or
    collagen 3-hydroxylation in GZF1-deficient tissue, no GZF1 animal model with an
    ocular readout was identified, and fibroblasts are not sclera. The entry marks
    the joining edge INDIRECT_UNKNOWN_INTERMEDIATES and grades the supporting
    evidence INDIRECT rather than presenting the chain as established.
- discussion_id: jlsm_skeletal_arm_has_no_effector
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which matrix genes mediate the joint laxity and skeletal features, given that
    P3H2 is an ocular candidate only?
  attaches_to:
  - pathophysiology#Generalised Connective Tissue Laxity
  rationale: >
    The ocular arm at least has a candidate effector. The skeletal arm has none. The
    profiling result reports enrichment of matrix genes generally, and nothing cited
    identifies which of them explains joint capsule and ligament laxity, or why the
    skeletal involvement was markedly milder in one of the two founding families
    despite both carrying homozygous truncating alleles. That intrafamilial contrast
    is itself unexplained and suggests a modifier.
treatments:
- name: Supportive and multidisciplinary care
  description: >
    No disease-modifying therapy exists. Management is ophthalmological surveillance
    for retinal detachment and glaucoma, orthopaedic management of dislocation and
    scoliosis, audiological follow-up for progressive hearing loss, and genetic
    counselling.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no evidence item. No trial, cohort or case series of any
    intervention in this disorder was identified. The components listed follow from
    the phenotype, and citing a Larsen syndrome management statement here would
    import a therapeutic claim made about a different, genetically distinct disorder.
notes: >
  On naming and placement. MONDO calls this "joint laxity, short stature, and
  myopia" and the entry is filed under that term, but the current literature
  increasingly calls it the GZF1-related phenotype and argues it is distinguishable
  from Larsen syndrome. Both names are in synonyms. It is listed under the Larsen
  Syndrome parent because that is where the literature places it and where a
  clinician would look, not as an assertion that it is a Larsen subtype. The 2026
  series argues explicitly for specificity, and the differential records the ocular
  discriminator.

  On the mechanism, which is the part to read sceptically. The GZF1 to P3H2 to
  collagen to myopia chain is the most attractive thing in the report literature
  about this disease and it is not established. It is built from P3H2 appearing in a
  dysregulated gene list from patient fibroblasts, plus the separate fact that P3H2
  loss causes high myopia in its own right. Both halves are solid; the join is not
  tested. The entry keeps the chain because the anchor is genuinely informative, and
  marks it INDIRECT_UNKNOWN_INTERMEDIATES with INDIRECT evidence grading throughout,
  with a discussion stating what would be needed to close it.

  On the hearing binding. This was originally bound to Sensorineural hearing
  impairment, which went beyond its quote: the cited sentence says only "progressive
  hearing loss" without specifying type. On review it was rebound to the general
  Hearing impairment term, with the progressive course carried in clinical_course.
  The sensorineural characterisation appears in the wider report but no cited abstract
  sentence attributes it, so it is not asserted here.

  On what is deliberately absent. No animal models: GZF1 was shown to be expressed in
  the eyes and limbs of developing mice, but expression is not a disease model, and no
  Gzf1 mutant with a reported ocular or skeletal phenotype was found in the cited
  sources. The P3h2-null mouse cited on the hydroxylation node is a model of the
  anchor disease rather than of this one, which is why it is evidence there and not an
  animal_models entry. No datasets: the transcriptional profiling behind the P3H2 lead is
  described in the founding paper but no accession was identified for it, which is
  itself a gap worth closing since that dataset is the entire evidential basis of the
  proposed mechanism.

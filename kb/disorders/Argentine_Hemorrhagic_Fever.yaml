- name: Abnormal bleeding
  category: Hematologic
  description: >-
    Progressive AHF can enter a neurologic-hemorrhagic phase in which vascular
    dysfunction, reduced platelet number, and hemostatic disruption manifest as
    bleeding.
  phenotype_term:
    preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:24710609
    reference_title: Endothelial cell permeability and adherens junction disruption induced by junín virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      farm workers presented clinically with hemorrhagic, neurologic, and
      vascular manifestations.
    explanation: >-
      Directly supports hemorrhagic manifestations in human AHF.
treatments:
- name: Early immune plasma
  description: >-
    Transfusion of convalescent immune plasma in defined neutralizing-antibody
    doses is the established specific treatment for AHF when administered during
    the prodromal phase, within eight days of symptom onset.
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Junín virus hTfR1-mediated entry
    treatment_effect: INHIBITS
    description: >-
      Neutralizing antibodies in immune plasma bind circulating Junín virions
      upstream of additional receptor-mediated entry.
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Present specific therapy involves the transfusion of immune plasma in
      defined doses of neutralizing antibodies during the prodromal phase of
      illness.
    explanation: >-
      Identifies neutralizing-antibody immune plasma during prodrome as the
      established specific therapy.
  - reference: PMID:92624
    reference_title: Efficacy of immune plasma in treatment of Argentine haemorrhagic fever and association between treatment and a late neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a double-blind trial patients with Argentine haemorrhagic fever treated
      with immune plasma within 8 days of the onset of the disease had a much
      lower mortality than those given normal plasma.
    explanation: >-
      Supports the eight-day treatment window and mortality reduction from the
      randomized immune-plasma trial.
- name: Candid #1 live-attenuated Junín virus vaccination
  description: >-
    The live-attenuated Candid #1 vaccine induces protective active immunity
    against Junín virus and prevented laboratory-confirmed AHF in an endemic
    agricultural-worker field trial.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:9466512
    reference_title: Protective efficacy of a live attenuated vaccine against Argentine hemorrhagic fever. AHF Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A prospective, randomized, double-blind, placebo-controlled, efficacy trial
      of Candid 1, a live attenuated Junin virus vaccine, was conducted over two
      consecutive epidemic seasons among 6500 male agricultural workers in the
      AHF-endemic region.
    explanation: >-
      Identifies the live attenuated Junín virus vaccine and the randomized
      endemic-region efficacy trial population.
  - reference: PMID:9466512
    reference_title: Protective efficacy of a live attenuated vaccine against Argentine hemorrhagic fever. AHF Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-three men developed laboratory-confirmed AHF during the study; 22
      received placebo and 1 received vaccine (vaccine efficacy 95%; 95%
      confidence interval [CI], 82%-99%).
    explanation: >-
      Quantifies protection against laboratory-confirmed AHF in the field
      efficacy trial.
review_notes: >-
  Argentine hemorrhagic fever is split from the broader Arenavirus hemorrhagic
  fever grouping because it is the human Junín virus disease with a specific
  Calomys reservoir ecology, Argentine endemic range, Candid #1 vaccine, and
  standardized immune-plasma treatment. It conforms to the shared
  viral-hemorrhagic fever syndrome on its direct human endothelial-permeability
  evidence. No GeneReviews chapter exists for this acquired zoonotic viral
  infection.

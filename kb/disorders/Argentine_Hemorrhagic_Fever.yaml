name: Argentine Hemorrhagic Fever
creation_date: "2026-11-14T00:00:00Z"
category: Infectious
description: >-
  Argentine hemorrhagic fever is a rodent-borne New World arenavirus
  hemorrhagic fever of Argentina caused by Junín virus, the Mammarenavirus
  juninense species. The virus is maintained in wild Calomys rodents, especially
  Calomys musculinus, and human disease follows agricultural or other exposure
  to infected rodents. Symptomatic disease begins as an acute febrile systemic
  illness and can progress to a neurologic-hemorrhagic phase with leukopenia,
  thrombocytopenia, abnormal bleeding, and vascular leak. Early immune plasma is
  the established pathogen-directed therapy in endemic areas, and the
  live-attenuated Candid #1 vaccine protects agricultural workers in the endemic
  region.
disease_term:
  preferred_term: Argentine hemorrhagic fever
  term:
    id: MONDO:0017874
    label: Argentine hemorrhagic fever
parents:
- Viral Hemorrhagic Fever
synonyms:
- Argentinian hemorrhagic fever
- Junín virus disease
- Junin virus disease
- Junín hemorrhagic fever
- AHF
- Mal de los rastrojos
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated AHF is a high-consequence hemorrhagic fever, with historic
    case-fatality of 15-30%. Vaccine deployment has greatly reduced incidence in
    the endemic region, but recognized AHF still requires early diagnosis
    because the specific immune-plasma therapy works in the prodromal phase and
    severely ill patients can progress to a neurologic-hemorrhagic phase for
    which better therapy is still needed.
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      AHF has had significant morbidity since its emergence in the 1950s, with a
      case-fatality rate of the illness without treatment between 15% and 30%.
    explanation: >-
      Quantifies the untreated fatality range that makes AHF a high-burden
      hemorrhagic fever.
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The use of a live attenuated vaccine has markedly reduced the incidence of
      AHF.
    explanation: >-
      Explains why current burden is lower than the pre-vaccine historical
      fatality alone would imply.
infectious_agent:
- name: Junín virus
  description: >-
    Junín virus is the rodent-borne mammarenavirus that causes AHF; NCBI
    Taxonomy currently places it in the ICTV-accepted species Mammarenavirus
    juninense.
  infectious_agent_term:
    preferred_term: Junín virus
    term:
      id: NCBITaxon:2169991
      label: Mammarenavirus juninense
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Argentine hemorrhagic fever (AHF) is a rodent-borne illness caused by the
      arenavirus Junin that is endemic to the humid pampas of Argentina.
    explanation: >-
      Identifies Junín arenavirus as the cause of Argentine hemorrhagic fever.
agent_life_cycle:
  description: >-
    Junín virus is maintained in wild Calomys rodents in Argentina, especially C.
    musculinus, and infected rodents shed virus horizontally. Humans are
    incidental spillover hosts infected after contact with infected rodents and
    do not maintain the enzootic cycle.
  hosts:
  - preferred_term: Calomys musculinus
    role: principal reservoir host
    term:
      id: NCBITaxon:56212
      label: Calomys musculinus
  - preferred_term: Calomys laucha
    role: reservoir host
    term:
      id: NCBITaxon:56211
      label: Calomys laucha
  - preferred_term: Human
    role: incidental host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:1335214
    reference_title: A longitudinal study of Junin virus activity in the rodent reservoir of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of 41 Ag-positive captures, 37 were C. musculinus and four were C. laucha
    explanation: >-
      Supports Calomys musculinus as the predominant antigen-positive reservoir
      species in a longitudinal endemic-area field study, with C. laucha also
      infected.
  - reference: PMID:1335214
    reference_title: A longitudinal study of Junin virus activity in the rodent reservoir of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These patterns, combined with the greater mobility and higher frequencies
      of wounds among males than females, implicated horizontal transmission as
      the primary route of JV transmission between rodents.
    explanation: >-
      Establishes horizontal rodent-to-rodent spread as the principal
      maintenance route in the reservoir population.
transmission:
- name: Rodent-associated zoonotic exposure
  description: >-
    Human AHF is a zoonosis of Argentina's endemic agricultural region; infection
    follows exposure to infected Calomys rodents, their fluids, or their
    excreta, and agricultural workers are the sentinel high-risk population in
    field trials.
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Argentine hemorrhagic fever (AHF) is a rodent-borne illness caused by the
      arenavirus Junin that is endemic to the humid pampas of Argentina.
    explanation: >-
      Describes AHF as a geographically focal rodent-borne infection.
  - reference: PMID:9466512
    reference_title: Protective efficacy of a live attenuated vaccine against Argentine hemorrhagic fever. AHF Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Argentine hemorrhagic fever (AHF), caused by the arenavirus Junin, is a
      major public health problem among agricultural workers in Argentina.
    explanation: >-
      Identifies agricultural workers in the endemic region as the exposed human
      population targeted for vaccination.
  - reference: PMID:24710609
    reference_title: Endothelial cell permeability and adherens junction disruption induced by junín virus infection.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      agricultural workers who can easily be infected by inhalation of
      aerosolized infectious excrement or contact with contaminated materials.
    explanation: >-
      Directly supports aerosolized rodent excreta and contaminated materials as
      the agricultural exposure vehicles.
environmental:
- name: Exposure to infected Calomys rodents
  description: >-
    Rodent contact or contaminated rodent excreta exposure initiates AHF by
    introducing Junín virus from its Calomys reservoir into an incidental human
    host. ECTO has no Junín- or rodent-excreta-specific term, so the exposure is
    bound at the broader viral-exposure level.
  exposure_term:
    preferred_term: exposure to Junín virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  influences_mechanisms:
  - target: Junín virus hTfR1-mediated entry
    environmental_effect: TRIGGERS
    description: >-
      Zoonotic exposure places Junín virions in the human host, upstream of
      cellular entry and systemic arenavirus replication.
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Argentine hemorrhagic fever (AHF) is a rodent-borne illness caused by the
      arenavirus Junin that is endemic to the humid pampas of Argentina.
    explanation: >-
      Supports the rodent-borne viral exposure modeled for human infection.
progression:
- phase: Prodromal immune-plasma treatment window
  notes: >-
    Early AHF must be recognized during the first week of illness because immune
    plasma is the established specific therapy only when given before advanced
    hemorrhagic or neurologic disease has developed.
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Present specific therapy involves the transfusion of immune plasma in
      defined doses of neutralizing antibodies during the prodromal phase of
      illness.
    explanation: >-
      Places immune plasma in the prodromal phase, before the severe
      neurologic-hemorrhagic phase.
  - reference: PMID:92624
    reference_title: Efficacy of immune plasma in treatment of Argentine haemorrhagic fever and association between treatment and a late neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a double-blind trial patients with Argentine haemorrhagic fever treated
      with immune plasma within 8 days of the onset of the disease had a much
      lower mortality than those given normal plasma.
    explanation: >-
      Defines the eight-day window in which immune plasma reduced mortality in
      the placebo-controlled trial.
- phase: Severe neurologic-hemorrhagic phase
  notes: >-
    A subset of cases progresses past early systemic illness to a severe
    neurologic and hemorrhagic syndrome that remains a therapeutic gap when
    patients are recognized too late for effective immune plasma.
  evidence:
  - reference: PMID:18054395
    reference_title: Treatment of Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alternative forms of treatment are required, given the difficulties in
      maintaining a sufficient stock of immune plasma and possible adverse
      events. On the other hand, new treatments for severe cases that evolve to a
      hemorrhagic and/or neurological form of the illness are also needed.
    explanation: >-
      Documents severe hemorrhagic and neurologic evolution as the late AHF
      phase for which specific therapies remain inadequate.
pathophysiology:
- name: Junín virus hTfR1-mediated entry
  description: >-
    Junín virus uses the human transferrin receptor 1 apical domain for New
    World hemorrhagic-fever arenavirus entry, enabling infection of susceptible
    human cells after spillover.
  downstream:
  - target: Noncytopathic endothelial infection
    causal_link_type: DIRECT
    description: >-
      Junín virus entry permits productive infection of endothelial cells that
      perturbs vascular barrier function.
  evidence:
  - reference: PMID:18268337
    reference_title: Receptor determinants of zoonotic transmission of New World hemorrhagic fever arenaviruses.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transferrin receptor 1 (TfR1) is a cellular receptor for the New World
      hemorrhagic fever arenaviruses Machupo (MACV), Junín (JUNV), and
      Guanarito (GTOV).
    explanation: >-
      Identifies human TfR1 as an entry receptor for Junín virus and related New
      World hemorrhagic-fever arenaviruses.
- name: Noncytopathic endothelial infection
  description: >-
    JUNV productively infects primary endothelial cells without overt cytopathic
    effects, leaving endothelial activation and junction remodeling as a route
    to barrier dysfunction rather than simple lysis of infected endothelium.
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  downstream:
  - target: Endothelial adherens-junction disruption and vascular leak
    causal_link_type: DIRECT
    description: >-
      Productive endothelial infection is upstream of adherens-junction
      disruption and increased endothelial permeability.
  evidence:
  - reference: PMID:24710609
    reference_title: Endothelial cell permeability and adherens junction disruption induced by junín virus infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      JUNV has been shown to result in productive infection of endothelial cells
      (ECs) in vitro with no visible cytopathic effects.
    explanation: >-
      Supports productive, noncytopathic infection of endothelial cells by JUNV.
- name: Endothelial adherens-junction disruption and vascular leak
  description: >-
    Direct infection of primary human endothelial cells increases endothelial
    permeability and disrupts adherens junctions, a cellular correlate of the
    vascular dysfunction and fluid-distribution abnormalities seen in AHF.
  conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  downstream:
  - target: Abnormal bleeding
    causal_link_type: DIRECT
    description: >-
      Barrier injury contributes to the hemorrhagic manifestations of progressive
      AHF.
  evidence:
  - reference: PMID:24710609
    reference_title: Endothelial cell permeability and adherens junction disruption induced by junín virus infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      direct JUNV infection of primary human ECs results in increased vascular
      permeability as measured by electric cell substrate impedance sensing and
      transwell permeability assays.
    explanation: >-
      Directly supports increased endothelial permeability after primary human
      endothelial-cell infection.
  - reference: PMID:24710609
    reference_title: Endothelial cell permeability and adherens junction disruption induced by junín virus infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also show that EC adherens junctions are disrupted during virus
      infection
    explanation: >-
      Identifies adherens-junction disruption as a structural endothelial
      correlate of the increased permeability.
- name: Bone marrow hypoplasia with platelet and leukocyte depletion
  description: >-
    AHF affects hematopoiesis, producing bone-marrow hypoplasia, leukopenia, and
    thrombocytopenia that reduce circulating white-cell and platelet counts.
  conforms_to: viral_hemorrhagic_fever_syndrome#Reduced Platelet Number
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  downstream:
  - target: Leukopenia
    causal_link_type: DIRECT
    description: >-
      Bone-marrow hypoplasia is one contributor to the reduced circulating
      leukocyte count in AHF.
  - target: Thrombocytopenia
    causal_link_type: DIRECT
    description: >-
      Bone-marrow hypoplasia contributes to the reduced circulating platelet
      count in AHF.
  evidence:
  - reference: PMID:10815780
    reference_title: Relationship between hematopoietic growth factors levels and hematological parameters in Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Argentine hemorrhagic fever (AHF) is a viral disease caused by Junin virus
      and characterized by hematologic and neurological involvement.
    explanation: >-
      Places hematologic involvement among the defining features of AHF.
  - reference: PMID:10815780
    reference_title: Relationship between hematopoietic growth factors levels and hematological parameters in Argentine hemorrhagic fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main hematologic features are leukopenia, thrombocytopenia, and bone
      marrow hypoplasia.
    explanation: >-
      Names the leukopenia, thrombocytopenia, and bone-marrow hypoplasia
      represented in this branch.
phenotypes:
- name: Leukopenia
  category: Hematologic
  description: >-

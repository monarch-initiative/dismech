diagnosis:
- name: Skeletal survey
  description: >-
    Radiographs show metaphyseal flaring, enlarged medial clavicles, thin
    cortices and an osteoporotic appearance. The clavicular finding is the most
    discriminating, because it points away from cleidocranial dysplasia rather
    than towards it.
  results: >-
    Metaphyseal flaring with enlarged medial clavicles, thin cortices and
    osteopenic appearance.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:38108099
    reference_title: >-
      RUNX2-related metaphyseal dysplasia with maxillary hypoplasia: A rare skeletal disorder resembling SFRP4-related Pyle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical and radiographic examination revealed mild facial dysmorphism, dental anomalies, enlarged clavicles, genua valga and metaphyseal flaring and thin cortices with an osteoporotic skeletal appearance.
    explanation: >-
      The radiographic pattern on which the diagnosis is raised.
- name: RUNX2 copy-number analysis
  description: >-
    Diagnosis requires detecting an intragenic duplication, by copy-number
    analysis of genomic DNA or by sequencing fibroblast RUNX2 cDNA. A standard
    sequence-variant report will be normal.
  results: >-
    Heterozygous intragenic tandem duplication of RUNX2 exons 3-5, 3-6 or 3-7.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25311905
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly in a Finnish woman: first confirmation of a genetic defect outside the French-Canadian population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy number variant assays based on quantitative PCR of genomic DNA showed the presence of three copies within a part of RUNX2. Sequencing RUNX2 cDNA from the skin fibroblasts revealed a duplication of exons 3 to 5.
    explanation: >-
      Documents both diagnostic routes used to detect the intragenic
      duplication.
differential_diagnoses:
- name: Pyle disease
  description: >-
    The closest radiographic mimic. Pyle disease is recessive and SFRP4-related,
    with more extreme metaphyseal flaring, but the resemblance is close enough
    that it has been used to argue for an intersection between the RUNX2 and
    sFRP4 pathways.
  disease_term:
    preferred_term: Pyle disease
    term:
      id: MONDO:0009943
      label: Pyle disease
  distinguishing_features:
  - Autosomal recessive SFRP4 variants rather than dominant RUNX2 duplication
  - Maxillary hypoplasia and dystrophic teeth are not features
  evidence:
  - reference: PMID:38108099
    reference_title: >-
      RUNX2-related metaphyseal dysplasia with maxillary hypoplasia: A rare skeletal disorder resembling SFRP4-related Pyle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We review previously reported cases with MDMHB and highlight the resemblance of this disorder with Pyle disease, which may be explained by intersecting molecular pathways between RUNX2 and sFRP4.
    explanation: >-
      States the resemblance that makes Pyle disease the leading differential.
- name: Cleidocranial dysplasia
  description: >-
    The other RUNX2 disease, and the one a clinician is likely to think of on
    seeing a RUNX2 finding. It is caused by loss of function and its clavicular
    phenotype is the opposite: hypoplastic or absent clavicles rather than
    enlarged medial halves.
  disease_term:
    preferred_term: cleidocranial dysplasia 1
    term:
      id: MONDO:0007340
      label: cleidocranial dysplasia 1
  distinguishing_features:
  - RUNX2 loss of function rather than intragenic duplication
  - Hypoplastic or absent clavicles rather than enlarged medial clavicles
  - Delayed cranial ossification with wide fontanelles
  evidence:
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until now, only loss-of-function mutations have been detected in RUNX2; the present report associates an apparent gain-of-function alteration of RUNX2 function with a distinct rare disease.
    explanation: >-
      States the mechanistic opposition between MDMHB and the RUNX2
      loss-of-function disease.
discussions:
- discussion_id: gap_mdmhb_gain_of_function_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does an intragenic RUNX2 duplication raise cellular RUNX2
    protein levels, and is the resulting phenotype driven by more RUNX2 activity
    or by an altered RUNX2 protein?
  attaches_to:
  - pathophysiology#Intragenic RUNX2 Tandem Duplication
  - pathophysiology#Elevated Cellular RUNX2 Protein and Gain of Transcription Factor Function
  rationale: >-
    The transfection experiment shows raised levels of the duplication-bearing
    protein and the authors themselves phrase the conclusion as an apparent gain
    of function. Two quite different models fit that observation: a
    stabilised or degradation-resistant protein present at higher steady-state
    level, or a structurally altered factor with a duplicated runt domain and
    changed DNA-binding or partner behaviour. The distinction matters because
    only the first predicts that a whole-gene RUNX2 duplication should produce
    the same skeletal disease, and the reported whole-gene duplication family
    has a predominantly oro-dental phenotype rather than the full MDMHB
    picture. No study has separated the two models.
  evidence:
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection studies with murine Runx2 cDNA showed that cellular levels of mutated RUNX2 were markedly higher than those of wild-type RUNX2, suggesting that the RUNX2 duplication found in individuals with MDMHB leads to a gain of function.
    explanation: >-
      The observation the gap is built on, and the hedged wording that leaves
      the mechanism open.
  - reference: PMID:29852250
    reference_title: Oro-dental phenotype in patients with RUNX2 duplication.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe here the oro-dental phenotype of four patients of a unique family with a 285 kb duplication including the entire sequence of RUNX2, likely responsible for three functional copies of the gene, leading to an increased RUNX2 dosage.
    explanation: >-
      The whole-gene duplication comparator referred to in the rationale; it
      raises RUNX2 dosage without the intragenic rearrangement, so its phenotype
      bears on which model is right.

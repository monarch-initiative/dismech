biochemical: []
genetic:
- name: RUNX2
  association: Causal monoallelic intragenic duplication
  gene_term:
    preferred_term: RUNX2
    term:
      id: hgnc:10472
      label: RUNX2
  notes: >-
    Heterozygous intragenic tandem duplication spanning RUNX2 exons 3-5, 3-6 or
    3-7. Because this is a copy-number change inside a gene, exome or targeted
    sequencing must be analysed for intragenic CNVs; plain variant calling will
    miss it. The same gene causes cleidocranial dysplasia by loss of function,
    so the direction of the RUNX2 lesion, not merely its presence, determines
    which disease results.
  evidence:
  - reference: PMID:38108099
    reference_title: >-
      RUNX2-related metaphyseal dysplasia with maxillary hypoplasia: A rare skeletal disorder resembling SFRP4-related Pyle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal dysplasia with maxillary hypoplasia with or without brachydactyly (MDMHB) is an ultra-rare skeletal dysplasia caused by heterozygous intragenic RUNX2 duplications, comprising either exons 3 to 5 or exons 3 to 6 of RUNX2.
    explanation: >-
      States the causal variant class and the duplicated exon intervals.
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis for copy-number variations revealed that a 105 kb duplication within RUNX2 segregated with the MDMHB phenotype in a region with maximum linkage.
    explanation: >-
      Segregation evidence establishing RUNX2 as the causal locus.

name: Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly (MDMHB) is
  an ultra-rare autosomal dominant bone dysplasia combining metaphyseal flaring
  of the long bones, enlargement of the medial halves of the clavicles,
  maxillary hypoplasia, dystrophic teeth, variable brachydactyly and mild
  osteoporosis. It was described in a French Canadian family in 1982 and stayed
  a clinical entity until 2013, when the cause was found to be an intragenic
  tandem duplication of RUNX2 spanning the exons that encode the Q/A domain and
  the DNA-binding runt domain. That finding is what makes the disorder
  mechanistically interesting: every other RUNX2 disease allele known at the
  time was loss of function causing cleidocranial dysplasia, whereas the MDMHB
  duplication raises cellular RUNX2 protein levels and behaves as a gain of
  function. Dental problems are often the presenting complaint, and because the
  radiographic picture overlaps Pyle disease the disorder is a standing argument
  that RUNX2 and sFRP4 signalling intersect in metaphyseal modelling.
disease_term:
  preferred_term: metaphyseal dysplasia with maxillary hypoplasia and brachydactyly
  term:
    id: MONDO:0007984
    label: metaphyseal dysplasia-maxillary hypoplasia-brachydacty syndrome
parents:
- hereditary disease
synonyms:
- MDMHB
- metaphyseal dysplasia with maxillary hypoplasia with or without brachydactyly
- RUNX2-related metaphyseal dysplasia with maxillary hypoplasia
classifications:
  isds_skeletal_category:
  - classification_value: metaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 11 "Metaphyseal
      dysplasias", row NOS 11-0120 "Metaphyseal dysplasia with maxillary
      hypoplasia, RUNX2-related" (MIM 156510, autosomal dominant). RUNX2's other
      diseases are placed elsewhere in the nosology: cleidocranial dysplasia,
      caused by RUNX2 loss of function, is in the cleidocranial dysplasia and
      isolated cranial ossification defects group, so the two RUNX2 entities sit
      in different groups because they differ in mechanism and in phenotype, not
      in gene.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant, with the duplication segregating through multi-generation
    pedigrees; at least one reported case arose de novo.
  evidence:
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly (MDMHB) is an autosomal-dominant bone dysplasia characterized by metaphyseal flaring of long bones, enlargement of the medial halves of the clavicles, maxillary hypoplasia, variable brachydactyly, and dystrophic teeth.
    explanation: >-
      States the dominant mode alongside the defining clinical features.
  - reference: PMID:38108099
    reference_title: >-
      RUNX2-related metaphyseal dysplasia with maxillary hypoplasia: A rare skeletal disorder resembling SFRP4-related Pyle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing led to the identification of a de novo heterozygous tandem duplication within RUNX2, encompassing exons 3 to 7.
    explanation: >-
      Documents a de novo occurrence, showing the disease is not confined to
      inherited pedigrees.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. As of the 2018 report the literature held one large French
    Canadian family and a single Finnish woman; a three-generation family and a
    Belgian de novo case have been added since.
  evidence:
  - reference: PMID:29891876
    reference_title: >-
      A three-generation family with metaphyseal dysplasia, maxillary hypoplasia and brachydactyly (MDMHB) due to intragenic RUNX2 duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only one large French Canadian family and a Finnish woman have been reported with the condition.
    explanation: >-
      Direct statement of how few cases define the disease.
pathophysiology:
- name: Intragenic RUNX2 Tandem Duplication
  biological_scale: MOLECULAR
  description: >-
    A heterozygous tandem duplication inside RUNX2, spanning exons 3 to 5, 3 to
    6, or 3 to 7 in the reported families. The duplicated interval encodes the
    Q/A domain and the DNA-binding runt domain, so the mutant transcript carries
    a second copy of the functionally essential part of the protein. Breakpoints
    differ between families while the consequence on the transcript is the same,
    which argues that the duplicated exon content rather than any particular
    breakpoint is what matters.
  genes:
  - preferred_term: RUNX2
    term:
      id: hgnc:10472
      label: RUNX2
  evidence:
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      confirmed that affected family members were heterozygous for the presence of an intragenic duplication encompassing exons 3 to 5 of RUNX2
    explanation: >-
      Identifies the causal structural variant in the founding pedigree.
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These three exons code for the Q/A domain and the functionally essential DNA-binding runt domain of RUNX2.
    explanation: >-
      Establishes which functional domains the duplicated interval encodes.
  - reference: PMID:25311905
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly in a Finnish woman: first confirmation of a genetic defect outside the French-Canadian population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results demonstrated that the intronic breakpoints of the duplication differed from those previously found in the French Canadian family, but that the consequences on RUNX2 transcript were identical.
    explanation: >-
      Supports the claim that the transcript consequence, not the breakpoint, is
      the shared lesion.
  downstream:
  - target: Elevated Cellular RUNX2 Protein and Gain of Transcription Factor Function
    description: >-
      The duplication-bearing transcript yields markedly higher cellular protein
      levels than wild-type RUNX2 in transfection assays.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23290074
      reference_title: >-
        Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transfection studies with murine Runx2 cDNA showed that cellular levels of mutated RUNX2 were markedly higher than those of wild-type RUNX2, suggesting that the RUNX2 duplication found in individuals with MDMHB leads to a gain of function.
      explanation: >-
        The functional experiment that establishes this edge.
- name: Elevated Cellular RUNX2 Protein and Gain of Transcription Factor Function
  biological_scale: MOLECULAR
  description: >-
    RUNX2 is the master transcription factor of osteoblast differentiation and
    of the chondrocyte hypertrophy that precedes endochondral bone formation.
    In MDMHB it is present at raised cellular levels and acts as a gain of
    function. This is the mirror image of cleidocranial dysplasia, where RUNX2
    haploinsufficiency causes clavicular hypoplasia and delayed cranial
    ossification, and it is why the two RUNX2 diseases have almost non-
    overlapping skeletal phenotypes: the clavicles are enlarged here and
    hypoplastic or absent there.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: osteoblast differentiation
    modifier: ABNORMAL
    term:
      id: GO:0001649
      label: osteoblast differentiation
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  evidence:
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Until now, only loss-of-function mutations have been detected in RUNX2; the present report associates an apparent gain-of-function alteration of RUNX2 function with a distinct rare disease.
    explanation: >-
      States explicitly that this is a gain-of-function RUNX2 disease, in
      contrast with every previously known RUNX2 allele.
  downstream:
  - target: Disordered Metaphyseal Modelling
    description: >-
      Raised RUNX2 activity in the growth plate and metaphyseal osteoblast
      compartment disturbs the modelling that normally narrows the metaphysis
      as the bone lengthens.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38108099
      reference_title: >-
        RUNX2-related metaphyseal dysplasia with maxillary hypoplasia: A rare skeletal disorder resembling SFRP4-related Pyle disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical and radiographic examination revealed mild facial dysmorphism, dental anomalies, enlarged clavicles, genua valga and metaphyseal flaring and thin cortices with an osteoporotic skeletal appearance.
      explanation: >-
        Documents the metaphyseal flaring with thin cortices that this node
        produces.
  - target: Impaired Intramembranous Craniofacial and Dental Development
    description: >-
      The same transcription factor governs maxillary intramembranous
      ossification and tooth morphogenesis, which is why the craniofacial and
      dental features travel with the metaphyseal ones.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29852250
      reference_title: Oro-dental phenotype in patients with RUNX2 duplication.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Runt-related transcription factor 2 (RUNX2) is well-known for its role in bone development and tooth morphogenesis.
      explanation: >-
        Establishes RUNX2's role in tooth morphogenesis, the basis for linking
        the dental phenotype to the same transcription factor. Note the cohort
        in that paper carries a whole-gene rather than an intragenic RUNX2
        duplication, so it is cited here for the gene's role, not as an MDMHB
        case series.
- name: Disordered Metaphyseal Modelling
  biological_scale: TISSUE
  description: >-
    Failure of the normal funnelling of the metaphysis produces flaring of the
    long-bone metaphyses with thin cortices and an osteoporotic radiographic
    appearance, together with enlargement of the medial halves of the clavicles.
    This radiographic combination is close enough to Pyle disease to have been
    proposed as evidence that RUNX2 and sFRP4 act on intersecting pathways in
    metaphyseal modelling.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:38108099
    reference_title: >-
      RUNX2-related metaphyseal dysplasia with maxillary hypoplasia: A rare skeletal disorder resembling SFRP4-related Pyle disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We review previously reported cases with MDMHB and highlight the resemblance of this disorder with Pyle disease, which may be explained by intersecting molecular pathways between RUNX2 and sFRP4.
    explanation: >-
      Source for the Pyle-disease resemblance and the proposed pathway
      intersection described in this node.
  downstream:
  - target: Metaphyseal Flaring with Skeletal Fragility
    description: >-
      Flared metaphyses with thin cortices translate clinically into an
      osteoporotic skeleton and genu valgum.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29891876
      reference_title: >-
        A three-generation family with metaphyseal dysplasia, maxillary hypoplasia and brachydactyly (MDMHB) due to intragenic RUNX2 duplication.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly (MDMHB) is an autosomal-dominant skeletal dysplasia characterised by metaphyseal flaring of the long bones, enlargement of the medial halves of the clavicles, maxillary hypoplasia, brachydactyly, dental anomalies and mild osteoporosis.
      explanation: >-
        Lists mild osteoporosis alongside the metaphyseal flaring, which is the
        link this edge asserts.
- name: Impaired Intramembranous Craniofacial and Dental Development
  biological_scale: TISSUE
  description: >-
    Maxillary hypoplasia with a beaked nose, short philtrum and thin lips, plus
    dystrophic yellowish teeth. The dental component is often what brings
    affected people to medical attention, ahead of any skeletal complaint.
  evidence:
  - reference: PMID:7137223
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Facial manifestations include beaked nose, short philtrum, thin lips, maxillary hypoplasia, dystrophic yellowish teeth.
    explanation: >-
      The original clinical description of the craniofacial and dental
      phenotype.
  downstream:
  - target: Dental Disease as Presenting Complaint
    description: >-
      The dental anomalies are severe enough to dominate presentation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29891876
      reference_title: >-
        A three-generation family with metaphyseal dysplasia, maxillary hypoplasia and brachydactyly (MDMHB) due to intragenic RUNX2 duplication.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dental problems were the primary presenting feature in all four affected individuals.
      explanation: >-
        Direct evidence that the dental phenotype leads the presentation.
- name: Metaphyseal Flaring with Skeletal Fragility
  biological_scale: ORGANISM
  description: >-
    The expressed skeletal disease: flared metaphyses, enlarged medial clavicles,
    thin cortices, mild osteoporosis, genu valgum, and disproportionate short
    stature with variable brachydactyly.
  evidence:
  - reference: PMID:23290074
    reference_title: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly is caused by a duplication in RUNX2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal dysplasia with maxillary hypoplasia and brachydactyly (MDMHB) is an autosomal-dominant bone dysplasia characterized by metaphyseal flaring of long bones, enlargement of the medial halves of the clavicles, maxillary hypoplasia, variable brachydactyly, and dystrophic teeth.
    explanation: >-
      Defines the expressed skeletal phenotype recorded in this node.
- name: Dental Disease as Presenting Complaint
  biological_scale: ORGANISM
  description: >-
    Significant dental problems, usually in childhood or adolescence, are the
    route by which most affected people enter the diagnostic pathway. Recognising
    the skeletal dysplasia behind them is the clinical lesson of the disorder.
  evidence:
  - reference: PMID:29891876
    reference_title: >-
      A three-generation family with metaphyseal dysplasia, maxillary hypoplasia and brachydactyly (MDMHB) due to intragenic RUNX2 duplication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      highlight the importance of considering an underlying skeletal dysplasia in patients presenting with significant dental problems and other suggestive features, including disproportionate short stature and/or digital anomalies
    explanation: >-
      States the diagnostic implication that defines this node.

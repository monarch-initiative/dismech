- name: Reduced Nuclear Pore Complex Assembly
  biological_scale: CELLULAR
  description: >-
    Deleting NUP133 from immortalized human podocytes lowers nuclear envelope staining for mature pores by 37 to 40%
    without abolishing them. Re-expressing the patient alleles p.Ser974Arg or c.3335-11T>A restores pore assembly almost
    to wild-type levels, with only slightly reduced recruitment of NUP133 and NUP107 to the nuclear envelope, and partial
    nup133 knockdown in zebrafish causes glomerular disease without a gross pore assembly defect. A large pore deficit is
    therefore not established for the disease alleles.

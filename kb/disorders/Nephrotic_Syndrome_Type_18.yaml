    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Using coimmunoprecipitation experiments, we showed that certain pathogenic alleles weakened the interaction between
      neighboring NPC subunits.
    explanation: >-

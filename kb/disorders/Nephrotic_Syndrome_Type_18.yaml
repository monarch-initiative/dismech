- name: Weakened NUP107-NUP133 Y-Complex Interaction
  biological_scale: MOLECULAR
  description: >-
    NUP133 binds NUP107 within the Y-complex (NUP107-160 subcomplex), the building block of the cytoplasmic and nuclear
    outer rings of the pore. Patient alleles weaken this interaction without abolishing it. In NUP133 knockout podocytes
    NUP107 protein falls while its transcript does not, consistent with destabilization of the Y-complex.
  cellular_components:

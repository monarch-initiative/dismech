pathophysiology:
- name: Biallelic NUP133 Hypomorphic Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous NUP133 variants: missense alleles (p.Ser974Arg, p.Lys966Asn) and an intronic
    variant that inserts intronic sequence into the transcript. ClinGen records loss of function as the mechanism; in
    podocytes the patient alleles behave as partial loss of function. Mice lacking Nup133 die at midgestation; that
    disease alleles must therefore retain some function is a curator inference.

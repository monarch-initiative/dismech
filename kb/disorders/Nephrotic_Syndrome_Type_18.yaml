name: Nephrotic Syndrome Type 18
description: >-
  Autosomal recessive steroid-resistant nephrotic syndrome caused by biallelic hypomorphic variants in NUP133, which
  encodes a scaffold nucleoporin of the Y-complex that builds the outer rings of the nuclear pore complex. NUP133 was
  added to the nucleoporin genes of SRNS in a 2018 report of outer-ring nucleoporin variants; few families are known,
  and a pooled review gives a median onset of 9 years and a median age at kidney failure of 13 years. Biopsy shows
  focal segmental glomerulosclerosis. Patient alleles weaken the binding of NUP133 to its Y-complex partner NUP107.
  Knocking NUP133 out of human podocytes impairs nuclear pore assembly, alters the podocyte transcriptome and disturbs
  RhoGTPase and actin cytoskeleton regulation, while patient alleles re-expressed in the same cells give only mild
  defects. Partial knockdown in zebrafish causes proteinuria and foot process effacement without a gross pore assembly
  defect. The same gene causes Galloway-Mowat syndrome 8, in which nephrotic syndrome is combined with microcephaly and
  brain anomalies; ClinGen lumps the two as one disease spectrum and classifies the relationship as Moderate.
category: Mendelian

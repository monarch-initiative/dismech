animal_models:
- name: Zebrafish nup133 morpholino knockdown
  species: Zebrafish
  genotype: Splice-blocking morpholino knockdown of nup133
  publication: PMID:30894603
  description: >-
    Partial depletion of Nup133 in zebrafish larvae causes pronephric cysts, proteinuria shown by labelled-albumin
    leakage, and moderate foot process effacement, rescued by wild-type nup133 mRNA. Overall nuclear pore assembly and
    early kidney development are preserved, so the defect is in maintaining the glomerular filtration barrier.
  modeled_mechanisms:
  - target: Podocyte Injury and Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Morpholino knockdown rather than patient alleles, and partial depletion; the model shows barrier failure without
      the pore assembly defect, and a separate left-right patterning phenotype was not rescued and may be off-target.
    evidence:
    - reference: PMID:30894603
      reference_title: Moderate Nucleoporin 133 deficiency leads to glomerular damage in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        nup133 downregulation results in proteinuria and moderate foot process effacement, mimicking some of the
        abnormalities typically featured by patients with nephrotic syndrome
      explanation: Reproduces the barrier failure of nephrotic syndrome.
  - target: Reduced Nuclear Pore Complex Assembly
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Partial depletion sufficient to injure the glomerulus did not produce a detectable pore assembly defect, so the
      model does not reproduce a reduction in pore assembly as the pathway to injury.
    evidence:
    - reference: PMID:30894603
      reference_title: Moderate Nucleoporin 133 deficiency leads to glomerular damage in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Likewise, no gross defect in nuclear pore complex assembly was observed in these nup133 morphants.
      explanation: No pore assembly defect despite glomerular injury.
experimental_models:
- name: NUP133 knockout and patient-allele human podocyte line
  experimental_model_type: CELL_LINE
  description: >-
    CRISPR/Cas9 NUP133 knockout in immortalized human podocytes (AB8/13), with re-expression of wild-type or the patient
    alleles p.Ser974Arg and c.3335-11T>A. Knockout reduces pore assembly, destabilizes NUP107, reshapes the transcriptome
    and impairs cell spreading; the patient alleles give only mild defects.
  publication: PMID:35455939
  modeled_mechanisms:
  - target: Reduced Nuclear Pore Complex Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      The knockout, not the patient alleles, produces the pore assembly defect; re-expressed patient alleles restore
      most pore assembly, so the model's strong phenotype overstates the disease state.
    evidence:
    - reference: PMID:35455939
      reference_title: NUP133 Controls Nuclear Pore Assembly, Transcriptome Composition, and Cytoskeleton Regulation in
        Podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Mechanistically, the loss of NUP133 leads to a defective and decreased assembly of NPCs in the nuclear envelope
      explanation: Knockout podocytes assemble fewer pores.
  - target: Disturbed RhoGTPase and Actin Cytoskeleton Regulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Cell spreading is a surrogate for actin cytoskeleton dynamics, not a measure of podocyte function in vivo.
    evidence:
    - reference: PMID:35455939
      reference_title: NUP133 Controls Nuclear Pore Assembly, Transcriptome Composition, and Cytoskeleton Regulation in
        Podocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These experiments demonstrated a reduced spreading capacity of the respective NUP133 KO and mutant podocytes.
      explanation: Both knockout and patient-allele podocytes spread less.
discussions:
- discussion_id: nup133_mild_allele_phenotype
  kind: OPEN_QUESTION
  prompt: How do NUP133 patient alleles cause podocyte disease when they give only mild cellular defects?
  rationale: >-
    The podocyte knockout model produces a large pore assembly, transcriptome and cytoskeleton phenotype, but when the
    reported patient alleles are re-expressed in the same cells the defects are mild and the transcriptome is largely
    unchanged. The zebrafish model likewise shows glomerular injury without a gross pore assembly defect. The authors
    propose that a small reduction in NUP133 function matters only in cell types with low functional reserve, such as
    podocytes, but how the mild molecular defect translates into human disease is unresolved. Two candidate accounts
    rest on other systems: NPC scaffold elasticity protecting the nuclear envelope under mechanical load (shown in
    Nup133-null embryonic stem cells during neuronal differentiation), and YAP/TAZ signalling (NUP133 co-purifies with
    YAP/TAZ in podocytes, but import dependence is shown only for NUP205).
  attaches_to:
  - pathophysiology#Reduced Nuclear Pore Complex Assembly
  - pathophysiology#Altered Podocyte Transcriptome
  evidence:
  - reference: PMID:35455939
    reference_title: NUP133 Controls Nuclear Pore Assembly, Transcriptome Composition, and Cytoskeleton Regulation in
      Podocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Such slight impairments might only have relevant effects in sensitive cell types, which depend on the tight
      expressional control of a given type of signaling pathways and/or have low functional reserves, e.g., NUP133
    explanation: The authors' proposed account of the mild-allele paradox.
  - reference: PMID:30894603
    reference_title: Moderate Nucleoporin 133 deficiency leads to glomerular damage in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the kidney appears to be the organ with the highest sensitivity to moderate Nup133 or Nup107 deficiencies.
    explanation: The zebrafish data support kidney-specific sensitivity to partial Nup133 loss.
  - reference: PMID:40205196
    reference_title: Nuclear pores safeguard the integrity of the nuclear envelope.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that the elasticity of the NPC scaffold has a protective function for the nuclear envelope and that its
      perturbation becomes critical under conditions that impose an increased mechanical load onto nuclei.
    explanation: >-
      A candidate account of tissue specificity, from Nup133-null mouse embryonic stem cells during neuronal
      differentiation; whether podocyte nuclei face a comparable mechanical load has not been tested.
  - reference: PMID:37565816
    reference_title: The role of the FSGS disease gene product and nuclear pore protein NUP205 in regulating nuclear
      localization and activity of transcriptional regulators YAP and TAZ.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      we identify the FSGS disease gene products NUP107, NUP133, NUP205, and Exportin-5 (XPO5) as components of YAP and
      TAZ protein complexes in podocytes
    explanation: >-
      NUP133 co-purifies with YAP/TAZ in podocytes, but the import dependence was shown only for NUP205; a NUP133 role
      in YAP/TAZ signalling is a lead, not a finding.
notes: >-
  No dedicated GeneReviews chapter exists for this disorder; it is covered as one row of the Genetic Steroid-Resistant
  Nephrotic Syndrome Overview (PMID:34436835), which lists NUP133 as autosomal recessive. ClinGen's Glomerulopathy GCEP
  lumps nephrotic syndrome type 18 and Galloway-Mowat syndrome 8 into one NUP133 disease spectrum and rates it Moderate;
  the entry is scoped to the isolated renal form, and the syndromic form is a has_subtypes row (GAMOS8) in
  kb/disorders/Galloway-Mowat_Syndrome.yaml. Epidemiology is sparse: median onset and kidney-failure figures come from
  one pooled review (PMID:39331077) that orders the six nucleoporin genes NUP85, NUP93, NUP107, NUP133, NUP160, NUP205,
  so NUP133 is the fourth value in each list (onset 9 years, kidney failure 13 years). The CDC42 node is supported for
  NUP133 by the founding report's podocyte knockout; the SMAD pathway shown for NUP93 is not transferred here. The mild
  phenotype of the patient alleles relative to the knockout is recorded as an open question. The review's 12.5%
  post-transplant recurrence rate refers to NUP93 patients only; the review abstract gives no NUP133 figure, so none is
  given here.

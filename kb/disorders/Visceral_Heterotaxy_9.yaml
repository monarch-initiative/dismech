    snippet: >-
      The first patient was a female presenting complete situs inversus and unusual
      symptoms, including severe myopia and dental agenesis of 10 permanent teeth.
    explanation: >-
      Independent report of complete situs inversus in a compound heterozygous
      individual.

- category: Cardiovascular
  name: Complex congenital heart disease
  description: >-
    Where the laterality defect is true heterotaxy rather than complete inversion,
    the cardiac segments are discordantly arranged and complex structural heart
    disease results. This is the principal determinant of morbidity in affected
    individuals.
  phenotype_term:
    preferred_term: Complex congenital heart malformation
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four affected individuals presented with laterality defects, including
      one male individual with heterotaxia and complex congenital heart defects.
    explanation: >-
      Reports complex congenital heart defects in the individual with true
      heterotaxy.
  notes: >-
    HP:0001627 (Abnormal heart morphology) is used because HPO has no single term
    for complex congenital heart disease; the preferred_term carries the intended
    clinical granularity.

- category: Developmental
  name: Asplenia
  description: >-
    Splenic agenesis, reported with right isomerism (bilateral right-sidedness) in
    an MNS1-deficient individual with complex congenital heart disease. Asplenia is
    the classic splenic accompaniment of right isomerism and carries a lifelong
    risk of overwhelming encapsulated-organism sepsis, so it changes management
    (immunisation, antibiotic prophylaxis) rather than being an incidental
    anatomical note.
  phenotype_term:
    preferred_term: Asplenia
    term:
      id: HP:0001746
      label: Asplenia
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual EX-1II1 presented with right isomerism, asplenia, and complex
      congenital heart disease that required surgical intervention.
    explanation: >-
      Reports asplenia in an MNS1-deficient individual, together with the right
      isomerism that mechanistically explains it.

- category: Respiratory
  name: Recurrent otitis media
  description: >-
    Middle-ear disease is the mildest and most frequently isolated airway
    manifestation of MNS1 deficiency. In the Amish founder pedigree it was the only
    airway symptom in any affected individual, the rest being explicitly free of
    primary ciliary dyskinesia symptoms - which is the clearest single illustration
    of how attenuated the airway arm is in this disorder relative to classic PCD.
  phenotype_term:
    preferred_term: Recurrent otitis media
    term:
      id: HP:0000403
      label: Recurrent otitis media
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals were clinically assessed, no PCD symptoms were
      reported, with the exception of IX-1 who suffered recurrent otitis media.
    explanation: >-
      IX-1 was the only individual in this pedigree with any airway symptom; every
      other assessed homozygote was explicitly free of PCD symptoms. Against the six
      homozygotes the same paper reports, that is 1/6 (17%), inside the occasional
      (5-29%) band.

- category: Reproductive
  name: Male infertility
  description: >-
    Consistently reported in homozygous adult males. Infertility is primary and
    gamete-intrinsic; assisted reproduction by intracytoplasmic sperm injection was
    unsuccessful in the one reported attempt.
  phenotype_term:
    preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study identifies an MNS1 variant as a cause of laterality defects and
      male infertility in humans, mirroring findings in Mns1-deficient mice which
      also display male infertility and randomisation of left-right asymmetry of
      internal organs, confirming a crucial role for MNS1 in nodal cilia and sperm
      flagella formation and function.
    explanation: >-
      States male infertility as an established consequence of the MNS1 variant in
      humans.
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of three intracytoplasmic sperm injection cycles were carried out for
      the proband's wife, but they all failed to lead to a successful pregnancy.
    explanation: >-
      Documents failure of assisted reproduction, the practical severity of the
      infertility phenotype.

- category: Reproductive
  name: Reduced sperm motility
  description: >-
    Spermatozoa are immotile or severely hypomotile because the flagellar axoneme
    lacks its normal outer dynein arm complement and 9+2 organisation.
  phenotype_term:
    preferred_term: Reduced sperm motility
    term:
      id: HP:0012207
      label: Reduced sperm motility
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The semen examination results of the proband were as follows: semen volume,
      3.4 ml; sperm concentration, 1.8 × 106 ml−1; and percentage progressive
      motility, 5.8%.
    explanation: >-
      Progressive motility measured at 5.8% in the MNS1-deficient proband, far
      below the WHO lower reference limit. A measured value in a named individual
      rather than a definition of the term.
  - reference: PMID:22396656
    reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MNS1-deficient males are sterile, as they exhibit a sharp reduction in sperm
      production and the remnant sperm are immotile with abnormal short tails.
    explanation: >-
      Mouse null spermatozoa are immotile. Kept as MODEL_ORGANISM alongside the
      human oligoasthenoteratozoospermia report rather than substituting for it.

- category: Reproductive
  name: Oligozoospermia
  description: Reduced sperm concentration, part of the oligoasthenoteratozoospermia phenotype.
  phenotype_term:
    preferred_term: Oligozoospermia
    term:
      id: HP:0000798
      label: Oligozoospermia
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The semen examination results of the proband were as follows: semen volume,
      3.4 ml; sperm concentration, 1.8 × 106 ml−1; and percentage progressive
      motility, 5.8%.
    explanation: >-
      Sperm concentration measured at 1.8 million per ml in the MNS1-deficient
      proband, an order of magnitude below the WHO lower reference limit.

- category: Reproductive
  name: Abnormal sperm morphology
  description: >-
    Spermatozoa show abnormal head and tail morphology, with short and malformed
    flagella and disorganised outer doublet microtubules.
  phenotype_term:
    preferred_term: Abnormal sperm morphology
    term:
      id: HP:0012864
      label: Abnormal sperm morphology
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal flagellum morphology and ultrastructural disturbances in outer
      doublet microtubules were observed in the proband's sperm.
    explanation: >-
      Direct morphological and ultrastructural description of the patient's
      spermatozoa.

- category: Respiratory
  name: Recurrent respiratory tract infections
  description: >-
    Reported in a minority of affected individuals. This is an extension of the
    originally described phenotype and is not the usual presentation of MNS1
    deficiency; most affected individuals have no significant airway disease.
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, a single affected six-year-old girl homozygous for an MNS1
      nonsense variant presented with a history of neonatal respiratory distress
      syndrome, recurrent respiratory tract infections, chronic rhinitis, and wet
      cough.
    explanation: >-
      One of five newly reported individuals, framed by the authors as noteworthy
      precisely because it is unusual, had a pronounced respiratory phenotype;
      combined with the two further individuals reported to have only a mild
      respiratory phenotype this supports an occasional (5-29%) band for clinically
      significant recurrent infection.

- category: Respiratory
  name: Chronic rhinitis
  description: >-
    Part of the airway phenotype documented in the minority of MNS1-deficient
    individuals with respiratory involvement.
  phenotype_term:
    preferred_term: Chronic rhinitis
    term:
      id: HP:0002257
      label: Chronic rhinitis
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, a single affected six-year-old girl homozygous for an MNS1
      nonsense variant presented with a history of neonatal respiratory distress
      syndrome, recurrent respiratory tract infections, chronic rhinitis, and wet
      cough.
    explanation: >-
      Chronic rhinitis is explicitly enumerated in the respiratory presentation.

- category: Respiratory
  name: Neonatal respiratory distress
  description: >-
    Neonatal respiratory distress syndrome, a recognised early presentation of
    motile ciliopathies, was reported in the individual with the most pronounced
    MNS1 airway phenotype.
  phenotype_term:
    preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, a single affected six-year-old girl homozygous for an MNS1
      nonsense variant presented with a history of neonatal respiratory distress
      syndrome, recurrent respiratory tract infections, chronic rhinitis, and wet
      cough.
    explanation: >-
      Neonatal respiratory distress syndrome is explicitly reported.

- category: Cellular
  name: Partial absence of outer dynein arms in respiratory cilia
  description: >-
    Transmission electron microscopy of respiratory epithelial cells shows a subtle,
    partial loss of outer dynein arms, most marked distally. The subtlety of this
    lesion, compared with the complete ODA loss of DNAH5- or DNAI1-related disease,
    is the ultrastructural correlate of the mild airway phenotype.
  phenotype_term:
    preferred_term: Absent outer dynein arms
    term:
      id: HP:0012256
      label: Absent outer dynein arms
  diagnostic: true
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In-depth ultrastructural analyses confirmed a subtle outer dynein arm (ODA)
      defect in the axonemes of respiratory epithelial cells resembling findings
      reported in Mns1-deficient mice.
    explanation: >-
      Recorded as PARTIAL because the defect described is subtle and partial,
      whereas HP:0012256 (Absent outer dynein arms) names complete absence; the HPO
      term is the closest available and the preferred_term and description carry
      the qualification.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than twenty affected individuals have been reported since the disease was
    delineated in 2018: five in the index cohort of four consanguineous families,
    an extended Amish founder pedigree, five individuals from four further
    families, three individuals in a French/GeneMatcher report, one Han Chinese
    proband ascertained through infertility, and single cases in heterotaxy cohort
    studies. No population prevalence estimate exists.
  evidence:
  - reference: PMID:39233552
    reference_title: Expanding MNS1 Heterotaxy Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We add here new cases with the ultra-rare MNS1-related disorder and provide a
      review of all published individuals.
    explanation: >-
      The most recent review of all published individuals characterises the
      disorder as ultra-rare.
  - reference: PMID:39233552
    reference_title: Expanding MNS1 Heterotaxy Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, two different homozygous MNS1 variants have been associated with
      autosomal recessive visceral heterotaxy
    explanation: >-
      Quantifies how small the reported allelic series was at the time of the most
      recent review.
- population: Consanguineous heterotaxy cohort, Saudi Arabia
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    MNS1 was one of eight autosomal recessive heterotaxy genes identified in a
    consecutively recruited consanguineous cohort of 24 affected individuals from
    19 families, illustrating that MNS1 is a recurring but individually minor
    contributor to the genetic architecture of heterotaxy.
  evidence:
  - reference: PMID:39513328
    reference_title: Genetic Analysis of Heterotaxy in a Consanguineous Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis, with exome sequencing, genome sequencing, or multigene
      panel, detected 9 unique variants, 7 of which were novel, in 8 genes known to
      be implicated in autosomal recessive form of HTX (C1orf127, CCDC39, CIROP,
      DNAAF3, DNAH5, DNAH9, MMP21, and MNS1) providing a yield of 42.1%.
    explanation: >-
      Places MNS1 among the recurrently implicated autosomal recessive heterotaxy
      genes in a consanguineous population.

animal_models:
- name: Mns1 knockout mouse
  species: Mouse
  genotype: Mns1 null (homozygous)
  publication: PMID:22396656
  description: >-
    The founding loss-of-function model for MNS1 deficiency. Mns1-null males are
    sterile with markedly reduced sperm production and immotile, short-tailed
    spermatozoa in which the 9+2 microtubule arrangement and outer dense fibres are
    disrupted. The mice also display situs inversus and hydrocephalus, and their
    tracheal motile cilia lack a subset of outer dynein arms - the same partial ODA
    lesion later found in human patients.
  evidence:
  - reference: PMID:22396656
    reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that MNS1, a coiled-coil protein of unknown function, is
      essential for spermiogenesis.
    explanation: >-
      Establishes the Mns1-null mouse as a characterised loss-of-function model of
      the gene curated here.
  modeled_mechanisms:
  - target: Sperm Flagellar Axoneme Assembly Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse null reproduces the human flagellar assembly defect at both the
      light-microscopic (short, immotile tails) and ultrastructural (disrupted 9+2
      axoneme and outer dense fibres) level.
    limitations: >-
      Mouse sterility is complete, whereas the human phenotype is reported as
      severe oligoasthenoteratozoospermia with residual sperm production; the human
      quantitative severity is therefore not identical.
    readouts:
    - name: Sperm production and flagellar ultrastructure
      target: Sperm Flagellar Axoneme Assembly Failure
      direction: DECREASED
      interpretation: >-
        Reduced sperm output with disrupted axonemal and outer dense fibre
        architecture is the structural correlate of the flagellar assembly node.
      evidence:
      - reference: PMID:22396656
        reference_title: >-
          MNS1 is essential for spermiogenesis and motile ciliary functions in
          mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          MNS1-deficient males are sterile, as they exhibit a sharp reduction in
          sperm production and the remnant sperm are immotile with abnormal short
          tails.
        explanation: >-
          Reports the measured reduction in sperm production and the flagellar
          abnormality.
    evidence:
    - reference: PMID:22396656
      reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results demonstrate that MNS1 is essential for spermiogenesis, the
        assembly of sperm flagella, and motile ciliary functions.
      explanation: >-
        Establishes the model as informative for the flagellar assembly mechanism.
  - target: Nodal Cilia Motility Failure at the Left-Right Organizer
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mns1-null mice display situs inversus, the organismal readout of failed nodal
      cilium function, and their tracheal motile cilia show the partial outer dynein
      arm loss that is the presumed proximate cause.
    limitations: >-
      Nodal cilium beating and nodal flow were not measured directly in this study;
      situs inversus and tracheal ciliary ultrastructure are used as proxies. The
      mouse also develops hydrocephalus, which has not been reported in
      MNS1-deficient humans.
    readouts:
    - name: Tracheal ciliary outer dynein arm content
      target: Nodal Cilia Motility Failure at the Left-Right Organizer
      direction: DECREASED
      interpretation: >-
        Partial loss of outer dynein arms from motile cilia is the ultrastructural
        readout supporting impaired ciliary beating in this model.
      evidence:
      - reference: PMID:22396656
        reference_title: >-
          MNS1 is essential for spermiogenesis and motile ciliary functions in
          mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: MNS1-deficient tracheal motile cilia lack some outer dynein arms in the axoneme.
        explanation: >-
          Reports the measured ultrastructural deficit, and notably that it is
          partial, matching the human finding.
    evidence:
    - reference: PMID:22396656
      reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In addition, MNS1-deficient mice display situs inversus and hydrocephalus.
      explanation: >-
        The laterality phenotype in the mouse null is the organismal evidence that
        this model is informative for the nodal-cilium node.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis rests on identification of biallelic loss-of-function MNS1 variants by
    exome, genome or motile-ciliopathy panel sequencing in an individual with a
    laterality defect, with or without male infertility. Because the airway
    phenotype is usually absent, MNS1 deficiency is frequently reached through
    genome-wide sequencing of a heterotaxy cohort rather than through a primary
    ciliary dyskinesia diagnostic pathway.
  evidence:
  - reference: PMID:39513328
    reference_title: Genetic Analysis of Heterotaxy in a Consanguineous Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our work demonstrates a relatively high yield of genetic testing in HTX in a
      consanguineous population with an enrichment of homozygous variants.
    explanation: >-
      Supports genome-wide molecular testing as the diagnostic route by which
      recessive heterotaxy genes including MNS1 are identified.
- name: Immunofluorescence analysis of ciliated cells
  description: >-
    Immunofluorescence staining of respiratory epithelial cells or spermatozoa
    demonstrates absence of MNS1 from the axoneme, and is used to confirm the
    functional consequence of candidate variants.
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accordingly, immunofluorescence analysis showed the absence of MNS1 from the
      respiratory epithelial cells of this individual.
    explanation: >-
      Demonstrates the use of immunofluorescence to confirm loss of the MNS1 protein
      in a patient sample.

environmental:
- name: Gestational alcohol exposure during gastrulation
  description: >-
    Not a cause of HTX9, and not currently an established modifier of it in people.
    This entry records the one published gene-environment interaction involving the
    causal gene: in mice, reducing Mns1 dosage sharply increases susceptibility to
    the ocular, craniofacial and midline brain defects produced by alcohol given at
    gastrulation (GD7), the same developmental window in which the motile monocilia
    of the left-right organiser establish the morphogen gradients that pattern the
    midline. Defect rates rose from 41% in alcohol-exposed wild-type fetuses to 64%
    in Mns1 heterozygotes and 92% in Mns1 nulls. The readout in that work was
    craniofacial and ocular dysmorphology, NOT laterality reversal, so the
    interaction is recorded here as modulating the shared nodal-cilia mechanism
    rather than as an exposure that triggers or worsens heterotaxy itself.
  exposure_term:
    preferred_term: prenatal alcohol exposure during gastrulation
    term:
      id: ECTO:0300001
      label: exposure to drinking alcohol via maternal
  evidence:
  - reference: PMID:30129265
    reference_title: >-
      Knockdown of Mns1 Increases Susceptibility to Craniofacial Defects Following
      Gastrulation-Stage Alcohol Exposure in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PAE interacted with genotype to significantly increase the defect rate and
      severity in Mns1+/- (64.29%) and Mns1-/- mice (92.31%)
    explanation: >-
      The gene-environment interaction itself, with the dose-ordered effect across
      Mns1 genotypes that makes it an interaction rather than two additive insults.
  influences_mechanisms:
  - target: Nodal Cilia Motility Failure at the Left-Right Organizer
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      What is established is a genotype-by-treatment interaction: Mns1 dosage and
      gastrulation-stage alcohol combine to raise defect rates well above either
      alone. The mechanism joining them is NOT established, and the cited authors do
      not claim the nodal motile-cilia route. Their own discussion points instead at
      primary (non-motile) cilia and Shh signalling, and at MFN2-mediated apoptosis,
      and it notes that alcohol-exposed nulls showed situs inversus - i.e.
      demonstrable motile-cilia disruption - without that tracking craniofacial
      outcome. The link is attached to the nodal node because that is the
      MNS1-dependent process this entry models and the one the exposure window
      coincides with, not because the source attributes the interaction to it.
      INDIRECT_UNKNOWN_INTERMEDIATES records exactly that unresolved middle.
    evidence:
    - reference: PMID:30129265
      reference_title: >-
        Knockdown of Mns1 Increases Susceptibility to Craniofacial Defects Following
        Gastrulation-Stage Alcohol Exposure in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        interacts with PAE to increase the susceptibility to ocular defects
      explanation: >-
        The interaction claim this link asserts, from the paper's conclusions rather
        than its background.
    - reference: PMID:30129265
      reference_title: >-
        Knockdown of Mns1 Increases Susceptibility to Craniofacial Defects Following
        Gastrulation-Stage Alcohol Exposure in Mice.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        likely though interaction of alcohol with motile cilia function
      explanation: >-
        The closest the source comes to naming the motile-cilia route this link is
        attached to, and it is explicitly hedged as "likely". Recorded as INDIRECT
        so the hedge is not lost.
    - reference: PMID:30129265
      reference_title: >-
        Knockdown of Mns1 Increases Susceptibility to Craniofacial Defects Following
        Gastrulation-Stage Alcohol Exposure in Mice.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        our data suggest that MNS1 plays a role in primary cilia function
      explanation: >-
        Cuts against attributing the interaction to MOTILE nodal cilia: the authors'
        own preferred reading implicates primary, non-motile cilia. Carried here as
        a REFUTE rather than omitted, because the alternative is a link that reads
        more settled than its source.
  notes: >-
    Deliberately recorded as MODULATES and not as EXACERBATES or PREDISPOSES. Three
    limits are worth stating plainly. The evidence is entirely murine; no human
    study has examined alcohol exposure in an MNS1-deficient pregnancy, and HTX9 is
    ultra-rare enough that none is likely soon. The phenotype that alcohol
    potentiated was craniofacial, ocular and midline - none of which is a reported
    feature of human MNS1 deficiency - so this is not evidence that alcohol worsens
    laterality or infertility. And the interaction was demonstrated in heterozygotes
    as well as nulls, which makes it a statement about Mns1 dosage generally rather
    than about the biallelic loss-of-function state that defines HTX9. It is
    included because it is the only published environmental modifier of this gene
    and because the converging mechanism is specific and testable, not because it
    supports a clinical recommendation.

treatments:
- name: Surgical management of congenital heart disease
  description: >-
    In individuals with true heterotaxy and complex congenital heart disease,
    staged cardiac surgical repair or palliation is the mainstay of management.
    There is no MNS1-directed or mechanism-targeted therapy; management is entirely
    supportive and directed at the individual anatomical and functional consequences
    of the laterality defect.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Complex congenital heart malformation
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  notes: >-
    Deliberately carries no evidence item: no MNS1-specific management study or
    guideline exists. Recorded because omitting management entirely would
    misrepresent the clinical picture, but citing a paper that does not make this
    claim would be worse than citing none.
- name: Assisted reproduction (intracytoplasmic sperm injection)
  description: >-
    ICSI is the conventional approach to severe oligoasthenoteratozoospermia. In the
    single reported MNS1-deficient couple, three ICSI cycles all failed to achieve
    pregnancy, so ICSI should not be presented to affected men as reliably
    effective.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_phenotypes:
  - preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  target_mechanisms:
  - target: Oligoasthenoteratozoospermia and Male Infertility
    treatment_effect: BYPASSES
    description: >-
      ICSI does not correct the flagellar lesion. It circumvents the requirement
      for sperm motility and normal morphology by injecting a single spermatozoon
      directly into the oocyte, so it acts on the reproductive consequence rather
      than on any upstream mechanism node. In the one reported MNS1-deficient
      couple the bypass worked as far as fertilisation and cleavage but did not
      produce a pregnancy, so it is recorded as an incomplete bypass.
    evidence:
    - reference: PMID:33037173
      reference_title: >-
        A novel homozygous frameshift mutation in MNS1 associated with severe
        oligoasthenoteratozoospermia in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        eight eggs were fertilized successfully (fertilization rate: 80%), and
        eight viable cleavage embryos were achieved, which suggests that normal
        embryos could be obtained using the spermatozoa with the MNS1 mutation
        during ICSI treatment
      explanation: >-
        Direct evidence that the gamete-intrinsic defect can be bypassed at
        fertilisation. Recorded as PARTIAL because the same cycle did not lead to
        pregnancy, so the bypass is demonstrated only up to the cleavage stage.
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of three intracytoplasmic sperm injection cycles were carried out for
      the proband's wife, but they all failed to lead to a successful pregnancy.
    explanation: >-
      A negative therapeutic result: three ICSI cycles in the only reported
      MNS1-deficient couple did not achieve pregnancy. Recorded as REFUTE against
      the implicit claim that ICSI reliably rescues fertility in this disorder. This
      is a single couple, so it constrains rather than settles the question.

discussions:
- discussion_id: mns1_pcd_boundary
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Respiratory Ciliary Dysfunction
  prompt: >-
    Does biallelic MNS1 loss of function cause primary ciliary dyskinesia-grade
    airway disease on its own, or only a mild and variable respiratory phenotype
    that requires a second ciliary lesion to become clinically significant?
  rationale: >-
    The two strongest airway observations in MNS1 deficiency are confounded or
    isolated. In the index cohort, the one individual with recurrent respiratory
    infections and the informative distal ODA-docking ultrastructure also carried
    homozygous DNAH5 mutations, a well-established PCD gene, so her airway phenotype
    cannot be attributed to MNS1 alone. The later report of a pronounced respiratory
    phenotype rests on a single six-year-old girl, with two further individuals
    showing only a mild phenotype. ClinGen's Motile Ciliopathy Gene Curation Expert
    Panel classifies the MNS1-primary ciliary dyskinesia gene-disease relationship
    as Disputed. Resolving this matters clinically: it determines whether
    MNS1-deficient individuals need PCD surveillance (airway clearance, spirometry,
    imaging for bronchiectasis) or only laterality and fertility management.
  status: OPEN
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous nonsense mutation p.Gln203* in one female with laterality defects
      and recurrent respiratory infections additionally carrying homozygous
      mutations in DNAH5
    explanation: >-
      Documents the DNAH5 co-mutation that confounds attribution of the airway
      phenotype to MNS1 in the index cohort.
  - reference: CGGV:assertion_255ba802-ece2-43c7-9089-6e54672b4f4a-2022-09-13T170000.000Z
    reference_title: MNS1 / primary ciliary dyskinesia (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MNS1 | HGNC:29636 | primary ciliary dyskinesia | MONDO:0016575 | AR |
      Disputed
    explanation: >-
      An expert panel's formal classification of the MNS1-PCD relationship as
      Disputed, the current authoritative statement of this gap.
  proposed_experiments:
  - experiment_id: mns1_pcd_diagnostic_battery
    name: Systematic PCD diagnostic workup of an MNS1 cohort
    description: >-
      Apply the standard PCD diagnostic battery - nasal nitric oxide, high-speed
      video microscopy of ciliary beat frequency and waveform, transmission electron
      microscopy and air-liquid interface culture - to every reported MNS1-deficient
      individual without a second motile-ciliopathy gene lesion, and compare against
      genotype-matched DNAH5 controls. Only a systematic, second-gene-negative
      series can separate an MNS1-intrinsic airway phenotype from digenic or
      coincidental disease.
    decision_criterion: >-
      MNS1 is judged an independent cause of PCD-grade airway disease if
      second-gene-negative individuals show low nasal nitric oxide together with
      abnormal ciliary beat pattern in the majority of cases; it is judged
      insufficient alone if those individuals are indistinguishable from controls.
    would_support:
    - pathophysiology#Respiratory Ciliary Dysfunction

- discussion_id: mns1_sperm_9plus2_redundancy_paradox
  kind: KNOWLEDGE_GAP
  attaches_to:
  - mechanistic_hypotheses#cfap53_paralogue_redundancy_airway_sparing
  - pathophysiology#Sperm Flagellar Axoneme Assembly Failure
  prompt: >-
    If CFAP53 acts redundantly with MNS1 in (9+2) axonemes, and the sperm flagellum
    is a (9+2) axoneme, why is flagellar assembly failure the most penetrant
    consequence of MNS1 loss in humans while the airway is largely spared?
  rationale: >-
    The paralogue-redundancy model accounts neatly for two of the three arms of this
    disease. Nodal monocilia are (9+0), where CFAP53 is itself essential and cannot
    substitute, so laterality randomisation follows. Airway multiciliated cells are
    (9+2) and buffered, so respiratory disease is mild - which is what ClinGen's
    Disputed classification reflects. The sperm flagellum breaks the pattern: it is
    (9+2) yet fails in every affected male in whom it has actually been assessed.
    The qualifier matters: semen analysis exists for very few, one of the five
    homozygous males in the Amish pedigree was confirmed infertile with no further
    assessment possible, and Ta-Shma's title says "likely male infertility". Whatever breaks that symmetry is the substantive open question,
    and it is not currently answered. Candidate explanations are that CFAP53 is not
    present at sufficient abundance during spermiogenesis, that the flagellum's far
    greater length and mechanical load exceeds what a partially docked outer dynein
    arm array can sustain, or that MNS1 has flagellum-specific partners - the MFN2
    association reported in mouse sperm is the only characterised candidate - that
    have no ciliary equivalent. Distinguishing these matters beyond bookkeeping: it
    determines whether CFAP53 dosage is a plausible modifier locus worth genotyping
    in MNS1-deficient men, and whether the airway really is protected or merely
    under-tested.
  status: OPEN
  evidence:
  - reference: PMID:39007638
    reference_title: >-
      Localisation and function of key axonemal microtubule inner proteins and
      dynein docking complex members reveal extensive diversity among vertebrate
      motile cilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in (9+2) cilia, CFAP53 functions redundantly with a paralogous fMIP, MNS1
    explanation: >-
      Establishes the redundancy that creates the paradox, and restricts it to the
      (9+2) axoneme type the sperm flagellum also uses.
  - reference: PMID:24876927
    reference_title: >-
      Mitochondrial fusion protein MFN2 interacts with the mitostatin-related
      protein MNS1 required for mouse sperm flagellar structure and function.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Co-immunoprecipitation demonstrated an association between MFN2 and MNS1 in
      spermatogenic cells
    explanation: >-
      Names the one characterised flagellum-specific MNS1 interaction that could in
      principle break the symmetry. Cited as a candidate to be tested, not as an
      answer, hence INDIRECT.
  proposed_experiments:
  - experiment_id: cfap53_dosage_across_motile_cell_types
    name: CFAP53 abundance and MNS1 dependence across airway, ependymal and germ cells
    description: >-
      Quantify CFAP53 protein in human airway multiciliated cells and in
      spermatids/spermatozoa from the same donors, then knock MNS1 down in an
      air-liquid interface airway culture and in a germ-cell model while measuring
      outer dynein arm docking by transmission electron microscopy and motility by
      high-speed video microscopy. A CFAP53 rescue arm in the germ-cell model tests
      the redundancy claim directly rather than by correlation.
    decision_criterion: >-
      The redundancy model is supported if CFAP53 is abundant in airway cells and
      scarce in germ cells, and if restoring CFAP53 in the MNS1-deficient germ-cell
      model rescues outer dynein arm docking. It is refuted if CFAP53 is comparably
      abundant in both and rescue fails, which would point instead to a
      flagellum-specific MNS1 partner or a mechanical-load explanation.
    would_support:
    - mechanistic_hypotheses#cfap53_paralogue_redundancy_airway_sparing
    would_refute:
    - mechanistic_hypotheses#cfap53_paralogue_redundancy_airway_sparing
    supporting_outcome:
    - >-
      CFAP53 abundant in airway multiciliated cells and scarce in germ cells, with
      CFAP53 restoration rescuing outer dynein arm docking in the MNS1-deficient
      germ-cell model.
    refuting_outcome:
    - >-
      CFAP53 comparably abundant in both cell types and rescue failing, which would
      leave the airway sparing unexplained by paralogue dosage and point to a
      flagellum-specific MNS1 partner or a mechanical-load account instead.

- discussion_id: mns1_hydrocephalus_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Nodal Cilia Motility Failure at the Left-Right Organizer
  prompt: >-
    Mns1-null mice develop hydrocephalus, a canonical consequence of ependymal
    motile cilia dysfunction, yet hydrocephalus has not been reported in any
    MNS1-deficient human. Is the ependymal arm of MNS1 function genuinely absent in
    humans, or has it simply not been looked for?
  rationale: >-
    Ependymal cilia use the same axonemal machinery as nodal and respiratory cilia,
    so an MNS1-dependent ependymal phenotype is mechanistically expected. Its
    absence from the human literature could reflect a true species difference (mouse
    aqueductal geometry makes murine hydrocephalus far more sensitive to ciliary
    dysfunction than the human equivalent), ascertainment bias (affected individuals
    are ascertained through cardiology and fertility clinics, not neurology, and
    brain imaging is not routinely reported), or the small size of the published
    cohort. This is a model-fidelity question rather than a plain absence of
    evidence: the evidence exists in mouse and its translational validity to human
    disease is what is uncertain.
  status: OPEN
  evidence:
  - reference: PMID:22396656
    reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In addition, MNS1-deficient mice display situs inversus and hydrocephalus.
    explanation: The mouse phenotype that has no reported human counterpart.
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Defects in motile cilia, termed motile ciliopathies, result in clinical
      manifestations affecting the respiratory and reproductive system, as well as
      laterality defects and hydrocephalus.
    explanation: >-
      Hydrocephalus is listed among the expected manifestations of motile
      ciliopathies in general, yet is not among the findings reported in this
      paper's five MNS1-deficient individuals.
  proposed_experiments:
  - experiment_id: mns1_prospective_neuroimaging
    name: Prospective neuroimaging of MNS1-deficient individuals
    description: >-
      Obtain brain MRI with ventricular volumetry in every genetically confirmed
      MNS1-deficient individual, and report ependymal ciliary function where
      post-mortem or surgical tissue is available. This distinguishes a genuine
      species difference from a reporting gap; a negative imaging series across the
      known cohort would itself be a substantive human result.
    decision_criterion: >-
      Ventriculomegaly in a meaningful fraction of the imaged cohort would establish
      the ependymal arm in humans; normal ventricular volumes across the full known
      cohort would establish the mouse hydrocephalus phenotype as species-specific.

- discussion_id: mns1_phenotype_expansion_uncertainty
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Randomization of Left-Right Axis Specification
  prompt: >-
    Are the non-ciliary features reported in individual MNS1 cases - severe myopia
    and oligodontia in one compound heterozygous woman, and a complex prenatal
    malformation syndrome in a sibling fetal pair - part of the MNS1 phenotype, or
    attributable to coincidental or second-locus variation?
  rationale: >-
    The report expanding the MNS1 phenotype describes features with no known
    connection to motile cilia. Critically, the two affected fetuses in that report
    carried homozygous GLDN variants in addition to their in-frame MNS1 deletion,
    so their malformation syndrome cannot be attributed to MNS1 without
    disentangling the two loci. Given that only a handful of individuals have ever
    been reported, single additional features carry disproportionate weight in
    shaping the perceived phenotype, and this entry deliberately does not curate
    them as MNS1 phenotypes.
  status: OPEN
  evidence:
  - reference: PMID:39233552
    reference_title: Expanding MNS1 Heterotaxy Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second and third patients were sibling fetuses with homozygous in-frame
      deletion variants in MNS1 and homozygous missense variants in GLDN.
    explanation: >-
      Documents the second-locus variant that confounds attribution of the fetal
      malformation syndrome to MNS1.
  - reference: PMID:39233552
    reference_title: Expanding MNS1 Heterotaxy Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient was a female presenting complete situs inversus and unusual
      symptoms, including severe myopia and dental agenesis of 10 permanent teeth.
    explanation: >-
      The authors themselves describe these features as unusual, marking them as
      unresolved rather than established components of the phenotype.

notes: >-
  Scope: this is a standalone Disease entry rather than a subtype of the existing
  Visceral_Heterotaxy entry (MONDO:0018677), which models heterotaxy as a
  genetically heterogeneous clinical class and carries no subtypes. HTX9 has its
  own MONDO term, its own OMIM phenotype number (618948), a single defined causal
  gene, and a phenotype - male infertility from flagellar assembly failure - that
  is not part of the umbrella entity at all. MONDO records HTX9 as is_a visceral
  heterotaxy, which the parents list reflects.

  No GeneReviews chapter exists for MNS1-related disease or for heterotaxy as of
  this curation, so the GeneReviews phenotype baseline step was not applicable.

  Named Entity Confusion preflight: MONDO:0030070 carries no textual definition, so
  identity was anchored on OMIM:618948 and on the MONDO RO:0004003 causal-gene
  relationship to HGNC:29636 (MNS1). All curated content is drawn from
  MNS1-specific primary literature. Content about other numbered heterotaxy loci
  (HTX1/ZIC3, HTX2/CFC1, HTX4/ACVR2B, HTX5/NODAL, HTX6/CFAP52) was deliberately
  excluded.

  A Falcon deep-research report was generated for this entry and then DISCARDED
  after `just preflight-dr ... MONDO:0030070` returned FAIL: the report never
  mentioned MNS1 and discussed MMP21 62 times, i.e. it had resolved "Visceral
  Heterotaxy 9" to MMP21-related heterotaxy 7 (MONDO:0014762, OMIM:616749). This
  is the canonical Named Entity Confusion failure mode for the numbered HTX
  series - the report was internally coherent, its citations resolved, and its
  quotes would have validated as exact substrings, so only the semantic gene check
  caught it. Per CLAUDE.md the report was discarded whole rather than
  cherry-picked, and is deliberately not committed under research/ so that a later
  curator cannot pick it up under its misleading filename. This entry is built
  entirely from PubMed-sourced MNS1 primary literature and the ClinGen structured
  record.

  A SECOND deep-research report was generated in a later session and, unlike the
  first, was kept: research/Visceral_Heterotaxy_9-deep-research-openscientist.md.
  Read its frontmatter before using it. Falcon was requested and returned HTTP 403,
  so the run fell back to OpenScientist and the report records fell_back: true,
  requested_provider: falcon and the full provider_attempts chain. Note the report
  is named for OpenScientist, which actually wrote it, not for the falcon that was
  requested - so this file is NOT the discarded MMP21 report described above, and
  no falcon report for this disease should exist on disk. It PASSES the Named
  Entity Confusion preflight that the first
  report failed (MNS1 mentioned 58 times and the top gene by frequency, against
  MNS1=0 and MMP21=62 in the discarded one), and reference validation resolved
  18/18 citations with none off topic. Two of its suggested ontology bindings are
  wrong and must not be used: it offers HP:0011885 for "Abnormal visceral situs"
  when that identifier is Hemorrhage of the eye, and UBERON:0004341 for the
  left-right organiser when that identifier is primitive streak. Neither is bound
  anywhere in this entry.

  The material added in that later session did not come from the report, which
  corroborated existing content rather than extending it. The CFAP53 paralogue
  redundancy hypothesis, the MFN2 interaction evidence and the gestational-alcohol
  gene-environment entry all come from PubMed searches of the MNS1 literature made
  independently of it; the report does not mention CFAP53 at all. Its two genuinely
  novel contributions - gnomAD v4 constraint metrics and UniProt/Pfam domain
  architecture - were deliberately NOT curated, because neither has a citable
  reference whose abstract contains the numbers, and manufacturing a snippet for
  them is precisely the failure mode the evidence SOP forbids.

- name: Sperm Flagellar Axoneme Assembly Failure
  biological_scale: CELLULAR
  role: intermediate
  description: >-
    MNS1 is an integral, detergent-resistant component of the sperm flagellum. In
    its absence the flagellar axoneme is not correctly assembled: the 9+2
    microtubule arrangement and the surrounding outer dense fibres are disrupted,
    and outer doublet microtubules show ultrastructural disturbance in human
    patients. Because MNS1 loss acts during spermiogenesis - the post-meiotic
    morphogenesis of the round spermatid into a spermatozoon - both the number and
    the structure of the resulting gametes are affected.
  cell_types:
  - preferred_term: sperm
    term:
      id: CL:0000019
      label: sperm
  biological_processes:
  - preferred_term: sperm axoneme assembly
    term:
      id: GO:0007288
      label: sperm axoneme assembly
    modifier: DECREASED
  - preferred_term: spermatid development
    term:
      id: GO:0007286
      label: spermatid development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal flagellum morphology and ultrastructural disturbances in outer
      doublet microtubules were observed in the proband's sperm.
    explanation: >-
      Human ultrastructural evidence that MNS1 loss disrupts flagellar axoneme
      architecture.
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our study, MNS1 defect was associated with missing peripheral DMTs (2–4
      out of 9) and absent ODAs in humans
    explanation: >-
      Ties the sperm flagellar defect specifically to loss of outer dynein arms,
      which is the same lesion the upstream Outer Dynein Arm Docking Defect node
      describes. This is what makes the axoneme node a continuation of the ODA
      docking defect in sperm rather than an independent spermatogenic failure.
  - reference: PMID:22396656
    reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We find that MNS1 is expressed in the germ cells in the testes and localizes
      to sperm flagella in a detergent-resistant manner, indicating that it is an
      integral component of flagella.
    explanation: >-
      Establishes MNS1 as a structural component of the flagellum rather than a
      transient assembly factor.
  - reference: PMID:22396656
    reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results demonstrate that MNS1 is essential for spermiogenesis, the
      assembly of sperm flagella, and motile ciliary functions.
    explanation: >-
      Summary statement of the mouse loss-of-function phenotype underpinning this
      node.
  downstream:
  - target: Oligoasthenoteratozoospermia and Male Infertility
    description: >-
      Failure of flagellar assembly during spermiogenesis yields few, malformed and
      immotile spermatozoa.
    evidence:
    - reference: PMID:22396656
      reference_title: MNS1 is essential for spermiogenesis and motile ciliary functions in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MNS1-deficient males are sterile, as they exhibit a sharp reduction in
        sperm production and the remnant sperm are immotile with abnormal short
        tails.
      explanation: >-
        Directly connects flagellar assembly failure to reduced sperm number,
        abnormal morphology, immotility and sterility.

- name: Randomization of Left-Right Axis Specification
  biological_scale: ORGANISM
  role: consequence
  description: >-
    With nodal flow absent, left-right identity is assigned stochastically rather
    than deterministically. Some affected individuals develop normal situs solitus,
    some develop mirror-image situs inversus totalis, and a further fraction fails
    to establish a coherent axis at all and develops true heterotaxy (situs
    ambiguus) with discordant thoracic and abdominal arrangement and complex
    congenital heart disease. This randomisation - as opposed to consistent
    reversal - is the signature of a nodal-cilium laterality defect and explains the
    intrafamilial variability seen in MNS1 pedigrees.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotyping of multiple family members identified randomisation of the
      laterality defects in other homozygous individuals, with all wild type or
      MNS1 c.407_410del heterozygous carriers being unaffected, consistent with an
      autosomal recessive mode of inheritance.
    explanation: >-
      Documents randomisation, rather than uniform inversion, of laterality among
      homozygotes in a single extended pedigree.
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A broad spectrum of laterality defects including situs inversus totalis and
      heterotaxia was confirmed.
    explanation: >-
      Confirms that the laterality outcome spans complete mirror-imaging through to
      true heterotaxy.
  downstream:
  - target: Laterality defect
    description: >-
      Abnormal left-right arrangement of the thoraco-abdominal organs is the direct
      clinical expression of a randomised left-right axis.
    evidence:
    - reference: PMID:38920647
      reference_title: >-
        Biallelic Variants in MNS1 Are Associated with Laterality Defects and
        Respiratory Involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A broad spectrum of laterality defects including situs inversus totalis and
        heterotaxia was confirmed.
      explanation: >-
        The clinical laterality spectrum observed in MNS1-deficient individuals.
  - target: Situs inversus totalis
    description: >-
      Complete mirror-image reversal is the outcome when a coherent but inverted
      axis is established.
    evidence:
    - reference: PMID:31534215
      reference_title: MNS1 variant associated with situs inversus and male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IX-5 died from meningitis aged 5 months and was discovered to have
        heterotaxy, subsequently a diagnosis of SI was made in IX-2, IX-1, VIII-15
        and VII-9.
      explanation: >-
        Names the situs inversus outcome directly: four homozygotes in this pedigree
        received an SI diagnosis while a fifth had heterotaxy, so situs inversus is
        one stochastic outcome of the randomised axis rather than the uniform result
        of a directed reversal.
  - target: Complex congenital heart disease
    description: >-
      When no coherent axis is established, cardiac segments are discordantly
      arranged and complex structural heart disease results.
    evidence:
    - reference: PMID:38920647
      reference_title: >-
        Biallelic Variants in MNS1 Are Associated with Laterality Defects and
        Respiratory Involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All four affected individuals presented with laterality defects, including

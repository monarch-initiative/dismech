classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal recessive Mendelian motile ciliopathy; diagnosis is molecular and
      the published cohort is drawn almost entirely from consanguineous pedigrees.
    evidence:
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified two recessive loss-of-function MNS1 mutations in five
        individuals from four consanguineous families
      explanation: >-
        A recessive single-gene disorder delineated in consanguineous pedigrees,
        which is what places it in the genetics chapter.
  - classification_value: CARDIOVASCULAR
    notes: >-
      The clinically dominant manifestation is a laterality defect, and complex
      congenital heart disease is the principal source of morbidity in affected
      individuals with true heterotaxy.
    evidence:
    - reference: PMID:38920647
      reference_title: >-
        Biallelic Variants in MNS1 Are Associated with Laterality Defects and
        Respiratory Involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All four affected individuals presented with laterality defects, including
        one male individual with heterotaxia and complex congenital heart defects.
      explanation: >-
        Complex congenital heart disease in the heterotaxy subset is the
        cardiovascular burden that motivates this chapter assignment.
  mechanistic_category:
  - classification_value: ciliopathy
    notes: >-
      Disease mechanism is dysfunction of motile cilia and flagella (nodal
      monocilia, respiratory cilia, sperm flagella) rather than primary-cilium
      signalling.
    evidence:
    - reference: PMID:38920647
      reference_title: >-
        Biallelic Variants in MNS1 Are Associated with Laterality Defects and
        Respiratory Involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This study represents the first observation of heterotaxia and respiratory
        disease in individuals with biallelic MNS1 variants, an important extension
        of the phenotype associated with MNS1-related motile ciliopathy disorder.
      explanation: >-
        Names MNS1-related disease a motile ciliopathy, the mechanistic category
        assigned here.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported affected individuals carry biallelic MNS1 loss-of-function
    alleles - homozygous nonsense or frameshift variants in consanguineous and
    founder pedigrees, and compound heterozygous variants in outbred families.
    Heterozygous carriers are unaffected. Because left-right axis specification is
    randomised rather than reversed, sibships homozygous for the same allele
    segregate a mixture of situs solitus, situs inversus totalis and heterotaxy,
    so laterality status is not a reliable indicator of genotype within a family.
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two recessive loss-of-function MNS1 mutations in five
      individuals from four consanguineous families
    explanation: >-
      Establishes the recessive mode of inheritance in the index cohort of four
      consanguineous families.
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotyping of multiple family members identified randomisation of the
      laterality defects in other homozygous individuals, with all wild type or
      MNS1 c.407_410del heterozygous carriers being unaffected, consistent with an
      autosomal recessive mode of inheritance.
    explanation: >-
      Segregation in an extended Amish pedigree confirms autosomal recessive
      inheritance with unaffected heterozygous carriers, and documents that
      laterality is randomised rather than uniformly inverted among homozygotes.

genetic:
- name: MNS1
  gene_term:
    preferred_term: MNS1
    term:
      id: hgnc:29636
      label: MNS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    MNS1 (15q21.3) encodes meiosis-specific nuclear structural protein 1, a
    coiled-coil protein that is a detergent-resistant integral component of the
    motile axoneme. MNS1 self-associates into dimers and higher-order polymers and
    binds CCDC114, a subunit of the outer dynein arm docking complex, giving it a
    structural role in tethering outer dynein arms to the outer doublet
    microtubules. It is expressed in testicular germ cells, in respiratory
    epithelium, and - in mouse - in the embryonic ventral node. Reported pathogenic
    alleles are uniformly loss-of-function: homozygous nonsense (p.Arg242*,
    p.Gln203*), homozygous frameshift (the c.407_410del Amish founder allele;
    c.603_604insG), an in-frame deletion, and compound heterozygous
    frameshift/nonsense combinations.
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we demonstrate that MNS1 deficiency in humans causes laterality defects
      (situs inversus) and likely male infertility and that MNS1 plays a role in
      the ODA-DC assembly
    explanation: >-
      Names MNS1 as the causal gene for this disease and states its molecular role
      in outer dynein arm docking complex assembly.
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      co-immunoprecipitation and yeast two hybrid analyses demonstrated that MNS1
      dimerizes and interacts with the ODA docking complex component CCDC114
    explanation: >-
      Biochemical interaction data establishing the molecular function of the MNS1
      protein product.
  - reference: PMID:39233552
    reference_title: Expanding MNS1 Heterotaxy Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MNS1 (meiosis-specific nuclear structural protein-1 gene) encodes a
      structural protein implicated in motile ciliary function and sperm flagella
      assembly.
    explanation: >-
      Independent statement of the gene product's function in motile cilia and
      sperm flagella.
  - reference: CGGV:assertion_255ba802-ece2-43c7-9089-6e54672b4f4a-2022-09-13T170000.000Z
    reference_title: MNS1 / primary ciliary dyskinesia (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MNS1 | HGNC:29636 | primary ciliary dyskinesia | MONDO:0016575 | AR |
      Disputed
    explanation: >-
      ClinGen's Motile Ciliopathy Gene Curation Expert Panel disputes MNS1 as a
      cause of primary ciliary dyskinesia. This is recorded as PARTIAL because it
      constrains rather than refutes the gene-disease claim curated here: the
      disputed assertion is against the PCD entity (MONDO:0016575), not against
      HTX9 (MONDO:0030070), and reflects the characteristic absence of
      otosinopulmonary disease in MNS1 deficiency.
  variants:
  - name: MNS1 p.Arg242*
    description: >-
      Homozygous nonsense variant identified in four males with laterality defects
      and infertility from consanguineous families; the index allele for HTX9.
    evidence:
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a homozygous nonsense mutation p.Arg242* in four males with laterality
        defects and infertility
      explanation: >-
        Directly reports the variant, its zygosity, and the associated phenotype.
  - name: MNS1 c.407_410del p.(Glu136Glyfs*16)
    description: >-
      Homozygous founder frameshift allele segregating in an extended Amish
      pedigree with situs inversus and male infertility.
    evidence:
    - reference: PMID:31534215
      reference_title: MNS1 variant associated with situs inversus and male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we investigated the genetic cause of a form of situs inversus (SI) and male
        infertility present in multiple individuals in an extended Amish family
      explanation: >-
        Establishes the pedigree and phenotype in which this founder frameshift
        allele was identified.
  - name: MNS1 c.603_604insG p.Lys202Glufs*6
    description: >-
      Homozygous frameshift variant identified in a Han Chinese proband with severe
      oligoasthenoteratozoospermia, the fertility-only presentation of MNS1
      deficiency.
    evidence:
    - reference: PMID:33037173
      reference_title: >-
        A novel homozygous frameshift mutation in MNS1 associated with severe
        oligoasthenoteratozoospermia in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified a novel homozygous frameshift mutation in meiosis-specific
        nuclear structural 1 (MNS1; NM_018365: c.603_604insG: p.Lys202Glufs*6) by
        whole-exome sequencing in an OAT proband from a consanguineous Chinese
        family
      explanation: >-
        Reports the variant and the isolated infertility phenotype in which it was
        ascertained.

pathophysiology:
- name: Biallelic MNS1 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Homozygous or compound heterozygous nonsense, frameshift and in-frame deletion
    alleles in MNS1 abolish production of functional MNS1 protein. Immunofluorescence
    in affected individuals shows loss of MNS1 from the axonemes and flagella where
    the wild-type protein normally resides, confirming that the reported alleles
    behave as true nulls at the protein level rather than as hypomorphs of uncertain
    consequence.
  genes:
  - preferred_term: MNS1
    term:
      id: hgnc:29636
      label: MNS1
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunofluorescence analysis further revealed that MNS1 localizes to the
      axonemes of respiratory cilia as well as sperm flagella in human.
    explanation: >-
      Establishes where wild-type MNS1 protein resides in human tissue, the
      baseline against which its loss in patients is scored.
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunostaining analysis showed MNS1 to be normally located in the whole-sperm
      flagella, but was absent in the proband's sperm.
    explanation: >-
      Demonstrates at the protein level that a frameshift allele results in absent
      MNS1 from the flagellum.
  downstream:
  - target: Outer Dynein Arm Docking Defect in the Motile Axoneme
    description: >-
      Absence of the MNS1 protein removes a structural component required for
      normal assembly and docking of outer dynein arms on the axonemal outer
      doublet microtubules.
    evidence:
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we demonstrate that MNS1 deficiency in humans causes laterality defects
        (situs inversus) and likely male infertility and that MNS1 plays a role in
        the ODA-DC assembly
      explanation: >-
        Directly links MNS1 deficiency to a defect in outer dynein arm docking
        complex assembly.

- name: Outer Dynein Arm Docking Defect in the Motile Axoneme
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    MNS1 dimerises and binds CCDC114, a component of the outer dynein arm docking
    complex (ODA-DC). Without MNS1, outer dynein arms are incompletely docked onto
    the outer doublet microtubules. Crucially, the resulting ultrastructural lesion
    is subtle - a partial rather than complete loss of outer dynein arms, most
    pronounced in the distal axoneme - which distinguishes MNS1 deficiency from the
    complete ODA loss seen with DNAH5 or DNAI1 defects and accounts for the mild
    airway phenotype relative to classic primary ciliary dyskinesia.
  biological_processes:
  - preferred_term: outer dynein arm assembly
    term:
      id: GO:0036158
      label: outer dynein arm assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: axoneme
    term:
      id: GO:0005930
      label: axoneme
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In-depth ultrastructural analyses confirmed a subtle outer dynein arm (ODA)
      defect in the axonemes of respiratory epithelial cells resembling findings
      reported in Mns1-deficient mice.
    explanation: >-
      Documents the ultrastructural lesion in patient respiratory axonemes and
      explicitly characterises it as subtle.
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural analyses in the female carrying combined mutations in MNS1
      and DNAH5 indicated a role for MNS1 in the process of ODA docking (ODA-DC) in
      the distal respiratory axonemes.
    explanation: >-
      Localises the MNS1-dependent docking defect to the distal respiratory
      axoneme.
  - reference: PMID:39007638
    reference_title: >-
      Localisation and function of key axonemal microtubule inner proteins and
      dynein docking complex members reveal extensive diversity among vertebrate
      motile cilia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MNS1 can associate with itself and CFAP53
    explanation: >-
      Direct biochemical support for the self-association step this node's
      mechanism depends on. The source shows self-association only; it does not
      resolve the stoichiometry or its ordering relative to docking, so neither is
      claimed here. Graded IN_VITRO because the claim rests on an
      immunoprecipitation binding assay, matching how this entry already grades
      the co-IP/yeast-two-hybrid demonstration of the MNS1-CCDC114 interaction.
  - reference: PMID:39007638
    reference_title: >-
      Localisation and function of key axonemal microtubule inner proteins and
      dynein docking complex members reveal extensive diversity among vertebrate
      motile cilia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      combined loss of both proteins in zebrafish and mice caused severe outer
      dynein arm loss from (9+2) cilia
    explanation: >-
      Places MNS1 in the machinery that holds outer dynein arms on the (9+2)
      doublet, by a route independent of its CCDC114 interaction. INDIRECT, and
      deliberately not offered as a measurement of this node's lesion: the severe
      arm loss quoted here is the MNS1/CFAP53 DOUBLE mutant phenotype, whereas the
      lesion this node describes is the partial, distally weighted defect of MNS1
      loss alone. The gap between the two is itself the subject of the
      cfap53_paralogue_redundancy_airway_sparing hypothesis.
  notes: >-
    The individual in whom the distal ODA-docking phenotype was characterised also
    carried homozygous DNAH5 mutations, so the MNS1-specific contribution to that
    particular ultrastructural readout is partially confounded. See the
    mns1_pcd_boundary KNOWLEDGE_GAP discussion.
  downstream:
  - target: Nodal Cilia Motility Failure at the Left-Right Organizer
    description: >-
      The motile monocilia of the embryonic left-right organiser depend on outer
      dynein arm-driven beating to generate leftward nodal flow.
    evidence:
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Consistent with the laterality defects observed in these individuals, we
        found Mns1 to be expressed in mouse embryonic ventral node.
      explanation: >-
        Places MNS1 expression at the left-right organiser, the anatomical link
        between the axonemal defect and the laterality phenotype.
  - target: Sperm Flagellar Axoneme Assembly Failure
    description: >-
      The sperm flagellum is built on the same 9+2 axonemal template and requires
      MNS1 as an integral structural component.
    evidence:
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunofluorescence analysis further revealed that MNS1 localizes to the
        axonemes of respiratory cilia as well as sperm flagella in human.
      explanation: >-
        Establishes MNS1 as a component of the human sperm flagellar axoneme,
        licensing the causal edge to flagellar assembly failure.
  - target: Respiratory Ciliary Dysfunction
    description: >-
      Partial outer dynein arm loss in airway multiciliated cells impairs
      mucociliary clearance in a subset of affected individuals.
    evidence:
    - reference: PMID:38920647
      reference_title: >-
        Biallelic Variants in MNS1 Are Associated with Laterality Defects and
        Respiratory Involvement.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Accordingly, immunofluorescence analysis showed the absence of MNS1 from
        the respiratory epithelial cells of this individual.
      explanation: >-
        Ties the respiratory phenotype in an affected child to demonstrated loss of
        MNS1 from her own airway epithelium.
    hypothesis_groups:
    - cfap53_paralogue_redundancy_airway_sparing
  - target: Partial absence of outer dynein arms in respiratory cilia
    description: >-
      The docking defect is what transmission electron microscopy of patient
      respiratory cilia visualises as partial outer dynein arm loss.
    evidence:
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In-depth ultrastructural analyses confirmed a subtle outer dynein arm (ODA)
        defect in the axonemes of respiratory epithelial cells resembling findings
        reported in Mns1-deficient mice.
      explanation: >-
        The ultrastructural readout of the docking defect in patient material.

- name: Nodal Cilia Motility Failure at the Left-Right Organizer
  biological_scale: CELLULAR
  role: intermediate
  conforms_to: "ciliopathy_dysfunction#Motile Cilia Beat Dysfunction"
  description: >-
    During gastrulation, motile monocilia at the ventral node beat to drive a
    leftward extraembryonic fluid flow that is the earliest known symmetry-breaking
    event in the vertebrate embryo. MNS1 is expressed in the mouse ventral node,
    and MNS1 deficiency compromises the outer dynein arm machinery that powers this
    beat, so nodal flow fails to be established robustly.
  cell_types:
  - preferred_term: ciliated epithelial cell
    term:
      id: CL:0000067
      label: ciliated epithelial cell
  biological_processes:
  - preferred_term: cilium movement
    term:
      id: GO:0003341
      label: cilium movement
    modifier: DECREASED
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with the laterality defects observed in these individuals, we
      found Mns1 to be expressed in mouse embryonic ventral node.
    explanation: >-
      Expression at the left-right organiser is the evidence that MNS1 acts at this
      node of the mechanism.
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study identifies an MNS1 variant as a cause of laterality defects and
      male infertility in humans, mirroring findings in Mns1-deficient mice which
      also display male infertility and randomisation of left-right asymmetry of
      internal organs, confirming a crucial role for MNS1 in nodal cilia and sperm
      flagella formation and function.
    explanation: >-
      Explicitly assigns MNS1 a crucial role in nodal cilia formation and function,
      the conformance claim of this node.
  downstream:
  - target: Randomization of Left-Right Axis Specification
    description: >-
      Absent or insufficient nodal flow leaves the left-right axis unspecified, so
      situs is determined stochastically in each embryo.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31534215
      reference_title: >-
        MNS1 variant associated with situs inversus and male infertility.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "our results suggest that loss of MNS1 function may be sufficient to disrupt nodal flow, thus randomising the development of left–right asymmetry and causing situs abnormalities"
      explanation: >-
        Addresses this edge rather than either node: loss of MNS1 disrupts nodal
        flow, and that disruption is what randomises left-right asymmetry. INDIRECT
        because the sentence is the authors' synthesis, doubly hedged ("suggest ...
        may be") and reached by combining their human cohort with mouse ventral-node
        expression; nodal flow itself was never measured in these patients.
    - reference: PMID:30148830
      reference_title: >-
        Homozygous loss-of-function mutations in MNS1 cause laterality defects and
        likely male infertility.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Because approximately half of the mutant mouse offspring (39%) exhibited laterality defects at birth, we assume that the genetic defect causes randomization of left/right body asymmetry, as observed in other mouse models with abnormal nodal ciliary motility function"
      explanation: >-
        Supplies the signature of randomisation rather than reversal - roughly half
        the null offspring are affected, which is what a stochastic left-right
        decision predicts and a directed one does not.

- name: Respiratory Ciliary Dysfunction
  biological_scale: CELLULAR
  role: intermediate
  conforms_to: "ciliopathy_dysfunction#Motile Cilia Beat Dysfunction"
  description: >-
    MNS1 is present in the axonemes of human respiratory cilia, and affected
    individuals show its absence from airway epithelium together with a partial
    outer dynein arm defect. Unlike classic primary ciliary dyskinesia, however,
    the airway consequence is variable and frequently absent: most reported
    individuals have no significant otosinopulmonary disease, and the airway arm of
    the module is only partially manifested. Where it does occur it presents as
    neonatal respiratory distress, recurrent respiratory tract infection, chronic
    rhinitis and wet cough rather than established bronchiectasis.
  cell_types:
  - preferred_term: multiciliated airway epithelial cell
    term:
      id: CL:0002145
      label: multiciliated columnar cell of tracheobronchial tree
  locations:
  - preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  biological_processes:
  - preferred_term: epithelial cilium movement involved in extracellular fluid movement
    term:
      id: GO:0003351
      label: epithelial cilium movement involved in extracellular fluid movement
    modifier: DECREASED
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study represents the first observation of heterotaxia and respiratory
      disease in individuals with biallelic MNS1 variants, an important extension
      of the phenotype associated with MNS1-related motile ciliopathy disorder.
    explanation: >-
      Establishes that respiratory disease is part of the MNS1 phenotype, while its
      framing as a novel extension records that it is not the usual presentation.
  - reference: PMID:38920647

mechanistic_hypotheses:
- hypothesis_group_id: cfap53_paralogue_redundancy_airway_sparing
  hypothesis_label: >-
    CFAP53 paralogue redundancy buffers (9+2) airway cilia against MNS1 loss
  status: EMERGING
  description: >-
    A candidate explanation for the tissue-selective phenotype of MNS1 deficiency:
    why laterality and sperm flagella fail while the airway is largely spared. MNS1
    and CFAP53 are paralogous filamentous microtubule inner proteins (fMIPs) of the
    motile axoneme. In (9+2) cilia - the multiciliated airway cell type - the two
    proteins act redundantly, so losing MNS1 alone leaves outer dynein arms largely
    docked and mucociliary clearance largely intact; only combined loss strips
    outer dynein arms and significantly impairs motility. The monocilia of the
    embryonic
    left-right organiser, by contrast, are (9+0), the axoneme type in which CFAP53
    is itself essential rather than redundant. Note what this does and does not
    establish: CFAP53 being required in (9+0) cilia is not the same claim as CFAP53
    being unable to cover for absent MNS1 there, and no published work reports
    whether MNS1 is non-redundantly required in (9+0) cilia. The asymmetry between
    the two axoneme types is therefore a motivation for this model, not a
    derivation of it. On
    this model the mild or absent airway disease reported in MNS1 deficiency is a
    predictable consequence of paralogue redundancy rather than evidence that MNS1
    is dispensable for airway ciliary function. ClinGen's Motile Ciliopathy Gene
    Curation Expert Panel separately classifies the MNS1-primary ciliary dyskinesia
    relationship as Disputed; that classification grades the strength and
    consistency of the gene-disease evidence and is not a measurement of phenotype
    severity, so it is cited here as a fact this model would have to be compatible
    with, not as its rationale.
  notes: >-
    Marked EMERGING rather than CANONICAL deliberately. The redundancy itself is
    demonstrated, but in zebrafish and mouse rather than in human airway epithelium,
    and no study has yet tested CFAP53 dosage as a modifier of the respiratory
    phenotype in an MNS1-deficient person. It is offered as the most specific
    available mechanistic account of the airway sparing, not as an established one.
    The competing account already carried on the Outer Dynein Arm Docking Defect node
    - that the docking lesion is simply subtle and distally restricted - is not
    displaced by this hypothesis and the two are not mutually exclusive.

    The hypothesis also has a specific unresolved problem, which is worth stating
    rather than smoothing over: the sperm flagellum is itself a (9+2) axoneme, so
    paralogue redundancy as described would predict that it too is buffered, yet
    flagellar assembly failure is the most penetrant consequence of MNS1 loss in
    humans. Something must break the symmetry - CFAP53 abundance during
    spermiogenesis, the far greater structural demand on the flagellum, or an
    MNS1-specific interaction such as the MFN2 association reported in sperm - but
    no published work settles which, and none of those candidates is asserted here.
    Resolving that is the obvious next test of this model.

    A second and arguably cleaner counterexample is already curated in this entry
    and should be read alongside the hypothesis rather than after it. Mns1 SINGLE
    nulls - no CFAP53 lesion - lose outer dynein arms from tracheal cilia and
    develop hydrocephalus (PMID:22396656, carried on the Mns1 knockout mouse and in
    the mns1_hydrocephalus_model_mismatch discussion). Tracheal and ependymal cilia
    are both (9+2), so on a strict reading of paralogue redundancy neither should
    fail, and both do. Either the buffering is partial rather than absolute, or it
    is tissue-restricted in a way the zebrafish and mouse work has not mapped. The
    honest position is that this model accounts for the mildness of the HUMAN airway
    phenotype relative to classic primary ciliary dyskinesia, and does not account
    for the mouse (9+2) phenotypes at all.
  evidence:
  - reference: PMID:39007638
    reference_title: >-
      Localisation and function of key axonemal microtubule inner proteins and
      dynein docking complex members reveal extensive diversity among vertebrate
      motile cilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in (9+2) cilia, CFAP53 functions redundantly with a paralogous fMIP, MNS1
    explanation: >-
      States the redundancy this hypothesis rests on, and restricts it to the (9+2)
      axoneme type that the airway uses.
  - reference: PMID:39007638
    reference_title: >-
      Localisation and function of key axonemal microtubule inner proteins and
      dynein docking complex members reveal extensive diversity among vertebrate
      motile cilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      combined loss of both proteins in zebrafish and mice caused severe outer
      dynein arm loss from (9+2) cilia
    explanation: >-
      Supplies the counterfactual the hypothesis needs: the (9+2) outer dynein arm
      phenotype appears only when the paralogue is removed as well, which is what
      makes single MNS1 loss survivable in the airway.
  - reference: PMID:39007638
    reference_title: >-
      Localisation and function of key axonemal microtubule inner proteins and
      dynein docking complex members reveal extensive diversity among vertebrate
      motile cilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      is essential for motility of (9+0), but not (9+2) cilia
    explanation: >-
      The axoneme-type asymmetry the model is built on, stated by the source rather
      than inferred: CFAP53 is required in (9+0) cilia and dispensable in (9+2).
  - reference: CGGV:assertion_255ba802-ece2-43c7-9089-6e54672b4f4a-2022-09-13T170000.000Z
    reference_title: MNS1 / primary ciliary dyskinesia (Disputed)
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "MNS1 | HGNC:29636 | primary ciliary dyskinesia | MONDO:0016575 | AR | Disputed"
    explanation: >-
      The expert-panel classification this hypothesis sets out to explain. It is
      cited as the observation being accounted for, not as support for the
      redundancy mechanism itself, hence INDIRECT.

phenotypes:
- category: Developmental
  name: Laterality defect
  description: >-

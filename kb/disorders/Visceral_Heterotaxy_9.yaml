- name: Sperm Flagellar Axoneme Assembly Failure
  biological_scale: CELLULAR
  role: intermediate
  description: >-
    MNS1 is an integral, detergent-resistant component of the sperm flagellum. In
    its absence the flagellar axoneme is not correctly assembled: the 9+2
    microtubule arrangement and the surrounding outer dense fibres are disrupted,
    and outer doublet microtubules show ultrastructural disturbance in human
    patients. Because MNS1 loss acts during spermiogenesis - the post-meiotic
    morphogenesis of the round spermatid into a spermatozoon - both the number and
    the structure of the resulting gametes are affected.
  cell_types:
  - preferred_term: sperm
    term:
      id: CL:0000019
      label: sperm
  biological_processes:
  - preferred_term: sperm axoneme assembly
    term:
      id: GO:0007288
      label: sperm axoneme assembly
    modifier: DECREASED
  - preferred_term: spermatid development
    term:
      id: GO:0007286
      label: spermatid development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal flagellum morphology and ultrastructural disturbances in outer
      doublet microtubules were observed in the proband's sperm.
    explanation: >-
      Human ultrastructural evidence that MNS1 loss disrupts flagellar axoneme
      architecture.
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our study, MNS1 defect was associated with missing peripheral DMTs (2–4
      out of 9) and absent ODAs in humans
    explanation: >-
      Ties the sperm flagellar defect specifically to loss of outer dynein arms,
      which is the same lesion the upstream Outer Dynein Arm Docking Defect node
      describes. This is what makes the axoneme node a continuation of the ODA
      docking defect in sperm rather than an independent spermatogenic failure.
  - reference: PMID:24876927
    reference_title: >-
      Mitochondrial fusion protein MFN2 interacts with the mitostatin-related
      protein MNS1 required for mouse sperm flagellar structure and function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MFN2 and MNS1 were present in detergent-resistant flagellar structures of

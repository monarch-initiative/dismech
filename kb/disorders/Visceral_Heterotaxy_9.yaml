name: Visceral Heterotaxy 9
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: heterotaxy, visceral, 9, autosomal, with male infertility
  term:
    id: MONDO:0030070
    label: heterotaxy, visceral, 9, autosomal, with male infertility
synonyms:
- HTX9
- heterotaxy, visceral, 9, autosomal, with male infertility
- MNS1-related motile ciliopathy
- MNS1-related laterality defect with male infertility
description: >-
  Visceral heterotaxy 9 (HTX9) is an ultra-rare autosomal recessive motile
  ciliopathy caused by biallelic loss-of-function variants in MNS1
  (meiosis-specific nuclear structural protein 1). MNS1 is an integral
  coiled-coil component of the motile axoneme that dimerises and binds the outer
  dynein arm docking complex subunit CCDC114; its loss produces a subtle outer
  dynein arm and ODA-docking defect rather than the gross axonemal disorganisation
  of classic primary ciliary dyskinesia. Because the same axonemal machinery
  powers the motile monocilia of the embryonic left-right organiser and the sperm
  flagellum, MNS1 deficiency produces a characteristic two-part phenotype:
  randomisation of left-right body asymmetry (situs inversus totalis or true
  heterotaxy, with complex congenital heart disease in a subset) and male
  infertility from oligoasthenoteratozoospermia with structurally abnormal,
  short, immotile flagella. Airway disease - the dominant feature of most motile
  ciliopathies - is characteristically mild or absent, which is why ClinGen's
  Motile Ciliopathy Gene Curation Expert Panel classifies the MNS1-primary
  ciliary dyskinesia relationship as Disputed; a respiratory phenotype (neonatal
  respiratory distress, recurrent infection, chronic rhinitis, wet cough) has
  nonetheless now been documented in a minority of individuals. Fewer than twenty
  affected individuals have been reported worldwide, almost all from consanguineous
  or founder pedigrees.
parents:
- Visceral heterotaxy
- Motile ciliopathy
- Congenital Disorder

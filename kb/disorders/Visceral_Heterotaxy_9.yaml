phenotypes:
- category: Developmental
  name: Laterality defect
  description: >-
    The defining clinical feature. Affected individuals present with abnormal
    left-right arrangement of the thoraco-abdominal organs, ranging from complete
    mirror-image situs inversus totalis to true heterotaxy with discordant organ
    arrangement.
  phenotype_term:
    preferred_term: Heterotaxy
    term:
      id: HP:0030853
      label: Heterotaxy
  frequency: FREQUENT
  evidence:
  - reference: PMID:38920647
    reference_title: >-
      Biallelic Variants in MNS1 Are Associated with Laterality Defects and
      Respiratory Involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A broad spectrum of laterality defects including situs inversus totalis and
      heterotaxia was confirmed.
    explanation: >-
      Confirms laterality defects, including frank heterotaxy, across the reported
      cohort.
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous nonsense mutation p.Arg242* in four males with laterality
      defects and infertility
    explanation: >-
      Establishes the association: all five reported homozygotes across four
      consanguineous families had laterality defects. These individuals were
      ascertained through those defects, so the count fixes the disease-phenotype
      association but cannot estimate its frequency; the band is carried by the
      genotype-first pedigree count below.
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six individuals were found to be homozygous for the MNS1
      NM_018365.2:c.407_410del variant, of whom four (67%) exhibited SI and two
      (33%) exhibited situs solitus.
    explanation: >-
      The one genotype-first denominator available for this disorder: 26 members of
      the Amish pedigree were genotyped and clinically assessed, and four of the six
      homozygotes so identified (67%) had a laterality defect while two had normal
      situs. 67% sits in the frequent (30-79%) band. The two situs solitus
      homozygotes are what the randomisation mechanism predicts, and are why a very
      frequent (80-99%) band would contradict this entry's central claim.

- category: Developmental
  name: Situs inversus totalis
  description: >-
    Complete mirror-image reversal of thoracic and abdominal viscera, the most
    commonly reported laterality outcome in MNS1 deficiency and the presentation of
    the Amish founder pedigree.
  phenotype_term:
    preferred_term: Situs inversus totalis
    term:
      id: HP:0001696
      label: Situs inversus totalis
  evidence:
  - reference: PMID:31534215
    reference_title: MNS1 variant associated with situs inversus and male infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we investigated the genetic cause of a form of situs inversus (SI) and male
      infertility present in multiple individuals in an extended Amish family
    explanation: >-
      Situs inversus was the ascertaining phenotype in this pedigree.
  - reference: PMID:39233552
    reference_title: Expanding MNS1 Heterotaxy Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient was a female presenting complete situs inversus and unusual
      symptoms, including severe myopia and dental agenesis of 10 permanent teeth.
    explanation: >-
      Independent report of complete situs inversus in a compound heterozygous
      individual.

- category: Cardiovascular
  name: Complex congenital heart disease
  description: >-
    Where the laterality defect is true heterotaxy rather than complete inversion,
    the cardiac segments are discordantly arranged and complex structural heart
    disease results. This is the principal determinant of morbidity in affected
    individuals.
  phenotype_term:
    preferred_term: Complex congenital heart malformation
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:

      explanation: >-
        Directly links asplenia to right isomerism in an MNS1-deficient individual.

- name: Oligoasthenoteratozoospermia and Male Infertility
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Affected males have severe oligoasthenoteratozoospermia: reduced sperm counts,
    absent or near-absent progressive motility, and abnormal head and tail
    morphology. Infertility is the consistent reproductive outcome. In the one
    reported attempt, intracytoplasmic sperm injection did not rescue fertility,
    which is consistent with the defect being structural and gamete-intrinsic
    rather than purely motility-limited.
  evidence:
  - reference: PMID:33037173
    reference_title: >-
      A novel homozygous frameshift mutation in MNS1 associated with severe
      oligoasthenoteratozoospermia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The semen examination results of the proband were as follows: semen volume,
      3.4 ml; sperm concentration, 1.8 × 106 ml−1; and percentage progressive
      motility, 5.8%.
    explanation: >-
      The measured semen phenotype of the MNS1-deficient proband. All three
      components of the oligoasthenoteratozoospermia triad are quantified in the
      same individual and each falls below the WHO lower reference limit, which is
      what makes this node an observed outcome rather than a definitional label.
  - reference: PMID:30148830
    reference_title: >-
      Homozygous loss-of-function mutations in MNS1 cause laterality defects and
      likely male infertility.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous nonsense mutation p.Arg242* in four males with laterality
      defects and infertility
    explanation: >-
      Reports infertility in all four homozygous males in the index cohort.
      Recorded as PARTIAL because the same paper qualifies the association as
      likely male infertility, formal semen analysis not being available for every
      individual.
  downstream:
  - target: Male infertility
    description: >-
      The reproductive endpoint of the flagellar defect in affected males.
    evidence:
    - reference: PMID:31534215
      reference_title: MNS1 variant associated with situs inversus and male infertility.

    explanation: >-
      ClinGen's Peroxisomal Disorders Gene Curation Expert Panel classifies
      the PEX5 to peroxisome biogenesis disorder gene-disease relationship as
      Definitive with autosomal recessive inheritance. The assertion is
      recorded against the parent class peroxisome biogenesis disorder
      (MONDO:0019234), not against this subclass.
  - reference: PMID:9668159
    reference_title: "An isoform of pex5p, the human PTS1 receptor, is required for the import of PTS2 proteins into peroxisomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Mutations in the peroxisome targeting signal (PTS) 1 receptor gene,
      PEX5, are responsible for complementation group (CG) 2 of the peroxisome
      biogenesis disorders (PBD).
    explanation: >-
      Identifies PEX5 as the peroxisomal targeting signal type 1 receptor and
      as the gene of complementation group 2 of the peroxisome biogenesis
      disorders.
  - reference: PMID:9668159
    reference_title: "An isoform of pex5p, the human PTS1 receptor, is required for the import of PTS2 proteins into peroxisomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      cells from PBD005 (homozygous for the nonsense mutation R390ter) are
      defective in the import of both PTS1 and PTS2 proteins, suggesting that

- reference: PMID:21031596
  title: "Genetic classification and mutational spectrum of more than 600 patients with a Zellweger syndrome spectrum disorder."
  findings:
  - statement: >-
      Ebberink 2011 assigned over 600 Zellweger syndrome spectrum fibroblast
      cell lines to genetic complementation groups and reports twelve PEX
      genes for the spectrum, the count this entry's notes reconcile with the
      thirteen GeneReviews gives.
    evidence:
    - reference: PMID:21031596
      reference_title: "Genetic classification and mutational spectrum of more than 600 patients with a Zellweger syndrome spectrum disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The autosomal recessive Zellweger syndrome spectrum (ZSS) disorders
        comprise a main subgroup of the peroxisome biogenesis disorders and
        can be caused by mutations in any of 12 different currently identified
        PEX genes resulting in severe multisystemic disorders.
      explanation: >-
        States the twelve-PEX-gene count for the Zellweger syndrome spectrum
        that the notes reconcile against GeneReviews and MONDO.
    - reference: PMID:21031596
      reference_title: "Genetic classification and mutational spectrum of more than 600 patients with a Zellweger syndrome spectrum disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        We did not identify any novel genetic complementation group,
        suggesting that all PEX gene defects resulting in peroxisome
        deficiency are currently known.
      explanation: >-
        Supports the completeness claim behind that count: no further
        complementation group was found across more than 600 lines.

- name: Peroxisome Division Failure
  biological_scale: CELLULAR
  description: >-
    PEX11B elongates the peroxisomal membrane ahead of scission by the
    dynamin-like GTPase DLP1, so peroxisome number is set by division of
    pre-existing organelles rather than by assembly. Biallelic PEX11B loss
    therefore disables the proliferation and division step rather than the
    matrix import or membrane assembly steps that account for the rest of this
    spectrum, and the resulting disorder is peroxisome biogenesis disorder
    14B.

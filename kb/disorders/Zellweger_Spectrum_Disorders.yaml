- name: RING Ubiquitin Ligase Retrotranslocation Failure
  biological_scale: MOLECULAR
  description: >-
    PEX2, PEX10 and PEX12 are the three RING finger peroxins of a
    membrane-embedded ubiquitin ligase complex. The complex monoubiquitinates
    the import receptor after cargo release and forms the channel through
    which the receptor is retrotranslocated back to the cytosol; when

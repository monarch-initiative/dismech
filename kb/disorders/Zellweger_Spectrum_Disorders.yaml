name: Zellweger Spectrum Disorders
creation_date: "2026-05-13T00:00:00Z"
category: Mendelian
description: >-
  Zellweger spectrum disorders (ZSD) are a continuum of autosomal recessive
  peroxisome biogenesis disorders caused by biallelic pathogenic variants in
  any of at least 13 PEX genes; PEX1 variants are among the most prevalent.
  Defective
  peroxisome assembly produces multi-system metabolic failure characterized by
  plasma accumulation of very long-chain fatty acids (VLCFA), branched-chain
  fatty acids, and bile acid intermediates, together with deficiency of ether
  phospholipids (plasmalogens). The clinical spectrum spans severe neonatal
  Zellweger syndrome (cerebro-hepato-renal syndrome) at one end, intermediate
  neonatal adrenoleukodystrophy (NALD), and the milder infantile Refsum
  disease (IRD) at the other; severity correlates with residual peroxisomal
  function. Affected individuals typically present with profound hypotonia,
  seizures, characteristic craniofacial features, hepatic dysfunction, and
  variable progressive neurological, ophthalmologic, and auditory impairment.
disease_term:
  preferred_term: Zellweger spectrum disorders
  term:
    id: MONDO:0019609
    label: Zellweger spectrum disorders
notes: >-
  Two subtype axes, deliberately kept in one list. Zellweger spectrum disorder
  is classified both by phenotype severity - Zellweger syndrome, NALD,
  infantile Refsum disease, the three rows curated here first - and by which
  PEX gene carries the biallelic variants. GeneReviews records that the
  severity labels were "described in the past before the biochemical and
  molecular bases of this spectrum were fully determined", and that the term
  ZSD is now used for a defect in any ZSD-PEX gene regardless of phenotype.
  MONDO takes the genotype axis: fourteen of the fifteen direct subclasses of
  MONDO:0019609 are gene-defined, and those fourteen are the gene rows added
  here. The fifteenth is dispositioned below. The two axes cross-cut - PEX1 variants span the full severity
  range - so a severity row and a gene row can both describe one patient.

  Parent anchor. MONDO:0019609 is the right term for this entry: its label is
  "Zellweger spectrum disorders", its textual definition places it under
  peroxisome biogenesis disorder, and its children are the gene-defined
  spectrum classes this entry now enumerates. Two things about that term are
  worth recording rather than acting on. Its exact-synonym list mixes
  spectrum-wide with severe-end vocabulary - "Zellweger spectrum disorders"
  sits beside ZS, ZWS, "Zellweger syndrome" and "cerebrohepatorenal syndrome"
  - and it carries a MONDO curator note saying the term "refers to the severe
  form of Zellweger spectrum", citing monarch-initiative/mondo-build issue 61.
  So the label, the children and one of the synonyms describe the whole
  spectrum while the remaining synonyms and the curator note describe its
  severe end. No better-scoped MONDO term exists for the spectrum: the
  parent MONDO:0019234 (peroxisome biogenesis disorder) is broader still,
  since it also contains the rhizomelic chondrodysplasia punctata group, so
  the binding stands.

  How this entry relates to its neighbours. Four levels are in play and all
  four are curated. MONDO:0019234 peroxisome biogenesis disorder is the parent
  class and has its own entry, Peroxisome_Biogenesis_Disorder, which already
  carried all fourteen PEX genes; it is the right home for the non-Zellweger
  peroxisome biogenesis disorders, principally the PEX7-related rhizomelic
  chondrodysplasia punctata group. This entry is the Zellweger spectrum below
  it. The fourteen gene-defect classes added here as has_subtypes are its
  direct MONDO children. Below those sit the OMIM-numbered PBD classes, which
  this knowledge base curates as standalone entries -
  Peroxisome_Biogenesis_Disorder_1B under PEX1, 2B under PEX5, 3A under PEX12,
  4A and 4B under PEX6, 6A under PEX10, 11A and 11B under PEX13, 12A under
  PEX19 - so the rows added here sit above those entries in the same hierarchy
  rather than duplicating them. Adding a gene row does not retire the
  corresponding stub for a numbered PBD class; those remain separate curation
  jobs.

  How many ZSD-PEX genes. Three cached sources give three counts, and the
  difference is chronological rather than a disagreement. Ebberink 2011
  assigned over 600 patient fibroblast lines to complementation groups and
  reports twelve PEX genes; GeneReviews, updated 2020, reports thirteen; a
  2021 case report says fourteen. MONDO's twelve subclasses whose definition
  reads "Any Zellweger spectrum disorder in which the cause of the disease is
  a mutation in the PEX<n> gene" are PEX1, PEX2, PEX3, PEX5, PEX6, PEX10,
  PEX12, PEX13, PEX14, PEX16, PEX19 and PEX26 - Ebberink's twelve. PEX11B
  brings it to thirteen. PEX7 is the fourteenth only on MONDO's placement,
  which is the disposition recorded below.

  The fifteenth direct subclass is not gene-defined. MONDO:0800298 "peroxisome
  biogenesis disorder, complementation group 2" is a direct child of
  MONDO:0019609 named after a complementation group rather than a gene, and
  carries no textual definition. It is not curated as a row here, because the
  study of that complementation group cited on the PEX5 rows states that
  mutations in the PTS1 receptor gene PEX5 are what define complementation
  group 2 of the peroxisome biogenesis disorders - the concept MONDO:0100262
  "peroxisome biogenesis disorder due to PEX5 defect" already carries, curated
  here as the PEX5-ZSD row. A second row for the same gene under its
  complementation-group name would duplicate that row. Whether the two MONDO
  classes should be merged is a question for MONDO.

  PEX11B is a division defect, not an import or assembly defect. MONDO makes
  MONDO:0100279 a direct child of MONDO:0019609, but is the one class of the
  fourteen whose own definition reads "Any peroxisome biogenesis disorder in
  which the cause of the disease is a mutation in the PEX11B gene" rather than
  "Any Zellweger spectrum disorder in which...". That wording matches the
  biology: PEX11B elongates the peroxisomal membrane ahead of scission by
  DLP1, so its loss reduces peroxisome number rather than leaving peroxisomes
  unable to import. The row is therefore wired to its own Peroxisome Division
  Failure node rather than to an import step, and the definition mismatch is
  recorded rather than treated as a reason to leave the gene out.

  PEX7 is the boundary case, and MONDO contradicts itself on it.
  MONDO:0013945, peroxisome biogenesis disorder 9B (OMIM:614879), is a direct
  child of MONDO:0019609. But MONDO also has a class for the gene as a whole,
  MONDO:0100272 "peroxisome biogenesis disorder due to PEX7 defect", and that
  class is a child of MONDO:0100322 "non-Zellweger spectrum disorder", with
  rhizomelic chondrodysplasia punctata type 1 and adult Refsum disease due to
  PEX7 defect as its two children. So one PEX7 concept is inside the Zellweger
  spectrum and the other is explicitly outside it. The row curated here is the
  one MONDO places here, PBD9B, described as the milder allelic phenotype
  often indistinguishable from classic Refsum disease. The severe RCDP1
  phenotype is curated separately as
  Rhizomelic_Chondrodysplasia_Punctata_Type_1, and PEX7 as a gene stays on the
  Peroxisome_Biogenesis_Disorder parent entry. PEX7 is also the gene that the
  three cached ZSD-PEX gene counts do not reach: Ebberink's twelve plus PEX11B
  is thirteen, the number GeneReviews gives. This row overlaps a row
  on another entry, and MONDO says so itself. Adult_Refsum_Disease's Type 2
  row is bound to MONDO:0100307 "adult Refsum disease due to PEX7 defect",
  which sits under MONDO:0100272 and so under non-Zellweger spectrum disorder
  - a different placement from MONDO:0013945. But MONDO:0100307's own textual
  definition says it "is scheduled to be merged with MONDO:0013945 peroxisome
  biogenesis disorder 9B, based on the fact that the concept of these 2 terms
  are the same", and that it will be obsoleted and replaced by MONDO:0013945.
  Once that merge lands the two rows denote one MONDO class held under two
  different parents. MONDO:0013945 itself carries no adult Refsum synonym,
  only "peroxisome biogenesis disorder 9B" as an exact synonym and "PBD9B" as
  a related one. The row here is bound where MONDO currently places the term,
  and the duplication is recorded for a curator to settle rather than resolved
  by deleting either row.

  What is not recorded. No per-gene share of cases is recorded on these rows.
  Ebberink 2011 is the study that measured that distribution across more than
  600 fibroblast lines, but its per-gene numbers are in tables and the cached
  record holds only the abstract. The record carries no PubMed Central
  identifier; the full-text attempt it records resolved to an open-archive
  landing page rather than an article body, so no table text was captured. The only frequency statement any source cached for this
  entry makes is that PEX1 variants are among the most prevalent, which is
  recorded on the PEX1 row. Populating case_fractions here needs the Ebberink
  tables.
synonyms:
- Peroxisome biogenesis disorder, Zellweger spectrum
- ZSD
- PBD-ZSS
parents:
- peroxisome biogenesis disorder
- inborn errors of metabolism
has_subtypes:
- name: Zellweger Syndrome
  display_name: Zellweger Syndrome (cerebro-hepato-renal syndrome)
  description: >-
    The most severe phenotype, presenting in the neonatal period with profound
    hypotonia, intractable seizures, characteristic craniofacial dysmorphism,
    severe liver disease, and renal cortical cysts. Most affected infants die
    in the first year of life.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die
      during the first year of life, usually having made no developmental
      progress.
    explanation: >-
      GeneReviews supports the severe-end (classic Zellweger) phenotype with
      profound impairment and first-year mortality.
- name: NALD
  display_name: Neonatal Adrenoleukodystrophy
  description: >-
    Intermediate-severity phenotype with neonatal hypotonia, developmental
    delay, progressive leukodystrophy, adrenocortical dysfunction, and longer
    survival into childhood than classic Zellweger syndrome.
  evidence:
  - reference: PMID:11769739
    reference_title: Late onset white matter disease in peroxisome biogenesis disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is phenotypic and genetic overlap among the PBD known as
      Zellweger syndrome (ZS), infantile Refsum disease (IRD), and neonatal
      adrenoleukodystrophy (NALD).
    explanation: >-
      This reference establishes NALD as a recognized intermediate
      phenotype on the Zellweger continuum.
- name: IRD
  display_name: Infantile Refsum Disease
  description: >-
    The mildest end of the spectrum, with later onset, slower progression,
    retinitis pigmentosa, sensorineural hearing loss, ataxia, and survival
    into adolescence or adulthood. Distinct from adult (PHYH-related) Refsum
    disease.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital
      malformations, but rather progressive peroxisome dysfunction variably
      manifest as sensory loss (secondary to retinal dystrophy and
      sensorineural hearing loss), neurologic involvement (ataxia,
      polyneuropathy, and leukodystrophy), liver dysfunction, adrenal
      insufficiency, and renal oxalate stones.
    explanation: >-
      GeneReviews supports the milder IRD-end ZSD phenotype with progressive
      sensory, neurologic, hepatic, and adrenal involvement.
- name: PEX1-ZSD
  display_name: peroxisome biogenesis disorder due to PEX1 defect
  subtype_term:
    preferred_term: peroxisome biogenesis disorder due to PEX1 defect
    term:
      id: MONDO:0100259
      label: peroxisome biogenesis disorder due to PEX1 defect
  description: >-
    Zellweger spectrum disorder caused by biallelic PEX1 variants. PEX1 is one
    of the two AAA+ ATPases of the receptor export module, which resets the
    matrix protein import machinery by returning the cargo receptor to the
    cytosol; losing that step stalls receptor recycling and so blocks further
    rounds of import. PEX1 variants are among the most prevalent PEX gene
    defects reported in this spectrum.
  genes:
  - preferred_term: PEX1
    term:
      id: hgnc:8850
      label: PEX1
  evidence:
  - reference: CGGV:assertion_a345ba65-9dcd-43dd-a1c2-1778c1a921ea-2023-09-06T160000.000Z
    reference_title: "PEX1 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PEX1 | HGNC:8850 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive
    explanation: >-
      ClinGen's Peroxisomal Disorders Gene Curation Expert Panel classifies
      the PEX1 to peroxisome biogenesis disorder gene-disease relationship as
      Definitive with autosomal recessive inheritance. The assertion is
      recorded against the parent class peroxisome biogenesis disorder
      (MONDO:0019234), not against this subclass.
  - reference: PMID:31652724
    reference_title: "A Mechanistic Perspective on PEX1 and PEX6, Two AAA+ Proteins of the Peroxisomal Protein Import Machinery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The ATP-dependent protein complex in charge of resetting this
      machinery-the Receptor Export Module (REM)-comprises two members of the
      "ATPases Associated with diverse cellular Activities" (AAA+) family,
      PEX1 and PEX6, and a membrane protein that anchors the ATPases to the
      organelle membrane.
    explanation: >-
      Identifies PEX1 and PEX6 as the two AAA+ ATPases of the receptor export
      module that resets the import machinery, the step this subtype disables.
  - reference: PMID:33955040
    reference_title: "Compound heterozygous p. Arg949Trp and p. Gly970Ala mutations deteriorated the function of PEX1p: A study on PEX1 in a patient with Zellweger syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Mutations in the PEX1 gene are among the most prevalent.
    explanation: >-
      States that PEX1 variants are among the most prevalent causes reported in
      this spectrum.
  - reference: PMID:33955040
    reference_title: "Compound heterozygous p. Arg949Trp and p. Gly970Ala mutations deteriorated the function of PEX1p: A study on PEX1 in a patient with Zellweger syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      PEX1 and PEX6 proteins, belonging to the AAA family of ATPases, form a
      hexameric complex, which is associated with peroxisome membranes and
      essential for peroxisome biology.
    explanation: >-
      States that PEX1 acts with PEX6 as an AAA ATPase hexamer on the
      peroxisomal membrane.
- name: PEX2-ZSD
  display_name: peroxisome biogenesis disorder due to PEX2 defect
  subtype_term:
    preferred_term: peroxisome biogenesis disorder due to PEX2 defect
    term:
      id: MONDO:0100260
      label: peroxisome biogenesis disorder due to PEX2 defect
  description: >-
    Zellweger spectrum disorder caused by biallelic PEX2 variants. PEX2 is one
    of the three RING finger peroxins that together form the membrane-embedded
    ubiquitin ligase complex which monoubiquitinates the import receptor and
    provides the channel through which it is retrotranslocated to the cytosol.
  genes:
  - preferred_term: PEX2
    term:
      id: hgnc:9717
      label: PEX2
  evidence:
  - reference: CGGV:assertion_17bf1c4a-1775-40c6-a499-774c93827343-2020-02-07T170000.000Z
    reference_title: "PEX2 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PEX2 | HGNC:9717 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive
    explanation: >-
      ClinGen's Peroxisomal Disorders Gene Curation Expert Panel classifies
      the PEX2 to peroxisome biogenesis disorder gene-disease relationship as
      Definitive with autosomal recessive inheritance. The assertion is
      recorded against the parent class peroxisome biogenesis disorder
      (MONDO:0019234), not against this subclass.
  - reference: PMID:36421406
    reference_title: "Structure and function of the peroxisomal ubiquitin ligase complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Recycling requires receptor monoubiquitination by a membrane-embedded
      ubiquitin ligase complex composed of three RING finger (RF)
      domain-containing proteins: PEX2, PEX10, and PEX12.
    explanation: >-
      Names PEX2, PEX10 and PEX12 as the three RING finger proteins of the
      membrane-embedded ubiquitin ligase complex that monoubiquitinates the
      import receptor, the step this subtype disables.
- name: PEX3-ZSD
  display_name: peroxisome biogenesis disorder due to PEX3 defect
  subtype_term:
    preferred_term: peroxisome biogenesis disorder due to PEX3 defect
    term:
      id: MONDO:0100261
      label: peroxisome biogenesis disorder due to PEX3 defect
  description: >-
    Zellweger spectrum disorder caused by biallelic PEX3 variants. PEX3 is one
    of the three mammalian peroxins dedicated to peroxisomal membrane protein
    insertion rather than to matrix protein import, and in the absence of any
    of the three no peroxisomal structures can be identified and peroxisomal
    membrane proteins are mistargeted or degraded.
  genes:
  - preferred_term: PEX3
    term:
      id: hgnc:8858
      label: PEX3
  evidence:
  - reference: CGGV:assertion_d53df483-c31a-4672-8a11-04d33d6df336-2019-11-01T160000.000Z
    reference_title: "PEX3 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: PEX3 | HGNC:8858 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive
    explanation: >-
      ClinGen's Peroxisomal Disorders Gene Curation Expert Panel classifies
      the PEX3 to peroxisome biogenesis disorder gene-disease relationship as
      Definitive with autosomal recessive inheritance. The assertion is
      recorded against the parent class peroxisome biogenesis disorder
      (MONDO:0019234), not against this subclass.
  - reference: PMID:26434995
    reference_title: "Towards the molecular mechanism of the integration of peroxisomal membrane proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it is generally accepted that peroxisomes employ three proteins - Pex3,
      Pex19 and Pex16 in mammals - for the insertion of peroxisomal membrane
      proteins into the peroxisomal membrane.
    explanation: >-
      Names PEX3, PEX19 and PEX16 as the three mammalian peroxins required for
      insertion of peroxisomal membrane proteins, the step this subtype
      disables.
  - reference: PMID:26434995
    reference_title: "Towards the molecular mechanism of the integration of peroxisomal membrane proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the absence of any of these, no peroxisomal structures can be
      identified and PMPs are mistargeted or become degraded
    explanation: >-
      Supports the statement that losing any one of the three
      membrane-biogenesis peroxins leaves no identifiable peroxisomal
      structures and mistargeted membrane proteins.
- name: PEX5-ZSD
  display_name: peroxisome biogenesis disorder due to PEX5 defect
  subtype_term:
    preferred_term: peroxisome biogenesis disorder due to PEX5 defect
    term:
      id: MONDO:0100262
      label: peroxisome biogenesis disorder due to PEX5 defect
  description: >-
    Zellweger spectrum disorder caused by biallelic PEX5 variants. PEX5 is the
    cytosolic receptor for peroxisomal targeting signal type 1 cargo, and a
    patient nonsense allele removes import of both type 1 and type 2 matrix
    proteins, so its loss blocks cargo recognition at the first step of
    import.
  genes:

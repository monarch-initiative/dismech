- name: PTS Receptor Cargo Recognition Failure
  biological_scale: MOLECULAR
  description: >-
    Peroxisomal matrix proteins are recognised in the cytosol by shuttling
    receptors before they ever reach the organelle: PEX5 is the receptor for
    peroxisomal targeting signal type 1 cargo and is also required for import
    of type 2 cargo, which PEX7 recognises. Biallelic loss of either receptor
    removes cargo recognition at the first step of import, so matrix enzymes
    are never delivered even when the peroxisomal membrane and its
    translocation machinery are intact.

      organelle membrane.
    explanation: >-
      Supports the receptor export module resetting the import machinery and
      comprising PEX1, PEX6 and a membrane anchor, and that ATP hydrolysis is
      used only for that reset.
  - reference: PMID:30366024
    reference_title: "Isoform-specific domain organization determines conformation and function of the peroxisomal biogenesis factor PEX26."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Peroxisomal biogenesis factor PEX26 is a membrane anchor for the
      multi-subunit PEX1-PEX6 protein complex that controls ubiquitination and
      dislocation of PEX5 cargo receptors for peroxisomal matrix protein
      import.
    explanation: >-
      States that PEX26 anchors the PEX1-PEX6 complex to the peroxisomal
      membrane, the step this subtype disables.
  downstream:
  - target: Peroxisome Biogenesis Failure
    causal_link_type: DIRECT
    description: >-
      Failure to export the import receptor back to the cytosol stalls the
      import cycle after a single round, the import-competence failure this
      node feeds.
- name: Peroxisomal Membrane Assembly Failure
  biological_scale: CELLULAR
  description: >-
    PEX3, PEX16 and PEX19 are the three mammalian peroxins dedicated to
    inserting peroxisomal membrane proteins into the peroxisomal membrane, by
    a PEX19- and PEX3-dependent class I route and a PEX19- and PEX16-dependent
    class II route. Their loss is categorically different from a matrix import
    defect: in the absence of any of the three no peroxisomal structures can
    be identified at all, and peroxisomal membrane proteins are mistargeted or
    degraded, so there is no membrane compartment left for the import
    machinery to act on.

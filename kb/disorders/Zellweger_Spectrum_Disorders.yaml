- name: Receptor Export Module ATPase Failure
  biological_scale: MOLECULAR
  description: >-
    The receptor export module resets the import machinery. PEX1 and PEX6 are
    its two AAA+ ATPases and PEX26 the membrane protein that anchors them to
    the organelle. Unlike most translocases, peroxisomal matrix import does
    not use ATP hydrolysis to move cargo; it uses it only to extract the
    receptor afterwards, which is why losing this module stalls the cycle
    rather than the individual translocation event. PEX1 variants are among
    the most prevalent reported in this spectrum.

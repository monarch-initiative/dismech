diagnosis:
- name: Plasma very-long-chain fatty acid measurement
  description: >-
    Plasma VLCFA testing is the first-line biochemical screen for Zellweger
    spectrum disorders and remains the cornerstone of ZSD diagnosis.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:36649687
    reference_title: "Adrenal Insufficiency in Peroxisomal Disorders: A Single Institution Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDs are characterized by abnormal elevations of very-long-chain fatty
      acids (VLCFA).
    explanation: >-
      Clinical case series supports VLCFA measurement as the defining
      biochemical diagnostic test in peroxisomal disorders.
- name: C26:0-lysophosphatidylcholine in dried blood spots
  description: >-
    Measurement of C26:0-lysophosphatidylcholine (C26:0-lysoPC) in dried blood
    spots is a sensitive VLCFA-based marker for ZSD, adopted in the diagnostic
    work-up and usable for newborn screening (including incidental detection
    within X-linked adrenoleukodystrophy newborn-screening programs).
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:28677031
    reference_title: "Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      C26:0-lysoPC in DBS is a sensitive and useful marker for VLCFA
      accumulation in patients with a ZSD.
    explanation: >-
      Case-control biomarker study supports dried-blood-spot C26:0-lysoPC as a
      sensitive diagnostic marker for ZSD, with newborn-screening potential.
  - reference: PMID:28677031
    reference_title: "Evaluation of C26:0-lysophosphatidylcholine and C26:0-carnitine as diagnostic markers for Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This marker has the potential to be used for newborn screening for ZSD.
    explanation: >-
      Supports the newborn-screening applicability of dried-blood-spot
      C26:0-lysoPC for ZSD detection.
- name: Molecular genetic testing of PEX genes
  description: >-
    Identification of biallelic pathogenic variants in one of the 13 known
    ZSD-PEX genes establishes the molecular diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive
      clinical and biochemical findings above by identification of biallelic
      pathogenic variants in one of the 13 known ZSD-PEX genes.
    explanation: >-
      GeneReviews directly supports biallelic PEX gene testing as the
      molecular diagnostic standard for ZSD.
treatments:
- name: Supportive Care
  description: >-
    There is no curative therapy for Zellweger spectrum disorders. Care is
    multidisciplinary and supportive, addressing seizures, feeding,
    hepatic dysfunction, hearing, and vision.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747

      proliferation and division.
  - reference: PMID:38423277
    reference_title: "Two siblings with PEX11B-related peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Pathogenic variants in this gene result in a rare genetic disorder with

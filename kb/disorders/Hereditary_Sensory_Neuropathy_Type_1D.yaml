pathophysiology:
- name: Heterozygous ATL1 Variant with Reduced Atlastin-1 GTPase Activity
  biological_scale: MOLECULAR
  description: >-
    HSN1D is caused by heterozygous dominant ATL1 variants (e.g. the missense
    p.Asn355Lys and p.Glu66Gln alleles and the p.Val326TrpfsX8 frameshift)
    that reduce the GTPase activity of atlastin-1, a large dynamin-related
    GTPase. Reduced GTPase activity is the shared molecular defect, and
    because the disease is dominant with truncating alleles among the
    mutations, both dominant-negative and haploinsufficiency effects have been
    proposed; the primary study demonstrated reduced GTPase activity and
    disrupted ER morphology for the mutant protein.
  genes:
  - preferred_term: ATL1 (atlastin-1)
    term:
      id: hgnc:11231
      label: ATL1
  molecular_functions:
  - preferred_term: atlastin-1 GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  downstream:
  - target: Impaired Homotypic ER Membrane Fusion
    causal_link_type: DIRECT
    description: >-
      Atlastin GTPase activity is required for the homotypic ER fusion
      reaction, so its reduction directly impairs that fusion.
    evidence:
    - reference: PMID:19633650
      reference_title: "Homotypic fusion of ER membranes requires the dynamin-like GTPase atlastin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results demonstrate that Atlastin mediates membrane tethering and fusion and strongly suggest that it is the GTPase activity that is required for ER homotypic fusion."
      explanation: Establishes that the GTPase activity of atlastin is what drives homotypic ER membrane fusion, so the mutation-driven loss of GTPase activity impairs fusion.
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected a missense mutation (c.1065C>A, p.Asn355Lys) in atlastin-1 (ATL1), a gene that is known to be mutated in early-onset hereditary spastic paraplegia SPG3A and that encodes the large dynamin-related GTPase atlastin-1. The mutant protein exhibited reduced GTPase activity"
    explanation: Establishes the causal ATL1 variant and its reduced GTPase activity as the molecular lesion of HSN1D.
  - reference: PMID:21220294
    reference_title: "Structural basis for the nucleotide-dependent dimerization of the large G protein atlastin-1/SPG3A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dimer formation in solution is observed only in the presence of GTP and transition state analogs, similar to other G proteins that are activated by nucleotide-dependent dimerization."
    explanation: Provides the structural basis for atlastin-1's nucleotide (GTP)-dependent dimerization, the step required for its GTPase-driven fusion activity that HSN1D variants impair.
- name: Impaired Homotypic ER Membrane Fusion
  biological_scale: MOLECULAR
  description: >-
    Atlastin-1 mediates GTP-dependent homotypic fusion of endoplasmic
    reticulum tubules; GTPase-deficient atlastin fails to self-associate into
    the trans-oligomeric complexes needed to tether and fuse apposed ER
    membranes, so mutant atlastin-1 cannot support the fusion reaction.
  biological_processes:
  - preferred_term: homotypic endoplasmic reticulum membrane fusion
    term:
      id: GO:0016320
      label: endoplasmic reticulum membrane fusion
    modifier: DECREASED
  downstream:
  - target: Disrupted Tubular ER Network
    causal_link_type: DIRECT
    description: >-
      Interconnection of ER tubules into a network depends on atlastin-mediated
      fusion, so impaired fusion disrupts the tubular network.
    evidence:
    - reference: PMID:19665976
      reference_title: "A class of dynamin-like GTPases involved in the generation of the tubular ER network."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The atlastins localize to the tubular ER and are required for proper network formation in vivo and in vitro. Depletion of the atlastins or overexpression of dominant-negative forms inhibits tubule interconnections."
      explanation: Links loss of atlastin fusion function to failed interconnection of ER tubules, i.e. a disrupted tubular ER network.
  evidence:
  - reference: PMID:19633650
    reference_title: "Homotypic fusion of ER membranes requires the dynamin-like GTPase atlastin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, GTPase-deficient Atlastin is inactive, unable to form trans-oligomeric complexes owing to failure to self-associate, and incapable of promoting fusion in vitro."
    explanation: Shows GTPase-deficient atlastin cannot promote homotypic ER membrane fusion, the step lost in HSN1D.
- name: Disrupted Tubular ER Network
  biological_scale: CELLULAR
  description: >-
    Loss of atlastin-mediated fusion disrupts the branched, interconnected
    tubular network of the peripheral endoplasmic reticulum. This ER-shaping
    defect is the cellular abnormality shared by the allelic disorders
    HSN1D and SPG3A, and the HSN1D mutant atlastin-1 prominently disrupts ER
    network morphology in cultured cells.
  biological_processes:
  - preferred_term: endoplasmic reticulum organization
    term:
      id: GO:0007029
      label: endoplasmic reticulum organization
    modifier: ABNORMAL
  downstream:
  - target: Distal Degeneration of Long Sensory Axons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective ER morphogenesis is proposed to injure long, highly polarized
      neurons by interfering with proper membrane distribution or polarity; in
      HSN1D the primary vulnerable population is the long peripheral sensory
      axon. The intermediate steps between the ER-network defect and axonal
      degeneration are not established.
  - target: Distal Motor Axon Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In families with sensorimotor involvement, defective ER network shaping
      in long peripheral axons also impairs lower motor neuron axons, producing
      variable axonal motor neuropathy alongside sensory axonopathy.
    evidence:
    - reference: PMID:22340599
      reference_title: "The N355K atlastin 1 mutation is associated with hereditary sensory neuropathy and pyramidal tract features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NCS revealed signs of an axonal motor and sensory neuropathies."
      explanation: >-
        Documents peripheral axonal motor neuropathy alongside sensory
        neuropathy in ATL1 p.Asn355Lys carriers.
  - target: Corticospinal Tract Axonopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In a subset of HSN1D families (such as carriers of the p.Asn355Lys ATL1
      variant), defective tubular ER shaping also impairs long corticospinal
      motor axons, producing allelic overlap with SPG3A.
    evidence:
    - reference: PMID:20200447
      reference_title: "Hereditary spastic paraplegia proteins REEP1, spastin, and atlastin-1 coordinate microtubule interactions with the tubular ER network."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data indicate that the HSP proteins atlastin-1, spastin, and REEP1 interact within the tubular ER membrane in corticospinal neurons to coordinate ER shaping and microtubule dynamics."
      explanation: >-
        Links atlastin-1 ER-shaping defects to corticospinal neuron pathology.
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant protein exhibited reduced GTPase activity and prominently disrupted ER network morphology when expressed in COS7 cells, strongly supporting pathogenicity."
    explanation: Demonstrates that the HSN1D atlastin-1 mutant disrupts the tubular ER network in cells.
  - reference: PMID:18270207
    reference_title: "Atlastin GTPases are required for Golgi apparatus and ER morphogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Abnormal morphogenesis of the ER and Golgi resulting from mutations in atlastin-1 may ultimately underlie SPG3A by interfering with proper membrane distribution or polarity of the long corticospinal motor neurons."
    explanation: Provides the ER-morphogenesis-defect neuropathogenic model (proposed for the allelic SPG3A), the mechanism by which the disrupted ER network is thought to injure long axons.
  - reference: PMID:20200447
    reference_title: "Hereditary spastic paraplegia proteins REEP1, spastin, and atlastin-1 coordinate microtubule interactions with the tubular ER network."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We determined that REEP1 is structurally related to the DP1/Yop1p family of ER-shaping proteins and localizes to the ER in cultured rat cerebral cortical neurons, where it colocalizes with spastin and atlastin-1."
    explanation: Establishes endogenous colocalization of atlastin-1 with the REEP1 and spastin ER-shaping machinery in primary mammalian neurons.

name: Hereditary Sensory Neuropathy Type 1D
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
description: >-
  Hereditary sensory neuropathy type 1D (HSN1D, HSAN1D) is an autosomal
  dominant, adult-onset axonal sensory neuropathy caused by heterozygous
  variants in ATL1, the gene encoding atlastin-1, a large dynamin-related
  GTPase that mediates GTP-dependent homotypic fusion of endoplasmic reticulum
  tubules. Affected individuals develop a length-dependent, ulcero-mutilating
  sensory neuropathy: prominent distal sensory loss leads to painless
  injuries which, unrecognized, produce delayed wound healing, chronic skin
  ulcers, osteomyelitis, and distal amputations, with variable and usually
  milder motor involvement and, in some families, additional pyramidal-tract
  (upper motor neuron) features. ATL1 is also the gene mutated in the
  early-onset hereditary spastic paraplegia SPG3A, so HSN1D and SPG3A are
  allelic disorders. Why the same GTPase disorder targets long peripheral
  sensory axons in HSN1D but corticospinal motor axons in SPG3A — sometimes,
  as with the recurrent N355K allele, overlapping in one family — remains an
  open mechanistic question.

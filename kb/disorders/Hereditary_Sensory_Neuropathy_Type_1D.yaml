notes: >-
  No dedicated GeneReviews or StatPearls chapter covers hereditary sensory
  neuropathy type 1D (NCBI Bookshelf index snapshot 2026-09-10 returns
  NO_CHAPTER for both). The allelic ATL1 GeneReviews chapter "Spastic
  Paraplegia 3A" covers autosomal dominant spastic paraplegia 3A (including
  complicated HSP with axonal motor neuropathy and symptomatic spasticity
  management with oral baclofen or tizanidine) and does not address HSN1D in
  its indexed summary; SPG3A-specific antispasticity regimens were therefore
  not imported as HSN1D treatments.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset varies between the 2nd and 5th decade of life."
    explanation: Documents the adult-onset window for HSN I.
diagnosis:
- name: Nerve conduction studies
  description: >-
    Nerve conduction studies confirm an axonal sensory and motor neuropathy
    predominantly affecting the lower limbs — the electrophysiological signature
    used to support the clinical diagnosis.
  evidence:
  - reference: PMID:18348718
    reference_title: "Hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies confirm a sensory and motor neuropathy predominantly affecting the lower limbs."
    explanation: States nerve conduction studies as the electrophysiological confirmation of HSN I.
- name: Radiological imaging for bone complications
  description: >-
    Radiography and magnetic resonance imaging are used when bone infection or
    necrosis (osteomyelitis) is suspected in the insensate limbs.
  evidence:
  - reference: PMID:18348718
    reference_title: "Hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiological studies, including magnetic resonance imaging, are useful when bone infections or necrosis are suspected."
    explanation: Documents the imaging modalities used to detect the osteomyelitis/necrosis complications.
- name: Molecular genetic testing
  description: >-
    Definitive diagnosis rests on detecting a heterozygous pathogenic ATL1
    variant by direct sequencing, typically within a multi-gene hereditary
    sensory neuropathy panel that also covers SPTLC1, RAB7 and other HSN genes.
  notes: >-
    HSN1D shares its clinical picture with other HSN I subtypes, so the causal
    gene is established by sequencing rather than by phenotype alone.
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To elucidate the genetic basis of an HSN I subtype in a family in which mutations in the few known HSN I genes had been excluded"
    explanation: Establishes that HSN1D is defined molecularly, after excluding the other known HSN I genes, i.e. by multi-gene sequencing.
differential_diagnoses:
- name: ATL3-related hereditary sensory neuropathy (HSN1F)
  description: >-
    ATL3 encodes atlastin-3, a paralogue of ATL1 and, like it, an ER-shaping
    GTPase. Dominant ATL3 mutations cause a clinically near-identical autosomal
    dominant sensory neuropathy with loss of pain perception and destruction of
    the pedal skeleton (HSN1F). Because the two atlastin genes produce
    overlapping ulcero-mutilating sensory phenotypes, distinguishing HSN1D
    (ATL1) from HSN1F (ATL3) requires molecular testing — this is the principal
    named-entity confusion hazard for this entry.
  evidence:
  - reference: PMID:24459106
    reference_title: "Sensory neuropathy with bone destruction due to a mutation in the membrane-shaping atlastin GTPase 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family with sensory neuropathy with loss of pain perception and destruction of the pedal skeleton we report a missense mutation in a highly conserved amino acid residue of atlastin GTPase 3 (ATL3), an endoplasmic reticulum-shaping GTPase."
    explanation: Establishes ATL3 (HSN1F) as a clinically similar ER-shaping-GTPase sensory neuropathy that must be distinguished from ATL1 HSN1D.
- name: Other hereditary sensory and autonomic neuropathies
  description: >-
    The differential includes the other HSAN/HSN subtypes (especially HSAN II)
    as well as acquired mimics — diabetic foot syndrome, alcoholic and other
    toxic neuropathies, immune-mediated neuropathy, amyloidosis, spinal cord
    disease, tabes dorsalis, and leprous neuropathy.
  evidence:
  - reference: PMID:18348718
    reference_title: "Hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential diagnosis includes the other hereditary sensory and autonomic neuropathies (HSAN), especially HSAN II, as well as diabetic foot syndrome, alcoholic neuropathy, neuropathies caused by other neurotoxins/drugs, immune mediated neuropathy, amyloidosis, spinal cord diseases, tabes dorsalis, lepra neuropathy, or decaying skin tumours like amelanotic melanoma."
    explanation: Enumerates the inherited and acquired differential diagnoses of HSN I.

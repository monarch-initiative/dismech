    external_id: CGGV:assertion_0c0282d1-5ab4-4a86-b1f6-165a3dbd515a-2022-02-10T020857.711Z
    evidence:
    - reference: CGGV:assertion_0c0282d1-5ab4-4a86-b1f6-165a3dbd515a-2022-02-10T020857.711Z
      reference_title: "ATL1 / neuropathy, hereditary sensory, type 1D (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ATL1 | HGNC:11231 | neuropathy, hereditary sensory, type 1D | MONDO:0013381 | AD | Definitive | SOP8 | Charcot-Marie-Tooth Disease Gene Curation Expert Panel"
      explanation: >-
        ClinGen Charcot-Marie-Tooth Disease Gene Curation Expert Panel classifies
        the autosomal dominant ATL1 association with hereditary sensory
        neuropathy type 1D as Definitive.
  notes: >-
    Heterozygous dominant ATL1 variants cause HSN1D. Reported alleles include
    p.Asn355Lys (c.1065C>A), p.Glu66Gln (c.196G>C), and the frameshift
    p.Val326TrpfsX8 (c.976delG). ATL1 is allelic with SPG3A hereditary spastic
    paraplegia (both ATL1-encoded atlastin-1 disorders). Across the wider ATL1
    mutational spectrum, most mutations are missense, exons 4, 7, 8 and 12 are
    mutation hotspots, and there is no clear genotype-phenotype correlation —
    the same allele can give sensory-predominant (HSN1D) or motor-predominant
    (SPG3A) disease.

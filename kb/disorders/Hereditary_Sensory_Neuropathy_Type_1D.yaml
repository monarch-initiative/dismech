discussions:
- discussion_id: hsn1d_spg3a_selective_vulnerability
  prompt: >-
    Why do heterozygous loss-of-GTPase-activity ATL1 variants cause a
    length-dependent sensory neuropathy of long peripheral sensory axons in
    HSN1D, while other ATL1 variants (and sometimes the same N355K allele
    within one family) cause a corticospinal motor axonopathy in SPG3A?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Tubular ER Network
  - pathophysiology#Distal Degeneration of Long Sensory Axons
  rationale: >-
    HSN1D and SPG3A are allelic (both from ATL1 / atlastin-1 dysfunction) and
    share the same cellular lesion — a disrupted tubular ER network from
    impaired homotypic ER fusion — yet they target different long-axon
    populations (peripheral sensory versus corticospinal motor). The N355K
    family even shows both sensory neuropathy and pyramidal-tract features,
    blurring the boundary. What determines whether sensory or motor long axons
    degenerate is not established, so treating a shared ER-shaping defect as
    fully explaining the phenotype would overstate current knowledge.
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study highlights an unexpected major role for atlastin-1 in the function of sensory neurons and identifies HSN I and SPG3A as allelic disorders."
    explanation: Frames the open question — the same gene, previously known only for motor-predominant SPG3A, has an unexpected sensory-neuron role in HSN1D.
  - reference: PMID:22340599
    reference_title: "The N355K atlastin 1 mutation is associated with hereditary sensory neuropathy and pyramidal tract features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our family carrying the N355K ATL1 mutation, which was initially diagnosed as HSN I, enlarges the SPG3A phenotype."
    explanation: Shows the same allele producing overlapping sensory and pyramidal (motor) phenotypes, sharpening the selective-vulnerability question.
  - reference: PMID:28396731
    reference_title: "Clinical features and genotype-phenotype correlation analysis in patients with ATL1 mutations: A literature reanalysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that there is no clear genotype-phenotype correlation in HSPs-SPG3A patients."
    explanation: A systematic reanalysis of ATL1 mutations finds no clear genotype-phenotype correlation, directly supporting that variant identity alone does not determine the sensory-vs-motor outcome.
- discussion_id: hsn1d_cos7_model_fidelity
  prompt: >-
    Do the ER-morphology defects seen when HSN1D atlastin-1 mutants are
    expressed in COS-7 (a non-neuronal African green monkey kidney line)
    faithfully represent the pathology of long human peripheral sensory axons?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Tubular ER Network
  - experimental_models#COS-7 heterologous expression of mutant atlastin-1
  rationale: >-
    The evidence that HSN1D atlastin-1 disrupts the tubular ER network comes
    from heterologous overexpression in COS-7 cells, not from human dorsal root
    ganglion neurons. The COS-7 readout establishes that the mutant protein is
    functionally defective for ER shaping, but the disease-relevant question —
    why long peripheral sensory axons specifically degenerate — cannot be
    answered in a non-neuronal line that lacks the length-dependent axonal
    architecture. Evidence exists in the model; its translational validity for
    long sensory axons is the open question.
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant protein exhibited reduced GTPase activity and prominently disrupted ER network morphology when expressed in COS7 cells, strongly supporting pathogenicity."
    explanation: The pathogenicity evidence is a COS-7 heterologous-expression readout, not a human sensory-neuron readout — the basis for the model-fidelity gap.
experimental_models:
- name: COS-7 heterologous expression of mutant atlastin-1
  description: >-
    Transient expression of HSN1D mutant atlastin-1 (e.g. p.Asn355Lys) in COS-7
    cells, a non-neuronal African green monkey kidney fibroblast-like line, used
    to assay GTPase activity and ER network morphology.
  experimental_model_type: CELL_LINE
  cell_source: immortalized
  publication: PMID:21194679
  modeled_mechanisms:
  - target: Disrupted Tubular ER Network
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Mutant atlastin-1 prominently disrupts ER network morphology in COS-7
      cells, recapitulating the ER-shaping defect at the cellular level.
    limitations: >-
      A non-neuronal heterologous overexpression system: it lacks the
      length-dependent axonal architecture of the human dorsal root ganglion
      sensory neurons that actually degenerate, so it cannot address the
      sensory-neuron-selective vulnerability, and overexpression may not reflect
      endogenous variant dosage.
    evidence:
    - reference: PMID:21194679
      reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant protein exhibited reduced GTPase activity and prominently disrupted ER network morphology when expressed in COS7 cells, strongly supporting pathogenicity."
      explanation: Establishes the COS-7 model as informative for the disrupted-ER-network node.

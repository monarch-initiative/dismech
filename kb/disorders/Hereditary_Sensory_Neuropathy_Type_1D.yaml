genetic:
- name: ATL1
  gene_term:
    preferred_term: ATL1 (atlastin-1)
    term:
      id: hgnc:11231
      label: ATL1
  association: Causal
  notes: >-
    Heterozygous dominant ATL1 variants cause HSN1D. Reported alleles include
    p.Asn355Lys (c.1065C>A), p.Glu66Gln (c.196G>C), and the frameshift
    p.Val326TrpfsX8 (c.976delG). ATL1 is allelic with SPG3A hereditary spastic
    paraplegia (both ATL1-encoded atlastin-1 disorders). Across the wider ATL1
    mutational spectrum, most mutations are missense, exons 4, 7, 8 and 12 are
    mutation hotspots, and there is no clear genotype-phenotype correlation —
    the same allele can give sensory-predominant (HSN1D) or motor-predominant
    (SPG3A) disease.
  evidence:
  - reference: PMID:21194679
    reference_title: "Targeted high-throughput sequencing identifies mutations in atlastin-1 as a cause of hereditary sensory neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An expanded screen in 115 additional HSN I patients identified two further dominant ATL1 mutations"
    explanation: Establishes ATL1 as the HSN1D gene and that additional dominant ATL1 alleles were found by screening HSN I patients.
  - reference: PMID:28396731
    reference_title: "Clinical features and genotype-phenotype correlation analysis in patients with ATL1 mutations: A literature reanalysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also find that exons 4, 7, 8 and 12 are mutation hotspots in ATL1 gene."
    explanation: Defines the ATL1 mutational hotspots relevant to the HSN1D/SPG3A variant spectrum.
  - reference: PMID:11685207
    reference_title: "Mutations in a newly identified GTPase gene cause autosomal dominant hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the identification of mutations in a newly identified GTPase gene, SPG3A, in ADHSP affected individuals."
    explanation: Establishes ATL1 (SPG3A) as the spastic-paraplegia gene with which HSN1D is allelic.

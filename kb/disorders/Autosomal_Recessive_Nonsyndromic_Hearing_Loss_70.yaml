inheritance:
- name: Autosomal recessive
  description: >-
    Every reported DFNB70 family has two PNPT1 alleles in the affected
    individuals - homozygous p.(Glu475Gly) in the Moroccan and Tunisian
    consanguineous families, compound heterozygous p.(Ala46Gly) with
    p.(Asn540Ser) in the South Indian family. Heterozygous parents are reported
    as unaffected. The sibling recurrence risk for a couple who have had one
    affected child is 25 percent.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23084290
    reference_title: "A mutation in PNPT1, encoding mitochondrial-RNA-import protein PNPase, causes hereditary hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By positional cloning, we identified a homozygous PNPT1 missense mutation (c.1424A>G predicting the protein substitution p.Glu475Gly) of a highly conserved PNPase residue within the second RNase-PH domain in a family affected by autosomal-recessive nonsyndromic hearing impairment."
    explanation: The founding family, its homozygous genotype and the recessive nonsyndromic
      phenotype it segregates with.
  - reference: PMID:34194829
    reference_title: Novel pathogenic mutations and further evidence for clinical relevance
      of genes and variants causing hearing impairment in Tunisian population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PNPT1-Glu475Gly variant identified in (Family.7_P7) segregated in 5 siblings born from consanguineous parents with ARNSHI"
    explanation: Independent recessive segregation of the same allele in a second
      consanguineous family, in five affected siblings.
  - reference: PMID:41255389
    reference_title: Pathological PNPase variants with altered RNA binding and degradation
      activity affect the phenotype of bacterial and human cell models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "In all cases, the heterozygous parents carrying a wild-type (wt)PNPT1 allele were asymptomatic."
    explanation: >-
      States that carriers across the reported PNPT1 families are unaffected, which is
      what makes this recessive rather than a dominant with reduced penetrance. Marked
      BACKGROUND because the sentence is this in vitro paper's summary of the clinical
      literature it drew its variants from, not one of its own results.
pathophysiology:
- name: PNPT1 Biallelic Hypomorphic Missense Variants
  biological_scale: MOLECULAR
  role: initiator
  mechanism_confidence: ESTABLISHED
  description: >-
    Two PNPT1 missense alleles, inherited from unaffected carrier parents. The
    founding and best-characterised allele is c.1424A>G p.(Glu475Gly), which
    changes a highly conserved residue in the second RNase-PH domain and was
    found homozygous in the Moroccan family and, independently, in a Tunisian
    family. A South Indian family carries a different pair, p.(Ala46Gly) with
    p.(Asn540Ser), in compound heterozygosity.

    These are hypomorphic rather than null alleles. PNPase is essential in mice
    and in human cells, so a complete absence of the protein is not what DFNB70
    patients have; what they have is an enzyme that assembles and works badly.
  genes:
  - preferred_term: PNPT1
    term:
      id: hgnc:23166
      label: PNPT1
  genetic_context:
    genes:
    - preferred_term: PNPT1
      term:
        id: hgnc:23166
        label: PNPT1
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    notes: >-
      HOMOZYGOUS describes the two consanguineous families carrying
      p.(Glu475Gly); the South Indian family is compound heterozygous for a
      different pair of missense alleles, and the schema slot is single-valued.
      PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION because
      p.(Glu475Gly) was shown to be hypofunctional rather than absent, and
      because PNPase is essential in human cells.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the Q387R and E475G variants were strongly impaired in RNA20 degradation"
    explanation: The direct measurement of impaired degradation by the DFNB70 allele.
  - reference: PMID:41255389
    reference_title: Pathological PNPase variants with altered RNA binding and degradation
      activity affect the phenotype of bacterial and human cell models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Human PNPase (hPNPase) is an essential RNA exonuclease located in mitochondria, where it contributes to RNA import from the cytoplasm, degradation of mitochondrial RNA and R-loop homeostasis."
    explanation: >-
      The enzyme's three mitochondrial jobs, which is why an assembly defect has more

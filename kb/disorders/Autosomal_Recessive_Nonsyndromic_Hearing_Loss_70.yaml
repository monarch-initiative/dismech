name: Autosomal Recessive Nonsyndromic Hearing Loss 70
category: Mendelian
creation_date: "2026-09-25T00:00:00Z"
synonyms:
- DFNB70
- deafness, autosomal recessive 70
- autosomal recessive nonsyndromic deafness 70
- PNPT1-related nonsyndromic hearing loss
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 70
  term:
    id: MONDO:0013978
    label: autosomal recessive nonsyndromic hearing loss 70
parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss
description: >-
  DFNB70 (OMIM 614934) is severe-to-profound, prelingual or congenital,
  sensorineural hearing impairment caused by biallelic variants in PNPT1, the
  nuclear gene encoding the mitochondrial polynucleotide phosphorylase, PNPase.
  It is the isolated-deafness end of the recessive PNPT1 phenotype range, and
  whether it is a distinct entity or one end of a single spectrum is the central
  unresolved question about it.

  PNPase is a homotrimeric 3'-5' phosphorolytic exoribonuclease that sits mostly
  in the mitochondrial intermembrane space. Two of its jobs are relevant here: it
  is one of the very few known components of the machinery that imports a subset
  of nuclear-encoded RNAs into mitochondria, and, with the helicase SUV3, it
  degrades and processes mitochondrial transcripts. The founding DFNB70 allele,
  homozygous c.1424A>G p.(Glu475Gly) in a consanguineous Moroccan family, sits on
  a conserved residue of the second RNase-PH domain and yields a hypofunctional
  protein: the trimer is disturbed and mitochondrial RNA import is impaired.
  Later in vitro work found the same substitution strongly impaired at RNA
  degradation as well, so both PNPase activities are affected by the deafness
  allele.

  Why the ear. PNPase stains strongly in the murine cochlea, in the sensory hair
  cells and the auditory ganglion neurons, which is the only tissue-level
  evidence for where the lesion acts. Beyond that localisation the step from a
  generalised mitochondrial RNA-handling defect to isolated deafness is not
  explained: no cochlea-restricted animal model exists, and nothing has been
  measured in human inner-ear tissue.

  The published case material is four families. The Moroccan family carries
  homozygous p.(Glu475Gly); a consanguineous Tunisian family with five affected
  siblings carries the same allele; a South Indian assortative-mating family
  carries compound heterozygous p.(Ala46Gly) and p.(Asn540Ser) with prelingual
  profound hearing loss, vestibular dysfunction and unilateral progressive vision
  loss; and a fourth family's two adult siblings, ascertained as isolated severe
  congenital hearing loss, went on in their forties to develop ataxia, dystonia
  and cognitive decline, then optic atrophy, spasticity and incontinence. That
  last family is the reason the nonsyndromic designation carries a caveat rather
  than a full stop, and it is why age at assessment matters when a PNPT1
  genotype is called DFNB70.

  The gene-disease relationship has been formally graded as weak for the hearing
  phenotype: the ClinGen Hearing Loss Working Group classified PNPT1 for
  autosomal recessive nonsyndromic hearing impairment as Limited. The current
  ClinGen Gene-Disease Validity download carries only one PNPT1 assertion at all,
  for Leigh syndrome.

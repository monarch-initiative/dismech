- name: Cochlear Hair Cell and Spiral Ganglion Neuron Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proposed site of the lesion. PNPase stains strongly in the murine
    cochlea, in the sensory hair cells and the auditory ganglion neurons, and the
    original report concludes that the mitochondrial RNA-import machinery is
    specifically required for auditory function. That is expression plus a
    phenotype-level inference, not a measurement made in a cochlea carrying a
    DFNB70 genotype: no conditional mouse, no patient temporal bone, no
    hair-cell electrophysiology. The node is graded HYPOTHETICAL for that
    reason, and it is the weakest link in this entry.

    snippet: "Structural studies on PNPases of different organisms have shown that the protein is a homotrimer in which the protomers are assembled in a doughnut shape with the KH and S1 RNA binding domains on the top of a central channel where the catalytic site is located"
    explanation: >-
      Why trimer assembly is the functionally decisive step rather than an incidental

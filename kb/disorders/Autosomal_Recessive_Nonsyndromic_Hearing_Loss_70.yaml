- name: Disrupted PNPase Trimer Assembly
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PNPase is catalytically active only as a homotrimer, whose protomers form a
    doughnut with the KH and S1 RNA-binding domains above a central channel
    holding the catalytic site. p.(Glu475Gly) disturbs that assembly, and the
    2025 survey of pathological PNPase variants found defective assembly common
    to every disease allele it tested. This is the step at which the two PNPase
    jobs downstream - RNA import and RNA degradation - both become impaired.
  molecular_functions:
  - preferred_term: polyribonucleotide nucleotidyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0004654
      label: polyribonucleotide nucleotidyltransferase activity
  biological_processes:
  - preferred_term: PNPase homotrimer assembly
    modifier: DECREASED
    term:
      id: GO:0070207
      label: protein homotrimerization

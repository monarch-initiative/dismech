- name: Impaired Mitochondrial RNA Import
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A subset of nuclear-encoded RNAs has to reach the mitochondrial matrix for
    the organelle's genome to be replicated and transcribed, and PNPase is one of
    very few known components of that import route in mammals. The DFNB70 allele
    impairs it. How much of the hearing phenotype this branch carries, as against
    the degradation branch below, has not been separated experimentally.
  biological_processes:
  - preferred_term: RNA import into mitochondrion
    modifier: DECREASED
    term:
      id: GO:0035927
      label: RNA import into mitochondrion
  downstream:

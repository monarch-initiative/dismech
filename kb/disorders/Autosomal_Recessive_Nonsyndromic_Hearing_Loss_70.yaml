    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro analyses in bacteria, yeast, and mammalian cells showed that the identified mutation results in a hypofunctional protein leading to disturbed PNPase trimerization and impaired mitochondrial RNA import."
    explanation: The import defect attributed specifically to the deafness allele.
  - reference: PMID:23084290
    reference_title: "A mutation in PNPT1, encoding mitochondrial-RNA-import protein PNPase, causes hereditary hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A subset of nuclear-encoded RNAs has to be imported into mitochondria for the proper replication and transcription of the mitochondrial genome and, hence, for proper mitochondrial function."
    explanation: >-
      Why an import defect matters downstream at all. BACKGROUND because it is the
      paper's opening statement of established cell biology rather than a result of
      this study.
- name: Impaired Mitochondrial RNA Degradation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PNPase is a 3'-5' phosphorolytic exonuclease and, with SUV3, forms the
    mitochondrial degradosome that clears and processes mitochondrial
    transcripts. The DFNB70 allele E475G was strongly impaired at degrading a
    model RNA substrate in vitro, alongside the COXPD13 allele Q387R. This
    branch is included because it is measured, not because it has been shown to
    be the one that deafens: the same comparative study found that catalytic
    impairment does not track disease severity across PNPT1 alleles.

        label: corticosteroid
  target_mechanisms:
  - target: Nephrotic Syndrome
    description: Steroid-resistant disease; steroids worsened the zebrafish model.
    evidence:
    - reference: PMID:31010479
      reference_title: Corticosteroid treatment exacerbates nephrotic syndrome in a zebrafish model of magi2a knockout.
      supports: REFUTE

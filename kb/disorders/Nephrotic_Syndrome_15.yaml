    Overexpression of wild-type MAGI2, but not the patient variants, increases active RhoA, and knockdown of MAGI2
    reduces the podocyte migration rate, an established intermediate phenotype of monogenic SRNS.
  cell_types:
  - preferred_term: podocyte

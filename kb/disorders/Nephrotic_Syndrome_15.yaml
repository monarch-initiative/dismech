name: Nephrotic Syndrome 15
description: >-
  Autosomal recessive steroid-resistant nephrotic syndrome caused by biallelic loss-of-function variants in MAGI2,
  which encodes membrane-associated guanylate kinase, WW and PDZ domain-containing 2 (also called S-SCAM), a MAGUK
  scaffold protein expressed in podocytes. MAGI2 tethers nephrin and Neph1 at the slit diaphragm, links the slit
  diaphragm to the actin cytoskeleton, and nucleates a RapGEF2-Rap1 signaling node that maintains podocyte actin
  organization. Loss of MAGI2 disrupts the slit diaphragm and the podocyte actin cytoskeleton, causing foot process
  effacement, podocyte injury and loss, and glomerular filtration barrier failure with early-onset proteinuria and
  nephrotic syndrome. Reported patients presented in infancy or early childhood with severe, steroid-resistant
  disease; histology ranged from minimal change to focal segmental glomerulosclerosis. Progression to kidney
  failure is established in the podocyte-specific Magi2 knockout mouse, and HPOA records stage 5 chronic kidney
  disease in one of the three probands of the founding cohort, but no accessible source states the long-term
  human course for MAGI2 patients directly. The
  neurologic involvement reported in some patients is variable rather than defining a separate subtype, consistent
  with GeneReviews listing MAGI2 steroid-resistant nephrotic syndrome as plus or minus neurologic impairment under a
  single OMIM number.

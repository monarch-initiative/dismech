genetic:
- name: MAGI2
  gene_term:
    preferred_term: MAGI2
    term:
      id: hgnc:18957
      label: MAGI2
  relationship_type: CAUSATIVE
  notes: >-
    MAGI2 is MONDO's and OMIM's causal gene for nephrotic syndrome 15 (OMIM 617609). Biallelic loss-of-function
    variants were reported in two independent studies. ClinGen has no gene-disease validity classification for MAGI2
    in nephrotic syndrome; its only MAGI2 assertion is a Refuted classification for an unrelated epilepsy entity
    (MONDO:0005027), which does not apply here.
  variants:
  - name: p.Gly39*
    description: >-
      Homozygous nonsense variant in a patient of Arab descent with SRNS and neurologic impairment; abolishes the
      MAGI2 interactions with TNS2 and DLC1 in vitro.
    evidence:
    - reference: PMID:29773874
      reference_title: Mutations in six nephrosis genes delineate a pathogenic pathway amenable to treatment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified homozygous truncating mutations in the MAGI2 gene (p.Gly39* and p.Tyr746*) in two individuals
        with SRNS and neurologic impairment
      explanation: One of the two founding homozygous truncating alleles.
  - name: p.Tyr746*
    description: >-
      Homozygous nonsense variant resulting from maternal isodisomy for chromosome 7, in a second patient with SRNS
      and neurologic impairment.
    evidence:
    - reference: PMID:29773874
      reference_title: Mutations in six nephrosis genes delineate a pathogenic pathway amenable to treatment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        p.Tyr746* was due to maternal isodisomy for chromosome 7.
      explanation: The second homozygous truncating allele, arising by uniparental isodisomy.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function MAGI2 variants cause the disease; all reported
    families are consistent with autosomal recessive inheritance.
  evidence:
  - reference: PMID:27932480
    reference_title: MAGI2 Mutations Cause Congenital Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two siblings shared the same homozygous frameshift mutation, whereas one individual with sporadic SRNS exhibited
      compound heterozygosity
    explanation: Homozygous and compound heterozygous biallelic genotypes, consistent with recessive inheritance.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Genetic testing is the definitive diagnostic step: both founding reports identified MAGI2 by sequencing, one by
    whole-exome sequencing of a phenotyped steroid-resistant cohort and one by sequencing all MAGI2 exons in 400
    patients with nephrotic syndrome. MAGI2 is a rare gene, so a nephrotic-syndrome panel should be checked for its
    inclusion before a negative panel is treated as excluding the diagnosis. Establishing the genetic diagnosis also
    changes management, because monogenic steroid-resistant nephrotic syndrome responds poorly to intensified
    immunosuppression and does not recur after transplantation.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27932480
    reference_title: MAGI2 Mutations Cause Congenital Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified novel disease-causing mutations in membrane-associated guanylate kinase, WW, and PDZ
      domain-containing 2 (MAGI2) through whole-exome sequencing of a deeply phenotyped cohort of patients with
      congenital, childhood-onset SRNS
    explanation: Whole-exome sequencing is the route by which the founding report made the diagnosis.
  - reference: PMID:29773874
    reference_title: Mutations in six nephrosis genes delineate a pathogenic pathway amenable to treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced all MAGI2 exons in 400 patients with NS.
    explanation: Targeted exon sequencing of MAGI2 in a nephrotic-syndrome cohort as the second diagnostic route.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK573219/
    reference_title: Genetic Steroid-Resistant Nephrotic Syndrome Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Some panels may not include newly discovered and/or rare genes associated with genetic SRNS.
    explanation: >-
      MAGI2 is exactly such a rare gene, so panel content has to be checked rather than assumed.
- name: Kidney biopsy with MAGI2 immunohistochemistry
  description: >-
    Biopsy shows the podocyte lesion rather than its cause: minimal change in some patients and focal segmental
    glomerulosclerosis in others, with foot process effacement on electron microscopy in the animal models.
    Immunohistochemistry for MAGI2 on the biopsy is the one biopsy finding specific to this disease, showing absent
    or diminished podocyte MAGI2. It supports a candidate variant but does not replace sequencing.
  diagnosis_term:
    preferred_term: kidney biopsy
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
  evidence:
  - reference: PMID:27932480
    reference_title: MAGI2 Mutations Cause Congenital Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry in kidney sections from these patients revealed that mutations resulted in lack of or
      diminished podocyte MAGI2 expression.
    explanation: Loss of podocyte MAGI2 staining on patient biopsy sections is the disease-specific biopsy finding.
  - reference: PMID:29773874
    reference_title: Mutations in six nephrosis genes delineate a pathogenic pathway amenable to treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal histology of individual A5146-21 with focal segmental glomerulosclerosis (FSGS) and MAGI2 mutation
    explanation: Biopsy histology in a MAGI2 patient; the lesion is not specific to the gene.
treatments:
- name: Corticosteroid Therapy
  description: >-
    The disease is steroid resistant by definition. In the magi2a zebrafish model, corticosteroid treatment
    paradoxically worsened the nephrotic phenotype with earlier edema onset, so steroids are not expected to help and
    may be harmful.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Nephrotic Syndrome
    description: Steroid-resistant disease; steroids worsened the zebrafish model.
    evidence:
    - reference: PMID:31010479
      reference_title: Corticosteroid treatment exacerbates nephrotic syndrome in a zebrafish model of magi2a knockout.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        corticosteroid treatment exacerbated the phenotype, with earlier onset of edema
      explanation: Refutes a beneficial steroid effect; steroids worsened the model.
    - reference: PMID:29773874
      reference_title: Mutations in six nephrosis genes delineate a pathogenic pathway amenable to treatment.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: >-
        no treatment effect of dexamethasone (<100 µM) was seen on RhoA activation via knockdown of MAGI2
      explanation: >-
        Dexamethasone reversed the RhoA defect caused by knockdown of CDK20 but not of MAGI2, so the
        steroid-responsive arm of this gene module does not extend to MAGI2.
- name: Calcineurin Inhibitor Therapy
  description: >-
    Calcineurin inhibitors are a standard empirical option in steroid-resistant nephrotic syndrome, but in the magi2a
    zebrafish model neither cyclosporine A nor tacrolimus altered the phenotype, so efficacy specific to MAGI2 disease
    is not established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciclosporin
      term:
        id: CHEBI:4031
        label: cyclosporin A
    - preferred_term: tacrolimus
      term:
        id: CHEBI:61049
        label: tacrolimus (anhydrous)
  target_mechanisms:
  - target: Glomerular Filtration Barrier Failure
    description: No effect in the magi2a zebrafish model.
    evidence:
    - reference: PMID:31010479
      reference_title: Corticosteroid treatment exacerbates nephrotic syndrome in a zebrafish model of magi2a knockout.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        treatment with cyclosporine A or tacrolimus had no significant effect
      explanation: Refutes a calcineurin-inhibitor effect in the MAGI2 model.
    - reference: PMID:32317330
      reference_title: >-
        Response to First Course of Intensified Immunosuppression in Genetically Stratified Steroid Resistant
        Nephrotic Syndrome.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with monogenic steroid-resistant nephrotic syndrome had a poor therapeutic response and no
        post-transplant recurrence.
      explanation: >-
        Human evidence against intensified immunosuppression, of which calcineurin inhibitors are a component. The
        cohort is monogenic steroid-resistant nephrotic syndrome as a class rather than MAGI2 specifically, so the
        finding is applied to this disease as a member of that class.
- name: Kidney Transplantation
  description: >-
    Kidney transplantation is the definitive treatment once kidney failure is reached. The finding that makes it
    the main actionable statement here is that monogenic steroid-resistant nephrotic syndrome does not recur in the
    graft, unlike genetic-testing-negative non-responders, in whom recurrence was 73 percent. That finding is for
    monogenic steroid-resistant nephrotic syndrome as a class, not for MAGI2 in particular; no transplanted MAGI2
    patient has been reported. Establishing the molecular diagnosis is therefore what carries the prognostic
    information.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Kidney Failure
    treatment_effect: BYPASSES
    description: >-
      Replaces excretory function. It does not correct the MAGI2 defect, but because the podocyte lesion is
      intrinsic to the recipient's own genotype rather than circulating, the donor kidney is not re-injured.
    evidence:
    - reference: PMID:32317330
      reference_title: >-
        Response to First Course of Intensified Immunosuppression in Genetically Stratified Steroid Resistant
        Nephrotic Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A total of 4% of patients with monogenic disease showed complete response, compared with 25% of
        genetic-testing-negative patients (P=0.02). None of the former recurred post-transplantation.
      explanation: >-
        No post-transplant recurrence in the monogenic arm of a genetically stratified steroid-resistant nephrotic
        syndrome cohort. Applies to monogenic steroid-resistant nephrotic syndrome as a class.
  evidence:
  - reference: PMID:32317330
    reference_title: >-
      Response to First Course of Intensified Immunosuppression in Genetically Stratified Steroid Resistant
      Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In genetic-testing-negative patients, 97% with complete response to first intensified immunosuppression did
      not progress, whereas 44% of nonresponders developed kidney failure with 73% recurrence post-transplant.
    explanation: >-
      The contrast that makes the monogenic result informative: recurrence is common in genetic-testing-negative
      non-responders and absent in the monogenic group.
- name: MAGI2 Gene Replacement (preclinical)
  description: >-
    Not a treatment for this disease, and recorded as an emerging direction only. AAV-delivered MAGI2 protected
    podocytes from apoptosis and improved renal function, but the model was diabetic kidney disease, in which MAGI2
    is acquiredly downregulated rather than mutated, and the animals carried two wild-type MAGI2 alleles. Whether
    restoring MAGI2 helps a patient with biallelic truncating variants is untested, and no MAGI2 gene-therapy study
    in a MAGI2-mutant model has been reported.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic MAGI2 Loss of Function
    description: >-
      Restoring MAGI2 expression addresses the initiating lesion in principle. The cited rescue was of acquired
      MAGI2 downregulation, not of a germline loss-of-function genotype.
    evidence:
    - reference: PMID:37950637
      reference_title: >-
        MAGI2 ameliorates podocyte apoptosis of diabetic kidney disease through communication with
        TGF-β-Smad3/nephrin pathway.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we found enforced expression of MAGI2 via AAV transduction protected podocytes from apoptosis, with
        concomitant improvement of renal functions
      explanation: >-
        Shows that AAV-delivered MAGI2 can rescue podocytes in vivo. The disease context is diabetic kidney disease
        with intact MAGI2 alleles, so transfer to germline MAGI2 deficiency is an inference.
animal_models:
- name: Magi2 constitutive knockout mouse
  species: Mouse
  genotype: Magi-2-/- (constitutive null)
  publication: PMID:25271328
  description: >-
    Constitutive Magi-2 null mice develop progressive proteinuria from 2 weeks of age with loss of glomerular nephrin,
    diffuse foot process effacement and progressive podocyte loss, and die of renal failure by 3 months.
  modeled_mechanisms:
  - target: Glomerular Filtration Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Proteinuria, nephrin loss and foot process effacement recapitulate the human barrier failure.
    limitations: >-
      A constitutive whole-body null rather than the biallelic point mutations seen in patients, and the murine course
      differs in tempo from the human congenital disease.
    evidence:
    - reference: PMID:25271328
      reference_title: MAGI-2 scaffold protein is critical for kidney barrier function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Magi-2 null mice presented with progressive proteinuria as early as 2 wk postnatally, which coincided with
        loss of nephrin expression in the glomeruli
      explanation: The knockout recapitulates proteinuria with nephrin loss.
- name: Podocyte-specific MAGI-2 knockout mouse
  species: Mouse
  genotype: Podocyte-specific MAGI-2 conditional knockout
  publication: PMID:28539383
  description: >-
    Podocyte-specific MAGI-2 deletion causes slit diaphragm disruption, foot process abnormalities and podocyte
    apoptosis with dendrin nuclear translocation, massive albuminuria by 8 weeks and focal segmental
    glomerulosclerosis.
  modeled_mechanisms:
  - target: Dendrin Nuclear Translocation and Podocyte Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Isolates the podocyte-intrinsic consequence of MAGI-2 loss, including the dendrin apoptosis pathway.
    limitations: >-
      Mouse conditional knockout; the dendrin nuclear-translocation mechanism has not been confirmed in patient
      tissue.
    evidence:
    - reference: PMID:28539383
      reference_title: >-
        Glomerulosclerosis Induced by Deficiency of Membrane-Associated Guanylate Kinase Inverted 2 in Kidney
        Podocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        podocytes from MAGI-2-KO mice exhibited SD disruption, morphologic abnormalities of foot processes, and
        podocyte apoptosis leading to podocyte loss
      explanation: The podocyte-specific knockout reproduces the injury and loss.
- name: magi2a zebrafish knockout
  species: Zebrafish
  genotype: magi2a-/- (CRISPR/Cas9)
  publication: PMID:31010479
  description: >-
    The magi2a knockout zebrafish develops ascites, periorbital edema, proteinuria and foot process effacement, with
    earlier onset for truncating than hypomorphic alleles; corticosteroids worsened the phenotype while calcineurin
    inhibitors had no effect.
  modeled_mechanisms:
  - target: Podocyte Foot Process Effacement and Slit Diaphragm Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the proteinuric phenotype with foot process effacement and an allele-strength gradient.
    limitations: >-
      Zebrafish ortholog; magi2b knockout gave no phenotype, and the drug responses are model observations not yet
      confirmed in patients.
    evidence:
    - reference: PMID:31010479
      reference_title: Corticosteroid treatment exacerbates nephrotic syndrome in a zebrafish model of magi2a knockout.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As in human SRNS, we observed genotype/phenotype correlation, with edema onset occurring earlier in zebrafish
        with truncating alleles (5-6 days post fertilization) versus hypomorphic alleles (19-20 days post
        fertilization).
      explanation: Allele-strength genotype-phenotype correlation parallels the human disease.
notes: >-
  Lump/split: curated as a single DISEASE. MONDO:0033262 (OMIM 617609) is a single-gene autosomal recessive disorder
  caused by biallelic MAGI2 loss of function. The neurologic involvement is treated as variable expression rather
  than a distinct subtype because it is present in some reported patients and absent in others under one OMIM
  number: the founding cohort describes renal disease without neurologic features, while the two patients with
  homozygous truncating variants had neurologic impairment. The GeneReviews syndromic-SRNS gene table lists MAGI2
  the same way, but that table is only in the chapter HTML and no clean sentence can be quoted from it, so this is
  recorded as reasoning from the primary reports rather than as a GeneReviews quote. The name is the MONDO/OMIM
  numbered-series label; no established MAGI2-dyadic name supersedes it, and MAGI2-related synonyms are kept in
  synonyms. No GeneReviews chapter is specific to MAGI2; the Genetic Steroid-Resistant Nephrotic Syndrome Overview
  (PMID:34436835, NBK573219) covers it as one gene in that table and is tagged as the baseline.


  Steroid responsiveness: Ashraf 2018 groups MAGI2 with five other genes in a module it labels partially
  treatment-sensitive nephrotic syndrome, while describing the two MAGI2 patients themselves as steroid resistant,
  and its own experiments found dexamethasone reversed the RhoA defect from CDK20 knockdown but not from MAGI2
  knockdown. The disease is curated as steroid resistant, which is what every MAGI2 patient report and the OMIM
  phenotype series state; the module label is a property of the gene cluster, not a claim that MAGI2 patients
  respond to steroids.


  Phenotypes not curated for want of a quotable source. HPOA annotates hypoalbuminemia in all three probands and
  stage 5 chronic kidney disease in one of three for OMIM 617609, both from PMID:27932480, but those values sit in
  a patient table in the full text; PMC5407720 is not open access, a forced re-fetch does not upgrade the cached
  record past the abstract, and no cached reference anywhere states serum albumin in a MAGI2 patient. Hypoalbuminemia
  is therefore left out rather than bound to a general SRNS background sentence, and kidney failure is carried on
  mouse evidence plus an indirect human inference, with its limits stated on the phenotype. Hyperlipidemia is
  omitted for the same reason. The specific neurologic features are likewise not curated: the reports say only
  neurologic impairment or involvement, and Ashraf's Supplementary Table 1 is not accessible, so the binding stays
  at HP:0012759 rather than naming features the sources do not.

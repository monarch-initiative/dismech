  notes: >-
    Two founding human reports: three patients in two families with congenital/childhood-onset SRNS and absent or
    diminished podocyte MAGI2 (Bierzynska 2017), and two further patients with SRNS and neurologic impairment carrying
    homozygous truncating MAGI2 variants (Ashraf 2018). A handful of additional cases appear in later cohorts.
  evidence:
  - reference: PMID:27932480
    reference_title: MAGI2 Mutations Cause Congenital Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected two unique frameshift mutations and one duplication in three patients (two families)
    explanation: Size of the founding human case series.
pathophysiology:
- name: Biallelic MAGI2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous loss-of-function MAGI2 variants (two frameshifts and a stop-codon read-through
    duplication in the first report; homozygous p.Gly39* and p.Tyr746* truncations in the second) are the initiating
    lesion. Patient kidney sections show absent or diminished podocyte MAGI2 expression, consistent with loss of
    function.

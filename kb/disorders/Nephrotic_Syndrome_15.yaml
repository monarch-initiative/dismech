    explanation: Patient tissue confirms loss of the protein, consistent with a loss-of-function mechanism.
  downstream:
  - target: Loss of Slit Diaphragm Scaffolding and Nephrin/Neph1 Localization
    causal_link_type: DIRECT
    description: >-
      MAGI2 is a slit diaphragm scaffold that binds nephrin and, via its PDZ domains, positions nephrin and Neph1 at
      the podocyte intercellular junction.
    evidence:
    - reference: PMID:33144214
      reference_title: MAGI-2 orchestrates the localization of backbone proteins in the slit diaphragm of podocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Podocyte-specific deficiency of MAGI-2 in mice abrogated localization of Nephrin and Neph1 independently of
        other scaffold proteins.
      explanation: Loss of MAGI-2 directly abolishes correct nephrin and Neph1 localization.
  - target: Loss of MAGI2-RapGEF2-Rap1 Signaling
    causal_link_type: DIRECT
    description: >-
      MAGI2 forms a complex with the Rap1 guanine nucleotide exchange factor RapGEF2; patient CNS variants lose this
      complex and fail to activate the podocyte Rap1 node.
    evidence:
    - reference: PMID:31171376
      reference_title: >-
        Disruption of MAGI2-RapGEF2-Rap1 signaling contributes to podocyte dysfunction in congenital nephrotic
        syndrome caused by mutations in MAGI2.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        MAGI2 forms a complex with the Rap1 guanine nucleotide exchange factor, RapGEF2, and that this complex is lost
        when expressing MAGI2 CNS variants.
      explanation: The patient variants abolish the MAGI2-RapGEF2 complex that drives Rap1 activation.

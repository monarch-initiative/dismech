discussions:
- discussion_id: cox16-copper-response
  prompt: Why does copper rescue engineered COX16 knockout cells but not the tested patient fibroblasts?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  rationale: Model-dependent residual function and assembly context may determine response. COX16 may organize SCO1 recruitment rather than directly supply copper, so increasing copper availability need not bypass its absence. In later engineered-cell experiments, SCO1/SCO2 thiol-trapping patterns remained compatible with oxidized or copper-bound cysteines in COX16 knockout cells. The assay does not distinguish those two states, so it does not directly quantify copper loading or prove a uniform copper shortage.
  evidence:
  - *id022
  - *id024
  - *id001
  - reference: PMID:35750769
    reference_title: Coordination of metal center biogenesis in human cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Each protein can have the two key cysteines forming a disulfide, binding Cu, or reduced and Cu-free. In reverse thiol trapping assays, the first two scenarios would result in the addition of two AMS molecules and none in the latter scenario
    explanation: The assay pools oxidized and copper-bound states and cannot distinguish them.
  - reference: PMID:35750769
    reference_title: Coordination of metal center biogenesis in human cytochrome c oxidase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In WT HEK293T and COX11-KO cells, 75% of SCO2 bound 2 AMS but increased to 100% in COX16-KO cells
    explanation: The COX16-knockout SCO2 readout differs from a reduced copper-free state; it is not direct copper quantification.
- discussion_id: cox16-clinical-spectrum
  prompt: How broad is the clinical spectrum beyond the founding Arg82Ter families?
  kind: OPEN_QUESTION
  status: OPEN
  rationale: The same homozygous variant produced markedly different durations of survival. ClinGen classified the gene-disease relationship as Moderate in August 2025 because independent human genetic replication was limited, despite substantial functional evidence. The small clinical dataset does not support population frequencies, penetrance or a universal survival expectation.
  evidence:
  - reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She was palliated with morphine and died almost 7 months old.
    explanation: The clinical course is not uniformly fatal in the neonatal period.
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_ea62fb70-3963-4bb4-a7c0-2340cb794f58-2025-08-11T040000.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: OTHER
    snippet: there have not yet been two independent scored publications documenting human genetic evidence over at least 3 years. Therefore, the classification comes to Moderate.
    explanation: The dated ClinGen curation explicitly explains the Moderate classification by limited independent human genetic replication.
    quote_role: REVIEW_SYNTHESIS

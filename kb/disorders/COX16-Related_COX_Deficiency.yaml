inheritance:
- name: Autosomal recessive
  description: The founding patients were homozygous for Arg82Ter, with both parents in each family heterozygous. If both parents carry the familial pathogenic variant, each pregnancy has a 25% affected, 50% carrier and 25% unaffected noncarrier probability.
  evidence:
  - reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Segregation analysis revealed that the parents of both patients were heterozygous for the identified COX16 variant.
    explanation: Parental segregation supports autosomal recessive inheritance.
  - &id021
    reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1224/
    reference_title: Primary Mitochondrial Disorders Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be ... heterozygous ... for a causative ... pathogenic variant ... each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic ... carrier ... and a 25% chance of being unaffected and not a carrier.
    explanation: General recessive counseling applies when the familial variant and parental carrier states are established.
    quote_role: REVIEW_SYNTHESIS
genetic:
- name: COX16 loss-of-function variants
  gene_term: *id010
  features: The founding report identifies homozygous NM_016468.6:c.244C>T (p.Arg82Ter), a premature stop in exon 4, in two unrelated families. Loss of detectable protein and cellular rescue support loss of function. The small clinical literature does not establish a general genotype-prognosis relationship or population prevalence.
  variants:
  - name: COX16 c.244C>T (p.Arg82Ter)
    gene: *id010
    description: Homozygous nonsense variant in the founding families. Patient fibroblasts lacked detectable COX16 and showed a severe assembly defect; wild-type complementation restored complex IV activity.
    evidence:
    - reference: PMID:33169484
      reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'To identify the genetic cause of the complex IV deficiency we performed WES and detected a homozygous variant in the gene encoding the complex IV assembly factor COX16 in both patients: Chr14(GRCh37): g.70793127G>A; NM_016468.6: c.244C>T p.(Arg82*).'
      explanation: The report specifies the transcript and variant.
    - *id003
    - *id011
  evidence:
  - reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It creates a premature stop codon in exon 4.
    explanation: The reported variant is protein truncating.
  - reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Segregation analysis revealed that the parents of both patients were heterozygous for the identified COX16 variant.
    explanation: Independent family segregation supports recessive inheritance.
  notes: ClinGen assigned Moderate validity in August 2025 under the broader MONDO:0044970 primary mitochondrial disease concept. That source concept differs from the MC4DN22 binding MONDO:0859160 used here. The classification is discussed as supporting context rather than copied into a formal gene_disease_validity assertion for this disease identifier.
progression:
- phase: Neonatal presentation and variable infantile course
  notes: Both founding cases developed neonatal metabolic disease. One died at 55 hours after withdrawal of care. The other was discharged after initial stabilization, developed progressive hypertrophic cardiac disease and feeding problems, and died almost seven months old. These observations are case histories, not a population survival estimate.
  evidence:
  - reference: PMID:33169484

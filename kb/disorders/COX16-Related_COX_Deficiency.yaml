name: COX16-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-23T00:00:00Z'
synonyms:
- COX16 deficiency
- Mitochondrial complex IV deficiency, nuclear type 22
- MC4DN22
- COX16-related cytochrome c oxidase deficiency
disease_term:
  preferred_term: COX16-related COX deficiency (MC4DN22)
  term:
    id: MONDO:0859160
    label: mitochondrial complex IV deficiency, nuclear type 22
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
description: 'COX16-related complex IV deficiency is an autosomal recessive mitochondrial disorder associated with loss of the COX16 assembly factor. COX16 assists SCO1 recruitment to newly synthesized COX2 and subsequent joining of the COX2 and COX1 assembly modules. Deficiency reduces COX2 stability, mature complex IV and respiratory capacity. The founding report described neonatal metabolic disease with different subsequent courses: death in the first days of life or progressive cardiac disease with survival into infancy. Clinical evidence remains limited, while patient-cell complementation and engineered-cell studies support the molecular mechanism. Copper rescue in engineered cells did not reproduce in the tested patient fibroblasts.'
pathophysiology:
- name: COX16 Protein Deficiency
  description: The homozygous Arg82Ter variant is associated with loss of detectable COX16 protein in patient fibroblasts. COX16 is an inner-mitochondrial-membrane assembly factor with its C-terminus facing the intermembrane space.
  evidence:
  - &id003
    reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: undetectable levels of the COX16 protein and the COX2 subunit of complex IV, and reduced expression levels of the complex IV subunits COX1, COX4, and COX5As
    explanation: Patient-fibroblast immunoblots show loss of detectable COX16 and altered complex IV subunits.
  - reference: PMID:29381136
    reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cox16 is an inner mitochondrial membrane protein with its C-terminus facing the intermembrane space (IMS).
    explanation: Protease protection and carbonate extraction establish localization.
  - reference: PMID:29381136
    reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: human COX16 functions to stabilize the interaction between SCO1 and newly synthesized COX2.
    explanation: The human-cell experiments support COX16-dependent protein recruitment as its molecular activity in the assembly pathway.
  genes:
  - &id010
    preferred_term: COX16
    term:
      id: hgnc:20213
      label: COX16
  molecular_functions:
  - preferred_term: COX16-mediated protein recruitment during complex IV assembly
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
    description: COX16 stabilizes the association of SCO1 with newly synthesized COX2; the adaptor binding represents this protein-recruitment role, not direct copper transport.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired SCO1 Recruitment to COX2
    description: Loss of COX16 reduces recruitment of SCO1 to newly synthesized COX2.
    causal_link_type: DIRECT
    evidence:
    - &id001
      reference: PMID:29381136
      reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: only the association of SCO1 with newly synthesized COX2 was affected in the absence of COX16
      explanation: Pulse-labeling and immunoisolation identify a selective SCO1-recruitment defect; this is not proof that COX16 directly transports copper.
  - target: COX2 Instability
    description: Loss of COX16 destabilizes newly synthesized COX2.
    causal_link_type: DIRECT
    evidence:
    - &id002
      reference: PMID:29381136
      reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: COX2 showed a marked reduction in stability in the absence of COX16
      explanation: Pulse-chase experiments show instability of newly synthesized COX2.
  - target: Defective COX1-COX2 Module Joining
    description: COX16 loss impairs association of COX2 with the COX1 assembly module.
    causal_link_type: DIRECT
    evidence:
    - &id004
      reference: PMID:29381136
      reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: COX2-association with MITRAC12 or C12ORF62 was drastically affected by the absence of COX16
      explanation: Immunoisolation supports failure to join COX2 to COX1-containing assembly intermediates.
- name: Impaired SCO1 Recruitment to COX2
  description: COX16-deficient engineered cells show reduced association of SCO1 with newly synthesized COX2, implicating a defect in CuA-site maturation. SCO2 association is preserved. Direct copper transport by COX16 is not demonstrated.
  evidence:
  - *id001
  - reference: PMID:29381136
    reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The binding of other COX2 chaperones such as SCO2, COA6, and FAM36A was unaffected by the absence of COX16.
    explanation: The pulse-labeled COX2 assay discriminates the SCO1 defect from generalized loss of chaperone recruitment.
  biological_scale: MOLECULAR
  downstream:
  - target: Reduced Complex IV Assembly
    description: Defective metallochaperone recruitment limits COX2 maturation and downstream assembly.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29381136
      reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: COX16 facilitates the association of SCO1 and thus probably leads to proper COX2 maturation.
      explanation: The authors interpret SCO1 recruitment as a maturation step; intermediary CuA chemistry is not directly measured.
- name: COX2 Instability
  description: Newly synthesized COX2 turns over more rapidly in COX16-knockout cells, despite preserved mitochondrial translation. Patient fibroblasts also show markedly reduced COX2 protein.
  evidence:
  - *id002
  - *id003
  - reference: PMID:29381136
    reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: no significant differences were observed in the synthesis of either COX1, COX2, or any other protein
    explanation: Pulse labeling argues against a generalized mitochondrial translation defect in the engineered cells.
  biological_scale: MOLECULAR
  downstream:
  - target: Reduced Complex IV Assembly
    description: Reduced availability of stable COX2 limits incorporation into mature complex IV.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29381136
      reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These analyses revealed a notable reduction of newly synthesized COX2 in mature cytochrome c oxidase
      explanation: Labeled-subunit assembly analysis shows reduced incorporation of COX2.
- name: Defective COX1-COX2 Module Joining
  description: COX16 promotes association of the COX2 module with COX1-containing MITRAC intermediates. Its absence leaves COX1 accumulated in subassemblies. Human COX16 is a transient assembly factor rather than a constitutive component of mature respiratory supercomplexes.
  evidence:
  - *id004
  - reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed an accumulation of COX1 in the mitochondrial translation regulation assembly intermediate of cytochrome c oxidase in the patient cell line transduced with GFP
    explanation: Patient-fibroblast assembly intermediates support the module-joining defect.
  - reference: PMID:29381136
    reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: COX16 does not act on respiratory chain supercomplexes
    explanation: The human-cell study found COX16 in assembly intermediates rather than mature supercomplexes.
  biological_scale: MOLECULAR
  downstream:
  - target: Reduced Complex IV Assembly
    description: Failure to merge the modules limits formation of mature cytochrome c oxidase.
    causal_link_type: DIRECT
    evidence:
    - *id004
- name: Reduced Complex IV Assembly
  description: Mature complex IV is markedly reduced. It was undetectable by blue-native immunoblot in the tested patient fibroblasts, while engineered knockout cells retained substantial enzyme abundance and activity. Other respiratory complexes were relatively preserved in the patient investigations.
  evidence:
  - reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: an absence of the fully assembled complex IV with normal expression levels of the other OXPHOS complexes
    explanation: Blue-native immunoblotting of Subject 1 fibroblasts shows a severe, selective assembly defect; undetectable bands do not imply zero enzymatic activity.
  - reference: PMID:29381136
    reference_title: COX16 promotes COX2 metallation and assembly during respiratory complex IV biogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the cytochrome c oxidase amount was reduced to ∼50% compared to the wild type control
    explanation: Engineered cells retain substantial enzyme; the severity of the assembly defect depends on the experimental system.
  - &id011
    reference: PMID:33169484
    reference_title: A novel variant in COX16 causes cytochrome c oxidase deficiency, severe fatal neonatal lactic acidosis, encephalopathy, cardiomyopathy, and liver dysfunction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Activity measurements of the RC enzymes showed a complete rescue of complex IV activity in cells transduced with the wt‐COX16 construct compared to the GFP‐transduced patient cell lines.
    explanation: Wild-type COX16 complementation rescues the cellular enzyme defect, supporting variant causality.

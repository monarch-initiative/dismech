- name: Reduced Respiratory Capacity
  description: Complex IV deficiency reduces mitochondrial respiration. Residual activity differs between tissues and models; neither absent total oxidative ATP production nor universal collapse of ATP synthesis was demonstrated. Cardiac, neurological, hepatic and metabolic manifestations accompany the respiratory defect.

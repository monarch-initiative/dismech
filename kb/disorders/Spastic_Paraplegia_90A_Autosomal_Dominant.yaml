      label: Autosomal dominant inheritance
  description: >-
    SPG90A is the monoallelic (heterozygous) pole of SPTSSA-related spastic
    paraplegia. The published SPG90 patients carry either monoallelic or
    biallelic SPTSSA variants; the monoallelic cases — including both reported
    carriers of the recurrent p.Thr51Ile allele and the fourth patient — define
    this dominant entity, while the biallelic cases belong to the separate
    recessive concept SPG90B.
  evidence:
  - reference: PMID:40533086
    reference_title: "Identifying the Fourth Patient With Spastic Paraplegia 90, Extending the Phenotype Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spastic paraplegia 90 (SPG90; OMIM #620416, 620417) is a rare neurologic disease caused by monoallelic or biallelic variants in the serine palmitoyltransferase small subunit A (SPTSSA) gene."
    explanation: >-
      Establishes that SPG90 comprises a monoallelic and a biallelic pole with
      distinct OMIM numbers, which is the basis for scoping this entry to the
      dominant (#620416) concept.
  - reference: PMID:40533086
    reference_title: "Identifying the Fourth Patient With Spastic Paraplegia 90, Extending the Phenotype Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed a heterozygous pathogenic variant (p.Thr51Ile), which was detected in two of the reported patients, suggesting a recurrent variant in this syndrome."
    explanation: >-
      Documents a heterozygous (monoallelic) pathogenic allele recurring across
      independent patients, supporting dominant action of the p.Thr51Ile variant.
pathophysiology:
- name: SPTSSA Activating Missense Variant
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  description: >-
    SPTSSA encodes the small subunit A of serine palmitoyltransferase. It carries
    no catalytic centre of its own — the pyridoxal-phosphate active site sits in
    the SPTLC1/SPTLC2 heterodimer — but it coordinates the acyl-CoA substrate and
    thereby both stimulates SPT activity and sets its substrate selectivity.
    The disease alleles are missense changes affecting the transmembrane face of
    the subunit, and they act by activating (de-restraining) the enzyme rather
    than by abolishing it. This node is the disorder-specific instance of the
    module's lipid-metabolism route to long-axon maintenance failure.
  genes:
  - preferred_term: SPTSSA
    term:
      id: hgnc:20361
      label: SPTSSA
  genetic_context:
    gene:
      preferred_term: SPTSSA
      term:
        id: hgnc:20361
        label: SPTSSA
    allele_type: missense
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      The recurrent SPG90A allele is the heterozygous missense change p.Thr51Ile.
      It was found in two of the founding three patients and again in the fourth,
      so it accounts for three of the four published SPG90 patients. The
      remaining founding patient carries the other of the two variants reported
      in that series; the cached abstracts do not state whether that patient is
      monoallelic or biallelic, so this entry does not assert which pole they
      belong to and therefore does not claim a denominator restricted to SPG90A.
      It is recorded as GAIN_OF_FUNCTION at the variant level because the review
      literature calls the SPTSSA disease variants activating and because the
      measured consequence is escape from ORMDL restraint rather than loss of
      enzyme output. This is a claim about the VARIANT's consequence and is a
      different assertion from the pathway-activity `modifier` values on the
      downstream ORMDL node, which describe the state of the process regardless
      of cause.
    notes: >-
      `variant_origin` is deliberately left unset. Deep-research output described
      SPG90A as "de novo-dominant", but the phrase "de novo" appears in none of
      the three cached sources this entry relies on for the genetics
      (PMID:40533086, PMID:36718090, PMID:38788085), so parental testing status
      is not curated either way.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This syndrome is characterized by neurodevelopmental delay, sensorineural hearing loss, progressive motor impairment, and lower extremity spasticity."
      explanation: >-
        Names neurodevelopmental delay as a defining feature of the syndrome.
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

- name: Broader CNS Neurodevelopmental and Neurodegenerative Involvement
  biological_scale: ORGANISM
  role: consequence
  description: >-
    What makes SPG90A a complicated rather than a pure HSP is involvement beyond
    the corticospinal tract: neurodevelopmental delay from early life, variable
    sensorineural hearing loss, and language/cognitive dysfunction with
    progressive cognitive decline. The review literature on SPT-related disease
    describes this class as showing selective upper-motor-neuron involvement
    together with more broad CNS neurodegeneration. Whether the developmental and
    the degenerative components are one process or two is not resolved.
  evidence:
  - reference: PMID:36718090
    reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two different pathogenic variants in SPTSSA caused a hereditary spastic paraplegia resulting in progressive motor disturbance with variable sensorineural hearing loss and language/cognitive dysfunction in three individuals"
    explanation: >-
      Enumerates the extra-corticospinal features that define the complicated
      phenotype represented by this node.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a complicated form of hereditary spastic paraplegia with selective involvement of the upper motor neurons and more broad CNS neurodegeneration"
    explanation: >-
      Places the disorder in the complicated-HSP category with CNS involvement
      wider than the corticospinal tract.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neurodevelopmental delay is a defining feature of the syndrome; the
      cellular route from sphingolipid excess to it is not established.

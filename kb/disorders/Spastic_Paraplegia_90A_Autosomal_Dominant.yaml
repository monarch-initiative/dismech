animal_models:
- name: Drosophila SPTSSA-variant hereditary spastic paraplegia model
  species: Drosophila melanogaster
  genotype: SPTSSA hereditary-spastic-paraplegia variant expressed in Drosophila
  publication: PMID:36718090
  description: >-
    The founding study used Drosophila to test the SPTSSA variants in vivo,
    showing that they raise sphingolipid levels in a whole animal rather than
    only in transfected cells. The review by the same group reports that these
    flies also show motor deficits and shortened lifespan.
  modeled_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The variants produce elevated sphingolipids in vivo in the fly, which is
      the in-animal demonstration of the excess-synthesis node.
    limitations: >-
      Drosophila has no corticospinal tract and no myelin, so the model can
      demonstrate the metabolic lesion and a motor consequence but cannot
      reproduce the specific upper-motor-neuron anatomy of human SPG90A. The
      human sphingolipid excess itself was measured in HEK293 cells and patient
      fibroblasts, not in nervous tissue.
    readouts:
    - name: Whole-animal sphingolipid levels
      target: Unrestrained De Novo Sphingolipid Synthesis
      direction: INCREASED
      interpretation: >-
        Elevated sphingolipids in the variant-expressing fly are the in vivo
        readout of failed feedback restraint.
      evidence:
      - reference: PMID:38788085
        reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Drosophila models of SPTSSA-related HSP variants show elevated sphingolipids"
        explanation: >-
          Reports the direction of the lipid measurement in the fly model.
    evidence:
    - reference: PMID:36718090
      reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "leading to excessive sphingolipid synthesis based on biochemical studies and in vivo studies in Drosophila"
      explanation: >-
        Establishes that the Drosophila work is one of the two evidence streams
        supporting the excess-synthesis node, which is what makes this model
        informative for it.
  - target: Distal Degeneration of Long Corticospinal Axons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The variant-expressing flies show motor deficits and shortened lifespan,
      which the review describes as consistent with motor neuron degeneration.
      This is the organismal readout that carries the model's relevance to the
      degeneration node, and it is separated from the lipid link because motor
      performance is a readout of neurodegeneration, not of a lipid measurement.
    limitations: >-
      Drosophila has no corticospinal tract, no upper motor neurons and no
      myelin, so a fly motor deficit cannot evidence a LENGTH-DEPENDENT CENTRAL
      axonopathy specifically; it evidences that excess sphingolipid synthesis is
      neurologically damaging in a whole animal. The cited wording is
      "consistent with motor neuron degeneration", which is an inference from
      behaviour and lifespan rather than a demonstration of axonal pathology.
    readouts:
    - name: Motor performance and lifespan
      target: Distal Degeneration of Long Corticospinal Axons
      direction: DECREASED
      interpretation: >-
        Motor deficits and shortened lifespan are the organismal consequence
        attributed to the elevated sphingolipids in this model, and are the
        closest available in vivo correlate of the degeneration node.
      evidence:
      - reference: PMID:38788085
        reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "with motor deficits and shorter lifespans, consistent with motor neuron degeneration"
        explanation: >-
          Reports the motor and lifespan readouts of the fly model and the
          authors' interpretation of them.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Drosophila models of SPTSSA-related HSP variants show elevated sphingolipids, with motor deficits and shorter lifespans, consistent with motor neuron degeneration"
      explanation: >-
        Links the fly model to a neurodegenerative interpretation. Marked PARTIAL
        because the inference is from motor behaviour and lifespan in an animal
        with no corticospinal tract.
- name: Stellar (Sptssb H56L) mouse
  species: Mus musculus
  genotype: Sptssb Stellar (Stl) spontaneous mutation
  publication: PMID:26438849
  description: >-
    A spontaneous mouse mutation in the paralogous SPT small subunit SPTSSB that
    alters SPT substrate affinity and produces neurodegeneration with axon
    degeneration. It is included here as the closest available mammalian model of
    a dysregulated SPT small subunit, not as a model of SPTSSA disease.
  modeled_mechanisms:
  - target: Distal Degeneration of Long Corticospinal Axons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Demonstrates in a mammal that a small-subunit lesion which dysregulates SPT
      output causes axon degeneration.
    limitations: >-
      The allele is in SPTSSB, not SPTSSA, and it acts by changing acyl-CoA
      substrate affinity and elevating C20 long-chain bases rather than by
      breaking ORMDL feedback restraint — a different molecular route to a
      different lipid species. The phenotype is ataxia with premature death, not
      a spastic paraparesis, and no corticospinal-tract-specific pathology is
      claimed.
    readouts:
    - name: Axon degeneration and membrane protein-homeostasis abnormality
      target: Distal Degeneration of Long Corticospinal Axons
      direction: INCREASED
      interpretation: >-
        Axon degeneration is the readout that makes this model informative for a
        neurodegenerative consequence of SPT small-subunit dysregulation.
      evidence:
      - reference: PMID:26438849
        reference_title: "Elevation of 20-carbon long chain bases due to a mutation in serine palmitoyltransferase small subunit b results in neurodegeneration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "resulting in surprising neurodegenerative effects including aberrant membrane structures, accumulation of ubiquitinated proteins on membranes, and axon degeneration"
        explanation: >-
          Reports the neurodegenerative readouts, including axon degeneration, in
          the mutant mouse.
    evidence:
    - reference: PMID:26438849
      reference_title: "Elevation of 20-carbon long chain bases due to a mutation in serine palmitoyltransferase small subunit b results in neurodegeneration."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Our work demonstrates that SPT small subunits play a major role in controlling SPT activity and substrate affinity, and in specifying sphingolipid LCB chain length in vivo."
      explanation: >-
        Establishes the general principle that SPT small subunits control enzyme
        output in vivo, which is what makes this model partially informative.
        Marked PARTIAL because the gene and lipid species differ from SPG90A.
treatments:
- name: Supportive and symptomatic care
  description: >-
    No disease-modifying therapy exists for SPG90A. Management is supportive and
    directed at spasticity, mobility, communication, hearing, and developmental
    needs, as for other complicated hereditary spastic paraplegias.
  therapeutic_modality: OTHER
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Physical therapy
  description: >-
    Physiotherapy, stretching and limb mobilisation to manage spasticity,
    preserve range of motion and maintain function. This addresses the non-reflex
    (intrinsic) component of hypertonia that soft-tissue change contributes on
    top of the disinhibited stretch reflex.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Loss of Supraspinal Inhibitory Control of the Stretch Reflex
    treatment_effect: MODULATES
    description: >-
      Mobilisation and stretching target the hypertonia produced by the
      disinhibited stretch reflex and the secondary soft-tissue changes that
      accompany it. This is symptomatic management, not modification of the
      underlying lipid lesion.
    evidence:
    - reference: PMID:25530960
      reference_title: "Pathophysiology of spasticity: implications for neurorehabilitation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Therefore, in patients with UMNS, hypertonia can be divided into two
        components: hypertonia mediated by the stretch reflex, which corresponds to
        spasticity, and hypertonia due to soft tissue changes, which is often
        referred as nonreflex hypertonia or intrinsic hypertonia.
      explanation: >-
        Identifies the soft-tissue component of hypertonia that rehabilitation
        addresses, which is why physiotherapy is linked to this node.
- name: Antispasticity pharmacotherapy
  description: >-
    Symptomatic antispastic agents such as baclofen are used to reduce lower-limb
    spasticity, as in other hereditary spastic paraplegias. No trial evidence
    specific to SPG90A exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baclofen
      term:
        id: CHEBI:2972
        label: baclofen
  target_mechanisms:
  - target: Loss of Supraspinal Inhibitory Control of the Stretch Reflex
    treatment_effect: INHIBITS
    description: >-
      Antispastic agents act on the reflex-mediated component of the hypertonia
      produced by loss of descending inhibitory control — the component the
      source below identifies as spasticity proper, as distinct from the
      non-reflex soft-tissue hypertonia that rehabilitation addresses. This is
      symptomatic suppression of a downstream node; it does not touch the
      sphingolipid lesion.
    evidence:
    - reference: PMID:25530960
      reference_title: "Pathophysiology of spasticity: implications for neurorehabilitation."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        hypertonia mediated by the stretch reflex, which corresponds to
        spasticity
      explanation: >-
        Identifies the reflex-mediated component of hypertonia that antispastic
        pharmacotherapy targets. Marked PARTIAL because the quoted review
        characterises the target component rather than naming baclofen or
        reporting a trial, and no antispastic trial specific to SPG90A exists.
- name: Avoidance of L-Serine Supplementation
  description: >-
    L-serine supplementation must NOT be given in SPG90A. This is not a gap in
    the treatment list, it is an active contraindication, and it is a trap
    specific to this disease family: L-serine is an established supplement
    strategy in hereditary sensory and autonomic neuropathy type 1, which is
    caused by variants in the SAME serine palmitoyltransferase complex. HSAN1
    variants make the enzyme promiscuous so that it uses L-alanine and generates
    neurotoxic 1-deoxysphingolipids, and flooding the enzyme with its correct
    substrate outcompetes that side reaction. SPG90A is the opposite lesion —
    the enzyme is not promiscuous, it is unrestrained — so supplying more
    substrate would be predicted to drive the very overproduction that causes the
    disease. A clinician who recognises "a serine palmitoyltransferase disorder"
    and reaches for the familiar intervention would be expected to make the
    patient worse.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  notes: >-
    Deliberately carries no `target_mechanisms` link. The action curated here is
    withholding an intervention, which neither inhibits nor activates a node; a
    link either way would encode a clinical caution as a causal edge and would
    export as a false mechanistic assertion. The mechanistic content — that
    serine loading would exacerbate the sphingolipid overproduction node — is in
    the description and in the quoted evidence instead. Note also that the
    prediction is explicitly a prediction: no SPG90A patient has been given
    L-serine and reported.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In SPT-related motor neuron diseases, which are caused by unrestrained SPT activity, serine supplementation would be predicted to exacerbate sphingolipid overproduction, with the potential to accelerate the disease progression"
    explanation: >-
      The discovering group's own statement of the contraindication for the
      unrestrained-SPT diseases, of which SPG90A is one. The authors' hedge
      ("would be predicted") is quoted intact and is preserved in the notes.
- name: Partial Serine Palmitoyltransferase Inhibition (investigational)
  description: >-
    The mechanistically rational direction for a disease of unrestrained SPT
    activity is to inhibit the enzyme partially. Myriocin is the canonical tool
    compound, a fungal natural product that inhibits SPT through a dual
    mechanism. Nothing here is clinically available for SPG90A: this is curated
    as the rational therapeutic axis implied by the mechanism, not as a
    treatment, and the toxicity caveat is part of the claim rather than a
    footnote to it — complete SPT inhibition causes systemic toxicity, so any
    viable approach has to be partial.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: myriocin (tool compound)
      term:
        id: CHEBI:582124
        label: myriocin
  target_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    treatment_effect: INHIBITS
    description: >-
      Partial pharmacological inhibition of serine palmitoyltransferase would act
      directly on the node that the loss of ORMDL restraint drives. No such agent
      has been given to an SPG90A patient.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "To counteract SPT overactivity, partial SPT inhibition provides a more rational therapeutic approach, though one must act with caution as complete inhibition of SPT is associated with systemic toxicity."
      explanation: >-
        States both the rationale for targeting this node and the toxicity limit
        on doing so, which is why the treatment is curated as investigational.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myriocin (also known as thermozymocidin or ISP-10) was first isolated as a natural fungal product and exerts a potent inhibitory effect on SPT via a dual inhibitory mechanism."
    explanation: >-
      Identifies the canonical SPT inhibitor and its mechanism.
- name: SPT Small-Subunit Knockdown (preclinical concept)
  description: >-
    Because the small subunits set SPT activity and substrate selectivity without
    being catalytic, knocking down SPTSSA or SPTSSB has been argued to offer
    theoretical advantages over small-molecule inhibition or allele-specific
    knockdown. For SPG90A specifically this is attractive in principle — a
    dominant activating lesion in a non-catalytic subunit with a single recurrent
    allele — but it is a preclinical argument, not a programme: no construct,
    modality, delivery route or animal efficacy result is reported, which is why
    `therapeutic_modality` is OTHER rather than SIRNA or
    ANTISENSE_OLIGONUCLEOTIDE and no `aso_details` block is curated.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  notes: >-
    The cited source frames subunit knockdown as having theoretical advantages
    "over small molecules or allele-specific knockdown approaches"; it does not
    report an agent. Curated so the rational axis is visible and queryable
    without implying that a therapy exists.
  target_mechanisms:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    treatment_effect: INHIBITS
    description: >-
      Reducing small-subunit abundance would lower SPT output, acting on the same
      node as pharmacological inhibition but through a different lever.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "knockdown of small subunits of SPT (SPTSSA or SPTSSB) instead of SPTLC1 or SPTLC2 provides theoretical advantages over small molecules or allele-specific knockdown approaches"
      explanation: >-
        States the rationale for targeting the small subunits. Marked PARTIAL
        because the source argues a theoretical advantage rather than reporting
        an experimental or clinical result.
discussions:
- discussion_id: sptssa_vs_sptlc_phenotype_divergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of ORMDL restraint on serine palmitoyltransferase produce an
    upper-motor-neuron-predominant, neurodevelopmentally complicated spastic
    paraplegia when the lesion is in SPTSSA, but combined upper and lower motor
    neuron disease when the same biochemical lesion is in SPTLC1 or SPTLC2?
  attaches_to:
  - "pathophysiology#Impaired ORMDL-Mediated Feedback Inhibition of Serine Palmitoyltransferase"
  rationale: >-
    The SPTSSA, SPTLC1 and SPTLC2 disease variants converge on the same
    mechanism — impaired ORMDL regulation and unrestrained SPT activity — yet
    give clinically distinct syndromes. One reported difference is that the
    SPTSSA cHSP variants, unlike the ALS variants, do not increase and may
    decrease the activity of SPTSSB-containing SPT, which would change which
    sphingolipid species accumulate and in which cells. Until this is resolved,
    no entry in this family should assert a single shared downstream lipid
    species as the neurotoxic effector.
  proposed_experiments:
  - experiment_id: exp_spg90a_comparative_sphingolipidomics
    name: Comparative sphingolipidomics across SPT-subunit disease alleles
    description: >-
      Untargeted sphingolipidomic profiling of patient-derived cells and neurons
      carrying SPTSSA cHSP versus SPTLC1/SPTLC2 juvenile-ALS alleles, resolving
      SPTSSA- versus SPTSSB-containing holoenzyme output, to test whether the
      accumulating species differ in a way that tracks the clinical divergence.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite the biochemical similarities and differences between SPT-related juvenile ALS and cHSP, the mechanisms underlying the phenotypic differences remain poorly understood."
    explanation: >-
      The discovering group states the gap explicitly.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is notable that unlike the SPTLC1 and SPTLC2-related ALS variants, the cHSP-related SPTSSA variants do not increase, and likely decrease (via ORMDL inhibition) the activity of SPTSSB-containing SPT."
    explanation: >-
      Records the one concrete biochemical difference proposed to explain the
      divergence, including the authors' own hedge.
- discussion_id: no_mammalian_model_of_sptssa_hsp
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the Drosophila SPTSSA model, which has neither a corticospinal tract nor
    myelin, license the inference that excess sphingolipid synthesis causes
    length-dependent upper-motor-neuron axonal degeneration in humans?
  attaches_to:
  - "pathophysiology#Distal Degeneration of Long Corticospinal Axons"
  rationale: >-
    The only in vivo model of SPTSSA disease variants is in Drosophila, and no
    murine model of an SPT-related ALS or HSP variant had been reported as of the
    2024 review. The corticospinal localisation curated in this entry therefore
    rests on the clinical pattern of selective upper-motor-neuron signs plus
    class-level HSP knowledge, not on demonstrated pathology in this disorder or
    in a mammalian model of it. The nearest mammalian evidence, the Stellar
    mouse, carries a different gene (SPTSSB), a different molecular mechanism
    (altered substrate affinity rather than lost ORMDL restraint) and a different
    phenotype (ataxia rather than spastic paraparesis).
  proposed_experiments:
  - experiment_id: exp_spg90a_t51i_knockin_mouse
    name: Knock-in mouse carrying the recurrent SPTSSA p.Thr51Ile allele
    description: >-
      Generate and characterise a mouse knock-in of the recurrent human allele,
      testing specifically for length-dependent corticospinal axonal degeneration
      with sparing of lower motor neurons, and for the developmental and auditory
      components of the human phenotype.
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No murine models with SPT-related ALS or HSP variants have been reported so far."
    explanation: >-
      Establishes the absence of a mammalian model, which is the basis for this
      mismatch.
notes: >-
  Scope: this entry is the autosomal dominant (monoallelic) pole of SPG90,
  MONDO:0957308 / OMIM #620416. The recessive pole, SPG90B (OMIM #620417), is a
  separate MONDO concept with its own stub and is not curated here; the shared
  SPTSSA biochemistry means the two entries will duplicate much of the upstream
  chain, which is expected rather than a defect.


  No `datasets:` block is curated. Searches of the reported literature surfaced
  no disease-specific omics accession for SPG90A; the founding study's data are
  targeted lipidomic and enzymatic assays rather than a deposited dataset.


  ORPHA coverage was not asserted. The local Orphanet refresh recipe is
  currently failing on a manifest checksum mismatch, and no cached ORPHA record
  for this concept was available, so no ORPHA-sourced evidence is claimed.


  Features deliberately NOT curated, and why. Deep-research output attributes
  several further findings to the full text of the founding paper — nevus
  flammeus and short stature in two of three patients, raised serum
  sphingolipids in all three, and rolandic epileptiform EEG activity — but the
  cached record for PMID:36718090 is `content_type: abstract_only` and contains
  none of those sentences. They are recorded here as unverified leads rather
  than curated as phenotypes or biochemical findings; anyone with access to the
  full text should promote them with real quotes. Two further full-text-only
  items were considered and are named here so a reader can see they were not
  simply overlooked. First, NERVE CONDUCTION STUDIES AND EMG ARE REPORTED NORMAL
  in all three founding patients, showing no polyneuropathy or motor neuron
  disease; that negative finding is the electrophysiological anchor for the
  pure-upper-motor-neuron localisation this entry infers, and is what separates
  SPG90A from the SPTLC1 juvenile-ALS phenotype, so it is the single most
  valuable item to promote if the full text becomes quotable. Second, MRI and MR
  SPECTROSCOPY findings including decreased N-acetylaspartate and increased
  lactate are described, which would be the only in vivo human evidence of a
  bioenergetic component and could justify a biochemical node. The EEG
  observation would need particular care, since epileptiform activity on EEG and
  clinical seizures are different claims, and reviews listing seizures for this
  disorder may be pooling in the SPG90B patient.

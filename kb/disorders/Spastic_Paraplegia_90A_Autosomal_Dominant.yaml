genetic:
- name: SPTSSA activating missense variant
  gene_term:
    preferred_term: SPTSSA
    term:
      id: hgnc:20361
      label: SPTSSA
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous SPTSSA missense variants cause the dominant pole of SPG90
    (OMIM #620416). The p.Thr51Ile allele is recurrent: found in two of the
    founding three patients and again in the fourth, it accounts for three of the
    four published SPG90 patients and is the only SPTSSA allele reported more
    than once. The remaining founding patient carries the other variant reported
    in that series; the cached abstracts do not say whether that patient is
    monoallelic or biallelic, so no SPG90A-only denominator is asserted here. SPTSSA disease
    variants affect the transmembrane region of the small subunit, the same
    structural class of lesion that produces juvenile ALS when it falls in the
    corresponding transmembrane domain of SPTLC1. Biallelic SPTSSA variants
    cause the separate recessive concept SPG90B (OMIM #620417) and are out of
    scope for this entry.
  variants:
  - name: p.Thr51Ile
    description: >-
      The recurrent SPTSSA allele and the only one reported in more than one
      patient. Heterozygous missense; found in two of the founding three patients
      and again in the fourth, giving three of the four published SPG90 patients.
      It is the allele that makes allele-specific approaches conceivable in this
      disease at all, which is why the entry curates a small-subunit knockdown
      concept alongside partial enzyme inhibition.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:40533086
      reference_title: "Identifying the Fourth Patient With Spastic Paraplegia 90, Extending the Phenotype Spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing revealed a heterozygous pathogenic variant (p.Thr51Ile), which was detected in two of the reported patients, suggesting a recurrent variant in this syndrome."
      explanation: >-
        Names the allele, its heterozygous state, its pathogenic classification
        and its recurrence across independent patients.
  evidence:
  - reference: PMID:40533086
    reference_title: "Identifying the Fourth Patient With Spastic Paraplegia 90, Extending the Phenotype Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed a heterozygous pathogenic variant (p.Thr51Ile), which was detected in two of the reported patients, suggesting a recurrent variant in this syndrome."
    explanation: >-
      Identifies the recurrent heterozygous p.Thr51Ile allele and its recurrence
      across independent patients.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "those variants that affect the transmembrane domains of SPTLC1 or SPTSSA or intermembrane domain of SPTLC2 are more likely to cause jALS or cHSP"
    explanation: >-
      Places the SPTSSA disease variants in the transmembrane structural class
      associated with the unrestrained-SPT phenotypes rather than with HSAN1.

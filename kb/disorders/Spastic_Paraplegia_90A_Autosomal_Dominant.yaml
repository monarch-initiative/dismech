        Directly attributes the lower-extremity spasticity to upper-motor-neuron
        dysfunction in this disorder.
  - target: Spastic paraplegia
    causal_link_type: DIRECT
    description: >-
      The combination of spasticity and weakness in the lower limbs constitutes

  downstream:
  - target: Impaired ORMDL-Mediated Feedback Inhibition of Serine Palmitoyltransferase
    causal_link_type: DIRECT
    description: >-
      The variants sit where the small subunit participates in the regulated
      assembly, so the ORMDL negative-feedback arm is the function that fails.
    evidence:
    - reference: PMID:36718090
      reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The variants in SPTSSA impaired the negative regulation of serine palmitoyltransferase by ORMDLs leading to excessive sphingolipid synthesis based on biochemical studies and in vivo studies in Drosophila."
      explanation: >-
        Directly links the SPTSSA variants to failure of ORMDL-mediated negative
        regulation.
- name: Impaired ORMDL-Mediated Feedback Inhibition of Serine Palmitoyltransferase
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Sphingolipids are simultaneously essential and cytotoxic, so their synthesis
    is held under tight homeostatic control. The ORMDL proteins bind the SPT
    holoenzyme and inhibit it when sphingolipid levels become excessive; ORMDL3
    sits in the centre of the complex and stabilises the assembly. In SPG90A the
    catalytic machinery is intact — what is lost is the restraint on it, which is
    why this is modelled as a gain of function of the pathway rather than an
    enzyme deficiency.
  molecular_functions:
  - preferred_term: serine C-palmitoyltransferase activity
    term:
      id: GO:0004758
      label: serine C-palmitoyltransferase activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: negative regulation of sphingolipid biosynthetic process
    term:
      id: GO:0090155
      label: negative regulation of sphingolipid biosynthetic process
    modifier: LOSS_OF_FUNCTION
  protein_complexes:
  - preferred_term: serine palmitoyltransferase complex
    term:
      id: GO:0017059
      label: serine palmitoyltransferase complex
  evidence:
  - reference: PMID:36718090
    reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Key to the homeostatic regulation are the ORMDL proteins that are bound to serine palmitoyltransferase and mediate feedback inhibition of enzymatic activity when sphingolipid levels become excessive."
    explanation: >-
      States the normal regulatory relationship whose failure defines this node.
  - reference: PMID:36718090
    reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sphingolipids are both essential and cytotoxic and their synthesis must therefore be tightly regulated."
    explanation: >-
      Supports the framing that the regulatory arm, not the catalytic arm, is the
      disease-relevant vulnerability.
  - reference: PMID:37308477
    reference_title: "Ceramide sensing by human SPT-ORMDL complex for establishing sphingolipid homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structure-guided mutational analyses reveal the essential function of this ceramide binding site for the suppression of SPT activity."
    explanation: >-
      Identifies the ceramide-binding site through which ORMDL suppresses SPT
      activity, defining the specific regulatory function that is lost at this
      node.
  - reference: PMID:37308477
    reference_title: "Ceramide sensing by human SPT-ORMDL complex for establishing sphingolipid homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The ORM/ORMDL family proteins function as regulatory subunits of the serine palmitoyltransferase (SPT) complex, which is the initiating and rate-limiting enzyme in sphingolipid biosynthesis."
    explanation: >-
      States the regulatory-subunit relationship between ORMDL and SPT that this
      node depends on.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Similar to juvenile ALS variants, SPTSSA variants seem to interfere with ORMDL regulation of the SPT complex, thus resulting in unrestrained SPT activity."
    explanation: >-
      A review by the discovering group restating the mechanism and placing it
      alongside the SPTLC1/SPTLC2 juvenile-ALS variants. The hedged wording
      ("seem to") is preserved deliberately.
  downstream:
  - target: Unrestrained De Novo Sphingolipid Synthesis
    causal_link_type: DIRECT
    description: >-
      With the negative-feedback arm broken, flux through the first committed
      step of sphingolipid biosynthesis rises.
    evidence:
    - reference: PMID:36718090
      reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "impaired the negative regulation of serine palmitoyltransferase by ORMDLs leading to excessive sphingolipid synthesis"
      explanation: >-
        States the causal step from failed ORMDL regulation to excessive
        sphingolipid synthesis.
- name: Unrestrained De Novo Sphingolipid Synthesis
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Loss of feedback restraint raises de novo sphingolipid production. This
    matters disproportionately in the nervous system, where sphingolipids are
    abundant structural components of membranes and especially of myelin, so a
    shift in the size and composition of the sphingolipid pool changes the
    membrane environment on which long axons and their oligodendrocyte partners
    depend. The excess was demonstrated biochemically in HEK293 cells and patient
    fibroblasts and in vivo in Drosophila; it has not been measured in human
    nervous tissue.
  biological_processes:
  - preferred_term: sphingolipid biosynthetic process
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: sphingolipid
    term:
      id: CHEBI:26739
      label: sphingolipid
    modifier: INCREASED
  evidence:
  - reference: PMID:36718090
    reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The effect of these variants on the catalytic activity and homeostatic regulation of serine palmitoyltransferase was investigated in human embryonic kidney cells, patient fibroblasts and Drosophila."
    explanation: >-
      Identifies the experimental systems in which the excess synthesis was
      measured, which is the basis for the caveat that human nervous tissue was
      not assayed.
  - reference: PMID:36718090
    reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sphingolipids are a diverse family of lipids with critical structural and signalling functions in the mammalian nervous system, where they are abundant in myelin membranes."
    explanation: >-
      Supports why an altered sphingolipid pool is expected to be
      neurologically consequential rather than metabolically silent.
  downstream:
  - target: Distal Degeneration of Long Corticospinal Axons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excess sphingolipid synthesis is the proposed proximate driver of the
      corticospinal syndrome. The intervening steps between the lipid excess and
      selective upper-motor-neuron axonal failure are not established in humans;
      the strongest in vivo support is the Drosophila model, in which the same
      variants produce elevated sphingolipids together with motor deficits.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Drosophila models of SPTSSA-related HSP variants show elevated sphingolipids, with motor deficits and shorter lifespans, consistent with motor neuron degeneration"
      explanation: >-
        The in vivo link from lipid excess to a motor phenotype is made in
        Drosophila, which is why this edge is typed as having unknown
        intermediates in humans.
    - reference: PMID:26438849
      reference_title: "Elevation of 20-carbon long chain bases due to a mutation in serine palmitoyltransferase small subunit b results in neurodegeneration."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "resulting in surprising neurodegenerative effects including aberrant membrane structures, accumulation of ubiquitinated proteins on membranes, and axon degeneration"
      explanation: >-
        Independent mouse evidence that dysregulated SPT small-subunit function
        produces axon degeneration. Marked PARTIAL because the allele is in the
        paralogous small subunit SPTSSB, not SPTSSA.
  - target: Broader CNS Neurodevelopmental and Neurodegenerative Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The discovering study attributed the phenotype not only to axonal
      degeneration but to defects in early brain development and function, which
      is what makes SPG90A a complicated rather than a pure spastic paraplegia.
    evidence:
    - reference: PMID:36718090
      reference_title: "SPTSSA variants alter sphingolipid synthesis and cause a complex hereditary spastic paraplegia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "point to excessive sphingolipid synthesis due to impaired homeostatic regulation of serine palmitoyltransferase as responsible for defects in early brain development and function"
      explanation: >-
        The authors' own causal attribution from excess sphingolipid synthesis to
        disturbed early brain development and function.
- name: Distal Degeneration of Long Corticospinal Axons
  biological_scale: TISSUE
  role: effector
  conforms_to: "corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons"
  description: >-
    The clinical signature of SPG90A is upper-motor-neuron dysfunction without
    lower motor neuron disease, which localises the lesion to the corticospinal
    tract and is the disorder-specific instance of the module's length-dependent
    dying-back axonopathy. This localisation is inferred from the clinical and
    review description of selective upper-motor-neuron involvement; no human
    neuropathological or neurophysiological study of an SPG90A patient has been
    published, so the length-dependent distal pattern is imported from the HSP
    class rather than demonstrated in this disorder.
  cell_types:
  - preferred_term: upper motor neuron
    term:
      id: CL:0008048
      label: upper motor neuron
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this disease, symptoms emerge in early childhood predominantly with upper motor neuron dysfunction leading to lower extremity spasticity without lower motor neuron disease."
    explanation: >-
      Establishes selective upper-motor-neuron involvement, which is what
      localises the lesion to the corticospinal tract in this disorder.
  - reference: PMID:33439395
    reference_title: Hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary spastic paraplegias (HSPs) are a group of neurodegenerative
      disorders which involve the corticospinal tracts and present with distinct
      spasticity and weakness of the lower extremities.
    explanation: >-
      Class-level statement that the HSP phenotype reflects corticospinal tract
      involvement. Evidence source is OTHER because this is a review, and it is
      cited as the basis for the imported class-level localisation.
  downstream:
  - target: Loss of Supraspinal Inhibitory Control of the Stretch Reflex
    causal_link_type: DIRECT
    description: >-
      Degeneration of descending corticospinal axons removes the supraspinal
      inhibitory input that normally restrains the spinal stretch reflex.
    evidence:
    - reference: PMID:25530960
      reference_title: "Pathophysiology of spasticity: implications for neurorehabilitation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The central lesion causing the UMNS disrupts the balance of supraspinal
        inhibitory and excitatory inputs directed to the spinal cord, leading to a
        state of disinhibition of the stretch reflex.
      explanation: >-
        States the causal step from a central upper-motor-neuron lesion to
        disinhibition of the stretch reflex.
- name: Loss of Supraspinal Inhibitory Control of the Stretch Reflex
  biological_scale: TISSUE
  role: effector
  conforms_to: "corticospinal_tract_axonopathy#Loss of Supraspinal Inhibitory Control of the Stretch Reflex"
  description: >-
    Disinhibition of the spinal stretch reflex produces the velocity-dependent
    hypertonia that defines spasticity. As the module records, the hypertonia of
    an upper-motor-neuron syndrome is not purely reflex-mediated: secondary soft
    tissue change contributes a non-reflex component, which is the mechanistic
    reason physiotherapy is curated alongside antispastic drugs in this entry.
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:25530960
    reference_title: "Pathophysiology of spasticity: implications for neurorehabilitation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, in patients with UMNS, hypertonia can be divided into two
      components: hypertonia mediated by the stretch reflex, which corresponds to
      spasticity, and hypertonia due to soft tissue changes, which is often
      referred as nonreflex hypertonia or intrinsic hypertonia.
    explanation: >-
      Supports the two-component account of hypertonia stated in this node, and
      the rehabilitation arm of treatment that follows from it.
  downstream:
  - target: Lower limb spasticity
    causal_link_type: DIRECT
    description: >-
      Disinhibited stretch reflexes plus loss of descending motor drive produce
      the lower-limb spasticity that dominates the clinical picture.

name: Spastic Paraplegia 90A, Autosomal Dominant
creation_date: "2026-08-25T00:00:00Z"
category: Mendelian
description: >-
  Spastic paraplegia 90A (SPG90A) is an ultra-rare, early-childhood-onset
  complex (complicated) hereditary spastic paraplegia caused by monoallelic
  activating missense variants in SPTSSA, which encodes the small activating
  subunit A of serine palmitoyltransferase (SPT) — the endoplasmic-reticulum
  enzyme that catalyses the rate-limiting first step of de novo sphingolipid
  biosynthesis. SPT activity is held in check by the ORMDL proteins, which bind
  the complex and inhibit it when sphingolipid levels rise. The SPTSSA disease
  variants sit on the face of the small subunit that participates in this
  regulation, so ORMDL-mediated feedback inhibition fails and sphingolipid
  synthesis runs unrestrained. This is a gain of function in the sense of lost
  restraint, not a deficiency state. Affected children present with progressive
  lower-limb spasticity and motor impairment on a background of
  neurodevelopmental delay, with variable sensorineural hearing loss and
  language/cognitive dysfunction. Only four SPG90 patients have been published in
  total, and the recurrent p.Thr51Ile allele accounts for three of them: two of
  the founding three carried it, and so did the fourth. It is the only SPTSSA
  allele reported more than once, and on current evidence it is effectively the
  SPG90A allele.


  SPG90A is deliberately curated as the MONDO-recognised autosomal DOMINANT pole
  of SPG90 (OMIM #620416); the biallelic/recessive pole is a separate MONDO
  concept (SPG90B, OMIM #620417) and is not folded in here. It is also
  mechanistically the sibling — not a duplicate — of the SPTLC1/SPTLC2 juvenile
  amyotrophic lateral sclerosis entries, which share the same
  loss-of-ORMDL-restraint biochemistry but produce combined upper and lower
  motor neuron disease rather than the neurodevelopmentally complicated,
  upper-motor-neuron-predominant picture seen here. Why the same biochemical
  lesion in different SPT subunits yields different clinical syndromes is an
  explicitly unresolved question, and is recorded as a knowledge gap rather than
  papered over.

animal_models:
- name: Robo1 ENU missense mutant mouse
  species: Mouse
  genotype: Robo1 homozygous ENU-induced missense (Ig-3 domain)
  publication: PMID:35227688
  description: >
    A pre-existing ENU line, not made for this study, carrying a homozygous
    missense change in the third immunoglobulin domain - the same domain as
    one of the human missense alleles. That correspondence is what makes it an
    allele-matched model rather than a generic knockout, and the reason the
    authors reached for it.
  modeled_mechanisms:
  - target: Disturbed Ureteric Bud Outgrowth and Nephrogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      All five newborn mutants had severely altered kidney architecture with
      genitourinary malformations: duplex or multiplex kidneys, cystic
      dysplasia, hydronephrosis, hydroureter, and misplaced undescended
      gonads. Endogenous Robo1 staining was absent from mutant kidneys, so the
      missense allele behaves as a functional null in this tissue.
    limitations: >-
      A missense allele rather than the truncating alleles that dominate the
      human cohort, and the renal phenotype is more uniform than the human one
      - every mutant is affected, whereas human severity ranges from fetal
      lethality to adult-onset kidney failure. Duplex and multiplex kidneys
      are also more prominent in the mouse than in the patients, whose
      commonest severe finding is agenesis.
    readouts:
    - name: Renal Robo1 immunostaining
      target: Disturbed Ureteric Bud Outgrowth and Nephrogenesis
      direction: ABOLISHED
      interpretation: >-
        Establishes that the ENU missense allele abolishes detectable renal
        Robo1, which is what licenses reading the mouse as a loss-of-function
        model for the human truncating alleles.
      evidence:
      - reference: PMID:35227688
        reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found the complete absence of Robo1 expression in mutant kidneys, in contrast to the postnatal renal tubular expression observed in wild-type controls"
        explanation: >
          The measurement, against wild-type littermate controls.
    - name: Kidney and genitourinary morphology at birth
      target: Disturbed Ureteric Bud Outgrowth and Nephrogenesis
      direction: ALTERED
      interpretation: >-
        Structural readout of the CAKUT phenotype, scored in every newborn
        mutant by microCT and necropsy.
      evidence:
      - reference: PMID:35227688
        reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "all newborn mutant mice (n = 5) displayed severely altered kidney architecture and genitourinary tract malformations compatible with CAKUT"
        explanation: >
          The phenotype with its denominator - five of five.
    evidence:
    - reference: PMID:35227688
      reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "On necropsy, macroscopic renal phenotypes also included duplex or multiplex kidneys with cystic dysplasia and consecutive hydronephrosis"
      explanation: >
        Establishes that the model produces a CAKUT phenotype, which is what
        makes it informative for this node.
    - reference: PMID:35227688
      reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Also observed were misplaced undescended gonads, both ovaries and testes, reminiscent of bilateral cryptorchidism reported in ID 3"
      explanation: >
        A second organ where mouse and human findings correspond, extending
        the model's relevance beyond the kidney proper.
  - target: Reduced SLIT-ROBO Guidance Signalling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Used to test, and reject, the ciliopathy reading of the phenotype:
      primary cilia on collecting ducts and ureteric bud tips were compared
      between mutants and controls.
    limitations: >-
      Morphology and abundance only, by acetylated-tubulin staining. The
      authors say explicitly that this does not exclude disturbed ciliary
      signalling, so the negative result bounds the hypothesis rather than
      closing it.
    readouts:
    - name: Primary cilium morphology and abundance in collecting duct and ureteric bud tip
      target: Reduced SLIT-ROBO Guidance Signalling
      direction: UNCHANGED
      interpretation: >-
        A real negative result: no ciliary difference between mutant and
        control, which argues against a ciliopathy mechanism for the cystic
        phenotype.
      evidence:
      - reference: PMID:35227688
        reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ciliary morphology and abundance, however, was overall unaffected on staining with acetylated tubulin in immunofluorescent microscopy"
        explanation: >
          The negative measurement itself.
    evidence:
    - reference: PMID:35227688
      reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As renal cystic dilation and extrarenal manifestations (e.g., heart anomalies) were reminiscent of ciliopathy phenotypes, we compared primary cilia protruding from collecting ducts and ureteric bud tips in control versus"
      explanation: >
        States why the measurement was made - the ciliopathy resemblance -
        which is what makes this a MEASURES link rather than a phenotype
        claim.

discussions:
- discussion_id: robo1_genotype_severity_dosage
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Biallelic Loss-of-Function ROBO1 Variants
  - pathophysiology#Congenital Anomalies of the Kidney and Urinary Tract
  prompt: >-
    Does the allelic combination predict severity in biallelic ROBO1 disease -
    specifically, is two-null genotype the reason for fetal lethality and
    null-plus-hypomorph the reason for survival with milder kidney disease?
  rationale: >
    The authors propose exactly this and the cohort is consistent with it: the
    index patient survived to 44 with a truncating allele undergoing
    nonsense-mediated decay in trans with a missense allele that gnomAD lists
    at 0.04% in Europeans, while the fetal cases carried two frameshifts. But
    nine individuals cannot establish a genotype-phenotype rule, the
    ascertainment differs between the fetal and living arms, and no functional
    assay quantifies residual signalling for any allele. This is the question
    with the most immediate clinical consequence in the entry - it is what
    prenatal counselling for a newly identified biallelic genotype would turn
    on - so recording it as unresolved matters more than usual.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "variability of the kidney disease suggests gene dosage effects due to a combination of null alleles with mild hypomorphic alleles"
    explanation: >
      The authors' own statement of the hypothesis, offered as a suggestion
      rather than a demonstration.
  proposed_experiments:
  - experiment_id: robo1_allelic_series_signalling_assay
    name: Quantify residual SLIT-ROBO signalling across the reported allelic series
    description: >-
      Express each reported ROBO1 allele at controlled dosage in a
      ROBO1-null cell background and measure SLIT-induced receptor
      dimerisation, SRGAP recruitment and downstream repulsion in a growth-cone
      or ureteric-bud explant assay, then rank the alleles and compare that
      ranking with the clinical severity of the genotypes carrying them.
    would_support:
    - pathophysiology#Congenital Anomalies of the Kidney and Urinary Tract
    supporting_outcome:
    - >-
      Measured residual signalling orders the alleles in the same sequence as
      clinical severity, with the two-frameshift fetal genotypes at zero and
      the surviving adult's missense allele retaining partial activity,
      establishing dosage as the determinant of outcome.
    would_refute:
    - pathophysiology#Congenital Anomalies of the Kidney and Urinary Tract
    refuting_outcome:
    - >-
      Residual signalling does not track severity - for example the adult
      index patient's missense allele proves as inactive as a frameshift -
      which would mean modifiers or stochastic developmental factors, not
      ROBO1 dosage, set the phenotype.

genetic:
- name: ROBO1
  notes: >
    The sole gene for this disorder, at 3p12.3, encoding the 180 kDa
    roundabout guidance receptor 1. Biallelic variants cause this recessive
    syndrome; monoallelic variants have separately been reported in congenital
    heart disease and in pituitary stalk interruption syndrome, and the
    unaffected status of the carrier parents here is the evidence that those
    are a different, lower-penetrance situation rather than the same disease in
    milder form. The paralogue ROBO2 and the ligand SLIT2 are independently
    implicated in CAKUT, but by monoallelic variants with incomplete
    penetrance, which is the contrast that makes ROBO1's recessive pattern
    notable.
  gene_term:
    preferred_term: ROBO1
    term:
      id: hgnc:10249
      label: ROBO1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we here propose biallelic ROBO1 variants as causing syndromic, but viable CAKUT phenotypes in humans"
    explanation: >
      The gene-disease assertion, with the authors' own emphasis that
      biallelic loss is compatible with life - which had been the open
      question.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to our observations in ROBO1, VUR associated with ROBO2 was observed on monoallelic variation and dominant inheritance with incomplete penetrance"
    explanation: >
      Distinguishes this gene's inheritance pattern from its paralogue's,
      which is what keeps the two entities separate.

treatments:
- name: Kidney replacement therapy for established kidney failure
  description: >
    The end of the renal course for the severe survivors, and the reason this
    diagnosis has prognostic weight rather than only explanatory value. The
    index patient reached end-stage kidney disease at 44 and was on the
    transplant waiting list when the genotype was found. Nothing modifies the
    underlying malformation; this treats its consequence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Congenital Anomalies of the Kidney and Urinary Tract
    description: >-
      Replaces failed renal function. It does not act on the developmental
      lesion, which is complete before birth.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 44-year-old index patient (ID 1) was genetically evaluated for chronic kidney failure of unknown etiology while awaiting kidney transplantation."
    explanation: >
      Documents that a patient with this genotype reached transplant
      candidacy. INDIRECT: the source reports the clinical situation, not an
      outcome of transplantation in this disease.

- name: Urological correction of obstruction and reflux
  description: >
    Where the ureteric-bud lesion produces obstruction rather than agenesis,
    the consequence is recurrent pyelonephritis and progressive scarring, and
    it is surgically addressable. The index patient had a posterior urethral
    valve and ureterovesical junction obstruction corrected in his first year;
    his renal function then stayed stable for four decades. That sequence is
    an argument for early urological assessment, though a single course is not
    evidence of benefit.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Congenital Anomalies of the Kidney and Urinary Tract
    description: >-
      Relieves obstruction and reflux, addressing the secondary injury rather
      than the malformation.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "he suffered from repetitive pyelonephritis due to VUR caused by unilateral ureterovesical junction obstruction and a posterior urethral valve requiring surgical intervention within his first year of life"
    explanation: >
      Documents the surgical intervention and the lesions it addressed.
      INDIRECT: one patient, and the subsequent stability is not attributed to
      the surgery by the source.

- name: Pituitary hormone replacement
  description: >
    Where the pituitary is involved, the deficiencies are replaceable, which
    makes this the one part of the syndrome with a treatment that restores
    function rather than managing damage. Reported in the ROBO1-related
    pituitary literature rather than in the NORS cohort itself, so the link
    from this entity to this treatment runs through the shared gene.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_mechanisms:
  - target: Disturbed Pituitary Stalk and Hypothalamic-Pituitary Axis Formation
    description: >-
      Replaces the hormone output lost when the midline pituitary structures
      fail to form. It does not act on the malformation itself.
  evidence:
  - reference: PMID:38444307
    reference_title: "Pituitary stalk interruption syndrome due to novel ROBO1 mutation presenting as combined pituitary hormone deficiency and central diabetes insipidus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude and emphasize that ROBO1 should be investigated in patients with PSIS."
    explanation: >
      Establishes ROBO1 as a cause of the pituitary phenotype that this
      treatment addresses. INDIRECT twice over: the patient is heterozygous
      rather than biallelic, and the source recommends genetic testing rather
      than reporting a treatment outcome.

- name: Reproductive genetic counseling and cascade testing
  description: >
    A recessive syndrome with a one-in-four recurrence risk and, at the severe
    end, a lethal prenatal phenotype - so counselling with prenatal or
    preimplantation options is a substantive part of care after a first
    affected pregnancy. Three of the nine reported individuals are fetuses
    from one family, which is what that risk looks like in practice.

    The counselling has a second, less obvious use. Two patients in this
    cohort were found by re-examining the kidneys of people already carrying a
    ROBO1-related cardiac or neurological diagnosis, so a molecular diagnosis
    in one organ system should prompt screening of the others.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "in patients with already established ROBO1-associated cardiac or neuronal disorders, screening for kidney involvement is indicated."
    explanation: >
      The cross-organ screening recommendation that a molecular diagnosis
      enables. INDIRECT: it is a diagnostic recommendation being used to
      support a counselling and surveillance role.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lastly, we describe a previously unreported family with 3 affected fetal cases"
    explanation: >
      The recurrence this counselling addresses: three affected pregnancies in
      one family. INDIRECT: it documents the recurrence, not the effect of
      counselling on it.

diagnosis:
- name: Multi-organ screening after a molecular diagnosis
  description: >
    The defining paper's closing recommendation, and the practical
    consequence of a syndrome whose organ involvement is heterogeneous and
    not predictable from any one system. Eye, heart, central nervous system,
    gonad and kidney each need looking at, because the cohort contains
    patients whose renal disease was found only by re-examining someone
    already diagnosed with a ROBO1-related cardiac or neurological disorder -
    and one adult whose kidney failure went unexplained until 44.
  diagnosis_term:
    preferred_term: multi-organ screening after molecular diagnosis
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "requires extensive screening for eye, heart, central nervous system, gonad, and kidney involvement"
    explanation: >
      The surveillance recommendation, naming the five organ systems.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in patients with already established ROBO1-associated cardiac or neuronal disorders, screening for kidney involvement is indicated."
    explanation: >
      The specific direction that found two patients in this cohort: looking
      at the kidneys of people already diagnosed with something else.

- name: Gene-panel or exome sequencing in syndromic CAKUT
  diagnosis_term:
    preferred_term: exome or gene-panel sequencing
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >
    The practical recommendation from the defining study runs in both
    directions. ROBO1 should be included in genetic analysis of CAKUT,
    including in adults with chronic kidney failure of unknown cause; and
    conversely, anyone already carrying a ROBO1-associated cardiac or
    neurodevelopmental diagnosis should be screened for kidney involvement,
    since two patients in this cohort were found by re-examining the kidneys of
    people already diagnosed with something else.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "comprehensive genetic analysis in CAKUT should include ROBO1 as a new cause of recessively inherited disease. Hence, in patients with already established ROBO1-associated cardiac or neuronal disorders, screening for kidney involvement is indicated."
    explanation: >
      Both halves of the diagnostic recommendation, stated by the authors.

name: Neurooculorenal Syndrome
creation_date: "2026-08-31T09:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurooculorenal syndrome
  term:
    id: MONDO:0957210
    label: neurooculorenal syndrome
description: >
  Neurooculorenal syndrome (NORS, OMIM #620305) is an autosomal recessive
  developmental disorder caused by biallelic ROBO1 variants. It was delineated
  in 2022 from six unrelated living individuals and a family of three affected
  fetuses, assembled through GeneMatcher, retrospective phenotyping of
  previously published biallelic carriers, and an unbiased search of 78,195
  genomes in the 100,000 Genomes Project.

  Three organ systems are involved, and the name lists them in the order the
  literature found them. The kidney and urinary tract carry the defining
  lesion: unilateral or bilateral renal agenesis, ureterovesical junction
  obstruction, vesicoureteral reflux, posterior urethral valve, cystic
  dysplasia and increased echogenicity - in short, syndromic CAKUT. The
  nervous system contributes midline and hindbrain malformations, chiefly
  corpus callosum thinning or partial agenesis, ventriculomegaly, vermis
  hypoplasia and absent pyramidal tracts, together with intellectual
  impairment and, in one patient, mirror movements. The eye contributes
  strabismus and iris anomalies.

  The unifying claim is that these are not three coincident malformations but
  one signalling lesion read out in three places. ROBO1 is the receptor for
  the secreted SLIT ligands, and Slit-Robo signalling positions growing
  structures relative to the midline: commissural axons decide whether to
  cross it, and the ureteric bud decides where along the nephric duct to
  emerge. Human fetal kidney immunohistochemistry in this study puts ROBO1
  exactly where nephrogenesis happens - the outer nephrogenic zone, in
  comma-shaped and S-shaped bodies - and shows that staining absent in
  dysplastic patient tissue.

  A dosage argument runs through the whole entity and is what makes it
  recessive. Heterozygous ROBO1 variants had already been reported in
  congenital heart disease and pituitary stalk interruption syndrome, but the
  heterozygous parents in this cohort were clinically unaffected, and renal
  involvement appeared only when both alleles were altered. The severity range
  within the biallelic group - from an adult who reached end-stage kidney
  disease at 44 with normal cognition, to terminated fetuses with bilateral
  renal agenesis and Potter sequence - tracks with allelic combination:
  two nulls at the severe end, a null plus a mild hypomorph at the mild end.

synonyms:
- NORS
- ROBO1-related syndromic CAKUT
- biallelic ROBO1 deficiency

parents:
- Congenital anomaly of the kidney and urinary tract
- Multiple congenital anomalies syndrome

notes: >
  Identifier correction, recorded because the error was mine and was asserted
  as fact. An earlier draft of this description gave the OMIM number as
  #619976. It is #620305: MONDO:0957210 carries `skos:exactMatch OMIM:620305`
  together with `MEDGEN:1841013` and `UMLS:C5830377`, and the deep-research
  report reached the same cluster independently. Nothing in the validation
  stack catches this, because the schema has no OMIM mapping slot - `mappings`
  offers MONDO, ICD-10-CM, ICD-11-F and NCIT only - so the identifier can only
  live in unvalidated description prose. The MedGen and UMLS cross-references
  are likewise unrepresentable and are recorded here rather than structurally.

  Naming, and a caution for anyone searching the literature. The defining
  paper never uses the phrase "neurooculorenal syndrome" - it calls the
  entity "syndromic CAKUT" associated with biallelic ROBO1. The name comes
  from the OMIM entry created afterwards, and MONDO:0957210 follows OMIM. So
  a text search for the disease name against the primary source returns
  nothing, which is a genuine trap: the entity is real and well-evidenced, but
  its name and its evidence live in different documents. Every snippet in this
  entry is therefore keyed on ROBO1 and on the organ phenotypes, not on the
  syndrome name.

  Zygosity and dosage. The two homozygous patients were born to consanguineous
  parents; the rest are compound heterozygous. This entry sets
  `zygosity: HOMOZYGOUS` on the genetic context node as the modal state, which
  is a lossy summary - the schema takes one value and the cohort contains
  both. The compound-heterozygous configuration is the more common one and is
  described in the node text.

  Counting, and the denominator problem. Nine individuals in total, of whom
  three are fetuses ascertained at termination after antenatal ultrasound and
  six are living. The two ascertainment routes select for opposite ends of the
  severity range, so no `frequency` is set on any phenotype in this entry: a
  percentage pooled across a terminated 17-week fetus and a 44-year-old
  transplant candidate would not describe any population that exists.

  What this entry deliberately does not claim. The cystic kidneys and the
  combination of renal, cardiac, brain and eye involvement look like a
  ciliopathy, and the authors tested that directly - ciliary morphology and
  abundance were normal in mutant mouse collecting ducts and ureteric bud
  tips. The negative result is curated as evidence on the mechanism node
  rather than omitted, because "looks like a ciliopathy, is not one" is
  clinically useful and is the kind of finding that disappears if only
  positive results are curated.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Six unrelated living individuals plus three affected fetuses from one
    family. An unbiased search of 78,195 genomes in the 100,000 Genomes
    Project returned exactly one further case, which is the closest thing to a
    population-scale frequency estimate available.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified six unrelated individuals and two non-viable fetuses with biallelic truncating or combined missense and truncating variants in ROBO1"
    explanation: >-
      The published cohort size and composition, which is the denominator for
      this entry.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we searched 78,195 germline genomes of participants from the 100,000 Genomes Project"
    explanation: >-
      Establishes that the cohort includes an unbiased population-scale
      search, not only referral-based ascertainment, which is what makes the
      rarity statement more than an artefact of who was sequenced.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic, with two homozygotes from consanguineous families and the rest
    compound heterozygous. The inheritance claim is unusually well supported
    for a nine-patient cohort because it rests on a negative as well as a
    positive: the heterozygous parents were clinically unaffected, and renal
    involvement appeared only with both alleles altered. That is what
    distinguishes this from the earlier monoallelic ROBO1 reports in
    congenital heart disease and pituitary stalk interruption syndrome.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygous parents in our study were clinically unaffected, which we propose may be due to incomplete penetrance and gene dosage effects conferred by distinct variants in the ROBO1 locus."
    explanation: >
      The unaffected-carrier observation that grounds recessive inheritance,
      stated together with the authors' dosage interpretation.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to our data, renal involvement was only present on genetic alteration of both alleles."
    explanation: >
      States the dosage threshold specifically for the renal phenotype, which
      is the organ that defines this entity.

mechanistic_hypotheses:
- hypothesis_group_id: slit_robo_midline_guidance_dosage
  hypothesis_label: SLIT-ROBO Midline Guidance Dosage Model
  status: CANONICAL
  description: >-
    Biallelic reduction of ROBO1 below a threshold impairs SLIT-ROBO
    signalling in every tissue that uses it to position structures during
    development. The three affected organ systems are the three places where
    that requirement is strictest and least redundant: commissural and
    pyramidal axon guidance across the CNS midline, ureteric bud outgrowth and
    branching in the nephrogenic zone, and ocular development. Whether an
    individual is severely or mildly affected is set by which pair of alleles
    they carry, not by which tissue is involved - the same genotype affects
    all three. CANONICAL because the receptor biology, the human fetal kidney
    expression, the mouse renal and cardiac phenotypes, and the human genetics
    all point the same way.

pathophysiology:
- name: Biallelic Loss-of-Function ROBO1 Variants
  biological_scale: MOLECULAR
  description: >
    Twelve variants across the cohort, all single-nucleotide substitutions:
    eight truncating, two canonical splice-site, and two missense. The two
    missense alleles land in the functionally important extracellular domains
    - one on a surface loop of the third immunoglobulin domain near the
    homodimerisation linker, the other on the second fibronectin type III
    domain - which is where SLIT binding and receptor dimerisation happen. All
    but one allele were absent from population and clinical variant databases.
  genes:
  - preferred_term: ROBO1
    term:
      id: hgnc:10249
      label: ROBO1
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic ROBO1 alleles. Compound heterozygous truncating, or
      truncating in trans with a hypomorphic missense allele, in most; two
      homozygous splice-site cases from consanguineous families.
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 12 ROBO1 variants reported in our study were single-nucleotide substitutions: 2 canonical splice site variants, 8 truncating variants, and 2 missense variants, the latter 2 located within the functionally important Ig and FN3 protein domains"
    explanation: >
      The complete allelic spectrum and the domain localisation of the
      missense alleles.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The extracellular portion, responsible for homodimerization and Slit-ligand binding, contains 5 well-defined N-terminal Ig-like domains followed by 3 fibronectin type III (FN3) domains."
    explanation: >
      Establishes what the domains hit by the missense alleles actually do,
      which is why their location is the argument for pathogenicity.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicating nonsense-mediated RNA decay of the truncating allele and exclusive expression of the missense allele"
    explanation: >
      Transcript-level demonstration that a truncating allele is degraded, so
      the surviving hypomorphic allele sets the phenotype. This is the
      observation the dosage model is built on.
  downstream:
  - target: Reduced SLIT-ROBO Guidance Signalling
    description: Loss of receptor available to bind SLIT ligand at the cell surface.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage

- name: Reduced SLIT-ROBO Guidance Signalling
  biological_scale: MOLECULAR
  description: >
    ROBO1 is a 180 kDa single-pass receptor for the secreted SLIT ligands,
    conserved since its identification in a Drosophila screen for axon
    guidance mutants. It homodimerises, heterodimerises with ROBO2, and binds
    SLIT1/2/3 and the SRGAP adaptors; reducing it therefore reduces a
    repulsive positional signal rather than a growth or survival signal. Its
    paralogue ROBO2 and its ligand SLIT2 are already implicated in human
    CAKUT, which is the pathway-level context that made ROBO1 a credible
    candidate long before this cohort existed.

    The cystic-kidney and multi-organ pattern raises a ciliopathy hypothesis,
    and this node records that it was tested and not supported: ciliary
    morphology and abundance were normal in mutant collecting ducts and
    ureteric bud tips.
  biological_processes:
  - preferred_term: Roundabout signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035385
      label: Roundabout signaling pathway
  - preferred_term: axon guidance
    modifier: DECREASED
    term:
      id: GO:0007411
      label: axon guidance
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Roundabout guidance receptors (ROBOs) constitute a highly conserved subfamily of immunoglobulin superfamily proteins characterized by a single-pass transmembrane domain and interaction with the soluble extracellular Slit ligands."
    explanation: >
      Establishes the receptor-ligand relationship this node is about.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ROBO1 was shown to both homodimerize and heterodimerize with ROBO2"
    explanation: >
      Records the dimerisation partnerships, which matter because one missense
      allele sits next to the homodimerisation linker.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    snippet: "Ciliary morphology and abundance, however, was overall unaffected on staining with acetylated tubulin in immunofluorescent microscopy"
    explanation: >
      A tested and negative ciliopathy hypothesis. Regraded from REFUTE to
      NO_EVIDENCE on review: the result does not contradict this node's claim
      that SLIT-ROBO guidance signalling is reduced - it bears on a different
      proposition, that the phenotype is ciliary, and finds nothing. It is
      kept here because a phenotype that resembles a ciliopathy without being
      one is exactly the kind of claim that needs its negative on the record.
  downstream:
  - target: Disturbed Ureteric Bud Outgrowth and Nephrogenesis
    description: >-
      Loss of the positional signal that places and branches the ureteric bud.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage
  - target: Disturbed CNS Midline and Commissural Axon Guidance
    description: >-
      Loss of the repulsive signal that governs midline crossing.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage
  - target: Disturbed Pituitary Stalk and Hypothalamic-Pituitary Axis Formation
    description: >-
      Loss of the same guidance signal at the midline structure that becomes
      the pituitary stalk.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage
  - target: Disturbed Retinal Ganglion Cell Axon Targeting
    description: >-
      Loss of ROBO-mediated targeting of retinal ganglion cell axons through
      the optic chiasm.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage

- name: Disturbed Ureteric Bud Outgrowth and Nephrogenesis
  biological_scale: TISSUE
  description: >
    ROBO1 protein sits in the human fetal kidney precisely where nephrons are
    being made - the outer nephrogenic zone, in comma-shaped and S-shaped
    bodies - at 14 and 21 weeks of gestation. In a 22-week fetus carrying
    biallelic ROBO1 variants that zone was gone and the staining with it,
    leaving dysplastic cystic parenchyma. Because the ureteric bud's position
    along the nephric duct determines whether a kidney forms at all and
    whether the ureter inserts correctly, a guidance failure at this step
    produces the whole clinical range at once: agenesis where the bud never
    emerges, reflux and junction obstruction where it emerges in the wrong
    place, dysplasia where branching miscarries.
  cell_types:
  - preferred_term: nephron progenitor cell
    term:
      id: CL:0000324
      label: metanephric mesenchyme stem cell
  biological_processes:
  - preferred_term: ureteric bud development
    modifier: DECREASED
    term:
      id: GO:0001657
      label: ureteric bud development
  - preferred_term: kidney development
    modifier: DECREASED
    term:
      id: GO:0001822
      label: kidney development
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry of endogenous ROBO1 in fetal control kidneys dating from 14 and 21 WG showed ROBO1 localization at the outer nephrogenic zone within comma-shaped bodies and S-shaped bodies supporting a role of ROBO1 in normal nephrogenesis"
    explanation: >
      Puts the protein in the right human tissue at the right developmental
      stage. This is human, not model-organism, expression data, which is what
      makes it the strongest single piece of mechanism in the entry.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the subcortical nephrogenic zone presented abolished in renal tissue from ID 8 at 22 WG accompanied by an absence of ROBO1 staining in severely dysplastic and cystic renal parenchyma"
    explanation: >
      The matched patient tissue: no ROBO1 staining, no nephrogenic zone,
      dysplastic kidney. Expression and loss in the same experiment.
  downstream:
  - target: Congenital Anomalies of the Kidney and Urinary Tract
    description: The clinical renal phenotype produced by the guidance failure.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage

- name: Disturbed CNS Midline and Commissural Axon Guidance
  biological_scale: TISSUE
  description: >
    ROBO1 was identified as an axon guidance receptor and is required for
    neocortical development. The neurological phenotype in this cohort is
    correspondingly midline-weighted: corpus callosum thinning or partial or
    splenial agenesis, absent pyramidal tracts in all three fetuses,
    ventriculomegaly, cerebellar vermis and dentate nucleus hypoplasia, and
    brainstem hypoplasia. One patient had mirror movements without a variant
    in DCC or RAD51, the two established mirror-movement genes - which is a
    direct clinical readout of failed decussation, since mirror movements
    arise when corticospinal projections that should cross do not.
  biological_processes:
  - preferred_term: axon guidance
    modifier: DECREASED
    term:
      id: GO:0007411
      label: axon guidance
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ROBO1, which was originally identified in a Drosophila mutant screen, was shown to be crucial for proper axon guidance and neocortical development."
    explanation: >
      Establishes the receptor's canonical neural function, which is what the
      CNS phenotype is proposed to follow from.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His neurodevelopmental phenotype was also striking for the observation of mirror hand movement disorder. No likely damaging variants in DCC or RAD51, previously associated with autosomal dominant mirror movements"
    explanation: >
      The mirror-movement observation with the two competing genes excluded.
      This is the closest thing in the cohort to a direct clinical test of a
      midline-crossing defect.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "partial agenesis of the corpus callosum, absence of pyramidal tracts, and dentate nuclei hypoplasia"
    explanation: >
      Fetal neuropathology showing absent pyramidal tracts alongside the
      callosal defect - two crossing systems failing together.
  downstream:
  - target: Midline Brain Malformation and Neurodevelopmental Impairment
    description: The clinical CNS phenotype.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage

- name: Disturbed Pituitary Stalk and Hypothalamic-Pituitary Axis Formation
  biological_scale: TISSUE
  description: >
    The endocrine branch. The pituitary stalk is a midline structure whose
    formation depends on the same guidance signalling as the commissures, and
    ROBO1 was implicated in pituitary stalk interruption syndrome by
    heterozygous variants before this recessive entity was described. In the
    biallelic cohort the readout ranges from a missing posterior pituitary
    bright spot with no endocrine consequence, through hypopituitarism with
    hypogonadism and micropenis and reduced growth, to combined pituitary
    hormone deficiency with central diabetes insipidus in the heterozygous
    PSIS literature. Expressivity is explicitly variable, so this node
    describes a susceptible developmental step rather than an obligate lesion.
  biological_processes:
  - preferred_term: axon guidance
    modifier: DECREASED
    term:
      id: GO:0007411
      label: axon guidance
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding pituitary malformations, we also observed variable expressivity."
    explanation: >
      Establishes pituitary malformation as part of the biallelic phenotype
      and states that its expressivity varies, which is what this node claims.
  - reference: PMID:38444307
    reference_title: "Pituitary stalk interruption syndrome due to novel ROBO1 mutation presenting as combined pituitary hormone deficiency and central diabetes insipidus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The roundabout receptor-1 gene (ROBO1) plays critical roles in axonal guidance and cell migration. Recently, mutations in the ROBO1 gene have been reported patients with PSIS."
    explanation: >
      Connects the gene's guidance function to stalk interruption
      specifically. INDIRECT: the reported patients are heterozygous, so this
      supports the developmental step rather than the recessive syndrome.
  downstream:
  - target: Midline Brain Malformation and Neurodevelopmental Impairment
    description: >-
      Stalk and hypothalamic-pituitary involvement is part of the same midline
      malformation spectrum.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage

- name: Disturbed Retinal Ganglion Cell Axon Targeting
  biological_scale: TISSUE
  description: >
    The ocular branch - the "oculo" of the disease name, which the entry
    previously described in phenotypes without modelling. ROBO receptors
    target retinal ganglion cell axons along the whole visual projection, and
    in Robo mutant mice the optic chiasm is expanded with ectopic crossing
    points and axons projecting where they should not. That is the same
    midline-crossing decision the commissural branch of this entry describes,
    applied to the visual pathway, and it is the most plausible route from
    ROBO1 loss to the strabismus reported across this cohort.

    Stated carefully: the mouse work is on Robo1 and Robo2 mutants and finds
    Robo2 the predominant receptor in visual development, so this node is a
    mechanism proposal for the human ocular phenotype rather than a
    demonstrated one. No human ocular pathology has been reported in this
    syndrome.
  biological_processes:
  - preferred_term: retinal ganglion cell axon guidance
    modifier: DECREASED
    term:
      id: GO:0031290
      label: retinal ganglion cell axon guidance
  evidence:
  - reference: PMID:18272390
    reference_title: "Robos are required for the correct targeting of retinal ganglion cell axons in the visual pathway of the brain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we examined Robo1 and 2 mutant mice and found that Robos regulate the correct targeting of retinal ganglion cell (RGC) axons along the entire visual projection."
    explanation: >
      Establishes the receptor family's role in visual pathway targeting.
      INDIRECT and MODEL_ORGANISM: mouse, and not in a disease model.
  - reference: PMID:18272390
    reference_title: "Robos are required for the correct targeting of retinal ganglion cell axons in the visual pathway of the brain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The optic chiasm was expanded along the rostro-caudal axis"
    explanation: >
      The specific midline defect - an expanded optic chiasm with ectopic
      crossing points - which is the visual-pathway counterpart of the
      commissural phenotype this entry curates elsewhere.
  - reference: PMID:18272390
    reference_title: "Robos are required for the correct targeting of retinal ganglion cell axons in the visual pathway of the brain."
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These defects were more pronounced in Robo2 than Robo1 knockout animals, implicating Robo2 as the predominant Robo receptor in visual system development."
    explanation: >
      The caveat that keeps this node a proposal. If Robo2 is the predominant
      receptor in visual development, ROBO1 loss alone is a weaker
      explanation for the ocular phenotype than for the renal or commissural
      ones, and the entry should not imply otherwise.
  downstream:
  - target: Strabismus
    description: >-
      Proposed route from mistargeted visual projections to the ocular
      phenotype; not demonstrated in human tissue.
    hypothesis_groups:
    - slit_robo_midline_guidance_dosage

- name: Congenital Anomalies of the Kidney and Urinary Tract
  biological_scale: ORGANISM
  description: >
    The defining organ phenotype and the one with prognostic weight. Its range
    within nine people is the whole CAKUT spectrum - bilateral agenesis with
    Potter sequence at the lethal end, unilateral agenesis and reflux
    nephropathy in the middle, increased echogenicity with mildly reduced
    kidney size at the mild end. The index patient reached end-stage kidney
    disease at 44, so this is a phenotype that can present in adulthood as
    unexplained chronic kidney failure with the congenital origin overlooked.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney and genitourinary manifestation included unilateral or bilateral kidney agenesis, vesicoureteral junction obstruction, vesicoureteral reflux, posterior urethral valve, genital malformation, and increased kidney echogenicity."
    explanation: >
      The full renal and genitourinary spectrum of the cohort, in one place.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "renal function stabilized over the years until a slowly progressive decrease in function led to bilateral atrophic kidneys and end-stage kidney disease at the age of 44"
    explanation: >
      The adult end of the range, and the reason this diagnosis belongs in the
      workup of unexplained adult chronic kidney failure.

- name: Midline Brain Malformation and Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >
    Clinically: intellectual impairment and psychomotor delay in most,
    dysmorphic facial features in eight of nine, and structural midline
    findings on imaging. Notably not universal - the adult index patient's
    motor and cognitive development was normal and his only MRI finding was a
    missing posterior pituitary bright spot, so a normal neurodevelopmental
    history does not exclude the diagnosis.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further clinical characteristics were remarkably heterogeneous, including neurodevelopmental defects, intellectual impairment, cerebral malformations, eye anomalies, and cardiac defects."
    explanation: >
      Names the extrarenal domains and, importantly, states that they are
      heterogeneous rather than obligate.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor and cognitive skills developed normally."
    explanation: >
      The index patient's normal cognition, which contradicts neurodevelopmental
      impairment being an obligate feature. Recorded as REFUTE against that
      stronger reading rather than dropped.

phenotypes:
- category: Renal
  name: Renal Agenesis
  description: >
    Unilateral in the living patients, bilateral with Potter sequence in the
    fetuses. This is the most severe end of the ureteric-bud phenotype - the
    bud never induced a kidney on that side.
  phenotype_term:
    preferred_term: Renal agenesis
    term:
      id: HP:0000104
      label: Renal agenesis
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal examination confirmed the bilateral kidney agenesis with Potter sequence"
    explanation: >
      Documents bilateral agenesis with its oligohydramnios sequence in a
      fetal case.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "manifested congenitally when an abdominal ultrasound revealed left-sided renal agenesis"
    explanation: >
      Documents unilateral agenesis in a living child, the survivable form.

- category: Renal
  name: Vesicoureteral Reflux
  phenotype_term:
    preferred_term: Vesicoureteral reflux
    term:
      id: HP:0000076
      label: Vesicoureteral reflux
  description: >
    With ureterovesical junction obstruction and posterior urethral valve in
    the index patient, requiring surgery in his first year. Reflux is the
    signature of a ureteric bud that emerged from the wrong position on the
    nephric duct, so it is mechanistically the same lesion as the agenesis,
    one step less severe.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he suffered from repetitive pyelonephritis due to VUR caused by unilateral ureterovesical junction obstruction and a posterior urethral valve requiring surgical intervention within his first year of life"
    explanation: >
      Documents reflux with the obstruction and valve, and its clinical
      consequence.

- category: Renal
  name: Cystic Renal Dysplasia
  phenotype_term:
    preferred_term: Cystic renal dysplasia
    term:
      id: HP:0000800
      label: Cystic renal dysplasia
  description: >
    Increased echogenicity with cystic dysplasia, and in the mouse model
    highly cystic collecting ducts with mildly dilated proximal tubules. This
    is the finding that makes the disease look like a ciliopathy on imaging.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "grade 3 VUR, mild hydronephrosis, and increased renal echogenicity with cystic dysplasia were observed on the right kidney"
    explanation: >
      Documents cystic dysplasia with reflux and hydronephrosis in one kidney
      of a patient whose other kidney is absent.

- category: Renal
  name: Chronic Kidney Failure
  phenotype_term:
    preferred_term: Stage 5 chronic kidney disease
    term:
      id: HP:0003774
      label: Stage 5 chronic kidney disease
    clinical_course: PROGRESSIVE
  description: >
    The long-term outcome in the one adult in the cohort, reached at 44 years
    after decades of stability. Since CAKUT is the leading cause of paediatric
    chronic kidney failure, this is the phenotype that gives the diagnosis its
    practical weight.
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 44-year-old index patient (ID 1) was genetically evaluated for chronic kidney failure of unknown etiology while awaiting kidney transplantation."
    explanation: >
      Documents progression to transplant-requiring kidney failure, and the
      diagnostic context in which the genotype was found.

- category: Ocular
  name: Strabismus
  description: >
    The most consistent eye finding, present in at least three patients,
    bilateral. Reported alongside an atrophic iris in one. Strabismus in a
    guidance-receptor disorder is worth taking seriously as a possible
    connectivity phenotype rather than a coincidental refractive one, though
    the cohort does not establish that.
  phenotype_term:
    preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eye anomalies (bilateral strabismus, atrophic iris), and dextrocardia were part of the clinical syndrome"
    explanation: >
      Documents the ocular findings as part of the syndrome, with the iris
      anomaly alongside.

- category: Endocrine
  name: Pituitary Insufficiency
  description: >
    The fourth organ system, and the one the syndrome's name omits. In this
    cohort it shows as hypogonadism with micropenis attributed to
    hypopituitarism, a missing posterior pituitary bright spot on MRI in an
    otherwise normal adult brain, and growth failure. It is mechanistically of
    a piece with the rest: the pituitary stalk is a midline structure whose
    formation depends on the same guidance signalling, and heterozygous ROBO1
    variants were already established in pituitary stalk interruption syndrome
    before this recessive entity was described.

    The missing bright spot is worth knowing about, but the entry previously
    overstated it and the source is explicit: in that patient it was
    asymptomatic and remained without clinical implications, with endocrine
    laboratory testing normal. So it is a structural marker of the same
    midline process, found on an MRI that was otherwise unremarkable in a man
    with normal cognition - not a functional deficit, and not on its own a
    diagnostic pointer. Pituitary expressivity is variable across the cohort,
    which is why the phenotype is curated at the insufficiency level and this
    imaging finding is described rather than bound.
  phenotype_term:
    preferred_term: Hypopituitarism
    term:
      id: HP:0040075
      label: Hypopituitarism
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypogonadism with micropenis, the latter being likely related to hypopituitarism and/or hypospadias"
    explanation: >
      Documents pituitary insufficiency in a biallelic patient, with the
      authors' own attribution of the genital finding to it.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "was asymptomatic and remained without clinical implications as endocrine laboratory testing revealed no further abnormalities."
    explanation: >
      The counterweight, and the reason this phenotype's description was
      corrected. The missing posterior pituitary bright spot in the index
      patient had no endocrine consequence, so the imaging finding does not
      by itself establish pituitary insufficiency in that individual.
  - reference: PMID:38444307
    reference_title: "Pituitary stalk interruption syndrome due to novel ROBO1 mutation presenting as combined pituitary hormone deficiency and central diabetes insipidus."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a 2.9-year-old boy with PSIS who presented with combined pituitary hormone deficiency, central diabetes insipidus, and the classical triad of MRI findings."
    explanation: >
      Extends the pituitary phenotype to posterior as well as anterior
      dysfunction. INDIRECT and worth reading carefully: this patient carries
      a *heterozygous* ROBO1 frameshift, so it is evidence about the gene's
      pituitary role rather than about this recessive syndrome, and it is
      cited on that basis rather than as a NORS case.

- category: Growth
  name: Growth Restriction
  description: >
    Reduced growth rate is reported across the paediatric patients, with
    heights around the 3rd-10th centile. In at least one it is downstream of
    the pituitary involvement rather than a skeletal phenotype, which matters
    for management: it is potentially treatable in a way the structural
    anomalies are not.
  phenotype_term:
    preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the patient's growth rate was reduced, and his general appearance included dysmorphic features together with intellectual disability, psychomotor delay, sensorineural hearing loss, and strabismus."
    explanation: >
      Documents reduced growth rate in the patient who also has documented
      pituitary insufficiency.

- category: Neurologic
  name: Corpus Callosum Anomaly
  description: >
    Thinning, splenial agenesis, or partial agenesis depending on the
    individual - a graded midline-crossing defect rather than an all-or-none
    one, which fits a dosage model better than a threshold one.
  phenotype_term:
    preferred_term: Abnormal corpus callosum morphology
    term:
      id: HP:0001273
      label: Abnormal corpus callosum morphology
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morphologically, nervous system anomalies comprised thinning of the corpus callosum and hypoplasia of the pons and midbrain"
    explanation: >
      Documents callosal thinning with brainstem hypoplasia in one patient.
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corpus callosum splenium agenesis, a small thalamus, and atrophic changes at the mesencephalopontine level"
    explanation: >
      A partial (splenial) callosal defect in a second patient, showing the
      graded nature of the finding.

- category: Neurologic
  name: Mirror Movements
  description: >
    Reported in one patient, and the closest thing in this cohort to a direct
    clinical test of the mechanism: mirror movements arise when corticospinal
    projections that should decussate do not. Its evidential weight comes from
    an exclusion - the two established autosomal dominant mirror-movement
    genes, DCC and RAD51, carried no likely damaging variant on exome
    sequencing in this patient.
  phenotype_term:
    preferred_term: Bimanual synkinesia
    term:
      id: HP:0001335
      label: Bimanual synkinesia
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His neurodevelopmental phenotype was also striking for the observation of mirror hand movement disorder. No likely damaging variants in DCC or RAD51, previously associated with autosomal dominant mirror movements"
    explanation: >
      The observation together with the exclusion of the two competing genes,
      which is what makes it attributable to ROBO1 here.

- category: Neurologic
  name: Corticospinal Tract Deficiency
  description: >
    Absent pyramidal tracts in all three fetuses examined. The structural
    counterpart of the mirror movements above, and the most direct
    neuropathological evidence in this entry that a crossing system fails.
    Bound to the hypoplasia term rather than to an abnormal-pyramidal-sign
    term, because the finding is a structural absence on fetal examination and
    not a clinical sign.
  phenotype_term:
    preferred_term: Corticospinal tract hypoplasia
    term:
      id: HP:0007016
      label: Corticospinal tract hypoplasia
  evidence:
  - reference: PMID:35227688
    reference_title: "Biallelic pathogenic variants in roundabout guidance receptor 1 associate with syndromic congenital anomalies of the kidney and urinary tract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "vermis hypoplasia, absence of pyramidal tracts, and dentate nuclei hypoplasia"
    explanation: >
      Documents absent pyramidal tracts on fetal neuropathological

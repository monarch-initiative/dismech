    label: cardiomyopathy, dilated, 100
description: >-
  CMD1OO (OMIM 620247; MONDO:0859381) is a historically proposed VEZF1-associated form
  of familial dilated cardiomyopathy. The current ClinGen report also records the OMIM
  designation with a provisional question mark (?Cardiomyopathy, dilated, 1OO). ClinGen
  classifies the autosomal dominant gene-disease relationship as No Known Disease Relationship.
  Its expert panel excluded the genetic evidence in the defining Shi et al. report (PMID:36657711)
  because of concerns about suspect data. The reported heterozygous c.490A>T p.(Lys164*)
  allele and its promoter-reporter results are therefore historical observations from an
  excluded study, not an established molecular diagnosis. Independent zebrafish and rat
  cardiomyocyte experiments support roles for Vezf1 in contractile-gene transcription,
  cardiomyocyte growth and contractile reserve, but do not demonstrate that human VEZF1
  variants cause DCM. Clinical evaluation, surveillance and treatment should follow the
  observed DCM phenotype and family history; the VEZF1 attribution does not establish variant-specific
  prognosis or predictive testing.

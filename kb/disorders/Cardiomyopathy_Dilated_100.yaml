genetic:
- name: VEZF1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: VEZF1 (vascular endothelial zinc finger 1)
    term:
      id: hgnc:12949
      label: VEZF1
  notes: >-
    The only gene attributed to this entity, and the attribution rests on one
    family. There is no ClinGen gene-disease validity assertion for VEZF1 in
    any cardiomyopathy, no second reported family, and no case series. The
    supporting evidence is strong for a single-family report (segregation at
    complete penetrance, absence from 200 unrelated DCM patients, 400 controls,
    dbSNP, HGMD and gnomAD, plus a reporter assay showing loss of
    transactivation) but it is exactly the shape of evidence that a gene
    curation panel would classify as Limited or Moderate rather than
    Definitive. Treat the gene-disease relationship as provisional.


    VEZF1 has substantial independent cardiovascular biology that makes the
    attribution biologically plausible rather than merely statistical: it was
    characterized first as a regulator of vasculogenesis and angiogenesis, it
    represses the antiangiogenic factor Cited2 in endothelial cells, and its
    expression falls in diseased human myocardium.
  evidence:
  - reference: PMID:36657711
    reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings indicate VEZF1 as a new gene responsible for DCM, which
      provides novel insight into the molecular pathogenesis of DCM
    explanation: >-
      The gene-disease attribution this entity rests on.
  - reference: PMID:29794136
    reference_title: The transcription factor Vezf1 represses the expression of the antiangiogenic factor Cited2 in endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Vascular endothelial zinc finger 1 (Vezf1), is a Krüppel-like zinc finger
      protein that plays a vital role in vascular development.
    explanation: >-
      Independent characterization of VEZF1 as a vascular-development
      transcription factor, which is the background biology that makes a
      cardiovascular phenotype plausible.
  variants:
  - name: VEZF1 c.490A>T p.(Lys164*)
    description: >-
      The only reported disease allele. A nonsense change truncating the protein
      at codon 164, heterozygous, segregating with dominant DCM through one
      family at complete penetrance. It was absent from 200 unrelated DCM
      patients, 400 unrelated healthy individuals, dbSNP, HGMD and gnomAD, which
      is a stronger absence argument than most single-family alleles carry.
    gene:
      preferred_term: VEZF1
      term:
        id: hgnc:12949
        label: VEZF1
    clinical_significance: LIKELY_PATHOGENIC
    type: nonsense
    evidence:
    - reference: PMID:36657711
      reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mutation was neither detected in another cohort of 200 unrelated DCM
        patients nor observed in 400 unrelated healthy individuals nor retrieved
        in the Single Nucleotide Polymorphism database, the Human Gene Mutation
        Database and the Genome Aggregation Database.
      explanation: >-
        The absence data supporting pathogenicity. `clinical_significance` is
        recorded as LIKELY_PATHOGENIC rather than PATHOGENIC because the
        supporting evidence is one family plus one functional assay, with no
        independent replication and no gene curation panel assessment.
experimental_models:
- name: Neonatal rat primary cardiomyocytes with Vezf1 silencing
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:31911272
  description: >-
    The cell system in which the transcriptional mechanism was worked out.
    Silencing Vezf1 in primary cardiomyocytes is what identified Myh7 as the key
    target, located the MCAT binding site in the Myh7 promoter that mediates the
    response, and showed TEAD-1 to be a VEZF1 binding partner. It is also the
    one system in this entry that speaks directly to whether the cardiac
    phenotype is cardiomyocyte-autonomous, because it removes the endothelium
    from the question.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  modeled_mechanisms:
  - target: Reduced Transcription of Cardiomyocyte Contractile and Growth Targets
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the transcriptional step directly: loss of VEZF1 in a
      cardiomyocyte lowers Myh7 promoter activity through a defined cis-element
      and a defined partner.
    limitations: >-
      Neonatal rat cells, not human, and knockdown of the wild-type protein
      rather than expression of the human p.(Lys164*) allele, so it models loss
      of VEZF1 rather than this disease's specific lesion. The cells are also
      neonatal, whereas the reported human disease is adult-onset.
    evidence:
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We further identify a key role for an MCAT binding site in the Myh7
        promoter regulating the response to Vezf1 knockdown and show that TEAD-1
        is a binding partner of Vezf1.
      explanation: >-
        The cis-element and binding partner identified in this system, which is
        the mechanism the transcriptional node asserts.
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The role of Vezf1 in regulating cardiac growth and contractile function
        was studied in zebrafish and in primary cardiomyocytes.
      explanation: >-
        Establishes primary cardiomyocytes as one of the two systems used,
        alongside the zebrafish curated under `animal_models`.

    explanation: Limits interpretation of the proposed initiating alteration.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Reported Loss of VEZF1 Promoter Transactivation
    causal_link_type: DIRECT
    description: >-
      Shi et al. reported loss of promoter transactivation for the mutant protein. This
      is an assay result from the same excluded publication, without independent validation
      of this allele.
    evidence:
    - reference: PMID:36657711
      reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-

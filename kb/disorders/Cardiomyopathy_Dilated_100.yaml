animal_models:
- name: vezf1 knockdown zebrafish
  species: Zebrafish
  genotype: vezf1 morpholino knockdown
  publication: PMID:31911272
  description: >-
    Larval zebrafish morpholino depletion of vezf1 tests cardiac growth and beta-adrenergic
    reserve. Capped Vezf1 RNA provides a rescue arm. This is a gene-function experiment,
    not a variant-specific model of established human DCM.
  modeled_mechanisms:
  - target: Impaired Cardiomyocyte Contractile Function
    relationship: PERTURBS
    description: Tests Vezf1-dependent contractile reserve in larvae.
    limitations: >-
      Whole-organism, transient depletion without the human allele. Reduced ventricular
      size and preserved baseline systolic function differ from the defining human DCM
      phenotype. Vascular effects may contribute.
    readouts:
    - name: Ventricular contractile response to beta-adrenergic stimulation
      target: Impaired Cardiomyocyte Contractile Function
      direction: DECREASED
      interpretation: >-
        Stress-response impairment; it does not establish a human disease trigger or imply
        absence of baseline structural changes.
      evidence:
      - reference: PMID:31911272
        reference_title: Vezf1 regulates cardiac structure and contractile function.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our experimental data shows that knockdown of zebrafish Vezf1 reduces cardiac
          growth and results in impaired ventricular contractile response to β-adrenergic
          stimuli.
        explanation: Reports the measured contractile and growth deficits.
    - name: Cardiomyocyte calcium transient kinetics
      target: Impaired Cardiomyocyte Contractile Function
      direction: UNCHANGED
      interpretation: >-
        No change in the tested calcium measurements; this does not exclude all excitation-contraction
        abnormalities.
      evidence:
      - reference: PMID:31911272
        reference_title: Vezf1 regulates cardiac structure and contractile function.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found Vezf1 KD and control MO ventricles to show similar resting Ca2+ concentration,
          Ca2+ transient amplitude, and Ca2+ transient decay time
        explanation: Direct measurements in isolated zebrafish hearts.
    evidence:
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Vezf1 knockdown does not affect cardiac systolic function analyzed at 2 dpf and
        4 dpf, but abrogates the isoprenaline-induced enhancement of cardiac contractile
        function at 4 dpf
      explanation: Larval baseline and stress-response results are distinct.
  - target: Impaired Cardiomyocyte Contractile Function
    relationship: RESCUES
    description: Capped Vezf1 RNA restores several cardiac functional readouts after morpholino depletion.
    limitations: >-
      Rescue of gene depletion in larvae, not correction of the human p.Lys164Ter variant
      or evidence of clinical therapeutic efficacy.
    evidence:
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Injection of capped Vezf1 RNA results in full or partial rescue of the phenotype
        induced by Vezf1 knockdown
      explanation: Cardiac phenotype rescue supports the specificity of the perturbation.
  - target: Reduced Cardiomyocyte Growth
    relationship: PERTURBS
    description: Depletes Vezf1 and measures the resulting cardiomyocyte growth defect.
    limitations: >-
      Experimental gene depletion does not establish human variant causality or a genotype-specific
      growth phenotype.
    evidence:
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Vezf1 knockdown also results in reduced cardiomyocyte size, or atrophy, at baseline
        and suppresses isoprenaline-induced increase in the size of cardiomyocytes
      explanation: Growth defect in zebrafish.

- name: Reduced Transcription of Cardiomyocyte Contractile and Growth Targets
  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In neonatal rat ventricular cardiomyocytes, Vezf1 depletion reduces Myh7/beta-MHC and
    Atp1a2 expression while increasing Acta1/skeletal alpha-actin, lowering the beta-MHC/Ska
    ratio at RNA and protein levels. Reporter mutagenesis implicates an MCAT element in
    the Myh7 promoter; Vezf1 co-immunoprecipitates with TEAD-1 from rat left ventricular
    tissue. The study supports a transcriptional mechanism in experimental systems, not
    a demonstrated pathway from the reported human allele to DCM.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      qPCR analysis of RNA samples from NRVMs confirmed that transcription of Myh7 and
      Atp1a2 were decreased and Ska mRNA levels were increased in response to Vezf1 knockdown
    explanation: Endogenous transcript changes in neonatal rat cardiomyocytes.
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similar to mRNA data, Vezf1 silencing resulted in a significant reduction in β-MHC/Ska
      ratio at protein level
    explanation: Protein-level confirmation of the contractile-protein imbalance.
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, unlike control siRNA treated cells, the mutation of an MCAT binding site
      at −211 to −189 (Δβe3) has no effect in Vezf1 silenced cells.
    explanation: >-
      Reporter mutagenesis supports an MCAT-dependent response; it does not demonstrate
      direct VEZF1 binding to the MCAT motif.
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that Vezf1 binds TEAD-1 in hearts in vivo
    explanation: Co-immunoprecipitation from rat left ventricular lysates identifies a protein partner.
  downstream:
  - target: Impaired Cardiomyocyte Contractile Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The altered contractile-gene program is a proposed contributor to impaired shortening.
      Knockdown perturbs both, but selective correction of Myh7/Acta1 imbalance was not
      shown to rescue function.
    evidence:
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: However, Vezf1 knockdown significantly attenuated cardiomyocyte shortening
      explanation: >-
        Independent depletion links Vezf1 function to cellular shortening, indirectly supporting
        the proposed transcription-to-function connection.
      directness: INDIRECT
  - target: Reduced Cardiomyocyte Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Transcriptional changes are a candidate contributor to reduced cardiomyocyte growth,
      inferred from the shared perturbation. The responsible target genes and intermediates
      have not been resolved.
    evidence:
    - reference: PMID:31911272
      reference_title: Vezf1 regulates cardiac structure and contractile function.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Microscopy analysis of cardiomyocyte size shows that depletion of Vezf1 by two
        different siRNAs significantly attenuates isoprenaline-induced increase in cardiomyocyte
        size
      explanation: Adult rat cardiomyocyte growth response measured independently of shortening.
      directness: INDIRECT
- name: Impaired Cardiomyocyte Contractile Function
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Vezf1-depleted zebrafish show impaired adrenergic augmentation of ventricular systolic
    function, despite preserved baseline systolic function in the larval measurements.
    Adult rat cardiomyocyte knockdown reduces cellular shortening. Calcium-transient measurements
    were unchanged in isolated zebrafish hearts and adult rat cardiomyocytes under the
    tested conditions; these negative assays do not exclude every excitation-contraction
    defect. Neither model carries the reported human allele.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle contraction
    term:
      id: GO:0060048
      label: cardiac muscle contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vezf1 knockdown does not affect cardiac systolic function analyzed at 2 dpf and 4
      dpf, but abrogates the isoprenaline-induced enhancement of cardiac contractile function
      at 4 dpf
    explanation: Larval baseline and stress-response results are distinct.
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: However, Vezf1 knockdown significantly attenuated cardiomyocyte shortening
    explanation: Functional deficit measured directly in adult rat cardiomyocytes.
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similar to findings in zebrafish in vivo, Vezf1 knockdown in adult rat cardiomyocytes
      has no effect on Ca2+ transient kinetics
    explanation: Negative adult-cell calcium result, limited to the tested readouts.
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progression from experimental Vezf1 loss to human ventricular dilation remains hypothetical.
      The larval model did not establish adult human DCM, and ClinGen found no accepted
      human genetic evidence.
    evidence:
    - reference: CGGV:assertion_17572620-69e6-4e55-9d4f-bc4ff78f452b-2025-01-10T170000.000Z
      reference_title: VEZF1 / dilated cardiomyopathy (No Known Disease Relationship)
      supports: NO_EVIDENCE
      evidence_source: OTHER
      snippet: No convincing evidence for a causal role for VEZF1 for AD DCM has been reported.
      explanation: Limits the proposed model-to-human disease link.
      quote_role: REVIEW_SYNTHESIS
- name: Reduced Cardiomyocyte Growth
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Vezf1 depletion reduces larval zebrafish cardiomyocyte size and number and blunts the
    growth response to isoprenaline. Vezf1 depletion also attenuates adrenergic enlargement
    of adult rat cardiomyocytes. These model findings concern cell growth separately from
    contractile function and do not establish a human VEZF1 disease mechanism.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac muscle tissue growth
    term:
      id: GO:0055017
      label: cardiac muscle tissue growth
    modifier: DECREASED
  evidence:
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Vezf1 knockdown also results in reduced cardiomyocyte size, or atrophy, at baseline
      and suppresses isoprenaline-induced increase in the size of cardiomyocytes
    explanation: Growth defect in zebrafish.
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Microscopy analysis of cardiomyocyte size shows that depletion of Vezf1 by two different
      siRNAs significantly attenuates isoprenaline-induced increase in cardiomyocyte size
    explanation: Adult rat cardiomyocyte growth response measured independently of shortening.
- name: Left Ventricular Dilation and Systolic Dysfunction
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  conforms_to: cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure
  description: >-
    Ventricular enlargement with reduced systolic function defines the DCM phenotype. This
    common clinical endpoint is established for DCM generally; attributing it to VEZF1
    variants is unestablished. Heart failure and sudden cardiac death are recognized general
    DCM complications, not demonstrated penetrance or outcome estimates for this proposed
    subtype.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/
    reference_title: Dilated Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An ejection fraction of less than 50% is considered systolic dysfunction.
    explanation: General DCM systolic-function criterion.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1309/
    reference_title: Dilated Cardiomyopathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Enlargement is most commonly assessed in adults by either echocardiography or cardiac MRI.
    explanation: General DCM structural criterion.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Dilated Cardiomyopathy
    description: The ventricular enlargement and systolic dysfunction comprise the clinical DCM phenotype.
    causal_link_type: DIRECT

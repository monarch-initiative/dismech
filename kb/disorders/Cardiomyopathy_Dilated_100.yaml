  biological_scale: MOLECULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    VEZF1 target genes in the cardiomyocyte include the contractile gene
    programme. Gene ontology enrichment on Vezf1 knockdown implicates cardiac
    muscle contraction and dilated-cardiomyopathy genes, and the study
    identifies cardiomyocyte Myh7 (beta-MHC) as the key target, acting through
    an MCAT binding site in the Myh7 promoter with TEAD-1 as a VEZF1 binding
    partner. The same regulation is visible in acquired disease: Vezf1
    expression is reduced in diseased human and mouse myocardium, which is what
    makes this transcription factor plausible as a general node rather than
    just the site of one family's mutation.

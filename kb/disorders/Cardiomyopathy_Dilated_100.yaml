discussions:
- discussion_id: vezf1_dcm_gene_validity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: What independent human genetic evidence would establish or reject a causal VEZF1-DCM relationship?
  attaches_to:
  - pathophysiology#Reported VEZF1 p.Lys164Ter Allele
  rationale: >-
    ClinGen has assessed the relationship and classified it as No Known Disease Relationship
    after excluding the defining genetic publication. Independent experimental biology
    provides plausibility but does not establish human causation. Independent ascertainment,
    segregation and variant-specific functional studies are needed.
  proposed_experiments:
  - experiment_id: vezf1_dcm_cohort_replication
    name: Look for further VEZF1 loss-of-function alleles in DCM cohorts
    description: >-
      Independently ascertain sequenced DCM families, assess rare VEZF1 variants and segregation
      with appropriate controls, and test specific variants in isogenic human cardiomyocytes.
      Candidate discovery should be separated from clinical pathogenicity interpretation.
  evidence:
  - reference: CGGV:assertion_17572620-69e6-4e55-9d4f-bc4ff78f452b-2025-01-10T170000.000Z
    reference_title: VEZF1 / dilated cardiomyopathy (No Known Disease Relationship)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Publications that presented genetic evidence were excluded due to DCM GCEP concerns
      of suspect data in accordance with other publications from this author group as described
      in the DCM GCEP Specification Document (Shi et al., 2023, PMID: 36657711).
    explanation: Reason the founding genetic evidence was excluded.
    quote_role: REVIEW_SYNTHESIS
  - reference: CGGV:assertion_17572620-69e6-4e55-9d4f-bc4ff78f452b-2025-01-10T170000.000Z
    reference_title: VEZF1 / dilated cardiomyopathy (No Known Disease Relationship)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: No convincing evidence for a causal role for VEZF1 for AD DCM has been reported.
    explanation: Current expert conclusion.
    quote_role: REVIEW_SYNTHESIS
- discussion_id: vezf1_cardiomyocyte_autonomous_or_vascular
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the cardiac phenotype cardiomyocyte-autonomous, or does it arise partly through
    VEZF1's better-established role in the vasculature?
  attaches_to:
  - pathophysiology#Reduced Transcription of Cardiomyocyte Contractile and Growth Targets
  - pathophysiology#Impaired Cardiomyocyte Contractile Function and Compensatory Growth
  - pathophysiology#Reduced Cardiomyocyte Growth
  rationale: >-
    Experimental Vezf1 depletion affects cardiomyocyte gene expression and function, but
    whole-larva knockdown also changes vascular development. Mouse embryonic stem-cell
    differentiation experiments link Vezf1 loss to elevated Cited2, reduced proangiogenic
    gene activation and impaired tube formation; Cited2 reduction partly rescues this defect.
    These data describe potential cell-type contributions, not an established vascular
    mechanism in human CMD1OO.
  proposed_experiments:
  - experiment_id: vezf1_conditional_knockout_lineage
    name: Compare cardiomyocyte-restricted and endothelial-restricted Vezf1 loss
    description: >-
      Compare cardiomyocyte-restricted and endothelial-restricted Vezf1 perturbations,
      with lineage-specific rescue and cardiac functional readouts. Such experiments would
      separate contributions in models; human gene-disease validation would remain a separate
      requirement.
  evidence:
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We cannot thus rule out that Vezf1-mediated regulation of endothelial cell -derived
      factors, such as ET-1, may have had effect on the observed cardiac phenotype, such
      as reduced cardiac growth in the zebrafish
    explanation: Authors explicitly retain an endothelial contribution.
  - reference: PMID:29794136
    reference_title: >-
      The transcription factor Vezf1 represses the expression of the antiangiogenic factor
      Cited2 in endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The repression of Cited2 in Vezf1−/sh ECs largely rescued the defective tube formation on Matrigel
    explanation: Cited2 reduction rescues an endothelial differentiation phenotype in vitro, not human DCM.
  - reference: PMID:29794136
    reference_title: >-
      The transcription factor Vezf1 represses the expression of the antiangiogenic factor
      Cited2 in endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data confirm that expression of Cited2 is not regulated by Dnmt3b or changes
      in DNA methylation at its CpGi and support the direct role of Vezf1 in regulating
      Cited2 expression.
    explanation: The full text does not support a Dnmt3b-mediated explanation for this Cited2 effect.
notes: >-
  CMD1OO and Cardiomyopathy Dilated 100 identify the same historical catalog entry. Retention
  of its identifier does not endorse VEZF1 as an established DCM gene. Reduced VEZF1 expression
  in acquired human heart disease is observational evidence, not proof of inherited VEZF1
  disease. No VEZF1-specific clinical trial, validated natural-history estimate or targeted
  treatment is established by the sources reviewed here.

      The GeneReviews overview exists to set out the proband evaluation strategy
      for nonsyndromic dilated cardiomyopathy, which is the workup this entity
      enters through. Graded OTHER because the source is an expert overview.
- name: Whole-Exome Sequencing
  description: >-
    The entity was defined by whole-exome sequencing of a family, and that
    remains the only route to the specific diagnosis. Note that VEZF1 is not on
    most established cardiomyopathy gene panels, so a panel-negative familial
    DCM is where this entity would be found if it is found at all.
  evidence:
  - reference: PMID:36657711
    reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this investigation, whole-exome sequencing and bioinformatics analyses
      were conducted in a family suffering from DCM
    explanation: >-
      The method by which the entity was identified.
treatments:
- name: Cascade Genetic Testing and Surveillance of At-Risk Relatives
  description: >-
    The highest-yield action this entity supports, and the one most specific to
    it. Once the familial variant is known, first-degree relatives can be tested
    directly; a relative of a carrier has a 50% prior, and on the single
    available pedigree penetrance was complete, so a genotype-positive relative
    should be assumed to be at risk rather than reassured. Genotype-positive
    relatives then need longitudinal cardiac surveillance so that ventricular
    dysfunction is caught before it presents as heart failure or sudden death,
    and genotype-negative relatives can be released from it.
  treatment_term:
    preferred_term: cascade genetic testing and genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  target_phenotypes:
  - preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
  evidence:
  - reference: PMID:20301486
    reference_title: "Dilated Cardiomyopathy Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      relatives of a proband with DCM to inform cardiac surveillance and allow
      early detection and treatment of DCM to improve long-term outcome
    explanation: >-
      The GeneReviews dilated cardiomyopathy overview states the purpose of
      genetic risk assessment in at-risk relatives, which is what this
      intervention delivers. Graded OTHER because the source is an expert
      overview rather than a primary study.
  - reference: PMID:36657711
    reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nonsense mutation was validated by Sanger sequencing and segregated
      with autosome-dominant DCM in the family with complete penetrance.
    explanation: >-
      Establishes the dominant transmission and complete penetrance that make
      cascade testing informative in this entity specifically.
  notes: >-
    Carries no `target_mechanisms`. Testing and surveillance are diagnostic and
    monitoring actions, not therapeutic ones acting on a pathograph node. Note
    also that the complete penetrance figure comes from one pedigree and should
    not be quoted to a family as a general penetrance estimate.
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Management is the standard treatment of dilated cardiomyopathy and heart
    failure with reduced ejection fraction. There is nothing VEZF1-specific: no
    disease-modifying therapy exists for the transcriptional defect, and no
    treatment study has been reported in a carrier.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  notes: >-
    No evidence block and no `target_mechanisms`. Neither the founding report
    nor the model-organism study addresses treatment, and citing a general
    heart-failure guideline here would present it as though it were about this
    entity. Recorded because it is what a carrier actually receives.
- name: Cardiac Transplantation
  description: >-
    The endpoint option for a dilated cardiomyopathy that progresses to
    refractory heart failure. As with pharmacotherapy, nothing here is specific
    to this entity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  notes: >-
    No evidence block, for the same reason as the pharmacotherapy entry.
discussions:
- discussion_id: vezf1_dcm_gene_validity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is VEZF1 established as a dilated cardiomyopathy gene, or is this still a
    single-family candidate?
  attaches_to:
  - pathophysiology#VEZF1 Nonsense Variant Abolishes Transcriptional Transactivation
  rationale: >-
    The whole entity rests on one report of one family with one nonsense allele,
    plus a dual-luciferase assay. The supporting evidence is good of its kind:
    segregation at complete penetrance, absence from 200 unrelated DCM patients,
    400 controls, dbSNP, HGMD and gnomAD, and a measured loss of transactivation
    at two DCM-relevant promoters. But there is no second family, no case
    series, and no ClinGen gene-disease validity assertion for VEZF1 in any
    cardiomyopathy. On the ClinGen framework this is the shape of evidence that
    would classify as Limited or at most Moderate, not Definitive. That matters
    for how a VEZF1 variant found on a research exome should be reported, and it
    is why the trigger and its two downstream nodes carry
    `mechanism_confidence: PROVISIONAL` while the final structural node, which
    is generic dilated cardiomyopathy, does not.
  proposed_experiments:
  - experiment_id: vezf1_dcm_cohort_replication
    name: Look for further VEZF1 loss-of-function alleles in DCM cohorts
    description: >-
      Query large sequenced familial dilated cardiomyopathy cohorts for rare
      VEZF1 loss-of-function alleles and test segregation. VEZF1 is absent from
      most established cardiomyopathy gene panels, so replication requires
      exome or genome data rather than panel data, and the absence of further
      reports since 2023 may reflect that nobody has looked rather than that
      nobody has found.
  evidence:
  - reference: PMID:36657711
    reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this investigation, whole-exome sequencing and bioinformatics analyses
      were conducted in a family suffering from DCM
    explanation: >-
      The single family that the entity rests on.
  - reference: PMID:36657711
    reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, due to pronounced genetic heterogeneity, the genetic defects
      underpinning DCM in most cases remain obscure.
    explanation: >-
      The authors' own framing of the field, which is why single-family
      attributions are common in DCM and why replication matters.
- discussion_id: vezf1_cardiomyocyte_autonomous_or_vascular
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the cardiac phenotype cardiomyocyte-autonomous, or does it arise partly
    through VEZF1's better-established role in the vasculature?
  attaches_to:
  - pathophysiology#Reduced Transcription of Cardiomyocyte Contractile and Growth Targets
  - pathophysiology#Impaired Cardiomyocyte Contractile Function and Compensatory Growth
  rationale: >-
    This entry models the disease as a cardiomyocyte transcription-factor
    defect, because that is what the two direct measurements support: the human
    variant fails to transactivate MYH7, and the zebrafish work identifies
    cardiomyocyte Myh7 as the key target with an MCAT box and TEAD-1 as partner.
    But VEZF1 was characterized first, and is still best characterized, as a
    vascular-development factor. It is required for endothelial differentiation,
    and it represses the antiangiogenic factor Cited2 in endothelial cells. The
    zebrafish experiment is a whole-organism knockdown and the human allele is
    germline, so neither excludes an endothelial or microvascular contribution
    to the cardiac phenotype. Distinguishing these is not a technicality: a
    myocyte-autonomous transcriptional defect and a microvascular
    developmental defect predict different natural histories and different
    things about whether the myocardium can be supported.
  proposed_experiments:
  - experiment_id: vezf1_conditional_knockout_lineage
    name: Compare cardiomyocyte-restricted and endothelial-restricted Vezf1 loss
    description: >-
      Generate cardiomyocyte-specific and endothelial-specific conditional Vezf1
      knockouts and compare cardiac growth, contractile reserve and Myh7
      expression. If the myocyte-restricted animal reproduces the phenotype the
      cardiomyocyte-autonomous model in this entry is correct; if only the
      endothelial-restricted or the combined animal does, the pathograph needs
      an endothelial node.
  evidence:
  - reference: PMID:31911272
    reference_title: Vezf1 regulates cardiac structure and contractile function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We further identify a key role for an MCAT binding site in the Myh7
      promoter regulating the response to Vezf1 knockdown and show that TEAD-1
      is a binding partner of Vezf1.
    explanation: >-
      The cardiomyocyte-autonomous evidence, which is mechanistically specific
      but was obtained in primary cardiomyocytes rather than in vivo.
  - reference: PMID:29794136
    reference_title: The transcription factor Vezf1 represses the expression of the antiangiogenic factor Cited2 in endothelial cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Compared with WT ESCs, Vezf1-/- ESCs inefficiently differentiated into
      endothelial cells (ECs), which exhibited defects in the tube-formation
      assay.
    explanation: >-
      The competing endothelial role. Graded PARTIAL because it establishes the
      alternative lineage requirement without bearing directly on the cardiac
      phenotype.
notes: >-
  Entry-type decision: DISEASE. MONDO:0859381 is a leaf with no descendants.
  Unusually for this queue, the stub carries NO `genes:` block, because MONDO
  records no causal-gene relationship for this term. Identity was therefore
  resolved through the stub's MONDO xrefs rather than by asking MONDO for a
  gene: MONDO:0859381 carries `OMIM:620247` and `MEDGEN:1840927`, and the
  MedGen record supplies the gene (VEZF1, 17q22), the OMIM designation, the
  disease definition and the source citation (Shi et al., 2023, PMID:36657711).


  THE NAME IS A TRAP. The OMIM designation is CMD1OO, with two capital letter
  Os continuing the alphabetical suffix series (CMD1A, CMD1B, ... CMD1NN,
  CMD1OO). The MONDO and MedGen labels render it "cardiomyopathy, dilated, 100",
  reading the letters as digits. This is NOT the hundredth numbered dilated
  cardiomyopathy locus. Both spellings are recorded in `synonyms` so a search
  on either finds this entry, and the disease_term keeps the MONDO label
  unchanged.


  Named-entity check: `just preflight-dr` returns SKIP for this MONDO term
  because MONDO records no causal gene, so the automated gene-frequency check
  cannot discriminate. The manual check specified for a SKIP verdict was
  performed instead: the OMIM xref on the MONDO term (620247) matches the OMIM
  identifier in the MedGen record, and the gene named there (VEZF1) is the gene
  of the deep-research report and of every reference cited here. The report's
  own gene tally, which the SKIP verdict still prints, is consistent
  (VEZF1=49, then MYH7=10 and TEAD1=8, which are the two mechanism partners
  curated here rather than rival disease genes).


  Deep research provenance: the falcon report reached the same causal chain
  independently but could NOT recover the variant details, listing HGVS
  nomenclature, variant class and functional effect of the human allele as
  fields to leave null pending inspection of the original article. Those
  details are curated here because they are in the abstract of PMID:36657711,
  which was fetched directly. This is worth recording because it is the
  opposite of the usual failure mode: the report under-claimed rather than
  over-claimed.


  OMIM's clinical synopsis, as surfaced through MedGen, additionally lists
  atrial septal defect, second-degree atrioventricular block, premature
  ventricular contraction and reduced left ventricular ejection fraction. None
  of these is curated as a phenotype here, because the only primary source is
  abstract-only and its abstract does not mention them, and MedGen and OMIM are
  not citable reference prefixes in this repository. They are recorded here so
  a later curator with full-text access knows what to look for rather than
  re-deriving the gap.


  Module conformance: three nodes declare `conforms_to` against
  `cardiomyopathy_maladaptive_remodeling` (Primary Cardiomyocyte Insult,
  Progressive Contractile Dysfunction, Structural Cardiac Impairment and Heart
  Failure). Conformance is not inheritance, so the disease-specific content is
  duplicated in full. The module's Neurohormonal Activation and Ventricular
  Remodeling nodes are deliberately NOT conformed to: nothing in the VEZF1
  literature measures either in this disease, and asserting conformance on the
  strength of the general DCM pathway would be inheriting the module rather
  than declaring agreement with it.


  No frequency values are asserted on any phenotype. The entity is one family
  and no denominator exists.


  GeneReviews has no VEZF1-specific chapter, but the disease-level "Dilated
  Cardiomyopathy Overview" (PMID:20301486) does apply and is tagged and mined
  here, on both the cascade-testing treatment and the echocardiography
  diagnosis entry. This follows the precedent set by the numbered-series peers
  `Dilated_Cardiomyopathy_1AA` and `Dilated_Cardiomyopathy_1EE`, which are in
  the same position of having no gene-specific chapter. An earlier draft of
  this entry asserted that no GeneReviews baseline existed at all, which was
  true only of a gene-specific chapter and is corrected here. Orphanet has no
  entry keyed to this concept, so no ORPHA reference is cited. `just refresh-orphadata` is currently failing on a drifted sha256 in
  this repository and was not run.

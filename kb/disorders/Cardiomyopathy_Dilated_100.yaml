    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A cardiomyopathy multigene panel that includes the genes with a ClinGen classification
      of definitive, strong, or moderate (as listed in Table 2) is most likely to identify
      the genetic cause of the condition while also limiting identification of variants
      of uncertain significance and pathogenic variants in genes that do not explain the

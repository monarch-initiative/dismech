  evidence:
  - reference: PMID:36657711
    reference_title: VEZF1 loss-of-function mutation underlying familial dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this investigation, whole-exome sequencing and bioinformatics analyses were conducted
      in a family suffering from DCM, and a novel heterozygous mutation in the VEZF1 gene
      (coding for a zinc finger-containing transcription factor critical for cardiovascular
      development and structural remodeling), NM_007146.3: c.490A > T; p.(Lys164*), was
      identified.
    explanation: Historical allele identification; not accepted human causal evidence.

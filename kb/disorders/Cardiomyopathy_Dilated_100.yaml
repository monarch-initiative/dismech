name: Cardiomyopathy Dilated 100
creation_date: "2026-08-27T00:00:00Z"
category: Genetic
synonyms:
- CMD1OO
- cardiomyopathy, dilated, 1OO
- CMD100
- VEZF1-related dilated cardiomyopathy
- VEZF1 familial dilated cardiomyopathy
disease_term:
  preferred_term: cardiomyopathy, dilated, 100
  term:
    id: MONDO:0859381
    label: cardiomyopathy, dilated, 100
description: >-
  CMD1OO is the VEZF1-attributed member of the numbered familial dilated
  cardiomyopathy series (OMIM 620247). VEZF1 encodes vascular endothelial zinc
  finger 1, a zinc-finger transcription factor originally characterized in
  vasculogenesis and angiogenesis. What makes this entity mechanistically
  distinct from most of the series is that the lesion is not in the contractile
  apparatus at all: it is in a transcription factor that sets how much
  contractile protein a cardiomyocyte makes. The reported disease allele,
  c.490A>T p.(Lys164*), truncates the protein early, and a dual-luciferase
  assay showed the mutant fails to transactivate the promoters of MYH7 and ET1,
  two genes already implicated in DCM.


  The zebrafish and cell work fills in what that loss does to a heart. Vezf1
  expression is reduced in diseased human and mouse myocardium; knocking it
  down in zebrafish reduces cardiac growth and blunts the ventricular
  contractile response to beta-adrenergic stimulation; and the effect runs
  through cardiomyocyte Myh7/beta-MHC, with an MCAT box in the Myh7 promoter
  and TEAD-1 as a binding partner. One negative result in that study is
  informative rather than incidental: calcium transient kinetics are NOT
  disturbed, which places the defect at the contractile apparatus and its
  transcriptional supply rather than in excitation-contraction coupling.


  From there the disease joins the conserved final common pathway that every
  cardiomyopathy converges on, and this entry declares `conforms_to` against
  `cardiomyopathy_maladaptive_remodeling` at three nodes rather than
  re-deriving the neurohormonal and remodeling chain.


  Two cautions belong up front. First, the name is a trap. The OMIM designation
  is CMD1**OO**, with two letter Os continuing the alphabetical series, and it
  is the label "cardiomyopathy, dilated, 100" that misreads them as digits.
  This is not the hundredth numbered dilated cardiomyopathy locus. Second, the
  evidence base is one family. A single nonsense allele segregating with
  autosomal dominant DCM at complete penetrance, absent from 200 unrelated DCM
  patients, 400 controls and the population databases, plus a reporter assay.
  There is no ClinGen gene-disease validity assertion for VEZF1 and no second
  reported family, so the gene-disease relationship should be read as provisional.

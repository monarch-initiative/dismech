  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The historical candidate initiating alteration is the heterozygous nonsense allele
    p.Lys164Ter. Its relationship to human DCM is unestablished because ClinGen excluded
    the defining genetic study. This node records the reported physical alteration, separately
    from the reported functional assay.

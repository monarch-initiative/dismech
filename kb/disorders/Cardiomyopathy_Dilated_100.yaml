  species: Zebrafish
  genotype: vezf1 morpholino knockdown
  publication: PMID:31911272
  description: >-
    The only in vivo model bearing on the cardiac phenotype. Knocking down the
    zebrafish ortholog reduces cardiac growth and blunts the ventricular
    contractile response to beta-adrenergic stimulation, while leaving
    cardiomyocyte calcium transient kinetics intact.
  modeled_mechanisms:
  - target: Impaired Cardiomyocyte Contractile Function and Compensatory Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces both halves of the cellular node, the contractile deficit and
      the failure of compensatory growth, and localizes the lesion by showing
      calcium handling is spared.
    limitations: >-
      A knockdown in a fish, not the human nonsense allele in a mammal, and the
      readout is larval cardiac function rather than the adult-onset dilated
      cardiomyopathy of the reported family. Morpholino knockdown also depletes
      the protein globally, so a cardiomyocyte-autonomous interpretation is not
      established: VEZF1 is primarily a vascular-development factor and an
      endothelial contribution to the cardiac phenotype has not been excluded.

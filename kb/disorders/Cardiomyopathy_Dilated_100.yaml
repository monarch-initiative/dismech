pathophysiology:
- name: VEZF1 Nonsense Variant Abolishes Transcriptional Transactivation
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion is a heterozygous nonsense variant, c.490A>T
    p.(Lys164*), truncating vascular endothelial zinc finger 1 partway through
    the protein. VEZF1 is a zinc-finger transcription factor, so the functional
    consequence is measured as a loss of transactivation rather than as a
    structural defect: in a dual-luciferase reporter system the mutant protein
    failed to drive the promoters of MYH7 and ET1, both of which are already
    implicated in dilated cardiomyopathy. This is why the entity sits apart
    mechanistically from the sarcomeric members of the numbered series, where
    the lesion is in the contractile machinery itself.

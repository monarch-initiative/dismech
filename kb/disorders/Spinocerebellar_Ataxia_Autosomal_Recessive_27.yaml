    snippet: "The mechanism of pathogenicity is reported to be loss of function as the probands affected with cerebellar ataxia all have biallelic nonsense or frameshift variants in GDAP2"
    explanation: ClinGen expert-panel summary that all reported alleles are truncating, supporting loss of function.
  downstream:
  - target: Impaired Neuronal Stress Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed from the Drosophila knockdown; how GDAP2 protects against
      stress is unknown.
- name: Impaired Neuronal Stress Response
  biological_scale: CELLULAR
  description: >-
    In Drosophila, Gdap2 expression changes after stress, and ubiquitous Gdap2
    knockdown makes flies die much sooner on paraquat (oxidative stress) and
    slightly sooner on starvation. The authors propose that defective stress
    handling contributes to the neurological phenotype. Cleaved-caspase-3
    staining did not show increased neurodegeneration in knockdown fly
    brains, so the authors read the reduced survival as neuronal dysfunction
    rather than cell loss at that stage. This node rests on invertebrate data
    only.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: DECREASED
  - preferred_term: response to starvation
    term:
      id: GO:0042594
      label: response to starvation
    modifier: DECREASED
  evidence:
  - reference: PMID:30084953
    reference_title: "GDAP2 mutations implicate susceptibility to cellular stress in a new form of cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Gdap2 expression levels responded to stress treatments in control flies, and Gdap2 knockdown flies showed increased sensitivity to deleterious effects of stressors such as reactive oxygen species and nutrient deprivation."
    explanation: Stress hypersensitivity in Gdap2 knockdown flies, the basis of this node; indirect because it is an invertebrate model.
  - reference: PMID:30084953
    reference_title: "GDAP2 mutations implicate susceptibility to cellular stress in a new form of cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This suggests that the decreased lifespan of the GDAP2 knockdown models upon stress might, at this stage, be a consequence of neuronal dysfunction instead of neuronal degeneration."
    explanation: The authors' own caveat that the fly phenotype reflects dysfunction rather than demonstrated neuron loss.
  downstream:
  - target: Cerebellar Purkinje Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link from stress susceptibility to the neuron loss seen at
      autopsy; not demonstrated.
  - target: Extracerebellar Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link to the degeneration of thalamic, nigral and pyramidal
      tract structures; not demonstrated.

- name: Extracerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >-
    At autopsy, degeneration extended to the thalamus, substantia nigra and
    pyramidal tracts, which the authors propose underlies the non-cerebellar
    motor features. Global cerebral atrophy accompanies the cognitive decline
    on imaging. Tau tangles in the hippocampus and amygdala were classed as
    primary age-related tauopathy, so they are not attributed to GDAP2 here.

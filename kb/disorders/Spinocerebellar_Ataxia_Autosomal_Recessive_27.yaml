name: Spinocerebellar Ataxia, Autosomal Recessive 27
creation_date: "2026-11-07T11:30:26Z"
category: Mendelian
synonyms:
- SCAR27
- autosomal recessive cerebellar ataxia 27
- GDAP2-related cerebellar ataxia
description: >-
  Spinocerebellar ataxia, autosomal recessive 27 (SCAR27) is an ultra-rare,
  adult-onset, slowly progressive cerebellar ataxia caused by biallelic
  loss-of-function variants in GDAP2 (ganglioside-induced
  differentiation-associated protein 2). Every reported disease allele is a
  nonsense, frameshift or premature-stop variant, homozygous or compound
  heterozygous. Ataxia and cerebellar dysarthria begin in the fourth or fifth
  decade, and dysarthria can be the presenting sign. Gaze-evoked nystagmus,
  jerky pursuit and hypermetric saccades, limb dysmetria, lower-limb
  spasticity with brisk reflexes, mild cervical dystonia and later cognitive
  decline follow; several patients have become wheelchair-dependent in their
  fifties. MRI shows superior-predominant cerebellar atrophy and later global
  cerebral atrophy, although it was normal in one patient after four years of
  dysarthria. In the one autopsied patient, degeneration involved the
  cerebellum (with severe diffuse Purkinje cell loss), the inferior olive,
  thalamus, substantia nigra and pyramidal tracts. GDAP2 function is poorly
  understood. The only functional model, Drosophila Gdap2 knockdown, shows
  shortened lifespan, motor deficits and heightened sensitivity to oxidative
  stress and starvation, which has led to the proposal that neurons lacking
  GDAP2 handle cellular stress poorly; that link has not been tested in human
  or mammalian neurons.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis rests on biallelic GDAP2 variants found by exome sequencing or
    an adult-onset hereditary ataxia gene panel, after repeat-expansion
    ataxias have been excluded. A normal MRI does not exclude it.
  evidence:
  - reference: PMID:40469082
    reference_title: "Autosomal Recessive Cerebellar Ataxia-27 Caused by a Novel Loss-of-Function Variant of Ganglioside-Induced Differentiation Associated Protein 2 in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied the virtual gene panel of hereditary ataxia with onset in adulthood (version 4.15) of PanelApp by means of whole exome sequencing."
    explanation: Diagnostic route used in the Spanish patient.
  - reference: PMID:42633453
    reference_title: "Progressive Slurred Speech as an Atypical Presentation of GDAP2-Related Spinocerebellar Ataxia: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report emphasizes the importance of considering hereditary ataxias in the differential diagnosis of progressive dysarthria, even in the absence of striking ataxic signs or neuroimaging abnormalities."
    explanation: Diagnosis can require genetic testing when MRI is normal.
animal_models:
- name: Drosophila Gdap2 knockdown
  species: Drosophila melanogaster
  genotype: Ubiquitous Gdap2 RNAi (two independent lines)
  publication: PMID:30084953
  description: >-
    Ubiquitous knockdown of the fly GDAP2 orthologue shortens lifespan,
    impairs righting, walking and flight, and greatly increases mortality on
    paraquat and slightly on starvation.
  modeled_mechanisms:
  - target: Impaired Neuronal Stress Response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Stress hypersensitivity of knockdown flies.
    limitations: >-
      Ubiquitous RNAi knockdown in an invertebrate rather than a null allele
      in neurons; survival was measured at the whole-organism level and
      increased neuronal apoptosis was not shown, so the neuronal locus of the
      stress defect is inferred.
    evidence:
    - reference: PMID:30084953
      reference_title: "GDAP2 mutations implicate susceptibility to cellular stress in a new form of cerebellar ataxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Gdap2 expression levels responded to stress treatments in control flies, and Gdap2 knockdown flies showed increased sensitivity to deleterious effects of stressors such as reactive oxygen species and nutrient deprivation."
      explanation: Supports the model as informative for the stress-response node.
  - target: Progressive Cerebellar Ataxia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Motor deficits (righting, walking, flight) in knockdown flies.
    limitations: >-
      Fly locomotor deficits are not cerebellar ataxia, the fly has no
      cerebellum, and neurodegeneration was not demonstrated in the model.
    evidence:
    - reference: PMID:30084953
      reference_title: "GDAP2 mutations implicate susceptibility to cellular stress in a new form of cerebellar ataxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ubiquitous knockdown of Drosophila Gdap2 resulted in shortened lifespan and motor behaviour anomalies such as righting defects, reduced and uncoordinated walking behaviour, and compromised flight."
      explanation: Locomotor phenotype in the knockdown model.
discussions:
- discussion_id: scar27_gdap2_function
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#GDAP2 Loss of Function
  - pathophysiology#Impaired Neuronal Stress Response
  prompt: >-
    What does GDAP2 do in human neurons, and does its loss make them
    vulnerable to oxidative or metabolic stress?
  rationale: >-
    The stress-susceptibility mechanism rests on one Drosophila RNAi model.
    GDAP2 has a macro domain and a CRAL-TRIO domain but no demonstrated
    biochemical activity, and no mammalian loss-of-function model of the
    ataxia has been reported. Why a protein without known neuron-restricted
    expression causes adult-onset, cerebellum-predominant degeneration is
    unexplained.
  evidence:
  - reference: PMID:30084953
    reference_title: "GDAP2 mutations implicate susceptibility to cellular stress in a new form of cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, Gdap2 knockdown in Drosophila and GDAP2 loss-of-function mutations in humans lead to locomotor phenotypes, which may be mediated by altered responses to cellular stress."
    explanation: The authors frame the stress link as a possibility, not a demonstrated mechanism.
- discussion_id: scar27_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Cerebellar Purkinje Cell Degeneration
  prompt: >-
    Does the Drosophila Gdap2 knockdown phenotype tell us anything about the
    Purkinje cell loss seen in patients?
  rationale: >-
    Patients show Purkinje cell loss and progressive cerebellar atrophy,
    while the only functional model is an invertebrate without a cerebellum
    in which increased neuronal death was not detected. A neuron-specific or
    cerebellar mammalian knockout, or patient-derived neurons, would be
    needed to test whether stress susceptibility causes the human lesion.
  evidence:
  - reference: PMID:30084953
    reference_title: "GDAP2 mutations implicate susceptibility to cellular stress in a new form of cerebellar ataxia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This suggests that the decreased lifespan of the GDAP2 knockdown models upon stress might, at this stage, be a consequence of neuronal dysfunction instead of neuronal degeneration."
    explanation: The model did not reproduce neuron loss.
notes: >-
  No GeneReviews chapter or disease-specific treatment exists for SCAR27;
  management is supportive and no treatment is curated. Fewer than ten
  patients had been reported by 2026. Nerve conduction studies were normal
  where tested, so peripheral neuropathy is not part of the reported
  phenotype. A rodent study of GDAP2 overexpression in hippocampal neurons and
  silkworm GDAP2 knockouts are not used here: overexpression is the opposite
  of the patients' loss of function, and the silkworm studies concern
  development and longevity, not neurodegeneration. GDAP2 is annotated to the
  lysosomal membrane only from a high-throughput assay, which is too weak to
  place the mechanism at the lysosome.

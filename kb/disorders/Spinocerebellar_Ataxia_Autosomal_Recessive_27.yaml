pathophysiology:
- name: GDAP2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic nonsense, frameshift or premature-stop variants are expected to
    abolish GDAP2 protein. GDAP2 carries a macro domain and a CRAL-TRIO
    (Sec14-like) domain, but its biochemical activity is not known, so no
    molecular function is bound here.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline null variants, homozygous or compound heterozygous.

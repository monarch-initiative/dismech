name: Acromesomelic Dysplasia Demirhan Type
synonyms:
- Acromesomelic dysplasia 3
- Grebe dysplasia, BMPR1B-related
- Acromesomelic chondrodysplasia with genital anomalies
- AMDD
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Acromesomelic dysplasia Demirhan type is the receptor-side counterpart of Grebe
  dysplasia: an autosomal recessive acromesomelic chondrodysplasia caused by
  biallelic loss-of-function variants in BMPR1B, the type I bone morphogenetic
  protein receptor that GDF5 binds with high affinity. The limb phenotype is
  Grebe-like, with fibular aplasia, severe brachydactyly, ulnar deviation of the
  hands, and fusion of carpal and tarsal bones. What sets it apart from the
  GDF5-related disorders, and is the reason the 2023 ISDS nosology keeps it as a
  separate group-16 entity, is the additional genital involvement reported in the
  index case: uterine hypoplasia with ovarian dysfunction and hypergonadotrophic
  hypogonadism. Genital anomalies are not obligate, and OMIM accordingly titles
  the entity "with or without genital anomalies". The disorder is mechanistically
  distinct from the dominant BMPR1B brachydactylies: those arise from
  dominant-negative missense alleles, whereas the Demirhan-type alleles are
  straightforward loss of function, which is why heterozygous carriers here show
  at most mild brachydactyly or no phenotype at all.
disease_term:
  preferred_term: acromesomelic dysplasia, Demirhan type
  term:
    id: MONDO:0012274
    label: acromesomelic dysplasia 3
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 16 "Acromesomelic dysplasias"; listed as "Grebe
      dysplasia, BMPR1B-related" (OMIM 609441). The 2019 revision
      (PMID:31633310) placed the same entity in group 16 under the older
      descriptive name.
    evidence:
    - reference: PMID:39441036
      reference_title: "Acromesomelic Dysplasia With Homozygosity for a Likely Pathogenic BMPR1B Variant: Postaxial Polydactyly as a Novel Clinical Finding."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        whereas pathogenic variants in BMPR1B can cause a Grebe dysplasia-like
        phenotype (OMIM #609441), as well as BMPR1B-related du Pan dysplasia
      explanation: >-
        A 2024 report enumerating the acromesomelic chondrodysplasia types of the
        2023 nosology revision places the OMIM 609441 entity, curated here, in
        that group.
prevalence:
- population: Consanguineous kindreds worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. The entity was founded on a single
    patient in 2005 and the reported case base since then is a handful of
    consanguineous families, described in the literature as rare cases of
    acromesomelic chondrodysplasia.
  evidence:
  - reference: PMID:37524292
    reference_title: "A novel variant in BMPR1B causes acromesomelic dysplasia Grebe type in a consanguineous Moroccan family: Expanding the phenotypic and mutational spectrum of acromesomelic dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is caused by variants in the growth differentiation factor 5 (GDF5) or,
      in rare cases, its receptor, the bone morphogenetic protein receptor-1B
      (BMPR1B).
    explanation: Characterises BMPR1B-related disease as the rare subset of an already rare disorder.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic BMPR1B loss of function is required. Heterozygous parents show mild
    brachydactyly at most, and are often entirely unaffected. This carrier
    picture is itself evidence that the alleles are loss-of-function rather than
    dominant-negative, since dominant-negative BMPR1B alleles cause brachydactyly
    type A2 in the heterozygous state.
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A loss-of-function effect of both mutations causing recessive ACD-type
      Grebe is further supported by the mild brachydactyly or even
      non-penetrance of these mutations observed in the heterozygous parents.
    explanation: >-
      The carrier phenotype in two consanguineous families supports recessive
      loss-of-function inheritance.
genetic:
- name: Biallelic BMPR1B Loss-of-Function Variants
  gene_term:
    preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported causative alleles are homozygous and include an 8 bp deletion
    (del359-366) in the index patient, the nonsense variants p.Trp219* and
    p.Arg401*, and the missense variant p.Cys53Arg. Nonsense alleles are
    predicted to trigger nonsense-mediated decay; the p.Cys53Arg receptor is
    partially mislocalised and cannot be activated by GDF5.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of BMPR1B revealed a homozygous 8 bp deletion
      (del359-366). This mutation is expected to result in a loss of function
    explanation: The founding report establishes a homozygous truncating BMPR1B allele as causative.
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present two consanguineous families with missense (c.157T>C,
      p.(C53R)) or nonsense (c.657G>A, p.(W219*)) mutations in BMPR1B.
    explanation: Extends the allelic spectrum to a missense and a second nonsense allele.
  - reference: PMID:37524292
    reference_title: "A novel variant in BMPR1B causes acromesomelic dysplasia Grebe type in a consanguineous Moroccan family: Expanding the phenotypic and mutational spectrum of acromesomelic dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified novel BMPR1B variant (c.1201C>T, p.R401*) is predicted to
      result in loss of function of the BMPR1B protein either by
      nonsense-mediated mRNA decay or production of a truncated BMPR1B protein.
    explanation: Adds a further nonsense allele and states the predicted loss-of-function route.
pathophysiology:
- name: Biallelic BMPR1B Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants on both BMPR1B alleles remove or disable the type I BMP
    receptor. Nonsense alleles are expected to be degraded by nonsense-mediated
    decay; the characterised missense allele yields a receptor that reaches the
    membrane only partially.
  genes:
  - preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the missense mutation C53R revealed that the
      mutated receptor was partially located at the cell membrane.
    explanation: Shows the receptor-level defect produced by the characterised missense allele.
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The nonsense mutation (c.657G>A, p.(W219*)) introduces a premature stop
      codon, which is predicted to be subject to nonsense-mediated mRNA decay,
      causing reduced protein translation of the mutant allele.
    explanation: Establishes transcript decay as the route by which nonsense alleles remove the receptor.
  downstream:
  - target: Failure of GDF5-Driven BMPR1B Activation
    causal_link_type: DIRECT
    description: >-
      Absent or mislocalised receptor directly prevents GDF5 from activating BMP
      signalling.
    evidence:
    - reference: PMID:24129431
      reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In contrast to the wild-type receptor, C53R mutation hindered the
        activation of the receptor by its ligand GDF5, as shown by reporter gene
        assay.
      explanation: Reporter assays demonstrate the failure of ligand-driven receptor activation.
- name: Failure of GDF5-Driven BMPR1B Activation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    This is the same central node as in the GDF5-related acromesomelic
    dysplasias, reached from the receptor side rather than the ligand side. It is
    why a BMPR1B disorder is clinically a Grebe dysplasia, and why the severity
    of BMPR1B disease tracks residual receptor function in exactly the way GDF5
    disease tracks residual ligand function.
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: BMP receptor activity
    term:
      id: GO:0098821
      label: BMP receptor activity
    modifier: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's skeletal phenotype shows an overlap with the clinical
      spectrum of the acromesomelic chondrodysplasias of the Grebe,
      Hunter-Thompson, and DuPan types caused by homozygous mutations in the gene
      coding for growth differentiation factor 5 (GDF5) which is a high-affinity
      ligand to BMPR1B.
    explanation: >-
      The founding report attributes the phenotypic overlap to the shared
      ligand-receptor pair, which is the claim this node makes.
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic severity gradient of the clinically and radiologically
      related acromesomelic chondrodysplasia spectrum of skeletal disorders may
      be due to the extent of functional impairment of the ligand-receptor pair
      GDF5-BMPR1B.
    explanation: States the dose-dependent relationship this node sits at the severe end of.
  downstream:
  - target: Failed Chondrogenic Differentiation in the Distal Limb
    causal_link_type: DIRECT
    description: >-
      Loss of receptor signalling directly removes the BMP input to chondrogenic
      differentiation.
    evidence:
    - reference: PMID:24129431
      reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        overexpression of the C53R mutation in an in vitro chondrogenesis assay
        showed no effect on cell differentiation, indicating a loss of function
      explanation: A chondrogenesis assay shows the mutant receptor cannot drive differentiation.
- name: Failed Chondrogenic Differentiation in the Distal Limb
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    Without BMPR1B signalling, the mesenchymal condensations of the distal limb
    fail to differentiate and segment normally, producing missing and fused
    skeletal elements rather than uniformly small ones.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  - preferred_term: Cartilage condensation
    term:
      id: GO:0001502
      label: cartilage condensation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      overexpression of the C53R mutation in an in vitro chondrogenesis assay
      showed no effect on cell differentiation, indicating a loss of function
    explanation: Directly measures the failure of chondrogenic differentiation.
  downstream:
  - target: Acromesomelic Appendicular Malformation
    causal_link_type: DIRECT
    description: >-
      Failed differentiation and segmentation of distal-limb condensations
      directly produces the observed skeletal malformation.
    evidence:
    - reference: PMID:24129431
      reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Homozygous affected individuals show clinical and radiographic findings
        consistent with ACD-type Grebe.
      explanation: Links the functionally characterised alleles to the skeletal outcome in the same families.
- name: Acromesomelic Appendicular Malformation
  role: consequence
  biological_scale: TISSUE
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  description: >-
    Disproportionate shortening of the appendicular skeleton that predominantly
    affects the middle and distal segments, with fibular aplasia, severe
    brachydactyly, and carpal and tarsal fusion, repeated across both hands and
    feet.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Limb morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acromesomelic chondrodysplasias (ACDs) are characterized by
      disproportionate shortening of the appendicular skeleton, predominantly
      affecting the middle (forearms and forelegs) and distal segments (hands and
      feet).
    explanation: Defines the appendicular pattern that this node represents.
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed a severe form of limb malformation consisting of aplasia of the
      fibula, severe brachydactyly, ulnar deviation of the hands, and fusion of
      carpal/tarsal bones
    explanation: Itemises the malformation in the index patient.

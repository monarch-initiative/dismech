name: Acromesomelic Dysplasia Demirhan Type
synonyms:
- Acromesomelic dysplasia 3
- Grebe dysplasia, BMPR1B-related
- Acromesomelic chondrodysplasia with genital anomalies
- AMDD
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: An autosomal recessive acromesomelic skeletal dysplasia caused by biallelic BMPR1B variants, corresponding to Grebe dysplasia, BMPR1B-related in the 2023 skeletal nosology. Severe shortening and malformation of the middle and distal limbs include brachydactyly, fibular aplasia and carpal fusion. Tarsal fusion and genital abnormalities were documented in the founding patient but are not established as universal findings. That adolescent had primary amenorrhea, hypergonadotropic hypogonadism and a hypoplastic uterus; later young or male patients do not establish adult female penetrance. Truncating alleles are predicted to reduce receptor function, whereas the C53R missense allele has directly demonstrated defective GDF5-responsive signaling. The phenotype overlaps GDF5-related dysplasia without establishing complete equivalence of ligand and receptor loss.
disease_term:
  preferred_term: acromesomelic dysplasia, Demirhan type
  term:
    id: MONDO:0012274
    label: acromesomelic dysplasia 3
parents:
- Skeletal Dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: acromesomelic_dysplasias
    notes: The 2023 Nosology of Genetic Skeletal Disorders places Grebe dysplasia, BMPR1B-related (NOS 16-0040; MIM 609441) in group 16, Acromesomelic dysplasias. Table 1 distinguishes the BMPR1B-related Du Pan entry (NOS 16-0060).
    evidence:
    - reference: url:https://files.sciconf.cn/upload/file/20240621/20240621121527_55450.pdf
      reference_title: https://files.sciconf.cn/upload/file/20240621/20240621121527_55450.pdf
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Group 16 Acromesomelic dysplasias ... NOS 16‐0040 Grebe dysplasia, BMPR1B ‐related AR BMPR1B 609441
      explanation: The actual 2023 nosology table supplies the group and gene-specific row; the intervening rows are omitted.
prevalence:
- population: Reported BMPR1B-related Grebe dysplasia families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: Published reports describe rare families, often consanguineous. No population denominator or numerical prevalence estimate is established by these reports.
  evidence:
  - reference: PMID:37524292
    reference_title: 'A novel variant in BMPR1B causes acromesomelic dysplasia Grebe type in a consanguineous Moroccan family: Expanding the phenotypic and mutational spectrum of acromesomelic dysplasias.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is caused by variants in the growth differentiation factor 5 (GDF5) or, in rare cases, its receptor, the bone morphogenetic protein receptor-1B (BMPR1B).
    explanation: Characterises BMPR1B-related disease as the rare subset of an already rare disorder.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Severe disease segregates with homozygous BMPR1B variants in the reported families. Heterozygous relatives range from apparently unaffected to mild brachydactyly. This differs from the severe recessive phenotype and does not imply that every BMPR1B missense variant is a recessive allele.
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A loss-of-function effect of both mutations causing recessive ACD-type Grebe is further supported by the mild brachydactyly or even non-penetrance of these mutations observed in the heterozygous parents.
    explanation: The carrier phenotype in two consanguineous families supports recessive loss-of-function inheritance.
genetic:
- name: Biallelic BMPR1B Loss-of-Function Variants
  gene_term:
    preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: Severe Grebe-like disease has been reported with the founding 8-bp deletion (historically del359-366; subsequently described as c.361_368delGGACCTAT), p.Trp219*, p.Arg401* and p.Cys53Arg. Transcript decay or truncated protein production is predicted for truncating alleles; patient RNA/protein studies were not reported. C53R reaches the cell surface but fails to produce the wild-type GDF5-responsive reporter signal. A separate p.Met397Arg kindred was described clinically as Hunter-Thompson type, illustrating the wider BMPR1B acromesomelic spectrum.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation analysis of BMPR1B revealed a homozygous 8 bp deletion (del359-366). This mutation is expected to result in a loss of function
    explanation: The founding report establishes a homozygous truncating BMPR1B allele as causative.
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we present two consanguineous families with missense (c.157T>C, p.(C53R)) or nonsense (c.657G>A, p.(W219*)) mutations in BMPR1B.
    explanation: Extends the allelic spectrum to a missense and a second nonsense allele.
  - reference: PMID:37524292
    reference_title: 'A novel variant in BMPR1B causes acromesomelic dysplasia Grebe type in a consanguineous Moroccan family: Expanding the phenotypic and mutational spectrum of acromesomelic dysplasias.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The identified novel BMPR1B variant (c.1201C>T, p.R401*) is predicted to result in loss of function of the BMPR1B protein either by nonsense-mediated mRNA decay or production of a truncated BMPR1B protein.
    explanation: Adds a further nonsense allele and states the predicted loss-of-function route.
  - reference: PMID:29322508
    reference_title: A novel homozygous variant in BMPR1B underlies acromesomelic dysplasia Hunter-Thompson type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequence analysis of the gene revealed a novel homozygous missense variant (c.1190T > G, p.Met397Arg) that segregates with the disease phenotype within the family
    explanation: The authors classified this additional BMPR1B family as Hunter-Thompson type; the variant effect was predicted rather than functionally measured.

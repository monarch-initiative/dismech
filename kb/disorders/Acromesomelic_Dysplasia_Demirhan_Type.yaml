      explanation: Documents uterine hypoplasia in the index patient.
mechanistic_hypotheses:
- hypothesis_group_id: bmpr1b_reproductive_role
  hypothesis_label: BMPR1B contribution to the reproductive phenotype
  status: EMERGING
  description: Loss of BMPR1B may contribute to the ovarian endocrine and uterine abnormalities documented in the founder. Null mice show impaired cumulus expansion, fertility and uterine gland formation but retain follicles and ovulation. These findings support reproductive involvement without reproducing human ovarian nonvisualization or proving a granulosa-cell-specific human pathway. A second genetic contributor in the consanguineous family remains an alternative.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, she presented with hypoplasia of the uterus and ovarian dysfunction resulting in hypergonadotrophic hypogonadism.
    explanation: The founding patient had both ovarian endocrine dysfunction and uterine hypoplasia; this case does not establish the intervening molecular mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/35456
    reference_title: The type I BMP receptor BmprIB is essential for female reproductive function - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The uterine linings were thin, and endometrial glands were absent or underdeveloped in 89% (8/9) of the mutants
    explanation: Uterine histology in Bmpr1b-null mice supports a reproductive role but cannot distinguish a direct uterine effect from secondary ovarian effects.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/35456
    reference_title: The type I BMP receptor BmprIB is essential for female reproductive function - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: No obvious abnormalities or differences in the numbers of developing follicles or corpora lutea were observed in mutant vs. WT adult mice
    explanation: Preserved follicles in null mice limit their correspondence to the human patient whose ovaries were not visualized on ultrasound.
  notes: Later reports include males and a two-year-old girl whose uterus was normal but ovaries were not assessable. These observations cannot estimate adult female penetrance. The sheep Q249R hyperprolific allele is not a model of complete receptor loss. In the null-mouse full text, aromatase mRNA reduction was not statistically significant and estradiol was not directly compared.

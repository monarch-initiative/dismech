mechanistic_hypotheses:
- hypothesis_group_id: receptor_side_ligand_loss_equivalence
  hypothesis_label: Receptor-Side Equivalence Model
  status: CANONICAL
  description: >-
    Disabling BMPR1B is mechanistically equivalent to disabling GDF5 for the
    limb skeleton, because the two act as one ligand-receptor pair, and that is
    why the BMPR1B limb phenotype is Grebe-like. Severity within BMPR1B follows
    residual receptor function in the same way it follows residual ligand
    function within GDF5.
  evidence:
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic severity gradient of the clinically and radiologically
      related acromesomelic chondrodysplasia spectrum of skeletal disorders may
      be due to the extent of functional impairment of the ligand-receptor pair
      GDF5-BMPR1B.
    explanation: States the equivalence and the dose-dependence it implies.
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to the wild-type receptor, C53R mutation hindered the
      activation of the receptor by its ligand GDF5, as shown by reporter gene
      assay.
    explanation: Shows the receptor lesion acting at the same ligand-receptor step as a GDF5 lesion.
- hypothesis_group_id: granulosa_bmpr1b_model
  hypothesis_label: Granulosa-Cell BMPR1B Model of the Genital Phenotype
  status: EMERGING
  description: >-
    The genital involvement is proposed to be a direct consequence of losing
    BMPR1B in the ovary rather than a coincidence of consanguinity. Granulosa
    cells read GDF5 and BMP4 specifically through BMPR1B, and the ovine Booroola
    FecB receptor variant alters follicle maturation, so a receptor null is
    expected to disturb folliculogenesis. Two things keep this short of
    established. The supporting data are ovine and describe a variant that
    changes rather than abolishes receptor function, and the human observation
    rests on the single index patient while later BMPR1B families were reported
    without genital anomalies. An alternative reading is that the genital
    findings are a feature of that individual or of a second locus in a
    multiconsanguineous pedigree.
  evidence:
  - reference: PMID:12773124
    reference_title: The Booroola mutation in sheep is associated with an alteration of the bone morphogenetic protein receptor-IB functionality.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      these data strongly suggest that the Q249R mutation is associated with a
      specific alteration of BMPR1B signaling in hyperprolific Booroola ewes
    explanation: Establishes that a BMPR1B variant alters ovarian signalling in vivo.
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the phenotype described here differs from GDF5 associated
      chondrodysplasias because of the additional presence of genital anomalies
      and the distinct limb phenotype.
    explanation: >-
      The human basis for the model is one patient contrasted against the GDF5
      disorders, which is what makes this emerging rather than canonical.
  notes: >-
    The two groups here are not competing accounts of one thing. The first
    covers the limb phenotype and is well supported; the second covers the
    genital phenotype and is not. They are kept separate so the confidence
    attached to the limb mechanism does not silently transfer to the ovarian
    one.

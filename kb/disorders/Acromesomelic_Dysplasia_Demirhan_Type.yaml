- name: Reduced BMPR1B-Mediated BMP Signaling
  role: central_effector
  biological_scale: MOLECULAR
  description: BMPR1B transduces BMP-family signals important in appendicular development. In the C53R expression model, GDF5 fails to induce a wild-type BMP-responsive luciferase signal. The receptor remains detectable at the membrane; impaired folding and ligand recognition are proposed explanations rather than directly assayed binding defects. Neither complete absence of receptor trafficking nor patient SMAD phosphorylation failure was established.
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast to the wild-type receptor, C53R mutation hindered the activation of the receptor by its ligand GDF5, as shown by reporter gene assay.
    explanation: GDF5-responsive reporter output was defective in transfected NIH/3T3 cells; this does not directly measure ligand binding or SMAD phosphorylation.

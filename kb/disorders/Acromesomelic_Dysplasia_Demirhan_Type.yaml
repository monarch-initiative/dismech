    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient receives hormonal substitution therapy. The diagnostics of LH, FSH, and oestradiol in the patient’s mother and two sisters revealed standard values according to their age.
    explanation: The full founding report documents hormone substitution in the affected adolescent. Drug, dose, duration and response were not reported.

  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's skeletal phenotype shows an overlap with the clinical
      spectrum of the acromesomelic chondrodysplasias of the Grebe,
      Hunter-Thompson, and DuPan types caused by homozygous mutations in the gene
      coding for growth differentiation factor 5 (GDF5) which is a high-affinity
      ligand to BMPR1B.
    explanation: >-
      The founding report attributes the phenotypic overlap to the shared
      ligand-receptor pair, which is the claim this node makes.
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic severity gradient of the clinically and radiologically
      related acromesomelic chondrodysplasia spectrum of skeletal disorders may
      be due to the extent of functional impairment of the ligand-receptor pair
      GDF5-BMPR1B.
    explanation: States the dose-dependent relationship this node sits at the severe end of.
  - reference: PMID:17381068
    reference_title: Potential involvement of BMP receptor type IB activation in a synergistic effect of chondrogenic promotion between rhTGFbeta3 and rhGDF5 or rhBMP7 in human mesenchymal stem cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      SMAD1/5/8 phosphorylation in nascent human mesenchymal stem cells (HMSCs)
      was stimulated weakly by rhGDF5 but strongly by rhBMP7.
    explanation: >-
      Establishes SMAD1/5/8 phosphorylation as the transducer engaged by GDF5 in
      a human chondrogenic system, which is the basis for annotating SMAD
      signalling on this node. Support is partial, and deliberately so: GDF5's
      own SMAD stimulation is reported as weak, so SMAD phosphorylation may not
      be the whole of how GDF5 acts here.
  downstream:
  - target: Impaired BMPR1B Signaling in Ovarian Granulosa Cells
    causal_link_type: DIRECT
    hypothesis_groups:
    - granulosa_bmpr1b_model
    description: >-
      BMPR1B is the receptor through which granulosa cells read GDF5 and BMP4,
      so removing it withdraws the same signal from the ovary that it withdraws
      from cartilage. This is the proposed explanation for the genital
      involvement that distinguishes this entity from the GDF5 disorders.
    evidence:
    - reference: PMID:12773124
      reference_title: The Booroola mutation in sheep is associated with an alteration of the bone morphogenetic protein receptor-IB functionality.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the action of ligands of the transforming growth factor-beta
        (TGFbeta)/BMP family that act through (growth and differentiation
        factor-5, BMP-4) or independently of (activin A, TGFbeta-1) BMPR1B were
        studied on primary cultures of GCs
      explanation: >-
        Establishes that granulosa cells respond to GDF5 and BMP4 specifically
        through BMPR1B, which is what makes the ovary a predicted target of
        receptor loss.
  - target: Failed Chondrogenic Differentiation in the Distal Limb
    causal_link_type: DIRECT
    description: >-
      Loss of receptor signalling directly removes the BMP input to chondrogenic
      differentiation.
    evidence:
    - reference: PMID:24129431
      reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        overexpression of the C53R mutation in an in vitro chondrogenesis assay
        showed no effect on cell differentiation, indicating a loss of function
      explanation: A chondrogenesis assay shows the mutant receptor cannot drive differentiation.
- name: Impaired BMPR1B Signaling in Ovarian Granulosa Cells
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    Granulosa cells depend on BMPR1B to transduce GDF5 and BMP4, and altering
    that receptor changes how follicles mature. The proposal is that biallelic
    BMPR1B loss withdraws the same signal from the ovary that it withdraws from
    cartilage, producing the uterine hypoplasia, ovarian dysfunction and
    hypergonadotrophic hypogonadism reported in the index patient. The
    supporting functional data are ovine, from the Booroola FecB receptor
    variant, and that variant alters follicle maturation rather than abolishing
    it; no human BMPR1B ovarian tissue has been studied. This node is therefore
    curated under a non-canonical hypothesis group, and the genital phenotype it
    explains is itself curated as occasional.
  cell_types:
  - preferred_term: Granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  - preferred_term: Ovarian follicle development
    term:
      id: GO:0001541
      label: ovarian follicle development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12773124
    reference_title: The Booroola mutation in sheep is associated with an alteration of the bone morphogenetic protein receptor-IB functionality.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The presence of the Booroola mutation was associated with a 3- to 4-fold
      (P<0.001) decreased responsiveness of GCs from FecB(B) compared with
      FecB(+) small follicles to the action of BMPR1B ligands.
    explanation: >-
      Quantifies the loss of granulosa-cell responsiveness produced by a BMPR1B
      variant, the functional basis for expecting ovarian involvement.
  - reference: PMID:12773124
    reference_title: The Booroola mutation in sheep is associated with an alteration of the bone morphogenetic protein receptor-IB functionality.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      is associated with a more precocious differentiation of ovarian granulosa
      cells (GCs)
    explanation: >-
      The ovine phenotype is altered follicle maturation, not the ovarian failure
      seen in the human index patient, which is why this is partial support for
      a hypothesis rather than an established mechanism.
  downstream:
  - target: Ovarian Dysfunction and Uterine Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - granulosa_bmpr1b_model
    description: >-
      Disturbed follicle development is proposed to produce the ovarian
      dysfunction and hypergonadotrophic hypogonadism reported in the index
      patient. The intermediate steps between granulosa-cell signalling and
      uterine hypoplasia are not established.
    evidence:
    - reference: PMID:15805157
      reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, she presented with hypoplasia of the uterus and ovarian
        dysfunction resulting in hypergonadotrophic hypogonadism.
      explanation: >-
        Documents the human endpoint. Support is partial because the report
        establishes co-occurrence with the BMPR1B genotype, not the causal chain.

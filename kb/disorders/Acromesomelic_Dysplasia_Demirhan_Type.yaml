diagnosis:
- name: Molecular Evaluation of BMPR1B and Overlapping Dysplasia Genes
  description: Interpret biallelic BMPR1B variants with the severe acromesomelic phenotype and familial segregation. The founding work excluded coding GDF5 variants before finding the BMPR1B deletion; that historical sequence does not require every present-day test to follow the same order. Distinguish severe recessive alleles from dominant brachydactyly variants and milder Du Pan-associated alleles.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation analysis of BMPR1B revealed a homozygous 8 bp deletion (del359-366). This mutation is expected to result in a loss of function
    explanation: The founding report establishes a homozygous truncating BMPR1B allele as causative.
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we present two consanguineous families with missense (c.157T>C, p.(C53R)) or nonsense (c.657G>A, p.(W219*)) mutations in BMPR1B.
    explanation: Extends the allelic spectrum to a missense and a second nonsense allele.
- name: Clinical and Skeletal Radiographic Assessment
  description: Assess the distribution of limb shortening, phalangeal and metacarpal defects, carpal and tarsal fusion, fibulae and joint alignment. The detailed founding radiographs document absent proximal index/thumb phalanges, short ulnae, tibiotalar dislocations and short femoral necks; these findings vary between families.
  evidence:
  - reference: url:https://avesis.cu.edu.tr/yayin/034022d6-aced-4a93-8ed2-163cb56fae78/a-homozygous-bmpr1b-mutation-causes-a-new-subtype-of-acromesomelic-chondrodysplasia-with-genital-anomalies/document.pdf
    reference_title: https://avesis.cu.edu.tr/yayin/034022d6-aced-4a93-8ed2-163cb56fae78/a-homozygous-bmpr1b-mutation-causes-a-new-subtype-of-acromesomelic-chondrodysplasia-with-genital-anomalies/document.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Radiographs of the lower leg (fig 2F) displayed deformed tibiae with wide proximal metaphyses and aplasia of the fibulae resulting in bilateral dislocation of the tibiotalar joints.
    explanation: Direct radiographic description from the founding patient.
- name: Pubertal, Endocrine and Pelvic Assessment
  description: The founder was evaluated for primary amenorrhea by gonadotropins, estradiol and pelvic ultrasound. Interpret ovarian nonvisualization in its age and imaging context. A normal uterus in the two-year-old C53R patient, whose ovaries could not be assessed, is not evidence of normal adult reproductive function.
  evidence:
  - reference: url:https://avesis.cu.edu.tr/yayin/034022d6-aced-4a93-8ed2-163cb56fae78/a-homozygous-bmpr1b-mutation-causes-a-new-subtype-of-acromesomelic-chondrodysplasia-with-genital-anomalies/document.pdf
    reference_title: https://avesis.cu.edu.tr/yayin/034022d6-aced-4a93-8ed2-163cb56fae78/a-homozygous-bmpr1b-mutation-causes-a-new-subtype-of-acromesomelic-chondrodysplasia-with-genital-anomalies/document.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Upon ultrasound examination, the ovaries were not present and the uterus was shown to be hypoplastic.
    explanation: Pelvic ultrasound contributed to assessment of the founding reproductive phenotype.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4023204/
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ultrasound examination of the abdomen showed a normal uterus; the ovaries could not be evaluated because of bowel gas superposition.
    explanation: The younger patient’s ovarian status remained unresolved.
treatments:
- name: Genetic Counseling
  description: Offer genetic counseling based on the molecularly established autosomal recessive severe disorder and family segregation. Heterozygous relatives may have mild brachydactyly or no apparent hand findings; variants causing dominant brachydactyly represent a different allele-specific risk.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37524292
    reference_title: 'A novel variant in BMPR1B causes acromesomelic dysplasia Grebe type in a consanguineous Moroccan family: Expanding the phenotypic and mutational spectrum of acromesomelic dysplasias.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: these findings expand the phenotypic and mutational spectrum of AMD, and may improve the diagnosis of AMD and enable appropriate genetic counselling to be offered to patients
    explanation: States genetic counselling as the management consequence of a molecular diagnosis in this disorder.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings imply that both mutations identified in human BMPR1B affect cartilage formation in a dominant-negative manner.
    explanation: Dominant-negative BMPR1B alleles cause a dominant phenotype, which is why carrier counselling here depends on the allele's functional class.
- name: Hormone Replacement for Ovarian Endocrine Dysfunction
  description: The founding adolescent with primary amenorrhea, hypergonadotropic hypogonadism and low estradiol received hormonal substitution. The report does not specify the hormones, regimen or clinical response; it supplies evidence of treatment use rather than a comparative efficacy estimate.

      label: Mus musculus
  cell_source: Mouse NIH/3T3 fibroblasts
  culture_system: Transient expression of mouse receptor constructs with a BMP-responsive firefly reporter, Renilla control and human GDF5; HA-tagged constructs for immunofluorescence.
  publication: PMID:24129431
  description: Wild-type, C53R and ligand-binding-domain-deletion receptor constructs were compared with empty-vector controls. Reporter samples were triplicate and representative of three independent experiments.
  modeled_mechanisms:
  - target: Reduced BMPR1B-Mediated BMP Signaling
    relationship: MEASURES
    description: The reporter resolves the C53R signaling defect and microscopy confirms retained surface localization.
    fidelity: MODERATE
    limitations: Overexpression in mouse fibroblasts does not establish ligand affinity, endogenous patient receptor abundance, patient phospho-SMAD levels or developmental outcomes. Folding disruption was separately predicted using a short in-vacuo molecular model.
    readouts:
    - name: GDF5-responsive luciferase
      target: Reduced BMPR1B-Mediated BMP Signaling
      direction: DECREASED
      interpretation: C53R failed to induce wild-type GDF5-responsive reporter output.
      evidence:
      - reference: PMID:24129431
        reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In contrast to the wild-type receptor, C53R mutation hindered the activation of the receptor by its ligand GDF5, as shown by reporter gene assay.
        explanation: GDF5-responsive reporter output was defective in transfected NIH/3T3 cells; this does not directly measure ligand binding or SMAD phosphorylation.
    - name: Surface HA immunofluorescence
      target: Reduced BMPR1B-Mediated BMP Signaling
      direction: DECREASED
      interpretation: Extracellular C53R signal was weaker, but surface localization persisted and the difference was absent after permeabilization; reduced delivery efficiency remains proposed.

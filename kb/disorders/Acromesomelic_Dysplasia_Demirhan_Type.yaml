      label: Hormone Replacement Therapy
  target_mechanisms:
  - target: Ovarian Endocrine Dysfunction
    treatment_effect: BYPASSES
    description: Hormonal substitution was used to compensate for the endocrine deficit in the founder; it was not shown to restore ovarian development or fertility.
    evidence:

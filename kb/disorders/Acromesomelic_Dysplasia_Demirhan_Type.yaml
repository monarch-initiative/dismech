- name: Bmpr1b-null female reproductive model
  species: Mus musculus
  genotype: Homozygous Bmpr1b-null
  background: Hybrid 129Sv × C57BL/6
  genes:
  - preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  publication: PMID:11416163
  description: Null females have severely impaired fertility, defective cumulus expansion and deficient uterine gland development. Over 30 matings across 60 weeks yielded two litters, so the phenotype is not absolute sterility. Developing follicles, corpora lutea and gonadotropin-responsive ovulation were preserved.
  modeled_mechanisms:
  - target: Ovarian Endocrine Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    description: The model supports a reproductive requirement for BMPR1B but differs substantially from the founding human ovarian phenotype.
    fidelity: LOW
    limitations: Follicles and ovulation remain present. Cyp19 mRNA showed a nonsignificant downward trend, and estradiol was not directly compared. Primary granulosa-cell versus oocyte effects are unresolved; these experiments do not establish human ovarian agenesis or a fertility treatment.
    readouts:
    - name: Ovarian follicle histology
      target: Ovarian Endocrine Dysfunction
      direction: UNCHANGED
      interpretation: Developing follicles and corpora lutea were retained despite impaired cumulus expansion and fertility.
      evidence:
      - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/35456
        reference_title: The type I BMP receptor BmprIB is essential for female reproductive function - PMC
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: No obvious abnormalities or differences in the numbers of developing follicles or corpora lutea were observed in mutant vs. WT adult mice
        explanation: Preserved follicles in null mice limit their correspondence to the human patient whose ovaries were not visualized on ultrasound.
    - name: Cumulus cell expansion
      target: Ovarian Endocrine Dysfunction
      direction: DECREASED
      interpretation: Cumulus expansion was defective despite retained follicles and ovulatory responses; the human endocrine mechanism remains unresolved.
      evidence:
      - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/35456
        reference_title: The type I BMP receptor BmprIB is essential for female reproductive function - PMC
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: were aggregated and retained fewer cumulus cells ... These data suggest that a primary cause of infertility ... is a failure in cumulus cell expansion.
        explanation: The null-mouse cumulus complexes retained fewer cells and failed to expand normally. This reproductive defect differs from the founding human endocrine presentation.

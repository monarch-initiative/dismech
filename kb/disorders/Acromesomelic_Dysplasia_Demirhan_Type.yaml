    snippet: is processed and can translocate to the cell surface in our overexpression studies, the efficiency of these processes might be reduced.
    explanation: The C53R construct retained surface localization; reduced processing or delivery was suggested from weaker extracellular staining, not directly measured.
  downstream:
  - target: Reduced Digital Prechondrogenic Cell Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Bmpr1b-null mice show reduced proliferation in the phalangeal region after normal initial digital-ray formation. This provides model-based support for a developmental consequence of impaired receptor signaling.
    evidence:
    - reference: PMID:10631182
      reference_title: The type I BMP receptor BMPRIB is required for chondrogenesis in the mouse limb.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Using molecular markers, we show that the initial formation of the digital rays occurs normally in null mutants, but proliferation of prechondrogenic cells and chondrocyte differentiation in the phalangeal region are markedly reduced.
      explanation: Targeted Bmpr1b-null mice establish cellular defects after initial digital-ray formation. Translation to human BMPR1B disease is model-based.
  - target: Impaired Digital Chondrocyte Differentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Loss of Bmpr1b reduces phalangeal chondrocyte differentiation in mice; the human developmental mechanism is inferred from this perturbation model.

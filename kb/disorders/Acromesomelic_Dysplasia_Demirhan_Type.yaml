differential_diagnoses:
- name: Acromesomelic Dysplasia, Grebe Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Grebe type
    term:
      id: MONDO:0008703
      label: acromesomelic dysplasia 2A
  description: GDF5-related Grebe dysplasia has closely overlapping skeletal findings. Molecular cause establishes the distinction; the genital findings in the BMPR1B founder are a clinical clue rather than a sensitive or universally specific discriminator.
  distinguishing_features:
  - Biallelic BMPR1B rather than GDF5 variants distinguish the molecular diagnoses.
  - Genital abnormalities occurred in the BMPR1B founder, but their absence does not exclude this diagnosis and case reports do not establish universal absence in every GDF5 disorder.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the phenotype described here differs from GDF5 associated chondrodysplasias because of the additional presence of genital anomalies and the distinct limb phenotype
    explanation: States the distinguishing features directly.
- name: Du Pan Syndrome
  disease_term:
    preferred_term: du Pan syndrome
    term:
      id: MONDO:0009231
      label: acromesomelic dysplasia 2B
  description: Du Pan dysplasia is a milder acromesomelic phenotype associated with GDF5 or BMPR1B. BMPR1B p.Arg31Cys retained more reporter activity than p.Cys53Arg, supporting an allele-dependent severity hypothesis.
  distinguishing_features:
  - The p.Arg31Cys adult had a height of 148 cm and absent fibulae, with preserved radius, ulna and femur; normal stature and preservation of every long bone are not required.
  - Residual signaling has been measured for selected alleles, but a precise functional cutoff separating Du Pan from Grebe dysplasia has not been established.
  evidence:
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: leads to a significant loss of BMPR1B function, but to a lesser extent than the previously reported p.Cys53Arg mutation that results in the more severe Grebe dysplasia
    explanation: Shows the allele-dependent split between the two BMPR1B diagnoses.
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proposita had disproportionate short stature with a height of 148 cm ( − 2.7 SD) and mild acromesomelic limb shortening.
    explanation: Measured stature in the adult BMPR1B p.Arg31Cys Du Pan case refutes an absolute normal-stature distinction.
- name: Brachydactyly Type A2
  description: The dominant BMPR1B disorder. It is caused by dominant-negative missense alleles rather than loss of function, and is the reason a heterozygous BMPR1B variant cannot be read as carrier status without knowing its functional class.
  distinguishing_features:
  - Brachydactyly type A2 is autosomal dominant and arises from dominant-negative BMPR1B missense alleles.
  - The Demirhan-type alleles are recessive loss-of-function changes whose heterozygous carriers show at most mild brachydactyly.
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In contrast, dominant-negative BMPR1B mutations described previously are associated with autosomal-dominant brachydactyly-type A2.
    explanation: States the mechanistic and inheritance contrast with the dominant BMPR1B disorder.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: An in vitro kinase assay showed that the I200K mutation is kinase-deficient, whereas the R486W mutation has normal kinase activity, indicating a different pathogenic mechanism.
    explanation: Even within dominant BMPR1B disease the alleles work differently, so a heterozygous BMPR1B variant cannot be read as carrier status for this recessive disorder without knowing its functional class.
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: is thus different from the heterozygous missense mutations in BMPR1B recently shown to cause brachydactyly type A2 through a dominant negative effect
    explanation: The founding report draws the same contrast for its truncating allele.
discussions:
- discussion_id: supportive_management_outcomes
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: What functional outcomes follow orthopedic, rehabilitative and endocrine care in severe BMPR1B-related acromesomelic dysplasia?
  rationale: Genetic counseling is discussed in the Moroccan report and hormone substitution is explicitly documented in the founding full text. The retrieved disease-specific sources do not supply the hormone regimen or response, or comparative outcomes for surgery, prostheses and rehabilitation. These are gaps in evidence, not an absence of all reported care.
- discussion_id: bmpr1b_genital_phenotype_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ovarian Endocrine Dysfunction
  - pathophysiology#Impaired Uterine Development
  prompt: Which BMPR1B-related reproductive defects recur in adequately assessed adult patients, and which tissues mediate them?
  rationale: The founding human case and Bmpr1b-null mouse reproductive phenotypes support further investigation, but the mice retain follicles and ovulation and do not reproduce confirmed human ovarian agenesis. The mouse full text reports nonsignificant aromatase mRNA differences and no direct estradiol comparison. Direct uterine effects, ovarian endocrine effects, and a possible second genetic contributor in the founder remain unresolved. Males and a prepubertal girl with unassessable ovaries cannot establish adult female penetrance.
- discussion_id: residual_signaling_and_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced BMPR1B-Mediated BMP Signaling
  prompt: How well does residual signaling predict the BMPR1B acromesomelic phenotype across alleles?
  rationale: C53R and the milder Du Pan-associated R31C allele differ in reporter activity. This supports a proposed severity-function relationship for selected alleles, not exact equivalence of GDF5 and BMPR1B loss or a validated diagnostic functional threshold.
notes: 'This entry retains the severe Demirhan/Grebe BMPR1B scope (MONDO:0012274, MIM 609441). The university-hosted PDF contains Demirhan et al., A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies (2005; PMID:15805157). The conference-hosted PDF contains Unger et al., Nosology of genetic skeletal disorders: 2023 revision (PMID:36779427), including the complete Table 1. Separate generated PMC URL caches preserve the full C53R/W219* study (PMID:24129431) and null-mouse reproductive study (PMID:11416163). The mild 2024 BMPR1B Du Pan case with polydactyly is allelic context and does not establish polydactyly in this severe Grebe entry.'

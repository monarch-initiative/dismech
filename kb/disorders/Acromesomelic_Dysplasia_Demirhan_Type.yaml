diagnosis:
- name: Molecular Confirmation of Biallelic BMPR1B Variants
  description: >-
    Sequencing BMPR1B establishes the diagnosis in a patient with a Grebe-like
    limb phenotype and no GDF5 variant. Genital anomalies, when present, raise
    the prior probability of a BMPR1B rather than a GDF5 aetiology, but their
    absence does not exclude it.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the phenotype described here differs from GDF5 associated
      chondrodysplasias because of the additional presence of genital anomalies
      and the distinct limb phenotype.
    explanation: Identifies the clinical feature that distinguishes this disorder from the GDF5 disorders.
treatments:
- name: Genetic Counseling
  description: >-
    Counselling for an autosomal recessive disorder in what are typically
    consanguineous families. Heterozygous BMPR1B variants are not automatically
    benign: dominant-negative alleles in the same gene cause brachydactyly type
    A2, so a carrier's risk depends on the functional class of the family's
    allele rather than on carrier status alone.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37524292
    reference_title: "A novel variant in BMPR1B causes acromesomelic dysplasia Grebe type in a consanguineous Moroccan family: Expanding the phenotypic and mutational spectrum of acromesomelic dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these findings expand the phenotypic and mutational spectrum of AMD, and
      may improve the diagnosis of AMD and enable appropriate genetic counselling
      to be offered to patients
    explanation: States genetic counselling as the management consequence of a molecular diagnosis in this disorder.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings imply that both mutations identified in human BMPR1B affect
      cartilage formation in a dominant-negative manner.
    explanation: >-
      Dominant-negative BMPR1B alleles cause a dominant phenotype, which is why
      carrier counselling here depends on the allele's functional class.
differential_diagnoses:
- name: Acromesomelic Dysplasia, Grebe Type
  disease_term:
    preferred_term: acromesomelic dysplasia, Grebe type
    term:
      id: MONDO:0008703
      label: acromesomelic dysplasia 2A
  description: >-
    The GDF5-related disorder with a closely overlapping limb phenotype; the two
    are separated by the causal gene and by the genital involvement.
  distinguishing_features:
  - Genital anomalies with hypergonadotrophic hypogonadism occur in the BMPR1B disorder and not in GDF5-related Grebe dysplasia.
  - Biallelic BMPR1B rather than biallelic GDF5 variants establish the diagnosis.
  evidence:
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phenotype described here differs from GDF5 associated
      chondrodysplasias because of the additional presence of genital anomalies
      and the distinct limb phenotype
    explanation: States the distinguishing features directly.
- name: Du Pan Syndrome
  disease_term:
    preferred_term: du Pan syndrome
    term:
      id: MONDO:0009231
      label: acromesomelic dysplasia 2B
  description: >-
    The mild end of the same receptor's allelic series; hypomorphic BMPR1B
    variants cause du Pan syndrome rather than this disorder.
  distinguishing_features:
  - Stature and the long bones are preserved in du Pan syndrome.
  - >-
    The BMPR1B allele determines which diagnosis results, with hypomorphic
    missense alleles giving du Pan syndrome and severe loss-of-function alleles
    giving the Grebe-like phenotype.
  evidence:
  - reference: PMID:26105076
    reference_title: A hypomorphic BMPR1B mutation causes du Pan acromesomelic dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      leads to a significant loss of BMPR1B function, but to a lesser extent
      than the previously reported p.Cys53Arg mutation that results in the more
      severe Grebe dysplasia
    explanation: Shows the allele-dependent split between the two BMPR1B diagnoses.
- name: Brachydactyly Type A2
  description: >-
    The dominant BMPR1B disorder. It is caused by dominant-negative missense
    alleles rather than loss of function, and is the reason a heterozygous
    BMPR1B variant cannot be read as carrier status without knowing its
    functional class.
  distinguishing_features:
  - Brachydactyly type A2 is autosomal dominant and arises from dominant-negative BMPR1B missense alleles.
  - The Demirhan-type alleles are recessive loss-of-function changes whose heterozygous carriers show at most mild brachydactyly.
  evidence:
  - reference: PMID:24129431
    reference_title: Homozygous missense and nonsense mutations in BMPR1B cause acromesomelic chondrodysplasia-type Grebe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, dominant-negative BMPR1B mutations described previously are
      associated with autosomal-dominant brachydactyly-type A2.
    explanation: States the mechanistic and inheritance contrast with the dominant BMPR1B disorder.
  - reference: PMID:14523231
    reference_title: Mutations in bone morphogenetic protein receptor 1B cause brachydactyly type A2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An in vitro kinase assay showed that the I200K mutation is
      kinase-deficient, whereas the R486W mutation has normal kinase activity,
      indicating a different pathogenic mechanism.
    explanation: >-
      Even within dominant BMPR1B disease the alleles work differently, so a
      heterozygous BMPR1B variant cannot be read as carrier status for this
      recessive disorder without knowing its functional class.
  - reference: PMID:15805157
    reference_title: A homozygous BMPR1B mutation causes a new subtype of acromesomelic chondrodysplasia with genital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is thus different from the heterozygous missense mutations in BMPR1B
      recently shown to cause brachydactyly type A2 through a dominant negative
      effect
    explanation: The founding report draws the same contrast for its truncating allele.
discussions:
- discussion_id: no_disease_specific_management_literature
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    What supportive, orthopaedic and rehabilitative management actually benefits
    the Demirhan type?
  rationale: >-
    The treatments section is deliberately limited to genetic counselling, which
    is the one intervention the published literature for this disorder actually
    documents. Reconstructive and orthopaedic surgery, prosthetics, and
    physiotherapy are all plausible for a limb malformation of this severity and
    are presumably used in practice, but a search of the indexed literature
    returned no disease-specific management report for this disorder to cite. Curating
    them from general skeletal-dysplasia practice would be inference, not
    evidence, so the gap is recorded rather than filled. A case series reporting functional outcomes after surgical or
    prosthetic management would close it. Management of the reported ovarian
    dysfunction and hypergonadotrophic hypogonadism is equally undocumented and
    is part of the same gap.
- discussion_id: bmpr1b_genital_phenotype_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the genital phenotype a consequence of BMPR1B loss, and if so why does
    ligand-side loss not produce it?
  rationale: >-
    BMPR1B binds ligands beyond GDF5, so a receptor null withdraws more BMP
    input than a GDF5 null does; that asymmetry is the natural explanation for
    an extra phenotype on the receptor side, and it has never been tested. The
    granulosa-cell model records what is known, but its functional support is
    ovine and its human support is one patient. Reporting how many
    molecularly confirmed BMPR1B probands have had a gynaecological assessment
    at all, rather than how many were noted to have anomalies, would settle
    whether the feature is rare or merely rarely looked for.
  attaches_to:
  - pathophysiology#Failure of GDF5-Driven BMPR1B Activation
  - pathophysiology#Impaired BMPR1B Signaling in Ovarian Granulosa Cells
  - phenotypes#Uterine Hypoplasia
notes: >-
  Curated as part of a review of ISDS 2023 nosology group 16 (acromesomelic
  dysplasias). The entity is named here for Demirhan, following MONDO and OMIM;
  the 2023 nosology calls the same entity "Grebe dysplasia, BMPR1B-related". No
  Orphanet structured record was cited: the pinned Orphadata snapshot in
  data/orphadata/MANIFEST.yaml no longer matches upstream, and re-pinning it
  would rewrite every ORPHA cache file in the repository.

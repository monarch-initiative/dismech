pathophysiology:
- name: CDC42 Switch II Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense substitution in CDC42, most often the recurrent de novo c.191A>G p.Tyr64Cys in the switch
    II loop, is the initiating lesion. The switch II region mediates CDC42 binding to its regulators (GEFs, GAPs,
    RhoGDI) and to effectors. The net functional class of p.Tyr64Cys is unresolved: it behaves as constitutively
    active in cell assays but as hypomorphic for effector-dependent processes in C. elegans, so no single
    functional-impact category is assigned.

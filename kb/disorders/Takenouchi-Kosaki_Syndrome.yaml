- name: Impaired Neuronal Migration and Axon Elongation
  biological_scale: CELLULAR
  description: >-
    p.Tyr64Cys moderately activates CDC42. Expressed in mouse cortical progenitors in utero it causes migration defects
    and clustering of excitatory neurons, and in cultured hippocampal neurons it impairs axon elongation; in Neuro2A
    cells it impairs neurite outgrowth. These defects are proposed to underlie the psychomotor delay, intellectual
    disability and brain malformations.

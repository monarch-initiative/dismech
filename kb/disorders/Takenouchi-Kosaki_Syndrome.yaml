- name: Dysregulated CDC42 GTPase Cycling
  biological_scale: MOLECULAR
  description: >-
    p.Tyr64Cys CDC42 shows a roughly 4,700-fold reduction in GAP-stimulated GTP hydrolysis and an almost abolished
    response to the exchange factor ITSN1, so it is held in the GTP-bound state independent of normal regulation. It
    also binds RhoGDI poorly, which normally extracts CDC42 from membranes, and escapes the KLHL23-Cul3 ubiquitin
    ligase that degrades GTP-bound CDC42; KLHL23 and RhoGDI both act on the switch II region that Tyr64 lies in.
  molecular_functions:
  - preferred_term: GTPase activity (regulator-insensitive)
    modifier: DYSREGULATED
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Each of these mutants, however, exhibited robust GAP insensitivity, showing respectively a 4,700-fold
      (CDC42Tyr64Cys)
    explanation: Quantifies GAP insensitivity of the p.Tyr64Cys mutant.
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, p.Tyr64Cys resulted in an almost completely abolished response to GEF.
    explanation: The mutant no longer responds to GEF-catalyzed exchange.
  - reference: PMID:40846997
    reference_title: "KLHL23 and RhoGDI coordinate CDC42 inactivation ensuring membrane homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, the CDC42-Y64C germline variant in Takenouchi-Kosaki Syndrome escapes KLHL23-mediated degradation.
    explanation: A second inactivation route, ubiquitin-mediated turnover of GTP-bound CDC42, fails for the mutant.
  - reference: PMID:40846997
    reference_title: "KLHL23 and RhoGDI coordinate CDC42 inactivation ensuring membrane homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KLHL23-Cul3 acts as the E3 ligase for CDC42 degradation, with KLHL23 and RhoGDI competing for CDC42's switch II
      region
    explanation: Places both inactivation routes on the switch II region carrying Tyr64.
  downstream:
  - target: Membrane Accumulation of Active CDC42
    causal_link_type: DIRECT
    description: Loss of RhoGDI binding leaves active CDC42 at the membrane.
    evidence:
    - reference: PMID:34504210
      reference_title: "Macrothrombocytopenia of Takenouchi-Kosaki syndrome is ameliorated by CDC42 specific- and lipidation inhibitors in MEG-01 cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that the Y64C mutant was concentrated at the membrane compartment due to impaired binding to Rho-GDI
        and more active than the wild-type.
      explanation: Impaired RhoGDI binding causes membrane concentration of the more active mutant.
  - target: Sensorineural Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mouse hair-cell knockouts and patient data indicate that disrupted GDP/GTP cycling in cochlear hair cells, by loss
      of function or by constitutive activation, causes sensorineural hearing loss.
    evidence:
    - reference: PMID:42567517
      reference_title: "Hearing loss associated with CDC42 in mice and humans (Takenouchi-Kosaki syndrome): CDC42 and RHOQ synergistically function in cochlear hair cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we propose that impaired and/or dysregulated cycling between GDP/inactive and GTP/active forms, through either
        loss-of-function or constitutive activation, can lead to SNHL
      explanation: Places hearing loss downstream of disrupted CDC42 cycling, from mouse, cell and patient data.
- name: Impaired CDC42 Effector Binding
  biological_scale: MOLECULAR
  description: >-
    Despite being GTP-bound, p.Tyr64Cys CDC42 binds the effector domains of PAK1, WASP, FMNL2 and IQGAP1 less well
    than wild type; in cells it co-precipitates less with PAK1/2 and N-WASP. Effector-dependent actin remodeling is
    therefore reduced even though the GTPase is active.

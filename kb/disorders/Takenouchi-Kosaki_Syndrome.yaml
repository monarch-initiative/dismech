      Recently, a heterozygous de novo mutation (p.Tyr64Cys) in the CDC42 gene, which encodes a key small GTP-binding
      protein of the Rho-subfamily, was identified in two unrelated patients with TKS.
    explanation: Establishes the recurrent de novo p.Tyr64Cys variant as the cause.
  - reference: PMID:30872706

    term:
      id: hgnc:1736
      label: CDC42
  relationship_type: CAUSATIVE
  association: Heterozygous missense variants, usually de novo
  notes: >-
    CDC42 is the MONDO (RO:0004003) and OMIM (616737) causal gene. ClinGen's Hemostasis/Thrombosis expert panel
    classifies CDC42 as Definitive for this disease under autosomal dominant inheritance. The C-terminal p.Arg186Cys
    variant is excluded from this entry (see notes).
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_95177a3a-0dca-4945-8a44-f63697739cef-2021-10-27T162623.932Z
    evidence:
    - reference: CGGV:assertion_95177a3a-0dca-4945-8a44-f63697739cef-2021-10-27T162623.932Z
      reference_title: "CDC42 / macrothrombocytopenia-lymphedema-developmental delay-facial dysmorphism-camptodactyly syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        CDC42 | HGNC:1736 | macrothrombocytopenia-lymphedema-developmental delay-facial dysmorphism-camptodactyly
        syndrome | MONDO:0014757 | AD | Definitive
      explanation: ClinGen gene-disease validity row for CDC42 and this disease.
  variants:
  - name: p.Tyr64Cys
    description: >-
      c.191A>G, the recurrent de novo hot-spot variant in the switch II loop and the variant of the founding
      reports. Insensitive to GAP and GEF, poorly bound by RhoGDI and effectors.
    evidence:
    - reference: PMID:29335451
      reference_title: "A hot-spot mutation in CDC42 (p.Tyr64Cys) and novel phenotypes in the third patient with Takenouchi-Kosaki syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, despite the heterozygous mutation of CDC42 (p.Tyr64Cys) likely being a hot-spot mutation for TKS, its
        phenotype may be variable.
      explanation: Recurrence of p.Tyr64Cys across unrelated patients.
  - name: p.Arg68Gln
    description: >-
      c.203G>A, a group I switch II variant reported in several patients with the typical TKS phenotype, including
      macrothrombocytopenia and progressive sensorineural hearing loss.
    evidence:
    - reference: PMID:42746537
      reference_title: "Case Report: Clinical phenotypes and recombinant human growth hormone therapeutic exploration for a patient with Takenouchi-Kosaki syndrome harboring the CDC42 p.Arg68Gln variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She presented with typical Takenouchi-Kosaki syndrome (TKS) manifestations, including severe growth
        retardation, characteristic craniofacial dysmorphism, persistent macrothrombocytopenia and progressive
        sensorineural hearing loss.
      explanation: Typical TKS in a p.Arg68Gln carrier.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous variants act dominantly. Almost all cases are de novo; dominant transmission has been seen for the
    group III p.Glu171Lys variant.
  evidence:
  - reference: PMID:32819561
    reference_title: "Neuropathophysiological significance of the c.1449T>C/p.(Tyr64Cys) mutation in the CDC42 gene responsible for Takenouchi-Kosaki syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Takenouchi-Kosaki syndrome (TKS) is an autosomal dominant congenital syndrome, of which pathogenesis is not well
      understood.
    explanation: States the autosomal dominant mode of inheritance.
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      co-segregating with the phenotype in family 30153 (subjects 13 to 15), consistent with dominant inheritance
    explanation: Familial co-segregation of a CDC42 variant demonstrates dominant transmission.
diagnosis:
- name: Exome sequencing
  description: >-
    The diagnosis is molecular. Reported cases were identified by exome or targeted sequencing of CDC42, often after
    a long diagnostic search, since the combination of syndromic features and macrothrombocytopenia is not widely
    recognized and the platelet count can be intermittently normal.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34624555
    reference_title: "Intermittent macrothrombocytopenia in a novel patient with Takenouchi-Kosaki syndrome and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After several genetic investigations (karyotype, CGH-Array, targeted NGS analysis for short stature genes), by
      whole exome sequencing we identified the p.Tyr64Cys in CDC42, occurring de novo.
    explanation: Diagnosis established by exome sequencing after negative first-line tests.
- name: Platelet count and size assessment
  description: >-
    A low platelet count with large platelets on the blood count and smear is the key hematologic clue; electron
    microscopy shows large, spherical platelets with fewer alpha-granules.
  diagnosis_term:
    preferred_term: platelet count
    term:
      id: NCIT:C51951
      label: Platelet Count
  evidence:
  - reference: PMID:30872706
    reference_title: "Pathogenetic basis of Takenouchi-Kosaki syndrome: Electron microscopy study using platelets in patients and functional studies in a Caenorhabditis elegans model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The platelets of the three patients were large and spherical in shape.
    explanation: Platelet morphology supporting the diagnosis.
treatments:
- name: Splenectomy
  description: >-
    Splenectomy is generally avoided in inherited thrombocytopenia, but in one patient with refractory autoimmune
    hemolytic anemia it improved both the anemia and the macrothrombocytopenia. Effectiveness and safety in other
    patients are unknown.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  target_mechanisms:
  - target: Macrothrombocytopenia
    treatment_effect: MODULATES
    description: Removing the spleen raised the platelet count in a single patient.
    evidence:
    - reference: PMID:36459360
      reference_title: "Splenectomy as an effective treatment for macrothrombocytopenia in Takenouchi-Kosaki syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After splenectomy, both anemia and macrothrombocytopenia improved.
      explanation: Single-patient improvement of macrothrombocytopenia after splenectomy.
  - target: Autoimmune Hemolytic Anemia
    treatment_effect: MODULATES
    evidence:
    - reference: PMID:36459360
      reference_title: "Splenectomy as an effective treatment for macrothrombocytopenia in Takenouchi-Kosaki syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After splenectomy, both anemia and macrothrombocytopenia improved.
      explanation: Resolution of drug-refractory AIHA after splenectomy.
  evidence:
  - reference: PMID:36459360
    reference_title: "Splenectomy as an effective treatment for macrothrombocytopenia in Takenouchi-Kosaki syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Splenectomy has been contraindicated for inherited thrombocytopenia, and there is little information on treatment
      of macrothrombocytopenia in TKS.
    explanation: Context for why this is a cautious, single-case observation.
- name: Corticosteroids for Autoimmune Hemolytic Anemia
  description: Prednisolone controlled AIHA initially in one patient but it became refractory.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Autoimmune Hemolytic Anemia
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:36459360
      reference_title: "Splenectomy as an effective treatment for macrothrombocytopenia in Takenouchi-Kosaki syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we observed that AIHA initially resolved with prednisolone, but gradually became refractory to drug therapy
      explanation: Initial but not sustained response of AIHA to prednisolone.
- name: Antibiotic Prophylaxis
  description: >-
    Prophylactic amoxicillin was followed by resolution of recurrent bacterial infections in an immunodeficient
    p.Tyr64Cys carrier. Immune function should be monitored in patients with frequent infections.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  target_mechanisms:
  - target: Recurrent Infections
    treatment_effect: INHIBITS
    evidence:
    - reference: PMID:33405195
      reference_title: "Progressive decline of T and B cell numbers and function in a patient with CDC42 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The 19-year-old female suffered from recurrent pneumonia, otitis media, and bacteremia, which resolved at 10
        years of age, concordant with the initiation of amoxicillin prophylaxis.
      explanation: Infections resolved with the start of amoxicillin prophylaxis.
- name: Recombinant Growth Hormone
  description: >-
    Off-label recombinant human growth hormone produced catch-up growth over six months in one p.Arg68Gln patient
    with severe short stature. Long-term efficacy and safety are untested.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Short Stature
    treatment_effect: MODULATES
    evidence:
    - reference: PMID:42746537
      reference_title: "Case Report: Clinical phenotypes and recombinant human growth hormone therapeutic exploration for a patient with Takenouchi-Kosaki syndrome harboring the CDC42 p.Arg68Gln variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Off-label recombinant human growth hormone (rhGH) therapy was administered for her short stature. During six
        months of follow-up, favorable catch-up growth was achieved.
      explanation: Short-term catch-up growth on rhGH in a single patient.
- name: Auditory Rehabilitation
  description: >-
    Hearing aids have been used; cochlear implantation was performed in a patient with profound loss. Because hearing
    loss can be progressive and some patients have cochlear-nerve malformations, early and repeated audiological
    assessment is advised.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: auditory rehabilitation with hearing aids
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Sensorineural Hearing Loss
    treatment_effect: BYPASSES
    evidence:
    - reference: PMID:39202334
      reference_title: "Auditory and Language Abilities in Children with Takenouchi-Kosaki Syndrome: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Auditory rehabilitation with hearing aids (HAs) was proposed in a subject.
      explanation: Hearing aids are the reported rehabilitation strategy.
- name: CDC42 Prenylation or Activity Inhibition (preclinical)
  description: >-
    Not a clinical treatment. In MEG-01 cells expressing p.Tyr64Cys, a CDC42 activity inhibitor (ML141) or a
    geranylgeranyltransferase inhibitor (GGTI-298) restored platelet-like particle production, and GGTI-298 also
    rescued neurite outgrowth in Neuro2A cells. No animal or human study has tested either drug in this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ML141 (CDC42 inhibitor)
    - preferred_term: GGTI-298 (geranylgeranyltransferase I inhibitor)
  target_mechanisms:
  - target: Membrane Accumulation of Active CDC42
    treatment_effect: INHIBITS
    description: Blocking prenylation removes mutant CDC42 from membranes.
    evidence:
    - reference: PMID:41581414
      reference_title: "A lipidation inhibitor rescues impaired neurite outgrowth caused by the CDC42 mutation associated with Takenouchi-Kosaki syndrome in Neuro2A cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Both the neurite outgrowth defect and the enhanced membrane localization induced by Y64C overexpression were
        restored by GGTI-298 treatment but not by ML141.
      explanation: GGTI-298 reverses membrane localization and the neurite defect in cells.
  - target: Defective Megakaryopoiesis and Proplatelet Formation
    treatment_effect: RESTORES
    evidence:
    - reference: PMID:34504210
      reference_title: "Macrothrombocytopenia of Takenouchi-Kosaki syndrome is ameliorated by CDC42 specific- and lipidation inhibitors in MEG-01 cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, such dysfunction was ameliorated by either suppression of Cdc42 activity or prenylation using
        chemical inhibitors.
      explanation: Both inhibitors rescue platelet-like particle production in a megakaryoblastic cell line.
experimental_models:
- name: TKS patient-derived iPSC megakaryocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    iPSCs from TKS patients differentiated to megakaryocytes and platelets reproduce macrothrombocytopenia and are being
    used for drug evaluation.
  publication: PMID:37918315
  modeled_mechanisms:
  - target: Defective Megakaryopoiesis and Proplatelet Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient genotype in the relevant lineage reproduces the platelet defect.
    limitations: >-
      In vitro differentiation lacks the bone marrow niche and sinusoidal shear forces that drive proplatelet release
      in vivo.
    evidence:
    - reference: PMID:37918315
      reference_title: "Modelling Takenouchi-Kosaki syndrome using disease-specific iPSCs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The results obtained showed that TKS-iPSCs produced fewer hematopoietic progenitor cells, exhibited defective
        megakaryopoiesis, and released platelets with an abnormally low count and giant morphology.
      explanation: The iPSC model reproduces the megakaryocyte and platelet phenotype.
animal_models:
- name: cdc-42 p.Tyr64Cys knock-in C. elegans
  species: Caenorhabditis elegans
  genotype: CRISPR/Cas9 knock-in of the Tyr64Cys-equivalent substitution in cdc-42
  publication: PMID:30872706
  description: >-
    Knock-in worms show protruding vulva and defective apoptotic corpse clearance that mimic cdc-42 RNAi, indicating
    a hypomorphic allele.
  modeled_mechanisms:
  - target: CDC42 Switch II Missense Variant
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Models the allele's functional class in vivo, not the human platelet or neurodevelopmental phenotype.
    limitations: >-
      Invertebrate model with no platelets, lymphatics or comparable cortex; the readouts (vulval morphogenesis,
      corpse clearance) are proxies for CDC42 function rather than disease features.
    evidence:
    - reference: PMID:30872706
      reference_title: "Pathogenetic basis of Takenouchi-Kosaki syndrome: Electron microscopy study using platelets in patients and functional studies in a Caenorhabditis elegans model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This functional analysis suggested that the mutant allele has hypomorphic effects.
      explanation: The knock-in defines the allele as hypomorphic in vivo.
differential_diagnoses:
- name: CDC42 p.Arg186Cys autoinflammatory disease (NOCARH)
  description: >-
    The same gene, but a distinct disorder: the de novo C-terminal p.Arg186Cys variant alters CDC42 localization and
    causes neonatal-onset cytopenia with dyshematopoiesis, autoinflammation, rash and hemophagocytic
    lymphohistiocytosis. It lacks the developmental features of TKS and has no separate MONDO term.
  evidence:
  - reference: PMID:31601675
    reference_title: "A novel disorder involving dyshematopoiesis, inflammation, and HLH due to aberrant CDC42 function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients shared the same de novo CDC42 mutation (Chr1:22417990C>T, p.R186C) and altered hematopoietic
      compartment, immune dysregulation, and inflammation.
    explanation: Defines the R186C disorder.
  - reference: PMID:31601675
    reference_title: "A novel disorder involving dyshematopoiesis, inflammation, and HLH due to aberrant CDC42 function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro and in vivo assays documented unique effects of p.R186C on CDC42 localization and function, correlating
      with the distinctiveness of the trait.
    explanation: R186C acts through a different mechanism, justifying its exclusion from this entry.
- name: Jacobsen syndrome
  description: >-
    11q terminal deletion syndrome also combines thrombocytopenia with developmental delay; chromosomal microarray
    distinguishes it.
  disease_term:
    preferred_term: Jacobsen syndrome
    term:
      id: MONDO:0007838
      label: Jacobsen syndrome
  evidence:
  - reference: PMID:26386261
    reference_title: "Macrothrombocytopenia and developmental delay with a de novo CDC42 mutation: Yet another locus for thrombocytopenia and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The combinatory phenotype of thrombocytopenia and developmental delay has been described for two genetic
      conditions: a chromosome 11q deletion that is referred to as Jacobsen syndrome, and a 21q22 microdeletion
      syndrome.
    explanation: Names Jacobsen syndrome as a prior cause of the same combined phenotype.
- name: Noonan syndrome
  description: >-
    Group III CDC42 variants (p.Glu171Lys) produce a Noonan-like phenotype; RASopathy genes are the main
    alternative when short stature, facial features and heart defects predominate without macrothrombocytopenia.
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  evidence:
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one specific amino acid change among the group III mutations, which affects only one of the two CDC42 isoforms
      and specifically impairs binding to WASP, results in an overall milder clinical phenotype that phenocopies
      Noonan syndrome
    explanation: Overlap between CDC42 group III disease and Noonan syndrome.
notes: >-
  Lump/split: curated as a single DISEASE bound to MONDO:0014757 (OMIM 616737). The eponym was coined for the
  recurrent de novo p.Tyr64Cys switch II variant, and the switch II (group I) variants are classical TKS; later
  reports apply the same name to other heterozygous CDC42 developmental variants (nucleotide-pocket group II and
  CRIB-surface group III), so these are recorded as has_subtypes rather than separate entries. The C-terminal
  p.Arg186Cys variant is excluded: it causes NOCARH, a neonatal autoinflammatory and HLH disorder whose mechanism
  differs from the switch II regulator and effector defect, and it is listed under differential diagnoses. The name
  is the OMIM eponym and the current MONDO label; the older MONDO label, which lists the phenotype, is kept in
  synonyms. No CDC42-related name is established in MONDO, ClinGen, GeneReviews or OMIM, so no dyadic name is
  coined. The PubMed query "CDC42 AND genereviews[book]" returned no records, so no GeneReviews chapter covers the
  gene. Zhu-Tokita-Takenouchi-Kim syndrome (SON) is an unrelated disease that shares an author's name. Myelofibrosis
  and systemic inflammation have been reported in a p.Tyr64Cys carrier (PMID:31953712), but the cached record has no
  abstract to quote, so the feature is not curated.

has_subtypes:
- name: Group I
  display_name: Group I (switch II; classical TKS)
  description: >-
    Variants in the switch II loop (p.Tyr64Cys, p.Arg66Gly, p.Arg68Gln). These mutants are locked toward the
    GTP-bound state, are insensitive to regulators and have defective binding to all tested effectors. All carriers
    in the founding functional series had thrombocytopenia, and sensorineural hearing loss is characteristic of this
    group. p.Tyr64Cys is the recurrent hot-spot variant and the one the eponym was coined for.
  evidence:
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      demonstrating a stabilized GTP-bound conformation but defective interaction with all tested partners for group I
      mutations
    explanation: Defines the shared biochemical behavior of the switch II (group I) variants.
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group I mutations associated with impaired binding to regulators and effectors cause a syndromic form of
      thrombocytopenia
    explanation: Links the group I variant class to the syndromic thrombocytopenia phenotype.
  - reference: PMID:42567517
    reference_title: "Hearing loss associated with CDC42 in mice and humans (Takenouchi-Kosaki syndrome): CDC42 and RHOQ synergistically function in cochlear hair cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, SNHL appears characteristic of Group I TKS but uncommon in other CDC42-related disorders.
    explanation: Sensorineural hearing loss distinguishes group I from the other variant groups.
- name: Group II
  display_name: Group II (nucleotide-binding pocket)
  description: >-
    Variants in or near the nucleotide-binding pocket (p.Cys81Phe, p.Ser83Pro, p.Ala159Val) that variably hyperactivate
    CDC42. Carriers have a developmental disorder with strikingly dysmorphic, sometimes RASopathy-like facial
    features; macrothrombocytopenia and hearing loss are not characteristic.
  evidence:
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the variably hyperactive group II mutations are associated with a variable developmental disorder characterized
      by striking dysmorphic features
    explanation: Describes the group II clinical and biochemical class.
- name: Group III
  display_name: Group III (CRIB-binding surface)
  description: >-
    Variants at exposed residues that bind CRIB-motif effectors (p.Ile21Thr, p.Tyr23Cys, p.Glu171Lys). p.Glu171Lys
    affects only one of the two CDC42 isoforms, abolishes WASP binding and produces a milder phenotype resembling
    Noonan syndrome, segregating dominantly in one family.
  evidence:
  - reference: PMID:29394990
    reference_title: "Functional Dysregulation of CDC42 Causes Diverse Developmental Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      one specific amino acid change among the group III mutations, which affects only one of the two CDC42 isoforms
      and specifically impairs binding to WASP, results in an overall milder clinical phenotype that phenocopies
      Noonan syndrome
    explanation: Describes the Noonan-like group III presentation.
  - reference: PMID:33283961
    reference_title: "Aplasia cutis congenita in a CDC42-related developmental phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected individuals presented with short stature, distinctive craniofacial features, pectus deformity as
      well as heart and eye anomalies, similar to the recently described Noonan syndrome-like phenotype associated with
      this variant.
    explanation: An independent mother-child pair with p.Glu171Lys confirms the Noonan-like group III phenotype.

- name: Combined B and T Lymphocyte Deficiency
  biological_scale: CELLULAR
  description: >-
    Some p.Tyr64Cys carriers develop a progressive combined immunodeficiency: falling CD19+ B cells and switched memory
    B cells, low immunoglobulins with poor antibody responses, reduced CD4+ and CD8+ T cells with few naive T cells,
    and intermittently depressed T-cell proliferation, while NK cells are normal.

notes: >-
  Two gene-defined MONDO children of the bound term are curated here as
  subtypes rather than as separate entries: MONDO:0009091 (CPHD3, LHX3) and
  MONDO:0009880 (CPHD4, LHX4). Both are combined pituitary hormone deficiency
  produced by the same anterior pituitary developmental cascade this entry
  models, differing only in which step the transcription factor acts at and in
  an extrapituitary arm, and neither has a distinct first-line therapy.
  MONDO:0009880's definition, which derives from Orphanet, describes the
  disorder as dominantly inherited on the strength of the original French
  kindred; the subtype record here does not repeat that penetrance claim,
  because the largest screened cohort reports incomplete penetrance for most
  LHX4 variants and a de novo case has been published. ANE syndrome
  (MONDO:0012794, RBM28) is a third direct MONDO child of the bound term and
  is deliberately not curated here: its MONDO definition describes a
  neuro-endocrino-cutaneous syndrome in which alopecia, intellectual
  disability and progressive motor deterioration accompany the anterior
  pituitary deficiency, so the hormone deficiency is one component of a
  broader syndrome rather than the disease, and it warrants its own entry. The
  eight holoprosencephaly forms that the Monarch-KG gene coverage comparison
  assigned to this entry - holoprosencephaly 2, 4, 5, 7, 10, 11, 13 and 14,
  for SIX3, TGIF1, ZIC2, PTCH1, DISP1, CDON, STAG2 and PLCH1 - are not forms
  of this disease and are not curated here. None of them is a MONDO child of
  the bound term; each is a child of MONDO:0016296 holoprosencephaly, and
  MONDO in turn asserts MONDO:0016296 as a direct subclass of MONDO:0018762.
  Holoprosencephaly is a forebrain cleavage defect in which pituitary hormone
  deficiency is a frequent consequence rather than a defining feature, so that
  subclass edge is the single reason those eight appeared under this entry.
  dismech curates the SHH form separately as SHH Holoprosencephaly Spectrum.
  On gene-level sources for the two subtypes: the committed GeneReviews index
  (cache/bookshelf/genereviews.csv) contains no chapter whose title mentions
  LHX, and the only combined-pituitary-hormone-deficiency chapter in it is
  PROP1-Related Combined Pituitary Hormone Deficiency, so no GeneReviews
  baseline exists for LHX3 or LHX4. The ClinGen gene-disease validity
  download dated 2026-09-24 contains exactly one LHX row, for LHX2, so ClinGen
  has no validity assertion for either gene; the same download does carry a
  Moderate FOXA2 assertion against MONDO:0013099, a gene this entry does not
  yet cover. The only quotable gene-share figures found were the LHX4 yield of
  approximately 1.4% in a cohort preselected for ectopic posterior pituitary
  and/or sella turcica anomalies, recorded as a case fraction with that
  population, and a count of 8 of 110 screened that pools LHX3 with LHX4 and
  is therefore cited without being split between them. Evidence added before
  this pass uses DOI caches because PMID fetching failed during that run;
  DOI:10.3390/children12030364 and PMID:40150646 are the same publication, and
  the DOI form is retained so the paper has one cache file.

  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:28302169
      reference_title: Two novel LHX3 mutations in patients with combined pituitary hormone deficiency including cervical rigidity and sensorineural hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "CPHD-type 3 (CPHD3; MIM# 221750) is caused by recessive mutations in LHX3, a LIM-homeodomain transcription factor gene."
      explanation: >-
        States the recessive mode for LHX3-related CPHD. Background framing of
        an established fact rather than this paper's own result.
  features: >-
    Biallelic LHX3 loss of function causes CPHD3. The endocrine pattern spares
    the corticotroph axis in the founding consanguineous families, and the
    hormone deficiencies come with extrapituitary features - a rigid cervical
    spine limiting head rotation, scoliosis, and sensorineural hearing loss -
    that the other transcription-factor forms of genetic CPHD do not produce.
    Mouse genetics additionally places LHX3 at a commitment step after the
    pouch-formation role it shares redundantly with LHX4, which is the
    ordering the lineage-selective endocrine pattern is read against.
  evidence:
  - reference: PMID:10835633
    reference_title: Mutations in LHX3 result in a new syndrome revealed by combined pituitary hormone deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous LHX3 defect in patients of two unrelated consanguineous families displaying a complete deficit in all but one (adrenocorticotropin) anterior pituitary hormone and a rigid cervical spine leading to limited head rotation."
    explanation: >-
      The founding report of LHX3-related CPHD, establishing biallelic
      causation, the ACTH-sparing hormone pattern, and the cervical spine
      feature.
  - reference: PMID:10835633
    reference_title: Mutations in LHX3 result in a new syndrome revealed by combined pituitary hormone deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data are consistent with function of LHX3 in the proper development of all anterior pituitary cell types, except corticotropes, and extrapituitary structures."
    explanation: >-
      The same report's mechanistic reading: LHX3 is needed for every anterior
      pituitary cell type except corticotropes, and for structures outside the
      pituitary.
  - reference: PMID:18407919
    reference_title: Novel mutations in LHX3 are associated with hypopituitarism and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study therefore extends the phenotypic spectrum associated with LHX3 mutations to encompass variable sensorineural hearing loss"
    explanation: >-
      Adds sensorineural hearing loss to the LHX3 phenotype, reported as
      variable between patients.
diagnosis:
- name: Pituitary hormone axis testing
  description: >-
    Diagnostic evaluation requires endocrine testing across GH, thyroid,
    adrenal, gonadal, prolactin, and posterior pituitary axes, with repeated
    follow-up because additional deficits may emerge.
  evidence:
  - reference: DOI:10.3390/jcm13206161
    reference_title: "An Update on Advances in Hypopituitarism: Etiology, Diagnosis, and Current Management"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is based on clinical evaluation and hormonal testing, with identification of the specific hormonal deficiencies essential for effective treatment."
    explanation: >-
      This hypopituitarism review supports clinical and hormonal testing as the
      diagnostic basis.
  - reference: DOI:10.3390/ijms241210114
    reference_title: "Management of Neonatal Isolated and Combined Growth Hormone Deficiency: Current Status"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis should be made by laboratory analyses of the growth hormone and other pituitary hormones, rather than by cranial imaging with magnetic resonance imaging."
    explanation: >-
      This neonatal GHD/combined GHD review emphasizes laboratory hormone-axis
      assessment over MRI alone.
- name: Brain and pituitary MRI
  description: >-

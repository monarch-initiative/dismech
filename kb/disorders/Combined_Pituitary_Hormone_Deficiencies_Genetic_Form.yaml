  - reference: PMID:27820671
    reference_title: Contribution of LHX4 Mutations to Pituitary Deficits in a Cohort of 417 Unrelated Patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.(Tyr131*), p.(Arg48Thrfs*104), p.Ala65Val, p.Thr163Pro, and p.Arg221Gln LHX4 variants are unable to transactivate the POU1F1 and GH promoters."
    explanation: >-
      Transactivation assays show that the disease-causing LHX4 variants fail
      to drive the POU1F1 promoter, which is the route by which LHX4 acts on
      lineage specification. The assay result is in vitro even though the
      variants come from the clinical cohort in the same paper.
  - reference: PMID:15998782
    reference_title: Functional relationship between LHX4 and POU1F1 in light of the LHX4 mutation identified in patients with pituitary defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that normal LHX4 binds to a human-specific element and subsequently activates transcription from the proximal upstream regulatory sequence of POUIF1, a gene encoding a POU homeodomain transcription factor known as the main regulator of GH expression."
    explanation: >-
      An independent cell-based study placing LHX4 upstream of POU1F1. The
      gene symbol is misspelled twice in the published abstract, as POUI1F1 in
      the title region and POUIF1 in this sentence; the quote reproduces the
      source unchanged and the gene meant is POU1F1.
  downstream:
  - target: Anterior Pituitary Endocrine-Axis Failure
    causal_link_type: DIRECT
    description: >-
      Lineages that never commit cannot supply the hormone-secreting cells the
      anterior pituitary axes depend on, which is why LHX3 disease produces a
      deficit in every anterior hormone except ACTH.
    evidence:
    - reference: PMID:10835633

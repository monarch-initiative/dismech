  downstream:
  - target: Extrapituitary LHX3 Developmental Defect
    causal_link_type: DIRECT
    description: >-
      LHX3 is also required outside the pituitary, so biallelic LHX3 loss
      enters a second arm of the cascade that the other developmental genes in
      this entry do not.
    evidence:
    - reference: PMID:10835633
      reference_title: Mutations in LHX3 result in a new syndrome revealed by combined pituitary hormone deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data are consistent with function of LHX3 in the proper development of all anterior pituitary cell types, except corticotropes, and extrapituitary structures."
      explanation: >-
        Attributes an extrapituitary developmental role to LHX3, which is what
        this edge branches on.
  - target: Sella Turcica and Hindbrain Malformation
    causal_link_type: DIRECT
    description: >-
      LHX4 disease likewise extends beyond the gland itself, to the bony
      pituitary fossa and the hindbrain.
    evidence:
    - reference: PMID:11567216
      reference_title: Syndromic short stature in patients with a germline mutation in the LIM homeobox LHX4.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a family with an LHX4 germline splice-site mutation that results in a disease phenotype characterized by short stature and by pituitary and hindbrain (i.e., cerebellar) defects in combination with abnormalities of the sella turcica of the central skull base."
      explanation: >-
        A germline LHX4 mutation producing hindbrain and sella turcica
        abnormalities alongside the pituitary defect.
  - target: Rathke Pouch Formation Failure
    causal_link_type: DIRECT
    description: >-
      LHX3 and LHX4 are the two developmental genes in this entry that act at
      the earliest pituitary-specific step, formation of the definitive
      Rathke pouch, so variants in either enter the cascade here rather than
      at lineage specification.
    evidence:
    - reference: PMID:9388186
      reference_title: Multistep control of pituitary organogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lhx3 and Lhx4 have redundant control over formation of the definitive pouch. Lhx3 controls a subsequent step of pituitary fate commitment."
      explanation: >-
        Mouse genetics places Lhx3 and Lhx4 at definitive pouch formation and
        Lhx3 additionally at a later commitment step, which is the two-step
        ordering this edge and the next node encode. The result is from mouse
        and is not on its own support for the human phenotype.
  - target: Anterior Pituitary Endocrine-Axis Failure
    causal_link_type: DIRECT
    description: >-
      Impaired pituitary development reduces the differentiated
      hormone-producing cell populations that normally maintain multiple
      anterior pituitary axes.
    evidence:
    - reference: DOI:10.3390/ijms26062406
      reference_title: Identification of POU1F1 Variants in Vietnamese Patients with Combined Pituitary Hormone Deficiency
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All six patients exhibited anterior pituitary hypoplasia on brain magnetic resonance imaging and presented with TSH, GH, and PRL deficiencies."
      explanation: >-
        This POU1F1 cohort links structural anterior pituitary hypoplasia with
        multiple anterior pituitary hormone deficiencies.
  - target: Structural Pituitary Malformation
    causal_link_type: DIRECT
    description: >-
      Developmental-gene disruption may also produce visible pituitary MRI
      malformations, including anterior pituitary hypoplasia and ectopic
      posterior pituitary findings.
    evidence:
    - reference: DOI:10.3390/children12030364

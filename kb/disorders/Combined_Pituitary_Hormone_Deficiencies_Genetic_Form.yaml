    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in POU1F1, GLI2, HESX1, TBC1D32, and ROBO1 were found in 5 (19.2%)."
    explanation: >-
      This congenital CPHD cohort identifies pathogenic variants in multiple
      developmental genes.

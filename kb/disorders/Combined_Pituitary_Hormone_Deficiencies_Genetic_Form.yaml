    label: non-acquired combined pituitary hormone deficiency
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0013099
      label: combined pituitary hormone deficiencies, genetic form
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: >-
      This entry's `preferred_term` was previously "combined pituitary hormone
      deficiencies, genetic form", which is the primary label of MONDO:0013099
      and not of the bound term MONDO:0018762. The two MONDO classes look like
      a duplicate pair: MONDO:0013099's definition repeats MONDO:0018762's
      word for word and adds one sentence comparing congenital with acquired
      hypopituitarism, and both are asserted parents of the two subtypes
      curated here, MONDO:0009091 and MONDO:0009880. Neither is a subclass of
      the other. The `preferred_term` now matches the bound term and the
      alternative class is recorded as a close match, which leaves
      MONDO:0013099 in the curation queue pending an upstream decision on
      whether the pair should be merged.
parents:
- non-acquired pituitary hormone deficiency
- hereditary disease
synonyms:
- congenital combined pituitary hormone deficiency
- congenital hypopituitarism
- multiple pituitary hormone deficiency
- non-acquired combined pituitary hormone deficiency
description: >-
  Combined pituitary hormone deficiencies, genetic form is congenital
  hypopituitarism in which germline defects affecting pituitary organogenesis,
  midline patterning, or anterior pituitary lineage specification cause
  deficiency of growth hormone plus at least one additional pituitary hormone.
  The phenotype is genetically heterogeneous and may include GH, TSH, ACTH,
  gonadotropin, prolactin, and posterior pituitary hormone involvement, with
  severity and progression varying by gene and structural pituitary findings.
definitions:
- name: Multiple pituitary hormone deficiency definition
  definition_type: OTHER
  description: >-
    The defining clinical feature is deficiency of two or more pituitary
    hormones. In congenital CPHD cohorts, growth hormone deficiency with at
    least one additional pituitary hormone deficit is a common operational
    definition.
  evidence:
  - reference: DOI:10.32641/andespediatr.v94i6.4680
    reference_title: Long-term follow-up data of patients with Multiple Pituitary Hormone Deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deficiency of two or more pituitary hormones is called multiple pituitary hormone deficiencies (MPHD)."
    explanation: >-
      This directly defines multiple pituitary hormone deficiency as a
      multi-axis pituitary hormone deficiency state.
  - reference: DOI:10.1530/ec-24-0217
    reference_title: "Etiology of combined pituitary hormone deficiency: GNAO1 as a novel candidate gene"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 34 children (12 girls) with congenital CPHD (growth hormone (GH) deficiency and impaired secretion of at least one other pituitary hormone) treated with GH in our center were enrolled in the study."
    explanation: >-
      This pediatric congenital CPHD cohort operationalizes congenital CPHD as
      GH deficiency plus impaired secretion of at least one other pituitary
      hormone.
has_subtypes:
- name: CPHD3
  display_name: CPHD3 (LHX3-related, with cervical spine abnormalities and hearing loss)
  description: >-
    The recessive LHX3 form. Biallelic LHX3 loss of function produces
    deficiency of the anterior pituitary hormones other than ACTH together
    with an extrapituitary skeletal phenotype - a rigid cervical spine
    limiting head rotation - and, in series published after the founding
    report, sensorineural hearing loss. The extrapituitary features are what
    MONDO's label for the class is built on, and no LHX3 report reviewed here
    describes the sella turcica or hindbrain findings that characterize the
    LHX4 subtype.
  subtype_term:
    preferred_term: non-acquired combined pituitary hormone deficiency with spine abnormalities
    term:
      id: MONDO:0009091
      label: non-acquired combined pituitary hormone deficiency with spine abnormalities
  genes:
  - preferred_term: LHX3
    term:
      id: hgnc:6595
      label: LHX3
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28302169
    reference_title: Two novel LHX3 mutations in patients with combined pituitary hormone deficiency including cervical rigidity and sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "CPHD-type 3 (CPHD3; MIM# 221750) is caused by recessive mutations in LHX3, a LIM-homeodomain transcription factor gene."
    explanation: >-
      Names CPHD3 as the recessive LHX3 entity and supplies the OMIM
      identifier MONDO:0009091 cross-references. The sentence is the paper's
      background framing of an established fact rather than its own result.
  - reference: PMID:10835633
    reference_title: Mutations in LHX3 result in a new syndrome revealed by combined pituitary hormone deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous LHX3 defect in patients of two unrelated consanguineous families displaying a complete deficit in all but one (adrenocorticotropin) anterior pituitary hormone and a rigid cervical spine leading to limited head rotation."
    explanation: >-
      The founding report of the subtype, giving both defining components: the
      ACTH-sparing hormone pattern and the rigid cervical spine.
- name: CPHD4
  display_name: CPHD4 (LHX4-related, with sella turcica and hindbrain defects)
  description: >-
    The dominant LHX4 form. Heterozygous LHX4 variants cause combined
    pituitary hormone deficiency with a skull-base and hindbrain signature -
    a small or poorly developed sella turcica, an ectopic posterior pituitary
    lobe, and cerebellar defects. The founding kindred segregated the splice
    variant in a fully penetrant dominant pattern over three generations, but
    in the largest screened cohort most variants showed incomplete penetrance
    and variable expressivity, and a de novo case has been reported, so full
    penetrance should not be generalized from the original family.
  subtype_term:
    preferred_term: short stature-pituitary and cerebellar defects-small sella turcica syndrome
    term:
      id: MONDO:0009880
      label: short stature-pituitary and cerebellar defects-small sella turcica syndrome
  genes:
  - preferred_term: LHX4
    term:
      id: hgnc:21734
      label: LHX4
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
  evidence:
  - reference: PMID:11567216
    reference_title: Syndromic short stature in patients with a germline mutation in the LIM homeobox LHX4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a family with an LHX4 germline splice-site mutation that results in a disease phenotype characterized by short stature and by pituitary and hindbrain (i.e., cerebellar) defects in combination with abnormalities of the sella turcica of the central skull base."
    explanation: >-
      The founding report, naming the three components MONDO uses to label
      this class: short stature, pituitary and cerebellar defects, and sella
      turcica abnormality.
  - reference: PMID:27820671
    reference_title: Contribution of LHX4 Mutations to Pituitary Deficits in a Cohort of 417 Unrelated Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LHX4 mutations were found to be associated with variable expressivity, and most of them with incomplete penetrance; their contribution to pituitary deficits that are associated with an ectopic posterior pituitary and/or a sella turcica defect is ∼1.4% in the 417 probands tested."
    explanation: >-
      The largest reported LHX4 screening cohort, establishing variable
      expressivity and incomplete penetrance for most variants. This is why
      the entry does not carry the full-penetrance claim MONDO's
      Orphanet-derived definition makes from the original kindred.
  - reference: PMID:27820671
    reference_title: Contribution of LHX4 Mutations to Pituitary Deficits in a Cohort of 417 Unrelated Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study, performed in the largest cohort of patients screened so far for LHX4 mutations, describes 6 disease-causing mutations that are responsible for congenital hypopituitarism."
    explanation: >-
      The authors state that this is the largest cohort screened so far for
      LHX4 mutations, which is the basis for reading its penetrance and
      expressivity findings as the subtype-level picture.
  - reference: PMID:17527005
    reference_title: "A novel missense mutation (P366T) of the LHX4 gene causes severe combined pituitary hormone deficiency with pituitary hypoplasia, ectopic posterior lobe and a poorly developed sella turcica."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither of the patient's parents harbored this mutation, indicating de novo mutation."
    explanation: >-
      A de novo LHX4 variant, so the subtype is not confined to familial
      transmission and an unaffected family history does not exclude it.
prevalence:
- population: Worldwide
  notes: >-
    Published estimates for multiple pituitary hormone deficiency are
    heterogeneous, but one long-term pediatric cohort review cites a worldwide
    prevalence of about 1 in 8,000.
  evidence:
  - reference: DOI:10.32641/andespediatr.v94i6.4680
    reference_title: Long-term follow-up data of patients with Multiple Pituitary Hormone Deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its prevalence is estimated to be about 1/8,000 worldwide."
    explanation: >-
      This gives the prevalence estimate used here for MPHD broadly.
progression:
- phase: Longitudinal endocrine evolution
  notes: >-
    Hormone deficits may accumulate after the first diagnosis, so long-term
    surveillance of all pituitary axes is part of disease management.
  evidence:
  - reference: DOI:10.32641/andespediatr.v94i6.4680
    reference_title: Long-term follow-up data of patients with Multiple Pituitary Hormone Deficiency
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the follow-up, 62% of the cases added other hormone deficiencies."
    explanation: >-
      This supports progressive or evolving pituitary hormone involvement in a
      substantial fraction of patients.
- phase: Syndromic and extrapituitary involvement
  notes: >-
    Congenital genetic CPHD can include extrapituitary phenotypes, so clinical
    surveillance should not be limited to endocrine axes and pituitary MRI
    findings alone.
  evidence:
  - reference: DOI:10.6065/apem.2448008.004
    reference_title: "Clinical and genetic features of childhood-onset congenital combined pituitary hormone deficiency: a retrospective, single-center cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extrapituitary phenotypes were identified in 31 (72.1%)."
    explanation: >-
      This congenital CPHD cohort reports frequent extrapituitary phenotypes.
pathophysiology:
- name: Developmental Gene Disruption
  description: >-
    Germline variants in pituitary-development, midline-patterning, and
    lineage-specification genes disrupt pituitary morphogenesis or endocrine
    cell differentiation. This upstream genetic heterogeneity explains why
    affected individuals can have isolated anterior pituitary cell-lineage
    failure, structural pituitary malformations, or broader extrapituitary
    phenotypes.

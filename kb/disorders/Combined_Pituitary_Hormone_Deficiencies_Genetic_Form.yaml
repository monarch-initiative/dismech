      evidence_source: HUMAN_CLINICAL
      snippet: "Brain MRI demonstrated hypoplastic anterior pituitary, ectopic posterior lobe, a poorly developed sella turcica, and chiari malformation."
      explanation: >-
        An LHX4 patient with the structural pituitary findings this edge
        predicts from a defect at pouch formation.
- name: Anterior Pituitary Cell-Lineage Specification Failure
  biological_scale: CELLULAR
  description: >-
    After the pouch forms, its progenitors commit to the hormone-secreting
    anterior pituitary lineages. LHX3 is required again here, and human LHX3
    disease spares the corticotroph axis, which is the lineage-selective
    signature of a defect at commitment rather than at pouch formation. LHX4
    reaches the same step indirectly: disease-causing LHX4 variants fail to
    transactivate the POU1F1 promoter, and POU1F1 is the lineage regulator
    whose own loss causes the GH, TSH and prolactin pattern curated in this
    entry.

    explanation: >-
      This independent congenital CPHD cohort supports a heterogeneous causal
      gene spectrum including PROP1, POU1F1, GLI2, and candidate genes.
  - reference: PMID:37165954
    reference_title: Identification of genetic variants and phenotypic characterization of a large cohort of patients with congenital hypopituitarism and related disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified variants in 178 patients: GH1/GHRHR (51 patients of 414 screened), PROP1 (17 of 253), POU1F1 (15 of 139), SOX2 (13 of 59), GLI2 (7 of 106), LHX3/LHX4 (8 of 110)"
    explanation: >-
      A large congenital hypopituitarism cohort giving per-gene screening
      yields. LHX3 and LHX4 are reported pooled, as 8 of 110 screened, so this
      figure is not attributed to either gene on its own and is not recorded
      as a per-gene case fraction.
  - reference: PMID:26147833
    reference_title: "Frequency of genetic defects in combined pituitary hormone deficiency: a systematic review and analysis of a multicentre Italian cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The worldwide mutation frequency for the five genes calculated from 21 studies was 12·4%, which ranged from 11·2% in sporadic to 63% in familial cases."
    explanation: >-
      A systematic review across 21 screening studies of the five classical

  - reference: PMID:32163208
    reference_title: Development of the Pituitary Gland.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The development of the anterior pituitary gland occurs in distinct sequential developmental steps, leading to the formation of a complex organ containing five different cell types secreting six different hormones."
    explanation: >-
      A developmental review states that anterior pituitary development runs
      as distinct sequential steps, which is why this entry models pouch
      formation and lineage specification as separate nodes rather than as one
      undifferentiated developmental-gene node.
  downstream:
  - target: Anterior Pituitary Cell-Lineage Specification Failure
    causal_link_type: DIRECT
    description: >-
      A hypoplastic pouch supplies fewer progenitors to the subsequent
      commitment step, and LHX3 is required again at that step.
    evidence:
    - reference: PMID:9388186
      reference_title: Multistep control of pituitary organogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lhx3 and Lhx4 have redundant control over formation of the definitive pouch. Lhx3 controls a subsequent step of pituitary fate commitment."
      explanation: >-
        States that fate commitment is a step subsequent to pouch formation
        and that Lhx3 controls it, which is the ordering this edge asserts.
        Mouse data.
  - target: Structural Pituitary Malformation
    causal_link_type: DIRECT
    description: >-
      Failure at pouch formation is the developmental origin of the pituitary
      MRI findings seen in both LHX-related subtypes, including anterior
      pituitary hypoplasia and an ectopic posterior lobe.
    evidence:
    - reference: PMID:17527005

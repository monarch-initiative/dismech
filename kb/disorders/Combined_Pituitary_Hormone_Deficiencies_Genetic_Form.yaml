      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brain magnetic resonance imaging (MRI) revealed pituitary hypoplasia, ectopic posterior pituitary gland, and small sella turcica in all probands."
      explanation: >-
        This LHX4 family report supports structural pituitary malformation as
        part of genetic MPHD.
- name: Rathke Pouch Formation Failure
  biological_scale: TISSUE
  description: >-
    LHX3 and LHX4 act at the earliest pituitary-specific step, formation of
    the definitive Rathke pouch from the oral ectoderm. Mouse genetics places
    the two genes redundantly at this step, and what follows from loss of
    either one in humans is a hypoplastic or malformed gland rather than an
    absent one, consistent with the structural pituitary findings that
    accompany both subtypes.

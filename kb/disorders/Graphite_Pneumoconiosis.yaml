      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Chest x-rays revealed both a reticular and nodular pattern in the lung, moderate apical distractions and pleural scarring, all of which were confirmed by high-resolution computed tomography."
      explanation: Supports the radiographic expression of the tissue lesion, confirmed on high-resolution computed tomography.
  - target: Pulmonary fibrosis
    causal_link_type: DIRECT
    description: Established disease is a fibrotic pneumoconiosis.

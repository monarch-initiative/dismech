    reference_title: "Detection of graphite using laser microprobe mass analysis of a transbronchial biopsy from a foundry worker with mixed dust pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bronchoalveolar lavage and transbronchial biopsies were also consistent with mixed dust pneumoconiosis"
    explanation: Human pathological confirmation of the mixed dust remodeling in a documented case.
  - reference: PMID:6314495
    reference_title: "Graphite pneumoconiosis. A review of etiologic and epidemiologic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In 39 cases the diagnosis was based on or supported by autopsy or lung biopsy results."
    explanation: Supports that the lesion has been confirmed histologically across a substantial number of reported cases.
  downstream:

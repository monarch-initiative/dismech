definitions:
- name: Clinical case definition for graphite pneumoconiosis
  definition_type: CASE_DEFINITION
  description: >-
    Graphite pneumoconiosis is a mixed dust pneumoconiosis arising from long-term
    occupational inhalation of graphite-containing dust, recognized by an
    exposure history together with radiographic reticular and nodular change and
    pathology consistent with mixed dust pneumoconiosis.
  scope: Disease-level framing as a mixed dust pneumoconiosis rather than a pure-mineral disease
  evidence:
  - reference: PMID:12238312
    reference_title: "Detection of graphite using laser microprobe mass analysis of a transbronchial biopsy from a foundry worker with mixed dust pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mixed dust pneumoconiosis caused by long-term occupational exposure to graphite dust is a rare disease."
    explanation: States the disease definition as a mixed dust pneumoconiosis from long-term occupational graphite exposure, and its rarity.
  - reference: PMID:8669194
    reference_title: "Nonasbestos ferruginous bodies in sputum from a patient with graphite pneumoconiosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhalation of graphite dust can cause lung disease, mostly in the form of mixed-dust pneumoconiosis in individuals working in the metallurgic industry or graphite mines."
    explanation: Independent support for the mixed dust characterization and for the occupational settings in which it arises.
- name: Morphologic diagnostic marker for graphite pneumoconiosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The identifying morphologic feature is the nonasbestos ferruginous body with
    a black graphite core, which can be found in sputum as well as in tissue.
    Radiographic change is reticular and nodular, and bronchoalveolar lavage with
    transbronchial biopsy supports a mixed dust pattern rather than identifying
    the mineral.
  scope: Pathological and radiological recognition
  evidence:
  - reference: PMID:8669194
    reference_title: "Nonasbestos ferruginous bodies in sputum from a patient with graphite pneumoconiosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The morphologic landmark of graphite pneumoconiosis is nonasbestos ferruginous bodies with a black graphite core."
    explanation: States the specific morphologic marker used to recognize the disease.
  - reference: PMID:12238312
    reference_title: "Detection of graphite using laser microprobe mass analysis of a transbronchial biopsy from a foundry worker with mixed dust pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chest x-rays revealed both a reticular and nodular pattern in the lung, moderate apical distractions and pleural scarring, all of which were confirmed by high-resolution computed tomography."
    explanation: States the radiographic and computed tomographic pattern in a documented case.

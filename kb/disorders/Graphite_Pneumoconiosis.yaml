    reference_title: "Graphite pneumoconiosis and its declining prevalence in Sri Lanka."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Though the two surveys were comparable, they were conducted in two different mines."
    explanation: Records the limitation the source itself places on reading the prevalence decline as an effect of dust control.
differential_diagnoses:
- name: Silicosis
  distinguishing_features:
  - Natural graphite carries quartz, so the two commonly coexist and graphite pneumoconiosis is usually called a mixed dust pneumoconiosis
  - The nonasbestos ferruginous body with a black graphite core identifies graphite in tissue or sputum
  - In controlled rat comparison silica produced persistent inflammation at 100 mg/m3 where synthetic graphite produced none below 500 mg/m3
  evidence:
  - reference: PMID:2559661
    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute exposure by inhalation to 100 mg/m3 silica dust produced persistent pulmonary inflammation, as well as long-term changes in pulmonary alveolar macrophages (AM) typical of macrophage activation."
    explanation: Supports the quantitative difference in inflammatory potency between the two dusts measured in one experiment.
  - reference: PMID:8669194
    reference_title: "Nonasbestos ferruginous bodies in sputum from a patient with graphite pneumoconiosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The morphologic landmark of graphite pneumoconiosis is nonasbestos ferruginous bodies with a black graphite core."
    explanation: Supports the morphologic feature that identifies graphite rather than silica as the retained mineral.
- name: Pulmonary Tuberculosis
  distinguishing_features:
  - Active pulmonary tuberculosis was detected alongside pneumoconiosis in the same graphite mining cohort
  - Both produce radiographic lesions in exposed miners, so a lesion attributed to dust may be infection
  - Tuberculosis is treatable whereas the pneumoconiosis is not, which makes the distinction consequential
  evidence:
  - reference: PMID:9302808
    reference_title: "A cohort study of graphite workers in Sri Lanka."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a total of 18 cases of graphite pneumoconiosis and seven cases of active pulmonary tuberculosis were detected in the three rounds"
    explanation: Supports tuberculosis arising in the same screened population, at a rate high enough that radiographic lesions cannot be assumed to be dust disease.
discussions:
- discussion_id: graphite-fibrogenicity-unestablished
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does nearly pure graphite cause pneumoconiosis, or is the disease in graphite
    workers attributable to the quartz and other minerals that accompany natural
    graphite?
  rationale: >-
    This is the central unresolved question of the entry and it is why every
    fibrosis edge here is typed as indirect. The 1983 review of the whole
    literature found that of 605 reported cases, only 39 had autopsy or biopsy
    support, only 14 of those were documented well enough as to dust exposure to
    be interpretable, and of those 14 only one suggested that nearly pure
    graphite may cause the disease. Among animal studies it found no unanimous
    conclusion for pure or nearly pure graphite, while five of six studies of
    graphite containing silica demonstrated a fibrogenic effect. The controlled
    rat comparison points the same way, since synthetic graphite containing under
    0.1% quartz produced no inflammatory change at 1 to 100 mg/m3 and only a 24
    to 48 hour response at 500 mg/m3, whereas silica at 100 mg/m3 produced
    persistent inflammation and lasting macrophage activation. The exposure and
    the lesion are both real and reproducible; what is not established is that
    graphite itself is the fibrogenic agent. Resolving it would require cohorts
    with mineralogically characterized dust, which the review notes most
    published epidemiology lacks.
  attaches_to:
  - pathophysiology#Transient particle-driven alveolar inflammation
  - pathophysiology#Mixed dust fibrotic remodeling
  evidence:
  - reference: PMID:6314495
    reference_title: "Graphite pneumoconiosis. A review of etiologic and epidemiologic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Only one of these completely documented cases suggested that nearly pure graphite may cause graphite pneumoconiosis."
    explanation: The most direct statement of the gap, since among well-documented human cases nearly pure graphite was implicated only once.
  - reference: PMID:6314495
    reference_title: "Graphite pneumoconiosis. A review of etiologic and epidemiologic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The three studies on the effect of pure or nearly pure graphite gave no unanimous conclusion."
    explanation: Supports the absence of an experimental consensus for pure graphite specifically.
  - reference: PMID:6314495
    reference_title: "Graphite pneumoconiosis. A review of etiologic and epidemiologic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Five out of six studies dealing with graphite containing silica demonstrated fibrogenic effect on the lungs."
    explanation: Supports the contrasting experimental consensus where silica accompanies the graphite.
  - reference: PMID:6314495
    reference_title: "Graphite pneumoconiosis. A review of etiologic and epidemiologic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most of the 18 epidemiologic studies of workers exposed to graphite dust are invalid because they do not comply with ordinary methodologic requirement"
    explanation: Supports why the question remains open, by assessing the available epidemiology as largely methodologically inadequate.
  - reference: PMID:2559661
    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Following inhalation of 1-100 mg/m3 synthetic graphite the above-mentioned effects were not seen."
    explanation: Experimental support on the same side, from a study whose graphite contained under 0.1% quartz.
notes: >-
  This entry curates a real exposure disease whose causal agent is not
  established, and says so rather than papering over it. Graphite pneumoconiosis
  has a defined occupational exposure, a reproducible radiographic and
  pathological picture, and a morphologic marker of its own, the nonasbestos
  ferruginous body with a black graphite core. What it lacks is evidence that
  graphite itself is fibrogenic. Every edge from inflammation to fibrosis is
  therefore typed INDIRECT with the reason in its explanation, and the question
  is recorded as a KNOWLEDGE_GAP discussion attached to the two nodes it bears
  on.

  The disease is conventionally called a mixed dust pneumoconiosis and this entry
  keeps that wording deliberately. It is not a hedge. Natural graphite carries
  quartz, the foundry case involved graphite together with foundry vapours, and
  the one controlled experiment that used nearly pure synthetic graphite found
  almost no inflammatory response. Calling it a pure graphite disease would
  assert more than the literature supports.

  No FrequencyEnum bands are assigned to the phenotypes. The percentages
  available are radiographic lesion prevalences among exposed workers in
  particular mines (3.4%, 18.3%, and 8.5%, 8.9%, 4.1% across three survey
  rounds), which are prevalences of disease in an exposed population rather than
  frequencies of a feature among affected individuals. They are recorded as
  prevalence records, where that is what they mean.

  The prevalence decline is reported with the caveat the source itself gives. The
  1972 and 1987 surveys were conducted at two different mines, and the source
  states that attributing the fall to improved dust control can therefore only be
  tentative. The entry carries that limitation in the treatment evidence rather
  than presenting dust control as a demonstrated intervention effect.

  Tuberculosis is recorded as a differential rather than a complication. Seven
  cases of active pulmonary tuberculosis were found alongside 18 of
  pneumoconiosis in the same screened mining cohort, which is frequent enough
  that a radiographic lesion in this population cannot be assumed to be dust
  disease. Several older reports describe graphite pneumoconiosis complicated by
  tuberculosis, but none of those is cited here because the direction of any
  causal relationship is not established in the sources consulted.

  No genetic section, and no signalling pathway asserted. The deep-research
  report for this entry stated that no Wnt, MAPK, mTOR or PI3K-AKT cascade is
  established for this disease and that silica-model hypotheses about NLRP3,
  TGF-beta or autophagy are not disease-specific evidence; none is claimed here.
  That report's own reference validation also flagged one unresolved identifier,
  DOI:10.46234/ccdcw2024.280, which is cited nowhere in this entry.

prevalence:
- population: Underground workers at a Sri Lankan graphite mine, 1987 survey
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3400.0
  rate_denominator: POPULATION
  notes: >-
    12 of 340 workers examined (3.4%) had radiographic lesions suggestive of
    graphite pneumoconiosis. This is a prevalence among exposed underground
    miners, not a general-population figure, and the denominator is one mine.
  evidence:
  - reference: PMID:2607576
    reference_title: "Graphite pneumoconiosis and its declining prevalence in Sri Lanka."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve (3.4%) of the 340 workers examined had radiographic lesions suggestive of graphite pneumoconiosis."
    explanation: States the measured radiographic prevalence among exposed underground miners in that survey.
- population: Workers at a different Sri Lankan graphite mine, 1972 survey
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 18300.0
  rate_denominator: POPULATION
  notes: >-
    63 of 344 workers examined (18.3%) had similar lesions in a 1972 survey at a
    different mine. The source states explicitly that because the two surveys
    were in different mines, attributing the lower later figure to improved dust
    control can only be tentative.
  evidence:
  - reference: PMID:2607576
    reference_title: "Graphite pneumoconiosis and its declining prevalence in Sri Lanka."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a survey carried out in another mine in Sri Lanka in 1972 showed that 63 (18.3%) of the 344 workers examined had similar lesions"
    explanation: States the earlier and much higher radiographic prevalence, at a different mine.
progression:
- phase: Prolonged occupational exposure before disease appears
  notes: >-
    Workers who developed the disease during prospective follow-up had worked in
    the mine for an average of 22.6 years, so this is a disease of decades of
    exposure rather than of a single incident.
  evidence:
  - reference: PMID:9302808
    reference_title: "A cohort study of graphite workers in Sri Lanka."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five workers developed graphite pneumoconiosis in the course of the study. They had worked in the mine for an average of 22.6 years."
    explanation: Quantifies the exposure duration preceding incident disease in a prospective cohort.
- phase: Radiographic lesions with mixed dust pathology
  notes: >-
    Disease is recognized as radiographic reticular and nodular change, with
    lavage and biopsy consistent with mixed dust pneumoconiosis.
  evidence:
  - reference: PMID:12238312
    reference_title: "Detection of graphite using laser microprobe mass analysis of a transbronchial biopsy from a foundry worker with mixed dust pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bronchoalveolar lavage and transbronchial biopsies were also consistent with mixed dust pneumoconiosis"
    explanation: Supports the pathological stage at which the disease is confirmed in life.
pathophysiology:
- name: Respirable graphite dust deposition in the distal lung
  description: >-
    Occupational aerosolization in mines, mills, foundries and electrode
    manufacture delivers respirable graphite-containing dust to the small airways
    and alveolar regions. The inhaled material is not pure graphite, because
    natural graphite carries quartz and other minerals, which is why the disease
    is conventionally called a mixed dust pneumoconiosis.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: respiratory bronchiole
    term:
      id: UBERON:0002188
      label: respiratory bronchiole
  chemical_entities:
  - preferred_term: graphite
    term:
      id: CHEBI:33418
      label: graphite
  biological_processes:
  - preferred_term: response to toxic substance
    modifier: INCREASED
    term:
      id: GO:0009636
      label: response to toxic substance
  evidence:
  - reference: PMID:12238312
    reference_title: "Detection of graphite using laser microprobe mass analysis of a transbronchial biopsy from a foundry worker with mixed dust pneumoconiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhalation of dust containing graphite can cause lung disease in foundry workers and workers in graphite mines or mills."
    explanation: Supports occupational inhalation of graphite-containing dust as the initiating exposure, and names the settings.
  - reference: PMID:8669194
    reference_title: "Nonasbestos ferruginous bodies in sputum from a patient with graphite pneumoconiosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhalation of graphite dust can cause lung disease, mostly in the form of mixed-dust pneumoconiosis in individuals working in the metallurgic industry or graphite mines."
    explanation: Supports the same initiating exposure and records that the deposited dust is mixed rather than pure.
  downstream:
  - target: Alveolar macrophage retention of graphite particles
    causal_link_type: DIRECT
    description: Deposited particles are ingested by alveolar macrophages and retained for months.
    evidence:
    - reference: PMID:2559661
      reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "AM from the silica study, as well as from the 100 and 500 mg/m3 graphite studies, contained ingested particles throughout the entire 3 month experimental period."
      explanation: Directly measures retention of ingested graphite particles within alveolar macrophages over three months.
- name: Alveolar macrophage retention of graphite particles
  description: >-
    Graphite particles are ingested by alveolar macrophages and persist within
    them for months without killing them, since lavaged cells showed no loss of
    viability after either graphite or silica exposure. Retention without
    cytotoxicity is the point at which the graphite and silica pathways diverge.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: macrophage activation
    modifier: INCREASED
    term:
      id: GO:0042116
      label: macrophage activation
  evidence:
  - reference: PMID:2559661
    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AM from the silica study, as well as from the 100 and 500 mg/m3 graphite studies, contained ingested particles throughout the entire 3 month experimental period."
    explanation: Directly supports prolonged intracellular retention of graphite particles in alveolar macrophages.
  - reference: PMID:2559661
    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lavaged pulmonary cells showed no reduction in viability as a result of exposure to either of the dusts."
    explanation: Supports retention without measurable cytotoxicity, which constrains how the downstream inflammation can be explained.
  notes: >-
    Measured in Fischer 344 rats after a single acute inhalation exposure, at
    doses of 1 to 500 mg/m3 that are far above decades of workplace exposure. The
    retention is directly observed; the human chronic kinetics are inferred.
  downstream:
  - target: Transient particle-driven alveolar inflammation
    causal_link_type: DIRECT
    description: At high burden, retained particles provoke inflammation and macrophage activation, but only transiently.
    evidence:
    - reference: PMID:2559661
      reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Exposure to 500 mg/m3 graphite produced transient inflammation and AM activation for about 24-48 hr."
      explanation: Directly supports the step from retained particles to inflammation and macrophage activation, and bounds it as transient.
- name: Transient particle-driven alveolar inflammation
  description: >-
    Graphite produced inflammation and macrophage activation only at the highest
    dose tested and only for about 24 to 48 hours. Below 500 mg/m3 the
    inflammatory changes were absent altogether, whereas silica at 100 mg/m3
    produced persistent inflammation and lasting macrophage activation. The
    inflammatory response to nearly pure graphite is therefore weak and
    self-limited in this experiment.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775

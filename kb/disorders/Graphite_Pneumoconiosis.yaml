    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Exposure to 500 mg/m3 graphite produced transient inflammation and AM activation for about 24-48 hr."
    explanation: Directly supports the inflammation and its transient duration at the highest graphite dose.
  - reference: PMID:2559661
    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Following inhalation of 1-100 mg/m3 synthetic graphite the above-mentioned effects were not seen."
    explanation: Supports the absence of any inflammatory effect below the highest dose, which is the negative result that bounds this node.
  - reference: PMID:2559661
    reference_title: "Comparative effects of inhaled silica or synthetic graphite dusts on rat alveolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Acute exposure by inhalation to 100 mg/m3 silica dust produced persistent pulmonary inflammation, as well as long-term changes in pulmonary alveolar macrophages (AM) typical of macrophage activation."
    explanation: The within-experiment silica comparator, which shows persistent inflammation at one fifth the graphite dose and is the contrast this node rests on.
  downstream:
  - target: Mixed dust fibrotic remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Human disease shows fibrotic remodeling, but the route from the weak,
      self-limited inflammatory response to nearly pure graphite is not
      established. Experimentally, fibrogenicity was demonstrated for graphite
      containing silica and not for nearly pure graphite.
    evidence:
    - reference: PMID:6314495
      reference_title: "Graphite pneumoconiosis. A review of etiologic and epidemiologic aspects."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Five out of six studies dealing with graphite containing silica demonstrated fibrogenic effect on the lungs."
      explanation: >-
        Graded INDIRECT, and the edge typed as having unknown intermediates,
        because the demonstrated fibrogenic effect is for silica-containing
        graphite. The route from nearly pure graphite to fibrosis is what the
        review finds unsupported.
- name: Mixed dust fibrotic remodeling
  description: >-
    Human disease shows peribronchiolar dust macules, reticular and nodular
    change and, in a subset, confluent fibrosis, with lavage and biopsy
    consistent with mixed dust pneumoconiosis. The lesion is real and
    reproducible across cases; what is unresolved is how much of it graphite
    itself produces.
  biological_scale: TISSUE

animal_models:
- name: Fischer 344 rat acute graphite versus silica inhalation comparison
  species: Rat
  genotype: Fischer 344
  publication: PMID:2559661
  description: >-
    Fischer 344 rats given a single acute inhalation exposure to synthetic
    graphite at 1 to 500 mg/m3, or to silica at 100 mg/m3 as a within-experiment
    comparator, with bronchopulmonary lavage cells followed for about three
    months. This is the controlled comparison that separates the effect of
    graphite from that of silica, which no human cohort does.
  modeled_mechanisms:
  - target: Transient particle-driven alveolar inflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces particle retention in alveolar macrophages and the inflammatory
      response, but shows that response to be absent below 500 mg/m3 and
      transient at that dose, so it does not reproduce the sustained inflammation
      a chronic fibrotic human disease would require.
    limitations: >-
      A single acute exposure at 1 to 500 mg/m3 against decades of workplace
      exposure, and the material was synthetic graphite containing less than 0.1%
      quartz rather than the mixed natural dust workers inhale. The model
      therefore informs the pure-graphite question well and the human mixed dust
      disease poorly. Lavage cell profiles are not fibrosis endpoints.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantities are lavage cell counts, morphology and phagocytic
        indices over three months. The human node is sustained alveolar
        inflammation over decades, so an acute transient cellular response stands
        in for a chronic tissue process.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Fibrotic remodeling is outside the model boundary. No collagen or
        interstitial endpoint was measured, so the step from inflammation to
        fibrosis cannot be observed in it at all.

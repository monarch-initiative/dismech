treatments:
- name: Dust control and exposure reduction
  description: >-
    There is no treatment that reverses pneumoconiosis, so the whole therapeutic
    content of this disease is preventing further deposition. Dust control in one
    mine was followed by a fall in radiographic lesion prevalence across
    successive surveys.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational dust exposure control
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
    qualifiers:
    - predicate:
        preferred_term: has input
        term:
          id: RO:0002233
          label: has input
      value:
        preferred_term: graphite
        term:
          id: CHEBI:33418
          label: graphite
  target_mechanisms:
  - target: Respirable graphite dust deposition in the distal lung
    treatment_effect: INHIBITS
    description: Reducing airborne dust reduces the respirable burden delivered to the lung.
    evidence:
    - reference: PMID:9302808
      reference_title: "A cohort study of graphite workers in Sri Lanka."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This favourable situation was probably the result of dust control measures introduced in the mine after 1972."
      explanation: >-
        Graded INDIRECT because the source attributes the observed decline to
        dust control as a probable explanation rather than by controlled
        comparison, and the companion survey analysis states the inference can
        only be tentative since the two surveys were at different mines.
  evidence:

name: Graphite Pneumoconiosis
creation_date: "2026-10-07T17:11:49Z"
category: Environmental
categories:
- Occupational Lung Disease
- Pneumoconiosis
- Toxic Exposure Disorder
synonyms:
- graphite lung
- carbon pneumoconiosis
- graphite fibrosis of lung
description: >-
  Graphite pneumoconiosis is a rare occupational lung disease of workers exposed
  to respirable graphite dust in graphite mines and mills, foundries and
  electrode manufacture. Its morphologic landmark is the nonasbestos ferruginous
  body with a black graphite core, and it presents with reticular and nodular
  radiographic change, peribronchiolar dust macules and, in a subset, confluent
  fibrosis. The disease is usually described as a mixed dust pneumoconiosis, and
  that wording is load-bearing rather than incidental: natural graphite carries
  quartz, the fibrogenicity of nearly pure graphite is not established, and
  controlled comparison in rats found silica persistently inflammatory where
  synthetic graphite was not. This entry therefore curates a real exposure
  disease whose causal attribution to graphite itself remains open, and records
  that gap explicitly rather than asserting a mechanism the literature does not
  support.

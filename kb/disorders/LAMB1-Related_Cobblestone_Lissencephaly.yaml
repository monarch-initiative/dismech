treatments:
- name: Ventriculoperitoneal Shunting
  description: >
    Surgical CSF diversion (ventriculoperitoneal shunt) for the hydrocephalus that
    is frequently congenital or infantile in this disorder. There is no
    disease-modifying therapy; management of the structural malformation is
    supportive and symptomatic.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ventriculoperitoneal shunt placement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Hydrocephalus and Impaired CSF Dynamics
    treatment_effect: BYPASSES
    description: >
      CSF diversion bypasses the impaired CSF dynamics, relieving hydrocephalus;
      it is symptomatic and does not modify the upstream malformation.

- name: Encephalocele Repair
  description: >
    Neurosurgical repair of the occipital encephalocele when present.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure

- name: Antiseizure Pharmacotherapy
  description: >
    Antiseizure medications to control the epilepsy/seizures seen in congenital
    cases; agent selection follows standard pediatric epilepsy protocols, with no
    LAMB1-specific drug data.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure

- name: Supportive and Rehabilitative Care
  description: >
    Multidisciplinary supportive care for profound neurodevelopmental disability,
    including nutritional support (gastrostomy feeding in severely affected
    infants), physical therapy, occupational therapy, and speech therapy.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

- name: Genetic Counseling
  description: >
    Genetic counseling for families, given the 25% recurrence risk per pregnancy
    for autosomal-recessive inheritance and the frequent background of
    consanguinity; enables prenatal or preimplantation testing once a familial
    variant is known.
  treatment_term:

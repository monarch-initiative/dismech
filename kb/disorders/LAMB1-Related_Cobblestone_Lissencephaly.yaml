diagnosis:
- name: Molecular genetic testing (gene panel / whole-exome sequencing)
  description: >
    Diagnosis is molecular. Given phenotypic overlap with the
    alpha-dystroglycanopathy cobblestone spectrum, a cobblestone-lissencephaly /
    dystroglycanopathy gene panel or whole-exome/genome sequencing is used;
    prenatal whole-exome sequencing is feasible when ultrasound shows congenital
    hydrocephalus.

name: LAMB1-Related Cobblestone Lissencephaly
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- lissencephaly type 5
- LIS5
- cobblestone lissencephaly without muscular or eye involvement
- LAMB1-related cobblestone brain malformation
- cobblestone brain malformation without muscular or ocular abnormalities
- cystic leukoencephalopathy with cortical dysplasia
disease_term:
  preferred_term: cobblestone lissencephaly without muscular or ocular involvement
  term:
    id: MONDO:0014077
    label: cobblestone lissencephaly without muscular or ocular involvement
description: >
  An autosomal-recessive cobblestone (type II) lissencephaly caused by biallelic
  loss-of-function variants in LAMB1, encoding laminin subunit beta-1, a component
  of the pial basement membrane. Loss of laminin beta-1 disrupts the connection
  between radial glial endfeet and the pial surface, allowing neurons to overmigrate
  beyond the first cortical layer and producing a cobblestone cortical malformation.
  It is distinguished from the dystroglycanopathy cobblestone malformations
  (Walker-Warburg syndrome, muscle-eye-brain disease) by markedly less muscular and
  ocular involvement, presenting instead with cortical and white-matter
  abnormalities, severe cerebellar dysplasia, brainstem hypoplasia, occipital
  encephalocele, hydrocephalus, severe developmental delay, and seizures.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Reported in two families with autosomal-recessive cobblestone brain malformation
    harboring homozygous deleterious LAMB1 mutations.
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report homozygous deleterious mutations in LAMB1, encoding laminin subunit beta-1, in two families with autosomal-recessive COB."
    explanation: Establishes autosomal-recessive inheritance from biallelic LAMB1 mutations.


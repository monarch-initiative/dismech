name: LAMB1-Related Cobblestone Lissencephaly
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- lissencephaly type 5
- LIS5
- cobblestone lissencephaly without muscular or eye involvement
- LAMB1-related cobblestone brain malformation
- cobblestone brain malformation without muscular or ocular abnormalities
- cystic leukoencephalopathy with cortical dysplasia
disease_term:
  preferred_term: cobblestone lissencephaly without muscular or ocular involvement
  term:
    id: MONDO:0014077
    label: cobblestone lissencephaly without muscular or ocular involvement
description: >
  An autosomal-recessive cobblestone (type II) lissencephaly caused by biallelic
  loss-of-function variants in LAMB1, encoding laminin subunit beta-1, a component
  of the pial basement membrane. Loss of laminin beta-1 disrupts the connection
  between radial glial endfeet and the pial surface, allowing neurons to overmigrate
  beyond the first cortical layer and producing a cobblestone cortical malformation.
  It is distinguished from the dystroglycanopathy cobblestone malformations
  (Walker-Warburg syndrome, muscle-eye-brain disease) by markedly less muscular and
  ocular involvement, presenting instead with cortical and white-matter
  abnormalities, severe cerebellar dysplasia, brainstem hypoplasia, occipital
  encephalocele, hydrocephalus, severe developmental delay, and seizures.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Reported in two families with autosomal-recessive cobblestone brain malformation
    harboring homozygous deleterious LAMB1 mutations.
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report homozygous deleterious mutations in LAMB1, encoding laminin subunit beta-1, in two families with autosomal-recessive COB."
    explanation: Establishes autosomal-recessive inheritance from biallelic LAMB1 mutations.

genetic:
- name: LAMB1
  gene_term:
    preferred_term: LAMB1
    term:
      id: hgnc:6486
      label: LAMB1
  relationship_type: CAUSATIVE
  notes: >
    Biallelic (homozygous or compound-heterozygous) loss-of-function variants in
    LAMB1 (laminin subunit beta-1) cause cobblestone brain malformation; LAMB1 is
    localized to the pial basement membrane. The disorder is transmitted as an
    autosomal-recessive trait, and nearly all reported families are consanguineous.
    A genotype-phenotype correlation is emerging: homozygous frameshift/truncating
    (complete loss-of-function) alleles produce the most severe, congenital-onset
    disease, whereas missense/in-frame (hypomorphic) alleles produce milder,
    sometimes adult-onset leukoencephalopathy.
  variants:
  - name: c.1378T>C (p.Cys460Arg)
    description: >
      Homozygous missense variant in an EGF-like repeat; associated with the mild,
      adult-onset leukoencephalopathy end of the recessive spectrum.
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:32548278
      reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "identified 2 potent biallelic pathogenic mutations in LAMB1 (c.1378T>C, p.Cys460Arg)"
      explanation: Homozygous missense variant in a mild adult-onset case.
  - name: c.2690+1G>A
    description: >
      Splice-site variant identified (compound heterozygous) by prenatal
      whole-exome sequencing in fetuses with congenital hydrocephalus.
    type: splice site
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:35843586
      reference_title: "Compound variants of FKTN, POMGNT1, and LAMB1 gene identified by prenatal whole-exome sequencing in three fetuses with congenital hydrocephalus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "c.2690+1G>A/c.1447C>T(p.Arg483Cys) in LAMB1 were detected in the three fetuses."
      explanation: Compound-heterozygous LAMB1 variants detected prenatally in congenital hydrocephalus.
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report homozygous deleterious mutations in LAMB1, encoding laminin subunit beta-1, in two families with autosomal-recessive COB."
    explanation: Identifies LAMB1 as the causal gene.
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, the effect of missense mutations on the phenotype may be milder compared with that of frameshift mutations."
    explanation: Supports the genotype-phenotype correlation (missense milder than frameshift).
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was born to consanguineous parents"
    explanation: Illustrates the consanguineous background typical of reported families.

pathophysiology:
- name: Laminin Beta-1 Deficiency in the Pial Basement Membrane
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Pial Basement Membrane Assembly Failure"
  biological_scale: MOLECULAR
  description: >
    LAMB1 encodes laminin subunit beta-1, a structural component of the pial
    basement membrane. Deleterious LAMB1 mutations reduce or abolish functional
    laminin beta-1, weakening the pial basement membrane.
  biological_processes:
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: DECREASED
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMB1 is localized to the pial basement membrane"
    explanation: Localizes LAMB1 to the pial basement membrane, the site of the primary defect.
  downstream:
  - target: Pial Basement Membrane Breach

- name: Pial Basement Membrane Breach
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Pial Basement Membrane Breach"
  biological_scale: TISSUE
  description: >
    Loss of laminin beta-1 weakens the pial basement membrane / glia limitans,
    producing discontinuities (breaches) in the barrier that normally prevents
    neurons and glia from migrating past the pial surface.
  locations:
  - preferred_term: pia mater
    term:
      id: UBERON:0002361
      label: pia mater
  biological_processes:
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMB1 is localized to the pial basement membrane, suggesting that defective connection between radial glial cells and the pial surface mediated by LAMB1 leads to this malformation."
    explanation: >
      Loss of LAMB1 in the pial basement membrane disrupts the barrier, the
      central boundary defect that permits downstream overmigration.
  downstream:
  - target: Radial-Glial Basal Endfoot Detachment

- name: Radial-Glial Basal Endfoot Detachment
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Radial-Glial Basal Endfoot Detachment"
  biological_scale: CELLULAR
  description: >
    A defective LAMB1-mediated connection between radial glial cells and the pial
    surface detaches the radial-glial basal endfeet from the disrupted basement
    membrane, collapsing the radial scaffold that guides neuronal migration.
  cell_types:
  - preferred_term: cortical radial glial cell
    term:
      id: CL:0013000
      label: forebrain radial glial cell
  biological_processes:
  - preferred_term: formation of radial glial scaffolds
    term:
      id: GO:0021943
      label: formation of radial glial scaffolds
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "defective connection between radial glial cells and the pial surface mediated by LAMB1"
    explanation: >
      The radial glial cell-to-pial-surface connection fails, i.e. the basal
      endfeet detach from the pial basement membrane.
  downstream:
  - target: Neuronal Overmigration Through the Pial Surface

- name: Neuronal Overmigration Through the Pial Surface
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Neuronal Overmigration Across the Pial Boundary"
  biological_scale: CELLULAR
  description: >
    With the pial limiting membrane and radial scaffold disrupted, migrating
    neurons protrude beyond the first cortical layer at the pial surface.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cobblestone brain malformation (COB) is a neuronal migration disorder characterized by protrusions of neurons beyond the first cortical layer at the pial surface of the brain."
    explanation: Defines the overmigration phenotype underlying cobblestone malformation.
  downstream:
  - target: Cobblestone Cortical Malformation

- name: Cobblestone Cortical Malformation
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Cobblestone-Like Cortical Malformation and PMG Overlap"
  biological_scale: TISSUE
  description: >
    Neuronal overmigration produces a cobblestone (type II) cortical malformation
    with cortical gyral and white-matter signal abnormalities, accompanied by
    severe cerebellar dysplasia and brainstem hypoplasia.
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals displayed a constellation of brain malformations including cortical gyral and white-matter signal abnormalities, severe cerebellar dysplasia, brainstem hypoplasia, and occipital encephalocele"
    explanation: Describes the cobblestone cortical malformation and associated brain anomalies.
  - reference: PMID:29888467
    reference_title: "Bilateral cerebellar cysts and cerebral white matter lesions with cortical dysgenesis: Expanding the phenotype of LAMB1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscular involvement is absent"
    explanation: >
      The cobblestone malformation in LAMB1 disease occurs without muscular
      involvement, distinguishing it from the alpha-dystroglycanopathy congenital
      muscular dystrophies (Walker-Warburg syndrome, muscle-eye-brain disease).
  downstream:
  - target: Hydrocephalus and Impaired CSF Dynamics

- name: Hydrocephalus and Impaired CSF Dynamics
  biological_scale: ORGANISM
  description: >
    The abnormal cortical/leptomeningeal architecture and associated CNS
    malformation disrupt CSF dynamics, producing the congenital/infantile
    hydrocephalus characteristic of the disorder; this is the principal
    surgically treatable consequence (CSF diversion by shunting).
  biological_processes:
  - preferred_term: cerebrospinal fluid circulation
    term:
      id: GO:0090660
      label: cerebrospinal fluid circulation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMB1 mutation was originally reported to cause autosomal recessive cobblestone brain malformation, presenting with congenital hydrocephalus, severe developmental delay, and an increased head circumference."
    explanation: Congenital hydrocephalus is a defining organ-level consequence of the malformation.


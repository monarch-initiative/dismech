discussions:
- discussion_id: gap_lamb1_pial_boundary_human_model_translatability
  prompt: >-
    No mouse model of laminin beta-1 loss in the pial basement membrane exists;
    the rodent evidence for this entry's boundary-failure chain comes from other
    laminin chains (a laminin gamma1 nidogen-binding-site deletion, and
    Lamb2/Lamc3 double-null mice). Does that cross-chain evidence license the
    LAMB1-specific mechanism in humans, given that laminin-chain redundancy and
    heterozygous dosage sensitivity plainly differ between the two systems?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Pial Basement Membrane Breach
  - pathophysiology#Radial-Glial Basal Endfoot Detachment
  - pathophysiology#Neuronal Overmigration Through the Pial Surface
  rationale: >-
    The pial-boundary mechanism this entry curates — basement-membrane
    discontinuity, radial-glial endfoot retraction, and neuronal overmigration
    past the pial surface — is directly demonstrated in mice, but in every
    available model the perturbed subunit is a laminin chain other than beta-1:
    a targeted deletion of the nidogen-binding site of laminin gamma1, and
    ablation of the beta2 and gamma3 chains. For LAMB1 itself the human
    mechanism is inferred from protein localization ("LAMB1 is localized to the
    pial basement membrane, suggesting that defective connection ... leads to
    this malformation"), not from a Lamb1 model. Two concrete mismatches follow.
    First, laminin heterotrimers are combinatorial and partly redundant, so
    which pial-basement-membrane functions specifically require beta-1 rather
    than being buffered by another beta chain cannot be read off the gamma1 or
    beta2/gamma3 models. Second, the beta2/gamma3 model is dose-sensitive —
    heterozygous mice already show cortical laminar disruption — whereas human
    heterozygous LAMB1 carriers are clinically and radiologically unaffected,
    so mouse allele dosage does not map onto the strictly recessive human
    disease. This is a model-translatability gap, not an absence of mechanism
    evidence.
  evidence:
  - reference: PMID:12122064
    reference_title: "A critical function of the pial basement membrane in cortical histogenesis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In segments with a disrupted basement membrane, radial glia cells were
      retracted from the pial surface, and radially migrating neurons, including
      Cajal-Retzius cells and cortical plate neurons, passed the meninges or
      terminated their migration prematurely.
    explanation: >-
      Demonstrates this entry's endfoot-detachment and overmigration chain in
      mouse, but in a laminin gamma1 nidogen-binding-site mutant rather than in
      a Lamb1 model — the substitution that makes this a translatability gap.
  - reference: PMID:22961762
    reference_title: "beta2 and gamma3 laminins are critical cortical basement membrane components: ablation of Lamb2 and Lamc3 genes disrupts cortical lamination and produces dysplasia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, heterozygous mice also exhibit laminar disruption of
      cortical neurons, albeit with lesser severity.
    explanation: >-
      The closest mouse phenocopy of cobblestone lissencephaly is dose-sensitive
      in the heterozygous state, unlike the strictly recessive human LAMB1
      disorder, so severity cannot be read across species.
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic examination and brain MRI of her father showed no abnormalities"
    explanation: >-
      Documents an unaffected human heterozygous LAMB1 carrier, the contrast to
      the heterozygous mouse laminin phenotype.
  proposed_experiments:
  - experiment_id: exp_lamb1_organoid_pial_ecm_chain_specificity
    name: LAMB1 chain-specificity test in human cortical organoids with a pial-like ECM interface
    description: >-
      Build isogenic human iPSC-derived cortical organoids carrying biallelic
      LAMB1 loss-of-function and hypomorphic missense alleles, cultured against
      a defined laminin-rich pial-like extracellular-matrix interface, and
      compare them with LAMB2 and LAMC1 perturbations in the same background.
      Score basement-membrane continuity, radial-glial basal endfoot anchoring,
      and neuronal overmigration past the matrix boundary, and ask whether other
      beta chains compensate for beta-1 loss. Heterozygous lines are included to
      test directly whether the mouse dosage sensitivity has a human counterpart.
    experiment_type:
      preferred_term: isogenic human cortical organoid chain-substitution experiment
    model_systems:
    - name: Human cortical organoid with engineered pial-like laminin ECM interface
      description: >-
        Human iPSC-derived cortical organoids with an engineered laminin-rich
        pial-like matrix boundary, in isogenic LAMB1 wild-type, heterozygous, and
        biallelic-variant states.
      experimental_model_type: ORGANOID
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
      cell_types:
      - preferred_term: cortical radial glial cell
        term:
          id: CL:0013000
          label: forebrain radial glial cell
      cell_source: CRISPR-engineered or patient-derived human induced pluripotent stem cells
      culture_system: Three-dimensional cortical organoids at a defined laminin-rich matrix boundary
    perturbations:
    - name: LAMB1 allelic series with LAMB2 and LAMC1 comparators
      target: pathophysiology#Laminin Beta-1 Deficiency in the Pial Basement Membrane
      genes:
      - preferred_term: LAMB1
        term:
          id: hgnc:6486
          label: LAMB1
      description: >-
        Biallelic null, biallelic hypomorphic missense, and heterozygous LAMB1
        states, with LAMB2 and LAMC1 perturbations in the same isogenic
        background as chain-specificity comparators.
    readouts:
    - name: Basement-membrane continuity at the pial-like boundary
      target: pathophysiology#Pial Basement Membrane Breach
      biological_processes:
      - preferred_term: basement membrane organization
        term:
          id: GO:0071711
          label: basement membrane organization
        modifier: DECREASED
      direction: DECREASED
      interpretation: >-
        A beta-1-specific loss of continuity that other beta chains do not
        rescue would establish chain specificity in a human system.
    - name: Neuronal overmigration past the matrix boundary
      target: pathophysiology#Neuronal Overmigration Through the Pial Surface
      biological_processes:
      - preferred_term: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        modifier: INCREASED
      direction: INCREASED
      interpretation: >-
        Overmigration confined to biallelic lines, with unaffected
        heterozygotes, would show that the mouse heterozygous phenotype has no
        human counterpart.
    decision_criterion: >-
      Chain specificity is supported if biallelic LAMB1 loss breaches the
      matrix boundary and drives overmigration where LAMB2 perturbation in the
      same background does not; the mouse dosage mismatch is confirmed if
      heterozygous LAMB1 organoids are indistinguishable from wild type.

- discussion_id: gap_lamb1_allelic_spectrum_phenotype_determinants
  prompt: >-
    Why does biallelic LAMB1 loss produce a phenotypic range as wide as lethal
    fetal hydranencephaly, classic congenital cobblestone lissencephaly with
    hydrocephalus, and adult-onset leukoencephalopathy with no cortical
    dysgenesis at all — and is the truncating-versus-missense correlation this
    entry records actually established, or an artifact of a cohort of about a
    dozen patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Laminin Beta-1 Deficiency in the Pial Basement Membrane
  - pathophysiology#Cobblestone Cortical Malformation
  rationale: >-
    The reported LAMB1 phenotypic spectrum spans an extraordinary range for a
    single gene: at the severe end, fetal hydranencephaly incompatible with
    life; in the middle, the cobblestone malformation with hydrocephalus that
    defines this entry; and at the mild end, an adult-onset leukoencephalopathy
    in which cortical dysgenesis was explicitly absent. The entry's genetic
    notes describe the truncating-versus-hypomorphic gradient as "emerging",
    which is the right hedge — the whole reported cohort was about eleven
    patients and eleven variants, far too small to establish a
    genotype-phenotype rule, and it does not explain how a biallelic LAMB1
    genotype can spare the cortical malformation entirely. Whether the
    determinant is residual laminin beta-1 function, compensating laminin
    chains, modifier background, or developmental timing of pial
    basement-membrane assembly is unresolved. This is the disease-level instance
    of the non-one-to-one gene-to-phenotype mapping that the cortical
    malformation review flags as a general gap for malformations of cortical
    development, and it bounds what this entry may claim: the cobblestone
    malformation is not an obligate consequence of biallelic LAMB1 loss.
  evidence:
  - reference: PMID:37466007
    reference_title: "Novel homozygous LAMB1 in-frame deletion in a pediatric patient with brain anomalies and cerebrovascular event."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in LAMB1 are rare, with only 11 pathogenic variants
      and 11 patients reported to date.
    explanation: >-
      Quantifies the cohort the genotype-phenotype correlation rests on, which
      is too small to support a rule.
  - reference: PMID:33542858
    reference_title: "Biallelic Variants in LAMB1 Causing Hydranencephaly: A Severe Phenotype of a Rare Malformative Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we present LAMB1 as a monogenic cause of fetal hydranencephaly
      which was incompatible with life.
    explanation: Establishes the lethal severe extreme of the LAMB1 spectrum.
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI showed diffuse T2 hyperintensity of cerebral white matter, but
      neither cortical dysgenesis nor cystic lesions were observed
    explanation: >-
      Establishes the mild extreme, in which a biallelic LAMB1 genotype produced
      no cobblestone cortical malformation at all.
  proposed_experiments:
  - experiment_id: exp_lamb1_genotype_stratified_registry_and_residual_function
    name: Genotype-stratified LAMB1 registry with residual laminin beta-1 function assay
    description: >-
      Assemble a multi-centre registry of all biallelic LAMB1 cases with
      standardised fetal and postnatal neuroimaging review, and pair each
      genotype with a quantitative assay of residual laminin beta-1 protein and
      heterotrimer assembly in patient fibroblasts or iPSC-derived cells. Test
      whether measured residual function, rather than variant class alone,
      separates the hydranencephaly, cobblestone, and isolated-leukoencephalopathy
      presentations, and whether laminin beta-2 upregulation tracks with the
      milder outcomes.
    experiment_type:
      preferred_term: genotype-stratified natural history study with functional assay
    decision_criterion: >-
      The correlation is established if residual laminin beta-1 function
      separates the three presentation classes with no overlap; it is refuted if
      patients with indistinguishable residual function fall on opposite ends of
      the cortical-malformation spectrum, which would point to modifiers or
      developmental timing instead.

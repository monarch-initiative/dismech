differential_diagnoses:
- name: Alpha-dystroglycanopathy cobblestone malformations
  description: >
    The classic cobblestone (type II) lissencephalies — Walker-Warburg syndrome,
    muscle-eye-brain disease, and Fukuyama congenital muscular dystrophy — arise
    from defective alpha-dystroglycan glycosylation and present with cobblestone
    cortex like LAMB1 disease.
  distinguishing_features:
  - >-
    The dystroglycanopathies feature prominent congenital muscular dystrophy
    (elevated creatine kinase, abnormal EMG/NCS) and structural ocular
    malformations; LAMB1-related cobblestone malformation occurs without
    significant muscular or ocular involvement.
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "but they had less apparent ocular or muscular abnormalities than are typically observed in COB."
    explanation: The absence of muscle/eye involvement distinguishes LAMB1 disease.
  - reference: PMID:29888467
    reference_title: "Bilateral cerebellar cysts and cerebral white matter lesions with cortical dysgenesis: Expanding the phenotype of LAMB1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscular involvement is absent, in contrast to the α-dystroglycanopathy types of congenital muscular dystrophies."
    explanation: Explicitly contrasts LAMB1 disease with the dystroglycanopathies.

progression:
- phase: Congenital / infantile
  notes: >
    The classic form presents congenitally/in infancy with hydrocephalus and the
    cobblestone malformation; the structural malformation is a fixed developmental
    defect (static), with profound developmental delay and epilepsy.
  evidence:
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presenting with congenital hydrocephalus, severe developmental delay, and an increased head circumference."
    explanation: Defines the congenital-onset severe end of the course.
- phase: Adult-onset mild variant
  notes: >
    Hypomorphic (homozygous missense) alleles can produce a much milder,
    adult-onset progressive leukoencephalopathy with migraine, gait disturbance,
    and cognitive decline. Scope caveat: this milder phase lies at the boundary
    of MONDO:0014077 proper — the reported adult-onset case had neither cortical
    dysgenesis nor cystic lesions (i.e. no cobblestone malformation), so it
    represents the hypomorphic-allele end of the LAMB1 allelic spectrum rather
    than the cobblestone-defined disorder itself. Included here for
    allelic-spectrum context.
  evidence:
  - reference: PMID:32548278
    reference_title: "Adult-onset leukoencephalopathy with homozygous LAMB1 missense mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an adulthood-onset case with mild leukoencephalopathy and a novel homozygous LAMB1 missense mutation."
    explanation: Documents the mild, later-onset end of the recessive spectrum.


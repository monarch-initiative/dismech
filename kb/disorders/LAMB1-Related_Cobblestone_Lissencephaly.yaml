pathophysiology:
- name: Laminin Beta-1 Deficiency in the Pial Basement Membrane
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Pial Basement Membrane Assembly Failure"
  biological_scale: MOLECULAR
  description: >
    LAMB1 encodes laminin subunit beta-1, a structural component of the pial
    basement membrane. Deleterious LAMB1 mutations reduce or abolish functional
    laminin beta-1, weakening the pial basement membrane.
  biological_processes:
  - preferred_term: basement membrane organization
    term:
      id: GO:0071711
      label: basement membrane organization
    modifier: DECREASED
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LAMB1 is localized to the pial basement membrane, suggesting that defective connection between radial glial cells and the pial surface mediated by LAMB1 leads to this malformation."
    explanation: Localizes LAMB1 to the pial basement membrane, the site of the primary defect.
  downstream:
  - target: Neuronal Overmigration Through the Pial Surface

- name: Neuronal Overmigration Through the Pial Surface
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Neuronal Overmigration Across the Pial Boundary"
  biological_scale: CELLULAR
  description: >
    A defective LAMB1-mediated connection between radial glial cells and the pial
    surface disrupts the pial limiting membrane, allowing migrating neurons to
    protrude beyond the first cortical layer at the pial surface.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cobblestone brain malformation (COB) is a neuronal migration disorder characterized by protrusions of neurons beyond the first cortical layer at the pial surface of the brain."
    explanation: Defines the overmigration phenotype underlying cobblestone malformation.
  downstream:
  - target: Cobblestone Cortical Malformation

- name: Cobblestone Cortical Malformation
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Cobblestone-Like Cortical Malformation and PMG Overlap"
  biological_scale: TISSUE
  description: >
    Neuronal overmigration produces a cobblestone (type II) cortical malformation
    with cortical gyral and white-matter signal abnormalities, accompanied by
    severe cerebellar dysplasia and brainstem hypoplasia.
  evidence:
  - reference: PMID:23472759
    reference_title: "Mutations in LAMB1 cause cobblestone brain malformation without muscular or ocular abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals displayed a constellation of brain malformations including cortical gyral and white-matter signal abnormalities, severe cerebellar dysplasia, brainstem hypoplasia, and occipital encephalocele"
    explanation: Describes the cobblestone cortical malformation and associated brain anomalies.
  - reference: PMID:29888467
    reference_title: "Bilateral cerebellar cysts and cerebral white matter lesions with cortical dysgenesis: Expanding the phenotype of LAMB1 gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscular involvement is absent"
    explanation: >
      The cobblestone malformation in LAMB1 disease occurs without muscular
      involvement, distinguishing it from the alpha-dystroglycanopathy congenital
      muscular dystrophies (Walker-Warburg syndrome, muscle-eye-brain disease).


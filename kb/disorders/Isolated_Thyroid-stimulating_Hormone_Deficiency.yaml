- name: Invisibility to TSH-Based Newborn Screening
  biological_scale: ORGANISM
  role: Diagnostic-pathway failure, not a biological lesion
  description: >-
    Curated as a node because in this disease the detection pathway determines the
    outcome as directly as the biology does. A TSH-based screening programme looks
    for a raised TSH; here TSH is low or undetectable, so an affected infant screens
    normal. Whether a child is found in the first week of life or months later
    therefore depends on which analyte their country's programme measures - T4-based
    programmes such as the Dutch heel-prick screen detect the condition, TSH-only
    programmes cannot. Everything downstream of this node is preventable.
  evidence:
  - reference: PMID:31166470
    reference_title: "A RECURRENT MUTATION IN TSHB GENE UNDERLYING CENTRAL CONGENITAL HYPOTHYROIDISM UNDETECTABLE IN NEONATAL SCREENING."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated TSH deficiency is not detected by routine TSH-based neonatal screening, representing a clinical challenge."
    explanation: "The direct statement of the screening failure."
  - reference: PMID:26416826
    reference_title: "Recent advances in central congenital hypothyroidism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since TSH is not elevated, CCH will evade diagnosis in primary, TSH-based, CH screening programs and delayed detection may result in neurodevelopmental delay due to untreated neonatal hypothyroidism."
    explanation: "Gives both the mechanism of the screening failure and its consequence."
  downstream:
  - target: Global developmental delay
    description: >-
      The screening failure is upstream of the neurodevelopmental outcome, because
      the outcome is a function of how long the deficiency goes untreated.
    evidence:
    - reference: PMID:27362444
      reference_title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

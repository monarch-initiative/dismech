notes: >-
  Entry scope, and the one decision a reader should check first, because the
  neighbouring entry already exists. `kb/disorders/Central_Congenital_Hypothyroidism.yaml`
  curates MONDO:0016410, the wider clinical category, and MONDO makes
  MONDO:0010139 a child of it. That entry already carries a `genetic:` row named
  "TSHB pathogenic variants", so the honest question is whether this should have
  been a `has_subtypes` row there instead of a separate entry.

  It is curated separately, on a mechanistic ground rather than an
  administrative one. The parent entry's pathograph is rooted at a node called
  "Impaired Hypothalamic-Pituitary TSH Drive", and that node is the wrong
  description of this disease. In TSHB deficiency the drive is not impaired: the
  hypothalamus and the thyrotroph work normally, and the hormone they produce
  cannot assemble into a functional heterodimer. The founding report showed
  exactly this - the mutant beta polypeptide is conformationally altered and
  cannot associate with the alpha subunit. Folding TSHB into a regulatory-drive
  node would assert a mechanism that is wrong for it, and the same applies in
  reverse to IGSF1, TBL1X, TRHR and IRS4, each of which does act upstream and each
  of which has its own MONDO term and its own extrathyroidal features
  (macroorchidism for IGSF1, sensorineural hearing loss for TBL1X).

  What the parent entry carries for TSHB today is a gene row with one citation
  and an inheritance block - not a pathograph. The two entries are therefore
  complementary rather than duplicative, and the relationship is now recorded
  explicitly in `mappings.mondo_mappings` as a `skos:broadMatch` to
  MONDO:0016410. The reciprocal gap - the parent entry carries no
  `mappings.mondo_mappings` block at all and does not cite MONDO:0010139 - is
  real and is left for a separate change rather than bundled into a curation PR
  for a different disease; it is recorded in `discussions`.

  This scoping was challenged rather than assumed. The automated second-opinion
  comment on the claim issue (dismech#12392) raised the parent entry and argued
  the subtype case; this note is the answer to it. Worth recording that the
  duplicate preflight for this claim searched `origin/main` for MONDO:0010139 and
  for the label "isolated thyroid-stimulating hormone deficiency" and found
  nothing - it did not search for `TSHB` or for "central congenital
  hypothyroidism", which is how an entry covering the same gene was missed. That
  is the exact failure the `claim-disease` skill warns about when it says the
  claim check cannot see a disease curated under a different term.

  This scoping is not hypothetical bookkeeping. The deep-research report used for
  this entry covers all five genes, and `just preflight-dr` returned WARN on
  exactly this basis, reporting IGSF1 mentioned 33 times against TSHB's 67 and
  warning that the report may mix in a second disease entity. Those sections were
  excluded rather than curated down. Nothing in this entry is sourced from the
  report's IGSF1, TBL1X, TRHR or IRS4 material.

  No `has_subtypes` rows are declared. The reported TSHB allele classes - a
  recurrent frameshift, missense alleles, a start-loss variant and a 5.4-kb
  deletion - all converge on absent or non-functional TSH, so there is no basis
  for splitting.

  Module conformance checked and left unset. `just list-modules` was read and
  `kb/modules/` grepped for `hypothalamic`, `pituitary`, `hormone`, `endocrine`,
  `thyroid` and `receptor signaling`. Nothing covers loss of a pituitary
  trophic hormone, so `conforms_to` is left off rather than forced onto a
  general signalling module.

  No GeneReviews chapter exists for this disorder. Checked offline with
  `just check-genereviews kb/disorders/Isolated_Thyroid-stimulating_Hormone_Deficiency.yaml`
  against the committed Bookshelf index; NO_CHAPTER for GeneReviews.

  Deep-research provenance and what was and was not taken from it.
  `research/Isolated_Thyroid-stimulating_Hormone_Deficiency-deep-research-openscientist.md`
  (provider openscientist, 26 citations). Two things from its own validation output
  were followed up rather than taken at face value:

  First, its reference validation listed `PMID:25248602` as unresolved with 8
  mentions, which under the reference SOP would bar citing it. Re-fetched with
  `just fetch-reference PMID:25248602` on 2026-09-21: it resolves cleanly to
  Persani & Bonomi, "Uncertainties in endocrine substitution therapy for central
  endocrine insufficiencies: hypothyroidism", and contains both sentences the
  report quoted from it. The report's flag was a transport-level lookup failure,
  not a confabulation - which is the ambiguity the validator's own wording warns
  about. It is cited here, and this note records the re-check.

  Second, its term validation reported 8 of 14 checked labels as naming a
  different term. One of those is a substantive error rather than a formatting
  one: the report gives `CL:0000209` for "thyrotrope/thyrotropic cell of pars
  distalis". `CL:0000209` is *taste receptor cell*. The correct term, used in this
  entry, is `CL:0000476` thyrotroph, looked up in `cache/cl/terms.csv`. No CURIE in
  this entry was taken from the report without an independent lookup.

  The report's most valuable single contribution was a negative one and is curated
  in `discussions`: TSHB p.R75G, a founder variant reaching about 4% carrier
  frequency in Bene Israel Indian Jews, does *not* cause this disease. It leaves
  TSH function intact and merely defeats its detection on some immunoassay
  platforms. It was verified directly against PMID:34981755 before being recorded.
references:
- reference: PMID:1762181
  title: "[DNA diagnosis in endocrinological disease--pituitary disease]."
  tags: []
  findings:
  - statement: >-
      The original molecular description: three consanguineous Japanese families
      sharing a missense mutation in exon 2 of the TSH beta-subunit gene, and the
      characterisation of untreated congenital isolated TSH deficiency as causing
      cretinism with severe mental and growth retardation.
- reference: PMID:2792087
  title: "Thyroid-stimulating hormone (TSH) deficiency caused by a single base substitution in the CAGYC region of the beta-subunit."
  tags: []
  findings:
  - statement: >-
      The founding report, and the one that establishes the molecular mechanism
      directly rather than by inference: a single base substitution in the
      conserved CAGYC region of the TSH beta subunit produces a conformationally
      altered polypeptide that cannot associate with the alpha subunit, shown by
      microinjection of the mutated mRNA into Xenopus oocytes.
- reference: PMID:39913280
  title: "Newborn screening for central congenital hypothyroidism: past, present and future."
  tags: []
  findings:
  - statement: >-
      Review of newborn screening for the wider category, giving an incidence
      estimate for central congenital hypothyroidism of 1 in 13,000-30,000 against
      1 in 2,000-3,000 for primary congenital hypothyroidism, and noting that
      central CH is the only pituitary hormone deficiency any newborn screening
      programme detects.
- reference: PMID:31504637
  title: "Genetics of Congenital Isolated TSH Deficiency: Mutation Screening of the Known Causative Genes and a Literature Review."
  tags: []
  findings:
  - statement: >-
      The systematic review of the genetic architecture. Five genes are established
      for congenital isolated TSH deficiency, of which TSHB is the only one acting
      on the hormone itself; in a Japanese cohort of 13, a causative variant was
      found in 46%, none of them in TSHB.
- reference: PMID:27362444
  title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
  tags: []
  findings:
  - statement: >-
      The UK/Ireland series, establishing that the TSHB mutational spectrum includes
      structural variation as well as point mutations, and reporting the
      outcome contrast between a sibling treated from birth and late-treated
      relatives.
- reference: PMID:31166470
  title: "A RECURRENT MUTATION IN TSHB GENE UNDERLYING CENTRAL CONGENITAL HYPOTHYROIDISM UNDETECTABLE IN NEONATAL SCREENING."
  tags: []
  findings:
  - statement: >-
      Reports the recurrent c.373delT allele across multiple countries and states
      the screening problem directly: this disorder is not detected by routine
      TSH-based neonatal screening.
- reference: PMID:31703413
  title: "The Pathogenic TSH β-subunit Variant C105Vfs114X Causes a Modified Signaling Profile at TSHR."
  tags: []
  findings:
  - statement: >-
      The functional characterisation of the commonest pathogenic allele at the
      receptor, showing what the mutant beta subunit does to TSHR signalling rather
      than inferring it from the frameshift.
- reference: PMID:39875149
  title: "Central congenital hypothyroidism due to TSHB gene mutation: 25-year follow-up."
  tags: []
  findings:
  - statement: >-
      Long-term outcome in a single patient treated from the neonatal period: severe
      congenital hypothyroidism with neurocognitive sequelae averted by timely
      levothyroxine, and normal remaining anterior pituitary function.
- reference: PMID:26416826
  title: "Recent advances in central congenital hypothyroidism."
  tags: []
  findings:
  - statement: >-
      Review establishing that T4-based newborn screening detects central congenital
      hypothyroidism where TSH-based screening cannot, and that the absence of a
      usable TSH signal makes treatment monitoring difficult.
- reference: PMID:25248602
  title: "Uncertainties in endocrine substitution therapy for central endocrine insufficiencies: hypothyroidism."
  tags: []
  findings:
  - statement: >-
      States the scale of the entity - central hypothyroidism is about 1000-fold
      rarer than primary hypothyroidism - and the monitoring principle that
      levothyroxine dose in central hypothyroidism cannot be titrated on TSH.
- reference: PMID:34981755
  title: "TSHB R75G is a founder variant and prevalent cause of low or undetectable TSH in Indian Jews."
  tags: []
  findings:
  - statement: >-
      Cited for a negative claim. The TSHB p.R75G founder variant, at ~4% carrier
      frequency in Bene Israel Indian Jews, does not impair TSH function; it defeats
      detection on some immunoassays and so mimics a low TSH in euthyroid people.
      It is the principal differential for an unexpectedly low TSH and is not a
      cause of this disease.

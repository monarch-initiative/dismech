      snippet: "TSHB gene mutation results in isolated central congenital hypothyroidism (iCCH)."
      explanation: "The direct statement of the disease-defining biochemical state."
  - target: Global developmental delay
    description: >-
      Untreated neonatal thyroid hormone deficiency during the period of CNS
      maturation. Preventable, not inevitable.
    evidence:
    - reference: PMID:27362444
      reference_title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
      supports: SUPPORT

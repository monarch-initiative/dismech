- name: Systemic Thyroid Hormone Deficiency
  biological_scale: ORGANISM
  role: Systemic consequence
  description: >-
    Low circulating free T4 and free T3 from birth, with a TSH that is low, normal
    or undetectable and does not rise. Thyroid hormone is required for central
    nervous system myelination and maturation, for linear growth and for basal
    metabolic rate, so the deficiency is expressed across all three. The severity
    is comparable to athyreosis rather than to a partial biosynthetic defect, which
    was not what the field expected of a TSHB lesion.
  biological_processes:
  - preferred_term: thyroid hormone receptor signaling in peripheral tissues
    term:
      id: GO:0002154
      label: thyroid hormone receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:31703413
    reference_title: "The Pathogenic TSH β-subunit Variant C105Vfs114X Causes a Modified Signaling Profile at TSHR."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Therefore, patients with a TSHB-gene mutation show a severe phenotype comparable to patients with athyreosis"
    explanation: "Calibrates the severity of the systemic deficiency against a reference condition. BACKGROUND because this in-vitro paper is restating the clinical literature here, not reporting its own patients."
  - reference: PMID:31703413
    reference_title: "The Pathogenic TSH β-subunit Variant C105Vfs114X Causes a Modified Signaling Profile at TSHR."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Within the first weeks to months of life, affected patients present with severe signs of congenital hypothyroidism, including hypothermia, lethargy, prolonged jaundice, muscle hypotonia, constipation and umbilical hernias."
    explanation: "Enumerates the neonatal systemic manifestations. BACKGROUND for the same reason."
  downstream:

biochemical:
- name: Serum Thyrotropin (TSH)
  presence: DECREASED
  notes: >-
    The single most important thing about this marker in this disease is that its
    value is not interpretable on its own. A low or undetectable TSH is the normal
    reading in a healthy person and the diagnostic reading here; only the
    combination with a low free T4 makes it abnormal. It also cannot be used to
    monitor treatment, for the same reason. No numeric reference interval is
    recorded: none of the sources cited here states one, and the conventional adult
    interval is assay-dependent. It is left out rather than attributed to a source
    that does not contain it.
  biomarker_term:
    preferred_term: Thyrotropin
    term:
      id: LOINC:3016-3
      label: Thyrotropin [Units/volume] in Serum or Plasma
  readouts:
  - target: Failure to Assemble Bioactive TSH Heterodimer
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Immunoassay TSH is low, normal or undetectable rather than raised. Note that
      the assay measures immunoreactive TSH, which is not the same thing as
      bioactive TSH - a distinction that matters here in both directions, since the
      p.R75G variant produces the opposite dissociation.
    evidence:
    - reference: PMID:39875149
      reference_title: "Central congenital hypothyroidism due to TSHB gene mutation: 25-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the history of low T4 and undetectable TSH at diagnosis plus subsequent normal anterior pituitary hormones and normal pituitary on MRI raised suspicion of iCCH"
      explanation: "The measured TSH in a confirmed patient, and the reasoning it supported."
  evidence:
  - reference: PMID:26416826
    reference_title: "Recent advances in central congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since TSH cannot be used as an indicator of euthyroidism, adequacy of treatment can be difficult to monitor due to a paucity of alternative biomarkers."
    explanation: "States the monitoring limitation that makes this marker diagnostically necessary but therapeutically useless here."
- name: Serum Free Thyroxine (Free T4)
  presence: DECREASED
  notes: >-
    Free T4 is the analyte that both detects the disease and monitors its
    treatment, which is unusual - in primary hypothyroidism TSH does both. No
    numeric reference interval is recorded here: the sources cited state the
    direction of change but no interval, and rather than import a conventional
    adult band into a congenital disorder whose age-specific intervals differ
    substantially, the slot is left empty. The convention of recording a
    conventional laboratory interval in `notes` rather than attributing it to a
    citation, as `Generalized_Resistance_to_Thyroid_Hormone` does, would be
    available if an age-appropriate band were needed.
  biomarker_term:
    preferred_term: Free thyroxine
    term:
      id: LOINC:14920-3
      label: Thyroxine (T4) free [Moles/volume] in Serum or Plasma
  readouts:
  - target: Systemic Thyroid Hormone Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low free T4 with a non-elevated TSH is the diagnostic pattern, and free T4 in
      the mid-to-upper reference range is the treatment target.
    evidence:
    - reference: PMID:39875149
      reference_title: "Central congenital hypothyroidism due to TSHB gene mutation: 25-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the history of low T4 and undetectable TSH at diagnosis plus subsequent normal anterior pituitary hormones and normal pituitary on MRI raised suspicion of iCCH"
      explanation: "The low T4 measured at diagnosis, alongside the normal remaining pituitary function that makes the deficiency isolated."
  evidence:
  - reference: PMID:25248602
    reference_title: "Uncertainties in endocrine substitution therapy for central endocrine insufficiencies: hypothyroidism."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Therefore, L-T4 replacement in CeH should rely on the combined evaluation of several biochemical and clinical parameters in order to overcome the lack of accuracy of the single index."
    explanation: "States that no single biochemical index is adequate for monitoring, which is why free T4 is used with clinical assessment rather than alone."
genetic:
- name: TSHB
  gene_term:
    preferred_term: TSHB
    term:
      id: hgnc:12372
      label: TSHB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic loss-of-function alleles - frameshift, missense, start-loss and whole-gene deletion
  presence: Positive
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    A caution that belongs on this row rather than anywhere else: not every TSHB
    variant found in a person with a low TSH is causal. The p.R75G allele, at about
    4% carrier frequency in Bene Israel Indian Jews and on a shared haplotype with
    South Asian populations, leaves TSH function intact and only defeats its
    detection on some immunoassay platforms. Carriers are euthyroid and have been
    misdiagnosed with hyperthyroidism. A TSHB variant in a patient with a low TSH
    but a normal free T4 is much more likely to be this than to be this disease.
    See `discussions`.
  evidence:
  - reference: PMID:31504637

- discussion_id: tshb_screening_analyte_determines_outcome
  status: OPEN
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Invisibility to TSH-Based Newborn Screening
  prompt: >-
    How many cases of TSHB-related congenital central hypothyroidism are missed by
    TSH-only newborn screening, and what is the neurodevelopmental cost?
  rationale: >-
    The disorder is preventable and the intervention is cheap, so the number that
    matters is how many children are not found. It cannot be read off the
    literature: the Dutch T4-based figure of up to 1:16 000 is for central
    congenital hypothyroidism as a whole, the TSHB share of that is unquantified,
    and the countries where the miss occurs are by construction the ones with no
    denominator. The case series report late diagnoses at five months, at twelve
    years and after neurodevelopmental damage had occurred, but a case series cannot
    give a rate.

    This is a knowledge gap with an unusual property: closing it would not change
    what we know about the biology at all, and would change practice immediately.
- discussion_id: tshb_entity_boundary_versus_other_cch_genes
  status: OPEN
  kind: CURATION_TODO
  attaches_to:
  - disease#Isolated Thyroid-stimulating Hormone Deficiency
  prompt: >-
    Should IGSF1, TBL1X, TRHR and IRS4 central hypothyroidism be curated as separate
    dismech entries, and should a grouping hold them together with this one?
  rationale: >-
    Clinically these five are one differential - a child with a low free T4 and a
    non-elevated TSH - and the published reviews treat them as one entity.
    Mechanistically they are not one thing: TSHB removes the hormone, while IGSF1,
    TBL1X, TRHR and IRS4 act on the regulatory machinery upstream of it, and each
    carries extrathyroidal features the others do not. This entry therefore curates
    only the TSHB entity.

    Two concrete follow-ups, neither actioned here because both change a file this
    curation PR has no business touching:

    1. `kb/disorders/Central_Congenital_Hypothyroidism.yaml` (MONDO:0016410)
       carries no `mappings.mondo_mappings` block at all and does not cite
       MONDO:0010139. This entry now records the relationship from its own side as
       a `skos:broadMatch`, but the parent does not record it reciprocally, so a
       reader arriving at the parent has no signal that the TSHB entity is curated
       separately. Its "TSHB pathogenic variants" genetic row is the obvious place
       for a cross-reference.
    2. IGSF1, TBL1X, TRHR and IRS4 each have their own MONDO term and none is
       curated as a dismech entry. Once two or more exist, a `kb/groupings/` record
       over the clinical differential would capture it without collapsing the
       mechanisms, which is what a grouping is for. A grouping built now would have
       one disease member and would encode this entry rather than the category.

    Raised by the automated second-opinion comment on dismech#12392, which found
    the parent entry and argued the subtype case. The scope note above is the
    answer; these are the parts of its argument that stand.

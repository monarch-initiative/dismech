  description: >-
    Biallelic TSHB variants, homozygous or compound heterozygous. Consanguinity is
    the usual setting for the homozygous cases and was how the disorder was first
    delineated; the recurrent c.373delT allele also appears in compound
    heterozygotes with a second TSHB lesion.
  evidence:
  - reference: PMID:34981755
    reference_title: "TSHB R75G is a founder variant and prevalent cause of low or undetectable TSH in Indian Jews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Bi-allelic loss-of-function mutations in TSHB, encoding the beta subunit of thyroid-stimulating hormone (TSH), cause congenital hypothyroidism."
    explanation: "States the biallelic requirement. Marked BACKGROUND because this paper's own subject is the non-pathogenic R75G variant; the sentence is its framing of the established disease."
  - reference: PMID:27362444
    reference_title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the affected individuals were compound heterozygous for TSHB c.373delT and either a 5·4-kB TSHB deletion"
    explanation: "Compound heterozygosity, confirming that two damaged alleles rather than one are needed."
pathophysiology:
- name: Biallelic TSHB Loss of Function
  biological_scale: MOLECULAR
  role: Initiating genetic lesion
  description: >-
    Two damaged TSHB alleles. The reported lesion classes are a recurrent
    frameshift (p.Cys105Valfs*114), missense alleles including the exon-2 change
    that defined the disorder in three consanguineous Japanese families, a
    start-loss allele p.Met1?, and a 5.4-kb whole-gene deletion. Note that the
    recurrent frameshift is cited in the literature under two cDNA numberings,
    c.373delT and c.313delT, depending on whether the signal peptide is counted;
    they are the same allele, and this entry names it at protein level to avoid
    implying they are two.
  genetic_context:
    gene:
      preferred_term: TSHB
      term:
        id: hgnc:12372
        label: TSHB
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in the consanguineous and founder pedigrees; compound
      heterozygous in the UK and Ireland kindreds, where the recurrent frameshift
      was paired with a large deletion or a start-loss allele.
  genes:
  - preferred_term: TSHB
    term:
      id: hgnc:12372
      label: TSHB
  evidence:
  - reference: PMID:27362444
    reference_title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous mutations in the TSH beta subunit gene (TSHB) result in severe, isolated, central congenital hypothyroidism (CCH)."
    explanation: "States the gene-disease relationship and the zygosity requirement."
  - reference: PMID:1762181
    reference_title: "[DNA diagnosis in endocrinological disease--pituitary disease]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "They had a same missense mutation in the 2nd exon of the TSH beta-subunit gene"
    explanation: "The founding molecular observation, in three consanguineous Japanese families."
  downstream:
  - target: Failure to Assemble Bioactive TSH Heterodimer
    description: >-
      Without an intact beta subunit the alpha subunit has no thyrotropin-specific
      partner to pair with.
    evidence:
    - reference: PMID:31703413
      reference_title: "The Pathogenic TSH β-subunit Variant C105Vfs114X Causes a Modified Signaling Profile at TSHR."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The TSHB mutation C105Vfs114X leads to isolated thyroid-stimulating-hormone-(TSH)-deficiency and results in a severe phenotype."
      explanation: "Links the specific allele to hormone deficiency, which is what this edge asserts."
- name: Failure to Assemble Bioactive TSH Heterodimer
  biological_scale: MOLECULAR
  role: Hormone-level lesion
  description: >-
    TSH is a heterodimer of a shared alpha subunit and the TSHB-encoded beta
    subunit; the beta subunit is what confers thyrotropin specificity. The
    frameshift allele has been characterised at the receptor rather than merely
    inferred: the mutant hormone diminishes cAMP signalling at TSHR, and does not
    induce phospholipase C activation at all, while - unexpectedly - leaving MAPK
    signalling comparable to wild type. So the lesion is a selective loss across
    TSHR's signalling arms rather than a uniform silencing of the receptor.
  cell_types:
  - preferred_term: pituitary thyrotroph
    term:
      id: CL:0000476
      label: thyrotroph
  biological_processes:
  - preferred_term: thyroid-stimulating hormone signaling at TSHR
    term:
      id: GO:0038194
      label: thyroid-stimulating hormone signaling pathway
    modifier: DECREASED
  locations:
  - preferred_term: adenohypophysis
    term:
      id: UBERON:0002196
      label: adenohypophysis
  evidence:
  - reference: PMID:31703413
    reference_title: "The Pathogenic TSH β-subunit Variant C105Vfs114X Causes a Modified Signaling Profile at TSHR."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The patient mutation C105Vfs114X and further designed TSH mutants diminished cyclic adenosine monophosphate (cAMP) signaling activity."
    explanation: "Direct receptor-level measurement of what the mutant hormone fails to do."
  - reference: PMID:31703413
    reference_title: "The Pathogenic TSH β-subunit Variant C105Vfs114X Causes a Modified Signaling Profile at TSHR."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, MAPK signaling for all mutants was comparable to WT, while none of the mutants induced PLC activation."
    explanation: "Establishes that the loss is arm-selective, not a global failure of the receptor - which is why the node describes a modified rather than an abolished signal."
  - reference: PMID:2792087
    reference_title: "Thyroid-stimulating hormone (TSH) deficiency caused by a single base substitution in the CAGYC region of the beta-subunit."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Microinjection of the mutated beta mRNAs into Xenopus laevis oocytes led to the formation of conformationally altered beta polypeptides that could not associate with alpha subunits."
    explanation: "The direct demonstration that this node asserts: the mutant beta subunit is misfolded and cannot pair with the alpha subunit, so no heterodimer forms. This is a failure of assembly rather than of production, and it is why the disorder is not a failure of pituitary drive."
  - reference: PMID:2792087
    reference_title: "Thyroid-stimulating hormone (TSH) deficiency caused by a single base substitution in the CAGYC region of the beta-subunit."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The alteration is in the center of the so-called CAGYC region, which consists of an amino acid sequence conserved among all of the known glycoprotein hormone beta subunits."
    explanation: "Locates the founding lesion in a motif conserved across every glycoprotein hormone beta subunit, which is why a single substitution there abolishes pairing."

  downstream:
  - target: Understimulation of the Normal Thyroid Gland
    description: The thyroid is structurally intact but receives no adequate trophic signal.
    evidence:
    - reference: PMID:26416826
      reference_title: "Recent advances in central congenital hypothyroidism."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Central congenital hypothyroidism (CCH) is a rare disorder in which inadequate thyroid hormone biosynthesis occurs due to defective stimulation of a normal thyroid gland by thyroid stimulating hormone (TSH)."
      explanation: "States the defining relation: a normal gland, defectively stimulated. Marked REVIEW_SYNTHESIS because the source is a review stating the field's settled definition."
- name: Understimulation of the Normal Thyroid Gland
  biological_scale: TISSUE
  role: Target organ consequence
  description: >-
    Thyroid follicular cells do not receive the cAMP-mediated trophic and secretory
    signal they depend on, so thyroid hormone synthesis and release fall. The gland
    is not goitrous and is not intrinsically abnormal, which is what distinguishes
    this from primary congenital hypothyroidism and gives the disorder its OMIM
    name, congenital non-goitrous hypothyroidism.
  cell_types:

name: Isolated Thyroid-stimulating Hormone Deficiency
creation_date: "2026-09-21T00:00:00Z"
description: >-
  Congenital central hypothyroidism caused by biallelic loss-of-function variants
  in TSHB, the gene for the beta subunit of thyroid-stimulating hormone. The
  thyroid gland itself is normal; what is missing is the pituitary signal that
  drives it. Because the beta subunit is what makes TSH a thyrotropin rather than
  a generic glycoprotein hormone - the alpha subunit is shared with LH, FSH and
  hCG - losing it means no functional heterodimer can be assembled, the thyroid is
  never stimulated, and circulating free T4 and free T3 fall from birth.

  The defining clinical problem is diagnostic rather than therapeutic. Treatment is
  levothyroxine and, given early enough, it is close to curative: a 25-year
  follow-up of a severely affected patient concluded that timely replacement
  averted neurocognitive sequelae. But the biochemical signature is a low free T4
  beside a TSH that is low, normal or undetectable, and newborn screening
  programmes that measure TSH alone are built to detect the opposite pattern. Such
  a programme cannot see this disease at all, so affected infants present later
  with prolonged jaundice, hypotonia, failure to thrive and oedema, and untreated
  disease ends in irreversible intellectual disability and growth failure. Whether
  a given child is detected depends on which analyte their country screens.
category: Mendelian
parents:
- Congenital Hypothyroidism
- Central Hypothyroidism

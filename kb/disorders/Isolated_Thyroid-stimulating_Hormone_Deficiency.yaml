    explanation: "Places TSHB among the established causative genes for congenital isolated TSH deficiency."
  - reference: PMID:31166470
    reference_title: "A RECURRENT MUTATION IN TSHB GENE UNDERLYING CENTRAL CONGENITAL HYPOTHYROIDISM UNDETECTABLE IN NEONATAL SCREENING."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.373delT mutation has previously been reported in patients from Brazil, Germany, Belgium, United States, Switzerland, Argentina, France, Portugal, United Kingdom and Ireland."
    explanation: "Documents the geographic spread of the recurrent allele, which is what makes it the first variant to look for."
  - reference: PMID:27362444
    reference_title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In kindreds 2 and 3, the affected individuals were compound heterozygous for TSHB c.373delT and either a 5·4-kB TSHB deletion (kindred 2, c.1-4389_417*195delinsCTCA) or a novel TSHB missense mutation (kindred 3, c.2T>C, p.Met1?)."
    explanation: "Establishes that the allelic spectrum includes a multi-kilobase deletion and a start-loss variant, not only point mutations."
diagnosis:
- name: Paired Free T4 and TSH Measurement

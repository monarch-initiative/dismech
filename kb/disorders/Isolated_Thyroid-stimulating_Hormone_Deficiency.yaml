clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden here is set almost entirely by time to treatment rather than by
    genotype, which is unusual enough to be worth stating plainly. Untreated, the
    disorder produces cretinism with severe intellectual and growth impairment.
    Treated from birth, outcomes are normal - and the cleanest demonstration is
    within a single kindred, where three late-diagnosed relatives had
    neurodevelopmental retardation and the younger sibling diagnosed genetically and
    treated from birth developed normally. VARIABLE therefore encodes a modifiable
    variable, not diagnostic uncertainty.
  evidence:
  - reference: PMID:27362444
    reference_title: "Molecular spectrum of TSHβ subunit gene defects in central hypothyroidism in the UK and Ireland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, the younger sibling in kindred 1 developed normally following genetic diagnosis and treatment from birth."
    explanation: "The within-family contrast that sets the low end of the burden range."
  - reference: PMID:1762181
    reference_title: "[DNA diagnosis in endocrinological disease--pituitary disease]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital isolated TSH deficiency is rare disease causing hypothyroidism including cretinism, severe mental and growth retardation."
    explanation: "The untreated outcome that sets the high end."
treatments:
- name: Levothyroxine Replacement
  description: >-
    Lifelong levothyroxine, started as early as possible. The drug replaces the
    missing end-product rather than the missing hormone, so it bypasses the lesion
    entirely and is effective regardless of which TSHB allele is present. Two things
    make its use here different from primary hypothyroidism. First, timing dominates
    outcome: started from birth it averts neurocognitive sequelae even in severe
    disease, and a 25-year follow-up supports that this holds long term. Second, it
    cannot be titrated on TSH, because TSH is already inappropriately low and does
    not respond; dose is guided by free T4 together with clinical assessment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
  target_mechanisms:
  - target: Systemic Thyroid Hormone Deficiency
    description: >-
      Replaces circulating thyroxine directly, restoring peripheral thyroid hormone
      receptor signalling without repairing anything upstream. The thyroid remains
      understimulated and the TSH remains low on treatment.
    evidence:
    - reference: PMID:39875149
      reference_title: "Central congenital hypothyroidism due to TSHB gene mutation: 25-year follow-up."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite having severe congenital hypothyroidism, timely initiation of levothyroxine averted neurocognitive sequelae."
      explanation: "The clinical outcome of replacing the end-product, followed for 25 years."
  evidence:
  - reference: PMID:39875149
    reference_title: "Central congenital hypothyroidism due to TSHB gene mutation: 25-year follow-up."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis and prompt thyroxine initiation are rewarding regardless of the severity of mutation."
    explanation: "States that the benefit does not depend on allele severity, which is the practical point for counselling."
  - reference: PMID:25248602
    reference_title: "Uncertainties in endocrine substitution therapy for central endocrine insufficiencies: hypothyroidism."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients with primary hypothyroidism (PH), L-T4 replacement therapy can safely be adjusted to the individual needs by testing serum thyrotropin (TSH) concentration exclusively."
    explanation: "States the monitoring rule for primary hypothyroidism, which is precisely the rule that does not transfer to this disorder."
discussions:
- discussion_id: tshb_r75g_assay_interference_not_disease
  status: OPEN
  kind: INTERPRETATION
  attaches_to:
  - genetic#TSHB
  - biochemical#Serum Thyrotropin (TSH)
  prompt: >-
    A TSHB variant in a person with a low or undetectable TSH is not necessarily a
    cause of this disease. How should p.R75G be distinguished from a pathogenic
    TSHB allele?
  rationale: >-
    The p.R75G variant is common - about 4% carrier frequency in Bene Israel Indian
    Jews, on a haplotype shared with South Asian populations - and does not impair
    TSH function. What it does is defeat detection of TSH on some immunoassay
    platforms, so carriers who are clinically euthyroid appear to have a low or
    undetectable TSH and have been diagnosed with hyperthyroidism in error. It is
    the mirror image of this disease: the same gene, a low measured TSH, and the
    opposite clinical meaning.

    The discriminator is the free T4. In this disease free T4 is low; in R75G
    carriers it is normal and the patient is euthyroid. The platform matters too -
    the discrepancy is assay-dependent, so re-measuring on a different platform is
    informative.

    Recorded as an interpretation question rather than a knowledge gap because the
    biology is settled; what is unsettled is how reliably it is applied at the
    bench. This entry's own curation nearly got it wrong: the variant reads in a
    title search as a founder pathogenic allele, and it took reading the abstract to
    see that the paper is about euthyroid people.
  evidence:
  - reference: PMID:34981755
    reference_title: "TSHB R75G is a founder variant and prevalent cause of low or undetectable TSH in Indian Jews."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

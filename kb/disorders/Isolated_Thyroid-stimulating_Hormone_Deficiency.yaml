    The diagnosis is made on the pattern, not on either value. A low free T4 with a
    TSH that is low, normal or undetectable is the signature; either analyte alone
    is uninformative or actively misleading. In the reported cases the suspicion
    came from a clinician noticing that thyroid function tests did not fit primary
    thyroid disease.

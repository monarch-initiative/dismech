  description: >-
    Empirical supportive mitochondrial cofactor supplementation (riboflavin, coenzyme Q10, thiamine,
    and vitamins C, E and K) was given to one infant and was followed by rapid clinical and
    biochemical improvement allowing extubation and discharge; a surviving sibling was maintained on
    the same regimen for years. This is uncontrolled single-case experience, not disease-specific or
    curative therapy, and management is otherwise supportive.

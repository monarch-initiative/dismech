    explanation: A second unrelated consanguineous family homozygous for the same allele, confirming recessive inheritance beyond the founding pedigree.
  - reference: PMID:35026043
    reference_title: Expanding the phenotypic and molecular spectrum of NFS1-related disorders that cause functional deficiencies in mitochondrial and cytosolic iron-sulfur cluster containing enzymes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    snippet: "Arg72 of NFS1 interacts with Tyr31 of ISD11, so that the substitution of Arg with Gln at this position is predicted to hinder complex formation and proper function."
    explanation: Structural modeling on the NFS1-ISD11-ACP-ISCU crystal structure gives the molecular basis for the disrupted NFS1-ISD11 complex; INDIRECT because it is an in-silico prediction rather than a measured activity.

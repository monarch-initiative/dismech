inheritance:
- name: Autosomal recessive inheritance
  description: >-
    NFS1 is nuclear-encoded and autosomal, and the disease requires biallelic variants, so despite
    the mitochondrial phenotype this is a nuclear recessive disorder. Three reports support the
    recessive pattern: two unrelated consanguineous families each with homozygous affected children
    (Old Order Mennonite, Farhan 2014; Christian Arab, Hershkovitz 2021), plus three further
    unrelated patients found through GeneMatcher (Yang 2022) - two homozygous infants and one
    compound heterozygote. The recessive claim therefore does not rest on a single consanguineous
    pedigree.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

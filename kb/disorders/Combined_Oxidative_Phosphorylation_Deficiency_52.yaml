name: Combined Oxidative Phosphorylation Deficiency 52
category: Mendelian
creation_date: "2026-10-27T00:00:00Z"
synonyms:
- COXPD52
- combined oxidative phosphorylation deficiency type 52
- NFS1-related combined oxidative phosphorylation deficiency
- infantile mitochondrial complex II/III deficiency
- IMC23D
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 52
  term:
    id: MONDO:0030311
    label: combined oxidative phosphorylation deficiency 52
description: >-
  COXPD52 is the combined oxidative phosphorylation deficiency caused by biallelic variants in
  NFS1, the mitochondrial cysteine desulfurase that initiates iron-sulfur (Fe-S) cluster
  biogenesis. NFS1 mobilizes inorganic sulfur from L-cysteine, using pyridoxal-5'-phosphate as
  cofactor, and - as the core of the ISC assembly complex together with its partner ISD11
  (LYRM4), the scaffold ISCU and ferredoxin - donates that sulfur for de novo [2Fe-2S] cluster
  synthesis. Fe-S clusters are obligate cofactors of respiratory-chain complexes I, II and III
  (but not the Fe-S-free complex IV), of the Krebs-cycle enzyme aconitase, and of lipoate and
  biotin synthesis, so a lesion upstream of cluster assembly produces a combined respiratory-chain
  deficiency rather than an isolated single-complex defect. The biochemical signature reported in
  patients is a deficiency of complexes II and III (with variable complex I involvement), relative
  sparing of complex IV, and reduced mitochondrial and cytosolic aconitase activity, with only
  mild effects on lipoylation.

  The entity was first delineated in 2014 as "infantile mitochondrial complex II/III deficiency"
  (IMC23D) in three children of an Old Order Mennonite family, all homozygous for the founder
  missense NFS1 variant c.215G>A, p.Arg72Gln, which destabilizes the protein. A 2021 report
  described a second, unrelated consanguineous Christian-Arab family with three affected children
  homozygous for the same allele and decreased activity of complexes I, II and III; the two
  populations share no common haplotype, so the variant is a recurrent de novo hot-spot rather than
  a shared founder. A 2022 report then added three further unrelated patients (identified through
  GeneMatcher) carrying the same p.Arg72Gln allele - two homozygous infants with the severe
  lactic-acidemic presentation, and one compound heterozygote (p.Arg72Gln / p.Arg412His) who
  presented as a young adult with gastrointestinal symptoms and fatigue, broadening the phenotype
  from a usually lethal infantile multisystem disease to a survivable milder form. The published
  experience is therefore small (at least nine patients across three reports) and dominated by one
  recurrent allele, and the entry is written to that evidence base.
  No GeneReviews chapter exists for this disorder (confirmed against the committed Bookshelf index
  and a live PubMed title search); there is no animal model specific to the human disease, no
  natural-history series, no prevalence estimate, and no controlled treatment evidence.

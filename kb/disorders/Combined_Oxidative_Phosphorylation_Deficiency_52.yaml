pathophysiology:
- name: Biallelic NFS1 Loss of Function Reducing Cysteine Desulfurase Activity
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of NFS1, the gene encoding the mitochondrial cysteine desulfurase. NFS1 is a
    pyridoxal-5'-phosphate-dependent enzyme that abstracts sulfur from L-cysteine as a persulfide and
    feeds it into the ISC assembly pathway, acting as part of a core complex with its partner ISD11
    (LYRM4), the scaffold ISCU and ferredoxin. The recurrent p.Arg72Gln substitution lies in the
    conserved aminotransferase-class-V domain and destabilizes the protein: patient fibroblasts show
    markedly reduced NFS1 transcript and protein relative to controls, and the NFS1-ISD11 interaction
    is lost, so less sulfur is delivered for cluster synthesis. This is a quantitative
    (hypomorphic/loss-of-function) lesion rather than a change in a catalytic residue.
  genes:
  - preferred_term: NFS1
    term:
      id: hgnc:15910
      label: NFS1
  genetic_context:
    genes:
    - preferred_term: NFS1
      term:
        id: hgnc:15910
        label: NFS1
    allele_type: a recurrent homozygous conserved-residue missense variant (p.Arg72Gln), and in one patient that allele in trans with a second missense variant (p.Arg412His)
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    notes: >-
      PARTIAL_LOSS_OF_FUNCTION rather than a complete null: NFS1 is an essential gene, the reported
      alleles are destabilizing missense variants, and patient fibroblasts retain reduced (not
      absent) NFS1 transcript and protein, so the lesion is hypomorphic. Zygosity differs between
      patients (homozygous in the infantile cases, compound heterozygous in the adult), so no single
      zygosity value is asserted for the entity.

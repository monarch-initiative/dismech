    explanation: Patient-fibroblast co-immunoprecipitation shows the NFS1-ISD11 core-complex interaction is disrupted, impairing the desulfurase machinery.
  - reference: PMID:33457206
    reference_title: A recurring NFS1 pathogenic variant causes a mitochondrial disorder with variable intra-familial patient outcomes.
    supports: SUPPORT
    directness: INDIRECT

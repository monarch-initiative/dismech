mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100485
      label: KCNH1 associated disorder
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: Primary MONDO disease term for this entry.
  - term:
      id: MONDO:0012735
      label: Temple-Baraitser syndrome

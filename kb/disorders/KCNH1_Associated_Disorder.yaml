- hypothesis_group_id: channel_to_network_dysfunction
  hypothesis_label: Altered Kv10 gating and heteromeric crosstalk perturb neuronal circuits
  status: EMERGING
  description: >-
    The causal relation between pathogenic KCNH1 gain of function and epilepsy is
    established. This hypothesis concerns its intervening route: altered gating
    and heteromeric subunit interactions may disturb neuronal signaling and
    developmental circuit function. The neurotransmission route is proposed in
    the clinical literature, and heteromeric effects are demonstrated in HEK293T
    cells, but their endogenous neuronal consequences remain untested. No
    specific inhibitory-versus-excitatory cell effect is asserted.
  evidence:
  - reference: PMID:27267311
    reference_title: "Epilepsy in KCNH1-related syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      The
      mechanism by whichKCNH1mutations cause epilepsy
      remains to be elucidated; a possible mechanism could
      be that gain of Kv10.1 channel function results in
      increased potassium conductance with subsequent
      inhibition of sodium and calcium currents and pertur-
      bation of neurotransmitter release (Ufarteset al., 2013;
      Kortüm et al., 2015; Mortensen et al., 2015).
    explanation: >-
      The authors propose a conductance-to-neurotransmission route to epilepsy
      while leaving the intervening neuronal mechanism unresolved. This supports a
      candidate causal route, not a demonstrated change in native-neuron firing.
    directness: INDIRECT
  - reference: PMID:41656275
    reference_title: "Crosstalk of KCNH1 and KCNH5 gain-of-function mutations leading to epilepsy and neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In summary, we identify heteromeric crosstalk between Kv10.1 and Kv10.2 as a
      key mechanism by which gain-of-function mutations may propagate their
      effects, extending pathogenic influence beyond the mutated gene itself. This
      mechanism provides a possible explanation for the variability of neurological
      phenotypes associated withKCNH1andKCNH5mutations and highlights the
      importance of considering subfamily-wide interactions in understanding
      channelopathies.
    explanation: >-
      The authors propose heteromeric crosstalk as an explanation for neurological
      variability. The experiments were in HEK293T cells, and endogenous neuronal
      stoichiometry and effects still require testing.
    directness: INDIRECT

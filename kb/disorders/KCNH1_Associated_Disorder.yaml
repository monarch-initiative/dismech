    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41656275
      reference_title: "Crosstalk of KCNH1 and KCNH5 gain-of-function mutations leading to epilepsy and neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Gain-of-function (GoF) mutations in KCNH1 (Kv10.1, hEAG1) and KCNH5 (Kv10.2,
        hEAG2) give rise to developmental disorders, intellectual disability, and
        epilepsy.
      explanation: >-
        The authors identify gain of function as causing neurological developmental
        phenotypes. This supports the broad etiologic relation; their channel
        experiments do not identify its complete neuronal route.
      directness: INDIRECT
    - reference: PMID:33594261
      reference_title: "Syndromic disorders caused by gain-of-function variants in KCNH1, KCNK4, and KCNN3-a subgroup of K(+) channelopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Eighteen of 21 (86%) patients with dominant KCNH1 variant had severe DD and the level

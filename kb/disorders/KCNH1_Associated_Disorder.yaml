      Syndromic endpoint of this spectrum; a MONDO descendant of
      MONDO:0100485, curated separately as Temple-Baraitser Syndrome.
  - term:
      id: MONDO:0024526
      label: Zimmermann-Laband syndrome 1
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      Syndromic endpoint of this spectrum; a MONDO descendant of
      MONDO:0100485. The dismech Zimmermann-Laband Syndrome entry is bound to
      the gene-agnostic parent MONDO:0000200, which also covers the KCNN3 and
      ATP6V1B2 causes that fall outside this spectrum.
notes: >
  Scope and relationship to the two syndromic entries. This entry is the gene-centric umbrella for the KCNH1 phenotypic spectrum (MONDO:0100485, itself the parent of Temple-Baraitser syndrome and Zimmermann-Laband syndrome type 1 in MONDO). It is deliberately not a duplicate of the existing Temple-Baraitser Syndrome and Zimmermann-Laband Syndrome entries: those curate the two recognisable clinical gestalts in depth, whereas this entry curates what they have in common and, crucially, the two arms of the spectrum that have no syndromic label at all — the attenuated non-syndromic intellectual disability group and the isolated epilepsy/febrile seizure group. Without this entry those patients have nowhere to live in the knowledge base.

  It is modelled as a Disease rather than a Grouping because it is a MONDO disease entity in its own right with a single shared causal gene and a single shared molecular mechanism, and because two of its four arms are not themselves separate dismech Disease entries — a Grouping, which is an explicit union over existing entries, could not represent them.

  Note that the dismech Zimmermann-Laband Syndrome entry is bound to MONDO:0000200, the gene-agnostic ZLS parent, and therefore also covers the KCNN3 and ATP6V1B2 causes of ZLS. Only its KCNH1 arm (ZLS1, MONDO:0024526) belongs to this spectrum.

  NEC preflight. A gene-frequency-versus-MONDO named-entity-confusion preflight was run before curation: the MONDO definition of MONDO:0100485 names KCNH1 as the causal gene (RO:0004003 HGNC:6250), and every reference cited here is a KCNH1 paper, so the entity resolved correctly.

  GeneReviews. No GeneReviews chapter exists for KCNH1, Temple-Baraitser syndrome, or Zimmermann-Laband syndrome; PubMed searches for all three returned no GeneReviews records, so the mandatory GeneReviews phenotype baseline does not apply to this entry.

  Why two subtypes have no subtype_term. The TBS and ZLS1 arms are grounded to MONDO:0012735 and MONDO:0024526, but the "Attenuated non-syndromic" and "Isolated epilepsy" arms are deliberately left ungrounded, which raises an advisory test warning. MONDO contains exactly three terms in this space — MONDO:0100485 and those two syndromic endpoints — and has no term for either remaining arm. That absence is not a curation oversight; it is the very gap this entry exists to fill, since those patients have no syndromic label. Grounding them would require either inventing a term or circularly reusing the parent MONDO:0100485, which would wrongly assert that the subtype is the whole disease. Minting MONDO terms for these two arms is the correct upstream fix and a reasonable follow-up request to the MONDO maintainers.


  Frequency scope. No whole-spectrum frequency is assigned: the quoted counts describe historically ascertained syndromic KCNH1 cases, with phenotype-specific missing data, rather than the expanded spectrum including isolated epilepsy. These pooled syndromic KCNH1 counts are not separately stratified into TBS and ZLS1, so assigning either subtype the pooled frequency would introduce a new unsupported denominator. Published counts are retained in phenotype evidence and explanations; subtype-scoped bands await subtype-specific ascertainment and denominators.

      once every six months.
    explanation: >-
      A worked example of symptomatic management and its incomplete effect.
- name: Idebenone
  description: >-
    One individual with a subacute LHON-like presentation received oral idebenone
    and recovered to 6/6 in both eyes within four months. That is a striking
    number, and it is why idebenone is worth recording here - but the same report
    makes clear it cannot be read as a treatment effect. Visual acuity in that
    individual had already begun improving spontaneously twelve months before
    idebenone was started, reaching 6/12 on its own; spontaneous recovery is
    well documented in childhood-onset LHON; and the authors say explicitly that
    they cannot separate genotype from treatment. This is curated as an
    uncontrolled single-patient observation, not as evidence of efficacy in
    COXPD48.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

genetic:
- name: NSUN3
  gene_term:
    preferred_term: NSUN3
    term:
      id: hgnc:26208
      label: NSUN3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    NSUN3 (NOP2/Sun RNA methyltransferase 3) encodes a 340-amino-acid
    S-adenosylmethionine-dependent RNA:m5C methyltransferase of the
    NOL1/NOP2/Sun family that localises to the mitochondrial matrix. Its
    physiological substrate is the wobble cytosine C34 of mt-tRNA-Met; bisulfite
    RNA sequencing of patient fibroblasts showed methylation at that position
    falling to background while m5C at other mitochondrial tRNA positions was
    unchanged, which is what makes NSUN3 a single-substrate enzyme in practice
    rather than a general mitochondrial methyltransferase.

    Reported disease alleles include nonsense (p.Trp50*, p.Arg99*), frameshift
    (p.Glu42Valfs*11 from a multi-kilobase exon 3 deletion, p.Cys311Trpfs*8,
    p.Gly156ArgfsTer6, p.Ala118Glufs*45) and missense (p.Pro142Ser,
    p.Glu271Gly, p.Ala141Pro, p.Cys152Ser) changes. Several early-reported
    variants cluster in exon 3, which prompted a suggestion that the region is a
    hotspot; the later five-family cohort found variants across the whole gene,
    so that suggestion is not supported by the larger series and is recorded here
    as superseded rather than repeated.
  evidence:
  - reference: PMID:27356879
    reference_title: "Deficient methylation and formylation of mt-tRNA(Met) wobble cytosine in a patient carrying mutations in NSUN3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both NSun3 and mtSSB1 were resistant to proteinase K treatment of the
      mitochondrial fraction
    explanation: >-
      Submitochondrial protection assay placing NSun3 inside mitochondria rather
      than on the outer membrane.
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT

- name: Impaired Wobble Decoding by the Single Mitochondrial tRNA-Met
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    This is the step that makes COXPD48 a different kind of lesion from the rest
    of the combined-OXPHOS series. Human mitochondria carry one tRNA-Met, used
    for both initiation and elongation, and it must read the universal AUG plus
    the non-universal AUA codon - and, at initiation, AUU. The wobble
    modification is what expands that decoding range, so a modification defect
    degrades the reading of every methionine codon in every mtDNA-encoded
    message rather than disabling one subunit or one assembly step.

    Confidence is PROVISIONAL rather than ESTABLISHED because the in vitro
    ribosome-binding data are more textured than the summary claim. One study
    concluded from anticodon-stem-loop work that f5C34 is required to decipher
    AUA; the other, testing modification states directly on ribosomes with
    mitochondrial initiation and elongation factors, found that AUA was read with
    similar efficiencies by all mt-tRNA-Met variants and that the differences it
    could resolve lay mostly in AUG recognition. Both agree the modification
    state changes codon recognition; they do not agree on the size or the codon
    specificity of the effect, and no reconstituted mitochondrial translation
    system exists to settle it.
  biological_processes:
  - preferred_term: tRNA wobble base modification
    modifier: DECREASED
    term:

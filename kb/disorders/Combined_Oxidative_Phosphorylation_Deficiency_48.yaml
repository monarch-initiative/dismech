treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    No disease-modifying therapy exists. Management is the standard mitochondrial
    disease package - anticonvulsants for seizures, nutritional and
    developmental support, surveillance for the organ involvement each individual
    develops - and none of it addresses the tRNA modification defect. The
    breadth of the reported phenotype is itself a management point: an individual
    identified through an optic-atrophy pathway may still need endocrine,
    cardiac, audiological and neurological assessment.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:

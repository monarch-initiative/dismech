diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Every reported individual was solved by unbiased exome or genome sequencing,
    not by a targeted panel - in several cases only after an
    optic-neuropathy-specific panel had returned nothing. NSUN3 is absent from
    at least one published inherited-optic-neuropathy capture panel, so the
    practical recommendation from the largest cohort is to add the gene to
    diagnostic optic-atrophy and mitochondrial-disease panels and, failing that,
    to go to exome or genome sequencing.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  markers: NSUN3 biallelic variants
  evidence:
  - reference: PMID:27356879
    reference_title: "Deficient methylation and formylation of mt-tRNA(Met) wobble cytosine in a patient carrying mutations in NSUN3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified compound heterozygous predicted loss-of-function variants in
      NSUN3
    explanation: >-
      Exome sequencing as the route to the founding diagnosis.
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the NSUN3 gene should be added to diagnostic optic atrophy and
      mitochondrial disease gene panels when investigating patients who are
      suspected to have an isolated or syndromic inherited optic neuropathy
    explanation: >-
      The cohort's own recommendation on where NSUN3 belongs in the diagnostic
      pathway.
- name: mt-tRNA-Met C34 Methylation Assay by RNA Bisulfite Sequencing
  description: >-
    This is the disease-specific functional test, and it is what converts a
    variant of uncertain significance into a diagnosis. RNA bisulfite sequencing
    measures methylation at the wobble base; in the largest cohort every affected
    individual read at background against a control range of 26 to 33 percent.
    It is practical to run: the assay worked on RNA from PAXgene-stabilised whole
    blood in five of six individuals, so a skin biopsy is not obligatory.

    It also has a documented limitation. Methylation was equally abolished in
    carriers of the mild C-terminal alleles as in the severe loss-of-function
    ones, so the assay confirms loss of the methyltransferase function but does
    not grade severity or predict phenotype - the authors take that dissociation
    as a hint that NSUN3 may have a second, unidentified function.
  diagnosis_term:
    preferred_term: RNA bisulfite sequencing assay of mt-tRNA-Met C34 methylation
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: mt-tRNA-Met m5C34 methylation fraction
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All samples obtained from affected individuals demonstrated significantly
      reduced mitochondrial tRNAMet methylation levels that were reduced to
      background levels, although control samples showed 26% to 33% tRNAMet
      methylation
    explanation: >-
      The assay result and its control range, across every affected individual
      tested.
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it should be noted that the methylation at C34 was equally
      disrupted in carriers of these variants, suggesting that there might be a
      secondary function of NSUN3 that has not yet been identified.
    explanation: >-
      Records that the assay does not discriminate mild from severe genotypes.
- name: Muscle Biopsy with Respiratory Chain Enzyme Analysis
  description: >-
    Spectrophotometric respiratory chain enzyme assay on muscle homogenate,
    normalised to citrate synthase, is what established the combined deficiency
    in the founding case and is still the biochemical confirmation. Complex IV is
    the most consistently reduced, with complex I next; complex II, being
    entirely nuclear-encoded, is the internal control.

    The histology is a poor screening test. Ragged red fibres were absent in
    every reported biopsy, and COX-negative fibres were present in some
    individuals and absent in others within the same cohort, so a normal muscle
    histochemistry panel does not exclude COXPD48. In one individual with a
    milder phenotype the skin biopsy showed normal respiratory chain complex
    activity with reduced oxygen consumption, so tissue choice and the assay used
    both matter.
  diagnosis_term:
    preferred_term: muscle biopsy for respiratory chain enzyme analysis
    term:

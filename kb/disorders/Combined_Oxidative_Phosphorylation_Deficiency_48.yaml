- name: Combined Respiratory Chain Enzyme Deficiency
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Complexes I, III, IV and V each contain mtDNA-encoded subunits and are
    exposed to the translation defect; complex II is entirely nuclear-encoded and
    is not. The measured pattern fits that prediction, but not uniformly. In the
    five-family cohort, spectrophotometric assay of one individual's muscle gave
    a complex I activity of 0.078 against a normal range of 0.118 to 0.332 and a
    complex IV activity of 0.003 against 0.013 to 0.039, both normalised to
    citrate synthase; western blotting of another family's muscle and fibroblasts
    showed reduced COX II and NDUFB8 but not complex II, III or V. Complex IV is
    the most consistently affected across reports, and complex III and V changes
    were not detected in this cohort even though both carry mtDNA-encoded
    subunits.

    Functional respirometry agrees: patient fibroblasts show reduced basal
    oxygen consumption and ATP production, remain below control even when
    uncoupled with FCCP, and grow poorly when forced onto galactose. The founding
    case's oxygen consumption defect was reversed by NSUN3 re-expression.

    Conformance note: this node declares conformance to the mitochondrial
    dysfunction module's central bioenergetic node, and only in part. The
    module's node pairs decreased oxidative phosphorylation with increased
    reactive oxygen species; the decreased-OXPHOS arm is directly evidenced in
    these patients, whereas no NSUN3 report measures reactive oxygen species, so
    that arm is not asserted here. The module's upstream node - age-related
    mitochondrial damage and mtDNA mutation - does not apply to a primary nuclear
    modification defect, and mtDNA copy number is explicitly normal, which is why
    conformance is declared at this node alone.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:

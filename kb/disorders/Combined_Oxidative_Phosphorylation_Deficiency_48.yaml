- name: Retinal Ganglion Cell Bioenergetic Failure and Optic Nerve Degeneration
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Optic nerve involvement is the one feature that runs through nearly the whole
    reported spectrum - 7 of 8 individuals in the largest cohort - and it is the
    reason NSUN3 was rediscovered through inherited-optic-neuropathy clinics
    rather than through metabolic ones. Optical coherence tomography shows
    peripapillary retinal nerve fibre layer and ganglion cell layer thinning, and
    pattern electroretinography shows a reduced N95:P50 ratio consistent with
    retinal ganglion cell dysfunction.

    The proposed reason for the tissue selectivity is generic to mitochondrial
    optic neuropathies rather than specific to NSUN3: retinal ganglion cells have
    long axons with unmyelinated prelaminar segments and a correspondingly high
    dependence on mitochondrial ATP. It is recorded here as the field's
    explanation, offered in the cited review's own hedged terms, and it has not
    been tested in NSUN3 tissue - which is why this node is PROVISIONAL while the
    upstream biochemistry is ESTABLISHED.

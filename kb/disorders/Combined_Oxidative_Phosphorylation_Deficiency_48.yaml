    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is challenging to determine whether in this study this particular
      disease course is associated with a specific genotype or whether it is
      influenced by treatment with idebenone
    explanation: >-
      The authors' own statement that the observation is not attributable.
- name: Coenzyme Q10 (Ubiquinone) Supplementation
  description: >-
    Started in one individual on the basis of a measured secondary deficiency -
    muscle ubiquinone of 94 pmol/mg against a reference range of 140 to 850 -
    rather than empirically. No outcome from that supplementation is reported, so
    this records a rational indication for checking muscle ubiquinone in an
    NSUN3 patient having a biopsy, not a demonstrated benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further analysis demonstrated low muscle ubiquinone of 94 pmol/mg (normal
      range 140–850 pmol/mg). Ubiquinone supplementation has been commenced.
    explanation: >-
      The measured deficiency and the resulting intervention, with no outcome
      reported.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counselling with a specific caveat. One proband reached
    homozygosity through paternal uniparental isodisomy of chromosome 3 rather
    than by descent, in a non-consanguineous family - so a homozygous NSUN3
    result does not establish that both parents are carriers, and recurrence risk
    should not be quoted as one in four until segregation has actually been
    checked. The same family also illustrates the counselling problem created by
    variable expressivity: the homozygous father had moderate bilateral optic
    atrophy while his son presented with subacute visual loss at eleven.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further analysis revealed paternal uniparental isodisomy of chromosome 3 in
      the proband's DNA sample.
    explanation: >-
      The isodisomy finding that changes the recurrence-risk conversation.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Roughly a dozen individuals have been reported. The largest series describes
    eight individuals from five unrelated families, of whom one had been
    published previously; separate single reports add a South Asian
    encephalomyopathy case, a Dutch optic-neuropathy case, and a Turkish case
    with hypertrophic cardiomyopathy. No population prevalence estimate exists,
    and ascertainment has been through inherited-optic-neuropathy and
    mitochondrial-disease cohorts rather than any unselected denominator, so no
    numeric rate is recorded here.
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study has characterized the largest cohort of patients harboring
      candidate biallelic NSUN3 variants to date, consisting of eight affected
      individuals from five independent families revealing a broad and variable
      phenotype.
    explanation: >-
      The size of the largest published series, which is the basis for the
      literature-case count rather than a prevalence estimate.
animal_models:
- name: Whole-body Nsun3 knockout mouse
  species: Mouse
  genotype: Nsun3 constitutive knockout (homozygous null)
  publication: PMID:36949224
  description: >-
    Constitutive Nsun3 deletion is embryonic lethal in the mouse: knockout
    embryos are alive with heartbeats at E10.5, somewhat smaller than wild-type,
    and dead by E12.5. This is a sharper phenotype than any human genotype
    produces - the founding patient carried two predicted null alleles and
    survived infancy - so the model bounds what the gene is required for rather
    than reproducing the disease.
  modeled_mechanisms:
  - target: Loss of Functional NSun3 Methyltransferase
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete Nsun3 loss in the mouse produces mid-gestation lethality, whereas
      humans homozygous or compound heterozygous for predicted null alleles are
      liveborn and reach at least infancy.
    limitations: >-
      The species divergence is the finding, not an artefact to be discounted:
      the model cannot be used to study postnatal NSUN3 disease at all, and any
      inference from it about human developmental requirements for NSUN3 has to
      cross that lethality gap. Human null-allele individuals are viable, so the
      mouse null is not a model of the human null state.
    evidence:
    - reference: PMID:36949224
      reference_title: "NSUN3-mediated mitochondrial tRNA 5-formylcytidine modification is essential for embryonic development and respiratory complexes in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that Nsun3 is essential for embryonic development in mice
        with whole-body Nsun3 knockout embryos dying between E10.5 and E12.5.
      explanation: >-
        The lethality window, which is the divergence from the viable human null
        genotypes.
- name: Heart-specific Nsun3 knockout mouse (Nsun3HKO)
  species: Mouse
  genotype: Cardiac-restricted Nsun3 conditional knockout
  publication: PMID:36949224
  description: >-
    Conditional cardiac deletion sidesteps the embryonic lethality and gives the
    only in vivo model of adult NSUN3 loss. Nsun3HKO hearts show enlarged
    mitochondria with fragmented cristae and progressively reduced respiratory
    complex enzyme activities, worse in older animals, while the mitochondrial
    mRNAs encoding those subunits are not reduced - the same
    transcript-versus-activity dissociation seen in patient cells, and a
    signature of a translation-level rather than a transcription-level lesion.

    The cardiac phenotype itself is enhanced contraction with age-associated
    mild enlargement, which is not the same as the hypertrophic cardiomyopathy
    reported in one human patient. The model is linked to the respiratory chain
    node it actually measures, not to the human cardiac phenotype.
  modeled_mechanisms:
  - target: Combined Respiratory Chain Enzyme Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Cardiac Nsun3 loss reduces respiratory complex enzyme activities without
      reducing the corresponding mitochondrial transcripts, reproducing the
      translation-level character of the human biochemical defect in a single
      organ.
    limitations: >-
      Restricted to heart, so it says nothing about the optic nerve, which is the
      most consistently affected human tissue. The deficit is age-progressive in
      the mouse whereas the severe human phenotype is present in infancy, and the
      mouse cardiac phenotype (enhanced contraction, mild enlargement) is not the
      hypertrophic cardiomyopathy reported once in humans.
    readouts:
    - name: Respiratory complex enzymatic activities in heart
      target: Combined Respiratory Chain Enzyme Deficiency
      direction: DECREASED
      interpretation: >-
        Enzyme-activity correlate of the combined respiratory chain deficiency
        node, measured in the conditional knockout heart.
      evidence:
      - reference: PMID:36949224
        reference_title: "NSUN3-mediated mitochondrial tRNA 5-formylcytidine modification is essential for embryonic development and respiratory complexes in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the Nsun3HKO hearts, mitochondrial mRNAs that encode respiratory
          complex subunits were not down regulated, but the enzymatic activities
          of the respiratory complexes decreased, especially in older mice.
        explanation: >-
          Reports the direction of the enzyme-activity change and the preserved
          transcript levels alongside it.
    evidence:
    - reference: PMID:36949224
      reference_title: "NSUN3-mediated mitochondrial tRNA 5-formylcytidine modification is essential for embryonic development and respiratory complexes in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Nsun3HKO heart mitochondria were enlarged and contained fragmented
        cristae.
      explanation: >-
        Ultrastructural mitochondrial abnormality in the model, comparable to the
        swollen mitochondria with linearised cristae seen in patient muscle.
differential_diagnoses:
- name: Leber hereditary optic neuropathy
  description: >-
    The closest mimic, and a documented one: two individuals with biallelic
    NSUN3 variants presented with a subacute LHON-like picture - hyperaemic disc
    swelling, peripapillary telangiectatic microangiopathy, central scotomas -
    and one was investigated for the three common mtDNA LHON variants and had
    whole-mtDNA sequencing before exome sequencing found NSUN3. Inheritance is
    the discriminator: LHON is maternally transmitted mtDNA disease, COXPD48 is
    autosomal recessive nuclear disease, so a negative mtDNA result in a
    LHON-like presentation with affected siblings or consanguinity should prompt
    nuclear sequencing.
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because the clinical picture was suggestive of LHON, genetic testing for
      the three most common LHON mtDNA variants followed by whole mtDNA
      sequencing was performed.
    explanation: >-
      Documents that the LHON workup was undertaken and negative before NSUN3 was
      found.
- name: Autosomal dominant optic atrophy (OPA1-related)
  description: >-
    Named by the cohort authors as the other common mitochondrial optic
    neuropathy against which NSUN3 disease has to be distinguished. Both can show
    relatively preserved central acuity despite temporal optic atrophy, and
    OPA1-related disease can carry a subclinical mitochondrial myopathy on
    biopsy. Inheritance again separates them: OPA1 disease is dominant.
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two most common mitochondrial optic neuropathies are autosomal dominant
      optic atrophy associated with pathogenic variants in OPA1 and LHON with
      three mtDNA variants
    explanation: >-
      Identifies the two conditions the differential is drawn against.
- name: Other combined oxidative phosphorylation deficiencies
  description: >-
    The COXPD series numbers well over fifty entities across largely unrelated
    nuclear genes, and they are clinically overlapping enough that a combined
    respiratory chain deficiency on muscle biopsy does not point to any one of
    them. The distinguishing features of COXPD48 are the near-universal optic
    nerve involvement, the very wide onset range, and the specific functional
    assay - loss of mt-tRNA-Met C34 methylation - which is diagnostic for this
    gene and normal in the others.
  evidence:
  - reference: PMID:40465263
    reference_title: "Biallelic NSUN3 Variants Cause Diverse Phenotypic Spectrum Disease: From Isolated Optic Atrophy to Severe Early-Onset Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of these disorders have an overlapping clinical phenotype,
      necessitating a broad approach to molecular diagnostic testing, typically
      including full sequencing of mtDNA and use of large virtual gene panels.
    explanation: >-
      States the clinical overlap across primary mitochondrial disorders that
      makes molecular testing rather than phenotype the discriminator. This is a
      class-level statement about primary mitochondrial disease, not a claim
      about NSUN3 specifically.
discussions:
- discussion_id: nsun3_methylation_assay_does_not_grade_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is mt-tRNA-Met C34 methylation abolished equally by mild C-terminal
    NSUN3 alleles and by severe loss-of-function alleles, when the two genotype
    classes produce phenotypes as far apart as isolated adult optic atrophy and
    neonatal multisystem disease?
  attaches_to:
  - pathophysiology#Loss of m5C34 in Mitochondrial tRNA-Met
  - genetic#NSUN3
  rationale: >-
    The functional assay used to call NSUN3 variants pathogenic reads at
    background in every affected individual regardless of allele class, so it
    cannot be the quantity that sets severity. Either the assay saturates below
    the range that matters clinically, or some residual NSUN3 activity not
    captured by bulk bisulfite sequencing differs between genotypes, or - as the
    cohort authors suggest - NSUN3 has a second function that the C-terminal
    alleles spare and the null alleles do not. The three possibilities have
    different consequences for whether the assay can ever be prognostic, and
    nothing published distinguishes them.
- discussion_id: nsun3_mouse_null_lethality_vs_human_viability
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can the mouse tell us anything about postnatal NSUN3 disease, given that
    constitutive Nsun3 loss kills the embryo by E12.5 while humans with two
    predicted null alleles are liveborn and survive infancy?
  attaches_to:
  - animal_models#Whole-body Nsun3 knockout mouse
  - pathophysiology#Loss of Functional NSun3 Methyltransferase
  rationale: >-
    This is a mismatch of the informative kind: evidence exists in the model and
    contradicts the human course rather than merely failing to reproduce it. The
    conditional cardiac knockout is the workaround, and it does reproduce the
    key biochemical signature - enzyme activities fall while the transcripts
    encoding those subunits do not - but it is confined to heart, which is the
    organ least involved in human NSUN3 disease, and it says nothing about the
    retinal ganglion cell, which is the organ most involved. There is no reported
    model of the optic neuropathy that defines the human disorder.
- discussion_id: nsun3_complex_iii_and_v_sparing
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why are complexes III and V spared in NSUN3 patient muscle when both contain
    mtDNA-encoded subunits that a general methionine-decoding defect should
    affect?
  attaches_to:
  - pathophysiology#Combined Respiratory Chain Enzyme Deficiency
  rationale: >-
    A defect in decoding methionine codons should degrade synthesis of all
    thirteen mtDNA-encoded proteins, and RNAi work in cell lines found exactly
    that. Yet in patient muscle the measurable deficit falls on complexes IV and
    I, with complex III and V protein levels reported as unchanged in one family
    and complex II - the nuclear-encoded internal control - unaffected as
    expected. Whether this reflects differing subunit half-lives, differing
    assembly-intermediate stability, differing sensitivity of the assays, or a
    real difference in translational sensitivity between messages is untested,
    and it matters because complex IV is what the clinical biochemistry actually
    measures.
notes: >-
  Identifiers. MONDO:0033566; OMIM:619012 (COMBINED OXIDATIVE PHOSPHORYLATION
  DEFICIENCY 48; COXPD48), recorded here because the schema's mappings class
  has no OMIM slot. MONDO cross-references OMIM:619012 as an exact match. The
  causal gene is NSUN3, hgnc:26208; NSUN3 itself has OMIM gene entry 617491.

  Why this entry exists as a separate disease rather than a subtype. The MONDO
  parent is MONDO:0000732, combined oxidative phosphorylation deficiency, which
  is a numbered series across dozens of unrelated nuclear genes. Each member is
  a distinct gene-disease entity with its own mechanism, and NSUN3's is a
  distinct step: a tRNA wobble modification, upstream of every mtDNA-encoded
  subunit, rather than a structural subunit or an assembly factor. That is the
  reason to curate it separately, and it is recorded against the CURIE rather
  than against any claim about what other files in this repository do or do not
  contain.

  Grouping membership. No existing grouping fits. The
  Mitochondrial_Complex_IV_Deficiency grouping is anchored to MONDO:0033885,
  mitochondrial complex IV deficiency nuclear-type - an isolated, not a combined,
  deficiency - and its criteria turn on conformance to the
  complex_iv_assembly_deficiency module, which scopes itself to structural
  subunits, assembly and maturation factors, copper metallochaperones and heme A
  biosynthesis. NSUN3 is none of those, and its biochemical phenotype is combined
  rather than isolated even though complex IV is the most consistently affected.
  There is no combined-OXPHOS or mitochondrial-translation grouping in
  kb/groupings/ at the time of writing. A mitochondrial-translation-defect
  grouping would be a coherent future proposal - the mt-tRNA charging,
  modification and translation-factor entities share a mechanism in a way the
  COXPD numbering does not - but it needs its own membership survey and criteria,
  and is deliberately not created here as a side effect of one curation.

  Module conformance. One node conforms:
  mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, and only
  partly, for the reasons recorded in that node's own conformance note.
  Conformance to complex_iv_assembly_deficiency was considered and declined for
  the scope reason above; note that the complex IV grouping does admit one
  translation-level member (TACO1), but TACO1 is a COX-specific translational
  activator whose lesion is confined to complex IV, whereas NSUN3 affects the
  translation of all thirteen mtDNA-encoded proteins. No module in kb/modules/
  currently represents mt-tRNA modification or mitochondrial translation, so the
  upstream four nodes of this entry's chain have no conformance target; that
  absence, rather than a judgement about fit, is why they carry none.

  Attribution cautions carried from the sources. The founding report established
  that f5C34 is lost when m5C34 is lost but explicitly did not identify the
  dioxygenase responsible; ALKBH1 was named in a separate 2016 study, and this
  entry cites that study for the ALKBH1 step rather than attributing it to the
  patient report. Sideroblastic anemia is reported in one individual in the
  five-family cohort but is deliberately not curated as a phenotype here: the
  authors state that it may not be related to the NSUN3 variant and that a
  homozygous loss-of-function variant in a heme-synthesis gene was found in the
  same patient. An early suggestion that exon 3 is a mutational hotspot came from
  a report predating the larger cohort, which found variants across the whole
  gene; the hotspot claim is recorded as superseded rather than repeated. And in
  the cohort paper, a figure legend states that affected individuals from
  Families 1, 2 and 3 displayed COX-negative fibres while the results and
  discussion text both say the Family 1 and Family 2 biopsies did not; the
  per-individual text is quoted here in preference to the legend.

  Named-entity hazards for future curators. NSUN2, NSUN5, NSUN6 and NSUN7 have
  substantial literatures of their own - NSUN2 in particular in intellectual
  disability - and none of it is evidence about NSUN3. ALKBH1/ABH1 has a large
  separate literature as a DNA repair and demethylase enzyme that is not about
  mitochondrial translation. The m5C epitranscriptomics field is mostly
  cytoplasmic; only the mitochondrial tRNA-Met wobble work bears on this
  disorder. NSUN3 also appears in a growing oncology and inflammation literature
  (hepatocellular carcinoma, oral squamous cell carcinoma, sepsis, osteoarthritis)
  that reports m5C effects on nuclear-encoded transcripts and has no bearing on
  this Mendelian entity. And a statement about "combined oxidative phosphorylation
  deficiency" without a gene named is a class-level statement about dozens of
  genes; the one such statement used in this entry is graded and labelled as
  class-level in its explanation.

  Not curated, for want of a source. No natural history, survival, or
  age-of-death data are reported in aggregate; the cohort mentions "possible
  limited life expectancy" without figures, so no progression block is curated.
  No clinical trial has been registered for this disorder. GEO accession
  GSE66012 and EGA study EGAS00001000164 are cited by the founding report but
  are not curated as datasets here because their disease relevance was not
  verified in this session.

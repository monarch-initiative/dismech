- name: Loss of m5C34 in Mitochondrial tRNA-Met
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NSun3's physiological substrate is a single position: cytosine 34, the
    wobble base of the anticodon loop of mt-tRNA-Met (mtDNA position 4432).
    Bisulfite RNA sequencing of patient fibroblasts showed methylation there
    falling to background, while m5C at the other mitochondrial tRNA positions
    the method detected - in mt-tRNA-Leu(UUR), mt-tRNA-Ser(AGY), mt-tRNA-His,

name: Combined oxidative phosphorylation deficiency 48
creation_date: "2026-09-08T00:00:00Z"
description: >-
  Combined oxidative phosphorylation deficiency 48 (COXPD48) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in NSUN3, the
  mitochondrial RNA cytosine-5 methyltransferase that writes m5C at the wobble
  base (C34) of mitochondrial tRNA-Met.

  The lesion sits one step further upstream than most of the combined-OXPHOS
  series. NSun3 is neither a respiratory-chain subunit nor an assembly factor:
  it installs a single tRNA modification. m5C34 is then oxidised by the
  alpha-ketoglutarate- and Fe(II)-dependent dioxygenase ALKBH1/ABH1 to
  5-formylcytidine (f5C34), and mitochondria carry only one tRNA-Met, which
  serves both initiation and elongation and must read AUG together with the
  non-universal AUA (and, at initiation, AUU) codons. Because methionine codons
  occur throughout all thirteen mtDNA-encoded proteins, losing the modification
  degrades translation of every one of them, and the biochemical result is a
  combined rather than an isolated respiratory chain deficiency. Patient
  fibroblasts lose m5C34 and f5C34 together, consistent with a precursor-product
  relationship, while mt-tRNA steady-state levels, aminoacylation and mtDNA copy
  number are unaffected - the defect is one of decoding capacity, not of tRNA
  abundance or mitochondrial biogenesis.

  The clinical spectrum turned out to be much wider than the founding case
  suggested. That patient presented at three months with developmental delay,
  microcephaly, failure to thrive and raised lactate. The largest cohort to date
  - eight individuals from five families - spans neonatal-onset multisystem
  disease to isolated optic atrophy first noticed at 39 years, with bilateral
  optic nerve involvement in 7 of 8 and biallelic loss-of-function or
  SAM-domain missense genotypes clustering at the severe end. Hypertrophic
  cardiomyopathy has since been reported in one further individual.

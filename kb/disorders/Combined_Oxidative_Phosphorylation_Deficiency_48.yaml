- name: Mitochondrial Myopathy of Skeletal Muscle
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Skeletal muscle carries the biochemical lesion but shows a strikingly
    variable histological one, and the variability is itself worth recording: in
    the five-family cohort one individual's biopsy had numerous COX-negative
    fibres while another's had none, and no affected individual had ragged red
    fibres. Subsarcolemmal mitochondrial aggregates were present in three.
    Ultrastructurally, mitochondria were swollen and elongated, spanning a
    sarcomere rather than sitting in the I-band, some with reduced and linearised
    cristae.

    Read the COX-negative-fibre claim carefully. The relevant figure legend in
    that paper states that affected individuals from Families 1, 2 and 3
    displayed COX-negative fibres, but the results and discussion sections both
    say that the Family 1 proband did not, and that the Family 2 biopsy showed
    none either. The per-individual text is the narrower and better-supported
    claim and is what is cited here.

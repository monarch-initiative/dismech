      earlier exon 3 hotspot proposal is not carried forward as current.
- name: ALKBH1
  gene_term:
    preferred_term: ALKBH1
    term:
      id: hgnc:17911
      label: ALKBH1
  notes: >-
    ALKBH1/ABH1 performs the second step of the same two-step modification,
    oxidising NSun3-deposited m5C34 to f5C34. It is listed here as the pathway
    partner that explains why an NSUN3 defect removes f5C as well as m5C, not
    as a COXPD48 disease gene: no ALKBH1 patient variant has been reported in
    this disorder, and the enzyme has a broader substrate range and a separate
    literature of its own.
  evidence:

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  description: >-
    Biallelic NSUN3 genotypes segregate recessively: the founding case was
    compound heterozygous for two predicted loss-of-function alleles, and the
    five-family cohort comprises homozygous and compound heterozygous
    genotypes with carrier parents.

    Two features of that cohort are worth recording. Expressivity is graded by
    genotype rather than uniform - biallelic loss-of-function alleles, or a
    homozygous missense allele hitting the S-adenosylmethionine binding site,
    presented in early infancy, while the milder isolated-optic-atrophy cases
    carried C-terminal variants predicted to escape nonsense-mediated decay. And
    one proband reached homozygosity not by descent but through paternal
    uniparental isodisomy of chromosome 3, in a non-consanguineous family; his
    homozygous father had moderate bilateral optic atrophy. Penetrance is left
    UNKNOWN: with roughly a dozen reported individuals and ascertainment through
    optic-neuropathy and mitochondrial-disease clinics, there is no unselected
    denominator from which to estimate it.

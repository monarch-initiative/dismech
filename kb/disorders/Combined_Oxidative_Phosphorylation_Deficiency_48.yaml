- name: Absence of f5C34 at the Wobble Position
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The mature modification at C34 is not m5C but 5-formylcytidine. m5C34 is the
    obligatory precursor: ALKBH1/ABH1, an alpha-ketoglutarate- and
    Fe(II)-dependent dioxygenase resident in mitochondria, oxidises it to f5C34.
    Losing the first step therefore removes the second. In wild-type fibroblasts
    roughly 36 to 38 percent of mt-tRNA-Met reads carried f5C34 by two
    independent chemistries; in the NSun3-null patient neither method detected
    any.

    Note what this node does and does not claim. The founding report established
    the precursor-product relationship in patient cells but explicitly left the
    responsible dioxygenase unidentified; ALKBH1 was named in a separate study
    published the same year, on the strength of in vitro oxidation assays and
    RNAi depletion, and it is that work rather than the patient report that the
    ALKBH1 evidence here comes from.

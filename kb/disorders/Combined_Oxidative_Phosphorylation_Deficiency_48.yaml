- name: Deficient Mitochondrial Protein Synthesis
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Pulse labelling with radiolabelled methionine under cytoplasmic-translation
    blockade showed the mitochondrial de novo synthesis rate markedly reduced in
    the patient's fibroblasts and substantially restored by NSUN3 re-expression.
    Independent RNAi work found that synthesis of all mitochondrial proteins fell
    on NSUN3 depletion, which is the expected signature of a methionine-decoding
    defect rather than of a subunit-specific lesion.

    Two negative results matter as much as the positive one, because together
    they localise the defect. mt-tRNA steady-state levels and aminoacylation were
    unchanged, and mtDNA copy number was unchanged - so this is not a tRNA
    stability defect, not a charging defect, and not a biogenesis defect.
    Mitochondrial transcript levels actually rose, which the authors read as
    compensatory.

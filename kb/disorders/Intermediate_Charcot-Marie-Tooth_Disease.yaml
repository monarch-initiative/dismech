    explanation: Documents compound-heterozygous (autosomal recessive) inheritance for RI-CMTB.
diagnosis:
- name: Intermediate Nerve Conduction Velocities
  description: >-
    The defining diagnostic feature of intermediate CMT is upper-limb motor nerve
    conduction velocities in an intermediate range that overlaps the CMT1 (<38
    m/s) and CMT2 (>38 m/s) cut-offs, with nerve biopsy showing both
    demyelinating and axonal features. Intermediate CMT is a substantial fraction
    of all CMT: it comprised 13.5% of a large single-centre specialist cohort.
  notes: Distinguishes the intermediate compartment from demyelinating CMT1 and axonal CMT2.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "205 intermediate CMT (CMTi, 13.5%)"
    explanation: Intermediate CMT comprised 13.5% (205/1515) of a specialist CMT cohort, quantifying the size of this compartment.

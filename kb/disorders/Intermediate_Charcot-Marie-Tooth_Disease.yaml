    snippet: "Nerve conduction velocities were between 25 and 35 m/s and peripheral nerve pathology showed axonal as well as demyelinating changes. These findings fitted the definition of intermediate type CMT and further support the view that GDAP1 is vital for both, axonal integrity and Schwann cell properties."

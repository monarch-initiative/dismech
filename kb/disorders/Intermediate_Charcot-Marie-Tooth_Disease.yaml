  description: >-
    Dominant-intermediate CMT type B, caused by mutations in DNM2 encoding
    dynamin-2, a large GTPase of the cellular membrane fission-fusion apparatus.
    DNM2 is pleiotropic — other DNM2 mutations cause centronuclear myopathy.
    Subtype-level clinical and management detail is curated in the dedicated
    entry Charcot-Marie-Tooth Disease Dominant Intermediate B; this row records
    the subtype's membership of the intermediate compartment and its gene.

- name: DI-CMTD
  display_name: DI-CMTD (MPZ / myelin protein zero)
  subtype_term:
    preferred_term: DI-CMTD
    term:
      id: MONDO:0011909
      label: Charcot-Marie-Tooth disease dominant intermediate D
  description: >-
    Dominant-intermediate CMT type D, caused by heterozygous mutations in MPZ
    encoding myelin protein zero, the major structural glycoprotein of compact
    peripheral-nerve myelin. MPZ is one of several genes in this compartment whose
    allelic series crosses the CMT compartment boundaries: different MPZ alleles
    produce
    demyelinating, axonal or intermediate neuropathy, so the demyelinating form
    (CMT1B) is curated on the Charcot-Marie-Tooth Disease Type 1 entry and the
    axonal forms (CMT2I/CMT2J) on Charcot-Marie-Tooth Disease Type 2, while this
    row holds only the intermediate presentation.
  genes:
  - preferred_term: MPZ
    term:
      id: hgnc:7225
      label: MPZ
  evidence:
  - reference: PMID:22704856
    reference_title: "Intermediate Charcot-Marie-Tooth disease due to a novel Trp101Stop myelin protein zero mutation associated with debilitating neuropathic pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myelin protein zero is a key structural component of compact myelin, and over 100 mutations in this protein have been reported, which can give rise to neuropathies with either axonal, demyelinating, or intermediate features encompassing a wide range of severity."
    explanation: >-
      States that MPZ alleles can produce axonal, demyelinating or intermediate
      neuropathy, which is why the intermediate presentation is a distinct
      subtype row here rather than being folded into CMT1B.
  - reference: PMID:22704856
    reference_title: "Intermediate Charcot-Marie-Tooth disease due to a novel Trp101Stop myelin protein zero mutation associated with debilitating neuropathic pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiological studies revealed mild features of demyelination with median conduction velocity in the intermediate range."
    explanation: >-
      The electrophysiological observation that places this MPZ kindred in the
      intermediate conduction-velocity compartment.

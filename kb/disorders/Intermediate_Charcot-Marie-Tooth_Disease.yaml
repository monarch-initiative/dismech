- name: Combined Demyelinating and Axonal Degeneration
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    The shared terminal node of the intermediate CMT compartment. The diverse
    upstream lesions (DNM2 membrane-remodelling failure, aminoacyl-tRNA
    synthetase dysfunction, GNB4 signaling defect) converge on peripheral nerve
    pathology that combines demyelination and length-dependent axonal
    degeneration — the combination that produces the intermediate nerve
    conduction velocities defining this compartment and the progressive distal
    deficit shared with the CMT1 and CMT2 compartments.

name: Intermediate Charcot-Marie-Tooth Disease
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Intermediate Charcot-Marie-Tooth disease (intermediate CMT / CMTi) is the
  compartment of Charcot-Marie-Tooth disease that sits electrophysiologically and
  pathologically between the demyelinating (CMT1) and axonal (CMT2) compartments.
  It is defined by upper-limb motor nerve conduction velocities in an intermediate
  range (classically ~25–45 m/s, overlapping the CMT1 and CMT2 cut-offs) and by
  nerve pathology that combines features of both demyelination and axonal
  degeneration — sometimes varying between affected members of a single family.
  Intermediate CMT is not a trivial category: in a 1,515-patient specialist
  cohort it comprised 13.5% of all CMT presentations (205 patients), the third
  largest group in that cohort after CMT1 (41.0%) and CMT2 (19.4%). It occurs in dominant-intermediate (DI-CMT) and
  recessive-intermediate (RI-CMT) forms. The dominant-intermediate subtypes
  include DI-CMTB (DNM2 / dynamin-2, a membrane-remodelling large GTPase),
  DI-CMTC (YARS1 / tyrosyl-tRNA synthetase), DI-CMTD (MPZ / myelin protein
  zero), DI-CMTE (INF2 / inverted formin 2, with focal segmental
  glomerulosclerosis), DI-CMTF (GNB4 / G-protein beta-4) and DI-CMTG (NEFL /
  neurofilament light chain); the recessive-intermediate subtypes are RI-CMTA
  (GDAP1), RI-CMTB (KARS1 / lysyl-tRNA synthetase, so the
  aminoacyl-tRNA-synthetase mechanism recurs recessively), RI-CMTC (PLEKHG5)
  and RI-CMTD (COX6A1, which is simultaneously a mitochondrial complex IV
  disorder). Several intermediate-CMT genes are pleiotropic — DNM2, for example,
  also causes centronuclear myopathy — and MPZ, NEFL and GDAP1 each carry
  allelic series that cross the compartment boundary, producing demyelinating or
  axonal CMT with other alleles. Whatever the gene, the subtypes converge on the shared CMT
  terminal node — combined demyelination and length-dependent axonal
  degeneration — producing the uniform clinical picture of distal weakness,
  wasting, sensory loss, foot deformity, and depressed reflexes.
disease_term:
  preferred_term: Intermediate Charcot-Marie-Tooth disease (CMTi)
  term:
    id: MONDO:0018778
    label: intermediate Charcot-Marie-Tooth disease
parents:
- Charcot-Marie-Tooth disease
notes: >-
  Scope and placement of the intermediate-CMT series. This entry is the
  intermediate compartment of CMT, the sibling of Charcot-Marie-Tooth Disease
  Type 1 (demyelinating), Type 2 (axonal) and Type 4 (recessive demyelinating).
  Its `has_subtypes` rows inventory the ten numbered dominant-intermediate and
  recessive-intermediate subtypes MONDO files under `MONDO:0018778`, each bound to
  its MONDO term. Four of them — DI-CMTB,
  DI-CMTE, DI-CMTG and RI-CMTD — also have dedicated Disease entries in this KB
  that hold their mechanism, allele and management detail; the rows here record
  compartment membership and the causal gene, and each row's description names
  the entry that owns the rest.

  Two MONDO descendants of `MONDO:0018778` are deliberately not subtype rows.
  `MONDO:0011675` is labelled "Charcot-Marie-Tooth Disease, axonal, type 2GG",
  carries GBF1 as its causal gene, and is described by its own MedGen record
  (MEDGEN:1794143) as an autosomal dominant axonal neuropathy with
  electrophysiology consistent with an axonal process — so it belongs to the
  axonal compartment, and it reaches this branch only through an `is_a` edge to
  `MONDO:0019548 autosomal dominant intermediate Charcot-Marie-Tooth disease`.
  That edge sits alongside CMTDIA and "Charcot-Marie-Tooth disease, dominant
  intermediate A" synonyms which the same term still carries, even though a
  separate term now bears that label; both look like residue of the earlier
  naming of OMIM:606483 rather than a claim about the disease. CMT2GG has an open
  stub (`stubs/Charcot-Marie-Tooth_Disease_Axonal_Type_2GG.yaml`) and is left
  there for the axonal compartment to curate. `MONDO:0957273`, xrefed to
  OMIM:620378 and MEDGEN:376235, is the term whose primary label is
  "Charcot-Marie-Tooth disease, dominant intermediate A"; MONDO records no causal
  gene for it and its MedGen description states that one family has been
  reported, so there is no gene-defined subtype here to curate.

  MPZ, NEFL and GDAP1 each cause CMT in more than one compartment. The
  demyelinating MPZ form (CMT1B) is curated on Charcot-Marie-Tooth Disease
  Type 1, the axonal MPZ forms (CMT2I/CMT2J) and the axonal NEFL form (CMT2E) on
  Charcot-Marie-Tooth Disease Type 2, the demyelinating recessive GDAP1 form
  (CMT4A) on Charcot-Marie-Tooth Disease Type 4 and the axonal GDAP1 form (CMT2K)
  on Charcot-Marie-Tooth Disease Type 2. Only the intermediate presentations are
  curated here, and the `genetic:` records say so. DNM2 probably belongs on that
  list too — `MONDO:0016431 autosomal dominant Charcot-Marie-Tooth disease
  type 2M` has both DI-CMTB and CMT2 as MONDO parents — but MONDO puts no causal
  gene on that term, so the cross-compartment claim for DNM2 rests on the gene
  symbol's history rather than on an ontology edge, and no entry or stub here
  binds it.

- name: MPZ Compact-Myelin Structural Defect
  biological_scale: CELLULAR
  description: >-
    Heterozygous MPZ mutations (DI-CMTD) disrupt myelin protein zero, the major
    structural glycoprotein of compact peripheral-nerve myelin made by Schwann
    cells. Different MPZ alleles shift the balance between demyelinating and
    axonal pathology; the intermediate presentation shows mild demyelinating
    features with conduction velocities in the intermediate range.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:

- name: GDAP1 Loss of Axonal and Schwann-Cell Integrity
  biological_scale: CELLULAR
  description: >-
    Biallelic GDAP1 loss-of-function alleles (RI-CMTA) compromise peripheral
    nerve on both sides of the axon-glia partnership: nerve pathology in
    intermediate-type GDAP1 families shows axonal degeneration together with
    demyelinating change, which is why GDAP1 alleles can present as axonal,
    demyelinating or intermediate neuropathy.

inheritance:
- name: Autosomal Dominant
  description: >-
    The dominant-intermediate CMT subtypes — DI-CMTB (DNM2), DI-CMTC (YARS1),
    and DI-CMTF (GNB4) — are inherited in an autosomal dominant manner.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:15731758
    reference_title: "Mutations in the pleckstrin homology domain of dynamin 2 cause dominant intermediate Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different chromosomal loci have been linked with three autosomal dominant, 'intermediate' types of CMT: DI-CMTA, DI-CMTB and DI-CMTC."
    explanation: Documents autosomal dominant inheritance of the dominant-intermediate CMT subtypes.
- name: Autosomal Recessive
  description: >-
    Recessive-intermediate CMT (RI-CMT) subtypes, including RI-CMTB (KARS1),
    are inherited in an autosomal recessive manner, requiring biallelic
    (compound-heterozygous or homozygous) loss-of-function variants.
  inheritance_term:

name: Intermediate Charcot-Marie-Tooth Disease
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Intermediate Charcot-Marie-Tooth disease (intermediate CMT / CMTi) is the
  compartment of Charcot-Marie-Tooth disease that sits electrophysiologically and
  pathologically between the demyelinating (CMT1) and axonal (CMT2) compartments.
  It is defined by upper-limb motor nerve conduction velocities in an intermediate
  range (classically ~25–45 m/s, overlapping the CMT1 and CMT2 cut-offs) and by
  nerve pathology that combines features of both demyelination and axonal
  degeneration — sometimes varying between affected members of a single family.
  Intermediate CMT is not a trivial category: in a 1,515-patient specialist
  cohort it comprised 13.5% of all CMT presentations, more than the axonal-optic
  and HNPP groups combined. It occurs in dominant-intermediate (DI-CMT) and
  recessive-intermediate (RI-CMT) forms. The dominant-intermediate subtypes
  include DI-CMTB (DNM2 / dynamin-2, a membrane-remodelling large GTPase),
  DI-CMTC (YARS1 / tyrosyl-tRNA synthetase), and DI-CMTF (GNB4 / G-protein
  beta-4); the aminoacyl-tRNA-synthetase mechanism recurs in the
  recessive-intermediate form RI-CMTB (KARS1 / lysyl-tRNA synthetase). Several
  intermediate-CMT genes are pleiotropic — DNM2, for example, also causes
  centronuclear myopathy. Whatever the gene, the subtypes converge on the shared CMT
  terminal node — combined demyelination and length-dependent axonal
  degeneration — producing the uniform clinical picture of distal weakness,
  wasting, sensory loss, foot deformity, and depressed reflexes.
disease_term:
  preferred_term: Intermediate Charcot-Marie-Tooth disease (CMTi)
  term:
    id: MONDO:0018778
    label: intermediate Charcot-Marie-Tooth disease
parents:
- Charcot-Marie-Tooth disease
has_subtypes:
- name: DI-CMTB
  display_name: DI-CMTB (DNM2 / dynamin-2)
  description: >-
    Dominant-intermediate CMT type B, caused by mutations in DNM2 encoding
    dynamin-2, a large GTPase of the cellular membrane fission-fusion apparatus.
    DNM2 is pleiotropic — other DNM2 mutations cause centronuclear myopathy.
  evidence:
  - reference: PMID:15731758
    reference_title: "Mutations in the pleckstrin homology domain of dynamin 2 cause dominant intermediate Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified unique mutations in dynamin 2 (DNM2) in all families. DNM2 belongs to the family of large GTPases and is part of the cellular fusion-fission apparatus."
    explanation: Establishes DNM2 mutations as the cause of dominant-intermediate CMT (DI-CMTB).
- name: DI-CMTC
  display_name: DI-CMTC (YARS1 / tyrosyl-tRNA synthetase)
  description: >-
    Dominant-intermediate CMT type C, caused by mutations in YARS1 (YARS)
    encoding tyrosyl-tRNA synthetase — the first aminoacyl-tRNA synthetase linked
    to CMT, mislocalizing to axonal termini and partially losing aminoacylation
    activity.
  evidence:
  - reference: PMID:16429158
    reference_title: "Disrupted function and axonal distribution of mutant tyrosyl-tRNA synthetase in dominant intermediate Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify two heterozygous missense mutations (G41R and E196K) and one de novo deletion (153-156delVKQV) in tyrosyl-tRNA synthetase (YARS) in three unrelated families affected with DI-CMTC."
    explanation: Establishes YARS1 (YARS) mutations as the cause of dominant-intermediate CMT (DI-CMTC).
- name: DI-CMTF
  display_name: DI-CMTF (GNB4 / G-protein beta-4)
  description: >-
    Dominant-intermediate CMT type F, caused by mutations in GNB4 encoding the
    G-protein beta-4 subunit, implicating G-protein-coupled receptor signaling in
    peripheral-nerve function.
  evidence:
  - reference: PMID:23434117
    reference_title: "Exome sequencing identifies GNB4 mutations as a cause of dominant intermediate Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealed heterozygous mutation c.158G>A (p.Gly53Asp) in GNB4, encoding guanine-nucleotide-binding protein subunit beta-4"
    explanation: Establishes GNB4 mutations as the cause of dominant-intermediate CMT (DI-CMTF).
- name: RI-CMTB
  display_name: RI-CMTB (KARS1 / lysyl-tRNA synthetase)
  description: >-
    Recessive-intermediate CMT type B, caused by biallelic loss-of-function
    mutations in KARS1 (KARS) encoding lysyl-tRNA synthetase — a second
    aminoacyl-tRNA synthetase implicated in CMT, here acting recessively.
  evidence:
  - reference: PMID:20920668
    reference_title: "Compound heterozygosity for loss-of-function lysyl-tRNA synthetase mutations in a patient with peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe three variants (p.Leu133His, p.Tyr173SerfsX7, and p.Ile302Met) in the lysyl-tRNA synthetase (KARS) gene in two patients from this cohort."
    explanation: Establishes compound-heterozygous KARS1 (KARS) loss-of-function variants as a cause of recessive-intermediate CMT (RI-CMTB).
pathophysiology:
- name: DNM2 Membrane Remodeling Defect
  description: >-
    Mutations in DNM2 (DI-CMTB) impair dynamin-2, a large GTPase of the membrane
    fission-fusion machinery that mediates membrane scission during endocytosis
    and vesicle trafficking. Disrupted DNM2-dependent membrane remodeling in
    Schwann cells and neurons produces a mixed demyelinating-and-axonal
    (intermediate) neuropathy.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Endocytosis
    term:
      id: GO:0006897
      label: endocytosis
    modifier: ABNORMAL
  genes:
  - preferred_term: DNM2
    term:
      id: hgnc:2974
      label: DNM2
  downstream:
  - target: Combined Demyelinating and Axonal Degeneration
    description: >-
      DNM2-dependent membrane-trafficking failure impairs both Schwann-cell and
      axonal homeostasis, converging on the mixed intermediate lesion.
  evidence:
  - reference: PMID:15731758
    reference_title: "Mutations in the pleckstrin homology domain of dynamin 2 cause dominant intermediate Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified unique mutations in dynamin 2 (DNM2) in all families. DNM2 belongs to the family of large GTPases and is part of the cellular fusion-fission apparatus."
    explanation: Establishes DNM2 (a membrane fission-fusion GTPase) as the DI-CMTB gene.
- name: Aminoacyl-tRNA Synthetase Dysfunction
  description: >-
    Mutations in the aminoacyl-tRNA synthetases YARS1 (tyrosyl-tRNA synthetase,
    DI-CMTC) and KARS1 (lysyl-tRNA synthetase, RI-CMTB) partially impair
    tRNA-charging (aminoacylation) activity and, for YARS1, mislocalize the
    enzyme within the axon. Aminoacyl-tRNA synthetase impairment is a recurrent
    CMT mechanism, predominantly producing axonal pathology, and here yields the
    intermediate phenotype.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: tRNA aminoacylation for protein translation
    term:
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
    modifier: DECREASED
  genes:
  - preferred_term: YARS1
    term:
      id: hgnc:12840
      label: YARS1
  - preferred_term: KARS1
    term:
      id: hgnc:6215
      label: KARS1
  downstream:
  - target: Combined Demyelinating and Axonal Degeneration
    description: >-
      Impaired tRNA aminoacylation compromises protein synthesis in long
      peripheral neurons, converging on the intermediate demyelinating-and-axonal
      lesion.
  evidence:
  - reference: PMID:16429158
    reference_title: "Disrupted function and axonal distribution of mutant tyrosyl-tRNA synthetase in dominant intermediate Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical experiments and genetic complementation in yeast show partial loss of aminoacylation activity of the mutant proteins"
    explanation: Demonstrates partial loss of aminoacylation activity for DI-CMTC YARS1 mutants.
  - reference: PMID:20920668
    reference_title: "Compound heterozygosity for loss-of-function lysyl-tRNA synthetase mutations in a patient with peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in three genes encoding aminoacyl-tRNA synthetases (ARSs) have been implicated in CMT disease primarily associated with an axonal pathology."
    explanation: Establishes aminoacyl-tRNA synthetase dysfunction (including KARS1) as a recurrent CMT mechanism.
- name: GNB4 G-Protein Signaling Defect
  description: >-
    Mutations in GNB4 (DI-CMTF) disrupt the G-protein beta-4 subunit, which is
    expressed in axons and Schwann cells of peripheral nerve, implicating
    G-protein-coupled receptor signaling in the maintenance of peripheral-nerve
    function.

  evidence:
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six patients with multiple adenomas and eight patients with polyposis had
      biallelic germline MYH variants.
    explanation: >-
      Documents biallelic MUTYH variants across both the multiple-adenoma and
      polyposis presentations.
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although typically associated with ten to a few hundred colonic
      adenomatous polyps, CRC develops in some individuals in the absence of
      polyposis.
    explanation: >-
      GeneReviews Clinical Characteristics section, giving the polyp-count range
      and the important caveat that colorectal cancer can arise with no
      polyposis at all — so a normal polyp count does not exclude the diagnosis.
- category: Gastrointestinal
  name: Colorectal Carcinoma
  description: >-
    Colorectal cancer arising through the adenoma-carcinoma sequence in the
    setting of a transversion-biased mutator phenotype.
  phenotype_term:
    preferred_term: Colon cancer
    term:
      id: HP:0003003
      label: Colon cancer
  evidence:
  - reference: PMID:11818965
    reference_title: "Inherited variants of MYH associated with somatic G:C-->T:A mutations in colorectal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have studied family N, which is affected with multiple colorectal
      adenomas and carcinoma but lacks an inherited mutation of the adenomatous
      polyposis coli gene (APC) that is associated with familial adenomatous
      polyposis.
    explanation: >-
      Establishes carcinoma as part of the phenotype in the index family, and
      the absence of germline APC that distinguishes MAP from FAP.
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MUTYH polyposis (also referred to as MUTYH-associated polyposis, or MAP)
      is characterized by a greatly increased lifetime risk of colorectal cancer
      (CRC).
    explanation: >-
      GeneReviews Clinical Characteristics section, stating colorectal cancer as
      the dominant lifetime risk of the syndrome.
- category: Gastrointestinal
  name: Duodenal Polyposis
  description: >-
    Duodenal adenomas are a common extracolonic feature and carry their own
    cancer risk, which is why upper endoscopy with side-viewing duodenoscopy is
    part of surveillance rather than an optional extra.
  phenotype_term:
    preferred_term: Duodenal polyposis
    term:
      id: HP:0004783
      label: Duodenal polyposis
  evidence:
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Duodenal adenomas are common, with an increased risk of duodenal cancer.
    explanation: >-
      GeneReviews Clinical Characteristics section, establishing duodenal
      adenomas as a common feature and the basis for upper-tract surveillance.
- category: Neoplastic
  name: Extracolonic Malignancy Risk
  description: >-
    Beyond the gastrointestinal tract, risk is increased for ovarian and bladder
    malignancy, with weaker evidence for breast and endometrial cancer. These
    are recorded as an increased risk rather than as penetrant features.
  phenotype_term:
    preferred_term: Neoplasm by anatomical site
    term:
      id: HP:0011793
      label: Neoplasm by anatomical site
  evidence:
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The risk for malignancies of the ovary and bladder is also increased, and
      there is some evidence of an increased risk for breast and endometrial
      cancer.
    explanation: >-
      GeneReviews Clinical Characteristics section. The graded wording is
      preserved — ovary and bladder are stated as increased, breast and
      endometrium only as "some evidence".
genetic:
- name: MUTYH
  gene_term:
    preferred_term: MUTYH
    term:
      id: hgnc:7527
      label: MUTYH
  relationship_type: CAUSATIVE
  notes: >-
    MUTYH encodes the adenine DNA glycosylase of base-excision repair. Biallelic
    germline variants cause MUTYH-associated polyposis; monoallelic carriage
    confers at most a modest colorectal cancer risk and is not this disorder.
  evidence:
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For patients with about 15 or more colorectal adenomas--especially if no
      germ-line APC mutation has been identified and the family history is
      compatible with recessive inheritance--genetic testing of MYH is indicated
      for diagnosis and calculation of the level of risk in relatives.
    explanation: >-
      Defines the clinical criteria for MUTYH testing derived from the causal
      relationship between biallelic variants and the phenotype.
treatments:
- name: Colonoscopic Surveillance and Polypectomy
  notes: >-
    Curated under `treatments:` as a management intervention, not as a claim
    that endoscopy is itself therapeutic. The initiating lesion here is
    constitutional and cannot be reversed — in MAP that is biallelic MUTYH
    base-excision-repair failure, not a two-hit tumor suppressor architecture
    (see the entry-level `notes:` on the boundary with FAP) — so the only
    available lever is stage at detection: surveillance is the intervention
    that converts an otherwise unavoidable carcinoma into a resectable polyp.
    Where a `target_mechanisms` link is present it points at the
    clinical-outcome node for that reason, and never at an upstream
    mechanistic node.
  description: >-
    Because MAP reaches carcinoma through the same adenoma-carcinoma sequence as
    the APC-related polyposes, the clinical care of biallelic MUTYH carriers is
    the same as for classic or attenuated familial adenomatous polyposis:
    endoscopic surveillance with polypectomy, escalating to colectomy when polyp
    burden becomes unmanageable.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Multiple Colorectal Adenomas and Carcinoma Risk
    treatment_effect: INHIBITS
    description: >-
      Surveillance and polypectomy do not correct the constitutional repair
      defect or the mutator phenotype; they remove initiated adenomas before
      they progress, acting on the consequence node.
  evidence:
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical care of patients with biallelic MYH mutations should be similar
      to that of patients with classic or attenuated familial adenomatous
      polyposis.
    explanation: >-
      The source's own recommendation that management follow the FAP model,
      which is what this treatment entry curates.
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Colonoscopy with polypectomy every one to two years beginning at age 25-30
      years; upper endoscopy and side viewing duodenoscopy every three months to
      four years beginning at age 30-35 years with subsequent follow up based on
      initial findings.
    explanation: >-
      GeneReviews Management section, giving the concrete surveillance intervals
      and starting ages for both the colonic and duodenal arms.
- name: Colectomy for Unmanageable Polyp Burden
  description: >-
    Polypectomy is continued until the size and density of polyps outstrip what
    endoscopy can manage, at which point subtotal colectomy or proctocolectomy
    is performed. The threshold is operational rather than a fixed polyp count.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Multiple Colorectal Adenomas and Carcinoma Risk
    treatment_effect: INHIBITS
    description: >-
      Colectomy removes the at-risk colonic epithelium once endoscopic clearance
      is no longer feasible; it does not correct the constitutional repair
      defect, so duodenal surveillance continues afterwards.
  evidence:
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Suspicious polyps identified on colonoscopy should be removed until
      polypectomy alone cannot manage the large size and density of the polyps,
      at which point either subtotal colectomy or proctocolectomy is performed.
    explanation: >-
      GeneReviews Management section, stating both the escalation trigger and
      the two operations, which is what this treatment entry curates.
diagnosis:
- name: Molecular Genetic Testing for Biallelic MUTYH Variants
  description: >-
    The diagnosis requires demonstrating pathogenic variants in BOTH MUTYH
    alleles. This is the point at which MAP separates operationally from the
    dominant polyposis syndromes: a single variant does not establish the
    diagnosis, and the testing question in a polyposis patient with no germline
    APC variant and a recessive-compatible family history is specifically
    whether both MUTYH alleles are affected.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of biallelic germline pathogenic MUTYH variants establishes
    the diagnosis and makes sibling testing the priority for the family.
  evidence:
  - reference: PMID:23035301
    reference_title: "MUTYH Polyposis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is established in a proband by identification of biallelic
      germline pathogenic variants in MUTYH on molecular genetic testing.
    explanation: >-
      GeneReviews Diagnosis/Testing section, stating the confirmatory test and
      the biallelic requirement that defines this disorder.
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For patients with about 15 or more colorectal adenomas--especially if no
      germ-line APC mutation has been identified and the family history is
      compatible with recessive inheritance--genetic testing of MYH is indicated
      for diagnosis and calculation of the level of risk in relatives.
    explanation: >-
      Gives the clinical threshold at which MUTYH testing is indicated, which is
      the selection criterion for the test curated here.

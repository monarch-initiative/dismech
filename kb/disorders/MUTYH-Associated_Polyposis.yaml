  - reference: clinicaltrials:NCT07461246
    reference_title: Rete Italiana Poliposi Adenomatosa Familiare (RIPAF)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The registry includes patients with APC-related FAP (classic and attenuated forms), MUTYH-associated polyposis (MAP), and adenomatous polyposis not associated with APC or MUTYH mutations (NAMP)
    explanation: >-
      Registry record confirming MUTYH-associated polyposis is an enrolled
      cohort, so the registry's outcome data will be MAP-specific.
notes: >-
  Boundary with familial adenomatous polyposis. MUTYH-associated polyposis and
  APC-related FAP are kept as separate entries because they are different
  mechanisms that converge on a similar colonic phenotype, not one disease with
  two genes. FAP is an autosomal dominant two-hit tumor suppressor syndrome and
  conforms to `germline_two_hit_tumor_predisposition`; MAP is autosomal
  recessive, requires biallelic MUTYH from the outset, and acts through failed
  base excision repair of 8-oxoguanine, so it conforms to
  `genome_instability_mutation` instead. The practical consequences differ too:
  MAP siblings carry a one-in-four recurrence risk while offspring are usually
  unaffected, which is the inverse of the FAP counselling picture. A shared
  polyposis registry may enrol both, and this entry cites one that does, but
  that is cohort convenience rather than a claim of shared mechanism.

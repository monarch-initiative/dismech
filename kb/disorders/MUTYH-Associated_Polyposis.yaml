name: MUTYH-Associated Polyposis
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Gastrointestinal Neoplasia
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: familial adenomatous polyposis 2
  term:
    id: MONDO:0012041
    label: familial adenomatous polyposis 2
synonyms:
- MAP
- MUTYH-associated polyposis
- MYH-associated polyposis
- autosomal recessive colorectal adenomatous polyposis
description: >-
  MUTYH-associated polyposis (MAP) is an autosomal recessive colorectal
  adenomatous polyposis caused by biallelic germline variants in MUTYH, the human
  homolog of bacterial mutY, which encodes the adenine DNA glycosylase of the
  base-excision-repair pathway. It is the exception that clarifies the rule among
  the polyposis syndromes, and its mechanism is deliberately NOT the Knudson
  two-hit route. MAP carriers inherit two damaged alleles of a repair gene rather
  than one damaged allele of a tumor suppressor; the resulting defect is a
  constitutional mutator phenotype rather than a constitutional loss of growth
  restraint. MUTYH excises adenine that DNA polymerase has misincorporated
  opposite 8-oxoguanine, the commonest oxidative base lesion. Without it, those
  mispairs are fixed as G:C to T:A transversions, and the tumor suppressor that
  actually initiates the adenoma — APC — is then inactivated somatically by
  exactly that mutational signature. The evidence for this chain is unusually
  direct: MUTYH was identified by noticing that a family with multiple colorectal
  adenomas but no germline APC mutation had tumors whose somatic APC mutations
  were overwhelmingly G:C to T:A transversions, and in confirmed biallelic
  carriers every somatic APC mutation found was of that type.
  Clinically MAP presents as multiple (typically 15 to a few hundred) colorectal
  adenomas, overlapping both attenuated and classic familial adenomatous
  polyposis, and its recognition matters because the recessive inheritance
  changes who in the family is at risk: siblings, not offspring, are the
  high-risk relatives.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    MAP is inherited as an autosomal recessive trait; both MUTYH alleles must be
    damaged. This is the single most important practical difference from
    APC-related familial adenomatous polyposis, because it relocates the genetic
    risk in a family from the offspring of an affected person to their siblings,
    and because a family history may appear negative across generations.
  evidence:
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germ-line MYH mutations predispose persons to a recessive phenotype,
      multiple adenomas, or polyposis coli.
    explanation: >-
      States the recessive inheritance and the range of colorectal phenotypes it
      produces.
pathophysiology:
- name: Biallelic Germline MUTYH Base-Excision-Repair Deficiency
  conforms_to: "genome_instability_mutation#Genome-Maintenance Defect or Replication Stress"
  description: >-
    Both MUTYH alleles carry damaging germline variants. The two commonest
    founder alleles in European populations, Tyr165Cys and Gly382Asp, alter
    residues conserved in bacterial mutY — Tyr82, in the
    pseudo-helix-hairpin-helix motif predicted to determine mismatch specificity, and Gly253 — and
    the corresponding mutant proteins show significantly reduced adenine
    glycosylase activity against 8-oxoG:A and G:A substrates. Note this is a
    constitutional biallelic state present in every cell, not a first hit
    awaiting a second: MAP does not conform to the germline two-hit
    predisposition module.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: MUTYH
    modifier: DECREASED
    term:
      id: hgnc:7527
      label: MUTYH
  genetic_context:
    gene:
      preferred_term: MUTYH
      term:
        id: hgnc:7527
        label: MUTYH
    variant_origin: GERMLINE
    allelic_hit_role: BIALLELIC_INACTIVATION
    allelic_events:
    - MISSENSE_VARIANT
    - PATHOGENIC_VARIANT
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional biallelic MUTYH variants — homozygous or compound
      heterozygous, missense or protein-truncating — reducing adenine glycosylase
      activity.
  molecular_functions:
  - preferred_term: adenine DNA glycosylase activity
    term:
      id: GO:0019104
      label: DNA N-glycosylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11818965
    reference_title: "Inherited variants of MYH associated with somatic G:C-->T:A mutations in colorectal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the human homolog of mutY, MYH, showed that the siblings were
      compound heterozygotes for the nonconservative missense variants Tyr165Cys
      and Gly382Asp.
    explanation: >-
      Identifies the biallelic germline genotype in the family that defined the
      syndrome.
  - reference: PMID:11818965
    reference_title: "Inherited variants of MYH associated with somatic G:C-->T:A mutations in colorectal tumors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Assays of adenine glycosylase activity of the Tyr82Cys and Gly253Asp
      mutant proteins with 8-oxoG:A and G:A substrates show that their activity
      is reduced significantly.
    explanation: >-
      Functional evidence that the founder alleles impair the enzyme's catalytic
      activity, establishing the repair deficiency at the protein level.
      Evidence source is IN_VITRO (biochemical glycosylase assays).
  downstream:
  - target: Unrepaired 8-Oxoguanine Mispairs and G:C to T:A Transversion Mutator Phenotype
    description: >-
      Without adenine glycosylase activity, adenine misincorporated opposite
      8-oxoguanine is not excised and the mispair is fixed at replication.

- name: Unrepaired 8-Oxoguanine Mispairs and G:C to T:A Transversion Mutator Phenotype
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    The rate-limiting state: oxidative damage generates 8-oxoguanine, DNA
    polymerase misincorporates adenine opposite it, and the uncorrected mispair
    is fixed at the next replication as a G:C to T:A transversion. The result is
    a constitutional bias in the kind of mutation the cell accumulates rather
    than in the overall rate of chromosomal change, which is why MAP tumors carry
    a recognizable mutational signature. The parallel with bacteria is exact and
    was the reasoning that identified the gene: loss of mutM or mutY in
    Escherichia coli produces the same transversion excess.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: base-excision repair
    term:
      id: GO:0006284
      label: base-excision repair
    modifier: DECREASED
  evidence:
  - reference: PMID:11818965
    reference_title: "Inherited variants of MYH associated with somatic G:C-->T:A mutations in colorectal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inherited defects of base excision repair have not been associated with
      any human genetic disorder, although mutations of the genes mutM and mutY,
      which function in Escherichia coli base excision repair, lead to increased
      transversions of G:C to T:A.
    explanation: >-
      States the bacterial precedent that predicts the transversion signature,
      and establishes MAP as the first human disorder of inherited base-excision
      repair deficiency.
  downstream:
  - target: Somatic APC Inactivation by Transversion
    description: >-
      The transversion bias is applied genome-wide, but its consequence in
      colorectal epithelium is inactivation of APC.

- name: Somatic APC Inactivation by Transversion
  description: >-
    The transversion-biased mutator phenotype inactivates APC somatically in
    colorectal epithelial cells, and the mutational signature is what betrays the
    mechanism: in the index family 15 of 18 somatic APC mutations across 11
    tumors were of this type, a significantly greater proportion than in sporadic
    tumors or in APC-related familial adenomatous polyposis, and in confirmed
    biallelic carriers all somatic APC mutations found were G:C to T:A
    transversions. MAP therefore reaches the same effector lesion as classic FAP
    — APC loss and Wnt pathway activation — but by an entirely different route,
    with no germline APC involvement at all.
  role: effector
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: APC
      term:
        id: hgnc:583
        label: APC
    variant_origin: SOMATIC
    allelic_events:
    - PATHOGENIC_VARIANT
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Somatic APC inactivation acquired through the MUTYH-deficient transversion
      signature, in a person with no germline APC mutation.
  evidence:
  - reference: PMID:11818965
    reference_title: "Inherited variants of MYH associated with somatic G:C-->T:A mutations in colorectal tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings link the inherited variants in MYH to the pattern of somatic
      APC mutation in family N and implicate defective base excision repair in
      predisposition to tumors in humans.
    explanation: >-
      Establishes the causal link between the inherited repair defect and the
      somatic APC mutational pattern, which is the claim this node makes.
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the tumors of carriers of biallelic mutations, all somatic APC
      mutations were G:C-->T:A transversions.
    explanation: >-
      Independent confirmation in a larger series that the somatic APC lesion in
      biallelic MUTYH carriers carries the predicted signature without exception.
  downstream:
  - target: Multiple Colorectal Adenomas and Carcinoma Risk
    description: >-
      APC-inactivated crypts initiate adenomas, which accumulate in numbers
      proportional to the constitutional mutation rate.

- name: Multiple Colorectal Adenomas and Carcinoma Risk
  description: >-
    The clinical output: multiple colorectal adenomas, most often in the tens to
    low hundreds, with progression to colorectal carcinoma. The phenotype spans
    the attenuated and classic FAP ranges — about a third of patients with more
    than 15 adenomas carried biallelic MUTYH variants in the defining series —
    but severe polyposis with more than 1000 adenomas was not seen in biallelic
    carriers, so extreme polyp burden argues for APC rather than MUTYH.
    Extracolonic disease occurs in a minority.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the group with multiple adenomas, about one third of patients with more
      than 15 adenomas had biallelic MYH mutations.
    explanation: >-
      Quantifies the diagnostic yield of MUTYH testing at the polyp-count
      threshold that defines the clinical presentation.
  - reference: PMID:12606733
    reference_title: "Multiple colorectal adenomas, classic adenomatous polyposis, and germ-line mutations in MYH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the polyposis group, no patient with biallelic MYH mutations had severe
      disease (>1000 adenomas), but three had extracolonic disease.
    explanation: >-
      Supports both the upper bound on polyp burden in MAP and the occurrence of
      extracolonic disease in a minority.

histopathology:

- name: Mucinous Epithelium in Extracellular Mucin Pools
  description: >-
    Histological grade is what the classification turns on, and in a 155-case series it was
    the only independent prognostic factor for overall survival on multivariate analysis -
    outperforming lymph node metastasis, angiolymphatic invasion, Ki67 index and p53 status,
    all of which looked prognostic on univariate testing.

    The grades run from acellular mucin, through low-grade mucinous carcinoma peritonei, to
    high-grade, to high-grade with signet ring cells. Roughly two thirds of cases are
    low-grade.
  evidence:
  - reference: PMID:31926211
    reference_title: "Pathological prognostic factors of pseudomyxoma peritonei: comprehensive clinicopathological analysis of 155 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      But Multivariate analysis identified only histologic grade was the independent
      prognostic factor for OS.
    explanation: >-
      The multivariate result that makes grade the dominant pathological variable.
  - reference: PMID:31926211
    reference_title: "Pathological prognostic factors of pseudomyxoma peritonei: comprehensive clinicopathological analysis of 155 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients included 63.2% (n = 98) low-grade mucinous carcinoma peritonei, 31.6%
      (n = 49) high-grade mucinous carcinoma peritonei and 5.2% (n = 8) high-grade mucinous
      carcinoma peritonei with signet ring cells.
    explanation: >-
      The grade distribution behind the proportions quoted in this entry.

genetic:

- name: KRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  association: >-
    Activating somatic KRAS mutations, predominantly at codon 12, are present in the large
    majority of PMP - 148 of 167 cases (89%) in the largest systematically sequenced series.
    They are somatic drivers in the appendiceal epithelium, not germline predisposition
    alleles.

    Unlike in colorectal cancer, KRAS status has not consistently predicted survival in PMP
    series, so its role here is causal rather than prognostic.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High frequencies of KRAS and GNAS mutations support the proposed role as driver
      mutations and as potential therapy targets.
    explanation: >-
      The driver claim for both genes, from the series that measured their frequency.

- name: GNAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  association: >-
    Activating somatic GNAS mutations at codon 201 are present in 139 of 167 cases (83%) in
    the same series, and co-occur with KRAS far more often than chance.

    GNAS is the mechanistically interesting driver: locking Gs on raises cAMP, and cAMP
    drives mucin secretion. A high GNAS mutation rate in a disease whose lethal agent is
    secreted mucin is not a coincidence, and it is the strongest argument that the
    hypersecretory phenotype is genetically driven rather than incidental.

    Its high frequency in PMP against a low frequency in colorectal adenocarcinoma also
    makes it useful for assigning appendiceal origin.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of KRAS and GNAS mutations was analyzed in tumor samples from 167
      patients with verified PMP using targeted DNA sequencing and/or droplet digital
      polymerase chain reaction.
    explanation: >-
      The cohort and assay behind the GNAS frequency quoted here.

- name: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: >-
    TP53 mutation is the grade-associated alteration rather than a universal driver. In a
    114-patient cohort stratified by predominant genomic alteration, half of TP53-mutant
    tumours were WHO grade 3, against 38% of triple-negative, 10% of RAS-mutant and 7% of
    GNAS-mutant tumours - so TP53 marks the aggressive end of a disease whose baseline
    genotype is KRAS and GNAS.
  evidence:
  - reference: PMID:39812318
    reference_title: "TP53 Alterations Are an Independent Adverse Prognostic Indicator in Pseudomyxoma Peritonei of Appendiceal Origin Following Cytoreductive Surgery and Intraperitoneal Chemotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty percent of TP53 -mut were WHO grade 3 compared with 38% triple-negative, 10%
      RAS -mut, and 7% GNAS -mut tumors
    explanation: >-
      The grade distribution across molecular groups. Quoted with the source's own irregular
      spacing around the gene names, which is a typesetting artefact of the cached record
      rather than the authors' usage.

progression:

- phase: Occult appendiceal phase
  notes: >-
    A mucinous neoplasm distends the appendix without peritoneal disease. Often silent, and
    sometimes found incidentally at appendicectomy - the one window in which the disease can
    be prevented rather than treated.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is commonly caused by ruptured appendiceal mucinous neoplasms seeding tumor cells
      and mucin into the peritoneal cavity.
    explanation: >-
      Establishes the appendiceal neoplasm as the antecedent lesion that must rupture for
      the peritoneal phase to begin.

- phase: Peritoneal accumulation phase
  notes: >-
    After perforation, mucin accumulates over years. Indolent in low-grade disease, which is
    why patients often present late with gross distension rather than early with pain.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pseudomyxoma peritonei (PMP) is a rare, progressive, but generally slow-growing
      abdominal cancer with an incidence rate of 3.2 people per million per year
    explanation: >-
      Characterises the tempo of this phase as progressive but slow-growing.

- phase: Mechanical decompensation
  notes: >-
    Sclerosed mucin encases the viscera, producing obstruction, adhesion and cachexia.
    Survival at this stage is grade-dependent: five-year overall survival runs from 100% for
    acellular mucin down to 20% for disease with signet ring cells.
  evidence:
  - reference: PMID:39327362
    reference_title: "Reclassification of Appendiceal Mucinous Neoplasms and Associated Pseudomyxoma Peritonei According to the Peritoneal Surface Oncology Group International Consensus: Clinicopathological Reflections of a Two-Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median OS was 13.8 years, and 5-year OS rates were 100%, 74.4%, 44.4%, and 20% for
      acellular mucin, low-grade PMP, high-grade PMP and PMP-SRC, respectively
    explanation: >-
      The grade-stratified survival figures quoted here.

diagnosis:

- name: Histopathological Grading by PSOGI Classification
  description: >-
    Grading is the diagnostic act that matters, because it is the only independent predictor
    of survival. The scheme separates acellular mucin, low-grade PMP, high-grade PMP and
    PMP with signet ring cells, and the survival separation between those groups is wide.

    Grade of the peritoneal disease is not always the grade of the primary: in 13% of a
    contemporary series the appendiceal neoplasm and its matching PMP were graded
    differently, so the peritoneal disease has to be graded on its own material.
  evidence:
  - reference: PMID:39327362
    reference_title: "Reclassification of Appendiceal Mucinous Neoplasms and Associated Pseudomyxoma Peritonei According to the Peritoneal Surface Oncology Group International Consensus: Clinicopathological Reflections of a Two-Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median OS was 13.8 years, and 5-year OS rates were 100%, 74.4%, 44.4%, and 20% for
      acellular mucin, low-grade PMP, high-grade PMP and PMP-SRC, respectively
    explanation: >-
      The survival separation between grades, which is what makes grading the decisive
      diagnostic step.
  - reference: PMID:31926211
    reference_title: "Pathological prognostic factors of pseudomyxoma peritonei: comprehensive clinicopathological analysis of 155 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      But Multivariate analysis identified only histologic grade was the independent
      prognostic factor for OS.
    explanation: >-
      Establishes grade as the only variable surviving multivariate adjustment.

- name: KRAS and GNAS Mutation Testing
  description: >-
    Molecular testing serves two purposes. It supports appendiceal origin, since the
    KRAS-plus-GNAS pattern is uncommon in colorectal adenocarcinoma. And it identifies
    targetable drivers as agents against them become available.

    There is a practical trap: peritoneal tumour samples have low cellularity, which is the
    main reason reported mutation frequencies have varied so widely. Testing the primary
    appendiceal tumour instead raises the detection rate.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of KRAS and GNAS mutations was analyzed in tumor samples from 167
      patients with verified PMP using targeted DNA sequencing and/or droplet digital
      polymerase chain reaction.
    explanation: >-
      The assay approach, including the sensitive digital PCR method used because of low
      tumour cellularity.

treatments:

- name: Cytoreductive Surgery
  therapeutic_modality: SURGERY
  description: >-
    Surgical removal of all visible tumour and mucin, typically with peritonectomy and
    resection of involved viscera. It is the definitive treatment, and it works because the
    disease sits on peritoneal surfaces rather than infiltrating through them.

    Completeness of cytoreduction is the operative variable that matters, which is why the
    procedure is centralised to high-volume units.
  treatment_term:
    preferred_term: cytoreductive surgery
    term:
      id: NCIT:C132068
      label: Cytoreductive Surgery
  target_mechanisms:
  - target: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
    description: >-
      Removes the accumulated mucin and the implanted epithelium producing it, addressing
      both the product and its source.
  evidence:
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cytoreductive surgery (CRS) combined with hyperthermic intraperitoneal chemotherapy
      (HIPEC) is the recommended treatment for PMP.
    explanation: >-
      Establishes the combined procedure as recommended treatment; the source for this and
      the HIPEC entry below.

- name: Hyperthermic Intraperitoneal Chemotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Heated chemotherapy perfused through the peritoneal cavity immediately after
    cytoreduction, to treat residual microscopic disease on surfaces that surgery cannot
    clear. Given regionally rather than systemically because the disease is confined to the
    peritoneal compartment.

    Recurrence remains frequent even after complete cytoreduction with HIPEC, which is what
    motivates the mucolytic approach below.
  treatment_term:
    preferred_term: hyperthermic intraperitoneal chemotherapy
    term:
      id: NCIT:C91835
      label: Hyperthermic Intraperitoneal Chemotherapy
  target_mechanisms:
  - target: Peritoneal Redistribution and Implantation
    description: >-
      Targets residual implanted epithelium left on peritoneal surfaces after cytoreduction.
  evidence:
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cytoreductive surgery (CRS) combined with hyperthermic intraperitoneal chemotherapy
      (HIPEC) is the recommended treatment for PMP.
    explanation: >-
      Names HIPEC as part of the recommended combined treatment.
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, recurrence is frequently observed even after CRS and HIPEC, presenting
      similar clinical manifestations.
    explanation: >-
      PARTIAL because it qualifies the treatment rather than supporting it: recurrence is
      frequent despite the recommended regimen.

- name: Mucolytic Therapy (investigational)
  therapeutic_modality: OTHER
  description: >-
    Dissolving mucin directly, rather than resecting it or killing the cells that make it.
    The rationale follows from this entry's central claim: if the secreted product is what
    kills, then degrading it is a rational target in its own right.

    Approaches under investigation act on mucin O-glycosylation - the glycan that carries
    most of the molecule's mass and all of its viscoelasticity - including inhibitors of the
    glycosyltransferases that build it and nucleotide-sugar analogues that starve them of
    substrate.

    Investigational. No clinical outcome data exist; the literature to date is review and
    preclinical.
  target_mechanisms:
  - target: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
    description: >-
      Acts on the accumulated mucin itself, which is the node this entry identifies as the
      cause of death.
  evidence:
  - reference: PMID:41947779
    reference_title: "Mucin O-Glycosylation and Mucolytic Therapies in Pseudomyxoma Peritonei: Literature Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Effective mucolytic therapy can greatly improve the efficacy of cytoreductive surgery
      + hyperthermic intraperitoneal chemotherapy, alleviate symptoms and improve prognosis
      for pseudomyxoma peritonei (PMP) patients.
    explanation: >-
      PARTIAL because the source states the expected benefit of effective mucolysis as a
      premise for review rather than reporting an achieved clinical result.
  - reference: PMID:41947779
    reference_title: "Mucin O-Glycosylation and Mucolytic Therapies in Pseudomyxoma Peritonei: Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main components of PMP mucus are highly O-glycosylated proteins called mucins.
    explanation: >-
      Establishes O-glycosylation as the property these approaches target.

discussions:

- discussion_id: gap_secretion_versus_proliferation_target
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#MUC2 Hypersecretion
  - treatments#Mucolytic Therapy (investigational)
  prompt: >-
    Would suppressing mucin secretion control this disease better than killing the cells
    that secrete it?
  rationale: >-
    The entry's mechanism says the lethal agent is the secreted product, and the driver
    genetics agree - GNAS mutation in 83% of cases acts through cAMP on precisely the
    secretory phenotype. Yet every established treatment targets cells: resect them, or
    perfuse them with cytotoxic drug. Recurrence after complete cytoreduction with HIPEC
    remains frequent.

    Nobody has tested whether pharmacologically suppressing secretion, as opposed to
    dissolving mucin already deposited, changes the course. The two are different
    interventions with different windows: mucolysis treats accumulated disease, secretion
    blockade would prevent accumulation, and only the second could plausibly be given long
    term after cytoreduction.

    The experiment is tractable because the pathway is known and druggable at several
    points, and because low-grade PMP is indolent enough that a secretion-suppressing agent
    would have time to show an effect.
  proposed_experiments:
  - experiment_id: pmp_secretion_blockade_vs_cytotoxicity
    name: cAMP-pathway secretion blockade versus cytotoxic control in GNAS-mutant PMP models
    description: >-
      In patient-derived GNAS-mutant PMP models, compare mucin output and disease
      accumulation under cAMP-pathway blockade against a cytotoxic comparator matched for
      effect on cell viability, separating suppression of secretion from killing of
      secreting cells.
    would_support:
    - pathophysiology#MUC2 Hypersecretion
    supporting_outcome:
    - >-
      Secretion blockade reduces mucin accumulation at doses that do not reduce viable
      tumour cell number, establishing secretion as an independently targetable step.
    refuting_outcome:
    - >-
      Mucin accumulation tracks tumour cell number regardless of pathway blockade, which
      would make secretion a read-out of tumour burden rather than a separate target and
      redirect effort back to cytoreduction.

- discussion_id: gap_grade_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Histopathological Grading by PSOGI Classification
  - histopathology#Mucinous Epithelium in Extracellular Mucin Pools
  prompt: >-
    When the appendiceal primary and the peritoneal disease are graded differently, which
    grade predicts outcome?
  rationale: >-
    Grade is the only independent predictor of survival, and in 13% of a contemporary series
    the primary neoplasm and its matching peritoneal disease did not carry the same grade.
    Those two facts together mean that in one case in eight the prognostic variable depends
    on which specimen was graded, and the literature does not say which one to use.

    It is a directly consequential gap: grade drives the decision to offer or withhold a
    major operation with substantial morbidity.
  proposed_experiments:
  - experiment_id: pmp_discordant_grade_outcome
    name: Outcome analysis of grade-discordant appendiceal and peritoneal specimens
    description: >-
      In a multi-centre cohort with both primary and peritoneal specimens graded
      independently, model overall survival against primary grade, peritoneal grade and the
      higher of the two, and compare their predictive performance in the discordant subset.
    would_support:
    - diagnosis#Histopathological Grading by PSOGI Classification
    supporting_outcome:
    - >-
      Peritoneal grade predicts survival better than primary grade in discordant cases,
      which would make grading of peritoneal material the standard and settle the question.
    refuting_outcome:
    - >-
      Neither specimen predicts better than the higher of the two, which would argue for
      taking the worst grade found on any material and would simplify the decision rule.

notes: >-
  Scope. Pseudomyxoma peritonei is a syndrome defined by peritoneal mucinous disease, not by
  a single histological entity, and this entry treats it that way. Its antecedent lesion -
  the appendiceal mucinous neoplasm - is a distinct concept and is named as a parent rather
  than folded in.

  Ovarian origin. Older literature described primary ovarian mucinous tumours as a common
  source of PMP. That has been revised: most ovarian involvement is secondary seeding from
  an appendiceal primary, distinguishable by immunohistochemistry. This entry curates
  ovarian involvement as a site of implantation, and the historical misattribution is
  flagged because it is still the commonest way this disease is misclassified.

  Percentages in prose. The KRAS and GNAS frequencies (89% and 83% of 167 cases) appear in
  this entry's descriptions but not as quoted snippets. The sentence carrying them in the
  cached record uses narrow no-break spaces before each percent sign, so quoting it exactly
  would embed invisible characters in the KB. The cohort and the driver conclusion are
  quoted instead, and the numbers are reported in prose from the same sentence.

  Terminology. The disease has accumulated several naming systems - DPAM and PMCA in the
  older Ronnett scheme, low-grade and high-grade mucinous carcinoma peritonei in the WHO and
  PSOGI schemes. Grade names in this entry follow the source being cited at that point rather
  than being harmonised, because the survival figures are only meaningful against the scheme
  that generated them.


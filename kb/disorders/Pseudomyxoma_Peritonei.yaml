pathophysiology:

- name: KRAS and GNAS Driver Mutations in Appendiceal Mucinous Epithelium
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a somatic driver pair in the epithelium of an appendiceal
    mucinous neoplasm. In the largest systematically sequenced series - 167 verified PMP
    patients analysed by targeted sequencing and droplet digital PCR - KRAS was mutated in
    148 cases and GNAS in 139, that is 89% and 83%.

    Two features make this genotype notable. It is far more consistent than most solid
    tumours manage, which is what supports treating these as true drivers rather than
    passengers. And it differs sharply from colorectal adenocarcinoma, where GNAS mutation
    is uncommon - so the molecular profile distinguishes an appendiceal origin from a
    colorectal one, which is a question the pathology often has to answer.
  genes:
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  - preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  downstream:
  - target: Constitutive Ras-MAPK and Gs-cAMP Signalling
    causal_link_type: DIRECT
    description: >-
      Both drivers are activating: hotspot KRAS codon 12 substitutions and GNAS codon 201
      substitutions each lock their pathway on.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of KRAS and GNAS mutations was analyzed in tumor samples from 167
      patients with verified PMP using targeted DNA sequencing and/or droplet digital
      polymerase chain reaction.
    explanation: >-
      The cohort and the methods behind the frequency figures quoted in this node's
      description.
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High frequencies of KRAS and GNAS mutations support the proposed role as driver
      mutations and as potential therapy targets.
    explanation: >-
      The authors' own reading of those frequencies as establishing driver status, which is
      what this node asserts.

- name: Constitutive Ras-MAPK and Gs-cAMP Signalling
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    The two drivers act on different pathways and converge on the same cell. Mutant KRAS
    holds Ras-MAPK signalling on, supporting proliferation and survival of the neoplastic
    epithelium. Mutant GNAS locks the stimulatory G protein on, raising cAMP.

    The cAMP arm is the one that matters for what this disease does. Elevated cAMP is a
    recognised driver of mucin transcription and secretion, so the second driver acts
    directly on the hypersecretory phenotype rather than simply adding proliferative drive -
    which is the mechanistic reason a mostly low-grade neoplasm produces a lethal syndrome.
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: MUC2 Hypersecretion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The known intermediate is cAMP-driven upregulation of mucin gene expression. Typed
      indirect because the transcriptional step between raised cAMP and the measured mucin
      output has not been mapped in PMP tissue specifically.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High frequencies of KRAS and GNAS mutations support the proposed role as driver
      mutations and as potential therapy targets.
    explanation: >-
      PARTIAL because it establishes that these are the drivers without demonstrating the
      signalling states this node names; the pathway consequences are inferred from the
      known biochemistry of the hotspot alleles.

- name: MUC2 Hypersecretion
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The neoplastic epithelium secretes mucin massively, and MUC2 is the dominant species.
    MUC2 is extraordinarily glycosylated - glycan accounts for 80% to 90% of its dry weight -
    and it is that glycan mass, not the protein backbone, that gives the mucus its volume
    and its viscoelasticity.

    This node is the entry's pivot. Everything upstream is ordinary neoplasia; everything
    downstream is a consequence of the secreted product rather than of the cells that
    secrete it.
  cell_types:
  - preferred_term: mucin-secreting neoplastic epithelial cell
    term:
      id: CL:0000160
      label: goblet cell
  biological_processes:
  - preferred_term: mucus secretion
    term:
      id: GO:0070254
      label: mucus secretion
    modifier: INCREASED
  - preferred_term: protein O-linked glycosylation
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  downstream:
  - target: Appendiceal Distension and Perforation
    causal_link_type: DIRECT
    description: >-
      Mucin accumulating in an obstructed appendiceal lumen raises intraluminal pressure
      until the wall gives way.
  - target: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
    causal_link_type: DIRECT
    description: >-
      Once the epithelium is on the peritoneal surfaces it continues to secrete, so
      hypersecretion drives the peritoneal phase directly as well as causing the escape
      that starts it.
  evidence:
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mucin 2 (MUC2) is the main type of mucin in PMP and plays a key role in the
      progressive sclerosis of mucus.
    explanation: >-
      Identifies MUC2 as the dominant mucin and links it to the sclerosis that makes the
      accumulation dangerous.
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The results show that MUC2 is a highly glycosylated protein, with glycan accounts for
      80% to 90% of the dry weight.
    explanation: >-
      The glycan fraction, which is why O-glycosylation is bound here and why the
      glycosylation machinery is a therapeutic target rather than the protein itself.
  - reference: PMID:41947779
    reference_title: "Mucin O-Glycosylation and Mucolytic Therapies in Pseudomyxoma Peritonei: Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Represented by mucin2 (MUC2), mucins are the source of mucus viscoelasticity.
    explanation: >-
      Ties MUC2 specifically to the physical property that produces the downstream
      mechanical disease.

- name: Appendiceal Distension and Perforation
  role: mechanism
  biological_scale: TISSUE
  description: >-
    The mechanical event that converts a confined neoplasm into a peritoneal disease. Mucin
    distends the obstructed appendix until it perforates, releasing both mucin and viable
    mucin-secreting cells into the peritoneal cavity.

    Perforation is the single step that determines whether a patient has an appendiceal
    neoplasm or this disease. It is also the only point at which the disease is
    straightforwardly preventable, by resecting the neoplasm intact beforehand.
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  downstream:
  - target: Peritoneal Redistribution and Implantation
    causal_link_type: DIRECT
    description: >-
      Perforation delivers the cells to the peritoneal cavity, where fluid dynamics take
      over.
  evidence:
  - reference: PMID:41868810
    reference_title: "High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores opportunities for targeted therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is commonly caused by ruptured appendiceal mucinous neoplasms seeding tumor cells
      and mucin into the peritoneal cavity.
    explanation: >-
      Names rupture as the causal event and both of the things it releases.
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pseudomyxoma peritonei (PMP) is a clinical syndrome of malignant tumors, which is
      caused by a primary mucinous tumor that breaks through the primary organ, following
      spread and implantation in the peritoneum.
    explanation: >-
      The same sequence stated as the definition of the syndrome: breach of the primary
      organ, then spread, then implantation.

- name: Peritoneal Redistribution and Implantation
  role: mechanism
  biological_scale: TISSUE
  description: >-
    Released cells are not invasive in the ordinary sense. They are carried passively on
    peritoneal fluid currents and settle where fluid is resorbed or where it pools - the
    greater omentum, the paracolic gutters, the pelvis, the undersurface of the diaphragm
    and, in women, the ovaries. Surfaces swept by peristalsis, particularly the small bowel
    serosa, are relatively spared.

    That distribution is the clinical signature of the disease and the reason cytoreductive
    surgery is feasible at all: the deposits sit on surfaces rather than infiltrating
    through them.

    Ovarian involvement is common enough to be a diagnostic trap - two thirds of women in a
    contemporary series - and historically led to these tumours being called primary
    ovarian.
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  - preferred_term: omentum
    term:
      id: UBERON:0003688
      label: omentum
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
    causal_link_type: DIRECT
    description: >-
      Implanted epithelium continues to secrete at its new sites.
  evidence:
  - reference: PMID:39327362
    reference_title: "Reclassification of Appendiceal Mucinous Neoplasms and Associated Pseudomyxoma Peritonei According to the Peritoneal Surface Oncology Group International Consensus: Clinicopathological Reflections of a Two-Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ovarian involvement was observed in 43/65 females (66.2%).
    explanation: >-
      Quantifies ovarian involvement in a consecutive series, supporting both the
      distribution claim and the diagnostic trap described here.

- name: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    Mucin accumulates faster than the peritoneum can clear it, and it does not stay fluid.
    Progressive sclerosis converts soft mucus into a stiff, adherent mass that encases
    viscera and fixes them to one another and to the abdominal wall.

    The primary literature is explicit that this - not metastasis, not cachexia from tumour
    burden - is the key pathological mechanism and the main cause of death. It is the
    justification for treating mucin itself as a therapeutic target.
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  downstream:
  - target: Mechanical Visceral Compromise
    causal_link_type: DIRECT
    description: >-
      A stiff, expanding intraperitoneal mass compresses and tethers hollow viscera.
  evidence:
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mucus sclerosis is the key pathological mechanism in the development of PMP, and
      the main cause of death.
    explanation: >-
      The central claim of this entry, stated by the source in exactly those terms.
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Excessive mucus secretion is also the main cause of death.
    explanation: >-
      Restates the same conclusion about the secreted product rather than the tumour cells.

- name: Mechanical Visceral Compromise
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Progressive abdominal distension, intractable pain, intestinal
    obstruction, organ adhesion and eventually cachexia, as the encased bowel can neither
    move nor absorb.
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  evidence:
  - reference: PMID:34703312
    reference_title: "The Biological Synthesis and the Function of Mucin 2 in Pseudomyxoma Peritonei."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Excessive mucus secretion is the most prominent feature of pseudomyxoma peritonei
      (PMP), which often leads to significant increase in abdominal circumference,
      intractable abdominal pain, progressive intestinal obstruction, abdominal organ
      adhesions, and cachexia.
    explanation: >-
      Enumerates the mechanical consequences this node collects, and attributes them to the
      secreted mucus.


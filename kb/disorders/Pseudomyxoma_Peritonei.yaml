name: Pseudomyxoma Peritonei
creation_date: "2026-08-26T16:00:00Z"
category: Neoplastic
disease_term:
  preferred_term: pseudomyxoma peritonei
  term:
    id: MONDO:0017048
    label: pseudomyxoma peritonei
synonyms:
- PMP
- jelly belly
- disseminated peritoneal adenomucinosis
- peritoneal mucinous carcinomatosis
description: >-
  A rare peritoneal syndrome in which a mucinous neoplasm - almost always of the appendix -
  perforates and redistributes mucin-secreting epithelium across the peritoneal surfaces,
  which then accumulate mucin progressively until abdominal organs are mechanically
  compromised. Incidence is around 3.2 per million per year.

  Three things distinguish it from the way solid tumours usually behave, and the entry is
  built around them.

  The lethal agent is a secreted product, not the cells. Patients are killed by mucin.
  Tumour cell burden can be modest while litres of mucus accumulate, stiffen, and encase
  the viscera; the mucus sclerosis is described in the primary literature as the key
  pathological mechanism and the main cause of death. Curating this as a disease of
  hypersecretion rather than of proliferation is the entry's organising decision.

  Its driver genetics are unusually clean and unusually consistent. KRAS and GNAS are
  mutated in the large majority of cases - 89% and 83% respectively in the largest
  systematically sequenced series - and the pair co-occurs far more often than chance. The
  GNAS arm is mechanistically pointed: constitutive Gs-cAMP signalling is a recognised
  driver of mucin hypersecretion, so the second driver acts on precisely the process that
  makes the disease lethal.

  It spreads by fluid mechanics rather than by invasion. Cells are carried on peritoneal
  fluid currents and settle where the fluid is resorbed or pools, which is why omentum,
  paracolic gutters and ovaries are involved while the bowel serosa is often spared. That
  is also why the treatment is a surgical and regional-chemotherapy problem rather than a
  systemic one.

parents:
- Appendiceal Mucinous Neoplasm
- Peritoneal Surface Malignancy


  - reference: PMID:31298040
    reference_title: "Multimodal imaging of pre-Descemet corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation and structural anomalies found in isolated

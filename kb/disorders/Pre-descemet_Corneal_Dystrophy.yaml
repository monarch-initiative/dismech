    explanation: >-
      The defining cellular finding, present in all eight corneas of a
      four-patient series, including the extracellular component.
  - reference: PMID:28302098
    reference_title: "In vivo confocal microscopy of pre-Descemet corneal dystrophy associated with X-linked ichthyosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IVCM revealed regular distributed hyperreflective particles inside the
      enlarged and activated keratocytes in the posterior stroma.
    explanation: >-
      The same intracellular posterior-keratocyte lesion in the STS-deficient
      arm, which is what makes the two arms clinically indistinguishable.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal cornea except for enlarged keratocytes in the posterior stroma

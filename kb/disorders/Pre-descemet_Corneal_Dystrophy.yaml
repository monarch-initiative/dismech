- name: Cholesterol Sulfate Accumulation
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  subtypes:
  - XLI-Associated Deep Corneal Deposits
  description: >-
    Steroid sulfatase hydrolyses cholesterol sulfate, so loss of the enzyme
    allows the sulfated sterol to accumulate. This is firmly established in the
    skin, where excess cholesterol sulfate in the stratum corneum is what
    produces the barrier dysfunction and scaling of X-linked ichthyosis, and it
    is the natural candidate for the corneal deposit as well.

    It is curated as PROVISIONAL because that last step is an inference, and
    because there is a competing candidate. No study has chemically identified
    the material inside the posterior keratocytes of an STS-deficient cornea;
    what has been shown is that the deposit is there, that it is intracellular,
    and that the patient lacks steroid sulfatase. Meanwhile the ultrastructural
    material characterised in isolated PDCD is a lipofuscin-like lipoprotein,
    not a sulfated sterol. Whether the two arms share a stored substance or
    merely a location is unresolved, and the knowledge-gap discussion on this
    entry keeps that open rather than assuming it.
  chemical_entities:
  - preferred_term: cholesterol sulfate
    modifier: INCREASED
    term:
      id: CHEBI:41321
      label: cholesterol sulfate
  evidence:
  - reference: PMID:39086014
    reference_title: "Revisiting X-linked congenital ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STS deficiency causes an abnormal cholesterol sulfate (CS) accumulation in
      the stratum corneum (SC).
    explanation: >-
      Establishes substrate accumulation as the direct consequence of enzyme
      loss - in skin, the tissue where it has actually been measured.
  - reference: PMID:39086014
    reference_title: "Revisiting X-linked congenital ichthyosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Excess CS induces epidermal permeability barrier dysfunction and scaling
      abnormalities.
    explanation: >-
      Shows the downstream consequence of the accumulated substrate is
      characterised in epidermis, not in cornea - the reason this node is
      provisional for the eye.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      inclusions of a lipofuscin-like lipoprotein consistent with a degenerative
      process are seen in PDCD
    explanation: >-
      The competing substrate identity characterised in isolated PDCD, which is
      why a shared cholesterol-sulfate deposit cannot be assumed across both
      arms.
  downstream:
  - target: Intracellular Deposition in Posterior Keratocytes
    causal_link_type: DIRECT
    description: >-
      Accumulated sulfated sterol is the proposed identity of the
      hyperreflective material seen within posterior keratocytes in this arm;
      the link is inferred from skin, not demonstrated in cornea.
- name: Intracellular Deposition in Posterior Keratocytes
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The shared cellular lesion, and the observation that most sharply separates
    this entity from the classical stromal dystrophies. In vivo confocal
    microscopy shows enlarged, hyperreflective keratocytes in the posterior
    stroma carrying intracellular dots, with activated keratocytes as far
    forward as the very anterior stroma; the same is seen in the STS-deficient
    arm, where hyperreflective particles sit inside enlarged and activated
    posterior keratocytes. The stromal dystrophies in the same MONDO branch -
    macular, Schnyder, congenital stromal, the TGFBI forms - deposit abnormal
    material in the extracellular matrix and progressively opacify the cornea.
    Here the cell is the affected compartment, the cells are enlarged and
    activated rather than lost, and the epithelium and endothelium are spared.

    The extracellular contribution is not nil, and the entry does not pretend
    otherwise: diffuse small extracellular stromal deposits are described in
    vivo, even though transmission electron microscopy of PDCD reports none.
    That is one of the inconsistencies IC3D flags in the histopathology.
  cell_types:
  - preferred_term: Posterior stromal keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  locations:
  - preferred_term: Corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea

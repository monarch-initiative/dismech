- name: Deep Stromal Punctate Opacification Anterior to Descemet Membrane
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The tissue-level endpoint and the diagnostic finding: focal, fine,
    polymorphic grey opacities - central, annular or diffuse - confined to the
    deep stroma immediately anterior to Descemet membrane, bilaterally.
    Cross-sectional imaging resolves the same thing as a hyperreflective line
    running limbus to limbus just anterior to Descemet's membrane, and
    Scheimpflug tomography shows a second, posterior light-scattering peak that
    does not belong in a normal cornea.

    The name is a slight misdescription that is worth stating explicitly: the
    opacities are visible pre-Descemet, but multimodal imaging finds fine
    hyperreflective particles through the posterior, mid and anterior stroma.
    The disorder affects the whole stroma; the pre-Descemet location is where
    the damage is maximal, not where it is confined.
  locations:
  - preferred_term: Descemet's membrane
    term:
      id: UBERON:0004367
      label: Descemet's membrane
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal, fine, polymorphic gray opacities that may be central, annular, or
      diffuse are visible in the deep stroma immediately anterior to Descemet
      membrane
    explanation: >-
      The reference description of the defining lesion and its variants.
  - reference: PMID:31298040
    reference_title: "Multimodal imaging of pre-Descemet corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spectral domain optical coherence tomography scans showed a
      hyperreflective line anterior to Descemet's membrane running from limbus

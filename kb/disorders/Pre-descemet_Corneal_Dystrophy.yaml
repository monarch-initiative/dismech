- name: Loss of Steroid Sulfatase Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  subtypes:
  - XLI-Associated Deep Corneal Deposits
  description: >-
    The trigger of the genetically characterised arm. STS at Xp22.31 encodes
    steroid sulfatase, the enzyme that hydrolyses cholesterol sulfate,
    dehydroepiandrosterone sulfate and estrone sulfate. Three classes of lesion
    have been found in families with pre-Descemet deposits and X-linked
    ichthyosis - point mutations, partial deletions removing some of the ten
    coding exons, and complete deletion of the locus, in one case a 4.4 Mb
    hemizygous deletion taking three further genes with it. The informative
    observation is that the corneal phenotype does not differ between these
    classes, which is the argument that all of them converge on loss of enzyme
    function rather than on some deletion-size-dependent contiguous-gene effect.
  genes:
  - preferred_term: STS
    term:
      id: hgnc:11425
      label: STS
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    description: >-
      Hemizygous point mutations, partial deletions (exons 1-7 reported) and
      complete deletions of STS at Xp22.31 in affected males.
  molecular_functions:

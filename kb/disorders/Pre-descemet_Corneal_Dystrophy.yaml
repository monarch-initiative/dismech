      beneath Bowman's layer.
    explanation: >-
      Confirms the depth-restricted lesion on cross-sectional imaging and
      records a second anterior line, evidence that the process is not confined
      posteriorly.
  - reference: PMID:31298040
    reference_title: "Multimodal imaging of pre-Descemet corneal dystrophy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multimodal imaging of cornea reveals that the disorder affects the whole
      stroma
    explanation: >-
      Directly qualifies the "pre-Descemet" name: the visible opacities are
      deep, but the process is panstromal.
  - reference: PMID:32482962
    reference_title: "Multimodal Imaging of Pre-Descemet Corneal Dystrophy Associated With X-Linked Ichthyosis and Deletion of the STS Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scheimpflug tomography revealed a bimodal peak light scattering.
    explanation: >-
      Provides an objective optical measurement of the extra posterior
      scattering layer.
  downstream:
  - target: Visually Silent Corneal Finding
    causal_link_type: DIRECT
    description: >-
      Because the opacities are fine, deep and non-confluent they do not degrade
      the retinal image, so the finding presents as a sign rather than as visual
      loss.
- name: Visually Silent Corneal Finding
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    The organism-level outcome, unusual in being an absence of disability.
    Vision is usually unaffected and patients are typically asymptomatic, so
    PDCD requires no treatment; IC3D lists it among the dystrophies that are
    typically asymptomatic and need none. The qualifier "usually" is theirs and
    is kept here, because one adult in a recently described pedigree did
    complain of glare.

    The clinical value of the finding is therefore diagnostic rather than
    therapeutic, and it runs in both directions: pre-Descemet opacities in a
    male - especially a child, since the XLI-associated deposits appear in the
    first decade - are a reason to examine the skin and consider copy-number
    analysis of STS, and known ichthyosis is a reason to look at the cornea.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vision is usually unaffected, and patients are typically asymptomatic. One
      adult member of a recently described pedigree complained of glare.
    explanation: >-
      States the visual outcome together with the single reported exception.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several corneal dystrophies including FCD, PACD, CCDF, and PDCD are
      typically asymptomatic and do not require treatment.
    explanation: >-
      Establishes that no treatment is indicated, which is why this entry
      curates none.
  - reference: PMID:32482962
    reference_title: "Multimodal Imaging of Pre-Descemet Corneal Dystrophy Associated With X-Linked Ichthyosis and Deletion of the STS Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report demonstrates that PDCD-associated XLI may present in children
      and that the diagnosis may be confirmed through multimodal imaging in
      conjunction with genetic analysis.
    explanation: >-
      Establishes the diagnostic value of the corneal sign, including its
      presence in childhood.
  - reference: PMID:23807007
    reference_title: "Pre-Descemet corneal dystrophy and X-linked ichthyosis associated with deletion of Xp22.31 containing the STS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of a microdeletion within Xp22.3 containing STS with
      aCGH in an individual with suspected pre-Descemet corneal dystrophy and
      X-linked ichthyosis demonstrates the clinical utility of copy number
      variation analysis in confirming a presumptive clinical diagnosis.
    explanation: >-
      States the clinical use of the finding: it converts a presumptive
      diagnosis into a confirmed one via copy-number analysis.
phenotypes:
- category: Ophthalmologic
  name: Punctate Posterior Stromal Corneal Opacities
  description: >-
    Numerous fine, polymorphic, punctate opacities in the deep corneal stroma
    immediately anterior to Descemet membrane, bilateral. This is the defining
    finding of the entity; its depth restriction is what makes the diagnosis.
  phenotype_term:
    preferred_term: Punctate opacification of the cornea
    term:
      id: HP:0007856
      label: Punctate opacification of the cornea
  diagnostic: true
  evidence:
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The slit-lamp examination of three affected men (two of whom were
      brothers) from two families revealed bilateral punctate posterior corneal
      stromal opacities anterior to the Descemet membrane.
    explanation: >-
      Documents the bilateral punctate posterior stromal opacities in three
      genetically confirmed affected men.
  - reference: PMID:23807007
    reference_title: "Pre-Descemet corneal dystrophy and X-linked ichthyosis associated with deletion of Xp22.31 containing the STS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The slit-lamp examination revealed punctate opacities in the posterior
      corneal stroma of each eye.
    explanation: >-
      Independent documentation of the same bilateral finding.
- category: Ophthalmologic
  name: Abnormal Posterior Corneal Stroma
  description: >-
    The structural abnormality underlying the visible opacities: enlarged,
    activated keratocytes in the posterior stroma laden with hyperreflective
    intracellular particles.
  phenotype_term:
    preferred_term: Abnormal corneal stroma morphology
    term:
      id: HP:0011492
      label: Abnormal corneal stroma morphology
  evidence:
  - reference: PMID:28302098
    reference_title: "In vivo confocal microscopy of pre-Descemet corneal dystrophy associated with X-linked ichthyosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Slit-lamp biomicroscopy showed the presence of tiny and pleomorphic
      opacities in the posterior stroma immediately anterior to Descemet
      membrane bilaterally.
    explanation: >-
      Documents the abnormal posterior stromal morphology on which the confocal
      findings were made.
- category: Dermatologic
  name: Ichthyosis
  description: >-
    Dry, coarse, scaling skin, most marked on the extensor surfaces of the
    limbs. In the XLI-associated subtype this is not a comorbidity but the same
    disorder seen in a second organ, and it is what makes the corneal finding
    diagnostically actionable.
  subtype: XLI-Associated Deep Corneal Deposits
  phenotype_term:
    preferred_term: Ichthyosis
    term:
      id: HP:0008064
      label: Ichthyosis
  evidence:
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cutaneous examination demonstrated dry, coarse, scaly ichthyotic changes
      characteristic of XLI in all individuals.
    explanation: >-
      Documents the ichthyotic skin phenotype in every affected individual of
      the two families.
  - reference: PMID:28302098
    reference_title: "In vivo confocal microscopy of pre-Descemet corneal dystrophy associated with X-linked ichthyosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dermatological examination revealed that the skin over the patient's
      entire body was dry and coarse, with thickening and scaling of the skin in
      the extensor side of the extremities.
    explanation: >-
      Records the distribution of the ichthyotic changes in a PDCD patient.
- category: Ophthalmologic
  name: Glare
  description: >-
    Vision is usually unaffected in this entity, but not invariably: one adult
    member of a recently described pedigree complained of glare. Recorded
    because "asymptomatic" is the entity's defining clinical claim, and a single
    documented exception to it is worth carrying rather than rounding away.
  phenotype_term:
    preferred_term: Glare
  notes: >-
    Left unbound deliberately. HPO has no term for glare - light scatter
    degrading image quality - and the nearest candidate, Photophobia
    (HP:0000613), is defined as "Excessive sensitivity to light with the
    sensation of discomfort or pain in the eyes due to exposure to bright
    light", which is a different complaint from glare produced by a
    light-scattering cornea. `sqlite:obo:hp` was searched for "glare" and for
    the Photophobia and abnormal-visual-function neighbourhoods; no suitable
    term exists. `frequency` is likewise omitted: the source describes a single
    adult in one pedigree, which is below the resolution of any FrequencyEnum
    band.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vision is usually unaffected, and patients are typically asymptomatic. One
      adult member of a recently described pedigree complained of glare.
    explanation: >-
      Records the single reported symptomatic individual against the general
      statement that patients are asymptomatic; the VERY_RARE band reflects one
      affected adult in one pedigree.
histopathology:
- name: Enlarged Posterior Keratocytes with Intracytoplasmic Lipid-Like Inclusions
  description: >-
    Light microscopy of a PDCD cornea is normal apart from the posterior
    keratocytes, which are enlarged and contain vacuoles and intracytoplasmic
    inclusions of lipid-like material. The negative half of that description is
    as informative as the positive half: epithelium, Bowman layer, Descemet
    membrane and endothelium are unremarkable, so the lesion is a keratocyte
    lesion and not a corneal one in general.
  diagnostic: true
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Normal cornea except for enlarged keratocytes in the posterior stroma
      containing vacuoles and intracytoplasmic inclusions of lipid-like
      material.
    explanation: >-
      The reference light-microscopic description of PDCD.
- name: Membrane-Bound Vacuoles with Lipofuscin-Like Lipoprotein on Electron Microscopy
  description: >-
    Transmission electron microscopy resolves the vacuoles as membrane-bound
    structures containing electron-dense material with the appearance of
    secondary lysosomes, plus inclusions of a lipofuscin-like lipoprotein - a
    pattern the reporting authors read as degenerative. No extracellular
    deposits are seen. That is the ultrastructural point on which PDCD parts
    company with the classical stromal dystrophies, every one of which is
    defined by extracellular accumulation.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Membrane-bound intracellular vacuoles containing electron-dense material
      suggestive of secondary lysosomes and inclusions of a lipofuscin-like
      lipoprotein consistent with a degenerative process are seen in PDCD. No
      extracellular deposits are noted.
    explanation: >-
      The ultrastructural description, including the absence of extracellular
      deposit.
- name: Inconsistent Histopathology Across Reported Cases
  description: >-
    Recorded as a finding in its own right because it constrains every other
    histopathological claim on this entry. IC3D states that the
    histopathological studies of PDCD are not consistent, which is part of why
    the entity sits in category 4 and why the ultrastructural mechanism above is
    curated as provisional rather than established.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathologic studies of PDCD are not consistent.
    explanation: >-
      The classifying committee's own assessment of the reliability of the
      histopathology.
imaging_findings:
- name: Pre-Descemet Hyperreflective Line on OCT
  modality: OCT
  description: >-
    Spectral-domain OCT shows a hyperreflective line immediately anterior to
    Descemet's membrane running limbus to limbus, with a second, thinner line
    beneath Bowman's layer and fine hyperreflective particles distributed
    through the posterior, mid and anterior stroma.
  evidence:
  - reference: PMID:31298040
    reference_title: "Multimodal imaging of pre-Descemet corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fine hyperreflective particles were observed in the posterior, mid, and
      anterior stroma on optical coherence tomography scans.
    explanation: >-
      Documents the panstromal distribution of particles on OCT, beyond the
      pre-Descemet line that names the entity.
  - reference: PMID:32482962
    reference_title: "Multimodal Imaging of Pre-Descemet Corneal Dystrophy Associated With X-Linked Ichthyosis and Deletion of the STS Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A pre-Descemet hyper-reflective line, consistent with these opacities, was
      seen with anterior segment optical coherence tomography.
    explanation: >-
      Independent documentation of the pre-Descemet line in the STS-deficient
      arm.
differential_diagnoses:
- name: Cornea farinata
  description: >-
    An age-related degeneration producing many fine, dust-like grey-brown to
    white opacities bilaterally in the posterior stroma near Descemet membrane,
    best seen on retroillumination. IC3D includes it in the same template as
    PDCD, and the distinction from isolated PDCD is not sharp - the IC3D text
    treats "cornea farinata" as a name applied to the same finding.
  distinguishing_features:
  - >-
      Opacities are finer and more dust-like than those of PDCD, and are best seen
      on retroillumination; confocal shows highly reflective particles in the
      cytoplasm of some keratocytes but only in the deep stroma, whereas in PDCD
      hyperreflective inclusions are both intracellular and extracellular.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the degenerative condition, cornea farinata, many fine, dust-like
      gray-brown to white opacities are best seen on retroillumination and are
      located bilaterally in the posterior stroma near Descemet membrane.
    explanation: >-
      Describes the appearance that has to be distinguished from PDCD.
- name: Punctiform and polychromatic pre-Descemet corneal dystrophy (PPPCD)
  description: >-
    A separate entity, IC3D category 1, autosomal dominant, caused by PRDX3
    variants at 10q26.11, with its own MONDO term (MONDO:0859248) and OMIM entry
    (#619871). It occupies the same corneal layer as PDCD and is the single most
    likely thing to be confused with it. Nothing about PRDX3 is curated on this
    entry.
  distinguishing_features:
  - >-
      PPPCD deposits are polychromatic, larger and more punctate, and more uniform
      within an otherwise normal cornea; onset can be as young as age 3 against
      PDCD's usual onset after 30; PPPCD is non-progressive or mildly progressive
      where other forms of PDCD progress; and PPPCD has an identified gene and
      autosomal dominant pedigrees where PDCD has neither.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In PPPCD, the pre-Descemet deposits are more uniform and polychromatic
      within the otherwise normal cornea.
    explanation: >-
      Gives the phenotypic distinction between PPPCD and PDCD.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPPCD is nonprogressive or possibly shows mild progression. Other forms of
      PDCD show progression.
    explanation: >-
      Gives the progression distinction between the two entities.
- name: Similar deep opacities in other ocular and systemic disease
  description: >-
    Deep pre-Descemet opacities are not specific to this entity. IC3D notes
    similar opacities in pseudoxanthoma elasticum, keratoconus, posterior
    polymorphous corneal dystrophy, epithelial basement membrane dystrophy and
    central cloudy dystrophy of Francois. The finding is therefore a starting
    point for a differential rather than a diagnosis on its own.
  distinguishing_features:
  - >-
      Each of these carries its own additional corneal or systemic findings;
      isolated PDCD is a diagnosis of exclusion once they are absent.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar opacities have been noted in association with other ocular and
      systemic diseases such as pseudoxanthoma elasticum, keratoconus, posterior
      polymorphous corneal dystrophy (PPCD), EBMD, and central cloudy dystrophy
      of François (CCDF).
    explanation: >-
      Enumerates the conditions in which the same corneal appearance occurs.
progression:
- phase: Onset
  subtype: Isolated PDCD
  notes: >-
    Isolated PDCD usually appears after the age of 30, which is one of the
    practical discriminators from the XLI-associated deposits (first decade) and
    from PPPCD (reported as young as 3).
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Usually after age 30 years; although PPPCD has been found in children as
      young as age 3 years.
    explanation: >-
      Gives the age of onset for this entity, with the contrast to PPPCD.
- phase: Onset
  subtype: XLI-Associated Deep Corneal Deposits
  notes: >-
    The deep corneal deposits of X-linked ichthyosis have been described in the
    first decade of life, and a genetically confirmed case has been reported in
    an 11-year-old boy - so an early-onset pre-Descemet finding should prompt a
    skin examination rather than a diagnosis of isolated PDCD.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been described in the first decade of life.
    explanation: >-
      Gives the age of onset of the STS-associated arm.
genetic:
- name: STS
  gene_term:
    preferred_term: STS
    term:
      id: hgnc:11425
      label: STS
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  subtype: XLI-Associated Deep Corneal Deposits
  notes: >-
    STS (Xp22.3) encodes steroid sulfatase. It is the causative gene of X-linked
    ichthyosis, and every genetically characterised PDCD family reported to date
    carries an STS lesion. Three allele classes have been described in PDCD
    specifically - point mutations, partial deletion of the coding exons (exons
    1-7 in one family of two brothers), and complete deletion of the locus,
    including a 4389 kbp hemizygous deletion that removed four genes. The
    phenotype does not differ between these classes, which argues that all act
    through loss of enzyme function rather than through the extra genes a large
    deletion removes. Note the scope limit: STS is causative for the
    XLI-associated arm only. Isolated PDCD has no identified gene, and IC3D
    places it in category 4 for that reason.
  evidence:
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pre-Descemet corneal dystrophy (PDCD) with X-linked ichthyosis (XLI) is
      associated with mutations in or deletions of the steroid sulfatase gene
      (STS).
    explanation: >-
      States the gene-disease association for the XLI-associated arm.
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As only three cases of genetically confirmed PDCD associated with XLI have
      been reported, we sought to expand our understanding of the genetic basis
      of PDCD by screening STS in two previously unreported families.
    explanation: >-
      Records how few genetically confirmed cases existed, which bounds the
      strength of the gene-disease claim.
  - reference: PMID:32482962
    reference_title: "Multimodal Imaging of Pre-Descemet Corneal Dystrophy Associated With X-Linked Ichthyosis and Deletion of the STS Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy number analysis identified a 4389 kbp hemizygous deletion on the X
      chromosome (chr. X: 6,540,898-8,167,604), resulting in the deletion of 4
      genes, including the known locus of XLI, the STS gene.
    explanation: >-
      Documents a large contiguous deletion encompassing STS in a PDCD patient.
diagnosis:
- name: Slit-Lamp Biomicroscopy
  description: >-
    The primary diagnostic examination. Depth is what matters: fine punctate
    opacities confined to the stroma immediately anterior to Descemet membrane,
    bilaterally, distinguish PDCD from opacities at any other corneal level.
  evidence:
  - reference: PMID:32482962
    reference_title: "Multimodal Imaging of Pre-Descemet Corneal Dystrophy Associated With X-Linked Ichthyosis and Deletion of the STS Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corneal opacities characteristic of PDCD located in the posterior corneal
      stroma just anterior to Descemet membrane were identified by slit-lamp
      biomicroscopy.
    explanation: >-
      Establishes slit-lamp biomicroscopy as the examination that makes the
      diagnosis.
- name: In Vivo Confocal Microscopy
  description: >-
    Resolves the lesion at cellular level, showing the hyperreflective particles
    within enlarged and activated posterior keratocytes. This is what
    distinguishes PDCD mechanistically from the extracellular-deposition stromal
    dystrophies, and it is the modality that can characterise a lesion too fine
    for other techniques. It is not universally informative: in one reported
    child with genetically confirmed PDCD the confocal findings were
    unremarkable while slit-lamp, AS-OCT and Scheimpflug were all abnormal.
  evidence:
  - reference: PMID:28302098
    reference_title: "In vivo confocal microscopy of pre-Descemet corneal dystrophy associated with X-linked ichthyosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vivo confocal microscopy (IVCM) is a useful tool to examine the minimal
      lesions of the cornea at the cellular level.
    explanation: >-
      States the diagnostic role of the modality for lesions of this scale.
  - reference: PMID:32482962
    reference_title: "Multimodal Imaging of Pre-Descemet Corneal Dystrophy Associated With X-Linked Ichthyosis and Deletion of the STS Gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vivo confocal microscopy findings were unremarkable.
    explanation: >-
      A negative result in a genetically confirmed case, showing the modality
      does not always detect the lesion; recorded so the diagnostic claim is not
      overstated.
- name: Copy Number Variation Analysis of STS
  description: >-
    Array CGH or cytogenomic array analysis of the Xp22.31 region converts a
    presumptive clinical diagnosis into a confirmed one. It is the necessary
    test rather than exon PCR alone, because the commonest lesion is a deletion
    - and a complete deletion produces exactly the same result as failed
    amplification for any other reason, so absence of amplicons has to be
    followed by copy-number analysis to be interpretable.
  evidence:
  - reference: PMID:23807007
    reference_title: "Pre-Descemet corneal dystrophy and X-linked ichthyosis associated with deletion of Xp22.31 containing the STS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polymerase chain reaction amplification using primers designed to amplify
      each of the 10 exons of STS failed to produce any amplicons.
    explanation: >-
      Shows the PCR result that prompted, but could not by itself establish, the
      deletion diagnosis.
  - reference: PMID:23807007
    reference_title: "Pre-Descemet corneal dystrophy and X-linked ichthyosis associated with deletion of Xp22.31 containing the STS gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of a microdeletion within Xp22.3 containing STS with
      aCGH in an individual with suspected pre-Descemet corneal dystrophy and
      X-linked ichthyosis demonstrates the clinical utility of copy number
      variation analysis in confirming a presumptive clinical diagnosis.
    explanation: >-
      States the diagnostic utility of copy-number analysis for this entity.
prevalence:
- population: >-
    Males with X-linked ichthyosis (an upper bound on the XLI-associated
    subtype, not a measurement of PDCD)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 16.7
  rate_high: 50.0
  subtype: XLI-Associated Deep Corneal Deposits
  notes: >-
    This is the prevalence of X-linked ichthyosis itself, 1/6,000 to 1/2,000 in
    males, recorded deliberately as a ceiling rather than as a measurement. PDCD
    occurs in only some XLI patients, so the true rate of the XLI-associated
    subtype is lower by an undetermined factor - the proportion of XLI patients
    with pre-Descemet opacities is not established in the cited literature, and
    is not invented here. The prevalence of isolated PDCD is not documented at
    all.
  evidence:
  - reference: PMID:39086014
    reference_title: "Revisiting X-linked congenital ichthyosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is the second most common type of ichthyosis, with a prevalence of
      1/6,000 to 1/2,000 in males and without any racial or geographical
      differences.
    explanation: >-
      Gives the prevalence of the associated skin disorder, which bounds the
      XLI-associated subtype from above but does not measure it.
discussions:
- discussion_id: pdcd_deposit_identity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the two arms of this entity store the same material - and specifically,
    is the deposit in the STS-deficient cornea cholesterol sulfate, or the same
    lipofuscin-like lipoprotein described in isolated PDCD?
  attaches_to:
  - "pathophysiology#Cholesterol Sulfate Accumulation"
  - "pathophysiology#Keratocyte Lysosomal Lipofuscin-Like Lipoprotein Accumulation"
  - "pathophysiology#Intracellular Deposition in Posterior Keratocytes"
  rationale: >-
    The two arms of this entry converge on an identical-looking cellular lesion
    from two different proposed substrates, and neither has been measured where
    it matters. In the STS-deficient arm, cholesterol sulfate is the natural
    candidate, but the accumulation has only ever been demonstrated in the
    stratum corneum; no chemical or metabolomic characterisation of an
    STS-deficient cornea exists. In the isolated arm, the material that has
    actually been characterised ultrastructurally is a lipofuscin-like
    lipoprotein in secondary lysosomes - not a sulfated sterol - and IC3D warns
    that even those studies are inconsistent.

    Three outcomes are possible and they are not equivalent. If both arms store
    cholesterol sulfate, the isolated cases become candidates for occult
    sulfatase pathway defects. If both store lipofuscin-like lipoprotein, the
    STS lesion is acting through a general lysosomal-degradation failure rather
    than through its own substrate, and the entity is a degeneration with a
    genetic accelerator. If they store different things, the resemblance is
    coincidental and the two should not share a MONDO concept at all - which is
    close to IC3D's position.
  proposed_experiments:
  - experiment_id: pdcd_deposit_lipidomics
    name: Comparative lipidomics and electron microscopy of PDCD and STS-deficient corneas
    description: >-
      Apply mass-spectrometry lipidomics and transmission electron microscopy to
      corneal tissue from an STS-deleted donor and from a donor with isolated
      PDCD, comparing sulfated sterol and lipofuscin content of posterior versus
      anterior stroma against age-matched controls, to establish whether the two
      arms store the same material.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Membrane-bound intracellular vacuoles containing electron-dense material
      suggestive of secondary lysosomes and inclusions of a lipofuscin-like
      lipoprotein consistent with a degenerative process are seen in PDCD.
    explanation: >-
      Characterises the deposit in isolated PDCD as lipofuscin-like lipoprotein,
      which is not the substrate the STS arm predicts.
  - reference: PMID:39086014
    reference_title: "Revisiting X-linked congenital ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STS deficiency causes an abnormal cholesterol sulfate (CS) accumulation in
      the stratum corneum (SC).
    explanation: >-
      The competing substrate, established in skin and never measured in cornea.
- discussion_id: pdcd_entity_boundary_xli
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should the deep corneal deposits of X-linked ichthyosis be classified as
    pre-Descemet corneal dystrophy at all, or as a corneal manifestation of a
    systemic disease?
  attaches_to:
  - "pathophysiology#Loss of Steroid Sulfatase Function"
  - "pathophysiology#Intracellular Deposition in Posterior Keratocytes"
  rationale: >-
    This is a live disagreement between two authorities that this entry
    deliberately does not resolve. The primary ophthalmological literature -
    every case series cited here, from 2013 through 2023 - labels these cases
    "pre-Descemet corneal dystrophy associated with X-linked ichthyosis". IC3D
    edition 3 explicitly refuses that label, describing the deposits as merely
    similar to PDCD and stating that XLI is a systemic disease with corneal
    manifestations and therefore not a corneal dystrophy. MONDO:0017392 carries
    the generic name and no gene, so it does not settle the question either way.

    It matters for what this record is. If IC3D is right, the STS arm belongs to
    an X-linked ichthyosis entry and this concept should shrink to the isolated
    category-4 finding; if the clinical literature is right, STS is the only
    identified genetic cause of anything called PDCD and the concept's centre of
    gravity is the STS arm. The empirical question underneath the nomenclature
    is the deposit-identity one recorded separately: if the two arms store
    different material, IC3D's separation is vindicated on mechanism and not
    merely on classification convention.
  proposed_experiments:
  - experiment_id: pdcd_xli_corneal_survey
    name: Systematic corneal survey of a genotyped X-linked ichthyosis cohort
    description: >-
      Examine an STS-genotyped XLI cohort with slit lamp, AS-OCT and confocal
      microscopy against age-matched controls, quantifying the prevalence,
      depth distribution and morphology of pre-Descemet opacities, to establish
      whether the XLI corneal phenotype is quantitatively distinguishable from
      isolated PDCD rather than only nominally separated from it.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is a systemic disease with corneal manifestations and therefore is
      not a corneal dystrophy.
    explanation: >-
      One side of the disagreement, stated by the classifying committee.
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pre-Descemet corneal dystrophy (PDCD) with X-linked ichthyosis (XLI) is
      associated with mutations in or deletions of the steroid sulfatase gene
      (STS).
    explanation: >-
      The other side: the primary literature treats these cases as PDCD, using
      the label IC3D declines to apply.
- discussion_id: pdcd_is_it_a_dystrophy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is isolated PDCD a corneal dystrophy at all, or an age-related degeneration
    that has been classified with the dystrophies by appearance alone?
  attaches_to:
  - "pathophysiology#Keratocyte Lysosomal Lipofuscin-Like Lipoprotein Accumulation"
  - "pathophysiology#Deep Stromal Punctate Opacification Anterior to Descemet Membrane"
  rationale: >-
    IC3D assigns PDCD to category 4, the tier reserved for entities with the
    least evidence for being a corneal dystrophy, and assigns it no MIM number,
    no locus and no gene. The ultrastructure - lipofuscin-like lipoprotein in
    secondary lysosomes - is read by the reporting authors as degenerative, an
    independent in vivo imaging series reached the same conclusion, and onset
    after age 30 fits a degeneration better than a dystrophy.

    What keeps the question open rather than closed is that the same source
    reports PDCD in families across two to four generations, and that some forms
    progress. A purely age-related degeneration should not cluster in pedigrees.
    The contrast with the neighbouring entity is instructive: PPPCD occupies the
    same corneal layer, has autosomal dominant pedigrees and a gene (PRDX3), and
    is rated category 1 - so the classification machinery is capable of
    recognising a dystrophy here when the evidence supports one, and has
    declined to for PDCD.
  proposed_experiments:
  - experiment_id: pdcd_age_stratified_prevalence
    name: Age-stratified prevalence of pre-Descemet opacities in an unselected population
    description: >-
      Determine the prevalence of pre-Descemet punctate opacities by decade in
      an unselected adult population with slit-lamp and AS-OCT, with STS
      copy-number analysis and dermatological examination in those affected. A
      prevalence rising steadily with age in individuals without STS lesions
      would support degeneration; familial clustering beyond chance would
      support dystrophy.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated pre-Descemet corneal dystrophy (PDCD) is neither a well-defined
      entity nor is it clearly a hereditary or degenerative disorder (known as
      cornea farinata, "flour-like cornea").
    explanation: >-
      The classifying committee's own statement that the question is unresolved.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDCD has historically been described as having several subgroups, many of
      which may represent sporadic, age-related degenerative and secondary
      changes.
    explanation: >-
      Records the specific suspicion that much of what is called PDCD is
      degenerative or secondary rather than a primary dystrophy.
  - reference: PMID:31298040
    reference_title: "Multimodal imaging of pre-Descemet corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation and structural anomalies found in isolated
      sporadic pre-Descemet corneal dystrophy are in favor of a degenerative
      process affecting corneal keratocytes with no epithelial or endothelial
      involvement.
    explanation: >-
      An independent imaging series arguing for the degenerative reading.
notes: >-
  Entry-type decision. MONDO:0017392 is a leaf under MONDO:0020213 (stromal
  corneal dystrophy), and dismech already has a Stromal_Corneal_Dystrophy
  umbrella entry with six subtypes. PDCD was nonetheless curated as its own
  Disease rather than folded in as a seventh subtype, because it does not share
  that umbrella's pathograph. The umbrella is defined by progressive deposition
  of abnormal material in the EXTRACELLULAR matrix causing loss of transparency
  and visual impairment; PDCD's material is intracellular, in enlarged posterior
  keratocytes, electron microscopy reports no extracellular deposits at all, and
  vision is spared. It is linked to the umbrella through `parents` instead.

  Entity boundary - PDCD is NOT PPPCD. IC3D edition 3 groups them in one
  template but keeps them distinct: punctiform and polychromatic pre-Descemet
  corneal dystrophy (PPPCD) is category 1, autosomal dominant, caused by PRDX3
  variants at 10q26.11, with MIM #619871; PDCD proper is category 4 with "MIM:
  PDCD - None". MONDO keeps them apart too - PPPCD is MONDO:0859248 ("corneal
  dystrophy, punctiform and polychromatic pre-descemet"), which is not a
  descendant of MONDO:0020213 and is not this entry. Nothing about PRDX3 is
  curated here, and a future PPPCD entry should be a separate file rather than a
  subtype of this one. This is not a theoretical hazard: the deep-research
  report generated for this curation had PRDX3 as its single most-mentioned gene
  (27 mentions, ahead of STS at 23) and devoted a whole mechanism subsection to
  PPPCD. Nothing from that subsection was used. PPPCD is instead recorded under
  `differential_diagnoses`, which is where it belongs.

  Scope of the genetic claim. STS is curated as CAUSATIVE for the
  XLI-associated arm only. Isolated PDCD has no identified gene and IC3D records
  its locus and gene as "Unknown". Note also that the evidence base is small -
  the reporting authors describe only three genetically confirmed PDCD-with-XLI
  cases before adding their two families - which is why the strength of the
  gene-disease relationship is stated with that qualification rather than
  asserted flatly.

  Deliberately not curated: datasets. `just discover-datasets` returned 12
  candidates, all GENE_ONLY and all matched on the string "STS" - which in the
  GEO corpus overwhelmingly means *soft tissue sarcoma* or a cell line named
  STS-something (H-STS neuroendocrine tumour line, STS-109 undifferentiated
  pleomorphic sarcoma), not steroid sulfatase. Not one concerned cornea,
  ichthyosis or sulfatase biology. This is Named Entity Confusion reached
  through dataset search in its purest form: every accession resolves, and none
  is about this disease. No `datasets:` block is therefore recorded, and the
  absence is deliberate rather than an omission.

  Deliberately not curated: treatments. PDCD is visually silent, and IC3D lists
  it among the dystrophies that are typically asymptomatic and do not require
  treatment. Recording a treatment here would mean inventing one; the absence is
  the clinically relevant fact, and it is carried by evidence on the
  "Visually Silent Corneal Finding" node rather than by an empty section.

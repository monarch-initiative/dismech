name: Pre-Descemet Corneal Dystrophy
creation_date: "2026-08-25T00:00:00Z"
description: >-
  Pre-Descemet corneal dystrophy (PDCD) is characterised by focal, fine,
  polymorphic grey opacities confined to the deep stroma immediately anterior to
  Descemet membrane. It involves the posterior stroma and nothing else, is
  bilateral, usually appears after the age of 30, and does not affect vision.

  Its status as a dystrophy is contested, and this entry curates the dispute
  rather than resolving it. The IC3D classification assigns PDCD to category 4,
  its lowest evidence tier, and states plainly that isolated PDCD is neither a
  well-defined entity nor clearly hereditary or degenerative. No gene, locus or
  MIM number is assigned. What ultrastructure exists points toward degeneration
  rather than storage of a genetically determined product: transmission electron
  microscopy shows membrane-bound intracellular vacuoles holding electron-dense
  material suggestive of secondary lysosomes, together with inclusions of a
  lipofuscin-like lipoprotein, and no extracellular deposits at all. That last
  detail is what most sharply separates PDCD from the classical stromal
  dystrophies it sits beside in the ontology, which are defined by abnormal
  material accumulating in the extracellular matrix and progressively opacifying
  the cornea. Against a purely degenerative reading, PDCD has been described in
  families over two to four generations, and some forms progress.

  Deep corneal deposits closely resembling PDCD are also frequently seen in
  X-linked ichthyosis, where they appear in the first decade and where every
  genetically characterised family carries a point mutation, partial deletion or
  complete deletion of STS at Xp22.31. Much of the ophthalmological literature
  labels those cases PDCD. IC3D explicitly declines to, on the ground that XLI is
  a systemic disease with corneal manifestations and therefore not a corneal
  dystrophy. Both arms are curated here, because MONDO:0017392 is the concept the
  clinical literature uses for both and because the two are told apart by skin
  examination, age of onset and STS analysis rather than by the corneal
  appearance - but the disagreement is recorded explicitly rather than smoothed
  over.


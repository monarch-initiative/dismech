    explanation: >-
      Independent confirmation of complete loss of the STS coding sequence in a
      patient with pre-Descemet deposits.
  downstream:
  - target: Cholesterol Sulfate Accumulation
    causal_link_type: DIRECT
    description: >-
      Steroid sulfatase is the enzyme that hydrolyses cholesterol sulfate, so
      its loss allows the substrate to accumulate.
    evidence:
    - reference: PMID:39086014

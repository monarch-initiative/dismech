has_subtypes:
- name: Isolated PDCD
  display_name: Isolated PDCD (IC3D category 4)
  description: >-
    PDCD occurring without ichthyosis and without an identified gene - the
    entity MONDO and Orphanet actually define, and the one IC3D rates category 4.
    IC3D assigns it no MIM number, no locus and no gene, and describes it as
    neither well defined nor clearly hereditary or degenerative. The
    countervailing observation is that it has been reported in families across
    two to four generations, so a purely degenerative reading is not settled
    either. Onset is usually after age 30, which distinguishes it from the
    XLI-associated deposits of the other subtype.
  evidence:
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Isolated pre-Descemet corneal dystrophy (PDCD) is neither a well-defined
      entity nor is it clearly a hereditary or degenerative disorder (known as
      cornea farinata, "flour-like cornea").
    explanation: >-
      The classifying committee's own statement of the entity's uncertain status.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Although no definite pattern of inheritance is established, it has been
      described in families over 2 to 4 generations.
    explanation: >-
      Records the familial clustering that argues against reading isolated PDCD
      as purely degenerative, while noting no inheritance pattern is established.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Usually after age 30 years; although PPPCD has been found in children as
      young as age 3 years.
    explanation: >-
      Gives the age of onset of this subtype, which is one of the features that
      separates it from the XLI-associated deposits.
- name: XLI-Associated Deep Corneal Deposits
  display_name: Deep corneal deposits of X-linked ichthyosis (STS)
  description: >-
    The genetically characterised arm, and the contested one. Affected men have
    bilateral punctate posterior stromal opacities anterior to Descemet membrane
    together with the dry, coarse, scaly skin of X-linked ichthyosis, and STS
    analysis shows a point mutation, a partial deletion of the coding exons, or
    a complete deletion of the locus at Xp22.31. That three different classes of
    lesion produce an indistinguishable corneal phenotype is itself the argument
    that they all act through loss of steroid sulfatase function.

    It is named "deep corneal deposits" rather than "PDCD" deliberately. Much of
    the ophthalmological literature - including every primary report cited here -
    calls these cases PDCD, but IC3D expressly refuses the label because XLI is a
    systemic disease with corneal manifestations. The subtype is retained under
    this MONDO concept because that is how the clinical literature indexes it,
    with the dissent recorded as evidence rather than suppressed.
  genes:
  - preferred_term: STS
    term:
      id: hgnc:11425
      label: STS
  evidence:
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The slit-lamp examination of three affected men (two of whom were
      brothers) from two families revealed bilateral punctate posterior corneal
      stromal opacities anterior to the Descemet membrane.
    explanation: >-
      Defines the corneal phenotype of this subtype in genetically confirmed
      individuals.
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PDCD with XLI may be associated with either partial or complete deletion
      of STS.
    explanation: >-
      States the allelic spectrum that defines this subtype, and shows the
      primary literature does apply the PDCD label to it.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Similar deep corneal deposits to PDCD are also frequently seen in X-linked
      ichthyosis (MIM #308100) which results from mutations in the steroid
      sulfatase gene (STS) at genetic locus Xp22.31.
    explanation: >-
      IC3D describes these deposits as merely SIMILAR to PDCD rather than as
      PDCD, which is the first half of its refusal to classify them together.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      This is a systemic disease with corneal manifestations and therefore is
      not a corneal dystrophy.
    explanation: >-
      The explicit IC3D position that this arm is not a corneal dystrophy at
      all - recorded as REFUTE against its inclusion as a subtype of PDCD.
  - reference: PMID:38359414
    reference_title: "IC3D Classification of Corneal Dystrophies-Edition 3."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It has been described in the first decade of life.
    explanation: >-
      Gives the early onset of this arm, in contrast to the post-30 onset of
      isolated PDCD - a practical discriminator between the two.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    In the XLI-associated subtype the lesion is at Xp22.3 and the reported
    affected individuals are men, including two brothers in one family. The
    corneal finding therefore segregates with X-linked ichthyosis itself, whose
    causative gene STS lies at that locus. This inheritance block describes the
    XLI-associated arm only; isolated PDCD has no established mode of
    inheritance, which is part of why IC3D rates it category 4.
  evidence:
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic examination of the STS locus on the X chromosome in Case 1
      revealed a deletion that spanned across DNA markers DXS1130-DXS237, which
      includes all the coding exons (exons 1-10) of STS.
    explanation: >-
      Places the causal lesion on the X chromosome in an affected male.
  - reference: PMID:39086014
    reference_title: "Revisiting X-linked congenital ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The causative gene for XLI is the steroid sulfatase gene (STS), located on
      Xp22.3.
    explanation: >-
      Confirms the gene and cytoband of the associated X-linked disorder.
pathophysiology:
- name: Keratocyte Lysosomal Lipofuscin-Like Lipoprotein Accumulation
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: PROVISIONAL
  subtypes:
  - Isolated PDCD
  description: >-
    The proposed initiating lesion of the isolated arm, and the reason that arm
    reads as a degeneration. Transmission electron microscopy of PDCD corneas
    shows membrane-bound intracellular vacuoles containing electron-dense
    material that has the appearance of secondary lysosomes, together with
    inclusions of a lipofuscin-like lipoprotein. Lipofuscin is the classic
    marker of accumulated, incompletely degraded material in long-lived
    post-mitotic cells, and its presence is what the reporting authors read as
    evidence of a degenerative process rather than of a genetically determined
    storage product. Consistent with that, onset is usually after age 30.

    It is curated PROVISIONAL rather than established because IC3D itself
    reports that the histopathological studies of PDCD are not consistent, and
    because no gene, locus or metabolic defect has been assigned that would
    explain why the material accumulates.
  cellular_components:

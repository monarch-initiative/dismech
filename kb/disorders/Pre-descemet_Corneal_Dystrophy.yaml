      Documents a whole-locus microdeletion in an affected individual.
  - reference: PMID:28302098
    reference_title: "In vivo confocal microscopy of pre-Descemet corneal dystrophy associated with X-linked ichthyosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCR results demonstrated that all ten exons and part flanking sequences of

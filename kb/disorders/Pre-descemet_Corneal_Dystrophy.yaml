    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic screening of Cases 2 and 3 revealed a partial deletion of the STS
      locus involving exons 1-7 and flanking DNA marker DXS1130 on the X
      chromosome.
    explanation: >-
      Documents a partial-deletion allele in two affected brothers.
  - reference: PMID:37287641
    reference_title: "Identification of a novel partial deletion of STS associated with pre-Descemet corneal dystrophy and X-linked ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the identification of point mutations, partial deletion, and
      complete deletion of STS in different affected families reported to date,
      there was no apparent difference in the affected phenotype between the
      families, suggesting that the identified variants likely all resulted in

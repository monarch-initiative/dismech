    explanation: The published case count as of 2019.
diagnosis:
- name: Gonadotropin and sex steroid measurement with GnRH stimulation
  description: >-
    The suggestive pattern is undetectable FSH that does not respond to GnRH, with high basal
    LH and an exaggerated LH response, low estradiol in women and normal or low testosterone in
    men.
  diagnosis_term:
    preferred_term: follicle stimulating hormone measurement
    term:
      id: NCIT:C74783
      label: Follicle Stimulating Hormone Measurement
  results: Undetectable basal and GnRH-stimulated FSH, high LH.
  evidence:
  - reference: PMID:15705395
    reference_title: Clinical and hormonal features of selective follicle-stimulating hormone (FSH) deficiency due to FSH beta-subunit gene mutations in both sexes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, this unusual hormonal profile strongly suggests a defect in the FSH beta-subunit in both sexes."
    explanation: Undetectable FSH with high LH points to an FSHB defect.
- name: FSHB gene sequencing
  description: >-
    Sequencing of FSHB confirms the diagnosis when two pathogenic alleles are found. It should
    be considered in girls with delayed puberty and selective FSH deficiency. A negative result
    leaves acquired or genetically unexplained selective FSH deficiency, which is outside this
    entry.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic FSHB variants, homozygous or compound heterozygous.
  evidence:
  - reference: PMID:30602350
    reference_title: "FSH β-subunit mutations in two sisters: the first report from the Indian sub-continent and review of previous cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude and emphasize that this diagnosis should be considered in girls with delayed puberty and selective deficiency of FSH."
    explanation: The recommendation to consider FSHB deficiency in girls with selective FSH deficiency.
treatments:
- name: FSH Replacement
  description: >-
    Exogenous FSH replaces the missing hormone at its intact receptor. In women, recombinant or
    urinary FSH induces follicle growth, estradiol and inhibin B production and ovulation; the
    first reported woman conceived. Because LH is already high, the ovarian response can be
    excessive, and multifollicular development with signs of hyperstimulation has been
    reported, so dosing needs close monitoring. In a treated man testicular volume increased and
    spermatocytes appeared in semen after a year, without a reported pregnancy.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: follitropin
      term:
        id: NCIT:C71762
        label: Follitropin
  target_mechanisms:
  - target: Arrested Ovarian Follicle Maturation
    treatment_effect: BYPASSES
    description: Exogenous FSH drives the follicle maturation that endogenous FSH cannot.
    evidence:
    - reference: PMID:8220432
      reference_title: Primary amenorrhoea and infertility due to a mutation in the beta-subunit of follicle-stimulating hormone.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ovulation was induced by administration of exogenous FSH and resulted in a successful pregnancy."
      explanation: Ovulation and pregnancy on exogenous FSH in the first reported woman.
  - target: Impaired Spermatogenesis
    treatment_effect: BYPASSES
    description: Exogenous FSH supplies the Sertoli cell signal for germ cell development.
    evidence:
    - reference: PMID:28392474
      reference_title: Novel FSHβ mutation in a male patient with isolated FSH deficiency and infertility.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient's testicular volume increased after one year of exogenous FSH replacement therapy at which point spermatocytes were detected in seminal samples, indicating potential future spermatogenesis."
      explanation: Testicular growth and appearance of spermatocytes on FSH in an affected man.
  evidence:
  - reference: PMID:19966036
    reference_title: "A new FSHbeta mutation in a 29-year-old woman with primary amenorrhea and isolated FSH deficiency: functional characterization and ovarian response to human recombinant FSH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rhFSH was effective in ovulation induction in the patient but with signs of ovarian hyperstimulation."
    explanation: Effective ovulation induction, with ovarian hyperstimulation as the adverse effect.
  - reference: PMID:19966036
    reference_title: "A new FSHbeta mutation in a 29-year-old woman with primary amenorrhea and isolated FSH deficiency: functional characterization and ovarian response to human recombinant FSH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high pretreatment LH levels could contribute to this excessive ovarian response to rhFSH."
    explanation: The authors attribute the excessive response to the high endogenous LH.
animal_models:
- name: Fshb knockout mouse
  species: Mouse
  genotype: Fshb-/-
  description: >-
    Mice lacking the FSH beta subunit have no FSH. Females are infertile with a block in
    folliculogenesis before antral follicle formation. Males have small testes and reduced sperm
    number and motility but remain fertile. A human FSHB transgene expressed in gonadotrophs
    restores both sexes.
  publication: PMID:9020850
  modeled_mechanisms:
  - target: Arrested Ovarian Follicle Maturation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The female knockout reproduces the block in follicle maturation and infertility.
    evidence:
    - reference: PMID:9020850
      reference_title: Follicle stimulating hormone is required for ovarian follicle maturation but not male fertility.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "FSH-deficient females are infertile due to a block in folliculogenesis prior to antral follicle formation."
      explanation: The female phenotype matches the human ovarian defect.
  - target: Impaired Spermatogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Knockout males have reduced sperm number and motility, but not the azoospermia and
      infertility reported in FSHB-deficient men.
    limitations: >-
      Species divergence in the FSH requirement for spermatogenesis: male mice without FSH stay
      fertile, whereas reported FSHB-deficient men are azoospermic.
    evidence:
    - reference: PMID:9645705
      reference_title: Genetic rescue of follicle-stimulating hormone beta-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Male mice deficient in FSH are fertile despite their small testes and reduced sperm number and motility."
      explanation: The male phenotype is milder than in men.
  evidence:
  - reference: PMID:9645705
    reference_title: Genetic rescue of follicle-stimulating hormone beta-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All of the mouse FSHbeta-deficient female mice carrying this human FSHbeta transgene resumed normal folliculogenesis, were fertile and delivered normal size litters."
    explanation: A human FSHB transgene rescues the female knockout, confirming the defect is the missing hormone.
discussions:
- discussion_id: hh24_male_spermatogenesis_species_divergence
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Spermatogenesis
  prompt: >-
    Why does loss of FSH cause azoospermia in men but leave Fshb-null male mice fertile?
  rationale: >-
    The ovarian defect is reproduced closely in the knockout mouse, but the testicular defect is
    not: knockout males have smaller testes and fewer, less motile sperm and still sire litters,
    while the cited review states that FSHB mutations in men result in azoospermia. Human FSHR
    loss also impairs testicular function without absolute infertility. The mouse therefore
    cannot be used to estimate how much spermatogenesis FSH replacement can restore in men,
    and the human male case series is too small to settle it.
  evidence:
  - reference: PMID:23184658
    reference_title: "The molecular basis of impaired follicle-stimulating hormone action: evidence from human mutations and mouse models."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "while FSHR mutations in humans and knockouts of both the ligand and the receptor in mice affect testicular function but do not result in absolute infertility."
    explanation: >-
      The second clause of the review's comparison: FSHR loss in humans and both knockouts in
      mice spare absolute fertility, in contrast with FSHB loss in men.

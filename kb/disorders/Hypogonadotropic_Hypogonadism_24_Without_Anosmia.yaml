    reference_title: Effects of follicle-stimulating hormone and human chorionic gonadotropin on gonadal steroidogenesis in two siblings with a follicle-stimulating hormone beta subunit mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

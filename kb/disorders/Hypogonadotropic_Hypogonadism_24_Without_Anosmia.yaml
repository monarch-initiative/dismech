    snippet: "Estradiol levels were low (<13 pg/mL)."
    explanation: Low estradiol in a homozygous Tyr76X adolescent.
- name: Loss of FSH Signaling in Sertoli Cells
  description: >-
    Without FSH, Sertoli cells receive no FSH receptor signal, so they cannot support germ cell
    development and secrete little inhibin B. LH-driven Leydig cell testosterone production is
    largely preserved, which is why virilization can be normal.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sertoli cell

  - target: Hypoplasia of the Uterus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Delayed Puberty
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Elevated Circulating LH
    description: Low estradiol releases LH from negative feedback.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20067895
      reference_title: "FSHbeta gene mutation in a female with delayed puberty and hypogonadism: response to recombinant human FSH."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This patient was hypoestrogenic with secondary LH excess but not excessive androgen production."
      explanation: The authors describe the LH excess as secondary to the hypoestrogenic state.
  evidence:
  - reference: PMID:11756367
    reference_title: "The role of LH and FSH in ovarian androgen secretion and ovarian follicular development: clinical studies in a patient with isolated FSH deficiency and multicystic ovaries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a detailed reproductive endocrine evaluation of a patient with inactivating mutations in the FSH beta-subunit gene who was hypo-estrogenic and had LH excess."
    explanation: Hypoestrogenism in an FSHB-deficient woman.
  - reference: PMID:15705395

      reference_title: "The molecular basis of impaired follicle-stimulating hormone action: evidence from human mutations and mouse models."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In males, FSH is necessary for normal spermatogenesis, but there are differences in human and mouse models."
      explanation: Review synthesis of human and mouse data on the FSH requirement for spermatogenesis.
  - target: Decreased Circulating Inhibin B
    description: Inhibin B is a Sertoli cell product.
    causal_link_type: DIRECT
  evidence:

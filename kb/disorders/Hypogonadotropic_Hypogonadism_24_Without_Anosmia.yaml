genetic:
- name: FSHB
  notes: >-
    Encodes the follicle-stimulating hormone beta subunit. Biallelic loss-of-function variants
    cause the disease; reported alleles are frameshift, nonsense and cysteine missense variants
    in exon 3. No ClinGen gene-disease validity record for FSHB is present in the committed
    ClinGen cache, so no validity tier is recorded.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: FSHB
    term:
      id: hgnc:3964
      label: FSHB
  evidence:
  - reference: PMID:28392474
    reference_title: Novel FSHβ mutation in a male patient with isolated FSH deficiency and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Isolated follicle stimulating hormone (FSH) deficiency due to mutations in FSHβ is an extremely rare autosomal recessive disease that has only been reported in ten patients to date."
    explanation: FSHB as the causal gene for isolated FSH deficiency.
  - reference: PMID:30602350
    reference_title: "FSH β-subunit mutations in two sisters: the first report from the Indian sub-continent and review of previous cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of FSH β-gene identified one nonsense mutation (c.343C > T:p. Arg115Stop) in exon 3."
    explanation: A homozygous FSHB nonsense variant segregating with disease.

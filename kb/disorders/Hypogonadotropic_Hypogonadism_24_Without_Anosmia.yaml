name: Hypogonadotropic Hypogonadism 24 Without Anosmia
category: Mendelian
creation_date: "2026-10-27T12:14:23Z"
synonyms:
- HH24
- FSHB hypogonadotropic hypogonadism
- hypogonadotropic hypogonadism caused by mutation in FSHB
- isolated FSH deficiency
- isolated follicle-stimulating hormone deficiency
- selective FSH deficiency
description: >-
  An autosomal recessive form of hypogonadism caused by biallelic inactivating variants in FSHB,
  the gene for the hormone-specific beta subunit of follicle-stimulating hormone (FSH). Only the
  FSH beta chain is affected, so the defect is selective: the pituitary still makes LH, and the
  common alpha subunit shared with LH, TSH and hCG is intact. Reported alleles are frameshift,
  nonsense and cysteine-substituting missense variants in exon 3; every allele tested in
  transfected cells yields no measurable immunoreactive or bioactive FSH.

  Serum FSH is undetectable and does not rise after GnRH, while LH is high and rises briskly.
  Women present with primary amenorrhoea, absent or partial breast development, low estradiol,
  a small uterus and small ovaries containing only small follicles, and infertility. Men
  present with infertility, small testes and azoospermia; several reported men went through
  normal puberty with normal testosterone, because LH and Leydig cell function are preserved.
  Some patients of both sexes have partial pubertal development.

  The disorder is very rare: about a dozen genotyped patients had been published by 2019. The
  missing hormone can be replaced, and recombinant or urinary FSH has induced multifollicular
  development, ovulation and, in the first reported woman, pregnancy; in a treated man testicular
  volume increased and spermatocytes appeared in semen after a year.
disease_term:
  preferred_term: hypogonadotropic hypogonadism 24 without anosmia
  term:
    id: MONDO:0009239
    label: hypogonadotropic hypogonadism 24 without anosmia
parents:
- Hypogonadotropic hypogonadism
notes: >-
  The defect lies in a pituitary gonadotropin subunit, downstream of GnRH, not in the
  olfactory-GnRH neuron system; FSHB variants are reported only in normosmic patients, so
  anosmia is not recorded as a phenotype. Selective FSH deficiency with no FSHB variant found
  is also described, in men and women, and is not covered by this entry. MONDO cross-references
  this term to OMIM:229070; Orphanet catalogues the phenotype as ORPHA:52901 (isolated
  follicle stimulating hormone deficiency). Neither is held in a mappings slot here. The
  ClinGen gene-disease validity cache committed in this repository has no FSHB record, so no
  validity tier is recorded. `just check-genereviews` found no GeneReviews chapter for this
  disease.
inheritance:
- name: Autosomal Recessive
  description: >-
    Affected individuals are homozygous, usually from consanguineous families, or compound
    heterozygous for FSHB variants. Heterozygous parents of reported probands have normal
    puberty and fertility.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:28392474
    reference_title: Novel FSHβ mutation in a male patient with isolated FSH deficiency and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both parents were heterozygous carriers of the mutation with normal pubertal development and fertility."
    explanation: Unaffected heterozygous parents of a homozygous affected man, the recessive pattern.
  - reference: PMID:30602350
    reference_title: "FSH β-subunit mutations in two sisters: the first report from the Indian sub-continent and review of previous cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two sisters were homozygous for this nonsense mutation while the parents were heterozygous."
    explanation: Homozygous affected sisters born to heterozygous consanguineous parents.
  - reference: PMID:8220432
    reference_title: Primary amenorrhoea and infertility due to a mutation in the beta-subunit of follicle-stimulating hormone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her mother and son are heterozygous for this mutation."
    explanation: Heterozygous relatives of the first reported homozygous woman are not described as affected.
pathophysiology:
- name: Biallelic FSHB Loss-of-Function Variants
  description: >-
    FSHB encodes the beta subunit that gives FSH its receptor specificity. Reported alleles are a
    two-nucleotide frameshift deletion (historically Val61X), a one-nucleotide frameshift
    (c.289delG), nonsense variants (Tyr76X, Arg97X, p.Arg115Ter, p.Cys122Ter) and missense
    substitutions of conserved cystine-knot cysteines (Cys51Gly, Cys82Arg). Truncations remove
    the regions needed for association with the alpha subunit and for receptor binding; the
    cysteine substitutions prevent formation of disulphide bonds needed for correct folding.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FSHB
    term:
      id: hgnc:3964
      label: FSHB
  molecular_functions:
  - preferred_term: follicle-stimulating hormone activity
    modifier: DECREASED
    term:
      id: GO:0016913
      label: follicle-stimulating hormone activity
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Homozygous in most reported families, several of them consanguineous; compound
      heterozygous (Cys51Gly with Val61X) in one woman.
  downstream:
  - target: Loss of Bioactive FSH Secretion
    description: >-
      Each variant class removes secreted bioactive FSH: a truncated beta chain cannot pair with
      the alpha subunit, and a cysteine substitution leads to misfolding and intracellular
      degradation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12161499
      reference_title: FSH beta gene mutations in a female with partial breast development and a male sibling with normal puberty and azoospermia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All mutations failed to produce measurable FSH by all assays."
      explanation: >-
        Tyr76X, Cys51Gly and Val61X compared side by side in the same immuno- and bioassays all
        abolish production of FSH.
  evidence:
  - reference: PMID:8220432
    reference_title: Primary amenorrhoea and infertility due to a mutation in the beta-subunit of follicle-stimulating hormone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predicted truncated beta-subunit peptide lacks regions which are important for association with the alpha subunit and for binding to and activation of the FSH receptor."
    explanation: The first reported FSHB allele, a homozygous frameshift predicted to remove alpha-subunit and receptor contact regions.
  - reference: PMID:9806482
    reference_title: "Follitropin (FSH) deficiency in an infertile male due to FSHbeta gene mutation. A syndrome of normal puberty and virilization but underdeveloped testicles with azoospermia, low FSH but high lutropin and normal serum testosterone concentrations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the follitropin beta gene, exon 3, revealed a Cys82 --> Arg mutation (TGT --> CGT)."
    explanation: A missense allele replacing a conserved cysteine of the beta subunit.
  - reference: PMID:28392474
    reference_title: Novel FSHβ mutation in a male patient with isolated FSH deficiency and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis identified a novel homozygous mutation in the FSHβ gene (c.343C > T) predicted to result in a premature termination codon and a truncated FSH protein (p.R115X)."
    explanation: A homozygous nonsense allele in an affected man.
  - reference: PMID:40441342
    reference_title: Co-occurrence of congenital isolated FSH deficiency and androgen-secreting steroid cell tumour in a Chinese female - Intermittent menses in a patient with primary amenorrhoea.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of FSHB gene revealed homozygosity of a novel variant c.366C > A p.(Cys122*), which is predicted to disrupt FSH heterodimer formation."
    explanation: A further homozygous nonsense allele, predicted to prevent heterodimer formation.
- name: Loss of Bioactive FSH Secretion
  description: >-
    Gonadotrophs release no measurable immunoreactive or bioactive FSH. With some alleles the
    mutant beta-subunit mRNA and protein are still made inside the cell, but no functional
    heterodimer is secreted. LH secretion is preserved.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pituitary gonadotroph
    term:
      id: CL:0000437
      label: gonadtroph
  biological_processes:
  - preferred_term: follicle-stimulating hormone secretion
    modifier: DECREASED
    term:
      id: GO:0046884
      label: follicle-stimulating hormone secretion
  downstream:
  - target: Decreased Circulating FSH
    description: The measurable form of the defect in the circulation.
    causal_link_type: DIRECT
  - target: Hypogonadotropic Hypogonadism
    description: Gonadal failure from absent FSH, with LH preserved or raised.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Loss of FSH Signaling in Granulosa Cells
    description: FSH acts on the ovary through its receptor on granulosa cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9020850
      reference_title: Follicle stimulating hormone is required for ovarian follicle maturation but not male fertility.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "FSH receptors are localized to Sertoli cells of the testes and granulosa cells of the ovary."
      explanation: Locates the FSH target cell in the ovary.
  - target: Loss of FSH Signaling in Sertoli Cells
    description: FSH acts on the testis through its receptor on Sertoli cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9020850
      reference_title: Follicle stimulating hormone is required for ovarian follicle maturation but not male fertility.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "FSH receptors are localized to Sertoli cells of the testes and granulosa cells of the ovary."
      explanation: Locates the FSH target cell in the testis.
  evidence:
  - reference: PMID:12161499
    reference_title: FSH beta gene mutations in a female with partial breast development and a male sibling with normal puberty and azoospermia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro analysis of this mutant demonstrates unmeasurable FSH by immunoassay and by two different bioassays, using either cAMP (homologous FSH bioassay) or estradiol (rat granulosa cell assay) as the endpoints."
    explanation: Tyr76X yields no immunoreactive or bioactive FSH in transfected cells.
  - reference: PMID:19966036
    reference_title: "A new FSHbeta mutation in a 29-year-old woman with primary amenorrhea and isolated FSH deficiency: functional characterization and ovarian response to human recombinant FSH."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type FSH was readily detectable in culture medium, whereas no mutant FSH was detectable by either immunoassay or in vitro bioassay."
    explanation: The c.289delG allele co-expressed with the alpha subunit yields no secreted FSH.
  - reference: PMID:12568849
    reference_title: Analysis of the Cys82Arg mutation in follicle-stimulating hormone beta (FSHbeta) using a novel FSH expression vector.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although expression of both subunits was present, both immunoreactive and bioactive FSH levels were unmeasurable from cellular media containing the mutation versus wild type."
    explanation: The Cys82Arg allele expressed with the alpha subunit yields no secreted FSH.
  - reference: PMID:32367462
    reference_title: Clinical and genetic analysis of an isolated follicle-stimulating hormone deficiency female patient.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RT-PCR and western blot analysis revealed the mutation Arg97X did not affect FSHβ mRNA and protein expression. But in vitro immunometric assay and bioassay demonstrated the production of normal bioactive FSH protein was disturbed by the mutation Arg97X."
    explanation: Mutant beta subunit is made but no normal bioactive hormone results.
- name: Loss of FSH Signaling in Granulosa Cells
  description: >-
    Without FSH, granulosa cells receive no FSH receptor signal. The signal is needed for
    follicle growth past the early antral stage and for granulosa cell estradiol and inhibin B
    output. The cells stay responsive: estradiol and inhibin B rise promptly when FSH is given.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:
  - preferred_term: follicle-stimulating hormone signaling pathway
    modifier: DECREASED
    term:
      id: GO:0042699
      label: follicle-stimulating hormone signaling pathway
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Arrested Ovarian Follicle Maturation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20067895
      reference_title: "FSHbeta gene mutation in a female with delayed puberty and hypogonadism: response to recombinant human FSH."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The present study confirm that follicles up to 5 mm in diameter had developed in the absence of FSH and that FSH is required for the growth of follicles beyond the two-layer granulose stage."
      explanation: Follicles grow to about 5 mm without FSH and need FSH to progress further.
  - target: Deficient Ovarian Estradiol Production
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11756367
      reference_title: "The role of LH and FSH in ovarian androgen secretion and ovarian follicular development: clinical studies in a patient with isolated FSH deficiency and multicystic ovaries."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The patient had multicystic ovaries containing follicles 3-5 mm in diameter and responded to FSH with prompt increases in estradiol and inhibin B."
      explanation: >-
        Estradiol output appears once FSH is supplied, so its deficit before treatment depends on
        the missing FSH signal. Inferred from a rescue response.
  - target: Decreased Circulating Inhibin B
    description: Granulosa cells are a source of inhibin B, whose output is FSH-dependent.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19966036
      reference_title: "A new FSHbeta mutation in a 29-year-old woman with primary amenorrhea and isolated FSH deficiency: functional characterization and ovarian response to human recombinant FSH."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Circulating levels of estradiol and inhibin B were dramatically increased, whereas anti-Mullerian hormone decreased."
      explanation: Inhibin B rises on recombinant FSH, so its deficit depends on the missing FSH signal.
- name: Arrested Ovarian Follicle Maturation
  description: >-
    Primordial and small follicles form without FSH, and follicles of 3-5 mm are seen on
    ultrasound, but they do not mature to preovulatory follicles, so ovulation does not occur.
    The ovaries are small, or occasionally multicystic. Ovarian reserve is preserved, with normal
    anti-Mullerian hormone in one woman, which is why exogenous FSH induces follicle growth.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: ovarian follicle development
    modifier: DECREASED
    term:
      id: GO:0001541
      label: ovarian follicle development
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Female Infertility
    causal_link_type: DIRECT
  - target: Hypoplasia of the Ovary
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20067895
    reference_title: "FSHbeta gene mutation in a female with delayed puberty and hypogonadism: response to recombinant human FSH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultra sound examination revealed a small uterus and small ovaries with few small follicles."
    explanation: Small ovaries holding only small follicles in a homozygous woman.
  - reference: PMID:11756367
    reference_title: "The role of LH and FSH in ovarian androgen secretion and ovarian follicular development: clinical studies in a patient with isolated FSH deficiency and multicystic ovaries."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found that follicular development was present in the absence of FSH."
    explanation: Early follicle development proceeds without FSH; the block is at later maturation.
  - reference: PMID:9020850
    reference_title: Follicle stimulating hormone is required for ovarian follicle maturation but not male fertility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "FSH-deficient females are infertile due to a block in folliculogenesis prior to antral follicle formation."
    explanation: Fshb-null mice show the same block in follicle maturation.
- name: Deficient Ovarian Estradiol Production
  description: >-
    Without FSH-driven follicle maturation, the ovary makes little estradiol. Low estradiol
    accounts for the failure of breast development and uterine growth and for primary
    amenorrhoea, and removes estrogen negative feedback, so LH rises. Androgen production is not
    excessive despite the high LH.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:

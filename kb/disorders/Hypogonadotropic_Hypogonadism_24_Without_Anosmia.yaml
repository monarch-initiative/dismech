    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date, only four loss-of-function mutations of the FSH beta-subunit have been described in eight patients with undetectable serum FSH and high serum LH levels."
    explanation: All eight patients reviewed in 2005 had undetectable FSH.
  - reference: PMID:32367462
    reference_title: Clinical and genetic analysis of an isolated follicle-stimulating hormone deficiency female patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The evaluation of reproductive endocrine revealed undetectable basal and GnRH-stimulated serum FSH."
    explanation: Undetectable basal and stimulated FSH in a homozygous Arg97X woman.
- name: Elevated Circulating LH
  category: Endocrine
  description: >-
    Basal LH is high and rises briskly after GnRH, in both sexes. The dissociation between
    undetectable FSH and high LH is the biochemical clue to the diagnosis.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Elevated circulating luteinizing hormone level

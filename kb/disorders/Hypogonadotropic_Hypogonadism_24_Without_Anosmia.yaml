    explanation: >-
      In a man with homozygous Tyr76X, the authors place the primary FSH action on Sertoli cells,
      with only a secondary paracrine effect on Leydig cells.
- name: Impaired Spermatogenesis
  description: >-
    Germ cell development fails, giving azoospermia and small, soft testes in the reported men.
    Spermatogenesis is affected more consistently than androgen production. This is a point of
    divergence from the Fshb-null mouse, whose males remain fertile.
  biological_scale: TISSUE

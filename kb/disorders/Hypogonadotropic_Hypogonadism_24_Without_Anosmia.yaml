phenotypes:
- name: Hypogonadotropic Hypogonadism
  category: Endocrine
  description: >-
    Gonadal failure from absent FSH. The pattern is selective: FSH is undetectable while LH is
    raised, unlike the low LH and low FSH of GnRH-deficiency forms.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  evidence:
  - reference: PMID:19966036
    reference_title: "A new FSHbeta mutation in a 29-year-old woman with primary amenorrhea and isolated FSH deficiency: functional characterization and ovarian response to human recombinant FSH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations of the FSHbeta gene, causing in women isolated FSH deficiency and hypogonadism, are very rare and only a few have been described."
    explanation: Hypogonadism from FSH deficiency as the disease-defining feature.
- name: Decreased Circulating FSH
  category: Endocrine
  description: >-
    Serum FSH is undetectable at baseline and does not rise after GnRH stimulation.
  frequency: VERY_FREQUENT
  phenotype_term:

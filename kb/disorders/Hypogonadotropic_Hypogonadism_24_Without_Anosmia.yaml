    evidence_source: HUMAN_CLINICAL
    snippet: "Her basal and GnRH-stimulated LH levels were elevated (31 IU/L and 98 IU/L, respectively), whereas her FSH levels were undetectable (<1 IU/L) in both conditions."
    explanation: High basal and stimulated LH with undetectable FSH.
  - reference: PMID:28392474
    reference_title: Novel FSHβ mutation in a male patient with isolated FSH deficiency and infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His serum hormonal profile revealed low FSH, elevated LH and normal testosterone levels."

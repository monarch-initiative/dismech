- name: Management of Symptomatic Laryngotracheal Stenosis
  description: >-
    Temporary tracheostomy, ventilation and corticosteroids restored spontaneous breathing in the reported adult
    with severe airway stenosis and mucosal inflammation. Residual narrowing remained on follow-up. This is a single
    complication-specific intervention, and the relationship of the stenosis to AMS itself was uncertain.
  evidence:
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of the stenosis by means of temporary tracheostomy and corticosteroids therapy resulted in airway
      patency restoration and patient's return to her normal activities.
    explanation: >-
      Single adult case with confirmed TWIST2 c.223G>A; not evidence for corticosteroid treatment of the inherited
      malformations.
  target_mechanisms:
  - target: Laryngotracheal Stenosis
animal_models:
- name: Zebrafish embryos injected with mutant human TWIST2 mRNA
  species: Zebrafish
  genotype: >-
    Wild-type embryos injected at the one-cell stage with human TWIST2 mRNA
    (wild-type, p.Glu75Lys or p.Glu75Gln); stable Cre-inducible transgenic
    lines confirmed the phenotypes
  publication: PMID:26119818
  description: >-
    Mutant TWIST2 overexpression caused more severe head, trunk and cardiac-edema phenotypes than wild-type overexpression. Wild-type human TWIST2 itself caused mild developmental defects in approximately 65% of injected embryos, limiting interpretation of the assay as a specific disease model. RNA-seq at shield stage identified altered developmental transcription, with reductions in extracellular matrix, membrane and cytoskeleton gene sets. Stable inducible transgenic experiments supported the reported effects.
  modeled_mechanisms:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that p.Glu75Lys changes developmental transcription relative to
      wild-type TWIST2.
    limitations: >-
      Global overexpression of human mRNA from the one-cell stage, not a
      heterozygous allele expressed in mesenchyme, so any effect of TWIST2
      dose itself is mixed with the effect of the substitution. Fish have no
      eyelids or hair, so the defining features cannot be assessed.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Comparison of wild-type and mutant TWIST2 expressed in zebrafish
        identified abnormal developmental phenotypes and widespread
        transcriptome changes.
      explanation: Supports the model as informative for the transcriptional node.
    - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/153827/153827.pdf
      reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/153827/153827.pdf
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The introduction of wild- type hTWIST2 led to mild developmental defects ... in approximately 65% of injected
        zebraﬁsh
      explanation: >-
        The wild-type overexpression control itself produced abnormalities, so the comparison measures severity
        relative to an experimentally perturbed baseline.
- name: Zebrafish twist2 p.Glu78Lys base-edited knock-in
  species: Zebrafish
  genotype: >-
    twist2 c.C>T base edit giving p.Glu78Lys, the residue equivalent to human
    TWIST2 p.Glu75Lys; heterozygous and homozygous animals
  publication: PMID:33272268
  description: >-
    Knock-in of the AMS-equivalent substitution at the endogenous zebrafish twist2 locus by cytidine base editing. Homozygotes had a short trunk and curved tail and died at about 15 days post-fertilisation; heterozygotes were viable and fertile, and most developed a protruding jaw, an unclosed mouth and an emaciated body by 6 months. Homozygous embryos showed raised twist2, il1b and tnfa expression and reduced expression of bone development genes by qRT-PCR.
  modeled_mechanisms:
  - target: Craniofacial Soft-Tissue Patterning Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Heterozygous animals show an adult jaw and mouth phenotype, the closest
      model analogue of the human facial malformation.
    limitations: >-
      Fish have no eyelids, external ears, hair or nipples, so the defining
      features cannot be assessed; the jaw phenotype appears in adults rather
      than at hatching, and the report is a methods paper that describes the
      phenotype qualitatively without penetrance figures or histology.
    evidence:
    - reference: PMID:33272268
      reference_title: An optimized base editor with efficient C-to-T base editing in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        zAncBE4max successfully generated the Twist2 p.E78K mutation in
        zebrafish, recapitulating pathological features of human ablepharon
        macrostomia syndrome (AMS).
      explanation: The authors' claim that the knock-in models AMS.
    - reference: PMID:30076894
      reference_title: Programmable base editing in zebrafish using a modified CRISPR-Cas9 system.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we describe a protocol for using the base editing system in
        zebrafish and its application to reproduce a single base mutation
        observed in human Ablepharon-Macrostomia Syndrome.
      explanation: Methods paper from the same group describing the base-editing route to the AMS allele.
- name: hlh-8 Glu29 allelic series (C. elegans)
  species: Caenorhabditis elegans
  genotype: hlh-8 Glu29 substitutions equivalent to the five human TWIST1/TWIST2 disease alleles
  publication: PMID:28369379
  description: >-
    CRISPR-engineered endogenous hlh-8 Glu29 substitutions model the conserved TWIST1/TWIST2 residue. The AMS-equivalent Glu29Lys heterozygotes retained embryos and had markedly reduced egl-15 reporter expression, whereas the heterozygous frameshift-null control resembled wild-type. Homozygous Glu29Lys additionally impaired sex-myoblast proliferation more severely than the null allele. These readouts support dominant interference and a possible additional neomorphic effect, without modeling human eyelids or skin.
  modeled_mechanisms:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Models the molecular character of the residue substitution in a
      single-Twist background, separating interference with the wild-type
      product from loss of dose.
    limitations: >-
      C. elegans has one Twist homolog and none of the affected human tissues;
      the M-lineage cellular readout speaks to allele behaviour and relative
      severity, not to skin, hair or eyelid development. Binding sites were
      not mapped in this model.
    evidence:
    - reference: PMID:28369379
      reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This allelic series revealed that different substitutions exhibit
        graded severity, in terms of both gene expression and cellular
        phenotype, which we incorporate into a model explaining the various
        human disease phenotypes.
      explanation: Grades the Glu75-equivalent alleles in vivo.
    - reference: url:https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
      reference_title: "https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast the Glu29†/+ animals exhibited a range of defects with Glu29Lys/+ the most defective with nearly 100% of the population not expressing the reporter at all
      explanation: >-
        Kim et al. (2017), PMID:28369379: egl-15::gfp expression in heterozygotes compared with a recessive frameshift-null control. This is a transcriptional reporter assay, not a DNA-binding map.
experimental_models:
- name: HeLa ChIP-seq of wild-type and mutant FLAG-TWIST2
  experimental_model_type: CELL_LINE
  publication: PMID:26119818
  description: >-
    Tetracycline-inducible T-REx HeLa lines overexpressing FLAG-HA-tagged
    wild-type TWIST2 or each disease allele, including p.Glu75Lys, profiled by
    anti-FLAG ChIP-seq.
  modeled_mechanisms:
  - target: Altered TWIST2 Genomic DNA-Binding Pattern
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Direct measurement of genome-wide binding of the AMS mutant protein
      against wild-type.
    limitations: >-
      Overexpression in a cervical cancer cell line without a wild-type allele
      co-expressed at physiological ratio, and not in craniofacial or dermal
      mesenchyme, so which peaks are relevant in patient tissue is unknown.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All identified mutations fell in the basic domain of TWIST2 and altered
        the DNA-binding pattern of Flag-TWIST2 in HeLa cells.
      explanation: The measurement this model provides.
discussions:
- discussion_id: ams_residue_specific_phenotype_gap
  prompt: >-
    Why does lysine at TWIST2 residue 75 give ablepharon with sparse hair,
    when glutamine or alanine at the same residue gives ectropion with
    generalized hypertrichosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Sparse Scalp Hair
  - pathophysiology#Hair Follicle Development Deficit
  - mechanistic_hypotheses#twist2_glu75_neomorphic_binding
  rationale: >-
    The two allelic syndromes differ most in hair and in eyelid severity, yet
    no study among the references cited here has examined hair follicles,
    eyelid mesenchyme or target genes in either. The binding comparison of the
    alleles was done in HeLa cells. The hair follicle node in this entry is
    therefore hypothetical, and a residue-specific difference in target
    binding is the leading but untested explanation.
  evidence:
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The opposite hair phenotypes of the two allelic syndromes.
- discussion_id: ams_developmental_outcome_gap
  prompt: >-
    How often does molecularly confirmed AMS cause developmental delay, and is
    any delay intrinsic to TWIST2 p.Glu75Lys or secondary to visual and hearing
    impairment and prolonged hospitalisation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Developmental Delay
  rationale: >-
    Older clinically diagnosed series reported delay in about two-thirds of patients. The molecular series documents
    variable motor and language delays alongside normal development, with two individuals unassessed and one delayed
    individual having cerebral hemorrhage. Later patient-perspective reports largely describe normal cognition.
    These are different outcomes and ascertainment frames; sensory impairment and prolonged hospitalization may
    also affect development. A systematic prospective assessment of genotyped patients is lacking.
  evidence:
  - reference: PMID:11807864
    reference_title: Ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental impairment was present in two-thirds of patients but was
      usually mild.
    explanation: The higher estimate from a clinically diagnosed series.
  - reference: PMID:28690482
    reference_title: "Barber-Say Syndrome and Ablepharon-Macrostomia Syndrome: A Patient's View."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both are characterized by abnormalities in ectoderm-derived structures
      and cause a very unusual morphology of mainly the face in individuals
      with otherwise normal cognition and normal physical functioning.
    explanation: The later view, from contact with affected individuals, that cognition is normal.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her intellectual and motor development was normal.
    explanation: Normal development in an adult with molecularly confirmed AMS.
- discussion_id: ams_model_fidelity_gap
  prompt: >-
    Would a heterozygous Twist2 Glu75Lys knock-in mouse reproduce the eyelid,
    skin and hair phenotype, and which mesenchymal targets would it show to be
    lost or newly bound?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish twist2 p.Glu78Lys base-edited knock-in
  - pathophysiology#Altered TWIST2 Genomic DNA-Binding Pattern
  - pathophysiology#Craniofacial Soft-Tissue Patterning Defect
  rationale: >-
    The functional results for p.Glu75Lys come from overexpressed human
    protein (zebrafish mRNA injection, tagged protein in HeLa cells), from
    engineered alleles in the single C. elegans Twist homolog, and from one
    heterozygous zebrafish twist2 knock-in whose phenotype (jaw and mouth,
    emaciation) was described qualitatively in a methods paper. None of these
    organisms has eyelids, hair or mammalian dermis. Twist2 knockout mice
    model loss of function, which corresponds to Setleis syndrome rather than
    to this dominant allele. Whether the mechanism is dominant-negative,
    neomorphic or both cannot be settled until the allele is studied in
    mammalian mesenchyme. No mammalian knock-in model was found among the
    references cited here.
  evidence:
  - reference: PMID:20691403
    reference_title: Homozygous nonsense mutations in TWIST2 cause Setleis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, Setleis syndrome patients and Twist2 knockout mice have similar
      facial features, indicating the gene's conserved role in mammalian
      development.
    explanation: >-
      The knockout mouse matches the recessive loss-of-function disorder, not
      AMS.
- discussion_id: ams_historical_case_reclassification
  prompt: Which older reports should be excluded from the AMS phenotype spectrum?
  kind: INTERPRETATION
  status: RESOLVED
  rationale: >-
    The 2016 critical review excluded the Pellegrino chromosome-18q case (PMID:8834257), the Amor/Savarirayan CNS case (PMID:11746001), the Kallish limb-anomaly case (PMID:22002929), and the Larumbe dental/skin case (PMID:23198177). The authors considered the Kallish phenotype an acrofacial dysostosis, possibly Nager syndrome, and the Larumbe phenotype severe congenital ichthyosis. The Amor/Savarirayan and Kallish cases tested negative for TWIST2 mutations. These exclusions limit the use of older clinically assembled series for phenotype frequencies and prevent transferring case-specific findings or interventions to molecularly defined AMS.
  evidence:
  - reference: url:https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf
    reference_title: "https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient reported by Kallish et al. ... showed the phenotype of an acrofacial dysostosis, possibly Nager syndrome, and the differences to AMS were too signiﬁcant to allow inclusion.
    explanation: >-
      De Maria et al. (2016), PMID:27196381: differential reassessment of the Kallish report.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf
    reference_title: "https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lastly, the patient reported by Larumbe et al. ... clearly had severe congenital ichthyosis.
    explanation: >-
      De Maria et al. (2016), PMID:27196381: the dental/skin case is excluded from AMS.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf
    reference_title: "https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This chromosome imbalance, the less marked eye signs, the pres- ence of supernumerary nipples, cutis laxa, widely spread joint contractures, edema, and marked developmental delay and seiz- ures make it unlikely that this patient should be diagnosed as having AMS.
    explanation: >-
      De Maria et al. (2016), PMID:27196381: reasons for excluding the Pellegrino 18q-rearrangement case.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf
    reference_title: "https://pure.amsterdamumc.nl/ws/files/159999289/Barber-say-syndrome-and-ablepharon-macrostomia-syndrome-an-overview.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter two patients ... tested negatively for TWIST2 mutations
    explanation: >-
      De Maria et al. (2016), PMID:27196381: negative TWIST2 testing in two excluded cases. The review prints 2011 for Amor/Savarirayan here; the indexed report and bibliography are from 2001.
    quote_role: REVIEW_SYNTHESIS

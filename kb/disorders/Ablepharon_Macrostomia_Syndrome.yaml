  description: >-
    The facial gestalt - wide mouth with unfused commissures, first-degree
    microtia with low-set ears, depressed nasal bridge with underdeveloped
    alae, widely spaced eyes, flat or absent zygomatic arches and cheek
    pads at the mouth corners - is attributed to abnormal patterning of the
    TWIST2-expressing craniofacial mesenchyme. HYPOTHETICAL: this is the
    primary paper's stated rationale, supported in zebrafish only by
    non-specific head hypoplasia; the tissue-level mechanism of each feature is
    unstudied in AMS. The strongest model support is the heterozygous zebrafish
    twist2 p.Glu78Lys knock-in (the equivalent of human p.Glu75Lys), whose
    adults develop a protruding jaw and a mouth that does not close.

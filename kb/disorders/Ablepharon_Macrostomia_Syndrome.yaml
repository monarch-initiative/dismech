  - target: Hair Follicle Development Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - twist2_glu75_dominant_negative
    description: >-
      Under the dominant-negative model, reduced effective TWIST2 activity in
      dermal mesenchyme would impair hair follicle formation, as Twist2 loss
      does in mice. This edge is a hypothesis: no study has examined hair
      follicles in AMS, and the allelic Barber-Say substitutions cause the
      opposite hair phenotype (hypertrichosis).
    evidence:

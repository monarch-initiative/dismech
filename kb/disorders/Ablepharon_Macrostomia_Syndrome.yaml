    reference_title: "Ablepharon macrostomia syndrome with associated cutis laxa: possible localization to 18q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We review AMS and BSS as compared with our patient, and recognize cutis
      laxa as a feature shared by all.
    explanation: >-
      Clinical recognition of lax skin across AMS and BSS before the gene was
      known. The patient in this report had a chromosome 18 rearrangement and
      no molecular confirmation, so it is cited only for the review statement.
  downstream:

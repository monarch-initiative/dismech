pathophysiology:
- name: TWIST2 p.Glu75Lys Basic-Domain Substitution
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous substitution of lysine for the conserved glutamic acid at
    codon 75 of TWIST2 (NM_057179.2 c.223G>A), in the basic region of the bHLH
    domain that contacts DNA. It was the allele found in all seven AMS families
    of the gene-discovery series. Glutamine or alanine at the same residue
    gives Barber-Say syndrome instead, so the substituting amino acid, not only
    the position, sets the phenotype.
  gene:
    preferred_term: TWIST2
    term:
      id: hgnc:20670
      label: TWIST2
  genetic_context:
    gene:
      preferred_term: TWIST2
      term:
        id: hgnc:20670
        label: TWIST2
    allele_type: SNV
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous missense p.Glu75Lys (c.223G>A), mostly de novo and
      occasionally inherited from a mosaic parent. functional_impact_category
      is left unset deliberately: the primary functional study reports both
      lost wild-type binding and gained off-target binding and names a
      dominant-negative and a neomorphic mechanism as alternatives, while the
      C. elegans allelic series favours a predominantly dominant-negative
      mechanism. Picking one enum value would assert more than either source
      does; see mechanistic_hypotheses.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a recurrent de novo mutation in TWIST2 in seven independent
      AMS-affected families, as well as another recurrent de novo mutation
      affecting the same amino acid in ten independent BSS-affected families.
    explanation: The same allele recurs across unrelated AMS families.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was known for AMS with the specific genetic mutation in the gene
      TWIST2 (c.223G > A), no pathogenic sequence changes were found in both
      her parents
    explanation: Names the nucleotide change (c.223G>A) in an independently reported case.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or
      alanine yielded BSS
    explanation: >-
      The residue-level genotype-phenotype correlation that separates this
      disorder from Barber-Say syndrome.
  downstream:
  - target: Altered TWIST2 Genomic DNA-Binding Pattern
    causal_link_type: DIRECT
    description: >-
      The substituted basic domain changes where TWIST2 binds the genome.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All identified mutations fell in the basic domain of TWIST2 and altered
        the DNA-binding pattern of Flag-TWIST2 in HeLa cells.
      explanation: >-
        Links the basic-domain substitutions, including p.Glu75Lys, to altered
        DNA binding in a cell system.
- name: Altered TWIST2 Genomic DNA-Binding Pattern
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In HeLa cells overexpressing tagged TWIST2, every disease allele, including
    p.Glu75Lys, changed the genome-wide DNA-binding pattern of the protein
    relative to wild-type. The full text of the same paper describes the
    change as loss of many wild-type E-box peaks together with new peaks the
    wild-type protein does not bind; those details are not cited here (see
    the entry notes on unquoted full text).

    PROVISIONAL because this is overexpression in a non-mesenchymal cancer cell
    line. Binding in craniofacial or dermal mesenchyme, at endogenous
    expression, with the wild-type allele present, has not been measured.
  molecular_functions:
  - preferred_term: E-box binding
    term:
      id: GO:0070888
      label: E-box binding
    modifier: DECREASED
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All identified mutations fell in the basic domain of TWIST2 and altered
      the DNA-binding pattern of Flag-TWIST2 in HeLa cells.
    explanation: Direct measurement of altered DNA binding by the mutant proteins.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that autosomal-dominant TWIST2 mutations cause AMS or
      BSS by inducing protean effects on the transcription factor's DNA
      binding.
    explanation: >-
      The authors' overall conclusion that altered DNA binding is the
      disease-relevant lesion; graded HUMAN_CLINICAL because it rests on the
      patient genetics as well as the cell assay.
  downstream:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - twist2_glu75_dominant_negative
    - twist2_glu75_neomorphic_binding
    description: >-
      Mutant subunits in half of TWIST2 homodimers and bHLH heterodimers either
      fail to occupy normal targets or occupy new ones, changing transcription
      of more than one downstream gene.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Comparison of wild-type and mutant TWIST2 expressed in zebrafish
        identified abnormal developmental phenotypes and widespread
        transcriptome changes.
      explanation: >-
        Mutant TWIST2 changes developmental transcription in vivo. INDIRECT
        because it is overexpression in zebrafish embryos, not the
        heterozygous allele in human mesenchyme.
- name: Dysregulated TWIST2-Dependent Mesenchymal Transcription
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    TWIST2 is expressed in craniofacial mesenchyme and chondrogenic precursors
    during embryonic development and is thought to direct development of dermal
    and chondrogenic tissue. Expressing the AMS (p.Glu75Lys) or Barber-Say
    (p.Glu75Gln) protein in zebrafish embryos produced abnormal development and
    widespread transcriptome changes relative to wild-type TWIST2, and
    homozygous zebrafish carrying the equivalent knock-in allele showed raised
    twist2 and pro-inflammatory cytokine expression. The full text of the
    gene-discovery paper reports that extracellular matrix gene sets were the
    most reduced; that detail is not cited here.

    PROVISIONAL: the transcriptome comes from zebrafish embryos injected with
    human mRNA at the one-cell stage, which over-expresses TWIST2 globally
    rather than modelling a heterozygous allele in mesenchyme. No patient-cell
    transcriptome for p.Glu75Lys has been reported.
  cell_types:
  - preferred_term: mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  - preferred_term: fibroblast of dermis
    term:
      id: CL:0002551
      label: fibroblast of dermis
  biological_processes:

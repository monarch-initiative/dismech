      id: HP:0000491
      label: Keratitis
  evidence:
  - reference: PMID:26600791
    reference_title: A Case Report of Ablepharon-Macrostomia Syndrome with Amniotic Membrane Grafting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early amniotic membrane grafting may be done at the bedside and may help
      preserve the ocular in patients with severe eyelid deformities until more
      definitive treatment is performed.
    explanation: Amniotic membrane grafting as a temporising measure.
  - reference: PMID:29538102
    reference_title: "Use of the Masquerade Flap in Ablepharon-Macrostomia Syndrome: A Case Report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite intensive ocular lubrication, severe exposure keratopathy
      developed within the first days after birth.
    explanation: >-
      Lubrication alone failed to prevent keratopathy in a severe case,
      arguing against relying on it without early surgical cover.
  - reference: PMID:26600791
    reference_title: A Case Report of Ablepharon-Macrostomia Syndrome with Amniotic Membrane Grafting.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A hard eye shield should also be placed over each eye to prevent contact of the corneal surface.
    explanation: >-
      Protective shielding recommended in the accepted clinically diagnosed Feinstein report; molecular confirmation was not reported.
    quote_role: BACKGROUND
- name: Eyelid Reconstruction
  therapeutic_modality: SURGERY
  description: >-
    Early surgery to cover the cornea, followed by lengthening of the deficient
    anterior lamella. Reported approaches include lateral tarsorrhaphy,
    full-thickness skin grafts from the retroauricular area or prepuce placed
    over the conjunctiva-Müller muscle complex or the smooth tarsal muscles,
    masquerade flaps to close the eyes temporarily, a modified reverse
    hatchet flap, and autologous rib cartilage with fat grafting for the lower
    lid. Grafts over Müller muscle gave clear corneas at 10-15-year follow-up
    with only minor lagophthalmos. Sun protection prevented graft
    hyperpigmentation in one patient with dark skin.
  treatment_term:
    preferred_term: eyelid reconstruction
    term:
      id: NCIT:C157852
      label: Eyelid Reconstruction
  target_phenotypes:
  - preferred_term: Ablepharon
    term:
      id: HP:0011224
      label: Ablepharon
  - preferred_term: Lagophthalmos
    term:
      id: HP:0030001
      label: Lagophthalmos
  evidence:
  - reference: PMID:31373987
    reference_title: "Long-Term Results of the Surgical Management of the Upper Eyelids in \"Ablepharon\"-Macrostomia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full thickness skin grafts placed over the inner aspect of the palpebral
      conjunctiva allow permanent eye protection.
    explanation: Long-term outcome of anterior lamellar lengthening with skin grafts.
  - reference: PMID:39792429
    reference_title: Upper and lower eyelid contour and positional changes after deep skin grafts in ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new AMS case with a quantitative analysis of palpebral
      fissure changes following skin grafts over the upper and lower smooth
      tarsal muscles and lateral tarsorrhaphy.
    explanation: Grafting over the tarsal muscles with lateral tarsorrhaphy.
  - reference: PMID:29538102
    reference_title: "Use of the Masquerade Flap in Ablepharon-Macrostomia Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a secondary procedure at the adjusted age of 3 weeks, the flaps were
      partially divided, and visual input and development were successfully
      achieved, while maintaining corneal protection.
    explanation: Masquerade flaps for temporary closure, then division for visual input.
  - reference: PMID:38967579
    reference_title: Modified Reverse Hatchet Flap for Ablepharon-Macrostomia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a novel approach to multiplanar eyelid reconstruction in
      ablepharon-macrostomia syndrome involving use of a modified reverse
      hatchet flap in 1 lower eyelid along with division at the eyelid margin,
      recession of the eyelid retractors in conjunction with preputial skin
      grafting for anterior lamellar restoration in the other 3 eyelids.
    explanation: Flap and preputial skin graft reconstruction.
  - reference: PMID:33055564
    reference_title: "Ablepharon Macrostomia Syndrome: Rib Cartilage and Fat Grafting for Lower Lid Reconstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

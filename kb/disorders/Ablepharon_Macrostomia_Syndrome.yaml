mechanistic_hypotheses:
- hypothesis_group_id: twist2_glu75_dominant_negative
  hypothesis_label: Glu75Lys interferes with the wild-type TWIST2 pool
  status: EMERGING
  description: >-
    Mutant TWIST2 is proposed to sequester wild-type TWIST2 or other bHLH partners in transcriptionally ineffective complexes. Residual DNA binding is possible, so this model does not require complete loss of promoter occupancy. In C. elegans, the AMS-equivalent Glu29Lys heterozygote perturbs egg laying and target-gene expression while the heterozygous frameshift-null control resembles wild-type. This favors dominant interference over simple dose reduction in that model. It remains unresolved in human craniofacial and dermal tissues, and is not mutually exclusive with a neomorphic effect.
  evidence:
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The genetic analysis favors a predominantly dominant-negative mechanism
      for the action of amino acid substitutions at this highly conserved
      glutamic acid residue
    explanation: >-
      Conclusion of the C. elegans allelic series, which included p.Glu75Lys
      engineered at the equivalent hlh-8 residue.
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The resemblance between the three syndromes is considerable, and likely
      differences seem larger than they actually are due to insufficiently
      complete evaluation for all characteristics of the three entities in the
      past.
    explanation: >-
      Clinical overlap between AMS, Barber-Say and the loss-of-function
      disorder Setleis syndrome. INDIRECT: resemblance to a loss-of-function
      phenotype is consistent with, not proof of, a dominant-negative effect.
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Heterozygous localized TWIST1 and TWIST2 basic domain substitutions exert
      antimorphic effects to cause Sweeney-Cox syndrome, Barber-Say syndrome,
      and ablepharon-macrostomia syndrome, respectively.
    explanation: >-
      A later TWIST1 case report restates the Glu75 alleles as antimorphic,
      summarising the earlier functional work rather than adding new data.
  - reference: url:https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
    reference_title: "https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results from these two target genes in heterozygous mutants indicate that Glu29Gln, Glu29Ala, and Glu29Lys are the most likely to represent dominantWnegative proteins that interfere with the ability of WT HLHW8 to promote transcription of egl-15.
    explanation: >-
      Kim et al. (2017), PMID:28369379: author interpretation of heterozygous reporter experiments. The accepted-manuscript PDF extracts hyphens as W in these words.
- hypothesis_group_id: twist2_glu75_neomorphic_binding
  hypothesis_label: Glu75Lys gives TWIST2 new genomic targets
  status: EMERGING
  description: >-
    Mutant TWIST2 may alter transcription by binding sites that wild-type protein does not occupy. Mutant-only ChIP-seq peaks directly support altered genomic occupancy in HeLa cells. Whether those new targets drive the tissue-specific phenotype, rather than loss of normal binding or both effects, remains unresolved. The worm Glu29Lys allele also produces a sex-myoblast proliferation defect more severe than the null, which the authors interpret as possible interference with another bHLH pathway; this does not establish a specific new human target.
  evidence:
  - reference: PMID:33272268
    reference_title: An optimized base editor with efficient C-to-T base editing in zebrafish.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Previous studies have shown that the E75K mutation in twsit2 altered the
      DNA binding activity of itself, leading to both gain of function and
      dominant-negative effects.
    explanation: >-
      Restates the earlier binding studies of p.Glu75Lys as showing a gain of
      function alongside the dominant-negative effect. Graded IN_VITRO for the
      cell-based binding work it summarises.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, a genotype-phenotype correlation was observed, because the two
      syndromes differed based solely upon the nature of the substituting
      amino acid: a lysine at TWIST2 residue 75 resulted in AMS, whereas a
      glutamine or alanine yielded BSS.
    explanation: >-
      Different substitutions at one residue give different syndromes, which
      a residue-specific change in target binding would explain. INDIRECT
      because the correlation does not itself show new binding.
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/153827/153827.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/153827/153827.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A signiﬁcant number of binding peaks detected for the mutant TWIST2 proteins were not detected for the wild-type
      protein
    explanation: >-
      Marchegiani et al. (2015), PMID:26119818: direct binding evidence underlying the neomorphic hypothesis; disease
      mediation remains proposed.
  - reference: url:https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6
    reference_title: "https://ora.ox.ac.uk/objects/uuid%3A0b9cf8b9-01b4-43b7-95b4-b9c68ea74406/files/mf135269e0a132704a438813780ba4af6"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This observation suggests that besides the dominant negative nature of most of these hlh-8 alleles, some may be acting as neomorphic alleles and interfering with genetic pathways normally not associated with HLHW8 regulation.
    explanation: >-
      Kim et al. (2017), PMID:28369379: hypothesis arising from the unusual Glu29Lys sex-myoblast proliferation phenotype. A specific partner or human target was not established.

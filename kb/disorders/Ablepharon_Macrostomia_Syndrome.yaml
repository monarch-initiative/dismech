  - reference: PMID:33994357
    reference_title: Zebrafish twist2/dermo1 regulates scale shape and scale organization during skin development and regeneration.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our knockout analysis reveals that twist2/dermo1 gene functions in the

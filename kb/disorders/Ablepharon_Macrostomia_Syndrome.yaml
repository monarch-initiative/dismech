- name: Sweeney-Cox syndrome
  description: >-
    Autosomal dominant TWIST1 disorder caused by substitutions at Glu117, the
    paralogous residue to TWIST2 Glu75. It shares ablepharon or eyelid
    underdevelopment, hypertelorism and cheek pads with AMS, and adds
    frontonasal dysplasia and, in some patients, craniosynostosis. Sequencing
    TWIST1 and TWIST2 separates them.
  disease_term:
    preferred_term: Sweeney-Cox syndrome
    term:
      id: MONDO:0060592
      label: Sweeney-Cox syndrome
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sweeney-Cox syndrome, Barber-Say syndrome, and ablepharon-macrostomia
      syndrome share the facial features of ablepharon, hypertelorism,
      underdevelopment of the eyelids, and cheek pads adjacent to the corners
      of the mouth.
    explanation: The shared facial features of the TWIST1 and TWIST2 basic-domain disorders.
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a new clinical entity, Sweeney-Cox syndrome, associated
      with distinct de novo amino acid substitutions (p.Glu117Val and
      p.Glu117Gly) at a highly conserved glutamic acid residue located in the
      basic DNA binding domain of TWIST1, in two subjects with frontonasal
      dysplasia and additional malformations.
    explanation: Defines the paralogous TWIST1 disorder.
treatments:
- name: Ocular Surface Protection
  description: >-
    Urgent protection of the exposed cornea with intensive lubrication and a protective eye shield while arranging definitive lid reconstruction. A bedside amniotic membrane graft has been used as a temporary measure, although migration and corneal melting occurred in one severely affected infant. Lubrication alone may fail within days in severe cases.
  treatment_term:
    preferred_term: ocular lubrication and corneal protection
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:

- name: Hair Follicle Development Deficit
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Sparse or absent scalp hair, eyebrows, eyelashes and lanugo are consistent
    features of AMS and separate it from Barber-Say syndrome, in which the same
    residue substituted by glutamine or alanine gives generalized
    hypertrichosis. Twist2 is expressed in dermal mesenchyme and is required
    for normal hair follicle formation in mice, so impaired follicle induction
    is the most direct candidate mechanism. HYPOTHETICAL: no hair or scalp
    histology from an AMS patient has been reported, and the opposite hair
    phenotypes of the two allelic syndromes show that the lesion is not simple
    loss of TWIST2 function.
  locations:

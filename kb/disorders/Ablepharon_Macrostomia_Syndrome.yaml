- name: Dermal Extracellular Matrix Disorganization
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Skin electron microscopy in affected individuals showed thin, elongated or disrupted elastic fibers, disordered
    collagen orientation and microfibrillar or amorphous deposits. Reticulodermal collagen staining was abnormal
    in AMS-7.1 and AMS-7.2, although elastic-fiber staining appeared normal. The tissue abnormality is directly
    observed; its precise causal relation to TWIST2 target-gene changes and the clinical skin phenotype remains
    provisional.
  locations:

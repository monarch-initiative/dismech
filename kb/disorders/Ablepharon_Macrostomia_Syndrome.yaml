      eyelids, macrostomia, ear anomalies, absent lanugo and hair, redundant
      skin, abnormal genitalia, and developmental delay in two-thirds of the
      reported patients.
    explanation: The same two-thirds estimate, restated for the reported patients up to 2011.
  notes: >-
    FREQUENT reflects the two-thirds figure from clinically diagnosed patients
    reported before the gene was known. Later sources describe normal
    cognition in most individuals with AMS or Barber-Say syndrome
    (PMID:28690482), so the true frequency in genotyped patients may be lower;
    see the discussion on developmental outcome.
- category: Growth
  name: Growth Delay
  description: Poor growth and low birth weight; failure to thrive requiring gastrostomy in one infant.
  phenotype_term:
    preferred_term: Growth retardation
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:11807864
    reference_title: Ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss, poor hair growth, finger contractures, and growth
      retardation were also chronic problems.
    explanation: Growth retardation as a chronic problem.
  - reference: PMID:26600791
    reference_title: A Case Report of Ablepharon-Macrostomia Syndrome with Amniotic Membrane Grafting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemically, the patient could not thrive properly with weight loss
      requiring the placement of a gastric tube.
    explanation: Failure to thrive in a severely affected infant.
- category: Respiratory
  name: Laryngotracheal Stenosis
  description: >-
    Reported once, in a 37-year-old woman with confirmed c.223G>A who had had
    17 operations under intubation; the authors could not establish whether
    the stenosis was congenital or acquired. It was managed with temporary
    tracheostomy and corticosteroids.
  phenotype_term:
    preferred_term: Laryngotracheal stenosis
    term:
      id: HP:0004894
      label: Laryngotracheal stenosis
  evidence:
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To our knowledge, this is the first patient affected by AMS presenting
      with laryngo-tracheal stenosis.
    explanation: Single case report; attribution to AMS is uncertain.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A definite etiology of the laryngo-tracheal stenosis could not therefore
      be established.
    explanation: >-
      The authors note that repeated intubation may have contributed, so the
      stenosis may not be a primary feature.
genetic:
- name: TWIST2
  gene_term:
    preferred_term: TWIST2
    term:
      id: hgnc:20670
      label: TWIST2
  association: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    Heterozygous c.223G>A (p.Glu75Lys; NM_057179.2) in the basic domain, found
    in all seven AMS families of the gene-discovery series and in later
    confirmed cases. Mostly de novo; transmitted from mildly affected parents
    in a few families. Somatic mosaicism gives a milder phenotype. Glutamine
    or alanine at the same residue causes Barber-Say syndrome, and biallelic
    nonsense alleles cause Setleis syndrome.
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a recurrent de novo mutation in TWIST2 in seven independent
      AMS-affected families, as well as another recurrent de novo mutation
      affecting the same amino acid in ten independent BSS-affected families.
    explanation: The recurrent de novo AMS allele across unrelated families.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was known for AMS with the specific genetic mutation in the gene
      TWIST2 (c.223G > A), no pathogenic sequence changes were found in both
      her parents
    explanation: An independently reported de novo c.223G>A case.
  - reference: PMID:34092176
    reference_title: Ocular adnexal phenotype and management of a patient with mosaic expression of a mutation in TWIST2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaic expression of TWIST2 variants is correlated with a less severe
      phenotype than that reported for the typical expression of TWIST2
      variants associated with BSS or AMS.
    explanation: Somatic mosaicism gives a milder phenotype.
  - reference: PMID:24115501
    reference_title: "Ablepharon macrostomia syndrome: A distinct genetic entity clinically related to the group of FRAS-FREM complex disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutation in either of these genes was found in a cohort of 11 patients
      with AMS from 10 unrelated families.
    explanation: >-
      Before TWIST2 was identified, the Fraser syndrome genes (FRAS1, FREM2,
      GRIP1) and FRAS1 partners were excluded in a clinically diagnosed AMS
      cohort.
  notes: >-
    No ClinGen gene-disease validity assertion exists for TWIST2 and AMS (see
    the entry-level notes). No AMS-causing TWIST2 allele other than
    p.Glu75Lys was found among the references cited here.
diagnosis:
- name: TWIST2 Sequencing With Parental Testing
  description: >-
    The diagnosis is clinical at birth and is confirmed by sequencing TWIST2.
    Because the substituting amino acid at Glu75 distinguishes AMS from
    Barber-Say syndrome, the report should name the variant. Testing both
    parents establishes de novo or inherited origin; a mildly affected parent
    may be mosaic.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, a genotype-phenotype correlation was observed, because the two
      syndromes differed based solely upon the nature of the substituting
      amino acid: a lysine at TWIST2 residue 75 resulted in AMS, whereas a
      glutamine or alanine yielded BSS.
    explanation: Why the reported variant must name the substituting amino acid.
  - reference: PMID:34092176
    reference_title: Ocular adnexal phenotype and management of a patient with mosaic expression of a mutation in TWIST2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe the phenotype of a patient with mosaic expression of a
      TWIST2 mutation that is typically associated with AMS.
    explanation: Mosaic carriers of the AMS allele exist and present more mildly.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was known for AMS with the specific genetic mutation in the gene
      TWIST2 (c.223G > A), no pathogenic sequence changes were found in both
      her parents
    explanation: Proband and parental testing establishing a de novo variant.
- name: Prenatal Ultrasound
  description: >-
    AMS has been suspected on prenatal ultrasound in the child of an affected
    father; the abstract does not state which features were seen.
  diagnosis_term:
    preferred_term: Fetal ultrasound imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:21595001
    reference_title: Evidence for autosomal dominant inheritance of ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases likely represent the 16th and 17th reported cases of AMS and
      the first case suspected on prenatal ultrasound.
    explanation: First prenatal suspicion of AMS by ultrasound.
differential_diagnoses:
- name: Barber-Say syndrome
  description: >-
    Allelic TWIST2 disorder caused by p.Glu75Gln or p.Glu75Ala at the same
    residue. Shares macrostomia, eyelid underdevelopment, cheek pads, ear,
    nipple and genital anomalies; distinguished by generalized hypertrichosis
    and mostly ectropion rather than ablepharon, whereas AMS has sparse scalp
    hair. The variant settles the call.
  disease_term:
    preferred_term: Barber-Say syndrome
    term:
      id: MONDO:0008853
      label: Barber-Say syndrome
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or
      alanine yielded BSS
    explanation: The molecular discriminator between the two syndromes.
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The hair phenotype that separates the two clinically.
  - reference: PMID:11807864
    reference_title: Ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It also adds further evidence that AMS is distinct from Barber-Say
      syndrome, which has similar features.
    explanation: Clinical argument for separating the two before the gene was known.
  - reference: PMID:19760652
    reference_title: Case report supporting that the Barber-Say and ablepharon macrostomia syndromes could represent one disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other authors have discussed that BSS and AMS could possibly represent one
      syndrome, and our report supports this hypothesis.
    explanation: The lumping argument, recorded because it bears on the split.
- name: Fraser syndrome
  description: >-
    Autosomal recessive FRAS-FREM complex disorder (FRAS1, FREM2, GRIP1) with
    cryptophthalmos, cutaneous syndactyly, genital and renal anomalies and
    laryngeal malformations. Its craniofacial and genital pattern overlaps
    closely with AMS, and one family with an AMS-like phenotype carried
    biallelic FRAS1 variants. In AMS the eyelids are short rather than fused
    over the globe, inheritance is dominant, and the Fraser genes were
    excluded in a clinically diagnosed AMS cohort.
  disease_term:
    preferred_term: Fraser syndrome
    term:
      id: MONDO:0009046
      label: Fraser syndrome
  evidence:
  - reference: PMID:24115501
    reference_title: "Ablepharon macrostomia syndrome: A distinct genetic entity clinically related to the group of FRAS-FREM complex disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings demonstrate that AMS is genetically distinct from FS.
    explanation: Exclusion of the Fraser syndrome genes in an AMS cohort.
  - reference: PMID:17163535
    reference_title: "Fraser and Ablepharon macrostomia phenotypes: concurrence in one family and association with mutated FRAS1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that a phenotype resembling AMS is a rare clinical expression
      of FS with no obvious genotype-phenotype correlation.
    explanation: An AMS-like phenotype caused by biallelic FRAS1 variants.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngo-tracheal anomalies do not belong to the AMS phenotype
    explanation: >-
      The authors contrast AMS with Fraser syndrome, in which laryngotracheal
      anomalies are common.
- name: Setleis syndrome (focal facial dermal dysplasia type III)
  description: >-
    Autosomal recessive TWIST2 disorder caused by biallelic truncating
    variants, with bitemporal scar-like lesions and eyelash and eyebrow
    abnormalities. It overlaps facially with AMS, but its inheritance, its
    loss-of-function mechanism and the focal temporal lesions distinguish it.
  disease_term:
    preferred_term: Setleis syndrome
    term:
      id: MONDO:0009203
      label: focal facial dermal dysplasia type III
  evidence:
  - reference: PMID:20691403
    reference_title: Homozygous nonsense mutations in TWIST2 cause Setleis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous TWIST2 nonsense mutations, c.324C>T and c.486C>T, were
      identified in the affected members of the Arab and PR families,
      respectively.
    explanation: Biallelic TWIST2 truncation as the cause of Setleis syndrome.
  - reference: PMID:36942595
    reference_title: De novo triplication at 1p36.23p36.22 further refines the dosage sensitive region of overlap in Setleis syndrome (focal facial dermal dysplasia type III).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Setleis syndrome (SS), or focal facial dermal dysplasia type III (FFDD3,
      MIM #227260), is an autosomal recessive condition caused by biallelic
      loss-of-function variants in TWIST2.
    explanation: Restates the recessive loss-of-function basis of Setleis syndrome.
  - reference: PMID:28663233
    reference_title: "The focal facial dermal dysplasias: phenotypic spectrum and molecular genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the overlapping facial abnormalities in FFDD3 and two other genetic
      disorders, Ablepharon macrostomia syndrome and Barber-Say syndrome, are
      noted
    explanation: Review noting facial overlap between Setleis syndrome and AMS.
- name: Sweeney-Cox syndrome
  description: >-
    Autosomal dominant TWIST1 disorder caused by substitutions at Glu117, the
    paralogous residue to TWIST2 Glu75. It shares ablepharon or eyelid
    underdevelopment, hypertelorism and cheek pads with AMS, and adds
    frontonasal dysplasia and, in some patients, craniosynostosis. Sequencing
    TWIST1 and TWIST2 separates them.
  disease_term:
    preferred_term: Sweeney-Cox syndrome
    term:
      id: MONDO:0060592
      label: Sweeney-Cox syndrome
  evidence:
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sweeney-Cox syndrome, Barber-Say syndrome, and ablepharon-macrostomia
      syndrome share the facial features of ablepharon, hypertelorism,
      underdevelopment of the eyelids, and cheek pads adjacent to the corners
      of the mouth.
    explanation: The shared facial features of the TWIST1 and TWIST2 basic-domain disorders.
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a new clinical entity, Sweeney-Cox syndrome, associated
      with distinct de novo amino acid substitutions (p.Glu117Val and
      p.Glu117Gly) at a highly conserved glutamic acid residue located in the
      basic DNA binding domain of TWIST1, in two subjects with frontonasal
      dysplasia and additional malformations.
    explanation: Defines the paralogous TWIST1 disorder.
treatments:
- name: Ocular Surface Protection
  description: >-
    Started at birth: intensive lubrication, topical antibiotics and
    protection of the exposed cornea as a bridge to lid surgery. A bedside
    amniotic membrane graft has been used to hold the corneal surface until
    definitive reconstruction, though in one late-presenting infant it could
    not prevent corneal melting. Lubrication alone may fail within days in
    severe cases.
  treatment_term:
    preferred_term: ocular lubrication and corneal protection
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Exposure keratitis
    term:
      id: HP:0000491
      label: Keratitis
  evidence:
  - reference: PMID:26600791
    reference_title: A Case Report of Ablepharon-Macrostomia Syndrome with Amniotic Membrane Grafting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early amniotic membrane grafting may be done at the bedside and may help
      preserve the ocular in patients with severe eyelid deformities until more
      definitive treatment is performed.
    explanation: Amniotic membrane grafting as a temporising measure.
  - reference: PMID:23198177
    reference_title: Clinical variant of ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eye lubricants and antibiotics are used since birth and plastic
      reconstruction of the eyelids is usually performed with variable results.
    explanation: Lubrication and topical antibiotics from birth.
  - reference: PMID:29538102
    reference_title: "Use of the Masquerade Flap in Ablepharon-Macrostomia Syndrome: A Case Report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite intensive ocular lubrication, severe exposure keratopathy
      developed within the first days after birth.
    explanation: >-
      Lubrication alone failed to prevent keratopathy in a severe case,
      arguing against relying on it without early surgical cover.
- name: Eyelid Reconstruction
  therapeutic_modality: SURGERY
  description: >-
    Early surgery to cover the cornea, followed by lengthening of the deficient
    anterior lamella. Reported approaches include lateral tarsorrhaphy,
    full-thickness skin grafts from the retroauricular area or prepuce placed
    over the conjunctiva-Müller muscle complex or the smooth tarsal muscles,
    masquerade flaps to close the eyes temporarily, a modified reverse
    hatchet flap, and autologous rib cartilage with fat grafting for the lower
    lid. Grafts over Müller muscle gave clear corneas at 10-15-year follow-up
    with only minor lagophthalmos. Sun protection prevented graft
    hyperpigmentation in one patient with dark skin.
  treatment_term:
    preferred_term: eyelid reconstruction
    term:
      id: NCIT:C157852
      label: Eyelid Reconstruction
  target_phenotypes:
  - preferred_term: Ablepharon
    term:
      id: HP:0011224
      label: Ablepharon
  - preferred_term: Lagophthalmos
    term:
      id: HP:0030001
      label: Lagophthalmos
  evidence:
  - reference: PMID:31373987
    reference_title: "Long-Term Results of the Surgical Management of the Upper Eyelids in \"Ablepharon\"-Macrostomia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full thickness skin grafts placed over the inner aspect of the palpebral
      conjunctiva allow permanent eye protection.
    explanation: Long-term outcome of anterior lamellar lengthening with skin grafts.
  - reference: PMID:39792429
    reference_title: Upper and lower eyelid contour and positional changes after deep skin grafts in ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new AMS case with a quantitative analysis of palpebral
      fissure changes following skin grafts over the upper and lower smooth
      tarsal muscles and lateral tarsorrhaphy.
    explanation: Grafting over the tarsal muscles with lateral tarsorrhaphy.
  - reference: PMID:29538102
    reference_title: "Use of the Masquerade Flap in Ablepharon-Macrostomia Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a secondary procedure at the adjusted age of 3 weeks, the flaps were
      partially divided, and visual input and development were successfully
      achieved, while maintaining corneal protection.
    explanation: Masquerade flaps for temporary closure, then division for visual input.
  - reference: PMID:38967579
    reference_title: Modified Reverse Hatchet Flap for Ablepharon-Macrostomia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a novel approach to multiplanar eyelid reconstruction in
      ablepharon-macrostomia syndrome involving use of a modified reverse
      hatchet flap in 1 lower eyelid along with division at the eyelid margin,
      recession of the eyelid retractors in conjunction with preputial skin
      grafting for anterior lamellar restoration in the other 3 eyelids.
    explanation: Flap and preputial skin graft reconstruction.
  - reference: PMID:33055564
    reference_title: "Ablepharon Macrostomia Syndrome: Rib Cartilage and Fat Grafting for Lower Lid Reconstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The authors report the first case of autologous rib cartilage grafting
      and fat grafting for lower eyelid reconstruction in a patient with AMS.
    explanation: Rib cartilage and fat grafting for the lower lid.
  - reference: PMID:4003491
    reference_title: Ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In one such patient we were able to reconstruct the eyelids in a
      three-stage procedure. Redundant skin from the retroauricular area was
      used to create full-thickness grafts.
    explanation: Staged reconstruction with retroauricular full-thickness grafts.
  - reference: PMID:3293678
    reference_title: "A new feature of the ablepharon macrostomia syndrome: zygomatic arch absence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin graft pigmentation in this black patient has been prevented by
      prolonged application of sun block.
    explanation: Aftercare preventing graft hyperpigmentation.
- name: Penetrating Keratoplasty
  therapeutic_modality: SURGERY
  description: >-
    Bilateral penetrating keratoplasty, combined with full-thickness lid
    reconstruction and temporary tarsorrhaphy, in an infant whose corneas
    melted from exposure; she tracked light binocularly at five and a half
    months. A salvage procedure reported once.
  treatment_term:
    preferred_term: penetrating keratoplasty
    term:
      id: NCIT:C222070
      label: Penetrating Keratoplasty
  target_phenotypes:
  - preferred_term: Corneal ulceration
    term:
      id: HP:0012804
      label: Corneal ulceration
  evidence:
  - reference: PMID:26600791
    reference_title: A Case Report of Ablepharon-Macrostomia Syndrome with Amniotic Membrane Grafting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive surgical reconstruction of both eyelids and bilateral
      penetrating keratoplasty was ultimately performed successfully to protect
      the ocular surfaces while trying to maximize the visual potential.
    explanation: Keratoplasty with lid reconstruction after corneal melting.
- name: Reconstruction of the Mouth and Face
  therapeutic_modality: SURGERY
  description: >-
    Repair of the macrostomia by oral and maxillofacial surgery, and further
    reconstructive and cosmetic procedures over childhood and adulthood:
    one adult with confirmed AMS had 17 maxillofacial operations, including
    ear-lobe reconstruction, lip correction and breast surgery. Botulinum toxin
    and acellular dermis grafting have been used to improve appearance.
  treatment_term:
    preferred_term: reconstructive surgery of mouth and face
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  target_phenotypes:
  - preferred_term: Macrostomia
    term:
      id: HP:0000154
      label: Wide mouth
  evidence:
  - reference: PMID:4003491
    reference_title: Ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The child later underwent successful mouth reconstruction.
    explanation: Surgical repair of the macrostomia.
  - reference: PMID:23198177
    reference_title: Clinical variant of ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macrostomia has been treated in several cases by the oral and
      maxillofacial surgeon.
    explanation: Surgical treatment of macrostomia across reported cases.
  - reference: PMID:23198177
    reference_title: Clinical variant of ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Improvement of overall physical appearance has been obtained with
      botulinum toxin application and acellular dermis grafting.
    explanation: Adjunctive cosmetic treatments reported for AMS.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient underwent 17 previously maxillofacial operations requiring
      intubation, including multiple surgeries for eyelids and ears lobes
      reconstruction, mastoplasty for mammary glands absence and lips
      correction.
    explanation: The cumulative surgical burden in one adult with confirmed AMS.
- name: Multidisciplinary Care and Psychosocial Support
  description: >-
    Care coordinated across ophthalmology and oculoplastics, plastic and
    maxillofacial surgery, ENT and audiology, dermatology, dentistry, genetics,
    paediatrics and psychology. Because cognition is usually normal and the
    facial difference is marked, affected individuals emphasise attention to
    appearance and quality of life.
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:23198177
    reference_title: Clinical variant of ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A team composed of a pediatrician, a pediatric dentist, an oral and
      maxillofacial surgeon, an ENT, a plastic surgeon, a dermatologist, an
      ophthalmologist, and a psychologist is needed in order to perform the
      most comprehensive treatment as possible.
    explanation: The specialties involved in care.
  - reference: PMID:28690482
    reference_title: "Barber-Say Syndrome and Ablepharon-Macrostomia Syndrome: A Patient's View."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The importance of paying particular attention to the management of both
      the physical appearance and the consequences of these entities on the
      quality of life is stressed by the affected individuals themselves.
    explanation: Patient-reported priorities for psychosocial care.
- name: Genetic Counseling
  description: >-
    Counselling after TWIST2 testing of the proband and both parents. Most
    cases are de novo, but a parent can be mildly affected or mosaic, so an
    apparently unaffected parent does not exclude recurrence. As for any
    autosomal dominant disorder, the risk to a child of a non-mosaic affected
    adult is 50 percent.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:21595001
    reference_title: Evidence for autosomal dominant inheritance of ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the child shows more prominent features of the disorder
      when compared to her father documenting variable expression and possible
      anticipation.
    explanation: A mildly affected transmitting parent, the case parental testing is meant to detect.
  - reference: PMID:34092176
    reference_title: Ocular adnexal phenotype and management of a patient with mosaic expression of a mutation in TWIST2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaic expression of TWIST2 variants is correlated with a less severe
      phenotype than that reported for the typical expression of TWIST2
      variants associated with BSS or AMS.
    explanation: A mosaic parent may be only mildly affected.
animal_models:
- name: Zebrafish embryos injected with mutant human TWIST2 mRNA
  species: Zebrafish
  genotype: >-
    Wild-type embryos injected at the one-cell stage with human TWIST2 mRNA
    (wild-type, p.Glu75Lys or p.Glu75Gln); stable Cre-inducible transgenic
    lines confirmed the phenotypes
  publication: PMID:26119818
  description: >-
    Overexpression model used to compare wild-type and mutant TWIST2 in vivo.
    The mutant proteins, including p.Glu75Lys, produced abnormal development
    and widespread transcriptome changes compared with wild-type.
  modeled_mechanisms:
  - target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that p.Glu75Lys changes developmental transcription relative to
      wild-type TWIST2.
    limitations: >-
      Global overexpression of human mRNA from the one-cell stage, not a
      heterozygous allele expressed in mesenchyme, so any effect of TWIST2
      dose itself is mixed with the effect of the substitution. Fish have no
      eyelids or hair, so the defining features cannot be assessed.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Comparison of wild-type and mutant TWIST2 expressed in zebrafish
        identified abnormal developmental phenotypes and widespread
        transcriptome changes.
      explanation: Supports the model as informative for the transcriptional node.
- name: Zebrafish twist2 p.Glu78Lys base-edited knock-in
  species: Zebrafish
  genotype: >-
    twist2 c.C>T base edit giving p.Glu78Lys, the residue equivalent to human
    TWIST2 p.Glu75Lys; heterozygous and homozygous animals
  publication: PMID:33272268
  description: >-
    Knock-in of the AMS-equivalent substitution at the endogenous zebrafish
    twist2 locus by cytidine base editing. Homozygotes had a short trunk and
    curved tail and died at about 15 days post-fertilisation; heterozygotes
    were viable and fertile, and most developed a protruding jaw, an unclosed
    mouth and an emaciated body by 6 months. Homozygous embryos showed raised
    twist2, il1b and tnfa expression and reduced expression of bone
    development genes by qRT-PCR. It is the only model that carries the
    disease residue in the endogenous gene and in heterozygous form.
  modeled_mechanisms:
  - target: Craniofacial Soft-Tissue Patterning Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Heterozygous animals show an adult jaw and mouth phenotype, the closest
      model analogue of the human facial malformation.
    limitations: >-
      Fish have no eyelids, external ears, hair or nipples, so the defining
      features cannot be assessed; the jaw phenotype appears in adults rather
      than at hatching, and the report is a methods paper that describes the
      phenotype qualitatively without penetrance figures or histology.
    evidence:
    - reference: PMID:33272268
      reference_title: An optimized base editor with efficient C-to-T base editing in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        zAncBE4max successfully generated the Twist2 p.E78K mutation in
        zebrafish, recapitulating pathological features of human ablepharon
        macrostomia syndrome (AMS).
      explanation: The authors' claim that the knock-in models AMS.
    - reference: PMID:30076894
      reference_title: Programmable base editing in zebrafish using a modified CRISPR-Cas9 system.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we describe a protocol for using the base editing system in
        zebrafish and its application to reproduce a single base mutation
        observed in human Ablepharon-Macrostomia Syndrome.
      explanation: Methods paper from the same group describing the base-editing route to the AMS allele.
- name: hlh-8 Glu29 allelic series (C. elegans)
  species: Caenorhabditis elegans
  genotype: hlh-8 Glu29 substitutions equivalent to the five human TWIST1/TWIST2 disease alleles
  publication: PMID:28369379
  description: >-
    The TWIST2 Glu75 alleles, including p.Glu75Lys, and the TWIST1 Glu117
    Sweeney-Cox alleles were engineered into the equivalent Glu29 residue of
    hlh-8, the single Twist homolog in C. elegans. The alleles graded in
    severity by gene expression and cellular phenotype, and the genetics
    favoured a predominantly dominant-negative mechanism.
  modeled_mechanisms:
  - target: Altered TWIST2 Genomic DNA-Binding Pattern
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Models the molecular character of the residue substitution in a
      single-Twist background, separating interference with the wild-type
      product from loss of dose.
    limitations: >-
      C. elegans has one Twist homolog and none of the affected human tissues;
      the M-lineage cellular readout speaks to allele behaviour and relative
      severity, not to skin, hair or eyelid development. Binding sites were
      not mapped in this model.
    evidence:
    - reference: PMID:28369379
      reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This allelic series revealed that different substitutions exhibit
        graded severity, in terms of both gene expression and cellular
        phenotype, which we incorporate into a model explaining the various
        human disease phenotypes.
      explanation: Grades the Glu75-equivalent alleles in vivo.
experimental_models:
- name: HeLa ChIP-seq of wild-type and mutant FLAG-TWIST2
  experimental_model_type: CELL_LINE
  publication: PMID:26119818
  description: >-
    Tetracycline-inducible T-REx HeLa lines overexpressing FLAG-HA-tagged
    wild-type TWIST2 or each disease allele, including p.Glu75Lys, profiled by
    anti-FLAG ChIP-seq.
  modeled_mechanisms:
  - target: Altered TWIST2 Genomic DNA-Binding Pattern
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Direct measurement of genome-wide binding of the AMS mutant protein
      against wild-type.
    limitations: >-
      Overexpression in a cervical cancer cell line without a wild-type allele
      co-expressed at physiological ratio, and not in craniofacial or dermal
      mesenchyme, so which peaks are relevant in patient tissue is unknown.
    evidence:
    - reference: PMID:26119818
      reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        All identified mutations fell in the basic domain of TWIST2 and altered
        the DNA-binding pattern of Flag-TWIST2 in HeLa cells.
      explanation: The measurement this model provides.
discussions:
- discussion_id: ams_residue_specific_phenotype_gap
  prompt: >-
    Why does lysine at TWIST2 residue 75 give ablepharon with sparse hair,
    when glutamine or alanine at the same residue gives ectropion with
    generalized hypertrichosis?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Sparse Scalp Hair
  - pathophysiology#Hair Follicle Development Deficit
  - mechanistic_hypotheses#twist2_glu75_neomorphic_binding
  rationale: >-
    The two allelic syndromes differ most in hair and in eyelid severity, yet
    no study among the references cited here has examined hair follicles,
    eyelid mesenchyme or target genes in either. The binding comparison of the
    alleles was done in HeLa cells. The hair follicle node in this entry is
    therefore hypothetical, and a residue-specific difference in target
    binding is the leading but untested explanation.
  evidence:
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The opposite hair phenotypes of the two allelic syndromes.
- discussion_id: ams_developmental_outcome_gap
  prompt: >-
    How often does molecularly confirmed AMS cause developmental delay, and is
    any delay intrinsic to TWIST2 p.Glu75Lys or secondary to visual and hearing
    impairment and prolonged hospitalisation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Mild Developmental Delay
  rationale: >-
    The clinically diagnosed series before 2015 reported delay in about
    two-thirds of patients, whereas later accounts, including an adult with
    molecularly confirmed AMS, describe normal cognition and development. The early
    cohorts probably included phenocopies (a FRAS1 family had an AMS-like
    phenotype), and early corneal exposure and hearing loss can delay
    development independently. No cohort has assessed development
    systematically in genotyped patients.
  evidence:
  - reference: PMID:11807864
    reference_title: Ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental impairment was present in two-thirds of patients but was
      usually mild.
    explanation: The higher estimate from a clinically diagnosed series.
  - reference: PMID:28690482
    reference_title: "Barber-Say Syndrome and Ablepharon-Macrostomia Syndrome: A Patient's View."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both are characterized by abnormalities in ectoderm-derived structures
      and cause a very unusual morphology of mainly the face in individuals
      with otherwise normal cognition and normal physical functioning.
    explanation: The later view, from contact with affected individuals, that cognition is normal.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her intellectual and motor development was normal.
    explanation: Normal development in an adult with molecularly confirmed AMS.
- discussion_id: ams_model_fidelity_gap
  prompt: >-
    Would a heterozygous Twist2 Glu75Lys knock-in mouse reproduce the eyelid,
    skin and hair phenotype, and which mesenchymal targets would it show to be
    lost or newly bound?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Zebrafish
  - pathophysiology#Altered TWIST2 Genomic DNA-Binding Pattern
  - pathophysiology#Craniofacial Soft-Tissue Patterning Defect
  rationale: >-
    The functional results for p.Glu75Lys come from overexpressed human
    protein (zebrafish mRNA injection, tagged protein in HeLa cells), from
    engineered alleles in the single C. elegans Twist homolog, and from one
    heterozygous zebrafish twist2 knock-in whose phenotype (jaw and mouth,
    emaciation) was described qualitatively in a methods paper. None of these
    organisms has eyelids, hair or mammalian dermis. Twist2 knockout mice
    model loss of function, which corresponds to Setleis syndrome rather than
    to this dominant allele. Whether the mechanism is dominant-negative,
    neomorphic or both cannot be settled until the allele is studied in
    mammalian mesenchyme. No mammalian knock-in model was found among the
    references cited here.
  evidence:
  - reference: PMID:20691403
    reference_title: Homozygous nonsense mutations in TWIST2 cause Setleis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, Setleis syndrome patients and Twist2 knockout mice have similar
      facial features, indicating the gene's conserved role in mammalian
      development.
    explanation: >-
      The knockout mouse matches the recessive loss-of-function disorder, not
      AMS.

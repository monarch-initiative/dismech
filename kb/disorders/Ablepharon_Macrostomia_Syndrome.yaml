- name: Dermal Extracellular Matrix Disorganization
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A disorganised dermal connective tissue is the presumed tissue correlate of
    the thin, wrinkled, lax and redundant skin. The cited evidence is clinical:
    lax skin (cutis laxa) was recognised as a feature shared by AMS and
    Barber-Say syndrome. The gene-discovery paper describes skin electron
    microscopy from AMS patients (disrupted elastic fibres, disordered collagen)
    only in its full text, which is not cited here (see the entry notes on
    unquoted full text); until that or another source is cited, the node is
    marked HYPOTHETICAL.
  locations:

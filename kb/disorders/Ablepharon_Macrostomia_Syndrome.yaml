notes: >-
  Lump/split. Curated as its own Disease entry, with Barber-Say syndrome (MONDO:0008853, entry Barber-Say_Syndrome) as the allelic differential rather than a subtype, matching the decision recorded in that entry. MONDO, OMIM (200110 versus 209885) and Orphanet (ORPHA:920 versus ORPHA:1231) keep the two separate, and in the gene-discovery series lysine at TWIST2 residue 75 gave AMS while glutamine or alanine gave Barber-Say syndrome (PMID:26119818). The opposing view, that Barber-Say syndrome, AMS and Setleis syndrome form one continuum, is documented in the 2016 critical review (PMID:27196381) and in a 2009 case report (PMID:19760652). If the two are ever lumped as a single TWIST2 Glu75 disorder, the residue-level genotype-phenotype correlation is what should be carried as subtypes. The paralogous TWIST1 Glu117 disorder, Sweeney-Cox syndrome, also presents with ablepharon and has its own entry.

  The abbreviation "AMS" is omitted from the synonym list because it is widely used for unrelated conditions (for example acute mountain sickness); it is used as shorthand in the prose of this entry only.

  Case reports published before 2015 were diagnosed clinically, and several AMS-like patients were later shown to have other disorders: a family with an AMS-like phenotype carried biallelic FRAS1 variants (Fraser syndrome, PMID:17163535), and the 2016 review excluded several earlier reports as misdiagnosed. Frequency estimates from the older literature, notably developmental delay in about two-thirds, therefore describe a clinically defined and probably heterogeneous group; see the discussion on developmental outcome.

  No disease-specific GeneReviews chapter or ClinGen gene-validity assertion was identified in the consulted resources.

  Additional clinical reports include the familial report with eyelid-structure observations (PMID:10721975) and a multidisciplinary-care case (PMID:33689605). They are leads for a curator with full-text access.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous TWIST2 p.Glu75Lys causes the disorder. Most probands carry a de
    novo variant. Before the gene was known, autosomal recessive inheritance had
    been proposed; familial cases with an affected parent and child, in which
    the parent was more mildly affected, argued for dominant transmission with
    variable expression. Somatic mosaicism for a TWIST2 variant gives a milder
    phenotype, so a mildly affected parent may be mosaic. As for any
    autosomal dominant disorder, a child of a non-mosaic affected person has a
    50 percent chance of inheriting the variant.
  evidence:
  - reference: PMID:21595001
    reference_title: Evidence for autosomal dominant inheritance of ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present the second familial case of ablepharon-macrostomia syndrome in
      a newborn female and her 22-year-old father making autosomal dominant
      inheritance more likely than the previously proposed autosomal recessive
      transmission for this disorder.
    explanation: Father-to-daughter transmission supporting dominant inheritance.
  - reference: PMID:11038439
    reference_title: "Ablepharon-macrostomia syndrome: first report of familial occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The father has facial anomalies that suggest autosomal dominant
      inheritance.
    explanation: >-
      First familial report; affected siblings whose father has facial
      anomalies, interpreted as dominant transmission from a mildly affected
      parent.
  - reference: PMID:21595001
    reference_title: Evidence for autosomal dominant inheritance of ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the child shows more prominent features of the disorder
      when compared to her father documenting variable expression and possible
      anticipation.
    explanation: >-
      A more mildly affected transmitting father. The authors' suggestion of
      anticipation predates the recognition of parental mosaicism, which
      explains the same observation.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a recurrent de novo mutation in TWIST2 in seven independent
      AMS-affected families
    explanation: De novo origin of the AMS allele in unrelated families.
  - reference: PMID:34092176
    reference_title: Ocular adnexal phenotype and management of a patient with mosaic expression of a mutation in TWIST2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaic expression of TWIST2 variants is correlated with a less severe
      phenotype than that reported for the typical expression of TWIST2
      variants associated with BSS or AMS.
    explanation: Somatic mosaicism gives a milder phenotype, relevant to parental testing.

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Twist2 knockdown on E13 left visible marks at the wound site, inhibited
      regeneration, and resulted in defective follicle formation.
    explanation: >-
      Experimental loss of Twist2 in fetal mouse skin impairs hair follicle
      formation; the setting is wound regeneration, not development of the
      normal pelt.
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."

    term:
      id: GO:0043588
      label: skin development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      TWIST2 encodes a basic helix-loop-helix transcription factor that
      regulates the development of mesenchymal tissues.
    explanation: >-
      The developmental role of TWIST2 on which this node rests, stated as
      background in the abstract and naming no species, so graded OTHER.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Comparison of wild-type and mutant TWIST2 expressed in zebrafish
      identified abnormal developmental phenotypes and widespread
      transcriptome changes.
    explanation: Transcriptional effect of the mutant proteins, including p.Glu75Lys, in zebrafish embryos.
  - reference: PMID:33272268
    reference_title: An optimized base editor with efficient C-to-T base editing in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Quantitative RT-PCR showed that twsit2 itself expression was indeed
      increased in homozygous embryos, and the proinflammatory cytokines,
      Il-1β and tnfa, were found highly expressed.
    explanation: >-
      Expression changes in homozygous zebrafish carrying the AMS-equivalent
      knock-in (the source spells twist2 as "twsit2").
  downstream:
  - target: Dermal Extracellular Matrix Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Aberrant TWIST2 target expression is proposed to disturb the dermal
      extracellular matrix.
    evidence:
    - reference: PMID:38740788
      reference_title: Twist2 contributes to skin regeneration and hair follicle formation in mouse fetuses.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        In mice, Twist2 knockout reportedly caused progressive growth
        retardation, possibly as a result of upregulated cytokine signaling,
        leading to thin skin and sparse distorted hair follicles before death
      explanation: >-
        Loss of Twist2 thins the skin in mice. INDIRECT and BACKGROUND: it
        restates earlier knockout work, and a null allele is not the human
        heterozygous missense allele.
  - target: Eyelid Anterior Lamella Underdevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disturbed TWIST2-directed mesenchymal development is inferred to underlie
      the eyelid malformation. No cited source demonstrates this step, and the
      stages of eyelid morphogenesis affected are not known.
  - target: Craniofacial Soft-Tissue Patterning Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same disturbance is proposed to produce the facial patterning
      defects of the mouth, nose, ears and malar region.
    evidence:
    - reference: PMID:33272268
      reference_title: An optimized base editor with efficient C-to-T base editing in zebrafish.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Interestingly, heterozygous mutants can survive to adults and be fertile,
        but most heterozygous adults showed the phenotypes of protruding jaw,
        unclosed mouth, and emaciated body at about 6 months
      explanation: >-
        The heterozygous AMS-equivalent knock-in disturbs jaw and mouth
        morphology in zebrafish. INDIRECT because the fish jaw is not the

    reference_title: "Congenital shortening of the anterior lamella of all eyelids: the so-called ablepharon macrostomia syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report one more case showing that the condition is better described
      as a severe microblepharon because only the anterior lamella of the
      eyelids is shortened.
    explanation: Oculoplastic characterisation of the lesion as anterior lamellar shortening.
  - reference: PMID:11038439
    reference_title: "Ablepharon-macrostomia syndrome: first report of familial occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ablepharon-macrostomia syndrome (AMS) is a rare condition comprising
      severe deficiency of the anterior lamella of both eyelids, abnormal ears,
      macrostomia, anomalous genitalia, redundant skin, and absence of lanugo.
    explanation: Defines the eyelid lesion as anterior lamellar deficiency.
  - reference: PMID:31373987
    reference_title: "Long-Term Results of the Surgical Management of the Upper Eyelids in \"Ablepharon\"-Macrostomia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lids in AMS are not absent and should not be managed with complex

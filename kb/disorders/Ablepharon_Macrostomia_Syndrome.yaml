differential_diagnoses:
- name: Barber-Say syndrome
  description: >-
    Allelic TWIST2 disorder caused by p.Glu75Gln or p.Glu75Ala at the same
    residue. Shares macrostomia, eyelid underdevelopment, cheek pads, ear,
    nipple and genital anomalies; distinguished by generalized hypertrichosis
    and mostly ectropion rather than ablepharon, whereas AMS has sparse scalp
    hair. The variant settles the call.
  disease_term:
    preferred_term: Barber-Say syndrome
    term:
      id: MONDO:0008853
      label: Barber-Say syndrome
  evidence:
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or
      alanine yielded BSS
    explanation: The molecular discriminator between the two syndromes.
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur
      in both entities, and general hypertrichosis occurs in BSS.
    explanation: The hair phenotype that separates the two clinically.
  - reference: PMID:11807864
    reference_title: Ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It also adds further evidence that AMS is distinct from Barber-Say
      syndrome, which has similar features.
    explanation: Clinical argument for separating the two before the gene was known.
  - reference: PMID:19760652
    reference_title: Case report supporting that the Barber-Say and ablepharon macrostomia syndromes could represent one disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other authors have discussed that BSS and AMS could possibly represent one
      syndrome, and our report supports this hypothesis.
    explanation: The lumping argument, recorded because it bears on the split.
- name: Fraser syndrome
  description: >-
    Autosomal recessive FRAS-FREM complex disorder (FRAS1, FREM2, GRIP1) with
    cryptophthalmos, cutaneous syndactyly, genital and renal anomalies and
    laryngeal malformations. Its craniofacial and genital pattern overlaps
    closely with AMS, and one family with an AMS-like phenotype carried
    biallelic FRAS1 variants. In AMS the eyelids are short rather than fused
    over the globe, inheritance is dominant, and the Fraser genes were
    excluded in a clinically diagnosed AMS cohort.
  disease_term:
    preferred_term: Fraser syndrome
    term:
      id: MONDO:0009046
      label: Fraser syndrome
  evidence:
  - reference: PMID:24115501
    reference_title: "Ablepharon macrostomia syndrome: A distinct genetic entity clinically related to the group of FRAS-FREM complex disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings demonstrate that AMS is genetically distinct from FS.
    explanation: Exclusion of the Fraser syndrome genes in an AMS cohort.
  - reference: PMID:17163535
    reference_title: "Fraser and Ablepharon macrostomia phenotypes: concurrence in one family and association with mutated FRAS1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that a phenotype resembling AMS is a rare clinical expression
      of FS with no obvious genotype-phenotype correlation.
    explanation: An AMS-like phenotype caused by biallelic FRAS1 variants.
  - reference: PMID:31462237
    reference_title: Laryngo-tracheal stenosis in a woman with ablepharon macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laryngo-tracheal anomalies do not belong to the AMS phenotype
    explanation: >-
      The authors contrast AMS with Fraser syndrome, in which laryngotracheal
      anomalies are common.
- name: Setleis syndrome (focal facial dermal dysplasia type III)
  description: >-
    Autosomal recessive TWIST2 disorder caused by biallelic truncating
    variants, with bitemporal scar-like lesions and eyelash and eyebrow
    abnormalities. It overlaps facially with AMS, but its inheritance, its
    loss-of-function mechanism and the focal temporal lesions distinguish it.
  disease_term:

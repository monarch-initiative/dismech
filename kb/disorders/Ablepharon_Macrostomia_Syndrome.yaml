mechanistic_hypotheses:
- hypothesis_group_id: twist2_glu75_dominant_negative
  hypothesis_label: Glu75Lys interferes with the wild-type TWIST2 pool
  status: EMERGING
  description: >-
    Under this model the mutant subunit still enters TWIST2 homodimers and
    bHLH heterodimers but those complexes fail to bind the normal E-box
    targets, so the wild-type protein is inactivated along with it. Cited
    support comes from the C. elegans hlh-8 allelic series, which favours a
    predominantly dominant-negative mechanism for the Glu75 substitutions, from
    later restatements of the alleles as antimorphic, and from the
    considerable clinical resemblance to Setleis syndrome, which is caused by
    biallelic loss of TWIST2 function. The sparse hair of AMS fits this model,
    but the hypertrichosis caused by the allelic Barber-Say substitutions does
    not. Not mutually exclusive with the neomorphic model.
  evidence:
  - reference: PMID:28369379
    reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human diseases that can be modeled in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The genetic analysis favors a predominantly dominant-negative mechanism
      for the action of amino acid substitutions at this highly conserved
      glutamic acid residue
    explanation: >-
      Conclusion of the C. elegans allelic series, which included p.Glu75Lys
      engineered at the equivalent hlh-8 residue.
  - reference: PMID:27196381
    reference_title: "Barber-Say syndrome and Ablepharon-Macrostomia syndrome: An overview."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The resemblance between the three syndromes is considerable, and likely
      differences seem larger than they actually are due to insufficiently
      complete evaluation for all characteristics of the three entities in the
      past.
    explanation: >-
      Clinical overlap between AMS, Barber-Say and the loss-of-function
      disorder Setleis syndrome. INDIRECT: resemblance to a loss-of-function
      phenotype is consistent with, not proof of, a dominant-negative effect.
  - reference: PMID:30450715
    reference_title: Ablepharon and craniosynostosis in a patient with a localized TWIST1 basic domain substitution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Heterozygous localized TWIST1 and TWIST2 basic domain substitutions exert
      antimorphic effects to cause Sweeney-Cox syndrome, Barber-Say syndrome,
      and ablepharon-macrostomia syndrome, respectively.
    explanation: >-
      A later TWIST1 case report restates the Glu75 alleles as antimorphic,
      summarising the earlier functional work rather than adding new data.
- hypothesis_group_id: twist2_glu75_neomorphic_binding
  hypothesis_label: Glu75Lys gives TWIST2 new genomic targets
  status: EMERGING
  description: >-
    Under this model the disease-relevant effect is the binding of mutant
    TWIST2 to sites the wild-type protein does not occupy, changing expression
    of genes TWIST2 does not normally regulate. The observation behind it,
    mutant-only ChIP-seq peaks, is reported in the full text of the
    gene-discovery paper and is not cited here; the cited support is a later
    summary of that work as gain of function plus dominant negative, and the
    residue-specific genotype-phenotype correlation, which a change in target
    set would explain. No study has tested a residue-specific target-set
    difference in a relevant tissue.
  evidence:
  - reference: PMID:33272268
    reference_title: An optimized base editor with efficient C-to-T base editing in zebrafish.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Previous studies have shown that the E75K mutation in twsit2 altered the
      DNA binding activity of itself, leading to both gain of function and
      dominant-negative effects.
    explanation: >-
      Restates the earlier binding studies of p.Glu75Lys as showing a gain of
      function alongside the dominant-negative effect. Graded IN_VITRO for the
      cell-based binding work it summarises.
  - reference: PMID:26119818
    reference_title: Recurrent Mutations in the Basic Domain of TWIST2 Cause Ablepharon Macrostomia and Barber-Say Syndromes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, a genotype-phenotype correlation was observed, because the two
      syndromes differed based solely upon the nature of the substituting
      amino acid: a lysine at TWIST2 residue 75 resulted in AMS, whereas a
      glutamine or alanine yielded BSS.
    explanation: >-
      Different substitutions at one residue give different syndromes, which
      a residue-specific change in target binding would explain. INDIRECT
      because the correlation does not itself show new binding.

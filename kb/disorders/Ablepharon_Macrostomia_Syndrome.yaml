- name: Genetic Counseling
  description: >-
    Counselling after TWIST2 testing of the proband and both parents. Most
    cases are de novo, but a parent can be mildly affected or mosaic, so an
    apparently unaffected parent does not exclude recurrence. As for any
    autosomal dominant disorder, the risk to a child of a non-mosaic affected
    adult is 50 percent.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:21595001
    reference_title: Evidence for autosomal dominant inheritance of ablepharon-macrostomia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the child shows more prominent features of the disorder
      when compared to her father documenting variable expression and possible
      anticipation.
    explanation: A mildly affected transmitting parent, the case parental testing is meant to detect.
  - reference: PMID:34092176
    reference_title: Ocular adnexal phenotype and management of a patient with mosaic expression of a mutation in TWIST2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaic expression of TWIST2 variants is correlated with a less severe
      phenotype than that reported for the typical expression of TWIST2
      variants associated with BSS or AMS.
    explanation: A mosaic parent may be only mildly affected.
  - reference: url:https://biblio.ugent.be/publication/8553102/file/8553201.pdf
    reference_title: https://biblio.ugent.be/publication/8553102/file/8553201.pdf
    supports: SUPPORT
    evidence_source: OTHER

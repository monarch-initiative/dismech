- name: Dysregulated TWIST2-Dependent Mesenchymal Transcription
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Expression of the AMS p.Glu75Lys or Barber-Say p.Glu75Gln protein in zebrafish embryos changed the transcriptome
    relative to wild-type TWIST2 overexpression. The strongest decreases involved extracellular matrix, membrane
    and cytoskeletal gene sets. These are whole-embryo results, not a patient-mesenchyme transcriptome. Wild-type
    overexpression itself caused mild developmental defects, so dose and experimental context matter. Homozygous
    zebrafish carrying the equivalent knock-in allele also showed increased twist2 and pro-inflammatory cytokine
    expression.

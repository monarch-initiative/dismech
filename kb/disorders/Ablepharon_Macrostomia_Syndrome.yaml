- name: Eyelid Anterior Lamella Underdevelopment
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The defining lesion. The eyelids are present but their anterior lamella
    (skin and orbicularis) is severely short, with shortening of the septum
    and levator aponeurosis also described, so the lids cannot cover the globe.
    Clinically this reads as ablepharon, and in milder or mosaic cases as
    short, hypoplastic lids. Oculoplastic reports stress that
    the lids are not truly absent, which is why grafting to lengthen the
    anterior lamella, rather than building a new lid, is effective.

    PROVISIONAL because no study has traced p.Glu75Lys through eyelid
    morphogenesis; the link from TWIST2 to the eyelid is inferred from the
    phenotype and from where TWIST2 is expressed.
  locations:
  - preferred_term: eyelid
    term:
      id: UBERON:0001711
      label: eyelid
  biological_processes:
  - preferred_term: eyelid development in camera-type eye
    term:
      id: GO:0061029
      label: eyelid development in camera-type eye
    modifier: DECREASED
  evidence:

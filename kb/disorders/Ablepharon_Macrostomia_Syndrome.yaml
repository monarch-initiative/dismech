name: Ablepharon-Macrostomia Syndrome
creation_date: "2026-09-25T13:56:18Z"
category: Mendelian
synonyms:
- ablepharon macrostomia syndrome
- congenital ablepharon, absent eyelashes/eyebrows, macrostomia, auricular, nasal, genital and other systemic anomalies
description: >-
  Ablepharon-macrostomia syndrome is a congenital ectodermal dysplasia with
  multiple malformations, recognisable at birth by severely shortened or
  apparently absent eyelids (ablepharon), a wide "fish-like" mouth from
  unfused lateral commissures, first-degree microtia, an underdeveloped or
  notched nose, thin, wrinkled and redundant skin, sparse or absent scalp hair,
  eyebrows, eyelashes and lanugo, hypoplastic or absent nipples, and genital
  anomalies. Cutaneous syndactyly and camptodactyly of the fingers, ventral
  hernia or other abdominal wall and umbilical anomalies, and absent zygomatic
  arches occur in a minority. Most affected individuals have normal or near-normal cognition;
  mild motor or speech delay is reported in some. The eyelid lesion is a
  deficiency of the anterior lamella rather than true absence of the lids, and
  it exposes the cornea from the first hours of life, so ocular surface
  protection and early eyelid reconstruction with skin grafts determine the
  visual outcome.

  It is autosomal dominant and caused by a heterozygous substitution of lysine
  for the conserved glutamic acid at residue 75 (p.Glu75Lys, c.223G>A) in the
  basic DNA-binding domain of the bHLH transcription factor TWIST2; all seven
  families in the gene-discovery series carried this one allele. Most cases
  are de novo; mildly affected parents have transmitted the disorder to more
  severely affected children, and somatic mosaicism gives a milder
  phenotype. Glutamine
  or alanine at the same residue causes the allelic Barber-Say syndrome, and
  biallelic loss-of-function TWIST2 alleles cause Setleis syndrome.

  In HeLa cells the Glu75 substitutions alter the genome-wide DNA-binding
  pattern of TWIST2. Whether the disorder results mainly from interference with the
  wild-type protein (dominant-negative) or from new target binding
  (neomorphic) is unresolved, and both models are recorded under
  mechanistic_hypotheses.
disease_term:
  preferred_term: ablepharon macrostomia syndrome
  term:

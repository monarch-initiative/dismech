diagnosis:
- name: HLA class I surface expression
  description: >-
    Measurement of HLA class I on blood leukocytes, by serologic HLA class I
    typing or flow cytometry with a pan-HLA class I antibody, shows markedly
    reduced expression (a few percent of normal) in symptomatic and
    asymptomatic homozygotes. Molecular HLA typing does not assess expression.
  diagnosis_term:
    preferred_term: HLA class I flow cytometry or serologic typing
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:8523185
    reference_title: Association of HLA class I antigen deficiency related to a TAP2 gene mutation with familial bronchiectasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that class I HLA typing should be systematically performed in children with unexplained bronchiectasis."
    explanation: Recommends HLA class I typing to detect the deficiency, based on TAP2-deficient siblings.
  - reference: PMID:36227411
    reference_title: Delayed Diagnosis of Chronic Necrotizing Granulomatous Skin Lesions due to TAP2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both asymptomatic and symptomatic carriers, HLA-I expression was only 4-15% of the one observed in healthy controls."
    explanation: Quantified HLA class I expression separates TAP2 homozygotes from controls, whether or not they have symptoms.
  notes: >-
    The abstracts do not name the assay; flow cytometry is bound because it is
    the procedure that measures surface HLA class I quantitatively. NCIT
    HLA Typing (NCIT:C71329) was not used because it also covers molecular
    typing, which does not measure expression.
- name: TAP2 molecular genetic testing
  description: >-
    Sequencing (targeted TAP2 sequencing or exome sequencing) identifies
    biallelic TAP2 loss-of-function variants and distinguishes TAP2 from TAP1,
    TAPBP and B2M causes of MHC class I deficiency.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:11529920
    reference_title: Molecular studies and NK cell function of a new case of TAP2 homozygous human deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sequence of TAP2 gene identified a single mutation, a C to T substitution changing the CGA arg codon at amino acid 220 into TGA stop codon in exon 3."
    explanation: TAP2 sequencing established the molecular diagnosis in this patient.
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome sequencing (WES) of P1 and P2, a homozygous loss-of-function variant was identified in TAP2 (NM_001290043.2; c.979_983delinsGGGG; p.Arg327Glyfs*53)."
    explanation: Exome sequencing identified the TAP2 variant in two related patients.
- name: Rubella serology in granulomatous skin disease
  description: >-
    In patients with unexplained skin granulomas, very high anti-rubella IgG
    titres suggest chronic rubella granuloma when viral PCR on a skin sample
    is not available. Shown in four TAP-deficient patients, two of them
    TAP2-deficient.
  diagnosis_term:
    preferred_term: rubella IgG serology
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "markedly elevated rubella IgG levels serve as a reliable serological diagnostic marker when viral PCR is unavailable"
    explanation: Authors propose rubella IgG titre as a diagnostic marker for rubella granulomas in inherited HLA class I deficiency.
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the four patients had strong antibody responses to RuV infection, with IgG levels 30–60 times higher than their respective age-matched control group"
    explanation: >-
      Measured titres in the four patients, two of whom (P1, P2) are
      TAP2-deficient; the other two are TAP1-deficient.
treatments:
- name: Antibiotic Prophylaxis
  description: >-
    Mainstay of management for MHC class I deficiency: prevention and prompt
    treatment of bacterial respiratory infection to limit progression of
    bronchiectasis. No TAP2-specific trial exists. Live-attenuated rubella
    vaccine has been advised against in TAP1/TAP2 deficiency because of
    chronic rubella granulomas.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:34280577
    reference_title: Stem cell transplantation as treatment for major histocompatibility class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "is predominately treated with antimicrobial prophylaxis and chest physiotherapy"
    explanation: >-
      Describes standard management for MHC class I deficiency as a whole
      (TAP1, TAP2, TAPBP or B2M), not a TAP2-specific study.
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings suggest that inherited TAP1 and TAP2 deficiencies specifically predispose to skin RuV infection; they should not be vaccinated with live-attenuated rubella vaccines."
    explanation: Source of the caution against live-attenuated rubella vaccine in TAP2 deficiency.
- name: Chest Physiotherapy
  description: >-
    Airway clearance by chest physiotherapy for chronic secretions and
    bronchiectasis, used alongside antimicrobial prophylaxis in MHC class I
    deficiency.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: chest physiotherapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  notes: >-
    OLS searches of NCIT for "chest physiotherapy" and "airway clearance"
    returned no procedure term for either, so the physical therapy action is
    bound and the specific technique is carried in preferred_term.
  evidence:
  - reference: PMID:34280577
    reference_title: Stem cell transplantation as treatment for major histocompatibility class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: "is predominately treated with antimicrobial prophylaxis and chest physiotherapy"
    explanation: >-
      Describes standard management for MHC class I deficiency as a whole
      (TAP1, TAP2, TAPBP or B2M), not a TAP2-specific study.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Reported in two patients with MHC class I deficiency, with long-term
    immune reconstitution and regression of granulomatous rash in one and
    severe graft-versus-host disease in the other. Non-hematopoietic cells
    remain HLA class I-deficient after transplant.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:34280577
    reference_title: Stem cell transplantation as treatment for major histocompatibility class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "demonstrating maintained resolution of normal immune function and regression of the granulomatous rash 15 years post-transplant"
    explanation: >-
      Single-patient outcome in MHC class I deficiency. The abstract does not
      state the patients' causal gene; the record's MeSH terms index both
      ABCB2 (TAP1) and ABCB3 (TAP2) deficiency, so this is syndrome-level
      evidence and may include a TAP2-deficient patient.

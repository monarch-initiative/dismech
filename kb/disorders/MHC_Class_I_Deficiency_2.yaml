name: MHC Class I Deficiency 2
creation_date: "2026-10-15T14:36:39Z"
category: Mendelian
synonyms:
- MHC1D2
- TAP2 deficiency
- Bare lymphocyte syndrome type 1 due to TAP2 deficiency
description: >-
  MHC class I deficiency 2 is the autosomal recessive form of MHC class I
  deficiency (bare lymphocyte syndrome type 1) caused by biallelic
  loss-of-function variants in TAP2, which encodes subunit 2 of the transporter
  associated with antigen processing. Without a functional TAP1-TAP2
  heterodimer, cytosolic peptides are not translocated into the endoplasmic
  reticulum, most HLA class I molecules remain peptide-free and fail to reach
  the cell surface, and surface HLA class I falls to a few percent of normal.
  Affected individuals typically develop recurrent bacterial sinopulmonary
  infections, nasal polyps and bronchiectasis from childhood, and chronic
  necrotizing granulomatous skin and upper-airway lesions later in life, while
  severe viral infections are not a feature. Expressivity is highly variable:
  some homozygous relatives remain asymptomatic for decades, and some patients
  have skin disease without lung involvement. NK cells of TAP2-deficient
  patients are hyporesponsive at rest but become autoreactive on activation and
  are prominent in granulomatous lesions; chronic rubella virus infection has
  been detected in the skin granulomas of TAP2-deficient patients.
disease_term:
  preferred_term: MHC class I deficiency 2
  term:
    id: MONDO:0971011
    label: MHC class I deficiency 2
parents:
- MHC class I deficiency
- combined immunodeficiency
notes: >-
  MONDO:0971011 is the TAP2-specific leaf (OMIM 620813) under MHC class I
  deficiency (MONDO:0011476), whose other forms are caused by TAP1, TAPBP or
  B2M. Evidence below is from TAP2-deficient patients unless the explanation
  says otherwise; several studies pooled TAP1- and TAP2-deficient patients and
  are cited as syndrome-level evidence. ClinGen's TAP2 gene-disease validity
  assertion (Strong, AR) is recorded against the parent MONDO:0011476 rather
  than this entry's term, so it is not copied into gene_disease_validity here.
  No GeneReviews chapter names this disease or its synonyms (just
  check-genereviews, Bookshelf index snapshot 2026-09-10: NO_CHAPTER).
classifications:
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      IUIS 2024 classification (PMID:41608114), Table 1 (immunodeficiencies
      affecting cellular and humoral immunity), row group "MHC class I
      deficiency" with TAP2 listed as an AR cause under OMIM 620813.
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TAP2 | AR | 620813"
      explanation: >-
        IUIS Table 1 lists TAP2 (AR, OMIM 620813) within the MHC class I
        deficiency group of combined immunodeficiencies.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic TAP2 loss-of-function variants; reported
    families are frequently consanguineous and affected siblings are
    homozygous.
  evidence:
  - reference: PMID:8523185
    reference_title: Association of HLA class I antigen deficiency related to a TAP2 gene mutation with familial bronchiectasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defect was transmitted in an autosomal recessive manner."
    explanation: >-
      Family study of two TAP2-mutant siblings reporting autosomal recessive
      transmission of the HLA class I deficiency.
genetic:
- name: TAP2
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TAP2
    term:
      id: hgnc:44
      label: TAP2
  features: >-
    TAP2 encodes subunit 2 of the ER-membrane peptide transporter associated
    with antigen processing. Reported disease alleles are homozygous nonsense
    and frameshift variants, for example a stop codon at Arg220 and
    p.Arg327Glyfs*53.
  evidence:
  - reference: PMID:8523185
    reference_title: Association of HLA class I antigen deficiency related to a TAP2 gene mutation with familial bronchiectasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced class I cell surface expression resulted from a single mutation in the TAP2 gene"
    explanation: Identifies a TAP2 mutation as the cause of the HLA class I deficiency in an affected sibship.
  - reference: PMID:11529920
    reference_title: Molecular studies and NK cell function of a new case of TAP2 homozygous human deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a C to T substitution changing the CGA arg codon at amino acid 220 into TGA stop codon in exon 3"
    explanation: A homozygous TAP2 nonsense variant in a further unrelated patient with the same phenotype.
  - reference: PMID:12067308
    reference_title: Asymptomatic deficiency in the peptide transporter associated to antigen processing (TAP).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that the patients display a homozygous TAP2 mutation which blocks the maturation of HLA class I molecules."
    explanation: Homozygous TAP2 mutation blocking HLA class I maturation in an adult sibship.
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome sequencing (WES) of P1 and P2, a homozygous loss-of-function variant was identified in TAP2 (NM_001290043.2; c.979_983delinsGGGG; p.Arg327Glyfs*53)."
    explanation: Homozygous TAP2 frameshift in two related patients with granulomatous skin disease.
pathophysiology:
- name: TAP2 Loss of Function
  description: >-
    Biallelic truncating TAP2 variants abolish the TAP2 subunit, so no
    functional TAP1-TAP2 transporter is formed in the endoplasmic reticulum
    membrane.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TAP2
    term:
      id: hgnc:44
      label: TAP2
  molecular_functions:
  - preferred_term: ABC-type peptide antigen transporter activity
    term:
      id: GO:0015433
      label: ABC-type peptide antigen transporter activity
    modifier: DECREASED
  downstream:
  - target: Defective Peptide Translocation into the ER
  evidence:
  - reference: PMID:9419217
    reference_title: Activity and phenotype of natural killer cells in peptide transporter (TAP)-deficient patients (type I bare lymphocyte syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A few years ago we described two siblings, EMO and EFA, who are homozygous for a stop mutation in the gene encoding the TAP2 subunit of the peptide transporter associated to antigen processing (TAP; 1)."
    explanation: The index TAP2-deficient siblings carry a homozygous TAP2 stop mutation.
- name: Defective Peptide Translocation into the ER
  description: >-
    Loss of the TAP heterodimer prevents ATP-dependent translocation of
    cytosolic peptides into the endoplasmic reticulum, depriving nascent HLA
    class I molecules of peptide.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: peptide antigen transport
    term:
      id: GO:0046968
      label: peptide antigen transport
    modifier: DECREASED
  downstream:
  - target: Failure of HLA Class I Surface Expression
  evidence:
  - reference: PMID:36227411
    reference_title: Delayed Diagnosis of Chronic Necrotizing Granulomatous Skin Lesions due to TAP2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Any defect resulting from a mutation or deletion of these two subunits may adversely affect the peptide translocation in the endoplasmic reticulum, which is an important process for properly assembling MHC-I molecules."
    explanation: >-
      Background statement of the TAP mechanism in a TAP2 case report; it
      describes TAP1 and TAP2 defects together rather than a measurement in
      these patients.
- name: Failure of HLA Class I Surface Expression
  description: >-
    Peptide-free HLA class I molecules are not stabilised and are retained,
    so surface HLA class I on patient cells falls to roughly 1-15 percent of
    normal. Residual molecules may be partly peptide-empty (for example HLA-B7).
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TAP-dependent MHC class I antigen presentation
    term:
      id: GO:0002485
      label: antigen processing and presentation of endogenous peptide antigen via MHC class I via ER pathway, TAP-dependent
    modifier: DECREASED
  downstream:
  - target: Reduced MHC I cell surface expression
  - target: Impaired Naive CD8 T Cell Development
  - target: NK Cell Hyporesponsiveness Adapted to Missing Self
  - target: Susceptibility to Respiratory Bacterial Infection
  - target: Chronic Rubella Virus Persistence in Skin Granulomas
    description: >-
      TAP deficiency is proposed to predispose to persistent skin rubella
      infection; the source attributes this to TAP1/TAP2 deficiency and does
      not show which downstream immune defect is responsible.
    evidence:
    - reference: PMID:41531537
      reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "our findings suggest that inherited TAP1 and TAP2 deficiencies specifically predispose to skin RuV infection; they should not be vaccinated with live-attenuated rubella vaccines."
      explanation: >-
        Links TAP deficiency to skin rubella infection; attaching it to the
        HLA class I surface-loss node is an inference, since the paper names
        the TAP defect rather than a specific consequence of it.
  evidence:
  - reference: PMID:9419217
    reference_title: Activity and phenotype of natural killer cells in peptide transporter (TAP)-deficient patients (type I bare lymphocyte syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result of this deficiency, most HLA class I molecules remain peptide-free and cannot reach the cell surface."
    explanation: States the consequence of TAP2 deficiency in the index siblings for HLA class I trafficking.
  - reference: PMID:10560675
    reference_title: "Association of a syndrome resembling Wegener's granulomatosis with low surface expression of HLA class-I molecules."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Correction of the genetic defect in vitro restored normal expression of HLA class-I molecules and prevented self-reactivity in the patients' cells."
    explanation: >-
      Complementation of the patients' cells restored HLA class I expression;
      two of the five patients carried TAP2 mutations, so this is TAP-complex
      evidence rather than TAP2-only.
- name: Impaired Naive CD8 T Cell Development
  description: >-
    Low HLA class I limits thymic selection of conventional CD8 alpha-beta T
    cells. Total CD8 counts may be near normal, but naive CD8 T cells are
    strongly reduced; residual CD8 T cells can still mediate some
    TAP-independent antiviral responses.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: naive CD8-positive alpha-beta T cell
    term:
      id: CL:0000900
      label: naive thymus-derived CD8-positive, alpha-beta T cell
  downstream:
  - target: Decreased naive CD8+ T cells
  evidence:
  - reference: PMID:36227411
    reference_title: Delayed Diagnosis of Chronic Necrotizing Granulomatous Skin Lesions due to TAP2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While total CD8 T cell counts were normal as previously reported, the patients showed strongly impaired naïve CD8 T cell counts."
    explanation: Deep immunophenotyping of TAP2-deficient patients shows a selective naive CD8 deficit.
  - reference: PMID:27861817
    reference_title: A novel spontaneous mutation in the TAP2 gene unravels its role in macrophage survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "This strain randomly arose in one of our C57BL/6J mouse colonies and was initially discovered because of the lack of CD8+ T cells in the periphery."
    explanation: >-
      Tap2-null eightless mice lack peripheral CD8 T cells, a more severe
      version of the human CD8 defect.
- name: NK Cell Hyporesponsiveness Adapted to Missing Self
  description: >-
    Chronically low self HLA class I leaves NK cells uneducated: resting NK
    cells fail to kill HLA class I-negative targets and overexpress inhibitory
    receptors (CD94/NKG2A, KIRs) and CEACAM1, which restrain killing of
    autologous cells.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Decreased natural killer cell-induced killing of target cells
  - target: Activated NK Cell Autoreactivity
  evidence:
  - reference: PMID:14604968
    reference_title: The mechanisms controlling NK cell autoreactivity in TAP2-deficient patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate that NK cells in TAP2-deficient patients have developed unique mechanisms to reduce NK killing activity and to compensate for the lack of class I MHC-mediated inhibition."
    explanation: NK cells from three TAP2-deficient siblings adapt to absent HLA class I by reducing their killing activity.
  - reference: PMID:11529920
    reference_title: Molecular studies and NK cell function of a new case of TAP2 homozygous human deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using MoAbs for KIRs, CD94, CD94/NKG2A and ILT2 we observed, in agreement with others, that the latter two receptors were overexpressed on TAP2-deficient NK cells."
    explanation: Inhibitory receptor overexpression on NK cells of a TAP2-deficient patient.
- name: Activated NK Cell Autoreactivity
  description: >-
    Once activated (for example by IL-2 or infection-associated cytokines),
    NK cells from TAP-deficient patients kill autologous HLA class I-low
    cells, and cytokine induction of HLA class I does not protect
    TAP-deficient cells.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  downstream:
  - target: Necrotizing Granulomatous Inflammation
  evidence:
  - reference: PMID:9419217
    reference_title: Activity and phenotype of natural killer cells in peptide transporter (TAP)-deficient patients (type I bare lymphocyte syndrome).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, activation of the TAP- NK cells induces strong cytotoxicity to autologous B-LCs."
    explanation: Ex vivo activated NK cells from TAP2-deficient patients kill autologous B-lymphoblastoid cells.
  - reference: PMID:10229096
    reference_title: Inefficient protection of human TAP-deficient fibroblasts from autologous NK cell-mediated lysis by cytokines inducing HLA class I expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "These results suggest that activated TAP-deficient NK cells are strongly cytotoxic to normal autologous cells and that these cells cannot be efficiently protected by cytokines inducing HLA class I expression."
    explanation: >-
      Fibroblast co-culture study in TAP-deficient patients; the abstract does
      not name the subunit, so it is TAP-complex evidence.
- name: Necrotizing Granulomatous Inflammation
  description: >-
    Chronic necrotizing granulomas of the skin and upper airway, often
    resembling granulomatosis with polyangiitis, with a large proportion of
    activated NK cells in lesions. Lesions can occur without lung disease and
    may be diagnosed decades after onset.
  biological_scale: TISSUE
  downstream:
  - target: Cutaneous granuloma
  - target: Skin ulcer
  - target: Vasculitis in the skin
  evidence:
  - reference: PMID:10560675
    reference_title: "Association of a syndrome resembling Wegener's granulomatosis with low surface expression of HLA class-I molecules."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology of granulomatous lesions showed the presence of a large proportion of activated NK cells."
    explanation: >-
      Lesional NK cells support NK involvement in the granulomas; the series
      included two TAP2-mutant patients among five TAP-deficient adults.
- name: Chronic Rubella Virus Persistence in Skin Granulomas
  description: >-
    Rubella virus RNA (wild-type or vaccine-derived) has been detected in the
    granulomatous skin lesions of TAP-deficient patients, including two
    TAP2-deficient relatives, with very high anti-rubella IgG titers,
    suggesting persistent viral antigen as a driver of the granulomas.
  biological_scale: TISSUE
  downstream:
  - target: Necrotizing Granulomatous Inflammation
  evidence:
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Instead, three out of four patients had a positive PCR after reverse transcription."
    explanation: >-
      Rubella virus RT-PCR on skin biopsies was positive in three of four
      TAP-deficient patients; the paper's next sentence gives cycle thresholds
      for P1, P2 and P4, so the positives include P1 and P2, the two
      TAP2-deficient patients (P4 is TAP1-deficient).
  - reference: PMID:41531537
    reference_title: Serological diagnosis of chronic skin granulomas caused by wild-type or vaccine-derived rubella virus in patients with inherited HLA class I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Patients with inherited HLA class I deficiency develop chronic rubella-associated skin granulomas."
    explanation: >-
      Summary statement covering inherited HLA class I deficiency as a whole
      (TAP1- and TAP2-deficient patients in this report), not TAP2
      specifically.
- name: Susceptibility to Respiratory Bacterial Infection
  description: >-
    HLA class I deficiency is associated with susceptibility to bacterial
    infection of the respiratory mucosa rather than to severe viral
    infection. The cellular basis is not established; a phagocyte-like
    defect has been proposed from the Tap2-null mouse.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent respiratory infections
  - target: Sinusitis
  - target: Nasal polyposis
  - target: Bronchiectasis
  evidence:
  - reference: PMID:8523185
    reference_title: Association of HLA class I antigen deficiency related to a TAP2 gene mutation with familial bronchiectasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This deficiency did not lead to severe viral infections but was apparently associated with susceptibility to bacterial infections of the respiratory mucosae."
    explanation: TAP2-deficient siblings had bacterial respiratory infections without severe viral disease.
  - reference: PMID:27861817
    reference_title: A novel spontaneous mutation in the TAP2 gene unravels its role in macrophage survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Moreover, following peritoneal inflammation, elicited eightless macrophages showed impaired survival both in vivo and ex vivo."
    explanation: >-
      Mouse data offering a possible macrophage explanation for the bacterial
      phenotype; not demonstrated in human airways.

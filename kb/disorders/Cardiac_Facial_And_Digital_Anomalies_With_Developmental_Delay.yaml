    snippet: "They displayed significantly lower expression of transcription factor Klf2"
    explanation: >-
      Identifies KLF2 as the transcriptional output lost when TRAF7 is absent.
- name: Compromised Vascular Endothelial Integrity
  description: >-
    Endothelial cells lacking TRAF7 fail to maintain vessel wall integrity.
    Global and endothelial-specific Traf7 knockout mice die in utero with
    intraembryonic hemorrhage; postnatal endothelial deletion produces severe
    cerebral hemorrhage. This is the most plausible route from TRAF7 to the
    cardiovascular malformations of CAFDADD, but it rests on null alleles in
    mouse rather than on the human missense alleles.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell

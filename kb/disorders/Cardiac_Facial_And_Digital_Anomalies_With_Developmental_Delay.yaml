name: Cardiac, Facial, and Digital Anomalies with Developmental Delay
creation_date: "2026-09-03T23:59:00Z"
category: Mendelian
description: >-
  A multisystem congenital-anomaly and neurodevelopmental syndrome associated with heterozygous TRAF7 missense variants,
  usually de novo and clustered in the C-terminal WD40 repeats. Familial transmission and postzygotic mosaic presentations
  also occur. Characteristic findings include blepharophimosis, congenital cardiovascular malformations, digital
  and vertebral anomalies, short neck, pectus carinatum, hearing loss and variable developmental impairment. TRAF7
  is an E3 ubiquitin ligase and signaling adaptor. Allele-specific disruption of protein interactions, cilia and
  developmental signaling is under investigation. Somatic TRAF7-associated tumors are a distinct clinical context,
  with limited variant overlap and unresolved tumor risk in constitutional carriers.

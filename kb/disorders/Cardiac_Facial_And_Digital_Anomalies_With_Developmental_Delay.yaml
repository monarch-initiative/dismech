- name: Craniofacial Morphogenesis Defect
  description: >-
    A recognizable facial gestalt dominated by narrowing of the palpebral
    fissures. Blepharophimosis and ptosis are the discriminating features,
    accompanied by arched eyebrows, epicanthic folds, a broad or flat nasal
    bridge, a high forehead, and dysmorphic ears. The gestalt is distinctive
    enough that CAFDADD is regularly first suspected as Ohdo syndrome, or as
    blepharophimosis-ptosis-epicanthus inversus syndrome.

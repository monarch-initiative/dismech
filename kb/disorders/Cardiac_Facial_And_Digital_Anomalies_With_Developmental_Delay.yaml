    term:
      id: GO:0016567
      label: protein ubiquitination
  downstream:
  - target: Attenuated ERK1/2 Phosphorylation
    causal_link_type: DIRECT
  - target: Perturbed MEKK3-MEK5-ERK5-KLF2 Signaling
    causal_link_type: DIRECT
  - target: Disrupted TRAF7-IFT57 Interaction and Cilia Loss
    causal_link_type: DIRECT
    description: >-
      TRAF7 is a required component of the MEKK3-MEK5-ERK5 module, so losing
      MEKK3 engagement perturbs that arm.
    evidence:
    - reference: PMID:37583551
      reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
      supports: SUPPORT

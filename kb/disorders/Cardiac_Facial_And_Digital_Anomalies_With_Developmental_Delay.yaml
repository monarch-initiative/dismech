- name: Axial Skeletal Patterning Defect
  description: >-
    Involvement of the neck, chest wall, and vertebral column: short neck with
    excess nuchal skin, pectus carinatum, and vertebral anomalies. Grouped
    separately from the digital anomalies because these derive from paraxial

      counseling.
discussions:
- discussion_id: traf7_null_mouse_vs_human_missense
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the endothelial-integrity failure seen in Traf7-null mice explain the
    congenital cardiovascular malformations of CAFDADD, given that every human
    disease allele is missense and the heterozygous null mouse is normal?
  attaches_to:
  - pathophysiology#Compromised Vascular Endothelial Integrity
  - pathophysiology#Perturbed MEKK3-MEK5-ERK5-KLF2 Signaling
  rationale: >-
    All in vivo mechanism for TRAF7 comes from null alleles, and the human
    disease has no null alleles at all. Homozygous Traf7 nulls die at midgestation
    from vessel failure, but the heterozygous null, which is the genotypic
    analogue of a patient, is phenotypically normal and fertile. That, plus a
    germline allele spectrum restricted to missense changes in the WD40 repeats
    and non-overlapping with the somatic meningioma residues, points to
    gain-of-function or dominant-negative rather than reduced dosage. So the
    MEKK3-MEK5-ERK5-KLF2 chain is inherited from loss-of-function biology and
    may not be the arm the disease alleles actually perturb. The one signaling
    readout measured with the patient alleles themselves is reduced ERK1/2
    phosphorylation, which belongs to a different MAPK arm. The heterozygous
    null result is itself contested: correspondence defending TRAF7
    pathogenicity in congenital heart disease cites International Mouse
    Phenotyping Consortium eye and ECG phenotypes in heterozygous Traf7-loss
    mice as evidence for haploinsufficiency, directly against the published
    "phenotypically normal and fertile" observation. Both cannot be right.
  proposed_experiments:
  - experiment_id: traf7_r655q_knockin_mouse
    name: Knock-in mouse carrying the recurrent human R655Q allele
    description: >-
      Generate a heterozygous Traf7 R655Q knock-in and compare it against the
      heterozygous null for cardiac, craniofacial, digital, and neurobehavioural
      phenotypes, and for KLF2 expression and ERK5 activation in endothelium.
    would_support:
    - pathophysiology#Compromised Vascular Endothelial Integrity
    supporting_outcome:
    - >-
      Heterozygous R655Q mice develop patent ductus arteriosus or septal
      defects with reduced endothelial Klf2, while heterozygous nulls remain
      normal, establishing a non-loss-of-function mechanism acting through the
      same endothelial arm.
    notes: >-
      A Traf7 R654Q knock-in mouse appears to exist already: the GEO series
      geo:GSE273833 recorded under datasets describes one, and reports
      hyperactivated MAPK rather than the reduced ERK1/2 the human alleles
      showed. No publication was findable at curation, so this experiment is
      listed as proposed rather than done. Check for the paper before
      commissioning it.
    would_refute:
    - pathophysiology#Perturbed MEKK3-MEK5-ERK5-KLF2 Signaling
    refuting_outcome:
    - >-
      Heterozygous R655Q mice reproduce the malformations with intact
      endothelial Klf2 and ERK5 activation, placing the causal defect outside
      this signaling arm.
  evidence:
  - reference: PMID:37583551
    reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous (Traf7GLOhet) mice were phenotypically normal and fertile"
    explanation: >-
      The normal heterozygous null is the specific result that makes the
      mouse's fidelity to the human heterozygous missense state an open
      question.
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "analyses of the observed TRAF7 mutations showed reduced ERK1/2 phosphorylation"
    explanation: >-
      The only signaling readout measured with the human disease alleles, and
      it sits on a different MAPK arm from the KLF2 pathway the mouse work
      implicates.
  - reference: PMID:38466853
    reference_title: "Reply to Pisan et al.: Pathogenicity of inherited TRAF7 mutations in congenital heart disease."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "heterozygous Traf7 loss causes phenotypes (eye abnormalities and ECG changes, International Mouse Phenotyping Consortium), supporting haploinsufficiency of Traf7"
    explanation: >-
      Contradicts the published normal heterozygous null, so the premise this
      mismatch rests on is itself disputed in the literature.
  notes: >-
    Filed as a model-fidelity question, not a knowledge gap: the mouse evidence
    exists and is strong, and what is unresolved is whether it transfers to the
    human allele class.
- discussion_id: traf7_germline_somatic_residue_divergence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the germline CAFDADD residues and the somatic meningioma residues in
    TRAF7 not overlap, and does a germline CAFDADD allele confer any measurable
    tumour risk?
  attaches_to:
  - treatments#Oncological Surveillance for Meningioma
  - genetic#TRAF7
  rationale: >-
    Recurrent germline and recurrent somatic TRAF7 variants sit at different
    positions, which suggests the two allele sets drive different signaling
    programs rather than a shared one at different doses. Oncological
    surveillance is currently recommended on the strength of gene identity, and
    no cohort has been followed long enough to attach a number to the risk. The
    report of a germline p.(Arg653Leu) adjacent to the meningioma hotspot is
    the point at which the separation may break down.
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel missense variant, p.(Arg653Leu), further underscores the complex relationship between germline TRAF7 variants and somatic changes linked to meningiomas"
    explanation: >-
      States the unresolved relationship between the germline and somatic
      variant sets that this gap is about.
- discussion_id: traf7_mapk_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do CAFDADD alleles raise or lower MAPK-ERK output? The one direct
    measurement on the disease alleles reports reduced ERK1/2 phosphorylation,
    while TRAF7's normal role is to restrain Ras-GTPases, which predicts that
    disrupting it should raise ERK output.
  attaches_to:
  - pathophysiology#Attenuated ERK1/2 Phosphorylation
  rationale: >-
    Wild-type TRAF7 inhibits Ras-GTPases and so damps the Ras-Raf-MEK1/2-ERK1/2
    cascade, and mutant TRAF7 has been reported to activate Ras GTPase
    signaling. Loss of that brake predicts increased ERK output. The 2018
    functional assay on the patient alleles measured the opposite, reduced
    ERK1/2 phosphorylation, and that single result is what this entry's
    pathophysiology chain is built on. The two are not reconcilable as stated,
    and which holds decides whether CAFDADD belongs with the RASopathies. An
    unpublished GEO series (geo:GSE273833) using a Traf7 R654Q knock-in mouse
    asserts hyperactivation; it is recorded under datasets and is deliberately
    not cited as evidence here.
  evidence:
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TRAF7 mutations also lead to activation of Ras GTPase signaling"
    explanation: >-
      States the activating direction that conflicts with the reduced ERK1/2
      phosphorylation measured on the patient alleles.
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "analyses of the observed TRAF7 mutations showed reduced ERK1/2 phosphorylation"
    explanation: >-
      The direct assay on the disease alleles measures the opposite direction,
      which is what makes this a genuine open question rather than a
      settled one.

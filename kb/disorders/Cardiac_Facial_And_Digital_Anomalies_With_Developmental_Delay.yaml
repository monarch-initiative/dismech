diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >-
    Molecular diagnosis rests on sequencing. Every published series identified
    TRAF7 by exome, targeted capture, or clinical exome panel, and the
    diagnosis is generally reached only after the phenotype has failed to match
    a named blepharophimosis or connective-tissue syndrome. Trio testing
    matters here specifically because the variants are de novo: a proband-only
    result loses the inheritance evidence that carries most of the
    interpretation weight.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  presence: PRESENT
  evidence:
  - reference: PMID:32376980
    reference_title: "Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "METHODS: We performed exome, targeted capture, and Sanger sequencing of patients with undiagnosed developmental disorders, in multiple independent diagnostic or research centers"
    explanation: >-
      The largest series states the sequencing methods by which the diagnosis
      is made.
- name: Karyotype and Chromosomal Microarray
  description: >-
    Uninformative, and worth recording as such. CAFDADD is caused by
    sequence-level missense change, so the cytogenetic workup that a
    multiple-anomaly presentation usually triggers first returns normal. A
    normal karyotype and microarray should move the workup to sequencing, not
    reassure.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: ABSENT
  evidence:
  - reference: PMID:38612512
    reference_title: "The First Korean Case with Cardiac, Facial, and Digital Anomalies with Developmental Delay Caused by De Novo TRAF7 p.Arg655Gln Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The initial tests included conventional karyotyping and chromosomal microarray analysis, but unfortunately, no pathogenic alterations were identified"
    explanation: >-
      Documents that the cytogenetic workup was uninformative in a molecularly
      confirmed patient.
- name: Parental Sanger Confirmation
  description: >-
    Segregation testing in both parents establishes the de novo status that
    supports pathogenicity. It also has a counselling purpose: a parent
    carrying the variant mosaically has been reported, so a negative parental
    result on standard Sanger does not fully exclude recurrence risk.
  diagnosis_term:
    preferred_term: Sanger sequencing of parental samples
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: PRESENT
  evidence:
  - reference: PMID:38612512
    reference_title: "The First Korean Case with Cardiac, Facial, and Digital Anomalies with Developmental Delay Caused by De Novo TRAF7 p.Arg655Gln Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the segregation of the TRAF7 c."
    explanation: >-
      Records the parental segregation testing step.
- name: Oncological Surveillance for Meningioma
  description: >-
    The same gene carries recurrent somatic mutations in meningioma,
    mesothelioma, and perineurioma, and the germline series recommends
    oncological evaluation as part of scheduled management. The germline and
    somatic residues reported so far do not overlap, so the magnitude of the
    tumour risk conferred by a CAFDADD allele is not established; surveillance
    here is a precaution grounded in gene identity, not a quantified risk.
  presence: PRESENT
  diagnosis_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasizing the need for oncological evaluations and proposing an evidence-based schedule for clinical management"
    explanation: >-
      Direct recommendation for oncological evaluation within a proposed
      management schedule.
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Somatic TRAF7 mutations are associated with subsets of meningiomas, mesotheliomas, and perineuriomas"
    explanation: >-
      Establishes the tumour types linked to somatic TRAF7 mutation that
      motivate surveillance.
- name: Audiological and Endocrine Assessment
  description: >-
    Hearing loss and endocrine anomalies including growth deficiency are
    recurrent and were under-recognized until the cohort grew, so both warrant
    scheduled assessment rather than symptom-driven referral.
  presence: PRESENT
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT

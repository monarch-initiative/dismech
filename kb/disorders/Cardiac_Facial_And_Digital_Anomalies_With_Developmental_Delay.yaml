datasets:
- accession: geo:GSE273833
  title: >-
    TRAF7 Mutations Stabilize K/NRAS and Hyperactivate MAPK Signaling to Cause
    CAFDADD Neurodevelopmental Defects
  data_type: BULK_RNA_SEQ
  sample_count: 6
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  notes: >-
    The only CAFDADD-specific expression dataset in GEO. Its submission summary
    describes a Traf7 R654Q/+ knock-in mouse and patient-specific cells, and
    proposes that TRAF7 variants stabilize K/NRAS and hyperactivate MAPK, which
    is the opposite direction from the reduced ERK1/2 phosphorylation reported
    with the disease alleles in 2018. No linked publication could be found in
    PubMed as of curation, so nothing from it is cited as evidence anywhere in
    this entry and the pathophysiology chain is unchanged by it. Recorded here
    so the next curator finds the dataset and the discrepancy rather than
    rediscovering both. Relevance triaged manually: DIRECT (the series title
    names CAFDADD).

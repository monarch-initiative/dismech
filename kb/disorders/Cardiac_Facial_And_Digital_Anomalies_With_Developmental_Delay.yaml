pathophysiology:
- name: TRAF7 WD40 Repeat Missense Variant
  description: >-
    A de novo heterozygous missense change in one of the seven C-terminal WD40
    repeats of TRAF7. The WD40 domain is the protein-interaction surface that
    binds MEKK3, so a substitution here alters partner engagement rather than
    abolishing the protein. The exclusively missense, position-restricted
    allele spectrum, and the fact that germline and meningioma-associated
    somatic residues do not overlap, argue against haploinsufficiency; the
    dominant-negative arm has since been shown biochemically for the
    meningioma-associated substitutions.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: TRAF7
      term:
        id: hgnc:20456
        label: TRAF7
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Recorded as dominant-negative on the strength of the heterodimerization
      and MEKK3 displacement experiments, which were run on
      meningioma-associated somatic substitutions rather than on a CAFDADD
      germline allele. The supporting arguments are that no null allele causes
      the syndrome and that the heterozygous null mouse is normal. Revise if a
      CAFDADD allele is characterized directly and behaves otherwise.
  downstream:
  - target: Disrupted TRAF7 E3 Ubiquitin Ligase and MEKK3 Adaptor Function
    causal_link_type: DIRECT
    description: >-
      WD40-domain substitutions sit on the surface through which TRAF7 engages
      MEKK3 and its ubiquitination substrates.
    evidence:
    - reference: PMID:37583551
      reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SCRIB binds with an N-terminal region of TRAF7, while MEKK3 associates with the C-terminal WD40 domain"
      explanation: >-
        Maps MEKK3 binding specifically to the WD40 domain that the germline
        variants occupy, which is why a substitution there perturbs the
        adaptor function.
  evidence:
  - reference: PMID:32376980
    reference_title: "Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all variants occur in the WD40 repeats and most are recurrent"
    explanation: >-
      Establishes that the pathogenic germline allele spectrum is confined to
      the WD40 repeats.
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These variants affect evolutionarily conserved amino acids and are located in key functional domains"
    explanation: >-
      Supports the claim that the substituted residues are conserved and lie in
      functional domains.
- name: Disrupted TRAF7 E3 Ubiquitin Ligase and MEKK3 Adaptor Function
  description: >-
    TRAF7 is the only TRAF family member that lacks the canonical C-terminal
    TRAF domain, carrying seven WD40 repeats instead, and it functions as a
    RING-finger E3 ubiquitin ligase and MEKK3-binding adaptor. Pathogenic
    variants disrupt E3 ligase catalytic activity and alter the interaction
    with the MAPK machinery, so downstream signaling is rewired rather than
    simply reduced.
  biological_scale: MOLECULAR
  molecular_functions:

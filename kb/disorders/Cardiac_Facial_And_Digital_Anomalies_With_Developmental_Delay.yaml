  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene-specific mutation rate analysis showed that the occurrence of the de novo variants in TRAF7 (p = 2.6 × 10-3) and the recurrent de novo c.1964G>A (p.Arg655Gln) variant (p = 1.9 × 10-8) in our exome cohort was unlikely to have occurred by chance.
    explanation: >-
      The statistical argument for causality in the discovery series, rather than
      a bare assertion of association.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transesophageal and transthoracic echocardiography unveiled right ventricular dilatation without significant
      pulmonary hypertension, bicuspid aortic valve with aortic root aneurysm, and aortic regurgitation in the proband.
    explanation: >-
      The adult cardiac findings that argue for continued rather than one-off
      cardiac surveillance.

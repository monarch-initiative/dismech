    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Communication challenges, particularly in expressive language, are prevalent, necessitating alternative communication methods.
    explanation: >-
      Establishes the expressive-language emphasis and its functional
      consequence.
- name: Craniosynostosis
  category: Craniofacial
  description: >-
    A severe cranial subgroup has been described with multi-suture
    craniosynostosis, a pear-shaped skull, sinus pericranii and craniocervical
    junction anomalies. It is reported in a minority of patients and is not a
    core feature.
  phenotype_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  evidence:
  - reference: PMID:32459067
    reference_title: "Sinus pericranii, skull defects, and structural brain anomalies in TRAF7-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to the typical hallmarks of the TRAF7-related disorder, both subjects presented with a recognizable "pear-shaped" skull due to multiple craniosynostosis, sinus pericranii, skull base/cranio-cervical junction anomalies, dysgyria, and inferior cerebellar vermis hypoplasia.
    explanation: >-
      Describes the cranial subgroup this phenotype records, in two patients.
  - reference: PMID:34247275
    reference_title: "Multi-suture craniosynostosis in c.1570C>T (p.Arg524Trp) mutated TRAF7: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a child who presented with multi-suture craniosynostosis and had the uncommon c.1570C>T (p.Arg524Trp) variant of TRAF7.
    explanation: >-
      An independent case linking multi-suture craniosynostosis to one of the
      recurrent TRAF7 alleles, which is why the cranial subgroup is recorded as a
      real but minority feature rather than a one-family finding.

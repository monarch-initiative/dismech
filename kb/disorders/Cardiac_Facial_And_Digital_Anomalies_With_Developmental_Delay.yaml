- name: Perturbed MEKK3-MEK5-ERK5-KLF2 Signaling
  description: >-
    TRAF7 is a required component of the shear-stress-responsive
    MEKK3-MEK5-ERK5 module that endothelial cells use to read blood flow, with
    KLF2 as its principal transcriptional output. Loss of Traf7 in mice
    collapses Klf2 expression. Note that the human disease alleles are missense
    and their specific effect on this arm has not been measured directly, so
    this node is anchored on model-organism loss-of-function work.
  biological_scale: MOLECULAR

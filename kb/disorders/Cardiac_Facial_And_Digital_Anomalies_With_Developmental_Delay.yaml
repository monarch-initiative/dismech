- name: Genetic Counseling
  description: >-
    Variants are de novo in nearly all probands, so recurrence risk for
    unaffected parents is low but not zero: parental mosaicism has been
    documented and transmitted. Counseling should cover the possibility of a
    mosaic parent rather than quoting a de novo recurrence risk outright.

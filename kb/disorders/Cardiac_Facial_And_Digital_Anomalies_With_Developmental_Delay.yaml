- name: Continuous Positive Airway Pressure for Obstructive Sleep Apnea
  description: >-
    The obstructive sleep apnea of CAFDADD is anatomically driven by the short
    neck and vertebral anomaly, so it does not resolve on its own and is easy
    to attribute to something else in a patient with intellectual disability
    who cannot report daytime somnolence. CPAP relieved it in the one adult
    reported, who had presented in heart failure.

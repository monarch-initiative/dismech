    Reported in 17 individuals in the 2020 core cohort.
  phenotype_term:
    preferred_term: Pectus carinatum
    term:
      id: HP:0000768
      label: Pectus carinatum
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anomalies of the axial skeleton were frequent: short neck (n=24), pectus carinatum (n=17) and other chest

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "analyses of the observed TRAF7 mutations showed reduced ERK1/2 phosphorylation"
    explanation: >-
      Direct functional assay of the patient variants demonstrating reduced
      ERK1/2 phosphorylation.
- name: Perturbed MEKK3-MEK5-ERK5-KLF2 Signaling
  description: >-
    TRAF7 is a required component of the shear-stress-responsive
    MEKK3-MEK5-ERK5 module that endothelial cells use to read blood flow, with
    KLF2 as its principal transcriptional output. Loss of Traf7 in mice
    collapses Klf2 expression. Note that the human disease alleles are missense
    and their specific effect on this arm has not been measured directly, so
    this node is anchored on model-organism loss-of-function work.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cellular response to fluid shear stress
    modifier: DECREASED
    term:
      id: GO:0071498
      label: cellular response to fluid shear stress
  downstream:
  - target: Compromised Vascular Endothelial Integrity
    causal_link_type: DIRECT

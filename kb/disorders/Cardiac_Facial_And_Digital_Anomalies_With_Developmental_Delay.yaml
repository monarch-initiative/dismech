prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Published cohorts establish an ultra-rare disorder, but do not provide a population prevalence. The 2020 study
    recruited 45 individuals and analyzed a core group of 42 after excluding three uncertain coiled-coil variants.
    Later cohorts and follow-up reports overlap, so their sample sizes are not summed into a current count of unique
    affected individuals.
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified heterozygous missense variants in TRAF7 as the cause of a developmental delay-malformation syndrome
      in 45 patients.
    explanation: >-
      Documents the size of this published cohort or literature review; not a population prevalence or a deduplicated
      current case total.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic analysis and a comprehensive review of the 58 previously reported cases outline consistent clinical
      presentations, emphasizing dysmorphic features, developmental delay, endocrine manifestations, and cardiac
      defects.
    explanation: >-
      Documents the size of this published cohort or literature review; not a population prevalence or a deduplicated
      current case total.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, usually de novo. Established familial transmission includes an affected mother and affected
    dizygotic twins, and a mosaic affected mother transmitting her variant to a non-mosaic affected son. Variable
    expressivity in these families is distinct from the disputed isolated-CHD variants inherited from apparently
    unaffected parents. Parental and proband mosaicism can complicate testing and recurrence counseling.
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified variants are de novo in six individuals and comprise four distinct missense changes, including
      a c.1964G>A (p.Arg655Gln) variant that is recurrent in four individuals.
    explanation: >-
      Establishes de novo occurrence and the recurrent p.Arg655Gln allele in the
      discovery series.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cohort includes 36 sporadic cases in which the TRAF7 variant was de novo, one patient with low level maternal
      mosaicism for the TRAF7 variant, five cases with unknown inheritance and one familial case (patients 24-26)
      in which affected dizygotic twins inherited a TRAF7 variant from their affected mother, in whom the variant
      arose de novo (Figure S1).
    explanation: >-
      Includes confirmed familial transmission and low-level maternal mosaicism.
  - reference: PMID:37067385
    reference_title: Novel mosaic TRAF7 likely pathogenic variant in an African American family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was identified to harbor this likely pathogenic variant in a mosaic (33.89%) state in leukocytes.
    explanation: >-
      A clinically affected mother carried the variant in a mosaic state.
  - reference: PMID:37067385
    reference_title: Novel mosaic TRAF7 likely pathogenic variant in an African American family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He has the same variant in a non-mosaic state.
    explanation: >-
      Her affected son demonstrates transmission from a mosaic parent.
pathophysiology:
- name: Heterozygous TRAF7 missense variant
  biological_scale: MOLECULAR
  description: >-
    The developmental syndrome is associated predominantly with recurrent heterozygous missense variants in the
    WD40 repeats, with some coiled-coil variants also established. The variant spectrum favors allele-specific altered
    function over simple haploinsufficiency, but does not establish a single biochemical mechanism for every allele.
    Constitutional and postzygotic mosaic presentations are reported.
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: SNV
    description: >-
      This node describes constitutional heterozygous missense variants, predominantly de novo. A dominant-negative
      effect is a proposed mechanism rather than an established property of all syndrome alleles; mosaic presentations
      are described separately in genetics and inheritance.
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  evidence:
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TRAF7 syndrome is caused by several pathogenic TRAF7 mutations, most of which are located within the WD40
      repeat protein domain, and the most recurrent of these mutations are p.Arg655Gln, p.Arg524Trp, and p.Phe617Leu
    explanation: >-
      Names the domain and the recurrent alleles this node records. Evidence
      source is OTHER because this is a review.
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants are predominantly within the WD40 repeats and recurrent, suggesting specific alterations to the protein
      as the pathomechanism, as opposed to haploinsufficiency.
    explanation: >-
      States the argument against haploinsufficiency directly. Notable because
      this letter disputes other claims by the group whose dominant-negative
      model is cited on the next node, so the two sides agree on this point.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of recurrent missense variants largely restricted to the WD40 repeats suggests a disease mechanism
      involving specific functional changes to the mutant TRAF7 protein, rather than haploinsufficiency.
    explanation: >-
      Primary cohort supports altered function without proving one direction of effect for every variant.
  downstream:
  - target: Reduced TRAF7-IFT57 binding
    description: >-
      Binding was reduced for tested variants including syndrome-associated p.Thr601Ala; extrapolation to other
      syndrome variants remains untested.
    causal_link_type: DIRECT
  - target: Reduced ERK1/2 phosphorylation in overexpression assays
    description: >-
      Variant-dependent ERK1/2 changes were measured in an overexpression system.
    causal_link_type: DIRECT
  - target: Destabilization of the TRAF7 coiled-coil trimer
    description: >-
      This effect was measured for p.Lys346Glu, not every coiled-coil variant.
    causal_link_type: DIRECT
  - target: Dysregulation of developmental gene expression
    description: >-
      Patient fibroblasts carrying WD40 missense variants have altered transcriptomes; the intervening signaling
      events remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    description: >-
      Human cohorts establish the genotype-phenotype association; the mechanism of developmental delay is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal digit morphology
    description: >-
      Human cohorts establish digital anomalies, without demonstrating a neural-crest mechanism for the limb phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Destabilization of the TRAF7 coiled-coil trimer
  biological_scale: MOLECULAR
  description: >-
    Purified TRAF7 coiled-coil fragments form trimers. p.Lys346Glu reduces the apparent molecular weight and stability
    of this assembly, whereas p.Arg371Gly showed no significant molecular-weight change. Both variants failed to
    rescue Traf7 knockdown in zebrafish; the shared rescue failure does not demonstrate a shared trimer defect or
    dominant-negative mechanism.
  evidence:
  - reference: PMID:38178633
    reference_title: The structure of TRAF7 coiled-coil trimer provides insight into its function in zebrafish embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MALS assays revealed that K346E exhibited a lower molecular weight compared to the wild-type TRAF7 CC, while
      R371G did not present a significant difference in molecular weight (Figure 5B), suggesting a weakened stability
      of the TRAF7 homotrimer caused by the K346E mutation.
    explanation: >-
      Direct biophysical comparison distinguishes the two syndrome-associated coiled-coil alleles.
- name: Reduced TRAF7-IFT57 binding
  biological_scale: MOLECULAR
  description: >-
    Coimmunoprecipitation in HEK293 cells showed reduced IFT57 binding for p.Thr601Ala, the disputed CHD-associated
    p.Val442Met, and somatic tumor-associated p.Gly536Ser. The p.Thr601Ala experiment supplies a direct connection
    to the established developmental syndrome. These selected alleles do not establish a universal effect of all
    germline variants.
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Meningioma and CHD- and craniofacial defect-associated TRAF7 mutants (G536S, V442M, and T601A, respectively)
      show reduced interaction with IFT57.
    explanation: >-
      Figure 6 identifies the specific tested variants; the following sentence specifies HEK293 coimmunoprecipitation.
  downstream:
  - target: Reduced cilium maintenance
    description: >-
      Reduced IFT57 binding and impaired ciliation support the proposed interaction-to-cilium mechanism, although
      allele-specific rescue is still needed.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced cilium maintenance
  biological_scale: CELLULAR
  description: >-
    Expression of p.Thr601Ala or p.Val442Met reduced primary cilia in O9 neural crest cells. In frog and fish depletion
    models, ciliary transport, cilium number and motility were impaired. These findings support a ciliary mechanism
    for selected alleles; patient-wide ciliary dysfunction has not been demonstrated.
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      transfection of CHD-associated mutant TRAF7 (V442M, T601A), but not WT-TRAF7, into O9 primary neural crest
      cells abrogates primary cilia (SI Appendix, Fig. S7 A–D).
    explanation: >-
      The experiment includes p.Thr601Ala from the original syndrome cohort as well as disputed p.Val442Met.
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both anterograde and retrograde transport were severely abrogated in the TRAF7 morphant embryos as compared
      to controls
    explanation: >-
      Frog depletion experiments directly measured intraflagellar transport.
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  downstream:
  - target: Perturbed neural crest development
    description: >-
      Loss of cilia and altered neural crest markers coexist in developmental models; mediation of the human syndrome
      remains a hypothesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced ERK1/2 phosphorylation in overexpression assays
  biological_scale: MOLECULAR
  description: >-
    The discovery study measured reduced ERK1/2 phosphorylation in cells overexpressing syndrome-associated variants.
    Effects differ by allele: the coiled-coil variants had no or smaller effects than the WD40 variants. These are
    overexpression results, not measurements in patient-derived fibroblasts. Their relationship to the fibroblast
    transcriptome and to specific clinical findings is unresolved.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: DECREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro analyses of the observed TRAF7 mutations showed reduced ERK1/2 phosphorylation.
    explanation: >-
      The measurement this node records, from the syndrome's discovery series.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Tokita et al reported two TRAF7 syndrome patients with variants in the coiled-coil domain (p.(Lys346Glu) and
      p.(Arg371Gly)), although these had no or less negative effect on ERK1/2 phosphorylation compared to the two
      WD40 repeat variants they identified (p.(Thr601Ala) and p.(Arg655Gln)).
    explanation: >-
      The later cohort paper summarizes allele dependence in the original overexpression assays.
    quote_role: BACKGROUND
- name: Dysregulation of developmental gene expression
  biological_scale: CELLULAR
  description: >-
    RNA sequencing compared skin fibroblasts from three patients with p.Leu402Val, p.Leu519Phe or p.Arg655Gln against
    six controls, with and without TNF stimulation. There were 76 differentially expressed genes at baseline and
    90 after TNF under the stringent differential-expression threshold. Pathway enrichment used a separate, less
    stringent set of 726 baseline genes and suggested axon-guidance, Wnt/calcium and NFAT-related pathways. A fourth
    patient was included in selected qPCR validation; these exploratory findings do not prove that a particular
    pathway causes the clinical abnormalities.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified 76 DEGs in basal conditions (51.31% up-regulated and 48.68% down-regulated) and 90 DEGs after
      TNFα treatment (40% up-regulated and 60% down-regulated)
    explanation: >-
      Measured differential expression in patient-derived fibroblasts.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      To explore the different pathways and biological functions that might be affected, we performed IPA on the
      726 DEGs identified under basal conditions using less stringent criteria than the preceding analyses
    explanation: >-
      Pathway enrichment is computational and uses a different threshold from the 76-gene result.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Results for seven out of the 12 were confirmatory (ANGPT1, CASK, KIF26B, WNT5A, CFD, GPC6, KAZALD1)
    explanation: >-
      Selected qPCR follow-up supports part of the transcriptomic signal.
- name: Perturbed neural crest development
  biological_scale: TISSUE
  description: >-
    Traf7 depletion in fish and frog alters neural crest markers and pharyngeal arches. Overexpression of selected
    developmental variants also perturbs neural crest markers in Xenopus. This is a proposed route to craniofacial
    and cardiac abnormalities, supported by experimental embryology rather than by lineage tracing in patients.
    It does not establish a neural-crest origin for developmental delay or digital anomalies.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: ABNORMAL
    term:
      id: GO:0014032
      label: neural crest cell development
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, TRAF7 knockdown by unilateral injection of morpholinos at the 2-cell stage disrupted the expression
      of neural crest markers Sox10 and Twist on the injected side (Fig. 2 O and Q).
    explanation: >-
      Direct neural crest marker perturbation in Xenopus depletion experiments.
  downstream:
  - target: Congenital cardiovascular malformation
    description: >-
      Model-derived hypothesis connecting neural crest defects to cardiac malformation; the precise route to the
      common patent ductus arteriosus phenotype is unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal facial shape
    description: >-
      Craniofacial defects in the model systems motivate this proposed human disease link.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Global developmental delay
  category: Neurologic
  description: >-
    Developmental delay, particularly of motor and expressive-language
    milestones, is the most consistent feature. Severity varies widely, and the
    2024 series reported individuals whose early psychomotor delay resolved into
    normal development, so delay should not be treated as an obligate criterion
    despite appearing in the disease name.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seven individuals share substantial phenotypic overlap, with developmental delay, congenital heart defects,
      limb and digital anomalies, and dysmorphic features emerging as key unifying features.
    explanation: >-
      Establishes developmental delay as one of the four unifying features of the
      syndrome.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this enlarged collection, novelties include a wider range of cognitive dysfunction, with some individuals
      exhibiting normal development despite early psychomotor delay.
    explanation: >-
      The basis for the description's warning that developmental delay is
      frequent rather than obligate.
- name: Congenital cardiovascular malformation
  category: Cardiovascular
  description: >-
    Congenital heart disease is a major source of early morbidity. Patent ductus
    arteriosus is the single most frequent lesion, followed by septal and
    valvular defects.
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patent ductus arteriosus (PDA; not found in Mishra-Gorur et al.’s patients) is the most frequent feature,
      followed by septal and valvular defects.
    explanation: >-
      The ordering of cardiac lesion types, from the group that assembled the
      largest phenotype series.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac defects, frequently severe, pose early-life complications.
    explanation: >-
      Supports the clinical weight this phenotype carries.
- name: Patent ductus arteriosus
  category: Cardiovascular
  description: >-
    Reported in 24 individuals in the 2020 core cohort; many required surgical repair.
  phenotype_term:
    preferred_term: Patent ductus arteriosus
    term:
      id: HP:0001643
      label: Patent ductus arteriosus
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital cardiac defects were also frequent: 24 patients had patent ductus arteriosus (many of which required
      surgical repair), nine had atrial and six had ventricular septal defects and 10 had anomalies of valves.
    explanation: >-
      Reported clinical finding in the source cohort.
- name: Abnormal facial shape
  category: Craniofacial
  description: >-
    A recognizable gestalt in which blepharophimosis is the most characteristic
    element, with arched eyebrows also noted. Ptosis, hypertelorism and ear and
    nose anomalies are described in the cohorts.
  phenotype_term:
    preferred_term: Abnormal facial shape
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Major features include a recognizable facial gestalt (characterized in particular by blepharophimosis), short
      neck, pectus carinatum, digital deviations, and patent ductus arteriosus.
    explanation: >-
      Establishes the recognizable gestalt and names blepharophimosis as its
      leading element.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Facial features, including arched eyebrows, contribute to the distinct gestalt.
    explanation: >-
      Adds arched eyebrows to the gestalt from the most recent series.
- name: Blepharophimosis
  category: Ophthalmologic
  description: >-
    A characteristic facial feature, reported in 33 individuals in the 2020 core cohort.
  phenotype_term:
    preferred_term: Blepharophimosis
    term:
      id: HP:0000581
      label: Blepharophimosis
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all patients presented with anomalies of the palpebral fissures; most frequently blepharophimosis (n=33),
      along with epicanthus (n=20), telecanthus (n=14), ptosis (n=19) and up- or downslanting palpebral fissures
      (n=11)
    explanation: >-
      Reported clinical finding in the source cohort.
- name: Abnormal digit morphology
  category: Musculoskeletal
  description: >-
    Digital deviations are one of the three organ systems in the disease name.
    Brachydactyly and syndactyly are also reported.
  phenotype_term:
    preferred_term: Abnormal digit morphology
    term:
      id: HP:0011297
      label: Abnormal digit morphology
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seven individuals share substantial phenotypic overlap, with developmental delay, congenital heart defects,
      limb and digital anomalies, and dysmorphic features emerging as key unifying features.
    explanation: >-
      Establishes limb and digital anomalies as a unifying feature.
- name: Short neck
  category: Musculoskeletal
  description: >-
    Reported in 24 individuals in the 2020 core cohort.
  phenotype_term:
    preferred_term: Short neck
    term:
      id: HP:0000470
      label: Short neck
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

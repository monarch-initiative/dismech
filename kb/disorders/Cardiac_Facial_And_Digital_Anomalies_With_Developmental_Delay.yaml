    relationship: PERTURBS
    fidelity: MODERATE
    limitations: >-
      Depletion and overexpression do not reproduce endogenous patient-allele dosage. Cross-species ciliary phenotypes
      do not establish the frequency or severity of ciliary dysfunction in patients.

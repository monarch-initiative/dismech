genetic:
- name: TRAF7
  association: Germline missense, WD40-repeat clustered
  gene_term:
    preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  variant_origin: GERMLINE
  notes: >-
    Recurrent WD40 missense variants predominate, including p.Arg655Gln. Some coiled-coil alleles are established,
    while others in the 2020 series remained uncertain. A single dominant-negative mechanism is not proven for every
    allele. Published inherited and mosaic cases support variable expressivity; they do not establish complete absence
    of penetrance in unaffected carriers.
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene-specific mutation rate analysis showed that the occurrence of the de novo variants in TRAF7 (p = 2.6
      × 10-3) and the recurrent de novo c.1964G>A (p.Arg655Gln) variant (p = 1.9 × 10-8) in our exome cohort was
      unlikely to have occurred by chance.
    explanation: >-
      The statistical argument for causality in the discovery series, rather than
      a bare assertion of association.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all variants occur in the WD40 repeats and most are recurrent.
    explanation: >-
      Establishes the domain clustering and recurrence in the largest cohort.
- name: TRAF7 mosaicism
  association: Postzygotic mosaic multisystem presentation
  gene_term:
    preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  notes: >-
    A p.Arg641Cys mosaic case had developmental anomalies and meningiomatosis, with the variant detected at different
    levels in tumor and non-tumor tissues. This individual does not estimate tumor incidence in constitutional heterozygotes.
  evidence:
  - reference: PMID:35733823
    reference_title: "TRAF7 somatic mosaicism in a patient with bilateral optic nerve sheath meningiomas: illustrative case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional testing of unaffected tissues identified the same variant at lower allele frequencies, consistent
      with postzygotic somatic mosaicism.
    explanation: >-
      Multi-tissue testing distinguishes constitutional mosaicism from a tumor-only mutation.
diagnosis:
- name: TRAF7 sequencing and segregation analysis
  description: >-
    Exome sequencing, targeted panels or directed TRAF7 testing can identify a causative variant. A negative karyotype
    or chromosomal microarray does not exclude a sequence variant. Parental segregation testing helps establish
    de novo occurrence or familial transmission, and suspected mosaic cases may require sensitive testing of multiple
    tissues. Published cohorts predominantly contain missense variants; variant classification requires clinical
    and molecular context.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38612512
    reference_title: The First Korean Case with Cardiac, Facial, and Digital Anomalies with Developmental Delay Caused by De Novo TRAF7 p.Arg655Gln Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial tests included conventional karyotyping and chromosomal microarray analysis, but unfortunately,
      no pathogenic alterations were identified.
    explanation: >-
      Records that karyotype and array were uninformative in a confirmed case,
      which is the point about a prior negative array.
  - reference: PMID:38612512
    reference_title: The First Korean Case with Cardiac, Facial, and Digital Anomalies with Developmental Delay Caused by De Novo TRAF7 p.Arg655Gln Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing confirmed the segregation of the TRAF7 c.1964G>A; p.Arg655Gln variant with the phenotype
      and established the de novo autosomal dominant status of the heterozygous variant in the patient, but not
      in his parents and sibling.
    explanation: >-
      The parental-segregation step that establishes de novo status.
  - reference: PMID:38612512
    reference_title: The First Korean Case with Cardiac, Facial, and Digital Anomalies with Developmental Delay Caused by De Novo TRAF7 p.Arg655Gln Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was classified as pathogenic according to ACMG guidelines, considering the following criteria:
      PS2, PM1, PM2, PP1, PP2, and PP3.
    explanation: >-
      A worked ACMG classification for the recurrent p.Arg655Gln allele, showing
      which criteria the evidence supports.
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although almost all TRAF7 variants were identified through trio exome sequencing, inclusion of TRAF7 on an
      NGS panel of genes mutated in neurocristopathy and craniofacial malformation syndromes led to the identification
      of two further individuals through diagnostic screening
    explanation: >-
      Primary evidence for both exome and targeted-panel diagnosis.
- name: Baseline cardiac assessment
  description: >-
    Cardiac assessment is central because congenital defects, especially patent ductus arteriosus, septal and valvular
    lesions, are common. Continued cardiology follow-up is tailored to the findings. An adult case with bicuspid
    aortic valve developed a progressive aortic root aneurysm requiring surgery.
  evidence:
  - reference: PMID:38466850

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our comprehensive analysis expands the phenotypic spectrum, emphasizing the need for oncological evaluations
      and proposing an evidence-based schedule for clinical management.
    explanation: >-
      The source of the proposed management schedule. Note it also calls for
      oncological evaluation, which is treated as an open question below rather
      than as an established surveillance recommendation here.
- name: Assisted learning and augmentative communication
  description: >-

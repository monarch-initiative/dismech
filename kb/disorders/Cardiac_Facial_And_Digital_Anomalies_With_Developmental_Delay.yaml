discussions:
- discussion_id: controversy_traf7_inherited_variants_and_chd
  prompt: >-
    Do inherited TRAF7 variants transmitted from unaffected parents cause
    isolated congenital heart disease, or are the three reported alleles
    (p.Val142Met, p.Val442Met, c.1998+2T>G) not pathogenic?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Heterozygous TRAF7 missense variant
  - phenotypes#Congenital cardiovascular malformation
  rationale: >-
    The PNAS report interpreted three variants found in an isolated-CHD cohort as causal despite transmission from
    apparently unaffected parents. A published letter challenged their pathogenicity based on population variation,
    inheritance and absence of the characteristic syndrome; the authors defended functional and computational results.
    This dispute concerns those alleles and does not negate affected-parent transmission established in syndrome
    families. Population loss-of-function tolerance alone also does not settle every allele-specific mechanism.
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While somatic variants of TRAF7 (Tumor necrosis factor receptor-associated factor 7) underlie anterior skull-base
      meningiomas, here we report the inherited mutations of TRAF7 that cause congenital heart defects.
    explanation: >-
      The claim under dispute, stated by the authors who made it.
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All were inherited from healthy parents, while non-penetrance of TRAF7 variants has not been previously reported
      in the MCA-IDS.
    explanation: >-
      The letter challenges these three variants on the basis of unaffected transmitting parents; this is distinct
      from affected-parent transmission in established families.
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the gnomAD probability of being loss-of-function intolerant of TRAF7 is 0.02, suggesting good tolerance
      to heterozygous loss-of-function variants in the general population, and arguing against c.1998+2T>G causing
      a CHD.
    explanation: >-
      The population-genetic argument against the splice allele specifically,
      which is the one that would establish haploinsufficiency.
  - reference: PMID:38466853
    reference_title: "Reply to Pisan et al.: Pathogenicity of inherited TRAF7 mutations in congenital heart disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Experimentally, overexpression of p.Val442Met consistently phenocopies TRAF7 knockdown in Xenopus and zebrafish.
    explanation: >-
      The authors' functional rebuttal. Graded MODEL_ORGANISM because the sentence
      reports the Xenopus and zebrafish result.
- discussion_id: hypothesis_traf7_endothelial_mekk3_erk5_klf2_branch
  prompt: >-
    TRAF7 sits upstream of the shear-responsive MEKK3-MEK5-ERK5-KLF2 endothelial
    pathway. Does that branch contribute to the congenital cardiovascular
    malformations of this syndrome, or only to the vascular-integrity failure
    seen when Traf7 is deleted outright?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Heterozygous TRAF7 missense variant
  - phenotypes#Congenital cardiovascular malformation
  rationale: >-
    Global and endothelial Traf7 deletion impairs vascular integrity and Klf2 expression in mice. TRAF7 depletion
    also reduces shear-induced ERK5 phosphorylation in cultured endothelial cells. These experiments establish normal
    TRAF7 function, but the contribution of this pathway to human missense-variant disease remains unproven. The
    clinical predominance of patent ductus arteriosus makes vessel-wall mechanisms worth testing alongside neural
    crest and ciliary hypotheses.
  evidence:
  - reference: PMID:37583551
    reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      They displayed significantly lower expression of transcription factor Klf2, an essential regulator of vascular
      hemodynamic forces downstream of the MEKK3-MEK-ERK5 signaling pathway.
    explanation: >-
      Places TRAF7 upstream of the KLF2 axis in the mouse, which is the
      observation this hypothesis rests on and the limit of what is shown.
  - reference: PMID:37583551
    reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Downregulation of TRAF7 as well as SCRIB inhibited fluid shear stress-induced phosphorylation of ERK5 in cultured
      endothelial cells.
    explanation: >-
      Supports the endothelial signaling branch in cell experiments, without demonstrating a patient-variant effect.
- discussion_id: gap_traf7_germline_somatic_overlap_and_tumor_risk
  prompt: >-
    How do allele identity, mosaic distribution and tissue context distinguish developmental TRAF7 disease from
    tumor-associated TRAF7 alterations, and is tumor incidence increased in constitutional carriers?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Heterozygous TRAF7 missense variant
  - treatments#Supportive multidisciplinary care
  rationale: >-
    Germline and somatic variant spectra are largely distinct, but absolute mutual exclusivity is inaccurate. The
    2020 cohort noted p.Arg524Trp in both syndrome patients and a meningioma carrying an activating SMO variant,
    leaving the TRAF7 contribution to that tumor uncertain. The 2024 p.Arg653Leu syndrome variant affects the same
    residue as other tumor substitutions. A mosaic p.Arg641Cys case combines developmental anomalies and meningiomatosis.
    These observations do not quantify tumor risk for constitutional heterozygotes. Proposed oncological follow-up
    is based on sparse observations; one reported endometrioid carcinoma occurred in a carrier of a coiled-coil
    variant of uncertain significance.
  proposed_experiments:
  - experiment_id: exp_traf7_allele_matched_interactome
    name: Side-by-side interactome comparison of germline-type and somatic-type TRAF7 alleles
    description: >-
      Express matched sets of recurrent germline (p.Arg655Gln, p.Arg524Trp,
      p.Phe617Leu) and somatic meningioma TRAF7 alleles in one cell background and
      compare their interactomes by affinity purification mass spectrometry,
      focusing on IFT57, CYLD, MEKK3 and NEMO, together with ubiquitin ligase
      activity and cilium assembly readouts.
    would_support:
    - discussions#gap_traf7_germline_somatic_overlap_and_tumor_risk
    supporting_outcome:
    - >-
      Reproducible allele-dependent differences would support distinct molecular effects in the tested system.
    refuting_outcome:
    - >-
      No detectable difference would weaken that particular assay-level hypothesis without establishing biological
      equivalence or predicting tumor risk.
    decision_criterion: >-
      Compare prespecified interaction and ciliary readouts across alleles, with expression matching and independent
      replication; interpret negative results within assay sensitivity.
  - experiment_id: exp_traf7_tumour_incidence_cohort
    name: Longitudinal tumour-incidence study in a germline TRAF7 cohort
    description: >-
      Follow an international registry cohort of individuals with confirmed
      germline TRAF7 variants with a defined imaging and clinical protocol,
      reporting age-specific incidence of meningioma, mesothelioma and other
      tumours against population expectation.
    supporting_outcome:
    - >-
      Excess age-specific incidence would support increased tumor susceptibility; surveillance benefit would still
      require separate assessment.
    refuting_outcome:
    - >-
      Sufficiently precise incidence estimates near population expectation would constrain the magnitude of possible
      excess risk.
    decision_criterion: >-
      Estimate age-specific risk with confidence intervals and adequate follow-up, separating constitutional and
      mosaic carriers; failure to detect an increase does not establish absence of risk.
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, there is only one syndromic variant, p.(Arg524Trp) (de novo or maternal mosaic
      in four unrelated cases here) that has also been reported in a tumor sample.
    explanation: >-
      Explicit exception to the broad non-overlap claim; the following text notes a co-occurring activating SMO
      variant.
  - reference: PMID:35733823
    reference_title: "TRAF7 somatic mosaicism in a patient with bilateral optic nerve sheath meningiomas: illustrative case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case involved a 15-year-old girl with bilateral optic nerve sheath meningiomas, diffuse meningiomatosis,
      and syndromic features, including craniosynostosis, brain anomalies, syndactyly, brachydactyly, epicanthus,
      and patent ductus arteriosus.
    explanation: >-
      Mosaic developmental and neoplastic overlap in one patient, not a constitutional-carrier risk estimate.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel missense variant, p.(Arg653Leu), further underscores the complex relationship between germline TRAF7
      variants and somatic changes linked to meningiomas.
    explanation: >-
      Different amino-acid substitutions can affect the same residue.

prevalence:
- population: Worldwide, reported cases in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 100 individuals had been reported when the largest review was
    published in 2024: 58 previously reported cases plus 11 new ones. No
    population-based prevalence estimate exists, and Orphanet has no
    epidemiology record for this entity, so the count of published cases is the
    only figure available. It is a lower bound, not a prevalence.
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a detailed description of 11 new TRAF7-related CAFDADD cases, featuring eight distinct variants, including a novel one"
    explanation: >-
      Supplies the case count contributed by the largest series, on top of the
      58 previously reported cases it reviews.
treatments:
- name: Cardiac Surveillance and Congenital Heart Defect Repair
  description: >-
    Congenital heart disease is frequently severe and is the main driver of
    early-life complications, so echocardiographic assessment at diagnosis and
    ongoing cardiological follow-up are standard, with surgical or catheter
    closure of a haemodynamically significant patent ductus arteriosus or
    septal defect as indicated. Note that pectus carinatum can degrade the
    echocardiographic window, so a non-diagnostic study should prompt
    cross-sectional imaging rather than reassurance.
  treatment_term:
    preferred_term: cardiac surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Patent ductus arteriosus
    term:
      id: HP:0001643
      label: Patent ductus arteriosus
  target_mechanisms:
  - target: Congenital Cardiovascular Malformation
    description: >-
      Repair addresses the structural lesion; it does not modify the underlying
      TRAF7 signaling defect.
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac defects, frequently severe, pose early-life complications"
    explanation: >-
      Establishes the clinical severity that motivates cardiac assessment and
      intervention.
  - reference: PMID:34513876
    reference_title: "Case Report: Blepharophimosis and Ptosis as Leading Dysmorphic Features of Rare Congenital Malformation Syndrome With Developmental Delay - New Cases With TRAF7 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patent ductus arteriosus and patent foramen ovale diagnosed in the patient are typical cardiac manifestations of the CAFDADD syndrome, which indicates the need for constant cardiological supervision"
    explanation: >-
      States the recommendation for continuing cardiological supervision.
- name: Oncological Surveillance for Meningioma
  description: >-
    The same gene carries recurrent somatic mutations in meningioma,
    mesothelioma, and perineurioma, and the germline series recommends
    oncological evaluation as part of scheduled management. The germline and
    somatic residues reported so far do not overlap, so the magnitude of the
    tumour risk conferred by a CAFDADD allele is not established; surveillance
    here is a precaution grounded in gene identity, not a quantified risk.
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "emphasizing the need for oncological evaluations and proposing an evidence-based schedule for clinical management"
    explanation: >-
      Direct recommendation for oncological evaluation within a proposed
      management schedule.
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Somatic TRAF7 mutations are associated with subsets of meningiomas, mesotheliomas, and perineuriomas"
    explanation: >-
      Establishes the tumour types linked to somatic TRAF7 mutation that
      motivate surveillance.
- name: Developmental and Communication Therapy
  description: >-
    Early intervention across motor, speech, and occupational domains.
    Expressive language is affected disproportionately often enough that
    augmentative and alternative communication should be introduced rather than

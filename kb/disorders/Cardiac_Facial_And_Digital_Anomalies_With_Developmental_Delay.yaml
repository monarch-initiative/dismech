disease_term:
  preferred_term: cardiac, facial, and digital anomalies with developmental delay
  description: >-
    A TRAF7-related multiple congenital anomaly syndrome combining developmental
    delay with cardiac, craniofacial, and digital malformations. Note that
    Orphanet still cross-references the older MONDO:0035661 for ORPHA:592570;
    that term is obsolete and MONDO:0032572 now carries both OMIM:618164 and
    Orphanet:592570, so this binding is the current one.
  term:
    id: MONDO:0032572
    label: cardiac, facial, and digital anomalies with developmental delay
inheritance:
- name: Autosomal dominant, almost always de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CAFDADD arises from heterozygous TRAF7 missense variants that are de novo in
    nearly every reported proband. Vertical transmission is exceptional. One
    family has been reported in which a mildly affected mother carried the
    variant mosaically and transmitted it in a non-mosaic state to her son,
    which is the mechanism to consider when a seemingly de novo variant recurs
    in a sibling or when a parent has subtle features.
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified variants are de novo in six individuals and comprise four distinct missense changes, including a c.1964G>A (p.Arg655Gln) variant that is recurrent in four individuals"
    explanation: >-
      Establishes the de novo heterozygous missense mechanism in the original
      seven-patient cohort, including the recurrent p.Arg655Gln change.
  - reference: PMID:37067385
    reference_title: "Novel mosaic TRAF7 likely pathogenic variant in an African American family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was identified to harbor this likely pathogenic variant in a mosaic (33.89%) state in leukocytes"
    explanation: >-
      Documents the one reported vertical-transmission mechanism, a mosaic
      parent, which is what qualifies the otherwise de novo recurrence risk.

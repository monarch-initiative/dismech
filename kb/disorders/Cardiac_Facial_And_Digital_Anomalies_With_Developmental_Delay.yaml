    Heterozygous missense variants in TRAF7, clustering almost exclusively in
    the seven C-terminal WD40 repeats, are the sole established cause of
    CAFDADD. Most are recurrent; c.1964G>A (p.Arg655Gln) is the single most
    common allele. No truncating or whole-gene-deletion allele has been shown
    to cause the syndrome, which argues against simple haploinsufficiency.

      explanation: >-
        Places TRAF7 inside this specific arm. Indirect because it is a
        deletion allele, and CAFDADD has no null alleles.
  evidence:
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TRAF7 mutations typically disrupt E3 ligase catalytic activity, which has been shown to alter its interaction with MAPK and thereby influence downstream MAPK signaling"
    explanation: >-
      States the molecular consequence of TRAF7 mutation on ligase activity and
      MAPK coupling.
  - reference: PMID:15001576
    reference_title: "TRAF7 potentiates MEKK3-induced AP1 and CHOP activation and induces apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRAF7 also contains seven WD40 repeats at its C terminus"
    explanation: >-
      Establishes the domain architecture that distinguishes TRAF7 from the
      other TRAF proteins and carries the pathogenic variants.
- name: Dominant-Negative Heterodimerization with Wild-Type TRAF7
  description: >-
    Mutant TRAF7 heterodimerizes with the wild-type protein and drags it out of
    the MEKK3 complex, so a single variant allele suppresses the product of the
    normal allele. Sub-stoichiometric mutant is enough. This is the mechanism
    that reconciles a heterozygous missense allele causing disease while the
    heterozygous null mouse is normal. Read the allele caveat: the
    heterodimerization and MEKK3 co-immunoprecipitation experiments were run on
    meningioma-associated somatic substitutions (C388Y, G536S, K615E, R653Q),
    not on a CAFDADD germline allele. R653Q is adjacent to the recurrent
    germline R655Q and a germline R653L has since been reported, so the
    inference is short but it is still an inference.
  biological_scale: MOLECULAR
  downstream:
  - target: Disrupted TRAF7 E3 Ubiquitin Ligase and MEKK3 Adaptor Function
    causal_link_type: DIRECT
    description: >-
      The measured consequence of heterodimerization is loss of MEKK3 binding
      and reduced MEKK3-dependent ubiquitination, so the heterodimer is how a
      single variant allele disables the adaptor function of both.
    evidence:
    - reference: PMID:37043537
      reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "WT-mutant heterodimers displayed weaker interaction with MEKK3, suggesting that the mutants have dominant effects"
      explanation: >-
        Directly measures loss of MEKK3 binding by the heterodimer. Indirect
        for CAFDADD because the substitutions assayed are the meningioma
        somatic set, not a germline CAFDADD allele.
  evidence:
  - reference: PMID:37043537
    reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "We show that TRAF7 mutants operate in a dominant manner, inhibiting protein function via heterodimerization with wild-type protein"
    explanation: >-
      States the dominant-negative mechanism. Indirect for CAFDADD because the
      alleles tested are meningioma-associated somatic substitutions.
  - reference: PMID:37043537
    reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Low concentrations of mutant TRAF7 (C388Y) are sufficient to disrupt the interaction of WT TRAF7 with MEKK3"
    explanation: >-
      Establishes that sub-stoichiometric mutant suffices, which is what makes
      the effect dominant rather than dosage-dependent.
- name: Disrupted TRAF7-IFT57 Interaction and Cilia Loss
  description: >-
    TRAF7 binds IFT57, a core intraflagellar transport component. Both somatic
    and inherited TRAF7 mutations break that interaction, and TRAF7-mutant
    meningioma primary cultures lack cilia altogether. A ciliary defect is a
    coherent explanation for a syndrome combining outflow-tract heart lesions
    with craniofacial and digital anomalies, since all three are classic
    ciliopathy territory. This arm has not been tested with a CAFDADD germline
    allele and is offered as the leading alternative to the MAPK account, not
    as a settled mechanism.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: cilium
    term:
      id: GO:0005929
      label: cilium
  biological_processes:
  - preferred_term: intraciliary transport
    modifier: DECREASED
    term:
      id: GO:0042073
      label: intraciliary transport
  downstream:
  - target: Neural Crest Derivative Patterning Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Left-Right Patterning Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cilia at the left-right organizer set the laterality cue, so losing them
      is the established route from a ciliary defect to asymmetry failure.
  evidence:
  - reference: PMID:37043537
    reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Somatic and inherited mutations disrupt TRAF7-IFT57 interactions leading to cilia degradation"
    explanation: >-
      Establishes the IFT57 interaction and its loss on mutation. Indirect for
      CAFDADD because the inherited alleles studied came from a congenital
      heart disease cohort rather than from CAFDADD probands.
- name: Left-Right Patterning Defect
  description: >-
    Loss of ciliary function at the left-right organizer disrupts the
    left-sided pitx2c expression that drives asymmetric heart formation. In
    TRAF7 knockdown Xenopus embryos pitx2c is lost or bilateral. This is the
    branch of the cilia hypothesis that would explain the conotruncal and
    heterotaxy lesions at the severe end of the cardiac spectrum, as opposed to
    the isolated patent ductus arteriosus at the mild end. It rests entirely on
    the frog knockdown; no CAFDADD patient has been reported with situs
    abnormality, so treat it as a mechanistic prediction rather than an
    observed feature of the syndrome.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: determination of left/right symmetry
    modifier: ABNORMAL
    term:
      id: GO:0007368
      label: determination of left/right symmetry
  downstream:
  - target: Congenital Cardiovascular Malformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:37043537
    reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "this reduction in cilia impacted the left-sided expression of pitx2c, which was either abnormally lost or bilateral in these TRAF7 knockdown embryos"
    explanation: >-
      Reports the laterality marker failing in the knockdown embryos. Indirect
      for CAFDADD because it is a frog knockdown and no patient has been
      reported with a laterality defect.
- name: Neural Crest Derivative Patterning Defect
  description: >-
    The cranial neural crest gives rise to both the craniofacial skeleton and,
    via the cardiac neural crest, to septation of the cardiac outflow tract.
    TRAF7 is expressed in this population, which is the most economical
    explanation for why one gene produces a syndrome that is simultaneously
    cardiac and facial. Knockdown of TRAF7 in Xenopus and zebrafish produces
    cardiac, craniofacial, and ciliary defects together, with disruption of the
    neural crest markers Sox10 and Twist.
  biological_scale: TISSUE

treatments:
- name: Supportive multidisciplinary care
  description: >-
    Management is supportive and directed at the manifestations present:
    cardiology assessment and intervention, developmental and speech therapy
    including augmentative communication, audiology and ophthalmology, and
    orthopaedic and endocrine review. No disease-modifying treatment exists and
    no interventional trial for this syndrome was identified.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our comprehensive analysis expands the phenotypic spectrum, emphasizing the need for oncological evaluations and proposing an evidence-based schedule for clinical management.
    explanation: >-
      The source of the proposed management schedule. Note it also calls for
      oncological evaluation, which is treated as an open question below rather
      than as an established surveillance recommendation here.
animal_models:
- name: Traf7 knockout mouse
  species: Mouse
  genotype: Traf7 germline and endothelial conditional knockout
  publication: PMID:37583551
  description: >-
    Traf7-deficient mouse embryos die around midgestation from loss of
    endothelial integrity, with reduced Klf2 expression, phenocopying Mekk3,
    Mek5 and Erk5 nulls. Endothelial deletion in postnatal mice causes severe
    cerebral haemorrhage.
  modeled_mechanisms:
  - target: Dominant-negative inhibition of wild-type TRAF7
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The null mouse establishes that TRAF7 is required for endothelial integrity
      through the MEKK3-MEK5-ERK5-KLF2 axis, but it does not model this disease's
      lesion.
    limitations: >-
      Complete loss of Traf7 is embryonic lethal in mouse, whereas humans
      heterozygous for a TRAF7 missense allele survive with a congenital-anomaly
      syndrome. The model therefore tests loss of function, which is the
      mechanism the human variant pattern argues against, and its severity is not
      comparable. No heterozygous knock-in of a recurrent human CAFDADD allele
      has been reported, so the dominant-negative mechanism modelled in this
      entry has no mouse model at all.
    evidence:
    - reference: PMID:37583551
      reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similar to Mekk3-, Mek5- or Erk5-deficient mice, Traf7-deficient embryos died in utero around midgestation due to impaired endothelium integrity.
      explanation: >-
        The lethal null phenotype that is not seen in human heterozygotes, which
        is what makes this a failure to recapitulate rather than a partial one.
  evidence:
  - reference: PMID:37583551
    reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Targeted deletion of TRAF7 revealed that it is a crucial part of shear stress-responsive MEKK3-MEK5-ERK5 signaling pathway induced in endothelial cells by blood flow.
    explanation: >-
      Establishes what the model does show, which is the wild-type pathway rather
      than the disease mechanism.
discussions:
- discussion_id: controversy_traf7_inherited_variants_and_chd
  prompt: >-
    Do inherited TRAF7 variants transmitted from unaffected parents cause
    isolated congenital heart disease, or are the three reported alleles
    (p.Val142Met, p.Val442Met, c.1998+2T>G) not pathogenic?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Germline TRAF7 WD40-repeat missense variant
  - phenotypes#Congenital cardiovascular malformation
  rationale: >-
    This matters for the entry's inheritance claim. The 2023 PNAS paper reported
    three inherited TRAF7 variants in a congenital-heart-disease cohort and
    treated them as pathogenic, which would make TRAF7 disease incompletely
    penetrant and would extend it to isolated heart disease without the
    syndrome. A published letter disputes all three on population frequency,
    inheritance from healthy parents, the gene's tolerance of heterozygous loss
    of function, and the absence of the syndrome's typical features in those
    patients; the authors replied defending them on functional and in silico
    grounds. Both sides are in print and neither has withdrawn. This entry
    therefore describes the syndrome as arising predominantly de novo and does
    not assert incomplete penetrance. Note the disputed variants are also the
    only argument for haploinsufficiency in this gene, so the outcome affects
    the mechanism claim as well as the inheritance claim.
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While somatic variants of TRAF7 (Tumor necrosis factor receptor-associated factor 7) underlie anterior skull-base meningiomas, here we report the inherited mutations of TRAF7 that cause congenital heart defects.
    explanation: >-
      The claim under dispute, stated by the authors who made it.
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All were inherited from healthy parents, while non-penetrance of TRAF7 variants has not been previously reported in the MCA-IDS.
    explanation: >-
      The central objection: the three variants behave unlike every previously
      established TRAF7 allele. REFUTE because it argues directly against the
      pathogenicity claim, not merely that evidence is absent.
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the gnomAD probability of being loss-of-function intolerant of TRAF7 is 0.02, suggesting good tolerance to heterozygous loss-of-function variants in the general population, and arguing against c.1998+2T>G causing a CHD.
    explanation: >-
      The population-genetic argument against the splice allele specifically,
      which is the one that would establish haploinsufficiency.
  - reference: PMID:38466853
    reference_title: "Reply to Pisan et al.: Pathogenicity of inherited TRAF7 mutations in congenital heart disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Experimentally, overexpression of p.Val442Met consistently phenocopies TRAF7 knockdown in Xenopus and zebrafish.
    explanation: >-
      The authors' functional rebuttal. Graded MODEL_ORGANISM because the sentence
      reports the Xenopus and zebrafish result.
- discussion_id: gap_traf7_germline_somatic_mutual_exclusivity
  prompt: >-
    Why do germline TRAF7 syndrome mutations and somatic tumour mutations cluster
    in the same protein regions without ever being the same mutation, and does a
    germline carrier have any excess tumour risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Germline TRAF7 WD40-repeat missense variant
  - treatments#Supportive multidisciplinary care
  rationale: >-
    Two questions that are usually confused and should not be. The first is
    mechanistic: both mutation sets are recurrent missense changes in the
    C-terminal region, both are described as dominant-negative, and both disrupt
    the TRAF7-IFT57 interaction, yet reviews record that the two sets do not
    overlap and say the reason is unclear. The proposals on offer are untested:
    that the two classes drive different protein-protein interactions, or that
    somatic-type alleles are lethal in the embryo. The 2024 series reported a
    novel germline p.Arg653Leu adjacent to somatic hotspots, which sharpens
    rather than settles the question. The second is clinical: the same series
    calls for oncological evaluation of germline carriers, while a 2025 review
    keeps germline and somatic disease cleanly separated. No cohort study has
    estimated tumour incidence in this syndrome, so this entry records neither an
    excess risk nor its absence, and does not list tumour surveillance as an
    established treatment.
  proposed_experiments:
  - experiment_id: exp_traf7_allele_matched_interactome
    name: Side-by-side interactome comparison of germline-type and somatic-type TRAF7 alleles
    description: >-
      Express matched sets of recurrent germline (p.Arg655Gln, p.Arg524Trp,
      p.Phe617Leu) and somatic meningioma TRAF7 alleles in one cell background and
      compare their interactomes by affinity purification mass spectrometry,
      focusing on IFT57, CYLD, MEKK3 and NEMO, together with ubiquitin ligase
      activity and cilium assembly readouts.
    would_support:
    - pathophysiology#Dominant-negative inhibition of wild-type TRAF7
    supporting_outcome:
    - >-
      A reproducible split in the interactome or in ciliary readout between the
      two allele classes would give a mechanistic reason for their mutual
      exclusivity and would justify treating them as distinct molecular lesions
      rather than as one lesion in two tissues.
    refuting_outcome:
    - >-
      Indistinguishable interactomes and readouts would leave developmental
      timing and cell-of-origin, rather than allele identity, as the explanation,
      and would raise rather than lower the concern about tumour risk in germline
      carriers.
    decision_criterion: >-
      Allele-class-specific differences in binding partners or ciliary phenotype
      resolve the question towards distinct lesions; equivalence resolves it
      towards a context-dependent single lesion.
  - experiment_id: exp_traf7_tumour_incidence_cohort
    name: Longitudinal tumour-incidence study in a germline TRAF7 cohort
    description: >-
      Follow an international registry cohort of individuals with confirmed
      germline TRAF7 variants with a defined imaging and clinical protocol,
      reporting age-specific incidence of meningioma, mesothelioma and other
      tumours against population expectation.
    supporting_outcome:
    - >-
      An incidence above population expectation would convert the current expert
      suggestion into an evidence-based surveillance recommendation and would add
      a neoplasia phenotype to this entry.
    refuting_outcome:
    - >-
      Incidence indistinguishable from population expectation would support
      dropping routine tumour imaging, which currently has unknown benefit and
      known harms.
    decision_criterion: >-
      Age-specific incidence significantly above population expectation
      establishes excess risk; equivalence over adequate follow-up establishes
      its absence.
  evidence:
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additionally, most reported germline and somatic mutations are recurrent across patients, either as germline or somatic, without overlap between mutations that occur in the germline versus those that are somatic. The reason somatic and germline mutations are mutually exclusive is unclear.
    explanation: >-
      The statement of the gap in a 2025 review, including the explicit admission
      that the reason is unknown. Evidence source is OTHER because this is a
      review.
  - reference: PMID:37583551
    reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although almost all identified mutations are recurrent (the same in different tumors or patients), somatic and germline mutations do not overlap.
    explanation: >-
      An independent statement of the same non-overlap, from a paper whose own
      data are on the mouse. Evidence source is OTHER because this sentence is
      the introduction's summary of the human mutation literature, not a result
      of the mouse work.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel missense variant, p.(Arg653Leu), further underscores the complex relationship between germline TRAF7 variants and somatic changes linked to meningiomas.
    explanation: >-
      The observation that sharpens the question: a germline allele at a residue
      adjacent to the somatic hotspots, which is why residue-level proximity and
      mutation-level exclusivity have to be stated separately.
datasets: []
clinical_trials: []
notes: >-
  Boundary with somatic TRAF7 disease. TRAF7 appears elsewhere in this knowledge
  base only in Meningioma, where it is a recurrent somatic driver in tumour
  tissue. That is a different disease and a different mutation set: two
  independent sources state that germline and somatic TRAF7 mutations do not
  overlap, even though both are recurrent missense changes clustered in the
  C-terminal region. Every citation in this entry was checked at the sentence
  level to confirm it is about germline syndrome patients rather than about
  tumours; the one paper that spans both (PMID:37043537) is cited only for
  sentences that name the germline or inherited arm or the shared molecular
  mechanism. No claim of tumour predisposition is made here.

  Frequencies deliberately absent. Published per-feature frequencies for this
  syndrome, including the widely quoted percentages over 68 aggregated cases,
  live in full-text tables that are not in this repository's reference cache, so
  no snippet could verify them. Rather than copy percentages that would be
  unverifiable, phenotypes are curated without FrequencyEnum values and the
  descriptions record the qualitative ordering the abstracts do support - patent
  ductus arteriosus as the most frequent cardiac lesion, blepharophimosis as the
  leading facial feature, developmental delay as frequent but not obligate.

  Developmental delay is not obligate despite the disease name. A 2025 case
  report (PMID:41201137) describes a TRAF7 patient without developmental delay or
  intellectual disability; that paper has no abstract in the reference cache, so
  it is not cited as evidence, but the 2024 series makes the same point in
  quotable form and that is what the phenotype description rests on.

  Module conformance not declared. The cilium result makes ciliopathy_dysfunction
  a candidate, but IFT57 is an intraflagellar-transport-B component and the
  module's nodes are built around basal body and transition zone dysfunction, so
  conforming would assert a compartment the source does not name.
  cranial_suture_premature_fusion was also considered and rejected:
  craniosynostosis is a minority finding here, not the entry's mechanism.

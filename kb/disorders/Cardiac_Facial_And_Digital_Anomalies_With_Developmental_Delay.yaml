clinical_trials: []
notes: >-
  Clinical frequencies depend on ascertainment and the denominator examined for each finding. Counts from the 2020
  core cohort do not imply that every feature was assessed in all 42 individuals. The 2023 preprint and 2024 publication
  describe the same clinical series and are not independent cohorts. Developmental delay is variable and is not
  an obligatory lifetime finding. Tumor-only TRAF7 alterations are a distinct clinical context; mosaic overlap and
  uncertainty about constitutional-carrier tumor risk are retained explicitly. Molecular paths from TRAF7 to many
  clinical findings remain unresolved.

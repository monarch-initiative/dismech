    causal_link_type: DIRECT
  - target: Disrupted TRAF7-IFT57 Interaction and Cilia Loss
    causal_link_type: DIRECT
    description: >-
      TRAF7 acts upstream of MEKK3 in the MEK5-ERK5 arm; a variant WD40 surface

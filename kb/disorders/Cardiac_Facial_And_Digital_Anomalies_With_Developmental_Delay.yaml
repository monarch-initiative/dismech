synonyms:
- CAFDADD
- TRAF7 syndrome
- TRAF7-related neurodevelopmental disorder
- TRAF7-related multiple congenital anomalies-intellectual disability syndrome
parents:
- syndromic disease
- hereditary disease
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Approximately seventy individuals have been published: seven in the 2018
    discovery series, forty-five in the 2020 spectrum study, and eleven more in
    the 2024 series that also reviewed fifty-eight earlier cases. No population
    prevalence or incidence has been estimated and none is inferred here.
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified heterozygous missense variants in TRAF7 as the cause of a developmental delay-malformation syndrome in 45 patients.
    explanation: >-
      The largest single published cohort, which is the basis for the literature
      case count recorded here.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic analysis and a comprehensive review of the 58 previously reported cases outline consistent clinical presentations, emphasizing dysmorphic features, developmental delay, endocrine manifestations, and cardiac defects.
    explanation: >-
      Gives the reviewed case total behind the roughly seventy figure.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous, with the great majority of reported variants arising de novo.
    Rare inherited variants from apparently unaffected parents have been
    reported, but their pathogenicity is disputed and they are discussed
    separately rather than treated here as established incomplete penetrance.
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified variants are de novo in six individuals and comprise four distinct missense changes, including a c.1964G>A (p.Arg655Gln) variant that is recurrent in four individuals.
    explanation: >-
      Establishes de novo occurrence and the recurrent p.Arg655Gln allele in the
      discovery series.
pathophysiology:
- name: Germline TRAF7 WD40-repeat missense variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline missense substitution, most often in one of the seven
    C-terminal WD40 repeats. p.Arg655Gln, p.Arg524Trp and p.Phe617Leu are the
    recurrent alleles. The clustering and recurrence, and the near-absence of
    truncating alleles in this syndrome, are the reasons haploinsufficiency is
    not the favoured mechanism.
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: SNV
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      DOMINANT_NEGATIVE is used because two independent sources state that the
      mutant protein interferes with the wild-type protein by heterodimerizing
      with it, and because the variant pattern argues against loss of function.
      Note this is the leading model rather than a settled fact, and the
      mechanism may differ by allele.
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  evidence:
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TRAF7 syndrome is caused by several pathogenic TRAF7 mutations, most of which are located within the WD40 repeat protein domain, and the most recurrent of these mutations are p.Arg655Gln, p.Arg524Trp, and p.Phe617Leu
    explanation: >-
      Names the domain and the recurrent alleles this node records. Evidence
      source is OTHER because this is a review.
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants are predominantly within the WD40 repeats and recurrent, suggesting specific alterations to the protein as the pathomechanism, as opposed to haploinsufficiency.
    explanation: >-
      States the argument against haploinsufficiency directly. Notable because
      this letter disputes other claims by the group whose dominant-negative
      model is cited on the next node, so the two sides agree on this point.
  downstream:
  - target: Dominant-negative inhibition of wild-type TRAF7
    description: >-
      The mutant protein is proposed to act by disabling the wild-type protein it
      dimerizes with.
    causal_link_type: DIRECT
- name: Dominant-negative inhibition of wild-type TRAF7
  biological_scale: MOLECULAR
  description: >-
    Mutant TRAF7 heterodimerizes with wild-type TRAF7 and inhibits its function.
    Independently, disease-causing substitutions in the coiled-coil region impair
    formation of the TRAF7 coiled-coil trimer, which gives a structural route to
    the same outcome for the subset of alleles that are not in the WD40 repeats.
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that TRAF7 mutants operate in a dominant manner, inhibiting protein function via heterodimerization with wild-type protein.
    explanation: >-
      The direct experimental statement of the dominant-negative mechanism this
      node records.
  - reference: PMID:38178633
    reference_title: The structure of TRAF7 coiled-coil trimer provides insight into its function in zebrafish embryonic development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, disease-causing mutations in TRAF7 CC region could impair the trimer formation, consequently impacting early embryonic development of zebrafish.
    explanation: >-
      Structural evidence that non-WD40 disease alleles disrupt TRAF7
      oligomerization, which is why this entry does not model the lesion as
      WD40-only.
  downstream:
  - target: Disrupted TRAF7-IFT57 interaction and ciliary loss
    description: >-
      One consequence of impaired TRAF7 function is loss of an interaction
      required to maintain cilia.
    causal_link_type: DIRECT
  - target: Altered ERK1/2 signalling in patient-derived cells
    description: >-
      Mutant TRAF7 changes the output of the MAP kinase module it scaffolds.
    causal_link_type: DIRECT
- name: Disrupted TRAF7-IFT57 interaction and ciliary loss
  biological_scale: CELLULAR
  description: >-
    Both germline and somatic TRAF7 mutants disrupt the interaction between TRAF7
    and the intraflagellar transport protein IFT57, and cilia degrade. Knockdown
    of TRAF7 in Xenopus and zebrafish produces cardiac, craniofacial and ciliary
    defects, so the pathway is at least sufficient to generate the organ systems
    involved in this syndrome.
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Somatic and inherited mutations disrupt TRAF7-IFT57 interactions leading to cilia degradation.
    explanation: >-
      The molecular interaction and cellular consequence this node records.
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TRAF7-mutant meningioma primary cultures lack cilia, and TRAF7 knockdown causes cardiac, craniofacial, and ciliary defects in Xenopus and zebrafish, suggesting a mechanistic convergence for TRAF7-driven meningiomas and developmental heart defects.
    explanation: >-
      The animal-model arm of the same claim. Graded MODEL_ORGANISM because this
      sentence reports the Xenopus and zebrafish results, while the sentence
      above reports the biochemistry.
  downstream:
  - target: Neural-crest-derived tissue maldevelopment
    description: >-
      Ciliary signalling is required in the neural crest lineage that gives rise
      to the affected craniofacial and outflow-tract structures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Altered ERK1/2 signalling in patient-derived cells
  biological_scale: MOLECULAR
  description: >-
    TRAF7 sits on MAP kinase signalling. In vitro, the mutations observed in the
    discovery series reduced ERK1/2 phosphorylation. Note this is not simply
    reduced TRAF7 activity read forward: wild-type TRAF7 inhibits MEK1/2, so
    naive loss of function would be expected to raise rather than lower ERK
    output. The direction of the measured effect is recorded here; its
    reconciliation with the pathway topology is not asserted.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: DECREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro analyses of the observed TRAF7 mutations showed reduced ERK1/2 phosphorylation.
    explanation: >-
      The measurement this node records, from the syndrome's discovery series.
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is an E3 ubiquitin ligase that activates MEKK3 and KLF2/4 signaling, inhibits MEK1/2 and c-Myb along with an NF-κβ-modulator, and stabilizes VE-cadherins in cell junctions.
    explanation: >-
      Establishes the wild-type pathway topology, including that TRAF7 normally
      inhibits MEK1/2, which is the reason the description flags the direction of
      the ERK result as unresolved. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Dysregulation of developmental gene expression
    description: >-
      Altered signalling output is reflected in the transcriptome of patient
      cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Dysregulation of developmental gene expression
  biological_scale: CELLULAR
  description: >-
    Whole-transcriptome sequencing of patient fibroblasts against controls
    identified differentially expressed genes. The reported theme is dysregulation
    of human developmental genes, with enrichment for axon guidance, Wnt/calcium
    signalling and cardiac hypertrophy pathways. The individual pathway
    enrichments have not been followed up functionally and are recorded as a
    described result rather than as established mechanism.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:32376980
    reference_title: Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Several differentially expressed genes were identified in patient fibroblasts.
    explanation: >-
      The primary source for the transcriptomic result, stated at the level the
      abstract supports.
  - reference: PMID:41372821
    reference_title: "TRAF7 in signaling and disease: emerging mechanisms and clinical implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of 76 differentially expressed genes identified in TRAF7 syndrome patients, the main theme identified was dysregulation of human developmental genes, including FLNB, IGFBP7, NOTCH3, BCL2, and PTGS2
    explanation: >-
      Supplies the gene count and the identity of the differentially expressed
      genes, which the primary abstract does not give. Evidence source is OTHER
      because this is a review.
  downstream:
  - target: Neural-crest-derived tissue maldevelopment
    description: >-
      Developmental gene dysregulation converges on the same affected lineages.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Neural-crest-derived tissue maldevelopment
  biological_scale: TISSUE
  description: >-
    The craniofacial skeleton and the cardiac outflow tract both derive from
    neural crest, and TRAF7 is expressed there. This shared origin is the
    proposed reason a single gene produces a face, a heart and a skull-base
    tumour phenotype. It is an embryological argument supported by expression
    and by model-organism knockdown, not by lineage tracing in patient tissue.
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    modifier: ABNORMAL
    term:
      id: GO:0014032
      label: neural crest cell development
  evidence:
  - reference: PMID:37043537
    reference_title: Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, the shared genetics of the two disparate pathologies can be traced to the common origin of forebrain meninges and cardiac outflow tract from the TRAF7-expressing neural crest.
    explanation: >-
      The neural-crest argument this node records, in the authors' own terms.
  downstream:
  - target: Congenital cardiovascular malformation
    description: >-
      Outflow-tract and ductal lesions follow from disturbed neural-crest
      contribution to the developing heart.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal facial shape
    description: >-
      The recognizable gestalt reflects the craniofacial neural-crest derivatives.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Craniosynostosis
    description: >-
      Premature suture fusion in a reported subgroup, involving neural-crest-derived
      calvarial bone.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    description: >-
      Developmental delay is the most consistent feature but has no demonstrated
      route from the neural-crest argument; the link is recorded as unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal digit morphology
    description: >-
      Digital anomalies are a core feature; the developmental route to them is not
      established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Global developmental delay
  category: Neurologic
  description: >-
    Developmental delay, particularly of motor and expressive-language
    milestones, is the most consistent feature. Severity varies widely, and the
    2024 series reported individuals whose early psychomotor delay resolved into
    normal development, so delay should not be treated as an obligate criterion
    despite appearing in the disease name.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:29961569
    reference_title: "De Novo Missense Variants in TRAF7 Cause Developmental Delay, Congenital Anomalies, and Dysmorphic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seven individuals share substantial phenotypic overlap, with developmental delay, congenital heart defects, limb and digital anomalies, and dysmorphic features emerging as key unifying features.
    explanation: >-
      Establishes developmental delay as one of the four unifying features of the
      syndrome.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this enlarged collection, novelties include a wider range of cognitive dysfunction, with some individuals exhibiting normal development despite early psychomotor delay.
    explanation: >-
      The basis for the description's warning that developmental delay is
      frequent rather than obligate.
- name: Congenital cardiovascular malformation
  category: Cardiovascular
  description: >-
    Congenital heart disease is a major source of early morbidity. Patent ductus
    arteriosus is the single most frequent lesion, followed by septal and
    valvular defects.
  phenotype_term:
    preferred_term: Abnormality of the cardiovascular system
    term:
      id: HP:0001626
      label: Abnormality of the cardiovascular system
  evidence:
  - reference: PMID:38466850
    reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patent ductus arteriosus (PDA; not found in Mishra-Gorur et al.’s patients) is the most frequent feature, followed by septal and valvular defects.
    explanation: >-
      The ordering of cardiac lesion types, from the group that assembled the
      largest phenotype series.
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT

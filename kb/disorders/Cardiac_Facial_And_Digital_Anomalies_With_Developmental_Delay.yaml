    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac defects, frequently severe, pose early-life complications"
    explanation: >-
      Establishes cardiac malformation as a clinically dominant feature in the
      largest assembled cohort.
- name: Craniofacial Morphogenesis Defect
  description: >-
    A recognizable facial gestalt dominated by narrowing of the palpebral
    fissures. Blepharophimosis and ptosis are the discriminating features,
    accompanied by arched eyebrows, epicanthic folds, a broad or flat nasal
    bridge, a high forehead, and dysmorphic ears. The gestalt is distinctive
    enough that CAFDADD is regularly first suspected as Ohdo syndrome, or as
    blepharophimosis-ptosis-epicanthus inversus syndrome.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: face morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060325
      label: face morphogenesis
  downstream:
  - target: Blepharophimosis
    causal_link_type: DIRECT
  - target: Ptosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32376980
    reference_title: "Phenotypic spectrum and transcriptomic profile associated with germline variants in TRAF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major features include a recognizable facial gestalt (characterized in particular by blepharophimosis), short neck, pectus carinatum, digital deviations, and patent ductus arteriosus"
    explanation: >-
      Names blepharophimosis as the anchor of the recognizable facial gestalt.
- name: Limb and Digital Patterning Defect
  description: >-
    Digital anomalies are the third element of the syndrome's name. Reported
    findings include digital deviations and clinodactyly, overlapping digits,
    distal contractures, and short or broad thumbs, alongside axial skeletal
    involvement (short neck, pectus carinatum, vertebral anomalies).
  biological_scale: TISSUE
  biological_processes:

name: Cardiac, Facial, and Digital Anomalies with Developmental Delay
creation_date: "2026-09-03T23:59:00Z"
category: Mendelian
description: >-
  A multisystem congenital-anomaly and neurodevelopmental syndrome caused by
  heterozygous germline TRAF7 missense variants, most of them de novo and
  clustered in the C-terminal WD40 repeats. Affected individuals have a
  recognizable facial gestalt with blepharophimosis, congenital cardiovascular
  malformations in which patent ductus arteriosus is the most frequent lesion,
  digital deviations and other skeletal findings including pectus carinatum and
  a short neck, and developmental delay of variable severity. TRAF7 is an E3
  ubiquitin ligase and signalling scaffold; the mutant protein is thought to act
  dominantly on the wild-type protein rather than through haploinsufficiency.
  Somatic TRAF7 mutations cause meningioma and other tumours, but those are a
  separate, non-overlapping mutation set and a different disease.

- name: Congenital Cardiovascular Malformation
  description: >-
    Structural cardiac and great-vessel defects are a defining component of the
    syndrome. Patent ductus arteriosus is the single most characteristic
    lesion; septal defects, valve dysplasia, coarctation, and more severe
    lesions including hypoplastic left heart and double outlet right ventricle
    have all been reported, and cardiac disease drives early-life morbidity.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: heart development
    modifier: ABNORMAL
    term:
      id: GO:0007507
      label: heart development
  downstream:

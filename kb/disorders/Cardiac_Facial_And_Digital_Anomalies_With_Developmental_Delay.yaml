- name: Limb and Digital Patterning Defect
  description: >-
    Digital anomalies are the third element of the syndrome's name. Reported
    findings include digital deviations and clinodactyly, overlapping digits,
    distal contractures, and short or broad thumbs. Axial skeletal involvement
    is modelled separately, since the neck, chest wall and vertebrae are not
    patterned by the limb program.

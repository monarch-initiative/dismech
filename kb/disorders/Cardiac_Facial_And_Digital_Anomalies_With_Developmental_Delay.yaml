animal_models:
- species: Mouse
  genotype: Traf7 conditional null (exons 2-14 floxed), globally deleted with E2a-Cre
  background: Mixed, E2a-Cre transgenic
  category: Genetic
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  description: >-
    The only published in vivo model of TRAF7 loss. Homozygous global deletion
    is embryonic lethal by about E10 with failed vessel integrity and
    intraembryonic hemorrhage; endothelial-specific postnatal deletion produces
    severe cerebral hemorrhage. It is a null allele, so it models the
    consequence of absent TRAF7 rather than the human missense alleles, and the
    heterozygous null - the closest genotypic analogue of the human patient -
    is phenotypically normal.
  publication: PMID:37583551
  modeled_mechanisms:
  - target: Compromised Vascular Endothelial Integrity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Traf7 nulls establish that TRAF7 is cell-autonomously required in
      endothelium for vessel wall integrity, both prenatally and postnatally.
    limitations: >-
      A complete null, not the human missense allele class. The lesion is
      hemorrhagic vessel failure and embryonic death, not the structural
      outflow-tract and septal malformations seen in patients, so the model
      supports the endothelial requirement without demonstrating that this is
      the route to human cardiac malformation.
    readouts:
    - name: Intersomitic vasculature and embryonic hemorrhage at E9.5-E10.5
      target: Compromised Vascular Endothelial Integrity
      direction: ABOLISHED
      interpretation: >-
        Structural correlate of endothelial integrity failure in the null
        embryo.
      evidence:
      - reference: PMID:37583551
        reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "A detailed pathology analysis revealed evidence of intraembryonic hemorrhage and hypoxia"
        explanation: >-
          Reports the hemorrhage and hypoxia measured in the null embryos.
    evidence:
    - reference: PMID:37583551
      reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "embryos failed to develop beyond E10 due to impaired blood vessel integrity"
      explanation: >-
        Supports treating the null mouse as informative for the endothelial
        integrity node.
  - target: TRAF7 WD40 Repeat Missense Variant
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The heterozygous Traf7 null, which is the genotypic analogue of a human
      patient carrying one variant allele, is phenotypically normal. The mouse
      therefore does not reproduce the human heterozygous disease state, which
      is the central argument that CAFDADD is not caused by haploinsufficiency.
    limitations: >-
      No mouse carrying a knock-in of a human CAFDADD allele such as R655Q has
      been reported, so the gain-of-function or dominant-negative hypothesis
      that this negative result motivates remains untested in vivo.
    evidence:
    - reference: PMID:37583551
      reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous (Traf7GLOhet) mice were phenotypically normal and fertile"
      explanation: >-
        A normal heterozygous null is what establishes the failure to
        recapitulate, so it supports this link. Halving TRAF7 dosage does not
        produce the human malformations.
  evidence:
  - reference: PMID:37583551
    reference_title: "TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Global Traf7 deletion resulted in embryonic lethality"
    explanation: >-
      Establishes the basic phenotype of the global null.
- species: Zebrafish
  genotype: traf7 morpholino knockdown (morphant)
  category: Genetic
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  description: >-
    Antisense knockdown of traf7 in Danio rerio. Together with the Xenopus
    morphant this is the model that puts the cardiac, craniofacial, and ciliary
    phenotypes in one animal at once, which is the argument for a shared neural
    crest and ciliary origin. It is a knockdown, so like the mouse null it
    models absence of TRAF7 rather than the human missense allele.
  publication: PMID:37043537
  evidence:
  - reference: PMID:37043537
    reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TRAF7-mutant meningioma primary cultures lack cilia, and TRAF7 knockdown causes cardiac, craniofacial, and ciliary defects in Xenopus and zebrafish, suggesting a mechanistic convergence for TRAF7-driven meningiomas and developmental heart defects"
    explanation: >-
      Establishes the zebrafish knockdown as informative for the cardiac,
      craniofacial, and ciliary phenotypes together.
  modeled_mechanisms:
  - target: Neural Crest Derivative Patterning Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockdown reproduces the cardiac and craniofacial combination that
      defines the human syndrome, alongside the ciliary defect.
    limitations: >-
      A morpholino knockdown, not a knock-in of a patient allele, and it cannot
      address the neurodevelopmental component of CAFDADD.
    evidence:
    - reference: PMID:37043537
      reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "TRAF7 knockdown causes cardiac, craniofacial, and ciliary defects in Xenopus tropicalis and zebrafish"
      explanation: >-
        Reports the cardiac, craniofacial, and ciliary phenotypes together in
        the knockdown embryos.
    - reference: PMID:37043537
      reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "TRAF7 MO in tg(kdrl:GFP;gata-1:dsRed) embryos results in pronounced heart looping defects at 36 hpf"
      explanation: >-
        The specific cardiac readout in the zebrafish morphant, heart looping
        failure at 36 hpf. Indirect because it is a knockdown.
- species: Xenopus tropicalis
  genotype: traf7 morpholino knockdown; p.Val442Met and p.Thr601Ala mRNA overexpression
  category: Genetic
  genes:
  - preferred_term: TRAF7
    term:
      id: hgnc:20456
      label: TRAF7
  description: >-
    Frog knockdown, plus overexpression of the p.Val442Met variant. The
    overexpression arm is the closest any model gets to testing a human variant
    allele in vivo, and it phenocopies knockdown - which is the in vivo
    argument for the dominant-negative mechanism. Note the caveat that
    p.Val442Met came from an inherited congenital-heart-disease cohort rather
    than a CAFDADD proband, and its pathogenicity was publicly disputed.
  publication: PMID:37043537
  evidence:
  - reference: PMID:37043537
    reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "microinjection of mRNAs encoding the developmental mutant forms of TRAF7 (V442M and T601A) in one-cell stage Xenopus embryos resulted in significant pericardial edema"
    explanation: >-
      The primary report of the variant-overexpression arm, which is what makes
      this model informative for a variant rather than only for gene absence.
  modeled_mechanisms:
  - target: Dominant-Negative Heterodimerization with Wild-Type TRAF7
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Overexpressing a variant allele reproduces what removing the gene does,
      which is the in vivo signature of a dominant-negative protein.
    limitations: >-
      Overexpression is not the physiological heterozygous state, the variant
      tested is not a CAFDADD allele, and its pathogenicity is contested in
      correspondence about the source paper.
    evidence:
    - reference: PMID:38466853
      reference_title: "Reply to Pisan et al.: Pathogenicity of inherited TRAF7 mutations in congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "overexpression of p.Val442Met consistently phenocopies TRAF7 knockdown in Xenopus and zebrafish"
      explanation: >-
        States the phenocopy result as the authors' defence of the variant's
        pathogenicity. Graded OTHER because this is correspondence restating
        the primary paper rather than reporting new experiments, and INDIRECT
        because the allele is not a CAFDADD allele.
  - target: Neural Crest Derivative Patterning Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Both knockdown and variant overexpression disrupt the neural crest
      markers Sox10 and Twist and produce cardiac and craniofacial defects.
    limitations: >-
      Amphibian craniofacial and cardiac development differs from mammalian;
      the model shows the neural crest is affected without showing that the
      human malformations arise this way.
    evidence:
    - reference: PMID:37043537
      reference_title: "Pleiotropic role of TRAF7 in skull-base meningiomas and congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Note the reduced size of the pharyngeal arches, disorganization of p3 to p6, and reduced Sox10 expression"
      explanation: >-
        The primary observation of pharyngeal arch disorganization and reduced
        Sox10 in knockdown embryos. Indirect for CAFDADD because it is a
        knockdown rather than a patient allele.
    - reference: PMID:38466853
      reference_title: "Reply to Pisan et al.: Pathogenicity of inherited TRAF7 mutations in congenital heart disease."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "both impact neural crest development with disruption of Sox10 and Twist expression; cause cardiac and craniofacial defects; disrupt ciliogenesis"
      explanation: >-
        Correspondence summarizing that both knockdown and variant
        overexpression hit the neural crest markers; graded OTHER as a
        restatement rather than a new experiment.
prevalence:
- population: Worldwide, reported cases in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 100 individuals had been reported when the largest review was
    published in 2024: 58 previously reported cases plus 11 new ones. No
    population-based prevalence estimate has been published, so the count of
    reported cases is the only figure available, and it is a lower bound rather
    than a prevalence. The Orphanet record ORPHA:592570 was checked in the
    Orphadata cross-reference product, which carries no epidemiology; the
    separate Orphanet prevalence product was not consulted, so if it publishes
    a prevalence class that class should replace this qualitative band.
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a detailed description of 11 new TRAF7-related CAFDADD cases, featuring eight distinct variants, including a novel one"
    explanation: >-
      Supplies the case count contributed by the largest series, on top of the
      58 previously reported cases it reviews.
treatments:
- name: Congenital Heart Defect Repair
  description: >-
    Surgical or catheter closure of a haemodynamically significant patent
    ductus arteriosus or septal defect, per standard congenital cardiology
    practice for the defect type. Cardiac disease is frequently severe and is
    the main driver of early-life complications, which is what makes this the
    intervention with the largest effect on outcome.
  treatment_term:
    preferred_term: congenital heart defect repair
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Patent ductus arteriosus
    term:
      id: HP:0001643
      label: Patent ductus arteriosus
  target_mechanisms:
  - target: Congenital Cardiovascular Malformation
    description: >-
      Repair addresses the structural lesion; it does not modify the underlying
      TRAF7 signaling defect.
  evidence:
  - reference: PMID:38569228
    reference_title: "Expanding the Phenotypic Spectrum of TRAF7-Related Cardiac, Facial, and Digital Anomalies With Developmental Delay: Report of 11 New Cases and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac defects, frequently severe, pose early-life complications"
    explanation: >-

treatments:
- name: Supportive multidisciplinary care
  description: >-
    Care is directed at the manifestations present, with cardiology, developmental, hearing, ophthalmologic, orthopedic
    and growth assessment. The 2024 cohort authors proposed a management schedule; this is an expert proposal from
    a small series rather than a validated consensus guideline. Disease-modifying treatment is not established in
    the reviewed literature.

name: Cardiac Facial and Digital Anomalies with Developmental Delay
creation_date: '2026-09-02T00:00:00Z'
description: >-
  Cardiac, facial, and digital anomalies with developmental delay (CAFDADD),
  also called TRAF7 syndrome, is a rare autosomal dominant multiple congenital
  anomaly and neurodevelopmental disorder caused by de novo heterozygous
  missense variants in TRAF7. TRAF7 encodes a RING-finger E3 ubiquitin ligase
  that, uniquely among the TRAF family, carries seven C-terminal WD40 repeats
  in place of the canonical TRAF domain, and acts in MEKK3-MEK5-ERK5 and NF-kB
  signaling. Nearly all pathogenic germline variants fall in the WD40 repeats,
  and the recurrent c.1964G>A (p.Arg655Gln) change accounts for a large share
  of reported cases. Affected individuals share a recognizable facial gestalt
  dominated by blepharophimosis, together with congenital heart defects (patent
  ductus arteriosus in particular), short neck, pectus carinatum, digital
  deviations, and developmental delay or intellectual disability. Hearing loss,
  sleep disturbance, autistic traits, and endocrine anomalies including growth
  deficiency are also recurrent.


  The evidence points to a dominant-negative mechanism rather than
  haploinsufficiency: mutant TRAF7 heterodimerizes with the wild-type protein
  and displaces it from MEKK3, no null allele causes the syndrome, and the
  heterozygous null mouse is normal. A parallel loss of the TRAF7-IFT57
  interaction, with consequent cilia loss in the neural-crest-derived
  structures that give rise to both the craniofacial skeleton and the cardiac
  outflow tract, is the leading explanation for why one gene produces this
  particular combination of organs. Both of those mechanisms were worked out on
  meningioma-associated somatic alleles rather than on a CAFDADD germline
  allele, and the direction in which CAFDADD alleles move MAPK output is
  currently contradicted between sources; see the discussions section.
category: Genetic

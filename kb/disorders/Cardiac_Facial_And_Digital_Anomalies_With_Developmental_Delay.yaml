animal_models:
- name: Traf7 knockout mouse
  species: Mouse
  genotype: Traf7 germline and endothelial conditional knockout
  publication: PMID:37583551
  description: >-
    Global and endothelial Traf7 deletion caused midgestational lethality and impaired endothelial integrity, with
    reduced Klf2 expression. Postnatal endothelial deletion caused cerebral hemorrhage. These loss-of-function experiments
    inform the endothelial hypothesis discussed in this entry but are not heterozygous knock-ins of human syndrome
    alleles; they do not establish or disprove a common human dominant-negative mechanism.
  evidence:
  - reference: PMID:37583551
    reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic and neonatal development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Targeted deletion of TRAF7 revealed that it is a crucial part of shear stress-responsive MEKK3-MEK5-ERK5 signaling
      pathway induced in endothelial cells by blood flow.
    explanation: >-
      Establishes what the model does show, which is the wild-type pathway rather
      than the disease mechanism.
- name: Traf7-depleted zebrafish
  species: Zebrafish
  genotype: Traf7 depletion; selected human-variant expression experiments
  publication: PMID:37043537
  description: >-
    Traf7 depletion produced altered heart looping, pharyngeal arches and neural crest markers, as well as impaired
    cilia. The anatomy and perturbation differ from human heterozygous missense disease.
  modeled_mechanisms:

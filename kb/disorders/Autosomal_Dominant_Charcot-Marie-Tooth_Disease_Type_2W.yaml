  downstream:
  - target: Neuronal Proteostatic and Translational Stress
- name: Neuronal Proteostatic and Translational Stress
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The step between a partly defective synthetase and a dying axon is the least
    settled part of this disease, and the evidence supports more than one route.
    Neuronal models of dominant HARS1 alleles show increased eIF2-alpha
    phosphorylation with decreased protein translation, the integrated stress
    response signature. Separately, mischarging alleles produce insoluble protein
    accumulation, and at least one severe allele forms HARS1 protein aggregates
    directly. These are curated as competing hypotheses below; the node is marked
    PROVISIONAL because which route dominates in human peripheral nerve is
    unknown.

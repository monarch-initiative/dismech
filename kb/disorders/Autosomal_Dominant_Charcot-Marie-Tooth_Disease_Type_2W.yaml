inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CMT2W arises from heterozygous (monoallelic) HARS1 variants in the catalytic
    domain. The dominance is mechanistically informative: a simple
    loss-of-function haploinsufficiency model does not fit easily, and modelling
    work in neurons supports a dominant-negative action of the mutant protein on
    the wild-type allele's function. Note that HARS1 also causes a recessive
    disease through a different domain, so inheritance mode and domain track
    together in this gene.

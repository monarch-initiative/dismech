      V155G, Y330C and S356N in the HARS catalytic domain cause
      Charcot-Marie-Tooth disease type 2 W (CMT2W), while tRNA-binding domain
      mutation Y454S causes recessive Usher syndrome type IIIB.
    explanation: >-
      Names the dominant CMT2W alleles and contrasts them with the recessive

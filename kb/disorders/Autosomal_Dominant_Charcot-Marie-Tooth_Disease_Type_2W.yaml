    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline missense variants in the HARS1 catalytic domain.
      Modelling in neurons supports a dominant-negative rather than simple
      loss-of-function action; note that individual alleles also show reduced
      abundance, so the two are not mutually exclusive.

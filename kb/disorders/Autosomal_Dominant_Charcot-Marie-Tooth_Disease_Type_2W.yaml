mechanistic_hypotheses:
- hypothesis_group_id: hars1_dominant_negative_translational_stress
  hypothesis_label: Dominant-Negative Translational Stress Model
  status: CANONICAL
  description: >-
    Mutant HARS1 acts dominant-negatively on the wild-type enzyme, reducing
    effective aminoacylation and triggering the integrated stress response.
    Neuronal models of dominant HARS1 alleles show increased eIF2-alpha
    phosphorylation and decreased protein translation, and this is the model most
    often generalized across the aminoacyl-tRNA synthetase neuropathies.
  evidence:
  - reference: PMID:32543048
    reference_title: "Neuropathy-associated histidyl-tRNA synthetase variants attenuate protein synthesis in vitro and disrupt axon outgrowth in developing zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The expression of CMT-HARS1 mutations led to attenuation of protein
      synthesis and increased phosphorylation of eIF2α in PC12 cells and was
      accompanied by impaired neurite and axon outgrowth in both models.
    explanation: >-
      The primary experimental result: integrated-stress-response activation with
      reduced translation, in PC12 neurites and zebrafish axons. Cited directly
      rather than through the commentary that summarizes it.
  - reference: PMID:32543048
    reference_title: "Neuropathy-associated histidyl-tRNA synthetase variants attenuate protein synthesis in vitro and disrupt axon outgrowth in developing zebrafish."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The mutant proteins also formed heterodimers with wild-type HARS1, raising
      the possibility that CMT-HARS1 mutations cause disease through a
      dominant-negative mechanism.
    explanation: >-
      The heterodimer result is the physical basis for the dominant-negative
      reading, and it is marked PARTIAL because the authors themselves state it
      only "raises the possibility" - the hypothesis is CANONICAL by convergence
      across the ARS neuropathies, not because this experiment settles it.
  - reference: PMID:32940403
    reference_title: "Evidence for a dominant-negative mechanism in HARS1-mediated peripheral neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These results are consistent with a dominant-negative mechanism of
      ARS-mediated peripheral neuropathy.
    explanation: >-
      Secondary framing only. This record's `publication_types` include
      "Comment"; it is a one-paragraph commentary on the Mullen et al. study
      cited above, so it is tagged OTHER rather than MODEL_ORGANISM - it
      generated no model-organism data of its own. Retained because it states the
      generalization to the ARS neuropathies as a class, which the primary paper
      does not.
- hypothesis_group_id: hars1_mistranslation_proteotoxicity
  hypothesis_label: Amino Acid Mistranslation and Proteotoxicity Model
  status: ALTERNATIVE
  description: >-
    Some CMT2W alleles do not simply lose activity — they mischarge. V155G and
    S356N mistranslate histidine to glutamine and threonine, and the resulting
    aberrant proteins accumulate as an insoluble fraction. On this model the
    proximate injury is proteotoxic rather than a translation-rate deficit, and
    the two are distinguishable experimentally because mistranslation-driven
    aggregation is rescued by histidine while abundance-limited alleles are made
    worse by it. Notably Y330C, also a CMT2W allele, did not mistranslate, so
    this model cannot be the whole story for the gene.
  evidence:
  - reference: PMID:36164730
    reference_title: "Histidine supplementation can escalate or rescue HARS deficiency in a Charcot-Marie-Tooth disease model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show mistranslation of histidine to glutamine and threonine in V155G and
      S356N but not Y330C mutants in yeast.
    explanation: >-
      Establishes mistranslation for two alleles and its absence for a third, the
      basis for this being an alternative rather than universal model.
  - reference: PMID:36164730
    reference_title: "Histidine supplementation can escalate or rescue HARS deficiency in a Charcot-Marie-Tooth disease model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mistranslating V155G and S356N mutants lead to accumulation of insoluble
      proteins, which was rescued by histidine.
    explanation: >-
      Links mistranslation to proteotoxic accumulation and shows it is
      histidine-reversible.
- hypothesis_group_id: hars1_aggregation_neurite_block
  hypothesis_label: Mutant Protein Aggregation Model
  status: ALTERNATIVE
  description: >-
    A third route, shown for the D364Y patient allele: mutant HARS1 itself forms
    small intracellular aggregates rather than distributing through the cell
    body, and this coincides with failure of neuronal process outgrowth. Here the
    mutant protein is the aggregating species, distinguishing this from the
    mistranslation model in which the aggregating species is the mistranslated
    proteome.
  evidence:
  - reference: PMID:35380399
    reference_title: "The Antiepileptic Valproic Acid Ameliorates Charcot-Marie-Tooth 2W (CMT2W) Disease-Associated HARS1 Mutation-Induced Inhibition of Neuronal Cell Morphological Differentiation Through c-Jun N-terminal Kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that in neuronal N1E-115 cells, a severe Asp364-to-Tyr (D364Y)
      mutation of HARS1 leads to formation of small aggregates of HARS1 proteins;
      in contrast, wild type proteins are distributed throughout cell bodies.
    explanation: >-
      Direct demonstration that the mutant enzyme itself aggregates in neuronal
      cells.

genetic:
- name: HARS1
  gene_term:
    preferred_term: HARS1
    term:
      id: hgnc:4816
      label: HARS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    HARS1 (5q31.3) encodes cytoplasmic histidyl-tRNA synthetase. Domain location
    predicts both the disease and its inheritance mode: catalytic-domain
    missense alleles cause dominant CMT2W, while the tRNA-binding domain allele
    Y454S causes recessive Usher syndrome type IIIB. The reported CMT2W alleles
    span at least V133F, V155G, Y330C, S356N and, from a four-family
    linkage-plus-exome study, p.Thr132Ile, p.Pro134His, p.Asp175Glu and
    p.Asp364Tyr. Note that p.Asp364Tyr — the allele whose aggregation behaviour
    was later characterised in neuronal cells — is a patient allele from that
    series, not a laboratory construct, and it was separately shown to be
    dominantly neurotoxic in C. elegans. Allele-specific biochemistry
    differs within CMT2W itself — some alleles mistranslate, others reduce
    protein abundance — which is why treatment inferences must be made per allele
    rather than per gene.
  evidence:
  - reference: PMID:36164730
    reference_title: "Histidine supplementation can escalate or rescue HARS deficiency in a Charcot-Marie-Tooth disease model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In histidyl-tRNA synthetase (HARS), autosomal dominant mutations V133F,
      V155G, Y330C and S356N in the HARS catalytic domain cause
      Charcot-Marie-Tooth disease type 2 W (CMT2W), while tRNA-binding domain
      mutation Y454S causes recessive Usher syndrome type IIIB.
    explanation: >-
      Establishes the domain-to-disease and domain-to-inheritance correspondence
      within HARS1.
  - reference: PMID:36164730
    reference_title: "Histidine supplementation can escalate or rescue HARS deficiency in a Charcot-Marie-Tooth disease model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      V133F proteins displayed reduced thermal stability in vitro, which was
      rescued by tRNA.
    explanation: >-
      Characterizes the biophysical defect of one allele and its tRNA-dependent
      stabilization.
  - reference: PMID:26072516
    reference_title: "Loss of function mutations in HARS cause a spectrum of inherited peripheral neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations cause a loss of function in yeast complementation assays, and
      p.Asp364Tyr is dominantly neurotoxic in a Caenorhabditis elegans model.
    explanation: >-
      Establishes loss of function across the four-family allele set and
      dominant neurotoxicity for p.Asp364Tyr in an animal model.
differential_diagnoses:
- name: Usher syndrome type IIIB (HARS1 Y454S)
  description: >-
    The same gene, a different domain, a different inheritance mode and a
    different disease. Y454S in the tRNA-binding domain causes recessive Usher
    syndrome type IIIB rather than CMT2W. Distinguishing them is a matter of
    reading the variant's domain and zygosity, not the clinical phenotype alone.
  evidence:
  - reference: PMID:36164730
    reference_title: "Histidine supplementation can escalate or rescue HARS deficiency in a Charcot-Marie-Tooth disease model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In histidyl-tRNA synthetase (HARS), autosomal dominant mutations V133F,
      V155G, Y330C and S356N in the HARS catalytic domain cause
      Charcot-Marie-Tooth disease type 2 W (CMT2W), while tRNA-binding domain
      mutation Y454S causes recessive Usher syndrome type IIIB.
    explanation: >-
      States the alternative HARS1 disease and the domain that distinguishes it.
- name: Adult polyglucosan body disease
  description: >-
    Considered and excluded in the reported V133F patient, whose nerve biopsy
    showed intra-axonal inclusions suggestive of polyglucosan bodies. Genes
    associated with polyglucosan body storage were negative and exome sequencing
    found the HARS1 variant instead — a reminder that CMT2W can present
    atypically enough to be mistaken for a storage disorder.
  evidence:
  - reference: PMID:31211171
    reference_title: "Peripheral neuropathy and cognitive impairment associated with a novel monoallelic HARS variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve biopsy revealed intra-axonal inclusions suggestive of polyglucosan
      bodies, raising the suspicion of adult polyglucosan bodies disease (OMIM
      263570).
    explanation: >-
      Documents the differential that was raised and subsequently excluded.
discussions:
- discussion_id: cmt2w_histidine_supplementation_hazard
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which HARS1 alleles would benefit from histidine supplementation and which
    would be harmed by it, and can that be predicted before treating?
  attaches_to:
  - "pathophysiology#HARS1 Catalytic Domain Dysfunction"
  - "pathophysiology#Neuronal Proteostatic and Translational Stress"
  rationale: >-
    This is the most clinically consequential open question in CMT2W and it is
    curated as a hazard rather than a therapeutic lead. Histidine rescued the
    insoluble-protein accumulation caused by the mistranslating alleles V155G and
    S356N. For V133F and Y330C — the alleles with reduced HARS1 abundance —
    histidine did the opposite: it led to insoluble protein aggregation and
    further reduced viability, which the authors describe explicitly as histidine
    toxicity. A supplement that is intuitively harmless, and available without
    prescription, is therefore predicted to worsen a subset of patients. Nothing
    yet establishes that the yeast-model direction predicts the human direction,
    nor whether an untested allele can be assigned to the rescue or toxicity
    group in advance.
  proposed_experiments:
  - experiment_id: exp_cmt2w_histidine_in_patient_neurons
    name: Histidine response of patient-derived neurons across the allelic series
    description: >-
      Differentiate neurons from patients carrying rescue-group and
      toxicity-group HARS1 alleles and measure aggregation, viability and neurite
      outgrowth across a histidine dose range, to test whether the yeast-derived
      split holds in human neurons.
  - experiment_id: exp_cmt2w_mistranslation_assay_as_predictor
    name: Mistranslation assay as an allele-classification test
    description: >-
      Assay charging fidelity for each reported and novel HARS1 allele and test
      whether mistranslation status prospectively predicts which alleles are
      rescued versus harmed by histidine.
- discussion_id: cmt2w_all_mechanism_is_model_derived
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any of the mechanistic chain curated for CMT2W — dominant-negative
    action, mistranslation, aggregation, integrated stress response activation —
    operate in human peripheral nerve?
  attaches_to:
  - "pathophysiology#Neuronal Proteostatic and Translational Stress"
  - "pathophysiology#Impaired Neurite Outgrowth and Distal Axonal Degeneration"
  rationale: >-
    Evidence exists in models; translational validity is the open question, which
    is what distinguishes this from a generic knowledge gap. Every mechanistic
    step in this entry comes from yeast complementation, neuronal cell lines or
    animal models: the mistranslation and histidine-response work is yeast, the
    eIF2-alpha and translation data are neuronal models, the aggregation and
    valproate result is an N1E-115 cell line. The only human cellular measurement
    is reduced aminoacylation in patient fibroblast extracts — and that same
    experiment found overall protein synthesis was not compromised, which sits
    awkwardly with the translation-attenuation model. No human nerve tissue from a
    CMT2W patient has been examined for any of these mechanisms. The entry's
    central node is PROVISIONAL for this reason as much as for the allele
    heterogeneity.
  proposed_experiments:
  - experiment_id: exp_cmt2w_patient_neuron_mechanism_panel
    name: Mechanism panel in patient-derived motor and sensory neurons
    description: >-
      Differentiate neurons from CMT2W patients carrying different alleles and
      measure eIF2-alpha phosphorylation, charging fidelity, aggregate burden and
      neurite outgrowth in the same cells, testing which of the three model-derived
      mechanisms is present in human neurons and whether it tracks allele.
- discussion_id: cmt2w_tissue_specificity_of_a_housekeeping_enzyme
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does impairing a ubiquitously required aminoacyl-tRNA synthetase produce
    a peripheral-nerve-restricted, length-dependent phenotype?
  attaches_to:
  - "pathophysiology#Neuronal Proteostatic and Translational Stress"
  - "pathophysiology#Impaired Neurite Outgrowth and Distal Axonal Degeneration"
  rationale: >-
    The defining puzzle of the whole aminoacyl-tRNA synthetase neuropathy family,
    and the reason the central node here is PROVISIONAL. Every cell needs
    charged histidyl-tRNA, yet the phenotype falls on the longest peripheral
    axons. A simple translation-insufficiency account is further constrained by
    the finding that a patient variant reduced aminoacylation activity in
    fibroblast extracts without compromising overall protein synthesis, which
    suggests the disease-relevant deficit is not bulk translation capacity. The
    reporting authors state directly that further studies are needed to explain
    the neuronal specificity. Candidate explanations — a moonlighting function of
    the synthetase, the extreme translational and transport demands of a long
    axon, or a neuron-specific sensitivity to the integrated stress response —
    are not distinguished by current data.
  proposed_experiments:
  - experiment_id: exp_cmt2w_tissue_comparative_stress_response
    name: Comparative integrated stress response across cell types
    description: >-
      Express matched CMT2W alleles in neurons, Schwann cells, fibroblasts and
      myocytes and compare eIF2-alpha phosphorylation, aggregate burden and
      viability, to test whether neurons are intrinsically more sensitive or
      merely more exposed.
notes: >-
  Scope and boundaries. This entry covers CMT2W (MONDO:0014711), the dominant
  HARS1 catalytic-domain neuropathy. It is deliberately kept distinct from
  Usher syndrome type IIIB, which arises from a recessive tRNA-binding-domain
  allele in the same gene and is curated here only as a differential.
  HARS1 is not HARS2, and the literature confuses them. The two are a
  head-to-head bidirectional gene pair on 5q31, and papers published before the
  2019 symbol clean-up use "HARS" and "HARS2" inconsistently. HARS2 encodes the
  MITOCHONDRIAL synthetase and causes Perrault syndrome 2, which this knowledge
  base curates separately in `Perrault_Syndrome`. Nothing from that entry belongs
  here and nothing here belongs there. Any source citing bare "HARS" needs its
  gene product checked — cytoplasmic histidyl-tRNA synthetase is HARS1.

  A cross-reference worth knowing about. HARS1 already appears in this knowledge
  base in `Antisynthetase_Syndrome`, where the histidyl-tRNA synthetase protein
  is the Jo-1 autoantigen. That is an entirely different disease mechanism —
  autoimmunity against the protein, not impairment of its enzymatic function —
  and the two should not be conflated. The same gene reaching disease by three
  routes (dominant catalytic-domain neuropathy, recessive tRNA-binding-domain
  Usher syndrome, and autoantigenicity) is itself notable.

  Why the mechanism is curated as competing hypotheses. Three routes from mutant
  HARS1 to a sick neuron each have direct experimental support in different
  systems: dominant-negative translational stress with integrated stress response
  activation, amino acid mistranslation with proteotoxic accumulation, and
  aggregation of the mutant enzyme itself. They are not simply rival readings of
  one experiment — they are allele-specific, and one allele (Y330C) explicitly
  does not mistranslate. Curators should resist collapsing these into a single
  chain; the allele-specificity is what makes the histidine hazard predictable
  in principle.

  Treatment. No treatments block is curated. Valproic acid rescued process
  formation in a HARS1 D364Y neuronal cell line via c-Jun N-terminal kinase
  signalling, and the authors offer it as a potential therapeutic at the cellular
  level — but that is a single cell-line result with no animal or human data, and
  curating it as a treatment would overstate it. Histidine supplementation is
  explicitly not curated as a treatment for the reason given in the
  cmt2w_histidine_supplementation_hazard discussion: it is predicted to harm a
  subset of alleles.

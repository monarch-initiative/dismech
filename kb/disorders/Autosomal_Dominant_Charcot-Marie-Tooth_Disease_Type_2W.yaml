pathophysiology:
- name: HARS1 Catalytic Domain Dysfunction
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    HARS1 is the cytoplasmic aminoacyl-tRNA synthetase that ligates histidine to
    its cognate tRNA. The CMT2W alleles — V133F, V155G, Y330C and S356N — all sit
    in the catalytic domain. Their consequences at the protein level are not
    uniform: V133F and Y330C reduce HARS1 abundance in cells and V133F is
    thermally destabilized in vitro (rescued by tRNA), while V155G and S356N
    retain enough activity to mischarge. This heterogeneity is the reason the
    downstream mechanism is curated as competing hypotheses rather than a single
    chain.
  genes:
  - preferred_term: HARS1
    term:
      id: hgnc:4816
      label: HARS1
  genetic_context:

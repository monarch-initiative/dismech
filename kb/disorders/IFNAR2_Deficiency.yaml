name: IFNAR2 Deficiency
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- immunodeficiency 45
- IMD45
- IFNAR2-related immunodeficiency
- autosomal recessive IFNAR2 deficiency
description: >-
  IFNAR2 deficiency (immunodeficiency 45; IMD45) is an autosomal recessive
  inborn error of immunity caused by biallelic loss-of-function variants in
  IFNAR2, which encodes the high-affinity chain of the heterodimeric type I
  interferon (IFN-alpha/beta) receptor. Loss of surface IFNAR2 leaves cells
  unable to transduce any type I interferon signal, so STAT1 is not
  phosphorylated and the interferon-stimulated gene programme that establishes
  the cell-intrinsic antiviral state is never induced.

  The resulting clinical phenotype is severe but strikingly narrow. Affected
  children are not generally infection-prone; the presentation is catastrophic
  disease on systemic challenge with a live attenuated viral vaccine -
  encephalitis, meningoencephalitis, or hemophagocytic lymphohistiocytosis
  after measles-mumps-rubella immunization - and, in the Arctic founder cohort,
  life-threatening COVID-19 or influenza. The index patient had shown no prior
  susceptibility to respiratory viral pathogens, and this dissociation between a
  complete in vitro signalling defect and a narrow in vivo phenotype is the
  central interpretive problem the entry records as a mechanistic hypothesis
  rather than settled mechanism.

  Two molecular routes to the same signalling null are documented: frameshift
  and other null alleles that abolish the protein, and the Inuit founder
  missense allele p.Ser53Pro, which is expressed but retained intracellularly in
  an aberrantly glycosylated state and never reaches the cell surface.
  Management is avoidance of live attenuated viral vaccines once the diagnosis
  is known, plus supportive care; the Arctic cohort's carrier frequency raised
  the question of population screening.
disease_term:
  preferred_term: IFNAR2 deficiency
  term:
    id: MONDO:0014727
    label: immunodeficiency 45
parents:
- inborn error of immunity
- autosomal recessive disease
references:
- reference: PMID:26424569
  title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
inheritance:
- name: Autosomal recessive
  description: >-
    Disease results from biallelic IFNAR2 variants. Reported genotypes include
    homozygosity in a consanguineous kindred, compound heterozygous frameshift
    alleles, and homozygosity for a founder missense allele; heterozygous
    carriers are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous mutation in the high-affinity IFN-α/β receptor (IFNAR2) in the proband, as well as a newborn sibling, that rendered cells unresponsive to IFN-α/β"
    explanation: A homozygous IFNAR2 mutation shared by the proband and a sibling establishes the autosomal recessive basis of the disease.
pathophysiology:
- name: IFNAR2 Loss of Function
  description: >-
    Biallelic IFNAR2 variants abolish a functional high-affinity chain of the
    type I interferon receptor. Two mechanisms are documented and converge on
    the same signalling null. Null alleles (frameshift, nonsense) remove the
    protein outright. The Arctic founder allele c.157T>C (p.Ser53Pro) instead
    permits translation but blocks trafficking: the substituted protein is
    retained intracellularly in an aberrantly glycosylated state and is absent
    from the cell surface, so no receptor is available to bind ligand. Because
    the second receptor chain IFNAR1 is intact, the lesion is specific to
    assembly of a competent IFNAR1-IFNAR2 heterodimer.
  biological_scale: MOLECULAR
  downstream:
  - target: Absent Type I Interferon Receptor Signaling
    causal_link_type: DIRECT
    description: >-
      Without surface IFNAR2 there is no receptor to transduce an IFN-alpha/beta
      signal, so the loss of protein translates directly into loss of signalling.
    evidence:
    - reference: PMID:35442417
      reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The serine to proline substitution prevented cell surface expression of IFNAR2 protein, small amounts of which persisted intracellularly in an aberrantly glycosylated state."
      explanation: Traces the specific molecular lesion - failure of surface expression - that removes the receptor and therefore the signal.
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals bore the same homozygous IFNAR2 c.157T>C, p.Ser53Pro missense variant."
    explanation: Identifies the founder missense allele underlying the Arctic form of the disease.
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two previously undescribed frameshift mutations in the interferon (IFN)α/β receptor 2 (IFNAR2) gene"
    explanation: Documents the alternative null-allele route to IFNAR2 loss of function.
- name: Absent Type I Interferon Receptor Signaling
  description: >-
    With no functional receptor, type I interferons cannot initiate JAK-STAT
    signalling. Patient cells show no STAT1 phosphorylation on IFN-alpha
    stimulation and are wholly unresponsive to recombinant type I interferon.
    The defect is cell-intrinsic and reversible: complementation with wild-type
    IFNAR2 restores responsiveness, which is what establishes the variant as
    causal rather than merely associated.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Type I interferon-mediated signaling
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: Cellular response to type I interferon
    term:
      id: GO:0071357
      label: cellular response to type I interferon
    modifier: DECREASED
  downstream:
  - target: Failure of Interferon-Stimulated Gene Induction
    causal_link_type: DIRECT
    description: >-
      Interferon-stimulated genes are the transcriptional output of this
      pathway, so an unsignalled receptor leaves them uninduced.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the absence of response to type I IFN in the patient's cells, as revealed by the lack of phosphorylation of STAT1 and the lack of induction of interferon-stimulated genes upon ex vivo stimulation with IFNα"
      explanation: Directly couples the signalling block (absent STAT1 phosphorylation) to the transcriptional failure (absent ISG induction) in the same patient cells.
  - target: Natural Killer Cell Functional Dysregulation
    causal_link_type: DIRECT
    description: >-
      Type I interferon normally tunes NK cell degranulation and restrains their
      IFN-gamma output; an absent signal removes both effects.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "in patient's natural killer (NK) cells stimulated with IFNα the expected increase in degranulation and inhibition of IFNγ production were affected"
      explanation: Shows that the same signalling defect produces a measurable NK-cell functional abnormality on interferon stimulation.
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells exclusively expressing the p.Ser53Pro variant lacked responses to recombinant IFN-I and displayed heightened vulnerability to multiple viruses in vitro"
    explanation: Establishes complete unresponsiveness to type I interferon in cells carrying only the variant allele.
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reconstitution of the proband's cells with wild-type IFNAR2 restored IFN-α/β responsiveness and control of IFN-attenuated viruses."
    explanation: Complementation rescue demonstrates the signalling defect is caused by the IFNAR2 lesion itself.
- name: Failure of Interferon-Stimulated Gene Induction
  description: >-
    Interferon-stimulated genes encode the effectors that make a cell hostile to
    viral replication. Because they are never induced, the cell-intrinsic
    antiviral state cannot be established at all - not merely blunted - leaving
    infected cells with no interferon-dependent restriction of incoming virus.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Antiviral defense response
    term:
      id: GO:0051607
      label: defense response to virus
    modifier: DECREASED
  downstream:
  - target: Unrestricted Viral Replication and Cytopathicity
    causal_link_type: DIRECT
    description: >-
      With no interferon-induced restriction factors, permissive cells support
      viral replication to the point of cell death.
    evidence:
    - reference: PMID:36439115
      reference_title: "Type I interferon receptor (IFNAR2) deficiency reveals Zika virus cytopathicity in human macrophages and microglia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Accompanying the profound defect of IFN-I signalling in IFNAR2 deficient iPS-macrophages we observed significantly enhanced ZIKV replication and cell death"
      explanation: In patient-derived cells, the signalling and ISG defect is shown to cause both enhanced replication and cytopathic death.
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the lack of induction of interferon-stimulated genes upon ex vivo stimulation with IFNα"
    explanation: Documents absent interferon-stimulated gene induction in patient cells.
- name: Unrestricted Viral Replication and Cytopathicity
  description: >-
    Viruses that would normally be held in check replicate without restraint,
    including attenuated vaccine strains whose attenuation depends on host
    interferon competence. Patient-derived macrophages infected with Zika virus
    reveal an inherent cytopathicity that an intact interferon response would
    otherwise mask, so the consequence is both higher viral burden and death of
    the infected cell.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Disseminated infection with live vaccine virus
    causal_link_type: DIRECT
    description: >-
      Live attenuated vaccine strains are attenuated relative to an
      interferon-competent host; in its absence they behave as replicating
      pathogens and disseminate.
    evidence:
    - reference: PMID:26424569
      reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We investigated a previously healthy child with fatal encephalitis after inoculation of the live attenuated measles, mumps, and rubella (MMR) vaccine."
      explanation: Links loss of interferon-dependent viral control to disseminated, fatal disease caused by a live attenuated vaccine strain.
  - target: Severe viral infection
    causal_link_type: DIRECT
    description: >-
      The same failure of interferon-dependent restriction applies to wild-type
      viruses, so ordinary respiratory pathogens can produce life-threatening

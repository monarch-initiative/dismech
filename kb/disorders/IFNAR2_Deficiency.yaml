    decrease in cell blood count" - so the binding to Pancytopenia, which
    asserts all three, is the curator's reading of an unspecified cytopenia in
    an HLH context rather than something the text states. HPO has no plain
    "Cytopenia" term to fall back to. Note also that the relevant HLH-2004
    criterion is cytopenia affecting at least two of three lineages, not
    pancytopenia.
  phenotype_term:
    preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive decrease in cell blood count"
    explanation: Documents the progressive cytopenia during the hyperinflammatory episode.
diagnosis:
- name: Phospho-STAT1/STAT2 Flow Cytometry After Ex Vivo Interferon Stimulation
  description: >-
    The discriminating test. Whole blood or PBMCs are stimulated ex vivo with
    IFN-alpha and STAT1/STAT2 phosphorylation read by flow cytometry; in
    IFNAR2 deficiency it is absent. Stimulating the same cells with IFN-gamma
    in parallel is what makes the test specific rather than merely abnormal:
    the type II response is intact, so a defect confined to the type I arm is
    demonstrated directly, separating IFNAR2 and STAT2 deficiency from STAT1
    or JAK-level defects that impair both arms. The authors propose this as a
    rapid front-line assay when HLH follows a live attenuated vaccine.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rapid evaluation of phosphorylation of STAT1 and STAT2 by flow cytometry upon ex vivo stimulation with IFNα can guide clinicians in the early identification of patients with impairment in type I IFN-mediated signaling"
    explanation: The authors' explicit recommendation of this assay as the early diagnostic route in suspected type I interferon signalling defects.
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As expected, IFNγ stimulation was able to induce both STAT1 phosphorylation and transcription of type II IFN-regulated genes"
    explanation: The preserved type II response is the internal control that makes the test discriminating rather than merely abnormal.
- name: Molecular Confirmation by IFNAR2 Sequencing
  description: >-
    Definitive diagnosis requires demonstrating biallelic IFNAR2 variants.
    Where the Arctic founder allele is plausible on ancestry, targeted testing
    for p.Ser53Pro is the direct route; otherwise exome or panel sequencing is
    needed.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals bore the same homozygous IFNAR2 c.157T>C, p.Ser53Pro missense variant."
    explanation: Establishes the specific molecular finding that confirms the diagnosis in the founder population.
biochemical:
- name: Hemophagocytic lymphohistiocytosis laboratory signature
  notes: >-
    During an HLH episode the reported patient met the familiar HLH-2004
    laboratory picture: marked hyperferritinemia, transaminitis, raised lactate
    dehydrogenase, hypertriglyceridemia and hypofibrinogenemia, with a
    progressive fall in blood counts. These are the markers that identify the
    hyperinflammatory episode; they are not markers of the underlying
    interferon receptor defect, which is why the diagnostic section rests on
    phospho-STAT signalling rather than on these values.

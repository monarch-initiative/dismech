name: IFNAR2 Deficiency
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- immunodeficiency 45
- IMD45
- IFNAR2-related immunodeficiency
- autosomal recessive IFNAR2 deficiency
description: >-
  IFNAR2 deficiency (immunodeficiency 45; IMD45) is an autosomal recessive
  inborn error of immunity caused by biallelic loss-of-function variants in
  IFNAR2, which encodes the high-affinity chain of the heterodimeric type I
  interferon (IFN-alpha/beta) receptor. Loss of surface IFNAR2 leaves cells
  unable to transduce any type I interferon signal, so STAT1 is not
  phosphorylated and the interferon-stimulated gene programme that establishes
  the cell-intrinsic antiviral state is never induced.

  The resulting clinical phenotype is severe but strikingly narrow. Affected
  children are not generally infection-prone; the presentation is catastrophic
  disease on systemic challenge with a live attenuated viral vaccine -
  encephalitis, meningoencephalitis, or hemophagocytic lymphohistiocytosis
  after measles-mumps-rubella immunization - and, in the Arctic founder cohort,
  life-threatening COVID-19 or influenza. The index patient had shown no prior
  susceptibility to respiratory viral pathogens, and this dissociation between a
  complete in vitro signalling defect and a narrow in vivo phenotype is the
  central interpretive problem the entry records as a mechanistic hypothesis
  rather than settled mechanism.

  Two molecular routes to the same signalling null are documented: frameshift
  and other null alleles that abolish the protein, and the Inuit founder
  missense allele p.Ser53Pro, which is expressed but retained intracellularly in
  an aberrantly glycosylated state and never reaches the cell surface.
  Management is avoidance of live attenuated viral vaccines once the diagnosis
  is known, plus supportive care; the Arctic cohort's carrier frequency raised
  the question of population screening.
disease_term:
  preferred_term: IFNAR2 deficiency
  term:
    id: MONDO:0014727
    label: immunodeficiency 45
parents:
- inborn error of immunity
- autosomal recessive disease
references:
- reference: PMID:26424569
  title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
inheritance:
- name: Autosomal recessive
  description: >-
    Disease results from biallelic IFNAR2 variants. Reported genotypes include
    homozygosity in a consanguineous kindred, compound heterozygous frameshift
    alleles, and homozygosity for a founder missense allele; heterozygous
    carriers are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous mutation in the high-affinity IFN-α/β receptor (IFNAR2) in the proband, as well as a newborn sibling, that rendered cells unresponsive to IFN-α/β"
    explanation: A homozygous IFNAR2 mutation shared by the proband and a sibling establishes the autosomal recessive basis of the disease.
pathophysiology:
- name: IFNAR2 Loss of Function
  description: >-
    Biallelic IFNAR2 variants abolish a functional high-affinity chain of the
    type I interferon receptor. Two mechanisms are documented and converge on
    the same signalling null. Null alleles (frameshift, nonsense) remove the
    protein outright. The Arctic founder allele c.157T>C (p.Ser53Pro) instead
    permits translation but blocks trafficking: the substituted protein is
    retained intracellularly in an aberrantly glycosylated state and is absent
    from the cell surface, so no receptor is available to bind ligand. Because
    the second receptor chain IFNAR1 is intact, the lesion is specific to
    assembly of a competent IFNAR1-IFNAR2 heterodimer.
  biological_scale: MOLECULAR
  downstream:
  - target: Absent Type I Interferon Receptor Signaling
    causal_link_type: DIRECT
    description: >-
      Without surface IFNAR2 there is no receptor to transduce an IFN-alpha/beta
      signal, so the loss of protein translates directly into loss of signalling.
    evidence:
    - reference: PMID:35442417
      reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The serine to proline substitution prevented cell surface expression of IFNAR2 protein, small amounts of which persisted intracellularly in an aberrantly glycosylated state."
      explanation: Traces the specific molecular lesion - failure of surface expression - that removes the receptor and therefore the signal.
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals bore the same homozygous IFNAR2 c.157T>C, p.Ser53Pro missense variant."
    explanation: Identifies the founder missense allele underlying the Arctic form of the disease.
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two previously undescribed frameshift mutations in the interferon (IFN)α/β receptor 2 (IFNAR2) gene"
    explanation: Documents the alternative null-allele route to IFNAR2 loss of function.
- name: Absent Type I Interferon Receptor Signaling
  description: >-
    With no functional receptor, type I interferons cannot initiate JAK-STAT
    signalling. Patient cells show no STAT1 phosphorylation on IFN-alpha
    stimulation and are wholly unresponsive to recombinant type I interferon.
    The defect is cell-intrinsic and reversible: complementation with wild-type
    IFNAR2 restores responsiveness, which is what establishes the variant as
    causal rather than merely associated.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Type I interferon-mediated signaling
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: Cellular response to type I interferon
    term:
      id: GO:0071357
      label: cellular response to type I interferon
    modifier: DECREASED
  downstream:
  - target: Failure of Interferon-Stimulated Gene Induction
    causal_link_type: DIRECT
    description: >-
      Interferon-stimulated genes are the transcriptional output of this
      pathway, so an unsignalled receptor leaves them uninduced.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the absence of response to type I IFN in the patient's cells, as revealed by the lack of phosphorylation of STAT1 and the lack of induction of interferon-stimulated genes upon ex vivo stimulation with IFNα"
      explanation: Directly couples the signalling block (absent STAT1 phosphorylation) to the transcriptional failure (absent ISG induction) in the same patient cells.
  - target: Natural Killer Cell Functional Dysregulation
    causal_link_type: DIRECT
    description: >-
      Type I interferon normally tunes NK cell degranulation and restrains their
      IFN-gamma output; an absent signal removes both effects.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "in patient's natural killer (NK) cells stimulated with IFNα the expected increase in degranulation and inhibition of IFNγ production were affected"
      explanation: Shows that the same signalling defect produces a measurable NK-cell functional abnormality on interferon stimulation.
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells exclusively expressing the p.Ser53Pro variant lacked responses to recombinant IFN-I and displayed heightened vulnerability to multiple viruses in vitro"
    explanation: Establishes complete unresponsiveness to type I interferon in cells carrying only the variant allele.
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reconstitution of the proband's cells with wild-type IFNAR2 restored IFN-α/β responsiveness and control of IFN-attenuated viruses."
    explanation: Complementation rescue demonstrates the signalling defect is caused by the IFNAR2 lesion itself.
- name: Failure of Interferon-Stimulated Gene Induction
  description: >-
    Interferon-stimulated genes encode the effectors that make a cell hostile to
    viral replication. Because they are never induced, the cell-intrinsic
    antiviral state cannot be established at all - not merely blunted - leaving
    infected cells with no interferon-dependent restriction of incoming virus.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Antiviral defense response
    term:
      id: GO:0051607
      label: defense response to virus
    modifier: DECREASED
  downstream:
  - target: Unrestricted Viral Replication and Cytopathicity
    causal_link_type: DIRECT
    description: >-
      With no interferon-induced restriction factors, permissive cells support
      viral replication to the point of cell death.
    evidence:
    - reference: PMID:36439115
      reference_title: "Type I interferon receptor (IFNAR2) deficiency reveals Zika virus cytopathicity in human macrophages and microglia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Accompanying the profound defect of IFN-I signalling in IFNAR2 deficient iPS-macrophages we observed significantly enhanced ZIKV replication and cell death"
      explanation: In patient-derived cells, the signalling and ISG defect is shown to cause both enhanced replication and cytopathic death.
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the lack of induction of interferon-stimulated genes upon ex vivo stimulation with IFNα"
    explanation: Documents absent interferon-stimulated gene induction in patient cells.
- name: Unrestricted Viral Replication and Cytopathicity
  description: >-
    Viruses that would normally be held in check replicate without restraint,
    including attenuated vaccine strains whose attenuation depends on host
    interferon competence. Patient-derived macrophages infected with Zika virus
    reveal an inherent cytopathicity that an intact interferon response would
    otherwise mask, so the consequence is both higher viral burden and death of
    the infected cell.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Disseminated infection with live vaccine virus
    causal_link_type: DIRECT
    description: >-
      Live attenuated vaccine strains are attenuated relative to an
      interferon-competent host; in its absence they behave as replicating
      pathogens and disseminate.
    evidence:
    - reference: PMID:26424569
      reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We investigated a previously healthy child with fatal encephalitis after inoculation of the live attenuated measles, mumps, and rubella (MMR) vaccine."
      explanation: Links loss of interferon-dependent viral control to disseminated, fatal disease caused by a live attenuated vaccine strain.
  - target: Infectious encephalitis
    causal_link_type: DIRECT
    description: >-
      Unrestricted replication of the vaccine strain in the central nervous
      system produces encephalitis or meningoencephalitis.
    evidence:
    - reference: PMID:39436454
      reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following vaccination, she developed viremia, meningoencephalitis, and multi-organ failure."
      explanation: Reports the progression from vaccine-strain viremia to central nervous system disease in a genotyped patient.
  evidence:
  - reference: PMID:36439115
    reference_title: "Type I interferon receptor (IFNAR2) deficiency reveals Zika virus cytopathicity in human macrophages and microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealing the inherent cytopathicity of ZIKV towards macrophages"
    explanation: Shows that interferon competence is what normally conceals the cytopathic potential of the virus, which is unmasked in IFNAR2 deficiency.
- name: Natural Killer Cell Functional Dysregulation
  description: >-
    Beyond the antiviral state, type I interferon shapes NK cell behaviour:
    it normally augments degranulation and restrains IFN-gamma production. In
    IFNAR2-deficient NK cells stimulated with IFN-alpha, both responses fail.
    The loss of IFN-gamma restraint is the mechanistically interesting half,
    because unopposed IFN-gamma is the cytokine most closely tied to
    hemophagocytic lymphohistiocytosis - offering a route from a type I
    interferon receptor defect to a hyperinflammatory rather than merely
    infectious phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: Natural killer cell degranulation
    term:
      id: GO:0043320
      label: natural killer cell degranulation
    modifier: DECREASED
  downstream:
  - target: Hemophagocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure to restrain NK-cell IFN-gamma production is proposed as a
      contributor to the hemophagocytic lymphohistiocytosis seen after live
      vaccination in type I interferon signalling defects.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data support a role for NK cell function dysregulation and lack of inhibition of IFNγ production as contributors to the development of HLH in patients with impaired type I IFN signaling."
      explanation: The authors' own statement of the proposed causal route from NK dysregulation to HLH; the paper frames it as a contributory mechanism rather than a demonstrated one.
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in patient's natural killer (NK) cells stimulated with IFNα the expected increase in degranulation and inhibition of IFNγ production were affected"
    explanation: Documents the two specific NK-cell response failures that define this node.
mechanistic_hypotheses:
- hypothesis_group_id: narrow_phenotype_redundancy
  hypothesis_label: Type I interferon redundancy explains the narrow clinical phenotype
  status: EMERGING
  description: >-
    IFNAR2 deficiency abolishes type I interferon signalling completely in
    vitro, yet affected individuals are not broadly infection-prone: the index
    patient had no history of unusual susceptibility to respiratory viral
    pathogens before the fatal vaccine reaction. The proposed explanation is
    that human type I interferons are largely redundant for protective immunity
    under natural conditions, with other cell-intrinsic antiviral mechanisms
    compensating, and become indispensable only on systemic challenge with a
    replicating attenuated virus. The competing reading - that ascertainment
    favours the catastrophic presentations and milder susceptibility is simply
    unrecorded - is not excluded by the published cohorts, which remain very
    small. This distinction matters for whether population screening of the
    Arctic founder allele would identify people at risk or merely carriers.
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the severe outcome of systemic live vaccine challenge, the proband had previously shown no evidence of heightened susceptibility to respiratory viral pathogens."
    explanation: The primary observation the hypothesis rests on - a complete signalling defect without broad clinical susceptibility.
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supports an essential but narrow role for IFN-α/β in human antiviral immunity"
    explanation: The authors' own framing of the phenotype as essential but narrow.
  - reference: PMID:33729549
    reference_title: "Viral infections in humans and mice with genetic deficiencies of the type I IFN response pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A picture is emerging of greater redundancy of human type I IFNs for protective immunity to viruses in natural conditions than was initially anticipated."
    explanation: A review across IFNAR1/IFNAR2/STAT1/STAT2/IRF9 deficiencies generalising the redundancy interpretation beyond this single gene.
phenotypes:
- category: Immunological
  name: Disseminated infection with live vaccine virus
  description: >-
    The hallmark presentation. Systemic challenge with a live attenuated viral
    vaccine, classically measles-mumps-rubella, produces disseminated
    vaccine-strain infection rather than the intended limited immunising
    exposure.
  phenotype_term:
    preferred_term: Disseminated infection with live vaccine virus
    term:
      id: HP:0031697
      label: Disseminated infection with live vaccine virus
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated a previously healthy child with fatal encephalitis after inoculation of the live attenuated measles, mumps, and rubella (MMR) vaccine."
    explanation: The index presentation - fatal disease following MMR in a previously healthy child.
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "meningoencephalitis and/or hemophagocytic lymphohistiocytosis following live-attenuated viral vaccination"
    explanation: Confirms live-vaccine complications across an independent five-patient cohort.
- category: Neurological
  name: Infectious encephalitis
  description: >-
    Encephalitis or meningoencephalitis follows dissemination of the vaccine
    strain to the central nervous system, and was fatal in the index case.
  phenotype_term:
    preferred_term: Infectious encephalitis
    term:
      id: HP:0002383
      label: Infectious encephalitis
  evidence:
  - reference: PMID:39436454
    reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following vaccination, she developed viremia, meningoencephalitis, and multi-organ failure."
    explanation: Documents meningoencephalitis in a genotyped IFNAR2-deficient patient after measles vaccination.
- category: Immunological
  name: Hemophagocytosis
  description: >-
    Hemophagocytic lymphohistiocytosis has been reported after live attenuated
    viral vaccination, both as the presenting illness and within the Arctic
    founder cohort, marking IFNAR2 deficiency as a hyperinflammatory as well as
    an infectious phenotype.
  phenotype_term:
    preferred_term: Hemophagocytosis
    term:
      id: HP:0012156
      label: Hemophagocytosis
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presenting with hemophagocytic lymphohistiocytosis (HLH) following measles-mumps-rubella vaccination"
    explanation: Reports HLH as the presenting illness in a genotyped patient after MMR.
- category: Immunological
  name: Severe viral infection
  description: >-
    Beyond vaccine strains, wild-type viral infection can be life-threatening.
    The Arctic cohort included life-threatening COVID-19 and influenza,
    extending the phenotype beyond live-vaccine challenge to common respiratory
    pathogens in at least some patients.
  phenotype_term:
    preferred_term: Severe viral infection
    term:
      id: HP:0031691
      label: Severe viral infection
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "five children from Greenland, Canada, and Alaska presenting with viral diseases, including life-threatening COVID-19 or influenza"
    explanation: Documents severe wild-type viral disease, not only vaccine-strain disease, in IFNAR2-deficient children.
genetic:
- name: IFNAR2
  association: Causal
  gene_term:
    preferred_term: IFNAR2
    term:
      id: hgnc:5433
      label: IFNAR2
  notes: >-
    Biallelic loss-of-function IFNAR2 variants cause this autosomal recessive
    disease. Reported lesions include a homozygous mutation in the founder
    kindred (Duncan et al), two frameshift alleles in a compound heterozygote
    presenting with HLH (Passarelli et al), and the homozygous founder missense
    allele c.157T>C (p.Ser53Pro) in Inuit populations of Greenland, Canada and
    Alaska (Bastard et al). IFNAR1 and downstream JAK-STAT components are
    intact, so the defect is confined to type I interferon reception.
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous mutation in the high-affinity IFN-α/β receptor (IFNAR2) in the proband, as well as a newborn sibling, that rendered cells unresponsive to IFN-α/β"
    explanation: Establishes IFNAR2 as the causal gene by linking the homozygous variant to loss of cellular interferon responsiveness.
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals bore the same homozygous IFNAR2 c.157T>C, p.Ser53Pro missense variant."
    explanation: Identifies the recurrent founder allele shared across the Arctic cohort.
prevalence:
- population: Inuit ancestry (Greenland, Canada, Alaska)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: UNKNOWN
  notes: >-
    Reported as the minor allele frequency of the p.Ser53Pro founder variant in
    people of Inuit ancestry, not as a disease prevalence. A minor allele
    frequency of 0.034 is far above what the observed number of cases would
    suggest, which is why the authors raise population screening; it is recorded
    here as an allele frequency and must not be read as a rate of disease.
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.Ser53Pro occurred with a minor allele frequency of 0.034 in their Inuit ancestry"
    explanation: The reported founder allele frequency in the ancestral population.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 15 genetically confirmed patients are described in the literature
    across the index kindred, the Arctic founder cohort, and isolated case
    reports.
treatments:
- name: Avoidance of Live Attenuated Viral Vaccines
  description: >-
    The single most important intervention once the diagnosis is known. Live
    attenuated viral vaccines - measles-mumps-rubella above all - are attenuated
    only relative to an interferon-competent host and cause disseminated,
    potentially fatal infection in IFNAR2 deficiency. This is the
    agents-and-circumstances-to-avoid consideration for this disease, and the
    reason case reports argue for genetic screening before immunisation in
    at-risk populations.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of live attenuated viral vaccination
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Unrestricted Viral Replication and Cytopathicity
    description: >-
      Withholding the live vaccine removes the replicating viral challenge that
      the absent interferon response cannot contain.
  evidence:
  - reference: PMID:39436454
    reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case highlights the importance of incorporating genetic screening into vaccination programs for individuals at risk."
    explanation: States the clinical recommendation that follows - identify at-risk individuals before live vaccination.
- name: Supportive Care for Severe Viral Illness
  description: >-
    No disease-modifying therapy exists. Management of an established episode is
    supportive - intensive care for meningoencephalitis and multi-organ failure,
    with HLH-directed immunosuppression where the hyperinflammatory phenotype
    predominates. Outcomes in reported cases have frequently been fatal despite
    intensive support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39436454
    reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following vaccination, she developed viremia, meningoencephalitis, and multi-organ failure."
    explanation: Characterises the severity of the illness that supportive management must address.

genetic:
- name: IFNAR2
  association: Causal
  gene_term:
    preferred_term: IFNAR2
    term:
      id: hgnc:5433
      label: IFNAR2
  notes: >-
    Biallelic loss-of-function IFNAR2 variants cause this autosomal recessive
    disease. Reported lesions include a homozygous mutation in the founder
    kindred (Duncan et al), two frameshift alleles in a compound heterozygote
    presenting with HLH (Passarelli et al), and the homozygous founder missense
    allele c.157T>C (p.Ser53Pro) in Inuit populations of Greenland, Canada and
    Alaska (Bastard et al). IFNAR1 and downstream JAK-STAT components are
    intact, so the defect is confined to type I interferon reception.
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous mutation in the high-affinity IFN-α/β receptor (IFNAR2) in the proband, as well as a newborn sibling, that rendered cells unresponsive to IFN-α/β"
    explanation: Establishes IFNAR2 as the causal gene by linking the homozygous variant to loss of cellular interferon responsiveness.
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals bore the same homozygous IFNAR2 c.157T>C, p.Ser53Pro missense variant."
    explanation: Identifies the recurrent founder allele shared across the Arctic cohort.
prevalence:
- population: Inuit ancestry (Greenland, Canada, Alaska)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: UNKNOWN
  notes: >-
    Reported as the minor allele frequency of the p.Ser53Pro founder variant in
    people of Inuit ancestry, not as a disease prevalence. A minor allele
    frequency of 0.034 is far above what the observed number of cases would
    suggest, which is why the authors raise population screening; it is recorded
    here as an allele frequency and must not be read as a rate of disease.
  evidence:
  - reference: PMID:35442417
    reference_title: "Life-threatening viral disease in a novel form of autosomal recessive IFNAR2 deficiency in the Arctic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.Ser53Pro occurred with a minor allele frequency of 0.034 in their Inuit ancestry"
    explanation: The reported founder allele frequency in the ancestral population.
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 15 genetically confirmed patients are described in the literature
    across the index kindred, the Arctic founder cohort, and isolated case
    reports.
treatments:
- name: Avoidance of Live Attenuated Viral Vaccines
  description: >-
    The single most important intervention once the diagnosis is known. Live
    attenuated viral vaccines - measles-mumps-rubella above all - are attenuated
    only relative to an interferon-competent host and cause disseminated,
    potentially fatal infection in IFNAR2 deficiency. This is the
    agents-and-circumstances-to-avoid consideration for this disease, and the
    reason case reports argue for genetic screening before immunisation in
    at-risk populations.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of live attenuated viral vaccination
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Unrestricted Viral Replication and Cytopathicity
    description: >-
      Withholding the live vaccine removes the replicating viral challenge that
      the absent interferon response cannot contain.
  evidence:
  - reference: PMID:39436454
    reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case highlights the importance of incorporating genetic screening into vaccination programs for individuals at risk."
    explanation: States the clinical recommendation that follows - identify at-risk individuals before live vaccination.
- name: Supportive Care for Severe Viral Illness
  description: >-
    No disease-modifying therapy exists. Management of an established episode is
    supportive - intensive care for meningoencephalitis and multi-organ
    failure. Outcomes in reported cases have frequently been fatal despite
    intensive support. HLH-directed corticosteroid therapy is curated
    separately below.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Infectious encephalitis
    description: >-
      Intensive supportive management addresses the central nervous system
      disease and multi-organ failure symptomatically. It does not modify the
      interferon signalling defect upstream of them, and is linked here to the
      clinical consequence it actually treats rather than to a mechanism node.
    evidence:
    - reference: PMID:39436454
      reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following vaccination, she developed viremia, meningoencephalitis, and multi-organ failure."
      explanation: Characterises the encephalitic and multi-organ illness that supportive management is directed at.
  evidence:
  - reference: PMID:39436454
    reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following vaccination, she developed viremia, meningoencephalitis, and multi-organ failure."
    explanation: Characterises the severity of the illness that supportive management must address.
- name: Corticosteroid Therapy for Hemophagocytic Lymphohistiocytosis
  description: >-
    The hyperinflammatory episode is treated in its own right. The reported
    patient received intravenous methylprednisolone pulses followed by high-dose
    oral glucocorticoids, with progressive improvement in both clinical and
    laboratory features. This targets the HLH branch of the mechanism - the
    unrestrained inflammatory response - rather than the interferon receptor
    defect itself, which no therapy corrects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone
      term:
        id: CHEBI:6888
        label: 6alpha-methylprednisolone
  target_mechanisms:
  - target: Hemophagocytosis
    description: >-
      Glucocorticoids suppress the hyperinflammatory macrophage and lymphocyte
      activation that constitutes the HLH phenotype.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He received intravenous methylprednisolone pulses (30 mg/kg/day for 3 consecutive days) followed by high dose glucocorticoids (2 mg/kg) with progressive improvement of clinical and laboratory features."
      explanation: Documents the regimen and its effect on the HLH phenotype in a genotyped IFNAR2-deficient patient.
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with progressive improvement of clinical and laboratory features"
    explanation: Records the clinical and laboratory response to corticosteroid therapy.
environmental:
- name: Live attenuated viral vaccination
  description: >-
    The exposure that converts a clinically silent genotype into
    life-threatening disease. In the reported patient, symptoms began five days
    after MMR inoculation. This is the gene-environment interaction that
    defines the disease's presentation, and it is why avoidance is the principal
    intervention.
  exposure_term:
    preferred_term: exposure to live attenuated viral vaccine
  influences_mechanisms:
  - target: Unrestricted Viral Replication and Cytopathicity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A replicating attenuated virus is the challenge the absent interferon
      response cannot contain, so the exposure initiates the mechanism rather
      than merely aggravating it.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At 22 months of age, 5 days after inoculation with the live-attenuated measles-mumps-rubella (MMR) vaccine, he was hospitalized with high fever and lethargy."
      explanation: Establishes the temporal link between the vaccine exposure and onset of disease.
  review_notes: >-
    ECTO was searched for a suitable exposure term for live attenuated viral
    vaccination and none was found; the exposure_term is left with a free-text
    preferred_term and no binding rather than forced onto an inaccurate CURIE.
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "5 days after inoculation with the live-attenuated measles-mumps-rubella (MMR) vaccine"
    explanation: The documented exposure preceding disease onset.
notes: >-
  IFNAR2 deficiency has no disease-modifying therapy. Hematopoietic stem cell
  transplantation has been considered for type I interferonopathy-adjacent
  immunodeficiencies but no outcome data specific to IFNAR2 deficiency were
  found, so it is not curated as a treatment here.

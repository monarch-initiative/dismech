      snippet: "displayed heightened vulnerability to multiple viruses in vitro"
      explanation: Links the cell-intrinsic replication defect to heightened vulnerability across multiple viruses, the cellular basis of severe wild-type viral disease.
  - target: Infectious encephalitis
    causal_link_type: DIRECT
    description: >-
      Unrestricted replication of the vaccine strain in the central nervous
      system produces encephalitis or meningoencephalitis.
    evidence:
    - reference: PMID:39436454
      reference_title: "Severe Adverse Reaction to Measles Vaccine Due to Homozygous Mutation in the IFNAR2 Gene: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following vaccination, she developed viremia, meningoencephalitis, and multi-organ failure."
      explanation: Reports the progression from vaccine-strain viremia to central nervous system disease in a genotyped patient.
  evidence:
  - reference: PMID:36439115
    reference_title: "Type I interferon receptor (IFNAR2) deficiency reveals Zika virus cytopathicity in human macrophages and microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealing the inherent cytopathicity of ZIKV towards macrophages"
    explanation: Shows that interferon competence is what normally conceals the cytopathic potential of the virus, which is unmasked in IFNAR2 deficiency.
- name: Natural Killer Cell Functional Dysregulation
  description: >-
    Beyond the antiviral state, type I interferon shapes NK cell behaviour:
    it normally augments degranulation and restrains IFN-gamma production. In
    IFNAR2-deficient NK cells stimulated with IFN-alpha, both responses fail.
    The loss of IFN-gamma restraint is the mechanistically interesting half,
    because unopposed IFN-gamma is the cytokine most closely tied to
    hemophagocytic lymphohistiocytosis - offering a route from a type I
    interferon receptor defect to a hyperinflammatory rather than merely
    infectious phenotype.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: Natural killer cell degranulation
    term:
      id: GO:0043320
      label: natural killer cell degranulation
    modifier: DECREASED
  downstream:
  - target: Hemophagocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure to restrain NK-cell IFN-gamma production is proposed as a
      contributor to the hemophagocytic lymphohistiocytosis seen after live
      vaccination in type I interferon signalling defects.
    evidence:
    - reference: PMID:33193576
      reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data support a role for NK cell function dysregulation and lack of inhibition of IFNγ production as contributors to the development of HLH in patients with impaired type I IFN signaling."
      explanation: The authors' own statement of the proposed causal route from NK dysregulation to HLH; the paper frames it as a contributory mechanism rather than a demonstrated one.
  evidence:
  - reference: PMID:33193576
    reference_title: "IFNAR2 Deficiency Causing Dysregulation of NK Cell Functions and Presenting With Hemophagocytic Lymphohistiocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in patient's natural killer (NK) cells stimulated with IFNα the expected increase in degranulation and inhibition of IFNγ production were affected"
    explanation: Documents the two specific NK-cell response failures that define this node.
mechanistic_hypotheses:
- hypothesis_group_id: narrow_phenotype_redundancy
  hypothesis_label: Type I interferon redundancy explains the narrow clinical phenotype
  status: EMERGING
  description: >-
    IFNAR2 deficiency abolishes type I interferon signalling completely in
    vitro, yet affected individuals are not broadly infection-prone: the index
    patient had no history of unusual susceptibility to respiratory viral
    pathogens before the fatal vaccine reaction. The proposed explanation is
    that human type I interferons are largely redundant for protective immunity
    under natural conditions, with other cell-intrinsic antiviral mechanisms
    compensating, and become indispensable only on systemic challenge with a
    replicating attenuated virus. The competing reading - that ascertainment
    favours the catastrophic presentations and milder susceptibility is simply
    unrecorded - is not excluded by the published cohorts, which remain very
    small. This distinction matters for whether population screening of the
    Arctic founder allele would identify people at risk or merely carriers.
  evidence:
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the severe outcome of systemic live vaccine challenge, the proband had previously shown no evidence of heightened susceptibility to respiratory viral pathogens."
    explanation: The primary observation the hypothesis rests on - a complete signalling defect without broad clinical susceptibility.
  - reference: PMID:26424569
    reference_title: "Human IFNAR2 deficiency: Lessons for antiviral immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supports an essential but narrow role for IFN-α/β in human antiviral immunity"
    explanation: The authors' own framing of the phenotype as essential but narrow.
  - reference: PMID:33729549
    reference_title: "Viral infections in humans and mice with genetic deficiencies of the type I IFN response pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A picture is emerging of greater redundancy of human type I IFNs for protective immunity to viruses in natural conditions than was initially anticipated."
    explanation: A review across IFNAR1/IFNAR2/STAT1/STAT2/IRF9 deficiencies generalising the redundancy interpretation beyond this single gene.

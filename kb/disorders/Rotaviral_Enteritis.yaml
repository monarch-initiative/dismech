name: Rotaviral Enteritis
creation_date: "2026-04-20T00:00:00Z"
category: Infectious
parents:
- Infectious Disease
- Gastrointestinal Disease
disease_term:
  preferred_term: rotaviral enteritis
  term:
    id: MONDO:0005194
    label: Rotavirus infection
synonyms:
- Rotavirus infection
- Rotavirus gastroenteritis
- Infantile rotaviral enteritis
description: >-
  Rotaviral enteritis is an acute viral gastroenteritis caused primarily by Group A
  rotavirus (Reoviridae), a triple-layered non-enveloped double-stranded RNA virus
  that infects mature enterocytes at the tips of small intestinal villi. Disease is
  driven by a dual mechanism combining NSP4 enterotoxin-mediated intracellular calcium
  mobilization, chloride secretion, and enteric nervous system activation (early
  secretory diarrhea) with proteasomal DGAT1 degradation, brush-border disaccharidase
  loss, and villus blunting (secondary malabsorptive osmotic diarrhea). Host
  histo-blood group antigen (HBGA) secretor status controlled by FUT2 and Lewis status
  controlled by FUT3 govern VP8*-mediated attachment and strain-specific susceptibility
  to both natural infection and live-attenuated oral rotavirus vaccines.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
  - classification_value: GASTROINTESTINAL
prevalence:
- population: Children under 5 years of age globally
  measure_type: PERIOD_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    Virtually all children globally experience at least one rotavirus infection by
    5 years of age, and rotaviruses are the leading cause of severe dehydrating
    diarrhea in infants and young children under 5 years of age worldwide.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotavirus infections are a leading cause of severe, dehydrating gastroenteritis in children <5 years of age."
    explanation: Establishes rotavirus as a leading global cause of severe dehydrating gastroenteritis in children under 5 years of age.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotaviruses are ubiquitous and infect almost every child globally by 3–5 years of age"
    explanation: Supports the near-universal period prevalence of rotavirus infection in children under 5 years of age worldwide.
  - reference: PMID:37842003
    reference_title: "Characterization of changes in the intestinal microbiome following combination therapy with zinc preparation and conventional treatment for children with rotavirus enteritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rotavirus (RV) is one of the most common pathogens causing diarrhea in infants and young children worldwide."
    explanation: Confirms the high global burden of rotavirus diarrhea in infants and young children.
progression:
- phase: Onset
  age_range: Infancy to early childhood (<5 years; peak 4-23 months)
  notes: >-
    Symptomatic rotaviral enteritis predominantly affects infants and young children
    under 5 years of age (with peak incidence between 4 and 23 months of age after
    maternal antibodies wane), whereas neonates under 1 month of age and infected
    adults are typically asymptomatic or experience mild disease.
  evidence:
  - reference: DOI:10.1152/ajpgi.2001.281.2.g303
    reference_title: "VIII. Pathological consequences of rotavirus infection and its enterotoxin"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotaviral infection in neonatal animals and young children leads to acute self-limiting diarrhea, but infected adults are mainly asymptomatic."
    explanation: Documents the age-dependent onset of symptomatic self-limiting diarrhea in infants and young children compared with largely asymptomatic infection in adults.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The first rotavirus infections in infants >3 months of age are likely symptomatic and accordingly the incidence of rotavirus disease peaks between 4 and 23 months of age"
    explanation: Establishes that symptomatic primary rotavirus infection peaks between 4 and 23 months of age in infancy and early childhood.
- phase: Acute Gastroenteritis Phase
  duration: 1-5 days
  notes: >-
    Characterized by abrupt onset of forceful vomiting and fever followed by frequent
    watery non-bloody diarrhea lasting 1 to 5 days, with risk of rapid dehydration
    and electrolyte imbalance in untreated infants.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Symptoms can last for 1–5 days, but if they last for >1 week, medical consultation should be sought. Increasing and/or intense vomiting and repeated episodes of watery diarrhoea (for example, >1 episode per hour, especially if abundant) are the main features that indicate the need for specific treatment."
    explanation: Defines the 1-5 day acute symptomatic phase of vomiting and repeated watery diarrhea episodes.
- phase: Resolution and Mucosal Recovery
  duration: ~1 week clinical resolution (4-57 days viral RNA shedding)
  notes: >-
    Clinical diarrhea and vomiting resolve within approximately 1 week as villus
    enterocytes regenerate, though transient secondary lactase deficiency and stool
    rotavirus RNA shedding detectable by RT-PCR may persist for longer periods.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The window for the detection of viral shedding using ELISA usually ends within 1 week after the onset of illness, but the virus can be detected for longer periods by more-sensitive assays, such as RT-PCR107. Indeed, viral shedding ranges from 4 to 57 days108, and the quantity of RNA shed directly correlates with the severity of rotavirus-associated diarrhoea in children"
    explanation: Documents resolution of high-titer antigen shedding within 1 week alongside prolonged RT-PCR-detectable viral RNA shedding during recovery.
infectious_agent:
- name: Rotavirus A
  infectious_agent_term:
    preferred_term: Rotavirus A
    term:
      id: NCBITaxon:28875
      label: Rotavirus A
  description: >-
    Non-enveloped, triple-layered icosahedral virus with an 11-segment double-stranded
    RNA genome encoding six structural proteins (VP1-VP4, VP6, VP7) and six
    nonstructural proteins (NSP1-NSP6). Binary classification into G (glycoprotein
    VP7) and P (protease-sensitive spike protein VP4, cleaved by luminal trypsin into
    VP8* and VP5*) genotypes defines antigenic diversity and host receptor tropism.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotaviruses are non-enveloped double-stranded RNA (dsRNA) viruses that have a complex architecture of three concentric capsids that surround a genome of 11 segments of dsRNA"
    explanation: Defines the non-enveloped triple-layered capsid architecture and 11-segment dsRNA genome of rotaviruses.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The RNA segments encode six structural viral proteins (VP1, VP2, VP3, VP4, VP6 and VP7) and six non-structural proteins (NSP1, NSP2, NSP3, NSP4, NSP5 and NSP6)"
    explanation: Establishes the six structural (VP1-VP4, VP6, VP7) and six nonstructural (NSP1-NSP6) proteins encoded by the rotavirus genome.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Species A rotaviruses are further classified into different genotypes, based on sequence differences in RNA segments 7 and 4 (encoding VP7 and VP4, respectively), which form the basis of the dual nomenclature system used for species A rotavirus strains, whereby glycoprotein (G, or VP7) and protease-cleaved protein (P, or VP4) subtypes are differentiated"
    explanation: Explains the binary G (VP7 glycoprotein) and P (VP4 protease-cleaved spike protein) genotype classification of Rotavirus A.
  - reference: PMID:37842003
    reference_title: "Characterization of changes in the intestinal microbiome following combination therapy with zinc preparation and conventional treatment for children with rotavirus enteritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rotavirus (RV) is one of the most common pathogens causing diarrhea in infants and young children worldwide."
    explanation: Establishes rotavirus as a major viral pathogen causing infantile and childhood enteritis.
transmission:
- name: Fecal-Oral Transmission
  description: >-
    Transmitted via the fecal-oral route through direct person-to-person contact or
    contact with contaminated fomites, water, and food. Triple-layered virions are
    shed in high concentrations in stool during diarrheal episodes, and only a small
    infectious dose is required to infect susceptible hosts.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotavirus is shed in large quantities in stools during episodes of rotavirus-associated diarrhoea. The virus is transmitted predominantly through the faecal–oral route, mainly by close person-to-person contact4, and few virions are needed to cause disease in susceptible hosts32. Contaminated fomites (that is, objects that can enable the transmission of pathogens) also have a role in the transmission of rotavirus, especially in out-of-home care settings and hospitals"
    explanation: Directly documents high-titer stool shedding, predominant fecal-oral person-to-person transmission, low infectious dose, and fomite transmission of rotavirus.
pathophysiology:
- name: Host Glycan Attachment and Mature Villus Enterocyte Entry
  conforms_to: "vaccine_induced_mucosal_iga_neutralization#Enteric Pathogen Luminal Attachment and Mucosal Epithelial Entry"
  description: >-
    Following luminal trypsin cleavage of the outer capsid spike protein VP4 into the
    distal lectin domain VP8* and membrane-penetration domain VP5*, rotavirus attaches
    to mature non-dividing enterocytes in the middle and tip of small intestinal villi
    and to enteroendocrine cells. VP8* binds host cell-surface sialoglycans and
    histo-blood group antigens (HBGAs) synthesized on the intestinal mucosa under the
    control of FUT2 (secretor status) in a P-genotype-specific manner (with predominant
    human P[8] and P[4] strains preferentially binding secretor HBGAs), followed by
    endocytic entry into the enterocyte cytoplasm.
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  - preferred_term: epithelium of small intestine
    term:
      id: UBERON:0001902
      label: epithelium of small intestine
  biological_processes:
  - preferred_term: endocytosis involved in viral entry into host cell
    modifier: INCREASED
    term:
      id: GO:0075509
      label: endocytosis involved in viral entry into host cell
  molecular_functions:
  - preferred_term: fucosyltransferase activity
    term:
      id: GO:0008417
      label: fucosyltransferase activity
  - preferred_term: virus receptor activity
    modifier: INCREASED
    term:
      id: GO:0001618
      label: virus receptor activity
  genes:
  - preferred_term: FUT2
    term:
      id: hgnc:4013
      label: FUT2
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotavirus infects and replicates in the mature, non-dividing enterocytes in the middle and tip of the villi and in enteroendocrine cells in the small intestine35, suggesting that these cell types express factors that are required for efficient infection and replication"
    explanation: Establishes that rotavirus specifically infects mature non-dividing enterocytes at the middle and tips of small intestinal villi and enteroendocrine cells.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotavirus attachment to host cells is mediated by the outer capsid protein VP4 (through its VP8* domain37) and binding partners on the host cell surface, including sialoglycans (such as gangliosides GM1 and GD1a) and histo-blood group antigens (HBGAs)"
    explanation: Demonstrates that the VP8* domain of the outer capsid protein VP4 mediates rotavirus attachment to host cell-surface sialoglycans and histo-blood group antigens (HBGAs).
  - reference: PMID:32992488
    reference_title: "FUT2 Secretor Status Influences Susceptibility to VP4 Strain-Specific Rotavirus Infections in South African Children"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Interactions between rotavirus particles and HBGA receptors present in the gut can occur via the VP4 (VP8* subunit) ‘spike’ protein on the surface of the virion [14]."
    explanation: Confirms that the virion surface spike protein VP4 (VP8* subunit) binds HBGA receptors in the gut.
  - reference: PMID:32992488
    reference_title: "FUT2 Secretor Status Influences Susceptibility to VP4 Strain-Specific Rotavirus Infections in South African Children"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results from this study indicate that secretors were more susceptible to rotavirus infection, and non-secretors seemed to display a natural resistance. The absence of HBGAs in the gastric mucosa of non-secretors appeared to reduce susceptibility to rotavirus, possibly by limiting the attachment stage of binding and entry during rotavirus infection [31]."
    explanation: Links FUT2 secretor-dependent HBGA expression in the gut mucosa to rotavirus attachment, entry, and host susceptibility.
  - reference: PMID:37842003
    reference_title: "Characterization of changes in the intestinal microbiome following combination therapy with zinc preparation and conventional treatment for children with rotavirus enteritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RV enters the body mainly through the gastrointestinal epithelium, and RV is symbiotic with the intestinal epithelial microbiota; therefore, the influence of intestinal microorganisms exists throughout RV enteritis"
    explanation: Confirms that rotavirus enters the host primarily through the gastrointestinal epithelium.
  downstream:
  - target: Cytoplasmic Replication and Innate Antiviral Antagonism
    description: Entry of the transcriptionally active double-layered particle initiates cytoplasmic viral RNA replication and innate immune evasion.
  - target: NSP4 Viroporin-Mediated Intracellular Calcium Mobilization
    description: Infected enterocytes synthesize and secrete the viral enterotoxin NSP4.
  - target: Proteasomal DGAT1 Degradation and Villus Enterocyte Destruction
    description: Productive infection of mature villus enterocytes triggers DGAT1 degradation, translational arrest, and enterocyte loss.

- name: Cytoplasmic Replication and Innate Antiviral Antagonism
  description: >-
    Following cellular uptake, rotavirus genome replication and virion assembly take
    place in specialized cytoplasmic inclusions termed viroplasms, and progeny virions
    are released by enterocyte lysis or non-classical vesicular transport. Viral NSP1
    and other rotavirus proteins inhibit signaling pathways downstream of host pattern
    recognition receptors (PRRs), blunting type I and type III interferon induction;
    in children with severe combined immunodeficiency (SCID), defective T-cell and
    antibody responses permit chronic viral replication and severe intestinal and
    systemic disease.
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  biological_processes:
  - preferred_term: viral RNA genome replication
    modifier: INCREASED
    term:
      id: GO:0039694
      label: viral RNA genome replication
  - preferred_term: negative regulation of type I interferon production
    modifier: INCREASED
    term:
      id: GO:0032480
      label: negative regulation of type I interferon production
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Following cellular uptake, rotavirus replication and assembly occur in cytoplasmic viroplasms, and newly produced rotaviruses are released from the cells through cell lysis or Golgi-independent non-classical vesicular transport"
    explanation: Establishes that rotavirus replication and assembly occur in cytoplasmic viroplasms followed by viral release via cell lysis or non-classical vesicular transport.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "In vitro (with multiple cell types) and in vivo experiments in mice have shown that, depending on the tissue, virus strain and age of the animal, NSP1 or possibly other rotavirus proteins can inhibit the signalling pathways activated by PRRs, which might underlie the poor innate immune response to rotaviruses"
    explanation: Demonstrates that rotavirus NSP1 inhibits pattern recognition receptor (PRR) signaling pathways to suppress innate antiviral immunity.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The critical role of antibodies and T cells in protection against recurrent rotavirus infection can be observed in children with primary severe combined immunodeficiency (SCID, who have defective T cell and antibody responses), who can develop chronic rotavirus infection and intestinal and systemic disease"
    explanation: Shows that intact T-cell and antibody immunity is required to clear rotavirus replication and prevent chronic intestinal and systemic infection.
  downstream:
  - target: NSP4 Viroporin-Mediated Intracellular Calcium Mobilization
    description: Cytoplasmic viral gene expression produces the nonstructural protein NSP4 at the endoplasmic reticulum.
  - target: Proteasomal DGAT1 Degradation and Villus Enterocyte Destruction
    description: Viral replication drives host translational shutoff and enterocyte injury.
  - target: Systemic Antigenemia and Transient Viremia
    description: High-titer mucosal viral replication and enterocyte lysis release rotavirus antigens and infectious virions into the systemic circulation during acute infection.
  - target: Fever
    description: Viral replication and mucosal innate immune signaling trigger an acute systemic febrile response.

- name: Systemic Antigenemia and Transient Viremia
  description: >-
    During the first 5 days of acute rotavirus gastroenteritis, viral antigens
    (antigenemia, reported in one study in at least 90% of acutely infected children)
    and infectious virions (viremia) enter the bloodstream across the damaged
    intestinal barrier. Antigenemia correlates with higher acute gastroenteritis
    severity and limited extraintestinal viral dissemination, including mild
    rotavirus-associated hepatitis with transient elevation of serum hepatic
    transaminases (ALT and AST), though direct causal links between antigenemia and
    other extraintestinal presentations remain unestablished in human cohorts.
  locations:
  - preferred_term: blood
    term:
      id: UBERON:0000178
      label: blood
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Detection of viral antigens (that is, antigenaemia) and infectious viruses (that is, viraemia) in serum have been reported in children with rotavirus infection, and replication of rotavirus in sites other than the intestines, although limited, is likely to occur"
    explanation: Establishes that rotavirus antigens (antigenemia) and infectious virus (viremia) enter the bloodstream in children with rotavirus infection and can lead to limited extraintestinal replication.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "One study reported antigenaemia in ≥90% of children with rotavirus infection until ~5 days after symptom onset, and some children had infectious virus in their serum"
    explanation: Quantifies systemic antigenemia in at least 90% of children during the first 5 days of acute rotavirus illness alongside transient infectious viremia.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In other studies, children with antigenaemia had more severe disease than children without antigenaemia, but the proportion of children with extra-intestinal presentations was not higher in those with antigenaemia"
    explanation: Shows that systemic antigenemia is associated with greater acute disease severity, while direct enrichment of broader extraintestinal syndromes in antigenemic patients is not established.
  downstream:
  - target: Elevated Hepatic Transaminases
    description: Systemic viral dissemination and mild rotavirus-induced hepatic injury cause transient elevations of serum alanine aminotransferase (ALT) and aspartate aminotransferase (AST).

- name: NSP4 Viroporin-Mediated Intracellular Calcium Mobilization
  description: >-
    Rotavirus nonstructural protein 4 (NSP4) is the first described viral enterotoxin.
    Acting both endogenously as an endoplasmic reticulum viroporin in infected cells and
    exogenously as a secreted enterotoxin that binds uninfected intestinal epithelial
    cells and signals through phospholipase C (PLC) and inositol 1,4,5-trisphosphate
    (IP3), NSP4 increases cytoplasmic free calcium levels and coordinates downstream
    ion transport changes.
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol
    modifier: INCREASED
    term:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Indeed, NSP4 secreted from cells infected with rotavirus binds to intestinal epithelial cells56 and signals through phospholipase C to increase cytoplasmic calcium levels, which activates calcium-dependent chloride channels"
    explanation: Demonstrates that secreted NSP4 binds intestinal epithelial cells and signals through phospholipase C to elevate cytoplasmic calcium and activate calcium-dependent chloride channels.
  - reference: DOI:10.1152/ajpgi.2001.281.2.g303
    reference_title: "VIII. Pathological consequences of rotavirus infection and its enterotoxin"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Similarities between rotavirus infection and NSP4 function suggest that NSP4 is responsible for these enterotoxigenic effects."
    explanation: Identifies NSP4 as the viral enterotoxin responsible for calcium-dependent enterotoxigenic effects.
  - reference: DOI:10.1152/ajpgi.2001.281.2.g303
    reference_title: "VIII. Pathological consequences of rotavirus infection and its enterotoxin"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "NSP4-mediated ... may further facilitate diarrhea by signaling through other Ca2+-sensitive cellular processes (cation channels, ion and solute transporters) to potentiate fluid secretion while curtailing fluid absorption."
    explanation: Explains how NSP4-driven intracellular calcium mobilization coordinates ion channel activation and transporter inhibition to drive fluid loss.
  downstream:
  - target: Calcium-Activated Chloride Secretion
    description: Elevated cytosolic calcium gates apical calcium-activated chloride channels and inhibits electroneutral NaCl absorption.
  - target: Enteric Nervous System Secretomotor Activation
    description: NSP4-induced calcium signaling triggers paracrine 5-HT release from enteroendocrine cells that activates enteric secretomotor reflexes.

- name: Calcium-Activated Chloride Secretion
  description: >-
    NSP4-induced elevation of cytosolic free calcium activates calcium-gated chloride
    channels (including ANO1/TMEM16A) on the apical membrane of intestinal epithelial
    cells, driving transepithelial halide and chloride ion secretion into the gut lumen
    and creating an osmotic gradient that draws water into the lumen independently of
    cyclic nucleotides (cAMP/cGMP). Because rotavirus does not infect all enterocytes,
    sodium-glucose cotransporter 1 (SGLT1) function remains intact across uninfected
    enterocytes, enabling oral rehydration therapy.
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  biological_processes:
  - preferred_term: chloride transmembrane transport
    modifier: INCREASED
    term:
      id: GO:1902476
      label: chloride transmembrane transport
  molecular_functions:
  - preferred_term: intracellularly calcium-gated chloride channel activity
    modifier: INCREASED
    term:
      id: GO:0005229
      label: intracellularly calcium-gated chloride channel activity
  genes:
  - preferred_term: ANO1
    term:
      id: hgnc:21625
      label: ANO1
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Activation of these channels causes excessive secretion of chloride ions into the intestinal lumen, creating an osmotic gradient that facilitates the transport of water into the lumen, leading to secretory diarrhoea. Calcium-activated chloride channel inhibitors can prevent rotavirus-induced secretory diarrhoea in neonatal mice, supporting the role of NSP4 in the development of secretory diarrhoea"
    explanation: Establishes that activation of calcium-activated chloride channels drives luminal chloride secretion, osmotic water movement, and secretory diarrhea in rotavirus infection.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This observation indicates that a sufficient number of enterocytes have intact sodium–glucose cotransporter 1 function and suggests that rotavirus does not infect all enterocytes."
    explanation: Confirms that sparing of uninfected enterocytes preserves SGLT1-mediated sodium-glucose cotransport during rotaviral secretory diarrhea.
  - reference: DOI:10.1152/ajpgi.2001.281.2.g303
    reference_title: "VIII. Pathological consequences of rotavirus infection and its enterotoxin"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "In neonatal mouse pup mucosa models, ... leads to age-dependent halide ion movement across the plasma membrane, transepithelial Cl−secretion, and, unlike many microbial enterotoxins, initial cyclic nucleotide independence to secretory diarrhea."
    explanation: Establishes that intracellular calcium elevation drives age-dependent transepithelial chloride secretion and cyclic-nucleotide-independent secretory diarrhea in young hosts.
  - reference: DOI:10.1152/ajpgi.2001.281.2.g303
    reference_title: "VIII. Pathological consequences of rotavirus infection and its enterotoxin"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotaviral infection in neonatal animals and young children leads to acute self-limiting diarrhea, but infected adults are mainly asymptomatic."
    explanation: Explains the age-dependent clinical expression of rotavirus secretory diarrhea in infants and young children.
  downstream:
  - target: Secretory Diarrhea
    description: Transepithelial chloride secretion and osmotic water movement into the small intestinal lumen produce profuse watery secretory diarrhea.
  - target: Dehydration
    description: Excessive luminal water and electrolyte secretion leads to rapid volume depletion in infants and young children.
  - target: Metabolic Acidosis
    description: Stool electrolyte and bicarbonate losses during profuse secretory diarrhea cause metabolic acidosis.

- name: Enteric Nervous System Secretomotor Activation
  description: >-
    Rotavirus infection and NSP4-mediated intracellular calcium elevation stimulate
    serotonin (5-hydroxytryptamine, 5-HT) secretion from enteroendocrine
    (enterochromaffin) cells in the small intestine. Paracrine 5-HT activates enteric
    nervous system (ENS) secretomotor and motility reflexes that amplify diarrheal
    fluid loss and intestinal hypermotility, and stimulates vagal afferent nerves
    projecting to brainstem emetic centers associated with nausea and vomiting.
  cell_types:
  - preferred_term: enteric neuron
    term:
      id: CL:0007011
      label: enteric neuron
  locations:
  - preferred_term: small intestine
    term:
      id: UBERON:0002108
      label: small intestine
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotavirus infection and NSP4-mediated increase in intracellular calcium levels can induce secretion of 5-HT from enteroendocrine cells in humans and mice, which can activate enteric nerves that innervate the small intestine and ultimately lead to increased intestinal motility"
    explanation: Demonstrates that rotavirus and NSP4 calcium signaling induce 5-HT release from enteroendocrine cells to activate small intestinal enteric nerves and increase motility.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Rotavirus infection and NSP4-dependent 5-HT release can also activate vagal nerves that project to regions of the brain associated with nausea and vomiting"
    explanation: Shows that NSP4-dependent 5-HT release activates vagal afferent pathways projecting to brainstem emetic centers.
  - reference: DOI:10.1152/ajpgi.2001.281.2.g303
    reference_title: "VIII. Pathological consequences of rotavirus infection and its enterotoxin"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "This secondary component appears to involve the enteric nervous system and may be cyclic nucleotide dependent. Both phases of diarrhea occur in the absence of significant inflammation."
    explanation: Demonstrates that a secondary enteric nervous system component sustains the rotavirus diarrheal response without requiring overt mucosal inflammation.
  downstream:
  - target: Calcium-Activated Chloride Secretion
    description: Enteric secretomotor reflex activation sustains transepithelial chloride and water secretion across the small intestinal mucosa.
  - target: Vomiting
    description: Serotonin-mediated activation of vagal afferent pathways projecting to brainstem emetic centers induces acute vomiting.
  - target: Abdominal Pain
    description: Enteric nervous system activation and increased small intestinal motility cause cramping abdominal pain.

- name: Proteasomal DGAT1 Degradation and Villus Enterocyte Destruction
  description: >-
    Rotavirus infection induces proteasome-dependent degradation of diacylglycerol
    O-acyltransferase 1 (DGAT1) and increases phosphorylation of eukaryotic translation
    initiation factor 2 alpha (eIF2alpha) in infected enterocytes. Loss of DGAT1 and
    global translational arrest downregulate apical brush-border enzymes (including
    lactase, sucrase, and maltase), disrupt enterocyte lipid droplet and membrane
    homeostasis, and cause cytolysis and desquamation of mature villus tip enterocytes
    with reactive crypt hyperplasia. Unabsorbed luminal disaccharides and solutes create
    an osmotic gradient that drives malabsorptive osmotic diarrhea.
  cell_types:
  - preferred_term: enterocyte of epithelium of small intestine
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  locations:
  - preferred_term: epithelium of small intestine
    term:
      id: UBERON:0001902
      label: epithelium of small intestine
  biological_processes:
  - preferred_term: cytolysis
    modifier: INCREASED
    term:
      id: GO:0019835
      label: cytolysis
  evidence:
  - reference: PMID:39548446
    reference_title: "A low-fat amino acid diet reverses intestinal failure and shows good growth trends in five infants with diacylglycerol transferase 1 (DGAT1) deficiency: a prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As previously reported, in gastroenteritis caused by rotavirus (RV) infection, DGAT1 is degraded in RV-infected cells by a proteasome-dependent mechanism. DGAT1 loss reduces apical brush border enzymes which are required for normal enterocyte homeostasis."
    explanation: Shows that rotavirus infection triggers proteasome-dependent degradation of DGAT1, depleting apical brush-border enzymes required for enterocyte homeostasis.
  - reference: PMID:39548446
    reference_title: "A low-fat amino acid diet reverses intestinal failure and shows good growth trends in five infants with diacylglycerol transferase 1 (DGAT1) deficiency: a prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eukaryotic translation initiation factor 2 alpha (eIF2α) is a regulator of global cellular translation, with increased phosphorylated eIF2α levels in RV-infected cells and human DGAT1−/− intestinal enteroids putatively responsible for downregulated protein expression which leads to malabsorptive diarrhea [24]."
    explanation: Links increased eIF2alpha phosphorylation and DGAT1 loss in rotavirus-infected enterocytes to downregulated brush-border protein expression and malabsorptive diarrhea.
  - reference: PMID:34431620
    reference_title: "European guideline on indications, performance, and clinical impact of hydrogen and methane breath tests in adult and pediatric patients: European Association for Gastroenterology, Endoscopy and Nutrition, European Society of Neurogastroenterology and Motility, and European Society for Paediatric Gastroenterology Hepatology and Nutrition consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Secondary lactase deficiency, due to damage to the small intestinal mucosa, may occur at any age and may be caused by infectious enteritis (i.e., Rotavirus, particularly in infancy), enteropathy (i.e., celiac disease, Giardiasis, and Crohn's disease), or severe malnutrition and may, thus, be transient and related to the underlying condition."
    explanation: Establishes that rotaviral mucosal damage in infancy causes secondary lactase deficiency and transient carbohydrate malabsorption.
  downstream:
  - target: Secondary Lactase Deficiency and Carbohydrate Malabsorption
    description: Loss of mature villus enterocytes and proteasomal DGAT1 degradation deplete apical brush-border disaccharidases (particularly lactase), impairing lactose and carbohydrate digestion.
  - target: Malabsorptive Osmotic Diarrhea
    description: Depletion of apical brush-border disaccharidases and villus enterocyte loss leave unabsorbed luminal carbohydrates that drive osmotic diarrhea.
  - target: Dehydration
    description: Osmotic water retention in the gut lumen compounds secretory fluid losses to accelerate systemic dehydration.
phenotypes:
- name: Secretory Diarrhea
  category: Gastrointestinal
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Profuse watery non-bloody diarrhea initiated by NSP4 enterotoxin-mediated
    intracellular calcium mobilization, apical chloride secretion, and enteric nervous
    system secretomotor activation.
  phenotype_term:
    preferred_term: Secretory diarrhea
    term:
      id: HP:0005208
      label: Secretory diarrhea
  evidence:

diagnosis:
- name: Stool Rotavirus Antigen Immunoassay
  description: >-
    Clinical laboratory confirmation of rotaviral enteritis is performed by detecting
    rotavirus group A antigen (primarily inner capsid protein VP6) in stool specimens
    using enzyme-linked immunosorbent assay (ELISA) or rapid lateral-flow
    immunochromatography.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Detection of rotavirus antigen in feces confirms acute rotaviral enteritis.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "When a laboratory-confirmed diagnosis of rotavirus infection is requested by physicians in the clinical setting, rotavirus antigen can be detected in stools using enzyme-linked immunosorbent assay (ELISA) or immunochromatography. In vaccine and epidemiological studies, these assays are often complemented by the use of reverse transcription PCR (RT-PCR)-based assays, which are more sensitive and permit genotyping of virus isolates."
    explanation: Establishes stool antigen detection by ELISA or immunochromatography as the standard clinical diagnostic test for rotavirus infection.
- name: Stool Reverse Transcription Polymerase Chain Reaction (RT-PCR)
  description: >-
    Reverse transcription polymerase chain reaction (RT-PCR) on stool specimens
    provides high-sensitivity detection of rotavirus dsRNA and enables G (VP7) and P
    (VP4) genotyping to differentiate wild-type strains and vaccine viruses.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: Amplification of rotavirus RNA segments in stool with optional VP7 (G) and VP4 (P) genotyping.
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "When a laboratory-confirmed diagnosis of rotavirus infection is requested by physicians in the clinical setting, rotavirus antigen can be detected in stools using enzyme-linked immunosorbent assay (ELISA) or immunochromatography. In vaccine and epidemiological studies, these assays are often complemented by the use of reverse transcription PCR (RT-PCR)-based assays, which are more sensitive and permit genotyping of virus isolates."
    explanation: Establishes RT-PCR of stool specimens as a higher-sensitivity diagnostic method that also enables G and P genotyping of rotavirus isolates.
genetic:
- name: FUT2
  association: Susceptibility and Oral Rotavirus Vaccine Response Modifier
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: FUT2
    term:
      id: hgnc:4013
      label: FUT2
  notes: >-
    FUT2 encodes galactoside 2-alpha-L-fucosyltransferase 2, which controls synthesis
    of H type 1 histo-blood group antigens (HBGAs) on small intestinal enterocytes and
    in mucosal secretions ("secretor" status). Because P[8] and P[4] rotavirus VP8*
    spike domains bind secretor HBGAs for attachment, FUT2 secretors have significantly
    higher susceptibility to P[8] and P[4] wild-type rotavirus gastroenteritis than
    non-secretors, whereas homozygous FUT2 non-secretors show natural resistance to P[8]
    strains and markedly reduced IgA seroconversion ("vaccine take") following oral
    live-attenuated G1P[8] rotavirus vaccination.
  evidence:
  - reference: PMID:32992488
    reference_title: "FUT2 Secretor Status Influences Susceptibility to VP4 Strain-Specific Rotavirus Infections in South African Children"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rotavirus-positive cases (RV+) comprised 74% (185/250) secretors (Se) and 26% (65/250) non-secretors, while rotavirus-negative controls (RV-) comprised 58% (144/250) secretors and 42% (106/250) non-secretors. The distributions of secretors versus non-secretors observed amongst cases and controls were significantly different (p < 0.001)."
    explanation: Directly demonstrates in children with rotavirus gastroenteritis that FUT2 secretor status significantly increases susceptibility to rotavirus infection compared with non-secretors.
  - reference: PMID:28329092
    reference_title: "Secretor and Salivary ABO Blood Group Antigen Status Predict Rotavirus Vaccine Take in Infants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rotavirus vaccine trial who were seronegative at baseline, anti-rotavirus immunoglobulin A seroconversion rates after 3 vaccine doses differed significantly by salivary HBGA phenotype, with the lowest rate (19%) among infants who were nonsecretors (ie, who did not express the carbohydrate synthesized by FUT2), an intermediate rate (30%) among secretors with non-blood group O, and the highest rate (51%) among secretors with O blood group."
    explanation: Directly demonstrates that infants who are FUT2 nonsecretors have the lowest anti-rotavirus IgA seroconversion rate ("vaccine take") after oral G1P[8] rotavirus vaccination.
treatments:
- name: Oral Rehydration Therapy
  description: >-
    First-line supportive therapy consists of reduced-osmolarity (245 mOsm/L) oral
    rehydration salts (ORS) containing equimolar glucose (75 mmol/L) and sodium
    (75 mEq/L) plus potassium and base (citrate or bicarbonate), exploiting preserved
    SGLT1-mediated glucose-coupled sodium and water absorption across uninfected small
    intestinal enterocytes to prevent and reverse dehydration and metabolic acidosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Fluid Therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
    therapeutic_agent:
    - preferred_term: sodium chloride
      term:
        id: CHEBI:26710
        label: sodium chloride
    - preferred_term: D-glucose
      term:
        id: CHEBI:17234
        label: glucose
  target_phenotypes:
  - preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  - preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "One of the most important medical advancements in the past 50 years that has saved millions of infant lives was that administration of ORS resulted in glucose-coupled sodium and water absorption in the small intestine137. Oral rehydration therapy has been used safely and successfully to prevent and treat dehydration due to diarrhoeal pathogens, including rotavirus, in infants and young children"
    explanation: Establishes oral rehydration salts (ORS) as the cornerstone therapy that drives glucose-coupled sodium and water absorption in the small intestine to prevent and treat rotavirus dehydration.
  - reference: PMID:21359029
    reference_title: "Oral rehydration salts, zinc supplement and rota virus vaccine in the management of childhood acute diarrhea"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The efficacy of ORS solution for the treatment of children with acute non-cholera diarrhea has improved with the reduction of its sodium concentration to 75 mEq/l, its glucose concentration to 75 mmol/l, and its total osmolarity to 245 mOsm/l"
    explanation: Documents the improved clinical efficacy of reduced-osmolarity (245 mOsm/L) oral rehydration solution containing 75 mEq/L sodium and 75 mmol/L glucose in childhood acute non-cholera diarrhea.
  - reference: PMID:8855579
    reference_title: "Oral rehydration therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "An ORS must have sufficient sodium to replace losses on a volume to volume basis, a glucose concentration that matches that of sodium to ensure its delivery to the ileum, sufficient amounts of potassium and base (e.g., sodium bicarbonate or trisodium citrate dihydrate) to correct acidosis and to enhance sodium absorption, and sufficient amounts of liquid."
    explanation: Explains how sodium, equimolar glucose, potassium, and base in oral rehydration solutions replace volume losses and correct metabolic acidosis.

- name: Zinc Supplementation
  description: >-
    Oral zinc supplementation (10-20 mg daily for 10-14 days) administered as an adjunct
    to oral rehydration therapy restores intestinal mucosal barrier integrity, reduces
    stool output, and shortens the duration of diarrhea, vomiting, and fever in children
    with rotaviral enteritis, particularly in low-income settings with a high burden of
    malnutrition.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zinc sulfate
      term:
        id: CHEBI:35176
        label: zinc sulfate
  target_phenotypes:
  - preferred_term: Secretory diarrhea
    term:
      id: HP:0005208
      label: Secretory diarrhea
  evidence:
  - reference: PMID:37842003
    reference_title: "Characterization of changes in the intestinal microbiome following combination therapy with zinc preparation and conventional treatment for children with rotavirus enteritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conventional therapy combined with the zinc preparation significantly shortened the duration of hyperthermia, vomiting, and diarrhea compared with the conventional treatment alone."
    explanation: Demonstrates that adding oral zinc supplementation to conventional therapy significantly shortens the duration of fever, vomiting, and diarrhea in pediatric rotavirus enteritis.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition, zinc supplementation can improve the outcome of acute diarrhoea in low-income regions, in which malnutrition is common."
    explanation: Confirms that oral zinc supplementation improves clinical outcomes of acute rotaviral and childhood diarrhea in settings where malnutrition is prevalent.
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For children living in low-income regions, the WHO recommends daily zinc supplementation for infants and children for 10–14 days, starting as soon as the diarrhoea episode has been diagnosed"
    explanation: Documents the WHO recommendation for a 10-14 day course of daily zinc supplementation initiated at diagnosis of childhood diarrhea.

- name: Rotavirus Vaccination
  description: >-
    Oral live-attenuated rotavirus vaccination—including monovalent human attenuated
    G1P[8] vaccine (RV1, Rotarix) and pentavalent bovine-human reassortant G1, G2, G3,
    G4, P1A[8] vaccine (RV5, RotaTeq)—administered in early infancy induces intestinal
    secretory IgA and homotypic and heterotypic serum neutralizing antibodies targeting
    the outer capsid proteins VP7 and VP4 (VP8*/VP5*) as well as non-neutralizing
    mucosal anti-VP6 and anti-NSP4 immunity. Mucosal and systemic immunity blocks viral
    attachment and entry into villus enterocytes and neutralizes NSP4 enterotoxin
    activity, preventing severe dehydrating secretory and malabsorptive gastroenteritis.

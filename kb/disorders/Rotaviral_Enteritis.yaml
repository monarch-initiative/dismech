genetic:
- name: FUT2
  association: Susceptibility and Oral Rotavirus Vaccine Response Modifier
  gene_term:
    preferred_term: FUT2
    term:
      id: hgnc:4013
      label: FUT2
  notes: >-
    FUT2 encodes galactoside 2-alpha-L-fucosyltransferase 2, which controls synthesis
    of H type 1 histo-blood group antigens (HBGAs) on small intestinal enterocytes and
    in mucosal secretions ("secretor" status). Because P[8] and P[4] rotavirus VP8*
    spike domains bind secretor H type 1 / Lewis b glycans for attachment, homozygous
    inactivating variants in FUT2 (non-secretors) confer natural resistance to P[8]
    wild-type rotavirus gastroenteritis and simultaneously reduce replication and
    seroconversion ("vaccine take") of live-attenuated P[8]-based oral rotavirus
    vaccines (Rotarix G1P[8], RotaTeq G1-G4/P[8]), contributing to lower vaccine
    efficacy in populations with a high prevalence of non-secretor or Lewis-negative
    phenotypes.
  evidence:
  - reference: PMID:32940644
    reference_title: "Lewis Blood-group Antigens Are Associated With Altered Susceptibility to Shigellosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood-group antigens are a polymorphic trait that is associated with altered susceptibility to numerous infectious agents, including bacteria such as Helicobacter pylori and Campylobacter jejuni, and viruses [2]."
    explanation: Documents that polymorphic histo-blood group antigens alter host susceptibility to enteric viral infections.
  - reference: PMID:32940644
    reference_title: "Lewis Blood-group Antigens Are Associated With Altered Susceptibility to Shigellosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lewis antigens are generated via the action of 2 fucosyltransferases, FUT2/Secretor (α1,2-fucosyltransferase) and FUT3/Lewis (α1, 3/4-fucosyltransferase) [2]. FUT2 modifies a precursor type 1 oligosaccharide to make the H-antigen, after which FUT3 adds a second fucose to produce the Lewis B antigen."
    explanation: Defines the biochemical role of FUT2 and FUT3 in synthesizing the H and Lewis b mucosal antigens examined in the PROVIDE oral rotavirus vaccine cohort.
treatments:
- name: Oral Rehydration Therapy and Zinc Supplementation
  description: >-
    First-line supportive therapy consists of reduced-osmolality oral rehydration salts
    (exploiting preserved SGLT1-mediated Na+-D-glucose cotransport across surviving
    intestinal epithelium) or intravenous isotonic fluids in severe dehydration, combined
    with oral zinc supplementation to restore mucosal barrier integrity, inhibit
    cAMP/calcium-dependent ion secretion, and shorten diarrhea duration.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Fluid Therapy
    term:

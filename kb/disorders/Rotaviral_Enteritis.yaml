    reference_title: "Characterization of changes in the intestinal microbiome following combination therapy with zinc preparation and conventional treatment for children with rotavirus enteritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conventional therapy combined with the zinc preparation significantly shortened the duration of hyperthermia, vomiting, and diarrhea compared with the conventional treatment alone."
    explanation: Demonstrates that adding oral zinc supplementation to conventional fluid therapy significantly reduces the duration of fever, vomiting, and diarrhea in pediatric rotavirus enteritis.
  - reference: PMID:28713390
    reference_title: "Hematopoietic Stem Cell Transplantation in an Infant with Immunodeficiency, Centromeric Instability, and Facial Anomaly Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five months after transplantation, he presented with diarrhea, subfebrile temperature, and a partially compensated metabolic acidosis. Rotavirus was detected in the stool. IV-fluid therapy as an outpatient was sufficient to normalize the blood gases and the symptoms receded spontaneously."
    explanation: Shows that fluid and electrolyte therapy corrects dehydration and metabolic acidosis in rotaviral enteritis.

- name: Rotavirus Vaccination
  description: >-
    Oral live-attenuated rotavirus vaccination—including monovalent human attenuated
    G1P[8] vaccine (RV1, Rotarix) and pentavalent human-bovine reassortant G1, G2, G3,
    G4, P[8] vaccine (RV5, RotaTeq)—administered in early infancy induces intestinal
    secretory IgA and serum neutralizing antibodies targeting the outer capsid proteins
    VP7 and VP4 (VP8*/VP5*) as well as non-neutralizing mucosal anti-VP6 and anti-NSP4
    immunity. Mucosal and systemic immunity blocks viral attachment and entry into
    villus enterocytes and neutralizes NSP4 enterotoxin activity, preventing severe
    dehydrating secretory and malabsorptive gastroenteritis.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: Rotavirus Vaccine
      term:
        id: NCIT:C96394
        label: Rotavirus Vaccine
  target_mechanisms:
  - target: Host Glycan Attachment and Mature Villus Enterocyte Entry
    treatment_effect: INHIBITS
    description: >-
      Vaccine-induced mucosal secretory IgA and neutralizing antibodies against VP4
      (VP8*/VP5*) and VP7 block viral attachment to enterocyte HBGAs and prevent host
      cell entry, while intracellular polymeric IgA transcytosis via pIgR intercepts
      double-layered particles via VP6.
  - target: NSP4 Viroporin-Mediated Intracellular Calcium Mobilization
    treatment_effect: INHIBITS
    description: >-
      By preventing productive enterocyte infection and eliciting anti-NSP4 antibodies,
      vaccination prevents NSP4 enterotoxin-driven calcium mobilization and secretory
      chloride loss.
  - target: Proteasomal DGAT1 Degradation and Villus Enterocyte Destruction
    treatment_effect: INHIBITS
    description: >-
      Prevention of extensive villus enterocyte infection preserves DGAT1 expression,
      apical brush-border disaccharidase activity, and mucosal architecture.
  effect_modifiers:
  - effect_modifier_type: GENOTYPE
    stratum: "FUT2 non-secretor (se/se) or Lewis-negative (FUT3 le/le) infants"
    comparator_stratum: "FUT2 secretor / Lewis-positive (Le+a-b+) infants"
    modified_outcome: "Oral P[8]-based live-attenuated rotavirus vaccine replication, IgA seroconversion (vaccine take), and clinical protection"
    effect_in_stratum: SMALLER_EFFECT
    description: >-
      Because live-attenuated oral rotavirus vaccines containing P[8] VP4 spikes rely
      on FUT2-dependent H type 1 / Lewis b mucosal glycans to infect enterocytes and
      replicate in the gut, FUT2 non-secretor status reduces vaccine replication and
      IgA seroconversion ("take") while also conferring baseline genetic resistance to
      homotypic P[8] wild-type strains.
  notes: >-
    Contraindicated in infants with severe combined immunodeficiency (SCID) due to risk
    of prolonged vaccine-strain replication and life-threatening dehydrating
    gastroenteritis, and in infants with a history of intussusception.
  evidence:
  - reference: PMID:37764167
    reference_title: "The Gut-Wrenching Effects of Cryptosporidiosis and Giardiasis in Children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rotavirus-induced diarrhea is the leading cause of severe childhood gastroenteritis and a major contributor to the global burden of diarrheal diseases in infants and children under the age of five years [2,7]. Antiviral therapy has not been developed, but the global prevalence of rotavirus gastroenteritis has been massively reduced by universal rotavirus vaccination [8]."
    explanation: Confirms that universal rotavirus vaccination is the primary medical intervention that has markedly reduced the global burden of severe rotavirus gastroenteritis.
  - reference: PMID:32940644
    reference_title: "Lewis Blood-group Antigens Are Associated With Altered Susceptibility to Shigellosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a substudy analysis from the Performance of Rotavirus and Oral Polio Vaccines in Developing Countries (PROVIDE) cohort."
    explanation: Documents investigation of host FUT2/FUT3 Lewis histo-blood group antigen status in the PROVIDE oral rotavirus vaccine cohort.
  - reference: PMID:31270247
    reference_title: "Inherited IFNAR1 deficiency in otherwise healthy patients with adverse reaction to measles and yellow fever live vaccines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral rotavirus vaccine can cause life-threatening dehydration in patients with severe combined immunodeficiencies (Pöyhönen et al., 2019)."
    explanation: Supports the contraindication of live-attenuated oral rotavirus vaccination in infants with severe combined immunodeficiency.

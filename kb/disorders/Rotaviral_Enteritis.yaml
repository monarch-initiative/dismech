  effect_modifiers:
  - effect_modifier_type: GENOTYPE
    stratum: "FUT2 non-secretor (se/se) infants"
    comparator_stratum: "FUT2 secretor infants (especially blood group O secretors)"
    modified_outcome: "Oral P[8]-based live-attenuated rotavirus vaccine replication and anti-rotavirus IgA seroconversion (vaccine take)"
    effect_in_stratum: SMALLER_EFFECT
    description: >-
      Because live-attenuated oral rotavirus vaccines containing P[8] VP4 spikes rely
      on FUT2-dependent H type 1 mucosal glycans to attach to and replicate in small
      intestinal enterocytes, FUT2 non-secretor status markedly reduces vaccine
      replication and anti-rotavirus IgA seroconversion ("take") while also conferring
      baseline genetic resistance to homotypic P[8] wild-type strains.
    evidence:

    snippet: "Two rotavirus vaccines are broadly used worldwide: the RV5 vaccine, RotaTeq (Merck, USA), and the RV1 vaccine, Rotarix (GlaxoSmithKline, Belgium). The RV5 vaccine is a live attenuated, pentavalent vaccine, which is composed of five bovine–human reassortant rotaviruses that express either human VP4 or VP7 from rotavirus strains G1, G2, G3, G4"

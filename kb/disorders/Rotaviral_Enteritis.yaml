      evidence_source: HUMAN_CLINICAL
      snippet: "rotavirus vaccine trial who were seronegative at baseline, anti-rotavirus immunoglobulin A seroconversion rates after 3 vaccine doses differed significantly by salivary HBGA phenotype, with the lowest rate (19%) among infants who were nonsecretors (ie, who did not express the carbohydrate synthesized by FUT2), an intermediate rate (30%) among secretors with non-blood group O, and the highest rate (51%) among secretors with O blood group."
      explanation: Directly shows in a clinical trial of oral G1P[8] rotavirus vaccine that FUT2 non-secretor infants have significantly lower IgA seroconversion (19%) than secretor infants (30-51%).
  notes: >-

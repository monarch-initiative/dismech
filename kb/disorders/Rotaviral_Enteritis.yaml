- name: Dehydration
  category: Metabolic
  frequency: FREQUENT
  description: >-
    Isotonic or hypernatremic volume depletion caused by combined secretory and osmotic
    stool water losses compounded by emesis; the principal cause of shock, electrolyte
    imbalance, and mortality in untreated infants.
  phenotype_term:
    preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  evidence:
  - reference: PMID:29119972
    reference_title: "Rotavirus infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In children, the manifestation of rotavirus disease ranges from no symptoms to mild, watery diarrhoea of short duration and to severe diarrhoea with vomiting and fever that can result in rapid dehydration with shock, electrolyte imbalance and death"
    explanation: Directly establishes rapid dehydration with shock and electrolyte imbalance as the principal life-threatening complication of pediatric rotavirus diarrhea and vomiting.

- name: Metabolic Acidosis
  category: Metabolic
  frequency: OCCASIONAL
  description: >-
    Normal-anion-gap (hyperchloremic) or mixed metabolic acidosis resulting from
    excessive fecal bicarbonate loss during acute rotaviral and secretory diarrhea and
    hypovolemic tissue hypoperfusion, corrected by base-containing oral or intravenous
    rehydration solutions.
  phenotype_term:
    preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  evidence:
  - reference: PMID:8855579
    reference_title: "Oral rehydration therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pathogens responsible for acute diarrhea include those which produce enterotoxin at the intestinal mucosal surface, inducing secretion but are not invasive (e.g., Vibrio cholerae); those which invade and disrupt the mucosal lining (e.g., shigella species); and rotavirus."
    explanation: Identifies rotavirus as one of the primary pathogens causing acute diarrheal fluid and electrolyte loss.
  - reference: PMID:8855579
    reference_title: "Oral rehydration therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "An ORS must have sufficient sodium to replace losses on a volume to volume basis, a glucose concentration that matches that of sodium to ensure its delivery to the ileum, sufficient amounts of potassium and base (e.g., sodium bicarbonate or trisodium citrate dihydrate) to correct acidosis and to enhance sodium absorption, and sufficient amounts of liquid."
    explanation: Documents metabolic acidosis as a core electrolyte disturbance of acute diarrheal dehydration requiring base replacement (bicarbonate or citrate) in oral rehydration solutions.


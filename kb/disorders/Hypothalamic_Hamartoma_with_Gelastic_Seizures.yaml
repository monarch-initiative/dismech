histopathology:
- name: Nodular clusters of small interneuron-like neurons
  description: >-
    The lesion comprises nodular clusters of neurons with poorly defined
    boundaries. 80-90% are small, round-soma neurons with short unbranched,
    spine-free processes expressing glutamic acid decarboxylase (GABAergic); the
    remainder are large pleomorphic, often pyramidal neurons with branched, spiny
    dendrites.
  evidence:
  - reference: PMID:28591478
    reference_title: "Hypothalamic hamartoma: Neuropathology and epileptogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 80-90% of HH neurons have an interneuron-like phenotype with small, round soma and short, unbranched processes that lack spines."
    explanation: Documents the predominant small interneuron-like neuronal phenotype on neuropathology.
  - reference: PMID:28591478
    reference_title: "Hypothalamic hamartoma: Neuropathology and epileptogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining HH neurons are large cells with pleomorphic, often pyramidal, soma and dendrites that are more likely to be branched and have spines."
    explanation: Documents the minority large projection-neuron population.
diagnosis:
- name: Somatic Mutation Testing of Resected Hamartoma Tissue
  description: >-
    Because the causal mutations are post-zygotic and brain-restricted, they are
    detectable in hamartoma-derived DNA but typically absent from blood.
    Molecular diagnosis therefore requires paired lesion-versus-leukocyte
    sequencing of resected tissue, not routine blood-based genetic testing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:27453577
    reference_title: "Mutations of the Sonic Hedgehog Pathway Underlie Hypothalamic Hamartoma with Gelastic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the results of a search for somatic mutations in paired hamartoma- and leukocyte-derived DNA samples from 38 individuals"
    explanation: Establishes paired lesion-versus-leukocyte sequencing as the approach that detects the brain-restricted somatic mutations.
- name: Epilepsy-Protocol MRI
  description: >-
    High-resolution (3T epilepsy-protocol) MRI is the essential diagnostic test,
    demonstrating a non-enhancing mass isointense to grey matter at the floor of
    the third ventricle. Additional functional imaging (PET, SPECT, MEG) and
    intracranial EEG are not considered useful.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:41818657
    reference_title: "International Consensus on the Evaluation and Management of Hypothalamic Hamartomas: Results From a Modified Delphi Survey."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gelastic and dacrystic seizures are strongly associated with HH; 3T epilepsy protocol MRI is essential."
    explanation: International consensus establishes 3T epilepsy-protocol MRI as the essential diagnostic modality.
- name: Scalp Electroencephalography (Characteristically Non-Localizing)
  description: >-
    Scalp EEG is characteristically unrevealing for the gelastic seizures — most
    have no ictal scalp correlate, and those that do frequently localize falsely.
    This diagnostic negative is itself a signature of the subcortical
    (intralesional) seizure origin and should not dissuade from the diagnosis.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:41818657
    reference_title: "International Consensus on the Evaluation and Management of Hypothalamic Hamartomas: Results From a Modified Delphi Survey."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "75% of gelastic seizures have no associated scalp EEG correlate; seizures with ictal EEG correlate have high rates of false localization suggesting scalp EEG may be of limited use in seizure localization."
    explanation: Documents the characteristically absent or falsely localizing scalp EEG, a diagnostic hallmark of the subcortical seizure origin.
treatments:
- name: MR-Guided Laser Interstitial Thermal Therapy
  description: >-
    MRgLITT stereotactically ablates the hamartoma and, with radiofrequency
    thermocoagulation, achieves the highest seizure-freedom rates of available
    surgical approaches — reflecting the lesion-directed logic that follows from
    intrinsic epileptogenicity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laser ablation therapy
    term:
      id: NCIT:C111241
      label: Laser Ablation
  target_mechanisms:
  - target: Intrinsic Ictogenesis within the Hamartoma
    treatment_effect: INHIBITS
    description: >-
      Thermal ablation destroys the intrinsically epileptogenic lesion tissue,
      removing the source of the gelastic seizures.
  target_phenotypes:
  - preferred_term: Focal emotional seizure with laughing
    term:
      id: HP:0010821
      label: Focal emotional seizure with laughing
  evidence:
  - reference: PMID:39642321
    reference_title: "Outcome of Surgery for Hypothalamic Hamartoma-Related Epilepsy: A Systematic Review and Individual Participant Data Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance-guided laser interstitial thermal therapy (MRgLITT) and radiofrequency thermocoagulation (RFTC) demonstrated the highest efficacy at the last follow-up"
    explanation: Systematic review and IPD meta-analysis identifying MRgLITT and RFTC as the most effective surgical approaches.
  - reference: PMID:39642321
    reference_title: "Outcome of Surgery for Hypothalamic Hamartoma-Related Epilepsy: A Systematic Review and Individual Participant Data Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the pooled proportion of overall seizure freedom was 50.0% (95% CI 42.7%-57.4%), which increased to 64.5% (95% CI 57.2%-71.5%) after multiple treatments"
    explanation: Quantifies seizure-freedom outcomes after index and repeat lesion-directed procedures.
  - reference: PMID:41818657
    reference_title: "International Consensus on the Evaluation and Management of Hypothalamic Hamartomas: Results From a Modified Delphi Survey."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LITT is preferred for Delalande II and III HH."
    explanation: International consensus prefers LITT for Delalande type II and III hamartomas, tying approach selection to the anatomic classification.
  - reference: PMID:41818657
    reference_title: "International Consensus on the Evaluation and Management of Hypothalamic Hamartomas: Results From a Modified Delphi Survey."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cognitive complications(any deficit in cognitive domain especially memory) were reported in 3.4% overall, most commonly in MRgLITT, 9.2%"
    explanation: >-
      Balancing evidence: although MRgLITT is highly effective, it carries the
      highest reported rate of cognitive (especially memory) complications of
      the lesion-directed approaches.
- name: Radiofrequency Thermocoagulation (RFTC)
  description: >-
    Stereotactic radiofrequency thermocoagulation ablates the hamartoma through
    depth electrodes. It is a distinct lesion-directed modality from MRgLITT and
    carries the highest reported seizure-freedom rate in the pooled analysis,
    with no difference in major complications between the two.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: radiofrequency ablation therapy
    term:
      id: NCIT:C15666
      label: Radiofrequency Ablation
  target_mechanisms:
  - target: Intrinsic Ictogenesis within the Hamartoma
    treatment_effect: INHIBITS
    description: >-
      Thermal ablation destroys the intrinsically epileptogenic lesion tissue,
      removing the source of ictogenesis.
  evidence:
  - reference: PMID:39642321
    reference_title: "Outcome of Surgery for Hypothalamic Hamartoma-Related Epilepsy: A Systematic Review and Individual Participant Data Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance-guided laser interstitial thermal therapy (MRgLITT) and radiofrequency thermocoagulation (RFTC) demonstrated the highest efficacy at the last follow-up, with seizure freedom rates of 74.5% (95% CI 66.8%-81.7%) and 78.5% (95% CI 71.6%-84.8%), respectively."
    explanation: RFTC shows the highest pooled seizure-freedom rate (78.5%) among lesion-directed approaches.
- name: Stereotactic Radiosurgery
  description: >-
    Gamma Knife or linear-accelerator stereotactic radiosurgery is an alternative
    lesion-directed option, particularly for deep or surgically difficult
    hamartomas, with delayed onset of seizure benefit.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: stereotactic radiosurgery
    term:
      id: NCIT:C15358
      label: Stereotactic Radiosurgery
  target_mechanisms:
  - target: Intrinsic Ictogenesis within the Hamartoma
    treatment_effect: INHIBITS
    description: Focused irradiation of the hamartoma reduces its epileptogenic output.
  evidence:
  - reference: PMID:22503469
    reference_title: "The gelastic seizures-hypothalamic hamartoma syndrome: facts, hypotheses, and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gamma-knife radiosurgery and image-guided robotic radiosurgery seem to be useful and safe approaches for treatment, in particular of small HH."
    explanation: Directly supports stereotactic radiosurgery as a useful and safe lesion-directed option, particularly for small hamartomas.
  - reference: PMID:39642321
    reference_title: "Outcome of Surgery for Hypothalamic Hamartoma-Related Epilepsy: A Systematic Review and Individual Participant Data Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stereotactic radiosurgery (SRS) was the safest approach, with a pooled proportion of major complications of 0.0%"
    explanation: Quantifies SRS as the safest of the lesion-directed approaches, the trade-off against its lower and delayed efficacy.
- name: Antiseizure Medication (Poorly Effective)
  description: >-
    Antiseizure medications are known to be poorly effective for the gelastic
    seizures of HH, because the ictal generator lies within the hamartoma rather
    than in cortex. Their limited efficacy is the reason management is directed
    at the lesion itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  evidence:
  - reference: PMID:16114178
    reference_title: "The hypothalamic hamartoma: a model of subcortical epileptogenesis and encephalopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Anticonvulsant medications are known to be poorly effective in this disorder."
    explanation: Documents the poor efficacy of antiseizure medication, motivating lesion-directed therapy instead.
  - reference: PMID:41818657
    reference_title: "International Consensus on the Evaluation and Management of Hypothalamic Hamartomas: Results From a Modified Delphi Survey."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surgical evaluation should begin at the start of the first ASM, with surgery recommended after failure of 2 ASMs."
    explanation: Consensus recommends early surgical referral rather than prolonged medical therapy, reflecting the limited role of ASMs.

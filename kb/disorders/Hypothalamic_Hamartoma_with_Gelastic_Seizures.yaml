      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These neurons appear to be excitatory, projection-type neurons, and have the functionally immature behavior of depolarizing and firing in response to GABA ligands."
      explanation: The large projection neurons depolarize in response to GABA released by the small pacemaker neurons.
- name: Paradoxical GABA-Mediated Excitation of Large Projection Neurons
  biological_scale: CELLULAR
  description: >-
    The minority population of large HH neurons have pleomorphic, often pyramidal
    soma with branched, spiny dendrites and appear to be excitatory
    projection-type neurons. Functionally immature, they depolarize and fire in
    response to GABA ligands rather than being inhibited — so the GABA released
    by the small pacemaker neurons drives, rather than dampens, output from the
    lesion. This immature, depolarizing GABA response is attributed to the
    immature transmembrane chloride gradient of these neurons rather than to an
    abnormality of the GABA-A receptor itself.
  cell_types:
  - preferred_term: large excitatory projection-type HH neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:28591478
    reference_title: "Hypothalamic hamartoma: Neuropathology and epileptogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These neurons appear to be excitatory, projection-type neurons, and have the functionally immature behavior of depolarizing and firing in response to GABA ligands."
    explanation: >-
      Ex vivo recordings show the large projection neurons depolarize rather than
      hyperpolarize in response to GABA.
  downstream:
  - target: Intrinsic Ictogenesis within the Hamartoma
    description: >-
      Synchronized output of the neuronal clusters generates seizures locally
      within the lesion; how the cells synchronize into an ictogenic network is
      not established (see the associated knowledge-gap discussion).
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28591478
      reference_title: "Hypothalamic hamartoma: Neuropathology and epileptogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We hypothesize that the irregular neuronal clusters are the functional unit for ictogenesis."
      explanation: The neuronal clusters are proposed as the functional unit generating seizures within the lesion.
- name: Intrinsic Ictogenesis within the Hamartoma

discussions:
- discussion_id: interp_hh_subcortical_seizure_origin
  prompt: >-
    How does HH overturn the conventional assumption that seizures originate in
    cortex, and why does that reframing determine treatment?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Intrinsic Ictogenesis within the Hamartoma
  - pathophysiology#Secondary Epileptogenesis in Extrahypothalamic Networks
  rationale: >-
    HH is the premier human model of subcortical epileptogenesis: depth-electrode
    and surgical evidence established that the gelastic seizures arise inside the
    hamartoma, not in cortical structures. This reframing is not merely academic
    — it explains why antiseizure medications and cortical resections fail, and
    why ablating a small deep lesion can abolish seizures. It also frames the
    cortical seizure types that appear later as secondary (kindled) rather than
    primary, which is the argument for intervening early, before secondary
    epileptogenesis and cognitive/behavioral deterioration become entrenched.
  evidence:
  - reference: PMID:16114178
    reference_title: "The hypothalamic hamartoma: a model of subcortical epileptogenesis and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contrary to conventional thinking which attributed seizure origin to cortical structures, the hamartoma itself has now been firmly established as the site of intrinsic epileptogenesis for the gelastic seizures"
    explanation: States the reframing of seizure origin from cortex to the hamartoma itself.
  - reference: PMID:16114178
    reference_title: "The hypothalamic hamartoma: a model of subcortical epileptogenesis and encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment, including some innovative approaches to surgical resection, is now targeted directly at the HH itself, with impressive results."
    explanation: Shows the therapeutic consequence of the subcortical-origin reframing.
- discussion_id: gap_hh_cluster_network_ictogenesis
  prompt: >-
    What is the local circuit mechanism by which clusters of small, spontaneously
    firing GABAergic neurons and GABA-depolarized large projection neurons
    synchronize to generate a gelastic seizure, and why do only some hamartomas
    become epileptogenic?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Small GABAergic Neuron Spontaneous Pacemaker Firing
  - pathophysiology#Paradoxical GABA-Mediated Excitation of Large Projection Neurons
  - pathophysiology#Intrinsic Ictogenesis within the Hamartoma
  rationale: >-
    The cellular ingredients are established — spontaneously firing small
    GABAergic neurons, large projection neurons that depolarize to GABA, and
    GABA-A receptor rundown — but how these assemble into a synchronized
    ictogenic network is explicitly framed as a hypothesis requiring further
    work. Resolving it would explain the variable epileptogenicity of
    anatomically similar lesions and could identify a pharmacological target for
    a disorder currently treatable only by ablation.

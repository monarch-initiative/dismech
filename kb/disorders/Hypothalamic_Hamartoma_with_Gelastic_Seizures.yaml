- name: Ectopic GnRH Secretion
  biological_scale: ORGANISM
  description: >-
    Hamartoma tissue can secrete gonadotropin-releasing hormone autonomously,
    outside normal hypothalamic regulatory control, prematurely activating the
    hypothalamic-pituitary-gonadal axis and producing central (GnRH-dependent)
    precocious puberty. This endocrine arm is independent of the epileptic arm
    and is more often associated with pedunculated lesions.

- name: Small GABAergic Neuron Spontaneous Pacemaker Firing
  biological_scale: CELLULAR
  description: >-
    Approximately 80-90% of HH neurons have an interneuron-like phenotype with
    small, round soma and short unbranched processes lacking spines. They express
    glutamic acid decarboxylase and use GABA as their primary neurotransmitter,
    and possess intrinsic membrane properties that produce spontaneous,
    pacemaker-like firing. These small neurons additionally show functional
    GABA-A receptor rundown on repetitive GABA exposure — a defect intrinsic to
    the HH receptor protein and much less marked in the large neurons — further
    degrading inhibitory control. This autonomous firing is the proposed
    cellular origin of ictogenesis within the lesion.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  molecular_functions:
  - preferred_term: GABA-A receptor activity
    term:
      id: GO:0004890
      label: GABA-A receptor activity
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:28591478
    reference_title: "Hypothalamic hamartoma: Neuropathology and epileptogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These neurons express glutamic acid decarboxylase and likely utilize γ-aminobutyric acid (GABA) as their primary neurotransmitter. They have intrinsic membrane properties that lead to spontaneous pacemaker-like firing activity."
    explanation: >-
      Documents the spontaneous pacemaker-like firing of the small GABAergic
      neurons that dominate the lesion (ex vivo recordings from resected human
      HH tissue reviewed here).
  - reference: PMID:22503469
    reference_title: "The gelastic seizures-hypothalamic hamartoma syndrome: facts, hypotheses, and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The intrinsic epileptogenicity of HH may be explained by the neurophysiological properties of small GABAergic, spontaneously firing HH neurons."
    explanation: Directly attributes the intrinsic epileptogenicity of the lesion to the small, spontaneously firing GABAergic neurons.
  - reference: PMID:21391233
    reference_title: "Functional rundown of gamma-aminobutyric acid(A) receptors in human hypothalamic hamartomas."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "repetitive exposure to GABA (5 consecutive exposures to 0.1 mM GABA with 1-second duration and at 20-second intervals) induced a time-dependent rundown of whole-cell currents in small HH neurons"
    explanation: >-
      Ex vivo perforated patch-clamp on neurons acutely dissociated from resected
      HH tissue demonstrates GABA-A receptor functional rundown, and shows it is
      a property of the small neurons.
  - reference: PMID:21391233
    reference_title: "Functional rundown of gamma-aminobutyric acid(A) receptors in human hypothalamic hamartomas."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "induced GABA current rundown in Xenopus oocytes microinjected with HH membrane proteins, but not in the oocytes"
    explanation: >-
      Heterologous expression of HH membrane proteins in Xenopus oocytes
      reproduces the rundown while control hypothalamic membranes do not,
      establishing that the defect is intrinsic to the HH receptor protein.
  downstream:

name: Hypothalamic Hamartoma with Gelastic Seizures
category: Somatic mosaic
creation_date: "2026-07-30T06:55:00Z"
synonyms:
- Gelastic epilepsy with hypothalamic hamartoma
- Hypothalamic hamartoma-related epilepsy
- HH with gelastic epilepsy
description: >-
  Hypothalamic hamartoma (HH) with gelastic seizures is a rare, drug-resistant
  epilepsy syndrome caused by a congenital, non-neoplastic malformation of the
  ventral hypothalamus. Most lesions arise from post-zygotic somatic mutations
  in Sonic hedgehog (Shh) pathway genes (GLI3, PRKACA, SMO and others) confined
  to the hamartoma tissue; a minority occur in the germline setting of
  Pallister-Hall syndrome. The syndrome is mechanistically distinctive because
  the hamartoma is itself intrinsically epileptogenic — the gelastic (ictal
  laughter) seizures are generated within the lesion rather than in cortex,
  overturning the conventional assumption of cortical seizure origin. Small
  GABAergic interneuron-like neurons that make up 80-90% of the lesion fire
  spontaneously in a pacemaker-like manner, while the large projection neurons
  are paradoxically depolarized by GABA. Over time the hamartoma drives
  secondary epileptogenesis in extrahypothalamic networks, producing additional
  focal and generalized seizure types, progressive cognitive decline, and severe
  behavioral disturbance (rage attacks). Central precocious puberty frequently
  co-occurs. Antiseizure medications are poorly effective; treatment is directed
  at the lesion itself, with MR-guided laser interstitial thermal therapy now the
  most effective approach.

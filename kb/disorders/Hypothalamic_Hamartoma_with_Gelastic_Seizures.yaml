  description: >-
    HH with gelastic seizures is typically sporadic, arising from post-zygotic
    somatic mutations that are present in hamartoma tissue but absent from
    blood. It is therefore not inherited in a Mendelian fashion in most cases;
    the exception is the germline GLI3 setting of Pallister-Hall syndrome.
  evidence:
  - reference: PMID:27453577
    reference_title: "Mutations of the Sonic Hedgehog Pathway Underlie Hypothalamic Hamartoma with Gelastic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the results of a search for somatic mutations in paired hamartoma- and leukocyte-derived DNA samples from 38 individuals"
    explanation: The causal variants are somatic and lesion-restricted (absent from leukocyte DNA), establishing the mosaic, non-Mendelian origin.
genetic:
- name: GLI3
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  gene_term:
    preferred_term: GLI3
    term:
      id: hgnc:4319
      label: GLI3
  notes: >-
    Post-zygotic somatic GLI3 mutations restricted to hamartoma tissue are a
    recurrent cause of sporadic, non-syndromic HH with gelastic epilepsy. GLI3
    is a Sonic hedgehog pathway transcription factor; germline GLI3 variants
    instead cause Pallister-Hall syndrome, in which hypothalamic hamartoma is
    one component of a multisystem malformation syndrome. Beyond point
    mutations, a structurally distinct class of large brain-tissue-specific
    copy-number and loss-of-heterozygosity variants spanning multiple Shh
    pathway genes accounts for half of the mutation-positive cases.
  evidence:
  - reference: PMID:27453577
    reference_title: "Mutations of the Sonic Hedgehog Pathway Underlie Hypothalamic Hamartoma with Gelastic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four subjects had somatic mutations in GLI3, an Shh pathway gene associated with HH"
    explanation: Identifies somatic GLI3 mutations in hamartoma tissue as a cause of HH with gelastic epilepsy.
  - reference: PMID:27453577
    reference_title: "Mutations of the Sonic Hedgehog Pathway Underlie Hypothalamic Hamartoma with Gelastic Epilepsy."

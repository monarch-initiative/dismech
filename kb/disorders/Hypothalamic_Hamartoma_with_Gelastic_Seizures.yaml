    snippet: "two recurrent and three single brain-tissue-specific, large copy-number or loss-of-heterozygosity (LOH) variants involving multiple Shh genes"
    explanation: Documents the large somatic CNV/LOH class of lesions, a mutational mechanism distinct from point mutation.

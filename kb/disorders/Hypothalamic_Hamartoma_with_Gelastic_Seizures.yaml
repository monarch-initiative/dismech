    generated within the lesion itself rather than in cortical structures, a
    finding that overturned the conventional assumption of cortical seizure
    origin. The irregular neuronal clusters are hypothesized to be the functional
    unit for ictogenesis. This is the defining mechanistic feature of the
    syndrome and the rationale for lesion-directed therapy.

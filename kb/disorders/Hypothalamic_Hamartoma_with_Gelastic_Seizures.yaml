- name: Hypothalamic Hamartoma Formation
  biological_scale: TISSUE
  description: >-
    A congenital, non-neoplastic malformation of the ventral hypothalamus forms
    at or adjacent to the floor of the third ventricle. Its microarchitecture is
    relatively simple, consisting of nodular clusters of neurons of varying size
    and abundance with poorly defined boundaries. Lesions may be pedunculated
    (more often presenting with precocious puberty) or sessile (more often
    presenting with the epileptic phenotype).

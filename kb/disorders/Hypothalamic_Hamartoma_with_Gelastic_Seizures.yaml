pathophysiology:
- name: Somatic Sonic Hedgehog Pathway Mutation
  biological_scale: MOLECULAR
  description: >-
    Post-zygotic somatic mutations in Sonic hedgehog (Shh) pathway genes, present
    in hamartoma tissue but absent from leukocyte DNA, were identified in 37% of
    individuals with HH. Affected genes include GLI3 and PRKACA, the ligands SHH
    and IHH, the receptor SMO, and other downstream pathway members; large
    brain-tissue-specific copy-number and loss-of-heterozygosity variants also
    occur. The mosaic, brain-restricted nature of the lesion explains why the
    disorder is typically sporadic.

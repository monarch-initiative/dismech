    explanation: Heterozygous TRPV4 ankyrin-domain mutations cause dominant distal/scapuloperoneal SMA.
- name: FBXO38
  gene_term:
    preferred_term: FBXO38
    term:
      id: hgnc:28844
      label: FBXO38
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  subtype: dHMN-FBXO38
  notes: >
    The heterozygous FBXO38 p.Cys206Arg substitution impairs KLF7-mediated
    transcription of axon-outgrowth and repair genes, with reduced neurite
    outgrowth in primary motor neurons. ClinGen's Charcot-Marie-Tooth Disease
    Gene Curation Expert Panel classifies FBXO38 as `Moderate` for distal
    hereditary motor neuropathy (MONDO:0018894) with autosomal dominant
    inheritance, in the current Gene-Disease Validity table (file created
    2026-09-25, downloaded from the unversioned URL pinned in
    data/clingen/MANIFEST.yaml). `Moderate` is the second tier, and it is worth
    reading against the rest of the entry: on the same table HSPB1, GARS1, BSCL2,
    HSPB8 and TRPV4 all carry `Definitive` classifications against a neuropathy or
    neuromuscular term, SLC5A7 carries `Moderate` for dHMN7A exactly as FBXO38
    does, DCTN1 carries `Moderate` but for amyotrophic lateral sclerosis rather
    than for a neuropathy, and HSPB3, EMILIN1, SPTAN1 and BAG3 carry no neuropathy
    assertion at all. This record is typed CAUSATIVE, but the subtype row records
    the narrow two-family evidence base explicitly rather than leaning on the
    classification.
  evidence:
  - reference: PMID:24207122
    reference_title: "A dominant mutation in FBXO38 causes distal spinal muscular atrophy with calf predominance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two unrelated families affected by a distinct form of autosomal-dominant distal SMA initially manifesting with calf weakness, we identified by genetic linkage analysis and exome sequencing a heterozygous missense mutation, c.616T>C (p.Cys206Arg), in F-box protein 38 (FBXO38)."
    explanation: Establishes the dominant FBXO38 allele as a cause of distal SMA in two unrelated families.
- name: EMILIN1
  gene_term:
    preferred_term: EMILIN1
    term:
      id: hgnc:19880
      label: EMILIN1
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  subtype: dHMN-EMILIN1
  notes: >
    Heterozygous EMILIN1 p.R250C segregated with a distal motor neuropathy in
    four affected members of one dominant family, with reduced extracellular
    deposition of EMILIN-1 in patient skin and fibroblasts and a motor-axonal
    phenotype on zebrafish knockdown that wild-type but not mutant cRNA
    complemented. The mechanism is extracellular-matrix rather than
    intracellular, so this gene is not bound at the proteostasis and
    axonal-transport node.

    The claim is typed CAUSATIVE on the strength of the family segregation plus
    the complementation experiment, but on one family for this phenotype. The
    only ClinGen assertion for EMILIN1 in the current Gene-Disease Validity
    table (file created 2026-09-25) is `Definitive` for arterial tortuosity-bone
    fragility syndrome (MONDO:0971179, autosomal recessive) - a different
    disease and a different inheritance mode - and there is no ClinGen
    assertion against any neuropathy, so nothing in ClinGen either supports or
    contradicts this record.
  evidence:
  - reference: PMID:31978608
    reference_title: Distal motor neuropathy associated with novel EMILIN1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "located in the coiled coil forming region of the protein, in four affected members of an autosomal dominant family presenting a distal motor neuropathy phenotype"
    explanation: >-
      Establishes four affected members of a dominant family with distal motor
      neuropathy and a coiled-coil-region variant. The quoted span starts
      mid-sentence for the bracket reason recorded on the `dHMN-EMILIN1` subtype
      row; the allele is c.748C>T p.R250C.
- name: SPTAN1
  gene_term:
    preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  subtype: dHMN-SPTAN1
  notes: >
    Heterozygous SPTAN1 nonsense variants in three dominant hereditary motor
    neuropathy families act by nonsense-mediated decay and reduced alpha-II
    spectrin protein, i.e. haploinsufficiency. Penetrance was variable in two of
    the three families.

    ClinGen classifies SPTAN1 `Definitive` for genetic developmental and
    epileptic encephalopathy (MONDO:0100062) and carries no assertion against
    any neuropathy (current Gene-Disease Validity table, file created
    2026-09-25). That assertion is not evidence for this record: the
    encephalopathy is attributed to dominant-negative alleles and the neuropathy
    to nonsense alleles removed by nonsense-mediated decay, a distinction the
    founding motor-neuropathy report makes itself. This knowledge base curates
    the encephalopathy separately as
    `SPTAN1-Related_Developmental_and_Epileptic_Encephalopathy`.
  evidence:
  - reference: PMID:31332438
    reference_title: "Nonsense mutations in alpha-II spectrin in three families with juvenile onset hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified patients with heterozygous nonsense mutations in the αII-spectrin gene, SPTAN1, in three separate dominant hereditary motor neuropathy families via next-generation sequencing."
    explanation: Establishes heterozygous SPTAN1 nonsense alleles as a cause of dominant hereditary motor neuropathy.
- name: BAG3
  gene_term:
    preferred_term: BAG3
    term:
      id: hgnc:939
      label: BAG3
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  subtype: dHMN-BAG3
  notes: >
    A heterozygous truncating BAG3 variant segregated with adult-onset distal
    hereditary motor neuronopathy in one family of eight affected individuals,
    with incomplete penetrance in women. BAG3 is the co-chaperone of
    chaperone-assisted selective autophagy and the HSPB8 partner, which places
    the lesion on the proteostasis machinery this entry already models.

    The depth of curation for BAG3's neuropathy phenotypes is in
    `Charcot-Marie-Tooth_Disease_Axonal_Type_2JJ`, including the
    variant-class-to-phenotype correlation across the gene's disease spectrum;
    this record exists so the HMND15 subtype and its gene are bound under the
    parent MONDO makes them children of. ClinGen's `Definitive` BAG3 assertions
    are for myofibrillar myopathy and dilated cardiomyopathy 1HH, not for any
    neuropathy (current Gene-Disease Validity table, file created 2026-09-25).
  evidence:
  - reference: PMID:37907725
    reference_title: "Distal hereditary motor neuronopathy as a new phenotype associated with variants in BAG3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an autosomal dominant adult-onset distal hereditary motor
      neuronopathy with incomplete penetrance in women as a new phenotype related
      to a truncating variant in the BAG3 gene.
    explanation: Establishes the dominant truncating BAG3 allele as a cause of adult-onset distal hereditary motor neuronopathy.
prevalence:
- population: general (pooled HMN estimate)
  notes: >
    Cumulative estimated prevalence of hereditary motor neuropathies is 2.14 per
    100,000; a dHMN cohort study reported a minimum prevalence of 2.3 per 100,000.
    Most dominant dHMN families carry mutations in HSPB1, GARS1, BICD2, or DNAJB2.
  evidence:
  - reference: PMID:36445400
    reference_title: "Early onset hereditary neuronopathies: an update on non-5q motor neuron diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their cumulative estimated prevalence is 2.14/100 000 and, to date, around 30 causative genes have been identified with autosomal dominant, recessive,and X-linked inheritance."
    explanation: Provides the pooled HMN prevalence estimate and notes dominant inheritance among causes.
  - reference: PMID:33369814
    reference_title: "Distal hereditary motor neuropathies: Mutation spectrum and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The calculated minimum prevalence of dHMN was 2.3 per 100,000 individuals."
    explanation: Provides a population-specific minimum dHMN prevalence.
- population: dHMN cohort (gene frequencies)
  notes: >
    In a genetically screened dHMN cohort, the most frequent causes were
    dominant-acting HSPB1 and GARS1 mutations.
  evidence:
  - reference: PMID:33369814
    reference_title: "Distal hereditary motor neuropathies: Mutation spectrum and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent cause of distal hereditary motor neuropathies were mutations in HSPB1 (10.4%), GARS1 (9.8%), BICD2 (8.0%), and DNAJB2 (6.7%) genes."
    explanation: HSPB1 and GARS1 are the most frequent (dominant) dHMN genes.

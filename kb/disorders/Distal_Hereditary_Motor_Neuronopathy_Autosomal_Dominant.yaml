notes: >
  Three numbering systems are live for these diseases and they do not agree, so
  read a subtype designation together with its gene. OMIM currently numbers the
  dominant forms HMND1 to HMND15 in one series, in the genetic-heterogeneity
  table carried by its HMND1 entry (OMIM:182960; read from the corresponding
  MedGen record, Concept ID C1866784); MONDO keeps the older Harding
  style for the earlier entities (`type 2B`, `type 5A`, `type 7A`) and uses the
  OMIM style for the recent ones (`autosomal dominant 10`, `11`, `15`); and this
  entry's `has_subtypes[].name` values are short slugs that follow whichever
  designation the literature uses for that gene. The collisions are real, and
  each pairing below was checked against the MONDO term's own OMIM
  cross-reference rather than inferred from the labels: MONDO's `type 5A`
  (OMIM:600794) is OMIM's HMND5 (GARS1), `type 5B` (OMIM:614751) is HMND12
  (REEP1), `type 5C` (OMIM:619112) is HMND13 (BSCL2), and `type 2D`
  (OMIM:615575) is HMND6 (FBXO38). The `subtype_term`
  bindings are the machine-readable answer and the gene is the human-readable
  one; the slug is neither.

  Every MONDO descendant of this entry's disease term MONDO:0015362 is accounted
  for, either here or elsewhere in the knowledge base:

  - Curated as subtype rows here: MONDO:0012080 (HSPB1), MONDO:0030860 (BSCL2),
    MONDO:0015353 (GARS1), MONDO:0011879 (DCTN1), MONDO:0008024 (SLC5A7),
    MONDO:0013243 (HSPB3), MONDO:0010839 (TRPV4), MONDO:0014259 (FBXO38),
    MONDO:0859300 (EMILIN1), MONDO:0957875 (SPTAN1), MONDO:0976226 (BAG3).
  - Curated as their own disease entries: MONDO:0008025 dHMN2A (HSPB8, as
    `Distal_Hereditary_Motor_Neuronopathy_Type_2A`), MONDO:0013884 dHMN5B (REEP1,
    as `Distal_Hereditary_Motor_Neuronopathy_Type_5B`), MONDO:0060585 dHMN9
    (WARS1, as `Distal_Hereditary_Motor_Neuronopathy_Type_9`).
  - Declared at disease level as a `skos:narrowMatch` mapping: MONDO:0010043
    Silver syndrome / SPG17, the second BSCL2 term.
  - Curated elsewhere because it is not primarily a neuronopathy:
    MONDO:0976133 `myopathy, myofibrillar, 13, with rimmed vacuoles` (HSPB8,
    OMIM:621078), which MONDO files under this entry's term and under
    myofibrillar myopathy simultaneously. It is a subtype row on
    `Myofibrillar_Myopathy`, which is the right home for the myopathic pole of
    the HSPB8 spectrum; no row is duplicated here.
  - Not curated, because MONDO records no causal gene for them and there is
    nothing gene-defined to curate: MONDO:0008451 `neuronopathy, distal
    hereditary motor, autosomal dominant 1` (OMIM:182960), which is the legacy
    Harding type 1 designation and the entry whose record carries the
    nomenclature table for the whole series, and the three intermediate grouping
    terms MONDO:0015352 (`distal hereditary motor neuropathy type 2`),
    MONDO:0100350 (`type 5`) and MONDO:0015355 (`type 7`), which exist to
    collect their lettered children.

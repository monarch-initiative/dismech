name: Distal Hereditary Motor Neuronopathy, Autosomal Dominant
creation_date: "2026-06-17T00:00:00Z"
category: Genetic
description: >
  Autosomal dominant distal hereditary motor neuronopathy (dHMN; also called
  autosomal dominant distal spinal muscular atrophy, dSMA) is a clinically and
  genetically heterogeneous group of inherited lower motor neuron disorders
  characterized by slowly progressive, length-dependent distal muscle weakness
  and atrophy with minimal or absent sensory involvement. Neurophysiology shows
  chronic neurogenic denervation on EMG with a motor axonal pattern on nerve
  conduction studies and preserved sensory responses, distinguishing dHMN from
  axonal Charcot-Marie-Tooth disease (CMT2). The autosomal dominant forms are
  caused by heterozygous mutations in genes affecting motor-neuron and
  distal-axon biology, prominently the small heat-shock protein chaperones HSPB1
  (dHMN2B / CMT2F), HSPB3 (dHMN2C) and HSPB8 (dHMN2A, split out - see below), the
  endoplasmic-reticulum protein seipin
  BSCL2 (dHMN5 / Silver syndrome), the aminoacyl-tRNA synthetase GARS1
  (dHMN5 / CMT2D spectrum), the axonal-transport motor adaptor DCTN1
  (dynactin), the presynaptic choline transporter SLC5A7 (dHMN7A), and the cation
  channel TRPV4 (scapuloperoneal/congenital distal SMA spectrum). Recurrent
  pathogenic mechanisms include disrupted protein quality control with
  aggregation, impaired axonal transport, defective tRNA charging/translation,
  and disturbed neuromuscular-junction transmission. The autosomal recessive
  forms (e.g., IGHMBP2/SMARD1, SIGMAR1, PLEKHG5) are a distinct sibling entry.
  HSPB8 causes dHMN type 2A (MONDO:0008025) and now has its own entry,
  `Distal_Hereditary_Motor_Neuronopathy_Type_2A`, rather than being carried
  here as a subtype - it is curated as a specific toxic-gain-of-function
  proteostasis lesion at the K141 hot spot, running through the HSPB8-BAG3
  chaperone-assisted selective autophagy complex, which is finer than the
  general proteostasis framing of this entry. Its subtype row, HSPB8 genetic
  block and OMIM:158590 assertion moved with it.
  Four further dominant loci are curated here as subtype rows: FBXO38 (dHMN
  type 2D), which acts through KLF7-dependent transcription of axon-outgrowth
  genes; EMILIN1 (HMND10), an extracellular matrix glycoprotein and the one
  locus on this entry whose lesion is outside the motor neuron; SPTAN1
  (HMND11), acting by haploinsufficiency of the axonal alpha-II spectrin
  cytoskeleton; and BAG3 (HMND15), the HSPB8 co-chaperone of
  chaperone-assisted selective autophagy.
  A second aminoacyl-tRNA synthetase gene, WARS1, causes dHMN type 9
  (MONDO:0060585) and has its own entry,
  `Distal_Hereditary_Motor_Neuronopathy_Type_9`, rather than being folded in
  here - its curated mechanism is two-armed (dominant-negative loss of
  tryptophanyl-tRNA charging plus potentiation of a non-canonical angiostatic
  TrpRS activity) and is not represented by the proteostasis and
  axonal-transport framing of this entry.

- name: HSPB3
  gene_term:
    preferred_term: HSPB3
    term:
      id: hgnc:5248
      label: HSPB3
  inheritance:
  - name: Autosomal Dominant
  subtype: dHMN2C
  notes: >
    Heterozygous HSPB3 (HSPL27) missense variants are reported in two families:
    p.Arg7Ser in the N-terminal domain (dHMN2C) and p.Tyr118His in the
    alpha-crystallin domain (reported as axonal CMT2). HSPB3 differs from HSPB1
    and HSPB8 in being tissue-restricted rather than ubiquitous, and it forms
    hetero-oligomers with HSPB2 and HSPB8, which is the proposed route by which
    a variant in it reaches the same chaperone machinery. ClinGen's Gene-Disease
    Validity table (release pinned in data/clingen/MANIFEST.yaml) contains no
    HSPB3 assertion, so the gene-disease relationship has not been classified by
    that panel either way.
  evidence:
  - reference: PMID:28018906
    reference_title: "Chaperonopathies: Spotlight on Hereditary Motor Neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HSPB3 interacts with HSPB2 and these two proteins in turn both interact with HSPB8, potentially contributing to maintain myofibril integrity"
    explanation: >-
      Places HSPB3 inside the same small heat-shock protein complex as HSPB8,
      which is why a variant in it plausibly acts through the proteostasis chain
      this entry models. The functional link is stated as a potential
      contribution, not a demonstrated disease mechanism.
  - reference: PMID:37804589
    reference_title: "PINK1 and Parkin rescue motor defects and mitochondria dysfunction induced by a patient-derived HSPB3 mutant in Drosophila models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this human HSPB3 mutant gene induced a loss of motor activity accompanied by reduced mitochondrial membrane potential in fly neuronal tissues"
    explanation: >-
      First animal model of an HSPB3 variant, showing the patient-derived Y118H
      allele produces a motor phenotype in fly neurons. It is a fly model of the
      CMT2-associated allele, not of the dHMN2C R7S allele, so it supports the
      gene being pathogenic rather than the specific dHMN2C mechanism.

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0010043
      label: hereditary spastic paraplegia 17
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      OMIM gives BSCL2 two phenotype entries that both sit under this entry's
      disease term in MONDO: OMIM:270685 Silver syndrome / SPG17, which MONDO
      labels `hereditary spastic paraplegia 17`, and OMIM:619112, which MONDO
      labels `neuronopathy, distal hereditary motor, type 5C`. The single
      `dHMN5` subtype row here covers both, because the entity curated is one
      BSCL2 allelic spectrum (N88S/S90L) whose upper-motor-neuron involvement is
      variable rather than two diseases. `subtype_term` is single-valued, so the
      row binds the pure-dHMN term (MONDO:0030860) - the one inside this entry's
      scope - and the Silver-syndrome/SPG17 term is declared here at disease
      level instead. narrowMatch rather than exactMatch because SPG17 is
      narrower than the dismech subtype and is also a hereditary spastic
      paraplegia, which this entry is not.
  - term:
      id: MONDO:0976226
      label: neuronopathy, distal hereditary motor, autosomal dominant 15
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      The BAG3 leaf, HMND15 / OMIM:621094. Bound as the `subtype_term` of the
      `dHMN-BAG3` row, and declared here as well because BAG3's neuropathy
      phenotypes are curated in depth in a different entry
      (`Charcot-Marie-Tooth_Disease_Axonal_Type_2JJ`, MONDO:0976227 /
      OMIM:621095) and a reader arriving at either entry should be able to see
      that the two OMIM numbers are adjacent phenotypes of one gene rather than
      duplicates.

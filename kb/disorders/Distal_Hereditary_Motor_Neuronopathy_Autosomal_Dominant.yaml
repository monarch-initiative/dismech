      label: neuronopathy, distal hereditary motor, type 7A
  genes:
  - preferred_term: SLC5A7
    term:
      id: hgnc:14025
      label: SLC5A7
  description: >
    Autosomal dominant distal hereditary motor neuropathy type VII caused by a
    dominantly segregating SLC5A7 mutation encoding the presynaptic choline
    transporter (CHT). The truncating mutation reduces choline uptake at the
    neuromuscular junction, linking dHMN to impaired NMJ transmission.
  evidence:
  - reference: PMID:23141292
    reference_title: "Defective presynaptic choline transport underlies hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using linkage analysis and whole-exome sequencing of DNA samples from subjects with distal hereditary motor neuropathy type VII, we identified a mutation in SLC5A7, which encodes the presynaptic choline transporter (CHT)"
    explanation: Establishes a dominant SLC5A7 mutation as the cause of dHMN type VII.
- name: dHMN2C
  display_name: dHMN2C (HSPB3-related)
  description: >
    Distal hereditary motor neuronopathy type 2C, caused by a heterozygous
    variant in HSPB3 (HSPL27), a third small heat-shock protein of the same
    family as the HSPB1 and HSPB8 genes that dominate this entry. The founding
    report identified c.21G>T (p.Arg7Ser) in the N-terminal domain in two
    affected siblings with an asymmetric, length-dependent, predominantly motor
    axonal neuropathy, found by screening all ten sHSP genes in a neuropathy
    cohort rather than by linkage. A second heterozygous allele, c.352T>C
    (p.Tyr118His) in the alpha-crystallin domain, was later reported in a Korean
    family that was ascribed to axonal CMT2 rather than to dHMN, so the two
    published alleles sit on either side of the dHMN/CMT2 boundary that this
    entry otherwise draws electrophysiologically.

    The evidence base is deliberately recorded as thin. A 2016 review of the
    chaperone dHMNs states that only one family was then known to carry a
    clinical HSPB3 mutation, and ClinGen's Gene-Disease Validity table (release
    pinned in data/clingen/MANIFEST.yaml) contains no HSPB3 assertion at all,
    while it classifies HSPB8 as Definitive for MONDO:0015362 - this entry's own
    disease term.
    HSPB3 is therefore curated here as a subtype row rather than as a separate
    disease entry: it has two reported alleles in two families and no
    disease-specific pathophysiology that is distinguishable from the
    chaperone/proteostasis chain this entry already models.

    Naming trap. dHMN2C (HSPB3) is not HMSN2C, the hereditary motor and sensory
    neuropathy caused by TRPV4 that appears in the `dHMN-TRPV4` row of this same
    entry. The two abbreviations differ by one letter and name different genes
    and different diseases.
  subtype_term:
    preferred_term: neuronopathy, distal hereditary motor, type 2C
    term:
      id: MONDO:0013243
      label: neuronopathy, distal hereditary motor, type 2C
  genes:
  - preferred_term: HSPB3
    term:
      id: hgnc:5248
      label: HSPB3
  evidence:
  - reference: PMID:20142617
    reference_title: "Mutant small heat shock protein B3 causes motor neuropathy: utility of a candidate gene approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A missense mutation in the gene encoding small heat shock protein B3 (HSPB3, also called HSP27, protein 3) was discovered in 2 siblings with an asymmetric axonal motor neuropathy."
    explanation: >-
      Founding report assigning HSPB3 to a dominant-pattern axonal motor
      neuropathy, which is the gene-disease claim this subtype row makes.
  - reference: PMID:20142617
    reference_title: "Mutant small heat shock protein B3 causes motor neuropathy: utility of a candidate gene approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation, HSPB3(R7S), is located in the N-terminal domain and involves the loss of a conserved arginine."
    explanation: >-
      Locates the founding allele in the N-terminal domain, which is what
      distinguishes it from the alpha-crystallin-domain allele reported later.
  - reference: PMID:28018906
    reference_title: "Chaperonopathies: Spotlight on Hereditary Motor Neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At present, only one family is thought to carry clinical mutations in the HSPB3/HSPL27 gene: a missense mutation c.21G>T (p.R7S) described in two affected sisters who suffer from dHMN (dHMN2C)"
    explanation: >-
      Review naming the entity dHMN2C and recording how narrow the evidence base
      was, which is the reason this is a subtype row rather than its own entry.
  - reference: PMID:29341343
    reference_title: "Small heat shock protein B3 (HSPB3) mutation in an axonal Charcot-Marie-Tooth disease family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a heterozygous mutation (c.352T>C, p.Tyr118His) in the HSPB3 from a Charcot-Marie-Tooth disease type 2 (CMT2) family by the method of targeted next generation sequencing."
    explanation: >-
      Second reported HSPB3 family; the allele is heterozygous, and the family was
      classified as axonal CMT2 rather than dHMN.
- name: dHMN-TRPV4
  display_name: Scapuloperoneal / congenital distal SMA (TRPV4-related)
  subtype_term:
    preferred_term: neuronopathy, distal hereditary motor, autosomal dominant 8
    term:
      id: MONDO:0010839
      label: neuronopathy, distal hereditary motor, autosomal dominant 8
  genes:
  - preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  description: >
    Autosomal dominant congenital distal SMA, scapuloperoneal SMA, and
    HMSN2C caused by heterozygous TRPV4 missense mutations affecting the
    intracellular N-terminal ankyrin domain, with reduced surface localization
    of the mutant calcium-permeable cation channel.
  evidence:
  - reference: PMID:20037588
    reference_title: "Alterations in the ankyrin domain of TRPV4 cause congenital distal SMA, scapuloperoneal SMA and HMSN2C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report that mutations in the TRPV4 gene cause congenital distal SMA, scapuloperoneal SMA, HMSN 2C. We identified three missense substitutions (R269H, R315W and R316C) affecting the intracellular N-terminal ankyrin domain of the TRPV4 ion channel in five families."
    explanation: Establishes heterozygous TRPV4 ankyrin-domain mutations as a cause of dominant distal/scapuloperoneal SMA.
- name: dHMN-FBXO38
  display_name: dHMN type 2D / HMND6 (FBXO38-related)
  subtype_term:
    preferred_term: neuronopathy, distal hereditary motor, type 2D
    term:
      id: MONDO:0014259
      label: neuronopathy, distal hereditary motor, type 2D
  genes:
  - preferred_term: FBXO38
    term:
      id: hgnc:28844
      label: FBXO38
  description: >
    Autosomal dominant distal SMA presenting with calf weakness, caused by the
    heterozygous FBXO38 missense substitution p.Cys206Arg in two unrelated
    families. FBXO38 is a coactivator of the transcription factor KLF7, and the
    substitution leaves FBXO38 correctly localised while impairing KLF7-driven
    transcription of genes needed for axon outgrowth and repair - a
    transcriptional rather than a chaperone or transport lesion, which is why
    this row records its own mechanism instead of deferring to the proteostasis
    chain that covers the small heat-shock protein subtypes.

    Calf-predominant weakness at onset is the distinguishing clinical feature
    against the foot-drop-first presentation the rest of this entry describes.
    PMID:31420593 later reported a homozygous FBXO38 variant, p.Arg526Gln, in the
    child of consanguineous parents with a congenital mild neuronopathy, and
    proposed a loss-of-function mechanism, so dominant and recessive alleles are
    both on record for this gene. That report is named rather than cited as
    evidence because the entity this row curates is the dominant one; the dominant
    allele is what defines it.
  evidence:
  - reference: PMID:24207122
    reference_title: "A dominant mutation in FBXO38 causes distal spinal muscular atrophy with calf predominance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two unrelated families affected by a distinct form of autosomal-dominant distal SMA initially manifesting with calf weakness, we identified by genetic linkage analysis and exome sequencing a heterozygous missense mutation, c.616T>C (p.Cys206Arg), in F-box protein 38 (FBXO38)."
    explanation: >-
      Establishes the gene, the single dominant allele, the two-family basis, and
      the calf-predominant onset that distinguishes this subtype.
  - reference: PMID:24207122
    reference_title: "A dominant mutation in FBXO38 causes distal spinal muscular atrophy with calf predominance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This transcriptional dysregulation was associated with an impairment of neurite outgrowth in primary motor neurons."
    explanation: >-
      The functional consequence in the cell type this entry is about, and the
      reason the mechanism is recorded as transcriptional dysregulation of axon
      outgrowth rather than as a proteostasis defect.
- name: dHMN-EMILIN1
  display_name: dHMN, autosomal dominant 10 / HMND10 (EMILIN1-related)
  subtype_term:
    preferred_term: neuronopathy, distal hereditary motor, autosomal dominant 10
    term:
      id: MONDO:0859300
      label: neuronopathy, distal hereditary motor, autosomal dominant 10
  genes:
  - preferred_term: EMILIN1
    term:
      id: hgnc:19880
      label: EMILIN1
  description: >
    Autosomal dominant distal motor neuropathy attributed to the heterozygous
    EMILIN1 substitution p.R250C in the coiled-coil region, reported in four
    affected members of one family. EMILIN-1 is an extracellular matrix
    glycoprotein, so this is the only subtype on this entry whose lesion sits
    outside the motor neuron: the reported defect is reduced extracellular
    deposition of EMILIN-1 in a disorganised fibre network, with EMILIN-1
    demonstrated in nerve structures on muscle biopsy.

    Two reasons this row is scoped narrowly. First, the evidence base is one
    family for the motor-predominant phenotype, plus an earlier single family in
    which an EMILIN1 missense variant was associated with an autosomal dominant
    connective tissue disorder and a motor-sensory neuropathy - so a neuropathy
    has been reported twice, in two different clinical contexts, in two
    families. Second,
    the one ClinGen Gene-Disease Validity assertion for EMILIN1 in the current
    table (file created 2026-09-25) is `Definitive` for arterial
    tortuosity-bone fragility syndrome (MONDO:0971179) with autosomal recessive
    inheritance - a different disease and a different inheritance mode from the
    one MONDO's HMND10 edge asserts, so that Definitive classification supports
    nothing about this subtype. ClinGen has not classified EMILIN1 against any
    neuropathy.
  evidence:
  - reference: PMID:31978608
    reference_title: Distal motor neuropathy associated with novel EMILIN1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "located in the coiled coil forming region of the protein, in four affected members of an autosomal dominant family presenting a distal motor neuropathy phenotype"
    explanation: >-
      The gene-disease claim this subtype rests on: four affected members of one
      autosomal dominant family with a distal motor neuropathy phenotype, and a
      variant in the coiled-coil region. The quoted span starts mid-sentence
      because the source writes the allele as `c.748C>T [p.R250C]`, and the
      reference validator strips bracketed glosses from a snippet before matching
      while the cached source keeps them, so no quotation spanning that bracket
      can verify. The allele and the gene are recorded in the description and in
      the `EMILIN1` `genetic:` record instead.
  - reference: PMID:31978608
    reference_title: Distal motor neuropathy associated with novel EMILIN1 mutation.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, a missense mutation in the EMILIN1 gene has been associated with autosomal dominant connective tissue disorder and motor-sensory neuropathy in a single family."
    explanation: >-
      The earlier of the two reported families, which had a connective-tissue
      disorder with sensorimotor neuropathy rather than the motor-predominant
      phenotype of this subtype. Marked BACKGROUND because the citing paper is
      restating that prior report rather than presenting it as its own result.
  - reference: PMID:31978608
    reference_title: Distal motor neuropathy associated with novel EMILIN1 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Downregulation of emilin1a in zebrafish displayed developmental delay, locomotion defects, and abnormal axonal arborization from spinal cord motor neurons."
    explanation: >-
      The animal support, and specifically that the axonal defect is in spinal
      cord motor neurons, which is what makes an extracellular matrix gene
      relevant to a lower motor neuron disease.
- name: dHMN-SPTAN1
  display_name: dHMN, autosomal dominant 11 / HMND11 (SPTAN1-related)
  subtype_term:
    preferred_term: neuronopathy, distal hereditary motor, autosomal dominant 11
    term:
      id: MONDO:0957875
      label: neuronopathy, distal hereditary motor, autosomal dominant 11
  genes:
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  description: >
    Juvenile-onset autosomal dominant hereditary motor neuropathy caused by
    heterozygous nonsense variants in SPTAN1, the alpha-II spectrin gene, in
    three separate families. The mutant transcript is degraded by
    nonsense-mediated decay and patient cells carry reduced protein, so the
    mechanism is haploinsufficiency of a cytoskeletal scaffolding protein.
    Penetrance was variable in two of the three families and severity differed
    widely between affected individuals.

    The allelic mechanism is what separates this entity from the other SPTAN1
    disease. ClinGen classifies SPTAN1 `Definitive` for genetic developmental
    and epileptic encephalopathy (MONDO:0100062, autosomal dominant; current
    table, file created 2026-09-25) and has no assertion against any neuropathy;
    that encephalopathy is curated in this knowledge base as
    `SPTAN1-Related_Developmental_and_Epileptic_Encephalopathy`. The founding
    motor-neuropathy report draws the distinction itself: the epilepsy
    phenotypes were attributed to dominant-negative alleles, whereas the
    neuropathy families carry nonsense alleles that are removed by
    nonsense-mediated decay. A Definitive gene-disease assertion is therefore
    not transferable between the two, and this row does not borrow it.
  evidence:
  - reference: PMID:31332438
    reference_title: "Nonsense mutations in alpha-II spectrin in three families with juvenile onset hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified patients with heterozygous nonsense mutations in the αII-spectrin gene, SPTAN1, in three separate dominant hereditary motor neuropathy families via next-generation sequencing."
    explanation: >-
      Establishes the gene, the allele class and the three-family dominant basis
      for this subtype.
  - reference: PMID:31332438
    reference_title: "Nonsense mutations in alpha-II spectrin in three families with juvenile onset hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant mRNA containing nonsense mutations is broken down by nonsense-mediated decay and leads to reduced protein levels in patient cells."
    explanation: >-
      Supports haploinsufficiency as the mechanism, which is the point on which
      this entity differs from the dominant-negative SPTAN1 encephalopathy.
  - reference: PMID:31332438
    reference_title: "Nonsense mutations in alpha-II spectrin in three families with juvenile onset hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Previously, dominant-negative αII-spectrin gene mutations were described as causal in a spectrum of epilepsy phenotypes."
    explanation: >-
      The founding report's own statement of the contrast with the SPTAN1
      encephalopathy, which is why ClinGen's Definitive assertion for that
      disease is not evidence for this one.
- name: dHMN-BAG3
  display_name: dHMN, autosomal dominant 15 / HMND15 (BAG3-related)
  subtype_term:
    preferred_term: neuronopathy, distal hereditary motor, autosomal dominant 15
    term:
      id: MONDO:0976226
      label: neuronopathy, distal hereditary motor, autosomal dominant 15
  genes:
  - preferred_term: BAG3
    term:
      id: hgnc:939
      label: BAG3
  description: >
    Adult-onset autosomal dominant distal hereditary motor neuronopathy caused
    by a heterozygous truncating BAG3 variant, reported in one family of eight
    affected individuals with incomplete penetrance in women. BAG3's role as the
    co-chaperone of chaperone-assisted selective autophagy and as the binding
    partner of HSPB8 is curated with its sources in
    `Charcot-Marie-Tooth_Disease_Axonal_Type_2JJ` and in
    `Distal_Hereditary_Motor_Neuronopathy_Type_2A` rather than restated here;
    taking it from there, the lesion sits on the same proteostasis machinery as
    the small heat-shock protein subtypes of this entry.

    This row is deliberately thin, and points elsewhere rather than duplicating.
    The phenotype, its contrast with the sensory-predominant BAG3 neuropathy, and
    the variant-class-to-phenotype correlation across BAG3's disease spectrum are
    curated in `Charcot-Marie-Tooth_Disease_Axonal_Type_2JJ` (MONDO:0976227 /
    OMIM:621095), which is the deeper treatment. The row exists here because
    MONDO makes HMND15 (MONDO:0976226 / OMIM:621094) a direct child of this
    entry's own disease term and nothing in the knowledge base bound it, so the
    gene-defined subtype had no home. ClinGen classifies BAG3 `Definitive` for
    myofibrillar myopathy and for dilated cardiomyopathy 1HH (current table, file
    created 2026-09-25) and has no assertion against any neuropathy, so neither
    classification supports this row.
  evidence:
  - reference: PMID:37907725
    reference_title: "Distal hereditary motor neuronopathy as a new phenotype associated with variants in BAG3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an autosomal dominant adult-onset distal hereditary motor
      neuronopathy with incomplete penetrance in women as a new phenotype related
      to a truncating variant in the BAG3 gene.
    explanation: >-
      Establishes the entity, its inheritance and the sex-dependent penetrance
      that this subtype row asserts.
pathophysiology:
- name: Motor Neuron and Distal Axon Gene Defect
  description: >
    Heterozygous (dominant) mutations in motor-neuron and distal-axon genes —
    small heat-shock protein chaperones (HSPB1, HSPB8), the ER protein seipin
    (BSCL2), glycyl-tRNA synthetase (GARS1), the dynactin axonal-transport
    adaptor (DCTN1), the choline transporter (SLC5A7), and the TRPV4 cation
    channel — impair the homeostatic functions that lower motor neurons require
    to build and maintain their long peripheral axons. Recurrent molecular
    consequences are protein misfolding/aggregation, impaired axonal transport,
    and defective tRNA charging.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  genes:
  - preferred_term: HSPB1
    term:
      id: hgnc:5246
      label: HSPB1
  - preferred_term: HSPB3
    term:
      id: hgnc:5248
      label: HSPB3
  - preferred_term: BSCL2
    term:
      id: hgnc:15832
      label: BSCL2
  - preferred_term: GARS1
    term:
      id: hgnc:4162
      label: GARS1
  - preferred_term: DCTN1
    term:
      id: hgnc:2711
      label: DCTN1
  - preferred_term: SLC5A7
    term:
      id: hgnc:14025
      label: SLC5A7
  - preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  - preferred_term: FBXO38
    term:
      id: hgnc:28844
      label: FBXO38
  - preferred_term: EMILIN1
    term:
      id: hgnc:19880
      label: EMILIN1
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  - preferred_term: BAG3
    term:
      id: hgnc:939
      label: BAG3
  biological_processes:
  - preferred_term: Protein folding (chaperone function)
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  notes: >
    This is the genetic-lesion node of the entry, and its `genes:` list binds
    every gene the entry curates as a dominant cause. The claim it makes of each
    of them is the one each founding report makes: a heterozygous variant impairs
    something lower motor neurons need in order to build and maintain their long
    peripheral axons. It does not claim they act by the same molecular route, and
    they do not - the small heat-shock proteins and seipin act through protein
    quality control, dynactin and glycyl-tRNA synthetase through axonal transport
    and local translation, SLC5A7 at the presynaptic terminal of the
    neuromuscular junction, TRPV4 through a calcium-permeable channel, FBXO38
    through KLF7-dependent transcription of axon-outgrowth genes, SPTAN1 through
    the axonal spectrin cytoskeleton, and BAG3 through chaperone-assisted
    selective autophagy. Each route is stated in that gene's `genetic:` record
    and subtype row.

    The bound `protein folding` process term describes the chaperone subset only
    (HSPB1, HSPB3, BSCL2, BAG3) and is not asserted of the other seven genes; no
    single ontology term covers what this node's eleven genes have in common.

    EMILIN1 is the one binding that needs an explicit caveat. It encodes an
    extracellular matrix glycoprotein, so its lesion is outside the motor neuron
    rather than inside it, and the node's bound cell type should not be read as
    locating the EMILIN1 defect in that cell. It is bound here because the
    reported consequence is a motor-axonal one - abnormal axonal arborization from
    spinal cord motor neurons in the zebrafish knockdown - which is what this
    node describes.
  evidence:
  - reference: PMID:21902652
    reference_title: "Molecular genetics and mechanisms of disease in distal hereditary motor neuropathies: insights directing future genetic studies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mutated genes identified to-date in dHMN include HSPB1, HSPB8, HSPB3, DCTN1, GARS, PLEKHG5, BSCL2, SETX, IGHMBP2, ATP7A and"
    explanation: >-
      Lists the dominant dHMN genes whose products converge on motor-neuron axon
      biology. Covers the HSPB1, HSPB3, DCTN1, GARS1 and BSCL2 bindings at this
      node; the remaining six genes are covered by the items below.
  - reference: PMID:23141292
    reference_title: "Defective presynaptic choline transport underlies hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using linkage analysis and whole-exome sequencing of DNA samples from subjects with distal hereditary motor neuropathy type VII, we identified a mutation in SLC5A7, which encodes the presynaptic choline transporter (CHT)"
    explanation: The basis for binding SLC5A7 at this node.
  - reference: PMID:20037588
    reference_title: "Alterations in the ankyrin domain of TRPV4 cause congenital distal SMA, scapuloperoneal SMA and HMSN2C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three missense substitutions (R269H, R315W and R316C) affecting the intracellular N-terminal ankyrin domain of the TRPV4 ion channel in five families."
    explanation: The basis for binding TRPV4 at this node.
  - reference: PMID:24207122
    reference_title: "A dominant mutation in FBXO38 causes distal spinal muscular atrophy with calf predominance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In two unrelated families affected by a distinct form of autosomal-dominant distal SMA initially manifesting with calf weakness, we identified by genetic linkage analysis and exome sequencing a heterozygous missense mutation, c.616T>C (p.Cys206Arg), in F-box protein 38 (FBXO38)."
    explanation: The basis for binding FBXO38 at this node.
  - reference: PMID:31978608
    reference_title: Distal motor neuropathy associated with novel EMILIN1 mutation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Downregulation of emilin1a in zebrafish displayed developmental delay, locomotion defects, and abnormal axonal arborization from spinal cord motor neurons."
    explanation: >-
      The basis for binding EMILIN1 at this node, and specifically for binding an
      extracellular matrix gene at a motor-neuron node: the reported consequence
      is abnormal axonal arborization from spinal cord motor neurons.
  - reference: PMID:31332438
    reference_title: "Nonsense mutations in alpha-II spectrin in three families with juvenile onset hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified patients with heterozygous nonsense mutations in the αII-spectrin gene, SPTAN1, in three separate dominant hereditary motor neuropathy families via next-generation sequencing."
    explanation: The basis for binding SPTAN1 at this node.
  - reference: PMID:37907725
    reference_title: "Distal hereditary motor neuronopathy as a new phenotype associated with variants in BAG3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an autosomal dominant adult-onset distal hereditary motor
      neuronopathy with incomplete penetrance in women as a new phenotype related
      to a truncating variant in the BAG3 gene.
    explanation: The basis for binding BAG3 at this node.
  downstream:
  - target: Disrupted Proteostasis and Axonal Transport
    description: >
      Mutant chaperone, ER, synthetase, and dynactin proteins disturb protein
      quality control and axonal transport within the motor neuron.
    causal_link_type: DIRECT
- name: Disrupted Proteostasis and Axonal Transport
  description: >
    Mutant small heat-shock proteins (HSPB1, HSPB8) and seipin (BSCL2) form
    intracellular aggregates and impair protein quality control, while mutant
    dynactin (DCTN1) and tRNA-synthetase (GARS1) defects compromise axonal
    transport and local translation — collectively undermining maintenance of
    the long motor axon.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  genes:
  - preferred_term: HSPB1
    term:
      id: hgnc:5246
      label: HSPB1
  - preferred_term: BSCL2
    term:
      id: hgnc:15832
      label: BSCL2
  - preferred_term: DCTN1
    term:
      id: hgnc:2711
      label: DCTN1
  biological_processes:
  - preferred_term: Axonal transport
    term:
      id: GO:0098930
      label: axonal transport
    modifier: DECREASED
  notes: >
    Only the three genes for which this node's own cited evidence demonstrates
    the mechanistic step are bound here: mutant seipin aggregating (BSCL2),
    mutant dynactin losing microtubule binding (DCTN1), and mutant HSP27
    disrupting assembly of a client cytoskeletal protein (HSPB1). HSPB3, GARS1
    and BAG3 are named in this node's description on the strength of their
    protein family and known molecular function, but the evidence this entry
    cites for them establishes the gene-disease relationship rather than this
    step, so they are bound at the genetic-lesion node only. Closing that gap
    needs functional citations for each, not a broader reading of the ones
    already here.
  evidence:
  - reference: PMID:14981520
    reference_title: "Heterozygous missense mutations in BSCL2 are associated with distal hereditary motor neuropathy and Silver syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The amino acid substitutions N88S and S90L affect glycosylation of seipin and result in aggregate formation leading to neurodegeneration."
    explanation: Mutant seipin aggregation exemplifies the proteostasis defect driving motor-neuron degeneration.
  - reference: PMID:12627231
    reference_title: "Mutant dynactin in motor neuron disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Binding assays show decreased binding of the mutant protein to microtubules. Our results show that dysfunction of dynactin-mediated transport can lead to human motor neuron disease."
    explanation: Mutant dynactin reduces microtubule binding, impairing axonal transport.
  - reference: PMID:15122254
    reference_title: "Mutant small heat-shock protein 27 causes axonal Charcot-Marie-Tooth disease and distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cotransfection of neurofilament light chain (NEFL) and mutant HSPB1 resulted in altered neurofilament assembly in cells devoid of cytoplasmic intermediate filaments."
    explanation: >-
      The basis for binding HSPB1 at this node: the mutant chaperone fails at a
      client protein whose assembly the axonal cytoskeleton depends on, which is
      the protein-quality-control step this node describes.
  downstream:
  - target: Length-Dependent Distal Motor Axonopathy
    description: >
      Impaired proteostasis and axonal transport preferentially compromise the
      longest peripheral motor axons, producing a length-dependent distal motor
      axonopathy.
    causal_link_type: DIRECT
- name: Length-Dependent Distal Motor Axonopathy
  description: >
    Progressive degeneration of the distal portions of the longest motor axons
    with chronic motor denervation, manifest as neurogenic changes on EMG and a
    motor axonal pattern on nerve conduction studies with preserved sensory
    responses.
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Anterograde axonal transport
    term:
      id: GO:0008089
      label: anterograde axonal transport
    modifier: DECREASED
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distal hereditary motor neuropathies are pure motor disorders of the peripheral nervous system resulting in severe atrophy and wasting of distal limb muscles."
    explanation: Documents the motor-predominant, distal, length-dependent axonopathy with sensory sparing.
  downstream:
  - target: Distal Muscle Weakness and Wasting
    description: >
      Chronic motor denervation of distal muscles produces progressive distal
      weakness and atrophy, beginning in the lower (or, for some subtypes, upper)
      limbs.
    causal_link_type: DIRECT
- name: Distal Muscle Weakness and Wasting
  description: >
    Clinically evident distal limb weakness and muscle atrophy, typically
    beginning in the feet and lower legs with foot drop and pes cavus, without
    prominent sensory loss; some subtypes (BSCL2/Silver syndrome, GARS1/CMT2D)
    have upper-limb predominant hand amyotrophy, and TRPV4-related forms have a
    scapuloperoneal distribution.
  evidence:
  - reference: PMID:15122253
    reference_title: "Hot-spot residue in small heat-shock protein 22 causes distal motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pure motor disorders of the peripheral nervous system resulting in severe atrophy and wasting of distal limb muscles"
    explanation: Describes the distal weakness/wasting endpoint of dominant dHMN.

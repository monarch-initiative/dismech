treatments:
- name: Intravenous Aciclovir
  description: >-
    Intravenous aciclovir is the standard of care for herpes simplex
    encephalitis. Despite antiviral therapy, mortality and morbidity remain
    high; early initiation is recommended as delayed treatment worsens outcomes.
  therapeutic_modality: SMALL_MOLECULE

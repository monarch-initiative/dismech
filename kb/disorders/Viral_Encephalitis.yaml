datasets:
- accession: geo:GSE163005
  title: Characterizing cerebrospinal fluid immunity in neurological manifestations of COVID-19
  description: Patients suffering from Coronavirus disease 2019 (COVID-19) can develop neurological sequelae, such as headache, neuroinflammatory or cerebrovascular disease. These conditions - here termed Neuro-COVID - are more frequent in patients with severe COVID-19. To understand the etiology of these neurological sequelae, we utilized single-cell sequencing and examined the immune cell profiles from the cerebrospinal fluid (CSF) of Neuro-COVID patients compared to patients with non-inflammatory and autoimmune neurological diseases or with viral encephalitis. The CSF of Neuro-COVID patients exhibited an expansion of dedifferentiated monocytes and of exhausted CD4+ T cells.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 38
  publication: PMID:33382973
  notes: Identified by GEO DataSets index search for Viral Encephalitis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE301690
  title: MAVS signaling of long-lived brain-resident myeloid cells is needed during viral encephalitis to adjust the transcriptome of CNS-infiltrating CD8+ T cells II
  description: Neurotropic viruses like vesicular stomatitis virus (VSV) can infect the central nervous system (CNS) through the olfactory route. Following intranasal instillation, VSV moves along the axons of olfactory sensory neurons to the olfactory bulb. While within the olfactory bulb the spread of the virus is controlled by microglia activation and the recruitment of peripheral leukocytes, some of the underlying mechanisms remain unknown. To investigate these mechanisms, we used mice with conditional deletions of the mitochondrial antiviral-signaling protein (MAVS), an adaptor for RIG-I-like receptor (RLR)-signaling.

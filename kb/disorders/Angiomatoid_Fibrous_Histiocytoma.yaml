histopathology:
- name: Angiomatoid fibrous histiocytoma, classic pattern
  description: >-
    Nodules of ovoid to spindle histiocytoid cells with blood-filled cystic
    cavities, a fibrous pseudocapsule, and a surrounding dense lymphoplasmacytic
    infiltrate. Immunohistochemistry shows desmin, EMA, and CD99 in a substantial
    fraction of cases; S100, HMB45, and MITF are negative (unlike clear cell
    sarcoma). ALK is frequently expressed without ALK rearrangement, a diagnostic
    pitfall.
  finding_term:
    preferred_term: angiomatoid fibrous histiocytoma histology (ovoid/spindle cells, pseudovascular spaces, lymphoplasmacytic cuff)
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:25927151
    reference_title: "Angiomatoid fibrous histiocytoma: the current status of pathology and genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nodular distributions of ovoid and spindle cells with blood-filled cystic cavities and a surrounding dense lymphoplasmacytic infiltrate"
    explanation: The defining histologic triad.
  - reference: PMID:29877921
    reference_title: "ALK Expression in Angiomatoid Fibrous Histiocytoma: A Potential Diagnostic Pitfall."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFH with positive ALK IHC showed no ALK gene rearrangement by FISH (0/8)"
    explanation: Documents ALK immunoexpression without ALK rearrangement as a pitfall.
- name: Morphologic variants
  description: >-
    AFH has a broad morphologic spectrum - myxoid, reticular, pleomorphic,
    sclerosing (schwannoma-like), and solid patterns lacking pseudoangiomatoid
    spaces - which can obscure the diagnosis and makes molecular confirmation
    important.
  finding_term:
    preferred_term: variant AFH histomorphology (myxoid, reticular, pleomorphic, sclerosing, solid)
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:24043718
    reference_title: "Angiomatoid fibrous histiocytoma: clinicopathological and molecular characterisation with emphasis on variant histomorphology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular testing is diagnostic of variant AFHs displaying diverse histomorphological alterations in the architectural patterns, cytomorphology and extracellular matrix."
    explanation: Documents the diverse variant histomorphology of AFH.
genetic:
- name: EWSR1
  gene_term:
    preferred_term: EWSR1
    term:
      id: hgnc:3508
      label: EWSR1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    The 5' partner in the great majority of AFH fusions (EWSR1::CREB1,
    EWSR1::ATF1, EWSR1::CREM). EWSR1 rearrangement is the usual diagnostic FISH
    target, though FISH does not identify the 3' partner and misses a minority of
    cases.
  evidence:
  - reference: PMID:19801966
    reference_title: "Utility of FISH in the diagnosis of angiomatoid fibrous histiocytoma: a series of 18 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "13 of 17 (76%) cases of angiomatoid fibrous histiocytoma harbored rearrangements of EWSR1; rearrangements of FUS were not detected in any of the cases."
    explanation: Establishes EWSR1 as the dominant rearranged gene in AFH.
- name: CREB1
  gene_term:
    preferred_term: CREB1
    term:
      id: hgnc:2345
      label: CREB1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    The most frequent 3' CREB-family partner. The CREB1 bZIP domain is retained in
    the fusion and binds the CRE site in the IL6 promoter, linking the driver to
    the paraneoplastic IL-6 syndrome.
  evidence:
  - reference: PMID:17724745
    reference_title: "EWSR1-CREB1 is the predominant gene fusion in angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report for the first time the presence of EWSR1-CREB1 in AFH, which now appears to be the most frequent gene fusion in this tumor."
    explanation: Identifies CREB1 as the predominant fusion partner.
- name: ATF1
  gene_term:
    preferred_term: ATF1
    term:
      id: hgnc:783
      label: ATF1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: A minority 3' CREB-family partner (EWSR1::ATF1, FUS::ATF1), enriched at extrasomatic sites.
  evidence:
  - reference: PMID:18094413
    reference_title: "EWSR1-CREB1 and EWSR1-ATF1 fusion genes in angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen cases showed rearrangements of both EWSR1 and CREB1, whereas one case showed the rearrangement of both EWSR1 and ATF1."
    explanation: Documents EWSR1-ATF1 as the minority fusion alongside EWSR1-CREB1.
- name: FUS
  gene_term:
    preferred_term: FUS
    term:
      id: hgnc:4010
      label: FUS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: A rare alternative 5' FET-family partner, interchangeable with EWSR1 (FUS::ATF1).
  evidence:
  - reference: PMID:11063792
    reference_title: "Genetic characterization of angiomatoid fibrous histiocytoma identifies fusion of the FUS and ATF-1 genes induced by a chromosomal translocation involving bands 12q13 and 16p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the FUS (also known as TLS) gene from 16p11 combined with the ATF-1 gene from 12q13 to generate a chimeric FUS/ATF-1."
    explanation: Identifies FUS as the rare alternative 5' partner.
- name: CREM
  gene_term:
    preferred_term: CREM
    term:
      id: hgnc:2352
      label: CREM
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: An uncommon 3' CREB-family partner, enriched in acral AFH and in intracranial FET-CREB tumors.
  evidence:
  - reference: PMID:40748380
    reference_title: "Angiomatoid fibrous histiocytoma occurring at distal/acral extremity sites: clinicopathological and molecular study of 26 cases highlighting frequent myxoid histology and site-dependent genotypic variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the fusions partner was CREB1 in 6 cases (50%), CREM in 4 tumors (33%), ATF1 in one tumor (8%) and PBX3 (8%) in another tumor."
    explanation: Establishes CREM as a recurrent partner at acral sites.
progression:
- phase: Localized disease
  age_range: Children and young adults (median age about 13-14 years; range 2-76 years)
  notes: >-
    Usually an insidiously enlarging, well-circumscribed subcutaneous mass, most
    often on the extremities. Cured by complete excision in the great majority.
  evidence:
  - reference: PMID:228836
    reference_title: "Angiomatoid malignant fibrous histiocytoma: a distinct fibrohistiocytic tumor of children and young adults simulating a vascular neoplasm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an unusual fibrohistiocytic sarcoma which occurred primarily in the extremities of young individuals between the ages of 5 and 25 years (median 13 years)."
    explanation: Establishes the typical age and site of localized disease.
- phase: Local recurrence
  notes: >-
    Local recurrence in roughly 2-15% of cases, associated with incomplete initial
    excision and with irregular tumor border and head and neck location; usually
    cured by re-excision.
  evidence:
  - reference: PMID:2174650
    reference_title: "Angiomatoid malignant fibrous histiocytoma. A follow-up study of 108 cases with evaluation of possible histologic predictors of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Local recurrences developed in 11 patients (12%), all of whom were cured by re-excision. The initial excision in all patients developing local recurrence appeared to be incomplete."
    explanation: Quantifies recurrence and ties it to incomplete excision.
- phase: Metastasis
  notes: >-
    Metastasis in about 1%, first to regional nodes and rarely to lung; it can
    appear many years after the primary, so long-term follow-up is warranted.
  evidence:
  - reference: PMID:25757019
    reference_title: "Characterization of metastatic angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The time of appearance of metastases varied substantially and was reported 5 months to 16 years after primary tumor resection."
    explanation: Documents the wide window to metastasis supporting long-term follow-up.
treatments:
- name: Wide local excision
  description: >-
    Complete surgical resection with clear margins is the first-line, usually
    curative treatment. Incomplete excision is the main driver of local
    recurrence, so an unplanned or marginal excision should be avoided.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: wide local excision
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Multinodular Tumor Architecture
    treatment_effect: INHIBITS
    description: Removal of the tumor mass; the definitive treatment.
  evidence:
  - reference: PMID:2174650
    reference_title: "Angiomatoid malignant fibrous histiocytoma. A follow-up study of 108 cases with evaluation of possible histologic predictors of outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Local recurrences developed in 11 patients (12%), all of whom were cured by re-excision. The initial excision in all patients developing local recurrence appeared to be incomplete."
    explanation: Supports complete excision as curative and incomplete excision as the recurrence risk.
- name: Chemotherapy
  description: >-
    Anthracycline- or ifosfamide-based sarcoma chemotherapy for unresectable or
    metastatic disease. Sustained responses have been reported in a small series.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: doxorubicin
      term:
        id: CHEBI:28748
        label: doxorubicin
  target_mechanisms:
  - target: Metastatic Dissemination
    treatment_effect: INHIBITS
    description: Cytotoxic control of unresectable or metastatic disease.
  evidence:
  - reference: PMID:36716049
    reference_title: "Evidence of Chemoresponsiveness in Unresectable Metastatic Angiomatoid Fibrous Histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present 3 patients with metastatic AFH who demonstrated a sustained response to chemotherapy; including one who achieved complete remission with cryoablation."
    explanation: Reports sustained chemotherapy responses in metastatic AFH.
- name: Tocilizumab
  description: >-
    Anti-IL-6-receptor monoclonal antibody used for the paraneoplastic
    inflammatory syndrome. It reliably controls the systemic inflammation; its
    effect on tumor growth is inconsistent across reports.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: Paraneoplastic Inflammatory Syndrome
    treatment_effect: INHIBITS
    description: IL-6 receptor blockade controls the paraneoplastic inflammatory syndrome.
  evidence:
  - reference: PMID:34221525
    reference_title: "Tocilizumab Controls Paraneoplastic Inflammatory Syndrome but Does Not Suppress Tumor Growth of Angiomatoid Fibrous Histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the inhibition of the IL-6 signaling pathway controlled paraneoplastic inflammatory syndrome (PIS); however, the local recurrent tumor progressed."
    explanation: Supports tocilizumab for the inflammatory syndrome while noting the tumor progressed.
- name: Radiation therapy
  description: Used for unresectable or residual disease; evidence is limited to case-level reports.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  notes: >-
    Radiotherapy in AFH is case-level (unresectable or residual disease) with no
    published series; no quotable primary source was found in the cached
    literature, so this treatment carries no evidence item.
diagnosis:
- name: Molecular confirmation of a FET-CREB fusion
  description: >-
    Diagnosis combines characteristic histology with molecular confirmation.
    EWSR1 (or FUS) break-apart FISH is a common first test but does not identify
    the 3' partner and misses a minority of cases; RT-PCR or targeted RNA
    sequencing identifies the specific fusion and is complementary.
  evidence:
  - reference: PMID:19801966
    reference_title: "Utility of FISH in the diagnosis of angiomatoid fibrous histiocytoma: a series of 18 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study affirms that the rearrangement of EWSR1 is a common genetic event in angiomatoid fibrous histiocytoma, and is thus useful diagnostically."
    explanation: Supports EWSR1 rearrangement detection as a diagnostic tool.
  - reference: PMID:25804255
    reference_title: "Angiomatoid fibrous histiocytoma: comparison of fluorescence in situ hybridization and reverse transcription polymerase chain reaction as adjunct diagnostic modalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cases of AFH can be missed if RT-PCR is not performed in conjunction with FISH"
    explanation: Supports combining RT-PCR with FISH because FISH alone misses cases.
- name: Immunohistochemistry
  description: >-
    Supportive but nonspecific: desmin, EMA, and CD99 are positive in a
    substantial fraction, while S100, HMB45, and MITF are negative (distinguishing
    AFH from clear cell sarcoma). ALK is frequently positive without ALK
    rearrangement.
  evidence:
  - reference: PMID:10571514
    reference_title: "Angiomatoid \"malignant\" fibrous histiocytoma: a clinicopathologic study of 158 cases and further exploration of the myoid phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmin positivity was noted in 51% cases and occurred in both predominantly round cell and spindle cell tumors."
    explanation: Quantifies desmin positivity in the diagnostic immunohistochemical panel.
  - reference: PMID:10571514
    reference_title: "Angiomatoid \"malignant\" fibrous histiocytoma: a clinicopathologic study of 158 cases and further exploration of the myoid phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "negative for CD21, CD35, S100 protein, CD34, keratins 8/18, and lysozyme"
    explanation: Supports the S100-negative and CD34-negative profile that helps separate AFH from its mimics.
differential_diagnoses:
- name: Clear cell sarcoma
  description: >-
    Shares the EWSR1::ATF1 and EWSR1::CREB1 fusions but is melanocytic (S100,
    HMB45, MITF positive) and clinically more aggressive. AFH lacks melanocytic
    markers.
  disease_term:
    preferred_term: clear cell sarcoma
    term:
      id: MONDO:0002926
      label: clear cell sarcoma
  distinguishing_features:
  - Melanocytic marker expression (S100, HMB45, MITF) present in clear cell sarcoma, absent in AFH
  - Clear cell sarcoma is clinically more aggressive with a higher metastatic rate
  evidence:
  - reference: PMID:17724745
    reference_title: "EWSR1-CREB1 is the predominant gene fusion in angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overexpression of genes involved in melanogenesis, such as MITF, GP100, and MET was noted in somatic clear cell sarcomas."
    explanation: >-
      The melanogenesis program distinguishes clear cell sarcoma from AFH, which
      shares the fusions but lacks melanocytic differentiation.
- name: Inflammatory myofibroblastic tumor
  description: >-
    Can be confused with AFH because AFH frequently expresses ALK by
    immunohistochemistry; however, AFH lacks ALK gene rearrangement whereas this
    tumor is ALK-rearranged.
  disease_term:
    preferred_term: inflammatory myofibroblastic tumor
    term:
      id: MONDO:0015798
      label: inflammatory myofibroblastic tumor
  distinguishing_features:
  - ALK immunoexpression occurs in both, but ALK gene rearrangement is present in inflammatory myofibroblastic tumor and absent in AFH
  evidence:
  - reference: PMID:29877921
    reference_title: "ALK Expression in Angiomatoid Fibrous Histiocytoma: A Potential Diagnostic Pitfall."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AFH with positive ALK IHC showed no ALK gene rearrangement by FISH (0/8)"
    explanation: >-
      ALK immunoexpression without ALK rearrangement separates AFH from
      ALK-rearranged inflammatory myofibroblastic tumor.
discussions:
- discussion_id: afh_cell_of_origin
  prompt: What is the cell of origin of angiomatoid fibrous histiocytoma?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FET-CREB Family Gene Fusion
  rationale: >-
    AFH is classified as of uncertain differentiation. A myoid/myofibroblastic
    phenotype (desmin, calponin) is consistent, and the frequent location at sites
    of normal lymphoid tissue has raised a possible relationship to myoid cells of
    lymphoid tissue, but no specific cell of origin has been demonstrated.
  posed_by: "dismech curation (claude_code deep research)"
  posed_date: "2026-10-20T12:30:00Z"
- discussion_id: afh_il6_autocrine_growth
  prompt: Does tumor-derived IL-6 drive AFH tumor growth through an autocrine loop, or only the paraneoplastic syndrome?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Tumor-Derived IL-6 Overproduction
  rationale: >-
    One metastatic case improved on the IL-6 receptor antibody tocilizumab,
    supporting an autocrine growth role, while another case had the inflammatory
    syndrome controlled by tocilizumab yet the tumor progressed, arguing against
    it. The question bears on whether IL-6 blockade is antitumor therapy or only
    symptom control.
  posed_by: "dismech curation (claude_code deep research)"
  posed_date: "2026-10-20T12:30:00Z"
references:
- reference: PMID:25927151
  title: "Angiomatoid fibrous histiocytoma: the current status of pathology and genetics."

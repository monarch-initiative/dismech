name: Angiomatoid Fibrous Histiocytoma
creation_date: "2026-10-20T12:30:00Z"
category: Cancer
description: >-
  Angiomatoid fibrous histiocytoma (AFH) is a rare soft tissue neoplasm of
  intermediate (locally recurring, rarely metastasizing) biological potential and
  uncertain line of differentiation. It usually presents in children and young
  adults as a slowly growing, often painless subcutaneous mass of the extremities
  that is frequently mistaken for a hematoma or hemangioma. Histologically it
  shows nodules of ovoid to spindle histiocytoid cells with blood-filled
  pseudovascular spaces, a fibrous pseudocapsule, and a dense lymphoplasmacytic
  cuff. It is defined by somatic fusions of a FET-family gene (EWSR1, rarely FUS)
  to a CREB-family transcription factor, most often EWSR1::CREB1 and less often
  EWSR1::ATF1, FUS::ATF1, or EWSR1::CREM. A minority of patients develop a
  paraneoplastic inflammatory syndrome (fever, anemia, weight loss, raised
  inflammatory markers) driven by tumor-derived interleukin-6 that resolves after
  resection. Complete surgical excision is usually curative.
synonyms:
- AFH
- angiomatoid malignant fibrous histiocytoma
parents:
- soft tissue neoplasm
notes: >-
  Despite the historical name, the tumor is not of histiocytic or dendritic
  lineage; the WHO places it among tumors of uncertain differentiation. AFH is a
  somatic, translocation-driven neoplasm with no germline predisposition, so no
  GeneReviews chapter applies.
review_notes: >-
  No population incidence or prevalence figure was found in a citable primary
  source, so no prevalence record is given; the commonly repeated "0.3% of soft
  tissue tumors" is textbook-level and unsourced. GeneReviews absence confirmed
  with just check-genereviews (NO_CHAPTER, Bookshelf snapshot 2026-09-10).
  icdo_morphology is deliberately omitted: AFH is ICD-O 8836/1 (intermediate,
  rarely metastasizing) and of uncertain differentiation, and no
  ICDOMorphologyEnum value fits - the nearest, Sarcoma, maps to a malignant /3
  behaviour. Crizotinib is omitted as a treatment: a single durable response in
  ALK-overexpressing metastatic AFH is reported (PMID:35568279) but only abstract
  metadata is available, too thin to curate.
disease_term:
  preferred_term: angiomatoid fibrous histiocytoma
  term:
    id: MONDO:0012809
    label: histiocytoma, Angiomatoid fibrous
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
pathophysiology:
- name: FET-CREB Family Gene Fusion
  description: >-
    The initiating lesion is a somatic chromosomal translocation that joins the 5'
    portion of EWSR1 (or, rarely, FUS) to the 3' portion of a CREB-family
    transcription factor gene. EWSR1::CREB1 from t(2;22)(q33;q12) is the
    predominant fusion; EWSR1::ATF1 from t(12;22)(q13;q12), FUS::ATF1 from
    t(12;16)(q13;p11), and EWSR1::CREM occur in smaller subsets. The cell in which
    the translocation arises has not been identified; the tumor is of uncertain
    differentiation, with a myoid (myofibroblastic) immunophenotype.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
    genes:
    - preferred_term: EWSR1
      term:
        id: hgnc:3508
        label: EWSR1
    - preferred_term: CREB1
      term:
        id: hgnc:2345
        label: CREB1
    - preferred_term: ATF1
      term:
        id: hgnc:783
        label: ATF1
    - preferred_term: FUS
      term:
        id: hgnc:4010
        label: FUS
    - preferred_term: CREM
      term:
        id: hgnc:2352
        label: CREM
    description: >-
      Acquired in-frame fusion of a FET-family N-terminal domain to the bZIP
      DNA-binding domain of CREB1, ATF1, or CREM, producing a chimeric
      transcription factor.
  cell_types:
  - preferred_term: mesenchymal cell of uncertain differentiation
    term:
      id: CL:0008019
      label: mesenchymal cell
  molecular_functions:
  - preferred_term: aberrant DNA-binding transcription factor activity (chimeric FET-CREB protein)
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  notes: >-
    The cell type is bound only at the broad mesenchymal level because no specific
    cell of origin has been established. A myoid phenotype is supported by desmin
    and calponin expression, and the AFIP series raised a possible relationship to
    myoid cells of lymphoid tissue, but neither is a demonstrated origin.
  evidence:
  - reference: PMID:17724745
    reference_title: "EWSR1-CREB1 is the predominant gene fusion in angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By RT-PCR, eight out of nine tumors showed the presence of the EWSR1-CREB1 fusion, while one had an EWSR1-ATF1 transcript."
    explanation: Establishes EWSR1-CREB1 as the predominant fusion with EWSR1-ATF1 in a minority.
  - reference: PMID:18094413
    reference_title: "EWSR1-CREB1 and EWSR1-ATF1 fusion genes in angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirteen cases showed rearrangements of both EWSR1 and CREB1, whereas one case showed the rearrangement of both EWSR1 and ATF1."
    explanation: Independent 14-case FISH series confirming EWSR1-CREB1 predominance.
  - reference: PMID:11063792
    reference_title: "Genetic characterization of angiomatoid fibrous histiocytoma identifies fusion of the FUS and ATF-1 genes induced by a chromosomal translocation involving bands 12q13 and 16p11."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the FUS (also known as TLS) gene from 16p11 combined with the ATF-1 gene from 12q13 to generate a chimeric FUS/ATF-1."
    explanation: First molecular characterization of an AFH, identifying the FUS-ATF1 fusion.
  - reference: PMID:40748380
    reference_title: "Angiomatoid fibrous histiocytoma occurring at distal/acral extremity sites: clinicopathological and molecular study of 26 cases highlighting frequent myxoid histology and site-dependent genotypic variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the fusions partner was CREB1 in 6 cases (50%), CREM in 4 tumors (33%), ATF1 in one tumor (8%) and PBX3 (8%) in another tumor."
    explanation: Establishes CREM as a recurrent fusion partner, enriched at acral sites.
  downstream:
  - target: Constitutive CRE-Dependent Transcription
    causal_link_type: DIRECT
    description: >-
      The chimeric protein retains the CREB-family bZIP DNA-binding domain while
      replacing the cAMP-responsive, kinase-inducible regulatory domain with the
      FET domain.
    evidence:
    - reference: PMID:8552387
      reference_title: "The EWS-ATF-1 gene involved in malignant melanoma of soft parts with t(12;22) chromosome translocation, encodes a constitutive transcriptional activator."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "EWS-ATF-1 binds weakly to DNA in vitro but functions as an efficient constitutive transcriptional activator unlike the normal ATF-1 which needs to be induced with cAMP."
      explanation: >-
        Demonstrates the constitutive, cAMP-independent transactivation of the
        EWS-ATF1 fusion; shown in the clear cell sarcoma context and inferred for
        the related AFH fusions.
- name: Constitutive CRE-Dependent Transcription
  description: >-
    The fusion protein acts as a constitutive activator of CRE-driven
    transcription that no longer requires cAMP induction, deregulating a
    lineage-dependent gene program. In mesenchymal precursors this drives
    neoplastic proliferation; because the IL6 promoter carries a CRE site, CREB1
    fusions also drive IL-6 transcription.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:34193943
    reference_title: "Generation of human embryonic stem cell models to exploit the EWSR1-CREB fusion promiscuity as a common pathway of transformation in human tumors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "expression of EWSR1-CREB1/ATF1 fusion in hES cells recapitulates the core gene signatures, respectively, of angiomatoid fibrous histiocytoma (AFH) and gastrointestinal clear cell sarcoma (GI-CCS), although both fusions lead to cell lethality."
    explanation: >-
      Engineered expression of the fusion reproduces the AFH core gene signature,
      supporting the fusion-driven transcriptional program as the mechanism.
  downstream:
  - target: Neoplastic Myoid Cell Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The deregulated transcriptional program drives proliferation of the
      neoplastic cells. The effect is context-dependent: in engineered models the
      same fusion is lethal in undifferentiated stem cells and tolerated only in
      mesenchymal progenitors (PMID:34193943).
  - target: Tumor-Derived IL-6 Overproduction
    causal_link_type: DIRECT
    description: >-
      The IL6 promoter contains a CREB-binding (CRE) site, so constitutive CREB1
      activation by the fusion drives IL-6 transcription.
    evidence:
    - reference: PMID:26165403
      reference_title: "Paraneoplastic Syndrome of Angiomatoid Fibrous Histiocytoma May Be Caused by EWSR1-CREB1 Fusion-induced Excessive Interleukin-6 Production."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The EWSR1-CREB1 fusion gene detected in the tumor leads to continuous activation of CREB1 and IL-6 production, because the promoter region of IL-6 has a CREB binding site."
      explanation: Links the fusion directly to IL-6 transcription via the CRE site in the IL6 promoter.
- name: Neoplastic Myoid Cell Proliferation
  description: >-
    Proliferation of bland ovoid to spindle histiocytoid cells with a
    myoid/myofibroblastic immunophenotype (desmin, EMA, CD99), forming solid
    nests and sheets.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  cell_types:
  - preferred_term: neoplastic myoid cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  evidence:
  - reference: PMID:10571514
    reference_title: "Angiomatoid \"malignant\" fibrous histiocytoma: a clinicopathologic study of 158 cases and further exploration of the myoid phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Desmin positivity was noted in 51% cases and occurred in both predominantly round cell and spindle cell tumors."
    explanation: Documents the myoid (desmin-positive) phenotype of the proliferating neoplastic cells.
  downstream:
  - target: Multinodular Tumor Architecture
    causal_link_type: DIRECT
- name: Tumor-Derived IL-6 Overproduction
  description: >-
    Fusion-driven CREB1 activation causes the tumor cells to secrete interleukin-6
    with STAT3 activation. Serum IL-6 and inflammatory markers normalize after
    resection. Whether IL-6 additionally drives tumor growth through an autocrine
    loop is contested.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: positive regulation of interleukin-6 production
    modifier: INCREASED
    term:
      id: GO:0032755
      label: positive regulation of interleukin-6 production
  - preferred_term: interleukin-6-mediated signaling pathway
    term:
      id: GO:0070102
      label: interleukin-6-mediated signaling pathway
  evidence:
  - reference: PMID:26165403
    reference_title: "Paraneoplastic Syndrome of Angiomatoid Fibrous Histiocytoma May Be Caused by EWSR1-CREB1 Fusion-induced Excessive Interleukin-6 Production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The AFH cells were immunopathologically positive for IL-6 and Tyr705-phosphorylation of signal transducer and activator of transcription 3."
    explanation: Localizes IL-6 and phospho-STAT3 to the tumor cells.
  downstream:
  - target: Paraneoplastic Inflammatory Syndrome
    causal_link_type: DIRECT
    description: Tumor-derived IL-6 drives the systemic inflammatory syndrome, which resolves after resection.
    evidence:
    - reference: PMID:36593607
      reference_title: "Paraneoplastic syndrome due to angiomatoid fibrous histiocytoma: a known presentation of an uncommon diagnosis in a rare site and age."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Following surgery, all the systemic symptoms resolved with normalisation of inflammatory markers."
      explanation: Resolution of the syndrome after resection supports the tumor as its source.
  - target: Neoplastic Myoid Cell Proliferation
    causal_link_type: UNKNOWN
    description: >-
      A proposed autocrine IL-6 growth loop. This edge is contested: a tocilizumab
      response in one case supports it, while another case had the inflammatory
      syndrome controlled by tocilizumab yet the tumor progressed.
    hypothesis_groups:
    - il6_autocrine_growth
    evidence:
    - reference: PMID:29932283
      reference_title: "Therapeutic response of metastatic angiomatoid fibrous histiocytoma carrying EWSR1-CREB1 fusion to the interleukin-6 receptor antibody tocilizumab."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a child with metastatic AFH with EWSR1-CREB1 fusion and elevated IL-6 whose disease progressed during treatment with traditional chemotherapeutic agents, but improved after targeted therapy with tocilizumab."
      explanation: A tumor response to IL-6 receptor blockade is indirect support for an autocrine growth role.
    - reference: PMID:34221525
      reference_title: "Tocilizumab Controls Paraneoplastic Inflammatory Syndrome but Does Not Suppress Tumor Growth of Angiomatoid Fibrous Histiocytoma."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "the inhibition of the IL-6 signaling pathway controlled paraneoplastic inflammatory syndrome (PIS); however, the local recurrent tumor progressed. This case implied that IL-6 is not necessarily the cause of tumor growth in AFH."
      explanation: Tumor progression despite IL-6 blockade argues against an autocrine growth loop.
- name: Paraneoplastic Inflammatory Syndrome
  description: >-
    An IL-6-driven systemic inflammatory syndrome (fever, anemia, weight loss,
    raised ESR and CRP) that accompanies a minority of AFH and resolves after
    resection or IL-6 receptor blockade.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:26165403
    reference_title: "Paraneoplastic Syndrome of Angiomatoid Fibrous Histiocytoma May Be Caused by EWSR1-CREB1 Fusion-induced Excessive Interleukin-6 Production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a 7-year-old girl with angiomatoid fibrous histiocytoma (AFH) presenting severe inflammatory symptoms."
    explanation: Documents AFH presenting with a severe systemic inflammatory syndrome.
  downstream:
  - target: Fever
    causal_link_type: DIRECT
  - target: Anemia
    causal_link_type: DIRECT
  - target: Weight loss
    causal_link_type: DIRECT
  - target: Elevated inflammatory markers
    causal_link_type: DIRECT
- name: Multinodular Tumor Architecture
  description: >-
    A circumscribed, multinodular mass within a fibrous pseudocapsule, with
    blood-filled pseudovascular (angiomatoid) spaces in about half of cases and a
    surrounding dense lymphoplasmacytic cuff. These features produce the clinical
    mimicry of a hematoma or hemangioma.
  biological_scale: TISSUE
  locations:
  - preferred_term: subcutaneous tissue
    term:
      id: UBERON:0002072
      label: hypodermis
  evidence:
  - reference: PMID:10571514
    reference_title: "Angiomatoid \"malignant\" fibrous histiocytoma: a clinicopathologic study of 158 cases and further exploration of the myoid phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighty percent of cases had some degree of lymphoplasmacytic infiltration; 50% cases had pseudovascular spaces filled with blood."
    explanation: Quantifies the lymphoplasmacytic cuff and the blood-filled pseudovascular spaces.
  downstream:
  - target: Painless subcutaneous mass
    causal_link_type: DIRECT
  - target: Metastatic Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The established tumor is the source of metastatic spread; CDKN2A/B
      homozygous deletion is a recurrent secondary event restricted to the
      metastatic cases.
- name: CDKN2A/B Homozygous Deletion
  description: >-
    A recurrent secondary genetic event. CDKN2A/B homozygous deletions were found
    in AFH restricted to metastatic cases, marking progression rather than
    initiation.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:35347249
    reference_title: "Comprehensive genomic profiling of EWSR1/FUS::CREB translocation-associated tumors uncovers prognostically significant recurrent genetic alterations and methylation-transcriptional correlates."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CDKN2A/B homozygous deletions were recurrent in angiomatoid fibrous histiocytoma (AFH) and restricted to metastatic cases."
    explanation: Associates CDKN2A/B loss specifically with metastatic AFH.
  downstream:
  - target: Metastatic Dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Metastatic Dissemination
  description: >-
    Uncommon spread, first to regional lymph nodes (usually curable by excision)
    and rarely to the lung, where it is associated with fatal outcome. Metastases
    have appeared from 5 months to 16 years after primary resection.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:25757019
    reference_title: "Characterization of metastatic angiomatoid fibrous histiocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients metastasized to lymph nodes. Excision of metastatic lymph nodes was usually curative. Pulmonary metastases were associated with fatal outcome."
    explanation: Describes the nodal-then-pulmonary metastatic pattern and its prognostic weight.
  downstream:
  - target: Regional lymph node metastasis
    causal_link_type: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: il6_autocrine_growth
  hypothesis_label: IL-6 as an autocrine driver of AFH tumor growth
  status: EMERGING
  description: >-
    Beyond causing the paraneoplastic inflammatory syndrome, tumor-derived IL-6
    has been proposed to promote AFH growth through autocrine stimulation. The
    evidence is conflicting: one metastatic case improved on the IL-6 receptor
    antibody tocilizumab, while another had the inflammatory syndrome controlled
    but the tumor continued to progress on the same agent.
  evidence:
  - reference: PMID:29932283
    reference_title: "Therapeutic response of metastatic angiomatoid fibrous histiocytoma carrying EWSR1-CREB1 fusion to the interleukin-6 receptor antibody tocilizumab."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interleukin-6 (IL-6) secretion has been described in tumors with EWSR1-CREB1 fusion, and may promote tumor growth due to autocrine stimulation."
    explanation: States the autocrine-growth hypothesis that this group tracks.

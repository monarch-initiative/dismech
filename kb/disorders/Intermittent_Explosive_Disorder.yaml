name: Intermittent Explosive Disorder
creation_date: "2026-09-07T15:00:00Z"
category: Psychiatric
description: >-
  Intermittent explosive disorder (IED) is a disruptive, impulse-control and
  conduct disorder defined by recurrent behavioral outbursts representing a
  failure to control aggressive impulses, either as frequent verbal or
  non-damaging physical aggression or as less frequent but more destructive or
  assaultive episodes. The aggression is impulsive and anger-based rather than
  premeditated or instrumental, and is grossly out of proportion to any
  provocation or precipitating stressor. Convergent neuroimaging and
  pharmacologic evidence implicates a frontolimbic circuit in which exaggerated
  amygdala reactivity to social threat is inadequately regulated by
  orbitofrontal cortex.
disease_term:
  preferred_term: intermittent explosive disorder
  term:
    id: MONDO:0001521
    label: intermittent explosive disorder
parents:
- Impulse Control Disorder
- Mental Health Disorder
prevalence:
- population: United States household population aged 18 and older
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 7300.0
  rate_denominator: POPULATION
  notes: >-
    National Comorbidity Survey Replication, a nationally representative
    face-to-face household survey of 9282 respondents carried out in 2001-2003.
  evidence:
  - reference: PMID:16754840
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lifetime and 12-month prevalence estimates of DSM-IV IED were 7.3% and
      3.9%, with a mean 43 lifetime attacks resulting in 1359 dollars in
      property damage.
    explanation: >-
      Nationally representative survey supplies the lifetime prevalence
      estimate for DSM-IV IED.
- population: United States household population aged 18 and older
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3900.0
  rate_denominator: POPULATION
  notes: >-
    Twelve-month prevalence from the same National Comorbidity Survey

    explanation: >-
      Same survey supplies the 12-month period prevalence estimate.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    IED carries substantial injury and property-damage burden and is broadly
    comorbid with mood, anxiety and substance use disorders, yet only a small
    minority of affected individuals ever receive treatment directed at the
    anger itself.
  evidence:
  - reference: PMID:16754840
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intermittent explosive disorder was significantly comorbid with most
      DSM-IV mood, anxiety, and substance disorders.
    explanation: >-
      Nationally representative survey establishes the breadth of psychiatric
      comorbidity contributing to disease burden.
pathophysiology:
- name: Central Serotonergic Hypofunction
  description: >-
    Reduced central serotonergic tone is the longest-standing neurochemical
    model of impulsive aggression in IED. Direct human synaptic evidence is
    limited; the strongest clinical support is pharmacologic, in that selective
    serotonin reuptake inhibition reduces impulsive aggression in IED without
    acting through an antidepressant or anxiolytic effect.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: serotonin receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007210
      label: serotonin receptor signaling pathway
  downstream:
  - target: Amygdala Hyperreactivity to Social Threat
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced serotonergic modulation is proposed to leave amygdala-driven
      threat responses inadequately restrained; the intervening steps are not
      established in humans.
  evidence:
  - reference: PMID:19389333
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluoxetine treatment has a clear antiaggressive effect in impulsive
      aggressive individuals with IED.
    explanation: >-
      A randomized placebo-controlled response to serotonin reuptake inhibition
      supports serotonergic involvement only through an inference step from
      treatment response back to mechanism, so this is recorded as indirect.
- name: Frontolimbic Gray Matter Reduction
  description: >-
    Voxel-based morphometry in 57 subjects with IED, compared with both healthy
    and psychiatric control groups, shows lower gray matter volume across the
    orbitofrontal cortex, ventral medial prefrontal cortex, anterior cingulate
    cortex, amygdala, insula and uncus, with volume inversely correlated with
    aggression measures.
  biological_scale: TISSUE
  locations:
  - preferred_term: orbitofrontal cortex
    term:
      id: UBERON:0004167
      label: orbitofrontal cortex
  - preferred_term: anterior cingulate cortex
    term:
      id: UBERON:0009835
      label: anterior cingulate cortex
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  - preferred_term: insula
    term:
      id: UBERON:0002022
      label: insula
  downstream:
  - target: Orbitofrontal Hypoactivation to Social Threat
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced prefrontal gray matter is proposed as the anatomic correlate of
      the functional regulatory deficit; the studies are cross-sectional and do
      not establish the direction of causation.
  evidence:
  - reference: PMID:29560894
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gray matter volume was found to be significantly lower in subjects with
      IED compared with healthy control subjects and psychiatric controls in
      orbitofrontal cortex, ventral medial prefrontal cortex, anterior
      cingulate cortex, amygdala, insula, and uncus.
    explanation: >-
      Volumetric MRI study establishes the frontolimbic structural deficit in
      IED against both healthy and psychiatric comparison groups.
  - reference: PMID:29560894
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gray matter volume in these areas was significantly and inversely
      correlated with measures of aggression.
    explanation: >-
      Relationship between regional volume and aggression severity strengthens
      the link between this structural finding and the aggressive phenotype.
- name: Amygdala Hyperreactivity to Social Threat
  description: >-
    Functional MRI during viewing of emotionally salient faces shows
    exaggerated amygdala responses to angry faces in unmedicated subjects with
    IED relative to matched healthy comparison subjects.
  biological_scale: TISSUE
  locations:
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Loss of Amygdala-Orbitofrontal Coupling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17210136
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relative to controls, individuals with IED exhibited exaggerated amygdala
      reactivity and diminished OFC activation to faces expressing anger.
    explanation: >-
      Task-based fMRI directly measures the exaggerated amygdala response to an
      ecologically valid social threat signal in IED.
- name: Orbitofrontal Hypoactivation to Social Threat
  description: >-
    The same social-emotional probe shows diminished orbitofrontal cortex
    activation to angry faces in IED, the regulatory counterpart of the
    amygdala finding.
  biological_scale: TISSUE
  locations:
  - preferred_term: orbitofrontal cortex
    term:
      id: UBERON:0004167
      label: orbitofrontal cortex
  downstream:
  - target: Loss of Amygdala-Orbitofrontal Coupling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17210136
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relative to controls, individuals with IED exhibited exaggerated amygdala
      reactivity and diminished OFC activation to faces expressing anger.
    explanation: >-
      The same contrast reports the reduced orbitofrontal response that this
      node describes.
- name: Loss of Amygdala-Orbitofrontal Coupling
  description: >-
    Beyond the two regional abnormalities individually, aggressive subjects
    fail to show the normal functional coupling between amygdala and
    orbitofrontal cortex during processing of angry faces, indicating a
    breakdown of top-down regulation rather than two independent deficits.
  biological_scale: TISSUE
  locations:
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  downstream:
  - target: Failure to Inhibit Aggressive Impulses
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17210136
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings provide evidence of amygdala-OFC dysfunction in response
        to an ecologically-valid social threat signal (processing angry faces)
        in individuals with a history of impulsive aggressive behavior, and
        further substantiate a link between a dysfunctional cortico-limbic
        network and aggression.
      explanation: >-
        The authors' own conclusion asserts the link between the cortico-limbic
        dysfunction described by this node and aggressive behavior, which is
        the edge rather than either node alone.
  evidence:
  - reference: PMID:17210136
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike controls, aggressive subjects failed to demonstrate amygdala-OFC
      coupling during responses to angry faces.
    explanation: >-
      Directly reports the connectivity failure that distinguishes this node
      from the two regional activation abnormalities upstream of it.
- name: Failure to Inhibit Aggressive Impulses
  description: >-
    The convergent clinical consequence of the frontolimbic deficit is a
    failure to resist aggressive impulses when provoked, producing outbursts
    disproportionate to the provocation. Outbursts are impulsive and
    anger-based rather than premeditated.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent aggressive outbursts
  - target: Irritability
  - target: Impulsivity
  - target: Anger
phenotypes:
- name: Recurrent aggressive outbursts
  category: Behavioral
  description: >-
    The defining manifestation of IED: repeated failures to control aggressive
    impulses, with a mean of 43 lifetime attacks and frequent resulting injury
    and property damage.
  phenotype_term:
    preferred_term: Aggressive behavior
    term:
      id: HP:0000718
      label: Aggressive behavior
    temporality: RECURRENT
  evidence:
  - reference: PMID:16754840
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intermittent explosive disorder-related injuries occurred 180 times per
      100 lifetime cases.
    explanation: >-
      Quantifies the injurious consequences of the recurrent aggressive
      outbursts in a nationally representative sample.
- name: Irritability
  category: Behavioral
  description: >-
    Irritability is assessed as a core clinical dimension of IED alongside
    overt aggression, and improves with serotonergic treatment.
  phenotype_term:
    preferred_term: Irritability
    term:
      id: HP:0000737
      label: Irritability
  evidence:
  - reference: PMID:19389333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Secondary efficacy measures included the irritability score from the
      OAS-M and the Clinical Global Impressions-Improvement scale (CGI-I)
      score.
    explanation: >-
      Trial design treats OAS-M irritability as a measured clinical dimension
      of IED.
- name: Impulsivity
  category: Behavioral
  description: >-
    Aggression in IED is impulsive rather than premeditated, which is what
    separates it from instrumental or planned aggression.
  phenotype_term:
    preferred_term: Impulsivity
    term:
      id: HP:0100710
      label: Impulsivity
  evidence:
  - reference: PMID:19389333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intermittent explosive disorder (IED) is a disorder of impulsive
      aggression that affects as many as 7.3% of the U.S. population during
      some period of life.
    explanation: >-
      Characterizes IED aggression as impulsive, the feature this phenotype
      records.
- name: Anger
  category: Behavioral
  description: >-
    Outbursts are anger-based, and anger is a primary outcome dimension in IED
    treatment trials.
  phenotype_term:
    preferred_term: Anger
    term:
      id: HP:0031473
      label: Anger
  evidence:
  - reference: PMID:36229112
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary study outcomes were aggressive behavior and anger.
    explanation: >-
      Randomized trial treats anger as a primary clinical outcome dimension in
      IED.
progression:
- phase: Onset in early adolescence
  age_range: Mean age at onset 14 years
  notes: >-
    IED begins early, typically preceding the mood, anxiety and substance
    disorders with which it is comorbid and which have later ages at onset.
  evidence:
  - reference: PMID:16754840
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mean age at onset was 14 years.
    explanation: >-
      Supplies the mean age at onset from the National Comorbidity Survey
      Replication.
- phase: Persistent, undertreated adult course
  notes: >-
    Most affected individuals reach professional care for some emotional or
    substance problem, but only a minority are ever treated for the anger
    itself, so the aggressive syndrome commonly persists untreated.
  evidence:
  - reference: PMID:16754840
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the majority of people with IED (60.3%) obtained professional
      treatment for emotional or substance problems at some time in their life,
      only 28.8% ever received treatment for their anger, while only 11.7% of
      12-month cases received treatment for their anger in the 12 months before
      interview.
    explanation: >-
      Quantifies the treatment gap that shapes the adult course of the
      disorder.
diagnosis:
- name: Clinical assessment for recurrent impulsive aggression
  presence: >-
    Diagnosis is clinical, based on recurrent behavioral outbursts reflecting a
    failure to control aggressive impulses that are grossly out of proportion
    to provocation, are impulsive rather than premeditated, cause distress or
    impairment, and are not better explained by another mental disorder, a
    medical condition, or substance effects. Structured instruments used in
    research include the Overt Aggression Scale-Modified for current aggression
    and irritability.
  evidence:
  - reference: PMID:19389333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary efficacy measure was the aggression score from the Overt
      Aggression Scale-Modified (OAS-M) for Outpatient Use.
    explanation: >-
      Identifies the standard research instrument for quantifying aggression in
      IED.
differential_diagnoses:
- name: Conduct disorder
  description: >-
    Conduct disorder involves a broader persistent pattern of rule violation
    and violation of the rights of others, not isolated impulsive aggressive
    outbursts.
  disease_term:
    preferred_term: conduct disorder
    term:
      id: MONDO:0005352
      label: conduct disorder
- name: Oppositional defiant disorder
  description: >-
    ODD is characterized by a persistent angry, irritable and defiant pattern
    rather than by discrete outbursts of serious aggression.
  disease_term:
    preferred_term: oppositional defiant disorder
    term:
      id: MONDO:0000495
      label: oppositional defiant disorder
- name: Antisocial personality disorder
  description: >-
    Antisocial personality disorder involves pervasive disregard for the rights
    of others including deceit and instrumental rule-breaking; aggression in
    IED is impulsive and anger-based rather than instrumental.
  disease_term:
    preferred_term: antisocial personality disorder
    term:
      id: MONDO:0001164
      label: antisocial personality disorder
- name: Borderline personality disorder
  description: >-
    Borderline personality disorder can include anger outbursts, but within a
    broader pattern of affective instability, identity disturbance and
    abandonment sensitivity.
  disease_term:
    preferred_term: borderline personality disorder
    term:
      id: MONDO:0001156
      label: borderline personality disorder
treatments:
- name: Fluoxetine
  description: >-
    Selective serotonin reuptake inhibition reduces impulsive aggression and
    irritability in IED. The effect is robust but partial: fewer than half of
    treated subjects reach full or partial remission, and the antiaggressive
    effect is independent of any antidepressant or anxiolytic action.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fluoxetine
      term:
        id: CHEBI:5118
        label: fluoxetine
  target_mechanisms:
  - target: Central Serotonergic Hypofunction
    description: >-
      Fluoxetine acts by enhancing serotonergic transmission, the mechanism
      this node describes.
  target_phenotypes:
  - preferred_term: Aggressive behavior
    term:
      id: HP:0000718
      label: Aggressive behavior
  - preferred_term: Irritability
    term:
      id: HP:0000737
      label: Irritability
  evidence:
  - reference: PMID:19389333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluoxetine treatment resulted in a sustained reduction in OAS-M
      aggression, and OAS-M irritability scores, apparent as early as week 2 (p
      < .01 for aggression and p < .001 for irritability at endpoint).
    explanation: >-
      Double-blind placebo-controlled trial in 100 subjects with IED reports
      the primary and secondary efficacy results.
  - reference: PMID:19389333
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, while fluoxetine's antiaggressive effects appear robust, they
      lead to full or partial remission of IED in less than 50% of subjects
      treated with fluoxetine.
    explanation: >-
      The same trial bounds the magnitude of benefit, which is why this
      treatment is described as partial rather than curative.
  notes: >-
    A later 30-subject substudy of a separate 12-week trial of fluoxetine and
    divalproex (PMID:26277033) found no anti-aggressive response on OAS-M
    measures in that smaller sample. The larger dedicated trial cited here
    remains the primary efficacy evidence, but the effect should not be
    presented as uniformly replicated.
- name: Cognitive behavioral therapy
  description: >-
    A twelve-session multicomponent cognitive behavioral intervention targeting
    anger, cognitive bias and relational aggression was superior to a
    time-equated supportive psychotherapy control in adults with IED.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cognitive behavior therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  target_mechanisms:
  - target: Failure to Inhibit Aggressive Impulses
    description: >-
      The intervention targets the behavioral endpoint of the frontolimbic
      chain rather than an upstream neurochemical step.
  target_phenotypes:
  - preferred_term: Aggressive behavior
    term:
      id: HP:0000718
      label: Aggressive behavior
  - preferred_term: Anger
    term:
      id: HP:0031473
      label: Anger
  evidence:
  - reference: PMID:36229112
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though participants in both treatments tended to improve over time, the
      cognitive behavioral intervention was superior to supportive
      psychotherapy in decreasing aggressive behavior and relational
      aggression.
    explanation: >-
      Randomized controlled trial against an active comparator supports
      specific efficacy of the cognitive behavioral intervention.
notes: >-
  Curated from primary literature located through PubMed. The frontolimbic
  mechanism rests on a small number of studies from one research group
  (Coccaro and colleagues), and the functional imaging finding in particular
  comes from a 10-subject-per-arm sample; the structural finding is better
  powered at 168 subjects. The serotonergic node is supported pharmacologically
  rather than by direct human synaptic measurement, and is graded INDIRECT for
  that reason. Candidate-gene associations for impulsive aggression (MAOA,
  SLC6A4, TPH2, HTR1B) circulate widely in the secondary literature but are
  association findings for the intermediate phenotype rather than for IED as a
  diagnosis, and are deliberately not curated here as genetic context without
  IED-specific primary evidence.

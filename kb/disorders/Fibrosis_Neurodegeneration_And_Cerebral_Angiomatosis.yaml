inheritance:
- name: Autosomal Recessive
  description: >-
    FINCA syndrome is inherited in an autosomal recessive manner due to
    compound heterozygous or homozygous pathogenic variants in NHLRC2.
    Complete loss of NHLRC2 is embryonic lethal in mice prior to the morula
    stage, and affected individuals carry at least one hypomorphic missense
    allele such as p.Asp148Tyr.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37188825
    reference_title: "Broadening the phenotypic and molecular spectrum of FINCA syndrome: Biallelic NHLRC2 variants in 15 novel individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is an autosomal recessive multisystem disorder characterized by fibrosis, neurodegeneration and cerebral angiomatosis. To date, 13 patients from nine families with biallelic NHLRC2 variants have been published. In all of them, the recurrent missense variant p.(Asp148Tyr) was detected on at least one allele."
    explanation: Confirms autosomal recessive inheritance of FINCA syndrome with biallelic NHLRC2 variants.
  - reference: PMID:29423877
    reference_title: "NHLRC2 variants identified in patients with fibrosis, neurodegeneration, and cerebral angiomatosis (FINCA): characterisation of a novel cerebropulmonary disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Development of the Nhlrc2 null mouse strain stalled before the morula stage."
    explanation: Demonstrates that complete loss of Nhlrc2 is pre-morula embryonic lethal in mice, explaining why human patients carry at least one hypomorphic missense allele.
prevalence:
- population: Global published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare disorder with 33 patients from various ethnic backgrounds
    reported in the literature following its initial characterization.
  evidence:
  - reference: PMID:40510178
    reference_title: "Altered behaviour and immune response in mice with NHLRC2 p.Asp148Tyr variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Since our initial characterisation, 33 patients from various ethnic backgrounds have been reported with different combinations of recessive pathogenic variants in NHLRC2 broadening the phenotypic spectrum of the disease"
    explanation: Documents 33 reported patients globally with biallelic NHLRC2 variants.
progression:
- phase: Onset
  age_range: Infancy to childhood (2 months to 13 years)
  notes: >-
    Severe multisystem cases present around 2 months of age with progressive
    cerebropulmonary symptoms, anemia, and failure to thrive. Seizure onset
    ranges from 9 months to 13 years, and mortality is concentrated before
    age 3 years (overall mortality 25.8% across 31 patients, rising to 77.8%
    among the 9 patients with interstitial lung disease), whereas survivors
    range from 4 to 61 years of age with neurodevelopmental delay and
    progressive cerebral and cerebellar atrophy.
  evidence:
  - reference: PMID:29423877
    reference_title: "NHLRC2 variants identified in patients with fibrosis, neurodegeneration, and cerebral angiomatosis (FINCA): characterisation of a novel cerebropulmonary disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical features included progressive cerebropulmonary symptoms, malabsorption, progressive growth failure, recurrent infections, chronic haemolytic anaemia and transient liver dysfunction."
    explanation: Describes early infantile multisystem presentation of classic FINCA syndrome.
  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combining the clinical features of our five novel patients with the previously described 13 patients (Uusimaa et al., 2018; Brodsky et al., 2020; Rapp et al., 2021; Badura-Stronka et al., 2022) reveals the following: 10 patients have been reported as being alive (age between 4 and 61 years at the time of the publication), while eight were deceased (age at death between 10 months and 2 years, 5 months)."
    explanation: Documents survival into adulthood (4 to 61 years) alongside infant/early-childhood mortality (10 months to 2 years 5 months).
  - reference: PMID:39328589
    reference_title: "Case Report: Clinical manifestations and treatment of two Chinese patients with FINCA syndrome carrying a novel variant of NHLRC2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall mortality rate among 31 FINCA patients is 25.8%, whereas the mortality rate for those 9 patients with comorbid ILD is significantly higher at 77.8%. All deceased children died before the age of 3 (1, 10–14)."
    explanation: Establishes overall mortality (25.8%) and elevated mortality in patients with comorbid interstitial lung disease (77.8%), with all deaths occurring before age 3.
pathophysiology:
- name: NHLRC2 Structural Destabilization and Protein Depletion
  description: >-
    NHLRC2 comprises an N-terminal thioredoxin-like (Trx-like) domain, a
    six-bladed NHL repeat beta-propeller domain, and a C-terminal beta-stranded
    domain. Pathogenic missense variants such as p.Asp148Tyr in the Trx-like
    domain thermally destabilize the protein structure by 2 degrees Celsius and
    markedly reduce steady-state cellular NHLRC2 protein levels. Combined with
    null or hypomorphic second alleles, total cellular NHLRC2 falls below
    critical functional thresholds, with more severe depletion driving early
    multisystem and pulmonary disease.
  genes:
  - preferred_term: NHLRC2
    term:
      id: hgnc:24731
      label: NHLRC2
  molecular_functions:
  - preferred_term: protein binding
    modifier: DECREASED

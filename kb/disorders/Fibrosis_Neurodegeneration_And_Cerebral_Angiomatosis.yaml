    explanation: Confirms decreased serum immunoglobulin levels in two of five patients evaluated.

genetic:
- name: NHLRC2
  association: Pathogenic Biallelic Variants
  gene_term:
    preferred_term: NHLRC2
    term:
      id: hgnc:24731
      label: NHLRC2
  features: >-
    Biallelic missense, frameshift, nonsense, or splice-site variants in
    NHLRC2. The recurrent hypomorphic missense variant c.442G>T (p.Asp148Tyr)
    in the conserved N-terminal thioredoxin-like domain is the most common
    disease allele, occurring in either homozygous state or compound
    heterozygosity with loss-of-function variants (such as p.Arg201GlyfsTer6)
    or additional missense variants (such as p.His143Pro). At least nine
    additional pathogenic variants across the gene have been identified in
    diverse populations, with residual NHLRC2 protein abundance correlating
    inversely with early-onset pulmonary disease.
  evidence:
  - reference: PMID:29423877
    reference_title: "NHLRC2 variants identified in patients with fibrosis, neurodegeneration, and cerebral angiomatosis (FINCA): characterisation of a novel cerebropulmonary disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A whole-exome sequencing of the two unrelated families with the affected children revealed the transmission of two heterozygous variants in the NHL repeat-containing protein 2 (NHLRC2); an amino acid substitution p.Asp148Tyr and a frameshift 2-bp deletion p.Arg201GlyfsTer6."
    explanation: Identifies the original compound heterozygous NHLRC2 variants (p.Asp148Tyr and p.Arg201GlyfsTer6) causing FINCA syndrome.
  - reference: PMID:32435055
    reference_title: "Novel compound heterozygous variants in NHLRC2 in a patient with FINCA syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient has one known and one novel variant in NHLRC2 (c.442T>G, p.D148Y and c.428C>A, p.H143P, respectively). p.H143P is extremely rare and is not present in the gnomAD database of >140,000 allele sequences from healthy humans. Both variants affect the highly conserved N-terminal thioredoxin (Trx)-like domain of NHLRC2 and are predicted to be damaging."
    explanation: Documents compound heterozygosity for p.Asp148Tyr and p.His143Pro in the conserved N-terminal Trx-like domain.
  - reference: PMID:37188825
    reference_title: "Broadening the phenotypic and molecular spectrum of FINCA syndrome: Biallelic NHLRC2 variants in 15 novel individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present 15 individuals from 12 families with an overlapping phenotype associated with nine novel NHLRC2 variants identified by exome analysis. All patients described here presented with moderate to severe global developmental delay and variable disease progression. Seizures, truncal hypotonia and movement disorders were frequently observed."
    explanation: Expands the allelic spectrum of FINCA syndrome with nine novel NHLRC2 variants across 12 families.

animal_models:
- species: Mus musculus
  genotype: Nhlrc2^FINCA/- (p.Asp148Tyr / null compound heterozygote)
  description: >-
    Compound heterozygous FINCA mouse model carrying the patient-equivalent
    missense variant p.Asp148Tyr combined with a null allele. Mice are viable
    and exhibit adolescent hyperactivity, decreased exploration of novel
    objects, altered innate immune interferon-gamma responses, dysregulated
    Rho GTPase signaling, vesicular trafficking defects, and accumulation of
    hnRNP C2 in developing neurons and adult female hippocampus.
  associated_phenotypes:
  - Hyperactivity and decreased novel object exploration
  - Altered innate immune interferon-gamma response
  - Hippocampal hnRNP C2 accumulation
  modeled_mechanisms:
  - target: Neuronal hnRNP C2 Accumulation and RNA Metabolism Perturbation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Nhlrc2^FINCA/- mice exhibit increased hnRNP C2 isoform levels in
      developing neurons and adult hippocampus.
  - target: Neuronal Vesicular Trafficking Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Proteomic and cellular studies of Nhlrc2^FINCA/- mice demonstrate
      dysregulated neuronal vesicular trafficking.
  - target: Cytoskeletal and Rho GTPase Signaling Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Transcriptomic and interactome comparisons in Nhlrc2^FINCA/- mice
      identify Rho GTPase signaling dysregulation.
  evidence:
  - reference: PMID:33297935
    reference_title: "Variant in NHLRC2 leads to increased hnRNP C2 in developing neurons and the hippocampus of a mouse model of FINCA disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, isoform C2 of hnRNP C1/C2 was significantly increased in both developing neurons and the hippocampus of adult female FINCA mice, connecting NHLRC2 dysfunction with accumulation of RNA binding protein."
    explanation: Demonstrates hnRNP C2 accumulation in developing neurons and adult hippocampus of FINCA mice.
  - reference: PMID:40510178
    reference_title: "Altered behaviour and immune response in mice with NHLRC2 p.Asp148Tyr variant."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FINCA mice exhibited hyperactivity and decreased exploration of new object in adolescence, and an altered innate immune response, particularly in interferon γ production. By comparing p.Asp148Tyr-induced changes in gene expression in mouse cells and putative interaction partners in human cells, we identified Rho GTPase signalling as a common affected pathway."
    explanation: Characterizes behavioral, innate immune, and Rho GTPase signaling phenotypes in FINCA mice.


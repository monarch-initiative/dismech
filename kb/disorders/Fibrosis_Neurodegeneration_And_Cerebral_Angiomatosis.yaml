biochemical:
- name: Reduced Cellular NHLRC2 Protein Level
  presence: DECREASED
  context: Patient-derived fibroblasts and peripheral blood cells
  notes: >-
    Steady-state NHLRC2 protein levels are markedly reduced in patient-derived
    fibroblasts; severity of protein depletion correlates with early-onset
    pulmonary and multisystem involvement.
  evidence:
  - reference: PMID:29423877
    reference_title: "NHLRC2 variants identified in patients with fibrosis, neurodegeneration, and cerebral angiomatosis (FINCA): characterisation of a novel cerebropulmonary disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient-derived fibroblasts, NHLRC2 levels were low, and only p.Asp148Tyr was expressed. Therefore, the allele with the frameshift deletion is likely non-functional."
    explanation: Demonstrates low cellular NHLRC2 protein levels in patient-derived fibroblasts.
  - reference: PMID:37188825
    reference_title: "Broadening the phenotypic and molecular spectrum of FINCA syndrome: Biallelic NHLRC2 variants in 15 novel individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studying different non-truncating variants and linking their effects on NHLRC2 protein levels revealed a putative genotype-phenotype correlation: variants leading to severely reduced protein levels (either in homozygous or in compound-heterozygous state with another severe missense or frameshift/nonsense variant) were associated with an early onset multisystem phenotype including pulmonary disease. When the sum of NHLRC2 protein levels from both alleles appears to exceed a certain critical level, a phenotype without progressive respiratory symptoms was observed"
    explanation: Establishes cellular NHLRC2 protein dosage as a biochemical correlate of respiratory disease severity.

- name: Serum Krebs von den Lungen-6 (KL-6)
  presence: ELEVATED
  context: Interstitial lung disease activity and treatment monitoring
  notes: >-
    Serum KL-6 levels are elevated during active FINCA-associated interstitial
    lung disease and decrease in parallel with clinical and radiological
    improvement under systemic glucocorticoid therapy.
  evidence:
  - reference: PMID:39328589
    reference_title: "Case Report: Clinical manifestations and treatment of two Chinese patients with FINCA syndrome carrying a novel variant of NHLRC2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The elder brother died of infantile respiratory failure, while the younger brother showed improvement in respiratory symptoms, chest CT, and Krebs von den Lungen-6 levels after long-term systemic glucocorticoid therapy, indicating that anti-inflammatory treatment may be beneficial in the treatment of ILD caused by FINCA syndrome."
    explanation: Documents serum Krebs von den Lungen-6 (KL-6) as a biomarker responsive to systemic glucocorticoid therapy in FINCA-related ILD.

- name: Serum Immunoglobulins
  presence: DECREASED
  context: Humoral immune evaluation
  notes: >-
    Decreased circulating immunoglobulin levels are detected in a subset of
    patients presenting with recurrent infections.
  evidence:
  - reference: PMID:37179546

- name: Macrophage Morphological Defect and Impaired Phagocytosis
  description: >-
    NHLRC2 interacts with FRYL, EIF2AK2, and KLHL13 during macrophage
    differentiation. Loss of NHLRC2 yields smaller macrophages lacking
    filopodia and membrane ruffling that fail to form phagocytic cups or
    engulf bacteria, accompanied by a hyperinflammatory phenotype and altered
    interferon-gamma innate immune responses. Together with hypogammaglobulinemia
    in a subset of patients, this predisposes individuals to recurrent
    respiratory and systemic infections.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:31594818
    reference_title: "A Genome-Wide Knockout Screen in Human Macrophages Identified Host Factors Modulating Salmonella Infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon differentiation, NHLRC2 mutant macrophages were hyperinflammatory and did not exhibit characteristics typical of macrophages, including atypical morphology and inability to interact and phagocytose bacteria/particles. Immunoprecipitation confirmed an interaction of NHLRC2 with FRYL, EIF2AK2, and KLHL13."
    explanation: Demonstrates that NHLRC2 loss in human macrophages causes hyperinflammation and inability to phagocytose bacteria.
  - reference: PMID:31594818
    reference_title: "A Genome-Wide Knockout Screen in Human Macrophages Identified Host Factors Modulating Salmonella Infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared with WT macrophages, NHLRC2 mutant macrophages were smaller and lacked filopodia. In the presence of Salmonella, WT macrophages displayed increased membrane ruffling and engaged with Salmonella to form phagocytic cups, but the NHLRC2 mutant macrophage cell surface remained smooth and did not appear to engage with the bacteria in the environment."
    explanation: Shows loss of filopodia, membrane ruffling, and phagocytic cup formation in NHLRC2-deficient macrophages.
  downstream:
  - target: Recurrent respiratory infections
    description: >-
      Defective macrophage bacterial phagocytosis and dysregulated innate
      immune signaling predispose patients to recurrent respiratory tract
      infections.
  - target: Decreased circulating immunoglobulin concentration
    description: >-
      Immune dysregulation in NHLRC2 deficiency is associated with
      hypogammaglobulinemia in a subset of patients.

- name: Dyserythropoiesis and Multinucleated Erythroblast Formation
  description: >-
    Disruption of NHLRC2-p190RhoGAP-RhoA signaling in erythroid precursors
    impairs cytokinesis and erythropoietic maturation in the bone marrow,
    resulting in dyserythropoiesis with bi- and multinucleated erythroblasts
    resembling congenital dyserythropoietic anemia type II and transfusion-dependent
    macrocytic or hemolytic anemia in infancy.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DYSREGULATED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  locations:
  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations (Table 2) revealed macrocytic anemia in all five patients, with the bone marrow aspirates in two patients (patients five and six, Table 2) showing increased erythropoiesis or dyserythropoiesis, marked bi- and multinuclearity of erythroblasts and increased eosinophils suggestive of congenital dyserythropoietic anemia (CDA type II) (Figures 3A, B). Four out of five patients needed several red blood cell transfusions in infancy. Furthermore, immunodeficiency with decreased immunoglobulin levels was detected in two patients."
    explanation: Documents bone marrow dyserythropoiesis with bi- and multinucleated erythroblasts and transfusion-dependent macrocytic anemia in FINCA patients.
  downstream:
  - target: Macrocytic anemia
    description: >-
      Ineffective erythropoiesis and disordered erythroid maturation produce
      infantile macrocytic anemia.
  - target: Chronic hemolytic anemia
    description: >-
      Defective erythroid maturation leads to premature red cell destruction
      and chronic hemolytic anemia.
  - target: Multinucleated erythroblast
    description: >-
      Impaired erythroblast cytokinesis directly produces bi- and
      multinucleated erythroblasts in the bone marrow.


- name: Increased Susceptibility to ROS-Induced Caspase-8 Mediated Apoptosis
  description: >-
    In human HCT116 colon carcinoma cells, the N-terminal thioredoxin-like
    domain of NHLRC2 interacts with pro-caspase-8, and reactive oxygen species
    (ROS) trigger caspase-8-mediated cleavage of NHLRC2 at Asp580. Loss of
    NHLRC2 increases cellular sensitivity to ROS-induced apoptotic cell death,
    representing a candidate mechanism that may contribute to parenchymal and
    neuronal cell loss under oxidative stress.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:29242562
    reference_title: "ROS-induced cleavage of NHLRC2 by caspase-8 leads to apoptotic cell death in the HCT116 human colon cancer cell line."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the thioredoxin-like domain of NHLRC2 interacted with a proenzyme form of caspase-8, and that caspase-8 cleaved NHLRC2 protein at Asp580 in vitro. Furthermore, siRNA-mediated knockdown of caspase-8 blocked the ROS-induced decrease in NHLRC2 protein levels. Both shRNA and CRISPR-Cas9-mediated loss of NHLRC2 resulted in an increased susceptibility of HCT116 cells to ROS-induced apoptosis."
    explanation: Demonstrates that NHLRC2 interacts with pro-caspase-8 via its Trx-like domain and that NHLRC2 loss increases susceptibility to ROS-induced apoptosis in HCT116 cells.
  downstream:
  - target: Vacuolar Neurodegeneration and Neuronal Depletion
    description: >-
      Proposed candidate mechanism whereby heightened sensitivity to
      oxidative stress-induced apoptosis may promote neuronal loss across
      the cerebral cortex, cerebellum, and spinal cord anterior horns.
    hypothesis_groups:
    - ros_caspase8_apoptosis_hypothesis


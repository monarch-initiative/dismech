  - reference: PMID:30138417
    reference_title: "Structural analysis of human NHLRC2, mutations of which are associated with FINCA disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NHLRC2 contains three domains; an N-terminal thioredoxin-like (Trx-like) domain, followed by a six-bladed NHL repeat containing β-propeller domain and then a C-terminal β-stranded domain."
    explanation: Defines the three-domain architecture of human NHLRC2.
  - reference: PMID:30138417
    reference_title: "Structural analysis of human NHLRC2, mutations of which are associated with FINCA disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Asp148Tyr mutation destabilizes the structure of the protein by 2°C."
    explanation: Shows thermal destabilization of NHLRC2 by the recurrent p.Asp148Tyr variant.
  - reference: PMID:30138417
    reference_title: "Structural analysis of human NHLRC2, mutations of which are associated with FINCA disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This in vitro data, taken together with the in vivo data that the D148Y mutation results in a large decrease of NHLRC2 levels in cells derived from patients"
    explanation: Links structural destabilization to severe depletion of NHLRC2 protein in patient cells.
  - reference: PMID:37188825
    reference_title: "Broadening the phenotypic and molecular spectrum of FINCA syndrome: Biallelic NHLRC2 variants in 15 novel individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studying different non-truncating variants and linking their effects on NHLRC2 protein levels revealed a putative genotype-phenotype correlation: variants leading to severely reduced protein levels (either in homozygous or in compound-heterozygous state with another severe missense or frameshift/nonsense variant) were associated with an early onset multisystem phenotype including pulmonary disease. When the sum of NHLRC2 protein levels from both alleles appears to exceed a certain critical level, a phenotype without progressive respiratory symptoms was observed"
    explanation: Demonstrates that residual NHLRC2 protein dosage governs whether pulmonary and multisystem pathology develops.
  downstream:
  - target: Cytoskeletal and Rho GTPase Signaling Dysregulation
    description: >-
      Loss of functional NHLRC2 disrupts its interactions with cytoskeleton
      and RhoA regulators (including p190RhoGAP) and vesicle transport
      machinery.
  - target: Neuronal Vesicular Trafficking Dysfunction
    description: >-
      Deficiency of functional NHLRC2 in neural progenitor cells and neurons
      perturbs intracellular vesicular transport.
  - target: Neuronal hnRNP C2 Accumulation and RNA Metabolism Perturbation
    description: >-
      Deficiency of functional NHLRC2 in neural progenitor cells and
      hippocampal neurons causes accumulation of the RNA-binding protein
      isoform hnRNP C2 and perturbed RNA metabolism.
  - target: Increased Susceptibility to ROS-Induced Caspase-8 Mediated Apoptosis
    description: >-
      Loss of NHLRC2 sensitizes cells to reactive oxygen species-induced
      apoptotic cell death linked to caspase-8 interaction with the
      thioredoxin-like domain.

- name: Cytoskeletal and Rho GTPase Signaling Dysregulation
  description: >-
    NHLRC2 regulates cellular organization via actin/vimentin cytoskeleton
    dynamics, Rho GTPase signaling (through association with p190RhoGAP to
    modulate RhoA activation), and vesicle-mediated transport. In patient
    fibroblasts and mutant cells, NHLRC2 deficiency causes abnormal
    multilamellar bodies, altered vimentin filament organization, and
    dysregulated Rho GTPase signaling pathways.

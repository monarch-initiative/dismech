phenotypes:
- category: Nervous System
  name: Global developmental delay
  frequency: OBLIGATE
  description: >-
    Moderate to severe global developmental delay is observed across affected
    individuals surviving beyond early infancy, with many children remaining
    non-verbal or speaking only a few rudimentary words.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:

  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoglobulin treatment and additional vaccinations (e.g., pneumococcal vaccine and varicella immunoglobulin) and antibiotic prophylaxis (for pneumocystis carinii, etc.) are recommended if immunodeficiency is detected."
    explanation: Recommends antibiotic prophylaxis in FINCA patients with immunodeficiency and recurrent infections.

diagnosis:
- name: Whole Exome Sequencing
  presence: Confirmatory
  description: >-
    Molecular genetic testing via whole-exome or genome sequencing to identify
    biallelic pathogenic variants in NHLRC2 is the definitive diagnostic
    method and is recommended for infants and children presenting with
    cerebropulmonary manifestations or infantile-onset epileptic
    encephalopathies.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Identification of homozygous or compound heterozygous pathogenic variants in NHLRC2.
  evidence:
  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the current knowledge on the phenotypic spectrum of FINCA disease, we recommend considering WES analysis for patients with a history of infantile-onset cerebropulmonary manifestations as well as infantile-onset epileptic encephalopathies without pulmonary manifestations."
    explanation: Recommends whole-exome sequencing for suspected FINCA syndrome across both cerebropulmonary and isolated neurological presentations.

- name: Chest Computed Tomography
  presence: Supportive
  description: >-
    High-resolution chest computed tomography to evaluate infantile
    interstitial lung disease, typically demonstrating ground-glass opacities
    and pulmonary consolidations.
  diagnosis_term:
    preferred_term: Chest Computed Tomography
    term:
      id: NCIT:C191501
      label: Chest Computed Tomography
  results: Ground-glass opacities (GGOs) and pulmonary consolidations consistent with interstitial lung disease.
  evidence:
  - reference: PMID:39328589
    reference_title: "Case Report: Clinical manifestations and treatment of two Chinese patients with FINCA syndrome carrying a novel variant of NHLRC2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About half of the 31 FINCA patients presented with respiratory symptoms, such as tachypnea, cough, hypoxemia, and respiratory distress. Chest CT scans were performed on 11 patients, among whom 9 children were diagnosed with ILD, with the most prevalent findings being GGOs and pulmonary consolidations."
    explanation: Establishes chest CT findings of ground-glass opacities and pulmonary consolidations in 9 of 11 scanned FINCA patients.

- name: Brain Magnetic Resonance Imaging
  presence: Supportive
  description: >-
    Brain MRI to evaluate structural and neurodegenerative abnormalities,
    which may reveal corpus callosum hypoplasia or atrophy, dilated ventricles,
    delayed myelination, and progressive cerebral and cerebellar atrophy.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Corpus callosum hypoplasia/atrophy, dilated ventricles, delayed myelination, and cortical/cerebellar atrophy.
  evidence:
  - reference: PMID:37188825
    reference_title: "Broadening the phenotypic and molecular spectrum of FINCA syndrome: Biallelic NHLRC2 variants in 15 novel individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain abnormalities (dilated ventricles, corpus callosum hypoplasia, mild cortical atrophy and delayed myelination) were diagnosed in five individuals, while six had unremarkable brain MRI scans."
    explanation: Details characteristic brain MRI abnormalities in FINCA syndrome.

- name: Bone Marrow Aspiration
  presence: Supportive
  description: >-
    Bone marrow aspiration in patients with severe infantile macrocytic anemia
    to assess for dyserythropoiesis and multinucleated erythroblasts.
  diagnosis_term:
    preferred_term: Bone Marrow Aspiration
    term:
      id: NCIT:C15644
      label: Bone Marrow Aspiration
  results: Increased erythropoiesis or dyserythropoiesis with marked bi- and multinuclearity of erythroblasts and eosinophilia.
  evidence:
  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations (Table 2) revealed macrocytic anemia in all five patients, with the bone marrow aspirates in two patients (patients five and six, Table 2) showing increased erythropoiesis or dyserythropoiesis, marked bi- and multinuclearity of erythroblasts and increased eosinophils suggestive of congenital dyserythropoietic anemia (CDA type II) (Figures 3A, B). Four out of five patients needed several red blood cell transfusions in infancy. Furthermore, immunodeficiency with decreased immunoglobulin levels was detected in two patients."
    explanation: Describes bone marrow aspirate findings of dyserythropoiesis and bi-/multinucleated erythroblasts in FINCA patients.

differential_diagnoses:
- name: Congenital Dyserythropoietic Anemia Type II
  description: >-
    Infants with FINCA syndrome may initially present with severe macrocytic
    anemia and bone marrow bi- and multinucleated erythroblasts mimicking
    congenital dyserythropoietic anemia type II (CDA II); distinguished by
    multisystem neurodevelopmental and pulmonary involvement and biallelic
    NHLRC2 variants rather than SEC23B mutations.
  distinguishing_features:
  - Progressive neurodevelopmental delay, hypotonia, and seizures
  - Infantile interstitial lung disease
  - Biallelic pathogenic variants in NHLRC2 on exome sequencing
  disease_term:
    preferred_term: congenital dyserythropoietic anemia type 2
    term:
      id: MONDO:0009134
      label: congenital dyserythropoietic anemia type 2
  evidence:
  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patient six, the initial lead-pathologies were severe anemia associated with feeding problems, failure to thrive and muscular hypotonia; hence, hematologists should keep ultra-orphan diseases like CDAs, FINCA syndrome and CAD-associated uridine responsive epileptic encephalopathy in the differential diagnostic repertoire."
    explanation: Highlights congenital dyserythropoietic anemias (CDAs) as a key differential diagnosis for FINCA syndrome presenting with severe infantile macrocytic anemia.

- name: Surfactant Metabolism Dysfunction / NKX2-1-Related Interstitial Lung Disease
  description: >-
    Surfactant dysfunction disorder caused by NKX2-1 mutation presents with
    early-onset interstitial lung disease and neurological involvement
    (choreoathetosis/hypotonia) closely resembling FINCA syndrome;
    distinguished by normal thyroid function in FINCA patients and molecular
    testing of NHLRC2 versus NKX2-1.
  distinguishing_features:
  - Normal thyroid function in FINCA syndrome (versus congenital hypothyroidism in brain-lung-thyroid syndrome)
  - Macrocytic/dyserythropoietic anemia
  - Biallelic NHLRC2 variants rather than heterozygous NKX2-1 variants
  disease_term:
    preferred_term: brain-lung-thyroid syndrome
    term:
      id: MONDO:0012593
      label: brain-lung-thyroid syndrome
  evidence:
  - reference: PMID:39328589
    reference_title: "Case Report: Clinical manifestations and treatment of two Chinese patients with FINCA syndrome carrying a novel variant of NHLRC2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For example, the clinical manifestations of surfactant dysfunction disorder caused by an NKX2-1 mutation are very similar to those of early-onset ILD and neurological involvement, which needs to be excluded as a differential diagnosis. Unlike in the NKX2-1 mutation, FINCA patients exhibit normal thyroid function."
    explanation: Identifies NKX2-1-related surfactant dysfunction disorder as a differential diagnosis for early-onset ILD with neurological involvement, distinguished by normal thyroid function in FINCA syndrome.

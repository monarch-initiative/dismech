name: Fibrosis, Neurodegeneration, and Cerebral Angiomatosis
creation_date: "2026-10-14T00:00:00Z"
description: >-
  Fibrosis, neurodegeneration, and cerebral angiomatosis (FINCA syndrome) is an
  autosomal recessive multisystem disorder caused by biallelic pathogenic variants
  in NHLRC2. Affected individuals present with variable combinations of
  infantile-onset interstitial lung disease, global developmental delay,
  intellectual disability, hypotonia, seizures, movement disorders, progressive
  cerebral and cerebellar atrophy, cerebral angiomatosis, macrocytic or
  dyserythropoietic anemia, hepatomegaly with hepatic steatosis and fibrosis,
  recurrent infections, and growth failure. While early-onset respiratory failure
  can be fatal in infancy or early childhood, individuals with higher residual
  NHLRC2 protein levels often stabilize respiratory symptoms or present with a
  predominantly neurodevelopmental phenotype surviving into childhood or adulthood.
category: Genetic
parents:
- Autosomal Recessive Disease
- Multisystem Disorder
- Neurodegenerative Disease
synonyms:
- FINCA syndrome
- FINCA disease
- Fibrosis, neurodegeneration, and cerebral angiomatosis

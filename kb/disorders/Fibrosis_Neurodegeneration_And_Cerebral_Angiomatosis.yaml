    reference_title: "Broadening the phenotypic and molecular spectrum of FINCA syndrome: Biallelic NHLRC2 variants in 15 novel individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 15 individuals showed global developmental delay and later intellectual disability (ID), which in most cases was classified as moderate or severe. Nine children were non-verbal at the last assessment, and five could speak only a few rudimentary words. In four cases, speech regression occurred after 1–3 years of age, and the siblings (individual 1 and 2) had motor regression starting from the age of six."
    explanation: Demonstrates universal global developmental delay (15/15 individuals) and severe expressive language impairment in the 15-patient cohort.
  - reference: PMID:39328589
    reference_title: "Case Report: Clinical manifestations and treatment of two Chinese patients with FINCA syndrome carrying a novel variant of NHLRC2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 31 FINCA patients, including our newly reported patients, 14 patients (45.2%) were boys (1, 10–14). All FINCA patients experienced neurological symptoms including developmental delay, intellectual disability, behavior problems, movement disorder, hypotonia, dystonia, and seizures, among others"
    explanation: Confirms that neurological symptoms including developmental delay occur across all 31 reviewed FINCA patients.


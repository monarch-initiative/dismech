  - reference: PMID:30239752
    reference_title: "Biallelic mutations in human NHLRC2 enhance myofibroblast differentiation in FINCA disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transmission electron microscopy analysis of immortalized cell cultures from three FINCA patients demonstrated multilamellar bodies and distinctly organized vimentin filaments. Additionally, two of three cultures derived from patient skin biopsies contained cells that exhibited features characteristic of myofibroblasts."
    explanation: Shows multilamellar bodies and abnormal vimentin cytoskeleton organization in FINCA patient fibroblasts.
  - reference: PMID:40510178
    reference_title: "Altered behaviour and immune response in mice with NHLRC2 p.Asp148Tyr variant."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FINCA mice exhibited hyperactivity and decreased exploration of new object in adolescence, and an altered innate immune response, particularly in interferon γ production. By comparing p.Asp148Tyr-induced changes in gene expression in mouse cells and putative interaction partners in human cells, we identified Rho GTPase signalling as a common affected pathway."
    explanation: Identifies Rho GTPase signaling as a conserved pathway disrupted by the FINCA p.Asp148Tyr variant across mouse and human cells.
  - reference: PMID:37179546
    reference_title: "Novel patients with NHLRC2 variants expand the phenotypic spectrum of FINCA disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "In addition, NHLRC2 associates with p190RhoGAP and alters the activation levels of the cytoskeleton regulator RhoA (Haney et al., 2018)."
    explanation: Connects NHLRC2 association with p190RhoGAP to RhoA cytoskeletal regulation.
  downstream:
  - target: Enhanced Fibroblast-to-Myofibroblast Differentiation
    description: >-
      Altered cytoskeletal organization, vesicle transport, and vimentin/IL-1beta
      regulation drive excessive fibroblast-to-myofibroblast differentiation.
  - target: Macrophage Morphological Defect and Impaired Phagocytosis
    description: >-
      Disrupted cytoskeletal remodeling prevents filopodia formation and
      phagocytic cup assembly in macrophages while promoting hyperinflammatory
      responses.
  - target: Dyserythropoiesis and Multinucleated Erythroblast Formation
    description: >-
      Perturbed RhoA-dependent cytoskeletal dynamics during erythroid maturation
      leads to bi- and multinucleated erythroblasts and macrocytic anemia.
  - target: Cerebral Angiomatosis
    description: >-
      Disrupted cytoskeletal and junctional organization in cerebral vasculature
      promotes angiomatosis-like leptomeningeal and cortical vascular proliferation.
  - target: Malabsorption
    description: >-
      Impaired cellular organization and vesicular transport in intestinal
      mucosa contribute to infantile malabsorption.
  - target: Failure to thrive
    description: >-
      Multisystem cellular dysfunction and intestinal malabsorption drive
      progressive postnatal growth failure.

- name: Enhanced Fibroblast-to-Myofibroblast Differentiation
  description: >-
    Compound heterozygous NHLRC2 mutations promote premature differentiation
    of fibroblasts into alpha-SMA-positive myofibroblasts and fail to restrain
    vimentin and IL-1beta expression, driving excessive extracellular matrix
    and collagen deposition across parenchymal organs.

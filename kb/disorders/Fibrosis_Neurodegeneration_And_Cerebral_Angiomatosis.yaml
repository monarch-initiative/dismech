    snippet: "Development of the Nhlrc2 null mouse strain stalled before the morula stage."
    explanation: Demonstrates pre-morula embryonic lethality in homozygous Nhlrc2 null mice.

mechanistic_hypotheses:
- hypothesis_group_id: ros_caspase8_apoptosis_hypothesis
  hypothesis_label: ROS-Induced Caspase-8 Mediated Apoptosis in FINCA Neurodegeneration
  status: EMERGING
  description: >-
    In vitro studies in human HCT116 colon carcinoma cells showed that the
    thioredoxin-like domain of NHLRC2 binds pro-caspase-8, that ROS trigger
    caspase-8-mediated cleavage of NHLRC2 at Asp580, and that NHLRC2 loss
    sensitizes cells to ROS-induced apoptosis. While this mechanism has been
    proposed as a candidate driver of parenchymal and neuronal cell loss in
    FINCA syndrome, direct demonstration in patient neurons or FINCA animal
    brain tissue remains to be established.
  evidence:
  - reference: PMID:29242562
    reference_title: "ROS-induced cleavage of NHLRC2 by caspase-8 leads to apoptotic cell death in the HCT116 human colon cancer cell line."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the thioredoxin-like domain of NHLRC2 interacted with a proenzyme form of caspase-8, and that caspase-8 cleaved NHLRC2 protein at Asp580 in vitro. Furthermore, siRNA-mediated knockdown of caspase-8 blocked the ROS-induced decrease in NHLRC2 protein levels. Both shRNA and CRISPR-Cas9-mediated loss of NHLRC2 resulted in an increased susceptibility of HCT116 cells to ROS-induced apoptosis."
    explanation: Establishes the in vitro interaction between NHLRC2 and pro-caspase-8 and increased susceptibility to ROS-induced apoptosis in HCT116 cells.


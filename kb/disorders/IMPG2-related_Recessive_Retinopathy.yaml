name: IMPG2-related Recessive Retinopathy
creation_date: "2026-11-02T23:30:00Z"
category: Mendelian
description: >-
  IMPG2-related recessive retinopathy is an inherited retinal disease caused by
  biallelic pathogenic variants in IMPG2, which encodes interphotoreceptor
  matrix proteoglycan 2 (SPACRCAN, also IPM200), one of the two large
  chondroitin-sulfate proteoglycans of the interphotoreceptor matrix (IPM) that
  fills the subretinal space around photoreceptor outer segments. Unlike its
  paralog IMPG1 (SPACR), IMPG2 carries a putative transmembrane domain and sits
  at the inner-segment side of the matrix, where it is required for IMPG1 to be
  positioned correctly in the outer-segment compartment. The predominant
  recessive presentation is an early-onset retinitis pigmentosa (RP56) with
  progressive visual-field loss and loss of visual acuity; the single reported
  recessive patient carrying a missense allele presented instead with a
  maculopathy. Reported biallelic alleles are mostly null
  (nonsense, genomic deletion) with occasional missense alleles, and a
  SEA-domain deletion allele is retained in the endoplasmic reticulum in vitro.
  Only a small number of biallelic families have been reported, and no
  disease-specific treatment exists.
notes: >-
  Scope. This entry is the ClinGen Retina GCEP recessive entity (biallelic IMPG2
  loss of function), whose core is early-onset retinitis pigmentosa (RP56). The
  separate IMPG2-related vitelliform macular dystrophy reported in some families
  is autosomal dominant (a single heterozygous missense allele) and is a
  different entity not covered here; within the recessive spectrum a maculopathy
  is documented in the founding missense patient. No IMPG2-specific GeneReviews
  chapter exists; the gene is covered only within the gene-agnostic Nonsyndromic
  Retinitis Pigmentosa Overview (NBK1417, PMID:20301590), which is not used here
  as a phenotype baseline.

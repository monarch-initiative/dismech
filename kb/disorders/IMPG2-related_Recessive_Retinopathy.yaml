inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic IMPG2 variants; the founding families were
    consanguineous or had homozygous variants cosegregating with disease, and
    ClinGen classifies the recessive IMPG2-disease relationship as Definitive.
  evidence:
  - reference: PMID:20673862
    reference_title: Mutations in IMPG2, encoding interphotoreceptor matrix proteoglycan 2, cause autosomal-recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of IMPG2 in the two index cases revealed homozygous mutations cosegregating with the disease in the respective families"
    explanation: >-
      The founding report identified homozygous IMPG2 variants cosegregating
      with disease in the index families, establishing recessive inheritance.

genetic:
- name: IMPG2
  gene_term:
    preferred_term: IMPG2
    term:
      id: hgnc:18362
      label: IMPG2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic germline variants: a homozygous nonsense mutation in an Iraqi
    Jewish family, a homozygous 1.8 kb genomic deletion removing exon 9 and
    seven amino acids of a conserved SEA domain in a Dutch family, four further
    nonsense mutations, and a missense mutation affecting a conserved
    phenylalanine. ClinGen scored the recessive IMPG2 relationship as Definitive.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_66bf5526-6f74-473b-b2f9-3e3270164bc8-2023-08-03T160000.000Z
    evidence:
    - reference: CGGV:assertion_66bf5526-6f74-473b-b2f9-3e3270164bc8-2023-08-03T160000.000Z
      reference_title: IMPG2 / IMPG2-related recessive retinopathy (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "IMPG2 | HGNC:18362 | IMPG2-related recessive retinopathy | MONDO:0700241 | AR | Definitive"
      explanation: ClinGen gene-disease validity record classifying this pair as Definitive.
  evidence:
  - reference: PMID:28644393
    reference_title: "Mutations in the Genes for Interphotoreceptor Matrix Proteoglycans, IMPG1 and IMPG2, in Patients with Vitelliform Macular Lesions."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive mutations in the IMPG2 gene were identified to be causally associated with early-onset retinitis pigmentosa (RP)"
    explanation: >-
      Confirms biallelic IMPG2 variants as a cause of early-onset recessive
      retinitis pigmentosa.
  variants:
  - name: Homozygous SEA-domain deletion (exon 9, 7 amino acids)
    description: >-
      A homozygous 1.8 kb genomic deletion removing exon 9 and seven amino acids
      of a conserved SEA domain; the mutant protein is retained in the
      endoplasmic reticulum in a cell-based assay, consistent with loss of
      function.
    evidence:
    - reference: PMID:20673862
      reference_title: Mutations in IMPG2, encoding interphotoreceptor matrix proteoglycan 2, cause autosomal-recessive retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the mutant lacking the seven amino acids appears to be retained in the endoplasmic reticulum"
      explanation: >-
        COS-1 transfection showed the SEA-domain-deletion mutant is retained in
        the ER rather than reaching the plasma membrane, a loss-of-function
        effect.

pathophysiology:
- name: Biallelic IMPG2 Loss of Function
  description: >-
    Both IMPG2 alleles carry a null variant (nonsense, genomic deletion) or a
    missense variant, so photoreceptors make little or no functional SPACRCAN.
    The SEA-domain-deletion allele is retained in the endoplasmic reticulum in
    vitro rather than reaching the cell surface, and IMPG2 is a structural
    constituent of the interphotoreceptor matrix.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: IMPG2
    term:
      id: hgnc:18362
      label: IMPG2
  molecular_functions:
  - preferred_term: interphotoreceptor matrix structural constituent
    modifier: DECREASED
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:20673862
    reference_title: Mutations in IMPG2, encoding interphotoreceptor matrix proteoglycan 2, cause autosomal-recessive retinitis pigmentosa.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The IMPG2 gene encodes the interphotoreceptor matrix proteoglycan IMPG2, which is a constituent of the interphotoreceptor matrix."
    explanation: >-
      IMPG2 is a structural constituent of the IPM, the molecular function that
      biallelic null alleles remove.
  - reference: CGGV:assertion_66bf5526-6f74-473b-b2f9-3e3270164bc8-2023-08-03T160000.000Z
    reference_title: IMPG2 / IMPG2-related recessive retinopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IMPG2 | HGNC:18362 | IMPG2-related recessive retinopathy | MONDO:0700241 | AR | Definitive"
    explanation: >-
      ClinGen classifies biallelic IMPG2 loss of function as a Definitive cause
      of this recessive retinopathy.
  downstream:
  - target: Interphotoreceptor Matrix Disorganization
    causal_link_type: DIRECT
    description: >-
      SPACRCAN is one of the two main chondroitin-sulfate proteoglycans that
      build the IPM; without it the matrix scaffold is not assembled normally.
    evidence:
    - reference: PMID:28644393
      reference_title: "Mutations in the Genes for Interphotoreceptor Matrix Proteoglycans, IMPG1 and IMPG2, in Patients with Vitelliform Macular Lesions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "IMPG1 and IMPG2 bind HA and that this interaction stabilizes or modulates the IPM scaffold"
      explanation: >-
        IMPG2, with IMPG1, binds hyaluronan to stabilize the IPM scaffold, so
        its loss destabilizes the matrix.
- name: Interphotoreceptor Matrix Disorganization
  description: >-
    IMPG2 occupies the inner-segment side of the IPM and, with IMPG1, supplies
    most of its chondroitin sulfate and the cone glycocalyx. IMPG2 at the inner
    segment is required to position IMPG1 in the outer-segment compartment, so
    loss of IMPG2 disrupts the organization of the matrix.
  biological_scale: TISSUE
  cellular_components:
  - preferred_term: interphotoreceptor matrix
    term:
      id: GO:0033165
      label: interphotoreceptor matrix
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In normal retina, IMPG1 and IMPG2 occupy distinct IPM compartments, represent the main source of chondroitin sulfate and are fundamental for the constitution of the cone-specific glycocalyx stained by the PNA (peanut agglutinin) lectin marker."
    explanation: >-
      Knockout mice show IMPG2 is a main source of IPM chondroitin sulfate and
      is needed for the cone glycocalyx.
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IMPG2 proteoglycan present at the IS is required for the localization of IMPG1 in the OS"
    explanation: >-
      Inner-segment IMPG2 is required to localize IMPG1 to the outer segment,
      so losing IMPG2 disorganizes the matrix.
  downstream:
  - target: Subretinal Material Accumulation
    causal_link_type: DIRECT
    description: >-
      Without IMPG2 to position it, IMPG1 is no longer confined to the
      outer-segment matrix and accumulates abnormally in the subretinal space.
    evidence:
    - reference: PMID:32265257
      reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the absence of IMPG2, IMPG1 abnormally accumulated at the subretinal space"
      explanation: >-
        In IMPG2 knockout mice, IMPG1 mislocalizes and accumulates in the
        subretinal space.
- name: Subretinal Material Accumulation
  description: >-
    Mislocalized IMPG1 accumulates between the photoreceptor outer segments and
    the retinal pigment epithelium, forming subretinal lesions and activating
    microglia, with a decrease in visual function. In patients this corresponds
    to the subretinal/vitelliform material seen in the maculopathy presentation.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IMPG1 accumulated between the OS and RPE leading to subretinal lesions, microglial activation, and a decrease in visual function"
    explanation: >-
      The IMPG2 knockout defines the route from matrix defect to subretinal
      lesions and reduced visual function.
  downstream:
  - target: Photoreceptor Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Maculopathy
    causal_link_type: DIRECT
- name: Photoreceptor Degeneration
  description: >-
    Rod and cone photoreceptors degenerate, producing the early-onset retinitis
    pigmentosa that is the predominant recessive presentation, with progressive
    visual-field loss and loss of visual acuity.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    modifier: DECREASED
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
  evidence:
  - reference: PMID:20673862
    reference_title: Mutations in IMPG2, encoding interphotoreceptor matrix proteoglycan 2, cause autosomal-recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients with IMPG2 mutations showed an early-onset form of RP with progressive visual-field loss and deterioration of visual acuity."
    explanation: >-
      Biallelic IMPG2 patients predominantly show early-onset rod-cone
      degeneration with field loss and declining acuity.
  - reference: PMID:32817297
    reference_title: Pathogenic variants in IMPG1 cause autosomal dominant and autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using morpholino-mediated ablation of Impg1 and its paralog Impg2 in medaka fish, we confirmed a phenotype consistent with that observed in the families, including a decreased length of rod and cone photoreceptor outer segments."
    explanation: >-
      Morpholino knockdown of impg2 in medaka shortens rod and cone outer
      segments, a model correlate of the photoreceptor defect.
  downstream:
  - target: Rod-cone dystrophy
    causal_link_type: DIRECT
  - target: Constriction of peripheral visual field
    causal_link_type: DIRECT
  - target: Reduced visual acuity
    causal_link_type: DIRECT


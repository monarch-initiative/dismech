animal_models:
- name: Impg2 knockout mouse (Salido and Ramamurthy 2020)
  species: Mouse
  genotype: Impg2-/- (CRISPR-Cas9 global knockout)
  background: C57BL/6J
  publication: PMID:32265257
  description: >-
    Global Impg2 knockout in which IMPG1 fails to localize to the outer-segment
    matrix and instead accumulates between the outer segments and the RPE,
    producing subretinal lesions, microglial activation and reduced visual
    function; the double Impg1/Impg2 knockout is normal, showing the mislocalized
    IMPG1 drives the phenotype.
  evidence:
  - reference: PMID:32265257
    reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking both IMPG1 and IMPG2, regardless of sex, showed normal retinal structure and function, demonstrating that the aberrant IMPG1 distribution is the main cause of the visual alterations observed in the absence of IMPG2"
    explanation: >-
      The double knockout rescues the phenotype, establishing mislocalized IMPG1
      as the cause of the deficits when IMPG2 is absent.
  modeled_mechanisms:
  - target: Subretinal Material Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Mislocalized IMPG1 accumulates between outer segments and RPE as subretinal lesions.
    limitations: >-
      Mice have no macula, so lesions are not confined to a central vitelliform
      focus; the phenotype is driven by mislocalized mouse IMPG1 rather than by a
      patient IMPG2 allele.
    evidence:
    - reference: PMID:32265257
      reference_title: Proteoglycan IMPG2 Shapes the Interphotoreceptor Matrix and Modulates Vision.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the absence of IMPG2, IMPG1 abnormally accumulated at the subretinal space"
      explanation: Places the accumulated material in the same subretinal compartment as the human lesion.
- name: impg2 morpholino knockdown medaka
  species: Medaka
  genotype: impg2 morpholino knockdown
  publication: PMID:32817297
  description: >-
    Transient morpholino ablation of impg2 (and, separately, impg1) in medaka
    embryos shortened rod and cone outer segments.
  evidence:
  - reference: PMID:32817297
    reference_title: Pathogenic variants in IMPG1 cause autosomal dominant and autosomal recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using morpholino-mediated ablation of Impg1 and its paralog Impg2 in medaka fish, we confirmed a phenotype consistent with that observed in the families, including a decreased length of rod and cone photoreceptor outer segments."
    explanation: Outer-segment shortening after impg2 knockdown in fish.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Shortened rod and cone outer segments in embryonic retina.
    limitations: >-
      Transient knockdown in developing fish retina reports outer-segment length
      only and does not model the adult-onset progressive course.

discussions:
- discussion_id: impg2_rp_versus_maculopathy
  prompt: >-
    What determines whether biallelic IMPG2 loss of function presents as
    early-onset retinitis pigmentosa or as a maculopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Rod-cone dystrophy
  - phenotypes#Maculopathy
  rationale: >-
    In the founding cohort the null alleles (nonsense, genomic deletion)
    produced retinitis pigmentosa, while the single patient carrying a missense
    allele presented with a maculopathy, hinting that residual IMPG2 function
    may shift the presentation. With only one recessive missense patient
    reported, no genotype-phenotype rule separating the two has been
    established.
  evidence:
  - reference: PMID:20673862
    reference_title: Mutations in IMPG2, encoding interphotoreceptor matrix proteoglycan 2, cause autosomal-recessive retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient with the missense mutation, however, was diagnosed with maculopathy."
    explanation: >-
      The founding report contrasts the maculopathy of the missense patient with
      the retinitis pigmentosa of the null-allele patients, the observation
      behind this open question.


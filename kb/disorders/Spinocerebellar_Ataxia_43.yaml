name: Spinocerebellar Ataxia 43
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: spinocerebellar ataxia 43
  term:
    id: MONDO:0014867
    label: spinocerebellar ataxia 43
description: >
  Spinocerebellar ataxia type 43 (SCA43) is a rare autosomal dominant, late adult-onset,
  slowly progressive cerebellar ataxia caused by heterozygous pathogenic variants in MME,
  the gene encoding neprilysin (NEP), a zinc-dependent membrane metalloendopeptidase. The
  disorder was first defined in a 5-generation Belgian family carrying the p.C143Y variant.
  It is distinguished among the spinocerebellar ataxias by the consistent co-occurrence of a
  late-onset, motor-predominant axonal sensorimotor polyneuropathy with cerebellar signs.
  Cerebellar features include gait and limb ataxia, dysarthria, hypometric
  saccades, tremor, and cerebellar vermis atrophy; the peripheral phenotype comprises
  reduced or absent deep tendon reflexes, distal sensory loss, distal amyotrophy, pes cavus,
  and lower limb pain. Recessive MME loss-of-function variants cause a purely peripheral
  axonal Charcot-Marie-Tooth disease type 2 (CMT2T) without cerebellar involvement, so the
  dominant, cerebellum-involving mechanism of SCA43 remains only partly understood.

inheritance:
- name: Autosomal dominant inheritance
  description: >
    SCA43 is transmitted as an autosomal dominant trait, first established by cosegregation
    of the MME p.C143Y variant across a 5-generation Belgian pedigree. Dominant MME variants
    show age-related incomplete penetrance. This contrasts with the biallelic (autosomal
    recessive) MME loss-of-function variants that cause a purely peripheral CMT2T neuropathy.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation of the mutation with the phenotype was confirmed by Sanger sequencing"
    explanation: The MME p.C143Y variant cosegregated with disease in an autosomal dominant pedigree.

pathophysiology:
- name: Neprilysin (MME) Dysfunction
  biological_scale: MOLECULAR
  description: >
    SCA43 is caused by variants in MME, which encodes neprilysin (NEP), a zinc-dependent
    membrane metalloendopeptidase of the M13 subfamily. The prototypical dominant variant
    p.C143Y substitutes a cysteine that forms a conserved disulfide bridge (Cys143-Cys411)
    in the extracellular peptidase domain, disrupting the enzyme's structure. Because
    recessive complete loss-of-function alleles cause only peripheral neuropathy,
    haploinsufficiency is considered an unlikely mechanism for the dominant,
    cerebellum-involving SCA43 phenotype; a dominant-negative or altered-activity effect is proposed.
    Dominant MME variants more broadly reduce neprilysin tissue availability and enzymatic
    activity.
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
    modifier: DECREASED
  downstream:
  - target: Impaired Neuropeptide Catabolism
    description: >-
      Reduced neprilysin metalloendopeptidase activity impairs catabolism of its
      neuropeptide substrates (including dynorphins), the proposed route to cerebellar involvement.
    evidence:
    - reference: PMID:27583304
      reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NEP acts on many substrates, including neuropetides such as glucagon, enkephalins, cholecystokinin, neuropeptide Y, substance P, somatostatin, neurotensin, oxytocin, prodynorphin and bradykinin"
      explanation: Establishes neprilysin as the catabolic enzyme for these neuropeptides, so reduced NEP activity impairs their catabolism.
  - target: Peripheral Axonal Degeneration
    description: >-
      Loss of Schwann-cell / axonal neprilysin function drives the length-dependent
      axonal sensorimotor polyneuropathy.
    evidence:
    - reference: PMID:27583304
      reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in the PNS, the expression is mostly in Schwann cells"
      explanation: Neprilysin is expressed by peripheral-nerve Schwann cells, linking its loss to the axonal neuropathy.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MME encodes neprilysin (NEP), a zinc-dependent metalloprotease"
    explanation: Identifies MME/neprilysin as the SCA43 disease gene and its enzymatic identity.
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the identification of recessive mutations, some leading to complete loss of the MME expression,3 makes haploinsufficiency an unlikely mechanism"
    explanation: Supports a dominant-negative rather than haploinsufficiency mechanism for the p.C143Y variant.
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MME mutations resulted in strongly decreased tissue availability of neprilysin and impaired enzymatic activity"
    explanation: >-
      Ex vivo/biochemical study of patient tissue showing dominant MME variants reduce
      neprilysin protein levels and enzymatic activity.

- name: Impaired Neuropeptide Catabolism
  biological_scale: MOLECULAR
  description: >
    Neprilysin cleaves numerous bioactive peptides at the amino side of hydrophobic residues,
    including neuropeptides such as prodynorphin-derived dynorphins, enkephalins, substance P,
    neuropeptide Y, somatostatin, neurotensin, and bradykinin, as well as amyloid-beta. A
    proposed link to cerebellar degeneration is that prodynorphin, whose products are NEP
    substrates, is mutated in SCA23; altered NEP handling of dynorphin peptides could raise
    dynorphin levels and trigger cerebellar dysfunction, offering a candidate mechanism for
    the cerebellar involvement unique to the dominant phenotype.
  biological_processes:
  - preferred_term: peptide catabolic process
    term:
      id: GO:0043171
      label: peptide catabolic process
    modifier: DECREASED
  - preferred_term: neuropeptide signaling pathway
    term:
      id: GO:0007218
      label: neuropeptide signaling pathway
    modifier: ABNORMAL
  downstream:
  - target: Cerebellar Purkinje and Vermis Degeneration
    description: >-
      Disturbed dynorphin/neuropeptide homeostasis is the leading candidate mechanism
      (by analogy to PDYN-mutated SCA23) for the cerebellar degeneration unique to the
      dominant phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "prodynorphin, the precursor of the opioid neuropetides α-neoendorphin and dynorphins A and B (Dyn A and B), is an NEP substrate, and mutations affecting the prodynorphin (PDYN) gene cause SCA23"
    explanation: Provides the mechanistic hypothesis linking impaired NEP neuropeptide handling to cerebellar (SCA23-like) degeneration.

- name: Peripheral Axonal Degeneration
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >
    Reduced neprilysin function in the peripheral nervous system, where NEP is expressed by
    Schwann cells and transported along axons, produces a length-dependent, motor-predominant
    axonal sensorimotor polyneuropathy. Sural nerve biopsies from MME patients show marked loss
    of large myelinated fibers with a primarily axonal (Charcot-Marie-Tooth type 2) pathology
    and absent or reduced neprilysin immunostaining, without inflammation or onion-bulb
    formation. This axonal degeneration underlies the reduced/absent reflexes, distal sensory
    loss, and distal amyotrophy.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  - preferred_term: axon ensheathment
    term:
      id: GO:0008366
      label: axon ensheathment
    modifier: DECREASED
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual (III-14) underwent sural nerve biopsy, revealing axonal pathology consistent with a Charcot–Marie–Tooth type 2 (CMT2) polyneuropathy"
    explanation: Documents the axonal (CMT2-type) peripheral nerve pathology in SCA43.
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "larger myelinated fibers were markedly decreased in peripheral nerves, and occasionally thin myelin sheaths without onion‐bulb formation were present, suggesting that the pathological process is primarily axonal degeneration"
    explanation: Confirms primary axonal degeneration in nerve biopsies from MME-mutation patients.

- name: Cerebellar Purkinje and Vermis Degeneration
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >
    Unlike recessive MME loss-of-function (which spares the cerebellum), the dominant p.C143Y
    variant causes cerebellar dysfunction and progressive cerebellar vermis atrophy on MRI. The
    mechanism by which altered neprilysin function drives cerebellar neurodegeneration is not
    established; the leading hypothesis invokes disturbed neuropeptide (dynorphin) homeostasis
    analogous to SCA23. Cerebellar cortical output loss produces the ataxia, dysarthria,
    hypometric saccades, and tremor.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed moderate cerebellar vermis atrophy"
    explanation: Documents cerebellar vermis atrophy, the structural correlate of cerebellar degeneration in SCA43.
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the p.C143Y mutation causes cerebellar dysfunction and atrophy"
    explanation: States that the dominant variant, unlike recessive loss-of-function, produces cerebellar degeneration.


genetic:
- name: MME
  gene_term:
    preferred_term: MME
    term:
      id: hgnc:7154
      label: MME
  association: MME Neprilysin Variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:27588448
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MME mutations segregated in an autosomal-dominant fashion with age-related incomplete penetrance"
      explanation: Confirms autosomal dominant transmission of MME variants with age-related incomplete penetrance.
  notes: >
    MME encodes neprilysin (NEP/CD10), a zinc-dependent membrane metalloendopeptidase.
    Heterozygous variants cause autosomal dominant SCA43 (prototype p.C143Y, which disrupts a
    conserved Cys143-Cys411 disulfide bridge) and, more broadly, late-onset autosomal dominant
    axonal polyneuropathy with age-related incomplete penetrance. Biallelic loss-of-function
    variants cause autosomal recessive Charcot-Marie-Tooth disease type 2 (CMT2T) confined to
    the peripheral nervous system.
  evidence:
  - reference: PMID:27583304
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a variant in the MME gene, p.C143Y, that was absent from control databases, cosegregated with the phenotype"
    explanation: Establishes MME p.C143Y as the SCA43-causing variant.
  - reference: PMID:26991897
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in the membrane metalloendopeptidase (MME) gene in 10 unrelated patients with adult‐onset axonal neuropathy"
    explanation: Documents the biallelic (recessive) MME allelic disorder (CMT2T) distinct from dominant SCA43.

treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    No disease-modifying therapy exists for SCA43. Management is supportive, centered on
    physiotherapy, gait/balance rehabilitation, and orthotic support (e.g., ankle-foot
    orthoses for foot drop and pes cavus) to maintain mobility and prevent falls.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: MAXO:0000011
      label: physical therapy

- name: Supportive and Symptomatic Care
  description: >
    Supportive care addresses neuropathic pain and manages complications of the axonal
    neuropathy and cerebellar dysfunction. There is no proven treatment targeting the
    underlying neprilysin defect; whether agents that elevate neprilysin activity could be
    beneficial has been raised only as a hypothesis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:27588448
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it will be tempting to explore whether substances that can elevate neprilysin activity could be a rational option for treatment"
    explanation: Frames neprilysin-elevating therapy as a hypothetical, not yet proven, treatment direction, underscoring that current care is supportive.

- name: Genetic Counseling
  description: >
    Genetic counseling is offered given autosomal dominant inheritance with age-related
    incomplete penetrance, including discussion of the distinct recessive CMT2T allelic disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling


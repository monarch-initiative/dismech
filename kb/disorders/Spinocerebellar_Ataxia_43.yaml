genetic:
- name: MME
  gene_term:
    preferred_term: MME
    term:
      id: hgnc:7154
      label: MME
  association: MME Neprilysin Variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:27588448
      reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MME mutations segregated in an autosomal-dominant fashion with age-related incomplete penetrance"
      explanation: Confirms autosomal dominant transmission of MME variants with age-related incomplete penetrance.
  notes: >
    MME encodes neprilysin (NEP/CD10), a zinc-dependent membrane metalloendopeptidase.
    Heterozygous variants cause autosomal dominant SCA43 (prototype p.C143Y, which disrupts a
    conserved Cys143-Cys411 disulfide bridge) and, more broadly, late-onset autosomal dominant
    axonal polyneuropathy with age-related incomplete penetrance. Biallelic loss-of-function
    variants cause autosomal recessive Charcot-Marie-Tooth disease type 2 (CMT2T) confined to
    the peripheral nervous system.

    Provenance caveat: the expanded movement-disorder phenotypes (tremor, chorea, craniofacial
    dystonia) derive from a single atypical case (PMID:42132968) carrying MME p.Asn689Lys, a
    variant of uncertain significance; that case had normal nerve conduction studies and no
    cerebellar atrophy, so these features should not be over-weighted as core SCA43 findings.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a variant in the MME gene, p.C143Y, that was absent from control databases, cosegregated with the phenotype"
    explanation: Establishes MME p.C143Y as the SCA43-causing variant.
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in the membrane metalloendopeptidase (MME) gene in 10 unrelated patients with adult‐onset axonal neuropathy"
    explanation: Documents the biallelic (recessive) MME allelic disorder (CMT2T) distinct from dominant SCA43.


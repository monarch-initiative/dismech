    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMG performed at ages 69 and 70 demonstrated progressive, severe motor neuropathy in the lower limbs with significantly increased F-response latency but preserved sensory responses"
    explanation: Defines the characteristic axonal, motor-predominant electrophysiologic pattern.
- name: Brain MRI
  presence: Positive
  description: >
    Brain MRI may show cerebellar (especially vermian) atrophy, supporting the cerebellar
    component that distinguishes SCA43 from the purely peripheral recessive MME neuropathy.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed moderate cerebellar vermis atrophy"
    explanation: Imaging finding supporting cerebellar involvement.
- name: Sural nerve biopsy
  presence: Positive
  description: >
    When performed, sural nerve biopsy shows axonal pathology consistent with a Charcot-Marie-Tooth
    type 2 (CMT2) polyneuropathy. Biopsy is not required for diagnosis once molecular testing is available.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealing axonal pathology consistent with a Charcot–Marie–Tooth type 2 (CMT2) polyneuropathy"
    explanation: Nerve biopsy documents the axonal pathology.
- name: MME molecular genetic testing
  presence: Positive
  description: >
    Definitive diagnosis is by identification of a pathogenic MME variant (targeted, panel, or
    exome sequencing), typically after exclusion of the common repeat-expansion dominant ataxias.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a mutation in the MME gene as the causative of the disease"
    explanation: Molecular identification of the MME variant establishes the diagnosis.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    SCA43 is exceptionally rare. It was defined in a single 5-generation Belgian kindred, with
    only a small number of subsequent reports; no formal prevalence or incidence estimate exists.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identifying a novel SCA genotype (SCA43) as well as a novel phenotype associated with a specific MME mutation"
    explanation: Documents SCA43 as a newly defined, single-family genotype, underscoring its rarity.

progression:
- phase: Onset and course
  age_range: 42-72 years
  notes: >-
    Adult-onset (reported 42-68 years for initial balance problems) with slow progression of
    combined cerebellar ataxia and axonal sensorimotor polyneuropathy.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with late-onset (42–68 years old) balance problems"
    explanation: Establishes the adult-onset, slowly progressive course.

histopathology:
- name: Axonal (CMT2-type) sural nerve pathology
  description: >
    Sural nerve pathology in MME-related neuropathy shows marked loss of large myelinated fibers
    with a primarily axonal degenerative process, without inflammation or onion-bulb formation;
    neprilysin immunostaining is absent or reduced.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "larger myelinated fibers were markedly decreased in peripheral nerves, and occasionally thin myelin sheaths without onion‐bulb formation were present, suggesting that the pathological process is primarily axonal degeneration"
    explanation: Documents the axonal-degeneration nerve histopathology of MME-related neuropathy.

treatments:
- name: Physical Therapy and Rehabilitation
  description: >
    No disease-modifying therapy exists for SCA43. Management is supportive, centered on
    physiotherapy, gait/balance rehabilitation, and orthotic support (e.g., ankle-foot
    orthoses for foot drop and pes cavus) to maintain mobility and prevent falls.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy

- name: Supportive and Symptomatic Care
  description: >
    Supportive care addresses neuropathic pain and manages complications of the axonal
    neuropathy and cerebellar dysfunction. There is no proven treatment targeting the
    underlying neprilysin defect; whether agents that elevate neprilysin activity could be
    beneficial has been raised only as a hypothesis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it will be tempting to explore whether substances that can elevate neprilysin activity could be a rational option for treatment"
    explanation: Frames neprilysin-elevating therapy as a hypothetical, not yet proven, treatment direction, underscoring that current care is supportive.

- name: Genetic Counseling
  description: >
    Genetic counseling is offered given autosomal dominant inheritance with age-related
    incomplete penetrance, including discussion of the distinct recessive CMT2T allelic disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

discussions:
- discussion_id: sca43_mme_mouse_model_mismatch
  prompt: >-
    Do existing Mme mouse models faithfully recapitulate SCA43, and would a
    p.C143Y knock-in reproduce the human dominant cerebellar-plus-neuropathy
    phenotype, or do interspecific differences limit their translational validity?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Peripheral Axonal Degeneration
  - pathophysiology#Cerebellar Purkinje and Vermis Degeneration
  rationale: >-
    Evidence for a model-to-human mismatch already exists rather than being
    merely absent: existing Mme knockout mice, which should in principle model
    the human recessive loss-of-function polyneuropathy, do not develop a severe
    axonal neuropathy, pointing to important interspecific differences. The
    original authors therefore judged that even a p.C143Y knock-in mouse carries
    a high risk of failing to recapitulate the human phenotype. This makes the
    translational validity of any murine SCA43 model — not the presence or
    absence of a phenotype per se — the open question, which matters because the
    dominant, cerebellum-involving mechanism can only be resolved in a model that
    reproduces the human disease.
  evidence:
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Existing Mme knockout mice should in principle model human recessive polyneuropathy cases, but interestingly they do not develop a severe axonal neuropathy, suggesting important interspecific differences."
    explanation: >-
      Documents that the available Mme mouse model fails to reproduce the human
      peripheral phenotype, establishing a model-organism-to-human mismatch.
  - reference: PMID:27583304
    reference_title: "MME mutation in dominant spinocerebellar ataxia with neuropathy (SCA43)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "there is a high risk that a mouse model carrying the p.C143Y mutation, obtained by classical knock-in approaches or by genome editing, would also not recapitulate the human phenotype associated with this mutation"
    explanation: >-
      The authors explicitly anticipate that a p.C143Y knock-in mouse may not
      recapitulate the human SCA43 phenotype, framing the translational-validity gap.
  proposed_experiments:
  - experiment_id: exp_sca43_c143y_knockin_phenotyping
    name: Deep phenotyping of a p.C143Y MME knock-in model
    description: >-
      Generate a p.C143Y Mme knock-in mouse (and patient-derived iPSC neuronal /
      Schwann-cell models) and deep-phenotype for cerebellar Purkinje degeneration,
      vermis atrophy, and length-dependent axonal sensorimotor neuropathy,
      comparing directly against the documented human SCA43 phenotype to test
      whether the dominant cerebellar-plus-neuropathy picture is reproduced.
    experiment_type:
      preferred_term: knock-in mouse phenotyping experiment
    readouts:
    - name: Cerebellar degeneration and axonal neuropathy
      target: pathophysiology#Cerebellar Purkinje and Vermis Degeneration
      assays:
      - preferred_term: histopathology
      - preferred_term: nerve conduction study
      direction: POSITIVE


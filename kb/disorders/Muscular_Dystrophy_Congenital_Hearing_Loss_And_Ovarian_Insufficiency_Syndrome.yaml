    explanation: Names episodic creatine kinase elevation as part of the syndrome's recognisable phenotype.
- name: Respiratory Insufficiency
  category: Respiratory
  description: >-
    Restrictive respiratory failure from weakness of the respiratory muscles, requiring
    non-invasive ventilation and in the most severely affected patients tracheostomy. It

histopathology:
- name: Dystrophic muscle with excess autophagic material and enlarged mitochondria
  description: >-
    Biopsies from nine patients showed a dystrophic process with degeneration, regeneration
    and internalised nuclei, occasional rimmed vacuoles, and irregular oxidative staining
    with core-like regions; ragged red and cytochrome-oxidase-negative fibers were seen in
    one patient. Electron microscopy added excess autophagic material including myeloid
    bodies, positive LC3B staining, and enlarged but structurally normal mitochondria.
    The combination of a dystrophic pattern with disordered autophagy is what makes the
    biopsy suggestive rather than merely non-specific.
  notes: >-
    Deliberately incomplete. The rimmed vacuoles, the core-like regions, the ragged red and
    COX-negative fibers and the LC3B positivity are all stated in PMID:32403198, and the
    quotations below cover the dystrophic pattern and the ultrastructural findings. A
    curator adding the finer features should quote them from the same paper rather than
    from this description. Note also PMID:35869884's observation that one patient biopsied
    at eight months showed neither dystrophic change nor fatty infiltration, which that
    paper attributes to the early age at biopsy; a normal early biopsy therefore does not
    exclude the diagnosis.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology was dystrophic, with evidence of degeneration and regeneration and internalized nuclei."
    explanation: The light-microscopic dystrophic pattern.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy revealed ultrastructural evidence of enlarged but structurally normal mitochondria (Patient P8) as well as evidence of excess autophagic material (Patients P1 and P8; Fig 2)."
    explanation: The ultrastructural findings that distinguish this biopsy from a purely sarcolemmal dystrophy.
biochemical:
- name: Normal Muscle Coenzyme Q10
  biomarker_term:
    preferred_term: Decreased level of coenzyme Q10 in skeletal muscle
    term:
      id: HP:0034369
      label: Decreased level of coenzyme Q10 in skeletal muscle
  presence: Absent (measured and normal)
  notes: >-
    A negative biochemical finding, and a useful one. GGPP feeds the ubiquinone branch of
    the isoprenoid pathway as well as the prenylation branch, so coenzyme Q10 deficiency is
    the obvious alternative mechanism and would carry a directed treatment. Muscle coenzyme
    Q10 was normal in the one patient measured, and an empirical oral coenzyme Q10 trial in
    another produced no improvement. The item is bound to the HPO term for the abnormality
    that was looked for and not found (`HP:0034369`, decreased muscle coenzyme Q10), with
    `presence` recording that it was absent; this is a negative finding curated as one,
    not an assertion that patients are coenzyme Q10 deficient. One patient measured and one
    patient treated is thin evidence either way.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The CoQ10 level in muscle was determined to be normal in Patient P1."
    explanation: >-
      Graded REFUTE against the claim that this disease is a muscle coenzyme Q10 deficiency
      state, which is the claim this biochemical item exists to test.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient P3 was given an empirical treatment trial of oral CoQ10, which did not result in any noted improvement of symptoms."
    explanation: >-
      The corresponding therapeutic test, also negative. One uncontrolled patient is weak
      evidence, but it is the only evidence there is.
- name: Elevated Serum Follicle-Stimulating Hormone
  biomarker_term:
    preferred_term: Elevated circulating follicle stimulating hormone level
    term:
      id: HP:0008232
      label: Elevated circulating follicle stimulating hormone level
  presence: INCREASED
  notes: >-
    Menopausal-range FSH is what makes the ovarian insufficiency hypergonadotropic and so
    primary rather than central. Reported values in the founding cohort were 88.2, 50.3 and
    53.2 IU/l in the three postpubertal women assessed.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary ovarian insufficiency, also known as premature ovarian failure, has been diagnosed in all postpubertal females in this cohort, as confirmed by menopausal levels of follicle‐stimulating hormone (FSH) in the setting of a history of amenorrhea"
    explanation: Gives the measured FSH values and the diagnostic use made of them.
genetic:
- name: GGPS1 (geranylgeranyl diphosphate synthase 1)
  gene_term:
    preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The only gene associated with this disease and the only causal gene MONDO links to
    MONDO:0859189. All reported disease alleles are missense; no biallelic null genotype has
    been reported and none is expected, since complete inactivation of GGPPS is incompatible
    with multicellular survival and the mouse null is not viable. Four of the five founding
    alleles cluster within five residues at the start of helix 11, on the outer surface of
    the hexamer rather than in the catalytic barrel, and that domain is conserved in animals
    but not in plants, which the discovery authors read as evidence for an animal-specific
    function beyond bulk catalysis. A separate, monoallelic GGPS1 association with
    bisphosphonate-related atypical femoral fracture exists and is a different claim
    entirely; see `differential_diagnoses` and the entry notes.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report specific mutations in the gene GGPS1 coding for the enzyme geranylgeranyl diphosphate synthase in 11 patients from 6 families, causing a highly distinctive syndrome of early onset muscular dystrophy combined with congenital sensorineural hearing loss and primary ovarian insufficiency in females."
    explanation: Establishes GGPS1 causality across eleven patients in six families.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic variants fell within a specific 5 amino acid region toward the C terminus around the start of helix 11, with as of yet unclear function"
    explanation: Characterises the positional clustering that defines the allelic spectrum.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe 11 affected individuals from four unpublished families with ultra-rare missense variants in GGPS1 and provide follow-up details from a previously reported family."
    explanation: Independent replication of GGPS1 causality in four further previously unreported families.
variants:
- name: NM_004837.4 p.(Tyr259Cys)
  description: >-
    Carried in compound heterozygosity with R261G by the two index siblings. It has the
    highest in-silico damage score of the founding alleles, which is why it was chosen for
    the mouse knock-in, and the resulting homozygous animals die in utero.
  gene:
    preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  type: missense variant
  clinical_significance: PATHOGENIC
  functional_effects:
  - function: geranylgeranyl diphosphate synthase catalytic activity
    type: partial loss of function
    description: Retains roughly 70 to 85% of wild-type activity as recombinant protein.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "consistently showed a reduced rate of activity of approximately 70 to 85% of wild‐type"
    explanation: Reports the partial activity retained by this and the other C-terminal alleles.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "homozygote Y259C knock‐in embryos developed up to embryonic day (ED)12.5, with no live embryos observed after this point."
    explanation: The embryonic lethality of the homozygous knock-in, which is the strongest evidence that this allele is severely hypomorphic.
- name: NM_004837.4 p.(Arg261Gly) and p.(Arg261His)
  description: >-
    Two substitutions at the same residue. R261G was found in compound heterozygosity in two
    families, and R261H homozygously in two families whose patients had the mildest motor
    phenotype, retaining independent ambulation into adulthood while still having
    sensorineural hearing loss and ovarian insufficiency. Both are ultra-rare in gnomAD.
  gene:
    preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  type: missense variant
  functional_effects:
  - function: geranylgeranyl diphosphate synthase catalytic activity
    type: partial loss of function
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "consistently showed a reduced rate of activity of approximately 70 to 85% of wild‐type"
    explanation: Measures the residual activity of both R261 substitutions alongside the other alleles.
- name: NM_004837.4 p.(Phe257Cys)
  description: >-
    Homozygous in two families, one with a single affected child and one with three affected
    siblings spanning a moderate-to-severe range, which is an intrafamilial demonstration
    that genotype does not fix severity.
  gene:
    preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  type: missense variant
  functional_effects:
  - function: geranylgeranyl diphosphate synthase catalytic activity
    type: partial loss of function
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "consistently showed a reduced rate of activity of approximately 70 to 85% of wild‐type"
    explanation: Reports this allele among those with reduced catalytic rate.
- name: NM_004837.4 p.(Pro15Ser)
  description: >-
    The exception to the C-terminal clustering, and the exception to the activity deficit: it
    lies in the first alpha-helix, which mediates assembly of the hexamer from dimers, and
    it had the same catalytic activity as wild-type in the recombinant assay. It was found
    in compound heterozygosity with R261G. That an allele can cause this disease without
    reducing bulk catalytic rate is the main argument that the pathogenic mechanism is not
    simply loss of enzyme output.
  gene:
    preferred_term: GGPS1
    term:
      id: hgnc:4249
      label: GGPS1
  type: missense variant
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "consistently showed a reduced rate of activity of approximately 70 to 85% of wild‐type"
    explanation: >-
      The same measurement, quoted here for its exclusion of P15S: the reduced-activity
      finding applies to the other four alleles and not to this one.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists for this syndrome and none is asserted. The
    published case count is the honest measure: eleven individuals from six families in the
    2020 defining report, eleven further individuals from four previously unreported families
    in 2022 (whose thirteen-person cohort also included follow-up on two individuals reported
    from a Perrault cohort in 2020), and one further patient in 2024 -- at least
    twenty-three published individuals, in at least twelve families, as of 2026. All
    reported alleles are ultra-rare or absent in gnomAD.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report specific mutations in the gene GGPS1 coding for the enzyme geranylgeranyl diphosphate synthase in 11 patients from 6 families, causing a highly distinctive syndrome of early onset muscular dystrophy combined with congenital sensorineural hearing loss and primary ovarian insufficiency in females."
    explanation: The founding cohort's case count.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe 11 affected individuals from four unpublished families with ultra-rare missense variants in GGPS1 and provide follow-up details from a previously reported family."
    explanation: The second cohort's case count, which is what the total above is built from.
progression:
- phase: Onset
  age_range: prenatal to preschool age
  notes: >-
    Onset ranges from the prenatal period, presenting as decreased fetal movement or a weak
    cry, to preschool age, with a mean age at first symptom of about sixteen months in the
    2022 cohort. Delayed motor milestones are the commonest first presentation, and in the
    milder patients the hearing loss is identified before the weakness.
  evidence:
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease onset ranged from prenatal (3/13) to pre‐schooler age"
    explanation: Gives the onset window and the mean age at first symptom.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensorineural hearing loss was present in all but one patient in this cohort and was the first symptom identified in those patients with milder motor phenotypes."
    explanation: Records that hearing loss is the first symptom identified in the patients with milder motor involvement.
- phase: Progression
  notes: >-
    Two courses rather than one. The severe course runs from progressive weakness and
    contractures to loss of ambulation in the first or second decade, ventilator dependence
    and severe scoliosis; the milder course preserves independent ambulation into adulthood.
    Ninety-two per cent of the 2022 cohort progressed slowly, and six of thirteen lost
    ambulation at a mean of about eight years. Severity of the hearing loss and of the
    ovarian insufficiency does not track with severity of the muscular dystrophy.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, progressive muscle weakness and joint contractures resulting in loss of independent ambulation, respiratory insufficiency necessitating ventilation dependence, and severe scoliosis were seen in Patients P1, P2, P3, and P9, whereas the other patients had a less severe progression of weakness."
    explanation: Separates the severely affected patients from the rest within the same cohort.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six affected individuals lost ambulation at the mean age of 8.1"
    explanation: Quantifies the loss of ambulation in the second cohort.
diagnosis:
- name: Molecular diagnosis by exome or genome sequencing
  description: >-
    The diagnosis is molecular. The syndrome was found by whole exome sequencing combined
    with shared-haplotype analysis in the index siblings, and further families were
    ascertained either by targeted GGPS1 Sanger sequencing on the strength of a suggestive
    phenotype or by exome sequencing. The clinical trigger worth acting on is the
    combination itself: a congenital or early-onset muscular dystrophy with sensorineural
    hearing loss, in a girl or woman with amenorrhoea or infertility, has no other
    recognised genetic cause.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We applied whole exome sequencing (WES) superimposed on shared \nhaplotype regions to identify the initial biallelic variants in GGPS1 followed \nby GGPS1 Sanger sequencing or WES in 5 additional families with the same \nphenotype."
    explanation: Names the sequencing strategy that made the diagnosis in the index family and in five further families.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, GGPS1‐related muscular dystrophy/hearing loss/ovarian insufficiency syndrome is characterized by a remarkably consistent and recognizable phenotype of congenital sensorineural hearing loss, primary ovarian insufficiency in females, proximal muscle weakness with episodes of variably elevated CK, scoliosis, and respiratory insufficiency, in which the symptoms are progressive in nature and can be severe."
    explanation: Describes the recognisable phenotype that should prompt GGPS1 testing.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe 11 affected individuals from four unpublished families with ultra-rare missense variants in GGPS1 and provide follow-up details from a previously reported family."
    explanation: The second cohort was likewise ascertained by sequencing rather than by any biochemical test.
- name: Audiometric assessment
  description: >-
    Formal audiometry, including brainstem auditory evoked response testing in infancy, is
    what identifies the hearing loss and dates its onset. The point the discovery authors
    make is a practical one: the hearing loss was called congenital only because audiometry
    was performed, and in patients tested later in childhood the age at diagnosis reflects
    when the test was done rather than when the deafness began. Audiometry is also what
    established the absence of hearing loss in the patients of the second cohort who did not
    have it, which is why that negative is credible.
  diagnosis_term:
    preferred_term: audiometric testing
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that the hearing loss was diagnosed in some patients in the neonatal period and in others during childhood, the onset is likely congenital, as diagnosis relies on a formal audiometric evaluation."
    explanation: States that the determination of congenital onset rests on formal audiometric evaluation.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she was diagnosed with bilateral sensorineural hearing loss (via brainstem auditory evoked response testing)."
    explanation: The specific audiological modality used in the index patient in infancy.
- name: Serum creatine kinase
  description: >-
    Creatine kinase is the screening abnormality that places the weakness in muscle. It is
    raised episodically rather than continuously, reaching 18,025 U/l in the index patient
    at nineteen months, and the episodic rises accompanied intercurrent diarrhoeal illness
    in three patients. A single normal value therefore does not exclude the disease.
  diagnosis_term:
    preferred_term: creatine kinase measurement
    term:
      id: NCIT:C64489
      label: Creatine Kinase Measurement
  markers: Serum creatine kinase activity
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscle weakness, and elevated CK (up to 18,025U/l at 19 months of age)."
    explanation: Gives the magnitude of the creatine kinase elevation and the setting in which it was measured.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, GGPS1‐related muscular dystrophy/hearing loss/ovarian insufficiency syndrome is characterized by a remarkably consistent and recognizable phenotype of congenital sensorineural hearing loss, primary ovarian insufficiency in females, proximal muscle weakness with episodes of variably elevated CK, scoliosis, and respiratory insufficiency, in which the symptoms are progressive in nature and can be severe."
    explanation: Records that the elevation is episodic and variable rather than sustained, which is what makes a single value uninformative.
- name: Muscle biopsy
  description: >-
    Biopsy establishes that the process is dystrophic rather than neurogenic or
    inflammatory, and adds the two ultrastructural features that point towards this
    diagnosis specifically: excess autophagic material and enlarged mitochondria. It was
    performed in nine of the eleven patients of the founding cohort. It is not a
    confirmatory test -- nothing on the biopsy is specific to GGPS1 -- and a biopsy taken
    very early can be normal.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies were performed in 9 patients (Patients P1–P9)."
    explanation: Records how many patients were biopsied, which is what makes the histological description a cohort finding rather than a case report.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology was dystrophic, with evidence of degeneration and regeneration and internalized nuclei."
    explanation: The dystrophic pattern the biopsy is performed to demonstrate.
- name: Endocrine evaluation of postpubertal females
  description: >-
    Follicle-stimulating hormone measurement in the setting of amenorrhoea or infertility is
    what establishes the ovarian component, and without it the feature is systematically
    missed: in the founding cohort the affected men were never formally assessed, and in the
    2022 cohort only one woman had reached adulthood. Prepubertal girls and all males are
    effectively unassessable for this feature at the time of diagnosis, so a negative
    ovarian history in a child says nothing.
  diagnosis_term:
    preferred_term: follicle stimulating hormone measurement
    term:
      id: NCIT:C74783
      label: Follicle Stimulating Hormone Measurement
  markers: Serum follicle-stimulating hormone
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary ovarian insufficiency, also known as premature ovarian failure, has been diagnosed in all postpubertal females in this cohort, as confirmed by menopausal levels of follicle‐stimulating hormone (FSH) in the setting of a history of amenorrhea"
    explanation: Names the hormonal criterion, gives the measured values, and states the clinical settings in which it was applied.
- name: Muscle magnetic resonance imaging
  description: >-
    Whole-body muscle MRI shows the fatty infiltration that confirms a dystrophic process
    and, in the three patients imaged, a pattern that may prove diagnostically useful:
    relative sparing of rectus femoris, sartorius and gracilis, with conspicuously
    asymmetric involvement. Three patients is not enough to call this a signature, and the
    authors say as much.
  diagnosis_term:
    preferred_term: muscle magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole‐body muscle magnetic resonance imaging was performed in Patients P4–P6 and demonstrates variable increase in T1 signal in select muscles, resulting from fatty infiltration and thus consistent with an underlying muscular dystrophy"
    explanation: Reports the imaging finding and its interpretation as evidence of an underlying muscular dystrophy.
treatments:
- name: Cochlear implantation
  description: >-
    The most effective intervention reported in this disease. All four patients implanted in
    the founding cohort responded well, which is also the observation that localises the
    auditory lesion to the sensory organ rather than to the nerve.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Cochlear Sensory Failure
    description: >-
      Bypasses the failed cochlear sensory transduction by stimulating the auditory nerve
      directly; it does not modify the underlying metabolic lesion.
    evidence:
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The sensorineural hearing loss observed in patients with GGPS1‐related muscular dystrophy is most likely sensory organ–related and localized to the organ of Corti, consistent with cochlear implantation being highly effective in all 4 patients in our cohort who underwent implantation."
      explanation: >-
        Reports the implant response and the authors' inference from it about where the
        lesion sits, which is the rationale for this intervention.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sensorineural hearing loss observed in patients with GGPS1‐related muscular dystrophy is most likely sensory organ–related and localized to the organ of Corti, consistent with cochlear implantation being highly effective in all 4 patients in our cohort who underwent implantation."
    explanation: The clinical outcome of implantation in the four patients who received it.
- name: Non-invasive and invasive ventilatory support
  description: >-
    Nocturnal non-invasive ventilation progressing to tracheostomy in the severely affected.
    This is the supportive measure that determines survival, as it is in every congenital
    muscular dystrophy with respiratory involvement.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Respiratory Insufficiency
    description: Substitutes for the failing respiratory musculature without modifying the myopathy.
    evidence:
    - reference: PMID:35869884
      reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Proximal or generalized muscle weakness (12/13) with the mean onset age of 2.7 ± 2.7 years (range 0.6–11), respiratory insufficiency (8/13) requiring non‐invasive ventilation (6/13) and tracheostomy (2/13), joint contractures (7/12), congenital or infantile‐onset bilateral severe sensorineural hearing loss (6/13)"
      explanation: Ties the ventilatory requirement to the measured respiratory insufficiency across the cohort.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She developed respiratory insufficiency, necessitating noninvasive ventilation, progressing to tracheostomy."
    explanation: Documents the escalation from non-invasive ventilation to tracheostomy.
- name: Spinal fusion for progressive scoliosis
  description: >-
    Orthopaedic stabilisation of the neuromuscular scoliosis. Reported in the index patient
    at eleven years; no series and no outcome data exist for this disease specifically.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal fusion
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Scoliosis
    description: Corrects and stabilises the spinal deformity produced by axial weakness.
    evidence:
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Progressive scoliosis necessitated spinal fusion at age 11 years."
      explanation: The single reported instance, quoted rather than generalised.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive scoliosis necessitated spinal fusion at age 11 years."
    explanation: Records that spinal fusion was performed for the progressive scoliosis.
differential_diagnoses:
- name: Perrault syndrome
  disease_term:
    preferred_term: Perrault syndrome
    term:
      id: MONDO:0017312
      label: Perrault syndrome
  description: >-
    The closest differential and the reason the lump/split decision for this entry is a real
    one. Perrault syndrome is sensorineural hearing loss with primary ovarian insufficiency
    in 46,XX individuals -- two of this disease's three cardinal features -- and GGPS1 was
    independently nominated as a Perrault candidate gene from a Perrault cohort in the same
    year this syndrome was named. dismech curates Perrault syndrome separately in
    `kb/disorders/Perrault_Syndrome.yaml`, where GGPS1 appears as a gene whose phenotype
    overlaps Perrault syndrome. The two entries are deliberately cross-referenced rather
    than merged.
  distinguishing_features:
  - "Perrault syndrome does not include muscle disease; the discovery paper for this syndrome states that Perrault syndrome manifests with hearing loss and ovarian insufficiency but without muscle involvement."
  - "Here the muscular dystrophy is the constant feature and the two Perrault features are the variable ones, which inverts the Perrault definition: hearing loss was present in only 46% of one cohort and a 2024 patient had normal hearing."
  - "The mechanisms are different in kind. Perrault syndrome is unified by failure of mitochondrial gene expression and proteostasis, with peroxisomal exceptions; this is an isoprenoid and protein-prenylation lesion."
  - "MONDO and OMIM assign a separate identity (MONDO:0859189, OMIM:619518) rather than a numbered PRLTS designation, and MONDO does not place this term under Perrault syndrome."
  - "The practical discriminator is a creatine kinase and a muscle examination in anyone presenting with the Perrault dyad, since the dystrophy is what changes management."
  - "The case against this separation should be stated too: a 2026 review lists GGPS1 among the fifteen principal Perrault syndrome genes, so a reader who takes that classification is entitled to regard this disease as a Perrault subtype with muscle involvement."
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perrault syndrome, caused by mutations in various mitochondrial and peroxisomal genes, clinically manifests with sensorineural hearing loss and primary ovarian insufficiency but without muscle involvement"
    explanation: States the nosological boundary this differential draws, that Perrault syndrome lacks muscle involvement.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a constellation of all these three features had not been previously recognized prior to the Foley"
    explanation: Confirms independently that the three-feature constellation was not a recognised entity before 2020.
  - reference: PMID:42283975
    reference_title: "Comprehensive Insights into Perrault Syndrome: Genetic Diversity and Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "highlighting mutations in fifteen principal genes: HSD17B4, HARS2, CLPP, LARS2, TWNK, ERAL1, RMND1, DAP3, PRORP, MRPL50, MRPL49, MRPS7, PEX6, GGPS1, and TFAM."
    explanation: >-
      The counter-argument, curated rather than omitted: a recent Perrault review counts
      GGPS1 among the Perrault genes, which is the strongest published statement of the
      lumping position this entry declines. Note that the same review characterises all
      fifteen genes as acting in mitochondrial or peroxisomal processes, which is not true
      of GGPS1.
- name: Muscular dystrophy, limb-girdle, autosomal recessive 28 (HMGCR-related)
  disease_term:
    preferred_term: muscular dystrophy, limb-girdle, autosomal recessive 28
    term:
      id: MONDO:0957270
      label: muscular dystrophy, limb-girdle, autosomal recessive 28
  description: >-
    The other Mendelian muscular dystrophy of the mevalonate pathway, curated in
    `kb/disorders/Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_28.yaml`. HMGCR
    catalyses the rate-limiting step at the head of the pathway; GGPS1 catalyses a committed
    step in the isoprenoid branch several steps below it. The two entries agree
    mechanistically rather than competing: the LGMDR28 entry argues from mouse rescue
    experiments that the myopathy of HMGCR deficiency is caused by depletion of the
    geranylgeranyl branch rather than of sterol, and this disease is what a lesion placed
    directly in that branch looks like. Both are hypomorphic-missense diseases of an
    essential enzyme whose complete loss is lethal.
  distinguishing_features:
  - "LGMDR28 is a limb-girdle dystrophy with markedly raised creatine kinase and no hearing or ovarian involvement; this syndrome adds congenital sensorineural hearing loss and primary ovarian insufficiency."
  - "The LGMDR28 biopsy is characteristically unremarkable, without necrosis, fibrosis or inflammation; the biopsy here is frankly dystrophic and adds excess autophagic material and enlarged mitochondria."
  - "LGMDR28 onset spans birth to the fourth decade and is often adult; this syndrome is congenital to preschool in onset."
  - "LGMDR28 has a directed metabolite-replacement candidate, oral mevalonolactone, which supplies the pathway product below the block; there is no equivalent for GGPS1, since the block is below the branch point and mevalonate would not bypass it."
  evidence:
  - reference: PMID:42323079
    reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Our findings demonstrate that myopathy induced by HMGCR deficiency is primarily driven by GGPP depletion in a mouse model."
    explanation: >-
      This result is about HMGCR-deficient mice, not GGPS1. It is cited to show that the two
      diseases are placed on one pathway by the same argument, since the HMGCR myopathy is
      attributed to depletion of the very metabolite GGPS1 makes.
- name: GGPS1-associated bisphosphonate-related atypical femoral fracture
  description: >-
    Not a disease entry and deliberately not merged into this one. Monoallelic GGPS1
    variants, notably p.Asp188Tyr in three sisters, have been reported as a risk factor for
    atypical femoral fractures in women on nitrogen-containing bisphosphonates, which
    inhibit GGPPS pharmacologically; the variant reduces catalytic activity roughly fourfold
    in vitro. This is a heterozygous drug-response susceptibility with no disease phenotype
    in the absence of the drug, and it has no MONDO term. It is recorded here because it is
    the single largest source of GGPS1 literature that is not about this syndrome, and
    because both the discovery paper and the replication cohort take care to distinguish the
    two.
  distinguishing_features:
  - "Monoallelic, and expressed only under bisphosphonate exposure; this syndrome is biallelic and expressed without any drug."
  - "The phenotype is a fracture in an adult on treatment, not a congenital muscular dystrophy with hearing and ovarian involvement."
  - "Heterozygous GGPS1 loss-of-function carriers are present in gnomAD and are expected to be asymptomatic, so a single defective allele does not produce this syndrome."
  evidence:
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While monoallelic variants in GGPS1 have been identified as a risk factor for atypical femoral bone fractures in females exposed to bisphosphonates, ultra‐rare biallelic pathogenic missense variants in GGPS1 have recently been associated with muscular dystrophy/hearing loss/ovarian insufficiency syndrome."
    explanation: Draws the monoallelic-versus-biallelic distinction between the two GGPS1 associations in a single sentence.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although thus far there has been no human monogenic disease linked to mutations in GGPS1, it has been identified as a risk factor for atypical femoral bone fractures in females exposed to bisphosphonates."
    explanation: Records that before 2020 the only GGPS1 disease association was the bisphosphonate fracture risk factor.
  - reference: PMID:30275041
    reference_title: Reduced Activity of Geranylgeranyl Diphosphate Synthase Mutant Is Involved in Bisphosphonate-Induced Atypical Fractures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "the D188Y mutation leads to ∼4-fold catalytic activity decrease."
    explanation: >-
      This is about the atypical-femoral-fracture allele D188Y, not about any allele in this
      syndrome. It is cited to show that the fracture-associated variant is also a partial
      loss-of-function allele, which is why the two associations are easy to conflate.
- name: Facioscapulohumeral muscular dystrophy
  disease_term:
    preferred_term: facioscapulohumeral muscular dystrophy
    term:
      id: MONDO:0001347
      label: facioscapulohumeral muscular dystrophy
  description: >-
    The other muscular dystrophy in which sensorineural hearing loss is an accepted feature,
    specifically in the early-onset infantile form. It is curated in
    `kb/disorders/Facioscapulohumeral_Muscular_Dystrophy.yaml`.
  distinguishing_features:
  - "FSHD is dominantly inherited and caused by D4Z4 contraction or SMCHD1 variants, not by a recessive metabolic-enzyme genotype."
  - "FSHD has a characteristic facial, scapular and humeral distribution with marked asymmetry; the weakness here is limb-girdle or generalised."
  - "Retinal vasculopathy accompanies the hearing loss in infantile FSHD, and primary ovarian insufficiency is not a feature."
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Congenital sensorineural hearing loss rarely manifests in association with muscular dystrophy but has been reported in early onset facioscapulohumeral muscular dystrophy."
    explanation: >-
      Names early-onset facioscapulohumeral muscular dystrophy as the other muscular dystrophy
      in which congenital sensorineural hearing loss occurs, which is what makes it a
      differential for this syndrome.
- name: Vici syndrome
  disease_term:
    preferred_term: Vici syndrome
    term:
      id: MONDO:0009452
      label: Vici syndrome
  description: >-
    An EPG5-related multisystem disorder combining a vacuolar myopathy with sensorineural
    hearing loss, which the discovery authors raise because it makes the same connection
    between disordered autophagy, myopathy and deafness that the ultrastructural findings
    here suggest. It is the differential most worth knowing about mechanistically rather
    than clinically.
  distinguishing_features:
  - "Vici syndrome has agenesis of the corpus callosum, cataracts, hypopigmentation, cardiomyopathy and immunodeficiency; none of these occurs in GGPS1 disease, which has no cardiac or cognitive involvement."
  - "Ovarian insufficiency is not a feature of Vici syndrome."
  - "The autophagy defect in Vici syndrome is a primary lesion in an autophagy regulator; here disordered autophagy is an ultrastructural finding whose place in the mechanism is unresolved."
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, no cardiac or cognitive involvement has been noted in this cohort."
    explanation: Records the absence of cardiac and cognitive involvement, which is the clearest clinical separation from Vici syndrome.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Vici syndrome, a complex congenital multisystemic disorder caused by recessive mutations in autophagy regulator EPG5 gene, which can also be associated with sensorineural hearing loss,"
    explanation: >-
      Identifies Vici syndrome and its cause, and names the hearing loss that it shares with
      this syndrome, which is why the discovery authors raise it.
animal_models:
- name: Ggps1 p.Tyr259Cys homozygous knock-in mouse
  species: Mouse
  genotype: Ggps1 p.Y259C homozygous knock-in
  publication: PMID:32403198
  description: >-
    A knock-in of the human Y259C allele, made because a complete Ggps1 knockout is not
    viable and a knock-in was the only route to an organismal model. It does not model the
    disease: homozygotes develop with a markedly slowed rate, reach no further than
    embryonic day 12.5 and are not recovered alive thereafter. The authors state plainly
    that this left them unable to do mechanistic work relevant to the human phenotype, which
    is why almost everything mechanistic in this entry comes from patient cells or from
    tissue-specific mouse models of other genotypes.
  modeled_mechanisms:
  - target: Myofiber Degeneration with Disordered Autophagy
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Homozygous animals die as embryos and never develop a postnatal muscular dystrophy, so
      no muscle phenotype, hearing phenotype or ovarian phenotype can be observed.
    limitations: >-
      Embryonic lethality precludes phenotyping of any kind, so the model yields no readout
      of weakness, creatine kinase, histology, hearing or fertility. The species difference
      is the substantive limitation: mouse appears far less tolerant of this allele than
      human, since the corresponding human compound heterozygotes were liveborn and survived
      into their twenties. Nothing about the human disease can be inferred from this model
      beyond the severity of the allele.
    evidence:
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "homozygote Y259C knock‐in embryos developed up to embryonic day (ED)12.5, with no live embryos observed after this point."
      explanation: Reports the embryonic lethality that constitutes the failure to recapitulate.
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, detailed mechanistic studies relevant to the human phenotype were not possible in this mouse strain."
      explanation: The authors' own statement that the model could not be used for mechanism.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As a total knock‐out the gene is not viable; we therefore created a knock‐in mouse of the mutation p.Y259C (Fig 7A) detected in compound heterozygosity in the index family (Family 1) to study the effects of the mutant GGPS1 on the organismal level."
    explanation: Establishes why a knock-in rather than a knockout was attempted, and what genotype the model carries.
- name: Oocyte-specific Ggpps conditional knockout mouse
  species: Mouse
  genotype: Ggpps flox/flox; Ddx4-Cre (oocyte-specific conditional knockout)
  publication: PMID:28072828
  description: >-
    Not built as a model of this disease -- it predates it by three years and its authors
    were asking how oocyte-granulosa cell communication is established -- but it is the only
    animal system in which loss of GGPP produces a phenotype in one of this disease's three
    target organs. Follicles are almost entirely lost by six weeks, the primary-to-secondary
    transition fails, Rho GTPase geranylgeranylation is inhibited, and supplying GGPP
    rescues all of it.
  modeled_mechanisms:
  - target: Ovarian Follicle Depletion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces follicle loss and infertility from loss of GGPP in the oocyte, and
      identifies the failing step as Rho GTPase geranylgeranylation. The rescue by GGPP is
      what makes the attribution causal rather than correlative.
    limitations: >-
      This is a conditional null restricted to the oocyte, whereas patients carry a partial
      loss of function expressed in every tissue, so the model overstates the enzymatic
      deficit while missing any granulosa-cell or somatic contribution. It is a mouse ovary
      rather than a human one, the phenotype is near-complete follicle loss by six weeks
      rather than ovarian insufficiency after apparently normal puberty, and no patient with
      this syndrome has had ovarian histology examined, so the correspondence is by mechanism
      and not by observation.
    readouts:
    - name: Ovarian follicle number
      target: Ovarian Follicle Depletion
      direction: DECREASED
      interpretation: Direct histological correlate of the follicle-depletion node in this model.
      evidence:
      - reference: PMID:28072828
        reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The selective depletion of GGPP in mouse oocytes impaired the proliferation of granulosa cells, primary-secondary follicle transition and female fertility."
        explanation: Reports the follicular and fertility measurements behind this readout.
    - name: Follicular development after GGPP administration
      target: Ovarian Follicle Depletion
      direction: RESTORED
      interpretation: >-
        Rescue by the missing metabolite establishes that the follicular defect follows from
        GGPP depletion rather than from some other consequence of deleting the enzyme.
      evidence:
      - reference: PMID:28072828
        reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "GGPP administration restored the defects in oocyte-granulosa cell contact, granulosa cell proliferation and primary-secondary follicle transition in Ggpps depletion mice."
        explanation: Reports the rescue experiment behind this readout.
    evidence:
    - reference: PMID:28072828
      reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "oocyte geranylgeranyl diphosphate (GGPP), a metabolic intermediate involved in protein geranylgeranylation, is required to establish the oocyte-granulosa cell communication."
      explanation: Establishes that this model is informative for the requirement for GGPP in the ovary.
  - target: Deficient Protein Geranylgeranylation of Small GTPases
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The one system in which the prenylation step this entry's mechanism turns on has
      actually been shown to fail: GGPP depletion inhibits Rho GTPase geranylgeranylation and
      its GTPase activity.
    limitations: >-
      Demonstrated in mouse oocytes with a conditional null, not in human tissue with a
      hypomorphic allele. The discovery paper for the human disease looked for a
      corresponding prenylome change in patient cells and did not find one, so this model may
      be showing what a complete loss does rather than what the human partial loss does.
    readouts:
    - name: Rho GTPase geranylgeranylation and GTPase activity
      target: Deficient Protein Geranylgeranylation of Small GTPases
      direction: DECREASED
      interpretation: Direct measurement of the prenylation step failing when GGPP is removed.
      evidence:
      - reference: PMID:28072828
        reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "GGPP depletion inhibited Rho GTPase geranylgeranylation and its GTPase activity, which was responsible for the accumulation of cell junction proteins in the oocyte cytoplasm and the failure to maintain physical connection between oocyte and granulosa cells."
        explanation: Reports the prenylation and GTPase-activity measurements behind this readout.
    evidence:
    - reference: PMID:28072828
      reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "GGPP depletion inhibited Rho GTPase geranylgeranylation and its GTPase activity, which was responsible for the accumulation of cell junction proteins in the oocyte cytoplasm and the failure to maintain physical connection between oocyte and granulosa cells."
      explanation: Establishes that this model reports directly on the prenylation node.
experimental_models:
- name: Patient-derived MyoD-converted myoblasts and myotubes with laser membrane injury
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Dermal fibroblasts from affected individuals converted to myoblasts with lentiviral
    MyoD and differentiated to myotubes, then wounded with a focal laser pulse in the
    presence of the membrane-impermeant dye FM 1-43 so that resealing can be followed as
    dye exclusion. This is the system that produced the only cellular phenotype demonstrated
    in patient material, and it is also the system in which GGPPS activity was measured at
    about half of control.
  publication: PMID:32403198
  modeled_mechanisms:
  - target: Impaired Sarcolemmal Membrane Repair
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces, in cells carrying the patients' own genotypes, a delay in resealing the
      wounded plasma membrane and a roughly twofold increase in the proportion of cells that
      fail to reseal at all.
    limitations: >-
      MyoD-converted fibroblasts are not mature innervated muscle, and a laser wound is not
      the eccentric contraction injury that damages muscle in life. The assay reports
      resealing kinetics and not the downstream dystrophic process, so the link from this
      defect to the biopsy findings remains inferential. The measurement pools cells from
      several patients with different genotypes, so it cannot distinguish allele-specific
      effects.
    readouts:
    - name: FM 1-43 dye entry after focal laser injury
      target: Impaired Sarcolemmal Membrane Repair
      direction: INCREASED
      interpretation: >-
        Greater dye entry means slower resealing, which is the direct measure of the
        membrane-repair defect this node claims.
      evidence:
      - reference: PMID:32403198
        reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We observed greater dye entry, indicating a poor cell membrane repair, in both the patient myoblasts and myotubes as compared to the healthy controls"
        explanation: Reports the dye-entry measurement behind this readout.
    - name: GGPPS enzymatic activity in patient myoblasts
      target: Impaired Sarcolemmal Membrane Repair
      direction: DECREASED
      interpretation: >-
        Establishes that the cells showing the repair defect really do carry a measurable
        enzymatic deficit, which is what ties the cellular phenotype to the genotype.
      evidence:
      - reference: PMID:32403198
        reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We found that enzymatic activity in samples pooled from 4 patients (Patients P1, P2, P6, and P8) was decreased to about 50% of the activity in a pooled normal control sample."
        explanation: Reports the enzyme-activity measurement made in these same cells.
    evidence:
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We observed greater dye entry, indicating a poor cell membrane repair, in both the patient myoblasts and myotubes as compared to the healthy controls"
      explanation: Establishes that this model reports the cellular phenotype the node describes.
discussions:
- discussion_id: tissue_selectivity_of_prenylation_failure
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a partial deficit of a universally required lipid modification produce disease
    in skeletal muscle, cochlea and ovary and spare everything else?
  attaches_to:
  - pathophysiology#Deficient Protein Geranylgeranylation of Small GTPases
  - pathophysiology#Cochlear Sensory Failure
  rationale: >-
    Protein geranylgeranylation is required in every cell, and more than a hundred human
    proteins are predicted substrates, yet these patients have no cardiac, cognitive,
    haematological or immune phenotype at all. Three explanations are on the table and none
    has been tested. The first is threshold: muscle, cochlear hair cells and oocytes may
    simply have the highest demand for prenylated Rab and Rho GTPases, so a 50% deficit
    crosses a threshold there and nowhere else. The second is that the disease alleles do
    not act through bulk catalytic output at all -- P15S has wild-type activity and still
    causes the disease, all the alleles sit outside the catalytic barrel, and the affected
    domain is conserved in animals but not plants -- so what fails may be a specific
    protein-protein interaction or a subcellular localisation of GGPPS in those tissues.
    The third is developmental timing, since Ggps1 is most densely expressed in the
    embryonic gonad and diffusely in the developing cochlea. Distinguishing these would
    change what a therapy should aim at.
  proposed_experiments:
  - experiment_id: ggps1_tissue_prenylome
    name: Comparative prenylome and GGPP quantification across affected and unaffected tissues
    description: >-
      Quantify geranylgeranyl pyrophosphate and the prenylated proteome in myotubes,
      cochlear organoids or hair-cell-like cells, oocytes or granulosa cells, and an
      unaffected control tissue such as fibroblasts or cardiomyocytes, all derived from
      patient induced pluripotent stem cells alongside isogenic corrected controls.
    would_support:
    - pathophysiology#Deficient Protein Geranylgeranylation of Small GTPases
    supporting_outcome:
    - >-
      A prenylation deficit that is selectively larger, or affects a distinct substrate set,
      in the three affected lineages than in unaffected ones, which would support the
      threshold or substrate-specificity model.
    refuting_outcome:
    - >-
      An equal prenylation deficit across affected and unaffected lineages, which would
      move the explanation away from prenylation stoichiometry entirely and towards a
      non-catalytic function of GGPPS.
- discussion_id: unconfirmed_prenylation_deficit_in_patients
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has the prenylation defect that this entry's mechanism depends on ever been demonstrated
    in a patient with this syndrome?
  attaches_to:
  - pathophysiology#Geranylgeranyl Pyrophosphate Depletion
  - pathophysiology#Deficient Protein Geranylgeranylation of Small GTPases
  rationale: >-
    No. This is the most important caveat in the entry and it is easy to lose, because the
    biochemistry is so tidy. No geranylgeranyl pyrophosphate measurement has been reported
    in any tissue or cell from an affected individual, and the discovery paper states in its
    own discussion that it could not find a consistent change in the small GTPases or in the
    overall prenylome of patient cells. The chain from reduced enzyme activity to deficient
    prenylation is therefore an inference from enzymology and from mouse work in a different
    genotype, which is why those two nodes carry `mechanism_confidence: PROVISIONAL` and
    `HYPOTHETICAL` and why the negative result is curated as a REFUTE evidence item rather
    than left out. The alternative it leaves open -- that the disease alleles disrupt a
    localised or interaction-dependent function of GGPPS rather than the cell's bulk GGPP
    supply -- is supported by the P15S allele, which has normal catalytic activity.
  proposed_experiments:
  - experiment_id: ggps1_patient_ggpp_assay
    name: Direct measurement of GGPP and Rab prenylation in patient muscle
    description: >-
      Measure geranylgeranyl pyrophosphate, farnesyl pyrophosphate and the unprenylated
      fraction of Rab and Rho GTPases by mass spectrometry and by in-vitro prenylation
      assay in muscle biopsy tissue from genotyped patients against age-matched controls,
      with sufficient replication to detect the modest deficit the enzymology predicts.
    would_support:
    - pathophysiology#Geranylgeranyl Pyrophosphate Depletion
    supporting_outcome:
    - >-
      Reduced GGPP and an increased unprenylated fraction of Rab and Rho GTPases in patient
      muscle, which would convert the central nodes of this mechanism from inference to
      observation.
    refuting_outcome:
    - >-
      Normal GGPP pools and normal prenylation in patient muscle, which would refute the
      bulk-depletion model outright and redirect the mechanism towards a non-catalytic or
      localisation-dependent function of the enzyme.
- discussion_id: no_viable_animal_model
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can any animal model reproduce this syndrome, given that the mouse dies in utero from an
    allele a human tolerates into adulthood?
  attaches_to:
  - animal_models#Ggps1 p.Tyr259Cys homozygous knock-in mouse
  - pathophysiology#Myofiber Degeneration with Disordered Autophagy
  rationale: >-
    The mismatch is stark and quantitative. Homozygous Y259C mice are developmentally delayed
    from embryonic day 10.5 and are dead by 13.5, while the human compound heterozygotes
    carrying that same allele walked independently at eighteen months and survived into their
    twenties. The mouse is therefore not merely a poor model but an inverted one, and the
    authors say directly that it left them unable to do mechanistic work relevant to the
    human phenotype. Everything that is known about mechanism in this disease consequently
    comes from patient-derived cells or from mouse models of a different genotype in a
    different tissue. What is missing is a milder allelic series -- a knock-in of R261H,
    which produces the mildest human phenotype, or a hypomorphic allele engineered to leave
    more residual activity -- and tissue-restricted conditional deletions in muscle and
    cochlea to match the ovarian one that already exists.
  proposed_experiments:
  - experiment_id: ggps1_mild_allele_and_conditional_series
    name: Milder Ggps1 knock-in allele plus muscle- and cochlea-restricted conditional knockouts
    description: >-
      Generate homozygous knock-in mice carrying the human R261H allele, and separately cross
      the existing floxed Ggps1 allele to muscle-restricted and hair-cell-restricted Cre
      drivers, then phenotype for the human-relevant endpoints: strength and creatine kinase,
      muscle histology including autophagic and mitochondrial ultrastructure, auditory
      brainstem responses, and ovarian follicle counts.
    would_support:
    - pathophysiology#Myofiber Degeneration with Disordered Autophagy
    supporting_outcome:
    - >-
      Viable R261H homozygotes with a slowly progressive dystrophy and hearing loss, or
      tissue-restricted knockouts reproducing the muscle and cochlear phenotypes, either of
      which would give the field a system in which mechanism and therapy can be tested.
    refuting_outcome:
    - >-
      R261H homozygotes that are again embryonic lethal or, at the other extreme, entirely
      unaffected, which would suggest the mouse cannot be made to occupy the narrow window
      the human disease sits in and would push modelling towards human stem-cell systems.
- discussion_id: no_directed_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there a metabolite or pathway intervention that could bypass the GGPS1 block, and has
    anything been tried?
  attaches_to:
  - treatments#
  - pathophysiology#Geranylgeranyl Pyrophosphate Depletion
  rationale: >-
    Very little has been tried, and the arithmetic of the pathway is discouraging in a
    specific way. The block here sits below the branch point, so supplying mevalonate -- the
    approach that produced measurable benefit in the one treated patient with the upstream
    HMGCR disease -- would not bypass it. The obvious candidate is geranylgeraniol, the
    alcohol precursor of GGPP, which reverses the fiber-type loss of muscle-specific Hmgcr
    knockout mice and is the exact metabolite this enzyme fails to make enough of; it has
    never been tested in a GGPS1 patient or model. The one metabolite that has been tried,
    coenzyme Q10, produced no improvement in the single patient given it, and muscle coenzyme
    Q10 was normal in another patient, so the ubiquinone branch is probably not where the
    disease sits. Any trial would also have to confront the fact that the prenylation deficit
    it is meant to correct has not yet been demonstrated in a patient.
  proposed_experiments:
  - experiment_id: ggps1_geranylgeraniol_preclinical
    name: Geranylgeraniol rescue in patient-derived myotubes and in a conditional Ggps1 model
    description: >-
      Test whether geranylgeraniol supplementation restores membrane resealing kinetics in
      the patient-derived MyoD-converted myotube laser-injury assay, and whether it rescues
      the muscle phenotype of a muscle-restricted conditional Ggps1 knockout, before any
      consideration of human use.
    would_support:
    - pathophysiology#Geranylgeranyl Pyrophosphate Depletion
    supporting_outcome:
    - >-
      Normalisation of membrane resealing in patient myotubes and of the muscle phenotype in
      the conditional knockout, which would both confirm GGPP depletion as the operative
      lesion and identify a candidate therapy.
    refuting_outcome:
    - >-
      No rescue by geranylgeraniol despite adequate cellular uptake, which would argue that
      the disease alleles act through something other than the cell's bulk GGPP supply and
      would close off the most obvious therapeutic route.

name: Muscular Dystrophy, Congenital Hearing Loss, and Ovarian Insufficiency Syndrome
category: Mendelian
creation_date: "2026-09-07T00:00:00Z"
synonyms:
- GGPS1-related muscular dystrophy
- muscular dystrophy/hearing loss/ovarian insufficiency syndrome
- GGPS1-associated congenital muscular dystrophy
- MDHLOI
description: >-
  A recessive syndrome caused by biallelic hypomorphic missense variants in GGPS1, which
  encodes geranylgeranyl diphosphate synthase (GGPPS), the enzyme that makes geranylgeranyl
  pyrophosphate (GGPP) from farnesyl pyrophosphate in the mevalonate/isoprenoid pathway. GGPP
  is the lipid donor for protein geranylgeranylation, the modification that anchors Rab and
  Rho/Rac family small GTPases to membranes. The syndrome was defined in 2020 in eleven
  patients from six families and consists of an early-onset muscular dystrophy, congenital
  sensorineural hearing loss, and primary ovarian insufficiency in postpubertal 46,XX
  individuals.

  Two things make it unusual among the congenital muscular dystrophies. The first is the
  organ combination: hearing loss with ovarian insufficiency is the Perrault-syndrome dyad,
  and adding a dystrophy to it had not been described before. The second is that the lesion
  is metabolic rather than structural. There is no sarcolemmal protein missing; what has
  been shown in patient cells is a failure of the wounded plasma membrane to reseal, which
  is a plausible route from a prenylation deficit to a dystrophic muscle, since the
  membrane-repair machinery is built on vesicle trafficking that depends on prenylated Rab
  GTPases. Muscle biopsy is dystrophic with degeneration, regeneration and internal nuclei,
  and adds two features that are not part of the classic dystrophic picture: excess
  autophagic material and enlarged mitochondria.

  The mutational spectrum is narrow and informative. All reported alleles are missense, four
  of the five in the founding cohort clustering in a five-amino-acid stretch at the start of
  helix 11, on the outside of the hexamer and away from the catalytic barrel. They reduce
  enzyme activity only partially -- to roughly 70-85% of wild-type for recombinant protein
  and to about half of control in patient myoblasts -- and heterozygous loss-of-function
  carriers in gnomAD are asymptomatic. The gene is essential: complete inactivation is not
  compatible with multicellular life, and a knock-in mouse homozygous for the human Y259C
  allele dies before embryonic day 13.5, which is why there is no mouse model of the human
  disease. The alleles are therefore hypomorphic by necessity as well as by measurement.

  How a universally required modification produces disease in exactly three organs is
  unresolved, and the honest state of the mechanism is that the prenylation step itself has
  not been shown to fail in patients: the discovery paper reports that it could not find a
  consistent change in the small GTPases or in the overall prenylome of patient cells. The
  ovarian arm has the best independent support, from mouse oocytes in which selective GGPP
  depletion blocks Rho GTPase geranylgeranylation, the primary-to-secondary follicle
  transition and fertility. The cochlear arm has essentially none beyond the clinical
  observation that cochlear implantation works well, which localises the lesion to the
  sensory organ without saying what fails in it.

  Management is entirely supportive. Only three interventions are documented in the
  published patients and curated here -- cochlear implantation, non-invasive progressing to
  invasive ventilation, and spinal fusion for scoliosis. Rehabilitation, nutritional support
  and hormone replacement for the ovarian insufficiency are all plausible and are what these
  patients will in practice receive, but no source about this disease describes them, so
  they are deliberately not curated as treatments. There is no directed therapy. The one metabolite tried, coenzyme Q10, produced no improvement in the single
  patient given it, and muscle coenzyme Q10 was normal in another, so the coenzyme Q branch
  of the pathway is not obviously where the disease sits.

  Later cohorts have loosened the triad rather than confirming it. In thirteen individuals
  reported in 2022 hearing loss was present in only 46%, ovarian insufficiency was not
  established in the one woman who reached adulthood, and a 2024 case had isolated proximal
  weakness with normal hearing and raised transaminases. Muscular dystrophy is the constant;
  the two Perrault features are the variable ones. That inversion is the main reason this is
  curated as its own disease rather than as a Perrault subtype.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Primary assignment. The muscular dystrophy is the constant and defining feature and
      the source of the morbidity that determines outcome, and Harrison's places the
      muscular dystrophies in the neurology part.
    evidence:
    - reference: PMID:35869884
      reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report consolidates the disease-causing role of biallelic variants in GGPS1 and demonstrates that hearing loss and ovarian insufficiency might be a variable feature of the GGPS1-associated muscular dystrophy."
      explanation: >-
        Names muscular dystrophy as the constant feature against which hearing loss and
        ovarian insufficiency are variable, which is the basis for the neurologic assignment.
  - classification_value: DISORDER_OF_EAR
    notes: >-
      Congenital sensorineural hearing loss is a cardinal feature, was the presenting
      symptom in the milder patients, and is the feature that leads to cochlear
      implantation.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Two reasons, and this is where the entry deliberately differs from
      Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_28, which considered and declined
      this assignment. Hypergonadotropic primary ovarian insufficiency is a presenting
      endocrine problem here, which LGMDR28 does not have; and the lesion is in an enzyme
      of the mevalonate pathway.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian recessive disorder diagnosed by exome or genome sequencing, with
      unaffected heterozygous parents and a genetic-counselling component.

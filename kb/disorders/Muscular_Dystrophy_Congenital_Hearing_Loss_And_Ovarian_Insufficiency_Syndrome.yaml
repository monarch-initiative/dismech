    label: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
parents:
- Congenital Muscular Dystrophy
notes: >-
  Entity verification. MONDO:0859189 carries the label "muscular dystrophy, congenital
  hearing loss, and ovarian insufficiency syndrome" and the cross-references OMIM:619518,
  MEDGEN:1794190 and UMLS:C5561980 (checked against EBI OLS4 on 2026-09-07, since the local
  MONDO SQLite build was deliberately not downloaded in this session). The stub records
  MONDO:0003847 (hereditary disease) as its only parent and hgnc:4249 GGPS1 as its only
  causal gene. Note that MONDO does not place this term under Perrault syndrome
  (MONDO:0017312), and that Perrault syndrome is a separate MONDO term with its own
  identity.

  Lump/split decision, which here is a real one. Perrault syndrome is defined by
  sensorineural hearing loss with primary ovarian insufficiency, and dismech already curates
  it in `kb/disorders/Perrault_Syndrome.yaml` -- an entry that already lists GGPS1 as a
  Perrault gene with an isoprenoid pathophysiology node. Two of this disease's three
  cardinal features are therefore the whole of Perrault syndrome, and GGPS1 was independently
  nominated as a Perrault candidate gene in a Perrault cohort in the same year the syndrome
  was named (PMID:32399598). That is the case for lumping, and it is not weak.

  It is nonetheless curated as its own entry, for four reasons. (1) The muscular dystrophy
  is not a Perrault feature: the discovery paper states that Perrault syndrome manifests
  with hearing loss and ovarian insufficiency "but without muscle involvement", and that the
  three-feature constellation had not been recognised before. (2) Later cohorts invert the
  Perrault definition here -- muscular dystrophy is present in essentially every reported
  patient, while hearing loss was present in only 46% of a thirteen-person cohort and
  ovarian insufficiency was likewise variable, so the two Perrault-defining features are the
  optional ones in this disease. A 2024 patient had isolated proximal weakness with normal
  hearing. (3) The mechanism is different in kind: Perrault syndrome is unified by failure of
  mitochondrial gene expression and proteostasis (with peroxisomal exceptions), whereas this
  is an isoprenoid/prenylation lesion. (4) MONDO and OMIM give it a separate identity
  (OMIM:619518) rather than a numbered PRLTS designation. The reciprocal cross-reference is
  kept: this entry lists Perrault syndrome as a differential, and the Perrault entry
  continues to carry GGPS1 as a gene whose phenotype "overlaps Perrault syndrome". A curator
  who disagrees should change both entries together, not one.

  Is there more than one GGPS1 disease? Yes, in the sense that the literature carries a
  second, quite separate GGPS1 association, and no, in the sense that the second is not a
  Mendelian disease. Monoallelic GGPS1 variants -- specifically p.Asp188Tyr in three sisters
  -- have been reported as a risk factor for atypical femoral fractures in women taking
  nitrogen-containing bisphosphonates, which inhibit GGPPS pharmacologically; the variant
  reduces catalytic activity about fourfold in vitro. That is a heterozygous drug-response
  susceptibility with no MONDO disease term of its own, not a dominant Mendelian disorder,
  and both the discovery paper and the 2022 cohort state the distinction explicitly. It is
  recorded here in `differential_diagnoses` and is deliberately not merged into this entry.
  No dominantly inherited GGPS1 disease was found in the literature searched.

  Named Entity Confusion. A GGPS1 literature search is dominated by three bodies of work
  that are not this disease: nitrogen-containing bisphosphonate pharmacology and the
  atypical-femoral-fracture association above; oncology, where GGPPS inhibition is a drug
  target across myeloma, leukaemia and solid tumours; and plant and microbial terpenoid
  biosynthesis, where GGPPS is an entirely different subject. Of 217 PubMed records matching
  GGPS1 or geranylgeranyl diphosphate synthase in the title or abstract, only about six
  concern this syndrome. Every clinical claim in this entry is sourced to a paper whose
  subjects carry biallelic germline GGPS1 variants: PMID:32403198 (eleven patients, six
  families), PMID:35869884 (thirteen individuals including two previously reported) and
  PMID:38129970 (one patient). PMID:32399598 is cited only for the mouse-folliculogenesis
  statement and for the Perrault-cohort ascertainment; PMID:28072828 and PMID:42323079 are
  cited as mouse pathway evidence and are labelled as such wherever they appear.

  GeneReviews. There is no GeneReviews chapter for this disease. The Perrault Syndrome
  Overview (PMID:25254289) exists but does not cover GGPS1 disease, and its cached record is
  a scope statement carrying no clinical findings, so it is not cited here.

  One paper deliberately not cited: PMID:39353334 ("Ultrarare Muscular Dystrophy Mimics
  Facioscapulohumeral Muscular Dystrophy", Pediatr Neurol 2024) is a clinical letter with no
  abstract and no retrievable body, so no quotable passage exists and nothing from it is
  asserted here.

  Deep research. `just dr_fallback='--fallback' research-disorder falcon ...` was run on
  2026-09-07. Falcon returned HTTP 402 (the Edison account is out of credits) and the run
  fell back to openscientist, which produced
  `research/Muscular_Dystrophy_Congenital_Hearing_Loss_And_Ovarian_Insufficiency_Syndrome-deep-research-openscientist.md`;
  the fallback is recorded in the report's own frontmatter (`fell_back: true`,
  `requested_provider: falcon`), which is why the file is named for openscientist.

  The report carries `needs_review: true` on both its validation blocks, and what triggers
  it is worth stating because neither problem touches this entry. Reference validation:
  15 of 15 references resolved, `unresolved_references` is empty, and 11 of 12 quotes
  matched -- the one failure is the report's own ellipsis-joined quote of PMID:35869884,
  which is a splice of two real sentences rather than a fabrication, and this entry quotes
  those sentences separately and verifiably. One reference (PMID:31427080, a bacterial
  GGPP-synthase crystal structure) was flagged as possibly off topic; it is genuinely
  tangential and is not cited here. Term validation: 47 of 49 CURIEs resolved with none
  unresolved, and the single mislabelling is the report writing "Disease MONDO" beside
  MONDO:0859189 in a table header, which is a formatting artifact rather than a wrong term.
  `just preflight-dr` returns PASS, with GGPS1 mentioned 35 times against two mentions each
  for the Perrault genes, and the MONDO and report OMIM numbers agreeing.

  What the report contributed, and what was rejected. It contributed one genuinely useful
  lead that the primary papers do not carry: PMID:26112408, which shows that GGPPS activity
  in mouse skeletal muscle sets the geranylgeranylation of RhoA, now cited on the
  prenylation node with its context stated. Two of its claims were checked and not used.
  First, it states that the Y259C knock-in mouse "recapitulates dystrophic muscle histology
  (autophagic material, enlarged mitochondria)"; that is wrong, and the error matters,
  because those findings are from human muscle biopsies while the homozygous knock-in mouse
  dies before embryonic day 13.5 and was never phenotyped. Second, it recommends hormone
  replacement therapy for the ovarian insufficiency and offers NCIT identifiers for several
  interventions; the hormone-replacement recommendation appears in no GGPS1 paper, and its
  suggested CURIEs (NCIT:C62556, NCIT:C15327, NCIT:C99913) were not the terms this entry
  needed, so neither was taken. Hormone replacement is very likely appropriate management
  for hypergonadotropic ovarian insufficiency, but it is not curated here because no source
  about this disease says so.

  Module conformance was considered and declined. `sensorineural_hair_cell_loss` is the
  obvious candidate for the auditory arm, and Perrault_Syndrome conforms to it. It is not
  used here because nothing is known about the cochlear lesion in GGPS1 disease beyond the
  inference from cochlear-implant responsiveness that it is sensory-organ localised.
  Declaring conformance would assert hair-cell mechanotransduction failure, oxidative
  stress and spiral ganglion degeneration, none of which has been observed in this disease.
  The gap is recorded as a knowledge gap instead.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic GGPS1 missense variants, homozygous in consanguineous families and compound
    heterozygous elsewhere. Heterozygous parents are unaffected, and heterozygous carriers
    of loss-of-function GGPS1 alleles are present in gnomAD and expected to be asymptomatic.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report specific mutations in the gene GGPS1 coding for the enzyme geranylgeranyl diphosphate synthase in 11 patients from 6 families, causing a highly distinctive syndrome of early onset muscular dystrophy combined with congenital sensorineural hearing loss and primary ovarian insufficiency in females."
    explanation: Establishes biallelic GGPS1 genotypes across six independent families as the cause of the syndrome.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rare heterozygous carriers for loss‐of‐function variants in GGPS1 are listed in gnomAD and should therefore be asymptomatic."
    explanation: >-
      Supports the recessive model, and specifically that a single defective allele is not
      sufficient to cause this disease.
pathophysiology:
- name: Biallelic Hypomorphic GGPS1 Missense Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    All reported disease alleles are missense. In the founding cohort four of the five
    clustered in a five-amino-acid stretch at the start of the eleventh alpha-helix, on the
    outward-facing surface of the hexamer rather than in the catalytic barrel, and the fifth
    (P15S) sits in the helix involved in assembling the hexamer. The alleles are hypomorphic
    rather than null: they leave measurable enzyme activity, and a complete loss of GGPPS is
    incompatible with multicellular life, so a biallelic null genotype is not expected to be
    seen in a living patient.
  genetic_context:
    gene:
      preferred_term: GGPS1
      term:
        id: hgnc:4249
        label: GGPS1
    allele_type: SNV
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Reported genotypes are homozygous missense in consanguineous families and compound
      heterozygous missense elsewhere. No biallelic null genotype has been reported.
  downstream:
  - target: Reduced Geranylgeranyl Diphosphate Synthase Activity
    causal_link_type: DIRECT
    description: The missense substitutions reduce the catalytic output of the enzyme they sit in.
    evidence:
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "consistently showed a reduced rate of activity of approximately 70 to 85% of wild‐type"
      explanation: >-
        Directly measures the activity of the recombinant mutant enzymes against wild-type,
        which is the edge from allele to enzyme deficit.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic variants fell within a specific 5 amino acid region toward the C terminus around the start of helix 11, with as of yet unclear function"
    explanation: Establishes the narrow positional clustering of the disease alleles outside the catalytic core.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutations do not abolish enzymatic activity of this essential enzyme, but with a highly distinctive genotype/phenotype correlation define the mevalonate pathway as essential for muscle, hearing, and endocrine functions."
    explanation: >-
      The authors' own statement that the alleles are hypomorphic rather than amorphic,
      which is the basis for the PARTIAL_LOSS_OF_FUNCTION classification.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Organism‐wide complete inactivation of GGPPS function is not compatible with multicellular survival."
    explanation: >-
      Supports the constraint that a surviving genotype must retain partial activity, which
      is why every reported allele is missense.
- name: Reduced Geranylgeranyl Diphosphate Synthase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Recombinant mutant enzymes retain roughly 70 to 85% of wild-type activity, and GGPPS
    activity measured in patient-derived myoblasts is about half that of pooled controls.
    The deficit is therefore partial in both a purified and a cellular assay, which is
    consistent with the position of the variants outside the catalytic barrel and is the
    quantitative basis for calling the disease a hypomorphic state rather than an enzyme
    deficiency in the classical inborn-error sense.
  molecular_functions:
  - preferred_term: geranylgeranyl diphosphate synthase activity
    modifier: DECREASED
    term:
      id: GO:0004311
      label: geranylgeranyl diphosphate synthase activity
  downstream:
  - target: Geranylgeranyl Pyrophosphate Depletion
    causal_link_type: DIRECT
    description: >-
      GGPPS catalyses the only route from farnesyl pyrophosphate to geranylgeranyl
      pyrophosphate, so reduced activity reduces the product.
    evidence:
    - reference: PMID:32403198
      reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "For geranylgeranylation, FPP has to be converted to geranylgeranyl pyrophosphate (GGPP), by geranylgeranyl diphosphate synthase (GGPPS; EC:2.5.1.29), encoded by GGPS1."
      explanation: >-
        States the enzymatic step, which is what makes reduced enzyme activity a reduction
        in GGPP specifically rather than in some other pathway product.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "consistently showed a reduced rate of activity of approximately 70 to 85% of wild‐type"
    explanation: Quantifies the residual activity of the recombinant disease alleles.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that enzymatic activity in samples pooled from 4 patients (Patients P1, P2, P6, and P8) was decreased to about 50% of the activity in a pooled normal control sample."
    explanation: >-
      The same deficit measured in patient-derived myogenic cells rather than in recombinant
      protein, which is the closer approximation to the tissue in which the disease is expressed.
- name: Geranylgeranyl Pyrophosphate Depletion
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Reduced GGPPS activity is taken to lower the cellular geranylgeranyl pyrophosphate pool.
    This step is inferred rather than measured: no GGPP measurement has been reported in
    tissue or cells from a patient with this syndrome. It is marked provisional for that
    reason. Independent support that GGPP depletion is a mechanistically consequential state
    in muscle comes from mouse work on the upstream enzyme HMG-CoA reductase, where the
    myopathy of HMGCR deficiency is attributed to GGPP depletion.
  biological_processes:
  - preferred_term: geranylgeranyl diphosphate biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0033386
      label: geranylgeranyl diphosphate biosynthetic process
  - preferred_term: isoprenoid biosynthesis
    modifier: DECREASED
    term:
      id: GO:0008299
      label: isoprenoid biosynthetic process
  downstream:
  - target: Deficient Protein Geranylgeranylation of Small GTPases
    causal_link_type: DIRECT
    description: >-
      GGPP is the lipid donor for geranylgeranylation, so its depletion limits the
      modification.
  evidence:
  - reference: PMID:42323079
    reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Our findings demonstrate that myopathy induced by HMGCR deficiency is primarily driven by GGPP depletion in a mouse model."
    explanation: >-
      This result is about HMGCR, not GGPS1: it concerns mice lacking the rate-limiting
      enzyme two steps upstream, and it is cited here only to establish that depletion of
      GGPP is by itself sufficient to cause myopathy. It says nothing about GGPP levels in
      GGPS1 patients.
- name: Deficient Protein Geranylgeranylation of Small GTPases
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The proposed proximate lesion: too little GGPP to geranylgeranylate the Rab and Rho/Rac
    family GTPases that require it for membrane anchoring, with predicted consequences for
    autophagic and endosomal trafficking, mitochondrial dynamics and actin regulation. This
    node is the weakest link in the chain and is marked hypothetical deliberately. The
    discovery paper proposes it as a prediction, and reports in the same discussion that it
    could not find a consistent change in the small GTPases or the prenylome of patient
    cells. The best direct support is from mouse oocytes, where selective GGPP depletion
    demonstrably inhibits Rho GTPase geranylgeranylation.
  biological_processes:
  - preferred_term: protein geranylgeranylation
    modifier: DECREASED
    term:
      id: GO:0018344
      label: protein geranylgeranylation
  - preferred_term: protein prenylation
    modifier: DECREASED
    term:
      id: GO:0018342
      label: protein prenylation
  downstream:
  - target: Impaired Sarcolemmal Membrane Repair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Membrane resealing depends on vesicle trafficking driven by prenylated Rab GTPases;
      which Rab is limiting here is not established.
  - target: Ovarian Follicle Depletion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of Rho GTPase geranylgeranylation and of oocyte-granulosa cell junction maintenance
    description: >-
      In mouse oocytes the same prenylation deficit blocks the primary-to-secondary follicle
      transition through loss of Rho GTPase geranylgeranylation.
    evidence:
    - reference: PMID:28072828
      reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "GGPP depletion inhibited Rho GTPase geranylgeranylation and its GTPase activity, which was responsible for the accumulation of cell junction proteins in the oocyte cytoplasm and the failure to maintain physical connection between oocyte and granulosa cells."
      explanation: >-
        This is mouse work on oocyte-specific Ggpps depletion, not on human GGPS1 hypomorphs,
        so it supports the edge by analogy of mechanism rather than by observation in the
        disease. It is the only place where the prenylation step has actually been shown to fail.
  - target: Cochlear Sensory Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Asserted only as the route from the shared molecular lesion to the auditory phenotype.
      Nothing is known about which prenylated protein or which cochlear cell type is
      involved.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Possible downstream effects of GGPPS dysfunction and thus GGPP deficiency would be predicted to include impaired geranylgeranylation of small GTPases of the Rab, and Rho/Rac families with consequences on organelles involved in autophagy (such as Rabs23/24/7b), mitochondrial fission and fusion (Rab32), and actin filament dynamics (RhoA/Rac/Cdc42)."
    explanation: >-
      The authors' predicted downstream mechanism, quoted as the prediction it is. It names
      the GTPase families and the cellular processes this node claims are affected.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "In ongoing work, however, we have not yet been able to pinpoint a consistent change in the small GTPases or in the overall prenylome of the cells (not shown)."
    explanation: >-
      The same paper's negative result. A deficient-prenylation node predicts a measurable
      change in prenylated GTPases in patient cells, and none was found; this is recorded as
      a refutation rather than omitted, because it is the reason the node is marked hypothetical.
  - reference: PMID:28072828
    reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "oocyte geranylgeranyl diphosphate (GGPP), a metabolic intermediate involved in protein geranylgeranylation, is required to establish the oocyte-granulosa cell communication."
    explanation: >-
      Mouse evidence that GGPP-dependent geranylgeranylation is a real and non-redundant
      requirement in at least one of the three affected tissues.
  - reference: PMID:26112408
    reference_title: Lipid-induced Muscle Insulin Resistance Is Mediated by GGPPS via Modulation of the RhoA/Rho Kinase Signaling Pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "the free fatty acid-stimulated GGPPS expression in the skeletal muscle was able to enhance the geranylgeranylation of RhoA"
    explanation: >-
      This paper is about diet-induced insulin resistance in obese mice carrying a
      heterozygous muscle-specific Ggps1 deletion, not about this disease, and it reports no
      myopathy. It is cited for one fact it establishes in vivo: that GGPPS activity in
      skeletal muscle sets the geranylgeranylation of RhoA, which is the substrate class
      this node claims is undermodified.
- name: Impaired Sarcolemmal Membrane Repair
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Patient-derived myoblasts and myotubes reseal a focal laser wound more slowly than
    controls and are about twice as likely to fail to reseal at all. This is the only
    cellular phenotype demonstrated directly in patient material, and it is the mechanistic
    bridge from a prenylation defect to a dystrophy: repeated failure of membrane repair is
    the same final pathway that makes dysferlinopathy a muscular dystrophy, reached from a
    metabolic rather than a structural lesion.
  cell_types:
  - preferred_term: patient-derived MyoD-converted myoblast
    term:
      id: CL:0000515
      label: skeletal muscle myoblast
  biological_processes:
  - preferred_term: plasma membrane repair
    modifier: DECREASED
    term:
      id: GO:0001778
      label: plasma membrane repair
  downstream:
  - target: Myofiber Degeneration with Disordered Autophagy
    causal_link_type: DIRECT
    description: >-
      Failure to reseal the wounded sarcolemma drives the cycle of fiber damage,
      degeneration and regeneration that defines a dystrophy.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed greater dye entry, indicating a poor cell membrane repair, in both the patient myoblasts and myotubes as compared to the healthy controls"
    explanation: The direct measurement of delayed membrane resealing in patient myogenic cells.
- name: Myofiber Degeneration with Disordered Autophagy
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Muscle shows a dystrophic process -- degeneration, regeneration and internalised nuclei
    -- with two additional ultrastructural features that a purely membrane-centred dystrophy
    would not predict: excess autophagic material, including myeloid bodies and positive
    LC3B staining, and enlarged though structurally normal mitochondria. Whether the
    autophagic and mitochondrial changes are a second consequence of failed Rab-dependent
    trafficking or a downstream response to chronic fiber injury is not established. Fatty
    infiltration is visible on muscle MRI, with relative sparing of rectus femoris, sartorius
    and gracilis and conspicuously asymmetric involvement.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  downstream:
  - target: Proximal Muscle Weakness
    causal_link_type: DIRECT
    description: Loss of contractile tissue in the limb-girdle muscles produces the weakness.
  - target: Elevated Serum Creatine Kinase
    causal_link_type: DIRECT
    description: Ongoing myofiber breakdown releases creatine kinase into the circulation.
  - target: Respiratory Insufficiency
    causal_link_type: DIRECT
    description: The same process involves the respiratory musculature and determines survival.
  - target: Scoliosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Axial and paraspinal muscle weakness
    description: Weakness of the axial musculature allows progressive spinal deformity.
  - target: Joint Contractures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Fixed posturing and reduced joint excursion in weak limbs
    description: Contractures follow the weakness and the immobility it imposes.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histology was dystrophic, with evidence of degeneration and regeneration and internalized nuclei."
    explanation: Establishes the dystrophic tissue process on biopsy in nine patients.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy revealed ultrastructural evidence of enlarged but structurally normal mitochondria (Patient P8) as well as evidence of excess autophagic material (Patients P1 and P8; Fig 2)."
    explanation: The ultrastructural autophagic and mitochondrial findings that this node names alongside the dystrophic change.
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole‐body muscle magnetic resonance imaging was performed in Patients P4–P6 and demonstrates variable increase in T1 signal in select muscles, resulting from fatty infiltration and thus consistent with an underlying muscular dystrophy"
    explanation: Imaging evidence of fatty replacement, the tissue-level correlate of chronic fiber loss.
- name: Ovarian Follicle Depletion
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The ovarian arm. In mouse, depleting GGPP selectively in oocytes blocks the
    primary-to-secondary follicle transition, impairs granulosa cell proliferation and
    causes near-total follicle loss with subfertility, and the defect is reversed by
    supplying GGPP. Nothing equivalent has been measured in a human with this syndrome: the
    human evidence is the clinical and hormonal phenotype, not ovarian histology. Ggps1 is
    expressed most densely in germ cells and embryonic gonad cells in the mouse E14.5 female
    gonad, which is at least consistent with an early follicular lesion.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:
  - preferred_term: ovarian follicle development
    modifier: DECREASED
    term:
      id: GO:0001541
      label: ovarian follicle development
  downstream:
  - target: Primary Ovarian Insufficiency
    causal_link_type: DIRECT
    description: >-
      Depletion of the follicle pool is what presents clinically as hypergonadotropic
      ovarian insufficiency.
  evidence:
  - reference: PMID:28072828
    reference_title: GGPP-Mediated Protein Geranylgeranylation in Oocyte Is Essential for the Establishment of Oocyte-Granulosa Cell Communication and Primary-Secondary Follicle Transition in Mouse Ovary.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The selective depletion of GGPP in mouse oocytes impaired the proliferation of granulosa cells, primary-secondary follicle transition and female fertility."
    explanation: >-
      Mouse oocyte-specific Ggpps depletion, not a human GGPS1 hypomorph, so this supports
      the node by mechanism rather than by observation in patients. It is the experiment that
      makes an ovarian phenotype expected from a GGPP deficit.
  - reference: PMID:32399598
    reference_title: "Genomic sequencing highlights the diverse molecular causes of Perrault syndrome: a peroxisomal disorder (PEX6), metabolic disorders (CLPP, GGPS1), and mtDNA maintenance/translation disorders (LARS2, TFAM)."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "whose enzymatic product is required for mouse folliculogenesis."
    explanation: >-
      An independent group, working from a Perrault cohort rather than a muscular dystrophy
      cohort, reaching the same conclusion about the relevance of the GGPPS product to
      folliculogenesis in mouse.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Global view of Ggps1 expression in the E14.5 female gonad showed clusters most densely in the germ cells and embryonic gonad cells"
    explanation: >-
      Mouse single-cell expression data placing Ggps1 in the germ cells of the developing
      female gonad, which is consistent with an ovarian lesion but does not demonstrate one.
- name: Cochlear Sensory Failure
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The auditory arm, and the emptiest node in this entry. No cochlear tissue from an
    affected individual has been examined and no cochlear mechanism has been demonstrated.
    What exists is an inference: cochlear implantation was highly effective in all four
    implanted patients in the founding cohort, which places the lesion in the sensory organ
    rather than in the auditory nerve or central pathway, and Ggps1 is diffusely expressed
    in the mouse cochlear epithelium through embryonic and early postnatal development.
    The node is retained because the phenotype has to connect to the molecular lesion
    somewhere, and it is marked hypothetical because that connection is entirely unobserved.
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Congenital Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: Failure of the cochlear sensory organ presents as sensorineural hearing loss.
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The sensorineural hearing loss observed in patients with GGPS1‐related muscular dystrophy is most likely sensory organ–related and localized to the organ of Corti, consistent with cochlear implantation being highly effective in all 4 patients in our cohort who underwent implantation."
    explanation: >-
      The localisation is an inference from therapeutic response rather than an observation
      of the cochlea, which is exactly the strength of evidence this node carries.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Single‐cell RNA sequencing of the cochlear epithelium in the E14, P1, and P7 mouse shows Ggps1 with a sustained, diffuse expression at these timepoints"
    explanation: >-
      Mouse cochlear expression data. Expression in a tissue is consistent with a lesion
      there and is not evidence of one; it is cited for what it is.
phenotypes:
- name: Proximal Muscle Weakness
  category: Musculoskeletal
  description: >-
    The constant feature. Weakness affects the limb girdles and is generalised in some
    patients, with onset from the prenatal period to preschool age and progression that is
    usually slow. It was present in twelve of thirteen individuals in the 2022 cohort.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, GGPS1‐related muscular dystrophy/hearing loss/ovarian insufficiency syndrome is characterized by a remarkably consistent and recognizable phenotype of congenital sensorineural hearing loss, primary ovarian insufficiency in females, proximal muscle weakness with episodes of variably elevated CK, scoliosis, and respiratory insufficiency, in which the symptoms are progressive in nature and can be severe."
    explanation: Names proximal muscle weakness as part of the recognisable syndrome across the founding cohort.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proximal or generalized muscle weakness (12/13) with the mean onset age of 2.7 ± 2.7 years (range 0.6–11), respiratory insufficiency (8/13) requiring non‐invasive ventilation (6/13) and tracheostomy (2/13), joint contractures (7/12), congenital or infantile‐onset bilateral severe sensorineural hearing loss (6/13)"
    explanation: Quantifies proximal or generalised weakness at twelve of thirteen individuals in the second cohort.
- name: Congenital Sensorineural Hearing Loss
  category: Auditory
  description: >-
    Bilateral sensorineural hearing loss, congenital or of infantile onset, and often the
    first symptom identified in patients with milder motor involvement. Its frequency
    differs sharply between the two cohorts: present in all but one of eleven patients in
    2020 but in only 46% of the 2022 cohort, where absence was clinically and objectively
    confirmed in the rest. It is therefore a common but not obligatory feature.
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  frequency: FREQUENT
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sensorineural hearing loss was present in all but one patient in this cohort and was the first symptom identified in those patients with milder motor phenotypes."
    explanation: Records the near-universal hearing loss of the founding cohort and its role as the presenting symptom in milder patients.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hearing loss was present in only 46% of the individuals."
    explanation: >-
      The counterweight from the second cohort, which is why this is curated as FREQUENT
      rather than VERY_FREQUENT.
  - reference: PMID:38129970
    reference_title: Expanding the phenotypic and genotypic spectrum of GGPS1 related congenital muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with only proximal muscle weakness, and elevated liver transaminases with spared hearing function."
    explanation: A genotype-confirmed patient with normal hearing, confirming that the auditory feature can be absent entirely.
- name: Primary Ovarian Insufficiency
  category: Endocrine
  description: >-
    Hypergonadotropic ovarian insufficiency in postpubertal 46,XX individuals, confirmed by
    menopausal follicle-stimulating hormone levels in the setting of amenorrhoea or
    infertility. It was present in every postpubertal female of the founding cohort. Like
    the hearing loss it is not obligatory: in the 2022 cohort only one woman had reached
    adulthood and she had no clinical signs of it, though a twelve-year-old had a raised
    FSH. Male gonadal function has never been formally assessed in this disease, and none
    of the five adult men in the founding cohort had fathered a child.
  phenotype_term:
    preferred_term: Premature ovarian insufficiency
    term:
      id: HP:0008209
      label: Premature ovarian insufficiency
  frequency: FREQUENT
  evidence:
  - reference: PMID:32403198
    reference_title: GGPS1 Mutations Cause Muscular Dystrophy/Hearing Loss/Ovarian Insufficiency Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary ovarian insufficiency, also known as premature ovarian failure, has been diagnosed in all postpubertal females in this cohort, as confirmed by menopausal levels of follicle‐stimulating hormone (FSH) in the setting of a history of amenorrhea"
    explanation: Establishes the ovarian phenotype and the hormonal criterion used to diagnose it in every postpubertal female of the cohort.
  - reference: PMID:35869884
    reference_title: GGPS1-associated muscular dystrophy with and without hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report consolidates the disease-causing role of biallelic variants in GGPS1 and demonstrates that hearing loss and ovarian insufficiency might be a variable feature of the GGPS1-associated muscular dystrophy."
    explanation: >-
      States that ovarian insufficiency, like hearing loss, is variable rather than
      obligatory, which is the basis for the FREQUENT rather than OBLIGATE frequency.
- name: Elevated Serum Creatine Kinase
  category: Laboratory
  description: >-
    Creatine kinase is raised, characteristically in episodes rather than continuously, and

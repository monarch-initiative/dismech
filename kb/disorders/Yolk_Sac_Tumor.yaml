      of Carboplatin vs. Cisplatin for Standard Risk Pediatric and Adult Patients
      With Germ Cell Tumors
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trial studies whether carboplatin or cisplatin is the preferred
      chemotherapy to use in treating metastatic standard risk germ cell tumors.
    explanation: The current registry summary defines the randomized platinum question.

datasets:
- accession: geo:GSE281147
  title: MicroRNA-371-373 cluster and methylome analysis suggests that a subset of “somatic-type” malignancies arising in germ cell tumors may originate in yolk sac tumor components
  description: 'Background: Somatic-type malignancies (SM) arising in germ cell tumors (GCTs) represent aggressive and chemoresistant neoplasms frequently occurring as metastases after chemotherapy. Historically, SM have been interpreted as originating in teratoma; however, recent observations suggest that a subset may derive from yolk sac tumor. In this study, we evaluate the relationship between conventional histologic types of GCT and SM of germ cell origin by assessing expression of miR-371~373 and genomic methylation.'

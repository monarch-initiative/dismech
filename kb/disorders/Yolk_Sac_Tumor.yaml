name: Yolk Sac Tumor
creation_date: "2026-06-15T00:00:00Z"
category: Complex
description: >-
  Yolk sac tumor (YST; endodermal sinus tumor) is a malignant neoplasm defined
  by primitive extraembryonic/endodermal differentiation rather than by one
  anatomic site or one molecular route. It occurs as a pure tumor or as a
  component of a mixed germ cell tumor in gonadal, extragonadal, and central
  nervous system sites; morphologically similar, somatically derived YST
  differentiation can also arise in a non-germ-cell carcinoma. These settings
  are not biologically interchangeable. In particular, prepubertal-type
  testicular YST is generally unrelated to germ cell neoplasia in situ (GCNIS)
  and usually lacks 12p gain, whereas postpubertal-type testicular YST is a
  GCNIS-related component of type II germ cell tumor and may belong to a
  12p-gained clone. Diagnosis integrates morphology, immunohistochemistry, and
  serum alpha-fetoprotein (AFP); staging and management remain site- and
  age-specific.
disease_term:
  preferred_term: yolk sac tumor
  term:
    id: MONDO:0005744
    label: yolk sac tumor
synonyms:
- endodermal sinus tumor
- yolk sac carcinoma
parents:
- germ cell tumor
- nonseminomatous germ cell tumor
notes: >-
  Scope guardrail: this entry describes the YST histology across sites. A YST
  component does not make every clinical or molecular observation from the
  whole mixed germ cell tumor attributable to that component. Component-level
  claims are included only when the cited study identifies YST directly;
  group-level germ cell tumor evidence is labelled partial or used only for clinical
  context. Somatically derived YST differentiation is retained as a distinct
  context and is not presented as a primordial-germ-cell-derived tumor.

has_subtypes:
- name: Prepubertal testicular YST
  display_name: Prepubertal-type testicular yolk sac tumor
  subtype_term:
    preferred_term: Testicular Yolk Sac Tumor, Prepubertal-Type
    term:
      id: NCIT:C192100
      label: Testicular Yolk Sac Tumor, Prepubertal-Type
  description: >-
    Usually a pure testicular tumor in infants and young boys. It belongs to
    the GCNIS-unrelated/type I testicular germ cell tumor pathway and is
    molecularly distinct from postpubertal-type YST.
- name: Postpubertal testicular YST
  display_name: Postpubertal-type testicular yolk sac tumor
  subtype_term:
    preferred_term: Testicular Yolk Sac Tumor, Postpubertal-Type
    term:
      id: NCIT:C192099
      label: Testicular Yolk Sac Tumor, Postpubertal-Type
  description: >-
    A GCNIS-related/type II testicular germ cell tumor histology, usually
    encountered as one component of a mixed nonseminomatous tumor. Claims about
    the entire mixed tumor are not automatically assigned to its YST component.
- name: Ovarian YST
  display_name: Ovarian yolk sac tumor
  subtype_term:
    preferred_term: ovarian yolk sac tumor
    term:
      id: MONDO:0006344
      label: ovarian yolk sac tumor
  description: >-
    A malignant ovarian germ cell tumor affecting children, adolescents, and
    young adults. Pure, mixed, and AFP-defined putative YST cohorts must be
    distinguished when interpreting treatment and outcome data.
- name: Pediatric extragonadal YST
  display_name: Pediatric extracranial extragonadal yolk sac tumor
  review_notes: >-
    No subtype_term is bound because neither NCIT:C27364 (Childhood Yolk Sac
    Tumor) nor NCIT:C68632 (Childhood Malignant Extragonadal Germ Cell Tumor)
    captures both the YST histology and the pediatric extracranial extragonadal
    site boundary. Substituting either broader class would erase part of this
    subtype's scope.
  description: >-
    Includes sacrococcygeal, retroperitoneal, vaginal, and other extracranial
    sites in children. Site modifies presentation, staging, and outcome.
- name: Mediastinal postpubertal YST
  display_name: Mediastinal postpubertal-type yolk sac tumor
  review_notes: >-
    No subtype_term is bound because MONDO:0023726 and NCIT:C6443 both denote
    mediastinal yolk sac tumor without the postpubertal/type II boundary used
    here. Those broader terms would also include pediatric mediastinal disease,
    which this subtype explicitly excludes.
  description: >-
    Usually part of a primary mediastinal nonseminomatous germ cell tumor in an
    adolescent or adult male. This setting has distinct poor-risk management,
    a strong association with Klinefelter syndrome, and a specific risk of
    clonally related hematologic malignancy. It should not be conflated with
    pediatric mediastinal type I germ cell tumors or with gonadal YST, and the
    mediastinal-germ-cell-tumor risks are not automatically YST-component-specific.
- name: CNS YST
  display_name: Central nervous system yolk sac tumor
  subtype_term:
    preferred_term: yolk sac tumor of central nervous system
    term:
      id: MONDO:0016739
      label: yolk sac tumor of central nervous system
  description: >-
    An AFP-secreting nongerminomatous CNS germ cell tumor component. CNS
    tumor-marker thresholds, staging, radiation fields, and protocols are distinct
    from extracranial disease and are curated in the CNS germ cell tumor entry.
- name: Somatically derived YST
  display_name: Somatically derived yolk sac tumor differentiation
  review_notes: >-
    No subtype_term is bound because NCIT:C178523 describes the opposite
    direction, a germ-cell-derived yolk sac tumor that transforms into a
    somatic-type malignancy. It is not an exact term for YST differentiation
    arising from a non-germ-cell malignant precursor.
  description: >-
    YST morphology and immunophenotype arising in association with a
    non-germ-cell malignancy. The probable histogenesis is lineage plasticity of
    a malignant somatic precursor rather than a conventional germ cell tumor.

pathophysiology:
- name: Primitive Endodermal Differentiation Program
  biological_scale: CELLULAR
  description: >-
    YST is defined by differentiation toward primitive extraembryonic endoderm
    and related mesenchymal programs. This developmental identity explains its
    reticular-microcystic and other endodermal patterns, but does not establish
    one universal precursor cell for every gonadal, extragonadal, CNS, and
    somatically derived context.
  biological_processes:
  - preferred_term: abnormal extraembryonic endodermal differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030154
      label: cell differentiation
  evidence:
  - reference: PMID:22008025
    reference_title: Yolk sac tumours revisited. A review of their many faces and names.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their complex nomenclature and histogenesis stress the fact that they are
      not a discrete entity, but represent a multifaceted group of neoplasms,
      for which the term primitive endodermal tumours would be more appropriate,
      accounting for their capacity to differentiate into various
      extraembryonal and somatic cell types.
    explanation: >-
      The pathology review supports primitive-endodermal differentiation while
      explicitly rejecting treatment of all YST settings as one discrete entity.
  downstream:
  - target: AFP Synthesis and Secretion
    causal_link_type: DIRECT
    description: Extraembryonic endodermal differentiation produces the AFP-positive phenotype.
    evidence:
    - reference: PMID:22008025
      reference_title: Yolk sac tumours revisited. A review of their many faces and names.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: Only AFP and glypican-3 are characteristic immunohistochemical markers.
      explanation: >-
        Marker expression is characteristic of the differentiation program;
        the review does not experimentally establish the temporal causal edge.

- name: AFP Synthesis and Secretion
  biological_scale: MOLECULAR
  description: >-
    YST cells synthesize AFP. After resection of an AFP-secreting tumor, serial
    serum AFP decay can report residual active tumor or preclinical recurrence;
    AFP is not specific to YST and tissue staining may be focal.
  gene_products:
  - preferred_term: alpha-fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive AFP staining was seen in the vast majority of YSTs (56 of 59 or
      95%); however, 32 (54%) YSTs showed staining in less than 30% tumor cells.
    explanation: >-
      A 59-case extragonadal YST series directly establishes frequent but often
      focal AFP expression.

- name: Childhood Malignant-GCT Chromosomal-Imbalance Pattern
  biological_scale: MOLECULAR
  description: >-
    A 51-tumor study of germ cell tumors in children younger than 10 years
    included 33 malignant tumors of multiple histologies and sites; it was not
    a pure-YST cohort. At that childhood malignant-GCT level, most tumors lacked
    adult-type 12p gain and recurrent imbalances included distal 1p loss,
    1q/20q gain, and 4q/6q deletion. This contextual pattern must not be assigned
    specifically to prepubertal testicular YST or generalized to all pediatric YST.
  evidence:
  - reference: PMID:11528555
    reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the exception of one testicular and two ovarian tumors, malignant
      GCTs in children do not show chromosomal gain of 12p, which is
      characteristic of GCTs in adult patients.
    explanation: >-
      The 51-tumor pediatric CGH cohort directly separates childhood malignant
      GCT genetics from the adult 12p-gain pathway.
  - reference: PMID:11528555
    reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Irrespective of the primary site, childhood GCTs show chromosomal
      imbalances of chromosome 1 (loss of distal 1p, gain of 1q), deletion of 4q
      and 6q as well as gain of 20q at a high frequency.
    explanation: >-
      This provides the recurrent pediatric copy-number pattern without
      claiming that each alteration is universal or initiating.
  downstream:
  - target: Primitive Endodermal Differentiation Program
    causal_link_type: UNKNOWN
    description: >-
      Childhood malignant GCTs with this cohort-level copy-number pattern can
      converge on YST differentiation, but the imbalances are neither a
      YST-specific initiating set nor a resolved causal sequence.
    evidence:
    - reference: PMID:11528555
      reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Irrespective of the primary site, childhood GCTs show chromosomal
        imbalances of chromosome 1 (loss of distal 1p, gain of 1q), deletion of
        4q and 6q as well as gain of 20q at a high frequency.
      explanation: >-
        The cohort supports a childhood malignant-GCT molecular route, while
        the unknown edge type avoids claiming a specific differentiation mechanism.

- name: Postpubertal GCNIS-Related 12p-Gain Pathway
  biological_scale: MOLECULAR
  description: >-
    Postpubertal-type testicular YST belongs to the GCNIS-related/type II germ
    cell tumor family. Isochromosome 12p or other 12p gain is common in that
    family and is thought to arise during progression from GCNIS to invasive
    tumor; the lesion belongs to the shared clone, not uniquely to the YST component.
  evidence:
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type II TGCTs are the only GCNIS-related tumours in this classification
      and include seminomas, embryonal carcinoma, choriocarcinoma, yolk-sac
      tumour and teratoma of postpubertal type.
    explanation: >-
      The current molecular-pathology review places postpubertal YST in the
      GCNIS-related type II family.
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A common molecular alteration in type II TGCTs is the presence of an
      isochromosome 12p or gain of 12p material.
    explanation: >-
      This supports 12p gain at the type II tumor-family level, with the scope
      restriction preserved in the node description.
  downstream:
  - target: Primitive Endodermal Differentiation Program
    causal_link_type: UNKNOWN
    description: >-
      In postpubertal testicular disease, a GCNIS-related type II clone with 12p
      gain can differentiate into a YST component; 12p gain is shared across the
      tumor family and is not a YST-lineage-specific causal lesion.
    evidence:
    - reference: PMID:41384700
      reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Type II TGCTs are the only GCNIS-related tumours in this classification
        and include seminomas, embryonal carcinoma, choriocarcinoma, yolk-sac
        tumour and teratoma of postpubertal type.
      explanation: >-
        The review places postpubertal YST in this upstream type II route, but
        does not resolve the intervening lineage mechanism.

- name: Variable Epigenetic Reprogramming and Tumor-Suppressor Methylation
  biological_scale: MOLECULAR
  description: >-
    YSTs show heterogeneous imprinting/reprogramming states and more frequent
    tumor-suppressor-gene promoter methylation than seminoma or teratoma in one
    45-tumor study. The methylation burden did not predict outcome, so it is a
    molecular characteristic rather than an established prognostic driver.
  evidence:
  - reference: PMID:19245437
    reference_title: >-
      Yolk sac tumor but not seminoma or teratoma is associated with abnormal
      epigenetic reprogramming pathway and shows frequent hypermethylation of
      various tumor suppressor genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The methylation pattern of the H19 and SNRPN DMRs was total erasure in
      seminomas, mostly physiological in teratomas, and various in yolk sac tumors.
    explanation: The tumor series directly demonstrates heterogeneous imprinting states in YST.
  - reference: PMID:19245437
    reference_title: >-
      Yolk sac tumor but not seminoma or teratoma is associated with abnormal
      epigenetic reprogramming pathway and shows frequent hypermethylation of
      various tumor suppressor genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, we found that yolk sac tumors had a higher number of
      methylated TSGs than seminomas (P < 0.001) teratomas (P = 0.004) or other
      childhood tumors.
    explanation: The comparative methylation analysis supports relative enrichment in YST.

- name: Ovarian YST Somatic-Driver Landscape
  biological_scale: MOLECULAR
  description: >-
    Sequencing of 41 ovarian YST samples from 30 patients identified recurrent
    candidate mutations and copy-number drivers, including KRAS and KIT, and
    linked higher MSI scores and OVOL2 overexpression to cisplatin resistance.
    These findings are ovarian-cohort observations requiring external validation.
  evidence:
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify somatic driver candidates, including significantly mutated
      genes KRAS and KIT and copy-number alteration drivers, including deleted
      ARID1A and PARK2, and amplified ZNF217, CDKN1B, and KRAS.
    explanation: >-
      Whole-exome and RNA sequencing directly support the ovarian YST candidate-driver landscape.
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We silenced the OVOL2 expression using two independent small interfering
      RNAs (siRNAs) (Fig. 7B) and found that, in NOY1, the knockdown of OVOL2
      dose- and time-dependently decreased cell viability in the presence of cisplatin.
    explanation: >-
      The mechanistic link was tested by OVOL2 perturbation in the NOY1 YST cell
      line, so this is in-vitro evidence rather than a clinical association.

- name: Mediastinal GCT and Blood-Cancer Shared-Precursor Branching
  biological_scale: CELLULAR
  description: >-
    In the uncommon syndrome of primary mediastinal nonseminomatous germ cell
    tumor with an associated hematologic malignancy, genomic phylogenies support
    a shared ancestral precursor followed by divergent, parallel evolution of
    the germ-cell tumor and blood cancer. This does not establish serial
    transformation of a mature YST component into leukemia, and the finding is
    scoped to the associated mediastinal syndrome rather than all YST.
  evidence:
  - reference: PMID:32897884
    reference_title: Germ cell tumors and associated hematologic malignancies evolve from a common shared precursor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings argue that this scenario represents a unique clinical
      syndrome, distinct from de novo GCTs or hematologic malignancies, initiated
      by an ancestral precursor that gives rise to the parallel evolution of
      GCTs and blood cancers in these patients.
    explanation: >-
      Genomic clonal reconstruction in 15 associated cases supports branching
      from a shared precursor rather than settled YST-to-leukemia conversion.

- name: Somatic-Lineage Plasticity to YST Differentiation
  biological_scale: CELLULAR
  description: >-
    YST-like differentiation associated with a non-germ-cell malignancy may
    arise from a malignant pluripotent somatic precursor. This is a distinct
    histogenetic setting and must not be represented as proof of a migrated
    primordial germ cell.
  biological_processes:
  - preferred_term: abnormal cell-fate commitment
    modifier: ABNORMAL
    term:
      id: GO:0045165
      label: cell fate commitment
  evidence:
  - reference: PMID:22008025
    reference_title: Yolk sac tumours revisited. A review of their many faces and names.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      YSTs associated with non-germ cell tumours probably originate from
      malignant pluripotent somatic stem cells.
    explanation: >-
      The review explicitly frames somatic origin as probable, so the node is
      kept separate and not treated as a proven universal origin.
  downstream:
  - target: Primitive Endodermal Differentiation Program
    causal_link_type: UNKNOWN
    description: >-
      A malignant somatic precursor may converge on YST-like primitive
      endodermal differentiation, but the proposed lineage route remains distinct
      from conventional germ-cell-derived YST and is not settled.
    evidence:
    - reference: PMID:22008025
      reference_title: Yolk sac tumours revisited. A review of their many faces and names.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        YSTs associated with non-germ cell tumours probably originate from
        malignant pluripotent somatic stem cells.
      explanation: The review supports only a probable somatic route, hence an unknown causal edge.

phenotypes:
- name: Elevated serum alpha-fetoprotein
  description: >-
    Elevated circulating AFP is the central biochemical phenotype and a
    longitudinal readout of AFP-secreting tumor burden. AFP is not independently
    specific for YST and must be interpreted with anatomy and pathology. In
    infants, physiologically high postnatal AFP requires comparison with
    age-adjusted reference data and serial kinetics rather than an adult upper limit.
  phenotype_term:
    preferred_term: Elevated circulating alpha-fetoprotein concentration
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  reports_on:
  - target: AFP Synthesis and Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum AFP reports on secretion by the YST component.
    evidence:
    - reference: PMID:9354734
      reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The increased AHL of AFP indicated residual active tumor after surgical resection.
      explanation: >-
        Serial AFP decay in children with AFP-secreting malignant tumors directly
        supports AFP as a residual-tumor readout.
- name: Testicular neoplasm in infancy or early childhood
  subtype: Prepubertal testicular YST
  description: >-
    Pure prepubertal testicular YST occurs in young boys; in a 33-case series,
    ages ranged from 5 to 71 months with a mean of 20.7 months.
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 33 pure yolk sac tumors of the testis from boys 5 to 71 months
      of age (mean 20.7 mo) diagnosed from 1918 to 2014.
    explanation: A pure-YST series directly supports the early-childhood testicular context.
- name: Ovarian mass
  subtype: Ovarian YST
  description: >-
    A reported mixed ovarian germ cell tumor containing YST presented as a
    large abdominopelvic mass. This single case does not establish a usual
    presentation for pure ovarian YST.
  phenotype_term:
    preferred_term: Ovarian neoplasm
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  evidence:
  - reference: PMID:40037273
    reference_title: "Acute abdominopelvic pain and distension in a 21-year-old woman revealing a mixed germ cell tumor: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present the case of a 21-year-old female who was admitted urgently due
      to a large abdominopelvic mass.
    explanation: The mixed ovarian GCT case documents one mass presentation without establishing frequency.
- name: Abnormal vaginal bleeding
  subtype: Pediatric extragonadal YST
  description: >-
    A reported one-year-old girl with vaginal YST presented with prolonged
    vaginal bleeding and urinary retention. This case does not establish a
    characteristic presentation frequency for vaginal YST.
  phenotype_term:
    preferred_term: Abnormal vaginal bleeding
    term:
      id: HP:0034263
      label: Abnormal vaginal bleeding
  evidence:
  - reference: PMID:40818404
    reference_title: "Pediatric vaginal yolk sac tumor: A rare case report and diagnostic challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of vaginal YST involving a one-year-old girl who
      presented with prolonged vaginal bleeding and urinary retention.
    explanation: The pediatric vaginal YST case directly supports the site-specific symptom.
- name: Mediastinal mass
  subtype: Mediastinal postpubertal YST
  description: >-
    A mediastinal YST component occurs within a primary mediastinal
    nonseminomatous GCT mass, predominantly in adolescent or young adult males;
    this phenotype does not imply that the entire mass is pure YST.
  phenotype_term:
    preferred_term: Mediastinal mass
    term:
      id: HP:0033823
      label: Mediastinal mass
  evidence:
  - reference: PMID:25395492
    reference_title: "The yolk sac tumor: reflections on a remarkable neoplasm and two of the many intrigued by it-Gunnar Teilum and Aleksander Talerman-and the bond it formed between them."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: mediastinal forms are mostly restricted to young adult males
    explanation: The review supports the age/site pattern while the description preserves mixed-tumor scope.

histopathology:
- name: Reticular-Microcystic Pattern
  description: >-
    The most common pattern is a reticular or microcystic network. YST is
    histologically heterogeneous, so absence of this pattern does not exclude it.
  finding_term:
    preferred_term: reticular-microcystic growth pattern
    term:
      id: NCIT:C157706
      label: Microcystic Growth Pattern
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The commonest pattern was reticular-microcystic, but macrocystic,
      papillary, endodermal sinus (Schiller-Duval bodies), labyrinthine,
      myxomatous, glandular, and solid patterns were also observed.
    explanation: A pure pediatric testicular YST series documents both the dominant and variant patterns.
- name: Schiller-Duval Bodies
  description: >-
    Endodermal-sinus structures are characteristic when present but are only
    one pattern within the broader morphologic spectrum; diagnosis should not
    require them in every tumor.
  finding_term:
    preferred_term: Schiller-Duval body
    term:
      id: NCIT:C54124
      label: Schiller-Duval Body
  diagnostic: true
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The commonest pattern was reticular-microcystic, but macrocystic,
      papillary, endodermal sinus (Schiller-Duval bodies), labyrinthine,
      myxomatous, glandular, and solid patterns were also observed.
    explanation: The cohort places Schiller-Duval bodies within, rather than above, the full pattern spectrum.
- name: SALL4-Positive OCT4-Negative Immunophenotype
  description: >-
    Diffuse nuclear SALL4 is highly sensitive in extragonadal and pediatric YST.
    In the cited extragonadal series, OCT4 negativity separated YST from
    OCT4-positive germ cell components; AFP and glypican-3 were less diffuse
    than SALL4 in many tumors.
  diagnostic: true
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All 59 YSTs were negative for OCT4.
    explanation: The extragonadal series directly supports OCT4 negativity.
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong SALL4 staining was seen in all 59 YSTs (in more than 90% tumor cells
      in 54 and 70% to 85% tumor cells in 5 YSTs).
    explanation: The series establishes diffuse SALL4 sensitivity in extragonadal YST.

biochemical:
- name: Serum Alpha-Fetoprotein
  notes: >-
    Serial serum AFP decay after resection can indicate residual active tumor or
    preclinical recurrence in AFP-secreting pediatric tumors; AFP is not a
    stand-alone histologic diagnosis. Neonatal and infant
    values must be interpreted against age-adjusted reference data because
    physiologic AFP remains above adult levels for months after birth.
  biomarker_term:
    preferred_term: Alpha-Fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  readouts:
  - target: AFP Synthesis and Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    evidence:
    - reference: PMID:9354734
      reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In group 1, which had complete resection and no recurrence during
        follow-up (n = 13), the AHL of AFP was 4.0 +/- 0.9 days.
      explanation: This supplies the observed post-resection AFP decay in children without recurrence.
    - reference: PMID:9354734
      reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In group 2, which had incomplete resection or recurrence during follow-up
        (n = 5), the AHL of AFP was 24.8 +/- 20 days, significantly longer than
        that of group 1 (P = 0.0026).
      explanation: This supports delayed AFP clearance as a residual/recurrent-tumor signal.
  evidence:
  - reference: PMID:6163129
    reference_title: Serum alpha fetoprotein (AFP) levels in normal infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that it was not until 8 months of age that the normal AFP level
      in infants approached adult level.
    explanation: >-
      Normal-infant longitudinal data establish why an adult AFP cutoff is
      inappropriate in early infancy.
- name: SALL4 Expression
  notes: >-
    SALL4 is a sensitive tissue biomarker but is not specific to YST; it must be
    interpreted in a morphology- and panel-based diagnosis.
  biomarker_term:
    preferred_term: Sal-Like Protein 4
    term:
      id: NCIT:C112908
      label: Sal-Like Protein 4
  evidence:
  - reference: PMID:32222813
    reference_title: SALL4 is a useful marker for pediatric yolk sac tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to AFP and glypican-3, SALL4 staining in more than 90% of the
      tumor cells was seen in all 22 pediatric YSTs (100% sensitivity)
      (P < 0.001 for both SALL4 vs. AFP and SALL4 vs. glypican-3).
    explanation: A pediatric YST series directly supports high sensitivity and diffuse staining.
- name: FOXA2 Nuclear Expression
  subtype: Postpubertal testicular YST
  notes: >-
    Nuclear FOXA2 immunohistochemistry is curated here only for postpubertal-type
    testicular YST, the population tested in this 24-case series; it is not
    generalized to prepubertal, ovarian, extragonadal, CNS, or somatically
    derived YST. Mature glands in postpubertal-type teratoma are a diagnostic
    pitfall, so FOXA2 remains part of a morphology- and panel-based diagnosis.
  biomarker_term:
    preferred_term: Hepatocyte Nuclear Factor 3-Beta
    term:
      id: NCIT:C73454
      label: Hepatocyte Nuclear Factor 3-Beta
  specificity: >-
    Highly sensitive and specific within the tested postpubertal-type testicular
    YST cohort, with superior performance to GPC3 and AFP in difficult patterns;
    mature teratomatous glands can also stain.
  evidence:
  - reference: PMID:37317674
    reference_title: FoxA2 is a reliable marker for the diagnosis of yolk sac tumour postpubertal-type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FoxA2 was positive in all YSTpt (24 of 24) and all but one (23 of 24)
      exhibited 2+/3+ stain
    explanation: >-
      The postpubertal-type testicular cohort directly establishes universal
      FOXA2 positivity and moderate-to-diffuse staining in 23 of 24 tumors.
  - reference: PMID:37317674
    reference_title: FoxA2 is a reliable marker for the diagnosis of yolk sac tumour postpubertal-type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FoxA2 is a highly sensitive and specific biomarker that supports the
      diagnosis of YSTpt. FoxA2 is superior to GPC3 and AFP, especially in rare
      and difficult-to-diagnose histological patterns of YSTpt, but mature glands
      of Tpt could represent a potential diagnostic pitfall.
    explanation: >-
      The authors' conclusion supports the comparative diagnostic role while
      preserving the tested postpubertal-type scope and teratoma pitfall.
- name: Glypican-3 Expression
  notes: >-
    Glypican-3 is frequently positive but variable in extent and is interpreted
    as part of an immunohistochemical panel.
  biomarker_term:
    preferred_term: Glypican-3
    term:
      id: NCIT:C88175
      label: Glypican-3
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all 59 YSTs showed positive glypican-3 staining, 18 (30%) showed
      staining in less than 30% tumor cells, and additional 10 (17%) showed
      staining in between 30% and 60% tumor cells.
    explanation: This establishes frequent but variably extensive glypican-3 staining.

genetic:
- name: Pediatric recurrent chromosomal imbalances
  association: >-
    Recurrent childhood malignant-GCT pattern of distal 1p loss, 1q/20q gain,
    and 4q/6q deletion in a mixed-site, mixed-histology cohort; not a
    prepubertal-testicular-YST-specific or obligatory driver set
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:11528555
    reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Irrespective of the primary site, childhood GCTs show chromosomal
      imbalances of chromosome 1 (loss of distal 1p, gain of 1q), deletion of 4q
      and 6q as well as gain of 20q at a high frequency.
    explanation: The evidence is pediatric malignant-GCT-level rather than isolated pure-YST sequencing.
- name: Isochromosome 12p or other 12p gain
  subtype: Postpubertal testicular YST
  association: Shared clonal hallmark of GCNIS-related/type II testicular germ cell tumors
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A common molecular alteration in type II TGCTs is the presence of an
      isochromosome 12p or gain of 12p material.
    explanation: The claim is explicitly restricted to the postpubertal/type II context.
- name: KRAS
  subtype: Ovarian YST
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  association: Candidate recurrent somatic driver mutation and copy-number amplification in ovarian YST
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify somatic driver candidates, including significantly mutated
      genes KRAS and KIT and copy-number alteration drivers, including deleted
      ARID1A and PARK2, and amplified ZNF217, CDKN1B, and KRAS.
    explanation: The ovarian cohort identifies KRAS through both mutation and amplification analyses.
- name: KIT
  subtype: Ovarian YST
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  association: Candidate recurrent somatic driver mutation in ovarian YST
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify somatic driver candidates, including significantly mutated
      genes KRAS and KIT and copy-number alteration drivers, including deleted
      ARID1A and PARK2, and amplified ZNF217, CDKN1B, and KRAS.
    explanation: The ovarian cohort identifies KIT as a significantly mutated candidate driver.
- name: TP53
  subtype: Ovarian YST
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Infrequently mutated in the studied ovarian YST cohort; not a universal absence
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      YSTs have very infrequent TP53 mutations, whereas the tumors from patients
      with abnormal gonadal development contain both KRAS and TP53 mutations.
    explanation: The source supports rarity with a defined gonadal-development exception.
- name: Klinefelter syndrome (47,XXY) association
  association: >-
    Strongly increased incidence of extragonadal germ cell tumor, particularly
    mediastinal disease, in a Klinefelter syndrome cohort; this is a
    mediastinal-GCT association rather than a YST-component-specific estimate
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:41789737
    reference_title: Incidence of Gonadal and Extragonadal Germ Cell Tumours in Patients With Klinefelter Syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For EGCT, the crude age-standardised incidence ratio was 83.0 (95% CI,
      2.1-460.5).
    explanation: >-
      The cohort quantifies the Klinefelter-extragonadal-GCT association, while
      the wide interval and one mediastinal event require cautious interpretation.

prevalence:
- population: Children and adolescents in the United States SEER registries, 2000-2018
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A population-based study identified 520 pediatric YST cases in SEER over 19
    diagnosis years. This is a registry case count, not a prevalence or
    incidence denominator; no population rate is inferred here.
  evidence:
  - reference: PMID:37747514
    reference_title: >-
      Clinical characteristics and prognostic models of gonadal and extra-gonadal
      yolk sac tumors: a population-based analysis in children and adolescents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 520 YST patients were identified.
    explanation: This is retained as an occurrence anchor without manufacturing a rate.

progression:
- phase: Pediatric population-based survival
  age_range: Children and adolescents
  notes: >-
    In SEER 2000-2018, pediatric YST had 92.2% 3-year and 90.3% 5-year overall
    survival; older age and extragonadal site were adverse in that analysis.
  evidence:
  - reference: PMID:37747514
    reference_title: >-
      Clinical characteristics and prognostic models of gonadal and extra-gonadal
      yolk sac tumors: a population-based analysis in children and adolescents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival rates for all patients were 92.2% at 3-year and 90.3% at
      5-year, respectively.
    explanation: The population-based cohort provides YST-specific overall survival.
  - reference: PMID:37747514
    reference_title: >-
      Clinical characteristics and prognostic models of gonadal and extra-gonadal
      yolk sac tumors: a population-based analysis in children and adolescents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, patients with extra-gonadal YST have a lower survival rate
      than those with gonadal YST.
    explanation: This supports site-stratified prognosis rather than one uniform outcome.
- phase: Platinum-treated ovarian YST outcome
  age_range: Children, adolescents, and adults aged 0-38 years
  notes: >-
    A pooled international trial dataset included pure YST, mixed tumors with a
    YST component, and AFP-defined putative YST. The combined 5-year EFS was 91%
    and OS 96%; this is not a pure-YST-only estimate.
  evidence:
  - reference: PMID:29194189
    reference_title: Ovarian Yolk Sac Tumors; Does Age Matter?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall 5-year event-free survival and overall survival was 91% (95%
      confidence interval, 87%-94%) and 96% (92%-98%), respectively.
    explanation: The pooled ovarian YST dataset directly reports the combined outcomes.
  - reference: PMID:29194189
    reference_title: Ovarian Yolk Sac Tumors; Does Age Matter?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histology was pure, mixed, and putative in 129, 56, and 66 cases, respectively.
    explanation: This makes the component mixture behind the outcome estimate explicit.
- phase: Stage I ovarian surveillance and early relapse
  age_range: Girls aged 0-16 years
  notes: >-
    Surgery followed by surveillance spared chemotherapy in about half of a
    small pediatric stage I malignant ovarian GCT cohort dominated by YST, but
    recurrences were early and AFP-positive; salvage preserved overall survival.
  evidence:
  - reference: PMID:24395845
    reference_title: >-
      Surveillance after initial surgery for pediatric and adolescent girls
      with stage I ovarian germ cell tumors: report from the Children's Oncology Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a median follow-up of 42 months, 12 patients had evidence of
      persistent or recurrent disease (4-year EFS, 52%; 95% CI, 31% to 69%).
    explanation: The prospective COG study quantifies recurrence under stage I surveillance.
  - reference: PMID:24395845
    reference_title: >-
      Surveillance after initial surgery for pediatric and adolescent girls
      with stage I ovarian germ cell tumors: report from the Children's Oncology Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven of 12 patients experiencing relapse received successful salvage
      chemotherapy (4-year OS, 96%; 95% CI, 74% to 99%).
    explanation: This supports the high salvage-supported overall survival.
- phase: Stage I pediatric testicular outcome
  age_range: Pediatric and adolescent
  notes: >-
    In pooled prospective trials, all evaluable stage I tumors contained YST
    elements; no deaths occurred, while age at least 12 years and higher pT
    stage predicted events. This is not a pure prepubertal-YST-only cohort.
  evidence:
  - reference: PMID:35606324
    reference_title: >-
      Clinicopathologic predictors of outcomes in children with stage I
      testicular germ cell tumors: A pooled post hoc analysis of trials from
      the Children's Oncology Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients with evaluable histopathology, yolk sac tumor elements
      were present in all patients and lymphovascular invasion in 51% of patients.
    explanation: This defines the YST-containing nature of the stage I cohort.
  - reference: PMID:35606324
    reference_title: >-
      Clinicopathologic predictors of outcomes in children with stage I
      testicular germ cell tumors: A pooled post hoc analysis of trials from
      the Children's Oncology Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over a median follow-up of 56 months, no patients died, and 25 patients
      (24%) experienced an event (median event-free survival not reached).
    explanation: This separates excellent survival from nonzero relapse/event risk.
- phase: Mediastinal GCT-associated hematologic malignancy
  age_range: Patients with primary mediastinal nonseminomatous germ cell tumors
  notes: >-
    In an international retrospective series, 17 of 287 patients with primary
    mediastinal nonseminomatous germ cell tumors developed a hematologic
    disorder. The median onset was 6 months and median survival after the blood
    cancer diagnosis was 5 months. This severe mediastinal-GCT syndrome is not
    automatically attributable to a YST component in every mixed tumor.
  evidence:
  - reference: PMID:10620634
    reference_title: Hematologic disorders associated with primary mediastinal nonseminomatous germ cell tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A hematologic disorder was observed in 17 patients with germ cell tumors.
    explanation: >-
      The cohort makes the hematologic risk substantive and confines it to
      primary mediastinal nonseminomatous GCT rather than all YST.
  - reference: PMID:10620634
    reference_title: Hematologic disorders associated with primary mediastinal nonseminomatous germ cell tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median time to onset of hematologic neoplasia was 6 months (range,
      0-47 months), and the median survival after diagnosis of the hematologic
      disorder was 5 months (range, 0-16 months).
    explanation: The series directly quantifies the early onset and poor outcome.

diagnosis:
- name: Integrated Histopathology and Immunohistochemistry
  description: >-
    Diagnose YST by architecture and cytology integrated with an antibody panel.
    SALL4 was strong and diffuse in the cited 59-case extragonadal series,
    whereas AFP and glypican-3 were often focal or variable. SALL4 is also
    expressed by other primitive germ cell
    tumors; OCT4 negativity helps distinguish YST from germinoma/dysgerminoma
    and embryonal carcinoma. No single stain substitutes for morphology.
  diagnosis_term:
    preferred_term: Histopathologic Examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that SALL4 is a novel sensitive (100% sensitivity)
      diagnostic marker for extragonadal YSTs.
    explanation: A large extragonadal series supports SALL4 as a sensitive panel component.
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive AFP staining was seen in the vast majority of YSTs (56 of 59 or
      95%); however, 32 (54%) YSTs showed staining in less than 30% tumor cells.
      Although all 59 YSTs showed positive glypican-3 staining, 18 (30%) showed
      staining in less than 30% tumor cells, and additional 10 (17%) showed
      staining in between 30% and 60% tumor cells.
    explanation: >-
      The same series directly shows why AFP and glypican-3 should not be called
      uniformly diffuse.
- name: Serum AFP Measurement and Kinetic Follow-up
  markers: AFP
  description: >-
    Follow serum AFP serially after resection of an AFP-secreting tumor.
    Delayed clearance supports residual active tumor and AFP half-life may
    detect preclinical recurrence. In infants, compare AFP with age-adjusted
    physiologic ranges before attributing an elevation to tumor;
    interpretation remains contextual rather than diagnostic alone.
  diagnosis_term:
    preferred_term: Alpha-fetoprotein Measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  evidence:
  - reference: PMID:9354734
    reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The increased AHL of AFP indicated residual active tumor after surgical resection.
    explanation: Serial AFP kinetics directly report residual active tumor in the pediatric study.
  - reference: PMID:9354734
    reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The AHL of AFP may be more sensitive than serial monitoring of AFP in
      detecting preclinical recurrence after surgical resection of AFP-secreting tumors.
    explanation: The pediatric study explicitly supports the post-resection recurrence use.
  - reference: PMID:6163129
    reference_title: Serum alpha fetoprotein (AFP) levels in normal infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that it was not until 8 months of age that the normal AFP level
      in infants approached adult level.
    explanation: >-
      Normal infant data require age-adjusted rather than adult AFP thresholds.
- name: Site-Specific Staging and Risk Classification
  description: >-
    Stage and risk-classify the complete germ cell tumor context rather than the
    YST component in isolation. Advanced postpubertal testicular germ cell tumors
    use IGCCCG risk classification, primary mediastinal nonseminoma is assigned
    to the IGCCCG poor-prognosis group, and the cited ovarian YST cohorts use
    FIGO stage. The pediatric evidence here is limited to stage I ovarian
    malignant germ cell tumors and does not establish a universal pediatric
    extracranial or CNS YST staging convention.
  diagnosis_term:
    preferred_term: staging procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:18302061
    reference_title: Influence of tumor site and histology on long-term survival in 193 children with extracranial germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although germ cell tumors (GCT) supposedly share the same cell type of
      origin, their clinical course differs considerably depending on tumor site and histology.
    explanation: The pediatric cohort supports preserving site and histology in clinical interpretation.
  - reference: PMID:38958901
    reference_title: SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with persistent markers after orchiectomy or advanced disease at
      diagnosis should be staged and classified according to the IGCCCG
      prognostic classification.
    explanation: This supports IGCCCG risk classification in advanced postpubertal testicular disease.
  - reference: PMID:35554637
    reference_title: How to classify, diagnose, treat and follow-up extragonadal germ cell tumors? A systematic review of available evidence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      EGCT patients are classified according to the IGCCCG classification.
      Consecutively, all mediastinal non-seminomatous EGCT patients belong to
      the "poor prognosis" group.
    explanation: >-
      The systematic review supplies the mediastinal nonseminomatous risk
      context; it is not a YST-component-specific stage.
  - reference: PMID:29194189
    reference_title: Ovarian Yolk Sac Tumors. Does Age Matter?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Any patient with an O-YST that was International Federation of Gynecology
      and Obstetrics stage IC or higher and treated with a platinum-based
      chemotherapy was eligible.
    explanation: >-
      The pooled ovarian trials explicitly use FIGO stage while retaining pure,
      mixed, and putative histology strata.
  - reference: PMID:24395845
    reference_title: "Surveillance after initial surgery for pediatric and adolescent girls with stage I ovarian germ cell tumors: report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between November 2003 and July 2011, girls age 0 to 16 years with stage I
      MOGCT were enrolled onto Children's Oncology Group study AGCT0132.
    explanation: >-
      This supports the stage I pediatric ovarian context only; it does not
      establish staging conventions for other pediatric extracranial sites.

differential_diagnoses:
- name: Juvenile granulosa cell tumor of the testis
  description: >-
    In an infant with a testicular tumor, juvenile granulosa cell tumor overlaps
    in age and some morphology but is a sex-cord stromal tumor. Architecture and
    an appropriate immunohistochemical panel distinguish it from YST.
  distinguishing_features:
  - The cited pure testicular YST series notes morphologic overlap with juvenile granulosa cell tumor.
  - In that series, juvenile granulosa cell tumor occurred at a slightly younger age and had distinctive features.
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is crucial that this tumor be distinguished from the juvenile granulosa
      cell tumor, which occurs at a slightly younger age and has distinctive
      features, although there may be some morphologic overlap.
    explanation: The pure pediatric testicular YST series directly names the differential.
- name: Mature teratoma
  description: >-
    Pediatric teratoma can occur in the same age/site spectrum. Diffuse SALL4
    staining supports YST over mature teratoma when morphology is challenging.
  distinguishing_features:
  - Diffuse nuclear SALL4 in the malignant primitive component favors YST.
  - Mature somatic tissues without a malignant YST component favor mature teratoma.
  evidence:
  - reference: PMID:32222813
    reference_title: SALL4 is a useful marker for pediatric yolk sac tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SALL4 is a sensitive marker for pediatric YSTs and it can be used to
      distinguish them from mature teratomas.
    explanation: The 22-YST/10-teratoma comparison directly supports this distinction.
- name: Ovarian clear cell carcinoma
  description: >-
    Ovarian YST and clear cell carcinoma can overlap morphologically. Diffuse
    nuclear SALL4 favors YST in this site, while an integrated epithelial-marker
    profile and morphology support clear cell carcinoma; SALL4 is not a
    universal germ-cell-subtype discriminator.
  distinguishing_features:
  - Diffuse SALL4 with compatible endodermal-sinus or reticular morphology favors YST.
  - In the cited comparison, CK7 and EMA were positive in all 45 clear cell carcinomas but only focally positive in 3 and 4 YSTs, respectively.
  evidence:
  - reference: PMID:19295406
    reference_title: SALL4 is a novel sensitive and specific marker of ovarian primitive germ cell tumors and is particularly useful in distinguishing yolk sac tumor from clear cell carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SALL4 is particularly useful in distinguishing YST from CCC and better
      than AFP, glypican-3, CK7, and EMA.
    explanation: The ovarian immunohistochemical comparison directly addresses this differential.
  - reference: PMID:19295406
    reference_title: SALL4 is a novel sensitive and specific marker of ovarian primitive germ cell tumors and is particularly useful in distinguishing yolk sac tumor from clear cell carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three (10%) and 4 (14%) YSTs show focal (<2% tumor cells) CK7 and EMA
      staining, respectively. CK7 and EMA are positive in all 45 CCCs but 3
      (7%) and 1 (2%) cases show staining in less than 30% tumor cells, respectively.
    explanation: The ovarian series supplies the exact CK7 and EMA comparison.
- name: CNS germinoma or embryonal carcinoma component
  description: >-
    In primary CNS germ cell tumors, germinoma and embryonal carcinoma can also
    express diffuse SALL4. Strong OCT4 supports those CNS components, whereas
    other germ cell tumors in the cited CNS series were OCT4-negative;
    morphology and a full panel remain required.
  distinguishing_features:
  - In a primary CNS germ cell tumor, strong OCT4 with compatible morphology favors germinoma or embryonal carcinoma.
  - In that CNS differential, OCT4 negativity does not identify YST without compatible morphology and a full panel.
  evidence:
  - reference: PMID:19820689
    reference_title: "Diagnostic utility of SALL4 in primary germ cell tumors of the central nervous system: a study of 77 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All germinomas and embryonal carcinomas showed strong OCT4 staining (4+
      in all except 1 germinoma with 3+), whereas other germ cell tumors were negative.
    explanation: >-
      The CNS germ-cell-tumor series shows why SALL4 alone cannot separate these
      primitive components and supports OCT4 as a discriminator.
- name: Non-germ-cell carcinoma with YST-like morphology or differentiation
  description: >-
    Endometrial, gastric, lung, and other somatic carcinomas may show endodermal
    morphology or a somatically derived YST component. Patient age, anatomic
    setting, associated conventional carcinoma, molecular profile, and the full
    immunophenotypic panel determine whether this is a germ-cell-derived YST.
  distinguishing_features:
  - The cited review states that endodermal somatic differentiation may reproduce pulmonary, intestinal, and hepatic tissues.
  - It also reports morphologic identity with some embryonal-type endodermal gastric and lung carcinomas.
  evidence:
  - reference: PMID:22008025
    reference_title: Yolk sac tumours revisited. A review of their many faces and names.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Endodermal somatic differentiation reproduces pulmonary, intestinal and
      hepatic tissues and are identical with some, embryonal-type endodermal,
      gastric and lung carcinomas, which are indistinguishable from YSTs.
    explanation: The pathology review directly documents the morphologic overlap.

treatments:
- name: Testicular Inguinal Orchiectomy
  description: >-
    Radical inguinal orchiectomy establishes diagnosis and local control for a
    testicular tumor containing YST. Subsequent surveillance, staging, and
    systemic therapy differ between prepubertal-type pure YST and postpubertal
    GCNIS-related pure or mixed nonseminomatous tumors.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  evidence:
  - reference: PMID:38958901
    reference_title: SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inguinal orchiectomy is the main diagnostic procedure, and is also
      curative for most localized tumors, while patients with unfavorable risk
      factors for recurrence, or those who are unable or unwilling to undergo
      close follow-up, may require adjuvant treatment.
    explanation: The guideline supports the testicular operation without generalizing follow-up across ages and risks.
- name: Ovarian Fertility-Sparing Surgery
  description: >-
    Unilateral salpingo-oophorectomy with limited, site-appropriate staging is
    preferred when feasible for adolescent and young-adult ovarian malignant
    germ cell tumors containing YST. Operative extent depends on stage, tumor
    burden, fertility goals, and whether the lesion is pure YST, a mixed germ
    cell tumor, or YST differentiation in a somatic epithelial neoplasm.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: unilateral salpingo-oophorectomy
    term:
      id: NCIT:C94469
      label: Unilateral Salpingo-oophorectomy
  evidence:
  - reference: PMID:41001186
    reference_title: Updates in the Management of Malignant Ovarian Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Fertility-sparing surgery, including unilateral salpingo-oophorectomy with
      minimal staging, is recommended for adolescent and young adult patients.
    explanation: The review supports the ovarian site-specific fertility-preserving approach.
- name: Postpubertal and Adult Risk-Adapted BEP Chemotherapy
  description: >-
    BEP is a cisplatin-based backbone for postpubertal/adult malignant germ cell
    tumors containing YST, with cycles and alternatives selected by site,
    anatomic stage, marker kinetics, and IGCCCG group. It also has an ovarian
    role, but this record does not assign adult BEP to every pediatric or CNS setting.
  therapeutic_modality: SMALL_MOLECULE
  regimen_term:
    preferred_term: BEP Regimen
    term:
      id: NCIT:C63488
      label: BEP Regimen
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  evidence:
  - reference: PMID:38958901
    reference_title: SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with persistent markers after orchiectomy or advanced disease at
      diagnosis should be staged and classified according to the IGCCCG
      prognostic classification. BEP is the most recommended chemotherapy, but
      other schedules such as EP or VIP may be used to avoid bleomycin in some patients.
    explanation: The current guideline ties postpubertal testicular systemic treatment to IGCCCG context.
  - reference: PMID:41001186
    reference_title: Updates in the Management of Malignant Ovarian Germ Cell Tumors.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The bleomycin/etoposide/cisplatin regimen remains the first-line therapy.
    explanation: The ovarian malignant-germ-cell-tumor review explicitly supports an ovarian BEP role.
- name: Pediatric Compressed PEB Chemotherapy
  description: >-
    Selected pediatric protocols use cisplatin, etoposide, and bleomycin (PEB),
    including compressed three-cycle salvage for residual or recurrent stage I
    ovarian malignant germ cell tumors. This protocol evidence includes tumors
    containing YST and should not be extrapolated to every pediatric site or stage.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
  evidence:
  - reference: PMID:24395845
    reference_title: "Surveillance after initial surgery for pediatric and adolescent girls with stage I ovarian germ cell tumors: report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In those with residual or recurrent disease, chemotherapy with compressed
      PEB (cisplatin, etoposide, and bleomycin) was initiated every 3 weeks for three cycles.
    explanation: This directly supports the context-specific pediatric compressed-PEB record.
- name: Pediatric JEB Chemotherapy
  description: >-
    Carboplatin, etoposide, and bleomycin (JEB) is a pediatric extracranial-GCT
    protocol option supported by a UK study of patients aged 0-16 years that
    included 107 YSTs. Its carboplatin backbone is specific to protocols and
    jurisdictions, not interchangeable with adult BEP or CNS regimens by default.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
  evidence:
  - reference: PMID:11078494
    reference_title: "The United Kingdom Children's Cancer Study Group's second germ cell tumor study: carboplatin, etoposide, and bleomycin are effective treatment for children with malignant extracranial germ cell tumors, with acceptable toxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The remaining 184 patients had germinoma (n = 20), malignant teratoma (n =
      55), embryonal carcinoma (n = 1), yolk sac tumor (n = 107), or
      choriocarcinoma (n = 1). Forty-seven patients were treated with surgery
      alone, and 137 patients received JEB.
    explanation: The pediatric study directly documents the histologic mixture and JEB exposure.
  - reference: PMID:41525035
    reference_title: Establishment and characterization of a testicular yolk sac tumor PDX model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      JEB treatment induced significant tumor regression without causing
      clinically relevant body weight loss.
    explanation: >-
      The testicular YST xenograft provides preclinical response evidence; it
      does not substitute for the pediatric clinical protocol evidence above.
- name: Primary Mediastinal Poor-Risk Cisplatin-Based Therapy
  description: >-
    Primary mediastinal nonseminomatous GCT is an IGCCCG poor-risk setting. The
    cited review recommends individualized dose-intensified or high-dose upfront
    chemotherapy and expert-center referral. This
    whole-tumor risk category is not evidence that every mediastinal YST
    component independently has the same prognosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:35554637
    reference_title: How to classify, diagnose, treat and follow-up extragonadal germ cell tumors? A systematic review of available evidence.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      however, due to their very poor prognosis patients with non-seminomatous
      mediastinal GCT should receive a dose-intensified or high-dose chemotherapy
      approach upfront on an individual basis and should thus be referred to expert centers
    explanation: The systematic review explicitly supports individualized intensified therapy and expert-center referral.
- name: Post-Chemotherapy Mediastinal Residual-Mass Resection
  description: >-
    Resect the residual mediastinal mass after platinum-based chemotherapy for
    primary mediastinal nonseminomatous GCT when technically feasible, using an
    experienced high-volume multidisciplinary center. Management follows the
    residual whole tumor, which may be mixed, rather than a YST component alone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: definitive surgical resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  evidence:
  - reference: PMID:30666469
    reference_title: Management of Residual Mass in Germ Cell Tumors After Chemotherapy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All patients with primary mediastinal non-seminoma should undergo surgical
      resection of the mediastinal mass post-chemotherapy. These are complex
      surgeries and require expert surgeons in high-volume centers.
    explanation: The review directly supports site-specific residual-mass surgery.
- name: Component-Directed Therapy for Somatically Derived Ovarian YST
  description: >-
    When a YST component arises with an ovarian epithelial malignancy, adjuvant
    platinum-based therapy should be selected to address both the epithelial
    carcinoma and germ-cell-like components. Evidence is sparse and no ideal
    regimen is established, so this must not be managed as routine pure YST without review.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:30113473
    reference_title: "Ovarian yolk sac tumor in postmenopausal females: A case series and a literature review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      When YST mixed with epithelial cancer components, adjuvant chemotherapy
      regimen should include platinum-based chemotherapy aiming at both
      epithelial ovarian cancer and germ cell tumors.
    explanation: >-
      The review offers component-directed guidance, but its small case base
      does not establish a single regimen.
- name: Surveillance After Complete Stage I Resection
  description: >-
    Selected children with completely resected stage I ovarian or testicular
    malignant germ cell tumors can undergo intensive marker/imaging surveillance
    with prompt salvage chemotherapy at recurrence. This is protocol-defined and
    is not a blanket surgery-only recommendation for every stage I adult or site.
  treatment_term:
    preferred_term: active surveillance
  evidence:
  - reference: PMID:24395845
    reference_title: >-
      Surveillance after initial surgery for pediatric and adolescent girls
      with stage I ovarian germ cell tumors: report from the Children's Oncology Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty percent of patients with stage I pediatric MOGCT can be spared
      chemotherapy; treatment for those who experience recurrence preserves OS.
    explanation: The prospective pediatric ovarian study supports a selected surveillance strategy.
- name: Neoadjuvant Chemotherapy for Selected Advanced Ovarian YST
  description: >-
    For advanced ovarian YST with high tumor burden or poor operative tolerance,
    neoadjuvant chemotherapy followed by interval surgery is an option. Evidence
    is retrospective and includes mixed tumors containing YST elements.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: neoadjuvant chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:37696647
    reference_title: Advanced ovarian yolk sac tumor. Upfront surgery or neoadjuvant chemotherapy followed by interval debulking?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For patients with advanced-stage ovarian yolk sac tumor, neoadjuvant
      chemotherapy followed by interval surgery is an alternative option,
      especially for those who cannot tolerate the primary debulking surgery
      because of high tumor burden and vulnerable status.
    explanation: The 40-patient retrospective comparison supports this selected alternative.

animal_models:
- name: Testicular YST patient-derived xenograft
  species: Mus musculus
  genotype: Patient-derived xenografts from a pediatric testicular yolk sac tumor
  category: Patient-derived xenograft
  description: >-
    Testicular YST tissue was serially passaged in immunodeficient NPG and
    BALB/c nude mice, retaining Schiller-Duval morphology and AFP/SALL4
    expression. JEB sensitivity was tested in vivo and ex vivo. This single
    patient-derived preclinical model does not establish clinical efficacy or
    represent ovarian, mediastinal, CNS, mixed, or somatically derived YST.
  modeled_mechanisms:
  - target: Primitive Endodermal Differentiation Program
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The human testicular YST xenograft preserves characteristic yolk-sac
      morphology together with the source tumor's AFP/SALL4 expression profile,
      reproducing assayable features of primitive endodermal differentiation.
    limitations: >-
      This is a single pediatric testicular tumor propagated subcutaneously in
      immunodeficient mice. Morphology and two diagnostic proteins support the
      link, but do not establish fidelity across other YST sites, ages, mixed
      tumors, immune contexts, or the full differentiation program.
    evidence:
    - reference: PMID:41525035
      reference_title: Establishment and characterization of a testicular yolk sac tumor PDX model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        H&E staining confirmed preservation of characteristic yolk sac morphology,
        including Schiller-Duval bodies. Immunohistochemical analysis demonstrated
        consistent expression of AFP and SALL4 in PDX tumors, mirroring the
        diagnostic profile of the original specimen.
      explanation: >-
        Preserved morphology plus AFP/SALL4 expression directly grounds the
        model-to-mechanism link; moderate fidelity reflects its single-patient,
        immunodeficient xenograft context.
  evidence:
  - reference: PMID:41525035
    reference_title: Establishment and characterization of a testicular yolk sac tumor PDX model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The patient-derived TYST tumor tissues exhibited higher tumorigenicity in
      NPG and BALB/c nude mice, maintaining stability through serial passaging.
    explanation: The study directly establishes and serially passages the mouse PDX.
  - reference: PMID:41525035
    reference_title: Establishment and characterization of a testicular yolk sac tumor PDX model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunohistochemical analysis demonstrated consistent expression of AFP
      and SALL4 in PDX tumors, mirroring the diagnostic profile of the original specimen.
    explanation: The PDX preserved the source tumor's key protein-expression profile.


name: Yolk Sac Tumor
creation_date: "2026-06-15T00:00:00Z"
category: Complex
description: >-
  Yolk sac tumor (YST; endodermal sinus tumor) is a malignant neoplasm defined
  by primitive extraembryonic/endodermal differentiation rather than by one
  anatomic site or one molecular route. It occurs as a pure tumor or as a
  component of a mixed germ cell tumor in gonadal, extragonadal, and central
  nervous system sites; morphologically similar, somatically derived YST
  differentiation can also arise in a non-germ-cell carcinoma. These settings
  are not biologically interchangeable. In particular, prepubertal-type
  testicular YST is generally unrelated to germ cell neoplasia in situ (GCNIS)
  and usually lacks 12p gain, whereas postpubertal-type testicular YST is a
  GCNIS-related component of type II germ cell tumor and commonly belongs to a
  12p-gained clone. Diagnosis integrates morphology, immunohistochemistry, and
  serum alpha-fetoprotein (AFP); staging and management remain site- and
  age-specific.
disease_term:
  preferred_term: yolk sac tumor
  term:
    id: MONDO:0005744
    label: yolk sac tumor
synonyms:
- endodermal sinus tumor
- yolk sac carcinoma
parents:
- germ cell tumor
- nonseminomatous germ cell tumor
notes: >-
  Scope guardrail: this entry describes the YST histology across sites. A YST
  component does not make every clinical or molecular observation from the
  whole mixed germ cell tumor attributable to that component. Component-level
  claims are included only when the cited study identifies YST directly;
  group-level germ cell tumor evidence is labelled partial or used only for clinical
  context. Somatically derived YST differentiation is retained as a distinct
  context and is not presented as a primordial-germ-cell-derived tumor.

has_subtypes:
- name: Prepubertal testicular YST
  display_name: Prepubertal-type testicular yolk sac tumor
  description: >-
    Usually a pure testicular tumor in infants and young boys. It belongs to
    the GCNIS-unrelated/type I testicular germ cell tumor pathway and is
    molecularly distinct from postpubertal-type YST.
- name: Postpubertal testicular YST
  display_name: Postpubertal-type testicular yolk sac tumor
  description: >-
    A GCNIS-related/type II testicular germ cell tumor histology, usually
    encountered as one component of a mixed nonseminomatous tumor. Claims about
    the entire mixed tumor are not automatically assigned to its YST component.
- name: Ovarian YST
  display_name: Ovarian yolk sac tumor
  description: >-
    A malignant ovarian germ cell tumor affecting children, adolescents, and
    young adults. Pure, mixed, and AFP-defined putative YST cohorts must be
    distinguished when interpreting treatment and outcome data.
- name: Pediatric extragonadal YST
  display_name: Pediatric extracranial extragonadal yolk sac tumor
  description: >-
    Includes sacrococcygeal, retroperitoneal, vaginal, and other extracranial
    sites in children. Site modifies presentation, staging, and outcome.
- name: Mediastinal postpubertal YST
  display_name: Mediastinal postpubertal-type yolk sac tumor
  description: >-
    Usually part of a primary mediastinal nonseminomatous germ cell tumor in an
    adolescent or adult male. It should not be conflated with pediatric
    mediastinal type I germ cell tumors or with gonadal YST.
- name: CNS YST
  display_name: Central nervous system yolk sac tumor
  description: >-
    An AFP-secreting nongerminomatous CNS germ cell tumor component. CNS
    tumor-marker thresholds, staging, radiation fields, and protocols are distinct
    from extracranial disease and are curated in the CNS germ cell tumor entry.
- name: Somatically derived YST
  display_name: Somatically derived yolk sac tumor differentiation
  description: >-
    YST morphology and immunophenotype arising in association with a
    non-germ-cell malignancy. The leading histogenesis is lineage plasticity of a
    malignant somatic precursor rather than a conventional germ cell tumor.

pathophysiology:
- name: Primitive Endodermal Differentiation Program
  biological_scale: CELLULAR
  description: >-
    YST is defined by differentiation toward primitive extraembryonic endoderm
    and related mesenchymal programs. This developmental identity explains its
    reticular-microcystic and other endodermal patterns, but does not establish
    one universal precursor cell for every gonadal, extragonadal, CNS, and
    somatically derived context.
  biological_processes:
  - preferred_term: abnormal extraembryonic endodermal differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030154
      label: cell differentiation
  evidence:
  - reference: PMID:22008025
    reference_title: Yolk sac tumours revisited. A review of their many faces and names.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their complex nomenclature and histogenesis stress the fact that they are
      not a discrete entity, but represent a multifaceted group of neoplasms,
      for which the term primitive endodermal tumours would be more appropriate,
      accounting for their capacity to differentiate into various
      extraembryonal and somatic cell types.
    explanation: >-
      The pathology review supports primitive-endodermal differentiation while
      explicitly rejecting treatment of all YST settings as one discrete entity.
  downstream:
  - target: AFP Synthesis and Secretion
    causal_link_type: DIRECT
    description: Extraembryonic endodermal differentiation produces the AFP-positive phenotype.
    evidence:
    - reference: PMID:22008025
      reference_title: Yolk sac tumours revisited. A review of their many faces and names.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: Only AFP and glypican-3 are characteristic immunohistochemical markers.
      explanation: >-
        Marker expression is characteristic of the differentiation program;
        the review does not experimentally establish the temporal causal edge.

- name: AFP Synthesis and Secretion
  biological_scale: MOLECULAR
  description: >-
    YST cells synthesize AFP. Circulating AFP is a tumor-burden readout used in
    diagnosis, response assessment, surveillance, and relapse detection, but it
    is not specific to YST and tissue staining may be focal.
  gene_products:
  - preferred_term: alpha-fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive AFP staining was seen in the vast majority of YSTs (56 of 59 or
      95%); however, 32 (54%) YSTs showed staining in less than 30% tumor cells.
    explanation: >-
      A 59-case extragonadal YST series directly establishes frequent but often
      focal AFP expression.

- name: Pediatric-Type Chromosomal-Imbalance Pathway
  biological_scale: MOLECULAR
  description: >-
    Malignant germ cell tumors in children younger than 10 years, including YST
    across several sites, usually lack the adult-type 12p gain and instead show
    recurrent loss of distal 1p, gain of 1q and 20q, and deletion of 4q and 6q.
    These are cohort-level recurrent alterations, not a single obligatory YST driver.
  evidence:
  - reference: PMID:11528555
    reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the exception of one testicular and two ovarian tumors, malignant
      GCTs in children do not show chromosomal gain of 12p, which is
      characteristic of GCTs in adult patients.
    explanation: >-
      The 51-tumor pediatric CGH cohort directly separates childhood malignant
      GCT genetics from the adult 12p-gain pathway.
  - reference: PMID:11528555
    reference_title: Genetic analysis of childhood germ cell tumors with comparative genomic hybridization.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Irrespective of the primary site, childhood GCTs show chromosomal
      imbalances of chromosome 1 (loss of distal 1p, gain of 1q), deletion of 4q
      and 6q as well as gain of 20q at a high frequency.
    explanation: >-
      This provides the recurrent pediatric copy-number pattern without
      claiming that each alteration is universal or initiating.

- name: Postpubertal GCNIS-Related 12p-Gain Pathway
  biological_scale: MOLECULAR
  description: >-
    Postpubertal-type testicular YST belongs to the GCNIS-related/type II germ
    cell tumor family. Isochromosome 12p or other 12p gain is common in that
    family and is thought to arise during progression from GCNIS to invasive
    tumor; the lesion belongs to the shared clone, not uniquely to the YST component.
  evidence:
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type II TGCTs are the only GCNIS-related tumours in this classification
      and include seminomas, embryonal carcinoma, choriocarcinoma, yolk-sac
      tumour and teratoma of postpubertal type.
    explanation: >-
      The current molecular-pathology review places postpubertal YST in the
      GCNIS-related type II family.
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A common molecular alteration in type II TGCTs is the presence of an
      isochromosome 12p or gain of 12p material.
    explanation: >-
      This supports 12p gain at the type II tumor-family level, with the scope
      restriction preserved in the node description.

- name: Variable Epigenetic Reprogramming and Tumor-Suppressor Methylation
  biological_scale: MOLECULAR
  description: >-
    YSTs show heterogeneous imprinting/reprogramming states and more frequent
    tumor-suppressor-gene promoter methylation than seminoma or teratoma in one
    45-tumor study. The methylation burden did not predict outcome, so it is a
    molecular characteristic rather than an established prognostic driver.
  evidence:
  - reference: PMID:19245437
    reference_title: >-
      Yolk sac tumor but not seminoma or teratoma is associated with abnormal
      epigenetic reprogramming pathway and shows frequent hypermethylation of
      various tumor suppressor genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The methylation pattern of the H19 and SNRPN DMRs was total erasure in
      seminomas, mostly physiological in teratomas, and various in yolk sac tumors.
    explanation: The tumor series directly demonstrates heterogeneous imprinting states in YST.
  - reference: PMID:19245437
    reference_title: >-
      Yolk sac tumor but not seminoma or teratoma is associated with abnormal
      epigenetic reprogramming pathway and shows frequent hypermethylation of
      various tumor suppressor genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, we found that yolk sac tumors had a higher number of
      methylated TSGs than seminomas (P < 0.001) teratomas (P = 0.004) or other
      childhood tumors.
    explanation: The comparative methylation analysis supports relative enrichment in YST.

- name: Ovarian YST Somatic-Driver Landscape
  biological_scale: MOLECULAR
  description: >-
    Sequencing of 41 ovarian YST samples from 30 patients identified recurrent
    candidate mutations and copy-number drivers, including KRAS and KIT, and
    linked higher MSI scores and OVOL2 overexpression to cisplatin resistance.
    These findings are ovarian-cohort observations requiring external validation.
  evidence:
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify somatic driver candidates, including significantly mutated
      genes KRAS and KIT and copy-number alteration drivers, including deleted
      ARID1A and PARK2, and amplified ZNF217, CDKN1B, and KRAS.
    explanation: >-
      Whole-exome and RNA sequencing directly support the ovarian YST candidate-driver landscape.
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We further reveal a role of OVOL2 overexpression in YST resistance to cisplatin.
    explanation: >-
      The study links OVOL2 overexpression to resistance, but replication in an
      independent clinical cohort remains necessary.

- name: Somatic-Lineage Plasticity to YST Differentiation
  biological_scale: CELLULAR
  description: >-
    YST-like differentiation associated with a non-germ-cell malignancy may
    arise from a malignant pluripotent somatic precursor. This is a distinct
    histogenetic setting and must not be represented as proof of a migrated
    primordial germ cell.
  biological_processes:
  - preferred_term: abnormal cell-fate commitment
    modifier: ABNORMAL
    term:
      id: GO:0045165
      label: cell fate commitment
  evidence:
  - reference: PMID:22008025
    reference_title: Yolk sac tumours revisited. A review of their many faces and names.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      YSTs associated with non-germ cell tumours probably originate from
      malignant pluripotent somatic stem cells.
    explanation: >-
      The review explicitly frames somatic origin as probable, so the node is
      kept separate and not treated as a proven universal origin.

phenotypes:
- name: Elevated serum alpha-fetoprotein
  description: >-
    Elevated circulating AFP is the central biochemical phenotype and a
    longitudinal readout of AFP-secreting tumor burden. AFP is not independently
    specific for YST and must be interpreted with anatomy and pathology.
  phenotype_term:
    preferred_term: Elevated circulating alpha-fetoprotein concentration
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  reports_on:
  - target: AFP Synthesis and Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum AFP reports on secretion by the YST component.
    evidence:
    - reference: PMID:9354734
      reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The increased AHL of AFP indicated residual active tumor after surgical resection.
      explanation: >-
        Serial AFP decay in children with AFP-secreting malignant tumors directly
        supports AFP as a residual-tumor readout.
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive AFP staining was seen in the vast majority of YSTs (56 of 59 or
      95%); however, 32 (54%) YSTs showed staining in less than 30% tumor cells.
    explanation: This supports frequent AFP production while preserving intratumoral heterogeneity.
- name: Testicular neoplasm in infancy or early childhood
  subtype: Prepubertal testicular YST
  description: >-
    Pure prepubertal testicular YST occurs in young boys; in a 33-case series,
    ages ranged from 5 to 71 months with a mean of 20.7 months.
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 33 pure yolk sac tumors of the testis from boys 5 to 71 months
      of age (mean 20.7 mo) diagnosed from 1918 to 2014.
    explanation: A pure-YST series directly supports the early-childhood testicular context.
- name: Site-dependent mass lesion
  description: >-
    The presenting mass and local symptoms depend on the primary site rather
    than constituting one universal phenotype. Extragonadal sites in a 77-case
    series included anterior mediastinum, CNS, retroperitoneum, sacrococcygeal
    region, and neck.
  phenotype_term:
    preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: PMID:38697270
    reference_title: >-
      Extragonadal germ cell tumors: A clinicopathologic study with emphasis on
      molecular features, clinical outcomes and associated secondary malignancies.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anterior mediastinum was the most common anatomic site, followed by central
      nervous system, retroperitoneum, sacroccygeal area, and neck.
    explanation: >-
      The extragonadal germ cell tumor cohort establishes the site distribution;
      it is not a pure-YST symptom-frequency estimate.

histopathology:
- name: Reticular-Microcystic Pattern
  description: >-
    The most common pattern is a reticular or microcystic network. YST is
    histologically heterogeneous, so absence of this pattern does not exclude it.
  finding_term:
    preferred_term: reticular-microcystic growth pattern
    term:
      id: NCIT:C157706
      label: Microcystic Growth Pattern
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The commonest pattern was reticular-microcystic, but macrocystic,
      papillary, endodermal sinus (Schiller-Duval bodies), labyrinthine,
      myxomatous, glandular, and solid patterns were also observed.
    explanation: A pure pediatric testicular YST series documents both the dominant and variant patterns.
- name: Schiller-Duval Bodies
  description: >-
    Endodermal-sinus structures are characteristic when present but are only
    one pattern within the broader morphologic spectrum; diagnosis should not
    require them in every tumor.
  finding_term:
    preferred_term: Schiller-Duval body
    term:
      id: NCIT:C54124
      label: Schiller-Duval Body
  diagnostic: true
  evidence:
  - reference: PMID:25828390
    reference_title: Yolk Sac Tumor of the Testis in Infants and Children. A Clinicopathologic Analysis of 33 Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The commonest pattern was reticular-microcystic, but macrocystic,
      papillary, endodermal sinus (Schiller-Duval bodies), labyrinthine,
      myxomatous, glandular, and solid patterns were also observed.
    explanation: The cohort places Schiller-Duval bodies within, rather than above, the full pattern spectrum.
- name: SALL4-Positive OCT4-Negative Immunophenotype
  description: >-
    Diffuse nuclear SALL4 is highly sensitive in extragonadal and pediatric YST.
    OCT4 negativity helps separate YST from OCT4-positive germ cell components;
    AFP and glypican-3 are useful but commonly less diffuse.
  diagnostic: true
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All 59 YSTs were negative for OCT4.
    explanation: The extragonadal series directly supports OCT4 negativity.
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strong SALL4 staining was seen in all 59 YSTs (in more than 90% tumor cells
      in 54 and 70% to 85% tumor cells in 5 YSTs).
    explanation: The series establishes diffuse SALL4 sensitivity in extragonadal YST.

biochemical:
- name: Serum Alpha-Fetoprotein
  notes: >-
    AFP should be measured at diagnosis and serially after treatment. A failure
    to decline at the expected rate can indicate residual active tumor; AFP is a
    burden marker, not a stand-alone histologic diagnosis.
  biomarker_term:
    preferred_term: Alpha-Fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  readouts:
  - target: AFP Synthesis and Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    evidence:
    - reference: PMID:9354734
      reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In group 1, which had complete resection and no recurrence during
        follow-up (n = 13), the AHL of AFP was 4.0 +/- 0.9 days.
      explanation: This supplies the observed post-resection AFP decay in children without recurrence.
    - reference: PMID:9354734
      reference_title: Actual half-life of alpha-fetoprotein as a prognostic tool in pediatric malignant tumors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In group 2, which had incomplete resection or recurrence during follow-up
        (n = 5), the AHL of AFP was 24.8 +/- 20 days, significantly longer than
        that of group 1 (P = 0.0026).
      explanation: This supports delayed AFP clearance as a residual/recurrent-tumor signal.
- name: SALL4 Expression
  notes: >-
    SALL4 is a sensitive tissue biomarker but is not specific to YST; it must be
    interpreted in a morphology- and panel-based diagnosis.
  biomarker_term:
    preferred_term: Sal-Like Protein 4
    term:
      id: NCIT:C112908
      label: Sal-Like Protein 4
  evidence:
  - reference: PMID:32222813
    reference_title: SALL4 is a useful marker for pediatric yolk sac tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to AFP and glypican-3, SALL4 staining in more than 90% of the
      tumor cells was seen in all 22 pediatric YSTs (100% sensitivity)
      (P < 0.001 for both SALL4 vs. AFP and SALL4 vs. glypican-3).
    explanation: A pediatric YST series directly supports high sensitivity and diffuse staining.
- name: Glypican-3 Expression
  notes: >-
    Glypican-3 is frequently positive but variable in extent and is interpreted
    as part of an immunohistochemical panel.
  biomarker_term:
    preferred_term: Glypican-3
    term:
      id: NCIT:C88175
      label: Glypican-3
  evidence:
  - reference: PMID:19574883
    reference_title: >-
      Diagnostic utility of SALL4 in extragonadal yolk sac tumors: an
      immunohistochemical study of 59 cases with comparison to placental-like
      alkaline phosphatase, alpha-fetoprotein, and glypican-3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all 59 YSTs showed positive glypican-3 staining, 18 (30%) showed
      staining in less than 30% tumor cells, and additional 10 (17%) showed
      staining in between 30% and 60% tumor cells.
    explanation: This establishes frequent but variably extensive glypican-3 staining.


discussions:
- discussion_id: gap_yst_histogenesis_across_contexts
  prompt: >-
    Which precursor cells and developmental trajectories generate
    prepubertal-type, postpubertal GCNIS-related, ovarian, extragonadal, CNS, and somatically
    derived YST, and which molecular events are shared versus context-specific?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Primitive Endodermal Differentiation Program
  - pathophysiology#Childhood Malignant-GCT Chromosomal-Imbalance Pattern
  - pathophysiology#Postpubertal GCNIS-Related 12p-Gain Pathway
  - pathophysiology#Somatic-Lineage Plasticity to YST Differentiation
  rationale: >-
    Morphologic convergence on primitive endoderm does not prove common origin.
    Pediatric and postpubertal testicular tumors differ in GCNIS and 12p biology;
    SNP-array analysis also found several histogenetic routes and intratumoral
    genomic differences. Cross-sectional tumors cannot directly reconstruct the lineage.
  evidence:
  - reference: PMID:34561860
    reference_title: Molecular genetic evidence supporting diverse histogenic origins of germ cell tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data indicate that GCTs may have various histogenesis and intratumoral
      genomic differences, which might provide important information for the
      identification of GCTs, especially for those with different histologic areas.
    explanation: The SNP-array study directly supports diverse origins and within-tumor genomic differences.
- discussion_id: gap_yst_chemoresistance_validation
  prompt: >-
    Which genomic, epigenomic, transcriptional, and microenvironmental features
    reproducibly predict primary or acquired platinum resistance in YST, and do
    they generalize beyond ovarian cohorts?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ovarian YST Somatic-Driver Landscape
  rationale: >-
    The principal ovarian sequencing cohort associated MSI-related signatures
    and OVOL2 overexpression with resistance, but sample numbers were small and
    the authors called for independent validation. Relapsed tumors may reflect
    therapy selection, and findings cannot yet be generalized to pediatric,
    testicular, mediastinal, or CNS YST.
  evidence:
  - reference: PMID:34117242
    reference_title: Analysis of the genomic landscape of yolk sac tumors reveals mechanisms of evolution and chemoresistance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study lays a critical foundation for understanding key molecular
      aberrations in YSTs and developing related therapeutic strategies.
    explanation: The authors characterize the work as a foundation rather than a validated clinical biomarker set.
- discussion_id: gap_yst_component_specific_outcomes
  prompt: >-
    What treatment effects and outcomes are attributable to a YST component
    itself after stratifying pure YST from mixed germ cell tumors by site, age,
    stage, component proportion, treatment, and somatically derived status?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Many clinical series combine pure YST, mixed tumors containing YST, and
    marker-defined putative YST. Overall-tumor behavior cannot be assigned to a
    microscopic component without component-resolved pathology and molecular
    analysis. Rare extragonadal sites and somatically derived YST are especially underpowered.
  evidence:
  - reference: PMID:29194189
    reference_title: Ovarian Yolk Sac Tumors; Does Age Matter?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histology was pure, mixed, and putative in 129, 56, and 66 cases, respectively.
    explanation: The largest pooled ovarian analysis illustrates the mixed evidentiary strata.
- discussion_id: gap_yst_site_specific_staging_harmonization
  prompt: >-
    How can pediatric and adult, ovarian and testicular, extracranial and CNS
    staging/risk systems be harmonized for comparative YST research without
    erasing clinically meaningful site-specific distinctions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Current care correctly stages the whole tumor using site-specific systems,
    but that complicates cross-study comparison. A harmonized research mapping
    needs central pathology, explicit pure-versus-mixed component annotation,
    and parallel retention of the native clinical stage.


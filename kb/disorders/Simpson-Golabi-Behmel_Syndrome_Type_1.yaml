diagnosis:
- name: Molecular confirmation of SGBS1
  description: >-
    The diagnosis is established by identifying a GPC3 loss of function variant or
    deletion in a proband with suggestive findings. Because the allelic spectrum is
    weighted toward gross lesions, sequencing alone is not sufficient: a negative
    sequencing result is followed by deletion and duplication analysis, and in
    female probands that order is reversed.
  evidence:
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SGBS1 is established in a male proband with suggestive findings and/or a hemizygous pathogenic variant in GPC3 or an intragenic or whole-gene deletion of GPC3 identified by molecular genetic testing."
    explanation: The GeneReviews statement of how the diagnosis is established.
  - reference: PMID:30683921
    reference_title: "CUGC for Simpson-Golabi-Behmel syndrome (SGBS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In female probands, MLPA would be the ﬁrst diagnostic step, followed by sequencing."
    explanation: >-
      Records the sex-dependent testing order, which follows from carrier females
      typically harbouring deletions detectable by dosage analysis.
  notes: >-
    The MLPA snippet above keeps the U+FB01 ligature that PDF extraction left in the
    cached clinical utility gene card. Replacing it with plain "fi" makes the quote
    stop matching, because the gating reference validator does not fold ligatures.
animal_models:
- name: Gpc3-null mouse
  species: Mouse
  genotype: Gpc3 knockout (GPC3-deficient)
  publication: PMID:10402475
  description: >-
    The loss of function mouse that established GPC3 as sufficient for the overgrowth
    phenotype and that produced the ligand level result which undercut the IGF2
    sequestration model.
  modeled_mechanisms:
  - target: Generalized Prenatal and Postnatal Overgrowth
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The null mouse reproduces the developmental overgrowth together with several
      other features of the human syndrome, including cystic and dysplastic kidneys
      and abnormal lung development.
    limitations: >-
      Perinatal death in a proportion of mutants limits the study of postnatal and
      later childhood phenotypes, and the tumor predisposition that defines the human
      syndrome is not part of the reported phenotype.
    readouts:
    - name: Developmental overgrowth
      target: Generalized Prenatal and Postnatal Overgrowth
      direction: INCREASED
      interpretation: Body size excess as the organism-level correlate of the human phenotype.
      evidence:
      - reference: PMID:10402475
        reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we report that GPC3-deficient mice exhibit several of the clinical features observed in SGBS patients, including developmental overgrowth, perinatal death, cystic and dyplastic kidneys, and abnormal lung development."
        explanation: Reports the overgrowth measurement in the null mouse.
    evidence:
    - reference: PMID:10402475
      reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the particular case of the kidney, we demonstrate that there is an early and persistent developmental abnormality of the ureteric bud/collecting system due to increased proliferation of cells in this tissue element."
      explanation: >-
        Supports treating this model as informative for the overgrowth node, by
        localizing the proliferative defect to a specific developing compartment.
  - target: IGF2 Sequestration by Glypican-3
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The model does not reproduce what the IGF2 sequestration hypothesis predicts. If
      glypican-3 restrained IGF-II by binding it, removing glypican-3 should raise
      ligand levels; in the null mouse they are unchanged.
    limitations: >-
      A negative ligand level result does not exclude a local or compartment specific
      effect on IGF-II availability that a whole animal measurement would miss, so this
      refutes simple sequestration rather than every possible IGF2 mechanism.
    readouts:
    - name: Circulating IGF-II level
      target: IGF2 Sequestration by Glypican-3
      direction: UNCHANGED
      interpretation: >-
        The prediction of the sequestration model is an increase; the measurement shows
        no difference from littermate controls.
      evidence:
      - reference: PMID:10402475
        reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Unlike the IGF2R-deficient mice, however, the levels of IGF-II in GPC3 knockouts are similar to those of the normal littermates."
        explanation: The ligand-level measurement itself, reported as unchanged.
    evidence:
    - reference: PMID:10402475
      reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unlike the IGF2R-deficient mice, however, the levels of IGF-II in GPC3 knockouts are similar to those of the normal littermates."
      explanation: >-
        Substantiates the negative claim: this model is informative for the IGF2 node
        precisely because it fails to show what that model predicts.
genetic:
- name: GPC3
  gene_term:
    preferred_term: GPC3
    term:
      id: hgnc:4451
      label: GPC3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Hemizygous loss of function variants and deletions of GPC3 at Xq26 cause
    Simpson-Golabi-Behmel syndrome type 1.
  notes: >-
    The allelic spectrum is broad and skewed toward gross lesions: point mutations,
    single and multi exon deletions, whole gene deletions, and X;autosome
    translocation breakpoints have all been reported. Contiguous deletions may extend
    into the neighbouring GPC4. Quantitatively, large deletions are the commonest single
    class at 34.9%, ahead of frameshift (24.4%) and nonsense (16.3%) variants, which is
    the numeric form of the skew described above and the reason dosage analysis belongs
    in the diagnostic strategy rather than after it.
    A nosological note for whoever revisits this entry: the clinical utility gene card
    argues that SGBS type 2 does not exist as an entity, the cases so designated being
    PIGA-related disease, and concludes that speaking of type 1 is therefore no longer
    justified. This entry keeps the type 1 name because that is the MONDO term it binds,
    not because the two-type division is endorsed.
    Germline mosaicism has been reported in this syndrome
    (Li et al., PMID:17850639), which is why an apparently de novo variant does not
    reduce recurrence risk to background. That report is cited here in prose rather
    than as an evidence item because its PubMed record carries no abstract text, so no
    exact quote can be verified against the cache.
  evidence:
  - reference: PMID:8589713
    reference_title: "Mutations in GPC3, a glypican gene, cause the Simpson-Golabi-Behmel overgrowth syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GPC3 encodes a putative extracellular proteoglycan, glypican 3, that is inferred to play an important role in growth control in embryonic mesodermal tissues in which it is selectively expressed."
    explanation: Identifies the gene product and its expression domain.
  - reference: PMID:9950367
    reference_title: "A small interstitial deletion in the GPC3 gene causes Simpson-Golabi-Behmel syndrome in a Dutch-Canadian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here a 13 base pair deletion which causes a frameshift and premature termination of the GPC3 gene in the Dutch-Canadian SGBS family in whom the trait was originally mapped. Our analysis shows that a discrete GPC3 disabling mutation is sufficient to cause SGBS."
    explanation: >-
      Establishes that a discrete intragenic GPC3 lesion alone is sufficient to cause the
      syndrome, ruling out a requirement for a larger contiguous deletion.
  - reference: PMID:30683921
    reference_title: "CUGC for Simpson-Golabi-Behmel syndrome (SGBS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most prevalent type is large deletions (34.9%) followed by frameshift variants (24.4%), nonsense variants (16.3%), missense variants (8.1%), large duplications (8.1%), splice site variants (4.7%), translocations (2.3%)"
    explanation: >-
      Quantifies the allelic spectrum. Large deletions are the single commonest class,
      which is what makes sequencing alone an insufficient diagnostic strategy.
  - reference: PMID:30683921
    reference_title: "CUGC for Simpson-Golabi-Behmel syndrome (SGBS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As penetrance is complete in male patients and since the disease is present from birth, molecular diagnosis is not used for predictive testing."
    explanation: >-
      Records complete penetrance in males, which is why predictive testing has no role
      and testing is diagnostic or carrier-directed instead.
treatments:
- name: Wilms Tumor and Hepatoblastoma Surveillance
  description: >-
    Abdominal ultrasound with serum alpha fetoprotein every three months from
    diagnosis to age three years for Wilms tumor and hepatoblastoma, then renal
    ultrasound every three months to age seven years. No protocol has been
    established for the rarer tumors in the spectrum, which are instead covered by
    six monthly review with a cancer predisposition specialist.
  treatment_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Persistence of Embryonal Progenitor Tissue
  evidence:
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for Wilms tumor and hepatoblastoma with abdominal ultrasound and serum AFP level every three months from time of diagnosis until age three years; renal ultrasound every three months until age seven years"
    explanation: The GeneReviews tumor surveillance protocol.
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no specific tumor screening protocol has been established for neuroblastoma, gonadoblastoma, or medulloblastoma, but follow up with a cancer predisposition specialist every six months is recommended"
    explanation: >-
      Records the limit of the evidence-based protocol, so the entry does not imply
      surveillance coverage that does not exist.
- name: Neonatal Hypoglycemia and Airway Management
  description: >-
    The two urgent neonatal problems. Hypoglycemia requires prompt correction and
    glucose monitoring through the neonatal period; airway obstruction arises from
    micrognathia and glossoptosis and may require positioning or airway support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Neonatal Hypoglycemia
  evidence:
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prompt treatment of neonatal hypoglycemia and airway obstruction resulting from micrognathia and glossoptosis."
    explanation: The GeneReviews acute neonatal management recommendation.
- name: Longitudinal Cardiac Surveillance
  description: >-
    Detection of structural heart defects at diagnosis, followed by ongoing cardiac
    review for conduction and rhythm disturbance. This is the only condition specific
    longitudinal surveillance besides tumor screening, and the clinical utility gene
    card links it to premature death.
  treatment_term:
    preferred_term: Cardiac Disease Screening
    term:
      id: NCIT:C168126
      label: Cardiac Disease Screening
  target_mechanisms:
  - target: Congenital Heart Defect
  evidence:
  - reference: PMID:30683921
    reference_title: "CUGC for Simpson-Golabi-Behmel syndrome (SGBS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to the detection of heart defects at the time of the diagnosis, a regular cardiac follow-up is necessary in order to detect and treat heart conduction and rhythm problems."
    explanation: The clinical utility gene card recommendation for ongoing cardiac follow-up.
differential_diagnoses:
- name: Beckwith-Wiedemann syndrome
  disease_term:
    preferred_term: Beckwith-Wiedemann syndrome
    term:
      id: MONDO:0007534
      label: Beckwith-Wiedemann syndrome
  description: >-
    The principal differential: the other major overgrowth syndrome with embryonal
    tumor risk, macroglossia, visceromegaly, and neonatal hypoglycemia. The clinical
    resemblance is close enough that it drove the original hypothesis that
    glypican-3 acts on IGF2, since Beckwith-Wiedemann involves biallelic IGF2
    expression.
  distinguishing_features:
  - X-linked inheritance with affected males favors Simpson-Golabi-Behmel syndrome; 11p15 imprinting disruption favors Beckwith-Wiedemann syndrome.
  - Coarse facial features, postaxial polydactyly, and supernumerary nipples favor Simpson-Golabi-Behmel syndrome.
  - Hemihyperplasia and omphalocele are more characteristic of Beckwith-Wiedemann syndrome.
  evidence:
  - reference: PMID:10402475
    reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The clinical features of SGBS are very similar to the more extensively studied Beckwith-Wiedemann syndrome (BWS)."
    explanation: States the clinical overlap that makes this the primary differential.

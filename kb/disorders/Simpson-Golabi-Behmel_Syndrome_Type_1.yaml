disease_term:
  preferred_term: Simpson-Golabi-Behmel syndrome type 1
  term:
    id: MONDO:0020602
    label: Simpson-Golabi-Behmel syndrome type 1
synonyms:
- GPC3 Simpson-Golabi-Behmel syndrome
- Golabi-Rosen syndrome
- SGBS1
- dysplasia gigantism syndrome, X-linked
description: >-
  Simpson-Golabi-Behmel syndrome type 1 is an X-linked overgrowth disorder caused
  by loss of function variants and deletions in GPC3, which encodes the cell
  surface heparan sulfate proteoglycan glypican-3. Affected males show pre and
  postnatal macrosomia, macrocephaly with coarse facial features, visceromegaly,
  and a broad range of congenital anomalies, together with an increased risk of
  embryonal tumors in childhood, principally Wilms tumor and hepatoblastoma.
  The mechanism has been revised since the gene was identified, and the entry is
  curated to reflect that. Glypican-3 was originally proposed to act by binding and
  restraining IGF2, on the strength of a ligand blot interaction and the clinical
  resemblance to Beckwith-Wiedemann syndrome. The Gpc3 null mouse reproduced the
  overgrowth but showed unchanged IGF-II levels, which does not fit a simple ligand
  sequestration model. The mechanism now supported by direct experiment is that
  glypican-3 binds Hedgehog with high affinity, competes with Patched for that
  ligand, and drives Hedgehog endocytosis and degradation, so that losing GPC3
  releases Hedgehog signaling and drives growth. The IGF2 model is retained here as
  an unsupported historical hypothesis rather than deleted, because it is what much
  of the older literature assumes.
inheritance:
- name: X-linked
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    Hemizygous males are affected. Heterozygous carrier females may show
    manifestations because of skewed X chromosome inactivation. Germline mosaicism has
    also been reported and affects recurrence risk counselling; see the notes on the
    GPC3 genetic entry for its attribution.
  evidence:
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SGBS1 is inherited in an X-linked manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Females who inherit the pathogenic variant will be carriers, although due to X-chromosome inactivation, carrier females may have manifestations of SGBS1."
    explanation: Records manifesting carrier females, which matters for counselling and ascertainment.
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the mother of the proband has a pathogenic variant, the chance of transmitting the pathogenic variant in each pregnancy is 50%."
    explanation: The per-pregnancy transmission risk given to a carrier mother.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence estimate has been established. Neither the GeneReviews
    chapter nor the clinical utility gene card states one, and the deep-research report
    found none. The record is carried as not yet documented rather than omitted so the
    absence is visible as a curation fact rather than as silence. It deliberately has no
    evidence item: nothing in the cached sources asserts a prevalence, and citing a line
    that merely fails to mention one would misattribute the claim.
pathophysiology:
- name: GPC3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Hemizygous loss of function of GPC3 through point mutation, intragenic
    microdeletion, whole gene deletion, or translocation breakpoint disruption
    removes functional glypican-3 from the cell surface of embryonic mesodermal
    tissues, where it is selectively expressed.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function alleles of GPC3 spanning point mutations, intragenic and
      whole gene deletions, and X;autosome translocation breakpoints that disrupt
      the locus.
  cellular_components:
  - preferred_term: cell surface glypican-3
    term:
      id: GO:0009986
      label: cell surface
  downstream:
  - target: Loss of Glypican-3 Competition for Hedgehog Ligand
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8589713
    reference_title: "Mutations in GPC3, a glypican gene, cause the Simpson-Golabi-Behmel overgrowth syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The breakpoints occur near the 5' and 3' ends of a gene, GPC3, that spans more than 500 kilobases in Xq26; in three families, different microdeletions encompassing exons cosegregate with SGBS."
    explanation: >-
      The gene-identification study, establishing GPC3 disruption as the cause through
      both translocation breakpoints and cosegregating microdeletions.
  - reference: PMID:10814714
    reference_title: "Mutational analysis of the GPC3/GPC4 glypican gene cluster on Xq26 in patients with Simpson-Golabi-Behmel syndrome: identification of loss-of-function mutations in the GPC3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One frameshift, three nonsense, and one splice mutation predict a loss-of-function of the glypican-3 protein."
    explanation: >-
      Enumerates the loss-of-function allele classes found in SGBS patients, establishing
      loss of function as the mechanism of the point-mutation alleles.
- name: Loss of Glypican-3 Competition for Hedgehog Ligand
  biological_scale: MOLECULAR
  description: >-
    Glypican-3 binds Hedgehog with high affinity and competes with Patched, the
    Hedgehog receptor, for that ligand, then routes the bound Hedgehog to
    endocytosis and degradation. Without glypican-3 this sink is gone and more
    ligand reaches Patched.
  biological_processes:
  - preferred_term: glypican-3 restraint of Hedgehog signaling
    term:
      id: GO:0045879
      label: negative regulation of smoothened signaling pathway
    modifier: DECREASED
  downstream:
  - target: Hedgehog Pathway Hyperactivation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18477453
      reference_title: "Glypican-3 inhibits Hedgehog signaling during development by competing with patched for Hedgehog binding."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that GPC3 null embryos display increased Hedgehog signaling and that GPC3 inhibits Hedgehog activity in cultured mouse embryonic fibroblasts."
      explanation: >-
        Direct demonstration that removing GPC3 raises Hedgehog signaling, which is the
        causal step this edge asserts.
  evidence:
  - reference: PMID:18477453
    reference_title: "Glypican-3 inhibits Hedgehog signaling during development by competing with patched for Hedgehog binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we report that GPC3 interacts with high affinity with Hedgehog but not with its receptor, Patched, and that GPC3 competes with Patched for Hedgehog binding. Furthermore, GPC3 induces Hedgehog endocytosis and degradation."
    explanation: Establishes the competition-and-clearance mechanism at the ligand level.
- name: Hedgehog Pathway Hyperactivation
  biological_scale: CELLULAR
  description: >-
    Released Hedgehog signaling raises the growth set point in embryonic tissues.
    Hedgehog positively regulates body size, so its de-repression is the proposed
    proximate driver of the overgrowth phenotype.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  downstream:
  - target: Excess Embryonic Cell Proliferation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18477453
    reference_title: "Glypican-3 inhibits Hedgehog signaling during development by competing with patched for Hedgehog binding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that GPC3 acts as a negative regulator of Hedgehog signaling during mammalian development and that the overgrowth observed in SGBS patients is, at least in part, the consequence of hyperactivation of the Hedgehog signaling pathway."
    explanation: >-
      The authors' own conclusion tying Hedgehog hyperactivation to the human overgrowth
      phenotype, with the hedged "at least in part" preserved rather than overstated.
- name: Excess Embryonic Cell Proliferation
  biological_scale: CELLULAR
  description: >-
    Increased proliferation in developing mesodermal tissues. In the kidney this was
    localized to the ureteric bud and collecting system in the null mouse, giving an
    early and persistent developmental abnormality rather than a purely postnatal
    growth excess.
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Generalized Prenatal and Postnatal Overgrowth
    causal_link_type: DIRECT
  - target: Persistence of Embryonal Progenitor Tissue
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10402475
    reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the particular case of the kidney, we demonstrate that there is an early and persistent developmental abnormality of the ureteric bud/collecting system due to increased proliferation of cells in this tissue element."
    explanation: Localizes the proliferative defect to a specific developing renal compartment.
- name: Generalized Prenatal and Postnatal Overgrowth
  biological_scale: ORGANISM
  description: >-
    The organism level consequence, expressed as macrosomia, macrocephaly,
    visceromegaly, and the characteristic coarse facies.
  downstream:
  - target: Overgrowth
    causal_link_type: DIRECT
  - target: Macrocephaly
    causal_link_type: DIRECT
  - target: Coarse Facial Features
    causal_link_type: DIRECT
  - target: Visceromegaly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10402475
    reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we report that GPC3-deficient mice exhibit several of the clinical features observed in SGBS patients, including developmental overgrowth, perinatal death, cystic and dyplastic kidneys, and abnormal lung development."
    explanation: >-
      The null mouse recapitulates the human overgrowth phenotype, supporting GPC3 loss
      as sufficient for it.
- name: Persistence of Embryonal Progenitor Tissue
  biological_scale: TISSUE
  description: >-
    Retained embryonal progenitor populations, notably nephrogenic rests in the
    kidney and hepatic progenitors in the liver, are the substrate on which the
    childhood embryonal tumors of this syndrome arise. This is why tumor
    surveillance is concentrated in the first years of life.
  downstream:
  - target: Nephroblastoma
    causal_link_type: DIRECT
  - target: Hepatoblastoma
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20301398
    reference_title: "Simpson-Golabi-Behmel Syndrome Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals are at increased risk for embryonal tumors including Wilms tumor, hepatoblastoma, adrenal neuroblastoma, gonadoblastoma, hepatocellular carcinoma, and medulloblastoma."
    explanation: >-
      Establishes the embryonal tumor spectrum, which is the clinical expression of
      retained embryonal tissue.
- name: IGF2 Sequestration by Glypican-3
  biological_scale: MOLECULAR
  description: >-
    The originally proposed mechanism, in which glypican-3 forms a complex with IGF2
    and restrains its growth promoting action. It is recorded here because much of
    the older literature assumes it, but the ligand level data from the null mouse do
    not support a simple sequestration model. It is deliberately left unconnected to
    the downstream chain, since the evidence does not license an edge.
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: insulin-like growth factor receptor signaling pathway
    term:
      id: GO:0048009
      label: insulin-like growth factor receptor signaling pathway
  evidence:
  - reference: PMID:8589713
    reference_title: "Mutations in GPC3, a glypican gene, cause the Simpson-Golabi-Behmel overgrowth syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Initial western- and ligand-blotting experiments suggest that glypican 3 forms a complex with insulin-like growth factor 2 (IGF2), and might thereby modulate IGF2 action."
    explanation: >-
      The original in vitro observation that motivated the IGF2 hypothesis, quoted with
      its own hedging intact.
  - reference: PMID:10402475
    reference_title: "Glypican-3-deficient mice exhibit developmental overgrowth and some of the abnormalities typical of Simpson-Golabi-Behmel syndrome."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike the IGF2R-deficient mice, however, the levels of IGF-II in GPC3 knockouts are similar to those of the normal littermates."
    explanation: >-
      Argues against simple IGF-II sequestration: if glypican-3 restrained IGF-II by
      binding it, removing glypican-3 should change ligand levels, and it does not.

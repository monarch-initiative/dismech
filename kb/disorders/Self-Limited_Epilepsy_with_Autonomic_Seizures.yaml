name: Self-Limited Epilepsy with Autonomic Seizures
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  Self-limited epilepsy with autonomic seizures, long known as Panayiotopoulos
  syndrome, is a childhood focal epilepsy whose seizures are made almost entirely
  of autonomic symptoms. The child typically retains awareness at onset while
  going pale and vomiting repeatedly, and the episode commonly runs past thirty
  minutes, which makes autonomic status epilepticus the rule rather than a
  complication. Two thirds of seizures happen in sleep. The EEG shows shifting
  multifocal spikes, classically occipital in the youngest children but migrating
  with age. Seizures are usually few, remission within a few years is the norm,
  and the adult epilepsy risk is not raised above the population. The clinical
  problem is not the epilepsy but the mimicry: prolonged vomiting with altered
  responsiveness in a young child is routinely mistaken for encephalitis,
  gastroenteritis, migraine, or syncope.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - SeLEAS
  - Panayiotopoulos syndrome
  - early-onset benign childhood occipital epilepsy
  - benign childhood autonomic epilepsy
disease_term:
  preferred_term: self-limited epilepsy with autonomic seizures
  term:
    id: MONDO:0020307
    label: self-limited epilepsy with autonomic seizures
mappings:
  mondo_mappings:
    - term:
        id: MONDO:0020307
        label: self-limited epilepsy with autonomic seizures
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0020307 is the self-limited epilepsy with autonomic seizures
        concept, the ILAE 2022 name for what was previously called
        Panayiotopoulos syndrome.
references:
  - reference: PMID:16950946
    title: >-
      Panayiotopoulos syndrome: a benign childhood autonomic epilepsy frequently
      imitating encephalitis, syncope, migraine, sleep disorder, or
      gastroenteritis.
  - reference: PMID:35503717
    title: >-
      International League Against Epilepsy classification and definition of
      epilepsy syndromes with onset in childhood: Position paper by the ILAE Task
      Force on Nosology and Definitions.
notes: >-
  Naming note. The ILAE 2022 childhood-syndromes position paper renamed this
  syndrome from Panayiotopoulos syndrome to self-limited epilepsy with autonomic
  seizures, as part of a general shift toward names that describe seizure
  semiology. The change is substantive rather than cosmetic: the older label
  "early-onset benign childhood occipital epilepsy" asserted an occipital
  localization that the EEG literature no longer supports as definitional, and
  the current name commits instead to the autonomic semiology. This entry uses
  the current name and keeps the historical ones as synonyms.

  Scope note. This entry does not curate a genetic section. No causative gene is
  established for this syndrome, and the mechanism as described in the source
  literature is maturational rather than monogenic; asserting candidate genes
  here would overstate what is known.
pathophysiology:
  - name: Maturational Seizure Susceptibility of the Developing Brain
    biological_scale: ORGANISM
    description: >-
      The proposed substrate is not a lesion but a developmental window. The
      leading account treats this syndrome and self-limited epilepsy with
      centrotemporal spikes as the early-onset and late-onset phenotypes of one
      maturation-related childhood seizure-susceptibility state, which is why
      both remit and why neither leaves a deficit. Nothing structural is
      demonstrable, and the syndrome's boundaries are set by age rather than by
      anatomy.
    downstream:
      - target: Multifocal Cortical Epileptogenicity with Age-Shifting Foci
        causal_link_type: DIRECT
      - target: Age-Specific Vulnerability of Central Autonomic Networks
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:16950946
            reference_title: >-
              Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
              frequently imitating encephalitis, syncope, migraine, sleep
              disorder, or gastroenteritis.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              The symptoms/sequence of autonomic seizures and autonomic status
              epilepticus in Panayiotopoulos syndrome are specific to childhood,
              and they do not occur in adults.
            explanation: >-
              Ties the autonomic vulnerability to the childhood developmental
              window, which is what makes it a consequence of the maturational
              state rather than an independent property.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Panayiotopoulos syndrome is probably the early-onset and Rolandic
          epilepsy the late-onset phenotype of a maturation-related benign
          childhood seizure-susceptibility syndrome.
        explanation: >-
          States the maturational-susceptibility account and its relationship to
          the centrotemporal-spike syndrome, which is exactly what this node
          asserts. Note the source hedges with "probably", so this is a proposed
          rather than demonstrated substrate.
  - name: Multifocal Cortical Epileptogenicity with Age-Shifting Foci
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Interictal EEG shows shifting or multiple spike foci rather than one stable
      epileptogenic zone. The distribution is itself age-dependent, running
      occipital in the youngest children, then occipital together with
      frontopolar, then centro-parieto-temporal, before disappearing altogether
      by adolescence. That migration is a fair summary of the syndrome: the
      excitable tissue moves as the brain matures, and then the excitability goes
      away.
    downstream:
      - target: Focal Autonomic Seizures
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: >-
          The route from a multifocal cortical discharge to a stereotyped emetic
          and autonomic seizure is not established, which is the substance of one
          of this entry's discussions, so the edge is indirect with unknown
          intermediates.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          An electroencephalogram is the only investigation with abnormal
          results, usually showing multiple spikes in various brain locations.
        explanation: >-
          Establishes the multifocal EEG abnormality as the only positive
          investigation, which is the content of this node.
      - reference: PMID:37660659
        reference_title: >-
          A reappraisal of interictal EEG characteristics in self-limited
          epilepsy with autonomic seizures, formerly known as Panayiotopoulos
          syndrome or early-onset benign occipital epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The interictal EEG characteristics of SeLEAS are multifocal EEG foci
          with age-dependent predominant locations; occipital (O) at 2-5 years
          old, and occipital and frontopolar (synchronous and independent O and
          Fp spikes) at 4-7 years old and centro-parieto-temporal (CPT) at 6-10
          years old.
        explanation: >-
          Gives the age-dependent migration of the foci in detail, which is the
          specific claim this node makes about how the abnormality changes with
          maturation.
  - name: Age-Specific Vulnerability of Central Autonomic Networks
    biological_scale: TISSUE
    description: >-
      The most distinctive and least explained part of the syndrome. The
      published account holds that ictal discharges produce autonomic
      disturbance and emesis irrespective of where they start, because the
      child's central autonomic networks are unusually susceptible to being
      recruited. That claim is doing a lot of work: it is what reconciles a
      multifocal, migrating EEG with a stereotyped emetic semiology, and it also
      explains why the same seizure sequence simply does not occur in adults.
      No cellular or circuit mechanism for the susceptibility is established.
    downstream:
      - target: Focal Autonomic Seizures
        causal_link_type: DIRECT
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Ictal epileptic discharges in Panayiotopoulos syndrome, irrespective of
          their location at onset, activate autonomic disturbances and emesis, to
          which children are particularly vulnerable.
        explanation: >-
          The core mechanistic claim of this node, including the explicit
          location-independence that makes it unusual among focal epilepsies.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The symptoms/sequence of autonomic seizures and autonomic status
          epilepticus in Panayiotopoulos syndrome are specific to childhood, and
          they do not occur in adults.
        explanation: >-
          Supports the age-specificity of the vulnerability, which is why this
          node is framed as developmental rather than as a fixed anatomical
          property.
  - name: Focal Autonomic Seizures
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Seizures composed predominantly of autonomic disturbance, with emesis the
      leading symptom, frequently accompanied by pallor and pupillary change and
      sometimes by incontinence, hypersalivation, or cardiorespiratory and
      thermoregulatory alteration. Awareness is often preserved at onset and lost
      later. Autonomic symptoms may be the entire seizure. Roughly half end in
      hemiconvulsions or generalized convulsions.
    downstream:
      - target: Autonomic Status Epilepticus
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:16950946
            reference_title: >-
              Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
              frequently imitating encephalitis, syncope, migraine, sleep
              disorder, or gastroenteritis.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              Half of the seizures in Panayiotopoulos syndrome last for >30
              minutes, thus constituting autonomic status epilepticus
            explanation: >-
              Establishes that autonomic status is simply what happens when an
              autonomic seizure runs long, which is this edge: the status is a
              duration property of the seizure rather than a separate event.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Autonomic seizures in Panayiotopoulos syndrome consist of episodes of
          disturbed autonomic function with emesis as the predominant symptom.
        explanation: >-
          Defines the seizure type and names emesis as the leading manifestation.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Only half of the seizures end with brief hemiconvulsions or generalized
          convulsions. Convulsive status epilepticus is extremely rare.
        explanation: >-
          Quantifies the convulsive evolution and records that convulsive status
          is rare, in contrast to the autonomic status that is common.
  - name: Autonomic Status Epilepticus
    biological_scale: ORGANISM
    description: >-
      Half of the seizures run beyond thirty minutes, so autonomic status
      epilepticus is a defining feature rather than a complication. It is the
      commonest non-convulsive status epilepticus in otherwise normal children.
      It imparts no residual neurological deficit, which is the fact that most
      sharply separates it from the encephalitis it is mistaken for.
    downstream:
      - target: Age-Dependent Remission
        causal_link_type: DIRECT
        evidence:
          - reference: PMID:16950946
            reference_title: >-
              Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
              frequently imitating encephalitis, syncope, migraine, sleep
              disorder, or gastroenteritis.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              Autonomic status epilepticus imparts no residual neurologic
              deficit.
            explanation: >-
              Supports the edge from prolonged seizures to an intact outcome:
              status here does not derail the remission trajectory, which is what
              distinguishes this syndrome from the encephalopathies it mimics.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Half of the seizures in Panayiotopoulos syndrome last for >30 minutes,
          thus constituting autonomic status epilepticus, which is the more
          common nonconvulsive status epilepticus in normal children.
        explanation: >-
          Quantifies the proportion of prolonged seizures and establishes that
          autonomic status is characteristic of the syndrome.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Autonomic status epilepticus imparts no residual neurologic deficit.
        explanation: >-
          Records the benign outcome of the prolonged seizures, which is what
          justifies conservative management despite their alarming appearance.
  - name: Age-Dependent Remission
    biological_scale: ORGANISM
    description: >-
      Seizures are infrequent in most patients and remit within a few years of
      onset, and the EEG foci disappear by adolescence. The risk of epilepsy in
      adult life is not raised above the general population. This is the
      "self-limited" in the syndrome's name, and it is the reason the treatment
      section is so thin.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The risk of epilepsy in adult life seems to be no higher than in the
          general population.
        explanation: >-
          States the long-term outcome that defines the self-limited character of
          the syndrome.
      - reference: PMID:37660659
        reference_title: >-
          A reappraisal of interictal EEG characteristics in self-limited
          epilepsy with autonomic seizures, formerly known as Panayiotopoulos
          syndrome or early-onset benign occipital epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          O EEG foci evolve to multifocal EEG foci with a O-Fp or CPT
          predominance with age and disappear by 12∼16 years old.
        explanation: >-
          Gives the electrographic counterpart of remission: the foci themselves
          disappear by adolescence.
phenotypes:
  - name: Ictal Vomiting
    category: Neurologic
    description: >-
      Emesis is the cardinal and most characteristic manifestation. The child is
      typically fully conscious when it starts, which is part of why the episode
      reads as gastroenteritis rather than as a seizure.
    phenotype_term:
      preferred_term: >-
        Focal autonomic seizure with epigastric sensation/nausea/vomiting/other
        gastrointestinal phenomena
      term:
        id: HP:0011159
        label: >-
          Focal autonomic seizure with epigastric sensation/nausea/vomiting/other
          gastrointestinal phenomena
      onset:
        onset_category: CHILDHOOD
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Autonomic seizures in Panayiotopoulos syndrome consist of episodes of
          disturbed autonomic function with emesis as the predominant symptom.
        explanation: >-
          Establishes emesis as the predominant symptom, which is why this
          phenotype is VERY_FREQUENT and effectively definitional.
  - name: Ictal Pallor
    category: Neurologic
    description: >-
      Pallor accompanies the emesis in most seizures; flushing or cyanosis occur
      less often. Together with vomiting it produces the picture that is
      routinely read as a faint or an acute illness.
    phenotype_term:
      preferred_term: Focal autonomic seizure with pallor/flushing
      term:
        id: HP:0032762
        label: Focal autonomic seizure with pallor/flushing
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Other autonomic manifestations include pallor (or, less often, flushing
          or cyanosis)
        explanation: >-
          Names pallor as an autonomic manifestation and records flushing and
          cyanosis as the less common alternatives.
  - name: Ictal Pupillary Change
    category: Neurologic
    description: >-
      Mydriasis, less often miosis, is part of the autonomic constellation and is
      one of the signs that can distinguish an autonomic seizure from a
      gastrointestinal illness at the bedside.
    phenotype_term:
      preferred_term: Focal autonomic seizure with pupillary dilation/constriction
      term:
        id: HP:0032763
        label: Focal autonomic seizure with pupillary dilation/constriction
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          mydriasis (or, less often, miosis), cardiorespiratory and
          thermoregulatory alterations, incontinence of urine and/or feces,
          hypersalivation, and modifications of intestinal motility
        explanation: >-
          Names the pupillary changes together with the rest of the autonomic
          constellation modelled in this entry.
  - name: Ictal Syncope
    category: Neurologic
    description: >-
      In about one fifth of seizures the child becomes unresponsive and flaccid,
      before or entirely without convulsions. This is the presentation most
      likely to be recorded as a faint, and it is a major contributor to the
      syndrome's misdiagnosis rate.
    phenotype_term:
      preferred_term: Ictal syncope
      term:
        id: HP:0032755
        label: Focal impaired awareness autonomic seizure
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In approximately one fifth of the seizures the child becomes
          unresponsive and flaccid (ictal syncope) before or often without
          convulsions.
        explanation: >-
          Quantifies ictal syncope at roughly one fifth of seizures, which falls
          in the 5 to 29 percent band mapping to OCCASIONAL.
  - name: Status Epilepticus
    category: Neurologic
    description: >-
      Prolonged seizures lasting more than thirty minutes, constituting autonomic
      status epilepticus. This is characteristic rather than exceptional in this
      syndrome, occurring in about half of all seizures.
    phenotype_term:
      preferred_term: Status epilepticus
      term:
        id: HP:0002133
        label: Status epilepticus
    frequency: FREQUENT
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Half of the seizures in Panayiotopoulos syndrome last for >30 minutes,
          thus constituting autonomic status epilepticus
        explanation: >-
          Quantifies prolonged seizures at half of all seizures, which falls in
          the 30 to 79 percent band mapping to FREQUENT.
  - name: Focal to Bilateral Tonic-Clonic Seizures
    category: Neurologic
    description: >-
      About half of seizures end in brief hemiconvulsions or generalized
      convulsions. This is the point at which a family recognizes the episode as
      a seizure rather than an illness, and it is also the feature that most
      often prompts emergency presentation.
    phenotype_term:
      preferred_term: Bilateral tonic-clonic seizure with focal onset
      term:
        id: HP:0007334
        label: Bilateral tonic-clonic seizure with focal onset
    frequency: FREQUENT
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Only half of the seizures end with brief hemiconvulsions or generalized
          convulsions. Convulsive status epilepticus is extremely rare.
        explanation: >-
          Quantifies convulsive evolution at half of seizures, which falls in the
          30 to 79 percent band mapping to FREQUENT, and records that convulsive
          status is rare in contrast to the common autonomic status.
  - name: Ictal Incontinence
    category: Neurologic
    description: >-
      Loss of bladder or bowel control during the seizure, part of the wider
      autonomic constellation rather than a marker of severity.
    phenotype_term:
      preferred_term: Ictal incontinence
      term:
        id: HP:0032765
        label: Focal autonomic seizure with urge to urinate/defecate
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          incontinence of urine and/or feces, hypersalivation, and modifications
          of intestinal motility
        explanation: >-
          Names incontinence among the autonomic manifestations of the seizure.
  - name: Ictal Hypersalivation
    category: Neurologic
    description: >-
      Excessive salivation during the seizure, another autonomic feature and one
      shared with the sibling centrotemporal-spike syndrome.
    phenotype_term:
      preferred_term: Ictal hypersalivation
      term:
        id: HP:0003781
        label: Excessive salivation
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          incontinence of urine and/or feces, hypersalivation, and modifications
          of intestinal motility
        explanation: >-
          Names hypersalivation among the autonomic manifestations of the
          seizure.
  - name: Ictal Eye Deviation
    category: Neurologic
    description: >-
      The eyes turn to one side, or open wide and stare, as awareness is lost.
      Together with emesis and impaired responsiveness this completes the triad
      that has defined the syndrome since its original description, and it is
      often the feature a parent recalls most vividly.

      No term is bound here. The obvious HPO candidate, HP:0000549 Abnormal
      conjugate eye movement, is defined as deviation from the normal
      coordination that lets the eyes fixate together, with "disconjugate eye
      movements" as an exact synonym. Ictal deviation is the opposite: the eyes
      move together, conjugately, to one side. Binding it would assert the wrong
      thing, in the same way the earlier HP:0001279 syncope binding did, so the
      phenotype is recorded with free text pending a suitable term.
    phenotype_term:
      preferred_term: Ictal conjugate eye deviation
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Eyes turn to one side or gaze widely open.
        explanation: >-
          States the ictal eye finding directly, in the sentence immediately
          following the loss of responsiveness, which is where it sits in the
          seizure sequence.
  - name: Impaired Awareness During Seizure
    category: Neurologic
    description: >-
      Awareness is characteristically preserved at seizure onset and lost as the
      episode proceeds, with the child becoming confused and unresponsive and the
      eyes deviating or opening widely. That temporal sequence, autonomic first
      and awareness second, is diagnostically useful.
    phenotype_term:
      preferred_term: Focal impaired awareness seizure
      term:
        id: HP:0002384
        label: Focal impaired awareness seizure
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The child, who was initially fully conscious, becomes confused and
          unresponsive.
        explanation: >-
          Documents the progression from preserved to impaired awareness within a
          single seizure, which is what this phenotype records.
prevalence:
  - population: Children aged 3 to 6 years with one or more afebrile seizures
    measure_type: UNKNOWN
    prevalence_class: UNKNOWN
    notes: >-
      The available figure is a share of an already-selected clinical population
      rather than a population rate: roughly 13 percent of children aged 3 to 6
      who have had at least one afebrile seizure, and 6 percent across the 1 to
      15 year range. No rate_per_100000 is asserted because the denominator is
      children with seizures, not children.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Panayiotopoulos syndrome probably affects 13% of children aged 3 to 6
          years who have had 1 or more afebrile seizures and 6% of such children
          in the 1- to 15-year age group.
        explanation: >-
          Gives both share figures and their denominators, which is why this
          record is expressed as a class rather than a normalized rate.
progression:
  - phase: Onset in early to mid childhood
    age_range: Early and mid childhood
    notes: >-
      Onset is in early to mid childhood, with the occipital EEG focus
      predominating in the youngest children. Two thirds of seizures occur during
      sleep, which is part of why episodes are witnessed as a child waking
      vomiting and pale.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Two thirds of seizures occur during sleep.
        explanation: >-
          Documents the sleep predominance that characterizes the presentation in
          this phase.
  - phase: Remission within a few years
    age_range: Later childhood to adolescence
    notes: >-
      Seizures are infrequent and remit within a few years of onset. The EEG foci
      migrate through occipital, frontopolar, and centro-parieto-temporal
      distributions before disappearing by adolescence, and adult epilepsy risk
      returns to population baseline.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Panayiotopoulos syndrome is remarkably benign in terms of seizure
          frequency and evolution.
        explanation: >-
          States the benign evolution that defines this phase.
diagnosis:
  - name: Electroencephalography
    description: >-
      EEG is the only investigation that returns an abnormal result, and it is
      therefore the diagnostic test. It typically shows multiple spikes in
      various locations, with a distribution that depends on the child's age.
      Imaging is normal.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Shifting or multiple spike foci, occipital-predominant in younger children
      and migrating to frontopolar and centro-parieto-temporal distributions with
      age.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          An electroencephalogram is the only investigation with abnormal
          results, usually showing multiple spikes in various brain locations.
        explanation: >-
          Establishes EEG as the sole informative investigation and describes the
          expected finding.
treatments:
  - name: Education and Conservative Management
    description: >-
      Because seizures are infrequent and the syndrome remits, the primary
      intervention is not a drug. Educating the family about what an autonomic
      seizure looks like, and about the fact that a prolonged episode leaves no
      deficit, is the stated cornerstone of management and is what prevents the
      cycle of emergency presentation, misdiagnosis, and unnecessary
      investigation that this syndrome otherwise generates.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Education about Panayiotopoulos syndrome is the cornerstone of
          management.
        explanation: >-
          States that education is the cornerstone of management for this
          syndrome, which is why it is curated as the primary intervention.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The consequence is avoidable misdiagnosis, high morbidity, and costly
          mismanagement.
        explanation: >-
          Records the cost of failing to recognize the syndrome, which is the
          harm that education is intended to prevent.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Prophylactic treatment with antiepileptic medication may not be needed
          for most patients.
        explanation: >-
          The management recommendation that follows from the benign course and
          low seizure frequency, and the reason no antiseizure medication is
          curated as a primary treatment in this entry.
  - name: Benzodiazepine Rescue for Autonomic Status Epilepticus
    description: >-
      What to do acutely, as the counterpart to the avoidance entry below.
      Seizures in this syndrome are unusually benzodiazepine-responsive: in an
      emergency-department comparison, every patient with the syndrome was
      controlled by a small dose of midazolam at 0.1 mg/kg, whereas every patient
      with acute encephalopathy required at least three times that. So the same
      observation is simultaneously the treatment and a diagnostic discriminator,
      and a child who needs escalating doses should prompt reconsideration of the
      diagnosis rather than more drug.

      This does not contradict the conservative posture of this entry. Most
      seizures need no acute treatment at all and prophylaxis is usually
      unnecessary; the point is that when a prolonged episode does warrant
      intervention, a small benzodiazepine dose is what is indicated, and
      escalation beyond it is where the iatrogenic risk recorded below begins.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: midazolam
          term:
            id: CHEBI:6931
            label: midazolam
    target_mechanisms:
      - target: Autonomic Status Epilepticus
        treatment_effect: INHIBITS
        description: >-
          Terminates the prolonged seizure. It acts on seizure expression, not on
          the maturational susceptibility upstream, which is why it is a rescue
          measure rather than a disease-modifying one.
    evidence:
      - reference: PMID:35153087
        reference_title: >-
          Differentiating early clinical features of Panayiotopoulos syndrome
          from acute encephalopathy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In addition, seizures were treatable in all patients with PS with a
          small dose of midazolam (0.1 mg/kg), but all patients with acute
          encephalopathy required midazolam at 0.3 mg/kg or more (P < 0.001).
        explanation: >-
          The one quantitatively supported acute-treatment finding for this
          syndrome, and simultaneously a diagnostic discriminator: complete
          response at 0.1 mg/kg in every case, against a threefold-or-greater
          requirement in the condition it is mistaken for.
  - name: Avoidance of Aggressive Acute Treatment
    description: >-
      A treatment entry recording what not to do. Autonomic status epilepticus
      here is alarming and prolonged, and it invites escalation, but the source
      is explicit that aggressive treatment may itself cause iatrogenic
      complications including cardiorespiratory arrest. This is a distinct hazard
      from the seizure-intrinsic cardiorespiratory risk recorded in the
      self-limited-label discussion: here the harm comes from the response rather
      than from the event. Because the prolonged episode leaves no residual
      deficit, the risk-benefit calculation favours thorough evaluation over
      aggressive intervention.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Autonomic status epilepticus in the acute stage needs thorough
          evaluation; aggressive treatment may cause iatrogenic complications
          including cardiorespiratory arrest.
        explanation: >-
          States both halves of the recommendation: the acute episode warrants
          thorough evaluation, and aggressive treatment carries its own risk of
          cardiorespiratory arrest.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Autonomic status epilepticus imparts no residual neurologic deficit.
        explanation: >-
          The outcome fact that makes conservative management defensible: there
          is no deficit to prevent by escalating.
differential_diagnoses:
  - name: Acute Encephalopathy or Encephalitis
    description: >-
      The most consequential differential and the reason these children reach an
      emergency department. Prolonged unresponsiveness with vomiting in a young
      child reads as encephalitis. A comparison of emergency presentations found
      the discriminator is convulsion duration: 90 percent of acute
      encephalopathy patients had convulsive seizures of at least 15 minutes,
      against 17 percent of this syndrome.
    distinguishing_features:
      - Convulsive seizures of at least 15 minutes are typical of acute encephalopathy and unusual here.
      - Seizures here are controlled by midazolam at 0.1 mg/kg; acute encephalopathy needs at least threefold more.
      - No residual neurological deficit follows the prolonged episode.
    evidence:
      - reference: PMID:35153087
        reference_title: >-
          Differentiating early clinical features of Panayiotopoulos syndrome
          from acute encephalopathy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Most patients (90%) with acute encephalopathy had convulsive seizures
          of greater than or equal to 15 min, whereas only three patients (17%)
          with PS had convulsive seizures of greater than or equal to 15 min
        explanation: >-
          Provides a quantified bedside discriminator between the two conditions
          in the setting where the distinction actually has to be made.
      - reference: PMID:35153087
        reference_title: >-
          Differentiating early clinical features of Panayiotopoulos syndrome
          from acute encephalopathy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In addition, seizures were treatable in all patients with PS with a
          small dose of midazolam (0.1 mg/kg), but all patients with acute
          encephalopathy required midazolam at 0.3 mg/kg or more (P < 0.001).
        explanation: >-
          Backs the treatability bullet in distinguishing_features, which
          previously stood unsupported in this block. Drug responsiveness is a
          second discriminator independent of convulsion duration, and a useful
          one because it declares itself within minutes of the first dose rather
          than requiring the episode to run its course.
  - name: Cyclic Vomiting Syndrome
    description: >-
      Separated from the other non-epileptic mimics because it is the hardest of
      them to exclude clinically. Both conditions produce recurrent, stereotyped,
      prolonged vomiting episodes in a child who is well between attacks, and
      both can involve pallor and lethargy. The distinction rests on the
      accompanying features and on the EEG rather than on the vomiting itself.
    distinguishing_features:
      - Pupillary change, eye deviation, and impaired awareness accompany the vomiting in the epilepsy.
      - Interictal EEG shows multifocal spikes, whereas it is normal in cyclic vomiting syndrome.
      - Two thirds of episodes arise from sleep in the epilepsy.
      - Episodes can end in hemiconvulsions or generalized convulsions in the epilepsy.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The clinical features of Panayiotopoulos syndrome are frequently
          mistaken as nonepileptic conditions such as acute encephalitis,
          syncope, migraine, cyclic vomiting syndrome, motion sickness, sleep
          disorder, or gastroenteritis.
        explanation: >-
          Names cyclic vomiting syndrome specifically among the conditions this
          syndrome is mistaken for.
  - name: Gastroenteritis, Migraine, Syncope, and Motion Sickness
    description: >-
      The remaining non-epileptic mimics. Grouped because they share the feature
      that matters here: none is epilepsy, and each sends the child down a
      different and unnecessary diagnostic path. Cyclic vomiting syndrome is
      listed separately above because it is materially harder to exclude.
    distinguishing_features:
      - Stereotyped episodes with a consistent autonomic sequence rather than variable illness.
      - Accompanying pallor, pupillary change, and eye deviation.
      - Abnormal interictal EEG with multifocal spikes.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The clinical features of Panayiotopoulos syndrome are frequently
          mistaken as nonepileptic conditions such as acute encephalitis,
          syncope, migraine, cyclic vomiting syndrome, motion sickness, sleep
          disorder, or gastroenteritis.
        explanation: >-
          Enumerates the non-epileptic conditions this syndrome imitates, which
          is the content of this grouped differential.
  - name: Self-Limited Epilepsy with Centrotemporal Spikes
    description: >-
      The sibling syndrome, and on the leading account the late-onset phenotype
      of the same maturational susceptibility. Distinguished by later onset and
      by orofacial and speech-arrest semiology rather than autonomic symptoms.
      The two can occur in the same patient. dismech carries a separate entry.
    distinguishing_features:
      - Later onset in mid to late childhood.
      - Orofacial sensorimotor seizures with speech arrest and hypersalivation rather than emesis.
      - Centrotemporal spikes rather than shifting occipital-predominant foci.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Panayiotopoulos syndrome is probably the early-onset and Rolandic
          epilepsy the late-onset phenotype of a maturation-related benign
          childhood seizure-susceptibility syndrome.
        explanation: >-
          Supports the proposed relationship between the two syndromes. Marked
          PARTIAL because the source hedges the unification and the statement is
          a proposal rather than a demonstrated identity.
discussions:
  - discussion_id: seleas_why_autonomic_and_location_independent
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      The published account holds that ictal discharges in this syndrome produce
      emesis and autonomic disturbance irrespective of where they begin. What
      circuit property of the young brain makes autonomic networks recruitable
      from anywhere, and why does that property disappear with age?
    attaches_to:
      - pathophysiology#Age-Specific Vulnerability of Central Autonomic Networks
      - pathophysiology#Multifocal Cortical Epileptogenicity with Age-Shifting Foci
    rationale: >-
      This is the central unexplained fact of the syndrome, and it is unusual
      enough to be worth stating plainly. In almost every other focal epilepsy,
      semiology localizes: an auditory aura implies auditory cortex, an epigastric
      rising sensation implies mesial temporal onset. Here the relationship is
      broken in both directions. The EEG foci are multifocal and migrate through
      occipital, frontopolar, and centro-parieto-temporal locations across
      childhood, yet the seizures remain stereotypically emetic throughout. The
      published resolution is to place the specificity not in the cortical
      generator but in the target: children's central autonomic networks are held
      to be particularly vulnerable to recruitment, so wherever the discharge
      starts, the autonomic system is what expresses it. If that is right it is a
      genuinely different architecture from the usual localizationist picture,
      and it should be testable. Two things make it more than a restatement of
      the observation. First, the same seizure sequence does not occur in adults,
      so whatever the property is, it is developmental and it closes. Second, the
      syndrome remits on roughly the same timescale over which the property is
      said to disappear, which raises the possibility that the maturation of
      autonomic network resilience is not merely permissive but is the thing that
      ends the epilepsy. No cellular or circuit-level account of the
      susceptibility exists in the cited literature.
    proposed_experiments:
      - experiment_id: exp_seleas_onset_zone_versus_semiology
        name: Test whether seizure semiology varies with EEG onset location
        description: >-
          Within a cohort of children with this syndrome, relate ictal onset
          location on video-EEG to the autonomic semiology of the corresponding
          seizure, testing directly whether emetic manifestations are independent
          of onset zone as the location-independence claim requires.
        decision_criterion: >-
          Equivalent emetic semiology across different onset zones would confirm
          location independence and support placing the specificity in the
          autonomic target; systematic variation with onset location would mean
          the syndrome is localizationist after all and the current account needs
          revision.
      - experiment_id: exp_autonomic_network_maturation_timecourse
        name: Developmental time-course of central autonomic network recruitability
        description: >-
          Characterize the maturation of central autonomic network connectivity
          across the relevant age range in typically developing children and in
          affected children, and test whether the timing of remission tracks a
          measurable change in that network rather than a change in cortical
          excitability.
        decision_criterion: >-
          Remission coinciding with autonomic-network maturation rather than with
          loss of cortical spikes would establish the autonomic target as the
          rate-limiting element and would reframe the syndrome as a disorder of
          autonomic recruitability rather than of cortical excitability.
    evidence:
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Ictal epileptic discharges in Panayiotopoulos syndrome, irrespective of
          their location at onset, activate autonomic disturbances and emesis, to
          which children are particularly vulnerable.
        explanation: >-
          The location-independence claim that this gap is about, stated
          explicitly in the authoritative clinical review.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The symptoms/sequence of autonomic seizures and autonomic status
          epilepticus in Panayiotopoulos syndrome are specific to childhood, and
          they do not occur in adults.
        explanation: >-
          Establishes that the susceptibility is developmental and closes with
          age, which is the second half of the puzzle.
      - reference: PMID:37660659
        reference_title: >-
          A reappraisal of interictal EEG characteristics in self-limited
          epilepsy with autonomic seizures, formerly known as Panayiotopoulos
          syndrome or early-onset benign occipital epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The interictal EEG characteristics of SeLEAS are multifocal EEG foci
          with age-dependent predominant locations; occipital (O) at 2-5 years
          old, and occipital and frontopolar (synchronous and independent O and
          Fp spikes) at 4-7 years old and centro-parieto-temporal (CPT) at 6-10
          years old.
        explanation: >-
          Documents that the cortical generator moves while the semiology does
          not, which is what makes the location-independence claim necessary in
          the first place.
  - discussion_id: seleas_occipital_versus_multifocal_definition
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Is this syndrome electrographically defined by occipital spikes or by
      multifocal spikes, and is the evidence base strong enough to support any
      EEG criterion being definitional?
    attaches_to:
      - pathophysiology#Multifocal Cortical Epileptogenicity with Age-Shifting Foci
    rationale: >-
      The syndrome's naming history is a record of this argument. It was once
      called early-onset benign childhood occipital epilepsy, a name asserting
      that the occipital lobe was where the disease lived. The ILAE 2022
      reclassification abandoned that and named the syndrome for its autonomic
      semiology instead, and the current definition characterizes the EEG as
      multifocal. Both descriptions are partly right, which is the problem: the
      foci genuinely are occipital-predominant in the youngest children, and
      genuinely are multifocal and migrating across the whole age range, so a
      cross-sectional study will report whichever depending on the ages it
      sampled. A 2023 reappraisal of the EEG literature found that although
      enough cases have been studied, almost none of the studies analysed
      cross-sectional and longitudinal change systematically, and proposed an
      explicitly age-stratified EEG definition on that limited basis. The stake
      is practical: if occipital predominance is expected only at 2 to 5 years,
      then applying it as a diagnostic criterion in a 9-year-old will produce
      false negatives, and conversely a multifocal criterion may be too loose to
      exclude other childhood epilepsies.
    proposed_experiments:
      - experiment_id: exp_seleas_longitudinal_eeg_cohort
        name: Longitudinal EEG cohort with serial recordings through remission
        description: >-
          A prospective cohort with serial EEG from diagnosis through remission,
          analysed longitudinally rather than cross-sectionally, to establish
          whether the proposed age-stratified focus distribution is reproducible
          within individual children.
        decision_criterion: >-
          Reproducible within-child migration through the proposed sequence would
          justify an age-stratified EEG criterion; heterogeneous trajectories
          would mean no single EEG criterion should be definitional.
      - experiment_id: exp_seleas_eeg_criterion_discrimination
        name: Discriminative performance of candidate EEG criteria
        description: >-
          Test occipital-predominant versus multifocal EEG criteria for
          sensitivity and specificity against other childhood focal epilepsies,
          stratified by age at recording.
        decision_criterion: >-
          A criterion achieving useful specificity against the sibling
          centrotemporal syndrome and other childhood epilepsies could be adopted
          as definitional; poor discrimination would confirm that the syndrome
          should remain semiologically rather than electrographically defined.
    evidence:
      - reference: PMID:37660659
        reference_title: >-
          A reappraisal of interictal EEG characteristics in self-limited
          epilepsy with autonomic seizures, formerly known as Panayiotopoulos
          syndrome or early-onset benign occipital epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Although previous studies investigated the details of interictal EEG
          characteristics in a sufficient number of SeLEAS cases, there were few
          systematically analyzing cross sectional and longitudinal EEG changes
          except one study.
        explanation: >-
          States the evidential weakness underlying any EEG criterion for this
          syndrome, which is the core of the controversy.
      - reference: PMID:37660659
        reference_title: >-
          A reappraisal of interictal EEG characteristics in self-limited
          epilepsy with autonomic seizures, formerly known as Panayiotopoulos
          syndrome or early-onset benign occipital epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Despite these limited evidence, I propose the following practical and
          useful EEG definition.
        explanation: >-
          The author explicitly acknowledges proposing a definition on limited
          evidence, which is why this is recorded as an open controversy rather
          than as settled criteria.
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Based on the 2017 Classification of Seizures and Epilepsies, some
          syndrome names have been updated using terms directly describing the
          seizure semiology.
        explanation: >-
          Documents the ILAE's shift to semiology-based naming, which is what
          moved this syndrome away from its occipital label.
  - discussion_id: seleas_cognitive_comorbidity_contested
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      Is cognition genuinely normal in this syndrome, as the syndrome definition
      asserts, or is there a mild diffuse comorbidity that group-level normality
      conceals?
    attaches_to:
      - pathophysiology#Multifocal Cortical Epileptogenicity with Age-Shifting Foci
      - pathophysiology#Age-Dependent Remission
    rationale: >-
      Stated as a contradiction this looks unresolvable, but the two principal
      studies actually agree on the data and differ on what to call it, which is
      a more tractable disagreement.

      A consecutive series of 93 patients found IQ and Wechsler subtests within
      normal limits, while also finding statistically significant differences
      against controls on arithmetic, comprehension, and picture arrangement. A
      smaller retrospective series of 18 found mean full-scale IQ of 93.5,
      explicitly within the normal range yet significantly below the normative
      mean, with reaction times, visual attention, visual-motor integration, and
      verbal memory all significantly lower, an average lag of 8 months in
      arithmetic speed and 11 months in reading speed, and elevated internalizing
      behavioural problems. Both studies therefore report normal-range
      performance alongside reproducible sub-normative differences. The larger
      study reads that as normality with minor variation; the smaller reads the
      same shape as diffuse cognitive dysfunction and comorbidity.

      Three things make this worth resolving rather than splitting the
      difference. First, the syndrome definition asserts normal development, and
      a definitional claim that the data only support at group level will
      systematically miss the affected minority; more than half of the children
      in the smaller series had mild-to-severe academic underachievement, which
      a normal mean IQ conceals entirely. Second, the deficits reported are
      exactly the domains that an interictal multifocal spike burden would be
      expected to touch, so the question connects to the pathograph rather than
      being purely clinical. Third, the smaller series is 18 children assessed at
      a mean age of 4 years 7 months, near the peak of the electrographic
      abnormality, whereas the syndrome's premise is that everything resolves by
      adolescence, so the two studies may be sampling different points on a
      trajectory rather than disagreeing about a fixed state. Neither followed
      cognition longitudinally through remission, which is the study that would
      settle it.
    proposed_experiments:
      - experiment_id: exp_seleas_longitudinal_cognition_through_remission
        name: Longitudinal neuropsychology from diagnosis through remission
        description: >-
          Serial neuropsychological and academic assessment of the same children
          from diagnosis through EEG normalization and seizure remission, with
          matched controls, testing whether the sub-normative differences track
          the spike burden and resolve with it or persist after remission.
        decision_criterion: >-
          Deficits that resolve as the foci disappear would support a transient
          comorbidity of the active phase and vindicate the self-limited framing;
          deficits persisting beyond remission would mean the syndrome leaves a
          cognitive trace and the definition's claim of normal development needs
          qualifying.
      - experiment_id: exp_seleas_spike_burden_versus_cognition
        name: Interictal spike burden against domain-specific performance
        description: >-
          Relate quantified interictal spike burden and focus location on
          extended EEG to performance in the specific domains reported as
          affected, namely visual attention, visual-motor integration, verbal
          memory, and arithmetic and reading speed.
        decision_criterion: >-
          A dose relationship between spike burden and domain performance would
          make the comorbidity mechanistically attributable to the epilepsy
          rather than incidental, and would identify the children worth
          monitoring.
    evidence:
      - reference: PMID:20528983
        reference_title: >-
          Panayiotopoulos syndrome: a clinical, EEG, and neuropsychological study
          of 93 consecutive patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          On neuropsychological testing, IQ and subtests of Wechsler Intelligence
          Scale for Children-Revised (WISC-R) were within normal limits, although
          some minor statistically significant differences were found in
          arithmetic, comprehension, and picture arrangement in comparison with
          controls.
        explanation: >-
          The larger series, and the normality side of the disagreement. Note it
          contains both halves: normal limits overall, yet reproducible
          differences against controls in specific domains.
      - reference: PMID:32608507
        reference_title: Neurocognitive and behavioural profile in Panayiotopoulos syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Mean full-scale IQ (93.5; range 76-123; p=0.04) and performance IQ
          (93.2; range 76-126; p=0.04) were within the normal range, although
          significantly lower compared to the normative mean.
        explanation: >-
          The comorbidity side, and the sentence that shows the disagreement is
          interpretive rather than empirical: the same pattern of normal-range
          but sub-normative performance is reported, and read differently.
      - reference: PMID:32608507
        reference_title: Neurocognitive and behavioural profile in Panayiotopoulos syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          On average, patients with Panayiotopoulos syndrome were 8 months behind
          in arithmetic speed and 11 months behind in reading speed for the
          number of months in school.
        explanation: >-
          The concrete academic consequence, which is what makes the distinction
          matter beyond psychometrics. A group mean IQ in the normal range does
          not tell a family whether their child is losing school months.
      - reference: PMID:32608507
        reference_title: Neurocognitive and behavioural profile in Panayiotopoulos syndrome.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Mild-to-severe academic underachievement was present in more than half
          of the children with Panayiotopoulos syndrome.
        explanation: >-
          The proportion affected, which a normal group mean conceals entirely.
          Marked PARTIAL because it comes from 18 retrospectively analysed
          children at a single centre, so it establishes that the minority is not
          small rather than measuring how large it is.
  - discussion_id: seleas_is_self_limited_label_safe
    kind: CONTROVERSY
    status: OPEN
    prompt: >-
      The syndrome is named self-limited and described as remarkably benign, yet
      it can evolve into encephalopathy with status epilepticus in sleep and
      measurable cognitive decline, and rare cardiorespiratory arrest is
      acknowledged. Does the benign label adequately convey the residual risk?
    attaches_to:
      - pathophysiology#Age-Dependent Remission
      - pathophysiology#Autonomic Status Epilepticus
    rationale: >-
      The benign framing is well earned for the typical patient: seizures are
      few, prolonged episodes leave no deficit, and adult epilepsy risk returns
      to baseline. That framing also does real clinical work, since it is what
      justifies not treating and what breaks the misdiagnosis cycle. But two
      things sit uneasily with it. First, an atypical evolution exists in which
      occipital foci progress to synchronous frontopolar and occipital spikes and
      then to continuous spike-wave in sleep, with neuropsychological ability
      including IQ deteriorating during that period. In the reported cases the
      children ultimately recovered and came off medication, so even the atypical
      course was ultimately self-limited, but the cognitive decline was real while
      it lasted. Second, the same review that calls the syndrome remarkably
      benign also notes that autonomic seizures are potentially life-threatening
      in the rare context of cardiorespiratory arrest and states that this needs
      further study. The tension is not that the label is wrong but that it is a
      statement about the central tendency being applied to an individual patient,
      and the features that would identify the minority at risk, the reported
      candidate being the frontopolar-occipital focus combination, are not
      validated as predictors. The curation question is whether this entry should
      model the atypical evolution as a distinct trajectory rather than as an
      exception to a benign course.
    proposed_experiments:
      - experiment_id: exp_seleas_predictors_of_atypical_evolution
        name: Prospective identification of predictors of atypical evolution
        description: >-
          A prospective cohort with serial EEG and neuropsychological assessment,
          testing whether the frontopolar-occipital focus combination, seizure
          burden, or age at onset predicts progression to continuous spike-wave
          in sleep and cognitive decline.
        decision_criterion: >-
          A validated predictor would justify stratified surveillance and would
          support modelling the atypical evolution as a separate trajectory;
          absence of any predictor would support retaining the benign framing with
          routine monitoring for all.
      - experiment_id: exp_seleas_cardiorespiratory_risk_quantification
        name: Quantification of cardiorespiratory risk during autonomic seizures
        description: >-
          Systematic cardiorespiratory monitoring during autonomic seizures and
          autonomic status epilepticus in this syndrome, to establish whether the
          acknowledged rare risk of cardiorespiratory arrest is quantifiable and
          whether any seizure feature precedes it.
        decision_criterion: >-
          A measurable and predictable risk would change management advice for
          prolonged episodes; confirmation that events are vanishingly rare and
          unpredictable would support the current conservative approach.
    evidence:
      - reference: PMID:32020894
        reference_title: >-
          Encephalopathy related to status epilepticus during slow sleep (ESES)
          as atypical evolution of Panayiotopoulos syndrome: an EEG and
          neuropsychological study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Neuropsychological ability, including IQ, deteriorated during the CSWS
          period in both patients.
        explanation: >-
          Documents measurable cognitive decline during the atypical evolution,
          which is the observation that sits most awkwardly with an unqualified
          benign label.
      - reference: PMID:32020894
        reference_title: >-
          Encephalopathy related to status epilepticus during slow sleep (ESES)
          as atypical evolution of Panayiotopoulos syndrome: an EEG and
          neuropsychological study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          PS can progress to ESES if the clinical course exhibits atypical
          evolution. The initial autonomic symptom of the seizures and interictal
          Fp-O EEG foci should be carefully monitored in patients with CSWS or
          ESES.
        explanation: >-
          States both the atypical evolution and the candidate warning feature,
          the frontopolar-occipital focus combination, that a stratified approach
          would need to validate.
      - reference: PMID:32020894
        reference_title: >-
          Encephalopathy related to status epilepticus during slow sleep (ESES)
          as atypical evolution of Panayiotopoulos syndrome: an EEG and
          neuropsychological study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, the seizures and EEG findings gradually resolved, and AEDs
          were successfully terminated in both patients.
        explanation: >-
          The counterweight: even the atypical course ultimately remitted, which
          is why this is recorded as a live tension rather than as a refutation of
          the self-limited label. PARTIAL because two cases cannot establish the
          general outcome of atypical evolution.
      - reference: PMID:16950946
        reference_title: >-
          Panayiotopoulos syndrome: a benign childhood autonomic epilepsy
          frequently imitating encephalitis, syncope, migraine, sleep disorder,
          or gastroenteritis.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          However, autonomic seizures are potentially life-threatening in the
          rare context of cardiorespiratory arrest, an area in which additional
          study is required.
        explanation: >-
          The benign-framing source's own acknowledged exception, including its
          statement that the area needs further study.

- name: Failed Anterior Segment and Foveal Differentiation
  description: >
    Reduced PAX6 dose during ocular morphogenesis leaves the periocular
    mesenchyme-derived structures of the anterior segment incompletely
    differentiated, and simultaneously arrests the specialization of the central
    retina. The iris stroma and its muscle fail to form beyond a rudimentary
    stump; the iridocorneal angle and trabecular meshwork are maldeveloped; the
    lens is prone to opacification; and the foveal pit, which requires postnatal
    displacement of inner retinal layers over a cone-only centre, never fully
    excavates. That the same lesion hits both the anterior segment and the fovea
    is why aniridia is a pan-ocular disease rather than an iris disease.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  biological_processes:

    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aniridia-associated keratopathy (AAK) is a progressive and potentially debilitating problem affecting aniridic patients."
    explanation: >
      Establishes the progressive and sight-threatening character of this
      consequence node. Evidence source is OTHER because this is a review.

- name: Maldeveloped Aqueous Outflow and Secondary Glaucoma
  description: >
    The maldeveloped iridocorneal angle limits aqueous outflow, and in many
    patients the rudimentary iris stump progressively rotates forward to occlude
    what angle there is. Intraocular pressure rises, typically in later childhood
    or adolescence rather than infancy, and glaucomatous optic neuropathy
    follows. Glaucoma affects roughly a fifth of eyes in longitudinal cohorts
    and is, with keratopathy, one of the two acquired threats that make aniridia
    a lifelong surveillance diagnosis rather than a static malformation.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  biological_processes:

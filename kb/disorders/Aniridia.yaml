    reference_title: "A rare case of an isolated PAX6 mutation, aniridia, and Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aniridia, a pan-ocular disease resulting from iris hypoplasia, is thought to increase the risk for WT development if their genetic alteration spans both the WT1 and the PAX6 genes on 11p13."
    explanation: >
      Ties the tumour risk specifically to deletions spanning WT1, which is what
      restricts this phenotype to the WAGR subtype.
- category: Neurological
  name: Intellectual Disability

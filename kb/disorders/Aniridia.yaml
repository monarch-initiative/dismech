pathophysiology:
- name: Deletion of the PAX6 Downstream Regulatory Region
  biological_scale: MOLECULAR
  role: trigger
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - intron
    affected_regions:
    - name: PAX6 downstream regulatory region (DRR)
      chromosomal_region: 11p13
      regulatory_element_type: ENHANCER
      within_gene:
        preferred_term: ELP4
        term:
          id: hgnc:1171
          label: ELP4
      description: >-
        Cluster of PAX6-specific long-range control elements in ELP4 introns,
        downstream of PAX6. The named region identifies regulatory sequence
        within the larger patient deletions; it is not the entire deletion
        interval or a claim that ELP4 protein loss causes aniridia.
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    allele_type: de novo downstream deletions retaining the PAX6 transcription unit
  description: >-
    The two patients reported by Lauderdale et al. carry submicroscopic de novo
    deletions at 11p13 that start more than 11 kb beyond the PAX6 3' end and
    retain its transcription unit. These lesions affect the downstream
    regulatory landscape containing the ELP4-intronic DRR. Patient deletion
    boundaries differ; the enhancer-region annotation does not define one
    shared complete deletion or exclude contributions from other deleted genes.
  evidence:
  - reference: PMID:11087823
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two submicroscopic de novo deletions of 11p13 that cause aniridia
      but are located >11 kb from the 3' end of PAX6.
    explanation: Defines the gene-intact downstream human deletion class.
  - reference: PMID:17014839
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Analysis of the region beyond this breakpoint using YAC transgenic mice,
      DNaseI hypersensitivity mapping and reporter transgenic assays revealed
      the presence of several putative cis-regulatory elements, including ones
      driving expression in lens and retina (Kleinjan et al., 2001). These
      elements reside within introns of the adjacent, ubiquitously expressed
      ELP4 gene, but are nevertheless thought to be PAX6-specific long-range
      control elements (Kleinjan et al., 2002).
    explanation: >-
      Summarizes earlier transgenic-mouse enhancer mapping and the human
      locus annotation placing the DRR within ELP4. This is background
      support for the enhancer host and target, not a new patient deletion
      measurement.
  downstream:
  - target: Reduced PAX6 Expression after Downstream Regulatory Deletion
    causal_link_type: DIRECT
    description: Loss of downstream cis-regulatory DNA prevents normal expression from the intact PAX6 allele.
    evidence:
    - reference: PMID:11087823
      reference_title: "3' deletions cause aniridia by preventing PAX6 gene expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Using human x mouse retinoblastoma somatic cell hybrids, we show that
        PAX6 is transcribed only from the normal allele but not from the deleted
        chromosome 11 homolog.
      explanation: >-
        The deletion-to-expression relationship is demonstrated for patient
        chromosomes in somatic-cell hybrids. Its transfer to developing
        human ocular tissues is indirect.
- name: Reduced PAX6 Expression after Downstream Regulatory Deletion
  biological_scale: MOLECULAR
  description: >-
    Human-mouse retinoblastoma somatic-cell hybrids carrying the patient
    chromosomes express PAX6 from the normal homolog but not the deletion
    homolog. Separately, deletion of the DRR from a human PAX6 reporter YAC in
    transgenic mice removes retinal expression while lens expression remains
    at embryonic day E10.5.
    Together these experiments support loss of regulatory input to intact
    PAX6. They do not establish uniform loss across all tissues in the patients,
    so no all-tissue expression-loss category is assigned to these deletions.
  genes:
  - preferred_term: PAX6
    term:
      id: hgnc:8620
      label: PAX6
  biological_processes:
  - preferred_term: PAX6 gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: DECREASED
  evidence:
  - reference: PMID:11087823
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using human x mouse retinoblastoma somatic cell hybrids, we show that
      PAX6 is transcribed only from the normal allele but not from the deleted
      chromosome 11 homolog.
    explanation: Direct allele-specific expression evidence comes from somatic-cell hybrids, not patient embryonic eyes.
  - reference: PMID:17014839
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Similarly at E10.5, when Y001 has strong expression in both lens and
      retina, Y001ΔDRR maintains lens expression but expression in the retina
      is completely lost
    explanation: >-
      The engineered human-locus reporter establishes different requirements
      for the DRR in retina and lens at E10.5; it does not imply preservation
      of lens expression at later developmental stages.
  downstream:
  - target: PAX6 Haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      Reduced expression from the deletion-bearing chromosome is inferred to
      lower functional PAX6 dosage in affected ocular tissues.
    evidence:
    - reference: PMID:11087823
      reference_title: "3' deletions cause aniridia by preventing PAX6 gene expression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The clinical manifestations are indistinguishable from cases with
        chain-terminating mutations in the coding region.
      explanation: >-
        The similarity to coding-null aniridia supports convergence on PAX6
        insufficiency. Together with the somatic-cell-hybrid transcription
        assay, it supports the dosage mechanism without measuring protein
        abundance in the patients' developing eyes.
- name: PAX6 Haploinsufficiency
  description: >
    Heterozygous coding loss-of-function variants, whole-gene deletions, and
    downstream regulatory deletions converge on insufficient PAX6 activity
    in ocular tissues. Regulatory deletions can reduce expression while
    retaining the PAX6 transcription unit; their effects need not be uniform
    across tissues. PAX6 is a paired-box and homeodomain transcription factor
    required for ocular development and maintenance.
  role: convergence
  biological_scale: MOLECULAR

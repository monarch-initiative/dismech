    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main ocular symptoms experienced by those with congenital aniridia are photophobia, glare, low visual acuity, dryness/irritation of the ocular surface and nystagmus."
    explanation: >
      Documents the symptom set this node asserts, and specifically that
      photophobia and glare rank with acuity loss in the patient-experienced
      burden. Evidence source is OTHER because this is a consensus guideline.
- name: WT1 Haploinsufficiency in the Contiguous 11p13 Deletion
  biological_scale: MOLECULAR
  description: >-
    WT1 lies in the same 11p13 interval as PAX6, so a contiguous deletion
    encompassing both converts isolated aniridia into WAGR spectrum disorder. WT1
    encodes a zinc finger DNA-binding protein that acts as a transcriptional
    activator or repressor depending on context, and the variants reported for
    Wilms tumour type 1 are predominantly loss of function. Wilms tumours are
    thought to arise from abnormally persistent embryonal cells in nephrogenic
    rests, and in this form one WT1 allele is already absent from that tissue.
    This is the arm of the deletion that carries the tumour risk; the ocular
    phenotype is assigned to PAX6.
  genes:
  - preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  molecular_functions:
  - preferred_term: WT1 transcriptional regulation of nephrogenic tissue
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:

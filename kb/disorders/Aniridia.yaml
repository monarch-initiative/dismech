- name: Aniridia 2
  display_name: Aniridia 2 (PAX6 cis-regulatory deletion in the ELP4 locus)
  subtype_term:
    preferred_term: aniridia 2
    term:
      id: MONDO:0014937
      label: aniridia 2
  description: >-
    Aniridia in which the PAX6 transcription unit is intact and the lesion
    removes cis-regulatory DNA downstream of it. Those control elements lie
    within introns of the neighbouring ELP4 gene, so the deletion is annotated
    against ELP4 while the gene whose expression fails is PAX6. ClinGen records
    coding loss of function in ELP4 as not expected to contribute to eye disease
    at all, which is what separates a host locus from a causal gene here.
  genes:
  - preferred_term: PAX6
    term:
      id: hgnc:8620
      label: PAX6
  - preferred_term: ELP4
    term:
      id: hgnc:1171
      label: ELP4

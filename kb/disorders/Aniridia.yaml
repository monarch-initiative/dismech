    explanation: >-
      States the extent of the evidence base, which is the reason this row is
      described as a reported form.
  - reference: CGGV:assertion_c03ad7e1-74ea-4c47-b372-5beb8fbf4e97-2023-03-16T160000.000Z
    reference_title: "TRIM44 / aniridia 3 (Limited)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 7 affected members of 4-generation Chinese family with aniridia linked to chromosome 11p13, Zhang et al. (PMID: 26394807) identified a heterozygous missense variant, c.463G>A (p.Gly155Arg), in exon 1 of TRIM44"
    explanation: >-
      The single pedigree behind this row, with the variant ClinGen scored.

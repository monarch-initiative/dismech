name: Aniridia
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  Aniridia is a congenital, bilateral, pan-ocular malformation caused in most
  cases by haploinsufficiency of PAX6, the dose-sensitive transcription factor
  that governs eye development at 11p13. The name is a misnomer twice over. The
  iris is rarely wholly absent - partial hypoplasia is common - and the iris is
  not the most reliable sign: foveal hypoplasia is present more often, and is
  what limits acuity from birth. What the PAX6 lesion actually produces is a
  bundle of anterior and posterior segment defects that share one origin,
  progressing lifelong: nystagmus and foveal hypoplasia from infancy, cataract
  and glaucoma through childhood and adolescence, and aniridia-associated
  keratopathy from limbal stem cell deficiency, which opacifies and
  vascularizes the cornea in adulthood. About two thirds of cases are inherited
  as an autosomal dominant trait and one third arise de novo. When the causative
  lesion is a contiguous 11p13 deletion extending into WT1 rather than an
  intragenic PAX6 variant, the child has WAGR syndrome and carries a high risk
  of Wilms tumour, which makes determining the molecular lesion urgent rather
  than merely confirmatory.

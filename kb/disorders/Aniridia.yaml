    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anterior Segment Dysgenesis (ASD) encompasses a heterogeneous group of congenital ocular malformations resulting from disrupted differentiation of neural crest-derived tissues."
    explanation: >
      Places the anterior segment half of this node in the shared
      neural-crest differentiation mechanism the entry declares conformance to.

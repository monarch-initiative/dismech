    term:
      id: HP:0000609
      label: Optic nerve hypoplasia
  evidence:
  - reference: PMID:40892309
    reference_title: "Congenital aniridia: European COST action ANIRIDIA-NET guidelines for diagnosis, management and care."
    supports: SUPPORT

  evidence:
  - reference: CGGV:assertion_095db206-85a6-491a-929c-bb4db8d1240a-2023-11-16T170000.000Z
    reference_title: "ELP4 / ocular dysgenesis caused by defects in PAX6 regulation (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity appears to be monoallelic disruption of enhancer elements located in the introns of ELP4 but required for efficient PAX6 transactivation during ocular development"
    explanation: >-
      ClinGen locates the lesion in PAX6 enhancer elements that happen to sit in
      ELP4 introns, which is why PAX6 is bound as the gene whose expression
      fails, with ELP4 bound only as the host locus.
  - reference: CGGV:assertion_095db206-85a6-491a-929c-bb4db8d1240a-2023-11-16T170000.000Z
    reference_title: "ELP4 / ocular dysgenesis caused by defects in PAX6 regulation (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Please note that loss-of-function variants within the coding regions of ELP4 are not expected to contribute to eye disease"
    explanation: >-
      Direct statement that ELP4 coding loss of function does not cause eye
      disease, so ELP4 is the host locus and not the causal gene.
  - reference: PMID:11087823
    reference_title: "3' deletions cause aniridia by preventing PAX6 gene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two submicroscopic de novo deletions of 11p13 that cause
      aniridia but are located >11 kb from the 3' end of PAX6.
    explanation: >-
      Patient deletions that preserve the PAX6 transcription unit, which is the
      defining feature of this row.
  review_notes: >-
    Both genes are bound, and they stand in different relations to the disease.
    MONDO's OWL causal-gene axiom for MONDO:0014937 is hgnc:1171 ELP4, and
    ClinGen curates an ELP4 gene-disease relationship at Moderate, against
    MONDO:0700246 "ocular dysgenesis caused by defects in PAX6 regulation"
    rather than against this class. Both nonetheless place the lesion in PAX6
    enhancer elements that lie inside ELP4 introns, and ClinGen adds that ELP4
    coding loss of function is not expected to cause eye disease. So ELP4 is the
    host locus of the deleted regulatory DNA, recorded structurally as
    affected_regions.within_gene on the PAX6 downstream regulatory region entry
    in the genetic section, and PAX6 is the gene whose expression fails.
- name: Aniridia 3
  display_name: Aniridia 3 (TRIM44)
  subtype_term:
    preferred_term: aniridia 3
    term:
      id: MONDO:0014938
      label: aniridia 3
  description: >-
    A form reported in one four-generation Chinese pedigree in which a missense
    variant in TRIM44 segregated with aniridia, and overexpressed TRIM44 lowered
    PAX6 in a human lens epithelial cell line more strongly for the mutant than
    for the wild-type protein. The lesion is in TRIM44 coding sequence and acts
    in trans on PAX6, which makes it mechanistically unlike the cis-regulatory
    deletion on the Aniridia 2 row, although both reduce PAX6 expression and both
    MONDO and ClinGen file them under one parent concept. ClinGen grades the
    relationship Limited on the strength of a single study, so this row is
    recorded as a reported form rather than an established one.

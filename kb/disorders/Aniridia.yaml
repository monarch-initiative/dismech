    reference_title: WAGR Spectrum Disorder.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of WAGR spectrum disorder is established in a proband with suggestive findings and a deletion of chromosome 11p13 that includes the genes WT1 and PAX6 identified by molecular genetic testing."
    explanation: >-
      The GeneReviews chapter for the contiguous-deletion form defines it by a
      deletion spanning both genes, which is the lesion this node describes.
  - reference: CGGV:assertion_65010002-ff97-4dc0-a89f-6c77abf0982a-2020-07-30T205501.047Z
    reference_title: "WT1 / Wilms tumor 1 (Definitive)"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "In summary, loss of function variants in WT1 are definitively associated with autosomal dominant Wilms tumor type 1."
    explanation: >-
      ClinGen's Definitive grade for WT1 loss of function and dominant Wilms
      tumour, which is the gene-disease claim this node rests on.
  - reference: CGGV:assertion_65010002-ff97-4dc0-a89f-6c77abf0982a-2020-07-30T205501.047Z
    reference_title: "WT1 / Wilms tumor 1 (Definitive)"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "The WT1 gene encodes a zinc finger DNA-binding protein that acts as a transcriptional activator or repressor depending on the cellular or chromosomal context"
    explanation: >-
      Source for the molecular function bound on this node, and for the
      description's account of what the lost allele does.
  - reference: CGGV:assertion_65010002-ff97-4dc0-a89f-6c77abf0982a-2020-07-30T205501.047Z
    reference_title: "WT1 / Wilms tumor 1 (Definitive)"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Wilms tumours are thought to develop from abnormally persistent embryonal cells within nephrogenic rests"
    explanation: >-
      Source for the nephrogenic-rest substrate named in the description. Stated
      as the field's working model rather than as a measurement, so the link to
      this node's WT1 claim is inferential.
  downstream:
  - target: Wilms Tumour
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the WT1 allele carried on the deleted chromosome is what puts a
      child with contiguous-deletion aniridia at risk of nephroblastoma, and is
      why renal surveillance turns on whether the deletion breakpoints spare WT1.
      The germline loss raises risk rather than producing the tumour: a somatic
      second hit in a nephrogenic rest is required, and the cited sentence states
      the risk relation rather than the intervening steps.
    evidence:
    - reference: PMID:33300417
      reference_title: "A rare case of an isolated PAX6 mutation, aniridia, and Wilms tumor."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Aniridia, a pan-ocular disease resulting from iris hypoplasia, is thought to increase the risk for WT development if their genetic alteration spans both the WT1 and the PAX6 genes on 11p13."
      explanation: >-
        Ties the tumour risk to deletions spanning WT1. Quoted from this report's
        introduction: its own proband carried an isolated PAX6 nonsense variant
        rather than a contiguous deletion.
phenotypes:
- category: Ocular
  name: Aniridia
  description: >
    Partial or complete bilateral absence of the iris, the eponymous sign.
    Complete absence is less common than a hypoplastic rudimentary stump
    visible on gonioscopy.
  phenotype_term:
    preferred_term: Aniridia
    term:
      id: HP:0000526
      label: Aniridia
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aniridia classically presents with a bilateral congenital absence or malformation of the irides, foveal hypoplasia, and nystagmus, and patients tend to develop visually significant pre-senile cataracts and keratopathy."
    explanation: >
      Establishes bilateral iris absence or malformation as the defining
      presenting feature. No frequency band is asserted: this source states a
      definition rather than a proportion, and the guideline literature reports
      that iris absence is LESS consistent than foveal hypoplasia, which is
      banded FREQUENT here on a measured 75%. Claiming a higher band for the
      iris finding than for the foveal one would contradict that source.
- category: Ocular
  name: Foveal Hypoplasia
  description: >
    Arrested foveal development with persistence of inner retinal layers over
    the foveal centre, detectable on optical coherence tomography. It is the
    principal determinant of the acuity ceiling and is more consistently present
    than iris absence.
  phenotype_term:
    preferred_term: Hypoplasia of the fovea
    term:
      id: HP:0007750
      label: Hypoplasia of the fovea
  frequency: FREQUENT
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nystagmus was recorded in 87.2% of the eyes, and foveal hypoplasia was found in 75%."
    explanation: >
      Quantifies foveal hypoplasia at 75% of 172 eyes, supporting the FREQUENT
      band (80-30%).
- category: Ocular
  name: Nystagmus
  description: >
    Infantile nystagmus, secondary to the congenital sensory deficit imposed by
    foveal hypoplasia. Usually apparent within the first months of life and
    often the sign that brings the child to attention.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nystagmus was recorded in 87.2% of the eyes, and foveal hypoplasia was found in 75%."
    explanation: >
      87.2% of eyes places nystagmus in the VERY_FREQUENT band (99-80%).
- category: Ocular
  name: Cataract
  description: >
    Lens opacity, typically presenile and progressive, developing through

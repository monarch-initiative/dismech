genetic:
- name: PAX6
  association: Heterozygous loss-of-function variant or whole-gene deletion
  notes: >
    Paired box protein 6, the dose-sensitive master regulator of eye development
    at 11p13. Heterozygous loss of function - nonsense, frameshift, splice,
    whole-gene deletion, or disruption of the downstream cis-regulatory enhancer
    within an adjacent gene - causes classic aniridia by haploinsufficiency.
    Missense variants that retain partial function give milder phenotypes,
    including the variant presentations formerly called autosomal dominant
    keratitis.
  gene_term:
    preferred_term: PAX6
    term:
      id: hgnc:8620
      label: PAX6
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants of aniridia, which include a condition previously referred to as autosomal dominant keratitis, are likely due to PAX6 mutations that lead to partial loss of PAX6 function."
    explanation: >
      Supports the allelic-series claim that residual PAX6 function produces
      milder, sometimes differently named phenotypes.
- name: WT1
  association: Heterozygous loss within a contiguous 11p13 deletion
  notes: >
    Wilms tumour 1, immediately adjacent to PAX6 at 11p13. It is not a cause of
    aniridia; its loss in a contiguous deletion is what converts isolated
    aniridia into WAGR syndrome and creates the nephroblastoma risk.
  subtype: WAGR
  gene_term:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:33300417
    reference_title: "A rare case of an isolated PAX6 mutation, aniridia, and Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WAGR results from a contiguous gene deletion within the 11p13 region, encompassing the WT1 gene, often responsible for WT development, and the PAX6 gene, responsible for aniridia."
    explanation: >
      Assigns the tumour risk to WT1 and the ocular phenotype to PAX6 within one
      deletion, which is the basis for separating this gene's contribution to
      the WAGR subtype.
treatments:
- name: Intraocular Pressure Control and Glaucoma Surgery
  description: >
    Topical pressure-lowering pharmacotherapy, escalating to angle or filtering
    surgery or a glaucoma drainage device when medical control fails. Glaucoma in
    aniridia responds less predictably than primary open-angle glaucoma because
    the outflow pathway is structurally maldeveloped rather than merely
    obstructed, so lifelong pressure surveillance is required from diagnosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Maldeveloped Aqueous Outflow and Secondary Glaucoma
    treatment_effect: INHIBITS
    description: >
      Lowering intraocular pressure targets the consequence of the maldeveloped
      outflow pathway; it does not correct the developmental defect, which is
      why control is imperfect and surveillance permanent.
  evidence:
  - reference: PMID:40892309
    reference_title: "Congenital aniridia: European COST action ANIRIDIA-NET guidelines for diagnosis, management and care."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Management and follow-up of patients with congenital aniridia can be challenging due to the lack of effective therapeutic options and the complexity of ocular manifestations and outcomes."
    explanation: >
      The European guideline states plainly that effective therapeutic options
      are lacking. Marked PARTIAL because it supports the management framing
      while explicitly not asserting efficacy.
- name: Limbal Stem Cell Replacement and Keratoprosthesis
  description: >
    Surgical management of advanced keratopathy. Because the corneal opacity is
    driven by a deficient stem cell niche rather than by the cornea itself,
    plain penetrating keratoplasty is re-conjunctivalized; the options are to
    replace the limbal stem cells by keratolimbal allograft, with or without
    subsequent keratoplasty, or to bypass the surface entirely with a Boston
    type 1 keratoprosthesis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Ophthalmologic Surgical Procedure
    term:
      id: NCIT:C15331
      label: Ophthalmologic Surgical Procedure
  target_mechanisms:
  - target: Limbal Stem Cell Deficiency
    treatment_effect: RESTORES
    description: >
      Keratolimbal allograft aims to restore the deficient stem cell
      compartment itself, which is why it is directed at this node rather than
      at the keratopathy it produces.
    evidence:
    - reference: PMID:24138039
      reference_title: "A review of the clinical and genetic aspects of aniridia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The current treatments for AAK are to replace the limbal stem cells through keratolimbal allograft (KLAL) with or without subsequent keratoplasty for visual rehabilitation, or to implant a Boston type 1 keratoprosthesis."
      explanation: >
        States that the therapeutic target is the limbal stem cell compartment,
        supporting the mechanism link this treatment declares.
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The current treatments for AAK are to replace the limbal stem cells through keratolimbal allograft (KLAL) with or without subsequent keratoplasty for visual rehabilitation, or to implant a Boston type 1 keratoprosthesis."
    explanation: >
      Enumerates the current surgical options for aniridia-associated
      keratopathy. Evidence source is OTHER because this is a review.
- name: Renal Tumour Surveillance in Contiguous Deletion Aniridia
  description: >
    Serial renal ultrasonography for children with sporadic aniridia until the
    molecular lesion is shown not to involve WT1. This is the one intervention
    in aniridia that alters mortality rather than vision, and it is why
    molecular diagnosis in a sporadic case is urgent. Applies to the WAGR
    (contiguous 11p13 deletion) subtype.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33300417
    reference_title: "A rare case of an isolated PAX6 mutation, aniridia, and Wilms tumor."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated mutations in PAX6 previously have not been associated with increased risk of WT development case raises the question of if surveillance for WT should be continued in patients with aniridia with an isolated PAX6 mutation identified."
    explanation: >
      Supports surveillance as the standard for deletion-associated aniridia
      while documenting the open question this case raises about whether an
      identified isolated PAX6 variant is sufficient to stop it. Marked PARTIAL
      because it is a single case that unsettles rather than confirms practice.
- name: Genetic Counselling and Molecular Diagnosis
  description: >
    Determination of the causative lesion - intragenic PAX6 variant versus
    contiguous 11p13 deletion - drives both tumour surveillance and
    reproductive counselling for a dominant condition with high penetrance and
    a substantial de novo rate.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Classic aniridia can be genetically defined as the presence of a PAX6 gene deletion or loss-of-function mutation that results in haploinsufficiency."
    explanation: >
      Supports the genetic definition on which counselling and the
      deletion-versus-intragenic distinction rest. Evidence source is OTHER
      because this is a review.
experimental_models:
- name: Patient-derived iPSC corneal organoid model of aniridia-associated keratopathy
  experimental_model_type: ORGANOID
  description: >
    Three-dimensional corneal organoids differentiated from induced pluripotent
    stem cells of aniridia patients, generating corneal epithelial-like cells in
    a self-assembled tissue that reproduces the native corneal microenvironment.
    Provides a human genotype-matched system for the limbal arm of the disease,
    complementing the Pax6-heterozygous mouse.
  publication: PMID:42612147
  modeled_mechanisms:
  - target: Limbal Stem Cell Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    description: >
      The organoid provides a human, patient-genotype platform for interrogating
      corneal epithelial differentiation, which is the process this node asserts
      is defective.
    limitations: >
      Organoids lack the limbal niche vasculature, tear film, innervation and
      chronic inflammatory environment in which aniridia-associated keratopathy
      actually progresses, so they can model the differentiation defect but not
      the decades-long clinical progression it drives.
    evidence:
    - reference: PMID:42612147
      reference_title: "Patient-Specific iPSC-Derived Cornea Organoids for Investigating Aniridia-Associated Corneal Disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our protocol involves the stepwise differentiation of iPSCs into corneal epithelial-like cells within self-assembled three-dimensional organoids, which mimic the native corneal microenvironment."
      explanation: >
        Establishes that the model produces the cell type whose differentiation
        this mechanism node concerns.
animal_models:
- name: Pax6 heterozygous mouse
  species: Mouse
  genotype: Pax6 heterozygous (Pax6+/-)
  description: >
    The standard genetic model of aniridia-associated keratopathy, matching the
    human haploinsufficient genotype. Single-cell RNA sequencing of its cornea
    and limbus identified an accumulation of quiescent limbal stem cell-like and
    early transit-amplifying cells that fail to commit to a corneal epithelial
    fate.
  publication: PMID:41590604
  modeled_mechanisms:
  - target: Limbal Stem Cell Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Reproduces the human haploinsufficient genotype and the corneal
      stem-cell-commitment defect, in the tissue where the human disease
      progresses.
    limitations: >
      Mouse and human corneal limbal anatomy differ, and the mouse does not
      develop the decades-long conjunctivalization and vascularization that
      define the human keratopathy endpoint.
    readouts:
    - name: Expression of corneal epithelial fate and differentiation genes in early transit-amplifying cells
      target: Limbal Stem Cell Deficiency
      direction: DECREASED
      interpretation: >
        Molecular correlate of the failed commitment this node asserts.
      evidence:
      - reference: PMID:41590604
        reference_title: "PAX6 Deficiency Compromises the Ability of Limbal Epithelial Stem Cells to Properly Differentiate Into Mature Corneal Epithelial Cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The Pax6 deficiency inhibited the expression of genes involved in cell proliferation in the eTAC-like cluster as well as the expression of genes related to corneal epithelial cell fate and differentiation compared with WT mice."
        explanation: >
          Reports the measurement and its direction directly.
    evidence:
    - reference: PMID:41590604
      reference_title: "PAX6 Deficiency Compromises the Ability of Limbal Epithelial Stem Cells to Properly Differentiate Into Mature Corneal Epithelial Cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Aniridia, driven by PAX6 mutations, causes aniridia-associated keratopathy (AAK), a progressive condition linked to limbal stem cell deficiency."
      explanation: >
        States the human mechanism the model is used to interrogate, supporting
        treating this model as informative for this node.
discussions:
- discussion_id: aniridia_wt_surveillance_isolated_pax6
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can renal tumour surveillance be safely discontinued in a child with
    sporadic aniridia once an intragenic PAX6 variant has been identified and a
    WT1-spanning deletion excluded?
  attaches_to:
  - "pathophysiology#PAX6 Haploinsufficiency"
  rationale: >-
    Current practice rests on the assumption that Wilms tumour risk in aniridia
    is carried entirely by WT1 loss in the contiguous deletion, so identifying
    an intragenic PAX6 variant should release the child from years of
    ultrasound surveillance. A reported case of Wilms tumour in a patient with
    aniridia due to a heterozygous PAX6 nonsense variant and no other
    identifiable germline driver directly unsettles that assumption. Because
    the decision trades a real surveillance burden against a lethal but
    treatable malignancy, and because it is the only mortality-relevant decision
    in the management of aniridia, the question is worth marking explicitly
    rather than treating as settled.
  proposed_experiments:
  - experiment_id: aniridia_intragenic_pax6_tumour_registry
    name: Registry-scale tumour incidence in molecularly defined intragenic PAX6 aniridia
    description: >
      Pool international aniridia registries to estimate Wilms tumour incidence
      specifically among patients with confirmed intragenic PAX6 variants and
      breakpoint-mapped exclusion of WT1 involvement, with power to detect an
      excess over population background.

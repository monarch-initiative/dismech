    acuity gain is limited by the coexisting foveal hypoplasia.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cataracts were diagnosed in 70.3%, glaucoma in 20.6%, and ARK in 68.6% of eyes."
    explanation: >
      70.3% of eyes places cataract in the FREQUENT band (80-30%).
- category: Ocular
  name: Aniridia-Associated Keratopathy
  description: >
    Progressive conjunctivalization, vascularization and opacification of the

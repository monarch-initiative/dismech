    causal_link_type: DIRECT

- name: Limbal Stem Cell Deficiency
  description: >
    A distinct, postnatally progressive arm. PAX6 is required not only to build
    the cornea but to maintain the limbal epithelial stem cell niche that
    renews it throughout life. With one allele, the stem cell compartment is
    functionally deficient: single-cell profiling of Pax6-heterozygous mouse
    cornea shows an accumulation of stem-like and early transit-amplifying cells
    that fail to commit to a mature corneal epithelial fate. Chronic inflammation
    and ocular surface dryness compound the defect. This is why
    aniridia-associated keratopathy is the one feature of the disease that
    reliably worsens with age rather than being fixed at birth.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: limbal epithelial stem cell of cornea
    term:

    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cataracts were diagnosed in 70.3%, glaucoma in 20.6%, and ARK in 68.6% of eyes."
    explanation: >
      Quantifies glaucoma frequency in a molecularly confirmed longitudinal
      cohort, supporting the roughly one-in-five figure this node states.
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These disorders frequently lead to developmental glaucoma, a major cause of childhood blindness."
    explanation: >
      Supports treating the glaucoma of aniridia as the shared terminal
      consequence of anterior segment dysgenesis rather than an incidental
      comorbidity. Evidence source is OTHER because this is a review.

- name: Congenital Visual Impairment with Nystagmus
  description: >
    Foveal hypoplasia deprives the developing visual system of a high-acuity
    fixation locus, so acuity is subnormal from birth and infantile nystagmus
    develops as a consequence of that sensory deficit rather than as an
    independent motor abnormality. The absent or deficient iris compounds
    disability by removing the aperture stop, producing the photophobia and
    glare that patients frequently rank above acuity loss as their dominant
    symptom. Because the sensory deficit is congenital and structural, acuity in
    aniridia does not improve with refractive correction.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:

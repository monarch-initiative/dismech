inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Aniridia is transmitted as an autosomal dominant trait with high penetrance
    and variable expressivity, and results from haploinsufficiency: one
    functional PAX6 allele is not enough. Roughly a third of probands represent
    de novo events, and a de novo case with a chromosomal deletion is the
    situation in which WAGR must be excluded.
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Classic aniridia can be genetically defined as the presence of a PAX6 gene deletion or loss-of-function mutation that results in haploinsufficiency."
    explanation: >
      Establishes haploinsufficiency, rather than a dominant-negative or
      gain-of-function mechanism, as the basis of the dominant inheritance in
      classic aniridia.
  - reference: PMID:20301534
    reference_title: "PAX6 Aniridia Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Approximately two thirds of individuals diagnosed with PAX6 aniridia syndrome have an affected parent. Approximately one third of affected individuals have the disorder as the result of a de novo PAX6 genetic alteration."
    explanation: >
      GeneReviews supplies the inherited-versus-de-novo split stated in this
      entry's description, which was previously asserted without a citation.
      Evidence source is OTHER because GeneReviews is an expert-curated clinical
      synthesis rather than a primary study.
has_subtypes:
- name: Isolated aniridia
  display_name: Isolated (non-syndromic) aniridia
  subtype_term:
    preferred_term: isolated aniridia
    term:
      id: MONDO:0007119
      label: isolated aniridia
  description: >
    Aniridia caused by an intragenic PAX6 loss-of-function variant or by a
    deletion confined to PAX6 and its cis-regulatory region, without extraocular
    malignancy risk. This is the majority form. Within it, genotype modulates
    severity: missense variants, which retain partial PAX6 function, give the
    mildest phenotype, whereas whole-gene deletions and nonsense or frameshift
    variants abolish one allele outright.
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the missense mutation subgroup had the mildest phenotype, and surgically naive eyes maintained better visual acuity."
    explanation: >
      Longitudinal cohort of 86 molecularly confirmed patients showing that
      residual PAX6 function stratifies severity within the isolated form.
- name: WAGR
  display_name: WAGR syndrome (contiguous 11p13 deletion)
  subtype_term:
    preferred_term: WAGR syndrome
    term:
      id: MONDO:0008681
      label: WAGR syndrome
  description: >
    Aniridia arising as part of a contiguous gene deletion at 11p13 that removes
    WT1 as well as PAX6, producing Wilms tumour predisposition, genitourinary
    anomalies and intellectual disability alongside the ocular phenotype.
    Because the aniridia is the visible sign and often the presenting one, every
    child with apparently isolated sporadic aniridia requires molecular
    definition of the deletion breakpoints before renal tumour surveillance can
    be safely omitted.
  evidence:
  - reference: PMID:33300417
    reference_title: "A rare case of an isolated PAX6 mutation, aniridia, and Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WAGR results from a contiguous gene deletion within the 11p13 region, encompassing the WT1 gene, often responsible for WT development, and the PAX6 gene, responsible for aniridia."
    explanation: >
      Defines the contiguous-deletion architecture that separates this subtype
      from the isolated form and locates the tumour risk in WT1 rather than in
      PAX6.
pathophysiology:
- name: PAX6 Haploinsufficiency
  description: >
    A heterozygous loss-of-function variant, whole-gene deletion, or disruption
    of the distal cis-regulatory enhancer leaves a single functional PAX6 allele.
    PAX6 is a paired-box and homeodomain transcription factor whose dose is read
    quantitatively across every tissue that builds the eye - surface ectoderm,
    lens placode, optic cup, and the neural-crest-derived periocular mesenchyme -
    so a 50% reduction is not silent anywhere. Because the gene acts as a
    developmental regulator rather than a structural protein, the consequences
    are set in embryogenesis and cannot be corrected postnatally.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: Camera-type eye development
    term:
      id: GO:0043010
      label: camera-type eye development
    modifier: DECREASED
  conforms_to: "anterior_segment_dysgenesis#Anterior Segment Developmental Regulator Defect"
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aniridia is most commonly caused by haploinsufficiency of the PAX6 gene, characterized by variable iris and foveal hypoplasia, nystagmus, cataracts, glaucoma, and aniridia-related keratopathy (ARK)."
    explanation: >
      Establishes PAX6 haploinsufficiency as the initiating lesion and lists the
      multi-tissue phenotype bundle it produces, which is what this node's
      downstream edges model.
  downstream:
  - target: Failed Anterior Segment and Foveal Differentiation
    causal_link_type: DIRECT
  - target: Limbal Stem Cell Deficiency
    causal_link_type: DIRECT

- name: Failed Anterior Segment and Foveal Differentiation
  description: >
    Reduced PAX6 dose during ocular morphogenesis leaves the periocular
    mesenchyme-derived structures of the anterior segment incompletely
    differentiated, and simultaneously arrests the specialization of the central
    retina. The iris stroma and its muscle fail to form beyond a rudimentary
    stump; the iridocorneal angle and trabecular meshwork are maldeveloped; the
    lens is prone to opacification; and the foveal pit, which requires postnatal
    displacement of inner retinal layers over a cone-only centre, never fully
    excavates. That the same lesion hits both the anterior segment and the fovea
    is why aniridia is a pan-ocular disease rather than an iris disease.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  biological_processes:
  - preferred_term: Iris morphogenesis
    term:
      id: GO:0061072
      label: iris morphogenesis
    modifier: DECREASED
  - preferred_term: Trabecular meshwork development
    term:
      id: GO:0002930
      label: trabecular meshwork development
    modifier: DECREASED
  - preferred_term: Retina development in camera-type eye
    term:
      id: GO:0060041
      label: retina development in camera-type eye
    modifier: ABNORMAL
  locations:
  - preferred_term: anterior segment of eyeball
    term:
      id: UBERON:0001801
      label: anterior segment of eyeball
  conforms_to: "anterior_segment_dysgenesis#Failed Differentiation and Separation of Anterior Segment Tissues"
  evidence:
  - reference: PMID:40892309
    reference_title: "Congenital aniridia: European COST action ANIRIDIA-NET guidelines for diagnosis, management and care."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main visible phenotypic characteristic is the partial or complete absence of the iris; however, foveal hypoplasia is a more frequent and reliable clinical sign."
    explanation: >
      Supports the dual anterior-and-posterior claim this node makes, and the
      specific point that the foveal component is the more consistent
      consequence of the PAX6 lesion than the iris component the disease is
      named for. Evidence source is OTHER because this is a consensus guideline
      review.
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anterior Segment Dysgenesis (ASD) encompasses a heterogeneous group of congenital ocular malformations resulting from disrupted differentiation of neural crest-derived tissues."
    explanation: >
      Places the anterior segment half of this node in the shared
      neural-crest differentiation mechanism the entry declares conformance to.
      Evidence source is OTHER because this is a review.
  downstream:
  - target: Maldeveloped Aqueous Outflow and Secondary Glaucoma
    causal_link_type: DIRECT
  - target: Congenital Visual Impairment with Nystagmus
    causal_link_type: DIRECT

- name: Limbal Stem Cell Deficiency
  description: >
    A distinct, postnatally progressive arm. PAX6 is required not only to build
    the cornea but to maintain the limbal epithelial stem cell niche that
    renews it throughout life. With one allele, the stem cell compartment is
    functionally deficient: single-cell profiling of Pax6-heterozygous mouse
    cornea shows an accumulation of stem-like and early transit-amplifying cells
    that fail to commit to a mature corneal epithelial fate. Chronic inflammation
    and ocular surface dryness compound the defect. This is why
    aniridia-associated keratopathy is the one feature of the disease that
    reliably worsens with age rather than being fixed at birth.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: limbal epithelial stem cell of cornea
    term:
      id: CL:4033093
      label: limbal epithelial stem cell of cornea
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  biological_processes:
  - preferred_term: Epithelial cell differentiation
    term:
      id: GO:0030855
      label: epithelial cell differentiation
    modifier: DECREASED
  - preferred_term: Cornea development in camera-type eye
    term:
      id: GO:0061303
      label: cornea development in camera-type eye
    modifier: ABNORMAL
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:41590604
    reference_title: "PAX6 Deficiency Compromises the Ability of Limbal Epithelial Stem Cells to Properly Differentiate Into Mature Corneal Epithelial Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our single cell transcriptome of the limbus and cornea of Pax6 het mice indicates that AAK may be due to the increase of dysfunctional stem/eTACs with defects in committing to a corneal epithelial cell fate and differentiation."
    explanation: >
      Provides the cellular mechanism this node asserts - a failure of
      commitment rather than a loss of stem cells - in the heterozygous model
      that matches the human genotype.
  - reference: PMID:42048350
    reference_title: "Fatty acid-binding protein 5 (FABP5) modulates limbal epithelial cell homeostasis by regulating the expression of key genes under both normal and inflammatory conditions, in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Congenital aniridia, a rare disorder caused by PAX6 haploinsufficiency, is characterized by progressive, vision-threatening aniridia-associated keratopathy (AAK) with limbal epithelial dysfunction and chronic inflammation."
    explanation: >
      Supports the progressive, inflammation-associated character of the limbal
      arm that distinguishes it from the fixed developmental defects.
  downstream:
  - target: Aniridia-Associated Keratopathy
    causal_link_type: DIRECT

- name: Aniridia-Associated Keratopathy
  description: >
    The clinical expression of limbal failure: conjunctival epithelium
    progressively invades the corneal surface, bringing vessels with it, and the
    cornea becomes vascularized, opaque and unstable. It begins peripherally and
    advances centrally over decades, so a patient whose acuity was limited by
    foveal hypoplasia in childhood may lose further vision to the cornea in
    adulthood. Keratopathy is the feature that most often prompts surgery, and
    the one whose surgery most often fails, because a transplanted cornea placed
    on a limbally deficient surface is re-invaded.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aniridia-associated keratopathy (AAK) is a progressive and potentially debilitating problem affecting aniridic patients."
    explanation: >
      Establishes the progressive and sight-threatening character of this
      consequence node. Evidence source is OTHER because this is a review.

- name: Maldeveloped Aqueous Outflow and Secondary Glaucoma
  description: >
    The maldeveloped iridocorneal angle limits aqueous outflow, and in many
    patients the rudimentary iris stump progressively rotates forward to occlude
    what angle there is. Intraocular pressure rises, typically in later childhood
    or adolescence rather than infancy, and glaucomatous optic neuropathy
    follows. Glaucoma affects roughly a fifth of eyes in longitudinal cohorts
    and is, with keratopathy, one of the two acquired threats that make aniridia
    a lifelong surveillance diagnosis rather than a static malformation.
  role: consequence
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  biological_processes:
  - preferred_term: Trabecular meshwork development
    term:
      id: GO:0002930
      label: trabecular meshwork development
    modifier: DECREASED
  locations:
  - preferred_term: eye trabecular meshwork
    term:
      id: UBERON:0005969
      label: eye trabecular meshwork
  conforms_to: "anterior_segment_dysgenesis#Maldeveloped Aqueous Outflow Pathway and Developmental Glaucoma"
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cataracts were diagnosed in 70.3%, glaucoma in 20.6%, and ARK in 68.6% of eyes."
    explanation: >
      Quantifies glaucoma frequency in a molecularly confirmed longitudinal
      cohort, supporting the roughly one-in-five figure this node states.
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These disorders frequently lead to developmental glaucoma, a major cause of childhood blindness."
    explanation: >
      Supports treating the glaucoma of aniridia as the shared terminal
      consequence of anterior segment dysgenesis rather than an incidental
      comorbidity. Evidence source is OTHER because this is a review.

- name: Congenital Visual Impairment with Nystagmus
  description: >
    Foveal hypoplasia deprives the developing visual system of a high-acuity
    fixation locus, so acuity is subnormal from birth and infantile nystagmus
    develops as a consequence of that sensory deficit rather than as an
    independent motor abnormality. The absent or deficient iris compounds
    disability by removing the aperture stop, producing the photophobia and
    glare that patients frequently rank above acuity loss as their dominant
    symptom. Because the sensory deficit is congenital and structural, acuity in
    aniridia does not improve with refractive correction.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:40892309
    reference_title: "Congenital aniridia: European COST action ANIRIDIA-NET guidelines for diagnosis, management and care."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main ocular symptoms experienced by those with congenital aniridia are photophobia, glare, low visual acuity, dryness/irritation of the ocular surface and nystagmus."
    explanation: >
      Documents the symptom set this node asserts, and specifically that
      photophobia and glare rank with acuity loss in the patient-experienced
      burden. Evidence source is OTHER because this is a consensus guideline.
phenotypes:
- category: Ocular
  name: Aniridia
  description: >
    Partial or complete bilateral absence of the iris, the eponymous sign.
    Complete absence is less common than a hypoplastic rudimentary stump
    visible on gonioscopy.
  phenotype_term:
    preferred_term: Aniridia
    term:
      id: HP:0000526
      label: Aniridia
  evidence:
  - reference: PMID:24138039
    reference_title: "A review of the clinical and genetic aspects of aniridia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aniridia classically presents with a bilateral congenital absence or malformation of the irides, foveal hypoplasia, and nystagmus, and patients tend to develop visually significant pre-senile cataracts and keratopathy."
    explanation: >
      Establishes bilateral iris absence or malformation as the defining
      presenting feature. No frequency band is asserted: this source states a
      definition rather than a proportion, and the guideline literature reports
      that iris absence is LESS consistent than foveal hypoplasia, which is
      banded FREQUENT here on a measured 75%. Claiming a higher band for the
      iris finding than for the foveal one would contradict that source.
- category: Ocular
  name: Foveal Hypoplasia
  description: >
    Arrested foveal development with persistence of inner retinal layers over
    the foveal centre, detectable on optical coherence tomography. It is the
    principal determinant of the acuity ceiling and is more consistently present
    than iris absence.
  phenotype_term:
    preferred_term: Hypoplasia of the fovea
    term:
      id: HP:0007750
      label: Hypoplasia of the fovea
  frequency: FREQUENT
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nystagmus was recorded in 87.2% of the eyes, and foveal hypoplasia was found in 75%."
    explanation: >
      Quantifies foveal hypoplasia at 75% of 172 eyes, supporting the FREQUENT
      band (80-30%).
- category: Ocular
  name: Nystagmus
  description: >
    Infantile nystagmus, secondary to the congenital sensory deficit imposed by
    foveal hypoplasia. Usually apparent within the first months of life and
    often the sign that brings the child to attention.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:34101622
    reference_title: "Longitudinal genotype-phenotype analysis in 86 patients with PAX6-related aniridia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nystagmus was recorded in 87.2% of the eyes, and foveal hypoplasia was found in 75%."
    explanation: >
      87.2% of eyes places nystagmus in the VERY_FREQUENT band (99-80%).
- category: Ocular

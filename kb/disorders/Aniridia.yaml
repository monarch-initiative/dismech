    evidence:
    - reference: PMID:41818601
      reference_title: WAGR Spectrum Disorder.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "WAGR spectrum disorder is an autosomal dominant disorder typically caused by a de novo 11p13 deletion. Rarely, an unaffected parent of a proband with WAGR spectrum disorder has a predisposing chromosome rearrangement."
      explanation: >-
        The GeneReviews chapter states the inheritance mode, the de novo origin of

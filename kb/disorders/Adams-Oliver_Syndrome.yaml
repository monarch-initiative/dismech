    evidence:
    - reference: PMID:25963545
      reference_title: Haploinsufficiency of the NOTCH1 Receptor as a Cause of Adams-Oliver Syndrome With Variable Cardiac Anomalies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        NOTCH1 transcript levels were significantly reduced by comparison to an unaffected control individual, demonstrating approximately 50% expression in all samples tested
      explanation: Patient RNA demonstrates reduced NOTCH1 dosage.
  evidence:
  - reference: PMID:25963545
    reference_title: Haploinsufficiency of the NOTCH1 Receptor as a Cause of Adams-Oliver Syndrome With Variable Cardiac Anomalies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NOTCH1 transcript levels were significantly reduced by comparison to an unaffected control individual, demonstrating approximately 50% expression in all samples tested
    explanation: Supports NOTCH1 haploinsufficiency in variant carriers.
- name: DLL4 Loss of Function
  description: >-
    Heterozygous loss-of-function variants in the canonical Notch ligand DLL4
    cause AOS6 and reduce ligand capacity within the DLL4-NOTCH signaling axis.
  genes:
  - preferred_term: DLL4
    term:
      id: hgnc:2910
      label: DLL4
  subtypes:
  - AOS6
  downstream:
  - target: Reduced Canonical Notch Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced DLL4-mediated Notch receptor activation
    description: DLL4 loss reduces activation of the canonical receptor-effector cascade.
    evidence:
    - reference: PMID:26299364
      reference_title: Heterozygous Loss-of-Function Mutations in DLL4 Cause Adams-Oliver Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings demonstrate that DLL4 mutations are an additional cause of autosomal-dominant AOS or isolated ACC and provide further evidence for a key role of NOTCH signaling in the etiology of this disorder.
      explanation: Human genetics supports DLL4 loss within the Notch-pathway AOS branch.
  - target: DLL4-Dependent Second Heart Field Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced DLL4-mediated Notch signaling in second-heart-field progenitors
    description: DLL4 loss depletes the second-heart-field progenitor pool in the cardiac mouse model.
    evidence:
    - reference: PMID:33899511
      reference_title: Murine Model of Cardiac Defects Observed in Adams-Oliver Syndrome Driven by Delta-Like Ligand-4 Haploinsufficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dll4-mediated Notch signaling is critically required for SHF proliferation such that Dll4 knockout results in a 33% reduction in proliferation and a fourfold increase in apoptosis in SHF cells, leading to a 56% decline in the size of the SHF progenitor pool.
      explanation: Defines the DLL4-dependent second-heart-field mechanism in mice.
  evidence:
  - reference: PMID:26299364
    reference_title: Heterozygous Loss-of-Function Mutations in DLL4 Cause Adams-Oliver Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nine heterozygous mutations in DLL4 were identified, including two nonsense and seven missense variants
    explanation: Establishes the disease-associated DLL4 variant series.
- name: RBPJ Dominant-Negative Cofactor Sequestration
  description: >-
    AOS3-associated RBPJ missense variants compromise DNA binding while
    retaining cofactor binding, supporting dominant-negative sequestration of
    canonical Notch transcriptional cofactors.
  genes:
  - preferred_term: RBPJ
    term:
      id: hgnc:5724
      label: RBPJ
  subtypes:
  - AOS3
  downstream:
  - target: Reduced Canonical Notch Signaling
    causal_link_type: DIRECT
    description: Cofactor sequestration reduces DNA-bound canonical Notch transcriptional activity.
    evidence:
    - reference: PMID:41055965
      reference_title: Defective Notch1 signaling in endothelial cells drives pathogenesis in a mouse model of Adams-Oliver syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These findings suggest that AOS-associated RBPJ variants do not function as loss-of-function alleles but instead act as dominant-negative proteins that sequester cofactors from DNA.
      explanation: Quantitative binding assays support the dominant-negative route.
  evidence:
  - reference: PMID:41055965
    reference_title: Defective Notch1 signaling in endothelial cells drives pathogenesis in a mouse model of Adams-Oliver syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we used quantitative binding assays to show that AOS-associated RBPJ missense variants compromise DNA binding but not cofactor binding.
    explanation: Defines the proximal biochemical defect.
- name: EOGT-Dependent Notch O-GlcNAcylation Deficiency
  description: >-
    AOS4-associated EOGT variants impair O-GlcNAcylation of EGF-repeat proteins.
    EOGT-deficient cells show selectively reduced DLL1/DLL4 binding and impaired
    ligand-induced Notch signaling, whereas JAG1 binding is preserved.
  genes:
  - preferred_term: EOGT
    term:
      id: hgnc:28526
      label: EOGT
  subtypes:
  - AOS4
  downstream:
  - target: Reduced Canonical Notch Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced O-GlcNAcylation of NOTCH EGF repeats
    - impaired DLL1/DLL4 binding and ligand-induced activation
    description: EOGT deficiency weakens DLL-selective Notch receptor activation.
    evidence:
    - reference: PMID:28395734
      reference_title: O-GlcNAc on NOTCH1 EGF repeats regulates ligand-induced Notch signaling and vascular development in mammals.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In EOGT-deficient cells, the binding of DLL1 and DLL4, but not JAG1, canonical Notch ligands was reduced, and ligand-induced Notch signaling was impaired.
      explanation: Directly supports the ligand-selective signaling defect.
  evidence:
  - reference: PMID:25488668
    reference_title: Impaired O-linked N-acetylglucosaminylation in the endoplasmic reticulum by mutated epidermal growth factor (EGF) domain-specific O-linked N-acetylglucosamine transferase found in Adams-Oliver syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As compared with wild-type EOGT, O-GlcNAcylation in the ER is nearly abolished in HEK293T cells exogenously expressing EOGT variants associated with AOS.
    explanation: Demonstrates loss of enzymatic product for AOS-associated EOGT variants in vitro.

  evidence:
  - reference: PMID:41126757
    reference_title: Mouse scalp development requires Rac1 and SRF for the maintenance of mechanoresponsive mesenchyme.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rac1-KO mice died perinatally and lacked the apical calvarium and overlying dermis, resembling defects seen in severe AOS.
    explanation: Supports phenotypic resemblance and the explicit pathway-level limitation.
- species: Mouse (Mus musculus)
  genotype: Global or endothelial Eogt deletion
  genes:
  - preferred_term: EOGT
    term:
      id: hgnc:28526
      label: EOGT
  category: Genetically engineered pathway model
  associated_phenotypes:
  - Defective retinal angiogenesis
  description: >-
    Eogt loss impairs retinal angiogenesis and endothelial Notch output, but the
    null mouse does not reproduce the abnormalities predicted from human AOS.
    It is therefore a proximal pathway model with a material human-model
    mismatch.
  evidence:
  - reference: PMID:28395734
    reference_title: O-GlcNAc on NOTCH1 EGF repeats regulates ligand-induced Notch signaling and vascular development in mammals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Global or endothelial cell-specific deletion of Eogt resulted in defective retinal angiogenesis, with a mild phenotype similar to that caused by reduced Notch signaling in retina.
    explanation: Supports the proximal vascular phenotype.
  - reference: PMID:28395734
    reference_title: O-GlcNAc on NOTCH1 EGF repeats regulates ligand-induced Notch signaling and vascular development in mammals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly,Eogt-null mice do not exhibit abnormalities predicted from the symptoms of AOS patients.
    explanation: Directly documents the mismatch with the human syndrome.
clinical_trials:
- name: NCT01630421
  description: >-
    Observational study of families and isolated cases with aplasia cutis
    congenita to identify causal genes or regulatory elements and study cellular
    mechanisms. It is relevant to AOS because scalp ACC is a core feature, but
    it is not an AOS-specific interventional or treatment trial.
  evidence:
  - reference: clinicaltrials:NCT01630421
    reference_title: Identification of Mutations That Lead to Aplasia Cutis Congenita in Families and Isolated Cases and Studies of Cellular and Molecular Mechanisms
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this research study is to identify genes and regulatory elements on chromosomes that cause ACC. The investigators also study tissue samples from patients to learn about the processes that lead to this disorder.
    explanation: Establishes the observational genetics and mechanism scope without implying AOS-specific treatment efficacy.
discussions:
- discussion_id: gap_aos_shared_developmental_route
  prompt: >-
    What developmental mechanisms connect the separate Notch, CDC42/RAC1, and
    VCP biochemical branches to the shared scalp-aplasia and terminal-limb
    pattern, and do any branches truly converge in the relevant human tissues?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Canonical Notch Signaling
  - pathophysiology#Actin Cytoskeleton Defects
  - pathophysiology#AOS-Associated VCP Variant Effects
  rationale: >-
    Human genetics establishes all three branches, but the scalp/limb vascular
    route is proposed, the Rho branch has an incomplete developmental bridge,
    and the VCP organ-level bridge is newly unresolved. No evidence currently
    justifies connecting VCP to Notch or Rho signaling.
  evidence:
  - reference: PMID:25132448
    reference_title: Mutations in NOTCH1 cause Adams-Oliver syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that the limb and scalp defects might also be due to a vasculopathy in NOTCH1-related AOS.
    explanation: Shows that even the best-known human scalp/limb vascular route is framed as a proposal.
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that AOS-related VCP variants are hypermorphic with respect to ATP hydrolysis and cause N-terminal domain hyperflexibility with impairment of interdomain coupling.
    explanation: Establishes the VCP proximal effect but not an organ-development mechanism.
- discussion_id: mismatch_eogt_null_mouse
  prompt: >-
    Why does Eogt loss reproduce reduced Notch signaling and retinal vascular
    defects in mice without reproducing the predicted human AOS abnormalities?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#EOGT-Dependent Notch O-GlcNAcylation Deficiency
  rationale: >-
    The model supports the proximal DLL-selective Notch mechanism but not the
    human scalp/limb phenotype, limiting organism-level causal inference.
  evidence:
  - reference: PMID:28395734
    reference_title: O-GlcNAc on NOTCH1 EGF repeats regulates ligand-induced Notch signaling and vascular development in mammals.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly,Eogt-null mice do not exhibit abnormalities predicted from the symptoms of AOS patients.
    explanation: The primary model report explicitly identifies the mismatch.
- discussion_id: gap_vcp_inhibitor_translation
  prompt: >-
    Can the in-vitro normalization of hyperactive AOS-associated VCP by CB-5083
    be translated safely or effectively, and at what developmental window?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#VCP Hypermorphic ATPase Activity
  rationale: >-
    The only current evidence is biochemical inhibition in vitro. CB-5083 is
    not modeled as an AOS treatment, and there is no human safety, dosing, or
    efficacy evidence in this disease.
  evidence:
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, we find that CB-5083 inhibits the overactive ATP hydrolysis.
    explanation: Supports only the proximal in-vitro assay result.

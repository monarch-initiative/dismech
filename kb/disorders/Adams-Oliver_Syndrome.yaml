    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Similar to the clinical syndrome, 32% of SHF-specific Dll4 heterozygotes demonstrate foreshortened and misaligned OFT, resulting in a double outlet right ventricle.
    explanation: Supports the cardiac phenotype in the DLL4 model.
- species: Mouse (Mus musculus)
  genotype: Pdgfra-Cre conditional Rac1 deletion in cranial mesenchyme
  genes:
  - preferred_term: RAC1
    term:
      id: hgnc:9801

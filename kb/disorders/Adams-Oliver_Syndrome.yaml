definitions:
- name: Clinical ACC/TTLD spectrum definition
  definition_type: OTHER
  scope: Individuals with aplasia cutis congenita and/or terminal transverse limb defects
  description: >-
    AOS denotes the clinical spectrum centered on the combination of scalp
    aplasia cutis congenita and terminal transverse limb defects. Marked
    intrafamilial variability and clinically overlapping ACC/TTLD presentations
    mean that this is a spectrum definition, not a sensitivity- or
    specificity-validated algorithm.
  evidence:
  - reference: PMID:19610107
    reference_title: The spectra of clinical phenotypes in aplasia cutis congenita and terminal transverse limb defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of aplasia cutis congenita (ACC) and terminal transverse limb defects (TTLD) is often referred to as the eponymous Adams-Oliver syndrome (AOS).
    explanation: The clinical-spectrum study directly supports the core ACC/TTLD disease boundary.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Adams-Oliver syndrome (AOS) is characterized by aplasia cutis congenita (ACC) of the scalp and terminal transverse limb defects (TTLD).
    explanation: The archived GeneReviews chapter independently states the clinical core; it is tagged as a retired historical baseline rather than a current guideline.

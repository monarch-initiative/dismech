    evidence_source: MODEL_ORGANISM
    snippet: "Similar to the clinical syndrome, 32% of SHF-specific Dll4 heterozygotes demonstrate foreshortened and misaligned OFT, resulting in a double outlet right ventricle."
    explanation: Mouse model providing molecular mechanism for cardiac defects in DLL4-related AOS.
- name: VCP-Associated AOS
  gene_term:
    preferred_term: VCP
    term:
      id: hgnc:12666
      label: VCP
  association: CAUSAL
  relationship_type: CAUSATIVE
  subtype: VCP-Associated AOS
  features: >-
    Reported AOS-associated VCP substitution variants are hypermorphic for ATP
    hydrolysis and cause N-terminal-domain hyperflexibility with impaired
    interdomain coupling. The discovery series included six families with
    pulmonary hypertension and one without, but does not establish penetrance
    or age of onset in each family. The available primary abstract does not
    establish inheritance, variant origin, or a numbered subtype.
  evidence:
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new genetic etiology for AOS in 6 families with PH and 1 family without it.
    explanation: Establishes VCP as an additional AOS genetic cause and bounds the pulmonary-hypertension association.
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that AOS-related VCP variants are hypermorphic with respect to ATP hydrolysis and cause N-terminal domain hyperflexibility with impairment of interdomain coupling.
    explanation: Defines the experimentally observed biochemical and structural effects.
treatments:
- name: Individualized Conservative Care for Scalp Aplasia
  action_category: THERAPEUTIC
  description: >-
    Conservative management is one option for scalp aplasia, but published AOS
    evidence does not establish a universal dressing protocol or size threshold.
    Selection must balance hemorrhage, infection, neurologic, and procedural
    risks for the individual defect.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22670005
    reference_title: Two different management modalities in a two sibling case report of Adams Oliver syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Various papers have been published related to ACC, yet there is no consensus on the therapeutic approach. The management decision hinges upon balancing the risks of complications including spontaneous sagittal sinus haemorrhage and the risk of surgical intervention.
    explanation: Supports individualized choice while documenting the low-level evidence and absence of consensus.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Goals of non-operative therapy are to prevent infection and promote healing.
    explanation: The archived GeneReviews chapter supplies the historical goals of conservative scalp-ACC care; its retired status precludes treating details as a current universal protocol.
- name: Surgical Closure or Reconstruction of Scalp Aplasia
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  description: >-
    Surgical closure or later reconstruction is an alternative for selected
    scalp defects. Evidence is limited to case-based experience, and the same
    absence of consensus requires individualized risk assessment rather than a
    universal threshold.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:22670005
    reference_title: Two different management modalities in a two sibling case report of Adams Oliver syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both treatment modalities proved successful in these cases.
    explanation: Two siblings were managed with different conservative/surgical strategies; this does not establish comparative efficacy.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Large and/or deep lesions with calvarial involvement require acute care and may eventually also require reconstruction by a neurosurgeon.
    explanation: The archived GeneReviews chapter supports historical specialist reconstruction practice while remaining explicitly retired and potentially outdated.
- name: Coordinated Multidisciplinary Assessment
  action_category: MONITORING
  description: >-
    Coordinate phenotype- and genotype-directed assessment across dermatology,
    clinical genetics, cardiology, vascular/pulmonary medicine, neurology,
    ophthalmology, developmental services, and relevant surgical specialties.
    Published evidence supports an adjusted multidisciplinary approach but not
    universal fixed surveillance intervals.
  treatment_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31654484
    reference_title: Expanding the phenotype in Adams-Oliver syndrome correlating with the genotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It appears that degrees of genotype-phenotype correlations exist for patients with identified pathogenic mutations, underlining the need to undertake a systematic but adjusted multidisciplinary assessment.
    explanation: Supports systematic but individualized assessment rather than a uniform schedule.
  - reference: PMID:40874655
    reference_title: "Cutaneous Features of Adams-Oliver Syndrome: Diagnosis, Differentiation, and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that skin findings are often the earliest and most recognizable signs of AOS, dermatologists play an important role in early diagnosis, enabling prompt genetic evaluation and coordinated multidisciplinary care.
    explanation: Supports coordinated care and early genetics involvement.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Cardiovascular. Echocardiography annually until age three years for signs of pulmonary hypertension. Neurologic. Annual pediatric care, including neurologic examination and ongoing assessment of psychomotor development. Ocular. Annual assessment by pediatric ophthalmologist until age three years for evidence of abnormal retinal vascular development.
    explanation: The archived chapter documents a historical surveillance schedule, but because it was retired as outdated this entry retains individualized current assessment rather than adopting those intervals as a universal recommendation.
- name: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Genetic counseling for families with AOS to discuss inheritance patterns,
    recurrence implications, and molecular testing. For established dominant
    forms, each child of an affected heterozygous individual has a 50% chance of
    inheriting the variant; for established recessive forms, each sibling of an
    affected individual has a 25% chance of being affected when both parents are
    carriers. Counseling should not assign VCP inheritance from the currently
    available abstract.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29924900
    reference_title: Elucidating the genetic architecture of Adams-Oliver syndrome in a large European cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant forms of AOS are linked to mutations in ARHGAP31, DLL4, NOTCH1 or RBPJ, while DOCK6 and EOGT underlie autosomal recessive inheritance.
    explanation: The heterogeneous inheritance architecture is directly relevant to family counseling.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with autosomal dominant AOS has a 50% chance of inheriting the pathogenic variant.
    explanation: The archived GeneReviews chapter provides the recurrence-risk figure for established dominant AOS; it does not apply this risk to the newly reported VCP-associated form.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: The archived GeneReviews chapter provides the sibling recurrence risks for established DOCK6- and EOGT-related recessive AOS.
diagnosis:
- name: Clinical Assessment of the ACC/TTLD Spectrum
  description: >-
    Clinical assessment establishes whether the congenital presentation lies
    within the AOS spectrum centered on scalp aplasia cutis and terminal
    transverse limb defects, while documenting cardiac, vascular, neurologic,
    ocular, and skull involvement. An archived, retired GeneReviews chapter
    described diagnosis from both core findings, one core finding plus an
    affected first-degree relative, or one core finding plus molecular
    confirmation. Because that chapter is historical and reports no validation
    metrics, these routes are not presented as a sensitivity- or
    specificity-validated current algorithm.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: A compatible congenital ACC/TTLD pattern supports a clinical AOS diagnosis and guides subtype testing.
  evidence:
  - reference: PMID:19610107
    reference_title: The spectra of clinical phenotypes in aplasia cutis congenita and terminal transverse limb defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of aplasia cutis congenita (ACC) and terminal transverse limb defects (TTLD) is often referred to as the eponymous Adams-Oliver syndrome (AOS).
    explanation: Supports the core clinical disease boundary.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of AOS can be established in a proband with one of the following: Clinical findings of ACC of the scalp and TTLD. ACC or TTLD and a first-degree relative with findings consistent with AOS.
    explanation: The archived GeneReviews chapter supplies the historical diagnostic routes while its retired status and absence of validation metrics are retained explicitly.
- name: Molecular Genetic Testing
  description: >-
    Sequence analysis of established AOS genes can identify an etiologic
    subtype. A 2018 mixed AOS/isolated-ACC/TTLD cohort received a
    molecular diagnosis in 30% of cases before VCP was discovered; that
    cohort-specific yield must not be treated as disease prevalence or as a
    current sensitivity estimate.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: A pathogenic variant in an established AOS gene supports molecular subtype assignment; a negative result does not erase the clinical ACC/TTLD phenotype.
  evidence:
  - reference: PMID:29924900
    reference_title: Elucidating the genetic architecture of Adams-Oliver syndrome in a large European cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular diagnostic screening of 194 AOS/ACC/TTLD probands/families was conducted using next-generation and/or capillary sequencing analyses. In total, we identified 63 (likely) pathogenic mutations, comprising 56 distinct and 22 novel mutations, providing a molecular diagnosis in 30% of patients.
    explanation: Provides the bounded historical molecular-yield estimate.
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new genetic etiology for AOS in 6 families with PH and 1 family without it.
    explanation: Supports inclusion of VCP among current AOS testing considerations without assigning inheritance.
  - reference: PMID:27077170
    reference_title: "Adams-Oliver Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ACC or TTLD and either a pathogenic variant in an autosomal dominant AOS-related gene (ARHGAP31, DLL4, NOTCH1, or RBPJ) or two pathogenic variants in an autosomal recessive AOS-related gene (DOCK6 or EOGT).
    explanation: The archived GeneReviews chapter supports molecular confirmation for the six established historical gene subtypes; VCP is added separately from the 2026 primary report.
differential_diagnoses:
- name: Aplasia cutis-enamel dysplasia syndrome
  description: >-
    The FOSL2-related disorder overlaps AOS through localized scalp aplasia cutis
    with or without skull defects. Its reported combination of enamel
    hypoplasia, neurodevelopmental delay or autism, congenital cataracts, and
    prenatal growth restriction distinguishes it from the classic AOS
    ACC/terminal-limb pattern.
  distinguishing_features:
  - Enamel hypoplasia with neurodevelopmental delay or autism favors the FOSL2-related disorder.
  - Congenital cataracts and prenatal growth restriction were recurrent in the reported FOSL2 series.
  - A pathogenic last-exon truncating FOSL2 variant supports this differential; FOSL2 is not modeled as an AOS gene.
  disease_term:
    preferred_term: aplasia cutis-enamel dysplasia syndrome
    term:
      id: MONDO:0968978
      label: aplasia cutis-enamel dysplasia syndrome
  evidence:
  - reference: PMID:36197437
    reference_title: FOSL2 truncating variants in the last exon cause a neurodevelopmental disorder with scalp and enamel defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 11 individuals from 10 families with mostly de novo truncating FOSL2 variants sharing a strikingly similar phenotype characterized by prenatal growth retardation, localized cutis scalp aplasia with or without skull defects, neurodevelopmental delay with autism spectrum disorder, enamel hypoplasia, and congenital cataracts.
    explanation: Directly supports both the scalp overlap and the distinguishing phenotype constellation.
animal_models:
- species: Mouse (Mus musculus)
  genotype: AOS-associated Rbpj missense allele with Notch1 heterozygosity and endothelial conditional expression
  background: Notch1-sensitized genetic background
  genes:
  - preferred_term: RBPJ
    term:
      id: hgnc:5724
      label: RBPJ
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  category: Genetically engineered mouse model
  associated_phenotypes:
  - Increased lethality
  - Cardiovascular defects
  description: >-
    The AOS-associated Rbpj allele produces dominant phenotypes on a Notch1
    heterozygous background. Endothelial expression is necessary and sufficient
    for lethality and cardiovascular defects in this model. The sensitized
    background and cardiovascular endpoint limit extrapolation to the complete
    human scalp/limb phenotype.
  evidence:
  - reference: PMID:41055965
    reference_title: Defective Notch1 signaling in endothelial cells drives pathogenesis in a mouse model of Adams-Oliver syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with this idea, mice carrying an AOS-associated Rbpj allele develop dominant phenotypes that include increased lethality and cardiovascular defects in a Notch1 heterozygous background, whereas Notch1 and Rbpj compound heterozygous null alleles are well tolerated.
    explanation: Defines the sensitized genotype and its phenotype.
- species: Mouse (Mus musculus)
  genotype: Second-heart-field-specific Dll4 heterozygosity or knockout
  genes:
  - preferred_term: DLL4
    term:

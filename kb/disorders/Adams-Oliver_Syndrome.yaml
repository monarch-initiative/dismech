    reference_title: Elucidating the genetic architecture of Adams-Oliver syndrome in a large European cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant forms of AOS are linked to mutations in ARHGAP31, DLL4, NOTCH1 or RBPJ, while DOCK6 and EOGT underlie autosomal recessive inheritance.
    explanation: Defines the established autosomal-dominant AOS genes in the pre-VCP cohort.

- name: VCP-Associated AOS
  display_name: VCP-associated Adams-Oliver syndrome
  genes:
  - preferred_term: VCP
    term:
      id: hgnc:12666
      label: VCP
  description: >-
    Newly reported AOS caused by hypermorphic VCP variants. The discovery series
    included six families with pulmonary hypertension and one without; it does
    not establish penetrance or the age of pulmonary-hypertension onset in each
    family. This entry does not assign a numbered AOS subtype or mode of
    inheritance because the available primary abstract does not establish either.
  evidence:
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a new genetic etiology for AOS in 6 families with PH and 1 family without it.
    explanation: Establishes VCP as an additional AOS genetic cause and bounds the observed pulmonary-hypertension association in the discovery series.
mechanistic_hypotheses:
- hypothesis_group_id: aos_notch_vascular_disruption
  hypothesis_label: Notch-pathway vascular disruption model
  status: ALTERNATIVE
  applies_to_subtypes:
  - AOS3
  - AOS4
  - AOS5
  - AOS6
  description: >-
    Reduced canonical Notch output in vascular endothelium can account for
    cardiovascular defects in AOS models. Extension of that model to the human
    scalp and limb defects remains a vascular-disruption hypothesis rather than
    a demonstrated human causal chain.
  evidence:
  - reference: PMID:41055965
    reference_title: Defective Notch1 signaling in endothelial cells drives pathogenesis in a mouse model of Adams-Oliver syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data establish that reduced Notch1 signaling in the vasculature is a key driver of pathogenesis in this AOS mouse model.
    explanation: Supports the endothelial mechanism within the sensitized RBPJ/Notch1 mouse model.
  - reference: PMID:25132448
    reference_title: Mutations in NOTCH1 cause Adams-Oliver syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that the limb and scalp defects might also be due to a vasculopathy in NOTCH1-related AOS.
    explanation: Explicitly frames the human scalp/limb vascular route as a proposal.
- hypothesis_group_id: aos_rho_cytoskeletal_development
  hypothesis_label: Rho-GTPase cytoskeletal-development model
  status: CANONICAL
  applies_to_subtypes:
  - AOS1
  - AOS2
  description: >-
    Opposite biochemical lesions in ARHGAP31 and DOCK6 perturb CDC42 and/or
    RAC1 signaling and disturb actin organization. The intervening
    developmental events connecting those cellular defects to human scalp and
    terminal-limb malformations remain incompletely mapped.
  evidence:
  - reference: PMID:21565291
    reference_title: "Gain-of-function mutations of ARHGAP31, a Cdc42/Rac1 GTPase regulator, cause syndromic cutis aplasia and limb anomalies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Constitutively active ARHGAP31 mutations result in a loss of available active Cdc42 and consequently disrupt actin cytoskeletal structures.
    explanation: Defines the proximal ARHGAP31-to-Rho-GTPase cytoskeletal mechanism.
  - reference: PMID:21820096
    reference_title: "Recessive mutations in DOCK6, encoding the guanidine nucleotide exchange factor DOCK6, lead to abnormal actin cytoskeleton organization and Adams-Oliver syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with the established role of Cdc42 and Rac1 in the organization of the actin cytoskeleton, we demonstrate a cellular phenotype typical of a defective actin cytoskeleton in patient cells.
    explanation: Supports cytoskeletal dysfunction in DOCK6-deficient patient cells.
- hypothesis_group_id: aos_vcp_developmental_bridge
  hypothesis_label: VCP developmental and pulmonary-vascular bridge
  status: EMERGING
  applies_to_subtypes:
  - VCP-Associated AOS
  description: >-
    AOS-associated VCP variants increase ATP hydrolysis and alter conformational
    coupling, but the developmental route to scalp and limb defects and the
    route to pulmonary veno-occlusive disease or other forms of pulmonary
    hypertension are not yet established.
  evidence:
  - reference: PMID:41979051
    reference_title: Mutations in VCP cause Adams-Oliver syndrome with or without pulmonary hypertension.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that AOS-related VCP variants are hypermorphic with respect to ATP hydrolysis and cause N-terminal domain hyperflexibility with impairment of interdomain coupling.
    explanation: Establishes the proximal VCP biochemical effect while leaving the developmental bridge unresolved.
pathophysiology:

name: Adams-Oliver Syndrome
creation_date: '2026-04-22T00:00:00Z'
category: Genetic
synonyms:
- AOS
- Aplasia cutis congenita with terminal transverse limb defects
description: >
  Adams-Oliver syndrome (AOS) is a genetically heterogeneous congenital
  developmental disorder defined clinically by scalp aplasia cutis congenita
  and terminal transverse limb defects, with variable cardiac, vascular,
  neurologic, ocular, and skull involvement. Established causes include
  autosomal-dominant ARHGAP31, RBPJ, NOTCH1, and DLL4 variants and
  autosomal-recessive DOCK6 and EOGT variants. Hypermorphic VCP variants are a
  newly reported additional cause; the ascertainment-enriched discovery series
  included six families with pulmonary hypertension and one without. The known molecular mechanisms form at
  least three branches: impaired canonical Notch signaling, CDC42 and/or RAC1
  dysregulation with cytoskeletal dysfunction, and altered VCP
  ATPase/conformational coupling. How these branches produce the shared scalp
  and limb pattern is not fully resolved.

    reference_title: "Triple repeated fetal congenital heart disease linked to PLD1 mutation: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "fetal ultrasonography at 11 weeks and 5 days of gestation showed mild fetal hydrops and moderate tricuspid valve regurgitation"
    explanation: Prenatal imaging making the cardiac diagnosis in an affected fetus.
- name: Exome sequencing
  description: >-
    The diagnosis is molecular. Exome sequencing identified the gene in the original
    families and remains how biallelic PLD1 genotypes are found; note that a
    pathogenic second allele may be deep intronic and so missed by a pipeline that
    filters non-canonical splice variants, which in one family required transcript
    studies to resolve.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:27799408
    reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome analysis was used to identify the mutations in five patients who suffered from severe valvular malformations involving the pulmonic, tricuspid and mitral valves."
    explanation: The method that identified the causal gene.
treatments:
- name: Cardiac valve surgery
  description: >-
    Surgical repair or replacement of the dysplastic right-sided valves, and staged
    palliation where the right ventricle is hypoplastic. Reoperation is expected: one
    reported patient had three open-heart operations by the age of 16.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac valve procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:42591229
    reference_title: "Novel compound heterozygous variants in the PLD1 gene causing cardiac valve dysplasia 1 complicated with dilated cardiomyopathy: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a history of cardiac valve disease for more than 17 years and three open-heart surgeries"
    explanation: Documents the surgical burden in a patient with this disorder.
- name: Heart failure management and transplantation assessment
  description: >-
    Where cardiomyopathy supervenes, standard heart-failure care applies, with
    transplantation assessment for end-stage disease. The relevant management point
    from the mechanism is that cardiomyopathy can occur in isolation, so a normal
    valve study does not exclude myocardial disease in a PLD1 biallelic carrier.

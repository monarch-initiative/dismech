      label: Autosomal recessive inheritance
  description: >-
    Biallelic PLD1 genotypes - homozygous and compound heterozygous - across 21
    unrelated families of different ancestries, with heterozygous parents unaffected.
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 30 patients from 21 unrelated families of different ancestries with biallelic phospholipase D1 (PLD1) variants who presented predominantly with congenital cardiac valve defects"
    explanation: Biallelic genotypes across 21 unrelated families establish recessive inheritance.
  - reference: CGGV:assertion_d37e1c81-cb59-45db-9481-338149fa5064-2024-12-02T170000.000Z
    reference_title: PLD1 / PLD1-related congenital heart disease (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PLD1 | HGNC:9067 | PLD1-related congenital heart disease | MONDO:1010144 | AR | Definitive | SOP11 | Congenital Heart Disease Gene Curation Expert Panel"
    explanation: ClinGen records the inheritance pattern as autosomal recessive in its Definitive validity assertion.
pathophysiology:
- name: PLD1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous PLD1 variants - missense, nonsense, frameshift
    and splice - reduce phospholipase D1 activity. The missense alleles are
    concentrated in the regions encoding the catalytic core, and most of the mutant
    proteins show strongly reduced activity in a direct enzymatic assay, so this is a
    loss of catalytic function rather than a dominant-negative or gain-of-function
    mechanism.
  genes:
  - preferred_term: PLD1
    term:
      id: hgnc:9067
      label: PLD1
  molecular_functions:
  - preferred_term: phospholipase D1 catalytic activity
    term:
      id: GO:0004630
      label: D-type glycerophospholipase activity
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Depleted Phosphatidic Acid Signalling
    causal_link_type: DIRECT
    description: >-
      Phospholipase D1 is the enzyme that makes phosphatidic acid from
      phosphatidylcholine, so losing its catalytic activity removes the second
      messenger directly.
    evidence:
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recessive variants in PLD1, which encodes phospholipase D1, a signal transduction enzyme that hydrolyses the membrane lipid phosphatidylcholine to generate the lipid second messenger phosphatidic acid"
      explanation: States the enzymatic step this edge asserts, and that the disease variants are recessive variants in that enzyme.
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "PLD1 missense variants were overrepresented in regions of the protein critical for catalytic activity, and, correspondingly, we observed a strong reduction in enzymatic activity for most of the mutant proteins in an enzymatic assay."
    explanation: Direct enzymatic evidence that the disease alleles reduce catalytic activity.
  - reference: PMID:27799408
    reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "the p.His442Pro mutation produced a strong loss of function phenotype in yeast homologous mutant strain"
    explanation: Independent loss-of-function evidence for a disease allele in a heterologous assay.
  - reference: PMID:32198492
    reference_title: "Crystal structure of human PLD1 provides insight into activation by PI(4,5)P(2) and RhoA."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The C terminus folds into and contributes part of the catalytic pocket, which harbors a phosphohistidine that mimics an intermediate stage of the catalytic cycle."
    explanation: >-
      Structural account of the catalytic pocket, which is why missense alleles
      clustered in the regions encoding it abolish activity. Graded INDIRECT because
      the structure is of wild-type PLD1 and says nothing about the disease variants
      directly - it supplies the reason their position matters.
- name: Depleted Phosphatidic Acid Signalling
  biological_scale: MOLECULAR
  description: >-
    Loss of phospholipase D1 activity depletes phosphatidic acid, the lipid second
    messenger the enzyme generates. Phosphatidic acid is the node through which the
    defect reaches morphogenetic signalling, and the founding cohort reads the
    downstream arterial pole defects as a consequence of reduced TGF-beta and
    hedgehog signalling.
  biological_processes:
  - preferred_term: phosphatidic acid biosynthetic process
    term:
      id: GO:0006654
      label: phosphatidic acid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:41173720
    reference_title: "Phosphatidic acid at the crossroads of membrane dynamics: from molecular specificity to synthetic innovation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the primacy of PLD1-derived PA in vivo"
    explanation: >-
      This node assumes losing PLD1 actually depletes the phosphatidic acid pool
      rather than being compensated by another source; the review states that
      PLD1-derived PA is the dominant one in vivo. Graded INDIRECT and
      REVIEW_SYNTHESIS because it is the review's synthesis of others' work, not a
      measurement in cardiac tissue.
  downstream:
  - target: Attenuated TGF-beta and Hedgehog Signalling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, a reduction in TGF-β and SSh signaling resulting from loss-of-function PLD1 variants might underlie the arterial pole defects seen in affected patients."
      explanation: >-
        The authors' own reading of the signalling consequence of the loss-of-function
        variants. Graded INDIRECT because the sentence is hedged ("might underlie")
        and the signalling reduction is inferred from the developmental phenotype
        rather than measured in patient tissue.
  - target: Impaired Cardiac Endothelial-to-Mesenchymal Transition
    causal_link_type: DIRECT
    description: >-
      Pharmacological PLD1 inhibition, which removes the same enzymatic product,
      reduces endothelial-to-mesenchymal transition.
    evidence:
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Finally, we demonstrate that PLD1 inhibition decreased endothelial-mesenchymal transition, an established pivotal early step in valvulogenesis."
      explanation: The experiment that connects loss of PLD1 activity to the cellular transition this edge targets.
- name: Attenuated TGF-beta and Hedgehog Signalling
  biological_scale: MOLECULAR
  description: >-
    Reduced TGF-beta and sonic hedgehog signalling downstream of phosphatidic acid
    depletion. The founding cohort invokes this specifically for the arterial pole
    defects, noting that inhibiting hedgehog signalling at the corresponding
    developmental stage produces pulmonary atresia.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  downstream:
  - target: Impaired Cardiac Endothelial-to-Mesenchymal Transition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhibition of Shh signaling at this developmental stage leads to pulmonary atresia."
    explanation: >-
      The developmental-biology premise the cohort uses to connect reduced hedgehog
      signalling to the arterial pole lesions seen in these patients.
- name: Impaired Cardiac Endothelial-to-Mesenchymal Transition
  biological_scale: CELLULAR
  description: >-
    Endocardial cells fail to undergo the endothelial-to-mesenchymal transition that
    populates the endocardial cushions. This is the step PLD1 inhibition was shown to
    reduce, and it is the point at which a lipid signalling defect becomes a
    morphogenetic one.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  - preferred_term: endocardial cushion cell
    term:
      id: CL:0008022
      label: endocardial cushion cell
  biological_processes:
  - preferred_term: cardiac endothelial to mesenchymal transition
    term:
      id: GO:0140074
      label: cardiac endothelial to mesenchymal transition
    modifier: DECREASED
  downstream:
  - target: Deficient Endocardial Cushion Remodelling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: "In the endocardial cushions, EndoMT provides the mesenchymal cells and remodeled matrix essential for the formation of both left and right heart structures"
      explanation: >-
        States the dependency this edge asserts - cushion mesenchyme and matrix are
        supplied by the transition, so losing it starves cushion remodelling.
    - reference: PMID:42600378
      reference_title: "The regulation of endothelial-to-mesenchymal transition in endocardial cushion development: Signaling pathways and transcription factors."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The development and maturation of the endocardial cushion rely on endothelial-to-mesenchymal transition (EndMT), a process by which endocardial cells undergo morphological remodeling and develop into the endocardial cushion mesenchyme."
      explanation: >-
        Independent statement of the dependency, from the developmental-biology
        literature rather than from the PLD1 cohort that proposed it.
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Finally, we demonstrate that PLD1 inhibition decreased endothelial-mesenchymal transition, an established pivotal early step in valvulogenesis."
    explanation: Experimental demonstration that losing PLD1 activity reduces this transition.
- name: Deficient Endocardial Cushion Remodelling
  biological_scale: TISSUE
  description: >-
    Without sufficient cushion mesenchyme and remodelled matrix, the inflow cushions
    that become the tricuspid and mitral valves and the outflow cushions that become
    the arterial valves fail to form normal leaflets. PLD1 expression in the
    developing chick heart narrows to exactly these sites - adjacent to the
    atrioventricular valves and the right ventricular outflow tract - as development
    proceeds.
  cell_types:
  - preferred_term: mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: endocardial cushion morphogenesis
    term:
      id: GO:0003203
      label: endocardial cushion morphogenesis
    modifier: DECREASED
  - preferred_term: heart valve morphogenesis
    term:
      id: GO:0003179
      label: heart valve morphogenesis
    modifier: DECREASED
  downstream:
  - target: Right-Sided Valve Dysplasia
    causal_link_type: DIRECT
  - target: Right Ventricular and Pulmonary Arterial Hypoplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Downstream chamber and great-artery hypoplasia follows the obstructed or
      dysplastic right-sided valve rather than being a separate primary defect.
  evidence:
  - reference: PMID:42600378
    reference_title: "The regulation of endothelial-to-mesenchymal transition in endocardial cushion development: Signaling pathways and transcription factors."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Improper morphogenesis of the endocardial cushion leads to septal and valvular abnormalities, which contribute to the largest proportion of congenital heart diseases (CHDs)."
    explanation: >-
      Establishes that failed cushion morphogenesis is a route to valvular congenital
      heart disease generally, which is the step this node occupies.
  - reference: PMID:27799408
    reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Thereafter its expression decreases, remaining only adjacent to the atrioventricular valves and the right ventricular outflow tract."
    explanation: >-
      The chick expression pattern localises PLD1 to the structures that are
      malformed, which is the spatial argument that this is where the defect acts.
- name: Right-Sided Valve Dysplasia
  biological_scale: TISSUE
  description: >-
    Dysplastic, thickened or atretic tricuspid and pulmonary valves, with the
    tricuspid lesion frequently taking the form of Ebstein's anomaly. The mitral valve
    is involved in a minority. This right-sided predominance is the defining feature
    of the entity and distinguishes it from the other genetically defined cardiac
    valvular dysplasias.
  downstream:
  - target: Abnormal tricuspid valve morphology
    causal_link_type: DIRECT
  - target: Abnormal pulmonary valve morphology
    causal_link_type: DIRECT
  - target: Ebstein anomaly of the tricuspid valve
    causal_link_type: DIRECT
  - target: Pulmonary valve atresia
    causal_link_type: DIRECT
  - target: Tricuspid atresia
    causal_link_type: DIRECT
  - target: Tricuspid regurgitation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39553471
    reference_title: Prenatal detection of novel compound heterozygous variants of the PLD1 gene in a fetus with congenital heart disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with autosomal-recessive variants of PLD1 are predisposed to Cardiac Valvular Dysplasia-1 (CVDP1), which predominantly affects the right-sided heart valves, including the pulmonic, tricuspid, and mitral valves."
    explanation: States the valve distribution this node asserts, including the minority mitral involvement.
- name: Right Ventricular and Pulmonary Arterial Hypoplasia
  biological_scale: TISSUE
  description: >-
    Hypoplastic right ventricle and hypoplastic pulmonary arteries, present in roughly
    half and over a third of phenotyped patients respectively. In the most severe
    hearts the right ventricular wall is extremely thin.
  downstream:
  - target: Hypoplastic right ventricle
    causal_link_type: DIRECT
  - target: Pulmonary artery hypoplasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These defects were characterized by severe tricuspid and/or pulmonary valve abnormalities (27 of 28), hypoplastic right ventricles (16 of 28), and/or hypoplastic pulmonary arteries (11 of 28)"
    explanation: Cohort counts for both lesions this node covers.
- name: Myocardial Dysfunction
  biological_scale: TISSUE
  description: >-
    Cardiomyopathy in PLD1 disease is recorded in two forms that must be kept apart.
    The delineating cohort associated recessive PLD1 variants with isolated neonatal
    cardiomyopathy - that is, cardiomyopathy without an accompanying structural valve
    defect - which is why this node is not drawn as a consequence of the valve lesion.
    Separately, dilated cardiomyopathy with left ventricular enlargement has been
    reported in older patients who also carry the valve disease, where a contribution
    from chronic valvular loading cannot be separated from a primary myocardial
    effect.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Dilated cardiomyopathy
    causal_link_type: DIRECT
  - target: Left ventricular dilatation
    causal_link_type: DIRECT
  - target: Mitral regurgitation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The intermediate is ventricular dilation, which dilates the mitral annulus and
      produces functional regurgitation; the two are reported together.
    evidence:
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "ents had dilated left ventricles and mitral regurgitation in addition to tricuspid and/or pulmonary valve defects"
      explanation: >-
        Reports the dilation and the regurgitation in the same patients. Graded
        INDIRECT because co-occurrence is not a demonstration that the dilation caused
        the regurgitation.
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also associated recessive PLD1 variants with isolated neonatal cardiomyopathy."
    explanation: >-
      The claim that the cardiomyopathy occurs in isolation, which is what makes it a
      parallel consequence of the gene defect rather than a sequela of the valve
      lesion.
  - reference: PMID:42591229
    reference_title: "Novel compound heterozygous variants in the PLD1 gene causing cardiac valve dysplasia 1 complicated with dilated cardiomyopathy: a case report."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "PLD1 gene variants are postnatally associated with pulmonary stenosis, valvular regurgitation, left ventricular dilation and right ventricular hypoplasia."
    explanation: Independent report placing left ventricular dilation in the postnatal PLD1 phenotype.
- name: Fetal Cardiac Decompensation
  biological_scale: ORGANISM
  description: >-
    The severe end of the spectrum presents before birth. Hydrops fetalis occurs
    secondary to cardiac failure, and intrauterine death and termination for a complex
    defect with poor prognosis are both documented, including recurrently within one
    family. The liveborn phenotype is therefore a survivorship-filtered view of the
    disorder.
  downstream:
  - target: Hydrops fetalis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A fetal ultrasound revealed hydrops fetalis due to severe cardiomyopathy, and an emergency delivery by caesarean section was performed."
    explanation: Documents hydrops arising from the cardiac disease in an affected fetus.
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six pregnancies were terminated because of a complex heart defect with poor prognosis"
    explanation: The ascertainment loss behind reading the liveborn cohort as survivorship-filtered.
phenotypes:
- name: Abnormal tricuspid valve morphology
  category: Cardiovascular
  description: >-
    Dysplastic tricuspid valve, with thickened or displaced leaflets. Counted together
    with pulmonary valve abnormalities in the delineating cohort, where the combined
    lesion was present in 27 of 28 phenotyped patients.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Abnormal tricuspid valve morphology
    term:
      id: HP:0001702
      label: Abnormal tricuspid valve morphology
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These defects were characterized by severe tricuspid and/or pulmonary valve abnormalities (27 of 28), hypoplastic right ventricles (16 of 28), and/or hypoplastic pulmonary arteries (11 of 28)"
    explanation: >-
      27 of 28 is 96%, which is VERY_FREQUENT. The count is for tricuspid and/or
      pulmonary valve abnormality as a combined category, so it is the same figure on
      both phenotypes rather than a tricuspid-specific one.
- name: Abnormal pulmonary valve morphology
  category: Cardiovascular
  description: >-
    Dysplastic pulmonary valve, reported as narrowing with thickened leaflets in the
    knockout mouse and as pulmonary stenosis postnatally in patients.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Abnormal pulmonary valve morphology
    term:
      id: HP:0001641
      label: Abnormal pulmonary valve morphology
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These defects were characterized by severe tricuspid and/or pulmonary valve abnormalities (27 of 28), hypoplastic right ventricles (16 of 28), and/or hypoplastic pulmonary arteries (11 of 28)"
    explanation: The same combined 27 of 28 count; see the note on the tricuspid phenotype.

notes: >-
  No GeneReviews chapter names this disease. `just check-genereviews --online` over
  this entry's name, its five synonyms and its disease_term returns NO_CHAPTER
  against the committed Bookshelf index (snapshot 2026-09-10, 958 chapters) and
  against a live PubMed `genereviews[book]` title search, so the mandatory phenotype
  baseline is unavailable and the cohort reports are the baseline instead. The
  phenotype frequencies here are therefore the delineating cohort's own counts out of
  28 phenotyped patients rather than an expert-curated summary.

  No `datasets:` block, and the omission is deliberate rather than unsearched.
  `just discover-datasets Cardiac_Valvular_Defect_Developmental` returns three
  candidates, all GENE_ONLY matches on PLD1 and all oncology: geo:GSE166004 (PLD1 and
  MMP-13 in bladder cancer, mouse), geo:GSE55724 and geo:GSE55771 (PLD1-E2F1 and a
  PLD1 inhibitor in colon cancer lines). None involves cardiac tissue, valve
  development or this disease. They resolve perfectly and are the gene-only trap the
  dataset-curation guidance describes - a search on a causal gene returns whatever
  that gene is best known for - so all three were rejected on relevance.
prevalence:
- population: Ashkenazi Jewish population
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 40.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    Predicted, not observed. The figure is the homozygote frequency the authors derive
    from the p.Ile668Phe allele frequency of 2.1% in 410 PCA-defined Ashkenazim - 1 in
    2,500, which is 40 per 100,000. Two caveats follow from how it was obtained. It is
    a Hardy-Weinberg projection from an allele frequency measured in a congenital heart
    disease cohort rather than a count of patients in the population, and it covers
    only homozygotes for this one founder allele, so it omits compound heterozygotes
    carrying it with a second rare variant. Against that, fetal loss and termination
    are documented for this disorder, so the number of liveborn affected individuals
    would be lower than the genotype frequency predicts.
  evidence:
  - reference: PMID:40030011
    reference_title: Recessive genetic contribution to congenital heart disease in 5,424 probands.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 410 PCA-defined Ashkenazim in our cohort, the overall allele frequency of p.Ile668Phe was 2.1%, predicting a homozygote frequency of 1 in 2,500."
    explanation: The allele frequency and the derived homozygote frequency this record normalizes.

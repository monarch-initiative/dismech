    explanation: Prenatal imaging making the cardiac diagnosis in an affected fetus.
- name: Carrier screening for the Ashkenazi founder allele
  description: >-
    Proposed, not established. The delineating cohort suggests that carriership
    testing for the PLD1 founder variants could be used in population-based

- name: Fetal Cardiac Decompensation
  biological_scale: ORGANISM
  description: >-
    The severe end of the spectrum presents before birth. Hydrops fetalis occurs
    secondary to cardiac failure, and intrauterine death and termination for a complex
    defect with poor prognosis are both documented, including recurrently within one
    family. The liveborn phenotype is therefore a survivorship-filtered view of the
    disorder.

    Intrauterine death is recorded in this node and its evidence rather than as a
    phenotype: HPO files Stillbirth (HP:0003826) under Clinical modifier and
    Mortality/Aging, not under Phenotypic abnormality, so it sits outside the
    PhenotypeTerm enum and cannot be bound in the phenotypes section.
  downstream:
  - target: Hydrops fetalis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A fetal ultrasound revealed hydrops fetalis due to severe cardiomyopathy, and an emergency delivery by caesarean section was performed."

animal_models:
- name: Pld1 knockout mouse
  species: Mouse
  genotype: PLD1 knockout
  publication: PMID:27799408
  description: >-
    Constitutive PLD1 knockout mice were examined by echocardiography and histology.
    They reproduce the right-sided valve lesion - tricuspid regurgitation with right
    atrial enlargement, and a narrowed pulmonic valve with thickened leaflets - which
    is the human phenotype's defining topography.
  evidence:
  - reference: PMID:27799408
    reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "echocardiography and histological examination of hearts of PLD1 knockout mice"
    explanation: Establishes that this model exists and names how it was characterised.
  modeled_mechanisms:
  - target: Right-Sided Valve Dysplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The knockout reproduces the right-sided distribution and, at histology,
      thickened and narrowed pulmonic leaflets - but the two sources disagree on
      whether it reproduces a structural malformation at all, which is why this is
      partial recapitulation rather than recapitulation.
    limitations: >-
      The delineating cohort states that no overt structural cardiac defects were
      noted in these mice, only impaired valve function on echocardiography, and calls
      the human-versus-mouse difference in severity unexplained. The original report's
      histology does describe narrowed, thickened pulmonic leaflets, so the structural
      claim is contested rather than absent. Either way the mice show nothing like the
      atresia, Ebstein's anomaly, right ventricular hypoplasia or fetal loss that
      dominate the patient series, and a complete null does not model the hypomorphic
      missense alleles most patients carry.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The node is a structural valve malformation, and that lesion is outside what
        the model produces. What the mice reliably show is
        impaired pulmonary and tricuspid valve function on echocardiography, with the
        delineating cohort reporting no overt structural defect; the severe structural
        lesions that define the human disease are absent.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse-versus-human difference in severity is explicitly unexplained in the
        literature, so the gap is not a known quantitative offset that can be
        corrected for when reading the model.
    readouts:
    - name: Tricuspid regurgitation and pulmonic valve leaflet thickening on echocardiography
      target: Right-Sided Valve Dysplasia
      direction: INCREASED
      interpretation: Structural and functional correlate of the human right-sided valve lesion.
      evidence:
      - reference: PMID:27799408
        reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "In hearts of PLD1 knockout mice, we detected marked tricuspid regurgitation, right atrial enlargement, and increased flow velocity, narrowing and thickened leaflets of the pulmonic valve."
        explanation: The echocardiographic and histological measurements behind this readout.
    evidence:
    - reference: PMID:27799408
      reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "In hearts of PLD1 knockout mice, we detected marked tricuspid regurgitation, right atrial enlargement, and increased flow velocity, narrowing and thickened leaflets of the pulmonic valve."
      explanation: Supports treating the knockout as informative for the human valve lesion.
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: REFUTE
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Although no overt structural cardiac defects were noted, mice lacking PLD1 (36) displayed impaired function of the pulmonary and tricuspid valves on echocardiography"
      explanation: >-
        The delineating cohort's reading of the same knockout denies the structural
        phenotype this node asserts, which is what caps the link at partial
        recapitulation. BACKGROUND because the sentence restates the earlier mouse
        work rather than reporting this paper's own result.
- name: Chick embryo PLD1 expression
  species: Chicken
  genotype: Wild type
  publication: PMID:27799408
  description: >-
    In situ hybridisation in the chick embryo localised PLD1 expression to the forming
    heart from E2 to E8, initially throughout the heart and later narrowing to the
    atrioventricular valves and the right ventricular outflow tract. This is an
    expression-mapping model, not a disease model: it supplies the spatial argument
    for where the defect acts, and does not itself produce a phenotype.
  evidence:
  - reference: PMID:27799408
    reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that in chick embryos PLD1 expression is confined to the forming heart (E2-E8) and homogeneously expressed all over the heart during days E2-E3."
    explanation: >-
      Establishes this model as a chick in-situ hybridisation study and states its
      basic result, that PLD1 expression in the embryo is cardiac-restricted. The
      readout below quotes the same sentence for the measurement itself.
  modeled_mechanisms:
  - target: Deficient Endocardial Cushion Remodelling
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: >-
      Maps where the gene is expressed during valvulogenesis, which is the structures
      that are malformed in patients.
    limitations: >-
      Expression is not function - the model shows where PLD1 is transcribed, not that
      cushion remodelling fails without it. It is also a non-mammalian embryo, and the
      authors read the temporal pattern as tracking developmental apoptosis, which is a
      different proposed mechanism from the endothelial-to-mesenchymal transition the
      main chain follows.
    readouts:
    - name: PLD1 transcript distribution in the developing heart
      target: Deficient Endocardial Cushion Remodelling
      interpretation: >-
        Localises the gene to the atrioventricular valves and right ventricular
        outflow tract, the sites of the human lesion.
      evidence:
      - reference: PMID:27799408
        reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we show that in chick embryos PLD1 expression is confined to the forming heart (E2-E8) and homogeneously expressed all over the heart during days E2-E3."
        explanation: The in situ hybridisation result behind this readout.
    evidence:
    - reference: PMID:27799408
      reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Thereafter its expression decreases, remaining only adjacent to the atrioventricular valves and the right ventricular outflow tract."
      explanation: >-
        Supports treating this expression map as informative for where cushion
        remodelling fails. Graded INDIRECT because expression localisation is not a
        measurement of remodelling.
mechanistic_hypotheses:
- hypothesis_group_id: pld1_tgfb_shh_route
  hypothesis_label: Arterial pole defects via attenuated TGF-beta and hedgehog signalling
  status: EMERGING
  description: >-
    The route from depleted phosphatidic acid to the arterial pole lesions, proposed by
    the delineating cohort. It is recorded as a hypothesis group rather than as settled
    main-chain mechanism because the supporting paragraph is hedged throughout and
    assembled from other work: the phosphatidic-acid-to-TGF-beta step is inferred from
    an adult myocardial-infarction study, the hedgehog step from the consequence of
    inhibiting hedgehog at the corresponding developmental stage, and nothing about
    either pathway was measured in this disease. The nodes are kept in the chain
    because the entry's phenotype distribution is otherwise unexplained, but the two
    edges into and out of them carry this group so the epistemic status travels with
    them - the same standard applied to the apoptosis route below.
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In the adult heart, loss of PLD1 can lead to a reduction in TGF-β signaling activity in the context of myocardial infarction"
    explanation: >-
      The only empirical support for the phosphatidic-acid-to-TGF-beta step, and it
      comes from adult myocardial infarction rather than cardiac development - which
      is why this is a hypothesis group and not a settled edge.
- hypothesis_group_id: pld1_apoptosis_route
  hypothesis_label: Loss of developmentally programmed apoptosis in the valve primordia
  status: EMERGING
  description: >-
    An alternative to the endothelial-to-mesenchymal transition account. The original
    report noted that the chick PLD1 expression pattern follows the known dynamic
    patterning of apoptosis in the developing heart, and read this as consistent with
    PLD1's established role in promoting apoptosis - implying the valve defect arises
    because sculpting apoptosis fails rather than because cushion mesenchyme is not
    generated. The two accounts are not exclusive and neither has been tested against
    the other in cardiac tissue; the entry's main chain follows the transition route
    because that is the one with a direct perturbation experiment behind it.
  evidence:
  - reference: PMID:27799408
    reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "This pattern of expression follows the known dynamic patterning of apoptosis in the developing heart, consistent with the known role of PLD1 in the promotion of apoptosis."
    explanation: >-
      The observation and inference behind this hypothesis. Graded INDIRECT because it
      is an argument from a correlation between an expression pattern and a known
      developmental process, with no apoptosis measurement in PLD1-deficient hearts.

discussions:
- discussion_id: pld1_cardiomyopathy_primary_or_loading
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the cardiomyopathy in PLD1 disease a primary myocardial defect, or secondary to
    chronic valvular loading?
  attaches_to:
  - pathophysiology#Myocardial Dysfunction
  rationale: >-
    The two reported forms point in opposite directions. Isolated neonatal
    cardiomyopathy without a structural valve defect argues for a primary myocardial
    requirement for phospholipase D1, which is plausible given that the enzyme is
    highly expressed in the heart and that phosphatidic acid signalling operates in
    cardiomyocytes. But the dilated cardiomyopathy reported in older patients arrives
    after years of valve disease and multiple operations, where loading is an adequate
    explanation on its own. Nothing yet separates the two, and the answer changes
    surveillance: a primary myocardial effect would mean echocardiographic follow-up is
    indicated even in a biallelic carrier whose valves look normal.
  evidence:
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also associated recessive PLD1 variants with isolated neonatal cardiomyopathy."
    explanation: The isolated presentation that makes a primary myocardial defect the live possibility.
  - reference: PMID:42591229
    reference_title: "Novel compound heterozygous variants in the PLD1 gene causing cardiac valve dysplasia 1 complicated with dilated cardiomyopathy: a case report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "with a history of cardiac valve disease for more than 17 years and three open-heart surgeries"
    explanation: >-
      The other side of the gap: this patient's cardiomyopathy follows 17 years of
      valve disease and three operations, so loading is an adequate explanation here.
  proposed_experiments:
  - experiment_id: pld1_cardiomyocyte_specific_loss
    name: Myocardial phenotyping of PLD1-deficient hearts without valve obstruction
    description: >-
      Assess contractile function and chamber dimensions in a model in which PLD1 is
      lost in cardiomyocytes only, leaving valve development intact, so that any
      cardiomyopathy cannot be attributed to altered loading.
    would_support:
    - pathophysiology#Myocardial Dysfunction
    supporting_outcome:
    - >-
      Reduced systolic function and ventricular dilation in the absence of any valve
      lesion or outflow obstruction.
    refuting_outcome:
    - >-
      Normal contractile function and chamber dimensions throughout life when valve
      development is unaffected.
- discussion_id: pld1_right_sided_predominance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is the phenotype right-sided, when phosphatidic acid is required for
    endothelial-to-mesenchymal transition in both the inflow and outflow cushions?
  attaches_to:
  - pathophysiology#Impaired Cardiac Endothelial-to-Mesenchymal Transition
  - pathophysiology#Right-Sided Valve Dysplasia
  rationale: >-
    The mechanism as stated is not side-specific: the cushions supply both left and
    right heart structures, so a general reduction in the transition should damage the
    mitral and aortic valves as much as the tricuspid and pulmonary ones. It does not -
    the mitral valve is involved in a minority, two of 28 phenotyped patients, and
    aortic involvement is reported once. Three candidate explanations are on record and
    none has been tested against the others. The delineating cohort's own is that the
    two sides of the heart present different environments - cell populations,
    extracellular matrix, haemodynamics - so right-sided cells may be less able to
    compensate for the same disruption of EndoMT in the common cushions. The chick
    expression data suggest a simpler one: PLD1 transcription narrows specifically to
    the atrioventricular valves and the right ventricular outflow tract, making this a
    matter of where the gene is expressed. And the hedgehog dependence invoked for the
    arterial pole is itself regionalised. Resolving this would say whether the
    right-sided predominance is a property of the gene's expression domain, of
    differential pathway dependence, or of differential capacity to compensate.

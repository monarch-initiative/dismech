genetic:
- name: PLD1
  gene_term:
    preferred_term: PLD1
    term:
      id: hgnc:9067
      label: PLD1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    Phospholipase D1, at 3q26.31. Biallelic loss-of-function variants are the cause of
    this disorder. Missense alleles are concentrated in the catalytic core and most
    reduce enzymatic activity directly, and nonsense, frameshift and splice alleles
    also occur, so the mechanism is loss of catalytic function. ClinGen's Congenital
    Heart Disease GCEP classifies the relationship Definitive under an autosomal
    recessive model, having reached the maximum genetic-evidence score; the record
    notes that further evidence exists beyond the publications it scored.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d37e1c81-cb59-45db-9481-338149fa5064-2024-12-02T170000.000Z
    evidence:
    - reference: CGGV:assertion_d37e1c81-cb59-45db-9481-338149fa5064-2024-12-02T170000.000Z
      reference_title: PLD1 / PLD1-related congenital heart disease (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PLD1 | HGNC:9067 | PLD1-related congenital heart disease | MONDO:1010144 | AR | Definitive | SOP11 | Congenital Heart Disease Gene Curation Expert Panel"
      explanation: >-
        The ClinGen validity row. Its MONDO term is MONDO:1010144, which this entry
        maps skos:exactMatch, so the assertion is for this entry's disease.
  variants:
  - name: p.Ile668Phe
    description: >-
      Founder missense variant in the Ashkenazi Jewish population, at an allele
      frequency of about 2%. In a separate 5,424-proband congenital heart disease
      exome study, founder variants in GDF1 and PLD1 together accounted for most of
      the recessive-genotype contribution among Ashkenazi Jewish probands.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33645542
      reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "we established that p.I668F is a founder variant among Ashkenazi Jews (allele frequency of ~2%)"
      explanation: Establishes the variant's founder status and allele frequency.
    population_effects:
    - population: Ashkenazi Jewish probands with congenital heart disease
      ancestry_terms:
      - preferred_term: Ashkenazi Jewish
        term:
          id: HANCESTRO:0324
          label: Ashkenazi Jew
      ancestry_basis: GENETICALLY_INFERRED
      effect_differences:
      - ALLELE_FREQUENCY
      cohort_size: 410
      description: >-
        The variant is enriched to founder frequency in this population, so recessive
        PLD1 genotypes account for a disproportionate share of congenital heart
        disease there. Recorded as GENETICALLY_INFERRED rather than self-reported
        because the study defines the group by principal-component analysis of its own
        sequence data ("410 PCA-defined Ashkenazim"), not by reported ethnicity.
      evidence:
      - reference: PMID:40030011
        reference_title: Recessive genetic contribution to congenital heart disease in 5,424 probands.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: HUMAN_CLINICAL
        snippet: "Founder variants in GDF1 and PLD1 accounted for 74% of the contribution of RGs among 410 Ashkenazi Jewish probands."
        explanation: >-
          Quantifies the population-specific contribution in a cohort assembled
          independently of the delineating study.
  - name: p.His442Pro
    description: >-
      Missense variant at a highly conserved site, one of the three alleles in the
      original two-family report. It produced a strong loss-of-function phenotype when
      modelled in the homologous yeast gene.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27799408
      reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "the p.His442Pro mutation produced a strong loss of function phenotype in yeast homologous mutant strain"
      explanation: Functional evidence that this allele is loss of function.
  - name: p.Thr495fs32*
    description: Frameshift variant from the original two-family report.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27799408
      reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three mutations, p.His442Pro, p.Thr495fs32* and c.2882+2T>C, were identified in the PLD1 gene."
      explanation: Reports the allele in patients with severe valvular malformations.
  - name: c.2882+2T>C
    description: Splice donor variant from the original two-family report.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27799408
      reference_title: Congenital valvular defects associated with deleterious mutations in the PLD1 gene.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three mutations, p.His442Pro, p.Thr495fs32* and c.2882+2T>C, were identified in the PLD1 gene."
      explanation: Reports the allele in patients with severe valvular malformations.
  - name: c.1062-59A>G
    description: >-
      Deep intronic variant that would normally be filtered out of a diagnostic
      pipeline. Transcript work on the fetus and mother showed it causes a 76-bp
      intronic insertion and skipping of exon 11, producing a frameshift and premature
      stop - so a non-canonical intronic PLD1 variant can be the second hit.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:39553471
      reference_title: Prenatal detection of novel compound heterozygous variants of the PLD1 gene in a fetus with congenital heart disease.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "RT-PCR and TA clone sequencing revealed a 76-bp intronic insertion and exon 11 skipping in the proband and her mother's transcripts, causing a frameshift and premature stop codon in PLD1."
      explanation: >-
        Transcript-level demonstration of the splicing consequence. Recorded as
        UNCERTAIN_SIGNIFICANCE because the authors classified it VUS under ACMG
        despite this functional result.
  - name: p.Arg158Ter
    description: >-
      Homozygous nonsense variant reported in an adult with cardiac valvular dysplasia
      complicated by dilated cardiomyopathy.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39681445
      reference_title: "[A case of cardiac valvular dysplasia combined with dilated cardiomyopathy caused by a homozygous nonsense variant in PLD1]."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "PLD1基因纯合致病变异c.472C>T（p.Arg158Ter）"
      explanation: >-
        Names the homozygous nonsense allele. The quote is in Chinese because this

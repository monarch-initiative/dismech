name: PLD1-Related Congenital Heart Disease
creation_date: "2026-10-30T00:00:00Z"
description: >-
  PLD1-related congenital heart disease is the autosomal recessive disorder caused by
  biallelic loss-of-function variants in PLD1, which encodes phospholipase D1. The
  enzyme hydrolyses phosphatidylcholine to generate phosphatidic acid, a lipid second
  messenger; the disease alleles cluster in the regions encoding the catalytic core
  and reduce that activity.

  What makes the entity recognisable is where in the heart it lands. The lesions are
  overwhelmingly right-sided - severe tricuspid and pulmonary valve dysplasia, often
  with a hypoplastic right ventricle and hypoplastic pulmonary arteries - and
  Ebstein's anomaly is a recurring diagnosis. That topography follows from the
  mechanism rather than being incidental to it: phosphatidic acid is required for
  cardiac endothelial-to-mesenchymal transition, the step that supplies the
  mesenchyme and remodelled matrix of the endocardial cushions, and pharmacological
  PLD1 inhibition reduces that transition directly. The founding report also places
  the attenuated TGF-beta and hedgehog signalling that follows loss of phosphatidic
  acid behind the arterial pole defects specifically.

  A second presentation is cardiomyopathy, and it is not simply a consequence of the
  valve lesion. The delineating cohort associated recessive PLD1 variants with
  *isolated* neonatal cardiomyopathy, and dilated cardiomyopathy has since been
  reported in older patients alongside their valve disease. The fetal end of the
  spectrum is severe: hydrops fetalis, intrauterine death, and termination for a
  complex defect with poor prognosis all occur, so the liveborn phenotype is a
  survivorship-filtered view of the disorder.

  The nomenclature is the most confusing part of this entry, and the entry is
  deliberately not named after the term it is bound to. The label of MONDO:0008913,
  `cardiac valvular defect, developmental`, describes a condition that occurs without
  PLD1 at all - the X-linked FLNA form and the ADAMTS19 form are two of the other
  genetically defined cardiac valvular dysplasias, and most developmental valve
  disease is neither - so as an entry name it would be broader than the entry.
  Worse, it does not cover this disorder's isolated-cardiomyopathy arm, which the
  delineating cohort reports with no structural valve defect at all. The name used
  here is ClinGen's, which is also the label of MONDO:1010144: ClinGen curates this
  gene-disease relationship as PLD1-related congenital heart disease, and states that
  it lumped cardiac valvular dysplasia 1 and congenital heart disease into a single
  entity after finding no difference in mechanism, inheritance or phenotypic
  variability - which is why MONDO:1010144 is mapped here as an exact match rather
  than as a separate concept. The clinical and genetics literature mostly calls this
  cardiac valvular dysplasia 1 (CVDD1 or CVDP1); that name and the MONDO label are
  both kept in `synonyms`. The file name still follows the MONDO label, because
  dismech has not settled how a slug follows a rename (dismech#15894).
category: Mendelian
synonyms:
- cardiac valvular defect, developmental
- CVDD
- CVDD1
- CVDP1
- cardiac valvular dysplasia 1
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008913
      label: cardiac valvular defect, developmental
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: Primary disease term for this entry.
  - term:
      id: MONDO:1010144
      label: PLD1-related congenital heart disease
    mapping_predicate: skos:exactMatch
    mapping_source: ClinGen
    mapping_justification: >-
      MONDO files the gene-centric ClinGen concept separately from the OMIM-derived
      MONDO:0008913, and neither is an ancestor of the other. They denote one entity:
      ClinGen's own Congenital Heart Disease GCEP record states that it lumped
      cardiac valvular dysplasia 1 and congenital heart disease into a single disease
      entity for PLD1 after finding no difference in molecular mechanism, inheritance
      pattern or phenotypic variability. The exact match is that published lumping
      decision, not an inference from the two labels. Note what MONDO's own placement
      does not cover: MONDO:0008913 sits under `cardiac valvular defect`, so the
      isolated neonatal cardiomyopathy arm - which this entry curates, and which the
      delineating cohort reports in the absence of any structural valve defect - falls
      inside MONDO:1010144 but arguably outside MONDO:0008913's parent. On MONDO's own
      axes 1010144 is therefore the broader class, and the exact match asserts a merge
      MONDO has not itself made.
disease_term:
  preferred_term: cardiac valvular defect, developmental
  term:
    id: MONDO:0008913
    label: cardiac valvular defect, developmental
notes: >-
  No GeneReviews chapter names this disease. `just check-genereviews --online` over
  this entry's name, its five synonyms and its disease_term returns NO_CHAPTER
  against the committed Bookshelf index (snapshot 2026-09-10, 958 chapters) and
  against a live PubMed `genereviews[book]` title search, so the mandatory phenotype
  baseline is unavailable and the cohort reports are the baseline instead. The
  phenotype frequencies here are therefore the delineating cohort's own counts rather
  than an expert-curated summary. The denominator is 28: the patients with a structural
  valve malformation, out of 30 biallelic patients in total, the other two having
  isolated cardiomyopathy. The bands are unchanged on either denominator.

  No dataset in GEO is about this disease. The only PLD1 series indexed there are
  oncology: geo:GSE166004 (PLD1 and MMP-13 in bladder cancer, mouse), geo:GSE55724 and
  geo:GSE55771 (PLD1-E2F1 and a PLD1 inhibitor in colon cancer lines). None involves
  cardiac tissue or valve development, so none is admissible here despite resolving
  cleanly against a search on the causal gene.
prevalence:
- population: Ashkenazi Jewish population
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 40.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    Predicted, not observed. The figure is the homozygote frequency the authors derive
    from the p.Ile668Phe allele frequency of 2.1% in 410 PCA-defined Ashkenazim - 1 in
    2,500, which is 40 per 100,000. Two caveats follow from how it was obtained. It is
    a Hardy-Weinberg projection from an allele frequency measured in a congenital heart
    disease cohort rather than a count of patients in the population, and it covers
    only homozygotes for this one founder allele, so it omits compound heterozygotes
    carrying it with a second rare variant. Against that, fetal loss and termination
    are documented for this disorder, so the number of liveborn affected individuals
    would be lower than the genotype frequency predicts.
  evidence:
  - reference: PMID:40030011
    reference_title: Recessive genetic contribution to congenital heart disease in 5,424 probands.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 410 PCA-defined Ashkenazim in our cohort, the overall allele frequency of p.Ile668Phe was 2.1%, predicting a homozygote frequency of 1 in 2,500."
    explanation: The allele frequency and the derived homozygote frequency this record normalizes.
  - reference: PMID:33645542
    reference_title: Biallelic loss-of-function variants in PLD1 cause congenital right-sided cardiac valve defects and neonatal cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "this variant is estimated to occur homozygously in up to approximately 1 of 2500 births among Ashkenazi Jews"
    explanation: >-
      The same figure reached independently from a population allele frequency rather
      than from an ascertained cohort, which is what keeps the estimate from resting
      only on case-cohort sampling.

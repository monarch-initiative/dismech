- name: Genetic counselling and reproductive options
  description: >-
    Recurrence risk is 25% for a sibling, and recurrent fetal loss within one family is
    documented, so counselling matters disproportionately here. Preimplantation genetic
    testing for monogenic disorders was used by one couple after a variant of uncertain
    significance was resolved by transcript studies, and they had an unaffected child.

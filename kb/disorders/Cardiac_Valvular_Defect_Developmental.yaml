    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography showed left ventricular enlargement, decreased ventricular wall motion amplitude, and mild tricuspid regurgitation."
    explanation: Echocardiography establishing both the valve and myocardial findings in a patient.
- name: Fetal echocardiography and ultrasonography
  description: >-
    Because the severe end of the spectrum presents in utero, prenatal imaging is

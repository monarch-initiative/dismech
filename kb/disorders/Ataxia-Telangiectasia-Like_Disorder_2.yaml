name: Ataxia-Telangiectasia-Like Disorder 2
creation_date: "2026-09-10T00:00:00Z"
category: Mendelian
description: >-
  Ataxia-telangiectasia-like disorder 2, better known in the molecular literature as
  PCNA-associated DNA repair disorder (PARD), is an autosomal recessive syndrome of short
  stature, sensorineural hearing loss, premature aging, cutaneous and conjunctival
  telangiectasia, progressive neurodegeneration with cerebellar atrophy, and cutaneous
  photosensitivity. It is caused by biallelic hypomorphic variants in PCNA, the sliding
  clamp that tethers the enzymes of DNA replication and repair to the template.

  The disorder exists only because the alleles are hypomorphic, and this is not a
  throwaway observation about severity. PCNA is essential; an allele that abolished its
  function would not be compatible with life, so the mutational window that can produce a
  viable human phenotype is narrow. Everything about the entry follows from that
  constraint - the founder origin of the first-described allele in an Amish pedigree, the
  small number of families, and the fact that basal DNA replication is essentially intact
  while the damage response is not.

  Two causal alleles are now described and they do not share a molecular mechanism. The
  original p.Ser228Ile substitution reshapes PCNA's partner-binding pocket and impairs
  interaction with a long list of client proteins, including flap endonuclease 1 and DNA
  ligase 1. The later p.Cys148Ser substitution leaves the structure and partner affinity
  looking like wild type. What the two share is a thermostability defect, and cells
  carrying the C148S allele have less PCNA on chromatin and show temperature-dependent
  phenotypes - which points at the amount of functional clamp available, rather than any
  one lost interaction, as the variable the disease actually tracks. That convergence is
  the most interesting thing in the entry and is curated as an explicit alternative
  mechanistic hypothesis rather than folded into a single chain.

  The name is a clinical description that has aged badly. The phenotype resembles
  ataxia-telangiectasia enough to have been labelled after it, but the mechanism is
  nucleotide-excision-repair-like photosensitivity rather than the double-strand-break
  signalling defect of ATM or MRE11 disease, and the "2" positions it as a sibling of
  MRE11-related ATLD1 which it does not mechanistically resemble.
synonyms:
- ATLD2
- PARD
- PCNA-associated DNA repair disorder
- PCNA-related DNA repair disorder

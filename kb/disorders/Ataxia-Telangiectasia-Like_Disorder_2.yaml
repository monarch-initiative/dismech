discussions:
- discussion_id: why_the_phenotype_is_neurological
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective DNA Damage Response
  - phenotypes#
  prompt: >-
    PCNA is required in every dividing cell. Why is a hypomorphic PCNA allele a
    neurodegenerative disease rather than a proliferative or a cancer-predisposition one?
  rationale: >-
    This is the question the pathograph does not answer. The chain runs from the allele to
    a repair defect that is demonstrable in patient fibroblasts, and then to a phenotype
    that is overwhelmingly cerebellar and neurodevelopmental. Nothing in the sources cited
    here explains the tissue selectivity.

    A candidate exists and is worth recording so that it can be tested rather than assumed:
    global-genome nucleotide excision repair is constitutively weaker in neurons and
    astrocytes than in fibroblasts, and the amount of PCNA recruited to UV-damage sites is
    correspondingly lower in those cells. If neural cells already operate near the lower
    limit of what the pathway can deliver, a hypomorphic clamp would bite there first while
    dividing tissues absorb it. The measurement supporting that is rat primary culture on
    wild-type cells, so it is a hypothesis about the general biology and not an observation
    about this disease.

    Two things would move it. A patient-derived neural model, of which none is reported
    here, and a comparison of chromatin-bound PCNA between patient neural cells and patient
    fibroblasts, which is measurable with the assay the founding reports already use.
  evidence:
  - reference: PMID:17236820
    reference_title: Neurons and astrocytes exhibit lower activities of global genome nucleotide excision repair than do fibroblasts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results demonstrate that both neurons and astrocytes have significantly lower NER
      capabilities than fibroblasts.
    explanation: >-
      The candidate explanation for the tissue selectivity. INDIRECT and MODEL_ORGANISM: rat
      primary cultures of wild-type cells, so it establishes a baseline difference between
      cell types rather than anything about this disease.
  - reference: PMID:17236820
    reference_title: Neurons and astrocytes exhibit lower activities of global genome nucleotide excision repair than do fibroblasts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      That result was consistent with the finding that levels of an NER-related protein
      (proliferating cell nuclear antigen, PCNA) recruited at the localized UV-damage sites
      were lower in neurons and in astrocytes than in fibroblasts.
    explanation: >-
      Curated separately because it is the part that names PCNA specifically, which is what
      makes the candidate relevant to this disease rather than to NER disorders generally.
- discussion_id: untested_epigenetic_branch
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired PCNA Client Protein Binding
  prompt: >-
    DNMT1 is among the PIP-box clients whose binding is impaired. Does ATLD2 carry a
    maintenance-methylation defect, and has anyone looked?
  rationale: >-
    The client-binding node records that DNMT1 is affected alongside the repair enzymes,
    and DNMT1 is how CpG methylation patterns survive replication. If clamp-dependent
    loading of DNMT1 is impaired in patient cells, the disease would have an epigenetic arm
    in addition to a repair arm, which would be a different kind of disease from the one
    this entry describes.

    The supporting biology is established outside this disease: DNMT1 is targeted to
    replication sites through a PCNA-binding domain, with a second PCNA-independent route
    through UHRF1/Np95 binding hemimethylated DNA. Two routes matter here, because a defect
    in the PCNA-dependent one need not abolish maintenance methylation - which is a reason
    the branch might be real and still hard to see.

    No source cited here reports methylation in ATLD2 patient cells, so this is an untested
    branch and not a suppressed finding. It is recorded rather than modelled: putting a
    methylation node in the pathograph would assert a claim nobody has made.
  evidence:
  - reference: PMID:23535145
    reference_title: Dissection of cell cycle-dependent dynamics of Dnmt1 by FRAP and diffusion-coupled modeling.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Two subdomains, the proliferating cell nuclear antigen (PCNA)-binding domain (PBD) and
      the targeting sequence (TS) domain, target Dnmt1 to the replication sites in S phase.
    explanation: >-
      Establishes the PCNA-dependent route the gap is about, and that it is one of two. Mouse
      somatic cells and wild-type PCNA, so it says nothing about the disease variant.
  - reference: PMID:17994007
    reference_title: The SRA protein Np95 mediates epigenetic inheritance by recruiting Dnmt1 to methylated DNA.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Np95 forms complexes with Dnmt1 and mediates the loading of Dnmt1 to replicating
      heterochromatic regions.
    explanation: >-
      The parallel PCNA-independent loading route, and the reason a PCNA-side defect would
      not necessarily abolish maintenance methylation. Recorded because it bears on how hard
      the branch would be to detect, not because it supports the branch existing.
- discussion_id: allele_specific_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired PCNA Client Protein Binding
  - pathophysiology#Reduced PCNA Thermostability
  - mechanistic_hypotheses#reduced_functional_clamp_pool
  prompt: >-
    Do the two causal PCNA alleles produce the same disease by the same route, or by two
    different routes that happen to converge on the clinical phenotype?
  rationale: >-
    p.Ser228Ile impairs client binding across most PIP-box partners; p.Cys148Ser has
    wild-type-like structure and wild-type-like partner affinity and causes the same
    disease. The only property the alleles share is reduced thermostability, which points
    at the amount of functional clamp rather than at any lost interaction. But the
    inference is not closed: no experiment has shown that lowering PCNA levels by an
    unrelated means reproduces the cellular phenotype, and the S228I cells were explicitly
    reported to have normal PCNA protein levels, so a shared level-based mechanism has to
    explain how that allele produces the disease without a measured level change.
    Resolving this determines whether evidence gathered on one allele can be read as
    evidence about the disease, which is currently assumed throughout the literature and
    throughout this entry.
  evidence:
  - reference: PMID:36990216
    reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Unlike PCNA-S228I, PCNA-C148S has WT-like structure and affinity toward partners."
    explanation: The dissociation between the two alleles that this gap is about.
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, while the p.Ser228Ile alteration appeared to have no effect on protein
      levels or DNA replication, patient cells exhibited marked abnormalities in response
      to UV irradiation, displaying substantial reductions in both UV survival and RNA
      synthesis recovery.
    explanation: >-
      Recorded as REFUTE against the unified clamp-level account. If S228I cells have
      normal PCNA protein levels, then reduced clamp availability cannot be the whole
      mechanism for that allele, whatever the thermostability assays show in vitro.
- discussion_id: cellular_defect_to_clinical_severity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective DNA Damage Response
  - phenotypes#Neurodegeneration
  prompt: >-
    Why does a repair defect that produces only subtle changes in undamaged cells produce
    progressive neurodegeneration in the whole organism?
  rationale: >-
    The in vitro effects of the S228I allele on client binding are dramatic, and yet the
    downstream cellular consequences are described as subtle: p21 and Cdt1 stability are
    only minimally altered in patient cells, and DNA replication is unaffected. The
    authors of that work explicitly frame the gap - large biochemical perturbation, small
    cellular effect - and propose that the small effects accumulate. Nothing has tested
    that in neural tissue, and no model system for this disorder has been reported at all,
    so the step from a mild fibroblast phenotype to cerebellar atrophy is currently an
    argument rather than a finding.
  evidence:
  - reference: PMID:28073635
    reference_title: "PCNA dependent cellular activities tolerate dramatic perturbations in PCNA client interactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Despite the dramatic in vitro effects of the PARD mutation on PIP-degron binding,
      there are only minor alterations to the stability of p21 and Cdt1 in cells from
      affected individuals.
    explanation: >-
      States the disproportion between the biochemical and the cellular effect, which is
      what this gap is about. The paper's own title makes the same point.
notes: >-
  Lump/split decision: DISEASE. MONDO:0014399 names one entity with one conserved
  pathograph - biallelic hypomorphic PCNA, a damage-response defect, and a
  progeroid-neurodegenerative-photosensitive syndrome - and the stub is retired
  accordingly. Neither MONDO parent (ataxia-telangiectasia-like disorder MONDO:0011457,
  DNA repair disease MONDO:0021190) is curated, so nothing here duplicates an existing
  entry. ATLD1 (MRE11) is a separate disease and is carried here only as a differential.

  The two alleles are curated as one disease with two mechanistic hypotheses rather than
  as two diseases or as one chain. That is a deliberate call. They are clinically the same
  syndrome and both are called PARD in the literature, so splitting would be wrong; but
  the published molecular accounts of them are incompatible in a way that a single chain
  would have to paper over, so lumping them into one mechanism would also be wrong. The
  hypothesis groups and the allele_specific_mechanism knowledge gap are how the entry says
  both things at once.

  A limitation of the curation worth naming, because it affects how every evidence item
  here should be read: dismech's EvidenceItem has no slot for which allele an experiment
  was performed on. In a disease where the two causal alleles demonstrably differ in
  molecular consequence, that matters, and the only place this entry can record it is in
  free-text explanation fields. Where an evidence item is allele-specific, its explanation
  says so explicitly.

  Sample sizes are similarly carried in prose rather than in structure. The entire
  clinically described population of the founding report is four individuals from one
  pedigree, and cerebellar atrophy rests on imaging in one of them. Where a snippet could
  be chosen either with or without its denominator, this entry chose the one that carries
  it.

  No treatments section. No disease-modifying or symptomatic treatment specific to this
  disorder is reported in the cited literature, and inventing a supportive-care row would
  assert clinical content that does not exist. Sun protection follows from the
  photosensitivity by the same logic as in the other NER disorders but is not stated for
  this disease in any source cited here, so it is not curated as a treatment.

  No animal or experimental models. None is reported for this disorder. This is a real
  gap rather than an unsearched one and is recorded in the second knowledge gap.

  The deep-research report generated for this entry is committed alongside it under
  research/. Reference selection and every snippet were taken from the fetched reference
  cache rather than from the report. It passes just preflight-dr against MONDO:0014399 -
  PCNA is named 72 times, and the OMIM number in the report matches MONDO's - which is
  worth stating because the sibling KIDAR entry curated in the same run had to discard its
  report entirely for naming the wrong disease.

  On the report's references. It cites fourteen; thirteen are cited here, and the two that
  are not are deliberate. PMID:38814467 reviews the bacterial beta-clamp - useful background
  on sliding clamps as a protein family, and not evidence about a human disease.
  PMID:23622410 is a general review of progressive cerebellar atrophy in childhood that
  mentions ATLD in a list; citing it would add a reference and no claim. Neither cache file
  is committed, since this entry does not cite them. The disease-specific weight is carried
  by PMID:24911150, PMID:28073635 and PMID:36990216, which are cited throughout.

  Three of the report's references describe MRE11-related ATLD1 rather than this disease.
  They are cited here only in the ATLD1 differential row, and the explanations on those
  items say so. The two disorders share a name and a numbering and nothing mechanistic, so
  quoting an ATLD1 cohort anywhere else in this entry would be exactly the wrong-entity
  error the KIDAR entry in this run documents - reached by shared name rather than by
  shared gene.

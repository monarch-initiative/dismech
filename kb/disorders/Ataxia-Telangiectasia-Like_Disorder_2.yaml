- name: Cockayne syndrome and other nucleotide excision repair disorders
  description: >-
    Mechanistically the closer relatives. Cockayne syndrome, UV-sensitive syndrome,
    xeroderma pigmentosum and trichothiodystrophy share the photosensitivity and the

- name: UV Sensitivity and RNA Synthesis Recovery in Patient Fibroblasts
  description: >-
    The cellular assays that characterise the disorder: reduced survival after UV and
    failure to recover RNA synthesis afterwards. These are research assays rather than
    routine diagnostics, but they are what places the disorder among the nucleotide
    excision repair diseases and would distinguish it from a purely clinical
    ataxia-telangiectasia-like picture.
  evidence:
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, while the p.Ser228Ile alteration appeared to have no effect on protein
      levels or DNA replication, patient cells exhibited marked abnormalities in response
      to UV irradiation, displaying substantial reductions in both UV survival and RNA
      synthesis recovery.
    explanation: Names both assays and their direction in patient cells.
differential_diagnoses:
- name: Ataxia-telangiectasia (ATM)
  description: >-
    The disorder this one is named after. Both present with ataxia and telangiectasia, but
    ATM disease is a double-strand-break signalling defect with immunodeficiency, raised
    alpha-fetoprotein and a substantial malignancy risk, none of which characterises this
    entry. Photosensitivity is not a feature of ataxia-telangiectasia and is a feature
    here.
  distinguishing_features:
  - Cutaneous photosensitivity and impaired RNA synthesis recovery after UV, absent in ATM disease
  - No immunodeficiency or raised alpha-fetoprotein reported in the PCNA disorder
  - Short stature, hearing loss and premature aging are cardinal here
  evidence:
  - reference: PMID:33426167
    reference_title: "Beyond Typical Ataxia Telangiectasia: How to Identify the Ataxia Telangiectasia-Like Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, absence of telangiectasia, normal levels of alpha-fetoprotein and negative
      genetic test may direct to alternative diagnosis with similar phenotypes such as
      ataxia telangiectasia-like disorders (ATLD).
    explanation: >-
      States the clinical route by which a patient reaches this differential at all, which
      is the practical content of this row: the ATLD label is what is left when ataxia
      telangiectasia has been looked for and not found.
- name: Ataxia-telangiectasia-like disorder 1 (MRE11)
  description: >-
    Shares the clinical label and the numbering but not the mechanism: ATLD1 is caused by
    MRE11 variants and is a double-strand-break repair defect. The shared name reflects
    the era in which both were described clinically, and grouping the two by mechanism
    would be a mistake.
  distinguishing_features:
  - Caused by MRE11 rather than PCNA
  - Double-strand-break repair rather than nucleotide excision repair
  - No UV photosensitivity phenotype
  - Loss of MRE11 protein on western blot, with reduced ATM-dependent phosphorylation
  - Reported additional features not described in ATLD2, including hypergonadotropic hypogonadism and neutrophil hypersegmentation
  evidence:
  - reference: PMID:24733832
    reference_title: "Hypergonadotropic hypogonadism and hypersegmented neutrophils in a patient with ataxia-telangiectasia-like disorder: potential diagnostic clues?"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Western blot assay demonstrated total loss of MRE11 and reduction of ATM-dependent

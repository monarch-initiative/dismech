    Proliferating cell nuclear antigen, the homotrimeric sliding clamp that encircles DNA
    and tethers replication and repair enzymes to it. Only hypomorphic biallelic alleles
    are compatible with life, so the causal allelic spectrum for this disease is
    intrinsically narrow: two missense substitutions, p.Ser228Ile and p.Cys148Ser.

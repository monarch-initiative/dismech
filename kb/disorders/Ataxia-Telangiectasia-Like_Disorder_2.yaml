prevalence:
- population: Ohio Amish community
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The founding report describes four affected individuals in one extended pedigree. No
    population rate is available, and the founder structure means a rate estimated here
    would not transfer to any other population.
  evidence:
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the current study, 4 individuals aged 11-31 years affected by a novel syndrome
      were identified from a single extended pedigree consisting of 2 kindreds within the
      Ohio Amish community
    explanation: >-
      Gives the entire molecularly characterised population of the original report, and
      its founder structure.
mechanistic_hypotheses:
- hypothesis_group_id: lost_client_interactions
  hypothesis_label: Disease follows from specific lost PCNA client interactions
  status: CANONICAL
  description: >-
    The account that came with the founding report. The p.Ser228Ile substitution alters
    the partner-binding pocket, PCNA's interactions with flap endonuclease 1, DNA ligase 1
    and a long list of other PIP-box clients are impaired, and the resulting failures of
    repair and of Okazaki-fragment maturation produce the phenotype. It explains the
    photosensitivity and the UV phenotypes of patient cells directly.
  evidence:
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The p.Ser228Ile change also profoundly altered PCNA's interaction with Flap endonuclease 1 and DNA Ligase 1, DNA metabolism enzymes."
    explanation: Reports the interaction defect this hypothesis is built on.
- hypothesis_group_id: reduced_functional_clamp_pool
  hypothesis_label: Disease follows from a reduced pool of functional PCNA
  status: EMERGING
  description: >-
    The account that the second allele forces. p.Cys148Ser causes the same disease with
    wild-type-like structure and wild-type-like partner affinity, so lost client binding
    cannot be the common cause. What both alleles do share is reduced thermostability, and
    C148S patient cells carry less PCNA on chromatin and behave differently at different
    temperatures. On this reading the operative variable is how much functional clamp is
    available, and the S228I interaction defects are one route to that rather than the
    mechanism itself.
  evidence:
  - reference: PMID:36990216
    reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The stability defect of both PARD variants indicates that PCNA levels are likely an important driver of PARD disease."
    explanation: >-
      States the hypothesis in the authors' own terms, and note their own hedge - "likely
      an important driver", not "the cause" - which is why this is EMERGING and not
      CANONICAL.
  - reference: PMID:36990216
    reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Unlike PCNA-S228I, PCNA-C148S has WT-like structure and affinity toward partners."
    explanation: >-
      Recorded as REFUTE against the lost-client-interaction hypothesis as a complete
      account. A second allele causing the same disease without the interaction defect is
      the observation that makes the canonical mechanism insufficient.
  - reference: PMID:37511614
    reference_title: "A FRET-Based Assay for the Identification of PCNA Inhibitors."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Incubation time dependent FRET measurements indicated no effect on PCNAC148S-p15
      affinity, but on PCNA stability.
    explanation: >-
      An independent replication of the C148S result by a different group using different
      methods (FRET, intrinsic tryptophan fluorescence, differential scanning fluorimetry
      and asymmetrical flow field-flow fractionation), and the reason this hypothesis rests
      on more than one laboratory's assay. It separates the two axes cleanly: partner
      affinity intact, stability not.
pathophysiology:
- name: Biallelic Hypomorphic PCNA Variant
  biological_scale: MOLECULAR
  description: >-
    A homozygous missense substitution in PCNA that reduces but does not abolish function.
    The hypomorphic requirement is structural to the disease rather than incidental: PCNA
    is essential, so the alleles that can produce a living affected person are only those
    that leave enough function to support replication.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: PCNA
      term:
        id: hgnc:8729
        label: PCNA
    description: >-
      Two alleles are described: p.Ser228Ile, a founder allele in an Ohio Amish pedigree,
      and p.Cys148Ser. Both are homozygous in affected individuals. They differ in
      molecular consequence, which is why this entry carries two mechanistic hypotheses
      rather than one chain.
  cellular_components:
  - preferred_term: PCNA complex
    term:
      id: GO:0043626
      label: PCNA complex
  evidence:
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a syndrome in which the cardinal clinical features include short
      stature, hearing loss, premature aging, telangiectasia, neurodegeneration, and
      photosensitivity, resulting from a homozygous missense (p.Ser228Ile) sequence
      alteration of the proliferating cell nuclear antigen (PCNA).
    explanation: Establishes the gene, the allele and the phenotype in one statement.
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Due to this fundamental role, mutations in PCNA that profoundly impair protein function would be incompatible with life."
    explanation: >-
      States the constraint that makes the hypomorphic requirement part of the disease
      definition. Graded OTHER: it is an argument from PCNA's known essentiality rather
      than a result reported in this paper.
  - reference: PMID:36990216
    reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a second PCNA substitution (C148S) that also causes PARD."
    explanation: Establishes the second causal allele.
  downstream:
  - target: Impaired PCNA Client Protein Binding
    description: >-
      For the S228I allele, the substitution reshapes the interdomain connecting loop and
      the binding pocket that PIP-box clients dock into.
    causal_link_type: DIRECT
    hypothesis_groups:
    - lost_client_interactions
    evidence:
    - reference: PMID:28073635
      reference_title: "PCNA dependent cellular activities tolerate dramatic perturbations in PCNA client interactions."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Ubiquitination of PCNA is unaffected by the S228I change, which indirectly alters the structure of the inter-domain connecting loop."
      explanation: >-
        Localises the structural consequence of the allele, and simultaneously records
        what it does not disturb.
  - target: Reduced PCNA Thermostability
    description: >-
      Both described alleles destabilise the trimer, which is the one molecular property
      they have in common.
    causal_link_type: DIRECT
    hypothesis_groups:
    - reduced_functional_clamp_pool
    evidence:
    - reference: PMID:36990216
      reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "In contrast, both disease-associated variants possess a thermostability defect."
      explanation: >-
        The shared property across the two alleles, measured directly on the purified
        proteins.
- name: Impaired PCNA Client Protein Binding
  biological_scale: MOLECULAR
  description: >-
    PIP-box client proteins bind the altered PCNA pocket less well. The impairment is
    broad rather than selective, and includes Cdt1 and DNMT1 as well as the
    Okazaki-fragment enzymes. It is notably not universal: p21 still binds, which is what
    makes the defect a change in the pocket's preferences rather than its abolition.
  molecular_functions:
  - preferred_term: PCNA client protein binding
    modifier: DECREASED
  evidence:
  - reference: PMID:28073635
    reference_title: "PCNA dependent cellular activities tolerate dramatic perturbations in PCNA client interactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the binding between PCNA and PCNA-interacting proteins (PIPs) shows that
      the S228I change dramatically impairs the majority of these interactions
    explanation: >-
      Quantifies the breadth of the interaction defect. Applies to the S228I allele only;
      the C148S allele does not share it.
  - reference: PMID:28073635
    reference_title: "PCNA dependent cellular activities tolerate dramatic perturbations in PCNA client interactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "In contrast p21 largely retains the ability to bind PCNA."
    explanation: >-
      The exception that defines the shape of the defect, and the reason this node says
      "impaired" rather than "abolished".
  - reference: PMID:26688547
    reference_title: "A Disease-Causing Variant in PCNA Disrupts a Promiscuous Protein Binding Site."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we describe the structure of the disease-causing variant, which reveals a large
      conformational change that dramatically transforms the binding pocket for PCNA client
      proteins.
    explanation: >-
      The structural basis of this node. A crystal structure of S228I PCNA showing that the
      pocket itself is remodelled, which is what makes the interaction defect a property of
      the clamp rather than of any one partner.
  - reference: PMID:26688547
    reference_title: "A Disease-Causing Variant in PCNA Disrupts a Promiscuous Protein Binding Site."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the mutation markedly alters the binding energetics for some client
      proteins, while another, p21(CIP1), is only mildly affected.
    explanation: >-
      Independent structural confirmation of the p21 exception recorded above, from a
      different group and a different method. Two laboratories reaching the same asymmetry
      is why this node states the exception rather than hedging it.
  - reference: PMID:26688547
    reference_title: "A Disease-Causing Variant in PCNA Disrupts a Promiscuous Protein Binding Site."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Structures of the disease variant bound to peptides derived from two PCNA partner
      proteins reveal that the binding pocket can adjust conformation to accommodate some
      ligands, indicating that the binding site is dynamic and pliable.
    explanation: >-
      Explains why the defect is selective rather than uniform: the remodelled pocket can
      still flex to fit some ligands. Curated as its own item because it is the mechanism
      behind the exception, not a restatement of it.
  - reference: PMID:25972089
    reference_title: "p21 Exploits Residue Tyr151 as a Tether for High-Affinity PCNA Binding."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      As p21 is one of the few PIP-box sequences to contain a tyrosine rather than a
      phenylalanine in the eighth conserved position, we probed the significance of the
      hydroxyl group at this position using a mutational approach.
    explanation: >-
      A candidate explanation for why p21 in particular survives the pocket remodelling:
      it is an atypical PIP-box with the highest known affinity for PCNA, tethered by a
      residue most partners do not have. INDIRECT because this work is on wild-type PCNA
      and does not test the disease variant, so the connection to the exception is an
      inference.
  - reference: PMID:33984330
    reference_title: "Unlocking the PIP-box: A peptide library reveals interactions that drive high-affinity binding to human PCNA."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The hPCNA-binding affinity of all peptides, characterized as KD values determined by
      surface plasmon resonance, spanned a 4000-fold range, from 1.83 nM to 7.59 μM.
    explanation: >-
      Sets the scale the selectivity of this defect has to be read against. Native PIP-box
      affinities already span four orders of magnitude, so a pocket change that shifts
      binding energetics will not affect all partners equally even before any structural
      accommodation. INDIRECT: it characterises wild-type PCNA, not the variant.
  downstream:
  - target: Defective DNA Damage Response
    description: >-
      Losing the docking of repair and Okazaki-maturation enzymes onto the clamp is the
      route from the binding defect to a failure of repair.
    causal_link_type: DIRECT
    hypothesis_groups:
    - lost_client_interactions
    evidence:
    - reference: PMID:24911150
      reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The p.Ser228Ile change also profoundly altered PCNA's interaction with Flap endonuclease 1 and DNA Ligase 1, DNA metabolism enzymes."
      explanation: >-
        Names two of the affected enzymes. Marked INDIRECT because the quote reports the
        interaction defect, and the step to a defective damage response is an inference
        from what those enzymes do.
- name: Reduced PCNA Thermostability
  biological_scale: MOLECULAR
  description: >-
    The mutant trimer is less thermostable than wild type. In cells this presents as less
    PCNA loaded on chromatin and as phenotypes that vary with temperature, which is an
    unusual and clean signature: a disease whose cellular readout moves when you change
    the incubator.
  molecular_functions:
  - preferred_term: PCNA protein stability
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulation of protein stability
    modifier: DECREASED
    term:
      id: GO:0031647
      label: regulation of protein stability
  evidence:
  - reference: PMID:36990216
    reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, patient-derived cells homozygous for the C148S allele exhibit low levels
      of chromatin-bound PCNA and display temperature-dependent phenotypes.
    explanation: >-
      Connects the biophysical stability defect to a measurable cellular consequence in
      patient-derived material.
  - reference: PMID:37511614
    reference_title: "A FRET-Based Assay for the Identification of PCNA Inhibitors."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The impaired stability and increased aggregation behavior of PCNAC148S was confirmed
      by intrinsic tryptophan fluorescence, differential scanning fluorimetry (DSF) and
      asymmetrical flow field-flow fractionation (AF4) measurements.
    explanation: >-
      Independent confirmation of the stability defect by a second group using three
      orthogonal biophysical methods, and it adds a mechanism the founding report did not
      name: increased aggregation. That matters for how this node should be read - a clamp
      that aggregates is removed from the functional pool as surely as one that unfolds,
      and it suggests why the cellular readout is temperature-dependent.
  downstream:
  - target: Defective DNA Damage Response
    description: >-
      Less functional clamp on chromatin means fewer sites at which repair enzymes can be
      positioned, independently of any change in binding affinity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - reduced_functional_clamp_pool
    evidence:
    - reference: PMID:36990216
      reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The stability defect of both PARD variants indicates that PCNA levels are likely an important driver of PARD disease."
      explanation: >-
        The authors' own inferential statement, quoted with its hedge intact. INDIRECT
        because it is an interpretation offered by the paper rather than a measured link
        from clamp level to repair failure.
- name: Defective DNA Damage Response
  biological_scale: CELLULAR
  description: >-
    Patient cells survive UV irradiation poorly and fail to recover RNA synthesis after
    it. The RNA-synthesis-recovery deficit is the signature of impaired
    transcription-coupled nucleotide excision repair, and it is what puts this disorder among the
    NER-related diseases despite its ataxia-telangiectasia name. Basal DNA replication is
    unaffected, so this is a damage-response defect specifically rather than a general
    replication defect.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: nucleotide-excision repair
    modifier: DECREASED
    term:
      id: GO:0006289
      label: nucleotide-excision repair
  - preferred_term: transcription-coupled nucleotide-excision repair
    modifier: DECREASED
    term:
      id: GO:0006283
      label: transcription-coupled nucleotide-excision repair
  evidence:
  - reference: PMID:24911150
    reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, while the p.Ser228Ile alteration appeared to have no effect on protein
      levels or DNA replication, patient cells exhibited marked abnormalities in response
      to UV irradiation, displaying substantial reductions in both UV survival and RNA
      synthesis recovery.
    explanation: >-
      The central cellular phenotype, and the dissociation from basal replication that
      makes this a damage-response defect. Note that the "no effect on protein levels"
      clause is specific to S228I and is contradicted for C148S by PMID:36990216 - the two
      alleles genuinely differ here.
  - reference: PMID:28073635
    reference_title: "PCNA dependent cellular activities tolerate dramatic perturbations in PCNA client interactions."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Cells from individuals affected by PARD are sensitive to the PCNA inhibitors T3 and T2AA, showing that the S228I mutation has consequences for undamaged cells."
    explanation: >-
      Extends the cellular defect beyond the irradiated state: the cells have reduced
      functional reserve even without exogenous damage.
  downstream:
  - target: Cutaneous Photosensitivity
    description: >-
      Failure to repair UV photoproducts in skin is the most direct clinical readout of
      the repair defect, and it is what aligns this disorder with the NER diseases.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24911150
      reference_title: "Hypomorphic PCNA mutation underlies a human DNA repair disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Together, our findings detail a mutation of PCNA in humans associated with a
        neurodegenerative phenotype, displaying clinical and molecular features common to
        other DNA repair disorders, which we showed to be attributable to a hypomorphic
        amino acid alteration.
      explanation: >-
        Places the clinical picture with the DNA repair disorders. INDIRECT: the quote
        asserts the class membership, and the step to "the UV repair defect causes this
        patient's photosensitivity" is the inference.
  - target: Neurodegeneration
    description: >-
      Post-mitotic neurons depend on repair rather than on replacement, which is the
      standard account of why repair-deficiency syndromes are neurodegenerative. It is
      an account rather than a demonstration in this disease - no neuronal material has
      been studied - and the entry marks it accordingly.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36990216
      reference_title: "A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "PARD symptoms range from UV sensitivity, neurodegeneration, telangiectasia, and premature aging."
      explanation: >-
        Establishes that neurodegeneration is part of the syndrome. It does not establish
        the causal route from the repair defect to neuronal loss, which is why the edge is
        typed with unknown intermediates.

diagnosis:
- name: Stool culture with cold enrichment and pathogenic-biotype identification
  description: >-
    Isolation on Yersinia-selective media with cold enrichment, CR-MOX
    phenotype testing, biochemical tests, serotyping, and sequencing can
    separate pathogenic bioserotypes from Y. enterocolitica-like species.
  evidence:
  - reference: PMID:19219471
    reference_title: "Yersinia enterocolitica and Y. enterocolitica-like species in clinical stool specimens of humans: identification and prevalence of bio/serotypes in Finland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cold-enrichment increased the number of all isolates, and 25% of the
      bio/serotype 4/O:3 and 2/O:9 strains were only found by cold-enrichment.
    explanation: >-
      The clinical-stool study supports cold enrichment as a sensitivity step
      for detecting pathogenic bio/serotypes.
  - reference: PMID:19219471
    reference_title: "Yersinia enterocolitica and Y. enterocolitica-like species in clinical stool specimens of humans: identification and prevalence of bio/serotypes in Finland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The microscopic colony identification on CIN agar with positive CR-MOX
      test, combined with several biochemical tests, identified reliably the
      pathogenic YE bioserotypes
    explanation: >-
      CIN morphology, CR-MOX testing, and biochemical profiling are supported as
      a diagnostic workflow for pathogenic Y. enterocolitica bioserotypes.
- name: Quadruplex real-time qPCR patho-serotyping
  description: >-
    Two-group quadruplex RT-qPCR can detect pathogenic O-serotypes and virulence
    markers for molecular identification, source attribution, and epidemiologic
    monitoring.
  evidence:
  - reference: PMID:40445798
    reference_title: A two-group quadruplex real-time quantitative PCR assay for molecular patho-serotyping of Yersinia enterocolitica.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We present a two-group quadruplex real-time quantitative PCR (RT-qPCR) for
      the patho-serotyping of Y. enterocolitica.
    explanation: >-
      The assay paper directly describes a quadruplex real-time PCR for
      molecular patho-serotyping of Y. enterocolitica.
animal_models:
- name: Oral Yersinia enterocolitica mouse infection
  species: Mus musculus
  genotype: Wild-type or immune-deficient recipient mice
  publication: PMID:32147792
  description: >-
    Oral mouse infection with Y. enterocolitica is used to assay intestinal
    colonization severity and the protective contribution of adoptively
    transferred innate lymphoid cell subsets.
  modeled_mechanisms:
  - target: Invasin-Mediated Peyer's Patch Entry
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model uses oral infection to capture the intestinal entry context in
      which Peyer's patch invasion and mucosal innate lymphoid responses are
      measured.
    limitations: >-
      The method focuses on mouse intestinal infection and innate lymphoid cell
      transfers rather than on a complete human foodborne outbreak exposure.
  evidence:
  - reference: PMID:32147792
    reference_title: Bacterial Infection Allows for Functional Examination of Adoptively Transferred Mouse Innate Lymphoid Cell Subsets.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we describe a mouse model of oral infection by Yersinia
      enterocolitica (Y. enterocolitica) and several different methodologies to
      assess the severity of the infection.
    explanation: >-
      The methods article describes oral Y. enterocolitica infection in mice as
      a model for assaying enteric infection severity.
- name: Rodent yersiniosis model
  species: Rodents
  publication: PMID:8363822
  description: >-
    Rodent infection is used to follow Y. enterocolitica entry across Peyer's
    patches, dissemination to lymph nodes and reticuloendothelial organs, focal
    lesions, and immune-cell requirements for host defense.
  modeled_mechanisms:
  - target: Phagocyte-Associated Mesenteric Dissemination
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Mouse and rabbit infection reproduce Peyer's-patch entry and downstream
      spread into lymph nodes, spleen, and liver, while rat infection can model
      the post-infectious arthritis branch.
    limitations: >-
      The review spans mice, rabbits, and rats because no single rodent model
      recapitulates every intestinal and post-infectious manifestation.
  evidence:
  - reference: PMID:8363822
    reference_title: "Experimental Yersinia enterocolitica infection in rodents: a model for human yersiniosis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      experimental Y. enterocolitica infection in rodents resembles yersiniosis
      in humans and thus offers extraordinary opportunities to study the
      sequential steps of the infectious process.
    explanation: >-
      The review supports rodent infection as a model for sequential human
      yersiniosis steps.
- name: Ye WAP-314-infected C57BL/6 mouse

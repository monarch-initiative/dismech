pathophysiology:
- name: Pork-Borne Yersinia enterocolitica Ingestion
  description: >-
    Infection starts when viable pathogenic Y. enterocolitica reaches the small
    intestine after ingestion of contaminated raw or undercooked pork or another
    fecally contaminated vehicle.
  downstream:
  - target: Invasin-Mediated Peyer's Patch Entry
    description: >-
      Enteric delivery positions bacteria at the follicle-associated epithelium
      over Peyer's patches for M-cell translocation.
    evidence:
    - reference: PMID:27107739
      reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        After colonisation of the small intestine Ye invades the Peyer's patches
        (PPs) via M cells and disseminates to the mesenteric lymph nodes (MLNs),
        spleen and liver.
      explanation: >-
        Oral mouse infection shows that small-intestinal colonization precedes
        Peyer's-patch invasion and deeper spread.
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Swine play an important role as a reservoir of Y. enterocolitica and
      insufficiently thermally processed pork is the main source of infection to
      humans.
    explanation: >-
      The review supports contaminated pork ingestion as a major initiating
      exposure for human yersiniosis.
- name: Invasin-Mediated Peyer's Patch Entry
  description: >-
    Yersinia invasin binds host beta-1 integrins on intestinal epithelial and M
    cells, enabling internalization across the ileal mucosa and entry into
    Peyer's patch lymphoid tissue.
  locations:
  - preferred_term: small intestine Peyer's patch
    term:
      id: UBERON:0003454
      label: small intestine Peyer's patch
  cell_types:
  - preferred_term: M cell of gut
    term:
      id: CL:0000682
      label: M cell of gut
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Phagocyte-Associated Mesenteric Dissemination
    description: >-
      Organisms entering across Peyer's patches and lamina propria are carried
      by mononuclear phagocytes toward mesenteric lymph nodes and, in severe
      infection, deeper reticuloendothelial sites.
    evidence:
    - reference: PMID:27107739
      reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Altogether, MCs and CD103(+) DCs contribute to immediate invasion and
        dissemination of Ye.
      explanation: >-
        The mouse infection study supports monocyte-derived cells and dendritic
        cells as contributors to early bacterial dissemination.
  evidence:
  - reference: PMID:26731748
    reference_title: Hypoxia Decreases Invasin-Mediated Yersinia enterocolitica Internalization into Caco-2 Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These bacteria can cross the intestinal mucosa, and invade eukaryotic cells
      by binding to host β1 integrins, a process mediated by the bacterial
      effector protein invasin.
    explanation: >-
      Intestinal epithelial-cell assays support beta-1 integrin binding by
      invasin as a host-entry mechanism.
- name: Phagocyte-Associated Mesenteric Dissemination
  description: >-
    After mucosal entry, Y. enterocolitica can associate with CD103-positive
    dendritic cells and monocyte-derived cells in the lamina propria and spread
    to mesenteric lymph nodes, spleen, and liver.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: mesenteric lymph node
    term:
      id: UBERON:0002509
      label: mesenteric lymph node
  downstream:
  - target: pYV Type III Secretion and Yop Effector Injection
    description: >-
      Disseminating pathogenic organisms use the pYV-encoded type III secretion
      apparatus to deliver anti-host Yop proteins into interacting phagocytes.
    evidence:
    - reference: PMID:8709853
      reference_title: "Mutational analysis of the Yersinia enterocolitica virC operon: characterization of yscE, F, G, I, J, K required for Yop secretion and yscH encoding YopR."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Pathogenic yersiniae secrete the Yop anti-host proteins using a type-III
        secretion pathway.
      explanation: >-
        The pYV virC mutational study establishes type III secretion as the
        export pathway for Yop anti-host proteins.
  evidence:
  - reference: PMID:27107739
    reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After colonisation of the small intestine Ye invades the Peyer's patches
      (PPs) via M cells and disseminates to the mesenteric lymph nodes (MLNs),
      spleen and liver.
    explanation: >-
      Oral infection in mice supports spread from the small intestine to regional
      lymph nodes and systemic reticuloendothelial organs.
- name: pYV Type III Secretion and Yop Effector Injection
  description: >-
    Pathogenic Y. enterocolitica carries the pYV plasmid, whose Ysc secretion
    machinery exports Yop proteins into host immune cells.
  biological_processes:
  - preferred_term: protein secretion by the type III secretion system
    term:
      id: GO:0030254
      label: protein secretion by the type III secretion system
  downstream:
  - target: YopJ-Driven Macrophage Survival-Pathway Blockade
    description: >-
      Translocated YopJ/YopP blocks macrophage survival signaling and promotes
      death of innate immune cells.
    evidence:
    - reference: PMID:22563435
      reference_title: "YopJ-induced caspase-1 activation in Yersinia-infected macrophages: independent of apoptosis, linked to necrosis, dispensable for innate host defense."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        YopJ inhibits survival response pathways in macrophages, causing cell
        death.
      explanation: >-
        Macrophage infection experiments support YopJ-driven blockade of host
        survival pathways as a cell-death mechanism.
  evidence:
  - reference: PMID:8709853
    reference_title: "Mutational analysis of the Yersinia enterocolitica virC operon: characterization of yscE, F, G, I, J, K required for Yop secretion and yscH encoding YopR."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The components of the secretion machinery are encoded by three loci on the
      pYV plasmid: virA, virB, and virC.
    explanation: >-
      The mutational analysis maps the Yop type III secretion apparatus to the
      pYV virulence plasmid.
- name: YopJ-Driven Macrophage Survival-Pathway Blockade
  description: >-
    YopJ and related Yop effectors suppress macrophage survival and innate
    immune signaling, impairing bacterial clearance and amplifying ileal and
    mesenteric inflammation.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: effector-mediated suppression of host innate immune response
    term:
      id: GO:0140403
      label: effector-mediated suppression of host innate immune response
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:22563435
    reference_title: "YopJ-induced caspase-1 activation in Yersinia-infected macrophages: independent of apoptosis, linked to necrosis, dispensable for innate host defense."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Yersinia outer protein J (YopJ) is a type III secretion system (T3SS)
      effector of pathogenic Yersinia (Yersinia pestis, Yersinia enterocolitica
      and Yersinia pseudotuberculosis) that is secreted into host cells.
    explanation: >-
      The paper identifies YopJ as a type III-secreted effector used by
      pathogenic Yersinia species, including Y. enterocolitica.
- name: Deferoxamine-Potentiated Systemic Yersinia Replication
  description: >-
    Deferoxamine provides chelated iron that pathogenic Y. enterocolitica can
    use under iron limitation, allowing invasive growth and septicemia in
    iron-overloaded hosts.
  chemical_entities:
  - preferred_term: deferoxamine
    term:
      id: CHEBI:4356
      label: desferrioxamine B
  - preferred_term: iron
    term:
      id: CHEBI:18248
      label: iron atom
  evidence:
  - reference: PMID:12019084
    reference_title: Comparison of the effects of deferiprone versus deferoxamine on growth and virulence of Yersinia enterocolitica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deferoxamine, a drug used to treat patients with iron overload, has the
      capacity to promote systemic Y. enterocolitica infections in humans.
    explanation: >-
      The deferoxamine study supports the clinical link between this iron
      chelator and systemic Y. enterocolitica infection.
phenotypes:
- name: Diarrhea
  description: >-
    Acute enteric Y. enterocolitica infection can present as diarrheal
    enteritis.
  phenotype_term:
    preferred_term: Diarrhea
    term:
      id: HP:0002014
      label: Diarrhea
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Yersiniosis usually appears with gastrointestinal disturbances in children,
      whereas in adults it manifests in a pseudo-appendix form.
    explanation: >-
      The review supports gastrointestinal disturbance as a common clinical
      manifestation of human yersiniosis.
- name: Ileitis
  description: >-
    Infection can involve the terminal ileum, producing an appendicitis-mimicking
    pseudoappendiceal syndrome.
  phenotype_term:
    preferred_term: Ileitis
    term:
      id: HP:0032564
      label: Ileitis
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      The review explicitly lists terminal ileitis in the intestinal yersiniosis
      spectrum.
- name: Lymphadenitis
  description: >-
    Mesenteric lymphadenitis can accompany terminal ileitis and mimic acute
    appendicitis.
  phenotype_term:
    preferred_term: mesenteric lymphadenitis
    term:
      id: HP:0002840
      label: Lymphadenitis
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      The review explicitly lists mesenteric lymphadenitis as part of the
      appendicitis-mimicking presentation.
- name: Bacteremia
  description: >-
    Severe invasive infection can disseminate to the bloodstream as septicemia.
  phenotype_term:
    preferred_term: Bacteremia
    term:
      id: HP:0031864
      label: Bacteremia
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      Septicemia establishes bloodstream dissemination as a severe manifestation
      of intestinal yersiniosis.
- name: Reactive arthritis
  description: >-
    Sterile inflammatory arthritis can develop days to weeks after the enteric
    infection.
  phenotype_term:
    preferred_term: reactive arthritis
    term:
      id: MONDO:0017376
      label: reactive arthritis
  evidence:
  - reference: PMID:40473988
    reference_title: "Reactive arthritis: a comprehensive journey through diagnostic findings."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The most common agents include Chlamydia trachomatis, Ureaplasma
      urealyticum, and Neisseria gonorrhea for the venereal type and Salmonella
      enteriditis, Shigella flexneri, Yersinia enterocolitica for the
      post-enteric type.
    explanation: >-
      The review names Y. enterocolitica as a common post-enteric trigger of
      reactive arthritis.
treatments:
- name: Antibiotic therapy for invasive yersiniosis
  description: >-
    Third-generation cephalosporins, fluoroquinolones, and susceptibility-guided
    alternatives are used for severe invasive disease, while ampicillin and
    cefazolin are unreliable because clinical Y. enterocolitica strains are
    intrinsically resistant to those agents.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:10803262
    reference_title: "[Susceptibility to selected antibiotics of Yersinia enterocolitica 03 strains, carrying and not carrying plasmid pYV]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Third-generation cephalosporins such as cefotaxime and ceftriaxone and a
      fluoroquinolone (ciprofloxacin) were the most active antimicrobial agents,
      tested followed by aztreonam, imipenem, trimethoprim, tetracycline,
      gentamicin, chloramphenicol, amoxycillin/clavulanate, cefaclor,
      cefuroxime, amikacin, furazolidone and sulphamethoxazole.
    explanation: >-
      Susceptibility testing of clinical serotype O:3 isolates supports
      third-generation cephalosporins and ciprofloxacin as active agents against
      Y. enterocolitica.

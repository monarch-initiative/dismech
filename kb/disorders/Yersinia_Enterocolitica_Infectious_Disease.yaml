treatments:
- name: Antibiotic therapy for invasive yersiniosis
  description: >-
    Third-generation cephalosporins, fluoroquinolones, and susceptibility-guided
    alternatives are used for severe invasive disease, while ampicillin and
    cefazolin are unreliable because clinical Y. enterocolitica strains are
    intrinsically resistant to those agents.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:

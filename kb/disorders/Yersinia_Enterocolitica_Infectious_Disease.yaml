name: Yersinia Enterocolitica Infectious Disease
creation_date: '2026-09-27T21:14:43Z'
updated_date: '2026-09-27T21:14:43Z'
category: Infectious Disease
description: >-
  Yersinia enterocolitica infectious disease is a foodborne zoonotic infection
  in which ingestion of Yersinia enterocolitica from contaminated pork or other
  vehicles leads to invasive ileal enterocolitis, mesenteric lymphadenitis, and
  pseudoappendicitis, with septicemia and focal hepatic or splenic abscesses in
  vulnerable iron-overloaded or immunocompromised hosts.
disease_term:
  preferred_term: Yersinia enterocolitica infectious disease
  term:
    id: MONDO:0042370
    label: Yersinia enterocolitica infectious disease
parents:
- Yersinia infectious disease
- Bacterial enteritis
synonyms:
- Yersinia enterocolitica infection
- intestinal yersiniosis
- yersiniosis
definitions:
- name: Intestinal yersiniosis clinical spectrum
  definition_type: CASE_DEFINITION
  description: >-
    Intestinal yersiniosis spans enteritis, terminal ileitis with mesenteric
    lymphadenitis or pseudoappendicitis, and septicemic disease with splenic or
    hepatic abscesses.
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      The review defines the major enteric, pseudoappendiceal, and septicemic
      clinical forms captured by this disease entry.
infectious_agent:
- name: Yersinia enterocolitica
  infectious_agent_term:
    preferred_term: Yersinia enterocolitica
    term:
      id: NCBITaxon:630
      label: Yersinia enterocolitica
  description: >-
    Human yersiniosis is caused by pathogenic Y. enterocolitica biotypes that
    combine chromosomal virulence genes with the pYV virulence plasmid encoding
    YadA and the Ysc-Yop type III secretion system.
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      INTRODUCTION: Y. enterocolitica is the causative agent of yersiniosis - a
      foodborne zoonosis with substantial importance to public health.
    explanation: >-
      The review identifies Y. enterocolitica as the bacterial cause of
      yersiniosis.
  - reference: PMID:28400007
    reference_title: Evaluation of virulence genes in Yersinia enterocolitica strains using SYBR Green real-time PCR.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The virulence of the strains belonging to biotypes 1B and 2-5 depends on
      the presence of both chromosomal and plasmid-borne genes.
    explanation: >-
      The molecular survey supports modeling pathogenic Y. enterocolitica as
      requiring both chromosomal and plasmid-encoded virulence functions.
transmission:
- name: Pork-associated foodborne zoonotic transmission
  description: >-
    Human infection is commonly acquired by eating raw, undercooked, or
    otherwise contaminated pork from pigs that carry pathogenic Y.
    enterocolitica in tonsillar tissue at slaughter.
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Swine play an important role as a reservoir of Y. enterocolitica and
      insufficiently thermally processed pork is the main source of infection to
      humans.
    explanation: >-
      The review supports swine as a reservoir and undercooked pork as a major
      exposure vehicle.
  - reference: PMID:29307129
    reference_title: Identification and characterization of Yersinia enterocolitica strains isolated from pig tonsils at slaughterhouse in Central Italy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yersinia enterocolitica causes foodborne disease in humans and infections
      are usually acquired from contaminated raw or undercooked pork. Pigs are
      considered the primary reservoir of human pathogenic bio-serotypes.
    explanation: >-
      Swine tonsil surveillance supports the reservoir and raw/undercooked pork
      transmission route.
progression:
- phase: Acute enterocolitis and pseudoappendicitis
  notes: >-
    Most symptomatic disease is localized to the intestine and regional
    mesenteric lymph nodes, producing enteritis or terminal-ileitis
    pseudoappendicitis.
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      The review distinguishes localized enteritis and terminal ileitis with
      mesenteric adenitis from disseminated septicemia.
- phase: Iron-potentiated septicemia
  notes: >-
    Iron overload or deferoxamine therapy can shift infection toward invasive
    septicemia because ferrioxamine can supply iron for systemic bacterial
    growth.
  evidence:
  - reference: PMID:12019084
    reference_title: Comparison of the effects of deferiprone versus deferoxamine on growth and virulence of Yersinia enterocolitica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In a mouse experimental model of infection, the 50% lethal dose (LD(50))
      of strain IP864 was decreased by more than 5 log units in mice pretreated
      with deferoxamine, while a deferiprone pretreatment did not affect it.
    explanation: >-
      Deferoxamine potentiated Y. enterocolitica virulence in vivo, supporting
      the iron-chelator branch toward systemic infection.
- phase: Post-enteric reactive arthritis
  notes: >-
    A subset of patients develops sterile asymmetric oligoarthritis several days
    to weeks after the gastrointestinal infection.
  evidence:
  - reference: PMID:40473988
    reference_title: "Reactive arthritis: a comprehensive journey through diagnostic findings."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Reactive arthritis, initially described at the beginning of the twentieth
      century, is characterized by a sterile articular inflammation occurring
      several days to weeks after a bacterial gastrointestinal or urogenital
      infection.
    explanation: >-
      The review supports the delayed post-enteric timing and sterile
      inflammatory nature of reactive arthritis.

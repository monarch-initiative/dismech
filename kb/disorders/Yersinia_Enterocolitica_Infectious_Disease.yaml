pathophysiology:
- name: Pork-Borne Yersinia enterocolitica Ingestion
  description: >-
    Infection starts when viable pathogenic Y. enterocolitica reaches the small
    intestine after ingestion of contaminated raw or undercooked pork or another
    fecally contaminated vehicle.
  downstream:
  - target: Invasin-Mediated Peyer's Patch Entry
    description: >-
      Enteric delivery positions bacteria at the follicle-associated epithelium
      over Peyer's patches for M-cell translocation.
    evidence:
    - reference: PMID:27107739
      reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        After colonisation of the small intestine Ye invades the Peyer's patches
        (PPs) via M cells and disseminates to the mesenteric lymph nodes (MLNs),
        spleen and liver.
      explanation: >-
        Oral mouse infection shows that small-intestinal colonization precedes
        Peyer's-patch invasion and deeper spread.
  - target: YstA Heat-Stable Enterotoxin Secretion
    description: >-
      Pathogenic organisms entering the intestinal lumen can express the
      chromosomally encoded YstA enterotoxin branch that contributes to acute
      diarrheal enteritis.
    evidence:
    - reference: PMID:28400007
      reference_title: Evaluation of virulence genes in Yersinia enterocolitica strains using SYBR Green real-time PCR.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The most common virulence-associated gene in pathogenic Y.
        enterocolitica proved to be ystA
      explanation: >-
        Virulence-gene screening supports ystA as a common marker of pathogenic
        Y. enterocolitica biotypes.
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Swine play an important role as a reservoir of Y. enterocolitica and
      insufficiently thermally processed pork is the main source of infection to
      humans.
    explanation: >-
      The review supports contaminated pork ingestion as a major initiating
      exposure for human yersiniosis.
- name: Invasin-Mediated Peyer's Patch Entry
  description: >-
    Yersinia invasin binds host beta-1 integrins on intestinal epithelial and M
    cells, enabling internalization across the ileal mucosa and entry into
    Peyer's patch lymphoid tissue.
  locations:
  - preferred_term: small intestine Peyer's patch
    term:
      id: UBERON:0003454
      label: small intestine Peyer's patch
  cell_types:
  - preferred_term: M cell of gut
    term:
      id: CL:0000682
      label: M cell of gut
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Phagocyte-Associated Mesenteric Dissemination
    description: >-
      Organisms entering across Peyer's patches and lamina propria are carried
      by mononuclear phagocytes toward mesenteric lymph nodes and, in severe
      infection, deeper reticuloendothelial sites.
    evidence:
    - reference: PMID:27107739
      reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Altogether, MCs and CD103(+) DCs contribute to immediate invasion and
        dissemination of Ye.
      explanation: >-
        The mouse infection study supports monocyte-derived cells and dendritic
        cells as contributors to early bacterial dissemination.
  evidence:
  - reference: PMID:26731748
    reference_title: Hypoxia Decreases Invasin-Mediated Yersinia enterocolitica Internalization into Caco-2 Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These bacteria can cross the intestinal mucosa, and invade eukaryotic cells
      by binding to host β1 integrins, a process mediated by the bacterial
      effector protein invasin.
    explanation: >-
      Intestinal epithelial-cell assays support beta-1 integrin binding by
      invasin as a host-entry mechanism.
- name: Phagocyte-Associated Mesenteric Dissemination
  description: >-
    After mucosal entry, Y. enterocolitica can associate with CD103-positive
    dendritic cells and monocyte-derived cells in the lamina propria and spread
    to mesenteric lymph nodes, spleen, and liver.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: mesenteric lymph node
    term:
      id: UBERON:0002509
      label: mesenteric lymph node
  downstream:
  - target: pYV Type III Secretion and Yop Effector Injection
    description: >-
      Disseminating pathogenic organisms use the pYV-encoded type III secretion
      apparatus to deliver anti-host Yop proteins into interacting phagocytes.
    evidence:
    - reference: PMID:8709853
      reference_title: "Mutational analysis of the Yersinia enterocolitica virC operon: characterization of yscE, F, G, I, J, K required for Yop secretion and yscH encoding YopR."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Pathogenic yersiniae secrete the Yop anti-host proteins using a type-III
        secretion pathway.
      explanation: >-
        The pYV virC mutational study establishes type III secretion as the
        export pathway for Yop anti-host proteins.
  - target: Deferoxamine-Potentiated Systemic Yersinia Replication
    description: >-
      Organisms that reach reticuloendothelial sites can cause septicemia and
      focal abscesses when iron overload or deferoxamine exposure permits
      systemic replication.
    evidence:
    - reference: PMID:15254824
      reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
        terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and
        (3) septicemia leading to focal abscesses in spleen and liver.
      explanation: >-
        The review links intestinal yersiniosis to severe septicemic spread into
        liver and spleen, the branch that deferoxamine can potentiate.
  evidence:
  - reference: PMID:27107739
    reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After colonisation of the small intestine Ye invades the Peyer's patches
      (PPs) via M cells and disseminates to the mesenteric lymph nodes (MLNs),
      spleen and liver.
    explanation: >-
      Oral infection in mice supports spread from the small intestine to regional
      lymph nodes and systemic reticuloendothelial organs.
- name: Cold-Stored Blood Product Yersinia Inoculation
  description: >-
    Cold-stored red blood cell products can permit contaminating Y.
    enterocolitica to proliferate before transfusion-associated bloodstream
    inoculation.
  downstream:
  - target: Bacteremia
    description: >-
      Transfusion of a contaminated blood product can seed bacteria directly
      into the bloodstream and produce severe septic disease.
    evidence:
    - reference: PMID:26403101
      reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        The septic form is also seen after the administration of blood, blood
        products or dialysis fluids stored at low temperature (4 C), in which Y.
        enterocolitica rods may grow.
      explanation: >-
        The review supports transfusion or dialysis fluids stored cold as a
        route to severe septic yersiniosis.
  evidence:
  - reference: PMID:33341965
    reference_title: Establishment of transfusion-relevant bacteria reference strains for red blood cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      two Y. enterocolitica strains reached the stationary phase between days 14
      and 21 of RBCC storage with a bacterial concentration of approximately 109
      CFU/ml.
    explanation: >-
      The ex-vivo blood-product study shows that Y. enterocolitica can
      proliferate during refrigerated red-blood-cell storage.
- name: pYV Type III Secretion and Yop Effector Injection
  description: >-
    Pathogenic Y. enterocolitica carries the pYV plasmid, whose Ysc secretion
    machinery exports Yop proteins into host immune cells.
  biological_processes:
  - preferred_term: protein secretion by the type III secretion system
    term:
      id: GO:0030254
      label: protein secretion by the type III secretion system
  downstream:
  - target: YopJ-Driven Macrophage Survival-Pathway Blockade
    description: >-
      Translocated YopJ/YopP blocks macrophage survival signaling and promotes
      death of innate immune cells.
    evidence:
    - reference: PMID:22563435
      reference_title: "YopJ-induced caspase-1 activation in Yersinia-infected macrophages: independent of apoptosis, linked to necrosis, dispensable for innate host defense."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        YopJ inhibits survival response pathways in macrophages, causing cell
        death.
      explanation: >-
        Macrophage infection experiments support YopJ-driven blockade of host
        survival pathways as a cell-death mechanism.
  evidence:
  - reference: PMID:8709853
    reference_title: "Mutational analysis of the Yersinia enterocolitica virC operon: characterization of yscE, F, G, I, J, K required for Yop secretion and yscH encoding YopR."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The components of the secretion machinery are encoded by three loci on the
      pYV plasmid: virA, virB, and virC.
    explanation: >-
      The mutational analysis maps the Yop type III secretion apparatus to the
      pYV virulence plasmid.
- name: YopJ-Driven Macrophage Survival-Pathway Blockade
  description: >-
    YopJ and related Yop effectors suppress macrophage survival and innate
    immune signaling, impairing bacterial clearance and amplifying ileal and
    mesenteric inflammation.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: effector-mediated suppression of host innate immune response
    term:
      id: GO:0140403
      label: effector-mediated suppression of host innate immune response
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
  downstream:
  - target: Ileitis
    description: >-
      Anti-phagocyte Yop effector activity lets organisms persist in the ileal
      lymphoid tissue where terminal ileitis develops.
    evidence:
    - reference: PMID:8363822
      reference_title: "Experimental Yersinia enterocolitica infection in rodents: a model for human yersiniosis."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        experimental Y. enterocolitica infection in rodents resembles
        yersiniosis in humans and thus offers extraordinary opportunities to
        study the sequential steps of the infectious process.
      explanation: >-
        The animal-model review supports Yop-dependent rodent infection as a
        model of the sequential tissue steps leading to human intestinal
        yersiniosis.
  - target: Lymphadenitis
    description: >-
      Failed phagocyte clearance and Yop effector delivery support bacterial
      persistence in mesenteric lymph nodes.
    evidence:
    - reference: PMID:27107739
      reference_title: Mononuclear phagocytes contribute to intestinal invasion and dissemination of Yersinia enterocolitica.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-

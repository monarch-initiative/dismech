name: Yersinia Enterocolitica Infectious Disease
creation_date: '2026-09-27T21:14:43Z'
updated_date: '2026-09-27T21:14:43Z'
category: Infectious Disease
description: >-
  Yersinia enterocolitica infectious disease is a foodborne zoonotic infection
  in which ingestion of Yersinia enterocolitica from contaminated pork or other
  vehicles leads to invasive ileal enterocolitis, mesenteric lymphadenitis, and
  pseudoappendicitis, with septicemia and focal hepatic or splenic abscesses in
  vulnerable iron-overloaded or immunocompromised hosts.
disease_term:
  preferred_term: Yersinia enterocolitica infectious disease
  term:
    id: MONDO:0042370
    label: Yersinia enterocolitica infectious disease
parents:
- Yersinia infectious disease
- Bacterial enteritis
synonyms:
- Yersinia enterocolitica infection
- intestinal yersiniosis
- yersiniosis
definitions:
- name: Intestinal yersiniosis clinical spectrum
  definition_type: CASE_DEFINITION
  description: >-
    Intestinal yersiniosis spans enteritis, terminal ileitis with mesenteric
    lymphadenitis or pseudoappendicitis, and septicemic disease with splenic or
    hepatic abscesses.
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      The review defines the major enteric, pseudoappendiceal, and septicemic
      clinical forms captured by this disease entry.
infectious_agent:
- name: Yersinia enterocolitica
  infectious_agent_term:
    preferred_term: Yersinia enterocolitica
    term:
      id: NCBITaxon:630
      label: Yersinia enterocolitica
  description: >-
    Human yersiniosis is caused by pathogenic Y. enterocolitica biotypes that
    combine chromosomal virulence genes with the pYV virulence plasmid encoding
    YadA and the Ysc-Yop type III secretion system.
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      INTRODUCTION: Y. enterocolitica is the causative agent of yersiniosis - a
      foodborne zoonosis with substantial importance to public health.
    explanation: >-
      The review identifies Y. enterocolitica as the bacterial cause of
      yersiniosis.
  - reference: PMID:28400007
    reference_title: Evaluation of virulence genes in Yersinia enterocolitica strains using SYBR Green real-time PCR.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The virulence of the strains belonging to biotypes 1B and 2-5 depends on
      the presence of both chromosomal and plasmid-borne genes.
    explanation: >-
      The molecular survey supports modeling pathogenic Y. enterocolitica as
      requiring both chromosomal and plasmid-encoded virulence functions.
transmission:
- name: Pork-associated foodborne zoonotic transmission
  description: >-
    Human infection is commonly acquired by eating raw, undercooked, or
    otherwise contaminated pork from pigs that carry pathogenic Y.
    enterocolitica in tonsillar tissue at slaughter.
  evidence:
  - reference: PMID:26403101
    reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Swine play an important role as a reservoir of Y. enterocolitica and
      insufficiently thermally processed pork is the main source of infection to
      humans.
    explanation: >-
      The review supports swine as a reservoir and undercooked pork as a major
      exposure vehicle.
  - reference: PMID:29307129
    reference_title: Identification and characterization of Yersinia enterocolitica strains isolated from pig tonsils at slaughterhouse in Central Italy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yersinia enterocolitica causes foodborne disease in humans and infections
      are usually acquired from contaminated raw or undercooked pork. Pigs are
      considered the primary reservoir of human pathogenic bio-serotypes.
    explanation: >-
      Swine tonsil surveillance supports the reservoir and raw/undercooked pork
      transmission route.
progression:
- phase: Acute enterocolitis and pseudoappendicitis
  notes: >-
    Most symptomatic disease is localized to the intestine and regional
    mesenteric lymph nodes, producing enteritis or terminal-ileitis
    pseudoappendicitis.
  evidence:
  - reference: PMID:15254824
    reference_title: "[Intestinal yersiniosis. Clinical importance, epidemiology, diagnosis, and prevention]."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Intestinal yersiniosis may manifest in humans as (1) enteritis, (2)
      terminal ileitis, mesenteric lymphadenitis, or pseudoappendicitis, and (3)
      septicemia leading to focal abscesses in spleen and liver.
    explanation: >-
      The review distinguishes localized enteritis and terminal ileitis with
      mesenteric adenitis from disseminated septicemia.
- phase: Iron-potentiated septicemia
  notes: >-
    Iron overload or deferoxamine therapy can shift infection toward invasive
    septicemia because ferrioxamine can supply iron for systemic bacterial
    growth.
  evidence:
  - reference: PMID:12019084
    reference_title: Comparison of the effects of deferiprone versus deferoxamine on growth and virulence of Yersinia enterocolitica.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In a mouse experimental model of infection, the 50% lethal dose (LD(50))
      of strain IP864 was decreased by more than 5 log units in mice pretreated
      with deferoxamine, while a deferiprone pretreatment did not affect it.
    explanation: >-
      Deferoxamine potentiated Y. enterocolitica virulence in vivo, supporting
      the iron-chelator branch toward systemic infection.
- phase: Post-enteric reactive arthritis
  notes: >-
    A subset of patients develops sterile asymmetric oligoarthritis several days
    to weeks after the gastrointestinal infection.
  evidence:
  - reference: PMID:40473988
    reference_title: "Reactive arthritis: a comprehensive journey through diagnostic findings."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Reactive arthritis, initially described at the beginning of the twentieth
      century, is characterized by a sterile articular inflammation occurring
      several days to weeks after a bacterial gastrointestinal or urogenital
      infection.
    explanation: >-
      The review supports the delayed post-enteric timing and sterile
      inflammatory nature of reactive arthritis.
prevalence:
- population: Reported non-pestis yersiniosis, United States, 2016-2023
  measure_type: ANNUAL_INCIDENCE
  notes: >-
    Non-pestis yersiniosis had the largest reported-incidence increase among
    bacterial enteric infections in the United States from 2016 to 2023; pork
    and dairy were the leading food vehicles among 1971-2024 outbreaks with an
    identified vehicle.
  evidence:
  - reference: PMID:42720049
    reference_title: "Fifty Years of Non-pestis Yersinia Outbreaks in the United States: Patterns, Vehicles, and Surveillance Challenges, 1971-2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      non-pestis yersiniosis experienced the largest increase in reported
      incidence of any bacterial enteric infection in the United States during
      2016-2023
    explanation: >-
      The outbreak review establishes the recent United States incidence trend
      for non-pestis yersiniosis.
- population: Slaughterhouse pigs in Central Italy
  measure_type: CARRIER_FREQUENCY
  percentage: 9.31
  notes: >-
    Pig tonsillar carriage captures the food-animal reservoir that can
    contaminate carcasses during slaughter.
  evidence:
  - reference: PMID:29307129
    reference_title: Identification and characterization of Yersinia enterocolitica strains isolated from pig tonsils at slaughterhouse in Central Italy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yersinia enterocolitica was isolated from 35 out of 376 (9.31%) samples.
    explanation: >-
      The slaughterhouse survey directly measured the fraction of sampled pig
      tonsils carrying Y. enterocolitica.
genetic:
- name: HLA-B27
  relationship_type: SUSCEPTIBILITY
  association: HLA-B27 predisposes to Yersinia enterocolitica-associated reactive arthritis
  evidence:
  - reference: PMID:7221767
    reference_title: Yersinia arthritis mimicking acute rheumatic fever. A case report.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A reactive or post-infectious arthritis is a well-known complication of
      yersinia enterocolitica infection and tends to occur in patients with the
      HLA-B27 haplotype.
    explanation: >-
      The case-report background identifies HLA-B27 as a host haplotype
      associated with the post-infectious arthritis complication of Y.
      enterocolitica.
environmental:
- name: Pork and dairy food exposure
  description: >-
    Pork and dairy products are repeatedly implicated food vehicles for
    non-pestis Yersinia outbreaks, with raw or undercooked pork providing the
    central route from the swine reservoir to human intestinal exposure.
  influences_mechanisms:
  - target: Pork-Borne Yersinia enterocolitica Ingestion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Consumption of contaminated pork or dairy delivers viable Y.
      enterocolitica to the intestine.
    evidence:
    - reference: PMID:26403101
      reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Swine play an important role as a reservoir of Y. enterocolitica and
        insufficiently thermally processed pork is the main source of infection
        to humans.
      explanation: >-
        The review supports undercooked pork as a major exposure route for
        human ingestion of Y. enterocolitica.
    - reference: PMID:42720049
      reference_title: "Fifty Years of Non-pestis Yersinia Outbreaks in the United States: Patterns, Vehicles, and Surveillance Challenges, 1971-2024."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pork (46%) and dairy (18%) products were the most frequently identified
        food vehicles
      explanation: >-
        The outbreak review identifies pork and dairy as the most common food
        vehicles in United States non-pestis Yersinia outbreaks.
  evidence:
  - reference: PMID:42720049
    reference_title: "Fifty Years of Non-pestis Yersinia Outbreaks in the United States: Patterns, Vehicles, and Surveillance Challenges, 1971-2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pork (46%) and dairy (18%) products were the most frequently identified
      food vehicles
    explanation: >-
      Pork and dairy were the leading outbreak vehicles in the United States
      non-pestis Yersinia outbreak review.
- name: Cold-chain persistence and food-processing contamination
  description: >-
    Psychrotolerance and biofilm formation let Y. enterocolitica persist across
    refrigerated food-processing and retail settings, increasing the chance
    that contaminated food remains infectious at consumption.
  influences_mechanisms:
  - target: Pork-Borne Yersinia enterocolitica Ingestion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Cold-chain survival and food-processing biofilms amplify contamination
      before the contaminated food is swallowed.
    evidence:
    - reference: PMID:41539755
      reference_title: "Deciphering the potential risks of Yersinia enterocolitica across multi-points in food chain: prevalence, biofilm, and cross-stage transmission routes."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Yersinia enterocolitica, a major foodborne zoonotic pathogen with the
        capabilities of biofilm formation and psychrotolerance, poses critical
        risks to food transportation and cold-chain safety.
      explanation: >-
        The food-chain survey links biofilm formation and psychrotolerance to
        persistence during transport and cold-chain handling.
    - reference: PMID:26403101
      reference_title: Yersiniosis - a zoonotic foodborne disease of relevance to public health.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: >-
        Y. enterocolitica, as a typical psychrophil, multiplies in a food
        (neutral pH, stored at 5 °C) from 10/mL to 2.8 × 107/mL in 5 days
      explanation: >-
        The review describes low-temperature bacterial multiplication in food as
        the intermediate that can maintain or amplify infectious inocula.
  evidence:
  - reference: PMID:41539755
    reference_title: "Deciphering the potential risks of Yersinia enterocolitica across multi-points in food chain: prevalence, biofilm, and cross-stage transmission routes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Yersinia enterocolitica, a major foodborne zoonotic pathogen with the
      capabilities of biofilm formation and psychrotolerance, poses critical
      risks to food transportation and cold-chain safety.
    explanation: >-
      The study supports cold-chain persistence as a food-safety exposure
      context for Y. enterocolitica.
- name: Cold-stored red blood cell contamination
  description: >-
    Y. enterocolitica can proliferate in refrigerated red blood cell
    concentrates, making contaminated transfusion products a rare but severe
    route to systemic yersiniosis.
  influences_mechanisms:
  - target: Cold-Stored Blood Product Yersinia Inoculation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Transfusion of a contaminated red-blood-cell unit bypasses intestinal
      acquisition and inoculates cold-amplified organisms into the bloodstream.
    evidence:
    - reference: PMID:33341965
      reference_title: Establishment of transfusion-relevant bacteria reference strains for red blood cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        two Y. enterocolitica strains reached the stationary phase between days
        14 and 21 of RBCC storage with a bacterial concentration of approximately
        109  CFU/ml.
      explanation: >-
        Growth in red blood cell concentrates explains how rare contamination
        can amplify during cold blood-bank storage.
  evidence:
  - reference: PMID:33341965
    reference_title: Establishment of transfusion-relevant bacteria reference strains for red blood cells.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      Red blood cell concentrates (RBCC) are susceptible to bacterial
      contamination despite cold storage.
    explanation: >-
      The transfusion-reference-strain study establishes that cold-stored red
      blood cell products remain vulnerable to bacterial contamination.

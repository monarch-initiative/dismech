      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Phagocyte-Associated Mesenteric Dissemination
    treatment_effect: INHIBITS
    description: >-
      Active antibiotics reduce viable organisms responsible for systemic
      dissemination in invasive yersiniosis.
  - target: YstA Heat-Stable Enterotoxin Secretion
    treatment_effect: INHIBITS
    description: >-
      Active antibiotics reduce the viable enteric bacterial population that can
      produce YstA enterotoxin during symptomatic intestinal disease.
  evidence:
  - reference: PMID:10803262
    reference_title: "[Susceptibility to selected antibiotics of Yersinia enterocolitica 03 strains, carrying and not carrying plasmid pYV]."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Third-generation cephalosporins such as cefotaxime and ceftriaxone and a
      fluoroquinolone (ciprofloxacin) were the most active antimicrobial agents,
      tested followed by aztreonam, imipenem, trimethoprim, tetracycline,
      gentamicin, chloramphenicol, amoxycillin/clavulanate, cefaclor,
      cefuroxime, amikacin, furazolidone and sulphamethoxazole.
    explanation: >-
      Susceptibility testing of clinical serotype O:3 isolates supports
      third-generation cephalosporins and ciprofloxacin as active agents against
      Y. enterocolitica.

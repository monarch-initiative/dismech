name: Vitamin D-Dependent Rickets Type 2A
synonyms:
- VDDR2A
- Hereditary vitamin D-resistant rickets
- HVDRR
- Hereditary 1,25-dihydroxyvitamin D-resistant rickets
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 2A is impaired calcitriol signaling caused
  usually by biallelic loss-of-function variants in VDR and, very rarely, by a
  heterozygous dominant-negative VDR variant. Allele-specific defects can impair
  receptor production, ligand binding, DNA binding, RXR heterodimerization, or
  coactivator recruitment. The resulting loss of VDR-regulated intestinal
  calcium and phosphate absorption causes secondary hyperparathyroidism,
  hypophosphatemia, and rickets, while intact hormone production and dysregulated
  receptor-mediated homeostasis make circulating calcitriol characteristically
  high. Hormone resistance is not
  uniformly complete: some genotypes respond to supraphysiologic active vitamin
  D plus calcium, whereas severe oral-treatment-refractory disease requires
  intravenous calcium. Alopecia reflects a separate ligand-independent hair-cycle
  function of VDR; it is frequent but not universal and is strongly genotype
  dependent.
disease_term:
  preferred_term: vitamin D-dependent rickets, type 2A
  term:
    id: MONDO:0010186
    label: vitamin D-dependent rickets, type 2A
parents:

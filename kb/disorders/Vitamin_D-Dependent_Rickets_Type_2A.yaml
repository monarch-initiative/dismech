inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  description: >-
    The usual disease mechanism is a homozygous or compound-heterozygous
    pathogenic VDR genotype. Core skeletal and biochemical findings are
    consistently expressed among reported affected families and clinically
    ascertained series, while severity and alopecia are variably expressed;
    population penetrance among pathogenic-variant carriers is undetermined.
    Consanguinity increases the chance of homozygosity. Exceptionally, complete
    uniparental isodisomy of chromosome 12 can make one parental VDR allele
    homozygous and changes recurrence-risk counseling without constituting a new
    inheritance mode.
  evidence:
  - reference: PMID:2849209
    reference_title: Point mutations in the human vitamin D receptor gene associated with hypocalcemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two families with affected children homozygous for this autosomal recessive
      disorder were studied for abnormalities in the intracellular vitamin D
      receptor (VDR) and its gene.
    explanation: >-
      Establishes homozygous transmission in the founding molecular study.
  - reference: PMID:28377956
    reference_title: "Hereditary 1,25-dihydroxyvitamin D-resistant rickets (HVDRR) caused by a VDR mutation: A novel mechanism of dominant inheritance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with HVDRR often have consanguinity in the family and display a
      number of clinical features including early onset rickets, hypocalcemia,
      and secondary hyperparathyroidism.
    explanation: >-
      Supports consanguinity as a common risk context for the usual recessive
      disease while identifying the characteristic skeletal and biochemical
      phenotype.
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for initial laboratory tests, the PTH and Alkaline phosphatase (ALP)
      were high in all participants
    explanation: >-
      All 42 clinically ascertained patients had the characteristic biochemical
      disorder, documenting consistent expression among affected cohort members
      but not estimating penetrance among pathogenic-variant carriers.
  - reference: PMID:36705686
    reference_title: "Genotypic Spectrum and its Correlation with Alopecia and Clinical Response in Hereditary Vitamin D Resistant Rickets: Our Experience and Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alopecia was present in 51.4% of non-truncating (NT) ligand-binding domain
      (LBD) variants, whereas it was universal in truncating LBD and all DNA
      binding-domain (DBD) variants.
    explanation: >-
      Demonstrates allele-class-dependent expressivity of alopecia rather than a
      universal hair phenotype.
  - reference: PMID:26153892
    reference_title: "Detection of Hereditary 1,25-Hydroxyvitamin D-Resistant Rickets Caused by Uniparental Disomy of Chromosome 12 Using Genome-Wide Single Nucleotide Polymorphism Array."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide SNP array of the family (the patient and her parents) showed
      complete maternal isodisomy of chromosome 12.
    explanation: >-
      Establishes complete maternal chromosome-12 isodisomy as an exceptional
      route to VDR homozygosity.
- name: Rare autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Rare heterozygous VDR alleles can act dominantly by inhibiting the remaining
    wild-type receptor. This is an exceptional inheritance mechanism rather than
    the usual pattern for VDDR2A.
  evidence:
  - reference: PMID:28377956
    reference_title: "Hereditary 1,25-dihydroxyvitamin D-resistant rickets (HVDRR) caused by a VDR mutation: A novel mechanism of dominant inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, we found a dominant-negative mutant of VDR causing
      dominantly inherited HVDRR through a constitutive corepressor interaction,
      a mechanism similar to that in dominantly inherited thyroid hormone
      receptor mutations.
    explanation: >-
      Establishes the rare dominant-negative mechanism and autosomal dominant
      transmission in a segregating family.
genetic:
- name: VDR pathogenic variants
  gene_term:
    preferred_term: VDR
    term:
      id: hgnc:12679
      label: VDR
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Most affected individuals have homozygous or compound-heterozygous VDR
    variants; complete maternal chromosome-12 isodisomy is a rare alternative
    route to homozygosity. Representative alleles span non-truncating
    ligand-binding-domain variants such as p.Ile268Thr and p.Arg343Cys,
    DNA-binding-domain variants such as p.Val26Met, the RXR-binding-domain
    p.Arg343His variant, splice-site variants, truncating variants, and
    compound-heterozygous combinations. Functional consequences include absent
    or truncated receptor, impaired ligand binding, impaired DNA binding,
    defective RXR heterodimerization, and defective coactivator recruitment;
    residual activity, alopecia, and treatment response vary by allele class.
    Exceptionally, heterozygous dominant-negative alleles such as p.Q400LfsX7
    inhibit wild-type VDR through constitutive corepressor retention and cause
    dominant disease.
  evidence:
  - reference: PMID:2849209
    reference_title: Point mutations in the human vitamin D receptor gene associated with hypocalcemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each family, a different single nucleotide mutation was found in the DNA
      binding domain of the protein; one family near the tip of the first zinc
      finger (Gly----Asp) and one at the tip of the second zinc finger
      (Arg----Gly).
    explanation: >-
      Identifies the causal VDR variants and localizes them to the DNA-binding
      domain.
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic testing of the VDR gene in our cohort identified six
      different gene variants c.885 C>A (p.Tyr295Ter), c.88 C>T (p.Arg30Ter),
      c.1036G>A (p.Val346Met), c.820C>T (p.Arg274Cys), c.803 T>C (p.Ile268Thr),
      and c.2T>G (p.Met1?).
    explanation: >-
      Documents the allelic spectrum in the largest reported cohort.
  - reference: PMID:28377956
    reference_title: "Hereditary 1,25-dihydroxyvitamin D-resistant rickets (HVDRR) caused by a VDR mutation: A novel mechanism of dominant inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutant had a dominant-negative effect on wild-type-VDR, and the ligand
      binding affinity of Q400LfsX7-VDR was completely impaired.
    explanation: >-
      Functional testing identifies Q400LfsX7 as a dominant-negative causal VDR
      allele rather than treating the accompanying functionally normal R370H
      variant as causal.
  - reference: PMID:15308610
    reference_title: Hereditary 1,25-dihydroxyvitamin D resistant rickets due to a mutation causing multiple defects in vitamin D receptor function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, we describe a novel mutation, I268T, in the VDR
      ligand-binding domain that alters ligand binding, retinoid X receptor
      heterodimerization, and coactivator binding.
    explanation: >-
      Establishes p.Ile268Thr as a ligand-binding-domain allele and documents
      its experimentally measured multiple functional defects.
  - reference: PMID:19815438
    reference_title: "Hereditary 1,25-dihydroxyvitamin D-resistant rickets with alopecia resulting from a novel missense mutation in the DNA-binding domain of the vitamin D receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that the child was homozygous for a unique missense mutation in
      the VDR gene that converted valine to methionine at amino acid 26 (V26M)
      in the VDR DNA-binding domain (DBD).
    explanation: >-
      Provides a representative DNA-binding-domain missense allele.
  - reference: PMID:29127362
    reference_title: Functional Analysis of VDR Gene Mutation R343H in A Child with Vitamin D-Resistant Rickets with Alopecia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel homozygous missense R343H mutation in the exon 9 of VDR residing
      in the retinoid X receptor (RXR)-binding domain was identified.
    explanation: >-
      Provides the p.Arg343His example and its location at the RXR-binding
      interface.
  - reference: PMID:42438800
    reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing using whole-exome sequencing identified a homozygous
      pathogenic variant in the VDR (c.1027C>T, p.R343C), confirming the
      diagnosis of VDDR2A. Both parents were found to be heterozygous carriers.
    explanation: >-
      Provides the p.Arg343Cys example and recessive segregation.
  - reference: PMID:42438800
    reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The VDR c.1027C>T (p.R343C) variant results in a missense substitution of
      arginine, a polar amino acid, to cysteine, a neutral and slight polar amino
      acid, at position 343, which is located within the LBD of the VDR [12].
    explanation: >-
      Locally establishes p.Arg343Cys as an LBD allele without inferring a
      specific interface defect or functional consequence from this case.
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several types of variants have been identified in the VDR gene as the
      leading cause of HVDDR-II, such as non-sense, substitutions, insertions,
      duplications, deletions, and splice-site (2).
    explanation: >-
      Documents the broad causal variant classes, including splice-site alleles.
  - reference: PMID:19049339
    reference_title: "Compound heterozygous mutations in the vitamin D receptor in a patient with hereditary 1,25-dihydroxyvitamin D-resistant rickets with alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, we describe a patient with compound heterozygous mutations in
      the VDR that results in HVDRR with alopecia.
    explanation: >-
      Establishes compound heterozygosity as a disease-causing allelic state.
  - reference: PMID:26153892
    reference_title: "Detection of Hereditary 1,25-Hydroxyvitamin D-Resistant Rickets Caused by Uniparental Disomy of Chromosome 12 Using Genome-Wide Single Nucleotide Polymorphism Array."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report of HVDRR caused by UPD, and the third case of
      complete UPD of chromosome 12, in the published literature.
    explanation: >-
      Separates the exceptional route to homozygosity from the usual biparental
      recessive inheritance.
pathophysiology:
- name: Absent or Truncated VDR Protein
  description: >-
    This allele-class branch applies when biallelic nonsense, frameshift, or
    other loss-of-function variants prevent production of a functional VDR
    protein. Loss of the receptor abolishes both ligand-activated transcription
    and the ligand-independent receptor function needed for hair cycling.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: VDR
    term:
      id: hgnc:12679
      label: VDR
  genetic_context:
    gene:
      preferred_term: VDR
      term:
        id: hgnc:12679
        label: VDR
    allele_type: Biallelic null or truncating variants
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: This branch is one alternative VDR defect and is not asserted for every affected individual.
  evidence:
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alopecia is associated with VDR mutations that impair DNA binding, RXR
      heterodimerization, or production of the VDR, while mutations that alter
      VDR affinity for 1,25(OH)2D or disrupt coactivator interactions do not
      cause alopecia.
    explanation: >-
      Distinguishes loss of receptor production from other allele-specific
      defects and links this class to loss of the hair-cycle function.
  downstream:
  - target: Impaired VDR-Regulated Transcription
    causal_link_type: DIRECT
  - target: Disrupted Ligand-Independent VDR Hair-Cycle Function
    causal_link_type: DIRECT

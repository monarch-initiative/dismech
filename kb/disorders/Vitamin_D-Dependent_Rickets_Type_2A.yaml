- name: Disrupted Ligand-Independent VDR Hair-Cycle Function
  description: >-
    Hair distribution is initially normal, but receptor absence or variants that
    disrupt DNA binding or RXR heterodimerization can impair the unliganded VDR
    function required to reinitiate the hair cycle. Ligand-affinity and
    coactivator-recruitment defects can preserve this branch, explaining why
    alopecia is genotype dependent and absent in some affected individuals.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: hair cycle
    term:
      id: GO:0042633
      label: hair cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, affected children are born with normal distribution of hair,
      and alopecia develops later due to failure of normal hair follicle cycling,
      which is dependent upon unliganded actions of the VDR.
    explanation: >-
      Supports the postnatal, ligand-independent hair-cycle mechanism.
  downstream:
  - target: Alopecia
    causal_link_type: DIRECT

- name: Compensatory Secondary Hyperparathyroidism
  description: >-
    Reduced calcium absorption increases parathyroid hormone secretion. The
    response can preserve normocalcemia through renal calcium conservation and
    bone resorption while simultaneously promoting renal phosphate loss.
  role: central_effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42438800
    reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The preserved serum calcium level may reflect compensatory secondary
      hyperparathyroidism, in which markedly elevated PTH maintains normocalcemia
      through increased renal calcium reabsorption and bone resorption.
    explanation: >-
      Explains why receptor resistance can produce marked secondary
      hyperparathyroidism without measured hypocalcemia.
  downstream:
  - target: Secondary hyperparathyroidism
    causal_link_type: DIRECT
  - target: PTH-Driven Renal Phosphate Wasting
    causal_link_type: DIRECT
  - target: Elevated Circulating Calcitriol in VDR Resistance
    causal_link_type: DIRECT
    description: Elevated PTH stimulates renal calcitriol production.
- name: PTH-Driven Renal Phosphate Wasting
  description: >-
    Elevated parathyroid hormone reduces renal phosphate reabsorption, adding a
    phosphate deficit to impaired intestinal mineral uptake.
  role: central_effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42438800
    reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, elevated PTH promotes renal phosphate wasting, contributing
      to hypophosphatemia.
    explanation: >-
      Directly supports the PTH-to-phosphate-wasting step in the mineral pathway.
  downstream:
  - target: Hypophosphatemia
    causal_link_type: DIRECT
  - target: Defective Skeletal Mineralization
    causal_link_type: DIRECT
    description: Phosphate wasting further reduces substrate for hydroxyapatite deposition.

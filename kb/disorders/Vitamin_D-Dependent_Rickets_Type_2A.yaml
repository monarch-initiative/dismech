treatments:
- name: High-Dose Calcium Repletion
  description: >-
    Because the receptor cannot respond to any dose of hormone, treatment bypasses
    the absorptive defect rather than correcting it: very high oral calcium, or
    long-term intravenous calcium infusion in refractory patients, delivers
    calcium by passive routes that do not require vitamin D receptor signalling.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium(2+)
      term:
        id: CHEBI:29108
        label: calcium(2+)
  target_mechanisms:
  - target: Calcitriol-Unresponsive Intestinal Calcium Malabsorption
    treatment_effect: BYPASSES
    description: >-
      Supplying calcium at high enteral concentration or intravenously bypasses
      the receptor-dependent active absorption pathway that is lost.
    evidence:
    - reference: PMID:38872968
      reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Seven patients were treated with high doses of oral calcium, while 35
        patients were treated with IV calcium infusion.
      explanation: >-
        Documents the two calcium-bypass routes used in the largest reported
        cohort.
animal_models:
- name: VDR-null mouse (targeted ablation of the second zinc finger)
  species: Mouse
  genotype: Vdr knockout, second zinc finger of the DNA-binding domain deleted
  publication: PMID:9275211
  description: >-
    The reference model of this disorder, engineered to reproduce the human
    DNA-binding-domain lesion. Mice are normal at birth and develop hypocalcemia,
    hyperparathyroidism, rickets and osteomalacia on the human timeline, together
    with progressive alopecia that dietary vitamin D deficiency does not cause.
  evidence:
  - reference: PMID:9275211
    reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have generated a mouse model of VDDR II by targeted ablation of the
      second zinc finger of the VDR DNA-binding domain.
    explanation: >-
      Establishes that the model was engineered specifically to reproduce the
      human DNA-binding-domain lesion, which is what makes it informative for
      this disorder rather than for vitamin D deficiency generally.
  modeled_mechanisms:
  - target: Defective Skeletal Mineralization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the full mineral and skeletal sequence, and shows the growth-plate
      lesion appearing before overt rickets.
    limitations: >-
      The engineered allele removes the second zinc finger specifically; human
      disease alleles are heterogeneous across the DNA-binding and ligand-binding
      domains, so the model represents the DNA-binding class rather than the whole
      allelic spectrum.
    readouts:
    - name: Hypertrophic chondrocyte zone width in the growth plate
      target: Defective Skeletal Mineralization
      direction: INCREASED
      interpretation: >-
        Expansion of the hypertrophic zone is the growth-plate correlate of the
        mineralization defect, and it precedes radiographic rickets in this model.
      evidence:
      - reference: PMID:9275211
        reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Rickets and osteomalacia are seen by day 35; however, as early as day
          15, there is an expansion in the zone of hypertrophic chondrocytes in
          the growth plate.
        explanation: >-
          Reports the histological measurement and its timing relative to overt
          rickets.
    evidence:
    - reference: PMID:9275211
      reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        They become hypocalcemic at 21 days of age, at which time their
        parathyroid hormone (PTH) levels begin to rise.
      explanation: >-
        Establishes that the model reproduces the hypocalcemia and secondary
        hyperparathyroidism that drive the mineralization failure in patients.
  - target: Alopecia from Ligand-Independent Receptor Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Progressive alopecia develops from four weeks of age and is absent from
      dietary vitamin D deficiency, matching the human observation that alopecia
      tracks receptor loss rather than hormone deficiency.
    limitations: >-
      Alopecia is present in some but not all human kindreds, so the model
      reproduces the alopecic subset rather than the disorder uniformly.
    evidence:
    - reference: PMID:9275211
      reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to animals made vitamin D deficient by dietary means, and like
        some patients with VDDR II, these mice develop progressive alopecia from
        the age of 4 weeks.
      explanation: >-
        Contrasts receptor ablation with dietary deficiency, isolating the
        receptor-dependent, hormone-independent origin of the alopecia.
- name: Keratinocyte-targeted ligand-binding-null VDR transgene in VDR-null mice
  species: Mouse
  genotype: Vdr knockout carrying a keratinocyte-targeted VDR transgene with a hormone-binding-domain mutation abolishing ligand binding
  publication: PMID:15591533
  description: >-
    A rescue experiment that separates the two arms of the disorder. Restoring a
    receptor that cannot bind hormone, in keratinocytes only, restores normal hair
    cycling - which shows the hair-follicle function of the receptor is ligand
    independent and explains why no dose of vitamin D or calcitriol corrects
    alopecia in patients.
  evidence:
  - reference: PMID:15591533
    reference_title: Ligand-independent actions of the vitamin D receptor maintain hair follicle homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To determine which functional domains of the VDR are required for hair
      cycling, mutant VDR transgenes were targeted to the keratinocytes of VDR
      null mice.
    explanation: >-
      States the design of the transgenic rescue, which is what makes this system
      informative for the alopecia node specifically.
  modeled_mechanisms:
  - target: Alopecia from Ligand-Independent Receptor Loss
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Keratinocyte-restricted expression of a ligand-binding-dead receptor rescues
      the hair cycle, demonstrating the mechanism this node asserts.
    limitations: >-
      A transgenic rescue rather than a disease model; it establishes sufficiency
      of the receptor protein for hair cycling but does not model any human
      genotype.
    readouts:
    - name: Hair cycling in keratinocyte-rescued VDR-null mice
      target: Alopecia from Ligand-Independent Receptor Loss
      direction: RESTORED
      interpretation: >-
        Normal hair cycling despite an inability to bind hormone localizes the
        alopecia mechanism to a ligand-independent receptor function.
      evidence:
      - reference: PMID:15591533
        reference_title: Ligand-independent actions of the vitamin D receptor maintain hair follicle homeostasis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Keratinocyte-specific expression of a VDR transgene with a mutation in
          the hormone-binding domain that abolishes ligand binding restores normal
          hair cycling in VDR null mice
        explanation: >-
          Reports the rescue and the direction of the effect.
    evidence:
    - reference: PMID:15591533
      reference_title: Ligand-independent actions of the vitamin D receptor maintain hair follicle homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These studies demonstrate that the effects of the VDR on the hair follicle
        are ligand independent and point to novel molecular and cellular actions
        of this nuclear receptor.
      explanation: >-
        States the conclusion that grounds the ligand-independent framing of this
        node.
biochemical:
- name: 1,25-dihydroxyvitamin D (calcitriol)
  presence: Elevated
  biomarker_term:
    preferred_term: 1,25-Dihydroxyvitamin D3 Measurement
    term:
      id: NCIT:C179754
      label: 1,25-Dihydroxyvitamin D3 Measurement
  context: >-
    The single measurement that separates the type 2 disorders from every other
    member of the series. Because the negative feedback that normally suppresses
    calcitriol synthesis is itself receptor-mediated, receptor resistance drives
    calcitriol UP rather than down - the inverse of types 1A, 1B and 3, where it
    is low. It is the analyte the grouping rationale rests on, so it is recorded
    here rather than left implicit.
  notes: >-
    Recorded as a biochemical marker rather than a phenotype because no HPO term
    exists for an elevated 1,25-dihydroxyvitamin D concentration. HP:0100512
    covers only a DECREASED vitamin D concentration and would state the opposite
    of the finding, so no term is bound - a candidate for an HPO new-term request.
  evidence:
  - reference: PMID:38872968
    reference_title: "Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with HVDDR-II have rickets along with hypocalcemia,
      hypophosphatemia, secondary hyperparathyroidism, and elevated serum
      1,25(OH)2D levels, which is a hallmark for diagnosing this disease.
    explanation: >-
      Names the elevated calcitriol level explicitly as the diagnostic hallmark
      of the disorder.
- name: Parathyroid hormone
  presence: Elevated
  context: >-
    Secondary hyperparathyroidism driven by receptor-level calcium malabsorption.
  evidence:
  - reference: PMID:38872968
    reference_title: "Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HVDDR-II is characterized by early onset of rickets presentation and
      biochemical parameters such as low serum calcium levels, high parathyroid
      hormone, high alkaline phosphatase, and high 1,25(OH)2D levels (1).
    explanation: >-
      Reports elevated parathyroid hormone among the characteristic biochemical
      parameters.
notes: >-
  The name is a misnomer twice over: this disorder is vitamin D-RESISTANT, not
  vitamin D-dependent, and calcitriol is high rather than low. It shares the
  "vitamin D-dependent rickets" label with type 1 only by historical convention.
  Type 2B (MONDO:0010931) has the same clinical phenotype with a structurally
  normal receptor and is curated separately.

  target_mechanisms:
  - target: Impaired VDR-Regulated Transcription
    treatment_effect: MODULATES
    description: Supraphysiologic active vitamin D can increase signaling through a receptor with residual function.
    evidence:
    - reference: PMID:42438800
      reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        High-dose calcitriol therapy resulted in progressive biochemical
        improvement and catch-up growth.
      explanation: >-
        Genetically confirmed p.R343C VDDR2A responded clinically and
        biochemically, disproving universal calcitriol nonresponse.
    - reference: PMID:36705686
      reference_title: "Genotypic Spectrum and its Correlation with Alopecia and Clinical Response in Hereditary Vitamin D Resistant Rickets: Our Experience and Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overall response to oral therapy was highest in LBD-NT (46.4%) as
        compared to 7.6% in LBD-truncating and 19% in DBD-NT variants.
      explanation: >-
        Quantifies genotype-stratified oral response and supports a
        response-guided rather than universal treatment claim.
  - target: Reduced VDR-Dependent Enterocyte Calcium and Phosphate Transport
    treatment_effect: BYPASSES
    description: >-
      High oral calcium concentrations increase passive calcium uptake while
      active vitamin D exploits any residual receptor activity.
    evidence:
    - reference: PMID:40219799
      reference_title: "Vitamin D dependent rickets type 2A: a case series of two siblings with novel mutation in vitamin D receptor gene responded to high dose oral calcium and calcitriol."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They both are being managed on high doses of oral calcium supplements and
        activated form of vitamin D.
      explanation: >-
        Documents oral calcium plus activated vitamin D management in two
        genetically characterized siblings.
- name: High-Dose Oral Calcium
  description: >-
    High-dose oral elemental calcium is an initial bypass strategy when it can
    restore normocalcemia and suppress secondary hyperparathyroidism. It may
    also permit transition away from intravenous calcium, but passive absorption
    is limited and requires close biochemical and urinary-calcium monitoring.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium(2+)
      term:
        id: CHEBI:29108
        label: calcium(2+)
  target_mechanisms:
  - target: Reduced VDR-Dependent Enterocyte Calcium and Phosphate Transport
    treatment_effect: BYPASSES
    description: A large luminal calcium load increases VDR-independent passive absorption.
    evidence:
    - reference: PMID:32596195
      reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Management during the first few months of life may require only
        administration of high doses of oral calcium (5–6 g/m2 body surface of
        elemental calcium). If oral therapy is able to restore normocalcemia and
        reverse secondary hyperparathyroidism it may not be necessary to initiate
        intravenous infusions of calcium.
      explanation: >-
        Supports oral-first calcium treatment when biochemical targets respond.
- name: Intravenous Calcium for Maximal-Oral-Treatment-Refractory Disease
  description: >-
    Severe disease that fails maximal oral calcium and active vitamin D requires
    prolonged intravenous calcium to bypass intestinal absorption entirely and
    replenish skeletal calcium deficits. Central-line complications make this a
    refractory-disease strategy, not evidence that intravenous therapy is
    universally preferable.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcium(2+)
      term:
        id: CHEBI:29108
        label: calcium(2+)
  target_mechanisms:
  - target: Reduced VDR-Dependent Enterocyte Calcium and Phosphate Transport
    treatment_effect: BYPASSES
    description: Intravenous delivery completely bypasses the receptor-dependent intestinal route.
    evidence:
    - reference: PMID:32596195
      reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Those patients who fail to respond to maximal doses of calciferol will
        require intravenous infusions of calcium (1,000 mg elemental calcium per
        24 h infused over 12 h), which can be used even by the youngest children
        with VDDR2a.
      explanation: >-
        Restricts intravenous calcium to patients who fail maximal hormone-based
        treatment.
    - reference: PMID:36705686
      reference_title: "Genotypic Spectrum and its Correlation with Alopecia and Clinical Response in Hereditary Vitamin D Resistant Rickets: Our Experience and Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients had poor overall response to oral high-dose calcium and
        calcitriol and most required intravenous calcium.
      explanation: >-
        Documents escalation to intravenous calcium in an oral-refractory
        genetically confirmed cohort.
animal_models:
- name: VDR-null mouse (targeted ablation of the second zinc finger)
  species: Mouse
  genotype: Vdr knockout, second zinc finger of the DNA-binding domain deleted
  publication: PMID:9275211
  description: >-
    The reference model of this disorder, engineered to reproduce the human
    DNA-binding-domain lesion. Mice are normal at birth and develop hypocalcemia,
    hyperparathyroidism, rickets and osteomalacia on the human timeline, together
    with progressive alopecia that dietary vitamin D deficiency does not cause.
  evidence:
  - reference: PMID:9275211
    reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have generated a mouse model of VDDR II by targeted ablation of the
      second zinc finger of the VDR DNA-binding domain.
    explanation: >-
      Establishes that the model was engineered specifically to reproduce the
      human DNA-binding-domain lesion, which is what makes it informative for
      this disorder rather than for vitamin D deficiency generally.
  modeled_mechanisms:
  - target: Defective Skeletal Mineralization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the full mineral and skeletal sequence, and shows the growth-plate
      lesion appearing before overt rickets.
    limitations: >-
      The engineered allele removes the second zinc finger specifically; human
      disease alleles are heterogeneous across the DNA-binding and ligand-binding
      domains, so the model represents the DNA-binding class rather than the whole
      allelic spectrum.
    readouts:
    - name: Hypertrophic chondrocyte zone width in the growth plate
      target: Defective Skeletal Mineralization
      direction: INCREASED
      interpretation: >-
        Expansion of the hypertrophic zone is the growth-plate correlate of the
        mineralization defect, and it precedes radiographic rickets in this model.
      evidence:
      - reference: PMID:9275211
        reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Rickets and osteomalacia are seen by day 35; however, as early as day
          15, there is an expansion in the zone of hypertrophic chondrocytes in
          the growth plate.
        explanation: >-
          Reports the histological measurement and its timing relative to overt
          rickets.
    evidence:
    - reference: PMID:9275211
      reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        They become hypocalcemic at 21 days of age, at which time their
        parathyroid hormone (PTH) levels begin to rise.
      explanation: >-
        Establishes that the model reproduces the hypocalcemia and secondary
        hyperparathyroidism that drive the mineralization failure in patients.
  - target: Disrupted Ligand-Independent VDR Hair-Cycle Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Progressive alopecia develops from four weeks of age and is absent from
      dietary vitamin D deficiency, matching the human observation that alopecia
      tracks receptor loss rather than hormone deficiency.
    limitations: >-
      Alopecia is present in some but not all human kindreds, so the model
      reproduces the alopecic subset rather than the disorder uniformly.
    evidence:
    - reference: PMID:9275211
      reference_title: 'Targeted ablation of the vitamin D receptor: an animal model of vitamin D-dependent rickets type II with alopecia.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to animals made vitamin D deficient by dietary means, and like
        some patients with VDDR II, these mice develop progressive alopecia from
        the age of 4 weeks.
      explanation: >-
        Contrasts receptor ablation with dietary deficiency, isolating the
        receptor-dependent, hormone-independent origin of the alopecia.
- name: Keratinocyte-targeted ligand-binding-null VDR transgene in VDR-null mice
  species: Mouse
  genotype: Vdr knockout carrying a keratinocyte-targeted VDR transgene with a hormone-binding-domain mutation abolishing ligand binding
  publication: PMID:15591533
  description: >-
    A rescue experiment that separates the two arms of the disorder. Restoring a
    receptor that cannot bind hormone, in keratinocytes only, restores normal hair
    cycling, showing that the hair-follicle function of the receptor is ligand
    independent. As a transgenic mouse rescue, it does not establish universal
    treatment nonresponse of alopecia across human VDDR2A genotypes.
  evidence:
  - reference: PMID:15591533
    reference_title: Ligand-independent actions of the vitamin D receptor maintain hair follicle homeostasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To determine which functional domains of the VDR are required for hair
      cycling, mutant VDR transgenes were targeted to the keratinocytes of VDR
      null mice.
    explanation: >-
      States the design of the transgenic rescue, which is what makes this system
      informative for the alopecia node specifically.
  modeled_mechanisms:
  - target: Disrupted Ligand-Independent VDR Hair-Cycle Function
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Keratinocyte-restricted expression of a ligand-binding-dead receptor rescues
      the hair cycle, demonstrating the mechanism this node asserts.
    limitations: >-
      A transgenic rescue rather than a disease model; it establishes sufficiency
      of the receptor protein for hair cycling but does not model any human
      genotype.
    readouts:
    - name: Hair cycling in keratinocyte-rescued VDR-null mice
      target: Disrupted Ligand-Independent VDR Hair-Cycle Function
      direction: RESTORED
      interpretation: >-
        Normal hair cycling despite an inability to bind hormone localizes the
        alopecia mechanism to a ligand-independent receptor function.
      evidence:
      - reference: PMID:15591533
        reference_title: Ligand-independent actions of the vitamin D receptor maintain hair follicle homeostasis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Keratinocyte-specific expression of a VDR transgene with a mutation in
          the hormone-binding domain that abolishes ligand binding restores normal
          hair cycling in VDR null mice
        explanation: >-
          Reports the rescue and the direction of the effect.
    evidence:
    - reference: PMID:15591533
      reference_title: Ligand-independent actions of the vitamin D receptor maintain hair follicle homeostasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These studies demonstrate that the effects of the VDR on the hair follicle
        are ligand independent and point to novel molecular and cellular actions
        of this nuclear receptor.
      explanation: >-
        States the conclusion that grounds the ligand-independent framing of this
        node.
- name: Systemic Vdr Delta-AF2 Mouse
  species: Mouse
  genotype: Systemic deletion of the Vdr activation-function-2 domain (VdrΔAF2)
  publication: PMID:39164247
  description: >-
    The mutant receptor cannot recruit coactivators and therefore cannot mount
    ligand-induced transcription, but it retains coactivator-independent
    repressive activity. Mice develop severe undermineralized short bones and
    dysmorphic growth plates. This is an allele-mechanism model rather than a
    generic proxy for all VDDR2A: its phenotype is more severe than Vdr null and
    is not corrected by the high-calcium/phosphate/lactose rescue diet that
    normalizes the null model.
  evidence:
  - reference: PMID:39164247
    reference_title: "Coactivator-independent vitamin D receptor signaling causes severe rickets in mice, that is not prevented by a diet high in calcium, phosphate, and lactose."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Systemic VdrΔAF2 mice developed short, undermineralized bones with
      dysmorphic growth plates, a bone phenotype that was more pronounced than
      that of systemic Vdr knockout (Vdr-/-) mice.
    explanation: >-
      Defines the systemic model and its more-severe-than-null skeletal phenotype.
  modeled_mechanisms:
  - target: Impaired VDR Coactivator Recruitment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly models loss of AF2-dependent coactivator recruitment while
      retaining repressive signaling.
    limitations: >-
      The engineered deletion retains AF2-independent repression and is more
      severe than Vdr absence, so its diet response must not be generalized to
      all human VDR variants or used to negate human calcium responsiveness.
    evidence:
    - reference: PMID:39164247
      reference_title: "Coactivator-independent vitamin D receptor signaling causes severe rickets in mice, that is not prevented by a diet high in calcium, phosphate, and lactose."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We confirm that ligand-induced transcriptional activation was disabled
        because the mutant VDRΔAF2 protein was unable to interact with
        coactivators.
      explanation: Directly validates the coactivator-recruitment defect represented by the model.
  - target: Defective Skeletal Mineralization
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Reproduces severe undermineralization and dysmorphic growth plates.
    limitations: >-
      Model-specific retained repression makes the skeletal phenotype more
      severe than Vdr null and resistant to a rescue diet; this does not predict
      universal failure of calcium treatment in patients.
    evidence:
    - reference: PMID:39164247
      reference_title: "Coactivator-independent vitamin D receptor signaling causes severe rickets in mice, that is not prevented by a diet high in calcium, phosphate, and lactose."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Interestingly, a rescue diet that is high in calcium, phosphate, and
        lactose, normalized this phenotype in Vdr-/-, but not in VdrΔAF2 mice.
      explanation: Captures the model-specific rescue-diet divergence and its key limitation.
experimental_models:
- name: Patient-Derived p.Arg30* VDR Dermal Fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from one individual homozygous for the severe
    p.Arg30* VDR allele were compared with age- and sex-matched control
    fibroblasts after vehicle or 10 nM calcitriol exposure for 24 hours. The
    model directly tests a human disease genotype but is limited to one donor
    and a dermal surrogate rather than enterocytes, kidney, growth plate, or bone.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: Primary patient-derived skin fibroblasts and matched control fibroblasts
  culture_system: Two-dimensional monolayer culture exposed to vehicle or 10 nM 1,25-dihydroxyvitamin D for 24 hours
  conditions:
  - homozygous VDR p.Arg30* patient fibroblasts
  - age- and sex-matched control fibroblasts
  - vehicle or calcitriol exposure
  publication: PMID:30959822
  evidence:
  - reference: PMID:30959822
    reference_title: "Transcriptomic Response to 1,25-Dihydroxyvitamin D in Human Fibroblasts with or without a Functional Vitamin D Receptor (VDR): Novel Target Genes and Insights into VDR Basal Transcriptional Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We analyzed the transcriptomic response to 1,25D in fibroblasts bearing a
      severe homozygous hereditary vitamin D resistant rickets-related p.Arg30*
      VDR mutation (MUT) and in control fibroblasts (CO).
    explanation: Establishes the disease genotype, human primary-cell system, and matched comparator.
  modeled_mechanisms:
  - target: Impaired VDR-Regulated Transcription
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Measures loss of the calcitriol-responsive transcriptome in patient cells.
    limitations: A single patient line and a fibroblast surrogate cannot reproduce intestinal mineral transport or skeletal disease.
    evidence:
    - reference: PMID:30959822
      reference_title: "Transcriptomic Response to 1,25-Dihydroxyvitamin D in Human Fibroblasts with or without a Functional Vitamin D Receptor (VDR): Novel Target Genes and Insights into VDR Basal Transcriptional Activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Roughly 4.5% of the transcriptome was regulated by 1,25D in CO
        fibroblasts, while MUT cells without a functional VDR were insensitive to
        1,25D.
      explanation: Directly measures the impaired transcriptional response represented by the target node.

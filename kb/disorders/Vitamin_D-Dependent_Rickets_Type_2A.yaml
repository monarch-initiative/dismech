diagnosis:
- name: Biochemical and Radiographic Evaluation for VDR Resistance
  description: >-
    Evaluate a child with clinical or radiographic rickets using serum calcium,
    phosphate, alkaline phosphatase, PTH, 25-hydroxyvitamin D, and
    1,25-dihydroxyvitamin D. Markedly elevated 1,25-dihydroxyvitamin D with high
    PTH and alkaline phosphatase supports receptor resistance; hypocalcemia and
    alopecia are not required. Explicit differentials include nutritional
    rickets, the synthetic defects VDDR1A and VDDR1B, the biochemical phenocopy
    VDDR2B, and FGF23-mediated renal phosphate-wasting disorders such as
    X-linked hypophosphatemia (XLH). Normocalcemic, hypophosphatemic VDDR2A can
    initially mimic an FGF23-mediated disorder; markedly elevated
    1,25-dihydroxyvitamin D and PTH prompt evaluation for receptor resistance,
    while VDR testing distinguishes type 2A from type 2B. During follow-up,
    monitor calcium, phosphate, PTH, alkaline phosphatase, and radiographic
    healing separately because PTH can remain elevated after phosphate
    normalization and radiographic healing.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Radiographic rickets with elevated PTH, alkaline phosphatase, and 1,25-dihydroxyvitamin D; phosphate is often low and calcium may be low or normal, and biochemical indices may normalize asynchronously during treatment.
  evidence:
  - reference: PMID:42438800
    reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial evaluation showed normocalcemia, hypophosphatemia,
      hyperparathyroidism, markedly elevated alkaline phosphatase, and
      radiographic rickets, leading to an initial diagnosis of hypophosphatemic
      rickets.
    explanation: >-
      Demonstrates the diagnostic pitfall and that a normal serum calcium does
      not exclude VDDR2A.
  - reference: PMID:38365463
    reference_title: Vitamin D deficiency or resistance and hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nutritional vitamin D deficiency is the leading cause of rickets and
      osteomalacia worldwide and responds well to vitamin D supplementation.
      Inherited disorders of vitamin D metabolism (vitamin D-dependent rickets,
      VDDR) account for a small proportion of calcipenic rickets/osteomalacia.
      Defective 1α hydroxylation of vitamin D, 25 hydroxylation of vitamin D,
      and vitamin D receptor result in VDDR1A, VDDR1B and VDDR2A, respectively
      whereas defective binding of vitamin D to vitamin D response element due
      to overexpression of heterogeneous nuclear ribonucleoprotein and
      accelerated vitamin D metabolism cause VDDR2B and VDDR3, respectively.
    explanation: >-
      Names nutritional rickets and VDDR1A, VDDR1B, and VDDR2B as explicit
      biochemical and mechanistic differentials.
  - reference: PMID:32596195
    reference_title: Vitamin D Dependent Rickets Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subjects who have hypophosphatemia and normal serum levels of PTH,
      calcium, and 25(OH)D are likely to have phosphopenic rickets; a normal or
      elevated tubular reabsorption of phosphorus (TRP) will be found in
      subjects with inadequate intake or absorption of phosphorus. By contrast,
      patients with XLH and other genetic or acquired causes of renal phosphate
      wasting will have reduced TRP values. Subjects with calciopenic rickets
      will have elevated serum levels of PTH, which depress the TRP and cause
      hypophosphatemia.
    explanation: >-
      Supports the explicit XLH and renal-phosphate-wasting differential and
      shows how PTH and tubular phosphate handling separate major rickets axes.
  - reference: PMID:32596195
    reference_title: Vitamin D Dependent Rickets Type I.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Today we recognize that there are multiple forms of inherited
      hypophosphatemic rickets in addition to XLH. Many of these additional forms
      share in common with XLH the presence of excess circulating levels of
      FGF23, a phosphotonin that accounts for decreased renal tubular
      reabsorption of phosphate and hypophosphatemia (9).
    explanation: >-
      Locally supports the FGF23-mediated classification of the XLH and inherited
      renal-phosphate-wasting differential.
  - reference: PMID:40383122
    reference_title: Persistent Hyperparathyroidism in Vitamin D-Dependent Rickets Type 2A Does Not Prevent Normalization of Hypophosphatemia or Healing of the Rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon the initiation of IV calcium infusions, bone pain resolved, and the
      rickets healed within weeks. In parallel with decreasing ALP values, her
      phosphate levels normalized even though her PTH levels remained markedly
      elevated. PTH levels remained elevated for approximately 1 year after the
      normalization of S-Ca2+.
    explanation: >-
      Directly establishes asynchronous biochemical recovery and the need to
      continue PTH monitoring after phosphate and skeletal improvement.
- name: VDR Molecular Genetic Testing
  description: >-
    Sequencing of VDR by a rickets panel, exome, or genome confirms VDDR2A when
    pathogenic biallelic variants are found; segregation and functional data are
    especially important when considering the exceptional heterozygous
    dominant-negative mechanism.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: VDR
        term:
          id: hgnc:12679
          label: VDR
  results: Pathogenic VDR variant(s) in a disease-consistent allelic state confirm type 2A.
  evidence:
  - reference: PMID:42438800
    reference_title: A case of vitamin D-dependent rickets type 2A presenting with hypophosphatemia without hypocalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further evaluation revealed markedly elevated 1,25(OH)2D, and whole-exome
      sequencing identified a homozygous pathogenic VDR c.1027C>T (p.R343C)
      variant, confirming VDDR2A.
    explanation: >-
      Directly demonstrates molecular confirmation after biochemical recognition.
treatments:
- name: High-Dose Active Vitamin D Plus Oral Calcium for Residual Responders
  description: >-
    Patients with residual VDR responsiveness, particularly some
    non-truncating ligand-binding-domain variants and milder presentations
    without alopecia, may respond to supraphysiologic calcitriol or alfacalcidol
    together with oral calcium. Biochemical response, growth, and radiographic
    healing guide continued use; response cannot be inferred from alopecia alone.
  action_category: THERAPEUTIC
  treatment_term:

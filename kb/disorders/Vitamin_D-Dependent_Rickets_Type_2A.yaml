name: Vitamin D-Dependent Rickets Type 2A
synonyms:
- VDDR2A
- Hereditary vitamin D-resistant rickets
- HVDRR
- Hereditary 1,25-dihydroxyvitamin D-resistant rickets
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 2A is end-organ resistance to calcitriol
  caused by biallelic loss-of-function variants in VDR, the nuclear vitamin D
  receptor. Vitamin D activation is intact - indeed calcitriol is characteristically
  elevated, because the feedback loop that normally suppresses its synthesis is
  itself receptor-dependent - but target tissues cannot respond. The result is
  hypocalcemia, secondary hyperparathyroidism and early, severe rickets that does
  not respond to calcitriol, distinguishing it from type 1. Alopecia, present in
  the great majority of patients, reflects a distinct, ligand-independent role of
  the receptor in the hair follicle and has no counterpart in any other member of
  the vitamin D-dependent rickets series.
disease_term:
  preferred_term: vitamin D-dependent rickets, type 2A
  term:
    id: MONDO:0010186
    label: vitamin D-dependent rickets, type 2A
parents:
- Metabolic Bone Disorders
- Inborn Error of Metabolism
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected children are homozygous or compound heterozygous for VDR variants;
    consanguinity is common in reported cohorts.
  evidence:
  - reference: PMID:2849209
    reference_title: Point mutations in the human vitamin D receptor gene associated with hypocalcemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two families with affected children homozygous for this autosomal recessive
      disorder were studied for abnormalities in the intracellular vitamin D
      receptor (VDR) and its gene.
    explanation: >-
      Establishes homozygous transmission in the founding molecular study.
genetic:
- name: Biallelic VDR loss-of-function variants
  gene_term:
    preferred_term: VDR
    term:
      id: hgnc:12679
      label: VDR
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Variants fall into two functional classes: those in the DNA-binding zinc
    fingers, which preserve hormone binding but abolish DNA binding, and those
    affecting ligand binding or producing premature termination.
  evidence:
  - reference: PMID:2849209
    reference_title: Point mutations in the human vitamin D receptor gene associated with hypocalcemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In each family, a different single nucleotide mutation was found in the DNA
      binding domain of the protein; one family near the tip of the first zinc
      finger (Gly----Asp) and one at the tip of the second zinc finger
      (Arg----Gly).
    explanation: >-
      Identifies the causal VDR variants and localizes them to the DNA-binding
      domain.
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular genetic testing of the VDR gene in our cohort identified six
      different gene variants c.885 C>A (p.Tyr295Ter), c.88 C>T (p.Arg30Ter),
      c.1036G>A (p.Val346Met), c.820C>T (p.Arg274Cys), c.803 T>C (p.Ile268Thr),
      and c.2T>G (p.Met1?).
    explanation: >-
      Documents the allelic spectrum in the largest reported cohort.
pathophysiology:
- name: Vitamin D Receptor Resistance
  description: >-
    Loss-of-function VDR variants prevent the receptor from transducing the
    calcitriol signal. Zinc-finger variants are informative about the mechanism:
    the receptor still binds hormone normally but can no longer bind its DNA
    response elements, so the defect is in transcriptional output rather than in
    ligand recognition. Because negative feedback on calcitriol synthesis is
    itself receptor-mediated, circulating calcitriol rises rather than falls -
    the inverse of the type 1 biochemical picture.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Vitamin D Receptor DNA Binding
    term:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: Vitamin D Receptor Signaling
    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:2849209
    reference_title: Point mutations in the human vitamin D receptor gene associated with hypocalcemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypocalcemic vitamin D-resistant rickets is a human genetic disease
      resulting from target organ resistance to the action of
      1,25-dihydroxyvitamin D3.
    explanation: >-
      States the end-organ resistance mechanism that defines this node.
  - reference: PMID:2849209
    reference_title: Point mutations in the human vitamin D receptor gene associated with hypocalcemic rickets.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although the receptor displays normal binding of 1,25-dihydroxyvitamin D3
      hormone, VDR from affected family members has a decreased affinity for DNA.
    explanation: >-
      Localizes the functional defect to DNA binding with hormone binding intact,
      which is why supplying more hormone cannot correct the disorder.
  downstream:
  - target: Calcitriol-Unresponsive Intestinal Calcium Malabsorption
    causal_link_type: DIRECT
    description: >-
      Loss of receptor transcriptional output removes the calcium-absorptive
      response in the intestine.
  - target: Alopecia from Ligand-Independent Receptor Loss
    causal_link_type: DIRECT
    description: >-
      The hair follicle requires the receptor protein itself rather than its
      hormone-dependent signalling, so receptor loss produces alopecia
      independently of the mineral phenotype.
- name: Calcitriol-Unresponsive Intestinal Calcium Malabsorption
  description: >-
    Active intestinal calcium absorption fails despite abundant circulating
    calcitriol. Serum calcium falls, parathyroid hormone rises, and
    parathyroid-hormone-driven phosphaturia adds a phosphate deficit. This is the
    disorder-specific instance of the module's calciopenic trigger arm; the
    substitution relative to the generic node is that the interruption is at the
    receptor, downstream of every step of hormone synthesis, so the arm cannot be
    re-entered by supplying more hormone.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"
  cell_types:
  - preferred_term: Enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: Intestinal Calcium Absorption
    term:
      id: GO:0070509
      label: calcium ion import
    modifier: DECREASED
  evidence:
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary defect caused by the mutant VDR gene is a decrease in
      intestinal calcium and phosphate absorption, which leads to decreased bone
      mineralization and rickets (3), despite high levels of 1,25(OH)2D (4).
    explanation: >-
      States the intestinal calcium and phosphate malabsorption this node models,
      and that it occurs despite elevated circulating calcitriol.
  downstream:
  - target: Defective Skeletal Mineralization
    causal_link_type: DIRECT
    description: >-
      Combined calcium and phosphate deficit lowers the calcium-phosphate product
      at the mineralization front.
- name: Defective Skeletal Mineralization
  description: >-
    Early and often severe rickets with bowing of the weight-bearing limbs,
    delayed walking and growth failure.
  role: effector
  biological_scale: TISSUE
  conforms_to: "defective_skeletal_mineralization#Impaired Hydroxyapatite Deposition at the Mineralization Front"
  cell_types:
  - preferred_term: Osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: Bone Mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED
  locations:
  - preferred_term: Bone
    term:
      id: UBERON:0001474
      label: bone element
  evidence:
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at presentation was 15.5 months.
    explanation: >-
      Records the early-infantile onset of the skeletal disease in the largest
      reported cohort.
- name: Alopecia from Ligand-Independent Receptor Loss
  description: >-
    Total or near-total scalp and body alopecia, usually apparent in the first
    year. It is not part of the mineralization mechanism and is not corrected by
    normalizing calcium; this is the branch that makes type 2A distinguishable
    from every other member of the series on inspection alone. It is deliberately
    kept off the module conformance chain.
  role: effector
  biological_scale: TISSUE
  evidence:
  - reference: PMID:38872968
    reference_title: 'Clinical characteristics and long-term management for patients with vitamin D-dependent rickets type II: a retrospective study at a single center in Saudi Arabia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alopecia was found in 97.6%, 21.4% presented with bowing legs, 14.3% with
      delayed walking, 9.5% with seizure, and 2.4% presented with respiratory
      failure, while a family history of the disease was positive in 71.4% of
      total patients.
    explanation: >-
      Quantifies alopecia as a near-universal feature, separate from the skeletal
      manifestations listed in the same series.

- name: Regulatory T Cell Deficiency
  biological_scale: CELLULAR
  description: >-
    FOXP3 regulatory T cells, and in one patient T follicular regulatory cells, are
    drastically reduced, while activated effector T cells (PD-1 and ICOS high)
    accumulate. This accounts for the IPEX-like presentation, and transplantation
    corrects the regulatory T cell frequency. In mice the requirement is specifically
    for MALT1 protease activity, acting through TCR-induced MYC.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815

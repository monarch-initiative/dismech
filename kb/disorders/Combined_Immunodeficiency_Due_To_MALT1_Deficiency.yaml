      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Human MALT1 deficiency causes profound CID by impairing CBM-mediated NF-kB signaling and MALT1-paracaspase activity."
      explanation: The same conclusion supports the protease branch of the lesion.
- name: Defective CBM Signalosome Signaling to NF-kappaB
  biological_scale: MOLECULAR
  description: >-
    Without MALT1 the CARD11-BCL10-MALT1 complex cannot carry T and B cell receptor
    signals through to IKK, so IkappaB-alpha is not degraded and p65 is not
    phosphorylated. This is the scaffold arm of the lesion.

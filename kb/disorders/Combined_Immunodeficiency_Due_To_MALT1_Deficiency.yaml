  - preferred_term: MALT1
    term:
      id: hgnc:6819
      label: MALT1
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:25627829
    reference_title: "Combined immunodeficiency due to MALT1 mutations, treated by hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autologous lymphocytes failed to express MALT1 and lacked NF-κB signaling dependent upon the CARMA1, BCL-10 and MALT1 signalosome."
    explanation: >-
      Loss of MALT1 protein in the patient's own lymphocytes, with the consequent
      signalling failure, in a compound heterozygous patient.
  - reference: PMID:27253662
    reference_title: "Deficiency in Mucosa-associated Lymphoid Tissue Lymphoma Translocation 1: A Novel Cause of IPEX-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous missense mutation in mucosa-associated lymphoid tissue lymphoma translocation 1 gene (MALT1), which precluded protein expression."
    explanation: A second missense allele that acts by abolishing the protein.
  downstream:
  - target: Defective CBM Signalosome Signaling to NF-kappaB
    causal_link_type: DIRECT
    evidence:

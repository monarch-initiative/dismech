prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Known only from case reports and small series. A 2025 report counts 22 published
    patients; there is no registry and no population estimate. Most reported families
    are consanguineous, so the allele frequency in outbred populations is unknown.
  evidence:
  - reference: PMID:40748513
    reference_title: "Loss of MALT1 Function in a Patient With Combined Immunodeficiency: a Novel Pathogenic Variant and Immunological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Since then, a total of 22 patients have been discovered."
    explanation: >-
      The introduction's count of published patients since the 2013 index family,
      which is the whole of the epidemiological record for this disease.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic loss of function, homozygous in consanguineous families and compound
    heterozygous in outbred ones. Heterozygous parents are healthy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23727036
    reference_title: "A homozygous mucosa-associated lymphoid tissue 1 (MALT1) mutation in a family with combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An autosomal recessive form of CID is associated with homozygous mutations in MALT1."
    explanation: >-
      Conclusion of the index family report, in which both affected siblings were
      homozygous and both parents heterozygous.
  - reference: PMID:25627829
    reference_title: "Combined immunodeficiency due to MALT1 mutations, treated by hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our nonconsanguineous patient with early onset profound combined immunodeficiency and immune dysregulation due to compound heterozygous MALT1 mutations extends the clinical and immunologic phenotype reported in 2 prior families."
    explanation: >-
      Shows the compound heterozygous form of the same recessive inheritance in a
      non-consanguineous family.
genetic:
- name: MALT1
  gene_term:
    preferred_term: MALT1
    term:
      id: hgnc:6819
      label: MALT1
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Reported alleles span the protein: missense in the N-terminal CARD domain
    (p.Ser89Ile, the index family) and in the caspase-like domain (p.Asp471Asn), a
    further missense allele (p.Ile600Asn), splice and frameshift variants, and
    nonsense alleles (p.Glu368*, and c.609G>A at Trp203, which its authors describe
    as a homozygous nonsense mutation). Those studied abolish or severely reduce
    MALT1 protein, so the usual disease is loss of both the scaffold and the protease
    function.
  evidence:
  - reference: PMID:23727036
    reference_title: "A homozygous mucosa-associated lymphoid tissue 1 (MALT1) mutation in a family with combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed the presence in both patients of a homozygous missense mutation in MALT1 that resulted in loss of protein expression"
    explanation: >-
      The index family: a homozygous MALT1 missense allele that abolishes the
      protein.
  - reference: PMID:23727036
    reference_title: "A homozygous mucosa-associated lymphoid tissue 1 (MALT1) mutation in a family with combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to wild-type human MALT1, the patients' MALT1 mutant failed to correct defective nuclear factor-κB activation and IL-2 production in MALT1-deficient mouse T cells."
    explanation: >-
      Functional complementation in Malt1-null mouse T cells shows the patient
      allele is loss of function, which is the causal test rather than segregation
      alone.
  - reference: PMID:40748513
    reference_title: "Loss of MALT1 Function in a Patient With Combined Immunodeficiency: a Novel Pathogenic Variant and Immunological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient carried a novel pathogenic biallelic loss-of-function variant in MALT1 (c.1411G > A; p.D471N) located in the caspase-like domain, leading to severely reduced MALT1 protein expression."
    explanation: >-
      A paracaspase-domain missense allele that also acts by reducing protein,
      showing that loss of expression is the common route across domains.
  - reference: PMID:34559885
    reference_title: "Progressive B cell depletion in human MALT1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 8 years of age, the genetic diagnosis of MALT1-deficiency was confirmed on a novel homozygous mutation of c.1102G>T, p.E368X."
    explanation: Documents a homozygous nonsense allele as a cause.
  - reference: PMID:40853399
    reference_title: "To The Editor a Novel Mutation in MALT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed the homozygous MALT1 mutation c.609G > A, p. Trp203, which was associated with her immunodeficiency."
    explanation: >-
      A second homozygous truncating allele, found in a child from a consanguineous
      family who presented with agammaglobulinemia.
pathophysiology:
- name: Biallelic MALT1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline variants abolish or severely reduce MALT1 protein. Because
    MALT1 is both the effector scaffold and the only protease of the CBM complex,
    losing the protein removes both activities at once; the two downstream nodes
    below follow the two activities separately.

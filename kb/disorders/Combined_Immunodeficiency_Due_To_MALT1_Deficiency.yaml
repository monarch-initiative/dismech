name: Combined Immunodeficiency Due To MALT1 Deficiency
creation_date: "2026-10-01T21:19:54Z"
category: Mendelian
synonyms:
- MALT1 deficiency
- Immunodeficiency 12
- IMD12
- immunodeficiency type 12
description: >-
  Combined immunodeficiency due to MALT1 deficiency (immunodeficiency 12) is the
  autosomal recessive inborn error of immunity caused by biallelic loss-of-function
  variants in MALT1, the paracaspase subunit of the CARD11-BCL10-MALT1 (CBM)
  signalosome. MALT1 does two jobs in that complex. As a scaffold it carries an
  engaged T or B cell antigen receptor through to canonical NF-kappaB activation, and
  as a cysteine protease it cleaves negative regulators of that pathway and of
  cytokine mRNA stability. Most reported alleles abolish the protein, so both jobs
  fail together.

  The disease therefore has two faces in the same child. The immunodeficient face
  follows from the scaffold defect: T cells are present in normal numbers but
  proliferate and make IL-2 poorly on receptor stimulation, Th17 immunity is weak,
  and B cells arrest at the transitional stage and are progressively lost, so
  specific antibody responses fail and some patients become agammaglobulinemic.
  Infections with Staphylococcus aureus, Candida albicans and cytomegalovirus
  dominate, alongside recurrent pneumonia that leads to bronchiectasis. The
  dysregulated face follows mainly from loss of the protease function that
  regulatory T cells depend on: FOXP3 regulatory T cells are drastically reduced and
  the picture can be IPEX-like, with enteropathy, autoimmunity, eczematous or
  erythrodermic skin disease, eosinophilia and raised IgE.

  Onset is in the first months of life. Because T and B cell numbers are often
  normal at presentation, and newborn TREC screening can be normal, the disease is
  recognised late. Immunoglobulin replacement and antibiotic prophylaxis do little to
  change its course, about half of untreated patients die of infection, and
  allogeneic haematopoietic stem cell transplantation is curative.

    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Human germline MALT1 deficiency is an inborn error of immunity characterized by recurrent bacterial, viral, and fungal infections, periodontal disease, enteropathy, dermatitis, and failure to thrive."
    explanation: "Review of reported patients naming periodontal disease as a characteristic feature."
- name: Lymphadenopathy
  category: Immunological

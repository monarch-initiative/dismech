  - reference: PMID:23727036
    reference_title: "A homozygous mucosa-associated lymphoid tissue 1 (MALT1) mutation in a family with combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of T cells that were available on one of the patients showed severely impaired IκBα degradation and IL-2 production after activation, 2 events that depend on MALT1."
    explanation: Direct measurement of the NF-kappaB activation defect in patient T cells.
  - reference: PMID:40748513
    reference_title: "Loss of MALT1 Function in a Patient With Combined Immunodeficiency: a Novel Pathogenic Variant and Immunological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impaired CBM-mediated NF-κB activation was confirmed by reduced phosphorylation of the p65 subunit, resulting in deficient production of IL-2 and TNF-α."
    explanation: Reproduces the defect at the level of p65 phosphorylation.
  downstream:
  - target: Impaired Antigen Receptor-Driven T Cell Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40748513
      reference_title: "Loss of MALT1 Function in a Patient With Combined Immunodeficiency: a Novel Pathogenic Variant and Immunological Insights."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Impaired CBM-mediated NF-κB activation was confirmed by reduced phosphorylation of the p65 subunit, resulting in deficient production of IL-2 and TNF-α."
      explanation: >-
        States the causal step: the NF-kappaB defect results in failure of the
        T cell cytokine response.
  - target: Arrested B Cell Maturation and Progressive B Cell Depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34559885
      reference_title: "Progressive B cell depletion in human MALT1 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "T cell stimulation tests showed impairments in the production of interleukin-2, phosphorylation of nuclear factor kappa B (NF-κB) p65 and differentiation of B cells."
      explanation: >-
        Reports the NF-kappaB defect and the B cell differentiation defect together
        in one patient. Whether the B cell block is B-cell-intrinsic (BCR or BAFFR
        signalling) or follows lost T cell help is not settled, so the edge is
        typed with unknown intermediates.
- name: Loss of MALT1 Paracaspase Activity
  biological_scale: MOLECULAR
  description: >-
    MALT1 is a cysteine protease that cleaves negative regulators of NF-kappaB and
    mRNA-destabilising proteins. In one protease-dead knock-in mouse line the
    protease was largely dispensable for crossing the lymphocyte activation
    threshold but essential for regulatory T cell development, which is how one
    gene produces both immunodeficiency and immune dysregulation. A second
    protease-deficient line showed reduced T cell proliferation, IL-2 production
    and Th17 differentiation in vitro, so the protease also contributes to
    effector T cell responses.
  molecular_functions:
  - preferred_term: MALT1 paracaspase (cysteine-type endopeptidase) activity
    term:
      id: GO:0004197
      label: cysteine-type endopeptidase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25456129
    reference_title: "Uncoupling Malt1 threshold function from paracaspase activity results in destructive autoimmune inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "As a scaffold, it assembles protein complexes for NF-κB activation, and its proteolytic domain cleaves negative NF-κB regulators for signal enforcement."
    explanation: Defines the protease function lost alongside the scaffold.
  - reference: PMID:40748513
    reference_title: "Loss of MALT1 Function in a Patient With Combined Immunodeficiency: a Novel Pathogenic Variant and Immunological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human MALT1 deficiency causes profound CID by impairing CBM-mediated NF-kB signaling and MALT1-paracaspase activity."
    explanation: >-
      The patient study's conclusion that the human disease includes loss of
      paracaspase activity, not only of the scaffold function.
  downstream:
  - target: Impaired Th17 Immunity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In mouse T cells lacking MALT1 protease activity, Th17 differentiation fails
      in vitro. The human evidence is only the low Th17 count, so the route in
      patients is inferred from the model.
    evidence:
    - reference: PMID:25762782
      reference_title: "Deficiency of MALT1 paracaspase activity results in unbalanced regulatory and effector T and B cell responses leading to multiorgan inflammation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro, inactivation of MALT1 protease activity caused reduced stimulation-induced T cell proliferation, impaired IL-2 and TNF-α production, as well as defective Th17 differentiation."
      explanation: >-
        Cultured T cells from protease-deficient mice fail to differentiate into
        Th17 cells, which ties the Th17 defect to the protease arm.
  - target: Regulatory T Cell Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25456129
      reference_title: "Uncoupling Malt1 threshold function from paracaspase activity results in destructive autoimmune inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Paracaspase activity is essential for regulatory T cell (Treg) and innate-like B cell development, but it is largely dispensable for overcoming Malt1-dependent thresholds for lymphocyte activation."
      explanation: >-
        Paracaspase-dead knock-in mice separate the two functions and show that
        the protease is what regulatory T cells need.
    - reference: PMID:34668583
      reference_title: "MALT1 protease function in regulatory T cells induces MYC activity to promote mitochondrial function and cellular expansion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MALT1 protease activity controls the TCR-induced upregulation of the transcription factor MYC and the subsequent expression of MYC target genes in Tregs."
      explanation: Supplies the downstream route from the protease to regulatory T cell expansion.

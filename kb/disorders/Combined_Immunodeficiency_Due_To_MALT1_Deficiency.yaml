    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoglobulin replacement and antibiotics prophylaxis were mostly ineffective in reducing the frequency of infections and other complications."
    explanation: "Immunoglobulin replacement was mostly ineffective, so the evidence does not support it as disease-modifying."
  - reference: PMID:23727036
    reference_title: "A homozygous mucosa-associated lymphoid tissue 1 (MALT1) mutation in a family with combined immunodeficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite intravenous immunoglobulin (IVIG) replacement therapy, both patients had persistent infections and expired from respiratory failure."
    explanation: "Both index siblings died of infection despite immunoglobulin replacement."
- name: Antibiotic Prophylaxis
  description: >-
    Antibiotic prophylaxis is used as bridging care before transplantation, but in
    the largest cohort it did not reduce infection frequency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:35079916
    reference_title: "Expanding the Clinical and Immunological Phenotypes and Natural History of MALT1 Deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunoglobulin replacement and antibiotics prophylaxis were mostly ineffective in reducing the frequency of infections and other complications."
    explanation: "Antibiotic prophylaxis was mostly ineffective at reducing infections."
diagnosis:
- name: Lymphocyte function testing with normal lymphocyte counts
  description: >-
    T and B cell counts are often normal at presentation, so the diagnosis rests on
    functional testing: proliferation to antigens and anti-CD3, IL-2 production,
    NF-kappaB activation on stimulation, and vaccine antibody responses.
  presence: PRESENT
  evidence:
  - reference: PMID:23727036
    reference_title: "A homozygous mucosa-associated lymphoid tissue 1 (MALT1) mutation in a family with combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The numbers of circulating T and B lymphocytes were normal, but T-cell proliferation to antigens and antibody responses to vaccination were severely impaired in both patients."
    explanation: Normal counts with failed function is the pattern functional testing has to detect.
- name: Molecular genetic testing for biallelic MALT1 variants
  description: >-
    Confirmation is by finding biallelic MALT1 variants. The eczema, raised IgE and
    staphylococcal infections overlap with DOCK8 deficiency and CARD11 deficiency,
    which is why molecular testing rather than the clinical picture decides the
    diagnosis.
  presence: PRESENT
  evidence:
  - reference: PMID:39017781
    reference_title: "A novel MALT1 variant in an Egyptian patient presenting with exfoliative dermatitis: a case-based review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, whenever DOCK 8 has been excluded, the molecular diagnosis is mandatory as this could lead to discovering more patients hence better understanding and reporting of the phenotype and natural history of the disease especially since there are very few documented cases."
    explanation: States that molecular diagnosis is required once DOCK8 deficiency is excluded.
- name: Newborn TREC screening can be normal
  description: >-
    Because T cells are produced in normal numbers, TREC-based newborn screening for
    SCID can return a normal result. One patient's newborn dried blood spot had a
    TREC count well above the cut-off, although another patient had reduced TRECs
    on testing after presentation (PMID:40748513), so a normal newborn screen does
    not exclude the disease.
  presence: PRESENT
  evidence:
  - reference: PMID:25627829
    reference_title: "Combined immunodeficiency due to MALT1 mutations, treated by hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal T cell engraftment was absent, and the newborn dried blood spot, retrieved from the time of the patient’s birth, had 627 T cell receptor excision circles (TRECs)/μL (normal >40)."
    explanation: A normal newborn TREC count in a MALT1-deficient patient.
animal_models:
- name: Malt1 protease-dead knock-in mouse
  species: Mouse
  genotype: Malt1 paracaspase-inactive knock-in, scaffold function retained
  publication: PMID:25456129
  description: >-
    Mice carrying a catalytically inactive MALT1 separate the protease from the
    scaffold. They lose regulatory T cells and develop a lethal inflammatory
    syndrome, which is the basis for attributing the regulatory T cell defect of the
    human disease to loss of protease activity.
  modeled_mechanisms:
  - target: Regulatory T Cell Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Protease inactivation alone is enough to block regulatory T cell development.
    limitations: >-
      The knock-in keeps the scaffold function, whereas most patient alleles abolish
      the protein, so the model isolates the protease arm rather than reproducing
      the human lesion.
    evidence:
    - reference: PMID:25456129
      reference_title: "Uncoupling Malt1 threshold function from paracaspase activity results in destructive autoimmune inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Paracaspase activity is essential for regulatory T cell (Treg) and innate-like B cell development, but it is largely dispensable for overcoming Malt1-dependent thresholds for lymphocyte activation."
      explanation: Shows the regulatory T cell defect in the protease-dead mouse.
- name: Malt1 knockout mouse
  species: Mouse
  genotype: Malt1 germline knockout
  publication: PMID:31632405
  description: >-
    Complete loss of MALT1, the closer match to the null alleles seen in most
    patients. With age these mice develop atopic-like dermatitis preceded by Th2
    skewing, raised serum IgE and reduced regulatory T cells.
  modeled_mechanisms:
  - target: Th2-Skewed Immune Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the Th2 skewing, raised IgE and eczematous skin disease of the human disease.
    limitations: >-
      The dermatitis appears only as the mice age, whereas skin disease in patients
      begins in infancy, so the time course differs from the human disease.
    evidence:
    - reference: PMID:31632405
      reference_title: "MALT1-Deficient Mice Develop Atopic-Like Dermatitis Upon Aging."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "here we report that MALT1-deficient mice develop atopic-like dermatitis upon aging, which is preceded by Th2 skewing, an increase in serum IgE, and a decrease in Treg frequency and surface expression of the Treg functionality marker CTLA-4."
      explanation: The knockout develops the Th2 and IgE phenotype with atopic-like skin disease.

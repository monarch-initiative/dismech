      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Human MALT1 deficiency causes profound CID by impairing CBM-mediated NF-kB signaling and MALT1-paracaspase activity."
      explanation: >-
        Names both consequences of losing the protein, the scaffold-dependent
        NF-kappaB defect and the protease defect, which is why this node has two
        downstream edges.
  - target: Loss of MALT1 Paracaspase Activity
    causal_link_type: DIRECT

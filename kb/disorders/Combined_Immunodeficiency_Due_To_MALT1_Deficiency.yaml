- name: Impaired Th17 Immunity
  biological_scale: CELLULAR
  description: >-
    Th17 cells are low in patient blood. The pathogens that dominate the disease,
    Staphylococcus aureus and Candida albicans, are the ones Th17 immunity controls,
    the same pattern seen in STAT3 and IL-17 pathway deficiencies. MALT1 is also
    needed in dendritic cells for dectin-driven IL-1beta and IL-23, the cytokines
    that polarise Th17 cells, so the defect may have an innate as well as a T cell
    component.

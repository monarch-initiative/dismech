treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic haematopoietic stem cell transplantation is the only curative treatment.
    It restores NF-kappaB signalling, regulatory T cells and B cell maturation, and
    survival is higher in transplanted patients, so it should be offered early.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Regulatory T Cell Deficiency
    description: Donor-derived lymphocytes restore the regulatory T cell compartment.
    evidence:
    - reference: PMID:27253662
      reference_title: "Deficiency in Mucosa-associated Lymphoid Tissue Lymphoma Translocation 1: A Novel Cause of IPEX-Like Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunological workup at 6 and 12 months after transplantation showed normal NF-κB activation and correction of regulatory T cells frequency."
      explanation: "Regulatory T cell frequency and NF-kappaB activation were corrected after transplantation."
  - target: Defective CBM Signalosome Signaling to NF-kappaB
    description: Donor cells carry functional MALT1, so antigen receptor signalling to NF-kappaB is restored.
    evidence:
    - reference: PMID:27253662
      reference_title: "Deficiency in Mucosa-associated Lymphoid Tissue Lymphoma Translocation 1: A Novel Cause of IPEX-Like Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunological workup at 6 and 12 months after transplantation showed normal NF-κB activation and correction of regulatory T cells frequency."
      explanation: "NF-kappaB activation was normal after transplantation."
  - target: Arrested B Cell Maturation and Progressive B Cell Depletion
    description: Transplantation reconstitutes mature B cell differentiation.
    evidence:
    - reference: PMID:34559885
      reference_title: "Progressive B cell depletion in human MALT1 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hematopoietic cell transplantation (HCT) successfully reconstituted the differentiation of mature B cells and T cells."
      explanation: "B and T cell differentiation was reconstituted by transplantation."
  evidence:
  - reference: PMID:35079916
    reference_title: "Expanding the Clinical and Immunological Phenotypes and Natural History of MALT1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyzing this cohort with reported patients revealed overall survival in 58% (11/19), which was higher in patients who underwent HSCT"
    explanation: "Survival across 19 patients was higher with transplantation."
  - reference: PMID:27253662
    reference_title: "Deficiency in Mucosa-associated Lymphoid Tissue Lymphoma Translocation 1: A Novel Cause of IPEX-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following identification of the mutation, both children received hematopoietic stem cell transplantation, which permitted full clinical recovery."
    explanation: "Full clinical recovery after transplantation in two siblings."
  - reference: PMID:40748513
    reference_title: "Loss of MALT1 Function in a Patient With Combined Immunodeficiency: a Novel Pathogenic Variant and Immunological Insights."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prompt hematopoietic stem cell transplantation (HSCT) is highly recommended as an effective therapy for MALT1 deficiency."
    explanation: "The case report's conclusion recommending early transplantation."
- name: Immunoglobulin Replacement Therapy
  description: >-
    Supportive only. In the largest cohort immunoglobulin replacement did little to
    reduce infections, which is why transplantation is recommended for every patient.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:

- name: Failure of Sarcomere Attachment to the Sarcolemma
  biological_scale: CELLULAR
  role: effector
  description: >-
    Filamin C cross-links actin at the Z-disc and is essential for attachment of
    the sarcomere to the plasma membrane, coupling contractile force to the cell
    surface and the surrounding matrix. Halving the available protein degrades that
    linkage, so force generated by an intact contractile apparatus is transmitted
    poorly to and between cells. The lesion is one of mechanical coupling rather
    than of force generation, calcium regulation or protein quality control.

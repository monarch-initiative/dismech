notes: >-
  Naming and mapping. The entity is named after the ClinGen gene-disease pair
  ("FLNC / dilated cardiomyopathy", Definitive, autosomal dominant, Dilated
  Cardiomyopathy Gene Curation Expert Panel), following the ClinGen convention of
  curating a gene against a disease entity rather than against a numbered
  phenotypic-series locus. The `disease_term` is deliberately left unmapped: there
  is no numbered CMD class in MONDO for FLNC-related dilated cardiomyopathy, and
  the available alternatives are each wrong in a different way - MONDO:0016189
  (qualitative or quantitative defects of filamin C) is a filaminopathy class
  spanning the myopathies rather than a cardiomyopathy entity, while MONDO:0005021
  (dilated cardiomyopathy) is the general umbrella already carried by the DisMech
  umbrella entry. Recording no term is more honest than asserting a mapping the
  concept does not have.

  Scope, and its relation to the other FLNC entries. This entry covers the
  TRUNCATING allele class only. The dichotomy is the entity's defining feature and
  is evidenced rather than assumed: truncating variants act by haploinsufficiency
  and were absent from 1,078 hypertrophic cardiomyopathy patients, and truncating
  carriers' myocardium shows no abnormal filamin C aggregates. The non-truncating
  (predominantly missense) allele class, which produces misfolded aggregate-forming
  filamin C, is curated separately as `Hypertrophic Cardiomyopathy 26` and, for the
  skeletal-muscle-predominant presentation, `Myofibrillar Myopathy`. The three
  entries partition the FLNC allele spectrum rather than overlapping.

  Grouping membership deliberately withheld. This entry is NOT a member of the
  `Familial Dilated Cardiomyopathy` grouping, for two reasons. Its phenotype is an
  overlapping dilated and left-dominant *arrhythmogenic* cardiomyopathy rather than
  an isolated dilated one, so it sits outside that grouping's "isolated" clause;
  and the grouping's mapping records a verified CONSISTENT relationship in which
  every member is a direct MONDO child of MONDO:0700335, which an unmapped entry
  cannot satisfy. Admitting it would weaken a claim the grouping currently makes
  honestly.

  Clinical caveat worth preserving: arrhythmic risk in this entity is not tracked
  by ejection fraction. Malignant ventricular arrhythmia occurs at mild-to-moderate
  systolic dysfunction, so conventional EF-based thresholds for prophylactic
  defibrillator therapy under-call it - the same property recorded for RBM20
  (CMD1DD) and the other arrhythmogenic left ventricular cardiomyopathy genes.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary FLNC cohort and pedigree literature
  cited throughout, principally PMID:27908349, PMID:33978673.

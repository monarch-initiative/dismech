name: FLNC-Related Dilated Cardiomyopathy
creation_date: "2026-08-23T00:00:00Z"
synonyms:
- FLNC-related dilated cardiomyopathy
- truncating FLNC cardiomyopathy
- FLNCtv cardiomyopathy
- filamin C truncating variant cardiomyopathy
- FLNC-related dilated and left-dominant arrhythmogenic cardiomyopathy
description: >-
  FLNC-related dilated cardiomyopathy is the disease caused by truncating variants
  in FLNC, the gene encoding filamin C - the large actin cross-linking protein of
  the striated-muscle Z-disc that is essential for attachment of the sarcomere to
  the plasma membrane. The entity is named here after the ClinGen gene-disease
  pair, which the Dilated Cardiomyopathy Gene Curation Expert Panel classifies as
  Definitive with autosomal dominant inheritance.
  What defines this entity is an allele-class dichotomy that is unusually clean for
  a cardiomyopathy gene. Truncating FLNC variants (FLNCtv) act by
  haploinsufficiency and cause an overlapping phenotype of dilated and
  left-dominant arrhythmogenic cardiomyopathy; non-truncating (predominantly
  missense) variants instead produce misfolded, aggregate-forming filamin C and
  cause hypertrophic and restrictive disease with myofibrillar myopathy, curated
  separately in this knowledge base as Hypertrophic Cardiomyopathy 26 and
  Myofibrillar Myopathy. The separation is empirical, not theoretical: truncating
  FLNC variants were absent from 1,078 patients with hypertrophic cardiomyopathy,
  and myocardial tissue from truncating carriers showed no abnormal filamin C
  aggregates - the aggregate mechanism of the missense arm is simply not operating.
  Clinically the disease is high-risk and arrhythmia-led: ventricular arrhythmias
  and myocardial fibrosis are common, penetrance exceeds 97% after age 40, and
  malignant ventricular arrhythmia occurs at only mild-to-moderate degrees of left
  ventricular systolic dysfunction, so ejection-fraction thresholds developed for
  ordinary dilated cardiomyopathy under-call the need for defibrillator therapy.

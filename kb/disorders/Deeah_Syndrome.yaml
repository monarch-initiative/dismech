name: Deeah Syndrome
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
description: >-
  DEEAH syndrome (developmental delay with endocrine, exocrine, autonomic, and
  hematologic abnormalities) is a rare autosomal recessive multisystem disorder
  caused by biallelic loss-of-function variants in MADD (MAP-kinase-activating
  death domain protein; hgnc:6766 - the gene, not to be confused with the
  unrelated metabolic disorder abbreviated MADD, multiple acyl-CoA dehydrogenase
  deficiency). MADD is a large multidomain protein that acts as a DENN-domain
  guanine-nucleotide exchange factor (GEF) for Rab3 and Rab27 small GTPases,
  regulates vesicular trafficking, and transduces TNF-alpha/neurotrophin-receptor
  survival signaling that restrains apoptosis. Biallelic MADD loss produces an
  allelic phenotypic spectrum. This entry curates that biallelic-MADD spectrum
  as a single disease with a conserved gene-and-mechanism pathograph rather than
  splitting it into subtypes: its severe end is DEEAH proper ("Group 1", OMIM
  #619004), with profound developmental delay and combined endocrine, exocrine,
  sensory/autonomic, and hematologic dysfunction and a potentially fatal course
  in the first years of life; the milder, predominantly neurological allelic form
  ("Group 2", the neurodevelopmental disorder with dysmorphic facies and thin
  corpus callosum, OMIM #619005) shares developmental delay, hypotonia, speech
  impairment, and seizures with better survival. Phenotype frequencies below are
  reported for the severe end unless noted; features drawn from the milder form
  (e.g. seizures) are labeled as spectrum features.

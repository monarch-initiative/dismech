name: Deeah Syndrome
creation_date: "2026-09-05T00:00:00Z"
category: Mendelian
description: >-
  DEEAH syndrome (developmental delay with endocrine, exocrine, autonomic, and
  hematologic abnormalities) is a rare autosomal recessive multisystem disorder
  caused by biallelic loss-of-function variants in MADD (MAP-kinase-activating
  death domain protein; hgnc:6766 - the gene, not to be confused with the
  unrelated metabolic disorder abbreviated MADD, multiple acyl-CoA dehydrogenase
  deficiency). MADD is a large multidomain protein that acts as a DENN-domain
  guanine-nucleotide exchange factor (GEF) for Rab3 and Rab27 small GTPases,
  regulates vesicular trafficking, and transduces TNF-alpha/neurotrophin-receptor
  survival signaling that restrains apoptosis. Biallelic MADD loss causes a
  phenotypic spectrum: at the severe end (DEEAH, "Group 1"), affected infants
  have profound developmental delay with combined endocrine, exocrine, sensory
  and autonomic nervous system, and hematologic dysfunction, and a potentially
  fatal course in the first years of life; a milder predominantly neurological
  form ("Group 2") shares developmental delay, hypotonia, speech impairment, and
  seizures with better survival.
disease_term:
  preferred_term: DEEAH syndrome
  term:
    id: MONDO:0033561
    label: deeah syndrome
parents:
- Autosomal recessive neurodevelopmental disorder
- Rab GTPase / vesicular trafficking disorder
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    DEEAH syndrome is inherited in an autosomal recessive pattern; affected
    individuals carry biallelic (homozygous or compound heterozygous)
    loss-of-function MADD variants, with unaffected heterozygous carrier
    parents. Many reported families are consanguineous.
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a pleiotropic disorder with a unique constellation of neurological, endocrine, exocrine, and haematological findings that is caused by biallelic MADD variants"
    explanation: Establishes biallelic (recessive) MADD variants as the cause.
genetic:
- name: MADD biallelic loss-of-function
  association: Causative
  gene_term:
    preferred_term: MADD
    term:
      id: hgnc:6766
      label: MADD
  notes: >-
    Biallelic (homozygous or compound heterozygous) germline MADD variants -
    including nonsense, frameshift, splice-site, and missense alleles - cause the
    disorder. Patient fibroblasts show aberrant MADD transcripts and drastic
    reduction or loss of MADD protein, consistent with a loss-of-function
    mechanism. MADD encodes the MAP-kinase-activating death domain protein (also
    called DENN/MADD, IG20, Rab3-GEP), a DENN-domain guanine-nucleotide exchange
    factor for Rab3 and Rab27. This is the gene MADD, distinct from the metabolic
    disorder abbreviation MADD (multiple acyl-CoA dehydrogenase deficiency).
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we collected 23 patients with 21 different pathogenic MADD variants identified by next-generation sequencing"
    explanation: Establishes MADD as the causative gene with a spectrum of pathogenic variants.
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Relative quantification of MADD mRNA and protein in fibroblasts of five affected individuals showed a drastic reduction or loss of MADD"
    explanation: Documents loss of MADD protein in patient cells, supporting a loss-of-function mechanism.
pathophysiology:
- name: Biallelic MADD Loss of Function
  description: >-
    Biallelic pathogenic MADD variants generate aberrant transcripts and cause a
    drastic reduction or loss of MADD protein, removing a multifunctional
    signaling and trafficking regulator from cells throughout the body.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MADD
    term:
      id: hgnc:6766
      label: MADD
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) germline MADD variants,
      including nonsense, frameshift, splice-site, and missense alleles, with
      loss of MADD protein in patient cells.
  downstream:
  - target: Impaired Rab-GEF Vesicular Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32761064
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MADD deficiency underlies multiple cellular defects that can be attributed to alterations of TNF-α-dependent signalling pathways and defects in vesicular trafficking"
      explanation: Links MADD loss to defective vesicular trafficking.
  - target: Impaired TNF-alpha Cytoprotective Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32761064
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment of patient-derived fibroblasts with TNF-α resulted in reduced phosphorylation of the extracellular signal-regulated kinases 1 and 2"
      explanation: Shows MADD loss disrupts TNF-alpha-driven ERK survival signaling.
  molecular_functions:
  - preferred_term: MADD guanyl-nucleotide exchange factor activity toward Rab GTPases
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of mRNA revealed multiple aberrant MADD transcripts in two patient-derived fibroblast cell lines"
    explanation: Documents the aberrant transcripts underlying loss of MADD protein.
- name: Impaired Rab-GEF Vesicular Trafficking
  description: >-
    MADD is a DENN-domain guanine-nucleotide exchange factor that activates Rab3
    and Rab27 (and additional Rab substrates such as Rab8B, Rab15, Rab26,
    Rab37). Loss of MADD impairs Rab-dependent membrane trafficking and
    regulated secretion/endocytosis; patient cells show a defect in endocytosis
    of epidermal growth factor. Because Rab3/Rab27-dependent regulated exocytosis
    underlies neurotransmitter, hormone, and other secretory-granule release,
    this trafficking defect propagates to secretory tissues.
  biological_scale: CELLULAR
  downstream:
  - target: Endocrine and Exocrine Secretory Dysfunction
    causal_link_type: DIRECT
  - target: Autonomic and Sensory Nervous System Dysfunction
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: Rab-regulated vesicle-mediated transport
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: regulated exocytosis of secretory granules
    term:
      id: GO:0045055
      label: regulated exocytosis
    modifier: DECREASED
  - preferred_term: receptor internalization (EGF endocytosis)
    term:
      id: GO:0031623
      label: receptor internalization
    modifier: DECREASED
  evidence:
  - reference: PMID:40812422
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DENN domain-bearing proteins have guanine nucleotide exchange factor activity toward Rab GTPases"
    explanation: Establishes MADD's DENN domain as a Rab-GEF, the activity lost in disease.
  - reference: PMID:40812422
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed known interactions of DENN/MADD with Rab3A, Rab3B, Rab3C, Rab3D, and Rab27B and identified four new potential substrates, Rab8B, Rab15, Rab26, and Rab37"
    explanation: Identifies the Rab GTPase substrates whose activation depends on MADD.
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We analysed internalization of epidermal growth factor in patient cells and identified a defect in endocytosis of epidermal growth factor"
    explanation: Demonstrates a vesicular-trafficking (endocytosis) defect in patient cells.
- name: Impaired TNF-alpha Cytoprotective Signaling
  description: >-
    MADD couples TNF-receptor and neurotrophin-receptor engagement to
    pro-survival ERK1/2 (MAPK) activation, restraining apoptosis. Loss of MADD
    reduces TNF-alpha-induced ERK1/2 phosphorylation, shifting the balance toward
    programmed cell death.
  biological_scale: MOLECULAR
  downstream:
  - target: Increased Neuronal Apoptosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32761064
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "enhanced activation of the pro-apoptotic enzymes caspase-3 and -7 and increased apoptosis compared to control cells"
      explanation: Loss of MADD cytoprotective signaling increases caspase activation and apoptosis.
  biological_processes:
  - preferred_term: tumor necrosis factor-mediated signaling pathway
    term:
      id: GO:0033209
      label: tumor necrosis factor-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: ERK1 and ERK2 survival cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: DECREASED
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment of patient-derived fibroblasts with TNF-α resulted in reduced phosphorylation of the extracellular signal-regulated kinases 1 and 2"
    explanation: Directly measures reduced ERK1/2 activation in patient cells.
- name: Increased Neuronal Apoptosis
  description: >-
    Failure of MADD-dependent survival signaling activates the effector caspases
    caspase-3 and caspase-7, increasing apoptosis. In neurons and other
    post-mitotic and secretory cells this loss of an anti-apoptotic brake is a
    proposed driver of the developmental and multisystem phenotype.
  biological_scale: CELLULAR
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Autonomic and Sensory Nervous System Dysfunction
    causal_link_type: DIRECT
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enhanced activation of the pro-apoptotic enzymes caspase-3 and -7 and increased apoptosis compared to control cells"
    explanation: Documents increased effector-caspase activation and apoptosis on loss of MADD.
- name: Endocrine and Exocrine Secretory Dysfunction
  description: >-
    Because Rab3/Rab27-dependent regulated secretion underlies hormone and
    exocrine-gland output, MADD deficiency produces combined endocrine and
    exocrine dysfunction. Reported manifestations include dysregulated glucose
    homeostasis (neonatal hypoglycemia and hyperglycemia) and other endo- and
    exocrine gland involvement.
  biological_scale: ORGANISM
  downstream:
  - target: Hypoglycemia
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: regulated exocytosis (hormone/secretory release)
    term:
      id: GO:0045055
      label: regulated exocytosis
    modifier: DECREASED
  cell_types:
  - preferred_term: secretory cell
    term:
      id: CL:0000151
      label: secretory cell
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe developmental delay, endo- and exocrine dysfunction, impairment of the sensory and autonomic nervous system, and haematological anomalies"
    explanation: Establishes combined endocrine and exocrine dysfunction as a core DEEAH feature.
- name: Autonomic and Sensory Nervous System Dysfunction
  description: >-
    MADD deficiency impairs the physiological function of the sensory and
    autonomic nervous system, part of the pleiotropic DEEAH phenotype and a
    contributor to feeding, gastrointestinal, and dysautonomic problems.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reveal its physiological role in regulating the function of the sensory and autonomic nervous system and endo- and exocrine glands"
    explanation: Supports sensory/autonomic nervous system dysfunction as a MADD-dependent mechanism.
phenotypes:
- name: Global developmental delay
  description: >-
    Profound-to-severe global developmental delay is a defining feature; the
    severe (DEEAH/Group 1) form shows profound delay.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Group 1 consists of 14 patients with severe developmental delay, endo- and exocrine dysfunction, impairment of the sensory and autonomic nervous system, and haematological anomalies"
    explanation: Severe developmental delay defines the DEEAH (Group 1) phenotype.
- name: Axial hypotonia
  description: Neonatal/axial hypotonia is present in essentially all reported patients.
  phenotype_term:
    preferred_term: Axial hypotonia
    term:
      id: HP:0008936
      label: Axial hypotonia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe neonatal hypotonia, failure to thrive, multiple organ dysfunction, and early lethality"
    explanation: Neonatal hypotonia is a consistent feature at the severe end of the spectrum.
- name: Seizures
  description: Seizures (often generalized tonic-clonic) occur in a majority of patients.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  frequency: FREQUENT
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild-to-severe developmental delay, hypotonia, speech impairment, and seizures"
    explanation: Seizures are part of the MADD-related neurodevelopmental phenotype.
- name: Failure to thrive
  description: Failure to thrive and poor growth are characteristic of the severe form.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe neonatal hypotonia, failure to thrive, multiple organ dysfunction, and early lethality"
    explanation: Failure to thrive is a consistent severe-end feature.
- name: Chronic diarrhea
  description: >-
    Chronic diarrhea (with recurrent infections) reflects exocrine and
    autonomic gastrointestinal involvement.
  phenotype_term:
    preferred_term: Chronic diarrhea
    term:
      id: HP:0002028
      label: Chronic diarrhea
  frequency: FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "displaying neonatal respiratory distress, hypotonia and chronic diarrhea"
    explanation: Chronic diarrhea is reported at the severe end of the spectrum.
- name: Anemia
  category: Hematologic
  description: >-
    Anemia is the most consistent hematologic anomaly, sometimes requiring
    transfusion; thrombocytopenia or thrombocytosis also occur.
  phenotype_term:
    preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hematological abnormalities (>90% of cases), and neonatal hypoglycemia (>90% of cases) are consistent features in the lethal group"
    explanation: Hematological abnormalities (chiefly anemia) are present in >90% of severe-form patients.
- name: Thrombocytopenia
  category: Hematologic
  description: >-
    Thrombocytopenia (with anemia and a prolonged bleeding profile) is among the
    reported hematologic anomalies, sometimes requiring transfusion.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The only notable abnormal laboratory findings were severe microcytic anemia, thrombocytopenia, and prolonged bleeding profile that nictitated blood transfusion."
    explanation: Explicitly reports thrombocytopenia (with anemia) among the hematologic findings.
- name: Hypoglycemia
  category: Endocrine
  description: >-
    Dysregulated glucose homeostasis, including neonatal hypoglycemia (and in
    some patients hyperglycemia), reflects endocrine dysfunction.
  phenotype_term:
    preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "failure to thrive (>70% of cases), hematological abnormalities (>90% of cases), and neonatal hypoglycemia (>90% of cases) are consistent features in the lethal group"
    explanation: Neonatal hypoglycemia is a consistent (>90%) endocrine feature of the severe form.
- name: Abnormal autonomic nervous system physiology
  description: >-
    Impairment of the autonomic (and sensory) nervous system is a hallmark of
    the severe DEEAH phenotype.
  phenotype_term:
    preferred_term: Abnormal autonomic nervous system physiology
    term:
      id: HP:0012332
      label: Abnormal autonomic nervous system physiology
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impairment of the sensory and autonomic nervous system"
    explanation: Directly supports autonomic nervous system dysfunction.
- name: Neonatal respiratory distress
  description: Neonatal respiratory distress occurs at the severe end of the spectrum.
  phenotype_term:
    preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  frequency: FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "displaying neonatal respiratory distress, hypotonia and chronic diarrhea"
    explanation: Neonatal respiratory distress is reported in severe-form patients.
- name: Arthrogryposis multiplex congenita
  description: >-
    Distal arthrogryposis (clenched hands, rocker-bottom feet, talipes) has been
    reported as an expansion of the MADD phenotype.
  phenotype_term:
    preferred_term: Arthrogryposis multiplex congenita
    term:
      id: HP:0002804
      label: Arthrogryposis multiplex congenita
  frequency: FREQUENT
  evidence:
  - reference: PMID:38459224
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed distal arthrogryposis and nonspecific structural brain anomalies in all our patients"
    explanation: Arthrogryposis was observed in all patients of this cohort.
- name: Agenesis of corpus callosum
  description: >-
    Corpus callosum agenesis/hypogenesis and other structural brain anomalies
    are reported, including in a severe case with adrenal and scrotal agenesis.
  phenotype_term:
    preferred_term: Agenesis of corpus callosum
    term:
      id: HP:0001274
      label: Agenesis of corpus callosum
  frequency: FREQUENT
  evidence:
  - reference: PMID:37932938
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel findings include corpus callosum agenesis, bilateral adrenal agenesis, scrotal aplasia, and abnormal skin pigmentation"
    explanation: Reports corpus callosum agenesis as part of the MADD phenotype.
- name: Cryptorchidism
  description: >-
    Genital anomalies including undescended testes are frequently reported in
    affected males.
  phenotype_term:
    preferred_term: Cryptorchidism
    term:
      id: HP:0000028
      label: Cryptorchidism
  frequency: FREQUENT
  evidence:
  - reference: PMID:37932938
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corpus callosum agenesis, bilateral adrenal agenesis, scrotal aplasia, and abnormal skin pigmentation"
    explanation: Documents genital/scrotal involvement in MADD deficiency.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    multidisciplinary, addressing the endocrine, exocrine, autonomic, and
    hematologic organ systems - including nutritional support and management of
    failure to thrive, treatment of seizures, glucose monitoring, and
    transfusion for anemia - with genetic counseling for the family given
    autosomal recessive inheritance and the potentially fatal early course of
    the severe form.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course during the first years of life can be potentially fatal"
    explanation: The severe, potentially fatal multisystem course frames management as supportive and multidisciplinary.
- name: Antiseizure Medication
  description: >-
    Seizures are treated with antiepileptic drugs; reported cases achieved
    seizure control on standard antiepileptic therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:32761064
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild-to-severe developmental delay, hypotonia, speech impairment, and seizures"
    explanation: Seizures are part of the phenotype and are managed pharmacologically.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Group 1 consists of 14 patients with severe developmental delay, endo- and exocrine dysfunction, impairment of the sensory and autonomic nervous system, and haematological anomalies"
    explanation: Severe developmental delay defines the DEEAH (Group 1) phenotype.
- name: Axial hypotonia

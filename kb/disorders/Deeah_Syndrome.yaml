- name: Impaired Neuronal Rab3-Dependent Synaptic Vesicle Exocytosis
  description: >-
    MADD/DENN exhibits guanine-nucleotide exchange factor activity toward
    neuronal Rab3 isoforms (Rab3A, Rab3B, Rab3C, Rab3D) that regulate
    calcium-dependent neurotransmitter exocytosis and KIF1A/KIF1B-beta-mediated
    presynaptic vesicle transport. Patient-derived DENN-domain missense
    variants (such as P372L in severe Group 1 disease and L346P in
    predominantly neurological Group 2 disease) abolish recruitment and
    activation of Rab3A, Rab3B, and Rab3D, impairing synaptic neurotransmission
    underlying global developmental delay, hypotonia, and seizures.
  biological_scale: CELLULAR

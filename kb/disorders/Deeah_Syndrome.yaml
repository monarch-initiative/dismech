experimental_models:
- name: MADD-deficient stem-cell-derived pancreatic islets
  experimental_model_type: ORGANOID
  description: >-
    Human embryonic stem cell-derived pancreatic islets (self-organizing 3D
    islet organoids) carrying the MADD exon 30-skipping splice variant, used to
    model the endocrine (islet) dysfunction of MADD deficiency.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38775154
  modeled_mechanisms:
  - target: Endocrine and Exocrine Secretory Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reduced beta-cell number, decreased insulin content, and an increased
      proinsulin-to-insulin ratio in MADD-deficient islets model the pancreatic
      endocrine component of the disease.
    limitations: >-
      An in-vitro stem-cell-derived islet model observes cellular/islet-level
      readouts only; the organism-level combined endo-/exocrine and multisystem
      dysfunction is inferred, and the model captures the pancreatic component
      rather than the full endocrine spectrum (e.g. pituitary).
    readouts:
    - name: Beta-cell number, insulin content, proinsulin-to-insulin ratio
      target: Endocrine and Exocrine Secretory Dysfunction
      direction: DECREASED
      interpretation: Reduced insulin content and beta-cell number report impaired islet endocrine output.
      evidence:
      - reference: PMID:38775154
        reference_title: "A splice site variant in MADD affects hormone expression in pancreatic β cells and pituitary gonadotropes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We observed reduced numbers of β cells, decreased insulin content, and increased proinsulin-to-insulin ratio in dex30 human embryonic stem cell-derived pancreatic islets."
        explanation: Reports the islet measurements grounding this readout.
    evidence:
    - reference: PMID:38775154
      reference_title: "A splice site variant in MADD affects hormone expression in pancreatic β cells and pituitary gonadotropes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We discovered reduced differentiation efficiency of stem cell–derived dex30 pancreatic progenitors and deficient insulin content and processing in dex30 pancreatic β cells."
      explanation: Supports treating the MADD-deficient islet model as informative for the endocrine dysfunction node.
treatments:

- name: Endocrine and Exocrine Secretory Dysfunction
  description: >-
    Because Rab3/Rab27-dependent regulated secretion underlies hormone and
    exocrine-gland output, MADD deficiency produces combined endocrine and
    exocrine dysfunction. Reported manifestations include dysregulated glucose
    homeostasis (neonatal hypoglycemia and hyperglycemia), hypopituitarism with
    growth hormone and gonadotropin deficiency, pancreatic exocrine
    insufficiency contributing to chronic diarrhea and poor weight gain, and
    other gland involvement. MADD-deficient stem-cell-derived pancreatic islets
    show reduced beta-cell number, decreased insulin content, and an increased
    proinsulin-to-insulin ratio.
  biological_scale: ORGANISM
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  - preferred_term: pituitary gland
    term:
      id: UBERON:0000007
      label: pituitary gland

  description: >-
    No disease-modifying therapy exists. Management is supportive and
    multidisciplinary, addressing the endocrine, exocrine, autonomic, and
    hematologic organ systems - including nutritional support and management of
    failure to thrive, glucose monitoring, and transfusion for anemia - with
    genetic counseling for the family given autosomal recessive inheritance and
    the potentially fatal early course of the severe form.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747

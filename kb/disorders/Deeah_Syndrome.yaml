    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    DEEAH syndrome is inherited in an autosomal recessive pattern; affected
    individuals carry biallelic (homozygous or compound heterozygous)
    loss-of-function MADD variants, with unaffected heterozygous carrier
    parents. Many reported families are consanguineous.
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a pleiotropic disorder with a unique constellation of neurological, endocrine, exocrine, and haematological findings that is caused by biallelic MADD variants"
    explanation: Establishes biallelic (recessive) MADD variants as the cause.
genetic:
- name: MADD biallelic loss-of-function
  association: Causative
  gene_term:
    preferred_term: MADD
    term:
      id: hgnc:6766
      label: MADD
  notes: >-
    Biallelic (homozygous or compound heterozygous) germline MADD variants -
    including nonsense, frameshift, splice-site, and missense alleles - cause the
    disorder. Patient fibroblasts show aberrant MADD transcripts and drastic
    reduction or loss of MADD protein, consistent with a loss-of-function
    mechanism. MADD encodes the MAP-kinase-activating death domain protein (also
    called DENN/MADD, IG20, Rab3-GEP), a DENN-domain guanine-nucleotide exchange
    factor for Rab3 and Rab27. This is the gene MADD, distinct from the metabolic
    disorder abbreviation MADD (multiple acyl-CoA dehydrogenase deficiency).
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we collected 23 patients with 21 different pathogenic MADD variants identified by next-generation sequencing"
    explanation: Establishes MADD as the causative gene with a spectrum of pathogenic variants.
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Relative quantification of MADD mRNA and protein in fibroblasts of five affected individuals showed a drastic reduction or loss of MADD"
    explanation: Documents loss of MADD protein in patient cells, supporting a loss-of-function mechanism.
pathophysiology:
- name: Biallelic MADD Loss of Function
  description: >-
    Biallelic pathogenic MADD variants generate aberrant transcripts and cause a
    drastic reduction or loss of MADD protein, removing a multifunctional
    signaling and trafficking regulator from cells throughout the body.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MADD
    term:
      id: hgnc:6766
      label: MADD
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) germline MADD variants,
      including nonsense, frameshift, splice-site, and missense alleles, with
      loss of MADD protein in patient cells.
  downstream:
  - target: Impaired Rab-GEF Vesicular Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32761064
      reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "MADD deficiency underlies multiple cellular defects that can be attributed to alterations of TNF-α-dependent signalling pathways and defects in vesicular trafficking"
      explanation: A conclusion from the patient-fibroblast functional studies linking MADD loss to defective vesicular trafficking.
  - target: Impaired TNF-alpha Cytoprotective Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32761064
      reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment of patient-derived fibroblasts with TNF-α resulted in reduced phosphorylation of the extracellular signal-regulated kinases 1 and 2"
      explanation: Shows MADD loss disrupts TNF-alpha-driven ERK survival signaling.
  molecular_functions:
  - preferred_term: MADD guanyl-nucleotide exchange factor activity toward Rab GTPases
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of mRNA revealed multiple aberrant MADD transcripts in two patient-derived fibroblast cell lines"
    explanation: Documents the aberrant transcripts underlying loss of MADD protein.
- name: Impaired Rab-GEF Vesicular Trafficking
  description: >-
    MADD is a DENN-domain guanine-nucleotide exchange factor that activates Rab3
    and Rab27 (and additional Rab substrates such as Rab8B, Rab15, Rab26,
    Rab37). Loss of MADD impairs Rab-dependent membrane trafficking and
    regulated secretion/endocytosis; patient cells show a defect in endocytosis
    of epidermal growth factor. Because Rab3/Rab27-dependent regulated exocytosis
    underlies neurotransmitter, hormone, and other secretory-granule release,
    this trafficking defect propagates to secretory tissues. Different missense
    alleles impair Rab activation to different degrees, offering a mechanistic
    basis for the severity spectrum (see the P372L/L346P evidence below).
  biological_scale: CELLULAR
  downstream:
  - target: Endocrine and Exocrine Secretory Dysfunction
    causal_link_type: DIRECT
  - target: Autonomic and Sensory Nervous System Dysfunction
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: Rab-regulated vesicle-mediated transport
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: regulated exocytosis of secretory granules
    term:
      id: GO:0045055
      label: regulated exocytosis
    modifier: DECREASED
  - preferred_term: receptor internalization (EGF endocytosis)
    term:
      id: GO:0031623
      label: receptor internalization
    modifier: DECREASED
  evidence:
  - reference: PMID:40812422
    reference_title: "Neurodevelopmental disorder mutations in the exchange factor DENN/MADD disrupt activation of Rab GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DENN domain-bearing proteins have guanine nucleotide exchange factor activity toward Rab GTPases"
    explanation: Establishes MADD's DENN domain as a Rab-GEF, the activity lost in disease.
  - reference: PMID:40812422
    reference_title: "Neurodevelopmental disorder mutations in the exchange factor DENN/MADD disrupt activation of Rab GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed known interactions of DENN/MADD with Rab3A, Rab3B, Rab3C, Rab3D, and Rab27B and identified four new potential substrates, Rab8B, Rab15, Rab26, and Rab37"
    explanation: Identifies the Rab GTPase substrates whose activation depends on MADD.
  - reference: PMID:40812422
    reference_title: "Neurodevelopmental disorder mutations in the exchange factor DENN/MADD disrupt activation of Rab GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of the catalytic activity because of the P372L mutation abolished the mitochondrial recruitment of all Rabs, whereas the L346P mutation abolished the recruitment for all Rabs except Rab3C and Rab27B, which is further explained through structural biology."
    explanation: Substrate-selective loss of Rab activation (all Rabs vs all-but-Rab3C/Rab27B) provides a mechanistic basis for the severe-versus-milder split.
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We analysed internalization of epidermal growth factor in patient cells and identified a defect in endocytosis of epidermal growth factor"
    explanation: Demonstrates a vesicular-trafficking (endocytosis) defect in patient cells.
- name: Impaired TNF-alpha Cytoprotective Signaling
  description: >-
    MADD couples TNF-receptor and neurotrophin-receptor engagement to
    pro-survival ERK1/2 (MAPK) activation, restraining apoptosis. Loss of MADD
    reduces TNF-alpha-induced ERK1/2 phosphorylation, shifting the balance toward
    programmed cell death.
  biological_scale: MOLECULAR
  downstream:
  - target: Increased Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32761064
      reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "enhanced activation of the pro-apoptotic enzymes caspase-3 and -7 and increased apoptosis compared to control cells"
      explanation: Increased caspase-3/-7 activation and apoptosis was measured in patient fibroblasts; its extension to neurons in vivo is an inference.
  biological_processes:
  - preferred_term: tumor necrosis factor-mediated signaling pathway
    term:
      id: GO:0033209
      label: tumor necrosis factor-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: ERK1 and ERK2 survival cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: DECREASED
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment of patient-derived fibroblasts with TNF-α resulted in reduced phosphorylation of the extracellular signal-regulated kinases 1 and 2"
    explanation: Directly measures reduced ERK1/2 activation in patient cells.
- name: Increased Apoptosis
  description: >-
    Failure of MADD-dependent survival signaling activates the effector caspases
    caspase-3 and caspase-7, increasing apoptosis. This was demonstrated in
    patient-derived fibroblasts; loss of this anti-apoptotic brake in neurons and
    other post-mitotic and secretory cells is the inferred in-vivo driver of the
    developmental and multisystem phenotype.
  biological_scale: CELLULAR
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Autonomic and Sensory Nervous System Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  cell_types:
  - preferred_term: fibroblast (patient-derived; neuronal extrapolation inferred)
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enhanced activation of the pro-apoptotic enzymes caspase-3 and -7 and increased apoptosis compared to control cells"
    explanation: Documents increased effector-caspase activation and apoptosis in patient fibroblasts on loss of MADD.
- name: Endocrine and Exocrine Secretory Dysfunction
  description: >-
    Because Rab3/Rab27-dependent regulated secretion underlies hormone and
    exocrine-gland output, MADD deficiency produces combined endocrine and
    exocrine dysfunction. Reported manifestations include dysregulated glucose
    homeostasis (neonatal hypoglycemia and hyperglycemia), hypopituitarism with
    growth hormone deficiency, and other endo- and exocrine gland involvement.
    MADD-deficient stem-cell-derived pancreatic islets show reduced beta-cell
    number, decreased insulin content, and an increased proinsulin-to-insulin
    ratio.
  biological_scale: ORGANISM
  downstream:
  - target: Hypoglycemia
    causal_link_type: DIRECT
  - target: Hypopituitarism
    causal_link_type: DIRECT
  - target: Secondary growth hormone deficiency
    causal_link_type: DIRECT
  biological_processes:
  - preferred_term: regulated exocytosis (hormone/secretory release)
    term:
      id: GO:0045055
      label: regulated exocytosis
    modifier: DECREASED
  cell_types:
  - preferred_term: secretory cell
    term:
      id: CL:0000151
      label: secretory cell
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe developmental delay, endo- and exocrine dysfunction, impairment of the sensory and autonomic nervous system, and haematological anomalies"
    explanation: Establishes combined endocrine and exocrine dysfunction as a core DEEAH feature.
  - reference: PMID:38775154
    reference_title: "A splice site variant in MADD affects hormone expression in pancreatic β cells and pituitary gonadotropes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We observed reduced numbers of β cells, decreased insulin content, and increased proinsulin-to-insulin ratio in dex30 human embryonic stem cell-derived pancreatic islets."
    explanation: Anchors the endocrine (islet) dysfunction in a MADD-deficient stem-cell-derived islet model.
- name: Autonomic and Sensory Nervous System Dysfunction
  description: >-
    MADD deficiency impairs the physiological function of the sensory and
    autonomic nervous system, part of the pleiotropic DEEAH phenotype and a
    contributor to feeding, gastrointestinal, dysautonomic, and central
    respiratory (apnea) problems.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent apnea
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32761064
    reference_title: "Biallelic MADD variants cause a phenotypic spectrum ranging from developmental delay to a multisystem disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reveal its physiological role in regulating the function of the sensory and autonomic nervous system and endo- and exocrine glands"
    explanation: Concluding statement of the functional study attributing sensory/autonomic regulation to MADD.

mechanistic_hypotheses:
- hypothesis_group_id: distinct_genetic_sa_ef
  hypothesis_label: Genetically distinct sustained-attention and executive-function pathways
  status: EMERGING
  description: >-
    Genomic Structural Equation Modeling identified two partially distinct latent
    genetic factors: one influencing sustained attention (SA: vigilance, lapse
    recovery cost, lapse propensity) and one influencing executive function (EF:
    processing speed, response selection, working memory). Both factors show
    unique genetic correlations with ADHD liability and other psychiatric
    outcomes, suggesting that ADHD genetic heterogeneity may partly reflect
    differential loading on SA versus EF genetic architectures. This is an
    emerging hypothesis pending replication in more diverse populations.
  evidence:
  - reference: PMID:42414552
    reference_title: Molecular genetic influences on sustained attention and executive processes and their links with psychopathology in the AFFECT study
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two distinct latent genetic factors: one influencing EF and one
      influencing SA. Both the EF and SA factors were genetically correlated with
      cognitive and clinical phenotypes, with each latent factor uniquely linked to
      liability for psychiatric disorders, including attention-deficit/hyperactivity
      disorder.
    explanation: >-
      The study is the first multivariate GWAS characterization of SA and EF
      genetic covariance (n>20,000, enriched for MDD/bipolar), showing that genetic
      influences on sustained attention are generally distinct from those influencing
      executive function, with both contributing uniquely to ADHD genetic risk.
  - reference: PMID:42414552
    reference_title: Molecular genetic influences on sustained attention and executive processes and their links with psychopathology in the AFFECT study
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They suggest that genetic influences on sustained attention are generally
      distinct from those that influence executive function. The EF and SA factors
      show distinct patterns of genetic overlap with multiple cognitive and
      psychiatric outcomes, underscoring the need for more granular cognitive
      phenotyping to generate new insights into the genetic architecture of
      cognition and the etiology of psychopathology.
    explanation: >-
      The paper directly supports the hypothesis of genetically distinct SA and EF
      pathways and their differential psychiatric correlations.
- hypothesis_group_id: predicted_brain_multiomics_regulation
  hypothesis_label: Genetically predicted brain expression, splicing, and methylation pathways
  status: EMERGING
  description: >-
    Mendelian-randomization and mediation analyses prioritize brain-tissue
    expression, alternative-splicing, and DNA-methylation signals. These are
    statistical predictions intended to guide experimental work, not validated
    universal mechanisms, causal genes, or clinical biomarkers.
  evidence:
  - reference: DOI:10.1093/bib/bbae502
    reference_title: A multi-omics study of brain tissue transcription and DNA methylation revealing the genetic pathogenesis of ADHD
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Finally, we also prioritized the expression of 866 genes showing
      significant causal effects, including COMMD5, ENSG00000271904, HYAL3,
      etc., within at least one brain tissue.
    explanation: >-
      The analysis prioritizes statistically predicted expression effects; the
      hypothesis label and status prevent promotion to established causal genes.
  - reference: DOI:10.1093/bib/bbae502
    reference_title: A multi-omics study of brain tissue transcription and DNA methylation revealing the genetic pathogenesis of ADHD
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We prioritized 966 unique genes that have statistically significant causal
      AS events, within at least one of the 14 different brain tissues.
    explanation: >-
      The study reports predicted alternative-splicing signals across brain
      tissues, retained here as an emerging hypothesis.
  - reference: DOI:10.1093/bib/bbae502
    reference_title: A multi-omics study of brain tissue transcription and DNA methylation revealing the genetic pathogenesis of ADHD
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Furthermore, through mediation analysis, 106 regulatory pathways were
      inferred where DNAm influences ADHD through gene expression or AS
      processes.
    explanation: >-
      The source itself describes the methylation pathways as inferred, so they
      are not placed in the canonical causal graph.
phenotypes:
- name: Short Attention Span
  category: Behavioral
  description: >-
    Developmentally inappropriate difficulty sustaining or directing attention,
    including distractibility and incomplete task follow-through. The required
    symptom count and expression depend on age and presentation.
  phenotype_term:
    preferred_term: Short attention span
    term:
      id: HP:0000736
      label: Short attention span
  diagnostic: true
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pediatrician or other PCC should initiate an evaluation for ADHD for
      any child or adolescent age 4 years to the 18th birthday who presents with
      academic or behavioral problems and symptoms of inattention, hyperactivity,
      or impulsivity
    explanation: >-
      The guideline identifies inattention as a core symptom domain prompting
      ADHD evaluation; impairment and multi-setting criteria are addressed in
      the diagnosis section.
- name: Hyperactivity
  category: Behavioral
  description: >-
    Excessive motor or verbal activity, restlessness, or difficulty remaining
    still relative to developmental level and context. It is not required in the
    predominantly inattentive presentation.
  phenotype_term:
    preferred_term: Hyperactivity
    term:
      id: HP:0000752

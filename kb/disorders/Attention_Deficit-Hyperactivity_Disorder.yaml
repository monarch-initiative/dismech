notes: >-
  This entry deliberately models ADHD as a heterogeneous polygenic
  neurodevelopmental disorder. It does not assign causal-gene records, encode a
  universal catecholamine deficiency, or treat group-level imaging,
  multi-omics, neuropsychological, or treatment-response findings as diagnostic
  biomarkers. DSM-5 presentations are clinical symptom patterns rather than
  discrete biological subtypes. Pediatric management recommendations are scoped
  to the AAP guideline's ages 4-18; adult evidence and uncertainties are cited
  separately. The two eTNS records are trials, not endorsements of eTNS as
  established treatment.

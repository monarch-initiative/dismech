  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 7200.0
  notes: >-
    Pooled estimate reported by the AAP guideline. Estimates vary with age,
    sampling, diagnostic criteria, and ascertainment, so 7.2% should not be
    treated as a universal fixed rate.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Authors of a recent meta-analysis calculated a pooled worldwide ADHD prevalence of 7.2% among children"
    explanation: >-
      The guideline reports the pooled worldwide pediatric estimate used for
      the normalized rate.
- population: Adults worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2500.0
  notes: >-
    Approximate worldwide adult prevalence from a 2025 evidence review; case
    definition and ascertainment remain important sources of variation.
  evidence:
  - reference: DOI:10.1002/wps.21374
    reference_title: "Attention‐deficit/hyperactivity disorder (<scp>ADHD</scp>) in adults: evidence base, uncertainties and controversies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Now it is well established that it can persist into adulthood, with an estimated worldwide prevalence of around 2.5%."
    explanation: >-

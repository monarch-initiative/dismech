progression:
- phase: Childhood onset and school-age recognition
  age_range: Childhood
  notes: >-
    ADHD symptoms arise in childhood. Recognition often occurs when academic,
    behavioral, or social demands make impairment across settings apparent;
    diagnostic criteria require developmental context rather than isolated
    behavior in one setting.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptoms of ADHD occur in childhood, and most children with ADHD will
      continue to have symptoms and impairment through adolescence and into
      adulthood.
    explanation: >-
      The guideline supports childhood onset and persistence while avoiding a
      claim that every child has the same course.
- phase: Adolescent symptom-pattern change
  age_range: Adolescence
  notes: >-
    Overt hyperactivity and impulsivity often decline with age, whereas
    inattentive symptoms are more likely to persist; individual trajectories
    vary and functional impairment may continue.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As individuals with ADHD enter adolescence, their overt hyperactive and
      impulsive symptoms tend to decline, whereas their inattentive symptoms
      tend to persist.
    explanation: >-
      This supports a common age-related pattern without treating it as an
      obligatory trajectory.
- phase: Adult persistence or partial remission
  age_range: Adulthood
  notes: >-
    Childhood-onset ADHD may remain fully syndromal, persist with impairing
    symptoms below formal threshold, or remit. Adult assessment must establish
    developmental continuity while considering unresolved late-onset claims.
  evidence:
  - reference: DOI:10.1002/wps.21374
    reference_title: "Attention‐deficit/hyperactivity disorder (<scp>ADHD</scp>) in adults: evidence base, uncertainties and controversies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, up to 70% of individuals with childhood‐onset ADHD continue
      to experience impairing symptoms as adults, even if they no longer meet
      the criteria for a formal diagnosis.
    explanation: >-
      The review supports heterogeneous persistence, including subthreshold but
      impairing adult symptoms.
pathophysiology:
- name: Polygenic neurodevelopmental liability
  description: >-
    ADHD susceptibility is distributed across many common variants rather than
    explained by one Mendelian gene. Family-trio evidence supports transmission
    of polygenic liability, but this upstream risk does not specify one molecular
    pathway or predict an individual diagnosis.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30478444
    reference_title: Discovery of the first genome-wide significant risk loci for attention deficit/hyperactivity disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common genetic variants contribute substantially to ADHD susceptibility,
      but no variants have been robustly associated with ADHD.
    explanation: >-
      The large case-control GWAS establishes common-variant susceptibility and
      explains why a single causal-gene model is inappropriate.
  - reference: PMID:30478444
    reference_title: Discovery of the first genome-wide significant risk loci for attention deficit/hyperactivity disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identifies variants surpassing genome-wide significance in 12 independent
      loci, finding important new information about the underlying biology of
      ADHD.
    explanation: >-
      Genome-wide significant loci support a polygenic architecture without
      elevating any one associated locus to deterministic causation.
  - reference: DOI:10.1038/s41380-022-01863-6
    reference_title: Genetic nurture versus genetic transmission of risk for ADHD traits in the Norwegian Mother, Father and Child Cohort Study
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that the intergenerational transmission of risk for
      ADHD traits is largely explained by the transmission of genetic variants
      from parents to offspring rather than by genetic nurture.
    explanation: >-
      The within-family trio analysis supports inherited polygenic liability for
      ADHD traits while not establishing a deterministic inheritance pattern.
  downstream:
  - target: Distributed neural-network differences
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Polygenic liability is associated with neurodevelopmental differences,
      but the intervening molecular, cellular, and developmental routes remain
      heterogeneous and incompletely resolved.
    evidence:
    - reference: DOI:10.1038/s41380-023-02173-1
      reference_title: "White matter alterations in Attention-Deficit/Hyperactivity Disorder (ADHD): a systematic review of 129 diffusion imaging studies with meta-analysis"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Multiple genetic and environmental factors contribute to ADHD, but it is
        unclear how they interplay with brain development to produce symptoms
      explanation: >-
        The review supports a neurodevelopmental link while explicitly stating
        that the intervening causal pathway is unresolved.
- name: Distributed neural-network differences
  description: >-
    Group-level imaging studies report heterogeneous differences across
    distributed white-matter and functional networks. Findings are not present
    in every person, are sensitive to cohort and method, and are not diagnostic
    biomarkers.
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: DOI:10.1038/s41380-023-02173-1
    reference_title: "White matter alterations in Attention-Deficit/Hyperactivity Disorder (ADHD): a systematic review of 129 diffusion imaging studies with meta-analysis"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 68% of studies were of low quality, mainly due to acquisitions with
      non-isotropic voxels or lack of motion correction; and the sensitivity
      analysis in high-quality datasets yielded no significant results.
    explanation: >-
      The sensitivity result requires a provisional, non-diagnostic
      interpretation of group-level white-matter findings.
  - reference: PMID:28634439
    reference_title: Inconsistency in Abnormal Brain Activity across Cohorts of ADHD-200 in Children with Attention Deficit Hyperactivity Disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggested a high heterogeneity of spontaneous brain
      activity in ADHD.
    explanation: >-
      Cross-cohort inconsistency directly supports heterogeneity rather than one
      universal functional-imaging signature.
  downstream:
  - target: Executive attention and inhibitory-control variability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Distributed network differences may contribute to attention and
      inhibitory-control variation, but imaging associations do not establish a
      universal individual-level causal chain.
    evidence:
    - reference: DOI:10.1038/s41380-023-02173-1
      reference_title: "White matter alterations in Attention-Deficit/Hyperactivity Disorder (ADHD): a systematic review of 129 diffusion imaging studies with meta-analysis"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The systematic review highlighted white matter alterations (especially
        reduced FA) in projection, commissural and association pathways of
        individuals with ADHD, which were associated with symptom severity and
        cognitive deficits.
      explanation: >-
        The association supports a possible link to cognition, but it does not
        resolve directionality or demonstrate mediation in individuals.
- name: Prefrontal catecholamine neuromodulation
  description: >-
    Norepinephrine and dopamine modulate prefrontal cortical function, and
    established ADHD medications act on this system. This treatment-responsive
    control system is retained as a provisional disease mechanism; medication
    efficacy does not prove a universal baseline catecholamine deficiency.
  mechanism_confidence: PROVISIONAL

name: Attention Deficit-Hyperactivity Disorder
creation_date: "2026-04-24T20:56:38Z"
category: Psychiatric
description: >-
  Attention deficit-hyperactivity disorder is a neurodevelopmental disorder
  characterized by developmentally inappropriate inattention and/or
  hyperactivity-impulsivity that interferes with functioning across settings.
synonyms:
- ADHD
- attention deficit hyperactivity disorder
- attention deficit/hyperactivity disorder
disease_term:
  preferred_term: attention deficit-hyperactivity disorder
  term:
    id: MONDO:0007743
    label: attention deficit-hyperactivity disorder
parents:
- Neurodevelopmental Disorder
- Mental Health Disorder
tracked_issues:
- url: https://github.com/monarch-initiative/dismech/issues/1448
  title: Representing circuit-level and psychiatric disorders in DisMech (example ADHD)
  tracked_issue_role: curation_followup
  tracked_issue_status: CLOSED
  notes: >-
    ADHD is used here as a prototype for representing circuit-level
    neurodevelopmental and psychiatric mechanisms with the current DisMech
    pathophysiology model. The issue is resolved: this entry shipped as the
    prototype, and the general guidance it produced is recorded in
    docs/psychiatric-curation-sop.md (commit 70be96dde9). The conclusion was
    that no schema extension is required — circuit-level mechanisms are
    expressible with multi-region UBERON locations, CL cell types, and GO
    processes on ordinary pathophysiology nodes.
has_subtypes:
- name: Combined
  display_name: Combined presentation
  description: >-
    DSM-5 presentation in which both inattentive and hyperactive-impulsive
    symptom domains meet threshold. Presentation labels describe the current
    symptom pattern and can change over time.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "attention-deficit/hyperactivity disorder combined presentation (ADHD/C)"
    explanation: >-
      The pediatric guideline reproduces the DSM-5 combined-presentation
      category; it does not imply a biologically discrete subtype.
- name: Inattentive
  display_name: Predominantly inattentive presentation
  description: >-
    DSM-5 presentation in which inattentive symptoms meet threshold without the
    hyperactive-impulsive domain meeting threshold.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "attention-deficit/hyperactivity disorder primarily of the inattentive presentation (ADHD/I) (314.00 [F90.0]);"
    explanation: >-
      The pediatric guideline reproduces the DSM-5 predominantly inattentive
      presentation.
- name: Hyperactive-Impulsive
  display_name: Predominantly hyperactive-impulsive presentation
  description: >-
    DSM-5 presentation in which hyperactive-impulsive symptoms meet threshold
    without the inattentive domain meeting threshold.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "attention-deficit/hyperactivity disorder primarily of the hyperactive-impulsive presentation (ADHD/HI) (314.01 [F90.1]);"
    explanation: >-
      The pediatric guideline reproduces the DSM-5 predominantly
      hyperactive-impulsive presentation.
prevalence:

  evidence:
  - reference: PMID:20596295
    reference_title: "The Emerging Neurobiology of Attention Deficit Hyperactivity Disorder: The Key Role of the Prefrontal Association Cortex."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PFC is essential for the so-called executive functions, allowing us to
      organize and plan for the future and to inhibit responses to distractions
      in order to achieve a goal.
    explanation: >-
      The review supplies a plausible cognitive-control framework without
      showing that one executive deficit is necessary in all ADHD.
  - reference: DOI:10.1002/wps.21374
    reference_title: "Attention‐deficit/hyperactivity disorder (<scp>ADHD</scp>) in adults: evidence base, uncertainties and controversies"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key uncertainties and controversies on adult ADHD include: a) the
      possibility of late‐onset ADHD; b) the significance of emotional
      dysregulation as a core symptom; c) the definition and characterization of
      functional impairment; d) the persistence of comorbid psychiatric and
      somatic conditions after accounting for confounders; e) the relevance of
      executive dysfunction in the definition of the condition
    explanation: >-
      The current adult review explicitly identifies the definitional relevance
      of executive dysfunction as unresolved.

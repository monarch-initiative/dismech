clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    ADHD can impose persistent educational, occupational, interpersonal, safety,
    and mental-health burden, but severity, presentation, comorbidity, support,
    and course vary widely. No single low, moderate, or high category represents
    the full population.
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with ADHD, whether treated or not, are at increased risk for early
      death, suicide, and increased psychiatric comorbidity, particularly
      substance use disorders.
    explanation: >-
      The guideline documents important long-term risks at the population level;
      these associations do not determine an individual's outcome.
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They also have lower educational achievement than those without ADHD
    explanation: >-
      Population-level educational outcomes support clinically meaningful
      burden while the rationale preserves individual variability.
  - reference: DOI:10.1002/wps.21374
    reference_title: "Attention‐deficit/hyperactivity disorder (<scp>ADHD</scp>) in adults: evidence base, uncertainties and controversies"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, up to 70% of individuals with childhood‐onset ADHD continue
      to experience impairing symptoms as adults, even if they no longer meet
      the criteria for a formal diagnosis.
    explanation: >-
      Persistence of impairing symptoms beyond formal diagnostic threshold
      supports longitudinal burden and variability.
discussions:
- discussion_id: interpretation_polygenic_not_single_gene
  prompt: >-
    Should ADHD be represented as a Mendelian disorder with a causal gene list?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Polygenic neurodevelopmental liability
  - diagnosis#No standalone objective diagnostic test
  rationale: >-
    Large association and family-trio studies support inherited polygenic
    susceptibility. Associated loci and predicted molecular targets are not
    deterministic causal genes and do not justify disease-level gene records or
    diagnostic genetic testing.
  evidence:
  - reference: PMID:30478444
    reference_title: Discovery of the first genome-wide significant risk loci for attention deficit/hyperactivity disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common genetic variants contribute substantially to ADHD susceptibility,
      but no variants have been robustly associated with ADHD.
    explanation: >-
      The GWAS frames ADHD in terms of distributed susceptibility rather than a
      single causal gene.
- discussion_id: interpretation_group_findings_not_biomarkers
  prompt: >-
    Should group-level imaging or multi-omics findings be used as ADHD
    diagnostic biomarkers?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Distributed neural-network differences
  - mechanistic_hypotheses#predicted_brain_multiomics_regulation
  - diagnosis#No standalone objective diagnostic test
  rationale: >-
    Imaging effects are heterogeneous and method-sensitive, while multi-omics
    results are statistical predictions. Neither evidence stream establishes a
    sufficiently validated individual diagnostic test.
  evidence:
  - reference: PMID:28634439
    reference_title: Inconsistency in Abnormal Brain Activity across Cohorts of ADHD-200 in Children with Attention Deficit Hyperactivity Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The standardized effect size was rather small. These findings suggested a
      high heterogeneity of spontaneous brain activity in ADHD.
    explanation: >-
      Small, inconsistent cohort effects argue against an individual functional
      imaging biomarker.
  - reference: DOI:10.1093/bib/bbae502
    reference_title: A multi-omics study of brain tissue transcription and DNA methylation revealing the genetic pathogenesis of ADHD
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Our research findings provide guidance for future experimental studies on
      the molecular mechanisms of ADHD development
    explanation: >-
      The authors position their results as guidance for future experiments,
      consistent with hypothesis rather than biomarker status.
- discussion_id: gap_long_term_and_adult_intervention_outcomes
  prompt: >-
    Which interventions produce durable improvements in adult functioning and
    quality of life, and for whom?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Stimulant pharmacotherapy
  - treatments#Atomoxetine pharmacotherapy
  rationale: >-
    Short-term symptom evidence is stronger than evidence for durable adult
    functional benefit, and nonpharmacologic adult results vary by rater.
  evidence:
  - reference: PMID:39701638
    reference_title: "Comparative efficacy and acceptability of pharmacological, psychological, and neurostimulatory interventions for ADHD in adults: a systematic review and component network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medications for ADHD were not efficacious on additional relevant outcomes,
      such as quality of life, and evidence in the longer term is
      underinvestigated.
    explanation: >-
      The adult network meta-analysis directly identifies the long-term and
      functional-outcome evidence gap.


diagnosis:
- name: DSM-5 clinical assessment across settings
  presence: >-
    Diagnosis requires developmentally inappropriate symptoms and impairment,
    DSM-5 criteria, evidence across more than one major setting, collateral
    information, and exclusion of alternative explanations. A symptom report in
    one context alone is insufficient.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To make a diagnosis of ADHD, the PCC should determine that DSM-5 criteria
      have been met, including documentation of symptoms and impairment in more
      than 1 major setting (ie, social, academic, or occupational), with
      information obtained primarily from reports from parents or guardians,
      teachers, other school personnel, and mental health clinicians who are
      involved in the child or adolescent’s care. The PCC should also rule out
      any alternative cause
    explanation: >-
      This directly supports the pediatric multi-setting, multi-informant
      clinical diagnostic standard and alternative-cause exclusion.
- name: Structured symptom ratings and developmental history
  presence: >-
    DSM-based rating scales organize reports from relevant observers but are
    interpreted within a clinical and developmental assessment. For adolescents
    and adults, childhood onset or manifestations must be established rather
    than inferred from current symptoms alone.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To make a diagnosis of ADHD in preschool-aged children, clinicians should
      conduct a clinical interview with parents, examine and observe the child,
      and obtain information from parents and teachers through DSM-based ADHD
      rating scales.
    explanation: >-
      The guideline supports rating scales as structured inputs to, rather than
      substitutes for, a clinical assessment.
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      to meet DSM-5 criteria for ADHD, adolescents must have some reported or
      documented manifestations of inattention or hyperactivity/impulsivity
      before age 12.
    explanation: >-
      This anchors adolescent diagnosis in developmental history; adult
      assessment likewise requires careful evaluation of childhood onset.
- name: No standalone objective diagnostic test
  presence: >-
    Neuropsychological testing may clarify strengths and weaknesses, but it does
    not usually improve diagnostic accuracy. Neuroimaging, molecular findings,
    polygenic scores, and medication response are not standalone ADHD diagnostic
    tests.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31570648
    reference_title: "Clinical Practice Guideline for the Diagnosis, Evaluation, and Treatment of Attention-Deficit/Hyperactivity Disorder in Children and Adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of neuropsychological testing has not been found to improve
      diagnostic accuracy in most cases, although it may have benefit in
      clarifying the child or adolescent’s learning strengths and weaknesses.
    explanation: >-
      The guideline explicitly distinguishes diagnostic accuracy from the
      narrower value of testing for a learning profile.
  - reference: DOI:10.1002/wps.21374
    reference_title: "Attention‐deficit/hyperactivity disorder (<scp>ADHD</scp>) in adults: evidence base, uncertainties and controversies"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key uncertainties and controversies on adult ADHD include: a) the
      possibility of late‐onset ADHD; b) the significance of emotional
      dysregulation as a core symptom; c) the definition and characterization of
      functional impairment; d) the persistence of comorbid psychiatric and
      somatic conditions after accounting for confounders; e) the relevance of
      executive dysfunction in the definition of the condition; f) the use of
      objective diagnostic measures
    explanation: >-
      The adult review identifies objective measures as an unresolved area and
      does not endorse a standalone biomarker.


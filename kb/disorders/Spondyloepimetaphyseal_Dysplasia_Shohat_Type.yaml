    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patient 5 had a narrow trachea and severe upper airway obstruction requiring a tracheostomy"
    explanation: Tracheostomy for obstruction in patient 5.

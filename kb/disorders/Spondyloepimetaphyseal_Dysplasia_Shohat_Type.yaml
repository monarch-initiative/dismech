        evidence_source: MODEL_ORGANISM
        snippet: "In our study, we established Ddrgk1fl/fl, Col2a1-ERT Cre mice, which showed a thickened hypertrophic zone (HZ) in the growth plate, simulating the previous reported SEMD pathology in vivo."
        explanation: The growth-plate histology behind this readout.
- name: Ddrgk1 K268R UFMylation-site knock-in mouse
  species: Mus musculus
  genotype: Ddrgk1 K268R (lysine-to-arginine at the UFMylation site)
  description: >-
    A point mutant that removes the K268 UFMylation site while leaving the protein
    otherwise intact. It reproduces the IRE1-alpha degradation and ER dysfunction of the
    knockout, isolating DDRGK1's UFMylation-dependent function. The allele is an
    engineered probe and has not been found in any patient.
  publication: PMID:37781516
  modeled_mechanisms:
  - target: Impaired IRE1-alpha UFMylation and Stability
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Removes the UFMylation site specifically, showing that this node depends on DDRGK1's UFMylation function and not merely on its presence.
    limitations: >-
      An engineered separation-of-function allele, not a disease allele; it says which
      DDRGK1 function the node needs, not that patients carry such a change.
    evidence:
    - reference: PMID:37781516
      reference_title: "Loss of DDRGK1 impairs IRE1α UFMylation in spondyloepiphyseal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Further DDRGK1 K268R-mutant mice revealed the importance of K268 UFMylation site in IRE1α degradation and subsequent ER dysfunction."
      explanation: The knock-in result that makes this model informative for the node.
- name: Acan-CreERT2; Ddrgk1 fl/fl intervertebral disc conditional knockout mouse
  species: Mus musculus
  genotype: Ddrgk1 fl/fl; Acan-CreERT2 (tamoxifen-inducible deletion in aggrecan-expressing disc and cartilage cells)
  description: >-
    Early postnatal deletion severely retarded spinal growth, disrupted disc cellularity
    and initiated disc degeneration; late postnatal deletion thinned the cartilage endplate
    and worsened degeneration after lumbar spine instability surgery. Disc cells showed
    apoptosis, matrix disruption and ER stress. The only model that reaches the spine.
  publication: PMID:41460352
  modeled_mechanisms:
  - target: Intervertebral Disc and Cartilage Endplate Defect
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The model that defines this node; its spinal growth retardation is the nearest model counterpart of the patients' vertebral disease.
    limitations: >-
      The study is about intervertebral disc degeneration, not skeletal dysplasia; no
      vertebral-body morphology comparable to platyspondyly is reported, and the deletion
      is postnatal. Fidelity is graded LOW because the model addresses a neighbouring
      tissue of the human lesion rather than the lesion itself.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantities are disc height, disc cellularity and cartilage endplate
        thickness. The human phenotype is vertebral-body flattening and central hypoplasia,
        which the model does not measure.
    readouts:
    - name: Spinal growth
      target: Intervertebral Disc and Cartilage Endplate Defect
      direction: DECREASED
      interpretation: Severe retardation of spinal growth after early postnatal deletion.
      evidence:
      - reference: PMID:41460352
        reference_title: "DDRGK1 preserves intervertebral disc development through ufmylation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that Ddrgk1 conditional knockout led to severe retardation of spinal growth, disruption of disc cellularity and initiation of disc degeneration during early postnatal phase."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:41460352
      reference_title: "DDRGK1 preserves intervertebral disc development through ufmylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunohistochemical analysis further verified increased apoptosis, ECM disruption and ER stress in both nucleus pulposus and cartilage endplate after Ddrgk1 conditional knockout."
      explanation: The cellular findings that tie the disc defect to the ER-stress branch.
- name: Zebrafish ddrgk1 morpholino knockdown
  species: Danio rerio
  genotype: ddrgk1 morpholino-injected embryos (transient knockdown); rescue by ddrgk1 or sox9a RNA
  description: >-
    Transient knockdown produced craniofacial cartilage defects in 50 to 61 per cent of
    injected embryos, dose-dependently, against about 97 per cent normal craniofacial
    cartilage in control morphants: shortened, dysmorphic Meckel's and ceratohyal
    cartilage and absent ceratobranchial and neurocranial cartilage, with reduced col2a1
    but not sox9a transcript. Overexpression of sox9 rescued the phenotype, which is the
    epistasis experiment placing SOX9 downstream of DDRGK1.
  publication: PMID:28263186
  modeled_mechanisms:
  - target: Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the failure of cartilage formation and supplies the sox9 rescue that establishes the SOX9 branch.
    limitations: >-
      Craniofacial cartilage rather than the limb and spine, a transient morpholino rather
      than a null allele, and the 50 to 61 per cent penetrance is an experimental
      proportion with no relation to patient frequencies.
    readouts:
    - name: Craniofacial cartilage morphology (Alcian blue)
      target: Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
      direction: ALTERED
      interpretation: Shortened, dysmorphic or absent craniofacial cartilages in a majority of morphants.
      evidence:
      - reference: PMID:28263186
        reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, 50% to 61% of embryos injected with ddrgk1 MO (ddrgk1 morphants) showed craniofacial defects"
        explanation: The Alcian blue scoring behind this readout.
    - name: Craniofacial cartilage after sox9 overexpression
      target: Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
      direction: RESTORED
      interpretation: Rescue by sox9 shows the cartilage failure runs through SOX9 loss.
      evidence:
      - reference: PMID:28263186
        reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Overexpression of sox9 rescued the zebrafish chondrogenic and craniofacial phenotype generated by ddrgk1 knockdown, thus identifying DDRGK1 as a regulator of SOX9."
        explanation: The rescue experiment behind this readout.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, ddrgk1 deficiency disrupted craniofacial cartilage development and led to decreased levels of the chondrogenic master transcription factor sox9 and its downstream target, col2a1."
    explanation: The zebrafish phenotype and its molecular correlate.
discussions:
- discussion_id: erythropoiesis_lethality_mouse_only
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does complete loss of DDRGK1 kill mouse embryos through an erythropoiesis defect
    when patients homozygous for a protein-null allele survive to adulthood with no
    reported haematological phenotype?
  attaches_to:
  - pathophysiology#DDRGK1 Loss of Function
  - animal_models#Ddrgk1 null mouse (CRISPR c.-249_61del)
  rationale: >-
    Ddrgk1-null mice die at E11.5 to E12.5 from an erythropoiesis deficiency; patient
    lymphoblastoid cells express no DDRGK1 protein, yet no Shohat-type patient has a
    reported erythropoiesis phenotype. The discovery paper proposes that the
    erythropoiesis requirement is mouse-specific, which would explain the survival
    difference, but the alternative that the human splice allele retains an undetected
    residual function in some tissue has not been excluded. Which answer is right decides
    whether the conditional mouse models or a human-allele knock-in is the appropriate
    disease model.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, there are no reports of Shohat-type SEMD patients with any erythropoiesis deficiency or phenotype"
    explanation: The mismatch as the discovery paper states it.
- discussion_id: airway_cartilage_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the severe tracheal, laryngeal and bronchial narrowing a primary defect of airway
    cartilage caused by the same chondrogenic mechanism as the skeletal disease?
  attaches_to:
  - phenotypes#Tracheal stenosis
  - phenotypes#Laryngeal stenosis
  - pathophysiology#Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
  rationale: >-
    Airway narrowing was life-threatening in two of five patients and fatal as a surgical
    complication in two more, yet no airway tissue has been examined and no model reports
    tracheal cartilage. The tracheal rings and laryngeal cartilages are SOX9-dependent
    cartilage, so a shared mechanism is plausible, but the phenotype is left unconnected
    in the pathograph rather than wired on plausibility.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 18, because of his narrowed trachea, patient 1 required a lifesaving tracheostomy during an aborted orthopedic surgery. Unfortunately, this surgical complication was the cause of death for patients 3 and 4 from families 1 and 4, respectively."
    explanation: The clinical weight of the airway phenotype, which is the reason its unexplained mechanism is recorded as a gap.
- discussion_id: sox9_versus_ire1a_branches
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How do the SOX9-destabilisation and IRE1-alpha-ER-stress branches relate, and which
    operates in patient chondrocytes?
  attaches_to:
  - mechanistic_hypotheses#sox9_ubiquitination
  - mechanistic_hypotheses#ire1a_er_stress
  rationale: >-
    The 2017 work established SOX9 destabilisation with a sox9 rescue in zebrafish; the
    2023 work found the IRE1-alpha branch in chondrocyte-specific knockout mice and framed
    it as an alternative. The discovery paper itself noted that the skeletal phenotype of
    null mice exceeds what a sub-50 per cent SOX9 reduction predicts, which leaves room
    for both. Neither branch has been examined in any patient-derived chondrogenic cell,
    and no experiment has tested whether restoring IRE1-alpha, or suppressing CHOP,
    rescues the mouse growth plate.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Though the reduction in Sox9 protein levels is less than 50% in Ddrgk1–/– mice, these mice have a more severe skeletal phenotype than Sox9+/– mice haploinsufficient for Sox9"
    explanation: The observation that leaves room for a SOX9-independent branch.
references:
- reference: PMID:8357004
  title: New form of spondyloepimetaphyseal dysplasia (SEMD) in Jewish family of Iraqi origin.
  findings:
  - statement: Shohat et al. 1993. The original clinical and radiographic description of two sibs and a second cousin, and the source of the eponym.
- reference: PMID:8074146
  title: Spondyloepimetaphyseal dysplasia (SEMD) Shohat type.
  findings:
  - statement: Figuera et al. 1994. An unrelated Mexican boy with the same pattern, confirming the entity and proposing the designation SEMD Shohat type.
- reference: PMID:28263186
  title: Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia.
  findings:
  - statement: Egunsola et al. 2017, JCI. The gene-discovery paper, exome sequencing in four Iraqi Jewish families, patient-cell transcript and protein analysis, zebrafish and null-mouse models, the sox9 rescue and the DDRGK1-SOX9 ubiquitination biochemistry. Open access full text, the source of most of this entry.
- reference: PMID:35377455
  title: DDRGK1 is required for the proper development and maintenance of the growth plate cartilage.
  findings:
  - statement: Bae et al. 2022, Hum Mol Genet. Prx1-Cre and Agc1-CreERT2 conditional knockouts establishing the cartilage-specific growth-plate lesion and its postnatal maintenance requirement.
- reference: PMID:37781516
  title: Loss of DDRGK1 impairs IRE1α UFMylation in spondyloepiphyseal dysplasia.
  findings:
  - statement: Yang et al. 2023, Int J Biol Sci. Col2a1-CreERT knockout and K268R knock-in mice tracing the lesion to IRE1-alpha UFMylation, ER stress and PERK/CHOP/caspase-3 apoptosis.
- reference: PMID:28128204
  title: A critical role of DDRGK1 in endoplasmic reticulum homoeostasis via regulation of IRE1α stability.
  findings:
  - statement: Liu et al. 2017, Nat Commun. The first demonstration that DDRGK1 stabilises IRE1-alpha in a UFMylation-dependent way, in cancer cells and haematopoietic stem cells rather than cartilage.
- reference: PMID:41460352
  title: DDRGK1 preserves intervertebral disc development through ufmylation.
  findings:
  - statement: 2025, Cell Mol Life Sci. Acan-CreERT2 knockout showing retarded spinal growth, disc degeneration, ER stress and apoptosis; the only model reaching the spine.
- reference: PMID:36243336
  title: "Shohat type-spondyloepimetaphyseal dysplasia: Further phenotypic delineation."
  findings:
  - statement: Otaify et al. 2022, Eur J Med Genet. A further founder-allele patient adding microcephaly, unilateral choanal atresia and antenatal fractures, with radiographs over time; the source of the nine-patient literature count.
- reference: PMID:35670300
  title: "A missense mutation in DDRGK1 gene associated to Shohat-type spondyloepimetaphyseal dysplasia: Two case reports and a review of literature."
  findings:
  - statement: 2022, Am J Med Genet A. Two Moroccan children with a homozygous missense allele and a literature review of the eight earlier patients.
notes: >-
  Entity verification. The OLS record for MONDO:0011252 (read 2026-10-13) is labelled
  spondyloepimetaphyseal dysplasia, Shohat type, with xrefs OMIM:602557 and Orphanet:93352
  and a definition naming severely disproportionate short stature, short limbs, small
  chest, short neck, thin lips, severe lumbar lordosis, marked genu varum, joint laxity,
  distended abdomen and mild hepatomegaly and splenomegaly. Every cited paper names
  Shohat-type SEMD or DDRGK1, and the OMIM number in the 2022 Moroccan report matches the
  MONDO xref, so the literature and the ontology term describe one entity.


  GeneReviews. No GeneReviews or StatPearls chapter exists for this disease: the
  Bookshelf index (snapshot 2026-09-10) and a live PubMed title search return NO_CHAPTER
  for the entry name and all six synonyms (`just check-genereviews --online`,
  2026-10-22).


  Not cited, and why. The Orphanet record ORPHA:93352 is not quoted because no
  references_cache record for it exists (see external_assertions). The thin lips of the
  MONDO/Orphanet definition are therefore not recorded as a phenotype, since no cached
  source states them. The zebrafish-models review (DOI:10.3389/fgene.2021.675331) and
  the short-stature gene-discovery review (DOI:10.1530/ec-21-0083) cited by the falcon
  report add nothing disease-specific beyond the primary papers and are not cited.


  Term choices. The small chest of the clinical reports is bound to HP:0005257 Thoracic
  hypoplasia, whose HPO synonyms are "Small chest" and "Small thorax", rather than to
  HP:0000774 Narrow chest, which is defined by reduced side-to-side width. The vertebral
  squaring reported at later ages has no HPO term found by OLS search of hp for "square
  vertebral bodies" (no hits, 2026-10-13) and is carried in the Platyspondyly description.
  The hypomineralisation of epiphyses and metaphyses is radiographic and is carried in the
  descriptions rather than bound to a mineral-metabolism term. Tracheostomy is bound to
  NCIT:C15341 Tracheotomy, the clinical procedure term; NCIT's "Tracheostomy" entries are
  devices and adverse-event grades.

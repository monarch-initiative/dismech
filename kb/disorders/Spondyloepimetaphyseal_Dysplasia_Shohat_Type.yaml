genetic:
- name: DDRGK1
  gene_term:
    preferred_term: DDRGK1
    term:
      id: hgnc:16110
      label: DDRGK1
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    The protein is also called UFBP1 in the UFMylation literature; HGNC lists UFBP1 and
    dJ1187M17.3 as aliases of DDRGK1 (20p13). ClinGen has no gene-disease validity
    assertion for DDRGK1 (none in cache/clingen/gene_validity.csv), so no
    gene_disease_validity tier is recorded.
  variants:
  - name: NM_023935.3:c.408+1G>A
    description: >-
      The founder donor splice-site allele of the Iraqi Jewish families, homozygous in all
      five molecularly confirmed patients of the 2017 series and in the 2022 delineation
      case. It produces an intron-3 read-through transcript and a cryptic-splice transcript,
      both with premature stop codons, consistent with nonsense-mediated decay, and no
      DDRGK1 protein in patient lymphoblastoid cells. It was absent from ExAC at the time
      of the 2017 analysis.
    gene:
      preferred_term: DDRGK1
      term:
        id: hgnc:16110
        label: DDRGK1
    type: splice donor
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28263186
      reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results suggest that the c.408+1G>A homozygous donor splice site mutation in DDRGK1 leads to nonsense-mediated decay and is a founder, disease-causing variant of Shohat-type SEMD."
      explanation: The discovery paper's conclusion on the allele's mechanism and founder status.
    - reference: PMID:28263186
      reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This variant was not found in the ExAC database"
      explanation: Population-database absence at the time of discovery.
    - reference: PMID:36243336
      reference_title: "Shohat type-spondyloepimetaphyseal dysplasia: Further phenotypic delineation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing revealed a homozygous pathogenic donor splice site variant in the DDRGK1 gene (NM_023935.3:c.408+1G > A)."
      explanation: The same allele, with its transcript reference, in the 2022 case.
    - reference: PMID:36243336
      reference_title: "Shohat type-spondyloepimetaphyseal dysplasia: Further phenotypic delineation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This mutation was also previously identified in patients from Iraqi descent."
      explanation: Links the 2022 case to the founder allele of the Iraqi Jewish families.
  - name: Homozygous DDRGK1 missense variant (two Moroccan families)
    description: >-
      A homozygous missense pathogenic variant reported in two children from unrelated
      Moroccan families, with clinical and radiological phenotypes similar to the
      splice-allele patients. The abstract does not name the nucleotide or amino-acid
      change and no functional assay is reported, so the allele is recorded by class only.

animal_models:
- name: Ddrgk1 null mouse (CRISPR c.-249_61del)
  species: Mus musculus
  genotype: Ddrgk1 c.-249_61del homozygous (deletes 5' UTR and most of exon 1); no Ddrgk1 mRNA or protein
  description: >-
    A CRISPR/Cas9-generated null allele. Homozygotes die between E11.5 and E12.5 from an
    erythropoiesis deficiency with no counterpart in patients, so the model reaches only
    the earliest chondrogenic step: limb-bud mesenchymal condensation fails to E12.5,
    E11.5 mesenchyme forms fewer cartilaginous nodules in micromass culture, SOX9 protein
    and Col2a1 transcript are reduced in limb buds, and apoptosis is increased.
  publication: PMID:28263186
  modeled_mechanisms:
  - target: Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the condensation failure and SOX9/Col2a1 loss that define this node, in embryonic limb buds.
    limitations: >-
      Embryonic lethality at E11.5-E12.5 from an erythropoiesis defect absent in patients
      means the model never reaches a growth plate, a vertebra or postnatal life, and the
      global null does not model the tissue-restricted survival of the human disease.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse Ddrgk1 loss is embryonic lethal through an erythropoiesis deficiency that
        has not been reported in any Shohat-type patient; the chondrogenic readout is
        taken before that lethality and is not affected by it, but the model cannot speak
        to anything later.
    readouts:
    - name: Limb-bud mesenchymal condensation (H&E)
      target: Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
      direction: ABOLISHED
      interpretation: No condensation up to E12.5, the histological core of this node.
      evidence:
      - reference: PMID:28263186
        reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, condensation of mesenchymal cells did not occur in Ddrgk1–/– limb buds up to E12.5, which suggests that Ddrgk1 deletion causes a delay or absence of the early stages of chondrogenesis"
        explanation: The histology behind this readout.
    - name: SOX9 protein and Col2a1 transcript in limb buds
      target: Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
      direction: DECREASED
      interpretation: The molecular signature accompanying the condensation failure.
      evidence:
      - reference: PMID:28263186
        reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ddrgk1-/- mice displayed delayed limb bud chondrogenic condensation, decreased SOX9 protein expression and Col2a1 transcript levels, and increased apoptosis."
        explanation: The limb-bud measurements behind this readout.
    evidence:
    - reference: PMID:28263186
      reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, these data indicate that loss of DDRGK1 decreases SOX9 expression and causes a human skeletal dysplasia, identifying a mechanism that regulates chondrogenesis via modulation of SOX9 ubiquitination."
      explanation: The authors' conclusion that the mouse and zebrafish models inform the human chondrogenic mechanism.
  evidence:

- name: Intervertebral Disc and Cartilage Endplate Defect
  biological_scale: TISSUE
  description: >-
    Deleting Ddrgk1 in the aggrecan lineage in early postnatal mice severely retards
    spinal growth, disrupts disc cellularity and initiates disc degeneration, with
    apoptosis, extracellular-matrix disruption and ER stress in both nucleus pulposus and
    cartilage endplate; adult deletion thins the cartilage endplate. This is mouse
    evidence only. It is recorded because the human disease is defined by vertebral
    abnormalities (platyspondyly with central vertebral hypoplasia) and no other node
    reaches the spine, but no patient disc or vertebral tissue has been examined.

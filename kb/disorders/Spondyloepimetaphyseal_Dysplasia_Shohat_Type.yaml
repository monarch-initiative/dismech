    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with continuous positive airway pressure (CPAP) therapy while sleeping"
    explanation: Nocturnal CPAP in patient 5, immediately following the tracheostomy clause in the source.
- name: Orthopaedic surgery with pre-operative airway assessment
  description: >-
    Orthopaedic and spinal surgery for the skeletal deformities is the intervention
    patients are most likely to undergo, and the 2017 series documents its hazard: an
    orthopaedic operation in patient 1 had to be aborted because of tracheal narrowing,
    and the same surgical complication killed patients 3 and 4. No orthopaedic outcome
    series exists; the clinically actionable point is individualised airway evaluation
    before anaesthesia in any patient with this diagnosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 18, because of his narrowed trachea, patient 1 required a lifesaving tracheostomy during an aborted orthopedic surgery. Unfortunately, this surgical complication was the cause of death for patients 3 and 4 from families 1 and 4, respectively."
    explanation: Orthopaedic surgery was undertaken in at least three patients and the airway complication it provoked was fatal in two; this is the safety caveat the treatment carries.
- name: Genetic counselling and family-specific testing
  description: >-
    Molecular confirmation enables carrier testing of relatives and reproductive counselling
    on the 25 per cent recurrence risk of an autosomal recessive disorder; in the Iraqi
    Jewish community the founder allele makes targeted testing straightforward. No
    population carrier-frequency estimate has been published.
  treatment_term:

    causal_link_type: DIRECT
    hypothesis_groups:
    - sox9_ubiquitination
    description: Accelerated degradation lowers steady-state SOX9 protein without changing Sox9 transcript, and SOX9's target COL2A1 falls with it.
    evidence:
    - reference: PMID:28263186
      reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Knockdown of Ddrgk1 did not alter the mRNA expression of Sox9, but did decrease SOX9 protein levels in ATDC5 cells after 7 days of differentiation induced by insulin, transferrin, and selenium (ITS) treatment"
      explanation: Protein falls while transcript is unchanged, which is the signature of a degradation-level effect.
  evidence:

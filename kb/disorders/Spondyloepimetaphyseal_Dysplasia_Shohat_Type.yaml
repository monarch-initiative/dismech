- name: Skeletal radiographic survey
  description: >-
    Radiographs establish the spondylo-epi-metaphyseal pattern: platyspondyly with central
    vertebral hypoplasia in infancy and squared vertebrae later, delayed epiphyseal
    ossification, small hypomineralised epiphyses, broad irregular metaphyses and relative
    fibular overgrowth. The 2022 report emphasises that the changes evolve with age and
    recommends prolonged follow-up.
  diagnosis_term:
    preferred_term: skeletal survey
    term:
      id: NCIT:C38092
      label: Skeletal Survey X-Ray
  evidence:
  - reference: PMID:8074146
    reference_title: "Spondyloepimetaphyseal dysplasia (SEMD) Shohat type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Roentgenologic findings include short long bones, wide and flared metaphyses with irregularities, delayed epiphyseal ossification, platyspondyly and morphological changes of vertebral bodies and fibular overgrowth."
    explanation: The radiographic pattern that identifies the entity.
  - reference: PMID:36243336
    reference_title: "Shohat type-spondyloepimetaphyseal dysplasia: Further phenotypic delineation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recommends prolonged follow-up for these cases better to delineate the phenotype and surveillance for possible complications"
    explanation: The follow-up recommendation attached to the evolving radiographic changes.
differential_diagnoses:
- name: COL2A1-related spondyloepiphyseal dysplasia spectrum
  description: >-
    Spondyloepiphyseal dysplasia congenita and the other type II collagenopathies share
    the vertebral and long-bone defects and were the obvious candidates before DDRGK1 was
    found; the discovery paper opens by contrasting them. COL2A1 is a downstream target of
    SOX9 in this disease, not a second causal gene.
  distinguishing_features:
  - Type II collagenopathies are caused by COL2A1 variants, usually dominant; Shohat-type SEMD is recessive and caused by DDRGK1.
  - Shohat-type SEMD adds metaphyseal irregularity, relative fibular overgrowth and abdominal distension with hepatosplenomegaly to the spondylo-epiphyseal pattern.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Similar skeletal disorders, such as spondyloepiphyseal dysplasias, are linked to mutations in type II collagen (COL2A1), but the causative gene in SEMD is not known."
    explanation: The contrast with the COL2A1 disorders drawn in the discovery paper's abstract.
- name: Campomelic dysplasia (SOX9 haploinsufficiency)
  description: >-
    The SOX9-pathway disorder. SOX9 haploinsufficiency causes campomelic dysplasia, and the
    discovery paper notes that its few survivors share disproportionate short stature and
    progressive kyphoscoliosis with Shohat-type patients, while Ddrgk1-null mice have a more
    severe skeletal phenotype than Sox9 heterozygotes.
  distinguishing_features:
  - Campomelic dysplasia is a dominant SOX9 disorder with bowed, angulated long bones and frequent neonatal lethality; Shohat-type SEMD is recessive, DDRGK1-related and compatible with adult survival.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Though the reduction in Sox9 protein levels is less than 50% in Ddrgk1–/– mice, these mice have a more severe skeletal phenotype than Sox9+/– mice haploinsufficient for Sox9"
    explanation: The comparison with Sox9 haploinsufficiency that frames campomelic dysplasia as the mechanistic neighbour.
treatments:
- name: Tracheostomy for airway obstruction
  description: >-
    Life-saving tracheostomy was required in two patients of the 2017 series for severe
    tracheal narrowing: patient 1 at 18 during an aborted orthopaedic operation, and
    patient 5 for severe upper airway obstruction. A complication-management intervention,
    not a disease-modifying therapy.
  therapeutic_modality: SURGERY

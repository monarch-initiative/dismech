name: Spondyloepimetaphyseal Dysplasia, Shohat Type
creation_date: "2026-10-13T12:00:00Z"
category: Mendelian
description: >-
  Spondyloepimetaphyseal dysplasia, Shohat type (SEMDSH) is an ultra-rare autosomal
  recessive chondrodysplasia caused by biallelic loss-of-function variants in DDRGK1,
  an endoplasmic reticulum membrane component of the UFM1 conjugation (UFMylation)
  system. It was first described in 1993 in a Jewish family of Iraqi origin and later
  in a Mexican boy; the founder splice-donor variant c.408+1G>A was identified by exome
  sequencing in four Iraqi Jewish families in 2017, and a homozygous missense allele
  was reported in two Moroccan families in 2022. Patients have early-onset severe
  disproportionate short-limb short stature, short neck, small chest, severe lumbar
  lordosis, marked genu varum with relative fibular overgrowth and joint laxity, and
  abdominal distension with mild hepatosplenomegaly. Radiographs show platyspondyly
  with central vertebral hypoplasia in infancy, squared vertebral bodies with mild
  interpedicular narrowing later, delayed epiphyseal ossification, small hypomineralised
  epiphyses and broad irregular metaphyses. Severe tracheal and laryngeal narrowing has
  caused upper airway obstruction requiring tracheostomy and was fatal as a surgical
  complication in two patients.


  Mechanistically, DDRGK1 binds SOX9 and restrains its ubiquitin-dependent proteasomal
  degradation; loss of DDRGK1 lowers SOX9 protein and COL2A1 expression in chondrogenic
  cells, impairs mesenchymal condensation and chondrocyte differentiation, and
  disorganises the growth plate with an expanded hypertrophic zone in mice. A second,
  more recently described branch runs through loss of IRE1-alpha UFMylation, IRE1-alpha
  degradation, endoplasmic reticulum stress and PERK-CHOP-caspase-3 chondrocyte apoptosis.
  Both branches are established in zebrafish, mouse and cultured-cell systems; the
  corresponding steps in patient growth-plate tissue are inferred rather than measured.

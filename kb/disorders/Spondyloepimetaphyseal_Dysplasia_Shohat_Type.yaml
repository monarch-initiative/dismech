    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we confirmed that Ddrgk1 loss of function results in embryonic lethality between E11.5 and E12.5"

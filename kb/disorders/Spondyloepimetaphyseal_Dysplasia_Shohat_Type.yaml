inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic DDRGK1 variants. The founder c.408+1G>A allele was homozygous in all
    affected members of four Iraqi Jewish families and in none of the unaffected
    relatives; the two Moroccan children carried a homozygous missense allele. The
    original 1993 and 1994 clinical reports had already inferred recessive transmission
    from the sibling and second-cousin pattern of the first family.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 affected individuals had a homozygous c.408+1G>A donor splice site mutation in the third intron of the DDRGK1 gene, while none of the unaffected family members were homozygous for this mutation"
    explanation: Homozygosity restricted to affected individuals across the sequenced families establishes recessive inheritance of the founder allele.
  - reference: PMID:8074146
    reference_title: "Spondyloepimetaphyseal dysplasia (SEMD) Shohat type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive inheritance is supported and the designation SEMD Shohat type is proposed."
    explanation: The 1994 report that named the entity and inferred recessive inheritance before the gene was known.
  - reference: PMID:35670300
    reference_title: "A missense mutation in DDRGK1 gene associated to Shohat-type spondyloepimetaphyseal dysplasia: Two case reports and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a homozygous missense pathogenic variant in DDRGK1 in two children from unrelated two Moroccan families."
    explanation: A second, homozygous allele class in unrelated families, consistent with recessive inheritance.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we report a homozygous missense pathogenic variant in DDRGK1 in two children from unrelated two Moroccan families."
      explanation: The report of the missense allele class.
    - reference: PMID:35670300
      reference_title: "A missense mutation in DDRGK1 gene associated to Shohat-type spondyloepimetaphyseal dysplasia: Two case reports and a review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

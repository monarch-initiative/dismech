diagnosis:
- name: Molecular genetic testing of DDRGK1
  description: >-
    The diagnosis is molecular. Exome sequencing identified the founder allele in the
    2017 series and in the 2022 delineation case, and Sanger sequencing confirmed two
    further patients; in a family of Iraqi Jewish ancestry a targeted test for c.408+1G>A
    is the efficient first step, otherwise a skeletal-dysplasia panel or exome sequencing.
    The founder allele is intronic, so a panel must cover the canonical splice donor.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing

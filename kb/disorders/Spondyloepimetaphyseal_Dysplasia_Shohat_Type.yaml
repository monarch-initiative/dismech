mechanistic_hypotheses:
- hypothesis_group_id: sox9_ubiquitination
  hypothesis_label: DDRGK1 loss destabilises SOX9 through increased ubiquitin-dependent degradation
  status: CANONICAL
  description: >-
    The mechanism proposed with the gene discovery. DDRGK1 binds SOX9 and restrains its
    ubiquitination; without DDRGK1, SOX9 protein and COL2A1 expression fall and
    chondrogenesis fails. Supported by zebrafish rescue with sox9, Ddrgk1-null mouse limb
    buds, ATDC5 knockdown and HEK293T biochemistry; whether SOX9 is itself UFMylated was
    proposed and not shown.
  evidence:
  - reference: PMID:28263186
    reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, these data indicate that loss of DDRGK1 decreases SOX9 expression and causes a human skeletal dysplasia, identifying a mechanism that regulates chondrogenesis via modulation of SOX9 ubiquitination."
    explanation: The discovery paper's summary of the mechanism; graded by the animal and cell work the sentence summarises.
- hypothesis_group_id: ire1a_er_stress
  hypothesis_label: DDRGK1 loss causes chondrocyte ER stress and apoptosis through IRE1-alpha destabilisation
  status: ALTERNATIVE
  description: >-
    The 2023 chondrocyte-specific knockout and K268R knock-in study proposed that the
    growth-plate lesion arises from loss of IRE1-alpha UFMylation and stability, ER
    dysfunction and PERK/CHOP/caspase-3 apoptosis, explicitly instead of the SOX9
    mechanism. The two branches are not mutually exclusive: both are downstream of the same
    lesion and the discovery paper itself noted that the skeletal phenotype exceeds what
    the measured SOX9 reduction predicts. Listed as alternative because it rests on mouse
    and cultured-cell evidence and has not been tested in patient chondrocytes.
  evidence:
  - reference: PMID:37781516
    reference_title: "Loss of DDRGK1 impairs IRE1α UFMylation in spondyloepiphyseal dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Instead of the classical modulation mechanism towards SOX9, our further mechanism study found that DDRGK1 stabilizes the stress sensor endoplasmic reticulum-to-nucleus signaling 1 (IRE1α) to maintain endoplasmic reticulum (ER) homoeostasis."
    explanation: The study's own framing of the branch as an alternative to the SOX9 mechanism.

- name: Reduced SOX9 Protein and COL2A1 Expression in Chondrogenic Cells
  biological_scale: MOLECULAR
  description: >-
    SOX9 is the master transcription factor of chondrogenesis and COL2A1 its direct
    target. In ddrgk1-deficient zebrafish, Ddrgk1-null mouse limb buds and
    Ddrgk1-knockdown ATDC5 chondrogenic cells, SOX9 protein and Col2a1 transcript fall;
    in Prx1-Cre conditional knockout growth plates Sox9 and Col2a1 protein are reduced
    while Col10a1 expands. The reduction in SOX9 is less than 50 per cent in null mice,
    yet the skeletal phenotype exceeds that of Sox9 haploinsufficiency, which the
    discovery paper reads as DDRGK1 acting on targets beyond SOX9.
  mechanism_confidence: ESTABLISHED

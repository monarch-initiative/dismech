- name: Increased Ubiquitin-Dependent Proteasomal Degradation of SOX9
  biological_scale: MOLECULAR
  description: >-
    SOX9 is normally polyubiquitinated and turned over by the proteasome. DDRGK1 forms a
    complex with SOX9 and reduces its ubiquitination; co-expression of DDRGK1 lowers
    ubiquitinated SOX9 and raises SOX9 protein even when translation is blocked, so the
    control is post-translational. Loss of DDRGK1 therefore accelerates SOX9 degradation.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: ubiquitin-dependent proteasomal degradation of SOX9
    modifier: INCREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - preferred_term: DDRGK1-mediated stabilisation of SOX9 protein
    modifier: DECREASED
    term:
      id: GO:0050821
      label: protein stabilization

- name: Impaired IRE1-alpha UFMylation and Stability
  biological_scale: MOLECULAR
  description: >-
    DDRGK1 interacts with the kinase domain of the ER stress sensor IRE1-alpha (ERN1)
    and protects it from ubiquitin-dependent degradation in a UFMylation-dependent
    manner. Loss of DDRGK1, or mutation of its K268 UFMylation site, reduces IRE1-alpha
    UFMylation and increases ubiquitylation-mediated IRE1-alpha degradation. This branch
    was described in cancer cells and haematopoietic stem cells in 2017 and extended to
    chondrocytes and the growth plate in 2023.

- name: Prx1-Cre; Ddrgk1 fl/fl limb-mesenchyme conditional knockout mouse
  species: Mus musculus
  genotype: Ddrgk1 fl/fl; Prx1-Cre (deletion in limb mesenchymal cells)
  description: >-
    Cartilage-lineage deletion that survives to show the growth plate. Mutants develop
    progressive severe limb shortening and joint abnormalities; the growth plate is
    disorganised with a shortened proliferative and enlarged hypertrophic zone, Sox9 and
    Col2a1 protein are reduced and Col10a1 expanded. Osteoblast-specific deletion with
    Osteocalcin-Cre or Leptin receptor-Cre produced no bone phenotype, locating the defect
    in cartilage. The authors state the models recapitulate the patients' short stature
    and joint abnormalities.

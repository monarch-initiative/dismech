    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that the c.408+1G>A homozygous donor splice site mutation in DDRGK1 leads to nonsense-mediated decay and is a founder, disease-causing variant of Shohat-type SEMD."
    explanation: The founder-allele finding that makes targeted family testing possible; cited for the basis of counselling, not for a counselling outcome.
experimental_models:
- name: Patient-derived lymphoblastoid cell lines (c.408+1G>A homozygous)
  description: >-
    Lymphoblastoid cells from patient 1 of the 2017 series. Quantitative RT-PCR showed two
    aberrant DDRGK1 transcripts, an intron-3 read-through and a cryptic-splice product,
    both with premature stop codons, and Western blotting showed no DDRGK1 protein. The
    cells establish the allele's consequence but are not a chondrogenic system.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:28263186
  modeled_mechanisms:
  - target: DDRGK1 Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: The patient's own genotype expressed in the patient's own cells, read out at transcript and protein level.
    limitations: >-
      Lymphoblastoid cells carry the allele but not the disease: they say nothing about
      chondrocytes, SOX9 or the growth plate. They establish loss of protein only.
    readouts:
    - name: DDRGK1 protein
      target: DDRGK1 Loss of Function
      direction: ABOLISHED
      interpretation: No detectable DDRGK1 protein, the defining measurement of the loss-of-function node.
      evidence:
      - reference: PMID:28263186
        reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "When we examined protein expression, LCLs from the patient did not express DDRGK1"
        explanation: The Western blot measurement behind this readout.
    evidence:
    - reference: PMID:28263186
      reference_title: "Loss of DDRGK1 modulates SOX9 ubiquitination in spondyloepimetaphyseal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The first aberrant RNA was a read-through of the third intron and the second one was the result of use of a cryptic splice site, both resulting in a premature stop codon"
      explanation: The transcript analysis that makes this system informative for the lesion node.
- name: ATDC5 chondrogenic cells with Ddrgk1 siRNA knockdown
  description: >-
    Mouse ATDC5 chondrogenic cells transfected with Ddrgk1 siRNA and differentiated with
    insulin, transferrin and selenium for 7 days. Knockdown lowered SOX9 protein without
    changing Sox9 mRNA and reduced Col2a1 mRNA; undifferentiated cells did not show the
    SOX9 decrease, which the authors read as temporal regulation of SOX9 stability.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: Mus musculus
    term:
      id: NCBITaxon:10090

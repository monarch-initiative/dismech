mechanistic_hypotheses:
- hypothesis_group_id: glutamate_deficiency
  hypothesis_label: Glutamate Deficiency (Loss-of-Function) Model
  status: ALTERNATIVE
  description: >
    Because glutaminase produces glutamate — the principal excitatory
    neurotransmitter and precursor of GABA — from astrocyte-derived glutamine,
    a relative glutaminase deficiency is proposed to impair neuronal glutamate
    synthesis and glutamatergic (and downstream GABAergic) neurotransmission,
    causing the neurodevelopmental and cerebellar phenotype. This was the
    framing of the original report of glutaminase deficiency as an inborn error
    of metabolism.
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an inborn error of metabolism caused by an expansion of a GCA-repeat tract in the 5' untranslated region of the gene encoding glutaminase (GLS)"
    explanation: >
      Frames the disorder as a glutaminase (glutamate-producing enzyme)
      deficiency.
- hypothesis_group_id: glutamine_neurotoxicity
  hypothesis_label: Glutamine Accumulation Neurotoxicity Model
  status: EMERGING
  description: >
    An alternative model, supported by more recent clinical and biochemical
    studies across the glutaminase-deficiency spectrum, holds that the
    accumulated glutamine itself plays a key role in the neurotoxicity —
    analogous to the glutamine-mediated CNS injury of hepatic encephalopathy and
    urea cycle defects — with elevated cerebrospinal-fluid glutamine and
    urea-cycle-defect-like cystic brain MRI lesions reported across the
    glutaminase-deficiency spectrum. The two models are not mutually exclusive.
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "support a key role for elevated glutamine in the neuropathogenesis of both glutaminase-deficient patients and individuals with hepatic encephalopathy and/or urea cycle defects"
    explanation: >
      Supports elevated glutamine as a key driver of neuropathogenesis in
      glutaminase deficiency.

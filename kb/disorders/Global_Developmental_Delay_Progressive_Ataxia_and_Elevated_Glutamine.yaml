biochemical:
- name: Plasma glutamine
  presence: INCREASED
  context: >
    Plasma glutamine is elevated, reflecting impaired glutaminase-mediated
    conversion of glutamine to glutamate. It is the diagnostic biochemical
    marker of the disorder.
  biomarker_term:
    preferred_term: glutamine
    term:
      id: CHEBI:28300
      label: glutamine
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with an early-onset delay in overall development, progressive ataxia, and elevated levels of glutamine"
    explanation: >
      Elevated glutamine is the biochemical readout of the glutaminase defect.

- name: Plasma glutamate
  presence: NORMAL
  context: >
    In contrast to the elevated glutamine, plasma glutamate is characteristically
    unaltered (normal). This dissociation — high glutamine with normal plasma
    glutamate — is a useful biochemical clue and reflects the fact that plasma
    glutamate is buffered by dietary intake and other glutamate-metabolizing
    enzymes even when glutaminase is deficient (a local brain glutamate deficit
    is not excluded).
  biomarker_term:
    preferred_term: glutamate(1-)
    term:
      id: CHEBI:29985
      label: L-glutamate(1-)
  evidence:
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glutamate plasma levels were unaltered."
    explanation: >
      Documents that plasma glutamate is unaltered in the GLS tandem-repeat-
      expansion patients, distinguishing the biochemical profile from a simple
      global glutamate deficit.

definitions:
- name: Biochemical-plus-genetic diagnosis of GDPAG
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    GDPAG is suspected in a child with early-onset global developmental delay
    and progressive ataxia whose plasma amino acids show elevated glutamine with
    normal glutamate, and is confirmed by demonstrating biallelic GLS lesions.
    Critically, the causal 5' untranslated region GCA-repeat expansion is
    noncoding and is missed by standard exome sequencing; it requires
    genome-level or targeted repeat testing (whole-genome sequencing with a
    repeat-expansion caller, repeat-primed/flanking PCR).
  scope: GLS glutaminase deficiency (GCA-repeat-expansion form)
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our discovery underscores the importance of careful examination of regions of the genome that are typically excluded from or poorly captured by exome sequencing."
    explanation: >
      Establishes that the causal noncoding 5'UTR repeat expansion lies in a
      genomic region poorly captured by exome sequencing, so diagnosis requires
      genome-level or targeted repeat analysis.

genetic:
- name: GLS
  gene_term:
    preferred_term: GLS
    term:
      id: hgnc:4331
      label: GLS
  relationship_type: CAUSATIVE
  notes: >
    The disorder is caused by biallelic GLS lesions involving a GCA short tandem
    repeat expansion in the 5' untranslated region of GLS, which silences the
    expanded allele and reduces glutaminase expression. Reported patients are
    either homozygous for the expansion or compound heterozygous for an
    expansion in trans with a coding loss-of-function/missense allele. GLS
    encodes phosphate-activated glutaminase (kidney-type glutaminase).
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an expansion of a GCA-repeat tract in the 5' untranslated region of the gene encoding glutaminase (GLS)"
    explanation: >
      Identifies the causal GCA-repeat expansion in the 5'UTR of GLS.
  - reference: PMID:39699045
    reference_title: "Genetic Analysis of GCA Repeats in the GLS Gene: Implications for Undiagnosed Ataxia and Spinocerebellar Ataxia 3 in Mainland China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "expanded GCA repeats in the GLS gene can cause glutaminase deficiency with ataxia phenotype"
    explanation: >
      Confirms expanded GLS GCA repeats cause glutaminase deficiency with an
      ataxia phenotype; the same study established the non-expanded reference
      range (average ~11 repeats, range 6-33).
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glutaminase deficiency has recently been identified as a novel inherited metabolic disorder with a broad phenotypic spectrum ranging from early-onset global developmental delay to lethal early neonatal encephalopathy"
    explanation: >
      Establishes that GLS glutaminase deficiency spans a phenotypic spectrum,
      with the early-onset global-developmental-delay-with-ataxia form (this
      entity, MONDO:0032733) at the milder end and a lethal neonatal
      encephalopathy (biallelic loss-of-function/complete-deficiency alleles) at
      the severe end.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Ultra-rare. First reported in three unrelated patients (2019); expanded GLS
    GCA repeats were not detected in a screen of 349 undiagnosed ataxia patients,
    1505 healthy controls, and 1236 SCA3 patients in mainland China, indicating
    the expansion is rare in that population.
  evidence:
  - reference: PMID:39699045
    reference_title: "Genetic Analysis of GCA Repeats in the GLS Gene: Implications for Undiagnosed Ataxia and Spinocerebellar Ataxia 3 in Mainland China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Abnormal expansions of GLS GCA repeats are rare in the Chinese population."
    explanation: >
      Documents the rarity of pathogenic GLS GCA-repeat expansions.

inheritance:
- name: Autosomal recessive inheritance
  description: >
    Autosomal recessive; affected individuals carry biallelic 5'UTR GCA-repeat
    expansions in GLS (or an expansion in trans with a loss-of-function variant).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expansion was observed in three unrelated patients who presented with an early-onset delay in overall development, progressive ataxia, and elevated levels of glutamine."
    explanation: >
      The biallelic GLS 5'UTR expansion segregates with disease in unrelated
      GDPAG patients, consistent with autosomal recessive inheritance.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a homozygous, unreported missense variant in GLS (NM_014905.5:c.1174G > A; p.Gly392Arg) in both siblings from family 1, and a novel homozygous missense variant (NM_014905.5:c.1031 T > C; p.Leu344Pro) in the proband from family 2."
    explanation: >
      These homozygous GLS variants are from the severe neonatal-encephalopathy
      end of the glutaminase-deficiency spectrum; they are cited only to
      illustrate the autosomal recessive (biallelic) transmission shared across
      the spectrum, not the GDPAG-specific 5'UTR repeat genotype.


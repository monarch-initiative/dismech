name: Global Developmental Delay, Progressive Ataxia, and Elevated Glutamine
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: global developmental delay, progressive ataxia, and elevated glutamine
  term:
    id: MONDO:0032733
    label: global developmental delay, progressive ataxia, and elevated glutamine
parents:
- hereditary disease
- inborn error of metabolism
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  icimd_category:
  - classification_value: glu_gln_and_asp_asn
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      glutamate/glutamine and aspartate/asparagine metabolism" under category
      "Disorders of amino acid metabolism". GLS glutaminase deficiency is a
      disorder of glutamine catabolism.
description: >
  An autosomal recessive inborn error of amino acid metabolism caused by an
  expansion of a GCA short tandem repeat in the 5' untranslated region of GLS,
  the gene encoding phosphate-activated glutaminase. The expansion reduces GLS
  messenger RNA transcribed from the expanded allele (probably via
  repeat-mediated chromatin changes), producing a relative glutaminase
  deficiency. Because glutaminase catalyzes the hydrolysis of glutamine to
  glutamate, the deficiency impairs glutamine catabolism and glutamate
  biosynthesis, yielding accumulation of glutamine. The three originally
  reported patients presented with early-onset (global) developmental delay,
  progressive ataxia, and elevated glutamine, with cerebellar atrophy in one.
  It is allelic to, but clinically distinct from, the severe neonatal-onset
  glutaminase deficiency (OMIM 618328) caused by biallelic loss-of-function GLS
  variants, and from the mechanistically opposite de novo gain-of-function
  (hypermorphic) GLS disorder (p.Ser482Cys) characterized by glutamate excess.

pathophysiology:
- name: GLS 5'UTR GCA Repeat Expansion and Allele Silencing
  biological_scale: MOLECULAR
  description: >
    An expanded GCA short tandem repeat tract in the 5' untranslated region of
    GLS is associated with a relative deficiency of GLS mRNA transcribed from
    the expanded allele, probably resulting from repeat-mediated chromatin
    changes upstream of the repeat. The noncoding expansion lies in a region
    typically excluded from or poorly captured by exome sequencing.
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expansion was associated with a relative deficiency of GLS messenger RNA transcribed from the expanded allele, which probably resulted from repeat-mediated chromatin changes upstream of the GLS repeat."
    explanation: >
      Directly documents that the 5'UTR GCA-repeat expansion silences the
      expanded GLS allele, reducing GLS mRNA.
  downstream:
  - target: Phosphate-Activated Glutaminase Deficiency
    description: Reduced GLS mRNA lowers glutaminase enzyme levels.
    causal_link_type: DIRECT

- name: Phosphate-Activated Glutaminase Deficiency
  biological_scale: MOLECULAR
  description: >
    Reduced GLS expression produces a relative deficiency of phosphate-activated
    glutaminase, the mitochondrial enzyme that hydrolyzes glutamine to glutamate
    and ammonia. This is the primary enzymatic defect of the disorder.
  molecular_functions:
  - preferred_term: glutaminase activity
    term:
      id: GO:0004359
      label: glutaminase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an inborn error of metabolism caused by an expansion of a GCA-repeat tract in the 5' untranslated region of the gene encoding glutaminase (GLS)"
    explanation: >
      Establishes glutaminase (GLS) deficiency as the inborn error of metabolism
      underlying the disorder.
  downstream:
  - target: Impaired Glutamine Catabolism and Glutamine Accumulation
    description: Loss of glutaminase activity blocks hydrolysis of glutamine to glutamate.
    causal_link_type: DIRECT

- name: Impaired Glutamine Catabolism and Glutamine Accumulation
  biological_scale: MOLECULAR
  description: >
    With glutaminase activity reduced, the hydrolysis of glutamine to glutamate
    is impaired, so glutamine catabolism falls and glutamine accumulates while
    glutamate biosynthesis from glutamine is diminished. Elevated glutamine is
    the biochemical hallmark of the disorder.
  biological_processes:
  - preferred_term: L-glutamine catabolic process
    term:
      id: GO:0006543
      label: L-glutamine catabolic process
    modifier: DECREASED
  - preferred_term: L-glutamate biosynthetic process
    term:
      id: GO:0097054
      label: L-glutamate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30970188
    reference_title: "Glutaminase Deficiency Caused by Short Tandem Repeat Expansion in GLS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with an early-onset delay in overall development, progressive ataxia, and elevated levels of glutamine"
    explanation: >
      Documents elevated glutamine, the direct biochemical consequence of
      impaired glutaminase-mediated glutamine catabolism.
  downstream:
  - target: Impaired Glutamatergic Neurotransmission
    description: Reduced neuronal glutamate synthesis impairs glutamatergic signaling.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamate_deficiency
  - target: Glutamine Neurotoxicity
    description: Accumulated glutamine exerts a direct neurotoxic effect.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamine_neurotoxicity

- name: Glutamine Neurotoxicity
  biological_scale: CELLULAR
  description: >
    An alternative neuropathogenic mechanism holds
    that the accumulated glutamine is itself neurotoxic, paralleling the
    glutamine-mediated neurotoxicity of hepatic encephalopathy and urea cycle
    defects (in which glutamine accumulation drives astrocytic osmotic stress
    and CNS injury). Patients across the glutaminase-deficiency spectrum show
    elevated cerebrospinal-fluid glutamine and brain MRI cystic lesions
    resembling those of urea cycle defects, supporting a key role for elevated
    glutamine in the neuropathogenesis.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "support a key role for elevated glutamine in the neuropathogenesis of both glutaminase-deficient patients and individuals with hepatic encephalopathy and/or urea cycle defects"
    explanation: >
      Directly supports glutamine accumulation, rather than glutamate
      deficiency alone, as a driver of the neuropathology in glutaminase
      deficiency.
  downstream:
  - target: Neurodevelopmental Impairment
    description: Glutamine neurotoxicity contributes to CNS injury and abnormal neurodevelopment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamine_neurotoxicity

- name: Impaired Glutamatergic Neurotransmission
  biological_scale: CELLULAR
  description: >
    Neuronal glutaminase supplies glutamate, the principal excitatory
    neurotransmitter of the central nervous system and precursor of GABA, from
    astrocyte-derived glutamine via the glutamate-glutamine cycle. A relative
    glutaminase deficiency is expected to impair neuronal glutamate production
    and glutamatergic neurotransmission, a plausible mechanism linking the
    metabolic defect to the neurodevelopmental and cerebellar phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: glutamate secretion, neurotransmission
    term:
      id: GO:0061535
      label: glutamate secretion, neurotransmission
    modifier: DECREASED
  downstream:
  - target: Cerebellar Dysfunction and Atrophy
    description: Impaired glutamatergic signaling contributes to cerebellar dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamate_deficiency
  - target: Neurodevelopmental Impairment
    description: Impaired glutamatergic signaling contributes to abnormal neurodevelopment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamate_deficiency


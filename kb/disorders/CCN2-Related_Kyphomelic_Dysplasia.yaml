  - reference: PMID:39506047
    reference_title: "Biallelic variants in CCN2 underlie an autosomal recessive kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We noted two novel homozygous variants in CCN2 as possible candidates that
      segregated with the phenotype in the families: a missense variant c.443G>A;

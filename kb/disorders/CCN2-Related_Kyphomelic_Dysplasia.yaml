      reference_title: "Biallelic variants in CCN2 underlie an autosomal recessive kyphomelic dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our observations in humans and zebrafish combined with previously
        described skeletal phenotype of Ccn2 knock out mice, confirm that
        biallelic loss of function variants in CCN2 result in an autosomal
        recessive kyphomelic dysplasia.
      explanation: >-
        Establishes a single-gene autosomal recessive Mendelian basis.

name: CCN2-related kyphomelic dysplasia
creation_date: "2026-08-22T00:00:00Z"
description: >-
  CCN2-related kyphomelic dysplasia is an autosomal recessive bent-bone skeletal
  dysplasia caused by biallelic loss-of-function variants in CCN2 (formerly
  CTGF), a matricellular protein required for chondrocyte proliferation and
  differentiation. It is one of two molecularly defined forms of kyphomelic
  dysplasia, the other being the dominant, de novo KIF5B-related form; the two
  share a bent-bone radiographic phenotype but differ in gene, inheritance and
  mechanism. Affected individuals have short stature, cleft palate and
  micro-retrognathia, with kyphomelic (sharply angulated) femora, bowing of the
  long bones, radial head dislocations and mild platyspondyly. The gene-disease
  relationship rests on segregation in two consanguineous families together with
  concordant skeletal phenotypes in Ccn2-deficient mice and CRISPR-generated
  ccn2a-knockout zebrafish.
category: Mendelian
parents:
- hereditary disease
synonyms:
- CCN2-related kyphomelic dysplasia
- autosomal recessive kyphomelic dysplasia
- CTGF-related kyphomelic dysplasia
- kyphomelic dysplasia, CCN2 type

differential_diagnoses:
- name: KIF5B-related kyphomelic dysplasia
  description: >-
    The other molecularly defined form of kyphomelic dysplasia, and the primary
    differential. It is caused by de novo heterozygous KIF5B variants and is
    therefore dominant rather than recessive, arises in a kinesin motor protein
    rather than a matricellular protein, and characteristically adds postnatal
    osteoporosis with fractures and optic atrophy — none of which are features of
    the CCN2 form. Family structure alone is suggestive (consanguinity and
    sibling recurrence versus a sporadic de novo case), but the two are properly
    separated by sequencing.
  evidence:
  - reference: PMID:35342932
    reference_title: "De novo heterozygous variants in KIF5B cause kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that heterozygous KIF5B deleterious variants cause a
      specific form of kyphomelic dysplasia.
    explanation: >-
      Establishes the KIF5B form as a distinct entity under the same clinical
      label.
notes: >-
  Scope. This entry curates the CCN2-anchored autosomal recessive form of
  kyphomelic dysplasia. It is a member of the `Kyphomelic_Dysplasia` grouping,
  which unions it with the KIF5B-related dominant form; the grouping carries the
  MONDO:0008881 mapping and the reasoning for why the clinical label is a
  grouping rather than a single disease.

  Why this is not curated as "kyphomelic dysplasia". Both papers that
  molecularly defined a form of this condition describe the clinical label as a
  heterogeneous group of skeletal dysplasias. Curating a single Disease entry
  under that label would have merged a dominant kinesin-motor disorder with a
  recessive matricellular-protein disorder on the strength of a shared
  radiographic appearance. Note that MONDO attaches CCN2 to MONDO:0008881 as the
  causal gene, which is the assertion that brought this stub into the queue with
  one gene attached; the literature does not support treating that as the whole
  entity.

  Evidence base. Two consanguineous families with six affected offspring, plus
  concordant mouse and zebrafish models. That is a small human series, but the
  cross-species concordance is unusually strong for a recent gene-disease
  assertion. No treatment evidence exists, so no treatments block is curated.

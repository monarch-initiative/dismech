differential_diagnoses:
- name: KIF5B-related kyphomelic dysplasia
  description: >-
    The other molecularly defined form of kyphomelic dysplasia, and the primary
    differential. It is caused by de novo heterozygous KIF5B variants and is
    therefore dominant rather than recessive, arises in a kinesin motor protein
    rather than a matricellular protein, and characteristically adds postnatal
    osteoporosis with fractures and optic atrophy — none of which are features of
    the CCN2 form. Family structure alone is suggestive (consanguinity and
    sibling recurrence versus a sporadic de novo case), but the two are properly
    separated by sequencing.
  evidence:
  - reference: PMID:35342932
    reference_title: "De novo heterozygous variants in KIF5B cause kyphomelic dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that heterozygous KIF5B deleterious variants cause a
      specific form of kyphomelic dysplasia.
    explanation: >-
      Establishes the KIF5B form as a distinct entity under the same clinical
      label.
discussions:
- discussion_id: ccn2_kd_intermediate_chain_is_mouse_derived
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the mouse-derived chain from CCN2 loss through hypertrophic-zone matrix
    disturbance and reduced VEGF to impaired growth-plate angiogenesis operate in
    human CCN2-related kyphomelic dysplasia?
  attaches_to:
  - "pathophysiology#Impaired Hypertrophic-Zone Matrix Remodeling and Growth-Plate Angiogenesis"
  - "pathophysiology#Impaired Chondrocyte Proliferation and Differentiation"
  rationale: >-
    Evidence exists in the model; its translational validity is the open
    question. The human data establish gene-disease causality — two consanguineous
    families, segregating homozygous variants, a concordant clinical phenotype —
    but say nothing about the intermediate steps. Every element of the mechanistic
    chain curated here (impaired chondrocyte proliferation, hypertrophic-zone
    matrix composition, reduced VEGF, failed vascular invasion) comes from the
    Ctgf-null mouse, and the zebrafish crispant contributes cartilage phenotype
    rather than mechanism. No human growth-plate tissue from a CCN2 patient has
    been examined. This matters because the angiogenic coupling is the part of the
    model that would be therapeutically interesting, and it is also the part
    furthest from human observation.
  proposed_experiments:
  - experiment_id: exp_ccn2_kd_human_growth_plate_histology
    name: Growth-plate histology and VEGF in human CCN2 patient tissue
    description: >-
      Where surgical specimens or post-mortem tissue are available from CCN2
      patients, examine growth-plate zonal architecture, matrix composition and
      VEGF expression against age-matched controls, to test whether the mouse
      chain holds in human bone.
  - experiment_id: exp_ccn2_kd_patient_chondrocyte_model
    name: Patient-variant chondrocyte differentiation model
    description: >-
      Introduce the p.(Cys148Tyr) and p.(Pro260LeufsTer7) alleles into human
      induced pluripotent stem cell-derived chondrocytes and measure
      proliferation, matrix output and VEGF secretion, providing a human cellular
      test of the mouse-derived steps.
- discussion_id: ccn2_kd_allelic_series_with_dominant_semd
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What distinguishes biallelic CCN2 loss causing recessive kyphomelic dysplasia
    from the monoallelic CCN2 variant causing dominant spondyloepimetaphyseal
    dysplasia with low bone mass?
  attaches_to:
  - "pathophysiology#CCN2 Loss of Function"
  rationale: >-
    CCN2 is not a one-disease gene. A monoallelic signal-peptide variant,
    p.Arg22Pro, causes an autosomal dominant spondyloepimetaphyseal dysplasia
    with low bone mass through impaired secretion and intracellular retention —
    a different skeletal phenotype, a different inheritance mode and a different
    proximal defect from the biallelic loss-of-function alleles curated here.
    Both act in a loss-of-secretion or loss-of-function direction, so this reads
    as a genuine allelic series rather than opposed mechanisms, but nothing
    establishes whether dosage alone explains the phenotypic difference or
    whether signal-peptide retention has consequences that simple absence does
    not. The practical consequence is that a CCN2 variant found on a skeletal
    dysplasia panel cannot be interpreted from the gene alone.
  proposed_experiments:
  - experiment_id: exp_ccn2_allelic_series_secretion_comparison
    name: Secretion and retention comparison across the CCN2 allelic series
    description: >-
      Express p.Arg22Pro alongside the kyphomelic dysplasia alleles in a common
      background and compare secreted versus retained CCN2, endoplasmic reticulum
      stress markers and dominant-negative effect on co-expressed wild-type
      protein.
notes: >-
  Scope. This entry curates the CCN2-anchored autosomal recessive form of
  kyphomelic dysplasia. It is a member of the `Kyphomelic_Dysplasia` grouping,
  which unions it with the KIF5B-related dominant form; the grouping carries the
  MONDO:0008881 mapping and the reasoning for why the clinical label is a
  grouping rather than a single disease.

  Why this is not curated as "kyphomelic dysplasia". Both papers that
  molecularly defined a form of this condition describe the clinical label as a
  heterogeneous group of skeletal dysplasias. Curating a single Disease entry
  under that label would have merged a dominant kinesin-motor disorder with a
  recessive matricellular-protein disorder on the strength of a shared
  radiographic appearance. Note that MONDO attaches CCN2 to MONDO:0008881 as the
  causal gene, which is the assertion that brought this stub into the queue with
  one gene attached; the literature does not support treating that as the whole
  entity.

  Allelic series. CCN2 also causes an autosomal dominant spondyloepimetaphyseal
  dysplasia with low bone mass via a monoallelic signal-peptide variant
  (p.Arg22Pro), which is a distinct entity from this one and is curated as an open
  discussion rather than folded in. A CCN2 variant on a skeletal dysplasia panel
  therefore needs zygosity and variant position before it can be interpreted.

  Evidence base. Two consanguineous families with six affected offspring, plus
  concordant mouse and zebrafish models. That is a small human series, but the
  cross-species concordance is unusually strong for a recent gene-disease
  assertion. No treatment evidence exists, so no treatments block is curated.

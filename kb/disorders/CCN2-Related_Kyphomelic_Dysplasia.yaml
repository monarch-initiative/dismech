  description: >-
    Two unrelated consanguineous families with six affected offspring between
    them, each segregating a homozygous CCN2 variant with the phenotype. The
    consanguinity and the segregation together establish recessive inheritance,
    and distinguish this form from the dominant de novo KIF5B form.

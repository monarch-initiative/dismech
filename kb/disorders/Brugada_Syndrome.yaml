has_subtypes:
- name: SCN5A-related Brugada syndrome
  subtype_term:
    preferred_term: SCN5A-related Brugada syndrome
    term:
      id: MONDO:0011001
      label: Brugada syndrome 1
  description: >-
    Best-supported monogenic Brugada subtype. Pathogenic SCN5A variants reduce
    NaV1.5-mediated inward sodium current, causing a depolarization-predominant
    Brugada phenotype with characteristic right-precordial ST elevation and
    ventricular arrhythmia risk. This subtype accounts for only a minority of
    clinically diagnosed Brugada syndrome but remains the dominant
    high-confidence gene-disease association.
  genes:
  - preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  evidence:
  - reference: PMID:35004896
    reference_title: "The Mechanism of Ajmaline and Thus Brugada Syndrome: Not Only the Sodium Channel!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, pathogenic rare variants in SCN5A are identified in only 20-30% of cases, and recent data indicates that SCN5A variants are actually, in many cases, prognostic rather than diagnostic, resulting in a more severe phenotype."
    explanation: Supports SCN5A as the major established monogenic subtype while emphasizing that it explains only a minority of clinically diagnosed Brugada syndrome.
  - reference: PMID:33797273
    reference_title: Single-cell transcriptomics trajectory and molecular convergence of clinically relevant mutations in Brugada syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We observed an over-representation of clinically relevant mutations (∼80%) in SCN5A gene and also identified several candidate genes, including GPD1L, TRPM4, and SCN10A."
    explanation: Shows that SCN5A dominates the curated high-confidence variant landscape within Brugada syndrome while other genes remain secondary candidates.
- name: Oligogenic Brugada syndrome
  display_name: Genotype-negative or oligogenic Brugada syndrome
  description: >-
    Majority stratum of clinically diagnosed Brugada syndrome in which no
    single definitive monogenic cause is identified. Current evidence supports a
    heterogeneous architecture involving unresolved rare variation, common
    variant burden, and multiple non-SCN5A candidate genes that should not be
    promoted to standalone disease roots without stronger evidence. Despite the
    subtype name, no oligogenic inheritance term (HP:0010983) is bound and this
    entry is not a member of the Digenic and Oligogenic Disorders grouping. The
    cited evidence establishes that 70-85% of cases are genetically unresolved,
    which is an absence of a monogenic explanation rather than a demonstration
    of two or a few co-transmitted loci; a common-variant burden architecture
    would in any case be polygenic (HP:0010982), not oligogenic. The subtype is
    retained under its published name because that is how the stratum is
    labelled in the literature.
  evidence:
  - reference: PMID:32121523
    reference_title: "Brugada Syndrome: Oligogenic or Mendelian Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although BrS is considered a genetic disease, its molecular mechanism remains elusive in about 70-85% of clinically-confirmed cases."
    explanation: Establishes that most clinically confirmed Brugada syndrome remains genetically unresolved.
  - reference: PMID:32121523
    reference_title: "Brugada Syndrome: Oligogenic or Mendelian Disease?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants occurring in at least 26 different genes have been previously considered causative, although the causative effect of all but the SCN5A gene has been recently challenged, due to the lack of systematic, evidence-based evaluations, such as a variant's frequency among the general population, family segregation analyses, and functional studies."
    explanation: Supports treating non-SCN5A Brugada genes as unresolved or disputed heterogeneity rather than as established monogenic roots.
definitions:
- name: >-
    Fever-associated type-1 Brugada ECG case-finding query for latent
    SCN5A/Brugada carriers
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  validation_status:
    status: UNVALIDATED
    rationale: >-
      Fever-unmasking of the type-1 Brugada ECG is an established, clinically
      recognized phenomenon (guidelines advise recording an ECG during fever),
      so the query is well grounded — but this specific computable EHR phenotype
      has not been evaluated against a genotyped gold standard for PPV/yield.
      Validation substrate: a genotype-linked EHR biobank (eMERGE, All of Us, UK
      Biobank); MIMIC-IV-ECG can prototype the type-1 morphology detector but
      lacks the linked DNA needed to confirm SCN5A carriership.
  attaches_to:
  - pathophysiology#Fever-induced accentuation of sodium-channel loss of function
  description: >-
    EHR/OMOP case-finding query: identify individuals in whom a type-1 coved
    Brugada ECG (or a fever-triggered ventricular arrhythmia) is documented
    during a febrile episode, as candidates for latent/undiagnosed Brugada
    syndrome warranting off-fever confirmation and SCN5A evaluation. Contrast
    with the Timothy fever query: here the fever→unmasking mechanism is
    established, so derivation_basis is ESTABLISHED_CRITERIA rather than
    MECHANISTIC_HYPOTHESIS.
  scope: >-
    EHR/OMOP case-finding for latent Brugada carriers; grounded in established
    fever-unmasking biology but not yet validated as a computable phenotype.
  criteria_sets:
  - name: Fever-associated type-1 Brugada ECG
    description: >-
      A type-1 coved right-precordial ST-segment elevation, or a ventricular
      tachyarrhythmia, documented during a febrile episode in a patient without a
      prior Brugada diagnosis; confirm off-fever and refer for SCN5A testing.
    inclusion_criteria:
    - preferred_term: Documented febrile episode
      description: Elevated body temperature or a febrile-illness diagnosis code (index exposure).
    - preferred_term: Type-1 Brugada ECG or fever-triggered ventricular arrhythmia
      description: >-
        Coved type-1 right-precordial ST-segment elevation, or a ventricular
        tachyarrhythmia, recorded during the febrile episode.
    exclusion_criteria:
    - preferred_term: Pre-existing Brugada diagnosis
      description: Already-diagnosed Brugada syndrome (not a latent-case-finding hit).
  evidence:
  - reference: PMID:27033637
    reference_title: Prognostic significance of fever-induced Brugada syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One hundred twelve patients with BrS who developed F-type1 were
      retrospectively enrolled.
    explanation: >-
      Establishes fever-induced type-1 Brugada ECG as an identifiable clinical
      cohort — the population this query targets.
  - reference: PMID:27033637
    reference_title: Prognostic significance of fever-induced Brugada syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "26.4% (14 of 53) carried a pathogenic SCN5A mutation."
    explanation: >-
      A substantial fraction of fever-induced type-1 patients carry a pathogenic
      SCN5A variant, supporting the case-finding rationale that fever-provoked
      type-1 ECG enriches for genotype-positive carriers.
  notes: >-
    Worked ESTABLISHED-basis counterpart to the Timothy fever_exacerbated_cav1.2
    query: same trigger-provoked-latent-disease archetype, but the fever→Nav1.5
    unmasking mechanism is settled, so derivation_basis is ESTABLISHED_CRITERIA
    (validation_status UNVALIDATED for the computable phenotype itself). See
    docs/hypothesis-based-phenotype-algorithms.md and
    docs/reports/hypothesis-driven-ehr-case-finding-2026-07-12.md.
pathophysiology:
- name: Reduced Depolarization Reserve
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  description: >-
    Brugada syndrome converges on reduced depolarizing reserve in ventricular
    cardiomyocytes, most often through decreased inward sodium current but also
    through broader ion-current imbalance involving calcium and potassium
    channel pathways. At the disease level, the key mechanistic theme is not
    long-QT-like delayed repolarization alone but reduced inward current and
    impaired conduction reserve in the right ventricular substrate.
  cell_types:

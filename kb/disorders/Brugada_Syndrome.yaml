- name: Fever-induced accentuation of sodium-channel loss of function
  role: trigger
  description: >-
    Elevated body temperature accentuates the loss of function of the cardiac
    sodium channel (Nav1.5/SCN5A) that underlies Brugada syndrome. The
    Brugada-associated SCN5A mutation Thr1620Met is arrhythmogenic only at
    temperatures approaching the physiological range, so fever transiently
    worsens the depolarization-reserve deficit — unmasking or accentuating the
    diagnostic type-1 coved ST-segment elevation and, in some patients,
    precipitating malignant ventricular arrhythmia. Unlike the Timothy-syndrome
    fever effect (an emerging, model-system hypothesis), fever-unmasking of the
    Brugada ECG is an established clinical phenomenon.
  gene:
    preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  cell_types:
  - preferred_term: right ventricular cardiomyocyte
    term:
      id: CL:2000046
      label: ventricular cardiac muscle cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: cellular response to heat
    term:
      id: GO:0034605
      label: cellular response to heat
    modifier: INCREASED
  locations:
  - preferred_term: outflow tract of right ventricle
    term:
      id: UBERON:0005953
      label: outflow part of right ventricle
  evidence:
  - reference: PMID:10532948
    reference_title: >-
      Ionic mechanisms responsible for the electrocardiographic phenotype of the
      Brugada syndrome are temperature dependent.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      illustrate for the first time a cardiac sodium channel mutation of which
      the arrhythmogenicity is revealed only at temperatures approaching the
      physiological range, and suggest that some patients may be more at risk
      during febrile states
    explanation: >-
      Patch-clamp study of the SCN5A Thr1620Met Brugada mutation shows its
      arrhythmogenic gating defect emerges near physiological temperature,
      establishing the temperature-dependence that makes fever an unmasking
      trigger.
  - reference: PMID:32015236
    reference_title: >-
      Electrocardiogram Characteristics and Arrhythmic Events during Fever in
      Patients with Fever-Induced Brugada Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fever may not only reveal BrS but also induce life-threatening arrhythmic
      events, especially in children and adolescents
    explanation: >-
      Clinical series confirming that fever both unmasks the Brugada pattern and
      can precipitate malignant arrhythmia.
  downstream:

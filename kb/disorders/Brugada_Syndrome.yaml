- accession: geo:GSE278421
  title: N-Palmitoylglycine activates transient receptor potential channel 5 and increases the risk of Brugada syndrome
  description: Brugada syndrome (BrS) is an arrhythmic disorder associated with an increased risk of sudden cardiac death; however, current treatment options are limited due to their side effects and variable efficacy. In this study, we employed Mendelian randomization analysis utilizing proteomic, transcriptomic, and metabolomic data to identify potential therapeutic targets for BrS. Our findings indicate that N-palmitoylglycine (PalGly) is linked to an increased risk of BrS and interacts with BrS-associated proteins, demonstrating moderate binding affinities for proteins such as DCC, CR1, CTSB, NAAA, DEFB1, EPHA1, IGF1/IGFBP3/ALS, and LTA.

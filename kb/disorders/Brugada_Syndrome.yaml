- name: Syncope and Sudden Cardiac Death
  conforms_to: "cardiac_ion_channel_repolarization#Syncope and Sudden Cardiac Death"
  role: outcome
  description: >-
    Loss of effective cardiac output from sustained Brugada-associated
    polymorphic ventricular tachycardia or ventricular fibrillation causes
    transient cerebral hypoperfusion (syncope) and, when the arrhythmia does not
    self-terminate, sudden cardiac death. These are the shared clinical
    endpoints of Brugada syndrome and are frequently the sentinel manifestation
    in structurally normal hearts.
  evidence:
  - reference: PMID:39896197

genetic:
- name: SCN5A loss-of-function variants
  association: Causative
  relationship_type: CAUSATIVE
  subtype: SCN5A-related Brugada syndrome
  features: >-
    SCN5A is the strongest monogenic Brugada gene and defines the classic
    NaV1.5 loss-of-function subtype. SCN5A accounts for a minority of all
    clinically diagnosed Brugada syndrome but dominates the curated
    high-confidence variant literature and often marks a more severe phenotype.
  gene_term:
    preferred_term: SCN5A
    term:
      id: hgnc:10593
      label: SCN5A
  evidence:
  - reference: PMID:35004896
    reference_title: "The Mechanism of Ajmaline and Thus Brugada Syndrome: Not Only the Sodium Channel!"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, pathogenic rare variants in SCN5A are identified in only 20-30% of cases, and recent data indicates that SCN5A variants are actually, in many cases, prognostic rather than diagnostic, resulting in a more severe phenotype."
    explanation: Shows that SCN5A is clinically important but explains only a minority of diagnosed Brugada syndrome, consistent with a root entry plus subtype model.
  - reference: PMID:33797273
    reference_title: Single-cell transcriptomics trajectory and molecular convergence of clinically relevant mutations in Brugada syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We observed an over-representation of clinically relevant mutations (∼80%) in SCN5A gene and also identified several candidate genes, including GPD1L, TRPM4, and SCN10A."
    explanation: Supports SCN5A as the dominant high-confidence gene within the clinically curated Brugada variant landscape.
treatments:
- name: Implantable cardioverter-defibrillator placement
  description: >-
    Device therapy for prevention of sudden cardiac death in high-risk Brugada
    syndrome, especially after malignant ventricular arrhythmia, syncope with
    high-risk features, or recurrent ventricular fibrillation.
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:39800093
    reference_title: "Epicardial substrate ablation in patients with symptomatic Brugada syndrome: An updated systematic review and single-arm meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although implantable cardioverter-defibrillators (ICDs) and quinidine are primary treatments, recurrent BrS-triggered ventricular arrhythmias can persist."
    explanation: Supports ICD placement as a primary established treatment in symptomatic or high-risk Brugada syndrome.
  target_mechanisms:
  - target: Malignant Ventricular Tachyarrhythmia
    treatment_effect: MODULATES
    description: >-
      ICDs detect and terminate ventricular fibrillation and polymorphic
      ventricular tachycardia with defibrillation shocks, preventing sudden
      cardiac death without altering the underlying arrhythmogenic substrate.
    evidence:
    - reference: PMID:39800093
      reference_title: "Epicardial substrate ablation in patients with symptomatic Brugada syndrome: An updated systematic review and single-arm meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Although implantable cardioverter-defibrillators (ICDs) and quinidine are primary treatments, recurrent BrS-triggered ventricular arrhythmias can persist."
      explanation: >-
        The meta-analysis identifies ICDs as primary treatment for
        Brugada-triggered ventricular arrhythmias; the cached abstract does not
        describe the device's detection-and-shock mechanism.
- name: Quinidine
  description: >-
    Quinidine is used as antiarrhythmic pharmacotherapy for suppression of
    recurrent ventricular arrhythmia and electrical storm in Brugada syndrome,
    particularly when ICD therapy alone is insufficient or when ablation is not
    immediately available.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: quinidine
      term:
        id: CHEBI:28593
        label: quinidine
  evidence:
  - reference: PMID:40750064
    reference_title: Theory and practice of present clinical use of Quinidine in the management of cardiac arrhythmias.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Paradoxically, this decline in use occurred alongside accumulating evidence supporting quinidine's therapeutic benefit in managing rare, life-threatening ventricular arrhythmias occurring in patients with no organic heart disease (Idiopathic ventricular fibrillation, Brugada syndrome, Early repolarization syndrome, Short QT syndrome, Multifocal ectopic Purkinje-related premature contractions), as well as in those with organic heart disease involving the Purkinje network (acute myocardial infarction and hypertrophic cardiomyopathy)."
    explanation: Supports quinidine as a specifically recognized antiarrhythmic option for Brugada syndrome and related idiopathic ventricular fibrillation syndromes.
  target_mechanisms:
  - target: Reduced Depolarization Reserve
    treatment_effect: MODULATES
    description: >-
      Quinidine blocks the transient outward potassium current (Ito) in
      epicardial RVOT cardiomyocytes, partially restoring the balance between
      inward and outward currents and reducing the action potential notch that
      precipitates phase-2 reentry.
    evidence:
    - reference: PMID:27803673
      reference_title: "Electrophysiological Mechanisms of Brugada Syndrome: Insights from Pre-clinical and Clinical Studies."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Thus, either reduced Ito or increased ICa could compensate for the reduced sodium current, in turn reducing the degree of ST segment elevation."
      explanation: >-
        The mechanistic review supports reduced Ito as compensation for reduced
        sodium current. Together with the treatment-level quinidine evidence,
        this partially supports the inferred Ito-blocking mechanism.
- name: Epicardial substrate ablation
  description: >-
    Epicardial ablation of the Brugada arrhythmogenic substrate is an
    increasingly used option for symptomatic patients with recurrent BrS-triggered
    ventricular arrhythmias despite ICD therapy and/or quinidine.
  treatment_term:
    preferred_term: epicardial ablation
    term:
      id: NCIT:C157843
      label: Epicardial Ablation
  evidence:
  - reference: PMID:39800093
    reference_title: "Epicardial substrate ablation in patients with symptomatic Brugada syndrome: An updated systematic review and single-arm meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although implantable cardioverter-defibrillators (ICDs) and quinidine are primary treatments, recurrent BrS-triggered ventricular arrhythmias can persist. In this setting, epicardial substrate ablation has emerged as a promising alternative for symptomatic patients."
    explanation: Supports epicardial substrate ablation as a treatment option for symptomatic patients with recurrent arrhythmias despite standard therapy.
  - reference: PMID:39800093
    reference_title: "Epicardial substrate ablation in patients with symptomatic Brugada syndrome: An updated systematic review and single-arm meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pooled analysis demonstrated resolution of the type 1 pattern in 91% of the cases"
    explanation: Supports mechanistic and electrocardiographic efficacy of epicardial substrate ablation in symptomatic Brugada syndrome cohorts.
  target_mechanisms:
  - target: Current-Load Mismatch at RVOT Substrate
    treatment_effect: MODULATES
    description: >-
      Epicardial ablation destroys the fibrotic-fatty RVOT epicardial substrate
      responsible for abnormal conduction and the current-load mismatch that
      sustains phase-2 reentry, eliminating the anatomic basis for arrhythmia
      inducibility.
    evidence:
    - reference: PMID:39800093
      reference_title: "Epicardial substrate ablation in patients with symptomatic Brugada syndrome: An updated systematic review and single-arm meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In this setting, epicardial substrate ablation has emerged as a promising alternative for symptomatic patients."
      explanation: >-
        The meta-analysis supports epicardial substrate ablation in symptomatic
        Brugada syndrome, but its abstract does not isolate elimination of the
        current-load-mismatch substrate as the operative mechanism.
computational_models:
- name: Subcellular sodium-channel myocardial strand model
  description: >-
    A one-dimensional strand of 300 human epicardial ventricular myocytes for
    studying how subcellular sodium-channel distribution changes action-potential
    morphology and propagation. Each cell is divided into lateral and pre- and
    post-junctional membrane segments, represented by a modified O'Hara-Rudy
    dynamic model with ten Tusscher-Panfilov fast sodium current and an
    experimentally based rapid delayed-rectifier potassium current. Cells are
    coupled through gap junctions and ephaptic interactions. The disease-like
    manipulation reduces lateral-membrane sodium conductance while retaining
    junctional sodium conductance.
  model_type: KINETIC
  repository_url: https://github.com/92tsumoto/BrS-P2R-strand-ORd2011model-withTNNP_INa-FT_IKr/tree/90962d4c159d5b12133d99cb0818c84c6746a013
  model_id: 1D_EF_mORD2
  base_model: Modified O'Hara-Rudy dynamic 2011 human ventricular model with ten Tusscher-Panfilov fast INa and experimental IKr
  model_software: C/Autotools; Intel C Compiler, Intel MKL/PARDISO, and Intel OpenMP (original configuration)
  model_format: C source, Autotools build files, and positional text input
  publication: PMID:33203944
  variables:
  - name: Lateral-membrane sodium conductance fraction
    description: Fast and late lateral-membrane sodium conductance expressed as a percentage of control.
  - name: Action-potential membrane voltage
    description: Membrane-potential trajectory for each modeled cell and membrane segment.
  - name: Conduction velocity
    description: >-
      Propagation velocity along the myocardial strand in centimeters per
      second, derived in the publication from activation-time outputs rather
      than emitted directly by the code.
  modeled_mechanisms:
  - target: Reduced Depolarization Reserve
    relationship: PERTURBS
    description: >-
      The model directly reduces lateral-membrane sodium conductance and measures
      the resulting action-potential changes, rather than reproducing the full
      genetically and structurally heterogeneous Brugada mechanism.
    fidelity: MODERATE
    limitations: >-
      Sodium-channel reduction is prescribed phenomenologically rather than
      generated by an SCN5A allele, trafficking defect, or patient-calibrated
      expression state. The model does not represent broader calcium- or
      potassium-channel causes of reduced depolarization reserve.
    readouts:
    - name: Action-potential dome morphology
      target: Reduced Depolarization Reserve
      description: >-
        Progressive lateral sodium-channel reduction produces notch-and-dome,
        delayed-dome, and loss-of-dome action potentials.
      direction: ALTERED
      evidence:
      - reference: PMID:33203944
        reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          Reducing Na+ channel expression in the lateral membrane of each
          myocyte caused not only the notch-and-dome but also loss-of-dome type
          action potentials and slowed conduction, both of which are typically
          observed in BrS patients.
        explanation: The strand simulation reports the expected action-potential response to its sodium-conductance perturbation.
    evidence:
    - reference: PMID:33203944
      reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Reducing Na+ channel expression in the lateral membrane of each myocyte
        caused not only the notch-and-dome but also loss-of-dome type action
        potentials and slowed conduction, both of which are typically observed
        in BrS patients.
      explanation: The paper identifies the manipulated sodium-channel process and its electrophysiologic outputs.
  - target: RVOT Conduction Slowing
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Reduced lateral sodium conductance lowers modeled upstroke velocity and
      strand conduction velocity, recapitulating the conduction-slowing component
      of the Brugada substrate.
    fidelity: MODERATE
    limitations: >-
      This is a homogeneous one-dimensional generic epicardial ventricular strand,
      not an anatomically reconstructed RVOT. It omits patient-specific geometry,
      fibrosis, fiber organization, ECG leads, and clinical conduction maps.
    readouts:
    - name: Conduction velocity
      target: RVOT Conduction Slowing
      description: >-
        Conduction velocity falls as lateral-membrane sodium conductance is
        reduced from control to complete loss.
      direction: DECREASED
      evidence:
      - reference: PMID:33203944
        reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          CVs at 100%gNa,LM, 35%gNa,LM, 7%gNa,LM and 0%gNa,LM were 71.4,
          53.6, 33.3, and 25.0 cm/s, respectively (see Table 1).
        explanation: The full-text figure caption provides the quantitative conduction-velocity response.
    evidence:
    - reference: PMID:33203944
      reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Reducing Na+ channel expression in the lateral membrane of each myocyte
        caused not only the notch-and-dome but also loss-of-dome type action
        potentials and slowed conduction, both of which are typically observed
        in BrS patients.
      explanation: The primary report directly identifies slowed propagation as a model output.
  evidence:
  - reference: PMID:33203944
    reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We constructed in silico human ventricular myocardial strand and ring
      models, and examined whether the Na+ channel expression changes in each
      myocyte cause the phase-2 reentry in BrS.
    explanation: The publication defines the human ventricular strand model and its Brugada perturbation.
  findings:
  - statement: >-
      In the homogeneous-conductance comparison, reducing lateral-membrane
      sodium conductance from 100% to 0% lowers conduction velocity from 71.4
      to 25.0 cm/s.
    evidence:
    - reference: PMID:33203944
      reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        CVs at 100%gNa,LM, 35%gNa,LM, 7%gNa,LM and 0%gNa,LM were 71.4,
        53.6, 33.3, and 25.0 cm/s, respectively (see Table 1).
      explanation: The paper reports a monotonic decrease across its four homogeneous conductance settings.
  notes: >-
    The repository is pinned at commit
    90962d4c159d5b12133d99cb0818c84c6746a013 and has no release, CI,
    container, or dependency lock. COPYING declares GPL-3.0, but
    src/pardiso_mat.c carries an Intel Confidential notice that restricts use,
    copying, and distribution; the effective reuse and redistribution status is
    therefore ambiguous. The checked-in build targets legacy Intel C Compiler,
    MKL/PARDISO, and OpenMP paths and flags. It did not compile unmodified during
    curator testing on ARM macOS. The fixed-step explicit-Euler simulation uses
    a 1-microsecond step for 30 beats. Its only sample input is stale: for the
    supplied one-dataset, 43-state configuration, the parser reads 83 numeric
    fields whereas check_test/in supplies 82, shifting later values and
    preventing a faithful run. No paper-scenario manifest, expected outputs, or
    automated tests are supplied. The code emits voltage and ionic traces plus
    activation times but does not directly calculate CV; nai_data.out and
    ki_data.out are also mislabeled relative to their written state indices.
    The article is CC BY 4.0. The model was compared qualitatively with prior
    mouse and human electrophysiology, but it was not fitted to or independently
    validated in a Brugada patient cohort.
- name: Spatially heterogeneous sodium-channel myocardial ring model
  description: >-
    A one-dimensional ring of 600 human epicardial ventricular myocytes using
    the same modified O'Hara-Rudy ionic model, segmented cell membranes, gap
    junctions, and ephaptic coupling as the companion strand model. Two ring
    regions are assigned different, markedly reduced lateral-membrane sodium
    conductances to test whether spatial heterogeneity converts phase-2 reentry
    into intermittent or persistent circulating reentrant excitation.
  model_type: KINETIC
  repository_url: https://github.com/92tsumoto/BrS-P2R-ring-ORd2011model-withTNNP_INa-FT_IKr/tree/0a6aece22925ca48430d775589547bbfbf9e0ff0
  model_id: 1D_EFring_mORD2
  base_model: Modified O'Hara-Rudy dynamic 2011 human ventricular model with ten Tusscher-Panfilov fast INa and experimental IKr
  model_software: C/Autotools; Intel C Compiler, Intel MKL/PARDISO, and Intel OpenMP (original configuration)
  model_format: C source, Autotools build files, and positional text input
  publication: PMID:33203944
  variables:
  - name: Regional lateral-membrane sodium conductance fractions
    description: Separately imposed percentages of control lateral sodium conductance in the two ring regions.
  - name: Action-potential propagation pattern
    description: >-
      Spatiotemporal membrane-voltage propagation around the ring; block,
      phase-2 reentry, and circulating reentry are interpreted from the traces
      rather than classified directly by the code.
  modeled_mechanisms:
  - target: Malignant Ventricular Tachyarrhythmia
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      The heterogeneous ring produces phase-2-reentry-mediated circulating
      excitation, representing a reduced tissue-scale mechanism for Brugada
      reentrant tachyarrhythmia.
    fidelity: LOW
    limitations: >-
      The 600-cell one-dimensional ring is not an RVOT or whole-heart geometry
      and cannot reproduce polymorphic VT, ventricular fibrillation, surface ECG,
      hemodynamics, or patient outcomes. Reentry depends on imposed and locally
      extreme sodium-conductance heterogeneity rather than measured patient
      tissue or a disease genotype.
    readouts:
    - name: Phase-2-reentry-mediated reentrant arrhythmia
      target: Malignant Ventricular Tachyarrhythmia
      description: >-
        Spatially heterogeneous lateral sodium-channel reduction produces
        intermittent or persistent unidirectional circulating excitation.
      direction: INCREASED
      evidence:
      - reference: PMID:33203944
        reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          Furthermore, the selective reduction in Na+ channels on the lateral
          membrane of each myocyte together with spatial tissue heterogeneity of
          Na+ channel expression caused the phase-2 reentry and phase-2
          reentry-mediated reentrant arrhythmias.
        explanation: The ring simulation directly produces its reduced reentrant-arrhythmia readout.
    evidence:
    - reference: PMID:33203944
      reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Furthermore, the selective reduction in Na+ channels on the lateral
        membrane of each myocyte together with spatial tissue heterogeneity of
        Na+ channel expression caused the phase-2 reentry and phase-2
        reentry-mediated reentrant arrhythmias.
      explanation: The publication identifies sodium-channel heterogeneity as necessary for the modeled reentry.
  evidence:
  - reference: PMID:33203944
    reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We constructed in silico human ventricular myocardial strand and ring
      models, and examined whether the Na+ channel expression changes in each
      myocyte cause the phase-2 reentry in BrS.
    explanation: The publication defines the human ventricular ring model and its Brugada perturbation.
  findings:
  - statement: >-
      Reentry occurred mainly when region B lateral sodium conductance was below
      5% of control and region A was between 5% and 10%, underscoring dependence
      on an extreme imposed spatial gradient.
    evidence:
    - reference: PMID:33203944
      reference_title: Specific decreasing of Na(+) channel expression on the lateral membrane of cardiomyocytes causes fatal arrhythmias in Brugada syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This result indicates that the P2R-mediated reentry occurred mostly when
        the %gNa,LM in the region B was reduced to < 5% and the %gNa,LM in the
        region A was in the 5 ~ 10% range (Fig. 6C, magenta region).
      explanation: The phase diagram identifies the parameter region supporting ring reentry.
  notes: >-
    The repository is pinned at commit
    0a6aece22925ca48430d775589547bbfbf9e0ff0 and has no release, CI,
    container, dependency lock, or sample input. COPYING declares GPL-3.0, but
    src/pardiso_mat.c carries an Intel Confidential notice that restricts use,
    copying, and distribution; the effective reuse and redistribution status is
    therefore ambiguous. The checked-in build targets legacy Intel C Compiler,
    MKL/PARDISO, and OpenMP paths and flags and did not compile unmodified during
    curator testing on ARM macOS. The fixed-step explicit-Euler simulation uses
    a 1-microsecond step for 30 beats, nominally 30 million steps. The repository
    supplies no paper-figure parameter manifest, golden output, analysis script,
    or automated test. It emits voltage and current traces but does not directly
    label phase-2 reentry, reentrant arrhythmia, or the published phase diagram;
    an auxiliary cleft-potential output also omits the closing ring junction.
    The article is CC BY 4.0. This is a hypothesis-driven mechanism model, not an
    allele-specific, anatomically personalized, or clinically predictive
    ventricular simulation.
discussions:
- discussion_id: q_brs_fever_query_nam_confirmation
  prompt: >-
    Can New Approach Methodologies functionally confirm SCN5A carriers surfaced by
    the fever-associated type-1 ECG case-finding query — using patient
    iPSC-cardiomyocyte and heterologous Nav1.5 temperature-challenge assays to
    show temperature-dependent sodium-current loss?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Fever-induced accentuation of sodium-channel loss of function
  rationale: >-
    The fever→type-1-ECG mechanism is established, but a candidate surfaced by the
    EHR query still needs functional confirmation that the specific SCN5A variant
    is temperature-sensitive. A human-relevant New Approach Methodology assay — patient
    iPSC-cardiomyocytes and heterologous Nav1.5 expression subjected to a
    temperature ramp — directly measures the temperature-dependent INa loss that
    underlies fever unmasking, and is the mechanistic complement to the population
    EHR arm.
  proposed_experiments:
  - experiment_id: exp_brs_nav15_temperature_nam
    name: iPSC-cardiomyocyte and heterologous Nav1.5 temperature-challenge assay
    description: >-
      Express the candidate SCN5A variant heterologously and record INa across a
      temperature ramp (e.g. 32 to 40 degrees C); in parallel, subject
      patient-derived (and isogenic-corrected) iPSC-cardiomyocytes to the same
      temperature challenge and assess emergence of a type-1-like
      depolarization/repolarization phenotype. Temperature-dependent INa loss and
      phenotype accentuation in the variant but not the control would confirm the
      fever-sensitive substrate.
    experiment_type:
      preferred_term: iPSC-cardiomyocyte and heterologous-expression temperature-challenge assay
    model_systems:
    - name: Heterologous Nav1.5 (SCN5A) expression
      description: >-
        Candidate SCN5A variant expressed in a mammalian cell line; INa recorded
        across a temperature ramp.
      experimental_model_type: CELL_LINE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606

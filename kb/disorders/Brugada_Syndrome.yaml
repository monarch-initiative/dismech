  title: Brugada Syndrome-associated Genetic Loci are associated with J-point Elevation and an Increased Risk of Cardiac Arrest
  description: 'Introduction: A previous genome-wide association study found three genetic loci, rs9388451, rs10428132, and rs11708996, toincrease the risk of Brugada Syndrome (BrS). Since the effect of these loci in the general population is unknown, we aimed toinvestigate the effect on electrocardiogram (ECG) parameters and outcomes in the general population.Material and Methods: A cohort of 6,161 individuals (median age 45 [interquartile range (IQR) 40-50] years, 49% males), withavailable digital ECGs, was genotyped and subsequently followed for a median period of 13 [IQR 12.6-13.4] years. Data on outcomeswere collected from Danish administrative healthcare registries.'

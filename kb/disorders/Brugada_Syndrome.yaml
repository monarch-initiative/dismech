- accession: geo:GSE46348
  title: Illumina SNP array data for Brugdata syndrome patients in Taiwan
  description: Background Brugada syndrome (BrS) is a rare inherited disease causing sudden cardiac death (SCD). Copy number variants (CNVs) can contribute to disease susceptibility, but their role in Brugada syndrome (BrS) is unknown. We aimed to identify a CNV associated with BrS and elucidated its clinical implications. Methods We enrolled 335 unrelated BrS patients from 2000 to 2018 in the Taiwanese population. Microarray and exome sequencing were used for discovery phase whereas Sanger sequencing was used for the validation phase. HEK cells and zebrafish were used to characterize the function of the CNV variant.

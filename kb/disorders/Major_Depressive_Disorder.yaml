- discussion_id: gap_mdd_excitation_inhibition_imbalance_substrates
  prompt: >-
    Excitation-inhibition (E/I) imbalance in prefrontal-cingulate cortices is
    implicated in MDD pathophysiology, but what are the molecular substrates
    underlying E/I dysregulation in depression? Are GABAergic, glutamatergic,
    serotonergic, and opioidergic systems dysregulated primarily (upstream
    drivers) or secondarily (consequences of other pathophysiology)? How do
    these neurochemical systems interact to produce measurable E/I imbalance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Excitation-Inhibition Imbalance
  - pathophysiology#Monoamine Deficiency
  - pathophysiology#Neuroplasticity Deficits
  rationale: >-
    Recent neuroimaging studies (Ge et al., 2026) demonstrate that MDD patients
    show significantly reduced Hurst exponent values (a biophysically confirmed
    proxy of cortical E/I balance) in parietal and prefrontal-cingulate cortices,
    with transcriptomic enrichment for neuronal structural organization and
    mitochondrial function. Neurochemical mapping links E/I dysregulation to
    GABAergic, opioidergic, serotonergic, and synaptic density distributions.
    However, critical gaps remain: (1) the causal direction of E/I imbalance
    relative to monoamine deficiency and HPA-axis dysregulation; (2) whether
    specific GABA receptor subtypes (α1-α6, β1-β3, γ1-γ3) or glutamate receptor
    classes (NMDA, AMPA, kainate) are preferentially dysregulated in depression;
    (3) the role of parvalbumin-positive fast-spiking interneurons and other
    inhibitory circuits in producing cortical E/I imbalance; and (4) how ketamine's
    rapid antidepressant effects via NMDA-receptor antagonism mechanistically
    relate to E/I normalization in treatment-resistant depression. Understanding
    these substrates could identify new therapeutic targets distinct from
    monoamine reuptake inhibition.
  evidence:
  - reference: PMID:42372880
    reference_title: "Intrinsic excitation-inhibition imbalance in major depressive disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transcriptomic analysis identified enrichment for neuronal structural organization, nucleic acid metabolism, and mitochondrial function, with preferential overlap with excitatory and inhibitory neuron-specific gene sets."
    explanation: >-
      Multimodal evidence links E/I dysregulation to transcriptomic changes in
      neuronal structure and energy metabolism, supporting the mechanistic
      relevance of this imbalance in MDD.
  - reference: PMID:42372880
    reference_title: "Intrinsic excitation-inhibition imbalance in major depressive disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Divergent group-by-treatment effects were observed in the anterior cingulate and medial prefrontal cortices, with ketamine-induced increases in TRD patients."
    explanation: >-
      The differential effect of ketamine on cortical E/I balance in
      treatment-resistant depression suggests E/I normalization as a putative
      mechanism underlying rapid antidepressant action, but the molecular
      pathway from NMDA antagonism to E/I balance restoration remains unresolved.
  proposed_experiments:
  - experiment_id: exp_mdd_ei_substrate_specificity
    name: Map GABA and glutamate receptor subtype dysregulation across cortical regions in MDD
    description: >-
      Using postmortem brain tissue from MDD and control subjects, perform
      multi-region quantification of GABA receptor subtype expression (α1-α6,
      β1-β3, γ1-γ3) and glutamate receptor class expression (GluN1/GluN2, GluA1-A4,
      GluK1-K5) via Western blot, qPCR, and in situ hybridization in
      prefrontal-cingulate cortices. Correlate subtype-specific changes with
      lifetime depression severity and antidepressant medication history.
    experiment_type:
      preferred_term: postmortem brain tissue analysis
  - experiment_id: exp_mdd_ei_interneuron_circuits
    name: Determine whether parvalbumin-positive interneuron dysfunction drives cortical E/I imbalance in depression models
    description: >-
      In chronic-stress depression models and acute-stress models, use
      electrophysiology and optogenetics to measure inhibitory tone from
      parvalbumin-positive fast-spiking interneurons onto pyramidal neurons.
      Assess whether targeted optogenetic reactivation of inhibitory circuits
      restores cortical E/I balance and reverses depression-like behavior.
      Parallel human studies using MEG/EEG to measure cortical oscillatory power
      and phase-amplitude coupling as surrogates of interneuron function.
    experiment_type:
      preferred_term: in vivo electrophysiology and optogenetics
  - experiment_id: exp_mdd_ketamine_ei_restoration
    name: Test whether ketamine's rapid antidepressant effect requires cortical E/I rebalancing
    description: >-
      In acute-stress depression models, measure time-resolved Hurst exponent and
      cortical E/I balance before, during (minutes to hours), and after ketamine
      administration. Assess whether E/I normalization precedes or follows
      behavioral antidepressant effects. Simultaneously measure monoamine levels
      and HPA-axis markers to determine temporal ordering and mechanistic
      independence of E/I rebalancing from classical monoamine pathways.
    experiment_type:
      preferred_term: in vivo neuroimaging and electrophysiology during pharmacological intervention
- discussion_id: gap_mdd_oligodendrocyte_dysfunction
  prompt: >-
    Emerging evidence implicates oligodendrocyte (OL) dysfunction and myelin
    abnormalities in major depressive disorder, extending beyond classical
    myelination to neural plasticity, neuronal metabolic support, and circuit
    regulation. Is OL/white-matter pathology a primary driver of MDD, or a
    secondary consequence of neuroinflammation, chronic stress, and HPA-axis
    hyperactivity? Which OL subsets and brain regions are most mechanistically
    relevant, and how does OL-astrocyte-microglia crosstalk causally link to
    depressive symptoms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Oligodendrocyte Dysfunction and Demyelination
  - pathophysiology#Neuroplasticity Deficits
  - pathophysiology#Neuroinflammation
  - pathophysiology#HPA Axis Dysregulation
  rationale: >-
    Neuroimaging consistently shows white-matter and brain-connectivity
    alterations in MDD, and post-mortem and animal studies report reduced
    oligodendrocyte density, downregulated myelin-related genes, and myelin
    abnormalities. The Gan et al. (2026) review argues that OL dysfunction is a
    key pathophysiological mechanism in MDD that extends beyond myelination to
    include contributions to neural plasticity, metabolic support, and circuit
    regulation, manifesting primarily as myelin abnormalities tied to altered
    connectivity and emotional processing. What remains unresolved is the causal
    direction: whether OL/myelin pathology initiates circuit dysfunction and
    depressive symptoms, or whether it is downstream of neuroinflammation,
    glucocorticoid excess from HPA-axis hyperactivity, and impaired
    neuroplasticity. The relative importance of distinct OL populations
    (mature OLs vs. oligodendrocyte precursor cells) and region-specific
    contributions (prefrontal cortex vs. hippocampus) is also unknown. Because
    OLs interact bidirectionally with neurons, astrocytes, and microglia,
    disentangling OL-glial crosstalk from primary inflammatory signaling is
    difficult with cross-sectional human data. Resolving these questions would
    clarify whether remyelination-promoting or OL-protective strategies could
    serve as disease-modifying treatments rather than symptomatic ones.
  proposed_experiments:
  - experiment_id: exp_mdd_ol_causality_remyelination
    name: Region-specific oligodendrocyte manipulation with longitudinal connectivity and behavioral readouts
    description: >-
      In a chronic-stress rodent model of depression, use cell-type-specific
      genetic and pharmacological tools to (a) deplete or impair mature
      oligodendrocytes and oligodendrocyte precursor cells in prefrontal cortex
      versus hippocampus, and (b) conversely promote remyelination, while
      measuring myelin integrity, neuroinflammatory glial activation, neural
      circuit connectivity, and depression-like behavior. Pair with a human
      cohort combining diffusion-MRI white-matter metrics, peripheral
      inflammatory markers, and longitudinal symptom trajectories to test
      temporal ordering of white-matter change relative to inflammation and
      symptom onset.
    experiment_type:
      preferred_term: cell-type-specific perturbation with longitudinal imaging and behavioral phenotyping
    readouts:
    - name: Myelin integrity and white-matter connectivity
      target: pathophysiology#Neuroplasticity Deficits
      description: >
        Quantify myelin sheath thickness, oligodendrocyte density, and
        white-matter tract connectivity (diffusion imaging) to test whether
        manipulating OL/myelin alters circuit structure independent of
        inflammation.
      assays:
      - preferred_term: diffusion tensor imaging
      - preferred_term: myelin histopathology
      direction: NEGATIVE
    - name: Glial neuroinflammatory activation
      target: pathophysiology#Neuroinflammation
      description: >
        Measure microglial and astrocyte activation and proinflammatory
        cytokine levels to determine whether OL dysfunction precedes or follows
        neuroinflammatory signaling.
      assays:
      - preferred_term: glial activation immunostaining
      - preferred_term: cytokine quantification
      direction: POSITIVE
    - name: Depression-like behavior and symptom trajectory
      target: pathophysiology#HPA Axis Dysregulation
      description: >
        Assess depression-like behavior in animals and longitudinal depressive
        symptom severity in humans relative to stress/glucocorticoid exposure to
        test whether OL-targeted intervention modifies outcome.
      assays:
      - preferred_term: depression behavioral battery
      direction: NEGATIVE
    decision_criterion: >-
      OL dysfunction is supported as a primary driver if region-specific OL
      depletion produces white-matter and depression-like phenotypes before or
      independent of neuroinflammatory activation, and if remyelination-promoting
      intervention reverses depressive behavior; it is supported as a secondary
      consequence if white-matter change consistently follows inflammatory and
      glucocorticoid signaling and OL manipulation alone does not alter
      depressive outcomes.
    would_support:
    - pathophysiology#Neuroplasticity Deficits
    - pathophysiology#Neuroinflammation
  evidence:
  - reference: PMID:41730818
    reference_title: "Oligodendrocyte dysfunction in major depressive disorder: Mechanistic insights and emerging therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Emerging evidence increasingly implicates oligodendrocyte (OL) dysfunction as a key pathophysiological mechanism in MDD, extending beyond their classical role in myelination to include critical contributions to neural plasticity, metabolic support, and circuit regulation."
    explanation: >-
      This review establishes OL dysfunction as an emerging mechanistic
      hypothesis in MDD that extends beyond myelination, motivating the
      knowledge gap about its role and causal position.
  - reference: PMID:41730818
    reference_title: "Oligodendrocyte dysfunction in major depressive disorder: Mechanistic insights and emerging therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Finally, we highlight key knowledge gaps and propose future research directions aimed at clarifying the contribution of OL biology to depressive disorders and improving treatment outcomes."
    explanation: >-
      The authors explicitly flag unresolved knowledge gaps and call for
      research clarifying the contribution of OL biology to depression,
      directly supporting this KNOWLEDGE_GAP entry.
- discussion_id: gap_mdd_vitiligo_shared_immune_dysregulation
  prompt: >-
    A large longitudinal cohort supports MDD-to-vitiligo and
    vitiligo-to-MDD associations, but what accounts for them? Does an acquired,
    cell-state-specific inflammatory program involving p38-alpha/MAPK14 precede
    and help cause both conditions, or are the associations better explained by
    psychosocial effects of visible skin disease, healthcare surveillance,
    treatment, nonspecific inflammatory burden, shared pleiotropic genetic
    liability, or parallel disease-specific mechanisms? Is MAPK14 necessary in
    homologous causal cell states, or merely a cross-tissue bioinformatic
    marker?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuroinflammation
  - pathophysiology#Monoamine Deficiency
  rationale: >-
    A UK primary-care cohort found that incident MDD preceded recorded vitiligo
    (adjusted HR 1.64) and incident vitiligo preceded recorded MDD (HR 1.31
    before age 30 and 1.22 at age 30 or older). That establishes a temporal
    epidemiologic signal, not biological mediation. The study did not measure
    disease severity, and treatment and healthcare-contact effects remain
    possible. The cross-disease transcriptomic study is weaker mechanistic
    evidence: it compared separate MDD and vitiligo expression datasets, used
    only 15 vitiligo samples and 15 healthy samples in discovery, inferred
    immune signatures from bulk profiles, and used permissive
    differential-expression thresholds. It did not analyze an explicitly
    ascertained comorbid cohort or paired tissues from the same participants.
    The study did use independent disease-specific GEO validation sets, but
    discriminator performance does not establish a shared cell state or
    mediator. Mouse serotonergic-neuron genetics supports p38-alpha in a
    stress-related behavioral model; a larger human MDD study found no advantage
    for the tested losmapimod regimen after a smaller prematurely terminated
    study had favored treatment. Patient-derived
    nonsegmental-vitiligo keratinocytes and cultured mouse melanocytes support
    pan-p38 activity in skin models, not MAPK14 specificity. These
    compartment-, species-, and assay-specific results are compatible with
    parallel p38 use and do not establish a shared human MAPK14 mechanism.
    Conversely, bidirectional Mendelian randomization found no significant
    directional causal effect between generalized vitiligo and broad
    mental-disorder phenotypes, including depression. That design does not test
    shared pleiotropic genetic liability. A claims study found a mental-health
    profile largely comparable to atopic dermatitis. The gap is therefore the
    mediator and its specificity; the evidence does not justify a new MDD
    pathophysiology node, MAPK14 biomarker, or conserved mechanism module. A
    candidate pair-level record is curated in
    com_Major_Depressive_Disorder__Vitiligo.
  evidence:
  - reference: PMID:30528503
    reference_title: "Vitiligo and major depressive disorder: A bidirectional population-based cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adjusted models, MDD patients (n = 405,397) were at a 64% increased risk for vitiligo (hazard ratio 1.64"
    explanation: >-
      The large adjusted cohort establishes the MDD-to-vitiligo temporal
      association but cannot identify its mediator.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "These findings primarily serve to generate hypotheses regarding shared mechanisms and prioritize targets for subsequent experimental validation."
    explanation: >-
      The authors explicitly limit the cross-disease MAPK14 result to hypothesis
      generation.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "For MDD, the GSE98793 dataset was utilized, which includes 192 whole blood samples: 64 from healthy controls, 128 from patients with MDD, using the GPL570 platform for sequencing. For vitiligo, the GSE65127 and GSE53146 datasets were integrated using the R package ‘sva’ to correct batch effects. The combined datasets included 15 healthy samples and 15 vitiligo samples, using the GPL570 and GPL14951 platforms for sequencing."
    explanation: >-
      The analysis combined separate disease datasets and had only 15 vitiligo
      and 15 healthy samples, rather than paired samples from a comorbid cohort.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Differentially expressed genes (DEGs) between disease and control groups were identified using the R package ‘limma’, applying a threshold of |log2FC| > 0 and P-value < 0.05."
    explanation: >-
      The permissive nonzero fold-change and nominal P-value screen limits the
      specificity of the candidate-gene intersection.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "It should be noted that these ssGSEA scores represent inferred immune signatures from bulk RNA-seq data, rather than direct measurements of actual immune cell abundances."
    explanation: >-
      The immune-cell results are computational enrichment scores rather than
      measured cell abundances.
  - reference: PMID:42418414
    reference_title: "Bioinformatics analysis reveals the characteristics of immune microenvironment in major depressive disorder and vitiligo."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Two independent GEO datasets (GSE52790 and GSE80009) were utilized as external validation sets to examine the consistency and stability of these findings."
    explanation: >-
      Independent disease-specific datasets strengthen the candidate-marker
      screen relative to discovery alone, but ROC-style discriminatory
      validation does not establish a shared cell state, p38 activity,
      mediation, or causality.
  - reference: DOI:10.1111/exd.14979
    reference_title: "Exploring genetic associations between vitiligo and mental disorders using Mendelian randomization"
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "In our findings, none of the rigorous bidirectional MR analyses uncovered a significant causal association."
    explanation: >-
      The null result constrains genetically instrumented disease-to-disease
      effects between generalized vitiligo and a broad depression phenotype; it
      does not test shared pleiotropic liability and leaves acquired and
      clinically defined MDD-subgroup mechanisms unresolved.
  - reference: PMID:41781039
    reference_title: "Prevalence and comparative risk of mental health disorders in persons with vitiligo: a retrospective matched cohort study using claims data with expert-informed case validation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The mental health comorbidity profile was largely comparable to that of atopic dermatitis, whereas more pronounced differences were observed in comparisons with psoriasis."
    explanation: >-
      A dermatologic comparator confirms mental-health burden but challenges
      the specificity of a vitiligo-specific shared immune mechanism.
  - reference: PMID:21835346
    reference_title: "Selective p38α MAPK deletion in serotonergic neurons produces stress resilience in models of depression and addiction."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Social defeat stress produced social avoidance (a model of depression-like behaviors) and reinstatement of cocaine preference (a measure of addiction risk) in wild-type mice, but not in mice having p38α MAPK selectively deleted in serotonin-producing neurons of the dorsal raphe nucleus."
    explanation: >-
      Cell-specific mouse genetics supports a p38-alpha stress pathway in
      serotonergic neurons, not a human MDD-vitiligo bridge.
  - reference: PMID:24699061
    reference_title: "Evaluation of antidepressant properties of the p38 MAP kinase inhibitor losmapimod (GW856553) in Major Depressive Disorder: Results from two randomised, placebo-controlled, double-blind, multicentre studies using a Bayesian approach."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A subsequent study, Study 009 (n=128), designed using a Bayesian approach based on a prior derived from Study 574, showed no advantage for losmapimod (Bech, 6 weeks: endpoint drug vs. placebo difference = 1.11; 95% credible interval, -0.22, 2.50). Biomarker data showed no significant changes. In conclusion 7.5 mg BID losmapimod was not effective in MDD."
    explanation: >-
      The larger human MDD study and its biomarkers were null, although a
      smaller prematurely terminated study had favored treatment. A single
      regimen, duration, and selected MDD population without demonstrated
      biomarker modulation is a narrow pharmacologic constraint, not a
      refutation of cell-specific MAPK14 activity or a shared acquired mediator.
  - reference: PMID:20085492
    reference_title: "The involvement of Smac/DIABLO, p53, NF-kB, and MAPK pathways in apoptosis of keratinocytes from perilesional vitiligo skin: Protective effects of curcumin and capsaicin."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "In keratinocytes from perilesional vitiligo skin, we observed high levels of activated p38, NF-kB p65 subunit, p53, and Smac/DIABLO proteins."
    explanation: >-
      Patient-derived keratinocytes from 12 people with nonsegmental vitiligo
      support a skin-compartment pan-p38 signal. The cultured-cell study does
      not resolve MAPK14 from other p38 isoforms or connect the signal to MDD.
  - reference: PMID:18575770
    reference_title: "Minocycline protects melanocytes against H2O2-induced cell death via JNK and p38 MAPK pathways."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Also, H2O2 treatment activates JNK and p38 MAPK, and executive caspase 3 in B10BR cells."
    explanation: >-
      p38-family activation in oxidatively stressed mouse melanocytes supplies
      separate plausibility but is neither MAPK14-specific nor evidence of a
      shared human mechanism.
  proposed_experiments:
  - experiment_id: exp_mdd_vitiligo_longitudinal_mediation
    name: Adjudicate temporal immune, psychosocial, and surveillance mediation
    description: >-
      Prospectively enroll treatment-naive incident MDD-only, active
      nonsegmental-vitiligo-only, comorbid, and matched control groups. Reassess
      structured MDD diagnoses, symptom trajectories, vitiligo subtype,
      activity, extent and visibility, medication, healthcare utilization,
      autoimmune disease, smoking, BMI, socioeconomic factors, stress, stigma,
      and quality of life. At repeated visits profile circulating immune cells
      by single-cell transcriptomics plus surface proteins and measure
      cell-type-specific phospho-p38 and cytokines; collect paired lesional and
      nonlesional skin only from consenting vitiligo participants. Follow the
      single-disease groups for onset of the second condition and use
      prespecified time-varying mediation models.
    experiment_type:
      preferred_term: prospective longitudinal multimodal cohort study
    readouts:
    - name: Incident second condition and within-person disease trajectories
      target: pathophysiology#Neuroinflammation
      description: >-
        Adjudicated incident vitiligo in MDD-only participants and incident MDD
        in vitiligo-only participants, with repeated measures of both diseases.
      interpretation: >-
        Establishes temporal order and distinguishes prediction of transition
        from cross-sectional correlation.
    - name: Cell-state-resolved p38 and inflammatory program
      target: pathophysiology#Neuroinflammation
      description: >-
        Phospho-p38, cytokines, and single-cell immune states in blood, aligned
        to skin states when skin is available.
      interpretation: >-
        Tests whether a homologous acquired state precedes both transitions
        rather than following disease or treatment.
    controls:
    - name: Matched disease-free controls under equal surveillance
      description: >-
        Controls matched on age, sex, site, healthcare-contact schedule, and
        major measured confounders.
    - name: Single-disease comparator groups
      description: >-
        MDD-only and vitiligo-only groups permit direction-specific analyses;
        atopic dermatitis is an optional visible-inflammatory-skin comparator.
    decision_criterion: >-
      Support a shared acquired mediator only if the same prespecified
      cell-state-specific p38 program precedes onset of the second condition in
      both directions, tracks both outcomes within person, and mediates risk
      after psychosocial, treatment, autoimmune, and surveillance covariates.
      Prefer a psychosocial explanation if visibility, stigma, or distress
      predicts MDD without that program; prefer surveillance bias if equalized
      follow-up materially attenuates the association; classify p38 as a marker
      if it appears only after disease or treatment.
    would_support:
    - pathophysiology#Neuroinflammation
    - Vitiligo:pathophysiology#Autoimmune Reaction

  - experiment_id: exp_mdd_vitiligo_mapk14_cell_epistasis
    name: Test cell-specific MAPK14 necessity and rescue in both disease arms
    description: >-
      Build matched human systems comprising iPSC-derived serotonergic neurons
      with supporting glia and autologous melanocyte-keratinocyte-cytotoxic
      T-cell skin cultures from MDD-only, active nonsegmental-vitiligo-only,
      comorbid MDD-vitiligo, and matched disease-free control donors. First map
      phospho-p38 to specific cell states and upstream ligands. Then compare
      MAPK14 CRISPR interference or knockout with a selective p38-alpha
      inhibitor, non-targeting and vehicle arms, and rescue with
      CRISPR-resistant wild-type versus kinase-dead MAPK14. Challenge neural
      cultures with stress/inflammatory ligands and skin cultures with oxidative
      stress and IFN-gamma-driven immune attack; use blinded, preregistered
      analysis.
    experiment_type:
      preferred_term: human cell-specific causal perturbation and rescue study
    perturbations:
    - name: MAPK14 genetic and pharmacologic loss of function
      target: pathophysiology#Neuroinflammation
      description: >-
        Cell-type-restricted MAPK14 CRISPR perturbation and selective
        p38-alpha inhibition in neural, skin, and immune compartments.
    - name: Wild-type versus kinase-dead MAPK14 rescue
      target: pathophysiology#Monoamine Deficiency
      description: >-
        Isogenic rescue separates on-target catalytic dependence from editing
        artifacts and scaffold effects.
    readouts:
    - name: Serotonergic stress response
      target: pathophysiology#Monoamine Deficiency
      description: >-
        Serotonin-transporter surface localization and uptake, cytokine release,
        neuronal activity, and cell viability.
    - name: Melanocyte injury and immune attack
      target: Vitiligo:pathophysiology#Autoimmune Reaction
      description: >-
        Melanocyte apoptosis and survival, cytotoxic T-cell killing, and
        CXCL9/CXCL10 pathway readouts.
    controls:
    - name: Isogenic non-targeting and vehicle controls
      description: >-
        Same donor, differentiation batch, ligand exposure, and assay schedule.
    - name: Compartment-restricted perturbation controls
      description: >-
        Perturb MAPK14 separately in neurons, glia, melanocytes, keratinocytes,
        and T cells to resolve cell of action.
    decision_criterion: >-
      A shared causal node requires a reproducible upstream state plus MAPK14
      catalytic necessity in both arms, phenotypic rescue by wild-type but not
      kinase-dead MAPK14, and cross-donor replication. Different upstream
      signals or causal compartments support parallel context-specific uses of
      p38 rather than one shared circuit; loss of association after perturbation
      controls or failure to alter either phenotype classifies MAPK14 as a
      correlated marker.
    would_support:
    - pathophysiology#Monoamine Deficiency
    - Vitiligo:pathophysiology#Autoimmune Reaction
- discussion_id: gap_mdd_stalled_ahn_causality_and_suicide_confound
  prompt: >-
    Is arrested progression of the adult hippocampal neurogenic lineage a
    causal contributor to MDD, a consequence of the depressed or stressed
    state, or a correlate of suicide rather than of depression? And is the
    adult human subgranular-zone lineage on which the claim rests a genuine
    ongoing neurogenic programme or a persistent immature transcriptional
    state?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#stalled_adult_hippocampal_neurogenesis_model
  - pathophysiology#Stalled Adult Hippocampal Neurogenesis
  - pathophysiology#Neurogenic Niche Interferon Signaling Activation
  rationale: >-
    The evidence is a single cross-sectional postmortem cohort. Three limits
    matter for how far the mechanism can be pushed. First, direction of
    causation cannot be recovered from postmortem tissue: interferon
    activation, transcription-factor reprogramming and the neuroblast deficit
    are observed together, so the edges into the stalled-neurogenesis node are
    curated as indirect with undetermined direction. Second, 40 of the 55 MDD
    decedents died by suicide while no control did, so MDD and suicide
    pathology are confounded by design in this sample. Third, the existence and
    magnitude of adult human hippocampal neurogenesis is itself contested; the
    study's own data show mature granule cells re-expressing immaturity markers
    in the granule cell layer, which is a dematuration interpretation rather
    than an ongoing-neurogenesis one, and the immature granule-cell pool was
    unchanged in MDD.
  proposed_experiments:
  - experiment_id: mdd_ahn_suicide_deconfounding_cohort
    name: Postmortem cohort separating MDD from death by suicide
    description: >-
      Extend the multiomic hippocampal profiling to a cohort with four groups -
      MDD decedents who died by suicide, MDD decedents who died of other
      causes, non-MDD suicide decedents, and neurotypical controls - powered to
      test the neuroblast deficit and the interferon module separately against
      diagnosis and against manner of death.
    decision_criterion: >-
      If the neuroblast deficit tracks MDD diagnosis independently of manner of
      death, the mechanism belongs to this entry. If it tracks suicide, it
      belongs on a suicide-related entry and should be removed from here.
  - experiment_id: mdd_ahn_interferon_directionality
    name: Directionality of interferon signalling on human neurogenic progenitors
    description: >-
      Apply type I interferon and interferon blockade to human hippocampal
      neural stem cell and progenitor cultures or organoids derived from MDD
      and control donors, measuring progression from quiescent stem cell to
      neuroblast (nestin, Ki67, ASCL1, DCX, TUBB3) rather than only steady-state
      marker abundance.
    decision_criterion: >-
      Interferon exposure that reproduces the stem-cell accumulation and
      neuroblast deficit would upgrade the interferon-to-neurogenesis edge from
      indirect with unknown intermediates to a supported causal edge; absence of
      an effect would make the interferon module a parallel correlate.
  - experiment_id: mdd_ahn_living_biomarker
    name: In vivo correlate of the neurogenic deficit in living patients
    description: >-
      Pair a hippocampus-dependent behavioural assay of pattern separation with
      dentate-gyrus-resolved imaging in living unmedicated MDD patients and
      controls, testing whether the behavioural deficit predicted by a stalled
      neurogenic lineage is present and whether it responds to treatment.
    decision_criterion: >-
      A treatment-responsive pattern-separation deficit would make the
      postmortem molecular finding clinically interpretable; its absence would
      confine the mechanism to a postmortem tissue phenotype.
  notes: >-
    Recorded as KNOWLEDGE_GAP rather than HUMAN_MODEL_MISMATCH: the evidence is
    human postmortem tissue, not a model system, so the open question is
    causation and confounding rather than translational validity.

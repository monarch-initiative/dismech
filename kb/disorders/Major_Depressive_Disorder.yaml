  title: Age-related transcriptomic differences in peripheral blood of adolescents with major depressive disorder
  description: In this study, we collected peripheral blood samples of a typical large population, including MDD cases and healthy controls from children and adolescents, and aimed to apply RNA-seq sequencing to comprehensively analyze the transcriptomic characteristics in adolescent depression patients. In comparison to healthy patients, we discovered that several immune response-associated genes were dysregulated in MDD patients, with the majority of these differential genes strongly correlated with the HAMD-17 and HAMA scores.

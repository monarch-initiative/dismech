  imaging_finding_term:
    preferred_term: Abnormal thalamus morphology
    term:
      id: HP:0010663
      label: Abnormal thalamus morphology
  spatial_extent: MULTIFOCAL
  diagnostic: false
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both white and gray matter can be affected. Cortical as well as deep gray
      matter lesions have been described.
    explanation: >-
      This supports cortical and deep-gray involvement as part of the ADEM MRI
      spectrum.
- name: Long-segment spinal cord abnormalities
  modality: MRI
  description: >-
    Spinal cord lesions can accompany brain disease and, when present, may span
    more than two vertebral segments; their population frequency is uncertain
    because spinal imaging is not performed uniformly.
  imaging_finding_term:
    preferred_term: Myelitis
    term:
      id: HP:0012486
      label: Myelitis
  spatial_extent: MULTIFOCAL
  diagnostic: false
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If present, spinal cord abnormalities can be observed over more than two
      vertebral segments
    explanation: >-
      The review describes the possible longitudinal extent of ADEM spinal-cord
      lesions.
biochemical:
- name: CSF leukocyte count
  presence: INCREASED
  context: >-
    Mild pleocytosis is variable and nonspecific; counts above 100 cells per
    microliter are unusual for ADEM and should increase concern for infectious
    meningoencephalitis.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CSF pleocytosis is observed in a wide range of patients (28–86%)"
    explanation: >-
      The broad frequency range supports pleocytosis as a variable, nonspecific
      ADEM finding rather than a required biomarker.
- name: CSF protein concentration
  presence: INCREASED
  context: >-
    CSF protein can be elevated, but normal values do not exclude ADEM and an
    increase is not disease-specific.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Elevated CSF protein levels are observed in 23–66% of cases"
    explanation: >-
      The review quantifies the variable frequency of elevated CSF protein.
- name: CSF-restricted oligoclonal IgG bands
  presence: USUALLY_ABSENT_OR_TRANSIENT
  context: >-
    CSF-restricted oligoclonal bands are uncommon and may be transient in ADEM;
    persistent intrathecal bands are more typical of multiple sclerosis but are
    not independently diagnostic.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oligoclonal bands are found in less than 10% and may be transitory, contrary to MS"
    explanation: >-
      The review directly supports the usual absence or transience of
      oligoclonal bands in ADEM.
diagnosis:
- name: Brain and clinically indicated spinal MRI
  description: >-
    MRI supports the ADEM case definition by demonstrating multifocal
    inflammatory demyelinating lesions, but a normal scan in the first days
    does not exclude ADEM. Repeat imaging around three months provides a
    reference for resolution or later diagnostic reclassification.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Typical brain lesions are large, bilateral, asymmetric, and poorly
    demarcated on T2/FLAIR; deep-gray and spinal-cord involvement may occur.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Notably, MRI may show no abnormalities in the first days"
    explanation: >-
      This establishes that a normal early MRI cannot by itself exclude ADEM.
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a reference scan timed around three months after ADEM onset is advised."
    explanation: >-
      The review supports a three-month reference scan to assess evolution and
      distinguish a later event.
- name: Cerebrospinal fluid analysis
  description: >-
    CSF cell count, protein, oligoclonal bands, and microbiologic studies help
    assess CNS inflammation and exclude infectious meningoencephalitis and
    other mimics; no CSF result is specific for ADEM.
  diagnosis_term:
    preferred_term: cerebrospinal fluid analysis
    term:
      id: NCIT:C173272
      label: CSF Analysis
  results: >-
    Mild pleocytosis and elevated protein may occur; oligoclonal bands are
    usually absent or transient. Marked pleocytosis warrants renewed evaluation
    for infection.
  evidence:
  - reference: PMID:27572859
    reference_title: "Acute disseminated encephalomyelitis: Updates on an inflammatory CNS syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CSF analysis may reveal a mild pleocytosis and elevated protein, but is
      generally negative for intrathecal oligoclonal immunoglobulin G synthesis.
    explanation: >-
      This supports CSF analysis as a nonspecific adjunct that also helps
      separate ADEM from common mimics.
- name: Serum MOG-IgG cell-based assay
  description: >-
    Serum MOG-IgG testing is not required to recognize the ADEM phenotype, but
    a compatible presentation plus a valid positive cell-based assay supports
    classification as MOGAD, a distinct disorder with its own relapse and
    treatment implications.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Interpret serum MOG-IgG using modern MOGAD criteria and assay/titer context;
    a positive result should not be encoded as a universal ADEM biomarker.
  evidence:
  - reference: PMID:36706773
    reference_title: "Diagnosis of myelin oligodendrocyte glycoprotein antibody-associated disease: International MOGAD Panel proposed criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serum antibodies directed against myelin oligodendrocyte glycoprotein
      (MOG) are found in patients with acquired CNS demyelinating syndromes that
      are distinct from multiple sclerosis and aquaporin-4-seropositive
      neuromyelitis optica spectrum disorder.
    explanation: >-
      International criteria establish MOGAD as distinct from MS and
      AQP4-positive NMOSD rather than a chronic subtype of ADEM.
  - reference: PMID:36706773
    reference_title: "Diagnosis of myelin oligodendrocyte glycoprotein antibody-associated disease: International MOGAD Panel proposed criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MOGAD can present as either a monophasic or relapsing disease course, and
      MOG-IgG cell-based assays are important for diagnostic accuracy.
    explanation: >-
      This supports serum MOG-IgG cell-based testing when MOGAD is clinically
      plausible.
- name: Serum AQP4-IgG testing when NMOSD is suspected
  description: >-
    AQP4-IgG testing is indicated when optic neuritis, longitudinally extensive
    myelitis, area-postrema symptoms, or other features raise concern for
    NMOSD; a positive result redirects the diagnosis away from isolated ADEM.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Typical brain MRI characteristics and aquaporin-4 antibody (AQP4-Ab),
      respectively, help to distinguish these disorders
    explanation: >-
      The review supports brain MRI for MS discrimination and AQP4 antibody
      testing for NMOSD discrimination after an ADEM-like first event.
differential_diagnoses:
- name: Multiple sclerosis
  disease_term:
    preferred_term: multiple sclerosis
    term:
      id: MONDO:0005301
      label: multiple sclerosis
  description: >-
    MS may begin with an acquired demyelinating syndrome, but periventricular
    lesions, T1 black holes, absence of a bilateral lesion pattern, persistent
    oligoclonal bands, or later nonencephalopathic attacks favor MS over ADEM.
  distinguishing_features:
  - Two or more periventricular lesions and T1 black holes favor MS.
  - Absence of a bilateral lesion pattern favors MS over typical ADEM.
  - Later nonencephalopathic attacks or new MS-specific lesions require reclassification.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In order to discriminate between ADEM and MS at the time of the first
      attack, three items are potentially useful: (1) two or more
      periventricular lesions, (2) presence of black holes and (3) absence of a
      bilateral lesion pattern.
    explanation: >-
      The review provides MRI features that favor MS at presentation, while
      emphasizing elsewhere that they are not independently diagnostic.
- name: Myelin oligodendrocyte glycoprotein antibody-associated disease
  disease_term:
    preferred_term: myelin oligodendrocyte glycoprotein antibody-associated disease
    term:
      id: MONDO:1040024
      label: myelin oligodendrocyte glycoprotein antibody-associated disease
  description: >-
    ADEM is a recognized core attack phenotype of MOGAD, especially in young
    children. A valid serum MOG-IgG result and compatible clinical event support
    MOGAD classification; relapse may occur and should not be labeled recurrent
    idiopathic ADEM by default.
  distinguishing_features:
  - Serum MOG-IgG detected by an appropriate cell-based assay is a core MOGAD criterion.
  - Optic neuritis, transverse myelitis, cortical encephalitis, or further attacks support MOGAD reclassification.
  evidence:
  - reference: PMID:36706773
    reference_title: "Diagnosis of myelin oligodendrocyte glycoprotein antibody-associated disease: International MOGAD Panel proposed criteria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MOGAD is typically associated with acute disseminated encephalomyelitis,
      optic neuritis, or transverse myelitis
    explanation: >-
      International MOGAD criteria explicitly recognize ADEM as a core event
      phenotype of a separate antibody-associated disease.
- name: Neuromyelitis optica spectrum disorder
  disease_term:
    preferred_term: neuromyelitis optica spectrum disorder
    term:
      id: MONDO:0019100
      label: neuromyelitis optica
  description: >-
    AQP4-IgG-positive NMOSD can cause optic neuritis, longitudinally extensive
    myelitis, or an ADEM-like first presentation. AQP4-IgG positivity and
    characteristic NMOSD syndromes favor NMOSD rather than isolated ADEM.
  distinguishing_features:
  - Positive serum AQP4-IgG supports NMOSD.
  - Area-postrema syndrome, severe optic neuritis, or longitudinally extensive myelitis are red flags.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The first demyelinating event might also represent the first manifestation
      of a chronic demyelinating relapsing disease, such as multiple sclerosis
      (MS), neuromyelitis optica spectrum disorder (NMOSD) or myelin
      oligodendrocyte glycoprotein antibody (MOG-Ab)-associated disease
    explanation: >-
      This identifies NMOSD and MOGAD among chronic disorders that can first
      present with an ADEM-like demyelinating event.
- name: Infectious meningoencephalitis
  disease_term:
    preferred_term: encephalitis
    term:
      id: MONDO:0019956
      label: encephalitis
  description: >-
    Fever, seizures, meningismus, and encephalopathy can closely mimic ADEM.
    Microbiologic evaluation and CSF interpretation are essential before
    immunotherapy; marked pleocytosis is atypical for ADEM.
  distinguishing_features:
  - CSF leukocyte counts above 100 cells per microliter are unusual in ADEM.
  - Pathogen PCR, culture, antigen testing, or a compatible exposure supports infection.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is no strict upper limit to the pleocytosis, although CSF leukocyte
      cell counts above 100/μL are rarely seen and warrant against the
      possibility of an infectious meningoencephalitis
    explanation: >-
      The review identifies marked pleocytosis as a warning against ADEM and in
      favor of infectious meningoencephalitis.
- name: Autoimmune encephalitis
  disease_term:
    preferred_term: autoimmune encephalitis
    term:
      id: MONDO:0020640
      label: autoimmune encephalitis
  description: >-
    Autoimmune encephalitis, particularly anti-NMDAR encephalitis, can cause
    encephalopathy, seizures, psychiatric symptoms, and movement disorders.
    Persistent seizures or prominent dystonia/chorea with a normal or
    non-demyelinating MRI favor autoimmune encephalitis.
  distinguishing_features:
  - Persistent seizures or predominant extrapyramidal movement disorder.
  - MRI is often normal rather than showing typical multifocal demyelination.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Persistent seizures or predominant extrapyramidal movement disorders like
      dystonia and chorea may be symptoms of anti-N-methyl-D-asparate receptor
      (anti-NMDAR) encephalitis.
    explanation: >-
      The review identifies the seizure and movement-disorder pattern that
      should redirect evaluation toward anti-NMDAR encephalitis.
- name: Vascular, metabolic, genetic, and neoplastic mimics
  description: >-
    CNS vasculitis, systemic inflammatory disease, mitochondrial disease,
    leukodystrophy, hemophagocytic lymphohistiocytosis, and CNS neoplasm can
    resemble ADEM. Stroke-like events, bilaterally symmetric lesions, or a
    relentlessly progressive course are red flags against ADEM.
  distinguishing_features:
  - Stroke-like events favor vascular, systemic inflammatory, or mitochondrial disease.
  - Bilaterally symmetric lesions favor genetic, metabolic, or histiocytic disorders.
  - A progressive course favors genetic, metabolic, or neoplastic disease.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The differential diagnosis of ADEM is broad and contains, besides other
      ADSs, other inflammatory diseases and vascular, metabolic and genetic
      disorders
    explanation: >-
      The review explicitly frames the broad non-demyelinating differential.
progression:
- phase: Trigger-to-neurologic onset interval
  subtype: Monophasic ADEM
  notes: >-
    When a preceding infection is present, neurologic symptoms usually emerge
    days to weeks later.
  duration_days: "2-21"
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neurological symptoms generally begin within 2–21 days (range 1–42) after an infection"
    explanation: >-
      The review provides a typical infection-to-neurologic-onset interval.
- phase: Relapse risk
  notes: >-
    Most pediatric ADEM is monophasic. Published cohorts call later events
    relapses, but every event after the three-month index-attack window requires
    renewed classification as classic multiphasic ADEM, MOGAD, MS, NMOSD, or
    another disorder. Persistent MOG-IgG1 strongly enriches for a relapsing
    MOGAD course in selected referral cohorts rather than defining relapsing
    idiopathic ADEM.
  evidence:
  - reference: PMID:40340642
    reference_title: "Acute Disseminated Encephalomyelitis in Children and Adolescents: A Multicenter Retrospective Study of Relapse and Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-three patients (12.6%) relapsed."
    explanation: >-
      Contemporary nationwide pediatric cohort quantifies subsequent events in
      12.6% of evaluated patients; the report's relapse label does not remove
      the need for modern diagnostic reclassification.
  - reference: PMID:30014148
    reference_title: "Association of MOG-IgG Serostatus With Relapse After Acute Disseminated Encephalomyelitis and Proposed Diagnostic Criteria for MOG-IgG-Associated Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relapse occurred in 15 of 17 patients (88%) with persistent MOG-IgG1
      seropositivity after ADEM; only 1 patient with transient seropositivity
      experienced relapse.
    explanation: >-
      Persistent MOG-IgG1 seropositivity identifies a high-risk MOGAD-enriched
      relapsing subgroup after an initial ADEM phenotype.
- phase: Recovery and sequelae
  notes: >-
    Neurologic recovery is often favorable, but residual motor, seizure,
    cognitive, academic, or behavioral sequelae occur in a clinically important
    minority.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "full recovery with normal neurological examination is reported for most patients (50–80%)"
    explanation: >-
      The review summarizes historical pediatric recovery rates.
  - reference: PMID:33830467
    reference_title: "Assessment and Management of Acute Disseminated Encephalomyelitis (ADEM) in the Pediatric Patient."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Long-term outcomes for ADEM are generally favorable, but some children
      have significant morbidity related to the severity of acute illness and/or
      manifest ongoing neurocognitive sequelae.
    explanation: >-
      Wang 2021 emphasizes generally favorable outcomes while documenting
      persistent morbidity in some children.
- phase: Adult mortality and residual disability
  subtype: Monophasic ADEM
  notes: >-
    Adult estimates are less secure because there is no internationally agreed
    adult case definition and included cohorts may differ in diagnostic
    classification. A systematic review nevertheless found materially worse
    outcomes than are usually reported in children.
  evidence:
  - reference: PMID:35757742
    reference_title: "Clinical Presentation and Outcomes of Acute Disseminated Encephalomyelitis in Adults Worldwide: Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mortality rate was 7.8% (95% CI = 3.3-13.5), and the risk of residual
      deficits was 47.5% (95% CI = 31.8-63.4).
    explanation: >-
      The adult meta-analysis quantifies pooled mortality and residual-deficit
      risk, interpreted cautiously because adult ADEM lacks a consensus case
      definition.
treatments:
- name: High-Dose Corticosteroids
  description: >-
    High-dose intravenous methylprednisolone is the usual first-line acute
    immunotherapy for suspected ADEM once infectious mimics are being addressed
    or excluded. This practice is derived from observational evidence and expert
    opinion rather than an ADEM-specific randomized trial.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: CNS-Directed Autoimmune Inflammation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids broadly suppress immune activation, cytokine production,
      vascular permeability, and CNS inflammation during the acute attack.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        First-line acute treatment generally consists of IV methylprednisolone at
        a dose of 30 mg/kg/day (maximum 1000 mg/day) for 3–5 days
      explanation: >-
        The review supports steroid use for the inflammatory attack; the broad
        immunosuppressive target description is pharmacologic inference.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As there are no specific randomized trials for ADEM, treatment protocols
      are derived from observational studies and expert opinions.
    explanation: >-
      This defines the evidence ceiling for all acute ADEM treatment protocols.
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      First-line acute treatment generally consists of IV methylprednisolone at
      a dose of 30 mg/kg/day (maximum 1000 mg/day) for 3–5 days
    explanation: >-
      The review provides the standard first-line steroid regimen.
  - reference: PMID:39092058
    reference_title: "Clinical pattern, neuroimaging findings and outcome of Acute Disseminated Encephalomyelitis in children: A retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment included IV methylprednisolone (22; 73%), IVIG (9; 30%), or both (6; 20%)."
    explanation: >-
      Pediatric cohort data show IV methylprednisolone use in most cases.
- name: Intravenous Immunoglobulin
  description: >-
    Intravenous immunoglobulin is used as second-line therapy for
    steroid-unresponsive ADEM or when steroid use is limited by clinical
    context; the evidence base is observational and expert-derived.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: CNS-Directed Autoimmune Inflammation
    treatment_effect: INHIBITS
    description: >-
      IVIG modulates pathogenic autoantibody and Fc-receptor-mediated immune
      pathways and can dampen inflammatory demyelination.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Intravenous immunoglobulin (IVIG) is prescribed as second-line treatment
        for steroid-unresponsive ADEM at a total dose of 2 g/kg for 2–5 days.
      explanation: >-
        The review supports IVIG use in refractory inflammatory disease; the
        detailed immunomodulatory route is pharmacologic inference.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intravenous immunoglobulin (IVIG) is prescribed as second-line treatment
      for steroid-unresponsive ADEM at a total dose of 2 g/kg for 2–5 days.
    explanation: >-
      The review supports IVIG as second-line treatment for steroid-unresponsive
      ADEM.
  - reference: PMID:33830467
    reference_title: "Assessment and Management of Acute Disseminated Encephalomyelitis (ADEM) in the Pediatric Patient."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute treatment modalities include high-dose intravenous corticosteroids,
      therapeutic plasma exchange, and intravenous immunoglobulin.
    explanation: >-
      Wang 2021 identifies IVIG among standard acute ADEM treatment modalities.
- name: Plasma Exchange
  description: >-
    Therapeutic plasma exchange is used for severe or steroid/IVIG-refractory
    ADEM, especially when rapid removal of circulating inflammatory mediators or
    pathogenic autoantibodies is clinically urgent. ADEM-specific evidence is
    limited, and randomized evidence comes from mixed inflammatory demyelinating
    attacks rather than a dedicated ADEM population.
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: CNS-Directed Autoimmune Inflammation
    treatment_effect: INHIBITS
    description: >-
      Plasma exchange removes circulating IgG and other soluble inflammatory
      mediators during severe acute neuroinflammatory attacks; the specific
      pathogenic mediator in non-MOGAD ADEM is not established.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Plasma exchange (PLEX) with three to seven exchanges is used in refractory patients"
      explanation: >-
        The review supports PLEX use in refractory ADEM; removal of a specific
        pathogenic mediator in non-MOGAD ADEM remains inferential.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Plasma exchange (PLEX) with three to seven exchanges is used in refractory patients"
    explanation: >-
      The review supports plasma exchange use for refractory ADEM.
  - reference: PMID:39130917
    reference_title: "Evaluating Therapeutic Plasma Exchange in Pediatric Acute Disseminated Encephalomyelitis: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Implications for clinical practice include considering TPE as a
      therapeutic option, particularly in severe or refractory cases, and
      emphasizing the importance of early intervention.
    explanation: >-
      The 2024 review supports TPE consideration in severe or refractory
      pediatric ADEM.
- name: Supportive and Empiric Anti-Infective Care
  description: >-
    Because ADEM can initially resemble infectious meningoencephalitis,
    supportive care is essential and empiric antimicrobials or antivirals may be
    appropriate only while infection remains clinically plausible. These agents
    treat a possible mimic or coexisting infection, not the ADEM immune
    mechanism itself.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive care is important, and treatment with antivirals and
      antibiotics is generally prescribed, as ADEM may mimic infection
    explanation: >-
      This supports supportive and empiric anti-infective management during
      early diagnostic evaluation.
clinical_trials:
- name: NCT00004645
  phase: PHASE_III
  status: UNKNOWN
  description: >-
    Phase III sham-controlled study of plasma exchange for acute severe attacks
    of inflammatory demyelinating disease refractory to intravenous
    methylprednisolone. The population was not ADEM-specific, so this is indirect
    rescue-therapy evidence relevant to severe steroid-refractory ADEM rather
    than a dedicated ADEM trial.
  target_phenotypes:
  - preferred_term: CNS demyelination
    term:
      id: HP:0007305
      label: CNS demyelination
  evidence:
  - reference: clinicaltrials:NCT00004645
    reference_title: "Phase III Randomized, Double-Blind, Sham-Controlled Study of Plasma Exchange for Acute Severe Attacks of Inflammatory Demyelinating Disease Refractory to Intravenous Methylprednisolone"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evaluate the effectiveness of plasma exchange in the treatment of acute
      severe attacks of inflammatory demyelinating disease in patients who have
      failed intravenous steroid therapy.

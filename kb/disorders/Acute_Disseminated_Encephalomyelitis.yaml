- name: CNS-Directed Autoimmune Inflammation
  description: >-
    Loss of self-tolerance is the shared proposed convergence point of the
    postinfectious hypotheses. Activated lymphocytes, macrophages, microglia,
    cytokines, and in some presentations antibodies generate multifocal CNS
    inflammation; the dominant effector pathway varies and is incompletely
    defined in non-MOGAD ADEM.

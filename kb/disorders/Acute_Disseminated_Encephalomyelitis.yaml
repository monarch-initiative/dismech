discussions:
- discussion_id: disc_adem_treatment_evidence_gap
  prompt: >-
    Which acute immunotherapy sequence produces the best functional and
    neurocognitive outcomes in rigorously classified ADEM?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#High-Dose Corticosteroids
  - treatments#Intravenous Immunoglobulin
  - treatments#Plasma Exchange
  rationale: >-
    Steroids, IVIG, and plasma exchange are widely used, but modern ADEM lacks
    disease-specific randomized comparative trials. Future studies must use
    explicit pediatric or adult case definitions, separate MOGAD and other
    relapsing disorders, and measure functional, radiologic, and neurocognitive
    outcomes rather than acute discharge status alone.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As there are no specific randomized trials for ADEM, treatment protocols
      are derived from observational studies and expert opinions.
    explanation: >-
      The review directly identifies the absence of ADEM-specific randomized
      treatment trials.
  posed_date: "2026-07-20T00:00:00Z"

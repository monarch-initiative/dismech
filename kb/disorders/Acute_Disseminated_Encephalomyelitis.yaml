name: Acute Disseminated Encephalomyelitis
creation_date: "2026-05-16T04:09:27Z"
category: Neurological Disorder
parents:
- Autoimmune Disorder
- Demyelinating Disease
disease_term:
  preferred_term: acute disseminated encephalomyelitis
  term:
    id: MONDO:0019383
    label: acute disseminated encephalomyelitis
description: >-
  Acute disseminated encephalomyelitis (ADEM) is an acute, usually monophasic
  immune-mediated demyelinating syndrome of the central nervous system that is
  most common in children. The pediatric case definition requires a first
  polyfocal inflammatory demyelinating event with encephalopathy and supportive
  brain MRI findings after exclusion of better explanations. An ADEM phenotype
  can also be the presenting attack of the distinct disorder MOG-IgG-associated
  disease (MOGAD); a positive MOG-IgG result or a later demyelinating attack
  therefore prompts diagnostic reclassification rather than automatically
  broadening monophasic ADEM into a chronic relapsing disorder.
definitions:
- name: IPMSSG pediatric clinical definition
  definition_type: CASE_DEFINITION
  description: >-
    The IPMSSG definition applies to pediatric ADEM: a first polyfocal clinical
    CNS event of presumed inflammatory demyelinating cause, encephalopathy not
    explained by fever or a postictal state, and an abnormal brain MRI during
    the acute phase. Symptoms or MRI changes during the first three months may
    represent evolution or treatment-related fluctuation of the same event.
    Infectious, inflammatory, neoplastic, metabolic, genetic, and other mimics
    must be excluded. There is no equivalently accepted international adult
    case definition, so adult diagnosis is an extrapolation supported by
    compatible clinical and radiologic findings and exclusion of alternatives.
  criteria_sets:
  - name: Core clinical features
    core_clinical_characteristics:
    - preferred_term: Encephalopathy
      term:
        id: HP:0001298
        label: Encephalopathy
    - preferred_term: CNS demyelination
      term:
        id: HP:0007305
        label: CNS demyelination
    - preferred_term: Multifocal neurologic deficits
      term:
        id: HP:0012638
        label: Abnormal nervous system physiology
      description: >-
        HPO lacks a single term for polyfocal neurologic deficits; this
        descriptor captures the broad CNS physiologic disturbance while the
        entry's individual phenotypes encode the component neurologic findings.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "By definition, ADEM requires the presence of encephalopathy and polyfocal CNS symptoms."
      explanation: >-
        The review directly supports encephalopathy and polyfocal CNS symptoms
        as core clinical requirements.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute disseminated encephalomyelitis (ADEM) is an immune-mediated central
      nervous system (CNS) disorder, characterized by polyfocal symptoms,
      encephalopathy and typical magnetic resonance imaging (MRI) findings, that
      especially affects young children.
    explanation: >-
      This review summarizes the core ADEM case definition: immune-mediated CNS
      disease with encephalopathy, polyfocal symptoms, and typical MRI findings.
  - reference: PMID:33830467
    reference_title: "Assessment and Management of Acute Disseminated Encephalomyelitis (ADEM) in the Pediatric Patient."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostic evaluation for ADEM involves neuroimaging and laboratory
      studies to exclude potential infectious, inflammatory, neoplastic, and
      genetic mimics of ADEM.
    explanation: >-
      Wang 2021 supports the diagnosis-of-exclusion framing used in this
      definition.
  - reference: PMID:23572237
    reference_title: "International Pediatric Multiple Sclerosis Study Group criteria for pediatric multiple sclerosis and immune-mediated central nervous system demyelinating disorders: revisions to the 2007 definitions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Revised criteria are proposed for pediatric acute disseminated
      encephalomyelitis, pediatric clinically isolated syndrome, pediatric
      neuromyelitis optica and pediatric MS.
    explanation: >-
      This consensus paper establishes that the operational ADEM definition is
      specifically a pediatric IPMSSG definition rather than a validated adult
      standard.
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "there are no international definitions of ADEM in adults"
    explanation: >-
      The review explicitly identifies the lack of an international adult ADEM
      definition, requiring cautious extrapolation of pediatric criteria.
has_subtypes:
- name: Monophasic ADEM
  description: >-
    A single acute demyelinating episode with encephalopathy and polyfocal CNS
    involvement, without a later qualifying demyelinating attack after the
    three-month evolution and steroid-taper fluctuation window.
  evidence:
  - reference: PMID:27572859
    reference_title: "Acute disseminated encephalomyelitis: Updates on an inflammatory CNS syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADEM is generally considered a monophasic disease. However, recurrent ADEM
      has been described and defined as multiphasic disseminated
      encephalomyelitis.
    explanation: >-
      Pohl et al. summarize the usual monophasic course while acknowledging
      recurrent/multiphasic presentations.
  - reference: PMID:40340642
    reference_title: "Acute Disseminated Encephalomyelitis in Children and Adolescents: A Multicenter Retrospective Study of Relapse and Outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nationwide cohort presented further supports the typically monophasic
      nature of acute disseminated encephalomyelitis, and a high rate of
      complete recovery.
    explanation: >-
      A 245-patient pediatric/adolescent cohort supports the typical monophasic
      course in contemporary clinical practice.
- name: Multiphasic ADEM
  description: >-
    The classic IPMSSG construct is one ADEM attack followed more than three
    months later by a second ADEM episode with renewed encephalopathy, new
    polyfocal findings, and new MRI lesions, without further attacks. More than
    two attacks or later non-ADEM attacks should prompt reassessment for MOGAD,
    multiple sclerosis, NMOSD, or another diagnosis.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MDEM is defined as an ADEM attack followed >3 months later by a second
      ADEM episode without any further attacks
    explanation: >-
      This is the narrow classic multiphasic ADEM definition; recurrent attacks
      beyond it require renewed diagnostic classification.
  - reference: PMID:36706773
    reference_title: "Diagnosis of myelin oligodendrocyte glycoprotein antibody-associated disease: International MOGAD Panel proposed criteria."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      MOGAD can present as either a monophasic or relapsing disease course, and
      MOG-IgG cell-based assays are important for diagnostic accuracy.
    explanation: >-
      Modern MOGAD criteria require MOG-IgG testing and diagnostic
      reclassification when an ADEM-like presentation becomes relapsing.
epidemiology:
- name: Pediatric annual incidence
  description: >-
    Reported ADEM incidence varies across pediatric populations and study
    definitions.
  minimum_value: 0.07
  maximum_value: 0.9
  unit: cases per 100000 children per year
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reported annual incidence varies from 0.07–0.9/100,000 children in different locations"
    explanation: >-
      The Paolilo et al. review summarizes published pediatric incidence
      estimates.
mechanistic_hypotheses:
- hypothesis_group_id: postinfectious_molecular_mimicry_model
  hypothesis_label: Postinfectious Molecular Mimicry Model
  status: ALTERNATIVE
  description: >-
    A preceding infection may activate lymphocytes that cross-react with shared
    pathogen and CNS-myelin epitopes. This is a plausible experimental model,
    but the initiating antigen and cross-reactive clone have not been
    established in most human ADEM.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The first is molecular mimicry: structural conformation or peptide
      sequences may be shared between host CNS proteins and some viral
      pathogens.
    explanation: >-
      The review explicitly presents molecular mimicry as one proposed
      postinfectious mechanism rather than a demonstrated universal cause.
- hypothesis_group_id: bbb_disruption_antigen_release_model
  hypothesis_label: BBB Disruption and CNS Antigen Release Model
  status: ALTERNATIVE
  description: >-
    A neurotropic infection may injure the CNS and blood-brain barrier, release
    normally sequestered myelin antigens, and permit expansion and CNS entry of
    autoreactive immune cells. Human ADEM evidence remains indirect.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      After the first infection by a neurotropic virus, CNS damage may occur
      with disruption of the blood–brain barrier (BBB).
    explanation: >-
      The review describes BBB injury and antigen release as the second major
      postinfectious hypothesis.
environmental:
- name: Preceding infection
  influences_mechanisms:
  - target: Preceding Immune Trigger
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Most events follow a respiratory or gastrointestinal illness by days to
      weeks. Recorded as direct because this node is the antecedent itself
      rather than a downstream consequence of it; what the antecedent then
      does is modelled by the mimicry and barrier nodes further along.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A preceding infection or illness is observed in 70–80% of cases"
      explanation: >-
        Places a preceding infection or illness in 70 to 80 percent of cases,
        which is the observation this node records.
  notes: >-
    A respiratory, gastrointestinal, or other infection commonly precedes ADEM,
    but a trigger is not required by diagnostic criteria and temporal
    association does not identify the causal immune pathway in an individual.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A preceding infection or illness is observed in 70–80% of cases"
    explanation: >-
      The review summarizes the common temporal association with infection.
- name: Recent immunization
  influences_mechanisms:
  - target: Preceding Immune Trigger
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported after immunisation but not established as a general cause, and
      the cited source argues against reading it as one. Graded well below the
      preceding-infection link into this same node, and worded so that adding
      the link does not quietly convert a contested temporal report into a
      mechanism.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Although vaccinations have also been implicated as a cause of ADEM, no clear pathogenetic correlation exists and the incidence of ADS following infection is higher than that induced by immunization itself"
      explanation: >-
        States that no clear pathogenetic correlation exists for vaccination
        and that incidence after infection exceeds incidence after
        immunisation. The source supports the association being weak, which is
        what this grade records.
  notes: >-
    ADEM has rarely been reported after immunization, but epidemiologic and
    mechanistic evidence does not establish vaccination as a general cause and
    the postinfection incidence is higher.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Although vaccinations have also been implicated as a cause of ADEM, no
      clear pathogenetic correlation exists and the incidence of ADS following
      infection is higher than that induced by immunization itself
    explanation: >-
      This supports cautious temporal-association wording and argues against a
      direct universal vaccine-causation claim.
pathophysiology:
- name: Preceding Immune Trigger
  description: >-
    Infection or, much less securely, another immune exposure precedes many
    pediatric ADEM events by days to weeks. The association supports an
    immune-triggered syndrome but does not establish a specific pathogen or
    immune route in most patients.
  biological_processes:
  - preferred_term: immune response
    modifier: INCREASED
    term:
      id: GO:0006955
      label: immune response
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Molecular Mimicry
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - postinfectious_molecular_mimicry_model
    description: >-
      Infection-associated immune activation may generate cross-reactive
      antiviral immune responses.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The first is molecular mimicry: structural conformation or peptide
        sequences may be shared between host CNS proteins and some viral
        pathogens.
      explanation: >-
        The review presents molecular mimicry as one hypothesis linking a prior
        infection to CNS autoimmunity.
  - target: BBB Disruption and Antigen Release
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - bbb_disruption_antigen_release_model
    description: >-
      Infection-associated CNS injury may expose normally sequestered CNS
      antigens to the immune system.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        After the first infection by a neurotropic virus, CNS damage may occur
        with disruption of the blood–brain barrier (BBB).
      explanation: >-
        The review presents BBB disruption as an alternative postinfectious
        hypothesis.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mechanistically, ADEM has been classified as a predominately
      post-infectious CNS disorder, with an identifiable trigger reported in up
      to 50–85% of cases
    explanation: >-
      This supports postinfectious immune triggering as a central ADEM
      mechanism.
  - reference: PMID:41750202
    reference_title: "Acute Disseminated Encephalomyelitis (ADEM): Current View into Etiopathogenesis and Clinical Features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADEM typically follows an infectious or, less commonly,
      immunization-related trigger, and despite decades of clinical observation,
      its etiopathogenesis remains only partially understood.
    explanation: >-
      The 2026 review confirms the infectious/immunization trigger model while
      emphasizing remaining mechanistic uncertainty.
- name: Molecular Mimicry
  description: >-
    Molecular mimicry is a proposed mechanism in which pathogen antigens share
    structural conformations or peptide sequences with CNS proteins, generating
    cross-reactive antiviral immune responses that later target myelin.
  biological_processes:
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
  - preferred_term: immune response
    modifier: INCREASED
    term:
      id: GO:0006955
      label: immune response
  downstream:
  - target: CNS-Directed Autoimmune Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - postinfectious_molecular_mimicry_model
    description: >-
      Putative pathogen-cross-reactive lymphocytes may initiate CNS-directed
      inflammation, but this route has not been demonstrated in most patients.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        When a viral infection occurs, a cross-reactive auto-immune reaction may
        be induced against the tissue expressing the mimicked protein.
      explanation: >-
        The review states the proposed cross-reactive route, while human causal
        evidence remains indirect.
  evidence:
  - reference: PMID:33153097
    reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The first is molecular mimicry: structural conformation or peptide
      sequences may be shared between host CNS proteins and some viral
      pathogens.
    explanation: >-
      This directly supports molecular mimicry as a proposed ADEM induction
      mechanism.
  - reference: PMID:41750202
    reference_title: "Acute Disseminated Encephalomyelitis (ADEM): Current View into Etiopathogenesis and Clinical Features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Particular emphasis is placed on post-infectious immune mechanisms,
      including molecular mimicry, blood-brain barrier (BBB) disruption, loss of
      immune tolerance, and neuroinflammatory cascades.
    explanation: >-
      The 2026 review independently includes molecular mimicry in the current
      ADEM mechanistic framework.
- name: BBB Disruption and Antigen Release
  description: >-
    Infection-associated CNS injury may disrupt the blood-brain barrier,
    allowing CNS-confined myelin antigens to leak into peripheral immune
    compartments and break immune tolerance.
  locations:
  - preferred_term: blood brain barrier
    modifier: ABNORMAL
    term:
      id: UBERON:0000120
      label: blood brain barrier
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: CNS-Directed Autoimmune Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - bbb_disruption_antigen_release_model
    description: >-
      CNS antigen release and tolerance breakdown may generate autoreactive
      immune responses, but the route is based mainly on mechanistic models.
    evidence:
    - reference: PMID:33153097
      reference_title: "Acute Disseminated Encephalomyelitis: Current Perspectives."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        This would lead to leakage of CNS-confined auto-antigens, which would
        induce a breakdown of tolerance and emergence of autoreactive immune

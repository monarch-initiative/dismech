treatments:
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    The only treatment reported to control this disease. The brother was
    transplanted from a matched unrelated donor at five years of age after his
    autoimmunity became refractory to medical management; the sister was
    transplanted twice from her HLA-matched healthy sister, the second time with
    myeloablative conditioning after donor chimerism fell. Replacing the
    haematopoietic compartment removes the T cells carrying the two-allele
    genotype, which is why a transplant addresses the mechanism rather than the
    manifestations.
  treatment_term:
    preferred_term: allogeneic haematopoietic cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Unopposed Hyperactive ZAP70 Signalling
    description: >-
      Donor-derived T cells carry wild-type ZAP70, so the activating allele is
      no longer unopposed in the T-cell compartment.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both children required allogeneic hematopoietic cell transplantation
      (HCT), which resolved their autoimmunity.
    explanation: >-
      Both affected children were transplanted and both had their autoimmunity
      resolve, which is the outcome evidence for this treatment.
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her pemphigoid resolved after the first HCT (Fig. 1 H), but a second HCT
      with myeloablative conditioning was performed after declining donor
      chimerism
    explanation: >-
      Shows both that the skin disease responded and that durable control
      required full donor chimerism, which the first graft did not maintain.
- name: Corticosteroid and Immunosuppressive Therapy
  description: >-
    Attempted and inadequate. High-dose steroids and several immunosuppressive
    regimens failed to control the brother's autoimmunity, and that failure is
    what took him to transplantation. This matters for recognising the disease:
    bullous pemphigoid of childhood is ordinarily steroid-responsive, so a
    refractory course in an infant is itself a signal.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His autoimmune manifestations became refractory to high-dose steroids and
      multiple immunosuppressive regimens; therefore, he underwent a matched
      unrelated HCT at 5 yr of age that resolved his pretransplant autoimmunity.
    explanation: >-
      States the failure of medical immunosuppression and the decision it led
      to.
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      autoantibody-mediated bullous pemphigoid usually occurs in the elderly,
      and unlike in our patients, when found in young children it is very
      responsive to steroid treatment
    explanation: >-
      The authors' contrast with ordinary childhood bullous pemphigoid, which
      is why the refractory course is diagnostically meaningful.
animal_models:
- name: Zap70 R360P knock-in mouse
  species: Mouse
  genotype: Zap70 R360P homozygous knock-in
  background: C57BL/6
  publication: PMID:33531381
  description: >-
    CRISPR-generated knock-in carrying the activating allele in the homozygous
    state. The mice are healthy, fertile and normal-lived, and they do not
    develop autoimmunity: histology of multiple organs at 8 to 10 months was
    unremarkable and ANA and anti-dsDNA screening was negative. What they do
    show is the signalling phenotype. Thymocyte and peripheral T-cell
    development is grossly normal, but central memory CD8 cells increase, ZAP70
    Y319 phosphorylation and calcium mobilisation are enhanced, follicular
    helper T cells expand after LCMV infection, and aged animals have more IgG
    and IgG1. Crossing in the OTI transgenic TCR removes repertoire
    compensation and reveals selectively enhanced responses to weak agonist and
    self peptides.
  evidence:
  - reference: PMID:33531381
    reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with a ZAP70 R360P mutation and polyclonal TCR repertoires exhibited
      relatively normal T cell development but showed evidence of increased
      signaling.
    explanation: >-
      The model's core result: the allele changes signalling without disturbing
      development.
  modeled_mechanisms:
  - target: Unopposed Hyperactive ZAP70 Signalling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the enhanced TCR signalling and the altered sensitivity to weak
      and self ligands that the human genotype is proposed to produce.
    limitations: >-
      The genotype is not the patients'. The mice are homozygous for the
      activating allele, whereas the patients carry it opposite a hypomorphic
      allele, and in the human cell-line experiments the hypomorphic partner is
      what unmasks the activating allele. So the model tests the activating
      allele's effect rather than the two-allele configuration.
    evidence:
    - reference: PMID:33531381
      reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the R360P mutation was a weak hypermorphic allele of ZAP70 that enhanced
        TCR signaling
      explanation: >-
        Supports treating this model as informative for the enhanced-signalling
        node, which is the claim this link makes.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        R360P homozygosity in the mouse stands in for R192W/R360P compound
        heterozygosity in the patients. The claim about enhanced signalling
        holds; the claim that this particular allele pairing is required does
        not come from the model.
    readouts:
    - name: ZAP70 Y319 phosphorylation and calcium mobilisation after anti-CD3 stimulation
      target: Unopposed Hyperactive ZAP70 Signalling
      direction: INCREASED
      interpretation: >-
        Biochemical confirmation that the allele raises receptor-proximal
        signalling in primary T cells.
      evidence:
      - reference: PMID:34923645
        reference_title: "ZAP70, too little, too much can lead to autoimmunity."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Biochemical analyses confirmed that the R360P mutation was a weak
          hypermorphic allele that increased TCR signaling through weakened
          ZAP70 autoinhibition, as evidenced in enhanced ZAP70 phosphorylation
          at Y319 and faster calcium mobilization following anti-CD3
          stimulation.
        explanation: >-
          Names both measurements and their direction.
  - target: T Follicular Helper Cell Expansion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Antigen-specific follicular helper T cells expand more in knock-in mice
      than in wild-type after acute LCMV infection, with higher IgG and IgG1 in
      aged animals.
    limitations: >-
      The expansion needed an acute viral infection to appear and, on a
      polyclonal repertoire, did not produce more germinal-centre B cells or
      higher anti-LCMV titres. No autoantibody arose in these mice, so the step
      from expanded help to pathogenic autoantibody is not modelled.
    evidence:
    - reference: PMID:33531381
      reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Zap70 R360P knock-in mice showed increased expansion of antigen-specific
        follicular helper T (Tfh) cells compared to that of the WT mice
        following LCMV infection.
      explanation: >-
        Supports treating this model as informative for the follicular-helper
        node.
    readouts:
    - name: Antigen-specific Tfh percentage among GP66+ effector CD4 T cells at day 8 after LCMV
      target: T Follicular Helper Cell Expansion
      direction: INCREASED
      evidence:
      - reference: PMID:33531381
        reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          At day 8 after infection, the percentage of Tfh cells among GP66+
          antigen-specific effector cells (B220−CD4+CD44+GP66+) was
          significantly higher
        explanation: >-
          The measurement, its gating and its timing.
  - target: Loss of Peripheral T Cell Tolerance to Self Antigens
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knock-in mice do not break tolerance in any observable way: no
      spontaneous autoimmune disease on organ histology, no lymphadenopathy or
      splenomegaly, and no ANA or anti-dsDNA antibodies.
    limitations: >-
      C57BL/6 is relatively resistant to autoimmunity, and the authors attribute
      the negative result to background, modifiers or environment rather than to
      the allele being harmless. Aged knock-in mice also accumulate regulatory
      and anergic T cells, which may be actively containing the enhanced
      signalling. A negative result here therefore does not refute the human
      mechanism, but it does mean the tolerance-breaking step rests on the
      patients and on inference.
    evidence:
    - reference: PMID:33531381
      reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the homozygous R360P mice did not develop any spontaneous autoimmune
        diseases based on histological screening of multiple organs from 8–10
        month old mice (fig. S1). There was no evidence of lymphadenopathy or
        splenomegaly. Serologic screening for autoantibodies including ANA and
        dsDNA was negative.
      explanation: >-
        The negative findings, stated in full, that this link records.
prevalence:
- population: Worldwide, published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two patients, siblings, in one family. No second family has been reported:
    the 2021 mouse study and the 2022 review both describe the same kindred, and
    a PubMed search on the two alleles returns only those papers plus this
    report. There is no population estimate and no case series to pool, so this
    record states the size of the literature rather than a rate.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two siblings with unique mutations of ZAP70 who lacked clinical
      immunodeficiency, but instead had a novel constellation of early onset,
      severe autoimmune manifestations, including bullous pemphigoid.
    explanation: >-
      The only reported patients, and the basis for counting two.
differential_diagnoses:
- name: ZAP70 deficiency (combined immunodeficiency, biallelic loss of function)
  description: >-
    The same gene, and the obvious confusion. ZAP70 deficiency is a combined
    immunodeficiency from biallelic loss of function: CD8 T cells are
    effectively absent, CD4 cells are present but unresponsive to receptor
    stimulation, and patients present with life-threatening and opportunistic
    infection in infancy. Autoimmunity occurs there too, in roughly a fifth of
    patients, which is what makes the two entities easy to conflate. The
    discriminators are the infectious history, which is absent here, and the
    degree of the CD8 deficit, which is partial here and near-total there.
    Mechanistically they are opposites: too little kinase activity in one, too
    much in the other.
  disease_term:
    preferred_term: ZAP70 deficiency
    term:
      id: MONDO:0010023
      label: combined immunodeficiency due to ZAP70 deficiency
  distinguishing_features:
  - No clinical immunodeficiency and no opportunistic infection in this disease
  - CD8 reduction is partial rather than near-absent, and the CD4:CD8 ratio is less extreme
  - Autoimmunity is the presenting problem rather than a complication in a minority
  - One allele is activating, so the kinase is hyperactive rather than absent
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In marked contrast, our patients had a distinct phenotype with early
      onset, severe to life-threatening autoimmune disease and only minor
      lymphocyte abnormalities and no evidence of immune deficiency
    explanation: >-
      The authors' own statement of the contrast with loss-of-function ZAP70
      disease.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ZAP-70 deficiency (ZAP70 LOF) | ZAP70 | AR | 269840 | Low CD8 number,
      normal CD4 number but with poor function | Normal | Normal | May have
      immune dysregulation, autoimmunity
    explanation: >-
      The IUIS row for the loss-of-function disease, immediately above this
      entity's own row and carrying a different OMIM number, which is what makes
      the separation a sourced one.
- name: Homozygous ZAP70 R192W combined immunodeficiency
  description: >-
    The sharpest contrast available, because it isolates the allele rather than
    the gene. Two siblings homozygous for the same hypomorphic C-SH2 allele that
    this disease carries on one chromosome presented with combined
    immunodeficiency and CD8 lymphopenia, not with this autoimmune syndrome. It
    is direct evidence that the phenotype here requires the activating partner
    allele, and it is why the two-allele configuration, rather than either
    variant on its own, is the disease-defining fact.
  evidence:
  - reference: PMID:37313400
    reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, both R170C and R192W mutations negatively impacted the binding of
      ZAP-70 to the TCR ζ-chain, resulting in a complete absence in TCR-induced
      proliferation (this study and (42)) and all patients presented with
      immunodeficiency and autoimmunity, in the absence of activating mutations.
    explanation: >-
      Establishes what the hypomorphic allele does on its own, and notes
      explicitly that these patients had no activating mutation.
- name: STAT3 gain-of-function early-onset multisystem autoimmune disease
  description: >-
    The nearest phenotypic neighbour from another gene, and the comparison the
    primary report itself draws. Activating STAT3 variants cause early-onset
    multisystem autoimmunity, while dominant-negative variants in the same gene
    cause hyper-IgE syndrome; that mirror-image pairing is the pattern this
    ZAP70 disease follows. Distinguishing them is a sequencing question rather
    than a clinical one.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter category is typified by STAT3-activating mutations (Flanagan et
      al., 2014), which lead to early onset autoimmunity, in contrast to the
      dominant-negative defects in the same gene that cause hyper-IgE syndrome
      with boils and necrotizing pneumonias.
    explanation: >-
      The report's own analogy, which is also the reason the STAT3 entity is the
      differential a clinician would reach for.
  - reference: PMID:36228738
    reference_title: "Monogenic early-onset lymphoproliferation and autoimmunity: Natural history of STAT3 gain-of-function syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      germline signal transducer and activator of transcription (STAT) 3
      gain-of-function (GOF) mutations were first described to cause a novel
      multisystem disease of early-onset lymphoproliferation and autoimmunity
    explanation: >-
      Characterises the entity being distinguished. Its cohort of 191 patients
      is also the contrast in scale: that disease has a natural history, and
      this one has two patients.
discussions:
- discussion_id: admio2_no_patient_t_cells
  prompt: >-
    What does the two-allele genotype do to a patient's own T cells, given that
    no patient T cells were ever studied?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unopposed Hyperactive ZAP70 Signalling
  - pathophysiology#Loss of Peripheral T Cell Tolerance to Self Antigens
  rationale: >-
    Both affected children were transplanted before the gene defect was found,
    so every functional measurement in this disease comes from somewhere other
    than the patients: transfected 293T and ZAP70-null Jurkat lines, blood from
    heterozygous relatives, and a knock-in mouse carrying one of the two
    alleles. The signalling claims in this entry inherit that limitation. A
    patient-derived system carrying both alleles in trans would test the central
    assertion directly, and iPSC-derived or gene-edited primary T cells are the
    obvious route now that both variants are known.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although pre-HCT patient T cells were not available, mutation effects were
      determined using transfected cell lines and peripheral blood from carriers
      and controls.
    explanation: >-
      The authors state the gap and what they substituted for it.
  proposed_experiments:
  - experiment_id: admio2_trans_allele_pair_in_primary_t_cells
    name: Reconstruct R192W/R360P in trans in a human T-cell system and measure self-ligand responsiveness
    description: >-
      Edit both alleles into primary human T cells or an iPSC-derived T-cell
      system to produce the compound heterozygous state, alongside each allele
      singly, each allele opposite wild type, and homozygous controls. Measure
      receptor-proximal phosphorylation, calcium flux, CD69 induction, and the
      response to a graded panel of agonist and self-peptide ligands. The
      prediction under this entry's mechanism is that only the R192W/R360P pair
      shows enhanced responsiveness to weak ligands, and that adding a wild-type
      allele abolishes it.
    perturbations:
    - name: ZAP70 R192W and R360P introduced in trans
      target: pathophysiology#Unopposed Hyperactive ZAP70 Signalling
      gene:
        preferred_term: ZAP70
        term:
          id: hgnc:12858
          label: ZAP70
    readouts:
    - name: CD69 induction and receptor-proximal phosphorylation across a graded ligand panel
      target: pathophysiology#Unopposed Hyperactive ZAP70 Signalling
      direction: INCREASED
      interpretation: >-
        Enhanced responses confined to the compound heterozygous configuration
        would support the unmasking model in human cells.
    would_support:
    - pathophysiology#Unopposed Hyperactive ZAP70 Signalling
    decision_criterion: >-
      Enhanced weak-ligand responses in the compound heterozygous state but not
      in either allele paired with wild type.
- discussion_id: admio2_central_versus_peripheral_tolerance
  prompt: >-
    Does this disease break central tolerance as well as peripheral tolerance,
    and if so which allele does it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hypomorphic ZAP70 SH2 Docking Allele
  - pathophysiology#Loss of Peripheral T Cell Tolerance to Self Antigens
  rationale: >-
    This entry's chain runs through peripheral tolerance, because that is what
    the knock-in mouse measures and what the activating allele is shown to do.
    The thymic arm is unresolved, and the literature points in two directions
    at once. The primary report proposes that altered signalling lets
    autoreactive thymocytes escape deletion, which is the mechanism established
    for hypomorphic ZAP70 alleles in mice: the SKG strain's hypomorph raises
    selection thresholds so that self-reactive thymocytes are positively rather
    than negatively selected, and attenuated signalling also hampers regulatory
    T-cell generation. But the same group's review states that a hyperactive
    kinase, which is what this genotype produces in the periphery, enhances
    thymic negative selection rather than weakening it. Which effect dominates
    in a thymus expressing one allele of each class is not known, and the
    patients' thymic output was never studied: both were transplanted before
    the genotype was found, and their newborn excision-circle screens were
    normal. The question matters for whether this disease belongs on the
    graded-signal-strength spectrum that connects ZAP70 immunodeficiency to
    ZAP70 autoimmunity, or beside it.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In mice, defects in both central and peripheral tolerance have been
      associated with hypomorphic Zap-70 defects and autoimmune features
    explanation: >-
      The primary report raises the central-tolerance possibility by analogy to
      the mouse hypomorphs, without testing it in these patients.
    directness: INDIRECT
  - reference: PMID:37394552
    reference_title: "[Gene-microbiota interactions for the development of systemic autoimmune diseases]."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Defective TCR signaling by ZAP70 mutation alters thymic selection
      thresholds and allows the positive selection of otherwise negatively
      selected self-reactive T cells.
    explanation: >-
      The central-tolerance mechanism as established for a hypomorphic Zap70
      allele in the SKG mouse. A different allele and a different disease
      (arthritis or lupus-like disease depending on background), so it bears on
      this question by analogy.
    directness: INDIRECT
  - reference: PMID:34923645
    reference_title: "ZAP70, too little, too much can lead to autoimmunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hypoactive ZAP70 function compromises key developmental checkpoints
      required to establish central tolerance, allowing thymocytes with
      potentially self-reactive TCRs a greater chance to escape negative
      selection.
    explanation: >-
      States the hypoactive route to central-tolerance failure, which is the
      arm this genotype's hypomorphic allele could contribute and which the
      same review contrasts with the hyperactive case.
  - reference: PMID:41770842
    reference_title: "T Cell Receptor Signaling and Immune Tolerance: From Autoimmunity to Cancer Immunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the effects of graded TCR signal reduction manifest as a disease spectrum
      encompassing T cell immune deficiency, latent autoimmunity, and overt
      autoimmune disease
    explanation: >-
      The spectrum this question places the disease against. Note the review
      frames the spectrum in terms of signal reduction, whereas this genotype
      includes an allele that increases signalling, which is part of why its
      position on that spectrum is unsettled.
- discussion_id: admio2_mouse_tolerance_mismatch
  prompt: >-
    Why do Zap70 R360P mice not develop autoimmunity, and does that limit the
    inference from the mouse to these patients?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Loss of Peripheral T Cell Tolerance to Self Antigens
  rationale: >-
    The knock-in mouse reproduces the signalling phenotype and the follicular
    helper expansion but not the disease: no spontaneous autoimmunity, no
    autoantibodies, no organ pathology. The authors attribute this to the
    autoimmunity-resistant C57BL/6 background, to unknown modifiers, or to
    environment, and note that aged knock-in mice accumulate regulatory and
    anergic T cells, which may be actively holding the enhanced signalling in
    check. The mouse is also homozygous for the activating allele rather than
    compound heterozygous, so it does not model the configuration the human
    disease requires. Both facts matter for how far the tolerance-breaking step
    can be said to be demonstrated rather than inferred.
  evidence:
  - reference: PMID:33531381
    reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to humans, R360P mice did not spontaneously develop a
      detectable autoimmune phenotype, which may be due to their genetic
      background.
    explanation: >-
      States the mismatch and the authors' leading explanation for it.
  - reference: PMID:34923645
    reference_title: "ZAP70, too little, too much can lead to autoimmunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is likely that differences in genetic background, the presence of other
      genetic modifiers, or unique environmental factors contribute to this
      discrepancy.
    explanation: >-
      The same group's later statement of the candidate explanations, which is
      what makes this an open question rather than a settled negative.
notes: >-
  This is a separate entry rather than a subtype of ZAP70 deficiency, and the
  separation is sourced rather than a curator's preference. IUIS lists the two
  as distinct rows with distinct OMIM numbers, MONDO gives this concept its own
  identifier under the infantile-onset multisystem autoimmune disease parent,
  and the mechanisms run in opposite directions: an absent or non-docking
  kinase in one, a partially constitutively active kinase in the other. The
  ZAP70 deficiency entry already holds this entity in its
  differential_diagnoses for the same reason, and that entry's notes record the
  decision not to fold it in as a subtype. Nothing in this entry's
  pathophysiology chain would describe the loss-of-function disease.

  There is no GeneReviews chapter for this entity. The chapter tagged in
  references is the one for ZAP70 deficiency, which defines its subject as loss
  of ZAP70 kinase activity, so it is the gene's chapter and not this disease's
  clinical baseline; it is carried here for orientation and for its
  transplantation management, and none of this entry's claims rest on it. The
  offline Bookshelf check finds no chapter naming this disease or any of its
  synonyms.

  No phenotype carries a frequency. The disease is known from two siblings in
  one family, so a proportion would be a statement about a denominator of two,
  and several features (the factor VIII inhibitor, the nephrotic syndrome, the
  minimal change histology) were reported in only one of the two children. The
  per-child distribution is in each phenotype's description instead.

  Autoimmune hypothyroidism is recorded as a phenotype but is the weakest
  entry in that list, because the source reports it in the sister's
  post-transplant course, alongside graft rejection and before her second
  transplant. Whether it belongs to the underlying disease or to the transplant
  course is not resolved by the source, and the description says so rather than
  leaving the reader to assume the former.

  Everything functional in this entry is at one remove from the patients.
  Neither child's T cells were ever studied, because both were transplanted
  before the genotype was known. The allele-level work is in transfected 293T
  cells and ZAP70-null Jurkat lines, the primary-cell signalling comparison is
  between heterozygous relatives, and the in vivo work is a mouse homozygous
  for one of the two alleles that does not develop the disease. The discussions
  block records both gaps; the evidence items grade accordingly, and the edges
  that depend on the authors' inference from mouse to patient carry
  directness: INDIRECT.

  No datasets block. ZAP70 is a long-standing prognostic marker in chronic
  lymphocytic leukaemia, so a gene-keyed search of the expression repositories
  returns CLL cohorts that resolve perfectly and are about a different disease:
  the named-entity-confusion trap the dataset guidance describes, reached
  through gene search. With two patients, no cohort dataset for this disease
  exists to find.

  No environmental block. Nothing in the literature proposes an exposure
  trigger for these children, although the mouse work notes that the
  activating allele's effect on weak-ligand responses was clearest in a
  permissive cytokine environment and after viral infection, which is recorded
  in the pathophysiology descriptions rather than as an environmental claim.
  The SKG hypomorphic mouse does have a documented gene-environment axis, in
  which endogenous mouse mammary tumour virus superantigens drive the
  autoreactive T cells and antiretroviral treatment curtails the arthritis
  (PMID:39589811), but that is a different allele, a different disease and a
  retrovirus with no human counterpart here, so asserting the analogue would be
  an exposure claim no source makes about these patients.

  Two annotations the deep-research report proposed are deliberately absent. It
  lists a decreased specific pneumococcal antibody response, which the primary
  report contradicts: post-vaccine titres to type 14 pneumococcus and tetanus
  were protective in the boy, and that sentence is quoted under the low IgG
  phenotype. It also offers HP:0031540 for the skin disease, whose canonical
  label is Linear IgG deposits along the epidermal basement membrane zone. That
  is a true finding in this patient but a different statement from the
  diagnosis, so the phenotype is bound to the blistering term and the
  immunofluorescence finding is described under the skin biopsy instead.

pathophysiology:
- name: Hypomorphic ZAP70 SH2 Docking Allele
  description: >-
    p.R192W substitutes a bulky tryptophan into the phosphotyrosine-binding
    pocket of the C-terminal SH2 domain. The mutant kinase associates poorly
    with the phosphorylated TCR zeta chain and is itself poorly phosphorylated
    there. Homozygous R192W has since been reported in siblings with combined
    immunodeficiency, so the allele is pathogenic on its own; in this genotype
    its contribution is different, because it cannot supply the restraint on
    the partner allele that a wild-type copy would.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: ZAP70
      term:
        id: hgnc:12858
        label: ZAP70
    allele_type: missense, c.574C>T p.R192W
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Maternally inherited hypomorphic allele, in trans with the activating
      p.R360P allele.

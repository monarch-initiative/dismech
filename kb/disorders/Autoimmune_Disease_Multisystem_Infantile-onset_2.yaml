  evidence:
  - reference: PMID:33531381
    reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, the R360P mutation resulted in enhanced follicular helper T
      cell expansion after LCMV infection.
    explanation: >-
      The knock-in result this node rests on, measured on antigen-specific
      effector cells after infection rather than at baseline.
  - reference: PMID:33531381
    reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found that there were substantial increases in IgG and IgG1 amounts in
      10 month old
    explanation: >-
      The humoral consequence in aged knock-in mice, which the authors read as a
      long-term effect of the expanded follicular helper response.
  downstream:
  - target: Autoantibody Production Against Tissue and Plasma Protein Antigens
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34923645
      reference_title: "ZAP70, too little, too much can lead to autoimmunity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thus, as a consequence of enhanced TCR signaling, it is likely that the
        R360P mutation led to excessive auto‐reactive T helper cell activity for
        B cells.
      explanation: >-
        The authors' statement of this edge, hedged ("it is likely") because it
        rests on the mouse data rather than on patient material.
      directness: INDIRECT
- name: Autoantibody Production Against Tissue and Plasma Protein Antigens
  description: >-
    The diseases that defined this syndrome are antibody-defined: bullous
    pemphigoid with linear basement-membrane IgG at a titre above 1:160, and an
    inhibitory autoantibody to coagulation factor VIII causing bleeding. Both
    point at autoreactive B-cell help as the effector arm rather than at direct
    T-cell cytotoxicity.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: B cell tolerance induction
    modifier: DECREASED

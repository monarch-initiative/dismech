      clefting, infiltration with eosinophils and neutrophils, and linear
      basement membrane and intercellular deposition of IgG at a titer greater
      than 1:160
    explanation: >-
      Histology and immunofluorescence establishing the diagnosis and the
      subepidermal level of the split that the bound HPO term names.
  - reference: PMID:26783323

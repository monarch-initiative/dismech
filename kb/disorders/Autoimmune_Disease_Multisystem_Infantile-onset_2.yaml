name: Autoimmune Disease, Multisystem, Infantile-Onset, 2
creation_date: "2026-10-13T09:00:00Z"
category: Mendelian
synonyms:
- ADMIO2
- autoimmune disease, multisystem, infantile-onset, type 2
- ZAP70 autoimmune disease, multisystem, infantile-onset
- ZAP-70 combined hypomorphic and activating mutations
description: >-
  An early-onset, antibody-dominated multisystem autoimmune disease caused by
  compound heterozygosity in trans for two functionally opposite ZAP70 missense
  alleles. One allele (p.R192W, in the C-terminal SH2 domain) docks poorly onto
  the phosphorylated T-cell receptor zeta chain and is hypomorphic. The other
  (p.R360P, in the kinase N-lobe) weakens the autoinhibited conformation of the
  kinase, leaving it partially constitutively active. A wild-type allele masks
  the activating one, so single-allele carriers are healthy; paired with the
  hypomorph the activating allele sets the signalling threshold, and T cells
  respond to weak and self ligands that normal T cells ignore.

  The clinical picture is the inverse of ZAP70 deficiency. In the only reported
  family, two siblings of unrelated healthy parents had no infectious
  susceptibility and only minor lymphocyte abnormalities, yet developed severe
  autoimmunity within the first year of life: generalized bullous pemphigoid,
  inflammatory colitis, proteinuria that in one child progressed to nephrotic
  syndrome with minimal-change histology, and an acquired factor VIII inhibitor
  with bleeding. The disease resisted corticosteroids and other
  immunosuppression; allogeneic haematopoietic cell transplantation resolved it
  in both children.

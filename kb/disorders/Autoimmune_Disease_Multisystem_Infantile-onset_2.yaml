  - reference: PMID:37313400
    reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a homozygous ZAP-70 R192W variant was identified in 2 siblings with
      combined immunodeficiency and CD8 lymphopenia, confirming the
      pathogenicity of this mutation.
    explanation: >-
      Shows that two copies of this allele produce immunodeficiency rather than
      this autoimmune syndrome, which is why the partner allele is needed to
      explain the phenotype here.
  downstream:
  - target: Unopposed Hyperactive ZAP70 Signalling
    causal_link_type: DIRECT
    description: >-
      The hypomorph cannot damp the activating allele the way a wild-type copy
      does, so the hyperactive signal becomes the cell's operating state.
    evidence:
    - reference: PMID:26783323
      reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Thus, the hyperactive R360P phenotype was masked by WT ZAP-70 and
        revealed only in the presence of the hypoactive R192W allele.
      explanation: >-
        Titrating wild-type or R192W against R360P in ZAP-70-deficient Jurkat
        cells shows that it is the hypomorphic partner that lets the activating
        allele's effect emerge.
- name: Activating ZAP70 Autoinhibition-Weakening Allele
  description: >-
    p.R360P sits in a loop of the kinase N-lobe beside Tyr315 and Tyr319, the
    interdomain B residues that hold the kinase in its autoinhibited
    conformation. The substitution destabilises that arrangement, leaving the
    kinase partially constitutively active: in T-cell lines it raises
    TCR-induced phosphorylation of ZAP-70 itself and of its substrates LAT and
    SLP-76, raises Erk phosphorylation, and raises basal CD69. The effect is
    weak, which is consistent with a single copy beside wild-type ZAP70 being
    clinically silent.
  biological_scale: MOLECULAR
  genetic_context:

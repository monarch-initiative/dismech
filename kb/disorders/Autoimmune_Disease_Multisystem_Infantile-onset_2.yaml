    The defining feature, and the reason the syndrome was recognised as novel.
    Both siblings had generalised blistering: in the brother from 20 months,
    over the whole body and the oral mucosa, with a biopsy showing subepidermal
    clefting, eosinophil and neutrophil infiltration and linear
    basement-membrane IgG above a 1:160 titre; in the sister from one month of
    age. Bullous pemphigoid in young children is normally steroid-responsive,
    which this was not.
  phenotype_term:

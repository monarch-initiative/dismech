    reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results support the notion that the R360P mutation directly weakens
      ZAP70 autoinhibition, thereby rendering ZAP70 partially constitutively
      active.
    explanation: >-
      With the SH2 domains and interdomain A deleted, R360P phosphorylates LAT
      spontaneously, which is direct evidence that the substitution weakens
      autoinhibition rather than acting indirectly.
  downstream:
  - target: Unopposed Hyperactive ZAP70 Signalling
    causal_link_type: DIRECT
- name: Unopposed Hyperactive ZAP70 Signalling
  description: >-
    With no wild-type copy to oppose it, the activating allele sets the
    signalling threshold of the patients' T cells. TCR signalling is enhanced
    and, critically, mature T cells respond to weak agonist and self
    peptide-MHC complexes that wild-type T cells disregard. Both affected
    children were transplanted before the genotype was known, so no patient T
    cells were ever studied; the evidence is from carrier blood cells,
    reconstituted T-cell lines, and a knock-in mouse.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maternal cells (WT/R192W) showed decreased phosphorylation of the MAP
      kinases Erk1 and Erk2 in an anti-CD3 dose dependent manner, whereas cells
      from the father and healthy sister (WT/R360P) tended to have higher Erk
      phosphorylation.
    explanation: >-
      Primary human carrier cells show the two alleles pulling TCR signalling in
      opposite directions. This is the closest the published work comes to
      patient cells, which were unavailable after transplantation.
    directness: INDIRECT
  - reference: PMID:33531381
    reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To eliminate the possibility of a TCR repertoire shift, the OTI transgenic
      TCR was introduced into R360P mice, which resulted in enhanced T cell
      responses to weaker stimuli, including weak agonists and a self-peptide.
    explanation: >-
      On a fixed TCR background, where repertoire compensation is excluded, the
      activating allele selectively increases responses to weak and self
      ligands.
  downstream:
  - target: Loss of Peripheral T Cell Tolerance to Self Antigens
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33531381
      reference_title: "A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses to weak and self-ligands."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These observations suggest that disruption of ZAP70 autoinhibition by
        the R360P mutation enables increased mature T cell sensitivity to
        self-antigens that would normally be ignored by wild-type T cells, a
        mechanism that may contribute to the break of tolerance in human
        patients with R360P mutation.
      explanation: >-
        The authors' own inference from the mouse to the patients. Worded as a
        proposal, and the mice do not develop autoimmunity, so this edge is an
        inference step rather than a demonstrated human mechanism.
      directness: INDIRECT
- name: Loss of Peripheral T Cell Tolerance to Self Antigens
  description: >-
    Mature T cells that react to self peptide-MHC are normally held below the
    activation threshold. When the threshold is lowered, such cells can be
    driven by self ligands in a permissive cytokine environment, which the
    authors propose as the route from the kinase defect to organ-directed
    autoimmunity. Unlike the hypomorphic ZAP70 alleles studied in mice, where
    forbidden clones escape thymic deletion, the activating allele acts mainly
    on mature cells: thymic negative selection is if anything strengthened, and
    knock-in mice accumulate regulatory and anergic T cells rather than
    autoimmunity.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: peripheral tolerance induction

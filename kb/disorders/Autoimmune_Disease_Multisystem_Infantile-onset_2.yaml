    classification_value: combined immunodeficiency
    notes: >-
      IUIS places this entity in Table 1 (immunodeficiencies affecting cellular
      and humoral immunity), in the combined immunodeficiency subtable, as a row
      distinct from ZAP-70 deficiency (ZAP70 LOF). It carries its own OMIM
      number (617006) and an AR (LOF/GOF) inheritance annotation, and the
      clinical column records severe autoimmunity rather than infection.
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ZAP-70 combined hypomorphic and activating mutations | ZAP70 | AR
        (LOF/GOF) | 617006 | Decreased CD8, normal or decreased CD4 cells |
        Normal or decreased | Normal IgA, low IgM, low/normal IgG; protective Ab
        responses to vaccines | Severe autoimmunity (bullous pemphigoid,
        inflammatory colitis)
      explanation: >-
        The IUIS 2024 row for this entity, recording the two-allele inheritance
        annotation, the OMIM number, the modest lymphocyte and immunoglobulin
        findings, and the autoimmune-dominant presentation.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease requires one hypomorphic and one activating ZAP70 allele in trans.
    The affected siblings inherited p.R192W from their mother and p.R360P from
    their father; the parents and an unaffected sister carrying p.R360P alone
    are well. The pattern is recessive in that each allele is silent beside a
    wild-type allele, but it is not the biallelic loss of function of ZAP70
    deficiency: homozygosity for the hypomorphic allele alone has since been
    reported to cause combined immunodeficiency instead.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected children were compound heterozygous for ZAP70 c.574C>T,
      p.R192W, in exon 5; and c.1079G>C, p.R360P, in exon 9
    explanation: >-
      Records the compound heterozygous genotype shared by both affected
      children.
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mother carried the R192W allele, whereas the father and unaffected
      sister carried the R360P allele.
    explanation: >-
      Establishes that the two alleles are in trans and that one copy of either
      is clinically silent.
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ZAP-70 combined hypomorphic and activating mutations | ZAP70 | AR (LOF/GOF) | 617006"
    explanation: >-
      IUIS annotates the inheritance as autosomal recessive with one
      loss-of-function and one gain-of-function allele.

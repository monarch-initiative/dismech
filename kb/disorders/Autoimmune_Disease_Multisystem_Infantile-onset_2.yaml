      potentially autoreactive B cells, thereby leading to production of
      autoantibodies to antigens such as skin proteins (bullous pemphigoid) and
      clotting factors (autoimmune hemophilia).
    explanation: >-
      The proposed route from the signalling defect to the two
      antibody-mediated diseases in these children. Stated conditionally by the
      authors.
    directness: INDIRECT
  downstream:
  - target: Bullous pemphigoid
    causal_link_type: DIRECT
  - target: Anti-factor VIII antibody positivity
    causal_link_type: DIRECT
phenotypes:
- category: Clinical
  name: Bullous pemphigoid

    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altered signaling could allow autoreactive T cells to escape thymic

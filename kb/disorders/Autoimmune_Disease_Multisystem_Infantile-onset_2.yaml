  description: >-
    The first-line immunological test, and the one that places the disease
    beside ZAP70 deficiency rather than with the other causes of infantile
    autoimmunity. It shows reduced CD8 T cells with a raised CD4:CD8 ratio, and
    in the sister an increase in CD19 B cells. The deficit is partial, so the
    panel does not read as a SCID.

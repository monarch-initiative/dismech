      and reduced CD8 T cells in both affected children, resulting in an
      elevated CD4/CD8 ratio
    explanation: >-
      The subset pattern this test is being cited for.
  notes: >-
    Newborn T-cell receptor excision circle screening was normal in both
    children, so a normal TREC result does not exclude this disease. That is
    the same caveat that applies to ZAP70 deficiency, where continuing CD4
    thymic output can keep the screen normal.
- name: Molecular genetic testing (exome sequencing)
  description: >-
    The definitive test, and how the disease was found. Exome sequencing of five
    family members identified the compound heterozygous ZAP70 genotype and the
    carrier state of the healthy relatives. Both alleles were private to the
    family, so sequencing alone leaves two variants of uncertain significance:
    the functional work on zeta-chain binding and on autoinhibition is what
    makes the result interpretable.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing performed on five family members revealed the
      affected siblings to be compound heterozygous for two unique missense
      mutations in the 70-kD T cell receptor ζ-chain associated protein (ZAP-70).
    explanation: >-
      Names the test, the family members sequenced and the result.

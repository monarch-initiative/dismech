  evidence:
  - reference: PMID:34923645
    reference_title: "ZAP70, too little, too much can lead to autoimmunity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hyperactive ZAP70 enhances thymic negative selection but some thymocytes
      will, nonetheless, escape negative selection and have greater sensitivity
      to weak and self-ligands.
    explanation: >-
      States the mechanism this node asserts, and distinguishes it from the
      central-tolerance failure that hypoactive ZAP70 causes.
  downstream:
  - target: T Follicular Helper Cell Expansion
    causal_link_type: DIRECT
  - target: Colitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The gut disease in both children was an inflammatory colitis diagnosed
      endoscopically rather than an autoantibody-defined lesion, so it is drawn
      from the loss of T-cell tolerance and not from the antibody arm. No
      source identifies the effector population in the patients' bowel.
  - target: Nephrotic syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Renal involvement is reported in both siblings, and in the brother's
      biopsy as widespread podocyte foot-process effacement with only mild IgG
      deposition. The immune route to the podocyte is not established in these
      patients.
- name: T Follicular Helper Cell Expansion
  description: >-
    Help to B cells is the step that connects a T-cell signalling defect to an
    antibody-mediated disease, and it is the part of the chain the mouse model
    supports most directly. After acute LCMV infection, R360P knock-in mice
    expand antigen-specific follicular helper T cells more than wild-type mice,
    and aged knock-in mice carry higher total IgG and IgG1. ZAP-70 is expressed
    predominantly in T and NK cells, so excess T-cell help, rather than an
    intrinsic B-cell defect, is the proposed explanation for why these patients
    make pathogenic autoantibodies.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  biological_processes:
  - preferred_term: T follicular helper cell differentiation

genetic:
- name: ZAP70 (hypomorphic plus activating alleles in trans)
  notes: >-
    ZAP70 at 2q11.2 encodes the 70 kDa zeta-chain-associated protein kinase, a
    Syk-family cytoplasmic tyrosine kinase coupling the engaged T-cell receptor
    to LAT and SLP-76. What is distinctive about this disease is not a new
    region of the gene but the pairing: a docking-defective C-SH2 allele with an
    autoinhibition-weakening kinase-domain allele. Both residues were novel when
    reported and neither lies near the previously reported loss-of-function
    alleles. Note the repository's lowercase HGNC prefix convention, hgnc:12858.

    No gene_disease_validity assertion is recorded. ClinGen's SCID-CID Gene
    Curation Expert Panel classifies ZAP70 as Definitive, but for
    MONDO:0010023, the loss-of-function combined immunodeficiency, which is a
    different gene-disease pair from this one. Copying that tier here would
    assert a classification nobody has made for this entity.
  gene_term:
    preferred_term: ZAP70
    term:
      id: hgnc:12858
      label: ZAP70
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:41608114
      reference_title: "Human inborn errors of immunity: 2024 update on the classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ZAP-70 combined hypomorphic and activating mutations | ZAP70 | AR (LOF/GOF) | 617006"
      explanation: >-
        The gene-level inheritance annotation for this entity: recessive, with
        one allele of each functional class.
  variants:
  - name: ZAP70 c.574C>T p.R192W
    description: >-
      C-terminal SH2 domain allele, inherited from the mother. The tryptophan
      occupies the phosphotyrosine-binding pocket formed by arginines 170, 190
      and 192, so the kinase docks poorly on the doubly phosphorylated zeta
      chain. Reported at an allele frequency of 0.00003 in ExAC at the time of
      publication.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: binding to the phosphorylated T-cell receptor zeta chain
      description: >-
        Reduced association with, and reduced phosphorylation on, the zeta
        chain in transfected cells.
      type: hypomorphic
    evidence:
    - reference: PMID:26783323
      reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The replacement of arginine with a bulky tryptophan residue in the
        phosphotyrosine-binding pocket of the ZAP-70 C-terminal SH2 domain
        (C-SH2; R192W mutation) was predicted to diminish ZAP-70 binding to the
        ζ-chain
      explanation: >-
        The structural prediction for this substitution, which the
        immunoprecipitation experiments in the same paper then confirmed.
    - reference: PMID:37313400
      reference_title: "Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal SH2 domain."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Structural modeling of this region revealed the critical nature of the
        arginines at positions 170 and 192, in concert with R190, forming a
        binding pocket for the phosphorylated TCR-zeta chain.
      explanation: >-
        Independent structural account of why position 192 matters, from the
        series that later found this allele in the homozygous state.
  - name: ZAP70 c.1079G>C p.R360P
    description: >-
      Kinase-domain N-lobe allele, inherited from the father, lying in a loop
      close to Tyr315 and Tyr319. It weakens the autoinhibited conformation,
      producing a weakly hyperactive kinase. Neighbouring substitutions in the
      same region (D327P, K362E) are more strongly activating, which is the
      basis for calling this one weak.
    clinical_significance: PATHOGENIC
    functional_effects:
    - function: T-cell receptor-proximal tyrosine kinase activity
      description: >-
        Partial constitutive activation through loss of autoinhibition, with
        increased phosphorylation of ZAP-70 Y319 and Y493 and of LAT and SLP-76
        on receptor engagement.
      type: hypermorphic
    evidence:
    - reference: PMID:26783323
      reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In contrast, R360P lies in a loop of the N-lobe of the kinase domain in
        proximity to Y319, a key residue for autoinhibition of ZAP-70
      explanation: >-
        Locates the substitution with respect to the autoinhibitory site.
    - reference: PMID:34923645
      reference_title: "ZAP70, too little, too much can lead to autoimmunity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the R360P mutation appears to relieve the interdomain B and kinase
        domain interaction
      explanation: >-
        The structural interpretation of how this allele breaks autoinhibition,
        and how that differs from the W131A hypermorph.
  evidence:
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of whole-exome sequencing (WES) revealed no consanguinity and only
      one gene, ZAP70, with nonsynonymous coding variants potentially causing
      homozygous recessive immunological disease.
    explanation: >-
      The gene-finding result that assigns the syndrome to ZAP70.
  - reference: PMID:26783323
    reference_title: "A novel human autoimmune syndrome caused by combined hypomorphic and activating mutations in ZAP-70."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither mutation had been reported previously, nor were they near

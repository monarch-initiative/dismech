name: Spinocerebellar Ataxia Type 15/16
creation_date: "2026-07-24T00:00:00Z"
updated_date: "2026-07-24T00:00:00Z"
category: Mendelian
synonyms:
- SCA15
- SCA16
- spinocerebellar ataxia type 15
- spinocerebellar ataxia type 16
- ITPR1-related spinocerebellar ataxia
description: >-
  Spinocerebellar ataxia type 15/16 (SCA15/16) is a rare autosomal dominant,
  slowly progressive, predominantly pure cerebellar ataxia caused by
  heterozygous loss-of-function variants in ITPR1, which encodes the inositol
  1,4,5-trisphosphate receptor type 1 (IP3R1), the principal intracellular
  calcium-release channel of the cerebellar Purkinje cell endoplasmic reticulum.
  Most cases arise from heterozygous partial or whole-gene deletions of ITPR1
  producing haploinsufficiency; heterozygous missense variants have also been
  reported. SCA15 and SCA16 were originally described as separate loci but were
  subsequently shown to be the same disorder caused by ITPR1. The phenotype is
  dominated by gait and limb ataxia, dysarthria, gaze-evoked nystagmus, and
  postural/action tremor, with onset most often in adulthood and very slow
  progression over decades; some individuals remain ambulant for life. Brain
  MRI shows selective cerebellar atrophy, most pronounced in the superior
  vermis. No disease-modifying therapy exists; management is symptomatic and
  supportive.

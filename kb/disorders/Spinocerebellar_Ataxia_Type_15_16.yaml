  notes: >-
    Most SCA15/16 cases are caused by heterozygous partial or whole-gene
    deletions of ITPR1 producing haploinsufficiency; heterozygous missense
    variants have also been reported. ITPR1 is allelic with SCA29 (congenital
    nonprogressive ataxia) and Gillespie syndrome.

diagnosis:
- name: Brain MRI
  description: >-
    Brain MRI demonstrates selective cerebellar atrophy, most pronounced in the
    superior vermis, with relative sparing of the brainstem and cerebrum,
    supporting a pure cerebellar syndrome.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: MAXO:0000552
      label: magnetic resonance imaging
- name: Molecular Genetic Testing
  description: >-
    Diagnosis is confirmed by molecular genetic testing detecting a heterozygous
    ITPR1 deletion (by copy-number analysis such as MLPA or array CGH) or a
    pathogenic ITPR1 sequence variant. Standard exome sequencing may miss
    single-exon or whole-gene deletions, so copy-number analysis is important.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: MAXO:0000533
      label: molecular genetic testing
treatments:
- name: Supportive and Symptomatic Care
  description: >-
    No disease-modifying therapy exists for SCA15/16. Management is supportive:
    physiotherapy, occupational therapy, and speech therapy for gait, balance,
    and dysarthria, with mobility aids as ataxia progresses.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000059
      label: therapeutic procedure

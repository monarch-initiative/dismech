        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:17932120
      reference_title: Heterozygous deletion of ITPR1, but not SUMF1, in spinocerebellar ataxia type 16.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Our data provide evidence that haploinsufficiency of ITPR1 alone causes SCA16 and SCA15.
      explanation: Demonstrates that heterozygous deletion causing ITPR1 haploinsufficiency is sufficient to cause autosomal dominant SCA15/16.
  notes: Most SCA15/16 cases are caused by heterozygous partial or whole-gene deletions of ITPR1 producing haploinsufficiency; reported deletions have involved ITPR1 exons 1-10, 1-40, 1-41, 1-44, 1-48, and the complete gene, sometimes extending into adjacent SUMF1 sequence. Heterozygous missense variants (e.g., p.Pro1059Leu) have also been reported. ITPR1 is allelic with SCA29 (congenital nonprogressive ataxia) and Gillespie syndrome.
  gene_term:
    preferred_term: ITPR1
    term:
      id: hgnc:6180
      label: ITPR1
  evidence:
  - reference: PMID:17590087
    reference_title: Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SCA15, an adult-onset autosomal dominant progressive ataxia is linked to this locus
    explanation: Establishes SCA15 as an adult-onset autosomal dominant progressive ataxia mapping to the ITPR1 locus.
  - reference: PMID:38058854
    reference_title: Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch Patients With Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 338 patients with cerebellar ataxia, we identified putative clinically relevant CNV deletions in 3 patients
    explanation: Recent diagnostic cohort demonstrating that heterozygous ITPR1 copy-number deletions remain a recurrent, clinically relevant cause of dominant ataxia.
diagnosis:
- name: Brain MRI
  description: Brain MRI demonstrates selective cerebellar atrophy, most pronounced in the vermis, with relative sparing of the brainstem and cerebrum, supporting a predominantly pure cerebellar syndrome. MRI supports but does not by itself establish the diagnosis.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: Positive
  results: Selective cerebellar atrophy predominantly affecting the anterior and dorsal cerebellar vermis with sparing of the brainstem.
  evidence:
  - reference: PMID:21827915
    reference_title: Spinocerebellar ataxia type 15.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neuroradiology shows cerebellar atrophy, particularly affecting the anterior and dorsal vermis.
    explanation: Establishes the characteristic brain MRI pattern of vermis-predominant cerebellar atrophy in SCA15/16.
- name: Molecular Genetic Testing
  description: Diagnosis is confirmed by molecular genetic testing detecting a heterozygous ITPR1 pathogenic sequence variant or, importantly, a copy-number deletion. Because single-exon and whole-gene deletions can be missed by sequence-only workflows, copy-number analysis (MLPA, dosage analysis, SNP array, or read-depth CNV calling) should accompany sequencing for ITPR1.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  presence: Positive
  results: Heterozygous multi-exon or whole-gene deletion or pathogenic sequence variant in ITPR1.
  evidence:
  - reference: PMID:38058854
    reference_title: Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch Patients With Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we suggest adding CNV analysis alongside SNV analysis to SCA gene diagnostics using next-generation sequencing approaches, at least for ITPR1
    explanation: Supports adding copy-number variant analysis to ITPR1 diagnostics because SCA15/16 is frequently caused by deletions that sequence-only pipelines miss.
treatments:
- name: Supportive and Symptomatic Care
  description: 'No disease-modifying therapy exists for SCA15/16. Management is supportive: genetic counseling, occupational therapy, speech therapy, mobility aids, fall prevention, and individualized symptomatic treatment of tremor and other complications as ataxia progresses.'
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Purkinje Cell Dysfunction and Degeneration
    treatment_effect: MODULATES
    description: Multidisciplinary supportive, occupational, and speech therapy mitigate functional impairments resulting from Purkinje cell dysfunction and cerebellar degeneration.
    evidence:
    - reference: PMID:35081319
      reference_title: Current and emerging treatment modalities for spinocerebellar ataxias.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Occupational and physical therapy are of utmost importance in SCA patients to treat debilitating symptoms and increase quality of life; speech therapy is also critical, as dysphagia may lead to aspiration.
      explanation: Supports multidisciplinary supportive and rehabilitative care to manage symptoms of cerebellar degeneration in SCA.
  evidence:
  - reference: PMID:35081319
    reference_title: Current and emerging treatment modalities for spinocerebellar ataxias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Occupational and physical therapy are of utmost importance in SCA patients to treat debilitating symptoms and increase quality of life; speech therapy is also critical, as dysphagia may lead to aspiration.
    explanation: Establishes multidisciplinary supportive, occupational, and speech therapy as core clinical management for spinocerebellar ataxias.
  action_category: THERAPEUTIC
- name: Physiotherapy and Rehabilitation
  description: No SCA15/16-specific interventional trial exists, but rehabilitation is the mainstay of care for degenerative cerebellar ataxia. Meta-analysis of randomized trials in degenerative cerebellar ataxia found that physiotherapy modestly improves ataxia severity as measured by the Scale for the Assessment and Rating of Ataxia (SARA), supporting balance, coordination, and gait training in SCA15/16.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Purkinje Cell Dysfunction and Degeneration
    treatment_effect: MODULATES
    description: Coordinative, balance, and gait training promote motor compensation for impaired Purkinje cell and cerebellar cortical output.
    evidence:
    - reference: PMID:39866519
      reference_title: 'Effects of physiotherapy on degenerative cerebellar ataxia: a systematic review and meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'physiotherapy significantly reduced SARA scores (MD = -1.41, [95% CI: -2.16, -0.66])'
      explanation: Demonstrates that structured physiotherapy reduces ataxia severity (SARA score) in degenerative cerebellar ataxia.
  evidence:
  - reference: PMID:39866519
    reference_title: 'Effects of physiotherapy on degenerative cerebellar ataxia: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'physiotherapy significantly reduced SARA scores (MD = -1.41, [95% CI: -2.16, -0.66])'
    explanation: Meta-analysis evidence that physiotherapy significantly reduces ataxia severity (SARA) in degenerative cerebellar ataxia, the class that includes SCA15/16.

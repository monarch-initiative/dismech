pathophysiology:
- name: ITPR1 Haploinsufficiency
  description: >-
    Heterozygous deletions (partial or whole-gene) and, less commonly, missense
    variants in ITPR1 reduce the dose of functional IP3R1, the endoplasmic
    reticulum inositol 1,4,5-trisphosphate-gated calcium-release channel. IP3R1
    is expressed at very high levels in cerebellar Purkinje cells, so a ~50%
    reduction in functional channel disproportionately impairs Purkinje-cell
    calcium homeostasis. The orthologous Itpr1 deletion in the mouse (the opt
    mutant) produces ataxia, establishing haploinsufficiency as the disease
    mechanism.
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol
    term:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
    modifier: DECREASED
  downstream:
  - target: Purkinje Cell Dysfunction and Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17590087
    reference_title: "Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified heterozygous deletions of ITPR1 in three families with spinocerebellar ataxia 15, indicating that haploinsufficiency of ITPR1 causes the disease."
    explanation: >-
      Foundational study identifying heterozygous ITPR1 deletions as the cause
      of SCA15 and establishing haploinsufficiency as the mechanism.
- name: Purkinje Cell Dysfunction and Degeneration
  description: >-
    Impaired IP3R1-mediated calcium signaling disrupts Purkinje-cell dendritic
    calcium transients and long-term depression at parallel-fiber synapses,
    leading to progressive Purkinje-cell dysfunction and slow degeneration.
    Purkinje-cell loss reduces cerebellar cortical output and produces the
    selective cerebellar atrophy seen on imaging.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: cerebellar Purkinje cell layer development
    term:
      id: GO:0021680
      label: cerebellar Purkinje cell layer development
    modifier: DECREASED
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
- name: Cerebellar Atrophy
  description: >-
    Progressive loss of Purkinje cells and cerebellar cortical volume produces
    selective cerebellar atrophy, most pronounced in the superior vermis, with
    relative sparing of the brainstem and cerebral hemispheres. This structural
    correlate underlies the pure cerebellar clinical picture.
  locations:

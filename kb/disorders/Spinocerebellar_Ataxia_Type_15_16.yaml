  - target: Purkinje Cell Dysfunction and Degeneration
    causal_link_type: DIRECT
    description: Reduced IP3R1 expression impairs IP3-mediated calcium release in cerebellar Purkinje cells, causing persistent Purkinje cell dysfunction and degeneration.
    evidence:
    - reference: PMID:29196976
      reference_title: Identification of a Splicing Mutation in ITPR1 via WES in a Chinese Early-Onset Spinocerebellar Ataxia Family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The missense mutation associated with SCA15 reduces the level of IP3R1 protein expression ... resulting in reduced IP3R-mediated Ca2+ influx in the central nervous system and particularly in cerebellar Purkinje cells ... which leads to persistent long-standing dysfunction of Purkinje cells and eventually degeneration of selective neuronal populations.
      explanation: Directly connects reduced IP3R1 expression and impaired IP3R-mediated calcium signaling to Purkinje cell dysfunction and degeneration.
  evidence:
  - reference: PMID:38058854
    reference_title: Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch Patients With Cerebellar Ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the CNV deletion in ITPR1 was clearly the underlying cause of SCA15 in the 2 related patients
    explanation: A heterozygous ITPR1 copy-number deletion was the clear cause of SCA15 in the affected patients, consistent with loss of one ITPR1 copy (haploinsufficiency) as the disease mechanism.
  - reference: PMID:17590087
    reference_title: Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the discovery of deletion at the ITPR1 locus as a cause of this disorder in mice and of spinocerebellar ataxia 15 (SCA15) in humans
    explanation: Foundational study identifying deletion at the ITPR1 locus as the cause of SCA15 in humans (and of the orthologous ataxia in mice).
- name: Purkinje Cell Dysfunction and Degeneration
  description: Reduced IP3R1 disproportionately affects cerebellar Purkinje cells, in which IP3R1 is very highly expressed and supports mGluR1-PLC-IP3 calcium signaling, dendritic integration, synaptic plasticity, and firing precision. Aberrant intracellular calcium homeostasis produces Purkinje-cell dysfunction and, over time, degeneration, reducing inhibitory cerebellar cortical output.

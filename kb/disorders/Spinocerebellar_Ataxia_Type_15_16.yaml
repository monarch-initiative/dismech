genetic:
- name: ITPR1 Pathogenic Variants
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Most SCA15/16 cases are caused by heterozygous partial or whole-gene
    deletions of ITPR1 producing haploinsufficiency; reported deletions have
    involved ITPR1 exons 1-10, 1-40, 1-41, 1-44, 1-48, and the complete gene,
    sometimes extending into adjacent SUMF1 sequence. Heterozygous missense
    variants (e.g., p.Pro1059Leu) have also been reported. ITPR1 is allelic with
    SCA29 (congenital nonprogressive ataxia) and Gillespie syndrome.
  gene_term:
    preferred_term: ITPR1
    term:
      id: hgnc:6180
      label: ITPR1
  evidence:
  - reference: PMID:17590087
    reference_title: "Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCA15, an adult-onset autosomal dominant progressive ataxia is linked to this locus"
    explanation: >-
      Establishes SCA15 as an adult-onset autosomal dominant progressive ataxia
      mapping to the ITPR1 locus.
  - reference: PMID:38058854
    reference_title: "Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch Patients With Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 338 patients with cerebellar ataxia, we identified putative clinically relevant CNV deletions in 3 patients"
    explanation: >-
      Recent diagnostic cohort demonstrating that heterozygous ITPR1 copy-number
      deletions remain a recurrent, clinically relevant cause of dominant ataxia.
diagnosis:
- name: Brain MRI
  description: >-
    Brain MRI demonstrates selective cerebellar atrophy, most pronounced in the
    vermis, with relative sparing of the brainstem and cerebrum, supporting a
    predominantly pure cerebellar syndrome. MRI supports but does not by itself
    establish the diagnosis.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
- name: Molecular Genetic Testing
  description: >-
    Diagnosis is confirmed by molecular genetic testing detecting a heterozygous
    ITPR1 pathogenic sequence variant or, importantly, a copy-number deletion.
    Because single-exon and whole-gene deletions can be missed by sequence-only
    workflows, copy-number analysis (MLPA, dosage analysis, SNP array, or
    read-depth CNV calling) should accompany sequencing for ITPR1.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:38058854
    reference_title: "Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch Patients With Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we suggest adding CNV analysis alongside SNV analysis to SCA gene diagnostics using next-generation sequencing approaches, at least for ITPR1"
    explanation: >-
      Supports adding copy-number variant analysis to ITPR1 diagnostics because
      SCA15/16 is frequently caused by deletions that sequence-only pipelines miss.
treatments:
- name: Supportive and Symptomatic Care
  description: >-
    No disease-modifying therapy exists for SCA15/16. Management is supportive:
    genetic counseling, occupational therapy, speech therapy, mobility aids,
    fall prevention, and individualized symptomatic treatment of tremor and
    other complications as ataxia progresses.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Physiotherapy and Rehabilitation
  description: >-
    No SCA15/16-specific interventional trial exists, but rehabilitation is the
    mainstay of care for degenerative cerebellar ataxia. Meta-analysis of
    randomized trials in degenerative cerebellar ataxia found that physiotherapy
    modestly improves ataxia severity as measured by the Scale for the
    Assessment and Rating of Ataxia (SARA), supporting balance, coordination,
    and gait training in SCA15/16.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:39866519
    reference_title: "Effects of physiotherapy on degenerative cerebellar ataxia: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "physiotherapy significantly reduced SARA scores (MD = -1.41, [95% CI: -2.16, -0.66])"
    explanation: >-
      Meta-analysis evidence that physiotherapy significantly reduces ataxia
      severity (SARA) in degenerative cerebellar ataxia, the class that includes
      SCA15/16.

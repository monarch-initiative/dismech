pathophysiology:
- name: ITPR1 Haploinsufficiency
  description: >-
    Heterozygous deletions (partial or whole-gene) and, less commonly, missense
    variants in ITPR1 reduce the dose of functional IP3R1, the endoplasmic
    reticulum inositol 1,4,5-trisphosphate-gated calcium-release channel. In
    deletion carriers, loss of one ITPR1 copy reduces ITPR1 RNA and protein;
    because heterozygous loss of the adjacent SUMF1 gene does not cause a
    movement disorder, ITPR1 haploinsufficiency - not SUMF1 loss - is the causal
    mechanism.
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol
    term:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
    modifier: DECREASED
  downstream:
  - target: Purkinje Cell Dysfunction and Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38058854
    reference_title: "Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch Patients With Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the CNV deletion in ITPR1 was clearly the underlying cause of SCA15 in the 2 related patients"
    explanation: >-
      A heterozygous ITPR1 copy-number deletion was the clear cause of SCA15 in
      the affected patients, consistent with loss of one ITPR1 copy
      (haploinsufficiency) as the disease mechanism.
  - reference: PMID:17590087
    reference_title: "Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the discovery of deletion at the ITPR1 locus as a cause of this disorder in mice and of spinocerebellar ataxia 15 (SCA15) in humans"
    explanation: >-
      Foundational study identifying deletion at the ITPR1 locus as the cause of
      SCA15 in humans (and of the orthologous ataxia in mice).
- name: Purkinje Cell Dysfunction and Degeneration
  description: >-
    Reduced IP3R1 disproportionately affects cerebellar Purkinje cells, in which
    IP3R1 is very highly expressed and supports mGluR1-PLC-IP3 calcium signaling,
    dendritic integration, synaptic plasticity, and firing precision. Aberrant
    intracellular calcium homeostasis produces Purkinje-cell dysfunction and,
    over time, degeneration, reducing inhibitory cerebellar cortical output.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  locations:
  - preferred_term: cerebellar cortex
    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Cerebellar Atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17590087
    reference_title: "Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "markedly decreased levels of Itpr1 in cerebellar Purkinje cells"
    explanation: >-
      In the orthologous mouse model, the ITPR1 deletion markedly reduces IP3R1
      protein in cerebellar Purkinje cells, the cell type disproportionately
      affected in SCA15/16.
- name: Cerebellar Atrophy
  description: >-
    Progressive loss of Purkinje cells and cerebellar cortical volume produces
    selective cerebellar atrophy, most pronounced in the vermis, with relative
    sparing of the brainstem and cerebral hemispheres. This structural correlate
    underlies the predominantly pure cerebellar clinical picture.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum

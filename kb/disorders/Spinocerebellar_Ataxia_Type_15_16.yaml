pathophysiology:
- name: ITPR1 Haploinsufficiency
  description: Heterozygous deletions (partial or whole-gene) and, less commonly, missense variants in ITPR1 reduce the dose of functional IP3R1, the endoplasmic reticulum inositol 1,4,5-trisphosphate-gated calcium-release channel. In deletion carriers, loss of one ITPR1 copy reduces ITPR1 RNA and protein; because heterozygous loss of the adjacent SUMF1 gene does not cause a movement disorder, ITPR1 haploinsufficiency - not SUMF1 loss - is the causal mechanism.

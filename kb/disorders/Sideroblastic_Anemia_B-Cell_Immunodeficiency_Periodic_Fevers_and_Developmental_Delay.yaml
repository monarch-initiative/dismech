name: Sideroblastic Anemia with B-Cell Immunodeficiency, Periodic Fevers, and Developmental Delay
creation_date: "2026-11-06T21:00:00Z"
category: Mendelian
synonyms:
- congenital sideroblastic anemia-B-cell immunodeficiency-periodic fever-developmental delay syndrome
- SIFD
- SIFD syndrome
- TRNT1 deficiency
description: >-
  Sideroblastic anemia with B-cell immunodeficiency, periodic fevers, and
  developmental delay (SIFD; OMIM 616084) is an autosomal recessive,
  infancy-onset multisystem disorder caused by biallelic partial
  loss-of-function variants in TRNT1, the CCA-adding enzyme that completes the
  3' end of both cytosolic and mitochondrial tRNAs. Patient fibroblasts carry
  mitochondrial tRNAs lacking the CCA end and a deficiency of mature cytosolic
  tRNAs; TRNT1 deficiency sensitises cells to oxidative stress with
  angiogenin-dependent tRNA cleavage, eIF2-alpha phosphorylation and
  dysregulated protein clearance. Clinically the core tetrad is a severe,
  markedly microcytic sideroblastic anemia, B-cell lymphopenia with
  panhypogammaglobulinemia, recurrent aseptic febrile episodes with
  gastrointestinal disturbance, and developmental delay, with variable
  seizures, cerebellar involvement, sensorineural deafness, retinitis
  pigmentosa, cataract, cardiomyopathy, renal tubulopathy and other organ
  involvement. The inflammatory episodes carry a cytokine signature (serum
  IL-6 and IFN-gamma; tissue TNF and IL-1-beta) and respond to TNF
  inhibition. Median onset is in the first months of life, and severe cases
  present as fetal hydrops. Mortality is substantial: early onset, seizures and
  low B-cell counts predict poorer survival. Management combines transfusion,
  iron chelation and immunoglobulin replacement with TNF inhibitors;
  hematopoietic cell transplantation has corrected the hematologic and
  immunologic disease in some children but carries high risk.

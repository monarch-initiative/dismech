      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: functional perturbation of 3' CCA addition to mitochondrial tRNAs (tRNA(Cys), tRNA(LeuUUR) and tRNA(His)) in fibroblasts from two patients
      explanation: Direct measurement of defective CCA addition to mitochondrial tRNAs in patient fibroblasts.
  - target: Cytosolic Mature tRNA Deficiency

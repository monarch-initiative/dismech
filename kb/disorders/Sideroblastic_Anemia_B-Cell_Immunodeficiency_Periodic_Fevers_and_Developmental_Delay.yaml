    explanation: Bone marrow immunophenotyping in a 12-year-old with atypical SIFD.
  - reference: PMID:30758723
    reference_title: "Atypical SIFD with novel TRNT1 mutations: a case study on the pathogenesis of B-cell deficiency."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: Severe combined immunodeficiency mice transplanted with bone marrow hematopoietic stem cells from the patient showed largely normal B-cell engraftment and differentiation in the bone marrow and periphery at 24 weeks post-transplantation
    explanation: Patient stem cells differentiated normally in a mouse host, which argues against a purely cell-intrinsic block.

    - reference: PMID:29358286
      reference_title: "Aberrant tRNA processing causes an autoinflammatory syndrome responsive to TNF inhibitors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Deep tRNA sequencing of patients' fibroblasts showed significant deficiency of mature cytosolic tRNAs.
      explanation: Deep tRNA sequencing of patient fibroblasts.
- name: Mitochondrial tRNA CCA-End Deficiency
  description: >-
    Patient fibroblasts show defective CCA addition to mitochondrial
    tRNA-Cys, tRNA-LeuUUR and tRNA-His. In the same study, mitochondrial
    translation products were normal in fibroblasts, so whether the mitochondrial
    tRNA defect impairs mitochondrial protein synthesis in affected tissues
    (erythroid precursors in particular) is inferred from the phenotype rather
    than shown.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:27370603
    reference_title: "TRNT1 deficiency: clinical, biochemical and molecular genetic features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: demonstrating a pathomechanism affecting the CCA addition to mt-tRNAs
    explanation: Patient-fibroblast evidence for the mitochondrial tRNA defect.
  - reference: PMID:27370603
    reference_title: "TRNT1 deficiency: clinical, biochemical and molecular genetic features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found normal mitochondrial translation products using passage matched controls
    explanation: Records the negative result that limits the inferred link to mitochondrial translation failure.
  downstream:
  - target: Sideroblastic Erythropoiesis
    description: >-
      Inferred. Defects in mitochondrial protein synthesis are an established
      cause of congenital sideroblastic anemia, and SIFD was placed in that
      group; a direct link from the TRNT1 mitochondrial tRNA defect to erythroid
      mitochondrial iron loading has not been measured.
    evidence:
    - reference: PMID:25193871
      reference_title: "Mutations in TRNT1 cause congenital sideroblastic anemia with immunodeficiency, fevers, and developmental delay (SIFD)."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: Mutations in genes encoding proteins that are involved in mitochondrial heme synthesis, iron-sulfur cluster biogenesis, and mitochondrial protein synthesis have previously been implicated in the pathogenesis of the congenital sideroblastic anemias (CSAs).
      explanation: Background linking mitochondrial protein-synthesis defects to sideroblastic anemia; applying it to TRNT1 is an inference step.

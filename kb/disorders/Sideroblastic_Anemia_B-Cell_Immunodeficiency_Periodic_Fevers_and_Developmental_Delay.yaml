- name: Retinal Autophagy Deficit and Oxidative Stress
  description: >-
    Retinal organoids derived from patients with TRNT1-associated retinitis
    pigmentosa show reduced full-length TRNT1, accumulation of LC3-II and
    increased oxidative stress. These patients are at the mild, retina-limited
    end of the TRNT1 spectrum, so applying this mechanism to the retinopathy of
    SIFD is an inference.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:28390992
    reference_title: "Patient-specific induced pluripotent stem cells to evaluate the pathophysiology of TRNT1-associated Retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Patient-specific iPSCs and iPSC-derived retinal organoids exhibited a deficit in autophagy, as evidenced by aberrant accumulation of LC3-II and elevated levels of oxidative stress.
    explanation: iPSC-derived retinal organoids from patients with TRNT1-associated retinitis pigmentosa.
  downstream:
  - target: Retinitis Pigmentosa
    description: Inferred link from the organoid phenotype to photoreceptor degeneration.
    evidence:
    - reference: PMID:28390992
      reference_title: "Patient-specific induced pluripotent stem cells to evaluate the pathophysiology of TRNT1-associated Retinitis pigmentosa."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: Mutations in TRNT1 caused reduced levels of full-length TRNT1 protein and expression of a truncated smaller protein in both patient-specific iPSCs and iPSC-derived retinal organoids.
      explanation: Organoid model of TRNT1 retinopathy; photoreceptor death itself was not measured.

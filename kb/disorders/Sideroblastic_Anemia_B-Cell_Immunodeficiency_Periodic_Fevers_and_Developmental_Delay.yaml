- name: Pre-B-Cell Maturation Arrest
  description: >-
    In the bone marrow of one patient, B-cell development stopped at the
    CD19+CD10+CD20+/- pre-B-cell stage. The same patient's hematopoietic stem
    cells, transplanted into immunodeficient mice, produced largely normal B
    cells, so whether the block is intrinsic to the B-cell lineage or depends on
    the patient's marrow environment is unresolved.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: precursor B cell
    term:
      id: CL:0000817
      label: precursor B cell
  biological_processes:
  - preferred_term: B cell differentiation
    term:
      id: GO:0030183
      label: B cell differentiation
    modifier: DECREASED

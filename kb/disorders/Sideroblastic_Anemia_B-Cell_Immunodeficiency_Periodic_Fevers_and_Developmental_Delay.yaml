differential_diagnoses:
- name: Retinitis pigmentosa and erythrocytic microcytosis
  description: >-
    Milder allelic TRNT1 disorder (OMIM 616959) caused by hypomorphic variants,
    with retinitis pigmentosa and red-cell microcytosis but only mild anemia and
    usually without the immunodeficiency and fevers. MONDO and OMIM keep it
    separate; ClinGen lumps the two into one disease spectrum (see notes).
  distinguishing_features:
  - Retina-limited disease with microcytosis and anisocytosis and only mild anemia.
  - Absence of B-cell immunodeficiency, periodic fevers and developmental delay.
  disease_term:
    preferred_term: retinitis pigmentosa and erythrocytic microcytosis
    term:
      id: MONDO:0014850
      label: retinitis pigmentosa and erythrocytic microcytosis
  evidence:
  - reference: PMID:26494905
    reference_title: "Hypomorphic mutations in TRNT1 cause retinitis pigmentosa with erythrocytic microcytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Complete blood counts of all three of our patients revealed red blood cell microcytosis and anisocytosis with only mild anemia.
    explanation: Hematologic picture of the milder allelic disorder.
  - reference: PMID:26494905
    reference_title: "Hypomorphic mutations in TRNT1 cause retinitis pigmentosa with erythrocytic microcytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings indicate that hypomorphic TRNT1 mutations can cause a recessive disease that is almost entirely limited to the retina.
    explanation: Retina-limited phenotype.
- name: Other congenital sideroblastic anemias
  description: >-
    Congenital sideroblastic anemias caused by defects in mitochondrial heme
    synthesis, iron-sulfur cluster biogenesis or mitochondrial protein synthesis.
    SIFD is distinguished by the accompanying B-cell immunodeficiency, aseptic
    periodic fevers and developmental delay.
  distinguishing_features:
  - B-cell lymphopenia with panhypogammaglobulinemia.
  - Recurrent aseptic febrile episodes.
  evidence:
  - reference: PMID:25193871
    reference_title: "Mutations in TRNT1 cause congenital sideroblastic anemia with immunodeficiency, fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: Mutations in genes encoding proteins that are involved in mitochondrial heme synthesis, iron-sulfur cluster biogenesis, and mitochondrial protein synthesis have previously been implicated in the pathogenesis of the congenital sideroblastic anemias (CSAs).
    explanation: Names the other mechanistic classes of congenital sideroblastic anemia.
  - reference: PMID:23553769
    reference_title: "A novel syndrome of congenital sideroblastic anemia, B-cell immunodeficiency, periodic fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: identifying a clinical subgroup of CSA associated with B immunodeficiency, periodic fevers, and development delay
    explanation: SIFD was delineated within congenital sideroblastic anemia by these accompanying features.
notes: >-
  No GeneReviews chapter covers this disorder (Bookshelf index snapshot of
  2026-09-10 plus a live PubMed title search, checked 2026-11-06), so the
  founding cohort (PMID:23553769) and two systematic reviews (PMID:35984545,
  58 patients; PMID:41795040, 75 patients) are the phenotype baseline.
  Lumping: the ClinGen gene-disease validity record for TRNT1 (CGGV assertion
  6df64a62, Antibody Deficiencies GCEP, 2022) lumps SIFD (OMIM 616084) and
  retinitis pigmentosa and erythrocytic microcytosis (OMIM 616959) into a single
  disease spectrum on the grounds that mechanism and inheritance do not differ.
  MONDO keeps the milder presentation as a separate class (MONDO:0014850), so
  this entry is scoped to SIFD and records the milder presentation as an
  allelic differential diagnosis rather than a subtype. The mechanism nodes
  for mitochondrial and cytosolic tRNA defects come from patient fibroblasts
  and cell lines, and the links from them to individual organ phenotypes are
  inferred. A murine macrophage knockdown study (PMID:41019077) implicates
  TSPO-dependent mitochondrial reprogramming in innate immune responses; it is
  not modelled here because it is a single cell-line study whose relation to
  the patients' autoinflammation is not established.

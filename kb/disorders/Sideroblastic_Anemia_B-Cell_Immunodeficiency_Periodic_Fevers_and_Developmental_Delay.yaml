    explanation: Gene-discovery report establishing biallelic TRNT1 variants as the cause.
pathophysiology:
- name: TRNT1 Partial Loss of Function
  description: >-
    Disease-associated TRNT1 alleles reduce, but do not abolish, enzyme
    function. Purified SIFD-linked missense variants in the head and neck
    domains are thermally unstable, and several also have altered catalytic
    efficiency. Yeast lacking the TRNT1 homolog CCA1 confirm partial loss of
    function of the patient alleles.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TRNT1
    term:
      id: hgnc:17341
      label: TRNT1
  molecular_functions:
  - preferred_term: CCA tRNA nucleotidyltransferase activity
    term:
      id: GO:0004810
      label: CCA tRNA nucleotidyltransferase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:25193871
    reference_title: "Mutations in TRNT1 cause congenital sideroblastic anemia with immunodeficiency, fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using budding yeast lacking the TRNT1 homolog, CCA1, we confirm that the patient-associated TRNT1 mutations result in partial loss of function of TRNT1
    explanation: Yeast complementation shows the patient alleles are hypomorphic rather than null.
  - reference: PMID:29454993
    reference_title: "In vitro studies of disease-linked variants of human tRNA nucleotidyltransferase reveal decreased thermal stability and altered catalytic activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our data suggest that the SIFD phenotype is linked to poor stability of the T154I and L166S variant proteins, and to a combination of reduced stability and altered catalytic efficiency in the M158 V, R190I and I223T variants.
    explanation: Biochemical characterisation of five SIFD-linked substitutions shows reduced stability and, for three, altered catalysis.
  downstream:
  - target: Impaired tRNA 3'-CCA Addition
    description: Reduced TRNT1 activity limits addition of the CCA trinucleotide to tRNA 3' ends.
    evidence:
    - reference: PMID:32471101
      reference_title: "Diseases Associated with Defects in tRNA CCA Addition."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: tRNA nucleotidyl transferase 1 (TRNT1) is an essential enzyme catalyzing the addition of terminal cytosine-cytosine-adenosine (CCA) trinucleotides to all mature tRNAs, which is necessary for aminoacylation.
      explanation: Review stating the enzyme's function, which the partial loss of function reduces.
- name: Impaired tRNA 3'-CCA Addition
  description: >-
    The CCA-adding step is required for every cytosolic and mitochondrial
    tRNA to be aminoacylated. Its partial failure therefore affects both
    compartments, which the gene-discovery study proposed as the explanation
    for the disorder's pleiotropy.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tRNA 3'-terminal CCA addition
    term:
      id: GO:0001680
      label: tRNA 3'-terminal CCA addition
    modifier: DECREASED
  evidence:
  - reference: PMID:25193871
    reference_title: "Mutations in TRNT1 cause congenital sideroblastic anemia with immunodeficiency, fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: lead to metabolic defects in both the mitochondria and cytosol, which can account for the phenotypic pleiotropy
    explanation: Yeast data show defects in both compartments, proposed to account for the multisystem phenotype.
  downstream:
  - target: Mitochondrial tRNA CCA-End Deficiency
    description: Mitochondrial tRNAs lacking the CCA end accumulate in patient cells.
    evidence:

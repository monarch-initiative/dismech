    missense with nonsense, frameshift, splice and non-coding alleles. In one
    review of 32 reported cases, about 79% of those who died carried the
    c.668T>C (p.Ile223Thr) hot-spot allele, and non-coding variants were more
    common among those who died. Another review associated biallelic variants
    in exon 1 to intron 5 with more severe disease.

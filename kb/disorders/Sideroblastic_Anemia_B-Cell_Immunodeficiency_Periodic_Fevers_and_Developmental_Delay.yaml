- name: Sideroblastic Erythropoiesis
  description: >-
    Erythroid precursors are pathological, with perinuclear mitochondrial iron
    deposition (ring sideroblasts), the defining finding of congenital
    sideroblastic anemia. In SIFD the anemia is typically severe and markedly
    microcytic. Severe antenatal disease shows extramedullary erythropoiesis and
    many circulating nucleated red cells.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  biological_processes:
  - preferred_term: erythrocyte differentiation
    term:
      id: GO:0030218
      label: erythrocyte differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23553769
    reference_title: "A novel syndrome of congenital sideroblastic anemia, B-cell immunodeficiency, periodic fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Congenital sideroblastic anemias (CSAs) are a heterogeneous group of inherited disorders identified by pathological erythroid precursors with perinuclear mitochondrial iron deposition in bone marrow.
    explanation: Defines the erythroid lesion of the disease group in which SIFD was identified.
  - reference: PMID:23553769
    reference_title: "A novel syndrome of congenital sideroblastic anemia, B-cell immunodeficiency, periodic fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Anemia at diagnosis was sideroblastic, typically severe (median hemoglobin, 7.1 g/dL) and markedly microcytic (median mean corpuscular volume, 62.0 fL).
    explanation: Characterises the anemia in the founding 12-patient cohort.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: is an autosomal recessive syndrome caused by biallelic loss-of-function variant of tRNA nucleotidyl transferase 1 (TRNT1)
    explanation: States the recessive inheritance and biallelic genotype requirement.
  - reference: PMID:25193871
    reference_title: "Mutations in TRNT1 cause congenital sideroblastic anemia with immunodeficiency, fevers, and developmental delay (SIFD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

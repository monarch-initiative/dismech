- name: Anticipatory counselling for the Jarisch-Herxheimer reaction
  description: >-
    The Jarisch-Herxheimer reaction is an acute febrile reaction within 24
    hours of starting any syphilis therapy, more common in early syphilis.
    Patients should be told about it. Antipyretics ease symptoms but have not
    been shown to prevent it. No cached source quantifies its risk in
    cardiovascular syphilis specifically, where it was historically feared for
    patients with coronary ostial disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Behavioral Counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: PMID:34292926

name: Cardiovascular Syphilis
creation_date: "2026-11-26T15:45:10Z"
category: Infectious Disease
description: >-
  Cardiovascular syphilis is the cardiovascular form of tertiary syphilis. Years
  to decades after an untreated or inadequately treated infection, Treponema
  pallidum subsp. pallidum involves the adventitia and vasa vasorum of the
  ascending aorta. A lymphoplasmacytic periaortitis and obliterative
  endarteritis of the vasa vasorum make the outer aortic media ischemic, and
  the media scars, losing its elastic lamellae, while the intima thickens into
  the wrinkled "tree-bark" surface. The weakened tubular ascending aorta dilates
  into a saccular or fusiform aneurysm; root dilation makes the aortic valve
  incompetent; and intimal and wall thickening at the root narrows the coronary
  ostia. Rupture, heart failure from aortic regurgitation, and ostial ischemia
  are the causes of death. Syphilitic aortitis is the lesion underlying nearly
  all cases. Syphilitic myocarditis and endocarditis are rare. The disease
  became uncommon after penicillin reduced progression of early syphilis to
  late disease, but it is still reported, including in people with HIV, and
  many patients recall no primary infection.
disease_term:
  preferred_term: cardiovascular syphilis
  term:
    id: MONDO:0004911
    label: cardiovascular syphilis
parents:
- Syphilis
- Tertiary syphilis
synonyms:
- syphilis, cardiovascular
- tertiary cardiovascular syphilis
- luetic heart disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
notes: >-
  Scope and lump/split. MONDO:0004911 has no MONDO children. MONDO:0006992
  syphilitic aortitis sits under syphilis rather than under this term, but its
  MONDO definition (derived from the MeSH heading Syphilis, Cardiovascular)
  describes the cardiovascular manifestations as a whole. The sources treat
  aortitis as the lesion from which aneurysm, aortic regurgitation and ostial
  stenosis follow, not as a separate disease. Syphilitic aortitis is therefore
  recorded here as the dominant subtype and bound to MONDO:0006992, alongside a
  rare myocardial and valvular subtype. The aortic pathophysiology nodes are
  scoped to the aortitis subtype so that nothing aortic is asserted of
  isolated myocarditis. Syphilis.yaml curates syphilis across stages and lists
  tertiary syphilis as a stage, not a subtype, so this entry has no pointer
  subtype to attach a curated_in slot to there; Syphilis.yaml keeps a short
  Syphilitic Aortitis node of its own. Neurosyphilis is curated separately and
  is not modelled here, although it often accompanies aortic syphilis and is
  the reason cerebrospinal fluid examination precedes treatment.

  Module conformance. No module was conformed to. The only aortic module,
  aortopathy_tgfbeta_dysregulation, is scoped to heritable thoracic aortic
  aneurysm syndromes with a genetic primary lesion, and granuloma_formation
  would apply only to a myocardial gumma, which no cached source here
  describes in more than one line.

  Thin literature. Almost all modern evidence is case reports, small surgical
  pathology series and literature reviews of case reports. The largest
  clinicopathologic series is the 90-patient necropsy study of PMID:19932796.
  Frequencies in the phenotype rows come from those series and their
  denominators (reported cases, necropsy cases, aneurysm cases) differ, so
  they are not population estimates. No controlled trial addresses antibiotic
  treatment of cardiovascular syphilis; the CDC states that little is known
  about clinical response. The deep-research report
  (research/Cardiovascular_Syphilis-deep-research-claude_code.md) was used as
  leads only; every claim here rests on an evidence item quoting a cached
  abstract or full text.
infectious_agent:
- name: Treponema pallidum subsp. pallidum
  description: >-
    The venereal treponeme. In cardiovascular syphilis it persists for years to
    decades after the initial infection and is found, scantily, in the aortic
    adventitia and vasa vasorum.
  infectious_agent_term:
    preferred_term: Treponema pallidum subsp. pallidum
    term:
      id: NCBITaxon:161
      label: Treponema pallidum subsp. pallidum
  evidence:
  - reference: PMID:41173630
    reference_title: Syphilitic Aortitis Presenting With De-Novo Aortic Thrombus and Acute Myocardial Infarction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pathology results from the aortic specimen showed dense
      lymphoplasmacytic inflammation, with rare organisms highlighted by
      Treponema immunohistochemical stain, findings confirmatory of syphilitic
      aortitis
    explanation: >-
      Demonstrates Treponema organisms, rare, within the resected aortic wall.
agent_life_cycle:
  description: >-
    T. pallidum subsp. pallidum is an obligate human pathogen with no
    non-human reservoir or vector. Cardiovascular disease does not arise from a
    separate exposure; it is a late consequence, within the same host, of an
    infection acquired sexually years or decades earlier.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
transmission:
- name: Sexual transmission by contact with mucocutaneous lesions
  description: >-
    The infection that later causes cardiovascular syphilis is acquired by
    sexual contact with an infectious mucocutaneous lesion of early syphilis.
    Cardiovascular syphilis itself is not transmissible, because mucocutaneous
    lesions are uncommon after the first year of infection.
  evidence:
  - reference: PMID:34292926
    reference_title: "Sexually Transmitted Infections Treatment Guidelines, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sexual transmission of T. pallidum is thought to occur only when
      mucocutaneous syphilitic lesions are present. Such manifestations are
      uncommon after the first year of infection.
    explanation: >-
      CDC guideline statement that transmission requires mucocutaneous lesions,
      which are uncommon by the late stage at which cardiovascular disease
      appears.
has_subtypes:
- name: Syphilitic aortitis
  display_name: Syphilitic aortitis and its complications
  subtype_term:
    preferred_term: syphilitic aortitis
    term:
      id: MONDO:0006992
      label: syphilitic aortitis
  description: >-
    Treponemal aortitis of the tubular ascending aorta, often extending to the
    arch and descending thoracic aorta, with its complications: aneurysm,
    aortic regurgitation from root dilation, and coronary ostial stenosis. It is
    the lesion behind almost every case of cardiovascular syphilis, which is
    why it is a subtype here rather than a separate entry; its MONDO definition
    describes the cardiovascular manifestations as a whole. It differs from the
    myocardial subtype in its site (the aortic wall rather than the myocardium
    and valve leaflets), in the mechanism of aortic regurgitation (root
    dilation with a preserved leaflet structure rather than direct valve
    destruction), and in its surgical management.
  evidence:
  - reference: PMID:27982548
    reference_title: Syphilitic aortitis and its complications in the modern era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The consequent weakening of the aortic wall can lead to severe
      complications, represented by aortic aneurysm, aortic valvular
      insufficiency, aortic root dilation and coronary ostial stenosis.
    explanation: >-
      Places aneurysm, valvular insufficiency, root dilation and ostial stenosis
      as complications of the one aortic lesion.
  - reference: PMID:19932796
    reference_title: Natural history of syphilitic aortitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All 90 had extensive involvement of the tubular portion of the ascending
      aorta by the syphilitic process, which spared the sinuses of Valsalva in
      all but 4 patients.
    explanation: >-
      Necropsy series of 90 patients defining the site of the aortitis.
- name: Syphilitic myocarditis and endocarditis
  description: >-
    Rare direct treponemal involvement of the myocardium and heart valves,
    reported as myocarditis and as destructive valvulitis of the aortic and
    mitral valves. It differs from the aortitis subtype in presentation (rapidly
    progressive heart failure with mitral as well as aortic regurgitation, and
    a preserved aortic annulus and root) and in diagnosis, which needs
    immunohistochemistry or PCR of valve or myocardial tissue. The single
    well-documented modern case also had an aortic aneurysm. No MONDO term
    exists for this stratum, so subtype_term is omitted.
  evidence:
  - reference: PMID:17469346
    reference_title: "[Cardiovascular syphilis: diagnosis, treatment]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cardiovascular tertiary syphilis may lead to aortitis, aortic aneurism,
      coronary stenosis, aortic insufficiency and, rarely, to myocarditis.
    explanation: >-
      Review naming myocarditis as a rare cardiovascular manifestation.
  - reference: PMID:39832511
    reference_title: "Syphilitic bi-valvular endocarditis and myocarditis: modern tools applied to long-forgotten complications of a re-emerging disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A previously healthy 60-year-old man presented with rapidly progressive
      heart failure and severe aortic and mitral valve insufficiency, with
      direct valvular destruction and preservation of the aortic valve annulus
      and aortic root.
    explanation: >-
      Case report distinguishing direct valvular destruction from the root
      dilation of aortitis.
progression:
- phase: Latent infection
  notes: >-
    Asymptomatic persistence of untreated infection for years to decades before
    cardiovascular disease appears. Cited intervals are 10 to 30 and 10 to 40
    years.
  evidence:
  - reference: PMID:38510102
    reference_title: "Syphilitic ostial coronary artery occlusion treated with percutaneous coronary intervention: Case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Cardiovascular syphilis typically occurs 10 to 40 years after primary
      syphilitic infection and is seen in 10% of all patients with tertiary
      syphilis.
    explanation: >-
      Discussion of a case series restating the latency interval from prior
      literature.
  - reference: PMID:40562738
    reference_title: Syphilitic Aortitis with Concomitant Neurosyphilis in Asymptomatic Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      After 10–30 years, ≈10% of untreated persons will develop syphilitic
      aortitis.
    explanation: >-
      Case report introduction restating the latency and the proportion of
      untreated persons affected.
- phase: Uncomplicated aortitis
  notes: >-
    Clinically silent inflammation of the ascending aorta, usually found by
    imaging done for another reason or at necropsy.
  evidence:
  - reference: PMID:38510102
    reference_title: "Syphilitic ostial coronary artery occlusion treated with percutaneous coronary intervention: Case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In the initial phases of tertiary syphilis, clinically asymptomatic
      inflammation of the ascending aorta may develop.
    explanation: >-
      Describes the silent initial aortic phase.
  - reference: PMID:40562738
    reference_title: Syphilitic Aortitis with Concomitant Neurosyphilis in Asymptomatic Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We report a rare case of syphilitic aortitis with possible neurosyphilis
      in an asymptomatic 89-year-old man in Washington, DC, USA.
    explanation: >-
      An asymptomatic aortitis found incidentally on chest imaging.
- phase: Complicated aortitis
  notes: >-
    Aneurysm, aortic regurgitation and coronary ostial stenosis, which often
    coexist. In an Indian autopsy series every case was complicated.
  evidence:
  - reference: PMID:21045381
    reference_title: "Syphilitic aortitis: rearing of the ugly head."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Complications in the form of aortic regurgitation (72.7 %), coronary
      ostial stenosis (59 %) and aneurysms (59 %) frequently coexisted.
    explanation: >-
      Autopsy series of 44 cases classified as uncomplicated or complicated
      aortitis; none was uncomplicated.
prevalence:
- population: Untreated syphilis, Oslo cohort of 2000 patients (1950s report)
  measure_type: UNKNOWN
  notes: >-
    Cumulative proportion of untreated patients who eventually developed
    cardiovascular manifestations: 13.6% of men and 7.6% of women, with aortic
    pathology in 4.6%. This is a historical natural-history figure in people
    with untreated syphilis, not a population rate.
  evidence:
  - reference: PMID:41973418
    reference_title: Adverse Cardiovascular Outcomes in Patients With Syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      A study of untreated syphilis in 2000 patients in Oslo, Norway, in the
      1950s ... found that 13.6% of males and 7.6% of females eventually
      developed cardiovascular manifestations of the infection, with aortic
      pathology in 4.6% of patients.
    explanation: >-
      A cohort study's discussion restating the Oslo natural-history study.
- population: Autopsy series, before and after penicillin (Philadelphia 1927-1937; New York 1950-1960)
  measure_type: UNKNOWN
  notes: >-
    Cardiovascular sequelae of syphilis were found in 6.9% of autopsies before
    penicillin and syphilitic aortitis in 0.8% of autopsies after it.
  evidence:
  - reference: PMID:41973418
    reference_title: Adverse Cardiovascular Outcomes in Patients With Syphilis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Pre–penicillin era autopsies in Philadelphia from 1927 to 1937 yielded a
      cardiovascular sequelae rate of 6.9%, 13 whereas the results of a
      post–penicillin era series from New York from 1950 to 1960 reported that
      syphilitic aortitis rates fell to 0.8%
    explanation: >-
      Restates the fall in autopsy prevalence of syphilitic aortitis after the
      introduction of penicillin.
- population: United States, 2018-2022
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Reported syphilis rose by 80% in this period while the incidence of
    cardiovascular syphilis did not change; only sporadic cases are reported.
  evidence:
  - reference: PMID:39902879
    reference_title: Cardiovascular Syphilis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, the incidence of cardiovascular syphilis has remained the same
      during this period, likely due to the efficacy of penicillin use early in
      the infection, preventing the progression of the disease to the tertiary
      stage.
    explanation: >-
      Review stating that cardiovascular syphilis remained rare while early
      syphilis rose.
environmental:
- name: HIV coinfection
  description: >-
    HIV coinfection is recorded in modern cases of syphilitic aortitis,
    including fatal rupture and aneurysm with dissection, and syphilis is a
    recurrent coinfection in published HIV-associated aortic disease. HIV is
    said to accelerate the natural history of syphilis. Whether it changes the
    frequency or latency of cardiovascular syphilis specifically has not been
    measured.
  influences_mechanisms:
  - target: Persistent Treponemal Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      HIV coinfection is reported to accelerate the progression of syphilis
      through its stages.
    evidence:
    - reference: PMID:42233917
      reference_title: Tertiary Syphilitic Aortitis Manifesting as Ascending Aortic Aneurysm and Dissection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Syphilis facilitates the transmission and acquisition of HIV, while HIV
        coinfection has been documented to accelerate the natural progression
        of syphilis.
      explanation: >-
        Discussion of a case report restating the effect of HIV on syphilis
        progression from prior literature.
  evidence:
  - reference: PMID:42233917
    reference_title: Tertiary Syphilitic Aortitis Manifesting as Ascending Aortic Aneurysm and Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Serological screening was positive for both HIV and syphilis.
    explanation: >-
      A 42-year-old woman with a syphilitic ascending aneurysm and dissection
      who also had HIV.
  - reference: PMID:30893469
    reference_title: "Ruptured Syphilitic Aneurysm: A Cause of Sudden Death in a Man with Human Immunodeficiency Coinfection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Herein, we present an autopsy case of a ruptured thoracic aneurysm that
      resulted from an undetected case of syphilitic aortitis in an
      HIV-positive Japanese MSM with undiagnosed syphilis.
    explanation: >-
      Fatal rupture of syphilitic aortitis in a man with HIV.
  - reference: PMID:31051229
    reference_title: "Many Different Patterns under a Common Flag: Aortic Pathology in HIV-A Review of Case Reports in Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Coinfection occurred in some cases (syphilis in 6, HCV in 5, and HBV in
      3).
    explanation: >-
      In 51 published cases of aortic disease in HIV, syphilis was the most
      frequent coinfection.
- name: Untreated or inadequately treated early syphilis
  description: >-
    Cardiovascular syphilis follows syphilis that was never treated, often
    because it was never recognised: most modern patients deny a primary
    infection. Penicillin treatment of early syphilis is what made the disease
    rare.
  influences_mechanisms:
  - target: Persistent Treponemal Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Infection left untreated persists and, in a minority, reaches the aorta
      years later.
    evidence:
    - reference: PMID:40562738
      reference_title: Syphilitic Aortitis with Concomitant Neurosyphilis in Asymptomatic Patient.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        After 10–30 years, ≈10% of untreated persons will develop syphilitic
        aortitis.
      explanation: >-
        Ties the disease to untreated infection.
  evidence:
  - reference: PMID:27982548
    reference_title: Syphilitic aortitis and its complications in the modern era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      most patients had no predisposing factors and denied a primary infection
    explanation: >-
      In 66 recently reported patients the antecedent infection was usually
      unrecognised.
pathophysiology:
- name: Persistent Treponemal Infection
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Untreated T. pallidum infection persists through a latent period of years
    to decades. Cardiovascular disease is its late consequence in a minority of
    untreated people.
  evidence:
  - reference: PMID:41173630
    reference_title: Syphilitic Aortitis Presenting With De-Novo Aortic Thrombus and Acute Myocardial Infarction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Diagnosing syphilitic aortitis can be complex due to its prolonged
      latency, often emerging decades after the initial infection.
    explanation: >-
      Case report discussion restating the decades-long latency.
  downstream:
  - target: Treponemal Invasion of the Aortic Adventitia and Vasa Vasorum
    causal_link_type: DIRECT
    description: >-
      Persisting organisms reach the outer wall of the ascending aorta.
    evidence:
    - reference: PMID:27982548
      reference_title: Syphilitic aortitis and its complications in the modern era.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Aortitis is a well-recognized manifestation of the tertiary stage of
        syphilis.
      explanation: >-
        Places aortic involvement in the late stage of the infection.
  - target: Treponemal Invasion of the Myocardium and Heart Valves
    causal_link_type: DIRECT
    description: >-
      Rarely, organisms involve the myocardium and the valve leaflets directly.
    evidence:
    - reference: PMID:39832511
      reference_title: "Syphilitic bi-valvular endocarditis and myocarditis: modern tools applied to long-forgotten complications of a re-emerging disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        It occurred 4 years after probable infection, long before what would be
        expected according to current understanding of its natural history.
      explanation: >-
        Places the myocardial and valvular involvement after an earlier
        untreated infection, here at a shorter latency than expected.
- name: Treponemal Invasion of the Aortic Adventitia and Vasa Vasorum
  subtypes:
  - Syphilitic aortitis
  biological_scale: TISSUE
  description: >-
    T. pallidum invades the adventitia of the ascending aorta and the vasa
    vasorum that nourish the outer part of its wall. Inflammation begins in
    this outermost layer.
  locations:
  - preferred_term: aorta tunica adventitia
    term:
      id: UBERON:0004664
      label: aorta tunica adventitia
  - preferred_term: vasa vasorum
    term:
      id: UBERON:0003710
      label: vasa vasorum
  - preferred_term: ascending aorta
    term:
      id: UBERON:0001496
      label: ascending aorta
  evidence:
  - reference: PMID:42233917
    reference_title: Tertiary Syphilitic Aortitis Manifesting as Ascending Aortic Aneurysm and Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The pathogenesis results from invasion of the aortic adventitia and vasa
      vasorum.
    explanation: >-
      Case report discussion stating the site of invasion.
  - reference: PMID:27777861
    reference_title: "Syphilitic aortic aneurysm with a pulmonary lesion: a case report and literature view."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      At the beginning, inflammation starts from outermost layer of the blood
      vessel, including the vasa vasorum that supply the aorta itself with
      blood.
    explanation: >-
      States that the inflammation starts in the adventitia and vasa vasorum.
  downstream:
  - target: Lymphoplasmacytic Periaortitis
    causal_link_type: DIRECT
    description: >-
      Treponemes in the adventitia provoke a lymphocyte and plasma-cell
      infiltrate.
    evidence:
    - reference: PMID:41173630
      reference_title: Syphilitic Aortitis Presenting With De-Novo Aortic Thrombus and Acute Myocardial Infarction.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Pathology results from the aortic specimen showed dense
        lymphoplasmacytic inflammation, with rare organisms highlighted by
        Treponema immunohistochemical stain, findings confirmatory of syphilitic
        aortitis
      explanation: >-
        Organisms and the lymphoplasmacytic infiltrate are found together in

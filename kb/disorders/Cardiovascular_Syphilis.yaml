treatments:
- name: Benzathine penicillin G, three weekly doses
  description: >-
    For cardiovascular syphilis with a normal CSF examination and no penicillin
    allergy, the CDC regimen is benzathine penicillin G 2.4 million units IM
    weekly for three weeks. Patients allergic to penicillin should be treated
    with infectious disease consultation. Little is known about clinical
    response. Antibiotics treat the infection but do not undo the aortic damage
    already present, and treatment does not always prevent late complications.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

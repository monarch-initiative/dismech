discussions:
- discussion_id: cvsyph_early_aortitis_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does aortic involvement begin in early syphilis, and does the transient
    aortic wall uptake seen on PET in early infection lead to the late
    aortitis of cardiovascular syphilis?
  rationale: >-
    The accepted model places aortic disease 10 to 30 or more years after
    infection. Five of six people with early syphilis in one PET series had
    thoracic aortic wall uptake that resolved within 60 days of penicillin,
    and a case of syphilitic myocarditis and endocarditis occurred four years
    after probable infection. If the aorta is seeded early, treatment timing
    and screening of people with early syphilis could matter more than the
    latency model implies. Neither observation shows that early uptake
    progresses to the late lesion.
  attaches_to:
  - pathophysiology#Persistent Treponemal Infection
  - pathophysiology#Treponemal Invasion of the Aortic Adventitia and Vasa Vasorum
  proposed_experiments:
  - experiment_id: exp_cvsyph_pet_cohort
    name: Longitudinal aortic imaging after early syphilis
    description: >-
      Serial FDG PET or MR imaging of the aorta in a cohort with early
      syphilis, stratified by HIV status and treatment, followed for
      persistence of aortic wall inflammation and later dilation.

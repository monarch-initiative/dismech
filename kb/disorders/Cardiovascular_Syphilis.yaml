- name: Surgical repair of the ascending aortic aneurysm
  description: >-
    Open replacement of the aneurysmal ascending aorta, often with the aortic
    valve. Surgery is advised once the diagnosis is made because of the risk of
    rupture, although a review of published cases found no survival
    difference between surgical and conservative management. After surgery the
    remaining aorta should be followed for life.

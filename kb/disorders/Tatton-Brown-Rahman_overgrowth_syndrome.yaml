- name: Echocardiographic cardiovascular surveillance
  description: >-
    Baseline and longitudinal transthoracic echocardiography evaluates aortic
    root dimensions, mitral valve competence, and ventricular size/function,
    because aortic dilatation and valvular disease can progress rapidly in TBRS.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: >-
    Detection or exclusion of aortic root dilatation, mitral regurgitation, or
    left ventricular dilatation.
  evidence:
  - reference: DOI:10.1186/s13148-024-01686-y
    reference_title: "Aortic disease and cardiomyopathy in patients with a novel DNMT3A gene variant causing Tatton-Brown–Rahman syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From the clinical perspective, we suggest that new patients diagnosed with congenital DNMT3A variants and TBRS require close examination and follow-up for aortic dilatation and valvular disease because these conditions can progress rapidly."
    explanation: >-
      Recommends diagnostic and longitudinal cardiac evaluation for aortic
      dilatation and valvular disease in TBRS.
treatments:
- name: Supportive Multidisciplinary Management and Clinical Surveillance
  description: >-
    No disease-modifying therapy currently restores DNMT3A methylation activity;
    care consists of symptom-directed multidisciplinary management of
    developmental/educational needs, behavioral/psychiatric disorders, epilepsy,
    kyphoscoliosis, joint hypermobility, sleep apnea, cardiovascular disease,
    and standard oncology protocols if acute leukemia develops, paired with
    clinical surveillance and low threshold for complete blood count evaluation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Cardiovascular Developmental and Structural Remodeling
    treatment_effect: MODULATES
    description: >-
      Longitudinal cardiovascular monitoring targets progressive aortic root
      dilatation and valvular disease for timely medical or surgical
      intervention.
    evidence:
    - reference: DOI:10.1186/s13148-024-01686-y
      reference_title: "Aortic disease and cardiomyopathy in patients with a novel DNMT3A gene variant causing Tatton-Brown–Rahman syndrome"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "From the clinical perspective, we suggest that new patients diagnosed with congenital DNMT3A variants and TBRS require close examination and follow-up for aortic dilatation and valvular disease because these conditions can progress rapidly."
      explanation: >-
        Supports targeted cardiovascular follow-up for rapidly progressive
        aortic and valvular remodeling.
  - target: Hematopoietic Clonal Perturbation and Leukemogenesis
    treatment_effect: MODULATES
    description: >-
      Clinical surveillance at each visit with a low threshold for complete
      blood count with differential enables early detection and standard
      treatment of acute leukemia.
    evidence:
    - reference: PMID:35771960
      reference_title: "Tatton-Brown-Rahman Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Low threshold for complete blood count with differential and further investigations in those who have concerning signs and symptoms of hematologic malignancy; there are no consensus guidelines regarding screening for hematologic malignancy in individuals with TBRS."
      explanation: >-
        GeneReviews management recommendation for clinical hematologic
        malignancy vigilance in TBRS.
  evidence:
  - reference: PMID:35771960
    reference_title: "Tatton-Brown-Rahman Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatments are primarily supportive and based on symptoms. Developmental delay / intellectual disability, behavioral/psychiatric diagnoses, epilepsy, joint hypermobility, kyphoscoliosis, sleep apnea, cryptorchidism, and acute leukemia are all treated in the standardized fashion."
    explanation: >-
      Summarizes symptom-directed multidisciplinary management across affected
      organ systems in TBRS.

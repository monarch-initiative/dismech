differential_diagnoses:
- name: Heyn-Sproul-Jackson syndrome
  description: >-
    Principal allelic differential diagnosis caused by heterozygous gain-of-function
    missense variants in the PWWP domain of DNMT3A, presenting with microcephaly
    and postnatal growth failure rather than overgrowth.
  distinguishing_features:
  - Microcephaly and severe pre-/postnatal growth restriction rather than tall stature and macrocephaly.
  - Gain-of-function PWWP-domain DNMT3A variants causing DNA hypermethylation at Polycomb-regulated regions rather than hypomethylation.
  disease_term:
    preferred_term: Heyn-Sproul-Jackson syndrome
    term:
      id: MONDO:0032882
      label: Heyn-Sproul-Jackson syndrome
  evidence:
  - reference: DOI:10.3389/fped.2023.1165638
    reference_title: "A novel pathogenic variant of DNMT3A associated with craniosynostosis: a case report of Heyn-Sproul-Jackson syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants of DNMT3A have been implicated in Tatton-Brown-Rahman syndrome, an overgrowth disorder with macrocephaly and intellectual disability. However, there are recent reports of variants in the same gene giving rise to an opposing clinical phenotype presenting with microcephaly, growth failure, and impaired development—named Heyn-Sproul-Jackson syndrome (HESJAS)."
    explanation: >-
      Contrasts TBRS overgrowth/macrocephaly with allelic Heyn-Sproul-Jackson
      syndrome microcephaly and growth failure.
- name: Sotos syndrome
  description: >-
    Overlapping autosomal dominant epigenetic overgrowth-intellectual disability
    syndrome caused by NSD1 haploinsufficiency.
  distinguishing_features:
  - Pathogenic NSD1 intragenic variants or 5q35 microdeletions rather than DNMT3A variants.
  - Dolichocephalic long narrow face with prominent forehead and pointed chin, contrasting with the round face, heavy horizontal eyebrows, and narrow palpebral fissures of TBRS.
  disease_term:
    preferred_term: Sotos syndrome
    term:
      id: MONDO:0019349
      label: Sotos syndrome
  evidence:
  - reference: PMID:24614070
    reference_title: "Mutations in the DNA methyltransferase gene DNMT3A cause an overgrowth syndrome with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overgrowth phenotypes associated with EZH2 and NSD1 constitutional mutations, which are called Weaver and Sotos syndrome respectively, are similar to each other and to DNMT3A overgrowth syndrome"
    explanation: >-
      Establishes Sotos syndrome (NSD1) and Weaver syndrome (EZH2) as the main
      clinically overlapping epigenetic overgrowth differential diagnoses.
notes: >-
  ORPHA:404443 maps exactly to MONDO:0014382 (OMIM:615879). Because somatic
  DNMT3A variants (especially at Arg882) are the commonest driver of age-related
  clonal hematopoiesis of indeterminate potential (CHIP) and somatic myeloid
  neoplasia, detection of a low-variant-allele-fraction DNMT3A variant in blood
  requires confirmation on non-hematopoietic tissue when mosaicism versus
  constitutional TBRS is in question.

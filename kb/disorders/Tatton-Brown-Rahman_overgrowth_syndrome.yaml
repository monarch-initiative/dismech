inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Tatton-Brown-Rahman syndrome is inherited in an autosomal dominant manner.
    Most affected individuals carry a de novo heterozygous pathogenic DNMT3A
    variant, although parent-to-child transmission has been documented in
    multigenerational families, with a 50% recurrence risk to offspring of an
    affected individual.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:35771960
    reference_title: "Tatton-Brown-Rahman Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "TBRS is an autosomal dominant disorder typically caused by a de novo pathogenic variant. Rarely, individuals diagnosed with TBRS have the disorder as the result of a DNMT3A pathogenic variant inherited from a parent."
    explanation: >-
      GeneReviews summary establishing autosomal dominant inheritance with
      predominant de novo origin and occasional parental transmission.
  - reference: DOI:10.1186/s13148-024-01686-y
    reference_title: "Aortic disease and cardiomyopathy in patients with a novel DNMT3A gene variant causing Tatton-Brown–Rahman syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tatton-Brown–Rahman syndrome (TBRS) is a rare congenital genetic disorder caused by autosomal dominant pathogenic variants in the DNA methyltransferase DNMT3A gene."
    explanation: >-
      Confirms autosomal dominant transmission in a familial adult TBRS cohort.
pathophysiology:
- name: DNMT3A loss of function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline missense, truncating, or small in-frame deletion
    variants across the PWWP, ADD, and C-terminal methyltransferase domains of
    DNMT3A reduce de novo DNA cytosine-5 methyltransferase activity or disrupt
    domain-domain and histone-H3 interactions; recurrent R882H alleles act via a
    severe dominant-negative effect on methyltransferase complexes.
  genes:
  - preferred_term: DNMT3A
    term:
      id: hgnc:2978
      label: DNMT3A
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline loss-of-function or dominant-negative variants
      across the PWWP, ADD, and catalytic methyltransferase domains of DNMT3A.
  molecular_functions:
  - preferred_term: DNA (cytosine-5-)-methyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity

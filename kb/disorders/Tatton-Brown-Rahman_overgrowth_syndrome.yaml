- name: DNMT3A
  gene_term:
    preferred_term: DNMT3A
    term:
      id: hgnc:2978
      label: DNMT3A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Causal heterozygous germline loss-of-function or dominant-negative variant
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_c34cf649-4fbd-4184-9bef-34a780766aca-2023-06-08T060000.000Z
    evidence:
    - reference: CGGV:assertion_c34cf649-4fbd-4184-9bef-34a780766aca-2023-06-08T060000.000Z
      reference_title: "DNMT3A / Tatton-Brown-Rahman overgrowth syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DNMT3A | HGNC:2978 | Tatton-Brown-Rahman overgrowth syndrome | MONDO:0014382 | AD | Definitive"
      explanation: >-
        ClinGen classifies the DNMT3A-Tatton-Brown-Rahman overgrowth syndrome
        gene-disease relationship as Definitive with autosomal dominant
        inheritance.
  variants:
  - name: p.Arg882His
    description: >-
      Recurrent germline dominant-negative missense variant at the somatic AML
      hotspot residue Arg882, producing the most severe peripheral-blood DNA
      hypomethylation phenotype among TBRS alleles.
    evidence:
    - reference: DOI:10.1038/s41467-021-24800-7
      reference_title: "Functional and epigenetic phenotypes of humans and mice with DNMT3A Overgrowth Syndrome"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Using whole genome bisulfite sequencing, we studied DNA methylation in peripheral blood cells of 11 DOS patients and found a focal, canonical hypomethylation phenotype, which is most severe with the dominant negative DNMT3A R882H mutation."
      explanation: >-
        Identifies germline DNMT3A p.Arg882His as a dominant-negative TBRS
        allele with severe focal hypomethylation.
  - name: p.Ser775Tyr
    description: >-
      Familial methyltransferase-domain missense variant segregating with adult
      TBRS, progressive aortic dilatation, mitral regurgitation, left
      ventricular dilatation, and ventricular arrhythmias.
    evidence:
    - reference: DOI:10.1186/s13148-024-01686-y
      reference_title: "Aortic disease and cardiomyopathy in patients with a novel DNMT3A gene variant causing Tatton-Brown–Rahman syndrome"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing and computational protein analysis suggested that the novel familial DNMT3A mutation Ser775Tyr is located in the methyltransferase domain, however, distant from the active site or DNA-binding loops."
      explanation: >-
        Identifies the familial p.Ser775Tyr methyltransferase-domain variant.
  - name: p.Trp297del and p.Leu648Pro
    description: >-
      De novo in-frame deletion (p.Trp297del in the PWWP domain) and missense
      variant (p.Leu648Pro in the methyltransferase domain) identified in the
      initial discovery trios of DNMT3A overgrowth syndrome.
    evidence:
    - reference: PMID:24614070
      reference_title: "Mutations in the DNA methyltransferase gene DNMT3A cause an overgrowth syndrome with intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By Sanger sequencing we confirmed the mutations, an inframe deletion p.Trp297del in COG0274 and a nonsynonymous mutation, p.Leu648Pro in COG0553, were present in the proband but not in the parents"
      explanation: >-
        Documents two founding de novo DNMT3A variants in the initial discovery
        probands.
  notes: >-
    Pathogenic germline variants span missense, nonsense, frameshift, splice,
    and whole-gene/exon deletions across the PWWP, ADD, and methyltransferase
    domains; gain-of-function PWWP-domain missense variants cause the allelic
    microcephalic dwarfism disorder Heyn-Sproul-Jackson syndrome rather than
    TBRS.
  evidence:
  - reference: DOI:10.1136/jmg-2024-110031

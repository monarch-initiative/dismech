    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A germline mouse model expressing the homologous Dnmt3a R878H mutation phenocopies most aspects of the human DOS syndrome, including the methylation phenotype and an increased incidence of spontaneous hematopoietic malignancies, suggesting that all aspects of this syndrome are caused by this mutation."
    explanation: >-
      Establishes the germline Dnmt3aR878H/+ mouse as a high-fidelity in vivo
      model of TBRS epigenetic and clinical phenotypes.

name: Tatton-Brown-Rahman overgrowth syndrome
creation_date: "2026-04-13T22:47:36Z"
category: Mendelian
description: >-
  Tatton-Brown-Rahman overgrowth syndrome (TBRS; DNMT3A overgrowth syndrome) is
  an autosomal dominant epigenetic overgrowth-intellectual disability disorder
  caused by heterozygous, predominantly de novo germline loss-of-function or
  dominant-negative variants in DNMT3A, encoding de novo DNA
  (cytosine-5-)-methyltransferase 3A. Impaired DNMT3A catalytic or
  histone-reader domain function produces focal canonical genome-wide DNA
  hypomethylation that perturbs developmental transcriptional programs across
  growth, neural, cardiovascular, and hematopoietic lineages. Cardinal clinical
  manifestations include tall stature and/or macrocephaly, obesity, mild to
  severe intellectual disability, behavioral/autism spectrum features,
  hypotonia, joint hypermobility, kyphoscoliosis, seizures, and a subtle facial
  gestalt (round face, heavy horizontal low-set eyebrows, narrow palpebral
  fissures, prominent upper central incisors) most recognizable in adolescence,
  together with variable aortic root dilatation, mitral valve regurgitation,
  cardiomyopathy, arrhythmias, and an increased predisposition to acute myeloid
  leukemia.

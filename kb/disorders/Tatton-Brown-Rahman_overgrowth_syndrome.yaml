      MONDO:0014382.
diagnosis:
- name: DNMT3A molecular genetic testing
  presence: Identification of a heterozygous pathogenic germline DNMT3A variant confirms the diagnosis.
  description: >-
    Sequence analysis (via overgrowth/intellectual disability multigene panel or
    exome/genome sequencing) with deletion/duplication analysis of DNMT3A is the
    primary confirmatory diagnostic test; mosaic or clonal hematopoiesis must be
    distinguished from constitutional germline status when testing blood DNA in
    older individuals.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Heterozygous germline pathogenic or likely pathogenic variant in DNMT3A.
  evidence:
  - reference: PMID:35771960
    reference_title: "Tatton-Brown-Rahman Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of TBRS is established in a proband with suggestive findings and a heterozygous pathogenic variant in DNMT3A identified by molecular genetic testing"
    explanation: >-
      Defines molecular confirmation of a heterozygous DNMT3A pathogenic variant
      as the diagnostic standard.
  - reference: DOI:10.1136/jmg-2024-110031
    reference_title: "Expanding the genetic and clinical spectrum of Tatton-Brown-Rahman syndrome in a series of 24 French patients"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe the first nationwide French cohort of 24 individuals with germline likely pathogenic/pathogenic variants in DNMT3A, including 17 novel variants."
    explanation: >-
      Demonstrates molecular genetic diagnosis across 24 individuals carrying
      germline DNMT3A variants.
- name: Peripheral blood DNA methylation profiling
  description: >-
    Genome-wide peripheral-blood DNA methylation profiling identifies a
    canonical focal hypomethylation phenotype in TBRS and aids functional
    interpretation of DNMT3A variants of uncertain significance.
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: >-
    Focal canonical genome-wide DNA hypomethylation signature, most pronounced
    in dominant-negative p.Arg882His carriers.

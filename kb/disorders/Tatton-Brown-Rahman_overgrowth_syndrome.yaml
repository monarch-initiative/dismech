  description: >-
    Heterozygous germline knock-in mouse expressing Dnmt3a p.Arg878His
    (orthologous to human DNMT3A p.Arg882His), which phenocopies human TBRS
    somatic overgrowth, obesity, behavioral deficits, focal canonical DNA
    hypomethylation, and increased spontaneous hematopoietic malignancies.

- name: Failure of Locus-Specific H3K4me3 Fine-Tuning at CpG-Island Promoters
  biological_scale: MOLECULAR
  description: >
    In neurons KDM5C is recruited to CpG-island promoters already decorated with
    high H3K4me3, where it trims rather than erases the mark. The consequence of
    KDM5C loss is therefore not a bulk collapse of chromatin state but a
    locus-specific failure of transcriptional fine-tuning, biased toward
    upregulation of lowly expressed target genes. KDM5C performs the same
    trimming function at activity-regulated enhancers during neuronal
    maturation. This distinction matters mechanistically: global H3K4
    methylation levels are preserved in patient fibroblasts and in Kdm5c-null
    neurons, so the pathology arises from mis-set thresholds at specific
    regulatory elements.

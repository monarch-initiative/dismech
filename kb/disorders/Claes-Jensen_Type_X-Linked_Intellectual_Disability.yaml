description: >
  Claes-Jensen type syndromic X-linked intellectual disability (MRXSCJ; OMIM
  300534; ORPHA:85279) is a rare X-linked chromatinopathy caused by
  loss-of-function variants in KDM5C at Xp11.22. KDM5C (formerly JARID1C/SMCX)
  encodes a JmjC-domain histone demethylase that removes di- and tri-methyl
  marks from histone H3 lysine 4 (H3K4me2/me3) at CpG-island promoters and
  activity-regulated enhancers. Hemizygous males present with mild to severe
  intellectual disability (most often moderate to severe) accompanied by short
  stature, microcephaly, maxillary hypoplasia, hyperreflexia and spasticity
  (including slowly progressive spastic paraplegia in the original family),
  seizures, strabismus, and aggressive or disinhibited behaviour. KDM5C is one
  of the more frequently mutated single genes in X-linked intellectual
  disability, accounting for roughly 0.7-2.8% of cases.

  IMPORTANT SCOPE NOTE — this entity is defined by KDM5C. It must not be
  conflated with (a) disorders of the KDM5 paralogues KDM5A, KDM5B or KDM5D,
  which are separate genes with separate disease associations; (b)
  Wiedemann-Steiner syndrome (KMT2A), which is the mechanistic writer-side
  mirror image of this eraser-side disorder and is frequently co-cited in KDM5C
  mechanism papers but is a distinct MONDO entity; or (c) other eponymous
  X-linked intellectual disability types such as Siderius type (PHF8) or Lubs
  type (MECP2 duplication).

  The historical "X-linked recessive" label is empirically inaccurate for
  females. KDM5C escapes X-inactivation, so females normally carry a higher
  baseline KDM5C dose; heterozygous females range from fully asymptomatic to
  moderately affected, and contemporary cohorts report intellectual disability
  or learning disability in a majority of heterozygous females. This entry
  therefore models both the recessive-annotated inheritance and the
  manifesting-heterozygote reality.

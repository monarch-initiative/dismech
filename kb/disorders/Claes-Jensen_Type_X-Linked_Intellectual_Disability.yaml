- name: Mistimed Canonical WNT Signalling and Progenitor Transition
  biological_scale: CELLULAR
  description: >
    During a defined prenatal window of corticogenesis, KDM5C directly controls
    canonical WNT output to set the timing of the primary-to-intermediate
    neural progenitor transition and therefore the tempo of neurogenesis. Loss
    of KDM5C removes this timing safeguard. The deficit is developmental-window
    dependent and, in mice and patient-derived induced pluripotent stem cells,
    transiently reversible: WNT-pathway modulation restricted to that window
    rescues the transcriptomic and chromatin landscapes in patient-derived cells
    and rescues behavioural abnormalities in Kdm5c-knockout mice. Conversely, a
    single WNT3A injection into wild-type embryonic mouse brain produces anxiety
    and memory changes. This is the most therapeutically actionable mechanism
    identified to date, but the window may close before postnatal molecular
    diagnosis is possible.

genetic:
- name: KDM5C
  association: Causative
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KDM5C
    term:
      id: hgnc:11114
      label: KDM5C
  frequency: approximately 0.7-2.8% of X-linked intellectual disability cases
  notes: >
    KDM5C (Xp11.22; formerly JARID1C, SMCX, XE169) encodes a 1560-amino-acid
    JmjC-domain histone H3K4me3/me2 demethylase. Reference transcript
    NM_004187.5. The variant spectrum is dominated by private, family-specific
    alleles with near-complete allelic heterogeneity: roughly half missense
    (with the catalytic JmjC domain the missense hotspot), with nonsense,
    frameshift and splice-site variants making up most of the remainder and
    Xp11.22 microdeletions accounting for a small fraction. Mechanism is
    haploinsufficiency/loss of function (ClinGen haploinsufficiency score 3;
    triplosensitivity 0); no dominant-negative or gain-of-function mechanism has
    been demonstrated. Somatic KDM5C mutation is a recognised driver in clear
    cell renal cell carcinoma, which is an entirely distinct disease context and
    must not be conflated with this germline neurodevelopmental disorder.
    KDM5C is not to be confused with its paralogues KDM5A, KDM5B or the
    Y-linked KDM5D, which have separate disease associations.
  case_fractions:
  - population: X-linked intellectual disability cases (literature range)
    case_fraction_low: 0.7
    case_fraction_high: 2.8
    notes: Range cited across contemporary reviews for the KDM5C share of X-linked
      intellectual disability.
    evidence:
    - reference: PMID:34089235
      reference_title: Caregiver-reported characteristics of children diagnosed with
        pathogenic variants in KDM5C.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss of function variants in the lysine demethylase 5C (KDM5C) gene account for approximately 0.7-2.8% of X-linked intellectual disability (ID) cases"
      explanation: Directly states the KDM5C case fraction among X-linked intellectual
        disability.
  - population: Ascertained XLMR families screened for brain-expressed Xp genes
    case_fraction_percent: 3.3
    cohort_size: 210
    notes: Seven of 210 XLMR families in the original gene-discovery screen; an upper
      bound reflecting ascertainment on multiplex X-linked pedigrees.
    evidence:
    - reference: PMID:15586325
      reference_title: Mutations in the JARID1C gene, which is involved in transcriptional
        regulation and chromatin remodeling, cause X-linked mental retardation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a systematic screen of brain-expressed genes from this region in 210 families with XLMR, we identified seven different mutations in JARID1C"
      explanation: Seven mutations in 210 families gives the 3.3% ascertained-family
        yield.
  evidence:
  - reference: PMID:15586325
    reference_title: Mutations in the JARID1C gene, which is involved in transcriptional

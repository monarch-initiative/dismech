- name: Neuronal Hyperexcitability and Seizure Substrate
  biological_scale: CELLULAR
  description: >
    Seizures affect roughly a third to a half of individuals and arise from a
    cell-intrinsic neuronal requirement for KDM5 activity. Two convergent lines
    define the substrate. First, KDM5C loss derepresses REST targets including
    the sodium channel gene SCN2A, itself a major epilepsy gene, with increased
    promoter H3K4me3. Second, combined KDM1A/KDM5C forebrain loss alters
    hippocampal ion channel expression and increases the intrinsic excitability
    of CA1 pyramidal neurons. In Drosophila, reducing Kdm5 in neurons but not in
    glia is sufficient to produce spontaneous and stimulus-induced seizures,
    establishing that the requirement is neuron-autonomous.

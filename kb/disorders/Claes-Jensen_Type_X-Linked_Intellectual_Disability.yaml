pathophysiology:
- name: Pathogenic KDM5C Variant
  biological_scale: MOLECULAR
  description: >
    A hemizygous (males) or heterozygous (females) pathogenic variant in KDM5C is
    the shared upstream lesion from which the two mechanistic arms of this disorder
    diverge. Most reported variants reduce or abolish JmjC-domain catalytic output,
    engaging the demethylase arm. However, catalytic loss is not required: the
    R1115H substitution leaves both enzymatic activity and protein stability intact
    yet still fails to repress KDM5C target genes, demonstrating that disruption of
    the non-enzymatic REST/HDAC1-2/G9a scaffolding role is a parallel consequence of
    the variant rather than a downstream consequence of demethylase loss. The two
    arms are therefore modelled as siblings fanning out from this node, not as a
    chain.
  evidence:
  - reference: PMID:29670509
    reference_title: "Altered Gene-Regulatory Function of KDM5C by a Novel Mutation Associated With Autism and Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The KDM5C-R1115H substitution does not have an impact on enzymatic activity nor protein stability."
    explanation: >
      A pathogenic variant that spares catalytic activity establishes that the
      scaffolding arm can be engaged independently of demethylase loss, which is
      what licenses both arms to hang off the variant node in parallel.
  - reference: PMID:29670509
    reference_title: "Altered Gene-Regulatory Function of KDM5C by a Novel Mutation Associated With Autism and Intellectual Disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that KDM5C may have non-enzymatic roles in gene regulation, and alteration of these roles contributes to MRXSCJ in this patient."
    explanation: >
      Attributes disease causation in this patient to the non-enzymatic role
      specifically, independent of the catalytic arm.
  downstream:
  - target: Loss of KDM5C H3K4me3/me2 Demethylase Function
  - target: Loss of Non-Enzymatic KDM5C Scaffolding in the REST Repressor Complex
- name: Loss of KDM5C H3K4me3/me2 Demethylase Function
  biological_scale: MOLECULAR
  description: >
    KDM5C is a JmjC-domain, Fe(II)/2-oxoglutarate-dependent histone demethylase
    that converts H3K4me3 to H3K4me2 and H3K4me1 (but not to the unmethylated
    product). Pathogenic variants abolish or reduce this catalytic output by
    several distinct routes: nonsense/frameshift alleles that eliminate the
    transcript or protein, missense alleles that destabilise the protein, and
    missense alleles within or adjacent to the catalytic JmjC/C5HC2 module that
    directly impair turnover. Variants adjacent to the accessory ARID and PHD1
    domains additionally corrupt substrate recognition by enhancing
    non-specific DNA binding. ClinGen assigns KDM5C a haploinsufficiency score
    of 3, and the gene is extremely loss-of-function intolerant, consistent with
    a pure loss-of-function mechanism rather than gain-of-function or
    dominant-negative action.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel de novo heterozygous nonsense variation of KDM5C (c.3533C > A, p.S1178X) in a sporadic 4-year-old Chinese girl"
    explanation: Documents a symptomatic de novo heterozygous female.
  - reference: PMID:36536324
    reference_title: A female case with novel KDM5C heterozygous variation presenting
      with Claes-Jensen type-like phonotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-chromosome inactivation (XCI) analysis showed no significant skewed X-inactivation."
    explanation: Shows that skewed XCI is not required for female manifestation.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    This is the authoritative HPO/OMIM inheritance annotation and correctly
    describes the hemizygous male situation: males carrying a pathogenic KDM5C
    allele are affected in essentially all reported instances. The classical
    multiplex XLMR families through which the gene was discovered were
    maternally transmitted. Contemporary trio-based ascertainment has shifted
    the picture substantially, with de novo variants now the majority mode. See
    the companion X-linked inheritance block for the female-manifestation
    caveat, which this recessive label does not capture.
  evidence:
  - reference: PMID:15586325
    reference_title: Mutations in the JARID1C gene, which is involved in transcriptional
      regulation and chromatin remodeling, cause X-linked mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families with nonsyndromic X-linked mental retardation (NS-XLMR), >30% of mutations seem to cluster on proximal Xp and in the pericentric region."
    explanation: Situates the gene within X-linked intellectual disability discovered
      through X-linked pedigrees.
  - reference: PMID:25666439
    reference_title: Mutations in the intellectual disability gene KDM5C reduce protein
      stability and demethylase activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in KDM5C are an important cause of X-linked intellectual disability in males."
    explanation: Confirms the male-predominant X-linked transmission.
- name: X-linked inheritance with manifesting heterozygous females
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    Heterozygous females are frequently affected, which the strict recessive
    label does not convey. Contemporary series report intellectual disability or
    learning disability in a majority of heterozygous females, predominantly
    mild, with behavioural disturbance common and endocrine problems more
    frequent than in males. A minority of heterozygotes are wholly asymptomatic.
    The mechanistic basis is that KDM5C escapes X-inactivation, so females
    normally express it from both X chromosomes and carry a higher baseline
    dose; heterozygosity therefore produces a partial rather than an all-or-none
    dose reduction. Skewed X-inactivation is an incomplete explanation - a
    symptomatic de novo female with no significant XCI skewing is documented.
    This has direct counselling consequences: a female fetus inheriting the
    familial variant cannot be described as an unaffected carrier.
  evidence:
  - reference: PMID:32279304
    reference_title: 'Further delineation of the female phenotype with KDM5C disease
      causing variants: 19 new individuals and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four heterozygous females were asymptomatic."
    explanation: Documents that only a minority of the 19 heterozygous females were
      unaffected.
  - reference: PMID:32279304
    reference_title: 'Further delineation of the female phenotype with KDM5C disease
      causing variants: 19 new individuals and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings provide evidence of the role of KDM5C in ID in females highlighting the increasing implication of XLID genes in females, even in sporadic affected individuals"
    explanation: Establishes female manifestation as a genuine part of the disease
      spectrum.
  - reference: PMID:36831303
    reference_title: Sexually Dimorphic Alterations in the Transcriptome and Behavior
      with Loss of Histone Demethylase KDM5C.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Initially, MRXSCJ was exclusively reported in males, while it is increasingly evident that females with heterozygous KDM5C mutations can show cognitive deficits."
    explanation: States the historical male-only framing and its correction. Tagged
      OTHER because this is a literature-summary statement inside a mouse study, not
      human data generated by that paper.
  - reference: PMID:36831303
    reference_title: Sexually Dimorphic Alterations in the Transcriptome and Behavior
      with Loss of Histone Demethylase KDM5C.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KDM5C escapes X-inactivation, thereby presenting at a higher level in females."
    explanation: Provides the dosage mechanism underlying the sex-biased severity.
      Tagged OTHER because this is an established gene-biology statement cited as
      background, not a result generated by the mouse experiments in that paper.
  - reference: PMID:36831303
    reference_title: Sexually Dimorphic Alterations in the Transcriptome and Behavior
      with Loss of Histone Demethylase KDM5C.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we report that gene expression and behavioral abnormalities are readily detectable in Kdm5c-heterozygous female mice, demonstrating the requirement for a higher KDM5C dose in females"
    explanation: Mouse heterozygote data corroborate the human female-manifestation
      finding.
  - reference: PMID:36434256
    reference_title: 'Expanding the genetics and phenotypic spectrum of Lysine-specific
      demethylase 5C (KDM5C): a report of 13 novel variants.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The pattern of X-chromosome inactivation was found to have an impact on KDM5C phenotypic expression in females of our cohort."
    explanation: Supports X-inactivation as one modulator of female expression, though
      not a complete explanation.
  - reference: PMID:36553533
    reference_title: 'Expanding the Spectrum of KDM5C Neurodevelopmental Disorder:
      A Novel De Novo Stop Variant in a Young Woman and Emerging Genotype-Phenotype
      Correlations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hereby describe a twenty-seven-year-old female patient diagnosed with moderate intellectual disability comorbid with other neuropsychiatric and behavioral issues carrying a de novo heterozygous stop variant in the KDM5C gene"
    explanation: An adult female with a de novo heterozygous truncating variant and

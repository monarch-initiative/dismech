mechanistic_hypotheses:
- hypothesis_group_id: wnt_window_rescue
  hypothesis_label: Transient developmental-window WNT inhibition is disease-modifying
  status: EMERGING
  description: >
    Because KDM5C sets neurodevelopmental tempo through WNT output during a
    circumscribed prenatal window, transient WNT-pathway inhibition confined to
    that window may be disease-modifying rather than merely symptomatic. The
    evidence is a single high-quality study in Kdm5c-knockout mice and
    patient-derived iPSCs. The central translational obstacle is that the
    window plausibly closes before postnatal molecular diagnosis is achievable.
  evidence:
  - reference: PMID:38383780
    reference_title: WNT signalling control by KDM5C during development affects cognition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with WNT signalling modulators at specific times reveal that only a transient alteration of the canonical WNT signalling pathway is sufficient to rescue the transcriptomic and chromatin landscapes in patient-derived cells"
    explanation: Window-restricted pharmacological rescue in patient-derived iPSC cultures.
  - reference: PMID:38383780
    reference_title: WNT signalling control by KDM5C during development affects cognition.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "WNT inhibition during this developmental period also rescues behavioural changes of Kdm5c knockout mice."
    explanation: The in vivo arm of the same result - window-restricted WNT inhibition
      rescues behaviour in the mouse model.
- hypothesis_group_id: h3k4_writer_eraser_rebalancing
  hypothesis_label: Rebalancing the KMT2A/KDM5C writer-eraser pair ameliorates the
    phenotype
  status: EMERGING
  description: >
    KDM5C (eraser) and KMT2A (writer) act on the same H3K4 mark, and their
    respective loss-of-function mouse models share reduced dendritic spines and
    increased aggression. Combined loss of both mutually suppresses these
    phenotypes, suggesting that pharmacological reduction of KMT2A activity
    could ameliorate KDM5C deficiency. This is a genetic proof of principle in
    mice only; no pharmacological agent has been tested in this context. Note
    that KMT2A is the Wiedemann-Steiner syndrome gene - it is cited here purely
    as a mechanistic counterweight, and Wiedemann-Steiner syndrome is a distinct
    disease entity, not a synonym or subtype of this disorder.
  evidence:
  - reference: PMID:32483278
    reference_title: 'Mutually suppressive roles of KMT2A and KDM5C in behaviour,
      neuronal structure, and histone H3K4 methylation.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Double mutation of Kmt2a and Kdm5c clearly reversed dendritic morphology, key behavioral traits including aggression, and partially corrected altered transcriptomes and H3K4me landscapes."
    explanation: Genetic epistasis evidence for mutual suppression between the writer
      and eraser.
  - reference: PMID:32483278
    reference_title: 'Mutually suppressive roles of KMT2A and KDM5C in behaviour,
      neuronal structure, and histone H3K4 methylation.'
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "provides a proof of principle for balancing a single writer-eraser pair to ameliorate their associated disorders"
    explanation: The authors frame this explicitly as a proof of principle, not an
      established therapy.
- hypothesis_group_id: hdac_inhibition_kdm5c_restoration
  hypothesis_label: HDAC inhibition restores KDM5C expression and H3K4me3 signalling
  status: EMERGING
  description: >
    KDM5C sits at the intersection of transcriptional axes controlled by ARX,
    ZNF711 and PHF8, all of which are themselves X-linked neurodevelopmental
    disorder genes. The FDA-approved histone deacetylase inhibitor SAHA
    (vorinostat) rescued KDM5C depletion, recovered H3K4me3 signalling and
    improved neuronal differentiation in Arx-knockout mouse embryonic
    stem-cell-derived neurons, and improved behaviour in ARX-deficient C.
    elegans. IMPORTANT LIMITATION: this rescue was demonstrated in models where
    KDM5C is transcriptionally downregulated because its upstream activator ARX
    is lost, not in models carrying a KDM5C coding variant. Raising expression
    of a mutant KDM5C allele would not be expected to help in most
    Claes-Jensen genotypes, so this hypothesis is at best applicable to a
    hypothetical regulatory-variant subset and should not be read as a
    therapeutic lead for typical KDM5C loss-of-function disease.
  evidence:
  - reference: PMID:31691806
    reference_title: Histone demethylase KDM5C is a SAHA-sensitive central hub at
      the crossroads of transcriptional axes involved in multiple neurodevelopmental
      disorders.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "In Arx-KO murine ES-derived neurons, SAHA was able to rescue KDM5C depletion, recover H3K4me3 signalling and improve neuronal differentiation."
    explanation: Demonstrates pharmacological restoration of KDM5C level and H3K4me3
      signalling, but in an ARX-deficient rather than a KDM5C-mutant model, hence
      PARTIAL support.
  - reference: PMID:31691806
    reference_title: Histone demethylase KDM5C is a SAHA-sensitive central hub at
      the crossroads of transcriptional axes involved in multiple neurodevelopmental
      disorders.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "our studies indicate that KDM5C is a conserved and druggable effector molecule across a number of NDDs for whom the use of SAHA may be considered a potential therapeutic strategy"
    explanation: The authors' own framing as a potential rather than established strategy.
phenotypes:
- name: Intellectual Disability
  category: Neurological
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >
    The defining feature. In hemizygous males intellectual disability is
    essentially fully penetrant and skews moderate to severe; in heterozygous
    females it is incompletely penetrant and skews mild to moderate. A single
    reported male with a typical Claes-Jensen KDM5C variant had no intellectual
    disability, so penetrance in males is very high but not absolute.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:32279304
    reference_title: 'Further delineation of the female phenotype with KDM5C disease
      causing variants: 19 new individuals and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KDM5C variants are one of the major causes of moderate to severe XLID."
    explanation: Establishes moderate-to-severe intellectual disability as the core
      disease feature.
  - reference: PMID:34089235
    reference_title: Caregiver-reported characteristics of children diagnosed with
      pathogenic variants in KDM5C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous studies have found that males present with moderate to severe ID with significant syndromic comorbidities such as epilepsy, short stature, and craniofacial abnormalities."
    explanation: Confirms the severity distribution in males across prior cohorts.
  - reference: PMID:18697827
    reference_title: Mutations in JARID1C are associated with X-linked mental retardation,
      short stature and hyperreflexia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical findings of the nine affected males from the four different families included mental retardation (100%), short stature (55%), hyperreflexia (78%), seizures (33%) and aggressive behaviour (44%)."
    explanation: Quantitative cohort data giving 100% frequency of intellectual disability
      in affected males, supporting the VERY_FREQUENT band.
  - reference: PMID:40125771
    reference_title: 'Atypical Ophthalmological Manifestations of Claes-Jensen Syndrome
      Without Intellectual Disability: A Case Report.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "An 8-year-old boy with prenatal-onset short stature, ophthalmological abnormalities, and dysmorphic features had a KDM5C variant typically linked to Claes-Jensen syndrome with intellectual disability, which he did not have."
    explanation: Documents the exception showing male penetrance for intellectual disability
      is not absolute.
- name: Severe Intellectual Disability
  category: Neurological

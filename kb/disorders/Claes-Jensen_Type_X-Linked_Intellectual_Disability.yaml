    explanation: Gene-discovery paper establishing JARID1C/KDM5C as the causative gene.
  - reference: PMID:29670509
    reference_title: Altered Gene-Regulatory Function of KDM5C by a Novel Mutation
      Associated With Autism and Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in KDM5C cause Mental Retardation, X-linked, Syndromic, Claes-Jensen type (MRXSCJ, OMIM #300534) and are one of the most common causes of X-linked ID."
    explanation: Explicitly binds KDM5C to the MRXSCJ/OMIM 300534 entity curated here.
  - reference: PMID:25666439

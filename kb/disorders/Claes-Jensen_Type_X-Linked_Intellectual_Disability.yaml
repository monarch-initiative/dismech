prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >
    No population-based prevalence or incidence estimate exists. The disorder is
    quantified in the literature only as a share of X-linked intellectual
    disability cases (see Genetic.case_fractions), not as a population rate. The
    largest aggregation is the RARE-X meta-analysis, which reached 269
    individuals across 130 families and 122 unique variants. Reported cases come
    from Europe, the Americas, the Middle East and East Asia with no founder
    effect or geographic clustering; apparent geography reflects exome-sequencing
    access.
  evidence:
  - reference: PMID:41537560
    reference_title: Individuals with reported and novel KDM5C variants present with
      seizures, a feature recapitulated in a Drosophila model.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants that disrupt the function of the chromatin regulator KDM5C cause a rare neurodevelopmental disorder (KDM5C-NDD)"
    explanation: Confirms rarity; no population rate is reported in the literature.
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >
    Molecular diagnosis is the definitive test; there are no formal clinical
    diagnostic criteria for this disorder and the phenotype is not specific
    enough to be distinguished clinically from other X-linked intellectual
    disability. Trio-based exome or genome sequencing is first-line for
    unexplained global developmental delay, and the trio design matters because
    de novo variants are now the majority mode. Chromosomal microarray covers
    the small Xp11.22 microdeletion fraction. Synonymous and splice-region
    variants can be pathogenic through splicing effects, so RNA studies should
    be considered before dismissing a segregating variant of this type.
  evidence:
  - reference: PMID:39835750
    reference_title: 'Clinical Features and Genetic Characteristics of XLID Patients
      With KDM5C Gene Mutations: Insights on Phenotype-Genotype Correlations From
      175 Previous Cases and Identification of a Novel Variant.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study identified a novel variant, c.2704C>T:p.Gln902X, located in exon 19 of the KDM5C gene (NM_004187.5) using Whole exome sequencing (WES), highlighting the utility of this approach in identifying rare genetic disorders."
    explanation: Demonstrates whole-exome sequencing as the diagnostic modality in
      practice.
- name: Peripheral Blood DNA Methylation Episignature
  description: >
    Claes-Jensen syndrome has a validated peripheral-blood DNA methylation
    episignature comprising 1769 CpGs and 9 genomic regions, derived from 7
    affected males against 56 matched controls. Healthy heterozygous female
    carriers show intermediate, distinguishable changes, so the assay identifies
    carriers as well as patients. Its principal clinical use is resolving
    variants of uncertain significance and confirming carrier status. The
    reported 100% accuracy figures come from a 7-patient training cohort and
    reflect specificity against large control sets more than sensitivity across
    the full allelic spectrum; independent multicentre work has shown published
    episignatures perform very unequally, so this performance should not be
    generalised.
  evidence:
  - reference: PMID:29456765
    reference_title: Peripheral blood epi-signature of Claes-Jensen syndrome enables
      sensitive and specific identification of patients and healthy carriers with
      pathogenic mutations in KDM5C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome-wide DNA methylation analysis of 7 male patients affected with Claes-Jensen syndrome and 56 age- and sex-matched controls identified a specific DNA methylation defect (epi-signature) in the peripheral blood of these patients, including 1769 individual CpGs and 9 genomic regions."
    explanation: Defines the episignature and the cohort it was derived from.
  - reference: PMID:29456765
    reference_title: Peripheral blood epi-signature of Claes-Jensen syndrome enables
      sensitive and specific identification of patients and healthy carriers with
      pathogenic mutations in KDM5C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six healthy female carriers showed less pronounced but distinctive changes in the same regions enabling their differentiation from both patients and controls."
    explanation: Establishes carrier detection capability.
  - reference: PMID:29456765
    reference_title: Peripheral blood epi-signature of Claes-Jensen syndrome enables
      sensitive and specific identification of patients and healthy carriers with
      pathogenic mutations in KDM5C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral blood epi-signature in Claes-Jensen syndrome can be used for molecular diagnosis and carrier identification and assist with interpretation of genetic variants of unknown clinical significance in the KDM5C gene."
    explanation: States the intended clinical applications.
differential_diagnoses:
- name: Wiedemann-Steiner syndrome
  disease_term:
    preferred_term: Wiedemann-Steiner syndrome
    term:
      id: MONDO:0011518
      label: Wiedemann-Steiner syndrome
  description: >
    The mechanistic mirror image of this disorder: KMT2A writes the same H3K4
    methyl mark that KDM5C erases, and the two mouse models share reduced
    dendritic spines and increased aggression. Because KMT2A is frequently
    discussed in KDM5C mechanism papers, this pairing is a recognised source of
    entity confusion; the two are distinct diseases with distinct genes, and a
    KDM5C entry must not absorb Wiedemann-Steiner content.
  distinguishing_features:
  - Caused by autosomal dominant KMT2A variants, not X-linked KDM5C variants
  - Hypertrichosis cubiti and a distinct facial gestalt
  - No sex-biased severity, unlike the male-predominant severity of Claes-Jensen type
  evidence:
  - reference: PMID:32483278
    reference_title: 'Mutually suppressive roles of KMT2A and KDM5C in behaviour,
      neuronal structure, and histone H3K4 methylation.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show functional interactions of a writer-eraser duo, KMT2A and KDM5C, which are responsible for Wiedemann-Steiner Syndrome (WDSTS), and mental retardation X-linked syndromic Claes-Jensen type (MRXSCJ), respectively"
    explanation: Explicitly separates the two gene-disease pairs while documenting
      their mechanistic relationship.
- name: Fragile X syndrome
  disease_term:
    preferred_term: fragile X syndrome
    term:
      id: MONDO:0010383
      label: fragile X syndrome
  description: >
    The most common inherited cause of intellectual disability in males and a
    routine exclusion in any X-linked intellectual disability work-up. The
    testicular finding usefully discriminates: macroorchidism is characteristic
    of fragile X, whereas decreased testicular size is the annotated finding in
    Claes-Jensen type.
  distinguishing_features:
  - CGG repeat expansion in FMR1 rather than a KDM5C sequence variant
  - Macroorchidism, in contrast to decreased testicular size in Claes-Jensen type
  - Long face and large ears
  - Requires repeat-expansion testing rather than sequencing
treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: >
    There is no disease-modifying therapy, no approved drug, no gene therapy and
    no interventional clinical trial for this disorder. Management is entirely
    symptomatic and supportive, centred on early developmental intervention and
    coordinated multidisciplinary follow-up covering development, growth,
    seizures, vision, behaviour, mobility and bowel function.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34089235
    reference_title: Caregiver-reported characteristics of children diagnosed with
      pathogenic variants in KDM5C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a rare disorder, its etiology and natural history remain an area of active investigation, with treatment limited to symptom management."
    explanation: States directly that treatment is limited to symptom management.
- name: Speech and Language Therapy
  description: >
    Speech and language impairment is near-universal and expressive language is
    disproportionately affected, so early speech therapy with augmentative and
    alternative communication where needed is a core intervention.
  treatment_term:
    preferred_term: Speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:32279304
    reference_title: 'Further delineation of the female phenotype with KDM5C disease
      causing variants: 19 new individuals and review of the literature.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "four also had a language impairment mainly affecting expression"
    explanation: Documents the expressive language impairment this intervention targets;
      no trial evidence exists for the intervention itself in this disorder.
- name: Physical Therapy and Spasticity Management
  description: >
    Physiotherapy, stretching and orthotics target the spasticity, hyperreflexia
    and progressive spastic paraplegia seen in a subset, aiming to preserve gait
    and prevent contractures. Pharmacological adjuncts used in general practice
    include baclofen and botulinum toxin; there is no disorder-specific evidence
    base for either.
  treatment_term:
    preferred_term: Physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
  evidence:
  - reference: PMID:10982473
    reference_title: Novel syndromic form of X-linked complicated spastic paraplegia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "slowly progressive spastic paraplegia"
    explanation: Documents the progressive motor target of this intervention; the
      intervention itself is standard practice, not disorder-specific evidence.
- name: Antiseizure Pharmacotherapy
  description: >
    Standard antiseizure medication selected by seizure semiology. Seizures
    affect roughly a third to a half of individuals with a median first-seizure
    age of about 2 years, so EEG at diagnosis and ongoing seizure review are
    indicated. No disorder-specific antiseizure agent or regimen has been
    studied; there is no evidence favouring any particular drug in KDM5C-related
    disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  target_mechanisms:
  - target: Neuronal Hyperexcitability and Seizure Substrate
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:41537560
    reference_title: Individuals with reported and novel KDM5C variants present with
      seizures, a feature recapitulated in a Drosophila model.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "seizures are a frequent feature in both hemizygous males and heterozygous females with KDM5C variants, with over a third of individuals reporting at least one seizure"
    explanation: Establishes the seizure burden that justifies antiseizure therapy;
      no trial evidence exists for any specific agent in this disorder.
- name: Ophthalmological Assessment and Correction
  description: >
    Formal ophthalmological examination at diagnosis and periodically thereafter.
    Strabismus and abnormal eye movements are common and frequently
    under-recognised, and untreated strabismus carries a preventable amblyopia
    risk, making this one of the highest-yield underused assessments in the
    disorder. Management is refractive correction and, where indicated,
    strabismus surgery.
  treatment_term:
    preferred_term: Surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  evidence:
  - reference: PMID:40125771
    reference_title: 'Atypical Ophthalmological Manifestations of Claes-Jensen Syndrome
      Without Intellectual Disability: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This atypical presentation highlights the importance of ophthalmological assessments in X-linked syndromes with variable expressivity, even without classic features."
    explanation: Explicit recommendation for ophthalmological assessment in this disorder.
- name: Behavioural Support and Psychotropic Management
  description: >
    Behavioural intervention is first-line for the aggression, impulsivity,
    anxiety and autism-spectrum features that caregivers consistently rate as
    the greatest burden, with psychotropic medication reserved for when
    behavioural approaches are insufficient. Polypharmacy is a recognised
    iatrogenic risk in this population.
  treatment_term:
    preferred_term: Behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Aggressive behavior
    term:
      id: HP:0000718
      label: Aggressive behavior
  - preferred_term: Autism
    term:
      id: HP:0000717
      label: Autism
  evidence:
  - reference: PMID:34089235
    reference_title: Caregiver-reported characteristics of children diagnosed with
      pathogenic variants in KDM5C.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "more than half of individuals reported a diagnosis of autism spectrum disorder or described features consistent with this spectrum"
    explanation: Quantifies the behavioural burden this intervention targets; the
      intervention itself is standard practice.
- name: Genetic Counseling and Cascade Testing
  description: >
    Counselling must be updated for current evidence. De novo variants are now
    the majority mode, so recurrence risk in an apparently sporadic family is far
    lower than the classic X-linked-recessive family framing implies (with an
    empiric allowance for gonadal mosaicism). Crucially, a daughter who inherits
    the familial variant cannot be counselled as an unaffected carrier: a
    majority of heterozygous females have learning disability or intellectual
    disability, and a substantial minority have seizures. Cascade testing of
    at-risk female relatives is therefore both a reproductive and a diagnostic
    intervention. The DNA methylation episignature independently identifies
    carriers. Prenatal diagnosis and preimplantation genetic testing are
    available once the familial variant is known.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32279304
    reference_title: 'Further delineation of the female phenotype with KDM5C disease
      causing variants: 19 new individuals and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease expression of XLID in females should be taken into consideration for genetic counseling."
    explanation: Direct recommendation that female disease expression change counselling
      practice.
  - reference: PMID:29456765
    reference_title: Peripheral blood epi-signature of Claes-Jensen syndrome enables
      sensitive and specific identification of patients and healthy carriers with
      pathogenic mutations in KDM5C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can be used for molecular diagnosis and carrier identification"
    explanation: Supports episignature-based carrier identification as an adjunct
      to cascade testing.
animal_models:
- species: Mus musculus
  genotype: Kdm5c knockout (constitutive and forebrain-restricted inducible)
  category: KNOCKOUT
  description: >
    The primary mammalian model. Hemizygous Kdm5c-knockout males recapitulate
    the core adaptive and cognitive phenotype - impaired social behaviour, memory
    deficits and aggression - together with abnormal dendritic arborisation,
    spine anomalies and altered transcriptomes, while adult brain cytoarchitecture
    remains grossly normal. Heterozygous females also show detectable gene
    expression and behavioural abnormalities, mirroring the human
    manifesting-heterozygote finding. Forebrain-restricted inducible knockouts
    separate the developmental silencing role from the lifelong genome
    surveillance role.
  evidence:
  - reference: PMID:26804915
    reference_title: A Mouse Model of X-linked Intellectual Disability Associated
      with Impaired Removal of Histone Methylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our mouse behavioral data strongly suggest that KDM5C mutations are causal to XLID"
    explanation: The authors' conclusion that the model supports causality.
  - reference: PMID:36831303
    reference_title: Sexually Dimorphic Alterations in the Transcriptome and Behavior
      with Loss of Histone Demethylase KDM5C.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mouse model of MRXSCJ, male Kdm5c-hemizygous knockout animals, recapitulates key features of human male patients."
    explanation: Confirms face validity of the male hemizygous mouse model.
- species: Drosophila melanogaster
  genotype: kdm5 A512P knock-in and neuronal kdm5 knockdown
  category: KNOCKIN
  description: >
    Drosophila carries a single Kdm5 gene, making it a clean system for
    dissecting demethylase-dependent effects. A knock-in allele analogous to a
    human KDM5C disease missense variant produces impaired learning and memory
    with downregulation of ribosomal assembly genes and reduced translation.
    Separately, neuronal but not glial knockdown produces spontaneous and
    stimulus-induced seizures, establishing the cell-autonomous neuronal
    requirement. The ribosome/translation arm has not been demonstrated in
    mammals.
  evidence:
  - reference: PMID:29490272
    reference_title: A Drosophila Model of Intellectual Disability Caused by Mutations
      in the Histone Demethylase KDM5.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptome analysis of kdm5A512P flies revealed a striking downregulation of genes required for ribosomal assembly and function and a concomitant reduction in translation."
    explanation: Documents the translation phenotype in the fly disease-allele model.
  - reference: PMID:29490272
    reference_title: A Drosophila Model of Intellectual Disability Caused by Mutations
      in the Histone Demethylase KDM5.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "kdm5A512P flies also showed impaired learning and/or memory."
    explanation: Cognitive face validity of the fly model.
discussions:
- discussion_id: kdm5c_female_penetrance_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What determines whether a heterozygous KDM5C female is affected, given that
    skewed X-inactivation does not reliably explain it?
  attaches_to:
  - pathophysiology#Loss of KDM5C H3K4me3/me2 Demethylase Function
  rationale: >
    Skewed X-inactivation is the conventional explanation for variable
    expression in X-linked disease, but it is a poor fit here. KDM5C escapes
    X-inactivation, so the inactive-X allele still contributes, and a
    symptomatic de novo female with no significant XCI skewing is documented.
    Meanwhile X-inactivation pattern did correlate with phenotypic expression in
    another cohort. Without a mechanism, counselling for a female fetus carrying
    a familial variant cannot be individualised beyond a population-level
    probability.
  proposed_experiments:
  - experiment_id: xci_allele_specific_expression
    name: Allele-specific KDM5C expression versus XCI in heterozygous females
    description: >
      Quantify allele-specific KDM5C expression in accessible tissues from
      affected versus unaffected heterozygous females, paired with a
      quantitative X-chromosome inactivation assay, to test whether residual
      KDM5C dose rather than XCI pattern predicts phenotype.
    decision_criterion: >
      Allele-specific KDM5C expression separates affected from unaffected
      heterozygotes more cleanly than the XCI ratio does.
    would_support:
    - KDM5C dose, not XCI skewing per se, determines female manifestation.
    would_refute:
    - XCI skewing remains the dominant determinant and the escape-from-XCI argument is not phenotypically relevant.
  - experiment_id: xci_single_cell_mosaic
    name: Single-cell profiling of heterozygous female patient-derived neurons
    description: >
      Single-cell transcriptomic profiling of patient-derived neurons from
      heterozygous females to test whether mosaic cell-by-cell KDM5C dose,
      rather than tissue-average dose, predicts the phenotype.
    decision_criterion: >
      The fraction of neurons falling below a KDM5C expression threshold
      correlates with clinical severity better than mean expression.
    would_support:
    - A cellular-mosaic threshold model of female manifestation.
    would_refute:
    - A simple average-dose model of female manifestation.
  evidence:
  - reference: PMID:36536324
    reference_title: A female case with novel KDM5C heterozygous variation presenting
      with Claes-Jensen type-like phonotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-chromosome inactivation (XCI) analysis showed no significant skewed X-inactivation."
    explanation: A symptomatic heterozygous female without XCI skewing shows the conventional
      explanation is insufficient.
  - reference: PMID:36434256
    reference_title: 'Expanding the genetics and phenotypic spectrum of Lysine-specific
      demethylase 5C (KDM5C): a report of 13 novel variants.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The pattern of X-chromosome inactivation was found to have an impact on KDM5C phenotypic expression in females of our cohort."
    explanation: A contrary cohort finding in which XCI pattern did track phenotypic
      expression, making this an unresolved conflict rather than a settled question.
- discussion_id: kdm5c_wnt_window_translatability
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Is the WNT-dependent developmental window that permits phenotypic rescue
    in Kdm5c-knockout mice still open at the age at which human patients are diagnosed?
  attaches_to:
  - pathophysiology#Mistimed Canonical WNT Signalling and Progenitor Transition
  rationale: >
    The rescue result is strong but window-bounded: only transient WNT
    modulation during a specific developmental period rescues transcriptomic,
    chromatin and behavioural phenotypes. In humans, KDM5C-related disease is
    typically diagnosed postnatally after developmental delay becomes apparent,
    by which time the corticogenesis window that the mouse experiment targets
    has almost certainly closed. Whether any residual window exists in humans,
    and whether the mouse window maps onto a human developmental stage at all,
    is unresolved and determines whether this mechanism is therapeutically
    reachable or only explanatory.
  proposed_experiments:
  - experiment_id: wnt_window_organoid_mapping
    name: Map the human WNT-sensitive window in cortical organoids
    description: >
      Define the developmental interval during which WNT modulation rescues
      transcriptomic and chromatin phenotypes in KDM5C patient-derived human
      cortical organoids, and align it against the equivalent mouse
      corticogenesis stages.
    decision_criterion: >
      A WNT-sensitive interval is identifiable in human organoids and can be
      mapped onto a defined human gestational stage.
    would_support:
    - The mouse rescue window has a definable human counterpart.
    would_refute:
    - The rescue window is a mouse-specific developmental feature without a human analogue.
  - experiment_id: wnt_postnatal_modulation
    name: Postnatal-equivalent WNT modulation in Kdm5c-knockout mice
    description: >
      Test whether WNT modulation delivered after the previously defined
      embryonic window confers any partial behavioural or transcriptomic
      benefit in Kdm5c-knockout mice.
    decision_criterion: >
      Any statistically significant behavioural improvement after postnatal
      dosing relative to vehicle.
    would_support:
    - A residual therapeutic window exists after the age at which human diagnosis is realistic.
    would_refute:
    - The mechanism is explanatory only and not therapeutically reachable postnatally.
  evidence:
  - reference: PMID:38383780
    reference_title: WNT signalling control by KDM5C during development affects cognition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "only a transient alteration of the canonical WNT signalling pathway is sufficient to rescue the transcriptomic and chromatin landscapes in patient-derived cells"
    explanation: The rescue is explicitly time-restricted, which is precisely what
      makes human translatability uncertain.
- discussion_id: kdm5c_single_cell_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which specific neuronal subtypes and brain regions mediate the cognitive
    and behavioural phenotype of KDM5C loss?
  attaches_to:
  - pathophysiology#Reduced Dendritic Arborisation and Spine Density
  rationale: >
    Mouse data show strongly region-specific consequences, with the amygdala
    considerably more affected than the frontal cortex in both transcriptome and
    dendritic morphology. No single-cell or spatial transcriptomic dataset
    specific to this disorder has been published, so the cell types that
    actually mediate the phenotype remain inferred rather than identified. This
    limits both mechanistic understanding and the design of any cell-type-directed
    therapy.
  proposed_experiments:
  - experiment_id: kdm5c_snrnaseq_spatial_atlas
    name: Single-nucleus and spatial transcriptomics of Kdm5c-knockout brain
    description: >
      Single-nucleus RNA-seq and spatial transcriptomics across amygdala,
      hippocampus and cortex in Kdm5c-knockout versus wild-type mice at
      multiple developmental stages, to identify which neuronal subtypes carry
      the transcriptional lesion.
    decision_criterion: >
      One or a small number of neuronal subtypes account for the majority of
      differentially expressed genes.
    would_support:
    - A cell-type-restricted mechanism amenable to targeted intervention.
    would_refute:
    - A pan-neuronal mechanism with no privileged cell-type target.
  - experiment_id: kdm5c_celltype_conditional_ko
    name: Cell-type-restricted conditional Kdm5c deletion
    description: >
      Conditional Kdm5c deletion restricted to defined excitatory and
      inhibitory neuronal subtypes to test which population is sufficient to
      produce the behavioural phenotype.
    decision_criterion: >
      Deletion in a single defined subtype reproduces the social, memory or
      aggression phenotype of the global knockout.
    would_support:
    - Sufficiency of a specific neuronal population for the behavioural phenotype.
    would_refute:
    - A requirement for distributed loss across multiple neuronal populations.
  evidence:
  - reference: PMID:26804915
    reference_title: A Mouse Model of X-linked Intellectual Disability Associated
      with Impaired Removal of Histone Methylation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our findings suggest that loss of KDM5C function may impact gene expression in multiple regulatory pathways relevant to the clinical phenotypes"
    explanation: The authors themselves leave open which pathways and cell types are
      the operative ones.

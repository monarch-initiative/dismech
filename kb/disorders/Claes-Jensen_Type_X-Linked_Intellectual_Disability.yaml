- name: Delayed Speech and Language Development
  category: Neurological
  frequency: VERY_FREQUENT
  description: >
    Speech and language impairment, with expressive language disproportionately
    affected, is among the most consistent features and is a leading driver of
    functional dependency. Communication challenges were reported by 93% of
    caregivers in the RARE-X registry cohort; expressive language impairment is
    prominent even in mildly affected heterozygous females.
  notes: >
    Frequency basis (docs/frequency-evidence-guidelines.md, Patterns C and D-1):
    no cited abstract reports a percentage for this phenotype. VERY_FREQUENT
    rests on PMID:36434256 describing the condition as "characterized by ...
    intellectual disability with speech disorders" - a highly-characteristic
    wording that maps to the VERY_FREQUENT band - corroborated by the RARE-X 93%
    communication-challenge figure, which appears in that paper's result tables
    rather than its abstract and therefore cannot be quoted as a snippet. The
    4/19 language-impairment count in PMID:32279304 is a female-only,
    expression-specific subset and is not a competing overall frequency estimate.

- name: Reduced Dendritic Arborisation and Spine Density
  biological_scale: TISSUE
  description: >
    The convergent structural endpoint of the transcriptional lesion is a
    hypoplastic dendritic tree with reduced spine density and immature spine
    morphology, most pronounced in amygdalar and cortical pyramidal neurons.
    Reduced dendritic development is seen with KDM5C knockdown in primary
    mammalian neurons and in zebrafish, and dendritic spine loss is a shared
    feature of Kdm5c-null and Kmt2a-null mice - the eraser and writer of the
    same mark - indicating that spine density is set by the balance of the
    H3K4-methylation writer-eraser pair rather than by either enzyme alone.
    There is no neurodegeneration, gliosis or tissue destruction; the adult
    Kdm5c-knockout cortex, hippocampus and amygdala are cytoarchitecturally
    normal.

- name: Loss of Non-Enzymatic KDM5C Scaffolding in the REST Repressor Complex
  biological_scale: MOLECULAR
  description: >
    KDM5C also acts non-catalytically as a component of a repressor assembly.
    An SMCX/KDM5C complex contains the histone deacetylases HDAC1 and HDAC2, the
    H3K9 methyltransferase G9a, and the transcriptional repressor REST, and
    co-occupies neuron-restrictive silencer elements in the promoters of REST
    target genes including SCN2A and SYN1. Depleting KDM5C derepresses these
    targets with a concomitant rise in promoter H3K4me3. Critically, the
    patient variant R1115H has entirely normal catalytic activity and protein
    stability yet still fails to suppress target genes, establishing that loss
    of demethylase activity alone is an incomplete account of the disease and
    that a scaffolding/recruitment arm exists in parallel.

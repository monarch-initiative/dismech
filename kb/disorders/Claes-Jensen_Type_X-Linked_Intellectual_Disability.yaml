variants:
- name: KDM5C p.Arg1115His
  description: >
    A missense variant identified in an individual with MRXSCJ-like features plus
    autism. Functionally exceptional: it has no measurable effect on either
    enzymatic activity or protein stability, yet when overexpressed in
    post-mitotic neurons it fails to fully suppress KDM5C target genes and
    additionally perturbs a distinct gene set. It is the primary evidence that
    KDM5C has disease-relevant non-enzymatic roles, and the reason the
    pathophysiology here models an enzymatic and a scaffolding arm separately.
  gene:
    preferred_term: KDM5C
    term:
      id: hgnc:11114
      label: KDM5C
  type: MISSENSE
  evidence:
  - reference: PMID:29670509
    reference_title: Altered Gene-Regulatory Function of KDM5C by a Novel Mutation
      Associated With Autism and Intellectual Disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report a novel KDM5C mutation, R1115H, identified in an individual displaying MRXSCJ-like symptoms."
    explanation: Identifies the variant and the clinical context.
  - reference: PMID:29670509
    reference_title: Altered Gene-Regulatory Function of KDM5C by a Novel Mutation
      Associated With Autism and Intellectual Disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "when overexpressed in post-mitotic neurons, KDM5C-R1115H failed to fully suppress expression of target genes, while the mutant also affected expression of a distinct set of genes compared to KDM5C-wildtype"
    explanation: Establishes the functional defect despite intact catalysis.
- name: KDM5C p.Val1075Tyrfs*2
  description: >
    A frameshift variant (c.3223delG) that results in complete loss of KDM5C
    protein - the cleanest example of the null-allele end of the spectrum.
  gene:
    preferred_term: KDM5C
    term:
      id: hgnc:11114
      label: KDM5C
  type: FRAMESHIFT
  evidence:
  - reference: PMID:25666439
    reference_title: Mutations in the intellectual disability gene KDM5C reduce protein
      stability and demethylase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report and characterize a novel nonsense mutation, c.3223delG (p.V1075Yfs*2), which leads to loss of KDM5C protein."
    explanation: Documents complete protein loss for this allele.
- name: KDM5C p.Ser1178Ter
  description: >
    A de novo heterozygous nonsense variant (c.3533C>A) in a 4-year-old girl with
    a Claes-Jensen-type phenotype. Notably, X-chromosome inactivation analysis
    showed no significant skewing, undercutting the simple assumption that
    female expression is governed by skewed XCI.

- name: Derepression of Non-Neuronal, Germline and Cryptic Transcriptional Programs
  biological_scale: CELLULAR
  description: >
    The direct transcriptional consequence of failed H3K4me3 trimming is
    spurious activation of gene programs that should be silent in neurons. In
    the developing brain this manifests as failure to silence germline genes
    during differentiation; in the adult brain KDM5C serves an ongoing genome
    surveillance role, preventing activation of non-neuronal and cryptic
    promoters. This surveillance function is shared with, and reinforced by, the
    related demethylase KDM1A: combined forebrain loss of both enzymes produces
    stronger ectopic expression of non-neuronal genes in hippocampal neurons and
    thousands of de novo H3K4me3-enriched regions. The net effect is progressive
    erosion of neuronal transcriptional identity.

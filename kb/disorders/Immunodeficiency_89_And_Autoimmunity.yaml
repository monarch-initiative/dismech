  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "flow cytometry analysis showed that the numbers of CD14highCD16+, CD14+CD16high, and monocyte-derived HLADR+CD11c+CD16+cells were all reduced in the patient compared with the respective numbers in the sibling"
    explanation: Documents the reduced monocyte and dendritic cell populations.
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a cytokine assay showed that IL-8, GROα, MCP-1, MIP-1α, SDF1α, and other chemokine family members were significantly elevated"
    explanation: Documents the raised chemokines that accompany the cell depletion.
  - reference: PMID:29773596
    reference_title: "CARD10, a CEBPE target involved in granulocytic differentiation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Silencing Card10 in a human cell line and in murine primary cells impaired granulopoiesis, affecting expression of genes involved in myeloid cell development and function."
    explanation: Independent functional support for a myeloid requirement for CARD10, from outside the single reported family. Marked INDIRECT because it is a silencing experiment in cell lines and murine primary cells rather than an observation in these patients.
  downstream:
  - target: Recurrent infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mucosal Barrier Inflammation
  biological_scale: TISSUE
  description: >-
    CARD10 is highly expressed in gastrointestinal epithelium and the CBM complex
    participates in TLR4 signalling there, which is the basis for the long-standing
    hypothesis that CARD10 defects contribute to inflammatory bowel disease. CARD10
    expression is lower in Crohn disease patients than in ulcerative colitis patients
    or controls, and gastrointestinal biopsy in the less severely affected sibling
    showed early signs of Crohn disease.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistently, the pathological examination of the gastrointestinal biopsy sample of the proband’s sister revealed early signs of CD"
    explanation: Provides the histological correlate of gastrointestinal involvement in an affected individual.
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "gene expression was significantly lower in CD patients than in ulcerative colitis patients and healthy controls"
    explanation: Supports the link between reduced CARD10 and Crohn disease through an expression association in unrelated patients, not through the family reported here - which is why this is marked INDIRECT.
  downstream:
  - target: Crohn disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Airway Epithelial CBM Signaling Failure
  biological_scale: TISSUE
  description: >-
    CARD10 is expressed in airway epithelium, where the CBM complex drives type-2
    cytokine production. Its loss is the proposed explanation for the entry's most
    distinctive clinical dissociation - asthma with low rather than raised blood
    eosinophils - because the eosinophil recruitment arm fails while airway
    hyperresponsiveness does not. The account comes from the Card10-deficient mouse
    airway model rather than from patient airway tissue.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The airway epithelial cells ofCard10-deficient mice also present a decrease in type 2 cytokine levels."
    explanation: The airway-epithelial mechanism, established in mouse rather than in these patients, which is why this node is curated as proposed and the edge below is INDIRECT.
  downstream:
  - target: Asthma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Decreased total eosinophil count
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Loss of Peripheral Tolerance
  biological_scale: ORGANISM
  description: >-
    Imbalanced immune activation with raised autoantibodies, which is the arm that
    produces the autoimmune rather than the infectious half of the phenotype.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we observed that immune cells and cytokine production were decreased (TablesS1andS2), while autoimmune antibodies and chemokine levels were increased"
    explanation: Documents the simultaneous depletion of effector cells and rise in autoantibodies that this node names.
  downstream:
  - target: Autoimmune anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

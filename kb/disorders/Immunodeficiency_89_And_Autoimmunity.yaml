genetic:
- name: CARD10
  gene_term:
    preferred_term: CARD10
    term:
      id: hgnc:16422
      label: CARD10
  relationship_type: DISPUTED
  notes: >-
    Recorded as DISPUTED rather than CAUSATIVE because the gene-disease relationship
    rests on one consanguineous family and the reporting authors describe the variant
    as the possible cause. CARD10 is at 22q13.1. The variant is c.1258C>T,
    p.Arg420Cys, in exon 7.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the consequences ofCARD10mutations in humans have remained elusive."
    explanation: The report's own statement of how little was known about human CARD10 defects at the time, which bounds the strength of this gene-disease assertion.
discussions:
- discussion_id: card10_imd89_evidence_strength
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  - genetic#CARD10
  prompt: >-
    Is CARD10 established as the cause of immunodeficiency 89 and autoimmunity, or is
    it still a single-family candidate?
  rationale: >-
    The entity rests on one consanguineous family with two affected siblings
    homozygous for a single missense variant, reported as a short communication whose
    authors call the variant the possible cause. No independent family has been
    reported. The gene is biologically plausible - its paralogues CARD9, CARD11 and
    CARD14 all cause recognised immune disease, and CARD10 is highly expressed in
    gastrointestinal epithelium - but plausibility is not replication. Independent
    families, or a ClinGen gene-disease validity assertion, would settle it. The
    genetic relationship_type is recorded as DISPUTED for this reason.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified aCARD10mutation as the possible cause of a novel form of autosomal recessive genetic disease"
    explanation: The authors' own hedged causal claim, which is the reason this entry does not assert an established gene-disease relationship.
- discussion_id: card10_intrafamilial_variability
  kind: OPEN_QUESTION
  attaches_to:
  - disease#
  prompt: >-
    Why did two siblings with the same homozygous CARD10 genotype differ so much in
    severity and age at presentation?
  rationale: >-
    The elder brother, who had an unhealthy lifestyle and occupational metal dust
    exposure, developed immunodeficiency and autoimmune disease substantially earlier
    than his sister, who had a milder course. The reporting authors attribute the
    difference to environmental factors. With only two affected individuals described,
    this is a hypothesis about modifiers rather than a demonstrated gene-environment
    interaction, but it is the only account currently offered for the variability and
    it bears directly on how a future carrier should be counselled.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The elder brother, who lived an unhealthy lifestyle and was exposed to metal dust, suffered immunodeficiency and autoimmune disease much earlier than his sister."
    explanation: Documents the intrafamilial variability and the environmental exposure the authors propose as its explanation.
environmental:
- name: Occupational metal dust exposure
  description: >-
    Proposed by the reporting authors as the modifier explaining why the elder sibling
    presented substantially earlier and more severely than his sister despite an
    identical genotype. This is a single-family observation offered as an explanation,
    not an established disease modifier.
  review_notes: >-
    The exposure is recorded because it is the only account the literature offers for
    the striking intrafamilial variability, and dropping it would lose the one
    modifier hypothesis attached to this entity.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The elder brother, who lived an unhealthy lifestyle and was exposed to metal dust, suffered immunodeficiency and autoimmune disease much earlier than his sister."
    explanation: The source's statement of the exposure and the severity difference it is proposed to explain.
references:
- reference: PMID:32238915
  title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."

pathophysiology:
- name: CARD10 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    A homozygous missense variant in the highly conserved coiled-coil domain of CARD10
    reduces CARD10 mRNA and protein. The lesion is a destabilising missense rather than
    a null, which fits the late-onset, slowly progressive course.
  genetic_context:
    gene:
      preferred_term: CARD10
      term:
        id: hgnc:16422
        label: CARD10
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant (R420C) is located in the coiled-coil domain of CARD10, a key and highly conserved domain"
    explanation: Locates the variant in a conserved functional domain.
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reconstitution studies demonstrated decreased expression ofCARD10mRNA and CARD10 protein in the patient with the R420C mutation"
    explanation: Provides the functional consequence of the variant at the mRNA and protein level.
  downstream:
  - target: Impaired CBM Complex NF-kappaB Signaling
    causal_link_type: DIRECT
- name: Impaired CBM Complex NF-kappaB Signaling
  biological_scale: MOLECULAR
  description: >-
    CARD10 is one of four CARD-containing membrane-associated guanylate kinase family
    scaffolds that form an intracellular complex with BCL10 and MALT1. That complex
    activates NF-kappaB and other pathways; CARD10 specifically couples G-protein-
    coupled receptor and epidermal growth factor receptor signalling to it. Reduced
    CARD10 impairs this coupling.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These proteins function as molecular scaffolds by forming an intracellular complex with B-cell lymphoma protein 10 (BCL10) and mucosa-associated lymphoid tissue lymphoma translocation gene 1 (MALT1), which are critical for the activation of several signaling pathways"
    explanation: States the CBM scaffolding function that CARD10 loss impairs.
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a ubiquitously expressed protein, CARD10 activates the NF-κB pathway following G-protein-coupled receptor- and epidermal growth factor receptor-induced signaling."
    explanation: Identifies the specific receptor inputs CARD10 couples to NF-kappaB, which is what distinguishes it from its CARD11 paralogue.
  downstream:
  - target: Innate Effector Cell Depletion With Chemokine Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Mucosal Barrier Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Innate Effector Cell Depletion With Chemokine Dysregulation
  biological_scale: CELLULAR
  description: >-
    Intermediate and non-classical monocytes and monocyte-derived dendritic cells were
    reduced in the more severely affected sibling, while inflammatory chemokines were
    raised. Depletion of effector populations alongside inflammatory drive is the
    cellular correlate of combined immunodeficiency with autoimmunity, rather than of
    global immune failure.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: monocyte-derived dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "flow cytometry analysis showed that the numbers of CD14highCD16+, CD14+CD16high, and monocyte-derived HLADR+CD11c+CD16+cells were all reduced in the patient compared with the respective numbers in the sibling"
    explanation: Documents the reduced monocyte and dendritic cell populations.
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a cytokine assay showed that IL-8, GROα, MCP-1, MIP-1α, SDF1α, and other chemokine family members were significantly elevated"
    explanation: Documents the raised chemokines that accompany the cell depletion.
  downstream:
  - target: Recurrent infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Mucosal Barrier Inflammation
  biological_scale: TISSUE
  description: >-
    CARD10 is highly expressed in gastrointestinal epithelium and the CBM complex
    participates in TLR4 signalling there, which is the basis for the long-standing
    hypothesis that CARD10 defects contribute to inflammatory bowel disease. CARD10
    expression is lower in Crohn disease patients than in ulcerative colitis patients
    or controls, and gastrointestinal biopsy in the less severely affected sibling
    showed early signs of Crohn disease.
  evidence:
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistently, the pathological examination of the gastrointestinal biopsy sample of the proband’s sister revealed early signs of CD"
    explanation: Provides the histological correlate of gastrointestinal involvement in an affected individual.
  - reference: PMID:32238915
    reference_title: "Mutant CARD10 in a family with progressive immunodeficiency and autoimmunity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "gene expression was significantly lower in CD patients than in ulcerative colitis patients and healthy controls"
    explanation: Supports the link between reduced CARD10 and Crohn disease through an expression association in unrelated patients, not through the family reported here - which is why this is marked INDIRECT.
  downstream:
  - target: Crohn disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

name: Immunodeficiency 89 and Autoimmunity
creation_date: "2026-09-02T00:00:00Z"
description: >-
  Immunodeficiency 89 and autoimmunity is an autosomal recessive inborn error of
  immunity attributed to biallelic CARD10 variants. CARD10, also called CARMA3, is a
  membrane-associated guanylate kinase family scaffold that assembles the CBM complex
  with BCL10 and MALT1 and couples G-protein-coupled receptor and epidermal growth
  factor receptor signalling to NF-kappaB activation. Its paralogues CARD9, CARD11 and
  CARD14 already account for recognised immunodeficiency and inflammatory syndromes,
  so a CARD10 defect sits inside an established mechanistic family rather than
  standing alone.

  The presentation is the combination that marks immune dysregulation rather than pure
  immunodeficiency: recurrent infection alongside autoimmune and allergic disease.
  The reported siblings had recurrent infections with bronchiectasis, lung abscess and
  pulmonary bulla, asthma, autoimmune anaemia and Crohn disease. Onset was late - both
  presented in their fifth decade - which places this among the mild primary
  immunodeficiencies that surface as adult autoimmunity or allergy rather than as
  childhood infection.

  Two observations sharpen the mechanism. The siblings had asthma with low rather than
  raised blood eosinophils, which matches the Card10-deficient mouse asthma model in
  which airway eosinophils fall while airway hyperresponsiveness does not. And
  intermediate and non-classical monocyte and monocyte-derived dendritic cell
  populations were reduced while inflammatory chemokines were raised - a combination of
  effector-cell depletion with inflammatory drive rather than global immune failure.

  The evidence base is narrow and the entry says so rather than reading as though the
  gene-disease relationship were settled. The entity rests on a single consanguineous
  family with two affected siblings homozygous for one missense variant in the CARD10
  coiled-coil domain, and the authors describe that variant as the possible rather
  than the established cause. The two siblings differed substantially in severity
  despite an identical genotype, which the report attributes to environmental
  modifiers - so even within the one reported family the genotype does not predict the
  phenotype.
category: Mendelian
synonyms:
- IMD89
- CARD10 deficiency
- CARMA3 deficiency

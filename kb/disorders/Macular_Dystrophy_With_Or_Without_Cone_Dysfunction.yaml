genetic:
- name: SAMD7
  gene_term:
    preferred_term: SAMD7
    term:
      id: hgnc:25394
      label: SAMD7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    SAMD7 encodes a 446-amino-acid sterile alpha motif (SAM) domain protein, a
    CRX-regulated transcriptional corepressor and PRC1 component. Bi-allelic
    SAMD7 variants were first reported as a cause of this macular dystrophy in
    2024 (six families). No GenCC/ClinGen gene-disease validity classification
    exists for SAMD7 yet, so no gene_disease_validity tier is recorded here.
    Per-variant allele frequencies and additional genotype data are in the
    source report's tables (not reproduced here).
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report bi-allelic mutations in SAMD7 as a cause of autosomal-recessive macular dystrophy with or without cone dysfunction."
    explanation: >
      Establishes SAMD7 as the causative gene, with bi-allelic variants in an
      autosomal-recessive pattern.
  variants:
  - name: c.290+1G>A
    description: >
      Homozygous canonical donor splice-site variant at the +1 position of
      intron 5 (GRCh38 chr3:169,925,137G>A), the first SAMD7 variant linked to
      the disease; an in vitro splicing assay showed complete exon 5 skipping.
    evidence:
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a G>A transition at position +1 of intron 5, affecting the conserved donor splice site (GRCh38: chr3:169,925,137G>A [c.290+1G>A])"
      explanation: >
        Identifies the homozygous canonical splice-donor variant in the index
        individual.
  - name: c.992A>T (p.Asp331Val)
    description: >
      Homozygous missense variant in the conserved SAM domain; the only variant
      functionally validated to impair SAMD7's repression of CRX-dependent
      transcription in vitro.
    evidence:
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She is homozygous for a rare missense variant (not previously reported), chr3:169,928,529A>T (c.992A>T; p.Asp331Val)"
      explanation: >
        Identifies the homozygous SAM-domain missense variant later shown to
        impair SAMD7 repressor activity.
  - name: c.919+1G>A
    description: >
      Homozygous canonical donor splice-site variant at the +1 position of
      intron 6 (GRCh38 chr3:169,927,182G>A), leading to aberrant splicing
      (intron 6 retention or exon 6 skipping) and predicted truncation/NMD.
    evidence:
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a G>A transition at position +1 of intron 6, affecting the conserved donor splice site (chr3:169,927,182G>A [c.919+1G>A])"
      explanation: >
        Identifies a second homozygous canonical splice-donor variant in an
        independent consanguineous family.
  - name: c.211+1G>A
    description: >
      Recurrent homozygous canonical donor splice-site variant at the +1
      position of intron 4 (GRCh38 chr3:169921339G>A), identified in three
      affected individuals from two consanguineous Pakistani families (3-1 and
      the siblings 4-1, 4-2); an in vitro assay showed complete exon 4 skipping,
      predicting a frameshift and NMD.
    evidence:
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for a G>A transition at position +1 of intron 4, affecting the conserved donor splice site (chr3:169921339G>A; c.211+1G>A)"
      explanation: >
        Identifies the recurrent homozygous intron-4 splice-donor variant in
        individual 3-1.
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both are homozygous for the same c.211+1G>A mutation identified in individual 3-1."
      explanation: >
        The same variant is homozygous in the siblings 4-1 and 4-2 of a second
        family, making it the most recurrent allele in the cohort (3/8).
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "as confirmed by an in vitro splicing assay, demonstrating complete exon 4 skipping"
      explanation: >
        An in vitro splicing assay confirmed the variant causes complete exon 4
        skipping, supporting a loss-of-function consequence.
  - name: c.1153G>A (p.Val385Ile)
    description: >
      Homozygous variant at the acceptor site of the last exon (exon 9) causing
      partial exon-9 skipping; roughly two-thirds of transcripts remain normally
      spliced, consistent with a hypomorphic effect. Individual 5-1 (homozygous)
      had one of the latest ages of onset in the cohort (42 years), illustrating
      the genotype-phenotype variability.
    evidence:
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for the rare missense variant (not previously reported) chr3:169938318G>A (c.1153G>A; p.Val385Ile)"
      explanation: >
        Identifies the homozygous last-exon acceptor-site variant in individual
        5-1.
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Individual 5-1, homozygous for c.1153G>A, which leads to partial exon skipping, had one of the latest ages of onset in our cohort (42 years)"
      explanation: >
        Links the partial-splicing (hypomorphic) allele to one of the latest
        ages of onset, consistent with the variable onset of the disease.
diagnosis:

  description: >
    Full-field ERG distinguishes isolated macular dystrophy from generalized
    cone dysfunction and documents the mild scotopic (dark-adapted) rod b-wave
    attenuation seen in a subset of individuals.
  results: >
    Reduced light-adapted (cone) responses indicate generalized cone
    dysfunction; mildly attenuated dark-adapted b-waves in some individuals
    indicate inner retinal dysfunction.
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cone function in the peripheral retina was mildly to moderately reduced in six of eight individuals, and normal in two of them"
    explanation: >
      Full-field ERG stratified individuals by peripheral cone function,
      distinguishing isolated MD from MD with generalized cone dysfunction.

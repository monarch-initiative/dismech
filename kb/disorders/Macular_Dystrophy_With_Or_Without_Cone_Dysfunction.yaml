inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All reported families segregate bi-allelic (homozygous) SAMD7 variants in an
    autosomal-recessive pattern; most pedigrees were consanguineous.
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report bi-allelic mutations in SAMD7 as a cause of autosomal-recessive macular dystrophy with or without cone dysfunction."
    explanation: >
      The gene-discovery study reports bi-allelic SAMD7 variants segregating
      with disease, defining the autosomal-recessive mode of inheritance.
pathophysiology:
- name: SAMD7 Biallelic Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    Affected individuals carry homozygous SAMD7 variants that are predominantly
    canonical splice-site changes (predicted to trigger exon skipping and
    nonsense-mediated decay or protein truncation) plus rare missense changes in
    the conserved SAM domain, together pointing to loss of SAMD7 function as the
    disease mechanism.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of SAMD7 Transcriptional Corepressor Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point to loss of SAMD7 function as a mechanism of disease"
    explanation: >
      The authors conclude that the identified SAMD7 variants act through loss
      of function, with splice defects predicted to cause NMD or truncation
      being predominant.
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the c.290+1G>A variant leads to complete exon 5 skipping and absence of correctly spliced cDNA"
    explanation: >
      An in vitro splicing (exon-trapping) assay confirms that a representative
      canonical splice-site variant abolishes normal splicing, supporting a
      loss-of-function consequence.
- name: Loss of SAMD7 Transcriptional Corepressor Activity
  biological_scale: MOLECULAR
  description: >
    SAMD7 is a CRX-regulated transcriptional corepressor and a component of PRC1
    that normally restrains CRX-dependent transcription in photoreceptors.
    Disease-associated loss of SAMD7 reduces this repressive activity, as shown
    directly for a SAM-domain missense variant in a CRX-dependent reporter assay.
  genes:
  - preferred_term: SAMD7
    term:
      id: hgnc:25394
      label: SAMD7
  molecular_functions:
  - preferred_term: transcription corepressor activity
    modifier: DECREASED
    term:
      id: GO:0003714
      label: transcription corepressor activity
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Derepression of CRX-Regulated Photoreceptor Genes
    causal_link_type: DIRECT
  - target: Macular Cone Photoreceptor Dysfunction and Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38272031
      reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "the genes regulated by SAMD7 in the human retina and the pathophysiological mechanism underlying the maculopathy reported here in humans with SAMD7 deficiency remain to be determined"
      explanation: >
        SAMD7 deficiency causes the maculopathy in affected individuals, but the
        authors state that the intervening pathomechanism in the human retina is
        not yet determined; the edge is therefore an indirect link with unknown
        intermediates.
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this inhibition was significantly reduced when the Asp>Val variant was present, indicating a clear functional effect for this mutation"
    explanation: >
      In a CRX-dependent luciferase reporter assay, the disease-associated
      p.Asp331Val SAM-domain variant impaired SAMD7's repression of CRX
      activity, directly demonstrating reduced corepressor function.
  - reference: PMID:23565263
    reference_title: "Sterile alpha motif containing 7 (samd7) is a novel crx-regulated transcriptional repressor in the retina."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Samd7 interferes with Crx-dependent transcription"
    explanation: >
      Reporter assays established SAMD7 as a CRX-regulated transcriptional
      repressor that restrains CRX-dependent transcription, the normal activity
      lost in disease.
  - reference: PMID:28900001
    reference_title: "Samd7 is a cell type-specific PRC1 component essential for establishing retinal rod photoreceptor identity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Samd7 physically interacts with Polyhomeotic homologs (Phc proteins), components of the Polycomb repressive complex 1 (PRC1)"
    explanation: >
      The SAMD7-Phc interaction was demonstrated by yeast two-hybrid screening
      and co-immunoprecipitation assays (in vitro biochemistry), grounding
      SAMD7's identity as a PRC1-associated transcriptional corepressor.
- name: Derepression of CRX-Regulated Photoreceptor Genes
  biological_scale: CELLULAR
  description: >
    In Samd7-null animal models, loss of SAMD7 derepresses genes normally
    silenced in a given photoreceptor subtype (for example ectopic non-rod gene
    and S-opsin expression in rods), reflecting failure of SAMD7-dependent
    fine-tuning of the CRX-driven photoreceptor gene program. Whether the same
    derepression underlies the human macular/cone phenotype is not established
    (see the attached human-model-mismatch discussion).
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  evidence:
  - reference: PMID:28900001
    reference_title: "Samd7 is a cell type-specific PRC1 component essential for establishing retinal rod photoreceptor identity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Samd7-null mutant mice showed ectopic expression of nonrod genes including S-opsin in rod photoreceptor cells and rod photoreceptor cell dysfunction"
    explanation: >
      Mouse knockouts demonstrate that SAMD7 loss derepresses non-rod genes in
      photoreceptors and causes photoreceptor dysfunction; cited as the
      candidate cellular consequence of SAMD7 deficiency, with human relevance
      uncertain.
  - reference: PMID:39531499
    reference_title: "Samd7 represses short-wavelength cone genes to preserve long-wavelength cone and rod photoreceptor identity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "the transcriptional corepressor samd7 promotes rod differentiation and represses short-wavelength cone genes in long-wavelength cones in zebrafish"
    explanation: >
      Zebrafish and mouse work shows SAMD7 represses short-wavelength cone genes
      to maintain photoreceptor subtype identity, so its loss derepresses that
      program.
- name: Macular Cone Photoreceptor Dysfunction and Degeneration
  biological_scale: TISSUE
  description: >
    The clinical consequence in humans is a bilateral macular dystrophy with
    cone photoreceptor involvement concentrated in the macula; generalized cone
    dysfunction beyond the macula is present in most but not all affected
    individuals. Rod photoreceptor degeneration is not a feature, although a
    subset of individuals show mild attenuation of dark-adapted (scotopic) rod
    b-waves on full-field ERG, which the authors read as inner retinal
    (bipolar-cell) dysfunction rather than rod photoreceptor loss.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Macular dystrophy
    causal_link_type: DIRECT
  - target: Cone dysfunction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, all individuals with bi-allelic SAMD7 mutations presented with MD."
    explanation: >
      Every affected individual in the discovery cohort presented with macular
      dystrophy, establishing macular (cone-region) involvement as the core
      tissue-level phenotype.
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cone function in the peripheral retina was mildly to moderately reduced in six of eight individuals, and normal in two of them"
    explanation: >
      Full-field ERG documents generalized cone dysfunction beyond the macula in
      most affected individuals, supporting cone photoreceptor involvement.

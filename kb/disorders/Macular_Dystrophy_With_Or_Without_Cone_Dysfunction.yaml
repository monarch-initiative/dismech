- name: Molecular genetic testing (exome/genome sequencing)
  diagnosis_term:
    preferred_term: molecular genetic testing by exome/genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >
    Whole-exome and whole-genome sequencing identify the bi-allelic SAMD7
    variants and resolve the differential diagnosis from other macular
    dystrophies; one individual had initially been diagnosed with suspected
    Stargardt disease (the most common MD, caused by ABCA4).

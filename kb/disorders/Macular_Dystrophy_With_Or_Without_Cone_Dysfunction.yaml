    affected individuals, the defining feature of the disease. Age of onset is
    variable (second to sixth decade; mean age at first presentation 34.8 years,
    range 14-51), differing even between individuals homozygous for the same
    variant, which the authors attribute to additional genetic and/or
    environmental modifiers.

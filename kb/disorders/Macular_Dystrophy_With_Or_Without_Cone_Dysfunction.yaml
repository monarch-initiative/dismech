name: Macular Dystrophy with or without Cone Dysfunction
creation_date: "2026-10-24T15:30:39Z"
category: Mendelian
description: >
  Macular dystrophy with or without cone dysfunction is an autosomal-recessive
  inherited retinal disease caused by bi-allelic loss-of-function variants in
  SAMD7 (sterile alpha motif domain containing 7). SAMD7 is a photoreceptor
  transcriptional corepressor and a component of Polycomb repressive complex 1
  (PRC1); its own expression is driven by the master photoreceptor transcription
  factor CRX (cone-rod homeobox), and it fine-tunes CRX-regulated gene
  expression. First delineated as a human disease gene in 2024, SAMD7 deficiency
  presents in affected individuals as a bilateral macular dystrophy, in most
  cases accompanied by generalized (peripheral) cone dysfunction on full-field
  electroretinography, with variable adult/juvenile age of onset (second to
  sixth decade). The intervening pathomechanism linking SAMD7 loss to the
  cone-predominant maculopathy in humans is not yet established, and the human
  phenotype differs markedly from the rod-dominated phenotype of Samd7-null mice.
synonyms: []
disease_term:
  preferred_term: macular dystrophy with or without cone dysfunction
  term:
    id: MONDO:0958326
    label: macular dystrophy with or without cone dysfunction
parents:

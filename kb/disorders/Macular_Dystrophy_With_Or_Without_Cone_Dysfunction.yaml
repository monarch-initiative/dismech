    explanation: >
      The gene-discovery study reports bi-allelic SAMD7 variants segregating
      with disease, defining the autosomal-recessive mode of inheritance.
pathophysiology:
- name: SAMD7 Biallelic Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    Affected individuals carry homozygous SAMD7 variants that are predominantly
    canonical splice-site changes (predicted to trigger exon skipping and
    nonsense-mediated decay or protein truncation) plus rare missense changes in
    the conserved SAM domain, together pointing to loss of SAMD7 function as the
    disease mechanism.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of SAMD7 Transcriptional Corepressor Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point to loss of SAMD7 function as a mechanism of disease"
    explanation: >
      The authors conclude that the identified SAMD7 variants act through loss
      of function, with splice defects predicted to cause NMD or truncation
      being predominant.
  - reference: PMID:38272031
    reference_title: "Mutations in SAMD7 cause autosomal-recessive macular dystrophy with or without cone dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the c.290+1G>A variant leads to complete exon 5 skipping and absence of correctly spliced cDNA"
    explanation: >
      An in vitro splicing (exon-trapping) assay confirms that a representative
      canonical splice-site variant abolishes normal splicing, supporting a
      loss-of-function consequence.
- name: Loss of SAMD7 Transcriptional Corepressor Activity
  biological_scale: MOLECULAR
  description: >
    SAMD7 is a CRX-regulated transcriptional corepressor and a component of PRC1
    that normally restrains CRX-dependent transcription in photoreceptors.
    Disease-associated loss of SAMD7 reduces this repressive activity, as shown
    directly for a SAM-domain missense variant in a CRX-dependent reporter assay.

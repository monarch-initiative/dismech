diagnosis:
  - name: Molecular Genetic Testing for 2q23.1 Deletion or Intragenic MBD5 Variant
    description: >-
      The diagnosis is molecular. This section exists because the genetic block
      warns that a patient can be MBD5-haploinsufficient and test negative on
      routine screening, and a warning without a remedy is incomplete: the
      answer is testing that detects both a heterozygous 2q23.1 deletion
      encompassing all or part of MBD5 and an intragenic MBD5 variant, since
      either is sufficient.
    evidence:
      - reference: PMID:27786435
        reference_title: "MBD5 Haploinsufficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The diagnosis of MBD5 haploinsufficiency is established in a proband
          by identification on molecular genetic testing of a heterozygous
          deletion of 2q23.1 encompassing all or part of MBD5, or of an
          intragenic MBD5 pathogenic variant.
        explanation: >-
          The diagnostic criteria, covering both lesion classes.
  - name: Annual Scoliosis Assessment and Periodic Neurodevelopmental Review
    description: >-

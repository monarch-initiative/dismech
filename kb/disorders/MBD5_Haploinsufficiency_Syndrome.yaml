genetic:
  - name: MBD5
    relationship_type: CAUSATIVE
    gene_term:
      preferred_term: MBD5
      term:
        id: hgnc:20444
        label: MBD5
    notes: >-
      Both whole-gene deletion and intragenic alterations cause the disease,
      including partial deletions of non-coding regions that routine diagnostic
      screening does not typically capture or call pathogenic. That detection
      gap is clinically material: a patient can be MBD5-haploinsufficient and
      test negative on a standard array.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:21981781
        reference_title: >-
          Assessment of 2q23.1 microdeletion syndrome implicates MBD5 as a
          single causal locus of intellectual disability, epilepsy, and autism
          spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Fourteen alterations, including partial deletions of noncoding regions
          not typically captured or considered pathogenic by current diagnostic
          screening, disrupted MBD5 alone.
        explanation: >-
          Supports both that MBD5-only alterations are sufficient and that some
          of them evade standard diagnostic screening.
discussions:
  - discussion_id: mbd5_dosage_sensitivity_both_directions
    kind: KNOWLEDGE_GAP
    prompt: >-
      By what mechanism does MBD5 overexpression, in reciprocal 2q23.1
      duplication, produce a phenotype overlapping the one caused by MBD5
      haploinsufficiency?
    attaches_to:
      - pathophysiology#Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
    rationale: >-
      MBD5 is dosage-sensitive in both directions: deletion and duplication both
      cause neurodevelopmental disease with overlapping features, the
      duplication phenotype being somewhat milder. A model in which
      haploinsufficiency simply reduces a required activity does not explain why
      doubling that activity is also harmful. This entry curates the deletion
      side only; the shared mechanism that would account for both is not
      established, and this discussion marks that as a gap rather than leaving
      the asymmetry unremarked.
    evidence:
      - reference: PMID:23632792
        reference_title: >-
          Reciprocal deletion and duplication at 2q23.1 indicates a role for
          MBD5 in autism spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The features associated with a deletion, mutation or duplication of
          MBD5 and the gene expression changes observed support MBD5 as a
          dosage-sensitive gene critical for normal development.
        explanation: >-
          States the bidirectional dosage sensitivity that motivates this gap.
      - reference: PMID:23632792
        reference_title: >-
          Reciprocal deletion and duplication at 2q23.1 indicates a role for
          MBD5 in autism spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Phenotypic analyses suggest that 2q23.1 duplication results in a
          slightly less severe phenotype than the reciprocal deletion.
        explanation: >-
          Records the severity asymmetry between the two dosage directions,
          which any candidate mechanism would have to account for.
treatments:
  - name: Multidisciplinary Symptomatic Management
    description: >-
      There is no disease-modifying therapy. Management is symptomatic and
      multidisciplinary, which is a curatable fact rather than a reason to leave
      the section empty. GeneReviews names clinical genetics, neurology, child
      development, behavioural therapy, nutrition and feeding, speech and
      language therapy, and occupational and physical therapy.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:

        reference_title: "MBD5 Haploinsufficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Periodic neurodevelopmental and behavioral evaluations to assist in
          the management of cognitive issues, behavior issues, and sleep
          disturbance. Assess for seizures, feeding issues, constipation, and
          family support needs at each visit. Clinical assessment for scoliosis
          annually.
        explanation: >-
          The GeneReviews surveillance schedule.
animal_models:
  - name: Mbd5 gene-trap heterozygous mouse
    species: Mouse
    genotype: Mbd5 heterozygous gene-trap insertion
    publication: PMID:25001218
    description: >-
      Insertional gene-trap mutagenesis producing a heterozygous hypomorph.
      Curated as a structured model because two of this entry's four
      pathophysiology nodes rest on it, and that dependency should be visible in
      the data rather than only in the node descriptions.
    modeled_mechanisms:
      - target: Neurodevelopmental Impairment with Disproportionate Speech Deficit
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: >-
          Reproduces abnormal social behaviour, cognitive impairment, and motor
          and craniofacial abnormalities.
        limitations: >-
          The defining human feature cannot be modelled. Disproportionate speech
          impairment - most affected children never progress beyond single words
          - has no murine analogue, so the model is silent on the phenotype that
          most distinguishes this disorder clinically. Homozygotes are not
          available for comparison, and this is a hypomorph rather than a clean
          heterozygous null, so the dose it models is not exactly the human one.
        readouts:
          - name: Social behaviour and cognitive performance
            target: Neurodevelopmental Impairment with Disproportionate Speech Deficit
            direction: DECREASED
            interpretation: >-
              Behavioural correlate of the human neurodevelopmental phenotype.
            evidence:
              - reference: PMID:25001218
                reference_title: >-
                  Disruption of Mbd5 in mice causes neuronal functional deficits
                  and neurobehavioral abnormalities consistent with 2q23.1
                  microdeletion syndrome.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  Our study indicates that the Mbd5(+/) (GT) mouse model
                  recapitulates most of the hallmark phenotypes observed in
                  2q23.1 deletion carriers including abnormal social behavior,
                  cognitive impairment, and motor and craniofacial
                  abnormalities.
                explanation: >-
                  The behavioural and craniofacial phenotypes reproduced.
        evidence:
          - reference: PMID:25001218
            reference_title: >-
              Disruption of Mbd5 in mice causes neuronal functional deficits and
              neurobehavioral abnormalities consistent with 2q23.1 microdeletion
              syndrome.
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              These findings support a causal role of MBD5 in 2q23.1
              microdeletion syndrome and suggest a role for MBD5 in neuronal
              processes.
            explanation: >-
              The authors' conclusion that the model supports a causal role for
              MBD5, which is what makes it informative for this node.
      - target: Impaired Neurite Outgrowth and Neuronal Maturation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Neuronal cultures from the model show a neurite outgrowth deficiency.
          This is the sole source of evidence for that node, which the node
          description states.

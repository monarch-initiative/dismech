        reference_title: "MBD5 Haploinsufficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          A multidisciplinary approach that typically includes specialists in
          clinical genetics, neurology, child development, behavioral therapy,
          nutrition/feeding, speech and language therapy, and occupational and
          physical therapy is recommended.
        explanation: >-
          The GeneReviews management recommendation.
  - name: Early Speech Therapy with Nonverbal Communication
    description: >-

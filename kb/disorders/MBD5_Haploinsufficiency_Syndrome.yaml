  - name: Early Intervention and Individualized Education
    description: >-
      Enrollment in an early-intervention programme in infancy and an
      individualized educational programme at school age.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:27786435
        reference_title: "MBD5 Haploinsufficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Infants benefit from enrollment in an early-intervention program, and
          school-age children benefit from an individualized educational
          program.
        explanation: >-
          The GeneReviews developmental-support recommendation.
  - name: Routine Management of Seizures, Behaviour, Sleep and Constipation
    description: >-
      GeneReviews is explicit that these are treated in a routine manner - there
      is no MBD5-specific protocol. Recorded because the absence of a
      disease-specific approach is itself the clinically useful fact, and
      because the sleep disturbance in particular has a curated mechanism in
      this entry without a curated targeted therapy.

      "Routine" is not the same as "no agent preference", and the cohort
      literature supplies one that GeneReviews does not: valproate was the most
      consistently effective anti-seizure medication, while carbamazepine made
      seizures worse in one patient. A single patient is not a contraindication,
      but it is the only agent-specific caution available for this disorder and
      is recorded for that reason. The same cohort's ketogenic-diet response in
      that patient is reported alongside it in the source.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:27786435
        reference_title: "MBD5 Haploinsufficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Seizures, behavior problems, sleep disturbances, and constipation are
          treated in a routine manner.
        explanation: >-
          States that management of these features is not disease-specific.
      - reference: PMID:33912662
        reference_title: "Phenotypic Spectrum of Seizure Disorders in MBD5-Associated Neurodevelopmental Disorder."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although no drug was clearly superior, valproate showed the most
          consistent beneficial effect (12/14 cases), while carbamazepine
          exacerbated seizures in patient 2
        explanation: >-
          Graded PARTIAL because it qualifies rather than supports the routine
          claim: the source states plainly that no drug was clearly superior,
          which is consistent with routine management, while still identifying
          a preferred agent and one that worsened seizures in a single patient.

name: MBD5 Haploinsufficiency Syndrome
creation_date: "2026-08-27T23:55:00Z"
category: Mendelian
description: >-
  MBD5 haploinsufficiency syndrome, historically 2q23.1 microdeletion syndrome,
  is a neurodevelopmental disorder caused by loss of one functional copy of
  MBD5, which encodes a methyl-CpG-binding domain protein. It was defined the
  way few syndromes are: a consortium assembled 65 subjects with 2q23.1
  microdeletions or translocations, aligned the deletion breakpoints to narrow
  the critical region, and found MBD5 as the only gene the region contained.
  Patients whose alteration disrupts MBD5 alone are largely indistinguishable,
  clinically and transcriptionally, from those missing the whole 2q23.1
  interval, which is what makes this a single-gene disorder rather than a
  contiguous gene syndrome. The hedge in "largely" is deliberate and matters:
  the same series that mapped the critical region also reported that patients
  whose deletion additionally removed EPC2 had a broader phenotype. MBD5 is the
  critical locus; larger deletions can add features on top. The clinical picture is intellectual disability with
  disproportionate speech impairment, seizures, autistic features, a
  characteristic disturbed sleep pattern, stereotypies, and coarse facial
  features - a combination that led to initial clinical impressions of Angelman,
  Rett or Smith-Magenis syndrome in several patients before the deletion was
  found. MBD5 is dosage-sensitive in both directions: reciprocal 2q23.1
  duplication produces a related, somewhat milder syndrome, so this entry
  describes the deletion side of a dosage disorder rather than a simple
  loss-of-function disease.
parents:
  - Neurodevelopmental Disorder
  - Chromatin Disorder
synonyms:
  - 2q23.1 microdeletion syndrome
  - MRD1
  - intellectual disability, autosomal dominant 1
  - MBD5-associated neurodevelopmental disorder
  - MAND
disease_term:
  preferred_term: intellectual disability, autosomal dominant 1
  term:
    id: MONDO:0007974
    label: intellectual disability, autosomal dominant 1
references:
  - reference: PMID:27786435
    title: "MBD5 Haploinsufficiency."
    tags:
      - GeneReviews
notes: >-
  On the entry name and the MONDO label. MONDO:0007974 and its OMIM source label
  this concept "intellectual disability, autosomal dominant 1", and OMIM's
  phenotypic series places it among the non-syndromic intellectual disabilities.
  That label misdescribes the disease. Every clinical series of 2q23.1 deletion
  reports short stature, microcephaly, seizures, a distinctive disturbed sleep
  pattern, stereotypic repetitive behaviour and coarse facies alongside the
  intellectual disability - the phenotype is recognisably syndromic, and was
  mistaken for Angelman, Rett and Smith-Magenis syndrome precisely because it
  has a syndromic gestalt. The entry is therefore named for the gene and
  mechanism rather than adopting the ontology label as its name, while
  disease_term remains bound to MONDO:0007974 so the mapping is not lost. This
  is a case where the best available ontology term carries a clinically
  misleading label; the binding is correct and the label is not, and the entry
  records the discrepancy rather than propagating it.

  Relationship to Autosomal_Dominant_Non-Syndromic_Intellectual_Disability.
  That entry names MBD5 only as one example gene within a chromatin-regulator
  module and does not carry MONDO:0007974. Given that MBD5 haploinsufficiency is
  syndromic, it is arguably a poor fit for that entry's scope, but this PR does
  not modify it.
prevalence:
  - population: Worldwide
    measure_type: POINT_PREVALENCE
    prevalence_class: BELOW_1_IN_1000000
    notes: >-
      Recorded as a class rather than a rate. No numeric estimate is quoted
      because none was verifiable from a cached source at curation time; the
      class reflects the disorder's ultra-rare status and should be replaced
      with a cited figure when one is available.
inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Almost always de novo, but the transmission behaviour differs by lesion
      class in a way worth stating rather than flattening: parent-to-child
      transmission of a 2q23.1 deletion encompassing MBD5 has not been reported,
      whereas transmission of intragenic MBD5 deletions and pathogenic sequence
      variants has. Penetrance appears high: no copy-number alteration of MBD5
      was found in 7,878 controls.
    evidence:
      - reference: PMID:21981781
        reference_title: >-
          Assessment of 2q23.1 microdeletion syndrome implicates MBD5 as a
          single causal locus of intellectual disability, epilepsy, and autism
          spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          No copy-number alterations of MBD5 were observed in 7878 controls,
          suggesting MBD5 alterations are highly penetrant.
        explanation: >-
          The control-cohort observation on which the high-penetrance claim
          rests. Note this establishes rarity in controls, from which the
          authors infer penetrance; it is not a direct penetrance measurement.
      - reference: PMID:27786435
        reference_title: "MBD5 Haploinsufficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          To date, parent-to-child transmission of a 2q23.1 deletion that
          encompasses all or part of MBD5 has not been reported. Parent-to-child
          transmissions of MBD5 intragenic deletions and pathogenic sequence
          variants have been reported.
        explanation: >-
          The lesion-class asymmetry in transmission, which the earlier bare
          "almost always de novo" description obscured. Relevant to
          recurrence-risk counselling.
pathophysiology:
  - name: MBD5 Haploinsufficiency
    biological_scale: MOLECULAR
    description: >-
      Deletion of, or a loss-of-function alteration within, one MBD5 allele
      halves MBD5 mRNA. The critical-region mapping is what makes this node a
      single-gene claim rather than an inference about a deleted interval: MBD5
      was the only locus defining the region shared by all deletions, and
      alterations disrupting MBD5 alone reproduce the full phenotype.
    genes:
      - preferred_term: MBD5
        term:
          id: hgnc:20444
          label: MBD5
    notes: >-
      This node previously carried GO:0008327 methyl-CpG binding with
      modifier DECREASED. It was removed on review: the annotation asserted
      exactly the methyl-DNA-reading mechanism that the next node's description
      disclaims, carried no evidence item, and rested on nothing stronger than
      the gene's name. MBD5 localises to non-heterochromatic active regions and
      its binding to methylated DNA has been questioned, so no term beats a term
      the cited evidence does not support.
    downstream:
      - target: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
    evidence:
      - reference: PMID:21981781
        reference_title: >-
          Assessment of 2q23.1 microdeletion syndrome implicates MBD5 as a
          single causal locus of intellectual disability, epilepsy, and autism
          spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified a single gene, methyl-CpG-binding domain 5 (MBD5), as
          the only locus that defined the critical region. Partial or complete
          deletion of MBD5 was associated with haploinsufficiency of mRNA
          expression, intellectual disability, epilepsy, and autistic features.
        explanation: >-
          Establishes MBD5 as the sole critical-region gene and links its
          deletion to reduced mRNA and to the core clinical triad.
      - reference: PMID:21981781
        reference_title: >-
          Assessment of 2q23.1 microdeletion syndrome implicates MBD5 as a
          single causal locus of intellectual disability, epilepsy, and autism
          spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Expression profiles and clinical characteristics were largely
          indistinguishable between MBD5-specific alteration and deletion of the
          entire 2q23.1 interval.
        explanation: >-
          The observation that justifies modelling this as a single-gene
          disorder. Note the authors' own qualifier is "largely", not
          "indistinguishable", and the entry description now carries that hedge
          rather than dropping it.
      - reference: PMID:19809484
        reference_title: "The 2q23.1 microdeletion syndrome: clinical and behavioural phenotype."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Another gene in the 2q23.1 region, EPC2, was deleted in 12 patients
          who had a broader phenotype than those with a deletion of MBD5 only.
        explanation: >-
          Graded PARTIAL because it qualifies rather than supports the
          single-locus claim: MBD5 alone reproduces the core phenotype, but
          co-deletion of EPC2 broadens it. Included so the entry does not
          present only the half of its own cited literature that makes the
          cleaner story.
  - name: Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
    biological_scale: CELLULAR
    description: >-
      MBD5 carries a methyl-CpG-binding domain and a PWWP domain and acts as an
      epigenetic regulator with transactivational activity. Halving its dose
      dysregulates the transcriptional programmes that chromatin readers
      coordinate during neuronal development. The mechanism here is less
      completely characterised than the genetics: MBD5's own binding to
      methylated DNA has been questioned, so the node is stated at the level the
      evidence supports - a chromatin-associated transcriptional regulator whose
      dose matters - rather than as a specific methyl-DNA-reading mechanism.
    biological_processes:
      - preferred_term: chromatin organization
        term:
          id: GO:0006325
          label: chromatin organization
        modifier: DECREASED
      - preferred_term: regulation of DNA-templated transcription
        term:
          id: GO:0006355
          label: regulation of DNA-templated transcription
    downstream:
      - target: Impaired Neurite Outgrowth and Neuronal Maturation
      - target: Dysregulated Circadian Gene Expression
    evidence:
      - reference: PMID:23632792
        reference_title: >-
          Reciprocal deletion and duplication at 2q23.1 indicates a role for
          MBD5 in autism spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a region that includes MBD5, an important factor in methylation
          patterning and epigenetic regulation
        explanation: >-
          Characterises MBD5's molecular role as epigenetic regulation, which is
          the level at which this node is stated.
      - reference: PMID:25001218
        reference_title: >-
          Disruption of Mbd5 in mice causes neuronal functional deficits and
          neurobehavioral abnormalities consistent with 2q23.1 microdeletion
          syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we found that MBD5 has transactivational activity and plays a role in
          neuritogenesis
        explanation: >-
          Supports the transactivational function attributed to MBD5 here.
          Graded MODEL_ORGANISM because the finding comes from the gene-trap
          mouse study.
  - name: Dysregulated Circadian Gene Expression
    biological_scale: CELLULAR
    description: >-
      MBD5 haploinsufficiency alters expression of the core circadian genes
      NR1D2, PER1, PER2 and PER3 in patient lymphoblastoid lines, and siRNA
      knockdown perturbs further circadian pathway genes. This node is what
      connects the disease's most clinically useful phenotype to its molecular
      lesion. It also converts the Angelman/Rett/Smith-Magenis resemblance the
      entry narrates elsewhere from a diagnostic anecdote into a mechanistic
      claim: MBD5 and RAI1, the Smith-Magenis gene, carry conserved putative E
      boxes and their knockdowns perturb overlapping circadian and mTOR
      pathways.
    biological_processes:
      - preferred_term: circadian rhythm
        term:
          id: GO:0007623
          label: circadian rhythm
        modifier: DYSREGULATED
    downstream:
      - target: phenotypes#Disturbed Sleep Pattern
    evidence:
      - reference: PMID:25271084
        reference_title: >-
          MBD5 haploinsufficiency is associated with sleep disturbance and
          disrupts circadian pathways common to Smith-Magenis and fragile X
          syndromes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          circadian gene mRNA levels of NR1D2, PER1, PER2, and PER3 were altered
          in del 2q23.1 lymphoblastoid cell lines (LCLs), signifying that
          haploinsufficiency of MBD5 can result in dysregulation of circadian
          rhythm gene expression
        explanation: >-
          The measurement this node models, in patient-derived cells. Graded
          IN_VITRO because the assay is on lymphoblastoid lines, though note the
          cells are the patients' own rather than a heterologous system.
      - reference: PMID:25271084
        reference_title: >-
          MBD5 haploinsufficiency is associated with sleep disturbance and
          disrupts circadian pathways common to Smith-Magenis and fragile X
          syndromes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Bioinformatic analysis identified conserved putative E boxes in MBD5
          and RAI1, and expression levels of NR1D2 and CRY2 were significantly
          reduced in patient LCLs.
        explanation: >-
          Supports the shared-pathway claim with Smith-Magenis, which is what
          makes the clinical resemblance mechanistic rather than coincidental.
  - name: Impaired Neurite Outgrowth and Neuronal Maturation
    biological_scale: CELLULAR
    description: >-
      Neuronal cultures from the Mbd5 gene-trap mouse show a deficiency in
      neurite outgrowth, giving a cellular correlate for the cognitive and
      behavioural phenotype. This is the one node in the chain whose direct
      evidence is entirely from a model system, which is recorded rather than
      smoothed over.
    biological_processes:
      - preferred_term: neuron projection development
        term:
          id: GO:0031175
          label: neuron projection development
        modifier: DECREASED
    downstream:
      - target: Neurodevelopmental Impairment with Disproportionate Speech Deficit
    evidence:
      - reference: PMID:25001218
        reference_title: >-
          Disruption of Mbd5 in mice causes neuronal functional deficits and
          neurobehavioral abnormalities consistent with 2q23.1 microdeletion
          syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, neuronal cultures uncovered a deficiency in neurite
          outgrowth.
        explanation: >-
          The direct observation this node models, in cultures from the mouse
          model.
  - name: Neurodevelopmental Impairment with Disproportionate Speech Deficit
    biological_scale: ORGANISM
    description: >-
      The clinical endpoint: intellectual disability in which speech delay is
      pronounced relative to overall cognitive level, accompanied by seizures,
      autistic features, disturbed sleep, stereotypies and a broad-based gait.
      The mouse model recapitulates abnormal social behaviour, cognitive
      impairment, and motor and craniofacial abnormalities, which is the
      strongest available argument that the gene dose rather than the deletion
      per se produces the phenotype.
    downstream:
      - target: phenotypes#Intellectual Disability
      - target: phenotypes#Absent or Minimal Speech
      - target: phenotypes#Seizures
      - target: phenotypes#Autistic Features
      - target: phenotypes#Global Developmental Delay
    evidence:
      - reference: PMID:19809484
        reference_title: "The 2q23.1 microdeletion syndrome: clinical and behavioural phenotype."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          All patients were mentally retarded with pronounced speech delay and
          additional abnormalities including short stature, seizures,
          microcephaly and coarse facies. The majority of cases presented with
          stereotypic repetitive behaviour, a disturbed sleep pattern and a
          broad-based gait.
        explanation: >-
          The clinical description this node summarises, including the
          disproportionate speech delay and the syndromic features that make the
          non-syndromic ontology label inapt. The node now points at the
          individual phenotypes rather than absorbing them into this sentence.
      - reference: PMID:25001218
        reference_title: >-
          Disruption of Mbd5 in mice causes neuronal functional deficits and
          neurobehavioral abnormalities consistent with 2q23.1 microdeletion
          syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our study indicates that the Mbd5(+/) (GT) mouse model recapitulates
          most of the hallmark phenotypes observed in 2q23.1 deletion carriers
          including abnormal social behavior, cognitive impairment, and motor
          and craniofacial abnormalities.
        explanation: >-
          Establishes that the mouse model reproduces most hallmark phenotypes,
          supporting a causal role for MBD5 dose. Graded MODEL_ORGANISM.

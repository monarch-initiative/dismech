genetic:
  - name: MBD5
    relationship_type: CAUSATIVE
    variant_origin: DE_NOVO
    gene_term:
      preferred_term: MBD5
      term:
        id: hgnc:20444
        label: MBD5
    notes: >-
      Both whole-gene deletion and intragenic alterations cause the disease,
      including partial deletions of non-coding regions that routine diagnostic
      screening does not typically capture or call pathogenic. That detection
      gap is clinically material: a patient can be MBD5-haploinsufficient and
      test negative on a standard array.

      Origin is almost always de novo, which is what `variant_origin` records,
      but not invariably - transmission from a mildly affected parent is
      reported, and germline mosaicism in a clinically normal parent has now
      been demonstrated directly by deep-coverage sequencing. That is the case
      that makes "de novo" and "no recurrence risk" different statements: the
      family below had three affected siblings and two phenotypically normal
      parents, and only deep sequencing found the mosaic mother.

      Recurrence risk is not hypothetical here: mosaicism was found in 14% of
      families in the seizure cohort, identified through their having had two
      affected pregnancies. That is the number the counselling caveat is about.

      Not curated here, and the reasons differ. The variant-class breakdown
      across deletions, intragenic CNVs and sequence variants is in the
      deep-research report but is not quotable: the report attributes the ~5%
      sequence-variant figure to the Mullegama and Elsea MAND review, and that
      review's full text - now fetched and cached - does not state the
      breakdown. So this is a genuine sourcing gap, not an unfetched reference.
      The ClinGen dosage-sensitivity assertion is not a research gap at all but a
      tooling one: `just clingen-dosage-refresh` fails on a checksum mismatch
      against the pinned manifest, so no `CGDS:` record can be built for any gene
      until that pin is updated. `just refresh-orphadata` fails the same way,
      which is why this entry's prevalence record is a diagnostic yield rather
      than the Orphanet population class.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:33912662
        reference_title: "Phenotypic Spectrum of Seizure Disorders in MBD5-Associated Neurodevelopmental Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Deletions or mutations are almost always de novo although inheritance
          from mildly affected or mosaic parents has been reported.
        explanation: >-
          Sources the de novo predominance and, more usefully for counselling,
          the documented exceptions to it.
      - reference: PMID:36396431
        reference_title: >-
          Germline mosaicism in a family with MBD5 haploinsufficiency.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Both parents were phenotypically normal but deep coverage sequencing
          of the parents showed germline mosaicism in the mother
        explanation: >-
          Demonstrates germline mosaicism directly rather than inferring it from
          recurrence, and shows it can be invisible to standard parental
          testing - which is what turns the counselling caveat above into a
          concrete testing recommendation.
      - reference: PMID:33912662
        reference_title: "Phenotypic Spectrum of Seizure Disorders in MBD5-Associated Neurodevelopmental Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our molecular data highlight the importance of mosaicism, both in
          patient 12 and, even more critically, in 3/22 (14%) families who had 2
          affected pregnancies
        explanation: >-
          Quantifies how often mosaicism is actually in play, which is the
          difference between a caveat worth mentioning and one worth acting on
          in a recurrence-risk discussion.
      - reference: PMID:21981781
        reference_title: >-
          Assessment of 2q23.1 microdeletion syndrome implicates MBD5 as a
          single causal locus of intellectual disability, epilepsy, and autism
          spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Fourteen alterations, including partial deletions of noncoding regions
          not typically captured or considered pathogenic by current diagnostic
          screening, disrupted MBD5 alone.
        explanation: >-
          Supports both that MBD5-only alterations are sufficient and that some
          of them evade standard diagnostic screening.
discussions:
  - discussion_id: mbd5_dosage_sensitivity_both_directions
    kind: KNOWLEDGE_GAP
    prompt: >-
      By what mechanism does MBD5 overexpression, in reciprocal 2q23.1
      duplication, produce a phenotype overlapping the one caused by MBD5
      haploinsufficiency?
    attaches_to:
      - pathophysiology#Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons
    rationale: >-
      MBD5 is dosage-sensitive in both directions: deletion and duplication both
      cause neurodevelopmental disease with overlapping features, the
      duplication phenotype being somewhat milder. A model in which
      haploinsufficiency simply reduces a required activity does not explain why
      doubling that activity is also harmful. This entry curates the deletion
      side only; the shared mechanism that would account for both is not
      established, and this discussion marks that as a gap rather than leaving
      the asymmetry unremarked.
    evidence:
      - reference: PMID:23632792
        reference_title: >-
          Reciprocal deletion and duplication at 2q23.1 indicates a role for
          MBD5 in autism spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The features associated with a deletion, mutation or duplication of
          MBD5 and the gene expression changes observed support MBD5 as a
          dosage-sensitive gene critical for normal development.
        explanation: >-
          States the bidirectional dosage sensitivity that motivates this gap.
      - reference: PMID:23632792
        reference_title: >-
          Reciprocal deletion and duplication at 2q23.1 indicates a role for
          MBD5 in autism spectrum disorder.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Phenotypic analyses suggest that 2q23.1 duplication results in a
          slightly less severe phenotype than the reciprocal deletion.
        explanation: >-
          Records the severity asymmetry between the two dosage directions,
          which any candidate mechanism would have to account for.

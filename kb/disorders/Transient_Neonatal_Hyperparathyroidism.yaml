name: Transient Neonatal Hyperparathyroidism
creation_date: '2026-10-13T09:00:00Z'
category: Mendelian
parents:
- Skeletal Dysplasia
- Disorder of Calcium Metabolism
disease_term:
  preferred_term: transient neonatal hyperparathyroidism
  term:
    id: MONDO:0032591
    label: hyperparathyroidism, transient neonatal
synonyms:
- hyperparathyroidism, transient neonatal
- HRPTTN
- TNHP
- TRPV6-related transient neonatal hyperparathyroidism
- TRPV6-related intrauterine calciopenic rickets
- TRPV6 under-mineralising skeletal dysplasia
description: >-
  Transient neonatal hyperparathyroidism is an autosomal recessive disorder of
  maternal-to-fetal calcium supply caused by biallelic loss-of-function variants
  in TRPV6, the calcium-selective epithelial channel that provides apical
  calcium entry in the placental syncytiotrophoblast. Without that entry route,
  transplacental calcium transport in the third trimester - when fetal skeletal
  mineralisation peaks - is insufficient, the fetus mounts a secondary
  hyperparathyroid response, and PTH-driven bone resorption produces a
  severely undermineralised skeleton with intrauterine fractures, short and
  deformed long bones and a narrow, bell-shaped thorax. Most affected neonates
  present with respiratory distress from thoracic insufficiency and require
  ventilatory support; PTH is elevated in every reported case, with or without
  hypocalcaemia, and alkaline phosphatase is usually raised. Because enteral
  calcium absorption after birth does not depend on the placental route, the
  biochemical and radiographic abnormalities regress over months under oral
  calcium, phosphate and vitamin D supplementation - the feature the name
  records - though skeletal recovery can take up to two years and some infants
  need prolonged ventilation. Fewer than twenty cases have been reported. A
  single monoallelic case with a dominant-negative variant has been described,
  and heterozygous TRPV6 variants that reduce channel permeability are
  separately associated with non-alcoholic chronic pancreatitis.
notes: >-
  No GeneReviews chapter covers this disease or TRPV6; PubMed searches for
  "transient neonatal hyperparathyroidism[TI] AND genereviews[book]" and
  "TRPV6[TI] AND genereviews[book]" both return zero records, and the
  committed Bookshelf chapter index (cache/bookshelf/, 2026-09-10 snapshot)
  lists no GeneReviews or StatPearls chapter whose title matches the disease
  or any of its synonyms. Orphanet has no corresponding disorder record
  (no ORPHA cache file mentions TRPV6 or the disease name), so no ORPHA row is
  cited, and ClinGen has not classified the TRPV6 gene-disease pair, so
  "gene_disease_validity" is deliberately absent rather than carrying a
  curator-assigned tier. Serum calcium is frequently normal at presentation,
  so a normocalcaemic infant with an elevated PTH and an undermineralised
  skeleton is the characteristic picture rather than an exception.

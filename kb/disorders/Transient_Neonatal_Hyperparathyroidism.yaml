diagnosis:
- name: Trio exome sequencing after a suggestive neonatal skeletal survey
  description: >-
    The diagnosis is reached by recognising the combination of neonatal
    undermineralising skeletal dysplasia with a markedly raised PTH, with or
    without hypocalcaemia, and confirming biallelic TRPV6 variants. Because
    the biochemistry first suggests a PTH signalling disorder, CASR and
    skeletal dysplasia gene panels are often negative before TRPV6 is found,
    and TRPV6 is not on every skeletal dysplasia panel.

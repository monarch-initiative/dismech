inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic TRPV6 variants, most often compound heterozygous and less often
    homozygous in consanguineous families. Heterozygous parents are
    unaffected. Because the causal lesion acts in the fetally derived
    placenta rather than in the mother, the mother's own calcium handling is
    typically normal.
  evidence:
  - reference: PMID:29861107
    reference_title: "TRPV6 Variants Interfere with Maternal-Fetal Calcium Transport through the Placenta and Cause Transient Neonatal Hyperparathyroidism."
    supports: SUPPORT

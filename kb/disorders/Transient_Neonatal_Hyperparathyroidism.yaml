    reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetically, with one exception (case 14), the disease mostly follows an autosomal recessive inheritance pattern, with compound heterozygous mutations being the most common (71%, 10/14 cases), followed by homozygous mutations (21%, 3/14 cases)."
    explanation: >-

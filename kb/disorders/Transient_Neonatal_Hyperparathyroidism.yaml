      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "45Ca2+ uptake assays demonstrated loss-of-function, and biotinylation assays demonstrated failure of the channel to reach the cell surface."
      explanation: >-
        The functional characterisation behind this variant's classification.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - name: p.Val625Glu
    description: >-
      A monoallelic, paternally inherited missense variant adjacent to the
      TRP box, the single reported dominant-negative allele. The protein
      reaches the plasma membrane normally, but coimmunoprecipitation,
      calcium imaging and patch-clamp show it impairs the channel by forming

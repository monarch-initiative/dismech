differential_diagnoses:
- name: Neonatal severe primary hyperparathyroidism
  description: >-
    Biallelic CASR loss of function causes a primary parathyroid disorder
    with hypercalcaemia, whereas this disease is a secondary
    hyperparathyroidism with normal or low calcium. The calcium value is what
    separates them, and CASR was sequenced and found normal before TRPV6 was
    identified in the index case.
  evidence:
  - reference: PMID:30144375
    reference_title: "TRPV6 compound heterozygous variants result in impaired placental calcium transport and severe undermineralization and dysplasia of the fetal skeleton."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postnatal molecular genetic analysis found no causative variants in CASR, GNA11, APS21, or a 336 gene skeletal dysplasia panel investigated by whole exome sequencing."
    explanation: >-
      Documents that the PTH signalling disorders including CASR were
      excluded, which is the differential this record names.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Secondary hyperparathyroidism from maternal vitamin D deficiency alone
  description: >-
    Maternal vitamin D deficiency alone causes neonatal secondary
    hyperparathyroidism and is the first diagnosis reached in several of
    these infants; the twin case is the clearest illustration, where the
    affected twin and her essentially unaffected brother shared a vitamin D
    deficient mother and differed only in TRPV6 genotype. Vitamin D
    deficiency is common in this disease and modifies its severity, so
    finding it does not exclude a TRPV6 cause.
  evidence:
  - reference: PMID:30820485
    reference_title: "TRPV6 Gene Mutation in a Dizygous Twin With Transient Neonatal Hyperparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her twin brother presented with almost no symptoms."
    explanation: >-
      The discordance within one vitamin D deficient pregnancy that shows
      maternal deficiency alone does not account for the phenotype.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30820485
    reference_title: "TRPV6 Gene Mutation in a Dizygous Twin With Transient Neonatal Hyperparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We initially diagnosed the patient as having secondary hyperparathyroidism because of maternal vitamin D deficiency."
    explanation: >-
      The misdiagnosis this differential warns about, in the authors' own
      words.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Osteogenesis imperfecta and other undermineralising skeletal dysplasias
  description: >-
    Intrauterine fractures and undermineralisation put this disease in the
    differential of the perinatal skeletal dysplasias, and in the index case
    a 336-gene skeletal dysplasia panel was negative before exome sequencing
    found TRPV6. The distinguishing features are the markedly raised PTH and
    the radiographic improvement over months.
  evidence:
  - reference: PMID:30144375
    reference_title: "TRPV6 compound heterozygous variants result in impaired placental calcium transport and severe undermineralization and dysplasia of the fetal skeleton."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressively, biochemical normalization with radiological mineralization suggested recovery from in utero pathophysiology."
    explanation: >-
      The improving course that distinguishes this disease from a structural
      skeletal dysplasia.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Mucolipidosis type II
  description: >-
    Neonates with mucolipidosis type II, caused by GNPTAB deficiency, overlap
    at birth with TRPV6 patients. The connection is mechanistic as well as
    clinical: TRPV6 is a substrate of the GNPTAB-dependent
    mannose-6-phosphate sorting pathway, so a sorting defect may mislocalise
    the channel.
  evidence:
  - reference: PMID:41437274
    reference_title: "The intracellular localization and the ionic permeation of TRPV6 triggers chronic pancreatitis, skeletal dysplasia and is connected to mucolipidosis type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in the GNTPAB enzyme cause mucolipidosis type II and patients show at the time of birth overlapping defects with patients with TRPV6 mutations."
    explanation: >-
      States the clinical overlap at birth; the paper's own result, in the
      same abstract, is the shared mannose-6-phosphate sorting pathway that
      may explain it. The quoted sentence restates the clinical picture
      rather than reporting an experiment.
    quote_role: BACKGROUND
    directness: DIRECT
discussions:
- discussion_id: tnhp_postnatal_resolution_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does the hyperparathyroid and skeletal phenotype resolve after birth
    when the TRPV6 channel remains defective in the intestine, and what sets
    the limit on recovery in the patients whose features persist?
  rationale: >-
    The transient course is the disease's defining feature and is explained
    only by inference: the placental route is no longer needed after birth
    and enteral absorption is assumed to be sufficiently TRPV6-independent.
    No study has measured intestinal calcium absorption in a TRPV6 patient,
    and the mouse models point the other way, with cortical bone changes that
    persist into adulthood. Height below the 0.4th percentile at two years in
    one case and the incomplete resolution noted in the original series suggest the
    recovery is not always complete, but nothing identifies what determines
    it. The answer bears directly on how long these infants need
    supplementation and monitoring.
  attaches_to:
  - pathophysiology#Postnatal Enteral Calcium Supply Bypasses the Placental Defect
  - progression#Radiographic skeletal recovery
- discussion_id: tnhp_mouse_persistent_bone_phenotype
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can the Trpv6 mouse be used to study the transient course of this
    disease, given that its skeletal phenotype persists into adulthood while
    the human phenotype resolves?
  rationale: >-
    The mouse models establish the transport lesion convincingly, and the
    knockout gives the only direct measurement of maternal-to-fetal calcium
    flux available. But the Trpv6-deficient mouse's altered cortical bone
    microarchitecture persists in adulthood, whereas human infants
    remineralise over months to two years, and the mouse transports placental
    calcium largely through the yolk sac rather than a syncytiotrophoblast
    layer homologous to the human one. So the model is informative for the
    mechanism and not for the recovery, which is the part of the disease a
    family most wants a prognosis for.
  attaches_to:
  - pathophysiology#Impaired Transplacental Calcium Transport
  - animal_models#Trpv6 knockout mouse (maternal-fetal calcium transport)
  - animal_models#Trpv6-deficient mouse (trophoblast calcium uptake and offspring bone)
  proposed_experiments:
  - experiment_id: tnhp_enteral_calcium_absorption_during_recovery
    name: Measure intestinal calcium absorption in TRPV6-deficient infants during recovery
    description: >-
      Quantify enteral calcium absorption serially in affected infants as PTH
      normalises, to test whether recovery tracks absorptive capacity, and
      compare with the same measurement in the mouse to establish whether the
      species differ in how much intestinal calcium uptake survives loss of
      TRPV6.
    would_support:
    - pathophysiology#Postnatal Enteral Calcium Supply Bypasses the Placental Defect
    supporting_outcome:
    - >-
      Measurable enteral calcium absorption in affected infants that rises as
      PTH falls, indicating a TRPV6-independent absorptive route adequate to
      resolve the deficit.
    would_refute:
    - pathophysiology#Postnatal Enteral Calcium Supply Bypasses the Placental Defect
    refuting_outcome:
    - >-
      Absorption that remains as impaired as the placental route while PTH and
      the skeleton nonetheless recover, which would mean some other mechanism
      explains the transience.

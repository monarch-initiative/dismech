animal_models:
- name: Trpv6 knockout mouse (maternal-fetal calcium transport)
  species: Mouse
  genotype: Trpv6 knockout
  publication: PMID:18348695
  description: >-
    The original in vivo demonstration that TRPV6 carries maternal-to-fetal
    calcium. Knockout fetuses had lower calcium in blood and amniotic fluid,
    40 per cent less radiolabelled calcium transported from the mother, and
    lower ash weight. Placental Trpv6 transcript rises fourteen-fold over the
    last four days of gestation, matching the timing of fetal mineralisation.
  evidence:
  - reference: PMID:18348695
    reference_title: "Calcium channel TRPV6 is involved in murine maternal-fetal calcium transport."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results provide the first in vivo evidence that TRPV6 is involved in maternal-fetal Ca(2+) transport."
    explanation: >-
      Establishes the model as informative for the transport step this
      disease turns on.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  modeled_mechanisms:
  - target: Impaired Transplacental Calcium Transport
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the primary transport lesion and its downstream fetal
      calcium and mineralisation deficit.
    limitations: >-
      Mouse placental calcium transport occurs largely in the yolk sac rather
      than in a syncytiotrophoblast layer homologous to the human one, and
      the knockout removes the gene entirely rather than modelling the
      hypomorphic, trafficking-defective missense alleles that cause most
      human cases. The knockout also has no parathyroid or postnatal
      recovery phenotype reported here, so the transient course cannot be
      studied in it.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The transporting structure differs: TRPV6 protein in the mouse
        localises mainly to the intraplacental and extraplacental yolk sac,
        whereas the human channel sits in the syncytiotrophoblast layer. The
        transport claim holds; the cellular site does not transfer directly.
    readouts:
    - name: Radiolabelled calcium transport from mother to fetus
      target: Impaired Transplacental Calcium Transport
      direction: DECREASED
      interpretation: >-
        Direct functional measurement of the transport step, the closest
        available quantification of the human lesion.
      evidence:
      - reference: PMID:18348695
        reference_title: "Calcium channel TRPV6 is involved in murine maternal-fetal calcium transport."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The transport activity of radioactive Ca(2+) ((45)Ca) from mother to fetuses was 40% lower in Trpv6 knockout fetuses than in wildtypes."
        explanation: >-
          The measurement and its magnitude.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Fetal blood and amniotic fluid calcium concentration
      target: Impaired Transplacental Calcium Transport
      direction: DECREASED
      interpretation: >-
        The fetal consequence of the transport deficit, measured in the
        compartment that the human disease can only infer.
      evidence:
      - reference: PMID:18348695
        reference_title: "Calcium channel TRPV6 is involved in murine maternal-fetal calcium transport."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The Ca(2+) concentration in fetal blood and amniotic fluid was significantly lower in Trpv6 knockout fetuses than in wildtypes."
        explanation: >-
          The measured fetal calcium deficit.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Fetal ash weight
      target: Impaired Transplacental Calcium Transport
      direction: DECREASED
      interpretation: >-
        Whole-fetus mineral content, the model's analogue of skeletal
        undermineralisation.
      evidence:
      - reference: PMID:18348695
        reference_title: "Calcium channel TRPV6 is involved in murine maternal-fetal calcium transport."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The ash weight was also lower in Trpv6 knockout fetuses compared with wildtype fetuses."
        explanation: >-
          The mineralisation measurement.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
- name: Trpv6-deficient mouse (trophoblast calcium uptake and offspring bone)
  species: Mouse
  genotype: Trpv6 deficient
  publication: PMID:30786075
  description: >-
    Localises the defect to the trophoblast and extends it to the skeleton:
    trophoblast calcium uptake is impaired, placental and embryonic calcium
    content falls, and embryos are smaller with shorter, less calcified
    femurs. The altered cortical bone microarchitecture persists into
    adulthood, which is a point of contrast with the transient human course.
  evidence:
  - reference: PMID:30786075
    reference_title: "Maternal Transient Receptor Potential Vanilloid 6 (Trpv6) Is Involved In Offspring Bone Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results show that TRPV6 is necessary for the Ca2+ uptake in trophoblasts and that TRPV6 deficiency in the placenta leads to reduced embryo growth, minor bone calcification, and impaired bone development."
    explanation: >-
      States what the model establishes, which is the trophoblast locus of
      the defect and its skeletal consequence.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  modeled_mechanisms:
  - target: Impaired Transplacental Calcium Transport
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Impaired calcium uptake measured in primary trophoblasts, the cell
      layer the human channel acts in.
    limitations: >-
      Uptake is measured in mouse primary trophoblasts rather than human
      syncytiotrophoblast, and the model is a full gene deletion rather than
      a patient allele.
    readouts:
    - name: Trophoblast calcium uptake
      target: Impaired Transplacental Calcium Transport
      direction: DECREASED
      interpretation: >-
        Cell-level measurement of the entry step.
      evidence:
      - reference: PMID:30786075
        reference_title: "Maternal Transient Receptor Potential Vanilloid 6 (Trpv6) Is Involved In Offspring Bone Development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ca2+ uptake in trophoblasts is impaired in the absence of Trpv6."
        explanation: >-
          The uptake measurement.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
  - target: Fetal Skeletal Undermineralisation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shorter and less calcified femurs with altered cortical
      microarchitecture in Trpv6-deficient embryos.
    limitations: >-
      The mouse skeletal phenotype is reduced calcification and altered
      cortical microarchitecture that persists into adulthood, not the
      intrauterine fractures, bell-shaped thorax and subsequent
      remineralisation that define the human disease. The persistence is the
      opposite of the human transient course, so the model cannot be used to
      infer prognosis.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Fractures, thoracic insufficiency, respiratory failure and the
        postnatal radiographic recovery that give the human disease its name
        are not reported in the model; it captures reduced calcification
        only.
    readouts:
    - name: Femur length and calcification
      target: Fetal Skeletal Undermineralisation
      direction: DECREASED
      interpretation: >-
        Skeletal mineralisation and growth in the embryo.
      evidence:
      - reference: PMID:30786075
        reference_title: "Maternal Transient Receptor Potential Vanilloid 6 (Trpv6) Is Involved In Offspring Bone Development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Trpv6-deficient embryos are smaller, have a lower body weight, and shorter and less calcified femurs."
        explanation: >-
          The measured skeletal phenotype.
        quote_role: PRIMARY_RESULT
        directness: DIRECT

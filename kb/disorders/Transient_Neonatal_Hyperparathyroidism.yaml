- name: Postnatal Enteral Calcium Supply Bypasses the Placental Defect
  description: >-
    After birth the infant no longer depends on the placenta for calcium.
    TRPV6 also contributes to intestinal calcium absorption, but enteral
    uptake is not wholly TRPV6-dependent, so supplemented oral calcium,
    phosphate and vitamin D restore mineral balance, PTH falls over one to
    three months and the skeleton remineralises over months to two years.
    This is the mechanism the word "transient" in the disease name refers to.
    It is an explanation reconstructed from the consistent clinical course
    rather than a directly measured one, and recovery is not invariably
    complete.
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  role: compensation resolving the mineral deficit after birth
  cell_types:
  - preferred_term: intestinal enterocyte
    term:
      id: CL:0000584
      label: enterocyte

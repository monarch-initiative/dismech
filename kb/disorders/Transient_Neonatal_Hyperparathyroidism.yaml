    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, 89% (8/9 cases) of neonates with vitamin D deficiency exhibited concomitant hypocalcaemia, whereas no hypocalcaemia was observed in those without vitamin D deficiency."
    explanation: >-

progression:
- phase: Third-trimester fetal calcium deprivation
  age_range: Approximately 20 weeks gestation to birth
  notes: >-
    Transplacental calcium supply fails as fetal mineral demand peaks.
    Skeletal abnormalities are detectable on antenatal ultrasound in most
    pregnancies, from as early as 20 weeks in the most severe reported case,
    as short long bones, a narrow or bell-shaped thorax and polyhydramnios.
  evidence:
  - reference: PMID:41951207
    reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatally, ultrasound detected abnormalities in 79% (11/14), featuring short long bones, narrow or bell-shaped thorax and polyhydramnios."
    explanation: >-
      Dates the prenatal phase and names what is seen in it.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:32228492
    reference_title: "Post-mortem histology in transient receptor potential cation channel subfamily V member 6 (TRPV6) under-mineralising skeletal dysplasia suggests postnatal skeletal recovery: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The female infant had severe antenatal and postnatal skeletal abnormalities by 20 weeks gestation and was ventilator-dependent from birth."
    explanation: >-
      Earliest reported gestational age at which the skeletal phenotype was
      apparent.
    quote_role: PRIMARY_RESULT
- phase: Neonatal decompensation
  age_range: Birth to approximately 1 month
  notes: >-
    Respiratory distress from thoracic insufficiency dominates, requiring
    transient or prolonged positive-pressure ventilation. PTH is elevated in
    every reported case and alkaline phosphatase rises over the first weeks.
  evidence:
  - reference: PMID:41951207
    reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postnatally, nearly all infants (92%, 12/13 cases) exhibit respiratory distress secondary to thoracic deformity, requiring transient or prolonged PPV; two cases even required tracheostomy for long-term ventilation."
    explanation: >-
      Characterises the neonatal phase and its ventilatory burden.
    quote_role: REVIEW_SYNTHESIS
- phase: Biochemical normalisation
  age_range: Approximately 1 to 17 months
  notes: >-
    PTH falls to the reference range between one and three months and
    alkaline phosphatase more slowly, between three and seventeen months,
    under oral calcium, phosphate and vitamin D supplementation.
  evidence:
  - reference: PMID:41951207
    reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTH levels normalise between 1 and 3 months, while ALP levels resolve gradually, typically between 3 and 17 months."
    explanation: >-
      Source of the age range for this phase.
    quote_role: REVIEW_SYNTHESIS
- phase: Radiographic skeletal recovery
  age_range: Approximately 6 months to 2 years
  notes: >-
    Mineralisation and fracture healing progress until the skeletal survey
    normalises. This is the phase the disease name refers to. Recovery is not
    always complete within the reported follow-up: in one case height was
    below the 0.4th percentile at two years despite full biochemical and
    radiographic recovery. Prognosis with timely supplementation is
    generally good: developmental outcome was normal or age-appropriate by
    two years in seven of eight cases with documented follow-up, the one
    exception having had a perinatal stroke, and the only reported death
    among live-born cases was from complications judged unrelated to the
    disease.
  evidence:

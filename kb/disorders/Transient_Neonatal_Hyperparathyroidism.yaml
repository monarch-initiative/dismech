- name: Impaired Transplacental Calcium Transport
  description: >-
    TRPV6 provides the apical calcium entry step of transcellular calcium
    movement across the syncytiotrophoblast, the transporting epithelium of
    the human placenta. Because fetal blood calcium is held above the
    maternal concentration, this transfer is uphill and depends on an active
    transcellular route rather than paracellular leak, so losing the entry
    channel cannot be compensated by diffusion. Transcript levels rise
    sharply in late gestation as fetal mineral demand peaks, which is why the
    deficit manifests in the third trimester.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  role: primary transport defect
  cell_types:
  - preferred_term: placental syncytiotrophoblast
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  biological_processes:
  - preferred_term: transcellular calcium transport across the syncytiotrophoblast
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: DECREASED
  downstream:
  - target: Fetal Hypocalcaemia
    causal_link_type: DIRECT
    description: >-
      Reduced maternal-to-fetal calcium flux lowers fetal circulating
      calcium.
    evidence:
    - reference: PMID:18348695
      reference_title: "Calcium channel TRPV6 is involved in murine maternal-fetal calcium transport."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Ca(2+) concentration in fetal blood and amniotic fluid was significantly lower in Trpv6 knockout fetuses than in wildtypes."
      explanation: >-
        Shows reduced transport and reduced fetal calcium together in the
        knockout, which is the step this edge asserts. Mouse evidence; the
        human counterpart is the hypocalcaemia and elevated PTH recorded in
        the phenotypes.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:42685659
    reference_title: "Functional expression of TRPV6 in human syncytiotrophoblasts from trophoblast stem cells - possible role in maternal-fetal calcium transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Second Ca2+ peak, when the syncytiotrophoblasts might mature with transport function, was found to be a Ca2+ flux through TRPV6."
    explanation: >-
      Demonstrates TRPV6-mediated calcium flux in human syncytiotrophoblasts,
      which is the cell type this node names.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:41437274
    reference_title: "The intracellular localization and the ionic permeation of TRPV6 triggers chronic pancreatitis, skeletal dysplasia and is connected to mucolipidosis type II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that TRPV6 channels are localized in intracellular vesicles in pancreatic acinar cells, in the syncytiotrophoblast layer of the placenta and, after overexpression, in HEK293 cells."
    explanation: >-
      Independent localisation of the channel to the syncytiotrophoblast
      layer.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32646367
    reference_title: "Novel TRPV6 mutations in the spectrum of transient neonatal hyperparathyroidism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In many mammalian species, including humans, fetal blood Ca2+ levels are higher than those in mature individuals, suggesting that the transport is mediated by uphill or energy-consuming transport through epithelial, transcellular, rather than paracellular routes"
    explanation: >-
      Establishes why the transfer must be active and transcellular, which is
      what makes loss of the entry channel non-compensable.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:18348695
    reference_title: "Calcium channel TRPV6 is involved in murine maternal-fetal calcium transport."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In wildtype mice, placental TRPV6 mRNA increased 14-fold during the last 4 days of gestation, which coincides with fetal bone mineralization."
    explanation: >-

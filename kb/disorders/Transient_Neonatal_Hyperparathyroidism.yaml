pathophysiology:
- name: TRPV6 Channel Loss of Function
  description: >-
    Biallelic TRPV6 variants abolish or severely reduce calcium flux through
    the channel. The reported mechanisms are heterogeneous: frameshift and
    nonsense alleles truncate the protein, splice-altering alleles reduce
    functional transcript, and missense alleles act by mislocalisation - some
    failing to traffic to the plasma membrane, others retained in the
    endoplasmic reticulum or not delivered to intracellular vesicles - or by
    destabilising the tetramer. A few missense alleles retain
    near-normal unitary conductance and cause disease through reduced surface
    abundance rather than altered gating.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: initiating molecular lesion
  genetic_context:
    gene:
      preferred_term: TRPV6
      term:
        id: hgnc:14006
        label: TRPV6
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Most reported genotypes are compound heterozygous; homozygous genotypes
      occur in consanguineous families, and one monoallelic dominant-negative
      case is reported.
  molecular_functions:

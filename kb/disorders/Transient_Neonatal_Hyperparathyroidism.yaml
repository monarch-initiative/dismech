      evidence_source: IN_VITRO
      snippet: "However, coimmunoprecipitation, intracellular calcium imaging, and patch-clamp studies suggested that the p.Val625Glu variant exerts a dominant-negative effect by interacting with the wild-type subunit to form a heteromeric complex, thereby impairing channel function."
      explanation: >-
        The functional demonstration of the dominant-negative mechanism.

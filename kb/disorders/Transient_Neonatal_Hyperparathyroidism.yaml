- name: Fetal Hypocalcaemia
  description: >-
    Insufficient placental supply leaves the fetus unable to maintain the
    calcium concentration its mineralising skeleton requires. Postnatally the
    deficit is often no longer measurable as frank hypocalcaemia: serum
    calcium is normal in about a third of reported neonates, and
    hypocalcaemia at presentation tracks with coexisting vitamin D
    deficiency rather than with the TRPV6 genotype alone.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  role: systemic mineral deficit
  chemical_entities:
  - preferred_term: ionised calcium
    term:
      id: CHEBI:29108
      label: calcium(2+)
    modifier: DECREASED
  downstream:
  - target: Hypocalcemia
    causal_link_type: DIRECT
    description: >-
      The intrauterine calcium deficit is measurable postnatally as low serum
      calcium in about two thirds of neonates. In the published series the
      neonates who were normocalcaemic at birth were those without vitamin D
      deficiency, so maternal and neonatal vitamin D status, rather than the
      degree of parathyroid compensation, is what the evidence links to
      whether hypocalcaemia is present at presentation.
  - target: Secondary Fetal Hyperparathyroidism
    causal_link_type: DIRECT
    description: >-
      Low circulating calcium drives compensatory parathyroid hormone
      secretion in the fetus.
    evidence:
    - reference: PMID:41951207
      reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Biochemically, neonates universally present with elevated PTH (14/14 cases), regardless of hypocalcaemia status, which is suggestive of compensatory hyperparathyroidism."
      explanation: >-
        Identifies the parathyroid response as compensatory, while recording
        that measured hypocalcaemia is not required for it - the reason this
        edge is drawn from the fetal deficit rather than from the neonatal
        calcium value.
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
  evidence:

genetic:
- name: TRPV6
  gene_term:
    preferred_term: TRPV6
    term:
      id: hgnc:14006
      label: TRPV6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: the only gene known to cause this disease
  notes: >-
    Nineteen distinct TRPV6 variants had been reported across the fourteen
    published cases, two thirds of them missense, with p.Gly451Glu the most
    recurrent. Mechanistically the alleles divide into those that remove the
    protein or its pore and those that leave a channel with near-normal
    conductance but fail to deliver it to the plasma membrane, so a normal
    patch-clamp result for a single allele does not exclude pathogenicity;
    the genotype has to be read as a tetramer. Separately,
    heterozygous TRPV6 variants that reduce calcium permeability are
    associated with non-alcoholic chronic pancreatitis, so TRPV6 carries two
    distinct disease associations at different allele dosages. ClinGen has
    not curated the gene-disease validity of this pair, so no
    "gene_disease_validity" assertion is recorded rather than one being
    assigned here.
  evidence:
  - reference: PMID:29861107
    reference_title: "TRPV6 Variants Interfere with Maternal-Fetal Calcium Transport through the Placenta and Cause Transient Neonatal Hyperparathyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report six subjects with homozygous and/or compound-heterozygous mutations in the gene encoding the transient receptor potential cation channel, subfamily V, member 6 (TRPV6), an epithelial Ca2+-selective channel associated with this condition."
    explanation: >-
      The gene-disease discovery series.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:41951207
    reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "19 distinct TRPV6 variants have been identified. Genetically, with one exception (case 14), the disease mostly follows an autosomal recessive inheritance pattern, with compound heterozygous mutations being the most common (71%, 10/14 cases), followed by homozygous mutations (21%, 3/14 cases)."
    explanation: >-
      Source of the variant count and the allelic architecture in the notes.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: PMID:41437274
    reference_title: "The intracellular localization and the ionic permeation of TRPV6 triggers chronic pancreatitis, skeletal dysplasia and is connected to mucolipidosis type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous TRPV6 mutations, which reduce significantly the Ca2+-permeability of the channel, lead to chronic pancreatitis and, if both TRPV6-alleles are affected, to skeletal dysplasia with neonatal transient hyperparathyroidism (TNHP) of newborns."
    explanation: >-
      States the allele-dosage split between the pancreatic and the neonatal
      skeletal phenotype that the notes describe. The sentence is the
      opening framing of a cell-biology paper and restates the human
      genetic associations established elsewhere, so it is graded on the
      human clinical picture it describes.
    quote_role: BACKGROUND
    directness: DIRECT
  variants:
  - name: p.Gly660Arg
    description: >-
      A missense variant in the C-terminal hook, reported in trans with the
      nonsense allele p.Arg510Ter. It does not reduce the calcium
      permeability of the channel itself; in coexpression it lowers calcium
      uptake by reducing the number of functional channels at the plasma
      membrane, and in silico modelling predicts it destabilises the
      tetramer interface.
    gene:
      preferred_term: TRPV6
      term:
        id: hgnc:14006
        label: TRPV6
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:30144375
      reference_title: "TRPV6 compound heterozygous variants result in impaired placental calcium transport and severe undermineralization and dysplasia of the fetal skeleton."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Trio exome analysis identified compound heterozygous TRPV6 likely pathogenic variants: novel maternally inherited missense variant, c.1978G > C p.(Gly660Arg), and paternally inherited nonsense variant, c.1528C > T p.(Arg510Ter), confirming recessive inheritance."
      explanation: >-
        Source of the variant, its phase and its reported classification.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    - reference: PMID:34884497

    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Secondary Fetal Hyperparathyroidism
  description: >-
    The fetal parathyroid glands respond to the calcium deficit with
    sustained PTH secretion. This is the single most consistent finding in
    the disease: PTH is elevated in every reported case, often to extreme
    values, and is elevated whether or not the infant is hypocalcaemic. It
    is secondary - a response to deficient supply - not a primary
    parathyroid disorder, which is what distinguishes the entity from
    neonatal severe primary hyperparathyroidism.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  role: compensatory endocrine response
  cell_types:

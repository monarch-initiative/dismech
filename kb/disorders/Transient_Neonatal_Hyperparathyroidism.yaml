treatments:
- name: Oral calcium, phosphate and vitamin D supplementation
  description: >-
    The mainstay of treatment. Reported regimens use oral calcium, phosphate
    and vitamin D; one series gave calcium 50 mg/kg/day, phosphate 0.6
    mmol/kg/day and vitamin D 400 to 800 IU/day. Biochemistry normalises over
    one to three months and the skeleton radiographically over six months to
    two years. Prognosis with early supplementation is reported as
    excellent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: calcium, phosphate and vitamin D supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: oral calcium (salt not specified in the sources)
      term:
        id: CHEBI:29108
        label: calcium(2+)
    - preferred_term: oral phosphate (salt not specified in the sources)
      term:
        id: CHEBI:26020
        label: phosphate
    - preferred_term: vitamin D (form not specified in the sources)
      term:
        id: CHEBI:27300
        label: vitamin D
  notes: >-
    The reported regimens name only "calcium", "phosphate" and "vitamin D"
    without the salt or the vitamin D form, so the agents are bound at that
    level rather than to calcium carbonate or cholecalciferol.
  target_mechanisms:
  - target: Postnatal Enteral Calcium Supply Bypasses the Placental Defect
    description: >-
      Supplementation works through the enteral route, which does not depend
      on the placental channel, and so corrects the mineral deficit that
      drives the hyperparathyroid state.
    evidence:
    - reference: PMID:41951207
      reference_title: "TRPV6-related intrauterine calciopenic rickets: a case report and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Postnatal mineralisation is primarily supported by oral calcium, phosphate and vitamin D supplementation."
      explanation: >-
        States that postnatal mineralisation is achieved by the oral route,
        which is the mechanism this link names.
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
  target_phenotypes:

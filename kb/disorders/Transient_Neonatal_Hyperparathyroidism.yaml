    snippet: "These results suggest that TNHP is an autosomal-recessive disease caused by TRPV6 mutations that affect maternal-fetal calcium transport."
    explanation: >-
      The gene-discovery series states the mode of inheritance directly.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

diagnosis:
- name: Clinical and radiological diagnosis, confirmed molecularly
  description: >-
    Diagnosis rests on the radiographic pattern: delayed and impaired vertebral body
    ossification together with large epiphyseal ossification centres, wide growth plates and
    pseudoepiphyses of the short tubular bones. That combination of axial under-ossification
    with appendicular excess is what distinguishes SMMD from other spondyloepiphyseal
    dysplasias. Molecular confirmation is by NKX3-2 sequencing. Because the disorder is so
    rarely seen, the review describing the perinatally lethal case notes explicitly that the
    diagnostic features are not yet fully established.
  evidence:
  - reference: PMID:29704686
    reference_title: "A novel NKX3-2 mutation associated with perinatal lethal phenotype of spondylo-megaepiphyseal-metaphyseal dysplasia in a neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A diagnosis of SMMD was made on clinical and radiological grounds."
    explanation: States that the diagnosis is made clinically and radiographically.
  - reference: PMID:29704686
    reference_title: "A novel NKX3-2 mutation associated with perinatal lethal phenotype of spondylo-megaepiphyseal-metaphyseal dysplasia in a neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the rarity of the disorder, the diagnostic feature has not been fully established yet."
    explanation: >-
      Records the authors' own caveat that the diagnostic criteria are not settled, which is the
      honest limit on the section above.
- name: Cervical spine surveillance
  description: >-
    Distinct from the diagnostic workup above, and with a different purpose: not to establish
    the diagnosis but to detect instability before the cord is injured. It is the step that
    makes the one effective intervention in this disorder possible, and it is prompted by
    recognising the radiographic pattern rather than by neurological symptoms - by the time
    spasticity appears, the injury has happened.
  evidence:
  - reference: PMID:22791571
    reference_title: Severe neurologic manifestations from cervical spine instability in spondylo-megaepiphyseal-metaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis of SMMD by recognition of the radiographic pattern might prevent of the neurologic complications via prophylactic cervical spine stabilization."
    explanation: >-
      Ties recognition of the radiographic pattern to the preventive action. The same sentence
      supports the treatment entry; it is cited in both places because it makes both claims and
      the surveillance is useless without the intervention it enables.
  - reference: PMID:22791571
    reference_title: Severe neurologic manifestations from cervical spine instability in spondylo-megaepiphyseal-metaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the rarity of the condition, its diagnostic features and natural course are not well known."
    explanation: >-
      The caveat that governs this whole section. Recorded because a surveillance recommendation
      reads as settled practice unless the state of knowledge behind it is stated.
treatments:
- name: Prophylactic Cervical Spine Stabilization
  description: >-
    The one intervention in this disorder that changes the outcome rather than managing it. The
    upstream lesion is an embryonic transcription-factor failure and is not therapeutically
    accessible after birth; cervical instability is. Stabilization is prophylactic in the strict
    sense - performed on the basis of the radiographic pattern before cord injury has occurred,
    not as treatment for an established myelopathy.

    The evidence is a proposal rather than a demonstration, and the entry records it that way.
    The authors write that early diagnosis "might prevent" the neurologic complications; no
    series has reported outcomes in patients stabilized prophylactically, and with six patients
    described in total there is no prospect of one soon. This is curated because the reasoning
    is sound and the stakes are high, not because it has been shown to work.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cervical spine stabilization
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  target_mechanisms:
  - target: Cervical Spine Instability and Cord Injury
    description: >-
      Mechanically stabilizes the unossified cervical spine, interrupting the step from
      instability to cord compression. It does not address the ossification defect itself.
  evidence:
  - reference: PMID:22791571
    reference_title: Severe neurologic manifestations from cervical spine instability in spondylo-megaepiphyseal-metaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis of SMMD by recognition of the radiographic pattern might prevent of the neurologic complications via prophylactic cervical spine stabilization."
    explanation: >-
      The recommendation, quoted with the authors' hedge ("might prevent") and with their own
      grammatical slip left in place, since a snippet does not correct its source. This is a
      proposal from a case series, not an outcome.
- name: Respiratory and Surgical Supportive Care
  description: >-
    There is no disease-modifying treatment. Management is supportive and, at the severe end,
    intensive: the perinatally lethal case required immediate intubation in the delivery room
    and surgery for duodenal atresia on day 7, and died of sepsis and respiratory failure on
    day 14. The clinical picture in that infant suggested very early cervical cord compression,
    which is the specific risk the axial ossification defect creates and the reason airway and
    cervical spine assessment matter in this disorder.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29704686
    reference_title: "A novel NKX3-2 mutation associated with perinatal lethal phenotype of spondylo-megaepiphyseal-metaphyseal dysplasia in a neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient required immediate intubation at the delivery room and duodenal atresia was detected during his course in neonatal intensive care unit."
    explanation: Documents the supportive interventions required at the severe end of the spectrum.
  - reference: PMID:29704686
    reference_title: "A novel NKX3-2 mutation associated with perinatal lethal phenotype of spondylo-megaepiphyseal-metaphyseal dysplasia in a neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the findings of clubfoot, neuromuscular respiratory insufficiency requiring invasive mechanical ventilation and downward sloping or tented appearance of the ribs were suggestive of very early cervical cord compression leading to perinatal mortality"
    explanation: >-
      Identifies cervical cord compression as the proposed mechanism of perinatal death, which
      is what makes airway and cervical spine assessment the priority. Stated by the authors as
      suggestive rather than demonstrated; no imaging was possible.

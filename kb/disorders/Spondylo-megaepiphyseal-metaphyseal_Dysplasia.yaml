- name: Loss of Chondrocyte Survival Signalling
  description: >-
    A second, parallel arm of NKX3-2 function, distinct from the maturation brake modelled
    above. In proliferating chondrocytes NKX3-2 constitutively activates RelA by a
    ligand-independent route - recruiting the RelA-IkappaB-alpha complex into the nucleus by
    direct protein-protein interaction and degrading IkappaB-alpha there - and that NF-kappaB
    activity is required for chondrocyte viability. Losing it removes a survival signal from
    exactly the cells the maturation brake acts on.

    This makes NKX3-2 a dual-function node rather than a single repressor: a brake on maturation
    and a survival signal for the cells being braked. The two arms converge, which is consistent
    with the mouse null showing increased apoptosis alongside failed chondrogenesis.

    Curated as PROVISIONAL for this disease. The mechanism is established in chick and mouse
    chondrocytes and has not been shown in a patient with SMMD, so its contribution to the human
    phenotype is inferred from the gene rather than demonstrated in the disease.

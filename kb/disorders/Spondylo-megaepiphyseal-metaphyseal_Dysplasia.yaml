- name: Derepression of the Chondrocyte Maturation Program
  description: >-
    NKX3-2 normally restrains chondrocyte maturation, acting as a transcriptional repressor of
    Runx2 in the proliferative zone and being switched off as maturation begins. The direction
    of the mechanism is established by a construct experiment: wild-type Nkx3.2 blocks
    maturation, while a reverse-function mutant converted into a transcriptional activator
    accelerates it, and Runx2 mis-expression rescues the Nkx3.2-induced block. Losing NKX3-2
    therefore removes a brake on maturation timing rather than removing a positive signal.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

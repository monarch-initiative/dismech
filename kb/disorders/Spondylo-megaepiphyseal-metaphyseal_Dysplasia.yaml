genetic:
- name: NKX3-2
  gene_term:
    preferred_term: NKX3-2
    term:
      id: hgnc:951
      label: NKX3-2
  relationship_type: CAUSATIVE
  notes: >-
    Homeobox-containing transcription factor at 4p15.33, also known as BAPX1. Acts as a
    transcriptional repressor in the proliferative zone of the growth plate, downstream of PTHrP
    signalling, holding chondrocytes immature by repressing Runx2. All reported disease alleles
    are inactivating.

    The deep-research report supplies gnomAD constraint metrics for this gene (pLI 0.0009,
    LOEUF 1.07, o/e 0.67) as the quantitative basis for the haplosufficiency that explains the
    recessive inheritance. They are not curated as evidence: they are a database lookup with no
    citable publication behind them in the report, and they could not be independently verified
    from this environment. Recorded here as a lead rather than asserted.
  evidence:
  - reference: PMID:20004766
    reference_title: "Homozygous inactivating mutations in the NKX3-2 gene result in spondylo-megaepiphyseal-metaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each proband was homozygous for a different inactivating mutation in NKX3-2, a homeobox-containing gene located on chromosome 4p15.33."
    explanation: >-
      Identifies the gene, its class and locus, and establishes that the disease alleles are
      inactivating rather than of mixed consequence.
  - reference: PMID:16421188
    reference_title: "Nkx3.2/Bapx1 acts as a negative regulator of chondrocyte maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Nkx3.2/Bapx1 expression is lost in the growth plates of mice engineered to lack PTHrP signaling and, conversely, is maintained by ectopic expression of PTHrP in developing bones."
    explanation: >-
      Places NKX3-2 downstream of PTHrP signalling in the growth plate, in both directions of
      the manipulation.
- name: NKX3-1
  gene_term:
    preferred_term: NKX3-1
    term:
      id: hgnc:7838
      label: NKX3-1
  relationship_type: MODIFIER
  notes: >-
    A functionally overlapping paralog, coexpressed with NKX3-2 in somites during early
    development. Whether it modifies severity in human SMMD is not established - the evidence is
    entirely murine, and Nkx3.1 single nulls have no skeletal phenotype at all. Recorded because
    it is the only candidate modifier this literature offers and because the double-null result
    bears on why the human phenotype is survivable: partial redundancy would predict that a
    residual NKX3-1 contribution buffers the loss.
  evidence:
  - reference: PMID:12204261
    reference_title: Transcription factors Nkx3.1 and Nkx3.2 (Bapx1) play an overlapping role in sclerotomal development of the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Double mutants exhibited enhanced defects of vertebrae compared with Bapx1-deficient animals."
    explanation: >-
      The redundancy result. Enhancement over the single null is what makes this a modifier
      rather than an independent cause.
  - reference: PMID:12204261
    reference_title: Transcription factors Nkx3.1 and Nkx3.2 (Bapx1) play an overlapping role in sclerotomal development of the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, inactivation of the Nkx3.1 gene causes no apparent skeletal phenotype despite its early expression in sclerotomal cells."
    explanation: >-
      The negative half, and the reason this is a modifier and not a second disease gene: losing
      NKX3-1 alone does nothing to the skeleton.

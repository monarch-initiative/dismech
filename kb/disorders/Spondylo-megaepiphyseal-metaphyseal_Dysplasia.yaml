    snippet: "As a result of the cervical spine instability or deformation, five of six patients in our series suffered cervical cord injury that manifested clinically as limb spasticity."
    explanation: >-
      The step from instability to cord injury and its clinical readout, with the authors'
      attribution ("as a result of") rather than a co-occurrence. Six patients, so the
      proportion is fragile even though the direction is not.
- name: Loss of Post-Embryonic Restraint on Joint Chondrocyte Proliferation
  description: >-
    A distinct, later-acting arm identified in an adult viable zebrafish mutant: chondrocytes
    show increased proliferation and upregulation of stress-induced pathways, including
    prostaglandin synthases, and the animals develop cartilage overgrowth and severe spine and
    craniofacial dysmorphology. This arm is what accounts for the skeletal *overgrowth* of SMMD
    rather than its ossification deficit, and it is post-embryonic - the same overgrowth is
    absent in knockdown animals that lack jaw joints, which is the internal control separating
    the embryonic from the later role.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

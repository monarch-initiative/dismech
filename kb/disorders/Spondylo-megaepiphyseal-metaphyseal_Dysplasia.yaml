      not. The dissociation is why this arm is modelled separately.
- name: Deranged Endochondral Ossification
  description: >-
    The consequence is not uniform under- or over-ossification but a disordered one. In the
    axial skeleton, vertebral body ossification is delayed and impaired, in the severe case
    absent altogether. In the appendicular skeleton, epiphyseal ossification centres are large,
    growth plates are wide, and pseudoepiphyses appear in the short tubular bones. NKX3-2 is
    therefore required for endochondral ossification of both the axial and appendicular
    skeleton in humans.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

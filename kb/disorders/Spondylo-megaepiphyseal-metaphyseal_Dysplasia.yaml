name: Spondylo-megaepiphyseal-metaphyseal Dysplasia
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- SMMD
- spondylo-megaepiphyseal-metaphyseal dysplasia
description: >-
  SMMD is a rare autosomal recessive skeletal dysplasia caused by biallelic inactivating
  variants in NKX3-2 (also called BAPX1), a homeobox transcription factor on chromosome 4p15.33.
  Affected individuals have disproportionate short stature with a short, stiff neck and trunk,
  while the limbs appear relatively long.

  The radiographic picture is the diagnostic one and it is unusual in combining two opposite
  failures: delayed and impaired ossification of the vertebral bodies alongside abnormally
  *large* epiphyseal ossification centres and wide growth plates in the long bones, plus
  numerous pseudoepiphyses in the short tubular bones of hands and feet. Deficient ossification
  in the axial skeleton and excessive cartilage in the appendicular skeleton are the same
  lesion seen in two places.

  The mechanism explains why. NKX3-2 acts in the proliferative zone of the growth plate as a
  transcriptional repressor that holds chondrocytes immature - it represses Runx2, the
  chondrocyte maturation factor, and is normally switched off as maturation begins. It sits
  downstream of PTHrP signalling. So the protein's job is to *restrain* maturation, and losing
  it deranges the timing of endochondral ossification rather than simply reducing it: bone that
  should form does not, and cartilage that should be replaced persists and overgrows.

  A zebrafish model added a second, later role. Adult viable nkx3.2 mutant fish show cartilage
  overgrowth and spinal dysmorphology, with mutant chondrocytes showing increased proliferation
  and upregulated stress-response pathways. That points to a post-embryonic function in damping
  proliferation and buffering stress in joint-associated chondrocytes, which is the part of the
  human phenotype that embryonic-lethal models could not show.

  Severity spans a wide range. At the severe end a newborn had total absence of vertebral body,
  pubic and ischial ossification and died on day 14, with the clinical picture suggesting very
  early cervical cord compression.

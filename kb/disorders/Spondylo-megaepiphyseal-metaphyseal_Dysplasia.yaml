- name: Adult viable nkx3.2 mutant zebrafish
  species: Zebrafish
  genotype: nkx3.2 mutant (adult viable)
  publication: PMID:33462117
  description: >-
    Survives to adulthood, unlike the embryonic-lethal mouse and knockdown models, and is the
    only model to reproduce the skeletal overgrowth arm of SMMD. Shows cartilage overgrowth in
    place of a missing jaw joint, severe facial, skullcap and spine dysmorphology.
  modeled_mechanisms:
  - target: Loss of Post-Embryonic Restraint on Joint Chondrocyte Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Generated specifically to model the skeletal overgrowth defects of SMMD, which prior
      models could not show, and identifies increased chondrocyte proliferation and a stress
      response as the cellular basis.
    limitations: >-
      Zebrafish skeletal anatomy differs substantially from human: the overgrowth phenotype is

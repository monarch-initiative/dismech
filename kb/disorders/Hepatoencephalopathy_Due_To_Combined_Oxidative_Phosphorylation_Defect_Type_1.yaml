    term:
      id: hgnc:13780
      label: GFM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic GFM1 variants cause the disease. More than twenty patients from
    unrelated families have been reported since the first family in 2004,
    with functional complementation in yeast and mammalian cells and a mouse
    model reproducing the molecular defect.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:41998139
      reference_title: Systemic delivery of AAV-GFM1 corrects COXPD1 molecular alterations in Gfm1(R671C/-) mice.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        is an autosomal recessive mitochondrial disease caused by defects or
        deficiency of the mitochondrial translation elongation factor G1 (EFG1)
      explanation: States the autosomal recessive inheritance of the GFM1 disease.
  notes: >-
    ClinGen rates GFM1 Moderate for Leigh syndrome (MONDO:0009723), a
    different disease from this entry's MONDO term, so that tier is not
    recorded here.
  evidence:
  - reference: PMID:15537906
    reference_title: Mutant mitochondrial elongation factor G1 and combined oxidative phosphorylation deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We mapped the defective gene to a region on chromosome 3q containing
      elongation factor G1 (EFG1), which encodes a mitochondrial translation
      factor. Sequencing of EFG1 revealed a mutation affecting a conserved
      residue of the guanosine triphosphate (GTP)-binding domain.
    explanation: The founding family, in which the disease was mapped to GFM1 (EFG1).
  - reference: PMID:17160893
    reference_title: Infantile encephalopathy and defective mitochondrial DNA translation in patients with mutations of mitochondrial elongation factors EFG1 and EFTu.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Yeast and mammalian cell systems proved the pathogenic role of the mutant
      alleles by functional complementation in vivo.
    explanation: Functional complementation confirms that the GFM1 alleles cause the defect.
  - reference: PMID:31680380
    reference_title: Clinical, neuroimaging and biochemical findings in patients and patient fibroblasts expressing ten novel GFM1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report clinical, biochemical, and neuroimaging findings from nine
      unrelated children carrying GFM1 variants, 10 of which were not previously
      reported.
    explanation: Nine further unrelated patients with GFM1 variants.
pathophysiology:
- name: GFM1 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Mitochondrial Translation Machinery Lesion"
  description: >-
    Biallelic GFM1 variants lower the amount or activity of mitochondrial
    elongation factor G1, the GTP-dependent translocase of the mitochondrial
    ribosome. The founding variant alters a conserved residue of the
    GTP-binding domain, and patient fibroblasts carry less EFG1 protein.
  genes:
  - preferred_term: GFM1
    term:
      id: hgnc:13780
      label: GFM1
  molecular_functions:
  - preferred_term: translation elongation factor activity
    modifier: DECREASED
    term:
      id: GO:0003746
      label: translation elongation factor activity
  - preferred_term: GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:15537906
    reference_title: Mutant mitochondrial elongation factor G1 and combined oxidative phosphorylation deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of EFG1 revealed a mutation affecting a conserved residue of
      the guanosine triphosphate (GTP)-binding domain.
    explanation: The founding variant sits in the GTP-binding domain that drives EFG1's translocase activity.
  - reference: PMID:31680380
    reference_title: Clinical, neuroimaging and biochemical findings in patients and patient fibroblasts expressing ten novel GFM1 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant EFG1 and OXPHOS proteins were decreased in patient's fibroblasts
      consistent with impaired mitochondrial translation.
    explanation: Patient fibroblasts have less mutant EFG1 protein.
  downstream:
  - target: Impaired Mitochondrial Translational Elongation
    causal_link_type: DIRECT
    description: >-
      Less elongation factor G1 activity slows translocation of the
      mitochondrial ribosome and so elongation of every mitochondrially
      translated polypeptide.
- name: Impaired Mitochondrial Translational Elongation
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_translation_deficiency#Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits"
  description: >-
    Mitochondrial protein synthesis is reduced, and with it the supply of the
    thirteen mitochondrial DNA-encoded subunits of complexes I, III, IV and V.
  biological_processes:
  - preferred_term: mitochondrial translational elongation
    modifier: DECREASED
    term:
      id: GO:0070125
      label: mitochondrial translational elongation
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  evidence:
  - reference: PMID:15537906
    reference_title: Mutant mitochondrial elongation factor G1 and combined oxidative phosphorylation deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated two siblings with a severe defect in mitochondrial
      translation, reduced levels of oxidative phosphorylation complexes
      containing mitochondrial DNA (mtDNA)-encoded subunits, and progressive
      hepatoencephalopathy.
    explanation: The founding siblings have a severe mitochondrial translation defect.
  - reference: PMID:34919756
    reference_title: Dysfunctional mitochondrial translation and combined oxidative phosphorylation deficiency in a mouse model of hepatoencephalopathy due to Gfm1 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At 8 weeks of age, their mitochondrial translation rates were
      significantly reduced in both tissues.
    explanation: Compound heterozygous Gfm1 mice have reduced mitochondrial translation in liver and brain.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    description: >-
      Too few mitochondrial DNA-encoded subunits are made to assemble complexes
      I, III, IV and V, while the entirely nuclear-encoded complex II is
      spared.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_translation_deficiency#Combined Respiratory Chain Complex Deficiency"
  description: >-
    Respiratory chain enzyme activities fall together. The defect is
    tissue-specific: it is severe in liver and only slight in muscle and
    fibroblasts.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:26937387
    reference_title: Neonatal mitochondrial hepatoencephalopathy caused by novel GFM1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results confirm the tissue-specific effect of GFM1 mutations, since we
      found only slightly decreased respiratory chain enzyme activities in
      muscle and fibroblasts, but a severe deficiency in the liver.
    explanation: The respiratory chain deficiency is severe in liver and slight in muscle and fibroblasts.
  - reference: PMID:34919756
    reference_title: Dysfunctional mitochondrial translation and combined oxidative phosphorylation deficiency in a mouse model of hepatoencephalopathy due to Gfm1 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gfm1R671C/- mice showed combined oxidative phosphorylation deficiency
      (reduced complex I and IV enzyme activities in liver and brain)
    explanation: The mouse model reproduces the combined deficiency in liver and brain.
  downstream:
  - target: Hepatocellular Energy Failure
    causal_link_type: DIRECT
    description: The severe hepatic respiratory chain defect leaves hepatocytes energy-deficient.
  - target: Neuronal Energy Failure
    causal_link_type: DIRECT
    description: The brain respiratory chain defect leaves neurons energy-deficient.
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: >-
      With oxidative phosphorylation constrained, pyruvate is reduced to

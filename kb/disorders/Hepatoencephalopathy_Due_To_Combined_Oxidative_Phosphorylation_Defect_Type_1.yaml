animal_models:
- name: Gfm1 R671C/- compound heterozygous mouse
  species: Mouse
  genotype: Gfm1 R671C/- (knock-in p.R671C over a knock-out allele)
  description: >-
    Gfm1 knockout mice die as embryos and homozygous R671C knock-in mice grow
    normally; the compound heterozygote carries less EFG1 in liver and brain
    and reproduces the molecular phenotype of the human disease.
  publication: PMID:34919756
  modeled_mechanisms:
  - target: Impaired Mitochondrial Translational Elongation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Reduced mitochondrial translation in liver and brain, with a combined respiratory chain deficiency.
    limitations: >-
      The published characterisation is molecular; the clinical
      hepatoencephalopathy of infants is not described in these mice.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The compound heterozygous mice show reduced translation and complex I and
        IV activity at 8 weeks, but neonatal liver failure and encephalopathy are
        not reported, so the model speaks to the molecular steps rather than to
        the clinical course.
    evidence:
    - reference: PMID:34919756
      reference_title: Dysfunctional mitochondrial translation and combined oxidative phosphorylation deficiency in a mouse model of hepatoencephalopathy due to Gfm1 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We conclude that the compound heterozygous Gfm1R671C/- mouse presents a
        clear dysfunctional molecular phenotype, showing impaired mitochondrial
        translation and combined respiratory chain dysfunction, making it a
        suitable animal model for the study of COXPD1.
      explanation: The mouse reproduces the translation defect and combined respiratory chain dysfunction.
  evidence:
  - reference: PMID:41998139
    reference_title: Systemic delivery of AAV-GFM1 corrects COXPD1 molecular alterations in Gfm1(R671C/-) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Successful transduction of the liver and the brain was observed after four
      weeks, entailing substantial recovery from mitochondrial EFG1 depletion and
      OXPHOS correction in both tissues
    explanation: AAV delivery of human GFM1 corrects the molecular defect in this model, preclinical evidence for gene therapy.

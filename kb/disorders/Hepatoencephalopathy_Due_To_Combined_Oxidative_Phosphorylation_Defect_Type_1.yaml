name: Hepatoencephalopathy Due To Combined Oxidative Phosphorylation Defect Type 1
creation_date: "2026-11-25T23:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Hepatoencephalopathy due to combined oxidative phosphorylation defect type 1
  term:
    id: MONDO:0012191
    label: hepatoencephalopathy due to combined oxidative phosphorylation defect type 1
synonyms:
- COXPD1
- combined oxidative phosphorylation deficiency 1
- GFM1 combined oxidative phosphorylation deficiency
- combined oxidative phosphorylation deficiency caused by mutation in GFM1
description: >-
  Hepatoencephalopathy due to combined oxidative phosphorylation defect type 1
  (COXPD1) is an autosomal recessive mitochondrial translation disorder caused
  by biallelic variants in GFM1, which encodes mitochondrial elongation factor
  G1 (EFG1). EFG1 is the GTPase that moves the mitochondrial ribosome along the
  mRNA after each peptide bond is formed, so loss of its activity slows
  synthesis of all thirteen mitochondrial DNA-encoded respiratory chain
  subunits at once and produces a combined respiratory chain deficiency.

  Onset is usually neonatal, with severe lactic acidosis, a rapidly
  progressive encephalopathy with axial hypotonia, dystonia and infantile
  spasms, and in most reported patients liver failure; microcephaly and
  intrauterine growth retardation are common. Many patients die in infancy,
  although carriers of milder missense alleles such as p.Arg671Cys survive
  beyond the first year with a more stable neurological course. The
  respiratory chain defect is tissue-specific, severe in liver and slight in
  muscle and fibroblasts, so a normal muscle or fibroblast result does not
  exclude the disease.

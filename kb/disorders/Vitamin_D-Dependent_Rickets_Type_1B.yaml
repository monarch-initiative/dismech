name: Vitamin D-Dependent Rickets Type 1B
synonyms:
- VDDR1B
- Vitamin D hydroxylation-deficient rickets, type 1B
- Vitamin D 25-hydroxylase deficiency
- Selective 25-hydroxyvitamin D deficiency
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 1B is caused by variants in CYP2R1, the
  principal hepatic vitamin D 25-hydroxylase. The block sits one step earlier in
  the activation pathway than in type 1A: 25-hydroxyvitamin D, the major
  circulating form, cannot be generated, so both 25-hydroxyvitamin D and
  calcitriol are low. The resulting picture is biochemically indistinguishable
  from nutritional vitamin D deficiency, and the discriminating feature is the
  response to treatment - affected individuals need very high, lifelong vitamin D
  doses and relapse when the dose is reduced. Inheritance is semidominant rather
  than cleanly recessive: heterozygotes have a measurably blunted
  25-hydroxyvitamin D response to administered vitamin D, though they are less
  severely affected than homozygotes.
disease_term:
  preferred_term: vitamin D hydroxylation-deficient rickets, type 1B
  term:
    id: MONDO:0010810
    label: vitamin D hydroxylation-deficient rickets, type 1B
parents:

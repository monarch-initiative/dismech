diagnosis:
- name: Clinical and biochemical evaluation of refractory calciopenic rickets
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Consider VDDR1B when clinical or radiographic rickets and very low
    25-hydroxyvitamin D persist despite an adequate, adhered-to calcium and vitamin
    D regimen, or when severe vitamin D deficiency clusters in a family. Interpret
    calcium, phosphate, age-adjusted alkaline phosphatase, PTH, 25-hydroxyvitamin D,
    calcitriol, and renal phosphate handling together; normal or high calcitriol
    does not exclude VDDR1B.
  results: >-
    Persistent very low 25-hydroxyvitamin D with a calciopenic rachitic profile and
    inadequate response to ordinary replacement supports CYP2R1 testing but is not
    independently specific for VDDR1B.
  evidence:
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If rickets fails to heal and/or if there is a family history of rickets, then
      refractory rickets should be considered as a differential diagnosis.
    explanation: >-
      Establishes adequate-treatment nonhealing and family history as triggers for
      a refractory-rickets evaluation.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subjects with calciopenic rickets will have elevated serum levels of PTH,
      which depress the TRP and cause hypophosphatemia. These subjects have either
      inadequate intake of calcium and/or vitamin D or genetic defects that impair
      vitamin D activation or responses (i.e., VDDR).
    explanation: >-
      Supports combined biochemical interpretation rather than diagnosis from an
      isolated vitamin D metabolite.
- name: CYP2R1 molecular genetic confirmation
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: CYP2R1
        term:
          id: hgnc:20580
          label: CYP2R1
  description: >-
    Molecular analysis of CYP2R1 provides confirmation after the clinical,
    biochemical, exposure, and acquired-cause assessment.
    Biallelic pathogenic variants support classic severe VDDR1B; a single variant
    requires phenotype-aware interpretation because heterozygote penetrance and
    severity are variable.
  results: >-
    Pathogenic CYP2R1 variant(s) consistent with the individual's phenotype and
    inheritance establish the molecular diagnosis.
  evidence:
  - reference: PMID:34137732
    reference_title: "25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Confirmation of the diagnosis should be pursued by performing molecular
      analysis of the CYP2R1 gene in the patients and their families.
    explanation: >-
      Directly recommends CYP2R1 molecular analysis for confirmation in patients
      and relatives.
differential_diagnoses:
- name: Nutritional calcium or vitamin D deficiency rickets
  description: >-
    Nutritional rickets is the commonest mimic and can share very low
    25-hydroxyvitamin D and a calciopenic biochemical profile. Adequate calcium and
    vitamin D with adherence should heal ordinary nutritional disease; persistence
    or recurrent dose dependence warrants refractory-rickets evaluation.
  distinguishing_features:
  - Dietary calcium/vitamin D intake, sunlight exposure, and adherence explain most nutritional cases.
  - Failure to heal despite adequate calcium and vitamin D or a strong family history favors a refractory cause such as VDDR1B.
  evidence:
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      By far the commonest cause of rickets is nutritional rickets, due to dietary
      deficiency in calcium and/or vitamin D intake. Therefore, it would be common
      practice, particularly in resource-deprived settings, to treat cases of
      rickets presenting clinically empirically with oral calcium and vitamin D
      supplementation. However, if despite adequate compliance to these regimes,
      rickets persists, then ‘refractory’ causes of rickets must be considered.
    explanation: >-
      Defines the common nutritional mimic and the response-to-adequate-repletion
      boundary for escalating the differential.
- name: Vitamin D-dependent rickets type 1A
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 1A
    term:
      id: MONDO:0020723
      label: vitamin D-dependent rickets, type 1A
  description: >-
    VDDR1A shares calciopenic rickets but reflects CYP27B1 deficiency at the second
    activation step. Its usual profile is normal or elevated 25-hydroxyvitamin D
    with very low calcitriol, unlike the markedly low 25-hydroxyvitamin D and
    variable calcitriol of VDDR1B.
  distinguishing_features:
  - CYP27B1 rather than CYP2R1 pathogenic variants establish VDDR1A.
  - Normal or elevated 25-hydroxyvitamin D with very low calcitriol favors VDDR1A.
  evidence:
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The typical biochemical findings are of hypocalcemia, hypophosphatemia,
      hyperphosphatasia, secondary hyperparathyroidism, and normal or elevated
      25OHD with extremely low 1,25(OH)2D.
    explanation: >-
      Defines the metabolite profile that separates the downstream CYP27B1 block
      from CYP2R1 deficiency.
- name: Vitamin D-dependent rickets type 2A
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 2A
    term:
      id: MONDO:0010186
      label: vitamin D-dependent rickets, type 2A
  description: >-
    VDDR2A can share severe rickets and hypocalcemia but is caused by VDR
    dysfunction. Elevated calcitriol and partial or complete alopecia favor VDDR2A,
    whereas CYP2R1-related VDDR1B has very low 25-hydroxyvitamin D and no defining
    alopecia phenotype.
  distinguishing_features:
  - Biallelic pathogenic VDR variants establish VDDR2A.
  - Markedly elevated calcitriol and alopecia favor receptor resistance rather than CYP2R1 deficiency.
  evidence:
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical features and presentation of VDDR2a are similar to forms of
      VDDR1, except for the presence of partial or complete alopecia that develops
      within the first year of life.
    explanation: >-
      Identifies the principal clinical discriminator for VDR-mediated disease.
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VDDR2a is due to biallelic mutations in VDR, the gene that encodes for the
      vitamin D receptor (VDR), located on chromosome 12q13.11. This results in
      resistance to 1,25(OH)2D.
    explanation: >-
      Establishes the VDR cause and receptor-resistance mechanism.
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The biochemistry of VDDR2a is similar to VDDR1a, except for elevated
      1,25(OH)2D.
    explanation: >-
      Supports elevated calcitriol as a biochemical discriminator.
- name: Vitamin D-dependent rickets type 3
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 3
    term:
      id: MONDO:0033640
      label: vitamin D-dependent rickets, type 3
  description: >-
    VDDR3 is caused by gain-of-function CYP3A4-mediated acceleration of vitamin D
    metabolite inactivation. Both 25-hydroxyvitamin D and calcitriol can be low,
    and molecular testing distinguishes it from deficient CYP2R1 25-hydroxylation.
  distinguishing_features:
  - A pathogenic gain-of-function CYP3A4 variant supports VDDR3 rather than VDDR1B.
  - Low 25-hydroxyvitamin D together with low calcitriol and rapid loss after dosing favors excessive catabolism.
  evidence:
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This has only been recently described as a form of VDDR due to gain-of-function
      mutations in CYP3A4 (located on chromosome 7q22.1), encoding a cytochrome P450
      enzyme, resulting in increased inactivation of vitamin D metabolites.
    explanation: >-
      Establishes the accelerated-catabolism mechanism that distinguishes VDDR3.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both affected individuals had detectable serum concentrations of vitamin D3
      but low serum concentrations of 25(OH)D and 1,25(OH)2D that increased after
      administration of very large doses of vitamin D or calcitriol and which
      decreased rapidly thereafter.
    explanation: >-
      Supports the paired low-metabolite and rapid-loss pattern that distinguishes
      excessive catabolism from the VDDR1B pattern.
- name: Phosphopenic rickets from renal phosphate wasting
  description: >-
    FGF23-mediated disorders and proximal renal tubulopathies can cause rickets
    through primary phosphate loss. Age-adjusted phosphate, PTH, calcium,
    25-hydroxyvitamin D, and tubular phosphate reabsorption separate this branch
    from calciopenic VDDR1B.
  distinguishing_features:
  - Normal PTH and calcium with low phosphate favors primary phosphopenic rickets.
  - Reduced tubular phosphate reabsorption identifies genetic or acquired renal phosphate wasting.
  evidence:
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subjects who have hypophosphatemia and normal serum levels of PTH, calcium,
      and 25(OH)D are likely to have phosphopenic rickets; a normal or elevated
      tubular reabsorption of phosphorus (TRP) will be found in subjects with
      inadequate intake or absorption of phosphorus. By contrast, patients with
      XLH and other genetic or acquired causes of renal phosphate wasting will have
      reduced TRP values.
    explanation: >-
      Provides the biochemical and renal-handling distinction from calciopenic
      vitamin D-dependent rickets.
- name: Acquired malabsorption, liver disease, or medication-related rickets and osteomalacia
  description: >-
    Celiac or other malabsorption, liver disease, renal comorbidity, and medications
    affecting vitamin D metabolism or renal phosphate handling can produce acquired
    low-vitamin-D or mineral disease. History and directed testing should exclude
    these causes before attributing nonresponse to inherited CYP2R1 deficiency.
  distinguishing_features:
  - Gastrointestinal, hepatic, or renal disease provides an acquired explanation for the biochemical pattern.
  - Antiepileptic or other enzyme-inducing medication exposure favors drug-associated osteomalacia.
  evidence:
  - reference: PMID:34137732
    reference_title: "25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We excluded patients who had nutritional, malabsorption, or comorbidity
      factors (i.e. celiac disease, liver disease, or renal failure), and patients
      who were on anti-epileptic medications.
    explanation: >-
      Shows the acquired and exposure-related causes excluded in the molecular
      CYP2R1 cohort.
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CYP3A4 has also been shown in in vitro studies to be the enzyme induced by
      P450-inducing drugs (such as rifampicin, carbamazepine and phenobarbital) to
      result in drug-induced osteomalacia.
    explanation: >-
      Directly identifies common enzyme-inducing medications as an acquired
      vitamin D catabolism differential.
treatments:
- name: Calcifediol Replacement
  description: >-
    Calcifediol (25-hydroxyvitamin D3) supplies the product of the blocked
    reaction directly. It is the most specific biochemical bypass when available.
    A seven-patient study reported clinical, biochemical and densitometric
    improvement, while long-term comparative data remain limited.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcidiol
      term:
        id: CHEBI:17933
        label: calcidiol
  evidence:
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time, and according to the concept of personalized medicine,
      we demonstrate dramatic improvements in patients who were given 25-OH-D
      therapy (clinical symptoms, biochemical data, and bone densitometry).
    explanation: >-
      Reports improvement after direct replacement with the missing
      25-hydroxylated metabolite.
  target_mechanisms:
  - target: Hepatic 25-Hydroxylase Deficiency
    treatment_effect: BYPASSES
    description: >-
      Supplying 25-hydroxyvitamin D downstream of CYP2R1 bypasses the deficient
      hepatic reaction rather than attempting to restore the mutant enzyme.
    evidence:
    - reference: PMID:28548312
      reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        For the first time, and according to the concept of personalized medicine,
        we demonstrate dramatic improvements in patients who were given 25-OH-D
        therapy (clinical symptoms, biochemical data, and bone densitometry).
      explanation: >-
        Direct product replacement provides clinical evidence for bypassing the
        25-hydroxylase defect.
- name: High-Dose Parent Vitamin D with Calcium Supplementation
  description: >-
    Pharmacological cholecalciferol or ergocalciferol can produce clinical and
    biochemical responses. Increased flux through partially active CYP2R1 and/or
    alternative 25-hydroxylases is a plausible interpretation of that response,
    not a directly measured patient mechanism. Response and maintenance dose vary
    by genotype and age: a Saudi cohort commonly relapsed when doses were reduced,
    whereas other adults maintained mineral homeostasis without ongoing
    supplementation. Calcium is co-administered or optimized according to mineral
    status; monitoring guides the dose and guards against overtreatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholecalciferol
      term:
        id: CHEBI:28940
        label: calciol
    - preferred_term: ergocalciferol
      term:
        id: CHEBI:28934
        label: vitamin D2
    - preferred_term: calcium(2+)
      term:
        id: CHEBI:29108
        label: calcium(2+)
  evidence:
  - reference: PMID:38440125
    reference_title: Novel Mutation in CYP2R1 Causing Vitamin D-Dependent Rickets Type 1b.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The children were treated with oral calcium and cholecalciferol, dose
      titrated to maintain serum alkaline phosphatase, 25 hydroxy vitamin D, and
      parathyroid hormone levels in the normal range, with good clinical and
      radiological response.
    explanation: >-
      Documents monitored cholecalciferol-plus-calcium therapy with clinical and
      radiological improvement in affected siblings.
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, adult patients were able to maintain normal mineral
      metabolism without vitamin D supplementation.
    explanation: >-
      Qualifies the Saudi cohort's lifelong-maintenance observation by documenting
      age-related improvement without supplementation in another family series.
  - reference: PMID:34137732
    reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We noticed a symptomatic and biochemical improvement in all heterozygous
      patients after treatment with supra-therapeutic doses of vitamin D (i.e.
      50,000–100,000 IU of vitamin D2 weekly) for 8–12 weeks, regardless of their
      mutation, and none of them required calcitriol (1,25-[OH]2 vitamin D),
      whereas the homozygous group required more frequent therapy in the form of
      weekly to twice monthly maintenance high-dose vitamin D therapy, and some of
      them needed calcitriol for a lifetime.
    explanation: >-
      Documents ergocalciferol response and genotype-dependent maintenance needs
      in the Saudi cohort.
  target_mechanisms:
  - target: Reduced 25-Hydroxyvitamin D Availability and Calciopenic Signaling
    treatment_effect: RESTORES
    description: >-
      High-dose parent vitamin D produced clinical and biochemical responses in
      most of this cohort, while calcium supplementation supports mineral supply.
      Increased flux through residual CYP2R1 and/or alternative 25-hydroxylases is
      a plausible explanation, not a pathway measurement in these patients.
    evidence:
    - reference: PMID:34137732
      reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirteen out of 18 homozygous patients and all the heterozygous patients
        responded to high doses of vitamin D treatment, but they regressed after
        decreasing the dose, requiring lifelong therapy.
      explanation: >-
        Supports the observed restoration by high-dose parent vitamin D while
        showing that maintenance requirements were cohort- and genotype-dependent;
        it does not identify which hydroxylase carried the increased flux.
- name: Calcitriol for Selected Parent-Vitamin-D Nonresponders
  description: >-
    Calcitriol is not routine replacement for an obligatorily low calcitriol
    concentration: the biomarker is variable in VDDR1B, and normal or high values
    do not exclude the disorder. It can bypass both activation steps in selected
    patients whose biochemical abnormalities do not improve with high-dose parent
    vitamin D. The Saudi cohort used closer follow-up and annual renal
    ultrasonography to watch for calcification or nephrolithiasis during treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
  evidence:
  - reference: PMID:34137732
    reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five out of 18 homozygous patients required calcitriol to improve their
      biochemical data, whereas none of the heterozygous patients and patients who
      carried the c.367+1G>A mutation required calcitriol treatment.
    explanation: >-
      Restricts calcitriol to the documented nonresponding subgroup rather than
      presenting it as universal therapy.
  - reference: PMID:34137732
    reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients required closer follow-up and renal ultrasonography every
      year to check for signs of calcifications or nephrolithiasis, which was
      negative in all patients receiving calcitriol.
    explanation: >-
      Supports renal surveillance during calcitriol therapy while noting that no
      calcification was observed in this cohort.
  target_mechanisms:
  - target: Reduced 25-Hydroxyvitamin D Availability and Calciopenic Signaling
    treatment_effect: BYPASSES
    description: >-
      Active hormone replacement bypasses both hepatic 25-hydroxylation and renal
      1-alpha-hydroxylation to restore downstream receptor signaling.
    evidence:
    - reference: PMID:34137732
      reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Five out of 18 homozygous patients required calcitriol to improve their
        biochemical data, whereas none of the heterozygous patients and patients who
        carried the c.367+1G>A mutation required calcitriol treatment.
      explanation: >-
        Improvement in parent-vitamin-D nonresponders supports use of calcitriol as
        a downstream bypass in selected patients.
animal_models:
- name: Cyp2r1-null mouse
  species: Mouse
  genotype: Homozygous Cyp2r1 knockout
  publication: PMID:24019477
  description: >-
    A whole-animal test of CYP2R1's contribution to vitamin D activation. The
    knockout lowers serum 25-hydroxyvitamin D3 by more than half but leaves
    calcitriol unchanged, demonstrating both CYP2R1's major role and substantial
    CYP2R1-independent 25-hydroxylation. The abstract reports no overt health
    issues, but it does not establish whether skeletal endpoints were assessed.
  evidence:
  - reference: PMID:24019477
    reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have now produced Cyp2r1 (-/-) mice.
    explanation: >-
      Establishes the whole-animal knockout used to test CYP2R1 function.
  modeled_mechanisms:
  - target: Hepatic 25-Hydroxylase Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recapitulates reduced circulating 25-hydroxyvitamin D while showing that the
      pathway is not abolished and that calcitriol can remain regulated.
    limitations: >-
      The null mouse retains a substantial residual fraction of circulating
      25-hydroxyvitamin D3 and has no reported overt illness, whereas humans with
      severe biallelic CYP2R1 variants can develop rickets. Diet, species-specific
      alternative hydroxylases and unreported skeletal phenotyping in the abstract
      leave skeletal fidelity unassessed.
    readouts:
    - name: Serum 25-hydroxyvitamin D3 concentration
      target: Hepatic 25-Hydroxylase Deficiency
      direction: DECREASED
      interpretation: >-
        A greater-than-50% reduction demonstrates that CYP2R1 is a major, but not
        exclusive, source of circulating 25-hydroxyvitamin D3 in mice.
      evidence:
      - reference: PMID:24019477
        reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          These mice had greater than 50% reduction in serum 25-hydroxyvitamin D3.
        explanation: >-
          Reports the direction and magnitude of the metabolite readout.
    - name: Serum 1-alpha,25-dihydroxyvitamin D3 concentration
      target: Hepatic 25-Hydroxylase Deficiency
      direction: UNCHANGED
      interpretation: >-
        Preserved active hormone despite loss of Cyp2r1 argues against treating
        calcitriol deficiency as an obligatory consequence of this lesion.
      evidence:
      - reference: PMID:24019477
        reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Curiously, the 1α,25-dihydroxyvitamin D3 level in the serum remained
          unchanged.
        explanation: >-
          Directly reports the unchanged active-hormone readout.
    evidence:
    - reference: PMID:24019477
      reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results support the idea that the CYP2R1 is the major enzyme
        responsible for 25-hydroxylation of vitamin D, but clearly a second,
        as-yet unknown, enzyme is another contributor to this important step in
        vitamin D activation.
      explanation: >-
        Supports partial rather than complete recapitulation of the human
        25-hydroxylase lesion.
discussions:
- discussion_id: cyp2r1_mouse_human_severity_mismatch
  prompt: >-
    Do Cyp2r1-null mice develop a skeletal mineralization defect under the studied
    conditions, or were the relevant skeletal endpoints simply not assessed?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic 25-Hydroxylase Deficiency
  - pathophysiology#Defective Skeletal Mineralization
  rationale: >-
    The mouse establishes that CYP2R1 is a major 25-hydroxylase, but its residual
    metabolite production and preserved calcitriol coexist with a report of no
    overt health issues. That abstract-level statement is not a skeletal
    assessment and cannot support a negative mineralization result. Humans can
    develop a mineralization defect despite retaining normal or high calcitriol;
    whether mice differ because of stronger alternative 25-hydroxylation, dietary
    rescue, developmental timing, or merely unmeasured skeletal endpoints remains
    open.
  proposed_experiments:
  - experiment_id: exp_cyp2r1_cross_species_hydroxylase_flux
    name: Cross-species mapping of residual vitamin D 25-hydroxylation
    description: >-
      Compare isotope-traced vitamin D-to-25-hydroxyvitamin D flux and expression
      of candidate alternative hydroxylases in Cyp2r1-null mouse hepatocytes and
      CYP2R1-deficient patient-derived hepatocyte models under matched substrate
      concentrations.
    decision_criterion: >-
      Greater residual flux in mouse cells, reversible by perturbing a candidate
      alternative hydroxylase, would support species-specific enzymatic
      compensation; similar flux would shift attention to diet and mineral
      homeostasis.
    evidence:
    - reference: PMID:24019477
      reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results support the idea that the CYP2R1 is the major enzyme
        responsible for 25-hydroxylation of vitamin D, but clearly a second,
        as-yet unknown, enzyme is another contributor to this important step in
        vitamin D activation.
      explanation: >-
        Grounds the proposed cross-species flux experiment in the demonstrated
        residual, unidentified hydroxylase activity.
  - experiment_id: exp_cyp2r1_mouse_skeletal_stress_test
    name: Longitudinal skeletal phenotyping under controlled vitamin D and calcium intake
    description: >-
      Phenotype Cyp2r1-null and wild-type mice across growth using matched,
      controlled vitamin D and calcium diets, serial mineral biochemistry,
      radiography and growth-plate histomorphometry.
    decision_criterion: >-
      Emergence of rickets only under restricted substrate or mineral intake would
      identify dietary rescue in the original model; persistently normal skeletons
      despite low 25-hydroxyvitamin D would support species-specific compensation.
    evidence:
    - reference: PMID:24019477
      reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These mice presented no health issues.
      explanation: >-
        Grounds the need for sensitive skeletal phenotyping beyond the reported
        absence of overt illness.
    - reference: PMID:28548312
      reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Siblings exhibited the three stages of rickets based on biochemical and
        radiographic findings.
      explanation: >-
        Supplies the human skeletal endpoint that the proposed mouse experiment
        must test under controlled conditions.
  evidence:
  - reference: PMID:24019477
    reference_title: CYP2R1 is a major, but not exclusive, contributor to 25-hydroxyvitamin D production in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These mice had greater than 50% reduction in serum 25-hydroxyvitamin D3.
      Curiously, the 1α,25-dihydroxyvitamin D3 level in the serum remained
      unchanged. These mice presented no health issues.
    explanation: >-
      Defines the murine biochemical phenotype and the abstract's broad report of
      no health issues; it does not establish a negative skeletal endpoint.
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Siblings exhibited the three stages of rickets based on biochemical and
      radiographic findings.
    explanation: >-
      Provides the contrasting human skeletal phenotype that makes translation
      from the knockout uncertain.
biochemical:
- name: 25-hydroxyvitamin D (calcifediol)
  presence: Decreased
  biomarker_term:
    preferred_term: 25-Hydroxyvitamin D Measurement
    term:
      id: NCIT:C92268
      label: 25-Hydroxyvitamin D Measurement
  context: >-
    Low, because the hepatic 25-hydroxylation that produces it is the blocked
    step. This is the measurement type 1B shares with nutritional deficiency and
    the one that separates it from type 1A, where 25-hydroxyvitamin D is normal
    or high because the substrate accumulates behind a later block.
  evidence:
  - reference: PMID:34137732
    reference_title: "25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed 27 patients from nine different families who presented with
      low 25-OH vitamin D and not responding to usual treatment.
    explanation: >-
      Low 25-hydroxyvitamin D together with non-response to usual treatment is
      the presenting biochemical signature of the cohort.
- name: 1,25-dihydroxyvitamin D (calcitriol)
  presence: Variable
  biomarker_term:
    preferred_term: 1,25-Dihydroxyvitamin D3 Measurement
    term:
      id: NCIT:C179754
      label: 1,25-Dihydroxyvitamin D3 Measurement
  context: >-
    Published guidance classifies calcitriol as variable, so lower values can
    occur. Normal calcitriol was reported in the index case and untreated adults,
    and another series describes normal or high concentrations despite very low
    25-hydroxyvitamin D. Residual 25-hydroxylation and renal regulation may
    preserve active hormone despite the upstream block. Normal or elevated
    calcitriol therefore does not exclude this disorder, and measuring it alone
    would be misleading.
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Before treatment, he had low normal serum calcium levels (2.00–2.32 mM;
      normal range 2.12–2.62 mM), low serum phosphate levels (0.84–0.87 mM;
      normal range 0.97–1.45 mM), elevated serum alkaline phosphatase levels
      (2,360–3,000 units/liter; normal range 100–320 units/liter), serum
      1α,25-dihydroxyvitamin D levels (137–142 pM) that were in the normal range
      (48–182 pM), and low 25-hydroxyvitamin D levels (10–12 nM; normal 25–137 nM).
    explanation: >-
      Reports calcitriol within the stated normal range alongside low
      25-hydroxyvitamin D in the index case.
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discuss the difficulties in establishing the correct diagnosis and the
      specific biochemical pattern, namely, very low 25-OH-D suggestive of
      classical vitamin D deficiency, in the face of normal/high concentrations
      of 1,25-(OH)2 D.
    explanation: >-
      Directly supports the normal-or-high range and corrects the prior assertion
      that calcitriol is necessarily deficient.
  - reference: PMID:32430692
    reference_title: Prolonged 25-OH Vitamin D Deficiency Does Not Impair Bone Mineral Density in Adult Patients With Vitamin D 25-Hydroxylase Deficiency (CYP2R1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These three patients had undetectable 25-OH vitamin D, but normal levels of
      plasma 1-25(OH)2 vitamin D.
    explanation: >-
      Extends the normal-calcitriol observation to three untreated adults with
      undetectable 25-hydroxyvitamin D.
  - reference: PMID:37074534

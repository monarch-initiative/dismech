name: Vitamin D-Dependent Rickets Type 1B
synonyms:
- VDDR1B
- Vitamin D hydroxylation-deficient rickets, type 1B
- Vitamin D 25-hydroxylase deficiency
- Selective 25-hydroxyvitamin D deficiency
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 1B is caused by variants in CYP2R1, the
  principal hepatic vitamin D 25-hydroxylase. The block sits one step earlier in
  the activation pathway than in type 1A: reduced hepatic 25-hydroxylation causes
  very low 25-hydroxyvitamin D. Calcitriol is variable: normal or high values are
  well documented and do not exclude the diagnosis, but low values can also
  occur. The presentation can therefore mimic
  nutritional vitamin D deficiency, but persistence despite ordinary replacement,
  relapse when pharmacological parent-vitamin-D doses are reduced, and molecular
  testing can reveal the inherited defect. Severe classic disease is usually
  associated with biallelic variants. Some cohorts show intermediate biochemical
  or clinical effects in heterozygotes, whereas other families have clinically
  normal heterozygous parents; semidominant behavior is reported but is not
  uniform. Treatment is individualized: calcifediol bypasses the blocked step,
  high-dose parent vitamin D has produced responses compatible with residual or
  alternative hydroxylation, and selected nonresponders receive calcitriol.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous and compound heterozygous CYP2R1 genotypes produce the full
    disorder. The mode is better described as semidominant, because heterozygous
    carriers show an intermediate, measurable defect in 25-hydroxylation rather
    than being unaffected.
  evidence:
  - reference: PMID:25942481
    reference_title: CYP2R1 Mutations Impair Generation of 25-hydroxyvitamin D and Cause an Atypical Form of Vitamin D Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CYP2R1 mutations cause a novel form of genetic vitamin D deficiency with
      semidominant inheritance.
    explanation: >-
      States the semidominant mode directly, qualifying the simple recessive
      label carried in the ontologies.
genetic:
- name: CYP2R1 loss-of-function variants
  gene_term:
    preferred_term: CYP2R1
    term:
      id: hgnc:20580
      label: CYP2R1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported alleles include the original p.Leu99Pro missense variant, p.Lys242Asn,
    and the splice and duplication variants c.367+1G>A and c.768dupT that recur in
    Saudi families.
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This individual was found to be homozygous for a transition mutation in
      exon 2 of the CYP2R1 gene on chromosome 11p15.2.
    explanation: >-
      The index case establishing CYP2R1 as the disease gene.
  - reference: PMID:34137732
    reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing identified two mutations: c.367+1G>A (12/27 patients) and
      c.768dupT (15/27 patients), where 18 patients were homozygous for their
      identified mutation and 9 patients were heterozygous.
    explanation: >-
      Documents recurrent CYP2R1 alleles across the largest reported cohort.
pathophysiology:
- name: Hepatic 25-Hydroxylase Deficiency
  description: >-
    CYP2R1 is the principal microsomal enzyme that hydroxylates carbon 25 of
    vitamin D in the liver, the first of the two activation steps. Loss-of-function
    variants eliminate this activity, so ingested or cutaneously synthesized
    vitamin D cannot be converted to 25-hydroxyvitamin D. Unlike type 1A, where
    the substrate accumulates, here the pathway is starved from the top and both
    metabolites are low.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Vitamin D 25-Hydroxylase Activity
    term:
      id: GO:0030343
      label: vitamin D 25-hydroxylase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The inherited mutation caused the substitution of a proline for an
      evolutionarily conserved leucine at amino acid 99 in the CYP2R1 protein and
      eliminated vitamin D 25-hydroxylase enzyme activity.
    explanation: >-
      Shows the disease allele abolishing the enzymatic activity that defines
      this node.
  - reference: PMID:25942481
    reference_title: CYP2R1 Mutations Impair Generation of 25-hydroxyvitamin D and Cause an Atypical Form of Vitamin D Deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in vitro studies showed that K242N and L99P had markedly reduced or complete
      loss of 25-hydroxylase activity, respectively
    explanation: >-
      Confirms loss of 25-hydroxylase activity for a second independent allele.
  downstream:
  - target: Combined 25-Hydroxyvitamin D and Calcitriol Deficiency
    causal_link_type: DIRECT
    description: >-
      Blocking the first activation step depletes both the circulating
      intermediate and the active hormone.
- name: Combined 25-Hydroxyvitamin D and Calcitriol Deficiency
  description: >-
    With no 25-hydroxyvitamin D substrate, the intact renal 1-alpha-hydroxylase
    has nothing to act on, and calcitriol falls as well. Vitamin D receptor
    signalling in the intestine declines, active calcium absorption falls, and the
    calciopenic cascade of hypocalcemia, secondary hyperparathyroidism and
    phosphaturia follows. This is the disorder-specific instance of the module's
    calciopenic trigger arm, with the interruption placed at 25-hydroxylation.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"

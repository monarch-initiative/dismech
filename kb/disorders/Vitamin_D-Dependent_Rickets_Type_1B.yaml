inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous and compound heterozygous CYP2R1 genotypes produce the classic,
    severe disorder. A Nigerian study found a dosage-dependent biochemical effect
    and described semidominant inheritance, and a Saudi cohort reported symptomatic
    heterozygotes. This is not universal: other pedigrees have clinically normal
    heterozygous parents, and phenotype severity can vary independently of gene
    dosage. Autosomal recessive inheritance therefore remains the primary label,
    with reported semidominant behavior and variable heterozygote penetrance.
  evidence:
  - reference: PMID:25942481
    reference_title: CYP2R1 Mutations Impair Generation of 25-hydroxyvitamin D and Cause an Atypical Form of Vitamin D Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CYP2R1 mutations cause a novel form of genetic vitamin D deficiency with
      semidominant inheritance.
    explanation: >-
      Demonstrates a dosage-dependent biochemical effect and describes
      semidominant inheritance in the studied Nigerian families.
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous mutations were present in their normal parents.
    explanation: >-
      Shows that heterozygosity was clinically silent in two other families,
      limiting generalization of semidominant inheritance.
  - reference: PMID:33715104
    reference_title: Two novel CYP2R1 mutations in a family with vitamin D-dependent rickets type 1b.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings of both the current and the previous studies suggest that
      VDDR1b is a more complex disorder than the known autosomal recessive
      inheritance model and the phenotype may show an extensive variation
      regardless of the mutation type and the gene dosage.
    explanation: >-
      Supports recording variable expression without treating either a simple
      recessive or a uniformly semidominant model as complete.

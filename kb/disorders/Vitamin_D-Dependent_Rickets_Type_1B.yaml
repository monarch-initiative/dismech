- name: Reduced 25-Hydroxyvitamin D Availability and Calciopenic Signaling
  description: >-
    Very low 25-hydroxyvitamin D limits substrate availability for renal
    1-alpha-hydroxylation. General vitamin-D-dependent-rickets physiology predicts
    that effective intestinal calcium and phosphate absorption can then become
    inadequate relative to mineral demand, but absorption has not been measured
    directly in the cited VDDR1B cohorts. Renal regulation and residual
    25-hydroxylation can preserve or increase circulating calcitriol, while other
    reports support lower values; calcitriol is therefore variable rather than a
    defining deficiency. When effective vitamin D and calcium supply is inadequate,
    the calciopenic cascade of hypocalcemia, secondary hyperparathyroidism and
    phosphaturia follows. This is an evidence-calibrated mechanistic inference that
    places the disorder in the module's calciopenic trigger arm.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"
  biological_processes:
  - preferred_term: Vitamin D Metabolic Process
    term:
      id: GO:0042359
      label: vitamin D metabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With regard to human inborn errors, selective 25-hydroxyvitamin D3deficiency
      is a rare autosomal recessive disorder characterized by impaired synthesis
      of an intermediate in the vitamin D biosynthetic pathway that results in
      endocrine defects in vitamin D signaling.
    explanation: >-
      Directly links deficient intermediate synthesis to endocrine vitamin D
      signaling defects.
  - reference: PMID:28548312
    reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discuss the difficulties in establishing the correct diagnosis and the
      specific biochemical pattern, namely, very low 25-OH-D suggestive of
      classical vitamin D deficiency, in the face of normal/high concentrations
      of 1,25-(OH)2 D.
    explanation: >-
      Establishes that loss of the circulating intermediate does not imply low
      calcitriol and directly supports the corrected metabolic state.
  - reference: PMID:37074534
    reference_title: Refractory Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VDDR refers to a group of conditions characterised by abnormalities in the
      pathway of vitamin D metabolism resulting in the reduced action of vitamin D
      (primarily intestinal calcium and phosphate absorption), which causes
      hypocalcemia, rickets and secondary hyperparathyroidism.
    explanation: >-
      Supports the group-level calciopenic mechanism while leaving intestinal
      absorption in VDDR1B itself explicitly unmeasured and inferential.

treatments:
- name: High-Dose Vitamin D Supplementation
  description: >-
    Pharmacological rather than physiological doses of PARENT vitamin D
    (cholecalciferol or ergocalciferol) can drive residual or alternative
    25-hydroxylase activity sufficiently to raise 25-hydroxyvitamin D. Responding
    to parent vitamin D at high dose is the clinical signature that separates
    type 1B from type 1A, where the activation step is gone and calcitriol is
    required, and from types 2A and 2B, which respond to no dose of any form.
    Treatment is lifelong and patients relapse when the dose is reduced; a subset
    of homozygotes requires calcitriol in addition.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholecalciferol
      term:
        id: CHEBI:28940
        label: calciol
    - preferred_term: ergocalciferol
      term:
        id: CHEBI:28934
        label: vitamin D2
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
  target_mechanisms:
  - target: Combined 25-Hydroxyvitamin D and Calcitriol Deficiency
    treatment_effect: RESTORES
    description: >-
      Raising substrate flux, or supplying the active hormone directly, restores
      vitamin D receptor signalling despite the enzymatic defect.
    evidence:
    - reference: PMID:34137732
      reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirteen out of 18 homozygous patients and all the heterozygous patients
        responded to high doses of vitamin D treatment, but they regressed after
        decreasing the dose, requiring lifelong therapy.
      explanation: >-
        Documents both the response to high-dose vitamin D and the relapse on dose
        reduction that characterize this disorder's treatment.
biochemical:
- name: 25-hydroxyvitamin D (calcifediol)
  presence: Decreased
  biomarker_term:
    preferred_term: 25-Hydroxyvitamin D Measurement
    term:
      id: NCIT:C92268
      label: 25-Hydroxyvitamin D Measurement
  context: >-
    Low, because the hepatic 25-hydroxylation that produces it is the blocked
    step. This is the measurement type 1B shares with nutritional deficiency and
    the one that separates it from type 1A, where 25-hydroxyvitamin D is normal
    or high because the substrate accumulates behind a later block.
  evidence:
  - reference: PMID:34137732
    reference_title: "25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed 27 patients from nine different families who presented with
      low 25-OH vitamin D and not responding to usual treatment.
    explanation: >-
      Low 25-hydroxyvitamin D together with non-response to usual treatment is
      the presenting biochemical signature of the cohort.
- name: 1,25-dihydroxyvitamin D (calcitriol)
  presence: Normal
  biomarker_term:
    preferred_term: 1,25-Dihydroxyvitamin D3 Measurement
    term:
      id: NCIT:C179754
      label: 1,25-Dihydroxyvitamin D3 Measurement
  context: >-
    Reported within the normal range in the index case despite florid rickets,
    because the intact renal 1-alpha-hydroxylase converts what little substrate
    reaches it. A normal calcitriol therefore does not exclude this disorder, and
    measuring it alone would be misleading - 25-hydroxyvitamin D is the analyte
    to look at.
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Before treatment, he had low normal serum calcium levels (2.00–2.32 mM;
      normal range 2.12–2.62 mM), low serum phosphate levels (0.84–0.87 mM;
      normal range 0.97–1.45 mM), elevated serum alkaline phosphatase levels
      (2,360–3,000 units/liter; normal range 100–320 units/liter), serum
      1α,25-dihydroxyvitamin D levels (137–142 pM) that were in the normal range
      (48–182 pM), and low 25-hydroxyvitamin D levels (10–12 nM; normal 25–137 nM).
    explanation: >-
      Reports calcitriol within the stated normal range alongside low
      25-hydroxyvitamin D in the index case.
notes: >-
  Nomenclature caution: MONDO carries "vitamin D hydroxylation-deficient rickets"
  as an EXACT synonym of the rickets umbrella MONDO:0005520 as well as being the
  label stem of this term, MONDO:0010810. Curators resolving that string must
  disambiguate before binding it.

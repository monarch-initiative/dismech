    Saudi families.
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This individual was found to be homozygous for a transition mutation in
      exon 2 of the CYP2R1 gene on chromosome 11p15.2.
    explanation: >-
      The index case establishing CYP2R1 as the disease gene.
  - reference: PMID:34137732
    reference_title: '25-Hydroxylase vitamin D deficiency in 27 Saudi Arabian subjects: a clinical and molecular report on CYP2R1 mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing identified two mutations: c.367+1G>A (12/27 patients) and
      c.768dupT (15/27 patients), where 18 patients were homozygous for their
      identified mutation and 9 patients were heterozygous.
    explanation: >-
      Documents recurrent CYP2R1 alleles across the largest reported cohort.
pathophysiology:
- name: Hepatic 25-Hydroxylase Deficiency
  description: >-
    CYP2R1 is the principal microsomal enzyme that hydroxylates carbon 25 of
    vitamin D in the liver, the first of the two activation steps. Disease variants
    reduce or abolish CYP2R1-dependent activity, so ingested or cutaneously
    synthesized vitamin D is converted inefficiently to 25-hydroxyvitamin D.
    Partially active alleles retain some conversion in vitro, while alternative
    25-hydroxylases are a proposed additional source; consequently
    25-hydroxyvitamin D is markedly reduced but calcitriol need not be.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CYP2R1
    term:
      id: hgnc:20580
      label: CYP2R1
  molecular_functions:
  - preferred_term: Vitamin D 25-Hydroxylase Activity
    term:
      id: GO:0030343
      label: vitamin D 25-hydroxylase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:15128933
    reference_title: Genetic evidence that the human CYP2R1 enzyme is a key vitamin D 25-hydroxylase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The inherited mutation caused the substitution of a proline for an
      evolutionarily conserved leucine at amino acid 99 in the CYP2R1 protein and
      eliminated vitamin D 25-hydroxylase enzyme activity.
    explanation: >-
      Shows the disease allele abolishing the enzymatic activity that defines
      this node.
  - reference: PMID:25942481
    reference_title: CYP2R1 Mutations Impair Generation of 25-hydroxyvitamin D and Cause an Atypical Form of Vitamin D Deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in vitro studies showed that K242N and L99P had markedly reduced or complete
      loss of 25-hydroxylase activity, respectively
    explanation: >-
      Confirms loss of 25-hydroxylase activity for a second independent allele.
  downstream:
  - target: Reduced 25-Hydroxyvitamin D Availability and Calciopenic Signaling
    causal_link_type: DIRECT
    description: >-
      Reduced 25-hydroxylation depletes the circulating intermediate and limits
      vitamin-D-dependent calcium homeostasis even though calcitriol is variable
      and can remain normal or high.
    evidence:
    - reference: PMID:28548312
      reference_title: "Vitamin D-Dependent Rickets Type 1B (25-Hydroxylase Deficiency): A Rare Condition or a Misdiagnosed Condition?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We discuss the difficulties in establishing the correct diagnosis and the
        specific biochemical pattern, namely, very low 25-OH-D suggestive of
        classical vitamin D deficiency, in the face of normal/high concentrations
        of 1,25-(OH)2 D.
      explanation: >-
        Links the CYP2R1 disorder to depleted 25-hydroxyvitamin D while preserving
        the explicitly non-obligatory calcitriol response.
  - target: Low circulating 25-hydroxyvitamin D
    causal_link_type: DIRECT
    description: >-

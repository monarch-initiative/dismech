genetic:
- name: SCAF4
  gene_term:
    preferred_term: SCAF4
    term:
      id: hgnc:19304
      label: SCAF4
  association: Heterozygous loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Variants are de novo in most tested families and inherited in others; one
    individual carried a truncating variant as a mosaic in 8% of blood cells.
    Missense variants (mostly in the CTD-interacting domain) remain of
    uncertain significance. Variants in the last exon that escape NMD are of
    unclear significance.
  evidence:
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing and international matchmaking, we identified nine likely pathogenic germline variants in SCAF4 including two splice-site and seven truncating variants, all residing in the N-terminal two thirds of the protein. Eight of these variants occurred de novo, and one was inherited."
    explanation: Founding gene-disease report.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular spectrum comprises 25 truncating, eight splice-site and five missense variants."
    explanation: Variant spectrum in the 50-individual replication cohort.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In individual 15, the variant was detected as mosaic in 8% of the peripheral blood cells."
    explanation: Low-level mosaic carrier with a milder but similar presentation.
  variants:
  - name: c.1301C>A (p.Ser434*)
    type: nonsense
    clinical_significance: LIKELY_PATHOGENIC
    description: >-
      Founding-cohort allele for which nonsense-mediated decay was shown by
      RT-PCR on patient blood RNA. The carrier also had an NSD1 variant
      (Sotos syndrome) and was excluded from phenotype delineation.
    evidence:
    - reference: PMID:32730804
      reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nonsense-mediated mRNA decay was indicated by reverse transcription PCR (RT-PCR) on cDNA/RNA from a PaxGene (PreAnalytiX, BD and QIAGEN) blood sample of I4 with the c.1301C>A (p.Ser434∗) variant (Figure S1A)."
      explanation: NMD of a truncating SCAF4 allele in patient cells.
  - name: c.1812G>A (p.Trp604*)
    type: nonsense
    clinical_significance: LIKELY_PATHOGENIC
    description: Inherited from a healthy mother in the founding cohort.
    evidence:
    - reference: PMID:32730804
      reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eight occurred de novo, and one nonsense variant c.1812G>A (p.Trp604∗) was inherited from a healthy mother."
      explanation: Inherited truncating allele from an unaffected parent.
  - name: c.374_375dup (p.Glu126LeufsTer20)
    type: frameshift
    clinical_significance: PATHOGENIC
    description: De novo in a 16-year-old Brazilian male with ID, epilepsy and heart malformations.
    evidence:
    - reference: PMID:36333968
      reference_title: "SCAF4-related syndromic intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "presenting with ID, epilepsy, behavioral problems, speech impairment, facial dysmorphisms, heart malformations, and obesity. A de novo pathogenic variant ... SCAF4(NM_020706.2):c.374_375dup(p.Glu126LeufsTer20)] was identified."
      explanation: Single-case report of a de novo frameshift allele.
  - name: c.1693C>T (p.Arg565*)
    type: nonsense
    description: Paternally inherited in a Chinese boy with ID, language disorder and behavioural abnormalities.
    evidence:
    - reference: PMID:40290495
      reference_title: "A novel nonsense mutation in SCAF4 associated with fliedner-zweier syndrome: a case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing (WES) identified a heterozygous nonsense mutation, c.1693C>T (p.Arg565*), located in exon 14 of the SCAF4 gene (NM_020706). Sanger sequencing confirmed paternal inheritance of this mutation."
      explanation: Single-case report of an inherited nonsense allele.
  - name: c.1489C>T (p.Gln497Ter)
    type: nonsense
    clinical_significance: PATHOGENIC
    description: >-
      De novo in a woman with epilepsy and mild ID and transmitted to her
      fetus.
    evidence:
    - reference: PMID:41811042
      reference_title: "[Clinical features and genetic etiology analysis in a patient with Fliedner-Zweier syndrome caused by a de novo SCAF4 variant]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "WES revealed that the woman and her fetus both harbored a heterozygous c.1489C>T (p.Gln497Ter) nonsense variant of the SCAF4 gene, which was verified by Sanger sequencing as de novo."
      explanation: Single-case report of a de novo nonsense allele.
  - name: CTD-interacting domain missense variants (p.Leu11Pro, p.Ser13Leu, p.Gln118Pro)
    type: missense
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    description: >-
      Three missense variants in the CID predicted by structural modelling to
      destabilise the domain; classified as of uncertain significance.
    evidence:
    - reference: PMID:39668183
      reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Three missense variants in the CTD-interacting domain of SCAF4 were predicted to destabilize the domain."
      explanation: In silico prediction only.
diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis rests on identifying a heterozygous SCAF4 loss-of-function
    variant by exome (often trio) sequencing in a child with developmental
    delay, speech delay, seizures or behavioural problems; the phenotype is
    non-specific, so the disorder is not recognisable clinically. Because
    variants are frequently inherited from mildly affected parents, inherited
    variants should not be filtered out in trio analysis.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing and international matchmaking, we identified nine likely pathogenic germline variants in SCAF4 including two splice-site and seven truncating variants"
    explanation: Exome sequencing was the diagnostic route in the founding cohort.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is in accordance with SCAF4-associated NDD being rather mild regarding the cognitive phenotype but might provide some challenges for variant filtering and interpretation in trio exome sequencing approaches."
    explanation: Inherited variants complicate trio-based filtering.
treatments:
- name: Antiseizure medication
  description: >-
    Seizures are treated with standard antiseizure medication; in small series
    they were infrequent and responded well, but intractable seizures have
    been reported. No SCAF4-specific therapy exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiseizure medication
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: antiseizure medication
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_mechanisms:
  - target: Seizures
  evidence:
  - reference: PMID:37891035
    reference_title: "SCAF4 variants are associated with epilepsy with neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands experienced epilepsy as infrequent seizures, responded well to antiseizure drugs"
    explanation: Good antiseizure-drug response in three de novo cases.
  - reference: PMID:37394306
    reference_title: "SCAF4 variants associated with focal epilepsy accompanied by multisystem disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, no recurrence was observed after short-term ASMs treatment."
    explanation: Seizure control after short-term antiseizure medication in three cases.
- name: Organ-system screening at diagnosis
  description: >-
    Because cardiac, renal, urogenital and ophthalmological anomalies occur in
    a minority, targeted evaluation for them is suggested at diagnosis. This
    is an author recommendation from a case series, not a guideline.
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to a certain prevalence of cardiac, renal, urogenital and ophthalmological anomalies, a specific check for such abnormalities might be considered at time of diagnosis."
    explanation: Authors' surveillance recommendation.
animal_models:
- name: Drosophila CG4266 pan-neuronal RNAi knockdown
  species: Drosophila melanogaster
  genotype: Pan-neuronal RNAi knockdown of CG4266, the SCAF4 ortholog
  publication: PMID:32730804
  modeled_mechanisms:
  - target: Impaired Nervous System Development and Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      RNAi knockdown in an invertebrate, which does not model human
      heterozygous loss; no seizure phenotype was seen in the
      bang-sensitivity assay.
    evidence:
    - reference: PMID:32730804
      reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These observations indicate a role of CG4266 in nervous system development and function and support the implication of SCAF4 in neurodevelopmental phenotypes."
      explanation: Authors' interpretation of the fly knockdown phenotypes.
- name: Zebrafish scaf4a/scaf4b knockout
  species: Zebrafish
  genotype: CRISPR-Cas9 knockout of scaf4a and scaf4b
  publication: PMID:37394306
  modeled_mechanisms:
  - target: Impaired Nervous System Development and Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    limitations: >-
      Knockout of both teleost paralogs rather than heterozygous loss; details
      available only from the abstract.
    evidence:
    - reference: PMID:37394306
      reference_title: "SCAF4 variants associated with focal epilepsy accompanied by multisystem disorders."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In zebrafish, abnormal epileptiform signals, skeletal development, and neurodevelopment have been found in scaf4a/b knockout compared to wild-type zebrafish."
      explanation: Vertebrate model with epileptiform activity and skeletal anomalies.

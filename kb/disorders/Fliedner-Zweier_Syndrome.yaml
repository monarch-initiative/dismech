name: Fliedner-Zweier Syndrome
creation_date: "2026-10-26T12:00:00Z"
category: Mendelian
description: >-
  Fliedner-Zweier syndrome (SCAF4-associated neurodevelopmental disorder) is an
  autosomal dominant neurodevelopmental disorder caused by heterozygous, mostly
  truncating and splice-site, loss-of-function variants in SCAF4, which encodes
  an RNA polymerase II CTD-binding factor that, together with SCAF8, suppresses
  premature use of early polyadenylation sites. Children present with
  developmental delay in which speech is more affected than motor milestones,
  borderline to mild intellectual disability (moderate to severe in a minority),
  frequent behavioural and psychiatric disturbance, seizures in roughly half,
  and variable skeletal anomalies such as clubfoot, scoliosis and hip
  dysplasia, with non-specific facial dysmorphism. Variants are de novo in most
  families but inherited from a mildly affected or unaffected parent in a
  substantial minority.
synonyms:
- SCAF4-associated neurodevelopmental disorder
- SCAF4-related syndromic intellectual disability
notes: >-
  No GeneReviews chapter names this disorder in the committed Bookshelf index
  (checked with just check-genereviews). ClinGen's Intellectual Disability and
  Autism GCEP classifies SCAF4 for the broader MONDO:0100038 complex
  neurodevelopmental disorder, not for MONDO:0957787, so no
  gene_disease_validity tier is recorded here.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous variants; most arise de novo, but a substantial minority are
    inherited from a parent who is mildly affected (learning difficulties or
    mild behavioural problems) or reported as unaffected, so penetrance is
    high but incomplete and expressivity is variable.
  evidence:
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-three variants occurred de novo, and variants were inherited in 13 cases."
    explanation: >-
      In the 50-individual cohort, 23 variants were de novo and 13 inherited,
      the remainder untested.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the familial cases with available data, six of eight transmitting parents were reported to have had or still have learning difficulties or mild behavioral abnormalities."
    explanation: >-
      Most transmitting parents are mildly affected, supporting variable
      expressivity.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This characterizes the SCAF4-associated phenotype as a rather mild and non-specific neurodevelopmental disorder with variable clinical expression and high, though not complete, penetrance."
    explanation: Authors' conclusion on penetrance and expressivity.
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, our data show that heterozygous, likely gene-disrupting variants in SCAF4 are causative for a variable neurodevelopmental disorder associated with impaired mRNA processing."
    explanation: Founding cohort establishing heterozygous SCAF4 variants as causal.
pathophysiology:
- name: SCAF4 Haploinsufficiency
  description: >-
    Heterozygous truncating and splice-site variants spread across SCAF4 are
    predicted, and for some alleles shown in patient blood RNA, to undergo
    nonsense-mediated decay or yield severely truncated protein, reducing the
    dose of SCAF4. SCAF4 binds the RNA polymerase II C-terminal domain
    phosphorylated on Ser2 and Ser5 through its N-terminal CTD-interacting
    domain (CID); the few missense variants reported cluster in the CID and are
    predicted to destabilise it, compatible with the same loss of function.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SCAF4
    term:
      id: hgnc:19304
      label: SCAF4
  molecular_functions:
  - preferred_term: RNA polymerase II CTD phosphoserine binding
    modifier: DECREASED
    term:
      id: GO:1990269
      label: RNA polymerase II C-terminal domain phosphoserine binding
  evidence:
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all truncating variants in the N-terminal part of SCAF4, a general loss-of-function mechanism or haploinsufficiency is therefore likely."
    explanation: >-
      Founding cohort infers haploinsufficiency from variant position, NMD on
      patient blood RNA and aberrant splicing of a splice-site allele.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating, including splice-site variants were distributed ubiquitously over the gene/protein, thus being compatible with a general loss-of-function (LoF) effect or haploinsufficiency"
    explanation: Variant distribution in the second cohort supports loss of function.
  - reference: PMID:39668183
    reference_title: "Further delineation of the SCAF4-associated neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structural modeling for the three missense variants in the CTD-interacting domain indicated that each of them significantly disrupt the domain structure"
    explanation: >-
      In silico structural modelling suggests CID missense variants also reduce
      SCAF4 function; these variants remain of uncertain significance.
  - reference: PMID:31104839
    reference_title: "SCAF4 and SCAF8, mRNA Anti-Terminator Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SCAF4/8 proteins bind the hyper-phosphorylated RNAPII C-terminal repeat domain (CTD) phosphorylated on both Ser2 and Ser5 and are detected at early, alternative polyA sites."
    explanation: Establishes the molecular function whose dose is reduced.
  - reference: PMID:34897689
    reference_title: "Structural basis for the recognition of the S2, S5-phosphorylated RNA polymerase II CTD by the mRNA anti-terminator protein hSCAF4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although hSCAF4-CID has almost the same binding pattern to the CTD as other CID-containing proteins, it preferentially binds to the S2, S5-phosphorylated CTD."
    explanation: Structural and binding data for the SCAF4 CID on the phosphorylated CTD.
  downstream:
  - target: Altered Polyadenylation Site Selection and Transcription Termination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from complete SCAF4 knockout (alone or with SCAF8) in a human
      cell line; whether heterozygous loss in patients produces the same
      termination defect has not been shown directly.
  - target: Transcriptome-wide Expression and Splicing Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32730804
      reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Paired-end RNA sequencing on blood lymphocytes of SCAF4-deficient individuals revealed a broad deregulation of more than 9,000 genes and significant differential splicing of more than 2,900 genes, indicating an important role of SCAF4 in mRNA processing."
      explanation: >-
        Patients carrying SCAF4 variants show broad transcriptome changes in
        blood; the intermediate steps are not resolved.
  - target: Impaired Nervous System Development and Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32730804
      reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of the SCAF4 ortholog CG4266 in the model organism Drosophila melanogaster resulted in impaired locomotor function, learning, and short-term memory."
      explanation: Reduced dose of the fly ortholog impairs neural function.
- name: Altered Polyadenylation Site Selection and Transcription Termination
  description: >-
    SCAF4 and SCAF8 act redundantly as anti-terminators that suppress early,
    alternative polyadenylation sites; SCAF4 is additionally required for
    termination at canonical distal sites. Loss of SCAF4 in HEK293 cells
    increases transcriptional read-through or alternative last-exon usage, and
    combined loss with SCAF8 causes early termination and truncated mRNAs and
    is lethal. These data come from engineered knockout cell lines, not from
    patient cells.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of mRNA alternative polyadenylation
    modifier: DYSREGULATED
    term:
      id: GO:0140408
      label: regulation of mRNA alternative polyadenylation
  - preferred_term: termination of RNA polymerase II transcription
    modifier: DYSREGULATED
    term:
      id: GO:0006369
      label: termination of RNA polymerase II transcription
  evidence:
  - reference: PMID:31104839
    reference_title: "SCAF4 and SCAF8, mRNA Anti-Terminator Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we describe a role for SCAF4 and SCAF8 as anti-terminators, suppressing the use of early, alternative polyadenylation (polyA) sites."
    explanation: Defines the anti-terminator function.
  - reference: PMID:31104839
    reference_title: "SCAF4 and SCAF8, mRNA Anti-Terminator Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While SCAF4 and SCAF8 work redundantly to suppress early mRNA termination, they also have independent, non-essential functions. SCAF8 is an RNAPII elongation factor, whereas SCAF4 is required for correct termination at canonical, distal transcription termination sites in the presence of SCAF8."
    explanation: SCAF4-specific requirement for correct termination in knockout cells.
  - reference: PMID:31104839
    reference_title: "SCAF4 and SCAF8, mRNA Anti-Terminator Proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Concomitant knockout of human SCAF4 and SCAF8 results in altered polyA selection and subsequent early termination, leading to expression of truncated mRNAs and proteins lacking functional domains and is cell lethal."
    explanation: Double-knockout phenotype in human cells; not a patient genotype.
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "CRISPR-Cas9-mediated knockout of SCAF4 in HEK293 cells resulted in increased transcriptional read-through or in the usage of alternative last exons."
    explanation: >-
      The patient cohort paper's summary of the single-knockout cell-line
      result from Gregersen et al.
- name: Transcriptome-wide Expression and Splicing Dysregulation
  description: >-
    RNA sequencing of peripheral blood from four individuals with SCAF4
    variants, compared with eight controls, showed differential expression of
    9,038 genes and differential isoform usage in more than 2,900 genes. A
    later case with a paternally inherited nonsense variant also showed
    widespread transcriptional dysregulation in blood RNA. Whether these
    changes reflect the termination defect seen in knockout cells, and how
    they relate to neural phenotypes, is not established.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: peripheral blood lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  biological_processes:
  - preferred_term: gene expression
    modifier: DYSREGULATED
    term:
      id: GO:0010467
      label: gene expression
  - preferred_term: mRNA processing
    modifier: DYSREGULATED
    term:
      id: GO:0006397
      label: mRNA processing
  evidence:
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that a very large number of genes (n = 9,038) were differentially expressed between the groups of four affected individuals and the eight control subjects, with an adjusted p value < 0.01 (FDR corrected)."
    explanation: Patient blood transcriptome changes.
  - reference: PMID:40290495
    reference_title: "A novel nonsense mutation in SCAF4 associated with fliedner-zweier syndrome: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA sequencing from the patient demonstrated widespread transcriptional dysregulation, reinforcing the role of SCAF4 dysfunction in impaired transcription and neurodevelopmental disorders."
    explanation: Independent single-patient replication of broad transcriptional change.
- name: Impaired Nervous System Development and Function
  description: >-
    Model-organism data link reduced SCAF4 ortholog dose to neural dysfunction:
    pan-neuronal knockdown of the Drosophila ortholog CG4266 impaired
    climbing, learning and short-term memory and increased active-zone number
    at larval neuromuscular junctions, and scaf4a/b knockout zebrafish showed
    epileptiform signals and abnormal neurodevelopment and skeletal
    development. The cellular steps between SCAF4 loss and these phenotypes are
    unknown.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: nervous system development
    modifier: ABNORMAL
    term:
      id: GO:0007399
      label: nervous system development
  evidence:
  - reference: PMID:32730804
    reference_title: "Variants in SCAF4 Cause a Neurodevelopmental Disorder and Are Associated with Impaired mRNA Processing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we observed an increased number of active zones in larval neuromuscular junctions, representing large glutamatergic synapses."
    explanation: Synaptic structural change after fly ortholog knockdown.
  - reference: PMID:37394306
    reference_title: "SCAF4 variants associated with focal epilepsy accompanied by multisystem disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, abnormal epileptiform signals, skeletal development, and neurodevelopment have been found in scaf4a/b knockout compared to wild-type zebrafish."
    explanation: Vertebrate knockout recapitulates neural and skeletal features.
  downstream:
  - target: Mild intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Behavioral and psychiatric disturbances
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Skeletal anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Skeletal involvement is placed here only because the zebrafish knockout
      shows both neural and skeletal abnormality; no skeletal-specific
      mechanism has been described.

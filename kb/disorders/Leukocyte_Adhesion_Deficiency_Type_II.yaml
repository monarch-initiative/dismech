- category: Dental
  name: Chronic Severe Periodontitis
  frequency: VERY_FREQUENT
  description: 'Chronic severe periodontitis, described in the LAD II review literature as the one
    persistent clinical symptom of the disease. That framing is worth keeping: the infectious episodes
    in LAD II are milder than in LAD I, so what remains constant is the periodontal disease rather
    than the systemic infection.

    Mechanistically it follows from the same extravasation failure as the infection phenotype - the
    gingival sulcus depends on continuous neutrophil surveillance, and neutrophils that cannot leave
    the vasculature cannot provide it.'
  phenotype_term:
    preferred_term: Periodontitis
    term:
      id: HP:0000704
      label: Periodontitis
    clinical_course: PROGRESSIVE

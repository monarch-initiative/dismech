- name: NCT05754450
  phase: PHASE_III
  status: RECRUITING
  description: Open-label extension assessing long-term safety and efficacy of AVTX-803. Relevant
    to this entry because fucose supplementation is a substrate-replacement strategy that must be
    continued indefinitely - the transporter is not repaired - so long-term data is the question
    that matters clinically.
  evidence:
  - reference: clinicaltrials:NCT05754450
    reference_title: A Phase 3, Open-Label, Extension Study to Assess the Long-term Safety and Efficacy
      of AVTX-803 in Subjects With Leukocyte Adhesion Deficiency Type II (LAD II)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The primary objective of this extension study is to assess the long-term safety and
      efficacy of AVTX-803 in subjects with LAD II (SLC35C1-CDG).
    explanation: States the extension study's objective and confirms it targets the same SLC35C1
      entity.
- name: NCT03354533
  phase: PHASE_II
  status: COMPLETED
  description: Completed Phase 1/2 study of ORL-1F, an oral L-fucose formulation - the earlier regulatory-track
    attempt at the same substrate-replacement strategy. Recorded as PHASE_II because the registration

treatments:
- name: Oral Fucose Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: 'Oral L-fucose, which is rational rather than empirical: fucose entering by the salvage
    pathway raises the cytosolic GDP-fucose pool, and a higher substrate concentration can drive
    enough flux through a crippled transporter to restore fucosylation. It treats the substrate side
    of a transport problem rather than the transporter.

    In the index patient the effect was measurable at the molecular level and then at the clinical
    one: fucosylated selectin ligands reappeared on neutrophils, serum glycoproteins regained core
    fucosylation, and over nine months infections and fever stopped while the neutrophil count normalised.

    It does not work for everyone, and the reason is genotypic rather than a matter of dose or adherence
    - the founder-mutation study found the two alleles differed in their response. Treatment is therefore
    reasonably attempted and must be assessed per patient.'
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: L-fucose
      term:
        id: CHEBI:18287
        label: L-fucose
  target_mechanisms:
  - target: Impaired Golgi GDP-Fucose Import
    description: Raises substrate availability upstream of the failed transport step rather than
      correcting the transporter, which is why residual transport activity determines whether it
      works.
    evidence:
    - reference: PMID:10590041
      reference_title: Correction of leukocyte adhesion deficiency type II with oral fucose.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The fucosylation defect in LAD II fibroblasts can be corrected by addition of L-fucose
        to the culture medium.
      explanation: The in-vitro correction that supplied the rationale for treating the substrate
        side of the defect.
  evidence:
  - reference: PMID:10590041
    reference_title: Correction of leukocyte adhesion deficiency type II with oral fucose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Oral supplementation of fucose in this patient induced the expression of fucosylated
      selectin ligands on neutrophils and core fucosylation of serum glycoproteins.
    explanation: The molecular response - the treatment restores the specific glycan whose absence
      defines the disease.
  - reference: PMID:10590041
    reference_title: Correction of leukocyte adhesion deficiency type II with oral fucose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During 9 months of treatment, infections and fever disappeared, elevated neutrophil
      counts returned to normal, and psychomotor capabilities improved.
    explanation: The clinical response over a defined period in the index patient.
  - reference: PMID:12116250
    reference_title: Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein
      (CDG) IIc founder effect and genotype/phenotype correlation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Genotype/phenotype correlation studies show that the two different mutations are distinguished
      by differences in response to fucose supplementation and in the clinical phenotypes.
    explanation: 'PARTIAL because it qualifies the treatment rather than supporting it: response
      is allele-dependent, so this is not a uniformly effective therapy.'
- name: AVTX-803 (oral L-fucose, regulatory-track product)
  therapeutic_modality: SMALL_MOLECULE
  description: 'A purpose-built oral L-fucose product carrying the same substrate-replacement rationale
    as compassionate-use fucose, but developed as a drug and now in a randomised Phase 3 withdrawal
    trial with an open-label extension.

    It is curated separately from the supplementation record above because the difference is not
    cosmetic: the 1999 report is a single patient given a sugar, while this is a controlled test
    of whether the benefit persists and depends on continued dosing. The trial''s primary endpoint
    is leukocyte sialyl-Lewis X expression - the same measurement used diagnostically - so efficacy
    is assessed directly against the mechanism rather than through an infection-count proxy that
    would be underpowered in a disease this rare.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-fucose
      term:
        id: CHEBI:18287
        label: L-fucose
  target_mechanisms:
  - target: Impaired Golgi GDP-Fucose Import
    description: Same mechanism as dietary fucose - raising substrate availability upstream of the
      failed transport step - delivered as a controlled product.
  evidence:
  - reference: clinicaltrials:NCT05462587
    reference_title: A Phase 3, Randomized, Double-blind, Two-period, Crossover, Withdrawal Study
      to Assess the Efficacy and Safety of AVTX-803 in Subjects With Leukocyte Adhesion Deficiency
      Type II (LAD II)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The primary objective of this study is to evaluate the efficacy and safety of AVTX-803
      compared to withdrawal in patients with Leukocyte Adhesion Deficiency, Type II (LAD II).
    explanation: Establishes AVTX-803 as an agent under controlled evaluation in this disease. Note
      this is a statement of objective from a registration record, not a result - the trial is recruiting
      and no efficacy outcome is available.
- name: Infection Prophylaxis and Management
  therapeutic_modality: SMALL_MOLECULE
  description: Antimicrobial prophylaxis and prompt treatment of intercurrent infection, which is
    supportive rather than mechanism-directed. Recorded because it is what patients who do not respond
    to fucose actually receive.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Neutrophil Extravasation to Infection Sites
    description: Compensates for the missing neutrophil response rather than restoring it.
  notes: Deliberately unevidenced. The LAD II literature cited here reports no prophylaxis trial
    or outcome series, and quoting a general immunodeficiency prophylaxis study would attach evidence
    about a different population to a claim about this disease.
- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  description: Autosomal recessive inheritance with a 25% recurrence risk per pregnancy for carrier
    couples. Founder alleles and consanguinity are prominent in the reported families, so carrier
    testing of extended relatives is informative where a family allele is known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:12116250
    reference_title: Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein
      (CDG) IIc founder effect and genotype/phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All three children reported by us are homozygous for one single founder mutation, different
      from that reported in the Turkish child.
    explanation: Documents the founder-allele structure that makes targeted carrier testing useful.
diagnosis:
- name: Flow Cytometry for Neutrophil Sialyl-Lewis X (CD15s)
  description: Flow cytometry showing absent or markedly reduced sialyl-Lewis X on the neutrophil
    surface. This is the functional test that reads out the disease mechanism directly - it measures
    the missing glycan itself rather than a downstream consequence - and it is also what the pivotal
    treatment trial uses as its primary endpoint, so the diagnostic assay and the efficacy measure
    are the same measurement.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:10590041
    reference_title: Correction of leukocyte adhesion deficiency type II with oral fucose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Oral supplementation of fucose in this patient induced the expression of fucosylated
      selectin ligands on neutrophils and core fucosylation of serum glycoproteins.
    explanation: Demonstrates neutrophil fucosylated selectin ligand expression being measured as
      a readout in patients, which is the assay this record describes.
  - reference: PMID:11213799
    reference_title: Leukocyte adhesion deficiency II-from A to almost Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The exact defect in the system is absence of the SLeX, which is an important ligand
      for the selectin on the leukocyte
    explanation: States directly that absent sialyl-Lewis X is the defect, which is what this assay
      is looking for.
- name: Bombay (hh) Blood Group Typing
  description: 'Red-cell typing showing the Bombay phenotype. In combination with recurrent infection,
    leukocytosis and developmental delay it is close to pathognomonic, because the combination of
    an immunodeficiency with this blood group has essentially one cause.

    It is a useful pointer precisely because it is incidental - blood typing is done for unrelated
    reasons, and an unexpected Bombay result in a child with infections is a reason to think of this
    disease.'
  diagnosis_term:
    preferred_term: blood typing test
    term:
      id: NCIT:C210738
      label: Blood Typing Test
  evidence:
  - reference: PMID:11213799
    reference_title: Leukocyte adhesion deficiency II-from A to almost Z.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Apart from the leukocyte defect, these patients suffer from severe growth and mental
      retardation and exhibit the rare Bombay blood group type.
    explanation: Establishes the Bombay blood group as a feature of the patient population, alongside
      the growth and neurodevelopmental phenotype.
- name: SLC35C1 Sequencing
  description: Molecular confirmation by sequencing SLC35C1. Because the milder presentations can
    lack any immune signal at all - short stature and developmental delay alone - exome or genome
    sequencing is the realistic route in patients who are not suspected clinically.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:24403049
    reference_title: Congenital disorder of fucosylation type 2c (LADII) presenting with short stature
      and developmental delay with minimal adhesion defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report two brothers with short stature and developmental delay who are compound heterozygotes
      for novel mutations in SLC35C1
    explanation: A molecularly made diagnosis in patients whose presentation gave no immunological
      clue, which is the case for sequencing rather than functional testing.
clinical_trials:
- name: NCT05462587
  phase: PHASE_III
  status: RECRUITING
  description: 'LADDER - a randomized, double-blind, two-period crossover withdrawal study of AVTX-803,
    a purpose-built oral L-fucose product, in LAD II. The withdrawal design is the informative part:
    patients already on fucose are randomised to continue or withdraw, which tests whether the observed
    benefit depends on continued treatment rather than comparing against a never-treated group that
    would be hard to assemble in a disease this rare.'
  target_phenotypes:

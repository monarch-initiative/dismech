- category: Immunologic
  name: Recurrent Bacterial Infections
  frequency: VERY_FREQUENT
  description: Recurrent bacterial infection without pus formation at the site, reflecting neutrophils
    that cannot reach tissue rather than neutrophils that are absent or non-functional.
  phenotype_term:

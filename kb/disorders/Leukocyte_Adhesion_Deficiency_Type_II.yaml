      (CDG) IIc founder effect and genotype/phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: characterized by recurrent infections, typical dysmorphic features, the Bombay blood
      phenotype and severe growth and psychomotor retardation
    explanation: Names recurrent infection as a defining feature of the syndrome.
- category: Hematologic
  name: Persistent Leukocytosis
  frequency: VERY_FREQUENT
  description: A markedly raised circulating leukocyte count in the presence of active infection
    - the diagnostic paradox of this disease. The neutrophils are made and released normally but
    cannot exit the vasculature, so they accumulate in the compartment where they are counted and
    are missing from the compartment where they are needed.
  phenotype_term:
    preferred_term: Increased total leukocyte count
    term:
      id: HP:0001974
      label: Increased total leukocyte count
  evidence:
  - reference: PMID:24403049
    reference_title: Congenital disorder of fucosylation type 2c (LADII) presenting with short stature
      and developmental delay with minimal adhesion defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: inability to generate key fucosylated molecules including sialyl Lewis X leads to leukocytosis
      and recurrent infections
    explanation: Ties the leukocytosis to the same sialyl-Lewis X defect as the infection phenotype.
  - reference: PMID:10590041
    reference_title: Correction of leukocyte adhesion deficiency type II with oral fucose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: elevated neutrophil counts returned to normal

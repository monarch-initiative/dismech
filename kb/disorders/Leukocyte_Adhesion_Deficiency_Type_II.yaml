name: Leukocyte Adhesion Deficiency Type II
creation_date: '2026-08-26T21:00:00Z'
category: Mendelian
disease_term:
  preferred_term: leukocyte adhesion deficiency type II
  term:
    id: MONDO:0009953
    label: leukocyte adhesion deficiency type II
synonyms:
- LAD II
- LAD2
- congenital disorder of glycosylation type IIc
- CDG-IIc
- SLC35C1-CDG
description: 'An autosomal recessive disorder in which a Golgi GDP-fucose transporter fails, so the
  fucosyltransferases waiting inside the Golgi lumen are starved of their donor substrate and almost
  nothing in the cell gets fucosylated.

  What makes the entry worth curating is that a single biochemical lesion produces several clinically
  unrelated consequences through entirely separate downstream branches. Loss of sialyl-Lewis X on
  neutrophils removes the ligand selectins bind, so leukocytes cannot roll along activated endothelium
  and never leave the bloodstream - giving recurrent bacterial infection alongside a paradoxically
  high blood neutrophil count. Loss of alpha-1,2 fucosylation on the red-cell H-antigen precursor
  gives the Bombay blood phenotype, which is diagnostically useful and pathophysiologically inert.
  Growth failure and severe intellectual disability arise from hypofucosylation of substrates that
  remain largely unidentified. The entry models these as parallel branches rather than a chain, because
  the evidence supports a shared cause and not a shared route.

  Two further things are curated deliberately rather than smoothed over. The immune phenotype is
  not obligate: a compound-heterozygous sibling pair with a partial transport defect had impaired
  neutrophil rolling yet enough residual adhesion to avoid leukocytosis and recurrent infection entirely,
  presenting only with short stature and developmental delay. And oral fucose - a genuinely rational
  therapy, since it refills the substrate pool by an alternative salvage route - works for some genotypes
  and not others, a difference the founder-mutation literature states outright.'
parents:
- Congenital Disorder of Glycosylation
- Leukocyte Adhesion Deficiency
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: Ultra-rare. The founder-effect series describes the total reported literature at that time
    as three Arab Israeli patients plus one Turkish child; a handful of further families have been
    reported since. No population frequency has been estimated, and the count below should be read
    as a literature census rather than an occurrence measure.
  evidence:
  - reference: PMID:12116250
    reference_title: Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein
      (CDG) IIc founder effect and genotype/phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Three Arab Israeli patients and one Turkish child have been reported so far.
    explanation: A direct literature census at the time of the founder-effect report, which is the
      basis for the ultra-rare band rather than any population estimate.
pathophysiology:
- name: Biallelic SLC35C1 Loss-of-Function Variants
  role: trigger
  biological_scale: MOLECULAR
  description: Both copies of SLC35C1 carry variants that disable the Golgi GDP-fucose transporter.
    The founding patient carried R147C in the fourth transmembrane region, and overexpressing that
    mutant protein in the patient's own cells failed to rescue fucosylation - which is what established
    the substitution as causal rather than incidental.
  genetic_context:
    gene:
      preferred_term: SLC35C1
      term:
        id: hgnc:20197
        label: SLC35C1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Homozygous in the reported founder families; compound heterozygous in the milder
      sibling pair curated below. Loss of function is asserted on the strength of the failed rescue
      experiment rather than inferred from variant class alone.
  downstream:
  - target: Impaired Golgi GDP-Fucose Import
    causal_link_type: DIRECT
    description: The gene product is the transporter, so a disabling variant removes the transport
      step directly.
  evidence:
  - reference: PMID:11326279
    reference_title: The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose
      transporter.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The corresponding endogenous protein in LAD II cells had an R147C amino acid change
      in the conserved fourth transmembrane region.
    explanation: Identifies the causal substitution in the founding patient.
  - reference: PMID:11326279
    reference_title: The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose
      transporter.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Overexpression of this mutant protein in cells from a patient with LAD II did not rescue
      fucosylation, demonstrating that the point mutation affected the activity of the protein.
    explanation: The rescue-failure experiment that makes this loss of function rather than a coincidental
      variant.
- name: Impaired Golgi GDP-Fucose Import
  role: central_effector
  biological_scale: MOLECULAR
  description: 'GDP-fucose is made in the cytosol but consumed in the Golgi lumen, so it must cross
    a membrane to reach the enzymes that use it. That crossing is what fails here. The defect was
    localised to transport specifically by excluding the alternatives: neither fucosyltransferase
    activity nor the enzymes of GDP-fucose biosynthesis were deficient, while transport into isolated
    Golgi vesicles was reduced.'
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  molecular_functions:
  - preferred_term: GDP-fucose transmembrane transporter activity
    term:
      id: GO:0005457
      label: GDP-fucose transmembrane transporter activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: GDP-fucose transmembrane transport
    term:
      id: GO:0015783
      label: GDP-fucose transmembrane transport
    modifier: DECREASED
  downstream:
  - target: Global Hypofucosylation of Glycoconjugates
    causal_link_type: DIRECT
    description: Substrate starvation of the luminal fucosyltransferases, which are themselves normal.
  evidence:
  - reference: PMID:11326279
    reference_title: The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose
      transporter.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No deficiency in fucosyltransferase activities or in the activities of enzymes involved
      in GDP-fucose biosynthesis has been found. Instead, the transport of GDP-fucose into isolated
      Golgi vesicles of LAD II cells appeared to be reduced.
    explanation: Localises the lesion to transport by exclusion - the enzymes and the biosynthetic
      pathway are intact, and only the membrane step is impaired.
- name: Global Hypofucosylation of Glycoconjugates
  role: central_effector
  biological_scale: MOLECULAR
  description: 'With no donor substrate reaching them, the Golgi fucosyltransferases cannot fucosylate
    their targets, and the deficit is general rather than selective - N-glycans, O-glycans and glycolipids
    alike. This node is the branch point of the entry: everything below it is a separate consequence
    of the same missing modification, not a step in a common chain.'
  molecular_functions:
  - preferred_term: fucosyltransferase activity
    term:
      id: GO:0008417
      label: fucosyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: fucose metabolic process
    term:
      id: GO:0006004
      label: fucose metabolic process
    modifier: DECREASED
  downstream:
  - target: Loss of Sialyl-Lewis X Selectin Ligands
    causal_link_type: DIRECT
    description: Sialyl-Lewis X is a fucosylated tetrasaccharide; without fucose it is not built.
  - target: Loss of Red Cell H-Antigen Fucosylation
    causal_link_type: DIRECT
    description: The H antigen is made by alpha-1,2 fucosylation of its precursor, which fails for
      the same reason.
  - target: Growth Failure and Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Attributed to hypofucosylation of glycoproteins and glycolipids needed for normal
      growth and neurodevelopment, but the responsible substrates have not been identified, so the
      intermediate steps are genuinely unknown.
  evidence:
  - reference: PMID:11326279
    reference_title: The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose
      transporter.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Leukocyte adhesion deficiency II (LAD II) is characterized by the lack of fucosylated
      glycoconjugates, including selectin ligands, causing immunodeficiency and severe mental and
      growth retardation.
    explanation: States the general absence of fucosylated glycoconjugates and names the three consequence
      branches curated below it.
  - reference: PMID:12116250
    reference_title: Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein
      (CDG) IIc founder effect and genotype/phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is attributed to a general absence of fucosylated glycans on the cell surface.
    explanation: Confirms the deficit is general rather than restricted to one glycan class.
- name: Loss of Sialyl-Lewis X Selectin Ligands
  role: effector
  biological_scale: CELLULAR
  description: Sialyl-Lewis X on the neutrophil surface is the carbohydrate that E-, P- and L-selectin
    recognise. Without its fucose it is not assembled, so the neutrophil presents no ligand for the
    endothelial selectins to catch.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Failure of Leukocyte Rolling on Activated Endothelium
    causal_link_type: DIRECT
    description: Rolling is selectin-mediated, so removing the ligand removes the interaction.
  evidence:
  - reference: PMID:24403049
    reference_title: Congenital disorder of fucosylation type 2c (LADII) presenting with short stature
      and developmental delay with minimal adhesion defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: inability to generate key fucosylated molecules including sialyl Lewis X leads to leukocytosis
      and recurrent infections
    explanation: Names sialyl-Lewis X as the fucosylated molecule whose loss drives the immune phenotype.
- name: Failure of Leukocyte Rolling on Activated Endothelium
  role: effector
  biological_scale: TISSUE
  description: 'Rolling is the first step of the adhesion cascade: without it the neutrophil never
    slows enough to engage integrins, never firmly adheres, and never crosses into tissue. The circulating
    pool therefore rises while the tissue pool falls - which is why the blood count and the infection
    risk move in opposite directions here.'
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: leukocyte tethering or rolling
    term:
      id: GO:0050901
      label: leukocyte tethering or rolling
    modifier: DECREASED
  - preferred_term: leukocyte cell-cell adhesion
    term:
      id: GO:0007159
      label: leukocyte cell-cell adhesion
    modifier: DECREASED
  downstream:
  - target: Impaired Neutrophil Extravasation to Infection Sites
    causal_link_type: DIRECT
    description: Extravasation requires the rolling step that has been lost.
  evidence:
  - reference: PMID:24403049
    reference_title: Congenital disorder of fucosylation type 2c (LADII) presenting with short stature
      and developmental delay with minimal adhesion defect.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: While neutrophil rolling on endothelial selectins was partially impeded, residual adhesion
      proved sufficient to avoid leukocytosis or recurrent infection.
    explanation: PARTIAL because it documents the rolling defect while simultaneously showing it
      is not always sufficient for the clinical phenotype - the partial-defect siblings had impaired
      rolling and no immune disease. Cited here to keep that qualification attached to the node it
      qualifies.
- name: Impaired Neutrophil Extravasation to Infection Sites
  role: effector
  biological_scale: ORGANISM
  description: Neutrophils remain in the circulation instead of reaching tissue, producing the characteristic
    combination of recurrent bacterial infection with a raised rather than lowered neutrophil count.
    Periodontal disease follows from the same failure of routine neutrophil surveillance at the gingival
    sulcus.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  evidence:
  - reference: PMID:10590041
    reference_title: Correction of leukocyte adhesion deficiency type II with oral fucose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This disorder leads to an immunodeficiency caused by the absence of carbohydrate-based
      selectin ligands on the surface of neutrophils
    explanation: States the causal route from absent selectin ligands to immunodeficiency.
- name: Loss of Red Cell H-Antigen Fucosylation
  role: effector
  biological_scale: CELLULAR
  description: 'The H antigen that ABO antigens are built on requires alpha-1,2 fucosylation of its
    precursor. Without it, red cells type as Bombay (hh). This branch is diagnostically valuable
    and clinically silent - it causes no anaemia and no haemolysis - and it is curated separately
    for exactly that reason: it shares a cause with the immune phenotype but nothing else.'
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:12116250
    reference_title: Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein
      (CDG) IIc founder effect and genotype/phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: characterized by recurrent infections, typical dysmorphic features, the Bombay blood
      phenotype and severe growth and psychomotor retardation
    explanation: Lists the Bombay blood phenotype as a defining feature alongside the other branches.
- name: Growth Failure and Neurodevelopmental Impairment
  role: effector
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: 'Severe growth retardation and intellectual disability accompany the disorder in the
    classically affected patients. PROVISIONAL because the mechanism is genuinely open: the phenotype
    is attributed to hypofucosylation of glycoproteins and glycolipids required for normal growth-factor
    signalling and neurodevelopment, but the specific fucosylated substrates responsible have not
    been identified, and no model links a named substrate to the neurodevelopmental outcome.

    The partial-defect siblings are informative here too - they had short stature and developmental
    delay as their only presenting signs, which suggests this branch is more sensitive to residual
    transporter activity than the immune branch is.'
  evidence:
  - reference: PMID:11326279
    reference_title: The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose
      transporter.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: causing immunodeficiency and severe mental and growth retardation
    explanation: Attributes the neurodevelopmental and growth phenotype to the same hypofucosylation
      that causes the immunodeficiency, without specifying intermediates.
  - reference: PMID:24403049
    reference_title: Congenital disorder of fucosylation type 2c (LADII) presenting with short stature
      and developmental delay with minimal adhesion defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: show that short stature and developmental delay may be the sole presenting signs in
      this disorder
    explanation: Establishes that this branch can present in isolation, which is the basis for curating
      it as parallel to the immune branch rather than downstream of it.

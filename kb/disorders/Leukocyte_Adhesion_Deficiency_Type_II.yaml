treatments:

- name: Oral Fucose Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral L-fucose, which is rational rather than empirical: fucose entering by the salvage
    pathway raises the cytosolic GDP-fucose pool, and a higher substrate concentration can
    drive enough flux through a crippled transporter to restore fucosylation. It treats the
    substrate side of a transport problem rather than the transporter.

    In the index patient the effect was measurable at the molecular level and then at the
    clinical one: fucosylated selectin ligands reappeared on neutrophils, serum
    glycoproteins regained core fucosylation, and over nine months infections and fever
    stopped while the neutrophil count normalised.

    It does not work for everyone, and the reason is genotypic rather than a matter of
    dose or adherence - the founder-mutation study found the two alleles differed in their
    response. Treatment is therefore reasonably attempted and must be assessed per patient.
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: L-fucose
      term:
        id: CHEBI:18287
        label: L-fucose
  target_mechanisms:
  - target: Impaired Golgi GDP-Fucose Import
    description: >-
      Raises substrate availability upstream of the failed transport step rather than
      correcting the transporter, which is why residual transport activity determines
      whether it works.
    evidence:
    - reference: PMID:10590041
      reference_title: "Correction of leukocyte adhesion deficiency type II with oral fucose."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The fucosylation defect in LAD II fibroblasts can be corrected by addition of
        L-fucose to the culture medium.
      explanation: >-
        The in-vitro correction that supplied the rationale for treating the substrate side
        of the defect.
  evidence:
  - reference: PMID:10590041
    reference_title: "Correction of leukocyte adhesion deficiency type II with oral fucose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral supplementation of fucose in this patient induced the expression of fucosylated
      selectin ligands on neutrophils and core fucosylation of serum glycoproteins.
    explanation: >-
      The molecular response - the treatment restores the specific glycan whose absence
      defines the disease.
  - reference: PMID:10590041
    reference_title: "Correction of leukocyte adhesion deficiency type II with oral fucose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During 9 months of treatment, infections and fever disappeared, elevated neutrophil
      counts returned to normal, and psychomotor capabilities improved.
    explanation: >-
      The clinical response over a defined period in the index patient.
  - reference: PMID:12116250
    reference_title: "Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein (CDG) IIc founder effect and genotype/phenotype correlation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype/phenotype correlation studies show that the two different mutations are
      distinguished by differences in response to fucose supplementation and in the clinical
      phenotypes.
    explanation: >-
      PARTIAL because it qualifies the treatment rather than supporting it: response is
      allele-dependent, so this is not a uniformly effective therapy.

- name: Infection Prophylaxis and Management
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Antimicrobial prophylaxis and prompt treatment of intercurrent infection, which is
    supportive rather than mechanism-directed. Recorded because it is what patients who do
    not respond to fucose actually receive.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Neutrophil Extravasation to Infection Sites
    description: >-
      Compensates for the missing neutrophil response rather than restoring it.
  notes: >-
    Deliberately unevidenced. The LAD II literature cited here reports no prophylaxis trial
    or outcome series, and quoting a general immunodeficiency prophylaxis study would attach
    evidence about a different population to a claim about this disease.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance with a 25% recurrence risk per pregnancy for carrier
    couples. Founder alleles and consanguinity are prominent in the reported families, so
    carrier testing of extended relatives is informative where a family allele is known.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:12116250
    reference_title: "Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein (CDG) IIc founder effect and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three children reported by us are homozygous for one single founder mutation,
      different from that reported in the Turkish child.
    explanation: >-
      Documents the founder-allele structure that makes targeted carrier testing useful.

experimental_models:

- name: CHO-gmt5 SLC35C1-knockout cell line
  experimental_model_type: CELL_LINE
  description: >-
    A Chinese hamster ovary line in which Slc35c1 was knocked out by zinc-finger nuclease
    on a background already lacking the CMP-sialic acid transporter, giving N-glycans
    deficient in both fucose and sialic acid. It was built to solve a specific problem -
    there was no suitable mutant line for structure-function work on the transporter - and
    it is the system in which the functional elements of SLC35C1 were mapped.
  publication: PMID:22492235
  modeled_mechanisms:
  - target: Impaired Golgi GDP-Fucose Import
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the primary lesion - absent SLC35C1 function with consequent loss of
      glycan fucosylation - in a tractable system.
    limitations: >-
      A rodent ovary-derived cell line carrying a second engineered defect in the
      CMP-sialic acid transporter, so its glycans differ from a patient's in more than one
      way. It models the transporter's biochemistry, not the disease: there is no
      leukocyte, no endothelium, and therefore nothing about rolling, extravasation or
      neurodevelopment. The double defect was chosen partly for antibody-engineering
      utility rather than for disease fidelity.
    readouts:
    - name: Aleuria aurantia lectin binding to cell-surface glycans
      target: Impaired Golgi GDP-Fucose Import
      direction: DECREASED
      interpretation: >-
        Lectin binding reports cell-surface fucosylation, so it is the functional readout of
        transport activity and was the basis for mapping which residues matter.
      evidence:
      - reference: PMID:22492235
        reference_title: "Identification of functional elements of the GDP-fucose transporter SLC35C1 using a novel Chinese hamster ovary mutant."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          we found that this impact can be independently contributed by a cluster of three
          lysine residues and a Glu-Met (EM) sequence within the C terminus
        explanation: >-
          Reports the structure-function mapping this readout produced.
    evidence:
    - reference: PMID:22492235
      reference_title: "Identification of functional elements of the GDP-fucose transporter SLC35C1 using a novel Chinese hamster ovary mutant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we report a novel Chinese hamster ovary (CHO) mutant, CHO-gmt5, generated by
        the zinc-finger nuclease technology, in which the Slc35c1 gene was knocked out
      explanation: >-
        Establishes the model as an SLC35C1 knockout and therefore informative for the
        transport node.

discussions:

- discussion_id: gap_neurodevelopmental_substrates
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Growth Failure and Neurodevelopmental Impairment
  prompt: >-
    Which specific fucosylated glycoproteins or glycolipids, when hypofucosylated, produce
    the growth failure and intellectual disability of LAD II?
  rationale: >-
    The immune branch of this disease is mechanistically closed: the missing glycan is
    named, its receptor is named, and the cellular step it blocks is measurable. The
    neurodevelopmental branch has nothing equivalent. It is attributed to hypofucosylation
    of substrates needed for growth-factor signalling and neurodevelopment, but no
    particular substrate has been tied to the phenotype, which is why the node carries
    INDIRECT_UNKNOWN_INTERMEDIATES and PROVISIONAL confidence.

    This matters practically, not just descriptively. Oral fucose improved psychomotor
    capability in the index patient, so the branch is at least partly reversible - but
    without knowing the substrates there is no way to predict which patients' neurological
    features will respond or to measure the response other than clinically.

- discussion_id: interpretation_partial_defect_immune_sparing
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Leukocyte Rolling on Activated Endothelium
  - phenotypes#Persistent Leukocytosis
  prompt: >-
    How much residual GDP-fucose transport is enough to spare the immune phenotype, and
    why does the growth and neurodevelopmental branch appear more sensitive?
  rationale: >-
    The compound-heterozygous brothers had measurably impaired neutrophil rolling and
    marked changes in plasma glycoprotein glycoform distribution, yet no leukocytosis and
    no recurrent infection - only short stature and developmental delay. The authors call
    this a surprising degree of immune redundancy.

    Read against the pathograph, it says the two branches have different thresholds:
    enough residual fucosylation to keep the adhesion cascade functional was not enough to
    protect growth or neurodevelopment. That has a diagnostic consequence worth stating,
    since it means SLC35C1 disease can present to an endocrinologist or a developmental
    paediatrician with no immunological signal at all, and the leukocyte count - the
    feature the disease is named for - can be entirely normal.

notes: >-
  GeneReviews. A search returned no GeneReviews chapter for SLC35C1 or leukocyte adhesion
  deficiency type II, so the GeneReviews baseline does not apply to this entry.

  Fucose supplementation evidence. PMID:10877554 ("Fucose supplementation in leukocyte
  adhesion deficiency type II") is listed in references but carries no evidence item: its
  cached record has an empty Content section, so no exact quote is available. It is listed
  because the fucose-response question is central to this entry and a reader following it up
  should know the paper exists. The allele-dependence of that response is evidenced from
  PMID:12116250, which does have quotable text.


genetic:

- name: SLC35C1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SLC35C1
    term:
      id: hgnc:20197
      label: SLC35C1
  notes: >-
    The Golgi GDP-fucose transporter, formerly called FUCT1. Two mutation classes matter
    clinically and they are not equivalent: the founder alleles differ from one another in
    how they respond to fucose supplementation, and hypomorphic compound-heterozygous
    combinations can leave enough residual transport to spare the immune system.

    Transcript abundance is not the mechanism. In the Arab founder families the transporter
    mRNA level was comparable to controls, so the defect is in the protein's activity or
    localisation rather than in how much of it is made.
  evidence:
  - reference: PMID:11326279
    reference_title: "The gene defective in leukocyte adhesion deficiency II encodes a putative GDP-fucose transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, we have identified the first putative GDP-fucose transporter, which has been
      highly conserved throughout evolution. A point mutation in its gene is responsible
      for the disease in this patient with LAD II.
    explanation: >-
      The gene-disease assignment, from the cloning study that made it.
  - reference: PMID:12116250
    reference_title: "Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein (CDG) IIc founder effect and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amount of mRNA of the GDP-L-fucose transporter in cells from Arab patients and
      their parents are comparable to controls.
    explanation: >-
      Excludes reduced transcript abundance as the mechanism, which is why this entry
      curates the lesion as a functional transport failure.
  - reference: PMID:12116250
    reference_title: "Leukocyte adhesion deficiency (LAD) type II/carbohydrate deficient glycoprotein (CDG) IIc founder effect and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype/phenotype correlation studies show that the two different mutations are
      distinguished by differences in response to fucose supplementation and in the clinical
      phenotypes.
    explanation: >-
      The allele-specific treatment response, which is why fucose therapy is curated below
      as genotype-dependent rather than as a uniform option.


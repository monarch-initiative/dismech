experimental_models:
- name: CHO-gmt5 SLC35C1-knockout cell line
  experimental_model_type: CELL_LINE
  description: A Chinese hamster ovary line in which Slc35c1 was knocked out by zinc-finger nuclease
    on a background already lacking the CMP-sialic acid transporter, giving N-glycans deficient in
    both fucose and sialic acid. It was built to solve a specific problem - there was no suitable
    mutant line for structure-function work on the transporter - and it is the system in which the
    functional elements of SLC35C1 were mapped.
  publication: PMID:22492235
  modeled_mechanisms:
  - target: Impaired Golgi GDP-Fucose Import
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces the primary lesion - absent SLC35C1 function with consequent loss of
      glycan fucosylation - in a tractable system.
    limitations: 'A rodent ovary-derived cell line carrying a second engineered defect in the CMP-sialic
      acid transporter, so its glycans differ from a patient''s in more than one way. It models the
      transporter''s biochemistry, not the disease: there is no leukocyte, no endothelium, and therefore
      nothing about rolling, extravasation or neurodevelopment. The double defect was chosen partly
      for antibody-engineering utility rather than for disease fidelity.'
    readouts:
    - name: Aleuria aurantia lectin binding to cell-surface glycans
      target: Impaired Golgi GDP-Fucose Import
      direction: DECREASED
      interpretation: Lectin binding reports cell-surface fucosylation, so it is the functional readout
        of transport activity and was the basis for mapping which residues matter.
      evidence:
      - reference: PMID:22492235
        reference_title: Identification of functional elements of the GDP-fucose transporter SLC35C1
          using a novel Chinese hamster ovary mutant.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: we found that this impact can be independently contributed by a cluster of three
          lysine residues and a Glu-Met (EM) sequence within the C terminus
        explanation: Reports the structure-function mapping this readout produced.
    evidence:
    - reference: PMID:22492235
      reference_title: Identification of functional elements of the GDP-fucose transporter SLC35C1
        using a novel Chinese hamster ovary mutant.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Here we report a novel Chinese hamster ovary (CHO) mutant, CHO-gmt5, generated by
        the zinc-finger nuclease technology, in which the Slc35c1 gene was knocked out
      explanation: Establishes the model as an SLC35C1 knockout and therefore informative for the
        transport node.
animal_models:
- name: Slc35c1-deficient mouse
  species: Mouse
  genotype: Slc35c1 -/-
  publication: PMID:18541720
  description: A constitutive Slc35c1 knockout, made specifically because leukocyte trafficking cannot
    be studied in vivo in patients with a disease this rare. It covers the immune branch of the pathograph
    that the CHO cell line cannot reach - there are leukocytes, endothelium and an inflamed tissue
    to migrate into.
  modeled_mechanisms:
  - target: Failure of Leukocyte Rolling on Activated Endothelium
    relationship: RECAPITULATES
    fidelity: HIGH
    description: 'Reproduces the defining cellular lesion directly and in vivo: selectin-dependent
      rolling in cremaster venules is essentially abolished, with firm adhesion strongly but incompletely
      reduced downstream of it.'
    limitations: A constitutive whole-animal knockout rather than a patient missense allele, so it
      models complete loss rather than the partial transport that several patients have - and the
      partial-defect siblings curated in this entry show that distinction decides whether the immune
      phenotype appears at all.
    readouts:
    - name: Selectin-dependent leukocyte rolling in cremaster venules
      target: Failure of Leukocyte Rolling on Activated Endothelium
      direction: DECREASED
      interpretation: Intravital measurement of the rolling step itself, across all three selectins.
      evidence:
      - reference: PMID:18541720
        reference_title: Leukocyte trafficking in a mouse model for leukocyte adhesion deficiency
          II/congenital disorder of glycosylation IIc.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We found that E-, L-, and P-selectin-dependent leukocyte rolling in cremaster muscle
          venules was virtually absent. This was accompanied by a strong but not complete decrease
          in firm leukocyte adhesion.
        explanation: The rolling and adhesion measurements, with the qualification that adhesion
          is reduced rather than abolished.
    evidence:
    - reference: PMID:18541720
      reference_title: Leukocyte trafficking in a mouse model for leukocyte adhesion deficiency II/congenital
        disorder of glycosylation IIc.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Since the study of in vivo leukocyte trafficking in patients with LAD II is experimentally
        limited, we analyzed this process in mice deficient for Slc35c1.
      explanation: States why the model exists and that it is the Slc35c1 orthologue of this disease.
  - target: Impaired Neutrophil Extravasation to Infection Sites
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Neutrophil migration into an inflamed compartment is quantified, giving the extravasation
      node a measured value rather than an inference from rolling.
    limitations: Sterile chemical peritonitis is not bacterial infection at a mucosal surface, so
      it measures the trafficking defect rather than the clinical consequence.
    readouts:
    - name: Neutrophil migration to inflamed peritoneum
      target: Impaired Neutrophil Extravasation to Infection Sites
      direction: DECREASED
      interpretation: An 89% reduction quantifies how much of the extravasation response is lost.
      evidence:
      - reference: PMID:18541720
        reference_title: Leukocyte trafficking in a mouse model for leukocyte adhesion deficiency
          II/congenital disorder of glycosylation IIc.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Moreover, neutrophil migration to the inflamed peritoneum was strongly reduced by
          89%.
        explanation: The quantified extravasation defect.
    evidence:
    - reference: PMID:18541720
      reference_title: Leukocyte trafficking in a mouse model for leukocyte adhesion deficiency II/congenital
        disorder of glycosylation IIc.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Taken together, Slc35c1(-/-) mice show strongly defective leukocyte trafficking but
        normal lymphocyte homing to the spleen, which may explain normal lymphocyte functions in
        LAD II.
      explanation: The authors' summary, which also carries the compartment dissociation curated
        as a discussion below.
discussions:
- discussion_id: interpretation_lymphocyte_compartment_sparing
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - animal_models#Slc35c1-deficient mouse
  - pathophysiology#Loss of Sialyl-Lewis X Selectin Ligands
  prompt: Why is lymphocyte function preserved in LAD II when selectin ligands are absent from all
    leukocytes?
  rationale: 'A disease that removes selectin ligands globally should compromise lymphocyte homing
    as much as neutrophil trafficking, and yet lymphocyte function in patients is reported as surprisingly
    normal. The knockout mouse gives a mechanistic answer by splitting the compartments: homing to
    lymph nodes fell to 1-2% of normal while trafficking to the spleen was completely normal, and
    the humoral response failed in lymph nodes but not in spleen.

    The reason is anatomical rather than molecular. Lymph node entry runs through high endothelial
    venules and depends on the selectin-mediated rolling step this disease abolishes; splenic entry
    does not use that route. So the disease is not sparing lymphocytes - it is sparing one lymphoid
    compartment, and that compartment is sufficient for the humoral responses that get measured clinically.

    This is worth stating because it predicts where a lymphocyte defect should be detectable in patients
    if anyone looked for it in the right place.'
- discussion_id: gap_neurodevelopmental_substrates
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Growth Failure and Neurodevelopmental Impairment
  prompt: Which specific fucosylated glycoproteins or glycolipids, when hypofucosylated, produce
    the growth failure and intellectual disability of LAD II?
  rationale: 'The immune branch of this disease is mechanistically closed: the missing glycan is
    named, its receptor is named, and the cellular step it blocks is measurable. The neurodevelopmental
    branch has nothing equivalent. It is attributed to hypofucosylation of substrates needed for
    growth-factor signalling and neurodevelopment, but no particular substrate has been tied to the
    phenotype, which is why the node carries INDIRECT_UNKNOWN_INTERMEDIATES and PROVISIONAL confidence.

    This matters practically, not just descriptively. Oral fucose improved psychomotor capability
    in the index patient, so the branch is at least partly reversible - but without knowing the substrates
    there is no way to predict which patients'' neurological features will respond or to measure
    the response other than clinically.'
- discussion_id: interpretation_partial_defect_immune_sparing
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Leukocyte Rolling on Activated Endothelium
  - phenotypes#Persistent Leukocytosis
  prompt: How much residual GDP-fucose transport is enough to spare the immune phenotype, and why
    does the growth and neurodevelopmental branch appear more sensitive?
  rationale: 'The compound-heterozygous brothers had measurably impaired neutrophil rolling and marked
    changes in plasma glycoprotein glycoform distribution, yet no leukocytosis and no recurrent infection
    - only short stature and developmental delay. The authors call this a surprising degree of immune
    redundancy.

    Read against the pathograph, it says the two branches have different thresholds: enough residual
    fucosylation to keep the adhesion cascade functional was not enough to protect growth or neurodevelopment.
    That has a diagnostic consequence worth stating, since it means SLC35C1 disease can present to
    an endocrinologist or a developmental paediatrician with no immunological signal at all, and
    the leukocyte count - the feature the disease is named for - can be entirely normal.'
notes: 'GeneReviews. There is no GeneReviews chapter for SLC35C1 or leukocyte adhesion deficiency
  type II, so the GeneReviews baseline does not apply to this entry. Stated precisely, because an
  earlier version of this note claimed a search returned nothing at all: a PubMed genereviews[book]
  search on SLC35C1 does return one hit, PMID:20301507, but that is the multi-pathway overview
  "Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview", which is retired
  and flagged for historical reference only. It indexes SLC35C1 because this disease is also
  SLC35C1-CDG, but it is neither current nor specific to the disease, so it is not cited here.

  Fucose supplementation evidence. PMID:10877554 ("Fucose supplementation in leukocyte adhesion deficiency
  type II") is listed in references but carries no evidence item: its cached record has an empty
  Content section, so no exact quote is available. It is listed because the fucose-response question
  is central to this entry and a reader following it up should know the paper exists. The allele-dependence
  of that response is evidenced from PMID:12116250, which does have quotable text.'

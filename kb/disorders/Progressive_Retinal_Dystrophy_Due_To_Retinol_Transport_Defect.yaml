name: Progressive_Retinal_Dystrophy_Due_To_Retinol_Transport_Defect
category: Disease
creation_date: "2026-09-01T22:40:00Z"
description: >-
  An autosomal recessive inherited retinal degeneration caused by biallelic
  loss-of-function variants in RBP4, the gene encoding serum retinol-binding
  protein 4. RBP4 is the specific plasma carrier that mobilises all-trans-retinol
  out of hepatic stores and delivers it to peripheral tissues. Without it the
  liver's vitamin A stores stay full while the circulation is empty, so the
  retina is starved of the chromophore precursor it needs to regenerate visual
  pigment. The result is a systemic vitamin A deficiency with a retina-dominant
  phenotype - childhood night blindness, then progressive rod-cone and retinal
  pigment epithelial degeneration - accompanied by severe comedogenic acne and,
  in some patients, iris and chorioretinal coloboma.

  What separates this from ordinary dietary vitamin A deficiency is a
  biochemical signature rather than a clinical one: serum RBP4 is undetectable,
  serum retinol is about one sixth of normal, retinyl esters and transthyretin
  are normal, and serum retinol fails to rise when vitamin A is given by mouth,
  because the carrier needed to mobilise it does not exist.
disease_term:
  preferred_term: progressive retinal dystrophy due to retinol transport defect
  term:
    id: MONDO:0014060
    label: progressive retinal dystrophy due to retinol transport defect

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported pedigrees are consanguineous or compound heterozygous, and the
    mode of inheritance tracks the variant class: recessive, largely truncating
    alleles give retinal degeneration, which is this entry. Dominant, almost
    exclusively missense RBP4 alleles give a different phenotype - ocular
    malformation of the microphthalmia-anophthalmia-coloboma spectrum - and are
    not curated here.
  evidence:
  - reference: PMID:37586836
    reference_title: Clinical, genetic and biochemical signatures of RBP4-related ocular malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dominantly inherited, almost exclusively missense, associated with ocular
      malformations, in contrast to recessive, mainly truncating, associated
      with retinal degeneration
    explanation: >-
      States the genotype-to-inheritance-to-phenotype split directly, and is the
      reason this entry is scoped to the recessive retinal-degeneration arm.
  - reference: PMID:23189188
    reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This change segregated with early onset, progressive, and severe autosomal
      recessive retinitis pigmentosa (arRP) in an eight member consanguineous
      pedigree of European ancestry.
    explanation: >-
      Segregation in an eight-member consanguineous pedigree establishes the
      recessive mode for the degenerative phenotype.

genetic:
- name: RBP4
  gene_term:
    preferred_term: RBP4
    term:
      id: hgnc:9922
      label: RBP4
  relationship_type: CAUSATIVE
  notes: >-
    Reported recessive alleles span splice-site (c.111+1G>A, c.248+1G>A),
    nonsense (c.67C>T) and destabilising missense (Ile41Asn, Gly75Asp)
    variants. What unites them is the biochemical outcome rather than the
    variant class: serum RBP4 is undetectable in every reported patient, so the
    mechanism is absence of the carrier rather than a defective transport
    complex.
  evidence:
  - reference: PMID:23189188
    reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified a novel homozygous splice site variant
      (c.111+1G>A) in the gene encoding retinol binding protein 4 (RBP4).
    explanation: Identifies the causal gene and a splice-site allele.
  - reference: PMID:27892788
    reference_title: "Vitamin A deficiency due to bi-allelic mutation of RBP4: There's more to it than meets the eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic mutations in RBP4 were identified (c.248+1G>A), consistent with
      a diagnosis of inherited vitamin A deficiency.
    explanation: Independent pedigree with a second biallelic splice-site allele.
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To describe the phenotype caused by a retinol deficiency in a family with
      compound heterozygous missense mutations (Ile41Asn and Gly75Asp) in the
      gene for serum retinol binding protein (RBP).
    explanation: >-
      The founding family, and the reason destabilising missense alleles are
      included in the recessive spectrum rather than only truncating ones.

pathophysiology:
- name: Biallelic RBP4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Splice-site, nonsense or destabilising missense variants on both RBP4
    alleles. The shared consequence is a null protein outcome rather than a
    partially functional carrier.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  downstream:
  - target: Absent Circulating Retinol-Binding Protein 4
    causal_link_type: DIRECT
    description: >-
      Message or protein instability leaves no secreted carrier in plasma.
    evidence:
    - reference: PMID:23189188
      reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both patients had undetectable levels of RBP4 in the serum suggesting
        that this mutation led to either mRNA or protein instability resulting
        in a null phenotype.
      explanation: >-
        Directly links the genotype to absence of circulating protein, and names
        the null mechanism.
  evidence:
  - reference: PMID:32323592
    reference_title: A novel homozygous c.67C>T variant in retinol binding protein 4 (RBP4) associated with retinitis pigmentosa and childhood acne vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous mutations in the RBP4 gene lead to severe retinitis pigmentosa
      that is phenotypically indistinguishable from retinitis pigmentosa caused
      by other recessive mutations.
    explanation: >-
      Establishes biallelic RBP4 loss as a cause of the retinal phenotype, and
      notes that the fundus appearance alone does not identify it.

- name: Absent Circulating Retinol-Binding Protein 4
  biological_scale: MOLECULAR
  description: >-
    Serum RBP4 is below detection threshold in every reported patient. This is
    the node the entry's diagnostic signature reads out directly.
  biological_processes:
  - preferred_term: retinol transport
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0034633
      label: retinol transport
  downstream:
  - target: Failure to Mobilise Hepatic Retinol into Plasma
    causal_link_type: DIRECT
    description: >-
      RBP4 is the specific carrier for retinol in blood, so its absence removes
      the only route out of the hepatic store.
    evidence:
    - reference: PMID:26974396
      reference_title: Severe ocular phenotypes in Rbp4-deficient mice in the C57BL/6 genetic background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results suggest that RBP4 is critical for the mobilization of
        retinol from hepatic storage pools, and that such mobilization is
        necessary for ocular development and visual function.
      explanation: >-
        The authors' own conclusion that mobilisation, not synthesis or storage,
        is the step RBP4 carries.
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: RBP was below detection threshold, and retinyl esters were normal.
    explanation: >-
      Records the defining pair - no carrier, intact ester stores - in the
      founding family.

- name: Failure to Mobilise Hepatic Retinol into Plasma
  biological_scale: ORGANISM
  description: >-
    Retinol accumulates in the liver while serum retinol falls. The inverse
    relation is the point: this is a distribution failure, not a deficiency of
    vitamin A itself, which is what separates it from dietary deficiency.
  downstream:
  - target: Systemic Retinol Deprivation with Intact Hepatic Stores
    causal_link_type: DIRECT
    description: >-
      Circulating retinol falls to roughly one sixth of the normal range.
    evidence:
    - reference: PMID:9888420
      reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All-trans retinol levels were 0.19 microM and 0.18 microM (normal range,
        0.7-1.5 microM) for BR and MR, respectively, and did not increase in a
        dose-response test.
      explanation: >-
        Quantifies the deficit and, in the same sentence, shows it cannot be
        corrected by oral loading.
  evidence:
  - reference: PMID:26974396
    reference_title: Severe ocular phenotypes in Rbp4-deficient mice in the C57BL/6 genetic background.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our Rbp4-deficient mice accumulated retinol in the liver but it was
      undetectable in the serum, indicating an inverse relation between serum
      and liver retinol levels.
    explanation: >-
      Demonstrates the retained-store / empty-circulation dissociation in a
      controlled model, which human sampling cannot show directly.

- name: Systemic Retinol Deprivation with Intact Hepatic Stores
  biological_scale: ORGANISM
  description: >-
    A whole-organism retinoid shortage in the face of normal intake and normal
    liver reserves. Tissues that depend on delivered retinol are affected; the
    retina most severely.
  biological_processes:
  - preferred_term: retinoid metabolic process
    modifier: DECREASED
    term:
      id: GO:0001523
      label: retinoid metabolic process
  downstream:
  - target: Chromophore Substrate Deprivation at the Retinal Pigment Epithelium
    causal_link_type: DIRECT
    description: >-
      The retinal pigment epithelium depends on delivered retinol as the
      substrate for the visual cycle.
    evidence:
    - reference: PMID:32323592
      reference_title: A novel homozygous c.67C>T variant in retinol binding protein 4 (RBP4) associated with retinitis pigmentosa and childhood acne vulgaris.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The retinol binding protein 4 (RBP4) is essential in delivering retinol
        to the retinal pigment epithelium and normal functioning of the visual
        cycle.
      explanation: >-
        Names the delivery step and the compartment that fails when it is lost.
  - target: Reduced Retinoid Tone in Skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe childhood-onset acne segregates with the RBP4 genotype. The
      intermediate steps between low systemic retinoid delivery and follicular
      keratinisation are not established in these patients, so the edge is typed
      as having unknown intermediates rather than asserted as direct.
    evidence:
    - reference: PMID:32323592
      reference_title: A novel homozygous c.67C>T variant in retinol binding protein 4 (RBP4) associated with retinitis pigmentosa and childhood acne vulgaris.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patient's affected brother, positive for the same homozygous variant,
        also had a history of severe acne vulgaris whereas the unaffected
        brother did not, confirming that mutations in RBP4 segregated with the
        acne vulgaris phenotype in this family.
      explanation: >-
        Within-family segregation ties the skin phenotype to the genotype.
        Graded INDIRECT because co-segregation establishes that the lesion
        causes the phenotype without showing the retinoid step that mediates it.
  evidence:
  - reference: PMID:27892788
    reference_title: "Vitamin A deficiency due to bi-allelic mutation of RBP4: There's more to it than meets the eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic mutations in RBP4 were identified (c.248+1G>A), consistent with
      a diagnosis of inherited vitamin A deficiency.
    explanation: >-
      Frames the disorder as an inherited vitamin A deficiency, which is the
      claim this node carries.

- name: Chromophore Substrate Deprivation at the Retinal Pigment Epithelium
  biological_scale: TISSUE
  description: >-
    With no ligand arriving, the retinal pigment epithelium cannot supply
    11-cis-retinal to photoreceptors. The uptake machinery at the blood-retina
    barrier is intact in this disease; it simply has nothing to take up.
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  downstream:
  - target: Impaired Rhodopsin Regeneration in Rod Photoreceptors
    causal_link_type: DIRECT
    description: >-
      Rods are the most retinoid-dependent photoreceptor, so chromophore
      shortage reaches them first.
    evidence:
    - reference: PMID:24852372
      reference_title: STRA6 is critical for cellular vitamin A uptake and homeostasis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Vitamin A must be adequately distributed within the body to maintain the
        functions of retinoids in the periphery and chromophore production in
        the eyes.
      explanation: >-
        States the dependency this edge asserts - ocular chromophore production
        requires adequate systemic distribution. Graded INDIRECT because it is a
        general statement of the dependency rather than a measurement made in
        RBP4 deficiency.
  evidence:
  - reference: PMID:24852372
    reference_title: STRA6 is critical for cellular vitamin A uptake and homeostasis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This receptor, identified as the Stimulated by retinoic acid gene 6
      (Stra6) gene product, is highly expressed in epithelia that constitute
      blood-tissue barriers.
    explanation: >-
      Establishes that retinol entry into the retinal pigment epithelium is
      receptor-mediated at a blood-tissue barrier, which is what makes the
      ligand shortage in this disease bite at this compartment. Graded INDIRECT
      because the study characterises the receptor, not RBP4 deficiency.

- name: Impaired Rhodopsin Regeneration in Rod Photoreceptors
  biological_scale: CELLULAR
  description: >-
    Without 11-cis-retinal, rod visual pigment cannot be regenerated after
    bleaching. This is the step that produces the disease's first and most
    characteristic symptom, and it is functional before it is degenerative -
    dark-adaptation thresholds rise while photoreceptors are still present.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: visual perception
    modifier: DECREASED
    term:
      id: GO:0007601
      label: visual perception
  downstream:
  - target: Nyctalopia
    causal_link_type: DIRECT
    description: >-
      Failure of rod pigment regeneration presents as night blindness from early
      childhood.
    evidence:
    - reference: PMID:9888420
      reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dark adaptation thresholds were elevated. In the scotopic ERG, only
        reduced mixed responses were recordable.
      explanation: >-
        Elevated dark-adaptation thresholds with reduced scotopic responses is
        the functional signature of impaired rod pigment regeneration.
  - target: Progressive Photoreceptor and Retinal Pigment Epithelial Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained chromophore starvation is followed by structural loss. The steps
      between chronic functional deprivation and cell death are not established
      in this disease, so the edge is typed as having unknown intermediates.
    evidence:
    - reference: PMID:41829974
      reference_title: "The Liver-Eye Axis of Dietary Vitamin A Homeostasis: A Review of Mechanisms, Receptors, and Visual Outcomes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Tight regulation of retinoid delivery to peripheral tissues is crucial
        for metabolic function and photoreceptor integrity.
      explanation: >-
        Links delivery to structural integrity rather than to function alone.
        Graded INDIRECT because it is a review's framing statement, and OTHER
        because the source is a review rather than a primary study.
  evidence:
  - reference: PMID:32323592
    reference_title: A novel homozygous c.67C>T variant in retinol binding protein 4 (RBP4) associated with retinitis pigmentosa and childhood acne vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 49-year old Caucasian man with a family history of retinitis pigmentosa,
      presented with low vision and night blindness from early childhood.
    explanation: >-
      Night blindness from early childhood is the presenting complaint this node
      predicts.

- name: Progressive Photoreceptor and Retinal Pigment Epithelial Degeneration
  biological_scale: TISSUE
  description: >-
    Structural loss follows the functional deficit: retinal pigment epithelial
    atrophy, photoreceptor layer loss and peripheral choroidal loss, producing a
    fundus indistinguishable from other recessive retinitis pigmentosa. The
    historical name for the appearance is "fundus xerophthalmicus".
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: photoreceptor cell maintenance
    modifier: DECREASED
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
  downstream:
  - target: Retinal dystrophy
    causal_link_type: DIRECT
    description: >-
      Progressive degeneration of photoreceptors and retinal pigment epithelium
      is the clinical retinal dystrophy.
    evidence:
    - reference: PMID:9888420
      reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both patients showed a typical "fundus xerophthalmicus," featuring a
        progressed atrophy of the retinal pigment epithelium.
      explanation: >-
        Records the structural endpoint at the retinal pigment epithelium in the
        founding family.
  evidence:
  - reference: PMID:23189188
    reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retinitis Pigmentosa (RP) is a common form of retinal degeneration
      characterized by photoreceptor degeneration and retinal pigment epithelium
      (RPE) atrophy causing loss of visual field and acuities.
    explanation: >-
      Defines the two-compartment degeneration this node carries.

- name: Reduced Retinoid Tone in Skin
  biological_scale: TISSUE
  description: >-
    Severe comedogenic acne from childhood, segregating with the genotype within
    families. It is curated as its own node because it is the one extraocular
    feature reproducibly tied to the genotype, and because it is what most often
    brings the systemic nature of the disorder to attention.
  downstream:
  - target: Acne
    causal_link_type: DIRECT
    description: >-
      Reduced retinoid signalling in skin presents as severe childhood-onset
      acne vulgaris.
    evidence:
    - reference: PMID:23189188
      reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The second patient developed acne from young age and extending into the
        5(th) decade.
      explanation: >-
        Documents the onset and persistence of the skin phenotype.
  evidence:
  - reference: PMID:23189188
    reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of developmental abnormalities and severe acne in patients
      with retinal degeneration may indicate the involvement of genes that
      regulate vitamin A absorption, transport and metabolism.
    explanation: >-
      The authors' own reading of the skin phenotype as a marker of disturbed
      vitamin A handling.


biochemical:
- name: Serum retinol-binding protein 4
  notes: >-
    Decreased - undetectable rather than merely low. This is the single most discriminating
    laboratory finding, and it is what separates the disorder from dietary
    vitamin A deficiency, where RBP4 is present.
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: RBP was below detection threshold, and retinyl esters were normal.
    explanation: Records both the absent carrier and the intact ester pool in one sentence.
- name: Serum all-trans-retinol
  notes: >-
    Decreased to roughly one sixth of the normal range, and - critically - it does not rise
    on oral vitamin A loading, because the carrier required to mobilise hepatic
    stores is absent.
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All-trans retinol levels were 0.19 microM and 0.18 microM (normal range,
      0.7-1.5 microM) for BR and MR, respectively, and did not increase in a
      dose-response test.
    explanation: >-
      Gives the measured deficit against a stated reference range, and the
      non-response that is diagnostically decisive.
- name: Serum retinyl esters and transthyretin
  notes: >-
    Both normal. Recorded as a normal result because their normality is
    informative: it localises the lesion to the carrier rather than to intake,
    storage, or the stabilising partner.
  evidence:
  - reference: PMID:23189188
    reference_title: Exome analysis identified a novel mutation in the RBP4 gene in a consanguineous pedigree with retinal dystrophy and developmental abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Circulating transthyretin levels were normal.
    explanation: Excludes a transthyretin-side defect in the transport complex.

animal_models:
- name: Rbp4-deficient mouse on the C57BL/6 background
  species: Mouse
  genotype: Rbp4 knockout, C57BL/6 genetic background
  publication: PMID:26974396
  description: >-
    The strain that made the model informative. Rbp4-null mice on a mixed
    129xC57BL/6J background have only a transient b-wave deficit that recovers
    by 24 weeks; moving the same null onto pure C57BL/6 produced a severe,
    non-recovering phenotype. Background choice, not the null itself, is what
    separates a model that recapitulates the human disease from one that
    appears to outgrow it.
  modeled_mechanisms:
  - target: Failure to Mobilise Hepatic Retinol into Plasma
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the defining biochemical dissociation - hepatic retinol
      retained, serum retinol undetectable.
    limitations: >-
      Mice were maintained on a vitamin A-sufficient diet, so the model speaks
      to transport failure under adequate intake and not to how the disorder
      behaves when dietary supply is also limited.
    readouts:
    - name: Serum versus hepatic retinol
      target: Failure to Mobilise Hepatic Retinol into Plasma
      direction: DECREASED
      interpretation: >-
        Serum retinol undetectable while liver retinol accumulates, establishing
        the direction of the block as export rather than uptake or storage.
      evidence:
      - reference: PMID:26974396
        reference_title: Severe ocular phenotypes in Rbp4-deficient mice in the C57BL/6 genetic background.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our Rbp4-deficient mice accumulated retinol in the liver but it was
          undetectable in the serum, indicating an inverse relation between
          serum and liver retinol levels.
        explanation: Reports the paired measurement behind this readout.
    evidence:
    - reference: PMID:26974396
      reference_title: Severe ocular phenotypes in Rbp4-deficient mice in the C57BL/6 genetic background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results suggest that RBP4 is critical for the mobilization of
        retinol from hepatic storage pools, and that such mobilization is
        necessary for ocular development and visual function.
      explanation: Supports treating this model as informative for the mobilisation node.
  - target: Progressive Photoreceptor and Retinal Pigment Epithelial Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces structural loss of the photoreceptor layer and peripheral
      choroid, persisting to 40 weeks.
    limitations: >-
      The mouse phenotype includes developmental abnormalities - retinal
      depigmentation, optic disc abnormality and a persistent hyaloid artery -
      that are not features of the human recessive disorder, so the model runs
      ahead of the human phenotype on the developmental axis while matching it
      on the degenerative one.
    readouts:
    - name: Peripheral choroid and photoreceptor layer
      target: Progressive Photoreceptor and Retinal Pigment Epithelial Degeneration
      direction: DECREASED
      interpretation: >-
        Structural correlate of the degeneration node, present on the C57BL/6
        background and absent on the mixed background.
      evidence:
      - reference: PMID:26974396
        reference_title: Severe ocular phenotypes in Rbp4-deficient mice in the C57BL/6 genetic background.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          loss of the peripheral choroid and photoreceptor layer in the
          peripheral retinas
        explanation: The histological measurement behind this readout.
    evidence:
    - reference: PMID:26974396
      reference_title: Severe ocular phenotypes in Rbp4-deficient mice in the C57BL/6 genetic background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        All these abnormalities had not recovered even at 40 weeks of age.
      explanation: >-
        Persistence to 40 weeks is what makes this strain a model of progressive
        degeneration rather than of transient developmental delay.

diagnosis:
- name: Serum retinol-binding protein, retinol and retinyl ester panel
  diagnosis_term:
    preferred_term: retinoid transport laboratory panel
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    The pattern, not any single value, makes the diagnosis: undetectable RBP4,
    markedly low retinol, normal retinyl esters, normal transthyretin.
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both affected siblings had no detectable serum RBP, one sixth of normal
      retinol levels, and normal retinyl esters.
    explanation: States the three-part signature as a single finding.
- name: Oral vitamin A dose-response test
  diagnosis_term:
    preferred_term: oral vitamin A loading test
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Ordered to separate this disorder from dietary vitamin A deficiency. In
    dietary deficiency serum retinol rises on loading; here it does not, because
    the carrier needed to mobilise hepatic stores is absent. A negative result
    is the informative one.
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: did not increase in a dose-response test
    explanation: The non-response that gives the test its discriminating value.
- name: RBP4 molecular genetic testing
  diagnosis_term:
    preferred_term: RBP4 sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Confirms the diagnosis and, because variant class tracks with phenotype and
    inheritance mode, also predicts which arm of the RBP4 spectrum the family is
    in.
  evidence:
  - reference: PMID:32323592
    reference_title: A novel homozygous c.67C>T variant in retinol binding protein 4 (RBP4) associated with retinitis pigmentosa and childhood acne vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next generation sequencing analysis revealed a novel homozygous RBP4 c.67
      C > T variant.
    explanation: Molecular confirmation in a clinically diagnosed patient.

treatments:
- name: High-Dose Vitamin A Supplementation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Empirical, and the evidence for it is genuinely mixed rather than merely
    thin. The rationale is mass action: enough retinol in the gut may reach
    tissues by carrier-independent routes even with no RBP4. Against that sits
    the founding family's dose-response test, in which serum retinol did not
    rise at all on oral loading - the single most direct human measurement of
    whether this strategy raises circulating substrate, and it was negative.
    The supporting rescue result comes from Stra6-null mice, which model the
    receptor at the far side of the same axis, not RBP4 deficiency itself.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: all-trans-retinol
      term:
        id: CHEBI:17336
        label: all-trans-retinol
  target_mechanisms:
  - target: Systemic Retinol Deprivation with Intact Hepatic Stores
    treatment_effect: BYPASSES
    description: >-
      Pharmacological dosing aims to raise tissue retinoid delivery without
      restoring the missing carrier, so it bypasses the lesion rather than
      correcting it.
    evidence:
    - reference: PMID:24852372
      reference_title: STRA6 is critical for cellular vitamin A uptake and homeostasis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Notably, treatment with pharmacological doses of vitamin A restored
        vitamin A transport across these barriers and rescued the vision of
        Stra6(-/-) mice.
      explanation: >-
        The strongest translational result available, and it is about the wrong
        gene. Graded INDIRECT because Stra6-null mice lack the uptake receptor
        while these patients lack the plasma carrier - the same axis, a
        different lesion, and rescue of one does not establish rescue of the
        other.
    - reference: PMID:9888420
      reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All-trans retinol levels were 0.19 microM and 0.18 microM (normal range,
        0.7-1.5 microM) for BR and MR, respectively, and did not increase in a
        dose-response test.
      explanation: >-
        Graded REFUTE against the claim that oral vitamin A raises circulating
        retinol in this disorder: it was measured in affected patients and did
        not.
  evidence:
  - reference: PMID:24852372
    reference_title: STRA6 is critical for cellular vitamin A uptake and homeostasis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      under conditions mimicking vitamin A excess and deficiency, our analyses
      revealed that STRA6-mediated vitamin A uptake is a regulated process
      mandatory for ocular vitamin A uptake when RBP4 constitutes the only
      transport mode in vitamin A deficiency
    explanation: >-
      Describes the uptake step this treatment depends on. Graded INDIRECT for
      the same reason as above - the experiment characterises STRA6, not RBP4
      deficiency.

- name: Low Vision Support and Ophthalmological Surveillance
  therapeutic_modality: BEHAVIORAL
  description: >-
    Supportive care for a progressive rod-cone dystrophy. No disease-modifying
    therapy exists, so serial functional assessment - dark adaptometry,
    electroretinography, acuity and fields - is what management consists of.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two affected sisters, 17 (BR) and 13 (MR) years old, were examined
      clinically and with perimetry, color vision tests, dark adaptometry, rod-
      and cone-isolated electroretinograms (ERGs), multifocal ERGs,
      electrooculograms (EOGs), and laboratory tests.
    explanation: >-
      Enumerates the functional assessments that constitute surveillance in this
      disorder.

differential_diagnoses:
- name: Dietary vitamin A deficiency
  description: >-
    The phenocopy that matters, and the reason the biochemical panel is ordered
    the way it is. Acquired hypovitaminosis A produces overlapping retinal
    dysfunction - impaired scotopic responses, constricted fields - but it is
    corrected by supplementation, features prominent xerophthalmia, and leaves
    RBP4 present and retinyl esters low. The inherited transport defect inverts
    all three: RBP4 undetectable, retinyl esters normal, and no response to oral
    loading. Notably the founding patients had no xerophthalmia at all, which
    the authors attributed to normal retinol in tear fluid.
  evidence:
  - reference: PMID:9888420
    reference_title: Phenotype in retinol deficiency due to a hereditary defect in retinol binding protein synthesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The normal retinol levels in the tear fluid explain the lack of
      xerophthalmia.
    explanation: >-
      Explains the absence of the one sign that would be expected in dietary
      deficiency, which is the clinical half of the discriminator.
  - reference: PMID:17646742
    reference_title: "[The eye and anorexia nervosa. A case report]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ophthalmologic findings were keratoconjunctival xerosis with bilateral
      corneal ulcerations. The visual field showed a concentric bilateral
      restriction of isopters with tubular central vision, a similar aspect to
      retinitis pigmentosa.
    explanation: >-
      A worked case of the acquired phenocopy. It shows both halves of the
      comparison at once - a field defect that mimics retinitis pigmentosa, and
      the corneal xerosis that inherited transport failure does not produce.
  - reference: PMID:17646742
    reference_title: "[The eye and anorexia nervosa. A case report]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corneoconjunctival improvement was obtained with vitamin supplementation,
      but no campimetric improvement was observed.
    explanation: >-
      The response to supplementation is the decisive discriminator: in dietary
      deficiency the ocular surface recovers on vitamin A, whereas in RBP4
      deficiency serum retinol does not even rise. Worth noting that the retinal
      field defect did not recover here either, which is why the distinction
      rests on the biochemistry rather than on treatment response alone.

discussions:
- discussion_id: oral_vitamin_a_efficacy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#High-Dose Vitamin A Supplementation
  prompt: >-
    Does pharmacological oral vitamin A improve retinal function in RBP4
    deficiency, given that serum retinol does not rise on loading?
  rationale: >-
    The two pieces of evidence point opposite ways and neither is decisive. The
    rescue was obtained in Stra6-null mice, where the plasma carrier is intact
    and only uptake fails - the reverse of this disorder. The human measurement
    was made in RBP4-deficient patients and showed no rise in serum retinol at
    all. So the question is whether tissue delivery can improve without a
    measurable change in the circulating pool, by carrier-independent routes
    such as chylomicron-borne retinyl esters. The founding paper independently
    proposed exactly such an alternative source to explain why these patients
    are not more severely affected systemically.
  proposed_experiments:
  - experiment_id: rbp4_null_vitamin_a_ocular_readout
    name: Vitamin A loading in an Rbp4-null model with ocular functional readout
    description: >-
      Dose Rbp4-null C57BL/6 mice with pharmacological vitamin A and measure
      electroretinographic response and ocular retinoid content, rather than
      serum retinol alone. This tests delivery at the organ that matters in the
      genotype that matches the human disease.
    would_support:
    - pathophysiology#Chromophore Substrate Deprivation at the Retinal Pigment Epithelium
    supporting_outcome:
    - >-
      Recovery of a- and b-wave amplitudes and measurable ocular retinoid
      content despite unchanged serum retinol.
    refuting_outcome:
    - >-
      No change in ocular retinoid content or electroretinographic response at
      tolerated doses.

- discussion_id: recessive_versus_dominant_arm
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#RBP4
  prompt: >-
    Why do recessive truncating RBP4 alleles cause retinal degeneration while
    dominant missense alleles cause ocular malformation?
  rationale: >-
    A single gene producing two phenotypes that differ in inheritance mode,
    variant class and developmental timing is unusual enough to need an
    explanation. The proposed mechanism is dominant-negative action of missense
    alleles on retinoic-acid signalling during eye morphogenesis, with a
    maternal-effect component from maternal RBP4 status in pregnancy. That would
    make the malformation arm a developmental disorder of retinoic-acid supply
    and this entry's arm a postnatal disorder of chromophore supply, from
    lesions in the same protein. The two arms are not curated as one disease
    here for that reason.
  evidence:
  - reference: PMID:37586836
    reference_title: Clinical, genetic and biochemical signatures of RBP4-related ocular malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The retinoic acid (RA) pathway plays a crucial role in both eye
      morphogenesis and the visual cycle.
    explanation: >-
      Names the dual role that makes one gene capable of both a developmental
      and a degenerative phenotype.

notes: >-
  Scope. This entry is the recessive, retinal-degeneration arm of the RBP4
  spectrum. Dominant missense RBP4 alleles cause the
  microphthalmia-anophthalmia-coloboma spectrum with skewed maternal
  inheritance and are a different clinical entity;
  they are recorded in the discussion rather than curated as a subtype, because
  they differ in inheritance mode, variant class, developmental timing and
  proposed mechanism.

  Evidence discipline worth flagging for the next curator. The most quotable
  therapeutic result in this literature - pharmacological vitamin A rescuing
  vision - was obtained in Stra6-null mice. STRA6 is the uptake receptor on the
  far side of the same vitamin A axis; these patients lack the plasma carrier
  instead. Rescuing a model that has a carrier but no receptor does not
  establish rescue in a disease that has a receptor but no carrier, so every use
  of PMID:24852372 in this entry is graded INDIRECT, and the human dose-response
  failure is curated as a REFUTE item on the same treatment link rather than
  omitted. The same reasoning excludes the Rbpr2-null mouse from
  animal_models: it is a third gene in the axis, informative about the axis and
  not about this disease. Its reference cache is deliberately not shipped
  either, because an uncited cache belongs to no entry.

  Deliberately not curated. No prevalence record: the literature is a handful of
  consanguineous pedigrees and no population rate has been published, and
  ORPHA has no code that maps cleanly to the recessive arm alone. No datasets.
  No CHEBI binding for retinyl esters on the biochemical record, because the
  claim there is that a class of compounds was normal rather than a measurement
  of one species. PMID:34440435 (Leber congenital amaurosis genotype-phenotype)
  was returned by the research run as background framing for visual-cycle gene
  therapy. It is named here only to record that it was read and set aside: it
  does not mention RBP4, no evidence item cites it, and its cache is
  deliberately not shipped.

  Term corrections made against the research report. The report proposed
  HP:0031287 for acne; that identifier is Seborrheic keratosis, and the correct
  term is HP:0001061. It also transposed two retinol identifiers, calling
  CHEBI:17336 "retinol / vitamin A" and CHEBI:50211 "all-trans-retinol", when
  CHEBI:17336 is all-trans-retinol and CHEBI:50211 is retinol; the entry binds
  CHEBI:17336 for the supplement. Both were caught by checking each identifier
  against the ontology rather than against the report's own naming, and neither
  would have been caught by the report's confabulation rate, which was 0.0.

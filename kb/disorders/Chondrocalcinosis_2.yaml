name: Chondrocalcinosis 2
creation_date: "2026-10-13T00:00:00Z"
category: Mendelian
description: >-
  Chondrocalcinosis 2 (CCAL2; familial calcium pyrophosphate dihydrate crystal
  deposition disease, OMIM 118600) is an autosomal dominant disorder caused by
  heterozygous variants in ANKH, the gene encoding the multipass transmembrane
  protein ANK that exports intracellular inorganic pyrophosphate (PPi) into the
  extracellular matrix. The disease-causing variants cluster at the amino
  terminus (P5L, P5T, P5S, M48T, and a 5'-UTR change creating an upstream start
  codon) with one carboxy-terminal codon deletion (E490del), and they behave as
  gain-of-function alleles: they raise extracellular PPi in chondrocyte culture
  and rescue, rather than phenocopy, the Ank-null mouse. Excess extracellular
  PPi in articular cartilage precipitates with calcium as calcium pyrophosphate
  dihydrate (CPPD) crystals in hyaline cartilage and fibrocartilage. The
  deposits are seen radiographically as chondrocalcinosis, typically from the
  third or fourth decade and usually in many joints, and clinically they drive
  two patterns of arthritis: recurrent acute CPP crystal arthritis (pseudogout),
  in which crystals activate the NLRP3 inflammasome and an IL-1-beta-dependent
  neutrophilic synovitis, and a chronic degenerative, osteoarthritis-like
  arthropathy. Involvement of intervertebral discs and entheses has been
  described in familial cases.

  Scope. This entry covers the ANKH-driven familial disease only. Sporadic,
  age-associated CPPD disease, chondrocalcinosis secondary to haemochromatosis,
  hyperparathyroidism, hypomagnesaemia or hypophosphatasia, and the CCAL1 form
  (chromosome 8q, TNFRSF11B) are different entities and are not curated here.
  The allelic ANKH disorder craniometaphyseal dysplasia, in which ANKH variants
  abolish pyrophosphate transport and the phenotype is a sclerosing bone
  dysplasia without joint crystals, is curated separately in
  Craniometaphyseal_Dysplasia.
synonyms:
- familial calcium pyrophosphate dihydrate crystal deposition disease
- familial calcium pyrophosphate deposition disease
- familial CPPD
- familial chondrocalcinosis
- familial articular chondrocalcinosis
- CCAL2
- chondrocalcinosis type 2

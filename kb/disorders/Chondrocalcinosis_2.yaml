pathophysiology:
- name: ANKH Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Heterozygous amino-terminal (or, for E490del,
    carboxy-terminal) ANKH variants increase the activity or abundance of the
    ANK pyrophosphate exporter rather than removing it: in a cellular PPi assay
    all three original human variants were more active than the mouse ank
    nonsense allele, and in a direct oocyte transport assay the chondrocalcinosis
    mutants retain wild-type transport and rescue the Ank-null joint phenotype,
    which the loss-of-function CMD mutants cannot do.
  genetic_context:
    gene:
      preferred_term: ANKH
      term:
        id: hgnc:15492
        label: ANKH
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      The category is set from the cellular PPi and mouse-rescue data; see the
      CONTROVERSY discussion for the published dissent.
  genes:
  - preferred_term: ANKH
    term:
      id: hgnc:15492
      label: ANKH
  molecular_functions:
  - preferred_term: ANK inorganic pyrophosphate transmembrane exporter activity
    term:
      id: GO:0022857
      label: transmembrane transporter activity
    modifier: INCREASED
    description: >-
      GO has no live molecular-function term for inorganic pyrophosphate
      (diphosphate) transmembrane transport. GO:0030504 "inorganic diphosphate
      transmembrane transporter activity" exists but is obsolete, and OLS
      records GO:0022857 as its replacement. OLS searches of GO for "inorganic
      diphosphate transmembrane transporter activity", "pyrophosphate
      transmembrane transporter" and "diphosphate transport" return only the
      thiamine- and isopentenyl-pyrophosphate transporter activities, the
      diphosphate-hydrolysis-driven proton transporter (GO:0009678) and the
      biological process GO:0030505, which is bound on the export node. The
      parent transporter activity is bound instead. GO:0005347 ATP
      transmembrane transporter activity, annotated to ANKH from the ATP-efflux
      model, is deliberately not bound here because the functional assays the
      node cites measure pyrophosphate, not ATP, transport.
  evidence:
  - reference: PMID:12297987
    reference_title: "Mutations in ANKH cause chondrocalcinosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All three of the human mutations showed significantly more activity than a previously described nonsense mutation that causes severe hydroxyapatite mineral deposition and widespread joint ankylosis in mice."
    explanation: The reconstructed human variants are more active, not less, in the cellular pyrophosphate assay.
  - reference: PMID:15474385
    reference_title: "The ANKH gene and familial calcium pyrophosphate dihydrate deposition disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Numerous ANKH gene mutations cause familial CCAL2; they enhance ANKH protein activity, thereby elevating extracellular pyrophosphate levels and promoting the formation of pyrophosphate crystals, which produce the manifestations of the disease."
    explanation: Review statement of the gain-of-function model for the whole chain.
  - reference: PMID:17186460
    reference_title: "Biochemical and genetic analysis of ANK in arthritis and bone disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Chondrocalcinosis mutations retain apparently wild-type transport activity and can rescue the joint-fusion phenotype of Ank null mice."
    explanation: Rescue of the null mouse shows the variants are not loss-of-function alleles; it does not by itself show a gain, hence INDIRECT.
  downstream:
  - target: Increased Chondrocyte Pyrophosphate Export
    causal_link_type: DIRECT
    description: >-
      The mutant exporter raises extracellular PPi when expressed in
      chondrocytes.
    evidence:
    - reference: PMID:17067391
      reference_title: "P5L mutation in Ank results in an increase in extracellular inorganic pyrophosphate during proliferation and nonmineralizing hypertrophy in stably transduced ATDC5 cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results suggest that the P5L Ank mutant is capable of demonstrating a gain-of-function with respect to extracellular inorganic pyrophosphate elaboration"
      explanation: The edge claim stated directly for the P5L variant in a chondrogenic cell line.
- name: Increased Chondrocyte Pyrophosphate Export
  biological_scale: CELLULAR
  description: >-
    ANK sits in the chondrocyte plasma membrane and exports intracellular PPi
    into the matrix. Chondrocytes expressing CCAL2-mutant ANK release more
    extracellular PPi than cells expressing wild-type ANK, most consistently for
    P5L; the 5'-UTR and E490del variants also increase ANKH translation in
    vitro, so part of the effect may be more protein rather than a faster
    transporter. Later work models ANK as also mediating ATP efflux, with
    extracellular ENPP1 converting the ATP to pyrophosphate; by either route
    the net output of the node is more matrix pyrophosphate.
  cell_types:
  - preferred_term: articular chondrocyte
    term:
      id: CL:1001607
      label: articular chondrocyte
  biological_processes:
  - preferred_term: inorganic pyrophosphate export from chondrocytes
    term:
      id: GO:0030505
      label: inorganic diphosphate transport
    modifier: INCREASED
  evidence:
  - reference: PMID:32366894
    reference_title: "Differences in intracellular localisation of ANKH mutants that relate to mechanisms of calcium pyrophosphate deposition disease and craniometaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "P5L delayed cell membrane localisation but once recruited into the membrane it increased extracellular inorganic pyrophosphate, mineralization, and ENPP1 activity."
    explanation: Direct measurement of extracellular PPi from chondrocytes expressing the P5L mutant.
  - reference: PMID:15818664
    reference_title: "Association of sporadic chondrocalcinosis with a -4-basepair G-to-A transition in the 5'-untranslated region of ANKH that promotes enhanced expression of ANKH protein and excess generation of extracellular inorganic pyrophosphate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This -4-bp transition, as well as 2 mutations previously linked with familial and sporadic chondrocalcinosis (+14 bp C-to-T and C-terminal GAG deletion, respectively), but not the French familial chondrocalcinosis kindred 143-bp T-to-C mutation, increased reticulocyte ANKH transcription/ANKH translation in vitro."
    explanation: Shows that two of the heritable variants raise ANKH protein output, one route to more export; also records that the M48T (143 T-to-C) variant does not.
  - reference: PMID:32366894
    reference_title: "Differences in intracellular localisation of ANKH mutants that relate to mechanisms of calcium pyrophosphate deposition disease and craniometaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "whilst ANKH exports intracellular PPi (iPPi) into the ECM"
    explanation: States the normal direction of ANKH transport that the node's INCREASED modifier is applied to.
  - reference: clinicaltrials:NCT02243631
    reference_title: "ANK-dependent ATP Efflux Causes Calcium Pyrophosphate Deposition in Cartilage"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "There is good evidence that CPPD results from an excess of ATP in joints."
    explanation: Background statement in a trial registration for the ATP-efflux route to pyrophosphate excess; cited for the route, not as a measurement.
  downstream:
  - target: Extracellular Pyrophosphate Excess in Articular Cartilage
    causal_link_type: DIRECT
    description: >-
      More export from chondrocytes raises the pyrophosphate concentration of
      the cartilage matrix.
    evidence:
    - reference: PMID:22647861
      reference_title: "Novel ANKH amino terminus mutation (Pro5Ser) associated with early-onset calcium pyrophosphate disease with associated phosphaturia."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "promoting CPPD crystal deposition via extracellular matrix PPi supersaturation"
      explanation: The authors' statement of the proposed link from chondrocyte PPi leakage to matrix supersaturation.
- name: Extracellular Pyrophosphate Excess in Articular Cartilage
  biological_scale: TISSUE
  description: >-
    Pyrophosphate in cartilage is normally generated from extracellular ATP by
    ENPP1 and degraded by alkaline phosphatase; at physiological levels it
    inhibits hydroxyapatite formation. In CCAL2 the exporter pushes matrix PPi
    above the concentration at which it instead precipitates with calcium.
    Lymphocytes and fibroblasts from familial CPPD patients also carry high
    PPi, so the excess is systemic even though the deposits are articular.
  chemical_entities:
  - preferred_term: extracellular inorganic pyrophosphate
    term:
      id: CHEBI:18361
      label: diphosphate(4-)
    modifier: INCREASED
  locations:
  - preferred_term: articular cartilage
    term:
      id: UBERON:0010996
      label: articular cartilage of joint
  evidence:
  - reference: PMID:39089298
    reference_title: "Calcium pyrophosphate deposition disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CPPD is caused by elevated extracellular-pyrophosphate concentrations in the cartilage and causes inflammation by activation of the NLRP3 inflammasome."
    explanation: Review statement that cartilage PPi excess is the proximate cause of CPPD.
  - reference: PMID:27355536
    reference_title: "Calcium Pyrophosphate Deposition Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lymphocytes and skin fibroblasts from patients with familial CPPD disease show high levels of inorganic pyrophosphate"
    explanation: Patient cells from the familial disease carry elevated PPi.
  - reference: PMID:27355536
    reference_title: "Calcium Pyrophosphate Deposition Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In cartilage, most inorganic pyrophosphate is generated from extracellular ATP."
    explanation: Background on the normal source of cartilage PPi that ANKH-driven export adds to.
  downstream:
  - target: Calcium Pyrophosphate Crystal Deposition in Hyaline and Fibrocartilage
    causal_link_type: DIRECT
    description: >-
      Above its solubility limit pyrophosphate precipitates with calcium as
      CPPD crystals.
    evidence:
    - reference: PMID:17186460
      reference_title: "Biochemical and genetic analysis of ANK in arthritis and bone disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "when present at high levels, PPi itself can precipitate with calcium ions to form an alternative type of crystal"
      explanation: The chemical step linking PPi excess to CPPD crystal formation, stated in the paper's introduction.
- name: Calcium Pyrophosphate Crystal Deposition in Hyaline and Fibrocartilage
  biological_scale: TISSUE
  description: >-
    CPPD crystals deposit within articular hyaline cartilage and fibrocartilage
    (menisci, triangular fibrocartilage, symphysis pubis) and, in familial
    disease, also in intervertebral discs and at entheses. The deposits are the
    radiographic sign chondrocalcinosis and the substrate for both the acute
    and the chronic arthritis.
  chemical_entities:
  - preferred_term: calcium pyrophosphate dihydrate crystals
    term:
      id: CHEBI:32598
      label: calcium diphosphate
    modifier: INCREASED
  locations:
  - preferred_term: articular hyaline cartilage
    term:
      id: UBERON:0010996
      label: articular cartilage of joint
  - preferred_term: fibrocartilage
    term:
      id: UBERON:0001995
      label: fibrocartilage

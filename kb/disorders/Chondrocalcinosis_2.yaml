classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: A crystal arthritis; the clinical home is rheumatology.
    evidence:
    - reference: PMID:27355536
      reference_title: "Calcium Pyrophosphate Deposition Disease."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Calcium pyrophosphate deposition (CPPD) disease is arthritis caused by calcium pyrophosphate (CPP) crystals"
      explanation: The disease is defined as an arthritis, which places it in the rheumatologic chapter.
notes: >-
  Relationship to Craniometaphyseal_Dysplasia. Both diseases are caused by
  heterozygous ANKH variants, but at opposite ends of the pyrophosphate axis
  and in different parts of the protein. CMD variants cluster in the middle of
  ANKH, transport no pyrophosphate in oocytes and cannot rescue Ank-null mice;
  the chondrocalcinosis variants sit near either end of the protein, retain
  transport activity, rescue the null mouse, and raise extracellular PPi. The
  CMD entry carries the loss-of-function chain, the Ank knock-in and null
  mouse models, and the mineralization-module scoping note; none of that is
  repeated here, and this entry declares no `conforms_to` against the
  `defective_skeletal_mineralization` module for the mirror-image reason that
  entry gives: CPPD crystal deposition is excess precipitation of an alternative
  mineral, not failure of hydroxyapatite deposition.

  One ANKH variant, G389R, has been reported in both CMD and a CPPD case, so
  the protein-region rule is a tendency rather than a boundary.

  Direction of the ANKH defect. The 2002 Williams report postulated loss of
  function; the 2002 Pendleton report and the 2004 and 2006 chondrocyte studies
  showed increased activity or increased extracellular PPi; and the 2006 oocyte
  transport assay found the chondrocalcinosis mutants indistinguishable from
  wild type. The entry records gain of function because that is what the
  functional data and the mouse rescue support, and carries the disagreement as
  a `CONTROVERSY` discussion rather than resolving it.

  Orphanet. MONDO:0007319 cross-references ORPHA:1416, "Familial calcium
  pyrophosphate deposition", but that record is not among the leaf disorders
  in the local Orphadata cache (no references_cache/ORPHA_1416.md), so it is
  not cited here.

  ClinGen. The ClinGen gene-validity export of 2026-01-24 carries no assertion
  for ANKH in any disease, so no `gene_disease_validity` tier is recorded.

  GeneReviews. No GeneReviews chapter covers this disease or any of its
  synonyms (Bookshelf index of 2026-09-10 and a PubMed title search). The
  StatPearls chapter on calcium pyrophosphate deposition disease covers the
  common sporadic disease and does not address the familial form, so it is
  not cited.

  Clinical trials. Every registered trial in CPPD disease enrols the common
  sporadic disease without ANKH genotyping; the two recorded here are kept
  because one is the only large randomized trial of acute-attack therapy and
  the other the only trial aimed at the pyrophosphate axis.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous ANKH variants segregate with disease in every reported CCAL2
    kindred; affected members are heterozygotes and the variants are absent
    from controls.
  evidence:
  - reference: PMID:12297989
    reference_title: "Autosomal dominant familial calcium pyrophosphate dihydrate deposition disease is caused by mutation in the transmembrane protein ANKH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial autosomal dominant calcium pyrophosphate dihydrate (CPPD) chondrocalcinosis has previously been mapped to chromosome 5p15. We have identified a mutation in the ANKH gene that segregates with the disease in a family with this condition."
    explanation: Establishes the autosomal dominant pattern and the segregating ANKH variant in a CCAL2 family.
  - reference: PMID:13130483
    reference_title: "Mutations in the amino terminus of ANKH in two US families with calcium pyrophosphate dihydrate crystal deposition disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected members were heterozygous for the P-to-T variant, and the mutation was not seen in 204 control alleles."
    explanation: Heterozygosity in every affected member of two unrelated families is the dominant pattern.

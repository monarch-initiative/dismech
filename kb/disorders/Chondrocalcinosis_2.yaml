animal_models:
- name: Ank-null and ank/ank progressive ankylosis mouse
  species: Mouse
  genotype: Ank null (targeted) or ank (E440 nonsense) homozygous
  description: >-
    The loss-of-function ANK mouse. It is curated here because it is the
    model the CCAL2 variants were tested against and because it does not
    reproduce the human disease: homozygous loss of Ank deposits hydroxyapatite,
    not CPPD, in almost every joint from a few weeks of age and progresses to
    ankylosis, whereas the dominant human variants retain transport, rescue
    this phenotype when reconstructed in a BAC transgene, and produce adult-onset
    CPPD crystals. There is no published mouse carrying a CCAL2 allele that
    develops CPPD crystal deposition.
  publication: PMID:17186460
  modeled_mechanisms:
  - target: Calcium Pyrophosphate Crystal Deposition in Hyaline and Fibrocartilage
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Loss of ANK produces ectopic joint mineral, but of the wrong kind and in
      the wrong direction of the pyrophosphate axis.
    limitations: >-
      Recessive loss of function versus dominant gain of function; the deposit
      is hydroxyapatite driven by low extracellular PPi, not CPPD driven by
      high PPi; and the human CCAL2 alleles rescue rather than reproduce this
      phenotype.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The model's mineral is hydroxyapatite formed when pyrophosphate is
        absent; the node's mineral is calcium pyrophosphate formed when
        pyrophosphate is in excess. Same tissue, opposite lesion.
    evidence:
    - reference: PMID:17186460
      reference_title: "Biochemical and genetic analysis of ANK in arthritis and bone disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, recessive loss-of-function mutations cause arthritis, ectopic crystal formation, and joint fusion throughout the body."
      explanation: The mouse phenotype that the human dominant variants do not share.
    - reference: PMID:12297987
      reference_title: "Mutations in ANKH cause chondrocalcinosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Increased ANK activity may explain the different types of crystals commonly deposited in human CCAL2 families and mutant mice and may provide a useful pharmacological target for treating some forms of human CC."
      explanation: The authors' own statement that the mouse deposits a different crystal because its ANK defect runs the other way.
  evidence:
  - reference: PMID:16869722
    reference_title: "Mineral formation in joints caused by complete or joint-specific loss of ANK function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Anknull/Anknull mice develop severe ectopic postnatal crystal deposition in almost every joint of the body, leading to eventual joint fusion and loss of mobility."
    explanation: Phenotype of the targeted null allele.
  - reference: PMID:17186460
    reference_title: "Biochemical and genetic analysis of ANK in arthritis and bone disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chondrocalcinosis mutations retain apparently wild-type transport activity and can rescue the joint-fusion phenotype of Ank null mice."
    explanation: The CCAL2 alleles rescue the null, which is why the null is not a model of CCAL2.
- name: CPP crystal-induced inflammation mouse
  species: Mouse
  genotype: Wild-type, with inflammasome- and IL-1 receptor-deficient strains as comparators
  description: >-
    Synthetic CPP crystals injected into the ankle joint, a dorsal air pouch or
    the peritoneum of mice reproduce the acute, neutrophil-rich, IL-1-dependent
    sterile inflammation of a pseudogout attack. The model covers the
    downstream inflammatory branch only: there is no ANKH lesion, no
    pyrophosphate excess and no spontaneous crystal nucleation in cartilage.
  publication: DOI:10.3389/fmed.2024.1417318
  modeled_mechanisms:
  - target: Neutrophilic Crystal Synovitis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Crystal injection reproduces the neutrophil influx and its dependence on
      the inflammasome and on IL-1 receptor signalling.
    limitations: >-
      Crystals are supplied preformed, so the model says nothing about the
      inherited ANKH lesion, pyrophosphate export or crystal formation, and the
      peritoneal and air-pouch variants are not joints.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The upstream chain from the ANKH variant through pyrophosphate export to
        crystal nucleation is outside the model; the crystals are injected.
    readouts:
    - name: Neutrophil influx after crystal injection
      target: Neutrophilic Crystal Synovitis
      direction: INCREASED
      interpretation: >-
        Neutrophil recruitment is the defining cellular event of the acute
        attack; its loss in inflammasome- or IL-1R-deficient mice ties it to
        the upstream inflammasome node.
      evidence:
      - reference: PMID:16407889
        reference_title: "Gout-associated uric acid crystals activate the NALP3 inflammasome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, an impaired neutrophil influx is found in an in vivo model of crystal-induced peritonitis in inflammasome-deficient mice or mice deficient in the IL-1beta receptor (IL-1R)."
        explanation: Neutrophil influx measured in the crystal-induced peritonitis model and shown to depend on the inflammasome and IL-1R.
    evidence:
    - reference: DOI:10.3389/fmed.2024.1417318
      reference_title: "The translational value of calcium pyrophosphate deposition disease experimental mouse models"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "the direct injection of crystals into the ankles, dorsal air pouch or peritoneum constitutes a useful and reliable methodology that resembles the CPP induced-inflammatory condition in humans"
      explanation: Review of CPPD mouse models placing crystal injection as the model of the inflammatory condition.
  evidence:
  - reference: DOI:10.3389/fmed.2024.1417318
    reference_title: "The translational value of calcium pyrophosphate deposition disease experimental mouse models"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Experimental calcium pyrophosphate deposition disease (CPPD) models are divided into genetically modified models and crystal-induced inflammation models. The former do not reproduce phenotypes overlapping with the human disease"
    explanation: The review's division of CPPD models and its verdict on the genetic ones, which is why the crystal-injection model is the one carried for the inflammatory branch.
discussions:
- discussion_id: controversy_ankh_gain_versus_loss
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#ANKH Gain-of-Function Variant
  - pathophysiology#Increased Chondrocyte Pyrophosphate Export
  prompt: >-
    Do CCAL2 ANKH variants increase pyrophosphate export by changing the
    transporter's activity, by increasing the amount of ANKH protein, or by
    some non-transport effect, and is "gain of function" the right label for
    all of them?
  rationale: >-
    The gene-discovery papers disagreed from the start: one group postulated
    loss of function, the other measured increased activity in a cellular PPi
    assay. A direct oocyte transport assay later found the chondrocalcinosis
    mutants indistinguishable from wild type while the CMD mutants transported
    nothing, so the dominant human phenotype cannot be read off transporter
    kinetics alone. Translation assays showed the 5'-UTR and E490del variants
    increase ANKH protein output and the M48T variant does not, and the E490del
    protein is largely cytoplasmic yet still raises mineralization and ENPP1
    activity. The variants may therefore reach the same extracellular PPi
    excess by different routes, which matters for any attempt to drug ANKH
    directly. The entry labels the lesion GAIN_OF_FUNCTION on the net-output
    evidence while this stays open.
  evidence:
  - reference: PMID:12297989
    reference_title: "Autosomal dominant familial calcium pyrophosphate dihydrate deposition disease is caused by mutation in the transmembrane protein ANKH."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We postulate that loss of function of ANKH causes elevated extracellular PPi levels, predisposing to CPPD crystal deposition."
    explanation: The competing loss-of-function postulate from the second 2002 gene-discovery paper; refutes the gain-of-function label as stated, though not the PPi excess.
  - reference: PMID:17186460
    reference_title: "Biochemical and genetic analysis of ANK in arthritis and bone disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Chondrocalcinosis mutations retain apparently wild-type transport activity and can rescue the joint-fusion phenotype of Ank null mice."
    explanation: >-
      States that the chondrocalcinosis alleles keep wild-type transport
      activity, which argues against loss of function; graded MODEL_ORGANISM
      because the same sentence reports the Ank null mouse rescue.
  - reference: PMID:15818664
    reference_title: "Association of sporadic chondrocalcinosis with a -4-basepair G-to-A transition in the 5'-untranslated region of ANKH that promotes enhanced expression of ANKH protein and excess generation of extracellular inorganic pyrophosphate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Distinct ANKH mutations associated with heritable chondrocalcinosis may promote disease by divergent effects on extracellular PPi and chondrocyte hypertrophy, which is likely to mediate differences in the clinical phenotypes and severity of the disease."
    explanation: The authors' conclusion that the variants act by different mechanisms.
  - reference: PMID:32366894
    reference_title: "Differences in intracellular localisation of ANKH mutants that relate to mechanisms of calcium pyrophosphate deposition disease and craniometaphyseal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations near either end of ANKH are mostly associated with CPPDD while mutations in the middle have been reported to cause CMD"
    explanation: Position-dependence of the two allelic diseases, with the stated exceptions.

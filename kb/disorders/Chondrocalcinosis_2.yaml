  description: >-
    Low-dose oral colchicine (0.5-1.2 mg daily) treats acute attacks in
    patients without significant renal or hepatic impairment and is used
    prophylactically to reduce attack frequency; mild diarrhoea is the main
    adverse effect. Reported as part of maintenance therapy in an ANKH P5S case.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: colchicine
      term:
        id: CHEBI:23359
        label: colchicine
  target_phenotypes:
  - preferred_term: Acute calcium pyrophosphate crystal arthritis (pseudogout)
    term:
      id: HP:0001369
      label: Arthritis
  evidence:
  - reference: PMID:21257614
    reference_title: "EULAR recommendations for calcium pyrophosphate deposition. Part II: management."
    supports: SUPPORT
    evidence_source: OTHER

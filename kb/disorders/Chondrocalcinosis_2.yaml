diagnosis:
- name: Synovial fluid CPP crystal identification
  description: >-
    Demonstration of calcium pyrophosphate crystals in synovial fluid by
    compensated polarized light microscopy is sufficient on its own to classify
    symptomatic CPPD disease under the 2023 ACR/EULAR criteria, and is how the
    acute attacks are distinguished from gout.
  evidence:
  - reference: PMID:37495237
    reference_title: "The 2023 ACR/EULAR classification criteria for calcium pyrophosphate deposition disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of crowned dens syndrome or calcium pyrophosphate crystals in synovial fluid are sufficient to classify a patient as having CPPD disease"
    explanation: Synovial fluid crystals are a sufficient criterion in the validated classification criteria.
  - reference: PMID:22647861
    reference_title: "Novel ANKH amino terminus mutation (Pro5Ser) associated with early-onset calcium pyrophosphate disease with associated phosphaturia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An ankle aspiration revealed CPP crystals via compensated polarized microscopic analysis."
    explanation: The method applied in an ANKH-variant case.
- name: Joint imaging for chondrocalcinosis
  description: >-
    Conventional radiography of knees, wrists and pelvis, and increasingly
    ultrasonography, detect cartilage calcification; knee meniscal
    calcification is the most sensitive single radiographic finding. Imaging
    alone shows deposition, not arthritis, and the 2023 ACR/EULAR criteria
    weight it alongside clinical and laboratory items when synovial fluid
    crystals are not available.
  evidence:
  - reference: PMID:39089298
    reference_title: "Calcium pyrophosphate deposition disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Apart from the detection of CPP crystals in synovial fluid, imaging evidence of CPPD in joints by mainly conventional radiography, and increasingly ultrasonography, has a central role in the diagnosis of CPPD disease."
    explanation: Role of radiography and ultrasound in diagnosis.
  - reference: PMID:37495237
    reference_title: "The 2023 ACR/EULAR classification criteria for calcium pyrophosphate deposition disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These criteria had a sensitivity of 92.2% and specificity of 87.9% in the derivation cohort (190 CPPD cases, 148 mimickers), whereas sensitivity was 99.2% and specificity was 92.5% in the validation cohort (251 CPPD cases, 162 mimickers)."
    explanation: Performance of the weighted criteria that incorporate imaging.
  - reference: PMID:11346223
    reference_title: "Cross-sectional study of 50 patients with calcium pyrophosphate dihydrate crystal arthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The knee meniscus calcifications were the most sensitive single finding for establishing the diagnosis of CPPA."
    explanation: Identifies the most sensitive single radiographic site, in a (mostly sporadic) CPPD series.
- name: ANKH sequencing
  description: >-
    Direct sequencing of the ANKH promoter, 5'-UTR and coding exons identifies
    the causal variant in a family with early-onset or polyarticular
    chondrocalcinosis; it separates CCAL2 from CCAL1 and from secondary
    metabolic chondrocalcinosis.
  evidence:
  - reference: PMID:22647861
    reference_title: "Novel ANKH amino terminus mutation (Pro5Ser) associated with early-onset calcium pyrophosphate disease with associated phosphaturia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ANKH mutations were assessed by direct sequencing of promoter and coding regions, using primers flanking intron/exon boundaries"
    explanation: The sequencing approach used to find a codon-5 variant.

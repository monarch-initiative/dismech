- name: Crystal-Driven Cartilage Matrix Degradation
  biological_scale: TISSUE
  description: >-
    Independently of inflammation, CPP crystals have direct catabolic effects
    on chondrocytes and synoviocytes, eliciting matrix metalloproteinases and
    prostaglandins, and deposits alter the mechanical properties of cartilage.
    The result is a chronic, polyarticular, osteoarthritis-like arthropathy
    with unusually severe articular damage, which in familial disease begins
    decades earlier than sporadic CPPD. Whether crystals cause or follow the
    cartilage degradation is not settled in sporadic disease; the early-onset
    familial form argues for crystals first.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: synoviocyte
    term:
      id: CL:0000214
      label: synovial cell
  biological_processes:
  - preferred_term: cartilage extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  evidence:
  - reference: PMID:27355536
    reference_title: "Calcium Pyrophosphate Deposition Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "eliciting the production of destructive matrix metalloproteinases and prostaglandins"
    explanation: The catabolic effector output of crystal-exposed chondrocytes and synoviocytes.
  - reference: PMID:27355536
    reference_title: "Calcium Pyrophosphate Deposition Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Apart from inducing inflammation, CPP crystals have important direct catabolic effects on chondrocytes"
    explanation: Direct, inflammation-independent catabolic action of crystals on chondrocytes.
  - reference: PMID:39089298
    reference_title: "Calcium pyrophosphate deposition disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "CPPD is strongly associated with cartilage degradation and osteoarthritis, although the direction of causality is unclear."
    explanation: Records the association and, honestly, that causal direction is unsettled in the general (mostly sporadic) disease.
  downstream:
  - target: Osteoarthritis
    causal_link_type: DIRECT
    description: Chronic CPP crystal arthritis presents as a polyarticular osteoarthritis-like arthropathy.
    evidence:
    - reference: PMID:27355536
      reference_title: "Calcium Pyrophosphate Deposition Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Chronic CPP crystal arthritis comprises several clinical phenotypes. Most affected patients have a polyarticular form of arthritis that resembles osteoarthritis."
      explanation: The chronic arthropathy phenotype that follows crystal-driven damage.

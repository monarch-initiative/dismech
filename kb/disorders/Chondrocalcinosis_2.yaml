- name: NLRP3 Inflammasome Activation by CPP Crystals
  biological_scale: CELLULAR
  description: >-
    CPPD crystals engage the caspase-1-activating NLRP3 (NALP3) inflammasome
    in macrophages, producing active IL-1-beta and IL-18. Macrophages lacking
    NLRP3, ASC or caspase-1 cannot mount the crystal-induced IL-1-beta
    response.
  cell_types:

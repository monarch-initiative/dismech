name: E-Cigarette or Vaping Product Use-Associated Lung Injury
creation_date: "2026-08-23T22:55:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Occupational and Environmental Lung Disease
- Environmental Health Disorder
synonyms:
- EVALI
- e-cigarette or vaping product use-associated lung injury
- vaping-associated pulmonary illness
- vaping-related disorder
description: >-
  An acute inhalational lung injury caused by use of e-cigarette or vaping
  products, recognised as a distinct entity during a 2019 outbreak in the United
  States. Most cases were associated with vaping tetrahydrocannabinol-containing
  products obtained from informal sources, and vitamin E acetate used as a
  diluent in those products is the agent most strongly implicated. Patients
  present with respiratory, gastrointestinal and constitutional symptoms
  together, with bilateral pulmonary opacities on imaging and no identified
  infection.
notes: >-
  This entry has no `disease_term`. MONDO records no term for this disease: a
  full-text search of MONDO for "vaping", "e-cigarette" and "EVALI" returns
  nothing, so there is no identifier to bind rather than a specific one that was
  overlooked. The disease is not unidentified, only un-MONDO-ed: ICD-10-CM codes
  it as U07.0 "Vaping-related disorder", and that code is bound under `mappings`
  instead. A curator who later finds a MONDO term should add `disease_term` and
  leave the ICD-10-CM mapping in place.

  One feature that belongs in this entry is absent for want of a quotable source
  rather than by judgement: weight loss, part of the constitutional cluster, is
  described in none of the references cached here. It is waiting on a source, not
  on effort. The same applies to the pathology series PMID:31577870, which cached
  with an empty body and so could not support the histopathology section.

  Oxidative stress is deliberately NOT curated as a pathophysiology node. It was
  proposed on the strength of PMID:32822237, but that paper does not show it: the
  only occurrence of "oxidat" in its full text describes vitamin E's normal
  ANTIOXIDANT function, scavenging free radicals and terminating lipid
  peroxidation. The paper is used here for what it does show, which is direct
  toxicity to human alveolar type II cells and dose-dependent murine lung injury.
  A node asserting oxidative injury would need a source that reports it.

  An earlier version of this note also claimed ground-glass opacification was
  unsupportable. That was wrong, and wrong in an instructive way: a dedicated
  imaging paper was searched for and not found, and the absence of a NEW source
  was mistaken for the absence of ANY source, when two references already cached
  for this entry state the finding plainly. The phenotype is curated below. A
  claim that something cannot be sourced should be checked against what is
  already on disk before it is written down.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:U07.0
      label: Vaping-related disorder
    mapping_predicate: skos:exactMatch
    mapping_justification: semapv:ManualMappingCuration
    notes: >-
      The code created for this disease during the outbreak, and the closest
      thing it has to a primary identifier in any coding system this repository
      binds.
pathophysiology:
- name: Inhalation of Vitamin E Acetate from Vaping Aerosol
  biological_scale: ORGANISM
  description: >-
    Vitamin E acetate is used as a diluent or cutting agent in
    tetrahydrocannabinol-containing e-liquids sold outside regulated markets.
    Heating in a vaping device aerosolises it and delivers it to the distal
    airways, a route for which it was never assessed: the same compound is
    unremarkable when swallowed or applied to skin, so the exposure that matters
    here is specifically inhalational rather than the substance as such.
  chemical_entities:
  - preferred_term: vitamin E acetate
    term:
      id: CHEBI:32321
      label: alpha-Tocopherol acetate
  - preferred_term: tetrahydrocannabinol
    term:
      id: CHEBI:66964
      label: Delta(9)-tetrahydrocannabinol
  evidence:
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin E acetate was identified in BAL fluid obtained from 48 of 51 case patients (94%) in 16 states but not in such fluid obtained from the healthy comparator group.
    explanation: >-
      The central exposure finding, and an unusually clean one: the agent was
      recovered from the lung compartment itself in 94% of cases and in none of 99
      comparators, rather than being inferred from what patients reported buying.
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No other priority toxicants were found in BAL fluid from the case patients or the comparator group, except for coconut oil and limonene, which were found in 1 patient each.
    explanation: >-
      Narrows the exposure to this one compound. Five other candidate diluents and
      oils were assayed in the same fluid and were essentially absent, so the
      association is not a general finding of oils in the lungs of people who vape.
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      47 of 50 (94%) had detectable tetrahydrocannabinol (THC) or its metabolites in BAL fluid or had reported vaping THC products in the 90 days before the onset of illness.
    explanation: >-
      Establishes the product route: vitamin E acetate reached these lungs through
      tetrahydrocannabinol-containing products, which is why this entry curates THC
      products as the vehicle rather than nicotine e-liquids.
  downstream:
  - target: Disruption of Pulmonary Surfactant Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - vea_surfactant_route
    description: >-
      Inhaled vitamin E acetate reaches the alveolar surface where pulmonary
      surfactant operates. The steps between arrival and functional surfactant
      failure are not established in human disease, which is why this edge is
      typed as having unknown intermediates rather than being drawn as direct.
  - target: Alveolar Macrophage Lipid Accumulation
    causal_link_type: DIRECT
    description: >-
      Inhaled lipid is taken up by the alveolar macrophages that clear material
      from the airspace, which is the most directly observed consequence of the
      exposure in animal models.
    evidence:
    - reference: PMID:32101656
      reference_title: "An Animal Model of Inhaled Vitamin E Acetate and EVALI-like Lung Injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cells isolated from the BAL fluid of vitamin E acetate–exposed mice contained numerous lipid-laden macrophages
      explanation: >-
        Establishes the edge in the only system where the exposure can be controlled:
        mice exposed to aerosolised vitamin E acetate had numerous lipid-laden
        macrophages in lavage fluid, which the authors note matches what is seen
        clinically.
- name: Disruption of Pulmonary Surfactant Function
  biological_scale: MOLECULAR
  description: >-
    Vitamin E acetate is proposed to partition into the surfactant phospholipid
    film and disturb its packing, so the film can no longer lower alveolar
    surface tension normally. This entry curates the proposal as a proposal: no
    cited source here demonstrates the surfactant lesion in human EVALI lung.
  biological_processes:
  - preferred_term: surfactant homeostasis
    term:
      id: GO:0043129
      label: surfactant homeostasis
    modifier: DECREASED
  cell_types:
  - preferred_term: alveolar type II cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  downstream:
  - target: Acute Alveolar Inflammation and Diffuse Alveolar Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - vea_surfactant_route
    description: >-
      Loss of surfactant function is proposed to leave the alveolus vulnerable to
      the acute injury seen on biopsy.
- name: Alveolar Macrophage Lipid Accumulation
  biological_scale: CELLULAR
  description: >-
    Alveolar macrophages take up inhaled lipid and adopt a foamy, lipid-laden
    morphology. This is a marker of lipid exposure and not a diagnostic finding:
    lipid-laden macrophages appear in other conditions and their presence does
    not establish EVALI.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: INCREASED
  evidence:
  - reference: PMID:32822237
    reference_title: "Dose-Dependent Pulmonary Toxicity of Aerosolized Vitamin E Acetate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that aerosolized vitamin E acetate (VEA) in mice causes dose-dependent pulmonary edema, an increase in alveolar-capillary barrier permeability to protein, and a bronchiolocentric pattern of inflammation with abundant lipid-laden and multinucleated macrophages.
    explanation: >-
      A dose-dependent inhalation study reporting lipid-laden and multinucleated
      macrophages alongside pulmonary oedema and barrier permeability, which places
      this node inside the injury rather than beside it.
  - reference: PMID:32822237
    reference_title: "Dose-Dependent Pulmonary Toxicity of Aerosolized Vitamin E Acetate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, short-term exposure to aerosol generated from a JUUL device caused no detectable lung injury by lung water, BAL protein, or plasma SP-D after 15 days of exposure.
    explanation: >-
      The control that makes the finding specific rather than a generic response to
      inhaled aerosol: a nicotine pod device aerosolised through the same apparatus
      produced no detectable lung injury by any of three measures.
  downstream:
  - target: Acute Alveolar Inflammation and Diffuse Alveolar Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lipid-laden macrophages accumulate within the same dense inflammatory
      infiltrate that defines the injury. Whether they drive that inflammation or
      merely mark it is not established, so this edge is typed with unknown
      intermediates.
- name: Acute Alveolar Inflammation and Diffuse Alveolar Damage
  biological_scale: TISSUE
  description: >-
    The injured alveolus mounts an acute inflammatory response, with patterns of
    acute lung injury described on biopsy including diffuse alveolar damage,
    acute fibrinous pneumonitis and organising pneumonia.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  evidence:
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathological features of acute lung injury have been described, including diffuse alveolar damage, acute fibrinous pneumonitis, and organizing pneumonia.
    explanation: >-
      Names the acute lung injury patterns this node is built on, in the same words
      the node's description uses: diffuse alveolar damage, acute fibrinous
      pneumonitis and organising pneumonia.
  - reference: PMID:32822237
    reference_title: "Dose-Dependent Pulmonary Toxicity of Aerosolized Vitamin E Acetate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we found that VEA aerosol directly injures primary human type II alveolar epithelial cells, causing significant changes in gene expression and the secretion of inflammatory cytokines.
    explanation: >-
      The human arm of the mechanism, and the only evidence in this entry from human
      cells: aerosolised vitamin E acetate directly injured primary human alveolar
      type II cells and drove cytokine secretion. It matters for this node because
      those are the surfactant-producing cells, so it connects the inflammatory
      injury to the surfactant proposal without asserting the surfactant lesion
      itself.
  downstream:
  - target: Impaired Gas Exchange and Hypoxaemic Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      Alveolar filling and inflammatory exudate obstruct gas exchange at the
      surface where it occurs.
- name: Impaired Gas Exchange and Hypoxaemic Respiratory Failure
  biological_scale: ORGANISM
  description: >-
    Alveolar filling and loss of surfactant function impair gas exchange,
    producing hypoxaemia that in severe cases requires supplemental oxygen or
    mechanical ventilation.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:31491072
    reference_title: "Pulmonary Illness Related to E-Cigarette Use in Illinois and Wisconsin - Final Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 95% of the patients were hospitalized, 26% underwent intubation and mechanical ventilation, and two deaths were reported.
    explanation: >-
      Quantifies how far this node goes in practice: in the founding cohort a quarter
      of patients required intubation and mechanical ventilation, which is the
      clinical expression of this node rather than a separate complication.
mechanistic_hypotheses:
- hypothesis_group_id: vea_surfactant_route
  hypothesis_label: Intact vitamin E acetate disrupts alveolar surfactant
  status: CANONICAL
  description: >-
    The default model this entry's pathograph is drawn against: inhaled vitamin E
    acetate reaches the alveolus intact and interferes with surfactant function
    and alveolar epithelial integrity. It is canonical in the sense of being the
    model the field works from, not in the sense of being demonstrated; the
    vitamin_e_acetate_association_versus_causation discussion records what it
    still lacks.
- hypothesis_group_id: ketene_thermal_degradation_route
  hypothesis_label: Thermal degradation of vitamin E acetate to ketene
  status: ALTERNATIVE
  description: >-
    A competing account in which the injurious agent is not vitamin E acetate
    itself but ketene, a highly toxic gas formed when the compound is heated in
    the device. It is not merely a rival: it is compatible with every piece of
    evidence supporting the canonical route, because a patient who inhales
    ketene has also inhaled vitamin E acetate, and lavage sampling would recover
    the parent compound either way. That is what makes the two hard to separate
    from human specimens, and why this entry curates the exposure node in terms
    of the compound inhaled rather than the species that does the damage.
  evidence:
  - reference: PMID:39078936
    reference_title: "Conditions Leading to Ketene Formation in Vaping Devices and Implications for Public Health."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A potential mechanism for EVALI may involve VEA's thermal decomposition product, ketene, a highly poisonous gas, being generated under vaping conditions.
    explanation: >-
      States the alternative mechanism as a mechanism, in the authors' own
      hedged terms. Tagged OTHER because the study is a device-chemistry
      experiment rather than clinical, in vitro or animal biology.
  - reference: PMID:39078936
    reference_title: "Conditions Leading to Ketene Formation in Vaping Devices and Implications for Public Health."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The production of ketene increased with repeat puffs and showed a correlation to temperatures (200 to 500 °C) measured within vaping devices.
    explanation: >-
      Gives the condition under which the alternative route would operate, which
      is what makes it testable rather than merely available: ketene production
      rose with repeated puffs and tracked coil temperature across the range
      real devices reach.
  notes: >-
    Curated as a hypothesis rather than as pathophysiology nodes because no
    cited source demonstrates ketene in a patient. Adding a ketene node to the
    pathograph would assert a route that has been shown in a device, not in a
    lung.

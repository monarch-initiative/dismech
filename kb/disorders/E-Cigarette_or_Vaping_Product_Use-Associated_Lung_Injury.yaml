definitions:
- name: Outbreak surveillance case definition
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Three conjoined criteria: vaping exposure within 90 days, pulmonary
    infiltrates on imaging, and exclusion of alternative causes. It is a
    definition of exclusion built around an exposure history, with no confirmatory
    test, which is why the diagnosis depends on asking about vaping at all.
  validation_status:
    status: UNVALIDATED
    rationale: >-
      Adopted for outbreak surveillance rather than validated against a gold
      standard, since no independent reference standard for the disease exists.
  evidence:
  - reference: PMID:31491072
    reference_title: "Pulmonary Illness Related to E-Cigarette Use in Illinois and Wisconsin - Final Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We defined case patients as persons who reported use of e-cigarette devices and related products in the 90 days before symptom onset and had pulmonary infiltrates on imaging and whose illnesses were not attributed to other causes.
    explanation: >-
      States the operative case definition in the authors' own words. Its third limb
      does the most work and is the least visible: illnesses "not attributed to other
      causes" makes this a diagnosis of exclusion, so its performance depends on how
      hard alternatives were sought.
diagnosis:
- name: Chest imaging for bilateral pulmonary opacities
  diagnosis_term:
    preferred_term: chest computed tomography
    term:
      id: NCIT:C191501
      label: Chest Computed Tomography
  description: >-
    Chest imaging is the one positive limb of the case definition. It
    establishes bilateral pulmonary opacities and shows the characteristic
    ground-glass pattern, but it does not distinguish this disease from the
    infections the definition requires be excluded.
  evidence:
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radio-graphic findings may not be apparent on presentation, but such patients commonly are found to have basilar-predominant consolidation and ground-glass opacity.
    explanation: >-
      States both what imaging shows and its limit as a diagnostic test, and the
      quote spans both clauses because the limit is the load-bearing half here: a
      normal early study does not exclude the disease, so imaging cannot rule it
      out at presentation, which matters for a diagnosis that is otherwise one of
      exclusion. The source's line-break artefact in "Radio-graphic" is quoted as
      printed rather than silently repaired.
- name: Exclusion of pulmonary infection
  description: >-
    The load-bearing limb of the diagnosis, and the one with no positive test
    behind it. Because the case definition requires that the illness not be
    attributable to another cause, the diagnosis is only as good as the search
    for alternatives, and its performance therefore varies with how thoroughly
    infection was ruled out rather than with any property of the disease.
  evidence:
  - reference: PMID:31491072
    reference_title: "Pulmonary Illness Related to E-Cigarette Use in Illinois and Wisconsin - Final Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We defined case patients as persons who reported use of e-cigarette devices and related products in the 90 days before symptom onset and had pulmonary infiltrates on imaging and whose illnesses were not attributed to other causes.
    explanation: >-
      The case definition in the authors' own words. Its third limb, that illnesses
      were "not attributed to other causes", is what makes this a diagnosis of
      exclusion and is why the infection workup is modelled here as a diagnostic step
      rather than as background.
environmental:
- name: Use of tetrahydrocannabinol-containing vaping products from informal sources
  description: >-
    Vaping THC-containing e-liquid, typically obtained from informal or illicit
    sellers rather than a regulated market, is the exposure route that carried
    vitamin E acetate into the lung during the outbreak.
  notes: >-
    No `exposure_term` is bound. ECTO was searched for "vaping", "electronic
    cigarette" and "cigarette"; the only candidate returned is
    ECTO:0100003 "exposure to cigarette smoking", which is a different exposure
    entirely - combusted tobacco rather than a heated e-liquid aerosol - and
    binding it would assert the wrong thing in a machine-readable field. This is
    the second ontology gap in this entry, alongside the absent MONDO term, and
    both are recorded rather than filled with an approximate term.
  evidence:
  - reference: PMID:31491072
    reference_title: "Pulmonary Illness Related to E-Cigarette Use in Illinois and Wisconsin - Final Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 89% of the patients reported having used tetrahydrocannabinol products in e-cigarette devices, although a wide variety of products and devices was reported.
    explanation: >-
      Establishes THC-containing products as the dominant exposure route in the
      founding cohort, while noting the heterogeneity of products and devices that
      makes a single culprit product impossible to name.
  - reference: PMID:31671085
    reference_title: "Update: Characteristics of Patients in a National Outbreak of E-cigarette, or Vaping, Product Use-Associated Lung Injuries - United States, October 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      86% reported any use of tetrahydrocannabinol (THC)-containing products, 64% reported any use of nicotine-containing products, and 52% reported use of both.
    explanation: >-
      The national product-use breakdown behind this exposure entry, and the reason it
      is named for THC-containing products: 86% reported them, against 64% for
      nicotine-containing products, with half the patients reporting both.
  influences_mechanisms:
  - target: Inhalation of Vitamin E Acetate from Vaping Aerosol
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Using these products is the act by which vitamin E acetate is aerosolised
      and inhaled, which is the initiating step of this entry's pathograph.
    evidence:
    - reference: PMID:31860793
      reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Vitamin E acetate was identified in BAL fluid obtained from 48 of 51 case patients (94%) in 16 states but not in such fluid obtained from the healthy comparator group.
      explanation: >-
        Links the exposure to the mechanism at the point where it can be checked: the
        compound was recovered from the lungs of people who used these products and
        from none of the comparators.
animal_models:
- name: Mouse inhaled vitamin E acetate model
  species: Mouse
  publication: PMID:32101656
  description: >-
    Mice exposed to aerosolised vitamin E acetate at doses scaled to human
    vaping, compared against a propylene glycol/vegetable glycerin vehicle and
    against air.
  evidence:
  - reference: PMID:32822237
    reference_title: "Dose-Dependent Pulmonary Toxicity of Aerosolized Vitamin E Acetate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that aerosolized vitamin E acetate (VEA) in mice causes dose-dependent pulmonary edema, an increase in alveolar-capillary barrier permeability to protein, and a bronchiolocentric pattern of inflammation with abundant lipid-laden and multinucleated macrophages.
    explanation: >-
      Attests that inhalational vitamin E acetate models are informative for this
      disease at all, which is a different claim from any single mechanism link: a
      dose-dependent response reproducing oedema, barrier permeability and
      lipid-laden macrophages is what makes the system worth using.
  modeled_mechanisms:
  - target: Inhalation of Vitamin E Acetate from Vaping Aerosol
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Delivers the implicated agent by the implicated route at a dose chosen to
      match human exposure, which is the arm of causation that human
      observational data cannot supply.
    limitations: >-
      A mouse airway is not a human airway, the exposure ran two weeks rather
      than the months-to-years of real use, and the model tests vitamin E acetate
      alone rather than the heterogeneous mixtures people actually vaped.
    evidence:
    - reference: PMID:32101656
      reference_title: "An Animal Model of Inhaled Vitamin E Acetate and EVALI-like Lung Injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We exposed 30 mice (in three groups of 10) to aerosols generated from vitamin E acetate, a mixture of propylene glycol and vegetable glycerin (PG–VG), or air (controls).
      explanation: >-
        Describes the exposure design, including the two comparator arms that make the
        vitamin E acetate arm interpretable.
prevalence:
- population: United States, national outbreak reporting to the CDC
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A cumulative outbreak case count reported to a national surveillance system,
    not a population rate: no denominator is given and none is derived here. The
    count is also a floor rather than an estimate, since it counts only cases
    that were recognised as EVALI and reported.
  evidence:
  - reference: PMID:32320569
    reference_title: "Hospitalizations and Deaths Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As of January 7, 2020, a total of 2558 hospitalized patients with nonfatal cases and 60 patients with fatal cases of e-cigarette, or vaping, product use-associated lung injury (EVALI) had been reported to the Centers for Disease Control and Prevention (CDC).
    explanation: >-
      Gives the cumulative national burden at a stated date, which is the form the
      epidemiology of an outbreak takes.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    An acute illness that hospitalised the large majority of those it affected,
    put a quarter of the founding cohort on mechanical ventilation, and killed
    dozens nationally within months. The burden also falls unevenly with age in
    a way worth recording: older patients were a minority of non-fatal cases but
    a majority of fatal ones, so the same disease carries a different burden at
    50 than at 20.
  evidence:
  - reference: PMID:31671085
    reference_title: "Update: Characteristics of Patients in a National Outbreak of E-cigarette, or Vaping, Product Use-Associated Lung Injuries - United States, October 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age of EVALI patients who survived was 23 years, and the median age of EVALI patients who died was 45 years.
    explanation: >-
      Independent corroboration of the age contrast from a different surveillance
      report and a different cut of the data: median age 23 among survivors against 45
      among those who died. Two sources reporting the same direction by different
      measures is why this is curated as a real feature of the disease rather than a
      single cohort's artefact.
  - reference: PMID:32320569
    reference_title: "Hospitalizations and Deaths Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proportion of patients with fatal cases was higher among those 35 years of age or older (44 of 60 [73%]) than among those younger than 35 years, but the proportion with nonfatal cases was lower among those 35 years of age or older (551 of 2514 [22%]).
    explanation: >-
      Older patients were a minority of non-fatal cases (22% aged 35 or over) but a
      majority of fatal ones (73%), so age is not merely associated with death but
      distributed in opposite directions across the two groups. Curated as an
      observed contrast in national surveillance data, not as a validated prognostic
      rule.
biochemical:
- name: Peripheral white cell count and differential
  notes: >-
    Leukocytosis with neutrophil predominance is the characteristic haematological
    picture at admission. No reference range or interpretation band is curated:
    the available figures are proportions of patients meeting a threshold, not a
    distribution of values, and they come from the fatal-case subset rather than
    from all patients.
  evidence:
  - reference: PMID:32320569
    reference_title: "Hospitalizations and Deaths Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The laboratory values at the initial admission showed that 37 of 52 patients (71%) with fatal cases had leukocytosis (white-cell counts >11,000 per cubic millimeter) and 29 of 45 (64%) had neutrophil predominance (white-cell count with >80% neutrophils).
    explanation: >-
      Gives both the thresholds used and the proportions meeting them. The
      denominators matter and are stated: 52 and 45 patients with FATAL cases, so this
      describes the laboratory picture of the severe end of the disease. It is curated
      as a finding, not as a frequency for the disease as a whole.
histopathology:
- name: Organising pneumonia with focal fibrosis
  description: >-
    Where lung tissue was obtained, organising pneumonia has been described,
    consistent with the acute lung injury patterns reported in this disease.
    Biopsy is not required for diagnosis and is rarely performed, so this entry
    curates a single reported case rather than a series.
  evidence:
  - reference: PMID:34584727
    reference_title: "Treatment of electronic cigarette or vaping product use-associated lung injury (EVALI) by corticosteroid and low-dose pirfenidone: Report of a case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lung biopsy revealed organizing pneumonia with focal fibrosis.
    explanation: >-
      A single biopsied case, and curated as one. The strongest published pathology
      series on this disease could not be used here: PMID:31577870 cached with an
      empty body and so has no quotable text, which is why this section rests on a
      case report rather than on the series a curator would prefer.
treatments:
- name: Vaping Cessation Counselling
  description: >-
    Stopping the exposure is the only intervention that addresses the cause
    rather than the injury, and it is what separates recovery from relapse: this
    entry's progression section records that resuming vaping is a route back into
    the disease. Curated without efficacy evidence, because none of the cited
    sources tests counselling as an intervention.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_mechanisms:
  - target: Inhalation of Vitamin E Acetate from Vaping Aerosol
    treatment_effect: INHIBITS
    description: >-
      Acts on the initiating node by removing the exposure, which is the only
      point in this pathograph where the disease can be prevented rather than
      treated.
- name: Supplemental Oxygen and Mechanical Ventilation
  description: >-
    Oxygen, and mechanical ventilation where needed, is the treatment that
    addresses the gas-exchange failure directly. It is supportive rather than
    disease-modifying: it substitutes for the failing alveolus while the injury
    resolves. Named for the two interventions rather than for supportive care in
    general, so that the DEVICE modality describes what is actually delivered.
  notes: >-
    The generic NCIT:C15747 Supportive Care action term is deliberate.
    NCIT:C94624 Oxygen Therapy was proposed as a closer fit and does exist
    (OAK-verified, and already bound by three other entries), but it names only
    half of what this treatment covers: NCIT separates oxygen therapy from
    mechanical ventilation (NCIT:C171457, NCIT:C191573) and has no term spanning
    both. Binding it would trade accurate generality for a precision that
    excludes the ventilation arm, which is the same mismatch the rename fixed,
    running the other way.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Gas Exchange and Hypoxaemic Respiratory Failure
    treatment_effect: BYPASSES
    description: >-
      Does not act on the injury at all. It substitutes for the function the
      injured alveolus has lost, which is what BYPASSES means here and is the
      honest distinction from the glucocorticoid entry below, which does target a
      mechanism.
  evidence:
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly half the patients (47%) required intensive care to treat respiratory failure.
    explanation: >-
      Quantifies the need for this treatment rather than its efficacy: nearly half of
      patients required intensive care for respiratory failure, which is the clinical
      demand this entry curates the treatment against.
- name: Systemic Glucocorticoid Therapy
  description: >-
    Systemic corticosteroids are the mainstay of treatment, given alongside
    oxygen and supportive care. The evidence is observational: patients improved
    on treatment in uncontrolled cohorts, and no controlled trial exists, so
    response cannot be separated from removal of the exposure and the natural
    course of an acute injury.
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    The generic Pharmacotherapy action term is deliberate, paired with a CHEBI
    therapeutic_agent. NCIT:C2963 was proposed as a more specific "Corticosteroid"
    term and is not one: OAK resolves it to "Cranial Nerve Neoplasm". NCIT:C2322
    is the real Corticosteroid term but fails the ChemicalEntityTerm dynamic enum,
    which is why the agent is bound to CHEBI:24261 instead.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: systemic glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Acute Alveolar Inflammation and Diffuse Alveolar Damage
    treatment_effect: INHIBITS
    description: >-
      The rationale is suppression of the acute alveolar inflammatory response,
      which is the node this entry curates as producing the gas-exchange failure.
  evidence:
  - reference: PMID:32320538
    reference_title: "Impaired lung function following e-cigarette or vaping product use associated lung injury in the first cohort of hospitalized adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had dramatic improvement with systemic glucocorticoid therapy and 14/15 were discharged on room air.
    explanation: >-
      The observational basis for corticosteroid use, quoted with the qualifier it
      carries: 15 adolescents, no control arm, and "dramatic improvement" is the
      authors' characterisation of an uncontrolled series. It supports the practice
      without establishing efficacy.
progression:
- phase: Relapse on re-exposure
  notes: >-
    Resuming vaping is a route back into the disease, which is why cessation is
    curated as a treatment rather than as advice. No cited source here quantifies
    the relapse rate, so this phase is recorded as a course without a frequency.
- phase: Recovery and residual impairment
  notes: >-
    Symptoms resolve in most survivors, but resolution of symptoms does not mean
    resolution of injury: the majority of a followed-up adolescent cohort had
    abnormal pulmonary function tests despite reporting they felt better.
  evidence:
  - reference: PMID:32320538
    reference_title: "Impaired lung function following e-cigarette or vaping product use associated lung injury in the first cohort of hospitalized adolescents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite 11/11 patients reporting resolved or improved symptoms, 7/11 had abnormalities on pulmonary function testing.
    explanation: >-
      The dissociation between how patients feel and what their lungs do, which is the
      reason this entry curates a residual-impairment phase at all. 7 of 11 had
      abnormal pulmonary function testing while 11 of 11 reported resolved or improved
      symptoms, so a symptom-based follow-up would have recorded full recovery.
discussions:
- discussion_id: vitamin_e_acetate_association_versus_causation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Vitamin E acetate is recovered from the lungs of nearly every EVALI patient
    and from no comparator. Does it cause the disease, and is it the only thing
    that does?
  attaches_to:
  - pathophysiology#Inhalation of Vitamin E Acetate from Vaping Aerosol
  - pathophysiology#Disruption of Pulmonary Surfactant Function
  rationale: >-
    The exposure evidence here is unusually strong for an environmental disease:
    the agent was measured in the affected compartment, in 94% of cases and 0 of
    99 comparators, with five rival toxicants assayed in the same fluid and
    essentially absent. It is much better than the correlational exposure data
    most entries in this knowledge base rest on.

    It is still an association, and the source paper says so. Its conclusion
    claims association in a convenience sample and does not claim causation, and
    the mouse study that followed opens by stating that additional studies are
    needed to establish whether a causal link exists. This entry follows both
    sources rather than rounding them up: the pathograph runs from the exposure
    to the injury, but the surfactant node is described as a proposal and the
    edges out of it are typed with unknown intermediates.

    Two specific gaps sit underneath. Nothing cited here demonstrates the
    surfactant lesion in human EVALI lung, so the mechanism connecting a
    recovered compound to an injured alveolus is inferred rather than observed.
    And 3 of 51 case patients had no detectable vitamin E acetate at all, which
    the single-agent account does not explain and which this entry does not
    explain away. National surveillance carries a second, independent version of
    the same problem: 2% of patients with product data reported using neither
    THC- nor nicotine-containing products at all, so the exposure route itself is
    unaccounted for in a small minority.
  proposed_experiments:
  - experiment_id: surfactant_function_in_human_evali_lung
    name: Measure surfactant function in human EVALI lung
    description: >-
      In bronchoalveolar lavage fluid from acute EVALI, measure surface tension
      and surfactant phospholipid composition directly, against both healthy
      vapers and patients with non-EVALI acute lung injury. The second
      comparator is the one that matters: a surfactant abnormality found in any
      acute lung injury would not support a vitamin E acetate-specific
      mechanism. Relate the measurements to the vitamin E acetate concentration
      in the same specimen, and include the case patients in whom none is
      detectable.
  evidence:
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin E acetate was associated with EVALI in a convenience sample of 51 patients in 16 states across the United States.
    explanation: >-
      The source's own conclusion, and the reason this is a gap rather than a settled
      mechanism. It claims association in a convenience sample. PARTIAL because it
      supports the exposure-disease link while explicitly declining the causal claim
      this discussion is about.
  - reference: PMID:32101656
    reference_title: "An Animal Model of Inhaled Vitamin E Acetate and EVALI-like Lung Injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      additional studies are necessary to determine whether a causal link exists between inhalation of vitamin E acetate and EVALI
    explanation: >-
      The authors of the follow-up animal study state the gap directly in their
      opening: additional studies are needed to determine whether a causal link
      exists. That a dedicated inhalation model was built on this premise is the
      clearest sign the question was open, not closed, after the human data landed.
  - reference: PMID:31860793
    reference_title: "Vitamin E Acetate in Bronchoalveolar-Lavage Fluid Associated with EVALI."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin E acetate was identified in BAL fluid obtained from 48 of 51 case patients (94%) in 16 states but not in such fluid obtained from the healthy comparator group.
    explanation: >-
      Also the source of the unexplained minority: 48 of 51 leaves three case
      patients with no detectable vitamin E acetate, which the discussion records
      rather than rounding to "all".
  - reference: PMID:31671085
    reference_title: "Update: Characteristics of Patients in a National Outbreak of E-cigarette, or Vaping, Product Use-Associated Lung Injuries - United States, October 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exclusive use of THC-containing products was reported by 34% of patients and exclusive use of nicotine-containing products by 11%, and for 2% of patients, no use of either THC- or nicotine-containing products was reported.
    explanation: >-
      The second unexplained minority, and from a different dataset: 2% of
      patients with product-use data reported neither THC- nor
      nicotine-containing products. Together with the three case patients who had
      no detectable vitamin E acetate, it marks the edge of what the single-agent
      account covers.

    reference_title: "Pulmonary Illness Related to E-Cigarette Use in Illinois and Wisconsin - Final Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients presented with respiratory symptoms (97%), gastrointestinal symptoms (77%), and constitutional symptoms (100%).
    explanation: >-
      The cohort reports this only inside a category-level composite: respiratory
      symptoms 97%, gastrointestinal 77%, constitutional 100%. A composite figure
      cannot be assigned to a component phenotype, so it is curated here as evidence
      that the association exists and NOT as this phenotype's frequency band, which is
      deliberately left unset.

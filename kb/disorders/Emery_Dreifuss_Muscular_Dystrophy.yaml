    Rare autosomal recessive EDMD caused by biallelic LMNA variants - the same
    gene as dominant EDMD2, so the two subtypes are distinguished by inheritance
    and allele dose rather than by locus. The originally reported proband was
    homozygous for a missense change and the heterozygous first-cousin parents
    were clinically and cardiologically unaffected, which separates this
    recessive form from the dominant one in which a single allele suffices. In
    that single reported case the phenotype was severe and
    skeletal-muscle-predominant: contractures left him unable to stand at age
    five and he was wheelchair-bound with diffuse wasting at 40, with no cardiac
    problems on careful cardiological examination at that age.

  evidence:
  - reference: PMID:10080180
    reference_title: "Mutations in the gene encoding lamin A/C cause autosomal dominant Emery-Dreifuss muscular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

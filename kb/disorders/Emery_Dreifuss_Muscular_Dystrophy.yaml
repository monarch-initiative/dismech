    explanation: Original identification of loss-of-function EMD (emerin) mutations in X-linked EDMD.
- name: LMNA
  gene_term:
    preferred_term: LMNA
    term:
      id: hgnc:6636
      label: LMNA
  association: Heterozygous (dominant) variants
  relationship_type: CAUSATIVE
  subtype: EDMD2
  notes: >-
    Heterozygous LMNA variants cause autosomal dominant EDMD2, often de novo. The

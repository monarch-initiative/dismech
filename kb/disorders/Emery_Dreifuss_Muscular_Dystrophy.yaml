review_notes: >-
  MONDO:0016830 has four direct children. Two of them, MONDO:0010680 X-linked
  Emery-Dreifuss muscular dystrophy and MONDO:0020336 autosomal dominant
  Emery-Dreifuss muscular dystrophy, are defined by inheritance rather than by
  gene ("X-linked form of Emery-Dreifuss muscular dystrophy" and "Autosomal
  dominant form of Emery-Dreifuss muscular dystrophy"), and their own children
  are the numbered gene-defined classes. Every one of those is bound on a
  has_subtypes row here: MONDO:0100531 (EDMD1, EMD) and MONDO:0800318 (EDMD6,
  FHL1) under the X-linked node, and MONDO:0021569, MONDO:0013071, MONDO:0013072
  and MONDO:0013677 (EDMD2, 4, 5, 7) under the autosomal dominant node. The two
  intermediate nodes therefore take no row of their own. MONDO:0010680's third
  child, MONDO:0010401 X-linked myopathy with postural muscle atrophy, is a
  separate X-linked myopathy class that this entry does not model and that
  asserts no causal gene of its own in MONDO. The remaining two direct children
  are MONDO:0014676 (EDMD3, biallelic LMNA), which is bound here, and
  MONDO:0000727 scapuloperoneal myopathy, a phenotype-defined class that asserts
  no causal gene and whose two descendants (congenital myopathy 7A with myosin
  storage, and X-linked scapuloperoneal muscular dystrophy) assert none either and
  sit outside the EDMD numbered series; it is left unbound. Every subtype_term in
  this entry is a descendant of MONDO:0016830.

  Worth flagging for MONDO rather than worked around here: MONDO:0010680 asserts
  EMD (hgnc:3331) as its causal gene in an OWL axiom while subsuming the FHL1
  disease MONDO:0800318, so the axiom is narrower than the class its own
  definition describes. That axiom is why the d2g gap comparison offered this
  class as a missing EMD subtype.

  The GeneReviews chapter's molecular-diagnosis criteria name two further genes
  this entry does not cover, SUN2 (heterozygous) and SUN1 (biallelic). They are
  deliberately left out pending a dedicated pass, because their relationship type
  is not settled by what is reachable: the only primary report found,
  PMID:24375709, describes heterozygous SUN1 variants alongside a primary EMD or
  LAP2alpha mutation and aggravating the cellular phenotype, which is a digenic
  modifier rather than the primary biallelic cause the chapter's list implies. A
  relationship type typed from a seven-gene diagnostic list would not distinguish
  the two. Synonym-inclusive MONDO searches for "SUN1" and "SUN2" return no
  disease class, so neither would take a subtype row in any case.

  ClinGen's committed Gene-Disease Validity download holds no Emery-Dreifuss
  assertion for any of these genes, and no row at all for EMD, SYNE2 or FHL1, so
  it cannot grade this entry's gene-disease claims. Its LMNA, SYNE1 and TMEM43
  rows are against lipodystrophy, cardiomyopathy, arthrogryposis and ataxia
  classes, which are not transferable to EDMD.

  FHL1 is the one causal gene not bound to a pathophysiology node. The
  nuclear-envelope node's own evidence covers nesprins, emerin, lamin A/C and
  LUMA but not FHL1, and FHL1 is a cytoskeletal four-and-a-half LIM domain
  protein rather than a nuclear-envelope component, so the mechanism node it acts
  at has not been curated yet.

pathophysiology:
- name: Nuclear Envelope and LINC Complex Dysfunction
  description: >-
    EDMD is caused by loss or dysfunction of nuclear-envelope proteins (emerin,
    lamin A/C) and LINC-complex components (nesprins, SUN proteins, LUMA) that
    physically couple the nucleoskeleton to the cytoskeleton. These proteins form
    an interacting network spanning the nuclear lamina, inner nuclear membrane,
    and outer nuclear membrane. Pathogenic variants disrupt nesprin/emerin/lamin
    binding, mislocalize emerin and SUN2, and compromise nuclear envelope
    integrity, which is the upstream defect shared by the nuclear-envelope
    subtypes (EDMD1-5 and EDMD7). FHL1-related EDMD6 is the exception: FHL1 is a
    sarcomeric and sarcolemmal protein, and its lesion is modelled as a separate
    node.
  genes:
  - preferred_term: EMD
    term:
      id: hgnc:3331
      label: EMD
  - preferred_term: LMNA
    term:

  association: Loss-of-function variants (X-linked recessive)
  relationship_type: CAUSATIVE
  subtype: EDMD1
  notes: >-
    Hemizygous EMD variants (typically loss of function, with absent or reduced
    emerin) cause X-linked EDMD1.

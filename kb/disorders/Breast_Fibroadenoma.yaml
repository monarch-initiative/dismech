datasets:
- accession: geo:GSE55594
  title: Gene expression profiling of breast fibroadenomas
  description: Fibroadenomas are the most common benign breast tumors in women under 30. Unlike their malignant counterparts, relatively molecular profiling has been done on fibroadenomas. Here we performed gene expression profiling on ten fibroadenomas in order to better characterize these tumors. Through targeted amplicon sequencing, we have found that six of these tumors have MED12 mutations. We show that the MED12 mutations, among others, are associated with activated estrogen signaling, as well as increased invasiveness through upregulation of ECM remodelling genes.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 10
  publication: PMID:25038752
  notes: Identified by GEO DataSets index search for Breast Fibroadenoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

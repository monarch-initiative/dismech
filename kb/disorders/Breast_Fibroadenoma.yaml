disease_term:
  preferred_term: breast fibroadenoma
  term:
    id: MONDO:0002056
    label: breast fibroadenoma
description: >-
  Breast fibroadenoma is a common benign biphasic fibroepithelial tumor,
  particularly in premenopausal women, that often presents as a palpable breast
  mass. Most conventional fibroadenomas contain a somatic MED12 exon-2 mutation
  restricted to the stromal component. MED12-mutant tumors show dysregulated
  estrogen signaling and extracellular-matrix organization, linking a clonal
  stromal driver to proliferation of the stromal and epithelial components.
  Myxoid fibroadenomas are molecularly distinct and usually lack MED12 mutations.
pathophysiology:
- name: Stromal MED12 Exon-2 Driver Mutation
  description: >-
    Recurrent somatic MED12 exon-2 mutations are the principal known driver of
    conventional breast fibroadenomas. They occur in approximately 59%-65% of
    tumors and are restricted to the neoplastic stromal rather than epithelial
    component, establishing fibroadenoma as a stromally driven biphasic lesion.
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  evidence:
  - reference: PMID:25038752
    reference_title: "Exome sequencing identifies highly recurrent MED12 somatic mutations in breast fibroadenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing of an additional 90 fibroadenomas confirmed highly frequent MED12 exon 2 mutations (58/98, 59%) that are probably somatic"
    explanation: >
      Establishes the high frequency and somatic origin of MED12 exon-2
      mutations in fibroadenoma.
  - reference: PMID:25038752
    reference_title: "Exome sequencing identifies highly recurrent MED12 somatic mutations in breast fibroadenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using laser capture microdissection, we show that MED12 fibroadenoma mutations are present in stromal but not epithelial mammary cells."
    explanation: >
      Localizes the driver mutation specifically to the stromal component of
      this biphasic tumor.
  downstream:
  - target: Dysregulated Stromal Estrogen Signaling and ECM Organization
    description: >-
      MED12-mutant stromal cells exhibit altered estrogen-response and
      extracellular-matrix transcriptional programs.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25038752
      reference_title: "Exome sequencing identifies highly recurrent MED12 somatic mutations in breast fibroadenoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MED12 mutations are associated with dysregulated estrogen signaling and extracellular matrix organization."
      explanation: >
        Expression profiling connects MED12 mutation status to the two
        downstream stromal programs.
- name: Dysregulated Stromal Estrogen Signaling and ECM Organization
  conforms_to: "sex_steroid_driven_proliferation#Nuclear Steroid Receptor Hyperactivation"
  description: >-
    MED12-mutant fibroadenoma stroma has dysregulated estrogen signaling and
    extracellular-matrix organization. These altered stromal programs provide a
    plausible hormone-responsive microenvironment for formation of the biphasic
    lesion, although the intervening paracrine mechanisms remain incompletely
    resolved.
  biological_processes:
  - preferred_term: Estrogen receptor signaling pathway
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
    modifier: DYSREGULATED
  - preferred_term: Extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:25038752
    reference_title: "Exome sequencing identifies highly recurrent MED12 somatic mutations in breast fibroadenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression profiling of MED12-mutated and wild-type fibroadenomas revealed that MED12 mutations are associated with dysregulated estrogen signaling and extracellular matrix organization."
    explanation: >
      Directly supports altered estrogen-response and extracellular-matrix
      programs in MED12-mutant human fibroadenomas.
  downstream:
  - target: Benign Biphasic Fibroepithelial Proliferation
    description: >-
      The altered stromal program is associated with proliferation of both
      stromal and epithelial components, with incompletely defined intermediate
      signaling.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: DOI:10.1136/jclinpath-2017-204838
      reference_title: "Genetics and genomics of breast fibroadenomas"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "The fibroadenoma comprises a proliferation of both stromal and epithelial components. The mechanisms underlying fibroadenoma pathogenesis remain incompletely understood."
      explanation: >
        Supports the biphasic proliferative endpoint while explicitly retaining
        uncertainty about the intervening mechanism.
- name: Benign Biphasic Fibroepithelial Proliferation
  conforms_to: "sex_steroid_driven_proliferation#Benign Hormone-Dependent Proliferative Lesion"
  description: >-
    Coordinated proliferation of stromal and epithelial mammary components
    produces a circumscribed benign fibroepithelial tumor. The stromal component
    is clonal and commonly MED12-mutant, whereas the accompanying epithelium does
    not carry the mutation.
  evidence:
  - reference: DOI:10.1136/jclinpath-2017-204838
    reference_title: "Genetics and genomics of breast fibroadenomas"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fibroadenomas of the breast are benign fibroepithelial tumours most frequently encountered in women of reproductive age"
    explanation: Defines fibroadenoma as a benign fibroepithelial tumor.
  - reference: PMID:25038752
    reference_title: "Exome sequencing identifies highly recurrent MED12 somatic mutations in breast fibroadenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MED12 fibroadenoma mutations are present in stromal but not epithelial mammary cells."
    explanation: Establishes the genetically distinct stromal and epithelial components.
  downstream:
  - target: Breast Mass
    description: >
      The circumscribed benign fibroepithelial tumor presents clinically as a
      palpable breast lump or mass.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11270760
      reference_title: "Fibroadenoma of the breast."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Fibroadenoma of the breast is a common cause of a benign breast lump in premenopausal women."
      explanation: The clinical review directly connects fibroadenoma to a benign breast lump.

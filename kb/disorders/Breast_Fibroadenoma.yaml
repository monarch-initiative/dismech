diagnosis:
- name: Triple assessment with tissue biopsy
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  description: >-
    Diagnosis integrates clinical examination, age-appropriate breast imaging,
    and nonsurgical tissue sampling. Ultrasound is preferred in younger women;
    mammography with ultrasound is used in older women. Fine-needle aspiration
    or core biopsy provides the most accurate confirmation and is needed because
    clinical assessment alone does not reliably exclude malignancy.
  evidence:
  - reference: PMID:11270760
    reference_title: "Fibroadenoma of the breast."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is based on the combination of clinical examination, imaging and non-surgical tissue biopsy (the triple test)."
    explanation: Defines the three-part diagnostic assessment for fibroadenoma.
  - reference: PMID:11270760
    reference_title: "Fibroadenoma of the breast."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tissue biopsy, by either fine-needle aspiration or core biopsy, is the most accurate means of establishing the diagnosis."
    explanation: Establishes nonsurgical tissue biopsy as the most accurate confirmatory test.

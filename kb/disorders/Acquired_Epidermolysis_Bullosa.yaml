clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Chronic recurrent blistering can require prolonged treatment and leave permanent scars or nail damage. Burden is variable: refractory skin disease and cicatrizing mucosal disease may be severe, with dysphagia, nutritional impairment, visual loss or airway compromise. The overall category does not describe every patient.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      classical mechanobullous form have been reported to be refractory to
      systemic corticosteroids, azathioprine, methotrexate, and cyclophosphamide
    explanation: Documents the treatment-refractory, chronic course of EBA.
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Since this form of EBA may have severe consequences such as dysphagia, weight loss, malnutrition, and asphyxiation due to esophageal stenosis and larynx or trachea scaring
    explanation: Documents severe complications of the mucosa-predominant presentation.
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: mucous membranes are involved in 50-65% of patients
    explanation: Aggregate mucosal involvement estimate from the review; it is not an oral-specific frequency.

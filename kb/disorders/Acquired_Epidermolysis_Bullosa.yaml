- name: Rituximab
  description: >-
    Anti-CD20 B-cell depletion is used for refractory EBA; mature antibody-secreting plasma cells are not directly depleted. A 2024 review of 31 reports included 68 patients: clinical response occurred in 63/68 and remission in 45/61 with that outcome reported. Relapse occurred in 15/38 with durability data, with mean follow-up of 23 months. Adverse events were reported in 11/39 with safety data, including two fatal pneumonias. These selected, heterogeneous, frequently combination-treated reports do not establish randomized comparative efficacy or routine safety.

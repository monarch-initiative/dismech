- reference: PMID:23956869
  title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
  findings:
  - statement: The full review separates induction, antibody persistence and effector mechanisms; active immunization and passive transfer answer different questions.
  - statement: HSP90 inhibition prevented and ameliorated experimental EBA without reducing plasma-cell numbers, while T-cell proliferation was inhibited. This is preclinical evidence rather than a clinical EBA treatment recommendation.
    evidence:
    - reference: PMID:23956869
      reference_title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Unexpectedly, total plasma cell numbers, COL7-specific plasma cells, and germinal center B cells were unaffected by HSP90 blockade.
      explanation: Avoids mislabeling HSP90 inhibition as demonstrated plasma-cell depletion.

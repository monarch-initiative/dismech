name: Acquired Epidermolysis Bullosa
creation_date: "2026-10-01T01:15:00Z"
category: Autoimmune
description: >-
  Epidermolysis bullosa acquisita (EBA) is an acquired autoimmune subepidermal blistering disease with antibodies against type VII collagen (COL7), the principal anchoring-fibril protein. IgG predominates, but IgA-only and mixed IgG/IgA disease occur; NC1 is the major, not exclusive, antigenic domain. Mechanobullous and inflammatory presentations can coexist or change over time. Complement, neutrophil Fc-receptor signaling, reactive oxygen species and proteases contribute to inflammatory tissue injury, with causal dissection mainly from mouse and human ex vivo models. Direct antibody interference with anchoring-fibril adhesion is a proposed explanation for mechanobullous disease. Diagnosis integrates clinical findings with tissue immunofluorescence and COL7-specific testing; dermal-floor binding alone is not specific, and negative serum assays do not exclude EBA. Mucosal scarring may threaten swallowing, vision or the airway. EBA is distinct from inherited dystrophic epidermolysis bullosa.
disease_term:
  preferred_term: epidermolysis bullosa acquisita
  term:
    id: MONDO:0018747
    label: acquired epidermolysis bullosa
synonyms:
- epidermolysis bullosa acquisita
- EBA
- EB acquisita
parents:
- Autoimmune Disease
- Skin Disease
notes: >-
  COL7A1 encodes the autoantigen rather than an established Mendelian cause of EBA. HLA-DRB1*15:03 is an associated susceptibility allele. Clinical subtype does not establish a unique pathogenic pathway or antibody epitope. Historical reports link EBA with inflammatory bowel disease, especially Crohn disease, but many predate modern EBA diagnostic criteria; the often-quoted roughly 30% figure is not a reliable contemporary population prevalence. A later record-based analysis discussed in PMID:37503352 did not identify IBD as a risk factor or sequela. Anti-COL7 serum reactivity in IBD or systemic lupus also does not by itself establish EBA.
has_subtypes:
- name: Mechanobullous
  display_name: Mechanobullous (classical, non-inflammatory)
  description: >-
    Classical presentation with trauma-prone skin fragility, tense blisters, scarring and milia, often with nail abnormalities. Mucosal lesions can occur. Approximately one-third of 83 patients summarized across three older clinical studies had this presentation; this is not a population estimate. Direct anchoring-fibril interference remains a proposed mechanism.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The classical form of EBA is characterized by skin fragility, the appearance of vesicles, tense blisters, erosions on non-inflamed skin, and healing with scars and milia formation
    explanation: Defines the classical clinical pattern.
  - reference: PMID:23956869
    reference_title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: 'Inflammatory phenotypes: 66% Classical (mechanobullous) phenotype: 33%'
    explanation: Table 1 summarizes 83 patients from three studies; the subtype proportions are series-specific.
- name: Inflammatory
  display_name: Inflammatory EBA
  description: >-
    Inflammatory presentations may resemble bullous pemphigoid, linear IgA disease, mucous membrane pemphigoid or Brunsting-Perry pemphigoid. Approximately two-thirds of patients in older reported series had inflammatory disease. Mucosa-predominant EBA is a minority presentation (5-10% in the cited review), distinct from the broader group with any mucosal involvement. Mixed presentations and transitions between subtypes occur.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The inflammatory type of disease appears in two-thirds of reported patients. A mixed type with features of all subtypes has also been reported
    explanation: Describes the reported, non-population subtype distribution and overlap.
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Although almost half of all patients with EBA have mucosal lesions, only 5–10% have predominant mucosal affection
    explanation: Separates predominant mucosal disease from any mucosal involvement.

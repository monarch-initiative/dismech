name: Acquired Epidermolysis Bullosa
creation_date: "2026-10-01T01:15:00Z"
category: Autoimmune
description: >-
  Epidermolysis bullosa acquisita (EBA) is an acquired, autoimmune subepidermal
  blistering disease caused by IgG autoantibodies against type VII collagen
  (COL7), the main component of the anchoring fibrils that tether the epidermal
  basement membrane to the papillary dermis. The autoantibodies target the
  non-collagenous NC1 domain and act in two ways: they directly impair
  anchoring-fibril function (the non-inflammatory, mechanobullous variant, with
  skin fragility, tense blisters, scarring and milia at trauma-prone sites) and
  they recruit complement and neutrophils whose reactive oxygen species and
  proteases split the skin below the lamina densa (the inflammatory variants,
  which mimic bullous pemphigoid and other autoimmune bullous dermatoses).
  Diagnosis rests on linear IgG at the dermal-epidermal junction with a
  u-serrated pattern, dermal-floor binding on salt-split skin, and anti-COL7
  ELISA. EBA is distinct from the inherited epidermolysis bullosa forms.
disease_term:
  preferred_term: epidermolysis bullosa acquisita
  term:
    id: MONDO:0018747
    label: acquired epidermolysis bullosa
synonyms:
- epidermolysis bullosa acquisita
- EBA
- EB acquisita
parents:
- Autoimmune Disease
- Skin Disease
notes: >-
  EBA is an acquired autoimmune disease, not an inherited epidermolysis bullosa:
  COL7 (gene COL7A1) is the autoantigen bound by IgG, not a mutated host gene, so
  it is modelled on the pathograph as the antibody target rather than in the
  genetic section. HLA-DRB1*15:03 is a susceptibility factor only. No GeneReviews
  chapter exists (EBA is a complex autoimmune disease, not Mendelian); a
  StatPearls chapter exists for orientation but is not a phenotype baseline.
  The two clinical subtypes (mechanobullous, inflammatory) are modelled as
  has_subtypes rather than separate entries because they share one conserved
  pathograph that branches at the autoantibody-binding step. Inflammatory bowel
  disease is the best-established systemic association: it has been reported in
  roughly 30% of EBA patients (Crohn disease in at least 25 reported cases),
  though many reports predate modern IBD diagnostic criteria (PMID:23956869), so
  a gastroenterology review is advised. IBD is recorded here rather than as a
  phenotype because it is a comorbid disease, not a feature of EBA.
has_subtypes:
- name: Mechanobullous
  display_name: Mechanobullous (classical, non-inflammatory)
  description: >-
    Non-inflammatory variant (~1/3 of patients): skin fragility, tense blisters,
    scarring and milia at trauma-prone and extensor sites, driven by direct
    impairment of anchoring-fibril function.
- name: Inflammatory
  display_name: Inflammatory EBA
  description: >-
    Inflammatory variants (~2/3 of patients) that clinically mimic bullous
    pemphigoid, linear IgA disease, mucous membrane pemphigoid or Brunsting-Perry
    pemphigoid, driven by complement- and neutrophil-mediated inflammation. A
    mucosa-predominant form occurs in roughly 5-10% of patients.

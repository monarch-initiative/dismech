    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Pharmacological inhibition or deficiency of human NADPH oxidase abolished dermal-epidermal separation caused by autoantibodies and granulocytes ex vivo.
    explanation: Human ex vivo dependence on NADPH oxidase.

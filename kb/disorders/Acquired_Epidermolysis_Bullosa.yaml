diagnosis:
- name: Direct immunofluorescence with u-serrated pattern
  description: >-
    Direct immunofluorescence of perilesional skin shows linear IgG along the
    dermal-epidermal junction; at high magnification a u-serrated pattern
    distinguishes EBA from other subepidermal bullous diseases.
  evidence:
  - reference: PMID:23956869
    reference_title: "Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the detection of tissue-bound antibodies by direct IF microscopy, and the
      detection of circulating antibodies directed against COL7 and/or a
      u-serrated pattern in direct IF microscopy
    explanation: DIF with a u-serrated pattern is central to the diagnosis of EBA.
- name: Salt-split skin indirect immunofluorescence
  description: >-
    On salt-split skin, EBA autoantibodies bind the dermal (floor) side of the
    artificial blister, distinguishing EBA from bullous pemphigoid (roof).
  evidence:
  - reference: PMID:23956869
    reference_title: "Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      binding to the blister floor in salt-split skin in indirect IF microscopy
      point towards anti-COL7 antibodies
    explanation: Dermal-floor binding on salt-split skin indicates anti-COL7 antibodies.
- name: Anti-type-VII-collagen ELISA
  description: >-
    ELISA for serum IgG against the NC1 (and NC2) epitopes of type VII collagen
    confirms the diagnosis and tracks disease activity.
  evidence:
  - reference: PMID:22913489
    reference_title: "Diagnosis and disease severity assessment of epidermolysis bullosa acquisita by ELISA for anti-type VII collagen autoantibodies: an Italian multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This NC1+NC2 ELISA can be a practical assay for the diagnosis of EBA
    explanation: Anti-COL7 NC1+NC2 ELISA is a practical diagnostic assay.
animal_models:
- name: Anti-type-VII-collagen IgG passive-transfer mouse
  species: Mouse
  genotype: Wild-type and complement/NADPH-oxidase-deficient strains injected with anti-COL7 IgG
  publication: PMID:17475881
  description: >-
    Passive transfer of anti-type VII collagen IgG into mice reproduces
    subepidermal blistering; gene-knockout strains dissect the complement and
    neutrophil effector steps.
  modeled_mechanisms:
  - target: Complement Activation and Neutrophil Recruitment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The passive-transfer model reproduces complement- and neutrophil-dependent
      blistering; alternative-pathway (factor B) deficiency attenuates it.
    limitations: >-
      Rabbit anti-mouse-COL7 IgG rather than human autoantibody, and acute
      induced blistering rather than the chronic human disease.
    evidence:
    - reference: PMID:17475881
      reference_title: The alternative pathway of complement activation is critical for blister induction in experimental epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The passive transfer of Abs against type VII collagen into mice induces a
        subepidermal blistering disease dependent upon activation of terminal
        complement components
      explanation: The model reproduces complement-dependent subepidermal blistering.
  - target: Neutrophil Reactive Oxygen Species and Protease-Mediated Dermal-Epidermal Separation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      NADPH-oxidase-deficient mice are resistant to blistering, showing the model
      reproduces the neutrophil reactive-oxygen-species effector step.
    limitations: >-
      Induced acute model; does not capture the chronic, relapsing human course.
    evidence:
    - reference: PMID:17380558
      reference_title: NADPH oxidase is required for neutrophil-dependent autoantibody-induced tissue damage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        granulocyte nicotinamide adenine dinucleotide phosphate (NADPH) oxidase
        crucially contributes to tissue injury in experimental models of the
        antibody-mediated autoimmune disease epidermolysis bullosa acquisita
      explanation: The model reproduces the neutrophil NADPH-oxidase effector step.

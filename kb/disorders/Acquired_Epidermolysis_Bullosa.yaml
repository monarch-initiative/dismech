- name: Intravenous immunoglobulin
  description: >-
    High-dose IVIG is used for severe refractory EBA, sometimes with rituximab or other therapies. Uncontrolled series report responses, but improvement need not mean complete or durable remission. In the 2023 four-case report, case 2 improved without complete remission, whereas case 3 had recurrent activity after IVIG and subsequently received rituximab.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  evidence:

    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      IVIG has been shown effective in severe EBA cases after exhausting most
      available treatments of EBA
    explanation: IVIG is used for severe refractory EBA.

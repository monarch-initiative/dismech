  evidence:
  - reference: PMID:25689103
    reference_title: Autoantibodies to Multiple Epitopes on the Non-Collagenous-1 Domain of Type VII Collagen Induce Blisters.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Most EBA patients' sera react with epitopes located within the
      non-collagenous 1 (NC1) domain of human COL7.
    explanation: >-
      Locates the autoantibody response in the NC1 domain of type VII collagen.
- name: Autoantibody Binding to Type VII Collagen at the Dermal-Epidermal Junction
  biological_scale: TISSUE
  description: >-
    Anti-COL7 IgG binds type VII collagen in the anchoring fibrils at the
    dermal-epidermal junction, producing linear IgG deposits. Binding has two
    consequences that define the two clinical variants: it directly impairs
    anchoring-fibril function (mechanobullous) and it triggers complement and
    neutrophil recruitment (inflammatory).
  genes:
  - preferred_term: COL7A1
    term:
      id: hgnc:2214
      label: COL7A1
  molecular_functions:
  - preferred_term: anchoring-fibril collagen (extracellular matrix structural constituent)
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  locations:
  - preferred_term: epidermal-dermal junction
    term:
      id: UBERON:0008877
      label: epidermal-dermal junction
  downstream:
  - target: Skin fragility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Antibody-mediated impairment of anchoring-fibril function is the proposed
      mechanobullous mechanism (weakened dermoepidermal adherence without
      inflammation); the direct F(ab)-mediated effect on adhesion is the accepted
      model but remains to be experimentally confirmed.
    evidence:
    - reference: PMID:23956869
      reference_title: "Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This may explain the pathogenesis of noninflammatory, mechanobullous EBA;
        however, this assumption needs to be experimentally confirmed.
      explanation: >-
        The review states the direct anchoring-fibril-impairment hypothesis for
        mechanobullous EBA and that it remains to be experimentally confirmed,
        which is exactly why this edge is hedged as indirect.
  - target: Complement Activation and Neutrophil Recruitment
    causal_link_type: DIRECT
    description: >-
      Bound IgG recruits complement and Fc-gamma-receptor-bearing cells, the
      inflammatory mechanism.
  evidence:
  - reference: PMID:22913489
    reference_title: "Diagnosis and disease severity assessment of epidermolysis bullosa acquisita by ELISA for anti-type VII collagen autoantibodies: an Italian multicentre study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      autoantibodies against type VII collagen, a component of anchoring fibrils
      that stabilizes dermoepidermal adherence
    explanation: >-
      Identifies type VII collagen in the anchoring fibrils as the autoantigen
      stabilizing dermoepidermal adherence.
  - reference: PMID:23956869
    reference_title: "Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      This led to a linear IgG deposition along the dermal-epidermal junction
    explanation: >-
      Incubation of human skin cryosections with EBA-patient IgG deposits linear
      IgG along the dermal-epidermal junction (ex vivo).
- name: Complement Activation and Neutrophil Recruitment
  biological_scale: TISSUE
  description: >-
    Immune complexes at the dermal-epidermal junction activate complement
    (notably the alternative pathway) and engage Fc-gamma receptors, recruiting
    neutrophils to the junction. This step drives the inflammatory variants.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  - preferred_term: neutrophil migration
    term:
      id: GO:1990266
      label: neutrophil migration
    modifier: INCREASED
  locations:
  - preferred_term: epidermal-dermal junction
    term:
      id: UBERON:0008877
      label: epidermal-dermal junction
  downstream:
  - target: Neutrophil Reactive Oxygen Species and Protease-Mediated Dermal-Epidermal Separation
    causal_link_type: DIRECT
    description: >-
      Recruited neutrophils are activated at the junction and release their
      tissue-damaging effectors.
    evidence:
    - reference: PMID:17475881
      reference_title: The alternative pathway of complement activation is critical for blister induction in experimental epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        factor B-deficient mice developed a delayed and significantly less
        severe blistering disease compared with factor B-sufficient mice
      explanation: >-
        Alternative-pathway complement (factor B) is required for full
        neutrophil-driven blistering in experimental EBA.
  evidence:
  - reference: PMID:17475881

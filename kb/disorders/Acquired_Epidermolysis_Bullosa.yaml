diagnosis:
- name: Integrated clinical and immunopathological diagnosis
  description: Clinical morphology alone is insufficient. Histology, perilesional DIF and COL7-specific or antigen-localization tests are combined according to availability. The 2018 international consensus established nine criteria but no single worldwide procedure; its stated limitation was not addressing bullous systemic lupus erythematosus.
  evidence:
  - reference: PMID:29165796
    reference_title: 'International Bullous Diseases Group: consensus on diagnostic criteria for epidermolysis bullosa acquisita.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: This included nine diagnostic criteria, which are summarized in a flow chart. The IBDG was unable to determine one procedure that would be applicable worldwide. A limitation of the study is that differential diagnosis of bullous systemic lupus erythematosus has not been addressed.
    explanation: Defines both the consensus scope and its limitations.
- name: Direct immunofluorescence and serration analysis
  description: Linear IgG and/or C3, sometimes IgA, at the epithelial basement membrane supports an autoimmune subepithelial blistering disorder but is not EBA-specific. A u-serrated pattern supports COL7-level autoimmunity and can occur in EBA or bullous systemic lupus. Serration may not be interpretable, particularly in mucosal samples.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: is pathognomonic for skin-bound autoantibodies against type-VII collagen found in EBA and bullous systemic lupus erythematosus (BSLE)
    explanation: The u-serrated pattern identifies COL7-level autoimmunity rather than EBA alone.
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Additionally, in mucosal biopsies and the number of skin samples, the serration pattern cannot be identified.
    explanation: A noninterpretable serration pattern does not exclude EBA.
- name: Salt-split skin indirect immunofluorescence
  description: 'Dermal-floor binding is compatible with EBA, in contrast to typical epidermal-roof binding in bullous pemphigoid. It is not specific: anti-p200/laminin gamma-1 and anti-laminin-332 pemphigoid also bind the floor, requiring antigen-specific discrimination.'
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Since this dermal labeling is not specific, patients with anti-p200/laminin ƴ1 pemphigoid and anti-laminin 332 pemphigoid also reveal autoantibodies attached to the blister floor
    explanation: Explicitly limits the specificity of floor binding.
- name: Anti-type-VII-collagen serology
  description: COL7 ELISA or immunoblot supports diagnosis in context. In one 14-patient NC1+NC2 ELISA study, 12/14 EBA samples were positive (86% sensitivity); two bullous-pemphigoid controls were positive among 143 controls (98.6% specificity). Titres correlated with activity in this small sample, but larger validation was requested. Negative serum testing does not exclude EBA, and IgG-only assays can miss IgA-only disease.
  evidence:
  - reference: PMID:22913489
    reference_title: 'Diagnosis and disease severity assessment of epidermolysis bullosa acquisita by ELISA for anti-type VII collagen autoantibodies: an Italian multicentre study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 12 out of the 14 samples were positive in ELISA
    explanation: Provides the case denominator and observed positivity, not universal sensitivity.
  - reference: PMID:22913489
    reference_title: 'Diagnosis and disease severity assessment of epidermolysis bullosa acquisita by ELISA for anti-type VII collagen autoantibodies: an Italian multicentre study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Among the controls, only two bullous pemphigoid sera tested positive, the specificity being 98·6%.
    explanation: Shows imperfect specificity.
  - reference: PMID:22913489
    reference_title: 'Diagnosis and disease severity assessment of epidermolysis bullosa acquisita by ELISA for anti-type VII collagen autoantibodies: an Italian multicentre study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The correlation between autoantibody titres and disease severity suggests its usefulness as a marker of disease activity in EBA However, this should be confirmed by studies on larger series of patients.
    explanation: The activity association is preliminary.
  - reference: PMID:37503352
    reference_title: 'Case Report: Biological treatment of epidermolysis bullosa acquisita: report on four cases and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The other two patients tested negative in serum studies using IIF on salt-split skin, ELISA and BIOCHIP  # codespell:ignore iif
    explanation: Cases 1 and 2 illustrate serum-negative disease.
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: a group of EBA patients with only positive IgA autoantibodies may not be picked up on IB IgG assay
    explanation: The limitation is assay-isotype dependent.
- name: Specialist antigen-localization tests
  description: 'In serum-negative or ambiguous cases, specialist tests can localize tissue-bound antibodies to the anchoring-fibril region: immunoelectron microscopy, fluorescence overlay antigen mapping below type IV collagen, or testing on COL7-deficient substrates. Availability is limited, and results require clinical interpretation.'
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Direct transmission electron microscopy (IEM) in EBA patients shows in vivo bound thick immune deposits in the anchoring fibrils (AF) zone below lamina densa (LD).
    explanation: Establishes the ultrastructural localization.
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: in vivo-bound immune deposits below type-IV collagen by FOAM
    explanation: Describes localization in the seronegative diagnostic framework.
animal_models:
- name: Anti-type-VII-collagen IgG passive-transfer mouse
  species: Mouse
  genotype: Wild-type and complement/NADPH-oxidase-deficient strains injected with anti-COL7 IgG
  publication: PMID:17475881
  description: >-
    Passive transfer of anti-type VII collagen IgG into mice reproduces
    subepidermal blistering; gene-knockout strains dissect the complement and
    neutrophil effector steps.
  modeled_mechanisms:
  - target: Complement Activation at the Dermal-Epidermal Junction
    description: Factor B deficiency attenuates anti-COL7-induced blistering.
    evidence:
    - reference: PMID:17475881
      reference_title: The alternative pathway of complement activation is critical for blister induction in experimental epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: factor B-deficient mice developed a delayed and significantly less severe blistering disease compared with factor B-sufficient mice
      explanation: Shows alternative-pathway dependence in this passive-transfer experiment.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: Acute antibody-transfer model bypasses tolerance loss and endogenous antibody induction.
    fidelity: MODERATE
  - target: Neutrophil NADPH-Oxidase-Dependent Reactive Oxygen Species Production
    description: Ncf1-deficient animals resist blister induction.
    evidence:
    - reference: PMID:17380558
      reference_title: NADPH oxidase is required for neutrophil-dependent autoantibody-induced tissue damage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Neutrophil cytosolic factor 1-deficient mice lacking functional NADPH oxidase were resistant to skin blistering by the passive transfer of antibodies against type VII collagen.
      explanation: Demonstrates oxidative-burst dependence in mice.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Induced mouse disease does not establish clinical response to oxidase blockade in people.
    fidelity: MODERATE
- name: COL7 immunization-induced mouse EBA
  species: Mouse
  genotype: Susceptible inbred strains immunized with recombinant murine COL7 fragments
  description: Active immunization generates an endogenous antibody response and permits study of induction as well as effector phases. Susceptibility depends on strain, antigen and protocol; immunization is not the spontaneous human initiating event.
  modeled_mechanisms:
  - target: COL7-Reactive CD4 T-Cell Response
    description: CD4 depletion delays antibody induction and blistering.
    evidence:
    - reference: PMID:23956869
      reference_title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Depletion of CD4 T cells for two weeks starting one day prior to immunization significantly delayed both autoantibody production and the onset of clinical disease.
      explanation: Timed depletion establishes an induction-phase contribution.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Artificial antigen/adjuvant immunization and strain-dependent susceptibility.
    fidelity: MODERATE
  - target: Anti-Type-VII-Collagen Autoantibody Production
    description: The model generates anti-COL7 antibodies rather than supplying them by passive transfer.
    evidence:
    - reference: PMID:23956869
      reference_title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: Depletion of CD4 T cells for two weeks starting one day prior to immunization significantly delayed both autoantibody production and the onset of clinical disease.
      explanation: Timed depletion establishes an induction-phase contribution.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Does not identify the cause of spontaneous tolerance loss in people.
    fidelity: MODERATE
- name: IFN-gamma blockade in passive-transfer mouse EBA
  species: Mouse
  genotype: C57BL/6J mice receiving rabbit anti-murine COL7 IgG
  publication: PMID:38799441
  description: Randomized, blinded assessments tested rat anti-murine IFN-gamma starting one day before antibody transfer. The highest dose reduced late disease burden and neutrophil infiltration; skin-bound IgG was unchanged and C3 deposition increased. The study does not test treatment initiated after established EBA or human clinical efficacy.
  modeled_mechanisms:
  - target: IFN-Gamma-Dependent Amplification of Cutaneous Inflammation
    description: Neutralization reduces disease expression in the model.
    evidence:
    - reference: PMID:38799441
      reference_title: Inhibition of interferon gamma impairs induction of experimental epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The impact of IFN-γ inhibition on disease manifestation is significant but, compared to other drugs used in this model, relatively moderate.
      explanation: The authors characterize the effect as moderate.
    relationship: PERTURBS
    model_scale: TISSUE
    limitations: Prophylactic antibody-transfer protocol; not emapalumab treatment of human EBA.
    fidelity: MODERATE
- name: Human COL7 transgenic mouse antibody-transfer EBA
  species: Mouse
  genotype: Murine Col7 null with a human COL7 transgene
  publication: PMID:25689103
  description: Rabbit antibodies against two human NC1 subdomains induced subepidermal blisters. This establishes pathogenic potential across more than one epitope region; it does not map each human clinical subtype to an epitope.
  modeled_mechanisms:
  - target: Subepidermal Blister Formation
    description: Antibodies against human COL7 induce tissue separation in the humanized animal.
    evidence:
    - reference: PMID:25689103
      reference_title: Autoantibodies to Multiple Epitopes on the Non-Collagenous-1 Domain of Type VII Collagen Induce Blisters.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Antibodies against two of these subdomains were injected into mice carrying null mutations of mouse COL7 and the human COL7 transgene and induced subepidermal blisters.
      explanation: Rabbit antibodies recognizing human COL7 NC1 subdomains were pathogenic in humanized mice.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: Human target protein in a mouse effector environment, with rabbit antibodies rather than spontaneous human autoimmunity.
    fidelity: MODERATE
mechanistic_hypotheses:
- hypothesis_group_id: direct_adhesion_interference
  hypothesis_label: Direct anti-COL7 interference with anchoring-fibril adhesion
  status: ALTERNATIVE
  description: Proposed explanation for mechanobullous fragility, not an experimentally established exclusive subtype mechanism.
  applies_to_subtypes:
  - Mechanobullous
  evidence:
  - reference: PMID:23956869
    reference_title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: This may explain the pathogenesis of noninflammatory, mechanobullous EBA; however, this assumption needs to be experimentally confirmed.
    explanation: Direct interference with anchoring-fibril interactions is an unconfirmed explanatory hypothesis.
differential_diagnoses:
- name: Bullous systemic lupus erythematosus
  description: COL7 autoimmunity, u-serration and dermal-floor binding overlap with EBA.
  distinguishing_features:
  - Evaluate the systemic lupus clinical and serological context; COL7 positivity alone does not distinguish the disorders.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: type-VII collagen found in EBA and bullous systemic lupus erythematosus (BSLE)
    explanation: Documents the shared target-level diagnostic pattern.
- name: Bullous pemphigoid
  description: Inflammatory EBA may resemble bullous pemphigoid.
  distinguishing_features:
  - Typical BP antibodies bind the epidermal roof of salt-split skin; EBA antibodies bind the floor. Antigen-specific testing is needed in ambiguous cases.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: immune deposits in patients with EBA remains on the dermal floor, while immune deposits in patients with BP remain within the epidermal roof
    explanation: Describes the usual split-skin distinction.
- name: Anti-p200 and anti-laminin-332 pemphigoid
  description: These diseases can share dermal-floor binding with EBA.
  distinguishing_features:
  - Use antigen-specific studies to distinguish p200/laminin gamma-1 or laminin-332 reactivity from COL7 autoimmunity.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: patients with anti-p200/laminin ƴ1 pemphigoid and anti-laminin 332 pemphigoid also reveal autoantibodies attached to the blister floor
    explanation: Floor binding cannot establish EBA alone.
- name: Inherited dystrophic epidermolysis bullosa
  description: The mechanobullous phenotype can resemble inherited dystrophic EB.
  distinguishing_features:
  - EBA is acquired COL7 autoimmunity; inherited dystrophic EB is a genetically determined disorder. Age alone is insufficient because EBA can occur in children.
  evidence:
  - reference: PMID:32119399
    reference_title: Epidermolysis Bullosa Acquisita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Classic mechanobullous EBA resembles dystrophic epidermolysis bullosa (EB), with bullae and erosions developing at sites of trauma.
    explanation: Describes the clinical overlap.
- name: Porphyria cutanea tarda and pseudoporphyria
  description: Trauma-prone blistering and fragility may mimic mechanobullous EBA.
  distinguishing_features:
  - The immunopathological evidence for COL7 autoimmunity must be interpreted alongside the clinical differential.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: So, in differential diagnosis, porphyria cutanea tarda, and pseudoporphyria must be excluded.
    explanation: The classical EBA section identifies these mimics.
experimental_models:
- name: Human skin cryosection and neutrophil separation assay
  experimental_model_type: OTHER
  description: Human skin cryosections incubated with patient anti-COL7 IgG and healthy-donor neutrophils model the effector phase. Antibody binding alone did not produce separation. NADPH-oxidase inhibition or deficient granulocytes prevent separation in this assay.
  cell_source: Human skin cryosections, EBA-patient antibodies and donor granulocytes
  modeled_mechanisms:
  - target: Neutrophil NADPH-Oxidase-Dependent Reactive Oxygen Species Production
    description: Manipulating granulocyte NADPH oxidase changes tissue separation.
    evidence:
    - reference: PMID:17380558
      reference_title: NADPH oxidase is required for neutrophil-dependent autoantibody-induced tissue damage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Pharmacological inhibition or deficiency of human NADPH oxidase abolished dermal-epidermal separation caused by autoantibodies and granulocytes ex vivo.
      explanation: Human ex vivo dependence on NADPH oxidase.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Ex vivo tissue assay lacks circulation, tolerance induction and chronic healing.
    fidelity: MODERATE
  - target: Subepidermal Blister Formation
    description: The assay measures dermal-epidermal separation after antibody and neutrophil exposure.
    evidence:
    - reference: PMID:17380558
      reference_title: NADPH oxidase is required for neutrophil-dependent autoantibody-induced tissue damage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Pharmacological inhibition or deficiency of human NADPH oxidase abolished dermal-epidermal separation caused by autoantibodies and granulocytes ex vivo.
      explanation: Human ex vivo dependence on NADPH oxidase.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: TISSUE
    limitations: Experimental separation is not a measured clinical treatment response.
    fidelity: MODERATE

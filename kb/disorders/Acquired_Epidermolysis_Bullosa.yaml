    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The reduced clinical disease in mice treated with the highest dose of the IFN-γ antibody was accompanied with a reduced dermal leukocyte infiltration
    explanation: IFN-gamma blockade begun before antibody transfer reduced inflammation in mice.

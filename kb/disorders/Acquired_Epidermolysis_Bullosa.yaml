clinical_burden:
  burden_level: MODERATE
  rationale: >-
    EBA is a chronic, relapsing blistering disease that is often refractory to
    treatment and requires prolonged immunosuppression; the mechanobullous form
    heals with scarring and milia, and inflammatory forms can involve mucosae.
  evidence:
  - reference: PMID:36769788
    reference_title: Epidermolysis Bullosa Acquisita-Current and Emerging Treatments.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      classical mechanobullous form have been reported to be refractory to
      systemic corticosteroids, azathioprine, methotrexate, and cyclophosphamide
    explanation: Documents the treatment-refractory, chronic course of EBA.
pathophysiology:
- name: HLA-DRB1-Associated Loss of Tolerance to Type VII Collagen
  biological_scale: MOLECULAR
  description: >-
    EBA is associated with the HLA-DRB1*15:03 haplotype, a class II
    susceptibility factor that permits presentation of type VII collagen peptides
    and loss of tolerance; EBA itself is acquired, not inherited.
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  molecular_functions:
  - preferred_term: MHC class II peptide antigen binding
    term:
      id: GO:0042605
      label: peptide antigen binding
  downstream:
  - target: Anti-Type-VII-Collagen IgG Autoantibody Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The permissive HLA haplotype licenses the autoimmune response against type
      VII collagen.
  evidence:
  - reference: PMID:23956869
    reference_title: "Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      HLA-DRB1*15:03 was found to be associated with EBA
    explanation: Establishes the HLA-DRB1 susceptibility association.
- name: Anti-Type-VII-Collagen IgG Autoantibody Response
  biological_scale: CELLULAR
  description: >-
    Autoreactive B cells and plasma cells produce IgG autoantibodies against type
    VII collagen, mostly recognizing epitopes within its non-collagenous NC1
    domain. These autoantibodies are directly pathogenic.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  downstream:
  - target: Autoantibody Binding to Type VII Collagen at the Dermal-Epidermal Junction
    causal_link_type: DIRECT
    description: >-
      The IgG autoantibodies bind type VII collagen in the anchoring fibrils.
    evidence:
    - reference: PMID:25689103
      reference_title: Autoantibodies to Multiple Epitopes on the Non-Collagenous-1 Domain of Type VII Collagen Induce Blisters.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        we provide in vivo evidence of pathogenicity of autoantibodies binding to
        human COL7
      explanation: >-
        In COL7-humanized mice, anti-human-COL7 autoantibodies are pathogenic in

- name: COL7-Reactive CD4 T-Cell Response
  description: COL7-reactive T cells are reported in patients. CD4 depletion delays autoantibody induction in immunized mice, supporting T-cell help in the induction phase; this model does not identify the spontaneous human trigger.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:23956869
    reference_title: Clinical presentation, pathogenesis, diagnosis, and treatment of epidermolysis bullosa acquisita.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Depletion of CD4 T cells for two weeks starting one day prior to immunization significantly delayed both autoantibody production and the onset of clinical disease.
    explanation: Timed depletion establishes a CD4 T-cell contribution in immunization-induced mouse EBA.
  - reference: PMID:36769788

- reference: PMID:38799441
  title: Inhibition of interferon gamma impairs induction of experimental epidermolysis bullosa acquisita.
  findings:
  - statement: Prophylactic IFN-gamma blockade reduced mouse lesions despite unchanged tissue IgG and increased C3 deposition; complement deposition alone is not a monotonic readout of disease severity.
    evidence:
    - reference: PMID:38799441
      reference_title: Inhibition of interferon gamma impairs induction of experimental epidermolysis bullosa acquisita.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Tissue- bound IgG in the skin and circulating total mouse IgG were also identical among the groups. However, C3 deposits along the dermal epidermal junction were significantly increased in the two highest treated groups compared to that in isotype antibody- treated mice.
      explanation: The full results qualify a simple interpretation of complement staining.

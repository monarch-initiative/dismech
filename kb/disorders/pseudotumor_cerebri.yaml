      explanation: >-
        Chronic testosterone increases secretion and ICP in female rats through an
        NKCC1-associated mechanism;
        human IIH secretion was not measured.
    hypothesis_groups:
    - choroid_plexus_csf_hypersecretion
- name: Venous sinus stenosis
  description: >-
    Transverse-sigmoid sinus narrowing can reflect an intrinsic luminal lesion or
    extrinsic pressure-dependent
    compression. The relative distribution in stenting cohorts cannot be generalized
    to all IIH. Persistence
    of intrinsic narrowing after ICP normalization supports an anatomic contributor
    but does not by itself
    establish the initiating event.
  evidence:
  - reference: PMID:37410913
    reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Venous sinus stenosis, typically at the junction of the transverse and sigmoid
      sinus, is increasingly
      recognized as a contributor to the pathophysiology of idiopathic intracranial
      hypertension (IIH),
      whether it be the intrinsic type that does not reverse with normalization of
      intracranial pressure
      or the extrinsic type, which does.
    explanation: >-
      Intrinsic and pressure-responsive extrinsic lesions are distinct morphologies;
      persistence alone
      does not prove that the lesion preceded IIH.
  downstream:
  - target: Intracranial venous hypertension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A hemodynamically significant narrowing raises upstream venous pressure through
      a trans-stenotic
      gradient.
    evidence:
    - reference: PMID:37410913
      reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Venous sinus stenosis, typically at the junction of the transverse and sigmoid
        sinus, is increasingly
        recognized as a contributor to the pathophysiology of idiopathic intracranial
        hypertension (IIH),
        whether it be the intrinsic type that does not reverse with normalization
        of intracranial pressure
        or the extrinsic type, which does.
      explanation: >-
        Intrinsic and pressure-responsive extrinsic lesions are distinct morphologies;
        persistence alone
        does not prove that the lesion preceded IIH.
    hypothesis_groups:
    - primary_venous_sinus_obstruction
  - target: Pulsatile tinnitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal venous flow is a proposed source of pulse-synchronous sound; the auditory
      mechanism is
      inferred and is not proven in every patient.
    evidence:
    - reference: PMID:37410913
      reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        pulsatile tinnitus resolved in 84.7% of 515
      explanation: >-
        Resolution after stenting supports an indirect venous contribution in selected
        treated patients.
      directness: INDIRECT

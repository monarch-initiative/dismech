diagnosis:
- name: Brain MRI and venography
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain imaging excludes structural causes, and CT or MR venography excludes cerebral
    venous thrombosis.
    Empty sella, optic nerve sheath distension and sinus narrowing can support the
    assessment but are
    not independently diagnostic.
  results: Normal brain imaging without mass lesion supports IIH after exclusion of secondary causes.
  evidence:
  - reference: PMID:30298346
    reference_title: European headache federation guideline on idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnostic brain imaging in IIH should always include a CT- or MR venography
    explanation: >-
      Supports venous imaging in addition to brain MRI; the surrounding recommendation
      specifies exclusion
      of venous thrombosis.
- name: Lumbar puncture with opening pressure measurement
  description: >-
    After appropriate imaging, lumbar puncture documents opening pressure and CSF
    composition. Adult pressure
    above 25 cm CSF supports IIH in the complete clinical context; pediatric thresholds
    and sedation require
    age-specific interpretation. A single borderline result is not independently diagnostic.
  results: Elevated opening pressure with normal CSF composition supports the diagnosis.
  evidence:
  - reference: PMID:12455560
    reference_title: Diagnostic criteria for idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The syndrome of increased intracranial pressure without hydrocephalus or mass
      lesion and with normal
      CSF composition
    explanation: This directly supports lumbar puncture-based confirmation of pressure elevation with normal CSF composition.
  - reference: PMID:23966248
    reference_title: Revised diagnostic criteria for the pseudotumor cerebri syndrome in adults and children.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      clarification of normal opening pressure in children, and features distinguishing
      the syndrome of
      intracranial hypertension without papilledema from intracranial hypertension
      with papilledema
    explanation: >-
      Revised criteria distinguish pediatric pressure interpretation and the rare
      presentation without
      papilledema.
- name: Neuro-ophthalmic examination and formal perimetry
  description: >-
    Confirm papilledema, distinguish pseudopapilledema, and document visual acuity,
    pupils, fundus appearance
    and formal visual fields. OCT helps monitor optic nerve head swelling, but central
    acuity alone can
    miss functionally relevant field loss.
  evidence:
  - reference: PMID:24756302
    reference_title: 'The idiopathic intracranial hypertension treatment trial: clinical profile at baseline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with IIH with mild visual loss have typical symptoms, may have mild
      acuity loss, and have
      visual field defects, with predominantly arcuate loss and enlarged blind spots
      that require formal
      perimetry for detection.
    explanation: >-
      Supports formal perimetry rather than relying on acuity alone.

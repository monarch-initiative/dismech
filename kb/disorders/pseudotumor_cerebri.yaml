- name: Venous sinus stenting
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: venous sinus stenting
    term:
      id: NCIT:C157840
      label: Endovascular Stenting
  description: >-
    An option for selected medically refractory IIH with hemodynamically significant
    stenosis. Observational
    studies support pressure and visual improvement; thrombosis, hemorrhage, restenosis
    and retreatment
    are relevant limitations, and clinical response does not prove venous stenosis
    was the initiating
    lesion.
  evidence:
  - reference: PMID:37410913
    reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A growing body of evidence supports the use of venous sinus stenting as a viable
      option for medically
      refractory IIH, especially when papilledema threatens visual function.
    explanation: >-
      The evidence is largely nonrandomized and applies to selected patients with
      relevant venous stenosis.
  target_mechanisms:
  - target: Venous sinus stenosis
    treatment_effect: MODULATES
    description: >-
      Stenting expands the narrowed lumen and reduces the trans-stenotic pressure
      gradient.
    evidence:
    - reference: PMID:37410913
      reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'

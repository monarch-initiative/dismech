mechanistic_hypotheses:
- hypothesis_group_id: choroid_plexus_csf_hypersecretion
  hypothesis_label: Choroid Plexus CSF Hypersecretion (Metabolic-Hormonal) Model
  status: EMERGING
  description: >-
    A converging working model places obesity-associated metabolic and hormonal
    dysregulation upstream of choroid plexus cerebrospinal fluid hypersecretion as
    the primary driver of raised intracranial pressure. Visceral adiposity is
    proposed to elevate adipose 11-beta-hydroxysteroid dehydrogenase type 1
    activity and circulating androgens, and obesity-associated GLP-1 signaling is
    proposed to act on choroid plexus epithelium, together stimulating choroid
    plexus Na+/K+-ATPase-driven CSF secretion. Pharmacological proof-of-concept
    from 11-beta-HSD1 inhibition and GLP-1 receptor agonism reducing intracranial
    pressure has driven interest in this model, and on this view transverse sinus
    stenosis is an amplifying feedback consequence of raised pressure rather than
    the initiating lesion.
  evidence:
  - reference: PMID:34929642
    reference_title: "Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      recent studies highlighting the pathogenic role of metabolic and hormonal factors have led to the identification of several pharmacological targets and development of novel therapeutic agents
    explanation: >-
      This supports a metabolic-hormonal driver upstream of CSF dynamics and the
      emergence of targeted pharmacological therapies consistent with the
      choroid plexus hypersecretion model.
  - reference: PMID:40937960
    reference_title: "Efficacy and Safety of GLP-1 and Dual GIP/GLP-1 Receptor Agonists in Idiopathic Intracranial Hypertension: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No association was detected between GLP-1 RAs and body mass index.
    explanation: >-
      Across 1,550 patients the benefit of GLP-1 receptor agonism did not track
      with weight change, which is the discriminating prediction of a direct
      choroid plexus action rather than an indirect weight-loss effect.
  - reference: PMID:37328884
    reference_title: "Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HFD-fed rats presented with increased ICP (65%), which was accompanied by increased CSF outflow resistance (50%) without altered CSF secretion rate or choroid plexus gene expression.
    explanation: >-
      Contradicts the specific claim that adiposity raises intracranial pressure
      by way of choroid plexus hypersecretion. In this model the route from diet
      to raised pressure was reduced drainage capacity, with secretion rate and
      choroid plexus transcription unchanged.
  - reference: PMID:38273331
    reference_title: CSF hyperdynamics in rats mimicking the obesity and androgen excess characteristic of patients with idiopathic intracranial hypertension.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adjuvant testosterone treatment of obese rats elevated the CSF secretion rate, although with no effect on the ICP, due to elevated CSF drainage capacity of these rats.
    explanation: >-
      Contradicts the claim that raised secretion is by itself sufficient to
      raise intracranial pressure. Drainage capacity absorbed the extra
      secretion, so the pressure consequence of hypersecretion is conditional on
      the state of outflow.
  notes: >-
    Status EMERGING rather than CANONICAL because the human evidence linking
    specific hormonal axes to choroid plexus secretion is still maturing. A
    dedicated Choroid plexus CSF hypersecretion pathophysiology node now
    represents the secretory arm anchored on the AZD4017 (11-beta-HSD1) and
    exenatide (GLP-1) randomized trials, but the 11-beta-HSD1 trial did not meet
    its primary endpoint, so the upstream hormonal mechanism remains a working
    model rather than established causation. The claim of primacy is the weakest
    part of the model. In rats, diet-induced obesity on its own raises
    intracranial pressure through reduced drainage rather than through
    hypersecretion, and raised secretion does not raise pressure when drainage
    capacity compensates, so hypersecretion is better read as one arm of a
    multi-mechanism disease than as the initiating event.
- hypothesis_group_id: primary_venous_sinus_obstruction
  hypothesis_label: Primary Venous Sinus Obstruction Model
  status: ALTERNATIVE
  description: >-
    An alternative model proposes transverse/sigmoid venous sinus stenosis as the
    initiating lesion: elevated dural venous sinus pressure impairs CSF absorption
    at the arachnoid granulations and raises intracranial pressure. The
    cause-versus-consequence relationship between sinus stenosis and raised
    pressure is not fully resolved, since stenosis frequently reverses after
    pressure is lowered; many authors now regard it as an amplifying feedback loop
    rather than the primary cause, though venous sinus stenting benefits a subset
    of patients.
  evidence:
  - reference: PMID:34929642
    reference_title: "Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiology involves dysregulation of cerebrospinal fluid (CSF) dynamics and venous sinus pressure
    explanation: >-
      Venous sinus pressure is recognized as part of IIH pathophysiology, but the
      review frames it alongside CSF dynamics rather than as the established
      primary cause, consistent with an alternative/contributory rather than
      canonical role.
- hypothesis_group_id: glymphatic_isf_dyshomeostasis
  hypothesis_label: Glymphatic and Interstitial Fluid Dyshomeostasis Model
  status: ALTERNATIVE
  description: >-
    A competing model relocates the primary fluid disturbance from CSF secretion
    to interstitial fluid clearance. On this view obesity-associated metabolic
    dysfunction impairs glymphatic clearance, brain interstitial fluid
    accumulates, brain volume rises, and the swollen parenchyma compresses the
    dural venous sinuses from outside. Venous hypertension then feeds back on
    glymphatic drainage, closing a loop that raises intracranial pressure
    without requiring the choroid plexus to secrete more. It explains the same
    clinical picture as the hypersecretion model and accommodates the rodent
    finding that diet-induced obesity raises pressure without changing the CSF
    secretion rate, but it has no direct measurement of glymphatic function in
    IIH patients behind it.
  evidence:
  - reference: PMID:41472646
    reference_title: "A unifying disease model of idiopathic intracranial hypertension: A narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose a unified disease model where obesity-mediated metabolic dysfunction results in impaired glymphatic clearance with consequential accumulation of brain ISF with resultant increased brain volume.
    explanation: >-
      States the alternative causal ordering in the authors' own words. It is a
      narrative synthesis rather than a primary result, which is why the status
      here is ALTERNATIVE rather than EMERGING.
  - reference: PMID:39585390
    reference_title: Optic Nerve Sheath Dilation Is a Possible Marker of CSF Dyshomeostasis in Idiopathic Intracranial Hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, increasing PSAS/ONSD was associated with declining/worsening cerebral glymphatic clearance based on DTI-APLS (p = 0.043, R = 0.34).
    explanation: >-
      Human imaging in 55 IIH patients associating a marker of raised pressure
      with reduced glymphatic clearance, which is the closest this model
      currently comes to a direct patient-level measurement.
  notes: >-
    Recorded as ALTERNATIVE rather than EMERGING because the mechanism is
    argued from synthesis and correlational imaging, with no interventional or
    direct clearance measurement in IIH. The same imaging study also found
    choroid plexus volume rising with the pressure marker, so it does not
    discriminate between this model and the hypersecretion model; separating
    them needs paired secretion-rate and clearance measurement in the same
    patients.
discussions:
- discussion_id: gap_iih_headache_mechanism
  prompt: >-
    What is the proximate mechanism of headache in IIH, and why is it imperfectly
    coupled to the degree of intracranial pressure elevation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Headache syndrome
  - pathophysiology#CGRP-mediated trigeminovascular headache signaling
  rationale: >-
    Headache is the dominant symptomatic morbidity but its mechanism is only
    partly understood. Human CGRP provocation data now support
    trigeminovascular neuropeptide signaling and ICP pulsatility as a proximal
    mechanism, while headache can still persist or fluctuate independently of
    measured pressure. Modeling headache purely as a downstream consequence of
    raised mean pressure remains incomplete.
- discussion_id: gap_iih_venous_stenosis_cause_or_consequence
  prompt: >-
    Is transverse venous sinus stenosis a primary initiating lesion or a
    pressure-dependent feedback consequence in IIH?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Venous sinus stenosis and intracranial venous hypertension
  - pathophysiology#Dysregulated cerebrospinal fluid dynamics
  - pathophysiology#Elevated intracranial pressure
  rationale: >-
    Transverse sinus stenosis is present in most patients and venous sinus
    stenting helps a subset, yet stenosis can reverse once intracranial pressure
    is lowered. Whether it initiates the disease or amplifies an
    already-elevated-pressure state is unresolved and distinguishes the primary
    venous obstruction model from the choroid plexus hypersecretion model. The
    question may not have one answer across patients: the field distinguishes an
    extrinsic stenosis that reverses when pressure normalizes from an intrinsic
    stenosis that does not, and a substantial minority of patients carry the
    intrinsic form. If that split is real, a purely secondary reading of
    stenosis cannot be right for every patient, and mechanism may need to be
    assigned per patient rather than per disease.
  evidence:
  - reference: PMID:30219791
    reference_title: Impaired drainage of vein of Labbé following venous sinus stenting for idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stenosis was extrinsic in 63% (n=44) and intrinsic in 37% (n=26) of patients.
    explanation: >-
      Quantifies the split in a consecutive 70-patient stented series. The
      figure is incidental to that study's own question, but it is the size of
      the subgroup that a pressure-driven account of stenosis has to explain.
  - reference: PMID:37410913
    reference_title: "Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      whether it be the intrinsic type that does not reverse with normalization of intracranial pressure or the extrinsic type, which does
    explanation: >-
      States the reversibility criterion that separates the two stenosis types.
      This is a review's framing of accepted practice rather than a measured
      cohort result, so it sets up the question rather than settling it.
- discussion_id: gap_iih_sex_and_nonobese_predilection
  prompt: >-
    Why does IIH predominantly affect obese women of reproductive age, and what
    distinguishes the mechanism in non-obese or atypical cases?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Metabolic risk background
  - pathophysiology#Choroid plexus CSF hypersecretion
  rationale: >-
    The strong predilection for obese women of reproductive age implicates sex
    hormone modulation of choroid plexus secretory capacity, but the responsible
    axis is not fully characterized. A minority of patients are non-obese,
    suggesting a distinct or additional primary mechanism (e.g., medication
    exposure or venous anomaly) that the current metabolic-background node does
    not yet capture.
- discussion_id: gap_iih_obesity_venous_csf_hierarchy
  prompt: >-
    How do obesity/metabolic-hormonal drivers, venous sinus pressure and
    stenosis, and CSF production/absorption interact causally in IIH, and which
    of these is the initiating event versus an amplifying feedback consequence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Metabolic risk background
  - pathophysiology#Choroid plexus CSF hypersecretion
  - pathophysiology#Venous sinus stenosis and intracranial venous hypertension
  - pathophysiology#Dysregulated cerebrospinal fluid dynamics
  rationale: >-
    IIH is defined by raised intracranial pressure without a mass lesion, yet the
    causal ordering among its candidate mechanisms remains unresolved. Multiple
    pathways have been proposed as the underlying cause - choroid plexus CSF
    overproduction, impaired CSF outflow/absorption, elevated venous sinus
    pressure with transverse sinus stenosis, glymphatic dysfunction, and
    obesity-associated hormonal alterations - but no single theory explains the
    entire clinical picture. The metabolic-hormonal arm is an
    attractive upstream driver because pharmacological modulation lowers
    intracranial pressure, yet the AZD4017 trial missed its primary endpoint and
    the human evidence linking specific hormonal axes to choroid plexus secretion
    is still maturing. Venous sinus stenosis is present in most patients and
    stenting helps a subset, but stenosis frequently reverses once pressure is
    lowered, so it may amplify rather than initiate the disease via a positive
    feedback loop. There is even emerging argument that CSF overproduction is
    unlikely to be the primary driver and that carbonic-anhydrase inhibition
    targets a consequence rather than the cause. Disentangling which node is
    initiating versus secondary across obese, non-obese, and atypical patients is
    the central unresolved question and would reorder the entire pathophysiology
    DAG and its therapeutic targets.
  proposed_experiments:
  - experiment_id: exp_iih_mechanism_perturbation_ordering
    name: Interventional perturbation cohort to order metabolic, venous, and CSF mechanisms
    description: >-
      Enroll newly diagnosed IIH patients (obese and non-obese strata) and apply
      mechanism-specific perturbations with simultaneous multi-axis monitoring.
    experiment_type:
      preferred_term: prospective interventional mechanistic cohort study
    readouts:
    - name: Metabolic-hormonal response and intracranial pressure
      target: pathophysiology#Metabolic risk background
      description: >
        Quantify circulating metabolic and hormonal markers and body composition
        alongside intracranial pressure during a metabolic-hormonal intervention.
      assays:
      - preferred_term: serum hormone quantification
      - preferred_term: lumbar puncture opening pressure measurement
      direction: NEGATIVE
    - name: CSF secretion response to carbonic anhydrase inhibition
      target: pathophysiology#Choroid plexus CSF hypersecretion
      description: >
        Measure intracranial pressure and CSF dynamics before and after carbonic
        anhydrase inhibition.
      assays:
      - preferred_term: cerebrospinal fluid dynamics assessment
      direction: NEGATIVE
    - name: Trans-stenosis gradient and pressure coupling
      target: pathophysiology#Venous sinus stenosis and intracranial venous hypertension
      description: >
        Measure the transverse-sinus trans-stenosis pressure gradient before and
        after intracranial pressure is lowered, and before and after stenting.
      assays:
      - preferred_term: catheter cerebral venography pressure gradient measurement
      direction: POSITIVE
    decision_criterion: >-
      A node is supported as initiating/upstream if its perturbation reproducibly
      and durably lowers intracranial pressure and normalizes the other axes.
    would_support:
    - pathophysiology#Metabolic risk background
    - pathophysiology#Choroid plexus CSF hypersecretion
    - pathophysiology#Venous sinus stenosis and intracranial venous hypertension
  evidence:
  - reference: PMID:33631966
    reference_title: Diagnosis and treatment of idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several mechanisms have been proposed
      as the underlying cause of IIH, such as an overproduction of cerebrospinal fluid
      (CSF), outflow obstruction, elevated pressure in the venous sinuses and more
      recently a dysfunction in the glymphatic pathway as well as hormonal alterations.
    explanation: >-
      Directly enumerates the competing candidate mechanisms whose causal
      ordering is unresolved.
  - reference: PMID:26700907
    reference_title: "Understanding idiopathic intracranial hypertension: mechanisms, management, and future directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenesis has not been fully elucidated, but several causal factors have been
      proposed.
    explanation: >-
      Confirms that the pathogenesis and causal ordering of the proposed factors
      remain unestablished.
- discussion_id: gap_iih_human_csf_secretion_rate_unmeasured
  prompt: >-
    The choroid plexus hypersecretion node rests on rodent and cell-culture
    measurements of CSF secretion rate. Does the CSF secretion rate actually
    differ between people with IIH and body-mass-matched controls?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Choroid plexus CSF hypersecretion
  - mechanistic_hypotheses#choroid_plexus_csf_hypersecretion
  rationale: >-
    Every measurement of CSF secretion rate supporting this node was made in
    rodents by ventriculo-cisternal perfusion or a comparable invasive
    preparation, or in choroid plexus cell culture. What has been measured in
    IIH patients is intracranial pressure, its pharmacological response, tissue
    receptor expression, and circulating and CSF hormone levels. The mismatch is
    not a technicality, because the rodent work does not point one way: chronic
    testosterone raises the secretion rate and pressure together in lean rats,
    while diet-induced obesity raises pressure with the secretion rate unchanged
    and choroid plexus transcription unchanged, and raised secretion in obese
    rats given testosterone produced no pressure rise at all because drainage
    capacity compensated. Which of those rodent situations human IIH resembles
    determines whether hypersecretion is the initiating step, a contributing
    arm, or a conditional finding that only matters when outflow is already
    impaired. Noninvasive CSF production imaging now makes the human
    measurement feasible for the first time.
  proposed_experiments:
  - experiment_id: exp_iih_human_csf_production_imaging
    name: Noninvasive CSF production imaging in IIH versus body-mass-matched controls
    description: >-
      Apply a noninvasive CSF production mapping method to newly diagnosed,
      untreated IIH patients and to controls matched for body mass index and
      sex, with lumbar puncture opening pressure and a metabolic and androgen
      panel measured in the same session, then repeat after a GLP-1 receptor
      agonist to test whether any secretion difference tracks the pressure
      response.
    experiment_type:
      preferred_term: prospective case-control physiological imaging study
    readouts:
    - name: Choroid plexus CSF production rate
      target: pathophysiology#Choroid plexus CSF hypersecretion
      description: >
        Map CSF production noninvasively in patients and matched controls, and
        again in patients after GLP-1 receptor agonist treatment.
      assays:
      - preferred_term: noninvasive magnetic resonance CSF production mapping
      direction: POSITIVE
    - name: Lumbar puncture opening pressure
      target: pathophysiology#Elevated intracranial pressure
      description: >
        Measure opening pressure in the same session as the imaging so that any
        secretion difference can be related to the pressure it is supposed to
        explain.
      assays:
      - preferred_term: lumbar puncture opening pressure measurement
      direction: POSITIVE
    decision_criterion: >-
      The secretory arm is supported in humans only if untreated IIH patients
      show a higher CSF production rate than body-mass-matched controls and the
      treatment-associated fall in production tracks the fall in opening
      pressure. A normal production rate in patients with clearly raised
      pressure would place the initiating lesion in drainage or venous outflow
      instead.
    would_support:
    - pathophysiology#Choroid plexus CSF hypersecretion
    would_refute:
    - mechanistic_hypotheses#choroid_plexus_csf_hypersecretion
    supporting_outcome:
    - >-
        Untreated IIH patients show a higher choroid plexus CSF production rate
        than matched controls, and production falls alongside opening pressure
        after GLP-1 receptor agonism.
    refuting_outcome:
    - >-
        IIH patients show a CSF production rate indistinguishable from matched
        controls despite clearly raised opening pressure, indicating that raised
        pressure arises without hypersecretion.
  evidence:
  - reference: PMID:38273331
    reference_title: CSF hyperdynamics in rats mimicking the obesity and androgen excess characteristic of patients with idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Obesity in itself therefore does not suffice to recapitulate the IIH symptoms in rats, but modulation of CSF dynamics appears with adjuvant testosterone treatment, which mimics the androgen excess observed in female IIH patients.
    explanation: >-
      The authors' own statement that the obese rodent alone does not reproduce
      the human syndrome, which is the fidelity limit that makes the human
      measurement necessary.
  - reference: PMID:41279197
    reference_title: Indirect Deuterium Displacement Exchange Imaging for Noninvasive High-Resolution CSF Production Mapping.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CSF production is central to brain homeostasis, yet existing measurement techniques are invasive, technically demanding, and confounded by intracranial perturbations.
    explanation: >-
      States the methodological barrier behind this gap. The same paper
      validates a noninvasive alternative in rats against acetazolamide
      suppression, so the human measurement is now a matter of translating a
      demonstrated method rather than inventing one.

name: pseudotumor cerebri
creation_date: '2026-04-13T04:00:00Z'
description: >-
  Pseudotumor cerebri syndrome is elevated intracranial pressure without a mass lesion,
  hydrocephalus,
  or abnormal CSF composition. This entry primarily models idiopathic intracranial
  hypertension (IIH),
  after secondary causes are excluded. Its mechanisms include altered CSF secretion
  and outflow and intracranial
  venous hypertension on a metabolic background strongly associated with obesity.
  Their causal ordering
  is unresolved and can differ between patients. Headache, papilledema, transient
  visual obscurations,
  visual field loss, and pulsatile tinnitus dominate the clinical presentation; persistent
  optic nerve
  injury can cause permanent visual loss.
category: Complex
parents:
- disease
- intracranial hypertension
disease_term:
  preferred_term: pseudotumor cerebri
  term:
    id: MONDO:0009468
    label: pseudotumor cerebri
synonyms:
- idiopathic intracranial hypertension
- IIH
pathophysiology:
- name: Dysregulated cerebrospinal fluid dynamics
  description: >-
    An imbalance between cerebrospinal fluid production and effective outflow contributes
    to the raised-pressure
    state. This is a system-level state encompassing distinct secretory and drainage
    mechanisms, whose
    relative contributions in human IIH remain unresolved.
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiology involves dysregulation of cerebrospinal fluid (CSF) dynamics
      and venous sinus
      pressure
    explanation: This directly supports dysregulated CSF dynamics as the core mechanism.
  downstream:
  - target: Elevated intracranial pressure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      An imbalance in fluid production and effective outflow can raise ICP; the pressure
      response depends
      on venous pressure and compliance.
    evidence:
    - reference: PMID:34929642
      reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The pathophysiology involves dysregulation of cerebrospinal fluid (CSF) dynamics
        and venous sinus
        pressure
      explanation: This directly supports dysregulated CSF dynamics as the core mechanism.
  biological_scale: ORGANISM
- name: Elevated intracranial pressure
  description: >-
    Persistently elevated intracranial pressure causes the characteristic neuro-ophthalmologic
    and headache
    syndrome of pseudotumor cerebri.
  evidence:
  - reference: PMID:38575259
    reference_title: The Pseudotumor Cerebri Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pseudotumor cerebri syndrome is a syndrome of increased cerebrospinal fluid
      pressure without ventriculomegaly,
      mass lesion, or meningeal abnormality.
    explanation: This directly supports elevated CSF pressure as the defining proximal abnormality.
  downstream:
  - target: Optic nerve axoplasmic transport impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Raised pressure is transmitted into the optic nerve sheath and impedes axonal
      transport.
    evidence:
    - reference: PMID:34813854
      reference_title: 'Papilledema: A review of etiology, pathophysiology, diagnosis, and management.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Papilledema is caused by transmission of elevated ICP to the subarachnoid
        space surrounding the
        optic nerve that hinders axoplasmic transport within ganglion cell axons.
      explanation: >-
        This review supports the pressure-transmission and axoplasmic-transport mechanism
        linking raised
        intracranial pressure to optic nerve head edema.
  - target: Headache syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Raised pressure contributes to headache, although headache burden may persist
      independently of mean
      ICP.
    evidence:
    - reference: PMID:35103000
      reference_title: Idiopathic Intracranial Hypertension - Challenges and Pearls.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        headache is the predominant morbidity in over 90%.
      explanation: This directly supports headache as the dominant symptomatic output of the pressure syndrome.
  - target: Venous sinus stenosis
    description: >-
      Raised intracranial pressure can compress the transverse sinuses, worsening
      venous sinus stenosis
      and closing a positive feedback loop.
    evidence:
    - reference: PMID:28841117
      reference_title: Transient resolution of venous sinus stenosis after high-volume lumbar puncture in a patient with idiopathic intracranial hypertension.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This report suggests that TS and SS stenosis may be a downstream effect of
        elevated intracranial
        pressure in IIH, rather than its principal etiological mechanism.
      explanation: Supports a feedback edge in which raised intracranial pressure worsens venous sinus stenosis.
  - target: Diplopia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pressure-associated sixth nerve dysfunction can cause horizontal diplopia; the
      precise stretch/compression
      mechanism is not fully established.
    evidence:
    - reference: PMID:30298346
      reference_title: European headache federation guideline on idiopathic intracranial hypertension.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Unilateral or bilateral sixth-nerve palsy may occur in IIH causing horizontal
        diplopia
      explanation: >-
        The guideline supports the cranial nerve pathway to diplopia.
  - target: Hyposmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lowering ICP by lumbar puncture improves olfactory testing in a small IIH cohort. Peri-olfactory
      CSF pressure is a proposed intermediate; its precise causal contribution remains uncertain.
    evidence:
    - reference: PMID:32088969
      reference_title: 'Lumbar puncture rapidly improves olfaction in patients with idiopathic intracranial hypertension: A cohort study.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lowering of increased intracranial pressure improves hyposmia.
      explanation: >-
        The 14-patient intervention cohort supports pressure-responsive olfactory impairment, although
        drainage is not a selective test of one olfactory mechanism.
- name: Metabolic risk background
  description: >-
    IIH is strongly associated with obesity and female reproductive age. Human cohorts
    also show insulin
    and leptin resistance and altered adipose metabolism beyond simple obesity. These
    associations motivate
    hormonal and outflow hypotheses but do not identify one obligatory initiating
    pathway.
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IIH demonstrates a strong predilection towards obese women of reproductive age
    explanation: This supports the major metabolic-epidemiologic background on which IIH develops.
  - reference: PMID:33848268
    reference_title: Systemic and adipocyte transcriptional and metabolic dysregulation in idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate an insulin- and leptin-resistant phenotype in IIH in excess of
      that driven by obesity.
    explanation: >-
      Matched human observations support metabolic dysregulation beyond obesity alone.
  downstream:
  - target: Androgen excess
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A distinct androgen profile accompanies the metabolic phenotype of adult women
      with IIH; the causal
      coupling remains hypothetical.
    evidence:
    - reference: PMID:30753168
      reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked to cerebrospinal fluid dynamics.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Women with IIH showed a pattern of androgen excess distinct to that observed
        in PCOS and simple
        obesity, with increased serum testosterone and increased CSF testosterone
        and androstenedione.
      explanation: >-
        Human steroid profiling demonstrates an association in adult women; it does
        not establish that
        androgen excess initiates raised pressure.
    hypothesis_groups:
    - choroid_plexus_csf_hypersecretion
  - target: Altered glucocorticoid metabolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Elevated systemic and adipose 11β-HSD1 activity accompanies active IIH, but
      causal mediation is
      unresolved.
    evidence:
    - reference: PMID:35584002
      reference_title: Increased systemic and adipose 11β-HSD1 activity in idiopathic intracranial hypertension.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Compared to control subjects, patients with active IIH had increased systemic
        11β-hydroxysteroid
        dehydrogenase (11β-HSD1) and 5α-reductase activity.
      explanation: >-
        The metabolic phenotype is observed in matched human cohorts, without establishing
        a choroid plexus-specific
        initiating mechanism.
    hypothesis_groups:
    - choroid_plexus_csf_hypersecretion
  - target: Impaired cerebrospinal fluid outflow
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      High-fat feeding can increase drainage resistance in rats; the corresponding
      human metabolic-to-outflow
      mechanism remains unconfirmed.
    evidence:
    - reference: PMID:37328884
      reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        HFD-fed rats presented with increased ICP (65%), which was accompanied by
        increased CSF outflow
        resistance (50%) without altered CSF secretion rate or choroid plexus gene
        expression.
      explanation: >-
        High-fat feeding elevates ICP through drainage resistance in this rat paradigm,
        providing an alternative
        to obligatory hypersecretion.
    hypothesis_groups:
    - choroid_plexus_csf_hypersecretion
- name: Choroid plexus CSF hypersecretion
  mechanism_confidence: PROVISIONAL
  description: >-
    Increased secretory transport at the choroid plexus is a candidate contributor
    to raised ICP. Human
    androgen profiles and testosterone perturbations of rodent choroid plexus support
    this arm, with Na+/K+-ATPase
    activation reported in cultured cells and NKCC1 activation in chronically treated
    rats. Direct demonstration
    that excess secretion initiates human IIH is lacking. GLP-1 receptor agonism inhibits
    secretory transport
    experimentally and lowers human ICP; this therapeutic effect does not establish
    endogenous GLP-1 deficiency
    or prove hypersecretion is primary.
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  biological_processes:
  - preferred_term: choroid plexus CSF hypersecretion
    modifier: INCREASED
    term:
      id: GO:0033326
      label: cerebrospinal fluid secretion
  evidence:
  - reference: PMID:37328884
    reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Chronic adjuvant testosterone treatment of lean rats caused elevated ICP (55%)
      and CSF secretion
      rate (85%), in association with increased activity of the choroid plexus Na+,K+,2Cl- cotransporter,
      NKCC1.
    explanation: >-
      Chronic testosterone increases secretion and ICP in female rats through an NKCC1-associated
      mechanism;
      human IIH secretion was not measured.
  - reference: PMID:30753168
    reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked to cerebrospinal fluid dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that in a rat choroid plexus cell line, testosterone significantly enhanced
      the activity
      of Na+/K+-ATPase, a surrogate of CSF secretion.
    explanation: >-
      The cell-line result measures a secretion surrogate, whereas the separate chronic-rat
      experiment
      implicates NKCC1.

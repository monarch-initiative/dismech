    term:
      id: UBERON:0001675
      label: trigeminal ganglion
  evidence:
  - reference: PMID:41989095
    reference_title: Calcitonin gene-related peptide induces headache attacks in people with idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CGRP reliably provoked typical IIH headache attacks (which have migraine-like
      features) and increased
      ICP pulse amplitude, as a measure of intracranial compliance, without altering
      mean pressure.
    explanation: >-
      Randomized crossover provocation data support CGRP-dependent trigeminovascular
      signaling and altered
      pressure compliance as a mechanism for IIH headache attacks.
  - reference: PMID:41989095
    reference_title: Calcitonin gene-related peptide induces headache attacks in people with idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings provide mechanistic support for CGRP involvement in headache
      attributed to IIH and
      justify prospective evaluation of CGRP pathway blockade in this population.
    explanation: >-
      The authors explicitly interpret the trial as mechanistic support for CGRP involvement
      in IIH-attributed
      headache.
  downstream:
  - target: Headache syndrome
    description: >-
      CGRP/neuropeptide activation of trigeminovascular pain pathways produces the
      migraine-like headache
      attacks that dominate IIH morbidity.
    evidence:
    - reference: PMID:41989095
      reference_title: Calcitonin gene-related peptide induces headache attacks in people with idiopathic intracranial hypertension.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Twelve (71%) participants developed a typical IIH headache attack with migraine-like features
        after CGRP compared with three (18%) after placebo (risk difference 53%; 95% CI, 26-79; P = 0.004).
      explanation: >-
        Randomized crossover provocation provides human experimental evidence that CGRP can trigger IIH
        headache. Participants had no prior migraine and included active disease and ocular remission.

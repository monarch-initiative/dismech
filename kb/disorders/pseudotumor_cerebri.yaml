- discussion_id: gap_iih_genetic_susceptibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which genetic susceptibility findings replicate in larger, independently phenotyped IIH cohorts?
  attaches_to:
  - disease#pseudotumor cerebri
  rationale: >-
    The earlier NORDIC IIHTT GWAS and later small familial haplotype study generate
    candidates but do
    not establish a Mendelian IIH gene or a genome-wide significant causal locus.
    The familial study’s
    P<0.01 exploratory threshold and relatedness/age imbalance require replication.
    Its CA5A candidate
    cannot be treated as proof that mitochondrial carbonic anhydrase drives choroid
    plexus secretion.
  evidence:
  - reference: PMID:29608535
    reference_title: Genetic Survey of Adult-Onset Idiopathic Intracranial Hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study was limited by its modest size and thus would have only been able
      to demonstrate highly
      significant association on a genome-wide scale for relatively common alleles
      exerting large effects.
    explanation: >-
      The first rigorous IIHTT GWAS identifies a power limitation, not a definitive
      causal gene.
  - reference: PMID:38528581
    reference_title: 'A genetic survey of patients with familial idiopathic intracranial hypertension residing in a Middle Eastern village: genetic association study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Samples from 22 female participants (11 patients and 11 controls) were evaluated
      for haplotype clustering
      and genome-wide association studies (GWAS).
    explanation: >-
      Defines the actual small analyzed cohort rather than conflating it with all
      recruited subjects.
notes: >-
  The metabolic-hormonal pathograph is scoped to primary IIH, especially the adult
  female populations
  studied. Pseudotumor cerebri syndrome also includes secondary intracranial hypertension,
  including medication-associated
  disease and cerebral venous thrombosis; these must be excluded before the idiopathic
  label is applied.
  Candidate secretory, drainage, and venous mechanisms are not validated clinical
  subtypes. The OpenScientist
  report was reviewed against primary sources; its supported leads and qualifications
  are represented
  below, with claim-level judgments in the hypothesis assessment sidecar.

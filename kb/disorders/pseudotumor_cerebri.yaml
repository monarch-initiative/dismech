        in CP and AGT.
      explanation: >-
        Both secretory choroid plexus and drainage arachnoid granulation tissue express
        the pathway; functional
        effects in human IIH are not established.
    hypothesis_groups:
    - choroid_plexus_csf_hypersecretion
- name: Intracranial venous hypertension
  biological_scale: TISSUE
  description: >-
    Elevated dural sinus pressure reduces the driving gradient for CSF outflow into
    the venous circulation
    and contributes to raised intracranial pressure.
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiology involves dysregulation of cerebrospinal fluid (CSF) dynamics
      and venous sinus
      pressure
    explanation: This directly supports dysregulated CSF dynamics as the core mechanism.
  downstream:
  - target: Impaired cerebrospinal fluid outflow
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Elevated venous back-pressure reduces the pressure gradient available for CSF
      absorption.
    evidence:
    - reference: PMID:37410913
      reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Venous sinus stenosis, typically at the junction of the transverse and sigmoid
        sinus, is increasingly
        recognized as a contributor to the pathophysiology of idiopathic intracranial
        hypertension (IIH),
        whether it be the intrinsic type that does not reverse with normalization
        of intracranial pressure
        or the extrinsic type, which does.
      explanation: >-
        Intrinsic and pressure-responsive extrinsic lesions are distinct morphologies;
        persistence alone
        does not prove that the lesion preceded IIH.
    hypothesis_groups:
    - primary_venous_sinus_obstruction
- name: Impaired cerebrospinal fluid outflow
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE
  description: >-
    Reduced effective CSF drainage can disturb fluid balance independently of excess
    secretion. Increased
    venous pressure is one plausible contributor. High-fat-fed rats show an outflow-resistance
    phenotype
    in one experimental paradigm, whereas other rat studies report secretion changes;
    no single animal
    paradigm establishes the dominant human mechanism.
  evidence:
  - reference: PMID:37328884
    reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HFD-fed rats presented with increased ICP (65%), which was accompanied by increased
      CSF outflow
      resistance (50%) without altered CSF secretion rate or choroid plexus gene expression.
    explanation: >-
      High-fat feeding elevates ICP through drainage resistance in this rat paradigm,
      providing an alternative
      to obligatory hypersecretion.
  downstream:
  - target: Dysregulated cerebrospinal fluid dynamics
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced outflow shifts CSF balance toward a raised-pressure state.
    evidence:
    - reference: PMID:37328884
      reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        HFD-fed rats presented with increased ICP (65%), which was accompanied by
        increased CSF outflow
        resistance (50%) without altered CSF secretion rate or choroid plexus gene
        expression.
      explanation: >-
        High-fat feeding elevates ICP through drainage resistance in this rat paradigm,
        providing an alternative
        to obligatory hypersecretion.
    hypothesis_groups:
    - primary_venous_sinus_obstruction
- name: Optic nerve axonal injury
  biological_scale: TISSUE
  description: >-
    Prolonged papilledema-associated axoplasmic stasis and intraneuronal ischemia
    can cause irreversible
    retinal ganglion cell axon injury.
  evidence:
  - reference: PMID:28539794
    reference_title: 'Papilledema: epidemiology, etiology, and clinical management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Irrespective of the cause, visual loss is the feared morbidity of papilledema,
      and the main mechanism
      of optic nerve damage is intraneuronal ischemia secondary to axoplasmic flow
      stasis.
    explanation: >-
      Persistent axoplasmic stasis can produce ischemic optic nerve injury and visual
      loss.
  downstream:
  - target: Visual loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Optic nerve axonal injury impairs visual function and can make loss permanent.
    evidence:
    - reference: PMID:28539794
      reference_title: 'Papilledema: epidemiology, etiology, and clinical management.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Irrespective of the cause, visual loss is the feared morbidity of papilledema,
        and the main mechanism
        of optic nerve damage is intraneuronal ischemia secondary to axoplasmic flow
        stasis.
      explanation: >-
        Persistent axoplasmic stasis can produce ischemic optic nerve injury and visual
        loss.
phenotypes:
- name: Headache
  category: Neurologic
  description: >-
    Headache is the dominant symptomatic burden in pseudotumor cerebri.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The primary symptoms include headache, vision loss, and pulsatile tinnitus
    explanation: This directly supports headache as a primary symptom.
- name: Papilledema
  category: Ophthalmic
  diagnostic: true
  description: >-
    Papilledema is the hallmark neuro-ophthalmologic sign of raised intracranial pressure
    in IIH.
  phenotype_term:
    preferred_term: Papilledema
    term:
      id: HP:0001085
      label: Papilledema
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Idiopathic intracranial hypertension (IIH) is characterized by increased intracranial
      pressure,
      manifested by papilledema
    explanation: This directly supports papilledema as a defining sign.
- name: Visual loss
  category: Ophthalmic
  description: >-
    Visual dysfunction and permanent visual loss can occur if elevated intracranial
    pressure is not controlled.
  notes: >-
    A general population frequency is not assigned. The IIHTT cohort required mild
    visual field loss at entry; its 32% self-reported visual-loss frequency is a
    symptom measure in a selected cohort, not the prevalence of objective visual
    impairment or permanent visual loss in all IIH.
  phenotype_term:
    preferred_term: Visual loss
    term:
      id: HP:0000572
      label: Visual loss
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The primary symptoms include headache, vision loss, and pulsatile tinnitus
    explanation: This directly supports visual loss as a primary symptom.
  - reference: PMID:24756302
    reference_title: "The idiopathic intracranial hypertension treatment trial: clinical profile at baseline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that the IIHTT entry criteria required mild visual field loss in the
      worse (study) eye, our perimetric results are not representative of visual
      loss in IIH in general.
    explanation: >-
      The study explicitly limits generalization of its selected visual-loss
      cohort; objective field defects and self-reported symptoms have different
      denominators.

- name: Pulsatile tinnitus
  category: Otolaryngologic
  description: >-
    Pulsatile tinnitus is a common pressure-related symptom in pseudotumor cerebri.
  phenotype_term:
    preferred_term: Pulsatile tinnitus
    term:
      id: HP:0008629
      label: Pulsatile tinnitus
  evidence:
  - reference: PMID:34929642
    reference_title: 'Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The primary symptoms include headache, vision loss, and pulsatile tinnitus
    explanation: This directly supports pulsatile tinnitus as a primary symptom.
- name: Transient visual obscurations
  description: >-
    Brief reversible episodes of unilateral or bilateral visual dimming, distinguished
    from permanent
    optic nerve injury.
  phenotype_term:
    preferred_term: Transient visual obscurations
    term:
      id: HP:0000572
      label: Visual loss
    temporality: TRANSIENT
  evidence:
  - reference: PMID:24756302
    reference_title: 'The idiopathic intracranial hypertension treatment trial: clinical profile at baseline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transient visual obscurations occurred in 68% of patients, back pain in 53%,
      and pulse synchronous
      tinnitus in 52%.
    explanation: >-
      Baseline IIHTT symptom frequencies apply to the selected untreated cohort with
      mild visual field
      loss, not to all IIH.
  frequency: FREQUENT
- name: Back pain
  description: >-
    Back pain was reported in 53% of the IIHTT mild-visual-loss cohort. Its exact
    mechanism is less well
    established than the optic nerve pathway.
  phenotype_term:
    preferred_term: Back pain
    term:
      id: HP:0003418
      label: Back pain
  evidence:
  - reference: PMID:24756302
    reference_title: 'The idiopathic intracranial hypertension treatment trial: clinical profile at baseline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transient visual obscurations occurred in 68% of patients, back pain in 53%,
      and pulse synchronous
      tinnitus in 52%.
    explanation: >-
      Baseline IIHTT symptom frequencies apply to the selected untreated cohort with
      mild visual field
      loss, not to all IIH.
  frequency: FREQUENT
- name: Diplopia
  description: >-
    Typically binocular horizontal diplopia, sometimes transient and associated with
    sixth nerve dysfunction.
  phenotype_term:
    preferred_term: Diplopia
    term:
      id: HP:0000651
      label: Diplopia
  evidence:
  - reference: PMID:24756302
    reference_title: 'The idiopathic intracranial hypertension treatment trial: clinical profile at baseline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While binocular diplopia was reported in 18%, only 3% had an esotropia on examination,
      suggesting
      the presence of sixth nerve palsy; this is best explained by the diplopia likely
      being transient.
    explanation: >-
      The IIHTT cohort distinguishes reported diplopia from a demonstrable examination
      deficit.
  frequency: OCCASIONAL
- name: Visual field defect
  description: >-
    Arcuate field loss and enlarged blind spots can occur despite preserved central
    visual acuity; formal
    perimetry detects them.
  phenotype_term:
    preferred_term: Visual field defect
    term:
      id: HP:0001123
      label: Visual field defect
  evidence:
  - reference: PMID:24756302
    reference_title: 'The idiopathic intracranial hypertension treatment trial: clinical profile at baseline.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A partial arcuate visual field defect with an enlarged blind spot was the most
      common perimetric
      finding.
    explanation: >-
      Supports characteristic visual field loss in the trial cohort.
- name: Cognitive impairment
  description: >-
    Impaired processing speed, reaction time, attention and visuospatial memory have been documented with
    formal testing. Cognitive deficits may persist after ICP and headache improve; the mechanism and contribution
    of comorbidity remain unresolved.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:24713214
    reference_title: 'Cognitive function in idiopathic intracranial hypertension: a prospective case-control study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with IIH performed significantly worse than controls in four of six cognitive domains (p≤0.02).
    explanation: >-
      A prospective 31-patient case-control study found objective deficits, most pronounced in processing
      speed and reaction time. Controls were not matched for BMI, and deficits did not track ICP normalization,
      so a simple pressure-mediated mechanism is not asserted.
- name: Hyposmia
  description: >-
    Olfactory dysfunction has been observed in IIH but is not a validated diagnostic
    or monitoring marker.
  phenotype_term:
    preferred_term: Hyposmia
    term:
      id: HP:0004409
      label: Hyposmia
  evidence:
  - reference: PMID:23794685
    reference_title: Olfactory dysfunction in patients with idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our pilot study provides new evidence that olfaction is impaired in patients with IIH, especially
      in those who have been newly diagnosed or who have experienced a recent clinical deterioration.
    explanation: >-
      Objective olfactory testing in 17 patients and matched controls supports hyposmia; the small study
      does not provide population prevalence.

- name: Testosterone-treated female Wistar rat
  species: Rattus norvegicus
  description: >-
    Chronic adjuvant testosterone model with NKCC1-associated increased CSF secretion
    and ICP.
  publication: PMID:37328884
  modeled_mechanisms:
  - target: Choroid plexus CSF hypersecretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Exogenous testosterone and rodent CSF transport cannot establish endogenous
      human IIH causation.
    evidence:
    - reference: PMID:37328884
      reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Chronic adjuvant testosterone treatment of lean rats caused elevated ICP (55%)
        and CSF secretion
        rate (85%), in association with increased activity of the choroid plexus Na+,K+,2Cl- cotransporter,
        NKCC1.
      explanation: >-
        Chronic testosterone increases secretion and ICP in female rats through an NKCC1-associated
        mechanism;
        human IIH secretion was not measured.

- name: Exenatide
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: exenatide
      term:
        id: CHEBI:748790
        label: exenatide
  description: >-
    Investigational GLP-1 receptor agonist for IIH. A randomized trial recruited 16
    women with active
    IIH and found rapid and sustained ICP reductions using a prespecified alpha of
    0.1; the 12-week P
    value was 0.058. Larger trials are needed to establish clinical outcomes.
  evidence:
  - reference: PMID:36907221
    reference_title: 'The effect of GLP-1RA exenatide on idiopathic intracranial hypertension: a randomized clinical trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exenatide significantly and meaningfully lowered intracranial pressure at 2.5
      h -5.7 ± 2.9 cmCSF
      (P = 0.048); 24 h -6.4 ± 2.9 cmCSF (P = 0.030); and 12 weeks -5.6 ± 3.0 cmCSF
      (P = 0.058).
    explanation: >-
      The small randomized trial supports ICP lowering; alpha was prespecified at
      0.1 and direct CSF secretion
      was not measured.
  target_mechanisms:
  - target: Choroid plexus CSF hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Preclinical GLP-1 receptor activation reduces secretory pump activity; the human
      trial measured
      ICP rather than secretion or choroid plexus target engagement.
    evidence:
    - reference: PMID:28835515
      reference_title: A glucagon-like peptide-1 receptor agonist reduces intracranial pressure in a rat model of hydrocephalus.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Acute treatment with exendin-4 reduced Na+- and K+-dependent adenosine triphosphatase
        activity,
        a key regulator of CSF secretion, in cell cultures.
      explanation: >-
        GLP-1 receptor agonism suppresses the secretory transport apparatus in cultured
        cells; this is
        a therapeutic perturbation rather than evidence of deficient endogenous signaling
        in IIH.
- name: AZD4017
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: AZD4017
  description: >-
    Investigational 11β-HSD1 inhibitor. The 31-participant randomized trial showed
    biochemical target
    engagement but did not establish ICP lowering on the primary between-group comparison;
    exploratory
    within-group changes do not establish clinical efficacy.
  evidence:
  - reference: PMID:32954315
    reference_title: '11β-Hydroxysteroid dehydrogenase type 1 inhibition in idiopathic intracranial hypertension: a double-blind randomized controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 12 weeks, lumbar puncture pressure was lower in the AZD4017 group (29.7 cmH2O)
      compared with
      placebo (31.3 cmH2O), but the difference between groups was not statistically
      significant (mean
      difference: -2.8, 95% confidence interval: -7.1 to 1.5; P = 0.2).
    explanation: >-
      The primary between-group endpoint did not establish efficacy; exploratory within-group
      changes
      and biomarker correlations cannot substitute for that comparison.
  target_mechanisms:
  - target: Altered glucocorticoid metabolism
    treatment_effect: INHIBITS
    description: >-
      AZD4017 inhibits 11β-HSD1 in vivo, but the trial did not establish that this
      improves the primary
      ICP endpoint.
    evidence:
    - reference: PMID:32954315
      reference_title: '11β-Hydroxysteroid dehydrogenase type 1 inhibition in idiopathic intracranial hypertension: a double-blind randomized controlled trial.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AZD4017 was safe and well tolerated and inhibited 11β-hydroxysteroid dehydrogenase
        type 1 activity
        in vivo.
      explanation: >-
        Supports biochemical target engagement, not proven clinical efficacy.

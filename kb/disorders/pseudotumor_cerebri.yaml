        This report suggests that TS and SS stenosis may be a downstream effect of elevated intracranial pressure in IIH, rather than its principal etiological mechanism.
      explanation: Supports a feedback edge in which raised intracranial pressure worsens venous sinus stenosis.
- name: Metabolic risk background
  description: >-
    IIH strongly favors obese women of reproductive age, and metabolic and
    hormonal factors are thought to amplify CSF and venous-pressure
    dysregulation.
  evidence:
  - reference: PMID:34929642
    reference_title: "Idiopathic intracranial hypertension: Pathophysiology, diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      IIH demonstrates a strong predilection towards obese women of reproductive age
    explanation: This supports the major metabolic-epidemiologic background on which IIH develops.
  - reference: PMID:33848268
    reference_title: Systemic and adipocyte transcriptional and metabolic dysregulation in idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate an insulin- and leptin-resistant phenotype in IIH in excess of that driven by obesity.
    explanation: >-
      Matched case-control data showing the metabolic disturbance in IIH exceeds
      what body mass alone accounts for, which is what makes this node a
      candidate driver rather than a demographic correlate.
  - reference: PMID:30753168
    reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked to cerebrospinal fluid dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with IIH showed a pattern of androgen excess distinct to that observed in PCOS and simple obesity, with increased serum testosterone and increased CSF testosterone and androstenedione.
    explanation: >-
      Identifies the specific hormonal disturbance that distinguishes IIH from
      BMI-matched obesity and from PCOS, and shows it reaches the CSF
      compartment.
  downstream:
  - target: Dysregulated cerebrospinal fluid dynamics
    description: Metabolic and hormonal factors contribute to CSF and venous-pressure abnormalities.
  - target: Choroid plexus CSF hypersecretion
    description: >-
      Obesity-associated hormonal signalling acts on the choroid plexus

mechanistic_hypotheses:
- hypothesis_group_id: choroid_plexus_csf_hypersecretion
  hypothesis_label: Choroid Plexus CSF Hypersecretion (Metabolic-Hormonal) Model
  status: EMERGING
  description: >-
    Metabolic and hormonal abnormalities may contribute to raised ICP through choroid
    plexus secretion
    in a subset of IIH. Human androgen excess and rodent perturbations support plausibility,
    but direct
    human secretion measurements and causal ordering remain unresolved. GLP-1 receptor
    agonism suppresses
    secretory transport in preclinical systems and lowers ICP in a small randomized
    trial; endogenous
    GLP-1 deficiency has not been established. The AZD4017 trial did not meet its
    primary between-group
    endpoint. Impaired outflow, intrinsic venous lesions, and pressure-dependent venous
    feedback may act
    in parallel or dominate in other patients.
  evidence:
  - reference: PMID:30753168
    reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked to cerebrospinal fluid dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Women with IIH showed a pattern of androgen excess distinct to that observed
      in PCOS and simple
      obesity, with increased serum testosterone and increased CSF testosterone and
      androstenedione.
    explanation: >-
      Human steroid profiling demonstrates an association in adult women; it does
      not establish that androgen
      excess initiates raised pressure.
  - reference: PMID:37328884
    reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Chronic adjuvant testosterone treatment of lean rats caused elevated ICP (55%)
      and CSF secretion
      rate (85%), in association with increased activity of the choroid plexus Na+,K+,2Cl- cotransporter,
      NKCC1.
    explanation: >-
      Chronic testosterone increases secretion and ICP in female rats through an NKCC1-associated
      mechanism;
      human IIH secretion was not measured.
  - reference: PMID:36907221
    reference_title: 'The effect of GLP-1RA exenatide on idiopathic intracranial hypertension: a randomized clinical trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exenatide significantly and meaningfully lowered intracranial pressure at 2.5
      h -5.7 ± 2.9 cmCSF
      (P = 0.048); 24 h -6.4 ± 2.9 cmCSF (P = 0.030); and 12 weeks -5.6 ± 3.0 cmCSF
      (P = 0.058).
    explanation: >-
      The small randomized trial supports ICP lowering; alpha was prespecified at
      0.1 and direct CSF secretion
      was not measured.
  - reference: PMID:32954315
    reference_title: '11β-Hydroxysteroid dehydrogenase type 1 inhibition in idiopathic intracranial hypertension: a double-blind randomized controlled trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 12 weeks, lumbar puncture pressure was lower in the AZD4017 group (29.7 cmH2O)
      compared with
      placebo (31.3 cmH2O), but the difference between groups was not statistically
      significant (mean
      difference: -2.8, 95% confidence interval: -7.1 to 1.5; P = 0.2).
    explanation: >-
      The primary between-group endpoint did not establish efficacy; exploratory within-group
      changes
      and biomarker correlations cannot substitute for that comparison.
  notes: >-
    Retain EMERGING. OpenScientist correctly argues against promoting a single primary
    hypersecretion
    model, but overstates several supporting claims: chronic testosterone activated
    NKCC1 rather than
    Na+/K+-ATPase in PMID:37328884, intrinsic stenosis proportions come from a selected
    stenting cohort,
    and pharmacological response does not establish the untreated initiating lesion.
    The assessment sidecar
    records these and other source-level qualifications.
- hypothesis_group_id: primary_venous_sinus_obstruction
  hypothesis_label: Primary Venous Sinus Obstruction Model
  status: ALTERNATIVE
  description: >-
    A venous contribution can arise from intrinsic transverse-sigmoid narrowing or
    pressure-dependent
    extrinsic compression. A significant gradient can sustain venous hypertension
    and impaired CSF outflow,
    with ICP-dependent narrowing closing a feedback loop. Stenting responses support
    a modifiable hemodynamic
    contributor in selected patients but do not establish that venous obstruction
    initiates every case.
  evidence:
  - reference: PMID:37410913
    reference_title: 'Idiopathic Intracranial Venous Hypertension: Toward a Better Understanding of Venous Stenosis and the Role of Stenting in Idiopathic Intracranial Hypertension.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Venous sinus stenosis, typically at the junction of the transverse and sigmoid
      sinus, is increasingly
      recognized as a contributor to the pathophysiology of idiopathic intracranial
      hypertension (IIH),
      whether it be the intrinsic type that does not reverse with normalization of
      intracranial pressure
      or the extrinsic type, which does.
    explanation: >-
      Intrinsic and pressure-responsive extrinsic lesions are distinct morphologies;
      persistence alone
      does not prove that the lesion preceded IIH.
discussions:
- discussion_id: gap_iih_headache_mechanism
  prompt: >-
    What is the proximate mechanism of headache in IIH, and why is it imperfectly
    coupled to the degree
    of intracranial pressure elevation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Headache syndrome
  - pathophysiology#CGRP-mediated trigeminovascular headache signaling
  rationale: >-
    Headache is the dominant symptomatic morbidity but its mechanism is only partly
    understood. Human
    CGRP provocation data now support trigeminovascular neuropeptide signaling and
    ICP pulsatility as
    a proximal mechanism, while headache can still persist or fluctuate independently
    of measured pressure.
    Modeling headache purely as a downstream consequence of raised mean pressure remains
    incomplete.
- discussion_id: gap_iih_venous_stenosis_cause_or_consequence
  prompt: >-
    Is transverse venous sinus stenosis a primary initiating lesion or a pressure-dependent
    feedback consequence
    in IIH?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Venous sinus stenosis
  - pathophysiology#Dysregulated cerebrospinal fluid dynamics
  - pathophysiology#Elevated intracranial pressure
  rationale: >-
    Transverse sinus stenosis is present in most patients and venous sinus stenting
    helps a subset, yet
    stenosis can reverse once intracranial pressure is lowered. Whether it initiates
    the disease or amplifies
    an already-elevated-pressure state is unresolved and distinguishes the primary
    venous obstruction
    model from the choroid plexus hypersecretion model.
- discussion_id: gap_iih_sex_and_nonobese_predilection
  prompt: >-
    Why does IIH predominantly affect obese women of reproductive age, and what distinguishes
    the mechanism
    in non-obese or atypical cases?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Metabolic risk background
  - pathophysiology#Choroid plexus CSF hypersecretion
  rationale: >-
    Sex and metabolic associations do not explain all IIH presentations. Pediatric,
    male, and non-obese
    populations require separate evaluation; medication-related raised ICP is a secondary
    cause to exclude,
    not evidence for an idiopathic non-obese subtype.
- discussion_id: gap_iih_obesity_venous_csf_hierarchy
  prompt: >-
    How do obesity/metabolic-hormonal drivers, venous sinus pressure and stenosis,
    and CSF production/absorption
    interact causally in IIH, and which of these is the initiating event versus an
    amplifying feedback
    consequence?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Metabolic risk background
  - pathophysiology#Choroid plexus CSF hypersecretion
  - pathophysiology#Venous sinus stenosis
  - pathophysiology#Dysregulated cerebrospinal fluid dynamics
  rationale: >-
    IIH is defined by raised intracranial pressure without a mass lesion, yet the
    causal ordering among
    its candidate mechanisms remains unresolved. Multiple pathways have been proposed
    as the underlying
    cause - choroid plexus CSF overproduction, impaired CSF outflow/absorption, elevated
    venous sinus
    pressure with transverse sinus stenosis, glymphatic dysfunction, and obesity-associated
    hormonal alterations
    - but no single theory explains the entire clinical picture. The metabolic-hormonal
    arm is an attractive
    upstream driver because pharmacological modulation lowers intracranial pressure,
    yet the AZD4017 trial
    missed its primary endpoint and the human evidence linking specific hormonal axes
    to choroid plexus
    secretion is still maturing. Venous sinus stenosis is present in most patients
    and stenting helps
    a subset, but stenosis frequently reverses once pressure is lowered, so it may
    amplify rather than
    initiate the disease via a positive feedback loop. There is even emerging argument
    that CSF overproduction
    is unlikely to be the primary driver and that carbonic-anhydrase inhibition targets
    a consequence
    rather than the cause. Disentangling which node is initiating versus secondary
    across obese, non-obese,
    and atypical patients is the central unresolved question and would reorder the
    entire pathophysiology
    causal graph and its therapeutic targets.
  proposed_experiments:
  - experiment_id: exp_iih_mechanism_perturbation_ordering
    name: Interventional perturbation cohort to order metabolic, venous, and CSF mechanisms
    description: >-
      Enroll newly diagnosed IIH patients (obese and non-obese strata) and apply mechanism-specific
      perturbations
      with simultaneous multi-axis monitoring.
    experiment_type:
      preferred_term: prospective interventional mechanistic cohort study
    readouts:
    - name: Metabolic-hormonal response and intracranial pressure
      target: pathophysiology#Metabolic risk background
      description: >
        Quantify circulating metabolic and hormonal markers and body composition alongside
        intracranial
        pressure during a metabolic-hormonal intervention.
      assays:
      - preferred_term: serum hormone quantification
      - preferred_term: lumbar puncture opening pressure measurement
      direction: NEGATIVE
    - name: CSF secretion response to carbonic anhydrase inhibition
      target: pathophysiology#Choroid plexus CSF hypersecretion
      description: >
        Measure intracranial pressure and CSF dynamics before and after carbonic anhydrase
        inhibition.
      assays:
      - preferred_term: cerebrospinal fluid dynamics assessment
      direction: NEGATIVE
    - name: Trans-stenosis gradient and pressure coupling
      target: pathophysiology#Venous sinus stenosis
      description: >
        Measure the transverse-sinus trans-stenosis pressure gradient before and after
        intracranial pressure
        is lowered, and before and after stenting.
      assays:
      - preferred_term: catheter cerebral venography pressure gradient measurement
      direction: POSITIVE
    decision_criterion: >-
      A pathway is supported as a modifiable mediator if its perturbation reproducibly
      changes the expected
      direct readout and ICP after accounting for weight loss, venous pressure, and
      outflow compensation.
      Improvement alone does not identify the initiating lesion; causal ordering additionally
      requires
      temporally resolved measurements before disease onset or a justified causal
      mediation design.
    would_support:
    - pathophysiology#Metabolic risk background
    - pathophysiology#Choroid plexus CSF hypersecretion
    - pathophysiology#Venous sinus stenosis
  evidence:
  - reference: PMID:33631966
    reference_title: Diagnosis and treatment of idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several mechanisms have been proposed as the underlying cause of IIH, such as
      an overproduction
      of cerebrospinal fluid (CSF), outflow obstruction, elevated pressure in the
      venous sinuses and more
      recently a dysfunction in the glymphatic pathway as well as hormonal alterations.
    explanation: >-
      Directly enumerates the competing candidate mechanisms whose causal ordering
      is unresolved.
  - reference: PMID:26700907
    reference_title: 'Understanding idiopathic intracranial hypertension: mechanisms, management, and future directions.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenesis has not been fully elucidated, but several causal factors have
      been proposed.
    explanation: >-
      Confirms that the pathogenesis and causal ordering of the proposed factors remain
      unestablished.
- discussion_id: gap_iih_secretory_transport_and_outflow_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Do the distinct secretory and drainage changes in rodent models occur in the same human IIH subgroups?
  attaches_to:
  - pathophysiology#Choroid plexus CSF hypersecretion
  - pathophysiology#Impaired cerebrospinal fluid outflow
  rationale: >-
    Rodent findings differ by strain, diet, hormonal perturbation, and assay: one
    high-fat paradigm increases
    secretion, another increases outflow resistance, and obese Zucker rats compensate
    for testosterone-induced
    secretion. Human androgen excess and drug-induced ICP reduction are insufficient
    to resolve the dominant
    human pathway. MRI water exchange and aqueductal flow must be validated against
    net secretion before
    being treated as direct production measurements.
  evidence:
  - reference: PMID:37328884
    reference_title: 'Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HFD-fed rats presented with increased ICP (65%), which was accompanied by increased
      CSF outflow
      resistance (50%) without altered CSF secretion rate or choroid plexus gene expression.
    explanation: >-
      High-fat feeding elevates ICP through drainage resistance in this rat paradigm,
      providing an alternative
      to obligatory hypersecretion.
  - reference: PMID:38273331
    reference_title: CSF hyperdynamics in rats mimicking the obesity and androgen excess characteristic of patients with idiopathic intracranial hypertension.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adjuvant testosterone treatment of obese rats elevated the CSF secretion rate,
      although with no

        formal perimetry for detection.
      explanation: >-
        Supports the visual-field manifestation of the optic nerve pathway.
- name: CGRP-mediated trigeminovascular headache signaling
  mechanism_confidence: PROVISIONAL
  description: >-
    CGRP provocation triggers typical migraine-like IIH headache without increasing mean ICP in a small
    randomized crossover study of women with IIH and no prior migraine. The observed rise in ICP pulse
    amplitude was an exploratory endpoint in a small subset without adjustment for multiple testing. These
    results support a trigeminovascular pain component but do not demonstrate that raised pressure initiates
    endogenous CGRP release.

  evidence:
  - reference: PMID:32954315
    reference_title: "11β-Hydroxysteroid dehydrogenase type 1 inhibition in idiopathic intracranial hypertension: a double-blind randomized controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The enzyme 11β-hydroxysteroid dehydrogenase type 1 has been implicated in regulating cerebrospinal fluid secretion, and its activity is associated with alterations in intracranial pressure in idiopathic intracranial hypertension
    explanation: >-
      Supports 11β-HSD1-dependent regulation of choroid plexus CSF secretion as a
      driver of intracranial pressure, the mechanistic rationale for the AZD4017
      trial.
  - reference: PMID:36907221
    reference_title: "The effect of GLP-1RA exenatide on idiopathic intracranial hypertension: a randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preclinical data have demonstrated a novel strategy to lower intracranial pressure using glucagon-like peptide-1 (GLP-1) receptor signalling
    explanation: >-
      Supports GLP-1 receptor signalling at the choroid plexus as a modifiable
      driver of CSF secretion and intracranial pressure.
  - reference: PMID:36907221
    reference_title: "The effect of GLP-1RA exenatide on idiopathic intracranial hypertension: a randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exenatide significantly and meaningfully lowered intracranial pressure at 2.5 h
    explanation: >-
      The exenatide randomized trial provides human proof-of-concept that
      modulating choroid plexus GLP-1 signalling lowers intracranial pressure.
  - reference: PMID:28835515
    reference_title: A glucagon-like peptide-1 receptor agonist reduces intracranial pressure in a rat model of hydrocephalus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used tissue sections and cell cultures to demonstrate expression of GLP-1R in the choroid plexus and its activation by exendin-4, an effect blocked by the GLP-1R antagonist exendin 9-39.
    explanation: >-
      Establishes that the choroid plexus epithelium actually carries the GLP-1
      receptor this node depends on, and that an agonist engages it in a
      receptor-specific way.
  - reference: PMID:28835515
    reference_title: A glucagon-like peptide-1 receptor agonist reduces intracranial pressure in a rat model of hydrocephalus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Acute treatment with exendin-4 reduced Na(+)- and K(+)-dependent adenosine triphosphatase activity, a key regulator of CSF secretion, in cell cultures.
    explanation: >-
      Links GLP-1 receptor agonism to the Na+/K+-ATPase step this node names,
      which is the mechanism the exenatide trial result is read against.
  - reference: PMID:30753168
    reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked to cerebrospinal fluid dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human choroid plexus expressed the androgen receptor, alongside the androgen-activating enzyme aldoketoreductase type 1C3.
    explanation: >-
      Human tissue evidence that the choroid plexus can both receive and locally
      generate androgen signal, which is what makes circulating androgen excess
      mechanistically available to this node.
  - reference: PMID:30753168
    reference_title: A unique androgen excess signature in idiopathic intracranial hypertension is linked to cerebrospinal fluid dynamics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that in a rat choroid plexus cell line, testosterone significantly enhanced the activity of Na+/K+-ATPase, a surrogate of CSF secretion.
    explanation: >-
      Functional evidence that androgen exposure raises the Na+/K+-ATPase
      activity that drives CSF secretion in choroid plexus epithelium.
  - reference: PMID:37328884
    reference_title: "Modelling idiopathic intracranial hypertension in rats: contributions of high fat diet and testosterone to intracranial pressure and cerebrospinal fluid production."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Chronic adjuvant testosterone treatment of lean rats caused elevated ICP (55%) and CSF secretion rate (85%), in association with increased activity of the choroid plexus Na+,K+,2Cl- cotransporter, NKCC1.
    explanation: >-
      The only in vivo demonstration that a hormone in this model raises the
      measured CSF secretion rate and intracranial pressure together. Note the
      authors attribute it to NKCC1 rather than to Na+/K+-ATPase.
  - reference: PMID:32036786
    reference_title: Cerebrospinal fluid dynamics modulation by diet and cytokines in rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Increased CSF secretion was seen in both groups following HC treatment (by 132% in controls and 114% in HF) but only in control rats following TNF-α treatment (137% increase).
    explanation: >-
      Glucocorticoid exposure raises the CSF secretion rate directly, which is
      the step the 11-beta-HSD1 arm posits when it places locally regenerated
      cortisol at the choroid plexus. The TNF-alpha result shows a cytokine can
      do the same, but only in control-diet animals.

    clinically and radiographically with KATNB1-related cortical malformation,
    sharing microcephaly, agyria-pachygyria, simplified gyration, callosal
    abnormalities, and ventriculomegaly.
  distinguishing_features:
  - >-
    Distinguished by imaging-based anterior-posterior gradient and posterior

diagnosis:
- name: Brain Magnetic Resonance Imaging (MRI)
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    High-resolution brain MRI is the primary structural diagnostic modality to
    characterize microlissencephaly, agyria-pachygyria, simplified gyral
    pattern, polymicrogyria-like cortical malformation, corpus callosum
    agenesis/hypoplasia, ventriculomegaly, and gray matter heterotopia.
  results: >-
    Demonstrates severe microcephaly with simplified gyration, pachygyria or
    agyria, callosal shortening or agenesis, ventriculomegaly, and variable
    periventricular or subcortical heterotopia.
  evidence:
  - reference: PMID:28440899
    reference_title: "Lissencephaly: Expanded imaging and clinical classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using these data plus published reports, we constructed a new imaging
      based classification system with 21 recognizable patterns that reliably
      predict the most likely causative genes.
    explanation: >-
      Supports brain neuroimaging pattern classification as a primary diagnostic
      step to guide genetic testing in lissencephaly-spectrum disorders.
  - reference: PMID:28079116
    reference_title: Katanin p80, NuMA and cytoplasmic dynein cooperate to control microtubule dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human mutations in KATNB1 (p80) cause severe congenital cortical
      malformations, which encompass the clinical features of both microcephaly
      and lissencephaly.
    explanation: >-
      Confirms that combined microcephaly and lissencephaly on neuroimaging is
      the core structural hallmark of KATNB1 mutations.

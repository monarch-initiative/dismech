  - target: Ventriculomegaly
    description: >-
      Reduced cerebral white and cortical volume leads to ex vacuo ventricular
      enlargement (ventriculomegaly).
  - target: Abnormal Corpus Callosum Morphology
    description: >-
      Depletion of callosal projection neurons and impaired microtubule-guided
      commissural axon growth result in corpus callosum hypoplasia, shortening,
      or agenesis.
  - target: Gray Matter Heterotopia
    description: >-
      Incomplete neuronal migration leaves clusters of ectopic gray matter in
      periventricular and subcortical regions.
  - target: Global Developmental Delay / Psychomotor Impairment
    description: >-
      Severe cortical malformation, reduced neuronal numbers, and disrupted
      dendritic architecture cause profound global developmental delay and
      psychomotor impairment.
  - target: Hypertonia
    description: >-
      Upper motor neuron and corticospinal tract dysgenesis secondary to
      cerebral cortical malformation leads to spastic hypertonia.
  - target: Seizures / Epilepsy
    description: >-
      Cortical dyslamination and ectopic neuronal networks create hyperexcitable
      cortical circuitry predisposing to seizures and epilepsy.
phenotypes:
- name: Microcephaly
  category: Neurological
  diagnostic: true
  description: >-
    Microcephaly is a core feature of reported KATNB1-related disease and may
    be congenital with further postnatal worsening in some individuals.
  notes: >-
    Characteristic feature in the 14 reported individuals reviewed by Peluso et
    al. (2021, PMID:34202629), with head circumference between -1.63 and -5.9 SD
    at birth and progressive postnatal reduction to below -6 SD in 8 of 14 cases
    (and below -11 SD in 1 case by age 12 years).
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:34202629
    reference_title: Whole Exome Sequencing Is the Minimal Technological Approach in Probands Born to Consanguineous Couples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Microcephaly is a characteristic feature of KATNB1-related syndrome, with
      head circumference between −1.63 and −5.9 SD at birth, while weight and
      length at birth are normal or just below the normal limits.
    explanation: >-
      Establishes congenital microcephaly (-1.63 to -5.9 SD at birth) as a
      characteristic feature across reported KATNB1-related cases.
  - reference: PMID:34202629
    reference_title: Whole Exome Sequencing Is the Minimal Technological Approach in Probands Born to Consanguineous Couples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Subsequently a further reduction of the head circumference has been
      observed, in eight cases out of 14 down to less than −6 SD and in one
      case less than −11 SD by the age of 12 years.
    explanation: >-
      Documents progressive postnatal worsening of microcephaly (< -6 SD in 8 of
      14 cases and < -11 SD in 1 case).
  - reference: PMID:28079116
    reference_title: Katanin p80, NuMA and cytoplasmic dynein cooperate to control microtubule dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human mutations in KATNB1 (p80) cause severe congenital cortical
      malformations, which encompass the clinical features of both microcephaly
      and lissencephaly.
    explanation: >-
      Supports congenital microcephaly as a core clinical feature of human
      KATNB1 mutations.
  - reference: PMID:25521378
    reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of KATNB1 orthologs in zebrafish (katnb1) and flies (kat80) results
      in microcephaly, recapitulating the human phenotype.
    explanation: >-
      Confirms that microcephaly is the characteristic human phenotype
      recapitulated by KATNB1 ortholog loss in animal models.

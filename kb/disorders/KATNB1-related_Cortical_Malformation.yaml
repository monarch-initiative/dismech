inheritance:
- name: Autosomal Recessive Inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    KATNB1-related cortical malformation is inherited in an autosomal recessive
    manner due to homozygous or compound heterozygous deleterious variants in
    KATNB1, frequently in consanguineous pedigrees, with variable expressivity
    across the microlissencephaly, simplified gyration, callosal, and
    neurodevelopmental spectrum.
  evidence:
  - reference: PMID:25521378
    reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing analysis of over 2,000 children with complex
      malformations of cortical development identified five independent (four
      homozygous and one compound heterozygous) deleterious mutations in
      KATNB1, encoding the regulatory subunit of the microtubule-severing enzyme
      Katanin.
    explanation: >-
      Five independent affected families carried homozygous or compound
      heterozygous deleterious KATNB1 mutations, establishing autosomal
      recessive inheritance.
  - reference: PMID:34202629
    reference_title: Whole Exome Sequencing Is the Minimal Technological Approach in Probands Born to Consanguineous Couples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A multigene panel for brain malformations and microcephaly identified the
      homozygous splicing variant NM_005886.3:c.1416+1del in the KATNB1 gene in
      the older sister.
    explanation: >-
      Homozygous KATNB1 splicing variant in a proband born to heterozygous
      consanguineous parents confirms autosomal recessive inheritance.
prevalence:
- population: Global published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare autosomal recessive cortical malformation syndrome; initial
    exome screening of more than 2,000 children with complex malformations of
    cortical development identified five independent families, and the
    literature review by Peluso et al. (2021, PMID:34202629) counted 13
    previously reported subjects from nine families plus their newly described
    proband (14 reported individuals across ten families globally).
  evidence:
  - reference: PMID:25521378
    reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing analysis of over 2,000 children with complex
      malformations of cortical development identified five independent (four
      homozygous and one compound heterozygous) deleterious mutations in
      KATNB1, encoding the regulatory subunit of the microtubule-severing enzyme
      Katanin.
    explanation: >-
      Screening over 2,000 children with complex malformations of cortical
      development identified five independent families with biallelic KATNB1
      mutations, demonstrating ultra-rare prevalence.
  - reference: PMID:34202629
    reference_title: Whole Exome Sequencing Is the Minimal Technological Approach in Probands Born to Consanguineous Couples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      So far, homozygous and compound heterozygous mutations in KATNB1 have
      been reported in 13 subjects, aged 11 months to 12 years, from nine
      families
    explanation: >-
      Literature synthesis by Peluso et al. documents 13 previously reported
      individuals across nine families worldwide (14 individuals across ten
      families including their newly reported proband), confirming ultra-rare
      prevalence.
progression:
- phase: Onset
  age_range: Congenital / antenatal to early infantile
  notes: >-
    Cortical malformations and microcephaly originate during embryonic and fetal
    corticogenesis and present congenitally at birth (or on prenatal imaging),
    followed by progressive postnatal microcephaly and global developmental
    impairment during infancy and childhood.
  evidence:
  - reference: PMID:28079116
    reference_title: Katanin p80, NuMA and cytoplasmic dynein cooperate to control microtubule dynamics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human mutations in KATNB1 (p80) cause severe congenital cortical
      malformations, which encompass the clinical features of both microcephaly
      and lissencephaly.
    explanation: >-
      Establishes congenital onset of the cortical malformation and microcephaly
      phenotype.
pathophysiology:
- name: Biallelic KATNB1 Loss and Katanin Microtubule-Severing Defect
  description: >-
    Homozygous or compound heterozygous deleterious KATNB1 variants impair the
    p80 regulatory subunit of the katanin microtubule-severing complex. This
    disrupts interaction of mutant KATNB1 with KATNA1 and other
    microtubule-associated proteins, placing altered microtubule remodeling at
    the top of the pathograph.

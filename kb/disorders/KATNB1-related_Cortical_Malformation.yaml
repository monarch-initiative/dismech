    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Furthermore, katnb1 null mutant mouse embryos revealed the role of this
      gene in regulating cilia number and function within the hedgehog
      signaling pathway
    explanation: >-
      Summarizes mouse embryo katnb1 null mutant evidence showing that KATNB1
      regulates cilia number and function within the Hedgehog signaling
      pathway.

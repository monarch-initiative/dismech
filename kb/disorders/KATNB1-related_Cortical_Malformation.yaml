genetic:
- name: KATNB1
  association: Causative
  gene_term:
    preferred_term: KATNB1
    term:
      id: hgnc:6217
      label: KATNB1
  features: >-
    Autosomal recessive homozygous or compound heterozygous loss-of-function and
    deleterious missense or splice-site variants (including
    NM_005886.3:c.1416+1del) affecting the WD40 and KATNA1-interacting domains
    of the katanin p80 regulatory subunit.
  evidence:
  - reference: PMID:25521378
    reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing analysis of over 2,000 children with complex
      malformations of cortical development identified five independent (four
      homozygous and one compound heterozygous) deleterious mutations in
      KATNB1, encoding the regulatory subunit of the microtubule-severing enzyme
      Katanin.
    explanation: >-
      Establishes KATNB1 as the causal gene in multiple independent affected
      families.
  - reference: PMID:34202629
    reference_title: Whole Exome Sequencing Is the Minimal Technological Approach in Probands Born to Consanguineous Couples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A multigene panel for brain malformations and microcephaly identified the
      homozygous splicing variant NM_005886.3:c.1416+1del in the KATNB1 gene in
      the older sister.
    explanation: >-
      Identifies the pathogenic homozygous KATNB1 canonical splice-site variant
      NM_005886.3:c.1416+1del in a proband with microcephaly and brain
      malformations.

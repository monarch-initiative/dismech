    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perampanel proved an effective treatment for our patient with prolonged super-refractory status epilepticus."
    explanation: A ROGDI-confirmed patient had prolonged super-refractory status epilepticus.
- category: Neurodevelopmental

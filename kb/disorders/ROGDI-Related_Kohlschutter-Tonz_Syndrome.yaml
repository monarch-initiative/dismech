- category: Neurological
  name: Epileptic encephalopathy
  description: >-
    Seizures begin in infancy or early childhood (in the Druze cohort between
    six and twelve months) and are often resistant to antiseizure medication;
    super-refractory status epilepticus has been reported. Seizure severity
    tracks the pace of cognitive and motor deterioration.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:40960323
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kohlschütter-Tönz syndrome (KTS) (OMIM#226750) is a rare autosomal recessive disorder characterized by epileptic encephalopathy, developmental delay, and amelogenesis imperfecta."
    explanation: Epileptic encephalopathy is a defining feature.
  - reference: PMID:37974187
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "100% exhibited epilepsy, global developmental delay, and amelogenesis imperfecta."
    explanation: All reviewed ROGDI-related cases had epilepsy.
  - reference: PMID:24630287
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KTS, a genetic disease heralded by convulsions, \"yellow teeth,\" and severe mental impairment, allows for a clinical variability as regarding age of onset and severity of seizures that per se predict the speed of mental deterioration."
    explanation: Seizure onset and severity predict the rate of deterioration in the Druze cohort.

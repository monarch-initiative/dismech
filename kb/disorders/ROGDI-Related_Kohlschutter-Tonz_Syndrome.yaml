name: ROGDI-Related Kohlschutter-Tonz Syndrome
category: Mendelian
creation_date: "2026-11-04T16:20:18Z"
synonyms:
- amelocerebrohypohidrotic syndrome
- Kohlschutter-Tonz syndrome
- Kohlschütter-Tönz syndrome
- KTZS
- epilepsy-dementia-amelogenesis imperfecta syndrome
- ROGDI-related disorder
description: >-
  An autosomal recessive neurodevelopmental and dental disorder caused by
  biallelic loss-of-function variants in ROGDI. It presents with the triad of
  early-onset, often drug-resistant epileptic encephalopathy, global
  developmental delay or psychomotor regression with severe intellectual
  disability and spasticity, and hypomineralized (hypomature) amelogenesis
  imperfecta with yellow-brown discoloration of both primary and permanent
  teeth. ROGDI is a subunit of the Rabconnectin-3 complex that assembles the
  vacuolar proton-pumping ATPase (V-ATPase), and defective V-ATPase-driven
  acidification is the leading model linking the enamel and neurological
  features.
notes: >-
  Named with the gene because Kohlschutter-Tonz syndrome is a clinical
  diagnosis with two genetic causes: biallelic SLC13A5 variants produce a
  ROGDI-negative presentation with neonatal epileptic encephalopathy and
  hypoplastic amelogenesis imperfecta (PMID:27600704), which MONDO files
  separately as developmental and epileptic encephalopathy 25 (MONDO:0014392).
  This entry is bound to MONDO:0009185, whose causal gene is ROGDI (OMIM
  226750), so the unqualified eponym would be broader than the entry.
  "ROGDI-related Kohlschütter-Tönz syndrome" is used in recent case reports
  (PMID:37974187, PMID:39445602). Orphanet's ORPHA:1946 covers both genes, so
  its phenotype frequencies describe the clinical syndrome rather than the
  ROGDI form alone. No GeneReviews chapter covers this disease.

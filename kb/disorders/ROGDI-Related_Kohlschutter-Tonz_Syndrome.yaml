  preferred_term: Kohlschutter-Tonz syndrome
  term:
    id: MONDO:0009185
    label: amelocerebrohypohidrotic syndrome
parents:
- developmental and epileptic encephalopathy
- amelogenesis imperfecta
- ectodermal dysplasia syndrome
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Orphanet rarity class for ORPHA:1946, which includes SLC13A5-associated
    cases. About 54 genetically confirmed ROGDI cases had been reported by 2025
    (PMID:41153423).
  evidence:
  - reference: ORPHA:1946
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | ORPHANET"
    explanation: Orphanet assigns Kohlschutter-Tonz syndrome a worldwide point-prevalence class below one per million.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Homozygous or compound heterozygous ROGDI variants; a founder nonsense
    variant (p.Arg157*) accounts for a cluster of Druze families in northern
    Israel.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:8357021
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report confirms the autosomal recessive inheritance of the disorder."
    explanation: Affected siblings born to consanguineous parents support recessive inheritance.
  - reference: PMID:22424600
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kohlschütter-Tönz syndrome (KTS) is an autosomal-recessive disease characterized by the combination of epilepsy, psychomotor regression, and amelogenesis imperfecta."
    explanation: The gene-discovery study describes the disease as autosomal recessive.
pathophysiology:
- name: ROGDI Loss of Function
  description: >-
    Biallelic nonsense, frameshift, splice-site and intragenic deletion
    variants abolish ROGDI protein. Most variants are expected to trigger
    nonsense-mediated decay or to disrupt the four-helix bundle that holds the
    protein's alpha domain together; the first missense variant was reported
    only in 2025, in trans to a frameshift.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ROGDI
    term:
      id: hgnc:29478
      label: ROGDI
  evidence:
  - reference: PMID:22482807
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wild-type ROGDI localizes to the nuclear envelope; ROGDI was not detectable in cells of affected individuals."
    explanation: Patient cells homozygous for the founder nonsense variant lack ROGDI protein.
  - reference: CGGV:assertion_dc4132b5-fd80-440b-b7ae-65f4d28f33f1-2022-06-21T160000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is known to be homozygous or compound heterozygous loss of function."
    explanation: ClinGen records biallelic loss of function as the disease mechanism.
  - reference: PMID:28638151
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Disruption of the four-helix bundle by mutation results in significant destabilization of the structure."
    explanation: The crystal structure shows how patient-type truncations destabilize ROGDI.
  downstream:
  - target: Impaired Rabconnectin-3-Dependent V-ATPase Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40049412
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We identified ROGDI as a Rav2 homolog and novel Rabconnectin-3 subunit."
      explanation: >-
        ROGDI is a structural subunit of the complex that reassembles the
        V-ATPase, so its loss is expected to impair that assembly step.
- name: Impaired Rabconnectin-3-Dependent V-ATPase Assembly
  description: >-
    ROGDI is the human homolog of yeast Rav2 and binds the N-terminal domains
    of both Rabconnectin-3 alpha (DMXL1/DMXL2) and beta (WDR7), probably
    bridging the two subunits. Rabconnectin-3 drives reassociation of the V1
    and V0 sectors of the V-ATPase, which reactivates proton pumping and
    organelle acidification. Loss of ROGDI is therefore expected to reduce
    V-ATPase assembly; this has been shown by complementation in yeast and by
    interaction studies, not yet by direct measurement in patient cells.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: V-ATPase assembly
    term:
      id: GO:0070070
      label: proton-transporting V-type ATPase complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:40049412
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ROGDI shares extensive structural homology with yeast Rav2 and can functionally replace Rav2 in yeast."
    explanation: ROGDI substitutes for the yeast V-ATPase assembly factor Rav2.
  - reference: PMID:40049412
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ROGDI binds to the N-terminal domains of both Rabconnectin-3 α and β, similar to Rav2 binding to Rav1."
    explanation: ROGDI binds both Rabconnectin-3 subunits, as Rav2 binds Rav1 in the yeast RAVE complex.
  downstream:
  - target: Defective Ameloblast Acidification During Enamel Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38172607
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Rogdi-/- mutant defects in acidification might explain the unusual combination of enamel and rare neurological disease symptoms."
      explanation: The mouse study proposes impaired V-ATPase-driven acidification as the link to the enamel defect.
  - target: Presynaptic Dysfunction in Cortical Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38172607
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Synaptic signal propagation requires neurotransmitter release 94 ; hence, V-ATPase or other acidification disruptions could produce a range of ID, epilepsy, or hyperactivity symptoms 73 ."
      explanation: >-
        States the hypothesis that disrupted V-ATPase acidification impairs
        synaptic vesicle loading and transmission; not yet measured in ROGDI
        models.
- name: Defective Ameloblast Acidification During Enamel Maturation
  description: >-
    Enamel maturation requires cyclic acidification of the enamel organ so
    that matrix proteins are removed and hydroxyapatite crystals can grow.
    Rogdi-null mouse incisors show no cyclic acidification, reduced expression
    of the enamel matrix genes Enam, Amelx and Ambn, and altered expression of
    V-ATPase-interacting genes (Wdr72, Slc9a3r2, Atp6v0c).
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: vacuolar acidification
    term:
      id: GO:0007035
      label: vacuolar acidification
    modifier: DECREASED
  evidence:
  - reference: PMID:38172607
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rogdi-/- teeth exhibit no signs of cyclic dental acidification."
    explanation: Rogdi-null mice lack the cyclic acidification of maturation-stage enamel.
  - reference: PMID:38172607
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptomic RNA sequencing of postnatal day 5 lower incisors showed downregulated enamel matrix proteins Enam, Amelx, and Ambn."
    explanation: Ameloblast enamel matrix gene expression is reduced in Rogdi-null incisors.
  downstream:
  - target: Hypomineralized Enamel
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38172607
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Enamel crystallization appears highly pH-dependent, cycling between an acidic and neutral pH during enamel maturation."
      explanation: Enamel crystal growth depends on the pH cycling that is absent in Rogdi-null teeth.
- name: Hypomineralized Enamel
  description: >-
    The enamel of both dentitions is soft, rough, porous and stained yellow to
    brown, the hypomature/hypocalcified form of amelogenesis imperfecta. This
    distinguishes ROGDI-related disease from the hypoplastic enamel defect of
    SLC13A5-related cases.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  evidence:
  - reference: PMID:38172607
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scanning electron microscopy confirmed its hypomineralized/hypomature crystallization, as well as its low mineral content."
    explanation: Rogdi-null enamel is hypomineralized with immature crystals.
  - reference: PMID:27600704
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In comparison, the histological evaluation of a molar assessed from an individual with ROGDI-associated KTZS revealed hypocalcified AI."
    explanation: Histology of a patient's tooth shows hypocalcified enamel.
  downstream:
  - target: Amelogenesis imperfecta
  - target: Yellow-brown discoloration of the teeth
- name: Presynaptic Dysfunction in Cortical Neurons
  description: >-
    ROGDI is enriched at presynaptic sites, where it colocalizes with Bassoon
    and synaptic vesicle markers. Synaptic vesicles are loaded with
    neurotransmitter using the proton gradient generated by the V-ATPase, so
    loss of ROGDI is proposed to impair vesicle acidification and transmitter
    release. Rogdi-null mice have a lowered seizure threshold, hyperactivity and
    memory deficits. The precise synaptic defect has not been measured, and
    brain MRI is often normal early in the disease.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synaptic vesicle lumen acidification
    term:
      id: GO:0097401
      label: synaptic vesicle lumen acidification
    modifier: DECREASED
  evidence:
  - reference: PMID:29150638
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Thus, the neurological symptoms associated with Kohlschütter-Tönz syndrome may arise from presynaptic dysfunction."
    explanation: ROGDI is a presynaptic protein in cultured neurons, suggesting a presynaptic disease mechanism.
  - reference: PMID:38172607
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutants displayed pentylenetetrazol-induced seizures, confirming epilepsy susceptibility."
    explanation: Rogdi-null mice have increased seizure susceptibility.
  downstream:
  - target: Epileptic encephalopathy
  - target: Developmental regression
  - target: Global developmental delay
  - target: Severe intellectual disability
  - target: Absent speech
  - target: Attention deficit hyperactivity disorder
phenotypes:
- category: Dental
  name: Amelogenesis imperfecta
  description: >-

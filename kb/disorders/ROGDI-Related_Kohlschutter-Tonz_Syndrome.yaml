    explanation: Reviews the reported patients, all of whom regressed after seizure onset or were delayed from birth.
  - reference: PMID:24630287
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By late adolescence and early twenties, individuals with KTS are bedridden, fed by a gastrostomy tube, spastic, and practically have no cognitive and language perception."
    explanation: Describes the end state of progressive deterioration in founder-variant patients.

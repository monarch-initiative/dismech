  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Biallelic loss-of-function variants (nonsense, frameshift, splice-site,
    intragenic and exon-level deletions, and deep intronic deletions missed by
    exome sequencing). One missense variant has been reported, in trans to a
    frameshift.
  gene_disease_validity:

    permanent teeth, and is often what first prompts genetic referral.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Amelogenesis imperfecta
    term:
      id: HP:0000705
      label: Amelogenesis imperfecta
  evidence:
  - reference: PMID:37974187
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "100% exhibited epilepsy, global developmental delay, and amelogenesis imperfecta."
    explanation: All 43 reviewed ROGDI-related cases had amelogenesis imperfecta.
  - reference: PMID:22482807
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals suffered seizures, were unable to speak, and had amelogenesis imperfecta."
    explanation: Every Druze founder-variant patient had amelogenesis imperfecta.

differential_diagnoses:
- name: Developmental and epileptic encephalopathy 25
  description: >-
    Biallelic SLC13A5 variants cause a ROGDI-negative presentation that was
    diagnosed clinically as Kohlschutter-Tonz syndrome. Seizures usually begin
    in the neonatal period and the enamel defect is hypoplastic rather than
    hypocalcified, with wide interdental spaces.
  disease_term:
    preferred_term: SLC13A5-related epileptic encephalopathy
    term:
      id: MONDO:0014392
      label: developmental and epileptic encephalopathy, 25
  distinguishing_features:
  - Neonatal rather than infantile seizure onset.
  - Hypoplastic amelogenesis imperfecta with wide interdental spaces.
  - Biallelic SLC13A5 rather than ROGDI variants.
  evidence:
  - reference: PMID:27600704
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that SLC13A5 is the second major gene associated with the clinical diagnosis of KTZS, characterised by neonatal epileptic encephalopathy and hypoplastic AI."
    explanation: SLC13A5 explains ROGDI-negative KTS, with neonatal onset and hypoplastic enamel.
treatments:
- name: Antiseizure Pharmacotherapy
  description: >-
    Seizures are often drug-resistant. Valproate, levetiracetam and other
    antiseizure medications are used; perampanel controlled seizures in a
    Chinese patient and terminated super-refractory status epilepticus in a
    Latvian patient. Vagus nerve stimulation and the ketogenic diet were
    ineffective in one reported patient. No disease-specific therapy exists.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: perampanel
      term:
        id: CHEBI:71013
        label: perampanel
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Epileptic encephalopathy
  evidence:
  - reference: PMID:37974187
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The efficacy of perampanel (PMP) in treating seizures and intellectual disability was apparent."
    explanation: Perampanel improved seizures in a ROGDI-confirmed patient followed for six years.
  - reference: PMID:34939736
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perampanel proved an effective treatment for our patient with prolonged super-refractory status epilepticus."
    explanation: Perampanel terminated super-refractory status epilepticus in a single patient.
- name: Restorative Dental Treatment
  description: >-
    Restoration of hypomineralized, sensitive and caries-prone teeth, often
    under general anesthesia because of the neurological disability; anesthesia
    risk can limit care to conservative management.
  treatment_term:
    preferred_term: restorative dental treatment under general anesthesia
    term:
      id: NCIT:C60718
      label: Dental Restoration
  target_mechanisms:
  - target: Amelogenesis imperfecta
  evidence:
  - reference: PMID:40960323
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The younger sibling received successful restorative treatment under general anesthesia, while the older sibling's oral care was managed conservatively due to contraindications for general anesthesia."
    explanation: Restorative dental care under general anesthesia was used in a ROGDI-confirmed sibling.
animal_models:
- name: Rogdi exon 6-11 knockout mouse
  species: Mouse
  genotype: Rogdi-/- (deletion of exons 6-11)
  publication: PMID:38172607
  description: >-
    Deletes the exons removed in some patients. Recapitulates seizure
    susceptibility, hyperactivity, memory deficits and hypomineralized enamel.
  modeled_mechanisms:
  - target: Defective Ameloblast Acidification During Enamel Maturation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Rogdi-null incisors lose cyclic enamel acidification.
    evidence:
    - reference: PMID:38172607
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Rogdi-/- teeth exhibit no signs of cyclic dental acidification."
      explanation: Direct observation of the acidification defect in the model.
  - target: Presynaptic Dysfunction in Cortical Neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the behavioral and seizure-susceptibility consequences but
      shows only induced, not spontaneous, seizures.
    limitations: >-
      Seizures were provoked with pentylenetetrazol; the presynaptic or vesicle
      acidification defect itself was not measured.
    evidence:
    - reference: PMID:38172607
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutants displayed pentylenetetrazol-induced seizures, confirming epilepsy susceptibility."
      explanation: The model shows increased seizure susceptibility.
- name: Drosophila rogdi mutant
  species: Fruit fly
  genotype: rogdi loss-of-function mutant
  publication: PMID:28900300
  description: >-
    Rogdi mutant flies sleep poorly because metabotropic GABA transmission onto
    wake-promoting dopaminergic neurons is reduced. The study proposes that a
    similar loss of GABAergic inhibition could underlie seizures in KTS; this
    has not been tested in a vertebrate model.
  modeled_mechanisms:
  - target: Presynaptic Dysfunction in Cortical Neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows a presynaptic GABAergic transmission defect in an invertebrate
      circuit.
    limitations: >-
      The phenotype measured is sleep, not seizures; the circuit has no
      mammalian cortical counterpart, and V-ATPase function was not examined.
    evidence:
    - reference: PMID:28900300
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we demonstrate that a Drosophila homolog of Rogdi acts as a novel sleep-promoting factor by supporting a specific subset of gamma-aminobutyric acid (GABA) transmission."
      explanation: Loss of fly Rogdi reduces a subset of GABAergic transmission.
discussions:
- discussion_id: rogdi_vatpase_acidification_untested_in_mammalian_cells
  prompt: >-
    Does loss of ROGDI reduce V-ATPase assembly and the acidification of
    synaptic vesicles, ameloblast compartments and renal intercalated cells in
    mammalian cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Rabconnectin-3-Dependent V-ATPase Assembly
  - pathophysiology#Presynaptic Dysfunction in Cortical Neurons
  rationale: >-
    ROGDI's role in V-ATPase assembly rests on yeast Rav2 complementation and
    interaction studies, and the acidification defect has been observed only in
    Rogdi-null mouse enamel. Neither V-ATPase assembly nor synaptic vesicle pH
    has been measured in ROGDI-deficient neurons, so the neurological branch of
    the pathograph and the explanation for the rare renal findings remain
    inferences.
  evidence:
  - reference: PMID:40049412
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The discovery of ROGDI as a novel Rabconnectin-3 interactor sheds new light on both Kohlschutter-Tonz syndrome and the mechanisms behind mammalian V-ATPase regulation."
    explanation: Establishes the Rabconnectin-3 link without measuring acidification in patient-relevant mammalian cells.

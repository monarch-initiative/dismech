      for L-cell tumors.
- name: Tumor Growth and Tissue Invasion
  description: >-
    Increasing tumor size and extension into the serosa or mesoappendix mark a more
    advanced local lesion. Size is associated with nodal disease, but small tumors
    confined to the appendix are overwhelmingly indolent.
  biological_scale: TISSUE
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  biological_processes:

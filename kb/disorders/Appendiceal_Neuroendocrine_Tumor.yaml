    evidence_source: OTHER
    snippet: >-
      Follow-up remains debatable, as the use of imaging and biomarkers lacks
      validation.
    explanation: >-
      The contemporary review directly documents the evidence gap around follow-up
      tools.
discussions:
- discussion_id: gap_appendiceal_net_cell_type_prognosis
  prompt: >-
    Does EC-cell, L-cell, or mixed-cell differentiation independently predict
    clinically meaningful recurrence or survival after adjustment for tumor size,
    grade, and invasion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#EC-, L-, and Mixed-Cell Tumor Differentiation
  - pathophysiology#Tumor Growth and Tissue Invasion
  rationale: >-
    One retrospective 135-tumor series found strong clinicopathologic differences by
    cell phenotype, but broader validation is needed before cell typing can be treated
    as an independent management classifier.
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor type correlated with pT stage and the only patient with distant metastatic
      disease in this series had an EC-cell tumor.
    explanation: >-
      The single retrospective series motivates, but does not resolve, independent
      prognostic validation of cell type.
- discussion_id: controversy_appendiceal_net_surgery_and_follow_up
  prompt: >-
    Which patients with completely resected 1-2 cm appendiceal NETs benefit from
    completion right hemicolectomy or structured long-term surveillance?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#Appendectomy
  - treatments#Selected Completion Right Hemicolectomy
  - treatments#Selective Post-Treatment Surveillance
  rationale: >-
    Long-follow-up cohorts find no survival advantage from routine hemicolectomy in
    completely resected 1-2 cm tumors, yet the optimal interpretation of nodal disease
    and the design and duration of follow-up remain unsettled.
  evidence:
  - reference: PMID:38168835
    reference_title: "Appendiceal Neuroendocrine Neoplasms: an Update for 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Future studies should address the prognostic impact of lymph node metastases and
      the optimal design and duration of follow-up.
    explanation: >-
      The review directly identifies the unresolved nodal-prognosis and follow-up
      questions.
  - reference: PMID:36640790
    reference_title: "Hemicolectomy versus appendectomy for patients with appendiceal neuroendocrine tumours 1-2 cm in size: a retrospective, Europe-wide, pooled cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival was similar between patients with appendectomy and right-sided
      hemicolectomy
    explanation: >-
      The pooled cohort supplies the central comparative evidence behind surgical
      de-escalation in this group.

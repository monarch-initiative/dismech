name: Appendiceal Neuroendocrine Tumor
creation_date: "2026-06-08T00:00:00Z"
description: >-
  Appendiceal neuroendocrine tumors (appendiceal NETs) are well-differentiated
  epithelial neuroendocrine neoplasms of the vermiform appendix that are often
  detected incidentally in appendectomy specimens. They are heterogeneous rather
  than uniformly serotonin-producing: a 135-tumor series classified 56% as
  enterochromaffin (EC)-cell tumors, 27% as L-cell tumors, and 17% as mixed tumors.
  Most localized tumors are indolent, but tumor size, invasion, and Ki67-based grade
  inform risk assessment. Appendectomy is sufficient for tumors smaller than 1 cm
  and, after complete resection, for many tumors measuring 1-2 cm; routine completion
  right hemicolectomy has not shown a survival advantage in the 1-2 cm group.
  Serotonin-directed biochemistry and carcinoid-syndrome assumptions apply only to
  the serotonin-producing branch. Goblet cell adenocarcinoma is a distinct
  appendiceal epithelial malignancy, not an appendiceal NET subtype.
categories:
- Solid Tumor
- Gastrointestinal Cancer
- Neuroendocrine Neoplasm
parents:
- neuroendocrine tumor
- appendix cancer
disease_term:
  preferred_term: appendiceal neuroendocrine tumor
  term:
    id: MONDO:0015066
    label: neuroendocrine tumor of the appendix, well differentiated, low or intermediate grade
progression:
- phase: Incidental localized disease
  notes: >-
    Most appendiceal NETs are clinically silent and are discovered by pathologic
    examination after appendectomy, commonly performed for a clinical presentation
    attributed to appendicitis. The appendicitis presentation should not be treated
    as proof that the tumor caused the inflammation in every patient.
  evidence:
  - reference: PMID:37574653
    reference_title: "Appendiceal Neuroendocrine Neoplasms: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most acute presentations are attributed clinically to appendicitis, with most
      cases detected incidentally on pathology after an appendectomy.
    explanation: >-
      The review directly supports the common incidental route to diagnosis while
      preserving the distinction between clinical attribution and established tumor
      causation.
- phase: Rare regional or distant progression
  notes: >-
    Recurrence and disease-specific death are uncommon, but late recurrence can occur.
    Long-term follow-up is therefore selective rather than automatically intensive for
    every completely resected small tumor.
  evidence:
  - reference: PMID:33004273
    reference_title: The impact of lymph node metastases and right hemicolectomy on outcomes in appendiceal neuroendocrine tumours (aNETs).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aNETs are indolent with very high rates of overall and relapse-free survival.
      Recurrence is rare, and in this series only occurred decades later, making a
      compelling case for selective surveillance and follow-up.
    explanation: >-
      The long-term cohort supports an uncommon but potentially late progressive
      phase and a selective surveillance strategy.
pathophysiology:
- name: Appendiceal Enteroendocrine-Cell Neoplasia
  description: >-
    A well-differentiated epithelial neuroendocrine neoplasm develops in the
    appendiceal enteroendocrine-cell compartment. This disease-level initiating node
    does not assume that every tumor has EC-cell differentiation or serotonin
    production.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: enteroendocrine cell
    term:
      id: CL:0000164
      label: enteroendocrine cell
  locations:
  - preferred_term: vermiform appendix
    term:
      id: UBERON:0001154
      label: vermiform appendix
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Appendiceal neuroendocrine tumors (NETs) are common and often are identified as
      incidental lesions at the time of appendectomy.
    explanation: >-
      This appendiceal pathology series establishes the organ-specific neuroendocrine
      neoplasm studied by this node.
  downstream:
  - target: EC-, L-, and Mixed-Cell Tumor Differentiation
    description: >-
      Appendiceal NETs differentiate into at least three immunophenotypic cell-type
      patterns.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38833137
      reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunohistochemistry identified three types of appendiceal NETs. There were 75
        (56%) classified as EC-cell tumors and 37 (27%) classified as L-cell tumors;
        the remaining 23 (17%) expressed serotonin and one of the L-cell biomarkers
        and were classified as mixed.
      explanation: >-
        The cohort directly defines the EC-cell, L-cell, and mixed differentiation
        patterns.
  - target: Tumor Growth and Tissue Invasion
    description: >-
      Neoplastic outgrowth produces a measurable appendiceal tumor that can extend
      through the appendiceal wall and into the mesoappendix.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33754384
      reference_title: "Risk factors for progression of appendiceal neuroendocrine tumours: low-stage tumours <5 mm appear to be overwhelmingly indolent and may merit a separate designation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Small (<5 mm) App-NETs that do not invade the serosa or mesoappendix appear to
        be overwhelmingly benign and low-grade
      explanation: >-
        Human pathology links appendiceal tumor size and tissue invasion to behavior,
        but does not resolve every molecular intermediate in tumor progression.
  - target: Appendiceal Neuroendocrine Tumor
    description: >-
      The appendiceal neuroendocrine neoplasm is the defining pathologic phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33754384
      reference_title: "Risk factors for progression of appendiceal neuroendocrine tumours: low-stage tumours <5 mm appear to be overwhelmingly indolent and may merit a separate designation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Appendiceal well-differentiated neuroendocrine tumours (NETs) are usually
        incidental and clinically benign.
      explanation: >-
        The cohort directly identifies the defining appendiceal well-differentiated
        neuroendocrine-tumor phenotype.
- name: EC-, L-, and Mixed-Cell Tumor Differentiation
  description: >-
    Appendiceal NETs show EC-cell, L-cell, or mixed immunophenotypic differentiation.
    In the available 135-tumor retrospective series, EC-cell tumors were the largest
    group but were not universal; L-cell tumors formed more than one quarter of cases.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: enteroendocrine cell
    term:
      id: CL:0000164
      label: enteroendocrine cell
  biological_processes:
  - preferred_term: cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030154
      label: cell differentiation
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study confirms that appendiceal NETs are not a homogeneous tumor
      population. There are at least three types of appendiceal NET, including
      EC-cell, L-cell, and mixed tumors.
    explanation: >-
      The series directly establishes cell-type heterogeneity within appendiceal
      NETs.
  downstream:
  - target: Serotonin-Producing EC-Cell Branch
    description: >-
      EC-cell differentiation defines the serotonin-producing branch; mixed tumors
      can also express serotonin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38833137
      reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There were 75 (56%) classified as EC-cell tumors and 37 (27%) classified as
        L-cell tumors; the remaining 23 (17%) expressed serotonin and one of the
        L-cell biomarkers and were classified as mixed.
      explanation: >-
        The immunophenotypic series directly links EC-cell and a subset of mixed
        tumors to serotonin expression.
  - target: Tumor Growth and Tissue Invasion
    description: >-
      Cell phenotype was associated with size and invasion in one retrospective
      series, with EC-cell tumors showing the greatest and mixed tumors intermediate
      involvement.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38833137
      reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        EC-cell tumors were significantly larger with more extensive invasion
        involving the muscularis propria, subserosa, and mesoappendix compared with
        L-cell tumors. Mixed tumors were intermediate in all of these parameters.
      explanation: >-
        This supports a human association between cell phenotype and invasive
        behavior, but not a fully resolved causal mechanism.
- name: Serotonin-Producing EC-Cell Branch
  description: >-
    EC-cell tumors, and the serotonin-expressing component of mixed tumors, retain a
    serotonin-producing phenotype. This branch is explicitly conditional and must not
    be generalized to L-cell tumors or to every appendiceal NET.

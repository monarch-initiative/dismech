- name: Tumor-Cell Immunophenotyping
  presence: >-
    When tumor-cell typing is clinically relevant, immunohistochemistry for serotonin
    and L-cell-associated hormones and markers can distinguish EC-cell, L-cell, and
    mixed patterns.
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  results: >-
    Serotonin-predominant staining supports EC-cell differentiation; GLP, PYY, or PP
    staining supports L-cell differentiation; combined expression supports a mixed
    pattern.
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry identified three types of appendiceal NETs.
    explanation: >-
      The cohort directly supports immunohistochemical separation of three tumor-cell
      patterns.
- name: Selective Hormone-Directed Biochemistry
  presence: >-
    Urinary 5-HIAA is considered only for a serotonin-producing tumor context; GLPs
    and/or pancreatic polypeptide are more biologically aligned with an L-cell tumor.
    These measurements are not universal screening tests for every localized
    appendiceal NET.
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  results: >-
    Elevated urinary 5-HIAA supports serotonin production but a normal result does not
    exclude an L-cell or nonfunctioning appendiceal NET.
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      monitoring urinary 5HIAA levels is only appropriate for patients with
      serotonin-producing tumors, whereas measurement of GLPs and/or PP is more
      appropriate for patients with L-cell tumors.
    explanation: >-
      This disease-specific series directly supports phenotype-directed rather than
      universal biochemical testing.
differential_diagnoses:
- name: Goblet Cell Adenocarcinoma
  description: >-
    Goblet cell adenocarcinoma, historically called goblet cell carcinoid, is an
    amphicrine appendiceal epithelial malignancy with glandular and neuroendocrine
    differentiation. Despite historical terminology and partial neuroendocrine marker
    expression, it is not an appendiceal NET subtype.
  distinguishing_features:
  - Glandular or mucinous morphology with goblet-cell differentiation rather than a conventional well-differentiated NET pattern.
  - Staged and treated as an adenocarcinoma rather than as an appendiceal neuroendocrine tumor.
  - A mutational profile distinct from both appendiceal NET and conventional appendiceal adenocarcinoma in the available genomic series.
  evidence:
  - reference: PMID:29634977
    reference_title: Genomic profile of appendiceal goblet cell carcinoid is distinct compared to appendiceal neuroendocrine tumor and conventional adenocarcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Goblet cell carcinoid (GCC) is a rare appendiceal tumor with unique morphologic
      features that shows glandular and neuroendocrine differentiation on
      immunohistochemistry. An additional component of adenocarcinoma (AC) can be
      present (GCC-AC). Both GCC and GCC-AC are staged and treated like AC.
    explanation: >-
      The genomic-pathology series directly establishes the amphicrine morphology and
      adenocarcinoma management framework.
  - reference: PMID:29634977
    reference_title: Genomic profile of appendiceal goblet cell carcinoid is distinct compared to appendiceal neuroendocrine tumor and conventional adenocarcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This limited series reveals mutations in SOX9, RHOA, and chromatin-modifier
      genes in goblet cell tumors, and shows that the mutational profile of GCC/GCC-AC
      is distinct from NET and conventional appendiceal AC.
    explanation: >-
      The molecular distinction supports modeling goblet cell adenocarcinoma as a
      differential rather than a subtype.
treatments:
- name: Appendectomy
  description: >-
    Simple appendectomy is sufficient for tumors smaller than 1 cm. After complete
    primary-tumor resection, long-term pooled data also support appendectomy alone for
    many 1-2 cm tumors rather than automatic completion hemicolectomy.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: appendectomy
    term:
      id: NCIT:C51687
      label: Appendectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Appendiceal Enteroendocrine-Cell Neoplasia
    treatment_effect: INHIBITS
    description: Complete appendectomy removes the localized appendiceal tumor.
    evidence:
    - reference: PMID:38168835
      reference_title: "Appendiceal Neuroendocrine Neoplasms: an Update for 2023."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Simple appendectomy is sufficient in tumors < 1 cm while extended surgery is
        indicated in tumors > 2 cm.
      explanation: >-
        The contemporary review directly supports appendectomy as definitive local
        treatment for tumors smaller than 1 cm.
  evidence:
  - reference: PMID:38168835
    reference_title: "Appendiceal Neuroendocrine Neoplasms: an Update for 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Simple appendectomy is sufficient in tumors < 1 cm while extended surgery is
      indicated in tumors > 2 cm.
    explanation: >-
      The update directly supports appendectomy for sub-centimeter tumors.
  - reference: PMID:36640790
    reference_title: "Hemicolectomy versus appendectomy for patients with appendiceal neuroendocrine tumours 1-2 cm in size: a retrospective, Europe-wide, pooled cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study provides evidence that right-sided hemicolectomy is not indicated
      after complete resection of an appendiceal NET of 1-2 cm in size by appendectomy
    explanation: >-
      The long-follow-up pooled cohort supports appendectomy alone after complete
      resection in the 1-2 cm group.
- name: Selected Completion Right Hemicolectomy
  description: >-
    Extended surgery is indicated for tumors larger than 2 cm and can be considered in
    selected 1-2 cm cases with incomplete resection or higher grade. It should not be
    presented as routine after complete appendectomy for every 1-2 cm tumor because
    pooled long-term data found no survival advantage.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: right colectomy
    term:
      id: NCIT:C51623
      label: Right Colectomy
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:38168835
    reference_title: "Appendiceal Neuroendocrine Neoplasms: an Update for 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a multicenter study of aNENs measuring 1-2 cm, extended surgery offered no
      significant prognostic advantage and is now limited to incomplete tumor
      resection or high-grade G2 or G3 aNEN.
    explanation: >-
      The review restricts extended surgery in the intermediate-size group to selected
      higher-risk contexts.
  - reference: PMID:36640790
    reference_title: "Hemicolectomy versus appendectomy for patients with appendiceal neuroendocrine tumours 1-2 cm in size: a retrospective, Europe-wide, pooled cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival was similar between patients with appendectomy and right-sided
      hemicolectomy
    explanation: >-
      The pooled cohort directly supports avoiding routine hemicolectomy solely because
      a completely resected tumor measures 1-2 cm.
- name: Somatostatin Analogues for Rare Advanced or Functional Disease
  description: >-
    Somatostatin analogues such as octreotide are systemic options for advanced
    gastroenteropancreatic NETs and hormone-syndrome control. Their inclusion here is
    limited to rare advanced or functional appendiceal disease and is an extrapolation
    from the broader gastrointestinal NET evidence base, not an appendiceal-specific
    trial result.
  action_category: THERAPEUTIC

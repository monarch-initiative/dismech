    snippet: >-
      Appendiceal neuroendocrine tumors (NETs) are common and often are identified as
      incidental lesions at the time of appendectomy. The guidelines for management
      are based on tumor size, degree of invasion, and the Ki67 proliferation index.
    explanation: >-
      The appendiceal series directly supports incidental pathologic diagnosis and the

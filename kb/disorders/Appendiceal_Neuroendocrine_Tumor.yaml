  - reference: PMID:33754384
    reference_title: "Risk factors for progression of appendiceal neuroendocrine tumours: low-stage tumours <5 mm appear to be overwhelmingly indolent and may merit a separate designation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increasing tumour size was associated with an increased risk of nodal disease
    explanation: >-
      This pathology cohort directly supports tumor size as a clinical risk correlate
      for nodal involvement.
  downstream:
  - target: Regional Nodal and Rare Distant Spread
    description: >-
      Larger and invasive tumors have a higher observed probability of regional nodal
      involvement, although the biological intermediates and prognostic importance of
      nodal disease remain incompletely resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33754384

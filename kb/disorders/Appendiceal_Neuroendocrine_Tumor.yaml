      snippet: >-
        Increasing tumour size was associated with an increased risk of nodal disease
      explanation: >-
        The observed size-node association supports the clinical edge while leaving
        the intervening biology and causal direction incompletely specified.
- name: Regional Nodal and Rare Distant Spread
  description: >-
    A minority of appendiceal NETs involve regional lymph nodes, whereas distant
    metastasis and tumor-related mortality are rare in contemporary long-term cohorts.
    The clinical importance of microscopic regional nodal disease is disputed.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:36640790
    reference_title: "Hemicolectomy versus appendectomy for patients with appendiceal neuroendocrine tumours 1-2 cm in size: a retrospective, Europe-wide, pooled cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regional lymph node metastases were found in 22 (20%) of 112 patients with
      right-sided hemicolectomy with available data.
    explanation: >-
      The pooled cohort documents regional nodal involvement in resected 1-2 cm
      tumors.
  - reference: PMID:36640790
    reference_title: "Hemicolectomy versus appendectomy for patients with appendiceal neuroendocrine tumours 1-2 cm in size: a retrospective, Europe-wide, pooled cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All metastases were diagnosed synchronously with no tumour-related deaths during
      follow-up.
    explanation: >-
      The same long-follow-up cohort supports the rarity and limited mortality impact
      of distant spread in this size-defined population.
histopathology:
- name: Well-Differentiated Appendiceal Neuroendocrine Tumor
  diagnostic: true
  description: >-
    The defining microscopic lesion is a well-differentiated epithelial
    neuroendocrine tumor in the appendix. Tumor size, depth of invasion, and Ki67
    proliferation index are recorded for risk stratification; G1 and G2 are grades,
    not separate disease subtypes in this entry.
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The guidelines for management are based on tumor size, degree of invasion, and
      the Ki67 proliferation index.
    explanation: >-
      The appendiceal pathology series directly supports the core histopathologic risk
      variables.
- name: EC-, L-, and Mixed-Cell Immunophenotypes
  description: >-
    Immunohistochemistry for serotonin and L-cell-associated markers can resolve
    EC-cell, L-cell, and mixed appendiceal NET patterns. This is a tumor-cell
    classification within appendiceal NET, not a claim that each pattern is yet a
    validated independent clinical subtype.
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed the expression of biomarkers including CDX2, SATB2, PSAP,
      serotonin, glucagon (that detects GLPs), PYY, and pancreatic polypeptide (PP)
      and correlated the results with clinicopathologic parameters.
    explanation: >-
      The series directly describes the immunohistochemical marker panel used for
      tumor-cell classification.

review_notes: >-
  The 2026 re-review removed WHO grades and goblet cell adenocarcinoma from the subtype
  list, replaced a universal EC-cell/serotonin/carcinoid-syndrome model with
  appendiceal-specific EC-, L-, and mixed-cell evidence, removed unsupported general
  symptoms, added pathology and differential-diagnosis structure, and calibrated
  surgery and surveillance to long-term comparative cohorts. The somatostatin-analogue
  statement is retained only as explicitly labeled extrapolation for rare advanced
  gastrointestinal NET disease.

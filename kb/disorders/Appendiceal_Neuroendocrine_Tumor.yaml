    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A well-differentiated appendiceal neuroendocrine tumor establishes the diagnosis;
    size, invasion, margins, and Ki67 refine postoperative risk assessment.
  evidence:
  - reference: PMID:38833137
    reference_title: "The Clinicopathological Significance of Tumor Cell Subtyping in Appendiceal Neuroendocrine Tumors: A Series of 135 Tumors."

- name: PXT3003
  description: >-
    Oral fixed-dose combination of low-dose baclofen, naltrexone, and
    sorbitol designed to lower PMP22 expression and improve axonal
    function in CMT1A. Phase III trials (PLEO-CMT NCT02579759 completed,
    PREMIER NCT04762758).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: DOI:10.3390/genes14071391
    reference_title: "The Current State of Charcot–Marie–Tooth Disease Treatment"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Compounds such as PXT3003, which are being clinically and preclinically investigated, and a broad array of therapeutic agents and their corresponding mechanisms are discussed."
    explanation: Establishes PXT3003 as an active clinical/preclinical therapeutic candidate for CMT.
  - reference: PMID:34656144
    reference_title: "A double-blind, placebo-controlled, randomized trial of PXT3003 for the treatment of Charcot-Marie-Tooth type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high-dose group demonstrated a statistically significant improvement in the primary endpoint and a good safety profile."
    explanation: >-
      PLEO-CMT phase III result in 323 adults with mild-to-moderate CMT1A. The
      high-dose arm beat placebo on the Overall Neuropathy Limitations Scale
      (mean difference 0.37 points, p = 0.008). This is the only positive
      pharmacological trial in CMT1A to date and the effect size is small.
  - reference: PMID:34656144
    reference_title: "A double-blind, placebo-controlled, randomized trial of PXT3003 for the treatment of Charcot-Marie-Tooth type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The high-dose group was discontinued early due to unexpected crystal formation in the high-dose formulation, which resulted in an unanticipated high discontinuation rate, overall and especially in the high-dose group."
    explanation: >-
      Records the conduct problem that qualifies the result above: the arm that
      produced the positive finding was stopped early for formulation
      crystallization, and the statistical analysis plan was adapted before
      database lock to handle the resulting missing data. The trial supports
      PXT3003 as promising, not as established disease-modifying therapy.
- name: AAV9-MFN2 Gene Therapy
  description: >-
    Intrathecal delivery of an AAV9 vector expressing MFN2 to restore ER-mitochondria contacts
    and prevent axonal degeneration in CMT2A. In vivo studies demonstrate therapeutic efficacy
    even when administered after symptom onset, with good tolerability profile.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:42301793
    reference_title: "Restoring the interplay between the endoplasmic reticulum and mitochondria by gene therapy improves Charcot-Marie-Tooth type 2A disease"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intrathecal delivery of an AAV9 vector expressing MFN2WT effectively targets motor and sensory neurons, restoring ER-mitochondria contacts and mitochondrial morphology, thereby preserving both neuromuscular junction integrity and motor function"
    explanation: Demonstrates that AAV9-MFN2 gene therapy restores ER-mitochondria contact homeostasis and prevents axonal degeneration in transgenic CMT2A models and patient-derived motor neurons.
- name: PMP22-Lowering Antisense Oligonucleotide
  description: >-
    Investigational antisense oligonucleotides that suppress PMP22 mRNA in
    affected peripheral nerve, addressing the causal gene-dosage lesion of
    CMT1A rather than a downstream consequence of it. The published rodent
    proof of concept used 16-mer chimeric gapmer phosphorothioate
    oligonucleotides carrying constrained-ethyl residues at positions 1 to 3
    and 14 to 16, acting through RNase H-mediated degradation of the target
    transcript. Preclinical only: no human trial of direct PMP22 lowering has
    reported results, which is this entry's central translational gap.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: PMP22
      term:
        id: hgnc:9118
        label: PMP22
    target_transcript: PMP22 mRNA
    aso_chemistry: CONSTRAINED_ETHYL
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:29202483
    reference_title: "PMP22 antisense oligonucleotides reverse Charcot-Marie-Tooth disease type 1A features in rodent models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, initiation of ASO treatment after disease onset restored myelination, MNCV, and CMAP almost to levels seen in WT animals."
    explanation: >-
      Post-onset dosing reversed myelination and nerve-conduction deficits in
      two rodent CMT1A models. Because treatment started after disease was
      established, this is the strongest preclinical argument that the PMP22
      dosage lesion drives an ongoing, reversible process rather than only a
      fixed developmental one. Rodent models only.
  - reference: PMID:29202483
    reference_title: "PMP22 antisense oligonucleotides reverse Charcot-Marie-Tooth disease type 1A features in rodent models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we demonstrated that reduction of PMP22 mRNA in skin biopsies from ASO-treated rats is a suitable biomarker for evaluating target engagement in response to ASO therapy."
    explanation: >-
      Establishes skin-biopsy PMP22 mRNA as the target-engagement readout
      proposed for a first-in-human PMP22-lowering trial, which is the measure
      the discriminating test in the knowledge gap below depends on.
- name: AAV9-miR871 PMP22 Silencing Gene Therapy
  description: >-
    Lumbar intrathecal AAV9 delivering a U6-driven artificial microRNA
    (miR871) that silences PMP22 mRNA in Schwann cells, developed as a
    one-time treatment for CMT1A. Preclinical: efficacy in a humanized CMT1A
    mouse model, with dose ranging, toxicity, and vector biodistribution work
    in mice and non-human primates assembled to support a first-in-human
    trial.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:41948127
    reference_title: "Safety, efficacy, and distal nerve Schwann cell biodistribution in mice and NHPs to support translation of AAV9 RNAi therapy for CMT1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A single injection produced long-term miR871 expression, triggered selective RNA interference against the PMP22 mRNA, and subsequently lowered protein levels and improved disease manifestations in a humanized CMT1A model."
    explanation: >-
      Single-dose intrathecal AAV9 achieved sustained, selective PMP22
      knockdown and phenotypic improvement in a humanized CMT1A mouse,
      independently corroborating the ASO result that lowering PMP22 modifies
      established disease in rodents.
  - reference: PMID:41948127
    reference_title: "Safety, efficacy, and distal nerve Schwann cell biodistribution in mice and NHPs to support translation of AAV9 RNAi therapy for CMT1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found vector biodistribution and miR871 expression in distal peripheral nerves, PMP22 target engagement in mice and NHPs, and silencing to levels expected to support normal myelination in humans."
    explanation: >-
      Reaching distal peripheral nerve is the delivery problem specific to a
      length-dependent neuropathy, and target engagement was shown in
      non-human primates as well as mice. The human silencing level is
      extrapolated, not measured, so this supports translational readiness and
      not human efficacy.
prevalence:
- population: Auckland region, New Zealand (population-based multi-source ascertainment)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 15.7
  rate_low: 11.6
  rate_high: 21.0
  notes: >-
    Age-standardised point prevalence from a population-based study using multiple
    case ascertainment sources (primary care, hospitals, neuromuscular disease registry,
    community organisations, self-referral) in the Auckland Region of New Zealand, 2016.
    Highest prevalence was in the 50–64 age group (25.2/100,000). Estimates from single
    ascertainment sources may underestimate true prevalence. The commonly cited "1 in 2,500"
    figure (40/100,000) likely reflects earlier clinical-series estimates and may include
    broader ascertainment; the NZ population-based rate is lower.
  evidence:
  - reference: PMID:31203252
    reference_title: "Prevalence of Charcot-Marie-Tooth disease across the lifespan: a population-based epidemiological study."
    supports: SUPPORT

name: Charcot-Marie-Tooth Disease
creation_date: "2026-05-12T20:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Charcot-Marie-Tooth disease
  term:
    id: MONDO:0015626
    label: Charcot-Marie-Tooth disease
parents:
- Peripheral Neuropathy
description: >-
  Charcot-Marie-Tooth disease (CMT) is the most common inherited disorder of
  the peripheral nervous system, with a prevalence of roughly 1 in 2,500.
  CMT is genetically and pathologically heterogeneous, with over 100 causative
  genes identified. This is the umbrella classification entry for the CMT family;
  the detailed pathophysiology is curated in two mechanism-coherent compartment
  entries that cleave the CMT pathograph at its natural seam — the primary
  cellular lesion. The demyelinating / Schwann-cell compartment (Charcot-Marie-Tooth
  disease type 1; PMP22, MPZ, GJB1) and the axonal / neuronal compartment
  (Charcot-Marie-Tooth disease type 2; MFN2, RAB7A, NEFL, GARS1, SORD) each hold
  gene-level mechanisms that converge on a single shared terminal node —
  length-dependent distal axonal degeneration — which produces the uniform
  clinical phenotype of slowly progressive distal weakness and atrophy, sensory
  loss, foot deformity (pes cavus, hammer toes), and depressed deep tendon
  reflexes regardless of the upstream gene. Inheritance can be autosomal dominant
  (most CMT1, CMT2), autosomal recessive (CMT4), or X-linked (CMTX). The single
  most common subtype is CMT1A, a 1.4 Mb duplication of chromosome 17p11.2
  containing PMP22. Hereditary neuropathy with liability to pressure palsies
  (HNPP), allelic to CMT1A but caused by the reciprocal PMP22 deletion, is curated
  separately because its terminal node differs (focal, reversible,
  compression-sensitive conduction block rather than dying-back degeneration).
has_subtypes:
- name: CMT1
  display_name: Charcot-Marie-Tooth Disease Type 1 (Demyelinating)
  description: >-
    Autosomal dominant demyelinating form with reduced motor nerve conduction
    velocities (<38 m/s in median nerve). The most common clinical category;
    in a 1,515-patient specialist cohort, CMT1 comprised 41.0% of cases and
    achieved the highest genetic diagnosis rate (96.8%). CMT1A (PMP22
    duplication) is the dominant subtype. Schwann cell dysfunction with
    onion-bulb formation on nerve biopsy.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "621 patients had CMT1 (41.0%)"
    explanation: Single-centre 1,515-patient specialist cohort quantifies CMT1 at 41.0% of CMT presentations.
- name: CMT2
  display_name: Charcot-Marie-Tooth Disease Type 2 (Axonal)
  description: >-
    Autosomal dominant axonal form with normal or near-normal nerve conduction
    velocities but reduced amplitudes. Primary axonal degeneration. Many
    causative genes identified including MFN2, MPZ, NEFL, GDAP1. Comprised
    19.4% of cases in the Brain 2024 specialist cohort, with a substantially
    lower genetic diagnosis rate (<50%) than CMT1.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "294 CMT2 (19.4%)"
    explanation: Specialist-cohort frequency of axonal CMT2.
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnostic rates remained less than 50% in CMT2, HMN and complex neuropathies."
    explanation: Quantifies the diagnostic gap in axonal CMT relative to demyelinating CMT1.
- name: CMTX
  display_name: X-Linked Charcot-Marie-Tooth Disease
  description: >-
    X-linked inheritance, most commonly caused by mutations in GJB1 encoding
    connexin-32 (CMTX1). Males more severely affected than carrier females.
    Intermediate electrophysiology between CMT1 and CMT2. GJB1 was the
    second most common genetic diagnosis (13.0% of solved cases) in the
    Brain 2024 cohort.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "then GJB1 (CMTX1; 151/1165, 13.0%)"
    explanation: GJB1/CMTX1 is the second most common genetically resolved CMT subtype.
- name: CMT4
  display_name: Charcot-Marie-Tooth Disease Type 4 (Autosomal Recessive)
  description: >-
    Autosomal recessive forms. Generally earlier onset and more severe than
    autosomal dominant CMT. Includes both demyelinating and axonal pathologies
    depending on the gene.
- name: HNPP
  display_name: Hereditary Neuropathy with Liability to Pressure Palsies
  description: >-
    Allelic to CMT1A but caused by deletion (rather than duplication) of the
    same chromosome 17p11.2 region containing PMP22. PMP22 underexpression
    leads to recurrent, focal, pressure-induced demyelinating mononeuropathies.
    Comprised 4.8% of cases (and 6.2% of solved diagnoses) in the Brain 2024
    cohort.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PMP22 deletion (HNPP; 72/1165, 6.2%)"
    explanation: Frequency of PMP22-deletion-driven HNPP in the specialist cohort.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
  hypothesis_label: Canonical PMP22 / MPZ / Axonal & Demyelinating Peripheral Neuropathy Model
  status: CANONICAL
  description: >-
    Charcot-Marie-Tooth (CMT) disease is a clinically and genetically heterogeneous group of inherited
    peripheral neuropathies caused by variants in >100 genes encoding myelin components (PMP22, MPZ,
    GJB1) and axonal cytoskeleton/transport proteins (MFN2, NEFL), plus other Schwann-cell-axon
    interface factors. KIF1B is a historical CMT2A1 candidate gene, but it carries only Limited ClinGen
    gene-disease validity evidence, not the established causal status of MFN2 (see notes). CMT1A (most
    common, PMP22 duplication on 17p11.2) produces demyelinating neuropathy through PMP22
    overexpression-driven Schwann cell dysfunction and secondary axonal loss. Axonal CMT2 forms (MFN2,
    MPZ, others) primarily impair axonal function. The uniform clinical phenotype — distal motor and
    sensory loss in a length-dependent pattern, with foot deformity, distal weakness, and absent
    reflexes — frequently converges on length-dependent axonal degeneration as a late-stage correlate of
    disability across CMT1A and CMT2 subtypes, though not a universal mechanism in every model (see
    notes). The PMP22 duplication CMT1A mouse and rat models recapitulate the human phenotype, and
    PMP22-lowering ASO and PXT3003 (low-dose drug combination) corroborate the PMP22-dosage axis as a
    canonical mechanism in the most common subtype.
  notes: >-
    Retained as CANONICAL. The 2026 openscientist hypothesis-search
    report
    (kb/hypotheses/Charcot-Marie-Tooth_Disease/canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model)
    finds the broad canonical framework SUPPORTED, but several
    report-level claims required source-, model-, subtype-, and
    species-scoping before independent reconciliation into this
    entry (issue #7405; sidecar assessment in PR #7406). Core
    architecture remains validated: >100 genes show genetic
    heterogeneity; CMT1A and CMT2 subtypes frequently converge on
    length-dependent axonal degeneration as a late-stage correlate of
    disability, though not as a universal sufficient mechanism —
    adult C3-PMP22 (CMT1A) model mice show no detectable
    myelinated-fibre loss despite functional impairment (PMID:21487305);
    transgenic models recapitulate the human phenotype. PMP22
    duplication accounts for
    505/1165 (43.3%) of genetically solved cases and 505/1515
    (33.3%) of all clinically diagnosed participants in a single
    specialist-centre cohort (PMID:38481354, cited below via
    DOI:10.1093/brain/awae064); a separately cited ~60% figure
    (PMID:31852984) is a background statement about the share of
    pathogenic CMT variants attributable to the PMP22 duplication,
    not a comparable diagnosed-case estimate, and should not be
    blended with the cohort figure into a single "43-60%" range. Seven
    substantive, source-scoped refinements: (1) dysmyelination is a
    real developmental component, not a categorical replacement for
    demyelinating classification — dermal-fibre biopsies from 32
    CMT1A patients show uniformly shortened internodal length and
    absent segmental demyelination, suggesting a developmental
    internode defect (PMID:19923170), and long-term
    PMP22-overexpressing mice show delayed, incomplete developmental
    myelination with stable adult myelin (PMID:21487305) —
    conventional demyelinating features and a developmental
    dysmyelination component coexist, they are not mutually
    exclusive; (2) PMP22 acting as a structural organizer of
    nodal/Schmidt-Lanterman-incisure architecture is shown
    specifically in CMT1A and HNPP model mice (PMID:41400104), not
    yet established as a human CMT-wide mechanism; (3) UPR/ER-stress
    modulation (Sephin1/IFB-088) improved neuropathy in C3-PMP22
    (CMT1A) and MpzR98C (CMT1B) mice (PMID:35501630) — convergence
    is demonstrated across these two mouse models, not broadly
    across CMT subtypes or in humans; (4) SARM1 acting as an
    executioner of axonal degeneration, with a feedback loop to
    mitochondrial dysfunction, is shown in one Mfn2-H361Y CMT2A rat
    model (PMID:36287202) — a single-model finding, not yet a
    cross-subtype or human result (SARM1 inhibitors are in
    development); (5) macrophage/CSF1-driven secondary
    neuroinflammation amplifying demyelination is documented
    predominantly in CMT1B (P0+/- mice) and CMT1X
    (connexin-32-deficient mice) models (PMID:16775375 review;
    PMID:26865613),
    not established as a general driver across all CMT subtypes;
    systemic terminal complement (C6) inhibition in two
    PMP22-overexpressing CMT1A mouse models reduced neuroinflammation
    but did not improve motor function (PMID:36926597) — this was a
    mouse experiment, not a failed human trial, and must not be
    counted among failed human CMT1A trials; (6) cholesterol
    trafficking is disrupted by both loss- and gain-of-function PMP22
    mutations, but the rescue evidence is directionally specific:
    myelination deficits in dorsal root ganglia explants were
    improved by cholesterol supplementation only in heterozygous
    PMP22-deficient (loss-of-function) mice (PMID:32511821) — this
    does not support a supplementation strategy for
    PMP22-duplication (gain-of-function) CMT1A, the reverse
    direction; (7) KIF1B is listed among the CMT axonal-transport
    genes, but the KIF1B-CMT2A1 relationship arose from a small
    pedigree base, and ClinGen's Charcot-Marie-Tooth Disease Gene
    Curation Expert Panel classified it as Limited in June 2026
    (CGGV:assertion_ae6ffeae-9609-47bf-89a9-4863cf6ef05c-2026-06-12T160000.000Z,
    cited below) — it should not be presented as equivalent in
    evidentiary weight to the established MFN2-CMT2A relationship.
    Human proof-of-concept for PMP22-lowering therapies
    remains the critical translational gap: no cited study
    demonstrates clinical benefit in humans from direct PMP22
    lowering; the five human ascorbic-acid trials to date were
    negative, and only PXT3003 showed a modest, single-trial Phase
    III benefit. Preclinical human-cell
    evidence is further along than the clinical evidence: PMP22
    downregulation ameliorated myelin defects in patient-derived
    CMT1A iPSC-organoids (PMID:36511878), and AAV-mediated editing of
    the PMP22 duplication rescued disease features in patient-derived
    CMT1A iPS Schwann cells (PMID:38017287) — the PMP22-dosage axis
    therefore has direct human-cell (not yet human-trial) proof of
    concept, alongside the rodent validation. ASO and AAV9-miRNA gene
    therapies are advancing toward clinical translation. A 2026-09
    reconciliation pass against the same openscientist report added
    source-scoped citations for three claims this entry previously asserted
    without one, plus two qualifications it did not carry at all. (a) The
    failed human arm is now cited: five ascorbic-acid trials were undertaken
    worldwide and none demonstrated significant effectiveness (PMID:26450076),
    the largest being a 2-year randomised trial in 277 CMT1A adults that found
    no CMTNS difference from placebo at 24 months (PMID:21393063). Saturable
    ascorbate absorption has been proposed as the reason they failed
    (PMID:23525455), but that paper argues the case pharmacokinetically rather
    than testing it against the alternatives (target biology, intraneural
    exposure, outcome sensitivity, model fidelity), so it is deliberately not
    curated here as an established cause. (b) Direct PMP22 lowering is now
    cited at the treatment level: post-onset antisense oligonucleotide
    treatment restored myelination and nerve conduction in two rodent CMT1A
    models (PMID:29202483), and an intrathecal AAV9 vector carrying the
    artificial miRNA miR871 lowered PMP22 and improved disease in a humanized
    mouse model, with dosing, toxicity and biodistribution work in mice and
    non-human primates (PMID:41948127). Both remain preclinical, so the
    human-validation gap above is unchanged. (c) Two further qualifications of
    the convergence framing: Schwann cells mount an endogenous c-Jun repair
    programme that prevents loss of distal myelinated sensory axons in the
    C3-PMP22 CMT1A model (PMID:25216747), so axonal degeneration is actively
    opposed rather than following inevitably from the myelin lesion; and
    children with CMT2A progress measurably faster on the CMTPedS than
    children with CMT1A over two years (PMID:28796392), so a shared terminal
    node does not imply a shared disease course. Lipidomic and transcriptomic
    profiling of CMT1A mouse sciatic nerve and of patient-derived iPSC Schwann
    cell precursors extends the cholesterol branch into the duplication
    (gain-of-function) direction and into human cells (PMID:38743588), which
    the PMP22-deficient explant rescue in refinement (6) does not cover.
    Plasma NfL and GFAP are curated below as severity-correlated biomarkers;
    no CMT biomarker has been shown to change in response to an effective
    disease-modifying therapy, which is recorded as a knowledge gap rather
    than as biomarker validation.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common genetic diagnosis was PMP22 duplication (CMT1A; 505/1165, 43.3%)"
    explanation: >
      Existing canonical mechanism citation in the dismech
      knowledge base, used as the seed for the hypothesis-search
      deep-research run.
  - reference: PMID:31852984
    reference_title: "Identification of novel pathogenic copy number variations in Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the recurrent PMP22 duplication accounting for about 60% of pathogenic variations"
    explanation: >
      Background statement about the share of pathogenic CMT
      variants attributable to PMP22 duplication (not a
      diagnosed-case cohort estimate). Graded PARTIAL because this
      figure is not directly comparable to the 43.3%/33.3%
      diagnosed-case denominators from PMID:38481354 and should not
      be blended with them into a single range (issue #7405).
  - reference: PMID:19923170
    reference_title: "Shortened internodal length of dermal myelinated nerve fibres in Charcot-Marie-Tooth disease type 1A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Internodal length was uniformly shortened in patients with Charcot-Marie-Tooth disease type 1A, compared with those in normal controls (P < 0.0001). Segmental demyelination was absent in the Charcot-Marie-Tooth disease type 1A group, but identifiable in all patients with chronic inflammatory demyelinating polyradiculoneuropathy."
    explanation: >
      Dermal-fibre biopsies from 32 CMT1A patients support a
      developmental internode defect alongside, not instead of,
      conventional demyelinating classification.
  - reference: PMID:21487305
    reference_title: "Myelin and axon pathology in a long-term study of PMP22-overexpressing mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Myelination was delayed, and normal myelination was not reached in either model but the degree of dysmyelination in C3-PMP mice was considerably less than that in C22 mice; myelination was stable in the adult mice."
    explanation: >
      Long-term PMP22-overexpressing mouse models show delayed,
      incomplete developmental myelination with stable adult myelin,
      supporting a developmental dysmyelination component.
  - reference: PMID:21487305
    reference_title: "Myelin and axon pathology in a long-term study of PMP22-overexpressing mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In adult C3-PMP and wild-type mice, there was no detectable loss of myelinated fibers,whereas there was clear loss of myelinated fibers in C22 mice."
    explanation: >
      In the same long-term study, adult C3-PMP22 mice (the model
      the paper concludes is most representative of typical CMT1A)
      show no detectable axonal (myelinated-fibre) loss despite
      functional impairment, so length-dependent axonal degeneration
      is not a universal feature of every CMT1A model. Graded PARTIAL
      because it qualifies rather than supports the
      universal-convergence framing.
  - reference: PMID:41400104
    reference_title: "Aberrant Molecular Myelin Architecture in Charcot-Marie-Tooth Disease Type 1A and Hereditary Neuropathy With Liability to Pressure Palsies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "high-resolution confocal imaging of teased peripheral nerve fibers from CMT1A and HNPP model mice, we identified widespread disorganization of adherens junctions, mislocalization of Connexin29 and aberrant distribution of nodal ion channels"
    explanation: >
      PMP22 as a structural organizer of
      nodal/Schmidt-Lanterman-incisure myelin architecture is shown
      specifically in CMT1A and HNPP model mice, not yet as a human
      CMT-wide mechanism.
  - reference: PMID:35501630
    reference_title: "Treatment with IFB-088 Improves Neuropathy in CMT1A and CMT1B Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both MpzR98C/ + and C3-PMP22 mice improved in motor function and neurophysiology."
    explanation: >
      UPR/ER-stress modulation (Sephin1/IFB-088) improved neuropathy
      specifically in C3-PMP22 (CMT1A) and MpzR98C (CMT1B) mice —
      convergence shown across these two mouse models, not broadly
      across CMT subtypes or in humans.
  - reference: PMID:36287202
    reference_title: "A SARM1-mitochondrial feedback loop drives neuropathogenesis in a Charcot-Marie-Tooth disease type 2A rat model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We tested the role of SARM1 in a rat model carrying a dominant CMT2A mutation (Mfn2H361Y) that exhibits progressive dying-back axonal degeneration"
    explanation: >
      SARM1 as an executioner of axonal degeneration with a
      mitochondrial feedback loop is a single-model (one Mfn2-H361Y
      CMT2A rat) finding, not yet a cross-subtype or human result.
  - reference: PMID:16775375
    reference_title: "Role of immune cells in animal models for inherited peripheral neuropathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By cross-breeding P0+/- and gap-junction protein connexin 32-/- mice with immunodeficient recombination activating gene-1-deficient mutants, a substantial alleviation of the demyelinating phenotype was observed."
    explanation: >
      Direct support for immune-mediated amplification of
      demyelination specifically in P0+/- (CMT1B) and connexin-32-/-
      (CMT1X) mouse models via genetic RAG1-deficiency crosses.
  - reference: PMID:16775375
    reference_title: "Role of immune cells in animal models for inherited peripheral neuropathies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Recently, this has also been observed in mice mildly overexpressing human peripheral myelin protein 22 kD mimicking the most common form of CMT, CMT type 1A."
    explanation: >
      CMT1A immune-cell involvement is described in this review as a
      secondary, more-recent observation, not backed by the same
      RAG1-cross causal evidence as the CMT1B/CMT1X models. Graded
      PARTIAL because it supports only an extension of the finding to
      CMT1A, not the predominant causal evidence base.
  - reference: PMID:26865613
    reference_title: "Cell-Surface and Secreted Isoforms of CSF-1 Exert Opposing Roles in Macrophage-Mediated Neural Damage in Cx32-Deficient Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "connexin32-deficient (Cx32def) mice, a mouse model of CMT1X"
    explanation: >
      Macrophage/CSF-1-mediated neural damage is characterized
      specifically in a CMT1X (connexin-32-deficient) mouse model.
  - reference: PMID:36926597
    reference_title: "The systemic inhibition of the terminal complement system reduces neuroinflammation but does not improve motor function in mouse models of CMT1A with overexpressed PMP22."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we inhibited systemic complement C6 in two transgenic mouse models for CMT1A, the C3-PMP22 and C3-PMP22 c-JunP0Cre models."
    explanation: >
      Terminal complement (C6) inhibition reduced neuroinflammation
      but did not improve motor function in two PMP22-overexpressing
      CMT1A mouse models — this was a mouse experiment, not a failed
      human trial (corrects a species error flagged in issue #7405).
  - reference: PMID:32511821
    reference_title: "Subcellular diversion of cholesterol by gain- and loss-of-function mutations in PMP22."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "myelination deficits in dorsal root ganglia explants from heterozygous PMP22-deficient mice were improved by cholesterol supplementation."
    explanation: >
      Cholesterol-supplementation rescue was shown specifically in
      PMP22-deficient (loss-of-function) mouse explants, the
      opposite direction from PMP22-duplication (gain-of-function)
      CMT1A, so it does not support a CMT1A supplementation trial.
  - reference: PMID:36511878
    reference_title: "Downregulation of PMP22 ameliorates myelin defects in iPSC-derived human organoid cultures of CMT1A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Downregulation of PMP22 expression using short-hairpin RNAs or a combinatorial drug consisting of baclofen, naltrexone hydrochloride and D-sorbitol was able to ameliorate the myelin defects in CMT1A-organoids."
    explanation: >
      Patient-derived CMT1A iPSC-organoid rescue after PMP22
      downregulation is preclinical human-cell proof of concept for
      the PMP22-dosage axis, distinct from a human clinical trial.
  - reference: PMID:38017287
    reference_title: "AAV-mediated editing of PMP22 rescues Charcot-Marie-Tooth disease type 1A features in patient-derived iPS Schwann cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "decreased PMP22 gene duplication by 20-40%. Infection of CMT1A-iPSC-derived Schwann cell precursors with AAV2-hSaCas9-gRNAedit normalized PMP22 mRNA and PMP22 protein expression levels, and also ameliorated increased apoptosis and impaired myelination in CMT1A-iPSC-derived Schwann cells."
    explanation: >
      AAV-mediated editing of the PMP22 duplication rescued disease
      features in patient-derived CMT1A iPS Schwann cells —
      preclinical human-cell proof of concept, not yet a human trial.
  - reference: CGGV:assertion_ae6ffeae-9609-47bf-89a9-4863cf6ef05c-2026-06-12T160000.000Z
    reference_title: "KIF1B / Charcot-Marie-Tooth disease type 2A1 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KIF1B | HGNC:16636 | Charcot-Marie-Tooth disease type 2A1 | MONDO:0007308 | AD | Limited | SOP12 | Charcot-Marie-Tooth Disease Gene Curation Expert Panel | 2026-06-12T16:00:00.000Z"
    explanation: >
      ClinGen's Charcot-Marie-Tooth Disease Gene Curation Expert
      Panel classifies the KIF1B-CMT2A1 gene-disease relationship as
      Limited (June 2026), so KIF1B should not be presented as
      equivalent in evidentiary weight to the established MFN2-CMT2A
      relationship. Graded PARTIAL because the assertion supports a
      downgrade of the KIF1B claim rather than the canonical model.
  - reference: PMID:26450076
    reference_title: "[Ascorbic Acid and Charcot-Marie-Tooth Disease]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on these results, five clinical trials were undertaken at different centers worldwide. However, none of them demonstrated significant effectiveness."
    explanation: >-
      Substantiates the count and the outcome of the human ascorbic-acid
      programme asserted in the notes above. Classified HUMAN_CLINICAL because
      the evidence this review reports is the result of five human clinical
      trials, not a preclinical or consensus statement.
  - reference: PMID:21393063
    reference_title: "Ascorbic acid in Charcot-Marie-Tooth disease type 1A (CMT-TRIAAL and CMT-TRAUK): a double-blind randomised trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ascorbic acid supplementation had no significant effect on neuropathy compared with placebo after 2 years, suggesting that no evidence is available to support treatment with ascorbic acid in adults with CMT1A."
    explanation: >-
      The largest and longest of those trials, and the direct source for the
      statement that human pharmacological attempts on the PMP22-dosage axis
      have so far been negative. It qualifies the translational arm of the
      canonical model, not its genetics: a failed ascorbate trial does not show
      that PMP22 dosage is the wrong target, only that this agent did not move
      the endpoint.
  - reference: PMID:25216747
    reference_title: "c-Jun activation in Schwann cells protects against loss of sensory axons in inherited neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results indicate that c-Jun elevation in the Schwann cells of C3 nerves serves to prevent loss of myelinated sensory axons, particularly in distal nerves, improve behavioural symptoms, and preserve F-wave persistence."
    explanation: >-
      Conditional inactivation of Schwann-cell c-Jun in the C3-PMP22 CMT1A
      mouse worsened distal sensory axon loss, so the same cell that carries
      the genetic lesion also mounts a protective repair programme against the
      shared terminal node. Length-dependent axonal degeneration is therefore
      a modulated outcome in this model rather than an inevitable consequence
      of the myelin defect.
  - reference: PMID:28796392
    reference_title: "Natural history of Charcot-Marie-Tooth disease during childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants with CMT2A progressed faster than CMT1A (mean difference, -4.4; 95% CI, -8.1 to -0.8; p = 0.02)."
    explanation: >-
      Two-year longitudinal CMTPedS data from 206 children show that genetic
      subtype predicts rate of decline, so convergence of CMT1A and CMT2A on a
      shared terminal node does not imply a shared disease course. Qualifies
      the final-common-pathway framing with human, not model, data.
  - reference: PMID:38743588
    reference_title: "PMP22 duplication dysregulates lipid homeostasis and plasma membrane organization in developing human Schwann cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we identified reduced lipid raft dynamics, disturbed plasma membrane fluidity and impaired cholesterol incorporation and storage, all of which could result from altered lipid storage homeostasis in the patient-derived CMT1A iPSC-SCPs."
    explanation: >-
      Extends the PMP22 cholesterol branch of refinement (6) into the
      duplication (gain-of-function) direction and into patient-derived human
      Schwann cell precursors. This is the direction the PMP22-deficient
      explant supplementation rescue does not address, so it supports the
      lipid-handling mechanism without supporting a supplementation strategy
      for CMT1A.

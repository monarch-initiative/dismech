datasets:
discussions:
- discussion_id: human_proof_of_concept_pmp22_lowering
  prompt: >-
    Does lowering PMP22 modify disease in people with CMT1A, as it does in
    rodent models?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
  - treatments#PMP22-Lowering Antisense Oligonucleotide
  - treatments#AAV9-miR871 PMP22 Silencing Gene Therapy
  rationale: >-
    The PMP22 dosage axis is the load-bearing claim of the canonical model and
    is validated only in rodents and in patient-derived cells. Antisense
    oligonucleotide and AAV9-miRNA approaches both improve established disease
    in rodent CMT1A models, and PMP22 downregulation rescues myelin defects in
    patient-derived organoids and iPS Schwann cells, but no human trial of
    direct PMP22 lowering has reported results. Every agent actually given to
    people with CMT1A has acted indirectly: five ascorbic-acid trials were
    negative, and PXT3003 is a three-drug combination whose modest phase III
    benefit cannot be attributed to PMP22 lowering specifically. Until a
    first-in-human trial of direct lowering reads out, the axis is a
    preclinical inference rather than a demonstrated human mechanism.
  proposed_experiments:
  - experiment_id: exp_cmt_first_in_human_pmp22_lowering
    name: First-in-human dose-escalation trial of direct PMP22 lowering in CMT1A
    description: >-
      Phase 1/2 dose escalation in adults with genetically confirmed CMT1A of
      mild to moderate severity, using either a PMP22 antisense oligonucleotide
      or an intrathecal AAV9-miRNA vector. Pair target engagement, measured as
      PMP22 mRNA in serial skin biopsies, with the two outcome measures that
      have shown movement over 12 months in this disease: quantitative calf
      muscle MRI fat fraction and plasma neurofilament light chain.
    decision_criterion: >-
      Dose-dependent reduction of skin PMP22 mRNA accompanied by stabilisation
      of calf muscle fat fraction and of plasma NfL against the untreated
      natural-history trajectory would establish PMP22 dosage as a modifiable
      human mechanism.
    would_support:
    - mechanistic_hypotheses#canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
    would_refute:
    - mechanistic_hypotheses#canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
    supporting_outcome:
    - >-
      Skin PMP22 mRNA falls dose-dependently, and calf muscle fat fraction and
      plasma NfL stabilise relative to the natural-history trajectory.
    refuting_outcome:
    - >-
      Skin PMP22 mRNA falls to the degree that rescues rodent models while calf
      muscle fat fraction and plasma NfL continue on their untreated
      trajectory, indicating that PMP22 dosage is not rate-limiting for
      established human disease.
  evidence:
  - reference: PMID:41948127
    reference_title: "Safety, efficacy, and distal nerve Schwann cell biodistribution in mice and NHPs to support translation of AAV9 RNAi therapy for CMT1A."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To support clinical translation, we confirmed on-target specificity of miR871 for PMP22 in vitro, identified a safe and effective dosing range in mice, demonstrated absence of significant toxicity in rodents and non-human primates (NHPs), and performed a detailed AAV biodistribution study in a large animal model."
    explanation: >-
      The most advanced direct-lowering programme describes its own package as
      work done to support clinical translation, which is a statement that the
      human step has not yet been taken.
- discussion_id: cmt_biomarker_response_to_therapy
  prompt: >-
    Has any CMT biomarker been shown to change in response to an effective
    disease-modifying therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Plasma Neurofilament Light Chain
  - biochemical#Plasma Glial Fibrillary Acidic Protein
  rationale: >-
    Quantitative calf muscle MRI fat fraction, plasma NfL, and plasma GFAP all
    separate CMT from controls and track severity, and fat fraction moves
    enough over 12 months to be proposed as a trial endpoint. None has been
    measured against a therapy that works, because until PXT3003 no CMT therapy
    did, and PXT3003 was not run with these readouts. Responsiveness to
    untreated progression is necessary but not sufficient for surrogacy: a
    marker can track decline faithfully and still fail to move when the
    upstream mechanism is corrected. Treating any of these as a validated
    surrogate endpoint would overstate what has been shown, and the biomarker
    substudy belongs inside the first direct-lowering trial rather than after
    it.
  evidence:
  - reference: PMID:39957630
    reference_title: "Twelve-month change in quantitative MRI calf muscle fat fraction in CMT1A predicts clinical change over 4 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated a consistent progression of calf muscle MRI fat over 4 years, significant longitudinal correlation between CMT Examination Score and calf muscle fat, and potential as a bridging biomarker by 1 year change in fat correlating with long-term clinical progression."
    explanation: >-
      The strongest responsiveness result available for any CMT biomarker, from
      20 untreated CMT1A patients followed for a mean of four years. The
      authors claim potential as a bridging biomarker rather than demonstrated
      surrogacy, which is the boundary this gap records.

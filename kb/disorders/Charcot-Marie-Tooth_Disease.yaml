biochemical:
- name: Plasma Neurofilament Light Chain
  biomarker_term:
    preferred_term: plasma neurofilament light chain
    term:
      id: NCIT:C88043
      label: Neurofilament Light Polypeptide
  presence: Elevated relative to controls
  context: >-
    Genetically confirmed CMT of mixed subtype versus matched controls,
    measured in plasma by single-molecule array.
  notes: >-
    NfL reports on the shared terminal node of CMT, axonal loss, rather than on
    any one causative gene, which is why it is curated on this umbrella entry
    instead of a subtype entry. It correlates with cross-sectional severity but
    has never been shown to move in response to an effective disease-modifying
    therapy, so it is not a validated surrogate endpoint; see the
    biomarker-responsiveness knowledge gap below.
  evidence:
  - reference: PMID:39882365
    reference_title: "Evaluating plasma biomarkers NfL, GFAP, GDF15, and FGF21 as indicators of disease severity in Charcot-Marie Tooth patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NfL and GFAP levels were correlated with the CMTNSv2 score (rs = 0.46, p = 0.002; rs = 0.31, p = 0.04)."
    explanation: >-
      In 44 genetically confirmed CMT patients and 44 matched controls, plasma
      NfL correlated with the CMT Neuropathy Score version 2. The correlation
      is moderate and cross-sectional, so it supports NfL as a severity
      indicator rather than as a progression or treatment-response measure.
- name: Plasma Glial Fibrillary Acidic Protein
  presence: Elevated relative to controls
  context: >-
    Genetically confirmed CMT of mixed subtype versus matched controls,
    measured in plasma by single-molecule array.
  notes: >-
    GFAP is an astroglial protein, so its elevation in a peripheral neuropathy
    is not straightforward to attribute; the source study reports the
    association without demonstrating a glial lesion in nerve. No NCI Thesaurus
    biomarker term for GFAP was present in this repository's term cache at
    curation time, so this entry deliberately carries no bound term rather than
    a guessed CURIE.
  evidence:
  - reference: PMID:39882365
    reference_title: "Evaluating plasma biomarkers NfL, GFAP, GDF15, and FGF21 as indicators of disease severity in Charcot-Marie Tooth patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the group of patients with CMT, the concentrations of GDF15, FGF21, NfL, and GFAP were significantly higher than in the control group (p < 0.05)."
    explanation: >-
      Establishes that plasma GFAP is raised in CMT relative to controls in
      this 44-case, 44-control study. The study does not localise the glial
      signal, so the elevation is curated as an observed association only.
genetic:
- name: PMP22
  gene_term:
    preferred_term: PMP22
    term:
      id: hgnc:9118
      label: PMP22
  association: Causal
  notes: >-
    PMP22 (peripheral myelin protein 22) is the dominant CMT gene. A 1.4 Mb
    tandem duplication causes CMT1A (the single most common CMT genotype);
    a reciprocal deletion of the same region causes HNPP. Point mutations
    in PMP22 cause rarer demyelinating forms.
  evidence:
  - reference: DOI:10.1093/brain/awae064
    reference_title: "Whole genome sequencing increases the diagnostic rate in Charcot-Marie-Tooth disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common genetic diagnosis was PMP22 duplication (CMT1A; 505/1165, 43.3%), then GJB1 (CMTX1; 151/1165, 13.0%), PMP22 deletion (HNPP; 72/1165, 6.2%) and MFN2 (CMT2A; 46/1165, 3.9%)"
    explanation: PMP22 duplication (43.3%) and deletion (6.2%) together drive nearly half of all genetically resolved CMT.
- name: GJB1
  gene_term:
    preferred_term: GJB1
    term:
      id: hgnc:4283
      label: GJB1
  association: Causal
  notes: >-
    GJB1 encodes connexin-32, expressed in Schwann cells at the paranodal
    gap junctions. X-linked dominant / semidominant (CMTX1): males are more
    severely affected, but heterozygous carrier females are commonly
    symptomatic. The second most common genetic cause of CMT.
- name: MFN2
  gene_term:
    preferred_term: MFN2
    term:
      id: hgnc:16877
      label: MFN2
  association: Causal
  notes: >-
    MFN2 (mitofusin 2) mutations cause axonal CMT2A, the dominant CMT2
    subtype. MFN2 is required for mitochondrial fusion and mitochondrial
    axonal transport.
- name: MPZ
  gene_term:
    preferred_term: MPZ
    term:
      id: hgnc:7225
      label: MPZ
  association: Causal
  notes: >-
    MPZ (myelin protein zero) is the most abundant peripheral myelin
    protein. Mutations cause CMT1B and a subset of CMT2 forms; many
    mutations trigger protein misfolding, UPR, and chronic ER stress
    in Schwann cells.

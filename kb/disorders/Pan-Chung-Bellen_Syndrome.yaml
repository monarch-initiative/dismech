discussions:
- discussion_id: fryl_molecular_mechanism_gap
  prompt: >-
    What does FRYL do in mammalian neurons and developing organs, and does it
    act through NDR kinases or NOTCH1 signaling?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FRYL Haploinsufficiency
  - pathophysiology#Impaired Neuronal Development
  - pathophysiology#Disrupted Organ Morphogenesis
  rationale: >-
    The disease mechanism is established only to the level of gene dosage.
    Furry proteins activate or scaffold NDR kinases in yeast, worms and flies.
    In human epithelial and colorectal cancer cells FRYL binds Homer scaffolds
    and modulates YAP and Wnt/beta-catenin signaling downstream of the Crumbs
    polarity complex, and FRYL has also been reported to bind the active NOTCH1
    intracellular domain. None of these routes has been tested for FRYL in a
    mammalian neurodevelopmental or organogenesis model.
  evidence:
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, it is not known whether FRYL interacts with NDR kinases."
    explanation: The founding paper states that the FRYL-NDR kinase link is untested.
  - reference: PMID:20406475
    reference_title: The Drosophila Fry protein interacts with Trc and is highly mobile in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We established that Fry and Trc could be co-immunoprecipitated from wing discs."
    explanation: In flies, Furry physically associates with the NDR kinase Tricornered.
  - reference: PMID:24403109
    reference_title: Multifaceted roles of Furry proteins in invertebrates and vertebrates.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "Fry-NDR kinase signals are implicated in the control of polarized cell growth and morphogenesis in yeast, neurite outgrowth in nematode, and epidermal morphogenesis and dendritic tiling in fruit fly."
    explanation: Review summarizing the conserved Furry-NDR kinase partnership across model organisms.
  - reference: PMID:42455669
    reference_title: Homer condensates orchestrate YAP-Wnt signaling crosstalk downstream of the Crumbs polarity complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Homers interact directly via their EVH1 domains with the Crumbs component PATJ and the NDR kinase scaffold Furry-like (FRYL)."
    explanation: Human cell-line work places FRYL in a polarity and YAP-Wnt signaling complex, a candidate route not yet tested in development.

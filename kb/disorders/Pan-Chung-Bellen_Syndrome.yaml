  variant_origin: DE_NOVO
  notes: >-
    Fourteen individuals were reported with heterozygous FRYL variants, nine of
    them truncating or splice variants. The p.Ser2397Ile missense variant was
    not confirmed de novo, had no effect in flies, and is regarded by the
    authors as a variant of uncertain significance. No ClinGen gene-disease
    validity classification was found for this pair.

name: Pan-Chung-Bellen Syndrome
creation_date: "2026-10-22T20:30:00Z"
category: Mendelian
synonyms:
- FRYL-related neurodevelopmental disorder with multiple anomalies
description: >-
  Pan-Chung-Bellen syndrome is an autosomal dominant neurodevelopmental
  disorder with multiple congenital anomalies caused by heterozygous, mostly de
  novo, loss-of-function variants in FRYL, a large Furry-family protein. The
  founding cohort of fourteen individuals showed developmental delay or
  intellectual disability in every assessable individual, frequent speech
  delay, behavioral differences, autism spectrum disorder, hypotonia and
  seizures, together with dysmorphic facial features and congenital anomalies
  of the heart (including heterotaxy), genitourinary tract, gastrointestinal
  tract and skeleton. Truncating variants, gnomAD loss-of-function intolerance,
  and Drosophila knock-in modelling of the missense variants point to FRYL
  haploinsufficiency. How reduced FRYL dosage disturbs neuronal and organ
  development in mammals is not known; the fly ortholog furry acts with the NDR
  kinase Tricornered in dendrite morphogenesis, and in human epithelial cells
  FRYL modulates YAP and Wnt signaling with Homer scaffolds, but neither route
  has been tested in neurons or developing organs.
disease_term:
  preferred_term: Pan-Chung-Bellen syndrome
  term:
    id: MONDO:0975953
    label: Pan-Chung-Bellen syndrome
parents:
- Neurodevelopmental Disorder
- Multiple Congenital Anomalies Syndrome
notes: >-
  MONDO:0975953 cross-references OMIM:621049 and records FRYL as its causal
  gene. MONDO records no descendants, so the entry is curated as one disease
  without subtypes. The synonym "FRYL-related neurodevelopmental disorder with
  multiple anomalies" is the former name given in PMID:40864423. A 2026 case
  report of a child with a FRYL variant and a co-occurring SUPT16H variant
  (PMID:42430062) has no PubMed abstract and is not cited. No GeneReviews
  chapter covers the disease.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous FRYL loss-of-function variants cause the disorder. Thirteen of
    fourteen reported variants were confirmed de novo.
  evidence:
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the LoF variants in FRYL cause a dominant disorder with developmental and neurological symptoms due to haploinsufficiency"
    explanation: The founding report concludes that FRYL loss-of-function variants act dominantly.
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants are confirmed de novo in all individuals except one."
    explanation: Almost all variants arose de novo, consistent with a dominant disorder of reduced fitness.
pathophysiology:
- name: FRYL Haploinsufficiency
  description: >-
    Heterozygous truncating, frameshift and splice variants, and some missense
    variants, reduce FRYL function by half. FRYL is a 3,013-residue Furry-family
    protein whose molecular function in mammals is largely unknown.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FRYL
    term:
      id: hgnc:29127
      label: FRYL
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is also supported by population genetic data from the gnomAD database that show that FRYL is intolerant to LoF (pLI = 1)."
    explanation: Population constraint data support haploinsufficiency as the disease mechanism.
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine variants correspond to premature stop codons, frameshifts, or splicing variants."
    explanation: Most disease variants are predicted to abolish the allele, consistent with loss of function.
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One variant behaves as a severe LoF variant, whereas two others behave as partial LoF variants."
    explanation: Knock-in of patient missense variants into the fly ortholog furry shows that these variants also reduce function.
  downstream:
  - target: Impaired Neuronal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Disrupted Organ Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Low Body Weight
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Neuronal Development
  description: >-
    The neurodevelopmental features are thought to reflect a requirement for
    FRYL in neuronal development. Direct evidence comes only from Drosophila:
    furry is expressed in neurons but not glia, is required for neuronal
    communication in the retina, and together with the NDR kinase Tricornered
    limits dendritic branching and enforces dendritic tiling. Whether FRYL acts
    through NDR kinases in human neurons is untested.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "We find that the fly FRYL ortholog, furry (fry), is expressed in multiple tissues, including the central nervous system where it is present in neurons but not in glia."
    explanation: Neuronal expression of the fly ortholog places Furry-family function in neurons.
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we showed that fry is required for fly development, wing hair morphogenesis, and neuronal communication in the retina"
    explanation: Fly knock-in and loss-of-function alleles reduce retinal neuronal transmission, inferred to model the human neurological phenotype.
  - reference: PMID:15479641
    reference_title: Control of dendritic branching and tiling by the Tricornered-kinase/Furry signaling pathway in Drosophila sensory neurons.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Dendrites of fry and trc mutants display excessive terminal branching and fail to avoid homologous dendritic branches, resulting in significant overlap of the dendritic fields."
    explanation: Loss of fly furry disrupts dendrite morphogenesis, the best characterized neuronal function of the protein family.
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual 9 had mild thinning of the corpus callosum with mild diffuse cerebral volume loss, and individual 11 had cortical dysplasia."
    explanation: Structural brain abnormalities in two of six imaged patients are the human readout of disturbed brain development; they do not show which cellular process is affected.
  downstream:
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Delayed Speech and Language Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Autism Spectrum Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Behavioral Differences
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Structural Brain Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Disrupted Organ Morphogenesis
  description: >-
    Congenital anomalies of the heart, left-right patterning, genitourinary
    tract, gastrointestinal tract, diaphragm, chest wall and face indicate that
    FRYL dosage matters for morphogenesis in several organ systems. Fryl-null
    mice die soon after birth with renal tubular defects, and morpholino
    knockdown of fryl in zebrafish causes cardiac and craniofacial defects. The
    developmental pathway through which FRYL acts in these tissues is unknown.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: animal organ morphogenesis
    term:
      id: GO:0009887
      label: animal organ morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other features include neurobehavioral differences, autism spectrum disorder, hypotonia, and seizures, as well as congenital anomalies in cardiovascular, skeletal, gastrointestinal, renal, and urogenital systems."
    explanation: The human cohort shows congenital anomalies across several organ systems.
  - reference: PMID:29409347
    reference_title: Fryl deficiency is associated with defective kidney development and function in mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Fryl protein is required for normal development and functional maintenance of kidney in mice."
    explanation: Homozygous Fryl loss in mice disrupts kidney development, showing a mammalian requirement for Fryl in organogenesis.
  - reference: PMID:38479391
    reference_title: De novo variants in FRYL are associated with developmental delay, intellectual disability, and dysmorphic features.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "Morpholino-mediated knockdown of fryl in zebrafish causes cardiac and craniofacial defects during development."
    explanation: The founding paper's introduction reports zebrafish knockdown data linking fryl to heart and craniofacial development.
  downstream:
  - target: Facial Dysmorphism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Heart Defects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Heterotaxy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cryptorchidism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypospadias
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Diaphragmatic Hernia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Jejunal Atresia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcolon
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sternal Anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Vertebral Segmentation Defects

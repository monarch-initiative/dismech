- name: Babesia-mediated erythrocyte lysis
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  role: CONSEQUENCE
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Destruction of infected erythrocytes produces hemolysis, anemia, bilirubin
    generation, and downstream systemic manifestations. Babesiosis reaches the
    conserved premature-erythrocyte-destruction step by an infectious route:
    intraerythrocytic parasite replication lyses the host cell directly, and
    splenic macrophages additionally remove parasitized red cells. The
    destruction step, not the upstream cause, is what this entry shares with the
    hereditary and autoimmune hemolytic anemias.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte

discussions:
- discussion_id: gap_babesiosis_severity_beyond_parasitemia
  prompt: >-
    Which host, parasite, inflammatory, and organ-specific factors explain
    severe end-organ dysfunction when peripheral parasitemia is not high?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Parasitemia-associated multisystem dysfunction
  rationale: >-
    Peak parasitemia correlates strongly with severity and informs exchange
    transfusion decisions, but some patients with organ dysfunction lack
    high-grade parasitemia. A parasite-percentage threshold therefore cannot
    fully represent tissue injury, host vulnerability, or timing.
  evidence:
  - reference: PMID:33179803
    reference_title: Parasite burden and red blood cell exchange transfusion for babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Babesia microti parasitemia is closely associated with disease severity, though not all subjects with end-organ dysfunction had high-grade parasitemia."
    explanation: The human cohort directly identifies the unresolved mismatch between circulating burden and organ injury.
- discussion_id: gap_babesiosis_tafenoquine_translation
  prompt: >-
    Can tafenoquine be used safely and effectively as an adjunct to standard
    care for human babesiosis, and which regimen prevents relapse without
    unacceptable hemolytic risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - clinical_trials#NCT06207370
  - pathophysiology#Impaired host clearance and persistent parasitemia
  rationale: >-
    Tafenoquine plus atovaquone cures B. microti and B. duncani mouse models,
    and a small human relapsing-babesiosis series suggests adjunctive activity,
    but tafenoquine monotherapy failed in one case. A recruiting randomized
    Phase II add-on trial is testing hospitalized patients at low relapse risk;
    efficacy, optimal combinations, immunocompromised-host use, resistance, and
    G6PD-related safety remain unresolved.
  evidence:
  - reference: PMID:38169301
    reference_title: Tafenoquine-Atovaquone Combination Achieves Radical Cure and Confers Sterile Immunity in Experimental Models of Human Babesiosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that a combination of tafenoquine and atovaquone achieves cure with no recrudescence in both models of human babesiosis."
    explanation: Preclinical evidence supports the combination but does not establish human efficacy.
  - reference: PMID:38814096
    reference_title: "Tafenoquine for Relapsing Babesiosis: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1 case, tafenoquine was administered alone and failed to prevent relapse."
    explanation: The case series identifies a clinically important monotherapy limitation.
  - reference: clinicaltrials:NCT06207370
    reference_title: A Double-blind Placebo-controlled Study to Assess the Safety and Efficacy of Oral Tafenoquine Plus Standard of Care Versus Placebo Plus Standard of Care in Patients Hospitalized for Babesiosis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study is a double-blind, randomized, multisite, placebo-controlled trial comparing the safety and efficacy of TQ versus placebo in patients hospitalized for babesiosis"
    explanation: The active trial directly addresses adjunctive human efficacy and safety.

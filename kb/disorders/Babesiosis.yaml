review_notes: >-
  Re-reviewed 2026-07-23. This entry models human babesiosis across Babesia
  species while distinguishing U.S. B. microti epidemiology from broader
  species biology. Human clinical evidence anchors erythrocyte invasion,
  hemolysis, host-risk modifiers, severity, diagnosis, and treatment. Mouse and
  in-vitro evidence is labeled explicitly and is not treated as quantitative
  human proof. Tafenoquine remains investigational for babesiosis; it is
  represented in a recruiting trial and discussion rather than as established
  therapy. Surveillance counts are reported-case counts and should not be read
  as population prevalence.

  Updated 2026-07-29. Added the previously absent structured `prevalence` block
  (Orphanet European point prevalence; CDC peak U.S. state annual reported
  incidence, explicitly flagged as a reported-case lower bound rather than a
  true infection rate). Declared conformance of the erythrocyte-lysis node to
  `hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction`,
  which places babesiosis alongside the hereditary and autoimmune hemolytic
  anemias at the shared destruction step while keeping the infectious upstream
  cause distinct. Added the severe-disease phenotypes myocardial infarction,
  coma, and anorexia with matching causal edges. Congestive heart failure and
  venous thrombosis/hypercoagulability appear in the Orphanet phenotype table
  but were deliberately NOT added as manifestations: CDC lists congestive heart
  failure as a predisposing risk factor for severe disease, so asserting it as
  a consequence would invert the causal direction. Photophobia, depression,
  recurrent pharyngitis, limitation of joint mobility, and clinodactyly of the
  5th toe were also left out as implausible for an acute protozoal infection
  and most likely Orphanet annotation noise. Tick-bite avoidance counseling was
  added as the one previously missing arm of management (there is no babesiosis
  vaccine), classified COUNSELING_INFORMATIONAL and deliberately carrying no
  `target_mechanisms` edge: informational actions do not themselves act on the
  pathograph, so the mechanistic link is stated in prose instead. One
  pre-existing MMWR snippet was
  trimmed because PDF line-break hyphenation of "black-legged" meant the quoted
  string was not actually contiguous in the cached text; this went undetected
  because `DOI:` is in the reference validator's skip_prefixes.

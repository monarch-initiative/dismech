  - name: Asexual replication in the mammalian host
    description: Asexual parasite replication occurs in the mammalian host.
    evidence:
    - reference: PMID:40908571
      reference_title: "Human babesiosis: The past, present and future."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Babesiosis is caused by members of the Babesia spp., protozoan parasites whose life cycle includes sexual reproduction in the arthropod vector and asexual reproduction in the mainly mammalian host."
      explanation: The review directly supports asexual replication in the mammalian phase.
  - name: Human intraerythrocytic phase

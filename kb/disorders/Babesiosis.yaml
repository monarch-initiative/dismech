transmission:
- name: Ixodid tick transmission
  description: >-
    Most human infections are acquired from hard-bodied Ixodes tick vectors,
    with regional endemicity in the northeastern and upper midwestern United
    States.
  evidence:
  - reference: PMID:34539601
    reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most infections are transmitted by Ixodid (hard-bodied) ticks"
    explanation: The review identifies Ixodid tick bites as the main transmission route.
  - reference: PMID:28202022
    reference_title: "Hematologic manifestations of babesiosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Babesiosis, a zoonotic parasitic infection transmitted by the Ixodes tick, has become an emerging health problem in humans that is attracting attention worldwide."
    explanation: This review also supports Ixodes tick-mediated zoonotic transmission.
- name: Transfusion-associated transmission
  description: Viable Babesia in donated blood can transmit infection to transfusion recipients.
  evidence:
  - reference: PMID:34539601
    reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they occasionally can be spread through blood transfusion"
    explanation: The review identifies blood transfusion as an established non-vector route.
- name: Congenital and organ-transplant transmission
  description: >-
    Rare non-vector routes include perinatal transmission and transplantation
    of organs from infected donors.
  evidence:
  - reference: PMID:34539601
    reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although they occasionally can be spread through blood transfusion and rarely via perinatal transmission and organ transplantation."
    explanation: The review identifies perinatal and organ-transplant transmission as rare routes.
epidemiology:
- name: United States reported burden, 2011–2019
  description: >-
    CDC received 16,456 reported babesiosis cases from 37 states during
    2011–2019; 98.2% came from the 10 states included in the longitudinal
    incidence analysis.
  unit: reported cases
  factors:
  - Surveillance case definitions and state reporting requirements
  - Concentration of transmission in northeastern and upper midwestern states
  evidence:
  - reference: DOI:10.15585/mmwr.mm7211a1
    reference_title: "Trends in Reported Babesiosis Cases — United States, 2011–2019"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During 2011–2019, a total of 16,456 cases of babesiosis were reported to CDC by 37 states, including 16,174 (98.2%) reported from the 10 states included in this analysis"
    explanation: CDC surveillance provides the reported national case count and analytic-state concentration.
- name: Expanding northeastern endemicity
  description: >-
    Incidence increased significantly in eight northeastern states during
    2011–2019, with Maine, New Hampshire, and Vermont newly recognized as having
    endemic transmission comparable to other high-incidence states.
  factors:
  - Geographic expansion of Ixodes scapularis
  - Increasing infection incidence in northeastern states
  evidence:
  - reference: DOI:10.15585/mmwr.mm7211a1
    reference_title: "Trends in Reported Babesiosis Cases — United States, 2011–2019"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence increased significantly in Connecticut, Maine, Massachusetts, New Hampshire, New Jersey, New York, Rhode Island, and Vermont"
    explanation: The multistate surveillance analysis documents statistically significant incidence increases.
  - reference: DOI:10.15585/mmwr.mm7211a1
    reference_title: "Trends in Reported Babesiosis Cases — United States, 2011–2019"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These three states should now be considered to have endemic transmission comparable to that in other high-incidence states"
    explanation: CDC identifies Maine, New Hampshire, and Vermont as newly endemic in this surveillance period.
prevalence:
- population: Europe
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_high: 0.1
  notes: >-
    Orphanet records a European point-prevalence class below 1 per 1,000,000.
    European babesiosis is caused predominantly by Babesia divergens and
    B. venatorum and is far rarer than U.S. Babesia microti infection, so this
    class should not be generalized to the endemic northeastern United States.
  evidence:
  - reference: ORPHA:108
    reference_title: "Babesiosis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Europe | Point prevalence | OTHER"
    explanation: Orphanet provides the European point-prevalence class for babesiosis.
- population: Rhode Island, United States (2015)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 18.0
  notes: >-
    Highest single state-year reported incidence observed in CDC national
    surveillance during 2011-2019; Maine (10.3 per 100,000 in 2019) and
    Massachusetts (9.1 in 2019) were next highest. These are reported-case
    incidences, not seroprevalence or true infection rates: asymptomatic
    infections, unreported cases, and the 10 states where babesiosis is not a
    reportable condition by law are not captured, so the values are lower bounds.
  evidence:
  - reference: DOI:10.15585/mmwr.mm7211a1
    reference_title: "Trends in Reported Babesiosis Cases — United States, 2011–2019"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reported incidences were Rhode Island (18.0 per 100,000 population in 2015), Maine (10.3 in 2019), and Massachusetts (9.1 in 2019)."
    explanation: >-
      CDC surveillance reports the highest state-level annual babesiosis
      incidences during the 2011-2019 analysis period.
environmental:
- name: Exposure to infected black-legged ticks
  influences_mechanisms:
  - target: Tick- or blood-mediated Babesia host entry
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The bite of an infected Ixodes tick inoculates sporozoites directly,
      which is the arthropod arm of this entry node and the route that
      accounts for most infections.
    evidence:
    - reference: PMID:34539601
      reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most infections are transmitted by Ixodid (hard-bodied) ticks"
      explanation: >-
        States that most infections are transmitted by ixodid ticks,
        establishing the tick bite as the dominant route of parasite entry.
  description: >-
    Residence in or travel to endemic northeastern and upper midwestern areas
    with infected Ixodes scapularis creates the principal environmental
    acquisition risk for U.S. babesiosis.
  effect: Increases risk of tick-borne Babesia microti infection.
  evidence:
  - reference: DOI:10.15585/mmwr.mm7211a1
    reference_title: "Trends in Reported Babesiosis Cases — United States, 2011–2019"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the United States, most babesiosis cases are caused by Babesia microti"
    explanation: >-
      CDC surveillance identifies B. microti as the dominant U.S. agent; the same
      sentence continues to name black-legged tick bites in northeastern and
      midwestern states as the transmission route. The quote is trimmed to the
      portion that is contiguous in the cached PDF text, which hyphenates
      "black-legged" across a line break.
- name: Exposure to unscreened or infected donated blood
  exposure_term:
    preferred_term: transfusion of unscreened donated blood
    term:
      id: ECTO:2000058
      label: exposure to blood transfusion
  influences_mechanisms:
  - target: Tick- or blood-mediated Babesia host entry
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Transfusion bypasses the arthropod phase entirely, delivering
      already-intraerythrocytic parasites straight into the recipient's
      circulation. It is the blood-mediated arm of the same entry node.
    evidence:
    - reference: PMID:34539601
      reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "they occasionally can be spread through blood transfusion"
      explanation: >-
        Confirms blood transfusion as a route by which the parasite is spread,
        independent of any tick exposure.
  description: >-
    Transfusion can bypass the tick vector and introduce intraerythrocytic
    parasites directly into a recipient, including recipients vulnerable to
    severe infection.
  effect: Increases risk of transfusion-transmitted babesiosis.
  evidence:
  - reference: PMID:34539601
    reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "they occasionally can be spread through blood transfusion"
    explanation: The review establishes infected blood products as an acquisition exposure.
progression:
- phase: Asymptomatic or subclinical infection
  duration: Variable; infection may be detected incidentally or through donor screening.
  notes: Many infections remain asymptomatic, particularly in immunocompetent hosts.
  evidence:
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The infection is usually asymptomatic or self-limited in the immunocompetent host"
    explanation: Human clinical review evidence supports an asymptomatic or self-limited initial course.
- phase: Acute symptomatic babesiosis
  duration: Acute febrile illness; standard treatment is generally 7–10 days in immunocompetent patients.
  notes: Fever, fatigue, headache, myalgia, hemolytic anemia, and thrombocytopenia are typical.
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "infection ranges from subclinical to severe, presenting with flu-like symptoms and clinical or laboratory signs of red blood cell destruction."
    explanation: CDC describes the transition from subclinical infection to symptomatic hemolytic illness.
- phase: Severe high-burden or complicated babesiosis
  duration: Acute hospitalization; duration depends on parasite clearance and organ recovery.
  notes: Complications include DIC, respiratory distress, renal or hepatic dysfunction, altered mental status, and death.
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In severe cases, patients may exhibit thrombocytopenia, disseminated intravascular coagulation, hemodynamic instability, acute respiratory distress, myocardial infarction, renal failure, hepatic compromise, altered mental status, and potentially, death."
    explanation: CDC defines the organ-complication spectrum of severe disease.
- phase: Persistent or relapsing infection
  duration: Weeks to months or longer in highly immunocompromised patients.
  notes: Impaired splenic or immune clearance can require prolonged therapy and close smear monitoring.
  evidence:
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "follows a persistent, relapsing, and/or life threatening course with multi-organ failure, mainly in the splenectomized or immunosuppressed patients."
    explanation: The review links impaired host defense with persistence, relapse, and life-threatening progression.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_erythrocytic_disease
  hypothesis_label: Canonical intraerythrocytic replication and hemolysis model
  status: CANONICAL
  description: >-
    Human disease is driven by Babesia invasion and replication within
    erythrocytes, followed by erythrocyte lysis, anemia, systemic illness, and
    parasite-burden-associated organ complications.
  evidence:
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is caused by the protozoa of the genus Babesia, which invade human erythrocytes and lyse them causing a febrile hemolytic anemia."
    explanation: This human clinical review directly states the central erythrocyte-invasion and lysis mechanism.
- hypothesis_group_id: host_clearance_severity_modifier
  hypothesis_label: Splenic and cell-mediated clearance modifies persistence and severity
  status: CANONICAL
  description: >-
    Splenic filtration, macrophages, CD4 T cells, and interferon-gamma support
    parasite clearance; asplenia or immunosuppression shifts the balance toward
    persistent, relapsing, or life-threatening infection.
  evidence:
  - reference: PMID:10417185
    reference_title: Roles of CD4(+) T cells and gamma interferon in protective immunity against Babesia microti infection in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest essential requirements for CD4(+) T cells and IFN-gamma in protective immunity against challenge infection with B. microti."
    explanation: Controlled mouse experiments identify CD4 T cells and interferon-gamma as protective components.
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "follows a persistent, relapsing, and/or life threatening course with multi-organ failure, mainly in the splenectomized or immunosuppressed patients."
    explanation: Human evidence establishes the clinical severity boundary associated with impaired splenic or immune defense.

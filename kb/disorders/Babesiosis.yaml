description: >-
  Babesiosis is an intraerythrocytic protozoal infection caused by Babesia
  species. Most U.S. cases are caused by Babesia microti and acquired through
  Ixodes scapularis tick bites, although transfusion, organ-transplant, and
  congenital transmission also occur. Infection ranges from asymptomatic
  parasitemia to febrile hemolytic anemia and life-threatening pulmonary,
  renal, hepatic, coagulation, cardiovascular, or neurologic complications.
  Older, asplenic, and immunocompromised people are at greatest risk of severe,
  persistent, or relapsing disease.

    Babesia undergoes sexual reproduction in an arthropod vector and asexual
    replication in a mainly mammalian host. Human disease reflects the
    intraerythrocytic asexual phase.
  hosts:
  - preferred_term: Homo sapiens
    role: Mammalian host for the clinically relevant intraerythrocytic phase
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Ixodes scapularis
    role: Principal arthropod vector host for B. microti in the United States
    term:
      id: NCBITaxon:6945
      label: Ixodes scapularis
  vectors:
  - Black-legged tick (Ixodes scapularis)
  life_cycle_stages:
  - name: Sexual replication in the arthropod vector

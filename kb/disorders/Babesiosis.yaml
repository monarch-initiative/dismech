- name: Tick-bite avoidance counseling
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  description: >-
    No babesiosis vaccine exists, so primary prevention rests entirely on
    interrupting the tick-exposure step: avoiding tick habitat, using
    repellents, wearing covering clothing, and performing tick self-checks.
    Successful avoidance acts upstream of the host-entry trigger by preventing
    the inoculation event itself, though it is the patient's resulting behavior
    rather than the advice that interrupts transmission. Tick avoidance does
    not address the transfusion, transplant, or congenital routes, which is why
    donor screening matters independently.
  treatment_term:
    preferred_term: tick-bite avoidance counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is no vaccine for babesiosis. Encourage patients to avoid ticks, use tick repellents, wear socks, long-sleeved shirts, and pants, and perform self-checks for the presence of ticks."
    explanation: CDC directly states the absence of a vaccine and the recommended personal protective measures.

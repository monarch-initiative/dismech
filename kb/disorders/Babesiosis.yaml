histopathology:
- name: Intraerythrocytic Babesia on peripheral blood smear
  description: >-
    Giemsa-stained peripheral blood may show intraerythrocytic Babesia forms;
    careful manual review and species-aware confirmation are important because
    low parasitemia, Plasmodium, and staining artifacts can complicate
    interpretation.
  finding_term:
    preferred_term: Intraerythrocytic Babesia parasite present
    term:
      id: NCIT:C120903
      label: Parasite Present
  diagnostic: true
  evidence:
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood smear revealed intraerythrocytic Babesia, which was confirmed by PCR."
    explanation: Human clinical evidence directly documents the diagnostic microscopic finding.
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When considering a babesiosis diagnosis, healthcare providers should explicitly request a manual (non-automated) review of the peripheral blood smear."
    explanation: CDC specifically recommends manual smear review when babesiosis is suspected.
biochemical:
- name: Peripheral blood parasitemia
  presence: INCREASED
  context: >-
    The fraction of infected erythrocytes is a dynamic measure of parasite
    burden. Higher peak parasitemia correlates with severity, but clinical
    status and organ dysfunction must be assessed independently.
  readouts:
  - target: Intraerythrocytic invasion and asexual replication
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: The infected-erythrocyte fraction reports the burden of the intraerythrocytic parasite phase.
    evidence:
    - reference: PMID:33179803
      reference_title: Parasite burden and red blood cell exchange transfusion for babesiosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subjects were stratified according to peak parasitemia: <1% (n = 34), 1-5% (n = 24), 5-10% (n = 15), and >10% (n = 18)."
      explanation: The clinical cohort quantifies blood-stage burden as the percentage parasitemia.
  - target: Parasitemia-associated multisystem dysfunction
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: Increasing peak parasitemia generally tracks with increasing disease severity, but is not sufficient alone for risk classification.
    evidence:
    - reference: PMID:33179803
      reference_title: Parasite burden and red blood cell exchange transfusion for babesiosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Babesia microti parasitemia is closely associated with disease severity, though not all subjects with end-organ dysfunction had high-grade parasitemia."
      explanation: The cohort supports a positive but imperfect severity relationship.
  evidence:
  - reference: PMID:33179803
    reference_title: Parasite burden and red blood cell exchange transfusion for babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate a strong association between peak parasitemia level and disease severity."
    explanation: Human inpatient data establish parasitemia as a severity-associated blood marker.
- name: Hemolytic laboratory pattern
  presence: INCREASED
  context: >-
    Anemia with laboratory evidence of erythrocyte destruction is a core
    disease readout; thrombocytopenia and elevations in liver enzymes, blood
    urea nitrogen, or creatinine can accompany more complicated illness.
  readouts:
  - target: Babesia-mediated erythrocyte lysis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Laboratory evidence of red-cell destruction reports the hemolytic mechanism.
    evidence:
    - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
      reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "For acutely ill patients, the findings on routine laboratory testing frequently include hemolytic anemia and thrombocytopenia."
      explanation: CDC identifies hemolytic anemia as a frequent laboratory finding in acute illness.
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For acutely ill patients, the findings on routine laboratory testing frequently include hemolytic anemia and thrombocytopenia."
    explanation: CDC directly supports the characteristic acute laboratory pattern.
- name: Babesia DNA detected by nucleic acid amplification
  presence: POSITIVE
  context: >-
    Babesia PCR supports direct detection, including when organism burden is
    below the reliable threshold of routine microscopy or when treatment
    response and persistence require molecular assessment.
  readouts:
  - target: Intraerythrocytic invasion and asexual replication
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: Babesia DNA in blood directly reports current or recently active blood-stage infection in the appropriate clinical context.
    evidence:
    - reference: PMID:28202022
      reference_title: Hematologic manifestations of babesiosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Blood smear revealed intraerythrocytic Babesia, which was confirmed by PCR."
      explanation: Human clinical evidence uses PCR to confirm the smear-defined blood-stage infection.
  - target: Impaired host clearance and persistent parasitemia
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: MONITORING
    interpretation: Persistent Babesia DNA can reveal residual infection when smear parasitemia is difficult to detect.
    evidence:
    - reference: PMID:29445365
      reference_title: Babesia microti Infection Changes Host Spleen Architecture and Is Cleared by a Th1 Immune Response.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Although parasitemia was undetectable by microscopy at 21 days of infection, detection of B. microti DNA by our qPCR supports possibility of continuing low-level infection."
      explanation: Mouse-model evidence demonstrates molecular detection of low-level persistence after smear negativity; human monitoring implications remain inferential.
  evidence:
  - reference: PMID:34539601
    reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is usually confirmed by blood smear or polymerase chain reaction (PCR)."
    explanation: The review identifies PCR as a standard confirmatory method.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Many infections are asymptomatic or self-limited, but asplenic,
    immunocompromised, and older patients can develop persistent parasitemia,
    severe hemolysis, multiorgan failure, prolonged treatment needs, and death.
  evidence:
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The infection is usually asymptomatic or self-limited in the immunocompetent host, or follows a persistent, relapsing, and/or life threatening course with multi-organ failure, mainly in the splenectomized or immunosuppressed patients."
    explanation: The review directly supports the strongly variable burden assignment.
diagnosis:
- name: Manual peripheral blood-smear examination
  description: >-
    Request manual light-microscopic review of peripheral blood smears for
    intraerythrocytic Babesia. Multiple smears may be required at low burden,
    and expert review may be needed to distinguish Babesia from Plasmodium or
    artifacts.
  diagnosis_term:
    preferred_term: blood smear test
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Intraerythrocytic Babesia forms support active infection; species confirmation may require molecular testing.
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When considering a babesiosis diagnosis, healthcare providers should explicitly request a manual (non-automated) review of the peripheral blood smear."
    explanation: CDC specifically recommends manual rather than automated smear review.
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "parasites through light-microscopic examination of blood smears, though sometimes multiple smears may need to be examined."
    explanation: CDC supports microscopy and repeat-smear review when necessary.
- name: Babesia nucleic acid amplification testing
  description: >-
    PCR or another validated nucleic acid amplification test confirms Babesia
    DNA in blood and is particularly useful when smear burden is low or species
    resolution is needed.
  diagnosis_term:
    preferred_term: nucleic acid amplification testing
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  results: A positive species-appropriate Babesia nucleic acid test supports active or recently active infection in clinical context.
  evidence:
  - reference: PMID:34539601
    reference_title: "Babesia microti: Pathogen Genomics, Genetic Variability, Immunodominant Antigens, and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is usually confirmed by blood smear or polymerase chain reaction (PCR)."
    explanation: The review identifies PCR as a usual confirmatory modality.
  - reference: PMID:28202022
    reference_title: Hematologic manifestations of babesiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood smear revealed intraerythrocytic Babesia, which was confirmed by PCR."
    explanation: A human clinical example demonstrates molecular confirmation of smear findings.
- name: Babesia serology as supportive testing
  description: >-
    Species-appropriate serology can support exposure assessment or diagnosis,
    but it should be interpreted with direct-detection tests because antibodies
    may persist and immunocompromised patients may mount weak responses.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Positive Babesia-specific antibodies support exposure; direct detection is preferred for acute active infection.
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "by blood-smear examination and, if indicated, by other means, such as molecular and/or serologic methods tailored to the setting/species."
    explanation: CDC supports serology as a context- and species-tailored adjunct to direct examination.
differential_diagnoses:
- name: Malaria
  description: >-
    Malaria can cause a febrile intraerythrocytic parasitemia with anemia and
    may resemble babesiosis on thin blood smear, particularly when ring forms
    are sparse.
  disease_term:
    preferred_term: malaria
    term:
      id: MONDO:0005136
      label: malaria
  distinguishing_features:
  - Travel or residence in a malaria-endemic area shifts the pretest probability.
  - Expert morphology, species-specific PCR, and appropriate rapid antigen tests distinguish Plasmodium from Babesia.
  - Babesia can show tetrads, while Plasmodium has species-specific pigment and developmental forms.
  evidence:
  - reference: url:https://www.cdc.gov/babesiosis/hcp/clinical-overview/index.html
    reference_title: "Clinical Overview of Babesiosis | Babesiosis | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Distinguishing <em>Babesia</em> and <em>Plasmodium</em> parasites (especially <em>P. falciparum</em>) and artifacts like stain or platelet debris can be challenging."
    explanation: CDC explicitly identifies Plasmodium as a microscopic diagnostic challenge.
- name: Human granulocytic anaplasmosis
  description: >-
    Anaplasmosis shares Ixodes scapularis exposure, fever, headache, myalgia,
    leukopenia, and thrombocytopenia with babesiosis, and coinfection can occur.
  distinguishing_features:
  - Hemolytic anemia and intraerythrocytic parasites favor babesiosis.
  - Species-specific blood PCR distinguishes Babesia from Anaplasma phagocytophilum.
  - Detection of granulocytic morulae supports anaplasmosis rather than babesiosis.
  evidence:
  - reference: PMID:40908571
    reference_title: "Human babesiosis: The past, present and future."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "B. microti, Borrelia burgdorferi and Anaplasma phagocytophilum are all transmitted by black-legged ticks ( Ixodes scapularis) and therefore co-infection is likely and has been reported."
    explanation: The review establishes shared vector exposure and the possibility of coinfection.
  - reference: DOI:10.15585/mmwr.mm7211a1
    reference_title: "Trends in Reported Babesiosis Cases — United States, 2011–2019"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "other tickborne conditions can have similar clinical manifestations, risk for disease acquisition, and geographic distribution"
    explanation: CDC surveillance guidance supports considering clinically overlapping tick-borne conditions.

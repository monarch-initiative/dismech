diagnosis:
- name: Borrelia burgdorferi serologic testing (exclusion of Lyme disease)
  description: >-
    No confirmatory laboratory test exists for STARI; acute and convalescent
    enzyme-linked immunosorbent assay and two-tiered IgM/IgG immunoblot testing
    for Borrelia burgdorferi antibodies are performed to exclude early Lyme
    disease in overlapping geographic regions and are characteristically
    negative in STARI.
  presence: Negative
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:15668867
    reference_title: >-
      Microbiologic evaluation of patients from Missouri with erythema
      migrans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the 25 evaluable Missouri patients were seropositive for
      antibodies against B. burgdorferi, compared with 107 (75%) of 143 New
      York State patients (P<.001).
    explanation: Demonstrates uniform seronegativity for Borrelia burgdorferi antibodies in classic Missouri STARI patients.
  - reference: PMID:28814545
    reference_title: >-
      Metabolic differentiation of early Lyme disease from southern
      tick-associated rash illness (STARI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To establish a Lyme disease diagnostic baseline, the recommended
      two-tiered serology testing for Lyme disease was performed on all
      samples.
    explanation: Documents standard two-tiered Lyme serology in the diagnostic evaluation distinguishing STARI from Borrelia burgdorferi infection.
- name: Skin biopsy Borrelia PCR and culture (exclusion of Borrelia infection)
  description: >-
    In research and microbiologic workup of erythema migrans-like lesions,
    skin biopsy PCR and Barbour-Stoenner-Kelly culture exclude both Borrelia
    burgdorferi and Borrelia lonestari.
  presence: Negative
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:15668867
    reference_title: >-
      Microbiologic evaluation of patients from Missouri with erythema
      migrans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      B. lonestari was not detected by PCR in any of 31 skin biopsy specimens
      collected from 30 Missouri patients. None of 19 cultures of Missouri skin
      samples that were suitable for evaluation were positive for B.
      burgdorferi, compared with 89 (63%) of 142 cultures of samples collected
      from New York State patients (P<.001).
    explanation: Confirms negative skin-biopsy Borrelia PCR and culture in classic Missouri STARI lesions.
treatments:
- name: Empiric Oral Antibiotic Therapy
  description: >-
    Because STARI skin lesions are clinically indistinguishable from early Lyme
    disease and geographic distributions overlap, patients are commonly treated
    empirically with oral antibiotics used for early Lyme disease (such as
    doxycycline), with rapid clinical resolution observed in prospective
    Missouri cohorts despite the absence of a confirmed bacterial etiology.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  evidence:
  - reference: PMID:28814545
    reference_title: >-
      Metabolic differentiation of early Lyme disease from southern
      tick-associated rash illness (STARI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lyme disease is treated with antibiotics, and although there is no
      defined infectious etiology for STARI, this illness is also commonly
      treated in a similar manner (7, 20, 40).
    explanation: Documents standard empiric antibiotic management of STARI in clinical practice despite unconfirmed infectious etiology.
  - reference: PMID:16142659
    reference_title: >-
      Prospective clinical evaluation of patients from Missouri and New York
      with erythema migrans-like skin lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After antibiotic treatment, Missouri case patients recovered more
      rapidly than did New York case patients (P=.037).
    explanation: Demonstrates rapid clinical recovery following antibiotic treatment in prospective Missouri STARI cases.
differential_diagnoses:
- name: Lyme disease
  disease_term:
    preferred_term: Lyme disease
    term:
      id: MONDO:0019632
      label: Lyme disease
  description: >-
    Ixodes-transmitted Borrelia burgdorferi infection that also presents with
    erythema migrans but has a defined bacterial etiology, available
    laboratory testing, and greater potential for disseminated multisystem
    disease.
  distinguishing_features:
  - Lyme disease has a defined bacterial etiology, whereas STARI remains of unknown cause and has no validated laboratory diagnostic test.
  - Missouri STARI patients were less symptomatic, more often had single smaller circular lesions with central clearing, and recovered more rapidly after antibiotic treatment than New York early Lyme disease patients.
  evidence:
  - reference: PMID:28814545
    reference_title: >-
      Metabolic differentiation of early Lyme disease from southern
      tick-associated rash illness (STARI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This, however, can be confused with other illnesses including
      southern tick-associated rash illness (STARI), an illness that lacks
      a defined etiological agent or laboratory diagnostic test, and is
      coprevalent with Lyme disease in portions of the eastern United
      States.
    explanation: >-
      This directly frames STARI as a Lyme mimic while emphasizing the lack
      of a defined etiologic agent or test.
  - reference: PMID:16142659
    reference_title: >-
      Prospective clinical evaluation of patients from Missouri and New York
      with erythema migrans-like skin lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After antibiotic treatment, Missouri case patients recovered more
      rapidly than did New York case patients (P=.037).
    explanation: >-
      Supports the more favorable short-term course of classic Missouri
      STARI compared with comparator New York early Lyme disease cases.
notes: "This entry carries an infectious_agent record whose agent is undetermined and which is deliberately left unbound, because repeated studies have not established B. burgdorferi, B. lonestari, or another known bacterial pathogen as the cause of STARI. NCIT provides an exact disease concept (NCIT:C128427), whereas MONDO currently requires close matching to MONDO:0025294 pending new term request #9873. Tick-saliva-mediated mechanisms have been proposed as one explanation for why lone star tick bites can cause EM-like illness without classic Lyme transmission, but this remains a hypothesis rather than a confirmed disease mechanism."

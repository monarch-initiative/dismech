    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Headache
    description: >-
      Mild systemic inflammatory signaling contributes to acute headache.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia
    description: >-
      Systemic inflammatory and lipid-mediator alterations accompany transient

- name: Systemic Host Lipid-Mediator and Constitutional Response
  biological_scale: ORGANISM
  description: >-
    Patient-serum metabolomics identifies a systemic biochemical state in STARI
    that differs significantly from early Lyme disease, including altered
    N-acyl ethanolamine and primary fatty acid amide (endocannabinoid-like
    lipid mediator) signaling accompanying mild constitutional and
    musculoskeletal symptoms in a subset of patients.
  locations:
  - preferred_term: blood serum
    term:
      id: UBERON:0001977
      label: blood serum
  biological_processes:
  - preferred_term: lipid metabolic process
    term:
      id: GO:0006629
      label: lipid metabolic process
    modifier: ABNORMAL
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:28814545
    reference_title: >-
      Metabolic differentiation of early Lyme disease from southern
      tick-associated rash illness (STARI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the metabolic biosignature revealed that N-acyl ethanolamine
      (NAE) and primary fatty acid amide (PFAM) metabolism differed
      significantly between these two diseases.
    explanation: Identifies altered N-acyl ethanolamine and primary fatty acid amide lipid-mediator pathways in STARI patient sera.
  - reference: PMID:28814545
    reference_title: >-
      Metabolic differentiation of early Lyme disease from southern
      tick-associated rash illness (STARI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings revealed metabolic dissimilarity between early Lyme
      disease and STARI, and provide a powerful and new approach to inform
      patient management by objectively distinguishing early Lyme disease
      from an illness with nearly identical symptoms.
    explanation: >-
      Supports STARI as a distinct host-response state rather than just a
      geographic variant of early Lyme disease.
  downstream:
  - target: Fatigue
    description: >-
      Systemic host inflammatory and lipid-mediator signaling accompanies mild
      acute fatigue in symptomatic STARI cases.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Fever
    description: >-
      Systemic acute host response produces low-grade fever in a subset of

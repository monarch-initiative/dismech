- name: Variant-specific pharmacological rescue (investigational)
  description: >-
    Because different GABRA1 variants disable the receptor by different
    mechanisms, agents that address the specific defect are being explored. For
    the trafficking-deficient R214C variant, 24-hour verapamil treatment fully
    restored mutant receptor function in vitro, primarily by increasing channel
    open time, whereas diazepam and insulin produced only partial restoration.
    This is an in-vitro precision-medicine lead in a single variant, not
    established clinical practice, and no clinical trial evidence exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

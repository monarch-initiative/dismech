- name: Loss-of-Function Reduction in GABA-A Receptor Current
  description: >-
    The most frequently demonstrated functional consequence of a pathogenic
    GABRA1 variant is a reduction in GABA-evoked chloride current through
    receptors containing the mutant subunit. Patch-clamp characterization of the
    de novo R214C variant showed the reduction arises from two separable
    defects: a shortened single-channel open time, and a fall in the amount of
    receptor present at all. Loss of function is the effect seen in the
    extracellular-domain variants and in a subset of transmembrane variants.
  biological_scale: MOLECULAR
  role: amplifier

- name: Gain-of-Function Shift in GABA Sensitivity and Desensitization
  description: >-
    A functionally opposite class of GABRA1 variants, localized to the
    pore-forming transmembrane helices, increases the apparent potency of GABA
    and alters receptor desensitization without reducing receptor expression or
    trafficking. The de novo A332V variant in transmembrane helix 3 showed
    unchanged protein levels, normal assembly and normal forward trafficking,
    but a significant left shift in apparent GABA potency. Counterintuitively it
    is this gain-of-function group, not the loss-of-function group, that carries
    the most severe early-onset neurodevelopmental phenotype — a pattern also
    seen in the paralogous GABRB3 encephalopathy, and one that matters clinically
    because it inverts the expected direction of GABAergic pharmacotherapy.

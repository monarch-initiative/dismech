- name: Impaired GABAergic Inhibitory Neurotransmission
  description: >-
    Loss of alpha-1-containing GABA-A receptor function at the synapse weakens
    fast phasic inhibition. In the heterozygous Gabra1 mouse, this is directly
    measurable as a substantial reduction in the peak amplitude and frequency of
    miniature inhibitory postsynaptic currents in the ventrobasal thalamus, with

  - target: Impaired Receptor Trafficking and Surface Expression
    description: >-
      Verapamil acts on the trafficking/surface-expression arm of the mechanism
      rather than on network excitability.
  evidence:
  - reference: PMID:31707987
    reference_title: "Pathophysiology of and therapeutic options for a GABRA1 variant linked to epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, verapamil treatment for 24 h fully restored the function of R214C mutant receptors, primarily by increasing channel open time.
    explanation: >-
      Reports full in-vitro functional rescue of a specific GABRA1 variant by
      verapamil, the basis for this investigational approach.
  - reference: PMID:31707987
    reference_title: "Pathophysiology of and therapeutic options for a GABRA1 variant linked to epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The GABA-evoked currents in R214C GABAA receptors could only be partially restored with benzodiazepine (diazepam) and insulin.
    explanation: >-
      Records the contrasting incomplete rescue by diazepam and insulin,
      supporting the claim that rescue is mechanism-specific rather than generic.
- name: Genetic counseling
  description: >-
    Because pathogenic GABRA1 variants in the encephalopathic range are typically
    de novo, recurrence risk for siblings is low but not zero, and counselling
    should address the possibility of undetected parental gonadal mosaicism.
    Inherited transmission is documented and is concentrated at the milder end of
    the spectrum.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24623842
    reference_title: "GABRA1 and STXBP1: novel genetic causes of Dravet syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results have important implications for diagnostic testing, clinical management, and genetic counseling of patients with this devastating disorder and their families.
    explanation: >-
      The primary report identifying GABRA1 as a cause of severe infantile
      epileptic encephalopathy explicitly frames genetic counseling as a clinical
      implication.
animal_models:
- name: Gabra1 heterozygous knockout mouse
  species: Mouse
  genotype: Gabra1 heterozygous deletion (Het-KO)
  publication: PMID:25447232
  description: >-
    Heterozygous deletion of Gabra1, modeling alpha-1 subunit
    haploinsufficiency, produces absence seizures and allows the circuit-level
    consequences of reduced alpha-1 to be measured directly in thalamus.
  modeled_mechanisms:
  - target: Impaired GABAergic Inhibitory Neurotransmission
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Directly measures the loss of phasic GABAergic inhibition produced by
      alpha-1 subunit loss in an intact thalamic circuit.
    limitations: >-
      Models haploinsufficiency by gene deletion, whereas most human DEE19
      variants are missense and may act by dominant-negative or gain-of-function
      mechanisms rather than simple dosage loss. The mouse phenotype is absence
      epilepsy, which sits at the milder end of the human spectrum rather than
      the encephalopathic end this entry curates.
    readouts:
    - name: Miniature inhibitory postsynaptic current amplitude and frequency in ventrobasal thalamus
      target: Impaired GABAergic Inhibitory Neurotransmission
      direction: DECREASED
      interpretation: >-
        Quantifies the reduction in phasic inhibitory synaptic transmission
        caused by alpha-1 subunit loss.
      evidence:
      - reference: PMID:25447232
        reference_title: "Altered intrathalamic GABAA neurotransmission in a mouse model of a human genetic absence epilepsy syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, heterozygous α1 subunit deletion substantially reduced miniature inhibitory postsynaptic current (mIPSC) peak amplitudes and frequency in VB.
        explanation: >-
          Reports the direct electrophysiological measurement behind this
          readout.
    evidence:
    - reference: PMID:25447232
      reference_title: "Altered intrathalamic GABAA neurotransmission in a mouse model of a human genetic absence epilepsy syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We previously demonstrated that heterozygous deletion of Gabra1, the mouse homolog of the human absence epilepsy gene that encodes the GABAA receptor (GABAAR) α1 subunit, causes absence seizures.
      explanation: >-
        Establishes the model as an informative system for the consequences of
        alpha-1 subunit loss.
- name: Gabra1 A322D knock-in mouse
  species: Mouse
  genotype: Gabra1+/A322D heterozygous knock-in
  publication: PMID:27573707
  description: >-
    A knock-in of the human A322D missense variant, which was the first GABRA1
    variant linked to epilepsy. The mice develop spontaneous absence seizures and
    later myoclonic seizures, allowing the cortical network dynamics of two
    seizure types to be compared in one animal.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability and Thalamocortical Hypersynchrony
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the network hypersynchrony step, showing increased EEG
      connectivity at seizure onset with somatosensory cortex leading motor
      cortex.
    limitations: >-
      A322D is a juvenile myoclonic epilepsy allele from the mild end of the
      GABRA1 spectrum, not a DEE19 encephalopathy allele, and the mouse
      phenotype is absence and myoclonic seizures rather than an infantile
      encephalopathy. It therefore models the shared network mechanism but not
      the severity or developmental impairment that define DEE19.
    readouts:
    - name: Interelectrode EEG connectivity at seizure onset
      target: Neuronal Hyperexcitability and Thalamocortical Hypersynchrony
      direction: INCREASED
      interpretation: >-
        Network synchrony rises at the onset of both absence and myoclonic
        seizures, the measurable correlate of the hypersynchrony node.
      evidence:
      - reference: PMID:27573707
        reference_title: "Dynamics of sensorimotor cortex activation during absence and myoclonic seizures in a mouse model of juvenile myoclonic epilepsy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          EEG connectivity among all electrode pairs increased at the onset of both SWDs and myoclonic seizures.
        explanation: >-
          Reports the connectivity measurement behind this readout.
    evidence:
    - reference: PMID:27573707
      reference_title: "Dynamics of sensorimotor cortex activation during absence and myoclonic seizures in a mouse model of juvenile myoclonic epilepsy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Early in life (postnatal day 35, P35), Gabra1+/A322D mice have spontaneous absence seizures with SWDs, and, later in life (P120), they have spontaneous SWDs, myoclonic seizures, and a greater sensitivity to pentylenetetrazol- (PTZ-) evoked myoclonic seizures than wild type mice.
      explanation: >-
        Establishes the model's genotype and spontaneous seizure phenotype,
        supporting its use as an informative system for GABRA1-driven network
        hyperexcitability.
diagnosis:
- name: Trio exome/genome sequencing or epilepsy gene panel
  description: >-
    Diagnosis is molecular: identification of a heterozygous pathogenic GABRA1
    variant on a targeted epilepsy gene panel or on exome/genome sequencing,
    ideally in a proband-plus-parents (trio) design so that de novo status can be
    established. This matters because the clinical presentation does not
    distinguish DEE19 from its differentials — GABRA1 patients are routinely
    ascertained from within SCN1A-negative Dravet cohorts and from undifferentiated
    infantile-epilepsy cohorts, so the gene, not the phenotype, is what settles
    the diagnosis.
  evidence:
  - reference: PMID:24623842
    reference_title: "GABRA1 and STXBP1: novel genetic causes of Dravet syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing in 13 SCN1A-negative patients with Dravet syndrome and targeted resequencing in 67 additional patients to identify new genes for this disorder.
    explanation: >-
      Documents the sequencing-based route by which GABRA1 patients are
      identified out of a clinically defined, gene-negative epilepsy population.
  - reference: PMID:24623842
    reference_title: "GABRA1 and STXBP1: novel genetic causes of Dravet syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results have important implications for diagnostic testing, clinical management, and genetic counseling of patients with this devastating disorder and their families.
    explanation: >-
      The primary report frames its findings as directly bearing on diagnostic
      testing for this population.
  - reference: PMID:26918889
    reference_title: "De novo GABRA1 mutations in Ohtahara and West syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 526 and 145 patients with infantile epilepsy were analyzed by whole-exome sequencing and GABRA1-targeted resequencing, respectively.
    explanation: >-
      Records both diagnostic modalities — untargeted exome sequencing and
      GABRA1-targeted resequencing — applied to an infantile-epilepsy population.
- name: Functional (electrophysiological) variant classification
  description: >-
    Beyond confirming that a variant is present, determining whether it is
    gain-of-function or loss-of-function is prognostically and therapeutically
    informative, because the two classes differ in severity and in reported drug
    response. Classification is done by two-electrode voltage-clamp or
    patch-clamp electrophysiology of the variant receptor; where functional data
    are unavailable, the variant's structural location — extracellular domain and
    small transmembrane loops versus pore-forming transmembrane helices —
    provides partial prediction. This is a research-grade step rather than a
    routine clinical assay.
  evidence:
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings establish the basis for a better understanding of the pathomechanism and a precision medicine approach in GABRA1-related disorders.
    explanation: >-
      Frames functional and structural variant classification as the basis for a
      precision-medicine approach, which is what this diagnostic step delivers.
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic and electroclinical data of 27 individuals (22 unrelated and 2 families) harboring 20 different GABRA1 variants were collected and accompanied by functional analysis of 19 variants.
    explanation: >-
      Records the functional-analysis workflow applied alongside genetic testing
      to classify GABRA1 variants.
differential_diagnoses:
- name: Dravet syndrome (SCN1A)
  description: >-
    Dravet syndrome is the closest clinical differential, and the relationship is
    not merely a resemblance: GABRA1 variants are found in patients who meet
    Dravet criteria but are SCN1A-negative. Fever-sensitive seizures beginning in
    infancy are shared. The distinction is molecular rather than clinical at
    presentation, which is why gene-panel or exome testing rather than
    phenotype alone settles it.
  evidence:
  - reference: PMID:24623842
    reference_title: "GABRA1 and STXBP1: novel genetic causes of Dravet syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole-exome sequencing in 13 SCN1A-negative patients with Dravet syndrome and targeted resequencing in 67 additional patients to identify new genes for this disorder.
    explanation: >-
      Establishes that GABRA1 patients are ascertained from within the
      SCN1A-negative Dravet population, making Dravet syndrome the primary
      differential.
- name: Juvenile myoclonic epilepsy (GABRA1, milder allelic phenotype)
  description: >-
    Autosomal dominant juvenile myoclonic epilepsy is caused by variants in the
    same gene and shares myoclonic and tonic-clonic seizures with
    photosensitivity, but is an idiopathic generalized epilepsy of adolescence
    with normal development — the opposite end of the GABRA1 severity spectrum
    from DEE19. It is curated as a separate dismech entry, not as a subtype here.
  evidence:
  - reference: PMID:27521439
    reference_title: "Phenotypic spectrum of GABRA1: From generalized epilepsies to severe epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic spectrum varied from unspecified epilepsy (1), juvenile myoclonic epilepsy (2), photosensitive idiopathic generalized epilepsy (1), and generalized epilepsy with febrile seizures plus (1) to severe epileptic encephalopathies (11).
    explanation: >-
      Documents that juvenile myoclonic epilepsy and severe epileptic
      encephalopathy occur within the same GABRA1 allelic series, establishing
      the milder syndromes as differentials rather than subtypes.
- name: Childhood absence epilepsy (GABRA1 susceptibility)
  description: >-
    Childhood absence epilepsy is another idiopathic generalized epilepsy in
    which GABRA1 acts as a susceptibility gene alongside CACNA1H, GABRG2 and
    GABRB3. Absence seizures do occur within the GABRA1 encephalopathy spectrum,
    so the discriminator is the accompanying developmental impairment and seizure
    burden rather than the absence seizures themselves.
  evidence:
  - reference: PMID:26918889
    reference_title: "De novo GABRA1 mutations in Ohtahara and West syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GABRA1 mutations have been identified in patients with familial juvenile myoclonic epilepsy, sporadic childhood absence epilepsy, and idiopathic familial generalized epilepsy.
    explanation: >-
      Records childhood absence epilepsy as an established milder GABRA1-associated
      phenotype distinct from the encephalopathies.
- name: GABRB3-related developmental and epileptic encephalopathy (DEE43)
  description: >-
    The paralogous GABA-A receptor beta-3 subunit encephalopathy is
    mechanistically the closest neighbour: it too splits into gain-of-function
    and loss-of-function variant classes with the gain-of-function group more
    severely affected. Distinguishing them is a matter of which subunit gene
    carries the variant, and it matters because GABRB3 gain-of-function patients
    have a documented vigabatrin hypersensitivity that has no established GABRA1
    counterpart.
  evidence:
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in GABRA1 have been associated with a broad epilepsy spectrum, ranging from genetic generalized epilepsies to developmental and epileptic encephalopathies.
    explanation: >-
      Frames GABRA1 as one of several GABA-A receptor subunit genes producing an
      allelic spectrum from generalized epilepsy to encephalopathy, of which
      GABRB3 is the closest paralogous neighbour.
discussions:
- discussion_id: gabra1_models_lack_gof_encephalopathy_allele
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the available Gabra1 mouse models actually model DEE19, given that both
    carry alleles from the mild end of the GABRA1 spectrum and both produce
    absence epilepsy rather than an infantile encephalopathy?
  rationale: >-
    Both committed animal models are informative for the shared network
    mechanism but neither reproduces the disease this entry curates. The
    heterozygous knockout models dosage loss, while most human DEE19 variants
    are missense; the A322D knock-in carries a juvenile myoclonic epilepsy allele
    from the opposite end of the severity spectrum. Neither models the
    gain-of-function transmembrane variants that produce the most severe human
    phenotype, and neither shows developmental regression or encephalopathy. The
    mismatch is mechanistically meaningful because the human genotype-phenotype
    data show severity is determined by variant class and structural position —
    exactly the dimension the existing models do not sample.
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Gain-of-Function Shift in GABA Sensitivity and Desensitization
  proposed_experiments:
  - experiment_id: gabra1_gof_knockin_severity_comparison
    name: Knock-in mouse carrying a gain-of-function transmembrane-helix GABRA1 variant
    description: >-
      Generate a knock-in mouse carrying a human DEE19 gain-of-function
      transmembrane-helix variant (for example the TM3 A332V allele) and
      characterize seizure phenotype, developmental trajectory and EEG against
      both wild-type and the existing A322D line.
    would_support:
    - pathophysiology#Gain-of-Function Shift in GABA Sensitivity and Desensitization
    supporting_outcome:
    - >-
      The gain-of-function knock-in shows earlier seizure onset, a more severe
      and refractory seizure phenotype, and measurable developmental impairment
      relative to the A322D loss-of-function line, reproducing the human
      severity ordering.
    refuting_outcome:
    - >-
      The gain-of-function knock-in produces a phenotype no more severe than the
      A322D line, indicating that the human severity difference is not
      attributable to the receptor-level functional class alone.
notes: >-
  Scope and lumping decision. This entry is the severe, encephalopathic end of
  the GABRA1 allelic spectrum (DEE19 / OMIM EIEE19). The milder GABRA1 phenotypes
  are deliberately not modelled as has_subtypes here: juvenile myoclonic epilepsy
  and childhood absence epilepsy are established idiopathic generalized epilepsy
  syndromes with their own dismech entries, in which GABRA1 appears as one gene
  among several, and folding them in as severity grades of DEE19 would
  misrepresent both. They are recorded as differential_diagnoses instead. The
  within-entry heterogeneity that does matter — extracellular-domain
  loss-of-function versus pore-forming transmembrane gain-of-function — is
  captured as two genetic_context blocks and as a branch in the pathophysiology
  chain, because both classes cause the same encephalopathic disease by
  functionally opposite routes.

  Deep research provenance. No deep-research report backs this entry. The
  assigned provider (falcon / Edison Scientific) returned HTTP 402 Payment
  Required — the account is out of credits — on a direct run and again on a
  `--fallback` run; the recorded fallback then selected claude_code, which
  failed with exit code 1. No other provider has credentials configured in this
  environment. The entry was therefore curated from primary literature
  identified by PubMed search and fetched into references_cache, which is the
  stricter path in any case: every snippet here is an exact substring of a
  reference fetched and verified locally, and none was copied from a
  provider report.

  Quotation artifacts. Several snippets from PMID:37606373 are taken from the
  cached full text rather than the abstract, and the cached PDF extraction
  contains ligature and spacing artifacts ("coor dination", "identi ﬁed",
  "attention-de ﬁcit/"). These are preserved verbatim in the snippets because a
  snippet must be an exact substring of its source; they are not transcription
  errors introduced here. One consequence is that "prednisolone" cannot be
  quoted at all from the ACTH-response sentence, because the extraction splits
  it across a line-break hyphen; the drug is therefore carried in the treatment
  description and therapeutic_agent instead of in a snippet.

  Subunit spelling across sources. Snippets in this entry render the GABA-A
  alpha-1 subunit both as "alpha1" and as "α1". This is not an inconsistency
  introduced here: PMID:32047208 spells it "alpha1" in its own text while
  PMID:25447232 spells it "α1", and each snippet is an exact substring of the
  paper it cites. Normalizing either spelling would break exact-quote
  validation.

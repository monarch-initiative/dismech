- name: Disrupted Excitation-Inhibition Balance in the Developing Brain
  description: >-
    Whether inhibition is reduced (loss-of-function variants) or its timing and
    sensitivity are distorted (gain-of-function variants), the shared
    consequence is a shift in the balance of excitation and inhibition in
    maturing cortical and thalamocortical circuits. The developmental timing
    matters: alpha-1 expression rises steeply over the first postnatal years, so
    the imbalance is imposed on circuits that are still being assembled, and
    GABAergic signaling is itself one of the signals shaping that assembly. This
    is why the outcome is an encephalopathy — a disorder of development — rather
    than seizures alone.

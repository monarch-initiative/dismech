    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Missense variants in the extracellular domain and small transmembrane
      loops (for example p.Arg214Cys) are uniformly loss-of-function. Clinically
      they produce a more homogeneous and milder picture — infantile-onset focal
      seizures with fever sensitivity, posterior epileptiform discharges and mild
      cognitive impairment — with a generally favorable outcome. A subset of
      pore-forming transmembrane-helix variants is also loss-of-function but
      clinically more severe.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists for DEE19. The
    published evidence base consists of gene-panel and exome cohorts and
    international case series of tens of patients — 16 novel probands in the
    first phenotypic-spectrum series, 27 individuals in the largest functional
    cohort, and 5 de novo variants found by screening 671 patients with
    infantile epilepsy — which delineate the phenotype but cannot support a
    population rate. The prevalence_class is therefore recorded as the
    qualitative ULTRA_RARE tier rather than a numeric Orphanet band.
  evidence:
  - reference: PMID:26918889
    reference_title: "De novo GABRA1 mutations in Ohtahara and West syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 526 and 145 patients with infantile epilepsy were analyzed by whole-exome sequencing and GABRA1-targeted resequencing, respectively.
    explanation: >-
      Establishes the denominator of the largest targeted screen (671 patients
      with infantile epilepsy) that yielded five de novo GABRA1 variants,
      supporting characterization of DEE19 as a rare cause of infantile epilepsy
      rather than providing a population rate.
pathophysiology:
- name: GABRA1 Variant and Alpha-1 Subunit Dysfunction
  description: >-
    The initiating lesion is a heterozygous, typically de novo variant in
    GABRA1, which encodes the alpha-1 subunit of the GABA-A receptor. GABA-A
    receptors are pentameric ligand-gated chloride channels that mediate most
    fast inhibitory neurotransmission in the mature brain; alpha-1 is the most
    abundant alpha subunit in the adult brain, and its expression rises steeply
    over the first postnatal years as it replaces the alpha-2/alpha-3 subunits
    that predominate prenatally. That developmental expression switch is why a
    variant restricted to this subunit produces an epilepsy of infancy and early
    childhood. Most pathogenic variants are missense and cluster either in the
    extracellular domain or in the pore-forming transmembrane helices, and this
    structural position — not merely the presence of a variant — determines
    phenotype severity.
  biological_scale: MOLECULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"

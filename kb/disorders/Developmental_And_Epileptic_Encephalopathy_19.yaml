genetic:
- name: GABRA1
  gene_term:
    preferred_term: GABRA1
    term:
      id: hgnc:4075
      label: GABRA1
  association: >-
    GABRA1 (5q34) encodes the alpha-1 subunit of the GABA-A receptor.
    Heterozygous, typically de novo, predominantly missense variants cause
    developmental and epileptic encephalopathy 19. The variant landscape is
    organized by structural position within the subunit: extracellular-domain and
    small-transmembrane-loop variants are loss-of-function and produce a milder
    epilepsy with generally favorable outcome, whereas pore-forming
    transmembrane-helix variants — which may be either loss-of-function or
    gain-of-function — produce the severe encephalopathic phenotype, the
    gain-of-function subset being the most severe. ClinGen classifies the
    GABRA1-epilepsy relationship as Definitive.
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal dominant (typically de novo)
    evidence:
    - reference: PMID:26918889
      reference_title: "De novo GABRA1 mutations in Ohtahara and West syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified five de novo missense GABRA1 mutations in six unrelated patients.
      explanation: >-
        Supports the dominant, predominantly de novo mode of inheritance for
        encephalopathy-causing GABRA1 variants.
  evidence:
  - reference: CGGV:assertion_60478d36-384e-4246-ba8a-730755d6f216-2024-09-03T170000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GABRA1 | HGNC:4075 | epilepsy | MONDO:0005027 | AD | Definitive"
    explanation: >-
      ClinGen Epilepsy Gene Curation Expert Panel classifies the GABRA1-epilepsy
      gene-disease relationship as Definitive.
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic and electroclinical data of 27 individuals (22 unrelated and 2 families) harboring 20 different GABRA1 variants were collected and accompanied by functional analysis of 19 variants.
    explanation: >-
      Establishes the size and design of the cohort underpinning the
      structure-function organization of the GABRA1 variant landscape.
  - reference: PMID:24623842
    reference_title: "GABRA1 and STXBP1: novel genetic causes of Dravet syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that GABRA1 and STXBP1 make a significant contribution to Dravet syndrome after SCN1A abnormalities have been excluded.
    explanation: >-
      Quantifies GABRA1's contribution to severe infantile epileptic
      encephalopathy in the SCN1A-negative population.
treatments:
- name: Broad-spectrum antiseizure pharmacotherapy
  description: >-
    Antiseizure medication is the mainstay of management. Response is strongly
    stratified by variant class: in the extracellular-domain loss-of-function
    group, most patients become seizure-free on monotherapy after an initial
    stormy phase, whereas antiseizure medications are reported to be ineffective
    in patients with gain-of-function variants and severe epilepsy. Within the
    loss-of-function group the choice of agent appears to be gene-specific,
    with levetiracetam identified as the most effective drug for GABRA1
    (as against valproate for the paralogous GABRB3). This is a cohort
    observation rather than a trial result, so it is a treatment lead and not an
    established first-line recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_mechanisms:
  - target: Neuronal Hyperexcitability and Thalamocortical Hypersynchrony
    description: >-
      Antiseizure medications act on the hyperexcitable, hypersynchronous network
      state rather than on the receptor lesion itself.
  evidence:
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6 of 11 (55%) subjects became seizure-free on
      monotherapy at an age ranging from 9 months to 6 years,
    explanation: >-
      Reports the favorable monotherapy response in the milder
      extracellular-domain subgroup, establishing that variant class predicts
      treatment response.
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, ASMs are ineffective in patients
      with GoF GABRA1 variants with severe epilepsy, and this
      was also observed for individuals harboring pathogenic
      GABRB3 variants located in the transmembrane
      domain.
    explanation: >-
      Refutes any claim that broad-spectrum antiseizure pharmacotherapy is
      reliably effective across DEE19, by stating directly that antiseizure
      medications are ineffective in the gain-of-function group with severe
      epilepsy — the group this entry is scoped to.
  - reference: PMID:37606373
    reference_title: "GABRA1-Related Disorders: From Genetic to Functional Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly the most effective treatment
      for LoF variants in GABRA1 and GABRB3 varies, with
      LEV identi ﬁed for GABRA1 individuals versus VPA in
      GABRB3.
    explanation: >-
      Identifies levetiracetam as the most effective agent in the
      loss-of-function group specifically for GABRA1, distinguishing it from the
      paralogous GABRB3 where valproate is preferred. The quoted text preserves
      the ligature artifact present in the cached source.

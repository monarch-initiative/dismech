- name: Impaired Receptor Trafficking and Surface Expression
  description: >-
    A recurring cellular consequence of GABRA1 variants is that mutant subunits
    fail to reach or be retained at the neuronal surface, so that even
    intrinsically functional receptor is under-represented at the synapse.
    Quantification of the R214C variant showed both surface and total receptor
    protein were reduced, indicating loss of the subunit pool as well as
    mislocalization. This is a distinct mechanism from altered channel gating,
    and it is the arm that pharmacological chaperone strategies target.

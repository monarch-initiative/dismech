inheritance:
- name: Autosomal dominant (typically de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    DEE19 is inherited in an autosomal dominant manner, but affected individuals
    in the encephalopathic range almost always carry a de novo heterozygous
    variant rather than an inherited one. Inherited transmission does occur and
    is concentrated at the milder end of the spectrum: in the largest functional
    cohort, the two inherited transmembrane-domain variants were specifically
    noted as the exception to the rule that transmembrane variants cause severe
    phenotypes. ClinGen's Epilepsy Gene Curation Expert Panel classifies the
    GABRA1-epilepsy relationship as Definitive with autosomal dominant
    inheritance.

name: Developmental and Epileptic Encephalopathy 19
creation_date: "2026-09-05T18:58:29Z"
category: Mendelian
description: >-
  A severe early-onset developmental and epileptic encephalopathy (DEE19,
  formerly early infantile epileptic encephalopathy 19 / EIEE19) caused by
  heterozygous, typically de novo, variants in GABRA1, which encodes the
  alpha-1 subunit of the GABA-A receptor — the pentameric ligand-gated chloride
  channel that mediates most fast inhibitory neurotransmission in the mature
  brain. Seizures usually begin in infancy, are frequently multiple in type and
  drug-resistant, and are accompanied by developmental delay, intellectual
  disability, and in the most severe cases developmental regression with
  hypsarrhythmia. The organizing mechanistic fact of this entry is that GABRA1
  is a single gene spanning a wide severity spectrum, and that position within
  the subunit predicts where on that spectrum a patient lands: variants in the
  extracellular domain and small transmembrane loops are loss-of-function and
  produce a milder, often favorable-outcome epilepsy, whereas variants in the
  pore-forming transmembrane helices — whether loss-of-function or
  gain-of-function — produce the severe early-onset encephalopathic phenotype,
  with gain-of-function variants the most severe of all. This entry is scoped to
  that encephalopathic end. The milder GABRA1-associated phenotypes at the other
  end of the same allelic spectrum — autosomal dominant juvenile myoclonic
  epilepsy and childhood absence epilepsy susceptibility, both already curated
  as separate dismech entries — are recorded here as differentials rather than
  as subtypes, because they are established idiopathic generalized epilepsy
  syndromes in their own right and not severity grades of DEE19.

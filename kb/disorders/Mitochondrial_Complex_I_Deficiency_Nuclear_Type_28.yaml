discussions:
- discussion_id: mc1dn28_slow_progression
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is NDUFA13-related complex I deficiency more slowly progressive than most
    nuclear complex I deficiencies, and why does it target the substantia nigra?
  attaches_to:
  - "pathophysiology#Destabilized Arm Junction and Complex I Instability"
  - "pathophysiology#Midbrain, Cerebellar and Basal Ganglia Energy Failure"
  rationale: >-
    Most of the 13 patients had a slow course without acute decompensations, and
    the 2025 authors raise two untested explanations: that the human alleles have
    milder functional consequences than variants in other complex I genes, or that
    NDUFA13's separate role in cell death (as GRIM-19) modifies progression. The
    near-universal substantia nigra lesions are also unexplained. Neither question
    can be settled from fibroblast data.
  proposed_experiments:
  - experiment_id: exp_mc1dn28_allele_series
    name: Quantify residual complex I for each NDUFA13 patient allele
    description: >-
      Express each reported allele in NDUFA13 knockout human cells and measure
      NDUFA13 incorporation, assembled complex I, supercomplexes and complex I
      activity, to test whether residual function explains the slow course and the
      reported difference between missense and loss-of-function genotypes.
notes: >-
  No gene-specific GeneReviews chapter exists. The Nuclear Gene-Encoded Leigh
  Syndrome Spectrum Overview (PMID:26425749) is tagged because its scope covers
  the Leigh presentation of the second family, but its cached record is a
  statement of purpose with no clinical content; phenotype frequencies come from
  the 2025 cumulative cohort of 13 patients (PMID:39963288), which includes
  follow-up of the two earlier families.

  No treatment is reported in the NDUFA13 literature, so the entry has no
  treatments block.

  NDUFA13 is also called GRIM-19, the name under which it was first studied as a
  mediator of interferon and retinoic acid induced cell death and a STAT3
  regulator. Somatic and germline GRIM-19 variants have been linked to Hurthle
  cell thyroid tumours, which MONDO records as a separate disease
  (MONDO:0011836); that tumour association is not curated here.

  description: >-
    Affected individuals are homozygous or compound heterozygous. The recurrent
    c.170G>A (R57H) allele occurs in several unrelated families and, in the three
    tested, on different haplotypes; segregation was confirmed by Sanger
    sequencing in the 2025 cohort.
  evidence:
  - reference: PMID:39963288
    reference_title: "Biallelic NDUFA13 variants lead to a neurodevelopmental phenotype with gradual neurological impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proband-only or trio exome sequencings were performed on DNA extracted from
      blood-derived leukocytes, followed by data analysis and variant filtration,
      and Sanger segregation analysis in 9 families
    explanation: >-
      Biallelic variants with segregation analysis in nine families.
  - reference: PMID:39963288
    reference_title: "Biallelic NDUFA13 variants lead to a neurodevelopmental phenotype with gradual neurological impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analysed the haplotypes of this variant in three unrelated families, and
      the results revealed no shared haplotype, indicating that this variant likely
      recurred independently.
    explanation: >-
      The recurrent homozygous allele is not a single founder.
  - reference: PMID:32722639
    reference_title: "Novel NDUFA13 Mutations Associated with OXPHOS Deficiency and Leigh Syndrome: A Second Family Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we used a next-generation sequencing (NGS) panel to identify two novel
      biallelic variants in the NADH:ubiquinone oxidoreductase subunit A13
      (NDUFA13) gene in a patient with isolated CI deficiency in skeletal muscle
    explanation: >-
      A compound heterozygous patient.
pathophysiology:
- name: Biallelic NDUFA13 Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The lesion is biallelic NDUFA13 variation: missense alleles (recurrent R57H,
    R55P, L36P, E63K in trans with R57H) and predicted loss-of-function alleles,
    including a frameshift. Patient fibroblasts show markedly reduced NDUFA13
    protein. NDUFA13 has no catalytic role; it is a structural accessory subunit
    whose transmembrane helix crosses the inner membrane at the back of the
    enzyme, where the two arms meet, and all the missense residues contact
    neighbouring subunits there.
  genes:
  - preferred_term: NDUFA13
    term:
      id: hgnc:17194
      label: NDUFA13
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function through reduced NDUFA13 protein; the recurrent R57H allele
      leaves some residual protein.
  molecular_functions:
  - preferred_term: NDUFA13 structural role at the complex I arm junction
    modifier: DECREASED
    term:
      id: GO:0005198
      label: structural molecule activity
  evidence:
  - reference: PMID:25901006
    reference_title: "Mutation in NDUFA13/GRIM19 leads to early onset hypotonia, dyskinesia and sensorial deficiencies, and mitochondrial complex I instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe the first germinal pathogenic mutation in the
      NDUFA13/GRIM19 gene encoding a CI subunit, in two sisters with early onset
      hypotonia, dyskinesia and sensorial deficiencies, including a severe optic
      neuropathy.
    explanation: >-
      The defining report.
  - reference: PMID:39963288
    reference_title: "Biallelic NDUFA13 variants lead to a neurodevelopmental phenotype with gradual neurological impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      fibroblasts in the present study showed a marked decrease in NDUFA13 protein
      as well as other CI subunits and a decrease in the assembly of the CI
      holoenzyme
    explanation: >-
      Reduced NDUFA13 protein in patient fibroblasts.
  - reference: PMID:39963288
    reference_title: "Biallelic NDUFA13 variants lead to a neurodevelopmental phenotype with gradual neurological impairment."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Here, it crosses the membrane from the matrix to IMS with one TM helix and
      interacts with many subunits, including core ND1 and NDUFS8, as well as
      accessory NDUFA3.
    explanation: >-
      Structural analysis of the human complex I cryo-EM model places NDUFA13 as
      a membrane-spanning accessory subunit that contacts core subunits, the
      basis for binding structural molecule activity.
  downstream:
  - target: Destabilized Arm Junction and Complex I Instability
    causal_link_type: DIRECT
- name: Destabilized Arm Junction and Complex I Instability
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Loss of NDUFA13 lowers the amount of assembled complex I and of the
    supercomplexes that contain it, and silencing NDUFA13 in control cells
    reproduces the defect. Protein modelling suggests that the missense variants
    loosen the interaction network at the junction of the two arms, where the
    conformational coupling between quinone reduction and proton pumping takes
    place. Mice lacking NDUFA13 entirely do not assemble complex I and die as
    embryos.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  evidence:
  - reference: PMID:25901006
    reference_title: "Mutation in NDUFA13/GRIM19 leads to early onset hypotonia, dyskinesia and sensorial deficiencies, and mitochondrial complex I instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blots disclosed that the abundances of NDUFA13 protein, CI
      holoenzyme and super complexes were drastically reduced in mitochondrial
      fractions, a situation that was reproduced by silencing NDUFA13 in control
      cells.
    explanation: >-
      Complex I and supercomplex loss in patient cells, reproduced by
      knockdown.
  - reference: PMID:32722639
    reference_title: "Novel NDUFA13 Mutations Associated with OXPHOS Deficiency and Leigh Syndrome: A Second Family Report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      markedly diminished levels of the NDUFA13 protein, CI, and respirasomes
    explanation: >-
      The same loss in fibroblasts of the second family.
  - reference: PMID:39963288
    reference_title: "Biallelic NDUFA13 variants lead to a neurodevelopmental phenotype with gradual neurological impairment."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Our protein modelling data suggest that the missense NDUFA13 variants
      reported in this study are likely to weaken the tight interaction network of
      several subunits at the critical junction between the two arms of the
      complex.
    explanation: >-
      A structural model for how missense variants destabilize the enzyme.
  - reference: PMID:15367666
    reference_title: "GRIM-19, a cell death regulatory protein, is essential for assembly and function of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, we show that elimination of GRIM-19 destroys the assembly and
      electron transfer activity of complex I and also influences the other
      complexes in the mitochondrial respiratory chain.
    explanation: >-
      Complete loss in mouse abolishes complex I assembly.
  - reference: PMID:18287540
    reference_title: "GRIM-19 is essential for maintenance of mitochondrial membrane potential."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also found that deletion of the last 10 residues affected GRIM-19's
      ability to be assembled to complex I.
    explanation: >-
      The C-terminus is needed for incorporation into complex I.

name: Mitochondrial Complex I Deficiency, Nuclear Type 28
creation_date: "2026-11-27T14:03:22Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 28 (MC1DN28) is the autosomal
  recessive complex I deficiency caused by biallelic variants in NDUFA13 (also
  called GRIM-19), an accessory subunit whose single transmembrane helix sits at
  the junction of the complex I peripheral and membrane arms and contacts ND1,
  NDUFS8 and NDUFA3. Patient variants reduce NDUFA13 protein and destabilize
  complex I, lowering the assembled holoenzyme, its supercomplexes and complex I
  activity; NDUFA13-null mouse embryos lack complex I and die at embryonic day
  9.5.
  Thirteen patients from eleven families were described by 2025. Most had an
  infantile-onset, slowly progressive neurological disease: developmental delay,
  spasticity, hypotonia, cerebellar ataxia, dyskinetic movement disorders,
  epilepsy, oculomotor abnormalities and optic atrophy, with raised lactate and a
  characteristic MRI pattern of symmetric T2 hyperintense lesions of the
  substantia nigra. The first family had a severe optic neuropathy with hearing
  loss and retinal dysfunction, and the second patient had Leigh syndrome
  lesions, a mild hypertrophic cardiomyopathy and progressive spastic
  tetraparesis. Somatic and germline GRIM-19 variants in Hurthle cell thyroid
  tumours are a separate disease and are not part of this entry.

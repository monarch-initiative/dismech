animal_models:
- name: Ndufa13 (Grim-19) knockout mouse
  species: Mouse
  genotype: Grim-19 (Ndufa13) homozygous targeted deletion
  publication: PMID:15367666
  description: >-
    Homozygous deletion is lethal at embryonic day 9.5. Knockout blastocysts grow
    poorly in culture, have abnormal mitochondria, and lack assembled, active
    complex I.
  modeled_mechanisms:
  - target: Destabilized Arm Junction and Complex I Instability
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Complete loss of the subunit abolishes complex I assembly.
    limitations: >-
      A null allele that is embryonic lethal, whereas patients carry hypomorphic
      or partial loss-of-function alleles and survive with a slowly progressive
      neurological disease; the model says nothing about the regional brain
      vulnerability.

genetic:
- name: NDUFA13
  gene_term:
    preferred_term: NDUFA13
    term:
      id: hgnc:17194
      label: NDUFA13
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  presence: PRESENT
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFA13 at 19p13.11 is the sole gene of this disorder in MONDO and OMIM.
    relationship_type is left UNKNOWN rather than CAUSATIVE because ClinGen rates
    NDUFA13 as Moderate both for Leigh syndrome (autosomal recessive, 2021) and for
    mitochondrial disease (autosomal recessive, 2024-11-18), and the schema
    reserves CAUSATIVE for Definitive or Strong. Both ClinGen records are for
    lumped MONDO terms and neither is copied into gene_disease_validity. The 2025
    cohort of nine further families with segregation data (PMID:39963288) was
    published after the 2024 ClinGen curation, so a re-curation could reach a
    higher tier.

    Alleles: recurrent c.170G>A (R57H), homozygous in the first family and in
    several of the 2025 families, on different haplotypes in the three tested;
    R55P; L36P with the frameshift c.194delT in the second family;
    E63K in trans with R57H; and predicted loss-of-function alleles including a
    splice-donor variant. A homozygous E63K patient with limb malformation,
    skeletal dysplasia and congenital glaucoma but no neurological disease was
    treated by the 2025 authors as an outlier, possibly a hypomorphic allele, and
    is not included here. A 2025 report of a patient with both PGM1-CDG and
    NDUFA13 complex I deficiency (PMID:40358162) is not used as phenotype
    evidence because the two disorders overlap.
  evidence:
  - reference: PMID:25901006
    reference_title: "Mutation in NDUFA13/GRIM19 leads to early onset hypotonia, dyskinesia and sensorial deficiencies, and mitochondrial complex I instability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe the first germinal pathogenic mutation in the
      NDUFA13/GRIM19 gene encoding a CI subunit, in two sisters with early onset
      hypotonia, dyskinesia and sensorial deficiencies, including a severe optic
      neuropathy.
    explanation: >-
      The defining report.
  - reference: PMID:39963288
    reference_title: "Biallelic NDUFA13 variants lead to a neurodevelopmental phenotype with gradual neurological impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 10 additional affected individuals from nine independent families,
      identifying four missense variants (including recurrent c.170G > A) and three
      ultra-rare or novel predicted loss-of-function biallelic variants.
    explanation: >-
      Nine further families.
  - reference: PMID:32722639
    reference_title: "Novel NDUFA13 Mutations Associated with OXPHOS Deficiency and Leigh Syndrome: A Second Family Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient, who represents the second family report with mutations in the
      CI NDUFA13 subunit, presented with LS lesions in brain magnetic resonance
      imaging, mild hypertrophic cardiomyopathy, and progressive spastic
      tetraparesis.
    explanation: >-
      The second family.

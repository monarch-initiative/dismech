    reference_title: C1q-targeted inhibition of the classical complement pathway prevents injury in a novel mouse model of acute motor axonal neuropathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      complement-fixing anti-ganglioside antibodies that directly bind and
      injure the axon at sites of vulnerability such as nodes of Ranvier and
      nerve terminals.
    explanation: >-
      This establishes vulnerable axonal binding sites in an AMAN model; sensory
      axon targeting in AMSAN remains unmodeled.
  downstream:
  - target: Classical Complement Activation at Axonal Membranes
    causal_link_type: DIRECT
    hypothesis_groups:
    - antiganglioside_complement_axonal_injury
    description: >-

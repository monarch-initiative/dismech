    intermediate_mechanisms:
    - Autonomic peripheral-nerve dysfunction
    hypothesis_groups:
    - antiganglioside_complement_axonal_injury
    description: >-
      Involvement of autonomic peripheral fibers can produce cardiovascular,
      gastrointestinal, and bladder dysfunction.
    evidence:
    - reference: DOI:10.1038/s41572-024-00580-4
      reference_title: Guillain-Barre syndrome
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        respiratory failure and autonomic dysfunction
      explanation: >-
        The primer supports autonomic dysfunction in severe GBS; the exact
        AMSAN frequency is unknown.

mechanistic_hypotheses:
- hypothesis_group_id: antiganglioside_complement_axonal_injury
  hypothesis_label: Antiganglioside-complement nodopathy-to-axonopathy continuum
  status: CANONICAL
  description: >-
    In the seropositive and especially C. jejuni-associated axonal GBS subset,
    molecular mimicry generates cross-reactive anti-ganglioside IgG. Antibody
    binding at nodal and axolemmal sites activates classical complement,
    producing a continuum from reversible nodal conduction failure to
    macrophage-associated irreversible motor and sensory axonal degeneration.
  evidence:
  - reference: PMID:22507308
    reference_title: A common mechanism and a new categorization for anti-ganglioside antibody-mediated neuropathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      acute motor axonal neuropathy, acute motor and sensory neuropathy and acute
      sensory neuropathy and possibly also a chronic disorder as multifocal motor
      neuropathy represent a spectrum of the same immunopathologic process.
    explanation: >-
      This synthesis supports a shared nodal-to-axonal spectrum rather than
      fully independent mechanisms for AMAN and AMSAN.
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      represent the most severe end of a spectrum of immune attack directed
      toward epitopes on the axon.
    explanation: >-
      Direct AMSAN pathology supports the severe-end-of-spectrum interpretation.
  notes: >-
    Canonical does not mean universal. Ganglioside antibodies are absent in a
    substantial fraction of GBS, viral and other antecedents remain
    mechanistically unresolved, and the sensory-axon target in AMSAN is less
    experimentally developed than the motor-axon arm.

phenotypes:
- name: Decreased Compound Muscle Action Potential Amplitude
  description: >-
    Motor nerve conduction studies show reduced or absent compound muscle action
    potential amplitudes. Serial testing is needed because reversible conduction
    failure and fixed motor-axon loss can initially appear similar.
  phenotype_term:
    preferred_term: Decreased compound muscle action potential amplitude
    term:
      id: HP:0033383
      label: Decreased compound muscle action potential amplitude
  electrophysiology:
    electrophysiology_modality: NERVE_CONDUCTION_STUDY
  evidence:
  - reference: DOI:10.1111/jns.12625
    reference_title: "Conduction slowing, conduction block and temporal dispersion in demyelinating, dysmyelinating and axonal neuropathies: Electrophysiology meets pathology"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      axonal neuropathies are simply diagnosed by reduced amplitude of motor and
      sensory nerve action potentials with normal or slightly slow conduction
      velocity.
    explanation: >-
      The conventional motor-amplitude pattern supports the finding, while the
      review and serial GBS data caution against over-simple subtype inference.
- name: Decreased Sensory Nerve Action Potential Amplitude
  description: >-
    Sensory nerve conduction studies show reduced or absent sensory nerve action
    potential amplitudes, distinguishing a motor-sensory pattern from motor-only
    AMAN when the finding is reproducible and not explained by another neuropathy.
  phenotype_term:
    preferred_term: Decreased amplitude of sensory action potentials
    term:
      id: HP:0007078
      label: Decreased amplitude of sensory action potentials
  electrophysiology:
    electrophysiology_modality: NERVE_CONDUCTION_STUDY
  evidence:
  - reference: DOI:10.1111/jns.12625
    reference_title: "Conduction slowing, conduction block and temporal dispersion in demyelinating, dysmyelinating and axonal neuropathies: Electrophysiology meets pathology"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      axonal neuropathies are simply diagnosed by reduced amplitude of motor and
      sensory nerve action potentials with normal or slightly slow conduction
      velocity.
    explanation: >-
      Reduced sensory amplitudes are part of the conventional axonal pattern;
      AMSAN classification still requires clinical context and serial testing.
- name: Limb Weakness
  description: >-
    Acute, usually symmetric, progressive flaccid weakness affects the legs and
    arms and may progress to inability to walk or complete paralysis.
  phenotype_term:
    preferred_term: Limb muscle weakness
    term:
      id: HP:0003690
      label: Limb muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      progressive flaccid limb paresis and areflexia.
    explanation: >-
      This is the hallmark motor-sensory GBS phenotype and therefore applies to
      AMSAN, without supplying an AMSAN-specific frequency.
- name: Areflexia
  description: >-
    Tendon reflexes are reduced or absent in affected limbs because the
    peripheral reflex arc is impaired.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      progressive flaccid limb paresis and areflexia.
    explanation: >-
      Areflexia is a defining GBS-wide clinical feature relevant to AMSAN.
- name: Sensory Neuropathy
  description: >-
    Objective sensory loss and abnormal sensory responses reflect involvement of
    sensory roots and peripheral sensory axons.
  phenotype_term:
    preferred_term: Sensory neuropathy
    term:
      id: HP:0000763
      label: Sensory neuropathy
  evidence:
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      axonal lesions of both motor and sensory fibers
    explanation: >-
      Direct human AMSAN autopsy confirms sensory-fiber involvement, with the
      limitation of a small fatal-case series.
- name: Paresthesia
  description: >-
    Tingling or other abnormal sensations can accompany weakness, often early in
    the illness.
  phenotype_term:
    preferred_term: Paresthesia
    term:
      id: HP:0003401
      label: Paresthesia
  evidence:
  - reference: DOI:10.3389/fneur.2023.1227505
    reference_title: Acute motor-sensory axonal polyneuropathy variant of Guillain-Barre syndrome with a thalamic lesion and COVID-19
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      weakness and paraesthesia in both her legs and arms for 4 days
    explanation: >-
      A single AMSAN case illustrates paresthesia but does not establish its
      frequency.
- name: Pain
  description: >-
    Radicular, neuropathic, and musculoskeletal pain can occur during the acute
    illness and may persist into recovery.
  phenotype_term:
    preferred_term: Pain
    term:
      id: HP:0012531
      label: Pain
  evidence:
  - reference: PMID:39687605
    reference_title: Pain determinants and quality of life in Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pain is a serious manifestation in both the acute and chronic stages of
      Guillain-Barre syndrome
    explanation: >-
      This prospective GBS cohort supports pain and reports an association with
      axonal GBS, but does not give an AMSAN-specific rate.
- name: Dysphagia
  description: >-
    Bulbar and cranial motor involvement can impair swallowing and increase
    aspiration risk.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: DOI:10.3389/fneur.2023.1227505
    reference_title: Acute motor-sensory axonal polyneuropathy variant of Guillain-Barre syndrome with a thalamic lesion and COVID-19
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dysarthria, dysphagia, bilateral facial paralysis, facial diplegia
    explanation: >-
      This case documents dysphagia during AMSAN progression; it is illustrative
      rather than frequency evidence.
- name: Respiratory Insufficiency
  description: >-
    Severe motor weakness can involve respiratory muscles and require invasive
    ventilation even before prominent dyspnea is reported.
  phenotype_term:
    preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The most severely affected patients also develop respiratory failure and
      autonomic dysfunction
    explanation: >-
      GBS-wide evidence supports the severe complication; no AMSAN-specific
      frequency is asserted.
- name: Autonomic Dysfunction
  description: >-
    Dysautonomia can manifest as heart-rate or blood-pressure instability,
    gastrointestinal dysmotility, or bladder dysfunction.
  phenotype_term:
    preferred_term: Abnormality of the autonomic nervous system
    term:
      id: HP:0002270
      label: Abnormality of the autonomic nervous system
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      respiratory failure and autonomic dysfunction
    explanation: >-
      The current GBS primer supports dysautonomia in severe disease; the
      applicability is GBS-wide rather than AMSAN-specific.

biochemical:
- name: Albuminocytologic Dissociation
  presence: Supportive when present
  context: >-
    Elevated CSF protein with a normal or near-normal white-cell count supports
    GBS but neither confirms the diagnosis nor determines the AMSAN subtype. A
    normal protein level early in the illness does not exclude GBS.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      albumino-cytological dissociation, in which CSF protein levels are raised
      (>0.45 g/l) with a normal white cell count
    explanation: >-
      The primer defines the supportive CSF pattern across GBS.
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      patients can have normal CSF protein levels in the first week of disease
      onset, which does not exclude the diagnosis of GBS
    explanation: >-
      This prevents early normal CSF protein from being used to exclude AMSAN.
- name: Anti-GM1, Anti-GM1b, and Anti-GD1a IgG
  presence: Associated in a subset
  context: >-
    These antibodies support a shared AMAN/AMSAN immune spectrum in some
    patients but are not required, are not sufficiently sensitive to establish
    AMSAN, and should not replace serial electrodiagnostic assessment.
  evidence:
  - reference: PMID:10526194
    reference_title: Acute motor axonal neuropathy and acute motor-sensory axonal neuropathy share a common immunological profile.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients with AMSAN had anti-GM1, anti-GM1b, and anti-GD1a IgG
      antibodies
    explanation: >-
      The small human AMSAN series directly supports association, not diagnostic
      sensitivity or universal presence.
- name: Neurofilament Light Chain
  presence: Higher levels associated with poorer GBS outcome
  context: >-
    Serum or plasma NfL reflects neuroaxonal injury and is an emerging
    prognostic/pharmacodynamic biomarker in GBS. It has not been validated as an
    AMSAN diagnostic test.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      high levels of neurofilament light chain (NfL)
    explanation: >-
      The primer lists high NfL among GBS poor-prognosis associations; this is
      not AMSAN-specific validation.

environmental:
- name: Campylobacter jejuni infection
  influences_mechanisms:
  - target: Campylobacter LOS-Ganglioside Molecular Mimicry
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Antecedent enteritis supplies the sialylated lipooligosaccharide this
      node is built around, with the anti-GM1 and anti-GD1a response as the
      named intervening step. Both evidence items keep the partial grade this
      entry already assigned them, because neither isolates an effect size for
      this axonal subtype as opposed to the syndrome at large.
    evidence:
    - reference: DOI:10.1038/s41572-024-00580-4
      reference_title: "Guillain–Barré syndrome"
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "patients with C. jejuni infection have anti-GM1 and anti-GD1a antibodies and are susceptible to developing motor and axonal forms of GBS"
      explanation: >-
        Connects the antecedent infection to anti-GM1 and anti-GD1a antibodies
        and to motor and axonal forms, which is this node's mimicry route.
    - reference: DOI:10.1002/ana.410390105
      reference_title: "Pathology of the motor‐sensory axonal Guillain‐Barré syndrome"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "High titers of antibodies recognizing C. jejuni, consistent with recent infection, were found in the 2 patients tested."
      explanation: >-
        Autopsy-confirmed cases of this subtype carried serology for recent C.
        jejuni infection, though only two selected fatal cases were tested.
  presence: Established antecedent for an axonal GBS subset
  description: >-
    Antecedent C. jejuni enteritis is the best-defined trigger for the
    ganglioside-mimicry mechanism and is associated with motor and axonal GBS
    patterns. GBS-wide risk estimates must not be read as AMSAN-specific risk.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      patients with C. jejuni infection have anti-GM1 and anti-GD1a antibodies
      and are susceptible to developing motor and axonal forms of GBS
    explanation: >-
      The primer connects the antecedent to axonal GBS but does not isolate an
      AMSAN-specific effect size.
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High titers of antibodies recognizing C. jejuni, consistent with recent
      infection, were found in the 2 patients tested.
    explanation: >-
      Direct AMSAN pathology cases had serologic evidence of recent infection,
      but only two selected fatal cases were tested.
- name: SARS-CoV-2 infection
  presence: Reported temporal antecedent
  description: >-
    AMSAN has been reported after SARS-CoV-2 infection. Current evidence here is
    a case-level temporal association and does not establish a causal trigger or
    population risk.
  evidence:
  - reference: DOI:10.3389/fneur.2023.1227505
    reference_title: Acute motor-sensory axonal polyneuropathy variant of Guillain-Barre syndrome with a thalamic lesion and COVID-19
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A nasopharyngeal swab for SARS-CoV-2 returned positive.
    explanation: >-
      A single AMSAN case establishes co-occurrence and temporal context only.


animal_models:
- species: Oryctolagus cuniculus
  category: Active-immunization axonal GBS model
  description: >-
    Rabbits sensitized with bovine brain ganglioside mixture or purified GM1
    developed anti-GM1 IgG, acute monophasic flaccid weakness, and
    Wallerian-like peripheral-nerve degeneration without lymphocytic infiltration
    or demyelination. This models motor-predominant axonal GBS and does not
    validate sensory-inclusive AMSAN.
  associated_phenotypes:
  - Acute flaccid limb weakness
  - Wallerian-like peripheral axonal degeneration
  evidence:
  - reference: PMID:11409422
    reference_title: Animal model of axonal Guillain-Barre syndrome induced by sensitization with GM1 ganglioside.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pathological findings for the peripheral nerves showed predominant
      Wallerian-like degeneration, with neither lymphocytic infiltration nor
      demyelination.
    explanation: >-
      The rabbit model reproduces acute axonal injury but does not demonstrate
      sensory-axon disease equivalent to AMSAN.
- species: Oryctolagus cuniculus
  category: Campylobacter LOS molecular-mimicry model
  description: >-
    Rabbits immunized with ganglioside-mimicking C. jejuni LOS developed
    anti-GM1 IgG, flaccid weakness, and GBS-like peripheral-nerve pathology.
    This provides causal molecular-mimicry evidence but is not a validated AMSAN

    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      On sensitization with C. jejuni lipooligosaccharide, rabbits developed
      anti-GM1 IgG antibody and flaccid limb weakness.
    explanation: >-
      The experiment directly links LOS mimicry to antibody and weakness, with
      motor-predominant rather than AMSAN fidelity.
- species: Mus musculus
  genotype: Neuron-restricted complex ganglioside expression
  category: Anti-GM1 complement-mediated AMAN model
  description: >-
    A transgenic mouse system restricts complex ganglioside expression to

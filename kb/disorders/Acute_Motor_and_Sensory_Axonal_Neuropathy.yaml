discussions:
- discussion_id: interp_amsan_stable_subtype_or_axonal_spectrum
  prompt: >-
    Is AMSAN a stable mechanistically distinct subtype, or does it often
    represent the severe motor-sensory end of a dynamic nodopathy-to-axonopathy
    spectrum shared with AMAN and other GBS patterns?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Reversible Nodal Conduction Failure
  - pathophysiology#Motor and Sensory Axonal Degeneration
  rationale: >-
    Fatal pathology supports genuine motor and sensory axonal destruction, but
    serial NCS shows frequent bidirectional subtype changes and no added value
    from electrodiagnostic subtyping. Resolving which patients have reversible
    nodal failure versus fixed sensory and motor axon loss matters more than a
    single early label.
  evidence:
  - reference: PMID:41656826
    reference_title: Dynamics of Nerve Conduction Studies in Patients With Guillain-Barre Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the electrodiagnostic subtype changed on serial NCS in 37.8% (Hadden) and
      44.7% (Rajabally).
    explanation: >-
      Frequent reclassification directly motivates the stability question.
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      represent the most severe end of a spectrum of immune attack directed
      toward epitopes on the axon.
    explanation: >-
      Human pathology explicitly advances the spectrum interpretation.
  proposed_experiments:
  - experiment_id: exp_amsan_serial_ncs_biomarker_trajectory
    name: Prospective AMSAN-enriched serial electrophysiology and biomarker study
    description: >-
      Enroll early motor-sensory GBS before definitive subtyping; obtain
      standardized NCS/EMG at baseline, 2-3 weeks, and recovery, with blinded
      classification by multiple criteria, ganglioside-antibody profiling,
      complement activity, NfL, and motor, sensory, autonomic, and functional
      outcomes. Test whether fixed low CMAP/SNAP trajectories separate from
      reversible nodal-failure trajectories and outperform the initial subtype
      label for prognosis.
    decision_criterion: >-
      A stable AMSAN entity is supported if combined motor-sensory axonal
      trajectories remain reproducible across criteria and time and predict
      outcomes independently; frequent migration with biomarker-defined nodal
      recovery supports a continuum model.
    would_support:
    - pathophysiology#Reversible Nodal Conduction Failure
    - pathophysiology#Motor and Sensory Axonal Degeneration
- discussion_id: gap_seronegative_amsan_antigens
  prompt: >-
    What immune targets and effector mechanisms drive clinically compatible
    AMSAN when standard anti-ganglioside antibodies are absent?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cross-Reactive Anti-Ganglioside IgG Response
  rationale: >-
    Ganglioside antibodies occur in only a subset of GBS, and routine testing has
    limited clinical value. Treating the canonical GM1/GD1a mechanism as
    universal would erase seronegative disease and mechanisms following non-C.
    jejuni antecedents.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Whether ganglioside-seronegative patients have other antibodies relevant
      to GBS is currently unclear.
    explanation: >-
      The primer directly identifies the unresolved antigen problem.
  proposed_experiments:
  - experiment_id: exp_seronegative_amsan_unbiased_antigen_screen
    name: Unbiased seronegative AMSAN neural-surface antigen discovery
    description: >-
      Screen acute serum and CSF from serially confirmed seronegative AMSAN
      against live human motor-neuron, sensory-neuron, and Schwann-cell nodal
      cultures, followed by immunoprecipitation-mass spectrometry, antigen
      validation, complement-deposition assays, and longitudinal titer-outcome
      analysis with GBS-subtype and healthy controls.
    decision_criterion: >-
      A candidate is prioritized if disease-phase IgG binds a reproducible neural
      surface target, deposits complement or disrupts conduction, declines with
      recovery, and is enriched over control groups.
    would_support:
    - pathophysiology#Ganglioside Antibody Binding at Nodal and Axolemmal Membranes
- discussion_id: mismatch_motor_only_models_for_sensory_inclusive_amsan
  prompt: >-
    Do current anti-GM1/anti-GD1a motor-axon models reproduce the sensory-axon
    injury that defines human AMSAN?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Classical Complement Activation at Axonal Membranes
  - pathophysiology#Motor and Sensory Axonal Degeneration
  rationale: >-
    Existing rabbit, transgenic-mouse, and ex vivo systems convincingly model
    motor-axon antibody/complement injury. Direct human AMSAN pathology instead
    shows dorsal as well as ventral root injury. A sensory-inclusive model is
    needed before subtype-specific mechanism or therapeutic claims are made.
  evidence:
  - reference: PMID:26936605
    reference_title: C1q-targeted inhibition of the classical complement pathway prevents injury in a novel mouse model of acute motor axonal neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      new in vivo transgenic mouse model of AMAN
    explanation: >-
      The model is explicitly AMAN rather than AMSAN.
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      wallerian-like degeneration of fibers in the ventral and dorsal roots
    explanation: >-
      Human AMSAN pathology requires a model capable of both motor and sensory
      injury.
  proposed_experiments:
  - experiment_id: exp_paired_human_motor_sensory_nodal_injury
    name: Paired human motor- and sensory-neuron nodal injury assay
    description: >-
      Build matched human iPSC-derived motor-neuron and sensory-neuron systems
      with Schwann-cell myelination and mature nodal domains. Expose both to
      acute serially confirmed AMSAN IgG with human complement; comparator
      conditions should include heat-inactivated complement, healthy, AMAN,
      AIDP, antigen-depleted, and C1q-inhibited controls. Measure
      antibody/C1q/C3/MAC deposition, conduction,
      calcium influx, axonal integrity, and sensory-versus-motor susceptibility.
    decision_criterion: >-
      A sensory-inclusive model is established if AMSAN IgG causes reproducible
      complement-dependent injury in both compartments, whereas AMAN IgG remains
      motor-predominant and antigen depletion or C1q blockade rescues injury.
    would_support:
    - pathophysiology#Classical Complement Activation at Axonal Membranes
    - pathophysiology#Motor and Sensory Axonal Degeneration
- discussion_id: resolved_nonbeneficial_routine_escalation
  prompt: >-
    Should poor predicted prognosis or initial non-response prompt routine
    corticosteroids, a second IVIG course, or immediate plasma exchange followed
    by IVIG?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - disease#Acute Motor and Sensory Axonal Neuropathy
  rationale: >-
    These regimens can be mistaken for positive treatment options if represented
    as ordinary treatment nodes. Current guideline and randomized evidence do
    not support routine use for poor prognosis or initial non-response.
  evidence:
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      recommends against using oral corticosteroids, and weakly recommends
      against using IV corticosteroids
    explanation: >-
      The guideline directly recommends against corticosteroid therapy.
  - reference: PMID:33743237
    reference_title: Second intravenous immunoglobulin dose in patients with Guillain-Barre syndrome with poor prognosis (SID-GBS) a double-blind, randomised, placebo-controlled trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a second intravenous immunoglobulin course should not be considered for
      treatment of Guillain-Barre syndrome because of a poor prognosis.
    explanation: >-
      The randomized SID-GBS trial found no benefit and more serious adverse
      events.
  - reference: PMID:9014908
    reference_title: Randomised trial of plasma exchange, intravenous immunoglobulin, and combined treatments in Guillain-Barre syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of PE with IVIg did not confer a significant advantage.
    explanation: >-
      The randomized comparison found no significant advantage for the immediate
      combination.
  posed_date: "2026-07-18T00:35:23Z"
  resolved_date: "2026-07-18T00:35:23Z"
  resolution_note: >-
    Do not represent these regimens as routine beneficial AMSAN treatments.
    True treatment-related fluctuation after stabilization or improvement is a
    separate scenario in which specialist-guided re-treatment may be considered.

notes: >-
  AMSAN is an acquired immune-mediated GBS pattern; no dummy negative genetic
  assertion is included. No AMSAN-specific population prevalence, randomized
  treatment trial, validated sensory-inclusive animal model, or stable early
  electrodiagnostic boundary was identified. Most management, progression,
  prognosis, and complication evidence is therefore explicitly marked as
  GBS-wide PARTIAL evidence. Review articles and guidelines are classified as
  OTHER; primary patient cohorts, pathology, and trials as HUMAN_CLINICAL;
  whole-animal experiments as MODEL_ORGANISM; and the ex vivo nerve-muscle assay
  as IN_VITRO.


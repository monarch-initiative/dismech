diagnosis:
- name: Clinical GBS Syndrome Assessment
  description: >-
    Establish the clinical syndrome first: progressive weakness of arms and
    legs, reduced or absent reflexes, and progression no longer than four weeks,
    with compatible sensory, cranial, autonomic, respiratory, pain, and
    antecedent-infection features. AMSAN is not diagnosed by a biomarker alone.
  diagnosis_term:
    preferred_term: Diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A compatible acute motor-sensory GBS syndrome; atypical findings trigger
    evaluation for mimics.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Progressive weakness of arms and legs
    explanation: >-
      The 2024 primer reproduces the guideline's required motor-sensory GBS
      features; AMSAN classification is a subsequent electrophysiologic step.
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Absent or decreased tendon reflexes in affected limbs
    explanation: >-
      Reduced reflexes are a required clinical feature in the guideline-based
      motor-sensory GBS criteria.
- name: Serial Nerve Conduction Studies and Electromyography
  description: >-
    NCS/EMG supports poly(radiculo)neuropathy and the motor-sensory axonal
    pattern: reduced CMAP and SNAP amplitudes without primary demyelinating
    criteria. Early studies may be normal or equivocal. Repeat testing is
    appropriate, and a single early subtype label should not be treated as
    immutable or as a treatment selector.
  diagnosis_term:
    preferred_term: Nerve conduction study
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  results: >-
    Reproducible motor and sensory axonal abnormalities; classification may
    change on serial studies.
  evidence:
  - reference: PMID:41656826
    reference_title: Dynamics of Nerve Conduction Studies in Patients With Guillain-Barre Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the electrodiagnostic subtype changed on serial NCS in 37.8% (Hadden) and
      44.7% (Rajabally).
    explanation: >-
      The 469-patient serial-NCS analysis quantifies substantial early subtype
      instability.
  - reference: PMID:41656826
    reference_title: Dynamics of Nerve Conduction Studies in Patients With Guillain-Barre Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If these early NCS are non-diagnostic, repeating the study should be
      considered. Electrodiagnostic subtyping offers no additional value.
    explanation: >-
      The study supports prompt NCS, repeat testing when needed, and restraint in
      assigning independent prognostic or treatment value to the subtype label.
- name: Cerebrospinal Fluid Analysis
  description: >-
    CSF cell count and protein help support GBS and identify mimics. Elevated
    protein with a normal cell count is supportive but may be absent early;
    marked pleocytosis argues for infectious, malignant, or inflammatory
    alternatives. CSF cannot determine AMSAN.
  diagnosis_term:
    preferred_term: Cerebrospinal fluid analysis
    term:
      id: NCIT:C173272
      label: CSF Analysis
  results: >-
    Albuminocytologic dissociation may support GBS; early normal protein does not
    exclude it, and pleocytosis requires explanation.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      increased CSF protein levels were found in <50% of patients at 1 day and
      in >80% at >1 week after onset of weakness
    explanation: >-
      The time dependence shows why CSF protein cannot confirm or exclude early
      GBS and does not subtype AMSAN.
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      CSF pleocytosis (>50 cells/microl) in general is atypical and should alert
      clinicians to consider other differential diagnoses
    explanation: >-
      Marked pleocytosis should redirect the workup toward mimics.
- name: Anti-Ganglioside Antibody Testing as a Limited Adjunct
  description: >-
    Anti-GM1, anti-GM1b, or anti-GD1a IgG can support the biological context in
    selected cases or research but is neither required nor sufficiently
    sensitive for AMSAN diagnosis. Negative testing does not exclude AMSAN, and
    routine testing has limited value in typical motor-sensory GBS.
  diagnosis_term:
    preferred_term: Serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    A positive result may support an axonal GBS immune profile; a negative result
    is nondiagnostic.
  evidence:
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      testing for anti-ganglioside antibodies is of limited clinical value in
      most patients with typical motor-sensory GBS
    explanation: >-
      The guideline directly limits routine diagnostic use in the clinical
      pattern that includes AMSAN.

differential_diagnoses:
- name: Acute Motor Axonal Neuropathy
  description: >-
    AMAN is the motor-only axonal GBS pattern and shares anti-GM1/GD1a biology
    with AMSAN. Preserved sensory examination and sensory nerve action
    potentials favor AMAN, while reproducible sensory abnormalities favor AMSAN.
  disease_term:
    preferred_term: acute motor axonal neuropathy
    term:
      id: MONDO:0020349
      label: acute motor axonal neuropathy
  distinguishing_features:
  - Sensory loss and reduced sensory responses are absent in the motor-only pattern.
  - Serial NCS is required because early classifications can change.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sensory loss is also present in the predominant motor-sensory form but
      absent in the motor form.
    explanation: >-
      This directly states the clinical sensory distinction between motor-only
      and motor-sensory GBS patterns.
- name: Acute Inflammatory Demyelinating Polyradiculoneuropathy
  description: >-
    AIDP is the primary demyelinating GBS pattern. Demyelinating slowing,
    temporal dispersion, prolonged distal latencies, and conduction block with
    evolution distinct from reversible nodal failure favor AIDP over AMSAN.
  disease_term:
    preferred_term: acute inflammatory demyelinating polyradiculoneuropathy
    term:
      id: MONDO:0020347
      label: acute inflammatory demyelinating polyradiculoneuropathy
  distinguishing_features:
  - Primary demyelinating rather than low-amplitude motor-sensory axonal pattern.
  - Serial studies help separate remyelinating block from reversible nodal failure.
  evidence:
  - reference: PMID:22480600
    reference_title: "Electrodiagnostic criteria for Guillain-Barre syndrome: a critical revision and the need for an update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serial electrophysiological studies are mandatory for proper diagnosis of
      GBS subtypes
    explanation: >-
      The review explains why longitudinal electrodiagnosis is necessary to
      distinguish demyelinating and axonal patterns.
- name: Acute-Onset Chronic Inflammatory Demyelinating Polyradiculoneuropathy
  description: >-
    A-CIDP can resemble GBS initially but becomes more likely with progression
    or relapse beyond the expected monophasic window.
  disease_term:
    preferred_term: chronic inflammatory demyelinating polyradiculoneuropathy
    term:
      id: MONDO:0006702
      label: chronic inflammatory demyelinating polyradiculoneuropathy
  distinguishing_features:
  - Continued progression or deterioration after eight weeks.
  - Three or more treatment-related fluctuations or a chronic relapsing course.
  evidence:
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      acute-onset chronic inflammatory demyelinating polyradiculoneuropathy
      (A-CIDP) should be considered if progression continues after 8 weeks from
      onset
    explanation: >-
      The guideline gives the key temporal discriminator.
- name: Critical Illness Polyneuropathy or Myopathy
  description: >-
    Critical-illness neuropathy/myopathy produces weakness and an axonal NCS
    pattern during prolonged severe illness or ventilation and can confound an
    ICU diagnosis of AMSAN.
  disease_term:
    preferred_term: critical illness polyneuropathy
    term:
      id: MONDO:0001957
      label: critical illness polyneuropathy
  distinguishing_features:
  - Begins in the setting of prolonged critical illness or ventilation.
  - EMG may show myopathic features; sensory studies help separate pure myopathy.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prolonged illness or ventilation NCS: axonal neuropathy with or without
      myopathic features on EMG
    explanation: >-
      The GBS differential table states the context and electrodiagnostic
      discriminator.
- name: Acute Porphyria
  description: >-
    Acute hepatic porphyria can cause an acute motor-predominant axonal
    neuropathy with autonomic and psychiatric symptoms that resembles GBS.
  disease_term:
    preferred_term: acute intermittent porphyria
    term:
      id: MONDO:0008294
      label: acute intermittent porphyria
  distinguishing_features:
  - Abdominal pain, psychiatric symptoms, dysautonomia, or family history.
  - Elevated urinary porphobilinogen during an attack.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Family history, concomitant psychiatric symptoms and abdominal pain
    explanation: >-
      The primer lists the clinical clues that distinguish porphyria from GBS.
- name: Transverse Myelitis or Other Spinal Cord Disease
  description: >-
    Acute spinal cord inflammation can cause rapidly progressive limb weakness
    and sensory symptoms but localizes to the central nervous system.
  disease_term:
    preferred_term: transverse myelitis
    term:
      id: MONDO:0021553
      label: transverse myelitis
  distinguishing_features:
  - A sensory level, brisk reflexes, extensor plantar responses, or sphincter-predominant onset.
  - Spinal MRI shows an intramedullary lesion.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Transverse myelitis Sensory level, brisk reflexes MRI spine: hyperintense
      lesion
    explanation: >-
      The GBS differential table supplies the localization and imaging clues.
- name: Botulism
  description: >-
    Botulism can progress rapidly with weakness and dysautonomia but is a
    presynaptic neuromuscular-junction disorder rather than an axonal
    polyradiculoneuropathy.
  disease_term:
    preferred_term: botulism
    term:
      id: MONDO:0005498
      label: botulism
  distinguishing_features:
  - Pupillary abnormalities and descending rather than ascending paralysis.
  - Incremental response on rapid repetitive nerve stimulation and toxin detection.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rapid progression, pupillary abnormalities, dysautonomia, descending
      paralysis
    explanation: >-
      The table identifies the characteristic botulism pattern.
- name: Thiamine Deficiency Neuropathy
  description: >-
    Severe nutritional thiamine deficiency can cause an acute axonal neuropathy
    that resembles AMSAN.
  distinguishing_features:
  - Malnutrition, hyperemesis, alcohol exposure, or Wernicke encephalopathy.
  - Abnormal thiamine indices and an axonal NCS pattern without the typical GBS context.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Precipitating factors (for example, hyperemesis gravidarum, alcoholism,
      nutritional deficiency)
    explanation: >-
      The primer identifies the exposure context that separates thiamine
      deficiency from immune-mediated GBS.

treatments:
- name: Intravenous Immunoglobulin
  action_category: THERAPEUTIC
  description: >-
    IVIG is one of two established immune treatments for GBS. The guideline
    regimen is 0.4 g/kg daily for five days, generally started within two weeks
    of weakness onset in a patient unable to walk unaided; selected patients may
    be treated at two to four weeks. Evidence and recommendations are GBS-wide,
    not AMSAN-specific.
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: Human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_phenotypes:
  - preferred_term: Limb muscle weakness
    term:
      id: HP:0003690
      label: Limb muscle weakness
  evidence:
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      TF recommends intravenous immunoglobulin (IVIg) 0.4 g/kg for 5 days
    explanation: >-
      The guideline establishes the regimen for non-ambulatory GBS. No
      randomized AMSAN-specific efficacy evidence was identified.
  notes: >-
    IVIG and plasma exchange are alternatives rather than a routine immediate
    sequence. Poor predicted prognosis alone is not an indication for a second
    IVIG course. A true treatment-related fluctuation after initial stabilization
    or improvement is a separate clinical situation requiring specialist review.
- name: Plasma Exchange
  action_category: THERAPEUTIC
  description: >-
    Plasma exchange is an established alternative first-line immune treatment
    for GBS. The guideline regimen is 12-15 L in four to five exchanges over one
    to two weeks, generally within four weeks of weakness onset when the patient
    cannot walk unaided. It is not routine rescue immediately after IVIG.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_phenotypes:
  - preferred_term: Limb muscle weakness
    term:
      id: HP:0003690
      label: Limb muscle weakness
  evidence:
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      a course of plasma exchange (PE) 12-15 L in four to five exchanges over
      1-2 weeks
    explanation: >-
      The guideline establishes the standard GBS regimen; no randomized
      AMSAN-specific treatment comparison was identified.
  notes: >-
    Treatment choice between IVIG and plasma exchange depends on timing,
    contraindications, access, and clinical context. Immediate PE followed by
    IVIG does not improve outcome over either treatment alone.
- name: Respiratory, Swallowing, and Autonomic Monitoring
  action_category: MONITORING
  description: >-
    All hospitalized patients require repeated respiratory assessment because
    dyspnea can be absent despite declining vital capacity. Monitoring also
    includes cough and swallow safety, heart rate, blood pressure, rhythm, bowel
    and bladder function, strength, and GBS disability. Rapid deterioration,
    bulbar weakness, dysautonomia, or adverse mEGRIS should lower the threshold
    for intensive-care transfer.
  treatment_term:
    preferred_term: Pulmonary function testing
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  evidence:
  - reference: PMID:31541214
    reference_title: Diagnosis and management of Guillain-Barre syndrome in ten steps.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Respiratory function should be monitored in all patients
    explanation: >-
      Consensus guidance supports proactive respiratory monitoring across GBS,
      including AMSAN.
  - reference: PMID:31541214
    reference_title: Diagnosis and management of Guillain-Barre syndrome in ten steps.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      patients should be monitored for swallowing and coughing difficulties.
    explanation: >-
      Bulbar monitoring is part of GBS supportive care and is relevant to severe
      AMSAN.
  notes: >-
    Standard inpatient prevention also addresses aspiration, venous thrombosis,
    pressure injury, infection, corneal injury in facial weakness, contracture,
    nutrition, communication, and psychological distress.
- name: Mechanical Ventilation
  action_category: THERAPEUTIC
  description: >-
    Invasive ventilation is supportive therapy for respiratory failure. It does
    not modify the immune attack, so respiratory monitoring and timely airway
    planning remain essential.
  treatment_term:
    preferred_term: Artificial respiration
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  evidence:
  - reference: DOI:10.1007/s12028-023-01707-3
    reference_title: Guidelines for Neuroprognostication in Adults with Guillain-Barre Syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      10-30% require mechanical ventilation during the acute phase of the disease.
    explanation: >-
      The GBS-wide guideline supports ventilation as a common severe-disease
      requirement without assigning this rate to AMSAN.
- name: Multidisciplinary Rehabilitation
  action_category: THERAPEUTIC
  description: >-
    Rehabilitation should begin during hospitalization and continue after
    discharge as needed. Physical and occupational therapy, graded mobility and
    strengthening, positioning and contracture prevention, speech/swallow care,
    respiratory therapy, assistive devices, and psychosocial support are tailored
    to weakness, sensory loss, fatigue, pain, and bulbar or respiratory deficits.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_phenotypes:
  - preferred_term: Limb muscle weakness
    term:
      id: HP:0003690
      label: Limb muscle weakness
  - preferred_term: Sensory neuropathy
    term:
      id: HP:0000763
      label: Sensory neuropathy
  - preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:31541214
    reference_title: Diagnosis and management of Guillain-Barre syndrome in ten steps.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Start rehabilitation programme early
    explanation: >-
      Consensus guidance supports multidisciplinary rehabilitation; controlled
      AMSAN-specific rehabilitation evidence is not available.
- name: Pain Management
  action_category: THERAPEUTIC
  description: >-
    Neuropathic, radicular, and nociceptive pain should be assessed repeatedly
    and treated while accounting for respiratory and autonomic vulnerability.
    The guideline weakly supports gabapentinoids, tricyclic antidepressants, or
    carbamazepine; drug choice and dose require individualized safety review.
  treatment_term:

    - Nodal and paranodal membrane disruption
    - Terminal complement complex formation and calcium influx
    hypothesis_groups:
    - antiganglioside_complement_axonal_injury
    description: >-
      Complement-mediated nodal membrane dysfunction can block conduction before
      irreversible axonal loss occurs.
    evidence:
    - reference: PMID:22507308
      reference_title: A common mechanism and a new categorization for anti-ganglioside antibody-mediated neuropathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        complement mediated dysfunction and disruption of the nodes of Ranvier
        which causes a pathophysiological continuum from early reversible
        conduction failure to axonal degeneration.
      explanation: >-
        The review explicitly links complement-mediated nodal disruption to the

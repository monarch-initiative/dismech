name: Acute Motor and Sensory Axonal Neuropathy
creation_date: "2026-05-07T23:29:25Z"
categories:
- Autoimmune Disease
- Peripheral Neuropathy
- Rare Disease
- Neurologic Disease
parents:
- Guillain-Barre Syndrome
- Peripheral Neuropathy
disease_term:
  preferred_term: Acute motor and sensory axonal neuropathy
  term:
    id: MONDO:0020348
    label: acute motor and sensory axonal neuropathy
description: >-
  Acute motor and sensory axonal neuropathy (AMSAN) is a motor-sensory axonal
  electrophysiologic and pathologic pattern within Guillain-Barre syndrome
  (GBS). It is characterized clinically by acute progressive flaccid weakness,
  reduced reflexes, and sensory involvement, and electrodiagnostically by
  reduced or absent motor and sensory response amplitudes without a primary
  demyelinating pattern. In a subset of axonal GBS, especially after
  Campylobacter jejuni infection, cross-reactive anti-ganglioside antibodies
  activate complement at vulnerable nodal and axolemmal membranes. Injury can
  range from reversible nodal conduction failure to irreversible degeneration
  of motor and sensory axons. AMSAN assignment may change on serial nerve
  conduction studies, so it should not be treated as a perfectly stable early
  subtype or as a separate treatment indication.
synonyms:
- Acute motor-sensory axonal polyneuropathy
- AMSAN
- Acute motor-sensory axonal Guillain-Barre syndrome

progression:
- phase: Acute progressive phase
  duration_days: Usually less than 14; by definition no more than 28
  notes: >-
    Weakness progresses rapidly. The timing is GBS-wide evidence rather than an
    AMSAN-specific natural-history estimate.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      initial acute and progressive phase of <4 weeks
    explanation: >-
      The current GBS primer defines the acute progressive phase; AMSAN-specific
      timing has not been established independently.
  - reference: PMID:31541214
    reference_title: Diagnosis and management of Guillain-Barre syndrome in ten steps.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      most patients with GBS reach their maximum disability within 2 weeks.
    explanation: >-
      Consensus guidance supports the usual early nadir while remaining
      GBS-wide evidence.
- phase: Plateau phase
  duration: Variable
  notes: >-
    The plateau follows the progressive phase. Continued progression beyond four
    weeks questions typical GBS, and deterioration after eight weeks should
    prompt reconsideration as acute-onset CIDP.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      followed by a plateau phase and recovery phase of weeks to years
    explanation: >-
      The primer describes the usual GBS sequence; the duration is variable and
      not specific to AMSAN.
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      acute-onset chronic inflammatory demyelinating polyradiculoneuropathy
      (A-CIDP) should be considered if progression continues after 8 weeks from
      onset
    explanation: >-
      The guideline identifies prolonged progression as a reason to reconsider
      the diagnosis rather than extend the AMSAN label indefinitely.
- phase: Recovery phase
  duration: Weeks to years
  notes: >-
    Recovery is heterogeneous. Reversible nodal failure can improve faster than
    fixed axonal loss, whereas extensive axonal degeneration can leave prolonged
    weakness, sensory loss, pain, and fatigue. GBS-wide prognostic tools such as
    mEGOS and mEGRIS are preferred over assuming prognosis from the AMSAN label.
  evidence:
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      the rate of progression and recovery varies considerably between patients.
    explanation: >-
      This supports variable recovery and cautions against a uniform
      AMSAN-specific prognosis.

pathophysiology:
- name: Campylobacter LOS-Ganglioside Molecular Mimicry
  role: trigger
  conforms_to: "molecular_mimicry_autoimmunity#Infection-Associated Cross-Reactive Antigen Exposure"
  description: >-
    In a biologically defined subset of axonal GBS, sialylated C. jejuni
    lipooligosaccharides resemble peripheral-nerve gangliosides. The mimicry can
    initiate an antibody response that recognizes both bacterial carbohydrate
    and neural ganglioside. This mechanism is not asserted for every AMSAN case.
  biological_processes:
  - preferred_term: Antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
  evidence:
  - reference: PMID:15277677
    reference_title: Carbohydrate mimicry between human ganglioside GM1 and Campylobacter jejuni lipooligosaccharide causes Guillain-Barre syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      On sensitization with C. jejuni lipooligosaccharide, rabbits developed
      anti-GM1 IgG antibody and flaccid limb weakness.
    explanation: >-
      Active immunization provides experimental causal evidence for the
      LOS-to-anti-GM1 molecular-mimicry step, although the model is motor-predominant.
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      preceding Campylobacter jejuni infection, molecular mimicry causes a
      cross-reactive antibody response to nerve gangliosides.
    explanation: >-
      The primer synthesizes the established C. jejuni mechanism in GBS; it is
      applied only to the relevant AMSAN subset.
  downstream:
  - target: Cross-Reactive Anti-Ganglioside IgG Response
    causal_link_type: DIRECT
    hypothesis_groups:
    - antiganglioside_complement_axonal_injury
    description: >-
      LOS-ganglioside mimicry elicits IgG that cross-reacts with neural
      gangliosides.
    evidence:
    - reference: PMID:15277677
      reference_title: Carbohydrate mimicry between human ganglioside GM1 and Campylobacter jejuni lipooligosaccharide causes Guillain-Barre syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        On sensitization with C. jejuni lipooligosaccharide, rabbits developed
        anti-GM1 IgG antibody
      explanation: >-
        The intervention directly links bacterial LOS exposure to anti-GM1 IgG
        production in vivo.

- name: Cross-Reactive Anti-Ganglioside IgG Response
  role: central_effector
  conforms_to: "molecular_mimicry_autoimmunity#Cross-Reactive Autoreactive Lymphocyte Activation"
  description: >-
    Activated B-cell and plasma-cell responses produce IgG against gangliosides
    such as GM1, GM1b, and GD1a. These antibodies occur in some, but not all,
    patients with axonal GBS. A small human study found the same antibody profile
    in AMSAN and AMAN, supporting a shared immune spectrum rather than a uniquely
    AMSAN-specific marker.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: Immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  evidence:
  - reference: PMID:10526194
    reference_title: Acute motor axonal neuropathy and acute motor-sensory axonal neuropathy share a common immunological profile.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients with AMSAN had anti-GM1, anti-GM1b, and anti-GD1a IgG
      antibodies
    explanation: >-
      This is direct AMSAN serologic evidence, limited by the small historical
      series and not a sensitivity estimate.
  - reference: DOI:10.1186/s43161-024-00258-8
    reference_title: "Autoimmune mechanisms in Guillain-Barré syndrome subtypes: a systematic review"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      specific autoantibodies, such as anti-GM1 and anti-GQ1b, are associated
      with distinct subtypes of GBS
    explanation: >-
      The systematic review supports antibody-associated GBS heterogeneity but
      does not establish a universal or AMSAN-specific diagnostic marker.
  downstream:
  - target: Ganglioside Antibody Binding at Nodal and Axolemmal Membranes
    causal_link_type: DIRECT
    hypothesis_groups:
    - antiganglioside_complement_axonal_injury
    description: >-
      Circulating anti-ganglioside IgG binds ganglioside-rich vulnerable sites
      on peripheral axons and motor nerve terminals.
    evidence:
    - reference: PMID:15716397
      reference_title: Overexpression of GD1a ganglioside sensitizes motor nerve terminals to anti-GD1a antibody-mediated injury in a model of acute motor axonal neuropathy.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Dense antibody and complement deposits were observed only over
        presynaptic motor axons
      explanation: >-
        The ex vivo model directly demonstrates antibody deposition on axonal
        membranes but models motor terminals rather than sensory-inclusive AMSAN.

- name: Ganglioside Antibody Binding at Nodal and Axolemmal Membranes
  role: effector
  description: >-
    Anti-ganglioside IgG binds the nodal axolemma and nerve-terminal membranes.
    Antigen density and ganglioside complexes influence binding, which helps
    explain why antibody presence alone does not predict the exact clinical
    distribution of injury.

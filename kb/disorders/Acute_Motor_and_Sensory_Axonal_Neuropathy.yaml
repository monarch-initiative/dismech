- name: Reversible Nodal Conduction Failure
  role: effector
  description: >-
    Immune disruption of nodal and paranodal excitability can transiently block
    conduction without the temporal dispersion expected from remyelination and
    without established Wallerian degeneration. Serial studies are required to
    distinguish recovery of nodal function from fixed axonal loss.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Transmission of nerve impulse
    term:
      id: GO:0019226
      label: transmission of nerve impulse
    modifier: DECREASED
  cellular_components:
  - preferred_term: Node of Ranvier
    term:
      id: GO:0033268
      label: node of Ranvier
  evidence:
  - reference: PMID:22480600
    reference_title: "Electrodiagnostic criteria for Guillain-Barre syndrome: a critical revision and the need for an update."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      transient conduction block/slowing in intermediate and distal nerve
      segments, mimicking demyelination but without the development of abnormal
      temporal dispersion, named reversible conduction failure
    explanation: >-
      The electrodiagnostic review defines reversible conduction failure in
      axonal GBS; the direct examples are primarily AMAN rather than AMSAN.
  downstream:
  - target: Decreased Compound Muscle Action Potential Amplitude
    causal_link_type: DIRECT
    hypothesis_groups:
    - antiganglioside_complement_axonal_injury
    description: >-
      Failure of motor-axon conduction reduces the evoked compound muscle action
      potential even when the axon has not yet degenerated.
    evidence:
    - reference: PMID:22480600
      reference_title: "Electrodiagnostic criteria for Guillain-Barre syndrome: a critical revision and the need for an update."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        transient conduction block/slowing in intermediate and distal nerve
        segments
      explanation: >-
        Conduction block provides a functional route to a reduced motor response;
        amplitude is not separately quantified in this review excerpt.


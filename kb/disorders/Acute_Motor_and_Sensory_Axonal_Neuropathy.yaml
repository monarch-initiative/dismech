    term:
      id: GO:0033268
      label: node of Ranvier
  - preferred_term: Axolemma
    term:
      id: GO:0030673
      label: axolemma
  evidence:
  - reference: PMID:26936605
    reference_title: C1q-targeted inhibition of the classical complement pathway prevents injury in a novel mouse model of acute motor axonal neuropathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Anti-C1q monoclonal antibody treatment attenuated complement cascade
      activation and deposition
    explanation: >-
      Targeted C1q inhibition provides intervention evidence for classical
      complement activation in acute motor-axonal injury, with incomplete AMSAN
      fidelity.
  - reference: DOI:10.1038/s41572-024-00580-4
    reference_title: Guillain-Barre syndrome
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Complement activation at these sites causes initial peripheral nerve
      dysfunction followed by structural injury
    explanation: >-
      The primer synthesizes complement as the link from antibody binding to
      functional and structural nerve injury across GBS.
  downstream:
  - target: Reversible Nodal Conduction Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

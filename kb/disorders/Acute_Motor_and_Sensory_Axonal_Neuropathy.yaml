      the tiny, severity-selected series limits generalization.

- name: Motor and Sensory Axonal Degeneration
  role: central_effector
  description: >-
    Irreversible AMSAN injury is dominated by Wallerian-like degeneration and
    loss of motor and sensory fibers in ventral and dorsal roots and peripheral
    nerves. This acute pattern is not assumed to be length-dependent, and
    primary demyelination is not required.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  evidence:
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      predominantly axonal lesions of both motor and sensory fibers, even in the
      early stages of the disease
    explanation: >-
      This is direct human AMSAN pathology, although it derives from four fatal
      cases and therefore overrepresents severe disease.
  - reference: DOI:10.1002/ana.410390105
    reference_title: Pathology of the motor-sensory axonal Guillain-Barre syndrome
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ongoing wallerian-like degeneration of fibers in the ventral and dorsal
      roots and in the peripheral nerves, with only minimal demyelination
    explanation: >-
      The autopsy series distinguishes combined motor-sensory axonal loss from a
      primarily demyelinating lesion.
  downstream:

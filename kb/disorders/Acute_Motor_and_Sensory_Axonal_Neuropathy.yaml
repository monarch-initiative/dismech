- name: Classical Complement Activation at Axonal Membranes
  role: effector
  conforms_to: "molecular_mimicry_autoimmunity#Autoreactive Effector-Mediated Tissue Injury"
  description: >-
    C1q-initiated classical complement activation deposits complement products
    at nodal, paranodal, and nerve-terminal membranes. Terminal-complement pores,
    calcium influx, and downstream protease activation can produce early
    functional failure and, if injury is not reversed, structural axonal loss.
  biological_processes:
  - preferred_term: Classical complement activation
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: INCREASED
  cell_types:

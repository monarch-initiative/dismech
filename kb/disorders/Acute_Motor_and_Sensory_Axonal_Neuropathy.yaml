  minimum_value: 8.6
  maximum_value: 8.6
  unit: percent of electrodiagnostically assessed GBS cases
  notes: >-
    This is a cohort-specific subtype fraction, not population prevalence. The
    study was single-center and classification was based on one criteria set.
  evidence:
  - reference: PMID:32674942
    reference_title: Electrophysiological subtypes and associated prognosis factors of Mexican adults diagnosed with Guillain-Barre syndrome, a single center experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      acute motor and sensory axonal neuropathy (AMSAN) 8,6%.
    explanation: >-
      The cohort reports an AMSAN case fraction among adults with GBS; it cannot

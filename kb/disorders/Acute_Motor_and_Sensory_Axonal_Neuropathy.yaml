  evidence:
  - reference: PMID:37814552
    reference_title: European Academy of Neurology/Peripheral Nerve Society Guideline on diagnosis and treatment of Guillain-Barre syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      weakly recommends gabapentinoids, tricyclic antidepressants or
      carbamazepine for treatment of pain
    explanation: >-
      This is a weak GBS-wide recommendation and not an AMSAN-specific trial
      result.


discussions:
- discussion_id: znf699_function_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic ZNF699 Loss of Function
  - pathophysiology#Disrupted Embryonic Organ Morphogenesis
  prompt: >-
    What does ZNF699 bind, what does it repress, and in which developing tissues does
    its loss matter?
  rationale: >-
    Every mechanistic statement in this entry is an inference from protein family.
    ZNF699 is a KRAB zinc finger protein, so it is presumed to recruit KAP1-dependent
    repressive chromatin to a set of genomic targets, but no binding site, target
    gene or expression consequence has been reported, no animal or cellular model
    exists, and the only functional literature on the gene concerns ethanol
    tolerance in the distantly related Drosophila gene hangover and candidate-gene
    association with alcohol dependence. The founding report called for functional work in 2021
    and none has appeared. Until it does, the pathograph cannot say why the gut,
    heart, kidney, limb, brain and marrow are the organs affected, or why the
    anomalies are discordant between siblings.
  evidence:
  - reference: PMID:39424669
    reference_title: Epigenomic and phenotypic characterization of DEGCAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZNF699 encodes a KRAB zinc finger protein of unknown function."
    explanation: The gap, stated by the largest cohort.
  - reference: PMID:33875846
    reference_title: "Combining exome/genome sequencing with data repository analysis reveals novel gene-disease associations for a wide range of genetic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "little is known about the function of this gene, which was initially described in Drosophila in a study of alcohol dependence."
    explanation: The founding report's statement of the same gap and of the only prior literature.
  - reference: PMID:42534679
    reference_title: A novel ZNF699 mutation in a patient with DEGCAGS syndrome and severe B cell depletion.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "no validated experimental system is currently available to functionally assess ZNF699"
    explanation: Why missense variants are currently classified by episignature rather than by assay.
  proposed_experiments:
  - experiment_id: exp_degcags_znf699_null_ipsc_occupancy_methylation
    name: ZNF699 ChIP-seq and methylation profiling in ZNF699-null human iPSC-derived lineages
    description: >-
      Generate biallelic ZNF699 knockout iPSCs and profile ZNF699 genomic occupancy in
      the parental line, then compare DNA methylation and transcription at bound loci
      between null and parental cells differentiated toward intestinal, cardiac and
      hematopoietic lineages.
    would_support:
    - mechanistic_hypotheses#epigenetic_mediation
    supporting_outcome:
    - >-
      A definable set of ZNF699-bound loci that lose methylation and gain expression
      in null cells, enriched for developmental regulators of the affected organs,
      and overlapping the differentially methylated regions of the blood
      episignature.
    refuting_outcome:
    - >-
      No reproducible binding sites, or bound loci whose methylation and expression
      are unchanged in null cells, would indicate that the episignature is a
      downstream or cell-type-restricted consequence rather than the mechanism.
- discussion_id: degcags_sibling_discordance_and_mortality
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Embryonic Organ Morphogenesis
  prompt: >-
    Why are the organ anomalies discordant between full siblings homozygous for the
    same ZNF699 allele, and what determines infant survival?
  rationale: >-
    The 2024 cohort makes discordance among full siblings and infant mortality
    defining features of the syndrome. The founding cohort recorded one evaluated
    child dead at nine months and eight infant deaths among siblings of the
    identified children, without their cause; eight of its thirteen patients carried
    the same c.436_439del allele with widely different anomaly sets, so the allele
    does not fix the phenotype. Stochastic developmental variation, modifier loci in
    these consanguineous pedigrees, or an environmental contribution are all open.
    No report has addressed which organ-system involvement predicts death, so the
    entry cannot connect infant mortality to any node, and because HPO's Death in
    infancy is a clinical-course term outside this schema's phenotype enum, the
    mortality is recorded here and in the description rather than as a phenotype.
  evidence:
  - reference: PMID:39424669
    reference_title: Epigenomic and phenotypic characterization of DEGCAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is caused by biallelic, loss-of-function (LoF) ZNF699 variants, and is characterized by variable neurodevelopmental disability, discordant organ anomalies among full siblings and infant mortality."
    explanation: Discordance and infant mortality named together as defining features.
  - reference: PMID:38014480
    reference_title: "Clinical and ocular abnormalities in DEGCAGS syndrome-Developmental delay with gastrointestinal, cardiovascular, genitourinary, and skeletal abnormalities."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "identified 13 children from 12 consanguineous families who had DEGCAGS syndrome that proved to be variable in presentation and sufficiently severe that one evaluated child died prior to their report and eight siblings of the identified children died in infancy"
    explanation: The sibling deaths in the founding cohort, as summarised in a later report's introduction.
  - reference: PMID:39424669
    reference_title: Epigenomic and phenotypic characterization of DEGCAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a highly variable condition lacking pathognomonic clinical findings"
    explanation: The authors' characterisation of the variability, and their motivation for seeking an episignature.
notes: >-
  Provenance, so a reader can calibrate the entry. No GeneReviews chapter exists for
  DEGCAGS syndrome (offline Bookshelf index and live PubMed title search, September
  2026), and there is no Orphanet entry or ClinGen gene-disease validity assertion in
  the structured caches, so the entry is built from the primary literature. The
  spine is the founding report (PMID:33875846, whose cached full text includes the
  Table 1 HPO inventory for all thirteen patients), the fourteen-patient frequency
  synthesis of Biela et al. (PMID:35205213, full text), and the 30-patient
  epigenomic cohort of Karimi et al. (PMID:39424669, abstract only in the cache).
  The ocular (PMID:38014480), airway (PMID:41205195), immunological (PMID:42534679)
  and oro-dental (PMID:42569837) case reports supply the newer phenotypes. Two
  further reports could not be quoted: the 2025 hematology report (PMID:40790844)
  has no abstract in the cache and is cited in references only, and the 2026
  Chinese case report (PMID:42527142) fetched without a retrievable abstract and is
  neither cited nor committed. The hangover association paper (PMID:16940975) is
  cited once, for the weakness of the orthology claim.

  Deep research was requested from falcon, which was not configured, and the run
  fell back to OpenScientist (research/DEGCAGS_Syndrome-deep-research-openscientist.md,
  whose frontmatter records the fallback). Its 15 citations all resolved; three
  general KRAB-ZFP retrotransposon-silencing papers were flagged as off topic and
  were not cited, and its one obsolete term (GO:0006306) was not bound. The report
  cites the same DEGCAGS primary papers this entry does; the one addition taken from
  it is the KRAB-KAP1 structural study (PMID:36341546) on the mechanistic
  hypothesis. The report also relays full-text figures from Karimi et al. (a
  26-patient frequency table, three deaths with causes, 15 variants, about 210
  differentially methylated regions) that could not be curated because only the
  abstract is cached.

  Frequencies are Biela's counts over fourteen patients mapped to the enum bands
  (5 to 29 percent OCCASIONAL, 30 to 79 percent FREQUENT), which is a small
  denominator. Phenotypes reported once are VERY_RARE.

  Deliberately left unconnected in the pathograph: Neonatal respiratory distress,
  Premature graying of hair, Ptosis, Retinal vascular tortuosity, Intrauterine growth
  retardation, Polyhydramnios, Premature birth, Hepatosplenomegaly, Dolichocephaly
  and Enamel hypomineralization, because no report attributes them to a mechanism
  (the ophthalmologists reporting the ptosis offered two readings; the prenatal
  features are growth and amniotic findings that the organ-malformation node does not
  explain; the dental report's authors invoke positional and multifactorial causes
  for the last two). The methylation episignature appears twice on purpose, as a
  biochemical biomarker (established) and as a pathophysiology node whose outgoing
  edges carry the epigenetic-mediation hypothesis (not established). The GO binding
  on the genetic lesion node is inferred from the KRAB domain and says so in the
  descriptor's description.

  A pre-PR review round (independent agent, dismech-pr-review checklist) led to:
  splitting Synophrys from Thick eyebrow; adding Immunodeficiency (HP:0002721) so the
  single-patient Combined immunodeficiency could drop to VERY_RARE; VERY_RARE on the
  other single-patient immune and lung findings; removing the hypotonia-to-ptosis
  sequela and the morphogenesis-to-IUGR edge; regrading the KRAB-domain sentence as
  restated background; softening the hangover orthology claim; and adding
  Polyhydramnios and Premature birth from the frequency table.

  The PR review round set Coarse facial features to FREQUENT, since the only cached
  frequency is Biela's abnormal facial shape in 9 of 14, and added the single- or
  two-patient findings the reviewer listed from the cached full texts: Thin upper lip
  vermilion, Dolichocephaly, Craniosynostosis, Agenesis of corpus callosum,
  Ventriculomegaly, Hepatosplenomegaly and Enamel hypomineralization. Still
  deliberately left out as single mentions without a clean binding decision: vocal
  cord paralysis (patient 26; the airway patient had vocal cord dysfunction, a
  different finding), surgically corrected intestinal malrotation and cutis marmorata
  in the dental report, and talon cusps and cholestasis.

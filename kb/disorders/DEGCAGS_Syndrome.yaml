pathophysiology:
- name: Biallelic ZNF699 Loss of Function
  description: >-
    Homozygous or compound heterozygous frameshift, nonsense and rare missense
    variants abolish or disable the ZNF699 KRAB zinc finger protein. Nothing is known
    of the protein's targets: the KRAB domain implies transcriptional repression and
    the sixteen C2H2 zinc fingers imply sequence-specific DNA binding, and that is the
    extent of the mechanistic knowledge. The modifier on the bound process is
    therefore an inference from domain architecture, not a measurement, and no
    experimental system for ZNF699 exists.
  biological_scale: MOLECULAR
  genetic_context:

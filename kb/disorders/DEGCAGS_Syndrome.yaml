inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive. The founding cohort was entirely homozygous, reflecting
    ascertainment in consanguineous families; the first non-consanguineous case
    carried two nonsense variants in trans, one from each parent, which established
    that compound heterozygosity produces the same syndrome. Heterozygous carriers
    are unaffected and, on methylation profiling, cluster separately from both
    patients and controls.

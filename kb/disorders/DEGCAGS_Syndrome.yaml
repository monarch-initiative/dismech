    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The orthology of hang in mammals is complex, but a number of human gene products (including ZNF699) with similar levels of amino-acid identity (18-26%) and similarity (30-41%), are consistently identified as the best matches with the translated hang sequence."
    explanation: >-
      The sequence-similarity basis of the hangover relationship, which is weak and
      shared with several human genes; the entry therefore does not call ZNF699 the
      ortholog, and no Drosophila phenotype is used as a model of the disease.

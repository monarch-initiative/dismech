    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DEGCAGS syndrome is a clinically variable recessive syndrome even among siblings with a distinct methylation episignature which can be used as a screening, diagnostic and classification tool for ZNF699 variants."
    explanation: The proposed diagnostic use.
  - reference: PMID:42534679
    reference_title: A novel ZNF699 mutation in a patient with DEGCAGS syndrome and severe B cell depletion.

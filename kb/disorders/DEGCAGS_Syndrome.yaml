- name: Disrupted Embryonic Organ Morphogenesis
  description: >-
    Congenital anomalies of gut (jejunal and other intestinal atresia, pyloric
    stenosis), heart (septal defects, pulmonary valve stenosis or dysplasia, patent
    ductus), kidney and genitalia (renal hypoplasia or dysplasia, cryptorchidism,
    hypospadias, chordee, ambiguous genitalia), limbs (preaxial polydactyly, absent
    thumbs, syndactyly, talipes) and craniofacial skeleton, discordant in which organs
    are affected even between siblings sharing a genotype. The node is a
    tissue-level summary of a developmental failure whose molecular basis is unknown;
    each bound process is an organ system in which the cohorts document a
    malformation, with ABNORMAL rather than a direction because the anomalies span
    both hypoplasia and duplication.

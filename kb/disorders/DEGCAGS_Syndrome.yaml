genetic:
- name: ZNF699
  gene_term:
    preferred_term: ZNF699
    term:
      id: hgnc:24750
      label: ZNF699
  relationship_type: CAUSATIVE
  notes: >-
    ZNF699 at 19p13.2 (NM_198535) encodes a 643-residue protein with an N-terminal
    KRAB domain and 16 C2H2 zinc fingers. No ClinGen gene-disease validity assertion
    exists for this pair, so CAUSATIVE rests on the recurrence of biallelic
    loss-of-function variants across more than a dozen unrelated families with a
    consistent syndrome, plus a gene-specific methylation episignature that
    classifies carriers and patients separately. Most reported alleles are frameshift
    or nonsense; the homozygous missense variants in the case literature fall in the
    zinc-finger region (p.Ser460Leu) and, in 2026, in the KRAB domain (p.Asn51Lys).
    The latter remains a variant of uncertain significance by ACMG criteria, with the
    episignature match offered as supporting evidence of pathogenicity because no
    functional assay for ZNF699 exists.
  variants:
  - name: "NM_198535.2:c.436_439del p.(Asp146Ilefs*10)"
    description: >-
      The recurrent allele of the founding cohort, homozygous in eight of the thirteen
      patients across several families.
  - name: "NM_198535.2:c.1623_1626delTTAT p.(Tyr542fs)"
    description: Homozygous frameshift in two siblings of the founding cohort.
  - name: "NM_198535.3:c.535C>T p.(Gln179Ter) / c.1327C>T p.(Arg443Ter)"
    description: >-
      Compound heterozygous nonsense variants in the first non-consanguineous patient,
      one inherited from each parent.
  - name: "c.1379C>T p.(Ser460Leu)"
    description: Homozygous missense variant in the first patient with detailed ophthalmological documentation.
  - name: "c.153C>A p.(Asn51Lys)"
    description: >-
      Homozygous missense variant within the KRAB domain, the first reported there,
      in a young adult with combined immunodeficiency; classified as a VUS by ACMG
      criteria and supported by a high-confidence episignature match.

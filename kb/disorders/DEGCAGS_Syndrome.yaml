- name: Impaired Neurodevelopment
  description: >-
    Severe global developmental delay with intellectual disability and central
    hypotonia in every reported patient, microcephaly in about half, sensorineural
    hearing loss in a minority, and non-specific white matter change on imaging
    (punctate non-hemorrhagic white matter lesions, periventricular echogenicity,
    ventricular enlargement, in one case agenesis of the corpus callosum). The
    2024 cohort describes the presentation as age-related, and the one adult
    reported had a borderline IQ, so the severity range is wider than the infant
    cohorts suggested.

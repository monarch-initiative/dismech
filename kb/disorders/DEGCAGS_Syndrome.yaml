    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing of the parents showed that the variant p.Gln179Ter was inherited from the mother, while p.Arg443Ter was inherited from the father (Figure 2), which is consistent with in trans variants transmission in the autosomal recessive mode of inheritance."
    explanation: >-
      Segregation in the first compound heterozygous family, which is the evidence
      that the recessive mode holds outside consanguineous homozygosity.

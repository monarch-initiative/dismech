diagnosis:
- name: Molecular genetic testing for biallelic ZNF699 variants
  description: >-
    Diagnosis is by identification of biallelic pathogenic ZNF699 variants, in
    practice by exome or genome sequencing. Because the gene-disease association
    dates from 2021, exomes analysed before then and clinical-exome panels that omit
    ZNF699 can miss it, and reanalysis is warranted in undiagnosed patients with a
    compatible phenotype.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: ZNF699
        term:
          id: hgnc:24750
          label: ZNF699
  results: Biallelic loss-of-function or episignature-supported missense ZNF699 variants establish the molecular diagnosis.
  evidence:
  - reference: PMID:41205195
    reference_title: "Novel Airway Challenges in DEGCAGS Syndrome: Managing Infant Laryngeal Hamartomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 1-year-old girl with DEGCAGS syndrome (confirmed by ZNF699 mutation via whole-exome sequencing)"
    explanation: Exome-based confirmation in a later case.
  - reference: PMID:42534679
    reference_title: A novel ZNF699 mutation in a patient with DEGCAGS syndrome and severe B cell depletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This evidence further emphasizes the importance of reanalysis of results of genetic testing over time."
    explanation: The lesson of a patient whose 2018 exome and 2022 clinical exome both missed ZNF699.
- name: DNA methylation episignature analysis
  description: >-
    Genome-wide blood DNA methylation profiling against the DEGCAGS episignature
    classifies patients from controls and carriers and can resolve a ZNF699 variant
    of uncertain significance, which matters because no functional assay for the
    protein exists. The signature is offered as a screening, diagnostic and
    classification tool.
  diagnosis_term:
    preferred_term: genome-wide DNA methylation episignature analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  results: A high-confidence match to the DEGCAGS episignature supports pathogenicity of a candidate ZNF699 genotype.
  evidence:
  - reference: PMID:39424669

name: DEGCAGS Syndrome
creation_date: "2026-09-22T00:00:00Z"
category: Mendelian
description: >-
  DEGCAGS syndrome (developmental delay with gastrointestinal, cardiovascular,
  genitourinary, and skeletal abnormalities; OMIM 619488) is an autosomal recessive
  multiple-malformation neurodevelopmental disorder caused by biallelic
  loss-of-function variants in ZNF699. ZNF699 encodes a KRAB zinc finger protein of
  unknown function, distantly related to the Drosophila gene hangover, and before
  2021 it was known in human genetics only as a candidate locus for alcohol
  dependence. The syndrome was delineated by Bertoli-Avella and colleagues in 2021
  from 13 children in 12 consanguineous families carrying homozygous frameshift
  variants, and the 2024 Karimi cohort brought the published case base to about 30
  individuals.

  The clinical picture is severe global developmental delay with hypotonia and a
  recognisable coarse facial gestalt (thick eyebrows with synophrys, long eyelashes,
  bulbous nose, smooth philtrum, wide mouth, micrognathia), on which sit discordant
  congenital anomalies: intestinal atresia requiring surgery in the first days of
  life, septal and pulmonary valve defects, renal hypoplasia and genital anomalies,
  and limb anomalies of the preaxial-polydactyly, absent-thumb and syndactyly type.
  Anemia or pancytopenia, premature graying of hair, sensorineural hearing loss,
  airway malacia and recurrent infections recur across the cohort, and infant
  mortality is substantial: one evaluated child in the founding cohort died at nine
  months and eight siblings of the identified children had died in infancy. The
  organ anomalies are discordant even between full siblings homozygous for the
  same variant, and no genotype-phenotype correlation is established.

  Two things distinguish the entry mechanistically. First, there is no experimental
  system for ZNF699 and no functional work has been reported, so the pathograph
  stops at the genetic lesion and a set of organ-system consequences that the
  cohorts document but do not explain. Second, a robust and specific blood DNA
  methylation episignature has been identified and is now used diagnostically to
  classify ZNF699 variants of uncertain significance; whether the methylation
  changes mediate the phenotype, as the 2024 differentially-methylated-region
  analysis tentatively suggests, is an open hypothesis and is recorded as one. A
  2026 report of a young adult with combined immunodeficiency and near-absent B
  cells extends the immune phenotype from recurrent infections to a characterised
  inborn error of immunity.
synonyms:
- Developmental delay with gastrointestinal, cardiovascular, genitourinary, and skeletal abnormalities
- ZNF699-related neurodevelopmental disorder
parents:

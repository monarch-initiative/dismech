- name: Aberrant Genome-wide DNA Methylation
  description: >-
    Peripheral-blood DNA from patients carries a robust, specific methylation
    episignature that separates DEGCAGS from controls, from heterozygous carriers and
    from other episignature-bearing neurodevelopmental disorders. The signature is
    established as a diagnostic biomarker. Whether it also mediates the phenotype is
    not: the 2024 differentially-methylated-region analysis suggested effects on
    genes that could be relevant to pathogenesis, and that is where the evidence
    stops. The downstream edges from this node are therefore tagged with the
    epigenetic-mediation hypothesis rather than asserted.

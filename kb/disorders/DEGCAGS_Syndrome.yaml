mechanistic_hypotheses:
- hypothesis_group_id: epigenetic_mediation
  hypothesis_label: >-
    Loss of ZNF699-directed methylation at target loci mediates the malformation,
    neurodevelopmental and hematopoietic phenotypes
  status: EMERGING
  description: >-
    KRAB zinc finger proteins recruit the co-repressor KAP1 (TRIM28) through their
    KRAB domain, and KAP1 in turn deposits H3K9me3 and DNA methylation at the bound
    loci; DEGCAGS patients carry a robust blood methylation episignature. The
    hypothesis is that the episignature is the visible trace of a genome-wide loss
    of ZNF699-directed repression, and that derepression of specific target genes
    during development produces the phenotype. The 2024 cohort's
    differentially-methylated-region analysis pointed at genes plausibly involved in
    pathogenesis but did not test any. Against the hypothesis: the episignature is
    measured in blood leukocytes, not in the developing organs; the KRAB-KAP1 axis
    has been validated structurally and functionally for other KRAB zinc finger
    proteins (ZNF93) but never for ZNF699; and no ZNF699 target has been identified.
    The hypothesis predicts that ZNF699-null cells would show derepression and
    hypomethylation at a definable set of loci and that those loci would be enriched
    for developmental regulators of the affected organs.
  evidence:
  - reference: PMID:39424669
    reference_title: Epigenomic and phenotypic characterization of DEGCAGS syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of differentially methylated regions suggested an effect on genes potentially implicated in the syndrome's pathogenesis."
    explanation: >-
      The observation that motivates the hypothesis. INDIRECT because it is an
      enrichment in blood-derived DNA, not a demonstration of a target gene's role.
  - reference: PMID:42534679
    reference_title: A novel ZNF699 mutation in a patient with DEGCAGS syndrome and severe B cell depletion.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "The variant falls within the Krüppel-Associated Box (KRAB) domain, which plays a critical role in transcriptional repression"
    explanation: The domain-level basis for expecting ZNF699 to act as a transcriptional repressor; restated background rather than a measurement.
  - reference: PMID:36341546
    reference_title: Structure and functional mapping of the KRAB-KAP1 repressor complex.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "KRAB domain-containing zinc finger proteins (KRAB-ZFPs) recruit the co-repressor KRAB-associated protein 1 (KAP1/TRIM28) to regulate many transposable elements, but how KRAB-ZFPs and KAP1 interact remains unclear."
    explanation: >-
      The general KRAB-ZFP mechanism the hypothesis extrapolates from. INDIRECT
      because the study concerns ZNF93 and the KRAB family, not ZNF699.
  - reference: PMID:36341546
    reference_title: Structure and functional mapping of the KRAB-KAP1 repressor complex.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Deposition of H3K9me3 over thousands of loci is lost genome-wide in cells expressing a KAP1 variant with mutations that abolish KRAB binding."
    explanation: >-
      Shows that breaking the KRAB-KAP1 interface removes repressive chromatin
      genome-wide, which is the shape of consequence the hypothesis predicts for a
      KRAB-domain missense such as p.Asn51Lys; again in a different KRAB-ZFP.

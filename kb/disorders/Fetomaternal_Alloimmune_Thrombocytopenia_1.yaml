clinical_burden:
  burden_level: HIGH
  rationale: >
    Isolated severe thrombocytopenia in an otherwise healthy term newborn whose
    most serious consequence is intracranial hemorrhage, leading to death or
    lifelong neurological disability. Unlike hemolytic disease of the newborn,
    FNAIT frequently affects the first pregnancy, so an index case is typically
    unanticipated and is usually recognized only after birth.
  evidence:
  - reference: PMID:26564154
    reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A thrombocytopenic fetus or new-born is at risk of intracranial hemorrhage that may result in lifelong disability or death."
    explanation: States the severe-outcome burden of the disease.
  - reference: PMID:26564154
    reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is characterized by platelet destruction and is more often observed in the first pregnancy"
    explanation: Supports the first-pregnancy involvement that makes an index case unanticipated.
  - reference: PMID:29730660
    reference_title: Perinatal Outcome and Long-Term Neurodevelopment after Intracranial Haemorrhage due to Fetal and Neonatal Alloimmune Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The perinatal mortality rate was 10/21 (48%)."
    explanation: Quantifies perinatal mortality once intracranial hemorrhage has occurred.
  - reference: PMID:29730660
    reference_title: Perinatal Outcome and Long-Term Neurodevelopment after Intracranial Haemorrhage due to Fetal and Neonatal Alloimmune Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall adverse outcome, including perinatal mortality or severe NDI, was 16/20 (80%)."
    explanation: Quantifies the combined death-or-severe-impairment burden after intracranial hemorrhage.
pathophysiology:
- name: Paternally Inherited HPA-1a Antigen on Fetal Platelet Integrin Beta-3
  role: trigger
  biological_scale: MOLECULAR
  description: >
    The HPA-1 system is defined by a single Leu33Pro substitution on the PSI
    domain of the integrin beta-3 chain (platelet glycoprotein IIIa, ITGB3); the
    Leu33 form is HPA-1a. A fetus that inherits HPA-1a from the father carries
    the antigen on its platelet alphaIIb-beta3 and on endothelial alphaV-beta3.
    When the pregnant person is HPA-1b/1b, that antigen is foreign and can prime
    an alloimmune response. The beta-3 chain's own molecular function is
    unchanged by which HPA-1 allele it carries: this is a common blood-group
    polymorphism, not a pathogenic lesion in the affected individual, and the
    fibrinogen-binding function named here identifies the receptor the epitope
    sits on rather than asserting any loss of it.
  genes:
  - preferred_term: ITGB3
    term:
      id: hgnc:6156
      label: ITGB3
  molecular_functions:
  - preferred_term: fibrinogen binding by platelet integrin alphaIIb-beta3
    term:
      id: GO:0070051
      label: fibrinogen binding
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:1464553
    reference_title: Leucine33-proline33 substitution in human platelet glycoprotein IIIa determines HLA-DRw52a (Dw24) association of the immune response against HPA-1a (Zwa/PIA1) and HPA-1b (Zwb/PIA2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the amino acid substitution leucine33-proline33 in GPIIIa, responsible for HPA-1a/b"
    explanation: Establishes that the HPA-1a and HPA-1b antigens are the Leu33Pro substitution on platelet glycoprotein IIIa.
  - reference: PMID:36581513
    reference_title: "Fetal and neonatal alloimmune thrombocytopenia: Current pathophysiological insights and perspectives for future diagnostics and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "caused by maternal alloantibodies against paternally-inherited platelet antigens, most frequently HPA-1a on integrin β3"
    explanation: Places the HPA-1a antigen on integrin beta-3 and names it the most frequent target, which is what makes this node the trigger.
  downstream:
  - target: HLA-DRB3*01:01-Restricted Maternal Alloimmunization
    causal_link_type: DIRECT
    description: >
      Fetal HPA-1a platelets reaching the maternal circulation are processed and
      their HPA-1a peptide presented, which is the first step of the maternal
      response.
    evidence:
    - reference: PMID:1464553
      reference_title: Leucine33-proline33 substitution in human platelet glycoprotein IIIa determines HLA-DRw52a (Dw24) association of the immune response against HPA-1a (Zwa/PIA1) and HPA-1b (Zwb/PIA2).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the amino acid polymorphism affects the presentation of the immunogenic oligopeptides of HPA-1a and -1b in the HLA class-II groove"
      explanation: Ties the antigen polymorphism directly to its HLA class II-restricted presentation, the downstream node.
- name: HLA-DRB3*01:01-Restricted Maternal Alloimmunization
  biological_scale: CELLULAR
  description: >
    The HPA-1a peptide is presented to maternal CD4+ T cells in the context of
    the class II molecule HLA-DRB3*01:01, providing the T-cell help that drives
    an anti-HPA-1a antibody response. The restriction is strong: almost all
    immunized women carry HLA-DRB3*01:01, and women who lack it rarely
    immunize, so maternal HLA-DRB3*01:01 status is the dominant immunogenetic
    risk factor.
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
    modifier: INCREASED
  evidence:
  - reference: PMID:19136661
    reference_title: "T-cell responses associated with neonatal alloimmune thrombocytopenia: isolation of HPA-1a-specific, HLA-DRB3*0101-restricted CD4+ T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the recognition is restricted by the MHC molecule HLA-DRB3*0101 that is strongly associated with NAIT"
    explanation: Shows directly that HPA-1a-specific CD4+ T-cell recognition is HLA-DRB3*0101 restricted.
  - reference: PMID:32299122
    reference_title: The prevalence of HPA-1a alloimmunization and the potential risk of FNAIT depend on both the DRB3*01:01 allele and associated DR-DQ haplotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DRB3*01:01 was carried by 94% HPA-1a-immunized women compared to 27% in the general population."
    explanation: Quantifies the enrichment of HLA-DRB3*01:01 among immunized women against the general population.
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The women who are HLA-DRB3:01:01 negative (72%) only rarely develop anti-HPA-1a"
    explanation: States the converse, that women lacking the allele rarely immunize.
  downstream:
  - target: Maternal Anti-HPA-1a IgG Alloantibody Production
    causal_link_type: DIRECT
    description: >
      T-cell help drives the class-switched anti-HPA-1a antibody response.
    evidence:
    - reference: PMID:19136661
      reference_title: "T-cell responses associated with neonatal alloimmune thrombocytopenia: isolation of HPA-1a-specific, HLA-DRB3*0101-restricted CD4+ T cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These HPA-1a-specific T-cell clones represent unambiguous evidence for the association of T-cell responses with NAIT"
      explanation: Links the T-cell response to the alloimmune disease, supporting the step from presentation to antibody production.
- name: Maternal Anti-HPA-1a IgG Alloantibody Production
  biological_scale: CELLULAR
  description: >
    A class-switched, IgG-secreting plasma-cell response against HPA-1a
    develops. The primary maternal risk factor is the HPA-1b/1b (HPA-1bb)
    platelet type, and most sensitization occurs around delivery, although
    first pregnancies are frequently affected. Antibody level tracks with
    severity, and only IgG is relevant to the fetus because IgM is not
    transported across the placenta.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: humoral immune response mediated by circulating immunoglobulin
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
  evidence:
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the primary risk factor for HPA-1a immunization is platelet type HPA-1bb"
    explanation: Names the maternal HPA-1bb platelet type as the primary risk factor for making the alloantibody.
  - reference: PMID:26564154
    reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 75 % of these women, alloimmunization by HPA-1a antigens, however, occurs at delivery"
    explanation: Establishes the timing of most sensitizing exposure, which is why prophylaxis is aimed at delivery.
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of FNAIT seems to be associated with the level of anti-HPA-1a."
    explanation: Supports antibody level as a determinant of how severe the fetal disease is.
  downstream:
  - target: Reduced Fc Core Fucosylation of Anti-HPA-1a IgG1
    causal_link_type: DIRECT
    description: >
      The anti-HPA-1a IgG1 made in these pregnancies is, as a population,
      markedly under-fucosylated at the Fc glycan, which is a property of the
      antibody response itself rather than of total serum IgG.
    evidence:
    - reference: PMID:24243971
      reference_title: A prominent lack of IgG1-Fc fucosylation of platelet alloantibodies in pregnancy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found markedly decreased levels of core fucosylation of anti-HPA-1a-specific IgG1 from FNAIT patients (n = 48), but not in total serum IgG1."
      explanation: Shows the alloantibody response itself carries the reduced-fucosylation glycoform.
  - target: Transplacental Transfer of Maternal Anti-HPA-1a IgG
    causal_link_type: DIRECT
    description: >
      Maternal IgG anti-HPA-1a is carried into the fetal circulation.
    evidence:
    - reference: PMID:23452741
      reference_title: Fetal/neonatal alloimmune thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These antibodies will cross the placenta and can cause thrombocytopenia of the unborn."
      explanation: States that the maternal antibody crosses the placenta, which is the edge from production to transfer.
- name: Reduced Fc Core Fucosylation of Anti-HPA-1a IgG1
  biological_scale: MOLECULAR
  description: >
    Anti-HPA-1a IgG1 in these pregnancies carries markedly less core fucose at
    the Fc glycan than total serum IgG1 does. Afucosylated IgG1 binds
    FcgammaRIIIa and FcgammaRIIIb with higher affinity, and the degree of
    fucosylation correlates positively with the neonatal platelet count and
    negatively with clinical severity. This is a quantitative property of the
    antibody rather than of its specificity, and it is part of why antibody
    level alone predicts bleeding poorly.
  evidence:
  - reference: PMID:24243971
    reference_title: A prominent lack of IgG1-Fc fucosylation of platelet alloantibodies in pregnancy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Antibodies with a low amount of fucose displayed higher binding affinity to Fc"
    explanation: Shows the receptor-binding consequence of the reduced fucosylation.
  - reference: PMID:24243971
    reference_title: A prominent lack of IgG1-Fc fucosylation of platelet alloantibodies in pregnancy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the degree of anti-HPA-1a fucosylation correlated positively with the neonatal platelet counts in FNAIT, and negatively to the clinical disease severity"
    explanation: Ties the glycoform to the clinical severity of the disease.
  - reference: PMID:41779743
    reference_title: "Anti-HPA-1a fetal-neonatal alloimmune thrombocytopenia: reframing diagnostics, pathophysiology, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Not only anti-HPA-1a levels but also structural features, particularly decreased Fc fucosylation enhancing Fc gamma receptor-mediated effector functions, more accurately determine disease severity."
    explanation: Review synthesis placing the glycoform among the determinants of severity.
  downstream:
  - target: Opsonization and Accelerated Clearance of Fetal Platelets
    causal_link_type: DIRECT
    description: >
      The afucosylated glycoform enhances FcgammaRIII-mediated phagocytosis of
      opsonized platelets, so it acts on the clearance step rather than on
      antibody specificity.
    evidence:
    - reference: PMID:24243971
      reference_title: A prominent lack of IgG1-Fc fucosylation of platelet alloantibodies in pregnancy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "these antibodies with a low amount of Fc fucose showed enhanced phagocytosis of platelets"
      explanation: Directly supports the edge from the glycoform to enhanced platelet phagocytosis.
- name: Transplacental Transfer of Maternal Anti-HPA-1a IgG
  biological_scale: TISSUE
  description: >
    Maternal anti-HPA-1a IgG crosses the placenta into the fetal circulation,
    transported across syncytiotrophoblast by the neonatal Fc receptor. This
    transfer is the step that converts a maternal immune response into fetal
    disease, and it is why the fetus is affected without carrying any lesion of
    its own beyond the antigen.
  cell_types:
  - preferred_term: syncytiotrophoblast cell
    term:
      id: CL:0000525
      label: syncytiotrophoblast cell
  biological_processes:
  - preferred_term: FcRn-mediated IgG transcytosis
    term:
      id: GO:0002416
      label: IgG immunoglobulin transcytosis in epithelial cells mediated by FcRn immunoglobulin receptor
    modifier: INCREASED
  evidence:
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "maternal alloantibodies against paternally inherited platelet antigens traverse the placenta and cause thrombocytopenia in the fetus/newborn"
    explanation: States the transplacental transfer step and its fetal consequence.
  downstream:
  - target: Opsonization and Accelerated Clearance of Fetal Platelets
    causal_link_type: DIRECT
    description: >
      Transferred IgG binds HPA-1a on fetal platelets and marks them for
      destruction.
    evidence:
    - reference: PMID:26209661
      reference_title: Suppression of in vitro megakaryopoiesis by maternal sera containing anti-HPA-1a antibodies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "is thought to be mediated by accelerated clearance of antibody-opsonized fetal platelets"
      explanation: Supports the step from transferred antibody to opsonization and accelerated clearance of fetal platelets.
  - target: Suppression of Fetal Megakaryopoiesis
    causal_link_type: DIRECT
    description: >
      The same antibodies act on fetal megakaryocytes and their progenitors
      rather than only on circulating platelets.
    evidence:
    - reference: PMID:26209661
      reference_title: Suppression of in vitro megakaryopoiesis by maternal sera containing anti-HPA-1a antibodies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Compared with control maternal sera, 14 out of 17 F/NAIT sera significantly reduced megakaryocyte (MK) number."
      explanation: Shows maternal anti-HPA-1a sera act on megakaryopoiesis, supporting this second downstream arm.
  - target: Antiendothelial Injury and Impaired Angiogenesis
    causal_link_type: DIRECT
    description: >
      The subset of anti-HPA-1a reactive with endothelial alphaV-beta3 reaches
      fetal endothelium through the same transplacental route.
    evidence:
    - reference: PMID:36581513
      reference_title: "Fetal and neonatal alloimmune thrombocytopenia: Current pathophysiological insights and perspectives for future diagnostics and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "some antibodies preferentially bind platelet integrin αIIbβ3, but others bind αvβ3 on endothelial cells and trophoblasts"
      explanation: Establishes that part of the transferred antibody repertoire targets endothelial rather than platelet integrin.
  - target: Chronic Placental Inflammation
    causal_link_type: DIRECT
    description: >
      Anti-HPA-1a also acts at the maternal-fetal interface itself, where beta-3
      integrin is expressed on trophoblast, producing chronic inflammatory
      lesions of the placenta.
    evidence:
    - reference: PMID:41779743

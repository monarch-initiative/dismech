    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This finding was associated with increased apoptosis and cell death of early MKs/MK progenitors, but normal maturation and differentiation of surviving MKs."
    explanation: Shows the mechanism of production failure, apoptosis of early megakaryocytes and progenitors.
  downstream:
  - target: Thrombocytopenia
    causal_link_type: DIRECT
    hypothesis_groups:

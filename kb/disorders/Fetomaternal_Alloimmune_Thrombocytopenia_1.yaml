- name: Suppression of Fetal Megakaryopoiesis
  biological_scale: CELLULAR
  description: >
    Beyond destroying circulating platelets, maternal anti-HPA-1a sera reduce
    megakaryocyte numbers in culture by inducing apoptosis and death of early
    megakaryocytes and megakaryocyte progenitors, while the surviving cells
    mature normally. Impaired production therefore contributes to the low
    neonatal platelet count alongside accelerated clearance, and the degree of
    suppression correlates with the platelet count at birth.

genetic:
- name: ITGB3 (HPA-1 antigen locus)
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: ITGB3
    term:
      id: hgnc:6156
      label: ITGB3
  variants:
  - name: HPA-1a (ITGB3 Leu33)
    description: >
      HPA-1a is the Leu33 form of the common Leu33Pro polymorphism on the PSI
      domain of integrin beta-3. It is an ordinary blood-group antigen rather
      than a pathogenic variant; disease arises only when a fetus inherits
      HPA-1a from the father while the pregnant person is HPA-1b/1b and
      alloimmunized.
    evidence:
    - reference: PMID:1464553
      reference_title: Leucine33-proline33 substitution in human platelet glycoprotein IIIa determines HLA-DRw52a (Dw24) association of the immune response against HPA-1a (Zwa/PIA1) and HPA-1b (Zwb/PIA2).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the amino acid substitution leucine33-proline33 in GPIIIa, responsible for HPA-1a/b"
      explanation: Identifies the HPA-1a and HPA-1b alleles as the Leu33Pro substitution.
  notes: >
    ITGB3 is curated here as the HPA-1 antigen locus, not as a disease gene in
    the usual sense. No pathogenic ITGB3 variant is involved: the relevant
    allele is the common antigen-positive HPA-1a (Leu33) form. The genotype
    that matters is the fetus's, inherited from the father, so it does sit in the affected individual, but it is necessary and
    nowhere near sufficient: disease also requires the pregnant person to be
    HPA-1a negative (HPA-1b/1b), to carry HLA-DRB3*01:01 in practice, and to be
    producing anti-HPA-1a IgG. SUSCEPTIBILITY is the closest available
    relationship value. The required discordance between two genomes, fetal and
    maternal, and the maternal HLA-DRB3*01:01 restriction cannot be expressed in
    a single-genome gene-disease model, so both are recorded in the
    pathophysiology nodes instead of as further gene descriptors. This follows
    the modelling stance taken for the blood-group loci in Hemolytic Disease of
    the Fetus and Newborn. There is no Mendelian mode of inheritance, so no
    inheritance block is given.
  evidence:
  - reference: PMID:36581513
    reference_title: "Fetal and neonatal alloimmune thrombocytopenia: Current pathophysiological insights and perspectives for future diagnostics and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "most frequently HPA-1a on integrin β3"
    explanation: Places the implicated antigen on the integrin beta-3 chain encoded by ITGB3.
treatments:
- name: Maternal Intravenous Immunoglobulin
  description: >
    Antenatal maternal intravenous immunoglobulin (IVIG), with or without
    corticosteroids, is the standard noninvasive management of a subsequent
    at-risk pregnancy, given to raise the fetal platelet count and reduce the
    risk of intracranial hemorrhage. A randomized trial comparing 0.5 g/kg with
    1 g/kg found a similarly low risk of adverse outcomes, but stopped early for
    poor recruitment and was underpowered to establish noninferiority.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Opsonization and Accelerated Clearance of Fetal Platelets
    description: >
      Maternal IVIG is given to raise the fetal platelet count, and the platelet
      count achieved at birth tracks with how strongly the mother's serum
      suppresses megakaryocyte growth, so response is read against the
      antibody-mediated arms of the disease.
    evidence:
    - reference: PMID:26209661
      reference_title: Suppression of in vitro megakaryopoiesis by maternal sera containing anti-HPA-1a antibodies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the ability of maternal antibodies to suppress MK growth is a potential predictive factor for the fetal response to maternal IVIG therapy"
      explanation: Ties the response to maternal IVIG to the antibody-mediated mechanism this node represents.
  evidence:
  - reference: PMID:25896635
    reference_title: "Low-Dose versus Standard-Dose Intravenous Immunoglobulin to Prevent Fetal Intracranial Hemorrhage in Fetal and Neonatal Alloimmune Thrombocytopenia: A Randomized Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of adverse outcomes in FNAIT pregnancies treated with IVIG at 0.5 g/kg is very low, similar to that using 1 g/kg, although our uncompleted trial lacked the power to conclusively prove the noninferiority of using the low dose."
    explanation: Reports the randomized dose comparison and its stated limitation.
- name: Corticosteroids as adjunct to maternal IVIG
  description: >
    Corticosteroids, typically prednisone, are used alongside maternal IVIG in
    antenatal management.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:26209661
    reference_title: Suppression of in vitro megakaryopoiesis by maternal sera containing anti-HPA-1a antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "infants born to mothers following antenatal intravenous immunoglobulin (IVIG) ± prednisone therapy"
    explanation: Documents prednisone given with maternal IVIG in antenatally treated pregnancies.
- name: Neonatal Platelet Transfusion
  description: >
    A newborn with severe thrombocytopenia is transfused to prevent or treat
    bleeding. HPA-1a-negative (HPA-1bb) matched platelets are classically
    recommended but are often unavailable; in a four-centre series of unexpected
    severe cases, random-donor platelets alone corrected critically low counts
    and no infant developed intracranial hemorrhage, while added IVIG did not
    improve post-transfusion counts.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: platelet transfusion
    term:
      id: NCIT:C15366
      label: Platelet Transfusion
  target_mechanisms:
  - target: Thrombocytopenia
    description: >
      Transfusion directly raises the neonatal platelet count.
    evidence:
    - reference: PMID:23869512
      reference_title: "Management of infants born with severe neonatal alloimmune thrombocytopenia: the role of platelet transfusions and intravenous immunoglobulin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transfusion of random-donor PLTs alone was effective at correcting critically low PLT counts and should be considered as first-line treatment of newborns with unexpected severe NAIT."
      explanation: Supports platelet transfusion as effective first-line correction of the neonatal thrombocytopenia.
  evidence:
  - reference: PMID:23869512
    reference_title: "Management of infants born with severe neonatal alloimmune thrombocytopenia: the role of platelet transfusions and intravenous immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transfusion of immunologically compatible platelets (PLTs) to prevent cerebral hemorrhage, the most severe complication in affected newborns, is usually recommended. Such PLT concentrates, however, are often not readily available."
    explanation: Records the recommendation for matched platelets and the practical availability problem.
  - reference: PMID:23869512
    reference_title: "Management of infants born with severe neonatal alloimmune thrombocytopenia: the role of platelet transfusions and intravenous immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IVIG did not appear to improve either posttransfusion PLT counts or total PLT transfusion requirements."
    explanation: Reports that neonatal IVIG added to transfusion did not improve platelet counts in this series.
  - reference: PMID:36108655
    reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "207 (53%) neonates received platelet transfusions, which were either HPA-unmatched (88 [43%] of 207), HPA-matched (84 [41%]), or a combination of both (35 [17%])"
    explanation: Describes how often matched and unmatched platelets are actually used across a multinational registry.
  - reference: PMID:36108655
    reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe thrombocytopenia (platelet count <50 × 109 platelets per L) was reported in 283 (74%) of 380 neonates"
    explanation: Establishes how commonly the neonatal thrombocytopenia is severe enough to prompt transfusion.
- name: Nipocalimab (FcRn blockade, investigational)
  description: >
    Nipocalimab blocks the neonatal Fc receptor, which both lowers circulating
    maternal IgG and inhibits its transplacental transfer, so it acts on the
    transfer step rather than on the platelet count. It is being tested in
    FNAIT in the phase 3 FREESIA-1 trial after a phase 2 study in the red-cell
    counterpart disease, and whether blocking transfer also reduces the
    placental inflammation arm is not yet known.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: neonatal Fc receptor blockade
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nipocalimab
      term:
        id: NCIT:C170891
        label: Nipocalimab
  target_mechanisms:
  - target: Transplacental Transfer of Maternal Anti-HPA-1a IgG
    description: >
      Blocking the neonatal Fc receptor is aimed directly at the transfer node,
      and also lowers the maternal antibody pool that feeds it.
    evidence:
    - reference: PMID:40720970
      reference_title: "Design of a Phase 3, Multicenter, Randomized, Placebo-Controlled, Double-Blind Study of Nipocalimab in Pregnancies at Risk for Fetal and Neonatal Alloimmune Thrombocytopenia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nipocalimab, a neonatal Fc receptor blocker, inhibits transplacental transfer of maternal immunoglobulin G (IgG) and lowers circulating maternal IgG levels."
      explanation: States that the drug acts on transplacental IgG transfer, which is the node it is linked to.
  evidence:
  - reference: PMID:40720970
    reference_title: "Design of a Phase 3, Multicenter, Randomized, Placebo-Controlled, Double-Blind Study of Nipocalimab in Pregnancies at Risk for Fetal and Neonatal Alloimmune Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phase 3 FREESIA-1 study aims to evaluate the safety and efficacy of nipocalimab in at-risk FNAIT pregnancies."
    explanation: Records the trial programme behind this investigational treatment.
  - reference: PMID:41779743
    reference_title: "Anti-HPA-1a fetal-neonatal alloimmune thrombocytopenia: reframing diagnostics, pathophysiology, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Blocking neonatal Fc receptor has emerged as an alternative approach to both reduce maternal anti-HPAa-1a levels and inhibit its transplacental transfer."
    explanation: Independent review support for FcRn blockade as the emerging alternative to IVIG.
- name: Anti-HPA-1a prophylaxis (RLYB212, investigational)
  description: >
    RLYB212, a subcutaneous monoclonal anti-HPA-1a antibody, is in development
    to prevent maternal HPA-1a alloimmunization, on the model of anti-D
    prophylaxis in RhD disease. In a Phase 1b proof-of-concept study using an
    antigen-challenge model of a 30 mL fetal-maternal hemorrhage, it eliminated
    HPA-1a-positive platelets in a concentration-dependent manner and was well
    tolerated. It is investigational and not licensed; there is at present no
    treatment that prevents HPA alloimmunization or FNAIT.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: anti-HPA-1a monoclonal antibody prophylaxis
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-HPA-1a monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Maternal Anti-HPA-1a IgG Alloantibody Production
    description: >
      Prophylaxis clears HPA-1a-positive fetal platelets from the maternal
      circulation before they can immunize, so the target is the maternal
      antibody response rather than any fetal mechanism.
    evidence:
    - reference: PMID:39168139
      reference_title: "A Phase 1b PK/PD Study to Demonstrate Antigen Elimination with RLYB212, A Monoclonal Anti-HPA-1a Antibody for FNAIT Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "support the potential use of RLYB212 as a prophylactic treatment for FNAIT that prevents maternal HPA-1a alloimmunization during at-risk pregnancies"
      explanation: States that the agent is intended to prevent the maternal alloantibody response this node describes.
  evidence:
  - reference: PMID:39168139
    reference_title: "A Phase 1b PK/PD Study to Demonstrate Antigen Elimination with RLYB212, A Monoclonal Anti-HPA-1a Antibody for FNAIT Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RLYB212 achieved rapid elimination of HPA-1a-positive platelets in a concentration-dependent manner"
    explanation: Reports the pharmacodynamic result behind the prophylaxis strategy.
  - reference: PMID:39168139
    reference_title: "A Phase 1b PK/PD Study to Demonstrate Antigen Elimination with RLYB212, A Monoclonal Anti-HPA-1a Antibody for FNAIT Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently there are no treatments available to prevent maternal alloimmunization to HPAs or FNAIT."
    explanation: Records that no licensed prophylaxis exists, which is why this remains investigational.
progression:
- phase: Fetal
  notes: >
    Disease is already present before birth: bleeding can be detected at
    antenatal ultrasound, and the hemorrhage that defines the severe end of the
    spectrum frequently occurs in utero rather than at delivery. In a
    recognized at-risk pregnancy this is the phase antenatal treatment targets.
  evidence:
  - reference: PMID:36108655
    reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bleeding detected at antenatal ultrasound, neonatal thrombocytopenia (<150 × 109 platelets per L), or both in the current or previous pregnancy"
    explanation: Records antenatal ultrasound-detected bleeding as one of the ways the disease presents, placing part of its course before birth.
- phase: Neonatal
  notes: >
    After delivery the platelet count falls to a nadir within the first days of
    life, which is when transfusion is usually given; most affected neonates
    reach a severely low count and about a quarter an extremely low one. The
    course is self-limited as maternal antibody is cleared, so management is a
    matter of carrying the newborn through this window.
  evidence:
  - reference: PMID:36108655
    reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extreme thrombocytopenia (<10 × 109 platelets per L) was reported in 92 (24%) neonates"
    explanation: Quantifies how deep the neonatal nadir reaches in this cohort.
differential_diagnoses:
- name: Other causes of neonatal thrombocytopenia
  description: >
    A thrombocytopenic newborn is worked up for this disease against the other
    causes of neonatal thrombocytopenia. It is the commonest cause of severe
    neonatal thrombocytopenia, and the distinguishing features at presentation
    are quantitative rather than qualitative: a markedly lower platelet nadir
    and a greater need for treatment than in thrombocytopenia from other
    causes. There is no clinical predictor that settles it, so confirmation
    rests on maternal and neonatal HPA typing with antibody testing.
  evidence:
  - reference: PMID:37027241
    reference_title: "Neonatal Thrombocytopenia: Differing Characteristics of NAIT Versus Non-NAIT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While neonatal alloimmune thrombocytopenia (NAIT) is the most common cause of severe neonatal thrombocytopenia good clinical predictors are lacking."
    explanation: States both that this is the leading cause of severe neonatal thrombocytopenia and that clinical features do not discriminate it.
  - reference: PMID:37027241
    reference_title: "Neonatal Thrombocytopenia: Differing Characteristics of NAIT Versus Non-NAIT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "61.5% of NAIT+ infants required treatment compared with 23% of non-NAIT ( P =0.015)"
    explanation: Quantifies the difference in treatment requirement between this disease and other neonatal thrombocytopenias.
animal_models:
- name: Murine anti-beta3 integrin FNAIT model
  species: Mouse
  genotype: Beta3 integrin-deficient dams immunized against wild-type beta3, bred to wild-type males
  publication: PMID:25774504
  description: >
    Pregnancies in beta3-integrin-immunized mice, imaged by high-frequency
    ultrasound. Intracranial hemorrhage occurred only in the anti-beta3 arm and
    not in anti-GPIbalpha-mediated FNAIT despite comparable thrombocytopenia,
    and only the anti-beta3 arm reduced brain and retinal vessel density,
    impaired angiogenic signalling and increased endothelial apoptosis, all of
    which maternal IVIG abrogated.
  modeled_mechanisms:
  - target: Antiendothelial Injury and Impaired Angiogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      This is the model in which the endothelial arm was established as a cause
      of hemorrhage rather than a correlate, by dissociating hemorrhage from the
      platelet count.
    limitations: >
      The antibodies are murine isoantibodies raised against beta3 in a
      knockout dam, not human alloantibodies against the HPA-1a epitope, and the
      mechanism has not been demonstrated in human fetal brain tissue.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >
        The immunogen is murine beta3 in a beta3-null dam, so the response is an
        isoantibody against the whole chain rather than an alloantibody against
        the Leu33 epitope that defines HPA-1a in humans. The endothelial
        mechanism transfers; the epitope specificity does not.
    readouts:
    - name: Brain and retinal vessel density
      target: Antiendothelial Injury and Impaired Angiogenesis
      direction: DECREASED
      interpretation: Structural correlate of the impaired-angiogenesis node in this model.
      evidence:
      - reference: PMID:25774504
        reference_title: Maternal anti-platelet β3 integrins impair angiogenesis and cause intracranial hemorrhage.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Only anti-β3 integrin-mediated FNAIT reduced brain and retina vessel density, impaired angiogenic signaling, and increased endothelial cell apoptosis, all of which were abrogated by maternal administration of intravenous immunoglobulin (IVIG)."
        explanation: Reports the vessel-density and angiogenic-signalling measurements behind this readout, and their rescue by IVIG.
    evidence:
    - reference: PMID:25774504
      reference_title: Maternal anti-platelet β3 integrins impair angiogenesis and cause intracranial hemorrhage.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we found that ICH only occurred in fetuses and neonates with anti-β3 integrin-mediated, but not anti-GPIbα-mediated, FNAIT, despite similar thrombocytopenia in both groups"
      explanation: Supports treating this model as informative for the endothelial arm, by separating hemorrhage from the platelet count.
- name: Dual-humanized FcgammaR FNAIT model
  species: Mouse
  genotype: APLDQ HPA-1a-expressing platelets transferred into mice expressing human FcgammaRs in place of murine FcgammaRs
  publication: PMID:42269082
  description: >
    A model built to test the clearance step specifically: HPA-1a-expressing
    platelets sensitized with human anti-HPA-1a sera are cleared rapidly in
    FcgammaR-humanized recipients, and an FcgammaRIII-blocking monovalent
    antibody reduces that clearance.
  modeled_mechanisms:
  - target: Opsonization and Accelerated Clearance of Fetal Platelets
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >
      Isolates the receptor dependence of the clearance node, which patient
      samples alone cannot establish.
    limitations: >
      Platelet clearance is measured after transfusion into an adult recipient
      rather than across a placenta into a fetus, so the model covers the
      effector step and not the transfer or fetal context.
    readouts:
    - name: Clearance of sensitized HPA-1a-positive platelets
      target: Opsonization and Accelerated Clearance of Fetal Platelets
      direction: DECREASED
      interpretation: Reduced clearance under FcgammaRIII blockade identifies the receptor responsible.
      evidence:
      - reference: PMID:42269082
        reference_title: Inhibition of human FcγRIII prevents platelet destruction in a dual-humanized murine model of FNAIT.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Pretreatment with an FcγRIII-blocking monovalent antibody significantly reduced clearance"
        explanation: Reports the measurement showing FcgammaRIII dependence of the clearance.
    evidence:
    - reference: PMID:42269082
      reference_title: Inhibition of human FcγRIII prevents platelet destruction in a dual-humanized murine model of FNAIT.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Platelets from APLDQ mice sensitized with anti-HPA-1a sera underwent rapid clearance in these FcγR-humanized recipients."
      explanation: Supports treating this model as informative for antibody-mediated clearance of HPA-1a-positive platelets.
clinical_trials:
- name: NCT06449651
  phase: PHASE_III
  status: RECRUITING
  description: >
    FREESIA-1: a placebo-controlled, double-blind phase 3 trial of weekly
    intravenous nipocalimab from 13 to 18 weeks of gestation in HPA-1a
    alloimmunized pregnancies with an HPA-1a-positive fetus and a previously
    affected pregnancy without intracranial hemorrhage. The primary endpoint
    combines fetal death or adjudicated severe bleeding with a birth platelet
    count below 30 x 10^9/L.
  target_phenotypes:
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  - preferred_term: Intracranial hemorrhage
    term:
      id: HP:0002170
      label: Intracranial hemorrhage
  evidence:
  - reference: clinicaltrials:NCT06449651
    reference_title: Double-blind, Randomized, Placebo-controlled Study Evaluating the Safety and Efficacy of Nipocalimab in Reducing the Risk of Fetal and Neonatal Alloimmune Thrombocytopenia (FNAIT) in At-risk Pregnancies
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "to evaluate the effectiveness of nipocalimab compared with placebo in reducing the risk of severe fetal and neonatal alloimmune thrombocytopenia (FNAIT)"
    explanation: The registry record establishing the trial's objective in this disease.
  - reference: PMID:40720970
    reference_title: "Design of a Phase 3, Multicenter, Randomized, Placebo-Controlled, Double-Blind Study of Nipocalimab in Pregnancies at Risk for Fetal and Neonatal Alloimmune Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants will be randomized 2:1 to weekly intravenous nipocalimab or placebo at 13 to 18 weeks of gestation until delivery."
    explanation: Gives the randomization and dosing design described here.
discussions:
- discussion_id: ich_risk_determinants
  prompt: >
    What determines whether a pregnancy affected by anti-HPA-1a FNAIT suffers
    intracranial hemorrhage, given that no predictive factor is available to
    guide antenatal prophylaxis and the relationship to the fetal platelet
    count is loose?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Antiendothelial Injury and Impaired Angiogenesis
  - phenotypes#Intracranial Hemorrhage
  rationale: >
    The entry models two routes to hemorrhage, one through the platelet count
    and one through endothelial injury by the anti-alphaV-beta3 subtype. Which
    dominates in humans is unresolved, and it is the question that decides
    whether hemorrhage risk should be stratified on antibody level, antibody
    subtype, or obstetric history. The gap is practical as well as mechanistic:
    treatment in a subsequent pregnancy is currently allocated largely on
    history.
  evidence:
  - reference: PMID:27283740

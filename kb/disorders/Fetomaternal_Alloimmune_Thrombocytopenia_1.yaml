    snippet: "Anti-HPA-1a antibodies in pooled plasma and in individual samples of 9 of 10 patients with FNAIT induced Fc gamma receptor (FcγR)-dependent platelet phagocytosis in vitro, indicating this as the major contributor to platelet destruction."
    explanation: Identifies Fc-gamma-receptor-dependent phagocytosis as the dominant route of platelet destruction.

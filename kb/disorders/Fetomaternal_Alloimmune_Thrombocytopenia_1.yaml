- name: Chronic Placental Inflammation
  biological_scale: TISSUE
  description: >
    Placentas from HPA-1a alloimmunized pregnancies carry low-grade chronic
    histiocytic intervillositis far more often than those of non-immunized
    HPA-1a-negative controls, a lesion otherwise rare and itself associated
    with fetal growth restriction. Antenatal maternal IVIG did not appear to
    protect against these lesions in the series that described them, so this
    arm is not obviously addressed by the treatment given for the platelet
    count.

  phenotype_term:
    preferred_term: Neurodevelopmental abnormality
    term:
      id: HP:0012759
      label: Neurodevelopmental abnormality
  evidence:
  - reference: PMID:23452741
    reference_title: Fetal/neonatal alloimmune thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "intracranial bleeding which may lead to death or severe sequelae"
    explanation: Supports severe neurological sequelae as an outcome in survivors.
diagnosis:
- name: Maternal and fetal HPA-1 typing with HLA-DRB3*01:01 status
  description: >
    Risk assessment runs as a sequence on the maternal sample: HPA-1a/1b
    genotyping to find the HPA-1b/1b women, HLA-DRB3*01:01 status, anti-HPA-1a
    antibody status, and the fetal HPA-1 genotype. Fetal typing matters because
    a sizeable minority of HPA-1a-negative women carry an HPA-1a-negative fetus
    and are therefore not at risk at all in that pregnancy.
  diagnosis_term:
    preferred_term: HPA-1 and HLA-DRB3*01:01 genotyping
    term:
      id: NCIT:C45447
      label: Genotyping
  evidence:
  - reference: PMID:42733297
    reference_title: "Population Prevalence and Incident HPA-1a Alloimmunisation in Pregnancy: A Prospective, Multi-Ethnic, Natural History Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a sequential screening algorithm applied: maternal HPA-1a/1b genotyping, human leukocyte antigen [HLA]-DRB3*01:01 allele status, anti-HPA-1a antibody status and foetal HPA-1 genotype"
    explanation: States the sequence of typing and antibody tests that defines the at-risk pregnancy.
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Determination of fetal HPA-1 type is important because 15% of HPA-1a-negative women will carry an HPA-1a-negative fetus and therefore not be at risk of FNAIT."
    explanation: Gives the reason fetal HPA-1 typing is part of the diagnostic sequence.
- name: Maternal anti-HPA-1a antibody detection and quantitation
  description: >
    Demonstrating maternal anti-HPA-1a establishes the diagnosis in a
    thrombocytopenic newborn and, in a subsequent pregnancy, the antibody level
    is used to stratify risk. One national programme uses a 3 IU/mL threshold
    to separate low- from high-risk pregnancies. Antibody subtype (anti-beta3,
    anti-alphaIIb-beta3, anti-alphaV-beta3) and Fc core fucosylation are under
    evaluation as further stratifiers rather than being established tests.
  diagnosis_term:
    preferred_term: anti-HPA-1a alloantibody measurement
    term:
      id: NCIT:C214530
      label: Alloantibody Measurement
  evidence:
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in Norway, for example, an Ab threshold of 3 IU/mL is used to distinguish between low- and high-risk pregnancies"
    explanation: Gives the quantitative antibody threshold used in practice to stratify risk.
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "determination of subtypes of anti-HPA-1a (anti-β3, anti-αIIbβ3, and anti-αvβ3) and Fc core fucosylation of anti-HPA-1a IgG, can be used as risk stratification tools"
    explanation: Records the antibody-subtype and glycosylation measures being assessed as risk-stratification tools.
  - reference: PMID:40833869
    reference_title: "Improving prediction of fetal/neonatal intracranial hemorrhage in HPA-1a alloimmunized pregnancies to guide antenatal management: An observational cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anti-HPA-1a levels in pregnancies with ICH outcome were higher (median 29.6 IU/mL, range 0.1-222.1, n = 15) compared to no ICH FNAIT pregnancies (median 10.4 IU/mL, range 0.0-83.1, n = 55; p = 0.046, Mann-Whitney U test)."
    explanation: Quantifies the association between maternal antibody level and the hemorrhage outcome that the measurement is used to stratify.
  - reference: PMID:40833869
    reference_title: "Improving prediction of fetal/neonatal intracranial hemorrhage in HPA-1a alloimmunized pregnancies to guide antenatal management: An observational cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A suggestive anti-HPA-1a threshold of 70 IU/mL was chosen based on receiver operating characteristic (ROC) analysis, with high specificity values (96.4%)."
    explanation: Gives a second, hemorrhage-specific candidate threshold distinct from the 3 IU/mL level used to separate low- from high-risk pregnancies.
- name: Recognition after birth in the absence of screening
  description: >
    There is no routine antenatal screening programme, so a first case is
    normally recognized only after delivery, when an otherwise healthy term
    newborn is found to be thrombocytopenic. Management of later pregnancies is
    then driven largely by that obstetric history.
  markers: neonatal platelet count
  evidence:
  - reference: PMID:33039264

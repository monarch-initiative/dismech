    quote_role: BACKGROUND
    snippet: "Incompatibility of the human platelet antigen-1 (HPA-1) system is the most common cause of fetal/neonatal alloimmune thrombocytopenia (F/NAIT) and is thought to be mediated by accelerated clearance of antibody-opsonized fetal platelets."
    explanation: States accelerated clearance of antibody-opsonized fetal platelets as the mechanism, and HPA-1 incompatibility as the commonest cause.

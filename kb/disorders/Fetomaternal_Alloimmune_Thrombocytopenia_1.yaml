    reference_title: "Anti-HPA-1a fetal-neonatal alloimmune thrombocytopenia: reframing diagnostics, pathophysiology, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "increasing risks of fetal growth restriction and long-term neurodevelopmental impairment"
    explanation: Names fetal growth restriction as a consequence of the alloantibody-driven placental inflammation.
- name: Neurodevelopmental Sequelae
  category: Neurologic
  description: >
    Lifelong neurological disability can follow fetal or neonatal intracranial

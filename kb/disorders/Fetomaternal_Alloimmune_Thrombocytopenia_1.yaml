  rate_per_100000: 67.0
  rate_low: 50.0
  rate_high: 100.0
  rate_denominator: LIVE_BIRTHS
  notes: >
    Commonly quoted clinical frequency of FNAIT, 1 in 1000 to 1 in 2000,
    normalized here to about 67 per 100,000 (range 50 to 100). The review
    states the figure without naming a denominator population or geography, so
    none is asserted here. Read the band against the rate: 1 in 1000 to 1 in
    2000 is 5 to 10 per 10,000, so the quoted range sits at and above the top
    edge of BAND_1_5_PER_10000, and no Orphanet band covers 5 to 10 per 10,000
    at all. The band therefore understates the upper end of the quoted range,
    while ABOVE_1_IN_1000 would overstate it. The disease was granted orphan
    status by the European Medicines Agency in 2011.

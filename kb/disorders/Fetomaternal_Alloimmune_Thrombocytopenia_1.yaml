- name: Antiendothelial Injury and Impaired Angiogenesis
  biological_scale: CELLULAR
  description: >
    A distinct subtype of anti-HPA-1a binds endothelial alphaV-beta3 rather
    than platelet alphaIIb-beta3. This anti-alphaV-beta3 subtype induces
    endothelial apoptosis through caspase-3/7 activation and reactive oxygen
    species, and interferes with endothelial adhesion to vitronectin and with
    tube formation. It is found in mothers whose pregnancies had intracranial
    hemorrhage and not in those whose pregnancies did not.

- name: Opsonization and Accelerated Clearance of Fetal Platelets
  biological_scale: CELLULAR
  description: >
    Anti-HPA-1a IgG binds HPA-1a-positive fetal platelet alphaIIb-beta3,
    opsonizing the platelets for Fc-receptor-mediated clearance by macrophages.
    This accelerated destruction of antibody-opsonized platelets is the
    classical mechanism of the thrombocytopenia.

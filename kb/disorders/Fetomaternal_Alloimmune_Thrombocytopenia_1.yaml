mechanistic_hypotheses:
- hypothesis_group_id: platelet_directed_destruction_and_suppression
  hypothesis_label: Platelet-directed alloantibody destruction and megakaryopoietic suppression
  status: CANONICAL
  description: >
    The default model. Transferred maternal anti-HPA-1a binds HPA-1a on fetal
    platelet alphaIIb-beta3; the opsonized platelets are cleared, and the same
    antibodies also kill early megakaryocytes and their progenitors, so both
    destruction and impaired production lower the count. Bleeding follows from
    the thrombocytopenia, and therapy is aimed at raising the count.
  evidence:
  - reference: PMID:26209661
    reference_title: Suppression of in vitro megakaryopoiesis by maternal sera containing anti-HPA-1a antibodies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "is thought to be mediated by accelerated clearance of antibody-opsonized fetal platelets"
    explanation: States the canonical platelet-destruction model.
  - reference: PMID:26209661
    reference_title: Suppression of in vitro megakaryopoiesis by maternal sera containing anti-HPA-1a antibodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared with control maternal sera, 14 out of 17 F/NAIT sera significantly reduced megakaryocyte (MK) number."
    explanation: Adds the production-failure component to the same platelet-directed model.
- hypothesis_group_id: antiendothelial_alphavbeta3_arm
  hypothesis_label: Antiendothelial anti-alphaV-beta3 injury as the determinant of intracranial hemorrhage
  status: ALTERNATIVE
  description: >
    A mechanistically distinct, antibody-subtype-dependent route in which the
    fraction of anti-HPA-1a reactive with endothelial alphaV-beta3, rather than
    the platelet count, determines whether intracranial hemorrhage occurs. It
    is not a competing explanation of the thrombocytopenia but a competing
    explanation of the bleeding: the subtype is present in mothers of affected
    pregnancies with hemorrhage and absent in those without, injures endothelium
    and impairs angiogenesis, and would predict that antibody-subtype testing
    rather than platelet count stratifies hemorrhage risk.
  evidence:
  - reference: PMID:27283740
    reference_title: Antiendothelial αvβ3 Antibodies Are a Major Cause of Intracranial Bleeding in Fetal/Neonatal Alloimmune Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the composition of the anti-HPA-1a antibody subtype(s) of the mother may determine whether ICH occurs."
    explanation: States the alternative determinant of hemorrhage as the authors frame it.
  - reference: PMID:36581513
    reference_title: "Fetal and neonatal alloimmune thrombocytopenia: Current pathophysiological insights and perspectives for future diagnostics and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Defects in endothelial cells and angiogenesis may therefore contribute to severe anti-HPA-1a associated FNAIT."
    explanation: Independent review support for the endothelial arm as a contributor to severe disease.
phenotypes:
- name: Thrombocytopenia
  category: Hematologic
  description: >
    Fetal and neonatal thrombocytopenia, often severe, is the defining and
    usually isolated finding. Without screening the disease is typically not
    suspected until an otherwise healthy term newborn is found to be
    thrombocytopenic.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:33039264
    reference_title: Fetal and Neonatal Alloimmune Thrombocytopenia-New Prospects for Fetal Risk Assessment of HPA-1a-Negative Pregnant Women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FNAIT is not suspected until an otherwise healthy child, born at term, presents with thrombocytopenia"
    explanation: Describes isolated neonatal thrombocytopenia as the presenting and defining finding.
  sequelae:
  - target: Intracranial Hemorrhage
    description: >
      Severe thrombocytopenia predisposes to intracranial bleeding, the disease's
      most serious complication.
    evidence:
    - reference: PMID:23452741
      reference_title: Fetal/neonatal alloimmune thrombocytopenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One severe consequence of thrombocytopenia is intracranial bleeding which may lead to death or severe sequelae."
      explanation: Names intracranial bleeding as the severe consequence of the thrombocytopenia.
  - target: Non-Intracranial Bleeding
    description: >
      Platelet depletion produces the bleeding outside the central nervous
      system that is the commonest clinical presentation, and which in the
      large majority of cases is mild.
    evidence:
    - reference: PMID:36108655
      reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mild bleeding was diagnosed in 186 (48%) neonates."
      explanation: Records mild bleeding in nearly half of a registry cohort assembled on neonatal thrombocytopenia.
  - target: Petechiae
    description: >
      Petechiae are the usual cutaneous expression of the thrombocytopenia,
      although they are absent in some severely thrombocytopenic newborns.
    evidence:
    - reference: PMID:26564154
      reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In most FNAIT cases, the disease presents as petechiae, hematomas, melena, sometimes hemoptysis, retinal bleeding and hematuria"
      explanation: Supports petechiae as the usual presentation of the thrombocytopenic state.
- name: Intracranial Hemorrhage
  category: Neurologic
  description: >
    Intracranial hemorrhage is the most feared complication, can occur before
    birth, and leads to death or lasting neurological sequelae. Its relationship
    to the platelet count is loose, which is why antibody subtype and history
    rather than count alone drive risk assessment.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Intracranial hemorrhage
    term:
      id: HP:0002170
      label: Intracranial hemorrhage
  evidence:
  - reference: PMID:41779743
    reference_title: "Anti-HPA-1a fetal-neonatal alloimmune thrombocytopenia: reframing diagnostics, pathophysiology, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "can induce fetal-neonatal alloimmune thrombocytopenia (FNAIT), which causes intracranial hemorrhage in 10% to 20% of fetuses/newborns"
    explanation: Gives the 10 to 20 percent frequency band behind the OCCASIONAL value.
  - reference: PMID:27283740
    reference_title: Antiendothelial αvβ3 Antibodies Are a Major Cause of Intracranial Bleeding in Fetal/Neonatal Alloimmune Thrombocytopenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal/neonatal alloimmune thrombocytopenia is a severe bleeding disorder, which can result in intracranial hemorrhage (ICH), leading to death or neurological sequelae."
    explanation: States intracranial hemorrhage as the severe complication and its outcomes.
  sequelae:
  - target: Neurodevelopmental Sequelae
    description: >
      Survivors of intracranial hemorrhage may be left with lifelong
      neurological disability.
    evidence:
    - reference: PMID:26564154
      reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "at risk of intracranial hemorrhage that may result in lifelong disability or death"
      explanation: Supports lifelong disability as a sequela of the intracranial hemorrhage.
- name: Non-Intracranial Bleeding
  category: Hematologic
  description: >
    Bleeding at sites other than the central nervous system is the commonest
    clinical presentation. In an international registry of 389 liveborn
    neonates with FNAIT, mild bleeding was recorded in 48 percent, against 6
    percent with severe bleeding, of which all but one episode was
    intracranial. Non-intracranial bleeding is therefore common while severe
    non-intracranial bleeding is not.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Non-intracranial bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:36108655
    reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild bleeding was diagnosed in 186 (48%) neonates."
    explanation: Gives the 48 percent registry figure behind the FREQUENT value.
  - reference: PMID:36108655
    reference_title: "Postnatal treatment for children with fetal and neonatal alloimmune thrombocytopenia: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe bleeding was diagnosed in 23 (6%) of 389 liveborn neonates, with one having a severe pulmonary haemorrhage and 22 having severe intracranial haemorrhages."
    explanation: Supports the statement that severe bleeding outside the central nervous system was a single case in this registry, so the common non-intracranial bleeding is the mild category.
- name: Petechiae
  category: Dermatologic
  description: >
    Petechiae, hematomas, melena, hematuria, retinal bleeding and occasionally
    hemoptysis are the usual mucocutaneous and mucosal presentation. They are
    not a reliable screen: some severely thrombocytopenic newborns have no
    petechiae at all, which is one stated reason some affected neonates,
    including those with intracranial hemorrhage, are not investigated for
    maternal platelet alloantibodies.
  phenotype_term:
    preferred_term: Petechiae
    term:
      id: HP:0000967
      label: Petechiae
  evidence:
  - reference: PMID:26564154
    reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In most FNAIT cases, the disease presents as petechiae, hematomas, melena, sometimes hemoptysis, retinal bleeding and hematuria"
    explanation: Names petechiae and the accompanying mucocutaneous and mucosal bleeding signs as the usual presentation.
  - reference: PMID:26564154
    reference_title: "Fetal/Neonatal Alloimmune Thrombocytopenia: Pathogenesis, Diagnostics and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "there are some severely thrombocytopenic newborns who do not have any petechiae, and this may be the reason why some FNAIT cases with ICH are not examined for maternal antibodies against platelets"
    explanation: Supports the caveat in this phenotype's description that petechiae can be absent despite severe thrombocytopenia, so their absence does not exclude the disease.
- name: Fetal Growth Restriction
  category: Growth
  description: >
    Impaired fetal growth is reported in anti-HPA-1a alloimmunized pregnancies

name: Endomyocardial Fibrosis
creation_date: '2026-08-09T00:00:00Z'
category: Complex
description: >
  Endomyocardial fibrosis is the most common restrictive cardiomyopathy worldwide and a
  disease of poverty, endemic to equatorial Africa, South Asia, and parts of South America.
  Dense fibrous scar deposits on the endocardium of the apex and inflow tract of one or both
  ventricles, obliterating cavity volume and tethering the papillary muscles and chordae so
  that the atrioventricular valves leak. The result is severe restrictive physiology with
  atrioventricular regurgitation and relatively preserved ejection fraction, presenting as
  progressive heart failure in children and young adults. The prevailing mechanistic model
  runs from a chronic antigenic or toxic stimulus, through sustained eosinophilia in a
  genetically susceptible host, to eosinophil-granule-mediated endocardial injury, mural
  thrombosis, and finally organisation into acellular fibrous scar, following the three
  stages Davies described. That model is inferred largely from hypereosinophilic syndrome,
  in which the same endocardial lesion is directly documented, rather than from tropical
  endomyocardial fibrosis itself, where the acute eosinophilic phase is almost never caught.
  Its unique geography remains unexplained after eight decades, and it is the clearest
  example in this knowledge base of a disease whose mechanism is limited by where it occurs
  rather than by its biology.
disease_term:
  preferred_term: endomyocardial fibrosis
  term:
    id: MONDO:0006746
    label: endomyocardial fibrosis
parents:
- Restrictive cardiomyopathy
synonyms:
- Davies disease
- Tropical endomyocardial fibrosis
- African endomyocardial fibrosis
- Endomyocardial sclerosis
- Obscure African cardiomyopathy
pathophysiology:
- name: Chronic antigenic or toxic stimulus in a susceptible host
  description: >
    The initiating exposure is not established. Chronic helminth infection, malaria,
    cassava-based diets with protein deprivation, and geochemical exposures such as cerium in
    monazite-rich soils have all been proposed, and none accounts for the disease's
    distribution. The strongest structural observation is negative: hypotheses that explain
    why the disease occurs where it does fail to explain why it does not occur in other
    regions with the same parasite burden or the same diet. What is well supported is that
    exposure alone is insufficient, since only a minority of people living in identical
    conditions develop the disease.
  biological_scale: ORGANISM
  role: trigger
  conforms_to: "fibrotic_response#Tissue Injury"
  downstream:
  - target: Sustained eosinophilia and Th2-skewed immune activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      A chronic antigenic stimulus in a susceptible host is proposed to drive persistent
      eosinophilia, which is the first step of the mechanistic model.
    evidence:
    - reference: PMID:32420110
      reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dietary, environmental and infectious factors seem to combine in susceptible individuals to give rise to an inflammatory process that leads to endomyocardial damage and scar formation."
      explanation: States the whole proposed chain compactly, with the honest hedging the evidence supports.
  evidence:
  - reference: PMID:18301727
    reference_title: "Endomyocardial fibrosis: still a mystery after 60 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite several hypotheses regarding cause, no account of the etiology of this disease has yet fully explained its unique geographical distribution."
    explanation: The systematic review's central negative conclusion, which is why this node is deliberately unspecific.
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its etiology remains poorly understood, with proposed contributors including malnutrition, parasitic infections, hypereosinophilia, and genetic predisposition"
    explanation: Enumerates the candidate exposures without privileging any, matching the state of the evidence.
- name: Sustained eosinophilia and Th2-skewed immune activation
  description: >
    Persistent eosinophilia is the pivot of the accepted model. In hypereosinophilic
    syndrome, where the eosinophil count is by definition high and the cardiac disease is
    followed prospectively, eosinophil-mediated endomyocardial damage is directly
    established. In tropical endomyocardial fibrosis, eosinophilia is variably present and
    typically absent by the time the fibrotic stage is diagnosed, so the inference runs
    backwards from a shared end-stage lesion. That asymmetry is real and is curated as such
    rather than smoothed over.
  biological_scale: ORGANISM
  role: mechanism
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  cell_types:
  - preferred_term: Eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Eosinophil degranulation and endocardial injury
    causal_link_type: DIRECT
    description: >
      Eosinophils infiltrate the subendocardium and release granule proteins that damage
      endothelium and subendocardial myocytes.
    evidence:
    - reference: PMID:34172539
      reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At the early generally asymptomatic stage, related to subendocardial eosinophilic infiltrates, elevation of the biomarker of cardiac damage (serum troponin) and cardiac MRI are the best tools for diagnosis."
      explanation: Establishes the subendocardial eosinophilic infiltrate as the earliest cardiac stage, with troponin release as evidence of concurrent myocardial damage.
  evidence:
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eosinophil-mediated endomyocardial damage is a well-known complication in patients with hypereosinophilic syndromes (HES)."
    explanation: The direct evidence for eosinophil-mediated endomyocardial damage comes from hypereosinophilic syndrome, which is the model the tropical disease is read through.
  - reference: PMID:31414216
    reference_title: "Endomyocardial fibrosis: past, present, and future."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although its pathogenesis and etiology are not fully understood, its pathology resembles conditions such as eosinophilic cardiomyopathy and hypereosinophilic syndrome."
    explanation: States the pathologic resemblance that licenses the inference from hypereosinophilic syndrome to tropical endomyocardial fibrosis; PARTIAL because resemblance is not identity.
  - reference: PMID:25303100
    reference_title: "Plasma cytokine profile in tropical endomyocardial fibrosis: predominance of TNF-a, IL-4 and IL-10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that TNF-α, IL-6, IL-4, and IL-10 were each detected in at least 74% of tested sera, and plasma levels of IL-10, IL-4, and TNF-α were significantly higher than those of controls."
    explanation: Direct measurement of the Th2 cytokines IL-4 and IL-10 in 27 tropical endomyocardial fibrosis patients against healthy controls, which is what supports the Th2 half of this node's claim.
  - reference: PMID:25303100
    reference_title: "Plasma cytokine profile in tropical endomyocardial fibrosis: predominance of TNF-a, IL-4 and IL-10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mixed pro- and anti-inflammatory/Th2circulating cytokine profile in EMF is consistent with the presence of a persistent inflammatory stimulus."
    explanation: The authors' own reading of the profile as Th2-skewed and as evidence of a persistent stimulus, which is the state this node asserts. Note the source's own typographical run-together of Th2 and circulating, reproduced verbatim.
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests eosinophilia acts as a disease amplifier rather than a universal initiator."
    explanation: Qualifies the causal weight of eosinophilia in this node; PARTIAL because it constrains rather than supports the claim, and it is the reason the eosinophil arm is curated as necessary-but-not-sufficient.
- name: Eosinophil degranulation and endocardial injury
  description: >
    Degranulating eosinophils release cationic granule proteins into the subendocardium,
    injuring endocardial endothelium and the subendocardial layer of myocytes. This is
    Davies stage one, the acute necrotic phase, lasting some months. It is the stage almost
    never observed in tropical endomyocardial fibrosis, because patients in endemic areas do
    not present until they are in heart failure, and it is the single largest gap in the
    evidence for this disease.
  biological_scale: CELLULAR
  role: mechanism
  cell_types:
  - preferred_term: Eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: Endocardial endothelial cell
    term:
      id: CL:0002350
      label: endocardial cell
  biological_processes:
  - preferred_term: eosinophil degranulation
    term:
      id: GO:0043308
      label: eosinophil degranulation
    modifier: INCREASED
  locations:
  - preferred_term: Endocardium
    term:
      id: UBERON:0002165
      label: endocardium
  downstream:
  - target: Mural thrombus formation on the damaged endocardium
    causal_link_type: DIRECT
    description: >
      The denuded, injured endocardial surface becomes thrombogenic, and mural thrombus
      forms over it during the second stage.
    evidence:
    - reference: PMID:34172539
      reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As disease progresses, patients typically develop intracardiac mural thrombi and may experience variable degrees of heart failure due to valve damage and/or subendocardial fibrosis"
      explanation: Sets out the ordered progression from eosinophilic infiltrate to mural thrombus to subendocardial fibrosis and valve damage.
  evidence:
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypereosinophilia likely contributes to early myocardial necrosis through eosinophil granule proteins (major basic protein, eosinophil peroxidase), initiating an inflammatory-fibrotic cascade"
    explanation: Names the specific granule proteins and the injury they cause, in a source about endomyocardial fibrosis itself rather than about hypereosinophilic syndrome.
  - reference: PMID:38540269
    reference_title: "Eosinophilic Myocarditis: From Bench to Bedside."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ranging from mild asymptomatic disease to multifocal widespread infiltrates associated with myocardial necrosis, thrombotic complications, and endomyocardial fibrosis"
    explanation: Links eosinophilic infiltration to myocardial necrosis, thrombosis, and endomyocardial fibrosis as a single severity spectrum.
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "may be non-contributive due to sampling issues or eosinophil degranulation or replacement by fibrosis"
    explanation: Documents that eosinophil degranulation itself erases the diagnostic evidence of eosinophilic infiltration, which is exactly why the acute stage is under-observed; PARTIAL because the statement is about biopsy yield rather than the mechanism directly.
- name: Mural thrombus formation on the damaged endocardium
  description: >
    Davies stage two, beginning around ten months and running over years. Thrombus deposits
    on the injured endocardial surface, preferentially at the ventricular apex and beneath the
    posterior mitral leaflet, and is then organised rather than lysed. This is the step that
    converts an inflammatory injury into a structural one, and it is also the source of the
    systemic and pulmonary thromboembolism that complicates the disease independently.
  biological_scale: TISSUE
  role: mechanism
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  locations:
  - preferred_term: Endocardium
    term:
      id: UBERON:0002165
      label: endocardium
  downstream:
  - target: Fibroblast activation and excessive collagen deposition
    causal_link_type: DIRECT
    description: >
      Organisation of the mural thrombus recruits and activates fibroblasts, which lay down
      collagen in the subendocardial layer.
    evidence:
    - reference: PMID:32420110
      reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "give rise to an inflammatory process that leads to endomyocardial damage and scar formation"
      explanation: States the inflammation-to-scar transition; PARTIAL because the thrombus-organisation step specifically is not itemised.
  - target: Systemic and pulmonary thromboembolism
    causal_link_type: DIRECT
    description: >
      Fragments of intracardiac thrombus embolise.
    evidence:
    - reference: PMID:32420110
      reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "complications such as chronic heart failure, thromboembolism and arrhythmia are already present"
      explanation: Names thromboembolism among the complications present at the typical late point of diagnosis.
  evidence:
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As disease progresses, patients typically develop intracardiac mural thrombi"
    explanation: Places mural thrombus formation as the intermediate stage of the eosinophilic endocardial disease sequence.
- name: Anti-myocardial autoantibody response
  description: >
    Circulating IgG against myocardial proteins is present in about half of patients and in
    a tenth of controls, and its intensity tracks disease activity. It is curated as a
    parallel amplifying arm rather than as a step in the main chain, because the direction of
    causation is not established: antibodies could sustain injury after the eosinophilic
    stimulus has gone, or could simply mark exposure of intracellular myocardial antigens by
    injury that has already occurred. The distinction matters clinically, since only the
    first reading would justify immunosuppression.
  biological_scale: ORGANISM
  role: mechanism
  downstream:
  - target: Fibroblast activation and excessive collagen deposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Continuing autoimmune myocardial injury is proposed to perpetuate the fibrogenic
      stimulus after the initiating eosinophilia has resolved.
    evidence:
    - reference: PMID:20422043
      reference_title: "Presence of circulating anti-myosin antibodies in endomyocardial fibrosis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "These immune markers seem to be related with activity and might provide an adjunct tool for diagnosis and classification of EMF"
      explanation: Establishes the correlation with disease activity that motivates the proposed edge; PARTIAL because the authors explicitly stop short of asserting causation.
  evidence:
  - reference: PMID:20422043
    reference_title: "Presence of circulating anti-myosin antibodies in endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgG reactivity against myocardial proteins was stronger and more frequent in patients with EMF when compared to controls (30/56; 53.6% vs. 1/10; 10%, respectively)."
    explanation: Quantifies the autoantibody finding against healthy controls in 56 patients.
  - reference: PMID:20422043
    reference_title: "Presence of circulating anti-myosin antibodies in endomyocardial fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Further research is needed to clarify the role of autoimmunity in the pathogenesis of EMF."
    explanation: The authors' own statement that the causal role is unresolved, which is why this node is curated as a parallel arm.
- name: Fibroblast activation and excessive collagen deposition
  description: >
    Subendocardial fibroblasts are activated and deposit collagen and other matrix, the
    generic fibrogenic step this disease shares with organ fibrosis elsewhere. What is
    unusual is the trigger, an intraluminal eosinophil-driven injury with an organising
    thrombus rather than a parenchymal insult, and the site, a thin subendothelial layer
    rather than the interstitium of the organ.
  biological_scale: CELLULAR
  role: mechanism
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  cell_types:
  - preferred_term: Cardiac fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: fibroblast activation
    term:
      id: GO:0072537
      label: fibroblast activation
    modifier: INCREASED
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  downstream:
  - target: Dense endocardial fibrous scar
    causal_link_type: DIRECT
    description: >
      Sustained matrix deposition produces the dense acellular fibrocollagenous endocardial
      thickening that defines the disease.
    evidence:
    - reference: PMID:31414216
      reference_title: "Endomyocardial fibrosis: past, present, and future."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is characterized by fibrotic thickening of the endocardium and myocardium of one or both ventricles."
      explanation: The defining structural lesion this step produces.
  evidence:
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A key feature is fibroblast overactivation leading to excessive extracellular matrix deposition, primarily fibrillar collagen, which replaces normal myocardium and results in myocardial stiffness and electromechanical uncoupling."
    explanation: The direct statement of this node, naming the cell, the matrix product, and the mechanical consequence.
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Persistent activation of these pathways amplifies pro-fibrotic signaling (e.g., SMAD2/3 and YAP/TAZ), leading to chronic endocardial scarring"
    explanation: Names the intracellular pro-fibrotic signalling that sustains the activated state.
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an inflammatory process that leads to endomyocardial damage and scar formation"
    explanation: States the inflammation-to-scar transition that this node represents.
- name: Dense endocardial fibrous scar
  description: >
    Davies stage three and the irreversible end-state. The endocardium thickens to
    millimetres of dense, largely acellular fibrocollagenous tissue, measured at a mean of
    three millimetres in an operative series, with a lymphocyte-predominant infiltrate and
    subendocardial neovascularisation. The myocardium beneath is comparatively spared, which
    is why systolic function is preserved and why surgical decortication is anatomically
    feasible at all.
  biological_scale: TISSUE
  role: consequence
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  locations:
  - preferred_term: Endocardium
    term:
      id: UBERON:0002165
      label: endocardium
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  downstream:
  - target: Apical and inflow-tract cavity obliteration
    causal_link_type: DIRECT
    description: >
      Scar fills the trabecular recesses of the apex and inflow tract, reducing cavity volume.
    evidence:
    - reference: PMID:31414216
      reference_title: "Endomyocardial fibrosis: past, present, and future."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Extensive fibrosis of the ventricular endocardium causing architectural distortion, impaired filling, and valvular insufficiency defines the disease."
      explanation: Names architectural distortion, impaired filling, and valve insufficiency as the three structural consequences of the scar.
  - target: Papillary muscle and chordal tethering
    causal_link_type: DIRECT
    description: >
      Scar extends onto and around the subvalvular apparatus, fixing the papillary muscles
      and chordae to the ventricular wall.
    evidence:
    - reference: PMID:32420101
      reference_title: "Endomyocardial fibrosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All but one female patient with mild ventricular lesions and no valvular involvement had severe atrioventricular valve regurgitation"
      explanation: Operative series showing that atrioventricular valve regurgitation accompanies ventricular involvement in all but the mildest cases.
  evidence:
  - reference: PMID:32420101
    reference_title: "Endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean endocardial thickness was 3,000 (±1519) µm."
    explanation: Direct operative measurement of the scar thickness in 55 patients.
  - reference: PMID:32420101
    reference_title: "Endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The echocardiographic changes corresponded well to the findings on surgery and histopathology."
    explanation: Confirms that the echocardiographically defined lesion is the same lesion seen at surgery and on histology.
- name: Apical and inflow-tract cavity obliteration
  description: >
    Fibrous obliteration of the apex and inflow tract removes the part of the ventricle that
    would otherwise accommodate diastolic filling. The apex takes on the characteristic
    rounded, retracted appearance on echocardiography that gives the diagnosis.
  biological_scale: TISSUE
  role: consequence
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  locations:
  - preferred_term: Left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  - preferred_term: Right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  downstream:
  - target: Restrictive diastolic physiology
    causal_link_type: DIRECT
    description: >
      Loss of compliant cavity volume raises filling pressures for any given volume.
    evidence:
    - reference: PMID:31414216
      reference_title: "Endomyocardial fibrosis: past, present, and future."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Extensive fibrosis of the ventricular endocardium causing architectural distortion, impaired filling, and valvular insufficiency defines the disease."
      explanation: Links the architectural distortion directly to impaired filling.
  evidence:
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Characterized by fibrotic thickening of the ventricular endocardium, EMF leads to restrictive physiology, atrioventricular valve dysfunction, and progressive heart failure."
    explanation: The full downstream sequence from the fibrous lesion to heart failure.
- name: Papillary muscle and chordal tethering
  description: >
    The subvalvular apparatus is drawn into and immobilised by the scar, so the leaflets
    cannot coapt. The mitral regurgitation of this disease is therefore mechanical and
    subvalvular in origin, not a leaflet disease, which is why valve repair addresses the
    tethering rather than the leaflets and why decortication is done at the same operation.
  biological_scale: TISSUE
  role: consequence
  locations:
  - preferred_term: Papillary muscle of heart
    term:
      id: UBERON:0002494
      label: papillary muscle of heart
  downstream:
  - target: Atrioventricular valve regurgitation
    causal_link_type: DIRECT
    description: >
      Tethered chordae prevent leaflet coaptation, producing mitral or tricuspid
      regurgitation.
    evidence:
    - reference: PMID:32420101
      reference_title: "Endomyocardial fibrosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All but one female patient with mild ventricular lesions and no valvular involvement had severe atrioventricular valve regurgitation"
      explanation: Operative confirmation that ventricular scar and valve regurgitation travel together.
  evidence:
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMF leads to restrictive physiology, atrioventricular valve dysfunction, and progressive heart failure"
    explanation: Names atrioventricular valve dysfunction as a defining consequence alongside the restrictive physiology.
- name: Atrioventricular valve regurgitation
  description: >
    Mitral, tricuspid, or both, depending on which ventricle is involved, and typically
    severe by the time of presentation. It compounds the restrictive physiology by loading
    atria that are already facing high ventricular filling pressures.
  biological_scale: ORGANISM
  role: consequence
  locations:
  - preferred_term: Mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  - preferred_term: Tricuspid valve
    term:
      id: UBERON:0002134
      label: tricuspid valve
  downstream:
  - target: Atrial dilatation and atrial fibrillation
    causal_link_type: DIRECT
    description: >
      Regurgitant volume dilates the atria, creating the substrate for atrial fibrillation.
    evidence:
    - reference: PMID:32420110
      reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "complications such as chronic heart failure, thromboembolism and arrhythmia are already present"
      explanation: Names arrhythmia among the established complications; PARTIAL because the atrial-dilatation mechanism is not itemised.
  evidence:
  - reference: PMID:32420101
    reference_title: "Endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had severe atrioventricular valve regurgitation with valves considered suitable for both replacements"
    explanation: Operative series documenting the severity of the regurgitation.
- name: Restrictive diastolic physiology
  description: >
    Ventricles that cannot fill, with preserved contraction of what myocardium remains. This
    is the haemodynamic signature of the disease and the reason it sits in the restrictive
    rather than the dilated or hypertrophic category, and it explains why ejection fraction
    is a useless measure of severity here.
  biological_scale: ORGANISM
  role: consequence
  downstream:
  - target: Congestive heart failure
    causal_link_type: DIRECT
    description: >
      High filling pressures transmit backwards, producing systemic venous congestion in
      right-sided disease and pulmonary congestion in left-sided disease.
    evidence:
    - reference: PMID:41399600
      reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "EMF leads to restrictive physiology, atrioventricular valve dysfunction, and progressive heart failure"
      explanation: The restrictive-physiology-to-heart-failure edge stated directly.
  evidence:
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endomyocardial fibrosis is the most common restrictive cardiomyopathy worldwide."
    explanation: Places the disease in the restrictive category, and quantifies its global significance within it.
- name: Atrial dilatation and atrial fibrillation
  description: >
    Massive biatrial dilatation is characteristic, driven by both the restrictive ventricles
    and the valve regurgitation, and brings atrial fibrillation with its own thromboembolic
    risk on top of the intracardiac mural thrombus already present.
  biological_scale: ORGANISM
  role: consequence
  downstream:
  - target: Systemic and pulmonary thromboembolism
    causal_link_type: DIRECT
    description: >
      Atrial fibrillation in dilated atria adds a second source of intracardiac thrombus.
    evidence:
    - reference: PMID:32420110
      reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "complications such as chronic heart failure, thromboembolism and arrhythmia are already present"

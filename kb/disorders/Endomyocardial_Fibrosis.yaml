progression:
- phase: Acute necrotic stage
  notes: >
    Davies stage one, lasting up to about five months: eosinophilic infiltration of the
    subendocardium with myocyte necrosis and troponin release. In hypereosinophilic syndrome
    this stage is generally asymptomatic and detectable by troponin and cardiac magnetic
    resonance. In tropical endomyocardial fibrosis it is almost never observed, because
    patients in endemic areas do not reach care until heart failure has developed.
  evidence:
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the early generally asymptomatic stage, related to subendocardial eosinophilic infiltrates, elevation of the biomarker of cardiac damage (serum troponin) and cardiac MRI are the best tools for diagnosis."
    explanation: Characterises the early stage and the tools that detect it.
- phase: Thrombotic stage
  notes: >
    Davies stage two, beginning around ten months and running over years: mural thrombus
    forms over the damaged endocardium at the apex and beneath the posterior mitral leaflet,
    and is organised rather than lysed.
  evidence:
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As disease progresses, patients typically develop intracardiac mural thrombi"
    explanation: Places mural thrombus as the intermediate stage of the sequence.
- phase: Fibrotic stage
  notes: >
    Davies stage three: dense acellular endocardial scar, restrictive physiology, and
    atrioventricular regurgitation. This stage is irreversible, and it is where nearly all
    diagnosis happens. One-third to one-half of patients with advanced disease die within two
    years.
  evidence:
  - reference: PMID:31414216
    reference_title: "Endomyocardial fibrosis: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medical care currently remains very challenging as one-third to half of patients with an advanced disease die within 2 years."
    explanation: Quantifies the prognosis of the fibrotic stage.
- phase: Subclinical detected disease
  notes: >
    Population echocardiographic screening reveals a large reservoir of the disease that
    never reaches clinical attention. In rural Mozambique, only 22.7 percent of screen-detected
    cases were symptomatic, and most had mild-to-moderate structural abnormalities. Whether
    these represent early disease destined to progress, or a stable non-progressive form, is
    unknown and is arguably the most consequential open question about the natural history.
  evidence:
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected subjects had mild-to-moderate structural and functional echocardiographic abnormalities. Only 48 persons with endomyocardial fibrosis (22.7%) were symptomatic."
    explanation: Documents the large asymptomatic reservoir revealed by population screening.
diagnosis:
- name: Transthoracic echocardiography
  description: >
    The primary diagnostic tool, and the only practical one in the settings where the disease
    occurs. It shows apical obliteration, endocardial thickening, subvalvular tethering with
    atrioventricular regurgitation, and biatrial dilatation, and it detects asymptomatic
    disease that would otherwise be invisible. Standardised criteria and a severity score
    make it usable for population screening.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our research has shown that echocardiographic screening using standard criteria adds sensitivity and precision to the diagnosis, particularly in asymptomatic disease, providing an opportunity for longitudinal community-based research."
    explanation: Establishes standardised echocardiographic screening as the method that made asymptomatic disease detectable.
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used transthoracic echocardiography to determine the prevalence of endomyocardial fibrosis in a rural area of Mozambique."
    explanation: The method used in the population study that defined the disease's true frequency.
- name: Cardiac magnetic resonance imaging
  description: >
    Superior tissue characterisation, able to separate the inflammatory from the fibrotic
    stage and to demonstrate the subendocardial scar and adherent thrombus. Its practical
    relevance in endemic settings is limited by availability, which is itself part of why the
    disease is under-studied.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Echocardiography remains the primary diagnostic tool, especially in resource-limited settings, while cardiac MRI offers superior tissue characterization."
    explanation: States the division of labour between the two imaging modalities and the reason for it.
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "New imaging modalities such as strain imaging and specific sequences in MRI offer the perspective of detecting subtle perturbations and distinguishing inflammatory versus fibrotic stages."
    explanation: Documents the specific capability that matters mechanistically, separating the reversible from the irreversible stage.
- name: Endomyocardial biopsy
  description: >
    Occasionally used, chiefly where an eosinophilic cause is suspected but the blood count is
    not informative. Its yield is limited in a characteristic way: by the time fibrosis is
    established the eosinophils have degranulated or been replaced, so a negative biopsy does
    not exclude an eosinophilic origin. That is a mechanistically informative limitation, not
    just a technical one.
  diagnosis_term:
    preferred_term: endomyocardial biopsy
    term:
      id: NCIT:C51674
      label: Endomyocardial Biopsy
  evidence:
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endomyocardial biopsy may help in difficult settings, namely, when blood eosinophilia is not prominent, but may be non-contributive due to sampling issues or eosinophil degranulation or replacement by fibrosis"
    explanation: States both the indication and the specific reason the test under-detects the mechanism it is looking for.
treatments:
- name: Endocardial decortication with atrioventricular valve repair or replacement
  description: >
    The only intervention that changes the course of established disease. The fibrous
    endocardial peel is stripped from the ventricle to restore cavity volume and compliance,
    and the tethered atrioventricular valve is repaired or replaced at the same operation.
    Operative risk is high and the procedure is available to almost none of the people who
    need it, which is the defining inequity of this disease rather than a technical
    limitation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Dense endocardial fibrous scar
    treatment_effect: BYPASSES
    description: >
      Surgical removal of the fibrous peel physically relieves the restriction the scar
      imposes, without addressing the process that produced it.
    evidence:
    - reference: PMID:32420110
      reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Open-heart surgery to detach the endocardial fibrous tissue and repair the atrioventricular valve, remains the last resource to prolong patients' survival."
      explanation: Describes both components of the operation and its status as the only survival-prolonging option.
  evidence:
  - reference: PMID:31414216
    reference_title: "Endomyocardial fibrosis: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery in the correct setting can increase survival and especially in patients with advanced heart failure."
    explanation: States the survival benefit and its conditionality on setting.
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical intervention-particularly endocardial decortication and valve repair-remains the definitive treatment for advanced cases, though it carries high operative risk"
    explanation: Names the specific operation and states its risk honestly.
- name: Atrioventricular valve replacement
  description: >
    Where the subvalvular tethering is too extensive for repair, the valve is replaced. In an
    operative series of 55 children, 45 were replaced and nine repaired, and the replaced
    patients were older, which suggests the window for repair closes as the scar advances.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: valve replacement
    term:
      id: NCIT:C168093
      label: Valve Replacement
  target_mechanisms:
  - target: Atrioventricular valve regurgitation
    treatment_effect: BYPASSES
    description: >
      Prosthetic replacement restores valve competence where the tethered native apparatus
      cannot be made to coapt.
    evidence:
    - reference: PMID:32420101
      reference_title: "Endomyocardial fibrosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "45 patients mean age 6.0 (±3.1) and repair nine patients mean age 3.8 (±2.9)"
      explanation: Gives the split between replacement and repair and the age difference between the two groups.
  evidence:
  - reference: PMID:32420101
    reference_title: "Endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with valves considered suitable for both replacements"
    explanation: Operative assessment that the tethered valves required prosthetic replacement.
- name: Diuretic therapy
  description: >
    Palliative decongestion for the ascites and oedema of right-sided disease and the
    pulmonary congestion of left-sided disease. It relieves symptoms and does nothing to the
    scar.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Congestive heart failure
    treatment_effect: MODULATES
    description: >
      Volume reduction lowers filling pressures and relieves congestion without altering the
      restrictive physiology that causes it.
    evidence:
    - reference: PMID:41399600
      reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment is largely symptomatic, with diuretics, anticoagulants, and antiarrhythmics offering palliative benefit."
      explanation: States the palliative role of diuretics explicitly, with no claim of disease modification.
  evidence:
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has no specific treatment and carries a poor prognosis"
    explanation: The absence of disease-specific therapy is why management is symptomatic.
- name: Anticoagulation
  description: >
    Directed at the intracardiac thrombus and the atrial fibrillation, both of which are
    intrinsic to the disease rather than incidental. Like diuresis, it is palliative.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_mechanisms:
  - target: Systemic and pulmonary thromboembolism
    treatment_effect: INHIBITS
    description: >
      Anticoagulation reduces propagation and embolisation of intracardiac thrombus.
    evidence:
    - reference: PMID:41399600
      reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment is largely symptomatic, with diuretics, anticoagulants, and antiarrhythmics offering palliative benefit."
      explanation: Names anticoagulation among the palliative measures.
  evidence:
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complications such as chronic heart failure, thromboembolism and arrhythmia are already present"
    explanation: The thromboembolic complication anticoagulation is directed at.
- name: Antiarrhythmic therapy
  description: >
    Rate or rhythm control for the atrial fibrillation that arises on the dilated-atrium
    substrate. Palliative, and in practice often combined with anticoagulation for the same
    rhythm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Atrial dilatation and atrial fibrillation
    treatment_effect: MODULATES
    description: >
      Antiarrhythmic drugs address the rhythm disturbance without affecting the atrial
      dilatation that generates it.
    evidence:
    - reference: PMID:41399600
      reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment is largely symptomatic, with diuretics, anticoagulants, and antiarrhythmics offering palliative benefit."
      explanation: Names antiarrhythmic therapy among the palliative measures.
  evidence:
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "complications such as chronic heart failure, thromboembolism and arrhythmia are already present"
    explanation: The arrhythmia this treatment addresses; PARTIAL because the source names the complication rather than its management.
genetic:
- name: HLA-B
  gene_term:
    preferred_term: HLA-B
    term:
      id: hgnc:4932
      label: HLA-B
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    HLA-B*58 occurred more frequently in Mozambican patients with endomyocardial fibrosis
    than in ethnically matched controls. This is one of only two loci from the only formal
    genetic study of the disease, in 71 patients and 137 controls, and it has not been
    replicated or followed by a genome-wide study. It is curated as susceptibility rather
    than causation, consistent with the model in which genotype determines who among the
    exposed develops fibrosis.
  evidence:
  - reference: PMID:25780800
    reference_title: "Genetic susceptibility to endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with EMF patients being more likely than controls to have the HLA-B*58 allele in Mozambique (p-0.03)"
    explanation: The reported association with its p value, in the study that is the sole formal genetic investigation of this disease.
- name: HLA-A
  gene_term:
    preferred_term: HLA-A
    term:
      id: hgnc:4931
      label: HLA-A
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    HLA-A*02:02 occurred more frequently in Ugandan patients than in matched controls. That
    the two populations in the same study yielded different associated alleles is itself
    informative: it is compatible with population-specific alleles tagging a shared
    immune-response mechanism, and equally compatible with two underpowered false positives.
    No replication exists.
  evidence:
  - reference: PMID:25780800
    reference_title: "Genetic susceptibility to endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the HLA-A*02:02 in Uganda (p = 0.005)"
    explanation: The second reported association, in the Ugandan arm of the same two-centre study.
biochemical:
- name: Circulating anti-myocardial IgG
  presence: INCREASED
  notes: >
    Present in 53.6 percent of endomyocardial fibrosis patients versus 10 percent of healthy
    controls, with the strongest reactivity against myocardial proteins of 35, 42, and 70
    kilodaltons. Reactivity correlates with disease activity, which is what makes it a
    candidate activity marker as well as a candidate mechanism. Whether it identifies
    patients who would benefit from immunosuppression is untested.
  evidence:
  - reference: PMID:20422043
    reference_title: "Presence of circulating anti-myosin antibodies in endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMF patients showed greater frequency and reactivity of IgG antibodies against myocardial proteins of molecular weights 35 kD, 42 kD and 70 kD"
    explanation: Identifies the specific antigenic targets and the direction of the difference from controls.
prevalence:
- population: Rural Mozambique, all ages, echocardiographic population screen
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 19800.0
  notes: >
    An estimated 19.8 percent of a random cluster sample of 1063 subjects had
    echocardiographic endomyocardial fibrosis, with a peak of 28.1 percent in the 10 to 19
    year age group. This is the figure that reframed the disease from a rare referral
    diagnosis to a major endemic public-health problem, and it is a screen-detected
    prevalence rather than a clinical one.
  evidence:
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated overall prevalence of endomyocardial fibrosis was 19.8%, or 211 of 1063 subjects"
    explanation: The primary prevalence estimate from the only population-based study.
- population: Kampala, Uganda, patients referred for echocardiography
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >
    The disease accounts for 20 percent of heart disease patients referred for
    echocardiography in Kampala. This is a referral-population figure, not a population
    prevalence, and is recorded to document the clinical burden in endemic centres.
  evidence:
  - reference: PMID:18301727
    reference_title: "Endomyocardial fibrosis: still a mystery after 60 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Kampala, the disease accounts for 20% of heart disease patients referred for echocardiography."
    explanation: Quantifies the referral burden in a historically endemic centre.
differential_diagnoses:
- name: Constrictive pericarditis
  description: >
    The classic mimic, since both produce restrictive filling with preserved systolic
    function and prominent right-sided congestion. Imaging separates them by locating the
    lesion: a thickened, adherent pericardium in constriction versus a thickened endocardium
    with an obliterated apex and tethered subvalvular apparatus in endomyocardial fibrosis.
    The distinction matters because pericardiectomy and endocardial decortication are
    different operations.
  evidence:
  - reference: PMID:41399600
    reference_title: "A Narrative Review on Endomyocardial Fibrosis: Unraveling an Under-Recognized Tropical Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is often delayed due to overlap with other causes of heart failure and limited access to advanced imaging."
    explanation: States the diagnostic-overlap problem this differential belongs to; PARTIAL because constrictive pericarditis is not named specifically.
- name: Hypereosinophilic syndrome with cardiac involvement
  description: >
    Löffler endocarditis produces an endocardial lesion that is histologically and
    echocardiographically indistinguishable from tropical endomyocardial fibrosis at the
    fibrotic stage. The separation is by context, not by cardiac appearance: a documented
    marked eosinophilia, often with an identifiable clonal or reactive cause, versus an
    endemic tropical setting with no eosinophilia at presentation. This is more than a
    differential, since it is the disease from which the mechanism of endomyocardial fibrosis
    is inferred.
  evidence:
  - reference: PMID:31414216
    reference_title: "Endomyocardial fibrosis: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its pathology resembles conditions such as eosinophilic cardiomyopathy and hypereosinophilic syndrome"
    explanation: States the pathologic indistinguishability that makes this simultaneously a differential and a mechanistic model.
- name: Rheumatic mitral valve disease
  description: >
    Also common in the same populations and also presents with severe mitral regurgitation
    in a young patient. The discriminating feature is the ventricle rather than the valve:
    rheumatic disease damages the leaflets and commissures with a normal ventricular apex,
    whereas endomyocardial fibrosis leaves the leaflets structurally intact and tethers them
    from an obliterated, scarred apex.
  evidence:
  - reference: PMID:32420101
    reference_title: "Endomyocardial fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The echocardiographic changes corresponded well to the findings on surgery and histopathology."
    explanation: Supports echocardiography's ability to characterise the ventricular lesion that distinguishes the two; PARTIAL because rheumatic disease is not the comparator in this study.
clinical_burden:
  burden_level: HIGH
  rationale: >
    A progressive, incurable cardiomyopathy of children and young adults, presenting in New
    York Heart Association class III or IV in nearly all diagnosed cases, with one-third to
    one-half of advanced patients dead within two years. There is no disease-specific drug.
    The only intervention that prolongs survival is open-heart surgery, which carries high
    operative risk and is unavailable to the overwhelming majority of affected people, who
    live in rural low-income settings.
  notes: >
    The burden is inseparable from the setting. Population screening in rural Mozambique
    found nearly one in five people affected, with a peak in adolescence, which makes this
    a major endemic cause of heart failure in the affected regions rather than a rare
    disease in the usual sense. Late diagnosis is driven by lack of clinical awareness and
    poor access to care, so the complications of heart failure, thromboembolism, and
    arrhythmia are typically already present when the disease is first recognised.
  evidence:
  - reference: PMID:31414216
    reference_title: "Endomyocardial fibrosis: past, present, and future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medical care currently remains very challenging as one-third to half of patients with an advanced disease die within 2 years."
    explanation: Quantifies mortality in advanced disease.
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lack of awareness by health professionals and low access to health care determine late diagnosis, when complications such as chronic heart failure, thromboembolism and arrhythmia are already present."
    explanation: Identifies the access and awareness failures that determine when the disease is caught.
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has no specific treatment and carries a poor prognosis, since most patients present with advanced heart failure."
    explanation: States the absence of specific therapy and the presentation stage together.
discussions:
- discussion_id: eosinophil_hypothesis_untestable_in_endemic_setting
  prompt: >
    Is tropical endomyocardial fibrosis actually caused by eosinophil-mediated endocardial
    injury, or has that mechanism been imported wholesale from hypereosinophilic syndrome on
    the strength of a shared end-stage lesion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Sustained eosinophilia and Th2-skewed immune activation
  - pathophysiology#Eosinophil degranulation and endocardial injury
  rationale: >
    The eosinophil model is coherent and is directly evidenced in hypereosinophilic syndrome,
    where the acute infiltrative stage, the thrombotic stage, and the fibrotic stage are all
    observed prospectively in the same patients. In tropical endomyocardial fibrosis, none of
    that is observed. Patients present at the fibrotic stage, eosinophilia is usually absent
    by then, and biopsy at that point is uninformative in a specific and vicious way, because
    degranulation and replacement by fibrosis erase the evidence of the very process being
    looked for. The inference therefore runs backwards from a shared end-stage appearance,
    which is exactly the reasoning pattern that would also be satisfied if two different
    upstream processes converged on one scar. The alternative worth taking seriously is that
    the endemic disease is driven by something else entirely, with the eosinophilic
    endocarditis of hypereosinophilic syndrome being a separate route to the same
    architecture. Population screening now makes the decisive study possible for the first
    time, because it identifies affected people before the fibrotic stage.
  proposed_experiments:
  - experiment_id: exp_emf_prospective_early_stage_cohort
    name: Longitudinal follow-up of screen-detected early endomyocardial fibrosis with serial eosinophil and cardiac biomarker measurement
    description: >-
      Enrol screen-detected asymptomatic and mild cases from an endemic population, and follow
      them with serial eosinophil counts, troponin, cardiac magnetic resonance tissue
      characterisation, and echocardiographic severity scoring, comparing those who progress
      against those who do not.
    decision_criterion: >-
      Eosinophilia or a troponin and magnetic resonance signature of active eosinophilic
      inflammation preceding progression would establish the eosinophil route in the endemic
      disease; progression without any such signal would show that the mechanism inferred from
      hypereosinophilic syndrome does not transfer.
  evidence:
  - reference: PMID:34172539
    reference_title: "Hypereosinophilic syndrome: considerations for the cardiologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may be non-contributive due to sampling issues or eosinophil degranulation or replacement by fibrosis"
    explanation: Documents precisely why the mechanism cannot be confirmed at the stage at which the endemic disease is diagnosed.
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "efforts to understand its mechanisms and natural history have been hampered by the incapacity to detect the early stages of the disease in endemic areas"
    explanation: States the structural reason the mechanism is unresolved, and by implication what would resolve it.
- discussion_id: geographic_distribution_unexplained
  prompt: >
    Why is endomyocardial fibrosis confined to specific equatorial regions, when the exposures
    proposed to cause it are not?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic antigenic or toxic stimulus in a susceptible host
  rationale: >
    This is the constraint every etiologic hypothesis has failed. Filariasis and
    schistosomiasis are widespread far beyond the endemic zone; cassava is eaten across the
    tropics; malaria's distribution does not match the disease's. A systematic review across
    six decades concluded that no proposed account explains the geography. Three structurally
    different explanations remain open. The cause may be a genuinely localised exposure not
    yet identified, such as a soil geochemical factor, in which case the geography is the
    signal rather than the puzzle. It may require a specific conjunction of exposures that
    happens to co-occur only in those regions, in which case single-factor studies were
    always going to fail. Or the apparent geography may be substantially an artefact of where
    anyone has looked, which population screening in non-endemic tropical regions could test
    directly and cheaply.
  proposed_experiments:
  - experiment_id: exp_emf_geographic_screening_survey
    name: Standardised echocardiographic prevalence survey across matched endemic and non-endemic tropical regions
    description: >-
      Apply the same standardised echocardiographic criteria and severity score used in the
      Mozambique population study to random population samples in tropical regions with
      comparable helminth burden, diet, and poverty but no reported endomyocardial fibrosis,
      alongside a contemporaneous endemic-region sample as a positive control.
    decision_criterion: >-
      Comparable prevalence in supposedly non-endemic regions would show the geography is
      largely an ascertainment artefact and would redirect etiologic search away from
      localised exposures; a genuinely sharp geographic boundary under identical
      ascertainment would make a localised environmental factor the leading hypothesis and
      would define where to look for it.
  evidence:
  - reference: PMID:18301727
    reference_title: "Endomyocardial fibrosis: still a mystery after 60 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite several hypotheses regarding cause, no account of the etiology of this disease has yet fully explained its unique geographical distribution."
    explanation: The systematic review's conclusion, which is the premise of this gap.
- discussion_id: screen_detected_disease_natural_history
  prompt: >
    Do the mild, asymptomatic cases found by population echocardiographic screening progress
    to clinical endomyocardial fibrosis, or are they a largely stable finding?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Dense endocardial fibrous scar
  - pathophysiology#Restrictive diastolic physiology
  rationale: >
    Screening a rural Mozambican population found echocardiographic disease in nearly a fifth
    of people, but only 22.7 percent of those were symptomatic and most had only
    mild-to-moderate abnormalities. Two readings have opposite consequences. If most
    screen-detected cases progress, then the clinical disease is the visible fraction of a
    very large iceberg, screening would identify a huge population for early intervention,
    and the prevalence figure is a public-health emergency. If most are stable, then the
    screening criteria are detecting a common structural variant or a self-limited healed
    lesion, and treating the prevalence as a burden estimate overstates it substantially. No
    longitudinal follow-up of a screen-detected cohort has been published, so the question is
    open on the evidence rather than merely contested.
  proposed_experiments:
  - experiment_id: exp_emf_screen_detected_longitudinal_followup
    name: Ten-year longitudinal follow-up of an echocardiographically screen-detected endomyocardial fibrosis cohort
    description: >-
      Re-examine the screen-detected cohort at fixed intervals with the same standardised
      criteria and severity score, recording progression in severity grade, onset of symptoms,
      incident complications, and mortality, against screen-negative controls from the same
      sampling frame.
    decision_criterion: >-
      Substantial progression in severity grade or symptom onset in a majority of
      screen-detected mild cases would establish them as early disease and justify screening
      programmes; stability across a decade would require the screening criteria to be
      recalibrated and the prevalence figure reinterpreted.
  evidence:
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected subjects had mild-to-moderate structural and functional echocardiographic abnormalities. Only 48 persons with endomyocardial fibrosis (22.7%) were symptomatic."
    explanation: The observation that creates the question, with the numbers that make its resolution consequential.
  - reference: PMID:18596273
    reference_title: "A population study of endomyocardial fibrosis in a rural area of Mozambique."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By using echocardiography, we were able to detect early, asymptomatic stages of the disease."
    explanation: The authors' own interpretation, that these are early stages, which is the reading the proposed follow-up would test.
- discussion_id: autoimmunity_cause_or_consequence
  prompt: >
    Do circulating anti-myocardial antibodies sustain injury in endomyocardial fibrosis, or
    merely mark injury that has already occurred?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Anti-myocardial autoantibody response
  rationale: >
    Anti-myocardial IgG is present in about half of patients and a tenth of controls, and its
    intensity correlates with disease activity. Correlation with activity is compatible with
    both readings, since an antibody that drives injury and an antibody that reports injury
    would both track it. The authors of the only study explicitly declined to resolve it. The
    stakes are concrete rather than academic: only the causal reading would justify trialling
    immunosuppression in a disease that currently has no medical therapy at all, and giving
    immunosuppression on the strength of a marker would expose a malnourished, often
    parasitised population to real harm.
  proposed_experiments:
  - experiment_id: exp_emf_autoantibody_temporal_sequence
    name: Serial autoantibody measurement in a screen-detected cohort followed to progression
    description: >-
      Measure anti-myocardial IgG serially in screen-detected early cases, and determine
      whether antibody appearance and titre rise precede or follow echocardiographic
      progression in individual patients.
    decision_criterion: >-
      Antibody appearance preceding progression within individuals would support a causal or
      perpetuating role and would justify a pilot immunosuppression trial; antibody rise
      following progression would establish it as a marker and rule out that trial.
  evidence:
  - reference: PMID:20422043
    reference_title: "Presence of circulating anti-myosin antibodies in endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These immune markers seem to be related with activity and might provide an adjunct tool for diagnosis and classification of EMF, therefore improving its management by identifying patients who may benefit from immunosuppressive therapy."
    explanation: States the activity correlation and the therapeutic hope that rests on the causal reading.
  - reference: PMID:20422043
    reference_title: "Presence of circulating anti-myosin antibodies in endomyocardial fibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is unclear whether the primary target of injury is the endocardial endothelium, the subendocardial fibroblast, the coronary microcirculation or the myocyte"
    explanation: The authors' framing of the unresolved question about what is being injured, which this discussion extends to what is doing the injuring.
- discussion_id: research_neglect_as_a_disease_feature
  prompt: >
    How much of what is unknown about endomyocardial fibrosis reflects genuine biological
    difficulty rather than the absence of research capacity where the disease occurs?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic antigenic or toxic stimulus in a susceptible host
  rationale: >
    This entry has no transcriptomic, proteomic, metabolomic, or single-cell data to cite,
    which is unusual for a disease affecting nearly a fifth of a screened population. Nor does
    it have a randomised trial of any intervention, a validated animal model in current use,
    or a replication of its only genetic association. Publication volume has fallen since the
    1980s. These are not properties of the biology; they are properties of where the biology
    happens. The curation consequence is that absence of evidence in this entry should not be
    read as evidence of absence anywhere it appears, and that flagging a gap here is
    frequently a statement about research funding rather than about a hard scientific problem.
    This is recorded as a standing caveat over the whole entry rather than as a question with
    an experiment attached.
  evidence:
  - reference: PMID:18301727
    reference_title: "Endomyocardial fibrosis: still a mystery after 60 years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The volume of publications on endomyocardial fibrosis has declined since the 1980s."
    explanation: Quantifies the decline in research attention to a disease of this prevalence.
  - reference: PMID:32420110
    reference_title: "Challenges in addressing the knowledge gap on endomyocardial fibrosis through community-based studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can be used to expose global disparities in cardiovascular research"
    explanation: The authors' own framing of the disease as an index of research inequity.
notes: >
  Scope. This entry curates tropical or idiopathic endomyocardial fibrosis, MONDO:0006746.
  It is deliberately not merged with Löffler endocarditis or with the cardiac involvement of
  hypereosinophilic syndrome, which share the end-stage lesion but have a documented cause
  and a different clinical context. Several mechanism nodes nonetheless cite hypereosinophilic
  syndrome literature, because that is where the stage-by-stage evidence exists; those
  citations are marked and their limits are discussed in the eosinophil-hypothesis discussion
  rather than glossed.

  Do not conflate this disease with endocardial fibroelastosis, OMIM 226000. That is a
  distinct congenital or infantile endocardial thickening syndrome, and the deep-research
  report explicitly flagged the risk of curating that OMIM identifier against MONDO:0006746.
  It is not curated here.

  Module conformance. Five nodes declare conformance to the fibrotic_response module. The fit
  is good on the generic arc from injury through inflammation and mesenchymal activation to
  excess matrix and organ dysfunction, but two specifics differ from the module's parenchymal
  archetype and are worth noting: the injury is intraluminal and endothelial rather than
  parenchymal, and the matrix is deposited in a thin subendothelial layer with the underlying
  myocardium comparatively spared, which is why systolic function survives and why surgical
  decortication is anatomically possible.

  Deep-research provenance. Curated from a claude_code deep-research report
  (research/Endomyocardial_Fibrosis-deep-research-claude_code.md) treated as leads only. The
  NEC preflight returned SKIP because MONDO records no causal gene for MONDO:0006746; manual
  checks against the MONDO record confirmed the entity. Three ontology identifiers suggested
  by the provider were verified against OAK and found to point at unrelated concepts
  (HP:0012765 is Widened cerebellar subarachnoid space, not Orthopnea; HP:0005177 is Premature
  arteriosclerosis, not Tricuspid regurgitation; UBERON:0002348 is epicardium, not
  endocardium). All were corrected before curation. Two provider-suggested references for the
  eosinophil-granule mechanism were checked and found to be correspondence items without
  abstracts, so the mechanism is cited from hypereosinophilic syndrome reviews with explicit
  PARTIAL marking rather than from an unquotable source.

name: Combined Immunodeficiency Due to CTPS1 Deficiency
creation_date: '2026-09-06T08:15:00Z'
category: Mendelian
disease_term:
  preferred_term: combined immunodeficiency due to CTPS1 deficiency
  term:
    id: MONDO:0014391
    label: combined immunodeficiency due to CTPS1 deficiency
synonyms:
- CTPS1 deficiency
- CTP synthase 1 deficiency
- immunodeficiency 24
description: 'A combined immunodeficiency in which lymphocytes cannot build the nucleotide pool that
  rapid clonal expansion requires. CTPS1 catalyses the last step of de novo CTP synthesis, converting
  UTP to CTP. CTP is a precursor for DNA, RNA and phospholipid, so a resting lymphocyte needs little of
  it and a lymphocyte that has just met its antigen needs a great deal. CTPS1 is barely expressed at
  rest and is sharply upregulated on antigen-receptor activation, which is what makes its loss a
  lymphocyte-selective defect rather than a general one.

  The resulting immunological picture is unusual, and it is the reason this entry is worth separating
  from the signalling immunodeficiencies it sits among. Proximal and distal T-cell receptor signalling
  is close to intact; the cells sense antigen, activate, and then fail to divide. Effector functions
  other than proliferation are largely preserved. Clinically that produces severe and recurrent
  herpesvirus disease - Epstein-Barr virus above all, with EBV-driven B-cell lymphoproliferation and CNS
  lymphoma, and varicella zoster alongside it - because controlling these viruses depends specifically
  on expanding a large virus-specific CD8 T-cell population.

  Two things are curated carefully because they change how the evidence should be read. First, the human
  disease rests almost entirely on a single founder allele shared by patients with ancestry in
  north-west England, so what looks like a genotype-phenotype relationship is really a single-allele
  observation. Second, the literature disagrees with itself about what that allele does: the 2018
  transplant series describes it as causing complete absence of protein, and the 2020 characterisation
  measured 10-20% residual protein with normal catalytic activity per molecule. That disagreement is
  curated as a controversy rather than resolved silently, because which reading is right determines
  whether the human phenotype describes partial or complete deficiency - and the mouse says complete
  deletion is embryonic lethal.'
parents:
- Combined Immunodeficiency
- Inborn Error of Nucleotide Metabolism
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: Ultra-rare, with a founder effect in north-west England. The transplant series counted 17
    patients worldwide as of 2018; the defining immunological characterisation was performed on seven.
    No population rate exists.
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Seven (41%) of 17 patients worldwide with CTPS1 deficiency have died, three post and four
      prior to HSCT
    explanation: Gives a worldwide ascertained case count as of 2018. It is a count of known patients,
      not a rate in any population, which is why the record is CASES_IN_LITERATURE.
pathophysiology:
- name: CTPS1 Loss of Function from a Founder Splice Variant
  role: trigger
  biological_scale: MOLECULAR
  description: 'Homozygous loss-of-function variation in CTPS1. The human disease is defined by a single
    founder frameshift splice variant, c.1692-1G>C (p.T566Dfs26X), which removes exon 18 from the
    transcript. How much protein survives is disputed - see the controversy recorded on this entry - but
    both readings agree that the enzyme activity available to an activated lymphocyte is grossly
    insufficient.'
  genetic_context:
    gene:
      preferred_term: CTPS1
      term:
        id: hgnc:2519
        label: CTPS1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: 'Recorded as PARTIAL_LOSS_OF_FUNCTION on the strength of the direct measurement in
      patient cells, which found 10-20% residual protein with normal per-molecule catalytic activity.
      The earlier transplant series describes the same allele as giving complete absence of protein. The
      partial reading is preferred here because it rests on a quantitative measurement made for that
      purpose, and because the mouse null is embryonic lethal while these patients survive to transplant.'
  downstream:
  - target: Failure to Expand the CTP Pool on Lymphocyte Activation
    causal_link_type: DIRECT
    description: CTPS1 catalyses the committed step of de novo CTP synthesis, so reduced enzyme means
      reduced CTP when demand rises.
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report the identification of a loss-of-function homozygous mutation (rs145092287)
      in CTPS1 in humans that causes a novel and life-threatening immunodeficiency, characterized by an
      impaired capacity of activated T and B cells to proliferate in response to antigen receptor-mediated
      activation.
    explanation: The gene-disease assignment from the study that made it, together with the defining
      cellular defect.
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The CTPS1T566Dfs26X mutant protein was found to be hypomorphic, resulting in 80%-90%
      reduction of protein expression and CTPS activity in cells of patients.
    explanation: The quantitative measurement of residual protein, which is the basis for recording this
      as a partial rather than a complete loss of function.
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This indicates that CTPS1T566Dfs26X retained normal CTPS activity, and thus the loss of
      function of CTPS1T566Dfs26X is completely attributable to protein instability.
    explanation: Locates the defect at protein stability rather than at catalysis, which makes a
      dose-restoring intervention conceptually different from an activity-replacing one.
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: This mutation is known to lead to an abnormal transcript lacking exon 18 and complete lack
      of protein expression.
    explanation: Graded REFUTE against the PARTIAL_LOSS_OF_FUNCTION assignment on this node, because it
      asserts complete absence of protein for the same allele. It is curated rather than dropped so the
      disagreement in the literature stays visible; the reasoning for preferring the partial reading is
      in the genetic_context description and in the linked controversy.
- name: Failure to Expand the CTP Pool on Lymphocyte Activation
  role: central_effector
  biological_scale: MOLECULAR
  description: 'Antigen-receptor engagement normally triggers a sharp rise in CTPS1 expression and a
    corresponding rise in intracellular CTP, supplying the nucleotide demand of the DNA, RNA and
    phospholipid synthesis that clonal expansion requires. In deficiency that rise does not happen. This
    is the node at which the disease becomes lymphocyte-specific: resting cells need little CTP and are
    unaffected, and other tissues meet their demand through the CTPS2 isoform and nucleoside salvage.'
  genes:
  - preferred_term: CTPS1
    term:
      id: hgnc:2519
      label: CTPS1
  molecular_functions:
  - preferred_term: CTP synthase activity
    term:
      id: GO:0003883
      label: CTP synthase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: CTP biosynthetic process
    term:
      id: GO:0006241
      label: CTP biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Failure of Antigen-Driven Lymphocyte Clonal Expansion
    causal_link_type: DIRECT
    description: Without the nucleotide precursors, the activated cell cannot complete the DNA synthesis
      that division requires.
    evidence:
    - reference: PMID:24870241
      reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
        proliferation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Normal T-cell proliferation was restored in CTPS1-deficient cells by expressing wild-type
        CTPS1 or by addition of exogenous CTP or its nucleoside precursor, cytidine.
      explanation: The rescue experiment that establishes the direction of this edge. Supplying the
        product downstream of the missing enzyme restores the phenotype, which places the defect at CTP
        supply rather than elsewhere in the activation programme.
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CTPS1 expression was found to be low in resting T cells, but rapidly upregulated following
      TCR activation.
    explanation: The activation-dependent expression pattern that explains why the deficiency is
      restricted to dividing lymphocytes rather than being systemic.
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Activated CTPS1-deficient cells had decreased levels of CTP.
    explanation: The direct measurement of the metabolite this node is about.
  - reference: PMID:37348953
    reference_title: Differential roles of CTP synthetases CTPS1 and CTPS2 in cell proliferation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Therefore, our results demonstrate that CTPS1 is the main contributor to cell proliferation.
    explanation: Establishes that CTPS2 cannot substitute freely for CTPS1, which is why losing one of
      two isoforms of the same enzyme produces a disease at all.
- name: Failure of Antigen-Driven Lymphocyte Clonal Expansion
  role: central_effector
  biological_scale: CELLULAR
  description: 'Activated T and B cells sense antigen and then cannot divide. The selectivity of this
    defect is the most informative thing about the disease: receptor-proximal and receptor-distal
    signalling are only weakly affected and non-proliferative effector functions are largely preserved,
    so the lesion is specifically in the capacity to expand, not in the capacity to respond.'
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: lymphocyte proliferation
    term:
      id: GO:0046651
      label: lymphocyte proliferation
    modifier: DECREASED
  downstream:
  - target: Failure to Control Herpesvirus-Infected B Cells
    causal_link_type: DIRECT
    description: Control of EBV and VZV depends on expanding a large virus-specific cytotoxic T-cell
      population, which is precisely the capacity this node removes.
  - target: Impaired Development of Memory and Innate-like Lymphocyte Subsets
    causal_link_type: DIRECT
    description: The subsets that fail are the ones whose development requires proliferative expansion.
  - target: Impaired T-Independent B-Cell Response to Polysaccharide Antigen
    causal_link_type: DIRECT
    description: A T-independent B-cell response is itself a proliferative burst, so it fails for the
      same reason - and it fails without needing the T-cell arm to be involved.
  - target: Impaired lymphocyte proliferative response
    causal_link_type: DIRECT
    description: The laboratory readout of this node.
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, proximal and distal T-cell receptor (TCR) signalling events and responses were
      only weakly affected by the absence of CTPS1.
    explanation: Establishes the selectivity of the defect, which is the claim this node makes and the
      thing that separates this disease from the TCR-signalling immunodeficiencies.
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Proliferation and IL-2 secretion by T cells in response to TCR activation were markedly
      decreased in all patients, while other T cell effector functions were preserved.
    explanation: The same selectivity measured in patient cells rather than in a cell line, adding IL-2
      secretion to the list of affected responses.
- name: Impaired Development of Memory and Innate-like Lymphocyte Subsets
  role: consequence
  biological_scale: CELLULAR
  description: A reproducible and quite specific pattern of missing populations - mucosal-associated
    invariant T cells, invariant NKT cells, memory B cells and NK cells - against a background of
    otherwise normal subset counts. These are the compartments whose generation depends on proliferative
    expansion, so the pattern is a readout of the proliferation defect rather than a separate lesion.
  cell_types:
  - preferred_term: mucosal-associated invariant T cell
    term:
      id: CL:0000940
      label: mucosal-associated invariant T cell
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  evidence:
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Immune phenotyping performed in 7 patients showed absence or low numbers of
      mucosal-associated T cells, invariant NKT cells, memory B cells, and NK cells, whereas other
      subsets were normal.
    explanation: Names the affected subsets and, importantly, records that the remaining subsets are
      normal - which is what makes this a selective differentiation defect rather than lymphopenia.
  downstream:
  - target: Reduced NK cell number
    causal_link_type: DIRECT
    description: The measurable readout of the failed innate-like compartment.
- name: Impaired T-Independent B-Cell Response to Polysaccharide Antigen
  role: consequence
  biological_scale: CELLULAR
  description: 'The arm of the disease that explains its bacterial half, and the reason this is called a
    combined immunodeficiency rather than a viral-susceptibility syndrome. Antibody responses to
    polysaccharide antigens do not require T-cell help, so they cannot be explained by the failure of
    T-cell immunity - but they do require the B cell to divide, which is what this disease removes.

    It also resolves an otherwise confusing laboratory picture: total immunoglobulin is normal or even
    elevated in these patients while specific antipneumococcal titres are low. Bulk antibody is not the
    problem; making a new clonal response is.'
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Recurrent encapsulated bacterial infection
    causal_link_type: DIRECT
    description: Failure of the antipolysaccharide response leaves encapsulated organisms uncontrolled.
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients and account for the low titers of S. pneumoniae antibodies as it is a
      T-independent B-cell response.
    explanation: States the mechanism this node asserts - that the low pneumococcal titres reflect a
      failed T-independent B-cell response. The quote begins mid-sentence because the preceding clause
      ends in an abbreviation the snippet matcher would split on.
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patients had normal Ig levels and/or elevated IgG
    explanation: The observation that makes this node necessary. Normal or high total immunoglobulin
      alongside poor specific responses is not explicable by a defect in antibody production in general.
- name: Failure to Control Herpesvirus-Infected B Cells
  role: consequence
  biological_scale: ORGANISM
  description: 'The clinical centre of gravity of the disease. EBV is the pathogen that most stresses the
    capacity this disease removes, because containing it requires a large expansion of EBV-specific CD8
    T cells against a B-cell population that EBV itself drives to proliferate; varicella zoster produces
    a comparable problem by a different route. There is a second, less-appreciated arm: EBV upregulates
    CTPS1 in the B cells it transforms, so the same enzyme is both the host defence bottleneck and a
    dependency of the transformed cell.'
  downstream:
  - target: EBV-driven B-cell lymphoproliferation and lymphoma
    causal_link_type: DIRECT
    description: Uncontrolled proliferation of EBV-infected B cells in the absence of an adequate
      cytotoxic response.
  - target: Severe recurrent herpesvirus infection
    causal_link_type: DIRECT
    description: The clinical manifestation of failed viral control.
  evidence:
  - reference: PMID:31402499
    reference_title: 'Signaling pathways involved in the T-cell-mediated immunity against Epstein-Barr
      virus: Lessons from genetic diseases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the defective expansion of EBV-specific CD8 T cells results from mutations in genes involved
      in T-cell activation (such as RASGRP1, MAGT1, and ITK), DNA metabolism (CTPS1) or co-stimulatory
      pathways (CD70, CD27, and TNFSFR9 (also known as CD137/4-1BB)) leads to impaired elimination of
      proliferating EBV-infected B cells and the occurrence of lymphoma
    explanation: Places CTPS1 explicitly in the DNA-metabolism class of EBV-susceptibility genes, distinct
      from the activation and co-stimulation classes, and states the mechanism this node asserts.
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Systemic viral infections were seen in all patients, with acute and chronic EBV infections
      in nine patients, four suffering from EBV-driven lymphoproliferative disease (LPD) (two CNS and one
      lung) and one with EBV-driven HLH.
    explanation: The clinical realisation of this node in the largest reported cohort, with the
      proportion affected and the sites involved.
- name: EBV-driven B-cell lymphoproliferation and lymphoma
  role: outcome
  biological_scale: ORGANISM
  description: The malignant end of the failure to control EBV, including central nervous system
    lymphoma. The B cells involved carry the EBV latency III programme, which is the programme in which
    EBV drives CTPS1 expression in the transformed cell.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: EBV-associated lymphoproliferative disease
    causal_link_type: DIRECT
    description: The clinical phenotype this pathophysiology node produces. The two are curated in
      separate sections rather than merged, because renaming either to match would collapse them into
      one node in the flat pathograph namespace.
  evidence:
  - reference: PMID:34281398
    reference_title: Epstein-Barr Virus Induced Cytidine Metabolism Roles in Transformed B-Cell Growth
      and Survival.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While CRISPR CTPS1 knockout caused DNA damage and proliferation defects in lymphoblastoid
      cell lines (LCLs), which express the EBV latency III program observed in CNS lymphomas, double
      CTPS1/2 knockout caused stronger phenotypes.
    explanation: Names the latency programme of the lymphomas that occur in this disease, and shows the
      transformed cells themselves depend on CTPS1 - which is why this node is mechanistically
      interesting rather than merely an outcome.
phenotypes:
- category: Infectious
  name: Severe recurrent herpesvirus infection
  frequency: OBLIGATE
  description: Severe, acute and chronic infection with Epstein-Barr virus and varicella zoster virus,
    presenting in the first decade of life. The bacterial half of the combined picture is curated as its
    own phenotype below, with its own mechanism.
  phenotype_term:
    preferred_term: Recurrent viral infections
    term:
      id: HP:0004429
      label: Recurrent viral infections
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Systemic viral infections were seen in all patients
    explanation: Establishes that the viral phenotype was present in every patient of the cohort, which
      is the basis for the OBLIGATE frequency.
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four patients had severe chickenpox.
    explanation: The varicella zoster arm specifically, with the number affected. It is recorded because
      VZV is a leading cause of death in this disease and is easily overshadowed by EBV.
- category: Infectious
  name: Recurrent encapsulated bacterial infection
  frequency: OBLIGATE
  description: Recurrent infection with encapsulated organisms, with low antipneumococcal titres against
    normal or elevated total immunoglobulin. It is the bacterial half of the combined deficiency, and it
    has its own mechanism - the failed T-independent B-cell response - rather than being a consequence
    of the T-cell defect.
  phenotype_term:
    preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients had early onset of severe chronic viral infections, mostly caused by herpes
      viruses, including EBV and Varicella Zooster Virus (VZV) and, also suffered from recurrent
      encapsulated bacterial infections, a spectrum of infections typical of a combined deficiency of
      adaptive immunity (CID)
    explanation: States that all patients had both the viral and bacterial susceptibility, which is the
      basis for the OBLIGATE frequency, and names the combination as what defines a combined deficiency.
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CTPS1-deficient patients display severe bacterial and viral infections.
    explanation: An independent statement of the same combined picture, from the later characterisation
      cohort.
- category: Hematologic
  name: EBV-associated lymphoproliferative disease
  frequency: FREQUENT
  description: Non-malignant and malignant EBV-driven B-cell lymphoproliferation, including central
    nervous system and pulmonary disease, and EBV-driven haemophagocytic lymphohistiocytosis.
  phenotype_term:
    preferred_term: Lymphoproliferative disorder
    term:
      id: HP:0005523
      label: Lymphoproliferative disorder
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: four suffering from EBV-driven lymphoproliferative disease (LPD) (two CNS and one lung) and
      one with EBV-driven HLH
    explanation: Gives the number affected out of eleven, which supports FREQUENT rather than OBLIGATE,
      and names the sites involved.
- category: Immunologic
  name: Impaired lymphocyte proliferative response
  frequency: OBLIGATE
  description: The laboratory hallmark - markedly reduced proliferation of T cells on antigen-receptor
    stimulation, with preserved responses in other assays.
  phenotype_term:
    preferred_term: Decreased antigen-specific T cell proliferation
    term:
      id: HP:0031402
      label: Decreased antigen-specific T cell proliferation
  evidence:
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Proliferation and IL-2 secretion by T cells in response to TCR activation were markedly
      decreased in all patients
    explanation: The proliferative defect measured in every patient of the characterised cohort, which
      supports the OBLIGATE frequency.
- category: Immunologic
  name: Reduced NK cell number
  frequency: FREQUENT
  description: Low natural killer cell counts, part of the selective pattern of missing innate-like and
    memory compartments.
  phenotype_term:
    preferred_term: Reduced total natural killer cell count
    term:
      id: HP:0040218
      label: Reduced total natural killer cell count
  evidence:
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: absence or low numbers of mucosal-associated T cells, invariant NKT cells, memory B cells,
      and NK cells
    explanation: Names NK cells among the reduced populations.
- category: Gastrointestinal
  name: Chronic diarrhea
  frequency: FREQUENT
  description: Chronic diarrhoea as a presenting feature in nearly half of the transplant cohort. The
    mouse shows intestinal epithelium among the high-turnover tissues that depend on CTPS1, which is a
    plausible but unproven explanation.
  phenotype_term:
    preferred_term: Chronic diarrhea
    term:
      id: HP:0002028
      label: Chronic diarrhea
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five patients presented with chronic diarrhea.
    explanation: Gives the number affected out of eleven. The source does not attribute the diarrhoea to
      a mechanism, so the link to epithelial turnover suggested in the description is an inference and is
      not claimed as evidenced.
- category: Infectious
  name: Invasive fungal infection
  frequency: VARIABLE
  description: Reported as a presenting feature in one patient, as seronegative mediastinal
    coccidioidomycosis. Recorded because a defect in lymphocyte expansion predicts susceptibility to
    organisms requiring sustained cell-mediated control, and because the seronegativity is itself a
    consequence of the B-cell defect.
  phenotype_term:
    preferred_term: Recurrent fungal infections
    term:
      id: HP:0002841
      label: Recurrent fungal infections
  evidence:
  - reference: PMID:35983265
    reference_title: Seronegative Mediastinal Coccidioidomycosis as a Novel Presentation of CTPS1
      Combined Immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe the first case of cytidine nucleotide triphosphate synthetase 1 (CTPS1)
      deficiency, a combined immunodeficiency impairing lymphocyte proliferation, presenting with
      coccidioidomycosis.
    explanation: A single case report, which is why this phenotype is VARIABLE rather than FREQUENT. It
      is the sole published fungal presentation.
genetic:
- name: CTPS1
  gene_term:
    preferred_term: CTPS1
    term:
      id: hgnc:2519
      label: CTPS1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: All originally reported patients are homozygous for one founder splice variant, c.1692-1G>C
    (p.T566Dfs26X), and share ancestry in north-west England. This is worth keeping in view when reading
    the human evidence, because the reported genotype-phenotype relationship is essentially a
    single-allele observation - allelic series information is absent rather than negative.
  evidence:
  - reference: PMID:32161190
    reference_title: Impaired lymphocyte function and differentiation in CTPS1-deficient patients result
      from a hypomorphic homozygous mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cytidine triphosphate (CTP) synthetase 1 (CTPS1) deficiency is caused by a unique homozygous
      frameshift splice mutation (c.1692-1G>C, p.T566Dfs26X).
    explanation: States the single causal allele on which the human description of this disease rests.
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with this mutation all have ancestors from the North West of England
    explanation: Establishes the founder effect, which is why a single allele accounts for the whole
      reported cohort.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Homozygous CTPS1 loss of function, with heterozygous carrier parents and a shared founder
    haplotype.
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: all the parents were heterozygous carriers
    explanation: States the carrier status of the parents, which is the observation that establishes
      recessive inheritance in this cohort.
animal_models:
- name: Conditional and inducible Ctps1 knockout mouse
  species: Mouse
  genotype: Ctps1 conditional/inducible knockout, alone and combined with Ctps2
  publication: PMID:38438357
  description: 'The model that supplies what the human disease cannot, because no human null exists.
    Complete germline Ctps1 deletion is embryonic lethal, which establishes that a human phenotype
    surviving to childhood must retain some enzyme. Conditional deletion then separates the contributions
    of the two isoforms, and shows that CTPS1 inactivation is immunosuppressive enough to rescue a fatal
    autoimmune model.'
  modeled_mechanisms:
  - target: Failure of Antigen-Driven Lymphocyte Clonal Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Activated lymphocytes and other high-turnover lineages depend on CTPS1 for maintenance
      and growth, reproducing the human proliferative defect.
    limitations: The mouse is a deletion and the human allele retains residual protein, so the mouse
      models a more complete loss than any patient has. The direction of the difference is knowable and
      matters - inferences about severity from mouse to human will overstate.
    readouts:
    - name: Expansion of activated lymphocytes and memory T cells
      target: Failure of Antigen-Driven Lymphocyte Clonal Expansion
      direction: DECREASED
      interpretation: Loss of the populations whose maintenance requires proliferation.
      evidence:
      - reference: PMID:38438357
        reference_title: Inactivation of cytidine triphosphate synthase 1 prevents fatal auto-immunity
          in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Tissue and cells with high proliferation and renewal rates, such as intestinal
          epithelium, erythroid and thymic lineages, activated B and T lymphocytes, and memory T cells
          strongly rely on CTPS1 for their maintenance and growth.
        explanation: Reports the affected compartments and the direction of the effect.
  - target: Failure to Expand the CTP Pool on Lymphocyte Activation
    relationship: PERTURBS
    fidelity: HIGH
    model_scale: ORGANISM
    description: Deletion of the enzyme is the perturbation. The model also shows CTPS2 is required
      alongside CTPS1 for proliferation after TCR stimulation, which bounds how much redundancy the
      isoform actually provides.
    limitations: Mouse and human differ in the relative expression of the two isoforms across tissues, so
      the degree of CTPS2 compensation observed in the mouse is not directly transferable.
    readouts:
    - name: T-cell proliferation after TCR stimulation in single and double knockouts
      target: Failure to Expand the CTP Pool on Lymphocyte Activation
      direction: DECREASED
      interpretation: Establishes that redundancy between the isoforms is partial rather than complete.
      evidence:
      - reference: PMID:38438357
        reference_title: Inactivation of cytidine triphosphate synthase 1 prevents fatal auto-immunity
          in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: However, both CTPS1 and CTPS2 are required for T cell proliferation following TCR
          stimulation.
        explanation: Reports the isoform requirement measured in this model.
  evidence:
  - reference: PMID:38438357
    reference_title: Inactivation of cytidine triphosphate synthase 1 prevents fatal auto-immunity in
      mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We report that deletion of Ctps1, but not Ctps2, is embryonic-lethal.
    explanation: The result that establishes what a complete human null would mean, and therefore that
      the human disease must be a partial deficiency. It is the single most important thing this model
      contributes, and the strongest argument in the dispute over what the founder allele does.
treatments:
- name: Allogeneic Haematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: 'The only intervention that addresses the cause rather than the consequences, by replacing
    the lymphoid compartment with one that has a functioning enzyme. The defect is cell-intrinsic to
    haematopoietic cells and the enzyme is not secreted, so replacing the compartment is curative in
    principle and, in the published series, in practice.

    It is not a benign option, and this record keeps the cost next to the benefit. Overall survival in
    the largest series was 72%, below what the same centres achieve for other combined immunodeficiencies,
    and the deaths were from EBV reactivation and from unusually severe chronic graft-versus-host
    disease. Both failure modes are plausibly consequences of the underlying disease rather than of the
    transplant.'
  treatment_term:
    preferred_term: Hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: CTPS1 Loss of Function from a Founder Splice Variant
    description: Replaces the lymphoid compartment with donor cells carrying a functional CTPS1 allele,
      acting at the trigger node rather than downstream of it.
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report on 11 patients with CTPS1 mutations who underwent hematopoietic stem cell
      transplant (HSCT) at three UK centres (London, Manchester and Newcastle).
    explanation: Establishes the size and multi-centre character of the only outcome series that exists
      for this treatment in this disease.
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The overall survival post-HSCT in this series was 72% which is slightly lower than seen
      after HSCT for other combined PIDs.
    explanation: The outcome figure, together with the authors' own comparison against other combined
      immunodeficiencies. It is a retrospective single-arm series with no control group, so it reports
      what happened rather than an effect size.
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HSCT can be curative but is not without potential risks and complications.
    explanation: The authors' own summary statement, curated in preference to an unqualified claim of
      cure.
- name: Cytidine or CTP Supply Restoration
  therapeutic_modality: SMALL_MOLECULE
  description: 'Supplying the product the missing enzyme cannot make, or its nucleoside precursor, which
    the salvage pathway can convert. This restores proliferation of patient-derived cells in culture.

    It is curated as an experimental rationale rather than an established therapy, because the only
    evidence is in vitro rescue. Whether cytidine can be delivered to activated lymphocytes in vivo at
    the concentrations that work in culture is untested, and no patient has been reported treated this
    way.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cytidine
      term:
        id: CHEBI:17562
        label: cytidine
  target_mechanisms:
  - target: Failure to Expand the CTP Pool on Lymphocyte Activation
    description: Bypasses the enzymatic block by supplying the product or a salvageable precursor of it.
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Normal T-cell proliferation was restored in CTPS1-deficient cells by expressing wild-type
      CTPS1 or by addition of exogenous CTP or its nucleoside precursor, cytidine.
    explanation: The in vitro rescue. It is evidence that the block can be bypassed in principle, and it
      is not evidence of clinical efficacy - no in vivo study exists.
  - reference: PMID:34281398
    reference_title: Epstein-Barr Virus Induced Cytidine Metabolism Roles in Transformed B-Cell Growth
      and Survival.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Cytidine rescued CTPS1/2 deficiency phenotypes in EBV-transformed LCLs and Burkitt B cells,
      highlighting CTPS1/2 as a potential therapeutic target for EBV-driven lymphoproliferative
      disorders.
    explanation: An independent replication of the cytidine rescue in a different cell context. Note the
      paper frames the finding as an argument for inhibiting CTPS1 in lymphoma, which is the opposite
      therapeutic direction from this treatment record.
- name: Rituximab and EBV-Specific Cytotoxic T Lymphocytes for EBV Complications
  therapeutic_modality: OTHER
  description: 'Directed treatment of the EBV-driven complications rather than of the underlying defect.
    B-cell depletion removes the compartment EBV proliferates in, and adoptive transfer of EBV-specific
    cytotoxic T lymphocytes supplies from outside exactly the expanded effector population the patient
    cannot generate. The second of these is mechanistically the most precisely targeted therapy in this
    entry, since it substitutes for the specific failed step.

    Curated at the level the evidence supports: both were used in the transplant series, before and after
    transplant, and no comparative outcome is reported for either.'
  treatment_term:
    preferred_term: Therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Failure to Control Herpesvirus-Infected B Cells
    description: Adoptively transferred EBV-specific cytotoxic T lymphocytes supply the expanded
      virus-specific effector population that the proliferation defect prevents the patient from making.
  evidence:
  - reference: PMID:29884857
    reference_title: Hematopoietic stem cell transplantation for cytidine triphosphate synthase 1 (CTPS1)
      deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four patients with EBV-driven LPD received rituximab and three EBV-specific cytotoxic
      T-lymphocytes (CTLs) (two pre-transplant and one post-transplant).
    explanation: Records that both were used and in how many patients. The series reports no outcome
      attributable to either, so this is evidence of use rather than of efficacy.
diagnosis:
- name: Lymphocyte proliferation assay with preserved activation markers
  description: The discriminating test. Proliferation on antigen-receptor stimulation is markedly
    reduced while activation signalling and other effector functions are close to normal, which
    distinguishes this from the TCR-signalling combined immunodeficiencies.
  evidence:
  - reference: PMID:24870241
    reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte
      proliferation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, proximal and distal T-cell receptor (TCR) signalling events and responses were
      only weakly affected by the absence of CTPS1.
    explanation: States the dissociation between signalling and proliferation on which this diagnostic
      distinction rests.
- name: CTP synthetase activity measurement in stimulated lymphocytes
  description: Direct enzymatic assay of CTPS activity in cell lysates by liquid chromatography tandem
    mass spectrometry, which distinguishes resting from activated cells and detects the failure of the
    activation-induced induction rather than a change in baseline.
  evidence:
  - reference: PMID:31524312
    reference_title: CTP synthetase activity assay by liquid chromatography tandem mass spectrometry in
      the multiple reaction monitoring mode.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Treatment by 3DAU and homozygous mutation in CTPS1 gene abolished the induction of CTPS
      activity associated with cell stimulation
    explanation: Shows the assay detects the specific defect - loss of the activation-induced rise rather
      than loss of baseline activity - in a patient carrying the mutation.
discussions:
- discussion_id: ctps1_allele_null_or_hypomorph
  kind: CONTROVERSY
  prompt: Does the founder allele c.1692-1G>C abolish CTPS1 protein entirely, or leave 10-20% of it?
  attaches_to:
  - pathophysiology#CTPS1 Loss of Function from a Founder Splice Variant
  - genetic#CTPS1
  rationale: 'Two peer-reviewed sources describe the same allele in incompatible terms. The 2018
    transplant series states it produces an abnormal transcript lacking exon 18 and complete absence of
    protein. The 2020 characterisation measured an 80-90% reduction in protein with the residual enzyme
    retaining normal catalytic activity, and showed that restoring expression to wild-type levels
    restores proliferation - which requires that there be a functional protein to restore.

    This entry follows the 2020 reading, for two reasons worth stating rather than assuming. It is a
    direct quantitative measurement made to answer this question, whereas the 2018 statement is a
    background sentence in a transplant outcome paper. And the mouse deletion is embryonic lethal, so a
    genuinely protein-null human would be unlikely to reach the paediatric transplant clinic at all.

    It is not a pedantic distinction. If the allele is null, the human disease is a model of complete
    CTPS1 loss and the mouse lethality becomes a species difference that needs explaining. If it is
    hypomorphic, the human disease is a natural dose-reduction experiment, and it is the only human
    evidence available for what partial CTPS1 inhibition does - which bears directly on the CTPS1
    inhibitors now in clinical development.'
  proposed_experiments:
  - experiment_id: ctps1_allele_protein_quantification
    name: Quantitative immunoblot and transcript analysis of the founder allele in fresh patient cells
    description: Measure CTPS1 protein and the exon-18-skipped transcript in freshly isolated, stimulated
      patient lymphocytes against a standard curve, rather than in transformed or transduced lines, so
      the residual level is established in the cell type the disease is about.
    readouts:
    - name: CTPS1 protein abundance relative to control
      target: pathophysiology#CTPS1 Loss of Function from a Founder Splice Variant
      direction: DECREASED
      interpretation: A measurable residual band settles the question in favour of the hypomorphic
        reading; a true absence would make the mouse lethality a species difference requiring explanation.
- discussion_id: ctps1_allelic_series_absent
  kind: KNOWLEDGE_GAP
  prompt: How much of the described phenotype is specific to the single founder allele, and is the
    immunological defect graded with residual CTPS1 dose or threshold-like?
  attaches_to:
  - genetic#CTPS1
  - pathophysiology#Failure of Antigen-Driven Lymphocyte Clonal Expansion
  rationale: 'Every human observation in this entry derives from one allele, homozygous, on one founder
    haplotype. That is a narrow evidentiary base for a disease description, and no allelic series exists
    to say whether an allele with 40% residual function would be clinically silent. The question has an
    unusually direct practical consequence: CTPS1-selective inhibitors are in clinical development as
    immunosuppressants, and the dose-response of this disease is the closest thing to a human
    dose-finding experiment that exists for that target.'
  proposed_experiments:
  - experiment_id: ctps1_dose_response_series
    name: Graded CTPS1 expression series in primary human T cells
    description: Titrate CTPS1 protein across the range from null to wild type in primary human T cells,
      and measure proliferative capacity and the innate-like and memory differentiation readouts that
      fail in patients, to establish whether the relationship is graded or threshold-like.
    readouts:
    - name: Proliferative capacity as a function of CTPS1 protein level
      target: pathophysiology#Failure of Antigen-Driven Lymphocyte Clonal Expansion
      direction: DECREASED
      interpretation: A threshold rather than a gradient would predict that partial pharmacological
        inhibition is safe up to a sharp point, which is a materially different safety profile from a
        graded one.
- discussion_id: ctps1_target_direction_paradox
  kind: INTERPRETATION
  prompt: How should the evidence base for this disease be read, given that most recent CTPS1 research
    is motivated by inhibiting the enzyme rather than by restoring it?
  attaches_to:
  - treatments#Cytidine or CTP Supply Restoration
  - pathophysiology#Failure to Control Herpesvirus-Infected B Cells
  rationale: 'The disease is a natural experiment that drug discovery has adopted. Because CTPS1
    deficiency is lymphocyte-selective and survivable, CTPS1 is an attractive immunosuppressive and
    anti-lymphoma target, and the isoform-comparison work and the mouse work cited in this entry were
    both done within that programme. That is largely a benefit: the pathway is unusually well
    characterised for an ultra-rare disease. But it has two consequences for reading the evidence.
    Findings are selected for what they say about inhibition rather than about patients, so questions
    that matter clinically - long-term post-transplant outcome, natural history in untreated survivors,
    whether cytidine helps in vivo - are unstudied while the enzymology is very well studied. And the
    same experiment supports opposite therapeutic claims: cytidine rescue is curated here as a rationale
    for supplementation and is presented in its source paper as evidence that CTPS1 is worth blocking.'
notes: 'Boundary with the EBV-susceptibility immunodeficiencies. Several entries in this knowledge base
  describe defects presenting with severe EBV disease, among them the SH2D1A and XIAP forms of X-linked
  lymphoproliferative disease and CD27-related lymphoproliferative disorder. CTPS1 deficiency is grouped
  with them clinically and is mechanistically distinct: those are defects of T-B cell interaction or of
  cytotoxicity, and this is a defect of nucleotide supply that limits expansion. The review cited on the
  herpesvirus control node makes exactly this distinction, placing CTPS1 in a DNA-metabolism category
  separate from the activation and co-stimulation categories.

  On the naming. MONDO carries this as combined immunodeficiency due to CTPS1 deficiency and OMIM lists
  it as immunodeficiency 24. This knowledge base has a series of Immunodeficiency_NN entries, and this
  one deliberately uses the MONDO mechanism-naming form, because the mechanism is the informative part
  of the name here and the number is not.

  A note on one cached reference, because it affects how its snippets should be read. PMID:29884857 is a
  Bone Marrow Transplantation letter with no abstract in PubMed. just fetch-reference recovered its text
  through an institutional repository, so the cached body is an author accepted manuscript embedded in a
  RIS bibliographic export, with the article text duplicated across the N2 and AB fields. That text
  carries manuscript line numbers inline - phrases such as "an affected 39 sibling" and "2 x 106 55
  EBV-CTLs" contain stray line numbers, not data. Every snippet quoted from this reference was chosen to
  avoid those spans. The content is genuine and on topic; the transcription is not clean, and a snippet
  spanning a damaged span would pass exact-match validation while misquoting the published article.

  On the immunoglobulin picture. Patients have normal or elevated total IgG alongside low specific
  antipneumococcal titres. That combination is diagnostically distinctive and is curated on the
  T-independent B-cell node, because it is the observation that rules out a general antibody-production
  defect and points at the failure to mount a new clonal response.

  One apparent tension worth flagging for a reader rather than resolving. PMID:24870241 states that none
  of its patients had extra-haematopoietic manifestations, while the transplant series reports chronic
  diarrhoea in five of eleven. The two are most likely scoping the phrase differently - a gut symptom
  during systemic viral illness is not obviously an extra-haematopoietic manifestation of the genetic
  defect - but neither paper reconciles them and this entry does not either.

  No clinical_trials records are asserted. CTPS1-selective inhibitors are in clinical development, but
  those trials are in lymphoma and autoimmunity rather than in this disease, so they belong to the target
  and not to this entry.'

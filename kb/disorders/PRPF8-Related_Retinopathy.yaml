name: PRPF8-Related Retinopathy
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
description: >-
  PRPF8-related retinopathy (retinitis pigmentosa 13, RP13) is an autosomal
  dominant rod-cone degeneration caused by heterozygous variants in PRPF8, the central scaffold protein of the U5 snRNP and the spliceosome's
  catalytic core. Variants cluster in the C-terminal Jab1/MPN region that
  regulates the Brr2 RNA helicase, and most are thought to act through
  altered helicase regulation rather than simple loss of PRPF8. The result is defective 5'
  splice-site selection and cryptic splicing that falls mainly on ciliary and
  retina-specific transcripts, followed by photoreceptor degeneration with
  night blindness and constricting visual fields. Expressivity varies within
  families and penetrance is incomplete. PRPF8 accounts for about 2 to 3
  percent of autosomal dominant retinitis pigmentosa, and cystoid macular
  edema is unusually common.

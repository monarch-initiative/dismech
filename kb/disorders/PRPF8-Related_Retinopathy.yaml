discussions:
- discussion_id: prpf8_rpe_phagocytosis_mouse_vs_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Retinal Pigment Epithelium Dysfunction
  prompt: >-
    Do PRPF8 variants impair RPE phagocytosis in human cells, as they do in
    knock-in mice?
  rationale: >-
    Prpf8 H2309P mice show reduced RPE phagocytosis and loss of its diurnal
    burst, but patient-derived RPE carrying a PRPF8 missense variant
    phagocytosed outer segments like wild type. Organoid work shows that
    photoreceptors degenerate without any RPE, while another patient iPSC-RPE
    line had barrier and polarity defects. Whether RPE failure is a primary
    driver in patients, a secondary contributor, or a mouse-specific feature
    decides which cell a therapy has to reach.
  evidence:
  - reference: PMID:30572641
    reference_title: "Functional Assessment of Patient-Derived Retinal Pigment Epithelial Cells Edited by CRISPR/Cas9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that patient-derived iPSCs, both diseased and corrected, are able to differentiate into RPE cells with a near normal phenotype and without differences in phagocytosis, a result that differs from previous mouse models."
    explanation: The authors state the conflict with the mouse model.

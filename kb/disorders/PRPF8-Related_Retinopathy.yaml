notes: >-
  A single patient with autosomal recessive retinitis pigmentosa and a PRPF8
  variant has been studied in iPSC-derived RPE (PMID:33994920); this entry
  covers the dominant disease, and that report is not used here. ClinGen
  excludes non-retinal PRPF8 associations (glaucoma, myeloid leukemia) from
  this disease, and so does this entry. No GeneReviews chapter is specific to
  PRPF8; the nonsyndromic retinitis pigmentosa overview covers it among other
  genes.

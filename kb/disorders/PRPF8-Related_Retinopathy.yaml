      label: Autosomal dominant inheritance
  description: >-
    Heterozygous variants with variable expressivity within families and
    incomplete penetrance, including carriers with near-normal retinas late in
    life.
  evidence:
  - reference: PMID:22039234
    reference_title: "Autosomal dominant retinitis pigmentosa with intrafamilial variability and incomplete penetrance in two families carrying mutations in PRPF8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of marked intrafamilial variability associated with mutations in the PRPF8 gene, including incomplete penetrance."
    explanation: Documents dominant inheritance with variable expressivity and non-penetrance.
  - reference: PMID:11468273
    reference_title: "Mutations in the pre-mRNA splicing factor gene PRPC8 in autosomal dominant retinitis pigmentosa (RP13)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the mutations cosegregate within three RP13 linked families including the original large South African pedigree"
    explanation: Cosegregation of heterozygous PRPF8 variants in dominant RP13 families.
pathophysiology:
- name: PRPF8 C-Terminal Variant
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    Most variants are missense changes clustered in the last exons of PRPF8,
    in the C-terminal region that regulates the Brr2 helicase; H2309P is the
    best-characterized allele. Nonsense variants in the same region are also
    reported and are predicted to escape nonsense-mediated decay. Some alleles
    outside the last exon, such as T1931M, lower PRPF8 levels in patient RPE,
    so reduced dosage may contribute for those.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PRPF8
    term:
      id: hgnc:17340
      label: PRPF8
  molecular_functions:
  - preferred_term: U5 snRNA binding
    term:
      id: GO:0030623
      label: U5 snRNA binding
  cellular_components:
  - preferred_term: U5 snRNP
    term:
      id: GO:0005682
      label: U5 snRNP
  evidence:
  - reference: PMID:11468273
    reference_title: "Mutations in the pre-mRNA splicing factor gene PRPC8 in autosomal dominant retinitis pigmentosa (RP13)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seven mutations are clustered within a 14 codon stretch within the last exon of this large 7 kb transcript."
    explanation: The founding report places all variants in a short C-terminal stretch.
  - reference: CGGV:assertion_b9efbbc3-6ce1-4f92-8472-627c2060dd88-2023-04-06T160000.000Z
    reference_title: "PRPF8 / PRPF8-related retinopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nonsense variants have also been associated with disease; it is predicted that C-terminal stop mutations may escape nonsense mediated decay"
    explanation: ClinGen summary of truncating PRPF8 variants.
  - reference: PMID:38605034
    reference_title: "PRPF8-mediated dysregulation of hBrr2 helicase disrupts human spliceosome kinetics and 5´-splice-site selection causing tissue-specific defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The carboxy-terminus of the spliceosomal protein PRPF8, which regulates the RNA helicase Brr2, is a hotspot for mutations causing retinitis pigmentosa-type 13"
    explanation: Identifies the variant hotspot as the Brr2-regulating region.
  downstream:
  - target: Impaired Regulation of the Brr2 Helicase
    causal_link_type: DIRECT
- name: Impaired Regulation of the Brr2 Helicase
  description: >-
    The PRPF8 C-terminal tail normally inserts into the RNA-binding tunnel of
    the Brr2 helicase and represses it until U4/U6 unwinding is due. RP13
    variants weaken that repression and the PRPF8-Brr2 interaction, disturbing
    U5 snRNP maturation, spliceosome activation and the transition between the
    two catalytic steps, and lowering overall splicing efficiency.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Brr2-driven U4/U6 release during spliceosome activation
    term:
      id: GO:0000388
      label: spliceosome conformational change to release U4 (or U4atac) and U1 (or U11)
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23704370
    reference_title: "Inhibition of RNA helicase Brr2 by the C-terminal tail of the spliceosomal protein Prp8."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inefficient Brr2 repression is the only recognizable phenotype associated with certain retinitis pigmentosa-linked Prp8 mutations that map to its C-terminal tail."
    explanation: Structural and biochemical evidence that RP variants weaken Brr2 repression.
  - reference: PMID:17934474
    reference_title: "prp8 mutations that cause human retinitis pigmentosa lead to a U5 snRNP maturation defect in yeast."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RP mutations in Prp8p in yeast result in nuclear accumulation of the precursor U5 snRNP, apparently as a consequence of disrupting the interaction of Prp8p with Brr2p."
    explanation: In yeast the same variants disrupt the Prp8-Brr2 interaction and U5 snRNP maturation.
  - reference: PMID:26968627
    reference_title: "Prp8 retinitis pigmentosa mutants cause defects in the transition between the catalytic steps of splicing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Though Prp8-RP mutants do not cause defects in splicing fidelity, they result in an overall decrease in splicing efficiency."
    explanation: Yeast RP mutants lower splicing efficiency rather than fidelity.
  downstream:
  - target: Altered 5' Splice-Site Selection in Ciliary and Retinal Transcripts
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38605034
      reference_title: "PRPF8-mediated dysregulation of hBrr2 helicase disrupts human spliceosome kinetics and 5´-splice-site selection causing tissue-specific defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Comprehensive molecular, transcriptomic, and proteomic analyses revealed a role of the PRPF8/Brr2 regulation in 5'-splice site (5'SS) selection by spliceosomes"
      explanation: Links PRPF8-Brr2 regulation to 5' splice-site selection in patient-derived cells.
- name: Altered 5' Splice-Site Selection in Ciliary and Retinal Transcripts
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    In patient iPSC-derived retinal cells carrying H2309P, weak 5' splice sites
    are used less, cryptic splicing increases, and the changes fall mainly on
    ciliary and retina-specific transcripts. Other RP13 variants reduce PRPF8
    binding to pre-mRNA and slow intron removal in RPE cells.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA 5'-splice site recognition
    term:
      id: GO:0000395
      label: mRNA 5'-splice site recognition
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38605034
    reference_title: "PRPF8-mediated dysregulation of hBrr2 helicase disrupts human spliceosome kinetics and 5´-splice-site selection causing tissue-specific defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "for which disruption impaired alternative splicing and weak/suboptimal 5'SS selection, and enhanced cryptic splicing, predominantly in ciliary and retinal-specific transcripts"
    explanation: The splicing defect in patient-derived cells and the transcripts it targets.
  - reference: PMID:40045025
    reference_title: "Retinitis pigmentosa-linked mutations impair the snRNA unwinding activity of SNRNP200 and reduce pre-mRNA binding of PRPF8."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The RP variants of PRPF8 did not affect snRNAs, but showed a reduced binding to pre-mRNAs, which resulted in the slower splicing of introns and altered expression of hundreds of genes in RPE cells."
    explanation: A second route by which RP13 variants alter splicing in retinal cells.
  downstream:
  - target: Photoreceptor Ciliary Defects and Rod Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal Pigment Epithelium Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Photoreceptor Ciliary Defects and Rod Degeneration
  conforms_to: "spliceosome_component_dysfunction#Failure of Splicing-Sensitive Cell Populations"
  description: >-
    Photoreceptors show ciliary and polarity defects and outer segment thinning,
    and rods are lost before cones. In retinal organoids these defects arise in
    the neural retina without RPE, so they are not only secondary to RPE
    failure. The cilium assembly binding is inferred from the reported ciliary
    defects; the sources do not show which step of ciliogenesis fails.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: rod photoreceptor
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: photoreceptor cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38605034
    reference_title: "PRPF8-mediated dysregulation of hBrr2 helicase disrupts human spliceosome kinetics and 5´-splice-site selection causing tissue-specific defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We used patient induced pluripotent stem cells-derived cells, carrying the heterozygous PRPF8 c.6926 A > C (p.H2309P) mutation to demonstrate retinal-specific endophenotypes comprising photoreceptor loss, apical-basal polarity and ciliary defects."
    explanation: Photoreceptor loss and ciliary defects in patient-derived retinal cells.
  - reference: PMID:41731009
    reference_title: "PRPF8-associated retinitis pigmentosa variant induces human neural retina-autonomous photoreceptor defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, we present a model of RP that recapitulates photoreceptor degeneration and demonstrates that these defects are independent of RPE degeneration."
    explanation: Photoreceptor degeneration in organoids lacking RPE.
  - reference: PMID:15126168
    reference_title: "Histologic study of retinitis pigmentosa due to a mutation in the RP13 gene (PRPC8): comparison with rhodopsin Pro23His, Cys110Arg, and Glu181Lys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All eyes showed loss of rod photoreceptors."
    explanation: >-
      Rod loss in post-mortem eyes. The finding pools one PRPF8 Arg2310Gly
      eye with three rhodopsin-RP eyes, so it is not specific to PRPF8.
  downstream:
  - target: Night blindness
  - target: Constriction of peripheral visual field
  - target: Rod-cone dystrophy
  - target: Abnormal electroretinogram
- name: Retinal Pigment Epithelium Dysfunction
  description: >-
    Patient iPSC-derived RPE carrying a PRPF8 variant shows weakened barrier
    function, disrupted polarity, loss of apical microvilli and pigment
    granules, and splicing changes enriched in cilium and melanosome pathways,
    all reversed by base-editing correction. In Prpf8 H2309P knock-in mice,
    primary RPE from homozygous animals phagocytoses less at a young age, and
    heterozygous RPE degenerates morphologically by two years. Another patient
    iPSC-RPE line phagocytosed normally, so how much RPE failure contributes in patients is
    unresolved.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:41533919
    reference_title: "PRPF8 Mutation-Induced Defects in Human iPSC-Derived RPE Are Rescued by Adenine Base Editing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRPF8-mutant RPE cells exhibited decreased PRPF8 mRNA and protein levels, weakened barrier function, and disrupted cell polarity."
    explanation: RPE defects in patient-derived and engineered PRPF8-mutant cells.
  - reference: PMID:20811066
    reference_title: "Three gene-targeted mouse models of RNA splicing factor RP show late-onset RPE and retinal degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The RPE cells of heterozygous Prpf3(+/T494M) and Prpf8(+/H2309P) knockin mice exhibited loss of the basal infoldings and vacuolization"
    explanation: RPE degeneration in heterozygous Prpf8 knock-in mice, reported at two years of age.
  - reference: PMID:25111227
    reference_title: "Mutations in pre-mRNA processing factors 3, 8, and 31 cause dysfunction of the retinal pigment epithelium."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In all three mutant models, 37% to 48% decrease in phagocytosis was observed"
    explanation: >-
      Reduced RPE phagocytosis, pooled across homozygous Prpf3, homozygous
      Prpf8 H2309P and Prpf31 heterozygous mice.
  - reference: PMID:30572641
    reference_title: "Functional Assessment of Patient-Derived Retinal Pigment Epithelial Cells Edited by CRISPR/Cas9."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Functionally, the RPE cells were able to establish apicobasal polarity and phagocytose photoreceptor outer segments at the same capacity as wild-type cells."
    explanation: >-
      Patient-derived PRPF8-mutant RPE phagocytosed normally, contradicting the
      mouse phagocytosis defect.

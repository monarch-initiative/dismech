animal_models:
- name: Prpf8 H2309P knock-in mouse
  species: Mouse
  genotype: Prpf8(+/H2309P) and Prpf8(H2309P/H2309P)
  publication: PMID:20811066
  modeled_mechanisms:
  - target: Retinal Pigment Epithelium Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Carries the most common human RP13 allele in the endogenous gene and
      develops late RPE degeneration and reduced RPE phagocytosis.
    limitations: >-
      The early phagocytosis defect was measured in homozygous mice, and
      heterozygotes, the human genotype, show only late RPE morphological
      change at about two years. The mouse does not develop the photoreceptor
      degeneration that defines the human disease, and patient iPSC-RPE did not
      reproduce its phagocytosis defect.
    evidence:
    - reference: PMID:25111227
      reference_title: "Mutations in pre-mRNA processing factors 3, 8, and 31 cause dysfunction of the retinal pigment epithelium."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we investigated its phagocytic function in Prpf3(T494M/T494M), Prpf8(H2309P/H2309P), and Prpf31(+/-) mice"
      explanation: >-
        Identifies the homozygous Prpf8 knock-in as one of the three models in
        which the pooled phagocytosis defect was measured.

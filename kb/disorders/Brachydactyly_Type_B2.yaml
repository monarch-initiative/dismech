genetic:
- name: NOG Missense Variants
  gene_term:
    preferred_term: NOG
    term:
      id: hgnc:7866
      label: NOG
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Six heterozygous missense substitutions (P35A, P35S, A36P, E48K, R167G,
    P187S) were reported in ROR2-negative BDB patients. Unlike the NOG
    loss-of-function alleles behind the symphalangism and multiple-synostoses
    spectrum, these are interpreted as altering ligand binding subtly rather
    than abolishing antagonist activity.
  evidence:
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified six different point mutations (P35A, P35S, A36P, E48K, R167G, and P187S) in the bone morphogenetic protein (BMP) antagonist NOGGIN (NOG)"
    explanation: Lists the BDB2 allele set.
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the newly identified BDB mutations do not indicate a major loss of function"
    explanation: Distinguishes the BDB2 alleles from NOG null alleles on functional grounds.
diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Suspect BDB2 in a patient with the type B digital pattern who also has
    proximal symphalangism and carpal or tarsal synostosis, especially after a
    negative ROR2 result. Confirmation is by NOG sequencing. Because NOG
    loss-of-function alleles cause joint fusion without brachydactyly, the
    variant's predicted effect matters as much as its presence.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Terminal deficiency of digits II-V with proximal symphalangism and carpal
    synostosis on radiographs, plus a heterozygous NOG missense variant.
  evidence:
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a subset of ROR2-negative patients with BDB, clinically defined by the additional occurrence of proximal symphalangism and carpal synostosis, we identified six different point mutations (P35A, P35S, A36P, E48K, R167G, and P187S) in the bone morphogenetic protein (BMP) antagonist NOGGIN (NOG)."
    explanation: Defines both the clinical trigger and the confirmatory test for BDB2.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is clinical, anthropometric and radiological."
    explanation: Establishes the clinical-radiographic basis of brachydactyly diagnosis.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling for autosomal dominant transmission of a NOG missense allele,
    including the point that other NOG variants in the family's differential
    cause joint fusion without brachydactyly.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The nature of genetic counseling depends both on the pattern of inheritance of the type of brachydactyly present in the family and on the presence or absence of accompanying symptoms."
    explanation: Supports inheritance- and phenotype-specific counseling.
- name: Function- or Cosmesis-Directed Hand Surgery
  description: >-
    Surgery is reserved for meaningful impairment of hand function or selected
    cosmetic indications; fused proximal joints limit what reconstruction can
    restore.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Plastic surgery is only indicated if the brachydactyly affects hand function or for cosmetic reasons, but is typically not needed."
    explanation: Defines the limited surgical indications in isolated brachydactyly.
- name: Hand Function Rehabilitation
  description: >-
    Physical and occupational therapy where terminal deficiency and joint fusion
    limit grip and pinch.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Physical therapy and ergotherapy may ameliorate hand function."
    explanation: Supports function-directed rehabilitation.

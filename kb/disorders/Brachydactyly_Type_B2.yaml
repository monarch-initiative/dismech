    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The various types of isolated brachydactyly are rare, except for types A3 and D."
    explanation: Places isolated type B among the rare brachydactylies.
pathophysiology:
- name: Subtle Alteration of NOGGIN Ligand Binding
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    NOGGIN is a secreted antagonist that sequesters BMPs and GDFs, setting the
    level of BMP signal a tissue receives. Loss-of-function NOG alleles cause
    joint-fusion phenotypes — proximal symphalangism, multiple synostoses,
    stapes ankylosis — but not brachydactyly. The BDB2 variants behave
    differently: free-binding-energy calculations for the modelled NOG-GDF5
    complex and micromass functional assays do not indicate a major loss of
    function, so the interpretation is a subtle shift in which ligands NOG binds
    and how tightly, tilting the BMP balance rather than removing the brake.
    That distinction is what explains why these alleles add terminal digital
    deficiency to the familiar NOG joint phenotype.
  gene:
    preferred_term: NOG
    term:
      id: hgnc:7866
      label: NOG
  biological_processes:
  - preferred_term: Negative Regulation of BMP Signaling Pathway
    term:
      id: GO:0030514
      label: negative regulation of BMP signaling pathway
    modifier: DYSREGULATED
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to previously described loss-of-function mutations in NOG, which are known to cause a range of conditions associated with abnormal joint formation but without BDB, the newly identified BDB mutations do not indicate a major loss of function, as suggested by calculation of free-binding energy of the modeled NOG-GDF5 complex and functional analysis of the micromass culture system."
    explanation: >-
      Separates the BDB2 allele class from the NOG loss-of-function alleles that
      cause joint fusion without brachydactyly.
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rather, they presumably alter NOG's ability to bind to BMPs and growth-differentiation factors (GDFs) in a subtle way, thus disturbing the intricate balance of BMP signaling."
    explanation: States the proposed molecular mechanism of the BDB2 alleles.
  downstream:
  - target: Deregulated BMP Balance at the Digital Ray and Interphalangeal Joints
    description: >-
      An altered antagonist changes the BMP/GDF signal reaching the condensing
      digital ray and the forming joints.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17668388
      reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "thus disturbing the intricate balance of BMP signaling"
      explanation: Links the altered binding directly to a deregulated BMP signalling balance.
- name: Deregulated BMP Balance at the Digital Ray and Interphalangeal Joints
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: CELLULAR
  description: >
    BMP signalling both drives chondrocyte differentiation within the digital
    condensation and specifies where the interzone forms that will become a
    joint. Shifting the balance therefore hits two things at once: segments fail
    to form distally (brachydactyly) and joints fail to cavitate proximally
    (symphalangism, carpal synostosis). The clinical combination in BDB2 —
    proximal joint fusion together with terminal digital deficiency — is the
    human read-out of that dual effect, and the authors read it as evidence that
    the ROR2 and BMP receptor pathways are functionally connected, plausibly via
    a heteromeric receptor complex at the cell surface.
  biological_processes:
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DYSREGULATED
  - preferred_term: Chondrocyte Differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: ABNORMAL
  - preferred_term: Embryonic Digit Morphogenesis
    term:
      id: GO:0042733
      label: embryonic digit morphogenesis
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: Prechondrogenic Mesenchymal Cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  evidence:
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combined features observed in this phenotypic subtype of BDB argue for a functional connection between BMP and ROR2 signaling and support previous findings of a modulating effect of ROR2 on the BMP-receptor pathway through the formation of a heteromeric complex of the receptors at the cell surface."
    explanation: >-
      The combined joint-fusion and terminal-deficiency phenotype is the
      evidence for BMP-ROR2 cross-talk in the digit.
  - reference: PMID:19790289
    reference_title: "The brachydactylies: a molecular disease family."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These studies have shown that the BMP pathway plays a pivotal role in the normal development of digits and joints and that the majority of brachydactyly disease genes are directly or indirectly linked to this pathway."
    explanation: Supports BMP signalling as the shared effector for both digit and joint formation.
  downstream:
  - target: Terminal Digital Deficiency with Proximal Joint Fusion
    description: >-
      Deregulated BMP output produces both the failure of distal segments and
      the failure of proximal joint cavitation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:17668388
      reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "clinically defined by the additional occurrence of proximal symphalangism and carpal synostosis"
      explanation: Names the composite phenotype that defines this subtype clinically.
- name: Terminal Digital Deficiency with Proximal Joint Fusion
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation: hypoplasia or aplasia of distal and middle
    phalanges of fingers and toes II-V — typically severe in rays IV-V and milder
    in II-III — together with proximal and occasionally distal symphalangism,
    fusion of carpal and tarsal bones, and partial cutaneous syndactyly. The
    joint-fusion component is what separates the phenotype clinically from
    ROR2-related BDB1.
  biological_processes:
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brachydactyly type B (BDB) is characterized by terminal deficiency of fingers and toes"
    explanation: Establishes the terminal digital deficiency shared with BDB1.

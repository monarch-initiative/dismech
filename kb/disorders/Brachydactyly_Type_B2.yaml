    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brachydactyly type B (BDB) is characterized by terminal deficiency of fingers and toes, which is caused by heterozygous truncating mutations in the receptor tyrosine kinase-like orphan receptor 2 (ROR2) in the majority of patients."

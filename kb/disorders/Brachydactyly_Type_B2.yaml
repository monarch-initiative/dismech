name: Brachydactyly Type B2
synonyms:
- BDB2
- NOG-related brachydactyly type B
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type B2 (BDB2) is the NOG-related form of brachydactyly type B:
  the same terminal deficiency of fingers and toes II-V seen in ROR2-related BDB1,
  but with proximal symphalangism and carpal/tarsal synostosis added, plus partial
  cutaneous syndactyly. It was defined molecularly by testing ROR2-negative
  patients whose joints were fused proximally as well as distally. The causal
  variants are missense substitutions in NOGGIN, the secreted BMP/GDF antagonist,
  and they are pointedly not the loss-of-function alleles already known from the
  NOG symphalangism spectrum: modelling and micromass assays indicate a subtle
  change in NOG's affinity for BMPs and GDFs rather than a major loss of
  antagonist activity. BDB2 therefore sits at the junction of two mechanisms —
  the joint-fusion phenotypes of NOG haploinsufficiency and the terminal digital
  deficiency of ROR2 — and its existence is the main human evidence that ROR2
  and BMP signalling interact in the developing digit.
disease_term:
  preferred_term: brachydactyly type B2
  term:

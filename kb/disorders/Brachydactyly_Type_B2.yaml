inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous NOG missense variants, in keeping with the dominant inheritance
    of the other NOG-related skeletal phenotypes.
  evidence:
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a subset of ROR2-negative patients with BDB, clinically defined by the additional occurrence of proximal symphalangism and carpal synostosis, we identified six different point mutations (P35A, P35S, A36P, E48K, R167G, and P187S) in the bone morphogenetic protein (BMP) antagonist NOGGIN (NOG)."
    explanation: Six heterozygous point mutations across a patient subset establish the dominant NOG-related form.
classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly type B2 (NOG; OMIM 611377) as a row separate from
      ROR2-related type B. The other NOG-related entities — the multiple
      synostoses and proximal symphalangism syndromes — are placed in the
      synostoses group rather than here, so the gene does not determine the
      group. The 2019 revision (PMID:31633310) placed type B2 in group 37
      "Brachydactylies (without extraskeletal manifestations)". Per-row
      re-verification against the 2023 Table 1 is tracked in
      monarch-initiative/dismech#7867.

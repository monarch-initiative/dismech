  conforms_to: 'fibrotic_response#Architectural Distortion and Organ Dysfunction'
  description: >-
    Bridging scar, regenerative nodules, sinusoidal and vascular remodeling, and
    loss of functional hepatocyte mass produce cirrhosis, portal hypertension, and
    impaired liver function. These manifestations characterize advanced disease
    rather than every person with ALD.

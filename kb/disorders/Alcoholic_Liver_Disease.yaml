      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While TLR4 deficiency was protective, MyD88 deficiency failed to prevent
        alcohol-induced liver damage and inflammation.
      explanation: >-
        Ethanol-fed knockout mice support TLR4-dependent hepatic inflammatory injury
        downstream of gut-derived endotoxin while refining the signaling route.

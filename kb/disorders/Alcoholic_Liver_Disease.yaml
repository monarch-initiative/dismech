notes: >-
  ALD is modeled as a heterogeneous spectrum. Alcohol-associated hepatitis is an
  acute-on-chronic branch rather than a required linear stage. The LSEC Hsp90-eNOS
  axis is retained as an emerging preclinical hypothesis. PNPLA3 rs738409 is a
  susceptibility locus and not a monogenic cause. Clinical management and diagnostic
  entries are evidence-bounded and do not replace individualized specialist guidance.

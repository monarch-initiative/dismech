    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of inflammatory mediators (tumor necrosis factor-alpha and
      interleukin-6) and TLR4 coreceptors (CD14 and MD2) was significantly higher
      in livers of alcohol-fed WT, TLR2-KO, or MyD88-KO, but not in TLR4-KO mice,

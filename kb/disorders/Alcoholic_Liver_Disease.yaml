- name: Kupffer-Cell and Hepatocyte Inflammatory Injury
  description: >-
    Oxidative hepatocyte injury and gut-derived microbial signals converge on Kupffer
    cells and hepatocytes, increasing TLR4-linked inflammatory signaling, cytokine
    production, and hepatocyte death. Human single-cell data show immune remodeling
    in established ALD but are associative rather than proof of causal direction.
  cell_types:
  - preferred_term: hepatocyte

progression:
- phase: Early asymptomatic injury and steatosis
  notes: >-
    Early ALD may be clinically silent and may include steatosis; the spectrum
    statement does not imply inevitable progression to advanced disease.
  evidence:
  - reference: PMID:38174913
    reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The spectrum of ALD ranges from early asymptomatic liver injury to advanced
      disease with decompensation and portal hypertension.
    explanation: The guideline supports an early asymptomatic end of the ALD spectrum.
- phase: Alcohol-associated hepatitis acute branch
  notes: >-
    AH can present acutely on underlying chronic liver disease with rapidly
    worsening jaundice. It is modeled as a branch rather than a required stage
    between steatosis and fibrosis.
  evidence:
  - reference: PMID:39362713
    reference_title: Pathogenesis of Alcohol-Associated Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenesis of alcohol-associated hepatitis (AH), an advanced form of
      acute-on-chronic liver failure due to excessive chronic intake in patients
      with underlying liver disease, is not well understood.
    explanation: The review supports acute-on-chronic AH and the remaining mechanistic uncertainty.
- phase: Advanced fibrosis, cirrhosis, and decompensation
  notes: >-
    Continued injury can produce advanced fibrosis and cirrhosis with portal
    hypertension and decompensation, although individual trajectories vary.
  evidence:
  - reference: PMID:38174913
    reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The spectrum of ALD ranges from early asymptomatic liver injury to advanced
      disease with decompensation and portal hypertension.
    explanation: The guideline identifies the advanced end of the clinical spectrum.
diagnosis:
- name: Clinical assessment of harmful alcohol exposure
  description: >-
    A nonjudgmental alcohol-use history establishes the principal etiologic risk
    context for ALD. Exposure history alone neither confirms a particular ALD stage
    nor substitutes for assessment of liver injury.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Harmful alcohol exposure establishes the etiologic risk context but does not stage liver disease.
  evidence:
  - reference: PMID:38174913
    reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With harmful alcohol use as the primary risk factor, increasing alcohol use
      over the past decade has resulted in rapid growth of the ALD-related healthcare
      burden.
    explanation: The guideline supports harmful alcohol use as the defining etiologic risk context.
- name: Clinical classification of suspected alcohol-associated hepatitis
  description: >-
    Suspected AH should be classified as definite, probable, or possible using the
    NIAAA consensus framework. Probable AH requires the characteristic clinical and
    laboratory pattern without confounding factors; possible AH warrants additional
    evaluation and may require biopsy before disease-specific treatment.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Definite or probable AH supports treatment eligibility assessment; possible AH requires clarification of confounding causes.
  evidence:
  - reference: PMID:26921783
    reference_title: 'Standard Definitions and Common Data Elements for Clinical Trials in Patients With Alcoholic Hepatitis: Recommendation From the NIAAA Alcoholic Hepatitis Consortia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Probable AH: Clinically diagnosed AH without confounding factors (see below).
      In patients with heavy alcohol use and typical liver tests; and negative markers
      for immune (antinuclear antibody < 1:160 or anti–smooth antibody < 1:80
      dilutions) and metabolic liver disease; and absence of sepsis, shock, cocaine
      use, or recent use of a drug with DILI potential within 30 days, a diagnosis
      other than AH will be made in <10% of patients on liver biopsy.
    explanation: >-
      The NIAAA consensus defines probable AH and explicitly requires absence of
      major confounding causes.
- name: Transient elastography for fibrosis staging
  description: >-
    Transient elastography can noninvasively assess advanced fibrosis and cirrhosis
    in people with excessive alcohol use. Active alcohol-associated hepatitis can
    raise liver stiffness independently of fibrosis and must be considered during
    interpretation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Higher liver stiffness supports advanced fibrosis or cirrhosis, interpreted in the context of active hepatitis.
  evidence:
  - reference: PMID:28387018
    reference_title: Transient elastography alone and in combination with FibroTest(®) for the diagnosis of hepatic fibrosis in alcoholic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TE values correlated with fibrosis stage (r=.73; P<.0001) and steatosis stage
      (r=.19; P<.01). Patients with alcoholic hepatitis had higher TE values than
      those without alcoholic hepatitis (P<.0001).
    explanation: >-
      The prospective biopsy-referenced study supports TE for fibrosis staging and
      documents active hepatitis as an independent stiffness confounder.
treatments:
- name: Sustained alcohol abstinence with cessation support
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Sustained abstinence removes the initiating exposure. All patients should receive
    cessation support; integrated hepatology, addiction-medicine, and psychosocial
    treatment is particularly important when alcohol use disorder is present.
  treatment_term:
    preferred_term: therapeutic avoidance of environmental exposure
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Chronic Ethanol Exposure
    treatment_effect: INHIBITS
    description: Abstinence removes continued ethanol exposure, the initiating driver of the modeled causal graph.
    evidence:
    - reference: PMID:38174913
      reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Abstinence of alcohol use, a crucial determinant of long-term outcomes, is challenging to achieve in ALD patients with concurrent alcohol use disorder (AUD).
      explanation: The guideline identifies abstinence as a crucial determinant of long-term ALD outcomes.
  evidence:
  - reference: PMID:36481475
    reference_title: Alcohol Abstinence Improves Prognosis Across All Stages of Portal Hypertension in Alcohol-Related Cirrhosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alcohol abstinence was linked to a significantly reduced risk of hepatic
      decompensation
    explanation: >-
      In a cohort with alcohol-related cirrhosis and clinically significant portal
      hypertension, abstinence was associated with lower decompensation and mortality.
- name: Prednisolone for eligible severe alcohol-associated hepatitis
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Prednisolone is restricted to eligible patients with definite or probable severe
    AH (MELD >20), after serious infection and other glucocorticoid contraindications
    are assessed. Response should be checked with the Lille model at day 4 or 7 and
    treatment stopped for nonresponse (>0.45). STOPAH found a nonsignificant 28-day
    mortality reduction, no 90-day or one-year benefit, and more serious infections,
    so benefit should not be generalized to all ALD.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Kupffer-Cell and Hepatocyte Inflammatory Injury
    treatment_effect: INHIBITS
    description: Systemic corticosteroid activity suppresses the severe inflammatory injury phenotype in eligible AH.
    evidence:
    - reference: PMID:38174913
      reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Corticosteroids are currently the only available therapeutic with proven
        efficacy for patients with severe AH, providing survival benefit at 1 month
        in 50%-60% of patients.
      explanation: The guideline limits corticosteroid efficacy to severe AH and short-term outcomes.
  evidence:
  - reference: PMID:27979049
    reference_title: 'Medical Management of Severe Alcoholic Hepatitis: Expert Review from the Clinical Practice Updates Committee of the AGA Institute.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with MDF > 32 or MELD score > 20 without a contraindication to
      glucocorticoid, such as hepatitis B viral infection, tuberculosis, or other
      serious infectious diseases, may be treated with methylprednisolone 32 mg daily
    explanation: >-
      The expert review bounds glucocorticoid use to severe AH and requires
      contraindication and serious-infection assessment.
  - reference: PMID:27922027
    reference_title: A Day-4 Lille Model Predicts Response to Corticosteroids and Mortality in Severe Alcoholic Hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LM4 is as accurate as LM7 in predicting response to corticosteroids, as well as
      28- and 90-day mortality. Assessing the efficacy of prednisolone at an earlier
      time point can avoid a more prolonged futile use of this therapy.
    explanation: The multinational cohort supports day-4 assessment as an alternative to day 7.
  - reference: PMID:27922027
    reference_title: A Day-4 Lille Model Predicts Response to Corticosteroids and Mortality in Severe Alcoholic Hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Response to corticosteroids was assessed with LM4 and LM7, according to the
      validated cutoff value (CUV>0.45).
    explanation: The study supplies the Lille nonresponse cutoff used to stop futile exposure.
  - reference: PMID:25901427
    reference_title: Prednisolone or pentoxifylline for alcoholic hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prednisolone was associated with a reduction in 28-day mortality that did not
      reach significance and with no improvement in outcomes at 90 days or 1 year.
    explanation: STOPAH bounds the magnitude and duration of prednisolone benefit.
  - reference: PMID:25901427
    reference_title: Prednisolone or pentoxifylline for alcoholic hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serious infections occurred in 13% of the patients treated with prednisolone
      versus 7% of those who did not receive prednisolone (P=0.002).
    explanation: STOPAH documents the important infection-risk tradeoff.
- name: Liver transplantation for selected advanced disease
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Liver transplantation can replace a failing cirrhotic liver and may be considered
    for carefully selected patients with severe AH unresponsive to medical therapy.
    Evidence for early transplantation in AH comes from highly selected cohorts and
    must not be generalized to all patients.
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Cirrhotic Architectural Distortion and Functional Failure
    treatment_effect: BYPASSES
    description: >-
      Transplantation replaces a selected nonrecovering, decompensated or failing
      liver rather than reversing its established fibrotic mechanism.
    evidence:
    - reference: PMID:38174913
      reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Liver transplantation, a definitive treatment option in patients with
        advanced cirrhosis, should be considered in selected patients with AH, who
        are unresponsive to medical therapy and have a low risk of relapse to
        posttransplant alcohol use.
      explanation: The guideline supports transplantation for advanced cirrhosis and selected AH nonresponders.
  evidence:
  - reference: PMID:22070476
    reference_title: Early liver transplantation for severe alcoholic hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fewer than 2% of patients admitted for an episode of severe alcoholic hepatitis were selected.
    explanation: The pivotal early-transplant study documents the narrow selection boundary.
  - reference: PMID:22070476
    reference_title: Early liver transplantation for severe alcoholic hepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cumulative 6-month survival rate (±SE) was higher among patients who
      received early transplantation than among those who did not (77 ± 8% vs. 23
      ± 8%, P<0.001).
    explanation: The selected severe-AH cohort had substantially higher six-month survival after transplantation.
discussions:
- discussion_id: gap_baijiu_nonethanol_active_constituent_and_mediation
  prompt: >-
    Which of the GC-MS-identified candidate non-ethanol Baijiu constituents, or
    which combination, accounts for the protection observed in ethanol-exposed
    mice, and is that protection mediated by a species-resolved microbial lactate
    route, an intrahepatic glycolytic-lactate route, a lactate-independent
    intestinal-barrier/endotoxin route, a microbial tryptophan-metabolite/AhR
    route, a direct hepatic effect, or a combination of these routes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#baijiu_extract_microbiota_lactate_mediation_model
  - pathophysiology#Hepatic Ethanol Metabolism and Redox-Oxidative Stress
  - pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation
  - pathophysiology#Kupffer-Cell and Hepatocyte Inflammatory Injury
  rationale: >-
    The source study compared a chemically complex non-ethanol extract with
    ethanol and measured microbiota composition, metabolites, redox markers, and
    liver injury concurrently. GC-MS identified candidate constituents, but
    those candidates were not individually or combinatorially perturbed to assign
    the whole-extract effect. The co-moving endpoints also do not establish
    causal order, and co-moving permeability, endotoxin, and inflammatory
    endpoints alone cannot establish barrier-pathway mediation. Genus-level 16S
    data and the Firmicutes/Bacteroidetes ratio cannot show that the expanded
    Ligilactobacillus population produced the lactate reaching the liver, while
    the cell assay shows only that excess lactate can worsen oxidative stress. A
    separate chronic liquor-fed mouse study found alcohol-associated depletion
    of broad Lactobacillus and Bifidobacterium populations and protection after
    Lactiplantibacillus plantarum treatment, so taxon direction is strain- and
    model-dependent rather than a general refutation or validation of the
    Ligilactobacillus observation. A causal pectin study in
    human-microbiota-associated alcohol-fed mice associated higher bacterial
    tryptophan-metabolite production with improvement and causally implicated
    AhR signaling: an AhR agonist reduced injury and Ahr loss abolished the
    prebiotic benefit. This competing route was not measured in the seed study.
    In severe human alcohol-related acute-on-chronic liver failure, serum lactate
    predicts mortality but does not establish a microbial source or causal
    direction. Even if lactate contributes, hepatocyte-derived glycolytic lactate
    rather than gut-derived flux could explain the hepatic signal. A changed
    community could instead protect through intestinal-barrier integrity,
    reduced portal endotoxin, and lower hepatic TLR4/Kupffer-cell activation
    without lactate mediation. Moreover, complete microbiota removal can itself
    alter ethanol metabolism and worsen acute liver injury in mice, so a global
    depletion comparison would not isolate either microbial route. Independent
    in-vivo and hepatocyte fraction screens, species- and strain-resolved
    transfer, pathway-specific readouts for endotoxin/TLR4 and
    tryptophan-metabolite/AhR alternatives, source-resolved metabolic tracing,
    and controlled rescue and pathway-interaction experiments are needed before
    this model-specific signal can be added to the causal graph. Two subsequent
    non-ALD mouse studies now directly demonstrate a gut-to-portal-vein-to-liver
    D-lactate route that the seed study could not establish on its own:
    commensal-derived D-lactate reaching the liver via the portal vein programs
    Kupffer-cell-mediated pathogen clearance in a sepsis model, and gut
    microbiota is reported as the dominant source of circulating D-lactate that
    raises hepatic glycogen, triglycerides, and inflammation in obese mice with
    fatty liver disease. Both studies overturn the narrow claim that no
    gut-to-liver lactate route has been shown, but neither exposes ethanol,
    tests the Baijiu extract, or resolves whether the (R)-lactate (D-lactate) or
    (S)-lactate (L-lactate) stereoisomer is the species reaching the liver in the
    ethanol-exposed model; they sharpen rather than validate the
    microbiota-lactate hypothesis and should be read as external plausibility
    for a route, not as evidence for this intervention. A distinct finding in a
    direct alcohol-associated liver disease mouse model complicates rather than
    supports the microbiota-lactate model: ethyl lactate, a lactate ester and
    non-ethanol distilled-liquor ingredient chemically distinct from free D- or
    L-lactate, ameliorates ethanol-induced hepatosteatosis and acute-on-chronic
    injury through hepatocyte SIRT1-FGF21 signaling, independent of any
    demonstrated microbial lactate flux; this ester must not be conflated with
    the microbial-lactate route and is itself a plausible, mechanistically
    direct candidate among the seed study's GC-MS-identified constituents. A
    separate Baijiu-versus-ethanol comparison in mice adds a further competing
    route: a non-alcoholic Baijiu-compound formula attenuated ethanol-induced
    liver injury and intestinal barrier leakage by opposing
    deoxycholic-acid-driven barrier disruption, implicating bile-acid signaling
    alongside the tryptophan-metabolite/AhR pathway already noted above
    (deoxycholic acid/deoxycholate should not be confused with the unrelated
    drug dichloroacetate, which shares the same DCA abbreviation). The finding
    does not establish that Baijiu is safer than other alcohol exposure or
    protective in humans.
  proposed_experiments:
  - experiment_id: exp_baijiu_fraction_gnotobiotic_pathway_mediation
    name: Bioassay-guided fractionation with gnotobiotic pathway mediation testing
    description: >-
      Fractionate the study's non-ethanol extract and run two independent
      bioactivity screens: an ethanol-dose-matched, isocaloric, pair-fed mouse
      screen for in-vivo protection and microbial/barrier effects, and a primary
      hepatocyte screen for microbiota-independent direct effects. Advance every
      reproducibly in-vivo-active fraction into conventional and gnotobiotic
      pathway testing regardless of its hepatocyte result; retain
      hepatocyte-active fractions separately as direct-effect candidates. In
      gnotobiotic recipients colonized with microbiota from ethanol-only or
      fraction-treated donors, resolve the Ligilactobacillus signal to cultured
      species and strains, quantify lactate production, and compare
      reconstitution with the wild-type isolate versus a
      lactate-production-deficient derivative. Use stable-isotope tracing and
      lactate add-back to test the lactate route, alongside intestinal
      permeability, portal endotoxin, tight-junction, and hepatic
      TLR4/Kupffer-cell measurements for a lactate-independent barrier route. For
      the barrier route, restore the portal lipopolysaccharide exposure of
      protected mice to the ethanol-only range without changing lactate, and
      cross the fraction or community intervention with Kupffer-cell-specific
      Tlr4 loss or validated Kupffer-targeted TLR4 inhibition to test phenocopy,
      occlusion, and add-back interaction. In parallel, quantify microbial
      tryptophan metabolites and AhR target engagement, then use AhR inhibition
      and agonist rescue to test whether this competing microbial-metabolite
      pathway is necessary or sufficient. Throughout, quantify D-lactate and
      L-lactate separately by chiral chromatography in intestinal contents,
      portal blood, systemic blood, and liver rather than assuming a single
      achiral lactate pool. Add a parallel arm testing the distinct non-ethanol
      constituent ethyl lactate against equimolar free D-/L-lactate, with SIRT1
      inhibition and hepatocyte-specific Fgf21 loss, to isolate this
      ester-specific direct-hepatic route from microbial lactate flux. Add a
      further arm restoring deoxycholic acid in protected animals to the
      ethanol-only range to test a bile-acid/barrier route distinct from
      lipopolysaccharide-driven endotoxin signaling. Measure ethanol
      pharmacokinetics in every arm.
    experiment_type:
      preferred_term: bioassay-guided fractionation and gnotobiotic mediation experiment
    model_systems:
    - name: Ethanol-exposed conventional and gnotobiotic C57BL/6J mice
      description: >-
        Pair-fed female and male mice receiving identical ethanol doses, with
        defined donor communities or strain-level reconstitution in gnotobiotic
        recipients.
      experimental_model_type: OTHER
      organism:
        preferred_term: mouse
        term:
          id: NCBITaxon:10090
          label: Mus musculus
    - name: Primary mouse hepatocyte direct-effect assay
      description: >-
        Primary hepatocytes exposed to matched ethanol and extract fractions,
        with or without lactate, to test protection that does not require a
        microbial community.
      experimental_model_type: PRIMARY_CELL_CULTURE
      organism:
        preferred_term: mouse
        term:
          id: NCBITaxon:10090
          label: Mus musculus
      cell_types:
      - preferred_term: hepatocyte
        term:
          id: CL:0000182
          label: hepatocyte
    perturbations:
    - name: Chemically defined non-ethanol extract fractions
      target: pathophysiology#Hepatic Ethanol Metabolism and Redox-Oxidative Stress
      description: >-
        Compare the whole extract, orthogonal chemical fractions, and identified
        constituent combinations at exposure-matched doses.
    - name: Donor-community transfer and Ligilactobacillus strain reconstitution
      target: lactate biosynthetic process
      description: >-
        Transfer complete donor communities, then add a cultured candidate
        Ligilactobacillus strain or a lactate-production-deficient derivative to
        test strain and metabolic-function dependence.
      biological_processes:
      - preferred_term: lactate biosynthetic process
        term:
          id: GO:0019249
          label: lactate biosynthetic process
    - name: Stable-isotope lactate tracing and lactate add-back
      target: pathophysiology#Lipotoxic and Oxidative Hepatocyte Stress
      description: >-
        Trace intestinal-to-portal-to-hepatic lactate flux with stereospecific
        (chiral) separation of D-lactate from L-lactate, and restore each
        stereoisomer's exposure separately in protected animals to test
        whether lowering a specific stereoisomer, rather than total lactate,
        is necessary for protection.
      chemical_entities:
      - preferred_term: lactate
        term:
          id: CHEBI:24996
          label: lactate
      - preferred_term: D-lactate
        term:
          id: CHEBI:16004
          label: (R)-lactate
      - preferred_term: L-lactate
        term:
          id: CHEBI:16651
          label: (S)-lactate
    - name: Controlled portal-endotoxin add-back
      target: pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation
      description: >-
        In the protected fraction or donor-community arm, use titrated low-dose
        mesenteric-vein infusion of ultrapure lipopolysaccharide to restore the
        portal endotoxin time course and exposure to the ethanol-only range
        without exceeding its systemic endotoxin exposure, while confirming
        unchanged species-resolved lactate flux, ethanol pharmacokinetics, and
        community composition. This bypass rescue tests whether reduced hepatic
        endotoxin exposure is necessary for protection rather than merely
        co-moving with it.
      chemical_entities:
      - preferred_term: lipopolysaccharide
        term:
          id: CHEBI:16412
          label: lipopolysaccharide
    - name: Kupffer-cell TLR4 pathway interaction
      target: pathophysiology#Kupffer-Cell and Hepatocyte Inflammatory Injury
      description: >-
        Cross ethanol-only and protected fraction or donor-community arms with
        lineage-validated Kupffer-cell-specific Tlr4 loss or a validated
        Kupffer-targeted TLR4 inhibitor. Test whether pathway blockade
        phenocopies protection in ethanol-only mice, occludes additional
        protection by the fraction or community, and prevents portal-endotoxin
        add-back from restoring hepatic inflammation and injury.
    - name: AhR pathway necessity and sufficiency
      target: aryl hydrocarbon receptor signaling
      description: >-
        Cross ethanol-only and protected fraction or donor-community arms with
        Ahr-deficient recipients or a validated AhR antagonist, and administer
        the AhR agonist FICZ in a matched ethanol-only arm. Test whether AhR loss
        or inhibition abolishes protection and whether agonism phenocopies and
        occludes the fraction or community effect.
    - name: Ethyl lactate SIRT1-FGF21 pathway testing
      target: pathophysiology#Lipotoxic and Oxidative Hepatocyte Stress
      description: >-
        Administer purified ethyl lactate, at doses matched to its
        concentration in the whole extract, against equimolar free D-/L-lactate
        in ethanol-fed mice, with SIRT1 inhibition (EX527) and
        hepatocyte-specific Fgf21 loss in parallel arms. Tests whether the
        seed extract's activity depends on this distinct, microbiota-independent
        ester rather than on microbial lactate flux.
      chemical_entities:
      - preferred_term: ethyl lactate
        term:
          id: CHEBI:78321
          label: ethyl 2-hydroxypropanoate
    - name: Deoxycholate-dependent intestinal barrier testing
      target: pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation
      description: >-
        Compare exogenous deoxycholic-acid supplementation with a
        non-alcoholic Baijiu-compound formula in ethanol-fed mice to test
        whether extract protection acts by suppressing deoxycholic-acid-driven
        barrier disruption, distinct from the lipopolysaccharide/TLR4 and
        lactate routes tested above.
      chemical_entities:
      - preferred_term: deoxycholic acid
        term:
          id: CHEBI:28834
          label: deoxycholic acid
    controls:
    - name: Ethanol-only and vehicle controls
      description: >-
        Isocaloric pair-fed controls receiving identical ethanol doses, plus a
        non-ethanol vehicle or matrix control for every fraction.
    - name: Community, strain, and metabolite rescue controls
      description: >-
        Reciprocal donor-community transfers, heat-killed strain controls,
        wild-type versus lactate-deficient strain reconstitution, and
        osmolality- and pH-matched lactate vehicle controls.
    - name: Ethanol pharmacokinetic control
      description: >-
        Serial blood ethanol and acetaldehyde measurements to exclude altered
        ethanol absorption or clearance as the explanation for reduced injury.
    - name: Portal-endotoxin add-back controls
      description: >-
        Compare protected animals receiving exposure-matched lipopolysaccharide
        with protected vehicle-infused, ethanol-only vehicle-infused, and
        pair-fed sham-procedure controls. Verify the portal and systemic
        endotoxin time courses and confirm that add-back does not alter lactate
        flux, community composition, or ethanol and acetaldehyde exposure.
    - name: Kupffer-cell TLR4 interaction controls
      description: >-
        Use Cre-negative Tlr4-floxed littermates and validate Kupffer-cell
        targeting and TLR4 loss; for a pharmacologic replication, include matched
        inhibitor vehicle and target-engagement controls. Apply the same fraction,
        community, endotoxin-add-back, and pair-feeding assignments across
        TLR4-intact and TLR4-blocked groups.
    - name: AhR pathway interaction controls
      description: >-
        Use matched AhR-competent littermates, antagonist and agonist vehicle
        controls, equivalent donor-community engraftment, and intestinal and
        hepatic target-engagement measurements. Confirm that AhR perturbation
        does not change ethanol or acetaldehyde exposure.
    - name: Ethyl lactate and bile-acid pathway interaction controls
      description: >-
        Include dose-matched free D-/L-lactate and ester-vehicle controls for
        the ethyl lactate arm, EX527 vehicle and hepatocyte-specific
        Fgf21-intact littermates for the SIRT1-FGF21 cross, and
        deoxycholic-acid vehicle plus Baijiu-compound-formula-vehicle controls
        for the bile-acid arm. Confirm none of these perturbations alter
        ethanol or acetaldehyde exposure or species-resolved lactate flux.
    readouts:
    - name: Species-resolved microbial lactate flux
      target: lactate biosynthetic process
      description: >-
        Shotgun metagenomics, isolate genomics, and isotope-resolved fecal,
        portal, and hepatic lactate quantify the organism and metabolic flux
        rather than relying on a genus abundance or phylum ratio. Chiral
        separation resolves D-lactate from L-lactate at each site so that a
        stereospecific route is not collapsed into a single achiral pool.
      biological_processes:
      - preferred_term: lactate biosynthetic process
        term:
          id: GO:0019249
          label: lactate biosynthetic process
      assays:
      - preferred_term: shotgun metagenomic sequencing
      - preferred_term: targeted metabolomics
      - preferred_term: stable-isotope metabolic flux analysis
      - preferred_term: chiral chromatography
      direction: POSITIVE
    - name: Intestinal permeability and portal endotoxin
      target: pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation
      description: >-
        Serial FITC-dextran permeability and portal endotoxin measurements
        quantify barrier failure and microbial-product translocation
        independently of lactate and determine whether barrier improvement
        precedes hepatic pathway and injury changes.
      assays:
      - preferred_term: FITC-dextran intestinal permeability assay
      - preferred_term: portal endotoxin assay
      direction: POSITIVE
    - name: Intestinal tight-junction integrity
      target: pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation
      description: >-
        Intestinal epithelial ZO-1, occludin, and claudin localization and
        abundance provide an inverse readout of barrier dysfunction.
      assays:
      - preferred_term: tight-junction protein immunostaining
      - preferred_term: tight-junction protein quantification
      direction: NEGATIVE
    - name: Hepatic TLR4 and Kupffer-cell activation
      target: pathophysiology#Kupffer-Cell and Hepatocyte Inflammatory Injury
      description: >-
        Time-resolved hepatic TLR4-pathway activity, Kupffer-cell activation, and
        inflammatory cytokines test the sequence and interaction of a
        lactate-independent endotoxin route from community remodeling to liver
        injury.
      assays:
      - preferred_term: hepatic TLR4 signaling assay
      - preferred_term: Kupffer-cell activation assay
      - preferred_term: inflammatory cytokine quantification
      direction: POSITIVE
    - name: Microbial tryptophan metabolites and AhR target engagement
      target: aryl hydrocarbon receptor signaling
      description: >-
        Time-resolved fecal, portal, and hepatic tryptophan and indole metabolite
        profiles, together with intestinal and hepatic AhR reporter activity and
        Cyp1a1 and Nqo1 expression, test a causal microbial-metabolite route
        independently of lactate and endotoxin.
      assays:
      - preferred_term: targeted metabolomics
      - preferred_term: AhR reporter assay
      - preferred_term: gene expression assay
      direction: POSITIVE
    - name: Hepatic reductive redox shift and oxidative damage
      target: pathophysiology#Hepatic Ethanol Metabolism and Redox-Oxidative Stress
      description: >-
        Hepatic NADH/NAD+ ratio and MDA are measured before and after microbiota
        transfer, strain reconstitution, and lactate add-back.
      assays:
      - preferred_term: NADH to NAD+ ratio assay
      - preferred_term: lipid peroxidation assay
      direction: POSITIVE
    - name: Hepatic antioxidant capacity
      target: pathophysiology#Hepatic Ethanol Metabolism and Redox-Oxidative Stress
      description: >-
        SOD2 activity and the reduced-to-oxidized glutathione ratio provide
        inverse readouts of oxidative stress without bundling their direction
        with NADH/NAD+ and MDA.
      assays:
      - preferred_term: antioxidant enzyme activity assay
      - preferred_term: glutathione redox ratio assay
      direction: NEGATIVE
    - name: Hepatic injury and steatosis
      target: pathophysiology#Lipotoxic and Oxidative Hepatocyte Stress
      description: >-
        Blinded histopathology, hepatic triglycerides, serum ALT and AST, and
        inflammatory markers establish whether a change in lactate flux precedes
        and mediates tissue protection.
      assays:
      - preferred_term: liver histopathology
      - preferred_term: serum aminotransferase assay
      - preferred_term: hepatic triglyceride assay
      direction: POSITIVE
    - name: Hepatic SIRT1-FGF21 pathway activity
      target: pathophysiology#Lipotoxic and Oxidative Hepatocyte Stress
      description: >-
        Hepatic SIRT1 activity and serum/hepatic FGF21 induction test whether
        an ester-specific, microbiota-independent route accounts for
        protection when ethyl lactate is isolated from the whole extract.
      biological_processes:
      - preferred_term: fibroblast growth factor receptor signaling pathway
        term:
          id: GO:0008543
          label: fibroblast growth factor receptor signaling pathway
      assays:
      - preferred_term: sirtuin activity assay
      - preferred_term: enzyme-linked immunosorbent assay
      - preferred_term: gene expression assay
      direction: POSITIVE
    - name: Serum and hepatic bile acid profiling
      target: pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation
      description: >-
        Targeted bile-acid metabolomics quantifying deoxycholic acid and
        related secondary bile acids tests whether the extract or its
        fractions blunt ethanol-induced bile-acid elevation ahead of barrier
        and injury improvement.
      assays:
      - preferred_term: targeted metabolomics
      direction: POSITIVE
    decision_criterion: >-
      The microbiota-lactate model is supported only if a chemically defined
      fraction lowers species- and strain-resolved microbial lactate flux before
      hepatic improvement, the donor community transfers protection, and
      wild-type strain or lactate add-back reverses protection whereas a
      lactate-production-deficient strain does not, without changing ethanol
      exposure. A lactate-independent barrier/endotoxin model is favored if an
      in-vivo-active fraction or its donor community first improves permeability
      and tight-junction integrity, then lowers portal endotoxin, and only
      subsequently lowers hepatic TLR4/Kupffer-cell activation and injury despite
      unchanged species-resolved lactate flux and failure of lactate add-back to
      reverse protection. That temporal sequence must be accompanied by at least
      one causal interaction: exposure-matched portal-endotoxin add-back reverses
      hepatic pathway and injury protection without changing lactate or ethanol
      exposure, or Kupffer-cell TLR4 blockade phenocopies protection in
      ethanol-only mice and occludes the fraction or community effect, with
      blockade also preventing endotoxin add-back reversal. Co-moving barrier,
      endotoxin, inflammatory, and injury endpoints without add-back reversal or
      pathway occlusion are insufficient to support barrier mediation. A
      tryptophan-metabolite/AhR model is favored if a fraction or its donor
      community raises microbial indole ligands before protection, produces
      intestinal or hepatic AhR target engagement, and loses protection under
      AhR deficiency or antagonism, while FICZ phenocopies and occludes the
      effect without a necessary change in species-resolved lactate flux. A
      hepatocyte-derived glycolytic-lactate model is favored if hepatic lactate
      production changes before injury despite unchanged portal microbial
      lactate flux, and donor-community transfer, strain reconstitution, and
      intestinal lactate add-back do not account for protection. A
      direct hepatic model is favored if a fraction is active in the independent
      hepatocyte screen and protects in vivo while donor community transfer,
      lactate manipulation, barrier/endotoxin perturbations, and AhR interaction
      do not account for the effect. An ethyl-lactate/SIRT1-FGF21 model is
      favored if the isolated ester, independent of the whole extract, reduces
      steatosis and injury via hepatocyte FGF21 induction, that effect is
      abolished by SIRT1 inhibition or hepatocyte Fgf21 loss, and protection
      does not require microbial lactate manipulation or donor-community
      transfer. A deoxycholate-barrier model is favored if the extract or its
      fractions blunt ethanol-induced elevation of deoxycholic acid before
      injury improves, and exogenous deoxycholic-acid restoration in protected
      animals reverses barrier and injury protection without changing
      species-resolved lactate flux or ethanol exposure. Partial
      pathway-specific effects support combined mediation. The proposed
      microbiota-lactate hypothesis is refuted in this model if no
      species-resolved lactate flux is necessary for protection, even if a
      barrier/endotoxin, tryptophan-metabolite/AhR, ethyl-lactate/SIRT1-FGF21,
      deoxycholate-barrier, or direct hepatic route remains.
    would_support:
    - mechanistic_hypotheses#baijiu_extract_microbiota_lactate_mediation_model
    would_refute:
    - mechanistic_hypotheses#baijiu_extract_microbiota_lactate_mediation_model
  evidence:
  - reference: PMID:42300615
    reference_title: Non-ethanol components of Baijiu alleviate ethanol-induced energy metabolism disorder and gut microbiota dysbiosis in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The results showed that non-ethanol components of Baijiu significantly
      alleviated ethanol-induced body weight loss and hepatic pathological damage
      in mice, reduced serum AST and ALT activities as well as hepatic MDA levels,
      and enhanced the activity of the mitochondrial antioxidant enzyme SOD2.
    explanation: >-
      The whole extract improved injury and oxidative-stress endpoints in mice,
      motivating constituent identification while remaining model-specific.
  - reference: PMID:27890791
    reference_title: Fecal microbiota manipulation prevents dysbiosis and alcohol-induced liver injury in mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Both methods prevented steatosis, liver inflammation, and restored gut
      homeostasis.
    explanation: >-
      Fecal transfer and pectin intervention provide animal-model precedent that
      manipulating an intestinal community can modify alcohol-induced liver
      injury, but do not establish the Baijiu constituent or lactate route.
  - reference: PMID:33004548
    reference_title: Microbiota tryptophan metabolism induces aryl hydrocarbon receptor activation and improves alcohol-induced liver injury.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The AhR agonist Ficz (6-formylindolo (3,2-b) carbazole) reduced liver
      lesions, similarly to prebiotic treatment. Conversely, inactivation of the
      ahr gene in alcohol-fed AhR knock-out mice abrogated the beneficial effects
      of the prebiotic.
    explanation: >-
      Pharmacologic agonism and genetic loss establish AhR as a causal competing
      mediator of microbiota-targeted protection in human-microbiota-associated
      alcohol-fed mice, without testing the Baijiu extract or a lactate route.
  - reference: PMID:41543328
    reference_title: Therapeutic Mechanisms of Lactiplantibacillus plantarum NXU0014 Against Chronic Alcohol-Induced Liver Injury Mediated by Gut-Liver Axis Modulation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Multi-omics analyses revealed that alcohol intake induced gut microbiota
      dysbiosis, characterized by an increased Firmicutes/Bacteroidetes ratio and
      decreased abundance of probiotics (e.g., Lactobacillus and Bifidobacterium).
    explanation: >-
      A different chronic liquor-fed mouse model showed the opposite direction
      for broad Lactobacillus abundance. This qualifies any genus-level
      interpretation of the seed result but does not directly test the distinct
      Ligilactobacillus signal, its strain identity, or lactate production.
  - reference: PMID:41137971
    reference_title: Diabetes mellitus is linked to higher mortality in alcohol-related acute-on-chronic liver failure.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On multivariable Cox regression, DM was independently associated with
      increased 90-day mortality (HR 1.739, 95% CI 1.262-2.395, p < 0.001), along
      with elevated serum lactate (HR 1.187 per mmol/L, p < 0.001) and creatinine
      (HR 1.267 per mg/dL, p < 0.001).
    explanation: >-
      In alcohol-related acute-on-chronic liver failure, circulating lactate was
      an independent prognostic association. The cohort does not establish a
      microbial source or a lactate-to-injury direction and therefore supports
      temporal testing rather than a mechanistic inference.
  - reference: PMID:26556636
    reference_title: Microbiota Protects Mice Against Acute Alcohol-Induced Liver Injury.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Germ-free mice showed significantly greater liver injury and inflammation
      after oral gavage of ethanol (EtOH) compared with conventional mice.
    explanation: >-
      The opposite effect of complete microbiota absence in an acute model
      demonstrates that community effects are exposure- and context-dependent
      and motivates targeted transfer and reconstitution instead of treating
      global depletion as a causal test.
  - reference: PMID:32810440
    reference_title: Programing of an Intravascular Immune Firewall by the Gut Microbiota Protects against Pathogen Dissemination during Infection.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the catching and killing of circulating pathogens by Kupffer cells in
      vivo are promoted by the gut microbiota through commensal-derived
      D-lactate that reaches the liver via the portal vein
    explanation: >-
      Demonstrates a gut-to-portal-vein-to-liver D-lactate route in a mouse
      sepsis model, overturning the seed study's checked absence of any
      gut-to-liver lactate evidence, but the model is non-ALD and does not
      test the Baijiu extract or ethanol exposure, so it is external
      plausibility for a route rather than support for this hypothesis.
  - reference: PMID:40738110
    reference_title: Gut substrate trap of D-lactate from microbiota improves blood glucose and fatty liver disease in obese mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: The gut microbiota is the main source of blood D-lactate.
    explanation: >-
      Confirms gut microbiota as the dominant source of circulating D-lactate
      and links D-lactate trapping to reduced hepatic inflammation/fibrosis in
      obese MAFLD/MASH mice, but the model is non-ALD (diet-induced obesity,
      not ethanol exposure) and does not test the Baijiu extract, so it
      sharpens rather than validates the microbiota-lactate hypothesis.
  - reference: PMID:39661730
    reference_title: Ethyl Lactate Ameliorates Hepatic Steatosis and Acute-on-Chronic Liver Injury in Alcohol-Associated Liver Disease by Inducing Fibroblast Growth Factor 21.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the activator ethyl lactate, a nonethanol ingredient found in distilled
      liquors, ameliorates alcoholic hepatosteatosis, inflammation and
      acute-on-chronic liver injury by stimulating FGF21
    explanation: >-
      Shows a distinct non-ethanol Baijiu-liquor constituent, the lactate
      ester ethyl lactate, protects in a direct ALD mouse model through
      hepatocyte SIRT1-FGF21 signaling rather than a demonstrated microbial
      lactate route; this is a competing constituent-specific mechanism for
      the seed extract's activity, not confirmation of microbiota-lactate
      mediation, and must not be conflated with free D- or L-lactate.
  - reference: PMID:41606891
    reference_title: Regulatory effect of Chinese Baijiu on gut microbiota and host metabolism.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: DCA supplementation aggravated ethanol-induced disruption of intestinal barrier function.
    explanation: >-
      A direct Baijiu-versus-ethanol mouse comparison implicates
      deoxycholic-acid-driven intestinal barrier disruption, and a
      non-alcoholic Baijiu-compound formula that protects against it, as a
      competing bile-acid/barrier route for the whole-extract protection; it
      does not test microbial lactate flux and should not be read as
      confirming or refuting the lactate-mediation hypothesis.

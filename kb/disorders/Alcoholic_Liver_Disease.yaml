diagnosis:
- name: Clinical assessment of harmful alcohol exposure
  description: >-
    A nonjudgmental alcohol-use history establishes the principal etiologic risk
    context for ALD. Exposure history alone neither confirms a particular ALD stage
    nor substitutes for assessment of liver injury.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: MAXO:0000487
      label: clinical assessment
  results: Harmful alcohol exposure establishes the etiologic risk context but does not stage liver disease.
  evidence:
  - reference: PMID:38174913
    reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With harmful alcohol use as the primary risk factor, increasing alcohol use
      over the past decade has resulted in rapid growth of the ALD-related healthcare
      burden.
    explanation: The guideline supports harmful alcohol use as the defining etiologic risk context.
- name: Clinical classification of suspected alcohol-associated hepatitis
  description: >-
    Suspected AH should be classified as definite, probable, or possible using the
    NIAAA consensus framework. Probable AH requires the characteristic clinical and
    laboratory pattern without confounding factors; possible AH warrants additional
    evaluation and may require biopsy before disease-specific treatment.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: MAXO:0000487
      label: clinical assessment
  results: Definite or probable AH supports treatment eligibility assessment; possible AH requires clarification of confounding causes.
  evidence:
  - reference: PMID:26921783
    reference_title: 'Standard Definitions and Common Data Elements for Clinical Trials in Patients With Alcoholic Hepatitis: Recommendation From the NIAAA Alcoholic Hepatitis Consortia.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Probable AH: Clinically diagnosed AH without confounding factors (see below).
      In patients with heavy alcohol use and typical liver tests; and negative markers
      for immune (antinuclear antibody < 1:160 or anti–smooth antibody < 1:80
      dilutions) and metabolic liver disease; and absence of sepsis, shock, cocaine
      use, or recent use of a drug with DILI potential within 30 days, a diagnosis
      other than AH will be made in <10% of patients on liver biopsy.
    explanation: >-
      The NIAAA consensus defines probable AH and explicitly requires absence of
      major confounding causes.
- name: Transient elastography for fibrosis staging
  description: >-
    Transient elastography can noninvasively assess advanced fibrosis and cirrhosis
    in people with excessive alcohol use. Active alcohol-associated hepatitis can
    raise liver stiffness independently of fibrosis and must be considered during
    interpretation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: MAXO:0000003
      label: diagnostic procedure
  results: Higher liver stiffness supports advanced fibrosis or cirrhosis, interpreted in the context of active hepatitis.
  evidence:
  - reference: PMID:28387018
    reference_title: Transient elastography alone and in combination with FibroTest(®) for the diagnosis of hepatic fibrosis in alcoholic liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TE values correlated with fibrosis stage (r=.73; P<.0001) and steatosis stage
      (r=.19; P<.01). Patients with alcoholic hepatitis had higher TE values than
      those without alcoholic hepatitis (P<.0001).
    explanation: >-
      The prospective biopsy-referenced study supports TE for fibrosis staging and
      documents active hepatitis as an independent stiffness confounder.

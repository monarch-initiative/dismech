      reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        A unique phenotype of advanced disease is alcohol-associated hepatitis (AH)
        presenting with rapid onset or worsening of jaundice, and acute on chronic
        liver failure in severe forms conveying a 1-month mortality risk of 20%-50%.
      explanation: >-

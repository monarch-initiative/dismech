  description: >-
    ADH-mediated ethanol oxidation raises NADH and shifts hepatocyte redox balance,
    while CYP2E1 metabolism generates acetaldehyde and reactive oxygen species.
    These products alter lipid handling and injure multiple hepatic cell types.
  cell_types:

  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Sustained abstinence removes the initiating exposure. All patients should receive
    cessation support; integrated hepatology, addiction-medicine, and psychosocial
    treatment is particularly important when alcohol use disorder is present.
  treatment_term:
    preferred_term: therapeutic avoidance of environmental exposure
    term:

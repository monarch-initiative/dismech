  downstream:
  - target: Hepatocyte Lipid Overload
    description: >-
      Increased NADH promotes fatty-acid synthesis and opposes fatty-acid oxidation,
      favoring triglyceride accumulation in hepatocytes.
    hypothesis_groups:
    - canonical_multihit_alcohol_injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - NADH-driven stimulation of fatty-acid synthesis and inhibition of fatty-acid oxidation
    evidence:
    - reference: PMID:15670660
      reference_title: 'Alcoholic fatty liver: its pathogenesis and mechanism of progression to inflammation and fibrosis.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        alcohol dehydrogenase-mediated ethanol metabolism generates the reduced form
        of nicotinamide adenine dinucleotide (NADH), which promotes steatosis by
        stimulating the synthesis of fatty acids and opposing their oxidation.
      explanation: The review supplies the omitted redox-to-lipid intermediates for this edge.
  - target: Liver Sinusoidal Endothelial Dysfunction
    description: >-
      CYP2E1-dependent ethanol metabolism in LSECs increases Hsp90 acetylation,
      weakens Hsp90-eNOS interaction, and decreases nitric-oxide production.
    hypothesis_groups:
    - lsec_hsp90_enos_axis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33675874
      reference_title: Alcohol-induced Hsp90 acetylation is a novel driver of liver sinusoidal endothelial dysfunction and alcohol-related liver disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Alcohol metabolism by CYP2E1 increased Hsp90 acetylation and decreased its
        interaction with endothelial nitric oxide synthase (eNOS) leading to a
        decrease in nitric oxide (NO) production.
      explanation: Primary LSEC experiments directly support the proposed molecular axis.
  - target: Lipotoxic and Oxidative Hepatocyte Stress
    description: >-
      Acetaldehyde and CYP2E1-derived oxidants directly impair mitochondria,
      glutathione-dependent defenses, membranes, and cellular redox homeostasis.
    hypothesis_groups:
    - canonical_multihit_alcohol_injury
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15670660
      reference_title: 'Alcoholic fatty liver: its pathogenesis and mechanism of progression to inflammation and fibrosis.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Acetaldehyde is also toxic to the mitochondria, and it aggravates their
        oxidative stress by binding to reduced glutathione and promoting its leakage.
      explanation: >-
        The review directly supports ethanol-metabolism products as a route to
        mitochondrial and oxidative hepatocyte stress independent of lipid overload.

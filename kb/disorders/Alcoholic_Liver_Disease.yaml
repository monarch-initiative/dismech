name: Alcohol-Associated Liver Disease
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Alcohol-associated liver disease (ALD) is a heterogeneous spectrum of liver
  injury associated with harmful alcohol use. Hepatic ethanol metabolism shifts
  redox balance and generates acetaldehyde and reactive oxygen species, while
  intestinal-barrier disruption exposes the liver to microbial products. These
  processes can produce steatosis and converge on hepatocyte and Kupffer-cell
  inflammatory injury, stellate-cell activation, extracellular-matrix deposition,
  fibrosis, cirrhosis, portal hypertension, and impaired liver function.
  Alcohol-associated hepatitis is an acute clinical phenotype that can arise on
  chronic liver disease; it is not an obligatory stage between steatosis and
  fibrosis. Sustained abstinence is central to long-term management, with
  integrated addiction treatment when alcohol use disorder is present.
synonyms:
- Alcoholic liver disease
- Alcohol-related liver disease
- ALD
category: Complex
parents:
- Hepatic Disease
disease_term:
  preferred_term: alcohol-associated liver disease
  term:
    id: MONDO:0043693
    label: alcoholic liver disease
mechanistic_hypotheses:
- hypothesis_group_id: canonical_multihit_alcohol_injury
  hypothesis_label: Canonical multi-hit alcohol-injury model
  status: CANONICAL
  description: >-
    Harmful alcohol exposure drives hepatic ethanol metabolism, redox and
    oxidative stress, lipid accumulation, and intestinal-barrier dysfunction.
    Hepatocyte stress and gut-derived endotoxin converge on inflammatory injury
    and, with persistent injury, stellate-cell activation and fibrosis.
  evidence:
  - reference: PMID:39362713
    reference_title: Pathogenesis of Alcohol-Associated Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alcohol metabolism, cellular stress, and gut-derived factors contribute to
      hepatocyte and immune cell injury leading to cytokine and chemokine production.
    explanation: >-
      This review summarizes the convergent intracellular, hepatic, and
      extrahepatic components of the canonical ALD mechanism.
- hypothesis_group_id: lsec_hsp90_enos_axis
  hypothesis_label: LSEC CYP2E1-Hsp90-eNOS dysfunction axis
  status: EMERGING
  description: >-
    Liver sinusoidal endothelial-cell ethanol metabolism may reduce nitric-oxide
    production through CYP2E1-dependent Hsp90 acetylation and impaired Hsp90-eNOS
    interaction. The evidence is primarily cellular and mouse-model based, so this
    axis is modeled as an emerging amplifier rather than an established universal
    driver in human ALD.
  evidence:
  - reference: PMID:33675874
    reference_title: Alcohol-induced Hsp90 acetylation is a novel driver of liver sinusoidal endothelial dysfunction and alcohol-related liver disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AAV8-driven HDAC6 overexpression specifically in liver ECs deacetylated Hsp90,
      restored Hsp90's interaction with eNOS and ameliorated alcohol-induced liver
      injury in mice.
    explanation: >-
      Rescue of the proposed endothelial axis in ethanol-fed mice supports the
      mechanism while defining its preclinical evidence boundary.
- hypothesis_group_id: pnpla3_gene_environment_susceptibility
  hypothesis_label: PNPLA3-alcohol gene-environment susceptibility
  status: EMERGING
  description: >-
    PNPLA3 rs738409 is a robust susceptibility locus for alcohol-related cirrhosis,
    and alcohol exposure amplifies its disease association. The molecular route
    between this gene-environment interaction and advanced disease is not resolved
    well enough to treat PNPLA3 as a direct lipid-overload mechanism.
  evidence:
  - reference: PMID:39679853
    reference_title: PNPLA3 in Alcohol-Related Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The PNPLA3 rs738409 variant stands as a paradigmatic example of gene-environment
      interaction, where its effect on liver disease is dramatically amplified by
      alcohol consumption, obesity and type 2 diabetes.
    explanation: >-
      This review supports a gene-environment susceptibility overlay while leaving
      its causal intermediates explicitly unresolved.
prevalence:
- population: Global modeled alcohol-attributable chronic liver disease (all ages)
  notes: >-
    A Global Burden of Disease 2021 analysis estimated 3.02 million prevalent
    cases in its modeled ALD category in 2021, with a 38.68% increase in crude
    case count from 2000. This estimate reflects GBD's alcohol-attributed chronic
    liver-disease case definition and should not be generalized to the full ALD
    spectrum, especially unascertained early steatosis.
  evidence:
  - reference: PMID:39788109
    reference_title: Global epidemiology of alcohol-related liver disease, liver cancer, and alcohol use disorder, 2000-2021.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In 2021, there were 111.12 million cases of AUD, 3.02 million cases of ALD,
      and 132,030 cases of alcohol-attributable primary liver cancer.
    explanation: >-
      The GBD-based analysis provides a modeled global ALD prevalence count for 2021.
pathophysiology:
- name: Chronic Ethanol Exposure
  role: trigger
  description: >-
    Repeated harmful alcohol exposure is the initiating exposure for ALD, but it
    is not sufficient by itself to determine who develops advanced disease.
    Drinking pattern, cumulative exposure, metabolic context, sex, and host
    susceptibility influence risk.
  chemical_entities:
  - preferred_term: ethanol
    term:
      id: CHEBI:16236
      label: ethanol
  evidence:
  - reference: PMID:38174913
    reference_title: 'ACG Clinical Guideline: Alcohol-Associated Liver Disease.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      With harmful alcohol use as the primary risk factor, increasing alcohol use
      over the past decade has resulted in rapid growth of the ALD-related healthcare
      burden.
    explanation: The guideline identifies harmful alcohol use as the primary ALD risk factor.
  - reference: PMID:25634330
    reference_title: 'Alcohol drinking pattern and risk of alcoholic liver cirrhosis: a prospective cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In men, daily drinking was associated with an increased risk of alcoholic cirrhosis.
    explanation: >-
      This prospective Danish cohort supports a pattern-dependent association while
      not implying that exposure is sufficient or deterministic.
  downstream:
  - target: Hepatic Ethanol Metabolism and Redox-Oxidative Stress
    description: >-
      Hepatic ADH and inducible CYP2E1 oxidize ethanol to acetaldehyde while altering
      redox balance and generating reactive oxygen species.
    hypothesis_groups:
    - canonical_multihit_alcohol_injury
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30424581
      reference_title: 'Alcoholic Liver Disease: Alcohol Metabolism, Cascade of Molecular Mechanisms, Cellular Targets, and Clinical Aspects.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Pathogenetic events are linked to the metabolism of ethanol and acetaldehyde
        as its first oxidation product generated via hepatic alcohol dehydrogenase
        (ADH) and the microsomal ethanol-oxidizing system (MEOS), which depends on
        cytochrome P450 2E1 (CYP 2E1), and is inducible by chronic alcohol use.
      explanation: The review directly links ethanol exposure to hepatic ADH and CYP2E1 metabolism.
  - target: Intestinal Barrier Dysfunction and Endotoxin Translocation
    description: >-
      Chronic alcohol exposure promotes intestinal CYP2E1-dependent oxidative
      stress and barrier hyperpermeability, permitting microbial products to reach
      the portal circulation.
    hypothesis_groups:
    - canonical_multihit_alcohol_injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Intestinal CYP2E1-dependent oxidative stress and tight-junction disruption
    evidence:
    - reference: PMID:25462064
      reference_title: 'Intestinal CYP2E1: A mediator of alcohol-induced gut leakiness.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cyp2e1 knockout mice are resistant to alcohol-induced gut leakiness and liver
        inflammation.
      explanation: >-
        The knockout experiment supports intestinal CYP2E1 as an intermediate between
        alcohol exposure, gut leakiness, and liver inflammation in a model organism.
  - target: PNPLA3-Linked Gene-Environment Susceptibility
    description: >-
      Alcohol exposure amplifies the liver-disease association of PNPLA3 rs738409,
      although the molecular intermediates and stage specificity remain unresolved.
    hypothesis_groups:
    - pnpla3_gene_environment_susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39679853
      reference_title: PNPLA3 in Alcohol-Related Liver Disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The PNPLA3 rs738409 variant stands as a paradigmatic example of gene-environment
        interaction, where its effect on liver disease is dramatically amplified by
        alcohol consumption, obesity and type 2 diabetes.
      explanation: >-
        The review supports exposure-dependent amplification of PNPLA3-associated
        liver-disease susceptibility without defining a direct molecular edge.

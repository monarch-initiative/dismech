pathophysiology:
- name: Homozygous EPHB2 p.Arg745Cys in the Kinase Domain
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    A homozygous missense variant, c.2233C>T p.Arg745Cys, in the tyrosine kinase
    domain of EPHB2. It was found by whole-exome sequencing in two siblings of a
    consanguineous family; the asymptomatic parents were heterozygous, which is
    the segregation pattern the recessive inheritance rests on.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  molecular_functions:
  - preferred_term: EPHB2 receptor tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a c.2233C>T variant (missense p.R745C) of the EPHB2 gene. P1 and P2 were homozygous for this variant, while their asymptomatic parents were heterozygous."
    explanation: >-
      The gene-discovery statement, with the zygosity and the parental carrier
      status this node records.
  downstream:
  - target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
    causal_link_type: DIRECT
    description: >-
      The substituted residue lies in the kinase domain, so the first thing lost
      is the receptor's own catalytic output.
- name: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The variant halves EPHB2 autophosphorylation but leaves ephrin-ligand-induced
    receptor clustering unaffected. This dissociation is the mechanistic pivot of
    the disorder: the defect is in the receptor's kinase output, not in its
    ability to engage ephrin on a neighbouring cell, so the lesion is not a
    contact-dependent one.
  biological_processes:
  - preferred_term: EPHB2 autophosphorylation
    term:
      id: GO:0046777
      label: protein autophosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of wild-type and R745C EPHB2 variant in RBL-2H3 (rat basophilic leukemia) cells stably expressing human GPVI confirmed that EPHB2 R745C mutation impaired EPHB2 autophosphorylation but had no effect on ephrin ligand-induced EPHB2 clustering, suggesting it did not interfere with EPHB2-ephrin-mediated cell-to-cell contact."
    explanation: >-
      Heterologous-cell experiment separating the autophosphorylation defect from
      ephrin-induced clustering, which is the dissociation this node asserts.
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The EPHB2-R745C mutation impairs autophosphorylation by 50% without affecting clustering behavior, disrupting early cell activation steps independently of cell-cell contact"
    explanation: >-
      ClinGen's summary of the same experiment, quantifying the autophosphorylation
      loss and stating the contact-independence explicitly.
  downstream:
  - target: Failure of Proximal GPVI Signalling
    causal_link_type: DIRECT
    description: >-
      The founding report places EPHB2 as a positive input to GPVI activation, so
      loss of its kinase output removes that input.
  - target: Defective Src Activation Downstream of PAR4
    causal_link_type: DIRECT
    description: >-
      The same loss of kinase output is reflected on the G-protein-coupled
      receptor side as a selective Src defect.
- name: Failure of Proximal GPVI Signalling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Phosphorylation of Lyn, Syk and FcR gamma - the first steps of signalling
    from the collagen receptor GPVI - is drastically impaired, and it is impaired
    in the absence of platelet-platelet contact. That last clause is what
    separates this disorder from the classical contact-dependent Eph-ephrin model
    of platelet Eph receptor function.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: collagen receptor GPVI signalling
    term:
      id: GO:0038065
      label: collagen-activated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most importantly, Lyn, Syk, and FcRγ phosphorylation, the initial steps in glycoprotein VI (GPVI) platelet signaling were drastically impaired in the absence of platelet-platelet contact, indicating a positive role for EPHB2 in GPVI activation."
    explanation: >-
      Names the three phosphorylation events lost and states the
      contact-independence that this node turns on.
  downstream:
  - target: Defective Platelet Activation, Secretion and Integrin Inside-Out Signalling
    causal_link_type: DIRECT
    description: >-
      GPVI signalling is one of the two inputs whose failure leaves the platelet
      unable to activate and secrete.
- name: Defective Src Activation Downstream of PAR4
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Stimulation through the PAR4 thrombin receptor shows defective Src
    activation, while protein kinase C activity and calcium mobilisation are
    normal. The selectivity matters: the GPCR arm is not globally switched off,
    only its Src-dependent branch, which is why residual agonist responses
    survive.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Likewise platelet activation by PAR4-AP showed defective Src activation, as opposed to normal protein kinase C activity and Ca2+ mobilization."
    explanation: >-
      Supports both halves of this node: the Src defect and the preserved PKC and
      calcium responses that make it selective.
  downstream:
  - target: Defective Platelet Activation, Secretion and Integrin Inside-Out Signalling
    causal_link_type: DIRECT
    description: >-
      The GPCR arm converges with the GPVI arm on the same activation step.
- name: Defective Platelet Activation, Secretion and Integrin Inside-Out Signalling
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    Aggregation, integrin alphaIIbbeta3 activation and granule secretion are all
    defective in response to GPCR agonists and to convulxin, the GPVI agonist.
    Dense granule number and ATP/ADP content are normal, so the secretion failure
    is a signalling failure and not a storage pool defect - the distinction that
    separates this disorder from the delta-storage-pool diseases it can resemble
    on aggregometry.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: DECREASED
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  - preferred_term: integrin alphaIIbbeta3 inside-out activation
    term:
      id: GO:0033622
      label: integrin activation
    modifier: DECREASED
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.R745C variant within the tyrosine kinase domain was associated with defects in platelet aggregation, αIIbβ3 activation, and granule secretion induced by G-protein-coupled receptor (GPCR) agonists and convulxin, as well as in thrombus formation on collagen under flow."
    explanation: >-
      The functional consequence profile this node records, in both the GPCR and
      the GPVI (convulxin) arms.
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Platelet function tests revealed decreased responses to various agonists except ristocetin, with normal ATP/ADP content and dense granule numbers."
    explanation: >-
      Establishes the normal dense granule content that makes this a secretion
      signalling defect rather than a storage pool defect, and the sparing of the
      ristocetin (GPIb-dependent) response.
  - reference: PMID:31348050
    reference_title: Recent advances in inherited platelet disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Novel genes recently implicated in human platelet dysfunction include the galactose metabolism enzyme UDP-galactose-4-epimerase in macrothrombocytopenia, and erythropoietin-producing hepatoma-amplified sequence receptor transmembrane tyrosine kinase EPHB2 in a severe bleeding disorder with deficiencies in platelet agonist response and granule secretion."
    explanation: >-
      An independent review characterising the EPHB2 disorder by exactly the two
      deficits this node asserts - agonist response and granule secretion.
  downstream:
  - target: Reduced Thrombus Formation on Collagen Under Flow
    causal_link_type: DIRECT
    description: >-
      A platelet that cannot activate and secrete cannot recruit and hold its
      neighbours on a collagen surface.
  - target: Impaired Platelet Aggregation
    causal_link_type: DIRECT
    description: >-
      The activation and secretion failure is what aggregometry measures in the
      clinic.
- name: Reduced Thrombus Formation on Collagen Under Flow
  role: effector
  biological_scale: TISSUE
  description: >-
    Thrombus formation on collagen under flow is defective, whereas
    flow-dependent adhesion and spreading on fibrinogen are only mildly affected.
    The founding report reads that contrast as limited involvement of
    alphaIIbbeta3 outside-in signalling, which is what keeps the lesion on the
    inside-out, activation side of the pathway.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, clot retraction, flow-dependent platelet adhesion, and spreading on fibrinogen were only mildly affected, indicating limited effects on αIIbβ3 outside-in signaling."
    explanation: >-
      Supports the sparing of the outside-in functions, which is the contrast this
      node is built around.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      An unstable platelet mass on exposed collagen is the in-vitro reading of the
      failure to build a plug in vivo.
- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    The convergence step this disorder shares with the rest of the BDPLT series.
    It is reached here by the signalling route: the receptors are present, the
    integrin is present, the granules are full, and the platelet still fails to
    switch on.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent bleeding, normal platelet counts but abnormal function were linked to a variant of EPHB2, encoding a member of the EPH receptor family of transmembrane tyrosine kinases."
    explanation: >-
      States the defining combination for this entity - bleeding with a normal
      count and abnormal function - which is what failure of the primary plug with
      a normal platelet supply looks like clinically.
  downstream:
  - target: Mucocutaneous and Gastrointestinal Bleeding Diathesis
    causal_link_type: DIRECT
    description: Failure of platelet-dependent primary hemostasis.
- name: Mucocutaneous and Gastrointestinal Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >-
    Excessive spontaneous subcutaneous bleeding and heavy bleeding after minor
    wounds in both affected siblings, with chronic gastrointestinal bleeding and
    consequent anemia in one of them. Heterozygous parents were asymptomatic.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In 2018, the EPHB2 gene was first reported in association with a recessive bleeding disorder characterized by excessive spontaneous subcutaneous bleeding, heavy bleeding after minor wounds, chronic gastrointestinal bleeding leading to anemia, and a mild decrease in platelet count observed later in life"
    explanation: >-
      The clinical description of the bleeding phenotype, including the late mild
      fall in platelet count that is recorded separately as a phenotype.
  downstream:
  - target: Abnormal Bleeding
    causal_link_type: DIRECT
    description: Recurrent bleeding is the presenting clinical expression.
  - target: Bruising Susceptibility
    causal_link_type: DIRECT
    description: >-
      Spontaneous subcutaneous bleeding and heavy bleeding after minor wounds.
  - target: Gastrointestinal Hemorrhage
    causal_link_type: DIRECT
    description: >-
      Chronic bleeding from the gastrointestinal mucosa in one of the two
      siblings.


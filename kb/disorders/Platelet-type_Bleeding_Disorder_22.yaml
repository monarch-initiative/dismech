    kinase domain, homozygous in two siblings of a consanguineous French family
    with heterozygous asymptomatic parents. `relationship_type` is UNKNOWN rather
    than CAUSATIVE because ClinGen classifies the gene-disease relationship as
    Limited; the enum has no value for Limited, and UNKNOWN is the value already
    used for Limited-validity genes elsewhere in this knowledge base. The
    classification reflects the case count, not a doubt about the functional
    work: ClinGen described the overall package as borderline between limited and
    moderate.
  evidence:
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "EPHB2 | HGNC:3393 | bleeding disorder, platelet-type, 22 | MONDO:0032765 | AR | Limited | SOP10 | Hemostasis/Thrombosis Gene Curation Expert Panel"
    explanation: >-
      ClinGen classifies the EPHB2-BDPLT22 relationship as Limited with autosomal
      recessive inheritance.
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, both the genetic and experimental evidence suggest a borderline classification between limited and moderate. However, due to the limited genetic data, we will maintain the final classification as limited until more genetic evidence becomes available."
    explanation: >-
      ClinGen's stated reason for the Limited call, which is the case count rather
      than the quality of the functional evidence.
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified a c.2233C>T variant (missense p.R745C) of the EPHB2 gene. P1 and P2 were homozygous for this variant, while their asymptomatic parents were heterozygous."
    explanation: >-
      The variant and its recessive segregation in the only reported family.

inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both affected siblings were homozygous for p.Arg745Cys and both parents were
    heterozygous and asymptomatic. ClinGen records the mode of inheritance for
    this gene-disease relationship as autosomal recessive.
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P1 and P2 were homozygous for this variant, while their asymptomatic parents were heterozygous."
    explanation: >-
      Homozygous affected siblings with heterozygous unaffected parents is the
      recessive segregation pattern.

experimental_models:
- name: RBL-2H3 cells expressing human GPVI with wild-type or R745C EPHB2
  experimental_model_type: CELL_LINE
  description: >-
    Rat basophilic leukemia RBL-2H3 cells stably expressing human GPVI, into
    which wild-type or R745C EPHB2 was overexpressed. This is the experiment that
    separates the two candidate lesions - loss of kinase output versus loss of
    ephrin engagement - because both can be measured in the same cell.
  publication: PMID:30213874
  modeled_mechanisms:
  - target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the autophosphorylation defect of the patient allele and shows
      that ephrin-induced clustering is intact.
    limitations: >-
      A rat mast-cell line overexpressing the human receptor, not a platelet or a
      megakaryocyte; expression is supraphysiological and the endogenous platelet
      signalling partners are absent, so it tests the receptor's own behaviour
      rather than the platelet phenotype.
    readouts:
    - name: EPHB2 autophosphorylation
      target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
      direction: DECREASED
      interpretation: >-
        The catalytic output of the mutant receptor, reduced by about half.
      evidence:
      - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
        reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "The EPHB2-R745C mutation impairs autophosphorylation by 50% without affecting clustering behavior"
        explanation: Quantifies the autophosphorylation readout in this system.
    - name: Ephrin ligand-induced EPHB2 clustering
      target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
      direction: UNCHANGED
      interpretation: >-
        A negative result, and a load-bearing one: it is what excludes a
        contact-dependent Eph-ephrin lesion.
      evidence:
      - reference: PMID:30213874
        reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "had no effect on ephrin ligand-induced EPHB2 clustering, suggesting it did not interfere with EPHB2-ephrin-mediated cell-to-cell contact"
        explanation: The unchanged clustering readout.
    evidence:
    - reference: PMID:30213874
      reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of wild-type and R745C EPHB2 variant in RBL-2H3 (rat basophilic leukemia) cells stably expressing human GPVI confirmed that EPHB2 R745C mutation impaired EPHB2 autophosphorylation but had no effect on ephrin ligand-induced EPHB2 clustering"
      explanation: >-
        Establishes that this heterologous system is informative for the
        autophosphorylation node.

animal_models:
- name: EphB2 cytoplasmic-domain truncation mouse
  species: Mouse
  genotype: EphB2 cytoplasmic-domain truncation
  publication: PMID:25370417
  description: >-
    A mouse genetic model that removes signalling from the EphB2 cytoplasmic
    domain while leaving the extracellular receptor in place. It predates the
    human disorder and was designed to separate Eph kinase signalling from
    Eph-ephrin ligation, which is the same dissociation the human p.Arg745Cys
    allele produces.
  modeled_mechanisms:
  - target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Removes EphB2 cytoplasmic signalling in the platelet, and shows that doing
      so impairs platelet activation without requiring Eph-ephrin ligation
      between platelets - the contact-independent role the human variant
      disrupts.
    limitations: >-
      A truncation of the whole cytoplasmic domain in mouse, not the human
      p.Arg745Cys missense allele, so it models loss of EphB2 signalling in
      general rather than the partial kinase defect of the patients. It also
      reports clot retraction as EphB2-dependent, whereas clot retraction was only
      mildly affected in the human patients, so the two do not agree on every
      readout.
    readouts:
    - name: Thrombus formation and clot retraction
      target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
      direction: DECREASED
      interpretation: >-
        Establishes EphB2 cytoplasmic signalling as a regulator of thrombus
        formation in vivo.
      evidence:
      - reference: PMID:25370417
        reference_title: "EphB2 regulates contact-dependent and contact-independent signaling to control platelet function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We conclude that EphB2 signaling is involved in the regulation of thrombus formation and clot retraction."
        explanation: The functional conclusion of the mouse model.
    evidence:
    - reference: PMID:25370417
      reference_title: "EphB2 regulates contact-dependent and contact-independent signaling to control platelet function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the cytoplasmic tail of this Eph kinase regulates initial platelet activation in a contact-independent manner in the absence of Eph-ephrin ligation between platelets"
      explanation: >-
        The contact-independent role of EphB2 signalling in the mouse, which is the
        same property the human variant removes.

diagnosis:
- name: Platelet Function Testing with a Normal Platelet Count
  description: >-
    The disorder is reached through platelet function testing rather than through
    the blood count or the blood film: the count and the morphology are normal,
    so aggregometry showing reduced responses across multiple agonists with a
    spared ristocetin response, together with normal dense granule content, is
    what narrows the differential before sequencing.
  evidence:
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Platelet function tests revealed decreased responses to various agonists except ristocetin, with normal ATP/ADP content and dense granule numbers."
    explanation: >-
      The aggregometry and granule-content pattern that defines the diagnostic
      picture.

differential_diagnoses:
- name: Delta storage pool disease
  description: >-
    Reduced secretion and reduced aggregation to weak agonists look the same on
    aggregometry. The discriminator is granule content: dense granule number and
    ATP/ADP content are normal here, so the secretion failure is a signalling
    failure rather than an empty-granule one.
  evidence:
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "with normal ATP/ADP content and dense granule numbers"
    explanation: >-
      Normal dense granule content is what separates this disorder from a storage
      pool defect.
- name: Bernard-Soulier syndrome
  description: >-
    Both cause mucocutaneous bleeding from a platelet defect, but they separate on
    the ristocetin response and on the platelet count. Bernard-Soulier syndrome is
    a defect of the GPIb-IX-V adhesion receptor, so ristocetin-induced
    agglutination fails and the platelets are large and reduced in number. Here the
    ristocetin response is specifically the one spared, and the count is normal at
    presentation.
  evidence:
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Platelet function tests revealed decreased responses to various agonists except ristocetin"
    explanation: >-
      The preserved ristocetin response is the discriminator against a
      GPIb-IX-V adhesion defect.
- name: von Willebrand disease
  description: >-
    Also presents as mucocutaneous bleeding with a normal platelet count, and is far
    commoner, so it is the differential a patient will usually be worked up for
    first. It is a plasma or platelet von Willebrand factor defect rather than a
    signalling one, and the ristocetin-dependent assays that detect it are normal
    here.
  evidence:
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Platelet function tests revealed decreased responses to various agonists except ristocetin"
    explanation: >-
      The same preserved ristocetin response separates this disorder from the
      von Willebrand factor disorders, which that assay is designed to detect.
- name: Glanzmann thrombasthenia
  description: >-
    Both present with defective aggregation and a normal platelet count, but
    Glanzmann thrombasthenia is a structural defect of integrin alphaIIbbeta3
    itself and abolishes clot retraction, whereas here alphaIIbbeta3 outside-in
    functions - clot retraction and spreading on fibrinogen - are only mildly
    affected and the lesion is upstream, in inside-out signalling.
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, clot retraction, flow-dependent platelet adhesion, and spreading on fibrinogen were only mildly affected, indicating limited effects on αIIbβ3 outside-in signaling."
    explanation: >-
      Preserved clot retraction and spreading are what distinguish this disorder
      from Glanzmann thrombasthenia on function testing.

treatments:
- name: Iron replacement for blood-loss anemia
  description: >-
    Iron supplementation was required by the affected sibling who developed
    anemia from chronic gastrointestinal bleeding. This is the only management
    step recorded for a patient with this disorder; it treats the consequence of
    the bleeding rather than the platelet defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: iron supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: iron
      term:
        id: CHEBI:18248
        label: iron atom
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  notes: >-
    The agent is bound at the element level (CHEBI:18248 iron atom). The cited
    source says only "requiring iron supplementation" and names neither the salt
    nor the oxidation state, so binding a specific ferrous compound would assert
    a formulation nobody reported. NCIT:C210688 Iron Supplement is the natural
    label but is not a member of the ChemicalEntityTerm enum, so it cannot sit in
    this slot.
  evidence:
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One sibling developed anemia after chronic gastrointestinal bleeding requiring iron supplementation."
    explanation: >-
      The only patient-level treatment recorded for this disorder, and it is for
      the anemia rather than for the platelet defect.
- name: Extrapolated inherited-platelet-disorder haemostatic management
  description: >-
    No EPHB2-directed therapy exists and no interventional trial has been run in
    this disorder, so bleeding is managed with the general inherited-platelet-
    disorder repertoire: local haemostatic measures, an antifibrinolytic such as
    tranexamic acid, selected use of desmopressin, platelet concentrates when
    simpler measures are insufficient, and recombinant activated factor VII in
    refractory bleeding. This is class-level guidance applied to a disorder in
    which none of it has been tested, and it is curated as such rather than as a
    disease-specific recommendation. The alloimmunisation hazard of platelet
    transfusion applies here as it does across the group.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive haemostatic care
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
    - preferred_term: desmopressin
      term:
        id: CHEBI:4450
        label: desmopressin
  target_phenotypes:
  - preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  notes: >-
    Extrapolated, not disease-specific. Neither cited source reports any of these
    measures being used in an EPHB2 patient; the falcon deep-research report for
    this entry reached the same conclusion after searching for BDPLT22-specific
    therapy, response-rate data and trial registrations and finding none.
  evidence:
  - reference: DOI:10.1055/a-2080-6602
    reference_title: "Treatment of Inherited Platelet Disorders: Current Status and Future Options"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Established treatment options of IPDs include local hemostatic treatment, tranexamic acid, desmopressin, platelet concentrates, and recombinant activated factor VII."
    explanation: >-
      Names the class-level repertoire this treatment entry extrapolates from. The
      review is about inherited platelet disorders as a group and says nothing
      about EPHB2, which is why the entry is labelled extrapolated.
  - reference: PMID:33147934
    reference_title: "Inherited platelet diseases with normal platelet count: phenotypes, genotypes and diagnostic strategy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "for mild bleeding risk, an antifibrinolytic medication or desmopressin is preferred as the first line of bleeding prevention and that platelet transfusions should be considered only when these approaches are insufficient"
    explanation: >-
      Gives the escalation order within that repertoire, again at the level of the
      disorder group rather than this entity.


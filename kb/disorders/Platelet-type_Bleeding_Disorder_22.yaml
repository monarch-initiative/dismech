- category: Hematologic
  name: Normal Platelet Count at Presentation, with a Later Mild Decrease
  description: >-
    The platelet count is normal at presentation, which is what places this
    disorder among the inherited platelet disorders with a normal count rather
    than among the thrombocytopenias. ClinGen's summary adds that a mild decrease
    in count was observed later in life. Both statements are curated because the
    normal count is diagnostically load-bearing and the later drift would
    otherwise look like a contradiction.
  phenotype_term:
    preferred_term: Normal platelet count at presentation, with a mild later decrease
  notes: >-
    Deliberately carries no `term:`. The HPO has no class for a normal count that
    later drifts mildly downward, and binding `HP:0001873 Thrombocytopenia` would
    assert a thrombocytopenia the founding report explicitly excludes. Following
    the same reasoning recorded on the equivalent node in
    `Platelet-type_Bleeding_Disorder_18`, no term is bound rather than a
    misleading one. This phenotype is also deliberately left unwired to the
    pathograph: it is a negative finding that constrains the differential rather
    than a consequence of any node in the causal chain, so no incoming edge would
    be truthful.
  evidence:
  - reference: PMID:30213874
    reference_title: "A mutation of the human EPHB2 gene leads to a major platelet functional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first EPHB2 variant affecting platelets in 2 siblings (P1 and P2) from a consanguineous family with recurrent bleeding and normal platelet counts."
    explanation: >-
      Establishes normal platelet counts at the time of the founding report.
  - reference: CGGV:assertion_5f895977-6c0c-49f1-97b6-cf4d0fd3a894-2024-09-04T170000.000Z
    reference_title: "EPHB2 / bleeding disorder, platelet-type, 22 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a mild decrease in platelet count observed later in life"
    explanation: >-
      Records the later mild fall in count, which is why this phenotype is curated
      as a two-part statement rather than as a flat normal result.


name: Platelet-type Bleeding Disorder 22
creation_date: "2026-09-08T18:30:00Z"
category: Mendelian
parents:
- Inherited Platelet Disorder
- Bleeding Disorder
disease_term:
  preferred_term: bleeding disorder, platelet-type, 22
  term:
    id: MONDO:0032765
    label: bleeding disorder, platelet-type, 22
synonyms:
- BDPLT22
- EPHB2-related platelet function disorder
- EPHB2-related inherited platelet disorder
description: >-
  An autosomal recessive inherited platelet function disorder, described in two
  siblings from one consanguineous French family, in which a homozygous missense
  variant in the tyrosine kinase domain of EPHB2 leaves the platelet count normal
  but the platelet unable to switch on properly, so the affected individuals
  bleed.

  EPHB2 encodes an ephrin type-B receptor, a transmembrane receptor tyrosine
  kinase. The classical account of Eph receptors in platelets is
  contact-dependent: Eph-ephrin engagement between platelets already inside a
  forming aggregate stabilises the thrombus. What makes this disorder
  mechanistically interesting is that its lesion is not in that step. The
  p.Arg745Cys variant halves EPHB2 autophosphorylation while leaving
  ephrin-induced receptor clustering intact, and the signalling failure it
  produces is measurable in single platelets before any platelet-platelet
  contact has occurred. The affected steps are the most proximal ones in
  glycoprotein VI signalling - phosphorylation of Lyn, Syk and FcR gamma - plus
  Src activation downstream of the PAR4 thrombin receptor, while protein kinase
  C activity and calcium mobilisation are normal. So EPHB2 is placed as a
  positive regulator feeding into GPVI and GPCR signalling rather than as a
  cell-cell adhesion molecule, and the disorder enters the platelet-function
  group through its signalling arm.

  The consequence profile is correspondingly lopsided. Aggregation, integrin
  alphaIIbbeta3 inside-out activation, granule secretion and thrombus formation
  on collagen under flow are all defective; clot retraction, flow-dependent
  adhesion and spreading on fibrinogen are only mildly affected, which the
  founding report reads as limited involvement of alphaIIbbeta3 outside-in
  signalling. Dense granule content and number are normal, so this is a
  secretion-signalling defect rather than a storage pool defect.

  This entry is curated with its gene-disease validity in front rather than in a
  footnote. In September 2024 the ClinGen Hemostasis/Thrombosis Gene Curation
  Expert Panel classified the EPHB2-BDPLT22 relationship as LIMITED. Their
  reasoning is worth reading before using this entry: the experimental evidence
  is substantial and they judged the overall package borderline between limited
  and moderate, but the case-level genetic evidence is two affected siblings in
  a single consanguineous family and no second family has been reported. The
  genetic block therefore types the relationship UNKNOWN with the Limited
  classification recorded explicitly, following the convention already used for
  the Limited-validity genes in `Arrhythmogenic_Right_Ventricular_Cardiomyopathy`.

  Two things are deliberately constrained. There is no prevalence estimate,
  because one family supports none. And the treatments section carries only what
  can actually be sourced: iron replacement, which is recorded for the affected
  sibling who became anemic from gastrointestinal blood loss, and the general
  inherited-platelet-disorder haemostatic repertoire, which is explicitly labelled
  as class-level guidance extrapolated to this disorder rather than validated in
  it. No EPHB2-directed therapy exists, no interventional trial has been run in
  this entity, and the 2021 review of inherited platelet disorders with normal
  platelet count states outright that the clinical phenotype here remains poorly
  defined.

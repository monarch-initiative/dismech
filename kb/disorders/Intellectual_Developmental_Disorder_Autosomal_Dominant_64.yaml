name: Intellectual Developmental Disorder, Autosomal Dominant 64
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
synonyms:
- MRD64
- ZNF292-related neurodevelopmental disorder
- mental retardation, autosomal dominant 64
description: >-
  Intellectual developmental disorder, autosomal dominant 64 (MRD64), also
  called ZNF292-related neurodevelopmental disorder, is caused by heterozygous
  predicted loss-of-function variants in ZNF292, a C2H2 zinc finger
  transcription factor that is highly expressed in the developing human
  brain. Nearly all variants arise de novo, and most lie in exon 8, the last
  and largest exon. Affected individuals have intellectual disability, usually
  mild to moderate, with prominent speech delay; many also have autism
  spectrum disorder or attention-deficit/hyperactivity disorder. Growth
  impairment with short stature, hypotonia, mild microcephaly and nonspecific
  facial features (most often micrognathia and hypertelorism) are variable.
  Whether the truncating variants act by haploinsufficiency or produce a
  truncated protein that escapes nonsense-mediated decay is not settled. In
  human stem cell models with reduced ZNF292, cortical interneuron
  progenitors differentiate too early and the resulting interneurons fail to
  mature normally.
disease_term:
  preferred_term: intellectual developmental disorder, autosomal dominant 64
  term:
    id: MONDO:0030934
    label: intellectual developmental disorder, autosomal dominant 64
parents:
- Intellectual Disability, Autosomal Dominant
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 619188 and records ZNF292 as its
  causal gene. ClinGen classifies ZNF292 as Definitive for the broader
  complex neurodevelopmental disorder (MONDO:0100038), autosomal dominant;
  that assertion is for a different MONDO disease, so no validity tier is
  recorded on the genetic record. Larger 6q deletions that include ZNF292 are
  covered by the 6q16 deletion syndrome entry and are not part of this entry.
  The defining cohort also reports skeletal and cardiac abnormalities in 5 of
  28 individuals each, without naming specific findings in Table 1, so they
  are not bound as phenotypes here.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous ZNF292 variants cause the disease. Almost all arise de novo;
    one family showed transmission from an affected mother.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These observations suggest that some pathogenic ZNF292 genotypes are incompletely penetrant and/or they underlie mild ID/DD/ASD."
    explanation: >-
      An affected parent diagnosed only in adulthood and apparently valid
      loss-of-function variants in gnomAD controls led the authors to propose
      incomplete penetrance or very mild expression.
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All ZNF292 variants were de novo, except in one family with dominant inheritance."
    explanation: De novo heterozygous variants, with one dominantly inherited family.
  - reference: PMID:42650143
    reference_title: "De Novo ZNF292 Variants Cause Neurodevelopmental Disorder with Short Stature: A Clinical Case Series of Eight Individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven de novo variants in ZNF292 were identified, including two nonsense and five frameshift variants"
    explanation: De novo truncating variants in an independent case series.
pathophysiology:
- name: ZNF292 Truncating Variants
  description: >-
    Disease variants are nonsense, frameshift or splice variants, mostly in
    exon 8, which encodes the large DNA-binding domain. Because exon 8 is the
    last exon, most of these variants are predicted to escape
    nonsense-mediated decay. The authors of the defining cohort left open
    whether the disease arises from haploinsufficiency or from a truncated
    protein with gain-of-function or dominant-negative activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ZNF292
    term:
      id: hgnc:18410
      label: ZNF292
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: ABNORMAL
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  downstream:
  - target: Dysregulated ZNF292 Target Gene Transcription
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most variants (22/24) are located in exon 8, the last and largest exon of ZNF292, which encodes a large DNA binding domain of the protein (Figure 1)."
    explanation: Location of the disease variants in the terminal exon.
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two most likely possibilities by which pLoF might underlie disease are escape from nonsense-mediated decay (NMD), leading to expression of a truncated protein that has either a gain of function or dominant negative effect, or simple haploinsufficiency."
    explanation: The defining cohort leaves the variant mechanism open.
  - reference: PMID:42650143
    reference_title: "De Novo ZNF292 Variants Cause Neurodevelopmental Disorder with Short Stature: A Clinical Case Series of Eight Individuals."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "As a sequence-specific DNA-binding protein, ZNF292 recognizes and binds to the promoters of neuronal and synaptic genes, thereby directly regulating the expression of multiple neurodevelopmental disorder risk genes"
    explanation: >-
      The introduction of this case series states the transcription factor
      activity that the truncating variants affect. The modifier is ABNORMAL
      rather than DECREASED because the variant mechanism is unresolved.
- name: Dysregulated ZNF292 Target Gene Transcription
  description: >-
    ZNF292 binds the promoters of neuronal and synaptic genes. With reduced
    ZNF292, its direct targets controlling neuronal differentiation and
    synapse formation are upregulated in progenitors, while targets promoting
    interneuron maturation, including other neurodevelopmental disorder genes,
    are downregulated in interneurons.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    modifier: DYSREGULATED
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  downstream:
  - target: Precocious Interneuron Progenitor Differentiation
    causal_link_type: DIRECT
  - target: Impaired Cortical Interneuron Maturation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZNF292 encodes a highly conserved zinc finger protein that acts as a transcription factor and is highly expressed in the developing human brain supporting its critical role in neurodevelopment."
    explanation: ZNF292 is a transcription factor expressed in the developing brain.
  - reference: PMID:40257863
    reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In progenitors, genome-wide occupancy and transcriptomic analyses identify direct target genes controlling neuronal differentiation and synapse formation that are upregulated upon ZNF292 deficiency."
    explanation: Direct ZNF292 targets are derepressed in deficient progenitors.
  - reference: PMID:40257863
    reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By contrast, deficiency in interneurons compromises ZNF292 genome-wide association with and causes downregulation of direct target genes promoting interneuron maturation and function, including other NDD genes."
    explanation: Direct targets promoting maturation are lost in deficient interneurons.
- name: Precocious Interneuron Progenitor Differentiation
  description: >-
    ZNF292-deficient cortical interneuron progenitors exit the cell cycle and
    differentiate early, upregulating neuronal and synaptic genes ahead of
    time.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cerebral cortex GABAergic interneuron differentiation
    modifier: DYSREGULATED
    term:
      id: GO:0021892
      label: cerebral cortex GABAergic interneuron differentiation
  downstream:
  - target: Impaired Cortical Interneuron Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40257863
      reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This suggested that ZNF292 deficiency led to precocious NPC differentiation into cINs but subsequently impaired their maturation and cIN identity."
      explanation: Early differentiation is followed by impaired maturation.
  evidence:
  - reference: PMID:40257863
    reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZNF292-deficient progenitors undergo precocious differentiation but subsequently exhibit compromised interneuron maturation and function."
    explanation: Precocious progenitor differentiation in the stem cell model.
- name: Impaired Cortical Interneuron Maturation
  description: >-
    ZNF292-deficient cortical interneurons stay immature, express interneuron
    markers less often, produce smaller sodium and potassium currents, respond
    more strongly to GABA and show signs of hyperactivity. The authors suggest
    that some of these defects may contribute to the human disorder; the link
    to patient phenotypes has not been tested.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cortical interneuron
    term:
      id: CL:0008031
      label: cortical interneuron
  biological_processes:
  - preferred_term: neuron maturation
    modifier: DECREASED
    term:
      id: GO:0042551
      label: neuron maturation
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by the stem cell study; not tested in patients.
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by the stem cell study; not tested in patients.
  evidence:
  - reference: PMID:40257863
    reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ZNF292-deficient interneurons also exhibit altered channel activities, elevated GABA responsiveness, and hallmarks of neuronal hyperactivity."
    explanation: Functional immaturity and hyperactivity of deficient interneurons.
  - reference: PMID:40257863
    reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, the results of this work define neurodevelopmental requirements for ZNF292, some of which may contribute to pathogenic ZNF292 mutation-related NDDs."
    explanation: The authors frame the link to the human disorder as possible, not shown.

- name: ZNF292 knockdown human embryonic stem cell-derived cortical interneurons
  description: >-
    H9 human embryonic stem cells carrying CRISPR interference constructs that
    lower ZNF292 to roughly heterozygous levels, differentiated into cortical
    interneuron progenitors and neurons.
  experimental_model_type: OTHER
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: cortical interneuron
    term:
      id: CL:0008031
      label: cortical interneuron
  publication: PMID:40257863
  modeled_mechanisms:
  - target: Impaired Cortical Interneuron Maturation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Reduced ZNF292 dosage produces early differentiation followed by impaired interneuron maturation.
    limitations: >-
      Knockdown models dosage loss and cannot test the alternative that
      truncated proteins escaping nonsense-mediated decay cause disease. Only
      cortical interneurons were studied, and no patient-derived cells were
      used.
    evidence:
    - reference: PMID:40257863
      reference_title: "Requirements for the neurodevelopmental disorder-associated gene ZNF292 in human cortical interneuron development and function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, human stem cell models of ZNF292 deficiency, resembling pathogenic haploinsufficiency, are used to derive cortical inhibitory neuron progenitors and neurons."
      explanation: The model is designed to resemble haploinsufficiency.
diagnosis:
- name: Exome sequencing or gene panel
  description: >-
    Variants are found by trio exome sequencing or multigene panels. ZNF292
    contains repetitive, palindromic sequence, so apparent loss-of-function
    calls need manual review.
  diagnosis_term:
    preferred_term: whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 28 families with de novo (N = 27) or inherited (N =1) pathogenic variants in ZNF292 using a combination of trio-based ES (20 families) and multi-gene panels (8 families), in both clinical diagnostic and research settings."
    explanation: Diagnostic routes in the defining cohort.
  - reference: PMID:31723249
    reference_title: "De novo and inherited variants in ZNF292 underlie a neurodevelopmental disorder with features of autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, manual review of many of these pLoFs suggest that they may be false positive calls, consistent with our observation of multiple palindromic sequences in ZNF292 that complicates read alignment."
    explanation: Sequence complexity can produce false loss-of-function calls.
treatments:
- name: Supportive and Developmental Care
  description: >-
    No disease-specific treatment exists. Care addresses developmental,
    speech, behavioural and growth needs. The use of growth hormone for short
    stature is unproven in this disorder.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40777882
    reference_title: "Short Stature and Developmental Delay Associated With a Novel Frame-Shift Mutation in ZNF292: Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "While GH may improve height velocity in non-GHD short stature (e.g., Turner syndrome), its efficacy here is unproven, and theoretical risks outweigh potential benefits in high-risk subgroups."
    explanation: Literature review stating that growth hormone is unproven in ZNF292 disease.

  - reference: PMID:31871190
    reference_title: "Chorea-related mutations in PDE10A result in aberrant compartmentalization and functionality of the enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast to GAF-A mutants, dominant mutations in the GAF-B domain of PDE10A induce PDE10A misfolding, a common pathological phenotype in many neurodegenerative diseases."
    explanation: Distinguishes GAF-B misfolding from the GAF-A loss-of-protein mechanism.
  - reference: PMID:31871190

differential_diagnoses:
- name: Infantile-onset generalized dyskinesia with orofacial involvement (recessive PDE10A)
  disease_term:
    preferred_term: infantile-onset generalized dyskinesia with orofacial involvement
    term:
      id: MONDO:0044637
      label: infantile-onset generalized dyskinesia with orofacial involvement
  description: >-
    Biallelic PDE10A variants, mostly in the GAF-A or catalytic domain, cause a
    separate recessive disorder: onset in infancy, often with developmental
    delay, and a structurally normal MRI. GAF-A variants act through
    mistrafficking and degradation of PDE10A rather than misfolding, and the
    homozygous GAF-B variant p.Asp295Asn is predicted to block allosteric
    activation. Because that GAF-B variant gives the recessive phenotype with
    normal MRI, the boundary follows mode of inheritance and phenotype, not
    domain alone.
  distinguishing_features:
  - Biallelic rather than heterozygous PDE10A variants
  - Onset in infancy rather than at 5-10 years
  - Normal brain MRI rather than bilateral striatal T2 hyperintensity
  - Developmental or cognitive delay is common
  evidence:
  - reference: PMID:27058446
    reference_title: "Biallelic Mutations in PDE10A Lead to Loss of Striatal PDE10A and a Hyperkinetic Movement Disorder with Onset in Infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on germline PDE10A mutations in eight individuals from two families affected by a hyperkinetic movement disorder due to homozygous mutations c.320A>G (p.Tyr107Cys) and c.346G>C (p.Ala116Pro)."
    explanation: Defines the recessive GAF-A PDE10A disorder.
  - reference: PMID:36805523
    reference_title: "Expanding the genotype-phenotype landscape of PDE10A-associated movement disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The autosomal recessive mutations in the GAF-A and catalytic domains are associated with compromised membrane localization, and manifest with infantile onset chorea, developmental, and cognition delay with normal brain MRI. Conversely, autosomal dominant mutations in the GAF-B domain cause protein aggregates which results in childhood onset chorea in the context of normal cognition and development, with striatal lesions."
    explanation: States the clinical and mechanistic boundary between the recessive and dominant forms.
  - reference: PMID:36805523
    reference_title: "Expanding the genotype-phenotype landscape of PDE10A-associated movement disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although these individuals displayed a clinical phenotype attributed to the recessive GAF-A mutations, they revealed a bi-allelic GAF-B mutation (c.883G > A:p. D295 N; p.Asp295Asn) that was segregated with all affected individuals."
    explanation: A biallelic GAF-B variant gives the recessive phenotype, so domain alone does not assign a case to this entry.
  - reference: PMID:38442915
    reference_title: "PDE10A Mutation as an Emerging Cause of Childhood-Onset Hyperkinetic Movement Disorders: A Review of All Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In general, patients with homozygous mutations in either GAF-A domain of PDE10A present with a more severe phenotype and at an earlier age but without any extensive abnormalities of the striata compared with patients with dominant variants in GAF-B domain, indicating that dominant and recessive mutations have different pathogenic mechanisms."
    explanation: Review of all 31 published cases supports the same split.

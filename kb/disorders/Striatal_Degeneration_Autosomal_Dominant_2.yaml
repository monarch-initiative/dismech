discussions:
- discussion_id: gafb_misfolding_vs_lost_stimulation
  prompt: >-
    Do GAF-B variants cause disease through lost cAMP stimulation of PDE10A,
    through misfolding and aggregation of the enzyme, or both, and which of
    these produces the striatal lesions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of cAMP-Stimulated PDE10A Activation
  - pathophysiology#PDE10A Misfolding and Aggregation
  - phenotypes#Striatal T2 hyperintensity
  rationale: >-
    Both mechanisms are shown only in heterologous overexpression systems.
    The aggregation study notes that overexpression alone can drive
    aggregation and that patient-derived systems are needed. A possible
    dominant-negative effect through dimerization with wild-type PDE10A was
    proposed but not tested. No study yet links either mechanism to the
    striatal swelling and later atrophy seen on MRI. One observation bears on
    the question: the homozygous GAF-B variant p.Asp295Asn is predicted to
    block allosteric activation yet gives a normal MRI, which suggests lost
    stimulation alone does not explain the dominant striatal lesions and
    favours a contribution from misfolding.
  evidence:
  - reference: PMID:31871190
    reference_title: "Chorea-related mutations in PDE10A result in aberrant compartmentalization and functionality of the enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although data from overexpression models should be approached with caution and patient-derived systems are needed to corroborate misfolding and aggregation of these mutants, it is plausible that a common pathological mechanism occurs after expression of the aggregated-prone PDE10A forms."
    explanation: The aggregation authors themselves flag that the result needs patient-derived confirmation.
  - reference: PMID:27058447
    reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Given the homodimerized structure of PDE10A, the mutant proteins could exert a dominant-negative effect on the activity of the WT protein."
    explanation: A dominant-negative mechanism is proposed but untested.
  - reference: PMID:36805523
    reference_title: "Expanding the genotype-phenotype landscape of PDE10A-associated movement disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In silico structural analysis suggested that the GAF-B mutation blocked allosteric PDE10A activation."
    explanation: A GAF-B variant predicted to block activation occurs with a normal MRI in the recessive family, separating lost stimulation from the striatal lesion.
    directness: INDIRECT
- discussion_id: pde10a_parkinsonism_link
  prompt: >-
    Is adult-onset parkinsonism with nigrostriatal degeneration part of this
    disease, or coincidental?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Parkinsonism
  rationale: >-
    Parkinsonism has been reported in one founding case, and a PET study of
    PDE10A and ADCY5 carriers found reduced striatal dopamine transporter
    binding. Longitudinal follow-up of more adults with GAF-B variants is
    needed.
  evidence:
  - reference: PMID:27058447
    reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, it will be important to establish whether the observation of parkinsonism with nigrostriatal degeneration in individual 3 is coincidental or whether individuals with de novo PDE10A mutations are also at an increased risk of developing degeneration of nigral neurons."
    explanation: The founding report raises this as an open question.
notes: >-
  This entry covers heterozygous (dominant) PDE10A disease only. Biallelic
  PDE10A disease, including the homozygous GAF-B p.Asp295Asn family, is the
  separate recessive entity MONDO:0044637, which has its own stub at
  stubs/Infantile-onset_Generalized_Dyskinesia_With_Orofacial_Involvement.yaml.
  A PubMed title search for "PDE10A" with "genereviews[book]" and the offline
  Bookshelf index both return no GeneReviews chapter. No Orphanet record or
  ClinGen gene-disease validity assertion for PDE10A was found in the local
  caches. No disease-specific treatment has been reported; the founding
  report proposes pharmacological modulation of striatal cAMP as a direction
  for future therapy. Two case reports of dominant PDE10A chorea
  (PMID:28949041, PMID:29165877) have no abstract in PubMed, so their
  findings, including diurnal fluctuation of chorea, are not cited here. A
  report of levodopa response in two sisters (PMID:30777652) also has no
  abstract; its MeSH terms include consanguinity, so it may describe the
  recessive form, and it is not cited here. Anxiety was recorded in one of
  the three founding cases (PMID:27058447, Table 1) and is not entered as a
  phenotype on a single observation. A Pde10a p.Phe300Leu knock-in mouse
  with progressive striatal vacuolation and PDE10A aggregates has been
  presented only as a conference abstract, so no animal model is recorded.
  No prevalence figure has been published; the literature describes only
  isolated cases and families.

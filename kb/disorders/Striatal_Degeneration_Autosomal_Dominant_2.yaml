pathophysiology:
- name: PDE10A GAF-B Heterozygous Missense Substitution
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense substitution at Phe300 or Phe334 in the GAF-B
    regulatory domain of PDE10A, usually arising de novo. The substitution
    has two separately demonstrated consequences: it disrupts allosteric
    activation by cAMP, and it causes the enzyme to misfold.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: PDE10A
    term:
      id: hgnc:8772
      label: PDE10A
  evidence:
  - reference: PMID:27058447
    reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both substitutions affect highly conserved amino acids located in the regulatory GAF-B domain, which, by binding to cAMP, stimulates the activity of the PDE10A catalytic domain."
    explanation: Places both founding substitutions in the GAF-B regulatory domain.
  downstream:
  - target: PDE10A GAF-B Domain cAMP-Binding Defect
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27058447
      reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "In silico modeling showed that the altered residues are located deep in the binding pocket, where they are likely to alter cAMP binding properties."
      explanation: Modelling links the substituted residues to the cAMP-binding pocket.
  - target: PDE10A Misfolding and Aggregation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31871190
      reference_title: "Chorea-related mutations in PDE10A result in aberrant compartmentalization and functionality of the enzyme."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Conversely, the high incidence of protein misfolding with the F300L and F334L forms indicate that their abnormal association is induced by these mutations."
      explanation: The substitutions themselves induce misfolding, independently of the cAMP-binding defect.
- name: PDE10A GAF-B Domain cAMP-Binding Defect
  biological_scale: MOLECULAR
  description: >-
    Phe300 and Phe334 sit deep in the cAMP-binding pocket of the GAF-B
    regulatory domain, in the beta1 and beta3 strands, so their substitution
    is predicted to disrupt cAMP binding.
  genes:
  - preferred_term: PDE10A

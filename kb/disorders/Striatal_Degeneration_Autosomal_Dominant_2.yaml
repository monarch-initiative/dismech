- name: Dysregulated cAMP Signaling in Striatal Medium Spiny Neurons
  biological_scale: CELLULAR
  description: >-
    Striatal medium spiny neuron activity depends on cAMP signaling set by
    adenylyl cyclase 5 synthesis and PDE10A degradation. Without
    cAMP-stimulated PDE10A activity, cAMP-dependent signaling in MSNs is
    expected to be poorly braked during dopamine D1 or adenosine A2A receptor
    stimulation. In cells, PKA substrate phosphorylation after forskolin
    stimulation was reduced by wild-type PDE10A but not by the GAF-B mutants.
  cell_types:

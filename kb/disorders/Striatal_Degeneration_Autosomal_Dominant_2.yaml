inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The founding cases carried de novo heterozygous PDE10A substitutions, and a
    later family showed several affected relatives carrying a heterozygous
    GAF-B substitution, consistent with dominant transmission.
  evidence:
  - reference: PMID:27058447
    reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the family-based sequencing approach of individuals 1 and 2 directly indicated that both PDE10A mutations had occurred de novo (Figure 2A)."
    explanation: Trio sequencing showed the PDE10A variants arose de novo in two of the founding cases; haplotype analysis suggested the same for the third.
  - reference: PMID:29130591
    reference_title: "Familial choreoathetosis due to novel heterozygous mutation in PDE10A."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a family with multiple affected individuals with childhood onset chorea, striatal abnormalities, and a novel heterozygous mutation, c.1001T>G(p.F334C) in PDE10A which was identified by exome sequencing."
    explanation: Multiple affected relatives sharing one heterozygous variant shows the disease can be transmitted in a dominant pattern, not only arise de novo.
progression:
- phase: Childhood onset
  age_range: 5-10 years
  notes: >-
    In the founding series chorea began between 5 and 10 years of age, after
    normal developmental milestones, and progressed only slightly. Striatal
    MRI findings appear to change with age: the 11-year-old had striatal
    swelling with restricted diffusion, while the 22-year-old had modest
    putaminal atrophy with normal diffusion.
  evidence:
  - reference: PMID:27058447
    reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three individuals presented in childhood (age of onset between 5 and 10 years) with a scarcely progressive movement disorder dominated by chorea"
    explanation: Gives the age of onset and the slow course in the founding series.
  - reference: PMID:27058447
    reference_title: "De Novo Mutations in PDE10A Cause Childhood-Onset Chorea with Bilateral Striatal Lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of individual 2 (II-1 in Figure 2A; aged 22 years when scanned) demonstrated modest atrophy of the putamina (Figure 1D) and normal diffusion (Figures 1E and 1F), suggesting a more advanced stage of disease."
    explanation: An older individual showed putaminal atrophy, which the authors read as a later stage of the same striatal process.

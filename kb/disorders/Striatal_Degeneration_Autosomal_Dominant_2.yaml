- name: Loss of cAMP-Stimulated PDE10A Activation
  biological_scale: MOLECULAR
  description: >-
    Basal PDE10A hydrolysis of cAMP and cGMP is unchanged, but cAMP binding to
    GAF-B no longer switches the enzyme into its stimulated ("super-active")
    state. PDE10A therefore cannot increase cyclic-nucleotide breakdown when
    cAMP rises, removing a brake on medium spiny neuron activation.

name: Striatal Degeneration, Autosomal Dominant 2
creation_date: "2026-10-18T21:54:00Z"
description: >-
  Striatal degeneration, autosomal dominant 2 is an ultra-rare childhood-onset
  hyperkinetic movement disorder caused by heterozygous missense variants in
  the regulatory GAF-B domain of PDE10A, a cyclic-nucleotide phosphodiesterase
  that is highly and selectively expressed in striatal medium spiny neurons.
  Most reported variants arose de novo, and one family shows dominant
  transmission. Affected individuals present between about 5 and 10 years of
  age with a scarcely progressive chorea, normal development and cognition,
  and symmetrical bilateral striatal T2 hyperintensity on brain MRI, which
  appears to evolve from striatal swelling with restricted diffusion in childhood to
  putaminal atrophy in adulthood. The substitutions leave basal enzyme activity
  intact but abolish allosteric stimulation of PDE10A by cAMP, and in cell
  models they cause the enzyme to misfold and aggregate.
category: Mendelian
disease_term:
  preferred_term: PDE10A-related autosomal dominant childhood-onset chorea with striatal lesions
  term:
    id: MONDO:0014835
    label: striatal degeneration, autosomal dominant 2
parents:

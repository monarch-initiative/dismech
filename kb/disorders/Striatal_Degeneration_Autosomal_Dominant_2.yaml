- name: PDE10A Misfolding and Aggregation
  biological_scale: CELLULAR
  description: >-
    When overexpressed in HEK293 cells and striatal neurons, the GAF-B mutant
    forms leave the plasma membrane and accumulate in cytoplasmic,
    perinuclear aggregates (aggresomes) that recruit p62 and ubiquitin and
    are cleared by the autophagy-lysosome pathway. Recessive GAF-A variants
    instead cause mistrafficking and degradation without aggregation, which
    the authors take as evidence of a distinct mechanism.

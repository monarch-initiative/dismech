    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Generalized osteoporosis
    description: Antiresorptive treatment to increase bone mass.
  evidence:
  - reference: PMID:26987875
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bisphosphonate treatment in 1 patient resulted in almost complete
      normalization of vertebral structures by adolescence, whereas treatment
      response in the others was variable.
    explanation: Variable but sometimes marked vertebral response.
  - reference: PMID:36815763
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous reports of bisphosphonate treatment response were variable,
      whereas a long-term follow-up with bisphosphonate treatment in this case
      resulted in normalization of vertebral structures.
    explanation: Long-term bisphosphonate treatment normalized vertebral structure.
  - reference: PMID:30891060
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pamidronate therapy was beneficial but did not fully restore the bone health.
    explanation: Partial skeletal benefit from pamidronate.
  - reference: PMID:30891060
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As expected, pamidronate infusion did not improve vision or hearing.
    explanation: Bisphosphonates do not address the ocular or auditory features.
  - reference: PMID:38829420
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient is doing well on six monthly zoledronic acid infusions.
    explanation: Zoledronic acid used in an adult patient.

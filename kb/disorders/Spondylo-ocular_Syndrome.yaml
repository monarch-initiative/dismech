      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical features include cataract, loss of vision due to retinal
        detachment, facial dysmorphism, facial hypotonia, normal height with
        disproportional short trunk, immobile spine with thorakal kyphosis
        and reduced lumbal lordosis.
      explanation: Attributes the visual loss to retinal detachment.

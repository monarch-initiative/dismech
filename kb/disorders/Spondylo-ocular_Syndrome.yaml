name: Spondylo-ocular Syndrome
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >
  Spondylo-ocular syndrome (SOS) is an ultra-rare autosomal recessive
  skeletal-ocular disorder caused by biallelic loss-of-function variants in
  XYLT2, which encodes xylosyltransferase II (XT-II), one of the two
  vertebrate isoenzymes that transfer xylose from UDP-xylose onto serine
  residues of proteoglycan core proteins. This xylosylation is the first step
  in assembly of the tetrasaccharide linker shared by heparan sulfate and
  chondroitin/dermatan sulfate chains, placing SOS among the
  "linkeropathies" alongside the XYLT1, B4GALT7, B3GALT6 and B3GAT3
  disorders. Loss of XT-II reduces glycosaminoglycan assembly in patient
  fibroblasts and lowers circulating xylosyltransferase activity, for which
  XT-II is the predominant serum isoenzyme. Tissues in which the remaining
  XT-I activity does not compensate are affected: bone (childhood-onset
  generalized osteoporosis, multiple long-bone and vertebral compression
  fractures, platyspondyly, kyphosis, short stature), eye (dense cataracts,
  crystalline lens malformation, retinal detachment, and less commonly
  corneal opacity or keratoconus), inner ear (sensorineural hearing loss)
  and, in a minority, heart (structural cardiac defects). Facial dysmorphism
  and developmental delay or learning difficulties are variable.
  Expressivity varies within and between families; one reported child
  homozygous for a missense variant had fractures but neither cataract nor
  retinal detachment. Management is supportive: bisphosphonates for the
  osteoporosis, cataract and retinal surgery, and hearing rehabilitation.
synonyms:
- spondyloocular syndrome
- SOS
- XYLT2-related spondyloocular syndrome

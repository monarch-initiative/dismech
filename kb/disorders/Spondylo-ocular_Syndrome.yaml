classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A monogenic autosomal recessive inborn error of proteoglycan
      biosynthesis presenting as a multisystem skeletal and ocular disorder
      rather than as a disease of a single organ system.
  icimd_category:
  - classification_value: o_linked_protein_glycosylation
    notes: >-
      ICIMD places glycosaminoglycan-linker (proteoglycan O-xylosylglycan)
      synthesis defects under disorders of O-linked protein glycosylation.
      MONDO places MONDO:0011604 under linkeropathy (MONDO:1040022).
    evidence:
    - reference: PMID:27871115
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        we exclusively focused on 5 genes - XYLT1, XYLT2, B4GALT7, B3GALT6,
        and B3GAT3 - that encode enzymes involved in the biosynthesis of the
        common tetrasaccharide linker region of proteoglycans and review the
        associated diseases, also referred to as linkeropathies
      explanation: >-
        Places XYLT2 disease among the linkeropathies, defects of the
        tetrasaccharide linker by which glycosaminoglycan chains are
        O-linked to proteoglycan core proteins.
inheritance:
- name: Autosomal Recessive
  description: >
    Affected individuals carry biallelic XYLT2 variants, most often
    homozygous in consanguineous families; compound heterozygosity has also
    been reported. Heterozygous carrier parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:30891060
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger Sequencing confirmed the presence of the novel homozygous
      mutation in all three patients while the parents were heterozygous
      carriers of the mutation, in accordance with an autosomal recessive
      inheritance pattern.
    explanation: >-
      Segregation in a consanguineous family shows homozygous affected
      children and heterozygous unaffected parents.
  - reference: PMID:39528281
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compound heterozygous variants of the XYLT2 gene, namely
      c.1103_1104delAG (p.Gln368Argfs*8) and c.1238_1253delinsA
      (p.Val413_Pro418delinsGlu), which were inherited from his
      phenotypically normal father and mother, respectively.
    explanation: >-
      Documents compound heterozygosity with each variant inherited from an
      unaffected heterozygous parent.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    22 reported cases as of the 2023 Lebanese family report and 24 as of the
    2024 Indian case report; single further cases have been published since
    (Chinese, 2024; Iranian, 2026). No population prevalence estimate has
    been published.
  evidence:
  - reference: PMID:36833424
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 22 cases with SOS have been described, with varying clinical
      presentations and a yet-to-be-established genotypic-phenotypic
      correlation.
    explanation: Cumulative published case count as of 2023.
  - reference: PMID:38829420
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Till date only 24 cases have been reported worldwide with no cases
      documented from India.
    explanation: Cumulative published case count as of 2024.
genetic:
- name: XYLT2
  notes: >
    XYLT2 (17q21) encodes xylosyltransferase II. Reported disease alleles
    include frameshift (c.692dup; c.520del, p.Ala174Profs*35; c.1586dup,
    p.Thr530Hisfs*; c.191_192delCA, p.Thr64fs*22; p.R840fs*115;
    c.1103_1104delAG, p.Gln368Argfs*8), nonsense (p.Arg730*, p.Trp690Ter,
    p.Tyr414*), in-frame indel (c.1238_1253delinsA) and missense
    (p.Arg387Trp, p.Asp850His, p.Arg563Gly, p.Leu605Pro, p.Glu656Gly)
    variants. Truncating alleles in the gene-discovery report reduced XYLT2
    mRNA and serum xylosyltransferase activity; enzyme activity of the
    missense alleles is not reported in the cited abstracts.
  gene_term:
    preferred_term: XYLT2
    term:
      id: hgnc:15517
      label: XYLT2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:26027496
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequence analyses showed that both individuals had a
      homozygous c.692dup mutation (GenBank: NM_022167.3) in the
      xylosyltransferase II locus (XYLT2) (MIM: 608125), causing reduced
      XYLT2 mRNA and low circulating xylosyltransferase (XylT) activity.
    explanation: >-
      Gene discovery report linking a homozygous XYLT2 frameshift to the
      syndrome, with reduced transcript and enzyme activity.
  - reference: PMID:26987875
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing revealed a homozygous nonsense mutation,
      NM_022167.3(XYLT2): c.2188C>T, resulting in a premature stop codon
      (p.Arg730*) in a female patient.
    explanation: Independent confirmation in an unrelated patient.
  - reference: PMID:29136277
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using DNA from affected members of the same 2 families, we performed
      whole exome sequencing, which revealed 2 novel homozygous missense
      variants (c.1159C > T, p.Arg387Trp) and (c.2548G > C, p.Asp850His).
    explanation: >-
      Solves the two families in which the syndrome was first described
      clinically (Iraqi and Turkish), confirming XYLT2 as the locus.
  - reference: PMID:36833424
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing revealed a novel homozygous nonsense mutation in
      XYLT2 (p.Tyr414*) in these patients.
    explanation: Further independent family with a null XYLT2 allele.
pathophysiology:
- name: Xylosyltransferase II Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic XYLT2 variants abolish or reduce xylosyltransferase II
    activity. XT-II transfers xylose from UDP-xylose to serine residues of
    proteoglycan core proteins, the first step of glycosaminoglycan linker
    synthesis, and in vitro is catalytically equivalent to XT-I. Truncating
    alleles reduce XYLT2 mRNA and lower xylosyltransferase activity in
    patient fibroblasts and serum.
  gene:
    preferred_term: XYLT2
    term:
      id: hgnc:15517
      label: XYLT2
  molecular_functions:
  - preferred_term: xylosyltransferase II activity
    term:
      id: GO:0030158
      label: protein xylosyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26027496
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequence analyses showed that both individuals had a
      homozygous c.692dup mutation (GenBank: NM_022167.3) in the
      xylosyltransferase II locus (XYLT2) (MIM: 608125), causing reduced
      XYLT2 mRNA and low circulating xylosyltransferase (XylT) activity.
    explanation: >-
      Shows that the disease allele lowers XYLT2 transcript and
      xylosyltransferase activity in patients.
  - reference: PMID:17189265
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report the enzymatic activity of XT-II and provide evidence
      that XT-II initiates the biosynthesis of both heparan sulfate and
      chondroitin sulfate GAGs.
    explanation: >-
      Establishes the normal molecular function lost in the disease: XT-II
      is an active xylosyltransferase initiating both glycosaminoglycan
      classes.
  - reference: PMID:17194707
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest that XT-I and XT-II are, at least in vitro,
      functionally identical.
    explanation: >-
      Recombinant XT-II has the same catalytic behaviour as XT-I, so the
      tissue selectivity of the disease is attributed to differential
      isoform expression rather than to a unique XT-II activity.
  downstream:
  - target: Impaired Glycosaminoglycan Chain Initiation
    description: >
      Without XT-II, core proteins in XT-II-dependent cells are not
      xylosylated and glycosaminoglycan linker assembly cannot begin.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26027496
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Fibroblasts from individuals 1 and 2 showed a range of defects
        including reduced XylT activity, GAG incorporation of (35)SO4, and
        heparan sulfate proteoglycan assembly.
      explanation: >-
        Patient fibroblasts with XYLT2 loss show reduced xylosyltransferase
        activity together with reduced GAG synthesis and heparan sulfate
        proteoglycan assembly.
- name: Impaired Glycosaminoglycan Chain Initiation
  biological_scale: CELLULAR
  description: >
    Reduced xylosylation of core proteins lowers assembly of heparan sulfate
    and chondroitin/dermatan sulfate chains on proteoglycans. The residual
    xylosyltransferase activity comes from XT-I, whose expression relative
    to XT-II differs between cell types and tissues; tissues in which XT-II
    is the predominant isoenzyme are expected to lose the most proteoglycan.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: proteoglycan biosynthesis
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
    modifier: DECREASED
  - preferred_term: heparan sulfate proteoglycan biosynthesis
    term:
      id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
    modifier: DECREASED
  - preferred_term: chondroitin sulfate proteoglycan biosynthesis
    term:
      id: GO:0050650
      label: chondroitin sulfate proteoglycan biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:26027496
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblasts from individuals 1 and 2 showed a range of defects
      including reduced XylT activity, GAG incorporation of (35)SO4, and
      heparan sulfate proteoglycan assembly.
    explanation: >-
      Direct measurement of reduced glycosaminoglycan synthesis and heparan
      sulfate proteoglycan assembly in patient cells.
  - reference: PMID:17189266
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of a previously described Chinese hamster ovary cell
      xylosyltransferase mutant (psgA-745) shows that it harbors an Xylt2
      nonsense mutation and fails to assemble glycosaminoglycans onto
      recombinant biglycan.
    explanation: >-
      A cell line whose only xylosyltransferase is Xylt2 cannot assemble
      glycosaminoglycans when Xylt2 is truncated, showing the step is
      rate-limiting where XT-I is absent.
  - reference: PMID:17189266
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression analyses on 10 different human transformed cell lines
      detect exclusive XYLT2 expression in two and co-expression of XYLT1
      and XYLT2 in the others but at disparate ratios where XYLT2 expression
      is greater than XYLT1 in most cell lines.
    explanation: >-
      Differential XYLT1/XYLT2 expression across cell types provides a basis
      for tissue-selective proteoglycan loss.
  - reference: PMID:17517600
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that inactivation of XylT2 results in a substantial
      reduction in PGs and a phenotype characteristic of many aspects of
      polycystic liver and kidney disease
    explanation: >-
      In vivo, Xylt2 knockout mice show a substantial reduction in
      proteoglycans, so XT-I does not fully compensate.
  downstream:
  - target: Skeletal Proteoglycan Deficiency and Low Bone Mass
    description: >
      Bone is one of the tissues the gene-discovery report identifies as
      dependent on XT-II for proteoglycan assembly. The intermediate steps
      linking reduced skeletal proteoglycan to low bone mass have not been
      defined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26027496
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These studies illustrate that the cells of the lens, retina, heart
        muscle, inner ear, and bone are dependent on XylT2 for proteoglycan
        assembly in humans.
      explanation: >-
        Names bone among the tissues dependent on XT-II for proteoglycan
        assembly.
  - target: Ocular Lens and Retinal Proteoglycan Deficiency
    description: >
      Lens and retina are named as XT-II-dependent tissues; the specific
      matrix or cellular defect producing cataract and retinal detachment
      has not been characterized.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26027496
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These studies illustrate that the cells of the lens, retina, heart
        muscle, inner ear, and bone are dependent on XylT2 for proteoglycan
        assembly in humans.
      explanation: Names lens and retina among the XT-II-dependent tissues.
  - target: Inner Ear Proteoglycan Deficiency
    description: >
      The inner ear is named as an XT-II-dependent tissue; the cochlear
      lesion responsible for sensorineural hearing loss has not been
      examined.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26027496
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These studies illustrate that the cells of the lens, retina, heart
        muscle, inner ear, and bone are dependent on XylT2 for proteoglycan
        assembly in humans.
      explanation: Names the inner ear among the XT-II-dependent tissues.
  - target: Cardiac Proteoglycan Deficiency
    description: >
      Heart muscle is named as an XT-II-dependent tissue, and Xylt2 knockout
      mouse heart shows a reduction in heparan sulfate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26027496
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These studies illustrate that the cells of the lens, retina, heart
        muscle, inner ear, and bone are dependent on XylT2 for proteoglycan
        assembly in humans.
      explanation: Names heart muscle among the XT-II-dependent tissues.
  - target: Global developmental delay
    description: >
      Developmental delay or learning difficulties occur in a subset of
      patients. No neural mechanism has been studied, so this edge records
      only that the delay is attributed to the XYLT2 defect.
    causal_link_type: UNKNOWN
- name: Skeletal Proteoglycan Deficiency and Low Bone Mass
  biological_scale: TISSUE
  description: >
    Childhood-onset generalized osteoporosis is the dominant skeletal
    manifestation, producing long-bone fractures after minor trauma and
    vertebral compression fractures with platyspondyly, kyphosis and short
    trunk. Vertebral structure can normalize under bisphosphonate
    treatment. Whether the low bone mass reflects defective bone formation,
    excess resorption, or abnormal growth-plate cartilage has not been
    determined.
  locations:
  - preferred_term: bone element
    term:
      id: UBERON:0001474
      label: bone element
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:
  - reference: PMID:27871115
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Among these genes, XYLT2 mutations cause a relatively distinct
      phenotype, the so-called spondyloocular syndrome, which is
      characterized by clinical presentation of a very severe
      childhood-onset primary osteoporosis, cataract, and hearing
      impairment.
    explanation: >-
      Identifies severe childhood-onset primary osteoporosis as the
      defining skeletal feature.
  downstream:
  - target: Generalized osteoporosis
    description: Reduced bone mass throughout the skeleton.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12719077
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Complete radiologic examination in one index patient revealed a
        generalized moderate osteoporosis, platyspondyly with fish bone
        appearance, and greatly enlarged intervertebral spaces.
      explanation: Radiological generalized osteoporosis in the first described family.
  - target: Recurrent fractures
    description: Low bone mass predisposes to fractures after minor trauma.
    causal_link_type: DIRECT
  - target: Vertebral compression fracture
    description: Osteoporotic vertebral bodies collapse under axial load.
    causal_link_type: DIRECT
  - target: Platyspondyly
    description: >-
      Flattened vertebral bodies result from osteoporotic thinning and
      compression of the vertebral bodies.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34925453
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The instrumental examinations revealed platyspondyly with thinning of
        the vertebral bodies due to osteoporosis and thoracic deformity with
        secondary kyphosis
      explanation: >-
        Attributes the platyspondyly to osteoporotic thinning of the
        vertebral bodies.
  - target: Kyphosis
    description: Secondary to vertebral collapse.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34925453
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The instrumental examinations revealed platyspondyly with thinning of
        the vertebral bodies due to osteoporosis and thoracic deformity with
        secondary kyphosis
      explanation: Describes the kyphosis as secondary to the osteoporotic spine.
  - target: Short stature
    description: >-
      Short stature, often with a short trunk, accompanies the vertebral
      flattening; whether it is wholly secondary to the spinal involvement
      is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Ocular Lens and Retinal Proteoglycan Deficiency
  biological_scale: TISSUE
  description: >
    Lens and retina are dependent on XT-II for proteoglycan assembly.
    Clinically this appears as dense, often early-onset cataract,
    crystalline lens malformation (absent lens nucleus), and retinal
    detachment that may be spontaneous. Corneal involvement (opacity,
    keratoconus) has been reported in single patients.
  locations:
  - preferred_term: lens of camera-type eye

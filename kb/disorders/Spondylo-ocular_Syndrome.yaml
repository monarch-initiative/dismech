    snippet: >-
      These studies illustrate that the cells of the lens, retina, heart
      muscle, inner ear, and bone are dependent on XylT2 for proteoglycan
      assembly in humans.
    explanation: Establishes the inner ear as an XT-II-dependent tissue.
  downstream:
  - target: Sensorineural hearing impairment
    description: Sensorineural hearing loss of cochlear origin.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cardiac Proteoglycan Deficiency
  biological_scale: TISSUE
  description: >
    Heart muscle is dependent on XT-II for proteoglycan assembly. In Xylt2
    knockout mice, heart heparan sulfate falls by 38% while chondroitin
    sulfate is not significantly changed. In patients, cardiac involvement
    is heterogeneous and present in a minority (for example an atrial
    septal defect, or neonatal left ventricular hypertrophy with
    contractile dysfunction).
  locations:

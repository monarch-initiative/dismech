  biological_scale: TISSUE
  description: >
    The inner ear is dependent on XT-II for proteoglycan assembly, and
    sensorineural hearing loss, often of gradual onset, is common. The
    cochlear structure affected has not been studied.
  locations:
  - preferred_term: internal ear

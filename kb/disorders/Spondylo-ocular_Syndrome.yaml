biochemical:
- name: Serum xylosyltransferase activity
  presence: DECREASED
  context: >-
    Serum xylosyltransferase activity is mainly contributed by XT-II, so it
    is low in XYLT2-deficient patients. It is a research assay that can
    support variant interpretation, not a routine clinical test.
  readouts:
  - target: Xylosyltransferase II Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Low serum XylT activity reports loss of XT-II activity.
  evidence:
  - reference: PMID:26027496
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an unrelated boy (individual 3) from the second family, we noted low
      serum XylT activity.
    explanation: Low serum XylT activity preceded identification of an XYLT2 frameshift.
  - reference: PMID:25748573
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This issue has now been solved and the following experimental study
      demonstrates for the first time, via the enzyme activity that XT-II is
      the predominant isoenzyme responsible for XT activity in human serum.
    explanation: Explains why XT-II loss is visible as reduced serum activity.
diagnosis:
- name: Exome Sequencing for Biallelic XYLT2 Variants
  description: >
    Diagnosis is confirmed by identifying biallelic XYLT2 variants, in most
    reported cases by exome or clinical exome sequencing in a child
    presenting with fragility fractures, osteoporosis and cataract or
    hearing loss.
  evidence:
  - reference: PMID:26987875
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing revealed a homozygous nonsense mutation,
      NM_022167.3(XYLT2): c.2188C>T, resulting in a premature stop codon
      (p.Arg730*) in a female patient.
    explanation: Exome sequencing as the diagnostic route.
  - reference: PMID:42116084
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing revealed a homozygous missense mutation in the XYLT2
      gene (c.1967A>G, p.Glu656Gly) through whole exome sequencing (WES).
    explanation: Whole exome sequencing established the diagnosis.
treatments:
- name: Bisphosphonate Therapy
  description: >
    Intravenous bisphosphonates (pamidronate, zoledronic acid) are used for
    the osteoporosis. Response is variable: vertebral structure normalized
    in some treated children, while others showed only partial improvement.
    Bisphosphonates do not improve vision or hearing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:

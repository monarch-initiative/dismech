animal_models:
- name: Xylt2 knockout mouse
  species: Mouse
  genotype: Xylt2-/-
  genes:
  - preferred_term: XYLT2
    term:
      id: hgnc:15517
      label: XYLT2
  description: >
    Xylt2-null mice survive, with residual xylosyltransferase activity
    supplied by XT-I. They show reduced tissue proteoglycan, hepatic and
    renal cysts, lipodystrophy with insulin resistance, splenomegaly and
    reduced cardiac heparan sulfate. The three cited reports do not
    describe the skeletal, lens, retinal or auditory phenotypes that define
    the human syndrome, and hepatorenal cysts and lipodystrophy are not
    established features of human SOS.
  publication: PMID:17517600
  modeled_mechanisms:
  - target: Impaired Glycosaminoglycan Chain Initiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Loss of Xylt2 substantially reduces tissue proteoglycans in vivo.
    limitations: >-
      The organ distribution of proteoglycan loss depends on the mouse ratio
      of Xylt1 to Xylt2 expression, which may differ from that in human
      tissues.
    evidence:
    - reference: PMID:17517600
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that inactivation of XylT2 results in a substantial
        reduction in PGs and a phenotype characteristic of many aspects of
        polycystic liver and kidney disease
      explanation: Direct in vivo demonstration of proteoglycan reduction.
    - reference: PMID:32965647
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Because the residual XylT activity in the Xylt2-/- is due to
        xylosyltransferase 1 (XylT1), these studies indicate that both XylT1
        and XylT2 have important roles in PG biosynthesis and organ
        homeostasis.
      explanation: Shows that the residual activity in the model comes from XT-I.
  - target: Cardiac Proteoglycan Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Cardiac heparan sulfate is reduced in the knockout.
    limitations: >-
      Only the biochemical change is shown; the structural heart defects of
      some patients are not reported in the mouse.
    evidence:
    - reference: PMID:32965647
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the heart of the Xylt2−/− mice, there is a significant decrease in
        total HS disaccharides, particularly those containing N-sulfo
        glucosamine residues or 2-O-sulfo uronic acid.
      explanation: Reduced cardiac heparan sulfate in the knockout.
  evidence:
  - reference: PMID:30778123
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Decreased GAGs due to the loss of the key GAG assembly enzyme XylT2
      causes reduced steady state adipose tissue stores leading to a unique
      lipodystrophic model.
    explanation: Documents an additional non-skeletal phenotype of the knockout.
notes: >-
  No GeneReviews chapter covers this disorder: just check-genereviews reports
  NO_CHAPTER against the 2026-09-10 Bookshelf index. The phenotype
  frequencies come from the literature tally of 22 patients in PMID:34925453
  and are small-sample estimates across heterogeneous genotypes. That
  tally's ocular-problems count (21/22) groups cataract, lens malformation,
  retinal detachment and other eye findings, so it is not assigned to any
  single ocular phenotype.

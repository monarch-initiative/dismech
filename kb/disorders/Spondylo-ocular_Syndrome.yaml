      These studies illustrate that the cells of the lens, retina, heart
      muscle, inner ear, and bone are dependent on XylT2 for proteoglycan
      assembly in humans.
    explanation: Establishes lens and retina as XT-II-dependent tissues.
  downstream:
  - target: Cataract
    description: Opacification of the XT-II-dependent lens.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal lens morphology
    description: Malformation of the crystalline lens.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal detachment
    description: Retinal detachment, sometimes spontaneous.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Corneal opacity
    description: >-

notes: >-
  No GeneReviews chapter covers this disease. Kellner et al. 2019
  (PMID:30965037) is the primary report of transplant outcomes in this allele
  class, but its PubMed record carries no abstract, so the transplant claims
  in this entry quote the 2020 review that summarizes it. PMID:28096536, the
  earlier case report of the patient who later developed T-cell leukemia, has no
  abstract either and is not cited.

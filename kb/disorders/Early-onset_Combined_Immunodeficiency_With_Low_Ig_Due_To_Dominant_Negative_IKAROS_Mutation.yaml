- name: Impaired Granulocyte and Myeloid Dendritic Cell Production
  biological_scale: CELLULAR
  description: >-
    IKAROS is expressed throughout hematopoiesis, and the myeloid arm of the
    disease follows. Eosinophils were undetectable in every patient tested,
    five of seven had chronic mild to moderate neutropenia, bone marrow
    aspirates in two showed reduced granulopoiesis with normal erythroid and
    megakaryocytic lineages, and myeloid dendritic cells were low in the two
    patients tested. The myeloid component is the variable part of the
    phenotype.

differential_diagnoses:
- name: IKZF1 haploinsufficiency
  description: >-
    Haploinsufficient IKZF1 variants, including N159K at the same codon, cause
    a CVID-like antibody deficiency with progressive B-cell loss. T-cell and
    myeloid biology are not affected in a clinically relevant way, and the
    T-cell phenotype runs the other way, with memory cells increased and naive
    cells reduced. Those variants are curated as the IKAROS subtype of
    Common_Variable_Immunodeficiency.
  distinguishing_features:
  - >-
    Naive-predominant T cells, absent plasma cells, myeloid involvement and
    early Pneumocystis pneumonia in the dominant-negative class; an older age
    at presentation, memory-predominant T cells and autoimmunity in the
    haploinsufficient class.
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, haploinsufficient mutations preserving one functionally active allele do not seem to impact T cell and myeloid biology in a clinically relevant manner (15, 18, 22), which demonstrates that one fully functional IKZF1 copy is sufficient to retain normal T cell and myeloid functions."
    explanation: The clinical difference between the two loss-of-function classes.
  - reference: PMID:41424385
    reference_title: "IKAROS regulates human T cell phenotype at a thymic and postthymic level."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is noteworthy that missense variants at position 159 (N159S or N159K) were associated with strikingly different mechanisms of action as well as immune and clinical phenotypes."
    explanation: Shows the two diseases can share a codon, so the distinction is functional rather than positional.
- name: Dimerization-defective IKAROS disease
  description: >-
    Variants in the two C-terminal zinc fingers impair dimerization without
    interfering with the wild-type allele. Presentation is dominated by
    cytopenias, lymphoid malignancy and variable antibody deficiency, with
    incomplete penetrance and asymptomatic carriers, and severe infection is
    less common. Curated as
    Combined_Immunodeficiency_Due_To_Dimerization_Defective_IKAROS_Mutation.
  distinguishing_features:
  - >-
    High, probably full, penetrance and early Pneumocystis pneumonia here,
    against incomplete penetrance, hematologic presentation and
    memory-predominant T cells in the dimerization-defective class.
  evidence:
  - reference: PMID:41424385
    reference_title: "IKAROS regulates human T cell phenotype at a thymic and postthymic level."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with IKZF1 haploinsufficiency (HI) or dimerization-defective (DD) variants show reduced naive and increased memory T cells, while dominant-negative (DN) mutations result in the opposite phenotype."
    explanation: The T-cell phenotype that separates this class from the other two loss-of-function classes.
- name: GATA2 deficiency
  description: >-
    One patient in the founding cohort was first suspected of having GATA2
    haploinsufficiency on the basis of marrow hypocellularity, monocytopenia
    and absent B cells. GATA2 deficiency is also a dominant transcription-factor
    disorder with combined myeloid and lymphoid defects and malignancy risk.
  distinguishing_features:
  - >-
    Pneumocystis pneumonia in infancy and naive-predominant T cells in IKAROS
    dominant-negative disease; mycobacterial and papillomavirus infection,
    monocytopenia and later-onset myelodysplasia in GATA2 deficiency.
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, patient E1 was first suspected to have GATA2 deficiency based on bone marrow hypocellularity, monocytopenia, and the complete absence of B cells."
    explanation: Records the confusion that actually arose in a reported patient.
animal_models:
- name: Plastic mouse (Ikzf1 H191R DNA-binding zinc finger point mutant)
  species: Mouse
  genotype: Ikzf1 p.H191R (ENU-induced, zinc finger 3 of the DNA-binding domain)
  publication: PMID:12871645
  description: >-
    An ENU-derived point mutation in a DNA-binding zinc finger that abolishes
    DNA binding while the full-length protein still assembles into higher-order
    complexes. Homozygotes die in utero with blocked lymphopoiesis and
    defective granulocyte and erythrocyte differentiation; heterozygotes show a
    partial block in lymphocyte differentiation. The paper that describes the
    strain calls the allele recessive and niche-filling, while the founding
    paper of this disease reads Plastic heterozygotes as carrying a
    dominant-negative missense mutation and draws its own comparison to them,
    so the allele's relation to the human N159 alleles is contested between the
    two sources rather than settled here.
  evidence:
  - reference: PMID:12871645
    reference_title: Widespread failure of hematolymphoid differentiation caused by a recessive niche-filling allele of the Ikaros transcription factor.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we describe a mouse strain, Plastic, with a point mutation in a zinc finger of Ikaros that disrupts DNA binding but preserves efficient assembly of the full-length protein into higher order complexes."
    explanation: >-
      The allele is of the same functional type as the human disease alleles: a
      DNA-binding lesion in a protein that still joins its complexes.
  modeled_mechanisms:
  - target: Early B Cell Developmental Arrest
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The heterozygote, the genotype that matches the human disease, has a
      partial block in lymphocyte differentiation.
    limitations: >-
      The mouse allele is H191R in zinc finger 3, not N159 in zinc finger 2,
      and it was not tested for interference with the wild-type protein, so it
      is an allele of the same class rather than a model of the human variant.
      The heterozygous block is partial and described for lymphocytes
      generally, not staged within the B-cell lineage as in the human marrow
      studies, and the severe multilineage phenotype requires homozygosity,
      which is embryonically lethal and has no human counterpart.
    evidence:
    - reference: PMID:12871645
      reference_title: Widespread failure of hematolymphoid differentiation caused by a recessive niche-filling allele of the Ikaros transcription factor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "while heterozygotes display a partial block in lymphocyte differentiation"
      explanation: The heterozygous phenotype, which is the one comparable to the human disease.
  - target: Loss of IKAROS Lymphoid Tumor Suppression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The founding paper of this disease reads the abnormal lymphopoiesis of
      its patients as reminiscent of the early T-cell development
      abnormalities that raise leukemia risk in Plastic heterozygotes, and
      cites that strain for the comparison.
    limitations: >-
      The link rests on the human authors' comparison rather than on a
      leukemia phenotype reported for Plastic in the paper describing the
      strain, which reports a partial block in lymphocyte differentiation in
      heterozygotes and embryonic lethality in homozygotes. The allele is
      H191R in zinc finger 3, not N159 in zinc finger 2.
    evidence:
    - reference: PMID:29889099
      reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: "as they are reminiscent of the early T cell development abnormalities increasing the risk for T cell leukemia/lymphoma as seen in the Plastic/+ mice also carrying a dominant-negative heterozygous missense mutation"
      explanation: >-
        The comparison the founding authors draw to this strain, which is what
        connects it to the leukemia risk. The quoted clause describes the
        murine phenotype, established in work this paper cites rather than
        performed in it, so it is graded MODEL_ORGANISM and marked
        BACKGROUND.
- name: Ikaros DNA-binding-domain dominant heterozygous mouse
  species: Mouse
  genotype: Ikzf1 DNA-binding domain mutation, heterozygous
  publication: PMID:7585946
  description: >-
    A dominant Ikaros mutation in the DNA-binding domain. Homozygotes make no
    mature lymphocytes or their earliest progenitors; heterozygotes show
    augmented T-cell-receptor-driven thymocyte proliferation and autoproliferative
    peripheral T cells, then general lymphoproliferation, and all of them
    develop T-cell leukemia and lymphoma. The authors read the phenotype as
    showing distinct thresholds of Ikaros activity for proliferation control.
  evidence:
  - reference: PMID:7585946
    reference_title: A dominant mutation in the Ikaros gene leads to rapid development of leukemia and lymphoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our studies with mice heterozygous for this mutation establish the Ikaros gene as an essential regulator of T cell proliferation"
    explanation: >-
      Establishes the strain as informative for IKAROS control of lymphocyte
      proliferation, which is the node it is linked to.
  modeled_mechanisms:
  - target: Loss of IKAROS Lymphoid Tumor Suppression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      One dominant DNA-binding-domain allele is enough for lymphoid
      malignancy, which is the closest animal counterpart to the leukemia risk
      of this disease.
    limitations: >-
      The murine allele is not N159, and the phenotype is far more penetrant
      than the human one, where one of seven patients developed leukemia. The
      mouse transformation step involves loss of the remaining wild-type
      allele, which has not been examined in the human tumors, so the murine
      route to malignancy may not be the human one.
    evidence:
    - reference: PMID:7585946
      reference_title: A dominant mutation in the Ikaros gene leads to rapid development of leukemia and lymphoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A general lymphoproliferation precedes the T cell leukemia and lymphoma that rapidly develop in all heterozygotes."
      explanation: Lymphoid malignancy from a single dominant Ikaros DNA-binding-domain allele.
    - reference: PMID:7585946
      reference_title: A dominant mutation in the Ikaros gene leads to rapid development of leukemia and lymphoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The first step toward leukemic transformation occurs within the maturing thymocyte population and is demarcated by clonal expansions and loss of the single Ikaros wild-type allele."
      explanation: The murine transformation sequence, which the human tumors have not been tested for.
discussions:
- discussion_id: no_n159_knock_in_model
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Dominant-Negative Inhibition of Wild-Type IKAROS
  prompt: >-
    Does a heterozygous N159 knock-in reproduce the human disease, including the
    susceptibility to Pneumocystis, in an animal model?
  rationale: >-
    The dominant-negative mechanism rests on co-transfection of tagged proteins
    into cell lines and on immunophenotyping of patient cells, plus an
    organoid differentiation of patient progenitors. The animal evidence comes
    from other DNA-binding-domain alleles. PubMed searches for (Ikzf1 OR
    Ikaros) AND (knock-in OR knockin) AND (N159 OR "zinc finger 2" OR
    "DNA-binding domain") AND mice, and for IKZF1 N159S mouse model, run on
    2026-10-23, returned no records, so no model carries the human allele and
    the step from the molecular lesion to the multilineage disease is inferred
    from patients. Two near-misses exist and neither fills the gap. A
    DNA-binding-domain knock-in, Ikzf1 L132P in zinc finger 1, was shown to act
    by haploinsufficiency and gives a B-cell-restricted, CVID-like phenotype,
    so it models the sibling disease rather than this one. A knock-in of the
    AIOLOS residue paralogous to IKAROS N159, p.N160S, does reproduce a
    dominant-negative immunophenotype, but in a different gene.
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression levels and functional effects of mutant proteins IKZF1N159S and IKZF1N159T were assessed in patients’ cells as well as in vitro expression experiments."
    explanation: >-
      Names the evidence base for the mechanism, which is patient cells and

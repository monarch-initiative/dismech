- discussion_id: pneumocystis_susceptibility_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Susceptibility to Opportunistic and Recurrent Infection
  - phenotypes#Pneumocystis jirovecii pneumonia
  prompt: >-
    Which component of the immune defect accounts for the near-universal
    Pneumocystis pneumonia, when other organisms including live vaccine strains
    are handled normally?
  rationale: >-
    Pneumocystis pneumonia occurred in every reported patient, yet live viral
    and BCG vaccines and chickenpox caused no complications, so the
    susceptibility is selective and not explained by the overall severity of
    the immunodeficiency. The founding authors raised defective CD40 ligand
    upregulation under physiological stimulation and untested IL-21 signaling
    as candidates, by analogy with the other immunodeficiencies that carry
    Pneumocystis and Cryptosporidium risk, but CD40 ligand upregulation was
    normal in three of four patients tested and IL-21 signaling was not
    examined. The myeloid dendritic cell deficit is a further candidate they
    name for the cryptosporidial case.
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As CD40L expression was evaluated after standard PMA/ionomycin stimulation, we cannot exclude that under physiologic T cell activation conditions a more consistent CD40L upregulation defect could be unveiled (as shown with CD25) and therefore contribute to increased Pneumocystis and Cryptosporidium susceptibility."
    explanation: The authors' own statement that the basis of the susceptibility is unsettled.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, other microbes appeared to be better neutralized among IKZF1 N159S/T patients."
    explanation: Establishes that the infection susceptibility is selective, which is what makes the question sharp.

    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  molecular_functions:
  - preferred_term: IKAROS dimerization with wild-type IKAROS and AIOLOS
    term:
      id: GO:0046982
      label: protein heterodimerization activity
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant proteins IKZF1N159S and IKZF1N159T were able to dimerize with WT IKZF1"
    explanation: Co-immunoprecipitation showing that the DNA-binding mutant still dimerizes.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "At 25:75, 50:50, and 75:25 mutant/WT ratios, coexpression of IKZF1N159S or IKZF1N159T with WT IKZF1 showed a significant decrease in IKZF1 foci per nucleus, in comparison to the number of foci detected in cells transfected with WT IKZF1 alone"
    explanation: The co-transfection experiment that defines the dominant-negative effect.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, IKZF1N159S and IKZF1N159T can also exert a trans-dominant-negative effect on IKZF1 partners such as IKZF3."
    explanation: The interference extends to the family member AIOLOS.
  - reference: PMID:33691560
    reference_title: "Germline IKZF1 mutations and their impact on immunity: IKAROS-associated diseases and pathophysiology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "amino acid N159 mutations but not others exerted a dominant negative effect over WT IKAROS’ pericentromeric targeting"
    explanation: Review placing N159 variants alone in the dominant-negative class.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "IKZF1 functions primarily as a gene repressor by interacting with the NurD complex"
    explanation: Background for why the loss of pericentromeric targeting costs repressor activity.
  - reference: PMID:41424385
    reference_title: "IKAROS regulates human T cell phenotype at a thymic and postthymic level."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IKAROS LOF variants acting through DN, HI, or DD mechanisms exhibited significantly reduced suppression of HNRNPLL transcriptional activity when compared with WT IKAROS"
    explanation: Reporter assay in which the dominant-negative variants fail to repress an IKAROS target gene.

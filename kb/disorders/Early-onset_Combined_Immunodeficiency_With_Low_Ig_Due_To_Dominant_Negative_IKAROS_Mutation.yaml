- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Transplantation replaces the patient's hematopoiesis with donor cells that
    carry two wild-type IKZF1 alleles, and is the only treatment that addresses
    the defect itself. Four patients with dominant-negative variants were
    reported in a dedicated transplant series: all achieved more than 99% donor
    chimerism, one died of liver failure about a year afterwards following
    earlier cryptosporidial cholangitis, and the survivors came off
    immunoglobulin replacement and antimicrobial prophylaxis. Because
    functionally defective monocytes contribute to the T-cell defect, the
    founding authors warn that lymphoid engraftment alone or mixed chimerism
    may not be enough.

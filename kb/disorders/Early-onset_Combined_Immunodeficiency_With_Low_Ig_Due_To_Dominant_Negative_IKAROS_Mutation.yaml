- name: Autosomal dominant
  description: >-
    Heterozygous germline variants that arose de novo in the reported families.
    No asymptomatic carrier has been described, which the founding authors read
    as a highly or fully penetrant dominant disease while noting it cannot be
    formally assessed. Expressivity varies: lymphoid defects were constant,
    myeloid defects were not.

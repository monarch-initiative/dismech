- name: Loss of IKAROS Lymphoid Tumor Suppression
  biological_scale: CELLULAR
  description: >-
    IKAROS restrains lymphocyte proliferation, and mice heterozygous for a
    DNA-binding-domain mutation develop T-cell leukemia and lymphoma. One
    patient in the founding cohort developed T-cell acute lymphoblastic
    leukemia at thirteen years. The transcriptome of patient naive CD4+ T cells
    differs from that of healthy controls and of haploinsufficient patients,
    which the authors read as abnormal lymphopoiesis that may underlie the
    leukemia risk. Whether a further somatic hit is needed has not been
    reported.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "6 presented with a c.476A>G transition leading to an asparagine-to-serine change at amino acid 159 (p.N159S)"
      explanation: Identifies the allele and its frequency in the founding cohort.
    - reference: PMID:29889099
      reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

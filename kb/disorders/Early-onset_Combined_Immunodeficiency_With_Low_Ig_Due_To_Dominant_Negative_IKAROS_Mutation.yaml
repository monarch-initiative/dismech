      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "1 an A>C transversion leading to an asparagine-to-threonine change at the same site (p.N159T)"
      explanation: Identifies the second allele of this class.
    - reference: PMID:29889099
      reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."

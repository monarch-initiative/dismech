- name: Early B Cell Developmental Arrest
  biological_scale: CELLULAR
  description: >-
    Bone marrow examination in two patients showed an arrest at the earliest
    stages of B-cell development, with reduced pre-pro-B, pro-B and mature B
    cells, as in IKZF1 haploinsufficiency, but with plasma cells virtually
    absent as well. Peripheral B cells are strikingly reduced, and serum
    immunoglobulins of all major isotypes are low.

      id: CL:0002489
      label: double negative thymocyte
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
    modifier: DECREASED
  evidence:
  - reference: PMID:41424385
    reference_title: "IKAROS regulates human T cell phenotype at a thymic and postthymic level."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the ATO system, IKAROS-DN precursor cells were blocked at the CD4-CD8-/double-negative stage and retained a CD45RA+ phenotype, whereas IKAROS-HI cells inefficiently reached the CD4+CD8+/double-positive stage and partially transitioned from CD45RA to CD45RO."
    explanation: >-
      Organoid differentiation of patient progenitors, so the claim is about
      patient-derived cells in an in vitro system rather than about the thymus
      in vivo.
  downstream:
  - target: Increased naive T cells
    causal_link_type: DIRECT
- name: Impaired Memory T Cell Generation and T Cell Activation
  biological_scale: CELLULAR
  description: >-
    Most circulating T cells are naive and carry low-density CD45RA with a
    recent-thymic-emigrant phenotype, while central memory and effector memory
    cells are reduced. Patient T cells kept in culture after mitogen
    stimulation stay naive instead of becoming effector memory cells.
    Proliferation is poor in response to low-dose anti-CD3, to anti-CD3 plus
    anti-CD28 and to recall antigen, CD25 is not upregulated after
    stimulation and IL-2 does not rescue the defect, regulatory T cells are
    reduced, and production of interferon gamma, TNF, IL-4, IL-6 and IL-17A is
    impaired, so Th1, Th2 and Th17 polarization all fail. This naive-dominant
    picture is the opposite of the haploinsufficient and
    dimerization-defective classes, where memory cells accumulate.

    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow examination in patients C1 and D1 demonstrated a very early B cell development arrest with reduced pre-pro–B cells (CD34+cTdT+CD19+/–), pro-B cells (CD34+CD19+) and mature B cells (CD34–CD19+), as previously described in patients with IKZF1 haploinsufficiency"
    explanation: Bone marrow evidence for the stage of the B-cell arrest.
  - reference: PMID:32654692

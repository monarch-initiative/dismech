treatments:
- name: Pneumocystis Prophylaxis
  description: >-
    Trimethoprim-sulfamethoxazole, or another form of Pneumocystis
    prophylaxis, is recommended in this allele class because every reported
    patient had Pneumocystis pneumonia in the first two years of life. All
    reported patients received aggressive antimicrobial regimens from early in
    life. Prophylaxis does not touch the IKAROS defect, so it is attached to
    the infection phenotype rather than to a mechanism node.

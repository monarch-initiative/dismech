genetic:
- name: IKZF1
  gene_term:
    preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Disease-causing variants in this allele class are missense substitutions of
    asparagine 159, in zinc finger 2 of the N-terminal DNA-binding domain.
    Position within the domain does not by itself place a variant here: N159K
    at the same codon is haploinsufficient, and other DNA-binding-domain
    variants are haploinsufficient too, so a new variant needs a
    co-transfection assay against wild-type IKAROS before it is called
    dominant-negative. No gene_disease_validity is recorded, because ClinGen
    files its IKZF1 assertion against a broader IKAROS-related immunodeficiency
    term rather than against this disease.
  evidence:
  - reference: ORPHA:697414
    reference_title: "Early-onset combined immunodeficiency with low Ig due to dominant negative IKAROS mutation"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IKZF1 | IKAROS family zinc finger 1 | hgnc:13176 | Disease-causing germline mutation(s) in"
    explanation: Orphanet gene-disease association row.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we describe a new autosomal dominant CID caused by IKZF1N159S/T mutations found in 7 unrelated patients."
    explanation: Founding report establishing the N159S/T alleles as causal.
  - reference: PMID:41424385
    reference_title: "IKAROS regulates human T cell phenotype at a thymic and postthymic level."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients heterozygous for the N159S variant resulting in a DN effect presented with combined immunodeficiency (CID), whereas patients heterozygous for the N159K variant acting through HI presented with CVID."
    explanation: >-
      The disease follows the mechanism rather than the codon: N159K at the
      same residue is haploinsufficient and causes CVID, which is why that
      allele is outside this entry.
  variants:
  - name: IKZF1 p.N159S
    description: >-
      c.476A>G missense in zinc finger 2 of the DNA-binding domain, carried by
      six of the seven founding patients and absent from public exome
      databases. It abolishes DNA binding and has a stronger dominant-negative
      effect on wild-type foci formation than N159T.
    clinical_significance: PATHOGENIC
    evidence:

      evidence_source: IN_VITRO
      snippet: "the IKZF1N159S mutant exhibited a stronger dominant-negative effect on formation of foci than the IKZF1N159T, in accordance with the clinical and biological presentations of the IKZF1N159T patient, which are less pronounced"

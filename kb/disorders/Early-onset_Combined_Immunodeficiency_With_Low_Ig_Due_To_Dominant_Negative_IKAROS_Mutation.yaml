name: Early-onset Combined Immunodeficiency With Low Ig Due To Dominant Negative IKAROS Mutation
creation_date: "2026-10-23T15:00:00Z"
category: Mendelian
synonyms:
- Early-onset CID with low Ig due to dominant-negative IKAROS mutation
- Early-onset CID with low Ig due to dominant-negative IKZF1 mutation
- Dominant-negative IKZF1 combined immunodeficiency
- IKAROS deficiency, autosomal dominant dominant-negative
description: >-
  An autosomal dominant inborn error of immunity caused by heterozygous germline
  IKZF1 missense variants at asparagine 159 (p.N159S, p.N159T) in the second
  zinc finger of the IKAROS DNA-binding domain. The variants arose de novo in
  the reported families. The mutant protein is expressed and stable, cannot bind
  IKAROS target DNA, but still dimerizes with wild-type IKAROS and with AIOLOS,
  and in co-expression it reduces the number of pericentromeric
  heterochromatin foci the wild-type protein forms. This dominant-negative
  action separates
  the disease from haploinsufficient IKZF1 variants, which leave the wild-type
  allele working.


  Symptoms begin in infancy. Every reported patient had Pneumocystis jirovecii
  pneumonia before the age of two years, with invasive bacterial, severe viral
  and fungal infections in most. The defect spans T, B and myeloid lineages:
  profound hypogammaglobulinemia with absent or very low B cells and plasma
  cells; T cells that stay naive, fail to generate memory cells, respond poorly
  to low-strength T-cell receptor and IL-2 signals and do not polarize to Th1,
  Th2 or Th17; neutropenia, absent eosinophils, low myeloid dendritic cells, and
  monocytes that make little inflammatory cytokine after Toll-like receptor
  stimulation. One patient developed T-cell acute lymphoblastic leukemia.
  Autoimmunity has not been reported. Allogeneic hematopoietic stem cell
  transplantation is the curative option.


  The entry is scoped to the dominant-negative allele class at codon N159
  (N159S and N159T). The N159K variant at the same codon acts by
  haploinsufficiency and causes a CVID-like disease, so it belongs with the
  IKAROS subtype of Common_Variable_Immunodeficiency. The dimerization-defective
  class is curated as
  Combined_Immunodeficiency_Due_To_Dimerization_Defective_IKAROS_Mutation.

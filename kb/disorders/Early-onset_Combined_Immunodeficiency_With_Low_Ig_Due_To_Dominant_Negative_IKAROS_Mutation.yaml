      evidence_source: HUMAN_CLINICAL
      snippet: "patient G1, who carries the unique germline mutation resulting in IKZF1N159T, showed normal although progressively declining B cell numbers with only a naive phenotype"
      explanation: Milder B-cell phenotype in the single N159T patient.
pathophysiology:
- name: IKZF1 N159 Variant Abolishes IKAROS DNA Binding
  biological_scale: MOLECULAR
  description: >-
    Asparagine 159 lies at a DNA-contacting position of zinc finger 2, one of
    the four N-terminal zinc fingers that make up the IKAROS DNA-binding
    domain. The N159S and N159T proteins are expressed at normal levels in
    patient cells and are stable in transfected cells, but neither binds the
    pericentromeric gamma-satellite sequence nor an IKAROS consensus site in
    gel-shift assays. The gel-shift panel included a third mutant, the
    previously described haploinsufficient R162Q, as a comparator, which is why
    the quoted sentence names three.
  genes:
  - preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1
  molecular_functions:
  - preferred_term: IKAROS sequence-specific DNA binding
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
    modifier: DECREASED
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All proteins were found to be expressed at similar levels, indicating that N159S and N159T mutants are expressed and stable"
    explanation: >-
      The mutant protein is present in transfected cells, so the defect is
      functional rather than a loss of protein.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No protein expression differences were noticed between cells from patients and healthy controls."
    explanation: The same holds in patient cells, measured by flow cytometry and immunoblot.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "None of the 3 mutant proteins were able to bind to γ-Sat8 or IK-bs4, and 40%–50% reduction in binding was evidenced in the 50:50 mutant/WT protein combination tested"
    explanation: >-
      Gel-shift assay showing loss of DNA binding by the mutant. The partial
      reduction in the mixed condition is not read here as interference: the
      haploinsufficient R162Q comparator in the same panel behaves the same
      way, and the dominant-negative effect is established by the separate
      foci-counting experiment cited on the next node.
  downstream:
  - target: Dominant-Negative Inhibition of Wild-Type IKAROS
    causal_link_type: DIRECT
    description: >-
      A protein that cannot bind DNA but keeps its dimerization domain pairs
      with wild-type IKAROS and holds it away from its chromatin targets.
    evidence:
    - reference: PMID:29889099
      reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data demonstrate that IKZF1N159S and IKZF1N159T mutant proteins are expressed, and can dimerize and migrate to the nucleus, where they exert a dominant-negative effect on WT IKZF1, in terms of formation of foci within the nucleus"
      explanation: Links the DNA-binding lesion of a dimerization-competent mutant to its effect on the wild-type protein.
- name: Dominant-Negative Inhibition of Wild-Type IKAROS
  biological_scale: MOLECULAR
  description: >-
    The mutant dimerizes with wild-type IKAROS and reaches the nucleus, and
    when the two are co-expressed at mutant to wild-type ratios from 25:75 to
    75:25 the number of wild-type IKAROS foci per nucleus falls, which a
    haploinsufficient mutant does not cause. The same interference is seen on
    AIOLOS. IKAROS represses its targets at pericentromeric heterochromatin
    through the NuRD complex, and in a reporter assay the dominant-negative
    variants fail to repress the IKAROS target HNRNPLL, so the result is a loss
    of IKAROS activity deeper than the half dose of haploinsufficiency. The
    authors propose that the mutant retains weak DNA binding with altered
    specificity, which would explain how it drags its partners off target, but
    that model is not established.
  genes:
  - preferred_term: IKZF1
    term:
      id: hgnc:13176
      label: IKZF1

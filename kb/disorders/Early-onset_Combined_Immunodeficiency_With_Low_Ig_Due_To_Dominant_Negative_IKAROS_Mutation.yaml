    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, in opposition to the HI patients, plasma cells were virtually absent, suggesting an earlier in life and more severe B-cell maturation arrest in patients carrying IKZF1 DN mutations"
    explanation: The plasma-cell loss that distinguishes this class from haploinsufficiency.

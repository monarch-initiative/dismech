- name: Susceptibility to Opportunistic and Recurrent Infection
  biological_scale: ORGANISM
  description: >-
    The combined lymphoid and myeloid defect leaves patients unable to control
    opportunistic organisms. Pneumocystis jirovecii pneumonia occurred in every
    reported patient between six and twenty-four months of age, and most also
    had invasive bacterial respiratory infection, severe or recurrent viral
    infection, or fungal infection. The susceptibility is not uniform: live
    viral and BCG vaccines were given without complication, and chickenpox ran
    an uncomplicated course, which the authors attribute to preserved
    proliferation under strong stimulation and to normal interferon responses.
  evidence:
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other infectious complications included invasive bacterial respiratory tract infections in 6 patients, severe or recurrent viral infections in 5, superficial or invasive fungal infections in 4, and liver cryptosporidiosis associated with sclerosing cholangitis and secondary cirrhosis in 1 patient (A1)."
    explanation: The infection spectrum beyond Pneumocystis.
  - reference: PMID:29889099
    reference_title: "Dominant-negative IKZF1 mutations cause a T, B, and myeloid cell combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This residual proliferation capacity upon stronger stimulation might be sufficient to control certain infections."
    explanation: The authors' account of why some organisms are handled normally.
  downstream:

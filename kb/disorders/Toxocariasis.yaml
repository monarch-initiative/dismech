infectious_agent:
- name: Toxocara canis
  description: >-
    The dog roundworm, the principal cause of human toxocariasis; dogs are its
    definitive host and the main reservoir for human infection.
  infectious_agent_term:
    preferred_term: Toxocara canis
    term:
      id: NCBITaxon:6265
      label: Toxocara canis
  evidence:
  - reference: PMID:32381218
    reference_title: Global prevalence of Toxocara infection in dogs.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dogs serve as the most important definitive hosts for Toxocara canis-a causative agent of human toxocariasis and one of the most widespread zoonotic helminth worldwide."
    explanation: Identifies T. canis (dog definitive host) as a cause of human toxocariasis.
- name: Toxocara cati
  description: >-
    The cat roundworm, a second cause of human toxocariasis producing a
    clinically indistinguishable illness.
  infectious_agent_term:
    preferred_term: Toxocara cati
    term:
      id: NCBITaxon:6266
      label: Toxocara cati
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Human toxocariasis is a worldwide zoonotic helminthiasis caused by infection with Toxocara canis or Toxocara cati larvae."
    explanation: Names T. canis and T. cati larvae as the agents of human toxocariasis.
transmission:
- name: Faecal-oral transmission (ingestion of embryonated eggs)
  description: >-
    Humans acquire infection mainly by swallowing embryonated Toxocara eggs from
    contaminated soil, hands or unwashed produce, and also by eating larvae in
    raw or undercooked tissue of paratenic hosts (e.g. cow liver).
  evidence:
  - reference: PMID:28781085
    reference_title: Human toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These parasites are usually directly transmitted to the human host via the faecal-oral route and can cause toxocariasis and associated complications, including allergic and neurological disorders."
    explanation: Establishes faecal-oral transmission and the allergic/neurological complications.
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most frequently, humans become infected by ingesting embryonated eggs present in nearby soil"
    explanation: Soil-borne embryonated eggs are the usual infection route.
agent_life_cycle:
  description: >-
    Toxocara completes its cycle in canid or felid definitive hosts, whose gut
    adult worms shed eggs that embryonate in soil. Humans (and other paratenic
    hosts) are dead-end hosts: ingested larvae migrate through the tissues but
    cannot mature to adults, so no eggs are produced and person-to-person
    transmission does not occur.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: accidental paratenic (dead-end) host
  - preferred_term: dog
    term:
      id: NCBITaxon:9615
      label: Canis lupus familiaris
    role: definitive host and principal reservoir (T. canis)
  - preferred_term: cat
    term:
      id: NCBITaxon:9685
      label: Felis catus
    role: definitive host (T. cati)
pathophysiology:
- name: Ingestion and Intestinal Larval Hatching
  biological_scale: TISSUE
  description: >-
    Swallowed embryonated eggs (or larvae in raw paratenic-host tissue) release
    larvae that hatch in the small intestine, penetrate the intestinal wall and
    enter the portal and systemic circulation, reaching the liver and then the
    lungs.
  downstream:
  - target: Arrested Somatic Migration and TES Antigen Release
    description: Larvae that cross the gut wall disseminate through the tissues.
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the duodenum, larvae hatch from embryonated eggs or are released from animal tissues during the digestion process, penetrate the gut wall and migrate to the liver via the portal veins."
    explanation: Larvae hatch in the duodenum, penetrate the gut wall and migrate to the liver.
- name: Arrested Somatic Migration and TES Antigen Release
  biological_scale: ORGANISM
  description: >-
    In humans, a non-definitive paratenic host, the larvae cannot complete their
    life cycle; they undergo prolonged somatic migration through liver, lung,
    eye and brain and persist in the tissues, continuously releasing
    excretory-secretory (TES) antigens that provoke the host response. This is
    the step that produces the systemic and organ-specific disease.
  downstream:
  - target: Type 2 Eosinophilic Response
    description: Persistent TES antigen drives a type 2, eosinophil-rich response.
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A large proportion of larvae enters a state of dormancy (hypobiosis) and can remain viable for several years"
    explanation: Larvae cannot mature and persist dormant in the tissues for years.
- name: Type 2 Eosinophilic Response
  biological_scale: ORGANISM
  description: >-
    The persistent larval TES antigens drive a type 2 (Th2/IgE) immune
    response with eosinophilia, the basis of the allergic manifestations and the
    eosinophilic inflammation that follows. Blood eosinophilia is a constant
    feature of visceral larva migrans.
  biological_processes:
  - preferred_term: type 2 immune response
    modifier: INCREASED
    term:
      id: GO:0042092
      label: type 2 immune response
  - preferred_term: eosinophil activation
    modifier: INCREASED
    term:
      id: GO:0043307
      label: eosinophil activation
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  downstream:
  - target: Eosinophilia
    description: The type 2 response drives blood eosinophilia.
  - target: Asthma
    description: Airway type 2 inflammation is epidemiologically associated with childhood asthma.
  - target: Eosinophilic Granulomatous Tissue Injury
    description: The eosinophilic response forms granulomatous inflammation around larvae.
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Blood eosinophilia, although not specific to toxocariasis, has been constantly associated with VLM."
    explanation: Blood eosinophilia is the constant human marker of the type 2 response in visceral larva migrans.
- name: Eosinophilic Granulomatous Tissue Injury
  biological_scale: TISSUE
  description: >-
    Eosinophil-rich, granulomatous inflammation forms around the migrating or
    dead larvae, injuring tissue and producing the organ-specific disease:
    visceral larva migrans (fever, hepatic lesions), ocular toxocariasis (a
    retinochoroidal granuloma with tractional retinal detachment), and
    neurotoxocariasis (eosinophilic meningoencephalitis, with an
    epidemiological link to epilepsy).
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Fever
    description: Visceral larva migrans presents with fever.
  - target: Hepatomegaly
    description: Hepatic larval migration and granulomas enlarge the liver in VLM.
  - target: Abdominal pain
    description: Hepatic/visceral larval migration causes abdominal pain in VLM.
  - target: Cough
    description: Pulmonary larval migration causes cough in VLM.
  - target: Wheezing
    description: Pulmonary larval migration causes wheezing in VLM.
  - target: Retinal detachment
    description: Ocular granuloma causes tractional retinal detachment.
  - target: Visual loss
    description: The ocular granuloma causes visual loss in ocular toxocariasis.
  - target: Infectious encephalitis
    description: CNS invasion produces eosinophilic meningoencephalitis.
  - target: Myelitis
    description: CNS invasion produces myelitis, the commonest neurotoxocariasis form.
  - target: Seizure
    description: Neurotoxocariasis is epidemiologically associated with epilepsy.
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Others become entrapped inside granulomas and subsequently destroyed by the host’s immunological response against soluble larval antigens of excretory–secretory origin (TES Ag)"
    explanation: Larvae are entrapped in eosinophil-rich granulomas and attacked via the host response to TES antigens.

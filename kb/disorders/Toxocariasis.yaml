prevalence:
- population: Worldwide (anti-Toxocara seroprevalence, 71 countries)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 19000.0
  notes: >-
    Global anti-Toxocara seroprevalence (exposure marker, not clinical disease):
    19.0% across 250 studies and 265,327 people; highest in Africa (37.7%),
    lowest in the Eastern Mediterranean (8.2%).
  evidence:
  - reference: PMID:31856156
    reference_title: "Seroprevalence estimates for toxocariasis in people worldwide: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated global T-seroprevalence rate was 19.0% (95%CI, 16.6-21.4%; 62,927/265,327)"
    explanation: Global seroprevalence estimate marking human exposure.
environmental:
- name: Soil contaminated with embryonated Toxocara eggs
  description: >-
    Toxocara eggs shed by dogs and cats embryonate in soil; public places are
    heavily contaminated worldwide, the main environmental source of human
    infection.
  evidence:
  - reference: PMID:30142562
    reference_title: Toxocara eggs in public places worldwide - A systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The pooled global prevalence of Toxocara eggs in public places was 21% (95% CI, 16-27%; 13,895/42,797)."
    explanation: Quantifies the environmental soil reservoir driving exposure.
treatments:
- name: Anthelmintic therapy with corticosteroids
  description: >-
    Albendazole is the drug of choice (a benzimidazole that inhibits larval
    beta-tubulin), with corticosteroids added to limit the inflammatory and
    ocular damage; anthelmintic efficacy in ocular and neurological disease is
    not well established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albendazole
      term:
        id: CHEBI:16664
        label: albendazole
    - preferred_term: mebendazole
      term:
        id: CHEBI:6704
        label: mebendazole
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "albendazole has become the drug of choice"
    explanation: Albendazole is the first-line anthelmintic for toxocariasis.
  - reference: PMID:27084369
    reference_title: "Neurotoxocariasis: a systematic literature review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The two most commonly used drugs were corticosteroids (72 %) and/or albendazole (68 %)"
    explanation: Corticosteroids and albendazole are the mainstay drugs (neurotoxocariasis series).
diagnosis:
- name: Toxocara serology (TES-antigen ELISA)
  description: >-
    Humans harbour no adult worms and larvae are rarely recovered, so diagnosis
    rests on the clinical picture, eosinophilia, and serology by TES-antigen
    ELISA with Western blot confirmation (which cannot by itself distinguish
    current from past infection), supported by imaging for hepatic, ocular or
    cerebral lesions.
  diagnosis_term:
    preferred_term: serologic testing (TES-antigen ELISA)
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:35208697
    reference_title: Therapy and Prevention for Human Toxocariasis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The most common immunodiagnostic test is the enzyme-linked immunosorbent assay (ELISA) with TES Ag"
    explanation: TES-antigen ELISA is the standard immunodiagnostic test.

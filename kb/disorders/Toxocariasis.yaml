name: Toxocariasis
creation_date: "2026-11-25T00:00:00Z"
category: Infectious Disease
disease_term:
  preferred_term: toxocariasis
  term:
    id: MONDO:0005988
    label: toxocariasis
synonyms:
- toxocarosis
- Toxocara infection
- visceral larva migrans
- ocular larva migrans
- neurotoxocariasis
description: >-
  A zoonotic helminthiasis caused by infection with the larvae of the roundworms
  Toxocara canis (dog) and Toxocara cati (cat). Humans are accidental paratenic
  hosts infected by swallowing embryonated eggs from soil, hands or produce, or
  by eating larvae in raw paratenic-host tissue; the larvae hatch in the gut,
  penetrate the wall and migrate through the tissues but cannot mature to adult
  worms, so they persist and continuously shed excretory-secretory (TES)
  antigens. This drives a type 2, eosinophil-rich response and eosinophilic
  granulomatous inflammation around the migrating or dead larvae, giving the
  recognized clinical forms: visceral larva migrans (fever, hepatic lesions,
  eosinophilia), ocular toxocariasis (a retinochoroidal granuloma with
  tractional retinal detachment and vision loss), covert/common toxocariasis
  (wheeze, abdominal pain), and neurotoxocariasis (eosinophilic
  meningoencephalitis, with an epidemiological link to epilepsy). Most infection
  is asymptomatic; management is albendazole with corticosteroids.
notes: >-
  Both Toxocara canis and T. cati cause a clinically indistinguishable illness
  and are bound as agents; T. canis (the dog roundworm) is the principal and
  best-characterised. Many mechanistic details (the Th2/IgE polarisation, cerebral
  larval persistence) are established in mice and inferred for humans; human
  associations with asthma and epilepsy are epidemiological (case-control /
  cross-sectional), so causality is not established and is stated as association.
  The systemic-response node conforms to the
  helminth_larval_migration_type2_response module (its central Type 2 Immune
  Response node); that conforms_to link is added in a follow-up once the module
  is on main, because the anchor is gated by a hard foreign-key test.

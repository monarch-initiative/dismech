name: Birk-Landau-Perez Syndrome
creation_date: "2026-11-18T11:48:17Z"
category: Mendelian
description: >-
  Birk-Landau-Perez syndrome (BILAPES) is an autosomal recessive cerebro-renal disorder caused by
  biallelic variants in SLC30A9, which encodes the zinc transporter ZnT-9. Children develop normally
  for the first one to two years and then regress, losing speech and motor skills and going on to
  severe intellectual disability, a progressive hyperkinetic movement disorder, profound ataxia,
  oculomotor apraxia, ptosis and camptocormia. The founding Bedouin kindred also had early-onset
  tubulointerstitial nephropathy with hypertension and a tendency to hyperkalemia, but a later
  series of eight patients from four families had the same neurological disease with no severe renal
  impairment, so the renal arm is variable rather than obligatory. Hearing loss and cerebellar
  atrophy are reported in some families and absent in others. How the transport defect injures
  neurons is unsettled: the founding study measured lower cytosolic zinc in mutant cells, whereas
  later work on SLC30A9 as a mitochondrial zinc exporter describes zinc accumulation and
  mitochondrial stress. Both readings are recorded here.

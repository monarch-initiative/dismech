    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebro-renal syndromes have mostly been defined based on the co-existence of other organs
      involved, such as the eyes in Lowe syndrome
    explanation: States how cerebro-renal syndromes are told apart.
discussions:
- discussion_id: kg_bilapes_zinc_direction
  prompt: >-
    Does the disease-causing SLC30A9 defect raise or lower zinc in the compartments that matter, and
    in which compartment does the injury to neurons actually occur?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Defective SLC30A9-Dependent Zinc Transport
  - pathophysiology#Disturbed Intracellular Zinc Homeostasis
  - mechanistic_hypotheses#slc30a9_cytosolic_zinc_depletion
  - mechanistic_hypotheses#slc30a9_mitochondrial_zinc_accumulation
  rationale: >-
    The founding study localised SLC30A9 to an endoplasmic-reticulum-associated vesicular
    compartment and measured lower cytosolic zinc in mutant cells. Later work treats the protein as a
    mitochondrial zinc exporter whose loss causes zinc accumulation and mitochondrial stress in
    worms and human cell lines. These point in opposite directions and neither has been tested in
    patient neurons or kidney. Until it is resolved the mechanism cannot be stated with a direction,
    and no rational intervention on zinc handling can be proposed.
  evidence:
  - reference: PMID:37576556
    reference_title: "Case report: Birk-Landau-Perez syndrome linked to the SLC30A9 gene-identification of additional cases and expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The exact molecular mechanism behind the BILAPES syndrome is not delineated, but it is inferred
      that the loss of mitochondrial function in neurons underlies the cerebro–renal phenotype
    explanation: The source states directly that the mechanism is undetermined.
notes: >-
  Around seventeen patients have been reported across seven families, so no frequency values are
  recorded. The founding Bedouin kindred had six, a non-consanguineous proband and a second Middle
  Eastern family added three, and a four-family series added eight.

  The renal arm is not obligatory. Four of the six founding patients had nephropathy and none of the
  eight in the later series had severe renal impairment, which is why the entry carries a REFUTE
  evidence item on the nephropathy node rather than presenting the renal lesion as a constant
  feature. The MONDO label still names nephropathy as part of the concept.

  The entry is named Birk-Landau-Perez Syndrome rather than taking the MONDO label, which is a
  four-part description of features rather than a name anyone uses. BILAPES and the MONDO label are
  both in synonyms. OMIM 617595 uses the eponym.

  No GeneReviews chapter covers this disease, by disease name or through SLC30A9.

  The founding study tested and excluded the previously proposed Wnt-signalling mechanism in the
  same experiments that implicated zinc transport. That negative result is recorded as evidence on
  the cytosolic-depletion hypothesis rather than left out, because it is what moved the field to the
  transport account.

  Spasticity is not a feature of the founding kindred, and a secondhand summary says otherwise.
  PMID:34716203 lists spasticity among the findings of the six founding patients, but the founding
  report itself records that deep tendon reflexes were normal in all of them with no abnormal
  pyramidal signs, and spasticity is a pyramidal sign. The restatement is kept on the phenotype as
  an INDIRECT item with that discrepancy written into its explanation, rather than removed, because
  a reader who meets the same summary elsewhere needs to know it conflicts with the primary source.
  The phenotype itself is carried by a later series, which reports mild lower-limb spasticity in one
  patient and explicitly none in two others, so no frequency is recorded. This is the second claim in
  this entry traced to the same secondhand summary; the hearing-loss claim was corrected the same way.

  Nystagmus is not recorded. It is reported for this syndrome elsewhere, but the word does not
  appear in any of the three cached primary papers (PMID:28334855, PMID:34716203, PMID:37041080),
  so there is no quotable sentence to attach and the phenotype is left out rather than asserted
  from a summary.

    - reference: CGGV:assertion_f068a626-3d4b-47dd-94f9-d7ac8430274f-2025-03-14T160000.000Z
      reference_title: SLC30A9 / psychomotor regression-oculomotor apraxia-movement disorder-nephropathy syndrome (Definitive)
      supports: SUPPORT

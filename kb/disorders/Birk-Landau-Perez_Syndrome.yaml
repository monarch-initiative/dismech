  biological_scale: MOLECULAR
  description: >-
    A homozygous or compound heterozygous SLC30A9 variant. The founding in-frame deletion sits in
    the highly conserved cation efflux domain, where protein modelling predicts disruption of the
    transmembrane helix structure.

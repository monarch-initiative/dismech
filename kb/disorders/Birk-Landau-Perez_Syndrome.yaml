  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel autosomal recessive cerebro-renal syndrome was identified in consanguineous Bedouin
      kindred: neurological deterioration was evident as of early age, progressing into severe
      intellectual disability, profound ataxia, camptocormia and oculomotor apraxia.
    explanation: The founding report establishes autosomal recessive inheritance.
  - reference: PMID:34716203
    reference_title: Autosomal recessive SLC30A9 variants in a proband with a cerebrorenal syndrome and no parental consanguinity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this research report, we present a female proband with two distinct, inherited autosomal
      recessive loss-of-function SLC30A9 variants from unrelated parents.
    explanation: Compound heterozygosity in a non-consanguineous family.

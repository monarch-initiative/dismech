- name: Progressive Neuronal Dysfunction and Regression
  biological_scale: ORGANISM
  description: >-
    Children reach normal milestones for the first one to two years and then deteriorate, starting
    with speech delay and motor regression and progressing to severe intellectual disability, a
    hyperkinetic movement disorder, ataxia and oculomotor signs. Brain MRI was normal in the
    founding kindred; cerebellar atrophy appears in a later family.
  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals were born at term, following uneventful pregnancies and normal birth
      weights, reaching normal neurodevelopmental milestones by the age of 1–2 years, but then
      started to deteriorate, with first signs of abnormality evident in speech delay and motor
      regression.
    explanation: Establishes the normal-then-regressing course that defines the disease.

- name: Tubulointerstitial Nephropathy
  biological_scale: TISSUE
  description: >-
    Early-onset chronic tubulointerstitial nephritis on biopsy, without cysts or tubular dilatation,
    with hypertension and a tendency to hyperkalemia. It affected four of the six founding patients
    and none of the eight in the later series, so it is a variable feature of the syndrome rather
    than a required one.
  cell_types:
  - preferred_term: kidney tubule cell
    term:
      id: CL:1000507
      label: kidney tubule cell
  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four of the six affected individuals also had early-onset nephropathy with features of
      tubulo-interstitial nephritis, hypertension and tendency for hyperkalemia, though none had
      rapid deterioration of renal function.
    explanation: Describes the renal lesion and already shows it is not present in every patient.
  - reference: PMID:37041080
    reference_title: Clinical Phenotype in Individuals With Birk-Landau-Perez Syndrome Associated With Biallelic SLC30A9 Pathogenic Variants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite phenotypic variability between the 4 families, all affected patients manifested with a
      progressive hyperkinetic movement disorder, associated with oculomotor apraxia and ptosis. None
      had evidence of severe renal impairment.
    explanation: >-
      Refutes the renal lesion as an obligatory feature: eight patients from four families had the
      neurological disease without severe renal impairment.
  downstream:
  - target: Tubulointerstitial nephritis
    causal_link_type: DIRECT
  - target: Hypertension
    causal_link_type: DIRECT
  - target: Hyperkalemia
    causal_link_type: DIRECT
  - target: Hyperechogenic kidneys
    causal_link_type: DIRECT

  notes: >-
    SLC30A9 encodes ZnT-9, a member of the SLC30 zinc transporter family. Reported alleles are
    missense, in-frame deletion, frameshift and one synonymous change shown by cDNA analysis to
    affect splicing. The founding variant p.Ala350del falls in the conserved cation efflux domain.
    ClinGen rates SLC30A9 Definitive for this disease, which is this entry's own disease_term, so
    relationship_type CAUSATIVE matches the schema's definition of that value rather than merely
    being defensible.
  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing identified a single mutation in SLC30A9 within this locus, segregating
      as expected within the kindred and not found in a homozygous state in 300 Bedouin controls.
    explanation: Identifies SLC30A9 as the causative gene with segregation and control data.
  variants:
  - name: p.Ala350del
    description: >-
      In-frame three-base-pair deletion c.1049_1051delCAG, the founding Bedouin allele, later found
      again in an unrelated consanguineous Middle Eastern family and in four siblings of a third
      family.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37576556
      reference_title: "Case report: Birk-Landau-Perez syndrome linked to the SLC30A9 gene-identification of additional cases and expansion of the phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing detected a homozygous in-frame deletion c.1049_1051delCAG (p.Ala350del)
        in the SLC30A9 gene, which was the same variant detected in the patients from the primary
        literature report and the variant segregated with disease in the family.
      explanation: Independent recurrence of the founding allele with segregation.
  - name: p.Gly418Val
    description: >-
      Missense variant c.1253G>T found homozygous in two unrelated Pakistani families, one
      consanguineous and one not, which suggests a founder allele.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37041080
      reference_title: Clinical Phenotype in Individuals With Birk-Landau-Perez Syndrome Associated With Biallelic SLC30A9 Pathogenic Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 2 unrelated families of Pakistani origin (1 consanguineous and 1 not), the same homozygous
        missense variant in SLC30A9 (c.1253G>T, p.Gly418Val) was identified.
      explanation: Reports the recurrent missense allele in two unrelated families.
  - name: p.Ser471=
    description: >-
      Synonymous change c.1413A>G, carried in trans with a frameshift allele. cDNA analysis confirmed
      an effect on splicing, so a synonymous call here is not benign by default.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37041080
      reference_title: Clinical Phenotype in Individuals With Birk-Landau-Perez Syndrome Associated With Biallelic SLC30A9 Pathogenic Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        For the synonymous variant p.Ser471=, an effect on splicing was confirmed through cDNA
        analysis.
      explanation: Splicing effect demonstrated for a synonymous variant.
mechanistic_hypotheses:
- hypothesis_group_id: slc30a9_cytosolic_zinc_depletion
  hypothesis_label: Cytosolic Zinc Depletion Model
  status: CANONICAL
  description: >-
    The founding study placed SLC30A9 in an endoplasmic-reticulum-associated vesicular compartment
    and measured lower cytosolic zinc in cells overexpressing the mutant than the wild-type protein,
    concluding that the disease works through defective zinc transport by SLC30A9 rather than
    through its earlier-proposed role in Wnt signalling, which the same study tested and excluded.
  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cytosolic Zn2+ measurements in HEK293 cells overexpressing wild-type and mutant SLC30A9 showed
      lower zinc concentration within mutant rather than wild-type SLC30A9 cells.
    explanation: The measurement this model rests on.
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, using dual-luciferase reporter assay in SH-SY5Y cells we showed that Wnt signalling
      was not affected by the mutation.
    explanation: Excludes the competing Wnt-signalling account in the same study.
- hypothesis_group_id: slc30a9_mitochondrial_zinc_accumulation
  hypothesis_label: Mitochondrial Zinc Accumulation Model
  status: EMERGING
  description: >-
    Later work treats SLC30A9 as a mitochondrial zinc exporter required for mitochondrial integrity,
    and finds that losing it causes zinc to accumulate with a swollen mitochondrial matrix,
    reductive stress and a mitochondrial stress response. This points the opposite way to the
    founding measurement, which found less cytosolic zinc rather than more. The two have not been
    reconciled in the sources curated here, and the mechanism of the human disease is explicitly
    described as not delineated.
  evidence:
  - reference: PMID:37576556
    reference_title: "Case report: Birk-Landau-Perez syndrome linked to the SLC30A9 gene-identification of additional cases and expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Loss of SLC30A9 function in Caenorhabditis elegans and human cells leads to Zn2+ accumulation,
      swollen mitochondrial matrix, reductive stress, mitochondrial stress response, and shortened
      life span
    explanation: >-
      States the accumulation and mitochondrial-stress reading of SLC30A9 loss. The quoted sentence
      spans a worm model and human cell lines in one clause, so it carries both a model-organism and
      an in vitro source; it is graded IN_VITRO for the human cell work and the worm half is named
      here rather than split into a second item quoting the same clause.
  - reference: PMID:37576556
    reference_title: "Case report: Birk-Landau-Perez syndrome linked to the SLC30A9 gene-identification of additional cases and expansion of the phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The exact molecular mechanism behind the BILAPES syndrome is not delineated, but it is inferred
      that the loss of mitochondrial function in neurons underlies the cerebro–renal phenotype
    explanation: >-
      States plainly that the human mechanism is undetermined and that the mitochondrial account is
      an inference.

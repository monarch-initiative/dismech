- name: Other cerebro-renal syndromes
  description: >-
    Lowe syndrome, mitochondrial cytopathies, Zellweger syndrome and EAST syndrome all pair brain
    and kidney involvement, and are separated by the additional organ involved and the type of renal
    lesion.
  distinguishing_features:
  - Eye involvement in Lowe syndrome, muscle in mitochondrial cytopathy, liver in Zellweger syndrome.
  - A distinctive tubulopathy in EAST syndrome.
  evidence:

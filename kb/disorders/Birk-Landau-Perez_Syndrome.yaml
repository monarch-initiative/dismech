- name: Defective SLC30A9-Dependent Zinc Transport
  biological_scale: MOLECULAR
  description: >-
    Zinc handling by SLC30A9 is disturbed. Which way the disturbance runs is the open question
    recorded in the two hypothesis groups: the founding study measured less cytosolic zinc in mutant
    cells, while later work on SLC30A9 as a mitochondrial exporter describes zinc accumulation.
  molecular_functions:
  - preferred_term: zinc ion transmembrane transporter activity
    term:
      id: GO:0005385
      label: zinc ion transmembrane transporter activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This suggests that SLC30A9 has zinc transport properties affecting intracellular zinc
      homeostasis, and that the molecular mechanism of the disease is through defective function of
      this novel activity of SLC30A9 rather than by a defect in its previously described role in
      transcriptional activation of Wnt signalling.
    explanation: States that the disease mechanism runs through the zinc transport activity.
  downstream:
  - target: Disturbed Intracellular Zinc Homeostasis
    causal_link_type: DIRECT
    hypothesis_groups:
    - slc30a9_cytosolic_zinc_depletion
    - slc30a9_mitochondrial_zinc_accumulation
- name: Disturbed Intracellular Zinc Homeostasis
  biological_scale: CELLULAR
  description: >-
    Zinc is a structural, catalytic and regulatory cofactor across the proteome, so disordered
    intracellular zinc affects many processes at once. SLC30A9 is expressed everywhere, highest in
    cerebellum, skeletal muscle, thymus and kidney, which is consistent with a disease that falls on
    brain and kidney.
  biological_processes:
  - preferred_term: intracellular zinc ion homeostasis
    term:
      id: GO:0006882
      label: intracellular zinc ion homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:28334855
    reference_title: SLC30A9 mutation affecting intracellular zinc homeostasis causes a novel cerebro-renal syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed that SLC30A9 (solute carrier family 30 member 9; also known as ZnT-9) is ubiquitously
      expressed with high levels in cerebellum, skeletal muscle, thymus and kidney.
    explanation: >-
      The expression pattern that makes brain and kidney the tissues where the transport defect is
      felt.
  downstream:

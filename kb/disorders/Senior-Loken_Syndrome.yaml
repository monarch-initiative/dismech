      (2.9%), and WDR19 (2.9%).
    explanation: >-
      Identifies NPHP4 as one of the five genes carrying biallelic variants in a
      molecularly solved Senior-Loken syndrome case series, and quantifies its
      share of that cohort.
  - reference: PMID:36990420
    reference_title: "Pathogenic Variants in CEP290 or IQCB1 Cause Earlier-Onset Retinopathy in Senior-Loken Syndrome Compared to Those in INVS, NPHP3, or NPHP4."

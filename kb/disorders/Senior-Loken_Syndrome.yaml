      id: MONDO:0011755
      label: senior-loken syndrome 3
  description: >-
    NPHP3-related Senior-Loken syndrome. NPHP3 encodes nephrocystin-3, a
    component of the nephronophthisis protein network that interacts with
    inversin at the ciliary Inv compartment. NPHP3 was originally defined as the
    adolescent nephronophthisis locus on chromosome 3q, and the SLSN3 designation
    denotes the renal-retinal form linked to that locus. The gene attribution
    here rests on the literature rather than on MONDO: MONDO:0011755 carries
    neither a textual definition naming a gene nor a causal-gene OWL axiom, and
    the separate NPHP3 gene class MONDO:0011456 nephronophthisis 3 is filed under
    nephronophthisis rather than under Senior-Loken syndrome. That
    isolated-nephronophthisis concept is bound on the NPHP3-related row of
    kb/disorders/Nephronophthisis.yaml; this row is the renal-retinal form.

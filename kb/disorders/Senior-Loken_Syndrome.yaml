  description: >-
    NPHP4-related Senior-Loken syndrome. NPHP4 encodes nephrocystin-4 (HGNC
    alias name nephroretinin; HGNC also carries SLSN4 as an alias symbol for this
    gene), which forms a complex with nephrocystin-1 at the ciliary transition
    zone and interacts with RPGR and RPGRIP1, which has been proposed as the link
    to retinal degeneration in NPHP4 patients. NPHP4 accounts for a small minority
    of molecularly solved Senior-Loken syndrome. In the case series cited below,
    patients carrying INVS, NPHP3 or NPHP4 variants developed nephropathy before
    retinopathy, the reverse of the CEP290 and IQCB1 order; that finding is
    reported for the three genes together rather than for NPHP4 alone.

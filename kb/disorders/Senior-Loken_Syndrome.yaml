  description: >-
    TRAF3IP1-related Senior-Loken syndrome. The gene encodes IFT54, a subunit of
    the intraflagellar transport B complex that carries axonemal cargo into the
    cilium; IFT54 docks at the ciliary transition fibres and transition zone,

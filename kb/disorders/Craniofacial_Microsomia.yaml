    reference_title: FOXI3 pathogenic variants cause one form of craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The penetrance of the likely pathogenic variants in the seemingly dominant form is reduced, since a considerable number of such variants in affected individuals were inherited from non-affected parents.
    explanation: >-
      Documents dominant transmission with substantially reduced penetrance in
      FOXI3-related craniofacial microsomia.
- name: Autosomal recessive inheritance
  description: >-
    A subset of FOXI3-related pedigrees is compatible with autosomal recessive

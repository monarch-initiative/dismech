pathophysiology:
- name: Heterogeneous Insult to First and Second Pharyngeal Arch Development
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation"
  role: trigger
  description: >-
    An aetiologically heterogeneous insult during roughly the first six weeks of
    gestation compromises the cranial neural crest cells that populate the first
    (mandibular) and second (hyoid) pharyngeal arches, or the vascular and
    mesenchymal environment those cells depend on. Unlike the single-gene
    craniofacial dysostoses, no one lesion accounts for most cases: vascular
    disruption, teratogenic and maternal-metabolic exposure, polygenic
    susceptibility, and a minority of monogenic or copy-number variants all
    converge on the same arch territory. The unilateral, asymmetric expression of
    the resulting phenotype reflects a stochastic, regionally restricted insult
    rather than a systemic genetic programme failure. This is the
    disorder-specific substitution at the module trigger node: where Treacher
    Collins syndrome substitutes a germline ribosome-biogenesis defect,
    craniofacial microsomia substitutes a multifactorial, regionally restricted
    insult, while the SF3B2 subset substitutes a spliceosome defect closely
    analogous to the EFTUD2/SF3B4 mandibulofacial dysostoses the module already
    covers.

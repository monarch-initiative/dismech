name: Craniofacial Microsomia
creation_date: "2026-07-31T00:00:00Z"
synonyms:
- Hemifacial microsomia
- Oculo-auriculo-vertebral spectrum
- OAV spectrum
- Goldenhar syndrome
- First and second branchial arch syndrome
- Otomandibular dysostosis
- Facio-auriculo-vertebral spectrum
description: >-
  Craniofacial microsomia (CFM) is the second most common congenital craniofacial
  anomaly after orofacial clefting, with a reported prevalence of roughly 1 in
  3,000 to 1 in 5,600 live births. It is characterised by asymmetric, usually
  unilateral hypoplasia of structures derived from the first (mandibular) and
  second (hyoid) pharyngeal arches. The core phenotype comprises mandibular
  ramus and condylar hypoplasia, external and middle ear anomalies (microtia,
  preauricular tags, external auditory canal atresia, conductive hearing loss),
  facial nerve weakness, and deficiency of the masticatory muscles and overlying
  soft tissue. Severity is graded with the OMENS/OMENS-plus classification
  (Orbit, Mandible, Ear, Nerve, Soft tissue, plus extracraniofacial anomalies).
  The condition is aetiologically heterogeneous and overwhelmingly sporadic; the
  classic pathogenic model is a vascular disruption of the developing stapedial
  artery territory producing haematoma and loss of neural-crest-derived
  skeletogenic mesenchyme, with teratogenic and maternal-metabolic exposures and
  a minority of monogenic (FOXI3, MYT1) or copy-number causes contributing. The
  contrast with Treacher Collins syndrome is instructive: TCS is a monogenic
  ribosomopathy producing bilaterally symmetric hypoplasia, whereas craniofacial
  microsomia is typically sporadic, asymmetric and multifactorial, even though
  both converge on the same cranial-neural-crest-to-pharyngeal-arch mechanism.
category: Complex
parents:
- Neurocristopathy
- Craniofacial malformation syndrome

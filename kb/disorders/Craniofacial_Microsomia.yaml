- name: Teratogenic and Maternal-Environmental Disruption
  role: mechanism
  description: >-
    Teratogenic and maternal-metabolic exposures during arch morphogenesis
    reproduce or predispose to the phenotype. Maternal pregestational and
    gestational diabetes is the best-replicated risk factor, and vasoactive
    medication exposure, multiple gestation, higher parity, and second-trimester
    vaginal bleeding have all been associated with craniofacial microsomia.
    Retinoic acid and thalidomide embryopathy are the classic pharmacological
    phenocopies, both acting on cranial neural crest survival and on the
    embryonic vasculature, but a documented exposure is absent in the great
    majority of cases and these agents should not be equated with idiopathic
    craniofacial microsomia. These exposures act on the same neural-crest and
    vascular substrate as the vascular-disruption model rather than through a
    separate pathway.

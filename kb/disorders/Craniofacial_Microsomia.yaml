- name: Airway and Feeding Compromise from Mandibular Deficiency
  role: consequence
  description: >-
    Severe mandibular ramus and condylar deficiency retropositions the tongue
    base and narrows the pharyngeal airway, producing upper airway obstruction
    and obstructive sleep apnoea, together with dysphagia and aspiration risk.
    Risk tracks the severity of the mandibular and orbital OMENS components and
    is greatest in bilateral disease; the most severely affected infants require
    tracheostomy or early mandibular distraction. This is the principal
    functional, as opposed to aesthetic, consequence of the arch-derivative
    bundle and drives the timing of surgical intervention.

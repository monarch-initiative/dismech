    snippet: 13.3% (4) had limb defects (all radial ray hypoplasia)
    explanation: >-
      Identifies radial ray hypoplasia as the exclusive limb pattern in an
      oculo-auriculo-vertebral case series, at 13.3%, which supports the
      OCCASIONAL (5-29%) band for this radius-specific term.
- category: Respiratory
  name: Obstructive Sleep Apnea
  description: >-
    Upper airway obstruction and obstructive sleep apnoea from mandibular
    retrusion and tongue-base retroposition; risk rises steeply with the
    severity of mandibular involvement and with bilateral disease, and severe
    cases require tracheostomy or early mandibular distraction.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: If an individual with CFM is found to have an inherited or de novo chromosome abnormality, genetic counseling for that condition is indicated.
    explanation: >-
      GeneReviews genetic-counselling guidance, including the change in advice
      when a chromosomal cause is identified.
- name: Autologous Fat Grafting for Facial Soft Tissue Augmentation
  description: >-
    Lipofilling of the hypoplastic side to correct the soft-tissue (S) component
    of the OMENS deficiency, which surgical skeletal correction does not
    address. Long-term graft retention is the limiting problem, and supplementing
    the graft with adipose-derived regenerative cells has been tested against
    unsupplemented fat grafting in randomised trials in both adults and children
    with craniofacial microsomia.

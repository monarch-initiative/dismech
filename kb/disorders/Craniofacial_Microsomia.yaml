      Documents the near-complete co-occurrence of spinal cord anomalies with
      vertebral anomalies in the same cohort.
- category: Cardiovascular
  name: Cardiac Anomalies
  description: >-
    Circulatory-system anomalies are the second commonest extracraniofacial
    finding, present in 21% of a 991-patient multicentre cohort. In that cohort
    the lesions most often recorded were septal defects, patent ductus
    arteriosus, and valve anomalies; an over-representation of conotruncal
    lesions is sometimes asserted in the wider literature, but no cited source
    here supports that specificity, so it is not claimed. The overall frequency
    justifies routine electrocardiography and echocardiography in at-risk
    patients.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:30878275
    reference_title: 'Extracraniofacial anomalies in craniofacial microsomia: retrospective analysis of 991 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: vertebral 28%, central nervous system 11%, circulatory system 21%, respiratory tract 3%
    explanation: >-
      Gives 21% for circulatory-system anomalies in a 991-patient multicentre
      cohort, supporting the OCCASIONAL band.
  - reference: PMID:30878275
    reference_title: 'Extracraniofacial anomalies in craniofacial microsomia: retrospective analysis of 991 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patent ductus arteriosus, and anomalies of the valves
    explanation: >-
      Full-text lesion breakdown for the same cohort, naming the cardiac lesions
      actually most often observed. Cited in place of the unsupported
      conotruncal-predominance claim previously asserted in the description.
- category: Genitourinary
  name: Urogenital Anomalies
  description: >-
    Urogenital malformations occur in 11% of a 991-patient multicentre cohort
    and warrant renal ultrasonography in at-risk patients. The 11% denominator
    covers urogenital anomalies as a whole, not any single lesion: renal
    aplasia, undescended testis, and hydronephrosis were the commonest findings.
    The phenotype is therefore bound at the genitourinary-system level so that
    the term matches the breadth of the frequency it carries.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Urogenital malformation (renal aplasia, undescended testis, hydronephrosis)
    term:
      id: HP:0000119
      label: Abnormality of the genitourinary system
  evidence:
  - reference: PMID:30878275
    reference_title: 'Extracraniofacial anomalies in craniofacial microsomia: retrospective analysis of 991 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: gastrointestinal tract 9%, and urogenital tract 11%
    explanation: >-
      Gives 11% for urogenital anomalies as a whole in a 991-patient multicentre
      cohort, supporting the OCCASIONAL band at the genitourinary-system level.
  - reference: PMID:30878275
    reference_title: 'Extracraniofacial anomalies in craniofacial microsomia: retrospective analysis of 991 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mainly, renal aplasia, undescended testis, and hydronephrosis were observed.
    explanation: >-
      Full-text lesion breakdown confirming that the 11% figure spans renal,
      genital, and urinary-tract anomalies rather than renal agenesis alone,
      which is why the broader genitourinary term is used.
- category: Skeletal
  name: Limb Anomalies
  description: >-
    Upper and/or lower limb anomalies occur in 18.2% of a 688-patient multicentre
    cohort (upper 13.4%, lower 7.8%); radial ray hypoplasia is the classic
    pattern and defines the oculo-auriculo-vertebral spectrum with radial defects
    variant. Limb anomalies co-segregate strongly with other extracraniofacial
    anomalies rather than with facial severity.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Upper and/or lower limb anomaly
    term:
      id: HP:0040064
      label: Abnormality of limbs
  evidence:
  - reference: PMID:36729069
    reference_title: 'Upper and Lower Limb Anomalies in Craniofacial Microsomia and Its Relation to the OMENS+ Classification: A Multicenter Study of 688 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 18.2% of the patients were diagnosed with at least one upper and/or lower limb anomaly. Upper and lower limb anomalies were seen in, respectively, 13.4% and 7.8% of patients.
    explanation: >-
      Multicentre quantification of limb involvement of any kind, supporting the
      OCCASIONAL (5-29%) band at the limb-abnormality level. The 18.2%
      denominator is any upper and/or lower limb anomaly, so it is deliberately
      not attached to a radius-specific term; the radial-ray subset is curated
      separately below.
  - reference: PMID:36729069
    reference_title: 'Upper and Lower Limb Anomalies in Craniofacial Microsomia and Its Relation to the OMENS+ Classification: A Multicenter Study of 688 Patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Laterality of CFM and a higher OMENS score were not associated with limb anomalies.
    explanation: >-
      Supports the description's point that limb involvement does not track
      facial severity or laterality.
- category: Skeletal
  name: Radial Ray Hypoplasia
  description: >-
    Radial ray hypoplasia is the classic and, in some series, the exclusive limb
    pattern of the spectrum, and defines the oculo-auriculo-vertebral spectrum
    with radial defects variant. It is curated separately from the broader limb
    phenotype because only the radial-ray-specific figure supports a
    radius-specific term.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Radial ray hypoplasia
    term:
      id: HP:0002984
      label: Hypoplasia of the radius
  evidence:
  - reference: PMID:12410187
    reference_title: 'Infants of diabetic mothers are at increased risk for the oculo-auriculo-vertebral sequence: A case-based and case-control approach.'
    supports: SUPPORT

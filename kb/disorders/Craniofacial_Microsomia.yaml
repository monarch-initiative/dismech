    snippet: We identified two additional individuals with CFM who carry rare variants in MYT1, further supporting the presumptive role of this gene in the CFM spectrum.
    explanation: >-
      Recorded as PARTIAL because the authors themselves describe the MYT1 role
      as presumptive rather than established.
  - reference: PMID:32871052
    reference_title: MYT1 role in the microtia-craniofacial microsomia spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The MYT1 gene has been reported as a candidate based in mutations found in three unrelated individuals.
    explanation: >-
      Documents the prior candidate-gene evidence base for MYT1 in craniofacial
      microsomia.
- name: EDNRB
  notes: >-
    EDNRB was implicated as one of thirteen candidate susceptibility loci in a
    Chinese genome-wide association study of craniofacial microsomia. It is
    noted here specifically because the endothelin axis is the arch
    dorsoventral-identity pathway (EDN1-EDNRA-DLX5/6) that the pharyngeal-arch
    patterning module models, so a common-variant signal at EDNRB is the
    expected genetic echo of that module in a multifactorial disease. This is a
    susceptibility association, not a Mendelian cause.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: EDNRB
    term:
      id: hgnc:3180
      label: EDNRB
  evidence:
  - reference: PMID:26853712
    reference_title: Genome-wide association study identifies multiple susceptibility loci for craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The above 13 associated loci, harboured by candidates of ROBO1, GATA3, GBX2, FGF3, NRP2, EDNRB, SHROOM3, SEMA7A, PLCD3, KLF12 and EPAS1, are found to be enriched for genes involved in neural crest cell (NCC) development and vasculogenesis.
    explanation: >-
      Names EDNRB among the GWAS candidate loci and states the pathway enrichment
      that unifies the neural crest and vascular arms of this entry's pathograph.
  - reference: PMID:26853712
    reference_title: Genome-wide association study identifies multiple susceptibility loci for craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we interrogate 0.9 million genetic variants in 939 CFM cases and 2,012 controls from China. After genotyping of an additional 443 cases and 1,669 controls, we identify 8 significantly associated loci
    explanation: >-
      Establishes the scale and design of the association study underpinning the
      susceptibility claim.
environmental:
- name: Maternal Diabetes Mellitus
  influences_mechanisms:
  - target: Teratogenic and Maternal-Environmental Disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Maternal diabetes is the best-replicated maternal-metabolic risk factor
      for this malformation, which is why this entry carries a node dedicated
      to teratogenic and maternal-environmental disruption for it to act on.
    evidence:
    - reference: PMID:30927385
      reference_title: "Evaluation of prenatal diabetes mellitus and other risk factors for craniofacial microsomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found a statistically significant association between diabetes mellitus (DM) and CFM (OR 4.01, 95% CI 1.6-10.5)."
      explanation: >-
        Reports a statistically significant fourfold association between
        maternal diabetes mellitus and craniofacial microsomia.
  description: >-
    Pregestational and gestational maternal diabetes is the best-replicated
    environmental risk factor for craniofacial microsomia, with roughly four-fold
    increased odds in case-control data. The proposed mechanism is
    hyperglycaemia-mediated interference with cephalic neural crest cell
    migration, which places this exposure squarely on the shared effector pathway
    rather than on a separate one.
  evidence:
  - reference: PMID:30927385
    reference_title: Evaluation of prenatal diabetes mellitus and other risk factors for craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found a statistically significant association between diabetes mellitus (DM) and CFM (OR 4.01, 95% CI 1.6-10.5).
    explanation: Case-control estimate of the maternal diabetes effect size.
  - reference: PMID:12410187
    reference_title: 'Infants of diabetic mothers are at increased risk for the oculo-auriculo-vertebral sequence: A case-based and case-control approach.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the odds ratio for OAVS in infants of mothers with gestational diabetes mellitus was 2.28 (95% CI, 1.03-4.82, P =.03)
    explanation: >-
      Independent registry-based replication of the maternal diabetes
      association, here for gestational diabetes specifically.
- name: Vasoactive Medication Exposure and Perfusion-Related Maternal Factors
  influences_mechanisms:
  - target: Stapedial Artery Haemorrhage and Vascular Disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Targets the vascular-disruption arm rather than the general teratogen
      node, because the proposed action of these exposures is specifically on
      embryonic perfusion, which is what that arm models.
    evidence:
    - reference: PMID:42322171
      reference_title: "Vascular Mechanisms in the Etiology of Hemifacial Microsomia: A Systematic Review of Epidemiological, Clinical, and Genetic Evidence."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Epidemiological studies identified associations between HFM and maternal factors potentially affecting embryonic perfusion, including vasoactive medication exposure, maternal diabetes, multiple gestations, and second-trimester vaginal bleeding."
      explanation: >-
        Identifies epidemiological associations between the malformation and
        maternal factors potentially affecting embryonic perfusion, the
        vascular route this node represents.
  description: >-
    Exposures and conditions that plausibly perturb embryonic perfusion have been
    associated with craniofacial microsomia, including vasoactive medication use,
    multiple gestation, and second-trimester vaginal bleeding. Affected infants
    also show an increased prevalence of single umbilical artery and growth
    restriction, further implicating vascular supply.
  evidence:
  - reference: PMID:42322171
    reference_title: 'Vascular Mechanisms in the Etiology of Hemifacial Microsomia: A Systematic Review of Epidemiological, Clinical, and Genetic Evidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Epidemiological studies identified associations between HFM and maternal factors potentially affecting embryonic perfusion, including vasoactive medication exposure, maternal diabetes, multiple gestations, and second-trimester vaginal bleeding.
    explanation: >-
      Systematic review enumerating the perfusion-related maternal exposures
      associated with the condition.
  - reference: PMID:42322171
    reference_title: 'Vascular Mechanisms in the Etiology of Hemifacial Microsomia: A Systematic Review of Epidemiological, Clinical, and Genetic Evidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Population-based data further demonstrated an increased prevalence of single umbilical artery and growth restriction among affected infants.
    explanation: >-
      Provides independent population-level markers of impaired fetoplacental
      perfusion in affected infants.
- name: Higher Parity
  influences_mechanisms:
  - target: Teratogenic and Maternal-Environmental Disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Parity is a maternal-context risk marker rather than an exposure with a
      route of action; no mediating step is proposed by the cited source.
    evidence:
    - reference: PMID:30927385
      reference_title: "Evaluation of prenatal diabetes mellitus and other risk factors for craniofacial microsomia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Higher parity was also associated with increased risk for CFM (OR 2.0, 95% CI 1.0-4.0)."
      explanation: >-
        Reports higher parity as associated with roughly doubled risk of
        craniofacial microsomia, a maternal risk marker.
  description: >-
    Higher maternal parity was associated with roughly double the odds of
    craniofacial microsomia in case-control data. In the same study, maternal
    vitamin A and/or liver consumption was associated with lower rather than
    higher risk, which does not support a simple dietary-retinoid model of
    causation despite the retinoic-acid embryopathy phenocopy.
  evidence:
  - reference: PMID:30927385
    reference_title: Evaluation of prenatal diabetes mellitus and other risk factors for craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Higher parity was also associated with increased risk for CFM (OR 2.0, 95% CI 1.0-4.0).
    explanation: Case-control estimate for parity.
  - reference: PMID:30927385
    reference_title: Evaluation of prenatal diabetes mellitus and other risk factors for craniofacial microsomia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Vitamin A consumption and/or liver consumption was associated with a 70% lower risk compared with non-users (OR 0.3, 95% 0.1-0.8).
    explanation: >-
      Recorded as REFUTE for a naive dietary-retinoid causal model. Dietary
      vitamin A intake was inversely, not positively, associated with
      craniofacial microsomia, so the retinoic-acid embryopathy phenocopy should
      not be extrapolated to ordinary dietary retinoid exposure.
treatments:
- name: Multidisciplinary Craniofacial Team Care
  description: >-
    Coordinated, age-staged management by an experienced craniofacial team is the
    organising principle of care, because the interventions for airway, hearing,
    facial growth, and occlusion are time-sensitive and interdependent.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: multidisciplinary craniofacial team care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: children should be managed by an experienced multidisciplinary craniofacial team
    explanation: GeneReviews management recommendation.
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The goals of treatment for CFM are to assure adequate respiratory support and feeding in infants with severe facial malformations, maximize hearing and communication, improve facial symmetry, and optimize dental occlusion.
    explanation: >-
      States the four treatment goals that structure staged craniofacial team
      care.
- name: Mandibular Distraction Osteogenesis
  description: >-
    Gradual lengthening of the hypoplastic mandibular ramus by distraction
    osteogenesis, to relieve airway obstruction in infancy and to improve facial
    symmetry and occlusion later in childhood. It directly targets the mandibular
    (M) component of the arch-derivative bundle and its airway consequence.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: mandibular distraction osteogenesis
    term:
      id: NCIT:C51903
      label: Osteotomy
  target_mechanisms:
  - target: Airway and Feeding Compromise from Mandibular Deficiency
    treatment_effect: MODULATES
    description: >-
      Lengthening the deficient mandibular ramus advances the tongue base and
      enlarges the pharyngeal airway, directly relieving the mechanism that
      produces obstruction.
  evidence:
  - reference: PMID:9915160
    reference_title: Airway disorders in hemifacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with more severe mandibular and orbital deformities, but not ear or vertebral abnormalities, appear at a greater risk for obstructive sleep apnea.
    explanation: >-
      Identifies mandibular deficiency as the airway-relevant target, providing
      the rationale for mandibular distraction in airway-compromised patients.
- name: Auricular Reconstruction
  description: >-
    Staged surgical reconstruction of the microtic ear, using autologous costal
    cartilage or an alloplastic framework, typically deferred until adequate
    donor cartilage and ear growth are available.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: staged auricular reconstruction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment is age-dependent, with time-sensitive interventions at appropriate stages of craniofacial growth and development.
    explanation: >-
      Recorded as PARTIAL. GeneReviews supports the age-staged principle
      underlying deferred auricular reconstruction, but the abstract does not
      describe the specific technique.
- name: Hearing Amplification and Audiological Management
  description: >-
    Early identification and amplification of conductive hearing loss, including
    bone-conduction hearing devices for aural atresia, to protect speech and
    language development. Maximising hearing and communication is an explicit
    treatment goal.

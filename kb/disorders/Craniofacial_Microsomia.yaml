- name: Asymmetric Hypoplasia of First- and Second-Arch Derivatives
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Serially Homologous Craniofacial Malformation Across Arch Derivatives"
  role: consequence
  description: >-
    The arch derivatives are built by a shared, serially reused neural-crest
    programme, so the malformation recurs across arch elements as a bundle: the
    mandibular ramus and condyle, the external and middle ear, the facial nerve
    and its target musculature, the orbit, and the overlying soft tissue are
    affected together. This bundle is precisely what the OMENS classification
    scores (Orbit, Mandible, Ear, Nerve, Soft tissue), with OMENS-plus adding
    extracraniofacial anomalies. The decisive contrast with Treacher Collins
    syndrome is laterality and aetiology rather than the element set: a single
    germline ribosomopathy affects both sides equally and symmetrically, whereas
    the regionally restricted, stochastic insult of craniofacial microsomia
    produces a predominantly unilateral, asymmetric deficiency, bilateral in a
    minority and then still asymmetric in degree. Both disorders nevertheless
    conform to the same module node, which is the point: the serially homologous
    craniofacial bundle is a property of the shared arch programme, not of any
    one aetiology.
  cell_types:

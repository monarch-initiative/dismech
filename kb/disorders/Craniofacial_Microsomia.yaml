differential_diagnoses:
- name: Treacher Collins Syndrome
  description: >-
    Treacher Collins syndrome shares the pharyngeal-arch mechanism and conforms
    to the same serial-homology module, producing an overlapping element bundle
    of mandibular, malar/zygomatic, and external-ear hypoplasia with conductive
    hearing loss. It is the single most instructive comparator for craniofacial
    microsomia.
  distinguishing_features:
  - >-
    Laterality: Treacher Collins syndrome is bilaterally symmetric, whereas
    craniofacial microsomia is asymmetric and usually unilateral.
  - >-
    Aetiology and recurrence risk: Treacher Collins syndrome is a monogenic
    ribosomopathy (TCOF1, POLR1B/C/D), mostly autosomal dominant with a Mendelian
    recurrence risk; craniofacial microsomia is overwhelmingly sporadic with an
    empiric 2%-3% sib recurrence risk.
  - >-
    Ocular and eyelid features: downslanted palpebral fissures and lower-eyelid
    colobomas characterise Treacher Collins syndrome, whereas epibulbar dermoids
    characterise the Goldenhar variant of craniofacial microsomia.
  - >-
    Extracraniofacial burden: preauricular tags and vertebral, cardiac and renal
    anomalies occur in craniofacial microsomia but are not features of Treacher
    Collins syndrome.
  disease_term:
    preferred_term: Treacher Collins syndrome
    term:
      id: MONDO:0002457
      label: Treacher-Collins syndrome
  evidence:
  - reference: PMID:20301704
    reference_title: Treacher Collins Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treacher Collins syndrome (TCS) is characterized by lower eyelid abnormalities, malar hypoplasia, downslanted palpebral fissures, and micro- or retrognathia due to symmetric hypoplasia of the zygomatic bones, maxilla, and mandible.
    explanation: >-
      Gives the symmetric hypoplasia and eyelid features that distinguish
      Treacher Collins syndrome from asymmetric craniofacial microsomia.
definitions:
- name: Minimum diagnostic criteria (Tasse)
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The commonly applied minimum diagnostic criteria for the spectrum require
    either isolated microtia, or preauricular tags in association with hemifacial
    microsomia. Diagnosis is clinical; no molecular test defines the condition,
    and OMENS/OMENS-plus and Pruzansky-Kaban are severity classifications rather
    than binary diagnostic criteria.
  evidence:
  - reference: PMID:35015423
    reference_title: Oculo-Auriculo-Vertebral Spectrum (Goldenhar Syndrome).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The minimum diagnostic criteria proposed by Tasse et al include either isolated microtia or preauricular tags associated with hemifacial microsomia.
    explanation: >-
      States the operational minimum diagnostic criteria. Evidence source is
      OTHER because this is a clinical review chapter.
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of CFM is based on clinical findings.
    explanation: GeneReviews confirms the diagnosis is clinical.
discussions:
- discussion_id: CFM-GAP-001
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is embryonic vascular disruption a genuine cause of craniofacial microsomia,
    or a correlate of a primary neural-crest lesion?
  attaches_to:
  - "pathophysiology#Stapedial Artery Haemorrhage and Vascular Disruption"
  rationale: >-
    The stapedial-artery haemorrhage model has dominated thinking about
    craniofacial microsomia for fifty years and elegantly explains unilaterality
    and severity gradation, but the most recent systematic review found only
    eight qualifying studies and judged the evidence indirect and heterogeneous.
    The maternal risk factors that support it (diabetes, vasoactive medication,
    multiple gestation) are also compatible with a direct neural-crest insult,
    and maternal diabetes has an independently proposed neural-crest-migration
    mechanism. The GWAS finding that candidate loci are enriched for both neural
    crest development and vasculogenesis is consistent with either ordering.
    Distinguishing a primary vascular cause from a primary neural-crest cause
    matters because it determines whether prevention should target perfusion or
    crest biology.
  proposed_experiments:
  - experiment_id: CFM-EXP-001
    name: Prospective vascular imaging of affected versus unaffected side
    description: >-
      High-resolution magnetic resonance angiography of both sides of the face in
      a prospective craniofacial microsomia cohort, testing whether regional
      arterial attenuation is present in individuals without skeletal deficiency
      and whether its severity tracks the OMENS mandible score.
    supporting_outcome:
    - >-
        Arterial attenuation grading with mandibular deficiency would support a
        primary vascular mechanism.
    refuting_outcome:
    - >-
        Absence of any consistent regional arterial abnormality in severely
        affected individuals would argue for a primary neural-crest lesion.
  - experiment_id: CFM-EXP-002
    name: Human embryonic specimen correlation of stapedial artery regression
    description: >-
      Staged human embryonic and fetal specimen studies correlating the timing of
      stapedial artery regression with first- and second-arch mesenchymal volume,
      establishing whether the vascular event precedes the mesenchymal shortfall.
  - experiment_id: CFM-EXP-003
    name: Pathway-stratified genomic analysis by laterality
    description: >-
      Integrated genomic analysis testing whether rare-variant burden in
      vascular-development versus neural-crest pathways segregates with
      unilateral versus bilateral presentations.
  evidence:
  - reference: PMID:42322171
    reference_title: 'Vascular Mechanisms in the Etiology of Hemifacial Microsomia: A Systematic Review of Epidemiological, Clinical, and Genetic Evidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Further studies integrating genomic analyses, developmental models, and detailed vascular imaging are needed to clarify the role of vascular mechanisms in craniofacial microsomia.
    explanation: >-
      The systematic review explicitly frames this as an unresolved question and
      names the study designs needed to settle it.
- discussion_id: CFM-GAP-002
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the great majority of craniofacial microsomia cases still lack any
    identified molecular cause?
  attaches_to:
  - "pathophysiology#Monogenic and Copy-Number Contributions in a Minority of Cases"
  rationale: >-
    Even with SF3B2 and FOXI3 established, identified monogenic causes account
    for only a small minority of cases, and MYT1 remains presumptive. The reduced
    penetrance seen in FOXI3 families, and the observation that variants are
    frequently inherited from unaffected parents, suggest that oligogenic
    interaction, modifier alleles, somatic mosaicism, or gene-environment
    interaction with perfusion-related exposures may be needed to explain
    expression. The lack of a refined affected phenotype definition also dilutes
    genetic association power.
  proposed_experiments:
  - experiment_id: CFM-EXP-004
    name: Somatic mosaicism screen in affected craniofacial tissue
    description: >-
      Deep sequencing of surgically resected affected craniofacial tissue paired
      with blood, testing whether post-zygotic mosaic variants explain sporadic,
      unilateral disease that is invisible to germline sequencing.
    supporting_outcome:
    - >-
        Recovery of tissue-restricted pathogenic variants absent from blood would
        explain both sporadicity and unilaterality.
  - experiment_id: CFM-EXP-005
    name: Trans-modifier analysis of FOXI3 penetrance
    description: >-
      Family-based studies quantifying whether common FOXI3 variation in trans
      with a pathogenic allele modifies penetrance and phenotypic severity, as
      suggested by existing cohort data.
  - experiment_id: CFM-EXP-006
    name: Gene-environment interaction analysis
    description: >-
      Population-based analysis combining genotype at established and candidate
      loci with maternal diabetes and other perfusion-related exposures, testing
      for interaction rather than independent main effects.
  evidence:
  - reference: PMID:37041148
    reference_title: FOXI3 pathogenic variants cause one form of craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The inheritance pattern is controversial, and the molecular etiology of this syndrome is largely unknown.
    explanation: >-
      States directly that inheritance and molecular aetiology remain unresolved
      for the condition as a whole.
references:
- reference: PMID:20301754
  title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
  tags:
  - GeneReviews
notes: >-
  Nomenclature. MONDO:0015397 treats craniofacial microsomia, hemifacial
  microsomia, oculo-auriculo-vertebral spectrum, and Goldenhar syndrome as
  synonyms of a single disease entity, and this entry follows that decision. The
  names are curated here as has_subtypes rather than as separate Disease entries
  because they denote positions on one clinical and aetiological continuum, not
  distinct diseases. Goldenhar syndrome is the more extensively affected end
  (epibulbar dermoids plus vertebral anomalies) and isolated microtia the
  mildest. Some authors argue these terms should not be treated as strict
  synonyms in computational curation; that caution is recorded here rather than
  acted on, since splitting them would contradict the MONDO entity.

  Module conformance. Three pathophysiology nodes declare conformance to
  pharyngeal_arch_patterning_serial_homology, at the trigger, central_effector,
  and consequence nodes. The pairing with Treacher Collins syndrome, which
  conforms to the same module, is deliberate and is the most informative thing
  about this entry. The two disorders share the
  cranial-neural-crest-to-pharyngeal-arch mechanism and the resulting serially
  homologous element bundle (mandible, maxilla/zygoma, ear, facial nerve), but
  differ in the substituted trigger (multifactorial, regionally restricted insult
  versus germline ribosomopathy) and therefore in laterality (asymmetric, usually
  unilateral versus bilaterally symmetric) and in recurrence risk (empiric 2%-3%
  versus Mendelian). This is exactly the substitution pattern the module was
  designed to expose. The SF3B2 subset is a further point of contact: the module
  explicitly names the EFTUD2/SF3B4 spliceosomopathies as a conserved trigger
  class, and SF3B2 haploinsufficiency places a molecularly defined slice of
  craniofacial microsomia in that same class.

  GeneReviews status. The GeneReviews chapter for craniofacial microsomia
  (PMID:20301754, last updated 2014) has been formally retired and is retained in
  PubMed for historical reference only. It is nonetheless the most authoritative
  synoptic clinical source available for this condition and is used here as the
  phenotype baseline. Claims sourced from it were cross-checked against the more
  recent primary literature cited elsewhere in this entry, and its clinical
  characteristics (facial asymmetry, tags, microtia/anotia/aural atresia, hearing
  loss, microphthalmia, respiratory compromise, cleft lip/palate, and vertebral,
  renal, cardiac and limb anomalies) are all represented in the phenotypes
  section. The most consequential update since retirement is the identification
  of SF3B2 and FOXI3, both of which postdate the chapter.

  Frequency discipline. Extracraniofacial frequency bands are taken from the
  991-patient multicentre cohort in PMID:30878275 and the 688-patient limb cohort
  in PMID:36729069 in preference to the older oculo-auriculo-vertebral case
  series in PMID:12410187, which ascertained infants of diabetic mothers and
  therefore plausibly enriches for the severe multisystem end of the spectrum.
  The latter is retained only where it supplies a detail the larger cohorts do
  not (the radial-ray pattern of limb anomalies, and hearing loss frequency).
  Craniofacial (OMENS-component) frequencies come from scored craniofacial-unit
  cohorts, which are referral populations and may under-represent the mildest
  cases.

  Prevalence discrepancy. This entry records the 1 in 3,000 to 1 in 5,600 range,
  which is corroborated independently by PMID:33136839 and PMID:26853712. A
  figure of about 1 in 7,500 also circulates in the literature. The difference is
  driven by whether isolated microtia is counted within the spectrum and by
  ascertainment source, not by a genuine population difference; the wider range
  is preferred here because it is the one attached to a quotable primary source.

  Terminology note. The HPO term used for epibulbar dermoid is HP:0001140, whose
  canonical label is "Limbal dermoid", and the term used for macrostomia is
  HP:0000154, whose canonical label is "Wide mouth". In both cases the
  preferred_term is the clinically standard name and is an exact synonym of the
  canonical label, so preferred_term and term.label differ deliberately. A
  deep-research tool proposed HP:0000182 for macrostomia during curation; that
  identifier is actually "Movement abnormality of the tongue" and was rejected on
  OAK verification.

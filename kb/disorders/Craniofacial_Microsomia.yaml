- name: Extracraniofacial Anomaly Screening
  description: >-
    Because 47% of patients in a 991-patient multicentre cohort had at least one
    extracraniofacial anomaly, systematic screening is recommended, with
    particular attention to the circulatory, renal, and neurological systems.
    Recommended investigations are electrocardiography, echocardiography, spine
    radiography, and renal ultrasonography in at-risk patients.

- name: Genetic Counseling
  description: >-
    Counselling is empiric rather than Mendelian for the sporadic majority, with
    a roughly 2%-3% sib recurrence risk. Identification of an SF3B2 or FOXI3
    variant or a chromosomal abnormality changes the counselling substantially,
    and the markedly reduced penetrance of FOXI3 must be explained explicitly,
    since an inherited variant from an unaffected parent is not thereby benign.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240

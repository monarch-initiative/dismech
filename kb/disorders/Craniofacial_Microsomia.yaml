    reference_title: Airway disorders in hemifacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: group II (n = 7, 18 percent) had a medical history suspect for intermittent obstructive sleep apnea or had a perioperative apneic event; and group III (n = 9, 24 percent) had a definite history of obstructive sleep apnea or upper airway obstruction requiring tracheotomy or apnea surgery
    explanation: >-
      Together the suspected and definite airway groups comprise 42% of the
      cohort, supporting the FREQUENT (30-79%) band.
genetic:
- name: SF3B2
  notes: >-
    SF3B2 encodes a component of the U2 small nuclear ribonucleoprotein complex.
    Haploinsufficiency shows a highly significant loss-of-function burden in
    sequenced craniofacial microsomia kindreds, and morpholino knockdown in
    Xenopus disrupts cranial neural crest precursor formation with downstream
    craniofacial cartilage defects. This makes craniofacial microsomia a
    neural-crest spliceosomopathy in this subset, mechanistically adjacent to the
    EFTUD2 and SF3B4 mandibulofacial dysostoses.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SF3B2
    term:
      id: hgnc:10769
      label: SF3B2
  evidence:
  - reference: PMID:34344887
    reference_title: Haploinsufficiency of SF3B2 causes craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We perform whole-exome or genome sequencing of 146 kindreds with sporadic (n = 138) or familial (n = 8) CFM, identifying a highly significant burden of loss of function variants in SF3B2
    explanation: >-
      Statistical burden evidence in a sequenced cohort establishing SF3B2 as a
      craniofacial microsomia gene.
  - reference: PMID:34344887
    reference_title: Haploinsufficiency of SF3B2 causes craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe twenty individuals from seven kindreds harboring de novo or transmitted haploinsufficient variants in SF3B2.
    explanation: >-
      Describes the segregation pattern, including both de novo and transmitted
      haploinsufficient variants.
  - reference: PMID:34344887
    reference_title: Haploinsufficiency of SF3B2 causes craniofacial microsomia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Targeted morpholino knockdown of SF3B2 in Xenopus results in disruption of cranial neural crest precursor formation and subsequent craniofacial cartilage defects
    explanation: >-
      In vivo functional corroboration in Xenopus linking SF3B2 loss to cranial
      neural crest failure.
- name: FOXI3
  notes: >-
    FOXI3 encodes a forkhead-box transcription factor regulating ectodermal and
    neural crest development. Damaging variants act through dosage sensitivity:
    nuclear-localisation-sequence missense variants that mislocalise the protein
    are found in isolated microtia with aural atresia, whereas loss-of-function
    variants produce microtia with mandibular hypoplasia. Penetrance is markedly
    reduced, and a common allele in trans has been proposed as a severity
    modifier.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: FOXI3
    term:
      id: hgnc:35123
      label: FOXI3
  case_fractions:
  - population: European and Chinese CFM pedigrees (670 unrelated probands)
    case_fraction_percent: 3.1
    cohort_size: 670
    notes: Likely pathogenic FOXI3 variants in 21 of 670 unrelated probands.
    evidence:
    - reference: PMID:37041148
      reference_title: FOXI3 pathogenic variants cause one form of craniofacial microsomia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identify 18 likely pathogenic variants in 21 probands (3.1%) in FOXI3.
      explanation: Reports the FOXI3 share of probands in a large multi-ancestry CFM cohort.
  - population: Microtia-CFM cohort, familial cases
    case_fraction_percent: 13.0
    notes: >-
      FOXI3 explained 1% of all cases but 13% of familial cases in this cohort,
      reflecting the enrichment of monogenic causes in multiplex families.
    evidence:
    - reference: PMID:36260083
      reference_title: Damaging variants in FOXI3 cause microtia and craniofacial microsomia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: causing 1% of all cases, including 13% of familial cases in our cohort
      explanation: Quantifies the FOXI3 contribution overall and among familial cases.
  evidence:
  - reference: PMID:36260083
    reference_title: Damaging variants in FOXI3 cause microtia and craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We studied a 5-generation kindred with microtia, identifying a missense variant in FOXI3 (p.Arg236Trp) as the cause of disease (logarithm of the odds = 3.33).
    explanation: >-
      Linkage evidence establishing FOXI3 causality in a large multigenerational
      microtia kindred.
  - reference: PMID:36260083
    reference_title: Damaging variants in FOXI3 cause microtia and craniofacial microsomia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Missense variants in the nuclear localization sequence were identified in cases with isolated microtia with aural atresia and found to affect subcellular localization of FOXI3.
    explanation: >-
      Functional in vitro demonstration that the missense variants mislocalise
      FOXI3, providing the molecular mechanism.
  - reference: PMID:37041148
    reference_title: FOXI3 pathogenic variants cause one form of craniofacial microsomia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Biochemical experiments on transcriptional activity and subcellular localization of the likely pathogenic FOXI3 variants, and knock-in mouse studies strongly support the involvement of FOXI3 in CFM.
    explanation: >-
      Knock-in mouse modelling corroborates FOXI3 causality; classified as
      MODEL_ORGANISM for the in vivo component.
  - reference: PMID:37041148
    reference_title: FOXI3 pathogenic variants cause one form of craniofacial microsomia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: They show an underdeveloped mandible and a complete absence of the external ear (pinna), replaced by small pre-auricular tags
    explanation: >-
      The homozygous Foxi3 triple-mutant knock-in mouse recapitulates the core
      human first- and second-arch bundle (mandibular hypoplasia, microtia or
      anotia, preauricular tags), which is the strongest animal-model support
      for the effector node of this entry's pathograph.
  - reference: PMID:37041148
    reference_title: FOXI3 pathogenic variants cause one form of craniofacial microsomia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Neonatal homozygous mice revealed a partially truncated mandible and fusion of the upper and lower jaws (syngnathia) and anomalies of various bones of the ear
    explanation: >-
      Extends the model phenotype to the middle-ear ossicles and to syngnathia, a
      mandibular-to-maxillary homeotic transformation, tying the FOXI3 mouse to
      the arch dorsoventral-identity arm of the pharyngeal-arch patterning
      module.
- name: MYT1
  notes: >-
    MYT1 encodes a zinc-finger transcription factor implicated in neural crest
    and retinoic-acid-responsive craniofacial development. Rare variants have
    been reported in a small number of unrelated individuals with craniofacial
    microsomia; the gene remains a presumptive rather than definitively
    established cause.
  relationship_type: DISPUTED
  gene_term:
    preferred_term: MYT1
    term:
      id: hgnc:7622
      label: MYT1
  evidence:

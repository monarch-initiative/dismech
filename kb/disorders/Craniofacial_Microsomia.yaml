has_subtypes:
- name: HFM
  display_name: Hemifacial Microsomia (classic unilateral form)
  description: >-
    The classic and most common presentation: unilateral hypoplasia of the
    mandibular ramus and condyle, external and middle ear, facial nerve, and
    soft tissue, without the ocular and vertebral features that define the
    Goldenhar variant. Left- and right-sided involvement occur at broadly
    similar rates.
  evidence:
  - reference: PMID:12621170
    reference_title: 'Hemifacial microsomia: use of the OMENS-Plus classification at the Royal Children''s Hospital of Melbourne.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there were 31 (48 percent) with right-sided microsomia, 25 (38 percent) with left-sided microsomia, and nine (14 percent) with bilateral microsomia
    explanation: >-
      Quantifies the laterality distribution in a craniofacial-unit cohort,
      establishing unilateral involvement as the dominant presentation.
- name: Goldenhar
  display_name: Goldenhar Syndrome / Oculo-Auriculo-Vertebral Spectrum
  description: >-
    The variant of the spectrum in which the craniofacial microsomia phenotype
    is accompanied by epibulbar dermoids or lipodermoids and by vertebral
    anomalies, together with more frequent multisystem (cardiac, renal, central
    nervous system) involvement. Goldenhar syndrome is not a genetically
    distinct entity but the more extensively affected end of the same
    aetiological continuum, which is why MONDO treats the names as synonyms of a
    single disease term.
  evidence:
  - reference: PMID:35015423
    reference_title: Oculo-Auriculo-Vertebral Spectrum (Goldenhar Syndrome).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Multisystem involvement frequently includes the central nervous system, heart, kidneys, and skeletal system, distinguishing it from isolated hemifacial microsomia.
    explanation: >-
      Distinguishes the multisystem oculo-auriculo-vertebral presentation from
      the more restricted hemifacial microsomia phenotype. Evidence source is
      OTHER because this is a clinical review chapter rather than a primary
      study.
- name: Bilateral CFM
  display_name: Bilateral Craniofacial Microsomia
  description: >-
    A minority of individuals have bilateral involvement, which remains
    asymmetric in degree rather than symmetric as in Treacher Collins syndrome.
    Bilateral disease carries a substantially higher risk of upper airway
    obstruction and feeding compromise.
  evidence:
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: bilateral involvement (typically asymmetric), microtia/anotia with atresia of the ear canals, microphthalmia, and respiratory compromise from severe mandibular hypoplasia
    explanation: >-
      GeneReviews documents that bilateral craniofacial microsomia is
      characteristically asymmetric and associated with respiratory compromise.
- name: Isolated Microtia
  display_name: Isolated Microtia (mildest end of the spectrum)
  description: >-
    Isolated microtia, with or without aural atresia and without demonstrable
    mandibular or soft-tissue deficiency, is widely regarded as the mildest
    expression of the craniofacial microsomia spectrum rather than a separate
    condition; families segregating FOXI3 variants may contain both isolated
    microtia and full craniofacial microsomia.
  evidence:
  - reference: PMID:36260083
    reference_title: Damaging variants in FOXI3 cause microtia and craniofacial microsomia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Craniofacial microsomia (CFM) represents a spectrum of craniofacial malformations, ranging from isolated microtia with or without aural atresia to underdevelopment of the mandible, maxilla, orbit, facial soft tissue, and/or facial nerve.
    explanation: >-
      Places isolated microtia explicitly at the mild end of the same
      craniofacial microsomia spectrum.
inheritance:
- name: Sporadic occurrence
  description: >-
    The great majority of craniofacial microsomia occurs as a simplex (sporadic)
    case with no identified cause, and recurrence risk counselling is empiric
    rather than Mendelian, roughly 2%-3% for sibs of a proband with no family
    history. This is the sharpest practical distinction from the monogenic
    craniofacial dysostoses such as Treacher Collins syndrome.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CFM most frequently occurs as a simplex case (i.e., occurrence in a single individual in a family) with unknown etiology; recurrence risks are empiric.
    explanation: >-
      GeneReviews establishes sporadic, aetiologically unexplained occurrence as
      the rule in craniofacial microsomia.
  - reference: PMID:20301754
    reference_title: "Craniofacial Microsomia Overview – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the risk to sibs is 2%-3%, although this may be an underestimate because of low penetrance and the difficulty of obtaining an accurate family history for some of the subtle features of CFM
    explanation: >-
      Gives the empiric sib recurrence risk and flags low penetrance as a reason
      it may be underestimated.
- name: Autosomal dominant inheritance with reduced penetrance
  description: >-
    In the minority of families with an identified monogenic cause, notably
    FOXI3, transmission is most often autosomal dominant with markedly reduced
    penetrance, so that pathogenic variants are frequently inherited from
    clinically unaffected parents.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

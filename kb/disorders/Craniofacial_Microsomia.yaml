- name: Stapedial Artery Haemorrhage and Vascular Disruption
  role: mechanism
  description: >-
    The classic pathogenic model proposes a focal haemorrhage from the
    developing stapedial artery, the transient embryonic vessel supplying the
    first and second pharyngeal arch territory. An expanding haematoma destroys
    or displaces differentiating arch mesenchyme, and the extent and timing of
    the bleed determine which arch derivatives are lost and how severely,
    explaining the unilateral distribution and the wide severity range of the
    phenotype. Contemporary systematic review finds the supporting evidence
    indirect but consistent, and places vascular disruption within a broader
    multifactorial framework rather than treating it as a sufficient
    explanation. Notably, the craniofacial microsomia GWAS loci are enriched for
    vasculogenesis as well as neural crest genes, so the vascular and
    neural-crest arms are convergent rather than competing.
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: Blood vessel development
    term:
      id: GO:0001568
      label: blood vessel development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42322171
    reference_title: 'Vascular Mechanisms in the Etiology of Hemifacial Microsomia: A Systematic Review of Epidemiological, Clinical, and Genetic Evidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Disturbances in embryonic vascular development have long been proposed as a potential mechanism contributing to the characteristic unilateral craniofacial phenotype.
    explanation: >-
      States the vascular-disruption hypothesis and ties it specifically to the
      unilateral phenotype that distinguishes craniofacial microsomia.
  - reference: PMID:42322171
    reference_title: 'Vascular Mechanisms in the Etiology of Hemifacial Microsomia: A Systematic Review of Epidemiological, Clinical, and Genetic Evidence.'

environmental:
- name: Inflammatory Bowel Disease
  notes: >-
    Present in roughly 65-80% of patients, usually UC; the cited patient registry
    gives 67.1%, the lower end of the commonly quoted range.
  evidence:
  - reference: PMID:29705262
    reference_title: "Characteristics and Outcomes Reported by Patients With Primary Sclerosing Cholangitis Through an Online Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mean age at PSC diagnosis (32.4 ± 14.7 y) and the proportion of
      individuals with PSC and IBD (67.1%) were similar to those from prior
      reports
    explanation: >-
      The international PSC Partners Patient Registry (811 completed
      questionnaires) reports concurrent IBD in 67.1% of patients, supporting the
      strong PSC-IBD association.

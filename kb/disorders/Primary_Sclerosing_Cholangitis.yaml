  notes: Identified by GEO DataSets index search for Primary Sclerosing Cholangitis (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE283289
  title: Multi-omic sequencing reveals distinctive gene expression and epigenetic alterations associated with primary sclerosing cholangitis development in treatment-naïve paediatric ulcerative colitis
  description: 'Background: Primary sclerosing cholangitis (PSC) is a progressive cholestatic disease with up to 80% of patients also suffering from ulcerative colitis (PSC-UC). The difficulty in the diagnosis along with the increased risk for developing cancer represent a clinical challenge. Furthermore, the precise molecular factors regulating the phenotype of this disease subtype remain unknown. Methods: We applied methyl-capture sequencing and mRNA sequencing to colonic mucosal biopsies from 3 groups of treatment-naïve children at diagnosis from the DOCHAS study - UC (n=10), PSC-UC (n=10) and healthy controls(n=10).'

  evidence:
  - reference: PMID:27558072
    reference_title: "Antineutrophil antibodies define clinical and genetic subgroups in primary sclerosing cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antineutrophil cytoplasmic antibodies were found in 193 (80%) of the PSC
      patients, with pANCA in 169 (70%).
    explanation: >-
      Indirect immunofluorescence in 241 Norwegian PSC patients found pANCA in
      70%, consistent with the curated 60-80% range for this variable marker.

biochemical:
- name: Alkaline Phosphatase
  presence: Elevated
  context: Cholestatic pattern, often marked
  evidence:
  - reference: PMID:39250501
    reference_title: "Central role for cholangiocyte pathobiology in cholestatic liver diseases."
    supports: PARTIAL

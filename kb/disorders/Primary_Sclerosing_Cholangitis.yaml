      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  evidence:
  - reference: PMID:39404413
    reference_title: "Bile Acids-Based Therapies for Primary Sclerosing Cholangitis: Current Landscape and Future Developments."
    supports: PARTIAL
    snippet: >-
      there is no evidence that the use of UDCA delays the time to liver transplant
      or increases survival.
    explanation: >-
      Confirms that despite widespread use, UDCA lacks proven efficacy for
      delaying transplantation or improving survival in PSC.
- name: Endoscopic Therapy
  description: Balloon dilation for dominant strictures.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: endoscopic retrograde cholangiopancreatography
    term:
      id: NCIT:C16430
      label: Endoscopic Retrograde Cholangiopancreatography
  evidence:
  - reference: PMID:29803836
    reference_title: "No Superiority of Stents vs Balloon Dilatation for Dominant Strictures in Patients With Primary Sclerosing Cholangitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Balloon dilatation should be the initial treatment of choice for dominant
      strictures in patients with PSC.
    explanation: >-
      This multicentre randomized trial in PSC patients with a dominant stricture
      establishes balloon dilatation, rather than short-term stenting, as the
      endoscopic modality of choice.
  notes: >-
    In the same trial, short-term stents were not superior to balloon dilatation
    for recurrence-free patency (0.34 vs 0.30 at 24 months) but caused far more
    treatment-related serious adverse events (45% vs 6.7%), chiefly post-ERCP
    pancreatitis and bacterial cholangitis.
- name: Liver Transplantation
  description: Only curative treatment; disease may recur.
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  evidence:
  - reference: PMID:39250501
    reference_title: "Central role for cholangiocyte pathobiology in cholestatic liver diseases."
    supports: NO_EVIDENCE
    snippet: >-
      Treatment for these diseases is limited, and collectively, they are one of
      the therapeutic "black boxes" in clinical hepatology.
    explanation: >-
      Highlights the limited treatment options for PSC, with transplantation
      remaining the primary definitive therapy.
- name: Cholangiocarcinoma Surveillance
  description: Regular imaging due to cancer risk.
  treatment_term:
    preferred_term: surveillance for malignancies
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:36410555
    reference_title: "Prospective surveillance for cholangiocarcinoma in unselected individuals with primary sclerosing cholangitis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an unselected cohort of patients with PSC, yearly CA19-9 and MRI/MRCP
      surveillance followed by ERCP was ineffective in detecting cancer early
      enough to support long-term survival.
    explanation: >-
      This nationwide prospective study of 512 patients documents the standard
      surveillance protocol (annual MRI/MRCP plus CA19-9) but shows it did not
      achieve early enough detection to improve survival - so it supports
      surveillance as current practice while refuting its efficacy as performed.
  notes: >-
    Only 11/512 patients (2%) developed cholangiocarcinoma over 5 years, with a
    median survival of 13 months despite surveillance. Severe/progressive bile
    duct changes on MRI/MRCP were strongly associated with high-grade dysplasia
    or malignancy (HR 10.50), so imaging retains risk-stratification value even
    where the survival benefit is unproven.
clinical_trials:
- name: NCT06037577
  phase: PHASE_I
  description: Double-blind, randomized, placebo-controlled study assessing
    safety, tolerability, pharmacokinetics, and pharmacodynamics of single
    escalating subcutaneous doses of CM-101, an anti-fibrotic agent developed
    for PSC.
  evidence:
  - reference: clinicaltrials:NCT06037577
    supports: PARTIAL
    snippet: CM-101 is developed as treatment for medical conditions involving
      inflammatory and fibrotic mechanisms such as non-alcoholic steatohepatitis
      (NASH) and primary sclerosing cholangitis (PSC) and systemic sclerosis
      (SSc). In this current study, the IP is tested in healthy male volunteers.
    explanation: This Phase I study characterizes CM-101, a candidate therapy
      for PSC and related fibrotic diseases, establishing early human safety
      data.

- name: Statin-Induced HMGCR Autoantigen Exposure
  description: >-
    Statin exposure raises expression of the HMG-CoA reductase protein, the drug's own
    target, in exposed cells. This is the proposed first step of the autoimmune
    branch: more antigen available to a susceptible immune system. The step is
    demonstrated in cultured cells; that it initiates the human antibody response is
    inferred, and the entry does not claim otherwise.

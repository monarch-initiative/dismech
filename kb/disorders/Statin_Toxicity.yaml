      explanation: >-
        Shows the drug inducing the autoantigen in cultured cells. The inference to a
        human antibody response is an additional step the quote does not make, which
        is what directness records.
- name: Anti-HMGCR Autoantibody Response
  description: >-
    A circulating antibody response against HMG-CoA reductase. The same protein the
    drug inhibits becomes the target of autoimmunity, which is what makes this stratum
    self-sustaining: removing the drug removes the inhibition but not the antibody, so
    the disease continues after withdrawal. Antibody detection is the diagnostic test
    for this branch.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
  evidence:
  - reference: PMID:21360500
    reference_title: "Autoantibodies against 3-hydroxy-3-methylglutaryl-coenzyme A reductase in patients with statin-associated autoimmune myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The identity of the ∼100-kd autoantigen was confirmed by immunoprecipitation of
      in vitro-translated 3-hydroxy-3-methylglutaryl-coenzyme A reductase (HMGCR)
      protein.
    explanation: >-
      Identifies HMG-CoA reductase as the antigen of the antibody response this node
      asserts, which is what makes the drug's target and the autoantigen the same
      protein. Graded IN_VITRO: the experiment is immunoprecipitation of in
      vitro-translated protein, and patient serum being the reagent does not make it a
      clinical observation.
  downstream:
  - target: Autoimmune Myofiber Necrosis and Regeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The antibody response is accompanied by necrotizing muscle injury that responds
      to immunosuppression rather than to drug withdrawal, which is the basis for
      treating it as immune-mediated. The intermediates are recorded as unknown
      because what the antibody does to the fiber is exactly what is unsettled: the
      candidate effector was terminal complement, and the one trial that inhibited it
      in patients was negative.
    evidence:
    - reference: PMID:21360500
      reference_title: "Autoantibodies against 3-hydroxy-3-methylglutaryl-coenzyme A reductase in patients with statin-associated autoimmune myopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Given that these patients had proximal muscle weakness, elevated CK levels,
        MHC I expression on non-necrotic muscle fibers, autoantibodies, and responded
        to immunosuppression, we concluded that these patients had an IMNM.
      explanation: >-
        Joins the antibody to the necrotizing myopathy and to its response to
        immunosuppression, which is this edge's claim. Graded INDIRECT because
        co-occurrence plus treatment response is an inference to the antibody being
        the cause, not a demonstration of it, and BACKGROUND because the sentence
        restates the authors' prior series.
  notes: >-
    Whether terminal complement deposition carries the injury is unsettled and is
    recorded as a knowledge gap rather than as an edge: a randomised trial of C5
    inhibition in this disease was negative despite target engagement, so a
    complement-mediated effector edge would assert more than the evidence supports.
- name: Autoimmune Myofiber Necrosis and Regeneration
  description: >-
    Myofiber necrosis with regeneration and myophagocytosis, and comparatively sparse
    lymphocytic inflammation, which is the histological signature that separates this
    stratum from an inflammatory myositis. Clinically it is progressive symmetrical

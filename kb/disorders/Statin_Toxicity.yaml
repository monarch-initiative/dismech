      label: skeletal muscle fiber
  evidence:
  - reference: PMID:21732624
    reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    quote_role: BACKGROUND
    snippet: >-
      The etiology of this side effect is not fully understood, but is generally
      thought to be on-target, that is, related to statins' effects on HMG-CoA
      reductase.
    explanation: >-
      States that the muscle side effect is on-target - an effect of inhibiting
      HMG-CoA reductase itself - which is this node's claim. Graded INDIRECT because
      the sentence reports the field's position rather than measuring enzyme
      inhibition in myocytes.
  downstream:
  - target: Depletion of Mevalonate Pathway Isoprenoid Intermediates
    causal_link_type: DIRECT
    description: >-
      HMG-CoA reductase catalyses the committed step of the mevalonate pathway, so
      inhibiting it depletes every branch product downstream of mevalonate, not only
      cholesterol.
    evidence:
    - reference: PMID:21732624
      reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        It is well known that inhibiting HMG-CoA reductase results in a homeostatic
        change that preserves the synthesis of mevalonate, so it has been suggested
        that a decrease in other products of this pathway, such as ubiquinone (CoQ)
        may underlie muscle toxicity
      explanation: >-
        States that enzyme inhibition reduces pathway products other than cholesterol,
        which is the step this edge asserts. The sentence is the paper's framing of
        prior work rather than its own result, so quote_role records that.
  notes: >-
    HMGCR is bound here as a pathophysiology gene descriptor rather than recorded in
    the genetic section, because its relationship to this disease is as the drug's
    pharmacological target and, in one stratum, as an autoantigen. Neither is a
    variant-mediated gene-disease relationship, and no value of relationship_type
    would state it without asserting something false.
- name: Depletion of Mevalonate Pathway Isoprenoid Intermediates
  description: >-
    Loss of the non-sterol branch products of the mevalonate pathway within the
    myocyte - the prenyl donors farnesyl and geranylgeranyl pyrophosphate, and
    ubiquinone. Which of these matters is the central mechanistic question, and
    experimental rescue separates them: restoring geranylgeranyl pyrophosphate
    prevents the injury, while restoring cholesterol or ubiquinone does not.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: isoprenoid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0008299
      label: isoprenoid biosynthetic process
  - preferred_term: ubiquinone biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
  - preferred_term: cholesterol biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  evidence:
  - reference: PMID:21732624
    reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      It is well known that inhibiting HMG-CoA reductase results in a homeostatic change that preserves the synthesis of mevalonate, so it has been suggested that a decrease in other products of this pathway, such as ubiquinone (CoQ) may underlie muscle toxicity
    explanation: >-
      States that the pathway's other products fall when the enzyme is inhibited, which is the depletion this node asserts.
  downstream:
  - target: Impaired Protein Geranylgeranylation
    causal_link_type: DIRECT
    description: >-
      Depleted geranylgeranyl pyrophosphate is the prenyl donor for
      geranylgeranylation, so its loss reduces the modification.
    evidence:
    - reference: PMID:21732624
      reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        While FPP had no efficacy (Supplementary Figure 1), GGPP completely preserved
        ATP levels in the presence of simvastatin
      explanation: >-
        Adding back the geranylgeranyl donor abolishes the injury, which establishes
        that its depletion is the consequential one of the depleted intermediates.
  notes: >-
    Three branch products are annotated as depleted, and only one of them carries a
    downstream edge. Ubiquinone and cholesterol are annotated because the enzyme's
    inhibition does deplete them, and because the rescue experiment shows that
    replacing either does not prevent myocyte injury. No edge runs from this node to
    the energy deficit by way of ubiquinone: that route is the long-standing
    hypothesis and the experiment argues against it, so the question is carried as a
    discussion rather than drawn as an arrow the entry does not believe. Annotating a
    depletion records what the drug does; an edge would claim which depletion
    matters.
- name: Impaired Protein Geranylgeranylation
  description: >-
    Reduced geranylgeranylation of small GTPases and other prenylated substrates in
    the myocyte, the modification that anchors them to membranes and is required for
    their signalling. Pharmacological dissection places the relevant transferase at
    geranylgeranyltransferase II rather than type I.
  role: intermediate
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein geranylgeranylation
    modifier: DECREASED
    term:
      id: GO:0018344
      label: protein geranylgeranylation
  evidence:
  - reference: PMID:21732624
    reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that blockade of a Rab prenylation event by statins
      contributes to muscle toxicity.
    explanation: >-
      The paper's own conclusion that statins block a prenylation event and that this
      contributes to muscle toxicity, which is the reduced modification this node
      asserts. Rab proteins are geranylgeranyltransferase II substrates, consistent
      with the transferase this node names.
  downstream:
  - target: Myocyte Bioenergetic Failure
    causal_link_type: DIRECT
    description: >-
      Blocking geranylgeranyl transfer while the donor is replete reproduces the
      bioenergetic deficit, which places the transfer step itself in the causal path.
    evidence:
    - reference: PMID:21732624
      reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We observed that inhibition of GGT-I by GGTI-2133 had no effect on the system,
        while inhibition of GGT-II by BMS3 (16, 17) resulted in lower cellular ATP
      explanation: >-
        An intervention on the transferase, not on the donor, so it isolates the
        geranylgeranylation step as the cause of the energy deficit and identifies
        which transferase carries it.
- name: Myocyte Bioenergetic Failure
  description: >-
    Falling cellular energy charge in the statin-exposed muscle fiber, with the
    accompanying stress, senescence and apoptotic programmes that human muscle biopsy
    shows after rechallenge. This is the point at which a molecular lesion becomes
    cell injury, and it is dose-graded rather than all-or-none, which is consistent
    with the clinical spectrum running from reversible symptoms to overt necrosis.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: muscle cell apoptotic process
    modifier: INCREASED
    term:
      id: GO:0010657
      label: muscle cell apoptotic process
  evidence:
  - reference: PMID:21732624
    reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Specifically, we reported that a subset of statins tend to decrease cellular ATP
      and MTT levels, while leaving intact the mitochondrial gene expression and
      membrane potential (8).
    explanation: >-
      Reports the falling cellular energy charge this node asserts, and reports that
      mitochondrial gene expression and membrane potential were preserved - so this
      node is an energy deficit and not a demonstrated mitochondrial failure. The
      sentence restates the authors' earlier work, which quote_role records.
  - reference: PMID:21732624
    reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also observed that GGPP suppressed the effects of simvastatin on caspase-3/7
      and MTT activities, indicating a role for apoptosis as well
    explanation: >-
      Supports the apoptotic process annotated on this node, and ties it to the same
      geranylgeranyl-dependent chain: the caspase activation is suppressed by
      restoring the prenyl donor.
  notes: >-
    No mitochondrion is annotated on this node, although the energy deficit invites
    it. The source that measures the deficit reports mitochondrial gene expression and
    membrane potential intact, so binding the organelle would assert a lesion the
    evidence specifically did not find. Reduced mitochondrial content has been
    reported in statin-exposed human muscle by other work, which is not cited here.
  downstream:
  - target: Skeletal Muscle Fiber Necrosis
    causal_link_type: DIRECT
    description: >-
      Sustained energy failure and activation of apoptotic and stress programmes in
      the fiber proceed to frank fiber breakdown when exposure is high enough or
      prolonged enough.
    evidence:
    - reference: PMID:21732624
      reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        We also observed that GGPP suppressed the effects of simvastatin on
        caspase-3/7 and MTT activities, indicating a role for apoptosis as well
      explanation: >-
        Shows statin exposure of muscle cells activating caspase-3/7, and the same
        geranylgeranyl rescue suppressing it - so the chain above does not stop at an
        energy deficit but proceeds to programmed cell death. Graded INDIRECT because
        it measures caspase activity in cultured myotubes rather than fiber breakdown
        in muscle. The human rechallenge cohort is deliberately not cited here: its
        cases were enrolled on the criterion of muscle symptoms without significant
        creatine kinase elevation, so it cannot evidence progression to necrosis.

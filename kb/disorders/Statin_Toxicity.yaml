- name: Myoglobin-Induced Renal Tubular Injury
  description: >-
    Injury to the renal tubule by deposited myoglobin. This is the complication that
    makes rhabdomyolysis an emergency rather than a laboratory abnormality, and it is
    the reason renal function and urine are assessed alongside creatine kinase. It is
    kept separate from the release above because it is the only half of the sequence
    any treatment in this entry can act on.

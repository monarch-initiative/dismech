clinical_trials:
- name: NCT04025632
  phase: PHASE_II
  status: TERMINATED
  description: >-
    Randomised, double-blind, placebo-controlled trial of the C5 inhibitor zilucoplan in
    immune-mediated necrotizing myopathy, registered as terminated. The trial behind
    this entry's refusal to draw a complement-mediated effector edge in the autoimmune
    stratum: it was negative despite confirmed target engagement. It enrolled anti-HMGCR
    and anti-SRP patients together, so it is not confined to the statin-associated
    subset. The result this entry rests on is the published eight-week primary endpoint
    in PMID:36923454, which reports the randomised comparison rather than a curtailed
    interim look.
  target_phenotypes:
  - preferred_term: Necrotizing myopathy
    term:
      id: HP:0008978
      label: Necrotizing myopathy
  - preferred_term: Elevated circulating creatine kinase activity
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase activity
  evidence:
  - reference: clinicaltrials:NCT04025632
    reference_title: "A Phase 2, Multicenter, Randomized, Double-Blind, Placebo-Controlled Study to Evaluate the Safety, Tolerability, and Efficacy of Zilucoplan in Subjects With Immune-Mediated Necrotizing Myopathy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of the study is to evaluate the safety and efficacy of zilucoplan in
      patients with Immune-Mediated Necrotizing Myopathy (IMNM).
    explanation: >-
      The registry record establishing the trial's identity and population. Its result
      is cited from the publication, PMID:36923454, in the complement discussion.
  notes: >-
    The cached registry record carries only the title and brief summary, with no status
    field, so status here was read from the live registry through
    `just clinicaltrials-status-audit` rather than from the cache. The registry also
    records a reason for the termination; it is not restated here, because no cached
    source in this entry carries it and a reason for stopping bears directly on how the
    negative result should be read. Re-check with that recipe rather than trusting this
    line, since a curated status is a snapshot and this registry record was last updated
    in 2022.
- name: NCT02993406
  phase: PHASE_III
  status: COMPLETED
  description: >-
    CLEAR Outcomes: bempedoic acid against placebo for cardiovascular events in
    statin-intolerant patients. Relevant here not as a treatment for statin toxicity but
    as the trial that establishes an alternative route to the lipid-lowering goal for
    exactly the population this entry describes - people who cannot sustain a statin.
    That is what makes withdrawal a trade-off rather than a free action.
  evidence:
  - reference: clinicaltrials:NCT02993406
    reference_title: "A Randomized, Double-blind, Placebo-controlled Study to Assess the Effects of Bempedoic Acid (ETC-1002) on the Occurrence of Major Cardiovascular Events in Patients With, or at High Risk for, Cardiovascular Disease Who Are Statin Intolerant"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of this study is to determine if treatment with bempedoic acid
      (ETC-1002) versus placebo decreases the risk of cardiovascular events in
      participants who have or are at high risk for cardiovascular disease and are
      statin intolerant.
    explanation: >-
      Establishes the trial's population as statin-intolerant patients and its endpoint
      as cardiovascular events, which is the sense in which it bears on this entry: it
      addresses the consequence of stopping the statin, not the toxicity itself.
discussions:
- discussion_id: attribution_of_muscle_symptoms_to_the_drug
  kind: CONTROVERSY
  prompt: >-
    What proportion of muscle symptoms reported during statin treatment is caused by
    the drug, and can any individual case be attributed without a blinded
    rechallenge?
  status: OPEN
  attaches_to:
  - phenotypes#Myalgia
  - has_subtypes#SAMS
  rationale: >-
    This is the entry's central difficulty and it is deliberately not drawn as
    pathophysiology, because the competing explanations are not mechanisms of the
    drug: exercise, an untreated thyroid or musculoskeletal disorder, intercurrent
    illness, and expectation. Reported symptom prevalence in registries runs far
    above what blinded comparison supports, and the International Lipid Expert Panel
    puts the expectation effect at possibly over half of all reported muscle
    weakness or pain. The consequence for this entry is structural: the frequency of
    reported symptoms and the frequency of drug-caused injury are different
    quantities with different denominators, so no frequency slot is filled from a
    reported-symptom rate anywhere in the SAMS stratum. It is recorded as a
    controversy rather than a knowledge gap because the evidence exists and is
    contested in its interpretation, not absent.
  evidence:
  - reference: PMID:35969116
    reference_title: "Step-by-step diagnosis and management of the nocebo/drucebo effect in statin-associated muscle symptoms patients: a position paper from the International Lipid Expert Panel (ILEP)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      subjective symptoms occur as a result of the fact that patients expect them to
      do so when taking medicines (the nocebo/drucebo effect)-what might be truth
      even for over 50% of all patients with muscle weakness/pain
    explanation: >-
      States the expectation effect and the scale the panel attributes to it, which is
      the reason reported symptom rates cannot be read as rates of drug-caused injury.
  - reference: PMID:38384718
    reference_title: "The Role of Exercise in Statin-Associated Muscle Symptoms Outcomes: A Systematic Review and Meta-Analysis of Randomized Controlled Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Observational studies are valuable; however, the lack of a placebo comparator
      limits the ability to establish a causal relationship between statins and muscle
      complaints with exercise.
    explanation: >-
      Names the design limitation that makes attribution the open question, in the
      specific setting - exercise - that is the commonest competing explanation for
      muscle symptoms in a treated population.
  notes: >-
    This is why exercise is named as a confounder in the creatine kinase and myalgia
    descriptions rather than linked as an environmental exposure: in this entry
    exercise is an alternative explanation for the observation, not a modifier of the
    drug's mechanism.
- discussion_id: ubiquinone_depletion_as_the_myopathy_mechanism
  kind: CONTROVERSY
  prompt: >-
    Does depletion of ubiquinone explain statin myopathy, and is there any role for
    coenzyme Q10 supplementation?
  status: OPEN
  attaches_to:
  - pathophysiology#Depletion of Mevalonate Pathway Isoprenoid Intermediates
  - pathophysiology#Myocyte Bioenergetic Failure
  rationale: >-
    Ubiquinone is a mevalonate-pathway product, statins deplete it, and it is required
    for mitochondrial electron transport - which makes its depletion the oldest and
    most intuitive candidate mechanism for the muscle injury, and the rationale for
    coenzyme Q10 supplementation. The rescue experiment argues against it: adding
    coenzyme Q10 back to statin-exposed myotubes does not prevent the fall in cellular
    energy, while adding the geranylgeranyl donor does. That is why this entry draws
    its edge through geranylgeranylation and draws no edge through ubiquinone, and why
    no coenzyme Q10 treatment is recorded. The question stays open rather than closed
    because a single in vitro rescue in a mouse cell line does not settle a
    clinical question.
  evidence:
  - reference: PMID:21732624
    reference_title: "A small-molecule screening strategy to identify suppressors of statin myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Simultaneous addition of cholesterol or CoQ was unable to prevent the
      simvastatin-mediated decrease in ATP levels (Figure 1, panel b).
    explanation: >-
      The negative rescue result. Replacing ubiquinone does not prevent the
      bioenergetic injury, which is the evidence against ubiquinone depletion being
      the operative step and the reason no such edge is drawn.
  notes: >-
    Reduced ubiquinone and reduced mitochondrial content have been reported in
    statin-exposed human muscle by work not cited in this entry. Those are
    observations of depletion; this discussion is about whether the depletion carries
    the injury, which is a different question and the one the rescue experiment
    addresses.
- discussion_id: complement_effector_in_anti_hmgcr_imnm
  kind: CONTROVERSY
  prompt: >-
    Does terminal complement activation carry the myofiber injury in anti-HMGCR
    immune-mediated necrotizing myopathy, or is the complement deposition seen on
    biopsy a consequence of injury rather than its cause?
  status: OPEN
  attaches_to:
  - pathophysiology#Anti-HMGCR Autoantibody Response
  - pathophysiology#Autoimmune Myofiber Necrosis and Regeneration
  rationale: >-
    Complement deposition on myofibers is part of the histological picture, and
    passive transfer of anti-HMGCR antibodies to mice has been reported to cause
    weakness and necrosis in a complement-dependent setting, which together motivated
    terminal complement inhibition as a therapy. A randomised phase 2 trial of the C5
    inhibitor zilucoplan then showed no benefit despite target engagement. That does
    not establish that complement is uninvolved in the biology, but it does mean no
    complement-mediated effector edge can be drawn in this pathograph: the one
    intervention that tested the step directly in patients was negative. The question
    matters because the effector mechanism is what a targeted treatment for this
    stratum would have to act on, and immunosuppression is currently non-specific.
  evidence:
  - reference: PMID:36923454
    reference_title: "Zilucoplan in immune-mediated necrotising myopathy: a phase 2, randomised, double-blind, placebo-controlled, multicentre trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At Week 8 there were no clinically relevant or statistically significant
      differences, despite target engagement based on mode of action, between
      treatment arms in mean percent change (standard deviation) of CK levels versus
      baseline
    explanation: >-
      The negative randomised result that leaves the effector step open. Quoted for
      the absence of difference despite confirmed target engagement, which is what
      makes it informative about the mechanism rather than only about the drug.
  - reference: PMID:36923454
    reference_title: "Zilucoplan in immune-mediated necrotising myopathy: a phase 2, randomised, double-blind, placebo-controlled, multicentre trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rather than driving myofiber necrosis, complement activation may be secondary to
      muscle injury.
    explanation: >-
      The trialists' own reading of their negative result, and the position this
      discussion turns on: complement deposition may be a consequence of the injury
      rather than its cause, which is precisely the direction an effector edge would
      have asserted.
  notes: >-
    The trial enrolled 27 patients with anti-HMGCR or anti-SRP antibodies, so it is
    small and not confined to the statin-associated subset, and it is registered as
    terminated (see clinical_trials NCT04025632). Read as evidence against C5 inhibition
    as a treatment, and as a reason not to assert a complement effector edge, rather
    than as a demonstration that complement plays no part.

  - target: Recurrent otitis media
  evidence:
  - reference: PMID:36378426
    reference_title: "A Heterozygous Gain-of-Function Variant in IKBKB Associated with Autoimmunity and Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cause an autosomal dominant immunodeficiency disorder characterized by recurrent sinopulmonary infections, immune dysregulation, inflammation, epithelial defects, and lymphopenia"
    explanation: >
      Lists recurrent sinopulmonary infection among the defining features of

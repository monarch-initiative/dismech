      snippet: "We report the updated classification of inborn errors of immunity, compiled by the International Union of Immunological Societies Expert Committee."
      explanation: >-
        The IUIS classification this assignment is made against.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0032599
      label: immunodeficiency 15a
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >
      The entry curates exactly the MONDO concept, which cross-references
      OMIM:618204 and Orphanet:700205 and carries the causal gene relation
      to IKBKB.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    A single heterozygous kinase-domain variant is sufficient. The founding
    kindreds carried a de novo variant; later families show transmission,
    with clinical severity varying widely between and within families.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The IKBKB mutation was not found in either parent, and after excluding nonpaternity with high confidence, we concluded that the mutation had arisen de novo in the proband."
    explanation: >
      Establishes the heterozygous, de novo origin of the founding IMD15A
      allele.
  - reference: PMID:36378426
    reference_title: "A Heterozygous Gain-of-Function Variant in IKBKB Associated with Autoimmunity and Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous missense gain-of-function (GOF) variants in the same gene cause an autosomal dominant immunodeficiency disorder characterized by recurrent sinopulmonary infections, immune dysregulation, inflammation, epithelial defects, and lymphopenia"
    explanation: >
      States the autosomal dominant inheritance and the core clinical
      phenotype of the heterozygous gain-of-function disorder curated here.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >
    No population estimate exists. The published experience is 16 patients
    from 4 unrelated families in the largest series, plus scattered single
    cases; the count is recorded rather than a rate, and no band is asserted.
  evidence:
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the clinical heterogeneity in 16 patients from 4 unrelated families with missense variants in the kinase domain of IKK2 encoded by IKBKB."
    explanation: >
      The largest reported cohort, and the basis for describing this as an
      ultra-rare disorder known from a handful of families.
progression:
- phase: Progression to combined immunodeficiency in adulthood
  notes: >
    The immune defect is not static. Lymphocyte numbers are generally normal
    in childhood and fall in adults, so a patient can look immunologically
    unremarkable early and meet criteria for combined immunodeficiency
    decades later. This is why the disorder is missed: the diagnostic
    features accumulate after the age at which inborn errors are usually
    sought.
  evidence:
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While lymphocyte cell numbers are generally normal at young ages, most adult patients exhibit strongly reduced B- and T-cell numbers."
    explanation: >
      Directly reports the age-dependent decline in lymphocyte numbers that
      defines this phase.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings coincide with autoinflammatory skin manifestations, systemic infections with progressive lymphopenia, and potentially fatal diseases occurring later in life."
    explanation: >
      Records the late-onset severity, including fatal outcomes, that makes
      the progressive course clinically consequential.
pathophysiology:
- name: IKBKB Kinase Domain Gain-of-Function Variant
  description: >
    A heterozygous missense variant in the IKK2 kinase domain. The founding
    allele, p.Val203Ile, sits in the activating pocket at a residue conserved
    to Drosophila; p.Lys171Arg lies in the activation loop and p.Met65Thr has
    also been reported. The protein is expressed normally - what changes is
    that its kinase activity no longer waits for an upstream signal.

    p.Glu518Lys and p.Thr559Met are deliberately excluded from this node.
    They lie between the leucine-zipper and NEMO-binding regions rather than
    in the kinase domain, and were reported in trans in one patient, so they
    are neither the same protein region nor the same genotype as the
    dominant single-allele disease this node describes.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: IKBKB
      term:
        id: hgnc:5960
        label: IKBKB
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >
      Heterozygous germline missense variants in the IKK2 kinase domain,
      acting through increased kinase activity rather than loss of protein.
  downstream:
  - target: Constitutive IkappaB-alpha Phosphorylation
    causal_link_type: DIRECT
    description: >
      The variant kinase phosphorylates its substrate more, and for longer,
      than wild type at equal protein levels - and does so at rest as well as
      after stimulation.
    evidence:
    - reference: PMID:30337470
      reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "After stimulation with TNF, we observed increased and prolonged IκBα phosphorylation, despite similar levels of WT and mutant allele IKK2 expression"
      explanation: >
        Shows the variant allele driving more substrate phosphorylation at
        equal protein levels. This is the stimulated arm of the claim; the
        resting arm is the patient-PBMC baseline measurement cited below.
    - reference: PMID:30337470
      reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we observed increased IκBα phosphorylation at baseline and after activation of PBMCs obtained from the proband"
      explanation: >
        The resting arm, in the patient's own cells: substrate
        phosphorylation is elevated before any stimulus, which is what makes
        the effect receptor-uncoupled rather than merely exaggerated.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified a novel heterozygous de novo IKBKB missense mutation (c.607G>A) in two separate kindreds in whom probands presented with immune dysregulation, combined T and B cell deficiency, inflammation, and epithelial defects"
    explanation: >
      Identifies the founding variant and the phenotype it segregates with in
      two independent kindreds.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Valine 203 is conserved to at least Drosophila melanogaster (Fig. 1 d), is located within the active site of IKK2 (Fig. 1, e and f), on the second lobe of the kinase domain"
    explanation: >
      Locates the variant in the kinase active site and records its
      conservation, the structural basis for a gain-of-function effect.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed 2 gain-of-function variants in the IKBKB gene, of which one was a novel variant."
    explanation: >
      Extends the allelic series beyond the founding variant, supporting this
      node's description as a class of kinase-domain variants.
  - reference: PMID:32554083
    reference_title: "Heterozygous IKKβ activation loop mutation results in a complex immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified in an adult with ectodermal dysplasia and immunodeficiency a germline, gain-of-function mutation, K171R, in IKBKB."
    explanation: >
      A further germline gain-of-function allele, this one in the IKK2
      activation loop rather than the active site, in a patient whose
      presentation combines immunodeficiency with ectodermal features.
- name: Constitutive IkappaB-alpha Phosphorylation
  description: >
    IkappaB-alpha is phosphorylated at rest as well as after stimulation, so
    the brake that normally holds NF-kappaB in the cytoplasm is partially
    released all the time. In the mouse knock-in this is dose-dependent:
    homozygotes phosphorylate more than heterozygotes, and both more than
    wild type.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: IkappaB kinase activity
    term:
      id: GO:0008384
      label: IkappaB kinase activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Enhanced Canonical NF-kappaB Signalling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of isolated splenocytes revealed constitutive IκBα phosphorylation, with evidence of a gene dose effect: phosphorylation was greater in cells with homozygous mutation compared with heterozygotes, both at baseline"
    explanation: >
      Reports constitutive substrate phosphorylation and its allele-dose
      dependence in the knock-in mouse.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed increased IκBα phosphorylation at baseline and after activation of PBMCs obtained from the proband"
    explanation: >
      The same resting-state phosphorylation in the patient's own cells, so
      this node does not rest on model-organism evidence alone.
- name: Enhanced Canonical NF-kappaB Signalling
  description: >
    Downstream of the released brake, phospho-p65 rises and NF-kappaB-dependent
    transcription increases - measurably even in unstimulated cells, and more
    so after activation. The pathway is not merely more responsive; its
    resting set point has moved.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Lowered Lymphocyte Activation Threshold
  - target: Increased Regulatory T Cell Output
  - target: Eczematoid dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      The autoinflammatory skin disease is attributed to the same pathway
      hyperactivation, but the cells and cytokines between the signalling
      change and the skin lesion are not established in this disorder. Drawn
      as an inferential edge rather than a direct one.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed increased phospho-p65, particularly in the T cell compartment, and an increase in abundance of phospho-p65 after activation out to 60 min"
    explanation: >
      Measures the NF-kappaB subunit phosphorylation this node describes,
      and locates the effect preferentially in T cells.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Even in the absence of stimulation, IKBKBV203I resulted in enhanced luciferase activity compared to the WT allele, and this response was enhanced after TNF stimulation."
    explanation: >
      Shows the shifted resting set point - increased NF-kappaB-dependent
      transcription with no stimulus at all - which is the distinguishing
      claim of this node.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altered NF-κB signaling was evidenced by phosphoflow experiments."
    explanation: >
      Independent confirmation of altered NF-kappaB signalling in the larger
      patient cohort.
- name: Lowered Lymphocyte Activation Threshold
  description: >
    Naive T cells respond to stimuli that normally move few cells, and
    proliferate more than control cells - but the cultures end up with far
    fewer cells, consistent with substantial death. Activation and attrition
    are the same phenomenon here, not competing ones.
  biological_scale: CELLULAR
  downstream:
  - target: Naive T Cell Depletion
  - target: Impaired B Cell Differentiation
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we stimulated cells with CD3 only (rather than CD2, CD3, and CD28), which normally induces only a small proportion of cells to enter cycle, and observed a substantial proliferative response in cells from the proband, but not in controls"
    explanation: >
      Demonstrates the reduced activation threshold directly: a deliberately
      weak stimulus produces a response only in patient cells.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "although we observed an enhanced proliferative response, there were far fewer cells present in cultures at time of analysis, consistent with substantial cell death"
    explanation: >
      The attrition that accompanies the enhanced response, and the link from
      hyperactivation to lymphocyte loss.
- name: Naive T Cell Depletion
  description: >
    The naive compartment is preferentially lost in both CD4 and CD8
    lineages, with a compensating shift toward effector and effector-memory
    phenotypes. The reservoir of cells able to respond to a new antigen
    shrinks, which is what makes this an immunodeficiency rather than an
    autoimmune disease.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  downstream:
  - target: Decreased naive T cell proportion
  - target: Decreased total lymphocyte count
  - target: Combined immunodeficiency
  - target: Chronic mucocutaneous candidiasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Mucosal antifungal defence depends on T cell help; the intermediate
      steps between a depleted naive T cell pool and Candida susceptibility
      are not established in this disorder.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Probands in both kindreds exhibited deficiencies of CD4+ and CD8+ T cells, with a significant reduction in naive T cells in both compartments"
    explanation: >
      Reports the naive-predominant T cell deficiency in both independent
      kindreds.
- name: Impaired B Cell Differentiation
  description: >
    B cells sit on the same lowered threshold - unstimulated patient B cells
    show NF-kappaB phosphorylation comparable to CD40-stimulated controls -
    and then fail at the step that matters: they do not proliferate normally,
    do not make immunoglobulin, and do not accumulate a memory compartment or
    differentiate into plasmablasts.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  downstream:
  - target: Decreased proportion of memory B cells
  - target: Decreased circulating immunoglobulin concentration
  - target: Decreased specific antibody response to vaccination
  - target: Combined immunodeficiency
  - target: Recurrent respiratory infections
    causal_link_type: DIRECT
    description: >
      Failure to make specific antibody is the proximate cause of the
      sinopulmonary infection burden.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "B cells failed to proliferate normally and exhibited a defect in immunoglobulin production after CD40 or CpG stimulation"
    explanation: >
      The functional B cell failure this node asserts, measured against two
      independent stimuli.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probands were also found to exhibit a significant deficiency of memory B cells (Freiburg class Ib)"
    explanation: >
      Reports the memory B cell deficiency that follows from the
      differentiation block.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although still normal in their proliferative capacity, B and T cells show defective activation at day 3 (CD70, CD25, and CD40L expression) and impaired B-cell differentiation into plasmablasts."
    explanation: >
      Independent cohort evidence for the differentiation block, and a useful
      nuance: this series found proliferative capacity preserved while
      activation and plasmablast differentiation failed.
- name: Increased Regulatory T Cell Output
  description: >
    Regulatory T cells and FOXP3 expression per cell are increased, and in
    the mouse the increase is already present in the thymus, implying it
    arises during development rather than as a peripheral response. FOXP3 is
    itself under canonical NF-kappaB control, which makes this a direct
    consequence of the pathway change rather than a coincidence. It is the
    leading candidate explanation for how a hyperactivating variant produces
    deficiency - see the open question recorded in `discussions`.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A similar increase in T reg cells was observed within thymus of mutant mice, suggesting that the defect arises during T reg cell development"
    explanation: >
      Places the regulatory T cell increase in the thymus, supporting a
      developmental rather than reactive origin.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FOXP3 expression is known to be regulated by canonical NF-κB signaling"
    explanation: >
      Supplies the mechanistic link from the pathway change to the regulatory
      T cell phenotype. Graded OTHER because it is the authors summarising
      established literature, not an observation made in their patients.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband exhibited an increase in circulating T reg cells."
    explanation: >
      The human observation behind this node, so the claim does not rest on
      the mouse alone.
  notes: >
    The increase was seen in one of the two founding probands and not the
    other, so it is not a constant feature of the disorder.

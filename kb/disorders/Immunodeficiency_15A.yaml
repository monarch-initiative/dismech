    cells; E518K showed no significant change. And both variants lie between
    the leucine-zipper and NEMO-binding regions rather than in the kinase
    domain where the established disease alleles sit.
genetic:
- name: IKBKB
  gene_term:
    preferred_term: IKBKB
    term:
      id: hgnc:5960
      label: IKBKB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  features: >
    Encodes IKK2 (IKK-beta), the catalytic subunit that, with IKK1 and NEMO,
    phosphorylates IkappaB-alpha and releases NF-kappaB. Reported IMD15A
    alleles are heterozygous kinase-domain missense variants - p.Val203Ile
    in the active site, p.Lys171Arg in the activation loop, and p.Met65Thr -
    acting by increased kinase activity at normal protein levels. The
    p.Glu518Lys and p.Thr559Met variants reported in one autoinflammatory
    patient lie between the leucine-zipper and NEMO-binding regions, outside
    the kinase domain, and were carried in trans; they are not part of this
    allele series. The same residue, V203, has been reported as a somatic
    gain-of-function variant in central nervous system B cell lymphoma,
    which is independent corroboration of the biochemical direction.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IKBKB encodes IKK2, which activates NF-κB signaling. IKK2V203I results in enhanced NF-κB signaling, as well as T and B cell functional defects."
    explanation: >
      States the gene-disease relationship and the direction of the
      functional effect.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "two instances of the same mutation arising as a somatic variant in brain tumors have been reported (Fukumura et al., 2016). Consistent with our findings, this somatic variant was reported to confer gain of function."
    directness: INDIRECT
    explanation: >
      Independent, non-germline corroboration that this exact substitution is
      activating.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic variants (p.V203I and p.M65T) in the patients were identified by whole-exome sequencing."
    explanation: Sources the p.Met65Thr allele recorded in the series above.
  - reference: PMID:32554083
    reference_title: "Heterozygous IKKβ activation loop mutation results in a complex immunodeficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified in an adult with ectodermal dysplasia and immunodeficiency a germline, gain-of-function mutation, K171R, in IKBKB."
    explanation: Sources the p.Lys171Arg activation-loop allele recorded in the series above.
  notes: >
    Biallelic loss-of-function IKBKB variants cause a different disease,
    IMD15B, and are not curated in this entry; see
    `differential_diagnoses`.
animal_models:
- name: Ikbkb V203I CRISPR knock-in mouse
  species: Mouse
  genotype: Ikbkb p.Val203Ile knock-in (heterozygous and homozygous)
  publication: PMID:30337470
  description: >
    Built specifically to test causation for the human allele: the orthologous
    codon change was introduced into mouse Ikbkb by CRISPR/Cas9, so the mouse
    carries the same amino acid substitution as the patients rather than a
    convenient approximation. Heterozygotes and homozygotes were born at
    expected Mendelian ratios, and phenotypes are graded by allele dose.
  modeled_mechanisms:
  - target: Constitutive IkappaB-alpha Phosphorylation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Splenocytes show constitutive IkappaB-alpha phosphorylation at baseline
      and prolonged phosphorylation after stimulation, with homozygotes
      exceeding heterozygotes.
    limitations: >
      The published characterisation emphasises young animals at baseline;
      whether the model reproduces the decades-long progressive course seen
      in adult patients has not been reported.
    readouts:
    - name: Splenocyte phospho-IkappaB-alpha to total IkappaB-alpha ratio
      target: Constitutive IkappaB-alpha Phosphorylation
      direction: INCREASED
      interpretation: >
        Biochemical correlate of unregulated IKK2 activity, graded by allele
        dose.
      evidence:
      - reference: PMID:30337470
        reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analysis of isolated splenocytes revealed constitutive IκBα phosphorylation, with evidence of a gene dose effect: phosphorylation was greater in cells with homozygous mutation compared with heterozygotes, both at baseline"
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:30337470
      reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice and humans carrying this missense mutation exhibit remarkably similar cellular and biochemical phenotypes."
      explanation: >
        The authors' own assessment of fidelity, and the basis for the HIGH
        rating on this link.
  - target: Naive T Cell Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >
      Mutant mice show a relative and absolute deficiency of splenic T cells
      in both CD4 and CD8 compartments, again dose-graded.
    limitations: >
      The compartment shift is not identical to the human one. Humans lose
      naive T cells specifically; mice show an increase in the
      CD44+CD62L-low effector subset, which is the mouse counterpart of the
      same redistribution rather than the same measurement. The mouse also
      loses CD8 cells preferentially, which the human data do not show.
    readouts:
    - name: Splenic CD3+ T cell proportion and absolute count
      target: Naive T Cell Depletion
      direction: DECREASED
      interpretation: >
        Peripheral T cell deficiency matching the human lymphopenia.
      evidence:
      - reference: PMID:30337470
        reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we observed that mice heterozygous and homozygous for IkbkbV203I exhibited a relative deficiency of T cells"
        explanation: Reports the T cell deficiency measured in this model.
    evidence:
    - reference: PMID:30337470
      reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, we observed greater reduction in CD8+ T cells (Fig. 4 g)."
      explanation: >
        Supports the model's T cell phenotype while recording the CD8 bias
        that distinguishes it from the human presentation.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "to prove causation, we generated an accurate mouse model by introducing the precise orthologous codon change in Ikbkb using CRISPR/Cas9"
    explanation: >
      Establishes what this model is and why it was made - an orthologous
      knock-in built to prove causation for the human variant.
- name: Ikbkb K171R knock-in mouse
  species: Mouse
  genotype: Ikbkb p.Lys171Arg knock-in
  publication: PMID:32554083
  description: >
    A second orthologous knock-in, for the activation-loop allele rather than

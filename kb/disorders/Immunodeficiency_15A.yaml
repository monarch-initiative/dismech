treatments:
- name: Immunoglobulin Replacement Therapy
  description: >
    Prophylactic immunoglobulin for the antibody defect. Reported in one
    gain-of-function patient started at 9 months, with improvement in skin
    disease and in the frequency of febrile autoimmune flares, and withdrawn
    at age 3 when he proved to have neither an infectious history nor
    hypogammaglobulinaemia. That single course is the extent of the published
    IMD15A treatment experience - see the entry `notes`.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Impaired B Cell Differentiation
    description: >
      Replaces the antibody the patient's own B cells fail to produce. It
      substitutes for the failed output; it does not correct the
      differentiation block.
  target_phenotypes:
  - preferred_term: Decreased circulating immunoglobulin concentration
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:36378426
    reference_title: "A Heterozygous Gain-of-Function Variant in IKBKB Associated with Autoimmunity and Autoinflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He was started on prophylactic intravenous immunoglobulin (IVIG) 0.5 g/kg infusions at 9 months for infection prophylaxis given his history and genetic findings suggestive of combined immunodeficiency in the literature"
    explanation: >
      The one published account of immunoglobulin replacement in an IKBKB
      gain-of-function patient, including the dose and the indication.
  notes: >
    Single-patient experience, in the autoinflammation-predominant end of the
    spectrum rather than the classic infection-predominant one, and in a
    patient whose two IKBKB variants were carried in trans rather than as a
    single dominant allele. It is recorded because it is the only quotable
    treatment account for this disorder, not because it establishes a
    standard of care.
diagnosis:
- name: Exome or gene-panel sequencing with functional confirmation
  description: >
    There is no screening test and no characteristic routine-laboratory
    signature - counts can be normal in childhood - so the diagnosis is made
    by sequencing in a patient investigated for unexplained antibody or
    combined deficiency. Because gain-of-function missense variants are not
    self-evidently pathogenic, reported cases have been confirmed
    functionally, by NF-kappaB reporter assay or phospho-flow showing
    increased pathway activity.
  evidence:
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic variants (p.V203I and p.M65T) in the patients were identified by whole-exome sequencing."
    explanation: The sequencing route by which reported patients were diagnosed.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An NF-κB reporter assay was performed to investigate NF-κB activity."
    explanation: >
      The functional confirmation step used to establish that a candidate
      variant is gain-of-function.
differential_diagnoses:
- name: Immunodeficiency 15B
  description: >
    The same gene in the opposite direction: biallelic loss-of-function IKBKB
    variants, causing a severe combined immunodeficiency of infancy. The
    cellular phenotype is the mirror image - where IMD15A lowers the
    activation threshold and depletes naive cells, IMD15B leaves lymphocytes
    numerically normal but frozen in a naive, unresponsive state.
  distinguishing_features:
  - Biallelic loss of function rather than heterozygous gain of function
  - Onset in infancy rather than progression across decades
  - Lymphocytes numerically normal but almost exclusively naive, with absent regulatory and gamma-delta T cells
  - Normal T-cell receptor excision circles, so newborn TREC screening does not detect it
  evidence:
  - reference: PMID:24369075
    reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients carried a homozygous duplication--c.1292dupG in exon 13 of IKBKB, which encodes IκB kinase 2 (IKK2, also known as IKKβ)--leading to loss of expression of IKK2, a component of the IKK-nuclear factor κB (NF-κB) pathway."
    explanation: >
      Establishes the loss-of-function mechanism that distinguishes IMD15B
      from the gain-of-function disorder curated here.
  - reference: PMID:24369075
    reference_title: "Deficiency of innate and acquired immunity caused by an IKBKB mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients had hypogammaglobulinemia or agammaglobulinemia, and their peripheral-blood B cells and T cells were almost exclusively of naive phenotype. Regulatory T cells and γδ T cells were absent."
    explanation: >
      The mirror-image cellular phenotype: naive-frozen lymphocytes with
      absent regulatory T cells, against IMD15A's naive depletion and
      increased regulatory T cells.
  - reference: PMID:30391351
    reference_title: "Clinical presentation, immunologic features, and hematopoietic stem cell transplant outcomes for IKBKB immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T-cell receptor excision circles were normal, meaning newborn screening by TREC analysis would miss IKBKB cases."
    explanation: >
      Normal T-cell receptor excision circles mean the newborn TREC screen
      that detects most severe combined immunodeficiencies does not pick up
      IMD15B. No TREC data have been reported for IMD15A, so no claim is
      made about the screen's behaviour in this entry's disease.
discussions:
- discussion_id: activation_versus_deficiency_paradox
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    How does a variant that increases NF-kappaB signalling - and demonstrably
    lowers the lymphocyte activation threshold - produce immune deficiency
    rather than autoimmunity or lymphoproliferation?
  attaches_to:
  - pathophysiology#Lowered Lymphocyte Activation Threshold
  - pathophysiology#Increased Regulatory T Cell Output
  rationale: >
    This is the central unresolved question of the disorder, and the paper
    that defined IMD15A names it as unresolved rather than settling it. Two
    candidate answers are on the table. The first is regulatory: FOXP3 is
    under canonical NF-kappaB control, regulatory T cells and per-cell FOXP3
    are increased, and in the mouse the increase is already present in the
    thymus - so a hyperactivating allele might expand the suppressive
    compartment faster than the effector one. The second is attritional:
    patient cells proliferate more but end up fewer, so chronic
    hyperactivation may simply consume the naive pool. The two are not
    exclusive, and the evidence does not currently separate them. The
    regulatory explanation also has a counterexample within the founding
    report itself - one of the two probands had a late-onset combined
    immunodeficiency with normal regulatory T cells.
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In both human and mouse, we observed pathological immune activation, but this finding needs to be reconciled with clinical manifestation of mild immune deficiency."
    explanation: >
      The authors state the paradox explicitly and as unreconciled, which is
      why this is recorded as an open question rather than a mechanism.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "One possible explanation is the increase in thymic T reg cells, observed in the mouse model, and increased FOXP3 expression in the proband."
    explanation: >
      The regulatory hypothesis, offered by the authors as one possibility.
      Graded OTHER rather than split: the sentence is a single interpretive
      claim that happens to cite a mouse observation and a human one
      together, so neither MODEL_ORGANISM nor HUMAN_CLINICAL describes it,
      and splitting it would mean quoting half a hypothesis.
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient B.II.1, however, had a late-onset combined immunodeficiency alone and presented with normal T reg cells."
    explanation: >
      Supports the question remaining open, by cutting against the leading
      answer: one affected patient had the deficiency without the regulatory
      T cell expansion. `supports` here is scoped to the discussion's claim -
      that the reconciliation is unresolved - which this observation
      strengthens rather than contradicts.
notes: >
  Curated from a claude_code deep-research report
  (research/Immunodeficiency_15A-deep-research-claude_code.md) together with
  the primary literature. No GeneReviews chapter exists for IKBKB - PubMed
  returns no GeneReviews record for the gene - so the usual GeneReviews
  phenotype baseline is unavailable for this entry and no substitute is
  claimed.

  Treatment coverage is deliberately thin. The research report describes
  immunoglobulin replacement, antimicrobial prophylaxis and haematopoietic
  cell transplantation as management, but the transplant experience it cites
  (PMID:30391351) is a cohort of homozygous c.1292dupG patients - that is
  IMD15B, the loss-of-function disorder - and is recorded here under
  `differential_diagnoses` where it belongs rather than as treatment for
  this disease. The report also notes that systemic IKK2 inhibitors are not
  in clinical use, which would be a useful negative finding, but no cached
  source carries a quotable sentence for it. Only the single documented
  immunoglobulin course in a gain-of-function patient is curated.

  Two additions were considered and declined. A serum biomarker panel is
  quotable from PMID:36378426 - it reports increased pro-inflammatory
  chemokines associated with macrophage recruitment - but that panel was
  measured in the patient with the in-trans E518K/T559M genotype quarantined
  above, so importing it would reintroduce exactly the scope problem the
  rest of the entry avoids. And no causal edge is drawn to `Ectodermal
  dysplasia` or `Autoimmune hemolytic anemia`: the first would assert a
  developmental mechanism this entry does not evidence, the second belongs
  to the compound-heterozygous case.

  Reported features not curated: premature cataracts, hidradenitis
  suppurativa, hepatosplenomegaly, and the CMV colitis reported in an adult.
  Quotable sentences exist for most of these - several are already used as
  snippets elsewhere in this entry - so the reason is not sourcing but
  scope: each is a single-patient observation rather than an established
  feature of the disorder. These appear in the founding case
  descriptions or the research report but are single-patient observations
  rather than established features of the disorder; the founding proband's
  full presentation is quoted under the `Eczematoid dermatitis` phenotype,
  so the record of them is not lost.

  The mouse Ikbkb null allele is embryonic lethal at about E14.5 from liver
  degeneration (PMID:10229185), while humans homozygous for a null IKBKB
  allele survive with combined immunodeficiency. That species asymmetry is
  real and interesting, but it concerns the loss-of-function disorder rather
  than this one, so it is noted here rather than modelled as a
  human/model mismatch on an entry about a gain-of-function allele.

- category: Hematologic
  name: Decreased total lymphocyte count
  description: >
    Lymphopenia that is fixed in some patients and progressive in others;
    the larger series found counts normal in childhood and reduced in adults.
  phenotype_term:
    preferred_term: Decreased total lymphocyte count
    term:
      id: HP:0001888
      label: Decreased total lymphocyte count
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial cellular analysis of peripheral blood mononuclear cells (PMBCs) isolated from the proband and both children revealed lymphopenias."
    explanation: Reports lymphopenia across three affected members of one kindred.
  - reference: PMID:40403933
    reference_title: "IKBKB gain of function: An inborn error with clinical heterogeneity progressing toward combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While lymphocyte cell numbers are generally normal at young ages, most adult patients exhibit strongly reduced B- and T-cell numbers."
    explanation: >
      Establishes that the lymphopenia is age-dependent, which is why no
      frequency band is set for this phenotype.
  notes: >
    No frequency band is asserted. The two available series disagree by
    design rather than by conflict - one reports fixed lymphopenia in a
    single kindred, the other an age-dependent decline across four - so any
    single band would misdescribe one of them.

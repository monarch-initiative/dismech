    explanation: Reports bronchiectasis in the second kindred's proband.
- category: Otologic
  name: Recurrent otitis media
  phenotype_term:
    preferred_term: Recurrent otitis media
    term:
      id: HP:0000403
      label: Recurrent otitis media
  evidence:
  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

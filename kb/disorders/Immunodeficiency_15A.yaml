name: Immunodeficiency 15A
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >
  Immunodeficiency 15A (IMD15A, OMIM 618204) is an autosomal dominant inborn
  error of immunity caused by heterozygous gain-of-function missense variants
  in IKBKB, which encodes IKK2 - the kinase that phosphorylates
  IkappaB-alpha and so releases NF-kappaB into the nucleus. The established
  disease alleles sit in the kinase domain; variants elsewhere in the protein
  have been reported in a patient with a different, autoinflammatory
  presentation and a different genotype, and are treated separately below.

  The direction is the surprising part. NF-kappaB drives lymphocyte
  activation, so more of it ought to mean more immunity; instead these
  patients are immunodeficient. Constitutive IKK2 activity uncouples
  NF-kappaB from receptor engagement, and lymphocyte development and
  selection depend on reading the difference between signal and baseline.
  Naive T cells from these patients hyperproliferate to a stimulus that
  normally moves few cells, yet far fewer cells survive the culture; B cells
  activate abnormally and fail to make immunoglobulin. The entry records the
  reconciliation of activation with deficiency as an open question rather
  than asserting one, because the defining study does the same.

  It is the mirror image of a disease caused by the same gene in the other
  direction: biallelic loss-of-function IKBKB variants cause IMD15B, a
  severe combined immunodeficiency with normal lymphocyte counts. Both
  directions produce immune deficiency by different cellular routes.

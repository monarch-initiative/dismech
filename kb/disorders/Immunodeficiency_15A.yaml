  notes: >
    Attributed to this disorder with less confidence than the infection
    phenotype, for three compounding reasons. The reported infant carried
    two IKBKB variants in trans - E518K from the mother, T559M from the
    father, both parents asymptomatic - so the genotype is compound
    heterozygous rather than the dominant single allele that defines IMD15A.

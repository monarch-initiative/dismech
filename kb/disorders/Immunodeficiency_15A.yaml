  - reference: PMID:30337470
    reference_title: "Gain-of-function IKBKB mutation causes human combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 33-yr-old male proband with a history of recurrent respiratory infections, otitis media, and tonsillitis since childhood"
    explanation: The second kindred's presenting infection history.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "probands presented with immune dysregulation, combined T and B cell deficiency, inflammation, and epithelial defects"
    explanation: Names the combined T and B cell deficiency in both founding kindreds.
- category: Immunologic
  name: Recurrent respiratory infections

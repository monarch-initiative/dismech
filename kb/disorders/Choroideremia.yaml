name: Choroideremia
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  Choroideremia is an X-linked chorioretinal dystrophy of males caused by
  loss-of-function variants in CHM, which encodes Rab escort protein 1 (REP1).
  REP1 presents newly synthesized Rab GTPases to the geranylgeranyltransferase
  that lipid-modifies them, and an unprenylated Rab cannot dock on the membrane
  it is meant to traffic. The gene is ubiquitously expressed, and the partially
  redundant paralogue REP2 covers for its loss almost everywhere in the body -
  which is why a systemic prenylation defect produces a disease confined to the
  eye. Within the eye it produces a distinctive triad of degeneration affecting
  the photoreceptors, the retinal pigment epithelium and the choriocapillaris,
  and which of those three is the primary site remains genuinely unsettled.
  Clinically it begins as childhood night blindness, progresses through
  centripetal loss of peripheral field with a fundus of scalloped chorioretinal
  atrophy exposing bare sclera, and ends in blindness in late adulthood as the
  last island of central retinal pigment epithelium is lost. The residual RPE
  area declines exponentially with age over roughly six decades, which makes it
  an unusually tractable trial endpoint - though the phase 3 gene therapy trial
  that used visual acuity instead did not meet its primary endpoint.

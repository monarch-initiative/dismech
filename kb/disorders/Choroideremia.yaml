genetic:
- name: CHM
  association: Hemizygous loss-of-function variants in males
  notes: >
    CHM encodes Rab escort protein 1. Pathogenic variants are predominantly
    truncating - nonsense, frameshift, splice-site and whole- or partial-gene
    deletions - consistent with a pure loss-of-function mechanism. The paralogue
    REP2 compensates in non-retinal tissues, which restricts the phenotype to
    the eye despite ubiquitous CHM expression.
  gene_term:
    preferred_term: CHM
    term:
      id: hgnc:1940
      label: CHM
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:30627697
    reference_title: "Choroideremia: from genetic and clinical phenotyping to gene therapy and future treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Choroideremia is caused by mutations in the CHM gene which encodes Rab escort protein 1 (REP1), an ubiquitously expressed protein involved in intracellular trafficking and prenylation activity."
    explanation: >
      Assigns causation to CHM and identifies the encoded protein and its
      function. Evidence source is OTHER because this is a review.
treatments:
- name: Subretinal AAV2-REP1 Gene Therapy (Timrepigene Emparvovec)
  description: >
    Subretinal delivery of an AAV2 vector carrying CHM, intended to restore REP1
    in the surviving central island. The randomized phase 3 trial in 169 adult
    men did NOT meet its primary endpoint of best-corrected visual acuity
    improvement at 12 months, so key secondary endpoints were not formally
    tested; a numerically larger proportion of treated than control participants
    gained 10 or more ETDRS letters. Adverse events were mostly mild or moderate.
    This is recorded as an investigational therapy with a negative pivotal trial,
    not as standard of care. The authors identify entry criteria (more preserved
    retinal area), surgical technique and endpoint selection as the levers for
    future studies - which is consistent with the natural history data showing
    residual RPE area, not acuity, to be the quantity that changes measurably.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: CHM Loss of Function and REP1 Deficiency
    treatment_effect: RESTORES
    description: >
      Vector-delivered CHM is intended to restore REP1 expression in retinal
      cells, acting on the trigger lesion itself rather than on any downstream
      consequence.
    evidence:
    - reference: PMID:37814062
      reference_title: "Subretinal timrepigene emparvovec in adult men with choroideremia: a randomized phase 3 trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "A randomized, masked, phase 3 clinical trial evaluated the safety and efficacy over 12 months of follow-up in adult males with choroideremia randomized to receive a high-dose (1.0 × 1011 vector genomes (vg); n = 69) or low-dose (1.0 × 1010 vg; n = 34) subretinal injection of the AAV2-vector-based gene therapy timrepigene emparvovec versus non-treated control (n = 66)."
      explanation: >
        Establishes that this gene-replacement approach was tested against the
        causative lesion at pivotal scale. Marked PARTIAL because the trial
        did not demonstrate benefit on its primary endpoint.
  evidence:
  - reference: PMID:37814062
    reference_title: "Subretinal timrepigene emparvovec in adult men with choroideremia: a randomized phase 3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The trial did not meet its primary endpoint of best-corrected visual acuity (BCVA) improvement."
    explanation: >
      Records the negative pivotal result directly. Marked PARTIAL rather than
      REFUTE because the trial establishes that the approach was tolerated and
      showed a numerical secondary signal, while failing to demonstrate benefit
      on its prespecified primary endpoint.

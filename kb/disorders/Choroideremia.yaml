discussions:
- discussion_id: choroideremia_primary_cell_type
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which cell type is the primary site of pathogenesis in choroideremia - the
    retinal pigment epithelium, the photoreceptor, or the choriocapillaris - and
    which must a gene therapy vector therefore reach?
  attaches_to:
  - "pathophysiology#Progressive Chorioretinal Degeneration"
  rationale: >-
    Reviews state plainly that the exact site of pathogenesis remains unclear
    while all three tissues degenerate. This is not an academic point. The
    choice of vector, promoter, and route of delivery in gene therapy follows
    directly from which cell must be transduced, and the phase 3 trial of
    subretinal AAV2-REP1 failed its primary endpoint with the authors
    attributing part of the shortfall to trial design rather than to the
    mechanism. Without knowing the primary target, an unsuccessful trial cannot
    distinguish an inadequate approach from an inadequately targeted one.
  proposed_experiments:
  - experiment_id: chm_cell_type_specific_rescue
    name: Cell-type-restricted Chm deletion and rescue in a conditional model
    description: >
      Delete and separately restore Chm under retinal pigment epithelium-,
      photoreceptor- and choroidal endothelium-specific drivers in a conditional
      mouse or larger-eye model, and determine which single-cell-type deletion
      reproduces, and which single-cell-type rescue prevents, the chorioretinal
      atrophy phenotype.

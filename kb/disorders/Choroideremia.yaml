  description: >
    Affected males are hemizygous for a CHM loss-of-function variant. Carrier
    females typically show a patchy, mottled fundus pigmentation from X
    inactivation mosaicism and are usually visually asymptomatic, though a
    minority with skewed inactivation develop symptomatic disease.
  evidence:

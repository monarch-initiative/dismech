    snippet: "Although carrier females are generally asymptomatic, signs of chorioretinal degeneration can be reliably observed with fundus autofluorescence imaging, and – after age 25 years – with careful fundus examination."
    explanation: >
      GeneReviews substantiates the carrier-female description in this block,
      and adds the detectability threshold (fundus autofluorescence at any age,
      fundus examination after 25) that this entry previously stated only as
      "patchy, mottled fundus pigmentation". Evidence source is OTHER because
      GeneReviews is an expert-curated clinical synthesis.
pathophysiology:
- name: CHM Loss of Function and REP1 Deficiency
  description: >
    A hemizygous loss-of-function variant in CHM - most often nonsense,
    frameshift, splice or deletion, with essentially no missense hotspot -
    abolishes Rab escort protein 1. REP1 is not itself an enzyme: it binds newly
    synthesized Rab GTPases and presents them to Rab geranylgeranyltransferase,
    then escorts the prenylated Rab to its target membrane. The gene is expressed
    ubiquitously, so the lesion is systemic even though the disease is not.
  role: trigger
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Protein prenylation
    term:
      id: GO:0018342
      label: protein prenylation
    modifier: DECREASED
  evidence:
  - reference: PMID:30627697
    reference_title: "Choroideremia: from genetic and clinical phenotyping to gene therapy and future treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Choroideremia is caused by mutations in the CHM gene which encodes Rab escort protein 1 (REP1), an ubiquitously expressed protein involved in intracellular trafficking and prenylation activity."
    explanation: >
      Identifies the gene, the protein and its two coupled functions -
      prenylation and intracellular trafficking - and states the ubiquitous
      expression that makes the eye-restricted phenotype notable. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Defective Rab Prenylation and Intracellular Vesicle Trafficking
    causal_link_type: DIRECT

- name: Defective Rab Prenylation and Intracellular Vesicle Trafficking
  description: >
    Without REP1 a subset of Rab GTPases goes unprenylated and cannot associate
    with the membranes whose traffic they direct. The consequence is a vesicle
    trafficking deficiency, which in the retina plausibly disrupts the processes
    that depend most heavily on high-throughput membrane traffic: daily
    phagocytosis and digestion of shed photoreceptor outer segment discs by the
    retinal pigment epithelium, melanosome and lysosome transport, and
    outer-segment renewal itself. The paralogue REP2 substitutes for REP1 in most
    tissues, which is why the systemic prenylation defect is clinically silent
    outside the eye.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:
  - preferred_term: Vesicle-mediated transport
    term:
      id: GO:0016192
      label: vesicle-mediated transport
    modifier: DECREASED
  - preferred_term: Rab protein signal transduction
    term:
      id: GO:0032482
      label: Rab protein signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:29555028
    reference_title: "Molecular genetics characterization and homology modeling of the CHM gene mutation: A study on its association with choroideremia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in the Rab escort protein-1 (REP-1), an ubiquitously encoded protein of the CHM gene, lead to prenylation and vesicle trafficking deficiency in the protein, resulting in the progressive degeneration of choriocapillaris, retinal pigment epithelium (RPE), and photoreceptors."
    explanation: >
      States the full causal chain this node sits in - prenylation failure to
      trafficking deficiency to degeneration of the three affected tissues.
      Evidence source is OTHER because this is a review with a computational
      modelling component.
  downstream:
  - target: Progressive Chorioretinal Degeneration
    causal_link_type: DIRECT

- name: Progressive Chorioretinal Degeneration
  description: >
    Photoreceptors, retinal pigment epithelium and choriocapillaris all
    degenerate, producing the scalloped, sharply demarcated atrophy that exposes
    bare sclera and gives the disease its name. Which tissue fails first is not
    settled: the RPE, the photoreceptor and the choroid are all plausible
    primary sites, they are metabolically interdependent, and the loss of any one
    would take the others with it. This entry records that uncertainty rather
    than resolving it, because the answer determines which cell type gene
    therapy must reach.
  role: effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: choroidal cell of the eye
    term:
      id: CL:0000348
      label: choroidal cell of the eye
  biological_processes:
  - preferred_term: Photoreceptor cell maintenance
    term:
      id: GO:0045494
      label: photoreceptor cell maintenance
    modifier: DECREASED
  locations:
  - preferred_term: optic choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  - preferred_term: pigmented layer of retina
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  evidence:
  - reference: PMID:30627697
    reference_title: "Choroideremia: from genetic and clinical phenotyping to gene therapy and future treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The exact site of pathogenesis remains unclear but results in degeneration of the photoreceptors, retinal pigment epithelium and choroid."
    explanation: >
      Supports both halves of this node - the three-tissue degeneration, and the
      explicit statement that the primary site is unresolved. Evidence source is
      OTHER because this is a review.
  downstream:
  - target: Centripetal Field Loss and Blindness in Late Adulthood
    causal_link_type: DIRECT

- name: Centripetal Field Loss and Blindness in Late Adulthood
  description: >
    Atrophy begins in the midperiphery and advances inward, sparing a shrinking
    central island of retinal pigment epithelium that preserves good central
    acuity long after the peripheral field has gone - patients are often legally
    blind by field criteria while still reading. That island's area, measured by
    fundus autofluorescence, declines exponentially with age at a rate
    independent of how much was present at baseline, so the disease follows a
    strikingly regular course over about six decades and log-transformed residual
    RPE area serves as an anatomic trial endpoint. Central vision fails when the
    island is finally consumed, typically in the fifth to seventh decade.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:
  - reference: PMID:20301511
    reference_title: "Choroideremia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Typically, symptoms in affected males evolve from night blindness to peripheral visual field loss, with central vision preserved until late in life."
    explanation: >
      GeneReviews states the symptom sequence this node models - night blindness
      first, then peripheral field, with central vision spared until late -
      which this entry previously asserted without a citation. Evidence source
      is OTHER because GeneReviews is an expert-curated clinical synthesis.
  - reference: PMID:32362554
    reference_title: "Long-term Natural History of Atrophy in Eyes with Choroideremia-A Systematic Review and Meta-analysis of Individual-Level Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss of residual RPE area in untreated eyes with CHM follows the AEM over approximately 60 years."
    explanation: >
      Establishes the exponential decay of residual retinal pigment epithelium
      over roughly six decades that this node describes. Evidence source is
      HUMAN_CLINICAL rather than OTHER because this is a meta-analysis of
      individual-eye patient data that reports its own quantitative result, not
      a narrative synthesis.
  - reference: PMID:32362554
    reference_title: "Long-term Natural History of Atrophy in Eyes with Choroideremia-A Systematic Review and Meta-analysis of Individual-Level Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The decline rate of log-transformed RPE area was 0.050 (95% confidence interval, 0.046-0.055) log(mm2)/year and was independent of the baseline RPE area"
    explanation: >
      Quantifies the decline rate and supports the specific claim that it does
      not depend on baseline area, which is what makes the log-transformed
      measure usable as a uniform endpoint across disease stages.

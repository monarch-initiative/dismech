      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:7874169
      reference_title: A common mutation in the fibroblast growth factor receptor 1 gene in Pfeiffer syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A C to G transversion in exon 5, predicting a proline to arginine substitution in the putative extracellular domain, was identified in all affected members of five unrelated PS families but not in any unaffected individuals."
      explanation: >-
        Segregation with affected status across five families, and absence in
        unaffected individuals, is the dominant transmission this term records.
  description: >-
    Pfeiffer syndrome caused by a mutation in FGFR1 on chromosome 8, the minority
    locus. The recurrent exon 5 change predicting a proline-to-arginine substitution
    in the extracellular domain was the mutation carried by all affected members of
    the five families in which FGFR1 was identified as a Pfeiffer locus, and that
    allele, p.Pro252Arg, is associated with mild clinical signs, though within one
    reported family its expression ranged from characteristic brachycephaly and
    digital anomalies to an apparently normal skull and limbs. This is a molecular
    grouping rather than a clinical one, so it is not disjoint from the type 1/2/3
    severity subtypes above; it overlaps type 1 in particular, the mild presentation
    with which p.Pro252Arg is associated.
  evidence:
  - reference: PMID:7874169
    reference_title: A common mutation in the fibroblast growth factor receptor 1 gene in Pfeiffer syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present evidence that mutations in the fibroblast growth factor receptor-1 (FGFR1) gene, which maps to 8p, cause one form of familial Pfeiffer syndrome."
    explanation: >-
      The primary report establishing FGFR1 as a Pfeiffer locus, and the source
      of the chromosome 8 assignment.
  - reference: PMID:25251565
    reference_title: Variable expressivity of pfeiffer syndrome in a family with FGFR1 p.Pro252Arg mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A specific, rare mutation p.Pro252Arg, located between the second and third extracellular immunoglobulin-like domain of FGFR1, is associated with mild clinical signs."
    explanation: >-
      Names the recurrent allele and its association with mild clinical signs,
      which is what makes this molecular subtype overlap the type 1 severity
      class.
  - reference: PMID:25251565
    reference_title: Variable expressivity of pfeiffer syndrome in a family with FGFR1 p.Pro252Arg mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic features within the family showed high variability from the apparently normal skull and limbs to the characteristic brachycephaly and digital anomalies."
    explanation: >-
      Sources the caveat that the association with mild signs is not a fixed
      phenotype: within one p.Pro252Arg family expression reached as far as an
      apparently normal skull and limbs.

      explanation: Sources the sporadic occurrence of type 2 alongside its defining features.
  description: >-
    Cloverleaf skull together with the Pfeiffer hands and feet and ankylosis of the
    elbows. All reported instances have been sporadic, and outcome is poor.
  evidence:
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 2 consists of cloverleaf skull with Pfeiffer hands and feet together with ankylosis of the elbows. Such patients do poorly with an early death. All reported instances to date have been sporadic."
    explanation: Defines type 2 and records its sporadic occurrence and prognosis.
- name: Type 3
  display_name: Type 3 (severe proptosis without cloverleaf skull)
  subtype_term:
    preferred_term: Pfeiffer syndrome type 3
    term:
      id: MONDO:0019661
      label: Pfeiffer syndrome type 3
  inheritance:
  - name: Sporadic (type 3)
    inheritance_term:
      preferred_term: Sporadic
      term:
        id: HP:0003745
        label: Sporadic
    description: >-
      As with type 2, every reported type 3 case had occurred sporadically at the
      time the clinical subtypes were described.
    evidence:
    - reference: PMID:8434615
      reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To date all cases have occurred sporadically."
      explanation: >-
        The sentence follows the type 3 description in the same abstract and
        records that no familial type 3 case had been reported.
  description: >-
    Similar to type 2 but without cloverleaf skull, with severe ocular proptosis and a
    markedly short anterior cranial base. Recognizing it matters diagnostically: extreme
    proptosis without a cloverleaf skull, accompanied by visceral anomalies, has led to
    patients being labelled as undiagnosed or as a new entity.
  evidence:
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 3 is similar to type 2 but without cloverleaf skull. Ocular proptosis is severe in degree and the anterior cranial base is markedly short."
    explanation: Defines type 3 against type 2.
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognition of type 3 is particularly important because extreme ocular proptosis in the absence of cloverleaf skull but with various visceral anomalies can result in failure to diagnose Pfeiffer syndrome"
    explanation: The diagnostic reason the subtype is worth curating separately.
- name: FGFR1-related
  display_name: FGFR1-related Pfeiffer syndrome
  subtype_term:

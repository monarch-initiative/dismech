    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, this T to C change is identical to a mutation in FGFR2 previously reported in Crouzon syndrome, a phenotypically similar disorder but one lacking the hand and foot anomalies seen in PS."

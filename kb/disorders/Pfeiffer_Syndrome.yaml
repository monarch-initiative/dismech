      explanation: Sources both the inheritance mode and the complete-penetrance claim.
    - reference: PMID:8434615
      reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variable expressivity has involved mostly the presence or absence of syndactyly and the degree of syndactyly when present."
      explanation: >-
        Sources the variable-expressivity value and names the feature that
        varies.
  description: >-
    The classic and mildest form: bilateral coronal craniosynostosis, midface hypoplasia,
    broad medially deviated thumbs and great toes, commonly with normal intelligence and
    good outcome. This is the subtype seen in dominantly inherited families, and the one
    the recurrent FGFR1 p.Pro252Arg allele typically produces.
  evidence:
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 1 is commonly associated with normal intelligence, generally good outcome, and can be found dominantly inherited in some families."
    explanation: Defines the type 1 phenotype and its inheritance and prognostic profile.
  - reference: PMID:25251565
    reference_title: Variable expressivity of pfeiffer syndrome in a family with FGFR1 p.Pro252Arg mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A specific, rare mutation p.Pro252Arg, located between the second and third extracellular immunoglobulin-like domain of FGFR1, is associated with mild clinical signs."
    explanation: >-
      Sources the link between the recurrent FGFR1 p.Pro252Arg allele and the
      mild end of the spectrum that this subtype occupies, and the codon number
      itself.

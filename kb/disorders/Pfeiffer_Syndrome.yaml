  - reference: PMID:40620881
    reference_title: "Pfeiffer Syndrome (Acrocephalosyndactyly) With Significant Syndactyly and Brachydactyly: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of acrocephalosyndactyly, Pfeiffer syndrome type 1 with a mutation in FGFR2 c.758C>G (p.Ser253Trp) in a newborn with mild midfacial hypoplasia, significant brachydactyly and syndactyly in the hands and feet."
    explanation: >-

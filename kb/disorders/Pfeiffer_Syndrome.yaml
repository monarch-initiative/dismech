name: Pfeiffer Syndrome
creation_date: '2026-02-06T03:25:37Z'
category: Mendelian
description: >-
  Pfeiffer syndrome is an autosomal dominant craniosynostosis syndrome comprising
  bilateral coronal craniosynostosis, midface hypoplasia with a beaked nasal tip, and
  broad, medially deviated thumbs and great toes — the digital features that separate
  it from the otherwise similar Crouzon syndrome. It is genetically heterogeneous, with
  two loci: FGFR1 on chromosome 8, where the recurrent p.Pro252Arg allele accounts for a
  minority of cases, and FGFR2 on 10q25, which accounts for the majority and is
  classified by ClinGen as a definitive gene-disease relationship.

  The disorder is conventionally divided into three clinical subtypes (Cohen 1993) that
  differ sharply in prognosis rather than in kind. Type 1 is the classic, milder form,
  commonly with normal intelligence and good outcome, and is the subtype found
  dominantly inherited in families. Type 2 adds cloverleaf skull and elbow ankylosis to
  the Pfeiffer hands and feet; type 3 is similar without the cloverleaf skull, with
  severe proptosis and a markedly short anterior cranial base. Types 2 and 3 have
  occurred only sporadically and carry a substantially worse neurological and survival
  outlook — though later series showed that a favourable outcome is achievable in some
  with aggressive management, so the classification is prognostically informative rather
  than deterministic. Cohen's own framing is worth preserving: the three subtypes do not
  have status as separate entities.

  Note on scope: this entry covers Pfeiffer syndrome as a whole (MONDO:0007043), both
  loci and all three subtypes. It previously carried a description restricting it to the
  FGFR1-related form while its own genetic block already curated FGFR2 with ClinGen
  evidence — a scope contradiction, now resolved in favour of the whole disease, which is
  what the disease_term asserts.
disease_term:
  preferred_term: Pfeiffer syndrome
  term:
    id: MONDO:0007043
    label: Pfeiffer syndrome
parents:
- FGFR-related disorder
- Craniosynostosis syndrome
has_subtypes:
- name: Type 1
  display_name: Type 1 (classic Pfeiffer syndrome)
  description: >-
    The classic and mildest form: bilateral coronal craniosynostosis, midface hypoplasia,
    broad medially deviated thumbs and great toes, commonly with normal intelligence and
    good outcome. This is the subtype seen in dominantly inherited families, and the one
    the recurrent FGFR1 p.Pro252Arg allele typically produces.
  evidence:
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 1 is commonly associated with normal intelligence, generally good outcome, and can be found dominantly inherited in some families."
    explanation: Defines the type 1 phenotype and its inheritance and prognostic profile.
- name: Type 2
  display_name: Type 2 (cloverleaf skull with elbow ankylosis)
  description: >-
    Cloverleaf skull together with the Pfeiffer hands and feet and ankylosis of the
    elbows. All reported instances have been sporadic, and outcome is poor.
  evidence:
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 2 consists of cloverleaf skull with Pfeiffer hands and feet together with ankylosis of the elbows. Such patients do poorly with an early death. All reported instances to date have been sporadic."
    explanation: Defines type 2 and records its sporadic occurrence and prognosis.
- name: Type 3
  display_name: Type 3 (severe proptosis without cloverleaf skull)
  description: >-
    Similar to type 2 but without cloverleaf skull, with severe ocular proptosis and a
    markedly short anterior cranial base. Recognizing it matters diagnostically: extreme
    proptosis without a cloverleaf skull, accompanied by visceral anomalies, has led to
    patients being labelled as undiagnosed or as a new entity.
  evidence:
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 3 is similar to type 2 but without cloverleaf skull. Ocular proptosis is severe in degree and the anterior cranial base is markedly short."
    explanation: Defines type 3 against type 2.
  - reference: PMID:8434615
    reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognition of type 3 is particularly important because extreme ocular proptosis in the absence of cloverleaf skull but with various visceral anomalies can result in failure to diagnose Pfeiffer syndrome"
    explanation: The diagnostic reason the subtype is worth curating separately.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Pfeiffer syndrome follows autosomal dominant inheritance. Most cases caused by
    FGFR mutations are gain-of-function type.
  evidence:
  - reference: PMID:29019756
    reference_title: "Imaging of Skeletal Disorders Caused by Fibroblast Growth Factor Receptor Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of these mutations are inherited in an autosomal dominant fashion and are gain-of-function-type mutations."
    explanation: Confirms autosomal dominant inheritance and GOF mechanism for FGFR-related skeletal disorders including Pfeiffer syndrome.

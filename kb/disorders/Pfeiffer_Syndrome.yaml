genetic:
- name: FGFR1 gain-of-function mutations
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: FGFR1
    term:
      id: hgnc:3688
      label: FGFR1
  notes: >-
    FGFR1 is the minority Pfeiffer locus and the recurrent p.Pro252Arg allele it
    carries is associated with mild clinical signs, while FGFR2 accounts for the
    majority of cases. Neither the clinical severity types nor the gene-defined
    forms is a relabelling of the other, and no source found supports a
    one-to-one mapping between them: an FGFR2 variant is reported in a patient
    classified as the mild type 1, and a hospital series describes severe
    FGFR2-associated disease, so FGFR2 spans the severity range. The two axes are
    therefore curated as overlapping has_subtypes rows rather than as a mapping.
    The Europe PMC queries behind that were TITLE:"Pfeiffer syndrome" AND (FGFR2
    OR FGFR1); ABSTRACT:"Pfeiffer" AND ABSTRACT:"FGFR1" AND ABSTRACT:"FGFR2" AND
    (ABSTRACT:"severe" OR ABSTRACT:"mild"); and "Pfeiffer syndrome" AND FGFR1 AND
    "type 1" AND ABSTRACT:FGFR2. ClinGen's own grade for the FGFR1-Pfeiffer
    relationship is not stated here: the repository's committed ClinGen caches
    carry the FGFR2 assertion only, and the gene-validity CSV those caches are
    built from is not part of the repository.
  evidence:
  - reference: PMID:7874169
    reference_title: A common mutation in the fibroblast growth factor receptor 1 gene in Pfeiffer syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present evidence that mutations in the fibroblast growth factor receptor-1 (FGFR1) gene, which maps to 8p, cause one form of familial Pfeiffer syndrome."
    explanation: >-
      The primary report identifying FGFR1 as a Pfeiffer locus, which is the
      causative relationship this record asserts.
  - reference: PMID:7874169
    reference_title: A common mutation in the fibroblast growth factor receptor 1 gene in Pfeiffer syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A C to G transversion in exon 5, predicting a proline to arginine substitution in the putative extracellular domain, was identified in all affected members of five unrelated PS families but not in any unaffected individuals."
    explanation: >-
      Gives the recurrent allele and its segregation: present in every affected
      family member and in no unaffected individual across five families.
  - reference: PMID:25251565
    reference_title: Variable expressivity of pfeiffer syndrome in a family with FGFR1 p.Pro252Arg mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A specific, rare mutation p.Pro252Arg, located between the second and third extracellular immunoglobulin-like domain of FGFR1, is associated with mild clinical signs."
    explanation: >-
      Sources the p.Pro252Arg codon number, its position in the protein, and its
      association with mild clinical signs.
  - reference: PMID:29019756
    reference_title: "Imaging of Skeletal Disorders Caused by Fibroblast Growth Factor Receptor Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal disorders caused by type 1 mutations include Pfeiffer syndrome (PS) and osteoglophonic dysplasia"
    explanation: Confirms FGFR1 (type 1) mutations as a cause of Pfeiffer syndrome.
- name: FGFR2
  gene_term:
    preferred_term: FGFR2
    term:
      id: hgnc:3689
      label: FGFR2

      pedigrees on record at the time of the subtype description it behaved as a
      fully penetrant autosomal dominant trait with variable expressivity.
    evidence:
    - reference: PMID:8434615
      reference_title: "Pfeiffer syndrome update, clinical subtypes, and guidelines for differential diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

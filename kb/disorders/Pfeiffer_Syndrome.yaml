  relationship_type: CAUSATIVE
  evidence:
  - reference: CGGV:assertion_eccfe56b-15d7-4ba9-abf2-163dfd3dab3c-2022-03-21T210958.425Z
    reference_title: "FGFR2 / Pfeiffer syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FGFR2 | HGNC:3689 | Pfeiffer syndrome | MONDO:0007043 | AD | Definitive"
    explanation: ClinGen classifies the FGFR2-Pfeiffer syndrome gene-disease relationship as definitive with autosomal dominant inheritance.
  - reference: PMID:7795583
    reference_title: "Mutations in FGFR1 and FGFR2 cause familial and sporadic Pfeiffer syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a second locus for PS on chromosome 10q25, and present evidence that mutations in the fibroblast growth factor receptor-2 (FGFR2) gene on 10q25 cause PS in an additional subset of familial and sporadic cases."
    explanation: >-
      Establishes FGFR2 on 10q25 as the second Pfeiffer locus, alongside FGFR1 on
      chromosome 8 — the genetic heterogeneity this entry now covers in full.
  - reference: PMID:7795583
    reference_title: "Mutations in FGFR1 and FGFR2 cause familial and sporadic Pfeiffer syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, this T to C change is identical to a mutation in FGFR2 previously reported in Crouzon syndrome, a phenotypically similar disorder but one lacking the hand and foot anomalies seen in PS."
    explanation: >-
      Records that an identical FGFR2 allele is reported in both Pfeiffer and Crouzon
      syndrome, so genotype alone does not separate them — the digital features do.
treatments:
- name: Cranial vault reconstruction
  description: >-
    Surgical expansion of the cranial vault to relieve intracranial pressure and
    correct skull deformity. May require staged procedures depending on severity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cranial vault reconstruction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
- name: Midface advancement surgery
  description: >-
    Le Fort III or monobloc osteotomy to advance the midface, improving airway,
    proptosis, and facial appearance. Repeat midface surgery is common in
    FGFR-related syndromic craniosynostosis, and the scarring left by earlier
    procedures is itself a risk factor: the first reported paediatric case of
    bilateral posterior ischaemic optic neuropathy after craniofacial surgery
    occurred in a 13-year-old with Pfeiffer syndrome undergoing Le Fort II
    advancement, attributed to bicoronal flap tightness from prior Le Fort III
    surgery combined with permissive hypotension and anaemia. This is a single
    case and does not establish a rate, but it identifies a mechanism —
    cumulative operative scarring plus intraoperative hypoperfusion — specific to
    the repeatedly operated syndromic craniosynostosis patient.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Midface advancement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:42153645
    reference_title: "Bilateral Posterior Ischemic Optic Neuropathy Following Midface Advancement Surgery in a Pediatric Patient With Pfeiffer Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was determined on institutional review that his vision loss was attributed to the tightness of the bicoronal flap due to scarring from past Le Fort III procedures in combination with permissive hypotension and anemia."
    explanation: >-
      Identifies the proposed mechanism of a severe visual complication of
      repeated midface advancement in Pfeiffer syndrome.
  - reference: PMID:42153645
    reference_title: "Bilateral Posterior Ischemic Optic Neuropathy Following Midface Advancement Surgery in a Pediatric Patient With Pfeiffer Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case demonstrates the only documented episode of bilateral posterior ischemic optic neuropathy in a pediatric patient and describes a rarely documented risk factor."
    explanation: >-
      Records that this is a single documented case, so no frequency claim is
      made.

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Autosomal recessive inheritance. At conception, each sib of an affected
      individual has a 25% chance of being affected, a 50% chance of being an
      asymptomatic carrier, and a 25% chance of being unaffected and not a
      carrier.
    explanation: >-
      GeneReviews genetic counseling statement for the recessive form, giving
      the sib recurrence and carrier risks.
  - reference: PMID:12189163
    reference_title: Homozygosity for a missense mutation in fibulin-5 (FBLN5) results in a severe form of cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Molecular study of the fibulin-5 (FBLN5) gene in a large consanguineous
      Turkish family with four patients affected by AR cutis laxa type I
      demonstrated the presence of a homozygous missense mutation (T998C) in
      the FBLN5 gene
    explanation: >-
      The founding report: homozygosity in a consanguineous recessive pedigree.
  - reference: PMID:24962763

name: Cutis Laxa Autosomal Recessive Type 1A
creation_date: "2026-10-13T10:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Cutis Laxa Autosomal Recessive Type 1A
  term:
    id: MONDO:0009052
    label: cutis laxa, autosomal recessive, type 1A
description: >-
  Autosomal recessive cutis laxa type 1A (ARCL1A) is an extremely rare
  congenital elastic fiber disorder caused by biallelic loss-of-function
  variants in FBLN5, which encodes the elastin- and integrin-binding matrix
  protein fibulin-5. Recessive missense alleles misfold, are retained in the
  endoplasmic reticulum and secreted poorly, and bind tropoelastin and
  fibrillin-1 microfibrils weakly, so elastin globules fail to fuse into
  continuous elastic fibers. Generalized loose, redundant skin is present from
  birth, and the life-limiting manifestation is early childhood-onset pulmonary
  emphysema; peripheral pulmonary artery stenosis, occasional supravalvular
  aortic stenosis, valvular regurgitation, inguinal hernias and hollow viscus
  (bladder, intestinal) diverticula reflect generalized connective tissue
  involvement. Cardiorespiratory failure from emphysema is the most common
  cause of death. Fbln5-null mice reproduce loose skin, emphysema and arterial
  elastinopathy. Management is supportive and organ-directed.
synonyms:
- ARCL1A
- Autosomal recessive cutis laxa type IA
- Cutis laxa, autosomal recessive, type IA
- Autosomal recessive FBLN5-related cutis laxa
- Cutis laxa, pulmonary emphysema type
parents:
- hereditary disease
- autosomal recessive cutis laxa type 1
notes: >-
  Nomenclature differs between sources. OMIM and MONDO call the FBLN5 form
  type IA (OMIM 219100), whereas the 2013 Callewaert cohort paper labels
  FBLN5-related disease type Ib and EFEMP2 (FBLN4)-related disease type Ia;
  the gene, not the letter, identifies this entry. FBLN5 is also the gene for
  autosomal dominant cutis laxa type 2 (ADCL2), which is caused by different,
  heterozygous allele classes and is a separate disorder; the GeneReviews
  chapter covers both, and only its statements about recessive FBLN5 disease
  or about the shared clinical picture are used here. Clinical and genetic
  overlap is greatest with LTBP4-related ARCL1C, which also presents with
  cutis laxa and severe emphysema but with more severe gastrointestinal and
  genitourinary diverticula. No conforms_to is declared to the
  emphysema_protease_antiprotease_imbalance module: in Fbln5-null mice the
  elastin is fragmented without an increase of elastase activity, so the
  emphysema arises from defective elastic fiber development rather than
  protease-driven destruction.

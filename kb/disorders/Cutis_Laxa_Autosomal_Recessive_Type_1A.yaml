genetic:
- name: FBLN5
  gene_term:
    preferred_term: FBLN5
    term:
      id: hgnc:3602
      label: FBLN5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  features: >-
    FBLN5 encodes fibulin-5 (DANCE, EVEC), a calcium-dependent elastin-binding
    matrix protein that localizes to the surface of elastic fibers and binds
    cell-surface integrins through an RGD motif. Biallelic loss-of-function
    variants cause this disorder; heterozygous dominant FBLN5 alleles cause the
    distinct autosomal dominant cutis laxa type 2.
  notes: >-
    No ClinGen gene-disease validity assertion exists for FBLN5 and this
    disease; the only cached ClinGen FBLN5 record concerns demyelinating
    hereditary motor and sensory neuropathy.
  evidence:
  - reference: PMID:12189163
    reference_title: Homozygosity for a missense mutation in fibulin-5 (FBLN5) results in a severe form of cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      we provide evidence that a genetic defect in fibulin-5 (FBLN5, also
      known as EVEC or DANCE) is responsible for a recessive form of cutis
      laxa in humans
    explanation: Gene identification.
  - reference: PMID:16691202
    reference_title: Homozygous missense mutation in fibulin-5 in an Iranian autosomal recessive cutis laxa pedigree and associated haplotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mutation is the same as previously reported in the Turkish pedigree,
      further confirming that it is causative of disease.
    explanation: Replication of S227P in a second recessive pedigree.
  - reference: PMID:20301756
    reference_title: FBLN5-Related Cutis Laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      biallelic pathogenic variants in FBLN5 (autosomal recessive
      FBLN5-related cutis laxa)
    explanation: GeneReviews defines the recessive form by biallelic FBLN5 variants.
  variants:
  - name: c.998T>C (p.Ser227Pro)
    description: >-
      Homozygous in a consanguineous Turkish family with four affected and in
      an Iranian recessive pedigree sharing the same intragenic haplotype.
      Fourth cbEGF-like domain. Misfolds, is secreted slowly, triggers ER
      stress, and binds tropoelastin and fibrillin-1 poorly.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:16691202
      reference_title: Homozygous missense mutation in fibulin-5 in an Iranian autosomal recessive cutis laxa pedigree and associated haplotype.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        A haplotype consisting of seven intragenic sequence variations common
        to both pedigrees is described for the mutation-carrying fibulin-5
        allele.
      explanation: Shared haplotype suggests a common origin of S227P.
  - name: c.649T>C (p.Cys217Arg)
    description: >-
      Homozygous in a Lebanese family and in a second Lebanese family likely
      sharing a common ancestor. Removes a disulfide-bonded cysteine in the
      fourth cbEGF-like domain; the recombinant mutant binds tropoelastin
      poorly and is not incorporated into elastic fibers.
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:22829427
      reference_title: Comprehensive clinical and molecular analysis of 12 families with type 1 recessive cutis laxa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        This missense substitution alters the second cysteine of the 4th
        cbEGF-like domain, which forms a disulfide bond with a cysteine at
        position 230.
      explanation: Structural basis of the allele.

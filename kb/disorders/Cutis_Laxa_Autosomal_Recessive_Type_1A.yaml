inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic FBLN5 variants, homozygous in the reported families, which are
    mostly consanguineous. Heterozygous parents are asymptomatic carriers. Each
    sib of an affected individual has a 25% chance of being affected, a 50%
    chance of being a carrier and a 25% chance of being neither. Age of onset
    varies within families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:

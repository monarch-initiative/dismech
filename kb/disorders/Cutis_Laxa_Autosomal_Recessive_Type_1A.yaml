animal_models:
- name: Fbln5 knockout mouse (Nakamura)
  species: Mouse
  genotype: Fbln5-/- (gene-targeted null)
  publication: PMID:11805835
  description: >-
    Gene-targeted fibulin-5 (DANCE) null mice survive to adulthood with a
    systemically disorganized elastic fiber system, tortuous aorta with loss
    of compliance, severe emphysema and loose skin.
  modeled_mechanisms:
  - target: Defective Elastic Fiber Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Fragmented elastin and disorganized elastic fibers throughout the body.
    limitations: >-
      A null allele: it reproduces loss of extracellular fibulin-5 but not the
      misfolded-protein ER stress of the human missense alleles.
    evidence:
    - reference: PMID:11805835
      reference_title: Fibulin-5/DANCE is essential for elastogenesis in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: fibulin-5-/- mice generated by gene targeting exhibit a severely disorganized elastic fibre system throughout the body.
      explanation: Elastic fiber disorganization in the null mouse.
  - target: Emphysema
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Mice survive to adulthood, whereas emphysema in patients is early-onset
      and often fatal in childhood.
    evidence:
    - reference: PMID:11805835
      reference_title: Fibulin-5/DANCE is essential for elastogenesis in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: fibulin-5-/- mice survive to adulthood, but have a tortuous aorta with loss of compliance, severe emphysema, and loose skin (cutis laxa).
      explanation: Severe emphysema in the null mouse.
  - target: Arterial Elastic Fiber Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The mouse shows aortic tortuosity and loss of compliance, whereas the
      human disease shows pulmonary artery and supravalvular aortic stenosis
      without documented arterial tortuosity.
    evidence:
    - reference: PMID:11805835
      reference_title: Fibulin-5/DANCE is essential for elastogenesis in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: have a tortuous aorta with loss of compliance
      explanation: Arterial elastinopathy in the null mouse.
  - target: Cutis laxa
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: Mouse skin differs from human skin in structure and elastic fiber content.
    evidence:
    - reference: PMID:11805835
      reference_title: Fibulin-5/DANCE is essential for elastogenesis in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: severe emphysema, and loose skin (cutis laxa)
      explanation: Loose skin in the null mouse.
- name: Fbln5 knockout mouse (Yanagisawa)
  species: Mouse
  genotype: Fbln5-/- (gene-targeted null)
  publication: PMID:11805834
  description: >-
    Independently generated fibulin-5 null mice with elastinopathy, loose
    skin, vascular abnormalities and emphysematous lung; showed that
    fibulin-5 is a calcium-dependent elastin-binding protein on the surface of
    elastic fibers.
  modeled_mechanisms:
  - target: Defective Elastic Fiber Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    limitations: >-
      A null allele: it does not model the misfolding and ER stress of the
      human missense alleles.
    evidence:
    - reference: PMID:11805834
      reference_title: Fibulin-5 is an elastin-binding protein essential for elastic fibre development in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        fibulin-5-/- mice develop marked elastinopathy owing to the
        disorganization of elastic fibres, with resulting loose skin, vascular
        abnormalities and emphysematous lung
      explanation: The full elastinopathy phenotype in the null mouse.
  - target: Emphysema
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: Timing and lethality differ from the human disease.
    evidence:
    - reference: PMID:11805834
      reference_title: Fibulin-5 is an elastin-binding protein essential for elastic fibre development in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: vascular abnormalities and emphysematous lung
      explanation: Emphysematous lung in the null mouse.

diagnosis:
- name: FBLN5 molecular genetic testing
  description: >-
    Diagnosis is established by identifying biallelic pathogenic FBLN5
    variants in a proband with the clinical features. In recessive cutis laxa
    with emphysema, LTBP4 is the more frequent cause, so a multigene approach
    covering LTBP4, FBLN5 and EFEMP2 (FBLN4) is appropriate; arterial
    tortuosity and aneurysms point to EFEMP2 instead.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301756
    reference_title: FBLN5-Related Cutis Laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of FBLN5-related cutis laxa is established in a proband
      with the characteristic clinical features and biallelic pathogenic
      variants in FBLN5 (autosomal recessive FBLN5-related cutis laxa)
    explanation: GeneReviews diagnostic statement for the recessive form.
  - reference: PMID:22829427
    reference_title: Comprehensive clinical and molecular analysis of 12 families with type 1 recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      As such, in patients with ARCL type 1 and emphysema, we advise to analyze
      LTBP4 in the absence of clear cardiovascular impairment, followed by
      FBLN5 if no mutation is identified.
    explanation: Testing-order recommendation based on relative gene frequency.
- name: Echocardiography
  description: >-
    Cardiovascular imaging to detect peripheral pulmonary artery stenosis,
    supravalvular aortic stenosis and valvular disease, and to look for the
    arterial tortuosity and aneurysms that distinguish EFEMP2-related disease.
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:22829427
    reference_title: Comprehensive clinical and molecular analysis of 12 families with type 1 recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      FBLN5 and LTBP4 mutations cause a very similar phenotype associated with
      severe pulmonary emphysema, in the absence of vascular tortuosity or
      aneurysms.
    explanation: The vascular evaluation helps separate FBLN5/LTBP4 from EFEMP2 disease.
- name: Skin biopsy with electron microscopy
  description: >-
    Supportive, research-grade finding: absent matrix fibulin-5 and unfused
    elastin globules.
  diagnosis_term:
    preferred_term: Skin Biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:17035250
    reference_title: "Fibulin-5 mutations: mechanisms of impaired elastic fiber formation in recessive cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histological analysis of skin sections from a cutis laxa patient with a
      homozygous S227P mutation showed a lack of fibulin-5 in the
      extracellular matrix
    explanation: Tissue finding in a confirmed patient.
- name: Urinary tract surveillance
  description: Routine surveillance for bladder diverticula and vesicoureteral reflux.
  evidence:
  - reference: PMID:20301756
    reference_title: FBLN5-Related Cutis Laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surveillance: Routine surveillance of the urinary tract for evidence of
      bladder diverticula and/or vesicoureteral reflux.
    explanation: GeneReviews surveillance recommendation.

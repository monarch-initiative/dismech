pathophysiology:
- name: Biallelic FBLN5 Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Germline homozygous FBLN5 variants. Most reported alleles are missense
    substitutions in calcium-binding EGF-like domains (S227P and C217R in the
    fourth cbEGF domain, C144W), with one nonsense allele (E391X). Recessive
    alleles cause loss of function through misfolding and intracellular
    retention, in contrast to the heterozygous dominant FBLN5 alleles of
    ADCL2.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: FBLN5
    term:
      id: hgnc:3602
      label: FBLN5
  evidence:
  - reference: PMID:12189163
    reference_title: Homozygosity for a missense mutation in fibulin-5 (FBLN5) results in a severe form of cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      resulting in a serine-to-proline (S227P) substitution in the fourth
      calcium-binding epidermal growth factor-like domain of fibulin-5 protein
    explanation: The first recessive FBLN5 allele and the domain it alters.
  - reference: PMID:22829427
    reference_title: Comprehensive clinical and molecular analysis of 12 families with type 1 recessive cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Sequencing of the FBLN5 gene identified 2 mutations in two families: a
      homozygous c.1171G>T (p.Glu391X) alteration in family A and a homozygous
      c.649T>C (p.Cys217Arg) mutation in family B
    explanation: Additional homozygous nonsense and cysteine missense alleles.

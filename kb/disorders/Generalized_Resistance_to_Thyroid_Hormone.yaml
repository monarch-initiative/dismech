references:
- reference: PMID:25905294
  title: "Impaired Sensitivity to Thyroid Hormone: Defects of Transport, Metabolism, and Action."
notes: >-
  This entry is scoped to MONDO:0009043 (generalized resistance to thyroid
  hormone), which MONDO places specifically under THRB-caused RTH-beta as the
  "generalized" (pituitary-and-peripheral) clinical category, not as an
  umbrella over every mechanism of impaired thyroid hormone sensitivity. The
  originating issue suggested modeling RTH-alpha (THRA, MONDO:0034216), MCT8
  deficiency (SLC16A2, MONDO:0010354), and SECISBP2 deficiency
  (MONDO:0800046) as has_subtypes of this entry; checking MONDO directly
  showed that only MONDO:0008569 (the autosomal dominant RTH-beta form) is
  actually a child of MONDO:0009043 -- RTH-alpha is a sibling under thyroid
  hormone resistance syndrome (MONDO:0001328), Allan-Herndon-Dudley syndrome
  sits under X-linked syndromic intellectual disability, and SECISBP2
  deficiency sits under peripheral hypothyroidism. has_subtypes terms count
  toward MONDO coverage, so modeling those three as subtypes here would also
  have double-claimed two already separately curated entries. This entry
  follows MONDO's actual hierarchy rather than the issue's suggested list.

  RTH-alpha, MCT8 deficiency (Allan-Herndon-Dudley syndrome), and SECISBP2
  deficiency remain closely related, mechanistically analogous forms of
  reduced tissue sensitivity to thyroid hormone (together with RTH-beta, the
  scope of the 2024 European Thyroid Association guideline,
  DOI:10.1530/etj-24-0125), and are cross-referenced here rather than modeled
  as subtypes: MCT8 deficiency is fully curated as Allan-Herndon-Dudley_Syndrome
  (MONDO:0010354), SECISBP2 deficiency as SECISBP2_Deficiency (MONDO:0800046),
  and RTH-alpha (MONDO:0034216) is not yet separately curated in dismech. This
  is also the contrasting resistance-vs-deficiency entity to
  Congenital_Hypothyroidism and the hypothyroidism_thyroid_hormone_deficiency
  module: in RTH-beta, circulating thyroid hormone is normal-to-elevated but
  target tissues under-respond to it, whereas hypothyroidism is a deficiency
  of circulating hormone itself. The two conditions are deliberately NOT
  modeled with conforms_to against the hypothyroidism module, since
  RTH-beta's mechanism (receptor resistance despite adequate-to-excess
  hormone) is the mechanistic inverse, not a variant, of hormone deficiency.

  No dedicated GeneReviews chapter exists for RTH-beta, RTH-alpha, or
  SECISBP2 deficiency; the baseline clinical reference actually consulted for
  these three is the Endotext chapter "Impaired Sensitivity to Thyroid
  Hormone: Defects of Transport, Metabolism, and Action" (PMID:25905294,
  tagged above under references), not GeneReviews. A GeneReviews chapter does
  exist for the MCT8/Allan-Herndon-Dudley arm (PMID:20301789) and is already
  cited extensively in the standalone Allan-Herndon-Dudley_Syndrome entry.

  Deliberately deferred in this pass, for lack of RTH-beta-specific verified
  human evidence located within the curation time budget rather than any
  judgment that they are irrelevant: sensorineural hearing impairment, atrial
  fibrillation, and hepatic steatosis/dyslipidemia as separately evidenced
  phenotypes, and a structured animal_models entry for the TRb knockout/GS
  mouse literature (e.g., DOI:10.1101/2023.11.26.568063, cached but not yet
  cited). A hearing-related synonym ("deafness-thyroid hormone resistance
  syndrome") is recorded on MONDO:0009043 itself and may warrant follow-up.

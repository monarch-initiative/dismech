diagnosis:
- name: THRB Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing THRB, focused on the ligand-binding domain and hinge region
    where mutations cluster.
  results: >-
    Identification of a THRB mutation confirms the diagnosis, though roughly
    14% of individuals with the classic RTH-beta phenotype have no
    identifiable THRB mutation (mosaicism or regulatory-region variants have
    been proposed to explain some of these cases).
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic diagnosis is the gold standard for RTH-β currently
    explanation: States genetic testing as the diagnostic gold standard for RTH-beta.
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 14% of individuals manifesting the RTHβ phenotype no THRB mutations
      were identified.
    explanation: Quantifies the fraction of clinically diagnosed cases with no identifiable THRB mutation.
- name: Serum TSH Determination
  diagnosis_term:
    preferred_term: serum TSH measurement
    term:
      id: NCIT:C74742
      label: Hormone Measurement
  description: >-
    Measuring serum TSH alongside free T4/T3 is the most sensitive
    biochemical test to detect reduced sensitivity to thyroid hormone; other
    peripheral markers of TH action (cholesterol, creatine kinase, alkaline
    phosphatase, osteocalcin, SHBG) are less reliable unless measured before
    and after T3 administration.
  results: >-
    A non-suppressed (measurable, normal, or elevated) TSH in the presence of
    elevated free T4/T3 supports RTH-beta over primary hyperthyroidism.
  evidence:
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serum TSH determination remains the most sensitive test to determine
      reduced sensitivity to TH.
    explanation: States TSH determination as the most sensitive test directly.
differential_diagnoses:
- name: TSH-Secreting Pituitary Adenoma (TSHoma)
  disease_term:
    preferred_term: TSH-secreting pituitary adenoma
    term:
      id: MONDO:0019611
      label: TSH-secreting pituitary adenoma
  description: >-
    The principal condition to exclude, particularly when there is no family
    history: TSHoma also produces elevated free thyroid hormone with a
    non-suppressed TSH. Testing first-degree relatives for the biochemical
    phenotype is a cost-effective way to support RTH-beta over TSHoma, since
    incidental pituitary lesions are found in up to 24% of RTH-beta patients,
    complicating imaging-based differentiation.
  distinguishing_features:
  - Failure to suppress TSH after supraphysiologic T3 administration
  - Failure to normally stimulate TSH with TRH
  - Elevated serum SHBG
  - Increased pituitary alpha-glycoprotein/TSH molar ratio
  - Frequent co-secretion of growth hormone or prolactin, with an imaging-confirmed pituitary mass
  evidence:
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Characteristics of a TSH-oma include failure to suppress TSH after the
      administration of supra-physiologic doses of T3, failure to normally
      stimulate TSH with TSH releasing hormone (TRH)
    explanation: >-
      Directly states the biochemical dynamic-testing features that
      distinguish TSHoma from RTH-beta.

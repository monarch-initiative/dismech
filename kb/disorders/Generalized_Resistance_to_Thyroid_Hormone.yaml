genetic:
- name: THRB
  gene_term:
    preferred_term: THRB
    term:
      id: hgnc:11799
      label: THRB
  relationship_type: CAUSATIVE
  frequency: causes the large majority (~85%) of clinically recognized RTH-beta
  notes: >-
    Dominant-negative missense variants clustering in the ligand-binding
    domain hot spots that border the T3-binding pocket; 236 different
    mutations across 805 families had been reported as of 2021. Inheritance
    is typically autosomal dominant because the mutant receptor dimerizes
    with, and interferes with, the wild-type receptor; homozygous variants
    (lacking a wild-type allele) are clinically more severe. In about 14% of
    individuals with the RTH-beta phenotype no THRB mutation is identified.
  evidence:
  - reference: PMID:15988389
    reference_title: "Syndromes of thyroid hormone resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      About 85% of patients with RTH are harboring mutations in thyroid
      hormone receptor beta (TRB).
    explanation: Quantifies THRB as the causal gene in the large majority of RTH-beta cases.
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      236 different mutations in 805 families have been identified. They are
      located in the functional areas of the ligand (T3)-binding domain and
      adjacent hinge region.
    explanation: >-
      Quantifies the mutation spectrum and confirms the ligand-binding-domain
      and hinge-region clustering already modeled in the pathophysiology
      chain.
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The inheritance of RTHβ is typically autosomal dominant. This is
      explained by the formation of dimers between the mutant and normal
      (wild-type; WT) TH receptor (TR) interfering with the function of the
      WT TRβ.
    explanation: >-
      States the dominant-negative dimerization mechanism underlying
      autosomal dominant inheritance, directly supporting the
      genetic_context.functional_impact_category: DOMINANT_NEGATIVE modeling
      used on the corresponding pathophysiology node.
treatments:
- name: TRIAC (Triiodothyroacetic Acid) Therapy for RTH-beta
  description: >-
    TRIAC is a thyromimetic that binds thyroid hormone receptors with high
    affinity but is not well measured by standard T4/T3 assays; it acts on
    the mutant/wild-type receptor pool to relieve pituitary and peripheral
    hyperthyroid-range signaling while lowering circulating T4/T3, without
    exacerbating hormone resistance in already-resistant tissues.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tiratricol
      term:
        id: CHEBI:40021
        label: tiratricol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Tissue-Selective Peripheral Resistance
    treatment_effect: MODULATES
    description: >-
      TRIAC acts as a thyroid hormone receptor agonist to relieve
      hyperthyroid-range symptoms driven by relatively hormone-responsive
      tissues while lowering circulating free T4/T3 and resting energy
      expenditure, without worsening resistance in already hormone-resistant
      tissues (e.g., liver).
    evidence:
    - reference: PMID:41131705
      reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TRIAC therapy in RTHβ relieves hyperthyroid symptoms and lowers
        resting energy expenditure and circulating thyroid hormones without
        worsening hepatic hormone resistance or exacerbating cardiac
        thyromimetic activity.
      explanation: >-
        Direct clinical-trial evidence for the mechanism and effect of TRIAC
        therapy on the tissue-selective resistance/thyrotoxicosis balance in
        RTH-beta.
  evidence:
  - reference: PMID:41131705
    reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatment of resistance to thyroid hormone β (RTHβ) is challenging
      because features of hyperthyroidism in some tissues coexist with a
      hormone-resistant, hypothyroid state in other organs.
    explanation: >-
      Frames why RTH-beta cannot be treated with conventional
      antithyroid/levothyroxine approaches and motivates the
      receptor-selective TRIAC strategy.
  - reference: PMID:41131705
    reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nadir FT4 concentrations fell to within the reference interval in all
      but 1 patient
    explanation: >-
      Confirms TRIAC normalized free T4 into the reference interval in nearly
      all treated patients, not merely a partial reduction.
- name: Beta-Adrenergic Blockade (Atenolol) for RTH-beta Tachycardia
  description: >-
    Selective beta-blockade with atenolol is used to control the resting
    tachycardia produced by relatively intact TRα-mediated cardiac
    responsiveness to the elevated circulating hormone. Atenolol is preferred
    over non-selective agents because it does not inhibit peripheral T4-to-T3
    conversion, avoiding a further rise in T3.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atenolol
      term:
        id: CHEBI:2904
        label: atenolol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Resting Tachycardia
    treatment_effect: MODULATES
    description: >-
      Beta-adrenergic blockade symptomatically controls the tachycardia
      arising from relatively hormone-responsive cardiac TRα signaling,
      without correcting the underlying receptor defect.
    evidence:
    - reference: PMID:33176840
      reference_title: "Update on resistance to thyroid hormone syndromeβ."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Selective beta-blockers can be considered for patients with obvious
        tachycardia during resting. Because atenolol cannot inhibit the
        conversion of T4 to T3, it is the best choice for RTH-β with
        tachycardia.
      explanation: >-
        Directly recommends atenolol specifically (over non-selective
        beta-blockers) for RTH-beta tachycardia and states the rationale.
  evidence:
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      beta blockade may be employed to help with tachycardia
    explanation: Independent confirmation of beta-blockade as symptomatic tachycardia management.
- name: Supraphysiologic Intermittent Liothyronine (L-T3) and Avoidance of Ablative Therapy
  description: >-
    Because thyroidectomy and radioactive iodine reduce the intact wild-type
    receptor's compensatory hormone supply and leave persistently elevated
    TSH driving pituitary hyperplasia and recurrent goiter, ablative therapy
    is generally avoided in RTH-beta. Instead, supraphysiologic doses of
    liothyronine (L-T3) given intermittently (e.g., every other day) achieve
    a brief high peak that suppresses TSH and shrinks goiter, or improves
    ADHD/cognitive symptoms, without sustaining thyrotoxic hormone levels
    long enough to cause thyrotoxic side effects.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: liothyronine (L-T3)
      term:
        id: CHEBI:18258
        label: 3,3',5-triiodo-L-thyronine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Pituitary Thyrotroph Resistance to Feedback
    treatment_effect: MODULATES
    description: >-
      A brief supraphysiologic L-T3 peak given intermittently suppresses TSH
      below the level needed to drive thyroid growth, without sustaining
      elevated hormone long enough to produce thyrotoxic symptoms.
    evidence:
    - reference: PMID:33868182
      reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        An approach of administering supraphysiologic doses of T3 every other
        day
      explanation: >-
        States the intermittent supraphysiologic L-T3 dosing strategy used to
        suppress TSH and shrink goiter without inducing thyrotoxic symptoms.
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      radioactive iodine and surgical treatment are not recommended because
      they may lead to pituitary hyperplasia
    explanation: >-
      States directly that ablative therapy is not recommended in RTH-beta
      and names the specific complication (pituitary hyperplasia) it risks.
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Caution should be exercised in the reduction of TH levels with
      antithyroid medication and ablative therapies (radioactive iodine or
      surgery) as it leads to difficulty in the subsequent treatment of
      hypothyroidism.
    explanation: >-
      Independent confirmation of the avoid-ablative-therapy guidance and its
      rationale (subsequent hypothyroidism management difficulty).

        TRIAC therapy.
    interpretation_bands:
    - name: Elevated free T4 typical of untreated RTH-beta
      lower_bound: 23.0
      unit: pmol/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Increased circulating free T4
        term:
          id: HP:0033077
          label: Increased circulating free T4 concentration
      interpretation: >-
        Elevated free T4 alongside a non-suppressed TSH (rather than the
        suppressed TSH expected with primary hyperthyroidism) should prompt
        consideration of RTH-beta and THRB sequencing.
- name: Serum Thyroid-Stimulating Hormone (TSH)
  subtype: RTH-beta
  notes: >-
    The diagnostic hallmark of generalized RTH is that TSH is measurable and
    not suppressed despite elevated free thyroid hormone, in contrast to
    primary hyperthyroidism (thyrotoxicosis) where TSH is suppressed.
  presence: NORMAL
  reference_ranges:
  - loinc_term:
      id: LOINC:3016-3
      label: Thyrotropin [Units/volume] in Serum or Plasma
    unit: mU/L
    population: Adults with RTH-beta (Moran et al. cohort).
    evidence:
    - reference: PMID:41131705
      reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        without any rise in their serum TSH (baseline 2.1 mU/L vs
        posttreatment 1.7 mU/L; P = .65)
      explanation: >-
        Documents a normal-range TSH (2.1 mU/L) coexisting with an elevated
        free T4 (30 pmol/L) in the same untreated RTH-beta cohort — the
        paradoxical non-suppressed-TSH signature.
    interpretation_bands:
    - name: Non-suppressed (inappropriately normal) TSH despite elevated thyroid hormone
      lower_bound: 0.4
      upper_bound: 4.5
      unit: mU/L
      abnormal_flag: NORMAL
      phenotype_term:
        preferred_term: Inappropriately normal thyroid-stimulating hormone level
        term:
          id: HP:0033075
          label: Inappropriately normal thyroid-stimulating hormone level
      interpretation: >-
        A TSH within, or only mildly above, the standard reference interval
        is abnormal in the specific context of a concurrently elevated free
        T4/T3 — it should be suppressed in that setting, and its failure to
        suppress is the defining paradox of generalized RTH.
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inappropriate secretion of thyroid-stimulating hormone (TSH, normal or
      elevated).
    explanation: >-
      States directly that TSH secretion is inappropriate (not suppressed) in
      RTH-beta despite the concurrent free hormone elevation.
- name: Serum Free Triiodothyronine (Free T3)
  subtype: RTH-beta
  notes: >-
    Free/total T3 is elevated alongside free T4 in most RTH-beta patients
    (bound to HP:0011788 "Increased circulating free T3" as the closest
    available term); contrast with RTH-alpha, where T3 tends to be in the
    upper-normal to frankly high range but T4 is low-normal.
  presence: INCREASED
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increased serum levels of free triiodothyronine (FT3) and/or free
      thyroxine (FT4)
    explanation: Directly documents the elevated FT3/FT4 biochemical signature of RTH-beta.
genetic:
- name: THRB
  gene_term:
    preferred_term: THRB
    term:
      id: hgnc:11799
      label: THRB
  relationship_type: CAUSATIVE
  frequency: causes the majority (~85%) of clinically recognized generalized RTH
  notes: >-
    Dominant-negative missense variants clustering in the ligand-binding
    domain hot spots that border the T3-binding pocket.
  evidence:
  - reference: PMID:15988389
    reference_title: "Syndromes of thyroid hormone resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      About 85% of patients with RTH are harboring mutations in thyroid
      hormone receptor beta (TRB).
    explanation: Quantifies THRB as the causal gene in the large majority of RTH cases.
- name: THRA
  gene_term:
    preferred_term: THRA
    term:
      id: hgnc:11796
      label: THRA
  relationship_type: CAUSATIVE
  notes: >-
    Dominant-negative variants impairing TRα1-mediated transcription
    selectively in TRα-predominant tissues.
  evidence:
  - reference: PMID:32349464
    reference_title: "The Clinical Spectrum of Resistance to Thyroid Hormone Alpha in Children and Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resistance to thyroid hormone alpha occurs due to pathogenic,
      heterozygous variants in THRA.
    explanation: States THRA as the causal gene for RTH-alpha.
- name: SLC16A2
  gene_term:
    preferred_term: SLC16A2
    term:
      id: hgnc:10923
      label: SLC16A2
  relationship_type: CAUSATIVE
  notes: >-
    Loss-of-function variants in the neuronal T3 transporter MCT8, causing a
    non-receptor form of tissue-selective reduced thyroid hormone
    availability (brain) alongside peripheral thyrotoxicosis.
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disordered thyroid hormone transport, due to mutations in the SLC16A2
      gene encoding monocarboxylate transporter 8 (MCT8), is characterised by
      intellectual and motor disability resulting from cerebral hypothyroidism
      and chronic peripheral thyrotoxicosis.
    explanation: >-
      States SLC16A2/MCT8 as the causal gene for this non-receptor,
      transporter-based subtype and its tissue-divergent mechanism.
- name: SECISBP2
  gene_term:
    preferred_term: SECISBP2
    term:
      id: hgnc:30972
      label: SECISBP2
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants impairing selenocysteine incorporation, producing a
    generalized selenoprotein deficiency that secondarily disrupts deiodinase
    (DIO1/2/3) mediated T4-to-T3 conversion.
  evidence:
  - reference: PMID:16228000
    reference_title: "Mutations in SECISBP2 result in abnormal thyroid hormone metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deiodinases (DIOs) are selenoproteins involved in thyroid hormone
      metabolism.
    explanation: >-
      Establishes the deiodinase-selenoprotein link that connects SECISBP2
      loss to abnormal thyroid hormone metabolism.
treatments:
- name: TRIAC (Triiodothyroacetic Acid) Therapy for RTH-beta
  description: >-
    TRIAC is a thyromimetic that binds thyroid hormone receptors with high
    affinity but is not well measured by standard T4/T3 assays; it acts on
    the mutant/wild-type receptor pool to relieve pituitary and peripheral
    hyperthyroid-range signaling while lowering circulating T4/T3, without
    exacerbating hormone resistance in already-resistant tissues.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tiratricol
      term:
        id: CHEBI:40021
        label: tiratricol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Tissue-Selective Peripheral Resistance
    treatment_effect: MODULATES
    description: >-
      TRIAC acts as a thyroid hormone receptor agonist to relieve
      hyperthyroid-range symptoms driven by relatively hormone-responsive
      tissues while lowering circulating free T4/T3 and resting energy
      expenditure, without worsening resistance in already hormone-resistant
      tissues (e.g., liver).
    evidence:
    - reference: PMID:41131705
      reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TRIAC therapy in RTHβ relieves hyperthyroid symptoms and lowers
        resting energy expenditure and circulating thyroid hormones without
        worsening hepatic hormone resistance or exacerbating cardiac
        thyromimetic activity.
      explanation: >-
        Direct clinical-trial evidence for the mechanism and effect of TRIAC
        therapy on the tissue-selective resistance/thyrotoxicosis balance in
        RTH-beta.
  evidence:
  - reference: PMID:41131705
    reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatment of resistance to thyroid hormone β (RTHβ) is challenging
      because features of hyperthyroidism in some tissues coexist with a
      hormone-resistant, hypothyroid state in other organs.
    explanation: >-
      Frames why RTH-beta cannot be treated with conventional
      antithyroid/levothyroxine approaches and motivates the
      receptor-selective TRIAC strategy.
notes: >-
  This is the contrasting resistance-vs-deficiency entity to
  `Congenital_Hypothyroidism` and the `hypothyroidism_thyroid_hormone_deficiency`
  module: in RTH, circulating thyroid hormone is normal-to-elevated but target
  tissues under-respond to it, whereas hypothyroidism is a deficiency of
  circulating hormone itself. The two conditions are deliberately NOT modeled
  with `conforms_to` against the hypothyroidism module, since RTH's mechanism
  (receptor/transporter/metabolism resistance despite adequate-to-excess
  hormone) is the mechanistic inverse, not a variant, of hormone deficiency.
  The MCT8 (Allan-Herndon-Dudley) and SECISBP2 subtypes are curated in full as
  their own standalone entries (`Allan-Herndon-Dudley_Syndrome`,
  `SECISBP2_Deficiency`); the `has_subtypes` blocks here summarize their
  distinguishing mechanism and cross-reference rather than duplicate that
  content. No GeneReviews chapter was found specifically for generalized RTH
  (PubMed search for "resistance to thyroid hormone" + GeneReviews returned no
  hits as of this curation), so no GeneReviews baseline was available for Step
  3b of the curation workflow.

    snippet: >-
      Attention deficit disorder (ADHD), reported in 48-83% of individuals
      with RTHβ, is treated using conventional drugs.
    explanation: >-
      Directly states the reported frequency of ADHD in RTH-beta and names
      the finding explicitly, rather than a generic disease definition.
- name: Thyroid Nodules
  category: Endocrine
  subtype: RTH-beta
  description: >-
    Thyroid nodules, including rare reported cases of papillary thyroid
    carcinoma, may co-exist with RTH-beta; because thyroidectomy and
    radioactive iodine in RTH-beta leave persistently high TSH and difficult
    subsequent levothyroxine replacement, most nodules are managed
    conservatively.
  phenotype_term:
    preferred_term: Thyroid nodule
    term:
      id: HP:0025388
      label: Thyroid nodule
  evidence:
  - reference: PMID:33868182
    reference_title: "Resistance to Thyroid Hormone Beta: A Focused Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thyroid nodules are quite prevalent in the general population and thus
      may occasionally co-exist with RTHβ. Although the majority of thyroid
      nodules are benign and do not require surgical management, there are
      few reported cases of papillary thyroid carcinoma in patients with
      RTHβ.
    explanation: >-
      Documents thyroid nodules, including rare papillary carcinoma cases, as
      a recognized co-occurring finding in RTH-beta.
biochemical:
- name: Serum Free Thyroxine (Free T4)
  subtype: RTH-beta
  notes: >-
    Free T4 is elevated in essentially all untreated RTH-beta patients. The
    10.0-25.0 pmol/L band below is a conventional adult clinical laboratory
    reference interval with no single citable primary source (assay- and
    age-dependent), recorded here per the same convention used in
    Allan-Herndon-Dudley_Syndrome rather than attributed to a fabricated
    citation; the sourced RTH-beta anchor is the pretreatment cohort mean of
    30 pmol/L cited below.
  presence: INCREASED
  reference_ranges:
  - loinc_term:
      id: LOINC:14920-3
      label: Thyroxine (T4) free [Moles/volume] in Serum or Plasma
    lower_bound: 10.0
    upper_bound: 25.0
    unit: pmol/L
    population: >-
      Adults; conventional clinical laboratory interval, assay- and
      age-dependent.
    notes: >-
      This interval is a conventional adult clinical laboratory range with no
      single citable primary source, so it is recorded here rather than
      attributed to a fabricated citation. The RTH-beta-specific anchor that
      IS sourced is the pretreatment cohort mean of 30 pmol/L.
    evidence:
    - reference: PMID:41131705
      reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        normalized circulating free T4 (baseline free T4 30 pmol/L vs
        posttreatment 17 pmol/L; P = .007)
      explanation: >-
        Marked PARTIAL because it reports the pretreatment RTH-beta cohort
        mean (30 pmol/L, elevated above the conventional adult interval)
        rather than the reference interval itself; also documents that TRIAC
        normalized this value.
    interpretation_bands:
    - name: Elevated free T4 typical of untreated RTH-beta
      lower_bound: 25.0
      unit: pmol/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Increased circulating free T4
        term:
          id: HP:0033077
          label: Increased circulating free T4 concentration
      interpretation: >-
        Elevated free T4 alongside a non-suppressed TSH (rather than the
        suppressed TSH expected with primary hyperthyroidism) should prompt
        consideration of RTH-beta and THRB sequencing.
- name: Serum Thyroid-Stimulating Hormone (TSH)
  subtype: RTH-beta
  notes: >-
    The diagnostic hallmark of generalized RTH-beta is that TSH is measurable
    and not suppressed despite elevated free thyroid hormone, in contrast to
    primary hyperthyroidism (thyrotoxicosis) where TSH is suppressed. The
    0.4-4.0 mU/L band below is a conventional adult clinical laboratory
    reference interval with no single citable primary source, recorded here
    per the same convention used in Allan-Herndon-Dudley_Syndrome.
  presence: NORMAL
  reference_ranges:
  - loinc_term:
      id: LOINC:3016-3
      label: Thyrotropin [Units/volume] in Serum or Plasma
    lower_bound: 0.4
    upper_bound: 4.0
    unit: mU/L
    population: Adults; conventional clinical laboratory interval, assay-dependent.
    notes: >-
      This interval is a conventional adult clinical laboratory range with no
      single citable primary source and is recorded here rather than
      attributed to a fabricated citation. The RTH-beta-specific anchor that
      IS sourced is the pretreatment cohort mean TSH of 2.1 mU/L, which is
      squarely within this interval despite the concurrently elevated free T4.
    evidence:
    - reference: PMID:41131705
      reference_title: "TRIAC Therapy Relieves Hyperthyroid Symptoms, Lowering T4, T3, and Metabolic Rate in Resistance to Thyroid Hormone β."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        without any rise in their serum TSH (baseline 2.1 mU/L vs
        posttreatment 1.7 mU/L; P = .65)
      explanation: >-
        Marked PARTIAL because it reports the pretreatment cohort mean TSH
        (2.1 mU/L) rather than the reference interval itself; documents a
        normal-range TSH coexisting with an elevated free T4 (30 pmol/L) in
        the same untreated RTH-beta cohort, the paradoxical
        non-suppressed-TSH signature.
    interpretation_bands:
    - name: Non-suppressed (inappropriately normal) TSH despite elevated thyroid hormone
      lower_bound: 0.4
      upper_bound: 4.0
      unit: mU/L
      abnormal_flag: NORMAL
      phenotype_term:
        preferred_term: Inappropriately normal thyroid-stimulating hormone level
        term:
          id: HP:0033075
          label: Inappropriately normal thyroid-stimulating hormone level
      interpretation: >-
        A TSH within, or only mildly above, the standard reference interval
        is abnormal in the specific context of a concurrently elevated free
        T4/T3 — it should be suppressed in that setting, and its failure to
        suppress is the defining paradox of generalized RTH-beta.
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inappropriate secretion of thyroid-stimulating hormone (TSH, normal or
      elevated).
    explanation: >-
      States directly that TSH secretion is inappropriate (not suppressed) in
      RTH-beta despite the concurrent free hormone elevation.

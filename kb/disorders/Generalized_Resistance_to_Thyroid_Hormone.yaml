name: Generalized Resistance to Thyroid Hormone
creation_date: "2026-08-27T05:16:42Z"
category: Mendelian
disease_term:
  preferred_term: generalized resistance to thyroid hormone
  term:
    id: MONDO:0009043
    label: generalized resistance to thyroid hormone
parents:
- thyroid hormone resistance syndrome
- hyperthyroidism
description: >-
  Generalized resistance to thyroid hormone (MONDO:0009043) is the classic,
  autosomal dominant form of resistance to thyroid hormone beta (RTH-beta),
  caused by dominant-negative mutations in the thyroid hormone receptor beta
  (THRB) gene. It produces a paradoxical biochemical signature — elevated
  circulating free T4 and/or free T3 together with a non-suppressed (normal or
  inappropriately elevated) TSH — because the pituitary thyrotroph itself is
  hormone-resistant and fails to shut off TSH secretion despite high
  circulating hormone. The mutant receptor's mutations cluster in the
  ligand-binding domain: it retains its DNA-binding and heterodimerization
  functions but fails to release corepressor and recruit coactivators
  normally triggered by T3 binding, so it silences T3-target genes even in the
  presence of the co-expressed wild-type receptor. RTH-beta is further
  described by three overlapping clinical categories depending on which
  tissues manifest resistance — "generalized" (pituitary and peripheral
  tissues both resistant, the category MONDO:0009043 models), "pituitary"
  (hyperthyroid-range biochemistry with inappropriate TSH secretion), and
  "peripheral" (hypothyroid-range signs despite normal TSH) — though in
  practice the clinical spectrum is a continuum rather than three discrete
  entities, even among relatives sharing the same THRB mutation. This is the
  pathophysiological mirror image of thyroid hormone *deficiency* (see the
  `hypothyroidism_thyroid_hormone_deficiency` module and
  `Congenital_Hypothyroidism`): here, circulating hormone is normal-to-high but
  target tissues cannot use it, rather than hormone being insufficiently
  produced.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0009043
      label: generalized resistance to thyroid hormone
    mapping_predicate: skos:exactMatch
has_subtypes:
- name: RTH-beta
  display_name: RTH-beta (THRB dominant-negative)
  description: >-
    The classic and commonest form of generalized RTH (roughly 85% of cases),
    caused by heterozygous dominant-negative missense mutations in THRB that
    cluster in three hot-spot regions of the ligand-binding domain bordering
    the T3-binding pocket. The mutant TRβ retains DNA binding and RXR
    heterodimerization but binds T3 poorly and fails to release the
    NCoR/SMRT corepressor complex, so it continues to repress T3-target genes
    and dominantly inhibits the co-expressed wild-type receptor. Clinically
    heterogeneous, ranging from goiter and tachycardia (relative peripheral
    thyrotoxicosis in TRα-dominant tissues) to attention and learning
    difficulties, with biochemically elevated free T4/free T3 and a
    non-suppressed TSH.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0008569
        label: thyroid hormone resistance, generalized, autosomal dominant
      mapping_predicate: skos:exactMatch
  genes:
  - preferred_term: THRB
    term:
      id: hgnc:11799
      label: THRB
  inheritance:
  - name: Autosomal dominant (RTH-beta)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Most RTH-beta cases arise from heterozygous dominant-negative THRB
      mutations; a minority of families show autosomal recessive
      transmission (MONDO:0010131), reflecting complete rather than partial
      loss of corepressor-release function.
pathophysiology:
- name: THRB Dominant-Negative Receptor Formation
  description: >-
    Heterozygous missense mutations in THRB cluster in three hot-spot regions
    of the ligand-binding domain that border the T3-binding pocket. The
    mutant TRβ protein retains its DNA-binding domain and its capacity to
    heterodimerize with RXR at thyroid hormone response elements, but its
    hormone-binding pocket is distorted, so it binds T3 with markedly reduced
    affinity.
  role: trigger
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    allele_type: missense
  molecular_functions:
  - preferred_term: Thyroid hormone receptor (TRβ) DNA/RXR-binding activity
    term:
      id: GO:0004879
      label: nuclear receptor activity
  evidence:
  - reference: PMID:15988389
    reference_title: "Syndromes of thyroid hormone resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      these three clusters of mutations border the T3-binding pocket
    explanation: >-
      Localizes the RTH-beta mutation hot spots to the T3-binding pocket of
      the ligand-binding domain, consistent with a receptor that keeps its
      DNA-binding/dimerization function but loses normal hormone binding.
  downstream:
  - target: Impaired Corepressor Release at Thyroid Hormone Response Elements
- name: Impaired Corepressor Release at Thyroid Hormone Response Elements
  description: >-
    Because the mutant receptor cannot undergo the normal T3-induced
    conformational change, it fails to release the nuclear receptor
    corepressor complex (NCoR/SMRT) that is bound in the unliganded state, and
    correspondingly fails to recruit coactivators. The mutant receptor
    continues to occupy DNA at thyroid hormone response elements, so the
    corepressor block is not a loss of binding but a persistence of the
    repressive complex despite the presence of circulating hormone.
  role: amplifier
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Persistent NCoR/SMRT corepressor binding by mutant TRβ
    term:
      id: GO:0001222
      label: transcription corepressor binding
  evidence:
  - reference: PMID:15988389
    reference_title: "Syndromes of thyroid hormone resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      most TRB mutations impair the hormone binding to the receptor and
      interfere with the mechanism(s) of corepressor release and the
      consequent recruitment of coactivators
    explanation: >-
      Directly states the corepressor-release failure and coactivator
      recruitment failure that follow from impaired T3 binding.
  - reference: PMID:9647743
    reference_title: "Requirement of corepressor binding of thyroid hormone receptor mutants for dominant negative inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      association of corepressor with the RTH mutants through the hinge
      region is crucial for their dominant negative activity
    explanation: >-
      Cell-transfection evidence that continued corepressor association
      (rather than loss of DNA binding or RXR dimerization, which were
      unaffected) is the molecular requirement for dominant-negative activity.
  downstream:
  - target: Dominant-Negative Inhibition of Wild-Type Receptor Transcription
- name: Dominant-Negative Inhibition of Wild-Type Receptor Transcription
  description: >-
    Because the mutant receptor still dimerizes with RXR and binds DNA
    normally, it competes with the co-expressed wild-type TRβ (and TRα) for
    response-element occupancy and RXR partnering. The persistent
    corepressor complex it carries therefore silences T3-target gene
    transcription genome-wide, not only at alleles it occupies alone — the
    defining dominant-negative mechanism that distinguishes RTH-beta from a
    simple loss-of-function receptor null.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Dominant-negative suppression of thyroid hormone receptor signaling
    term:
      id: GO:0002156
      label: negative regulation of thyroid hormone receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:15988389
    reference_title: "Syndromes of thyroid hormone resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The lack of interaction with coactivators appears to be an additional
      mechanism for the dominant negative effects of mutant TRB on the
      transcriptional activity of the normal receptor.
    explanation: >-
      States explicitly that the mutant receptor suppresses transcriptional
      activity driven by the co-expressed normal (wild-type) receptor, the
      hallmark of a dominant-negative rather than simple loss-of-function
      mechanism.
  downstream:
  - target: Pituitary Thyrotroph Resistance to Feedback
  - target: Tissue-Selective Peripheral Resistance
- name: Pituitary Thyrotroph Resistance to Feedback
  description: >-
    Pituitary thyrotrophs predominantly express TRβ2. Dominant-negative
    inhibition of TRβ2-mediated transcription blunts the thyrotroph's ability
    to sense elevated circulating hormone, so the normal negative-feedback
    suppression of TSH secretion is lost even as free T4/T3 rise.
  role: amplifier
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Pituitary thyrotroph
    term:
      id: CL:0000476
      label: thyrotroph
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      inappropriate secretion of thyroid-stimulating hormone (TSH, normal or
      elevated).
    explanation: >-
      Documents the inappropriate (non-suppressed) TSH secretion that follows
      from thyrotroph resistance to the negative feedback signal.
  downstream:
  - target: Elevated Thyroid Hormone with Non-Suppressed TSH
- name: Tissue-Selective Peripheral Resistance
  description: >-
    Peripheral tissues vary in their relative TRα/TRβ expression, so the same
    circulating hormone excess produces a mixed clinical picture: TRβ-rich
    tissues (liver, pituitary) show blunted responsiveness (contributing to
    goiter from continued TSH drive), while TRα-predominant tissues (heart,
    bone) remain relatively hormone-responsive and show signs consistent with
    the elevated circulating hormone (tachycardia), producing the clinically
    heterogeneous, tissue-selective phenotype characteristic of RTH-beta.
  role: amplifier
  biological_scale: TISSUE
  evidence:
  - reference: PMID:31588528
    reference_title: "Syndromes of Resistance to Thyroid Hormone Action."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The phenotypic manifestations of RTHβ and RTHα are to some extent
      correlated with the degree of disruption and the tissue distribution of
      the TRs being characterized by variable coexistence of hypothyroid or
      thyrotoxic manifestations in RTHβ
    explanation: >-
      Directly attributes the mixed hypothyroid/thyrotoxic clinical picture of
      RTH-beta to differential tissue distribution of TRα versus TRβ.
  downstream:
  - target: Elevated Thyroid Hormone with Non-Suppressed TSH
- name: Elevated Thyroid Hormone with Non-Suppressed TSH
  description: >-
    The net systemic result of thyrotroph resistance and continued TSH drive
    on an otherwise intact thyroid gland is the paradoxical biochemical
    signature that defines generalized RTH: elevated circulating free T4
    and/or free T3 together with a measurable, non-suppressed TSH — a
    combination that in a gland with normal feedback would instead produce
    thyrotoxicosis with suppressed TSH.
  role: effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31588528
    reference_title: "Syndromes of Resistance to Thyroid Hormone Action."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      characterized by elevated circulating levels of T4 and T3 with
      measurable serum TSH concentrations
    explanation: >-
      States the defining paradoxical biochemical signature of generalized
      RTH directly.
  downstream:
  - target: Tissue-Selective Mixed Hypothyroid/Thyrotoxic Phenotype
- name: Tissue-Selective Mixed Hypothyroid/Thyrotoxic Phenotype
  description: >-
    Clinically, patients present with a heterogeneous mixture of features:
    goiter and attention/learning difficulties (relative hormone
    insensitivity in TRβ-predominant tissues) alongside resting tachycardia
    (relative hormone excess acting through relatively intact TRα in
    cardiac tissue). Severity and the balance of hypothyroid versus
    thyrotoxic features vary between and even within families carrying the
    same THRB mutation.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:33176840
    reference_title: "Update on resistance to thyroid hormone syndromeβ."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical manifestations of RTH-β vary from hyperthyroidism to
      hypothyroidism or simple goiter, and RTH-β is often misdiagnosed
      clinically.
    explanation: >-
      Documents the clinically heterogeneous, tissue-selective phenotype
      spanning apparent hyperthyroid and hypothyroid presentations.
  downstream:
  - target: Goiter
  - target: Resting Tachycardia
  - target: Attention Deficit Hyperactivity Disorder
  - target: Thyroid Nodules

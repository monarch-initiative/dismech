name: Generalized Resistance to Thyroid Hormone
creation_date: "2026-08-27T05:16:42Z"
category: Mendelian
disease_term:
  preferred_term: generalized resistance to thyroid hormone
  term:
    id: MONDO:0009043
    label: generalized resistance to thyroid hormone
parents:
- thyroid hormone resistance syndrome
- hyperthyroidism
description: >-
  Generalized resistance to thyroid hormone (RTH) is reduced target-tissue
  responsiveness to thyroid hormone. It produces a paradoxical biochemical
  signature — elevated circulating free T4 and/or free T3 together with a
  non-suppressed (normal or inappropriately elevated) TSH — because the
  pituitary thyrotroph itself is hormone-resistant and fails to shut off TSH
  secretion despite high circulating hormone. The classic and commonest form
  (RTH-beta) is caused by dominant-negative mutations in the thyroid hormone
  receptor beta (THRB) gene that cluster in the ligand-binding domain: the
  mutant receptor retains its DNA-binding and heterodimerization functions but
  fails to release corepressor and recruit coactivators normally triggered by
  T3 binding, so it silences T3-target genes even in the presence of the
  co-expressed wild-type receptor. A separate receptor form, RTH-alpha (THRA),
  produces a tissue-selective hypothyroid-like phenotype (growth retardation,
  constipation, skeletal and gut dysmotility features) with near-normal
  standard thyroid function tests, because the pituitary-thyroid feedback axis
  is governed predominantly by TRβ. Two further, mechanistically distinct
  "non-TR" forms of reduced tissue sensitivity to thyroid hormone are grouped
  under this same clinical umbrella: an MCT8 (SLC16A2) thyroid hormone
  transporter defect (Allan-Herndon-Dudley syndrome), and a SECISBP2
  selenoprotein-synthesis defect that impairs deiodinase-mediated T4-to-T3
  conversion. This is the pathophysiological mirror image of thyroid hormone
  *deficiency* (see the `hypothyroidism_thyroid_hormone_deficiency` module and
  `Congenital_Hypothyroidism`): in RTH, circulating hormone is normal-to-high
  but target tissues cannot use it, rather than hormone being insufficiently
  produced.

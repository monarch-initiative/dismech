    term:
      id: CHEBI:15361
      label: pyruvate
  locations:
  - preferred_term: islet of Langerhans
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  genes:
  - preferred_term: SLC16A1
    term:
      id: hgnc:10922
      label: SLC16A1
  evidence:
  - reference: PMID:17701893
    reference_title: "Physical exercise-induced hypoglycemia caused by failed silencing of monocarboxylate transporter 1 in pancreatic beta cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "These studies show that promoter-activating mutations in EIHI induce SLC16A1 expression in beta cells, where this gene is not usually transcribed, permitting pyruvate uptake and pyruvate-stimulated insulin release despite ensuing hypoglycemia."
    explanation: Promoter-reporter and expression work in beta cells establishes the ectopic MCT1 expression, the resulting pyruvate uptake, and the pyruvate-stimulated insulin release this node asserts.
  downstream:
  - target: Unregulated Beta-Cell Depolarization and Insulin Secretion
    description: >-

- name: EIHI
  display_name: Exercise-Induced Hyperinsulinism (HHF7; SLC16A1)
  subtype_term:
    preferred_term: exercise-induced hyperinsulinism
    term:
      id: MONDO:0012396
      label: exercise-induced hyperinsulinism
  genes:
  - preferred_term: SLC16A1
    term:
      id: hgnc:10922
      label: SLC16A1
  description: >-
    Dominantly inherited hyperinsulinism in which hypoglycemia is provoked by
    anaerobic exercise or by a pyruvate load rather than occurring in the fasting
    newborn. Promoter variants in SLC16A1 de-repress monocarboxylate transporter 1
    (MCT1) in the beta cell, where the transporter is normally silenced, so
    circulating pyruvate and lactate enter the cell, are oxidized, and trigger
    insulin release at a time when insulin should be suppressed. The defect is
    therefore one of failed cell-specific transcriptional silencing rather than of
    the K-ATP channel or of an enzyme step.
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Segregated as a dominant trait in two Finnish pedigrees mapped by
      genome-wide linkage.
  evidence:
  - reference: PMID:17701893
    reference_title: "Physical exercise-induced hypoglycemia caused by failed silencing of monocarboxylate transporter 1 in pancreatic beta cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Exercise-induced hyperinsulinism (EIHI) is a dominantly inherited hypoglycemic disorder characterized by inappropriate insulin secretion during anaerobic exercise or on pyruvate load."
    explanation: Defines the exercise- and pyruvate-provoked presentation and the dominant inheritance that distinguish this subtype from the fasting neonatal forms.
  - reference: PMID:17701893
    reference_title: "Physical exercise-induced hypoglycemia caused by failed silencing of monocarboxylate transporter 1 in pancreatic beta cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Mutational analysis of the promoter of the SLC16A1 gene, which encodes monocarboxylate transporter 1 (MCT1), located under the linkage peak, revealed changes in all 13 identified patients with EIHI."
    explanation: Attributes the disorder to SLC16A1 promoter variants in every patient studied, which is the gene binding on this row.


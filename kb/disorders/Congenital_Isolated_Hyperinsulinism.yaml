name: Congenital Isolated Hyperinsulinism
creation_date: "2026-06-17T22:45:00Z"
description: >-
  Congenital isolated hyperinsulinism is the most common cause of persistent
  hypoglycemia in infancy, caused by dysregulated, glucose-independent insulin
  secretion from pancreatic beta cells. The most frequent and severe forms arise
  from inactivating variants in the K-ATP channel genes ABCC8 and KCNJ11, which
  leave beta cells chronically depolarized and unable to suppress insulin
  release; additional genetic forms involve GLUD1, HADH, HNF4A, HNF1A, and GCK.
  The resulting hyperinsulinemic hypoglycemia suppresses ketogenesis and causes
  neuroglycopenia, with seizures and neurodevelopmental sequelae if hypoglycemia
  is untreated; diffuse, diazoxide-unresponsive disease may require near-total
  pancreatectomy.
category: Genetic

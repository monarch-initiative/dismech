    explanation: Beta-cell-specific Hnf4a deletion reproduces the insulin oversecretion and neonatal hypoglycemia this node asserts.
  - reference: PMID:17407387
    reference_title: "Macrosomia and hyperinsulinaemic hypoglycaemia in patients with heterozygous mutations in the HNF4A gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

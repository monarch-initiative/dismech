- name: Glutamate Dehydrogenase Dysregulation (Amino-Acid-Driven HI)
  description: >
    In a distinct mechanistic arm, dominant activating GLUD1 variants
    (hyperinsulinism-hyperammonemia syndrome) or recessive HADH/SCHAD deficiency
    increase glutamate dehydrogenase (GDH) activity in the beta cell. Leucine
    allosterically activates GDH, driving glutamate oxidation through the TCA
    cycle, raising the ATP/ADP ratio, and converging on the same K-ATP-channel
    closure and insulin-release pathway, producing protein/leucine-sensitive
    hypoglycemia. Increased GDH activity in liver/kidney also generates the mild
    hyperammonemia characteristic of HI/HA syndrome.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: INCREASED
  genes:
  - preferred_term: GLUD1
    term:
      id: hgnc:4335
      label: GLUD1
  - preferred_term: HADH
    term:
      id: hgnc:4799
      label: HADH
  evidence:
  - reference: PMID:25733449
    reference_title: "Molecular mechanisms of congenital hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in GLUD1 and HADH lead to leucine-induced HH, and these two genes encode the key enzymes glutamate dehydrogenase and short chain 3-hydroxyacyl-CoA dehydrogenase which play a key role in amino acid and fatty acid regulation of insulin secretion respectively."
    explanation: Establishes the GLUD1/HADH amino-acid-driven mechanism as a distinct cause of leucine-induced hyperinsulinism.
  - reference: PMID:21130127
    reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "amino acids can trigger release of insulin in response to the oxidation of amino acids through glutamate via GDH into the TCA cycle under allosteric activation of GDH by leucine."
    explanation: Describes how leucine-activated GDH converges on insulin secretion in the beta cell.
  downstream:
  - target: Unregulated Beta-Cell Depolarization and Insulin Secretion
    description: >-
      Increased GDH-driven glutamate oxidation raises the beta-cell ATP/ADP
      ratio, leading to K-ATP channel closure, membrane depolarization, and
      voltage-gated calcium channel activation — converging on the same
      depolarization-to-insulin-release pathway as K-ATP channel
      loss-of-function variants.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21130127
      reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "insulin secretion is stimulated by oxidation of glucose via an increase in ATP/ADP ratio which leads to closure of ATP-sensitive KATP channels, membrane depolarization, activation of voltage-gated calcium channels, an increase in cytosolic calcium, and a mobilization of insulin-containing vesicles to release insulin into the circulation."
      explanation: Establishes the shared ATP/ADP→K-ATP closure→depolarization→calcium→insulin pathway downstream of GDH activation.
  - target: Hyperammonemia
    description: GDH dysregulation in the HI/HA subtype produces persistent plasma ammonia elevation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21130127
      reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The other distinctive feature of the HI/HA Syndrome is a persistent elevation of plasma ammonia concentrations."
      explanation: The source identifies persistent hyperammonemia as a distinctive feature of the GLUD1 hyperinsulinism-hyperammonemia subtype.
- name: Glucokinase Glucose-Sensing Threshold Shift
  description: >
    Activating variants in GCK, the beta-cell glucose sensor, raise glucokinase
    catalytic efficiency and lower its glucose half-saturation concentration.
    Because glucokinase sets the glucose concentration at which glycolytic flux
    begins to raise the beta-cell ATP/ADP ratio, the whole secretory system is
    recalibrated downwards: insulin is released at plasma glucose levels that
    would normally silence it. The channel itself is intact, which is why this arm
    converges on the same depolarization node rather than replacing it.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  molecular_functions:
  - preferred_term: glucokinase activity
    term:
      id: GO:0004340
      label: glucokinase activity
    modifier: INCREASED
  locations:
  - preferred_term: islet of Langerhans
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  genes:
  - preferred_term: GCK
    term:
      id: hgnc:4195
      label: GCK
  evidence:
  - reference: PMID:37725835
    reference_title: "Phenotypic Characterization of Congenital Hyperinsulinism Due to Novel Activating Glucokinase Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Mutant enzymes had low glucose half-saturation concentration values and an increased enzyme activity index compared with wild-type GK."
    explanation: Enzyme kinetics on purified mutant glucokinase establish the increased catalytic activity and lowered glucose half-saturation bound here as increased glucokinase activity.
  - reference: PMID:37725835
    reference_title: "Phenotypic Characterization of Congenital Hyperinsulinism Due to Novel Activating Glucokinase Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "However, the threshold for glucose-stimulated insulin secretion in perifused glucokinase hyperinsulinism (GCK-HI) islets was decreased, and glucagon secretion was greatly suppressed."
    explanation: Perifusion of islets from three pancreatectomised GCK-HI patients measures the downward shift in the glucose threshold for insulin release that this node asserts.
  downstream:
  - target: Unregulated Beta-Cell Depolarization and Insulin Secretion
    description: >-
      A lowered glucose threshold for glycolytic flux raises the ATP/ADP ratio at
      subnormal glucose concentrations, closing intact K-ATP channels and
      depolarizing the beta cell when insulin should be suppressed.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased glucokinase flux raises the beta-cell ATP/ADP ratio at low glucose.
    evidence:
    - reference: PMID:37725835
      reference_title: "Phenotypic Characterization of Congenital Hyperinsulinism Due to Novel Activating Glucokinase Mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "However, the threshold for glucose-stimulated insulin secretion in perifused glucokinase hyperinsulinism (GCK-HI) islets was decreased, and glucagon secretion was greatly suppressed."
      explanation: The measured threshold shift is the step linking increased glucokinase activity to inappropriate insulin release.
- name: Ectopic Beta-Cell Monocarboxylate Transport
  description: >
    Monocarboxylate transporter 1 (MCT1, encoded by SLC16A1) is normally silenced
    in the beta cell, which is what keeps circulating pyruvate and lactate from
    acting as insulin secretagogues. Promoter variants that de-repress SLC16A1
    transcription in the beta cell let pyruvate enter, be oxidized, and stimulate
    insulin release. Because the trigger is an exogenous monocarboxylate rather
    than glucose, hypoglycemia appears after anaerobic exercise or a pyruvate load
    rather than on fasting.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: pyruvate transmembrane transport
    term:
      id: GO:1901475
      label: pyruvate transmembrane transport
    modifier: INCREASED

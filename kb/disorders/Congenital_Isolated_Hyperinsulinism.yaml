    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: Biallelic loss-of-function HADH variants are required.
  features: >-
    HADH encodes short-chain 3-hydroxyacyl-CoA dehydrogenase. Its loss causes
    protein- and leucine-sensitive hyperinsulinism by removing an inhibitory
    protein-protein interaction with glutamate dehydrogenase, which is why it sits
    on the same mechanism node as GLUD1 rather than on the channel node. Previous
    gene symbol HADHSC; SCHAD is an alias.
  case_fractions:

    evidence:
    - reference: PMID:17701893
      reference_title: "Physical exercise-induced hypoglycemia caused by failed silencing of monocarboxylate transporter 1 in pancreatic beta cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "These studies show that promoter-activating mutations in EIHI induce SLC16A1 expression in beta cells, where this gene is not usually transcribed, permitting pyruvate uptake and pyruvate-stimulated insulin release despite ensuing hypoglycemia."
      explanation: The cited conclusion links pyruvate uptake through ectopic MCT1 directly to insulin release during hypoglycemia.
- name: HNF4A-Dependent Fetal and Neonatal Beta-Cell Dysregulation
  description: >
    Heterozygous loss of hepatocyte nuclear factor 4-alpha produces a biphasic
    beta-cell phenotype: insulin oversecretion before and shortly after birth,
    with macrosomia and neonatal hypoglycemia, evolving into insufficient
    secretion and maturity-onset diabetes of the young in later life. The
    oversecretion phase is what places HNF4A in this entry; beta-cell-specific
    Hnf4a deletion in mouse reproduces it.

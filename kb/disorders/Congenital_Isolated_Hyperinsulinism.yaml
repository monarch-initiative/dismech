  features: >-
    HNF4A encodes hepatocyte nuclear factor 4 alpha. Heterozygous variants cause
    macrosomia with transient or persistent neonatal hyperinsulinaemic
    hypoglycaemia that later evolves into maturity-onset diabetes of the young,
    so the same allele is hypersecretory in the newborn and hyposecretory in the
    adult. Previous gene symbols TCF14, MODY and MODY1.
  case_fractions:
  - population: Norwegian nationwide CHI cohort, 2002 to June 2023
    case_fraction_percent: 1.3
    cohort_size: 77
    notes: HNF4A in 1 of 77 CHI probands (1.3%).
    evidence:
    - reference: PMID:38963811
      reference_title: "Clinical and Genetic Characteristics of Congenital Hyperinsulinism in Norway: A Nationwide Cohort Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "whereas variants in HADH, HNF4A, KCNJ11, and HK1 were identified in 1 proband each, the latter being noncoding."
      explanation: Reports one HNF4A proband in the cohort whose size is given in the same abstract.
  evidence:

name: Mitochondrial Complex I Deficiency Nuclear Type 31
creation_date: "2026-08-26T13:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial complex I deficiency, nuclear type 31
  term:
    id: MONDO:0032634
    label: mitochondrial complex I deficiency, nuclear type 31
description: >-
  An autosomal recessive, infantile-onset mitochondrial encephalomyopathy caused by
  biallelic loss-of-function variants in TIMMDC1, a nuclear-encoded assembly factor for
  the membrane arm of respiratory chain complex I. Children present in the first months
  of life with hypotonia, failure to thrive and poor feeding, then follow a progressive
  neurodegenerative course affecting the central and the peripheral nervous system
  together; the reported deep-intronic-variant cases have been fatal in early childhood.

  Two things make this entry worth curating beyond "another nuclear complex I gene".

  The first is that the disease is defined by a lesion exome sequencing cannot see. The
  recurrent allele, c.597-1340A>G (originally numbered c.596+2146A>G), sits deep inside
  intron 5 and acts as a splicing enhancer, licensing inclusion of an ~80 bp poison exon
  that frameshifts the transcript and destroys the protein. The gene was found only when
  Kremer and colleagues ran RNA sequencing across a cohort of exome-negative
  mitochondriopathy patients, and a later family lost years to the same blind spot -
  exome sequencing returned one heterozygous nonsense allele and stopped there, with the
  second allele recovered only by targeted intronic sequencing. The diagnostic route is
  therefore part of the disease description, not an aside.

  The second is that the biochemical screen is normal. Plasma lactate was not raised in
  the reported cases and routine metabolic investigation was unremarkable, so the usual
  triggers for suspecting mitochondrial disease are absent. The complex I deficiency is
  real but is only visible on muscle respiratory-chain enzymology or in patient
  fibroblasts, which is why this entry curates the negative biochemistry as an explicit
  claim rather than leaving it implied.

  Because the causal lesion is a splicing event rather than a missing coding sequence, it
  is correctable in principle at the RNA level, and splice-switching antisense
  oligonucleotides restore TIMMDC1 protein, complex I subunit abundance and mitochondrial
  respiration in patient fibroblasts. That work is preclinical and is curated as such.

parents:
- Mitochondrial Complex I Deficiency
- Mitochondrial Disease

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists. The literature comprises a small number of families:
    three unrelated families homozygous for the recurrent deep intronic allele in the
    2017 discovery report, a Dutch sibling pair reported in 2021, and a consanguineous
    sibship reported in 2022. The recurrent allele is present in gnomAD at roughly 1 in
    5,000, which bounds the carrier pool but not the disease frequency, since detection
    of the second allele depends on assays most laboratories do not run.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome sequencing data revealed a known, deep intronic pathogenic variant TIMMDC1
      c.597-1340A>G, also present in gnomAD (~1/5000 frequency), that enhances aberrant
      splicing.
    explanation: >-
      PARTIAL because it gives the population frequency of the recurrent allele, not a
      disease prevalence; the two are not interchangeable for a recessive condition whose
      second alleles are often missed.

pathophysiology:

- name: TIMMDC1 Poison-Exon Inclusion
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The recurrent pathogenic allele is not a coding change. c.597-1340A>G (equivalently
    c.596+2146A>G under the earlier transcript numbering) lies deep within intron 5 and
    acts as a splicing enhancer, causing an ~80 bp cryptic exon to be spliced into the
    mature transcript between exons 5 and 6. The inserted exon shifts the reading frame
    and introduces a premature termination codon (p.Gly199_Thr200ins5*), so the aberrant
    message is degraded by nonsense-mediated decay.

    Curated as the trigger node rather than as a variant annotation because the splicing
    event is the mechanism: everything downstream follows from the transcript, and the
    one available therapeutic handle acts here and nowhere else.
  genetic_context:
    gene:
      preferred_term: TIMMDC1
      term:
        id: hgnc:1321
        label: TIMMDC1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in the three discovery families and in the 2022 consanguineous sibship;
      compound heterozygous with the nonsense allele c.385C>T (p.Arg129*) in the 2021
      Dutch sibling pair.
  biological_processes:
  - preferred_term: pre-mRNA splicing of TIMMDC1 intron 5
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  - preferred_term: nonsense-mediated decay of the poison-exon transcript
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  downstream:
  - target: Loss of TIMMDC1 Protein
    causal_link_type: DIRECT
    description: >-
      Frameshift and premature stop leave no functional protein product.
  evidence:
  - reference: PMID:28604674
    reference_title: "Genetic diagnosis of Mendelian disorders via RNA sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One such event is found in the complex I assembly factor TIMMDC1 establishing a
      novel disease-associated gene.
    explanation: >-
      The gene-discovery claim, and the fact that what established it was an aberrant
      splicing event rather than a coding variant.
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This variant results in aberrant splicing of the TIMMDC1 transcript, with insertion
      of a poison exon that introduces a frameshift leading to a premature stop codon
      p.Gly199_Thr200ins5* and thus nonsense-mediated decay (NMD) of the aberrant
      transcript in patient cells.
    explanation: >-
      The full molecular sequence curated by this node: enhancer variant, poison exon,
      frameshift, premature stop, decay of the message.

- name: Loss of TIMMDC1 Protein
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    TIMMDC1 is a multi-pass inner mitochondrial membrane protein that acts as an assembly
    factor for complex I, and in particular for the biogenesis of the mitochondrially
    encoded core subunit ND1. Patient cells carrying the poison-exon allele have almost
    no detectable TIMMDC1 protein; in the discovery cohort the protein could not be
    detected at all by quantitative proteomics.

    The node is kept separate from the splicing node because it is the level at which the
    rescue experiments read out: restoring the protein is what the antisense
    oligonucleotides achieve, and what everything downstream is then measured against.
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  downstream:
  - target: Complex I Assembly Failure
    causal_link_type: DIRECT
    description: >-
      TIMMDC1 is required for assembly of the membrane arm and for ND1 module biogenesis;
      without it the holoenzyme does not mature.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using RNA and protein analysis we show almost complete loss of TIMMDC1 protein and
      compromised mitochondrial complex I function.
    explanation: >-
      Ties the absent protein directly to the functional complex I defect in the same
      patient cells.
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TIMMDC1 is a multi-pass membrane protein found within the inner mitochondrial
      membrane and implicated in the biogenesis of core complex I subunit ND1, one of the
      13 proteins encoded by mitochondrial DNA
    explanation: >-
      The protein's localisation and its specific assembly role, which is what makes its
      absence a complex I lesion rather than a general mitochondrial one.

- name: Complex I Assembly Failure
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Without TIMMDC1 the ND1 module fails to be built and the subunits that would have
    joined the holoenzyme are turned over instead. Quantitative proteomics on patient
    fibroblasts shows reduced ND1 together with reduced ND1-module subunits NDUFA8 and
    NDUFA13 and other complex I subunits, and the discovery cohort found globally
    decreased complex I subunit levels by both proteomics and western blot. The loss is
    of assembled complex rather than of transcription: the subunit genes are intact and
    the defect is post-translational.
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  molecular_functions:
  - preferred_term: NADH:ubiquinone oxidoreductase activity
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    description: >-
      Fewer mature holoenzymes means less NADH:ubiquinone oxidoreductase activity, with
      complexes II-V unaffected.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with its role in ND1 biogenesis, TIMMDC1 knockout or knockdown leads to
      turnover of ND1 module and other complex I subunits, reduced levels or absence of
      mature complex I, and a reduction in cellular oxygen consumption rate
    explanation: >-
      Names the assembly step that fails and the two consequences curated here and at the
      next node - loss of mature complex, and loss of respiration.
  - reference: PMID:28604674
    reference_title: "Genetic diagnosis of Mendelian disorders via RNA sequencing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Re-expression of TIMMDC1 in these cells increased complex I subunit levels
    explanation: >-
      The complementation experiment, which is the strongest evidence that the subunit
      loss is caused by absent TIMMDC1 rather than by anything else in the patient
      background: putting the protein back reverses it.
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      a Volcano plot expressing quantitative proteomics data showing a decreased abundance
      of TIMMDC1 and other complex I subunits in patient III-2 relative to healthy control
      (n = 5) whole fibroblasts.
    explanation: >-
      Grounds the "globally decreased complex I subunits" claim in this node's description
      with the actual proteomic measurement and its control comparator.

- name: Isolated Complex I Deficiency
  role: effector
  biological_scale: CELLULAR
  description: >-
    The biochemical signature is an isolated complex I defect: where skeletal muscle
    respiratory chain enzymology was performed in reported patients it confirmed complex
    I deficiency with the other complexes spared, and the discovery cohort found the same
    isolated pattern in muscle.

    This node carries the entry's most clinically consequential negative claim. Plasma
    lactate was not raised and routine metabolic investigation was unremarkable in the
    reported cases, so the deficiency is invisible to the screening tests that normally
    raise suspicion of mitochondrial disease. A normal lactate does not exclude this
    diagnosis.
  cell_types:
  - preferred_term: skeletal muscle cell
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  locations:
  - preferred_term: skeletal muscle
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Bioenergetic Failure in Neurons and Muscle
    causal_link_type: DIRECT
    description: >-
      Reduced electron entry at complex I lowers ATP output in the tissues least able to
      tolerate it.
  evidence:
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A muscle biopsy demonstrated complex I deficiency in brother 2.
    explanation: >-
      Direct biochemical confirmation in patient muscle.
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory findings and metabolic investigations revealed no specific
      abnormalities, notably no raised plasma lactate.
    explanation: >-
      The negative screening biochemistry, curated as its own claim because it is what
      makes the diagnosis easy to miss.
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      where documented, skeletal muscle respiratory chain enzymology confirmed isolated
      complex I deficiency
    explanation: >-
      Establishes that the defect is isolated to complex I across the reported cases, not
      a combined respiratory chain deficiency.

- name: Bioenergetic Failure in Neurons and Muscle
  role: effector
  biological_scale: CELLULAR
  description: >-
    Reduced complex I activity lowers mitochondrial ATP output. Patient fibroblasts show
    low basal oxygen consumption rate, low ATP production and low maximal respiration
    relative to controls, and these are the measurements that recover when the splicing
    lesion is corrected - which is what ties the bioenergetic phenotype to TIMMDC1 rather
    than to anything else in the patient background.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
  downstream:
  - target: Central and Peripheral Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from chronic ATP deficit to neuronal loss is the least characterised link
      in this chain and is inherited from the general mitochondrial-disease literature
      rather than demonstrated for TIMMDC1; typed INDIRECT_UNKNOWN_INTERMEDIATES for that
      reason.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient fibroblasts showed low basal levels of OCR, ATP production and maximal
      respiration that were significantly increased on SSO1 or SSO2, but not NC5,
      treatment
    explanation: >-
      Both halves matter: the deficit, and its correction by the allele-specific
      intervention with a non-targeting control unaffected.

- name: Central and Peripheral Neurodegeneration
  role: outcome
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The clinical syndrome is a mixed central and peripheral neurodegeneration. Reported
    children have hypotonia and developmental delay with a predominant sensorimotor
    axonal neuropathy, optic atrophy and cognitive deficit; some show basal ganglia
    lesions on MRI, and the course is progressive and has been fatal in early childhood
    in the reported deep-intronic cases.

    Marked PROVISIONAL: the clinical picture is well documented but no
    neuropathological or tissue-level study of TIMMDC1 disease has been published, so the
    tissue mechanism is assumed from the complex I deficiency rather than observed.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: peripheral sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  - preferred_term: peripheral nervous system
    term:
      id: UBERON:0000010
      label: peripheral nervous system
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an infantile-onset neurodegenerative disorder manifesting a predominant sensorimotor
      axonal neuropathy, optic atrophy, and cognitive deficit
    explanation: >-
      The combined central and peripheral phenotype that this node names.
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI showed transient lesions in the basal ganglia of brother 1.
    explanation: >-
      The imaging correlate, and the reason the basal ganglia are listed among this node's
      locations. Note the source's own word: the lesions were transient.


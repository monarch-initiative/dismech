  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      where documented, skeletal muscle respiratory chain enzymology confirmed isolated
      complex I deficiency
    explanation: >-
      Establishes both the assay and its consistent result across reported cases.
  notes: >-
    Measurement of respiratory chain complex activities in a skeletal muscle biopsy. In
    this disease it is the test that makes the biochemical diagnosis, because the routine
    metabolic screen does not. In the sibship reported in 2022 the muscle biopsy itself
    was inconclusive, so a normal or uninterpretable muscle result does not exclude the
    diagnosis either.

genetic:

- name: TIMMDC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TIMMDC1
    term:
      id: hgnc:1321
      label: TIMMDC1
  association: >-
    Biallelic loss-of-function variants in TIMMDC1 cause this disease. The gene was
    established in 2017 when RNA sequencing of exome-negative mitochondriopathy patients
    found the same deep intronic allele in three unrelated families from three different
    ethnicities, which is what carried the causality argument - a single family with a
    deep intronic variant of this kind would not have.

    Two allele classes are reported. The recurrent deep intronic enhancer variant
    c.597-1340A>G (c.596+2146A>G in the original numbering) is by far the most common and
    is present in gnomAD at roughly 1 in 5,000. Nonsense alleles also occur: c.385C>T
    (p.Arg129*) was found in trans with the intronic allele in a Dutch sibling pair.

    The practical point for a diagnostic laboratory is that exome sequencing sees the
    coding allele and not the intronic one, so a TIMMDC1 patient can present as an
    unsolved heterozygote. In the 2021 report that is exactly what happened, and the
    second allele was recovered only by targeted sequencing of the intron.
  evidence:
  - reference: PMID:28604674
    reference_title: "Genetic diagnosis of Mendelian disorders via RNA sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One such event is found in the complex I assembly factor TIMMDC1 establishing a
      novel disease-associated gene.
    explanation: >-
      The gene-disease claim in its original form.
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TIMMDC1 encodes an assembly protein of complex I and has been recently associated
      with early onset mitochondrial disease in three unrelated families.
    explanation: >-
      Independent restatement of the gene-disease relationship and of the size of the
      evidence base at that time.
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report illustrates the importance of considering mitochondrial disease even
      when laboratory findings are normal, and the added value of targeted sequencing of
      introns.
    explanation: >-
      The diagnostic consequence of the allele structure, stated by the source itself.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous; heterozygous parents are
    unaffected. Segregation was demonstrated formally in the consanguineous family, where
    both affected siblings were homozygous and every unaffected sibling was heterozygous
    or homozygous wild type.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results were consistent with autosomal recessive inheritance.
    explanation: >-
      The segregation conclusion drawn from Sanger genotyping of the whole pedigree.

progression:

- phase: Infantile presentation
  age_range: first months of life
  notes: >-
    Hypotonia, poor feeding and failure to thrive, with respiratory insufficiency in the
    most severe cases.
  evidence:
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presenting in infancy with hypotonia and respiratory insufficiency and a rapidly
      progressive and fatal disease course
    explanation: >-
      Establishes both the age at presentation and the trajectory that follows.

- phase: Progressive neurodegeneration
  notes: >-
    Developmental delay or regression, neuropathy, optic atrophy and in some children
    refractory epilepsy, progressing without remission. The tempo varies: the Dutch
    sibling pair was described as rapidly progressive and fatal, while other reported
    children survived into later childhood.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an infantile-onset neurodegenerative disorder manifesting a predominant sensorimotor
      axonal neuropathy, optic atrophy, and cognitive deficit
    explanation: >-
      The neurodegenerative phase and the deficits that accumulate through it.

diagnosis:

- name: RNA Sequencing of Patient Fibroblasts
  description: >-
    Transcriptome sequencing of patient-derived fibroblasts detects the aberrant splicing
    event and the reduced TIMMDC1 expression directly, without needing to interpret an
    intronic variant of unknown significance first. This is the assay that established the
    gene, and it remains the route that works when exome sequencing has failed.
  evidence:
  - reference: PMID:28604674
    reference_title: "Genetic diagnosis of Mendelian disorders via RNA sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we demonstrate the power of transcriptome sequencing to molecularly diagnose
      10% (5 of 48) of mitochondriopathy patients and identify candidate genes for the
      remainder.
    explanation: >-
      The diagnostic yield of the approach in the cohort in which TIMMDC1 was found.

- name: Targeted Intronic Sequencing of TIMMDC1
  description: >-
    Once one TIMMDC1 allele is known, the second can be recovered by sequencing the
    intronic region containing the recurrent enhancer variant. Standard exome capture does
    not cover it.
  evidence:
  - reference: PMID:33278652
    reference_title: "Deep intronic TIMMDC1 variant delays diagnosis of rapidly progressive complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report illustrates the importance of considering mitochondrial disease even
      when laboratory findings are normal, and the added value of targeted sequencing of
      introns.
    explanation: >-
      States the diagnostic recommendation this entry curates.

experimental_models:

- name: TIMMDC1 c.597-1340A>G patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Dermal fibroblasts from the two affected homozygous siblings, with heterozygous
    parental and unrelated healthy-control fibroblasts as comparators. Because the lesion
    is a splicing defect in a ubiquitously expressed gene, fibroblasts carry the full
    molecular phenotype - poison-exon transcript, absent protein, reduced complex I
    subunits and reduced respiration - which is why a skin biopsy substitutes for
    inaccessible neural tissue here.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  publication: PMID:35091571
  modeled_mechanisms:
  - target: Complex I Assembly Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient fibroblasts reproduce the assembly defect at the protein level - reduced
      TIMMDC1, ND1 and other complex I subunits by quantitative proteomics.
    limitations: >-
      Fibroblasts are not a neural or muscle cell type, so the model reports the molecular
      lesion faithfully while saying nothing about the tissue selectivity of the clinical
      phenotype, which is the part of this disease that is least explained.
    readouts:
    - name: Complex I subunit abundance by quantitative proteomics
      target: Complex I Assembly Failure
      direction: DECREASED
      interpretation: >-
        Reduced abundance of TIMMDC1 and of other complex I subunits in patient
        fibroblasts relative to healthy controls.
      evidence:
      - reference: PMID:35091571
        reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          a Volcano plot expressing quantitative proteomics data showing a decreased
          abundance of TIMMDC1 and other complex I subunits in patient III-2 relative to
          healthy control (n = 5) whole fibroblasts.
        explanation: >-
          The proteomic measurement behind this readout, with its control comparator.
    evidence:
    - reference: PMID:35091571
      reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using RNA and protein analysis we show almost complete loss of TIMMDC1 protein and
        compromised mitochondrial complex I function.
      explanation: >-
        Supports treating patient fibroblasts as informative for the assembly node.
  - target: Bioenergetic Failure in Neurons and Muscle
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The same cells reproduce the bioenergetic consequence, measured as respiration.
    limitations: >-
      MODERATE rather than HIGH because the node it models is about neurons and muscle
      and the measurement is in fibroblasts; the deficit is the same in kind but the
      tissue is not the affected one.
    readouts:
    - name: Basal oxygen consumption rate, ATP production and maximal respiration
      target: Bioenergetic Failure in Neurons and Muscle
      direction: DECREASED
      interpretation: >-
        Seahorse extracellular flux measurement showing low basal OCR, ATP production and
        maximal respiration in patient fibroblasts.
      evidence:
      - reference: PMID:35091571
        reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Patient fibroblasts showed low basal levels of OCR, ATP production and maximal
          respiration that were significantly increased on SSO1 or SSO2, but not NC5,
          treatment
        explanation: >-
          The measurement and its direction, together with the rescue arm.
    evidence:
    - reference: PMID:35091571
      reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Due to severe reduction in the abundance of TIMMDC1 protein and complex I subunits
        in the patient fibroblasts relative to controls, we predicted this would result in
        a substantial loss of mitochondrial function, particularly ATP production.
      explanation: >-
        States the reasoning connecting the assembly defect measured in these cells to the
        bioenergetic readout.
  - target: TIMMDC1 Poison-Exon Inclusion
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Treating the same fibroblasts with splice-switching oligonucleotides suppresses
      poison-exon inclusion and restores TIMMDC1 protein, which is the strongest available
      argument that the intronic variant is the cause rather than a bystander.
    limitations: >-
      The rescue is in cultured patient fibroblasts over 48 hours. Nothing here addresses
      delivery to the nervous system, durability, or whether correction after symptom
      onset would change the clinical course.
    readouts:
    - name: TIMMDC1 protein level after splice-switching oligonucleotide treatment
      target: TIMMDC1 Poison-Exon Inclusion
      direction: RESTORED
      interpretation: >-
        Western blot showing recovery of TIMMDC1 protein in oligonucleotide-treated
        patient fibroblasts against a non-targeting control oligonucleotide.
      evidence:
      - reference: PMID:35091571
        reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          As expected, TIMMDC1 protein levels recovered in SSO1 and SSO2 treated affected
          fibroblasts that had negligible basal levels as observed in NC5 treated
          fibroblasts
        explanation: >-
          The rescue measurement with its non-targeting control.
    evidence:
    - reference: PMID:35091571
      reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Quantitative proteomics and real-time metabolic analysis of mitochondrial function
        on patient fibroblasts treated with SSOs showed restoration of complex I subunit
        abundance and function.
      explanation: >-
        Supports the model as a rescue system for the splicing node, at both the proteomic
        and the functional level.

treatments:

- name: Splice-Switching Antisense Oligonucleotide (investigational)
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  description: >-
    Two splice-switching oligonucleotides, SSO1 and SSO2, target the region around the
    pathogenic intronic enhancer and suppress inclusion of the poison exon. In patient
    fibroblasts they restore normal TIMMDC1 message, restore protein to at least parental
    levels, restore complex I subunit abundance by quantitative proteomics, and raise
    oxygen consumption, ATP production and maximal respiration. A non-targeting control
    oligonucleotide does none of this.

    This is preclinical. It has been shown only in cultured patient fibroblasts, there is
    no animal work and no trial, and the approach would be allele-specific - it treats the
    splicing lesion, so it has nothing to offer a patient whose alleles are both nonsense
    variants. It is curated because the mechanism makes it the one plausible
    disease-modifying route in a disease that otherwise has none.

    On the structured detail below: the oligonucleotide suppresses inclusion of an
    aberrant pseudoexon rather than skipping a constitutive exon, and
    SPLICE_MODULATION_EXON_SKIPPING is the closest available enum value. Chemistry and
    conjugation are not stated in the source and are left absent rather than guessed.
  aso_details:
    aso_mechanism: SPLICE_MODULATION_EXON_SKIPPING
    target_gene:
      preferred_term: TIMMDC1
      term:
        id: hgnc:1321
        label: TIMMDC1
    target_transcript: TIMMDC1 pre-mRNA, intron 5 poison exon
  target_mechanisms:
  - target: TIMMDC1 Poison-Exon Inclusion
    description: >-
      Acts directly on the splicing event, upstream of everything else in this entry.
  evidence:
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have designed and applied two different splice-switching antisense
      oligonucleotides (SSO) to restore normal TIMMDC1 mRNA processing and protein levels
      in patients' cells.
    explanation: >-
      The intervention and what it restores.
  - reference: PMID:35091571
    reference_title: "Oligonucleotide correction of an intronic TIMMDC1 variant in cells of patients with severe neurodegenerative disorder."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      SSO-mediated therapy of this inevitably fatal TIMMDC1 neurologic disorder is an
      attractive possibility.
    explanation: >-
      PARTIAL because the source frames its own result as a possibility rather than a
      therapy; that framing is the reason this treatment is labelled investigational.

- name: Supportive and Symptomatic Care
  therapeutic_modality: OTHER
  description: >-
    There is no approved disease-modifying treatment. Management follows general practice
    for infantile mitochondrial disease: nutritional support for feeding difficulty and
    failure to thrive, antiepileptic treatment for seizures - which in the reported cases
    was resistant - respiratory support, physiotherapy, and genetic counselling for
    recurrence risk.

    No treatment term is bound because this names a package of care rather than one
    clinical action, and no TIMMDC1-specific efficacy data exist for any component of it.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Deliberately carries no evidence item. The claim that supportive care is what is
    available is a statement about the absence of alternatives, and no cited paper makes
    it as a finding; asserting it with a quote would misrepresent the source.

discussions:

- discussion_id: gap_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Central and Peripheral Neurodegeneration
  prompt: >-
    Why does a ubiquitously expressed complex I assembly factor produce a disease
    restricted to the nervous system, with optic atrophy and a sensorimotor axonal
    neuropathy rather than a generalised myopathy?
  rationale: >-
    Every measurement in this disease that shows a defect was made in fibroblasts, which
    are not clinically affected, while the tissues that fail clinically have never been
    examined. There is no neuropathology, no mouse model with a reported neurological
    phenotype, and no measurement in a neuronal cell type. The step from complex I
    deficiency to neuronal loss is therefore assumed rather than shown, which is why the
    corresponding causal edge is typed with unknown intermediates.
  proposed_experiments:
  - experiment_id: ipsc_neuron_complex_i
    name: Complex I assembly and respiration in patient-derived neurons
    description: >-
      Differentiate iPSC lines from a homozygous patient into cortical and sensory
      neurons, measure TIMMDC1 protein, complex I subunit abundance and oxygen consumption
      against isogenic corrected controls, and test whether the deficit is deeper in
      neurons than in the fibroblasts from the same individual.
    would_support:
    - pathophysiology#Central and Peripheral Neurodegeneration
    supporting_outcome:
    - >-
        Neurons show a larger fall in complex I activity or in respiratory reserve than
        donor-matched fibroblasts, giving a cell-intrinsic reason for the tissue
        selectivity.
    refuting_outcome:
    - >-
        Neurons and fibroblasts show the same magnitude of deficit, which would point the
        explanation away from cell-intrinsic bioenergetics and towards demand, reserve or a
        non-cell-autonomous factor.

- discussion_id: gap_undiagnosed_second_allele
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#Worldwide
  prompt: >-
    How many patients with unexplained infantile neurodegeneration carry one TIMMDC1
    allele and remain undiagnosed because the second is intronic?
  rationale: >-
    The recurrent intronic allele sits in gnomAD at roughly 1 in 5,000, which is not rare
    for a recessive disease allele, yet fewer than ten families have been reported. A
    documented case lost years to exactly this failure mode - exome sequencing found one
    nonsense allele and the intronic partner was recovered only on targeted testing. The
    gap between the allele frequency and the reported case count is the measurable
    quantity, and nobody has measured it.
  proposed_experiments:
  - experiment_id: timmdc1_targeted_reanalysis
    name: Targeted reanalysis of unsolved mitochondrial-disease exomes for a single TIMMDC1 allele
    description: >-
      Across an unsolved paediatric mitochondrial-disease cohort, identify probands
      carrying one rare TIMMDC1 loss-of-function allele and sequence the intron 5 region
      of the second allele; the same targeted-reanalysis design has already been
      productive for other recently described inborn errors.
    would_support:
    - genetic#TIMMDC1
    supporting_outcome:
    - >-
        Previously unsolved probands are resolved as TIMMDC1 compound heterozygotes,
        showing the reported case count understates the disease.
    refuting_outcome:
    - >-
        No additional cases are found, suggesting the reported families really are close to
        the whole of it and that the gnomAD allele is more often benign in trans than
        expected.

notes: >-
  Reference note. The deep-research report used for this entry cited the discovery paper
  as PMID:28607462. That identifier is not the Kremer et al. RNA-sequencing paper; the
  correct one is PMID:28604674, which is what this entry cites throughout and what was
  fetched into the reference cache. Anyone reconciling this entry against that report
  should use the identifier here.

  Variant numbering. Two HGVS strings appear in the literature for the same allele:
  c.596+2146A>G in the 2017 discovery paper and c.597-1340A>G in later reports, which
  reflect different reference transcripts rather than different variants. Both are used in
  this entry where the cited source used them.

  Named entity check. "Mitochondrial complex I deficiency, nuclear type 31" is one of a
  long numbered OMIM series, and much of the literature returned by a search for
  "TIMMDC1" concerns the protein's role in complex I biology in cell lines rather than
  this disease. Only papers reporting TIMMDC1-variant patients or their cells are cited
  for disease claims here.


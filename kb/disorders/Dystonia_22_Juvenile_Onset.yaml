inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous for truncating TSPOAP1 variants, with
    heterozygous parents. Consanguinity was present in one of the original
    families but not reported in the other.
  evidence:
  - reference: PMID:33539324
    reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe homozygous frameshift, nonsense, and missense variants in TSPOAP1, which encodes the active-zone RIM-binding protein 1 (RIMBP1), as a genetic cause of autosomal recessive dystonia in 7 subjects from 3 unrelated families."
    explanation: >-
      The gene-identification study reports homozygous variants as a cause of
      autosomal recessive dystonia. The 7 subjects include the 3 adult-onset
      missense carriers of the separate adult-onset entity; the recessive mode
      holds for both.
  - reference: PMID:41371074
    reference_title: "Expanding the genotypic and phenotypic spectrum of DYT-TSPOAP1: First report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Pathogenic variants in TSPOAP1, encoding RIMBP1, cause ultra-rare autosomal recessive dystonia (DYT-TSPOAP1/DYT-22), with only two reports worldwide."
    explanation: >-
      Independent later report restating the recessive inheritance as established
      background before describing two new patients.
pathophysiology:
- name: Biallelic TSPOAP1 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    Homozygous truncating TSPOAP1 variants (a frameshift and a nonsense variant in
    the original families; further truncating variants in later reports) are
    predicted to abolish RIMBP1, an active-zone protein of the presynaptic release
    machinery. Loss of RIMBP1 protein has not been measured in patient neurons;
    the loss-of-function reading rests on variant class and on the knockout mouse.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: TSPOAP1
    term:
      id: hgnc:16831
      label: TSPOAP1
  cellular_components:
  - preferred_term: presynaptic active zone
    term:
      id: GO:0048786
      label: presynaptic active zone
  downstream:
  - target: Impaired Coupling of Calcium Influx to Synaptic Vesicle Release
    description: >-
      RIM-binding proteins tie voltage-gated calcium channels to release-ready
      vesicles, so their loss is expected to make action-potential-evoked release
      slower and less reliable.
    evidence:
    - reference: PMID:26402606
      reference_title: "RIM-BPs Mediate Tight Coupling of Action Potentials to Ca(2+)-Triggered Neurotransmitter Release."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Deletion of RIM-BPs decelerated action-potential-triggered neurotransmitter release and rendered it unreliable, thereby impairing the fidelity of synaptic transmission."
      explanation: >-
        Measured in synapses lacking both RIM-BP1 and RIM-BP2, not RIMBP1 alone
        and not in patient cells, so the edge is inferred for this disease.
  - target: Cerebellar Purkinje Cell Dendritic and Synaptic Deficit
    description: >-
      Complete loss of RIMBP1 in mice reduces Purkinje cell dendritic arborization
      and cerebellar synapse number.
    evidence:
    - reference: PMID:33539324
      reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, complete loss of RIMBP1, known to reduce neurotransmission, led to motor abnormalities reminiscent of dystonia, decreased Purkinje cell dendritic arborization, and reduced numbers of cerebellar synapses."
      explanation: >-
        Knockout mouse result linking RIMBP1 loss to the cerebellar cellular
        deficit.
  evidence:
  - reference: PMID:33539324
    reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects carrying loss-of-function variants presented with juvenile-onset progressive generalized dystonia, associated with intellectual disability and cerebellar atrophy."
    explanation: >-
      Identifies the juvenile-onset phenotype with the loss-of-function
      genotype class.
  - reference: PMID:41371074
    reference_title: "Expanding the genotypic and phenotypic spectrum of DYT-TSPOAP1: First report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two unrelated patients with adolescent-onset generalized dystonia showing cranio-caudal progression due to novel truncating variants in the TSPOAP1 gene."
    explanation: >-
      Two further unrelated patients with truncating variants, extending the
      loss-of-function genotype class beyond the original families.
- name: Impaired Coupling of Calcium Influx to Synaptic Vesicle Release
  biological_scale: CELLULAR
  conforms_to: "synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit"
  description: >-
    Without RIM-binding proteins, release is not abolished but becomes slower and
    less reliable because calcium channels are not held close to primed vesicles.
    The single-protein (RIMBP1-only) effect and its magnitude in human motor
    circuits are inferred, and which neuronal population carries the defect that
    produces dystonia is unknown.
  biological_processes:
  - preferred_term: action-potential-evoked synaptic vesicle exocytosis
    modifier: ABNORMAL
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
  downstream:
  - target: Generalized dystonia
    description: >-
      The authors conclude that presynaptic active-zone dysfunction causes the
      dystonia; the circuit through which it acts is not identified.
    evidence:
    - reference: PMID:33539324
      reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings establish a direct link between dysfunction of the presynaptic active zone and dystonia and highlight the critical role played by well-balanced neurotransmission in motor control and disease pathogenesis."
      explanation: >-
        The authors' synthesis of human genetics, mouse and in vitro data. Marked
        INDIRECT because the release defect was not measured in patient neurons.
  evidence:
  - reference: PMID:26402606
    reference_title: "RIM-BPs Mediate Tight Coupling of Action Potentials to Ca(2+)-Triggered Neurotransmitter Release."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, we find that in murine synapses, RIM-BPs are not essential for neurotransmitter release as such, but are selectively required for high-fidelity coupling of action potential-induced Ca(2+) influx to Ca(2+)-stimulated synaptic vesicle exocytosis."
    explanation: >-
      Defines the normal role of RIM-BPs from RIM-BP1/RIM-BP2 double conditional
      knockout synapses in cultured neurons and calyx of Held.
- name: Cerebellar Purkinje Cell Dendritic and Synaptic Deficit
  biological_scale: CELLULAR
  description: >-
    Tspoap1-knockout mice show reduced Purkinje cell dendritic arborization and
    fewer cerebellar synapses. This is a mouse cellular finding. It is not linked
    here to patient cerebellar atrophy or to dystonia by an edge, because the
    source does not show that the cerebellar change causes either; nor is this
    node conformed to the cerebellar Purkinje degeneration module, since Purkinje
    neuron loss and cerebellar ataxia are not what the source reports.

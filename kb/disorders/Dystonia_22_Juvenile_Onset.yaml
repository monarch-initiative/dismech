name: Dystonia 22, Juvenile-Onset
creation_date: "2026-10-11T00:00:00Z"
category: Mendelian
synonyms:
- DYT22JO
- juvenile-onset dystonia 22
- juvenile-onset TSPOAP1-related dystonia
- DYT-TSPOAP1, juvenile-onset form
description: >-
  An ultra-rare autosomal recessive dystonia caused by biallelic loss-of-function
  variants in TSPOAP1, which encodes RIM-binding protein 1 (RIMBP1), a
  multidomain scaffold of the presynaptic active zone that binds RIM proteins and
  voltage-gated calcium channels. Affected individuals develop progressive
  generalized dystonia in late childhood or adolescence, predominantly affecting
  the upper body and spreading cranio-caudally, together with intellectual
  disability and cerebellar atrophy; eye movement abnormalities have also been
  reported. The disorder was defined in a Gujarati Indian family and an Estonian
  individual carrying homozygous frameshift and nonsense variants, and later
  reports from India have added unrelated patients with further truncating
  variants.

  The mechanism is inferred from mouse work rather than measured in patients.
  RIM-binding proteins are required for tight coupling of action-potential-evoked
  calcium influx to synaptic vesicle exocytosis, and Tspoap1-knockout mice show
  dystonia-like motor abnormalities, reduced Purkinje cell dendritic arborization
  and fewer cerebellar synapses. Whether the cerebellar changes cause the dystonia,
  and how the mouse findings relate to the progressive cerebellar atrophy seen on
  patient MRI, has not been established.

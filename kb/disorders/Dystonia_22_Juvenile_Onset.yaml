notes: >-
  Identifiers. MONDO:0957539 cross-references OMIM 620453 (phenotype) and
  DOID:0060966. OMIM 610764 is the TSPOAP1 gene entry, not a phenotype. OMIM
  620456 is dystonia 22, adult-onset (MONDO:0957542), the isolated adult-onset
  focal dystonia of homozygous p.Gly1808Ser carriers; it is also recessive, so the
  two entities differ by allele class and phenotype rather than by inheritance,
  and it is not curated in this entry.

  Relationship to dopa-responsive dystonia entries. Orphanet attaches TSPOAP1 to
  ORPHA:101150 (autosomal recessive dopa-responsive dystonia), and
  Dopa_Responsive_Dystonia lists rarer biallelic TSPOAP1 variants as a cause of
  AR-DRD. The sources cited here describe progressive generalized dystonia with
  intellectual disability and cerebellar atrophy and report no levodopa
  response, and no levodopa-response data for TSPOAP1 were found in the
  abstracts read. Autosomal_Recessive_Dopa_Responsive_Dystonia already excludes
  TSPOAP1 for this reason; the Dopa_Responsive_Dystonia wording disagrees with
  this entry and is left for that entry's curators to review.

  Treatment. No disease-specific treatment evidence is quotable. A single case of
  deep brain stimulation in a TSPOAP1-biallelic patient is reported in
  PMID:37850637, and a further homozygous case with childhood-onset generalized
  dystonia and cerebellar atrophy in PMID:42027086; neither PubMed record carries
  an abstract and no quotable text was retrieved on two fetches, so neither is
  used as evidence and no treatment is recorded. Features described only in the
  discovery paper's full text (dysarthria, dysphagia, seizures and spasticity in
  single patients, vermis-predominant atrophy, learning difficulty preceding
  motor onset) are not recorded, because the abstract does not state them.

  No GeneReviews chapter names this disease or its synonyms (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title search, 2026-10-11).

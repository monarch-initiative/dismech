genetic:
- name: TSPOAP1
  gene_term:
    preferred_term: TSPOAP1
    term:
      id: hgnc:16831
      label: TSPOAP1
  relationship_type: CAUSATIVE
  notes: >-
    TSPOAP1 (previous symbol BZRAP1; OMIM gene entry 610764) encodes RIMBP1. This
    entry covers only biallelic truncating, loss-of-function variants. The
    homozygous missense variant p.Gly1808Ser, reported in the same discovery study
    with isolated adult-onset focal dystonia and enhanced neurotransmission in
    vitro, defines the separate entity dystonia 22, adult-onset (MONDO:0957542,
    OMIM 620456) and is not recorded here. No ClinGen gene-disease validity
    record for TSPOAP1 is in references_cache, so no validity tier is recorded.
  evidence:
  - reference: PMID:33539324
    reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects carrying loss-of-function variants presented with juvenile-onset progressive generalized dystonia, associated with intellectual disability and cerebellar atrophy."
    explanation: Gene-identification study for the juvenile-onset loss-of-function form.
  - reference: PMID:41371074
    reference_title: "Expanding the genotypic and phenotypic spectrum of DYT-TSPOAP1: First report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two unrelated patients with adolescent-onset generalized dystonia showing cranio-caudal progression due to novel truncating variants in the TSPOAP1 gene."
    explanation: Independent replication with novel truncating variants.
animal_models:
- name: Tspoap1 knockout mouse
  species: Mouse
  genotype: Tspoap1(-/-) (complete RIMBP1 loss)
  publication: PMID:33539324
  description: >-
    Constitutive loss of RIMBP1 in mice, studied in the gene-identification paper
    to test whether loss of the protein produces motor and cerebellar
    abnormalities.
  modeled_mechanisms:
  - target: Cerebellar Purkinje Cell Dendritic and Synaptic Deficit
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      The knockout is the source of the cerebellar cellular node; whether patients
      have the same Purkinje dendritic and synaptic deficit is unknown.
    limitations: >-
      The mouse shows motor abnormalities described only as reminiscent of
      dystonia, and the human cerebellar findings are MRI atrophy rather than
      histology, so correspondence between the mouse cellular deficit and the
      human phenotype is assumed rather than shown.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse cerebellar and motor circuits differ from human ones, and
        dystonia-like behaviour in mice is not the same clinical sign as
        progressive generalized dystonia in patients.
    readouts:
    - name: Purkinje cell dendritic arborization and cerebellar synapse number
      target: Cerebellar Purkinje Cell Dendritic and Synaptic Deficit
      direction: DECREASED
      interpretation: Structural readout behind the cerebellar node.
      evidence:
      - reference: PMID:33539324
        reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mice, complete loss of RIMBP1, known to reduce neurotransmission, led to motor abnormalities reminiscent of dystonia, decreased Purkinje cell dendritic arborization, and reduced numbers of cerebellar synapses."
        explanation: Reports the decreased dendritic arborization and synapse number.
    evidence:
    - reference: PMID:33539324
      reference_title: "Biallelic variants in TSPOAP1, encoding the active-zone protein RIMBP1, cause autosomal recessive dystonia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, complete loss of RIMBP1, known to reduce neurotransmission, led to motor abnormalities reminiscent of dystonia, decreased Purkinje cell dendritic arborization, and reduced numbers of cerebellar synapses."
      explanation: Supports the knockout as informative for the cerebellar node.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0957539
      label: dystonia 22, juvenile-onset
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The entry and the MONDO class denote the same entity, the juvenile-onset

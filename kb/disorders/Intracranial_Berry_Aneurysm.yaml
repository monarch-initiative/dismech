notes: >-
  Curated claims are backed by cached PubMed/DOI abstracts and full-text articles
  plus ClinicalTrials.gov registry summaries, covering Harrison's classification,
  inheritance patterns, adult onset progression, 3.2% general-population point
  prevalence, gene-linked pathophysiology (THSD1, NPNT) and candidate
  susceptibility loci (CBY2), downstream
  phenotype connectivity across all clinical manifestations, tobacco smoking and
  hypertension risk factors, oral nimodipine and surgical/endovascular
  treatments, neurovascular diagnostic modalities, and syndromic/structural
  differential diagnoses. No standalone GeneReviews chapter exists for
  nonsyndromic intracranial berry aneurysm (MONDO:0016483); PMID:20301424 (the
  autosomal dominant polycystic kidney disease GeneReviews chapter) is cited
  specifically for high-risk adult MRA screening and the ADPKD differential
  diagnosis.

  evidence:
  - reference: PMID:33845117
    reference_title: "Oculomotor nerve palsy due to posterior communicating artery aneurysm: Clipping vs coiling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Posterior communicating artery aneurysms (PCoAA) usually present with brain hemorrhage, but they might present with oculomotor nerve palsy (ONP) in about one out of five patients.
    explanation: >-
      Posterior communicating artery aneurysms present with oculomotor nerve
      palsy in approximately one out of five patients.
  - reference: PMID:30592440
    reference_title: "The aetiologies of the unilateral oculomotor nerve palsy: a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oculomotor nerve palsy (ONP) is an important and common clinical diagnosis. Its main features are diplopia and ptosis. Its aetiologies are various and complex. A number of different conditions have been reported to cause ONP, such as diabetes mellitus, aneurysm, tumours, painful ophthalmoplegia, pituitary lesions, cavernous sinus lesions, central nervous system infections, and subarachnoid haemorrhage.
    explanation: >-
      Both intracranial aneurysm and subarachnoid hemorrhage are established
      causes of unilateral oculomotor nerve palsy presenting with diplopia and
      ptosis.
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Causes were trauma (26%), tumor (12%), diabetes (11%), aneurysm (10%), surgery (10%), stroke (8%), infection (5%), Guillain-Barre and Fisher syndromes (5%), idiopathic cavernous sinusitis (3%), benign self-limited (2%), miscellaneous (4%), and unknown (3%). ... Only 2% of aneurysms spared the pupil. Apainful onset occurred with 94% of aneurysm and 69% of diabetic cases.
    explanation: >-
      In a clinical cohort of 1,400 inpatients with third nerve (oculomotor)
      palsy, intracranial aneurysm accounted for 10% of cases, with painful
      onset in 94% and pupillary involvement in 98%.

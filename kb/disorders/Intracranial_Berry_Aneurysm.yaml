inheritance:
- name: Autosomal dominant familial susceptibility
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Familial intracranial aneurysm pedigrees can segregate rare deleterious
    variants such as THSD1 in an autosomal dominant pattern with variable
    clinical expression ranging from unruptured intracranial aneurysm to
    aneurysmal subarachnoid hemorrhage.
  evidence:
  - reference: DOI:10.1161/STROKEAHA.116.014161
    reference_title: "<i>THSD1</i>(Thrombospondin Type 1 Domain Containing Protein 1) Mutation in the Pathogenesis of Intracranial Aneurysm and Subarachnoid Hemorrhage"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A nonsense mutation inTHSD1was identified that segregated with the 9 affected (3 suffered subarachnoid hemorrhage and 6 had unruptured IA) and was absent in 13 unaffected family members (LOD score 4.69).
    explanation: >-
      Segregation of a heterozygous THSD1 nonsense mutation across nine affected
      relatives in a multiplex kindred supports autosomal dominant familial
      inheritance with variable rupture presentation.
- name: Complex polygenic and multifactorial susceptibility
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  description: >-
    Most intracranial berry aneurysms arise through a heterogeneous, polygenic,
    and multifactorial susceptibility architecture combining multiple genetic
    risk variants with hemodynamic stress and elevated blood pressure.
  evidence:
  - reference: DOI:10.1371/journal.pone.0265359
    reference_title: Whole-exome sequencing in a Japanese multiplex family identifies new susceptibility genes for intracranial aneurysms
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The highly heterogeneous and polygenic architecture of IA susceptibility can be uncovered by accumulating extensive analyses that focus on each pedigree with a high incidence of IA.
    explanation: >-
      The study highlights the heterogeneous and polygenic genetic architecture
      underlying intracranial aneurysm susceptibility.
progression:
- phase: Onset
  age_range: Adult (mean age 59.8 years, range 34-82 years in symptomatic posterior communicating artery aneurysm cohorts; meta-analysis study averages 49-73 years)
  notes: >-
    Intracranial berry aneurysms most frequently become clinically manifest in
    middle-aged and older adults, presenting either with cranial neuropathy from
    saccular mass effect or with acute subarachnoid hemorrhage upon rupture.
  evidence:
  - reference: PMID:30455133
    reference_title: "Posterior communicating aneurysm with oculomotor nerve palsy: Predictors of nerve recovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients consisted of 85 women and 17 men with a mean age of 59.8 years (range, 34-82 years), including 55 un-ruptured and 47 ruptured PComAAs.
    explanation: >-
      This clinical series of 102 patients with ruptured and unruptured
      posterior communicating artery aneurysms documents typical adult onset with
      a mean age of 59.8 years (range 34-82 years).
  - reference: PMID:39692993
    reference_title: "Oculomotor nerve palsy recovery following microsurgery vs. endovascular treatment of posterior communicating artery aneurysms: a comparative meta-analysis of short- and long-term outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The average age of patients ranged from 49 to 73 years in both treatment groups and 73% were females.
    explanation: >-
      Meta-analysis across posterior communicating artery aneurysm cohorts
      confirms adult onset with average patient ages ranging from 49 to 73 years.

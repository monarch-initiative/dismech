  name: Oculomotor nerve palsy
  description: >-
    Posterior communicating artery-region aneurysm enlargement or rupture can
    produce oculomotor nerve dysfunction with ptosis, diplopia, or
    ophthalmoplegia in approximately 20% of patients with posterior
    communicating artery aneurysms.
  frequency: 20% in posterior communicating artery aneurysms

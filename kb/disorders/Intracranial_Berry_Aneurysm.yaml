    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Subarachnoid hemorrhage
    term:
      id: HP:0002138
      label: Subarachnoid hemorrhage
  - preferred_term: Hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  target_mechanisms:
  - target: Aneurysm rupture
    treatment_effect: INHIBITS
    description: >-
      Acute blood-pressure control, antifibrinolytic therapy, external
      ventricular drainage, and early aneurysm repair stabilize the patient and
      prevent rebleeding after rupture.
    evidence:
    - reference: DOI:10.3390/neurolint17030036
      reference_title: Current Management of Aneurysmal Subarachnoid Hemorrhage
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment begins with immediate control of pain and blood pressure, placement of an external ventricular drain (EVD) in poor-grade patients and those with acute hydrocephalus on CT scanning, administration of antifibrinolytic tranexamic acid, and then repair of the aneurysm with either surgical clipping or endovascular techniques as soon as the appropriate treatment team can be assembled.
      explanation: >-
        Acute management protocol targets the immediate consequences of aneurysm
        rupture and prevents rebleeding.
  evidence:
  - reference: DOI:10.3390/neurolint17030036
    reference_title: Current Management of Aneurysmal Subarachnoid Hemorrhage
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment begins with immediate control of pain and blood pressure, placement of an external ventricular drain (EVD) in poor-grade patients and those with acute hydrocephalus on CT scanning, administration of antifibrinolytic tranexamic acid, and then repair of the aneurysm with either surgical clipping or endovascular techniques as soon as the appropriate treatment team can be assembled.
    explanation: >-
      The review summarizes acute supportive and definitive management steps for
      aneurysmal subarachnoid hemorrhage.
diagnosis:
- name: Non-contrast head computed tomography
  diagnosis_term:
    preferred_term: non-contrast head computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  presence: First-line emergency imaging for suspected aneurysmal subarachnoid hemorrhage and acute hydrocephalus
  description: >-
    Computed tomography of the head is the initial emergency imaging test for
    suspected ruptured intracranial aneurysm presenting with thunderclap
    headache and also identifies acute hydrocephalus requiring ventricular
    drainage.
  results: >-
    Demonstrates hyperdense subarachnoid blood and ventricular dilatation in
    acute hydrocephalus; small hemorrhages in good-grade patients can have
    subtle findings.
  evidence:
  - reference: DOI:10.3390/neurolint17030036
    reference_title: Current Management of Aneurysmal Subarachnoid Hemorrhage
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of aneurysmal subarachnoid hemorrhage (aSAH) is most difficult in patients who are in good clinical condition with a small hemorrhage, especially when a ruptured aneurysm might not be considered, or if a computed tomographic (CT) scan is not obtained, or if when a CT is obtained, the findings are subtle and missed by an inexperienced reviewer.
    explanation: >-
      Head CT is the essential initial diagnostic scan for detecting aneurysmal
      subarachnoid hemorrhage.
- name: Computed tomography angiography and cerebral perfusion CT
  diagnosis_term:
    preferred_term: computed tomography angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  presence: Vascular and perfusion imaging for intracranial aneurysm detection and post-rupture vasospasm evaluation
  description: >-
    CT vascular imaging and CT cerebral perfusion studies are used alongside
    clinical and Doppler monitoring to evaluate cerebral vasculature and detect
    delayed arterial vasospasm and cerebral ischemia after aneurysmal
    subarachnoid hemorrhage.
  results: >-
    Identifies intracranial arterial narrowing, aneurysm morphology, and
    regional perfusion deficits associated with delayed cerebral ischemia.
  evidence:
  - reference: DOI:10.3390/neurolint17030036
    reference_title: Current Management of Aneurysmal Subarachnoid Hemorrhage
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant and aneurysm-specific threat after aSAH is delayed arterial vasospasm and resulting cerebral ischemia, which is detected by vigilant bedside examinations for new-onset focal deficits or neurological decline, assisted with daily transcranial Doppler examinations and the judicious use of vascular imaging and cerebral perfusion studies with CT.
    explanation: >-
      Vascular imaging and cerebral perfusion studies with CT are used to
      detect delayed arterial vasospasm and cerebral ischemia in patients with
      ruptured intracranial aneurysms.
- name: Magnetic resonance angiography
  diagnosis_term:
    preferred_term: magnetic resonance angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  presence: Non-invasive screening for unruptured intracranial aneurysms in high-risk adults
  description: >-
    Magnetic resonance angiography (MRA) is used for non-invasive screening to
    detect unruptured intracranial aneurysms in adults at elevated familial or
    syndromic risk.
  results: >-
    Visualizes saccular outpouchings of intracranial arteries at the circle of
    Willis without ionizing radiation.
  notes: >-
    No standalone GeneReviews chapter exists for nonsyndromic intracranial
    berry aneurysm (MONDO:0016483); PMID:20301424 (the ADPKD GeneReviews
    chapter) is cited specifically for its high-risk adult MRA screening
    recommendation.
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRA examination for intracranial aneurysms in adults determined to be at high risk.
    explanation: >-
      Clinical practice recommendations support MRA screening to detect
      intracranial aneurysms in high-risk adults.
- name: Transcranial Doppler ultrasonography
  diagnosis_term:
    preferred_term: Transcranial Doppler Ultrasonography
    term:
      id: NCIT:C122930
      label: Transcranial Doppler Ultrasonography
  presence: Daily bedside monitoring for delayed arterial vasospasm after aneurysmal subarachnoid hemorrhage
  description: >-
    Daily transcranial Doppler ultrasonography assists bedside neurological
    examinations in detecting delayed arterial vasospasm after aneurysmal
    subarachnoid hemorrhage.
  results: >-
    Elevated intracranial arterial flow velocities indicate developing cerebral
    vasospasm.
  evidence:
  - reference: DOI:10.3390/neurolint17030036
    reference_title: Current Management of Aneurysmal Subarachnoid Hemorrhage
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant and aneurysm-specific threat after aSAH is delayed arterial vasospasm and resulting cerebral ischemia, which is detected by vigilant bedside examinations for new-onset focal deficits or neurological decline, assisted with daily transcranial Doppler examinations and the judicious use of vascular imaging and cerebral perfusion studies with CT.
    explanation: >-
      Daily transcranial Doppler ultrasonography is used to monitor for delayed
      arterial vasospasm following aneurysm rupture.
differential_diagnoses:
- name: Autosomal dominant polycystic kidney disease
  disease_term:
    preferred_term: autosomal dominant polycystic kidney disease
    term:
      id: MONDO:0004691
      label: autosomal dominant polycystic kidney disease
  description: >-
    Autosomal dominant polycystic kidney disease (ADPKD) confers an elevated
    risk of intracranial berry aneurysms and aneurysmal subarachnoid hemorrhage
    and should be distinguished from isolated nonsyndromic intracranial berry
    aneurysm.
  distinguishing_features:
  - Bilateral renal cysts and progressive kidney enlargement
  - Hepatic cysts and pathogenic PKD1 or PKD2 variants
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal dominant polycystic kidney disease (ADPKD) is generally a late-onset multisystem disorder characterized by bilateral kidney cysts, liver cysts, and an increased risk of intracranial aneurysms.
    explanation: >-
      ADPKD is a major syndromic cause of intracranial aneurysms distinguished
      by bilateral renal and hepatic cysts.
- name: Vascular Ehlers-Danlos syndrome
  disease_term:
    preferred_term: Ehlers-Danlos syndrome, vascular type
    term:
      id: MONDO:0017314
      label: Ehlers-Danlos syndrome, vascular type
  description: >-
    Vascular Ehlers-Danlos syndrome can present with intracranial aneurysm
    rupture and aneurysmal subarachnoid hemorrhage in young adults due to
    heritable connective tissue fragility.
  distinguishing_features:
  - Pathogenic COL3A1 variants affecting type III procollagen
  - Systemic arterial dissections, arterial tears, and hollow organ rupture
  evidence:
  - reference: PMID:34226255
    reference_title: "Vascular Ehlers-Danlos syndrome presenting in the ICU as aneurysmal subarachnoid haemorrhage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vascular Ehlers-Danlos syndrome is caused by mutations of COL3A1 gene coding for type III collagen. The main clinical features involve a propensity to arterial tears leading to several life-threatening conditions and intensive care unit admission. We, herein, report the case of a 34-year-old woman presenting with an aneurysmal subarachnoid haemorrhage.
    explanation: >-
      Vascular Ehlers-Danlos syndrome is a heritable connective-tissue disorder
      that can present as aneurysmal subarachnoid hemorrhage and is
      distinguished by COL3A1 mutations and systemic arterial fragility.
- name: Fibromuscular dysplasia
  disease_term:
    preferred_term: fibromuscular dysplasia
    term:
      id: MONDO:0006761
      label: fibromuscular dysplasia
  description: >-
    Fibromuscular dysplasia is a non-atherosclerotic arteriopathy that shares
    genetic susceptibility with intracranial aneurysm and predisposes to
    cervicocephalic and visceral arterial stenosis, dissection, and aneurysm.
  distinguishing_features:
  - Multifocal string-of-beads or focal non-atherosclerotic stenosis of renal and extracranial carotid or vertebral arteries
  evidence:
  - reference: DOI:10.1038/s41467-021-26174-2
    reference_title: Genetic investigation of fibromuscular dysplasia identifies risk loci and shared genetics with common cardiovascular diseases
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find significant genetic overlap between FMD and more common cardiovascular diseases and traits including blood pressure, migraine, intracranial aneurysm, and coronary artery disease.
    explanation: >-
      Fibromuscular dysplasia overlaps genetically and clinically with
      intracranial aneurysm and is distinguished by characteristic
      non-atherosclerotic arterial dysplasia across multiple vascular beds.
- name: Intracranial arteriovenous malformation
  disease_term:
    preferred_term: arteriovenous malformations of the brain
    term:
      id: MONDO:0007154
      label: arteriovenous malformations of the brain
  description: >-
    Intracranial arteriovenous malformations and other vascular malformations
    are major structural vascular causes of spontaneous intracranial hemorrhage
    and seizures in adults that must be differentiated from saccular berry
    aneurysms on neurovascular imaging.
  distinguishing_features:
  - Arteriovenous shunting through a vascular nidus without an intervening capillary bed on angiography
  evidence:
  - reference: PMID:12702837
    reference_title: "Prospective, population-based detection of intracranial vascular malformations in adults: the Scottish Intracranial Vascular Malformation Study (SIVMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intracranial vascular malformations (IVMs) are an important cause of intracranial hemorrhage, epilepsy, and long-term disability in adults.
    explanation: >-
      Intracranial vascular malformations are an important differential
      diagnosis for adult intracranial hemorrhage and seizures.

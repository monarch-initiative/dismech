    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An intracranial aneurysm (IA) is an abnormal ballooning ... of the major cerebral arteries. Its rupture can cause subarachnoid hemorrhage (SAH), one of the most severe forms of stroke, which has high rates of mortality and morbidity
    explanation: >-
      Intracranial aneurysms characteristically arise at the major cerebral
      arteries where hemodynamic stress is concentrated, and rupture causes
      high-morbidity subarachnoid hemorrhage.

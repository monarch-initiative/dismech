animal_models:
  - species: Mouse (Mus musculus)
    genotype: Fnip1 homozygous loss-of-function (ENU-derived recessive variant and constitutive knockout)
    category: Knockout
    description: >
      Fnip1-deficient mice are the defining model of IMD93 and reproduce both
      arms of the human disorder: profound B-cell deficiency arising from a
      developmental block at the pre-B-cell stage, and cardiomyopathy with left
      ventricular hypertrophy and myocardial glycogen accumulation accompanied
      by elevated AMPK gamma-2 activity. Heterozygous animals lose marginal
      zone B cells. The metabolic defects seen in patient B cells recapitulate
      this model.
    genes:
      - preferred_term: Fnip1
        term:
          id: hgnc:29418
          label: FNIP1
    associated_phenotypes:
      - Profound B-cell deficiency with pre-B-cell developmental arrest
      - Left ventricular hypertrophy with myocardial glycogen accumulation
      - Elevated AMPK gamma-2 activity in neonatal myocardium
    evidence:
      - reference: PMID:27303042
        reference_title: "Mutation of Fnip1 is associated with B-cell deficiency, cardiomyopathy, and elevated AMPK activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous FNIP1 deficiency resulted in profound B-cell deficiency, partially restored by overexpression of the antiapoptotic protein BCL2, whereas heterozygous deficiency caused a loss of marginal zone B cells."
        explanation: Establishes the B-cell phenotype and its gene-dosage sensitivity in the mouse model.
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "These defects recapitulated the Fnip1-/- animal model."
        explanation: >
          Confirms translational fidelity: patient B-cell metabolic defects
          match those of the Fnip1-null mouse.

treatments:
  - name: Immunoglobulin Replacement Therapy
    description: >
      Regular immunoglobulin replacement (IVIg or SCIG) is the mainstay of
      management, supplying the antibody the patient cannot produce. Reported
      patients achieved normal IgG trough levels with marked reduction in
      sinopulmonary infections and substantial improvement in gastrointestinal
      symptoms.
    therapeutic_modality: PROTEIN_REPLACEMENT
    treatment_term:
      preferred_term: intravenous immunoglobulin therapy
      term:
        id: NCIT:C121331
        label: Intravenous Immunoglobulin Therapy
    target_mechanisms:
      - target: Absent Circulating B Cells and Agammaglobulinemia
        treatment_effect: BYPASSES
        description: >
          Exogenous polyclonal IgG substitutes for the antibody the arrested
          B-cell compartment cannot make; it bypasses rather than corrects the
          pre-B-cell developmental block.
    evidence:
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "She was treated with supplemental intravenous immunoglobulins (IVIg) with good control of sinopulmonary and gastrointestinal manifestations."
        explanation: Clinical benefit of IVIg on the infectious and gastrointestinal burden.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "treatment with monthly intravenous immunoglobulin (IVIg) infusion was initiated, achieving normal IgG levels and exhibiting marked improve"
        explanation: Documents normalization of IgG and improvement in infection frequency on monthly IVIg.

  - name: Granulocyte Colony-Stimulating Factor
    description: >
      G-CSF is used in the subset of patients with severe or chronic
      neutropenia and its complications (recurrent gingivitis, perianal
      abscesses); the neutropenia has been documented as G-CSF-responsive.
      Not indicated in patients with normal neutrophil counts.
    therapeutic_modality: PROTEIN_REPLACEMENT
    treatment_term:
      preferred_term: granulocyte colony-stimulating factor therapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: recombinant G-CSF
          term:
            id: NCIT:C1287
            label: Recombinant Granulocyte Colony-Stimulating Factor
    target_mechanisms:
      - target: Impaired Neutrophil Homeostasis
        treatment_effect: MODULATES
        description: >
          Pharmacologic G-CSF drives granulopoiesis, raising neutrophil counts
          in the neutropenic subset of patients.
    evidence:
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "which was responsive to granulocyte-colony stimulating factor"
        explanation: Documents G-CSF responsiveness of the neutropenia in a FNIP1-deficient patient.

  - name: Heart Failure Pharmacotherapy
    description: >
      Supportive cardiac pharmacotherapy for the hypertrophic cardiomyopathy
      and its haemodynamic consequences. Reported regimens have included an
      ACE inhibitor (captopril), a loop diuretic (furosemide), antiplatelet
      therapy (acetylsalicylic acid), and carnitine in one patient, and digoxin
      in another. These are symptomatic measures; none targets the underlying
      AMPK gain-of-function lesion.
    notes: >
      SAFETY CAVEAT: the afterload-reducing ACE inhibitor and the loop diuretic
      quoted below were used in a patient whose cardiomyopathy was not
      documented as obstructive. Vasodilators and aggressive diuresis are
      relatively contraindicated in obstructive HCM, where reducing preload or
      afterload worsens the left ventricular outflow tract gradient — and
      hypertrophic OBSTRUCTIVE cardiomyopathy is documented in this same
      cohort (PMID:39537849). This regimen must therefore not be generalised
      across IMD93 without echocardiographic assessment for outflow tract
      obstruction. No FNIP1-specific cardiology guideline exists; the
      contraindication is standard HCM management rather than a
      disorder-specific finding, so it is recorded here as a curator note
      rather than as an evidence-backed assertion.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: captopril
          term:
            id: CHEBI:3380
            label: captopril
        - preferred_term: furosemide
          term:
            id: CHEBI:47426
            label: furosemide
    evidence:
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "she is also treated with acetylsalicylic acid, captopril, furosemide, and carnitine achieving normal growth and no physical limitations."
        explanation: Documents the supportive cardiac drug regimen used in a FNIP1-deficient patient.

  - name: Rate Control and Arrhythmia Management
    description: >
      Negative-inotropic rate control — a beta-adrenergic antagonist, or a
      non-dihydropyridine calcium channel blocker (verapamil, diltiazem) as an
      alternative — is the standard first-line pharmacotherapy for symptomatic
      hypertrophic cardiomyopathy, improving diastolic filling and reducing any
      outflow tract gradient, in contrast to the vasodilators and diuretics
      that are relatively contraindicated when obstruction is present.
      Catheter ablation of the accessory pathway is the definitive treatment
      for symptomatic or high-risk ventricular pre-excitation.
    notes: >
      Standard-of-care extrapolation from hypertrophic cardiomyopathy and
      Wolff-Parkinson-White management; NOT specifically trialled in IMD93 and
      not reported in any published FNIP1-deficient patient, so no evidence
      item is attached. Included because the disorder's documented HCM and
      pre-excitation make these the conventional interventions, and because
      the negative-inotrope-versus-vasodilator distinction is a genuine safety
      point for this phenotype.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: beta-adrenergic antagonist
          term:
            id: NCIT:C29576
            label: Beta-Adrenergic Antagonist
        - preferred_term: verapamil
          term:
            id: CHEBI:9948
            label: verapamil
    target_mechanisms:
      - target: Ventricular Pre-excitation and Tachyarrhythmia
        treatment_effect: INHIBITS
        description: >
          Rate control suppresses the tachyarrhythmia; catheter ablation
          eliminates the accessory atrioventricular pathway that carries the
          pre-excitation.

  - name: Genetic Counseling
    description: >
      Genetic counseling for the family once biallelic FNIP1 loss of function
      is confirmed, covering the 25% recurrence risk of an autosomal recessive
      disorder, carrier testing of parents and siblings, and reproductive
      options. Particularly relevant here because reported families include
      consanguineous pedigrees and because an undiagnosed sibling died of
      cardiogenic shock in infancy before genetic evaluation was possible.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: genetic counseling
      term:
        id: NCIT:C15240
        label: Genetic Counseling
    evidence:
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "enabling genetic counseling as herein"
        explanation: >
          The authors present genetic counseling as a direct benefit of
          establishing the molecular diagnosis in this disorder.

  - name: Cardiac Surveillance
    description: >
      Because cardiac involvement can be the presenting and life-limiting
      feature — including fatal cardiogenic shock in infancy — echocardiographic
      and electrocardiographic surveillance for hypertrophic cardiomyopathy,
      valvular disease, and pre-excitation is a core component of management
      for any patient with confirmed FNIP1 deficiency.
    therapeutic_modality: OTHER
    treatment_term:
      preferred_term: cardiac monitoring
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Her sibling (subject II-1) had similar clinical features, along with dysmorphic facial features and hypotony, and succumbed to cardiogenic shock at the age of 2 months, prior to genetic evaluation."
        explanation: >
          Illustrates the lethal potential of unrecognised cardiac involvement,
          motivating systematic cardiac surveillance.

diagnosis:
  - name: Molecular genetic testing with copy-number analysis
    description: >
      Definitive diagnosis rests on demonstrating biallelic FNIP1
      loss-of-function. Exome sequencing alone can be insufficient: reported
      patients have required copy-number variant analysis or detection of
      uniparental disomy to establish biallelic inactivation, so CNV analysis
      should accompany sequencing when a single heterozygous FNIP1 variant is
      found in a compatible phenotype.
    diagnosis_term:
      preferred_term: molecular genetic testing
      term:
        id: NCIT:C19770
        label: Molecular Analysis
    evidence:
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The results indicate that FNIP1 deficiency can be caused by complex genetic mechanisms and support the clinical utility of exome sequencing and CNV analysis in patients with broad phenotypes, including agammaglobulinemia and HCM."
        explanation: >
          Directly recommends combined exome plus CNV analysis for this
          diagnostic scenario.

  - name: Lymphocyte immunophenotyping and immunoglobulin quantification
    description: >
      Flow-cytometric enumeration of B (CD19+/CD20+) and T (CD3+) lymphocytes
      together with quantitative serum IgG, IgA, and IgM establishes the
      characteristic pattern of absent B cells with pan-isotype
      hypogammaglobulinemia and preserved or mildly increased T cells.
    diagnosis_term:
      preferred_term: lymphocyte immunophenotyping
      term:
        id: NCIT:C16585
        label: Flow Cytometry
    evidence:
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immunological abnormalities in the peripheral blood show strongly diminished (nearly absent)  B cell number s and severe reduction s in all serum immunoglobulin isotypes"
        explanation: >
          Defines the immunophenotypic and immunochemical pattern that raises
          suspicion of FNIP1 deficiency.

differential_diagnoses:
  - name: X-linked agammaglobulinemia (BTK deficiency)
    description: >
      The prototypical agammaglobulinemia with absent B cells and recurrent
      sinopulmonary infection with encapsulated organisms. Distinguished from
      IMD93 by X-linked (not autosomal recessive) inheritance, absence of
      cardiac involvement, and a block earlier in B-cell development with
      normal numbers of pro-B cells.
    evidence:
      - reference: PMID:35748970
        reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "Severe bacterial infections, normal numbers of pro-B cells"
        explanation: >
          The IUIS table records the classical agammaglobulinemias as having
          normal pro-B cell numbers and severe bacterial infection without a
          cardiac axis.

  - name: Autosomal recessive agammaglobulinemia (IGHM, IGLL1, CD79A/B, BLNK, PIK3R1)
    description: >
      The autosomal recessive agammaglobulinemias share absent B cells and
      agammaglobulinemia with IMD93 and sit in the same IUIS category, but lack
      hypertrophic cardiomyopathy and pre-excitation. The presence of infantile
      hypertrophic cardiomyopathy in an agammaglobulinemic child should prompt
      FNIP1 testing specifically.
    evidence:
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FNIP1 loss-of-function should be considered in patients presenting in infancy with cardiac manifestations along with agammaglobulinemia (and B-cell lymphopenia)."
        explanation: >
          States the discriminating clinical rule — cardiac involvement plus
          agammaglobulinemia points to FNIP1 rather than the other
          agammaglobulinemias.

  - name: PRKAG2 glycogen-storage cardiomyopathy
    description: >
      Gain-of-function mutations in the AMPK gamma-2 subunit (PRKAG2) cause
      hypertrophic cardiomyopathy with myocardial glycogen accumulation and
      ventricular pre-excitation — the closest cardiac mimic of IMD93, and
      mechanistically the same AMPK gain-of-function endpoint. PRKAG2 disease
      is autosomal dominant and has no immunologic phenotype.
    evidence:
      - reference: PMID:27303042
        reference_title: "Mutation of Fnip1 is associated with B-cell deficiency, cardiomyopathy, and elevated AMPK activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "with close parallels to mice and humans bearing gain-of-function mutations in the γ2 subunit of AMPK"
        explanation: >
          Explicitly draws the parallel between FNIP1-deficient cardiomyopathy
          and AMPK gamma-2 (PRKAG2) gain-of-function disease.

  - name: Danon disease
    description: >
      An X-linked LAMP2 deficiency causing a cardiac glycogen-storage
      cardiomyopathy with massive ventricular hypertrophy and ventricular
      pre-excitation — the same cardiac triad as IMD93 — but accompanied by
      skeletal myopathy and intellectual disability rather than
      agammaglobulinemia, and with no B-cell or immunoglobulin defect.
      Curated separately in dismech as `Danon_disease`.
    disease_term:
      preferred_term: Danon disease
      term:
        id: MONDO:0010281
        label: Danon disease
    distinguishing_features:
      - X-linked LAMP2 inheritance rather than autosomal recessive FNIP1
      - Normal B-cell counts and normal serum immunoglobulins
      - Skeletal myopathy and intellectual disability
      - Autophagic vacuoles with sarcolemmal features on muscle biopsy

  - name: Pompe disease (glycogen storage disease type II)
    description: >
      Acid alpha-glucosidase (GAA) deficiency causing infantile-onset
      hypertrophic cardiomyopathy with lysosomal glycogen storage and a short
      PR interval, closely mimicking the IMD93 cardiac presentation in the
      first months of life. Distinguished by profound hypotonia and skeletal
      myopathy, a deficient GAA enzyme assay, and an intact humoral immune
      system.
    disease_term:
      preferred_term: glycogen storage disease II
      term:
        id: MONDO:0009290
        label: glycogen storage disease II
    distinguishing_features:
      - Deficient GAA enzyme activity on dried blood spot or fibroblast assay
      - Profound hypotonia with skeletal muscle involvement
      - Normal B cells and serum immunoglobulins
      - Treatable with enzyme replacement therapy

discussions:
  - discussion_id: imd93_neuro_myopathic_features_attribution
    kind: KNOWLEDGE_GAP
    prompt: >
      Are the neurologic and myopathic features reported in some
      FNIP1-deficient patients (microcephaly, developmental delay, muscular
      hypotonia, cerebellar hypoplasia, metabolic myopathy) genuinely part of
      IMD93, or do they reflect additional, as-yet-unidentified genetic factors
      segregating in the consanguineous pedigrees in which they were observed?
    rationale: >
      OMIM 619705 and MONDO:0030528 both flag these as inconsistent features
      that may be related to other genetic defects, and the primary literature
      supplies the reason: CNS involvement was reported in 4 of 6 early
      patients but only in consanguineous pedigrees, where recessive
      homozygosity at unrelated loci is expected to be enriched. FNIP1 is
      nonetheless plausibly relevant to muscle — Fnip1 regulates skeletal
      muscle fiber-type specification in mice — so the question is genuinely
      open rather than settled in either direction. Curating these as core
      phenotypes on the current evidence would overstate the phenotypic
      definition; this entry therefore omits them.
    attaches_to:
      - "pathophysiology#Dysregulated AMPK and mTORC1 Nutrient Sensing"
    proposed_experiments:
      - experiment_id: imd93_exp_reanalysis_second_diagnosis
        name: Exome/genome reanalysis for a second recessive diagnosis
        description: >
          Systematic reanalysis of exome/genome data from FNIP1-deficient
          patients with neurologic features, searching for a second, unrelated
          recessive diagnosis that could independently explain the CNS
          phenotype.
        would_support:
          - Finding no second candidate diagnosis in multiple such patients would support the neurologic features being genuinely FNIP1-attributable.
        would_refute:
          - Identifying independent pathogenic biallelic variants at other loci would refute FNIP1 attribution for those features.
      - experiment_id: imd93_exp_nonconsanguineous_deep_phenotyping
        name: Deep phenotyping of non-consanguineous FNIP1-deficient patients
        description: >
          Neuroimaging, muscle biopsy, and creatine kinase measurement in
          FNIP1-deficient patients from non-consanguineous pedigrees, in whom a
          co-segregating second recessive disorder is far less likely.
        would_support:
          - Neurologic or myopathic findings in non-consanguineous patients would support these as true FNIP1 phenotypes.
        would_refute:
          - Consistently normal neurologic and muscle findings in non-consanguineous patients would argue the association is confounded by consanguinity.
      - experiment_id: imd93_exp_conditional_fnip1_deletion
        name: Tissue-specific conditional Fnip1 deletion
        description: >
          Conditional Fnip1 deletion in neural and skeletal-muscle lineages in
          mice to test whether neurologic and myopathic features are
          cell-autonomous consequences of FNIP1 loss.
        would_support:
          - Cell-autonomous neural or muscle phenotypes on lineage-restricted deletion would support a direct FNIP1 role.
        would_refute:
          - Absence of phenotype on lineage-restricted deletion would argue against a direct, cell-autonomous FNIP1 contribution.
    evidence:
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "However, these manifestations were observed only in patients with consanguineous pedigrees , raising the possibility that they may be caused by other (as yet to be discovered) genetic factors."
        explanation: >
          The primary source for the caveat: CNS manifestations were confined
          to consanguineous pedigrees, so an independent genetic explanation
          cannot be excluded.
      - reference: PMID:25548157
        reference_title: "Fnip1 regulates skeletal muscle fiber type specification, fatigue resistance, and susceptibility to muscular dystrophy."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "Fnip1 regulates skeletal muscle fiber type specification, fatigue resistance, and susceptibility to muscular dystrophy."
        explanation: >
          Provides a biologically plausible route by which FNIP1 loss could
          contribute to a myopathic phenotype, which is why the question is
          treated as open rather than resolved against involvement.

  - discussion_id: imd93_hsct_role_versus_cardiac_arm
    kind: OPEN_QUESTION
    prompt: >
      Would allogeneic haematopoietic stem cell transplantation correct the
      haematopoietic arm of IMD93, and how should it be weighed against the
      untreatable cardiac arm?
    rationale: >
      The B-cell and neutrophil defects are cell-intrinsic to the
      haematopoietic compartment and would in principle be corrected by donor
      haematopoiesis, whereas the hypertrophic cardiomyopathy and
      pre-excitation arise in cardiomyocytes and would not. Because cardiac
      disease is a leading cause of death, the risk-benefit calculus for
      transplantation differs from that in other agammaglobulinemias, where
      immunoglobulin replacement alone is usually sufficient. No transplanted
      FNIP1-deficient patient has been reported, so this remains untested.
    attaches_to:
      - "pathophysiology#Pre-B Cell Metabolic Checkpoint Failure and Developmental Arrest"
      - "pathophysiology#Ventricular Hypertrophy and Hypertrophic Cardiomyopathy"


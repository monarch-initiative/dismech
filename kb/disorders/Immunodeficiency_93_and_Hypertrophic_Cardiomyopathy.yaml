name: Immunodeficiency 93 and Hypertrophic Cardiomyopathy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 93 and hypertrophic cardiomyopathy
  term:
    id: MONDO:0030528
    label: immunodeficiency 93 and hypertrophic cardiomyopathy
description: >
  Immunodeficiency 93 and hypertrophic cardiomyopathy (IMD93; FNIP1 deficiency;
  OMIM 619705) is an autosomal recessive syndromic inborn error of immunity
  caused by biallelic loss-of-function variants in FNIP1, the gene encoding
  folliculin-interacting protein 1. Onset is in the first months to years of
  life with recurrent viral and bacterial infection — particularly
  sinopulmonary infection with encapsulated organisms — together with
  hypertrophic cardiomyopathy. Immunologic workup characteristically shows
  profoundly decreased or absent circulating B cells with hypo- or
  agammaglobulinemia, reflecting an early arrest of B-cell development at the
  pre-B stage; severe or intermittent neutropenia and a mild T-cell
  lymphocytosis are seen in some but not all patients, and laboratory findings
  vary between individuals. Immunoglobulin replacement therapy is beneficial.
  Cardiac involvement extends beyond hypertrophic cardiomyopathy to atrial
  septal defect, valvular insufficiency, tachyarrhythmia, and ventricular
  pre-excitation (Wolff-Parkinson-White syndrome). Mechanistically, FNIP1
  partners with folliculin (FLCN) to couple nutrient and energy sensing to the
  AMPK and mTORC1 pathways; its loss produces an AMPK gain-of-function state
  that both blocks the pre-B-cell metabolic checkpoint and drives glycogen
  accumulation in cardiomyocytes, phenocopying PRKAG2 (AMPK gamma-2)
  gain-of-function cardiomyopathy with pre-excitation.

synonyms:
  - IMD93
  - FNIP1 deficiency
  - Folliculin-interacting protein 1 deficiency
  - Immunodeficiency and hypertrophic cardiomyopathy

parents:
  - Inborn error of immunity
  - Agammaglobulinemia

notes: >
  Scope caveat carried over from the OMIM 619705 / MONDO:0030528 definition:
  rare myopathic and neurologic features (metabolic myopathy, muscular
  hypotonia, microcephaly, developmental delay, cerebellar hypoplasia) have
  been reported in individual FNIP1-deficient patients but are NOT consistently
  part of the disorder and may reflect additional genetic factors in the
  consanguineous pedigrees in which they were observed. They are therefore not
  curated here as core phenotypes; the open question is recorded under
  `discussions`.

classifications:
  harrisons_chapter:
    - classification_value: IMMUNE_RHEUMATOLOGIC
      evidence:
        - reference: PMID:32905580
          reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "FNIP1 deficiency is a novel inborn error of immunity characterized by early and severe B-cell development defect, agammaglobulinemia, variable neutropenia, and HCM."
          explanation: >
            IMD93 is a primary immunodeficiency (inborn error of immunity),
            placing it in Harrison's immune/rheumatologic Part.
    - classification_value: CARDIOVASCULAR
      evidence:
        - reference: PMID:32181500
          reference_title: "Mutations of the gene FNIP1 associated with a syndromic autosomal recessive immunodeficiency with cardiomyopathy and pre-excitation syndrome."
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "FNIP1 deficiency patients have a AMPK-P gain of function phenotype with hypertrophic cardiomyopathy, Wolff-Parkinson-White pre-excitation syndrome, myopathy of skeletal muscles and combined immunodeficiency."
          explanation: >
            Hypertrophic cardiomyopathy with pre-excitation is a defining,
            frequently life-limiting axis of the disorder, warranting a
            cardiovascular Part assignment alongside the immunologic one.
    - classification_value: GENETICS_ENVIRONMENT_DISEASE
      evidence:
        - reference: PMID:32905580
          reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "We identified homozygous or compound-heterozygous variants in the gene for folliculin interacting protein 1 (FNIP1), leading to loss of the FNIP1 protein."
          explanation: >
            IMD93 is a Mendelian single-gene (FNIP1) recessive disorder,
            supporting placement in Harrison's genetics Part.
  iuis_category:
    classification_value: predominantly antibody deficiency
    evidence:
      - reference: PMID:35748970
        reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "FNIP1 deficiency (6 patients) FNIP1 AR"
        explanation: >
          The IUIS 2022 Expert Committee update lists FNIP1 deficiency in
          Table 3 (predominantly antibody deficiencies), in the subsection
          "severe reduction in all serum immunoglobulin isotypes with
          profoundly decreased or absent B cells" — the same category as XLA.
      - reference: PMID:35748970
        reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "B cell deficiencies, agammaglobulinemia, or hypogamma"
        explanation: >
          Confirms that FNIP1 was added to the IUIS "B cell deficiencies,
          agammaglobulinemia, or hypogammaglobulinemia" table (Table 3) rather
          than to the combined-immunodeficiency tables.

inheritance:
  - name: Autosomal recessive
    description: >
      IMD93 is inherited in an autosomal recessive manner. Reported patients
      carry homozygous FNIP1 loss-of-function variants (often in consanguineous
      families), compound-heterozygous variants, or a single variant unmasked
      by uniparental disomy or a copy-number deletion of the second allele.
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:32181500
        reference_title: "Mutations of the gene FNIP1 associated with a syndromic autosomal recessive immunodeficiency with cardiomyopathy and pre-excitation syndrome."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Mutations of the gene FNIP1 associated with a syndromic autosomal recessive immunodeficiency with cardiomyopathy and pre-excitation syndrome."
        explanation: Establishes autosomal recessive inheritance for FNIP1-related immunodeficiency with cardiomyopathy.
      - reference: PMID:35748970
        reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "FNIP1 deficiency (6 patients) FNIP1 AR"
        explanation: IUIS table records the inheritance mode of FNIP1 deficiency as AR (autosomal recessive).

prevalence:
  - population: Worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >
      Ultra-rare. Only a handful of patients have been reported since the first
      descriptions in 2020; a 2023 case report placed the cumulative published
      total at seven, with further isolated cases reported subsequently. No
      population prevalence or incidence estimate has been established.
      Orphanet epidemiology was not consulted because the repository's
      Orphadata refresh currently fails a manifest checksum, so a qualitative
      prevalence band is used instead of an Orphanet numeric class.
    evidence:
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "we identified a new FNIP1 -deficient male patient, bringing the total number of reported FNIP1-deficient patients to 7"
        explanation: >
          Establishes the ultra-rare, cases-in-literature occurrence (7
          published patients as of 2023).
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Genetic variants in Folliculin interacting protein 1 (FNIP1) were recently discovered as monogenic causes for immunodeficiency and cardiomyopathy, with only a few patients diagnosed thus far."
        explanation: Independently confirms that only a few patients have been diagnosed to date.

genetic:
  - name: FNIP1
    gene_term:
      preferred_term: FNIP1
      term:
        id: hgnc:29418
        label: FNIP1
    relationship_type: CAUSATIVE
    notes: >
      Biallelic loss-of-function variants in FNIP1 (chromosome 5q31.1) abolish
      the FNIP1 protein. Reported alleles span nonsense (c.868C>T; c.3334C>T,
      p.Gln1112*), splice-site (c.3306+1G>A), frameshift
      (c.52_64dup, p.Asp22GlyfsTer21; c.3218delT, p.Leu1073Trpfs*32) and
      multi-exon deletion variants. Two mechanistically instructive
      "second-hit" configurations have been documented: unmasking of a
      heterozygous variant by uniparental disomy, and hemizygosity created by a
      de novo copy-number deletion spanning FNIP1 on the other allele. FNIP2,
      the close paralogue, is not upregulated to compensate — FNIP2 protein
      abundance was unchanged in patient cells.
    variants:
      - name: "NM_133372.3:c.52_64dup (p.Asp22GlyfsTer21)"
        description: >
          Homozygous 13-bp duplication in exon 1 of 18 causing a frameshift and
          premature stop; classified likely pathogenic (ACMG).
      - name: "NM_133372.3:c.3334C>T (p.Gln1112*)"
        description: >
          Nonsense variant in exon 17, present in a hemizygous state due to a
          de novo paternal copy-number deletion spanning FNIP1; immunoblotting
          showed complete absence of FNIP1 protein in patient cells.
    evidence:
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We identified homozygous or compound-heterozygous variants in the gene for folliculin interacting protein 1 (FNIP1), leading to loss of the FNIP1 protein."
        explanation: Establishes biallelic FNIP1 loss-of-function as the cause of the disorder.
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Moreover, we identified either uniparental disomy or copy-number variants (CNVs) in 2 patients, expanding the variant spectrum of this novel inborn error of immunity."
        explanation: >
          Documents uniparental disomy and CNVs as non-canonical routes to
          biallelic FNIP1 inactivation, motivating CNV analysis alongside
          exome sequencing.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Genetic evaluation identified a homozygous 13-bp duplication variant in FNIP1 (c.52_64dupGCGCCCGGCCGCG, p. Asp22GlyfsTer21) resulting in a frameshift in exon 1/18."
        explanation: Documents a novel homozygous frameshift allele in a patient with the full IMD93 phenotype.
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Of note, the absence of the FNIP1 protein did not appear to affect FNIP2 protein abundance in these cells"
        explanation: >
          Shows that the paralogue FNIP2 does not compensate at the protein
          level, consistent with a non-redundant FNIP1 requirement.

pathophysiology:
  - name: FNIP1 Loss of Function
    biological_scale: MOLECULAR
    description: >
      Biallelic loss-of-function variants in FNIP1 abolish the
      folliculin-interacting protein 1 polypeptide. Immunoblotting of
      patient-derived T-cell blasts and EBV-immortalized B cells confirms
      absent FNIP1 protein, and the paralogue FNIP2 is not upregulated to
      compensate.
    gene:
      preferred_term: FNIP1
      term:
        id: hgnc:29418
        label: FNIP1
      modifier: ABSENT
    downstream:
      - target: Dysregulated AMPK and mTORC1 Nutrient Sensing
    evidence:
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We identified homozygous or compound-heterozygous variants in the gene for folliculin interacting protein 1 (FNIP1), leading to loss of the FNIP1 protein."
        explanation: Establishes protein-level loss of FNIP1 as the proximal molecular lesion.
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Immunoblotting demonstrated the absence of FNIP1 protein in patient-derived T cell blasts"
        explanation: Direct protein-level confirmation of FNIP1 absence in patient cells.

  - name: Dysregulated AMPK and mTORC1 Nutrient Sensing
    biological_scale: MOLECULAR
    description: >
      FNIP1 forms a complex with folliculin (FLCN) that couples cellular energy
      and amino-acid status to the two master metabolic regulators: it binds
      and modulates AMP-activated protein kinase (AMPK), and the FLCN-FNIP1
      complex acts as a GTPase-activating protein for RagC/D, controlling
      mTORC1 recruitment to the lysosome. FNIP1 additionally interacts with the
      HSP90 chaperone machinery, coupling its own stability to proteostasis.
      Loss of FNIP1 produces an AMPK phosphorylation (AMPK-P) gain-of-function
      state; in mouse B-cell progenitors both AMPK and mTORC1 are
      simultaneously activated, mTOR is inappropriately localized at the
      lysosome under nutrient-depleted conditions, and the MiT/TFE
      transcription factor TFE3 accumulates in the nucleus, driving lysosomal
      biogenesis and increased autophagic flux. The lesion is notably not
      reducible to a single linear "AMPK-high" or "mTOR-high" abnormality.
    molecular_functions:
      - preferred_term: AMP-activated protein kinase activity
        term:
          id: GO:0004679
          label: AMP-activated protein kinase activity
        modifier: INCREASED
      - preferred_term: RagC/D GTPase-activating activity of the FLCN-FNIP1 complex
        term:
          id: GO:0005096
          label: GTPase activator activity
        modifier: DECREASED
    biological_processes:
      - preferred_term: mTORC1 (TOR) signaling
        term:
          id: GO:0031929
          label: TOR signaling
        modifier: DYSREGULATED
      - preferred_term: cellular response to nutrient levels
        term:
          id: GO:0031669
          label: cellular response to nutrient levels
        modifier: ABNORMAL
    cellular_components:
      - preferred_term: lysosome
        term:
          id: GO:0005764
          label: lysosome
    downstream:
      - target: Pre-B Cell Metabolic Checkpoint Failure and Developmental Arrest
      - target: Cardiomyocyte Glycogen Accumulation
      - target: Impaired Neutrophil Homeostasis
    evidence:
      - reference: PMID:32181500
        reference_title: "Mutations of the gene FNIP1 associated with a syndromic autosomal recessive immunodeficiency with cardiomyopathy and pre-excitation syndrome."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FNIP1 deficiency patients have a AMPK-P gain of function phenotype with hypertrophic cardiomyopathy, Wolff-Parkinson-White pre-excitation syndrome, myopathy of skeletal muscles and combined immunodeficiency."
        explanation: >
          Frames human FNIP1 deficiency as an AMPK-phosphorylation
          gain-of-function state, the unifying molecular abnormality.
      - reference: PMID:40699689
        reference_title: "FNIP1 Deficiency: Pathophysiology and Clinical Manifestations of a Rare Syndromic Primary Immunodeficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "FNIP1 forms a complex with folliculin (FLCN) to regulate the mechanistic target of rapamycin complex 1 (mTORC1), functioning as a GTPase-activating protein (GAP) for RagC/D."
        explanation: Defines the FLCN-FNIP1 complex's RagC/D GAP activity toward mTORC1.
      - reference: PMID:40699689
        reference_title: "FNIP1 Deficiency: Pathophysiology and Clinical Manifestations of a Rare Syndromic Primary Immunodeficiency."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "Additionally, FNIP1 interacts with heat shock protein 90 (HSP90) and undergoes phosphorylation, glycosylation, and ubiquitination, which dynamically regulate its stability and function."
        explanation: Documents the HSP90 chaperone axis and post-translational control of FNIP1 stability.
      - reference: PMID:31676673
        reference_title: "Folliculin Interacting Protein 1 Maintains Metabolic Homeostasis during B Cell Development by Modulating AMPK, mTORC1, and TFE3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Both AMPK and mTORC1 were activated in Fnip1-deficient B cell progenitors. In this study, we found inappropriate mTOR localization at the lysosome under nutrient-depleted conditions."
        explanation: >
          Mouse data establishing simultaneous AMPK/mTORC1 activation and
          mislocalized lysosomal mTOR on FNIP1 loss.
      - reference: PMID:31676673
        reference_title: "Folliculin Interacting Protein 1 Maintains Metabolic Homeostasis during B Cell Development by Modulating AMPK, mTORC1, and TFE3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Fnip1-deficient B cell progenitors exhibited increased nuclear localization of transcription factor binding to IgHM enhancer 3 (TFE3) in developing B cells, which correlated with an increased expression of TFE3-target genes, increased lysosome numbers and function, and increased autophagic flux."
        explanation: >
          Identifies TFE3 nuclear accumulation with increased lysosomal
          biogenesis and autophagic flux downstream of FNIP1 loss.

  - name: Pre-B Cell Metabolic Checkpoint Failure and Developmental Arrest
    biological_scale: CELLULAR
    description: >
      FNIP1 enforces a metabolic checkpoint that verifies a developing pre-B
      cell has sufficient metabolic capacity to undergo the proliferative burst
      that follows successful immunoglobulin heavy-chain rearrangement. Without
      FNIP1, B-cell development arrests at the pre-B-cell stage: progenitors
      show impaired mitochondrial number and activity, blunted PI3K/AKT
      signalling, increased autophagic flux, and increased apoptosis on
      amino-acid (lysine or arginine) withdrawal. The arrest is not rescued by
      genetic AMPK inhibition, mTORC1 inhibition, or Bcl-xL-mediated survival
      support, indicating a metabolic rather than purely apoptotic block.
    cell_types:
      - preferred_term: pre-B cell (precursor B cell)
        term:
          id: CL:0000817
          label: precursor B cell
      - preferred_term: large pre-B-II cell
        term:
          id: CL:0000955
          label: pre-B-II cell
    biological_processes:
      - preferred_term: B cell differentiation
        term:
          id: GO:0030183
          label: B cell differentiation
        modifier: DECREASED
      - preferred_term: autophagy
        term:
          id: GO:0006914
          label: autophagy
        modifier: INCREASED
    cellular_components:
      - preferred_term: mitochondrion
        term:
          id: GO:0005739
          label: mitochondrion
        modifier: ABNORMAL
    downstream:
      - target: Absent Circulating B Cells and Agammaglobulinemia
    evidence:
      - reference: PMID:31676673
        reference_title: "Folliculin Interacting Protein 1 Maintains Metabolic Homeostasis during B Cell Development by Modulating AMPK, mTORC1, and TFE3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We previously found that constitutive disruption of Fnip1 in mice resulted in a lack of peripheral B cells because of a block in B cell development at the pre-B cell stage."
        explanation: Localizes the developmental block to the pre-B-cell stage.
      - reference: PMID:31676673
        reference_title: "Folliculin Interacting Protein 1 Maintains Metabolic Homeostasis during B Cell Development by Modulating AMPK, mTORC1, and TFE3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Genetic inhibition of AMPK, inhibition of mTORC1, or restoration of cell viability with a Bcl-xL transgene failed to rescue B cell development in Fnip1-deficient mice."
        explanation: >
          Shows the arrest cannot be rescued by blocking AMPK/mTORC1 or by
          survival support alone, arguing for a metabolic-capacity checkpoint.
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "B-cell metabolism, including mitochondrial numbers and activity and phosphatidylinositol 3-kinase/AKT pathway, was impaired. These defects recapitulated the Fnip1-/- animal model."
        explanation: >
          Confirms in patient cells the mitochondrial and PI3K/AKT metabolic
          defects predicted by the mouse model.
      - reference: PMID:38748614
        reference_title: "Clinical and Immunologic Features of a Patient With Homozygous FNIP1 Variant."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FNIP1 plays a critical role in B-cell development and metabolic homeostasis, establishing a metabolic checkpoint that ensures pre-B cells possess sufficient metabolic capacity to undergo division while concurrently limiting lymphogenesis due to abnormal growth."
        explanation: States the pre-B-cell metabolic checkpoint role explicitly.

  - name: Absent Circulating B Cells and Agammaglobulinemia
    biological_scale: ORGANISM
    description: >
      The pre-B-cell arrest translates into profoundly decreased or absent
      circulating CD19+/CD20+ B cells and severe reduction of all serum
      immunoglobulin isotypes (profound hypogammaglobulinemia to
      agammaglobulinemia). A mild increase in circulating CD3+ T lymphocytes
      has been documented in some patients.
    biological_processes:
      - preferred_term: immunoglobulin production
        term:
          id: GO:0002377
          label: immunoglobulin production
        modifier: DECREASED
    downstream:
      - target: Susceptibility to Recurrent Sinopulmonary and Gastrointestinal Infection
    evidence:
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immunological abnormalities in the peripheral blood show strongly diminished (nearly absent)  B cell number s and severe reduction s in all serum immunoglobulin isotypes ( profound hypogamma/agammaglobulinemia ) associated with severe or intermittent neutropenia"
        explanation: >
          Summarises the core laboratory phenotype across reported patients:
          near-absent B cells with pan-isotype immunoglobulin reduction.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immune workup revealed agammaglobulinemia and a lack of B lymphocytes."
        explanation: Independent patient-level confirmation of agammaglobulinemia with absent B lymphocytes.

  - name: Susceptibility to Recurrent Sinopulmonary and Gastrointestinal Infection
    biological_scale: ORGANISM
    description: >
      Loss of antibody-mediated humoral immunity produces early-onset recurrent
      viral and bacterial infection, dominated by upper and lower respiratory
      tract infection (including otitis media, pneumonia, and sequelae such as
      bronchiectasis) and gastrointestinal infection or enteropathy, with
      resulting failure to thrive. Encapsulated bacteria are characteristic
      pathogens of this antibody-deficiency pattern.
    evidence:
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "severe and/or recurrent upper and lower respiratory tract infections"
        explanation: >
          The review states that clinical manifestations of FNIP1 deficiency
          occurring within the first year of life include severe and/or
          recurrent upper and lower respiratory tract infections.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "she developed recurrent viral and bacterial infections, including recurrent sinopulmonary infections"
        explanation: Documents the combined viral and bacterial recurrent-infection pattern in a patient.

  - name: Cardiomyocyte Glycogen Accumulation
    biological_scale: CELLULAR
    description: >
      Within the cardiomyocyte, the AMPK gain-of-function state driven by FNIP1
      loss reproduces the cell-level pathology of activating mutations in the
      AMPK gamma-2 subunit (PRKAG2): gamma-2-specific AMPK activity is elevated
      in neonatal FNIP1-deficient myocardium and glycogen accumulates within
      the myocyte. This is the cellular lesion that underlies the tissue-level
      hypertrophy modelled downstream.
    cell_types:
      - preferred_term: cardiomyocyte
        term:
          id: CL:0000746
          label: cardiac muscle cell
    biological_processes:
      - preferred_term: glycogen metabolic process
        term:
          id: GO:0005977
          label: glycogen metabolic process
        modifier: INCREASED
    downstream:
      - target: Ventricular Hypertrophy and Hypertrophic Cardiomyopathy
    evidence:
      - reference: PMID:27303042
        reference_title: "Mutation of Fnip1 is associated with B-cell deficiency, cardiomyopathy, and elevated AMPK activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Concordantly, γ2-specific AMPK activity was elevated in neonatal FNIP1-deficient myocardium"
        explanation: Direct measurement of elevated gamma-2 AMPK activity in FNIP1-deficient myocardium.
      - reference: PMID:27303042
        reference_title: "Mutation of Fnip1 is associated with B-cell deficiency, cardiomyopathy, and elevated AMPK activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "FNIP1-deficient mice developed cardiomyopathy characterized by left ventricular hypertrophy and glycogen accumulation, with close parallels to mice and humans bearing gain-of-function mutations in the γ2 subunit of AMPK."
        explanation: >
          Establishes myocardial glycogen accumulation and the AMPK-gamma-2
          (PRKAG2) phenocopy as the mechanism in the mouse model.

  - name: Ventricular Hypertrophy and Hypertrophic Cardiomyopathy
    biological_scale: TISSUE
    description: >
      At tissue level the glycogen-laden myocardium becomes hypertrophic. In
      patients this manifests as hypertrophic — frequently obstructive —
      cardiomyopathy with left or biventricular hypertrophy, presenting from
      the neonatal period through the first years of life, and can be fatal
      through cardiogenic shock or heart failure.
    biological_processes:
      - preferred_term: cardiac muscle hypertrophy
        term:
          id: GO:0003300
          label: cardiac muscle hypertrophy
        modifier: INCREASED
    downstream:
      - target: Ventricular Pre-excitation and Tachyarrhythmia
    evidence:
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We here investigated 3 novel patients, including the first known adult, from unrelated families with agammaglobulinemia, recurrent infections, and hypertrophic cardiomyopathy (HCM)."
        explanation: Confirms hypertrophic cardiomyopathy as a human phenotype of FNIP1 deficiency.
      - reference: PMID:27303042
        reference_title: "Mutation of Fnip1 is associated with B-cell deficiency, cardiomyopathy, and elevated AMPK activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "FNIP1-deficient mice developed cardiomyopathy characterized by left ventricular hypertrophy and glycogen accumulation"
        explanation: Mouse model recapitulates the ventricular hypertrophy at tissue level.

  - name: Ventricular Pre-excitation and Tachyarrhythmia
    biological_scale: ORGANISM
    description: >
      Glycogen-laden hypertrophic myocardium provides the substrate for
      accessory atrioventricular conduction, producing ventricular
      pre-excitation (Wolff-Parkinson-White syndrome) and supraventricular
      tachyarrhythmia — the same electrophysiological signature seen in PRKAG2
      glycogen-storage cardiomyopathy.
    evidence:
      - reference: PMID:32181500
        reference_title: "Mutations of the gene FNIP1 associated with a syndromic autosomal recessive immunodeficiency with cardiomyopathy and pre-excitation syndrome."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "hypertrophic cardiomyopathy, Wolff-Parkinson-White pre-excitation syndrome"
        explanation: Documents WPW pre-excitation accompanying the hypertrophic cardiomyopathy in patients.
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "hypertrophic cardiomyopathy (left ventricle) associated with Wolff-Parkinson-White"
        explanation: Independent patient with left ventricular HCM and Wolff-Parkinson-White syndrome.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: "(SVT) as well as bi-ventricular hypertrophy and hypertrophic obstructive cardiomyopathy"
        explanation: >
          Documents supraventricular tachycardia alongside biventricular
          hypertrophy and hypertrophic obstructive cardiomyopathy, evidencing
          the tachyarrhythmia limb of this node. Graded PARTIAL because the
          affected individual was the index patient's sibling, who died at 2
          months before genetic evaluation; the authors state only that he
          "very likely" carried the same FNIP1 variant, so the genotype was
          never confirmed.

  - name: Impaired Neutrophil Homeostasis
    biological_scale: ORGANISM
    description: >
      A subset of FNIP1-deficient patients develop severe or intermittent
      neutropenia, sometimes with recurrent gingivitis and perianal abscesses,
      which is responsive to granulocyte colony-stimulating factor. Other
      patients have entirely normal neutrophil counts, making neutropenia a
      variable rather than obligate feature; the observation nonetheless
      suggests a non-redundant role for FNIP1 in neutrophils.
    evidence:
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Two of them also presented with intermittent or severe chronic neutropenia."
        explanation: Documents variable neutropenia in two of three patients in the defining cohort.
      - reference: PMID:37522988
        reference_title: "A Case Report of Folliculin-Interacting Protein 1 Deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "It also  suggests a non-redundant function of FNIP1 in neutrophils."
        explanation: Interprets the neutropenia as evidence of a non-redundant neutrophil requirement for FNIP1.

phenotypes:
  - category: Immunologic
    name: Agammaglobulinemia
    description: >
      Severe reduction of all serum immunoglobulin isotypes, ranging from
      profound hypogammaglobulinemia to complete agammaglobulinemia, secondary
      to the early block in B-cell development.
    phenotype_term:
      preferred_term: Agammaglobulinemia
      term:
        id: HP:0004432
        label: Agammaglobulinemia
      onset:
        onset_category: INFANTILE
        notes: Detected in the first months to years of life.
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:32905580
        reference_title: "Absent B cells, agammaglobulinemia, and hypertrophic cardiomyopathy in folliculin-interacting protein 1 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FNIP1 deficiency is a novel inborn error of immunity characterized by early and severe B-cell development defect, agammaglobulinemia, variable neutropenia, and HCM."
        explanation: >
          Names agammaglobulinemia as a defining (not variable) feature of the
          disorder — contrasted in the same sentence with "variable"
          neutropenia — supporting a VERY_FREQUENT band.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immune workup revealed agammaglobulinemia and a lack of B lymphocytes."
        explanation: Patient-level documentation of agammaglobulinemia.

  - category: Immunologic
    name: Decreased total B cell count
    description: >
      Profoundly decreased to absent circulating CD19+/CD20+ B lymphocytes, the
      cellular counterpart of the agammaglobulinemia.
    phenotype_term:
      preferred_term: Absent circulating B cells
      term:
        id: HP:0010976
        label: Decreased total B cell count
    frequency: VERY_FREQUENT
    evidence:

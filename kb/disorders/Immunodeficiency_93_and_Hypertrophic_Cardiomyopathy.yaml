        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FNIP1 loss-of-function should be considered in patients presenting in infancy with cardiac manifestations along with agammaglobulinemia (and B-cell lymphopenia)."
        explanation: >
          B-cell lymphopenia is presented as a consistent diagnostic hallmark
          of the disorder, supporting a VERY_FREQUENT band.
      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Due to complete absence of B lymphocytes, low levels of IgG and undetectable levels of IgA and IgM"
        explanation: >
          Patient-level flow-cytometric and immunochemical documentation of
          completely absent circulating B lymphocytes.

  - category: Immunologic
    name: Recurrent infections
    description: >
      Early-onset recurrent viral and bacterial infections, characteristically
      with encapsulated organisms, beginning in the first months of life.
    phenotype_term:
      preferred_term: Recurrent infections
      term:
        id: HP:0002719
        label: Recurrent infections

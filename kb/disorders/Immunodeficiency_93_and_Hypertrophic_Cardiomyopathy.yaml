      - reference: PMID:39537849
        reference_title: "A novel mutation in FNIP1 associated with a syndromic immunodeficiency and cardiomyopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "she developed recurrent viral and bacterial infections, including recurrent sinopulmonary infections"

    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KTS has been recognized for more than a century 23; we defined the
      condition as comprised of overgrowth, cutaneous capillary and lymphatic
      malformation, and persistence of embryonic vasculature in an extremity 12,
      14.
    explanation: >-
      Defines the combined capillary, lymphatic, and persistent embryonic venous
      malformation tissue burden of KTS.
  - reference: ORPHA:90308
    reference_title: "Capillary-lymphatic-venous malformation with segmental distribution"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lymphatic malformations are also observed, while arteriovenous fistulas
      are absent. Patients present recurrent painful thrombophlebitis, venous
      thrombosis, and sudden venous hemorrhage.
    explanation: >-
      Links the low-flow capillary-lymphatic-venous malformation burden directly
      to painful thrombophlebitis, venous thrombosis, and hemorrhage.

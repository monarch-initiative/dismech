  evidence:
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Depending on the type of vascular malformations, sclerotherapy, laser

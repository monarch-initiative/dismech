    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 1 of the 5 mutant PIK3CA alleles we tested by ddPCR in 27/33
      CLOVES (82%), 19/21 KTS (90%), 16/17 LM (94%), and 4/8 FAVA (50%) samples
      (Table II).
    explanation: >-
      Demonstrates somatic mosaicism for one of five recurrent activating PIK3CA
      hotspots in 90% of affected-tissue KTS specimens.
  - reference: PMID:25681199
    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Somatic mutations in PIK3CA, which encodes the catalytic subunit of the
      enzyme phosphatidylinositol 3-kinase (PI3K), occur frequently in human
      cancer 1. These activating mutations increase the enzyme’s baseline
      catalytic activity 2.
    explanation: >-
      Establishes that these somatic PIK3CA variants increase baseline p110alpha
      catalytic lipid kinase activity.
  downstream:
  - target: Activated PI3K/mTOR signaling
    causal_link_type: DIRECT
    description: >-
      Increased PtdIns(3,4,5)P3 generation recruits PDK1 and AKT, driving
      constitutive PI3K/AKT/mTORC1 signaling.
- name: Activated PI3K/mTOR signaling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Constitutive p110alpha catalytic activation elevates PtdIns(3,4,5)P3,
    phosphorylating AKT (at Thr308 and Ser473), inhibiting TSC2, and activating
    mTORC1/S6RP signaling in malformed vascular endothelial and mesenchymal
    cells.

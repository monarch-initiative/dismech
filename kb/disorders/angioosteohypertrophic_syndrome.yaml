inheritance:
- name: Somatic mosaicism
  inheritance_term:
    preferred_term: Somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    Angioosteohypertrophic / Klippel-Trenaunay syndrome is an obligate
    post-zygotic somatic mosaic disorder caused by activating PIK3CA variants arising
    de novo during embryogenesis and restricted to malformed vascular and
    overgrown tissues (frequently at <10% mutant cell abundance). Constitutional
    vertical transmission and sibling recurrence have not been confirmed, so
    recurrence risk for siblings of a proband equals that of the general
    population.
  evidence:
  - reference: PMID:25681199
    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most individuals from Boston Children's Hospital who had isolated LM
      (16/17) or LM as part of a syndrome, such as KTS (19/21), fibro-adipose
      vascular anomaly (5/8), and congenital lipomatous overgrowth with
      vascular, epidermal, and skeletal anomalies syndrome (31/33) were somatic
      mosaic for PIK3CA mutations, with 5 specific PIK3CA mutations accounting
      for ∼ 80% of cases.
    explanation: >-
      Directly establishes post-zygotic somatic PIK3CA mosaicism in 19/21 (90%)
      of rigorously defined KTS patients.
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PROS disorders are not known to be inherited, as most identified
      pathogenic variants are somatic (mosaic). No confirmed vertical
      transmission or sib recurrence has been reported to date. The risk to sibs
      of a proband with somatic mosaicism for a pathogenic variant in PIK3CA
      would be expected to be the same as in the general population.
    explanation: >-
      Establishes non-hereditary post-zygotic mosaic architecture and
      population-baseline sibling recurrence risk across PROS disorders.
pathophysiology:
- name: Somatic PIK3CA activation in malformed tissue
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Post-zygotic somatic gain-of-function missense variants in PIK3CA (encoding
    the p110alpha catalytic subunit of class IA phosphatidylinositol 3-kinase;
    predominantly hotspot alleles p.Cys420Arg, p.Glu542Lys, p.Glu545Lys,
    p.His1047Arg, and p.His1047Leu) arise in embryonic vascular/mesenchymal
    progenitors at low mosaic allele fractions (often <10% mutant cells) and
    constitutively elevate baseline lipid kinase activity, converting PtdIns(4,5)P2
    to PtdIns(3,4,5)P3.

- name: Surgical Treatment of Symptomatic Venous Malformations and Overgrowth
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical resection and venous stripping
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: >-
    Open venous surgery (stripping/excision of incompetent saphenous and
    persistent lateral embryonic veins when the deep venous system is patent),
    soft-tissue debulking, and orthopedic leg-length discrepancy procedures in
    selected patients with refractory pain or functional impairment, accompanied
    by perioperative anticoagulation assessment for thromboembolic risk.
  target_mechanisms:
  - target: Capillary-venous malformation burden
    description: >-
      Excises symptomatic varicosities and persistent embryonic lateral veins,
      lowering venous clinical severity scores.
    evidence:
    - reference: PMID:25788406
      reference_title: "Surgical treatment of varicose veins and venous malformations in Klippel-Trenaunay syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At the last follow-up visit, the venous clinical severity score had
        decreased from 9.48 ± 3.27 to 6.07 ± 3.20 (P < 0.001).
      explanation: >-
        Demonstrates durable reduction in venous disease severity following open
        venous surgery in KTS.
  - target: Segmental limb overgrowth
    description: >-
      Debulking and orthopedic surgical intervention address disabling segmental
      limb overgrowth and leg-length discrepancy.
    evidence:
    - reference: PMID:23946963
      reference_title: "PIK3CA-Related Overgrowth Spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Significant or lipomatous segmental overgrowth may require debulking;
        scoliosis and leg-length discrepancy may require orthopedic care and
        surgical intervention.
      explanation: >-
        Supports surgical debulking and orthopedic management of segmental limb
        overgrowth and leg-length discrepancy.
  evidence:
  - reference: PMID:25788406
    reference_title: "Surgical treatment of varicose veins and venous malformations in Klippel-Trenaunay syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In selected symptomatic patients with KT syndrome, open surgical treatment
      is safe and durable.
    explanation: >-
      Supports open surgical management of varicosities and venous malformations
      in selected symptomatic KTS patients (49 patients, 53 limbs).
diagnosis:
- name: Clinical Evaluation of Classic Triad
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Clinical diagnosis is established by the presence of at least two of the
    three classic triad features — localized cutaneous capillary malformation
    (port-wine stain), atypical venous varicosities or persistent lateral
    embryonic veins (often with lymphatic malformation), and soft-tissue/bony
    hypertrophy of the affected limb — together with exclusion of high-flow
    arteriovenous fistulas.
  results: >-
    At least two of cutaneous capillary malformation, venous varicosities/
    embryonic veins, and segmental limb hypertrophy without arteriovenous
    shunting.
  evidence:
  - reference: PMID:32644415
    reference_title: "Klippel-Trenaunay-Weber Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      KTS is a clinical diagnosis made by the presence of at least 2 of the 3
      classic findings: localized cutaneous capillary malformations, venous
      abnormalities, and limb hypertrophy.
    explanation: >-
      Establishes the >=2-of-3 clinical diagnostic rule for KTS.
- name: Affected-Tissue Somatic PIK3CA Genetic Testing
  diagnosis_term:
    preferred_term: high-sensitivity somatic genetic testing on affected tissue
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular confirmation requires DNA extracted directly from clinically
    affected dermal biopsy or surgically excised vascular/overgrown tissue
    (rather than peripheral blood), analyzed by droplet digital PCR targeting
    recurrent PIK3CA hotspots or ultra-deep targeted capture next-generation
    sequencing capable of detecting low-level mosaicism (<10% down to ~0.5%
    variant allele fraction).
  results: >-
    Mosaic activating pathogenic variant in PIK3CA detected in affected tissue.
  evidence:
  - reference: PMID:25681199
    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The search for causal mutations requires sampling of affected tissues and
      techniques that are capable of detecting low-level somatic mosaicism
      because the abundance of mutant cells in a malformed tissue can be low.
    explanation: >-
      Establishes the requirement for affected-tissue sampling and
      ultra-sensitive mosaicism detection (ddPCR or deep smMIP/capture NGS).
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sequence analysis of DNA derived from clinically affected tissue samples ‒
      preferably from freshly obtained dermal biopsy overlying an affected area,
      from surgical excision of the overgrown tissue, or from uncultured tissues
      (such as skin fibroblasts or other tissues) ‒ should be prioritized for
      genetic testing.
    explanation: >-
      GeneReviews diagnostic standard specifying optimal affected-tissue biopsy
      sources for PIK3CA mosaic testing.
- name: Radiographic, Ultrasound, and Magnetic Resonance Imaging Surveillance
  diagnosis_term:
    preferred_term: magnetic resonance imaging and radiographic overgrowth surveillance
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    As clinically indicated across PIK3CA-related overgrowth disorders, imaging
    evaluation and surveillance include limb radiographs for segmental limb
    overgrowth, ultrasound or MRI follow-up for truncal overgrowth, and spinal
    MRI for scoliosis or spinal deformities, alongside clinical assessment and
    monitoring of vascular and lymphatic malformations.
  evidence:
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As clinically indicated: clinical assessment and monitoring of any
      vascular and/or lymphatic malformations; radiographs of the limbs in those
      with overgrowth of a limb or portion of a limb; ultrasound or MRI follow
      up in those with truncal overgrowth; spinal MRI in those with scoliosis or
      deformities that affect the spine
    explanation: >-
      Establishes GeneReviews surveillance recommendations for limb radiography,
      truncal ultrasound or MRI, spinal MRI, and clinical monitoring of
      vascular and lymphatic malformations.
differential_diagnoses:
- name: Parkes Weber Syndrome
  disease_term:
    preferred_term: Parkes Weber syndrome
    term:
      id: MONDO:0700325
      label: Parkes Weber syndrome
  description: >-
    High-flow capillary-arteriovenous malformation with limb overgrowth
    (typically caused by RASA1 or EPHB4 germline/second-hit variants rather than
    PIK3CA mosaicism), distinguished clinically and hemodynamically from low-flow
    KTS by the presence of high-flow arteriovenous malformations/fistulas and
    risk of high-output cardiac failure.
  evidence:
  - reference: PMID:32644415
    reference_title: "Klippel-Trenaunay-Weber Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The term “Weber” has largely been abandoned in modern usage to avoid
      confusion with Parkes Weber syndrome, a distinct high-flow vascular
      disorder characterized by arteriovenous malformations.
    explanation: >-
      Distinguishes high-flow Parkes Weber syndrome with arteriovenous
      malformations from low-flow Klippel-Trenaunay syndrome.
- name: CLOVES syndrome
  disease_term:
    preferred_term: CLOVES syndrome
    term:
      id: MONDO:0013038
      label: CLOVES syndrome
  description: >-
    Allelic somatic mosaic PIK3CA-related overgrowth disorder sharing lymphatic,
    capillary, and venous malformations with KTS, but distinguished by
    asymmetric truncal lipomatous masses, epidermal nevi, and acral/spinal
    skeletal anomalies (sandal-gap toes, macrodactyly, polydactyly, scoliosis).
  evidence:
  - reference: PMID:25681199
    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CLOVES syndrome was diagnosed based upon the presence of lipomatous
      overgrowth involving the torso, face, and/or extremity, cutaneous
      capillary-lymphatic malformation, and skeletal anomalies such as sandal
      gap toe, scoliosis, syndactyly, or polydactyly 11, 15.
    explanation: >-
      Delineates the truncal lipomatous and acral/spinal skeletal features that
      separate CLOVES syndrome from appendicular KTS within PROS.
notes: >-
  Nomenclature and scope: MONDO:0007864 uses the label `angioosteohypertrophic
  syndrome` and groups historical Klippel-Trenaunay-Weber usage; modern vascular
  anomalies nosology (ISSVA, Orphanet ORPHA:90308, PMID:32644415) restricts
  Klippel-Trenaunay syndrome (segmental capillary-lymphatic-venous malformation
  with limb overgrowth) to low-flow malformations and separates high-flow
  arteriovenous malformation with limb overgrowth as Parkes Weber syndrome
  (curated under `differential_diagnoses:`).

  Mosaicism and grouping conformance: this entry is an obligate somatic mosaic
  member of `Somatic_Mosaic_Disorders` (`HP:0001442` `Typified by somatic
  mosaicism`, `variant_origin: SOMATIC` on `PIK3CA`). It does not conform to
  `mtorc1_hyperactivation`, which models loss of upstream tumor-suppressor
  repressors (TSC1/TSC2, GATOR1, PTEN, STK11) rather than gain-of-function
  PIK3CA lipid kinase activation.

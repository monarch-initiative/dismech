genetic:
- name: PIK3CA
  association: Somatic activating mutation
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  presence: PRESENT
  frequency: 19/21 (90%) of affected-tissue KTS samples by ddPCR (PMID:25681199)
  gene_term:
    preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  notes: >-
    Post-zygotic somatic gain-of-function mutations in PIK3CA (3q26.32, encoding
    PI3K catalytic subunit p110alpha) place angioosteohypertrophic /
    Klippel-Trenaunay syndrome squarely within the PIK3CA-related overgrowth
    spectrum (PROS). Five recurrent hotspot alleles — p.Cys420Arg, p.Glu542Lys,
    p.Glu545Lys, p.His1047Arg, and p.His1047Leu — accounted for 19/21 (90%) of
    affected-tissue KTS samples screened by droplet digital PCR in PMID:25681199,
    frequently at <10% mutant cell abundance (missed by standard-depth exome
    sequencing of peripheral blood). Orphanet (ORPHA:90308) additionally records
    an older susceptibility association with AGGF1 (hgnc:24684), whereas
    tissue-based ultra-deep sequencing establishes somatic PIK3CA mosaicism as the
    primary molecular etiology.
  evidence:
  - reference: PMID:25681199
    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 1 of the 5 mutant PIK3CA alleles we tested by ddPCR in 27/33
      CLOVES (82%), 19/21 KTS (90%), 16/17 LM (94%), and 4/8 FAVA (50%) samples
      (Table II).
    explanation: >-
      Demonstrates somatic mosaicism for five recurrent activating PIK3CA
      hotspots in 90% of affected-tissue KTS specimens.
  - reference: PMID:25681199
    reference_title: "Lymphatic and other vascular malformative/overgrowth disorders are caused by somatic mutations in PIK3CA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many affected tissue specimens from both cohorts contained fewer than 10%
      mutant cells.
    explanation: >-
      Explains why peripheral blood testing is typically negative and
      high-sensitivity affected-tissue assays are required.
treatments:
- name: Alpelisib (PI3K-alpha Inhibitor) Targeted Therapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: alpelisib targeted pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alpelisib
      term:
        id: CHEBI:231324
        label: alpelisib
  description: >-
    Oral selective PI3Kalpha inhibitor (alpelisib / BYL719; VIJOICE) approved
    for pediatric (>=2 years) and adult patients with severe PIK3CA-related
    overgrowth spectrum (PROS) disorders to reduce vascular malformation volume,
    asymmetric tissue overgrowth, pain, and functional complications; continuous
    dosing is required to maintain lesion suppression, with monitoring for
    hyperglycemia and aphthous stomatitis.
  target_mechanisms:
  - target: Activated PI3K/mTOR signaling
    description: >-
      Selectively inhibits p110alpha (PIK3CA) catalytic activity, suppressing
      downstream AKT Thr308/Ser473 and mTORC1 hyperactivation.
    evidence:
    - reference: PMID:37634128
      reference_title: "Alpelisib for treatment of patients with PIK3CA-related overgrowth spectrum (PROS)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Alpelisib, a PI3Kα-selective inhibitor, targets the underlying etiology
        of PROS, offering a novel therapeutic approach to current management
        strategies.
      explanation: >-
        Confirms direct mechanism-targeted inhibition of hyperactive PI3Kalpha
        signaling in PROS.
  evidence:
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alpelisib has been approved specifically for the reduction of overgrowth,
      vascular lesions, and other functional complications.
    explanation: >-
      Documents regulatory approval and clinical indication of oral alpelisib
      for vascular lesions and segmental overgrowth in PROS.
  - reference: PMID:37634128
    reference_title: "Alpelisib for treatment of patients with PIK3CA-related overgrowth spectrum (PROS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-four weeks (6 months) after treatment initiation, 12 of 32 (37.5%)
      patients with complete case records included in the analysis of the
      primary end point experienced a ≥20% reduction in target lesion(s) volume.
    explanation: >-
      EPIK-P1 real-world study demonstrating >=20% target lesion volume
      reduction at 24 weeks in severe PIK3CA-confirmed PROS.
  - reference: PMID:29899452
    reference_title: "Targeted therapy in patients with PIK3CA-related overgrowth syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the basis of these results, we used BYL719 to treat nineteen patients
      with PROS. The drug improved the disease symptoms in all patients.
      Previously intractable vascular tumours became smaller, congestive heart
      failure was improved, hemihypertrophy was reduced, and scoliosis was
      attenuated.
    explanation: >-
      Foundational compassionate-use series showing clinical and radiologic
      improvement of vascular lesions and limb hypertrophy under BYL719
      (alpelisib).
- name: mTOR Inhibitor Pharmacotherapy (Sirolimus / Everolimus)
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: mTOR inhibitor pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
    - preferred_term: everolimus
      term:
        id: CHEBI:68478
        label: everolimus
  description: >-
    Oral mTORC1 inhibition (sirolimus; preclinical support also for everolimus)
    used to reduce symptomatic low-flow lymphatic and venous malformation pain,
    oozing, and lesion burden, though downstream mTORC1 blockade leaves
    mTORC2-dependent AKT Ser473 phosphorylation intact and may yield incomplete
    responses compared with direct PI3Kalpha inhibition.
  target_mechanisms:
  - target: Activated PI3K/mTOR signaling
    description: >-
      Inhibits mTORC1 downstream of hyperactive PIK3CA/AKT signaling in
      malformed vascular endothelium.
    evidence:
    - reference: DOI:10.1038/s41419-017-0064-x
      reference_title: "PI3K/mTOR inhibition promotes the regression of experimental vascular malformations driven by PIK3CA-activating mutations"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Such vascular lesions are ameliorated by administration of dual
        PI3K/mTOR inhibitor, BEZ235, and mTOR inhibitor, Everolimus.
      explanation: >-
        Demonstrates regression of PIK3CA-driven vascular malformations via mTOR
        pathway inhibition.
  evidence:
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Depending on the type of vascular malformations, sclerotherapy, laser
      therapy, or oral medications such as sirolimus may be used.
    explanation: >-
      Documents clinical use of oral sirolimus for PROS vascular malformations.
  - reference: DOI:10.1038/s41419-017-0064-x
    reference_title: "PI3K/mTOR inhibition promotes the regression of experimental vascular malformations driven by PIK3CA-activating mutations"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Such vascular lesions are ameliorated by administration of dual PI3K/mTOR
      inhibitor, BEZ235, and mTOR inhibitor, Everolimus.
    explanation: >-
      Preclinical evidence that mTOR inhibition regresses PIK3CA-driven vascular
      malformations.
- name: Sclerotherapy for Venous and Lymphatic Malformations
  therapeutic_modality: OTHER
  treatment_term:

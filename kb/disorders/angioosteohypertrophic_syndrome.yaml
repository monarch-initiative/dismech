  - reference: DOI:10.1038/s41419-017-0064-x
    reference_title: "PI3K/mTOR inhibition promotes the regression of experimental vascular malformations driven by PIK3CA-activating mutations"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings reveal that PIK3CA mutations have a key role in the
      pathogenesis of VM and PIK3CA-driven experimental lesions can be
      effectively treated by PI3K/mTOR inhibitors.
    explanation: >-
      Supports PI3K/mTOR pathway hyperactivation as the essential signaling
      intermediate between mutant PIK3CA and vascular malformation formation.
  - reference: PMID:29899452
    reference_title: "Targeted therapy in patients with PIK3CA-related overgrowth syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Western blot and immunofluorescence studies showed AKT/mTORC pathway
      activation in all the examined organs (Fig. 1d and Extended Data Figs.
      5c–e, 6).
    explanation: >-
      Directly demonstrates downstream AKT/mTORC hyperactivation in mosaic
      PIK3CA-driven vascular and overgrowth lesions in vivo.
  downstream:

description: >-
  Angioosteohypertrophic syndrome (Klippel-Trenaunay syndrome; segmental
  capillary-lymphatic-venous malformation with overgrowth) is a congenital,
  low-flow mixed vascular malformation and segmental overgrowth disorder within
  the PIK3CA-related overgrowth spectrum (PROS). Clinically, diagnosis rests on
  at least two of three classic findings affecting an extremity (most commonly a
  lower limb): cutaneous capillary malformation (nevus flammeus), venous
  varicosities and persistent embryonic lateral veins (often accompanied by
  lymphatic malformation), and asymmetric hypertrophy of soft tissue and bone,
  in the absence of high-flow arteriovenous fistulas (which distinguish Parkes
  Weber syndrome). Post-zygotic somatic activating mutations in PIK3CA — five
  recurrent hotspots (p.Cys420Arg, p.Glu542Lys, p.Glu545Lys, p.His1047Arg,
  p.His1047Leu) accounting for roughly 80–90% of cases, often at <10% variant
  allele fraction in malformed tissue — drive constitutive PI3Kalpha/AKT/mTORC1
  signaling, pathological endothelial sprouting, and regional limb overgrowth.
  Complications include chronic pain, venous insufficiency, recurrent
  thrombophlebitis and deep venous thrombosis, pulmonary embolism, cellulitis,
  and gastrointestinal or soft-tissue venous hemorrhage.

name: Colon Adenocarcinoma
creation_date: '2026-02-02T00:16:36Z'
category: Cancer
parents:
- Colorectal Cancer
disease_term:
  preferred_term: colon adenocarcinoma
  term:
    id: MONDO:0002271
    label: colon adenocarcinoma
gene_sets:
- gene_set: MYGENESET:KEGG_COLORECTAL_CANCER
  relationship: CANONICAL_PATHWAY
  note: >-
    KEGG colorectal cancer pathway (Wnt/APC, proliferation, MAPK). Precise link:
    this base adenocarcinoma entry, not the metastatic entry — EMT/invasion BPs
    are carried by this entry's Metastatic-stage nodes (the former Metastatic_Colorectal_Cancer entry was folded in).
description: >-
  Colon adenocarcinoma is the most common histologic subtype of colon cancer and
  typically arises through the adenoma-carcinoma sequence.
stages:
- name: Localized
  description: >-
    Disease confined to the bowel wall and regional nodes, where resection
    with or without adjuvant chemotherapy is potentially curative.
- name: Metastatic
  description: >-
    Advanced colorectal adenocarcinoma with distant spread, most commonly
    hepatic. Liver colonization, KRAS/BRAF-driven signaling, WNT pathway
    activation, and stromal cooperation are recurring mechanistic themes;
    MSI-high disease represents a distinct immune-responsive metastatic
    subset.
  notes: >-
    Folded in from the former Metastatic_Colorectal_Cancer entry (cancer
    granularity ladder, design decisions §3a). That entry was scoped to
    colorectal cancer broadly (MONDO:0005575); its dissemination biology is
    carried by this entry's Liver Tropism and Hepatic Colonization,
    EMT-Linked Invasive Dissemination, Anoikis Escape, Angiogenic Remodeling,
    and Seed-and-Soil Microenvironment Support nodes.
  evidence:
  - reference: PMID:33591350
    reference_title: "Diagnosis and Treatment of Metastatic Colorectal Cancer: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of new colorectal cancer diagnoses, 20% of patients have metastatic disease at presentation and another 25% who present with localized disease will later develop metastases.
    explanation: Quantifies presentation frequency of the metastatic stage.
  - reference: PMID:33591350
    reference_title: "Diagnosis and Treatment of Metastatic Colorectal Cancer: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among people diagnosed with metastatic colorectal cancer, approximately 70% to 75% of patients survive beyond 1 year, 30% to 35% beyond 3 years, and fewer than 20% beyond 5 years from diagnosis.
    explanation: Provides survival benchmarks for the metastatic stage.
pathophysiology:
- name: Adenoma-Carcinoma Sequence
  description: >-
    Stepwise progression from adenomatous polyps to invasive carcinoma drives
    colon adenocarcinoma development.
  evidence:
  - reference: PMID:8055224
    reference_title: "The adenoma carcinoma sequence in colorectal neoplasia."
    supports: SUPPORT
    snippet: "Molecular studies support the clinical impression that adenocarcinoma
      of the large intestine develops in stages. At the center of the pathological
      continuum between normal mucosa and invasive carcinoma is the premalignant lesion,
      the adenomatous polyp."
    explanation: The abstract describes stage-wise progression through
      adenomatous polyps.
- name: APC Loss in Intestinal Stem Cells
  description: >-
    Wnt-pathway-activating loss of APC in intestinal stem cells drives early
    neoplasia.
  evidence:
  - reference: PMID:19092804
    reference_title: "Crypt stem cells as the cells-of-origin of intestinal cancer."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Intestinal cancer is initiated by Wnt-pathway-activating mutations in
      genes such as adenomatous polyposis coli (APC)."
    explanation: The abstract identifies APC loss and Wnt pathway activation as
      initiating events in intestinal cancer.
- name: GUCY2C Tumor-Suppressive Axis Silencing
  biological_scale: MOLECULAR
  description: >-
    The intestinal receptor guanylyl cyclase C (GUCY2C) enforces epithelial
    homeostasis and restrains crypt proliferation. Early in colorectal
    carcinogenesis its endogenous hormones guanylin and uroguanylin are lost,
    silencing GUCY2C-cGMP signaling and removing a tumor-suppressive brake — a
    change that permits progression along the adenoma-carcinoma sequence and is
    the rationale for GUCY2C-agonist chemoprevention.
  biological_processes:
  - preferred_term: receptor guanylyl cyclase signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007168
      label: receptor guanylyl cyclase signaling pathway
  downstream:
  - target: Adenoma-Carcinoma Sequence
    description: >-
      Loss of GUCY2C tumor-suppressive signaling removes a brake on crypt
      proliferation, permitting adenoma-to-carcinoma progression.
  evidence:
  - reference: PMID:28396341
    reference_title: "Bioactivity of Oral Linaclotide in Human Colorectum for Cancer Chemoprevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Guanylate cyclase C (GUCY2C) is a tumor-suppressing receptor silenced by loss of expression of its luminocrine hormones guanylin and uroguanylin early in colorectal carcinogenesis."
    explanation: Supports GUCY2C as a tumor-suppressive axis silenced early in
      colorectal carcinogenesis by loss of its endogenous ligands.
- name: WNT and RAS Pathway Cooperation
  description: >-
    Metastatic colorectal cancer typically evolves on a background of APC/WNT pathway
    dysregulation, with KRAS and BRAF alterations shaping invasion, therapy response,
    and
    liver metastatic fitness. These pathways reinforce proliferative signaling and
    resistance to anoikis during dissemination.
  evidence:
  - reference: PMID:25632202
    reference_title: Prognostic value of KRAS and BRAF mutations in curatively resected colorectal cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: KRAS and BRAF mutations are associated with inferior survival, independent of MSI status, in Japanese patients with curatively resected CRC.
    explanation: This supports the clinical importance of KRAS and BRAF signaling even after accounting for MSI status.
  biological_processes:
  - preferred_term: Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0016055
      label: Wnt signaling pathway
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
- name: Liver Tropism and Hepatic Colonization
  description: >-
    The liver is the dominant first metastatic site because colorectal venous drainage
    enters the portal circulation and because hepatic stromal, endothelial, and immune
    niches support tumor cell arrest and outgrowth.
  evidence:
  - reference: PMID:29201802
    reference_title: Hepatic Metastasis from Colorectal Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The liver is the first location of metastatic disease; due to that the main mechanism of dissemination is through the portal system.
    explanation: This supports the dominant hepatic tropism of metastatic colorectal cancer.
  biological_processes:
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
- name: EMT-Linked Invasive Dissemination
  description: >-
    Metastatic colorectal cancer cells detach from the primary epithelium, invade
    through vascular and stromal barriers, and colonize the liver through a stepwise
    dissemination program consistent with EMT-linked invasive plasticity.
  evidence:
  - reference: PMID:29201802
    reference_title: Hepatic Metastasis from Colorectal Cancer.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Metastasis of the liver from colorectal cancer represents the final stage of a multistep biological process.
    explanation: This supports a sequential detachment, invasion, and colonization program in metastatic CRC that is consistent with EMT-linked dissemination.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  - preferred_term: positive regulation of cell migration
    modifier: INCREASED
    term:
      id: GO:0030335
      label: positive regulation of cell migration
- name: Anoikis Escape
  description: >-
    A subset of metastatic colorectal cancers survives matrix detachment during transit,
    allowing circulating or portal-disseminating cells to persist long enough to seed
    the liver and other distant niches.
  evidence:
  - reference: PMID:41027285
    reference_title: Proteomic landscape of colorectal cancer liver metastasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MM tumors exhibited suppressed ferroptosis and activation of the TGF-β signaling pathway, while SM tumors displayed inhibited anoikis and activation of the WNT signaling pathway, accompanied by activated angiogenesis.
    explanation: This directly supports inhibition of anoikis as a distinct metastatic program in colorectal cancer liver metastasis.
- name: Angiogenic Remodeling
  description: >-
    Metastatic colorectal cancer promotes angiogenic remodeling at secondary sites
    to
    sustain micrometastatic survival, vascular adaptation, and outgrowth in the hepatic
    microenvironment.
  evidence:
  - reference: PMID:41027285
    reference_title: Proteomic landscape of colorectal cancer liver metastasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MM tumors exhibited suppressed ferroptosis and activation of the TGF-β signaling pathway, while SM tumors displayed inhibited anoikis and activation of the WNT signaling pathway, accompanied by activated angiogenesis.
    explanation: This directly supports activated angiogenesis as a distinct metastatic CRC program.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
- name: Seed-and-Soil Microenvironment Support
  description: >-
    Metastatic outgrowth depends on reciprocal signaling between tumor cells and stromal
    populations such as cancer-associated fibroblasts, which help create a permissive
    hepatic microenvironment and immunosuppressive niche.
  evidence:
  - reference: PMID:40530415
    reference_title: A dual-targeting strategy to inhibit colorectal cancer liver metastasis via tumor cell ferroptosis and cancer-associated fibroblast reprogramming.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Within the "seed and soil" paradigm, disrupting both tumor cells and their supportive microenvironment is essential to suppress disease progression.
    explanation: This explicitly frames colorectal liver metastasis in seed-and-soil terms.
  biological_processes:
  - preferred_term: negative regulation of immune response
    modifier: INCREASED
    term:
      id: GO:0050777
      label: negative regulation of immune response

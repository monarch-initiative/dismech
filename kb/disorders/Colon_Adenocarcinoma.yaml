- name: Obesity
  notes: Obesity increases colorectal cancer risk and can reinforce inflammatory programs linked to metastatic progression.
  evidence:
  - reference: PMID:18086756
    reference_title: "Obesity and risk of colorectal cancer: a meta-analysis of 31 studies with 70,000 events."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the estimated relative risk of colorectal cancer was 1.19 [95% confidence interval (95% CI), 1.11-1.29], comparing obese (BMI > or = 30 kg/m(2)) with normal weight (BMI <25 kg/m(2)) people"
    explanation: Meta-analysis of 31 studies quantifies obesity's association with colorectal cancer risk.
- name: Alcohol exposure
  exposure_term:
    preferred_term: exposure to alcohol consumption
    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  notes: Alcohol contributes to colorectal cancer risk and often coexists with metabolic and inflammatory exposures.
  evidence:
  - reference: PMID:21307158
    reference_title: "Alcohol drinking and colorectal cancer risk: an overall and dose-response meta-analysis of published studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

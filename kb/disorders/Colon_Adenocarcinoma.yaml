histopathology:
- name: High-grade tumor budding
  finding_term:
    preferred_term: Tumor budding
    term:
      id: HP:0025461
      label: Abnormal cell morphology
  description: >-
    Tumor budding - isolated single tumor cells or small clusters of up to four
    tumor cells at the invasive front - reflects an infiltrative, dissociative
    growth pattern. High-grade (BD3) budding is an established,
    stage-independent adverse prognostic factor now incorporated into the TNM
    (2017) and WHO (2019) classifications, and is associated with worse
    disease-free, overall, and cancer-specific survival in stage II-III colon
    adenocarcinoma.
  notes: >-
    finding_term falls back to HP:0025461 because NCIT has no tumor-budding term
    in the Histopathology Result branch (searched 2026-08-17). The fallback is
    defensible here - budding is genuinely a cell-arrangement/morphology finding -
    but a targeted NCIT term request would be the better long-term fix.
  evidence:
  - reference: PMID:42322147
    reference_title: "The prognostic value of tumour budding for survival in stage II and III colorectal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumour budding (TB) has been recognized as an additional prognostic
      factor in the TNM (2017) and WHO (2019) classification systems."
    explanation: >-
      This systematic review and meta-analysis (43 studies, 17,831 patients)
      identifies tumor budding as a recognized, guideline-incorporated prognostic
      factor in colorectal cancer.
  - reference: PMID:42322147
    reference_title: "The prognostic value of tumour budding for survival in stage II and III colorectal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms that high-grade TB is an independent prognostic
      factor in stage II-III CRC, consistently associated with worse DFS, OS and CSS."
    explanation: >-
      The pooled analysis confirms high-grade tumor budding independently predicts
      worse disease-free, overall, and cancer-specific survival.
  - reference: PMID:28548122
    reference_title: "Recommendations for reporting tumor budding in colorectal cancer based on the International Tumor Budding Consensus Conference (ITBCC) 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following 10 statements achieved consensus: tumor budding is defined as a single tumor cell or a cell cluster consisting of four tumor cells or less (22/22, 100%)."
    explanation: >-
      The ITBCC consensus supplies the standardized morphologic definition used
      for the finding.
  - reference: PMID:28548122
    reference_title: "Recommendations for reporting tumor budding in colorectal cancer based on the International Tumor Budding Consensus Conference (ITBCC) 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumor budding is an independent predictor of lymph node metastases in pT1 colorectal cancer (23/23, 100%)."
    explanation: >-
      The international consensus establishes the independent prognostic value
      of tumor budding for lymph-node metastasis in early colorectal cancer.
- name: Poorly differentiated clusters
  finding_term:
    preferred_term: Poorly differentiated clusters
    term:
      id: HP:0025461
      label: Abnormal cell morphology
  description: >-
    Poorly differentiated clusters (PDCs) are clusters of five or more cancer
    cells lacking a gland-like structure. Quantifying PDCs into a site-specific
    grade (Grade(PDC): G1 fewer than 5, G2 5-9, G3 ten or more clusters in the
    field with the maximum clusters) stratifies recurrence-free survival
    independently of, and in the original series more strongly than, TNM stage.
  notes: >-
    finding_term falls back to HP:0025461 because NCIT has no poorly-differentiated-cluster
    or Grade(PDC) term in the Histopathology Result branch (searched 2026-08-17);
    its retired "Poorly Differentiated" grade term is a tumor-differentiation grade,
    not this cluster-counting finding. PDCs are a genuine cell-arrangement and
    differentiation finding, so the fallback fits better here than for the TIL finding.
  evidence:
  - reference: PMID:24418853
    reference_title: "Site-specific tumor grading system in colorectal cancer: multicenter pathologic review of the value of quantifying poorly differentiated clusters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis showed that Grade exerted an influence on
      prognostic outcome independently of TNM staging"
    explanation: >-
      This 12-institution review of 3243 colorectal cancer cases shows the PDC-based
      grade is prognostic independently of TNM stage.
  - reference: PMID:24418853
    reference_title: "Site-specific tumor grading system in colorectal cancer: multicenter pathologic review of the value of quantifying poorly differentiated clusters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade(PDC) has a robust prognostic power and promises to be of
      sufficient clinical value to merit implementation as a site-specific grading
      system in CRC."
    explanation: >-
      The authors conclude that PDC-based grading has robust, clinically
      implementable prognostic value.
- name: Tumor-infiltrating lymphocytes (Immunoscore)
  finding_term:
    preferred_term: Tumor-infiltrating lymphocytes
    term:
      id: NCIT:C35983
      label: Lymphocytic Infiltrate
  description: >-
    The type, density, and location of tumor-infiltrating lymphocytes - in
    particular CD3+ and cytotoxic CD8+ T cells at the tumor core and invasive
    margin, quantified as the consensus Immunoscore - is a favorable,
    stage-independent prognostic marker in colon adenocarcinoma. A dense adaptive
    immune infiltrate predicts lower recurrence risk and is under evaluation to
    help guide adjuvant chemotherapy selection.
  notes: >-
    finding_term is NCIT:C35983 Lymphocytic Infiltrate, "a morphologic finding
    referring to the presence of a cellular infiltrate that is composed of
    non-neoplastic or neoplastic lymphocytes in a tissue sample" - the closest
    match to the Immunoscore reading, which is a CD3+/CD8+ lymphocyte density.
    Candidates passed over (searched 2026-08-17, revised 2026-08-25):
    NCIT:C35980 Chronic Inflammatory Infiltrate is a morphologic finding but
    asserts a chronic-inflammatory character and admits lymphoplasmacytic cells
    and reactive plasma cells that the Immunoscore does not measure;
    NCIT:C12546 Tumor Infiltrating Lymphocyte is a cell type rather than a
    finding; NCIT:C160833 Tumor Infiltrating Lymphocyte Absent asserts the
    inverse of this finding; NCIT:C160832 and NCIT:C204678 are a CRF question
    and a count measurement rather than findings. The specific CD3+/CD8+
    Immunoscore reading is carried by preferred_term and the description.
  evidence:
  - reference: PMID:17008531
    reference_title: "Type, density, and location of immune cells within human colorectal tumors predict clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the immunological data (the type, density, and location of immune
      cells within the tumor samples) were found to be a better predictor of patient
      survival than the histopathological methods currently used to stage colorectal
      cancer."
    explanation: >-
      This landmark study shows that in situ immune-cell type, density, and location
      predict survival better than standard histopathologic staging in colorectal cancer.
  - reference: PMID:29754777
    reference_title: "International validation of the consensus Immunoscore for the classification of colon cancer: a prognostic and accuracy study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Immunoscore provides a reliable estimate of the risk of recurrence
      in patients with colon cancer."
    explanation: >-
      International validation confirms the CD3+/CD8+ tumor-infiltrating-lymphocyte-based
      Immunoscore reliably estimates recurrence risk in colon cancer.

histopathology:
- name: High-grade tumor budding
  finding_term:
    preferred_term: Tumor budding
    term:
      id: HP:0025461
      label: Abnormal cell morphology
  description: >-
    Tumor budding - isolated single tumor cells or small clusters of up to four
    tumor cells at the invasive front - reflects an infiltrative, dissociative
    growth pattern. High-grade (BD3) budding is an established,
    stage-independent adverse prognostic factor now incorporated into the TNM
    (2017) and WHO (2019) classifications, and is associated with worse
    disease-free, overall, and cancer-specific survival in stage II-III colon
    adenocarcinoma.
  notes: >-
    finding_term falls back to HP:0025461 because NCIT has no tumor-budding term
    in the Histopathology Result branch (searched 2026-08-17). The fallback is
    defensible here - budding is genuinely a cell-arrangement/morphology finding -
    but a targeted NCIT term request would be the better long-term fix.
  evidence:
  - reference: PMID:42322147
    reference_title: "The prognostic value of tumour budding for survival in stage II and III colorectal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumour budding (TB) has been recognized as an additional prognostic
      factor in the TNM (2017) and WHO (2019) classification systems."
    explanation: >-
      This systematic review and meta-analysis (43 studies, 17,831 patients)
      identifies tumor budding as a recognized, guideline-incorporated prognostic
      factor in colorectal cancer.
  - reference: PMID:42322147
    reference_title: "The prognostic value of tumour budding for survival in stage II and III colorectal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms that high-grade TB is an independent prognostic
      factor in stage II-III CRC, consistently associated with worse DFS, OS and CSS."
    explanation: >-
      The pooled analysis confirms high-grade tumor budding independently predicts
      worse disease-free, overall, and cancer-specific survival.
  - reference: PMID:28548122
    reference_title: "Recommendations for reporting tumor budding in colorectal cancer based on the International Tumor Budding Consensus Conference (ITBCC) 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The following 10 statements achieved consensus: tumor budding is defined as a single tumor cell or a cell cluster consisting of four tumor cells or less (22/22, 100%)."
    explanation: >-
      The ITBCC consensus supplies the standardized morphologic definition used
      for the finding.
  - reference: PMID:28548122
    reference_title: "Recommendations for reporting tumor budding in colorectal cancer based on the International Tumor Budding Consensus Conference (ITBCC) 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumor budding is an independent predictor of lymph node metastases in pT1 colorectal cancer (23/23, 100%)."
    explanation: >-
      The international consensus establishes the independent prognostic value
      of tumor budding for lymph-node metastasis in early colorectal cancer.
- name: Poorly differentiated clusters
  finding_term:
    preferred_term: Poorly differentiated clusters
    term:
      id: HP:0025461
      label: Abnormal cell morphology
  description: >-
    Poorly differentiated clusters (PDCs) are clusters of five or more cancer
    cells lacking a gland-like structure. Quantifying PDCs into a site-specific
    grade (Grade(PDC): G1 fewer than 5, G2 5-9, G3 ten or more clusters in the
    field with the maximum clusters) stratifies recurrence-free survival
    independently of, and in the original series more strongly than, TNM stage.
  notes: >-
    finding_term falls back to HP:0025461 because NCIT has no poorly-differentiated-cluster
    or Grade(PDC) term in the Histopathology Result branch (searched 2026-08-17);
    its retired "Poorly Differentiated" grade term is a tumor-differentiation grade,
    not this cluster-counting finding. PDCs are a genuine cell-arrangement and
    differentiation finding, so the fallback fits better here than for the TIL finding.
  evidence:
  - reference: PMID:24418853
    reference_title: "Site-specific tumor grading system in colorectal cancer: multicenter pathologic review of the value of quantifying poorly differentiated clusters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis showed that Grade exerted an influence on
      prognostic outcome independently of TNM staging"
    explanation: >-
      This 12-institution review of 3243 colorectal cancer cases shows the PDC-based
      grade is prognostic independently of TNM stage.
  - reference: PMID:24418853
    reference_title: "Site-specific tumor grading system in colorectal cancer: multicenter pathologic review of the value of quantifying poorly differentiated clusters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade(PDC) has a robust prognostic power and promises to be of
      sufficient clinical value to merit implementation as a site-specific grading
      system in CRC."
    explanation: >-
      The authors conclude that PDC-based grading has robust, clinically
      implementable prognostic value.
- name: Tumor-infiltrating lymphocytes (Immunoscore)
  finding_term:
    preferred_term: Tumor-infiltrating lymphocytes
    term:
      id: NCIT:C35983
      label: Lymphocytic Infiltrate
  description: >-
    The type, density, and location of tumor-infiltrating lymphocytes - in
    particular CD3+ and cytotoxic CD8+ T cells at the tumor core and invasive
    margin, quantified as the consensus Immunoscore - is a favorable,
    stage-independent prognostic marker in colon adenocarcinoma. A dense adaptive
    immune infiltrate predicts lower recurrence risk and is under evaluation to
    help guide adjuvant chemotherapy selection.
  notes: >-
    finding_term is NCIT:C35983 Lymphocytic Infiltrate, "a morphologic finding
    referring to the presence of a cellular infiltrate that is composed of
    non-neoplastic or neoplastic lymphocytes in a tissue sample" - the closest
    match to the Immunoscore reading, which is a CD3+/CD8+ lymphocyte density.
    Candidates passed over (searched 2026-08-17, revised 2026-08-25):
    NCIT:C35980 Chronic Inflammatory Infiltrate is a morphologic finding but
    asserts a chronic-inflammatory character and admits lymphoplasmacytic cells
    and reactive plasma cells that the Immunoscore does not measure;
    NCIT:C12546 Tumor Infiltrating Lymphocyte is a cell type rather than a
    finding; NCIT:C160833 Tumor Infiltrating Lymphocyte Absent asserts the
    inverse of this finding; NCIT:C160832 and NCIT:C204678 are a CRF question
    and a count measurement rather than findings. The specific CD3+/CD8+
    Immunoscore reading is carried by preferred_term and the description.
  evidence:
  - reference: PMID:17008531
    reference_title: "Type, density, and location of immune cells within human colorectal tumors predict clinical outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the immunological data (the type, density, and location of immune
      cells within the tumor samples) were found to be a better predictor of patient
      survival than the histopathological methods currently used to stage colorectal
      cancer."
    explanation: >-
      This landmark study shows that in situ immune-cell type, density, and location
      predict survival better than standard histopathologic staging in colorectal cancer.
  - reference: PMID:29754777
    reference_title: "International validation of the consensus Immunoscore for the classification of colon cancer: a prognostic and accuracy study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Immunoscore provides a reliable estimate of the risk of recurrence
      in patients with colon cancer."
    explanation: >-
      International validation confirms the CD3+/CD8+ tumor-infiltrating-lymphocyte-based
      Immunoscore reliably estimates recurrence risk in colon cancer.
treatments:
- name: Surgical Resection
  description: Surgical removal of the colon tumor when localized.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  evidence:
  - reference: PMID:35613396
    reference_title: "[Adenosquamous carcinoma of the colon: a case report and review of the literature]."
    supports: PARTIAL
    snippet: "The colonoscopic study presented a tumor in the ascending colon, which
      after surgical resection and pathological studies, turned out to be a primary
      colonoc adenosquamous carcinoma."
    explanation: The abstract describes surgical resection of a colon tumor.
- name: Aspirin Chemoprevention
  description: >-
    Low-dose aspirin is an established chemopreventive ("interception") agent that
    reduces the recurrence of colorectal adenomas — the precursor lesions of colon
    adenocarcinoma. The cited randomized trial evaluated secondary prevention in
    higher-risk individuals with a recent history of documented adenomas; the
    81 mg dose reduced adenoma recurrence while 325 mg did not. Its antineoplastic
    effect in the large bowel is attributed largely to inhibition of
    COX/prostaglandin-driven pro-tumorigenic signaling within the adenoma-carcinoma
    sequence. Preventive use is balanced against gastrointestinal bleeding risk.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemoprevention
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Adenoma-Carcinoma Sequence
    treatment_effect: INHIBITS
    description: >-
      Aspirin reduces the incidence of colorectal adenomas and advanced neoplasia,
      intercepting the adenoma-to-carcinoma progression that drives colon
      adenocarcinoma.
    evidence:
    - reference: PMID:12621133
      reference_title: "A randomized trial of aspirin to prevent colorectal adenomas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Low-dose aspirin has a moderate chemopreventive effect on adenomas in the large bowel."
      explanation: Randomized-trial evidence that low-dose aspirin reduces
        colorectal adenomas, supporting the INHIBITS edge on the adenoma-carcinoma
        sequence.
  evidence:
  - reference: PMID:12621133
    reference_title: "A randomized trial of aspirin to prevent colorectal adenomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a randomized, double-blind trial of aspirin as a chemopreventive agent against colorectal adenomas."
    explanation: Establishes aspirin as a randomized-trial-tested chemopreventive
      agent against colorectal adenomas.
- name: GUCY2C Agonist (Investigational Chemoprevention)
  description: >-
    Oral GUCY2C agonists (linaclotide, plecanatide) aim to reactivate the
    tumor-suppressive GUCY2C axis that is silenced early in colorectal
    carcinogenesis, restoring cGMP-dependent homeostatic signaling and restraining
    epithelial proliferation. In a human study oral linaclotide activated GUCY2C
    and reduced colorectal epithelial proliferation, but only after colon
    preparation — the FDA-approved gastric-release formulation does not reliably
    reach the colorectum, so a colorectum-targeted formulation is required before
    this can serve as a chemopreventive.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: chemoprevention
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: linaclotide
      term:
        id: CHEBI:68551
        label: linaclotide
  target_mechanisms:
  - target: GUCY2C Tumor-Suppressive Axis Silencing
    treatment_effect: RESTORES
    description: >-
      GUCY2C agonists substitute for the lost guanylin/uroguanylin ligands,
      reactivating GUCY2C-cGMP signaling and restoring the tumor-suppressive brake
      on crypt proliferation.
    evidence:
    - reference: PMID:28396341
      reference_title: "Bioactivity of Oral Linaclotide in Human Colorectum for Cancer Chemoprevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "GUCY2C activation by oral linaclotide was associated with homeostatic signaling, including phosphorylation of vasodilator-stimulated phosphoprotein and inhibition of proliferation quantified by reduced Ki67-positive epithelial cells."
      explanation: Demonstrates that a GUCY2C agonist reactivates homeostatic
        signaling and reduces epithelial proliferation, supporting the RESTORES edge.
  evidence:
  - reference: PMID:28396341
    reference_title: "Bioactivity of Oral Linaclotide in Human Colorectum for Cancer Chemoprevention."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The study results highlight the importance of developing a novel GUCY2C agonist formulated for release and activity targeted to the large intestine for colorectal cancer prevention"
    explanation: Supports GUCY2C-agonist chemoprevention as a strategy while noting
      the current formulation is inadequate for the colorectum — an honest limitation.
- name: MUC1 Peptide Vaccine (Investigational Immunoprevention)
  description: >-
    MUC1 is an epithelial glycoprotein aberrantly expressed on colorectal adenomas
    and carcinomas, making it a candidate shared antigen for immunoprevention. A
    MUC1 peptide vaccine aims to raise anti-MUC1 immunity to intercept recurrent
    adenoma formation in individuals with a prior advanced adenoma. In a
    randomized, placebo-controlled prevention trial the vaccine was immunogenic
    only in vaccine recipients but did not significantly reduce adenoma recurrence
    overall; a 38% absolute reduction was seen in the subset who mounted an immune
    response. It remains investigational.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Adenoma-Carcinoma Sequence
    treatment_effect: INHIBITS
    description: >-
      Anti-MUC1 immunity is intended to eliminate MUC1-overexpressing adenomatous
      epithelium and reduce adenoma recurrence, intercepting the adenoma-carcinoma
      sequence; in the trial the vaccine did not reduce adenoma recurrence in the
      intention-to-treat population (aRR 0.83, 95% CI 0.60-1.14, P = 0.25), and the
      38% absolute reduction observed in immune responders was likewise not
      statistically significant (aRR 0.41, 95% CI 0.15-1.11, P = 0.08) —
      hypothesis-generating rather than confirmatory.
    evidence:
    - reference: PMID:36892581
      reference_title: "Randomized, Double-Blind, Placebo-Controlled Trial of MUC1 Peptide Vaccine for Prevention of Recurrent Colorectal Adenoma."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a 38% absolute reduction in adenoma recurrence compared with placebo was observed in participants who had an immune response at week 12 and with the booster injection."
      explanation: Randomized-trial evidence of a hypothesis-generating signal — a
        38% absolute reduction in adenoma recurrence was observed only in immune
        responders and was not statistically significant (P = 0.08), with no effect
        in the intention-to-treat population (P = 0.25) — supporting a qualified,
        non-confirmatory INHIBITS edge on the adenoma-carcinoma sequence.
  evidence:
  - reference: PMID:36892581
    reference_title: "Randomized, Double-Blind, Placebo-Controlled Trial of MUC1 Peptide Vaccine for Prevention of Recurrent Colorectal Adenoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An immune response was observed only in vaccine recipients."
    explanation: Confirms the MUC1 peptide vaccine is immunogenic in the colorectal
      adenoma prevention setting.

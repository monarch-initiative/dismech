  description:  Molecular profiling for somatic mutations that predict response to anti-EGFR therapy in colorectal cancer (CRC) has become standard practice. However, abundant tissue from metastatic lesions is not always available from patients with metastatic CRC. Concerns involving genetic heterogeneity between primary and metastatic lesions have called into question the suitability of profiling primary tumors in patients with metastatic disease.

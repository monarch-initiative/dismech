diagnosis:
- name: KIFBP sequencing with copy-number analysis
  description: >-
    The diagnosis rests on biallelic KIFBP variants. Exome or targeted
    sequencing finds the usual truncating alleles; intragenic exon deletions
    need a method that detects copy-number change. Molecular testing is
    emphasized because the phenotype overlaps with Mowat-Wilson syndrome and
    other syndromic Hirschsprung disease.
  evidence:
  - reference: PMID:34421502
    reference_title: "Goldberg-Shprintzen Syndrome Associated with a Novel Variant in the KIFBP Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome analysis was performed to clarify the etiology of the clinical
      features.
    explanation: >-
      Exome sequencing as the route to diagnosis in a typical patient.
  - reference: PMID:28277559
    reference_title: "Association of a Novel Nonsense Mutation in KIAA1279 with Goldberg-Shprintzen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering the wide range of phenotypic variations in GOSHS, relying on
      phenotypic characteristics for discrimination of GOSH from similar
      syndromes may lead to misdiagnosis.
    explanation: >-
      The argument for molecular rather than clinical diagnosis.
- name: Rectal biopsy
  description: >-
    Histological confirmation of aganglionosis when Hirschsprung disease is
    suspected.
  evidence:
  - reference: PMID:42238158
    reference_title: "Goldberg-Shprintzen Megacolon Syndrome Diagnosed in the Neonatal Period: A Case Report With Molecular Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hirschsprung disease was histologically confirmed by rectal biopsy.
    explanation: >-
      Biopsy confirmation in a GOSHS neonate.

- name: Saline rectal irrigation
  description: >-
    Bowel decompression with saline rectal irrigations while the Hirschsprung diagnosis is confirmed and until
    definitive surgery. The recommendation comes from Hirschsprung disease guidance generally, not from
    GOSHS-specific studies.

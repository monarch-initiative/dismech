- name: Loss of KIFBP Kinesin Inhibition and Cytoskeletal Interaction
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    KIFBP is a tetratricopeptide-repeat alpha-solenoid that binds the motor domains of a subset of kinesins,
    remodels them and blocks their microtubule attachment; it also interacts with actin filaments and
    microtubules. Its loss is expected to deregulate these motors and cytoskeletal interactions. This is inferred
    from normal KIFBP biochemistry; it should not be read as a uniform decrease in kinesin transport, and which
    deregulated motors matter for each disease feature is unknown. A primary mitochondrial respiratory defect is
    not supported: patient fibroblasts lacking KIFBP had normal respiratory chain activity.
  genes:
  - preferred_term: KIFBP
    term:
      id: hgnc:23419
      label: KIFBP
  molecular_functions:
  - preferred_term: kinesin binding
    modifier: DECREASED
    term:
      id: GO:0019894
      label: kinesin binding
  evidence:
  - reference: PMID:33252036
    reference_title: "The mechanism of kinesin inhibition by kinesin-binding protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Kinesin-binding protein (KBP) interacts with a subset of kinesins via their motor domains, inhibits their microtubule (MT) attachment, and blocks their cellular function."
    explanation: Defines the normal kinesin-inhibitory function lost when KIFBP is absent.
  - reference: PMID:34797717
    reference_title: "Kinesin-binding protein remodels the kinesin motor to prevent microtubule binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Kinesin-binding protein (KIFBP), which is mutated in Goldberg-Shprintzen syndrome, binds to and inhibits the catalytic motor heads of 8 of 45 kinesin superfamily members, but the mechanism remains poorly defined."
    explanation: Independent structural work confirming selective kinesin inhibition by the GOSHS protein.
  - reference: PMID:23427148
    reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KBP did not co-localize with mitochondria in control human fibroblasts, but interacted with the actin and tubulin cytoskeleton."
    explanation: Places KIFBP at the cytoskeleton rather than mitochondria.
  - reference: PMID:23427148
    reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Despite the absence of functional KBP, respiratory chain complex activity in patient fibroblasts was normal."
    explanation: Argues against an alternative primary mitochondrial respiratory mechanism.
  downstream:
  - target: Impaired Axon Outgrowth with Axonal Microtubule Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Which deregulated kinesin or cytoskeletal interaction disrupts axonal microtubules is not established.
    evidence:
    - reference: PMID:18192286
      reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results together suggest that kbp is an important regulator of the microtubule dynamics that drive the forward propulsion of axons."
      explanation: The zebrafish study interprets the axonal defect as loss of KBP regulation of axonal microtubules.
    - reference: PMID:23427148
      reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "KBP expression directly affected neurite growth in a neuron-like cell line (human neuroblastoma SH-SY5Y), in keeping with the central (polymicrogyria) and enteric (HSCR) neuronal developmental defects seen in GOSHS patients."
      explanation: KBP levels control neurite growth in a neuron-like cell line.
  - target: Cytokinesis Failure in Dividing Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      KIFBP depletion alters midbody localization of the kinesins KIF23 and KIF14 and reduces microtubule
      stability in dividing cultured cells.
    evidence:
    - reference: PMID:34100550
      reference_title: "Goldberg-Shprintzen syndrome protein KIF1BP is a CITK interactor implicated in cytokinesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "KIF1BP knockdown decreases microtubule stability, increases KIF23 midbody levels and impairs midbody localization of KIF14, as well as of chromosome passenger complex."
      explanation: Links KIF1BP loss to deregulated midbody kinesins in dividing cells.
- name: Impaired Axon Outgrowth with Axonal Microtubule Disruption
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In kbp mutant zebrafish, early axon outgrowth is slower in peripheral and central neurons and axonal
    microtubules are disrupted. Kif1bp knockout mice show defective axon extension from some neuronal
    populations, and cortical KBP knockdown in mice prevents callosal axons from crossing the midline. Human
    tissue evidence is lacking.

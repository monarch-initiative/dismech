name: Goldberg-Shprintzen Syndrome
creation_date: "2026-10-09T12:00:00Z"
description: >-
  Goldberg-Shprintzen syndrome (GOSHS) is a rare autosomal recessive neurodevelopmental malformation syndrome
  caused by biallelic loss-of-function variants in KIFBP (formerly KIAA1279 or KBP), which encodes a
  kinesin-binding protein that inhibits a subset of kinesin motors and associates with the actin and microtubule
  cytoskeleton. Core features are microcephaly, intellectual disability and developmental delay, a recognizable
  facial gestalt, cortical malformation such as polymicrogyria, and axonal neuropathy. Hirschsprung disease is
  frequent but variable, even between relatives sharing the same variant. Model organisms show defective axon
  outgrowth and maintenance, delayed enteric neural crest colonization of the gut, and impaired cortical neuron
  migration; how these defects produce the human malformations is not established. It is distinct from the
  SKI-related Shprintzen-Goldberg craniosynostosis syndrome.
category: Mendelian
disease_term:
  preferred_term: Goldberg-Shprintzen Syndrome
  term:
    id: MONDO:0012280
    label: Goldberg-Shprintzen syndrome
synonyms:
- GOSHS
- Goldberg-Shprintzen megacolon syndrome
- megacolon-microcephaly syndrome
notes: >-
  No GeneReviews chapter exists for Goldberg-Shprintzen syndrome. Not to be confused with Shprintzen-Goldberg
  syndrome (SKI-related craniosynostosis with marfanoid habitus), a different disorder whose features do not
  apply here. Hypotonia, seizures and cardiac anomalies are taken from the per-patient table of the 2020 series
  (PMID:32939943), which compiles 34 published and new patients and marks many features as not assessed. An
  Orphanet citation (ORPHA:66629) was not added because the Orphadata bulk file pinned in data/orphadata no
  longer matches the upstream release, so the structured Orphanet cache cannot be rebuilt without repinning.
prevalence:
- population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population-based rate exists. A 2020 review counted 37 previously reported patients and added nine new
    ones; this is a dated count of published cases, not an occurrence estimate.
  evidence:
  - reference: PMID:32939943
    reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 37 patients with GOSHS have been reported. Here, we document nine new patients with variants in KIFBP: seven with nonsense variants and two with missense variants."
    explanation: Count of published patients at the time of the 2020 case series, the only occurrence measure available.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Biallelic (homozygous or compound heterozygous) KIFBP variants cause the disorder; several families are
    consanguineous. Expressivity is variable, most visibly for Hirschsprung disease, which can differ between
    siblings carrying the same variant.
  evidence:
  - reference: PMID:15883926
    reference_title: "Homozygous nonsense mutations in KIAA1279 are associated with malformations of the central and enteric nervous systems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified, by homozygosity mapping, a novel locus on 10q21.3-q22.1 for Goldberg-Shprintzen syndrome (GOSHS) in a consanguineous Moroccan family."
    explanation: Homozygosity mapping in a consanguineous family is consistent with recessive inheritance.
  - reference: PMID:23427148
    reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Goldberg-Shprintzen syndrome (GOSHS, MIM #609460) is an autosomal recessive disorder of intellectual disability, specific facial gestalt and Hirschsprung's disease (HSCR)."
    explanation: States the autosomal recessive mode of inheritance.
  - reference: PMID:32939943
    reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Homozygosity mapping followed by Sanger sequencing, identified homozygous or compound heterozygous loss of function (LOF) variants in the kinesin binding protein gene (KIFBP, previously known as KIAA1279), as causative for GOSHS"
    explanation: Both homozygous and compound heterozygous genotypes are reported, i.e. biallelic inheritance.
genetic:
- name: KIFBP
  gene_term:
    preferred_term: KIFBP
    term:
      id: hgnc:23419
      label: KIFBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Formerly KIAA1279, KIF1BP or KBP. Most reported alleles are truncating (nonsense, frameshift, exon
    deletions) and abolish protein expression; missense variants reported in two patients reduce expression in
    transfected cells, and one of them was classified likely benign by ACMG criteria, so missense pathogenicity
    is less secure. No correlation between variant position and severity was found.
  variants:
  - name: Truncating KIFBP variants
    description: >-
      Nonsense, frameshift and exon-deletion alleles, including p.Arg90Ter, p.Ser200Ter and p.Arg202IlefsTer2,
      which trigger nonsense-mediated mRNA decay and absence of KIFBP protein. Truncating variants in the 2020
      series were classified pathogenic under ACMG criteria.
    evidence:
    - reference: PMID:23427148
      reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The homozygous KIAA1279 mutations in these patients (p.Arg90X, p.Ser200X or p.Arg202IlefsX2) led to nonsense-mediated mRNA decay and loss of KBP function."
      explanation: Patient truncating alleles cause transcript decay and loss of function.
    - reference: PMID:32939943
      reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "According to the guidelines established by the American College of Medical Genetics (ACMG), all truncating variants identified in our GOSHS patients are classified as pathogenic"
      explanation: ACMG classification of the truncating alleles in the 2020 series.
  - name: KIFBP missense variants
    description: >-
      Homozygous p.Pro189Ser and the compound heterozygous p.Glu23Gly/p.Ser427Gly combination reduce KIFBP
      expression in transfected cells; they were the first missense variants reported in GOSHS.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:32939943
      reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results showed that the missense variants led to reduced expression of KIFBP, while the truncating variants resulted in lack of protein."
      explanation: Expression assays of the missense alleles in transfected cells.
  evidence:
  - reference: PMID:15883926
    reference_title: "Homozygous nonsense mutations in KIAA1279 are associated with malformations of the central and enteric nervous systems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that homozygous nonsense mutations in KIAA1279 at 10q22.1, encoding a protein with two tetratrico peptide repeats, underlie this syndromic form of Hirschsprung disease and generalized polymicrogyria"
    explanation: Gene identification in the original consanguineous family.
  - reference: PMID:32939943
    reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Goldberg-Shprintzen syndrome (GOSHS) is caused by loss of function variants in the kinesin binding protein gene (KIFBP)."
    explanation: Confirms KIFBP loss of function as the cause across additional patients.

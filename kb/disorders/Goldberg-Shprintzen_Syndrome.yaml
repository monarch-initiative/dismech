  evidence:
  - reference: PMID:29192291
    reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although newborn Kif1bp -/- mice had neurons along the entire bowel, the
      colonization of the gut by neural crest-derived cells was delayed.
    explanation: >-
      Records both the delay and its limit: colonization is late but
      eventually complete in the mouse.
  downstream:
  - target: Hirschsprung disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Delayed colonization is the accepted route to distal aganglionosis in
      Hirschsprung disease generally, but in GOSHS the step from delay to
      absent distal ganglia is inferred: the knockout mouse is not aganglionic,
      and why only about two thirds of patients develop Hirschsprung disease is
      unexplained.
    evidence:
    - reference: PMID:15883926
      reference_title: "Homozygous nonsense mutations in KIAA1279 are associated with malformations of the central and enteric nervous systems."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We demonstrate that homozygous nonsense mutations in KIAA1279 at
        10q22.1, encoding a protein with two tetratrico peptide repeats,
        underlie this syndromic form of Hirschsprung disease and generalized
        polymicrogyria, establishing the importance of KIAA1279 in both enteric
        and central nervous system development.
      explanation: >-
        Establishes that loss of the gene underlies the enteric defect in
        patients; the colonization step between them is taken from the mouse.
- name: Defective Cortical Neuronal Migration and Maturation

discussions:
- discussion_id: goshs_hirschsprung_mouse_mismatch
  prompt: >-
    Why does Kif1bp loss delay but not abolish enteric colonization in mice,
    while about 70% of GOSHS patients have distal aganglionosis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Delayed Enteric Neural Crest Colonization
  - phenotypes#Hirschsprung disease
  rationale: >-
    The only mammalian model reproduces the colonization delay but not the
    aganglionosis that defines the human bowel phenotype, so the step from
    delay to Hirschsprung disease rests on analogy with non-syndromic
    Hirschsprung disease. Species differences in the timing of gut
    colonization, or modifier variation, could explain the gap.
  evidence:
  - reference: PMID:29192291
    reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although newborn Kif1bp -/- mice had neurons along the entire bowel, the
      colonization of the gut by neural crest-derived cells was delayed.
    explanation: >-
      The model result that defines the mismatch.
- discussion_id: goshs_hirschsprung_variable_expressivity
  prompt: >-
    What determines whether a person with biallelic KIFBP loss develops
    Hirschsprung disease, given that siblings with the same variant can differ
    and common Hirschsprung risk SNPs do not explain it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Hirschsprung disease
  rationale: >-
    Truncating alleles remove the protein entirely, so a residual-expression
    threshold cannot explain discordance among patients who all lack KIFBP;
    another genetic or stochastic factor is implied but unidentified.
  evidence:
  - reference: PMID:32939943
    reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, this wide phenotypic range is even found in siblings
      carrying the same variant.
    explanation: >-
      Intrafamilial discordance with an identical genotype.
- discussion_id: goshs_microcephaly_mechanism
  prompt: >-
    Is GOSHS microcephaly caused by cytokinesis failure in neural progenitors,
    by postnatal neuronal death, or both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Midbody Maturation and Cytokinesis
  - pathophysiology#Defective Cortical Neuronal Migration and Maturation
  - phenotypes#Microcephaly
  rationale: >-
    The cytokinesis defect has been measured only in cultured non-neural
    cells, and the knockdown mouse found no effect on neural differentiation
    but did find postnatal apoptosis. Neither has been tested in human neural
    progenitors.
  evidence:
  - reference: PMID:31736709
    reference_title: "Multiple Functions of KBP in Neural Development Underlie Brain Anomalies in Goldberg-Shprintzen Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By immunostaining of neuronal lineage markers, we found that KBP
      knockdown does not affect the neural differentiation process.
    explanation: >-
      Shows the differentiation step is spared in the one in vivo cortical
      model, leaving the microcephaly mechanism open.

    modifier: DECREASED
    term:
      id: GO:0000281
      label: mitotic cytokinesis
  evidence:
  - reference: PMID:34100550
    reference_title: "Goldberg-Shprintzen syndrome protein KIF1BP is a CITK interactor implicated in cytokinesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KIF1BP knockdown decreases microtubule stability, increases KIF23
      midbody levels and impairs midbody localization of KIF14, as well as of
      chromosome passenger complex.
    explanation: >-
      The measured midbody defects behind this node.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cytokinesis failure in neural progenitors is a recognized route to
      microcephaly (it is the mechanism of CIT-related MCPH17), but for KIFBP
      it has been shown only in cultured cell lines, not in neural progenitors.
    evidence:
    - reference: PMID:34100550
      reference_title: "Goldberg-Shprintzen syndrome protein KIF1BP is a CITK interactor implicated in cytokinesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        These data indicate that KIF1BP is a CITK interactor involved in

- name: Impaired Midbody Maturation and Cytokinesis
  biological_scale: CELLULAR
  description: >-
    KIFBP binds citron kinase (CITK, the MCPH17 microcephaly protein) in
    mitotic cells and is needed for midbody maturation and abscission; its
    knockdown destabilizes microtubules and mislocalizes KIF23, KIF14 and the
    chromosome passenger complex at the midbody. The contribution of this
    defect to patient microcephaly is a proposal, not a demonstrated step.

  evidence:
  - reference: PMID:9719364
    reference_title: "Hirschsprung disease, microcephaly, mental retardation, and characteristic facial features: delineation of a new syndrome and identification of a locus at chromosome 2q22-q23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In particular, our patients appear to have a separate disorder from
      Goldberg-Shprintzen syndrome, for which autosomal recessive inheritance
      has been proposed because of sib recurrence and consanguinity in some
      families.
    explanation: >-
      The founding Mowat-Wilson delineation distinguishes it from GOSHS on
      inheritance.
  - reference: PMID:28277559
    reference_title: "Association of a Novel Nonsense Mutation in KIAA1279 with Goldberg-Shprintzen Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The phonotypic features resembles Mowat-Wilson syndrome (MOWS; 235730)
      but these two disorders are genetically distinctive
    explanation: >-
      States the phenotypic overlap and genetic distinction (source spelling
      retained).
- name: Isolated Hirschsprung disease
  disease_term:
    preferred_term: Hirschsprung disease
    term:
      id: MONDO:0018309
      label: Hirschsprung disease
  description: >-
    A neonate with Hirschsprung disease who also has hypotonia, dysmorphic
    features or brain imaging abnormalities should be evaluated for GOSHS
    rather than treated as non-syndromic Hirschsprung disease. Curated in this
    knowledge base as Hirschsprung_Disease.
  distinguishing_features:
  - Microcephaly, hypotonia, facial dysmorphism or cortical malformation alongside the aganglionosis.
  evidence:
  - reference: PMID:42238158
    reference_title: "Goldberg-Shprintzen Megacolon Syndrome Diagnosed in the Neonatal Period: A Case Report With Molecular Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GOSHS should be considered in neonates presenting with Hirschsprung
      disease in combination with hypotonia, dysmorphic features, or
      neuroimaging abnormalities.
    explanation: >-
      Names the clinical combination that separates GOSHS from isolated
      Hirschsprung disease.
treatments:
- name: Surgical management of Hirschsprung disease
  description: >-
    Diverting colostomy and then definitive surgery for the aganglionic
    segment, as in non-syndromic Hirschsprung disease. No GOSHS-specific
    surgical outcome data exist.
  treatment_term:
    preferred_term: colostomy for Hirschsprung disease
    term:
      id: NCIT:C15211
      label: Colostomy
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Aganglionic megacolon
    term:
      id: HP:0002251
      label: Aganglionic megacolon
  evidence:
  - reference: PMID:42238158
    reference_title: "Goldberg-Shprintzen Megacolon Syndrome Diagnosed in the Neonatal Period: A Case Report With Molecular Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Colostomy was performed, and rectal biopsy confirmed Hirschsprung disease.
    explanation: >-
      Colostomy as the initial surgical management in a GOSHS neonate.
- name: Multidisciplinary supportive care and genetic counseling
  description: >-
    There is no treatment for the underlying defect. Care addresses
    development, seizures, neuropathy and associated malformations, with
    genetic counseling for the 25% recurrence risk of an autosomal recessive
    disorder.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:42238158
    reference_title: "Goldberg-Shprintzen Megacolon Syndrome Diagnosed in the Neonatal Period: A Case Report With Molecular Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early molecular diagnosis may facilitate timely multidisciplinary
      management and genetic counseling.
    explanation: >-
      Recommends multidisciplinary management and counseling; this is an
      author recommendation, not an outcome measurement.
animal_models:
- name: Kif1bp knockout mouse
  species: Mouse
  genotype: Kif1bp-/-
  publication: PMID:29192291
  description: >-
    Constitutive knockout. Mice die shortly after birth with smaller brains,
    olfactory bulbs and anterior commissures, absent vagal and sympathetic gut
    innervation, and delayed enteric neural crest colonization, but with
    neurons along the whole bowel at birth.
  modeled_mechanisms:
  - target: Delayed Enteric Neural Crest Colonization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The colonization delay is not followed by distal aganglionosis, so the
      model does not reproduce Hirschsprung disease itself; perinatal death
      precludes postnatal study.
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although newborn Kif1bp -/- mice had neurons along the entire bowel,
        the colonization of the gut by neural crest-derived cells was delayed.
      explanation: >-
        The delay is reproduced; the complete aganglionosis is not.
  - target: Impaired Axon Outgrowth and Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The data show an essential in vivo role for KIF1BP in axon extension
        from some neurons, and the reduced size of the olfactory bulb also
        suggests additional roles for KIF1BP.
      explanation: >-
        Axon extension defects in vivo in a mammal.
  - target: Hirschsprung disease
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Newborn knockouts have enteric neurons along the entire bowel, so the
      defining distal aganglionosis of the human phenotype is absent.
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Although newborn Kif1bp -/- mice had neurons along the entire bowel,
        the colonization of the gut by neural crest-derived cells was delayed.
      explanation: >-
        The negative result: no aganglionic segment in the knockout.
  evidence:
  - reference: PMID:29192291
    reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Our mouse model provides a valuable resource to understand GOSHS.
    explanation: >-
      The authors present the knockout as a GOSHS model.
- name: Kifbp in utero cortical knockdown mouse
  species: Mouse
  genotype: Kifbp shRNA delivered by in utero electroporation at E14
  publication: PMID:31736709
  description: >-
    Focal knockdown in embryonic cortical progenitors, used to follow
    migration, morphology and survival of the transfected neurons.
  modeled_mechanisms:
  - target: Defective Cortical Neuronal Migration and Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Partial, focal knockdown in a lissencephalic species, not constitutional
      biallelic loss; cannot reproduce a gyral malformation.
    evidence:
    - reference: PMID:31736709
      reference_title: "Multiple Functions of KBP in Neural Development Underlie Brain Anomalies in Goldberg-Shprintzen Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, at postnatal day (P) 6, about one third of the cells, which
        have become mature neurons, remained ectopically in the white matter
        (WM), while cells that have reached Layer II/III of the cortex showed
        impaired dendritic outgrowth and axonal projection.
      explanation: >-
        The migration and maturation readouts of this model.
- name: Zebrafish kbp st23 mutant
  species: Zebrafish
  genotype: kbp(st23) homozygous
  publication: PMID:18192286
  description: >-
    Loss-of-function mutant with slowed axon outgrowth, disrupted axonal
    microtubules and later axon degeneration in the peripheral, central and
    enteric nervous systems.
  modeled_mechanisms:
  - target: Neuronal Microtubule Cytoskeleton Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Non-mammalian nervous system; the whole clinical syndrome (microcephaly,
      gyral malformation) is not modeled.
    evidence:
    - reference: PMID:18192286
      reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ultrastructural studies reveal that kbp mutants have disruption to
        axonal microtubules during outgrowth.
      explanation: >-
        The cytoskeletal readout in the model.
  - target: Impaired Axon Outgrowth and Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:18192286
      reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In vivo time-lapse analysis of neuronal development shows that the
        speed of early axonal outgrowth is reduced in both the peripheral and
        central nervous systems in kbp mutants.
      explanation: >-
        Live imaging of the outgrowth defect.
experimental_models:
- name: KIFBP knockout Neuro-2a cells
  experimental_model_type: CELL_LINE
  description: >-
    CRISPR-Cas9 KIFBP knockout in the mouse neuroblastoma Neuro-2a line, used
    to show the neurite-extension requirement and to define the KIFBP kinesin
    interactome during differentiation (identifying KIF5A and KIF18B as
    further targets).
  publication: PMID:42538967
  modeled_mechanisms:
  - target: Impaired Axon Outgrowth and Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      A mouse tumor-derived cell line measuring neurites in culture, not axons
      in tissue.
    evidence:
    - reference: PMID:42538967
      reference_title: "A systems-level proteomic analysis identifies kinesin targets of KIFBP during neuronal development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using a CRISPR-Cas9 generated KIFBP knockout Neuro-2a cell line, we
        show that KIFBP is required for neurite extension.
      explanation: >-
        The outgrowth readout of the knockout line.
- name: GOSHS patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from patients with homozygous truncating KIAA1279 variants,
    showing mRNA decay and loss of KBP with normal respiratory chain activity.
  publication: PMID:23427148
  modeled_mechanisms:
  - target: KIFBP Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    evidence:
    - reference: PMID:23427148
      reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Despite the absence of functional KBP, respiratory chain complex

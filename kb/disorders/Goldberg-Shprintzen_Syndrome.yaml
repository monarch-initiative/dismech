    ZEB2-related syndrome combining Hirschsprung disease, microcephaly,
    intellectual disability and a distinctive face, delineated in 1998 as
    separate from GOSHS. Its patients were isolated cases, whereas GOSHS
    recurs in sibs and in consanguineous families. Curated in this knowledge
    base as Mowat-Wilson_syndrome.

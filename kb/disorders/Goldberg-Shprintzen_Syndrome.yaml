- name: Cytokinesis Failure in Dividing Cells
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    KIFBP interacts with citron kinase (encoded by the MCPH17 microcephaly gene), is enriched at the midbody
    ring and is required for cytokinesis in cultured dividing cells. Reduced neural progenitor output from
    cytokinesis failure is a proposed, untested route to microcephaly.
  biological_processes:
  - preferred_term: cytokinesis
    modifier: DECREASED
    term:
      id: GO:0000910
      label: cytokinesis
  evidence:
  - reference: PMID:34100550
    reference_title: "Goldberg-Shprintzen syndrome protein KIF1BP is a CITK interactor implicated in cytokinesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similar to CITK, KIF1BP is enriched at the midbody ring and is required for cytokinesis."
    explanation: KIF1BP depletion impairs cytokinesis in cultured cells.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors' proposed clinical link; not demonstrated in neural progenitors in vivo or in patients.
    evidence:
    - reference: PMID:34100550
      reference_title: "Goldberg-Shprintzen syndrome protein KIF1BP is a CITK interactor implicated in cytokinesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "These data indicate that KIF1BP is a CITK interactor involved in midbody maturation and abscission, and suggest that cytokinesis failure may contribute to the microcephaly phenotype observed in GOSHS."
      explanation: Proposes cytokinesis failure as a contributor to microcephaly.

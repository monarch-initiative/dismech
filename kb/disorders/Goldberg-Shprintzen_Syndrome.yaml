- name: Delayed Enteric Neural Crest Colonization of the Gut
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In Kif1bp knockout mouse embryos the wavefront of migrating enteric neural crest-derived cells lags behind
    controls, although newborn mice have neurons along the whole bowel. Failure to reach the human distal colon,
    producing aganglionosis, is an inferred species-sensitive step; neither mouse nor zebrafish models develop a
    Hirschsprung-like phenotype.

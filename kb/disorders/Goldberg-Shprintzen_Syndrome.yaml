name: Goldberg-Shprintzen Syndrome
creation_date: "2026-10-09T20:30:00Z"
description: >-
  Goldberg-Shprintzen syndrome (GOSHS) is an ultra-rare autosomal recessive
  multiple congenital anomaly syndrome caused by biallelic loss-of-function
  variants in KIFBP (formerly KIAA1279, also called KBP or KIF1BP), which
  encodes kinesin-binding protein, an inhibitor that binds the motor domains of
  a subset of kinesins and blocks their attachment to microtubules. The
  syndrome combines microcephaly, intellectual disability and developmental
  delay, a recognizable facial gestalt with ptosis and hypertelorism, and
  malformations of both the central and the enteric nervous system: cortical
  gyral malformation (polymicrogyria or pachygyria), thin corpus callosum,
  axonal sensorimotor neuropathy and, in about two thirds of reported patients,
  Hirschsprung disease. Hirschsprung disease is not required for the diagnosis
  and can differ between siblings carrying the same variant. Model work places
  the lesion in neuronal microtubule regulation (axon outgrowth, cortical
  neuronal migration, enteric neural crest colonization), with a proposed
  contribution from defective cytokinesis to the microcephaly. The name is
  easily confused with Shprintzen-Goldberg syndrome, an unrelated SKI-related
  craniosynostosis and connective-tissue disorder.
category: Mendelian
disease_term:
  preferred_term: Goldberg-Shprintzen syndrome
  term:
    id: MONDO:0012280
    label: Goldberg-Shprintzen syndrome
synonyms:
- Goldberg-Shprintzen megacolon syndrome
- GOSHS
parents:
- syndromic Hirschsprung disease
- malformation of cortical development
notes: >-
  No disease-specific GeneReviews chapter exists: a PubMed search for
  "Goldberg-Shprintzen AND genereviews[book]" returned no records (October
  2026). The KIFBP-GOSHS pair has no ClinGen gene-disease validity record in
  the pinned ClinGen snapshot (data/clingen, 2026-10-04), so no
  gene_disease_validity assertion is recorded. Several pre-2005 clinical
  reports describe GOSHS before the gene was known, and some of those patients
  may have had other disorders, notably Mowat-Wilson syndrome; phenotype
  evidence below prefers molecularly confirmed patients and says so where it
  does not.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic KIFBP variants, homozygous in the
    consanguineous families that defined the gene and compound heterozygous in
    at least one more recent neonate. Sib recurrence was the basis for the
    recessive model before the gene was mapped.
  evidence:
  - reference: PMID:15883926
    reference_title: "Homozygous nonsense mutations in KIAA1279 are associated with malformations of the central and enteric nervous systems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified, by homozygosity mapping, a novel locus on 10q21.3-q22.1
      for Goldberg-Shprintzen syndrome (GOSHS) in a consanguineous Moroccan
      family.
    explanation: >-
      Homozygosity mapping in a consanguineous family is the genetic basis for
      recessive inheritance.
  - reference: PMID:42238158
    reference_title: "Goldberg-Shprintzen Megacolon Syndrome Diagnosed in the Neonatal Period: A Case Report With Molecular Confirmation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted molecular analysis of the Kinesin Family Binding Protein (KIFBP)
      gene using polymerase chain reaction (PCR) amplification followed by
      Sanger sequencing identified compound heterozygous pathogenic variants,
      confirming the diagnosis during the neonatal period.
    explanation: >-
      Compound heterozygosity in a molecularly confirmed patient shows the
      biallelic requirement holds outside consanguineous homozygous families.
  - reference: PMID:1785632
    reference_title: "Goldberg-Shprintzen syndrome: Hirschsprung disease, hypotonia, and ptosis in sibs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the clinical characteristics in 8 reported cases with
      similar clinical manifestations represent a distinct autosomal recessive
      syndrome, Goldberg-Shprintzen syndrome.
    explanation: >-
      The pre-molecular sib-pair evidence on which the recessive model was
      first proposed; a clinical inference that the later mapping confirmed.
prevalence:
- population: Published GOSHS literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Thirty-four molecularly reported patients with 16 different biallelic KIFBP
    variants had been described by 2021. Further single cases and a
    four-sibling family have been reported since. No population prevalence or
    incidence estimate exists.
  evidence:
  - reference: PMID:34421502
    reference_title: "Goldberg-Shprintzen Syndrome Associated with a Novel Variant in the KIFBP Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, 16 different biallelic KIFBP mutations have been identified in
      34 patients with GOSHS.
    explanation: >-
      States the cumulative reported case and variant counts.
pathophysiology:
- name: KIFBP Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic nonsense, frameshift and intragenic deletion alleles abolish
    KIFBP through nonsense-mediated mRNA decay, leaving no detectable protein.
    The few reported missense alleles reduce, rather than abolish, protein
    expression, which led the authors to propose a threshold of KIFBP
    expression below which the syndrome appears.
  genes:
  - preferred_term: KIFBP
    term:
      id: hgnc:23419
      label: KIFBP
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline KIFBP variants, mostly truncating; missense alleles
      are rare and reduce expression.
  molecular_functions:
  - preferred_term: kinesin binding
    modifier: DECREASED
    term:
      id: GO:0019894
      label: kinesin binding
  evidence:
  - reference: PMID:23427148
    reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The homozygous KIAA1279 mutations in these patients (p.Arg90X, p.Ser200X
      or p.Arg202IlefsX2) led to nonsense-mediated mRNA decay and loss of KBP
      function.
    explanation: >-
      Measured in patient-derived cells: the truncating alleles remove the
      transcript and with it the protein.
  - reference: PMID:32939943
    reference_title: "Goldberg-Shprintzen syndrome is determined by the absence, or reduced expression levels, of KIFBP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results showed that the missense variants led to reduced expression
      of KIFBP, while the truncating variants resulted in lack of protein.
    explanation: >-
      Expression experiments distinguish absent protein (truncating alleles)
      from reduced protein (missense alleles), the basis for the threshold
      model in this node's description.
  downstream:
  - target: Unrestrained Kinesin Motor Activity
    causal_link_type: DIRECT
    description: >-
      KIFBP normally binds the motor heads of a subset of kinesins and keeps
      them off microtubules; without it those motors are released from that
      inhibition.
    evidence:
    - reference: PMID:26948876
      reference_title: "Kinesin-Binding Protein Controls Microtubule Dynamics and Cargo Trafficking by Regulating Kinesin Motor Activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we show that KBP regulates kinesin activity by interacting with
        the motor domains of a specific subset of kinesins to prevent their
        association with the MT cytoskeleton.
      explanation: >-
        Defines the inhibitory function whose loss this edge describes.
  - target: Impaired Midbody Maturation and Cytokinesis
    causal_link_type: DIRECT
    description: >-
      KIFBP interacts with citron kinase at the midbody ring and is required
      for cytokinesis in cultured cells.
    evidence:
    - reference: PMID:34100550
      reference_title: "Goldberg-Shprintzen syndrome protein KIF1BP is a CITK interactor implicated in cytokinesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Similar to CITK, KIF1BP is enriched at the midbody ring and is required
        for cytokinesis.
      explanation: >-
        Knockdown in cultured cells shows the cytokinesis requirement directly.
  - target: Delayed Enteric Neural Crest Colonization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Constitutive loss of Kif1bp in mice slows colonization of the gut by
      neural crest-derived cells. The cellular step in between (axon or
      process extension, Ret-dependent signalling, or migration itself) has
      not been identified.
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Although newborn Kif1bp -/- mice had neurons along the entire bowel,
        the colonization of the gut by neural crest-derived cells was delayed.
      explanation: >-
        In the knockout, gene loss alone delays enteric colonization. The
        result is from mouse, so its application to the human gene is one step
        removed.
- name: Unrestrained Kinesin Motor Activity
  biological_scale: MOLECULAR
  description: >-
    KIFBP binds and inhibits the motor domains of 8 of the 45 kinesins,
    including the cargo transporter KIF1A and the microtubule-depolymerizing
    KIF18A, by remodeling the motor head and sterically blocking its
    microtubule-binding surface. In KIFBP-depleted neurons KIF1A and its
    synaptic-vesicle cargo accumulate in the axonal growth cone. Which of the
    released motors produces which patient feature is not established.
  molecular_functions:
  - preferred_term: microtubule motor activity of KIFBP-target kinesins
    modifier: INCREASED
    term:
      id: GO:0003777
      label: microtubule motor activity
  evidence:
  - reference: PMID:34797717
    reference_title: "Kinesin-binding protein remodels the kinesin motor to prevent microtubule binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that KIFBP remodels kinesin motors and blocks microtubule binding
      (i) via allosteric changes to kinesin and (ii) by sterically blocking
      access to the microtubule.
    explanation: >-
      Structural mechanism of the inhibition that is lost in the disease.
  - reference: PMID:26948876
    reference_title: "Kinesin-Binding Protein Controls Microtubule Dynamics and Cargo Trafficking by Regulating Kinesin Motor Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, depletion of KBP results in the accumulation of KIF1A
      motors and synaptic vesicles in the axonal growth cone.
    explanation: >-
      The direct cellular readout of losing the inhibition: motor and cargo
      mislocalize in neurons.
  downstream:
  - target: Neuronal Microtubule Cytoskeleton Disruption
    causal_link_type: DIRECT
    description: >-
      Released KIF18A alters microtubule dynamics, and transport motors
      redistribute microtubule regulators such as SCG10, so neuronal
      microtubule organization is disturbed.
    evidence:
    - reference: PMID:26948876
      reference_title: "Kinesin-Binding Protein Controls Microtubule Dynamics and Cargo Trafficking by Regulating Kinesin Motor Activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also show that KBP regulates neuronal MT dynamics by controlling
        KIF18A activity.
      explanation: >-
        Links the kinesin-regulation defect to neuronal microtubule dynamics.
- name: Neuronal Microtubule Cytoskeleton Disruption
  biological_scale: CELLULAR
  description: >-
    Axonal microtubules are disorganized during outgrowth in kbp-mutant
    zebrafish, and growth cones of mutant axons carry too little of the
    microtubule regulator SCG10, altering microtubule stability. KIFBP
    associates with both the actin and tubulin cytoskeleton in human
    fibroblasts and does not colocalize with mitochondria, which argues
    against the earlier mitochondrial model of the disease.
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:18192286
    reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ultrastructural studies reveal that kbp mutants have disruption to axonal
      microtubules during outgrowth.
    explanation: >-
      Direct ultrastructural observation of the cytoskeletal defect in a
      loss-of-function vertebrate model.
  - reference: PMID:27358458
    reference_title: "Kif1B Interacts with KBP to Promote Axon Elongation by Localizing a Microtubule Regulator to Growth Cones."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Live imaging revealed that the reduced levels of SCG10 in kbp(st23)
      mutant growth cones led to altered microtubule stability, defining the
      mechanistic basis of axon truncation.
    explanation: >-
      Identifies a specific transported regulator through which microtubule
      stability is altered.
  - reference: PMID:23427148
    reference_title: "KBP-cytoskeleton interactions underlie developmental anomalies in Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KBP did not co-localize with mitochondria in control human fibroblasts,
      but interacted with the actin and tubulin cytoskeleton.
    explanation: >-
      Places the protein on the cytoskeleton rather than mitochondria in human
      cells.
  downstream:
  - target: Impaired Axon Outgrowth and Maintenance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18192286
      reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results together suggest that kbp is an important regulator of
        the microtubule dynamics that drive the forward propulsion of axons.
      explanation: >-
        The authors draw the link from microtubule dynamics to axon advance.
  - target: Defective Cortical Neuronal Migration and Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuronal migration depends on the microtubule cytoskeleton, and Kifbp
      knockdown in embryonic cortex disrupts migration, but the kinesin or
      cytoskeletal step responsible in migrating cortical neurons has not been
      shown.
    evidence:
    - reference: PMID:20621975
      reference_title: "KBP interacts with SCG10, linking Goldberg-Shprintzen syndrome to microtubule dynamics and neuronal differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Thus, our data indicate that KBP is involved in neuronal
        differentiation and that the central and enteric nervous system defects
        seen in GOSHS are likely caused by microtubule-related defects.
      explanation: >-
        The authors attribute the central nervous system defects to
        microtubule-related defects; it is a proposal from cell and zebrafish
        work rather than a demonstration in cortex, which is why the edge is
        indirect.
- name: Impaired Axon Outgrowth and Maintenance
  biological_scale: CELLULAR
  description: >-
    Axons extend slowly and later degenerate in kbp-mutant zebrafish, in the
    peripheral, central and enteric nervous systems. Kif1bp-null mice lack
    vagal and sympathetic innervation of the gut and have smaller anterior
    commissures, and KIFBP knockout Neuro-2a cells fail to extend neurites.
  biological_processes:
  - preferred_term: axon extension
    modifier: DECREASED
    term:
      id: GO:0048675
      label: axon extension
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:18192286
    reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ultrastructural analyses at these stages demonstrate mislocalization of
      axonal mitochondria and a reduction in axonal number in the peripheral,
      central and enteric nervous systems.
    explanation: >-
      Axon loss across all three nervous systems affected in patients.
  - reference: PMID:29192291
    reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The data show an essential in vivo role for KIF1BP in axon extension
      from some neurons, and the reduced size of the olfactory bulb also
      suggests additional roles for KIF1BP.
    explanation: >-
      The mammalian knockout confirms the axon-extension requirement in vivo.
  - reference: PMID:42538967
    reference_title: "A systems-level proteomic analysis identifies kinesin targets of KIFBP during neuronal development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a CRISPR-Cas9 generated KIFBP knockout Neuro-2a cell line, we show
      that KIFBP is required for neurite extension.
    explanation: >-
      A full knockout cell line reproduces the outgrowth defect.
  downstream:
  - target: Axonal sensorimotor neuropathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of peripheral axon extension and later axon degeneration
    description: >-
      The authors who documented the neuropathy attribute it to reduced KIFBP
      in peripheral neurons; the zebrafish axon degeneration is the model
      counterpart.
    evidence:
    - reference: PMID:25846562
      reference_title: "Goldberg-Shprintzen megacolon syndrome with associated sensory motor axonal neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We hypothesize that an axonal sensory motor neuropathy may be part of
        the phenotypical spectrum of KIAA1279-related GOSHS, probably reflecting
        the effects of reduced KBP protein expression on peripheral neuronal
        function.
      explanation: >-
        Clinical authors state the proposed link; worded as a hypothesis in the
        source.
  - target: Hypoplasia of the corpus callosum
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Commissural axon tracts are reduced in the knockout mouse (anterior
      commissure). The human thin corpus callosum is assumed to share the
      axon-extension mechanism, but this has not been shown for the corpus
      callosum itself.
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Mice lacking Kif1bp died shortly after birth, and exhibited smaller
        brains, olfactory bulbs and anterior commissures, and defects in the
        vagal and sympathetic innervation of the gut.
      explanation: >-
        A different commissure, in a different species; the inference to the
        human corpus callosum is one step removed.
- name: Delayed Enteric Neural Crest Colonization
  biological_scale: TISSUE
  description: >-
    In Kif1bp-null mice neural crest-derived enteric precursors colonize the
    gut more slowly than normal. The newborn knockout bowel nonetheless has
    neurons along its whole length, so the mouse does not reproduce the distal
    aganglionosis seen in patients.

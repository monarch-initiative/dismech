- name: Pull-through surgery for Hirschsprung disease
  description: >-
    Resection of the aganglionic segment with a pull-through procedure after histological confirmation, as for
    Hirschsprung disease generally. Bowel dysfunction and enterocolitis can persist after surgery; no
    GOSHS-specific outcome data exist.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: pull-through surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Hirschsprung disease
    term:
      id: HP:0002251
      label: Aganglionic megacolon
  evidence:
  - reference: PMID:32586397
    reference_title: "ERNICA guidelines for the management of rectosigmoid Hirschsprung's disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The diagnosis of HSCR should be based on representative rectal histology, and should be confirmed before pull-through surgery."
    explanation: Consensus guidance placing pull-through surgery after histological confirmation in Hirschsprung disease generally.
  - reference: PMID:32586397
    reference_title: "ERNICA guidelines for the management of rectosigmoid Hirschsprung's disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Despite an optimal pull-through, impairment of bowel function and enterocolitis are common during the first few years after surgery"
    explanation: Post-surgical bowel dysfunction and enterocolitis remain common in Hirschsprung disease generally.
animal_models:
- name: Kif1bp knockout mouse
  species: Mouse
  genotype: Kif1bp-/- (CRISPR/Cas9, two independent lines)
  publication: PMID:29192291
  description: >-
    Constitutive knockout mice die within hours of birth and have smaller brains, olfactory bulbs and anterior
    commissures, defective vagal and sympathetic gut innervation, and delayed enteric neural crest colonization,
    but neurons occupy the entire bowel at birth.
  modeled_mechanisms:
  - target: Delayed Enteric Neural Crest Colonization of the Gut
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Colonization is delayed but complete by birth, so the model does not reproduce distal aganglionosis; perinatal
      death prevents study of later outcomes.
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although newborn Kif1bp -/- mice had neurons along the entire bowel, the colonization of the gut by neural crest-derived cells was delayed."
      explanation: The knockout directly shows the colonization delay.
  - target: Impaired Axon Outgrowth with Axonal Microtubule Disruption
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Axon extension defects affect only some neuronal populations; axonal microtubules were not examined in this
      model.
    evidence:
    - reference: PMID:29192291
      reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The data show an essential in vivo role for KIF1BP in axon extension from some neurons"
      explanation: In vivo axon extension defect in the knockout.
  evidence:
  - reference: PMID:29192291
    reference_title: "Kif1bp loss in mice leads to defects in the peripheral and central nervous system and perinatal death."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice lacking Kif1bp died shortly after birth, and exhibited smaller brains, olfactory bulbs and anterior commissures, and defects in the vagal and sympathetic innervation of the gut."
    explanation: Overall phenotype of the knockout model.
- name: kbp mutant zebrafish
  species: Zebrafish
  genotype: kbp (kif1bp) loss-of-function mutant
  publication: PMID:18192286
  description: >-
    Mutants show slowed early axon outgrowth with axonal microtubule disruption, followed by axon degeneration in
    peripheral, central and enteric nervous systems; neurons are present along the whole bowel.
  modeled_mechanisms:
  - target: Impaired Axon Outgrowth with Axonal Microtubule Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Zebrafish axonal biology is not directly equivalent to human cortical and peripheral nerve development.
    evidence:
    - reference: PMID:18192286
      reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ultrastructural studies reveal that kbp mutants have disruption to axonal microtubules during outgrowth."
      explanation: Axonal microtubule disruption in the mutant.
  - target: Axon Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Degeneration was observed in larvae; whether a comparable process occurs in patients is unknown.
    evidence:
    - reference: PMID:18192286
      reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At later stages, we observe that many affected axons degenerate."
      explanation: Axon degeneration in the mutant.
  evidence:
  - reference: PMID:18192286
    reference_title: "KBP is essential for axonal structure, outgrowth and maintenance in zebrafish, providing insight into the cellular basis of Goldberg-Shprintzen syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that kbp is required for axonal outgrowth and maintenance."
    explanation: Summary finding of the zebrafish model.
- name: Kbp in utero knockdown mouse cortex
  species: Mouse
  genotype: Kbp shRNA electroporated in utero at E14
  publication: PMID:31736709
  description: >-
    Focal knockdown in embryonic cortical progenitors impairs neuronal migration, dendritic outgrowth, callosal
    axon projection and survival, with rescue by shRNA-resistant Kbp.
  modeled_mechanisms:
  - target: Impaired Cortical Neuron Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Partial, spatially restricted knockdown is not equivalent to a lifelong biallelic germline loss, and the
      model does not produce polymicrogyria.
    evidence:
    - reference: PMID:31736709
      reference_title: "Multiple Functions of KBP in Neural Development Underlie Brain Anomalies in Goldberg-Shprintzen Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, at postnatal day (P) 6, about one third of the cells, which have become mature neurons, remained ectopically in the white matter (WM), while cells that have reached Layer II/III of the cortex showed impaired dendritic outgrowth and axonal projection."
      explanation: Migration arrest after knockdown.
  - target: Cortical Neuron Apoptosis
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: >-
      Apoptosis has not been assessed in patient brain tissue, so fidelity to the human disease is unknown.
    evidence:
    - reference: PMID:31736709
      reference_title: "Multiple Functions of KBP in Neural Development Underlie Brain Anomalies in Goldberg-Shprintzen Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also found that KBP knockdown induces apoptosis during the postnatal period."
      explanation: Increased apoptosis after knockdown.
  evidence:
  - reference: PMID:31736709
    reference_title: "Multiple Functions of KBP in Neural Development Underlie Brain Anomalies in Goldberg-Shprintzen Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings indicate that loss of KBP function leads to defects in neuronal migration, morphogenesis, maturation, and survival, which may be responsible for brain phenotypes observed in GOSHS."
    explanation: Summary finding of the knockdown model.

name: Congenital Disorder of Glycosylation, Type IIw
creation_date: "2026-09-03T14:50:00Z"
category: Mendelian
synonyms:
- CDG2W
- SLC37A4-CDG
- congenital disorder of glycosylation, type IIw
- heterozygous SLC37A4 deficiency
description: >
  Congenital disorder of glycosylation type IIw (SLC37A4-CDG) is the dominant disease of
  the glucose-6-phosphate transporter, and it is worth stating plainly why that is not a
  contradiction in terms. Biallelic loss of function in SLC37A4 causes glycogen storage
  disease Ib, a recessive disorder of glucose release. CDG-IIw is caused by a single
  recurrent de novo allele, c.1267C>T (p.Arg423*), which truncates the last seven residues
  of G6PT1 and with them the C-terminal ER retrieval motif. The truncated transporter
  leaves the endoplasmic reticulum, and its escape - not its loss - is the lesion.

  The disease is therefore not a milder or a dominant-negative form of glycogen storage
  disease Ib. The intact allele supplies enough transporter for normal glucose-6-phosphate
  handling, so patients have no fasting hypoglycaemia, no lactic acidosis and no
  neutropenia. What they have instead is a type II serum transferrin pattern, profound
  accumulation of high-mannose and hybrid N-glycans, and a coagulopathy that comes from
  the liver. Two features make the point that this is a trafficking disease rather than a
  transport-deficiency disease: the glycosylation defect is confined to secreted
  liver-derived glycoproteins, being absent from fibroblasts and undifferentiated iPSC,
  and the Golgi changes track allele dosage.

  Where the mutant transporter actually ends up is unsettled, and the entry models the two
  candidate destinations as competing hypotheses rather than picking one. The original
  report proposed that removing the ER retrieval signal exposes a weak Golgi retention
  signal that captures the protein in the Golgi. A subsequent seven-patient study using a
  base-edited hepatoma line placed a portion of the mutant protein in a distinct non-Golgi
  compartment, possibly ER exit sites. Both accounts agree on the downstream consequence -
  a lowered intraluminal Golgi pH and disturbed N-glycan processing - and it is that
  consequence, not the destination, that the clinical phenotype hangs on.

  The coagulopathy is the clinically dominant feature and is not a simple bleeding
  diathesis: procoagulant factors II and XI fall alongside antithrombin, so the balance is
  partly preserved, and reported patients have come through cardiac and cleft surgery. The
  entry records that as a treatment consideration rather than as reassurance, because it
  rests on a handful of cases.

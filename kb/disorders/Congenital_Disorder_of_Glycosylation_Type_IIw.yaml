experimental_models:
- name: CRISPR base-edited HepG2 line carrying SLC37A4 c.1267C>T
  experimental_model_type: CELL_LINE
  description: >
    A hepatoma cell line base-edited to carry the patient allele, built because the disorder
    is liver-specific and patient fibroblasts do not show the glycan defect. It reproduces
    the secreted glycosylation abnormality seen in patient serum, and is the system in which
    the Golgi pH, Golgi morphology and mutant-protein localization claims were made.
  modeled_mechanisms:
  - target: Reduced Intraluminal Golgi pH and Altered Golgi Morphology
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the secreted N-glycosylation abnormality and shows allele-dosage-dependent
      Golgi morphology change and reduced intraluminal pH.
    limitations: >-
      A hepatoma line is not a hepatocyte, and the localization finding in this system
      (a non-Golgi compartment) is the one that conflicts with the original patient-derived
      Golgi retention model, so the system's fidelity for the localization question
      specifically is unestablished.
    evidence:
    - reference: PMID:33964207
      reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Due to the liver-specific nature of this disorder, we generated a CRISPR base-edited hepatoma cell line harboring the c.1267C>T (p.Arg423∗) variant."
      explanation: >-
        Documents the model and the reason it was built, supporting its use for this node.

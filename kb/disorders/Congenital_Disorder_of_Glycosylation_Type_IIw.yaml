- name: Serum bikunin proteoglycan heavy-form deficiency
  notes: >
    The esterified heavy forms of the bikunin proteoglycan, inter-alpha-trypsin inhibitor
    and pro-alpha-trypsin inhibitor, are severely reduced. Bikunin heavy-form biosynthesis
    is known to be sensitive to Golgi pH, so this is a patient-derived readout of the Golgi
    pH defect rather than a separate abnormality. The reported ITI to PalphaI ratio also
    distinguishes an excessive fall in Golgi pH from an excessive rise.

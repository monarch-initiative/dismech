discussions:
- discussion_id: g6pt1_mutant_localization
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where does the truncated G6PT1 transporter actually localize, and does the answer change
    what would be therapeutically targetable?
  attaches_to:
  - pathophysiology#Mislocalization of G6PT1 out of the Endoplasmic Reticulum
  rationale: >
    The two primary reports disagree. The original description proposed Golgi capture via a
    newly exposed Golgi retention signal; the seven-patient study using a base-edited
    hepatoma line placed a portion of the mutant protein in a distinct non-Golgi compartment,
    possibly ER exit sites. Both accounts are consistent with the downstream Golgi pH and
    morphology change, so the clinical phenotype does not discriminate between them, and no
    study has yet compared the two localizations in the same system. The gap matters because
    a Golgi-retained transporter and one stalled at an ER exit site are different targets.
- discussion_id: single_case_extraphenotypes
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are type 1 diabetes and membranoproliferative glomerulonephritis part of SLC37A4-CDG or
    coincident diagnoses in one patient?
  attaches_to:
  - phenotypes#Type I diabetes mellitus
  - phenotypes#Membranoproliferative glomerulonephritis
  rationale: >
    Both were reported in a single patient as an expansion of the clinical picture. With
    roughly nine reported individuals in total, one occurrence cannot be separated from
    coincidence, and no mechanism has been proposed linking either to the Golgi glycosylation
    defect. They are curated because the report attributes them to the disorder, but the
    attribution is a single case.

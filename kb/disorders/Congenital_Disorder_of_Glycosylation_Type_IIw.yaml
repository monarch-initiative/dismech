inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    All reported affected individuals are heterozygous for the same de novo SLC37A4 allele,
    c.1267C>T (p.Arg423*). The disease is dominant because the truncated transporter acts
    where it should not be rather than because the remaining wild-type allele is
    insufficient, which is why it segregates as a dominant trait while biallelic loss of the
    same gene segregates as a recessive one.
  evidence:
  - reference: PMID:32884905
    reference_title: "SLC37A4-CDG: Mislocalization of the glucose-6-phosphate transporter to the Golgi causes a new congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function of the glucose-6-phosphate transporter is caused by biallelic mutations in SLC37A4 and leads to glycogen storage disease Ib. Here we describe a second disease caused by a single dominant mutation in the same gene."
    explanation: >-
      States the dominant inheritance of this disorder and contrasts it explicitly with the
      recessive disease caused by biallelic loss of the same gene.
  - reference: PMID:33964207
    reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we identify a recurrent mutation in SLC37A4 that causes a dominantly inherited congenital disorder of glycosylation characterized by coagulopathy and liver dysfunction with abnormal serum N-glycans."
    explanation: >-
      Independently confirms dominant inheritance across four unrelated families carrying
      the same recurrent allele.
genetic:
- name: SLC37A4
  gene_term:
    preferred_term: SLC37A4
    term:
      id: hgnc:4061
      label: SLC37A4
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  features: >
    Every reported patient carries the same heterozygous de novo nonsense allele,
    c.1267C>T (p.Arg423*), which removes the final seven amino acids of the widely expressed
    G6PT1 isoform and with them the C-terminal KKXX-type ER retrieval motif. The allele is
    recurrent rather than familial, and the phenotype is caused by mislocalization of the
    truncated protein rather than by reduced transporter activity: the wild-type allele
    remains sufficient for glucose-6-phosphate transport.
  variants:
  - name: c.1267C>T (p.Arg423*)
    description: >-
      Recurrent de novo nonsense allele truncating the final seven residues of the widely
      expressed G6PT1 isoform, removing the C-terminal ER retrieval motif.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:33964207
    reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report seven individuals who presented with liver dysfunction multifactorial coagulation deficiency and cardiac issues and were heterozygous for the same variant, c.1267C>T (p.Arg423∗), in SLC37A4; the affected individuals were from four unrelated families."
    explanation: >-
      Establishes the recurrent heterozygous SLC37A4 allele as the cause across four
      unrelated families.
  - reference: PMID:33728255
    reference_title: "SLC37A4-CDG: Second patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the second patient with a type II CDG caused by the same heterozygous de novo c.1267C>T (p.R423*) mutation thereby confirming the pathogenicity of this variant and expanding the clinical picture with type 1 diabetes, severe scoliosis, and membranoproliferative glomerulonephritis."
    explanation: >-
      Confirms pathogenicity of the recurrent de novo allele in an independently ascertained
      patient.
  - reference: PMID:34245688
    reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous SLC37A4 deficiency is a recently characterized congenital disorder of glycosylation (SLC37A4-CDG) with, to this day, nine described affected individuals sharing the c.1267C>T (p.R423X) variant"
    explanation: >-
      Records that the same allele accounts for the entire reported cohort, which is the
      basis for treating the variant as recurrent rather than private.
mechanistic_hypotheses:
- hypothesis_group_id: golgi_retention_model
  hypothesis_label: Golgi retention of the truncated transporter
  status: CANONICAL
  description: >
    On this model, truncating the ER retrieval motif exposes a weak Golgi retention signal
    already present in G6PT1, so the mutant transporter is captured in the Golgi and
    disturbs N-glycan processing there. This is the model under which the disease was first
    described, and it is the one the disorder's common name (mislocalization to the Golgi)
    encodes.
  evidence:
  - reference: PMID:32884905
    reference_title: "SLC37A4-CDG: Mislocalization of the glucose-6-phosphate transporter to the Golgi causes a new congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation abolishes the ER retention signal of the transporter and generates a weak Golgi retention signal. Intracellular mislocalization of the transporter leads to a congenital disorder of glycosylation instead of glycogen storage disease."
    explanation: >-
      States the Golgi retention signal claim that defines this hypothesis group.
  - reference: PMID:33728255
    reference_title: "SLC37A4-CDG: Second patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This causes mislocalization of the glucose-6-phosphate transporter to the Golgi leading to a congenital disorder of glycosylation type II (SLC37A4-CDG)."
    explanation: >-
      Adopts the Golgi destination as the operative mechanism in a second independent report.
- hypothesis_group_id: er_exit_site_model
  hypothesis_label: Relocation to a non-Golgi compartment (possible ER exit sites)
  status: EMERGING
  description: >
    On this model the mutant transporter does not simply accumulate in the Golgi: a portion
    of it reaches a distinct compartment that is not the Golgi, possibly ER exit sites. The
    claim comes from a CRISPR base-edited hepatoma line engineered to carry the patient
    allele, which reproduced the secreted glycosylation abnormality and so is a system in
    which the localization question can be asked. This does not displace the downstream
    Golgi pH and morphology changes, which the same study reports; it disputes only where
    the mutant protein sits.
  evidence:
  - reference: PMID:33964207
    reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These cells replicated the secreted abnormalities seen in serum N-glycosylation, and a portion of the mutant protein appears to relocate to a distinct, non-Golgi compartment, possibly ER exit sites."
    explanation: >-
      States the non-Golgi localization claim that distinguishes this hypothesis group from
      the Golgi retention model.
pathophysiology:
- name: Loss of the G6PT1 C-terminal ER Retrieval Motif
  biological_scale: MOLECULAR
  description: >
    The recurrent c.1267C>T (p.Arg423*) allele truncates the last seven residues of G6PT1,
    deleting the C-terminal ER retrieval signal that normally returns the transporter to the
    endoplasmic reticulum. This is the initiating lesion, and it is a loss of an address
    label rather than a loss of transport activity.
  genetic_context:
    gene:
      preferred_term: SLC37A4
      term:
        id: hgnc:4061
        label: SLC37A4
    allele_type: SNV
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous de novo nonsense allele removing the ER retrieval motif. The functional
      impact is scored against the retrieval motif, which is abolished; transporter catalytic
      function is not the affected property.
  biological_processes:
  - preferred_term: protein retention in ER lumen
    term:
      id: GO:0006621
      label: protein retention in ER lumen
    modifier: DECREASED
  downstream:
  - target: Mislocalization of G6PT1 out of the Endoplasmic Reticulum
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32884905
      reference_title: "SLC37A4-CDG: Mislocalization of the glucose-6-phosphate transporter to the Golgi causes a new congenital disorder of glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A de novo mutation removing the ER retrieval signal of one allele exposes a Golgi retention signal. G6PT1 derived from the mutant allele relocalizes to the Golgi where it disturbs the processing of protein N-glycans leading to liver disease and a coagulation disorder."
      explanation: >-
        States that removal of the retrieval signal is what causes the transporter to leave
        the ER, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:33728255
    reference_title: "SLC37A4-CDG: Second patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In SLC37A4‐CDG, recently reported in one patient, a heterozygous de novo variant (c.1267C>T; p.R423*) on one allele removes the final seven amino acids of the translated protein. This contains the ER retrieval signal and its removal exposes a Golgi retention signal."
    explanation: >-
      Identifies the deleted seven residues as the ER retrieval signal, the molecular content
      of this node.
  - reference: PMID:10940311
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deficiencies in glucose 6-phosphate (G6P) transporter (G6PT), a 10-helical endoplasmic reticulum transmembrane protein of 429 amino acids, cause glycogen storage disease type 1b."
    explanation: >-
      Establishes the transporter's topology, residue count and ER localization, which fixes what
      the p.Arg423* truncation removes.
- name: Mislocalization of G6PT1 out of the Endoplasmic Reticulum
  biological_scale: MOLECULAR
  description: >
    Freed of its retrieval signal, the truncated transporter moves into the secretory
    pathway. Its destination is disputed - the Golgi on the original model, a distinct
    non-Golgi compartment such as ER exit sites on the later one - and the two readings are
    carried as separate hypothesis groups. The edges out of this node are annotated to both
    groups because each account produces the same downstream Golgi disturbance.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  downstream:
  - target: Reduced Intraluminal Golgi pH and Altered Golgi Morphology
    causal_link_type: DIRECT
    hypothesis_groups:
    - golgi_retention_model
    - er_exit_site_model
    evidence:
    - reference: PMID:33964207
      reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These cells also show a gene dosage-dependent alteration in the Golgi morphology and reduced intraluminal pH that may account for the altered glycosylation."
      explanation: >-
        Reports the Golgi pH and morphology change as a dosage-dependent consequence of
        carrying the mutant allele, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:32884905
    reference_title: "SLC37A4-CDG: Mislocalization of the glucose-6-phosphate transporter to the Golgi causes a new congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In order to retain G6PT1 in the ER, it has a C-terminal ER retrieval signal (Fig. 1, general motif KKXX [4])."
    explanation: >-
      Identifies the motif whose loss allows the transporter to escape the ER compartment.
- name: Reduced Intraluminal Golgi pH and Altered Golgi Morphology
  biological_scale: CELLULAR
  description: >
    The mislocalized transporter lowers Golgi intraluminal pH and alters Golgi morphology in
    a manner that tracks allele dosage. The pH change is the mechanistic hinge: Golgi
    glycosyltransferases and glycosidases have narrow pH optima, so an acidification shift
    is sufficient to derange processing without any defect in the glycosylation enzymes
    themselves. Independent support comes from serum bikunin proteoglycan isoforms, whose
    esterified heavy forms are known to report Golgi pH and are severely reduced here.
  biological_processes:
  - preferred_term: Golgi lumen acidification
    term:
      id: GO:0061795
      label: Golgi lumen acidification
    modifier: INCREASED
  - preferred_term: Golgi organization
    term:
      id: GO:0007030
      label: Golgi organization
    modifier: DECREASED
  downstream:
  - target: Disturbed N-glycan Processing of Secreted Hepatic Glycoproteins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34245688
      reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recent studies took interest in the biochemical alterations found in this CDG and showed that they consisted of multiple glycosylation abnormalities, which result from mislocalization of the endoplasmic reticulum glucose-6-phosphate transporter and associated Golgi homeostasis defects."
      explanation: >-
        Attributes the glycosylation abnormalities to the Golgi homeostasis defect, which is
        the causal step this edge asserts.
  evidence:
  - reference: PMID:34245688
    reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC37A4-CDG was shown to be associated with an increased acidification of intraluminal Golgi pH"
    explanation: >-
      States the direction of the Golgi pH change recorded on this node.
  - reference: PMID:34245688
    reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blots of the heavy forms of Bkn (ITI and PαI) showed severely reduced levels compared to controls (Fig. 1C)."
    explanation: >-
      Bikunin heavy-form biosynthesis is pH-sensitive, so its severe reduction is an
      independent patient-derived readout of the Golgi pH defect.
- name: Disturbed N-glycan Processing of Secreted Hepatic Glycoproteins
  biological_scale: CELLULAR
  description: >
    Golgi processing of N-glycans fails, giving accumulation of high-mannose and hybrid
    structures on secreted glycoproteins together with hyposialylation and
    hypogalactosylation. The defect is tissue-restricted in a way that is diagnostically
    and mechanistically informative: serum glycoproteins are grossly abnormal while
    N-glycans in fibroblasts and undifferentiated iPSC are normal, which points at the liver
    as the site of disease and rules out a cell-autonomous defect of the glycosylation
    machinery.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  downstream:
  - target: Hepatic Coagulation Factor Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34245688
      reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SLC37A4-CDG is an emerging congenital disorder of glycosylation which is characterized by a dominant inheritance and a major coagulopathy originating from the liver."
      explanation: >-
        Locates the coagulopathy in the liver, which is the causal step this edge asserts
        between the hepatic glycosylation defect and the factor deficiency.
  - target: Hepatocellular Injury and Steatosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33964207
    reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum samples from affected individuals showed profound accumulation of both high mannose and hybrid type N-glycans, while N-glycans in fibroblasts and undifferentiated iPSC were normal."
    explanation: >-
      Establishes both the nature of the glycan defect and its restriction to secreted
      liver-derived glycoproteins.
  - reference: PMID:34245688
    reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals showed altered N- and mucin-type O-glycosylation profiles, elevated ASAT and decreased F2, F11 and antithrombin (AT) levels."
    explanation: >-
      Documents that both N- and O-glycosylation are affected in every reported patient.
- name: Hepatic Coagulation Factor Deficiency
  biological_scale: ORGANISM
  description: >
    Liver-derived coagulation proteins are deficient, giving a prolonged prothrombin time
    and activated partial thromboplastin time, hypofibrinogenaemia and severely reduced
    antithrombin activity. The deficiency is multifactorial and, importantly, is not
    one-sided: procoagulant factors II and XI fall alongside the anticoagulant antithrombin,
    so the haemostatic balance is partly preserved and reported patients have tolerated
    major surgery. That observation rests on a small number of cases and is curated as a
    treatment consideration, not as an established safety claim.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: DECREASED
  downstream:
  - target: Coagulopathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32884905
    reference_title: "SLC37A4-CDG: Mislocalization of the glucose-6-phosphate transporter to the Golgi causes a new congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her coagulopathy included high INR (2.38, controls <1.2), prolonged APTT (APTT-ratio 2.26, controls 1.0–1.4), low fibrinogen (0.4 g/l, controls 1.5–3.4), AT III deficiency (0% activity, controls >65%), increased D-dimers, and a deficit of clotting factors"
    explanation: >-
      Itemises the multifactorial coagulation-protein deficiency described on this node.
  - reference: PMID:34245688
    reference_title: "SLC37A4-CDG: New biochemical insights for an emerging congenital disorder of glycosylation with major coagulopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests a preserved balance between pro-coagulant (e.g., F2 and F11) and anticoagulant factors (e.g., AT), although this must be confirmed in additional patients."
    explanation: >-
      Supports the partly preserved haemostatic balance, and states the authors' own caveat
      that it needs confirmation.
  - reference: PMID:37193126
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antithrombin deficiency is frequently associated with factor XI deficiency and less frequently with a protein C, protein S, or factor IX deficiency."
    explanation: >-
      Places the antithrombin-plus-factor-XI pattern seen here in the wider CDG coagulopathy
      literature, where it is the characteristic combination.
  - reference: PMID:37193126
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the hemostatic balance in these patients is precarious and necessitates close monitoring in a setting of acute illness with greater metabolic needs."
    explanation: >-
      Graded REFUTE against the reassuring reading of "preserved balance": a CDG review of the
      same coagulation profile calls the balance precarious under metabolic stress. Both quotes
      are curated so the node does not resolve the tension in either direction.
- name: Hepatocellular Injury and Steatosis
  biological_scale: TISSUE
  description: >
    Affected individuals have hepatopathy with raised transaminases and hepatic steatosis on
    biopsy. Biopsy in the index patient showed increased hepatocyte volume and steatosis
    without necrosis, apoptosis or inflammatory infiltrate, which distinguishes this from an
    inflammatory or infectious hepatitis and is consistent with a metabolic or secretory
    lesion of the hepatocyte.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Hepatic steatosis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32884905
    reference_title: "SLC37A4-CDG: Mislocalization of the glucose-6-phosphate transporter to the Golgi causes a new congenital disorder of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 3 months of age, a liver biopsy revealed increased hepatocyte volume and steatosis (Fig. 2B). Necrosis, apoptosis or inflammatory reactions were not seen."
    explanation: >-
      Gives the histological content of this node, including the absence of an inflammatory
      component.
- name: Preserved Glucose-6-phosphate Transport from the Intact Allele
  biological_scale: ORGANISM
  description: >
    The wild-type allele supplies sufficient transporter for normal glucose-6-phosphate
    handling, so none of the glycogen storage disease Ib phenotype appears: no fasting
    hypoglycaemia, no lactic acidosis, no neutropenia. This node records a mechanistic
    negative, and it is what makes CDG-IIw a different disease from GSD Ib rather than a
    variant of it. It has no downstream edges by design.
  evidence:
  - reference: PMID:33728255
    reference_title: "SLC37A4-CDG: Second patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in SLC37A4‐CDG, the intact allele is able to fulfil the role required for normal glucose metabolism and therefore no features related to a deficiency of G6P transport are present."
    explanation: >-
      States directly that transport-deficiency features are absent because the intact allele
      suffices, which is the claim of this node.
  - reference: PMID:33964207
    reference_title: "A mutation in SLC37A4 causes a dominantly inherited congenital disorder of glycosylation characterized by liver dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in SLC37A4 cause an established recessive disorder known as glycogen storage disorder 1b characterized by liver and kidney dysfunction with neutropenia."
    explanation: >-
      Names the recessive phenotype whose features are absent here, establishing the contrast
      this node records.
  - reference: PMID:10940311
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "However, the last 12 amino acids of the cytoplasmic tail play no essential role(s) in functional integrity of the G6PT."
    explanation: >-
      Pre-dates the disease by twenty years and was done on GSD Ib alleles, but it is the direct
      structure-function evidence that the C-terminal tail truncated in CDG-IIw is dispensable
      for transport activity. Graded INDIRECT because the experiment was not done on the
      p.Arg423* allele and does not mention this disorder.

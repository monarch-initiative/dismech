name: Acute Hypotension
creation_date: '2026-05-04T19:32:38Z'
description: >-
  Acute hypotension is an abrupt fall in arterial blood pressure or an acutely
  low measured pressure relative to the clinical context. It is a
  syndrome-level hemodynamic finding with heterogeneous thresholds, causes,
  and consequences. Acute hypotension is not synonymous with circulatory shock
  or organ hypoperfusion: tissue blood flow can be preserved despite a low
  pressure, while shock can occur without hypotension.
category: Complex
disease_term:
  preferred_term: acute hypotension
  term:
    id: MONDO:0005174
    label: acute hypotension
parents:
- Acute disease
- Hypotensive disorder
pathophysiology:
- name: Reduced Effective Circulating Volume
  description: >-
    Hemorrhage, external fluid loss, or redistribution of intravascular volume
    can reduce venous return, cardiac preload, and stroke volume. Compensatory
    vasoconstriction may initially preserve pressure, whereas severe or rapidly
    progressive volume loss can produce an acute pressure fall.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:29732372
    reference_title: The Role of Failing Autonomic Nervous System on Life-Threatening Idiopathic Systemic Capillary Leak Syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      At the late stage of severe hemorrhage (equivalent to loss of approximately
      30% of blood volume), a paradoxical increase of vagal drive may occur leading
      to a decrease in heart rate, and systemic vascular resistance resulting in a
      reduction of arterial blood pressure, and possibly to a circulatory collapse
      (26, 29, 30).
    explanation: >-
      This physiologic discussion supports severe volume loss as one route to an
      acute arterial-pressure fall, while also showing that compensation varies
      with severity.
  downstream:
  - target: Acute Arterial Pressure Fall
    description: >-
      When loss of effective circulating volume exceeds compensatory capacity,
      reduced venous return and stroke volume can lower arterial pressure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced venous return, cardiac preload, and stroke volume
    evidence:
    - reference: PMID:29732372
      reference_title: The Role of Failing Autonomic Nervous System on Life-Threatening Idiopathic Systemic Capillary Leak Syndrome.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        At the late stage of severe hemorrhage (equivalent to loss of approximately
        30% of blood volume), a paradoxical increase of vagal drive may occur leading
        to a decrease in heart rate, and systemic vascular resistance resulting in a
        reduction of arterial blood pressure, and possibly to a circulatory collapse
        (26, 29, 30).
      explanation: >-
        The source directly describes a fall in arterial pressure during severe
        hemorrhage, but it is not evidence that every volume deficit causes
        hypotension.
- name: Reduced Cardiac Output
  description: >-
    Acute pump failure can reduce stroke volume and cardiac output. Tachycardia
    and vascular compensation may preserve pressure in milder states, but a
    sufficiently large output fall can cause hypotension or cardiogenic shock.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22483252
    reference_title: A general theory of acute and chronic heart failure.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The initial compensatory mechanism is frequently a tachycardia often resulting
      in a near normal cardiac output. In more severe forms a fall in cardiac output
      causes hypotension or cardiogenic shock.
    explanation: >-
      The review directly links a severe cardiac-output fall to hypotension while
      retaining the important role of compensation.
  downstream:
  - target: Acute Arterial Pressure Fall
    description: >-
      A severe fall in cardiac output reduces the flow component sustaining
      arterial pressure.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22483252
      reference_title: A general theory of acute and chronic heart failure.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In more severe forms a fall in cardiac output causes hypotension or
        cardiogenic shock.
      explanation: >-
        This statement directly supports the edge from reduced cardiac output to
        hypotension in severe acute heart-failure states.
- name: Reduced Systemic Vascular Resistance
  description: >-
    Loss of systemic vascular tone lowers the resistance component of arterial
    pressure. In vasoplegia, systemic vascular resistance remains low despite a
    normal or high cardiac index, producing profound vasodilation.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: vascular associated smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: vascular associated smooth muscle contraction
    modifier: DECREASED
    term:
      id: GO:0014829
      label: vascular associated smooth muscle contraction
  evidence:
  - reference: PMID:37547893
    reference_title: 'Vasoplegia: A Review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vasoplegia is a condition characterized by persistent low systemic vascular
      resistance despite a normal or high cardiac index, resulting in profound and
      uncontrolled vasodilation.
    explanation: >-
      This defines the low-resistance, vasodilatory mechanism independently of a
      low cardiac index.
  downstream:
  - target: Acute Arterial Pressure Fall
    description: >-
      Profound loss of vascular tone can lower arterial pressure even when
      cardiac index is preserved.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37547893
      reference_title: 'Vasoplegia: A Review.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ACE inhibitors result in vasoplegia due to an increase in bradykinin and a
        decrease in the concentration of angiotensin II, which results in reduced
        vascular tone and blood pressure, and hence vasoplegia.
      explanation: >-
        This specific vasoplegia example directly connects reduced vascular tone
        with reduced blood pressure.
- name: Obstructed Cardiac Filling or Ejection
  description: >-
    Mechanical obstruction of cardiac filling or ejection is a distinct
    hemodynamic route to low forward flow. If compensation is insufficient, the
    resulting output limitation can contribute to an acute pressure fall; when
    organ perfusion is impaired, the clinical state is obstructive shock.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:36871993
    reference_title: 'Not all Shock States Are Created Equal: A Review of the Diagnosis and Management of Septic, Hypovolemic, Cardiogenic, Obstructive, and Distributive Shock.'
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Categories include distributive, hypovolemic, obstructive, and cardiogenic,
      of which distributive (and usually septic distributive) shock is by far the
      most common.
    explanation: >-
      The review establishes obstructive shock as a distinct category, but its
      abstract does not resolve every intervening mechanism linking obstruction
      to a pressure fall.
  downstream:
  - target: Acute Arterial Pressure Fall
    description: >-
      Obstruction can reduce effective cardiac filling or forward ejection and
      thereby lower arterial pressure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Restricted cardiac filling or forward ejection with reduced cardiac output
    evidence:
    - reference: PMID:36871993
      reference_title: 'Not all Shock States Are Created Equal: A Review of the Diagnosis and Management of Septic, Hypovolemic, Cardiogenic, Obstructive, and Distributive Shock.'
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Categories include distributive, hypovolemic, obstructive, and cardiogenic,
        of which distributive (and usually septic distributive) shock is by far the
        most common.
      explanation: >-
        The source supports the obstructive category; the stated filling/output
        intermediates are a conservative mechanistic interpretation.
- name: Acute Arterial Pressure Fall
  description: >-
    Diverse changes in circulating volume, cardiac output, and systemic vascular
    resistance converge on an abrupt fall in arterial pressure. No single
    absolute threshold defines every clinically relevant episode; baseline
    pressure, magnitude, duration, and care setting affect interpretation.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:34392972
    reference_title: 'Heterogeneous impact of hypotension on organ perfusion and outcomes: a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although hypotension is common in acute care, there is a lack of accepted
      criteria for its definition.
    explanation: >-
      The review supports modeling the pressure fall as a context-dependent state
      rather than imposing a universal numerical cutoff.
  - reference: DOI:10.1371/journal.pone.0312966
    reference_title: 'Definition of clinically relevant intraoperative hypotension: A data-driven approach'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a data-driven approach, we identified the best fitting definitions of
      IOH for 30-day mortality, hLOS, and PACU-LOS. Our results demonstrate the
      need for careful selection of IOH definitions.
    explanation: >-
      This large perioperative cohort demonstrates that the operational definition
      depends on the outcome and context being studied.
  downstream:
  - target: Hypotension
    description: >-
      The acute arterial-pressure fall is observed clinically as the defining
      hypotension phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.1371/journal.pone.0312966
      reference_title: 'Definition of clinically relevant intraoperative hypotension: A data-driven approach'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The final cohort consisted of 65,454 patients. In the shaping subset, nearly
        all tested definitions of IOH showed associations with the three outcomes,
        where the risk of adverse outcomes often increased continuously with
        decreasing MAP.
      explanation: >-
        The study operationalizes intraoperative hypotension through decreasing
        mean arterial pressure, supporting the phenotype edge without selecting one
        universal threshold.
  - target: Context-Dependent Organ Hypoperfusion
    description: >-
      A pressure fall can reduce organ blood flow when regional resistance and
      autoregulation cannot compensate, but this transition is conditional and
      does not occur in every hypotensive episode.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Regional vascular resistance and organ-specific autoregulatory reserve
    evidence:
    - reference: PMID:34392972
      reference_title: 'Heterogeneous impact of hypotension on organ perfusion and outcomes: a narrative review.'
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        We emphasise that hypotension does not always lead to organ hypoperfusion;
        to the contrary, hypotension may preserve or even increase organ perfusion
        depending on the relative changes in perfusion pressure and regional
        vascular resistance and the status of blood pressure autoregulation.
      explanation: >-
        This directly supports a conditional, autoregulation-dependent edge and
        argues against treating hypotension as deterministic organ hypoperfusion.
- name: Context-Dependent Organ Hypoperfusion
  description: >-
    Organ blood flow can fall when perfusion pressure decreases beyond the
    compensatory range set by regional vascular resistance and autoregulation.
    The same measured blood pressure can therefore have different end-organ
    effects in different patients and organs.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:34392972
    reference_title: 'Heterogeneous impact of hypotension on organ perfusion and outcomes: a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We also propose a haemodynamic pyramid and a pressure-output-resistance
      triangle to facilitate understanding of why hypotension can have different
      pathophysiological mechanisms and end-organ effects.
    explanation: >-
      This supports modeling heterogeneous end-organ effects as a distinct
      conditional mechanism rather than as an inevitable synonym for low pressure.
  downstream:
  - target: Cerebral Hypoperfusion
    description: >-
      When cerebral autoregulation cannot maintain blood flow, systemic
      hypoperfusion can manifest as transient global cerebral hypoperfusion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19272517
      reference_title: Neurological aspects of syncope and orthostatic intolerance.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Sudden falling with loss of consciousness from syncope and symptoms of
        orthostatic intolerance are common, dramatic clinical problems of diverse
        cause, but cerebral hypoperfusion is the ultimate mechanism in most.
      explanation: >-
        The review supports cerebral hypoperfusion as the convergent mechanism for
        most syncope, although it does not imply that every hypotensive episode
        crosses the cerebral autoregulatory limit.
  - target: Renal Hypoperfusion and Ischemic Stress
    description: >-
      Severe or prolonged pressure reduction can expose susceptible kidneys to
      reduced perfusion and ischemic stress; observational associations do not
      establish that this occurs in every episode.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Duration and depth of hypotension, renal autoregulatory reserve, and competing injury pathways
    evidence:
    - reference: PMID:33287872
      reference_title: Postoperative hypotension in patients discharged to the intensive care unit after non-cardiac surgery is associated with adverse clinical outcomes.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Furthermore, we found an association between postoperative hypotension with
        MAP ≤ 55 mmHg and acute kidney injury stage II/III
      explanation: >-
        The cohort supports an association between severe postoperative
        hypotension and kidney injury, but cannot by itself establish a direct
        hypoperfusion mechanism.
- name: Cerebral Hypoperfusion
  description: >-
    Transient global reduction in cerebral blood flow is a final common pathway
    for most syncope, including cardiac, reflex, and orthostatic hypotensive
    presentations.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:19272517
    reference_title: Neurological aspects of syncope and orthostatic intolerance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sudden falling with loss of consciousness from syncope and symptoms of
      orthostatic intolerance are common, dramatic clinical problems of diverse
      cause, but cerebral hypoperfusion is the ultimate mechanism in most.
    explanation: >-
      This directly identifies cerebral hypoperfusion as the final mechanism in
      most syncope.
  downstream:
  - target: Syncope
    description: >-
      Transient global cerebral hypoperfusion can produce sudden loss of
      consciousness and postural tone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19272517
      reference_title: Neurological aspects of syncope and orthostatic intolerance.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Sudden falling with loss of consciousness from syncope and symptoms of
        orthostatic intolerance are common, dramatic clinical problems of diverse
        cause, but cerebral hypoperfusion is the ultimate mechanism in most.
      explanation: >-
        The review directly links cerebral hypoperfusion with syncope.
- name: Renal Hypoperfusion and Ischemic Stress
  description: >-
    Kidney injury is reported more often with severe or prolonged hypotension,
    but renal susceptibility, concurrent illness, and other injury mechanisms
    modify the relationship. The node therefore represents a plausible
    intermediate rather than a universal consequence.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:38252288
    reference_title: 'Hypotension during intensive care stay and mortality and morbidity: a systematic review and meta-analysis.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of articles reported associations in favor of 'no hypotension'
      for the outcomes mortality and acute kidney injury (AKI), and the strength of
      the association was related to the severity of hypotension in the majority of
      studies.
    explanation: >-
      The systematic review supports severity-related observational associations
      with AKI, not a deterministic causal claim.
  downstream:
  - target: Acute kidney injury
    description: >-
      Sustained renal hypoperfusion and ischemic stress can contribute to acute
      kidney injury, but the available clinical evidence is largely associative.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced filtration pressure and incompletely resolved ischemic or inflammatory injury pathways
    evidence:
    - reference: PMID:38252288
      reference_title: 'Hypotension during intensive care stay and mortality and morbidity: a systematic review and meta-analysis.'
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using meta-analysis, a significant association was found between hypotension
        and mortality (odds ratio: 1.45; 95% confidence interval (CI) 1.12-1.88;
        based on 13 studies and 34,829 patients), but not for AKI.
      explanation: >-
        The lack of a significant pooled AKI association justifies retaining this
        edge as partial and mechanistically unresolved rather than established.

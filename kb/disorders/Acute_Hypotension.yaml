    snippet: >-
      Group I received a low dose of NE (< 0.3 µg/kg/min) concurrently with resuscitation
      fluids.
    explanation: This supports norepinephrine-responsive vascular tone as a therapeutic compensation strategy in hypotensive resuscitation.
prevalence:
- population: Moderate-to-high-risk (ASA 3-4) non-cardiac surgical patients
  percentage: '88'
  notes: >-
    Acute hypotension is a syndrome rather than a single etiology, so population
    estimates are context-specific. In a retrospective multicenter cohort of
    22,109 ASA 3-4 adults undergoing non-cardiac surgery >=180 min with arterial
    line monitoring, 88% experienced at least one intraoperative hypotensive
    event (MAP <65 mmHg for >=1 min), ranging from 83.2% to 91.6% across centers.
  evidence:
  - reference: PMID:32663738
    reference_title: "The incidence of intraoperative hypotension in moderate to high risk patients undergoing non-cardiac surgery: A retrospective multicenter observational analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      88% of cases had at least one hypotensive event as defined as MAP <65 mmHg
      for 1 min. Across centers this varied from 83.2 to 91.6% of cases.
    explanation: >-
      Multicenter observational study quantifying the high intraoperative
      prevalence of acute hypotension (MAP <65 mmHg) in high-risk surgical patients.

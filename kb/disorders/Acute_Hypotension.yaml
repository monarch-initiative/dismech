- name: Epinephrine for anaphylaxis-associated hypotension
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: epinephrine
      term:
        id: CHEBI:28918
        label: (R)-adrenaline
  description: >-
    Intramuscular epinephrine is first-line treatment for anaphylaxis, a
    distributive-shock cause of acute hypotension.
  target_mechanisms:
  - target: Adrenergic compensation and vasopressor-responsive vascular tone
    treatment_effect: ACTIVATES
    description: >-
      Epinephrine is an adrenergic agonist that raises vascular tone and cardiac
      output, reversing the vasodilatory distributive shock of anaphylaxis.
    evidence:
    - reference: PMID:38186555
      reference_title: Frequency of cardiotoxicity following intramuscular administration of epinephrine in emergency department patients with anaphylaxis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Epinephrine can be a life-saving treatment for patients with
        anaphylaxis.
      explanation: >-
        This supports epinephrine, an adrenergic agonist, as the treatment that activates
        adrenergic-responsive vascular tone in anaphylaxis.
  - target: Shock physiology
    treatment_effect: MODULATES
    description: >-
      As first-line therapy for anaphylactic distributive shock, epinephrine
      counteracts the vasodilation and capillary leak that drive inadequate
      tissue perfusion.
    evidence:
    - reference: PMID:38186555
      reference_title: Frequency of cardiotoxicity following intramuscular administration of epinephrine in emergency department patients with anaphylaxis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Epinephrine can be a life-saving treatment for patients with
        anaphylaxis.
      explanation: >-
        This supports epinephrine as the modulating therapy for the distributive (anaphylactic)
        shock physiology underlying acute hypotension.
  target_phenotypes:
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: PMID:38186555
    reference_title: Frequency of cardiotoxicity following intramuscular administration of epinephrine in emergency department patients with anaphylaxis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 338 consecutive adult ED patients who received IM epinephrine for anaphylaxis
      during a recent 4-year period, cardiotoxic side effects were observed in approximately
      5% of patients.
    explanation: This supports ED epinephrine use in anaphylaxis, though the abstract focuses on cardiotoxicity frequency rather than efficacy.

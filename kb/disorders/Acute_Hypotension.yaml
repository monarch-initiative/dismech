diagnosis:
- name: Repeated Blood-Pressure Measurement and Trend Assessment
  description: >-
    Recognition requires a reliable arterial-pressure measurement interpreted
    against prior pressure, magnitude and duration of the change, symptoms,
    care setting, and measurement method. Absolute systolic or mean-pressure
    cutoffs are useful operational definitions but are not universal.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    A reproducible acute fall or low pressure supports acute hypotension; its
    clinical importance depends on duration, baseline, and organ-perfusion
    context rather than on one cutoff alone.
  evidence:
  - reference: DOI:10.1371/journal.pone.0312966
    reference_title: 'Definition of clinically relevant intraoperative hypotension: A data-driven approach'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Associations between intraoperative hypotension (IOH) and various postoperative
      outcomes were shown in retrospective trials using a variety of different
      definitions of IOH. This complicates the comparability of these trials and
      makes clinical application difficult.
    explanation: >-
      The study directly supports careful, context-specific selection of an
      operational hypotension definition.
- name: Hemodynamic Etiology and Organ-Perfusion Reassessment
  description: >-
    Clinical history, examination, and hemodynamic measurements are used to
    distinguish volume loss, pump failure, vasodilation, and obstruction and to
    determine whether low pressure is accompanied by organ hypoperfusion.
    Reassessment matters because mixed or evolving states are common.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Findings are interpreted as an etiologic and perfusion profile rather than
    as a diagnosis of shock from blood pressure alone.
  evidence:
  - reference: PMID:36871993
    reference_title: 'Not all Shock States Are Created Equal: A Review of the Diagnosis and Management of Septic, Hypovolemic, Cardiogenic, Obstructive, and Distributive Shock.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical history, physical examination, and hemodynamic assessments &
      monitoring help differentiate these states.
    explanation: >-
      This supports multimodal etiologic assessment rather than classification
      from blood pressure alone.
  - reference: PMID:36871993
    reference_title: 'Not all Shock States Are Created Equal: A Review of the Diagnosis and Management of Septic, Hypovolemic, Cardiogenic, Obstructive, and Distributive Shock.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One shock state may convert to another and may have an undifferentiated
      presentation; therefore, continual re-assessment is essential.
    explanation: >-
      This directly supports repeated assessment when the hemodynamic cause is
      mixed, initially unclear, or changing.
treatments:
- name: Intravenous Fluid Resuscitation for Volume-Responsive Hypotension
  treatment_term:
    preferred_term: fluid replacement therapy
    term:
      id: NCIT:C66896
      label: Hydration Therapy
  description: >-
    Intravenous fluid can support pressure when reduced effective circulating
    volume is present. This is an etiology-specific intervention, not a universal
    treatment for acute hypotension; response and risk of fluid overload must be
    considered.
  target_mechanisms:
  - target: Reduced Effective Circulating Volume
    treatment_effect: RESTORES
    description: >-
      Targeted volume administration attempts to restore preload and stroke
      volume in a patient whose hypotension is volume responsive.
    evidence:
    - reference: PMID:24994571
      reference_title: Goal-directed fluid therapy based on stroke volume variations improves fluid management and gastrointestinal perfusion in patients undergoing major orthopedic surgery.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        which achieves the maximal cardiac stroke volume via targeted administration
        of i.v. fluids, blood, and/or vasoactive substances.
      explanation: >-
        This supports targeting volume to a hemodynamic response rather than
        treating every low pressure with indiscriminate fluid.
  target_phenotypes:
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: DOI:10.35975/apic.v28i5.2560
    reference_title: The effect of using low dose norepinephrine before hypotensive resuscitation in hemorrhagic shock; a randomized controlled trial
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group II received resuscitative fluids only. If the resuscitative fluids
      failed to keep mean arterial pressure (MAP) > 65 mmHg, the patient was
      progressively administered NE even with high doses (0.05 to more than 0.3
      µg/kg/min).
    explanation: >-
      This randomized hemorrhagic-shock protocol supports fluid as a component of
      volume-loss resuscitation, but does not justify generalization to every cause
      of acute hypotension.
  - reference: PMID:24994571
    reference_title: Goal-directed fluid therapy based on stroke volume variations improves fluid management and gastrointestinal perfusion in patients undergoing major orthopedic surgery.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fluid overload, on the other hand, is associated with edema, ileus,
      postoperative nausea and vomiting, pulmonary complications, and increased
      cardiac demands [1].
    explanation: >-
      This supports the stated limitation that fluid treatment requires
      individualized assessment and is not risk free.
- name: Norepinephrine for Vasodilatory Hypotension
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: norepinephrine
      term:
        id: CHEBI:33569
        label: noradrenaline
  description: >-
    Norepinephrine is a vasopressor used to restore vascular tone and arterial
    pressure in vasoplegic or other vasodilatory states. This treatment node is
    deliberately restricted to low-resistance hypotension and is not a claim of
    benefit for every hemodynamic cause.
  target_mechanisms:
  - target: Reduced Systemic Vascular Resistance
    treatment_effect: RESTORES
    description: >-
      Adrenergic vasoconstriction counteracts the loss of vascular tone that
      defines vasoplegia.
    evidence:
    - reference: PMID:37547893
      reference_title: 'Vasoplegia: A Review.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This review expands upon the different vasopressors used in management of
        vasoplegia, including catecholamines such as norepinephrine, dopamine,
        epinephrine, phenylephrine, and other agents including vasopressin, methylene
        blue, angiotensin II, hydroxocobalamin, vitamin C, thiamine, and
        corticosteroids (ie, hydrocortisone).
      explanation: >-
        The review directly places norepinephrine among vasopressors used for the
        low-systemic-resistance state of vasoplegia.
  target_phenotypes:
  - preferred_term: Hypotension
    term:
      id: HP:0002615
      label: Hypotension
  evidence:
  - reference: PMID:37547893
    reference_title: 'Vasoplegia: A Review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Early identification and prompt management of vasoplegia is crucial to prevent
      development of shock. This review expands upon the different vasopressors used
      in management of vasoplegia, including catecholamines such as norepinephrine,
      dopamine, epinephrine, phenylephrine, and other agents including vasopressin,
      methylene blue, angiotensin II, hydroxocobalamin, vitamin C, thiamine, and
      corticosteroids (ie, hydrocortisone).
    explanation: >-
      This supports norepinephrine-containing vasopressor therapy specifically in
      vasoplegia, without extending the claim to hypovolemic, cardiogenic, or
      obstructive causes.
discussions:
- discussion_id: gap_context_specific_hypotension_threshold
  prompt: >-
    Which combinations of absolute pressure, change from baseline, exposure
    duration, organ-specific autoregulatory reserve, and care setting best
    identify a clinically important acute hypotensive episode?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Acute Arterial Pressure Fall
  - diagnosis#Repeated Blood-Pressure Measurement and Trend Assessment
  rationale: >-
    Published studies use heterogeneous definitions, and organ perfusion does
    not map uniformly to one arterial-pressure value. A universal cutoff would
    obscure this heterogeneity, whereas purely individualized definitions are
    difficult to compare and validate.
  proposed_experiments:
  - experiment_id: exp_multicontext_pressure_perfusion_thresholds
    name: Multicontext pressure-perfusion threshold study
    description: >-
      Prospectively collect continuous blood pressure, individual baseline
      pressure, exposure duration, organ-perfusion readouts, and adjudicated
      outcomes across emergency, perioperative, and critical-care cohorts, then
      externally validate context-specific threshold models.
  evidence:
  - reference: PMID:34392972
    reference_title: 'Heterogeneous impact of hypotension on organ perfusion and outcomes: a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although hypotension is common in acute care, there is a lack of accepted
      criteria for its definition.
    explanation: >-
      The review explicitly identifies the unresolved definition problem.
  - reference: PMID:34392972
    reference_title: 'Heterogeneous impact of hypotension on organ perfusion and outcomes: a narrative review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Evidence from RCTs does not support the notion that a higher arterial blood
      pressure target always leads to improved outcomes.
    explanation: >-
      This shows why simply choosing a universally higher pressure target does not
      resolve the threshold question.
- discussion_id: gap_hypotension_organ_injury_causality
  prompt: >-
    When is hypotension a causal driver of organ injury, and when is it primarily
    a marker of illness severity or another upstream process?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Context-Dependent Organ Hypoperfusion
  - pathophysiology#Renal Hypoperfusion and Ischemic Stress
  - phenotype#Acute kidney injury
  rationale: >-
    Observational cohorts repeatedly associate deeper hypotension with adverse
    outcomes, but confounding by illness severity, treatment indication, and
    concurrent injury pathways limits causal interpretation. Kidney outcomes are
    especially uncertain because the pooled analysis did not reproduce the
    descriptive AKI association.
  proposed_experiments:
  - experiment_id: exp_etiology_stratified_pressure_target_trial
    name: Etiology-stratified perfusion-target trial
    description: >-
      Randomize feasible, well-defined hemodynamic subgroups to individualized
      pressure-target strategies while measuring organ-specific perfusion and
      injury biomarkers, with prespecified mediation analysis separating pressure
      effects from the triggering illness and treatment exposures.
  evidence:
  - reference: PMID:38252288
    reference_title: 'Hypotension during intensive care stay and mortality and morbidity: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exposure to hypotension during ICU stay was associated with increased
      mortality and AKI in the majority of included studies, and associations for
      both outcomes increased with increasing hypotension severity. The
      meta-analysis reinforced the descriptive findings regarding mortality but did
      not yield similar support for AKI.
    explanation: >-
      The discordance between descriptive studies and pooled AKI results directly
      motivates the causal knowledge gap.
notes: >-
  Scope is intentionally restricted to the acute arterial-pressure syndrome.
  Shock categories appear only as etiologic or consequence contexts because
  shock requires impaired tissue perfusion and is not interchangeable with low
  blood pressure. No population prevalence is asserted: episode rates depend
  strongly on setting, monitoring intensity, and the operational pressure and
  duration threshold.

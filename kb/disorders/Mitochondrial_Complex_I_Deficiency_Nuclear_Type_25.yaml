name: Mitochondrial Complex I Deficiency, Nuclear Type 25
creation_date: "2026-11-27T14:18:42Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 25 (MC1DN25) is the autosomal
  recessive complex I deficiency caused by biallelic variants in NDUFB3, an
  accessory subunit of the membrane-arm (subcomplex I-beta) of complex I. Almost
  all reported patients are homozygous for one missense variant, c.64T>C
  (p.Trp22Arg), which is recurrent in families of Irish ancestry but has arisen
  more than once. Loss of NDUFB3 function lowers the amount of assembled complex
  I and gives an isolated complex I deficiency, but some assembled enzyme
  remains, and the clinical course is milder than most nuclear complex I
  deficiencies. The typical patient has intrauterine growth restriction, a
  life-threatening metabolic crisis with lactic acidosis early in life, then
  sustained improvement with only illness-related bouts of lactic acidosis,
  persistent short stature and a recognisable facial appearance with a
  prominent forehead, smooth philtrum, deep-set eyes and low-set ears;
  neurological deficits are absent. Some patients present only with primary
  short stature, an adult was diagnosed during investigation of unexplained
  liver disease, and the first reported homozygous infant died at 4 months.
category: Mendelian
parents:
- Mitochondrial Complex I Deficiency
synonyms:
- MC1DN25
- NDUFB3-related mitochondrial disease

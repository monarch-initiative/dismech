- name: Prenatal and Postnatal Growth Restriction
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Growth restriction starts before birth and persists: most patients had
    intrauterine growth restriction, all are short, and growth hormone has given a
    variable response. Short stature can be the only presenting feature. How
    complex I deficiency restricts growth is not established; reviews of
    mitochondrial short stature propose mitochondrial dysfunction in the growth
    plate and endocrine disturbance, so this node is marked hypothetical.
  evidence:
  - reference: PMID:27091925
    reference_title: "A recurrent mitochondrial p.Trp22Arg NDUFB3 variant causes a distinctive facial appearance, short stature and a mild biochemical and clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Poor linear growth was seen in all patients, three patients have had growth
      hormone treatment with variable response.
    explanation: >-
      Growth failure across the cohort.
  - reference: PMID:40009295
    reference_title: "Clinical manifestations and pathogenesis of mitochondrial dysfunction in short stature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pathogenesis involves mitochondrial dysfunction, growth plate impairment, and
      endocrine disorders.
    explanation: >-
      The proposed mechanisms of short stature in primary mitochondrial disease,
      which names NDUFB3 among its causes; a synthesis, not a measurement in NDUFB3
      patients.
  downstream:
  - target: Short Stature
    causal_link_type: DIRECT

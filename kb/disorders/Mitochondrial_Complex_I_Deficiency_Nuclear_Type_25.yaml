discussions:
- discussion_id: mc1dn25_same_genotype_different_outcome
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does homozygosity for the same NDUFB3 p.Trp22Arg variant give a lethal
    infantile disease in some patients but a mild course with good long-term
    prognosis in most?
  attaches_to:
  - "pathophysiology#Biallelic NDUFB3 Variants"
  - "pathophysiology#Impaired Membrane-Arm Assembly of Complex I"
  rationale: >-
    The first homozygous infant died at 4 months and an untested sibling of two
    patients died on day 2, while most homozygotes recovered from an early crisis
    and remain well apart from short stature. The 2016 authors propose that
    residual assembled complex I explains the mild course and that nuclear
    modifiers, the mitochondrial DNA background and the quality of supportive care
    may contribute, but none of these has been tested.
  proposed_experiments:
  - experiment_id: exp_mc1dn25_residual_assembly
    name: Compare residual complex I in mild and fatal p.Trp22Arg homozygotes
    description: >-
      Measure assembled complex I and NDUFB3 protein in fibroblasts or muscle from
      surviving and deceased homozygotes, and sequence their mitochondrial DNA, to
      test whether residual assembly or the mtDNA background tracks with outcome.
notes: >-
  No GeneReviews chapter covers this disorder. Phenotypes come from the 2016
  cohort (PMID:27091925), whose full text and patient table are cached, together
  with the first reports (PMID:22277967, PMID:22499348) and an adult case
  (PMID:31000363). Neurological deficits were absent in that cohort, so
  neurological phenotypes typical of other complex I deficiencies are not curated
  here.

  The synonym NDUFB3-related mitochondrial disease is the term used in the 2016
  report.

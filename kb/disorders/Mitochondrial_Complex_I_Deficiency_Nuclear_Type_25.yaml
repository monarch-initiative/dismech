genetic:
- name: NDUFB3
  gene_term:
    preferred_term: NDUFB3
    term:
      id: hgnc:7698
      label: NDUFB3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    NDUFB3 is at 2q33.1. ClinGen classifies NDUFB3 as Definitive for mitochondrial
    disease (MONDO:0044970, autosomal recessive); that record is for a lumped term,
    not this entry's MONDO term, so it is not copied into gene_disease_validity.
    CAUSATIVE rests on ten families plus the first two published patients, with
    complementation in patient fibroblasts.

    Nearly every patient is homozygous for c.64T>C (p.Trp22Arg, rs142609245);
    one compound heterozygote carries it with p.Gly70* (PMID:22499348). The
    variant has a minor allele frequency of about 0.1 percent in non-Finnish
    Europeans with no homozygotes in population databases, and is concentrated in
    families of Irish ancestry; haplotype analysis supports a common founder for
    some Irish families and independent recurrence in others.
  evidence:
  - reference: PMID:22277967
    reference_title: "Molecular diagnosis of infantile mitochondrial disease with targeted next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complex I subunit NDUFB3 was mutated in patient P3, a girl from a
      non-consanguineous family with complex I deficiency and lethal infantile
      mitochondrial disease.
    explanation: >-
      The first reported patient.
  - reference: PMID:22499348
    reference_title: "Molecular diagnosis in mitochondrial complex I deficiency using exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second criterion was 'Presence of two novel potentially pathogenic variants
      in a structural gene of complex I', which discovered rare variants in NDUFS8
      in two unrelated individuals and in NDUFB3 in a third.
    explanation: >-
      A second, independent patient.
  - reference: PMID:27091925
    reference_title: "A recurrent mitochondrial p.Trp22Arg NDUFB3 variant causes a distinctive facial appearance, short stature and a mild biochemical and clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a cohort of 10 patients from 8 families (7 families are of
      unrelated Irish ancestry) all of whom have short stature
    explanation: >-
      Eight further families.
  - reference: PMID:31000363
    reference_title: "Clinical utility of genomic analysis in adults with idiopathic liver disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 4 with a prior diagnosis of non-alcoholic steatohepatitis was found
      to harbor a mitochondrial disorder due to a homozygous pathogenic variant in
      NDUFB3
    explanation: >-
      An adult homozygote.

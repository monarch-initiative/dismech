    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Partial loss of function: patient muscle keeps some fully assembled complex
      I, unlike most structural-subunit defects, and the authors relate this
      residual assembly to the mild course.

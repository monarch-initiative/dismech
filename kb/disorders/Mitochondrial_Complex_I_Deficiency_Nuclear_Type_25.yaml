  description: >-
    Patients are homozygous for p.Trp22Arg or compound heterozygous for it with a
    truncating allele. Parents tested were heterozygous carriers, and the
    homozygous genotype segregated with disease in the sibships studied.
  evidence:
  - reference: PMID:27091925
    reference_title: "A recurrent mitochondrial p.Trp22Arg NDUFB3 variant causes a distinctive facial appearance, short stature and a mild biochemical and clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the exception of patients 4 and 5, where familial samples were
      unavailable, parental carrier testing confirmed recessive inheritance.
    explanation: >-
      Recessive inheritance confirmed by parental testing in six of eight
      families.
pathophysiology:
- name: Biallelic NDUFB3 Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The lesion is almost always homozygous p.Trp22Arg, a change at an evolutionarily
    conserved residue near the N-terminus; one patient carried it in trans with
    the truncating p.Gly70*. Complementation with wild-type NDUFB3 restored
    complex I activity and protein levels in patient fibroblasts, which
    established causality. NDUFB3 is an accessory, non-catalytic subunit, so the
    lost activity is structural.

    reference_title: "The nuclear receptor NR2E3 plays a role in human retinal photoreceptor differentiation and degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The retina was also degenerate, retaining photoreceptors in only the central and far peripheral regions."
    explanation: >
      Documents the progressive degenerative loss of photoreceptors in the ESCS
      retina.
  - reference: clinicaltrials:NCT02338973
    reference_title: "Pilot Phase I/II Study of the Evaluation of Interferon Gamma-1b Administered Topically for Macular Edema/Intraretinal Schisis Cysts in Rod-Cone Dystrophy (RCD) and Enhanced S-Cone Syndrome (ESCS)"
    supports: SUPPORT

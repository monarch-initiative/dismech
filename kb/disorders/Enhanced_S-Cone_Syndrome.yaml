genetic:
- name: NR2E3 pathogenic variants
  gene_term:
    preferred_term: NR2E3
    term:
      id: hgnc:7974
      label: NR2E3
  association: Causative
  relationship_type: CAUSATIVE
  notes: >
    ESCS is caused by biallelic NR2E3 variants. The recurrent p.Arg311Gln (R311Q)
    ligand-binding-domain substitution is the most common ESCS allele; pathogenic
    variants concentrate in the conserved DNA-binding and ligand-binding domains.
    A novel homozygous c.1182del p.(Ile395*) deleting the AF2 activation domain
    has also been reported. The single dominant p.Gly56Arg allele causes autosomal
    dominant retinitis pigmentosa rather than ESCS.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:10655056
      reference_title: "Mutation of a nuclear receptor gene, NR2E3, causes enhanced S cone syndrome, a disorder of retinal cell fate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ESCS is an autosomal recessive retinopathy in which patients have an increased sensitivity to blue light"
      explanation: >
        The gene-discovery study classifies ESCS as autosomal recessive.
  evidence:
  - reference: PMID:11773633
    reference_title: "The nuclear receptor NR2E3 plays a role in human retinal photoreceptor differentiation and degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 16 ESCS patients with the most common NR2E3 mutation, R311Q, we documented an abnormal ratio of S to L/M cone function"
    explanation: >
      Identifies R311Q as the most common NR2E3 mutation in ESCS.
  - reference: PMID:19718767
    reference_title: "NR2E3 mutations in enhanced S-cone sensitivity syndrome (ESCS), Goldmann-Favre syndrome (GFS), clumped pigmentary retinal degeneration (CPRD), and retinitis pigmentosa (RP)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high proportion of mutations are located in the evolutionarily-conserved DNA-binding domains (DBDs) and ligand-binding domains (LBDs) of NR2E3."
    explanation: >
      Localizes the majority of pathogenic NR2E3 variants to the conserved DBD
      and LBD.
  - reference: PMID:42427056
    reference_title: "Autosomal recessive retinopathy (ARRP) associated with a novel variant in NR2E3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified a novel homozygous deletion in NR2E3 gene: Chr15(GRCh37): g.71817633del c.1182del p. (Ile395*) resulting in the complete deletion of the NR2E3 AF2 domain"
    explanation: >
      Reports a novel homozygous AF2-domain-deleting NR2E3 variant causing ESCS.
treatments:
- name: Carbonic Anhydrase Inhibitor for Cystoid Macular Edema
  description: >
    Topical or systemic carbonic anhydrase inhibitors (e.g., acetazolamide,
    dorzolamide) are used to reduce the cystoid macular edema and intraretinal
    schisis that complicate ESCS, aiming to preserve central vision. There is no
    treatment that reverses the underlying photoreceptor cell-fate defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbonic anhydrase inhibitor
      term:
        id: NCIT:C29577
        label: Carbonic Anhydrase Inhibitor
    - preferred_term: acetazolamide
      term:
        id: CHEBI:27690
        label: acetazolamide
- name: Topical Interferon Gamma-1b (Investigational)
  description: >
    Topical interferon gamma-1b eyedrops have been evaluated in an early-phase
    (Phase I/II) trial to reduce macular edema and intraretinal schisis cysts in
    ESCS and rod-cone dystrophy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

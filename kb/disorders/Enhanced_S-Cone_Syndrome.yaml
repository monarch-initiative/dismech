    snippet: "resulting in the complete deletion of the NR2E3 AF2 domain which is associated with the observed phenotype consistent with retinal degeneration pathway described in Enhanced S-Cone Syndrome (ESCS)"
    explanation: >
      Documents a novel homozygous deletion abolishing the NR2E3 AF2 activation
      domain as a loss-of-function cause of the ESCS phenotype.
- name: Photoreceptor Cell-Fate Mis-specification and S-Cone Excess
  description: >
    In the absence of NR2E3 repression, the retina overproduces S (blue) cones at
    the expense of rods and L/M cones. This developmental cell-fate
    mis-specification is the mechanistic signature that distinguishes ESCS from the
    rod-first apoptotic pathway of typical retinitis pigmentosa: rather than a
    mature photoreceptor topography being depleted, the retina is built with an
    abnormal S-to-L/M cone ratio and a near-absence of rods, and is disorganized
    from the outset.
  role: central_effector
  cell_types:
  - preferred_term: S cone cell
    modifier: INCREASED
    term:
      id: CL:0003050
      label: S cone cell
  - preferred_term: retinal rod cell
    modifier: DECREASED
    term:

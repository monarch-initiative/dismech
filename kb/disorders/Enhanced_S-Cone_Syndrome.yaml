      label: eye photoreceptor cell development
  downstream:
  - target: Photoreceptor Cell-Fate Mis-specification and S-Cone Excess
    description: >
      Loss of NR2E3 transcriptional activity removes the repression of the S-cone
      program in rod-committed precursors, redirecting photoreceptor cell fate.
    causal_link_type: DIRECT
  evidence:

      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  evidence:
  - reference: clinicaltrials:NCT02338973
    reference_title: "Pilot Phase I/II Study of the Evaluation of Interferon Gamma-1b Administered Topically for Macular Edema/Intraretinal Schisis Cysts in Rod-Cone Dystrophy (RCD) and Enhanced S-Cone Syndrome (ESCS)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The medicine interferon gamma-1b may help people with these diseases."
    explanation: >
      The trial evaluates topical interferon gamma-1b for the macular
      edema/schisis of ESCS.

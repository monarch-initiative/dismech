name: Enhanced S-Cone Syndrome
creation_date: "2026-07-10T00:00:00Z"
category: Mendelian
description: >
  Enhanced S-cone syndrome (ESCS) is a rare autosomal recessive inherited retinal
  dystrophy caused by biallelic loss-of-function variants in NR2E3
  (photoreceptor-specific nuclear receptor, PNR), a photoreceptor-restricted
  ligand-dependent nuclear-hormone-receptor transcription factor. Uniquely among
  inherited retinal diseases, ESCS manifests a paradoxical gain of function of a
  photoreceptor subtype: loss of NR2E3-mediated repression of the S
  (short-wavelength, blue) cone genetic program during retinogenesis mis-specifies
  photoreceptor cell fate, so that cells that would normally become rods instead
  adopt an S-cone identity. The result is an excess of S cones at the expense of
  rods and L/M (red/green) cones, producing supranormal S-cone sensitivity,
  rudimentary or absent rod function with lifelong night blindness, reduced
  L/M-cone (color) vision, and a characteristic electroretinogram. The dysplastic,
  rod-deficient retina is also progressively degenerative, frequently complicated
  by cystoid maculopathy and intraretinal schisis; the most severe end of the
  NR2E3 phenotypic spectrum is historically termed Goldmann-Favre syndrome. ESCS
  is distinct from the rare dominant p.Gly56Arg NR2E3 allele that causes autosomal
  dominant retinitis pigmentosa.

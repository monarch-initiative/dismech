    explanation: >
      Establishes NR2E3 as the causative gene in the large majority of ESCS
      probands and defines it as a retinal ligand-dependent transcription factor.
  - reference: PMID:19718767
    reference_title: "NR2E3 mutations in enhanced S-cone sensitivity syndrome (ESCS), Goldmann-Favre syndrome (GFS), clumped pigmentary retinal degeneration (CPRD), and retinitis pigmentosa (RP)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its physiological activity is essential for proper rod and cone photoreceptor development and maintenance"
    explanation: >
      Confirms NR2E3 as a photoreceptor-restricted transcription factor essential

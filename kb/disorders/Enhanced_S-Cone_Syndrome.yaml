      label: retinal rod cell differentiation
  - preferred_term: retinal cone cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0042670
      label: retinal cone cell differentiation
  downstream:
  - target: Rod Photoreceptor Deficiency and Scotopic Dysfunction
    description: >
      Redirection of rod precursors toward an S-cone fate leaves the retina with
      rudimentary or absent rod photoreceptors.
    causal_link_type: DIRECT
  - target: Progressive Retinal Degeneration and Maculopathy
    description: >
      The dysplastic, disorganized photoreceptor mosaic is intrinsically unstable
      and undergoes progressive degeneration over time.
    causal_link_type: DIRECT
  evidence:

      S cones at the expense of rods and L/M cones.
  - reference: PMID:11773633
    reference_title: "The nuclear receptor NR2E3 plays a role in human retinal photoreceptor differentiation and degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No rods were identified, but cones were increased approximately 2-fold, and 92% were S cones."
    explanation: >
      Postmortem quantification of an ESCS retina confirms rod absence and marked
      S-cone predominance.
  - reference: PMID:10655056
    reference_title: "Mutation of a nuclear receptor gene, NR2E3, causes enhanced S cone syndrome, a disorder of retinal cell fate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The altered ratio of S- to L/M-cone photoreceptor sensitivity in ESCS may be due to abnormal cone cell fate determination during retinal development."
    explanation: >
      Attributes the abnormal S-to-L/M cone ratio to disordered photoreceptor
      cell-fate determination during retinal development.
- name: Rod Photoreceptor Deficiency and Scotopic Dysfunction
  description: >
    Because rod precursors are diverted to an S-cone fate, the ESCS retina has
    rudimentary or absent rod photoreceptors and correspondingly absent scotopic
    (rod-mediated) function. Clinically this produces lifelong night blindness,
    typically the earliest symptom, and a non-detectable dark-adapted rod
    electroretinogram.

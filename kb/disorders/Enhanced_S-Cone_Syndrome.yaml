  prevalence_class: ULTRA_RARE
  notes: >
    ESCS is an ultra-rare inherited retinal dystrophy. Only a few hundred cases
    and 32 distinct NR2E3 mutations had been reported by 2009; precise
    population prevalence is not documented.
  evidence:
  - reference: PMID:19718767
    reference_title: "NR2E3 mutations in enhanced S-cone sensitivity syndrome (ESCS), Goldmann-Favre syndrome (GFS), clumped pigmentary retinal degeneration (CPRD), and retinitis pigmentosa (RP)."

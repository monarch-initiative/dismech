      life.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19718767
    reference_title: "NR2E3 mutations in enhanced S-cone sensitivity syndrome (ESCS), Goldmann-Favre syndrome (GFS), clumped pigmentary retinal degeneration (CPRD), and retinitis pigmentosa (RP)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype common to all these patients is night blindness, rudimental or absent rod function, and hyperfunction of the \"blue\" S-cones."
    explanation: >
      Defines the shared NR2E3 phenotype of night blindness with rudimentary or
      absent rod function and S-cone hyperfunction.
- name: Progressive Retinal Degeneration and Maculopathy
  conforms_to: "photoreceptor_degeneration#Progressive Visual Field Loss and Blindness"
  description: >
    Beyond the developmental defect, the ESCS retina undergoes progressive
    degeneration, retaining photoreceptors only in central and far-peripheral
    regions over time. Cystoid macular edema and intraretinal schisis cysts are
    frequent complications (the Goldmann-Favre end of the spectrum), causing
    additional loss of central vision.
  role: consequence
  cell_types:

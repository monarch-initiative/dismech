    reference_title: "Mutations in the complex I NDUFS2 gene of patients with cardiomyopathy and encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NDUFS2 protein is part of complex I of many pro- and eukaryotes. The
      nuclear gene coding for this protein is therefore an important candidate
      for mutational detection studies in enzymatic complex I deficient
      patients.
    explanation: >-
      States the conservation argument that made this gene a candidate.
  - reference: PMID:15576045
    reference_title: "Clinical and molecular findings in children with complex I deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetic definition was reached in eight patients (35%).
    explanation: >-
      Bounds how much of childhood complex I deficiency any single subunit gene
      explains: in this cohort most patients had no genetic diagnosis at all.
  - reference: PMID:15576045
    reference_title: "Clinical and molecular findings in children with complex I deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter cases suggest the possibility of unconventional patterns of
      inheritance in complex I defects.
    explanation: >-
      The reporting authors' own framing of the NDUFA8-plus-NDUFS2 patient, as a
      possibility raised rather than a mechanism shown.

experimental_models:
- name: NDUFS2 CRISPR knockout HEK293 cell line
  experimental_model_type: CELL_LINE
  cell_source: Immortalized human embryonic kidney 293, NDUFS2 CRISPR/Cas9 knockout
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:33744462
  description: >-
    The first NDUFS2 knockout cell line, made because knowledge of the
    interfacial-region subunits was limited by the absence of knockouts and
    animal models. It was used both to characterise the consequences of losing
    the subunit and as a screening system, in which idebenone partially restored
    the bioenergetic phenotype.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockout reproduces the complete cellular phenotype this node asserts,
      including the compensatory rise in complex II respiration that follows
      from complex II being the one complex with no mitochondrially encoded
      subunits.
    limitations: >-
      Embryonic kidney cells are neither neural, cardiac nor hepatic, so nothing
      in this model addresses why those three tissues fail in patients while
      others do not. A complete knockout is also a more severe perturbation than
      the missense alleles that cause human disease, in which residual enzyme is
      present.
    readouts:
    - name: Complex I specific respiration, ATP pool and cell growth
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: DECREASED
      interpretation: >-
        All three fall on knockout, alongside glycolytic capacity and membrane
        integrity.
      evidence:
      - reference: PMID:33744462
        reference_title: "Complex I protein NDUFS2 is vital for growth, ROS generation, membrane integrity, apoptosis, and mitochondrial energetics."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Disruption of NDUFS2 significantly decreased cell growth in medium,
          Complex I specific respiration, glycolytic capacity, ATP pool and
          cell-membrane integrity
        explanation: >-
          Reports the measurements and their direction.
    - name: Reactive oxygen species, apoptosis and complex II respiration
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: INCREASED
      interpretation: >-
        All rise on knockout. The rise in complex II respiration is the expected
        compensatory shift rather than a pathological finding.
      evidence:
      - reference: PMID:33744462
        reference_title: "Complex I protein NDUFS2 is vital for growth, ROS generation, membrane integrity, apoptosis, and mitochondrial energetics."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          but significantly increased Complex II respiration, ROS generation,
          apoptosis, and necrosis
        explanation: >-
          Reports the measurements that rise, including the compensatory
          complex II shift.
    - name: Growth, ATP pool and oxygen consumption after idebenone treatment
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: RESTORED
      interpretation: >-
        Partial restoration of all three by idebenone, a short-chain
        benzoquinone that bypasses complex I. This is a rescue readout in the
        model, not a treatment given to a patient.
      evidence:
      - reference: PMID:33744462
        reference_title: "Complex I protein NDUFS2 is vital for growth, ROS generation, membrane integrity, apoptosis, and mitochondrial energetics."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Treatment with idebenone, a clinical benzoquinone currently being
          investigated in other indications, partially restored growth, ATP
          pool, and oxygen consumption of the mutant.
        explanation: >-
          Reports the rescue and its extent.
    evidence:
    - reference: PMID:33744462
      reference_title: "Complex I protein NDUFS2 is vital for growth, ROS generation, membrane integrity, apoptosis, and mitochondrial energetics."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This is the first report to use CRISPR/Cas9 approach to construct a
        knockout NDUFS2 cell line and use the constructed mutant to evaluate the
        efficacy of a known mitochondrial therapeutic to enhance bioenergetic
        capacity.
      explanation: >-
        Establishes the model and the purpose it was built for.

animal_models:
- name: ndufs2 knockout zebrafish
  species: Zebrafish
  genotype: ndufs2 -/- 16 bp deletion, CRISPR/Cas9
  publication: PMID:40791373
  description: >-
    A CRISPR knockout line made specifically to enable mechanistic study and
    therapeutic screening in complex I-deficient Leigh syndrome spectrum. It
    reproduces the severity of the human disease, including reduced survival,
    and it produced a therapeutic lead that would not have come from the
    bioenergetic phenotype alone.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Complex I enzyme activity falls by 80 percent, and unbiased metabolomics
      shows the expected downstream accumulation of lactate, tricarboxylic acid
      cycle intermediates and acylcarnitines.
    limitations: >-
      A complete knockout models a null allele, whereas human disease alleles are
      missense with residual function, so severity is not directly comparable.
      Zebrafish larval physiology also differs from the human infant in ways that
      matter for a metabolic disease, notably yolk-dependent nutrition during the
      period assayed.
    readouts:
    - name: Complex I enzyme activity
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: DECREASED
      interpretation: >-
        Reduced by 80 percent relative to wild type.
      evidence:
      - reference: PMID:40791373
        reference_title: "ndufs2(-/-) zebrafish have impaired survival, neuromuscular activity, morphology, and one-carbon metabolism treatable with folic acid."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          ndufs2 -/- zebrafish had 80% reduced CI enzyme activity.
        explanation: >-
          Reports the enzymatic measurement and its magnitude.
    evidence:
    - reference: PMID:40791373
      reference_title: "ndufs2(-/-) zebrafish have impaired survival, neuromuscular activity, morphology, and one-carbon metabolism treatable with folic acid."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, ndufs2 -/- zebrafish recapitulate severe CI deficiency, complex
        metabolic pathophysiology, and relevant LSS neuromuscular and survival
        phenotypes, enabling future translational studies of therapeutic
        candidates.
      explanation: >-
        The authors' own assessment of what the model recapitulates.
  - target: Lactic Acidosis and Multisystem Metabolic Decompensation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces the multisystem picture, with reduced survival,
      neuromuscular dysfunction, reduced growth, hepatomegaly and ocular
      abnormalities including an abnormal retinal ganglion cell layer. The last
      of these is notable given that biallelic NDUFS2 variants have also been
      reported in an optic neuropathy.
    limitations: >-
      Several of the morphological findings, such as an uninflated swim bladder
      and yolk retention, have no human counterpart and are markers of general
      larval ill health rather than disease-specific phenotypes. The
      correspondence with human multisystem disease is therefore at the level of
      pattern rather than of individual features.
    readouts:
    - name: Survival, neuromuscular function and organ morphology
      target: Lactic Acidosis and Multisystem Metabolic Decompensation
      direction: DECREASED
      interpretation: >-
        Reduced survival, impaired swimming capacity, reduced growth, with
        hepatomegaly and small eyes with an abnormal retinal ganglion cell
        layer.
      evidence:
      - reference: PMID:40791373
        reference_title: "ndufs2(-/-) zebrafish have impaired survival, neuromuscular activity, morphology, and one-carbon metabolism treatable with folic acid."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          ndufs2 -/- larvae exhibit markedly reduced survival, severe
          neuromuscular dysfunction including impaired swimming capacity,
          multiple morphologic malformations, reduced growth, hepatomegaly,
          uninflated swim bladder, yolk retention, small intestines, and small
          eyes and pupils with abnormal retinal ganglion cell layer.
        explanation: >-
          Enumerates the multisystem phenotype.
    - name: Growth defect and hepatomegaly after folic acid treatment
      target: Lactic Acidosis and Multisystem Metabolic Decompensation
      direction: RESTORED
      interpretation: >-
        Folic acid rescued the growth defect and the hepatomegaly, which is what
        elevates the one-carbon metabolism finding from an observation to a
        therapeutic hypothesis.
      evidence:
      - reference: PMID:40791373
        reference_title: "ndufs2(-/-) zebrafish have impaired survival, neuromuscular activity, morphology, and one-carbon metabolism treatable with folic acid."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          One-carbon metabolism associated pathway alterations appear to
          contribute to CI disease pathophysiology, as folic acid treatment
          rescued the growth defect and hepatomegaly in ndufs2 -/- larvae.
        explanation: >-
          Reports the rescue and the inference the authors draw from it.
    evidence:
    - reference: PMID:40791373
      reference_title: "ndufs2(-/-) zebrafish have impaired survival, neuromuscular activity, morphology, and one-carbon metabolism treatable with folic acid."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transcriptome profiling of ndufs2 -/- larvae revealed dysregulation of
        the electron transport chain, TCA cycle, fatty acid beta-oxidation, and
        one-carbon metabolism.
      explanation: >-
        Establishes the breadth of metabolic dysregulation this model reports
        on.

- name: Ndufs2 hemizygous mouse
  species: Mouse
  genotype: Ndufs2 +/- on a C57BL/6J background
  publication: PMID:35338200
  description: >-
    A heterozygous mouse, made to ask whether the modest decline in complex I
    subunit expression seen in ageing is itself harmful. For this disease it is
    informative in a different way: it is the carrier state, and it shows what a
    single functional NDUFS2 allele is sufficient for.
  modeled_mechanisms:
  - target: NDUFS2 Loss of Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      One functional allele produces no overt phenotype and no significant
      decrease in complex I function, despite a significant reduction in Ndufs2
      messenger RNA. The model therefore does not reproduce the disease, and
      that negative result is the point: it is direct evidence that the human
      condition requires biallelic loss and that heterozygous carriers should be
      unaffected.
    limitations: >-
      A hemizygous deletion is not the human genotype, which is biallelic
      missense. The model shows that halving message is tolerated; it says
      nothing about what a missense allele in the quinone-binding site does, and
      it was designed to address ageing rather than this disease. Mouse and
      human dosage sensitivity for complex I subunits also need not match.
    readouts:
    - name: Complex I function and aging-related motor, cognitive and metabolic phenotypes
      target: NDUFS2 Loss of Function
      direction: UNCHANGED
      interpretation: >-
        No overt impairment and no significant decrease in complex I function in
        hemizygotes, despite reduced Ndufs2 message.
      evidence:
      - reference: PMID:35338200
        reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our results indicate that Ndufs2 hemizygous mice (Ndufs2+/-) show no
          overt impairment in aging-related motor function, learning, tissue
          histology, organismal metabolism, or sensitivity to metformin in a
          C57BL6/J background.
        explanation: >-
          Reports the negative result across every phenotype domain assessed.
    evidence:
    - reference: PMID:35338200
      reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Despite a significant reduction of Ndufs2 mRNA, the mice do not
        demonstrate a significant decrease in complex I function.
      explanation: >-
        The model does not reproduce the disease state, which is what makes it
        evidence about the carrier state rather than about the disease.
- name: Brain-specific Ndufs2 knockout mouse
  species: Mouse
  genotype: Ndufs2 floxed crossed to Nestin-Cre, with and without a yeast NDI1 transgene
  publication: PMID:35338200
  description: >-
    A conditional knockout restricting Ndufs2 loss to the brain, which is what
    makes it viable to birth at all, since global deletion is embryonic lethal.
    Its most informative arm is the rescue: expressing the yeast alternative
    NADH dehydrogenase NDI1, which oxidises NADH without complex I and without
    pumping protons, extends lifespan in these animals.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete loss of Ndufs2 in the brain produces perinatal mortality,
      reproducing the severity of the human neonatal presentation, and the NDI1
      rescue localises the lethal defect specifically to loss of mitochondrial
      NADH oxidation rather than to some other function of the subunit.
    limitations: >-
      A brain-restricted complete knockout is neither the tissue distribution
      nor the allele type of human disease, in which every tissue carries
      biallelic missense variants with residual function. The model therefore
      speaks to the consequence of losing NADH oxidation in the brain, not to
      the multisystem course or to genotype-phenotype relationships.
    readouts:
    - name: Survival of brain-specific knockout, with and without NDI1
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: RESTORED
      interpretation: >-
        Perinatal mortality without NDI1; lifespan increased when the yeast
        alternative NADH dehydrogenase is expressed.
      evidence:
      - reference: PMID:35338200
        reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Similar to our previous results with Ndufs4 deficient mice, the yeast
          alternative NADH dehydrogenase was capable of increasing lifespan in
          mice with Ndufs2 deficiency in the brain.
        explanation: >-
          Reports the rescue, which is what identifies loss of NADH oxidation as
          the lethal defect.
    evidence:
    - reference: PMID:35338200
      reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        As expected, complete loss of Ndufs2 specifically in the brain was
        associated with perinatal mortality (Fig. 2).
      explanation: >-
        Establishes the severity of complete Ndufs2 loss in the tissue that
        fails in patients.
  notes: >-
    An earlier study cited by this one reports that Ndufs2 deficiency restricted
    to neural progenitor cells causes mortality by about ten days after birth,
    which is not curated here as a separate model because the primary report was
    not consulted.

treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    There is no disease-modifying therapy and no NDUFS2-directed treatment.
    Management is supportive and follows the organ involvement: seizure control,
    nutritional and feeding support, cardiac and hepatic monitoring, and
    developmental therapies. Nothing in this is specific to NDUFS2 and none of
    it has been evaluated in this disorder.

    Two preclinical leads exist and are deliberately not curated as treatments,
    because neither has been given to a patient with this disorder. Idebenone
    partially restored growth, ATP and oxygen consumption in the NDUFS2 knockout
    cell line, and folic acid rescued the growth defect and hepatomegaly in the
    ndufs2 knockout zebrafish. Both are curated as model readouts on the
    experimental_models and animal_models entries, which is where a finding
    obtained in a model belongs until it has been tested in a person.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33744462
    reference_title: "Complex I protein NDUFS2 is vital for growth, ROS generation, membrane integrity, apoptosis, and mitochondrial energetics."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Treatment with idebenone, a clinical benzoquinone currently being
      investigated in other indications, partially restored growth, ATP pool,
      and oxygen consumption of the mutant.
    explanation: >-
      Cited here to substantiate why this entry curates supportive care and
      nothing disease-directed, not to support supportive care itself. The
      strongest therapeutic signal that exists for this gene was obtained in a
      cell line, which is the reason there is no disease-directed treatment to
      curate. The same result is recorded where it belongs mechanistically, as
      a RESTORED readout on the knockout cell line under experimental_models.
  notes: >-
    No therapeutic_agent and no target_mechanisms are bound. Binding either
    would assert a therapy this disorder does not have.

diagnosis:
- name: Respiratory Chain Enzymology Showing Isolated Complex I Deficiency
  description: >-
    The biochemical entry point, and historically what selected patients for
    nuclear complex I gene analysis at all. Isolated complex I deficiency is the
    commonest oxidative phosphorylation disorder of infancy and childhood, so the
    finding narrows the differential to a genetically heterogeneous group rather
    than to a gene.
  evidence:
  - reference: PMID:15576045
    reference_title: "Clinical and molecular findings in children with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated complex I deficiency, the most frequent OXPHOS disorder in
      infants and children, is genetically heterogeneous.
    explanation: >-
      States what the enzymatic finding does and does not narrow down.
  - reference: PMID:11220739
    reference_title: "Mutations in the complex I NDUFS2 gene of patients with cardiomyopathy and encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nuclear gene coding for this protein is therefore an important
      candidate for mutational detection studies in enzymatic complex I
      deficient patients.
    explanation: >-
      Records that enzymatic complex I deficiency is the selection criterion for
      nuclear gene analysis.

- name: Sequencing of Nuclear Complex I Genes
  description: >-
    Molecular diagnosis. The practical difficulty is the size of the candidate
    set: complex I has 45 subunits plus assembly factors, and in the cohort that
    first surveyed the genetics systematically only 35 percent of complex
    I-deficient children reached a genetic diagnosis even after analysing the
    entire mitochondrial genome and eleven nuclear subunit genes. Modern
    exome or genome sequencing removes the candidate-gene bottleneck, and
    NDUFS2 appears in contemporary Leigh syndrome cohorts sequenced that way.
  evidence:
  - reference: PMID:15576045
    reference_title: "Clinical and molecular findings in children with complex I deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed the entire mtDNA and 11 nuclear encoded complex I subunits in
      23 isolated complex I-deficient children
    explanation: >-
      The candidate-gene approach and its scope, in the cohort that reached a
      diagnosis in only a third of patients.
  - reference: PMID:36675121
    reference_title: "Leigh Syndrome: Spectrum of Molecular Defects and Clinical Features in Russia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using massive parallel sequencing we were able to detect pathogenic
      variants in other 16 LS nuclear genes: NDUFV1, NDUFS2, NDUFS8, NDUFAF5,
      NDUFAF6, NDUFA10, SUCLG1, GFM2, COX10, PMPCB, NARS2, PDHB, SLC19A3 and
      IARS2
    explanation: >-
      Shows the modern sequencing approach identifying NDUFS2 among a broad
      nuclear gene set.

- name: Liver Histopathology and Electron Microscopy
  description: >-
    Not a test for this disorder specifically, but a route into the diagnosis
    when a neonate dies before genetic testing returns. Hepatocyte
    hypereosinophilia with microvesicular steatosis, together with mitochondrial
    hyperplasia on electron microscopy, supported a mitochondriopathy in one
    infant whose biallelic NDUFS2 variants were confirmed afterwards. The point
    the reporting authors make is about timing: the morphology was available
    before the genotype.
  evidence:
  - reference: PMID:31411514
    reference_title: "Liver Pathology in Mitochondrial Complex I Deficiency from Bi-Allelic Mutations in NDUFS2: A Report of Findings at Autopsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Morphologic attributes can assist in diagnosis of mitochondriopathies
      before specific genetic testing results are available.
    explanation: >-
      The diagnostic claim, in the report of an NDUFS2 patient.
  - reference: PMID:31411514
    reference_title: "Liver Pathology in Mitochondrial Complex I Deficiency from Bi-Allelic Mutations in NDUFS2: A Report of Findings at Autopsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case also highlights that diagnostic information can be gained from
      ultrastructural examination of postmortem liver tissue.
    explanation: >-
      Extends the claim specifically to postmortem ultrastructural examination.

discussions:
- discussion_id: mc1dn6_catalytic_versus_assembly_lesion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    For a given NDUFS2 allele, does the enzyme fail because it cannot assemble
    or because the assembled enzyme cannot reduce ubiquinone, and does the
    answer predict anything clinically?
  attaches_to:
  - "pathophysiology#Loss of the N2 Iron-Sulfur Cluster and Quinone Reduction"
  - "pathophysiology#Complex I Assembly Disruption"
  - "pathophysiology#NDUFS2 Loss of Function"
  rationale: >-
    Two routes from an NDUFS2 variant to complex I failure are separately
    documented, and they are not the same kind of defect. The catalytic route is
    the more precisely characterised: substituting a conserved arginine near the
    N2 cluster abolishes quinone-reductase activity and removes the cluster from
    an enzyme that cryo-electron microscopy shows to be otherwise intact. The
    assembly route comes from mapping human variants onto subunit interfaces and
    reproducing them in a bacterial enzyme, where assembly assays showed
    disruption.

    The two make opposite predictions about what a diagnostic assay would find.
    A purely catalytic lesion leaves complex I present in normal amount and
    non-functional, so blue native gel electrophoresis or subunit western
    blotting would look normal while enzymology is abnormal. An assembly lesion
    reduces the amount of enzyme, so both would be abnormal.

    The distinction has already been drawn for individual alleles, and the
    answer differs between them. In the bacterial model, R228Q showed a severe
    assembly defect while R138Q and Y141C retained greatly diminished activity
    even when assembled normally. In patient material, the fibroblasts of the
    R138Q/R333Q compound heterozygote had complex I activity low and assembly at
    about 50 percent of normal, so that patient had both. What is missing is not
    the concept but the series: no study has measured amount and activity
    together across the reported NDUFS2 alleles in patient material under one
    protocol, and the two existing sources use different systems and different
    alleles.

    Two caveats bound the available evidence. The per-allele assembly results
    were generated in a homologous bacterial enzyme rather than the human
    complex, so the human consequence is inferred from an analogous system. And
    the catalytic evidence from structural work has a different limit: the
    arginine studied, R121, is a conserved residue investigated for its
    post-translational methylation rather than a reported patient allele, so it
    demonstrates what the region does without being a disease variant itself.
  proposed_experiments:
  - experiment_id: mc1dn6_amount_versus_activity_series
    name: Complex I amount and activity measured together across an NDUFS2 allelic series
    description: >-
      In fibroblasts or knock-in cells carrying each reported NDUFS2 allele,
      measure assembled complex I by blue native electrophoresis alongside
      enzymatic activity, and compute the activity-to-amount ratio. A ratio
      below one identifies a catalytic lesion, a reduced amount identifies an
      assembly lesion, and the two can coexist. This is the single experiment
      that would separate the arms, and the same design was used to make exactly
      this distinction for the neighbouring subunit NDUFS8.
  - experiment_id: mc1dn6_patient_allele_cryoem
    name: Structural analysis of a reported patient allele rather than a probe substitution
    description: >-
      Reproduce the cryo-electron microscopy analysis using an actual reported
      NDUFS2 patient variant rather than the R121 probe substitution, to
      establish whether patient alleles produce the same loss of the N2 cluster
      or a different structural consequence.
  evidence:
  - reference: PMID:33640456
    reference_title: "A conserved arginine residue is critical for stabilizing the N2 FeS cluster in mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the cryo-EM structure of NDUFS2-R121M complex I at 3.7 Å
      resolution identified the absence of the cubane N2 cluster as the cause of
      the dysfunction, within an otherwise intact enzyme.
    explanation: >-
      Establishes that a catalytic lesion in this subunit can leave the enzyme
      structurally intact, which is what makes the two arms distinguishable in
      principle.
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Some mutants were also analyzed using recently developed assays of
      assembly, time-delayed expression, and co-immunoprecipitation, which
      showed that assembly was disrupted.
    explanation: >-
      Establishes the assembly arm, in the bacterial model system that is also
      its limitation.
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      With compound heterozygotes, we determined which mutation was more
      deleterious.
    explanation: >-
      Shows the bacterial system can rank alleles by severity, which is the
      closest existing approach to the allelic-series experiment proposed here.
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Her fibroblasts showed an increased level of oxidative stress, Complex I
      activity was low, and assembly appeared to be about 50% of normal.
    explanation: >-
      The one patient in whom amount and activity were both measured, showing
      the two lesions can coexist in one individual. It is a single patient and
      a single genotype, which is why the gap is about the series rather than
      about the concept.

- discussion_id: mc1dn6_ndufs4_model_substitution
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Most mouse work on complex I deficiency and Leigh syndrome uses Ndufs4, an
    accessory subunit. Does that model speak to a core catalytic subunit defect
    like this one, and what is lost in the substitution?
  attaches_to:
  - "pathophysiology#NDUFS2 Loss of Function"
  - "pathophysiology#Loss of the N2 Iron-Sulfur Cluster and Quinone Reduction"
  - "pathophysiology#Complex I Assembly Disruption"
  rationale: >-
    Anyone reading the mouse literature on complex I deficiency will mostly be
    reading about Ndufs4, which is the standard model for Leigh syndrome and
    which has been characterised in far more detail than Ndufs2. The two genes
    are not interchangeable, and the difference is exactly the distinction this
    entry's two mechanistic nodes turn on. Ndufs2 is a core catalytic subunit
    that forms a substantial part of the ubiquinone-binding site and is
    essential for enzymatic activity. Ndufs4 is an 18 kDa accessory subunit that
    does not participate in electron transfer at all and is instead thought to
    act as an assembly factor contributing to the stability of the assembled
    complex.

    The severity difference follows from that and is stark: global deletion of
    Ndufs2 is embryonic lethal, whereas global loss of Ndufs4 is compatible with
    about two months of life in most models. A therapeutic tested successfully
    in Ndufs4 mice has been tested against an assembly and stability defect with
    a partially functional enzyme, not against an enzyme that cannot reduce
    ubiquinone.

    There is one point of genuine convergence worth recording, because it
    suggests where a shared therapeutic strategy might survive the substitution.
    Expressing the yeast alternative NADH dehydrogenase NDI1, which oxidises
    NADH independently of complex I, extended lifespan in brain-specific Ndufs2
    knockouts just as it had in Ndufs4 mice. That is a result about restoring
    NADH oxidation, which both defects lose, rather than about repairing either
    protein.

    What is missing is a mouse model of the actual human genotype. Every Ndufs2
    mouse described here is either a heterozygous deletion, which produces no
    phenotype, or a complete knockout, which is lethal. Human patients carry
    biallelic missense alleles with residual function, and no model occupies
    that middle ground.
  proposed_experiments:
  - experiment_id: mc1dn6_knockin_missense_mouse
    name: Knock-in mouse carrying a reported human NDUFS2 missense allele
    description: >-
      Generate a mouse carrying an actual patient allele rather than a deletion,
      to obtain the partial loss of function that human disease consists of.
      This is the model that neither the heterozygous deletion nor the complete
      knockout provides, and without it the mouse literature can only bracket
      the disease rather than model it.
  - experiment_id: mc1dn6_ndufs4_therapeutic_replication
    name: Replication of Ndufs4-validated therapeutics in an Ndufs2 model
    description: >-
      Test the interventions that showed benefit in Ndufs4 mice against an
      Ndufs2 model of comparable severity, and report which transfer. The NDI1
      result suggests that interventions acting on NADH oxidation should
      transfer while interventions acting on complex I assembly or stability
      should not, and that prediction is directly testable.
  evidence:
  - reference: PMID:35338200
    reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most studies on the effect of genetic alteration of complex I in mice have
      used mutation or deletion of the accessory subunit gene Ndufs4 which is
      associated with phenotypes resembling human mitochondrial diseases such as
      Leigh syndrome and Leber Hereditary Optic Neuropathy
    explanation: >-
      Establishes that the mouse literature on this disease class is
      predominantly about a different gene.
  - reference: PMID:35338200
    reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By contrast, NADH:ubiquinone oxidoreductase subunit S4 (Ndufs4) encodes an
      18 kDa accessory subunit of complex I that does not directly participate
      in electron transfer.
    explanation: >-
      States the functional difference between the modelled subunit and the one
      this disease affects.
  - reference: PMID:35338200
    reference_title: "Reduced expression of mitochondrial complex I subunit Ndufs2 does not impact healthspan in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Global deletion of Ndufs2 is embryonic lethal while global loss of Ndufs4
      in most models is associated with viability for approximately 2 months of
      age
    explanation: >-
      Quantifies the severity difference between the two genes in mouse, which
      is what makes the substitution consequential.

notes: >-
  Relationship to the sibling entries. Mitochondrial Complex I Deficiency,
  Nuclear Type 2 covers NDUFS8, the neighbouring core subunit, and the two
  entries should be read together but not merged: the same paper that maps
  interface variants in both was the source for the assembly arm here. One
  detail deserves care from any curator editing both. The NDUFS8 entry records
  that its subunit's two 4Fe4S ferredoxin consensus patterns "have long been
  thought to provide the binding site for the iron-sulfur cluster N-2", quoting a
  1998 paper. Current structural work places the N2 cluster in NDUFS2, and that
  is what is curated here. These are not contradictory claims about the same
  evidence; they are a 1998 hypothesis and a 2021 structure, and both are
  reported as what their sources say.

  Deep research: just research-disorder falcon. The report's own
  reference_validation block reported 2/2 references verified, 0 not found, 2/2
  on topic. NEC preflight returned PASS with NDUFS2 mentioned 81 times against
  the nearest rival gene at 4. The report was used as a lead only; every snippet
  here was taken from a references_cache file. Two of its suggestions were
  checked and acted on: the Ndufs4-versus-Ndufs2 model-substitution caveat,
  which is now a HUMAN_MODEL_MISMATCH discussion with quoted evidence, and the
  Leigh-spectrum clinical trials it listed, which are recorded below as not
  curated. One of its ontology suggestions was rejected: it proposed HP:0000007
  for a Leigh syndrome phenotype and then flagged its own error in the same
  cell, which is a useful reminder that a report's ontology column is a draft
  rather than a lookup.

  Clinical trials are not curated. The report names four Leigh-spectrum trials
  (vatiquinone, sirolimus, elamipretide, TTI-0102). All enrolled on the basis of
  Leigh syndrome or genetically confirmed Leigh spectrum, not on NDUFS2
  genotype, so recording them under this entry would attach trial evidence to a
  gene none of them selected for.

  Not curated here, and why. No prevalence record: NDUFS2 is one of many genes
  causing childhood complex I deficiency and no source gives its share or a
  population rate. No treatments section: there is no disease-modifying therapy,
  and the two preclinical leads are curated as model readouts rather than as
  treatments, because neither idebenone nor folic acid has been tested in a
  patient with this disorder. Idebenone partially restored growth, ATP and
  oxygen consumption in the knockout cell line, and folic acid rescued the
  growth defect and hepatomegaly in the knockout zebrafish; promoting either to
  a treatment entry would assert a therapy that does not exist. No environmental
  section.

  Where the N2 cluster sits, and why the sources look like they disagree. The
  abstract of PMID:33640456 says the cluster is "located in the NDUFS2/NUCM
  subunit", while PMID:36462614 says the equivalent region contains no
  iron-sulfur clusters and refers to "the N2 FeS cluster of NDUFS7". The body of
  the first paper resolves this rather than leaving it open: N2 sits at the
  interface of NDUFS2 and NDUFS7, is ligated by four cysteines in NDUFS7, and
  lies about 12 angstroms above the quinone-binding site, with NDUFS2 residues
  forming its second coordination sphere. The abstract's phrasing is shorthand
  for an interface position, and the two papers are consistent once the body is
  read. This entry states the interface account, which is also what makes the
  mechanism coherent: an NDUFS2 residue can abolish a cluster that NDUFS2 does
  not hold, because it acts through the second coordination sphere. Curators
  citing only the abstract of PMID:33640456 will reach the looser statement.

  GeneReviews. The Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview
  (PMID:26425749) is the relevant chapter and the GeneReviews tag is
  deliberately kept. The decision: the tag records that the chapter is the
  correct GeneReviews source for this disease class, which is useful to the next
  curator. It does not claim that a phenotype baseline was performed, and the
  reason it could not be is stated here: the cached PubMed record contains only
  the chapter's purpose statement and names neither NDUFS2 nor any clinical
  characteristic. Dropping the tag would lose the pointer without gaining
  accuracy. A curator with access to the full chapter should cross-check the
  phenotype list against its Clinical Characteristics section.

  Frequency bands. Every phenotype here carries no frequency. The reason is
  uniform: the human literature on NDUFS2 consists of a founding report of three
  families that does not describe their phenotypes in the abstract, single case
  reports, and cohort papers about complex I deficiency as a class rather than
  about this gene. There is no denominator to band against, and inventing one
  from class-level statements would attribute to NDUFS2 a frequency measured
  across a genetically heterogeneous group.

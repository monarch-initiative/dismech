  biological_scale: ORGANISM
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    The systemic expression of the block. Lactic acidosis is one of the three
    features that define the fatal neonatal presentation of mitochondrial
    disease, alongside neuromuscular dysfunction and hepatic failure. In the
    zebrafish knockout the same metabolic picture appears with an addition worth
    noting: one-carbon metabolism is dysregulated, and the same signature was
    seen in a missense ndufs2 mutant nematode and in two human complex
    I-deficient fibroblast lines stressed in galactose, so it is not an artefact
    of one species.

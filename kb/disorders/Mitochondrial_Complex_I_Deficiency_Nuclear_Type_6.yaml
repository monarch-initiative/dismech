      reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Membrane vesicles were prepared and rates of deamino-NADH oxidase
        activity measured, which indicated a range of reduced activity.
      explanation: >-
        Links the interface variants to a measured reduction in enzyme activity.

- name: Isolated Complex I Deficiency and Bioenergetic Failure
  biological_scale: CELLULAR
  role: intermediate
  mechanism_confidence: ESTABLISHED
  description: >-
    The cellular endpoint, and it is not only an energy deficit. A CRISPR
    knockout of NDUFS2 in human embryonic kidney cells reduces growth,
    complex I-specific respiration, glycolytic capacity, ATP pool and membrane
    integrity, while increasing reactive oxygen species production, apoptosis
    and necrosis. Complex II respiration rises, which is the expected
    compensatory shift when the complex I entry point to the chain is blocked
    and complex II is intact.

    In an ndufs2 knockout zebrafish, complex I enzyme activity falls by 80
    percent and unbiased metabolomics shows raised lactate, raised tricarboxylic
    acid cycle intermediates and raised acylcarnitines, so the block propagates
    into fatty acid oxidation and the cycle as well as into oxidative
    phosphorylation.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED

pathophysiology:
- name: NDUFS2 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFS2 encodes the 49 kDa subunit, one of the fourteen core subunits
    required for catalysis rather than one of the accessory subunits. It is a
    peripheral-arm subunit sitting at the interface between the membrane and
    matrix arms of the enzyme, the region that binds ubiquinone and that is also
    where complex I inhibitors bind.

    The reported disease alleles are missense changes at conserved residues.
    The original report found three, in three families, identified by sequencing
    NDUFS2 complementary DNA in enzymatically complex I-deficient patients. Later
    reports include compound heterozygous and homozygous alleles, and at least
    one patient carried heterozygous changes in both NDUFA8 and NDUFS2, which the
    reporting authors flagged as raising the possibility of unconventional
    inheritance in complex I defects rather than as an established digenic
    mechanism.
  genes:
  - preferred_term: NDUFS2
    term:
      id: hgnc:7708
      label: NDUFS2
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Biallelic germline missense variants at conserved residues, homozygous in
      consanguineous families and compound heterozygous otherwise.
  evidence:
  - reference: PMID:11220739
    reference_title: "Mutations in the complex I NDUFS2 gene of patients with cardiomyopathy and encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening of patient NDUFS2 cDNA by reverse transcriptase-polymerase chain
      reaction (RT-PCR) in combination with direct DNA sequencing revealed three
      missense mutations resulting in the substitution of conserved amino acids
      in three families.
    explanation: >-
      The founding observation: three missense alleles at conserved residues in
      three families.
  - reference: PMID:33744462
    reference_title: "Complex I protein NDUFS2 is vital for growth, ROS generation, membrane integrity, apoptosis, and mitochondrial energetics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The interfacial region between these two arms is known to be critical for
      binding of ubiquinone moieties and has also been shown to be the binding
      site of Complex I inhibitors.
    explanation: >-
      Establishes the functional significance of the region NDUFS2 occupies.
  - reference: PMID:35338200

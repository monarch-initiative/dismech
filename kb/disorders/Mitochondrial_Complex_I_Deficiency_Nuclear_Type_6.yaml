progression:
- phase: Neonatal and infantile presentation
  notes: >-
    The most severe end of the range presents in the newborn period and can be
    fatal, with the triad of neuromuscular dysfunction, lactic acidosis and
    hepatic failure. The one NDUFS2 patient described in detail at autopsy was an
    infant who died with a diagnostic suspicion of mitochondrial disease that the
    liver morphology supported before genetic testing returned. Early death is
    recorded as one of the recognised outcomes of nuclear complex I subunit
    variants generally.

    No age-of-death phenotype term is curated for this outcome. HPO places
    Neonatal death and Death in infancy under Age of death, which falls outside
    the PhenotypeTerm dynamic enum this schema uses, so early death is recorded
    here as a progression phase rather than as a phenotype.

      explanation: >-
        States the structural rationale for the assembly arm, in the study that
        went on to test it.

- name: Loss of the N2 Iron-Sulfur Cluster and Quinone Reduction
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The catalytic arm of the lesion, and the more precisely characterised of the
    two. N2 is the last iron-sulfur cluster in the electron relay and the one
    that reduces ubiquinone. It sits at the NDUFS2-NDUFS7 interface, ligated by
    four cysteines in NDUFS7 and positioned about 12 angstroms above the
    quinone-binding site, with NDUFS2 residues forming its second coordination
    sphere. NDUFS2 therefore controls the cluster without holding it, which is
    what makes an NDUFS2 defect able to remove it. A conserved arginine near the
    cluster, which is
    post-translationally dimethylated, turns out to be required for the cluster
    to form or to remain stable: substituting it abolishes quinone-reductase
    activity, the N2 signature disappears from the electron paramagnetic
    resonance spectrum, and cryo-electron microscopy shows the cubane cluster
    simply absent from an otherwise intact enzyme. The same substitution also
    disorders nearby elements of the quinone-binding site.

    That last point is what makes this node worth separating from the assembly
    node. An enzyme can be fully assembled, structurally intact and completely
    non-functional, so a normal complex I amount says nothing about whether the
    enzyme works.
  molecular_functions:
  - preferred_term: 4 iron, 4 sulfur cluster binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
  evidence:
  - reference: PMID:33640456
    reference_title: "A conserved arginine residue is critical for stabilizing the N2 FeS cluster in mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that mutations of this arginine residue (R121M/K) abolish
      the quinone-reductase activity, concomitant with disappearance of the N2
      signature from the electron paramagnetic resonance (EPR) spectrum.
    explanation: >-
      Demonstrates that a single conserved residue in this subunit controls both
      the presence of the cluster and the enzyme's catalytic output.
  - reference: PMID:33640456
    reference_title: "A conserved arginine residue is critical for stabilizing the N2 FeS cluster in mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the cryo-EM structure of NDUFS2-R121M complex I at 3.7 Å
      resolution identified the absence of the cubane N2 cluster as the cause of
      the dysfunction, within an otherwise intact enzyme.
    explanation: >-
      The structural demonstration that catalysis can fail while the enzyme
      remains assembled, which is why this node is separate from the assembly
      node.
  - reference: PMID:33640456
    reference_title: "A conserved arginine residue is critical for stabilizing the N2 FeS cluster in mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation further induced localized disorder in nearby elements of the
      quinone-binding site, consistent with the close connections between the
      cluster and substrate-binding regions.
    explanation: >-
      Shows the lesion extends from the cluster into the substrate-binding site,
      compounding the catalytic defect.
  - reference: PMID:33640456
    reference_title: "A conserved arginine residue is critical for stabilizing the N2 FeS cluster in mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      referred to as cluster N2 that is located at the interface of the NDUFS2
      (NUCM) and NDUFS7 (NUKM) subunits
    explanation: >-
      Places the cluster at the interface between the two subunits, which is the
      structural fact behind this node.
  - reference: PMID:33640456
    reference_title: "A conserved arginine residue is critical for stabilizing the N2 FeS cluster in mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cluster N2 is positioned ∼12 Å above the quinone-binding site and ligated
      by four cysteine residues in NDUFS7
    explanation: >-
      Establishes that the cluster's direct ligands are in NDUFS7, not NDUFS2.
      This is what makes the NDUFS2 contribution a second-coordination-sphere
      effect and explains how an NDUFS2 residue can abolish a cluster it does
      not hold.
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      They contain no FeS clusters, but NDUFS2 forms part of the ubiquinone
      binding site.
    explanation: >-
      Consistent with the interface reading rather than in conflict with it:
      the NDUFS2 region holds no cluster of its own, and NDUFS2's contribution
      is the quinone-binding site plus the second coordination sphere of a
      cluster ligated by NDUFS7.
  downstream:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    causal_link_type: DIRECT
    description: >-
      An enzyme that cannot reduce ubiquinone cannot support electron transport

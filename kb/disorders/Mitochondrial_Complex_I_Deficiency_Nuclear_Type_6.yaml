genetic:
- name: NDUFS2
  notes: >-
    NDUFS2 encodes the 49 kDa core subunit of complex I, one of the fourteen
    subunits required for catalysis. Reported disease alleles are missense
    changes at conserved residues; the founding report described three, in three
    families. Because complex I has 45 subunits and at least eight nuclear-encoded
    ones were already implicated by 2004, NDUFS2 accounts for a small share of
    childhood complex I deficiency, and in the cohort that first surveyed the
    genetics only 35 percent of patients reached a genetic diagnosis at all.

    One reported patient carried heterozygous changes in both NDUFA8 and NDUFS2.
    The reporting authors raised that as a possible unconventional pattern of
    inheritance rather than as a demonstrated digenic mechanism, and it is
    recorded here the same way.
  gene_term:
    preferred_term: NDUFS2
    term:
      id: hgnc:7708
      label: NDUFS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:

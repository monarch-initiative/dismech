- name: Autosomal recessive inheritance
  description: >-
    Biallelic NDUFS2 variants. The recessive mode was inferred before the gene
    was found: the patient group in which NDUFS2 was first screened was
    characterised by a high rate of consanguinity, an apparent autosomal
    recessive pattern, and the absence of the common mitochondrial DNA
    mutations, which is what made a nuclear gene the right place to look.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

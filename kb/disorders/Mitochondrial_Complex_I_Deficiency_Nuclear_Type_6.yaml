- name: Complex I Assembly Disruption
  biological_scale: MOLECULAR
  role: intermediate
  mechanism_confidence: PROVISIONAL
  description: >-
    The second, structural arm. Complex I has 45 subunits, seven encoded in
    mitochondrial DNA and 38 imported, and many of the disease variants reported
    across its peripheral core subunits fall at subunit interfaces. Modelling
    seventeen human variant positions as thirty-one mutants in the homologous
    Escherichia coli enzyme produced a range of reduced activity, and assembly
    assays, time-delayed expression and co-immunoprecipitation showed that
    assembly was disrupted.

    The per-allele results are what make this node useful rather than generic,
    and they split the NDUFS2 alleles in two. Modelled R228Q showed a severe
    assembly defect: NuoCD and NuoI were no longer co-immunoprecipitated with
    NuoG. Modelled R138Q and Y141C did the opposite, retaining greatly
    diminished activity even when assembled normally. So the same subunit
    produces assembly lesions and catalytic lesions depending on which residue
    is hit, and the two arms of this entry are allele-dependent rather than
    competing accounts of one lesion.

    What keeps this PROVISIONAL is the system rather than the specificity. The
    work was done in a homologous bacterial enzyme, with human residues mapped
    onto their E. coli equivalents, so the assembly pathway is analogous rather
    than identical and the human consequence is inferred.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  protein_complexes:

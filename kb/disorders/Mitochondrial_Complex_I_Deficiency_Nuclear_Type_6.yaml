name: Mitochondrial Complex I Deficiency, Nuclear Type 6
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Mitochondrial complex I deficiency, nuclear type 6 is an autosomal recessive
  mitochondrial disease caused by biallelic variants in NDUFS2, which encodes
  the 49 kDa core subunit of respiratory chain complex I. It was one of the
  first nuclear-encoded complex I subunit defects described, found in 2001 by
  reasoning that a group of complex I-deficient patients with high consanguinity
  and no common mitochondrial DNA mutation had to have a nuclear cause.

  What makes NDUFS2 a load-bearing subunit is where it sits. Complex I oxidizes
  NADH and passes electrons down a chain of iron-sulfur clusters to ubiquinone.
  The last cluster in that chain, N2, is the one that hands electrons directly
  to ubiquinone, and it sits at the interface between NDUFS2 and NDUFS7: its
  four cysteine ligands are in NDUFS7, while NDUFS2 supplies its second
  coordination sphere. That is why an NDUFS2 defect can abolish the cluster
  without NDUFS2 holding it. NDUFS2 also forms part of the quinone-binding site,
  about 12 angstroms below N2, at the interface between the membrane arm and the
  peripheral arm of the enzyme. Losing it therefore threatens the enzyme in two
  distinct ways, and the literature supports both. A conserved arginine near the
  N2 cluster is required for the cluster to form or remain stable; mutating it
  abolishes quinone-reductase activity while leaving the rest of the enzyme
  structurally intact, so the lesion can be purely catalytic. Separately, many
  disease variants across NDUFS2 and its neighbouring core subunits map to
  subunit interfaces, and modelling them in a bacterial enzyme shows they
  disrupt assembly. Which of the two a given allele produces is not predictable
  from the clinical picture.

  The clinical range is wide and none of it is mild. The original families
  presented with cardiomyopathy and encephalomyopathy; the entity now also
  covers Leigh syndrome, progressive leukoencephalopathy, and neonatal
  presentations that are fatal with lactic acidosis and hepatic failure. Liver
  involvement is real rather than incidental: a postmortem examination of an
  infant showed hepatocyte hypereosinophilia with microvesicular steatosis and
  mitochondrial hyperplasia, and the authors make the point that the morphology
  was diagnostic before the genetic result returned. Biallelic NDUFS2 variants
  have also been reported to cause an optic neuropathy resembling Leber
  hereditary optic neuropathy, which places this gene in a second disease
  neighbourhood.

  There is no disease-modifying therapy. Two lines of preclinical work are worth
  knowing about because they point in different directions. Idebenone, which
  bypasses complex I by donating electrons to complex III, partially restored
  growth, ATP and oxygen consumption in an NDUFS2 knockout cell line. And in an
  ndufs2 knockout zebrafish, transcriptomics and metabolomics implicated
  one-carbon metabolism, and folic acid rescued the growth defect and the
  hepatomegaly. Neither has been tested in patients.

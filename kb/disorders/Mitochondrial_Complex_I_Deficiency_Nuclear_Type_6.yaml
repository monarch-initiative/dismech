      label: NADH dehydrogenase complex
  evidence:
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Some mutants were also analyzed using recently developed assays of
      assembly, time-delayed expression, and co-immunoprecipitation, which
      showed that assembly was disrupted.
    explanation: >-
      The direct test of the assembly hypothesis, in the bacterial model system.
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This indicates the possibility of a severe assembly defect with NDUFS2_
      R228Q under normal expression in humans. In addition, E. coli modeled
      NDUFS2_ R138Q and Y141C appear to have greatly diminished activity, even
      when assembled normally.
    explanation: >-
      The per-allele result that separates the two arms: R228Q is an assembly
      lesion, R138Q and Y141C are catalytic lesions in a normally assembled
      enzyme.
  - reference: PMID:36462614
    reference_title: "Analysis of compound heterozygous and homozygous mutations found in peripheral subunits of human respiratory Complex I, NDUFS1, NDUFS2, NDUFS8 and NDUFV1, by modeling in the E. coli enzyme."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The mutations were constructed in the homologous E. coli genes, nuoG,
      nuoCD, nuoI and nuoF, respectively, and expressed from a plasmid
      containing all Complex I genes.
    explanation: >-
      The reason this node is PROVISIONAL: the assembly evidence comes from a
      homologous bacterial enzyme rather than from the human complex.
  downstream:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    causal_link_type: DIRECT
    description: >-
      An enzyme that does not assemble cannot function, independently of whether
      its catalytic centre is intact.
    evidence:

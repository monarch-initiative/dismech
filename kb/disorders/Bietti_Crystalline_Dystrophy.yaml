discussions:
- discussion_id: bcd_ferroptosis_versus_er_stress_dominance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are ER stress and ferroptosis two independent routes from PUFA overload to
    RPE death in Bietti crystalline dystrophy, or two readouts of one process,
    and which should a non-gene-therapy intervention target?
  attaches_to:
  - "pathophysiology#ER Stress and Mitochondrial Dysfunction"
  - "pathophysiology#Iron-Dependent Lipid Peroxidation and Ferroptosis"
  rationale: >-
    Both arms are supported by rescue experiments in CYP4V2-deficient RPE -
    IRE1-alpha inhibition restores mitochondrial potential and ATP, iron
    chelation suppresses ferroptosis and restores retinal function in vivo - and
    both converge on mitochondrial dysfunction and oxidative stress, so the
    experiments as performed cannot distinguish two parallel routes from one
    route measured two ways. This matters because the arms imply different
    drugs. If they are sequential, only the upstream one is worth targeting; if
    parallel, blocking one leaves the other running, and the single-agent
    rescues reported so far would be hard to explain.
  proposed_experiments:
  - experiment_id: bcd_combined_ire1_iron_epistasis
    name: Epistasis between IRE1-alpha inhibition and iron chelation in CYP4V2-null RPE
    description: >
      Apply IRE1-alpha inhibition and deferiprone alone and in combination to
      CYP4V2-knockout RPE under matched PUFA load, measuring lipid peroxidation,
      ERO1-L-alpha induction, mitochondrial membrane potential and viability. A
      non-additive combination indicates one pathway; additive or synergistic
      rescue indicates two, and identifies which single agent leaves more
      residual death.

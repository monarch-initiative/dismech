genetic:
- name: CYP4V2
  association: Biallelic loss-of-function variants
  notes: >
    CYP4V2 encodes a cytochrome P450 fatty acid omega-hydroxylase. The East
    Asian mutational spectrum is dominated by the founder splice-region allele
    c.802-8_810del17insGC, which accounts for 55.7% of disease alleles in a
    Chinese cohort. Genotype affects timing rather than presence of disease:
    compound heterozygotes for the founder allele plus a truncating variant lose
    acuity earlier than founder homozygotes.
  gene_term:
    preferred_term: CYP4V2
    term:
      id: hgnc:23198
      label: CYP4V2
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:37584790
    reference_title: "Clinical and genetic characterization of a large cohort of Chinese patients with Bietti crystalline retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular screening detected biallelic CYP4V2 pathogenic variants in 98.3% (172/175) of the families, including 19 novel ones."
    explanation: >
      Establishes CYP4V2 as effectively the sole disease gene, with a diagnostic
      yield near 100% in a large cohort.
treatments:
- name: Iron Chelation (Deferiprone, Preclinical)
  description: >
    Iron chelation targets the ferroptosis arm rather than the enzyme defect.
    Deferiprone suppressed the ferroptotic phenotype in CYP4V2-mutant RPE and,
    given orally, restored retinal function and morphology in Cyp4v3-null mice.
    This is preclinical only - there is no clinical therapy for Bietti
    crystalline dystrophy - but it is recorded because it is a mechanism-directed
    intervention with in vivo rescue, and because it acts on a node distinct
    from the one gene replacement acts on.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deferiprone
      term:
        id: CHEBI:68554
        label: deferiprone
  target_mechanisms:
  - target: Iron-Dependent Lipid Peroxidation and Ferroptosis
    treatment_effect: INHIBITS
    description: >
      Chelating ferrous iron removes the catalyst of lipid peroxidation, acting
      on the ferroptosis arm specifically and leaving the upstream PUFA
      accumulation untouched.
    evidence:
    - reference: PMID:38992691
      reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "DFP, an iron chelator administration suppressed ferroptosis phenotype in CYP4V2 mutated RPE. Oral administration of DFP also restored the retinal function and morphology in Cyp4v3 KO mice."
      explanation: >
        Demonstrates target engagement in vitro and functional and structural
        rescue in vivo, establishing this node as a druggable target.
  evidence:
  - reference: PMID:38992691
    reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Currently, there is no clinical therapy approach available for BCD patients."
    explanation: >
      States plainly that no clinical therapy exists. Marked PARTIAL because
      this treatment is supported only by preclinical rescue, not by human data.
- name: rAAV-CYP4V2 Gene Replacement (Preclinical)
  description: >
    Recombinant AAV delivery of human CYP4V2 to restore omega-hydroxylase
    activity in the retinal pigment epithelium. Product-development work has
    established a quantitative LC-MS/MS potency assay measuring the enzyme's
    conversion of lauric acid to 12-hydroxylauric acid across AAV2, AAV8 and
    AAV2/8 serotypes - which is the kind of release assay a clinical programme
    requires. No human trial data. The near-monogenic genetics and the founder
    allele make this an unusually tractable gene-replacement target.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: CYP4V2 Loss of Function
    treatment_effect: RESTORES
    description: >
      Vector-delivered CYP4V2 restores the missing omega-hydroxylase, acting on
      the trigger lesion upstream of both downstream arms.
    evidence:
    - reference: PMID:42123783
      reference_title: "Development and Validation of a Quantitative LC-MS/MS Method for Measuring CYP4V2 Enzyme Activity via 12-Hydroxylauric Acid in rAAV-hCYP4V2 Gene Therapy Products."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Gene replacement therapy using rAAV-hCYP4V2 represents a promising therapeutic strategy, requiring robust bioassays for product quality control."
      explanation: >
        Establishes the gene-replacement strategy and that it is at the
        product-characterization stage. Marked PARTIAL because this
        demonstrates restored enzyme activity in transduced cells, not clinical
        benefit.
  evidence:
  - reference: PMID:42123783
    reference_title: "Development and Validation of a Quantitative LC-MS/MS Method for Measuring CYP4V2 Enzyme Activity via 12-Hydroxylauric Acid in rAAV-hCYP4V2 Gene Therapy Products."
    supports: PARTIAL

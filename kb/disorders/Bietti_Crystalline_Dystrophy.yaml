inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic CYP4V2 variants are detected in essentially all molecularly solved
    patients - 98.3% of families in a cohort of 175 Chinese families - making
    this one of the least genetically heterogeneous inherited retinal
    dystrophies.
  evidence:
  - reference: PMID:37584790
    reference_title: "Clinical and genetic characterization of a large cohort of Chinese patients with Bietti crystalline retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular screening detected biallelic CYP4V2 pathogenic variants in 98.3% (172/175) of the families, including 19 novel ones."
    explanation: >
      Quantifies the diagnostic yield of biallelic CYP4V2 testing in a large
      cohort, supporting both the recessive inheritance and the near-monogenic
      character of the disease.
pathophysiology:
- name: CYP4V2 Loss of Function
  description: >
    Biallelic loss-of-function variants abolish CYP4V2, a cytochrome P450
    enzyme that omega-hydroxylates fatty acids. In East Asian cohorts the
    spectrum is dominated by a single founder splice-region allele,
    c.802-8_810del17insGC, which accounts for over half of disease alleles - a
    concentration that makes targeted testing efficient and gene-replacement
    trials feasible to recruit for.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: Fatty acid omega-oxidation
    term:
      id: GO:0010430
      label: fatty acid omega-oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:42123783
    reference_title: "Development and Validation of a Quantitative LC-MS/MS Method for Measuring CYP4V2 Enzyme Activity via 12-Hydroxylauric Acid in rAAV-hCYP4V2 Gene Therapy Products."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Bietti crystalline dystrophy (BCD) is a hereditary retinal disease caused by loss-of-function mutations in the CYP4V2 gene."
    explanation: >
      Assigns causation to CYP4V2 loss of function; the same study measures the
      enzyme's activity as omega-hydroxylation of lauric acid, which is the
      catalytic function this node asserts is lost.
  - reference: PMID:37584790
    reference_title: "Clinical and genetic characterization of a large cohort of Chinese patients with Bietti crystalline retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequent pathogenic variant was c.802-8_810del17insGC, with the allele frequency of 55.7% (195/350), followed by c.992A>C (28/350, 8%) and c.1091-2A>G (23/350, 6.6%)."
    explanation: >
      Quantifies the founder allele's dominance of the mutational spectrum in
      this population, supporting the claim made in this node's description.
  downstream:
  - target: Polyunsaturated Fatty Acid Overload in the Retinal Pigment Epithelium
    causal_link_type: DIRECT

- name: Polyunsaturated Fatty Acid Overload in the Retinal Pigment Epithelium
  description: >
    Without CYP4V2 the retinal pigment epithelium cannot dispose of fatty acids
    through the omega-oxidation route, and polyunsaturated species accumulate.
    This is measurable rather than inferred: lipid profiling of RPE from
    Cyp4v3-null mice - the murine orthologue - shows increased eicosapentaenoic
    and arachidonic acid. The RPE is the cell that suffers because it
    phagocytoses a daily load of PUFA-rich photoreceptor outer-segment membrane,
    so it carries by far the highest flux through this pathway of any cell in
    the body. Dietary fat load worsens the phenotype in the model, which is
    consistent with substrate supply driving the disease.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: Lipid homeostasis
    term:
      id: GO:0055088
      label: lipid homeostasis
    modifier: ABNORMAL
  locations:
  - preferred_term: pigmented layer of retina
    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  evidence:
  - reference: PMID:38992691
    reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased levels of PUFAs, such as EPA (C22:5) and AA (C20:4), were observed in the RPE of Cyp4v3 KO mice."
    explanation: >
      Direct lipidomic measurement of the accumulation this node asserts, in the
      correct cell type and in an orthologous knockout.
  - reference: PMID:38992691
    reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cyp4v3 KO mice exhibited progressive retinal degeneration and lipid accumulation, similar to the BCD phenotype, which was exacerbated by a high-fat diet (HFD)."
    explanation: >
      Supports the substrate-supply claim: increasing dietary fat worsens the
      phenotype, which is what would be expected if accumulation of the
      unmetabolized substrate drives the degeneration.
  downstream:
  - target: ER Stress and Mitochondrial Dysfunction
    causal_link_type: DIRECT
  - target: Iron-Dependent Lipid Peroxidation and Ferroptosis
    causal_link_type: DIRECT

- name: ER Stress and Mitochondrial Dysfunction
  description: >
    One of two demonstrated routes from lipid overload to RPE death. Proteomic
    profiling of CYP4V2-knockdown RPE identifies endoplasmic reticulum stress as
    the most enriched pathway; IRE1-alpha signalling drives up the ER
    oxidoreductase ERO1-L-alpha, generating ER-associated oxidative stress, and
    mitochondrial transmembrane potential and ATP production fall. That IRE1-alpha
    inhibition reverses both the ERO1-L-alpha induction and the mitochondrial
    deficits establishes the arm as causal rather than correlative.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: Response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: Response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:40466971
    reference_title: "IRE1α-mediated endoplasmic reticulum stress response regulates oxidative damage in CYP4V2 deficient human retinal pigment epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inositol-requiring enzyme 1 α (IRE1α) inhibitors suppressed upregulation of endoplasmic reticulum oxidoreductase 1 alpha (ERO1-Lα) protein expression, which contributed to ER-associated oxidative stress."
    explanation: >
      Establishes the IRE1-alpha to ERO1-L-alpha to oxidative stress sequence
      this node asserts, with pharmacological inhibition demonstrating direction.
  - reference: PMID:40466971
    reference_title: "IRE1α-mediated endoplasmic reticulum stress response regulates oxidative damage in CYP4V2 deficient human retinal pigment epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of mitochondrial transmembrane potential and reduced ATP production were mitigated with IRE1α inhibitor in CYP4V2-KD ARPE-19 cells."
    explanation: >
      Shows the mitochondrial failure is downstream of the ER stress arm, since
      blocking IRE1-alpha rescues it.
  downstream:
  - target: Progressive RPE and Chorioretinal Atrophy
    causal_link_type: DIRECT

- name: Iron-Dependent Lipid Peroxidation and Ferroptosis
  description: >
    The second demonstrated route, and the one that most directly explains why a
    PUFA-handling defect is lethal to the cell: polyunsaturated fatty acids are
    the preferred substrate of the lipid peroxidation that executes ferroptosis.
    Cyp4v3-null RPE shows lipid peroxidation, reactive oxygen species
    accumulation, mitochondrial defects and upregulation of ferroptosis genes,
    together with upregulation of NCOA4 - the ferritinophagy receptor - and
    abnormal accumulation of ferrous iron. Iron chelation with deferiprone
    suppresses the phenotype in vitro and restores retinal function and
    morphology in the knockout mouse, which makes this arm both causal and
    druggable.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  biological_processes:
  - preferred_term: Ferroptosis
    term:
      id: GO:0097707
      label: ferroptosis
    modifier: INCREASED
  - preferred_term: Intracellular iron ion homeostasis
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38992691
    reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ferroptosis-related characteristics, including mitochondrial defects, lipid peroxidation, ROS accumulation, and upregulation of related genes, were detected in the RPE both in vitro and in vivo."
    explanation: >
      Documents the ferroptotic signature in the correct cell type, in both
      cellular and animal models.
  - reference: PMID:38992691
    reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptome analysis of RPE in Cyp4v3 KO mice revealed changes in genes involved in iron homeostasis, particularly an upregulation of NCOA4, which was confirmed by immunofluorescence."
    explanation: >
      Supports the iron arm specifically, identifying the ferritinophagy
      receptor whose induction accompanies the ferrous iron accumulation.
  downstream:
  - target: Progressive RPE and Chorioretinal Atrophy
    causal_link_type: DIRECT

- name: Progressive RPE and Chorioretinal Atrophy
  description: >
    Both arms converge on death of the retinal pigment epithelium, followed by
    loss of the choriocapillaris it supports and of the photoreceptors that
    depend on it. Atrophy spreads through the posterior pole and, as it does,
    the crystalline deposits that gave the disease its name progressively
    disappear - which is why crystal count is a poor progression marker and
    RPE atrophy area is the meaningful one. Two clinical distributions are
    recognized: a peripheral type and a central type, the latter with worse
    central acuity but better preserved overall retinal function.
  role: consequence
  biological_scale: TISSUE
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  biological_processes:

    term:
      id: UBERON:0001782
      label: pigmented layer of retina
  - preferred_term: optic choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  evidence:
  - reference: PMID:38992691
    reference_title: "Uncovering the role of ferroptosis in Bietti crystalline dystrophy and potential therapeutic strategies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PUFAs resulting from CYP4V2 mutation may serve as substrates for ferroptosis, potentially working in conjunction with NCOA4-regulated iron accumulation, ultimately leading to RPE degeneration."
    explanation: >
      States the authors' proposed causal chain ending in RPE degeneration,
      which is the endpoint this node models.
  - reference: PMID:37584790
    reference_title: "Clinical and genetic characterization of a large cohort of Chinese patients with Bietti crystalline retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two clinical types were observed: peripheral type (type P) and central type (type C)."
    explanation: >
      Documents the two clinical distributions of atrophy described in this
      node.
  downstream:
  - target: Progressive Visual Loss After the Fourth Decade
    causal_link_type: DIRECT

- name: Progressive Visual Loss After the Fourth Decade
  description: >
    Vision is comparatively well preserved through early adult life and then
    declines, with a significant fall in best-corrected acuity in patients over
    40 in a cohort of 208. Genotype modulates the timing: patients carrying the
    founder splice allele in trans with a truncating variant reach severe visual
    impairment younger than those homozygous for the founder allele, consistent
    with the founder allele being hypomorphic rather than null. That relative
    preservation before 40 defines the therapeutic window for any
    disease-modifying intervention.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Visual perception
    term:
      id: GO:0007601
      label: visual perception
    modifier: DECREASED
  evidence:

    reference_title: "Clinical and genetic characterization of a large cohort of Chinese patients with Bietti crystalline retinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant decline of BCVA was revealed in patients over 40 years old (P<0.001)."

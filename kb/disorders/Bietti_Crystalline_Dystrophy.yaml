name: Bietti Crystalline Dystrophy
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >
  Bietti crystalline dystrophy is an autosomal recessive retinal degeneration
  caused by biallelic loss-of-function variants in CYP4V2, a cytochrome P450
  fatty acid omega-hydroxylase. It is one of the commoner inherited retinal
  dystrophies in East Asian populations and is named for the glittering
  yellow-white crystalline deposits scattered through the posterior pole and, to
  a variable degree, the corneal limbus - hence the fuller name Bietti
  crystalline corneoretinal dystrophy. The crystals are nonetheless
  the least mechanistically informative part of the picture:
  they fade as the disease advances, and the destructive process is atrophy of
  the retinal pigment epithelium and choriocapillaris beneath them. Loss of
  CYP4V2 leaves the RPE unable to omega-hydroxylate polyunsaturated fatty acids,
  which accumulate. Two convergent routes downstream have been demonstrated in
  CYP4V2-deficient RPE: an endoplasmic reticulum stress arm in which IRE1-alpha
  signalling drives ERO1-L-alpha-dependent oxidative stress and mitochondrial
  failure, and a ferroptosis arm in which the accumulated PUFAs serve as
  peroxidation substrate alongside NCOA4-associated iron accumulation. Vision is
  relatively preserved before 40 and then declines. There is no approved
  therapy; iron chelation and rAAV-CYP4V2 gene replacement are both preclinical.

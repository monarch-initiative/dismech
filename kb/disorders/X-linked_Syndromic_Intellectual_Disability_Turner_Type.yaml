treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: >
    No disease-specific therapy exists. Management is supportive and centred on
    early developmental intervention, special education, and speech, physical,
    and occupational therapy targeting intellectual disability, speech delay, and
    motor involvement.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >
    Counseling for families regarding X-linked semi-dominant inheritance, carrier
    testing of at-risk female relatives, and reproductive options including
    prenatal and preimplantation genetic testing once the familial HUWE1 variant
    is known.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

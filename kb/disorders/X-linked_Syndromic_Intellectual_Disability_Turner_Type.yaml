name: X-linked Syndromic Intellectual Disability, Turner Type
creation_date: '2026-07-07T00:00:00Z'
category: Genetic
parents:
- Neurodevelopmental Disorder
- X-linked Dominant Disorder
disease_term:
  preferred_term: intellectual disability, X-linked syndromic, Turner type
  term:
    id: MONDO:0010407
    label: intellectual disability, X-linked syndromic, Turner type
description: >
  X-linked syndromic intellectual disability, Turner type (MRXST; OMIM 300706) is
  a HUWE1-related neurodevelopmental disorder caused by dysregulation of the
  Xp11.22 gene HUWE1, which encodes a large HECT-domain E3 ubiquitin-protein
  ligase. Two convergent genetic mechanisms are recognized: increased HUWE1 gene
  dosage from submicroscopic Xp11.22 microduplications, and missense (and rare
  splice-site) variants that alter HUWE1 catalytic activity. Affected males show
  moderate to profound intellectual disability with delayed or absent speech,
  short stature, and facial dysmorphism; heterozygous females range from
  unaffected carriers to severely affected, reflecting semi-dominant X-linked
  transmission and variable X-inactivation. This MONDO concept lumps several
  historically separate designations that were later shown to be HUWE1-allelic,
  including Brooks-Wisniewski-Brown syndrome (the "mental retardation and
  macrocephaly syndrome", OMIM 309590) and Juberg-Marsidi syndrome. Head size is
  heterogeneous across the spectrum: the original "Turner type" duplication
  family segregated macrocephaly, whereas the broader HUWE1 missense cohorts more
  often show microcephaly and short stature. NOTE: the eponym honours the
  clinical geneticist Gillian Turner and is unrelated to Turner syndrome (45,X).
pathophysiology:
- name: Dysregulated HUWE1 Ubiquitin Ligase Activity in Neurodevelopment
  description: >
    HUWE1 is a dosage-sensitive HECT-domain E3 ubiquitin-protein ligase that
    controls the abundance of substrates governing neural progenitor
    proliferation, neuronal differentiation, and the cell cycle (including
    TP53-associated control of the neuronal cell cycle). Disease arises from a
    perturbation of this ubiquitination activity in either direction: increased
    HUWE1 gene dosage (from Xp11.22 microduplication with demonstrated HUWE1
    upregulation in patient cells) or missense variants that damage HUWE1
    catalytic function. Both converge on impaired ubiquitin-dependent proteostasis
    in the developing brain, producing intellectual disability and the associated
    syndromic features.

- name: p.G4310R HUWE1 Destabilization
  biological_scale: MOLECULAR
  description: >
    In Juberg-Marsidi syndrome cells, p.G4310R reduces HUWE1 stability and
    protein abundance. The mutant HECT domain ubiquitinates p53 with efficiency
    similar to wild type, so this node represents an allele-specific stability
    defect rather than impaired catalytic p53 ubiquitination. It must not be
    generalized to all HUWE1 sequence variants or to regional Xp11.22 copy
    gains.
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.G4310R mutation did not affect HUWE1 activity but instead reduced its stability, leading to p53 accumulation and consequently increased expression of p53 target genes."
    explanation: Directly supports reduced HUWE1 stability while distinguishing that defect from loss of HUWE1 activity.
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro ubiquitination assays indicated that both HECT G4310R and HECT WT ubiquitinate p53 with similar efficiencies (Figure 2B), thus indicating that G4310R does not affect HUWE1 catalytic HECT domain activity."
    explanation: The p.G4310R HECT domain retained wild-type-like p53 ubiquitination efficiency, so abnormal protein ubiquitination is not asserted for this node.
  downstream:
  - target: p53 Protein Accumulation
    causal_link_type: DIRECT
- name: p53 Protein Accumulation
  biological_scale: MOLECULAR
  description: >
    Reduced p.G4310R HUWE1 abundance is followed by accumulation of p53 protein
    in patient-derived Juberg-Marsidi syndrome lymphoblastoid cells. This is an
    allele-specific molecular abundance finding rather than evidence of reduced
    catalytic p53 ubiquitination by the mutant HECT domain.
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HUWE1 p.G4310R levels were reduced, and p53 accumulated in JMS LCs (Figure 2A)."
    explanation: Directly supports the separate p53 protein-accumulation step in p.G4310R patient-derived cells.
  downstream:
  - target: Increased p53 Signaling
    causal_link_type: DIRECT
- name: Increased p53 Signaling
  biological_scale: CELLULAR
  description: >
    Accumulated p53 is accompanied by increased expression of p53 target genes
    in p.G4310R Juberg-Marsidi syndrome cells. This signaling state is modeled
    separately from both HUWE1 protein destabilization and p53 protein
    accumulation.
  biological_processes:
  - preferred_term: Signal transduction by p53 class mediator
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
    modifier: INCREASED
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By focusing on Juberg-Marsidi syndrome (JMS), one of the severest XLIDs, we show that increased p53 signaling results from p53 accumulation caused by HUWE1 p.G4310R destabilization."
    explanation: Directly supports increased p53 signaling downstream of p53 accumulation caused by p.G4310R HUWE1 destabilization.
  downstream:
  - target: p53-Associated Cell-Cycle and Proliferation Impairment
    causal_link_type: DIRECT
- name: p53-Associated Cell-Cycle and Proliferation Impairment
  biological_scale: CELLULAR
  description: >
    Increased p53 signaling in p.G4310R patient-derived lymphoblastoid cells is
    associated with G1 accumulation, reduced S-phase entry, and reduced
    proliferation. These are cellular disease-model findings rather than a
    directly measured patient phenotype.
  biological_processes:

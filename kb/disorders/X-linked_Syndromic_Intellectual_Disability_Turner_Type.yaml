- name: Proposed Multisystem Clinical Evaluations at HNDD Diagnosis
  description: >
    The 2026 cohort proposes, rather than validates, measurements of height,
    weight, and head circumference; neurologic assessment with brain MRI and EEG
    when seizures are suspected; motor, adaptive, cognitive, and speech/language
    assessment with early-intervention referral; autism assessment when
    indicated; neurosurgical or orthopedic review for craniosynostosis, Chiari
    malformation, scoliosis, or hip problems; GI, nutrition, and feeding review
    when needed with constipation management; echocardiography; ophthalmology;
    audiology with hearing devices when appropriate; dental evaluation; and
    endocrine evaluation of short stature with consideration of growth hormone.
    These are author-proposed starting points, not validated outcome-improving
    surveillance guidelines or evidence of treatment efficacy.
  treatment_term:
    preferred_term: Clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:

    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This further alters cell-cycle progression and proliferation in JMS cells."
    explanation: Directly supports altered cell-cycle progression and proliferation in patient-derived JMS cells.
  downstream:
  - target: p53-Dependent Neural Differentiation Defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased expression of p53 target genes, particularly CDKN1A/p21
  - target: Cerebral Organoid Growth and Cortical Architecture Defects
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased p53 signaling in p.G4310R patient-derived neural cells
- name: p53-Dependent Neural Differentiation Defect
  biological_scale: CELLULAR
  description: >
    Two hiPSC clones derived from one p.G4310R Juberg-Marsidi patient formed
    fewer neural rosettes and showed reduced neural maturation markers. p53
    knockdown restored rosette formation and neural maturation markers,
    providing rescue evidence for p53 dependence while remaining an in-vitro,
    single-patient model.
  biological_processes:
  - preferred_term: Neuron development
    term:
      id: GO:0048666
      label: neuron development
    modifier: DECREASED
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Modeling of JMS neurodevelopment reveals majorly impaired neural differentiation accompanied by increased p53 signaling."
    explanation: Supports impaired neural differentiation and increased p53 signaling in patient-derived hiPSC models.
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The neural differentiation defects can be successfully rescued by reducing p53 levels and restoring the expression of p53 target genes, in particular CDKN1A/p21."
    explanation: p53-reduction rescue supports a causal p53 contribution to the in-vitro neural-differentiation defect.
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Cerebral Organoid Growth and Cortical Architecture Defects
  biological_scale: TISSUE
  description: >
    Cerebral organoids derived from the p.G4310R patient line were smaller and
    showed altered cortical cytoarchitecture, including a disorganized layer of
    proliferating neural progenitor cells. This is a distinct organoid-level
    architecture readout from the hiPSC neural-differentiation assay and remains
    a single-patient in-vitro model.
  locations:
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Defects in JMS neurodevelopment were further evident in altered cortical cytoarchitecture, resulting in a disorganized layer of proliferating NPCs and reduced JMS brain organoid size."
    explanation: Directly supports the separate cerebral-organoid growth and cortical-architecture readout.
  downstream:

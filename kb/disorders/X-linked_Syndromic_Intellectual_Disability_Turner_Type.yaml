disease_term:
  preferred_term: intellectual disability, X-linked syndromic, Turner type
  term:
    id: MONDO:0010407
    label: intellectual disability, X-linked syndromic, Turner type
description: >
  X-linked syndromic intellectual disability, Turner type (MRXST; OMIM 300706) is
  a HUWE1-related neurodevelopmental disorder. The original Turner family was
  delineated by X-linked intellectual disability with macrocephaly and expression
  in heterozygous females; it was subsequently associated with a HUWE1 missense
  variant, not an Xp11.22 duplication. The broader HUWE1 allelic spectrum includes
  missense and rare splice-site variants, while whole-gene or regional Xp11.22
  duplications represent a distinct increased-dosage route to HUWE1-associated
  intellectual disability. Common findings include global developmental delay,
  moderate-to-profound intellectual disability, severe speech delay, short
  stature, hypotonia, skeletal anomalies, and recurrent but nonspecific facial
  dysmorphism. Females range from unaffected carriers to severely affected, and
  X-inactivation measured in accessible tissues does not reliably predict
  severity. MONDO aggregates historically separate HUWE1-allelic designations,
  including Brooks-Wisniewski-Brown and Juberg-Marsidi syndromes. Head size is
  heterogeneous: macrocephaly characterized the original Turner family, whereas
  microcephaly occurred in 11 of 21 individuals in a later variant cohort. The
  eponym honours clinical geneticist Gillian Turner and is unrelated to Turner
  syndrome (45,X). A recently defined AMBRA1-RMC1-HUWE1 branch recruits HUWE1 to
  mitochondria for substrate ubiquitination; patient-associated noncatalytic
  variants M375I, G660R, and H669Q disrupt this branch in experimental systems.
  This mitochondrial mechanism complements, but is not shown to replace or
  converge directly with, the allele-specific p53/Mcl-1 abundance model. In the
  p.G4310R Juberg-Marsidi allele, patient-derived cells, hiPSCs, and cerebral
  organoids instead support a defined HUWE1-instability to p53 accumulation,
  cell-cycle impairment, and defective neural-differentiation chain that can be
  rescued in vitro by p53 knockdown.
pathophysiology:
- name: Altered HUWE1 Protein Abundance and Substrate Homeostasis
  biological_scale: MOLECULAR
  description: >
    HUWE1 is a HECT-domain E3 ubiquitin-protein ligase implicated in regulation
    of the neuronal cell cycle. Xp11.22 duplications can increase HUWE1 expression,
    while different missense alleles can decrease or increase HUWE1 protein and
    shift the abundance of its substrates p53 and Mcl-1 in opposite directions.
    The direct evidence therefore supports allele-specific dysregulation of
    HUWE1-dependent substrate homeostasis, not a uniform loss or gain of catalytic
    activity across the allelic spectrum. This abundance/substrate branch is kept
    distinct from the AMBRA1-RMC1 mitochondrial-recruitment branch because the
    available evidence does not establish a causal connection between them.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: ABNORMAL
  locations:
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:18252223
    reference_title: "Submicroscopic duplications of the hydroxysteroid dehydrogenase HSD17B10 and the E3 ubiquitin ligase HUWE1 are associated with mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The E3 ubiquitin ligase HUWE1 has been implicated in TP53-associated regulation of the neuronal cell cycle."
    explanation: Supports the limited neuronal-cell-cycle role stated in the node without extending it to a complete developmental mechanism.
  - reference: PMID:18252223
    reference_title: "Submicroscopic duplications of the hydroxysteroid dehydrogenase HSD17B10 and the E3 ubiquitin ligase HUWE1 are associated with mental retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For the other genes, expression array and quantitative PCR analysis in patient cell lines compared to controls showed a significant upregulation of HSD17B10 and HUWE1 as well as several important genes in their molecular pathways."
    explanation: Directly supports increased HUWE1 expression in patient cells carrying Xp11.22 duplications, while retaining the paper's HSD17B10 co-duplication caveat.
  - reference: PMID:27130160
    reference_title: "HUWE1 mutations in Juberg-Marsidi and Brooks syndromes: the results of an X-chromosome exome sequencing study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, these findings suggest that p. G4310R mutation identified in the affected male from the JMS family (K9149) leads to reduced E3 ligase levels and consequent accumulation of downstream targets p53 and Mcl1."
    explanation: Directly supports reduced HUWE1 abundance and increased substrate abundance for p.G4310R.
  - reference: PMID:27130160
    reference_title: "HUWE1 mutations in Juberg-Marsidi and Brooks syndromes: the results of an X-chromosome exome sequencing study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In family 3, levels of the HUWE1 p.R4063Q protein were increased, and consequently the levels of p53 substrate were reduced in the two affected brothers compared with their normal father (figure 4)."
    explanation: Shows the opposite allele-specific direction for HUWE1 and p53 abundance, preventing a uniform loss-of-function claim.

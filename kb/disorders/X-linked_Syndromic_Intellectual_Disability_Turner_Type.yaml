diagnosis:
- name: Audit Boundary for Sequence-Variant HNDD and Xp11.22 Copy Gain
  description: >
    The HNDD cohort, its sex-stratified phenotype frequencies, and the
    Juberg-Marsidi p.G4310R mechanism concern intragenic HUWE1 sequence or splice
    variants. They must not be pooled with Xp11.22 copy-gain cases. Regional
    Xp11.22 duplications are a separate dosage route whose minimal recurrent
    interval contains RIBC1 and HSD17B10 as well as HUWE1; consequently those
    cases do not isolate HUWE1 dosage as a single-gene perturbation. Molecular
    evaluation should therefore include sequence/splice analysis and copy-number
    analysis while retaining this evidence boundary in interpretation.
  evidence:
  - reference: PMID:39629746
    reference_title: "Exploring the Clinical Spectrum of HUWE1 -Related Neurodevelopmental Disorder: Five New Patients and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing identified a de novo variant in HUWE1 in the proband in one family and a maternally inherited hemizygous variant in three boys in a second family."
    explanation: Demonstrates trio exome sequencing as a diagnostic route for both de novo and inherited HUWE1 sequence variants.
  - reference: PMID:18252223
    reference_title: "Submicroscopic duplications of the hydroxysteroid dehydrogenase HSD17B10 and the E3 ubiquitin ligase HUWE1 are associated with mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a novel microduplication hot spot at Xp11.22 identified in six unrelated families with predominantly nonsyndromic XLMR."
    explanation: Supports including dosage analysis and treating the regional copy-gain cohort as a separate, predominantly nonsyndromic ascertainment route.
  - reference: PMID:18252223
    reference_title: "Submicroscopic duplications of the hydroxysteroid dehydrogenase HSD17B10 and the E3 ubiquitin ligase HUWE1 are associated with mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The minimal, commonly duplicated region contains three genes: RIBC1, HSD17B10, and HUWE1."
    explanation: Makes the multigene Xp11.22 copy-gain boundary audit-visible and prevents a HUWE1-only copy-number claim.
differential_diagnoses:
- name: ATR-X-related syndrome
  disease_term:
    preferred_term: ATR-X-related syndrome
    term:
      id: MONDO:0016980
      label: ATR-X-related syndrome
  description: >
    ATRX-related disease overlaps HNDD through X-linked developmental delay or
    intellectual disability, hypotonia, seizures, feeding/gastrointestinal
    problems, short stature, and facial dysmorphism. Alpha-thalassemia or HbH
    inclusions, characteristic genital/urogenital anomalies, and a pathogenic
    ATRX variant favor ATR-X; a pathogenic HUWE1 sequence variant favors HNDD.
  distinguishing_features:
  - Alpha-thalassemia or HbH inclusions support ATR-X but are not required in every ATRX-related case.
  - Genital anomalies ranging from hypospadias or undescended testes to ambiguous genitalia favor ATR-X.
  - Molecular confirmation in ATRX versus HUWE1 resolves the overlapping X-linked neurodevelopmental presentation.
  evidence:
  - reference: PMID:20301622
    reference_title: Alpha-Thalassemia X-Linked Intellectual Disability Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alpha-thalassemia X-linked intellectual disability (ATR-X) syndrome is characterized by distinctive craniofacial features, genital anomalies, hypotonia, and mild-to-profound developmental delay / intellectual disability (DD/ID)."
    explanation: Documents the central ATR-X overlap and the genital-anomaly discriminator.

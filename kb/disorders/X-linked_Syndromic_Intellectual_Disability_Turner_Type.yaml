- name: p.G4310R HUWE1 Destabilization and p53 Accumulation
  biological_scale: MOLECULAR
  description: >
    In Juberg-Marsidi syndrome cells, p.G4310R reduces HUWE1 stability without
    measurably impairing catalytic HECT-domain ubiquitination of p53. Reduced
    HUWE1 abundance is followed by p53 accumulation and increased expression of
    p53 target genes. This allele-specific result must not be generalized to all
    HUWE1 sequence variants or to regional Xp11.22 copy gains.
  biological_processes:
  - preferred_term: Protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "By focusing on Juberg-Marsidi syndrome (JMS), one of the severest XLIDs, we show that increased p53 signaling results from p53 accumulation caused by HUWE1 p.G4310R destabilization."
    explanation: Patient-derived cellular and biochemical evidence links the specific p.G4310R allele to reduced HUWE1 stability and p53 accumulation.
  downstream:
  - target: p53-Associated Cell-Cycle and Proliferation Impairment
    causal_link_type: DIRECT
- name: p53-Associated Cell-Cycle and Proliferation Impairment
  biological_scale: CELLULAR
  description: >
    Increased p53 signaling in p.G4310R patient-derived lymphoblastoid cells is
    associated with G1 accumulation, reduced S-phase entry, and reduced
    proliferation. These are cellular disease-model findings rather than a
    directly measured patient phenotype.
  biological_processes:
  - preferred_term: Cell cycle
    term:
      id: GO:0007049
      label: cell cycle
    modifier: ABNORMAL
  - preferred_term: Cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This further alters cell-cycle progression and proliferation in JMS cells."
    explanation: Directly supports altered cell-cycle progression and proliferation in patient-derived JMS cells.
  downstream:
  - target: p53-Dependent Neural Differentiation and Organoid Defects
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased expression of p53 target genes, particularly CDKN1A/p21
- name: p53-Dependent Neural Differentiation and Organoid Defects
  biological_scale: CELLULAR
  description: >
    Two hiPSC clones derived from one p.G4310R Juberg-Marsidi patient formed
    fewer neural rosettes and showed reduced neural maturation markers. Cerebral
    organoids derived from the patient line were smaller and had reduced,
    disorganized proliferating-neural-progenitor layers. p53 knockdown restored
    rosette formation and neural maturation markers, providing rescue evidence
    for p53 dependence while remaining an in-vitro, single-patient model.
  biological_processes:
  - preferred_term: Neuron development
    term:
      id: GO:0048666
      label: neuron development
    modifier: DECREASED
  evidence:
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Modeling of JMS neurodevelopment reveals majorly impaired neural differentiation accompanied by increased p53 signaling."
    explanation: Supports impaired neural differentiation and increased p53 signaling in patient-derived hiPSC models.
  - reference: PMID:33948573
    reference_title: Increased p53 signaling impairs neural differentiation in HUWE1-promoted intellectual disabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The neural differentiation defects can be successfully rescued by reducing p53 levels and restoring the expression of p53 target genes, in particular CDKN1A/p21."
    explanation: p53-reduction rescue supports a causal p53 contribution to the in-vitro neural-differentiation defect.
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: AMBRA1-RMC1-Dependent HUWE1 Recruitment to Mitochondria
  biological_scale: MOLECULAR
  description: >
    Under normal experimental conditions, AMBRA1 acts as a mitochondrial
    scaffold for RMC1, and RMC1 directly interacts with HUWE1 to recruit it to
    mitochondria. Disease-associated noncatalytic variants disrupt this
    recruitment, so the abnormal state modeled here is failed mitochondrial
    targeting rather than normal recruitment. This compartment-specific route
    is not generalized to all HUWE1 substrates or alleles.
  biological_processes:
  - preferred_term: Protein localization to mitochondrion
    term:
      id: GO:0070585
      label: protein localization to mitochondrion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, AMBRA1 acts as a mitochondrial scaffold that recruits RMC1, enabling HUWE1 localization to mitochondria through direct interaction with RMC1."
    explanation: The zebrafish-centered study supports the AMBRA1 scaffold and RMC1-HUWE1 recruitment route; the node description makes the disease-associated disruption, not normal recruitment, the abnormal state.
  downstream:
  - target: Selective Impairment of Mitochondrial Substrate Ubiquitination
    causal_link_type: DIRECT
- name: Selective Impairment of Mitochondrial Substrate Ubiquitination
  biological_scale: MOLECULAR
  description: >
    Patient-associated noncatalytic HUWE1 variants M375I, G660R, and H669Q disrupt
    mitochondrial targeting and impair ubiquitination of mitochondrial substrates.
    The reported profiling did not show an effect on nuclear substrates, so this
    node represents compartment-selective dysfunction rather than global loss of
    HUWE1 catalytic activity.
  biological_processes:
  - preferred_term: Protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Global ubiquitin profiling reveals that these variants selectively disrupt the ubiquitination of mitochondrial proteins without affecting nuclear substrates."
    explanation: Supports a selective mitochondrial-substrate ubiquitination defect and explicitly bounds the claim against a global nuclear-substrate defect.
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Disruption of this recruitment by disease-associated HUWE1 variants prevents mitochondrial targeting and impairs mitochondrial substrate ubiquitination."
    explanation: Links disease-associated variants to failed mitochondrial targeting and substrate ubiquitination in the mechanistic assays.
  downstream:
  - target: Zebrafish Brain-Growth and Motor-Neuron Deficits
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Zebrafish Brain-Growth and Motor-Neuron Deficits
  biological_scale: ORGANISM
  description: >
    In zebrafish, the patient-associated noncatalytic HUWE1 variants M375I,
    G660R, and H669Q reproduce impaired brain growth and motor-neuron defects.
    This is model-organism evidence for neurodevelopmental consequences and is
    not represented as direct proof of the corresponding mechanism in patients.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, noncatalytic HUWE1 variants found in XLID patients (M375I, G660R, and H669Q) recapitulate key neurodevelopmental deficits, including impaired brain growth and motor neuron defects."
    explanation: Directly supports the named variants and the brain-growth and motor-neuron phenotypes specifically in zebrafish.

genetic:
- name: HUWE1
  association: Causative
  gene_term:
    preferred_term: HUWE1
    term:
      id: hgnc:30892
      label: HUWE1
  notes: >
    HUWE1 (Xp11.22) encodes a HECT-domain E3 ubiquitin-protein ligase. The
    original Turner family carried the missense variant p.Arg4013Trp and had
    macrocephaly; it was not one of the Xp11.22 microduplication families.
    Pathogenic missense and rare splice-site variants underlie the broader
    syndromic spectrum. Separately, Xp11.22 duplications can increase HUWE1
    dosage, although the minimal duplicated interval also contains HSD17B10 and
    RIBC1 and should not be represented as a HUWE1-only experiment. Juberg-Marsidi
    and Brooks (Brooks-Wisniewski-Brown) syndromes were shown to be HUWE1-allelic.
    M375I, G660R, and H669Q are patient-associated noncatalytic variants examined
    in the mitochondrial-recruitment study; their experimental mechanism should
    not be generalized to every pathogenic HUWE1 allele.
  evidence:
  - reference: PMID:7943042
    reference_title: "X-linked mental retardation with heterozygous expression and macrocephaly: pericentromeric gene localization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A family is described with X-linked mental retardation (XLMR) with affected males in 2 generations. The manifestations are macrocephaly and heterozygous expression."
    explanation: Anchors the phenotype and inheritance of the original Turner family without misclassifying it as a duplication family.
  - reference: PMID:18252223
    reference_title: "Submicroscopic duplications of the hydroxysteroid dehydrogenase HSD17B10 and the E3 ubiquitin ligase HUWE1 are associated with mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a novel microduplication hot spot at Xp11.22 identified in six unrelated families with predominantly nonsyndromic XLMR."
    explanation: Identifies the separate Xp11.22 microduplication route and its predominantly nonsyndromic ascertainment.
  - reference: PMID:18252223
    reference_title: "Submicroscopic duplications of the hydroxysteroid dehydrogenase HSD17B10 and the E3 ubiquitin ligase HUWE1 are associated with mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The minimal, commonly duplicated region contains three genes: RIBC1, HSD17B10, and HUWE1."
    explanation: Defines HUWE1 within the minimal duplicated interval implicated in disease.
  - reference: PMID:27130160
    reference_title: "HUWE1 mutations in Juberg-Marsidi and Brooks syndromes: the results of an X-chromosome exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using the power of next generation sequencing, we have linked Juberg-Marsidi syndrome (JMS) and Brooks syndrome as allelic conditions."
    explanation: Establishes that HUWE1 variants unify previously separate syndromic diagnoses.
  - reference: PMID:27130160
    reference_title: "HUWE1 mutations in Juberg-Marsidi and Brooks syndromes: the results of an X-chromosome exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data indicate that JMS and Brooks syndromes are allelic having the same HUWE1 mutation."
    explanation: Confirms the shared HUWE1 mutation across Juberg-Marsidi and Brooks syndromes.
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, noncatalytic HUWE1 variants found in XLID patients (M375I, G660R, and H669Q) recapitulate key neurodevelopmental deficits, including impaired brain growth and motor neuron defects."
    explanation: The quoted claim is a zebrafish experiment using patient-associated variants, so the entire evidence item is classified as MODEL_ORGANISM rather than split by wording.
inheritance:
- name: X-linked dominant (semi-dominant)
  inheritance_term:
    preferred_term: X-linked semi-dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >
    X-linked transmission with variable expression in heterozygous females.
    Hemizygous males are generally affected; females range from unaffected
    carriers to severe syndromic intellectual disability. The 21-person cohort
    showed that severe female disease can occur even when the affected X appears
    preferentially inactivated in sampled tissue, so X-inactivation results
    should not be treated as a simple predictor of clinical severity. In the
    2026 cohort of 22 males and 13 females, 11 males had de novo variants and
    inherited variants occurred in eight male families; carrier mothers were
    clinically unaffected. Twelve females had de novo variants and the remaining
    female inherited from a father with suspected low-level mosaicism.
  evidence:
  - reference: PMID:29180823
    reference_title: "HUWE1 variants cause dominant X-linked intellectual disability: a clinical study of 21 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe for the first time that females can be severely affected, despite preferential inactivation of the affected X chromosome."
    explanation: Directly supports severe expression in females and the stated limitation of sampled-tissue X-inactivation.
  - reference: PMID:29180823
    reference_title: "HUWE1 variants cause dominant X-linked intellectual disability: a clinical study of 21 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, HUWE1 missense variants may cause syndromic ID in both males and females."
    explanation: Confirms disease expression in both sexes, consistent with X-linked (semi-)dominant transmission.
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 35 individuals from 32 families were identified, 22 males and 13 females"
    explanation: Establishes the exact sex-stratified cohort denominator.
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All HUWE1 variants in females were de novo, with one exception where her father had suspected mosaicism."
    explanation: Supports 12 de novo female cases plus one exceptional paternal-mosaic transmission.
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the affected males, 11 had de novo variants in HUWE1. For 8 families, the variant was inherited."
    explanation: Preserves the paper's male inheritance denominators as 11 individuals de novo and eight inherited families rather than converting families into individuals.
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uniformly, the carrier mothers were described as normal, meaning no history of intellectual disability, seizures, or other neurodevelopmental concerns."
    explanation: Supports clinically unaffected carrier mothers in the inherited male families without implying that all heterozygous females are unaffected.

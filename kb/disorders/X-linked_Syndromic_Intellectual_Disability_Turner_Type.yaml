    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we provide proposed clinical evaluation and management guidelines described in Table 3."
    explanation: The primary cohort explicitly frames the evaluations as proposed guidelines and Table 3 supplies the listed systems and tests.

discussions:
- discussion_id: gap_huwe1_x_inactivation_sex_expression
  prompt: >
    How do tissue-specific X-chromosome inactivation, variant effect, and
    parental mosaicism determine the wide range of expression in heterozygous
    females with HUWE1 sequence variants?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#HUWE1
  rationale: >
    Severe female disease can occur despite preferential inactivation of the
    affected X in accessible tissue, whereas inherited male cases had clinically
    unaffected carrier mothers. The 2026 cohort reported X-inactivation for only
    one mother, so blood or other accessible-tissue XCI cannot yet explain or
    predict female severity.
  evidence:
  - reference: PMID:29180823
    reference_title: "HUWE1 variants cause dominant X-linked intellectual disability: a clinical study of 21 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe for the first time that females can be severely affected, despite preferential inactivation of the affected X chromosome."
    explanation: Establishes the discordance between accessible-tissue XCI and severe female expression.
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-inactivation was reported only for one mother; in this case (patient 8), it was skewed at 93:7."
    explanation: Shows that the new cohort has insufficient XCI sampling for a sex-expression model.
- discussion_id: gap_huwe1_genotype_phenotype_correlation
  prompt: >
    Which reproducible HUWE1 variant-domain, stability, localization, or
    substrate effects predict clinical severity and organ-system involvement?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#HUWE1
  rationale: >
    Alleles can alter HUWE1 abundance, p53/Mcl-1 homeostasis, or mitochondrial
    recruitment in different directions, but the 35-person cohort found no clear
    relationship between variant location or conservation and developmental
    severity. The three reported hotspots are useful recurrent regions, not a
    validated severity classifier.
  evidence:
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no clear clinical correlation between variant location or evolutionary conservation and the severity of intellectual disability or developmental delays."
    explanation: Directly identifies the negative genotype-phenotype result that bounds hotspot interpretation.
- discussion_id: gap_huwe1_adult_natural_history_tumor_risk
  prompt: >
    What are the adult natural history, age-specific morbidity, lifespan, and
    tumor risk of people with HUWE1-related neurodevelopmental disorder?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >
    Only five adults were included in the 2026 cohort and four were in their
    early twenties. HUWE1 and p53 biology does not by itself license a germline
    cancer-risk claim or syndrome-specific tumor surveillance; longitudinal
    adult cohorts are required.
  evidence:
  - reference: DOI:10.1002/ajmg.a.70127
    reference_title: 35 Individuals With HUWE1-Related Neurodevelopmental Disorder and Suggested Clinical Evaluations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently most of the adults in our cohort (4/5) are in their early 20s so potential susceptibility to cancer and other changes that may occur over time, such as facial features, remain to be determined."
    explanation: Directly states the adult-denominator limitation and unresolved cancer susceptibility.
- discussion_id: gap_urolithin_a_zebrafish_rescue_translation
  prompt: >
    Do the disrupted AMBRA1-RMC1 mitochondrial-recruitment mechanism and
    Urolithin A rescue observed in zebrafish translate to human HNDD biology or
    treatment?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#AMBRA1-RMC1-Dependent HUWE1 Recruitment to Mitochondria
  - pathophysiology#Zebrafish Brain-Growth and Motor-Neuron Deficits
  rationale: >
    The disease-associated mitochondrial-recruitment disruption and Urolithin A
    rescue were established in a zebrafish-centered model-organism study. No
    patient tissue or clinical intervention establishes that this branch drives
    human HNDD or that mitochondrial quality-control enhancement is safe or
    effective in people. Urolithin A is therefore intentionally excluded from
    treatments and retained solely as a zebrafish translation gap.
  evidence:
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, Urolithin A treatment ameliorates neurodevelopmental phenotypes in HUWE1-deficient zebrafish."
    explanation: Documents preclinical rescue in zebrafish only; it does not support clinical treatment or efficacy in humans.

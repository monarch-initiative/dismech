  description: >
    No disease-modifying therapy was identified in the sources reviewed.
    Developmental, educational, rehabilitative, and symptom-directed care should
    be individualized to the person's cognitive, communication, motor, seizure,
    ophthalmologic, and skeletal findings.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Baseline Monitoring and Follow-up

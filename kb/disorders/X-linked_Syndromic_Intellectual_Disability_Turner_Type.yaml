      label: Genetic Counseling
discussions:
- discussion_id: gap_urolithin_a_zebrafish_rescue_translation
  prompt: >
    Does Urolithin A safely improve disease-relevant outcomes in people with
    HUWE1-associated neurodevelopmental disorders?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Zebrafish Brain-Growth and Motor-Neuron Deficits
  rationale: >
    Urolithin A ameliorated neurodevelopmental phenotypes only in
    HUWE1-deficient zebrafish. No human therapeutic efficacy is established by
    this study, so Urolithin A is intentionally excluded from the treatments

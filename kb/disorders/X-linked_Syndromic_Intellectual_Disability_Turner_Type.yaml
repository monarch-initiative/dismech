    G660R, and H669Q reproduce impaired brain growth. This model-organism
    readout is kept distinct from the motor-neuron defect and is not represented
    as direct proof of the corresponding mechanism in patients.
  locations:
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:42490384
    reference_title: "HUWE1 targets mitochondria via RMC1 to promote neurodevelopment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In zebrafish, noncatalytic HUWE1 variants found in XLID patients (M375I, G660R, and H669Q) recapitulate key neurodevelopmental deficits, including impaired brain growth and motor neuron defects."
    explanation: Supports impaired brain growth specifically in variant-expressing zebrafish.
  downstream:

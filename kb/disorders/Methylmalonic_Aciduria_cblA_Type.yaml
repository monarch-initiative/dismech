name: Methylmalonic Aciduria, cblA Type
creation_date: "2026-08-31T10:30:00Z"
category: Mendelian
description: >-
  Biallelic pathogenic MMAA variants cause an adenosylcobalamin-handling defect that reduces
  effective methylmalonyl-CoA mutase (MMUT) activity. MMAA is a mitochondrial GTPase chaperone
  involved in cofactor loading, protection and repair. Recombinant patient-variant studies identify
  impaired functional interaction with MMUT and, for some alleles, protein instability. These
  mechanisms differ from the primary MMUT apoenzyme defect and from MMAB-associated cblB disease.


  The resulting isolated methylmalonic aciduria can present with severe neonatal or infantile
  metabolic decompensation, or with chronic developmental, growth or renal problems. Hydroxocobalamin
  responsiveness was reported in 27/28 cblA patients in a registry comparison with 95 mut patients,
  with lower methylmalonate concentrations and milder subsequent disease in cblA. Responsiveness
  does not exclude severe onset or later complications. The precise biochemical route of pharmacologic
  rescue is not established for every MMAA genotype.


  In a separate retrospective series of 23 adults, 8/23 presented with chronic symptoms, but
  only 4/23 never experienced acute decompensation. Intellectual disability and chronic renal
  failure occurred in 9/23 and 7/23, respectively. These historical adult-survivor data should
  not be treated as untreated or contemporary birth-cohort risks. Early B12 treatment was associated
  with less severe renal disease; the small, nonrandomized comparison cannot establish renal
  protection or exclude neurodevelopmental benefit.

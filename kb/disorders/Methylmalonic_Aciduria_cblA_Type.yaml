genetic:
- name: MMAA
  relationship_type: CAUSATIVE
  features: >-
    MMAA encodes a 418-residue mitochondrial G-protein that chaperones adenosylcobalamin
    onto methylmalonyl-CoA mutase. Biallelic loss-of-function variants define the cblA
    complementation group. The allele spectrum is dominated by premature termination
    codons, and one nonsense allele, c.433C>T (p.Arg145Ter), accounts for a large fraction
    of mutant chromosomes.
  gene_term:
    preferred_term: MMAA
    term:
      id: hgnc:18871
      label: MMAA
  frequency: approximately 20% of isolated methylmalonic acidemia
  case_fractions:
  - population: Isolated methylmalonic acidemia, literature estimate
    case_fraction_percent: 20.0
    notes: >-
      Share of isolated methylmalonic acidemia attributable to cblA, quoted as an
      approximate literature figure rather than derived from a single genotyped cohort.
    evidence:
    - reference: PMID:31921599
      reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "is responsible for approx. 20% of causes of isolated MMA (OMIM #251100)."
      explanation: States the proportion of isolated methylmalonic acidemia caused by cblA.
  variants:
  - name: c.433C>T (p.Arg145Ter)
    description: >-
      Recurrent nonsense allele on a common haplotype, reported as 43% of pathogenic
      alleles in the founding mutation survey and seen in the homozygous state in
      long-followed patients.
    evidence:
    - reference: PMID:15523652
      reference_title: Mutations in the MMAA gene in patients with the cblA disorder of vitamin B12 metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One mutation, c.433C>T (R145X), represents 43% of pathogenic alleles and a common haplotype was identified."
      explanation: Quantifies the recurrence of this allele among cblA pathogenic alleles.
    - reference: PMID:24095221
      reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report on a patient with a vitamin B12-responsive cobalamin A type (cblA) MMA-uria caused by a homozygous stop mutation (p.R145X) in the cobalamin A gene (MMAA)."
      explanation: Documents the same allele in the homozygous state in a molecularly confirmed cblA patient.
  - name: Missense alleles at conserved residues
    description: >-
      A minority allele class that is mechanistically the most informative. The protein is
      made and retains intrinsic GTPase activity, but cannot engage the mutase or gate
      cofactor transfer, and about a third of these alleles additionally destabilise the
      protein.
    evidence:
    - reference: PMID:28497574
      reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "About a third confer instability to the recombinant protein in bacterial and human expression systems."
      explanation: Quantifies the destabilising fraction among patient missense alleles tested in expression systems.
  evidence:
  - reference: PMID:12438653
    reference_title: Identification of the gene responsible for the cblA complementation group of vitamin B12-responsive methylmalonic acidemia based on analysis of prokaryotic gene arrangements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is located on chromosome 4q31.1-2 and encodes a predicted protein of 418 aa."
    explanation: Establishes the locus and product size of MMAA.
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present 67 new patients with cblA-type MMA, identifying 19 novel mutations."
    explanation: Establishes the size of the reported patient and allele series for this gene.
biochemical:
- name: Methylmalonic acid
  presence: Increased
  context: >-
    The defining analyte. Plasma and urine concentrations are elevated but significantly
    lower in cblA than in mutase-deficient disease, and fall substantially on
    hydroxocobalamin, which makes it both the diagnostic marker and the treatment monitor.
  biomarker_term:
    preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
  readouts:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reports the systemic methylmalonate burden produced by the residual mutase block.
    evidence:
    - reference: PMID:32754920

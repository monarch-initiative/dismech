- name: Basal ganglia injury
  biological_scale: TISSUE
  description: >-
    Acute metabolic crises can produce basal-ganglia injury and a subsequent movement disorder
    in cblA. A normal examination despite basal-ganglia MRI signal changes in two adults shows
    that an imaging abnormality alone does not determine clinical impairment.

- name: Secondary impairment of ureagenesis
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Propionyl-CoA inhibition of N-acetylglutamate synthase can reduce the N-acetylglutamate
    required to activate carbamoyl-phosphate synthetase I. Rat liver extract experiments support
    this candidate route to hyperammonemia in organic acidemias. Its quantitative contribution
    in MMAA deficiency is unmeasured, and other mechanisms of urea-cycle impairment may contribute.
  evidence:
  - reference: PMID:500823
    reference_title: >-
      Inhibition by propionyl-coenzyme A of N-acetylglutamate synthetase in rat liver mitochondria.
      A possible explanation for hyperammonemia in propionic and methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A decreased level of N-acetylglutamate in liver mitochondria that would follow inhibition
      of N-acetylglutamate synthetase by propionyl-CoA would be expected to lead to hyperammonemia.
    explanation: The authors infer reduced ammonia clearance from their rat mitochondrial biochemical
      results.
    directness: INDIRECT
  downstream:
  - target: Hyperammonemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced urea-cycle ammonia clearance is a plausible contributor to secondary
      hyperammonemia in cblA.
    intermediate_mechanisms:
    - reduced N-acetylglutamate activation of carbamoyl-phosphate synthetase I
    - reduced urea-cycle ammonia disposal

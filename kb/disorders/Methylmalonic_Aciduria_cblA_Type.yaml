phenotypes:
- name: Methylmalonic aciduria
  category: Biochemical
  description: >-
    Elevated urinary methylmalonic acid is the defining biochemical finding, present in all
    five patients at diagnosis in the Polish MMAA-confirmed series. Levels depend on treatment
    and renal function; normalization can occur with treatment.
  phenotype_term:
    preferred_term: Methylmalonic aciduria
    term:
      id: HP:0012120
      label: Methylmalonic aciduria
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant excretion of methylmalonic acid in urine and metabolic acidosis traits with significantly increased anionic gap were observed in all patients."
    explanation: Methylmalonic aciduria was present in every patient of this MMAA-genotyped series.
  reports_on:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    relationship: READOUT_OF
    interpretation: >-
      Urinary MMA measures metabolite accumulation; it is not an additional causal consequence
      distinct from that accumulation.
- name: Decreased methylmalonyl-CoA mutase activity
  category: Biochemical
  description: >-
    Reduced effective cellular mutase-pathway activity is reflected by low propionate incorporation
    that improves with hydroxocobalamin. This does not imply deficient cofactor-saturated MMUT
    apoenzyme activity: the latter was normal in the tested adult cblA patient.
  phenotype_term:
    preferred_term: Decreased methylmalonyl-CoA mutase activity
    term:
      id: HP:0003210
      label: Decreased methylmalonyl-CoA mutase activity
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enzymatic studies of her fibroblasts showed a deficit in propionate incorporation (1.61
      nmol/mg prot/16 h vs. 6.08 nmol/mg prot/16 h in the experimental control; range in controls
      3.5–24.4) with a clear increase after B12 supplementation (11.7 nmol/mg prot/16 h vs.
      7.79 nmol/mg prot/16 h in the experimental control; range in controls 4.33–28.9), and
      normal MCM activity (measured with excess of AdoCbl), indicating a B12‐responsive defect
      of AdoCbl synthesis.
    explanation: >-
      Diagnostic cell studies in an MMAA-confirmed adult show impaired pathway flux with intact
      cofactor-supplemented apoenzyme activity.
  reports_on:
  - target: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
    relationship: READOUT_OF
    interpretation: >-
      Functional assay readout of cofactor-dependent pathway impairment; assay conditions and
      exogenous cofactor matter.
- name: Episodic metabolic acidosis
  category: Biochemical
  description: >-
    High-anion-gap acidosis occurred at diagnosis in all five Polish cblA patients, while none
    had acidosis at follow-up under treatment. Recurrent infection-triggered episodes were also
    documented in an MMAA-confirmed child. This is not a claim of persistent acidosis between
    crises.
  phenotype_term:
    preferred_term: Episodic high-anion-gap metabolic acidosis
    term:
      id: HP:0004911
      label: Episodic metabolic acidosis
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant excretion of methylmalonic acid in urine and metabolic acidosis traits with significantly increased anionic gap were observed in all patients."
    explanation: Records metabolic acidosis with increased anion gap in all five MMAA patients.
  - reference: PMID:34915869
    reference_title: >-
      Genetic testing is necessary for correct diagnosis and treatment in patients with isolated
      methylmalonic aciduria: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic decompensations occurred rarely (3-times during the 8-years of follow-up), and
      they were always provoked by an acute infection, accompanied by mild metabolic acidosis,
      mild hyperammonaemia, and a higher concentration of methylmalonic acid in urine.
    explanation: Patient 2 had homozygous MMAA p.Leu89Pro; the sentence documents recurrent
      episodic acidosis in cblA.

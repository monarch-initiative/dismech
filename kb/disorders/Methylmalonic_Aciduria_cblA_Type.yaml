name: Methylmalonic Aciduria, cblA Type
creation_date: "2026-08-31T10:30:00Z"
category: Mendelian
description: >-
  cblA is the complementation group in which isolated methylmalonic aciduria arises not
  from a broken enzyme but from a broken hand-off. MMAA is a mitochondrial G-protein that
  never touches methylmalonyl-CoA. Its job is to stand between the adenosyltransferase
  MMAB, which makes adenosylcobalamin, and methylmalonyl-CoA mutase (MMUT), which consumes
  it, and to decide when the cofactor is transferred. It does this twice over: it gates
  the loading of adenosylcobalamin onto the apo-mutase in a GTP-dependent cycle, and then,
  once catalysis has begun, it guards the bound cofactor against oxidative damage and
  exchanges the inactivated cobalamin for a fresh one. MMAA is therefore a cofactor
  quality-control device, and cblA is what a metabolic pathway looks like when that device
  fails while every enzyme in the pathway remains intact.

  This distinction is not decorative, because it explains the two things that separate
  cblA from the mutase-deficient forms of isolated methylmalonic acidemia. The first is
  that the biochemical lesion is bypassable: flooding the mitochondrion with cobalamin
  drives adenosylcobalamin onto the mutase by mass action even when the gatekeeper cannot
  present it, which is why cblA is the most reliably vitamin B12-responsive form of
  isolated methylmalonic acidemia and why almost every patient tested has proven
  responsive. The second is that the failure is partial rather than absolute, so
  methylmalonate loads are lower, renal function is better preserved, and survival is
  better than in mut-type or cblB disease.

  What the missense alleles reveal is more specific still. Purified mutant MMAA proteins
  retain essentially normal intrinsic GTPase activity; what they lose is the ability to
  have that activity stimulated by the mutase, to bind the mutase physically, or to gate
  the transfer of adenosylcobalamin from MMAB. Roughly a third are additionally unstable.
  cblA is thus a disease of a lost protein-protein interaction rather than a lost
  enzymatic activity, which is an unusual mechanism for an organic aciduria and part of
  the reason the disorder is curated in its own right rather than folded into the mutase
  entry.

  The clinical consequence of a partially bypassable defect is a disease that is real but
  attenuated, and one that is easy to under-recognise. Presentation is usually infantile
  metabolic crisis, but about a third of patients never present acutely and instead
  surface later with chronic kidney disease, intellectual disability, or growth failure.
  Cobalamin replacement is genuinely disease-modifying and appears to protect the kidney,
  yet it does not abolish long-term neurodevelopmental impairment or renal decline, so
  cblA remains a chronic disease under treatment rather than a corrected one.
disease_term:
  preferred_term: methylmalonic aciduria, cblA type
  term:
    id: MONDO:0009613
    label: methylmalonic aciduria, cblA type
synonyms:
- cblA
- cblA-type methylmalonic aciduria
- cobalamin A deficiency
- MMAA deficiency
- methylmalonic acidemia, cblA type
- vitamin B12-responsive methylmalonic aciduria type cblA
parents:
- Inborn Disorder of Cobalamin Metabolism and Transport
- Methylmalonic Acidemia
classifications:
  icimd_category:
  - classification_value: cobalamin_metabolism
    notes: >-
      ICIMD "Disorders of cobalamin (vitamin B12) metabolism", within the vitamin and
      cofactor metabolism category. The lesion is in adenosylcobalamin handling, not in a
      mitochondrial catabolic enzyme. Note this deliberately differs from the assignment
      on the parent entry `kb/disorders/Methylmalonic_Acidemia.yaml`, which carries
      `organic_acidurias`. That group is defined in the schema as "deficiencies of
      mitochondrial enzymes for breakdown of CoA-activated small carboxylic acids", and
      cblA is not an enzyme deficiency; every enzyme of the propionate pathway is intact
      and the defect is in cofactor delivery to one of them. The umbrella assignment is
      correct for mutase-deficient MMA and is not disputed here.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic MMAA variants. The majority of reported cblA alleles are premature
    termination codons, with a single nonsense allele accounting for a large share of the
    mutant chromosomes.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All forms of isolated MMA are inherited in an autosomal"
    explanation: GeneReviews states the inheritance mode for the isolated MMA group, of which cblA is a member.
  - reference: PMID:17957493
    reference_title: "Methylmalonic acidaemia: examination of genotype and biochemical data in 32 patients belonging to mut, cblA or cblB complementation group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the cblA patients carried premature termination codons (PTC) in both alleles."
    explanation: Documents the biallelic, predominantly truncating allele architecture in the cblA subgroup of this cohort.
prevalence:
- population: Published cblA case literature, worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate specific to cblA has been published. The cited
    review counts fewer than 200 reported patients worldwide, which is the only
    quantitative statement of disease frequency available for this entity, so the coarse
    ULTRA_RARE band is recorded rather than a numeric rate that no source supports. The
    share-of-cases figure, roughly a fifth of isolated methylmalonic acidemia, is recorded
    on the MMAA genetic record as a `case_fractions` entry, which is the correct slot for
    a genetic-spectrum share and must not be read as a population rate.
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, <200 patients with phenotype of cblA-type MMA have been described in the literature"
    explanation: Gives the only published count of reported cblA patients, supporting an ultra-rare classification.
pathophysiology:
- name: Biallelic MMAA Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of MMAA, on chromosome 4q31, remove or cripple the mitochondrial
    G-protein that chaperones adenosylcobalamin onto methylmalonyl-CoA mutase. Most
    reported alleles are premature termination codons; the remainder are missense changes
    at conserved residues, and roughly a third of those destabilise the protein in
    expression systems.
  genes:
  - preferred_term: MMAA
    term:
      id: hgnc:18871
      label: MMAA
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Loss of MMAA-Mutase Functional Interaction
    causal_link_type: DIRECT
    description: >-
      Truncating alleles remove the protein outright; missense alleles leave a protein
      that is present but cannot engage the mutase.
  evidence:
  - reference: PMID:12438653
    reference_title: Identification of the gene responsible for the cblA complementation group of vitamin B12-responsive methylmalonic acidemia based on analysis of prokaryotic gene arrangements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that the identified gene, MMAA, corresponds to the cblA complementation group."
    explanation: Establishes MMAA as the gene defective in the cblA complementation group.
  - reference: PMID:15523652
    reference_title: Mutations in the MMAA gene in patients with the cblA disorder of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 13 mutations result in premature stop codons; three are splice site defects; and six are missense mutations that occur at highly conserved residues."
    explanation: Describes the allele classes underlying loss of MMAA function in cblA patients.
- name: Loss of MMAA-Mutase Functional Interaction
  biological_scale: MOLECULAR
  description: >-
    The mechanistically decisive step, and the one that distinguishes cblA from an enzyme
    deficiency. MMAA's own GTPase activity is largely preserved in patient missense
    proteins; what is lost is the productive complex with methylmalonyl-CoA mutase. Mutant
    proteins fail to have their GTPase activity stimulated by the mutase, and a subset can
    no longer bind it at all.
  molecular_functions:
  - preferred_term: MMAA GTPase activity stimulated by methylmalonyl-CoA mutase
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  downstream:
  - target: Failure of Adenosylcobalamin Gating onto Methylmalonyl-CoA Mutase
    causal_link_type: DIRECT
    description: >-
      Gating requires the MMAA-mutase complex; without it the transfer step cannot be
      licensed.
  - target: Failure of Holoenzyme Cofactor Protection and Reactivation
    causal_link_type: DIRECT
    description: >-
      The protective and cofactor-exchange functions are likewise exerted through the
      complex, so both arms of MMAA function fail together.
  evidence:
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, all mutations strongly decreased functional association with MUT by reducing GTPase activity stimulation upon incubation with MUT, while nine mutant proteins additionally lost the ability to physically bind MUT."
    explanation: Purified patient-derived mutant proteins lose the functional and physical association with the mutase, which is the claim of this node.
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All 15 purified mutant proteins demonstrated wild-type like intrinsic GTPase activity and only one (p.Asp292Val), where the mutation is in the GTP binding domain, revealed decreased GTP binding."
    explanation: Establishes that intrinsic catalytic activity is retained, so the lesion is in the interaction rather than in the GTPase chemistry itself.
  - reference: PMID:20876572
    reference_title: Structures of the human GTPase MMAA and vitamin B12-dependent methylmalonyl-CoA mutase and insight into their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The physiological importance of this interaction is highlighted by a recently identified homoallelic patient mutation of MMAA, G188R, which, we show, retains basal GTPase activity but has abrogated interaction."
    explanation: An independent patient allele shows the same dissociation of preserved GTPase activity from abolished complex formation.
  - reference: PMID:37468522
    reference_title: Architecture of the human G-protein-methylmalonyl-CoA mutase nanoassembly for B(12) delivery and repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The complex, stabilized by MMAA wedging between two MMUT domains, leads to ordering of the switch I and III loops, revealing the molecular basis of mutase-dependent GTPase activation."
    explanation: The human co-crystal structure shows how MMAA engages the mutase and why that engagement is what activates its GTPase, which is the interaction this node reports as lost.
  - reference: PMID:37468522
    reference_title: Architecture of the human G-protein-methylmalonyl-CoA mutase nanoassembly for B(12) delivery and repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The structure explains the biochemical penalties incurred by methylmalonic aciduria-causing mutations that reside at the MMAA-MMUT interfaces we identify here."
    explanation: Places the disease-causing alleles at the MMAA-mutase interface itself, which is the structural counterpart of the biochemical interaction loss.
- name: Failure of Adenosylcobalamin Gating onto Methylmalonyl-CoA Mutase
  biological_scale: MOLECULAR
  description: >-
    In health, MMAA favours complex formation with the apo-mutase, licenses transfer of
    adenosylcobalamin from the adenosyltransferase MMAB, and then releases the loaded
    holoenzyme in a GTP-dependent cycle. In cblA this gating step fails, so
    adenosylcobalamin is made but not installed.
  biological_processes:
  - preferred_term: mitochondrial adenosylcobalamin handling
    term:
      id: GO:0009235
      label: cobalamin metabolic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: cobalamin binding by the mutase holoenzyme
    term:
      id: GO:0031419
      label: cobalamin binding
    modifier: DECREASED
  downstream:
  - target: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
    causal_link_type: DIRECT
    description: >-
      An apo-mutase that never receives its cofactor is catalytically inert regardless of
      how much intact mutase protein is present.
  evidence:
  - reference: PMID:20876572
    reference_title: Structures of the human GTPase MMAA and vitamin B12-dependent methylmalonyl-CoA mutase and insight into their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, our data point to a gatekeeping role for MMAA by favoring complex formation with MUT apoenzyme for AdoCbl assembly and releasing the AdoCbl-loaded holoenzyme from the complex, in a GTP-dependent manner."
    explanation: States the gatekeeping model for adenosylcobalamin assembly onto the mutase that this node describes.
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, all mutations interfered with gating the transfer of AdoCbl from MMAB to MUT."
    explanation: Every tested patient missense allele disrupts the gating step, which is the specific failure asserted here.
  - reference: PMID:19955418
    reference_title: A G-protein editor gates coenzyme B12 loading and is corrupted in methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While the GTP-binding energy is needed for the editing function; that is, to discriminate between active and inactive cofactor forms, the chemical energy of GTP hydrolysis is required for gating cofactor transfer."
    explanation: Separates the two nucleotide requirements of the gating cycle. This was established in the bacterial MeaB orthologue rather than in human MMAA, so it is cited for the mechanism of gating and not as a cblA genotype result.
- name: Failure of Holoenzyme Cofactor Protection and Reactivation
  biological_scale: MOLECULAR
  description: >-
    Adenosylcobalamin is destroyed slowly during normal mutase turnover, accumulating as
    the oxidised hydroxocobalamin form and inactivating the enzyme. MMAA both slows that
    oxidation while in complex with the mutase and, once inactivation has occurred,
    removes the damaged cofactor through GTP hydrolysis so a fresh one can be installed.
    Loss of MMAA therefore leaves the mutase progressively self-inactivating.
  molecular_functions:
  - preferred_term: methylmalonyl-CoA mutase activity
    term:
      id: GO:0004494
      label: methylmalonyl-CoA mutase activity
    modifier: DECREASED
  downstream:
  - target: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
    causal_link_type: DIRECT
    description: >-
      Cumulative cofactor damage that is never repaired compounds the initial loading
      failure.
  evidence:
  - reference: PMID:28943303
    reference_title: Human MMAA induces the release of inactive cofactor and restores methylmalonyl-CoA mutase activity through their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the formation and accumulation of OH2Cbl, the oxidized form of the AdoCbl cofactor formed during catalysis, is the cause of hMCM inactivation"
    explanation: Identifies oxidative cofactor damage during catalysis as the process MMAA counteracts.
  - reference: PMID:28943303
    reference_title: Human MMAA induces the release of inactive cofactor and restores methylmalonyl-CoA mutase activity through their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, an inactive model of hMCM was used to demonstrate that hMMAA is able to remove the damaged cofactor through GTP hydrolysis."
    explanation: Demonstrates the cofactor-exchange repair function whose loss this node asserts.
  - reference: PMID:21138732
    reference_title: Protection and reactivation of human methylmalonyl-CoA mutase by MMAA protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When it was added at the beginning of the reaction, it prevents inactivation by guarding MCM. After 60 min of reaction, when MCM is inactive, the addition of MMAA increases the enzymatic activity through GTP hydrolysis, indicating reactivation of MCM by exchange of the damaged cofactor."
    explanation: Establishes the dual protective and reactivating roles of MMAA on the mutase in a purified system.
  - reference: PMID:19955418
    reference_title: A G-protein editor gates coenzyme B12 loading and is corrupted in methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The G protein chaperone also exerts its editing function during turnover by using the binding energy of GTP to elicit release of inactive cofactor that is occasionally formed during the catalytic cycle of MCM."
    explanation: States the during-turnover editing function whose loss this node asserts. Established in the bacterial MeaB orthologue, so it is cited for the conserved mechanism rather than as a human cblA measurement.
- name: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
  biological_scale: CELLULAR
  description: >-
    The convergence point with mutase-deficient methylmalonic acidemia. Functional mutase
    activity falls, but because the apoenzyme is structurally normal and the block is in
    cofactor supply, residual activity is typically higher than in mut0 disease and is
    recoverable by raising intracellular cobalamin.
  molecular_functions:
  - preferred_term: methylmalonyl-CoA mutase activity
    term:
      id: GO:0004494
      label: methylmalonyl-CoA mutase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: propionate catabolic process
    term:
      id: GO:0019543
      label: propionate catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  downstream:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    causal_link_type: DIRECT
    description: >-
      Methylmalonyl-CoA that cannot be isomerised to succinyl-CoA is hydrolysed to
      methylmalonic acid, and propionyl-CoA backs up behind it.
  evidence:
  - reference: PMID:10882753
    reference_title: "Complementation studies in the cblA class of inborn error of cobalamin metabolism: evidence for interallelic complementation and for a new complementation class (cblH)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cblA disorder is characterised by vitamin B12 (cobalamin) responsive methylmalonic aciduria and deficient synthesis of adenosylcobalamin, required for activity of the mitochondrial enzyme methylmalonyl CoA mutase."
    explanation: States that deficient adenosylcobalamin synthesis in cblA impairs mutase activity, which is this node's claim.
  - reference: PMID:17957493
    reference_title: "Methylmalonic acidaemia: examination of genotype and biochemical data in 32 patients belonging to mut, cblA or cblB complementation group."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, the transcripts containing the PTC mutations were insensitive to nonsense-mediated decay (NMD)."
    explanation: Cell-based transcript analysis showing the truncating cblA alleles escape nonsense-mediated decay, so the functional deficit reflects the protein product rather than transcript loss.
- name: Methylmalonic Acid and Propionyl-CoA Accumulation
  biological_scale: ORGANISM
  description: >-
    Systemic accumulation of methylmalonic acid and the upstream propionyl-CoA pool. In
    cblA the load is measurably lower than in mutase deficiency, which is the biochemical
    correlate of the milder course and of the partially bypassable block.
  chemical_entities:
  - preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
    modifier: INCREASED
  - preferred_term: propionyl-CoA
    term:
      id: CHEBI:15539
      label: propionyl-CoA
    modifier: INCREASED
  downstream:
  - target: Acute Metabolic Decompensation
    causal_link_type: DIRECT
    description: >-
      Catabolic stress raises propiogenic substrate flux beyond the residual mutase
      capacity.
  - target: Renal Tubulointerstitial Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic methylmalonate exposure is associated with progressive tubulointerstitial
      damage; the molecular mediators are not established.
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic and crisis-associated metabolite exposure underlies the neurodevelopmental
      morbidity of the disorder.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methylmalonic acidemia (MMA) levels in urine and plasma were significantly lower in cblA."
    explanation: Quantifies the lower metabolite burden in cblA relative to mut-type disease in a registry comparison of 28 cblA and 95 mut patients.
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant excretion of methylmalonic acid in urine and metabolic acidosis traits with significantly increased anionic gap were observed in all patients."
    explanation: Documents methylmalonate accumulation in every patient of a purely MMAA-genotyped series.
- name: Acute Metabolic Decompensation
  biological_scale: ORGANISM
  description: >-
    Episodic metabolic crisis with ketoacidosis, vomiting and encephalopathy, precipitated
    by catabolic stress such as intercurrent illness, fasting or protein load. This is the
    usual route to diagnosis in cblA as in mutase deficiency.
  biological_processes:
  - preferred_term: propionate catabolic process
    term:
      id: GO:0019543
      label: propionate catabolic process
    modifier: DECREASED
  downstream:
  - target: Neurologic Injury
    causal_link_type: DIRECT
    description: >-
      Crisis-associated encephalopathy is a direct contributor to fixed neurological
      deficit.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic crisis is the predominant symptom leading to diagnosis in both groups."
    explanation: Establishes metabolic crisis as the dominant presenting event in the cblA arm of this registry study.
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset was mostly pediatric (78% < 1 year, median = 4 months) with acute neurologic deterioration (65%)."
    explanation: Characterises the acute presentation and its timing in an entirely cblA case series.
- name: Renal Tubulointerstitial Injury
  biological_scale: TISSUE
  description: >-
    Chronic tubulointerstitial disease progressing to chronic kidney failure. In cblA this
    is the most consequential long-term complication, but it is markedly less frequent and
    later in onset than in mut0 or cblB disease, and appears to be attenuated by early
    cobalamin replacement.
  cell_types:
  - preferred_term: proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:24095221
    reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney biopsies showed non-specific manifestations of chronic interstitial inflammation."
    explanation: Histological confirmation of interstitial renal disease in a molecularly confirmed cblA patient.
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glomerular filtration rate was significantly higher in cblA; and as a consequence, chronic renal failure and related complications were significantly less frequent and renal function could be preserved even in older patients."
    explanation: Establishes that renal involvement occurs in cblA but is less severe than in mut-type disease.
- name: Neurologic Injury
  biological_scale: TISSUE
  description: >-
    Fixed neurodevelopmental impairment, accrued both through crisis-associated
    encephalopathy and through chronic metabolite exposure. Unlike the renal arm, it is
    not clearly modified by the timing of cobalamin replacement.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main long-term problems were intellectual disability (39%) and renal failure (30%)."
    explanation: Quantifies the neurological and renal long-term burden in an entirely cblA cohort.
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological complications were predominantly found in the mut subgroup."
    explanation: Bounds the claim by showing neurological complications are less characteristic of cblA than of mut-type disease in direct comparison.
phenotypes:
- name: Methylmalonic aciduria
  category: Biochemical
  description: >-
    Elevated urinary methylmalonic acid excretion, present in all reported cblA patients
    and the biochemical hallmark of the disorder.
  phenotype_term:
    preferred_term: Methylmalonic aciduria
    term:
      id: HP:0012120
      label: Methylmalonic aciduria
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant excretion of methylmalonic acid in urine and metabolic acidosis traits with significantly increased anionic gap were observed in all patients."
    explanation: Methylmalonic aciduria was present in every patient of this MMAA-genotyped series.
- name: Decreased methylmalonyl-CoA mutase activity
  category: Biochemical
  description: >-
    Functional mutase deficiency measured in patient cells, arising from cofactor
    unavailability rather than from a defect in the mutase itself, and correctable in
    vitro by hydroxocobalamin.
  phenotype_term:
    preferred_term: Decreased methylmalonyl-CoA mutase activity
    term:
      id: HP:0003210
      label: Decreased methylmalonyl-CoA mutase activity
  evidence:
  - reference: PMID:10882753
    reference_title: "Complementation studies in the cblA class of inborn error of cobalamin metabolism: evidence for interallelic complementation and for a new complementation class (cblH)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cblA disorder is characterised by vitamin B12 (cobalamin) responsive methylmalonic aciduria and deficient synthesis of adenosylcobalamin, required for activity of the mitochondrial enzyme methylmalonyl CoA mutase."
    explanation: Defines the cellular phenotype of the cblA class as deficient adenosylcobalamin synthesis compromising mutase activity.
- name: Metabolic acidosis
  category: Biochemical
  description: >-
    High-anion-gap metabolic acidosis, typically during decompensation but also detectable
    between crises.
  phenotype_term:
    preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant excretion of methylmalonic acid in urine and metabolic acidosis traits with significantly increased anionic gap were observed in all patients."
    explanation: Records metabolic acidosis with increased anion gap in all five MMAA patients.
- name: Vomiting
  category: Gastrointestinal

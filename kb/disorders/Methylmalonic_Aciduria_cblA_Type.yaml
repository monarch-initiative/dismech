genetic:
- name: MMAA
  relationship_type: CAUSATIVE
  features: >-
    MMAA encodes a 418-residue mitochondrial G-protein that chaperones adenosylcobalamin
    onto methylmalonyl-CoA mutase. Biallelic loss-of-function variants define the cblA
    complementation group. The allele spectrum is dominated by premature termination
    codons, and one nonsense allele, c.433C>T (p.Arg145Ter), accounts for a large fraction
    of mutant chromosomes.
  gene_term:
    preferred_term: MMAA
    term:
      id: hgnc:18871
      label: MMAA
  frequency: approximately 20% of isolated methylmalonic acidemia
  case_fractions:
  - population: Isolated methylmalonic acidemia, literature estimate
    case_fraction_percent: 20.0
    notes: >-
      Share of isolated methylmalonic acidemia attributable to cblA, quoted as an
      approximate literature figure rather than derived from a single genotyped cohort.
    evidence:
    - reference: PMID:31921599
      reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "is responsible for approx. 20% of causes of isolated MMA (OMIM #251100)."
      explanation: States the proportion of isolated methylmalonic acidemia caused by cblA.
  variants:
  - name: c.433C>T (p.Arg145Ter)
    description: >-
      Recurrent nonsense allele on a common haplotype, reported as 43% of pathogenic
      alleles in the founding mutation survey and seen in the homozygous state in
      long-followed patients.
    evidence:
    - reference: PMID:15523652
      reference_title: Mutations in the MMAA gene in patients with the cblA disorder of vitamin B12 metabolism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One mutation, c.433C>T (R145X), represents 43% of pathogenic alleles and a common haplotype was identified."
      explanation: Quantifies the recurrence of this allele among cblA pathogenic alleles.
    - reference: PMID:24095221
      reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report on a patient with a vitamin B12-responsive cobalamin A type (cblA) MMA-uria caused by a homozygous stop mutation (p.R145X) in the cobalamin A gene (MMAA)."
      explanation: Documents the same allele in the homozygous state in a molecularly confirmed cblA patient.
  - name: Missense alleles at conserved residues
    description: >-
      A minority allele class that is mechanistically the most informative. The protein is
      made and retains intrinsic GTPase activity, but cannot engage the mutase or gate
      cofactor transfer, and about a third of these alleles additionally destabilise the
      protein.
    evidence:
    - reference: PMID:28497574
      reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "About a third confer instability to the recombinant protein in bacterial and human expression systems."
      explanation: Quantifies the destabilising fraction among patient missense alleles tested in expression systems.
  evidence:
  - reference: PMID:12438653
    reference_title: Identification of the gene responsible for the cblA complementation group of vitamin B12-responsive methylmalonic acidemia based on analysis of prokaryotic gene arrangements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is located on chromosome 4q31.1-2 and encodes a predicted protein of 418 aa."
    explanation: Establishes the locus and product size of MMAA.
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present 67 new patients with cblA-type MMA, identifying 19 novel mutations."
    explanation: Establishes the size of the reported patient and allele series for this gene.
biochemical:
- name: Methylmalonic acid
  presence: Increased
  context: >-
    The defining analyte. Plasma and urine concentrations are elevated but significantly
    lower in cblA than in mutase-deficient disease, and fall substantially on
    hydroxocobalamin, which makes it both the diagnostic marker and the treatment monitor.
  biomarker_term:
    preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
  readouts:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reports the systemic methylmalonate burden produced by the residual mutase block.
    evidence:
    - reference: PMID:32754920
      reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Methylmalonic acidemia (MMA) levels in urine and plasma were significantly lower in cblA."
      explanation: Establishes the direction and the cblA-versus-mut contrast for this analyte.
  evidence:
  - reference: PMID:24095221
    reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following re-evaluation, the patient received vitamin B12 (hydroxocobalamin) treatment, resulting in a significant decrease in the concentration of methylmalonic acid (MMA) in urine and plasma."
    explanation: Shows the analyte responds to cobalamin, which is what makes it the treatment-monitoring marker in cblA.
- name: Propionylcarnitine (C3)
  presence: Increased
  context: >-
    The newborn-screening analyte. Raised C3 on a dried blood spot is what flags isolated
    methylmalonic acidemia before the subtype is known; it does not distinguish cblA from
    the other forms, which is why molecular testing follows.
  biomarker_term:
    preferred_term: propionylcarnitine
    term:
      id: CHEBI:53210
      label: O-propanoyl-L-carnitine
  readouts:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Reports the propionyl-CoA pool that backs up behind the mutase block.
    evidence:
    - reference: PMID:31921599
      reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "elevated levels of propionylcarnitine (C3-carnitine) and/or methylmalonylcarnitine (C4DC-carnitine) are found"
      explanation: Names the acylcarnitine species raised in methylmalonic acidemia on tandem mass spectrometry.
- name: 2-Methylcitric acid
  presence: Increased
  context: >-
    A confirmatory urinary organic acid, formed when accumulated propionyl-CoA condenses
    with oxaloacetate. Measured alongside methylmalonic acid on the organic acid profile.
  biomarker_term:
    preferred_term: methylcitric acid
    term:
      id: CHEBI:30835
      label: 2-methylcitric acid
  readouts:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Second-line marker of the same propionyl-CoA accumulation, independent of methylmalonate itself.
    evidence:
    - reference: PMID:31921599
      reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "methylmalonic acid, methylcytric acid, 3-hydroxypropionic acid are primarily detected"
      explanation: Lists the urinary organic acids detected in methylmalonic acidemia, quoted verbatim including the source's spelling of methylcitric acid.
diagnosis:
- name: Molecular confirmation in MMAA
  description: >-
    Identification of biallelic pathogenic MMAA variants. Molecular testing has largely
    displaced complementation and enzymatic assays for establishing the cblA diagnosis,
    although historically the group was defined by somatic cell complementation.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of isolated MMA is established in a proband by identification of biallelic
      pathogenic variants in MCEE, MMAA, MMAB, MMADHC, or MMUT
    explanation: GeneReviews states that biallelic MMAA variants establish the diagnosis of isolated methylmalonic acidemia.
- name: Plasma and urine methylmalonic acid
  description: >-
    Plasma and urine methylmalonic acid support diagnosis and monitoring. A chronic, nonacute
    presentation occurred in 8/23 adults, whereas 4/23 never had an acute decompensation. Unexplained
    renal, developmental or growth findings can therefore warrant MMA testing outside a metabolic
    crisis.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm that about 35% of the patients do not present acutely, underlining the importance of measuring MMA in any case of unexplained chronic renal failure, intellectual disability, or growth delay."
    explanation: States the indication for measuring methylmalonic acid outside the acute setting in cblA.
treatments:
- name: Parenteral hydroxocobalamin
  description: >-
    Parenteral hydroxocobalamin is the principal cblA treatment. Responsiveness was reported
    in 27/28 registry patients, but historical clinical response assessments sometimes misclassified
    patients. Pharmacologic cobalamin can improve cofactor availability and cellular pathway
    flux; a mass-action bypass of one specific MMAA step is not established for every genotype.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Failure of Adenosylcobalamin Gating onto Methylmalonyl-CoA Mutase
    description: >-
      Improving cobalamin availability can restore deficient adenosylcobalamin-dependent function
      despite the MMAA defect; the exact rescue route is not established for each allele.
    evidence:
    - reference: PMID:27858373
      reference_title: Vitamin B(12) Administration by Subcutaneous Catheter Device in a Cobalamin A (cblA) Patient.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Hydroxocobalamin (OHCbl) is the cornerstone of cblA treatment because vitamin B12 may completely restore AdoCbl deficiency."
      explanation: States the mechanism by which hydroxocobalamin acts on the adenosylcobalamin supply defect in cblA.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "27/28 cblA patients were reported to be responsive to cobalamin, only 86% of cblA patients were treated with i.m. hydroxocobalamin."
    explanation: Quantifies cobalamin responsiveness in the cblA arm of the registry and shows a treatment gap against it.
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Most of the patients (61%) were initially classified as vitamin B12-unresponsive methylmalonic aciduria (MMA); in vitro B12 responsiveness was subsequently found in all the tested patients (n = 13)."
    explanation: >-
      Thirteen tested fibroblast lines were responsive in vitro, including patients previously
      classified clinically as unresponsive; in vitro responsiveness does not invariably predict
      clinical response.
  - reference: PMID:27858373
    reference_title: Vitamin B(12) Administration by Subcutaneous Catheter Device in a Cobalamin A (cblA) Patient.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parenteral administration, intravenous, subcutaneous or intramuscular, is generally required to achieve effect."
    explanation: Establishes the route requirement for effective cobalamin therapy in cblA.
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a mutation in the MMAA gene are sensitive to treatment with hydroxocobalamine, but the inclusion of appropriate treatment does not protect against neurodevelopmental disorders and chronic kidney disease."
    explanation: >-
      All five patients were responsive but had cognitive impairment and three had CKD. This
      uncontrolled cohort demonstrates residual morbidity, not absence of treatment benefit.
- name: Early cobalamin replacement for renal protection
  description: >-
    Early B12 treatment was associated with less severe renal disease in a retrospective series
    of adults. The initial-treatment comparison included 22 childhood-onset patients; 1/7 initially
    treated with B12 developed late moderate renal failure. Small groups, historical treatment
    variability and survivor selection prevent a causal estimate or exclusion of neurodevelopmental
    benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Renal Tubulointerstitial Injury
    description: >-
      Lowering the lifetime methylmalonate burden is the proposed route by which early
      replacement slows progression of tubulointerstitial disease.
    evidence:
    - reference: PMID:35618652
      reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Intellectual disability was equally distributed among the initial treatment groups, while renal failure (moderate and beginning at the age of 38 years) was present in only one out of seven patients initially treated with B12."
      explanation: >-
        Observational comparison among initial-treatment groups; similar cognitive outcomes
        do not establish absence of neurological benefit.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early B12 supplementation seems to protect from severe renal insufficiency."
    explanation: The authors' own hedged statement of the renal-protection effect, quoted with its hedge intact.
  - reference: PMID:24095221
    reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further investigation will be necessary to prove the protective effect of hydroxocobalamin in the kidney in vitamin B12-responsive patients."
    explanation: An explicit statement that the renal protective effect is not yet proven, recorded here so the claim is not overstated.
- name: Natural protein restriction with propiogenic precursor limitation
  description: >-
    Restriction of natural protein, particularly the propiogenic amino acid precursors, on
    a high-calorie diet. Used in about three-quarters of cblA patients, notably less than
    in mut-type disease, reflecting the lesser metabolite burden.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    description: >-
      Limiting propiogenic substrate entry reduces the flux that the residual mutase
      capacity must handle.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        restrict natural protein, particularly of propiogenic amino acid precursors, while maintaining
        a high-calorie diet
      explanation: States the dietary principle in propiogenic precursor terms.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 73% of cblA and 98% of mut patients followed a calculated diet with amino acid supplements in 27% (cblA) and 69% (mut)."
    explanation: Quantifies dietary treatment uptake specifically in the cblA arm against the mut arm.
- name: Emergency management of acute decompensation
  description: >-
    Anticatabolic emergency treatment during metabolic crisis, aimed at averting catabolism
    and limiting central nervous system injury, together with avoidance of the fasting,
    stress and protein-load precipitants. This applies to cblA as to the other isolated
    methylmalonic acidemias, since metabolic crisis remains the dominant presenting event.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute Metabolic Decompensation
    description: >-
      Reversing the catabolic state removes the substrate load that precipitated the
      crisis.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        provide emergency treatment during episodes of acute decompensation with the goal of
        averting catabolism and minimizing central nervous system injury.
      explanation: States the goal of emergency management in terms of the decompensation mechanism it targets.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Fasting, stress, increased dietary protein,"
    explanation: Lists the precipitants to avoid, which is the preventive half of decompensation management.
- name: L-carnitine supplementation
  description: >-
    Carnitine supplementation supports excretion of acyl groups and replaces deficient free
    carnitine. All five Polish patients received it; treatment is monitored using serum concentrations.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-carnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
  target_mechanisms:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    description: >-
      Conjugation of the accumulated propionyl-CoA to an excretable acylcarnitine drains
      the pool that builds up behind the mutase block.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "provide supplemental carnitine to those with\ncarnitine deficiency"
      explanation: GeneReviews states the indication for carnitine supplementation in isolated methylmalonic acidemia.
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is also recommended to supplement l-carnitine under control of its serum concentration"
    explanation: States that carnitine is given under serum-level control, in a paper whose entire cohort is MMAA-genotyped.
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional medications included L‐ carnitine, neomycin and metronidazole."
    explanation: Records carnitine among the medications actually used in an adult cblA-only cohort.
- name: Gut decontamination to reduce propionate production
  description: >-
    Intermittent antibiotic decontamination of the gut, typically with metronidazole or
    neomycin, to suppress the anaerobic flora that produce propionate. This targets a
    substrate source that dietary protein restriction does not reach.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: neomycin
      term:
        id: CHEBI:7507
        label: neomycin
  target_mechanisms:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    description: >-
      Gut flora are a substrate source independent of dietary intake, so suppressing them
      lowers the propiogenic load reaching the blocked pathway.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "reduce propionate production from gut flora"
      explanation: States the mechanism by which gut decontamination acts on the substrate load.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional medications included L‐ carnitine, neomycin and metronidazole."
    explanation: Names the two decontamination antibiotics actually used in an adult cblA-only cohort.
- name: Liver or kidney transplantation
  description: >-
    Liver and/or kidney transplantation may be considered in isolated MMA with severe metabolic
    instability or renal failure. cblA-specific reports document kidney transplantation, including
    one patient transplanted at age 35 and followed for six years under continued hydroxocobalamin.
    These observations do not establish a cblA-specific liver-transplant benefit.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Renal Tubulointerstitial Injury
    description: >-
      Kidney transplantation replaces the failing organ without correcting MMAA deficiency elsewhere.
      Preserved graft function under continued B12 in one case does not prove that B12 alone
      protected the graft.
    evidence:
    - reference: PMID:24095221
      reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient received a renal transplant at age 35 years."
      explanation: Documents renal transplantation in a molecularly confirmed cblA patient.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In those with\nsignificant metabolic instability and/or renal failure, liver and/or renal\ntransplantation may be considered."
    explanation: States the indication for transplantation in isolated methylmalonic acidemia.
  - reference: PMID:24095221
    reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under continuous treatment with hydroxocobalamin there is no evidence of kidney damage due to MMA-uria until the last follow-up 6 years after transplantation."
    explanation: Shows the graft outcome under continued cobalamin therapy, which is the reason the metabolic treatment is not stopped after transplantation.
differential_diagnoses:
- name: Methylmalonyl-CoA mutase deficiency (mut-type isolated methylmalonic acidemia)
  disease_term:
    preferred_term: methylmalonic acidemia
    term:
      id: MONDO:0002012
      label: methylmalonic acidemia
  description: >-
    The other, and commoner, cause of isolated methylmalonic acidemia, curated as
    `kb/disorders/Methylmalonic_Acidemia.yaml`. The biochemical presentation at first
    crisis is essentially the same and the age at diagnosis is similar, so the two are
    separated by genotype and by cobalamin responsiveness rather than at the bedside.
  distinguishing_features:
  - Near-universal cobalamin responsiveness in cblA, against a much lower rate in mut-type disease and none in mut0.
  - Significantly lower plasma and urine methylmalonic acid in cblA.
  - Better preserved glomerular filtration rate and less frequent chronic renal failure in cblA.
  - Neurological complications predominate in the mut subgroup on direct comparison.
  - The lesion in cblA is in cofactor delivery to a structurally intact mutase, whereas in mut-type disease the mutase apoenzyme itself is deficient.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although similar at first, cblA patients respond to hydroxocobalamin treatment, subsequently show significantly lower levels of MMA and a milder course than mut patients."
    explanation: The registry study's own summary of how the two entities diverge after presentation.
- name: cblB type methylmalonic aciduria (MMAB deficiency)
  description: >-
    The other adenosylcobalamin-synthesis defect causing isolated methylmalonic acidemia,
    caused by biallelic MMAB variants and covered within
    `kb/disorders/Methylmalonic_Acidemia.yaml`. cblB affects the adenosyltransferase that
    makes adenosylcobalamin, whereas cblA affects the G-protein that delivers and
    maintains it, and the clinical courses differ sharply despite the shared pathway.
  distinguishing_features:
  - cblB patients have an earlier onset, more complications and deaths, and higher urinary methylmalonic acid than cblA patients.
  - Chronic renal failure is common in cblB and relatively spared in cblA.
  - Cobalamin responsiveness is the rule in cblA and only occasional in cblB.
  - MONDO keeps the two as separate terms with separate OMIM anchors and separate causal genes, MMAA with OMIM:251100 for cblA and MMAB with OMIM:251110 for cblB.
  evidence:
  - reference: PMID:17597648
    reference_title: "Long-term outcome in methylmalonic acidurias is influenced by the underlying defect (mut0, mut-, cblA, cblB)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, patients with mut0 and cblB defects had an earlier onset of symptoms, a higher frequency of complications and deaths, and a more pronounced urinary excretion of MMA than those with mut- and cblA defects."
    explanation: The four-way comparison that places cblB with mut0 at the severe end and cblA at the attenuated end. This is a mixed cohort of 83 patients of which only 20 were cblA, so the statement is a between-group contrast and not a cblA-specific rate.
  - reference: PMID:17597648
    reference_title: "Long-term outcome in methylmalonic acidurias is influenced by the underlying defect (mut0, mut-, cblA, cblB)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic renal failure (CRF) was found most frequently in mut0 (61%) and cblB patients (66%), and was predicted by the urinary excretion of methylmalonic acid (MMA) before CRF."
    explanation: The renal-failure percentages quoted here belong to the mut0 and cblB subgroups, not to cblA. They are recorded to bound the renal claim rather than to describe cblA.
- name: cblD-MMA (MMADHC deficiency, methylmalonic aciduria form)
  description: >-
    MMADHC defects can cause isolated MMA (cblD-MMA) or combined methylmalonic aciduria and
    homocystinuria. MMAA deficiency affects the adenosylcobalamin pathway; an elevated homocysteine
    result warrants investigation for a combined disorder or a secondary cause and is not by
    itself a genotype exclusion.
  distinguishing_features:
  - Distinguished by gene, MMADHC versus MMAA, since the isolated-MMA biochemical phenotype is shared.
  - MMADHC variants elsewhere in the gene give isolated homocystinuria or combined disease, a positional allelic spectrum that MMAA does not show.
  - cblA has no homocysteine arm at all, so any hyperhomocysteinemia excludes it.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "synthesis of its cofactor, 5-deoxy-adenosyl-cobalamin (cblA, cblB, or cblD-MMA),"
    explanation: Groups cblA, cblB and cblD-MMA as the cofactor-side causes of isolated methylmalonic acidemia that must be distinguished from one another.
- name: cblH
  description: >-
    A complementation class defined out of the cblA cohort itself. A patient with the
    clinical and biochemical phenotype of cblA whose fibroblasts complemented all cblA
    lines was assigned to a new class, cblH, before MMAA was cloned. The episode is why a
    cblA-like biochemical phenotype is not by itself a cblA diagnosis.
  distinguishing_features:
  - Defined by somatic cell complementation rather than by biochemistry, which cannot separate it from cblA.
  - Requires molecular testing to resolve, since MMAA sequencing is normal.
  evidence:
  - reference: PMID:10882753
    reference_title: "Complementation studies in the cblA class of inborn error of cobalamin metabolism: evidence for interallelic complementation and for a new complementation class (cblH)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results strongly suggest that the cblA variant represents a novel complementation class, which we have designated cblH and which represents a mutation at a distinct gene."
    explanation: Documents that a patient meeting the clinical and biochemical definition of cblA carried a defect at a different locus.
external_assertions:
- name: Orphanet nosology record for cblA
  source: Orphanet
  assertion_type: structured_subtype_record
  external_id: ORPHA:79310
  url: http://www.orpha.net/consor/cgi-bin/OC_Exp.php?lng=en&Expert=79310
  description: >-
    Orphanet classifies cblA as a clinical subtype rather than a disorder in its own
    right, and its cross-reference table is the authority for the identity of this entity
    across MONDO, OMIM and the ICD systems. Two things in that table are worth recording.
    The MONDO and OMIM mappings are exact, which confirms the disease_term binding used
    here. The ICD-10 and ICD-11 mappings are both Narrower, meaning cblA sits beneath a
    broader code rather than carrying one of its own, so there is no cblA-specific ICD
    code to record. That is the coding-level counterpart of the under-recognition problem
    described in this entry.
  evidence:
  - reference: ORPHA:79310
    reference_title: Vitamin B12-responsive methylmalonic acidemia type cblA
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MONDO:0009613 | Exact"
    explanation: Orphanet asserts an exact mapping between ORPHA:79310 and the MONDO term bound as this entry's disease_term.
  - reference: ORPHA:79310
    reference_title: Vitamin B12-responsive methylmalonic acidemia type cblA
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ICD-10:E71.1 | Narrower"
    explanation: The ICD-10 mapping is narrower rather than exact, which is the basis for stating that cblA has no ICD code of its own.
  notes: >-
    Generated with `just structured-rebuild-orphanet --id 79310`. The cached record
    carries the nosology and cross-reference sections only, without the definition,
    phenotype or epidemiology sections, because `just refresh-orphadata` aborted on a
    checksum mismatch after downloading en_product1.xml and before fetching the
    en_product4, en_product6 and en_product9_prev bulk files that supply those sections.
    No Orphanet prevalence class was therefore available for this entity.
discussions:
- discussion_id: cbla_no_published_animal_model
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there an animal model of cblA that reproduces the human disease, and what would it
    take to establish one?
  attaches_to:
  - pathophysiology#Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
  rationale: >-
    This entry curates no animal models because no published study characterises an
    Mmaa-deficient animal as a model of cblA methylmalonic aciduria. That is a statement
    about the literature, not about the reagents. A constitutive null allele does exist,
    Mmaa em1(IMPC)J, MGI:5825155, produced by the International Mouse Phenotyping
    Consortium, and MGI records abnormal phenotype annotations for it across adipose,
    cardiovascular, growth, haematopoietic, homeostasis and skeletal systems. MGI attaches
    no human disease model assertion to that allele, no publication describes its
    metabolic phenotype, and consortium phenotype annotations are not a citable quoted
    finding of the kind this knowledge base requires for an evidence item, so the allele
    is recorded here rather than curated as a model. The published rodent work on Mmaa is
    a developmental expression survey of Mmaa, Mmab and Mut during mouse organogenesis
    rather than a disease model, and the established mouse models of methylmalonic
    acidemia are mutase-deficient. The gap matters because the two arms of MMAA function
    that human biochemistry has separated, cofactor gating and cofactor repair, cannot be
    separated pharmacologically in patients, and an animal in which they could be
    dissociated is the obvious way to ask which one sets the residual mutase activity that
    determines cobalamin responsiveness.
- discussion_id: cbla_residual_renal_disease_on_treatment
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does chronic kidney disease still develop in cblA patients whose methylmalonate is
    well controlled on cobalamin?
  attaches_to:
  - pathophysiology#Renal Tubulointerstitial Injury
  rationale: >-
    Renal mitochondrial dysfunction is represented as a hypothesis, with a causal path to tubulointerstitial
    injury and CKD. cblA-specific mediation remains unproven: incomplete metabolite control,
    damage before treatment and tissue mitochondrial dysfunction may contribute. The adult series
    was retrospective and included variable initial treatment; the Polish series used cystatin
    C to identify CKD. Neither cohort establishes why renal disease persists in a particular
    well-controlled patient.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is also in line with the pathophysiological hypotheses suggesting that chronic kidney
      disease is more directly linked to MMA toxicity, while brain involvement seems to be more
      complex and related partially to acute decompensation and energy deficit, and partially
      to de novo synthesis and trapping of toxic metabolites in brain tissue.
    explanation: >-
      The cblA cohort discussion proposes organ-injury routes; these are hypotheses, not measured
      causal mediation.
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1231/
    reference_title: Isolated Methylmalonic Acidemia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Secondary mitochondrial dysfunction rather than direct nephrotoxicity of methylmalonic
      acid is hypothesized as the cause for renal disease
    explanation: >-
      GeneReviews presents a mechanistic hypothesis across isolated MMA; subtype-specific renal
      confirmation is lacking.
    directness: INDIRECT
- discussion_id: cbla_neurologic_attribution
  kind: KNOWLEDGE_GAP
  prompt: Which mechanisms account for these cblA findings in the reported patients?
  attaches_to:
  - phenotypes#Hypotonia
  - phenotypes#Seizure
  - phenotypes#Ataxia
  - phenotypes#Developmental regression
  - phenotypes#Spasticity
  - phenotypes#Diminished ability to concentrate
  rationale: >-
    The reviewed sources establish these findings in cblA, but do not establish a finding-specific
    path from the modeled brain or basal-ganglia injury in the reported individuals. Acute toxicity,
    chronic brain metabolism, prior injury and other contributors may differ; the severe-case
    co-occurrence alone does not determine mediation. Basal-ganglia causation is represented
    for extrapyramidal movement disorders where the source explicitly supports it.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is also in line with the pathophysiological hypotheses suggesting that chronic kidney
      disease is more directly linked to MMA toxicity, while brain involvement seems to be more
      complex and related partially to acute decompensation and energy deficit, and partially
      to de novo synthesis and trapping of toxic metabolites in brain tissue.
    explanation: >-
      The cblA cohort discussion proposes organ-injury routes; these are hypotheses, not measured
      causal mediation.
    directness: INDIRECT
- discussion_id: cbla_optic_and_imaging_mechanisms
  kind: KNOWLEDGE_GAP
  prompt: Which mechanisms account for these cblA findings in the reported patients?
  attaches_to:
  - phenotypes#Optic atrophy
  - phenotypes#Cerebral atrophy
  - phenotypes#Ventriculomegaly
  rationale: >-
    Optic atrophy causes visual impairment in the reported cblA patient, but the liver OXPHOS
    defect does not establish an optic-nerve mechanism. Cerebral atrophy and ventricular dilatation
    co-occur in the Polish cohort; ex-vacuo ventricular enlargement is plausible but not demonstrated.
    The predominantly normal or nonspecific adult imaging and absent lesion-outcome correlation
    preclude assigning every image to a single causal route.
  evidence:
  - reference: PMID:19277894
    reference_title: >-
      Multiple OXPHOS deficiency in the liver of a patient with CblA methylmalonic aciduria
      sensitive to vitamin B(12).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An adult patient with methylmalonic aciduria due to defective cobalamin synthesis (CblA)
      responsive to vitamin B(12) presented suddenly with severe visual impairment ascribed
      to optic atrophy followed by a fatal multiorgan failure and lactic acidosis but low methylmalonic
      acid in plasma and urine.
    explanation: >-
      A single reported cblA patient with optic atrophy. The frequency band is set to OCCASIONAL
      because this is a case report rather than a cohort estimate.
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients showed basal ganglia signal changes, but these did not correlate with their
      neurological examination, which was normal, or with cognitive function, normal as well.
    explanation: The cblA cohort illustrates limitations of attributing clinical deficits to
      imaging abnormalities.
- discussion_id: cbla_systemic_attribution
  kind: KNOWLEDGE_GAP
  prompt: Which mechanisms account for these cblA findings in the reported patients?
  attaches_to:
  - phenotypes#Feeding difficulties
  - phenotypes#Hyperuricemia
  - phenotypes#Dehydration
  - phenotypes#Hypothermia
  - phenotypes#Hyperglycemia
  - phenotypes#Ketonuria
  - phenotypes#Elevated circulating hepatic transaminase concentration
  - phenotypes#Osteopenia
  - phenotypes#Vomiting
  rationale: >-
    Vomiting, feeding problems and constitutional or laboratory abnormalities are observed during
    cblA illness, but the available sources often establish association rather than a specific
    causal route. Hyperuricemia and osteopenia may reflect kidney disease or other factors;
    hyperglycemia, ketonuria and transaminase elevations were not mechanistically characterized.
    A direct liver OXPHOS result in a different cblA case does not establish the cause of the
    Polish cohort’s transaminase elevations. The represented nutritional growth, osteoporosis
    and renal-anemia pathways retain alternative contributors; the remaining gaps concern causal
    attribution rather than an absence of these biological hypotheses.
  evidence:
  - reference: PMID:31921599
    reference_title: >-
      Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related
      to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, more than half of the patients had anemia, hyperglycemia and ketonuria.
    explanation: >-
      Observed at diagnosis in the five-patient cblA cohort; exact individual counts are not
      supplied in this sentence.
  - reference: PMID:34915869
    reference_title: >-
      Genetic testing is necessary for correct diagnosis and treatment in patients with isolated
      methylmalonic aciduria: a case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the fourth postnatal day, she developed apathy, hypothermia, and dehydration with metabolic
      acidosis and hyperammonaemia (1,601 μmol/L).
    explanation: The clinical history is patient 2 with homozygous MMAA p.Leu89Pro.
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone densitometry was performed in 9 patients and was abnormal in 5 of them with osteoporosis
      (n = 2) or osteopenia (n = 3).
    explanation: The denominator is nine tested adults, not all 23; selection for densitometry
      may affect the proportion.
- discussion_id: cbla_cardiac_conduction_attribution
  kind: KNOWLEDGE_GAP
  prompt: What caused conduction and repolarization abnormalities in the severe cblA case?
  attaches_to:
  - phenotypes#Atrioventricular block
  - phenotypes#Prolonged QT interval
  rationale: >-
    Renal disease, electrolyte imbalance and myocardial dysfunction could contribute, but the
    historical case lacks the data needed to assign a particular mechanism. The source explicitly
    proposes a renal contribution to hypertrophy, which is represented; it does not make an
    equivalent causal attribution for the block or QT prolongation.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He developed intellectual disability, ataxia, epilepsy, and renal insufficiency (since
      the age of 11 years) with arterial hypertension, cardiac left hypertrophy and cardiac
      rhythm anomalies (atrioventricular block, long QT at the age of 15 years).
    explanation: >-
      The severe homozygous MMAA p.Ala196* case had these cardiac rhythm abnormalities; neither
      the degree of block nor a corrected QT interval was specified.
- discussion_id: cbla_adult_constitutional_symptom_scope
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the adult-onset constitutional presentation was attributable to MMAA deficiency
    versus concurrent low vitamin B12?
  attaches_to:
  - pathophysiology#Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
  rationale: >-
    One molecularly and functionally confirmed adult had fatigue, myalgia, exercise intolerance,
    headache and nausea after a flu-like illness, with concurrent low serum B12. Symptoms resolved
    after intensive B12 while MMA remained elevated. These observations support a possible attenuated
    presentation but do not separate MMAA-dependent symptoms from acquired B12 deficiency or
    another contributor; they are not generalized as characteristic cblA phenotypes.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After treatment with B12 up to 1 mg IM daily her chronic symptoms completely disappeared;
      plasma B12 level normalized although MMA remained elevated (8 μmol/L).
    explanation: Clinical response in the described adult cblA patient, whose pretreatment serum
      B12 was also low.
notes: >-
  Entity verification. MONDO:0009613 was resolved with OAK before this entry was written.
  Its definition is "An autosomal recessive form of methylmalonic aciduria, caused by
  mutation(s) in the MMAA gene, encoding MMAA protein", it carries the relationship
  RO:0004003 HGNC:18871 MMAA, its single superclass is MONDO:0017214 (vitamin
  B12-responsive methylmalonic acidemia), and it xrefs OMIM:251100, Orphanet:79310,
  DOID:0060742, MEDGEN:344422 and NCIT:C142171. This matches the gene recorded in
  stubs/Methylmalonic_Aciduria_cblA_Type.yaml.

  One MONDO synonym on this term is wrong and has deliberately not been copied into the
  synonyms list. MONDO:0009613 carries "cobalamin B disease" as an EXACT synonym.
  Cobalamin B disease is cblB, the MMAB disorder, which is a different complementation
  group with a different gene and a different OMIM anchor, OMIM:251110. The curation stub
  inherited the same error as "cblB - cobalamin locus b". Propagating it into this entry
  would defeat the entity separation the entry exists to make, so the synonym list here
  carries only cblA designations. This is worth reporting upstream to MONDO but is not
  fixed by this pull request.

  Scope, and the relationship to the two entries that already mention cblA. cblA was
  listed in two places in this knowledge base before this entry and curated in neither.
  kb/disorders/Methylmalonic_Acidemia.yaml carries a genetic record "MMAA (cblA
  complementation group)" with two sentences of features prose and evidence consisting of
  a single review sentence that merely names cblA. It has no cblA pathophysiology node, no
  MMAA mechanism, and its two has_subtypes entries are biochemical response classes
  spanning three genotypes rather than complementation groups.
  kb/disorders/Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport.yaml carries a
  has_subtypes entry "cblA" with a three-line description, no bound disease term and no
  evidence. Neither file carries MONDO:0009613. Both were read and neither was modified by
  this pull request, exactly as the cblD entry left the same two files alone when it was
  created. That cblD precedent establishes that a complementation group may be listed as a
  has_subtypes line on the group umbrella and simultaneously carry its own Disease entry.

  Named Entity Confusion preflight. The risk for this entity is not that the literature is
  about a different gene but that it is about a different methylmalonic acidemia. Two
  further hazards are specific to the string cblA, which is also the name of a Burkholderia
  cepacia cable-pilus adhesin gene (PMID:11896764, PMID:12427939) and an unrelated
  engineering acronym (PMID:34710427, PMID:39182974). None of these were used. Every
  clinical source cited here was checked for the composition of its study population.
  PMID:32754920, PMID:35618652 and PMID:31921599 are cblA-specific or report cblA as a
  separately analysed arm, and are the backbone of the clinical claims. PMID:17597648 and
  PMID:17957493 are mixed cohorts spanning mut0, mut-, cblA and cblB. They are cited only
  for between-group contrasts, and where a percentage in the quoted sentence belongs to a
  non-cblA subgroup the explanation says so explicitly rather than letting the number read
  as a cblA rate. No cohort-wide statistic from a mixed series has been attributed to cblA
  anywhere in this entry.

  Evidence-source grading convention, applied consistently throughout this file.
  Measurements made on patients or patient material and reported as findings about those
  patients, including diagnostic enzymology and biopsy histology, are graded
  HUMAN_CLINICAL. Experiments performed on cultured cells or purified proteins to test a
  mechanism, including somatic cell complementation, recombinant protein biochemistry,
  crystallography and transcript-stability assays, are graded IN_VITRO. Papers that report
  both, notably PMID:28497574 and PMID:17957493, have their evidence split into separate
  items so each carries a single grade. GeneReviews is graded OTHER, matching the
  treatment of the sibling GeneReviews chapter in
  kb/disorders/MMADHC-related_Disorder_of_Cobalamin_Metabolism_cblD_Type.yaml.

  Not curated, and why. The Orphanet record ORPHA:79310 is cited under
  external_assertions, but only partially. just refresh-orphadata aborts on a checksum
  mismatch: the upstream en_product1.xml no longer matches the sha256 pinned in
  data/orphadata/MANIFEST.yaml. It downloads that file before failing, which is enough
  for just structured-rebuild-orphanet --id 79310 to generate a valid nosology and
  cross-reference record, and that is what is committed here. It is not enough for the
  definition, phenotype and epidemiology sections, which come from the en_product4,
  en_product6 and en_product9_prev bulk files that the aborted run never fetched. So no
  Orphanet prevalence class or HPO frequency table was available. Repinning the manifest
  would rewrite every committed ORPHA cache file and does not belong in a curation pull
  request; the stale pin is reported instead. Note also that just fetch-reference
  ORPHA:79310 does not work and reports "No source found for reference type" -
  structured-rebuild-orphanet is the path for this prefix. No animal models are curated,
  for the reasons set out in the first knowledge gap. No prevalence rate is recorded
  because none specific to cblA has been published.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic MMAA variants. The majority of reported cblA alleles are premature
    termination codons, with a single nonsense allele accounting for a large share of the
    mutant chromosomes.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: All forms of isolated MMA are inherited in an autosomal recessive manner.
    explanation: GeneReviews states the inheritance mode for the isolated MMA group, of which cblA is a member.
  - reference: PMID:17957493
    reference_title: "Methylmalonic acidaemia: examination of genotype and biochemical data in 32 patients belonging to mut, cblA or cblB complementation group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the cblA patients carried premature termination codons (PTC) in both alleles."
    explanation: Documents the biallelic, predominantly truncating allele architecture in the cblA subgroup of this cohort.
prevalence:
- population: Published cblA case literature, worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    The 2020 paper reported fewer than 200 published cblA patients. This historical literature
    count is not a population prevalence estimate and does not establish a prevalence band.
    Mixed-MMA incidence estimates are not cblA-specific.
  evidence:
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "So far, <200 patients with phenotype of cblA-type MMA have been described in the literature"
    explanation: Historical count summarized in the introduction, not an incidence or population
      prevalence calculation.
pathophysiology:
- name: Biallelic MMAA Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of MMAA, on chromosome 4q31, remove or cripple the mitochondrial
    G-protein that chaperones adenosylcobalamin onto methylmalonyl-CoA mutase. Most
    reported alleles are premature termination codons; the remainder are missense changes
    at conserved residues, and roughly a third of those destabilise the protein in
    expression systems.
  genes:
  - preferred_term: MMAA
    term:
      id: hgnc:18871
      label: MMAA
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Loss of MMAA-Mutase Functional Interaction
    causal_link_type: DIRECT
    description: >-
      MMAA alleles can reduce protein stability or disrupt productive cofactor-handling
      interactions with MMUT. Physical binding and residual biochemical activity vary
      by allele; loss of productive function does not require complete loss of binding.
  evidence:
  - reference: PMID:12438653
    reference_title: Identification of the gene responsible for the cblA complementation group of vitamin B12-responsive methylmalonic acidemia based on analysis of prokaryotic gene arrangements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that the identified gene, MMAA, corresponds to the cblA complementation group."
    explanation: Establishes MMAA as the gene defective in the cblA complementation group.
  - reference: PMID:15523652
    reference_title: Mutations in the MMAA gene in patients with the cblA disorder of vitamin B12 metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 13 mutations result in premature stop codons; three are splice site defects; and six are missense mutations that occur at highly conserved residues."
    explanation: Describes the allele classes underlying loss of MMAA function in cblA patients.
- name: Loss of MMAA-Mutase Functional Interaction
  biological_scale: MOLECULAR
  description: >-
    MMAA variants can disrupt its functional interaction with MMUT and impair cofactor loading
    and repair. The 2017 series found reduced MMUT-stimulated GTPase activity in all 15 tested
    mutant proteins, with physical binding lost in nine. This is not universal across alleles:
    a 2023 study found enhanced MMUT-stimulated activity for R98G but defective gating and cofactor
    repair.
  molecular_functions:
  - preferred_term: mutase-stimulated MMAA GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
  notes: >-
    No modifier is set on the GTPase descriptor because the biochemical effects are
    allele-dependent. All 15 purified mutants in the 2017 series retained wild-type-like
    intrinsic GTPase activity but had reduced MMUT stimulation; nine also lost physical
    binding. The p.Asp292Val exception concerned GTP binding, not basal GTPase activity.
    R98G showed enhanced MMUT stimulation in the 2023 study despite defective gating and
    repair. A uniform DECREASED annotation would obscure these distinctions.
  downstream:
  - target: Failure of Adenosylcobalamin Gating onto Methylmalonyl-CoA Mutase
    causal_link_type: DIRECT
    description: >-
      Disruption of productive MMAA-MMUT interaction impairs nucleotide-gated cofactor
      transfer. The measured defect need not abolish physical binding or all loading.
  - target: Failure of Holoenzyme Cofactor Protection and Reactivation
    causal_link_type: DIRECT
    description: >-
      MMAA-MMUT interaction also supports cofactor protection and exchange. Disease
      variants can impair these functions along with gating, with the degree and
      combination of defects depending on the allele.
  evidence:
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, all mutations strongly decreased functional association with MUT by reducing GTPase activity stimulation upon incubation with MUT, while nine mutant proteins additionally lost the ability to physically bind MUT."
    explanation: All 15 purified mutants had reduced functional association in this assay;
      only nine additionally lost physical binding, so the two defects are distinguished.
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All 15 purified mutant proteins demonstrated wild-type like intrinsic GTPase activity and only one (p.Asp292Val), where the mutation is in the GTP binding domain, revealed decreased GTP binding."
    explanation: Establishes that intrinsic catalytic activity is retained, so the lesion is in the interaction rather than in the GTPase chemistry itself.
  - reference: PMID:20876572
    reference_title: Structures of the human GTPase MMAA and vitamin B12-dependent methylmalonyl-CoA mutase and insight into their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The physiological importance of this interaction is highlighted by a recently identified homoallelic patient mutation of MMAA, G188R, which, we show, retains basal GTPase activity but has abrogated interaction."
    explanation: An independent patient allele shows the same dissociation of preserved GTPase activity from abolished complex formation.
  - reference: PMID:37468522
    reference_title: Architecture of the human G-protein-methylmalonyl-CoA mutase nanoassembly for B(12) delivery and repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The complex, stabilized by MMAA wedging between two MMUT domains, leads to ordering of the switch I and III loops, revealing the molecular basis of mutase-dependent GTPase activation."
    explanation: The human co-crystal structure shows how MMAA engages the mutase and why that engagement is what activates its GTPase, which is the interaction this node reports as lost.
  - reference: PMID:37468522
    reference_title: Architecture of the human G-protein-methylmalonyl-CoA mutase nanoassembly for B(12) delivery and repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The structure explains the biochemical penalties incurred by methylmalonic aciduria-causing mutations that reside at the MMAA-MMUT interfaces we identify here."
    explanation: Places the disease-causing alleles at the MMAA-mutase interface itself, which is the structural counterpart of the biochemical interaction loss.
  - reference: PMID:37468522
    reference_title: Architecture of the human G-protein-methylmalonyl-CoA mutase nanoassembly
      for B(12) delivery and repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While neither mutation affects the intrinsic GTPase activity, GAP activation by MMUT is
      either enhanced 2-fold (R98G) or lost (R209S)
    explanation: >-
      The two MMAA variants in the 2023 human-protein experiments show allele-dependent MMUT
      stimulation; both nevertheless impaired cofactor gating and repair.
- name: Failure of Adenosylcobalamin Gating onto Methylmalonyl-CoA Mutase
  biological_scale: MOLECULAR
  description: >-
    In health, MMAA favours complex formation with the apo-mutase, licenses transfer of
    adenosylcobalamin from the adenosyltransferase MMAB, and then releases the loaded
    holoenzyme in a GTP-dependent cycle. In cblA, defective gating disrupts controlled
    cofactor loading despite intact MMAB-dependent synthesis; it does not imply that
    every allele abolishes all cofactor transfer or residual holoenzyme activity.
  biological_processes:
  - preferred_term: mitochondrial adenosylcobalamin handling
    term:
      id: GO:0009235
      label: cobalamin metabolic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: cobalamin binding by the mutase holoenzyme
    term:
      id: GO:0031419
      label: cobalamin binding
    modifier: DECREASED
  downstream:
  - target: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
    causal_link_type: DIRECT
    description: >-
      Impaired productive cofactor loading reduces the active holoenzyme pool even when
      intact mutase protein is present; residual loading and activity can persist.
  evidence:
  - reference: PMID:20876572
    reference_title: Structures of the human GTPase MMAA and vitamin B12-dependent methylmalonyl-CoA mutase and insight into their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, our data point to a gatekeeping role for MMAA by favoring complex formation with MUT apoenzyme for AdoCbl assembly and releasing the AdoCbl-loaded holoenzyme from the complex, in a GTP-dependent manner."
    explanation: States the gatekeeping model for adenosylcobalamin assembly onto the mutase that this node describes.
  - reference: PMID:28497574
    reference_title: Protein destabilization and loss of protein-protein interaction are fundamental mechanisms in cblA-type methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, all mutations interfered with gating the transfer of AdoCbl from MMAB to MUT."
    explanation: Every tested patient missense allele disrupts the gating step, which is the specific failure asserted here.
  - reference: PMID:19955418
    reference_title: A G-protein editor gates coenzyme B12 loading and is corrupted in methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While the GTP-binding energy is needed for the editing function; that is, to discriminate between active and inactive cofactor forms, the chemical energy of GTP hydrolysis is required for gating cofactor transfer."
    explanation: Separates the two nucleotide requirements of the gating cycle. This was established in the bacterial MeaB orthologue rather than in human MMAA, so it is cited for the mechanism of gating and not as a cblA genotype result.
- name: Failure of Holoenzyme Cofactor Protection and Reactivation
  biological_scale: MOLECULAR
  description: >-
    Adenosylcobalamin is destroyed slowly during normal mutase turnover, accumulating as
    the oxidised hydroxocobalamin form and inactivating the enzyme. MMAA both slows that
    oxidation while in complex with the mutase and, once inactivation has occurred,
    removes the damaged cofactor through GTP hydrolysis so a fresh one can be installed.
    Impaired MMAA protection or repair can therefore reduce sustained mutase activity;
    the residual function depends on the allele and experimental context.
  downstream:
  - target: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
    causal_link_type: DIRECT
    description: >-
      Impaired repair allows inactive cofactor to accumulate and can compound defective
      loading, reducing sustained holoenzyme activity.
  evidence:
  - reference: PMID:28943303
    reference_title: Human MMAA induces the release of inactive cofactor and restores methylmalonyl-CoA mutase activity through their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the formation and accumulation of OH2Cbl, the oxidized form of the AdoCbl cofactor formed during catalysis, is the cause of hMCM inactivation"
    explanation: Identifies oxidative cofactor damage during catalysis as the process MMAA counteracts.
  - reference: PMID:28943303
    reference_title: Human MMAA induces the release of inactive cofactor and restores methylmalonyl-CoA mutase activity through their complex formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, an inactive model of hMCM was used to demonstrate that hMMAA is able to remove the damaged cofactor through GTP hydrolysis."
    explanation: Demonstrates the cofactor-exchange repair function whose loss this node asserts.
  - reference: PMID:21138732
    reference_title: Protection and reactivation of human methylmalonyl-CoA mutase by MMAA protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When it was added at the beginning of the reaction, it prevents inactivation by guarding MCM. After 60 min of reaction, when MCM is inactive, the addition of MMAA increases the enzymatic activity through GTP hydrolysis, indicating reactivation of MCM by exchange of the damaged cofactor."
    explanation: Establishes the dual protective and reactivating roles of MMAA on the mutase in a purified system.
  - reference: PMID:19955418
    reference_title: A G-protein editor gates coenzyme B12 loading and is corrupted in methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The G protein chaperone also exerts its editing function during turnover by using the binding energy of GTP to elicit release of inactive cofactor that is occasionally formed during the catalytic cycle of MCM."
    explanation: States the during-turnover editing function whose loss this node asserts. Established in the bacterial MeaB orthologue, so it is cited for the conserved mechanism rather than as a human cblA measurement.
- name: Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
  biological_scale: CELLULAR
  description: >-
    Insufficient effective MMUT holoenzyme activity reduces propionate-pathway flux in intact
    cells. This is a cofactor-handling defect: MMUT activity measured in extracts with excess
    adenosylcobalamin can be normal, while cellular propionate incorporation is low and improves
    with hydroxocobalamin.
  molecular_functions:
  - preferred_term: methylmalonyl-CoA mutase activity
    term:
      id: GO:0004494
      label: methylmalonyl-CoA mutase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: propionate catabolic process
    term:
      id: GO:0019543
      label: propionate catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  downstream:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    causal_link_type: DIRECT
    description: >-
      Methylmalonyl-CoA that cannot be isomerised to succinyl-CoA is hydrolysed to
      methylmalonic acid, and propionyl-CoA backs up behind it.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enzymatic studies of her fibroblasts showed a deficit in propionate incorporation (1.61
      nmol/mg prot/16 h vs. 6.08 nmol/mg prot/16 h in the experimental control; range in controls
      3.5–24.4) with a clear increase after B12 supplementation (11.7 nmol/mg prot/16 h vs.
      7.79 nmol/mg prot/16 h in the experimental control; range in controls 4.33–28.9), and
      normal MCM activity (measured with excess of AdoCbl), indicating a B12‐responsive defect
      of AdoCbl synthesis.
    explanation: >-
      Diagnostic cell studies in an MMAA-confirmed adult show impaired pathway flux with intact
      cofactor-supplemented apoenzyme activity.
- name: Methylmalonic Acid and Propionyl-CoA Accumulation
  biological_scale: ORGANISM
  description: >-
    The MMUT functional block causes accumulation of methylmalonic acid and upstream acyl-CoA
    metabolites. Urine and plasma MMA were lower in treated cblA than in mut patients in the
    registry comparison; this does not establish a uniformly partial genetic defect or an individual
    threshold for organ toxicity.
  chemical_entities:
  - preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
    modifier: INCREASED
  - preferred_term: propionyl-CoA
    term:
      id: CHEBI:15539
      label: propionyl-CoA
    modifier: INCREASED
  downstream:
  - target: Acute Metabolic Decompensation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - organic-acid accumulation and secondary metabolic disturbances during increased catabolic
      flux
    description: The metabolite burden can precipitate acidosis and secondary hyperammonemia
      during catabolic stress.
    evidence:
    - reference: PMID:34915869
      reference_title: >-
        Genetic testing is necessary for correct diagnosis and treatment in patients with isolated
        methylmalonic aciduria: a case report.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Organic acids, particularly methylmalonate and methylcitrate, are formed from MMCoA
        in an alternative metabolic pathway and can cause metabolic acidosis, carnitine deficiency,
        and secondary hyperammonaemia.
      explanation: >-
        The introduction describes the shared downstream chemistry of isolated MMA, including
        cblA; it is not a cblA-specific experimental measurement.
  - target: Episodic metabolic acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Accumulating organic acids contribute to high-anion-gap acidosis during decompensation.
    evidence:
    - reference: PMID:34915869
      reference_title: >-
        Genetic testing is necessary for correct diagnosis and treatment in patients with isolated
        methylmalonic aciduria: a case report.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Organic acids, particularly methylmalonate and methylcitrate, are formed from MMCoA
        in an alternative metabolic pathway and can cause metabolic acidosis, carnitine deficiency,
        and secondary hyperammonaemia.
      explanation: >-
        The introduction describes the shared downstream chemistry of isolated MMA, including
        cblA; it is not a cblA-specific experimental measurement.
  - target: Secondary impairment of ureagenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Propionyl-CoA can inhibit N-acetylglutamate synthesis. Transfer of this biochemical mechanism
      to cblA is provisional; it is not the only proposed cause of hyperammonemia.
    evidence:
    - reference: PMID:500823
      reference_title: >-
        Inhibition by propionyl-coenzyme A of N-acetylglutamate synthetase in rat liver mitochondria.
        A possible explanation for hyperammonemia in propionic and methylmalonic acidemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In the search for the mechanism by which hyperammonemia complicates propionic and methylmalonic
        acidemia the effects of a series of acyl-coenzyme A (CoA) derivatives were studied on
        the activity of N-acetylglutamate synthetase in rat liver mitochondria using acetyl-CoA
        as substrate. Propionyl-CoA was found to be a competitive inhibitor.
      explanation: >-
        Rat liver mitochondrial extracts demonstrate competitive inhibition; no MMAA-deficient
        patient liver was tested.
      directness: INDIRECT
  - target: Secondary renal mitochondrial dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A proposed route from the metabolic block to renal injury; direct methylmalonate nephrotoxicity
      and secondary mitochondrial effects are not resolved in cblA.
    evidence:
    - reference: PMID:35618652
      reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This is also in line with the pathophysiological hypotheses suggesting that chronic
        kidney disease is more directly linked to MMA toxicity, while brain involvement seems
        to be more complex and related partially to acute decompensation and energy deficit,
        and partially to de novo synthesis and trapping of toxic metabolites in brain tissue.
      explanation: >-
        The cblA cohort discussion proposes organ-injury routes; these are hypotheses, not measured
        causal mediation.
      directness: INDIRECT
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic metabolite production and trapping in brain, together with energy deficit, are
      proposed contributors to neurological injury in cblA.
    evidence:
    - reference: PMID:35618652
      reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This is also in line with the pathophysiological hypotheses suggesting that chronic
        kidney disease is more directly linked to MMA toxicity, while brain involvement seems
        to be more complex and related partially to acute decompensation and energy deficit,
        and partially to de novo synthesis and trapping of toxic metabolites in brain tissue.
      explanation: >-
        The cblA cohort discussion proposes organ-injury routes; these are hypotheses, not measured
        causal mediation.
      directness: INDIRECT
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methylmalonic acidemia (MMA) levels in urine and plasma were significantly lower in cblA."
    explanation: Quantifies the lower metabolite burden in cblA relative to mut-type disease in a registry comparison of 28 cblA and 95 mut patients.
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant excretion of methylmalonic acid in urine and metabolic acidosis traits with significantly increased anionic gap were observed in all patients."
    explanation: Documents methylmalonate accumulation in every patient of a purely MMAA-genotyped series.
- name: Acute Metabolic Decompensation
  biological_scale: ORGANISM
  description: >-
    Episodic metabolic crisis with ketoacidosis, vomiting and encephalopathy, precipitated
    by catabolic stress such as intercurrent illness, fasting or protein load. This is the
    usual route to diagnosis in cblA as in mutase deficiency.
  downstream:
  - target: Neurologic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acute decompensation and energy deficit can contribute to brain injury, but severe initial
      crisis does not determine the final cognitive outcome.
    evidence:
    - reference: PMID:35618652
      reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This is also in line with the pathophysiological hypotheses suggesting that chronic
        kidney disease is more directly linked to MMA toxicity, while brain involvement seems
        to be more complex and related partially to acute decompensation and energy deficit,
        and partially to de novo synthesis and trapping of toxic metabolites in brain tissue.
      explanation: >-
        The cblA cohort discussion proposes organ-injury routes; these are hypotheses, not measured
        causal mediation.
      directness: INDIRECT
  - target: Basal ganglia injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acute metabolic crisis can injure the basal ganglia, including the globus pallidus. This
      route applies to some affected infants, not all movement findings.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1231/
      reference_title: Isolated Methylmalonic Acidemia - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Some individuals develop a "metabolic stroke" or bilateral lacunar infarction of the
        basal ganglia during acute metabolic decompensation, which can produce an incapacitating
        movement disorder.
      explanation: >-
        GeneReviews describes the causal crisis–basal-ganglia injury–movement disorder route.
        Its preceding B12-responsive phenotype section explicitly names cblA and mut– infants
        as susceptible.
  - target: Reduced consciousness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acute acid-base and ammonia disturbances can impair alertness during a cblA crisis; the
      individual contribution of each disturbance is unresolved.
    evidence:
    - reference: PMID:34915869
      reference_title: >-
        Genetic testing is necessary for correct diagnosis and treatment in patients with isolated
        methylmalonic aciduria: a case report.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe two patients who presented in the first week of life with rapid neurological
        deterioration caused by metabolic acidosis with severe hyperammonaemia requiring extracorporeal
        elimination in addition to protein restriction, energy support, carnitine, and vitamin
        B12 treatment.
      explanation: >-
        The paper attributes acute neurological deterioration to metabolic acidosis and hyperammonemia
        in both patients; patient 2 is MMAA-confirmed cblA. This does not assign the MMAB patient’s
        other findings to cblA.
  - target: Lethargy

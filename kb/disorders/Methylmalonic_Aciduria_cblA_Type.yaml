- name: Chronic kidney disease
  category: Renal
  description: >-
    Chronic renal failure, defined as GFR below 60 mL/min/1.73 m2, affected 7/23 adults in a
    retrospective cblA series. The frequency reflects that historical adult cohort. The Polish
    series identified CKD in 3/5 using cystatin C, although creatinine was normal at follow-up
    and only one had estimated GFR below 75. Renal disease may present chronically and can progress
    despite treatment.

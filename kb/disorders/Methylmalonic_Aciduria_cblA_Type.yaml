    snippet: "Following re-evaluation, the patient received vitamin B12 (hydroxocobalamin) treatment, resulting in a significant decrease in the concentration of methylmalonic acid (MMA) in urine and plasma."
    explanation: Shows the analyte responds to cobalamin, which is what makes it the treatment-monitoring marker in cblA.
diagnosis:
- name: Molecular confirmation in MMAA
  description: >-
    Identification of biallelic pathogenic MMAA variants. Molecular testing has largely
    displaced complementation and enzymatic assays for establishing the cblA diagnosis,
    although historically the group was defined by somatic cell complementation.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "identification of biallelic pathogenic variants in MCEE, MMAA, MMAB, MMADHC, or"
    explanation: GeneReviews states that biallelic MMAA variants establish the diagnosis of isolated methylmalonic acidemia.
- name: Plasma and urine methylmalonic acid
  description: >-
    Measurement of methylmalonic acid is both the screening test and the treatment
    monitor. Because about a third of cblA patients never decompensate, the guidance is to
    measure it in unexplained chronic kidney disease, intellectual disability or growth
    failure rather than only in suspected metabolic crisis.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm that about 35% of the patients do not present acutely, underlining the importance of measuring MMA in any case of unexplained chronic renal failure, intellectual disability, or growth delay."
    explanation: States the indication for measuring methylmalonic acid outside the acute setting in cblA.
treatments:
- name: Parenteral hydroxocobalamin
  description: >-
    The disease-specific treatment, and the reason the cblA versus mut distinction matters
    clinically. Supplying cobalamin in large excess drives adenosylcobalamin onto the
    mutase despite the failed gating step. Almost every cblA patient tested has proven
    responsive, including patients initially misclassified as unresponsive, so a
    non-responsive label assigned before molecular diagnosis should be revisited.
    Parenteral administration is generally required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Failure of Adenosylcobalamin Gating onto Methylmalonyl-CoA Mutase
    description: >-
      Raising intracellular cobalamin availability partially bypasses the gating defect by
      mass action, restoring adenosylcobalamin loading onto an otherwise intact mutase.
    evidence:
    - reference: PMID:27858373
      reference_title: Vitamin B(12) Administration by Subcutaneous Catheter Device in a Cobalamin A (cblA) Patient.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hydroxocobalamin (OHCbl) is the cornerstone of cblA treatment because vitamin B12 may completely restore AdoCbl deficiency."
      explanation: States the mechanism by which hydroxocobalamin acts on the adenosylcobalamin supply defect in cblA.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "27/28 cblA patients were reported to be responsive to cobalamin, only 86% of cblA patients were treated with i.m. hydroxocobalamin."
    explanation: Quantifies cobalamin responsiveness in the cblA arm of the registry and shows a treatment gap against it.
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the patients (61%) were initially classified as vitamin B12-unresponsive methylmalonic aciduria (MMA); in vitro B12 responsiveness was subsequently found in all the tested patients (n = 13)."
    explanation: Shows that an initial unresponsive classification is unreliable in cblA, which is the basis for revisiting it.
  - reference: PMID:27858373
    reference_title: Vitamin B(12) Administration by Subcutaneous Catheter Device in a Cobalamin A (cblA) Patient.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parenteral administration, intravenous, subcutaneous or intramuscular, is generally required to achieve effect."
    explanation: Establishes the route requirement for effective cobalamin therapy in cblA.
  - reference: PMID:31921599
    reference_title: Clinical picture and treatment effects in 5 patients with Methylmalonic aciduria related to MMAA mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a mutation in the MMAA gene are sensitive to treatment with hydroxocobalamine, but the inclusion of appropriate treatment does not protect against neurodevelopmental disorders and chronic kidney disease."
    explanation: Bounds the treatment claim, since responsiveness is near-universal but does not prevent the two main long-term complications.
- name: Early cobalamin replacement for renal protection
  description: >-
    A treatment-timing claim distinct from the general use of hydroxocobalamin. Patients
    started on cobalamin early appear to be protected from severe renal insufficiency,
    whereas the neurological outcome does not differ by initial treatment. The evidence is
    a retrospective comparison within a small case series, so the effect is suggested
    rather than established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Renal Tubulointerstitial Injury
    description: >-
      Lowering the lifetime methylmalonate burden is the proposed route by which early
      replacement slows progression of tubulointerstitial disease.
    evidence:
    - reference: PMID:35618652
      reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Intellectual disability was equally distributed among the initial treatment groups, while renal failure (moderate and beginning at the age of 38 years) was present in only one out of seven patients initially treated with B12."
      explanation: The within-cohort comparison on which the renal-protection claim rests, and which simultaneously shows no such effect on the neurological outcome.
  evidence:
  - reference: PMID:35618652
    reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early B12 supplementation seems to protect from severe renal insufficiency."
    explanation: The authors' own hedged statement of the renal-protection effect, quoted with its hedge intact.
  - reference: PMID:24095221
    reference_title: "Renal involvement in a patient with cobalamin A type (cblA) methylmalonic aciduria: a 42-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further investigation will be necessary to prove the protective effect of hydroxocobalamin in the kidney in vitamin B12-responsive patients."
    explanation: An explicit statement that the renal protective effect is not yet proven, recorded here so the claim is not overstated.
- name: Natural protein restriction with propiogenic precursor limitation
  description: >-
    Restriction of natural protein, particularly the propiogenic amino acid precursors, on
    a high-calorie diet. Used in about three-quarters of cblA patients, notably less than
    in mut-type disease, reflecting the lesser metabolite burden.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Methylmalonic Acid and Propionyl-CoA Accumulation
    description: >-
      Limiting propiogenic substrate entry reduces the flux that the residual mutase
      capacity must handle.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "natural protein, particularly of propiogenic amino acid precursors, while"
      explanation: States the dietary principle in propiogenic precursor terms.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 73% of cblA and 98% of mut patients followed a calculated diet with amino acid supplements in 27% (cblA) and 69% (mut)."
    explanation: Quantifies dietary treatment uptake specifically in the cblA arm against the mut arm.
- name: Emergency management of acute decompensation
  description: >-
    Anticatabolic emergency treatment during metabolic crisis, aimed at averting catabolism
    and limiting central nervous system injury, together with avoidance of the fasting,
    stress and protein-load precipitants. This applies to cblA as to the other isolated
    methylmalonic acidemias, since metabolic crisis remains the dominant presenting event.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute Metabolic Decompensation
    description: >-
      Reversing the catabolic state removes the substrate load that precipitated the
      crisis.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "emergency treatment during episodes of acute decompensation with the goal of"
      explanation: States the goal of emergency management in terms of the decompensation mechanism it targets.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Fasting, stress, increased dietary protein,"
    explanation: Lists the precipitants to avoid, which is the preventive half of decompensation management.
differential_diagnoses:
- name: Methylmalonyl-CoA mutase deficiency (mut-type isolated methylmalonic acidemia)
  disease_term:
    preferred_term: methylmalonic acidemia
    term:
      id: MONDO:0002012
      label: methylmalonic acidemia
  description: >-
    The other, and commoner, cause of isolated methylmalonic acidemia, curated as
    `kb/disorders/Methylmalonic_Acidemia.yaml`. The biochemical presentation at first
    crisis is essentially the same and the age at diagnosis is similar, so the two are
    separated by genotype and by cobalamin responsiveness rather than at the bedside.
  distinguishing_features:
  - Near-universal cobalamin responsiveness in cblA, against a much lower rate in mut-type disease and none in mut0.
  - Significantly lower plasma and urine methylmalonic acid in cblA.
  - Better preserved glomerular filtration rate and less frequent chronic renal failure in cblA.
  - Neurological complications predominate in the mut subgroup on direct comparison.
  - The lesion in cblA is in cofactor delivery to a structurally intact mutase, whereas in mut-type disease the mutase apoenzyme itself is deficient.
  evidence:
  - reference: PMID:32754920
    reference_title: "Delineating the clinical spectrum of isolated methylmalonic acidurias: cblA and mut."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although similar at first, cblA patients respond to hydroxocobalamin treatment, subsequently show significantly lower levels of MMA and a milder course than mut patients."
    explanation: The registry study's own summary of how the two entities diverge after presentation.
- name: cblB type methylmalonic aciduria (MMAB deficiency)
  description: >-
    The other adenosylcobalamin-synthesis defect causing isolated methylmalonic acidemia,
    caused by biallelic MMAB variants and covered within
    `kb/disorders/Methylmalonic_Acidemia.yaml`. cblB affects the adenosyltransferase that
    makes adenosylcobalamin, whereas cblA affects the G-protein that delivers and
    maintains it, and the clinical courses differ sharply despite the shared pathway.
  distinguishing_features:
  - cblB patients have an earlier onset, more complications and deaths, and higher urinary methylmalonic acid than cblA patients.
  - Chronic renal failure is common in cblB and relatively spared in cblA.
  - Cobalamin responsiveness is the rule in cblA and only occasional in cblB.
  - MONDO keeps the two as separate terms with separate OMIM anchors and separate causal genes, MMAA with OMIM:251100 for cblA and MMAB with OMIM:251110 for cblB.
  evidence:
  - reference: PMID:17597648
    reference_title: "Long-term outcome in methylmalonic acidurias is influenced by the underlying defect (mut0, mut-, cblA, cblB)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, patients with mut0 and cblB defects had an earlier onset of symptoms, a higher frequency of complications and deaths, and a more pronounced urinary excretion of MMA than those with mut- and cblA defects."
    explanation: The four-way comparison that places cblB with mut0 at the severe end and cblA at the attenuated end. This is a mixed cohort of 83 patients of which only 20 were cblA, so the statement is a between-group contrast and not a cblA-specific rate.
  - reference: PMID:17597648
    reference_title: "Long-term outcome in methylmalonic acidurias is influenced by the underlying defect (mut0, mut-, cblA, cblB)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic renal failure (CRF) was found most frequently in mut0 (61%) and cblB patients (66%), and was predicted by the urinary excretion of methylmalonic acid (MMA) before CRF."
    explanation: The renal-failure percentages quoted here belong to the mut0 and cblB subgroups, not to cblA. They are recorded to bound the renal claim rather than to describe cblA.
- name: cblD-MMA (MMADHC deficiency, methylmalonic aciduria form)
  description: >-
    The isolated methylmalonic aciduria arm of the cblD complementation group, curated as
    `kb/disorders/MMADHC-related_Disorder_of_Cobalamin_Metabolism_cblD_Type.yaml`.
    N-terminal MMADHC null alleles abolish the mitochondrial cobalamin branch and produce
    isolated methylmalonic aciduria that is biochemically indistinguishable from cblA
    without complementation or molecular testing.
  distinguishing_features:
  - Distinguished by gene, MMADHC versus MMAA, since the isolated-MMA biochemical phenotype is shared.
  - MMADHC variants elsewhere in the gene give isolated homocystinuria or combined disease, a positional allelic spectrum that MMAA does not show.
  - cblA has no homocysteine arm at all, so any hyperhomocysteinemia excludes it.
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "synthesis of its cofactor, 5-deoxy-adenosyl-cobalamin (cblA, cblB, or cblD-MMA),"
    explanation: Groups cblA, cblB and cblD-MMA as the cofactor-side causes of isolated methylmalonic acidemia that must be distinguished from one another.
- name: cblH
  description: >-
    A complementation class defined out of the cblA cohort itself. A patient with the
    clinical and biochemical phenotype of cblA whose fibroblasts complemented all cblA
    lines was assigned to a new class, cblH, before MMAA was cloned. The episode is why a
    cblA-like biochemical phenotype is not by itself a cblA diagnosis.
  distinguishing_features:
  - Defined by somatic cell complementation rather than by biochemistry, which cannot separate it from cblA.
  - Requires molecular testing to resolve, since MMAA sequencing is normal.
  evidence:
  - reference: PMID:10882753
    reference_title: "Complementation studies in the cblA class of inborn error of cobalamin metabolism: evidence for interallelic complementation and for a new complementation class (cblH)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results strongly suggest that the cblA variant represents a novel complementation class, which we have designated cblH and which represents a mutation at a distinct gene."
    explanation: Documents that a patient meeting the clinical and biochemical definition of cblA carried a defect at a different locus.
external_assertions:
- name: Orphanet nosology record for cblA
  source: Orphanet
  assertion_type: structured_subtype_record
  external_id: ORPHA:79310
  url: http://www.orpha.net/consor/cgi-bin/OC_Exp.php?lng=en&Expert=79310
  description: >-
    Orphanet classifies cblA as a clinical subtype rather than a disorder in its own
    right, and its cross-reference table is the authority for the identity of this entity
    across MONDO, OMIM and the ICD systems. Two things in that table are worth recording.
    The MONDO and OMIM mappings are exact, which confirms the disease_term binding used
    here. The ICD-10 and ICD-11 mappings are both Narrower, meaning cblA sits beneath a
    broader code rather than carrying one of its own, so there is no cblA-specific ICD
    code to record. That is the coding-level counterpart of the under-recognition problem
    described in this entry.
  evidence:
  - reference: ORPHA:79310
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MONDO:0009613 | Exact"
    explanation: Orphanet asserts an exact mapping between ORPHA:79310 and the MONDO term bound as this entry's disease_term.
  - reference: ORPHA:79310
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ICD-10:E71.1 | Narrower"
    explanation: The ICD-10 mapping is narrower rather than exact, which is the basis for stating that cblA has no ICD code of its own.
  notes: >-
    Generated with `just structured-rebuild-orphanet --id 79310`. The cached record
    carries the nosology and cross-reference sections only, without the definition,
    phenotype or epidemiology sections, because `just refresh-orphadata` aborted on a
    checksum mismatch after downloading en_product1.xml and before fetching the
    en_product4, en_product6 and en_product9_prev bulk files that supply those sections.
    No Orphanet prevalence class was therefore available for this entity.
discussions:
- discussion_id: cbla_no_published_animal_model
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there an animal model of cblA that reproduces the human disease, and what would it
    take to establish one?
  attaches_to:
  - pathophysiology#Reduced Methylmalonyl-CoA Mutase Holoenzyme Activity
  rationale: >-
    This entry curates no animal models because no published study characterises an
    Mmaa-deficient animal as a model of cblA methylmalonic aciduria. That is a statement
    about the literature, not about the reagents. A constitutive null allele does exist,
    Mmaa em1(IMPC)J, MGI:5825155, produced by the International Mouse Phenotyping
    Consortium, and MGI records abnormal phenotype annotations for it across adipose,
    cardiovascular, growth, haematopoietic, homeostasis and skeletal systems. MGI attaches
    no human disease model assertion to that allele, no publication describes its
    metabolic phenotype, and consortium phenotype annotations are not a citable quoted
    finding of the kind this knowledge base requires for an evidence item, so the allele
    is recorded here rather than curated as a model. The published rodent work on Mmaa is
    a developmental expression survey of Mmaa, Mmab and Mut during mouse organogenesis
    rather than a disease model, and the established mouse models of methylmalonic
    acidemia are mutase-deficient. The gap matters because the two arms of MMAA function
    that human biochemistry has separated, cofactor gating and cofactor repair, cannot be
    separated pharmacologically in patients, and an animal in which they could be
    dissociated is the obvious way to ask which one sets the residual mutase activity that
    determines cobalamin responsiveness.
- discussion_id: cbla_residual_renal_disease_on_treatment
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does chronic kidney disease still develop in cblA patients whose methylmalonate is
    well controlled on cobalamin?
  attaches_to:
  - pathophysiology#Renal Tubulointerstitial Injury
  rationale: >-
    Cobalamin replacement lowers methylmalonate substantially and appears to slow renal
    decline, but does not abolish it. Renal failure was still present in about 30% of an
    adult cblA cohort, and in a series in which all five patients were cobalamin
    responsive and achieved good metabolic control, three nonetheless developed renal
    failure with hypertension. The mediators linking methylmalonate exposure to
    tubulointerstitial injury are not established, so it is not currently possible to say
    whether the residual renal disease reflects incomplete metabolite control, injury
    accrued before treatment began, or a mechanism that methylmalonate concentration does
    not index. Resolving this would determine whether the therapeutic target in the kidney
    is deeper metabolite suppression or something else entirely.
notes: >-
  Entity verification. MONDO:0009613 was resolved with OAK before this entry was written.
  Its definition is "An autosomal recessive form of methylmalonic aciduria, caused by
  mutation(s) in the MMAA gene, encoding MMAA protein", it carries the relationship
  RO:0004003 HGNC:18871 MMAA, its single superclass is MONDO:0017214 (vitamin
  B12-responsive methylmalonic acidemia), and it xrefs OMIM:251100, Orphanet:79310,
  DOID:0060742, MEDGEN:344422 and NCIT:C142171. This matches the gene recorded in
  stubs/Methylmalonic_Aciduria_cblA_Type.yaml.

  One MONDO synonym on this term is wrong and has deliberately not been copied into the
  synonyms list. MONDO:0009613 carries "cobalamin B disease" as an EXACT synonym.
  Cobalamin B disease is cblB, the MMAB disorder, which is a different complementation
  group with a different gene and a different OMIM anchor, OMIM:251110. The curation stub
  inherited the same error as "cblB - cobalamin locus b". Propagating it into this entry
  would defeat the entity separation the entry exists to make, so the synonym list here
  carries only cblA designations. This is worth reporting upstream to MONDO but is not
  fixed by this pull request.

  Scope, and the relationship to the two entries that already mention cblA. cblA was
  listed in two places in this knowledge base before this entry and curated in neither.
  kb/disorders/Methylmalonic_Acidemia.yaml carries a genetic record "MMAA (cblA
  complementation group)" with two sentences of features prose and evidence consisting of
  a single review sentence that merely names cblA. It has no cblA pathophysiology node, no
  MMAA mechanism, and its two has_subtypes entries are biochemical response classes
  spanning three genotypes rather than complementation groups.
  kb/disorders/Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport.yaml carries a
  has_subtypes entry "cblA" with a three-line description, no bound disease term and no
  evidence. Neither file carries MONDO:0009613. Both were read and neither was modified by
  this pull request, exactly as the cblD entry left the same two files alone when it was
  created. That cblD precedent establishes that a complementation group may be listed as a
  has_subtypes line on the group umbrella and simultaneously carry its own Disease entry.

  Named Entity Confusion preflight. The risk for this entity is not that the literature is
  about a different gene but that it is about a different methylmalonic acidemia. Two
  further hazards are specific to the string cblA, which is also the name of a Burkholderia
  cepacia cable-pilus adhesin gene (PMID:11896764, PMID:12427939) and an unrelated
  engineering acronym (PMID:34710427, PMID:39182974). None of these were used. Every
  clinical source cited here was checked for the composition of its study population.
  PMID:32754920, PMID:35618652 and PMID:31921599 are cblA-specific or report cblA as a
  separately analysed arm, and are the backbone of the clinical claims. PMID:17597648 and
  PMID:17957493 are mixed cohorts spanning mut0, mut-, cblA and cblB. They are cited only
  for between-group contrasts, and where a percentage in the quoted sentence belongs to a
  non-cblA subgroup the explanation says so explicitly rather than letting the number read
  as a cblA rate. No cohort-wide statistic from a mixed series has been attributed to cblA
  anywhere in this entry.

  Evidence-source grading convention, applied consistently throughout this file.
  Measurements made on patients or patient material and reported as findings about those
  patients, including diagnostic enzymology and biopsy histology, are graded
  HUMAN_CLINICAL. Experiments performed on cultured cells or purified proteins to test a
  mechanism, including somatic cell complementation, recombinant protein biochemistry,
  crystallography and transcript-stability assays, are graded IN_VITRO. Papers that report
  both, notably PMID:28497574 and PMID:17957493, have their evidence split into separate
  items so each carries a single grade. GeneReviews is graded OTHER, matching the
  treatment of the sibling GeneReviews chapter in
  kb/disorders/MMADHC-related_Disorder_of_Cobalamin_Metabolism_cblD_Type.yaml.

  Not curated, and why. The Orphanet record ORPHA:79310 is cited under
  external_assertions, but only partially. just refresh-orphadata aborts on a checksum
  mismatch: the upstream en_product1.xml no longer matches the sha256 pinned in
  data/orphadata/MANIFEST.yaml. It downloads that file before failing, which is enough
  for just structured-rebuild-orphanet --id 79310 to generate a valid nosology and
  cross-reference record, and that is what is committed here. It is not enough for the
  definition, phenotype and epidemiology sections, which come from the en_product4,
  en_product6 and en_product9_prev bulk files that the aborted run never fetched. So no
  Orphanet prevalence class or HPO frequency table was available. Repinning the manifest
  would rewrite every committed ORPHA cache file and does not belong in a curation pull
  request; the stale pin is reported instead. Note also that just fetch-reference
  ORPHA:79310 does not work and reports "No source found for reference type" -
  structured-rebuild-orphanet is the path for this prefix. No animal models are curated,
  for the reasons set out in the first knowledge gap. No prevalence rate is recorded
  because none specific to cblA has been published.

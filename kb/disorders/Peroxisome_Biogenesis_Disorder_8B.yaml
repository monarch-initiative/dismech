name: Peroxisome Biogenesis Disorder 8B
creation_date: "2026-09-16T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: peroxisome biogenesis disorder 8B
  term:
    id: MONDO:0013943
    label: peroxisome biogenesis disorder 8B
description: >-
  Peroxisome biogenesis disorder 8B (PBD8B, OMIM 614877) is the non-classic
  ("B") end of the PEX16-related Zellweger spectrum. PEX16 defines
  complementation group D (group 9 in the US series) of the peroxisome
  biogenesis disorders and encodes an integral peroxisomal membrane peroxin that
  acts in membrane assembly rather than in matrix protein import.

  That places PBD8B at a different point in the pathway from every other
  non-classic Zellweger-spectrum entry curated here. PBD1B, PBD2B and PBD4B are
  defects of the matrix import machinery - a receptor, or the module that
  recycles it - and their peroxisomes are present but cannot take up cargo. A
  complete PEX16 defect is upstream of all of that: it removes the organelle
  itself. The founding PEX16 patients had no peroxisomal remnants at all, which
  is what made PEX16 the gene that demonstrated peroxisomes can be built without
  a pre-existing peroxisome.

  PBD8B is what happens when that lesion is incomplete, and the resulting
  cellular picture is genuinely counterintuitive. Fibroblasts from these
  patients do not show a milder version of "no peroxisomes". They show
  peroxisomes that are fewer in number but enlarged, and competent to import
  matrix protein - so the assay that establishes a classic peroxisome biogenesis
  disorder can read close to normal here. Residual PEX16 protein is detectable
  on immunoblot in atypical patients and absent in a patient with the severe
  presentation, which is the molecular counterpart of that morphology.

  Clinically it does not look like a Zellweger-spectrum disease either.
  Presentation is in the preschool years with progressive spastic paraparesis
  and ataxia, a leucodystrophy-plus-atrophy pattern on MRI, and later cataracts
  and peripheral neuropathy; dystonia and tremor are reported; cognition is
  often preserved and survival is prolonged. The sensory loss and amelogenesis
  imperfecta that characterise the rest of the spectrum can be entirely absent.
  Plasma very-long-chain fatty acids may be only subtly raised or frankly
  normal. The practical consequence, which the source reports make themselves,
  is that these individuals are reached by sequencing rather than by biochemical
  screening, and are more likely to be worked up as hereditary spastic
  paraplegia or an undiagnosed leukodystrophy than as a peroxisomal disease.
parents:
- Zellweger Spectrum Disorders
- peroxisome biogenesis disorder
- inborn errors of metabolism

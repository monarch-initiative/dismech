  description: >-
    The tissue lesion that produces the clinical picture. Imaging in the founding
    cohort showed a characteristic pattern of progressive leucodystrophy with
    brain atrophy, and the later case series localised the T2/FLAIR change to the
    brainstem, the superior and middle cerebellar peduncles, the corticospinal
    tracts and the splenium of the corpus callosum - which is the anatomical
    explanation for a syndrome dominated by spasticity and cerebellar signs with
    cognition relatively spared. Magnetic resonance spectroscopy in one patient
    showed a raised myo-inositol peak, interpreted by the reporting authors as a
    non-specific marker of glial proliferation; this entry records that
    interpretation rather than asserting astrocytosis.

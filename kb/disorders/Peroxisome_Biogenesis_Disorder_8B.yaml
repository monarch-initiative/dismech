notes: >-
  CURATION LEVEL, AND WHY THIS IS A STANDALONE ENTRY. Claim issue #11974 asked
  whether PBD8B should be an entry, a subtype, or out of scope. It is curated as
  a distinct entry, following Peroxisome Biogenesis Disorder 1B (PEX1), 2B
  (PEX5) and 4B (PEX6), on the same reasoning those entries record: the A/B
  split inside a PEX complementation group is a mechanistic statement about how
  much peroxin function survives, not a bare severity label, and the causal gene
  differs between groups. Three repository facts back that up rather than a
  preference. `Peroxisome_Biogenesis_Disorder.yaml` carries no `has_subtypes`
  block at all, so there is no subtype list for this concept to join. MONDO
  places MONDO:0013943 under MONDO:0100269 (peroxisome biogenesis disorder due
  to PEX16 defect), a gene-level parent that is itself uncurated, not under a
  curated disease. And PBD8B has its own primary literature - six patients in
  the founding report, seven in a later case series, three in a consanguineous
  kindred and one by whole-genome sequencing - which a subtype row could not
  carry.

  The gene-agnostic downstream cascade shared by the whole spectrum - loss of
  peroxisomal beta-oxidation, ether-lipid synthesis and bile acid side-chain
  shortening, and the resulting multisystem disease - is curated once on the
  Zellweger Spectrum Disorders entry and is deliberately not duplicated here.
  What this entry carries is what is PEX16- and non-classic-specific: a membrane
  assembly lesion rather than a matrix import lesion, and a residual-function
  phenotype that presents as enlarged import-competent peroxisomes rather than
  as absent ones.

  WHERE THE GENE CAME FROM. The stub records no causal gene. PEX16 was resolved
  from the MONDO parent chain (MONDO:0100269, "peroxisome biogenesis disorder
  due to PEX16 defect") and independently confirmed against NCBI
  `mim2gene_medgen`, which maps OMIM:614877 to GeneID 9409 with a GeneMap
  source. The HGNC REST API returns HGNC:8857, symbol PEX16, "peroxisomal
  biogenesis factor 16", 11p11.2, OMIM gene 603360. `kb/` was then re-checked
  for PEX16 rather than for the disease label: the only hit is a `genetic:` row
  on `Peroxisome_Biogenesis_Disorder.yaml`, which cites the same ClinGen
  assertion used here and curates no PEX16-specific mechanism, so nothing was
  already covering this entity under another name.

  PBD8A IS NOT CURATED HERE AND IS NOT IMPLIED. Classic PEX16 Zellweger syndrome
  (PBD8A, OMIM 614876) has no entry in this knowledge base. It appears in this
  entry only as the contrast that defines "8B" - the total absence of
  peroxisomal remnants, and the absence of PEX16 protein on immunoblot, against
  which the residual-function claim is made. Creating the PBD8A entry is a
  reasonable follow-on. Evidence items that describe PBD8A cells are marked
  `directness: INDIRECT` where they are cited in support of a PBD8B claim,
  because they establish the severe pole rather than this entity.

  FREQUENCY BANDS ARE NOT ASSERTED. No phenotype in this entry carries a
  `frequency` band. The reason is specific, not a default. Two of the four
  clinical sources are single-patient or three-patient reports. The seven-patient
  case series (PMID:35106698) gives per-feature counts for some features
  ("all patients had hypertonia", "Five patients were noted to have dystonia")
  and those numerators are recorded in the phenotype `notes`, but the series is
  explicitly a selected atypical-phenotype cohort rather than a consecutive
  PEX16 series, so a band computed from it would describe the selection and not
  the disease. The founding six-patient report (PMID:20647552) describes its
  cohort's features collectively in its abstract without per-feature counts.

  THE NEGATIVE FINDINGS ARE LOAD-BEARING AND ARE CURATED AS SUCH. Two of the
  most useful facts about this entity are absences: classic PBD sensory deficits
  and amelogenesis imperfecta were absent in all seven patients of the case
  series, and plasma very-long-chain fatty acids were normal in the
  whole-genome-sequencing patient. Both are curated - the first in the
  Zellweger-spectrum differential, the second on the VLCFA biochemical marker -
  rather than left out because they are negative. Do not read either as a claim
  that those features never occur in PEX16 disease; they are cohort-level
  observations in selected atypical patients.

  WHAT IS KNOWINGLY ABSENT. No prevalence rate: none has been estimated, so only
  a literature case count is recorded. No `animal_models:` block despite a
  Drosophila humanisation study being cited - the flies carry a Pex16 null with
  human alleles expressed on top, which models the allele series rather than
  this disease, and the study's own framing is a severity spectrum across PEX2
  and PEX16 rather than a PBD8B model; the result is curated as evidence on the
  residual-function node instead. No `datasets:` block: no PEX16-specific omics
  dataset was identified, and a gene search for PEX16 would surface
  Zellweger-spectrum and peroxisome-biology series that resolve perfectly and
  are not about this entity. No disease-modifying treatment exists; everything
  curated is supportive, and the one intervention with a reported response
  (levodopa/carbidopa for dystonia) is an uncontrolled treatment trial within a
  case series and is curated with that caveat stated in its own description.

  DEEP RESEARCH. One falcon run was performed and is committed at
  `research/Peroxisome_Biogenesis_Disorder_8B-deep-research-falcon.md`. It was
  treated as leads only: every PMID, snippet and ontology term in this entry was
  fetched and verified against the local cache independently of it, and nothing
  was bound from the report.

  The query was disambiguated by temporarily setting this entry's `name:` to
  "PEX16 deficiency (peroxisome biogenesis disorder 8B, the mild non-Zellweger
  end of the PEX16 spectrum)" for the duration of the run, because the recipe
  derives the query from that field and "Peroxisome Biogenesis Disorder 8B"
  alone is the kind of numbered label a provider substitutes for something else.
  `just preflight-dr` returned SKIP, not PASS, because MONDO records no causal
  gene for MONDO:0013943, so its gene-identity check has nothing to discriminate
  on; SKIP means unchecked. The manual fallback settles it: the report mentions
  PEX16 101 times and no other PEX gene even once, carries OMIM 614877 (which
  matches MONDO's cross-reference) alongside 614876 for the severe allelic
  disorder and 603360 for the gene, and states in its own scope section that
  PBD8B is the mild end of the PEX16 continuum. It is about the right entity.

  Its own validators flagged four term problems, recorded here because they are
  the reason nothing was bound from it: one invented identifier (`HP:000`), one
  obsolete term (`HP:0040083`), and two identifiers named as something else -
  `HP:0032312` is "Decreased circulating globulin concentration" and the report
  calls it "abnormal very-long-chain fatty-acid level". Its reference validator
  resolved all twelve extracted references.

  It independently reached the same framing as this entry - residual PEX16
  function, a severity position on a continuum rather than a separate
  biochemical mechanism, and clinical expectations that cannot be quantified
  because no PEX16 cohort supports them. It also carries leads this entry does
  not curate, recorded so the next curator does not re-derive them: a
  hepatocyte-specific Pex16-knockout mouse with absent hepatic peroxisomes and
  altered serum lipids and bile acids; locomotor, bang-sensitivity and
  lifespan phenotypes in Pex16-null Drosophila beyond the allele-rescue result
  cited here; ocular findings across PEX16 disease including optic atrophy and
  abnormal retinal pigmentation; and a second registered study, NCT06190626, on
  Zellweger-spectrum retinopathy. None is curated as evidence, because a
  deep-research report is a lead.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PBD8B requires biallelic PEX16 variants, with at least one allele retaining
    partial peroxin function. Reported genotypes include apparent homozygosity
    in consanguineous families and compound heterozygosity. PEX16 is autosomal,
    so the recurrence risk is 25 percent per sibship.
  evidence:
  - reference: CGGV:assertion_7506d938-efb4-416c-aafd-221251d00e6e-2020-01-13T170000.000Z
    reference_title: "PEX16 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "PEX16 | HGNC:8857 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: >-
      ClinGen's Peroxisomal Disorders Gene Curation Expert Panel classifies the
      PEX16-peroxisome biogenesis disorder relationship as definitive with
      autosomal recessive inheritance.
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Subsequent sequencing of all known PEX genes revealed five novel apparent
      homozygous mutations in the PEX16 gene.
    explanation: >-
      Apparent homozygosity in the founding PBD8B cohort, consistent with
      recessive inheritance.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      each sib of an individual with biallelic ZSD-causing pathogenic variants
      has a 25% chance of being affected, a 50% chance of being an asymptomatic
      carrier, and a 25% chance of being unaffected and not a carrier
    explanation: >-
      The recurrence-risk figure this block states. Indirect: gene-agnostic
      across the thirteen ZSD-PEX genes rather than a PEX16 segregation
      analysis.
pathophysiology:
- name: Hypomorphic PEX16 Variants with Residual Peroxin Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion, and the point at which PBD8B separates from classic
    PEX16 Zellweger syndrome. PEX16 mutations define complementation group D of
    the peroxisome biogenesis disorders, established by the observation that
    expressing wild-type PEX16 restores peroxisome biogenesis in CG-D fibroblasts
    and in no other group. What distinguishes the non-classic end is that the
    variant protein survives: residual PEX16 is detectable by immunoblot in
    fibroblasts from atypical patients and is absent in a patient with the severe
    presentation. The allele series has been tested directly in a humanised
    Drosophila model, where alleles from mild disease partially rescued a Pex16
    null and alleles from atypical ataxia rescued it fully - a graded residual
    function that is specific to the allele rather than an all-or-nothing loss.
  genes:
  - preferred_term: PEX16
    term:
      id: hgnc:8857
      label: PEX16
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9837814
    reference_title: Mutation in PEX16 is causal in the peroxisome-deficient Zellweger syndrome of complementation group D.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      HsPEX16 expression morphologically and biochemically restored peroxisome
      biogenesis only in fibroblasts from a CG-D patient with ZS in Japan
    explanation: >-
      The complementation experiment that assigns PEX16 to this group. Indirect:
      the patient complemented was a Zellweger syndrome (PBD8A) patient, so this
      establishes the gene for the group and not the residual-function allele
      class of PBD8B.
  - reference: PMID:35106698
    reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We demonstrated residual PEX16 protein amounts by immunoblotting in
      fibroblasts available from 5 patients with this atypical PEX16 disease (3
      from this series, 2 previously reported), in contrast to the absence of
      PEX16 protein in fibroblasts from a patient with the severe ZSD
      presentation.
    explanation: >-
      The direct molecular demonstration that the non-classic end retains PEX16
      protein and the severe end does not. This is the evidence the whole
      residual-function framing of this entry rests on.
  - reference: PMID:40621817
    reference_title: "Distinguishing PEX2 and PEX16 gene variant severity for mild, severe and atypical peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Alleles linked to mild PBD showed partial rescue, while variants
      associated with atypical ataxia could fully rescue.
    explanation: >-
      Human PEX16 alleles graded by how far they rescue a Drosophila Pex16 null,
      so the residual function is allele-specific and continuous. Indirect: a
      humanised fly assay of the allele series, not an observation in patients.
  downstream:
  - target: Partially Preserved Peroxisomal Membrane Assembly
    description: >-
      Residual PEX16 protein leaves the membrane assembly step it serves
      partially functional, rather than abolished as in classic PEX16 Zellweger
      syndrome.
- name: Partially Preserved Peroxisomal Membrane Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    PEX16 is an integral peroxisomal membrane protein that functions in membrane
    assembly, upstream of Pex3p, and is required for peroxisome formation in the
    absence of a pre-existing peroxisome: the cell line in which PEX16 was
    identified could not import peroxisomal membrane proteins at all, and
    expressing PEX16 restored the formation of new peroxisomes. In current
    models, PEX16 arrives on endoplasmic-reticulum-derived vesicles that fuse
    with Pex3- and Pex14-bearing pre-peroxisomal structures to confer full import
    competence. This is the step PBD8B leaves partly intact and classic PEX16
    disease does not, and it is why the lesion here is upstream of the matrix
    import machinery affected in PBD1B, PBD2B and PBD4B.
  biological_processes:
  - preferred_term: peroxisome membrane biogenesis
    term:
      id: GO:0016557
      label: peroxisome membrane biogenesis
    modifier: DECREASED
  - preferred_term: protein import into peroxisome membrane
    term:
      id: GO:0045046
      label: protein import into peroxisome membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:9922452
    reference_title: Peroxisome synthesis in the absence of preexisting peroxisomes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      we report here a Zellweger syndrome patient (PBD061) with an unusual
      cellular phenotype, an inability to import peroxisomal membrane proteins.
      We also identified human PEX16, a novel integral peroxisomal membrane
      protein, and found that PBD061 had inactivating mutations in the PEX16
      gene.
    explanation: >-
      Establishes that PEX16 acts on peroxisomal membrane protein import rather
      than matrix import. Indirect: the cell line carries inactivating
      mutations, so it defines the complete-loss pole against which the partial
      preservation in PBD8B is described.
  - reference: PMID:12223482
    reference_title: "The membrane biogenesis peroxin Pex16p. Topogenesis and functional roles in peroxisomal membrane assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      These results imply that Pex16p functions in peroxisome membrane assembly,
      more likely upstream of Pex3p.
    explanation: >-
      Places PEX16 upstream of PEX3 in membrane assembly, which is what makes
      this lesion upstream of the matrix-import defects of the other non-classic
      Zellweger-spectrum entries. Indirect: a cell-biological mapping of the
      peroxin, not an observation in PBD8B cells.
  - reference: PMID:28146471
    reference_title: Newly born peroxisomes are a hybrid of mitochondrial and ER-derived pre-peroxisomes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Maturation of pre-peroxisomes containing Pex3 and Pex14 requires fusion
      with endoplasmic reticulum-derived vesicles carrying Pex16, thereby
      providing full import competence.
    explanation: >-
      The step at which PEX16 acts, and the reason a partial PEX16 defect yields
      peroxisomes that exist but are fewer. Indirect: worked out in
      peroxisome-lacking patient fibroblasts and not in PBD8B cells.
  downstream:
  - target: Reduced Peroxisome Number with Compensatory Enlargement
    description: >-
      Partial membrane assembly yields a peroxisome population that forms, but
      at reduced numerical density.
- name: Reduced Peroxisome Number with Compensatory Enlargement
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The cellular signature of PBD8B, and the finding that makes it hard to
    diagnose. Fibroblasts from the founding cohort contained peroxisomes that
    were import-competent and increased in size but reduced in number - the
    opposite of the absent peroxisomal remnants reported for severe PEX16
    disease. The same morphology was reproduced by quantitative imaging in
    olfactory-neurosphere-derived neural stem cells from an independent patient,
    and fewer catalase- and PMP70-containing particles were seen in a third
    kindred. Why the surviving peroxisomes are enlarged is not established; the
    source reporting the quantification says the mechanism is unclear, and this
    entry does not assert one.
  biological_processes:
  - preferred_term: peroxisome organization
    term:
      id: GO:0007031
      label: peroxisome organization
    modifier: DECREASED
  cellular_components:
  - preferred_term: peroxisome
    term:
      id: GO:0005777
      label: peroxisome
  evidence:
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Immunofluorescence microscopy revealed the presence of import-competent
      peroxisomes, which were increased in size but reduced in number.
    explanation: >-
      The defining cellular observation in the six founding PBD8B patients.
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      PEX16-defective patients have been reported to have a severe clinical
      presentation. Fibroblasts from these patients displayed a defect in the
      import of peroxisomal matrix and membrane proteins, resulting in a total
      absence of peroxisomal remnants.
    explanation: >-
      The contrast that makes the finding above surprising. Indirect: this
      sentence describes previously reported severe PEX16 patients (PBD8A), not
      this entity, and is quoted from the paper's background.
    quote_role: BACKGROUND
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Using olfactory-neurosphere derived cells, a population of neural stem
      cells, we showed patient cells had reduced peroxisome density and
      increased peroxisome size, replicating previously reported findings in
      PEX16 cell lines.
    explanation: >-
      Independent quantitative replication of the morphology, in a neural cell
      type rather than in fibroblasts.
  - reference: PMID:30078639
    reference_title: Atypical PEX16 peroxisome biogenesis disorder with mild biochemical disruptions and long survival.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Immunocytochemical investigations on fibroblasts revealed fewer catalase
      and PMP70-containing particles indicating aberrant peroxisomal assembly.
    explanation: >-
      A third, independent kindred showing reduced peroxisome number by a
      different pair of markers.
  downstream:
  - target: Attenuated Peroxisomal Metabolic Block
    description: >-
      Fewer peroxisomes per cell give a partial rather than complete loss of
      peroxisomal metabolic capacity.
  - target: Reduced Peroxisomal Catalase Activity
    description: >-
      Fewer peroxisomes carry less catalase, which is the one peroxisomal
      enzyme activity measured directly in PBD8B patient cells.
- name: Reduced Peroxisomal Catalase Activity
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Catalase activity was lower in patient-derived neural stem cells than in
    controls, and the reporting authors attribute it to the reduced peroxisome
    number rather than to a separate lesion. The oxidative-stress consequence did
    not follow: challenged with hydrogen peroxide, patient cells showed lower
    rather than higher signal on an oxidative-stress indicator, which the authors
    read as compensation by non-catalase peroxide-metabolising enzymes. Marked
    PROVISIONAL deliberately. It rests on one patient cell line; the authors
    themselves note that total cellular catalase deficiency does not prove
    peroxisomal catalase was mistargeted, and that particulate catalase was not
    measured. No link from this node to the white-matter phenotype has been
    demonstrated in PEX16 disease, and none is asserted below beyond a
    PROVISIONAL edge.
  molecular_functions:
  - preferred_term: catalase activity
    term:
      id: GO:0004096
      label: catalase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: hydrogen peroxide catabolic process
    term:
      id: GO:0042744
      label: hydrogen peroxide catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Along with alterations in peroxisome morphology, patient cells also had
      impaired peroxisome function with reduced catalase activity.
    explanation: >-
      The measurement this node records, in patient-derived neural stem cells.
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Furthermore, patient cells had reduced oxidative stress levels after
      exposure to hydrogen-peroxide (H2O2), which may be a result of
      compensation by H2O2 metabolising enzymes other than catalase to preserve
      peroxisome-related cell functions.
    explanation: >-
      The counterintuitive downstream result, recorded here so the node is not
      read as establishing oxidative stress in this disease. The authors offer
      compensation as a hypothesis, which is why this node is PROVISIONAL.
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Although total cellular catalase was mildly deficient in the patient's
      cultured cells, this does not prove that peroxisomal catalase was
      mistargeted.
    explanation: >-
      The authors' own limitation on the measurement above, and the reason this
      node carries PROVISIONAL confidence rather than ESTABLISHED.
  downstream:
  - target: Progressive Central White Matter and Long Tract Degeneration
    description: >-
      A plausible but undemonstrated contribution. No study has linked reduced
      catalase activity to the white-matter lesion in PEX16 disease, and the
      compensation result above argues that whole-cell peroxide handling is not
      simply impaired. Carried as a PROVISIONAL edge rather than dropped, so the
      open question stays visible; see the knowledge-gap discussion.
- name: Attenuated Peroxisomal Metabolic Block
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The whole-organism metabolic consequence, and it is attenuated to the point
    of being unreliable as a diagnostic signal. Plasma analysis in the founding
    cohort showed abnormalities suggesting a peroxisomal disorder, but
    biochemical variables in the same patients' fibroblasts were only mildly
    abnormal or within the normal range. A later kindred had only subtle
    elevations of C26 and the C26/C22 ratio, and the whole-genome-sequencing
    patient had frankly normal plasma very-long-chain fatty acids. The specific
    peroxisomal functions curated on the Zellweger Spectrum Disorders entry -
    beta-oxidation of very-long-chain fatty acids and ether-lipid synthesis -
    are the ones at issue, and the point here is the degree of block rather than
    a different set of pathways.

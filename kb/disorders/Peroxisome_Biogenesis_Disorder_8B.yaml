genetic:
- name: PEX16
  gene_term:
    preferred_term: PEX16
    term:
      id: hgnc:8857
      label: PEX16
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic pathogenic or likely pathogenic variants
  notes: >-
    PEX16 (HGNC:8857, OMIM 603360) is at 11p11.2 and encodes a 336-amino-acid
    integral peroxisomal membrane peroxin, Pex16p. Reported PBD8B genotypes are
    private and scattered: five novel apparent homozygous mutations across the
    six founding patients, a homozygous c.859C>T in a consanguineous kindred,
    compound heterozygous c.658G>A p.(Ala220Thr) and c.830G>A p.(Arg277Gln) in a
    whole-genome-sequencing patient, and four further novel alleles in the case
    series. No recurrent founder allele is described, and no genotype-phenotype
    rule is asserted here - the humanised Drosophila work grades alleles by
    rescue rather than by clinical prediction. The severe-end allele that
    anchors the contrast is the nonsense R176X of the original complementation
    group D patient.
  evidence:
  - reference: CGGV:assertion_7506d938-efb4-416c-aafd-221251d00e6e-2020-01-13T170000.000Z
    reference_title: "PEX16 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: "PEX16 | HGNC:8857 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: >-
      ClinGen's definitive gene-disease validity classification for PEX16.
  - reference: PMID:9837814
    reference_title: Mutation in PEX16 is causal in the peroxisome-deficient Zellweger syndrome of complementation group D.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      These results demonstrate that mutation in PEX16 is the genetic cause of
      CG-D PBDs.
    explanation: >-
      Assigns PEX16 to complementation group D. Indirect for PBD8B: the patient
      characterised had Zellweger syndrome, so this establishes the gene for the
      group rather than the non-classic allele class.
  - reference: PMID:9837814
    reference_title: Mutation in PEX16 is causal in the peroxisome-deficient Zellweger syndrome of complementation group D.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      One patient (PBDD-01) possessed a homozygous, inactivating nonsense
      mutation, C-->T at position 526 in a codon (CGA) for 176Arg, that resulted
      in a termination codon (TGA).
    explanation: >-
      The severe-end nonsense allele named in this block's notes. Indirect: a
      PBD8A genotype, cited to anchor the contrast with the hypomorphic alleles
      of this entity.
  - reference: PMID:30078639
    reference_title: Atypical PEX16 peroxisome biogenesis disorder with mild biochemical disruptions and long survival.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      WES revealed a novel homozygous variant in PEX16 (c.859C>T).
    explanation: >-
      One of the PBD8B genotypes listed in this block's notes.
biochemical:
- name: Very-long-chain fatty acids
  presence: Increased
  context: >-
    Plasma C26:0 and the C26:0/C22:0 ratio are the first-line biochemical screen
    for a peroxisomal disorder, and at this end of the spectrum they are an
    unreliable gate rather than a reliable one. Elevations may be subtle, and at
    least one genetically confirmed patient had frankly normal values. A normal
    result does not exclude PBD8B.
  biomarker_term:
    preferred_term: very long-chain fatty acid
    term:
      id: CHEBI:27283
      label: very long-chain fatty acid
  evidence:
  - reference: PMID:30078639
    reference_title: Atypical PEX16 peroxisome biogenesis disorder with mild biochemical disruptions and long survival.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Very-long-chain fatty acids analysis showed subtle elevations in C26 and
      C26/C22.
    explanation: >-
      The magnitude of the abnormality in a genetically confirmed kindred:
      subtle, not diagnostic on its own.
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Plasma very long chain fatty acids (VLCFA) and lysosomal enzymes were
      normal
    explanation: >-
      A genetically confirmed PEX16 patient with normal plasma VLCFA. Recorded
      as REFUTE against the claim that this marker is reliably elevated in this
      disorder, which is the practical point a curator or clinician needs from
      this row.
- name: Peroxisome number and size in patient cells
  notes: >-
    The cellular assay that actually identifies this entity, and the one whose
    result is counterintuitive. Immunofluorescence for a peroxisomal marker
    shows peroxisomes that are import-competent, larger, and fewer - not absent
    as in severe PEX16 disease, and not import-incompetent as in the matrix
    import disorders. Reported with PEX14 and with catalase/PMP70 as markers,
    and quantified as density and size by automated image analysis in one study.
    A laboratory scoring only matrix protein import can therefore call these
    cells normal.
  evidence:
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Although PEX16 is involved in peroxisomal membrane assembly, PEX16 defects
      can present with enlarged import-competent peroxisomes in fibroblasts. This
      is important for future diagnostics of patients with a peroxisomal
      disorder.
    explanation: >-
      The authors' own diagnostic conclusion: the cellular phenotype is not what
      a laboratory expects from a membrane-assembly peroxin.
- name: Catalase activity
  presence: Decreased
  context: >-
    Measured in patient-derived olfactory-neurosphere neural stem cells against
    three control lines, and lower in the patient cells. Not a validated
    diagnostic assay for this disorder - it is a single research measurement in
    one patient line, and the same report cautions that it does not establish
    catalase mistargeting.
  biomarker_term:
    preferred_term: catalase
    term:
      id: NCIT:C61062
      label: Catalase
  evidence:
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Compared to control cells, patient cells had lower catalase activity
    explanation: >-
      The measurement itself.
diagnosis:
- name: Genomic sequencing as the primary route to diagnosis
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Unlike classic Zellweger-spectrum disease, PBD8B is usually reached by
    sequencing rather than by biochemistry. Of the four clinical reports behind
    this entry, one identified the gene only after sequencing all known PEX
    genes, one by whole-exome sequencing, and one by whole-genome sequencing in a
    patient whose plasma very-long-chain fatty acids were normal and who had
    already had targeted hereditary-spastic-paraplegia and leukodystrophy genes
    excluded. The practical rule is that PEX16 should be on the gene list for
    unexplained childhood-onset spastic ataxia with leukodystrophy, whatever the
    peroxisomal biochemistry shows.
  evidence:
  - reference: PMID:30078639
    reference_title: Atypical PEX16 peroxisome biogenesis disorder with mild biochemical disruptions and long survival.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      This paper highlights the diagnostic challenge of PEX16 patients due to the
      widely variable clinical and biochemical phenotypes.
    explanation: >-
      States the diagnostic problem this block exists to record.
  - reference: PMID:30078639
    reference_title: Atypical PEX16 peroxisome biogenesis disorder with mild biochemical disruptions and long survival.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      It also emphasizes the important roles of combined biochemical assays with
      next generation sequencing techniques in reaching diagnosis in the context
      of atypical clinical presentations, subtle biomarker abnormalities and
      consanguinity.
    explanation: >-
      The authors' own recommendation to combine sequencing with biochemistry
      rather than gating on biochemistry.
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Subsequent sequencing of all known PEX genes revealed five novel apparent
      homozygous mutations in the PEX16 gene.
    explanation: >-
      Even in the founding cohort the gene was reached by sequencing the whole
      PEX panel, after the cellular assays had failed to point at PEX16.
- name: Peroxisome morphology in cultured patient cells
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Immunofluorescence for peroxisomal markers in fibroblasts or another
    patient-derived line, scored for peroxisome number and size rather than only
    for matrix protein import. This is the assay that can be misread in PBD8B:
    the peroxisomes are import-competent, so an import-only readout looks normal
    while the density and size are abnormal.
  evidence:
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Immunofluorescence microscopy revealed the presence of import-competent
      peroxisomes, which were increased in size but reduced in number.
    explanation: >-
      What the assay shows, and the two parameters that must be scored for it to
      be informative here.
treatments:
- name: Levodopa/Carbidopa for Dystonia
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The only intervention in this entry with a reported response. Five patients
    with dystonia in the case series were given a levodopa/carbidopa trial; four
    had partial but significant improvement in dystonia and tremor and one had
    only a minimal response. Read this as a reported, uncontrolled treatment
    trial inside a seven-patient case series, not as an established therapy: no
    control arm, no blinding, no dose-response and no replication. The reporting
    authors present it as a proposed treatment for the dystonia rather than as a
    validated one.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Dystonia
    description: >-
      Symptomatic: the drug is directed at the dystonic phenotype, not at the
      peroxisomal lesion. Nothing in the report claims an effect on peroxisome
      number, biochemistry, or the white-matter disease.
    evidence:
    - reference: PMID:35106698
      reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        Four treated patients had partial but significant improvements in their
        dystonia and tremors, and 1 patient had only minimal response.
      explanation: >-
        The reported response, including the patient who did not respond.
  evidence:
  - reference: PMID:35106698
    reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Five patients were noted to have dystonia and received a treatment trial of
      levodopa/carbidopa.
    explanation: >-
      Establishes the intervention and the number of patients exposed to it.
  - reference: PMID:35106698
    reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      This study further characterizes the phenotype of PEX16 defects by
      highlighting novel and distinctive clinical, neuroradiological, and
      molecular features of the disease and proposes a potential treatment for
      the dystonia.
    explanation: >-
      The authors' own framing - a proposed potential treatment - which is the
      strength of claim this entry records.
- name: Symptomatic and Supportive Management
  therapeutic_modality: OTHER
  description: >-
    No disease-modifying treatment exists for any peroxisome biogenesis
    disorder. Management is symptomatic and is drawn from the Zellweger-spectrum
    guidance: cataract removal, glasses for refractive error, fat-soluble vitamin
    supplementation, and early intervention for developmental needs. Which
    elements apply to an individual with PBD8B depends on which manifestations
    they have, and several items on the ZSD list - hearing aids, adrenal
    replacement, dental management of amelogenesis imperfecta - address features
    that were absent in every patient of the PEX16 case series.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Treatment of manifestations: The focus is on symptomatic therapy and may
      include gastrostomy to provide adequate calories, hearing aids, cataract
      removal, glasses to correct refractive errors, supplementation of
      fat-soluble vitamins, and cholic acid supplementation
    explanation: >-
      The supportive package for the Zellweger spectrum. Indirect: gene-agnostic
      guidance covering the thirteen ZSD-PEX genes, and written mostly around
      phenotypes that this entity may not have.
- name: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Recessive inheritance with a 25 percent sibling recurrence risk, and carrier
    and prenatal testing available once both familial variants are known.
    Consanguinity is prominent in the reported families, which makes carrier
    testing of at-risk relatives particularly relevant here.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Carrier testing for at-risk relatives is possible if the pathogenic
      variants have been identified in an affected family member.
    explanation: >-
      The counselling options available once the genotype is known. Indirect:
      gene-agnostic ZSD guidance.
clinical_trials:
- name: NCT01668186
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    A longitudinal natural history study of peroxisome biogenesis disorders, not
    an interventional trial. It is recorded here because the seven-patient
    atypical PEX16 case series that supplies most of this entry's clinical
    evidence, including the levodopa/carbidopa observation, was registered under
    it. Status is recorded as UNKNOWN because the cached registry summary does
    not state a current recruitment status.
  evidence:
  - reference: clinicaltrials:NCT01668186
    reference_title: Longitudinal Natural History Study of Patients With Peroxisome Biogenesis Disorders (PBD)
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      The Peroxisome Biogenesis Disorders (PBD) are a group of inherited
      disorders due to defects in peroxisome assembly causing complex
      developmental and metabolic sequelae.
    explanation: >-
      The registry record establishing the study's scope. Indirect: a
      registration document covering peroxisome biogenesis disorders as a class,
      not a PEX16-specific protocol.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Roughly seventeen individuals are reported across the four clinical sources
    used here: six in the founding cohort (PMID:20647552), seven in the case
    series (PMID:35106698, two of whom were previously reported and so may
    overlap the founding six), three in a consanguineous kindred (PMID:30078639)
    and one by whole-genome sequencing (PMID:30094183). The overlap is not
    resolvable from the cached abstracts, so this is an upper bound on distinct
    individuals rather than a count. No population prevalence or incidence has
    been estimated for PBD8B, and none is recorded.
  evidence:
  - reference: PMID:20647552
    reference_title: Identification of an unusual variant peroxisome biogenesis disorder caused by mutations in the PEX16 gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      To report on six patients with an unexpected mild variant peroxisome
      biogenesis disorder due to mutations in the PEX16 gene.
    explanation: >-
      The founding cohort size.
  - reference: PMID:35106698
    reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In this case series, medical records and brain MRIs from 7 patients with
      this PEX16 presentation were reviewed to further characterize this
      phenotype.
    explanation: >-
      The case-series size, and the second largest published group.
differential_diagnoses:
- name: Peroxisome biogenesis disorder 8A (classic PEX16 Zellweger syndrome)
  description: >-
    The same gene at the severe pole. PBD8A presents in the newborn period with
    the full Zellweger picture and has no peroxisomal remnants in fibroblasts and
    no detectable PEX16 protein on immunoblot. It has no entry in this knowledge
    base yet.
  distinguishing_features:
  - >-
      Severity and age of onset - PBD8A presents as neonatal Zellweger syndrome,
      PBD8B in the preschool years with spastic paraparesis and ataxia.
  - >-
      Cellular phenotype is the discriminator that actually works - total absence
      of peroxisomal remnants in PBD8A against enlarged, import-competent
      peroxisomes in PBD8B.
  - Residual PEX16 protein is detectable on immunoblot in the atypical presentation
    and absent in the severe one.
  evidence:
  - reference: PMID:35106698
    reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We demonstrated residual PEX16 protein amounts by immunoblotting in
      fibroblasts available from 5 patients with this atypical PEX16 disease (3
      from this series, 2 previously reported), in contrast to the absence of
      PEX16 protein in fibroblasts from a patient with the severe ZSD
      presentation.
    explanation: >-
      The molecular distinction between the two ends of the PEX16 spectrum.
- name: Intermediate and milder Zellweger spectrum disorder of other complementation groups
  disease_term:
    preferred_term: Zellweger spectrum disorder
    term:
      id: MONDO:0019234
      label: peroxisome biogenesis disorder
  description: >-
    The non-classic ends of the other PEX genes - PEX1 (PBD1B), PEX5 (PBD2B),
    PEX6 (PBD4B) and others - share the biochemical screen and are distinguished
    only by sequencing. The PEX16 presentation is nonetheless atypical for the
    group, and the differences are usable at the bedside.
  distinguishing_features:
  - Sensory loss from retinal dystrophy and sensorineural hearing loss, and amelogenesis
    imperfecta in the secondary teeth, are characteristic of intermediate/milder ZSD
    generally but were absent in all seven patients of the PEX16 case series.
  - Cognition is often preserved in PEX16 disease and survival is prolonged, where
    hypotonia and developmental delay are the typical ZSD picture.
  - The cellular lesion is membrane assembly rather than matrix protein import, so
    an import-scored fibroblast assay may read normal in PEX16 disease and abnormal
    in the others.
  evidence:
  - reference: PMID:35106698
    reference_title: "Clinical, neuroradiological, and molecular characterization of patients with atypical Zellweger spectrum disorder caused by PEX16 mutations: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Classic PBD features such as sensory deficits and amelogenesis imperfecta
      were absent in all 7 patients, while all patients had hypertonia.
    explanation: >-
      The negative findings that separate the PEX16 presentation from the rest
      of the spectrum.
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital
      malformations, but rather progressive peroxisome dysfunction variably
      manifest as sensory loss (secondary to retinal dystrophy and sensorineural
      hearing loss), neurologic involvement (ataxia, polyneuropathy, and
      leukodystrophy), liver dysfunction, adrenal insufficiency, and renal
      oxalate stones.
    explanation: >-
      The intermediate/milder ZSD phenotype that the PEX16 presentation departs
      from. Indirect: gene-agnostic across the thirteen ZSD-PEX genes.
- name: Hereditary spastic paraplegia
  description: >-
    The label these patients most often carry before sequencing. Childhood-onset
    progressive spastic paraparesis with white-matter change and preserved
    cognition is an HSP presentation until a PEX gene is found, and at least one
    reported patient had HSP genes specifically excluded first.
  distinguishing_features:
  - Cerebellar signs, cataract, and later peripheral neuropathy alongside the spasticity
    point away from uncomplicated HSP.
  - A leucodystrophy-plus-atrophy MRI pattern with brainstem and cerebellar peduncle
    involvement is not typical of common HSP genotypes.
  - Peroxisomal biochemistry may be normal, so it cannot be used to exclude the
    peroxisomal aetiology.
  evidence:
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Previous genetic testing was negative including sequencing and multiplex
      ligation depended probe amplification of ATL1 and sequencing of the NIPA1
      and EIF2B1 - EIF2B5 genes.
    explanation: >-
      A reported patient in whom hereditary spastic paraplegia and leukodystrophy
      genes were excluded before PEX16 was found, which is the diagnostic path
      this differential describes.
discussions:
- discussion_id: pex16_enlarged_peroxisome_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the peroxisomes that survive a partial PEX16 defect become enlarged
    rather than simply fewer?
  attaches_to:
  - pathophysiology#Reduced Peroxisome Number with Compensatory Enlargement
  rationale: >-
    Reduced number and increased size have now been observed together in three
    independent patient materials - fibroblasts from six founding patients,
    olfactory-neurosphere neural stem cells from an unrelated patient, and
    fibroblasts from a consanguineous kindred - so the morphology is
    reproducible. No mechanism for the enlargement has been established. The
    obvious candidate, a shift in the balance between PEX11-mediated division of
    existing peroxisomes and PEX16-dependent de novo formation, has not been
    tested in PBD8B cells. The authors who quantified the morphology state
    explicitly that the mechanism is unclear. This matters beyond curiosity:
    whether the enlarged organelles are functionally adequate per unit membrane
    determines whether the cellular deficit is one of total peroxisomal capacity
    or of peroxisome distribution.
  evidence:
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      as well as putative novel features observed in this study including
      reduced catalase activity, is currently unclear
    explanation: >-
      The gap stated by the authors who measured the morphology.
  proposed_experiments:
  - experiment_id: pex16_division_vs_de_novo
    name: Separate division from de novo formation in PBD8B cells
    description: >-
      In patient-derived cells carrying hypomorphic PEX16 alleles, measure
      peroxisome fission and de novo formation independently - PEX11-beta
      knockdown and rescue, and pulse labelling of newly formed peroxisomes -
      to determine whether the enlargement reflects impaired division of a
      reduced founder population or an altered division-to-formation balance.
    would_support:
    - pathophysiology#Reduced Peroxisome Number with Compensatory Enlargement
  - experiment_id: pex16_per_peroxisome_capacity
    name: Metabolic capacity per unit peroxisome membrane
    description: >-
      Normalise beta-oxidation flux and plasmalogen synthesis to total
      peroxisomal membrane area rather than to cell number in patient and
      control cells, to test whether the enlarged peroxisomes are functionally
      equivalent to a larger number of normal ones.
    would_support:
    - pathophysiology#Attenuated Peroxisomal Metabolic Block
- discussion_id: pex16_catalase_to_white_matter_link
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does reduced peroxisomal catalase activity contribute to the white-matter
    lesion in PEX16 disease, or is the metabolic block the whole story?
  attaches_to:
  - pathophysiology#Reduced Peroxisomal Catalase Activity
  - pathophysiology#Progressive Central White Matter and Long Tract Degeneration
  rationale: >-
    The edge between these two nodes is the weakest in this entry and is marked
    PROVISIONAL for a reason. Catalase activity is reduced in one patient cell
    line, but the expected oxidative-stress consequence did not appear: on
    hydrogen peroxide challenge the patient cells showed less signal on an
    oxidative-stress indicator, not more, which the reporting authors attribute
    to compensation by other peroxide-metabolising enzymes. The measurement was
    also whole-cell rather than particulate, so it does not establish that
    peroxisomal catalase specifically was lost. Until the question is settled,
    the white-matter lesion in this entry should be read as following from the
    attenuated metabolic block, with the catalase branch an open possibility
    rather than a second established route.
  evidence:
  - reference: PMID:30094183
    reference_title: Expanding the spectrum of PEX16 mutations and novel insights into disease mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      Furthermore, patient cells had reduced oxidative stress levels after
      exposure to hydrogen-peroxide (H2O2), which may be a result of
      compensation by H2O2 metabolising enzymes other than catalase to preserve
      peroxisome-related cell functions.
    explanation: >-
      The result that blocks the straightforward reading of reduced catalase as
      increased oxidative stress.
  proposed_experiments:
  - experiment_id: pex16_particulate_catalase
    name: Particulate versus cytosolic catalase in PEX16 patient cells
    description: >-
      Fractionate patient and control cells and measure catalase activity in the
      peroxisomal versus the cytosolic fraction, in several genetically
      confirmed PEX16 lines, to establish whether catalase is mislocalised or
      simply reduced in proportion to peroxisome number.
    would_support:
    - pathophysiology#Reduced Peroxisomal Catalase Activity
  - experiment_id: pex16_oligodendrocyte_model
    name: Redox and lipid phenotype in a PEX16 oligodendrocyte model
    description: >-
      Differentiate patient-derived induced pluripotent stem cells to
      oligodendrocytes and measure peroxisome number, catalase activity,
      peroxide handling, and myelin lipid composition, to test whether the
      cell type that fails in vivo shows the redox phenotype that fibroblasts
      and neural stem cells do not.
    would_support:
    - pathophysiology#Progressive Central White Matter and Long Tract Degeneration

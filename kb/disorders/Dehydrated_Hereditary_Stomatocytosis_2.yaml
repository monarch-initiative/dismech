name: Dehydrated_Hereditary_Stomatocytosis_2
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: dehydrated hereditary stomatocytosis 2
  term:
    id: MONDO:0014737
    label: dehydrated hereditary stomatocytosis 2
description: >-
  Dehydrated hereditary stomatocytosis type 2 (Gardos channelopathy, a form of
  hereditary xerocytosis) is an autosomal dominant hemolytic anemia caused by
  gain-of-function variants in KCNN4, the gene encoding the erythrocyte Gardos
  channel (a Ca2+-activated, K+-selective channel that regulates red-cell
  volume). The variants raise the channel's calcium sensitivity so it opens at
  lower intracellular calcium, driving potassium and water loss, red-cell
  dehydration, stomatocyte/xerocyte formation, reduced deformability and
  chronic, usually compensated, hemolysis. It is rarer than the PIEZO1-related
  type 1 xerocytosis. Iron overload is a common complication; its mechanism in
  the KCNN4 form is not established (see the knowledge gap).
notes: >-
  This entry is the KCNN4 (type 2) form, kept distinct from the commoner PIEZO1
  (type 1) xerocytosis. The two share the dehydration-hemolysis phenotype but
  differ in the best-characterised iron-overload mechanism, which is tied to
  PIEZO1 and must not be transferred to this KCNN4 entry (see the Iron Overload
  Mechanism knowledge gap). Splenectomy is generally avoided in dehydrated
  hereditary stomatocytosis because of thromboembolic risk; that caution is
  recorded on the treatment rather than modelled as a mechanism here.

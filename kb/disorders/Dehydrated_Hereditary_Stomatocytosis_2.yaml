diagnosis:
- name: Reticulocyte indices and KCNN4 sequencing
  description: >-
    Diagnosis is challenging because there is no specific clinical or biological
    phenotype. Reticulocyte indices on an ADVIA analyzer (delta-MCV and
    delta-MCHC between reticulocytes and mature cells) discriminate Gardos from
    PIEZO1 xerocytosis and flag patients for KCNN4 sequencing, which confirms the
    diagnosis.
  evidence:
  - reference: DOI:10.3389/fphys.2020.602109
    reference_title: "Rapid Gardos Hereditary Xerocytosis Diagnosis in 8 Families Using Reticulocyte Indices"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "its diagnosis is difficult given the absence of a specific clinical or biological phenotype"
    explanation: States why a dedicated diagnostic approach is needed.
  - reference: DOI:10.3389/fphys.2020.602109
    reference_title: "Rapid Gardos Hereditary Xerocytosis Diagnosis in 8 Families Using Reticulocyte Indices"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A threshold of 8.6 fL for ΔMCV and −5.5 g/L for ΔMCHC could discriminate between Gardos and Piezo1-HX with 100% sensitivity and specificity"
    explanation: >-
      Quantifies the reticulocyte-index thresholds that distinguish Gardos
      channelopathy from PIEZO1 xerocytosis at diagnosis.
treatments:
- name: Supportive care and iron monitoring
  description: >-
    Management is supportive: transfusion as needed, folate support, and
    monitoring of iron status with chelation when iron overload develops.
    Splenectomy is generally avoided in dehydrated hereditary stomatocytosis
    because it appears both inefficient and to aggravate thromboembolic risk;
    that caution derives from the broader DHS / PIEZO1 experience rather than
    from KCNN4-specific data.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

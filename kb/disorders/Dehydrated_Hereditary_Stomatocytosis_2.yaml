genetic:
- name: KCNN4 gain-of-function variants
  gene_term:
    preferred_term: KCNN4
    term:
      id: hgnc:6293
      label: KCNN4
  relationship_type: CAUSATIVE
  features: >-
    Recurrent and private missense variants in KCNN4 cause the Gardos
    channelopathy, all gain-of-function changes that increase the channel's
    calcium sensitivity. The recurrent R352H allele is among the more severe;
    S314P is milder; V222L and H340N are the variants reported without obvious
    red-cell dehydration. Penetrance is incomplete and expressivity ranges from
    severe anemia to a single anemic episode to no documented anemia in carriers.

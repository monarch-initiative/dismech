      explanation: >-
        Demonstrates the hyperactive channel in patient red cells, the direct
        consequence of the gain-of-function lesion.
- name: Red Cell Cation Leak and Volume Dysregulation
  description: >-
    Potassium efflux through the over-active Gardos channel produces a red-cell
    cation leak (elevated sodium, reduced potassium) and dysregulated cell
    volume. In the accepted model the cell loses water and dehydrates
    (xerocytosis), and that is the picture in the discovery kindreds; but the
    hydration endpoint is variant-dependent. The recurrent R352H allele shows
    compensatory ion-transport changes that prevent frank dehydration (with Ca2+
    overload instead), and the V222L and H340N variants show no obvious
    dehydration, so the dehydration step is the conventional model rather than an
    obligate consequence (see the Variable Dehydration knowledge gap).
  role: effector
  biological_scale: CELLULAR

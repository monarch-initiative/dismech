    reference_title: "'Gardos Channelopathy': a variant of hereditary Stomatocytosis with complex molecular regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations at two different aminoacid residues in KCNN4 have been reported in patients with hereditary xerocytosis"
    explanation: >-
      Establishes KCNN4 as the gene mutated in this form of hereditary
      xerocytosis.
  - reference: PMID:33351129
    reference_title: "Gardos channelopathy: functional analysis of a novel KCNN4 variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the novel KCNN4 variant p.S314P is a gain-of-function mutation but is less severe than the previously reported p.R352H variant."
    explanation: >-
      Functional analysis confirms the gain-of-function nature of a KCNN4 variant
      and the allelic severity gradient (S314P milder than the recurrent R352H).
pathophysiology:
- name: KCNN4 Gardos Channel Gain of Function
  description: >-
    The trigger lesion. The Gardos channel is a calcium-activated,
    potassium-selective channel in the red-cell membrane that participates in
    cell-volume regulation. Gain-of-function KCNN4 variants increase the
    channel's calcium sensitivity, so it opens at lower intracellular calcium
    concentrations than the wild-type channel.
  role: trigger
  biological_scale: MOLECULAR

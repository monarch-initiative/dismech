    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Gardos channel is a Ca2+ sensitive, K+ selective channel present in several tissues including RBCs, where it is involved in cell volume regulation."
    explanation: >-
      States the channel's identity and its role in red-cell volume regulation,
      the function disrupted by the gain-of-function variants.

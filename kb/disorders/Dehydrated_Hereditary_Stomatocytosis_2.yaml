name: Dehydrated_Hereditary_Stomatocytosis_2
creation_date: "2026-10-27T17:30:00Z"
category: Mendelian
disease_term:
  preferred_term: dehydrated hereditary stomatocytosis 2
  term:
    id: MONDO:0014737
    label: dehydrated hereditary stomatocytosis 2
synonyms:
- Gardos channelopathy
- Gardos-HX
- hereditary xerocytosis type 2
- DHS2
- KCNN4 dehydrated hereditary stomatocytosis
description: >-
  Dehydrated hereditary stomatocytosis type 2 (Gardos channelopathy, a form of
  hereditary xerocytosis) is an autosomal dominant hemolytic anemia caused by
  gain-of-function variants in KCNN4, the gene encoding the erythrocyte Gardos
  channel (a Ca2+-activated, K+-selective channel that regulates red-cell
  volume). The variants raise the channel's calcium sensitivity so it opens at
  lower intracellular calcium, driving potassium efflux and a red-cell cation
  leak. In the accepted model this dehydrates the cell (xerocytosis), but the
  hydration endpoint is variant-dependent: the recurrent R352H allele shows
  compensatory effects that prevent frank dehydration and red-cell Ca2+ overload
  instead, and other variants (V222L, H340N) show no obvious dehydration at all,
  so the channelopathy is now seen as a complex pathology distinct from the
  common PIEZO1 xerocytosis. The downstream picture is reduced deformability and
  chronic, usually compensated, hemolysis with splenomegaly, and a high rate of
  iron overload. It is rarer than the PIEZO1-related type 1 xerocytosis.
notes: >-
  This entry is the KCNN4 (type 2) form, kept distinct from the commoner PIEZO1
  (type 1) xerocytosis. The two share hemolysis, frequent hyperferritinemia and
  an inefficient response to splenectomy, but Picard 2019 concluded they are not
  the same disease, and the best-characterised hepatic iron-overload mechanism
  is tied to PIEZO1, not KCNN4 (see the Iron Overload Mechanism knowledge gap);
  it must not be transferred to this entry. The central cellular step is modelled
  as a cation leak / volume dysregulation rather than as obligate dehydration,
  because the entry's own KCNN4 sources disagree on whether dehydration occurs
  (see the Variable Dehydration knowledge gap). Splenectomy is generally avoided
  in dehydrated hereditary stomatocytosis because of thromboembolic risk; that
  caution derives from the broader DHS / PIEZO1 experience rather than from
  KCNN4-specific data, and is recorded on the treatment rather than modelled as a
  mechanism.

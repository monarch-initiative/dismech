    reference_title: "Clinical and biological features in PIEZO1-hereditary xerocytosis and Gardos channelopathy: a retrospective series of 126 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatments included phlebotomy (n=15), deferasirox (n=9), deferoxamine (n=3) and deferiprone (n=1). Mean liver iron content, evaluated using magnetic resonance imaging, was 200±103 μmol/g at diagnosis (n=20) vs. 88±42 (n=14) at the last follow-up (P<0.001), showing that iron chelation was efficient in decreasing iron content in the liver"
    explanation: >-
      Demonstrates clinical reduction of MRI-measured liver iron content with

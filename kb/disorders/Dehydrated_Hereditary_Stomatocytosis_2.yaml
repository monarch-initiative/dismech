treatments:
- name: Supportive care and iron monitoring
  description: >-
    Management is supportive: transfusion as needed, folate support, and
    monitoring of iron status with chelation when iron overload develops.
    Splenectomy is generally avoided because it appears to aggravate the
    thromboembolic risk of dehydrated hereditary stomatocytosis.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
discussions:
- discussion_id: iron_overload_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does iron overload develop in KCNN4 (type 2) dehydrated
    hereditary stomatocytosis, and is hepcidin inappropriately low as in the
    PIEZO1 form?
  rationale: >-
    Iron overload is near-universal in dehydrated hereditary stomatocytosis,
    including in untransfused patients, so it is not simply transfusional. In
    the PIEZO1 (type 1) form, gain-of-function PIEZO1 has been linked to
    suppression of hepatic hepcidin, but erythropoiesis in these disorders is
    effective rather than ineffective, so the erythroferrone route that drives
    iron loading in the thalassemias does not straightforwardly apply. For the
    KCNN4 (type 2) form specifically, no hepcidin or iron-handling mechanism has
    been established, so whether this entry belongs on the hepcidin-deficiency
    iron-overload pathway is unresolved and it is deliberately left unconformed.
  attaches_to:
  - phenotypes#Iron overload

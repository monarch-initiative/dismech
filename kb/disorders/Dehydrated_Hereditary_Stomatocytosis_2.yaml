genetic:
- name: KCNN4 gain-of-function variants
  gene_term:
    preferred_term: KCNN4
    term:
      id: hgnc:6293
      label: KCNN4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Recurrent and private missense variants (plus a splice-junction deletion) in
    KCNN4 cause the Gardos channelopathy, acting as gain-of-function changes
    that increase the channel's calcium sensitivity. The recurrent R352H allele
    is among the more severe; S314P is milder; V222L and H340N are the variants
    reported without obvious red-cell dehydration. Penetrance is incomplete and
    expressivity ranges from severe anemia to a single anemic episode to no
    documented anemia in carriers.
  evidence:
  - reference: PMID:26198474
    reference_title: "Mutations in the Gardos channel (KCNN4) are associated with hereditary xerocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hereditary xerocytosis (HX; MIM 194380) is an autosomal-dominant hemolytic anemia characterized by primary erythrocyte dehydration."
    explanation: >-
      Frames the autosomal dominant hemolytic anemia context in the KCNN4
      discovery study.
  - reference: PMID:26198474
    reference_title: "Mutations in the Gardos channel (KCNN4) are associated with hereditary xerocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing identified novel, heterozygous mutations affecting the Gardos channel, encoded by the KCNN4 gene, in both kindreds."
    explanation: >-
      Primary genetic discovery establishing heterozygous KCNN4 mutations as a
      cause of hereditary xerocytosis.
  - reference: PMID:33351129
    reference_title: "Gardos channelopathy: functional analysis of a novel KCNN4 variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the novel KCNN4 variant p.S314P is a gain-of-function mutation but is less severe than the previously reported p.R352H variant."
    explanation: >-
      Confirms the gain-of-function nature of a KCNN4 variant and the allelic
      severity gradient (S314P milder than the recurrent R352H).
  - reference: DOI:10.3389/fphys.2022.918620
    reference_title: "New KCNN4 Variants Associated With Anemia: Stomatocytosis Without Erythrocyte Dehydration"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no documented sign of anemia for the parents who also carried the mutation"
    explanation: >-
      Documents incomplete penetrance / variable expressivity: carrier parents of
      an affected proband had no documented anemia.
pathophysiology:
- name: KCNN4 Gardos Channel Gain of Function
  description: >-
    The trigger lesion. The Gardos channel is a calcium-activated,
    potassium-selective channel in the red-cell membrane that participates in
    cell-volume regulation. Gain-of-function KCNN4 variants increase the
    channel's calcium sensitivity, so it opens at lower intracellular calcium
    concentrations than the wild-type channel; red-cell Ca2+ overload has also
    been observed in patient erythrocytes.
  role: trigger
  biological_scale: MOLECULAR

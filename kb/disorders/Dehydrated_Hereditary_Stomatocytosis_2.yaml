      diagnosis in adult KCNN4-HX patients.
diagnosis:
- name: Reticulocyte Indices on Automated Hematology Analyzer
  description: >-
    Diagnosis is challenging because there is no specific clinical phenotype and
    osmotic gradient ektacytometry is typically normal or atypical in KCNN4-HX.
    Reticulocyte indices on an ADVIA 2120 analyzer (delta-MCV and delta-MCHC
    between reticulocytes and mature red cells) discriminate Gardos
    channelopathy from PIEZO1 xerocytosis with 100% sensitivity and specificity
    and prioritize patients for KCNN4 sequencing.
  diagnosis_term:
    preferred_term: reticulocyte index hematology test
    term:
      id: NCIT:C49286
      label: Hematology Test
  evidence:
  - reference: DOI:10.3389/fphys.2020.602109
    reference_title: "Rapid Gardos Hereditary Xerocytosis Diagnosis in 8 Families Using Reticulocyte Indices"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "its diagnosis is difficult given the absence of a specific clinical or biological phenotype"
    explanation: States why a dedicated diagnostic approach is needed.
  - reference: DOI:10.3389/fphys.2020.602109
    reference_title: "Rapid Gardos Hereditary Xerocytosis Diagnosis in 8 Families Using Reticulocyte Indices"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A threshold of 8.6 fL for ΔMCV and −5.5 g/L for ΔMCHC could discriminate between Gardos and Piezo1-HX with 100% sensitivity and specificity"
    explanation: >-
      Quantifies the reticulocyte-index thresholds that distinguish Gardos
      channelopathy from PIEZO1 xerocytosis at diagnosis.
- name: KCNN4 Molecular Genetic Testing
  description: >-
    Sequencing of KCNN4 coding exons and splice junctions definitively confirms
    Gardos channelopathy and is essential in unexplained dominant non-spherocytic
    hemolysis even when osmotic gradient ektacytometry is normal.
  diagnosis_term:
    preferred_term: KCNN4 molecular genetic analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:30655378
    reference_title: "Clinical and biological features in PIEZO1-hereditary xerocytosis and Gardos channelopathy: a retrospective series of 126 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In six families (12 patients), osmotic gradient ektacytometry did not lead to the diagnosis of HX, since the profiles were either atypical (n=1) or normal (n=5)"
    explanation: >-
      Demonstrates that osmotic gradient ektacytometry misses KCNN4-HX because
      profiles are normal or atypical.
  - reference: PMID:30655378
    reference_title: "Clinical and biological features in PIEZO1-hereditary xerocytosis and Gardos channelopathy: a retrospective series of 126 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, genetic testing should be performed to rule out this subset of HX in the case of undiagnosed hemolysis, even when ektacytometry is normal."
    explanation: >-
      Establishes KCNN4 genetic testing as mandatory for definitive diagnosis
      even when ektacytometry is normal.
treatments:
- name: Supportive care and iron monitoring
  description: >-
    Management is supportive: red-cell transfusion when needed (primarily in
    severe neonatal/infantile anemia), folate support, annual ferritin
    monitoring, and liver MRI iron quantification when ferritin rises above
    normal. Splenectomy is generally avoided in dehydrated hereditary
    stomatocytosis because hemolysis persists post-splenectomy and splenectomy
    aggravates thromboembolic risk in the broader DHS / PIEZO1 spectrum.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:30655378
    reference_title: "Clinical and biological features in PIEZO1-hereditary xerocytosis and Gardos channelopathy: a retrospective series of 126 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "iron overload and inefficient splenectomy"
    explanation: >-
      The cohort records that iron overload and an inefficient response to
      splenectomy are shared features, supporting iron monitoring and the
      splenectomy caution.
  - reference: PMID:30655378
    reference_title: "Clinical and biological features in PIEZO1-hereditary xerocytosis and Gardos channelopathy: a retrospective series of 126 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In terms of clinical management, these data highlight the requirement for an annual iron status evaluation and for measurement of liver iron content by magnetic resonance imaging when ferritin increases above normal values."
    explanation: >-
      Establishes annual iron status monitoring and liver MRI iron assessment as
      core supportive surveillance.
- name: Iron Chelation Therapy (Deferasirox / Deferiprone)
  description: >-
    Oral or parenteral iron chelation (deferasirox, deferiprone, or
    deferoxamine; or phlebotomy when hemoglobin permits) reduces hepatic iron
    overload in hereditary xerocytosis and Gardos channelopathy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

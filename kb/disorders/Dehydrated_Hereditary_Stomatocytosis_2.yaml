genetic:
- name: KCNN4 gain-of-function variants
  gene_term:
    preferred_term: KCNN4
    term:
      id: hgnc:6293
      label: KCNN4
  relationship_type: CAUSATIVE
  features: >-
    Recurrent and private missense variants in KCNN4 (e.g. R352H, S314P, V222L,
    H340N) cause the Gardos channelopathy. They are gain-of-function changes
    that increase the calcium sensitivity of the Gardos channel; the recurrent
    R352H allele is among the more severe.
  evidence:

      the hereditary xerocytosis / Gardos channelopathy cohort.
discussions:
- discussion_id: variable_dehydration
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does KCNN4 gain of function cause red-cell dehydration in all variants, or is
    the hydration endpoint variant-dependent with compensatory mechanisms and
    Ca2+ overload in some?
  rationale: >-
    The disorder is named for dehydration, and the discovery kindreds show
    primary erythrocyte dehydration, but the entry's own KCNN4 sources disagree:
    the recurrent R352H form shows compensatory effects that prevent cellular
    dehydration (with Ca2+ overload instead), and the V222L and H340N variants
    show no obvious dehydration. Whether dehydration is obligate, variant-specific
    or secondary is unresolved, which is why the central node is modelled as a
    cation leak / volume dysregulation rather than as dehydration.
  attaches_to:
  - pathophysiology#Red Cell Cation Leak and Volume Dysregulation
- discussion_id: iron_overload_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does iron overload develop in KCNN4 (type 2) dehydrated
    hereditary stomatocytosis, and is hepcidin inappropriately low as in the
    PIEZO1 form?
  rationale: >-
    Hyperferritinemia and iron overload are frequent in dehydrated hereditary
    stomatocytosis and are reported without regular transfusion. In the PIEZO1
    (type 1) form, gain-of-function PIEZO1 has been linked to suppression of
    hepatic hepcidin, but erythropoiesis in these disorders is effective rather
    than ineffective, so the erythroferrone route that drives iron loading in the
    thalassemias does not straightforwardly apply. For the KCNN4 (type 2) form
    specifically, no hepcidin or iron-handling mechanism has been established, so
    whether this entry belongs on the hepcidin-deficiency iron-overload pathway is
    unresolved and it is deliberately left unconformed.
  attaches_to:
  - phenotypes#Hyperferritinemia

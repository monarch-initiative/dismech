    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary xerocytosis (HX; MIM 194380) is an autosomal-dominant hemolytic anemia characterized by primary erythrocyte dehydration."
    explanation: >-
      A discovery paper establishing KCNN4 as a cause of hereditary xerocytosis,
      an autosomal dominant hemolytic anemia.
  - reference: PMID:33351129
    reference_title: "Gardos channelopathy: functional analysis of a novel KCNN4 variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the novel KCNN4 variant p.S314P is a gain-of-function mutation but is less severe than the previously reported p.R352H variant."
    explanation: >-
      Confirms the gain-of-function nature of a KCNN4 variant and the allelic
      severity gradient (S314P milder than the recurrent R352H).
  - reference: DOI:10.3389/fphys.2022.918620
    reference_title: "New KCNN4 Variants Associated With Anemia: Stomatocytosis Without Erythrocyte Dehydration"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no documented sign of anemia for the parents who also carried the mutation"
    explanation: >-
      Documents incomplete penetrance / variable expressivity: carrier parents of
      an affected proband had no documented anemia.
pathophysiology:
- name: KCNN4 Gardos Channel Gain of Function
  description: >-
    The trigger lesion. The Gardos channel is a calcium-activated,
    potassium-selective channel in the red-cell membrane that participates in
    cell-volume regulation. Gain-of-function KCNN4 variants increase the
    channel's calcium sensitivity, so it opens at lower intracellular calcium
    concentrations than the wild-type channel; red-cell Ca2+ overload has also
    been observed in patient erythrocytes.
  role: trigger
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte

- name: Erythrocyte Potassium Loss and Dehydration
  description: >-
    Sustained Gardos-channel potassium efflux is followed by osmotic loss of
    water, so the red cell dehydrates. The dehydration is the defining cellular
    abnormality of the xerocytosis phenotype.

animal_models:
- name: exoc7 mh111 null zebrafish
  species: Danio rerio
  genotype: exoc7 mh111/mh111 (1-bp frameshift deletion in exon 5)
  genes:
  - preferred_term: EXOC7
    term:
      id: hgnc:23214
      label: EXOC7
  category: Knockout
  publication: PMID:32103185
  description: >
    CRISPR/Cas9 1-bp deletion predicted to truncate the protein at about residue
    186. Homozygotes have small eyes, head edema and a smaller head at 5 days
    post fertilization and die shortly after.
  evidence:
  - reference: PMID:32103185
    reference_title: "Regulation of human cerebral cortical development by EXOC7 and EXOC8, components of the exocyst complex, and roles in neural progenitor cell proliferation and survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: We modeled exoc7 deficiency in zebrafish and found the absence of exoc7 causes microcephaly.
    explanation: The model's headline phenotype.
  modeled_mechanisms:
  - target: Depletion of Telencephalic Neural Progenitors
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Sox2-positive telencephalic progenitors are reduced by about half.
    limitations: >-
      A null allele, whereas the human alleles are hypomorphic; the fish die
      shortly after 5 days post fertilization, so later cortical development and
      seizures cannot be studied.
    readouts:
    - name: Sox2-positive telencephalic progenitor count
      target: Depletion of Telencephalic Neural Progenitors
      direction: DECREASED
      evidence:
      - reference: PMID:32103185
        reference_title: "Regulation of human cerebral cortical development by EXOC7 and EXOC8, components of the exocyst complex, and roles in neural progenitor cell proliferation and survival."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: we also found a 53% decrease in the number of Sox2-positive telencephalon progenitor cells
        explanation: The progenitor count measured in the model.
    evidence:
    - reference: PMID:32103185
      reference_title: "Regulation of human cerebral cortical development by EXOC7 and EXOC8, components of the exocyst complex, and roles in neural progenitor cell proliferation and survival."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: we also found a 53% decrease in the number of Sox2-positive telencephalon progenitor cells
      explanation: Supports the model as informative for progenitor loss.
  - target: Increased Apoptosis in the Developing Forebrain
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: TUNEL-positive cells are increased threefold in the telencephalon.
    limitations: >-
      Null allele versus hypomorphic human alleles; the identity of the dying
      cells was not established.
    readouts:
    - name: TUNEL-positive cells in telencephalon
      target: Increased Apoptosis in the Developing Forebrain
      direction: INCREASED
      evidence:
      - reference: PMID:32103185
        reference_title: "Regulation of human cerebral cortical development by EXOC7 and EXOC8, components of the exocyst complex, and roles in neural progenitor cell proliferation and survival."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: >-
          At 5 dpf, we found a threefold increase in the number of apoptotic
          cells (TUNEL stain) in the telencephalon of exoc7 null zebrafish
        explanation: The apoptosis measurement in the model.
    evidence:

name: Neurodevelopmental Disorder With Seizures And Brain Atrophy
creation_date: "2026-10-15T15:40:00Z"
category: Mendelian
description: >
  Neurodevelopmental disorder with seizures and brain atrophy (NEDSEBA) is an
  autosomal recessive disorder of cerebral cortical development caused by
  biallelic partial loss-of-function variants in EXOC7, which encodes the Exo70
  subunit of the octameric exocyst complex that tethers post-Golgi secretory
  vesicles to the plasma membrane. It was defined in 2020 in four families
  carrying four EXOC7 alleles (a canonical splice-acceptor variant, two in-frame
  deletions and a missense variant). All affected individuals have central
  nervous system disease with cerebral cortical atrophy, together with
  developmental delay and seizures; intellectual disability is reported in the
  mildest family. The severe end, seen with the splice-acceptor allele, adds
  congenital microcephaly with an extremely simplified gyral pattern,
  ventriculomegaly, reduced white matter, a very small cerebellum and brainstem,
  myoclonic seizures from birth, arthrogryposis multiplex and death within the
  first months of life. Severity tracks the predicted damage to the protein.

  The mechanism is only partly characterised. Exo70 anchors the exocyst to the
  plasma membrane through direct binding to phosphatidylinositol
  4,5-bisphosphate, and its N-terminal region, which contains the deleted Ser48
  residue, binds EXOC8. The splice-acceptor allele disrupts splicing and halves
  EXOC7 protein in an edited cell line. A zebrafish exoc7 null model shows
  microcephaly with increased apoptosis and loss of Sox2-positive neural
  progenitors in the telencephalon, without a detectable cytokinesis defect,
  which the discoverers take to mean that the human atrophy and microcephaly
  reflect loss of progenitors and postmitotic neurons. Which exocyst-dependent
  process fails in the developing brain is not known, and the entry records
  that step as an unknown intermediate. No disease-specific treatment exists.
synonyms:
- NEDSEBA
- EXOC7-related neurodevelopmental disorder

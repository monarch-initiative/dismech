        no patient allele was tested.
- name: Impaired Exocyst Plasma Membrane Targeting and Exocytosis
  biological_scale: CELLULAR
  description: >
    In mammalian cells the Exo70-PI(4,5)P2 interaction is needed for the
    exocyst to reach the plasma membrane and for post-Golgi vesicles to dock and
    fuse. In developing rat hippocampal neurons Exo70 is required for membrane
    addition at the axonal growth cone and for axon specification. Neither
    process has been measured in patient cells or in the zebrafish model.
  biological_processes:
  - preferred_term: exocytosis
    modifier: DECREASED
    term:
      id: GO:0006887
      label: exocytosis
  evidence:
  - reference: PMID:17761530
    reference_title: "Phosphatidylinositol 4,5-bisphosphate mediates the targeting of the exocyst to the plasma membrane for exocytosis in mammalian cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      we demonstrate that Exo70-PI(4,5)P(2) interaction is critical for the
      docking and fusion of post-Golgi secretory vesicles, but not for their
      transport to the PM.
    explanation: Exo70 lipid binding is required for the exocytic step.
  - reference: PMID:19846717
    reference_title: "The TC10-Exo70 complex is essential for membrane expansion and axonal specification in developing neurons."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-

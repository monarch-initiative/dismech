    explanation: Allelic severity series consistent with graded loss of function.
  - reference: PMID:17761530
    reference_title: "Phosphatidylinositol 4,5-bisphosphate mediates the targeting of the exocyst to the plasma membrane for exocytosis in mammalian cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      we report that the mammalian exocyst subunit Exo70 associates with the PM
      through its direct interaction with phosphatidylinositol 4,5-bisphosphate
      (PI(4,5)P(2)).
    explanation: >-
      Direct experimental support for the phosphatidylinositol-4,5-bisphosphate
      binding activity of mammalian Exo70, the molecular function bound on this
      node.
  downstream:
  - target: Impaired Exocyst Plasma Membrane Targeting and Exocytosis
    causal_link_type: DIRECT
    description: >
      Inferred from the function of wild-type Exo70: losing its PI(4,5)P2
      interaction leaves the exocyst off the plasma membrane. Exocytosis has not
      been measured in patient cells.
    evidence:

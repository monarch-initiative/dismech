      explanation: Supports the model as informative for forebrain apoptosis.
discussions:
- discussion_id: nedseba_exocyst_to_neuronal_loss_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which exocyst-dependent process fails in EXOC7-deficient cortical
    progenitors and neurons, and do the three untested alleles act through a
    different molecular function than the splice allele?
  attaches_to:
  - pathophysiology#Impaired Exocyst Plasma Membrane Targeting and Exocytosis
  - pathophysiology#Depletion of Telencephalic Neural Progenitors
  rationale: >
    The discoverers state that the mechanism linking exocyst dysfunction to
    microcephaly and atrophy is unknown. Exocytosis, radial glial polarity and
    primary cilium formation are all candidate exocyst-dependent processes, and
    the zebrafish showed some ciliopathy-like signs without others. Only the
    splice allele has functional data; Ser48del lies in the EXOC8-binding
    region, and Ala523Thr and the exon 10 deletion are untested.
notes: >-
  Lump/split: MONDO:0033658 (OMIM:619072) is the EXOC7 disorder only. The same
  2020 report describes one EXOC8 family with a similar phenotype; EXOC8 disease
  is a separate OMIM phenotype and is not included here. Death within the first
  months of life (family I) is recorded in the description rather than as a
  phenotype because HP:0001522 Death in infancy lies outside the PhenotypeTerm
  enum. No treatment beyond supportive care is described in the literature, so
  no treatments section is recorded.

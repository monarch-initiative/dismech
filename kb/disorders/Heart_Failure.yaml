computational_models:
- name: CircAdapt par-75 imaging-based left-ventricular digital twin
  description: >-
    A patient-specific closed-loop heart-and-circulation model calibrated to
    left-ventricular cavity volume, regional longitudinal strain, and strain-rate
    measurements. Sensitivity and identifiability analysis reduces the CircAdapt
    MultiPatch personalization problem to 75 reproducibly estimable parameters.
  model_type: DIGITAL_TWIN
  repository_url: https://github.com/CircAdapt/Koopsen2024ParameterSubsetReduction
  model_id: GitHub:CircAdapt/Koopsen2024ParameterSubsetReduction@dc4fc2b69cbbd5f51ff4976b9ded20dedd9b7a51
  model_software: MATLAB; CircAdapt C++ model solver; dynamic multi-swarm particle swarm optimization
  model_format: MATLAB scripts and CircAdapt P-struct MAT files
  publication: PMID:38741182
  modeled_mechanisms:
  - target: Myocardial Contractile Dysfunction
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Personalized activation delays and active and passive myocardial material
      properties reproduce regional strain and cavity-volume measurements and
      yield regional myocardial work distributions.
    limitations: >-
      Only seven participants had HFrEF with LBBB; the remaining six had prior
      myocardial infarction without heart failure. The inferred constitutive
      parameters are model-dependent, and activation delay was non-identifiable
      in hypocontractile segments.
    readouts:
    - name: Regional left-ventricular strain and cavity-volume fit
      target: Myocardial Contractile Dysfunction
      direction: ALTERED
      interpretation: >-
        A composite mean-squared error quantifies agreement between each twin and
        the patient's regional strain, strain-rate, and cavity-volume traces.
      evidence:
      - reference: PMID:38741182
        reference_title: "Parameter subset reduction for imaging-based digital twin generation of patients with left ventricular mechanical discoordination."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "This reduced subset produced patient-resembling DTs (  χ 2   < 2.2), while septal-to-lateral wall workload imbalance was higher for the LBBB-only DTs than for the MI-only DTs (p < 0.05)."
        explanation: Reports the fit threshold achieved by the identifiable 75-parameter subset and its disease-substrate readout.
    - name: Septal-to-lateral myocardial workload imbalance
      target: Myocardial Contractile Dysfunction
      direction: INCREASED
      interpretation: >-
        Positive work difference reflects inefficient lateral-wall loading
        relative to the septum in dyssynchronous LBBB-associated heart failure.
      evidence:
      - reference: PMID:38741182
        reference_title: "Parameter subset reduction for imaging-based digital twin generation of patients with left ventricular mechanical discoordination."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "Workload imbalance was significantly higher for the LBBB-only DTs than for the MI-only DTs (p < 0.05) but there was no significant difference between LBBB-only and LBBB-MI DTs."
        explanation: Supports the direction of the modeled workload-imbalance readout while preserving the negative combined-substrate comparison.
    evidence:
    - reference: PMID:38741182
      reference_title: "Parameter subset reduction for imaging-based digital twin generation of patients with left ventricular mechanical discoordination."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Furthermore, the model is able to simulate regional mechanics at the same spatial scale as current non-invasive strain imaging technologies and at low computational cost."
      explanation: Establishes that CircAdapt resolves the regional mechanics used to personalize the imaging-based twins at an appropriate scale.
  variables:
  - name: Cardiac output
    dataset_identifier: q0
    description: Global cardiac output estimated during digital-twin personalization.
    unit: L/min
  - name: Global left-ventricular activation duration
    dataset_identifier: dT
    description: Duration of mechanical activation across the left ventricle.
    unit: ms
  - name: Regional mechanical activation delay
    dataset_identifier: DT
    description: Segment-specific mechanical activation timing relative to the reference wall.
    unit: ms
  - name: Left-ventricular cavity volume
    dataset_identifier: VLV
    description: Time-varying cavity volume used as a patient-specific calibration target.
    unit: mL
  - name: Regional longitudinal strain
    dataset_identifier: strain
    description: Segmental deformation trace used to calibrate and assess the twin.
    unit: percent
  findings:
  - statement: Reducing the personalization problem from 270 to 75 parameters improved minimum parameter reproducibility from ICC 0.01 to 0.83 while retaining patient-resembling fits below a composite error of 2.2.
    evidence:
    - reference: PMID:38741182
      reference_title: "Parameter subset reduction for imaging-based digital twin generation of patients with left ventricular mechanical discoordination."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "A subset of 270 parameters remained after MSM which produced high-quality DTs of all patients (  χ 2   < 1.6), but minimum parameter reproducibility was poor (  ICC min    = 0.01). Iterative reduction yielded a reproducible (  ICC min    = 0.83) subset of 75 parameters, including cardiac output, global LV activation duration, regional mechanical activation delay, and regional LV myocardial constitutive properties."
      explanation: Reports the central identifiability result and the physiological content retained in the reduced parameter set.
  evidence:
  - reference: PMID:38741182
    reference_title: "Parameter subset reduction for imaging-based digital twin generation of patients with left ventricular mechanical discoordination."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "To this end, we included seven patients with heart failure with reduced ejection fraction (HFrEF) and LBBB"
    explanation: Establishes direct evaluation in the HFrEF population represented by this disorder entry.
  notes: >-
    Repository inspected at commit dc4fc2b69cbbd5f51ff4976b9ded20dedd9b7a51
    (2024-05-07). It contains the MATLAB sensitivity, Sobol, diaphony, and
    DMS-PSO scripts plus reference CircAdapt P-structs, but no license, automated
    tests, patient measurement files, or bundled CircAdapt solver. Execution was
    not attempted because neither MATLAB nor Octave is installed and the scripts
    require a separately placed CircAdapt C++ checkout and non-public patient data.
- name: CircAdapt virtual-pacing CRT response twin
  description: >-
    Forty-five echocardiography-personalized CircAdapt models of patients with
    dyssynchronous HFrEF. Each twin simulates biventricular pacing using the
    patient's atrioventricular delay and lead location, then relates acute changes
    in regional myocardial work to six-month reverse remodeling.
  model_type: DIGITAL_TWIN
  model_id: CircAdapt-CRT-45
  model_software: CircAdapt cardiovascular mechanics model
  model_format: Patient-specific simulation workflow curated from the publication
  publication: PMID:38288616
  modeled_mechanisms:
  - target: Ventricular Remodeling
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Virtual biventricular pacing alters septal-to-lateral work distribution;
      the simulated acute mechanical response is compared with the patient's
      subsequent reduction in left-ventricular end-systolic volume.
    limitations: >-
      The study is retrospective, includes only 45 CRT recipients with wide QRS
      and LVEF at or below 35%, and reports association rather than prospective
      treatment-selection benefit. The exact analysis code and patient inputs
      were not deposited with the paper.
    readouts:
    - name: Virtual pacing-induced septal-to-lateral work redistribution
      target: Ventricular Remodeling
      direction: DECREASED
      interpretation: >-
        A larger reduction in workload imbalance represents greater acute
        mechanical recoordination and was associated with more reverse remodeling.
      evidence:
      - reference: PMID:38288616
        reference_title: "Virtual pacing of a patient's digital twin to predict left ventricular reverse remodelling after cardiac resynchronization therapy."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "The DT's baseline MWLW-S,DT and virtual pacing-induced ΔMWLW-S,DT were both significantly associated with the real patient's reverse remodelling ΔLVESV (r = -0.60, P < 0.001 and r = 0.62, P < 0.001, respectively), while correlation between ΔdP/dtmax,DT and ΔLVESV was considerably weaker (r = -0.34, P = 0.02)."
        explanation: Quantifies the association between virtual work redistribution and observed six-month reverse remodeling, including the weaker hemodynamic comparator.
    evidence:
    - reference: PMID:38288616
      reference_title: "Virtual pacing of a patient's digital twin to predict left ventricular reverse remodelling after cardiac resynchronization therapy."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Biventricular pacing was then simulated using patient-specific atrioventricular delay and lead location."
      explanation: Establishes that the model performs a patient-specific pacing perturbation rather than only measuring baseline physiology.
  variables:
  - name: Septal-to-lateral myocardial work difference
    dataset_identifier: MWLW-S,DT
    description: Digital-twin-derived difference in myocardial work between the lateral wall and septum.
    unit: relative work
  - name: Maximum left-ventricular pressure-rise rate
    dataset_identifier: dP/dtmax,DT
    description: Simulated acute hemodynamic response to biventricular pacing.
    unit: mmHg/s
  - name: Left-ventricular end-systolic volume change
    dataset_identifier: ΔLVESV
    description: Six-month clinical reverse-remodeling outcome used to evaluate the virtual intervention.
    unit: percent change
  findings:
  - statement: Virtual pacing-induced work redistribution correlated with real six-month LV end-systolic-volume change at r = 0.62, whereas simulated pressure-rise response correlated more weakly at r = -0.34.
    evidence:
    - reference: PMID:38288616
      reference_title: "Virtual pacing of a patient's digital twin to predict left ventricular reverse remodelling after cardiac resynchronization therapy."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The DT's baseline MWLW-S,DT and virtual pacing-induced ΔMWLW-S,DT were both significantly associated with the real patient's reverse remodelling ΔLVESV (r = -0.60, P < 0.001 and r = 0.62, P < 0.001, respectively), while correlation between ΔdP/dtmax,DT and ΔLVESV was considerably weaker (r = -0.34, P = 0.02)."
      explanation: Preserves both the principal predictive association and the weaker alternative readout.
  evidence:
  - reference: PMID:38288616
    reference_title: "Virtual pacing of a patient's digital twin to predict left ventricular reverse remodelling after cardiac resynchronization therapy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A previously developed algorithm was used to generate 45 DTs by personalizing the CircAdapt model to each patient's baseline measurements."
    explanation: Establishes cohort size and patient-specific calibration of the CircAdapt models.
  notes: >-
    Curated directly from the paper because no exact code deposit for the
    45-patient virtual-pacing analysis was identified. The public
    Koopsen2024ParameterSubsetReduction repository above documents a closely
    related CircAdapt personalization framework from the same group, but it is
    not claimed as the implementation of this CRT study.

name: Heart Failure
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Heart failure is a clinical syndrome in which structural or functional cardiac
  impairment prevents the heart from delivering output sufficient to meet the
  body's metabolic demands at normal filling pressures. It is classified by left
  ventricular ejection fraction (reduced, mildly reduced, or preserved).
  Maladaptive neurohormonal activation drives progressive ventricular remodeling,
  producing dyspnea, fatigue, and fluid congestion.
category: Complex
parents:
- Cardiovascular Disease
disease_term:
  preferred_term: heart failure
  term:
    id: MONDO:0005252
    label: heart failure
has_subtypes:
- name: Heart Failure with Reduced Ejection Fraction (HFrEF)
  description: Left ventricular ejection fraction less than 40%, systolic dysfunction predominates.
- name: Heart Failure with Preserved Ejection Fraction (HFpEF)
  description: Left ventricular ejection fraction 50% or greater, diastolic dysfunction predominates.
- name: Heart Failure with Mildly Reduced Ejection Fraction (HFmrEF)
  description: Left ventricular ejection fraction 41-49%, intermediate phenotype.
pathophysiology:
- name: Myocardial Contractile Dysfunction
  description: >
    Reduced cardiac output due to impaired ventricular contraction (systolic dysfunction)
    or relaxation (diastolic dysfunction). The heart cannot meet metabolic demands.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cardiac Contraction
    term:
      id: GO:0060047
      label: heart contraction
  evidence:
  - reference: PMID:33432192
    reference_title: "Cellular and molecular pathobiology of heart failure with preserved ejection fraction."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Heart failure with preserved ejection fraction (HFpEF) affects half of all patients with heart failure worldwide, is increasing in prevalence, confers substantial morbidity and mortality, and has very few effective treatments."
    explanation: This review discusses the prevalence and severity of HFpEF, a form characterized by diastolic dysfunction rather than systolic dysfunction, demonstrating the importance of both contractile mechanisms in heart failure.
  - reference: PMID:40892534
    reference_title: "Left ventricular hypertrophy and myocardial fibrosis in heart failure with preserved ejection fraction: mechanisms and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myocardial fibrosis and its surrogate changes in LV structure and geometry lead to functional impairments such as increased diastolic stiffness and elevated filling pressures and are associated with reduced exercise tolerance and poor prognosis in patients with HFpEF."
    explanation: This demonstrates how structural changes lead to diastolic dysfunction and impaired cardiac output, supporting the mechanism of contractile dysfunction in heart failure.
- name: Neurohormonal Activation
  description: >
    Compensatory activation of RAAS and sympathetic nervous system initially
    maintains cardiac output but leads to maladaptive remodeling, sodium
    retention, and progressive dysfunction.
  biological_processes:
  - preferred_term: RAAS Activation
    term:
      id: GO:0002018
      label: renin-angiotensin regulation of aldosterone production
  evidence:
  - reference: PMID:37895150
    reference_title: "Neurohumoral Activation in Heart Failure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with heart failure (HF), the neuroendocrine systems of the sympathetic nervous system (SNS), the renin-angiotensin-aldosterone system (RAAS) and the arginine vasopressin (AVP) system, are activated to various degrees producing often-observed tachycardia and concomitant increased systemic vascular resistance."
    explanation: This directly confirms the activation of neurohormonal systems (RAAS and SNS) in heart failure patients, supporting the compensatory mechanism described.
  - reference: PMID:37895150
    reference_title: "Neurohumoral Activation in Heart Failure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Furthermore, sustained neurohormonal activation plays a key role in the progression of HF and may be responsible for the pathogenetic mechanisms leading to the perpetuation of the pathophysiology and worsening of the HF signs and symptoms."
    explanation: This supports the concept that while initially compensatory, sustained neurohormonal activation leads to maladaptive effects and disease progression.
  downstream:
  - target: Endocrine Convergence on Shared Profibrotic Effectors
    description: >-
      Angiotensin II and aldosterone are two of the inputs feeding the shared
      profibrotic effectors, which is why blockade upstream of the
      mineralocorticoid receptor does not silence the programme.
    evidence:
    - reference: PMID:42602176
      reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TGF-β-Smad signalling receives simultaneous inputs from angiotensin II, aldosterone, cortisol, leptin, FGF23, and thyroid deficiency."
      explanation: Names angiotensin II and aldosterone, the outputs of this node, among the inputs to the convergence node.
- name: Ventricular Remodeling
  description: >
    Structural changes including ventricular dilation, hypertrophy, and
    fibrosis that initially compensate but eventually worsen heart function.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: Cardiac Remodeling
    term:
      id: GO:0060420
      label: regulation of heart growth
  evidence:
  - reference: PMID:40892534
    reference_title: "Left ventricular hypertrophy and myocardial fibrosis in heart failure with preserved ejection fraction: mechanisms and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Comorbidities such as hypertension, obesity, or diabetes are present in many HFpEF patients and are hypothesized to contribute to adverse cardiac remodelling and myocardial fibrosis through a variety of haemodynamic and metabolic impairments, with nearly half of all HFpEF patients exhibiting left ventricular (LV) hypertrophy or concentric remodelling."
    explanation: This demonstrates the prevalence and mechanisms of ventricular remodeling including hypertrophy and fibrosis in heart failure patients, particularly in HFpEF.
  - reference: PMID:38636927
    reference_title: "Leukocyte Ig-like receptor B4 (Lilrb4a) alleviates cardiac dysfunction and isoproterenol-induced arrhythmogenic remodeling associated with cardiac fibrosis and inflammation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Heart failure is usually accompanied by activation of the sympathetic nerve, and excessive activation of the sympathetic nerve promotes cardiac remodeling and cardiac dysfunction. In the isoproterenol (ISO)-induced animal model, it is often accompanied by myocardial hypertrophy, fibrosis, and inflammation."
    explanation: This confirms that cardiac remodeling, including hypertrophy and fibrosis, is a key pathophysiological mechanism promoted by sympathetic activation in heart failure.
  - reference: PMID:38636927
    reference_title: "Leukocyte Ig-like receptor B4 (Lilrb4a) alleviates cardiac dysfunction and isoproterenol-induced arrhythmogenic remodeling associated with cardiac fibrosis and inflammation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Lilrb4a alleviates cardiac dysfunction and ISO-induced arrhythmogenic remodeling associated with cardiac fibrosis and inflammation through the regulation of NF-κB signaling and MAPK signaling activation."
    explanation: This identifies specific signaling pathways (NF-κB and MAPK) involved in cardiac remodeling and fibrosis, demonstrating the molecular mechanisms underlying structural changes.
- name: Fluid Retention
  description: >
    Impaired sodium excretion leads to volume overload, causing pulmonary
    and peripheral edema. Results from reduced renal perfusion and
    neurohormonal activation.
  evidence:
  - reference: PMID:36769308
    reference_title: "Chronic Kidney Disease as a Comorbidity in Heart Failure."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The pathophysiology between the heart and the kidneys is bidirectional. Common mechanisms leading to the dysfunction of these organs result in a vicious cycle of cardiorenal deterioration."
    explanation: This demonstrates the bidirectional relationship between heart and kidney dysfunction that leads to fluid retention in heart failure through cardiorenal mechanisms.
- name: Endocrine Convergence on Shared Profibrotic Effectors
  biological_scale: MOLECULAR
  description: >-
    In HFpEF, myocardial fibrosis is driven not by haemodynamic load alone but by
    several endocrine axes that converge on a small set of shared intracellular
    effectors. TGF-beta-Smad signalling receives simultaneous input from
    angiotensin II, aldosterone, cortisol, leptin, FGF23 and thyroid deficiency;
    NADPH oxidase-derived oxidative stress amplifies TGF-beta, cross-links matrix
    via lysyl oxidase, and drives ligand-independent mineralocorticoid receptor
    activation; and the NO-cGMP-PKG axis, normally a brake on fibroblast
    activation, is suppressed by virtually every endocrine disturbance in the
    syndrome. Because several axes feed each convergence point, and because
    self-reinforcing feedback circuits regenerate the signal, blocking any single
    shared effector is rapidly bypassed. This node is the reason the entry treats
    HFpEF fibrosis as multi-axis rather than as the downstream of one pathway.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: TGF-beta-Smad profibrotic signalling in cardiac fibroblasts
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  - preferred_term: NADPH oxidase-derived oxidative stress
    term:
      id: GO:0042554
      label: superoxide anion generation
    modifier: INCREASED
  - preferred_term: NO-cGMP-PKG braking of fibroblast activation
    term:
      id: GO:0038060
      label: nitric oxide-cGMP-mediated signaling
    modifier: DECREASED
  - preferred_term: mineralocorticoid receptor signalling
    term:
      id: GO:0031959
      label: nuclear receptor-mediated mineralocorticoid signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The axes converge on shared intracellular effectors, generating a programme exceeding any single axis. TGF-β-Smad signalling receives simultaneous inputs from angiotensin II, aldosterone, cortisol, leptin, FGF23, and thyroid deficiency."
    explanation: Establishes the convergence structure and names the axes feeding the TGF-beta-Smad effector.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NADPH oxidase-derived oxidative stress amplifies TGF-β, promotes ECM cross-linking via lysyl oxidase, and drives ligand-independent MR activation."
    explanation: Supports the oxidative-stress effector and its link to ligand-independent mineralocorticoid receptor activation.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The NO-cGMP-PKG axis, a critical brake on fibroblast activation, is suppressed by virtually every endocrine disturbance in HFpEF, while the mTOR-AMPK-FOXO imbalance translates metabolic excess into sustained profibrotic transcription"
    explanation: Supports suppression of the NO-cGMP-PKG brake as a shared endpoint of the endocrine disturbances.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Because several axes feed each convergence point and feedback loops regenerate the signal, inhibition of any single shared effector is rapidly bypassed."
    explanation: The therapeutic consequence of the convergence structure, and the basis for the single-pathway-resistance discussion.
  notes: >-
    Sourced from a narrative review, so `evidence_source: OTHER` throughout,
    matching this entry's existing convention for review citations. The review is
    explicit that the seven axes are not universally co-active. It presents them
    as a catalogue of potential dominant drivers, with one or a few predominating
    in any given patient, so this node asserts the convergence structure and not
    that every HFpEF patient runs every axis.

    Three effectors with mixed direction are deliberately kept on one node rather
    than split. Convergence is the claim being modelled — that several axes land
    on a small shared set, so blocking one is bypassed — and separating the
    effectors into three nodes would preserve the parts while losing exactly that.
    The mixed direction is the substance, not an inconsistency: two effectors are
    driven up and the third, a brake, is pushed down, which is why they act
    together.

    The mineralocorticoid receptor descriptor is bound to `GO:0031959` nuclear
    receptor-mediated mineralocorticoid signaling pathway. This corrects an
    earlier binding to the much broader `GO:0003707` nuclear steroid receptor
    activity, which was chosen on the false premise that no specific live term
    existed. `GO:0017082` mineralocorticoid receptor activity IS obsolete with no
    recorded replacement, but `GO:0031959` is live and is the exact structural
    analogue of the glucocorticoid term `GO:0042921`, both being children of
    `GO:0031958` nuclear receptor-mediated corticosteroid signaling pathway.

    The false premise came from a search-syntax error worth recording for the
    next curator. `runoak -i sqlite:obo:go search "mineralocorticoid"` returns
    only the exact-match CHEBI chemical, whereas `search "l~mineralocorticoid"`
    returns the whole `mineralocorticoid` label family, `GO:0031959` among them.
    A null result from the bare form is not evidence that no term exists. No
    count is given here deliberately: a count is a snapshot of one GO release and
    will rot, whereas the lesson will not.
  downstream:
  - target: Ventricular Remodeling
    description: >-
      Convergent profibrotic signalling drives cardiac fibroblast activation and
      interstitial extracellular matrix accumulation.
- name: Tissue Glucocorticoid Amplification by 11beta-HSD1
  biological_scale: TISSUE
  description: >-
    11beta-HSD1 regenerates active cortisol from cortisone inside adipose tissue,
    liver, vasculature and myocardium, so glucocorticoid exposure at the tissue
    level can be raised without any change in adrenal secretion. Chronic
    glucocorticoid excess promotes cardiac fibroblast proliferation, myofibroblast
    transdifferentiation and collagen synthesis through the glucocorticoid
    receptor, potentiates TGF-beta signalling, and suppresses nitric oxide
    availability. In non-epithelial tissue cortisol also binds the
    mineralocorticoid receptor with affinity comparable to aldosterone, so
    glucocorticoid excess can engage RAAS-like profibrotic programmes directly.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: intracellular regeneration of active cortisol from cortisone
    term:
      id: GO:0008211
      label: glucocorticoid metabolic process
    modifier: INCREASED
  molecular_functions:
  - preferred_term: 11beta-HSD1 reductase activity regenerating cortisol
    term:
      id: GO:0070524
      label: 11-beta-hydroxysteroid dehydrogenase (NADP+) activity
    modifier: INCREASED
  - preferred_term: glucocorticoid receptor-driven profibrotic transcription
    term:
      id: GO:0004883
      label: nuclear glucocorticoid receptor activity
    modifier: INCREASED
  evidence:
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tissue-specific amplification of glucocorticoid activity by 11β-HSD1, which regenerates active cortisol from cortisone intracellularly in adipose tissue, liver, vasculature, and myocardium, is an underappreciated driver of myocardial fibrosis."
    explanation: Establishes the tissue-level amplification mechanism as distinct from circulating glucocorticoid excess.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In non-epithelial tissues, cortisol can also bind MRs with an affinity comparable to that of aldosterone, enabling glucocorticoid excess to engage RAAS-like profibrotic programmes, particularly when oxidative stress alters MR signalling in the ageing or obese myocardium"
    explanation: Links this axis to mineralocorticoid receptor activation, which is why MR antagonism is relevant to a glucocorticoid-driven phenotype.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "However, human evidence remains largely confined to metabolic, dermatological, or steroid-exposure models rather than cardiac endpoints."
    explanation: >-
      Bounds the axis. The cardiac claim is not supported by human cardiac-endpoint
      data.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "This evidence should be read as biologically plausible, not clinically established, and must not be conflated with demonstrated antifibrotic efficacy in HFpEF"
    explanation: The review's own epistemic grading of this axis, recorded verbatim so the node is not read as a validated driver.
  notes: >-
    Deliberately curated with the review's own caveat attached rather than
    stripped. No 11beta-HSD1 inhibitor has been evaluated for myocardial fibrosis,
    cardiac MRI extracellular volume, or HFpEF outcomes; the two agents named
    (INCB13739, AZD4017) were tested on metabolic and dermatological endpoints.
    This node records a mechanism, not a therapeutic target that is ready to use.
  downstream:
  - target: Endocrine Convergence on Shared Profibrotic Effectors
    description: >-
      Tissue cortisol regeneration feeds the shared TGF-beta and mineralocorticoid
      receptor effectors.
- name: Postmenopausal Oestrogen Withdrawal
  biological_scale: ORGANISM
  description: >-
    HFpEF disproportionately affects postmenopausal women, and the review's
    account of why is structural rather than additive. Oestrogen normally
    restrains three profibrotic axes at once — it reduces ACE expression and AT1
    receptor density, enhances insulin sensitivity through GLUT4 and IRS-1
    signalling, and maintains an anti-inflammatory adipokine profile — so its
    withdrawal disinhibits all three in concert, producing the concentric,
    microvascular-predominant female phenotype.
  evidence:
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The female predominance of HFpEF reflects oestrogen loss, which amplifies multiple axes simultaneously rather than acting alone."
    explanation: States the multi-axis structure of the sex difference rather than a single-mechanism account.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oestrogen normally restrains RAAS by reducing ACE expression and AT1 density, enhances insulin sensitivity via GLUT4 and IRS-1 signalling, and maintains an anti-inflammatory adipokine profile; its withdrawal disinhibits these three profibrotic axes in concert, producing the concentric, microvascular-predominant female phenotype."
    explanation: Names the three systemic axes oestrogen restrains and the phenotype its withdrawal produces.
  notes: >-
    Split from the myocardial arm on review. This node carries only the
    ORGANISM-scale systemic disinhibition; the direct effect of lost oestrogen
    signalling on cardiac fibroblasts and endothelium is the separate CELLULAR
    node below, because the two sit at different scales and the single-value
    scale discipline treats that as a bundling signal.

    The failure of systemic hormone therapy to reduce cardiovascular risk (WHI,
    HERS) is NOT curated as refuting this mechanism, and no hormone-therapy
    treatment is added to this entry on the strength of it. The review attributes
    those failures to systemic ER-alpha-mediated thrombotic risk and late
    initiation rather than to the antifibrotic biology, but that is an
    interpretation of negative trials, not a demonstrated antifibrotic benefit.
    ER-beta-selective agonism remains preclinical.
  downstream:
  - target: Loss of Myocardial Oestrogen Receptor Signalling
    description: >-
      Falling circulating oestrogen removes receptor occupancy in the myocardium
      and coronary endothelium.
  - target: Endocrine Convergence on Shared Profibrotic Effectors
    description: >-
      Loss of systemic oestrogen restraint releases RAAS, insulin-resistance and
      adipokine inputs onto the shared profibrotic effectors simultaneously.
- name: Loss of Myocardial Oestrogen Receptor Signalling
  biological_scale: CELLULAR
  description: >-
    The direct cardiac arm of oestrogen withdrawal, distinct from the systemic
    disinhibition upstream. Oestrogen acting through ER-alpha and ER-beta
    suppresses cardiac fibroblast proliferation, inhibits TGF-beta/CTGF-mediated
    collagen transcription via ER-beta, upregulates endothelial nitric oxide
    synthase, and supports mitochondrial function. Menopause removes an
    antifibrotic and vasoprotective influence acting on the myocardium itself, at
    the same time as it releases the systemic axes.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: oestrogen receptor signalling in myocardium and coronary endothelium
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oestrogen, acting through ERα and ERβ, suppresses fibroblast proliferation, inhibits TGF-β/CTGF-mediated collagen transcription via ERβ, upregulates endothelial nitric oxide synthase (eNOS), and supports mitochondrial function"
    explanation: The direct myocardial and endothelial arm of oestrogen action, whose loss this node models.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Menopause removes these antifibrotic and vasoprotective influences, shifts systemic immunity towards a pro-inflammatory state by reducing suppression of nuclear factor kappa B (NF-κB), and reduces MMP-2/MMP-9 while upregulating TIMP-1, thereby tilting the ECM balance towards accumulation"
    explanation: States that menopause removes these influences and tilts the matrix balance towards accumulation.
  downstream:
  - target: Endocrine Convergence on Shared Profibrotic Effectors
    description: >-
      Loss of the ER-beta brake on TGF-beta/CTGF collagen transcription and of
      eNOS support feeds the shared effectors directly.
- name: Lipoprotein(a)-Driven Coronary Microvascular Dysfunction
  description: >
    Lipoprotein(a) [Lp(a)], a genetically determined cardiovascular risk factor,
    promotes coronary microvascular dysfunction through endothelial dysfunction,
    oxidative stress, inflammatory activation, and microvascular remodeling. Lp(a)
    carries oxidized phospholipids and exhibits antifibrinolytic properties that
    distinctly drive microvascular disease independent of epicardial coronary
    atherosclerosis, with particular relevance to HFpEF pathogenesis.
  cell_types:
  - preferred_term: Endothelial Cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: Vascular Smooth Muscle Cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: Oxidative Stress Response
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: Vascular Remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: ABNORMAL
  - preferred_term: Microthrombotic Events
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: PMID:41936813
    reference_title: "The role of lipoprotein(a) in coronary microvascular dysfunction: Mechanistic pathways, clinical evidence, and therapeutic perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lp(a) exhibits unique structural and biological properties, including the antifibrinolytic effects of apolipoprotein(a) and carriage of oxidized phospholipids, which promote endothelial dysfunction, oxidative stress, inflammatory activation, microvascular remodeling, and microthrombotic susceptibility-key processes implicated in CMD pathophysiology."
    explanation: This directly supports the mechanism of Lp(a)-driven endothelial dysfunction and oxidative stress in coronary microvascular disease.
  - reference: PMID:41936813
    reference_title: "The role of lipoprotein(a) in coronary microvascular dysfunction: Mechanistic pathways, clinical evidence, and therapeutic perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lp(a)], a genetically determined and causal cardiovascular risk factor, has been extensively studied in epicardial coronary atherosclerosis; however, its role in the coronary microcirculation has received comparatively limited attention."
    explanation: This establishes the distinction between Lp(a)'s well-characterized role in macrovascular atherosclerosis versus its emerging role in microvascular dysfunction specifically relevant to heart failure pathophysiology.
discussions:
- discussion_id: gap_lpa_microvascular_vs_macrovascular_mechanism
  prompt: >-
    What are the distinct mechanistic pathways by which lipoprotein(a) drives
    coronary microvascular dysfunction (CMD) as opposed to its well-characterized
    role in epicardial macrovascular atherosclerosis, and what are the biomarker
    and disease-modifying therapeutic implications for heart failure (especially HFpEF)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lipoprotein(a)-Driven Coronary Microvascular Dysfunction
  rationale: >-
    Lp(a)'s unique structural properties — antifibrinolytic apolipoprotein(a) and
    carriage of oxidized phospholipids — promote endothelial dysfunction, oxidative
    stress, inflammatory activation, microvascular remodeling, and microthrombotic
    susceptibility. These mechanisms are extensively characterized in epicardial
    coronary atherosclerosis (macrovascular disease), but Lp(a)'s contribution to the
    coronary microcirculation has received comparatively limited attention. Observational
    studies link elevated Lp(a) to impaired coronary flow reserve, yet the microvascular-specific
    pathways remain poorly delineated and no disease-modifying therapies targeting Lp(a) in CMD exist.
  notes: "Seeded from PMID:41936813 — The role of lipoprotein(a) in coronary microvascular dysfunction: Mechanistic pathways, clinical evidence, and therapeutic perspectives"
- discussion_id: gap_pyroptosis_hfpef_dapagliflozin_mechanism
  prompt: >-
    Is pyroptosis (via the AIM2/Caspase-1/GSDMD inflammasome pathway) a primary driver
    of HFpEF pathophysiology or a secondary inflammatory consequence of diastolic
    dysfunction and ventricular remodeling? What is the human clinical relevance of
    AIM2/Caspase-1/GSDMD pathway dysregulation in HFpEF, and does dapagliflozin's
    therapeutic benefit in HFpEF arise primarily through pyroptosis attenuation or
    through other complementary mechanisms?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Ventricular Remodeling
  rationale: >-
    Preclinical evidence (PMID:42246167) demonstrates that dapagliflozin alleviates
    HFpEF symptoms and decreases myocardial pyroptosis in a mouse model through
    AIM2/Caspase-1/GSDMD axis regulation. Pyroptosis is a pro-inflammatory form of
    programmed cell death that induces inflammatory amplification and contributes to
    cardiovascular disease. However, the mechanistic hierarchy remains unclear: whether
    AIM2-inflammasome activation is a primary pathophysiological driver of HFpEF (and
    thus should be added as a core pathophysiology node) versus a secondary consequence
    of the established mechanisms (myocardial contractile dysfunction, neurohormonal
    activation, ventricular remodeling, diastolic dysfunction). Furthermore, the human
    clinical significance of this pathway in HFpEF remains to be determined — the
    evidence is primarily from mouse cardiomyocyte and animal models, and whether
    AIM2/Caspase-1/GSDMD dysregulation is a targetable therapeutic mechanism in human
    HFpEF patients requires human tissue validation and clinical trial evidence.
  proposed_experiments:
  - experiment_id: exp_hfpef_aim2_pyroptosis_human_tissue
    name: AIM2/Caspase-1/GSDMD pathway activation and pyroptosis quantification in HFpEF patient cardiac tissue
    description: >-
      Quantify AIM2 protein, active Caspase-1, GSDMD proteolysis, and pyroptosis markers
      (e.g., released IL-1β, IL-18) in cardiac tissue from HFpEF patients (endomyocardial
      biopsies or cardiac explants undergoing transplantation) compared to age-matched
      controls without heart failure. Correlate AIM2/Caspase-1/GSDMD activation with
      biomarkers of diastolic dysfunction and ventricular stiffness to determine whether
      pathway dysregulation is primary or secondary.
  - experiment_id: exp_hfpef_ipsc_cardiomyocyte_pyroptosis_dapagliflozin
    name: Dose-response validation of dapagliflozin on AIM2/Caspase-1/GSDMD pyroptosis in human iPSC-derived cardiomyocytes under diastolic stress
    description: >-
      Establish human iPSC-derived cardiomyocyte models of diastolic dysfunction stress
      (diastolic calcium handling impairment, passive stiffness elevation) and measure
      baseline AIM2/Caspase-1/GSDMD activation and pyroptosis rates. Apply dapagliflozin
      in a dose-response manner and quantify pyroptosis attenuation, mechanism of action
      (direct AIM2 inhibition vs. indirect via restored calcium handling), and whether
      dapagliflozin's benefit is AIM2-dependent (using AIM2 knockdown or Caspase-1
      inhibitors like VX-765 to block downstream pyroptosis execution).
  - experiment_id: exp_hfpef_dapagliflozin_trial_pyroptosis_biomarker
    name: Biomarker-driven clinical trial subset analysis correlating pyroptosis pathway activation with dapagliflozin response in HFpEF
    description: >-
      In a prospective HFpEF cohort treated with dapagliflozin, measure baseline circulating
      pyroptosis biomarkers (cleaved Caspase-1, IL-1β, IL-18, or GSDMD-N terminal fragment)
      and cardiac imaging of diastolic dysfunction and myocardial stiffness. Stratify
      patients by baseline AIM2/Caspase-1 activation status and assess whether high-baseline
      pyroptosis correlates with enhanced dapagliflozin treatment response (echocardiographic
      improvement in ejection fraction, diastolic parameters, or symptom relief) and
      whether post-treatment pyroptosis attenuation predicts clinical benefit.
  notes: "Seeded from PMID:42246167 — Dapagliflozin alleviates heart failure with preserved ejection fraction potentially by regulating the AIM2/caspase-1/GSDMD pathway and attenuating pyroptosis"
- discussion_id: gap_hfpef_single_pathway_therapy_resistance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the incomplete response of HFpEF to single-pathway therapy reflect
    self-reinforcing endocrine feedback circuits that regenerate profibrotic
    signalling around any single blocked node, and can a phenotype-guided strategy
    that targets the dominant upstream driver in a given patient outperform
    uniform therapy?
  attaches_to:
  - pathophysiology#Endocrine Convergence on Shared Profibrotic Effectors
  - pathophysiology#Tissue Glucocorticoid Amplification by 11beta-HSD1
  - pathophysiology#Postmenopausal Oestrogen Withdrawal
  - pathophysiology#Ventricular Remodeling
  rationale: >-
    Three self-reinforcing circuits are proposed to explain why blocking one axis
    is insufficient. In the metabolic circuit, dysfunctional adipose tissue
    releases TNF-alpha and IL-6, which worsen insulin signalling and in turn
    worsen adipocyte dysfunction. In the RAAS-redox circuit, angiotensin II
    stimulates NADPH oxidase-derived superoxide, which inactivates nitric oxide
    and activates NF-kB, upregulating angiotensinogen and perpetuating RAAS
    activation. In the glucocorticoid circuit, 11beta-HSD1-mediated cortisol
    regeneration in visceral fat promotes further fat deposition, expanding the
    substrate for local glucocorticoid amplification independently of adrenal
    secretion. If this account is right, suppressing RAAS while leaving insulin
    resistance and adipose inflammation unaddressed permits continued
    ligand-independent MR activation and TGF-beta-driven fibrosis.

    Two things keep this a gap rather than a finding. The circuit model is a
    review-level synthesis, not a tested causal claim, and no trial has
    prospectively assigned HFpEF patients to therapy by dominant endocrine
    driver. The proposal is also partly circular as stated: the clinical success
    of SGLT2 inhibitors is offered as validation that multi-axis intervention
    beats single-pathway targeting, but those agents were not designed or trialled
    as multi-axis therapy, and their pleiotropy is an after-the-fact
    characterisation of why an effective drug works.
  proposed_experiments:
  - experiment_id: exp_hfpef_phenotype_guided_antifibrotic
    name: Phenotype-stratified antifibrotic assignment in HFpEF
    description: >-
      Phenotype an HFpEF cohort for dominant endocrine driver at baseline
      (visceral-adipose/glucocorticoid, insulin-resistant, RAAS-predominant,
      postmenopausal oestrogen-deficient), stratifying by renal function so that
      FGF23 and PTH are read within eGFR strata rather than as free-standing
      signals. Assign therapy matched versus unmatched to the dominant driver and
      follow cardiac MRI extracellular volume alongside clinical events. An
      adaptive platform design enriched for homogeneous endocrine subtypes is the
      efficient form of this.
    decision_criterion: >-
      Whether driver-matched assignment outperforms unmatched assignment on
      extracellular volume and events discriminates the phenotype-guided
      hypothesis from the simpler explanation that some HFpEF therapies are just
      broadly effective regardless of endocrine subtype.
    would_support:
    - >-
      A driver-matched arm showing greater reduction in extracellular volume and
      in worsening heart failure events than an unmatched arm receiving the same
      set of drugs, supporting the phenotype-guided model.
    would_refute:
    - >-
      Equivalent benefit regardless of whether therapy matched the dominant
      driver, indicating that the observed responses reflect general drug efficacy
      rather than the endocrine phenotype the model assigns them to.
  evidence:
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Three self-reinforcing feedback circuits explain HFpEF's resistance to single-pathway therapy."
    explanation: The claim under examination, stated by the review as an explanation rather than demonstrated.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Consequently, suppressing RAAS while leaving insulin resistance and adipose inflammation unaddressed permits continued ligand-independent MR activation and TGF-β-driven fibrosis, explaining the partial benefit of monotherapy."
    explanation: The specific prediction the circuit model makes about monotherapy, which is what a phenotype-stratified trial would test.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The durable strategy is to neutralise the dominant upstream driver in a given patient- less molecularly selective but interrupting the cascade before it diversifies- which, since the dominant driver differs between patients, necessarily implies a phenotype-guided approach."
    explanation: The proposed resolution, recorded as a proposal because no trial has assigned therapy by dominant driver.
  notes: >-
    The review's own therapy grading is preserved rather than flattened. SGLT2
    inhibitors, finerenone and GLP-1 receptor agonists are described as having the
    strongest evidence, while 11beta-HSD1 and D3 deiodinase inhibitors,
    ER-beta-selective agonists and anti-FGF23 strategies are described as
    mechanistically compelling but unvalidated. Nothing in the emerging group is
    curated as a treatment in this entry.
phenotypes:
- name: Dyspnea
  category: Respiratory
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Shortness of breath is the cardinal symptom of heart failure, arising from
    elevated left atrial and pulmonary venous pressures that drive fluid into the
    pulmonary interstitium and alveoli. It typically begins on exertion and, as
    decompensation advances, progresses to occur at rest.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
  evidence:
  - reference: PMID:40892534
    reference_title: "Left ventricular hypertrophy and myocardial fibrosis in heart failure with preserved ejection fraction: mechanisms and treatment."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Myocardial fibrosis and its surrogate changes in LV structure and geometry lead to functional impairments such as increased diastolic stiffness and elevated filling pressures and are associated with reduced exercise tolerance and poor prognosis in patients with HFpEF."
    explanation: Dyspnea results from elevated filling pressures and reduced exercise tolerance caused by diastolic dysfunction and myocardial fibrosis in heart failure.
- name: Peripheral Edema
  category: Cardiovascular
  frequency: VERY_FREQUENT
  description: >-
    Dependent swelling, most often of the lower extremities, results from systemic
    venous congestion and sodium and water retention driven by reduced cardiac
    output and neurohormonal (RAAS) activation. It is a hallmark sign of
    right-sided and biventricular heart failure.
  phenotype_term:
    preferred_term: Peripheral Edema
    term:
      id: HP:0012398
      label: Peripheral edema
  evidence:
  - reference: PMID:36769308
    reference_title: "Chronic Kidney Disease as a Comorbidity in Heart Failure."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The pathophysiology between the heart and the kidneys is bidirectional. Common mechanisms leading to the dysfunction of these organs result in a vicious cycle of cardiorenal deterioration."
    explanation: Peripheral edema results from the cardiorenal interaction where reduced cardiac output leads to renal dysfunction, sodium retention, and fluid accumulation in peripheral tissues.
- name: Fatigue
  category: Systemic
  frequency: VERY_FREQUENT
  description: >-
    Persistent tiredness and reduced energy reflect inadequate cardiac output and
    impaired oxygen delivery to skeletal muscle and other tissues. Skeletal muscle
    deconditioning, neurohormonal activation, and reduced perfusion contribute to
    this pervasive and disabling symptom of heart failure.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
- name: Orthopnea
  category: Respiratory
  frequency: FREQUENT
  notes: Dyspnea when lying flat
  description: >-
    Breathlessness in the recumbent position occurs because lying flat increases
    venous return and redistributes fluid from the lower body to the lungs, raising
    pulmonary capillary pressure. Patients characteristically relieve it by
    propping themselves up on pillows or sleeping upright.
  phenotype_term:
    preferred_term: Orthopnea
    term:
      id: HP:0012764
      label: Orthopnea
- name: Exercise Intolerance
  category: Cardiovascular
  frequency: VERY_FREQUENT
  description: >-
    A reduced capacity to sustain physical activity reflects the inability of the
    failing heart to augment cardiac output to meet the metabolic demands of
    exercise. It manifests as exertional dyspnea and fatigue and is a key
    determinant of functional class and quality of life in heart failure.
  phenotype_term:
    preferred_term: Exercise Intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:40892534
    reference_title: "Left ventricular hypertrophy and myocardial fibrosis in heart failure with preserved ejection fraction: mechanisms and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Myocardial fibrosis and its surrogate changes in LV structure and geometry lead to functional impairments such as increased diastolic stiffness and elevated filling pressures and are associated with reduced exercise tolerance and poor prognosis in patients with HFpEF."
    explanation: Exercise intolerance in heart failure is directly caused by increased diastolic stiffness and elevated filling pressures from myocardial fibrosis and structural remodeling.
- name: Cardiomegaly
  category: Cardiovascular
  frequency: FREQUENT
  description: >-
    Enlargement of the heart, often evident on chest radiography or
    echocardiography, results from chamber dilation and myocardial hypertrophy
    that develop as maladaptive remodeling in response to chronic pressure or
    volume overload. It is a structural marker of advanced ventricular remodeling
    in heart failure.
  phenotype_term:
    preferred_term: Cardiomegaly
    term:
      id: HP:0001640
      label: Cardiomegaly
  evidence:
  - reference: PMID:38636927
    reference_title: "Leukocyte Ig-like receptor B4 (Lilrb4a) alleviates cardiac dysfunction and isoproterenol-induced arrhythmogenic remodeling associated with cardiac fibrosis and inflammation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "In the isoproterenol (ISO)-induced animal model, it is often accompanied by myocardial hypertrophy, fibrosis, and inflammation."
    explanation: Cardiomegaly in heart failure results from myocardial hypertrophy, which is a structural adaptation to increased workload and sympathetic activation.

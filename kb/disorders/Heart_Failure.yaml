- accession: ega:EGAS50000000810
  title: Integrated Transcriptomic and Regulatory RNA Profiling Reflects Complex Pathophysiology and Uncovers a Conserved Gene Signature in End Stage Heart Failure RNA-Seq data
  description: Heart failure (HF) is a complex syndrome. Despite availability of multiple treatment options, the mortality remains high and the quality of life poor. Better understanding of the underlying pathophysiological processes can lead to development of novel therapies. Multiple comparative transcriptomics studies, which revealed gene level changes in the key pathophysiological pathways in failing hearts, point towards heterogeneity from interplay of disease stage, etiologies and ethnicity. Transcriptomic characterization of HF in patients from different ethnicities can potentially help in understanding the heterogeneity imparted by various factors and the core elements in heart failure.

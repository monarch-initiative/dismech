- accession: geo:GSE236191
  title: Specific biological processes associated with T2D-induced left ventricular dysfunction in patients with aortic stenosis pressure overload
  description: 'Background: Type 2 diabetes (T2D) is increasingly prevalent and increases the risk of developing heart failure. T2D is frequently associated with left ventricular (LV) pressure overload, such as encountered in hypertension and aortic stenosis (AS), and few studies suggested an aggravating effect of T2D. We aimed to explore if the deleterious impact of T2D on LV remodeling and function in patients with AS is associated with specific biological processes.'

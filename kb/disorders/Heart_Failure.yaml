    explanation: DAPA-HF randomised trial quantifies the reduction in worsening heart failure events and cardiovascular death with an SGLT2 inhibitor, supporting the claim that these agents reduce hospitalizations and mortality.
- name: Mineralocorticoid Receptor Antagonists
  description: >-
    Spironolactone or eplerenone for additional neurohormonal blockade, and the
    non-steroidal agent finerenone. The mechanistic case for adding an MRA on top
    of an ACE inhibitor or ARB is that those drugs leave the terminal
    mineralocorticoid receptor programme intact by several independent routes:
    chymase-dependent, ACE-independent angiotensin II generation circumvents ACE
    inhibition; aldosterone escape restores MR activation during chronic AT1
    blockade; and cortisol regenerated by 11beta-HSD1, together with reactive
    oxygen species, drives ligand-independent Rac1-mediated MR activation. MR
    antagonism is therefore not a redundant second hit on the same pathway but the
    only one of the three drug classes that reaches the terminal effector.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
    - preferred_term: eplerenone
      term:
        id: CHEBI:31547
        label: eplerenone
    - preferred_term: finerenone
      term:
        id: CHEBI:747008
        label: Finerenone
  target_mechanisms:
  - target: Endocrine Convergence on Shared Profibrotic Effectors
    treatment_effect: INHIBITS
    description: >-
      MR antagonism blocks the terminal mineralocorticoid receptor arm of the
      convergent profibrotic programme, including the ligand-independent
      activation driven by oxidative stress and by cortisol acting on the MR.
      INHIBITS rather than MODULATES because the target is a receptor the drug
      class antagonises directly, but note this blocks one arm of a multi-axis
      convergence, which is why the entry does not treat it as disease-modifying
      on its own.
    evidence:
    - reference: PMID:42602176
      reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Both drug classes thus leave terminal MR signalling intact, providing the rationale for direct MR antagonism."
      explanation: States the mechanistic rationale for MR antagonism as distinct from ACE inhibition and AT1 blockade.
  evidence:
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ARBs block AT1 directly, yet fibrosis persists because the terminal MR-driven program is engaged independently of AT1: aldosterone escape restores MR activation during chronic blockade"
    explanation: Documents aldosterone escape as one route by which AT1 blockade fails to reach the MR programme.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACE inhibition is circumvented by chymase-dependent, ACE-independent angiotensin II generation"
    explanation: The corresponding escape route for ACE inhibitors.
  - reference: PMID:42602176
    reference_title: "Endocrine regulation of cardiac fibrosis: implications for HFpEF."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In FINEARTS-HF, the non-steroidal MRA finerenone, with high MR selectivity and a favourable tissue-distribution, reduced the composite of worsening heart failure events and cardiovascular death in patients with mildly reduced or preserved ejection fraction, although hyperkalaemia remains an important safety consideration"
    explanation: Randomised outcome evidence for MR antagonism specifically in mildly reduced and preserved ejection fraction, with its safety caveat, extending a treatment previously evidenced here only for HFrEF.
  - reference: PMID:37254024
    reference_title: "Guideline-Directed Medical Therapy for the Treatment of Heart Failure with Reduced Ejection Fraction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Guideline-directed medical therapy (GDMT) is the cornerstone of pharmacological therapy for patients with heart failure with reduced ejection fraction (HFrEF) and consists of the four main drug classes: renin-angiotensin system inhibitors, evidence-based β-blockers, mineralocorticoid inhibitors and sodium glucose cotransporter 2 inhibitors."
    explanation: Mineralocorticoid receptor antagonists are one of the four foundational GDMT drug classes for HFrEF.

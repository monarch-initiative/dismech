- accession: ega:EGAS00001005398
  title: Prevalence of transthyretin amyloidosis in patients with heart failure and no left ventricular hypertrophy
  description: The study prospectively enrolled patients admitted for HF with LV ejection fraction (LVEF) ≥ 50% and LV wall thickness <12 mm. TTR cardiac amyloidosis was diagnosed according to accepted criteria, which include positive cardiac 99-Tc-DPD scintigraphy in the absence of monoclonal protein expansion in blood. In a cohort of patients with HFpEF without LVH, the prevalence of TTR cardiac amyloidosis was 5%. Transthyretin gene sequencing was performed in positive patients.

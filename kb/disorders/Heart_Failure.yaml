- accession: ega:EGAS50000000653
  title: Single-cell spatiotranscriptomic dissection of ex vivo human heart right atrial appendage and pericardial fluid in ischemic heart disease and heart failure
  description: We use cardiac and pericardial fluid biopsies collected during open-heart surgery in control, ischemic heart disease, heart failure, and myocardial infarction context. For each sample, single-nuclei RNA sequencing experiment is performed. We also perform spatial transcriptomics on the heart samples. We annotate the cells in major cell types, in addition to subtypes annotation of vascular and immune cells. The disease annotation enables us to reveal substantial differences in gene expression at the cell subpopulation levels. Our results demonstrate the importance of high-resolution cellular type/state mapping in the elucidation of human cardiovascular disease pathogenesis.
  organism:

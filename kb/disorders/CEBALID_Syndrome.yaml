notes: >-
  Name and scope. CEBALID is the OMIM name (618774); MN1 C-terminal truncation
  (MCTT) syndrome is the name used by GeneReviews and the founding cohort. MN1
  is also a meningioma and leukaemia fusion gene (MN1::ETV6); those somatic
  neoplasms are separate entities and nothing about them is curated here.

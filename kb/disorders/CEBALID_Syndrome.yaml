discussions:
- discussion_id: mn1_gain_of_function_versus_dominant_negative
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does truncated MN1 act through a new or increased activity, through
    interference with the wild-type protein, or both?
  attaches_to:
  - pathophysiology#MN1 C-terminal Truncating Variant
  rationale: >-
    The founding cohort ruled out haploinsufficiency on genetic grounds (allele
    position, decay escape, milder phenotype of decay-prone alleles) and left
    gain-of-function and dominant-negative action open. The gain-of-function
    label rests on overexpression of the truncated protein in HEK293T, HeLa and
    MG63 cells, which shows stability, condensation and anti-proliferative
    effects but was not designed to test whether the mutant protein disables
    the wild-type copy. Co-expression of wild-type and mutant protein at
    endogenous levels, or a knock-in allele, would separate the two.
  evidence:
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We speculate that these differences are due to the stable expression of
      C-terminally truncated MN1 protein in the latter, which may act in a
      dominant negative or gain-of-function manner.
    explanation: The founding cohort leaves both mechanisms open.
- discussion_id: mn1_null_models_versus_truncation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The available mouse models are Mn1 null alleles, which cause cleft palate
    and membranous bone defects, whereas the human syndrome is caused by a
    stable truncated protein and rarely includes cleft palate. Do the null
    models tell us anything about how truncated MN1 produces
    rhombencephalosynapsis and midface hypoplasia?
  attaches_to:
  - pathophysiology#Abnormal Craniofacial Skeletal Development
  - pathophysiology#Abnormal Brain Development
  rationale: >-
    Mn1 null mice show membranous cranial bone defects, cleft palate and, in a
    newer knockout, reduced hindbrain Cyp26 expression with altered retinoic
    acid patterning of rhombomere 1, from which the cerebellum develops. This
    is suggestive for rhombencephalosynapsis, but the direction of effect of a
    gain-of-function or dominant-negative truncated protein on the same pathway
    is unknown, and cleft palate, the hallmark of the null mouse, is rare in
    MCTT syndrome while it is the main finding in human decay-prone alleles. No
    knock-in of a C-terminal truncation has been reported.
  evidence:
  - reference: PMID:15870292
    reference_title: Targeted disruption of the Mn1 oncogene results in severe defects in development of membranous bones of the cranial skeleton.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mn1 null mice, however, were found to die at birth or shortly thereafter
      as the result of a cleft palate.
    explanation: The null mouse phenotype is dominated by cleft palate.
  - reference: PMID:18948418
    reference_title: The Mn1 transcription factor acts upstream of Tbx22 and preferentially regulates posterior palate growth in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that mice lacking the transcription factor Mn1 have
      defects in posterior but not anterior palatal growth.
    explanation: >-
      A second null-allele study places Mn1 upstream of Tbx22 in palate
      growth, again a loss-of-function model.
  - reference: PMID:40424121
    reference_title: Evolution of the essential gene MN1 during the macroevolutionary transition toward patterning the vertebrate hindbrain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, the cerebellum develops from the first rhombomere (63), a
      rhombomeric segment devoid of Cyp26a1 and Cyp26c1 expression in the Mn1
      mutant embryos.
    explanation: >-
      A null-allele mouse links Mn1 to hindbrain retinoic acid patterning in the
      segment that gives rise to the cerebellum.
- discussion_id: mn1_proliferation_effect_relevance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the anti-proliferative effect of truncated MN1 seen in osteosarcoma and
    kidney cell lines present in neural or cranial neural crest progenitors,
    and does it contribute to the malformations?
  attaches_to:
  - pathophysiology#Reduced Cell Proliferation
  rationale: >-
    The proliferation effect is measured only in transformed cell lines with
    overexpressed protein. It is left without a downstream edge because no
    study connects it to a developing tissue.

- name: Enhanced Nuclear Condensation of MN1
  description: >-
    MN1 contains a large intrinsically disordered region and forms nuclear
    aggregates that disperse with 1,6-hexanediol and re-form on its removal,
    behaving as liquid droplet-like condensates. Truncated MN1 forms larger and
    more intense nuclear aggregates than wild type. A patient-derived frameshift
    allele also showed nuclear aggregation in transfected cells. Whether altered
    phase separation contributes to disease is the authors' proposal.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Then, we quantified the number and size of the MN1 aggregates in the
      nuclei and observed that MN1 mutant proteins tended to form larger
      aggregates with higher intensity than wild-type MN1
    explanation: >-
      Quantified nuclear aggregation is greater for the truncated proteins.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results suggest that accumulated MN1 forms liquid droplet-like
      protein condensates.
    explanation: >-
      Hexanediol sensitivity indicates the aggregates are condensates rather
      than fixed inclusions.
  - reference: PMID:34975401
    reference_title: "MN1 Neurodevelopmental Disease-Atypical Phenotype Due to a Novel Frameshift Variant in the MN1 Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HEK239T cells transinfected with the de novo variant showed decreased
      proliferation, enhanced apoptotic rate, and MN1 nuclear aggregation.
    explanation: >-
      A second C-terminal allele reproduces nuclear aggregation in transfected
      cells.
  downstream:
  - target: Dysregulated MN1 Target Gene Transcription
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mn1_c_terminal_degradation_escape
- name: Dysregulated MN1 Target Gene Transcription
  description: >-
    MN1 is a transcriptional co-regulator that interacts with PBX1, PKNOX1 and
    ZBTB24. RNA-seq of a patient lymphoblastoid cell line showed many up- and
    downregulated genes compared with controls. Which target genes mediate the
    brain and craniofacial phenotype is not known.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: MN1-dependent transcriptional regulation
    modifier: DYSREGULATED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data indicate that MN1 participates in transcriptional regulation of
      target genes through interaction with the transcription factors PBX1,
      PKNOX1, and ZBTB24 and that mutant MN1 impairs the binding with ZBTB24
      and RING1, which is an E3 ubiquitin ligase.
    explanation: >-
      Places MN1 in transcription factor complexes whose composition the
      truncation alters.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When we compared this with RNA-Seq data from two unrelated normal
      controls and one individual affected with leukoencephalopathy with
      brain-stem and spinal-cord involvement and lactate elevation (MIM:
      611105) (as a disease control), we found many upregulated and
      downregulated genes
    explanation: >-
      Transcriptome change in a patient-derived cell line; one patient and a
      non-neural cell type, so the relevant targets remain unknown.
  downstream:
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mn1_c_terminal_degradation_escape
  - target: Abnormal Craniofacial Skeletal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mn1_c_terminal_degradation_escape

name: CEBALID Syndrome
creation_date: "2026-10-30T18:00:00Z"
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Craniofacial Malformation Syndrome
synonyms:
- MN1 C-terminal truncation syndrome
- MCTT syndrome
- MCTT
- Craniofacial defects, dysmorphic ears, brain abnormalities, language delay, and intellectual disability
disease_term:
  preferred_term: CEBALID syndrome
  term:
    id: MONDO:0032908
    label: CEBALID syndrome
description: >-
  CEBALID syndrome (craniofacial defects, dysmorphic ears, brain abnormalities,
  language delay and intellectual disability), also called MN1 C-terminal
  truncation (MCTT) syndrome, is an autosomal dominant neurodevelopmental and
  craniofacial disorder caused by heterozygous, usually de novo, truncating
  variants in the terminal exon or the extreme 3' end of exon 1 of MN1, a
  transcriptional co-regulator gene with only two exons. Because the premature
  stop codons lie in the last exon or within the last few dozen nucleotides of
  exon 1, the mutant transcripts escape nonsense-mediated mRNA decay and a
  C-terminally truncated MN1 protein is made. Affected individuals have
  intellectual disability with severe expressive language delay, hypotonia, a
  recognizable facial gestalt dominated by midface hypoplasia, ear anomalies
  with frequent hearing loss, skull shape anomalies with a risk of
  craniosynostosis, and a distinctive pattern on brain imaging: an atypical
  partial rhombencephalosynapsis, insular and perisylvian polymicrogyria, and a
  persistent primitive trigeminal artery. The two founding reports concluded
  that the disease is not due to MN1 haploinsufficiency but to a dominantly
  acting truncated protein; in vitro, the truncated protein is more stable,
  forms larger nuclear condensates, and inhibits cell proliferation more
  strongly than wild-type MN1, which the authors interpreted as a
  gain-of-function mechanism. How the truncated protein produces the brain and
  craniofacial malformations in vivo has not been shown. Management is
  supportive and multidisciplinary.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant. Nearly all reported cases arise from a de novo MN1
    variant; recurrence risk to sibs of a simplex proband is slightly above the
    population risk because of possible parental germline mosaicism.
  evidence:
  - reference: PMID:32790267
    reference_title: MN1 C-Terminal Truncation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MCTT syndrome is an autosomal dominant disorder typically caused by a de
      novo MN1 pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance and that the causal variant is
      typically de novo.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By trio-based WES, we identified three de novo truncating MN1 variants:
      c.3883C>T (p.Arg1295∗) in individual 1, c.3835C>T (p.Gln1279∗) in
      individual 2, and c.3846_3849del (p.Val1283Thrfs∗36) in individual 3
    explanation: >-
      Trio exome sequencing shows the heterozygous truncating variants arose de
      novo in each of three simplex probands.
  - reference: PMID:32790267
    reference_title: MN1 C-Terminal Truncation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      if the MN1 pathogenic variant found in the proband cannot be detected in
      the leukocyte DNA of either parent, the recurrence risk to sibs is
      estimated to be slightly greater than that of the general population
      because of the possibility of parental somatic/germline mosaicism.
    explanation: >-
      GeneReviews gives the sib recurrence risk after a de novo variant.
genetic:
- name: MN1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: MN1
    term:
      id: hgnc:7180
      label: MN1
  notes: >-
    All variants in the MCTT series are nonsense or frameshift variants that
    create a premature stop codon in exon 2 or in the final 37 nucleotides of
    exon 1, so that the transcript escapes nonsense-mediated decay. p.Arg1295*
    is recurrent. Truncating variants earlier in exon 1, which are expected to
    undergo nonsense-mediated decay, and whole-gene deletions have been reported
    with a milder and less specific phenotype (cleft palate, conductive hearing
    loss, speech delay without the MCTT facial gestalt or brain malformations);
    ClinGen scored some of these in its CEBALID curation while noting the
    milder presentation. They are recorded here as an allelic contrast rather
    than as part of the core entity.
  variants:
  - name: MN1 p.Arg1295*
    description: >-
      Recurrent de novo nonsense variant (c.3883C>T) in the terminal exon,
      observed in 8 of 21 probands in the largest series. Shown to escape
      nonsense-mediated decay in a patient lymphoblastoid cell line.
    evidence:
    - reference: PMID:31834374
      reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All mutations, including the recurrent variant p.Arg1295* observed in
        8/21 probands, fall in the terminal exon or the extreme 3' region of
        exon 1, and are therefore predicted to result in escape from
        nonsense-mediated mRNA decay.
      explanation: >-
        Establishes p.Arg1295* as the recurrent allele and the positional
        clustering of all MCTT variants.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_77c20c19-bdbc-45ff-809a-7a0d6965c0c4-2025-04-02T160000.000Z
    evidence:
    - reference: CGGV:assertion_77c20c19-bdbc-45ff-809a-7a0d6965c0c4-2025-04-02T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MN1 | HGNC:7180 | CEBALID syndrome | MONDO:0032908 | AD | Definitive"
      explanation: >-
        ClinGen Syndromic Disorders GCEP classifies the MN1 and CEBALID
        syndrome relationship as Definitive, autosomal dominant.
  evidence:
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a cluster of de novo truncating mutations in MN1 in a
      cohort of 23 individuals with strikingly similar dysmorphic facial
      features, especially midface hypoplasia, and intellectual disability with
      severe expressive language delay.
    explanation: >-
      The founding cohort links de novo MN1 truncating variants to the
      syndrome.
  - reference: PMID:32790267
    reference_title: MN1 C-Terminal Truncation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis is established in a proband with suggestive findings and a
      heterozygous pathogenic variant in MN1 identified by molecular genetic
      testing.
    explanation: >-
      GeneReviews names MN1 as the only gene in which pathogenic variants
      establish the diagnosis.
  - reference: PMID:33351070
    reference_title: "MN1 gene loss-of-function mutation causes cleft palate in a pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two patients showed similar clinical phenotypes as cleft palate and
      conductive hearing loss. No severe clinical phenotypes in CEBALID
      syndrome were observed including developmental delay, craniofacial
      features or characteristic brain imaging
    explanation: >-
      An exon 1 frameshift expected to undergo nonsense-mediated decay
      segregated with cleft palate and conductive hearing loss but not with the
      CEBALID phenotype, the allelic contrast recorded in the notes.
pathophysiology:
- name: MN1 C-terminal Truncating Variant
  description: >-
    A heterozygous, usually de novo, nonsense or frameshift variant creates a
    premature stop codon in the terminal exon of MN1 or in the extreme 3' region
    of exon 1. The founding cohort concluded the disease is caused by a
    dominantly acting truncated protein and not by haploinsufficiency; a second
    group termed the variants gain-of-function on the basis of in vitro assays.
    A dominant-negative contribution was raised by the first group and has not
    been excluded.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: MN1
      term:
        id: hgnc:7180
        label: MN1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      The gain-of-function category is the one the functional study assigned;
      it rests on overexpression assays in cultured cells, not on an in vivo
      model of the truncated allele.
  genes:
  - preferred_term: MN1
    term:
      id: hgnc:7180
      label: MN1
  molecular_functions:
  - preferred_term: MN1 transcriptional coactivator activity, retained by the truncated protein
    modifier: ABNORMAL
    term:
      id: GO:0003713
      label: transcription coactivator activity
  evidence:
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MN1 encodes a transcriptional co-regulator without homology to other
      proteins, previously implicated in acute myeloid leukaemia and
      development of the palate.
    explanation: >-
      Establishes the molecular function of the protein the variant truncates.
  - reference: PMID:12569362
    reference_title: The MN1 oncoprotein synergizes with coactivators RAC3 and p300 in RAR-RXR-mediated transcription.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, our results indicate that MN1 is a transcription
      coactivator rather than a sequence-specific transcription factor, and
      that it may stimulate RAR/RXR-mediated transcription through interaction
      with p160 and p300.
    explanation: >-
      Reporter assays define wild-type MN1 as a transcription coactivator, the
      activity the truncated protein retains.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The wild-type MN1 showed substantial transactivation, as previously
      reported,1 and all three mutants showed transactivation activity
    explanation: >-
      The truncated proteins keep transactivation activity, so the variant
      alters rather than abolishes co-regulator function; this is why the
      modifier is ABNORMAL rather than LOSS_OF_FUNCTION.
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that the condition described here, MN1 C-terminal truncation
      (MCTT) syndrome, is not due to MN1 haploinsufficiency but rather is the
      result of dominantly acting C-terminally truncated MN1 protein.
    explanation: >-
      The founding cohort's conclusion that the lesion acts dominantly rather
      than through loss of one copy.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      An in vitro study revealed that the deletion of the C-terminal region led
      to increased protein stability, an inhibitory effect on cell
      proliferation, and enhanced MN1 aggregation in nuclei compared to what
      occurred in the wild type, suggesting that a gain-of-function mechanism
      is involved in this disease.
    explanation: >-
      The gain-of-function category is inferred from cell-based assays of the
      truncated protein, which is why the item is marked indirect.
  downstream:
  - target: Escape of Truncated MN1 Transcript from Nonsense-Mediated Decay
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31839203
      reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Because MN1 consists of two coding exons, all three variants are
        thought to escape NMD and produce truncated proteins.
      explanation: >-
        The position of the premature stop codon in the last coding exon is
        what lets the transcript escape decay.
- name: Escape of Truncated MN1 Transcript from Nonsense-Mediated Decay
  description: >-
    The mutant transcript is not degraded by nonsense-mediated decay and is
    expressed at levels similar to the wild-type allele, so a C-terminally
    truncated MN1 protein is produced. Shown in fibroblasts from three patients
    and in a patient lymphoblastoid cell line.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cDNA sequencing, real-time PCR and/or RNA-Seq demonstrated expression of
      the mutant transcript at levels similar to that of wild-type in cultured
      fibroblasts from Individual 2
    explanation: >-
      Patient fibroblasts express the mutant transcript at wild-type levels,
      showing escape from decay.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a lymphoblastoid cell line established from individual 1, we
      confirmed that the variants did escape NMD
    explanation: >-
      Independent confirmation of decay escape in a patient-derived cell line.
  downstream:
  - target: Loss of RING1 and ZBTB24 Binding by Truncated MN1
    causal_link_type: DIRECT
    hypothesis_groups:
    - mn1_c_terminal_degradation_escape
- name: Loss of RING1 and ZBTB24 Binding by Truncated MN1
  description: >-
    Wild-type MN1 binds the E3 ubiquitin ligase RING1 and the transcription
    factor ZBTB24 as well as the PBX1 and PKNOX1 transcription factors. The
    C-terminally truncated protein still binds PBX1 but shows impaired binding
    to ZBTB24 and no binding to RING1 in co-immunoprecipitation from cultured
    cells.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant MN1 displayed impaired interaction with ZBTB24 and no binding to
      RING1.
    explanation: >-
      Direct interaction data for the truncated protein in cultured cells.
  downstream:
  - target: Impaired Proteasomal Degradation of Truncated MN1
    causal_link_type: DIRECT
    hypothesis_groups:
    - mn1_c_terminal_degradation_escape
    evidence:
    - reference: PMID:31839203
      reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Thus, MN1 degradation via ubiquitination by RING1 might be abrogated in
        the mutant MN1 lacking the C-terminal ordered region, and this
        abrogation might lead to mutant MN1 enrichment and dysregulation of
        MN1-related transcription
      explanation: >-
        The authors propose, without testing RING1-dependent ubiquitination
        directly, that loss of RING1 binding is why the truncated protein
        escapes degradation.
- name: Impaired Proteasomal Degradation of Truncated MN1
  description: >-
    Wild-type MN1 is rapidly turned over by the ubiquitin-proteasome pathway
    after cycloheximide treatment, and this turnover is blocked by MG132.
    Proteins lacking the C-terminus are more stable than wild type, so the
    truncated protein accumulates.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: proteasomal degradation of MN1
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that the wild-type MN1 was rapidly reduced after CHX treatment,
      and the reduction of its protein level was abolished by MG132, a
      proteasome inhibitor,23 suggesting that MN1 protein is degraded through
      the ubiquitin–proteasome pathway
    explanation: >-
      Establishes proteasomal turnover of wild-type MN1.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed that the variant c.3883C>T (p.Arg1295∗) escaped from NMD
      (Figure S1) and that proteins lacking the C terminus are more stable than
      the wild type
    explanation: >-
      The truncated protein is more stable than wild type.
  downstream:
  - target: Enhanced Nuclear Condensation of MN1
    causal_link_type: DIRECT
    hypothesis_groups:
    - mn1_c_terminal_degradation_escape
    evidence:
    - reference: PMID:31839203
      reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results suggest that the C-terminal region of MN1 is required for
        degradation through the ubiquitin-proteasome pathway, and its variants
        interfere with degradation of mutant MN1; this interference leads to
        increased aggregation of mutant MN1.
      explanation: >-
        The authors link the degradation defect to the increased nuclear
        aggregation of the mutant protein.
  - target: Dysregulated MN1 Target Gene Transcription
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

mechanistic_hypotheses:
- hypothesis_group_id: mn1_c_terminal_degradation_escape
  hypothesis_label: Truncated MN1 escapes proteasomal turnover and accumulates
  status: EMERGING
  description: >-
    The C-terminal region of MN1 is needed for its rapid proteasomal
    turnover, possibly via RING1. Truncated MN1 escapes degradation,
    accumulates, forms enlarged nuclear condensates and dysregulates MN1 target
    genes. Every step is supported only by overexpression or patient
    lymphoblastoid cell data from one study, and the link from accumulated
    protein to the developmental malformations is unproven.
  evidence:
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the basis of our findings, we propose the model that C-terminal
      deletion interferes with MN1's interaction molecules related to the
      ubiquitin-mediated proteasome pathway, including RING1, and increases the
      amount of the mutant protein; this increase leads to the dysregulation of
      MN1 target genes by inhibiting rapid MN1 protein turnover.
    explanation: >-
      The authors state the model explicitly as a proposal.

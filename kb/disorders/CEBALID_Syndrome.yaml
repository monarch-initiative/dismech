- name: Abnormal Craniofacial Skeletal Development
  description: >-
    Midface hypoplasia, skull shape anomalies with occasional craniosynostosis,
    abnormal posterior clinoid processes and ear anomalies point to disturbed
    development of the craniofacial skeleton. In mice, Mn1 is required for
    intramembranous ossification of the cranial vault and for palate closure,
    but that evidence comes from null alleles rather than from the truncated
    protein that causes this syndrome.
  biological_scale: TISSUE

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cell proliferation was more strongly inhibited in cells transfected with
      the mutant protein than it was in wild-type cells
    explanation: >-
      Direct comparison of proliferation with mutant versus wild-type MN1.
- name: Abnormal Brain Development
  description: >-
    Brain malformations specific to this syndrome include an atypical, focal
    form of rhombencephalosynapsis with loss of vermis morphology and
    cerebellar folia crossing the midline, polymicrogyria of the insula
    extending into the perisylvian region, hypoplastic olfactory bulbs, and a
    persistent primitive trigeminal artery. MN1 is highly expressed in fetal
    brain. The cellular steps linking truncated MN1 to these malformations
    have not been studied.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: hindbrain development
    modifier: ABNORMAL
    term:
      id: GO:0030902
      label: hindbrain development
  - preferred_term: cerebellum development
    modifier: ABNORMAL
    term:
      id: GO:0021549
      label: cerebellum development
  evidence:
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data show that MN1 plays a critical role in human craniofacial and
      brain development, and opens the door to understanding the biological
      mechanisms underlying rhombencephalosynapsis.
    explanation: >-
      The cohort study concludes that MN1 is required for human brain
      development, while leaving the mechanism open.
  - reference: PMID:31839203
    reference_title: Gain-of-Function MN1 Truncation Variants Cause a Recognizable Syndrome with Craniofacial and Brain Abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our analysis, MN1 demonstrated high expression in fetal and adult
      skeletal muscle and even higher expression in fetal brain
    explanation: >-
      MN1 expression in fetal brain is consistent with a developmental role
      there.
  downstream:

diagnosis:
- name: Molecular genetic testing for an MN1 truncating variant
  diagnosis_term:
    preferred_term: Exome or targeted sequencing of MN1
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    No consensus clinical criteria exist. Diagnosis rests on suggestive clinical
    and brain imaging findings plus a heterozygous truncating MN1 variant
    located in exon 2 or the extreme 3' end of exon 1. Variant position matters:
    truncating variants earlier in exon 1 that undergo nonsense-mediated decay
    are associated with a different, milder phenotype.
  evidence:
  - reference: PMID:32790267
    reference_title: MN1 C-Terminal Truncation Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No consensus clinical diagnostic criteria for MCTT syndrome have been
      published. The diagnosis is established in a proband with suggestive
      findings and a heterozygous pathogenic variant in MN1 identified by
      molecular genetic testing.
    explanation: GeneReviews states how the diagnosis is established.
  - reference: PMID:34708882
    reference_title: "Novel truncating variant of MN1 penultimate exon identified in a Chinese patient with newly recognized MN1 C-terminal truncation syndrome: Case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, a systematic review of previously reported MN1 variants
      including C-terminal truncating variants and N-terminal truncating
      variants shows that different location of MN1 truncating variants causes
      two distinct clinical subtypes.
    explanation: Variant position separates two clinical presentations.
- name: Brain MRI
  diagnosis_term:
    preferred_term: Brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Shows the distinctive combination of atypical partial rhombencephalosynapsis,
    insular or perisylvian polymicrogyria, and often a persistent trigeminal
    artery, which together suggest the diagnosis.
  evidence:
  - reference: PMID:31834374
    reference_title: MN1 C-terminal truncation syndrome is a novel neurodevelopmental and craniofacial disorder with partial rhombencephalosynapsis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other frequent features included perisylvian polymicrogyria, abnormal
      posterior clinoid processes and persistent trigeminal artery.
    explanation: Lists the imaging findings that accompany rhombencephalosynapsis.

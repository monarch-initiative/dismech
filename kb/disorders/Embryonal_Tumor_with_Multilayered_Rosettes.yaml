- name: Bulky Intracranial Mass
  description: A rapidly expanding intracranial mass. Its consequences are those of any space-occupying
    lesion in a small child - raised pressure, and deficits that depend on where it sits - rather
    than anything specific to the molecular lesion.
  biological_scale: TISSUE
  downstream:

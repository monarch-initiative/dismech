      Rosettes (ETMRs).
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Gross total resection was achieved in 43% of patients, and 48% received adjuvant chemoradiotherapy.Histopathologic
      examination consistently revealed ependymoblastic rosettes (true multilayered rosettes) and
      high mitotic activity.
    explanation: How often it was achieved in the cached series, alongside the adjuvant rate.

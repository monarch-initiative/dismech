    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Factors associated with inferior survival included incomplete surgical resection, absence
      of adjuvant therapy, and presence of necrosis and high mitotic index.
    explanation: Incomplete resection among the factors associated with inferior survival, which is
      why the extent matters rather than the operation alone.
- name: Adjuvant chemoradiotherapy
  description: Chemotherapy with radiotherapy after surgery. About half of the 35-patient Cairo series
    received it and its absence was associated with inferior survival there; in the P-HIT cohort's
    multivariable analysis irradiation was not selected as a positive prognostic criterion for overall
    survival. Both results are recorded rather than reconciled.

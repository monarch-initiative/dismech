name: Embryonal Tumor with Multilayered Rosettes
creation_date: '2026-11-11T15:12:00Z'
description: 'A rare, highly aggressive embryonal neoplasm of the central nervous system, WHO CNS
  grade 4, occurring almost exclusively in children under four. Its defining histology is the multilayered
  rosette - a pseudostratified ring of primitive neuroepithelium around an empty lumen. The entity
  is a molecular unification of three previously separate histological diagnoses, and the thing that
  unified them is a focal amplification at 19q13.42: the C19MC microRNA cluster, fused to TTYH1 and
  thereby placed under a promoter active in neural progenitors. A minority of tumours reach the same
  end through biallelic DICER1 inactivation or MIR17HG amplification instead, and all three lesions
  converge on microRNA-pathway dysregulation.'
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Embryonal Tumor
- Molecularly Defined Tumor
parents:
- central nervous system neoplasm
synonyms:
- ETMR
- Embryonal tumor with multilayered rosettes, C19MC-altered
- Embryonal tumor with abundant neuropil and true rosettes
- Ependymoblastoma
- Medulloepithelioma
pathophysiology:
- name: C19MC Amplification and TTYH1 Fusion
  description: 'A focal structural rearrangement amplifies the C19MC microRNA cluster at 19q13.42
    and fuses it to TTYH1. The effect is positional: a primate-specific cluster normally restricted
    to placenta and embryonic stem cells is placed under a promoter that is active in neural progenitors,
    in a lineage that otherwise silences it entirely.'
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: apical radial glial progenitor of the ventricular zone
    term:
      id: CL:0000681
      label: radial glial cell
  genes:
  - preferred_term: TTYH1
    term:
      id: hgnc:13476
      label: TTYH1
  downstream:
  - target: Ectopic C19MC microRNA Expression
    description: The fusion is what drives the cluster's expression.
    evidence:
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: We performed integrated genetic and epigenetic analyses of 12 ETMR samples and identified,
        in all cases, C19MC fusions to TTYH1 driving expression of the microRNAs.
      explanation: States the fusion and that it drives expression of the microRNAs, in every one
        of the twelve samples examined.
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed integrated genetic and epigenetic analyses of 12 ETMR samples and identified,
      in all cases, C19MC fusions to TTYH1 driving expression of the microRNAs.
    explanation: The fusion itself, found in all twelve cases.
  - reference: PMID:20407781
    reference_title: Focal genomic amplification at 19q13.42 comprises a powerful diagnostic marker
      for embryonal tumors with ependymoblastic rosettes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Strikingly, FISH analysis revealed 19q13.42 amplifications in 37/40 samples (93%).
    explanation: The amplification's frequency across a larger morphologically defined series, which
      is what made it the entity-defining lesion.
  notes: 'The cell of origin is bound to radial glial cell, the closest Cell Ontology term to the
    apical ventricular-zone progenitor the single-cell literature places at the apex of this tumour''s
    hierarchy. CL has no apical-radial-glia term, so the specificity is carried in the preferred term.
    No molecular function is bound on this node, and it is grandfathered in tests/gene_activity_grounding_baseline.txt
    for that reason. TTYH1 is here as the supplier of a promoter, not as a protein: the node''s claim
    is about a genomic rearrangement moving a microRNA cluster into a new regulatory context, and
    TTYH1''s own activity as a tweety-family channel plays no part in it. Binding that activity would
    assert a mechanism the entry does not claim and no cited source supports.'
- name: Ectopic C19MC microRNA Expression
  description: High-level expression of the C19MC microRNAs in a cell lineage that normally silences
    them. Everything downstream follows from these microRNAs being present where they should not be,
    rather than from any change in what they do.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: miRNA-mediated silencing by ectopic C19MC microRNAs
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
    modifier: INCREASED
  downstream:
  - target: Embryonic DNMT3B Isoform Overexpression
    description: The microRNAs lift the repression that normally holds DNMT3B down.
    evidence:
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: We detected extreme overexpression of a previously uncharacterized isoform of DNMT3B
        originating at an alternative promoter that is active only in the first weeks of neural tube
        development.
      explanation: Names the consequence this edge asserts and locates it at an alternative promoter
        restricted to early neural tube development.
  - target: C19MC-LIN28A-MYCN Oncogenic Circuit
    description: The amplified cluster is one arm of a self-reinforcing circuit.
    evidence:
    - reference: PMID:31287992
      reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
        a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: Here we investigated C19MC oncogenic mechanisms and discovered a C19MC-LIN28A-MYCN
        circuit fueled by multiple complex regulatory loops including an MYCN core transcriptional
        network and super-enhancers resulting from long-range MYCN DNA interactions and C19MC gene
        fusions.
      explanation: Names the circuit and the regulatory loops that sustain it.
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Embryonal tumors with multilayered rosettes (ETMRs) are rare, deadly pediatric brain
      tumors characterized by high-level amplification of the microRNA cluster C19MC.
    explanation: States the amplification that puts the cluster at high level, which is this node's
      premise.
- name: Embryonic DNMT3B Isoform Overexpression
  description: 'Extreme overexpression of a DNMT3B isoform transcribed from an alternative promoter
    that is normally active only during the first weeks of neural tube development. This is the step
    that makes the disease epigenetic as much as genetic: the methyltransferase itself is a developmental
    isoform running far outside its window.'
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA (cytosine-5-)-methyltransferase activity
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity
    modifier: INCREASED
  genes:
  - preferred_term: DNMT3B
    term:
      id: hgnc:2979
      label: DNMT3B
  downstream:
  - target: ETMR-Specific DNA Methylation Landscape
    description: An embryonic methyltransferase isoform at extreme level writes a methylation pattern
      unlike any normal tissue's.
    evidence:
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: ETMR tumors, cell lines and xenografts showed a specific DNA methylation pattern distinct
        from those of other tumors and normal tissues.
      explanation: The resulting pattern, and that it is distinct from other tumours and from normal
        tissue, which is what this edge produces.
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We detected extreme overexpression of a previously uncharacterized isoform of DNMT3B
      originating at an alternative promoter that is active only in the first weeks of neural tube
      development.
    explanation: The isoform, its alternative promoter and the developmental window that promoter
      belongs to.
- name: ETMR-Specific DNA Methylation Landscape
  description: A genome-wide methylation pattern distinct from other tumours and from normal tissue.
    It is a consequence of the mechanism rather than a step in it, and it is also what the diagnostic
    methylation classifier reads.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: ETMR tumors, cell lines and xenografts showed a specific DNA methylation pattern distinct
      from those of other tumors and normal tissues.
    explanation: States the pattern and its distinctness, which is the whole of this node's claim.
- name: C19MC-LIN28A-MYCN Oncogenic Circuit
  description: A self-reinforcing circuit joining the amplified microRNA cluster, the pluripotency
    factor LIN28A and MYCN, held together by an MYCN core transcriptional network and by super-enhancers
    created both by long-range MYCN DNA interactions and by the C19MC fusions themselves. Its effect
    on the cell is to entrap an early neural lineage network.
  biological_scale: CELLULAR
  genes:
  - preferred_term: LIN28A
    term:
      id: hgnc:15986
      label: LIN28A
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  downstream:
  - target: let-7 Depletion
    description: LIN28A within the circuit blocks maturation of the let-7 family.
    evidence:
    - reference: PMID:31287992
      reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
        a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: Embryonal tumors with multilayered rosettes (ETMRs) are highly lethal infant brain
        cancers with characteristic amplification of Chr19q13.41 miRNA cluster (C19MC) and enrichment
        of pluripotency factor LIN28A.
      explanation: Establishes the LIN28A enrichment that the blockade depends on.
  evidence:
  - reference: PMID:31287992
    reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
      a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: Here we investigated C19MC oncogenic mechanisms and discovered a C19MC-LIN28A-MYCN circuit
      fueled by multiple complex regulatory loops including an MYCN core transcriptional network and
      super-enhancers resulting from long-range MYCN DNA interactions and C19MC gene fusions.
    explanation: The circuit, its components and the loops that sustain it.
  - reference: PMID:31287992
    reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
      a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: Our data show that this powerful oncogenic circuit, which entraps an early neural lineage
      network, is potently abrogated by bromodomain inhibitor JQ1, leading to ETMR cell death.
    explanation: That the circuit entraps an early neural lineage network, and that blocking it kills
      the cells - which is what makes it the entry's central node rather than a description.
- name: let-7 Depletion
  description: 'Depletion of the mature let-7 microRNA family. This is where the three driver lesions
    meet: the C19MC arm reaches it through LIN28A, and the DICER1 arm reaches it directly by failing
    to process the precursor.'
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: pre-miRNA processing of the let-7 family
    term:
      id: GO:0031054
      label: pre-miRNA processing
    modifier: DECREASED
  downstream:
  - target: Arrest of Apical Radial Glial Progenitors
    description: Without let-7, its targets are de-repressed and the progenitor is held in a proliferative,
      stem-like state.
    evidence:
    - reference: PMID:31287992
      reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
        a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: Our data show that this powerful oncogenic circuit, which entraps an early neural lineage
        network, is potently abrogated by bromodomain inhibitor JQ1, leading to ETMR cell death.
      explanation: The circuit entrapping an early neural lineage network is the arrest this edge
        asserts.
  evidence:
  - reference: PMID:31802000
    reference_title: The molecular landscape of ETMR at diagnosis and relapse.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that patients with tumours in which the proposed driver C19MC2-4 was not amplified
      frequently had germline mutations in DICER1 or other microRNA-related aberrations such as somatic
      amplification of miR-17-92 (also known as MIR17HG).
    explanation: Establishes that the non-C19MC tumours carry DICER1 or other microRNA-related lesions,
      which is the basis for treating microRNA processing as the convergence point of all three arms.
- name: DICER1 Loss of Function
  description: The alternative driver arm. A germline truncating DICER1 allele with a somatic RNase
    IIIb hotspot variant impairs microRNA processing, reaching let-7 depletion without any C19MC event.
    It is also the arm in which the tumour is part of a heritable predisposition syndrome rather than
    a sporadic somatic event.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: RNase IIIb domain activity
    term:
      id: GO:0004525
      label: ribonuclease III activity
    modifier: LOSS_OF_FUNCTION
  genes:
  - preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  downstream:
  - target: let-7 Depletion
    description: Impaired processing depletes the mature family directly.
    evidence:
    - reference: PMID:31802000
      reference_title: The molecular landscape of ETMR at diagnosis and relapse.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: We found that patients with tumours in which the proposed driver C19MC2-4 was not amplified
        frequently had germline mutations in DICER1 or other microRNA-related aberrations such as
        somatic amplification of miR-17-92 (also known as MIR17HG).
      explanation: Places DICER1 germline mutation in the non-amplified tumours, as the alternative
        route to the same microRNA defect.
  evidence:
  - reference: PMID:31802000
    reference_title: The molecular landscape of ETMR at diagnosis and relapse.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that patients with tumours in which the proposed driver C19MC2-4 was not amplified
      frequently had germline mutations in DICER1 or other microRNA-related aberrations such as somatic

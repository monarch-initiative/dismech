    explanation: The germline DICER1 arm and the MIR17HG arm, both in tumours without C19MC amplification.
- name: R-loop-Associated Genomic Instability
  description: Widespread R-loop structures drive the structural-variant burden, against a background
    of very few single-nucleotide variants. The structural architecture is conserved from diagnosis
    to relapse, which is why relapse is not a new tumour.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31802000
    reference_title: The molecular landscape of ETMR at diagnosis and relapse.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-genome sequencing revealed that tumours had an overall low recurrence of single-nucleotide
      variants (SNVs), but showed prevalent genomic instability caused by widespread occurrence of
      R-loop structures.
    explanation: 'States both halves: few SNVs, and prevalent instability caused by R-loops.'
- name: Arrest of Apical Radial Glial Progenitors
  description: 'The circuit holds an apical ventricular-zone progenitor population in a proliferative,
    undifferentiated state, with only partial differentiation toward neuronal and glial fates. This
    is what produces the entity''s defining morphology: the multilayered rosettes are the undifferentiated
    apical compartment reproducing a neural-tube-like architecture.'
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: apical radial glial progenitor of the ventricular zone
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:

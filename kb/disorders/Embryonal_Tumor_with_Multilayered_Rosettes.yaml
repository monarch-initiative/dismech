name: Embryonal Tumor with Multilayered Rosettes
creation_date: '2026-11-11T15:12:00Z'
description: 'A rare and highly aggressive embryonal neoplasm of the central nervous system, predominantly
  of children under three to four years. Its defining histology is the multilayered rosette. The entity
  is a molecular unification of three previously separate histological diagnoses - ependymoblastoma,
  embryonal tumour with abundant neuropil and true rosettes, and medulloepithelioma - and what unified
  them is a focal amplification at 19q13.42: the C19MC microRNA cluster, fused to TTYH1, the fusion
  driving the cluster''s expression. A minority of tumours reach the same end through biallelic DICER1
  mutation or MIR17HG amplification instead.'
categories:
- Central Nervous System Neoplasm
- Pediatric Brain Tumor
- Embryonal Tumor
- Molecularly Defined Tumor
parents:
- central nervous system neoplasm
synonyms:
- ETMR
- Embryonal tumor with multilayered rosettes, C19MC-altered
- Embryonal tumor with abundant neuropil and true rosettes
- Ependymoblastoma
- Medulloepithelioma
pathophysiology:
- name: C19MC Amplification and TTYH1 Fusion
  description: A focal structural rearrangement amplifies the C19MC microRNA cluster at 19q13.42 and
    fuses it to TTYH1, and the fusion is what drives the cluster's expression. The cluster's normal
    expression is restricted to undifferentiated and germinal tissues and falls as embryonic stem
    cells differentiate, so the lesion puts it at high level where it is normally low.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: nestin-positive neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  genes:
  - preferred_term: TTYH1
    term:
      id: hgnc:13476
      label: TTYH1
  downstream:
  - target: Ectopic C19MC microRNA Expression
    description: The fusion is what drives the cluster's expression.
    evidence:
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: We performed integrated genetic and epigenetic analyses of 12 ETMR samples and identified,
        in all cases, C19MC fusions to TTYH1 driving expression of the microRNAs.
      explanation: States the fusion and that it drives expression of the microRNAs, in every one
        of the twelve samples examined.
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed integrated genetic and epigenetic analyses of 12 ETMR samples and identified,
      in all cases, C19MC fusions to TTYH1 driving expression of the microRNAs.
    explanation: The fusion, and that it drives the cluster's expression, in all twelve cases examined.
  - reference: PMID:20407781
    reference_title: Focal genomic amplification at 19q13.42 comprises a powerful diagnostic marker
      for embryonal tumors with ependymoblastic rosettes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Strikingly, FISH analysis revealed 19q13.42 amplifications in 37/40 samples (93%)
    explanation: The amplification's frequency across a larger morphologically defined series, which
      is what made it the entity-defining lesion.
  - reference: PMID:24311633
    reference_title: A novel C19MC amplified cell line links Lin28/let-7 to mTOR signaling in embryonal
      tumor with multilayered rosettes.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: many C19MC miRNAs show expression restricted to undifferentiated tissues or germinal
      tissues, and their expression decreases with human embryonic stem cell differentiation
    explanation: Sources the normal expression pattern the lesion disturbs. Recorded at the level
      the source states - restricted to undifferentiated and germinal tissue - rather than as a claim
      about any particular tissue.
  notes: 'The cell bound here is CL:0011020 neural progenitor cell, carried as the entry''s derived
    cell of origin because this is the node with the somatic genetic_context. It rests on one observation:
    the single ETMR line in the cached sources is nestin-positive in the majority of its cells. That
    is a property of the tumour cells, not of the cell the lesion arose in, and no cached source for
    this entry states a cell of origin at all. Read the binding as the most specific cell type the
    sources support, not as a lineage claim.'
- name: Ectopic C19MC microRNA Expression
  description: High-level expression of the C19MC microRNAs in neural tissue, where the cluster's
    expression is normally low. Everything downstream follows from the microRNAs being present at
    that level; no cached source describes a change in what the individual microRNAs do.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: miRNA-mediated silencing by ectopic C19MC microRNAs
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
    modifier: INCREASED
  downstream:
  - target: Embryonic DNMT3B Isoform Overexpression
    description: Putting the microRNAs into cells raises DNMT3B and lowers RBL2 together. The authors
      read the DNMT3B rise as mediated by RBL2, a known repressor of DNMT3B, and hedge that reading;
      the edge is recorded at their strength.
    evidence:
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: Transfection with individual C19MC microRNAs resulted in DNMT3B upregulation and RBL2
        downregulation in cultured cells.
      explanation: 'The experiment behind this edge: putting the microRNAs into cells raises DNMT3B
        and lowers RBL2, which is the de-repression the edge asserts.'
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: Transcriptional and immunohistochemical analyses suggest that C19MC-dependent DNMT3B
        deregulation is mediated by RBL2, a known repressor of DNMT3B.
      explanation: The mechanism behind the edge, with the authors' own hedge kept.
  - target: C19MC-LIN28A-MYCN Oncogenic Circuit
    description: The amplified cluster is one arm of a self-reinforcing circuit.
    evidence:
    - reference: PMID:31287992
      reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
        a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: Here we investigated C19MC oncogenic mechanisms and discovered a C19MC-LIN28A-MYCN
        circuit fueled by multiple complex regulatory loops including an MYCN core transcriptional
        network and super-enhancers resulting from long-range MYCN DNA interactions and C19MC gene
        fusions.
      explanation: Names the circuit and the regulatory loops that sustain it. Graded OTHER because
        the sentence names no experimental system, which is the same reading this entry applies to
        the BET treatment row.
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Embryonal tumors with multilayered rosettes (ETMRs) are rare, deadly pediatric brain
      tumors characterized by high-level amplification of the microRNA cluster C19MC.
    explanation: States the high-level amplification that is this node's premise. Indirect because
      the sentence reports amplification, where the node is about the resulting expression.
- name: Embryonic DNMT3B Isoform Overexpression
  description: 'Extreme overexpression of a DNMT3B isoform transcribed from an alternative promoter
    that is normally active only during the first weeks of neural tube development. This is the step
    that makes the disease epigenetic as much as genetic: the methyltransferase itself is a developmental
    isoform running far outside its window.'
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA (cytosine-5-)-methyltransferase activity
    term:
      id: GO:0003886
      label: DNA (cytosine-5-)-methyltransferase activity
    modifier: INCREASED
  genes:
  - preferred_term: DNMT3B
    term:
      id: hgnc:2979
      label: DNMT3B
  downstream:
  - target: ETMR-Specific DNA Methylation Landscape
    description: The authors read the methylation landscape as mediated by this isoform. Their own
      wording is that the data suggest it, and the edge is recorded at that strength.
    evidence:
    - reference: PMID:24316981
      reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
        DNMT3B isoform in the embryonal brain tumor ETMR.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: Our data suggest a potential oncogenic re-engagement of an early developmental program
        in ETMR via epigenetic alteration mediated by an embryonic, brain-specific DNMT3B isoform.
      explanation: 'The attributive sentence, hedged as the authors hedge it. Graded OTHER for the
        same reason as this entry''s other items from this paper: ''our data'' spans tumours, cell
        lines, xenografts and transfected cultures.'
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We detected extreme overexpression of a previously uncharacterized isoform of DNMT3B
      originating at an alternative promoter that is active only in the first weeks of neural tube
      development.
    explanation: The isoform, its alternative promoter and the developmental window that promoter
      belongs to.
- name: ETMR-Specific DNA Methylation Landscape
  description: A DNA methylation pattern distinct from other tumours and from normal tissue, found
    in ETMR tumours, cell lines and xenografts alike. It is a consequence of the mechanism rather
    than a step in it, and a methylation classifier is what assigns the entity in practice.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:24316981
    reference_title: Fusion of TTYH1 with the C19MC microRNA cluster drives expression of a brain-specific
      DNMT3B isoform in the embryonal brain tumor ETMR.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: ETMR tumors, cell lines and xenografts showed a specific DNA methylation pattern distinct
      from those of other tumors and normal tissues.
    explanation: The pattern and its distinctness, which is this node's claim. Graded OTHER because
      the one sentence spans human tumour, cultured cells and mouse xenograft, so no single evidence-source
      value describes it; the three are not separable without splitting the sentence.
  - reference: PMID:33908610
    reference_title: Treatment of embryonal tumors with multilayered rosettes with carboplatin/etoposide
      induction and high-dose chemotherapy within the prospective P-HIT trial.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Classification of DNA methylation data was based on the Heidelberg brain tumor methylation
      classifier version v11b4
    explanation: Names the classifier actually used on an ETMR cohort.
- name: C19MC-LIN28A-MYCN Oncogenic Circuit
  description: A self-reinforcing circuit joining the amplified microRNA cluster, the pluripotency
    factor LIN28A and MYCN, held together by an MYCN core transcriptional network and by super-enhancers
    created both by long-range MYCN DNA interactions and by the C19MC fusions themselves. Its effect
    on the cell is to entrap an early neural lineage network.
  biological_scale: CELLULAR
  genes:
  - preferred_term: LIN28A
    term:
      id: hgnc:15986
      label: LIN28A
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  downstream:
  - target: let-7 Depletion
    description: 'LIN28A within the circuit holds let-7 down: removing LIN28 raises let-7. By what
      step is not stated by any cached source.'
    evidence:
    - reference: PMID:24311633
      reference_title: A novel C19MC amplified cell line links Lin28/let-7 to mTOR signaling in embryonal
        tumor with multilayered rosettes.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: LIN28 knockdown increases let-7 expression and decreases expression of IGF/PI3K/mTOR
        pathway components.
      explanation: 'Demonstrates the direction of this edge: LIN28 is what holds let-7 down, because
        removing it raises let-7.'
  evidence:
  - reference: PMID:31287992
    reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
      a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: Here we investigated C19MC oncogenic mechanisms and discovered a C19MC-LIN28A-MYCN circuit
      fueled by multiple complex regulatory loops including an MYCN core transcriptional network and
      super-enhancers resulting from long-range MYCN DNA interactions and C19MC gene fusions.
    explanation: The circuit, its components and the loops that sustain it. Graded OTHER because the
      sentence names no experimental system, which is the same reading this entry applies to the BET
      treatment row.
  - reference: PMID:31287992
    reference_title: 'A C19MC-LIN28A-MYCN Oncogenic Circuit Driven by Hijacked Super-enhancers Is
      a Distinct Therapeutic Vulnerability in ETMRs: A Lethal Brain Tumor.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: Our data show that this powerful oncogenic circuit, which entraps an early neural lineage
      network, is potently abrogated by bromodomain inhibitor JQ1, leading to ETMR cell death.
    explanation: That the circuit entraps an early neural lineage network, and that blocking it kills
      the cells - which is what makes it the entry's central node rather than a description.
- name: let-7 Depletion
  description: 'Low mature let-7 alongside high LIN28, with the IGF/PI3K/mTOR axis raised. Removing
    LIN28 raises let-7 and lowers that axis. The authors read this as consistent with a functional
    Lin28/let-7 axis in ETMR, and that is the strength recorded here: no cached source manipulates
    let-7 itself, so let-7 is not shown to be the intermediate, and the same paper notes that LIN28
    proteins act on many transcripts besides let-7.'
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: pre-miRNA processing of the let-7 family
    term:
      id: GO:0031054
      label: pre-miRNA processing
    modifier: DECREASED
  - preferred_term: IGF/PI3K/mTOR pathway activity
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  downstream:
  - target: Entrapment of an Early Neural Lineage Network
    description: The raised IGF/PI3K/mTOR axis is the entry's proposed route from the microRNA defect
      to a proliferative, undifferentiated population. No cached source links that axis to a progenitor
      population, so the step is the entry's reading rather than a reported result.
    evidence:
    - reference: PMID:24311633
      reference_title: A novel C19MC amplified cell line links Lin28/let-7 to mTOR signaling in embryonal
        tumor with multilayered rosettes.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: LIN28 knockdown increases let-7 expression and decreases expression of IGF/PI3K/mTOR
        pathway components.
      explanation: 'Establishes that the axis is under LIN28 control in this disease. Indirect for
        this edge: the sentence names no progenitor and no proliferative state.'
  evidence:
  - reference: PMID:24311633
    reference_title: A novel C19MC amplified cell line links Lin28/let-7 to mTOR signaling in embryonal
      tumor with multilayered rosettes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: ETMRs, including BT183, have high LIN28 expression and low let-7 miRNA expression, and
      show evidence of mTOR pathway activation.
    explanation: The node's state, measured in ETMR tumours as well as in the BT183 line.
  - reference: PMID:24311633
    reference_title: A novel C19MC amplified cell line links Lin28/let-7 to mTOR signaling in embryonal
      tumor with multilayered rosettes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: LIN28 knockdown increases let-7 expression and decreases expression of IGF/PI3K/mTOR
      pathway components.
    explanation: 'The intervention: removing LIN28 moves let-7 and the axis together. It constrains

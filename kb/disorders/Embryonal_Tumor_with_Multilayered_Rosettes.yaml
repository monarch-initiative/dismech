notes: 'Two things this entry does not record, each because no source cached for it carries the claim.
  There is no hydrocephalus, macrocephaly or papilledema phenotype: the clinical series cached here
  names raised intracranial pressure, seizures and motor deficits, and the per-symptom frequencies
  in the research report come from a table that is not in the cached abstract. And there is no motor-deficit
  phenotype, because the quoted sentence says only ''motor deficits'' and the HPO terms available
  would each assert a distribution or a course the source does not state.'
review_notes: 'Every ontology identifier in this entry was looked up when the line was written, against
  the local HGNC and MONDO builds, the committed HP/GO/CL caches, or OLS. That matters more than usual
  here. The research report behind the entry states that its own session had no network access and
  flags its CURIEs as unverified leads, all but one; none was copied. Its reference validation resolved
  50 of 50 citations with no confabulation, and recorded one quoted claim it could not find in its
  source.


  The report''s prose carries the same risk as its CURIEs, and this entry is written so that every
  factual statement in a description, a note or an explanation traces to a sentence in one of the
  eight cached references rather than to the report. Where the sources stop, the entry says so rather
  than continuing: the cell of origin, the step between LIN28 and the IGF/PI3K/mTOR axis, the identity
  of the entrapped population, the allele architecture of the DICER1 arm, and the mechanism by which
  the TTYH1 fusion drives expression are all marked as not established by the sources cited here.
  The entry''s own curation history is in its history/ records, not in these notes.'

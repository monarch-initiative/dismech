notes: 'Three things this entry does not record, each because no source cached for it carries the
  claim. There is no hydrocephalus, macrocephaly or papilledema phenotype: the clinical series cached
  here names raised intracranial pressure, seizures and motor deficits, and the per-symptom frequencies
  in the research report come from a table that is not in the cached abstract. There is no motor-deficit
  phenotype, because the quoted sentence says only ''motor deficits'' and the HPO terms available
  would each assert a distribution or a course the source does not state. And there is no treatment
  section: the cached sources are molecular and diagnostic, and a surgery-radiotherapy-chemotherapy
  row written from general knowledge of infant CNS embryonal tumour protocols would not be read from
  a source.'
review_notes: 'Every ontology identifier in this entry was looked up when the line was written, against
  the local HGNC and MONDO builds, the committed HP/GO/CL caches, or OLS. This matters more than usual
  here: the research report behind the entry states that its own session had no network access, so
  none of its CURIEs could be resolved in the step it wrote them, and it flags every one as an unverified
  lead. None of them was copied. The report''s own reference validation resolved 50 of 50 citations
  with no confabulation.'

    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Together, these findings are consistent with the presence of a functional Lin28/let-7
      axis in ETMR.
    explanation: The authors' own statement of how strongly their data support the axis, which is
      the strength this node claims. Graded OTHER because the findings it summarises span primary
      human tumours, a xenograft and cultured cells, so no single evidence-source value describes
      it.
- name: DICER1 Loss of Function
  description: 'The alternative driver arm. Tumours without C19MC amplification frequently carry germline
    DICER1 mutations, and biallelic DICER1 mutation is reported in infratentorially located C19MC-negative
    tumours, at about 5% of all ETMR. How this arm reaches the microRNA defect is not demonstrated
    by any source cached here: the allele classes, the order of the two hits, and the convergence
    on let-7 specifically are all absent from them.'
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: ribonuclease III activity
    term:
      id: GO:0004525
      label: ribonuclease III activity
    modifier: LOSS_OF_FUNCTION
  genes:
  - preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  downstream:
  - target: let-7 Depletion
    description: Loss of DICER1 function impairs microRNA processing. The convergence on let-7 specifically
      is inferred from DICER1's general role in producing mature microRNAs, not demonstrated in this
      disease by any source cited here.
    evidence:
    - reference: PMID:31802000
      reference_title: The molecular landscape of ETMR at diagnosis and relapse.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: We found that patients with tumours in which the proposed driver C19MC2-4 was not amplified
        frequently had germline mutations in DICER1 or other microRNA-related aberrations such as
        somatic amplification of miR-17-92 (also known as MIR17HG).
      explanation: 'Places germline DICER1 mutation in the tumours without C19MC amplification, which
        is this arm''s premise. Indirect for the edge itself: the sentence does not mention let-7,
        and no source cached for this entry measures let-7 in a DICER1-mutant ETMR.'
  - target: R-loop-Associated Genomic Instability
    description: Loss of DICER1 function induces the R-loop-associated instability, which is how this
      arm reaches the structural-variant burden the C19MC arm reaches by another route.
    evidence:
    - reference: PMID:31802000
      reference_title: The molecular landscape of ETMR at diagnosis and relapse.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: We show that R-loop-associated chromosomal instability can be induced by the loss of
        DICER1 function.
      explanation: The paper's own result, stated as a causal induction in this disease, which is
        exactly this edge.
  evidence:
  - reference: PMID:31802000
    reference_title: The molecular landscape of ETMR at diagnosis and relapse.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: We found that patients with tumours in which the proposed driver C19MC2-4 was not amplified
      frequently had germline mutations in DICER1 or other microRNA-related aberrations such as somatic
      amplification of miR-17-92 (also known as MIR17HG).
    explanation: Places germline DICER1 mutation, and MIR17HG amplification, in the tumours without
      C19MC amplification.
  - reference: PMID:33908610
    reference_title: Treatment of embryonal tumors with multilayered rosettes with carboplatin/etoposide
      induction and high-dose chemotherapy within the prospective P-HIT trial.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: infratentorially located C19MC-negative ETMR may show biallelic DICER1 mutations (about
      5% of all ETMR)
    explanation: 'Sources the biallelic architecture and its share of cases, with the source''s own
      two qualifiers kept: it says may show, and restricts the observation to infratentorially located
      tumours. The citing cohort did not sequence DICER1 or assess family history, and states this
      as recently shown elsewhere, so it is graded as that paper''s synthesis rather than its result.'
- name: R-loop-Associated Genomic Instability
  description: Widespread R-loop structures drive a structural-variant burden against a background
    of very few single-nucleotide variants, and the structural variants are strongly conserved from
    diagnosis to relapse while the SNVs are not.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31802000
    reference_title: The molecular landscape of ETMR at diagnosis and relapse.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-genome sequencing revealed that tumours had an overall low recurrence of single-nucleotide
      variants (SNVs), but showed prevalent genomic instability caused by widespread occurrence of
      R-loop structures.
    explanation: 'Both halves of the node: few SNVs, and instability caused by R-loops.'
  - reference: PMID:31802000
    reference_title: The molecular landscape of ETMR at diagnosis and relapse.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Comparison of primary tumours and matched relapse samples showed a strong conservation
      of structural variants, but low conservation of SNVs.
    explanation: The conservation from diagnosis to relapse.

diagnosis:
- name: 19q13.42 amplification testing
  description: Detection of the focal 19q13.42 amplification, by FISH or by a copy-number method,
    is what assigns the diagnosis across all three of the morphologies that used to be reported separately.
  evidence:
  - reference: PMID:20407781
    reference_title: Focal genomic amplification at 19q13.42 comprises a powerful diagnostic marker
      for embryonal tumors with ependymoblastic rosettes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Strikingly, FISH analysis revealed 19q13.42 amplifications in 37/40 samples (93%).
    explanation: The test, its yield in a morphologically defined series, and so its use as a diagnostic
      marker.
- name: DNA methylation profiling
  description: The tumour's methylation pattern is distinct from other tumours and from normal tissue,
    which is what lets a classifier assign the entity - including in the C19MC-non-amplified tumours,

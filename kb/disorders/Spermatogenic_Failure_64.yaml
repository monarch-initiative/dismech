  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical examination revealed bilateral testicular volumes of approximately 8-10 mL, which is below the adult reference range (10-15 mL)."
    explanation: Examination of the NOA proband found testes smaller than the adult reference range.
- category: Reproductive
  name: Teratozoospermia
  description: >-
    Abnormal sperm morphology in two brothers homozygous for the missense
    variant p.Gly664Asp. The abstract does not describe the morphology
    further, and that report had no functional data. A later paper describes
    the same family's phenotype as oligoasthenoteratozoospermia, which adds
    low sperm count and reduced motility.
  phenotype_term:
    preferred_term: Teratozoospermia
    term:
      id: HP:0012864
      label: Abnormal sperm morphology
  evidence:
  - reference: PMID:30878252
    reference_title: "A novel homozygous FBXO43 mutation associated with male infertility and teratozoospermia in a consanguineous Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous nonsynonymous mutation (C1991T, p.G664D) in FBXO43 (F-box only protein 43) was observed in two brothers from a consanguineous Chinese family."
    explanation: The affected brothers in this family were ascertained for teratozoospermia.
  - reference: PMID:30878252
    reference_title: "A novel homozygous FBXO43 mutation associated with male infertility and teratozoospermia in a consanguineous Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation in FBXO43 is a causative factor of male infertility and teratozoospermia."
    explanation: The authors' conclusion links the homozygous missense variant to teratozoospermia.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "the homozygous missense variant (p.Gly664Asp) leading to oligoasthenoteratozoospermia"
    explanation: Restates the earlier family's phenotype as oligoasthenoteratozoospermia, of which teratozoospermia is one part.
genetic:
- name: FBXO43
  notes: >-
    FBXO43 encodes EMI2, also called XErp1, a paralogue of EMI1 (FBXO5). Its
    C-terminal region, including the zinc-binding region, carries the APC/C
    inhibitory function. Reported male alleles are p.Gln583* (homozygous),
    p.Gly664Asp (homozygous), p.Trp532*/p.Ser577Leufs*11 and
    p.Pro641Leu/p.Arg660Gln (both compound heterozygous). Truncating alleles
    go with azoospermia and missense alleles with sperm present.
  gene_term:
    preferred_term: FBXO43
    term:
      id: hgnc:28521
      label: FBXO43
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results here demonstrate the pathogenicity of this loss-of-function mutation"
    explanation: Patient genetics, absent testicular protein and the matching mouse phenotype support FBXO43 as causal.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypomorphic missense mutations permit meiotic completion but result in severe teratozoospermia with high aneuploidy"
    explanation: Supports the allele-severity relationship recorded in the notes.
histopathology:

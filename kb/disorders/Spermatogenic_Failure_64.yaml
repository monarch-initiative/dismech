name: Spermatogenic Failure 64
creation_date: "2026-10-21T00:00:00Z"
category: Mendelian
synonyms:
- SPGF64
- spermatogenic failure 64
- FBXO43-related male infertility
- EMI2-related spermatogenic failure
description: >-
  Spermatogenic failure 64 (SPGF64) is autosomal recessive male infertility
  caused by biallelic variants in FBXO43, which encodes EMI2 (early meiotic
  inhibitor 2). EMI2 is a direct inhibitor of the anaphase-promoting
  complex/cyclosome (APC/C), the E3 ubiquitin ligase that drives meiotic cell
  cycle transitions. It is expressed mainly in germ cells.

  The phenotype depends on the allele. Homozygous or compound heterozygous
  truncating variants cause non-obstructive azoospermia: spermatocytes arrest
  in meiosis I and no spermatids form. In the first family, testicular tissue
  lacked FBXO43 and the arrest was placed in early diplotene of prophase I,
  the same stage at which Emi2 knockout mouse spermatocytes arrest. Missense
  variants have been reported with sperm in the ejaculate. One man with two
  C-terminal missense variants had macrozoospermia, defective chromatin
  condensation and raised sperm aneuploidy, and repeated ICSI cycles failed.
  An earlier family with a homozygous missense variant had teratozoospermia.
  The proposed explanation is a dosage series: the more an allele weakens
  FBXO43 binding to the APC/C, the earlier meiosis fails.
disease_term:
  preferred_term: spermatogenic failure 64
  term:
    id: MONDO:0030522
    label: spermatogenic failure 64
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 619696. MONDO records FBXO43 as
  its only causal gene and no descendant terms. Biallelic FBXO43 variants also
  cause female infertility with early embryonic arrest (PMID:34052850). MONDO
  lists that as a separate disease, oocyte maturation defect 12
  (MONDO:0030523), so it is not part of this entry. The reported male cases are
  few: two brothers with a homozygous missense variant (PMID:30878252), two
  brothers with a homozygous nonsense variant (PMID:34595750), two unrelated
  men with compound heterozygous variants (PMID:42597893), and one case in an
  exome series whose abstract does not give the phenotype (PMID:41932285). The
  stage of arrest is reported differently. The primary human and mouse studies
  give early diplotene of prophase I (PMID:34595750, PMID:28723571). The
  background section of PMID:42597893 says metaphase I. This entry follows the
  primary studies. The same 2019 study found four heterozygous FBXO43 carriers
  among 124 further men with teratozoospermia (PMID:30878252); single
  heterozygous variants do not fit recessive inheritance, so they are not
  counted as cases here. The deep-research report in research/ found no
  further patients.
inheritance:
- name: Autosomal recessive
  description: >-
    Affected men carry biallelic FBXO43 variants. Both families with
    homozygous variants were consanguineous, and the two later probands were
    compound heterozygous.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous nonsense mutation in FBXO43 c.1747C > T:p.Gln583X in two NOA brothers from a Chinese consanguineous family via whole-exome sequencing"
    explanation: A homozygous truncating variant in affected brothers of a consanguineous family fits recessive inheritance.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two infertile patients carrying distinct compound heterozygous FBXO43 variants-missense mutations in a macrozoospermia case and truncating mutations in a nonobstructive azoospermia (NOA) case-were identified through whole-exome sequencing."
    explanation: Two compound heterozygous probands add further biallelic cases.
pathophysiology:
- name: Loss of FBXO43 Inhibition of the APC/C
  description: >-
    FBXO43 (EMI2) binds the APC/C and holds its ubiquitin ligase activity in
    check during meiosis. In patient testis a homozygous nonsense allele
    removed the protein. Truncating and missense alleles both made FBXO43
    less stable in transfected cells and broke its binding to APC3, the APC/C
    substrate-recognition subunit, while binding to APC2, APC6 and APC8 was
    kept. In Xenopus eggs, the C-terminal tail of EMI2 blocks the APC/C by
    occupying the APC10 site that the E2 enzyme Ube2S needs.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FBXO43
    term:
      id: hgnc:28521
      label: FBXO43
  molecular_functions:
  - preferred_term: ubiquitin ligase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:1990948
      label: ubiquitin ligase inhibitor activity
  - preferred_term: anaphase-promoting complex binding
    modifier: DECREASED
    term:
      id: GO:0010997
      label: anaphase-promoting complex binding
  downstream:
  - target: Reduced Cdk1 Activity in Meiotic Prophase Spermatocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in knockout mice. Loss of Emi2 lowered Cdk1 activity in the testis
      without lowering Cdk1 or cyclin B1 protein. The step that connects the
      APC/C to Cdk1 here is not known.
    evidence:
    - reference: PMID:28723571
      reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the absence of Emi2 in testes, we observed the decreased activity of Cdk1."
      explanation: Links loss of Emi2 to reduced Cdk1 activity in the mouse testis.
  - target: Meiotic Chromosome Missegregation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed for hypomorphic alleles that leave enough FBXO43 for meiosis to
      finish. Weaker APC3 binding is thought to let the APC/C act too early or
      at the wrong time, so chromosomes segregate wrongly.
    evidence:
    - reference: PMID:42597893
      reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Loss of APC3 binding likely impairs APC/C inhibition, disturbing meiotic chromosome segregation in a mutation-severity-dependent manner."
      explanation: The authors infer missegregation from lost APC3 binding in cell assays together with patient sperm aneuploidy; the link is a stated model, not a direct measurement.
  evidence:
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBXO43 was absent from testicular tissue of the proband, and FBXO43-immunostaining signals were invisible in the affected seminiferous tubules."
    explanation: The nonsense allele removes FBXO43 protein from patient testis.
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In mouse testicular protein extracts, three subunits of the APC/C, including ANAPC2, ANAPC8 and ANAPC10, were validated to interact directly with FBXO43, whereas no interactions were detected for FBXO43 and SKP1."
    explanation: FBXO43 binds APC/C subunits in testis extracts but not SKP1, so it acts as an APC/C binder rather than in an SCF ligase.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, all mutations reduced FBXO43 protein stability and disrupted its specific binding to the APC/C substrate recognition subunit APC3, whereas interactions with APC2/6/8 remained intact."
    explanation: Patient truncating and missense alleles all lower FBXO43 stability and lose APC3 binding.
  - reference: PMID:24770399
    reference_title: "Emi2 mediates meiotic MII arrest by competitively inhibiting the binding of Ube2S to the APC/C."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Significantly, Emi2 and Ube2S bind commonly to the APC/C catalytic subunit APC10 via their similar C-terminal tails."
    explanation: Gives the biochemical mechanism of APC/C inhibition by EMI2, worked out in Xenopus egg extracts rather than spermatocytes.
- name: Reduced Cdk1 Activity in Meiotic Prophase Spermatocytes
  description: >-
    In Emi2 knockout spermatocytes, Cdk1 activity falls and its inhibitory
    Tyr15 phosphorylation rises. Raising Cdk1 activity with a knockin allele
    let some spermatocytes go past diplotene into metaphase, so low Cdk1
    activity is part of the cause of the arrest.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  molecular_functions:
  - preferred_term: Cdk1 kinase activity
    modifier: DECREASED
    term:
      id: GO:0004693
      label: cyclin-dependent protein serine/threonine kinase activity
  downstream:
  - target: Meiotic Prophase I Arrest at Early Diplotene
    causal_link_type: DIRECT
    description: >-
      Partial rescue of the arrest by a Cdk1 knockin allele shows that low
      Cdk1 activity contributes to it.
    evidence:
    - reference: PMID:28723571
      reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This arrest is associated with decreased Cdk1 activity and was partially rescued by a knockin mouse model of elevated Cdk1 activity."
      explanation: Genetic rescue in mice links low Cdk1 activity to the meiotic arrest.
  evidence:
  - reference: PMID:28723571
    reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, decreased activity of Cdk1 in the absence of Emi2 was associated with increased Tyr15 inhibitory phosphorylation."
    explanation: Describes how Cdk1 activity is lowered in Emi2-null testis.
- name: Meiotic Prophase I Arrest at Early Diplotene
  description: >-
    Spermatocytes stop in early diplotene of prophase I. Chromosomes do not
    condense and do not enter metaphase I, and the arrested cells die.
    Primary spermatocytes are present in the testis but no spermatids. Shown
    in patient testis and in Emi2 knockout mice.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  biological_processes:
  - preferred_term: male meiosis I
    modifier: DECREASED
    term:
      id: GO:0007141
      label: male meiosis I
  downstream:
  - target: Spermatocyte maturation arrest
    causal_link_type: DIRECT
  - target: Non-obstructive azoospermia
    causal_link_type: DIRECT
    description: >-
      With no spermatocyte completing meiosis, no sperm reach the ejaculate.
    evidence:
    - reference: PMID:42597893
      reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "abolished the C-terminal functional domain and caused meiotic arrest with complete absence of mature sperm"
      explanation: Links the truncating genotype through meiotic arrest to absent sperm.
  evidence:
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, in humans, FBXO43 defects cause meiotic arrest within early diplotene of prophase I."
    explanation: Places the human arrest in early diplotene.
  - reference: PMID:28723571
    reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the absence of Emi2, spermatocytes arrest in early diplotene of prophase I."
    explanation: The knockout mouse arrests at the same stage as the human testis.
  - reference: PMID:28723571
    reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "indicating the inability of meiosis I chromosomes to undergo condensation and progress beyond diplotene in the absence of Emi2"
    explanation: Absent phospho-histone H3 shows chromosomes fail to condense at the arrest point.
- name: Meiotic Chromosome Missegregation
  description: >-
    Reported in one man with two C-terminal missense variants. His
    spermatocytes completed meiosis, but his sperm had a raised rate of
    aneuploidy on FISH, together with poor chromatin condensation and
    histone retention. The missegregation itself happens in the meiotic
    divisions of spermatocytes; it is observed as aneuploidy in the sperm.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: primary spermatocyte
    term:
      id: CL:0000656
      label: primary spermatocyte
  - preferred_term: sperm
    term:
      id: CL:0000019
      label: sperm
  biological_processes:
  - preferred_term: meiotic chromosome segregation
    modifier: DECREASED
    term:
      id: GO:0045132
      label: meiotic chromosome segregation
  downstream:
  - target: Macrozoospermia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors read the enlarged sperm heads, chromatin defects and
      aneuploidy together as signs of faulty meiotic division in the
      missense patient.
    evidence:
    - reference: PMID:42597893
      reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Together, these findings demonstrate that sperm from P1 exhibit a typical macrozoospermia phenotype accompanied by impaired nuclear maturation, defective chromatin condensation, and chromosome segregation errors, collectively indicating severe defects in meiotic progression and chromatin remodeling."
      explanation: Ties the macrozoospermia to chromosome segregation errors in the same patient.
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense variants (NM_001029860, p.Pro641Leu/p.Arg660Gln) in the macrozoospermia patient allowed completion of meiosis but led to severe sperm head enlargement, chromatin condensation defects, and markedly elevated aneuploidy, resulting in repeated ICSI failure."
    explanation: Missense alleles allow meiosis to finish but leave aneuploid sperm.
phenotypes:
- category: Reproductive
  name: Non-obstructive azoospermia
  description: >-
    No sperm in the ejaculate, caused by failed spermatogenesis. Seen with
    truncating FBXO43 genotypes.
  phenotype_term:
    preferred_term: Non-obstructive azoospermia
    term:
      id: HP:0011961
      label: Non-obstructive azoospermia
  evidence:
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous nonsense mutation in FBXO43 c.1747C > T:p.Gln583X in two NOA brothers from a Chinese consanguineous family via whole-exome sequencing"
    explanation: Two brothers homozygous for a nonsense allele had non-obstructive azoospermia.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations cause profound meiotic arrest and NOA"
    explanation: A second, unrelated proband with truncating variants had NOA.
- category: Reproductive
  name: Spermatocyte maturation arrest
  description: >-
    Testicular histology shows primary spermatocytes but no spermatids.
  phenotype_term:
    preferred_term: Spermatocyte maturation arrest
    term:
      id: HP:0031039
      label: Spermatocyte maturation arrest
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although primary spermatocytes were present, no spermatids were detected, consistent with a histological picture suggestive of meiotic arrest."
    explanation: Biopsy of the NOA proband showed arrest at the spermatocyte stage.
  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "spermatocytes were unable to complete meiotic divisions without FBXO43 in humans"
    explanation: Spermatocytes of the first family did not complete meiosis.
- category: Reproductive
  name: Macrozoospermia
  description: >-
    Large-headed sperm with poor chromatin condensation and raised
    aneuploidy, reported in one man with compound heterozygous missense
    variants. Repeated ICSI cycles gave one pregnancy, which miscarried.
  phenotype_term:
    preferred_term: Macrozoospermia
    term:
      id: HP:0025437
      label: Macrozoospermia
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proband P1 presented with macrozoospermia."
    explanation: Reports macrozoospermia in the missense proband.
- category: Reproductive
  name: Reduced progressive sperm motility
  description: >-
    Reported in the man with compound heterozygous missense variants, whose
    sperm concentration was within the reference range. Only 13.56% of his
    sperm were progressively motile.
  phenotype_term:
    preferred_term: Reduced progressive sperm motility
    term:
      id: HP:0034011
      label: Reduced progressive sperm motility
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of progressively motile sperm was only 13.56%, and the percentage of morphologically normal spermatozoa was 3.3%"
    explanation: Semen analysis of the missense proband shows reduced progressive motility.
- category: Reproductive
  name: Decreased testicular size
  description: >-
    Reported in the man with truncating variants and azoospermia, whose
    testes measured about 8-10 mL on each side.
  phenotype_term:
    preferred_term: Decreased testicular size

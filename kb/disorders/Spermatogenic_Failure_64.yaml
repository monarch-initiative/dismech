  - reference: PMID:34595750
    reference_title: "A homozygous loss-of-function mutation in FBXO43 causes human non-obstructive azoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FBXO43 was absent from testicular tissue of the proband, and FBXO43-immunostaining signals were invisible in the affected seminiferous tubules."
    explanation: Immunostaining shows no FBXO43 in patient tubules.
animal_models:
- name: Emi2 knockout mouse
  species: Mouse
  genotype: Emi2 (Fbxo43) null, exon 3 floxed and deleted
  publication: PMID:28723571
  description: >-
    Male and female knockouts are viable but sterile. Male germ-cell-specific
    deletion with Stra8-Cre gives the same sterility, so the defect is
    intrinsic to germ cells.
  modeled_mechanisms:
  - target: Meiotic Prophase I Arrest at Early Diplotene
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Knockout spermatocytes arrest in early diplotene, the stage reported in
      patient testis.
    limitations: >-
      A null allele models the truncating genotypes only. It says nothing
      about the missense alleles that let meiosis finish.
    evidence:
    - reference: PMID:28723571
      reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Male and female Emi2 knockout mice are viable but sterile, indicating that Emi2 is essential for meiosis but dispensable for embryonic development and mitotic cell divisions."
      explanation: Supports the knockout as a model of the meiotic defect.
  - target: Reduced Cdk1 Activity in Meiotic Prophase Spermatocytes
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: MOLECULAR
    description: >-
      The Cdk1 finding and its genetic rescue come only from this model.
    limitations: >-
      Cdk1 activity has not been measured in patient testis.
    evidence:
    - reference: PMID:28723571
      reference_title: "Emi2 Is Essential for Mouse Spermatogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This arrest is associated with decreased Cdk1 activity and was partially rescued by a knockin mouse model of elevated Cdk1 activity."
      explanation: The knockout shows the reduced Cdk1 activity, and the knockin rescue ties it to the arrest.
diagnosis:
- name: Semen analysis
  description: >-
    Repeated semen analysis separates the two presentations. Truncating
    genotypes give azoospermia, confirmed by finding no sperm in a centrifuged
    pellet. Missense genotypes give sperm in the ejaculate with poor motility
    and abnormal morphology, including macrozoospermia. Normal-looking counts
    do not predict reproductive outcome.
  diagnosis_term:
    preferred_term: semen analysis
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Azoospermia was diagnosed based on at least three independent semen analyses, with confirmation by the absence of spermatozoa after centrifugation and microscopic evaluation of semen pellets."
    explanation: Describes how azoospermia was established in the study.
- name: Whole-exome sequencing
  description: >-
    Finds the biallelic FBXO43 variants. All reported probands were
    identified by exome sequencing. The authors recommend including meiosis
    genes such as FBXO43 in the genetic workup of severe male infertility.
  diagnosis_term:
    preferred_term: whole-exome sequencing
    term:

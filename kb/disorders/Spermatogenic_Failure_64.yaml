treatments:
- name: ICSI with preimplantation genetic testing for aneuploidy
  description: >-
    Where sperm are present, as with missense genotypes, ICSI is possible,
    but in the one reported man repeated cycles failed and the only
    pregnancy miscarried, in line with his high sperm aneuploidy. The
    authors recommend preimplantation genetic testing for aneuploidy to
    select embryos. No therapy restores meiosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The macrozoospermia patient experienced repeated ICSI failure and early pregnancy loss, consistent with the high sperm aneuploidy detected in our study and prior reports"
    explanation: Reports the ICSI outcome in the missense proband.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the identified mutation-specific risks, preimplantation genetic testing for aneuploidy (PGT-A) is recommended for affected couples to improve embryo selection and optimize ART outcomes."
    explanation: The authors' recommendation for embryo selection; it is not a tested outcome.
- name: Donor sperm insemination
  description: >-
    For men with truncating genotypes, meiosis does not complete and
    endogenous sperm production is very unlikely, so donor sperm is the
    route to pregnancy. The man with truncating variants used donor-sperm
    insemination after biopsy showed meiotic arrest. The authors also
    suggest donor gametes where loss-of-function carriers have poor
    reproductive outcomes.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: donor sperm insemination
    term:
      id: NCIT:C16739
      label: Artificial Insemination
  evidence:
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings collectively indicated an extremely low likelihood of endogenous sperm production. The patient ultimately proceeded with donor-sperm insemination."
    explanation: The NOA proband with truncating variants used donor sperm.
  - reference: PMID:42597893
    reference_title: "Mutation Severity of FBXO43 Determines Spermatogenic Outcome and Informs Precision ART Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For carriers of loss-of-function variants with poor reproductive outcomes, donor gametes may be preferable."
    explanation: The authors' recommendation; it is not a tested outcome.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The effect is reproductive only. No systemic features have been reported
    in affected men. The cost is loss of biological fertility, and for men
    with sperm present, failed ICSI cycles and pregnancy loss.

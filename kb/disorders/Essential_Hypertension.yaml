- accession: geo:GSE288693
  title: Chromatin interaction maps of human arterioles reveal new mechanisms for the genetic regulation of blood pressure [RRBS]
  description: Arterioles are small blood vessels located just upstream of capillaries in nearly all tissues. The constriction and dilation of arterioles regulate tissue perfusion and are primary determinants of systemic blood pressure (BP). Abnormalities in arterioles are central to the development of major diseases such as hypertension, stroke, and microvascular complications of diabetes. Despite the broad and essential role of arterioles in physiology and disease, current knowledge of the functional genomics of arterioles is largely absent, partly because it is challenging to obtain and analyze human arteriole samples.

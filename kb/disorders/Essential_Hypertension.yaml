environmental:
- name: High Sodium Diet
  exposure_term:
    preferred_term: high dietary sodium chloride exposure
    modifier: INCREASED
    term:
      id: ECTO:9001347
      label: exposure to sodium chloride
  influences_mechanisms:
  - target: Immune and Inflammatory Activation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Pointed at immune and inflammatory activation rather than at vascular
      resistance, because that is where the cited sentences actually land: one
      names a high-salt environment among the contributors to immune
      activation in this disease, which is this node's own content. The second
      item is carried because it limits the first, recording that the
      mechanistic contribution of salt to blood-pressure sensitivity is not
      clearly understood, so the route beyond this node stays open. Only those
      two are carried. The salt-sensitivity prevalence figure sizes the
      susceptible population rather than arguing for this edge, so it stays on
      the exposure, where it already was.
    evidence:
    - reference: PMID:38172242
      reference_title: "Immune and inflammatory mechanisms in hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Neoantigens, the NLRP3 inflammasome and increased sympathetic outflow, as well as cytokines (including IL-6, IL-7, IL-15, IL-18 and IL-21) and a high-salt environment, can contribute to immune activation in hypertension."
      explanation: >-
        Names a high-salt environment alongside neoantigens, the NLRP3
        inflammasome, sympathetic outflow and several cytokines as
        contributors to immune activation in this disease. Exposure and node
        in one sentence.
    - reference: PMID:38164753
      reference_title: "Recent Advances in Understanding Peripheral and Gut Immune Cell-Mediated Salt-Sensitive Hypertension and Nephropathy."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Moreover, high-salt intake is associated with gut dysbiosis, leading to inflammation, oxidative stress, and blood pressure elevation but the mechanistic contribution to salt-sensitivity of blood pressure is not clearly understood."
      explanation: >-
        Associates high salt intake with gut dysbiosis, inflammation and
        oxidative stress, while stating outright that the mechanistic
        contribution to salt sensitivity of blood pressure is not clearly
        understood. Carried as the bound on the claim.
  notes: Major modifiable risk factor
  evidence:
  - reference: PMID:38164753
    reference_title: "Recent Advances in Understanding Peripheral and Gut Immune Cell-Mediated Salt-Sensitive Hypertension and Nephropathy."
    supports: SUPPORT
    snippet: "Approximately 50% of hypertensive and 25% of normotensive people exhibit
      salt sensitivity of blood pressure, which is an independent risk factor for
      cardiovascular disease."
    explanation: This establishes high salt intake as a major environmental risk
      factor driving salt-sensitive hypertension.
  - reference: PMID:38164753
    reference_title: "Recent Advances in Understanding Peripheral and Gut Immune Cell-Mediated Salt-Sensitive Hypertension and Nephropathy."
    supports: SUPPORT
    snippet: "Moreover, high-salt intake is associated with gut dysbiosis, leading
      to inflammation, oxidative stress, and blood pressure elevation but the mechanistic
      contribution to salt-sensitivity of blood pressure is not clearly understood."
    explanation: This describes how high salt intake promotes hypertension
      through immune and inflammatory mechanisms.
  - reference: PMID:38172242
    reference_title: "Immune and inflammatory mechanisms in hypertension."
    supports: SUPPORT
    snippet: "Neoantigens, the NLRP3 inflammasome and increased sympathetic outflow,
      as well as cytokines (including IL-6, IL-7, IL-15, IL-18 and IL-21) and a high-salt
      environment, can contribute to immune activation in hypertension."
    explanation: This confirms high-salt environment contributes to immune
      activation driving hypertension.
- name: Obesity
  influences_mechanisms:
  - target: Immune and Inflammatory Activation
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Graded below the sodium link into this same node, and the difference is
      in the sentences rather than in the biology. The salt link has a
      sentence naming salt as a contributor to immune activation; this one has
      a sentence saying only that these mechanisms link the disease with
      obesity among several other conditions, which asserts co-membership
      without a direction or a route. Recorded as modulating rather than
      predisposing for exactly that reason: the field would support
      predisposing, but nothing carried here states a direction, and the
      predicate should not assert what the evidence beneath it does not.
    evidence:
    - reference: PMID:38172242
      reference_title: "Immune and inflammatory mechanisms in hypertension."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "These mechanisms link hypertension with obesity, autoimmunity, periodontitis and COVID-19."
      explanation: >-
        States that these mechanisms link the disease with obesity,
        autoimmunity, periodontitis and COVID-19. A list of things connected
        to the same mechanisms, which does not say what obesity does to this
        node.
  notes: Strong association with elevated blood pressure
  evidence:
  - reference: PMID:38172242
    reference_title: "Immune and inflammatory mechanisms in hypertension."
    supports: SUPPORT
    snippet: "These mechanisms link hypertension with obesity, autoimmunity, periodontitis
      and COVID-19."
    explanation: This confirms obesity is mechanistically linked to hypertension
      through shared inflammatory pathways.

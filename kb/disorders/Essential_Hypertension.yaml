    term:
      id: ECTO:0001082
      label: exposure to alcohol consumption
  notes: >-
    Excessive intake raises blood pressure. Bound to ECTO:0001082 (exposure to
    alcohol consumption, which involves the NCIT behaviour class) rather than
    ECTO:9000027 (exposure to ethanol, which involves CHEBI ethanol) because the
    claim here is about intake quantity as a behaviour, with no ethanol chemistry

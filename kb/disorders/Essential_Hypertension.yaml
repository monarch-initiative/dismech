  evidence:
  - reference: PMID:34762198
    reference_title: "The Effect of Alcohol on Blood Pressure and Hypertension."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "chronic consumption of alcoholic beverages was associated with a high incidence of hypertension in men and women"
    explanation: A meta-analysis found chronic alcohol consumption associated with a high incidence of hypertension, supporting excessive intake as a risk factor.
treatments:
- name: ACE Inhibitors
  description: Block angiotensin-converting enzyme to reduce vasoconstriction
    and sodium retention.
  evidence:
  - reference: PMID:39765782
    reference_title: "Oxidative Stress in Kidney Injury and Hypertension."
    supports: PARTIAL
    snippet: "Managing blood pressure (BP) effectively with treatments targeting RAAS
      activation, oxidative stress, and inflammation is crucial in preventing renal
      damage and the progression of HTN-related CKD and ESRD."
    explanation: Supports RAAS-targeting treatment strategy in general, but does
      not directly name ACE inhibitors.
  - reference: PMID:40985288
    reference_title: "Targets for treatment and optimal strategies for managing hypertension in 2025: indications for clinical practice from recent hypertension guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are few discrepancies in recommended treatment classes, with all guidelines endorsing angiotensin-converting enzyme inhibitors, angiotensin receptor blockers, calcium channel blockers, and thiazide-type diuretics as first-line therapy."
    explanation: A 2025 synthesis of recent international hypertension guidelines endorses ACE inhibitors among the four first-line antihypertensive drug classes.
- name: Angiotensin Receptor Blockers
  description: Block AT1 receptors to reduce RAAS effects.
  evidence:

notes: >-
  Subtype numbering. MONDO:0008009 has exactly three children, and each is
  defined by one type II hair keratin in its OWL axioms: monilethrix-1 by
  KRT86, monilethrix-2 by KRT81, monilethrix-3 by KRT83. The numbering is
  OMIM's - the three classes are recorded as equivalent to OMIM 158000,
  621169 and 621170 respectively, so monilethrix-1 is the original monilethrix
  MIM entry rather than a new split. Read from the MONDO records through OLS.
  MONDO:0008009 is the right anchor for this entry because the entry models
  the whole disease rather than one gene's form, and every subtype row here
  sits inside it.

  Two causal genes have no subtype row, for different reasons. KRT31 has no
  MONDO class at all: `runoak -i ols:mondo search` returned nothing for
  "KRT31", "keratin 31", "KRTHA1" or "monilethrix-4" on 2026-09-26. DSG4 does
  have a class, but MONDO places it outside monilethrix - MONDO:0011932
  hypotrichosis 6 (LAH1), under hypotrichosis simplex, whose synonyms include
  "monilethrix-like hypotrichosis" and whose axiom gene is DSG4. The
  dermatology literature calls that entity autosomal recessive monilethrix,
  which is the divergence; MONDO's placement is defensible, since the DSG4
  route fails desmosomal adhesion rather than keratin assembly, and that is the
  same reason this entry does not model it. It is recorded as a related match
  so the class stays in the curation queue and could become its own entry.

  Monilethrix is the hair-cortex conformer of
  `keratin_intermediate_filament_fragility`. The module names KRT81/KRT83/KRT86
  as a substitutable trigger; this entry supplies the worked example.

  Two things about the conformance are deliberately partial and should not be
  "tidied". First, the module's effector node is cytolysis, and monilethrix does
  not lyse cells - the hair shaft is already dead and keratinized when it fails
  - so the entry conforms at the trigger and resilience nodes only. Second, a
  recessive DSG4-associated form of monilethrix exists that reaches the same
  beaded-hair phenotype through desmoglein-4 rather than keratin failure; that
  route belongs mechanistically with `desmosomal_adhesion_failure` and is not
  curated in this entry's pathophysiology, which models the dominant
  keratin-associated disease only.

  One cited report describes a Venezuelan kindred with digenic changes - a
  KRT86 variant with a KRT81 variant of unknown significance. This entry does
  not curate digenic inheritance, because a variant of unknown significance is
  not evidence of a second required locus.

  Three pharmacological options reported for monilethrix are deliberately not
  curated as treatments: oral acitretin, minoxidil (topical and oral), and oral
  N-acetylcysteine. Each rests on case reports or small series with
  inconsistent, frequently non-sustained response - one cited report describes
  slight improvement on N-acetylcysteine at two months that did not progress -
  which is below the bar this knowledge base applies to a treatment claim. They
  are named in the supportive-care description so the omission reads as a
  judgement rather than an oversight.

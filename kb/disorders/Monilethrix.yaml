diagnosis:
- name: Trichoscopy
  diagnosis_term:
    preferred_term: dermoscopy
    term:
      id: NCIT:C116478
      label: Dermoscopy
  description: >-
    Trichoscopy is the diagnostic test of choice and is close to pathognomonic:
    it shows uniform elliptical nodosities separated by regular constrictions
    along the shaft. It has largely replaced light microscopy, which requires
    plucking multiple hairs, and it can be done at the bedside on hair in situ.
  results: >-
    Uniform elliptical nodosities with intermittent constrictions.
  evidence:
  - reference: PMID:30201151
    reference_title: "Trichoscopy in Hair Shaft Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In monilethrix, trichoscopy shows uniform elliptical nodosities with intermittent constrictions.
    explanation: >-
      States the monilethrix trichoscopic finding directly.
  - reference: PMID:30201151
    reference_title: "Trichoscopy in Hair Shaft Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Trichoscopy allows analyzing the structure and size of growing hair shafts in their natural environment in children and adults. The method replaces light microscopy, which requires pulling of multiple hairs for investigation.
    explanation: >-
      Supports trichoscopy as the preferred modality over light microscopy,
      which is the practical reason it is listed first here.

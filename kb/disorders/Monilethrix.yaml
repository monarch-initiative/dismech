treatments:
- name: Supportive Hair Care and Trauma Avoidance
  description: >-
    No specific therapy corrects the keratin defect. Because breakage is
    mechanical, gentle hair care and avoidance of physical and chemical trauma
    are the mainstay. Reported pharmacological trials have been small and their
    benefit inconsistent.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

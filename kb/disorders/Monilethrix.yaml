    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Cortical Keratin Network Collapse
    description: >-
      The variant chain is incorporated into the cortical keratin network and
      disrupts its assembly.
  evidence:
  - reference: PMID:25557232
    reference_title: "Novel KRT83 and KRT86 mutations associated with monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monilethrix is an autosomal dominant hair disorder caused by mutations in the hard keratins KRT81, KRT83 and KRT86.
    explanation: >-
      Establishes hair-cortex keratin variants as the causal lesion.
  - reference: PMID:25557232
    reference_title: "Novel KRT83 and KRT86 mutations associated with monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in KRT81 and KRT86 are the most common.
    explanation: >-
      Records the relative contribution of the three causal keratin genes.
  - reference: PMID:39026424
    reference_title: "A nonsense variant in KRT31 is associated with autosomal dominant monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study is the first to identify pathogenic variants in KRT31 as a cause of autosomal dominant monilethrix.
    explanation: >-
      Adds the type I hair keratin KRT31 to the set of genes whose variants
      produce this lesion, which is why KRT31 is bound among this node's genes.
  - reference: PMID:39026424
    reference_title: "A nonsense variant in KRT31 is associated with autosomal dominant monilethrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting demonstrated that when co-expressed with its binding partner keratin 85, the truncated keratin 31 was still expressed, albeit less abundantly than the wildtype protein.
    explanation: >-
      Cell-culture co-expression shows the truncated chain is produced rather
      than degraded, which is the condition a dominant-negative lesion requires
      and the basis for the statement in this node's description.
- name: Cortical Keratin Network Collapse
  conforms_to: "keratin_intermediate_filament_fragility#Keratin Filament Network Collapse and Aggregation"
  biological_scale: CELLULAR
  description: >-
    The mutant hard-keratin chain is incorporated into the obligate
    type-I/type-II heterodimer of the hair cortex, so filament assembly is
    disrupted throughout the network rather than in the mutant protein alone.
    This is the dominant-negative step, and it is what makes a single variant
    allele sufficient.
  cell_types:
  - preferred_term: hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: keratin filament
    term:
      id: GO:0045095
      label: keratin filament
  downstream:
  - target: Defective Keratin Assembly in the Hair Shaft Cortex
    description: >-
      A disrupted network cannot build a mechanically sound cortex.
  evidence:
  - reference: PMID:25557232
    reference_title: "Novel KRT83 and KRT86 mutations associated with monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monilethrix is an autosomal dominant hair disorder caused by mutations in the hard keratins KRT81, KRT83 and KRT86.
    explanation: >-
      Establishes that the causal proteins are hard keratins, which assemble as
      obligate heterodimers and so admit the dominant-negative mechanism this
      node asserts.
  notes: >-
    Dominant-negative incorporation is inferred here from the autosomal dominant
    inheritance of missense alleles in obligate-heterodimer keratins, by analogy
    with the well-demonstrated epidermal keratinopathies. The cited source is
    not offered as a direct demonstration of network collapse in hair cortex.
- name: Defective Keratin Assembly in the Hair Shaft Cortex
  conforms_to: "keratin_intermediate_filament_fragility#Loss of Keratinocyte Mechanical Resilience"
  biological_scale: CELLULAR
  description: >-
    The cortical keratin network of the developing hair shaft is assembled
    abnormally, so the shaft loses the mechanical resilience that its densely
    packed keratin filaments normally provide. Unlike the epidermal
    keratinopathies, the affected cells are not lysed in a living tissue plane -
    the hair shaft is already a dead, keratinized structure - so the mechanical
    failure presents as fracture of a structure rather than as cytolysis and
    blistering.
  cell_types:
  - preferred_term: hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: ABNORMAL
  locations:
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Periodic Shaft Narrowing and Hair Fragility
    description: >-
      A mechanically incompetent cortex yields a shaft that thins periodically
      and fractures at the thinned points.
  evidence:
  - reference: PMID:25557232
    reference_title: "Novel KRT83 and KRT86 mutations associated with monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected hairs are fragile and break easily
    explanation: >-
      Documents the loss of mechanical resilience in the affected structure. The
      quote is deliberately truncated before the source's phrase "leading to
      scarring alopecia": monilethrix alopecia is NON-scarring, because the hair
      fractures above a preserved follicle, and quoting that clause would have
      the entry cite a claim its own phenotype description refutes.
  notes: >-
    Conformance here is declared against the keratin module's central effector,
    but the module's node is written for keratinocytes and its effector node
    speaks of cytolysis. Monilethrix reaches mechanical failure without
    cytolysis because the failing structure is already dead and keratinized.
    That is a genuine partial mismatch and is recorded rather than papered over:
    the entry conforms to the module's trigger and resilience nodes and
    deliberately does NOT conform to its cytolysis node.
- name: Periodic Shaft Narrowing and Hair Fragility
  biological_scale: TISSUE
  description: >-
    The hair shaft develops regular, periodic constrictions alternating with
    normal-calibre nodes, giving the beaded or necklace-like appearance on
    microscopy that is diagnostic. The internodal constrictions are the
    mechanically weak points, and the shaft fractures there.
  locations:
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Beaded Fragile Hair
    description: >-
      The alternation of normal-calibre nodes with internodal constrictions is
      what presents clinically as beaded, easily broken hair.
  - target: Patchy Dystrophic Alopecia
    description: >-
      Hair that fractures close to the scalp cannot achieve length, so alopecia
      results despite normal follicular density.
  - target: Follicular Hyperkeratosis
    description: >-
      The same follicles show keratotic plugging, a claim about follicular
      keratinization rather than about shaft fracture and therefore modelled
      separately.
  evidence:
  - reference: PMID:30969635
    reference_title: "Monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is characterized by a regular, periodic thinning of the hair shaft, leading to a characteristic beaded appearance of the hair
    explanation: >-
      Documents the periodic shaft narrowing that defines this node and gives
      the disorder its name.
- name: Patchy Dystrophic Alopecia
  biological_scale: ORGANISM
  description: >-
    Hair that breaks before it can grow long, producing patchy alopecia most
    marked at sites of friction such as the occiput. The alopecia is
    non-scarring: the shaft fractures above a preserved follicle, so follicular
    density is normal and regrowth occurs whenever a shaft survives. Severity
    ranges from near-complete alopecia to changes mild enough to be missed.
  biological_processes:
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: ABNORMAL
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:30969635
    reference_title: "Monilethrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      monilethrix is a rare structural hair shaft disorder characterized by hair fragility and resulting in patchy dystrophic alopecia
    explanation: >-
      Documents the alopecia endpoint and attributes it to shaft fragility
      rather than to follicular loss.
- name: Follicular Hyperkeratosis
  biological_scale: TISSUE
  description: >-
    Keratotic follicular papules, characteristically on the nape of the neck and
    the extensor surfaces of the limbs. This is a follicular keratinization
    abnormality rather than a consequence of shaft fracture, and it is present
    in many but not all affected individuals.
  biological_processes:

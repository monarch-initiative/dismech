    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Defective Keratin Assembly in the Hair Shaft Cortex
    description: >-
      The variant chain is incorporated into the cortical keratin network and
      disrupts its assembly.
  evidence:
  - reference: PMID:25557232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monilethrix is an autosomal dominant hair disorder caused by mutations in the hard keratins KRT81, KRT83 and KRT86.
    explanation: >-
      Establishes hair-cortex keratin variants as the causal lesion.
  - reference: PMID:25557232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in KRT81 and KRT86 are the most common.
    explanation: >-
      Records the relative contribution of the three causal keratin genes.
- name: Defective Keratin Assembly in the Hair Shaft Cortex
  conforms_to: "keratin_intermediate_filament_fragility#Loss of Keratinocyte Mechanical Resilience"
  biological_scale: CELLULAR
  description: >-
    The cortical keratin network of the developing hair shaft is assembled
    abnormally, so the shaft loses the mechanical resilience that its densely
    packed keratin filaments normally provide. Unlike the epidermal
    keratinopathies, the affected cells are not lysed in a living tissue plane -
    the hair shaft is already a dead, keratinized structure - so the mechanical
    failure presents as fracture of a structure rather than as cytolysis and
    blistering.
  cell_types:
  - preferred_term: hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  biological_processes:
  - preferred_term: intermediate filament organization
    term:
      id: GO:0045109
      label: intermediate filament organization
    modifier: ABNORMAL
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: ABNORMAL
  locations:
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Periodic Shaft Narrowing and Hair Fragility
    description: >-
      A mechanically incompetent cortex yields a shaft that thins periodically
      and fractures at the thinned points.
  evidence:
  - reference: PMID:25557232
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected hairs are fragile and break easily, leading to scarring alopecia.
    explanation: >-
      Documents the loss of mechanical resilience in the affected structure and
      its immediate consequence.
  notes: >-
    Conformance here is declared against the keratin module's central effector,
    but the module's node is written for keratinocytes and its effector node
    speaks of cytolysis. Monilethrix reaches mechanical failure without
    cytolysis because the failing structure is already dead and keratinized.
    That is a genuine partial mismatch and is recorded rather than papered over:
    the entry conforms to the module's trigger and resilience nodes and
    deliberately does NOT conform to its cytolysis node.
- name: Periodic Shaft Narrowing and Hair Fragility
  biological_scale: TISSUE
  description: >-
    The hair shaft develops regular, periodic constrictions alternating with
    normal-calibre nodes, giving the beaded or necklace-like appearance on
    microscopy that is diagnostic. The internodal constrictions are the
    mechanically weak points, and the shaft fractures there.
  locations:
  - preferred_term: hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  downstream:
  - target: Patchy Dystrophic Alopecia and Follicular Hyperkeratosis
    description: >-
      Hair that fractures close to the scalp cannot achieve length, so alopecia
      results despite normal follicular density.
  evidence:
  - reference: PMID:30969635
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is characterized by a regular, periodic thinning of the hair shaft, leading to a characteristic beaded appearance of the hair
    explanation: >-
      Documents the periodic shaft narrowing that defines this node and gives
      the disorder its name.
- name: Patchy Dystrophic Alopecia and Follicular Hyperkeratosis
  biological_scale: ORGANISM
  description: >-
    Clinically the disease presents as patchy dystrophic alopecia - hair that
    breaks before it can grow long, most marked at sites of friction such as the
    occiput - accompanied in many patients by follicular hyperkeratosis on the
    nape of the neck and the extensor surfaces of the limbs. Severity ranges
    from near-complete alopecia to changes mild enough to be missed.
  biological_processes:
  - preferred_term: keratinization
    term:

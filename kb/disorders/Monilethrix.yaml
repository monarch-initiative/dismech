pathophysiology:
- name: Dominant-Negative Hair Cortex Keratin Variant
  conforms_to: "keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament Assembly Domain"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant in one of the hair-cortex keratins KRT81, KRT83 or
    KRT86 alters a residue required for keratin filament assembly. KRT81 and
    KRT86 variants are the most commonly reported. These are the same class of
    filament-assembly lesion that produces epidermolysis bullosa simplex and
    pachyonychia congenita in other keratin pairs; what differs is the tissue in
    which the affected pair is expressed.

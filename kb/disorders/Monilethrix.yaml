- name: Patchy Dystrophic Alopecia
  biological_scale: ORGANISM
  description: >-
    Hair that breaks before it can grow long, producing patchy alopecia most
    marked at sites of friction such as the occiput. The alopecia is
    non-scarring: the shaft fractures above a preserved follicle, so follicular
    density is normal and regrowth occurs whenever a shaft survives. Severity
    ranges from near-complete alopecia to changes mild enough to be missed.
  biological_processes:

name: Monilethrix
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Monilethrix is a rare autosomal dominant hair shaft dysplasia caused by
  heterozygous variants in the hair-cortex ("hard") keratins KRT81, KRT83 and
  KRT86. It is the hair-follicle instance of the keratinopathy mechanism:
  a dominant-negative variant in a keratin filament-assembly domain collapses
  the keratin network, but because these keratins are expressed in the hair
  shaft cortex rather than in epidermis, the fragile structure produced is a
  hair rather than a skin layer. The shaft develops a regular periodic
  narrowing that gives it a beaded, necklace-like appearance - the name is from
  Latin monile, necklace, and Greek thrix, hair - and fractures at the
  internodes, so hair breaks close to the scalp and patchy dystrophic alopecia
  results. Follicular hyperkeratosis on the nape and extensor surfaces is a
  frequent associated finding. A recessive form caused by DSG4 variants exists
  and reaches the same hair-shaft phenotype through desmosomal rather than
  keratin failure.

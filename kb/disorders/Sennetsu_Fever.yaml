prevalence:
- population: Lao blood donors and patients with fever, hepatitis, or jaundice
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  rate_per_100000: 17000.0
  notes: >-
    Reported as 17% IgG anti-N. sennetsu seropositivity in a 1,132-person Lao
    cohort; this is an antibody-frequency estimate across blood donors and
    symptomatic patients, not prevalence of acute Sennetsu fever.
  evidence:
  - reference: PMID:19635868
    reference_title: "Sennetsu neorickettsiosis: a probable fish-borne cause of fever rediscovered in Laos."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lao blood donors and patients with fever, hepatitis, or jaundice (N =
      1,132) had a high prevalence (17%) of immunofluorescence assay IgG
      anti-N. sennetsu antibodies compared with 4% and 0% from febrile patients
      (N = 848) in Thailand and Malaysia, respectively.
    explanation: >-
      Source of the 17% Lao IgG seroprevalence estimate; the record is kept as
      measure_type UNKNOWN because the denominator combines blood donors and
      febrile, hepatitis, or jaundice patients rather than a defined population
      prevalence of acute illness.
- population: Malaysian patients with fever of unknown origin
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  rate_per_100000: 29000.0
  notes: >-
    Reported as 29% IFA seropositivity in a 200-person febrile cohort from
    multiple Malaysian regions; this is a serologic cohort finding, not a
    general-population prevalence estimate.
  evidence:
  - reference: PMID:2985504
    reference_title: "Adaptation of Ehrlichia sennetsu to canine blood monocytes: preliminary structural and serological studies with cell culture-derived Ehrlichia sennetsu."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, 29% of the serum samples obtained from 200 patients having a
      fever of unknown origin and residing in various regions of Malaysia were
      also serologically positive.
    explanation: >-
      Source of the 29% seropositivity estimate in Malaysian patients with
      fever of unknown origin.

diagnosis:
- name: Blood PCR and Indirect Immunofluorescence
  description: >-
    Sennetsu fever can be confirmed molecularly by PCR or sequencing from buffy
    coat DNA and epidemiologically by IFA serology against N. sennetsu antigen.
  evidence:
  - reference: PMID:19635868
    reference_title: "Sennetsu neorickettsiosis: a probable fish-borne cause of fever rediscovered in Laos."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A buffy coat from 1 of 91 patients with undifferentiated fever was
      positive by 16S rRNA amplification and sequencing and real-time polymerase
      chain reactions (PCR) targeting two N. sennetsu genes.
    explanation: >-
      Human molecular confirmation from buffy coat supports PCR-based
      diagnosis of acute Sennetsu fever.
  - reference: PMID:2985504
    reference_title: "Adaptation of Ehrlichia sennetsu to canine blood monocytes: preliminary structural and serological studies with cell culture-derived Ehrlichia sennetsu."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The antigen derived from our E. sennetsu cultures was used to develop an
      indirect fluorescent antibody test for detection and titration of serum
      antibodies to the organism.
    explanation: >-

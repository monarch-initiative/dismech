      label: symbiont entry into host cell
  downstream:
  - target: Neorickettsia Vacuolar Persistence
    causal_link_type: DIRECT
    description: >-
      Entry into mononuclear phagocytes creates the intracellular vacuolar
      compartment in which Neorickettsia survives.
  evidence:
  - reference: PMID:20833807
    reference_title: Proteomic analysis of Neorickettsia sennetsu surface-exposed proteins and porin activity of the major surface protein P51.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Neorickettsia sennetsu is an obligate intracellular bacterium of
      monocytes and macrophages and is the etiologic agent of human Sennetsu
      neorickettsiosis.
    explanation: >-
      Supports the monocyte-macrophage host-cell tropism curated for the entry
      step.

- name: Neorickettsia Vacuolar Persistence
  biological_scale: CELLULAR
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  description: >-
    N. sennetsu persists inside host membrane-bound vacuoles rather than in the
    extracellular space, placing the pathogen behind the host plasma membrane
    and endosomal membrane as it grows in small morula-like vacuoles.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  - preferred_term: phagosome maturation
    modifier: DECREASED
    term:
      id: GO:0090382
      label: phagosome maturation
  downstream:
  - target: IRP1 Transferrin-Receptor Iron Piracy
    causal_link_type: DIRECT
    description: >-
      Vacuolar N. sennetsu colocalizes with host transferrin receptors and
      redirects iron uptake.
  - target: Neorickettsia Ribosomal Translation (Tetracycline Target)
    causal_link_type: DIRECT
    description: >-
      Intracellular N. sennetsu remains dependent on bacterial ribosomal
      translation while replicating in host cells.
  - target: Cell-Penetrant Antimicrobial Requirement
    description: >-
      Vacuolar intracellular replication forces antimicrobial therapy to enter
      host cells.
  evidence:
  - reference: PMID:1884777
    reference_title: Biology of ehrlichiae.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      unlike rickettsiae, ehrlichiae and chlamydiae multiply in the phagosome
      of their host cells
    explanation: >-
      Review synthesis supports phagosomal growth as the general intracellular
      niche of the historically defined ehrlichial group that included E.
      sennetsu.
  - reference: PMID:9511829
    reference_title: Ultrastructural differentiation of the genogroups in the genus Ehrlichia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      E. sennetsu-E. risticii group usually developed in small individual
      vacuoles that did not fuse with each other and divided along with the
      ehrlichiae.
    explanation: >-
      Ultrastructural comparison of E. sennetsu in culture supports small
      vacuoles as the organism-specific intracellular compartment.

- name: IRP1 Transferrin-Receptor Iron Piracy
  biological_scale: CELLULAR
  description: >-
    E. sennetsu infection activates iron-responsive protein 1, stabilizes
    transferrin-receptor mRNA, and accumulates transferrin receptors around
    organism-containing inclusions to increase iron delivery for intracellular
    bacterial growth.
  biological_processes:
  - preferred_term: iron ion transport
    modifier: INCREASED
    term:
      id: GO:0006826
      label: iron ion transport
  - preferred_term: intracellular iron ion homeostasis
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
  downstream:
  - target: Neorickettsia Morula Expansion
    causal_link_type: DIRECT
    description: >-
      Acquired host-cell iron supports expansion of the intracellular
      Neorickettsia population.
  evidence:
  - reference: PMID:10225882
    reference_title: "Ehrlichia chaffeensis and E. sennetsu, but not the human granulocytic ehrlichiosis agent, colocalize with transferrin receptor and up-regulate transferrin receptor mRNA by activating iron-responsive protein 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transferrin receptors (TfRs) accumulated on both E. chaffeensis and E.
      sennetsu, but not HGE agent, inclusions in THP-1 cells or the cells of
      the promyelocytic leukemia cell line HL-60.
    explanation: >-
      Infected human leukocyte cell lines show transferrin receptors
      accumulating on E. sennetsu inclusions, directly supporting the
      transferrin-receptor recruitment step.
  - reference: PMID:10225882
    reference_title: "Ehrlichia chaffeensis and E. sennetsu, but not the human granulocytic ehrlichiosis agent, colocalize with transferrin receptor and up-regulate transferrin receptor mRNA by activating iron-responsive protein 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This result suggests that activation of IRP-1 and subsequent
      stabilization of TfR mRNA comprise the mechanism of TfR mRNA
      up-regulation by E. chaffeensis and E. sennetsu infection.
    explanation: >-
      The same study ties E. sennetsu infection to IRP1 activation and
      transferrin-receptor mRNA stabilization.

- name: Neorickettsia Morula Expansion
  biological_scale: CELLULAR
  description: >-
    Iron-supported N. sennetsu organisms proliferate within cytoplasmic
    vacuoles, forming bacterial microcolonies that expand the infected
    mononuclear phagocyte compartment.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Lymphoreticular Inflammatory Syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Expansion in mononuclear phagocytes disseminates infection into the
      spleen, lymph nodes, blood, and other lymphoreticular tissues.
  evidence:
  - reference: PMID:6274798
    reference_title: "Rickettsia sennetsu in human blood monocyte cultures: similarities to the growth cycle of Ehrlichia canis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Microscopic examination of cultured human monocytes infected with
      Rickettsia sennetsu and stained by the Giemsa method revealed the
      presence of various organismal growth forms in the cytoplasm of the
      infected cells.
    explanation: >-
      Human monocyte culture evidence directly supports intracellular growth of
      the historical R. sennetsu organism in the target leukocyte lineage.
  - reference: PMID:1165122
    reference_title: Effect of cyclophosphamide on the growth of Rickettsia sennetsu in experimentally infected mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the drug-treated mice, infective titers expressed as mean lethal dose
      in the spleens reached 10(8,5)
    explanation: >-
      Mouse infection quantified splenic growth of the historical R.
      sennetsu organism and showed that the spleen can carry high organism
      titers under immunosuppression.


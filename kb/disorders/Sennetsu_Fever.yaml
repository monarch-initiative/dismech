    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All presented with fever and headache without focal signs of infection
    explanation: >-
      The hospital screening study identified headache in each of its four
      sequence-confirmed Lao Sennetsu cases.


        monocyte-macrophage lineage, supporting Harrison's infectious-diseases
        classification.
infectious_agent:
- name: Neorickettsia sennetsu
  description: >-
    Obligate intracellular Anaplasmataceae bacterium, historically classified
    as Ehrlichia sennetsu and reclassified into Neorickettsia by 16S rRNA and
    groESL phylogenetics.
  infectious_agent_term:
    preferred_term: Neorickettsia sennetsu
    term:
      id: NCBITaxon:951
      label: Ehrlichia sennetsu
  evidence:
  - reference: PMID:20833807
    reference_title: Proteomic analysis of Neorickettsia sennetsu surface-exposed proteins and porin activity of the major surface protein P51.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Neorickettsia sennetsu is an obligate intracellular bacterium of
      monocytes and macrophages and is the etiologic agent of human Sennetsu
      neorickettsiosis.
    explanation: >-
      Identifies N. sennetsu as the infectious agent and establishes its
      obligately intracellular monocyte-macrophage niche.
  - reference: PMID:11760958
    reference_title: "Reorganization of genera in the families Rickettsiaceae and Anaplasmataceae in the order Rickettsiales: unification of some species of Ehrlichia with Anaplasma, Cowdria with Ehrlichia and Ehrlichia with Neorickettsia, descriptions of six new species combinations and designation of Ehrlichia equi and 'HGE agent' as subjective synonyms of Ehrlichia phagocytophila."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the genus Neorickettsia should be emended to include Neorickettsia
      (Ehrlichia) risticii comb. nov. and Neorickettsia (Ehrlichia) sennetsu
      comb. nov.
    explanation: >-
      Taxonomic revision evidence supports using the modern genus
      Neorickettsia while binding the NCBITaxon term that still carries the
      older Ehrlichia sennetsu label.
transmission:
- name: Probable raw-fish and trematode-metacercaria transmission
  description: >-
    Human Sennetsu fever is probably acquired by eating raw or undercooked fish
    that contain digenean flukes carrying Neorickettsia. The fish link is
    supported by detection of N. sennetsu DNA in food fish from Laos, and the
    trematode link is supported by Neorickettsia localization in digenean life
    stages, but the exact fish-fluke-human chain is still inferred rather than
    experimentally closed.
  evidence:
  - reference: PMID:19635868
    reference_title: "Sennetsu neorickettsiosis: a probable fish-borne cause of fever rediscovered in Laos."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We found N. sennetsu DNA by PCR, for the first time, in a fish (Anabas
      testudineus).
    explanation: >-
      Human serology and PCR from the same Laos study are supported by direct
      molecular detection of N. sennetsu DNA in a consumed fish species,
      anchoring the inferred fish-borne route.
  - reference: PMID:26873314
    reference_title: "Germs within Worms: Localization of Neorickettsia sp. within Life Cycle Stages of the Digenean Plagiorchis elegans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neorickettsia spp. are bacterial endosymbionts of parasitic flukes
      (Digenea) that also have the potential to infect and cause disease (e.g.,
      Sennetsu fever) in the vertebrate hosts of the fluke.
    explanation: >-
      Fluke-life-cycle microscopy supports the digenean reservoir and delivery
      model that makes infected metacercariae in fish a plausible human
      exposure vehicle.
pathophysiology:
- name: Raw-Fish Neorickettsia Exposure
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Raw or undercooked fish contaminated with N. sennetsu-bearing trematode
    metacercariae is the suspected dietary exposure that initiates human
    Sennetsu fever.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Monocyte-Macrophage Neorickettsia Entry
    causal_link_type: DIRECT
    description: >-
      Ingested organisms reach permissive mononuclear phagocytes and begin the
      intracellular infection.
  evidence:
  - reference: PMID:19635868
    reference_title: "Sennetsu neorickettsiosis: a probable fish-borne cause of fever rediscovered in Laos."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that sennetsu may be an under-recognized cause of
      fever and are consistent with the hypothesis that it may be contracted
      from eating raw fish.
    explanation: >-
      Human PCR/serology paired with fish PCR supports, but does not by itself
      prove, raw fish ingestion as the entry exposure for Sennetsu fever.

- name: Monocyte-Macrophage Neorickettsia Entry
  biological_scale: CELLULAR
  description: >-
    N. sennetsu enters monocytes and macrophages, the leukocyte lineage in
    which this obligate intracellular organism establishes its replicative
    niche.
  cell_types:

  - target: Lymphadenopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hepatomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Splenomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Atypical Lymphocytes
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:1889044
    reference_title: The tribe Ehrlichieae and ehrlichial diseases.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      members of the tribe Ehrlichieae reside primarily in the cytoplasmic
      vacuoles of monocytes or granulocytes and cause hematologic
      abnormalities, lymphadenopathy, and other pathologic changes in the host
    explanation: >-
      Broad ehrlichial review synthesis links leukocyte vacuolar infection to

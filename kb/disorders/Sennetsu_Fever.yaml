- name: Neorickettsia Ribosomal Translation (Tetracycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
    Ribosome
  description: >-
    N. sennetsu uses bacterial mRNA translation to synthesize proteins needed
    for intracellular replication; tetracyclines exploit this bacterial
    ribosome vulnerability.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation

- name: Cell-Penetrant Antimicrobial Requirement
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    intracellular_pathogen_persistence#Requirement for Cell-Penetrant
    Antimicrobials
  description: >-
    Because the replicating organism is vacuolar and intracellular, effective
    antimicrobials must reach bacteria inside infected leukocytes.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic

phenotypes:
- name: Fever
  description: >-
    Acute febrile illness is the defining symptomatic presentation of Sennetsu
    fever.
  phenotype_term:
    preferred_term: fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:19635868
    reference_title: "Sennetsu neorickettsiosis: a probable fish-borne cause of fever rediscovered in Laos."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The disease was characterized by fever, weakness, anorexia, generalized
      lymphadenopathy, hepatosplenomegaly, and peripheral blood mononucleosis
      with atypical lymphocytes.
    explanation: >-
      The rediscovery paper summarizes the original Japanese clinical syndrome
      and names fever as a core manifestation.

- name: Headache
  description: >-
    Headache occurred in all four sequence-confirmed Lao patients summarized in
    the 2015 hospital series.
  phenotype_term:
    preferred_term: headache
    term:
      id: HP:0002315
      label: Headache
  evidence:

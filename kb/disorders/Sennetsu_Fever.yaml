name: Sennetsu Fever
creation_date: "2026-09-28T19:03:01Z"
category: Infectious Disease
parents:
- Anaplasmataceae infectious disease
- Bacterial infectious disease
synonyms:
- Sennetsu neorickettsiosis
- Sennetsu rickettsiosis
- Sennetsu ehrlichiosis
- Hyuga fever
- Kagami fever
- Infectious mononucleosis of western Japan
description: >-
  Sennetsu fever is an acute fish-associated neorickettsiosis caused by the
  obligate intracellular bacterium Neorickettsia sennetsu. Human infection is
  probably acquired by eating raw or undercooked fish carrying infected
  digenean-fluke metacercariae, after which the organism enters monocytes and
  macrophages, persists in membrane-bound vacuoles, up-regulates host
  transferrin-receptor iron uptake through iron-responsive protein 1, expands
  as morulae, and produces a febrile infectious-mononucleosis-like illness with
  lymphadenopathy and hepatosplenomegaly.

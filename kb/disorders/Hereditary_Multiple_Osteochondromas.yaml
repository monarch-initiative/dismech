  description: >-
    The commoner and, on average, more severe type. EXT1 variants account for
    roughly two thirds of cases with an identified variant, and in
    genotype-phenotype series EXT1 carriers have shorter stature, more
    deformity, worse function, and more of the sarcomas.
  evidence:
  - reference: PMID:19810120
    reference_title: "Multiple osteochondromas: mutation update and description of the multiple osteochondromas mutation database (MOdb)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EXT1 mutations are detected in +/-65% of cases, versus +/-35% EXT2 mutations in MO patient cohorts."
    explanation: Source of the subtype frequency.
  - reference: PMID:15446535
    reference_title: Severity of disease and risk of malignant change in hereditary multiple exostoses. A genotype-phenotype study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sites of mutation affected the severity of disease with patients with EXT1 mutations having a significantly worse condition than those with EXT2 mutations in three of five parameters of severity (stature, deformity and functional parameters)."
    explanation: The genotype-severity difference that distinguishes the two types clinically.
  - reference: PMID:22258776
    reference_title: 'Genotype-phenotype correlation study in 529 patients with multiple hereditary exostoses: identification of "protective" and "risk" factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in contrast, a severe phenotype was associated with male sex (odds ratio = 2.431; 95% confidence interval, 1.544 to 3.826), EXT1 mutations (odds ratio = 6.817; 95% confidence interval, 1.003 to 46.348), and more than twenty affected skeletal sites (odds ratio = 2.413; 95% confidence interval, 1.144 to 5.091)."
    explanation: >-
      Independent 529-patient series associating EXT1 with the severe
      phenotype; note the wide confidence interval.

- name: Pain
  category: Symptom
  description: >-
    Chronic pain from mechanical pressure, bursitis, impingement and
    degenerative change, reported by 87.8% of 353 Dutch adults with a mean
    numeric rating of about 3 out of 10. Fear-avoidance beliefs and fatigue

    reference_title: Ext1-dependent heparan sulfate regulates the range of Ihh signaling during endochondral ossification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, we show that reduced HS synthesis in mice carrying a hypomorphic mutation in Ext1 results in an elevated range of Indian hedgehog (Ihh) signaling during embryonic chondrocyte differentiation."
    explanation: The direct demonstration that reduced heparan sulfate expands the Ihh signalling range.
  - reference: PMID:15177029

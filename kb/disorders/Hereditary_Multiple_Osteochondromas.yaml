    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Osteochondromas can be associated with shortened stature, bony deformity, restricted joint motion, premature osteoarthrosis, and compression of peripheral nerves."
    explanation: GeneReviews lists shortened stature among the associations.
  - reference: PMID:15446535
    reference_title: Severity of disease and risk of malignant change in hereditary multiple exostoses. A genotype-phenotype study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sites of mutation affected the severity of disease with patients with EXT1 mutations having a significantly worse condition than those with EXT2 mutations in three of five parameters of severity (stature, deformity and functional parameters)."
    explanation: Stature is one of the measured severity parameters, and it is worse with EXT1.
- name: Forearm deformity
  category: Skeletal
  description: >-
    The most characteristic deformity: a short, bowed ulna with distal ulnar
    lesions, compensatory radial bowing, ulnar deviation of the wrist and, in
    some, radial head dislocation. Present in about 39% of the Washington
    cohort. Bound to the parent forearm-morphology term because HPO codes the
    components (radial bowing, ulnar hypoplasia, dislocated radial head)
    separately rather than the composite.
  phenotype_term:
    preferred_term: Forearm deformity (short bowed ulna with radial bowing)
    term:
      id: HP:0002973
      label: Abnormal forearm morphology
  frequency: FREQUENT
  evidence:
  - reference: PMID:8027127
    reference_title: The natural history of hereditary multiple exostoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a cohort of eighty-four subjects for whom we had complete information, the clinical range of expression was wide: thirty-three (39 per cent) had an obvious deformity of the forearm, eight (10 per cent) had an inequality in the lengths of the limbs, seven (8 per cent) had an angular deformity of the knee, and two (2 per cent) had a deformity of the ankle."

    dependent, and higher in EXT1 carriers. Growth of a lesion after skeletal
    maturity, new pain, and a cap thicker than about 2 cm in an adult are the
    warning signs. This entry stops at the transformation threshold: the
    tumour's own biology, grading and surgical management are curated in the
    Chondrosarcoma entry, whose "Secondary Peripheral" subtype and
    "EXT1/EXT2 Heparan Sulfate Polymerization Failure" node are the

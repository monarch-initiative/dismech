treatments:
- name: Surgical Excision of Symptomatic Osteochondromas
  description: >-
    The mainstay. Asymptomatic lesions are observed; lesions that cause pain,
    impingement, restricted motion, neurovascular compromise or cosmetic
    concern are excised, and the excision must include the cartilage cap and
    overlying perichondrium, because a retained cap regrows. Removed lesions
    should be examined histologically for malignant change. This treats the
    mass effect of an existing lesion; nothing prevents new ones from forming
    while the physes are open.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: excision of osteochondroma including cartilage cap and perichondrium
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Mechanical Impingement by Osteochondromas
    treatment_effect: INHIBITS
    description: Removing the mass removes the pressure it exerts.
    evidence:
    - reference: PMID:20301413
      reference_title: Hereditary Multiple Osteochondromas.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Painful lesions in the absence of bone deformity may be treated with surgical excision that includes the cartilage cap and overlying perichondrium to prevent recurrence"
      explanation: Excision for painful lesions, with the cap-and-perichondrium requirement that prevents regrowth.
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Painful lesions in the absence of bone deformity may be treated with surgical excision that includes the cartilage cap and overlying perichondrium to prevent recurrence"
    explanation: GeneReviews management guidance.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Management includes removal of osteochondromas when they give complaints. Removed osteochondromas should be examined for malignant transformation towards secondary peripheral chondrosarcoma."
    explanation: Symptom-driven excision and histological review of the specimen.
- name: Corrective Osteotomy, Guided Growth and Limb Lengthening
  description: >-
    Reconstruction of growth-related deformity: excision of the culprit
    lesions with corrective osteotomy and ulnar lengthening for the forearm;
    hemiepiphysiodesis (guided growth) or osteotomy at the distal femur,
    proximal tibia or distal tibia for angular malalignment; epiphysiodesis of
    the longer leg for limb-length inequality; and early correction of ankle
    valgus. Evidence that forearm reconstruction improves long-term function
    is weak, so indications are individualised rather than radiographic.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: corrective osteotomy, hemiepiphysiodesis and limb lengthening
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Growth-Plate Tethering and Disturbed Longitudinal Bone Growth
    treatment_effect: MODULATES
    description: >-
      Redirects or arrests growth at chosen physes to correct angulation and
      length inequality; it does not restore normal growth-plate biology.
    evidence:
    - reference: PMID:20301413
      reference_title: Hereditary Multiple Osteochondromas.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "angular misalignment of the lower limbs may be treated with hemiepiphysiodeses (or osteotomies) at the distal femur, proximal tibia, or distal tibia"
      explanation: Guided growth and osteotomy for angular deformity.
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "forearm deformity may be treated with excision of the osteochondromas, corrective osteotomies, and/or ulnar-lengthening procedures"
    explanation: The forearm reconstruction options.
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "leg length inequalities may be treated with epiphysiodesis (growth plate arrest) of the longer leg"
    explanation: Epiphysiodesis for length inequality.
- name: Clinical and Imaging Surveillance for Malignant Transformation
  description: >-
    Monitoring lesion size in adults, with prompt MRI and sarcoma referral
    for growth after skeletal maturity, new pain, or a thick cartilage cap.
    Widely recommended but without an accepted schedule or cost-benefit
    evidence; the yield argument rests on the sarcoma risk being comparable
    to that in screened populations for other cancers. Bound to the NCIT
    cancer-screening action because that is what surveillance of an
    at-risk population for malignant transformation is.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: surveillance imaging for malignant transformation of osteochondromas
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Monitoring of the size of osteochondromas in adults may aid in early identification of malignant transformation, but no cost-benefit analyses are available to support routine surveillance."
    explanation: The recommendation and its evidence gap, stated together.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients should be well instructed and regular follow-up for early detection of malignancy seems justified."
    explanation: The review's surveillance recommendation.
  - reference: PMID:15446535
    reference_title: Severity of disease and risk of malignant change in hereditary multiple exostoses. A genotype-phenotype study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sarcoma risk in EXT1 carriers is similar to the risk of breast cancer in an older population subjected to breast-screening, suggesting that a role for regular screening in patients with hereditary multiple exostoses is justifiable."
    explanation: The risk-comparison argument for surveillance, strongest in EXT1 carriers.
- name: En Bloc Resection of Secondary Peripheral Chondrosarcoma
  description: >-
    A transformed lesion is resected en bloc with its pseudocapsule and
    tumour-free margins, preferably in a bone tumour centre; grade 2-3
    histology and partial resection predict worse disease-free survival.
    Recorded here only as the exit from this entry's chain; the oncological
    management is curated in the Chondrosarcoma entry.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: en bloc resection of secondary peripheral chondrosarcoma
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Malignant Transformation of the Cartilage Cap
    treatment_effect: INHIBITS
    description: Removes the transformed cap and its margin before local or distant spread.
    evidence:
    - reference: PMID:38351015
      reference_title: "Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective single-institution case series."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Outcome in disease-free survival highlights that a worse course of the disease was associated with histological grade 2 or 3, and partial resection surgery."
      explanation: Completeness of resection is what determines outcome.
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "sarcomatous degeneration is treated by surgical resection"
    explanation: GeneReviews management guidance.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For secondary peripheral chondrosarcoma, en-bloc resection of the lesion and its pseudocapsule with tumour-free margins, preferably in a bone tumour referral centre, should be performed."
    explanation: The surgical standard for the transformed lesion.
- name: Palovarotene (investigational; MO-Ped trial terminated)
  description: >-
    A selective retinoic acid receptor gamma agonist that, in Ext1-deficient
    mice, cut osteochondroma formation by up to 91%, attenuated BMP signalling,
    and restored the chondrogenic fate decision of perichondrial progenitors;
    a later mouse study showed it also arrests growth of pre-existing lesions
    via Stat3. The phase 2 MO-Ped trial (NCT03442985) randomised 193 children
    to placebo or two doses, was placed on partial clinical hold over concern
    about premature physeal closure and then terminated. In the 30 patients
    with 12-month imaging there was no difference in the annualised rate of
    new osteochondromas or in lesion volume, and the sponsor concluded the
    benefit-risk profile was not favourable. Recorded as an experimental
    treatment with a negative human result, not as a therapy; there is no
    approved disease-modifying drug for HMO.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: palovarotene
      term:
        id: CHEBI:188559
        label: palovarotene
  target_mechanisms:
  - target: Loss of Perichondrial Border Function and Ectopic Chondrogenesis
    treatment_effect: INHIBITS
    description: >-
      RAR-gamma agonism suppresses chondrogenesis and BMP signalling in
      perichondrial progenitors; demonstrated in mice, not confirmed in the
      terminated human trial.
    evidence:
    - reference: PMID:29120519
      reference_title: Palovarotene Inhibits Osteochondroma Formation in a Mouse Model of Multiple Hereditary Exostoses.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We also found that PVO attenuates BMP signaling in Fsp1Cre ;Ext1flox/flox mice and that aberrant chondrogenic fate determination of Ext1-deficient perichondrial progenitor cells in these mice is restored by PVO."
      explanation: INDIRECT because the mechanism-level effect is shown in mice only.
  evidence:
  - reference: PMID:29120519
    reference_title: Palovarotene Inhibits Osteochondroma Formation in a Mouse Model of Multiple Hereditary Exostoses.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Four-week daily treatment with PVO starting at postnatal day (P) 14 reduced the number of osteochondromas that develop in these mice by up to 91% in a dose-dependent manner."
    explanation: The preclinical efficacy that motivated the trial.
  - reference: PMID:39062860
    reference_title: Analysis of the Actions of RARγ Agonists on Growing Osteochondromas in a Mouse Model.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest that palovarotene treatment is effective against pre-existing osteochondromas and that the Stat3 pathway is involved in the antitumor actions of palovarotene."
    explanation: Preclinical activity against established lesions, again mouse only.
  - reference: PMID:41188357
    reference_title: "Palovarotene for patients with multiple hereditary exostosis: results of MO-Ped, a terminated, randomized, placebo-controlled, double-blind phase 2 trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, palovarotene showed no clear efficacy signal in MHE, resulting in a non-favorable benefit-risk profile."
    explanation: The human trial result, recorded as REFUTE of efficacy.
  - reference: PMID:41188357
    reference_title: "Palovarotene for patients with multiple hereditary exostosis: results of MO-Ped, a terminated, randomized, placebo-controlled, double-blind phase 2 trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to concerns of premature physeal closure (PPC), a partial clinical hold was instituted, followed by trial termination."
    explanation: Why the trial stopped; the safety concern specific to a growing skeleton.
  - reference: PMID:41188357
    reference_title: "Palovarotene for patients with multiple hereditary exostosis: results of MO-Ped, a terminated, randomized, placebo-controlled, double-blind phase 2 trial."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "Interpretation of results was limited by the reduced treatment duration and smaller than expected cohort."
    explanation: >-
      The trial's own caveat: the negative result is underpowered and
      truncated, so it does not settle the question either way.
- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission with a 50% risk to each child, near-complete
    penetrance, variable severity that cannot be predicted from genotype, and
    the possibility of prenatal or preimplantation testing once the familial
    variant is known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each child of an individual with HMO has a 50% chance of inheriting an HMO-causing pathogenic variant. If the HMO-causing pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible."
    explanation: The counselling content.
diagnosis:
- name: Clinical and radiographic diagnosis (two or more osteochondromas)
  description: >-
    The diagnosis is clinical and radiographic. It is established in a proband
    by characteristic radiographic findings of multiple osteochondromas
    (and/or by a heterozygous EXT1 or EXT2 pathogenic variant, below). The
    working criterion is two or more cartilage-capped bony outgrowths whose
    cortex and medulla are continuous with the parent bone, on physical
    examination, family history and plain radiographs; where an affected
    relative is already established, the diagnosis can be made clinically
    without molecular testing. Histology of an excised lesion supplements
    but is not required.
  diagnosis_term:
    preferred_term: plain radiography of the skeleton with physical examination
    term:
      id: NCIT:C137876
      label: Bone Radiography
  results: >-
    Two or more osteochondromas, pedunculated or sessile, at the metaphyses of
    long bones or on flat bones, with cortical and medullary continuity with
    the underlying bone.
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of HMO is established in a proband with characteristic radiographic findings of multiple osteochondromas and/or a heterozygous pathogenic variant in EXT1 or EXT2 identified on molecular genetic testing."
    explanation: The GeneReviews statement of how the diagnosis is established.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple osteochondromas (MO) is characterised by development of two or more cartilage capped bony outgrowths (osteochondromas) of the long bones."
    explanation: The two-lesion criterion that the clinical diagnosis rests on.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is based on radiological and clinical documentation, supplemented with, if available, histological evaluation of osteochondromas."
    explanation: Radiology and clinical documentation carry the diagnosis; histology is supplementary.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of OCs through imaging studies such as X-rays or MRIs typically eliminates the need for differential diagnoses, and the presence of two or more OCs is sufficient for the diagnosis of MO according to clinical criteria"
    explanation: A large cohort study restating the two-lesion clinical criterion and the imaging it rests on.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the currently used methods it is possible to detect point mutations or gross deletions in almost 90% of MO patients"
    explanation: >-
      Molecular confirmation is available for most but not all clinically
      diagnosed patients, which is why the clinical-radiographic route
      remains sufficient on its own.
- name: Cross-sectional imaging for complex anatomy and cartilage-cap assessment
  description: >-
    Plain radiography is first line. CT is used for lesions in complex
    anatomy (pelvis, scapula, ribs, spine) where radiographs cannot define
    the base and extent. MRI is the modality for the hyaline cartilage cap
    (T2-weighted sequences), the marrow, adjacent soft tissue and
    neurovascular structures, and for suspected spinal or malignant
    complications; ultrasound can measure the cap of a superficial lesion.
    The imaging ladder (radiography, then CT for complex sites, MRI for the
    cap, ultrasound for superficial caps) follows the Falcon deep-research
    report's synthesis of the radiology reviews; the cited sources quote the
    MRI role directly. Whether children should have a screening spine MRI is
    unsettled.
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the cartilage cap (with CT and ultrasound as adjuncts)
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Defines lesion base and extent at complex sites (CT), and measures
    cartilage-cap thickness and shows marrow, soft-tissue and neurovascular
    relationships (MRI); a spine MRI may show asymptomatic canal lesions.
  evidence:
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      To evaluate possible malignant transformation in case of
      complaints or growth of the lesion after puberty, the size
      of the cartilaginous cap can be well established with T2-
      weighted magnetic resonance (MR) imaging [64].
    explanation: >-
      MRI as the modality for cartilage-cap measurement; quoted with the
      source PDF's line breaks.
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some recommend a screening spine MRI in childhood to identify spinal lesions that may cause pressure on the spinal cord and would warrant close clinical follow up with excision of lesions that cause spinal cord impingement and/or symptoms; others recommend against screening spine MRI except in those with neurologic compromise or osteochondroma(s) of the ribs or pelvis."
    explanation: The disputed role of screening spine MRI.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MO typically involves identifying multiple benign bone tumors known as osteochondromas (OCs) through imaging studies and physical examinations."
    explanation: Imaging plus physical examination as the basis of lesion identification.
- name: Evaluation of suspected malignant transformation (cartilage-cap thickness)
  description: >-
    The red flags for secondary peripheral chondrosarcoma are growth of a
    lesion after skeletal maturity, new or increasing pain in an adult, and
    a thick cartilage cap on MRI. Thresholds in the literature range from
    over 1 cm (Bovée 2008 abstract) through 1.5-2 cm to the WHO 2020
    histological criterion of more than 2 cm; a cap thicker than about 2 cm
    in an adult is the commonly used trigger. The Falcon deep-research
    report gives a higher threshold of about 3 cm for children, which is not
    quoted from a cached source. Imaging alone may not separate an
    osteochondroma from a low-grade chondrosarcoma, so a suspicious lesion
    goes to a sarcoma team for expert radiology and pathology.
  diagnosis_term:
    preferred_term: MRI measurement of cartilage-cap thickness in a growing or painful lesion
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Cartilage cap thicker than about 2 cm in an adult, growth after skeletal
    maturity, a lobulated surface, soft-tissue nodules or invasion of the
    stalk raise suspicion of secondary peripheral chondrosarcoma.
  evidence:
  - reference: PMID:38351015
    reference_title: "Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective single-institution case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An increase in size of a lesion after puberty and the presence of pain in adults are signs that raise suspicion of a Secondary Peripheral Chondrosarcoma (SPC). In addition, the most reliable feature to suspect a SPC is the cartilaginous cap thickness (exceeding 1.5–2 cm)"
    explanation: The clinical red flags and the cap-thickness threshold as stated by the Rizzoli series.
  - reference: PMID:38351015
    reference_title: "Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective single-institution case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most important feature was the thickness of the cartilaginous cap > 2 cm; a lobular pattern with nodules in the surrounding soft tissue, separated by the mail mass, and the invasion of the stalk of the osteochondroma were also in favor of malignancy."
    explanation: >-
      The 2 cm cap criterion and the ancillary features used for grade 1
      peripheral chondrosarcoma under the WHO 2020 classification; quoted
      verbatim including the source's spelling.
  - reference: PMID:38351015
    reference_title: "Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective single-institution case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the imaging or the histology per se may not be distinguish an osteochondroma from low-grade peripheral chondrosarcoma because the diagnosis needs specialized bone tumor pathologists as well as a multidisciplinary approach"
    explanation: Why a suspicious lesion is referred to a specialist team; quoted verbatim including the source's grammar.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The suspicion of secondary chondrosarcoma is indicated by growth of the tumour after puberty, the presence of pain, or a thickness over 1 cm of the cartilaginous cap in adults."
    explanation: The lower end of the published cap-thickness thresholds, from the 2008 review.
- name: EXT1 and EXT2 sequencing followed by deletion/duplication analysis
  description: >-
    Molecular confirmation identifies a heterozygous pathogenic variant in
    EXT1 or EXT2. Sequence analysis of all coding exons and flanking
    splice regions of both genes is performed first; if negative,
    exon-level deletion/duplication analysis (typically MLPA) follows,
    since gross deletions account for a meaningful share of pathogenic
    alleles. Together these find a variant in about 90% of clinically
    diagnosed patients. In a sequencing-negative proband, or one with
    enchondromas or hand and foot lesions, PTPN11 should be added, because
    loss-of-function PTPN11 variants (the metachondromatosis gene) were
    found in about 4% of a large cohort referred with a diagnosis of
    multiple osteochondromas. Testing of relatives, and prenatal or
    preimplantation testing, become possible once the familial variant is
    known.
  diagnosis_term:
    preferred_term: EXT1 and EXT2 sequence analysis with deletion/duplication (MLPA) testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous pathogenic or likely pathogenic EXT1 or EXT2 variant
    (nonsense, frameshift, splice-site, missense or exon-level deletion)
    confirms the diagnosis; a PTPN11 loss-of-function variant points to
    metachondromatosis or the overlap spectrum.
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of HMO is established in a proband with characteristic radiographic findings of multiple osteochondromas and/or a heterozygous pathogenic variant in EXT1 or EXT2 identified on molecular genetic testing."
    explanation: Molecular genetic testing as the alternative route to an established diagnosis.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA analysis of the coding region and copy number variations (CNVs) in EXT1/2 genes is currently the gold standard for diagnosing MO"
    explanation: Sequence plus copy-number analysis of both genes as the molecular standard.
  - reference: PMID:38351015
    reference_title: "Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective single-institution case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in case of negative results, both genes were evaluated by MLPA (Multiple Ligation-dependent Probe Amplification) analysis for the presence of exon or multi-exons deletion/amplification"
    explanation: The sequencing-then-MLPA order as run in the Rizzoli laboratory.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "new techniques screening for larger deletions, such as MLPA, have dramatically decreased the proportion of MO patients without an EXT1 or EXT2 mutation to <15%"
    explanation: Why deletion analysis is part of the standard work-up.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings highlight the importance of expanding genetic testing beyond the EXT1 and EXT2 genes in MO cases, as other genes such as PTPN11 may also be causative."
    explanation: The basis for adding PTPN11 to the panel in EXT-negative probands.
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If the HMO-causing pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible."
    explanation: Familial and reproductive testing once the variant is known.
differential_diagnoses:
- name: Solitary osteochondroma
  description: >-
    A single osteochondroma is the common, non-hereditary lesion (about 85%
    of all osteochondromas); it arises from somatic biallelic EXT1 loss
    confined to the cartilage cap and carries no germline variant. A second
    lesion, a positive family history or a germline EXT1/EXT2 variant moves
    the diagnosis to the hereditary disorder.
  distinguishing_features:
  - One lesion only, no family history
  - No germline EXT1 or EXT2 variant; somatic homozygous EXT1 deletion restricted to the cartilage cap
  evidence:
  - reference: PMID:17341731
    reference_title: "The role of EXT1 in nonhereditary osteochondroma: identification of homozygous deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 85% of all osteochondromas present as solitary (nonhereditary) lesions in which somatic mutations in EXT1 are extremely rare, but loss of heterozygosity and clonal rearrangement of 8q24 (the chromosomal locus of EXT1) are common."
    explanation: The solitary lesion as the majority, non-hereditary form.
  - reference: PMID:17341731
    reference_title: "The role of EXT1 in nonhereditary osteochondroma: identification of homozygous deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH analysis of the cartilage cap, perichondrium, and bony stalk showed that these homozygous EXT1 deletions were present only in the cartilage cap of osteochondroma."
    explanation: Somatic, cap-restricted biallelic EXT1 loss in the sporadic lesion, as opposed to a germline variant.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of two or more OCs is sufficient for the diagnosis of MO according to clinical criteria"
    explanation: The lesion count is what separates the two.
- name: Metachondromatosis
  description: >-
    Autosomal dominant PTPN11 loss-of-function disorder with both
    osteochondromas and enchondromas. Its osteochondromas favour the hands
    and feet, point toward the adjacent growth plate rather than away from
    it, do not cause the shortening and deformity seen here, and may regress
    spontaneously. The boundary is not sharp: PTPN11 loss-of-function
    variants were found in about 4% of probands referred with a diagnosis of
    multiple osteochondromas, several without enchondromas, so the two may
    form a spectrum.
  disease_term:
    preferred_term: metachondromatosis
    term:
      id: MONDO:0007979
      label: metachondromatosis
  distinguishing_features:
  - Enchondromas present; osteochondromas mainly in hands and feet, pointing toward the growth plate
  - Lesions do not shorten or deform bones and may regress spontaneously
  - PTPN11 loss-of-function variant rather than EXT1/EXT2
  evidence:
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point toward the adjacent growth plate, while in MO the osteochondromas are mainly located in the long or other tubular bones and point away from the epiphysis"
    explanation: The radiographic orientation that separates metachondromatosis lesions from those of this disorder.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in patients with MC the lesions do not result in shortening or deformity of affected bones as in MO, and may spontaneously decrease in size or resolve completely, both clinically and radiologically"
    explanation: The natural-history difference.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metachondromatosis (OMIM#156250) (MC) is a rare genetic disease characterized by the presence of obligatory enchondromas (ECs) and nonobligatory OCs, caused by LoF variants in the PTPN11 gene"
    explanation: The defining features and gene of the differential.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest a potential overlap between the MO and MC both phenotypically and genetically."
    explanation: The overlap that makes this differential a spectrum question rather than a clean split.
- name: Dysplasia epiphysealis hemimelica (Trevor disease)
  description: >-
    A non-hereditary developmental cartilaginous overgrowth of one or more
    epiphyses, usually on one side (medial more than lateral) of a single
    lower limb. Like osteochondromas the lesions are diagnosed in childhood
    and stop growing at skeletal maturity, but they are epiphyseal rather
    than metaphyseal, unilateral, not inherited, and malignant transformation
    has not been reported.
  disease_term:
    preferred_term: dysplasia epiphysealis hemimelica
    term:
      id: MONDO:0007489
      label: dysplasia epiphysealis hemimelica
  distinguishing_features:
  - Epiphyseal, not metaphyseal, overgrowth; hemimelic distribution in one limb
  - No genetic transmission; no reported malignant transformation
  evidence:
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MO should be distinguished from metachondromatosis, dysplasia epiphysealis hemimelica and Ollier disease."
    explanation: The review names it in the differential.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to osteochondroma, DEH is usually diagnosed prior to the age of 15 years, more often in boys than in girls, and growth of these lesions end at puberty as the growth plates close"
    explanation: The shared timing that makes it a differential.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      In contrast to MO, malignant transforma-
      tion has not been reported so far
    explanation: >-
      No reported malignant transformation, unlike this disorder; quoted
      with the source PDF's line break.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and there does not appear to be any genetic transmission"
    explanation: Dysplasia epiphysealis hemimelica is not inherited, unlike this autosomal dominant disorder.
- name: Ollier disease
  description: >-
    Non-hereditary enchondromatosis: multiple cartilage tumours inside the
    medullary cavity, with a predilection for the short tubular bones of the
    hands and feet and a unilateral predominance, rather than surface
    exostoses with cortical continuity.
  disease_term:
    preferred_term: Ollier disease
    term:
      id: MONDO:0008145
      label: Ollier disease
  distinguishing_features:
  - Intramedullary enchondromas rather than surface osteochondromas
  - Short tubular bones of hands and feet; unilateral predominance; not inherited
  evidence:
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(Ollier disease and Maffucci syndrome), in which multiple cartilage tumours are found in the medulla of bone, with a predilection for the short tubular bones and a unilateral predominance"
    explanation: The location and distribution that separate enchondromatosis from this disorder.
- name: Maffucci syndrome
  description: >-
    Enchondromatosis with soft-tissue haemangiomas. As for Ollier disease the
    cartilage tumours are intramedullary and favour the hands and feet; the
    vascular lesions are the added distinguishing feature.
  disease_term:
    preferred_term: Maffucci syndrome
    term:
      id: MONDO:0013808
      label: Maffucci syndrome
  distinguishing_features:
  - Intramedullary enchondromas plus soft-tissue haemangiomas
  - Not inherited; no EXT1/EXT2 variant
  evidence:
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(Ollier disease and Maffucci syndrome), in which multiple cartilage tumours are found in the medulla of bone, with a predilection for the short tubular bones and a unilateral predominance"
    explanation: The review groups it with Ollier disease as enchondromatosis to be distinguished from this disorder.
- name: Langer-Giedion syndrome (trichorhinophalangeal syndrome type II)
  description: >-
    A contiguous 8q23-q24 deletion that removes EXT1 together with TRPS1
    (and RAD21), so the multiple exostoses of this disorder occur alongside
    the trichorhinophalangeal features (sparse hair, bulbous nose,
    cone-shaped epiphyses), ectodermal anomalies and, in some, intellectual
    disability. A child with osteochondromas plus dysmorphic features or
    developmental delay should have chromosomal microarray rather than
    EXT1/EXT2 sequencing alone.
  disease_term:
    preferred_term: Langer-Giedion syndrome
    term:
      id: MONDO:0007874
      label: trichorhinophalangeal syndrome type II
  distinguishing_features:
  - Facial dysmorphism, sparse hair, cone-shaped epiphyses and possible intellectual disability in addition to exostoses
  - Contiguous 8q23q24 deletion including TRPS1 and EXT1 on microarray, not an intragenic EXT1/EXT2 variant
  evidence:
  - reference: PMID:35290978
    reference_title: Minimal Critical Region and Genes for a Typical Presentation of Langer-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Langer-Giedion syndrome (LGS) is caused by a contiguous deletion at 8q23q24, characterized by exostoses, facial, ectodermal, and skeletal anomalies, and, occasionally, intellectual disability."
    explanation: The contiguous-deletion basis and the added features that distinguish it.
  - reference: PMID:35290978
    reference_title: Minimal Critical Region and Genes for a Typical Presentation of Langer-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest a 3.2-Mb critical region for a typical presentation of the syndrome, emphasizing the contribution of the TRPS1, RAD21, and EXT1 genes' haploinsufficiency, and facial dysmorphisms as well as bone anomalies as the most frequent features among patients with LGS."
    explanation: EXT1 haploinsufficiency within the deleted region is what produces the exostoses.
  - reference: PMID:7550340
    reference_title: Cloning of the putative tumour suppressor gene for hereditary multiple exostoses (EXT1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a majority of families, the genetic defect (EXT1) is linked to the Langer-Giedion syndrome chromosomal region in 8q24.1."
    explanation: The shared locus behind the overlap.
clinical_trials:
- name: NCT03442985
  phase: PHASE_II
  status: TERMINATED
  description: >-
    MO-Ped: a randomised, double-blind, placebo-controlled phase 2 trial of two
    doses of palovarotene in children with multiple osteochondromas, terminated
    after a partial clinical hold over premature physeal closure; no efficacy
    signal in the truncated dataset.
  evidence:
  - reference: clinicaltrials:NCT03442985
    reference_title: "A Phase 2, Randomized, Double-Blind, Placebo-Controlled Efficacy and Safety Study of Palovarotene in Subjects With Multiple Osteochondromas"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This is a randomized, double-blind, placebo-controlled study comparing the safety and efficacy of 2 dosage regimens of palovarotene versus placebo in preventing disease progression in pediatric subjects with multiple osteochondromas (MO)."
    explanation: The registry summary of the trial design.
  - reference: PMID:41188357
    reference_title: "Palovarotene for patients with multiple hereditary exostosis: results of MO-Ped, a terminated, randomized, placebo-controlled, double-blind phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to concerns of premature physeal closure (PPC), a partial clinical hold was instituted, followed by trial termination."

- name: Loss of Perichondrial Border Function and Ectopic Chondrogenesis
  biological_scale: TISSUE
  description: >-
    The perichondrium normally walls the growth plate laterally and keeps
    chondrogenesis inside it; the groove of Ranvier at the physeal margin is
    rich in progenitors. When heparan sulfate is lost in perichondrium and the
    lateral chondrocytes flanking the epiphysis, that border fails: ectopic
    cartilage forms, cells at the chondro-perichondrial boundary change
    phenotype, and cartilage nodules lose their peripheral definition and
    fuse. Chondrocytes and progenitors escape sideways from the physis and
    proliferate ectopically at the metaphyseal periphery. This is the node a
    RAR-gamma agonist acts on: palovarotene restores the chondrogenic fate
    decision of Ext1-deficient perichondrial progenitors in mice.

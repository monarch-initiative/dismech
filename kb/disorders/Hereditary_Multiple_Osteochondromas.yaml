name: Hereditary Multiple Osteochondromas
creation_date: "2026-09-04T23:23:40Z"
category: Mendelian
disease_term:
  preferred_term: Hereditary Multiple Osteochondromas
  term:
    id: MONDO:0005508
    label: hereditary multiple osteochondromas
synonyms:
- HMO
- Hereditary multiple exostoses
- HME
- Multiple hereditary exostoses
- MHE
- Multiple osteochondromas
- MO
- Multiple cartilaginous exostoses
- Osteochondromatosis
- Diaphyseal aclasis
- EXT
description: >-
  Hereditary multiple osteochondromas (HMO), long known as hereditary multiple
  exostoses, is an autosomal dominant skeletal disorder in which multiple
  cartilage-capped bony outgrowths, osteochondromas, form at the metaphyses of
  the growing skeleton. A germline loss-of-function variant in EXT1 or EXT2
  halves the activity of the Golgi copolymerase that elongates heparan sulfate
  chains on proteoglycans. Heparan sulfate is what holds morphogens in place in
  the growth plate: it binds Indian hedgehog and constrains its range, it
  restrains bone morphogenetic proteins, and it presents fibroblast growth
  factors to their receptors. When it is deficient, and especially when a
  somatic second hit removes the remaining EXT allele from a clone of
  growth-plate chondrocytes, the perichondrium loses its border function,
  chondrocytes escape sideways from the physis, and the ectopic cartilage
  ossifies by the same endochondral programme as the bone it grew from,
  producing an outgrowth with cortex and marrow continuous with the parent
  bone.

  The clinical picture follows from where and when the lesions grow. They are
  rarely present at birth, appear in early childhood with a median age at
  diagnosis of three years, multiply and enlarge while the growth plates are
  open, and stop growing at skeletal maturity. Because they sit next to the
  physes, they tether and distort longitudinal growth: short stature, the
  characteristic forearm deformity with a short bowed ulna, limb-length
  inequality, and valgus at the knee and ankle. Because they are masses, they
  impinge: pain, restricted joint motion, bursitis, peripheral nerve and vessel
  compression, and, rarely, spinal cord compression. And because each carries
  a cartilage cap, a small fraction, on the order of a few per cent over a
  lifetime and higher with EXT1 than EXT2, transform to secondary peripheral
  chondrosarcoma, usually in adulthood; a cap thicker than about 2 cm in an
  adult is the warning sign.

  The entry is organised around that chain, from germline lesion through
  enzyme, heparan sulfate, second hit and morphogen gradients to the lesion and
  its three consequences: growth disturbance, mechanical impingement, and
  malignant transformation. The malignant branch is curated only to its
  threshold; the biology of the chondrosarcoma itself belongs to the
  Chondrosarcoma entry.
parents:
- Genetic Skeletal Disorders
- Hereditary Tumor Predisposition Syndromes
notes: >-
  Scope and lump/split. This entry is the disease-level concept
  MONDO:0005508 and carries the two OMIM-defined genetic types as
  `has_subtypes`: EXT1-related (MONDO:0007585, exostoses, multiple, type 1) and
  EXT2-related (MONDO:0007586, type 2). The two are curated together because the
  mechanism is identical at every node, the genes encode the two halves of one
  enzyme complex, and the phenotypes differ only in degree. The historical
  "EXT3" locus on 19p (MONDO:0010846, exostoses, multiple, type III) was mapped
  by linkage and never resolved to a gene; it is mentioned here and not entered
  as a subtype. The Langer-Giedion syndrome (trichorhinophalangeal syndrome
  type II), a contiguous-gene deletion of 8q24 removing EXT1 together with
  TRPS1, produces multiple osteochondromas as one feature of a broader syndrome
  and is a separate entry, not a subtype of this one. Metachondromatosis
  (PTPN11) is a differential diagnosis rather than a subtype; the 2024 cohort
  finding of PTPN11 loss-of-function variants in a few osteochondroma-only
  probands is recorded as an open question, not as a third causal gene.

  Module conformance deliberately not declared. The obvious candidate,
  `hedgehog_pathway_activation`, scopes itself to ligand-independent,
  constitutive SMO-GLI activation in neoplasms driven by PTCH1/PTCH2/SUFU loss
  or SMO gain, and defines the SMO-inhibitor mechanism of action. HMO is a
  different kind of hedgehog disturbance: the ligand is still Indian hedgehog,
  the receptor machinery is intact, and what changes is the diffusion range of
  the ligand because heparan sulfate no longer holds it near its source. The
  Ext2-heterozygous mouse in fact showed cartilage changes that were not
  attributable to a hedgehog defect at all, and BMP and FGF handling are
  disturbed in the same lesions. Conforming to a constitutive-SMO module would
  therefore assert a mechanism the entry does not claim and would wrongly
  suggest SMO antagonism as the drug pattern. The malignant branch is likewise
  not conformed to the Chondrosarcoma entry's nodes: that entry already
  carries an "EXT1/EXT2 Heparan Sulfate Polymerization Failure" node and a
  "Secondary Peripheral Malignant Transformation" node, so this entry stops at
  the transformation threshold and points across in prose and in a discussion
  rather than re-modelling chondrosarcoma biology.

  Evidence-source conventions. GeneReviews sentences are graded OTHER. Bovée's
  2008 Orphanet review is graded HUMAN_CLINICAL where the quoted sentence
  reports a human clinical or epidemiological fact and OTHER where it states a
  management recommendation. The Sgariglia 2013 perichondrium paper mixes
  conditional-knockout mouse work with explant and micromass culture, so its
  sentences are graded individually: the conditional-ablation and summary
  sentences MODEL_ORGANISM, the BMP2-binding sentence IN_VITRO. The Hameetman
  2007 homozygous-deletion finding concerns sporadic, nonhereditary
  osteochondromas and is cited with directness INDIRECT for the second-hit
  node. The gene-level `genetic` blocks do not repeat the inheritance object;
  the disease-level `inheritance` block is the single source for mode of
  inheritance, penetrance and de novo rate. The surveillance treatment is
  bound to NCIT Cancer Screening because the generic Surveillance, Patient
  Observation, Follow-Up and Patient Monitoring terms are not clinical
  interventions under NCIT:C25218 and fail the TreatmentActionTerm enum.

  Provenance. Built from an Edison Falcon deep-research report
  (research/Hereditary_Multiple_Osteochondromas-deep-research-falcon.md;
  reference validation 18/18 resolved, no unresolved terms, one obsolete NCIT
  term which is not used). The report cites by DOI and author-year key; every
  source used here was resolved to its PubMed record by title search and
  fetched by PMID, and all snippets are verified against the cached abstracts.
  Several of the report's suggested CURIEs were wrong on inspection and were
  not used: HP:0000934 is chondrocalcinosis, not multiple exostoses
  (HP:0002762 is); HP:0002970 is genu varum, not valgum (HP:0002857);
  CHEBI:177944 is a flavanone, not palovarotene (CHEBI:188559); and the
  proposed NCIT procedure codes named unrelated procedures. The classic
  primary papers (Ahn 1995, Stickens 1996, Wuyts 1998, McCormick 1998 and 2000,
  Lind 1998, Koziel 2004, Hameetman 2007, Jones 2010, Matsumoto 2010, Zak
  2011, Sgariglia 2013, Schmale 1994, Wicklund 1995, Porter 2004, Pedrini
  2011, Jennes 2009) were located directly on PubMed.

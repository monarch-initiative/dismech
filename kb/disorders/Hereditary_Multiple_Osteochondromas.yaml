- name: Ankle valgus deformity
  category: Skeletal
  description: >-
    Valgus tilt of the ankle from distal fibular shortening and distal tibial
    lesions, in 2% of the Washington cohort; early treatment may prevent later
    deterioration of function. Left unbound: HPO has no ankle-valgus term, and

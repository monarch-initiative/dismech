    explanation: EXT2 genotype associated with the mild phenotype.
pathophysiology:
- name: Germline Heterozygous Loss-of-Function Variant in EXT1 or EXT2
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A heterozygous germline variant inactivates one
    allele of EXT1 (about 65% of mutation-positive cases) or EXT2 (about 35%).
    Three quarters or more are nonsense, frameshift or splice-site changes that
    truncate the protein; large deletions and the rarer missense variants that
    do abolish activity make up the rest. The mutation spectrum is the
    spectrum of a tumour suppressor: it was loss of function, not gain, from
    the first mutation reports onward, and EXT1 was cloned from the
    Langer-Giedion region of 8q24 by walking to the breakpoints of two
    patients' translocations. This node is the germline first hit; the somatic
    second hit is curated separately.
  genes:
  - preferred_term: EXT1
    term:
      id: hgnc:3512
      label: EXT1
  - preferred_term: EXT2
    term:
      id: hgnc:3513
      label: EXT2
  genetic_context:
    genes:
    - preferred_term: EXT1
      term:
        id: hgnc:3512
        label: EXT1
    - preferred_term: EXT2
      term:
        id: hgnc:3513
        label: EXT2
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - NONSENSE_VARIANT
    - FRAMESHIFT_VARIANT
    - SPLICE_SITE_VARIANT
    - DELETION
    - MISSENSE_VARIANT
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline inactivation of one EXT1 or EXT2 allele; mostly
      truncating. Some reported missense variants retain full heparan sulfate
      synthesis in functional assays and may be benign polymorphisms, so a
      missense call needs functional support before it is treated as
      pathogenic.
  evidence:
  - reference: PMID:9463333
    reference_title: Mutations in the EXT1 and EXT2 genes in hereditary multiple exostoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the mutations in EXT1 and EXT2 cause premature termination of the EXT proteins, whereas missense mutations are rare. The development is thus mainly due to loss of function of the EXT genes, consistent with the hypothesis that the EXT genes have a tumor- suppressor function."
    explanation: >-
      The mutation-spectrum analysis that established loss of function as the
      mechanism. Quoted verbatim including the source's spacing in
      "tumor- suppressor".
  - reference: PMID:19810120
    reference_title: "Multiple osteochondromas: mutation update and description of the multiple osteochondromas mutation database (MOdb)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivating mutations (nonsense, frame shift, and splice-site mutations) represent the majority of MO causing mutations (75-80%)."
    explanation: Quantifies the truncating share of the spectrum across 895 variants.
  - reference: PMID:7550340
    reference_title: Cloning of the putative tumour suppressor gene for hereditary multiple exostoses (EXT1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the gene harbours frameshift mutations in affected members of two EXT1 families."
    explanation: The original EXT1 identification, with frameshift alleles in affected family members.
  - reference: PMID:8782816
    reference_title: The EXT2 multiple exostoses gene defines a family of putative tumour suppressor genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the isolation and characterization of the EXT2 gene. This gene shows striking sequence similarity to the EXT1 gene, and we have identified a four base deletion segregating with the phenotype."
    explanation: The original EXT2 identification, with a segregating frameshift deletion.
  - reference: PMID:11391482
    reference_title: "Etiological point mutations in the hereditary multiple exostoses gene EXT1: a functional analysis of heparan sulfate polymerase activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results show that EXT1 mutants bearing six of these missense mutations (D164H, R280G/S, and R340S/H/L) are also defective in HS expression, but surprisingly, four (Q27K, N316S, A486V, and P496L) are phenotypically indistinguishable from wild-type EXT1."
    explanation: >-
      Functional assay showing that only some reported missense variants
      abolish heparan sulfate synthesis, which is the caution recorded in
      genetic_context.
  downstream:
  - target: Reduced EXT1-EXT2 Heparan Sulfate Copolymerase Activity
    causal_link_type: DIRECT
    description: >-
      One inactive allele halves the supply of a subunit of the EXT1-EXT2
      complex, and the complex is the active enzyme.
    evidence:
    - reference: PMID:10639137
      reference_title: The putative tumor suppressors EXT1 and EXT2 form a stable complex that accumulates in the Golgi apparatus and catalyzes the synthesis of heparan sulfate.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These findings provide a rationale to explain how inherited mutations in either of the two EXT genes can cause loss of activity, resulting in hereditary multiple exostoses."
      explanation: >-
        States the causal step explicitly: a mutation in either gene reduces
        the activity of the shared complex.
  - target: Somatic Second Hit in Growth-Plate Chondrocytes
    causal_link_type: DIRECT
    description: >-
      The germline lesion is the first hit of a two-hit process; it makes a
      single somatic event in one chondrocyte sufficient to abolish heparan
      sulfate synthesis in that cell's descendants.
    evidence:
    - reference: PMID:20080592
      reference_title: A mouse model of osteochondromagenesis from clonal inactivation of Ext1 in chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Rather than model the germ-line genotype, we modeled the chimeric tissue genotype of somatic loss of heterozygosity (LOH), by conditionally inactivating Ext1 via head-to-head loxP sites and temporally controlled Cre-recombinase in chondrocytes."
      explanation: >-
        The experimental design that treats the germline genotype as the
        background on which somatic loss of heterozygosity acts.
- name: Reduced EXT1-EXT2 Heparan Sulfate Copolymerase Activity
  biological_scale: MOLECULAR
  description: >-
    EXT1 and EXT2 are type II transmembrane glycosyltransferases that form a
    hetero-oligomeric complex in the Golgi and alternately add glucuronic acid
    and N-acetylglucosamine to elongate heparan sulfate chains. Neither is
    much of an enzyme alone: the complex has substantially higher
    glycosyltransferase activity than either subunit, EXT2 has no significant
    activity without EXT1, and the complex is what accumulates in the Golgi.
    That is why a mutation in either gene produces the same disease, and why
    aetiologic missense variants that keep the protein in the endoplasmic
    reticulum fail to alter cell-surface heparan sulfate.
  molecular_functions:
  - preferred_term: heparan sulfate GlcNAc transferase (EXT1/EXT2 copolymerase)
    modifier: DECREASED
    term:
      id: GO:0050508
      label: glucuronosyl-N-acetylglucosaminyl-proteoglycan 4-alpha-N-acetylglucosaminyltransferase activity
  - preferred_term: heparan sulfate GlcA transferase (EXT1/EXT2 copolymerase)
    modifier: DECREASED
    term:
      id: GO:0050509
      label: N-acetylglucosaminyl-proteoglycan 4-beta-glucuronosyltransferase activity
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:9756849
    reference_title: The putative tumor suppressors EXT1 and EXT2 are glycosyltransferases required for the biosynthesis of heparan sulfate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus at least two members of the EXT family of tumor suppressors encode glycosyltransferases involved in the chain elongation step of HS biosynthesis."
    explanation: Identifies the enzymatic function of both genes as heparan sulfate chain elongation.
  - reference: PMID:10639137
    reference_title: The putative tumor suppressors EXT1 and EXT2 form a stable complex that accumulates in the Golgi apparatus and catalyzes the synthesis of heparan sulfate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Remarkably, the Golgi-localized EXT1/EXT2 complex possesses substantially higher glycosyltransferase activity than EXT1 or EXT2 alone, which suggests that the complex represents the biologically relevant form of the enzyme(s)."
    explanation: Establishes the complex, not either subunit, as the active enzyme, and its Golgi location.
  - reference: PMID:9620772
    reference_title: The putative tumour suppressor EXT1 alters the expression of cell-surface heparan sulfate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two EXT1 variants containing aetiologic missense mutations failed to alter cell-surface glycosaminoglycans, despite retaining their ER-localization."
    explanation: Disease missense variants lose the ability to generate cell-surface heparan sulfate.
  downstream:
  - target: Systemic Heparan Sulfate Insufficiency
    causal_link_type: DIRECT
    description: >-
      Less copolymerase means shorter and fewer heparan sulfate chains on
      proteoglycans throughout the body.
    evidence:
    - reference: PMID:23514715
      reference_title: "Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half reduction of heparan sulfate to chondroitin sulfate ratio and the possible diagnostic application."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The results suggest that HME patients' blood exhibited reduced HS amounts and HS/CS ratios, which could be used as a diagnostic biomarker for HME."
      explanation: The halved ratio in heterozygous patients is the systemic readout of reduced enzyme activity.
- name: Systemic Heparan Sulfate Insufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygosity is enough to be measurable. The heparan sulfate to
    chondroitin sulfate ratio in patients' blood is about half that of
    controls, with the chain structure itself largely preserved: it is the
    amount, not the sulfation pattern, that is short. Compound
    Ext1/Ext2-heterozygous mice show the same thing in chondrocytes,
    endothelial cells and fibroblasts, which make shortened heparan sulfate
    chains and respond less to heparan-sulfate-dependent factors such as
    FGF-18. This node is the dosage arm of the mechanism: it operates in every
    cell, it is what the compound-heterozygous mouse shows to be sufficient
    for exostoses, and it sets the threshold that a somatic second hit pushes
    a clone over.
  biological_processes:
  - preferred_term: heparan sulfate proteoglycan biosynthesis
    modifier: DECREASED
    term:
      id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
  evidence:
  - reference: PMID:23514715
    reference_title: "Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half reduction of heparan sulfate to chondroitin sulfate ratio and the possible diagnostic application."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, interestingly, although both the amounts of HS and chondroitin sulfate (CS) varied depending on the different individuals, the amounts of HS in both the plasma and cellular fractions of HME patient samples were decreased and the ratios of HS to CS (HS/CS) of HME patient samples were almost half those of healthy individuals."
    explanation: Direct human measurement of the systemic deficiency in heterozygous patients.
  - reference: PMID:23514715
    reference_title: "Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half reduction of heparan sulfate to chondroitin sulfate ratio and the possible diagnostic application."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that HS structures of HME patients were almost similar to those of controls in both plasma and cellular fractions."
    explanation: Establishes that it is chain quantity, not structure, that is reduced.
  - reference: PMID:21310272
    reference_title: Compound heterozygous loss of Ext1 and Ext2 is sufficient for formation of multiple exostoses in mouse ribs and long bones.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ext1(+/-)Ext2(+/-) exostoses contained very low levels of immuno-detectable heparan sulfate, and Ext1(+/-)Ext2(+/-) chondrocytes, endothelial cells and fibroblasts in vitro produced shortened heparan sulfate chains compared to controls and responded less vigorously to exogenous factors such as FGF-18."
    explanation: Shows the dosage-dependent shortening of chains and its functional consequence for growth-factor responsiveness.
  downstream:
  - target: Disrupted Heparan-Sulfate-Dependent Morphogen Signaling
    causal_link_type: DIRECT

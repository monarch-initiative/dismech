- name: Somatic Second Hit in Growth-Plate Chondrocytes
  biological_scale: CELLULAR
  description: >-
    In a subset of growth-plate chondrocytes the remaining wild-type EXT
    allele is lost somatically, producing a clone with essentially no heparan
    sulfate. Human osteochondroma tissue shows loss of heterozygosity at the
    EXT locus, and in sporadic lesions homozygous EXT1 deletions are confined
    to the cartilage cap and absent from the perichondrium and bony stalk. The
    decisive experiment was the mouse: Ext1- or Ext2-heterozygous animals,
    which carry the human germline genotype, are nearly resistant to
    long-bone osteochondromas, whereas clonal or stochastic inactivation of
    the second allele in chondrocytes reproduces the disease. What the mouse
    also showed is that the resulting lesion is not a pure mutant clone: the
    osteochondroma is a mixture of mutant and wild-type chondrocytes,
    recruited by their null neighbours, and lacks most neoplastic properties.
    The second hit initiates the lesion; it does not build it alone.

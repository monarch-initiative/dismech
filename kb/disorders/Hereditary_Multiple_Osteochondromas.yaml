phenotypes:
- name: Multiple osteochondromas
  category: Skeletal
  description: >-
    The defining feature: two or more cartilage-capped bony outgrowths, sessile
    or pedunculated, with cortex and marrow continuous with the parent bone,
    at the metaphyses of long bones and on flat bones formed by endochondral
    ossification. Rarely evident at birth; median age at diagnosis three
    years; essentially all affected people are diagnosed by twelve. Lesion
    count varies widely within and between families.
  phenotype_term:
    preferred_term: Multiple osteochondromas
    term:
      id: HP:0002762
      label: Multiple exostoses
  frequency: OBLIGATE
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary multiple osteochondromas (HMO) (also known as multiple hereditary exostoses [MHE]) is characterized by growths of multiple osteochondromas, benign cartilage-capped bone tumors that grow outward from the metaphyses of long bones."
    explanation: The defining feature, which is why the frequency is OBLIGATE.
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER

- name: Cranial base osteochondroma-like outgrowths
  category: Skeletal
  description: >-
    Osteochondroma-like outgrowths and defects of the cranial base,
    specifically the clivus, found in nearly half of 50 consecutive patients
    whose cervical spine imaging included the skull base. The cranial base is
    formed by endochondral ossification at synchondroses, so this is the same
    lesion at an unexpected site; the membranous facial bones remain spared.
  phenotype_term:
    preferred_term: Cranial base osteochondroma-like outgrowth
    term:
      id: HP:0002693
      label: Abnormal skull base morphology
  frequency: FREQUENT
  evidence:
  - reference: PMID:28445472
    reference_title: Unsuspected osteochondroma-like outgrowths in the cranial base of Hereditary Multiple Exostoses patients and modeling and treatment with a BMP antagonist in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, nearly half of the patients displayed moderate defects or osteochondroma-like outgrowths in the cranial base and specifically in the clivus."
    explanation: Nearly half of 50 consecutive patients, which maps to the FREQUENT band.
- name: Short stature
  category: Growth
  description: >-
    Mild to moderate disproportionate short stature from tethered growth at
    many physes. Worse with EXT1 than EXT2; the pediatric natural-history
    cohort found 13 years to be the cut-off after which stature grows slowly.
  phenotype_term:
    preferred_term: Short stature
    term:

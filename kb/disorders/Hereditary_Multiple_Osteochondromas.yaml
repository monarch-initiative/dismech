    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pain was reported by 87.8% (NRS = 3.19±2.6) and fatigue by 90.4% (NRS = 4.1±2.6) of patients with MO."
    explanation: 87.8% of adults, which maps to VERY_FREQUENT.
- name: Fatigue
  category: Symptom
  description: >-
    Reported by 90.4% of adults, with Checklist Individual Strength scores

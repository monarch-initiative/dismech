- name: Growth-Plate Tethering and Disturbed Longitudinal Bone Growth
  biological_scale: TISSUE
  description: >-
    Lesions sitting at the physis tether the bone, divert growth into the
    outgrowth, and shorten and angulate the segment; where two bones grow in
    parallel, as in the forearm and the leg, the shorter one bows the other
    and dislocates the joint between them. The heparan sulfate deficit also
    disorganises the growth plate directly, so the growth disturbance is not
    purely mechanical. The result is short stature, the characteristic
    forearm deformity, limb-length inequality and valgus at the knee and
    ankle, all progressive during growth and fixed after it. Deformity is a
    strong discriminator of severity and is worse with EXT1.

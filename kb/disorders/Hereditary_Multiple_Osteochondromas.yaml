    reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These changes were not attributable to a defect in hedgehog signaling, suggesting that they arise from deficiencies in other heparan sulfate-dependent pathways."
    explanation: >-
      The reason the node is written as multi-pathway morphogen disruption
      rather than a hedgehog module: in the heterozygous mouse the cartilage
      abnormalities were independent of hedgehog signalling.
  downstream:

animal_models:
- name: Clonal chondrocyte Ext1 inactivation mouse (Jones 2010)
  species: Mouse
  genotype: Ext1 conditional (head-to-head loxP) with tamoxifen-inducible Cre in chondrocytes, producing mosaic homozygous Ext1 loss
  publication: PMID:20080592
  description: >-
    The model that settled the second-hit question. Rather than the germline
    heterozygous genotype, which had failed to produce long-bone lesions, it
    models the chimeric tissue genotype of somatic loss of heterozygosity by
    inactivating both Ext1 alleles in a scattered subset of chondrocytes. The
    mice develop multiple metaphyseal osteochondromas, the lesion chondrocytes
    are Ext1-null, and they derive from proliferating physeal chondrocytes.
  modeled_mechanisms:
  - target: Somatic Second Hit in Growth-Plate Chondrocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Engineered biallelic Ext1 loss in a clone of physeal chondrocytes on a wild-type-competent background.
    limitations: >-
      The second hit is induced by Cre at a chosen time and in a chosen cell
      type rather than arising stochastically on a germline heterozygous
      background, so the model shows sufficiency of clonal loss but not the
      natural rate or timing of second hits in patients.
    evidence:
    - reference: PMID:20080592
      reference_title: A mouse model of osteochondromagenesis from clonal inactivation of Ext1 in chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We also confirm homozygous disruption of Ext1 in osteochondroma chondrocytes and their origin in proliferating physeal chondrocytes. These results explain prior modeling failures with the necessity for somatic LOH in a developmentally regulated cell type."
      explanation: The model demonstrates the cell of origin and the necessity of somatic loss of heterozygosity.
  - target: Osteochondroma Formation by Ectopic Endochondral Ossification
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Multiple metaphyseal osteochondromas of the human type.
    evidence:
    - reference: PMID:20080592
      reference_title: A mouse model of osteochondromagenesis from clonal inactivation of Ext1 in chondrocytes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice faithfully recapitulate the human phenotype of multiple metaphyseal osteochondromas."
      explanation: The authors' own statement of phenotype fidelity.
- name: Stochastic chondrocyte-specific Ext1 knockout mouse (Matsumoto 2010)
  species: Mouse
  genotype: Fsp1-Cre; Ext1flox/flox, stochastic chondrocyte-specific Ext1 inactivation
  publication: PMID:20534475
  description: >-
    Independent mosaic model in which Ext1 is inactivated stochastically in a
    small fraction of chondrocytes. It reproduces the human pattern and
    frequency of osteochondromas and bone deformities, and it added the
    finding that lesions are mixtures of mutant and wild-type cells lacking
    most neoplastic properties. It is the model used for the palovarotene and
    BMP-antagonist preclinical work.
  modeled_mechanisms:
  - target: Osteochondroma Formation by Ectopic Endochondral Ossification
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Osteochondromas in a pattern and frequency almost identical to human disease.
    limitations: >-
      Lesions are induced by stochastic Cre activity rather than by somatic
      mutation on a germline heterozygous background, and the model does not
      reproduce the pain, adult complications or malignant transformation of
      the human disease.
    evidence:
    - reference: PMID:20534475
      reference_title: A mouse model of chondrocyte-specific somatic mutation reveals a role for Ext1 loss of heterozygosity in multiple hereditary exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that these mice develop multiple osteochondromas and characteristic bone deformities in a pattern and a frequency that are almost identical to those of human MHE, suggesting a role for Ext1 LOH in MHE."
      explanation: Phenotype fidelity as stated by the authors.
  - target: Somatic Second Hit in Growth-Plate Chondrocytes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows that Ext1 loss in a small fraction of chondrocytes suffices, but
      also that the resulting lesion is a mixed mutant/wild-type mass rather
      than a clone, which complicates a strict two-hit tumour-suppressor
      reading.
    limitations: >-
      The lesion is not clonal and lacks neoplastic properties, so the model
      supports the second hit as an initiating event but argues against
      osteochondroma as a true clonal neoplasm; the human lesion may differ,
      since human caps can carry homozygous EXT1 deletion.
    evidence:
    - reference: PMID:20534475
      reference_title: A mouse model of chondrocyte-specific somatic mutation reveals a role for Ext1 loss of heterozygosity in multiple hereditary exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, our results suggest that inactivation of Ext1 in a small fraction of chondrocytes is sufficient for the development of osteochondromas and other skeletal defects associated with MHE."
      explanation: Sufficiency of focal inactivation.
    - reference: PMID:20534475
      reference_title: A mouse model of chondrocyte-specific somatic mutation reveals a role for Ext1 loss of heterozygosity in multiple hereditary exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Because the observed osteochondromas in our mouse model do not arise from clonal growth of chondrocytes, they cannot be considered true neoplasms."
      explanation: The non-clonal finding that limits the two-hit reading.
- name: Ext2 heterozygous knockout mouse (Stickens 2005)
  species: Mouse
  genotype: Ext2+/- (targeted null allele); Ext2-/- is embryonic lethal at gastrulation
  publication: PMID:16236767
  description: >-
    The germline-genotype model. Heterozygotes carry exactly the genotype of a
    patient, yet only about a third form any exostosis and those are on the
    ribs; long bones are largely spared. All of them nonetheless show
    disorganised growth-plate cartilage and premature hypertrophy, which the
    authors could not attribute to a hedgehog defect. Homozygous loss arrests
    the embryo at gastrulation.
  modeled_mechanisms:
  - target: Osteochondroma Formation by Ectopic Endochondral Ossification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Sporadic rib exostoses in about a third of animals; no stereotypic long-bone lesions.
    limitations: >-
      Despite carrying the human germline genotype, the heterozygote is highly
      resistant to the long-bone osteochondromas that define the human
      disease, which is the model failure that motivated the second-hit
      models.
    evidence:
    - reference: PMID:16236767
      reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygotes had a normal lifespan and were fertile; however, analysis of their skeletons showed that about one-third of the animals formed one or more ectopic bone growths (exostoses)."
      explanation: The partial, low-penetrance lesion phenotype.
  - target: Growth-Plate Tethering and Disturbed Longitudinal Bone Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Growth-plate disorganisation and premature hypertrophy in every heterozygote, without the lesions.
    limitations: >-
      The cartilage changes occur without osteochondromas, so the model
      isolates the haploinsufficiency contribution to growth-plate disturbance
      but cannot show the mechanical tethering component.
    evidence:
    - reference: PMID:16236767
      reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Significantly, all of the mice showed multiple abnormalities in cartilage differentiation, including disorganization of chondrocytes in long bones and premature hypertrophy in costochondral cartilage."
      explanation: Fully penetrant growth-plate disorganisation from haploinsufficiency.
- name: Compound Ext1+/-;Ext2+/- heterozygous mouse (Zak 2011)
  species: Mouse
  genotype: Ext1+/-; Ext2+/- compound heterozygote
  publication: PMID:21310272
  description: >-
    The dosage model. Halving both subunits of the copolymerase, without any
    second hit, roughly doubles the number of outgrowths relative to a single
    heterozygote and, unlike either single heterozygote, produces stereotypic
    growth-plate-like exostoses along the long bones. The lesions contain very
    little heparan sulfate and the cells make shortened chains. It shows that
    exostosis incidence is inversely related to Ext dosage and that complete
    loss is not required.
  modeled_mechanisms:
  - target: Systemic Heparan Sulfate Insufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Shortened heparan sulfate chains and reduced growth-factor responsiveness in multiple cell types.
    evidence:
    - reference: PMID:21310272
      reference_title: Compound heterozygous loss of Ext1 and Ext2 is sufficient for formation of multiple exostoses in mouse ribs and long bones.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ext1(+/-)Ext2(+/-) exostoses contained very low levels of immuno-detectable heparan sulfate, and Ext1(+/-)Ext2(+/-) chondrocytes, endothelial cells and fibroblasts in vitro produced shortened heparan sulfate chains compared to controls and responded less vigorously to exogenous factors such as FGF-18."
      explanation: The molecular readout of dosage-dependent deficiency.
  - target: Osteochondroma Formation by Ectopic Endochondral Ossification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Stereotypic growth-plate-like long-bone exostoses from dosage reduction alone.
    limitations: >-
      Patients are heterozygous at one locus, not both, so the model achieves
      by compound dosage what the human disease achieves focally; it shows a
      sufficient condition rather than the human route.
    evidence:
    - reference: PMID:21310272
      reference_title: Compound heterozygous loss of Ext1 and Ext2 is sufficient for formation of multiple exostoses in mouse ribs and long bones.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, compound heterozygous mice had nearly twice as many outgrowths and, more importantly, displayed stereotypic growth plate-like exostoses along their long bones."
      explanation: The dosage-driven long-bone lesion phenotype.
discussions:
- discussion_id: hmo_second_hit_versus_dosage
  prompt: >-
    Does every human osteochondroma require a somatic second hit in EXT1 or
    EXT2, or is regional heparan sulfate dosage below a threshold sufficient,
    with the second hit one route among several?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Somatic Second Hit in Growth-Plate Chondrocytes
  - pathophysiology#Systemic Heparan Sulfate Insufficiency
  rationale: >-
    The mouse data point both ways. Clonal or stochastic biallelic Ext1 loss
    in chondrocytes reproduces the disease and single heterozygotes do not,
    which argues for a required second hit; but compound Ext1/Ext2
    heterozygotes form stereotypic long-bone exostoses with no second hit,
    and the same group showed incidence is inversely and continuously related
    to Ext expression. In human lesions loss of heterozygosity is found in a
    subset, homozygous deletion is confined to the cartilage cap, and the
    lesion is a mixture of mutant and wild-type cells, so the fraction of
    caps carrying a demonstrable second hit is well below one. Whether the
    remainder reflect undetected second hits, epigenetic silencing, or
    dosage alone is not known, and the answer determines whether HMO is a
    tumour-suppressor disease or a dosage-threshold disease with a
    tumour-suppressor-like presentation.
  proposed_experiments:
  - experiment_id: hmo_cap_single_cell_genotyping
    name: Single-cell genotyping and heparan sulfate quantification of human cartilage caps
    description: >-
      Genotype the EXT locus and measure heparan sulfate per cell across the
      cartilage cap, perichondrium and stalk of resected human osteochondromas
      from germline-confirmed patients, to establish what fraction of caps
      contain any biallelic-null cells, how those cells are distributed, and
      whether caps without a detectable second hit have heparan sulfate levels
      below those of caps with one.
- discussion_id: hmo_heterozygous_mouse_resistance
  prompt: >-
    Why does the germline heterozygous mouse, which carries the exact human
    genotype, fail to form the long-bone osteochondromas that define the
    human disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Germline Heterozygous Loss-of-Function Variant in EXT1 or EXT2
  - pathophysiology#Osteochondroma Formation by Ectopic Endochondral Ossification
  rationale: >-
    Ext1+/- and Ext2+/- mice are highly resistant to osteochondroma
    formation, especially in long bones, and form only occasional rib
    outgrowths, yet in humans the same genotype is essentially fully
    penetrant. The mismatch is mechanistically informative rather than a
    nuisance: it is what forced the field to the second-hit and dosage models.
    Candidate explanations include a lower somatic mutation rate over the
    much shorter murine growth period, a different threshold of heparan
    sulfate below which the perichondrial border fails, and species
    differences in growth-plate architecture and duration. None has been
    tested directly, and the answer matters for any attempt to use dosage or
    second-hit rate as a prognostic variable in patients.
  proposed_experiments:
  - experiment_id: hmo_heterozygote_second_hit_rate
    name: Measure spontaneous second-hit frequency in heterozygous mouse and human growth plates
    description: >-
      Use lineage-traced reporter alleles at the Ext locus in Ext1+/- mice,
      and deep sequencing of microdissected physeal cartilage from
      heterozygous patients undergoing surgery, to estimate the rate of
      spontaneous loss of the wild-type allele per cell per unit of growth in
      each species, and test whether the difference in rate accounts for the
      difference in lesion penetrance.
- discussion_id: hmo_malignant_transformation_determinants
  prompt: >-
    What determines which cartilage cap transforms to secondary peripheral
    chondrosarcoma, and is the EXT1 excess of sarcomas real?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Malignant Transformation of the Cartilage Cap
  rationale: >-
    Transformation is a few per cent over a lifetime, mostly low grade,
    mostly pelvic and mostly adult, and the risk factors are unresolved: one
    prospective genotype-phenotype study found seven sarcomas in EXT1 carriers
    against one in EXT2, while a larger 529-patient series found no
    association with genotype, sex, severity or lesion count. Nothing in the
    mouse models transforms, so there is no experimental system for the step.
    The molecular events downstream of the heparan-sulfate-deficient cap that
    convert it are curated in the Chondrosarcoma entry
    (Chondrosarcoma:pathophysiology#Secondary Peripheral Malignant
    Transformation); this discussion records the gap on the HMO side, which
    is the absence of any predictor better than cap thickness and post-maturity
    growth.
  proposed_experiments:
  - experiment_id: hmo_registry_transformation_risk_model
    name: Registry-based genotype-stratified transformation risk model
    description: >-
      Use a large longitudinal registry with confirmed genotypes to estimate
      transformation incidence by gene, variant class, sex, lesion count and
      site with adequate power, and test whether cap thickness at skeletal
      maturity predicts later transformation, which would turn a warning sign
      into a surveillance criterion.
- discussion_id: hmo_ptpn11_overlap
  prompt: >-
    Are PTPN11 loss-of-function variants in osteochondroma-only probands
    evidence of a third HMO gene, or of misclassified metachondromatosis?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - genetic#
  rationale: >-
    A 2024 cohort of 244 unrelated probands found PTPN11 loss-of-function
    variants in five probands with osteochondromas and no enchondromas, and
    EXT1/EXT2 variants in two with enchondromas, and proposed a phenotypic
    and genetic overlap between HMO and metachondromatosis. This entry does
    not add PTPN11 as a causal gene: enchondromas can be missed on
    conventional imaging, metachondromatosis lesions regress and point toward
    joints, and five cases do not establish a locus. The finding does mean
    that an EXT-negative patient should have PTPN11 sequenced, and it is
    recorded here so that it is not re-nominated as new.
  evidence:
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, we identified five cases with OCs and no ECs as well as four cases with MC carrying LoF variants in the PTPN11 gene and two additional cases with ECs harboring variants in the EXT1/2 genes."
    explanation: The observation behind the open question.
  - reference: PMID:40225915
    reference_title: "The Missing Piece of the Puzzle: Unveiling the Role of PTPN11 Gene in Multiple Osteochondromas in a Large Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is essential to determine whether MO and MC represent distinct diseases or if they encompass a broader clinical spectrum."
    explanation: The authors themselves leave the question open.
- discussion_id: hmo_palovarotene_translation
  prompt: >-
    Why did a drug that prevents 91% of osteochondromas in Ext1-deficient
    mice show no efficacy signal in children, and is the question closed?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Perichondrial Border Function and Ectopic Chondrogenesis
  - treatments#Palovarotene (investigational; MO-Ped trial terminated)
  rationale: >-
    Palovarotene is the only mechanism-directed drug to reach a randomised
    trial in HMO, and the trial was negative on the truncated data. The mouse
    result is robust and mechanistically coherent, so the discrepancy is
    informative: possibilities include that the mouse model's stochastic
    Cre-driven lesions are more retinoid-sensitive than second-hit human
    lesions, that the human dose was limited by physeal toxicity to below the
    effective range, and that twelve months in 30 children is simply too
    little to see an effect on annualised lesion rate. The trial's own
    authors say interpretation was limited by reduced treatment duration and
    a smaller than expected cohort, so the question is not closed, but any
    successor must first solve the growth-plate safety problem that stopped
    this one.
  evidence:
  - reference: PMID:41188357
    reference_title: "Palovarotene for patients with multiple hereditary exostosis: results of MO-Ped, a terminated, randomized, placebo-controlled, double-blind phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant differences in the annualized rate of new OCs, or change from baseline in volume of OCs or OC cartilage, were observed between treatment groups."
    explanation: The null efficacy result.
  - reference: PMID:29120519
    reference_title: Palovarotene Inhibits Osteochondroma Formation in a Mouse Model of Multiple Hereditary Exostoses.
    supports: SUPPORT

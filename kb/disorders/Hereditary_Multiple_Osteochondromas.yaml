    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Second, HS negatively regulates the range of Hedgehog signaling in a concentration-dependent manner."
    explanation: States the mechanism as a range constraint rather than a receptor-level activation.
  - reference: PMID:23458899
    reference_title: "Perichondrium phenotype and border function are regulated by Ext1 and heparan sulfate in developing long bones: a mechanism likely deranged in Hereditary Multiple Exostoses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interference with HS function reduced the physical association and interactions of BMP2 with HS and increased the cell responsiveness to endogenous and exogenous BMP proteins."
    explanation: >-
      The BMP arm: loss of heparan sulfate frees BMP2 and increases cellular

  - reference: PMID:39018287
    reference_title: "Pain and fatigue in adult patients with multiple osteochondromas: The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pain was reported by 87.8% (NRS = 3.19±2.6) and fatigue by 90.4% (NRS = 4.1±2.6) of patients with MO."
    explanation: 90.4% of adults, which maps to VERY_FREQUENT.
  - reference: PMID:39018287
    reference_title: "Pain and fatigue in adult patients with multiple osteochondromas: The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fatigue scores for MO (CIS = 84.1±15.3) were significantly higher (p<0.001) compared to reference scores of healthy subjects and patients with RA."
    explanation: Fatigue exceeds both healthy and rheumatoid-arthritis reference values.
- name: Secondary peripheral chondrosarcoma
  category: Neoplastic
  description: >-
    Malignant transformation of an osteochondroma cartilage cap, usually to a
    low-grade chondrosarcoma, most often in the pelvis and around the hip and
    shoulder, typically in the third and fourth decades but from adolescence.
    Estimates of lifetime risk range from about 1% to 5% in population-based
    or large-cohort series (2.8% in Wicklund, 5% in Pedrini, 0.5-5% pooled)
    and up to 10% in older referral-centre figures; no single band is
    assigned because the estimates straddle the VERY_RARE/OCCASIONAL boundary.
    Warning signs are growth after skeletal maturity, new pain, and a cap
    thicker than about 2 cm in an adult. The tumour itself is curated in the
    Chondrosarcoma entry.
  phenotype_term:
    preferred_term: Secondary peripheral chondrosarcoma
    term:
      id: HP:0006765
      label: Chondrosarcoma
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The risk for malignant transformation to osteochondrosarcoma increases with age, although the lifetime risk for malignant transformation is low (~2%-10%)."
    explanation: GeneReviews' lifetime risk range and its age dependence.
  - reference: PMID:7702095
    reference_title: Natural history study of hereditary multiple exostoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 2.8% of the total affected population had experienced exostosis-related malignancy, an estimate which is considerably less than earlier reports would suggest."
    explanation: A population-oriented estimate at the low end.
  - reference: PMID:22258776
    reference_title: 'Genotype-phenotype correlation study in 529 patients with multiple hereditary exostoses: identification of "protective" and "risk" factors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Malignant transformation was observed in 5% of patients, and no evidence of association between chondrosarcoma onset and EXT mutation, sex, severity of disease, or number of lesions was detected."
    explanation: A referral-cohort estimate at the upper end of the range.
  - reference: PMID:38351015
    reference_title: "Secondary peripheral chondrosarcoma in multiple osteochondromas: a retrospective single-institution case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, the present study gives an overview of the secondary peripheral chondrosarcomas, confirming that this disease represents an impacting complication for multiple osteochondromas patients and suggests that malignant transformation can occur also in younger patient, in a not irrelevant number of cases."
    explanation: >-
      Transformation is not confined to adults. Quoted verbatim including the
      source's grammar.
biochemical:
- name: Blood heparan sulfate to chondroitin sulfate ratio
  presence: DECREASED
  context: >-
    A research biomarker, not a clinical test. In a single prospective series
    the amount of heparan sulfate in both plasma and the cellular fraction of
    blood was reduced and the heparan sulfate to chondroitin sulfate (HS/CS)
    ratio was about half that of healthy controls, with heparan sulfate chain
    structure preserved. The authors proposed the ratio as a diagnostic
    biomarker; it has not been validated against molecular testing in an
    independent cohort and is not part of any diagnostic pathway. The ratio
    is a value computed over two measurements, so the bound term is the
    analyte that falls (heparan sulfate) and the ratio identity is carried in
    the name, per the design-decision entry on composite indices.
  biomarker_term:
    preferred_term: heparan sulfate (as HS/CS ratio in blood)
    term:
      id: NCIT:C540
      label: Heparan Sulfate
  readouts:
  - target: Systemic Heparan Sulfate Insufficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A lower blood HS/CS ratio reports a greater systemic shortfall in
      heparan sulfate synthesis from the heterozygous EXT1/EXT2 defect; the
      ratio is halved in patients, in line with a dosage effect.
    evidence:
    - reference: PMID:23514715
      reference_title: "Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half reduction of heparan sulfate to chondroitin sulfate ratio and the possible diagnostic application."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, interestingly, although both the amounts of HS and chondroitin sulfate (CS) varied depending on the different individuals, the amounts of HS in both the plasma and cellular fractions of HME patient samples were decreased and the ratios of HS to CS (HS/CS) of HME patient samples were almost half those of healthy individuals."
      explanation: >-
        The measured reduction in blood heparan sulfate and in the HS/CS
        ratio is the readout of the systemic heparan sulfate insufficiency
        node.
  evidence:
  - reference: PMID:23514715
    reference_title: "Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half reduction of heparan sulfate to chondroitin sulfate ratio and the possible diagnostic application."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggest that HME patients' blood exhibited reduced HS amounts and HS/CS ratios, which could be used as a diagnostic biomarker for HME."
    explanation: >-
      The authors' proposal of the reduced HS/CS ratio as a diagnostic
      biomarker; the wording is a suggestion from one series, which is why
      the marker is recorded as a research candidate.
  - reference: PMID:23514715
    reference_title: "Glycosaminoglycans in the blood of hereditary multiple exostoses patients: Half reduction of heparan sulfate to chondroitin sulfate ratio and the possible diagnostic application."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that HS structures of HME patients were almost similar to those of controls in both plasma and cellular fractions."
    explanation: >-
      Chain structure is preserved, so the biomarker is a quantity, not a
      sulfation-pattern signature.
genetic:
- name: EXT1
  gene_term:
    preferred_term: EXT1
    term:
      id: hgnc:3512
      label: EXT1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Exostosin-1, 8q24.11, eleven exons. Cloned in 1995 from the Langer-Giedion
    region by walking to two patients' translocation breakpoints. Accounts for
    about 65% of mutation-positive cases; the spectrum is dominated by
    nonsense, frameshift and splice-site alleles, with whole-exon and
    whole-gene deletions detectable by MLPA and a minority of functionally
    validated missense alleles. Several reported missense variants retain
    heparan sulfate synthesis in functional assays and are probably not
    pathogenic. Functional impact is loss of function (haploinsufficiency at the
    germline level, biallelic loss in lesion chondrocytes), recorded
    structurally in the initiating pathophysiology node's genetic_context. The
    contiguous 8q24 deletion that removes EXT1 together with TRPS1 causes
    Langer-Giedion syndrome and is out of scope here.
  evidence:
  - reference: PMID:7550340
    reference_title: Cloning of the putative tumour suppressor gene for hereditary multiple exostoses (EXT1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a majority of families, the genetic defect (EXT1) is linked to the Langer-Giedion syndrome chromosomal region in 8q24.1. From this region we have cloned and characterized a cDNA which spans chromosomal breakpoints previously identified in two multiple exostoses patients."
    explanation: The positional cloning of EXT1 and its relation to the Langer-Giedion region.
  - reference: PMID:19810120
    reference_title: "Multiple osteochondromas: mutation update and description of the multiple osteochondromas mutation database (MOdb)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EXT1 is located at 8q24.11-q24.13, and comprises 11 exons, whereas the 16 exon EXT2 is located at 11p12-p11. To date, an EXT1 or EXT2 mutation is detected in 70-95% of affected individuals."
    explanation: Gene location and the combined diagnostic yield of the two genes.
  - reference: PMID:18271966
    reference_title: Multiple osteochondromas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In almost 90% of MO patients germline mutations in the tumour suppressor genes EXT1 or EXT2 are found."
    explanation: Independent statement of the combined detection rate.
- name: EXT2
  gene_term:
    preferred_term: EXT2
    term:
      id: hgnc:3513
      label: EXT2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Exostosin-2, 11p11-p12, sixteen exons; identified in 1996 by its homology
    to EXT1. Accounts for about 35% of mutation-positive cases, with the same
    truncating-dominated spectrum as EXT1. EXT2 has no significant
    glycosyltransferase activity on its own and acts within the EXT1-EXT2
    complex, which is why its loss produces the same disease. On average the
    milder genotype. Functional impact is loss of function, as for EXT1.
  evidence:
  - reference: PMID:8782816
    reference_title: The EXT2 multiple exostoses gene defines a family of putative tumour suppressor genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the isolation and characterization of the EXT2 gene. This gene shows striking sequence similarity to the EXT1 gene, and we have identified a four base deletion segregating with the phenotype."
    explanation: The original EXT2 identification.
  - reference: PMID:10639137
    reference_title: The putative tumor suppressors EXT1 and EXT2 form a stable complex that accumulates in the Golgi apparatus and catalyzes the synthesis of heparan sulfate.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, by testing a cell line with a specific defect in EXT1 in in vivo and in vitro assays, we show that EXT2 does not harbor significant glycosyltransferase activity in the absence of EXT1."
    explanation: EXT2 acts only within the complex, explaining why its loss phenocopies EXT1 loss.
  - reference: PMID:19810120
    reference_title: "Multiple osteochondromas: mutation update and description of the multiple osteochondromas mutation database (MOdb)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EXT1 mutations are detected in +/-65% of cases, versus +/-35% EXT2 mutations in MO patient cohorts."
    explanation: The EXT2 share of mutation-positive cases.

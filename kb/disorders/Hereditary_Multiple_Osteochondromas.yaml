- name: Spinal cord compression
  category: Neurological
  description: >-
    A rare but serious complication of vertebral osteochondromas growing into
    the canal. Whether asymptomatic children should have a screening spine MRI
    is unsettled; recommendations diverge and no prospective study shows
    benefit.
  phenotype_term:
    preferred_term: Spinal cord compression
    term:

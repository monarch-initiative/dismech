inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  penetrance_percentage: "96"
  expressivity: VARIABLE
  de_novo_rate: "10"
  description: >-
    Autosomal dominant with near-complete penetrance and wide, including
    intrafamilial, variability in expression. About one in ten affected people
    has no affected parent. Penetrance was 96% in the Washington kindred study
    (one unaffected obligate heterozygote among 26) and 100% in the Wicklund
    natural-history series, so the value is recorded as COMPLETE with the
    measured percentage beside it. Older claims of reduced penetrance in
    females were not borne out: the male excess in affected populations
    reflects more severe and more frequent complications in males, not
    transmission.
  evidence:
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HMO is inherited in an autosomal dominant manner."
    explanation: States the mode of inheritance.
  - reference: PMID:20301413
    reference_title: Hereditary Multiple Osteochondromas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Approximately 90% of individuals diagnosed with HMO have an affected parent; approximately 10% of individuals have the disorder as the result of a de novo pathogenic variant."
    explanation: Source of the recorded de novo rate.
  - reference: PMID:8027127
    reference_title: The natural history of hereditary multiple exostoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the use of twenty-three pedigrees that demonstrated an adequate multigenerational history for determination of penetrance of the gene, we identified one unaffected individual among twenty-six obligate heterozygotes, a rate of penetrance of 96 per cent."
    explanation: The measured penetrance figure recorded in penetrance_percentage.
  - reference: PMID:8027127
    reference_title: The natural history of hereditary multiple exostoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence for a substantial reduction of penetrance in female subjects."
    explanation: >-
      Refutes the older suggestion of sex-dependent penetrance, which is why
      no sex qualifier is recorded.
  - reference: PMID:7702095
    reference_title: Natural history study of hereditary multiple exostoses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The excess of males appears to be related to males having more severe and more frequent complications of EXT than having any primary genetic origin."
    explanation: >-
      Explains the male excess in ascertained series as an expressivity effect
      rather than a transmission effect.
  - reference: PMID:15446535
    reference_title: Severity of disease and risk of malignant change in hereditary multiple exostoses. A genotype-phenotype study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severity of the disease did not differ significantly with gender and was very variable within any given family."
    explanation: Supports variable expressivity including within families.
has_subtypes:
- name: EXT1

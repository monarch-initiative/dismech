name: Say-Barber-Biesecker-Young-Simpson Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Say-Barber-Biesecker-Young-Simpson syndrome (SBBYSS; also called the SBBYS
  variant of Ohdo syndrome; OMIM:603736; MONDO:0011365) is a rare autosomal
  dominant multiple congenital anomaly / neurodevelopmental disorder caused by
  heterozygous, almost always de novo, protein-truncating variants in KAT6B,
  which encodes a MYST-family histone (lysine) acetyltransferase. SBBYSS is
  defined clinically by an immobile, mask-like facial appearance with severe
  blepharophimosis and ptosis, long thumbs and long great toes, lacrimal duct
  anomalies, patellar hypoplasia or dislocation, hypotonia, feeding
  difficulties, and severe global developmental delay / intellectual
  disability. Congenital hypothyroidism, dental anomalies, hearing loss, cleft
  palate, congenital heart defects, and cryptorchidism are frequent additional
  features. SBBYSS lies at the milder end of the KAT6B-related disorder
  spectrum and is allelic with genitopatellar syndrome (GPS; OMIM:606170;
  MONDO:0011640), which is curated separately in this knowledge base.

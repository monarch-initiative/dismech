- name: Disrupted craniofacial, limb, skeletal, thyroid and CNS developmental programs
  description: >
    KAT6B is upregulated during mammalian development specifically in the
    developing central nervous system, facial structures, and limb buds, so
    loss of KAT6B-dependent acetylation preferentially derails those
    developmental programs. Hypomorphic and null Kat6b mouse models recapitulate
    the human features: the Qkf hypomorph shows small eyes, ventrally placed
    ears and long first digits, and germline Kat6b deletion causes premature
    ossification with shortened craniofacial elements, driven by a shift of
    mesenchymal progenitors toward an osteoblast-progenitor state with
    upregulated RUNX2 targets and downregulated SOX9. Convergent dysregulation
    of these programs produces the multisystem SBBYSS phenotype: the mask-like
    face with blepharophimosis and ptosis, long thumbs and great toes, patellar
    and other skeletal anomalies, congenital hypothyroidism, and the
    neurodevelopmental phenotype.

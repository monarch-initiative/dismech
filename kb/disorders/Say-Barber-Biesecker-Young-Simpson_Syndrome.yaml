- name: Reduced histone acetylation and transcriptional dysregulation
  description: >
    KAT6B is a MYST-family histone acetyltransferase that acetylates histone H3
    within a tetrameric chromatin-modifying complex with BRPF1, ING5 (or its
    paralog ING4) and MEAF6, and acts as a transcriptional coactivator. In human cells carrying SBBYSS-specific KAT6B
    mutations and in Kat6b heterozygous mice, KAT6B deficiency reduces histone
    H3 lysine 9 acetylation, and CRISPR-engineered KAT6B truncating alleles
    dysregulate chromatin accessibility and the transcriptome. Loss of
    KAT6B-dependent acetylation is therefore the proximate molecular lesion
    linking the KAT6B variant to abnormal developmental and neuronal gene
    programs; critically, the chromatin lesion is in principle reversible,
    which is the rationale for acetylation-restoring therapeutic strategies.

genetic:
- name: KAT6B
  gene_term:
    preferred_term: KAT6B
    term:
      id: hgnc:17582
      label: KAT6B
  association: CAUSAL
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal dominant
    description: >
      SBBYSS occurs sporadically as an autosomal dominant condition; nearly all
      pathogenic KAT6B variants arise de novo, so recurrence risk for most
      families is low. A single reported family with two affected siblings born
      to non-carrier parents is presumed to reflect gonadal mosaicism, and
      prenatal testing should still be offered. Rare true transmission is
      nonetheless documented: an individual has been reported whose pathogenic
      variant was inherited from a mildly affected parent, so parental testing
      and examination should not be omitted.
    de_novo_rate: ">95"
    evidence:
    - reference: PMID:23236640
      reference_title: "KAT6B Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "KAT6B disorders are inherited in an autosomal dominant manner. To date, most individuals with a KAT6B disorder have had a de novo pathogenic variant."
      explanation: GeneReviews establishes autosomal dominant inheritance with predominantly de novo occurrence.
    - reference: PMID:25424711
      reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Apart from one family, reported so far, where two affected siblings were born to parents who did not carry the variant in blood, and where gonadal mosaicism was presumed, all KAT6B variants have occurred de novo and recurrence risks for most families are low, though prenatal testing should be offered as an option."
      explanation: Quantifies the near-universal de novo origin and documents the single presumed gonadal-mosaicism family, supporting the high de novo rate.
    - reference: PMID:32424177
      reference_title: "Further delineation of the clinical spectrum of KAT6B disorders and allelic series of pathogenic variants."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "We also report an individual in which a pathogenic variant was inherited from a mildly affected parent."
      explanation: Documents genuine parent-to-child transmission with variable expressivity, qualifying the otherwise near-universal de novo origin.
    - reference: PMID:22077973
      reference_title: "Whole-exome-sequencing identifies mutations in histone acetyltransferase gene KAT6B in individuals with the Say-Barber-Biesecker variant of Ohdo syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The condition usually occurs sporadically and is therefore presumed to be due in most cases to new dominant mutations."
      explanation: Documents the sporadic occurrence and new dominant mutation basis of SBBYSS.
  features: >
    SBBYSS results from heterozygous protein-truncating variants in KAT6B
    (10q22.2). Most cluster in the large terminal exon (exon 18), which encodes
    a highly conserved serine- and methionine-rich transcriptional activation
    domain, but variants also occur in exons 15, 16 and 17 and more proximally.
    Two mechanistically distinct positions produce SBBYSS: proximal variants
    subject to nonsense-mediated decay (haploinsufficiency) and variants distal
    to the genitopatellar-syndrome cluster within exon 18. A recurrent de novo
    synonymous variant, c.3147G>A p.(Pro1049Pro) in exon 16, causes SBBYSS by
    creating a cryptic exonic splice acceptor site and is a mutational hot spot.
    Rare whole-gene deletions and translocations disrupting KAT6B produce a
    much milder blepharophimosis-intellectual disability phenotype rather than
    classic SBBYSS.
  evidence:
  - reference: PMID:22077973
    reference_title: "Whole-exome-sequencing identifies mutations in histone acetyltransferase gene KAT6B in individuals with the Say-Barber-Biesecker variant of Ohdo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing was used to confirm truncating mutations of KAT6B, clustering in the final exon of the gene in all four individuals and in a further nine persons with typical SBBYSS."
    explanation: Identifies KAT6B as the causal gene of SBBYSS with truncating variants clustering in the final exon.
  - reference: PMID:26334766
    reference_title: "A recurrent synonymous KAT6B mutation causes Say-Barber-Biesecker/Young-Simpson syndrome by inducing aberrant splicing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SBBYS syndrome-causing mutations are clustered in the large exon 18 of KAT6B and almost exclusively lead to predicted protein truncation."
    explanation: Confirms the exon 18 clustering and near-exclusive protein-truncating nature of SBBYSS alleles.
  - reference: PMID:26334766
    reference_title: "A recurrent synonymous KAT6B mutation causes Say-Barber-Biesecker/Young-Simpson syndrome by inducing aberrant splicing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show on RNA derived from patient blood that the mutation indeed induces aberrant splicing through the use of a cryptic exonic splice acceptor site created by the sequence variant."
    explanation: Functional RNA evidence that the recurrent exon 16 synonymous variant acts by creating a cryptic splice acceptor site.
  - reference: PMID:25424711
    reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Likely causative variants have been identified in 34/57 patients and were commonly located in the terminal exons of KAT6B. Of those where parental samples could be tested, all occurred de novo."
    explanation: A 57-patient cohort confirms terminal-exon localisation and de novo origin of causative KAT6B variants.
  - reference: PMID:28857140
    reference_title: "Say-Barber-Biesecker-Young-Simpson syndrome and Genitopatellar syndrome: Lumping or splitting?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, it is possible to establish a genotype-phenotype correlation when considering the position of the sequence variant along the gene, supporting the notion of the 2 disorders as really distinct entities."
    explanation: Supports a positional genotype-phenotype correlation that keeps SBBYSS and genitopatellar syndrome as distinct entities.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    No population-based prevalence estimate exists for SBBYSS. The condition is
    known only from case reports and small cohorts; the largest single
    ascertainment identified likely causative KAT6B variants in 34 of 57
    referred patients. A 2025 systematic review of the literature counted only
    152 molecularly confirmed KAT6B-related disorder patients across 33 papers,
    of whom the SBBYSS subgroup is a fraction. Orphanet does not publish a
    prevalence class for ORPHA:3047.
  evidence:
  - reference: PMID:40277451
    reference_title: "Phenotypic Characterization of Seven Pediatric Patients Diagnosed With KAT6B-Related Disorders: Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a review of the literature, listing the clinical features of 152 patients described in 33 papers, with a molecularly confirmed diagnosis of KAT6B-related disorders"
    explanation: A complete literature census of only 152 molecularly confirmed KAT6B-related disorder patients supports an ultra-rare, cases-in-literature characterisation.
  - reference: PMID:25424711
    reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on the findings in a previously unreported group of 57 individuals with suggestive features of SBBS or GPS. Likely causative variants have been identified in 34/57 patients"
    explanation: The largest published ascertainment reports only tens of molecularly confirmed cases, supporting an ultra-rare, literature-case-count characterisation rather than a population rate.
diagnosis:
- name: KAT6B molecular genetic testing
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic KAT6B
    variant, in practice by exome sequencing or targeted KAT6B sequencing
    covering all coding exons and splice junctions rather than exon 18 alone.
    Conventional karyotype and chromosomal microarray are frequently normal in
    SBBYSS, so a normal cytogenetic result does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28232779
    reference_title: "De novo KAT6B Mutation Identified with Whole-Exome Sequencing in a Girl with Say-Barber/Biesecker/Young-Simpson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If a patient is suspected of having a blepharophimosis syndrome or SBBYSS, we recommend sequencing the KAT6B gene."
    explanation: States the diagnostic recommendation to sequence KAT6B when SBBYSS or a blepharophimosis syndrome is suspected.
  - reference: PMID:28232779
    reference_title: "De novo KAT6B Mutation Identified with Whole-Exome Sequencing in a Girl with Say-Barber/Biesecker/Young-Simpson Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous genetic testing (array-CGH, 22q11 deletion, PTPN11 and MLL2 mutation analysis) gave normal results. We performed whole-exome sequencing (WES) and identified a heterozygous nonsense mutation in the KAT6B gene"
    explanation: Illustrates that array-CGH and targeted panels can be normal in SBBYSS and that exome sequencing is the effective diagnostic route.
  - reference: PMID:23236640
    reference_title: "KAT6B Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a KAT6B disorder is established by the identification of a heterozygous pathogenic variant in KAT6B on molecular genetic testing."
    explanation: GeneReviews defines molecular identification of a heterozygous pathogenic KAT6B variant as the diagnostic standard.
- name: DNA methylation episignature
  description: >-
    A peripheral-blood genome-wide DNA methylation episignature specific to
    KAT6B-related disorders has been described and can differentiate the two
    KAT6B neurodevelopmental disorders from the highly overlapping KAT6A
    syndrome. It is a downstream biomarker of chromatin-regulator dysfunction
    rather than the causal lesion, and its main curated use is supporting
    reclassification of variants of uncertain significance.
  diagnosis_term:
    preferred_term: genome-wide DNA methylation (episignature) analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  evidence:
  - reference: PMID:37249002
    reference_title: "DNA methylation episignatures are sensitive and specific biomarkers for detection of patients with KAT6A/KAT6B variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study we describe distinct episignatures for KAT6A syndrome, caused by pathogenic variants in the lysine acetyltransferase A gene (KAT6A), and for the two neurodevelopmental disorders associated with lysine acetyl transferase B (KAT6B)."
    explanation: Establishes that a distinct DNA methylation episignature exists for the KAT6B-related neurodevelopmental disorders, including SBBYSS.
  - reference: PMID:37249002
    reference_title: "DNA methylation episignatures are sensitive and specific biomarkers for detection of patients with KAT6A/KAT6B variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate the ability of our models to differentiate between highly overlapping episignatures, increasing the ability to effectively identify and diagnose these conditions."
    explanation: Supports the discriminating diagnostic utility of the episignature across the closely related KAT6A and KAT6B disorders.

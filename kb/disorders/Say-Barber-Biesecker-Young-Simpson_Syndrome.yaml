pathophysiology:
- name: KAT6B protein-truncating variants (proximal NMD-sensitive and distal last-exon alleles)
  description: >
    SBBYSS is caused by heterozygous, almost always de novo, protein-truncating
    variants in KAT6B (10q22.2), which encodes a MYST-family histone
    acetyltransferase. Two distinct allelic classes produce the SBBYSS
    phenotype: (i) variants distributed throughout the gene proximal to the
    terminal exon, whose transcripts undergo nonsense-mediated decay and
    therefore act through haploinsufficiency, and (ii) variants located
    *distally* within the terminal exon (exon 18), distal to the cluster that
    causes genitopatellar syndrome, which escape nonsense-mediated decay but
    are not associated with the gain-of-function activities proposed to explain
    the GPS-specific features. A recurrent de novo synonymous variant in exon 16
    (c.3147G>A, p.(Pro1049Pro)) acts as a splice-site mutation and is a
    mutational hot spot for SBBYSS. This positional distinction is the
    molecular basis for the clinical separation of SBBYSS from the allelic,
    more severe genitopatellar syndrome.

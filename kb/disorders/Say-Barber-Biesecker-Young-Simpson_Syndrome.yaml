    explanation: Defines the tetrameric BRPF1-KAT6B-ING5/ING4-MEAF6 complex within which KAT6B exerts its acetyltransferase activity, establishing the molecular context of the SBBYSS lesion.
  - reference: PMID:39537341
    reference_title: "KAT6B is required for histone 3 lysine 9 acetylation and SOX gene expression in the developing brain."
    supports: SUPPORT

notes: >
  SBBYSS (MONDO:0011365; OMIM:603736; ORPHA:3047) is allelic with genitopatellar
  syndrome (GPS; MONDO:0011640; OMIM:606170), which is curated separately at
  kb/disorders/Genitopatellar_Syndrome.yaml. This entry deliberately models
  SBBYSS as the distinct milder entity: the discriminating SBBYSS features
  (mask-like facies, blepharophimosis/ptosis, long thumbs and great toes,
  lacrimal duct anomalies, congenital hypothyroidism, joint laxity, patellar
  hypoplasia/dislocation rather than aplasia) are curated here, while the
  GPS-restricted features (large-joint flexion contractures, spine/rib/pelvis
  anomalies, renal cysts and hydronephrosis, corpus callosum agenesis, scrotal
  hypoplasia) remain in the GPS entry and are recorded here only as
  differential-diagnosis discriminators.

  Naming and named-entity caution: "Ohdo syndrome" is an umbrella label
  covering several genetically distinct entities. Only the SBBYS variant is
  KAT6B-related. The X-linked Maat-Kievit-Brunner variant is caused by MED12
  variants (see differential diagnoses), the original patients reported by Ohdo
  et al. appear to have had a different condition, and a further recessive
  entity with microcephaly and multiple structural anomalies has been
  described. Literature retrieved under the bare term "Ohdo syndrome" must
  therefore be checked for gene identity before being used as SBBYSS evidence;
  no MED12-related publication is cited as SBBYSS evidence in this entry.

  Discrepancy in the source ontologies: the MONDO textual definition for
  MONDO:0011365 is inherited from an older Orphanet record and states that
  postaxial polydactyly is a feature and that "Autosomal recessive inheritance
  has been suggested". The inheritance statement is superseded by the KAT6B-era
  literature - SBBYSS is autosomal dominant with almost exclusively de novo
  truncating KAT6B variants - and the MONDO definition text is a candidate for
  an upstream fix on that point. The polydactyly statement, by contrast, is
  supported: the 2020 KAT6B cohort of Zhang et al. (PMID:32424177) found that
  distal limb anomalies other than long thumbs and great toes, including
  polydactyly, are more frequent than initially reported, and the current
  Orphanet ORPHA:3047 definition retains polydactyly among the skeletal
  involvement. Polydactyly is therefore curated here as a phenotype without a
  frequency band, rather than dismissed as a legacy error: the supporting
  sources establish the disease-phenotype association but give no denominator
  from which a band could be derived.

  Features present in the KAT6B literature but not promoted to structured
  phenotypes here include microcephaly (SBBYSS individuals often have a smaller
  than average head circumference but usually not frank microcephaly, unlike
  GPS), hypoplastic teeth as a specific dental subtype, and light/noise
  sensitivity. These should be promoted once a directly quotable snippet is
  sourced. Slow growth and small bowel malrotation were promoted on the
  strength of the GeneReviews KAT6B Disorders Clinical Characteristics
  statement (PMID:23236640); keratoconus, recurrent infections and increased
  fracture susceptibility were promoted from the expanded-cohort sentence in
  PMID:34519438; and cerebral anomalies, neurobehavioural difficulties, optic
  nerve hypoplasia and polydactyly were promoted from PMID:32424177. Each of
  these is sourced at the KAT6B-disorder-spectrum level rather than to an
  SBBYSS-only denominator, so none carries a frequency band.

  Frequency-band conventions used in this entry, for the phenotypes where no
  usable denominator exists (docs/frequency-evidence-guidelines.md Pattern D):
  Talipes retains an OCCASIONAL band because the band is declared in its
  evidence explanation as an explicit conservative curator estimate
  (Pattern D option 1). Patellar hypoplasia and postaxial polydactyly instead
  omit the band entirely (Pattern D option 2) - for patellar hypoplasia because
  the one quantitative figure (8/32) comes from a mixed GPS/SBBYSS cohort and
  contradicts the qualitative "typically involves" wording of the other
  sources, and for polydactyly because the source offers only a comparative
  statement at the KAT6B-spectrum level.

  Dosage caveat on the experimental acetylation-restoring strategy: KAT6B is
  dosage-sensitive in both directions. Kat6b haploinsufficiency causes the
  SBBYSS-like mouse phenotype, but KAT6B *overexpression* in mice causes
  aggression, anxiety and epilepsy (PMID:40083716). Any therapeutic aiming to
  raise KAT6B-dependent acetylation therefore has a two-sided therapeutic
  window, which reinforces that the valproic-acid / acetyl-carnitine data
  remain preclinical proof-of-principle rather than a clinical recommendation.

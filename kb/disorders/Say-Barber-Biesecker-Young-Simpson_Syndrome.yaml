  diagnostic: true
  evidence:
  - reference: PMID:22715153
    reference_title: "The KAT6B-related disorders genitopatellar syndrome and Ohdo/SBBYS syndrome have distinct clinical features reflecting distinct molecular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Major criteria: Long thumbs/great toes, immobile mask-like face, blepharophimosis/ptosis, lacrimal duct anomalies, patellar anomalies"
    explanation: Ptosis is one of the proposed major diagnostic criteria for SBBYSS/KAT6B testing.
  - reference: PMID:25424711
    reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."

    evidence_source: MODEL_ORGANISM
    snippet: "we show that germline deletion of the Kat6b gene in mice causes premature ossification in vivo, resulting in shortened craniofacial elements and increased bone density, as well as shortened tibias with an expanded pre-hypertrophic layer, as compared to wild type controls."
    explanation: Germline Kat6b deletion produces skeletal and craniofacial developmental abnormalities in vivo, mechanistically linking KAT6B loss to the skeletal and facial phenotypes.
  - reference: PMID:39832706

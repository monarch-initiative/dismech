- name: Histone-acetylation-restoring therapy (experimental / preclinical)
  description: >
    A preclinical proof-of-principle strategy targets the core epigenetic
    lesion of SBBYSS by restoring histone acetylation. In human cells carrying
    SBBYSS-specific KAT6B mutations and in Kat6b heterozygous mice, the histone
    deacetylase inhibitor valproic acid and the acetyl donor acetyl-carnitine
    (ALCAR) elevated histone acetylation, partially reversed cortical neuronal
    gene-expression changes, improved sociability, and (for ALCAR) restored
    learning and memory. This is postnatal, disease-mechanism-directed therapy
    and is NOT yet clinically validated in humans with SBBYSS.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Reduced histone acetylation and transcriptional dysregulation
    treatment_effect: RESTORES
    description: >-
      Valproic acid (an HDAC inhibitor) and acetyl-carnitine (an acetyl donor)
      act directly on the reduced-histone-acetylation node, raising histone
      acetylation and partially reversing the downstream transcriptional
      dysregulation in KAT6B-deficient cells and mice.
    evidence:
    - reference: PMID:38557491
      reference_title: "Increasing histone acetylation improves sociability and restores learning and memory in KAT6B-haploinsufficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both compounds improved sociability in Kat6b+/- mice, and ALCAR treatment restored learning and memory."
      explanation: Confirms that acting on the reduced-acetylation node produces measurable rescue of the downstream neurobehavioural phenotype.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:38557491
    reference_title: "Increasing histone acetylation improves sociability and restores learning and memory in KAT6B-haploinsufficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both compounds improved sociability in Kat6b+/- mice, and ALCAR treatment restored learning and memory."
    explanation: Preclinical mouse evidence that restoring histone acetylation partially rescues the neurobehavioural phenotype of KAT6B haploinsufficiency.
  - reference: PMID:38557491
    reference_title: "Increasing histone acetylation improves sociability and restores learning and memory in KAT6B-haploinsufficient mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggest that a subset of SBBYSS individuals may benefit from postnatal therapeutic interventions."
    explanation: The authors frame the finding as a hypothesis for a subset of SBBYSS individuals, so the evidence is preclinical and not a validated clinical recommendation.
  - reference: PMID:40083716
    reference_title: "KAT6B overexpression in mice causes aggression, anxiety, and epilepsy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Our results suggest that, in addition to loss-of-function alleles, gain-of-function KAT6B alleles may be detrimental for brain development."
    explanation: Dosage-sensitivity caveat on this strategy. Because excess KAT6B activity is itself detrimental to brain development, raising KAT6B-dependent acetylation has a two-sided therapeutic window, further limiting the strategy to preclinical status.
  - reference: PMID:40083716
    reference_title: "KAT6B overexpression in mice causes aggression, anxiety, and epilepsy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Kat6b overexpression led to an increase in histone H3 lysine 9 acetylation and upregulation of genes driving nervous system development and neuronal differentiation."
    explanation: Shows that the same H3K9 acetylation mark this therapy aims to restore produces an adverse neurobehavioural phenotype when driven above normal, defining the upper bound of the therapeutic window.
differential_diagnoses:
- name: Genitopatellar syndrome
  description: >
    The allelic KAT6B disorder at the severe end of the spectrum
    (MONDO:0011640), curated separately in this knowledge base. GPS is
    distinguished from SBBYSS by large-joint flexion contractures, anomalies of
    the spine, ribs and pelvis, renal cysts and hydronephrosis, and agenesis of
    the corpus callosum, which are markedly more frequent and more severe in
    GPS. These are differences of degree rather than absolute discriminators:
    GeneReviews describes patellar hypoplasia/agenesis, flexion contractures of
    the knees and/or hips and anomalies of the digits, spine and/or ribs as
    features of both KAT6B phenotypes, and individual SBBYSS patients with
    corpus callosum agenesis, hydronephrosis or joint contractures are on
    record. In SBBYSS the contractures are less severe and present more often
    as talipes and overlapping digits than as large-joint contractures. Corpus
    callosum involvement is the nearest thing to a hard discriminator. Long
    thumbs/great toes and lacrimal duct anomalies, conversely, occur only in
    SBBYSS. GPS-causing variants sit in the proximal portion of the last
    exon, SBBYSS-causing variants proximal to the last exon or more distally
    within it. Overlapping intermediate phenotypes are increasingly recognised
    under the umbrella "KAT6B spectrum disorders".
  disease_term:
    preferred_term: Genitopatellar Syndrome
    term:
      id: MONDO:0011640
      label: genitopatellar syndrome
  evidence:
  - reference: PMID:22715153
    reference_title: "The KAT6B-related disorders genitopatellar syndrome and Ohdo/SBBYS syndrome have distinct clinical features reflecting distinct molecular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Features present only in GPS are contractures, anomalies of the spine, ribs and pelvis, renal cysts, hydronephrosis, and agenesis of the corpus callosum. Features present only in SBBYSS include long thumbs and long great toes and lacrimal duct abnormalities."
    explanation: Enumerates the discriminating features that separate SBBYSS from the allelic genitopatellar syndrome.
  - reference: PMID:22715153
    reference_title: "The KAT6B-related disorders genitopatellar syndrome and Ohdo/SBBYS syndrome have distinct clinical features reflecting distinct molecular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A thin or absent corpus callosum is seen in all subjects with GPS whereas this anomaly has not been observed in SBBYSS."
    explanation: Corpus callosum involvement is the strongest single discriminator between GPS and SBBYSS in the 2012 series, though later cohorts qualify it (see the PARTIAL item below).
  - reference: PMID:25424711
    reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Several patients with SBBS had either agenesis of the corpus callosum, hydronephrosis and joint contractures, features more typical of GPS."
    explanation: Qualifies the discriminators, a later and larger cohort found SBBYSS patients with corpus callosum agenesis, hydronephrosis and joint contractures, so these separate the two entities by frequency and severity rather than absolutely.
  - reference: PMID:23236640
    reference_title: "KAT6B Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Both phenotypes are characterized by some degree of global developmental delay / intellectual disability; hypotonia; genital abnormalities; and skeletal abnormalities including patellar hypoplasia/agenesis, flexion contractures of the knees and/or hips, and anomalies of the digits, spine, and/or ribs."
    explanation: GeneReviews attributes patellar, contracture and spine/rib anomalies to both KAT6B phenotypes, confirming that these are shared features differing in degree rather than GPS-exclusive ones.
- name: X-linked Ohdo syndrome (Maat-Kievit-Brunner type)
  description: >
    A genetically distinct blepharophimosis-intellectual disability syndrome
    caused by MED12 variants, not KAT6B. It shares blepharophimosis and
    intellectual disability with SBBYSS but is X-linked and lacks the KAT6B
    facial gestalt, long thumbs/great toes, patellar anomalies and thyroid
    involvement. Distinguishing it from SBBYSS is essential because the
    umbrella term "Ohdo syndrome" spans several genetically separate entities.
  evidence:
  - reference: PMID:25424711
    reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining groups comprised the original patients reported by Ohdo et al,15 The X-linked disorder originally reported by Maat-Kievit et al16 and now known to be due to sequence variants within the MED12 gene,17 and a recessive entity associated with microcephaly and multiple structural anomalies."
    explanation: Documents that the blepharophimosis-intellectual disability group contains genetically distinct entities including the MED12-related X-linked Ohdo syndrome, which must be separated from KAT6B-related SBBYSS.

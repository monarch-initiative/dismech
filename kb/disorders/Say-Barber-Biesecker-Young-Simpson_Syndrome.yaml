phenotypes:
- category: Craniofacial
  name: Blepharophimosis
  description: >
    Severe blepharophimosis (narrow horizontal palpebral fissures) is a
    mandatory diagnostic feature of SBBYSS and one of the major criteria that
    should prompt KAT6B testing.
  phenotype_term:
    preferred_term: Blepharophimosis
    term:
      id: HP:0000581
      label: Blepharophimosis
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:22077973
    reference_title: "Whole-exome-sequencing identifies mutations in histone acetyltransferase gene KAT6B in individuals with the Say-Barber-Biesecker variant of Ohdo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Say-Barber-Biesecker-Young-Simpson syndrome (SBBYSS or Ohdo syndrome) is a multiple anomaly syndrome characterized by severe intellectual disability, blepharophimosis, and a mask-like facial appearance."
    explanation: Blepharophimosis is part of the defining clinical description of SBBYSS.
  - reference: PMID:25424711
    reference_title: "Further delineation of the KAT6B molecular and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typically, patients have a distinctive mask-like face with severe blepharophimosis and ptosis, a broad nasal bridge, bulbous nasal tip, small mouth, thin upper lip and small, low set ears."
    explanation: A 57-patient KAT6B cohort describes severe blepharophimosis as a typical, near-universal SBBYSS facial feature, supporting the VERY_FREQUENT band.
- category: Craniofacial
  name: Mask-like facies

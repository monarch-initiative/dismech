    snippet: "In contrast, subjects with SBBYSS do not have skeletal anomalies but most have long thumbs and great toes, which are not seen in GPS."
    explanation: Long thumbs are present in most SBBYSS subjects and absent in GPS, establishing the association and its diagnostic value; the VERY_FREQUENT band is carried by the quantitative cohort evidence below rather than by the qualitative "most".

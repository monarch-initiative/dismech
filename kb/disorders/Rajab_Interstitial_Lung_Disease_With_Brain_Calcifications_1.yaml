name: Rajab Interstitial Lung Disease With Brain Calcifications 1
creation_date: "2026-09-06T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: FARSB deficiency (Rajab interstitial lung disease with brain calcifications 1)
  term:
    id: MONDO:0100215
    label: Rajab interstitial lung disease with brain calcifications 1
description: >-
  Rajab interstitial lung disease with brain calcifications 1 (RILDBC1) is an
  autosomal recessive multisystem disorder caused by biallelic variants in FARSB,
  the gene for the beta subunit of cytoplasmic phenylalanyl-tRNA synthetase
  (PheRS, also called FARS1). PheRS is an (alpha-beta)2 heterotetramer built from
  the FARSA and FARSB gene products; it charges phenylalanine onto tRNA-Phe, the
  committed step for incorporating phenylalanine into every cytoplasmic protein.
  The disease therefore belongs to the recessive aminoacyl-tRNA-synthetase (ARS1)
  deficiency family alongside LARS1, MARS1, IARS1 and YARS1.
  Its clinical signature is a triad of early interstitial lung disease (often
  histologically pulmonary alveolar proteinosis), intracranial calcifications
  involving the basal ganglia and cerebral cortex, and growth restriction,
  frequently accompanied by hepatic cirrhosis, cerebral aneurysms, microcytic
  anemia, and developmental delay without progressive leukodystrophy or
  retinopathy. Across ARS1 cohorts, respiratory symptoms occur in 86-100% of
  FARSA-, FARSB-, and MARS1-deficient patients (a pooled multi-gene band rather
  than a FARSB-specific point estimate) and usually determine survival.
  Mechanistically, biallelic FARSB variants destabilize both FARSB and its
  obligate heterotetramer partner FARSA, reducing residual fibroblast
  aminoacylation activity with marked thermolability at febrile temperatures,
  although preserved bulk protein synthesis in some compound heterozygotes also
  points toward essential non-translational functions of cytoplasmic PheRS.
parents:
- hereditary disease
- Inborn Error of Metabolism
- Aminoacyl-tRNA Synthetase Deficiency
synonyms:
- RILDBC1
- FARSB deficiency
- phenylalanyl-tRNA synthetase deficiency
- Rajab syndrome
- brain calcification, Rajab type
- interstitial lung and liver disease due to FARSB deficiency
notes: >-
  Gene and enzyme nomenclature: FARSB encodes the beta subunit of the cytoplasmic
  phenylalanyl-tRNA synthetase; the alpha subunit is FARSA, and the functional
  enzyme is an (alpha-beta)2 heterotetramer (PheRS / FARS1). The mitochondrial
  phenylalanyl-tRNA synthetase is a distinct single-subunit enzyme (FARS2) that
  causes combined oxidative phosphorylation deficiency and epileptic
  encephalopathy rather than interstitial lung disease with brain calcifications.

  Scope boundary: This entry curates RILDBC1 (MONDO:0100215, FARSB; OMIM 613658).
  RILDBC2 (FARSA; OMIM 619013) disables the partner subunit of the same
  heterotetramer and produces a clinically near-identical disorder under the
  parent grouping MONDO:0100214.

  Mechanistic duality: Fibroblast studies in compound-heterozygous patients
  demonstrate severe co-depletion of both FARSB and FARSA subunits
  (PMID:29573043) and ~72% loss of aminoacylation activity that collapses further
  at 38.5-40 degrees Celsius and under phenylalanine limitation (PMID:34194004).
  Conversely, Xu et al. (PMID:29979980) observed preserved bulk protein synthesis
  in cells from compound-heterozygous patients carrying a splice-site frameshift
  and missense allele, suggesting an additional non-translational PheRS role in
  visceral organs.

  Frequency attribution: Cohort percentages from PMID:40044141 represent pooled
  bands across subsets of cytoplasmic ARS1 genes rather than RILDBC1-specific
  denominators, as fewer than two dozen FARSB-deficient individuals have been
  reported worldwide.

  GeneReviews and ClinGen status: No GeneReviews chapter exists for FARSB or
  RILDBC1 (the nearby GeneReviews chapter covers mitochondrial FARS2), and
  ClinGen currently carries no gene-disease validity assertion for FARSB.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
    notes: >-
      Interstitial lung disease (including pulmonary alveolar proteinosis) is
      near-universal in FARSB deficiency and is the primary determinant of
      survival.
    evidence:
    - reference: PMID:40044141
      reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Respiratory symptoms, mainly consisting of pulmonary alveolar proteinosis (interstitial lung disease), are extremely common in FARSA‐, FARSB‐, and MARS1‐deficiency (86%–100%)"
      explanation: Establishes dominant respiratory involvement in FARSB deficiency.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:30014610
      reference_title: "Homozygosity for FARSB mutation leads to Phe-tRNA synthetase-related disease of growth restriction, brain calcification, and interstitial lung disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe eight affected individuals from an extended family with a multisystemic recessive disease manifest as a significant growth restriction, brain calcifications, and interstitial lung disease."
      explanation: Establishes brain calcifications and neurodevelopmental involvement as core disease manifestations.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:29979980
      reference_title: Bi-allelic Mutations in Phe-tRNA Synthetase Associated with a Multi-system Pulmonary Disease Support Non-translational Function.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We present here five individuals from four families with a multi-system disease associated with bi-allelic mutations in FARSB that encodes the beta chain of the alpha2beta2 phenylalanine-tRNA synthetase (FARS)."
      explanation: Establishes RILDBC1 as an autosomal recessive monogenic multisystem disorder caused by biallelic FARSB variants.
  icimd_category:
  - classification_value: non_mitochondrial_trna_metabolism
    notes: >-
      FARSB encodes the beta subunit of the cytoplasmic phenylalanyl-tRNA
      synthetase, placing the disorder among cytosolic (non-mitochondrial) tRNA
      aminoacylation defects.
    evidence:
    - reference: PMID:29573043
      reference_title: Compound heterozygosity for loss-of-function FARSB variants in a patient with classic features of recessive aminoacyl-tRNA synthetase-related disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The charging of tRNAPHE with phenylalanine is performed by a tetrameric enzyme that contains two alpha (FARSA) and two beta (FARSB) subunits."
      explanation: Confirms FARSB encodes a subunit of the cytosolic phenylalanyl-tRNA synthetase heterotetramer.

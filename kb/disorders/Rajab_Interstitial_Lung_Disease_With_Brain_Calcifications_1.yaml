    cited by this entry makes this claim about FARSB specifically.
    The evidence attached below is a cross-ARS1 frequency and is graded INDIRECT
    for exactly that reason. This phenotype needs re-evidencing from the FARSB
    primary literature before it should be relied on.
  phenotype_term:
    preferred_term: intracranial calcification
    term:
      id: HP:0002514
      label: Cerebral calcification
  evidence:
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "includes, for example, abnormal cerebral white matter morphology, cerebral/cerebellar atrophy/dysplasia, cerebral calcification, CNS demyelination"
    explanation: >-
      Establishes only that cerebral calcification is among the CNS imaging
      abnormalities seen across the ARS1 deficiencies. It does not name FARSB,
      so it supports this phenotype at one inferential remove and no further.

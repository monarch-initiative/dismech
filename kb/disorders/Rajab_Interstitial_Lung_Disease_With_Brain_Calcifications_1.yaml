- category: Hepatic
  name: Liver Disease
  description: >-
    Liver involvement, which in the characterised FARSB patient progressed to
    fatal liver failure. NOTE a discrepancy inside this entry's principal
    source, surfaced here rather than resolved: that paper's per-symptom
    sentence lists the liver-disease-prone ARS1 genes and FARSB is NOT among
    them, while the same paper's clustering analysis places FARSB in a cluster
    whose shared features include liver disease. Both statements are cited
    below. The FARSB patient in the treatment study did die of liver failure,
    which favours the cluster reading, but the frequency in FARSB deficiency
    should be treated as unsettled until the primary literature is available.

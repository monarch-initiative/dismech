name: Rajab Interstitial Lung Disease With Brain Calcifications 1
creation_date: "2026-09-06T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: FARSB deficiency (Rajab interstitial lung disease with brain calcifications 1)
  term:
    id: MONDO:0100215
    label: Rajab interstitial lung disease with brain calcifications 1
description: >-
  Rajab interstitial lung disease with brain calcifications 1 (RILDBC1) is an
  autosomal recessive multisystem disorder caused by biallelic variants in FARSB,
  the gene for the beta subunit of CYTOPLASMIC phenylalanyl-tRNA synthetase
  (PheRS, also called FARS1). PheRS is an (alpha-beta)2 heterotetramer built from
  the FARSA and FARSB gene products; it charges phenylalanine onto tRNA-Phe, the
  committed step for incorporating phenylalanine into every cytoplasmic protein.
  The disease therefore belongs to the recessive aminoacyl-tRNA-synthetase (ARS1)
  deficiency family alongside LARS1, MARS1, IARS1 and YARS1.
  Its clinical signature is a triad: early interstitial lung disease,
  intracranial calcification, and growth restriction. The lung phenotype is the
  one that most often brings the child to attention and most often determines
  survival; the cited source characterises it as pulmonary alveolar proteinosis
  presenting radiologically as interstitial lung disease, and places it in an
  86-100% band. Note that band spans FARSA, FARSB and MARS1 deficiency
  collectively; it is not a FARSB point estimate. It does sit wholly inside the
  VERY_FREQUENT tier either way, which is why the phenotype below carries that
  frequency where the growth and anemia phenotypes carry none. Liver involvement, anemia and
  developmental delay complete the picture. The finer radiological and
  histological detail usually given for this disease - bilateral symmetric
  basal-ganglia calcification with preserved myelination, and cholesterol
  granulomas on lung biopsy - is deliberately NOT asserted here, because no
  reference cited by this entry states it for FARSB; see `notes`,
  which records it as a lead together with the papers to fetch.
  Two features place the disease inside a wider ARS1 pattern rather than making it
  an isolated oddity. First, systematic phenotype comparison across ARS1
  deficiencies puts FARSB with FARSA, IARS1, LARS1, MARS1 and YARS1 in a single
  multisystem cluster defined by growth abnormality, liver disease,
  hypoalbuminemia and interstitial lung disease - which is to say the lung and
  liver phenotype is a property of this branch of the ARS1 family, not of FARSB
  alone. That cluster membership is the source's own clustering result; note
  that the same source's per-symptom sentences for liver disease and for
  hypoalbuminemia both omit FARSB, so neither is asserted here as a FARSB
  frequency (see the Liver Disease phenotype, which records the discrepancy,
  and `notes`). Second, residual aminoacylation in FARSB patient fibroblasts falls
  further when the cells are warmed, the same temperature sensitivity documented
  in LARS1 deficiency, which supplies a mechanism for clinical deterioration
  during febrile illness.
parents:
- hereditary disease
- Inborn Error of Metabolism
- Aminoacyl-tRNA Synthetase Deficiency
synonyms:
- RILDBC1
- FARSB deficiency
- phenylalanyl-tRNA synthetase deficiency
- Rajab syndrome
- brain calcification, Rajab type
- interstitial lung and liver disease due to FARSB deficiency
notes: >-
  Gene and enzyme nomenclature. FARSB encodes the BETA subunit of the cytoplasmic
  phenylalanyl-tRNA synthetase; the alpha subunit is FARSA, and the functional
  enzyme is an (alpha-beta)2 heterotetramer. The cited papers variously call the
  enzyme PheRS, FARS, FARS1 or "phenylalanyl-RS", and abbreviate the gene FARSB
  or FARS-beta; quoted snippets preserve whichever form the source used. The
  MITOCHONDRIAL phenylalanyl-tRNA synthetase is a different, single-subunit
  enzyme (FARS2) causing a different disease, and is not curated here.

  Scope boundary. This entry is the FARSB entity (RILDBC1) only. RILDBC2
  (MONDO has it as a sibling) is caused by FARSA and is clinically near-identical
  because it disables the same heterotetramer; it is a separate entry and is not
  curated here. The MONDO parent, `Rajab interstitial lung disease with brain
  calcifications` (MONDO:0100214), is the grouping over both.

  Evidence base, and the gap it leaves. Every citation in this entry comes from
  three ARS1-family papers that carry FARSB-specific data: a 438-patient
  cross-ARS1 phenotype and treatment review (PMID:40044141), the
  aminoacylation/thermostability/amino-acid-treatment study whose FARSB patient
  is individually characterised (PMID:34194004), and a tRNA therapeutics review
  covering the same treated cohort (PMID:39702998). The disease-defining primary
  literature is cited NOWHERE. Fetching it and re-grounding the entry on it is
  the highest-value follow-up on this file:

  PMID:29979980 (Xu et al. 2018, Am J Hum Genet) - the FARSB gene-disease paper
  and the source of the non-translational-function argument, with quotable
  sentences for brain calcification, cholesterol pneumonitis and cerebral
  aneurysm; PMID:30014610 (Zadjali et al. 2018, Hum Mutat) - the Omani founder
  allele c.853G>A p.Glu285Lys; PMID:29573043 (Antonellis et al. 2018) - the
  compound-heterozygous patient with the ~97% FARSB / ~66% FARSA protein
  reduction; PMID:19161147 (Rajab et al. 2009, Am J Med Genet A) - the founding
  clinical and linkage description; then Schuch et al. 2021 (Clin Genet) and
  Karimzadeh et al. 2022.

  What that costs, named precisely. The brain calcification that gives the
  disease its name has NO FARSB-specific citation - it carries only a cross-ARS1
  CNS-imaging sentence graded INDIRECT. Cholesterol pneumonitis, the
  characteristic lung histology, and cerebral aneurysm are omitted entirely.
  Three of the five alleles under `genetic` are recorded without evidence. All
  four gaps have the same cause and the same fix.

  Every frequency in this entry is a cross-ARS1 cohort figure, not a RILDBC1
  figure, and the explanations say so individually. Roughly 10-20 patients have
  been described worldwide, so no percentage should ever be attributed to this
  disease on its own denominator.

  Two mechanistic features are reported in the literature but deliberately NOT
  asserted here, for want of a citable source: FARSB loss co-depletes its
  obligate heterotetramer partner FARSA, making the lesion a loss of the whole
  (alpha-beta)2 holoenzyme rather than of one subunit; and the intracranial
  calcification is described as bilateral, symmetric and accompanied by
  PRESERVED myelination, which is what separates it clinically from
  Aicardi-Goutieres syndrome and the leukodystrophies.

  Term caches. The derived `cache/` rows for the five CURIEs new to this
  repository - MONDO:0100215, hgnc:17800, GO:0004826, GO:0006432 and
  CHEBI:17295 - are not committed, so term validation network-fetches them
  rather than reading the cache. All five have been confirmed to resolve with
  labels matching this file. Run `just validate-terms` on this file then
  `just normalize-cache`, and commit the rows.

  GeneReviews. Checked; there is no chapter for FARSB or RILDBC1. The nearby
  chapter is for FARS2, a different gene and a different disease - see
  `differential_diagnoses`. A genuine absence, recorded so the search is not
  repeated.

  Cross-references identified but not bound: OMIM #613658 (phenotype),
  OMIM *609690 (gene), ORPHA:178506, MedGen C3150910, NCBI Gene 10056; FARSB
  maps to 2q36.1. These are NOT in a `mappings:` block because
  `DiseaseMappings` in this schema admits only `icd10cm_mappings`,
  `icd11f_mappings`, `mondo_mappings` and `ncit_mappings` - there is no OMIM,
  Orphanet or MedGen slot. Adding one would be a schema change.

  Full curation provenance, including why the primary literature could not be
  fetched during curation, is in the `history/` records for this entry rather
  than here.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
    notes: >-
      Assigned on the organ system that determines outcome rather than the one
      that names the disease. Interstitial lung disease is near-universal in
      FARSB deficiency and is the usual cause of death, while the intracranial
      calcification which gives the disease its name is an imaging finding whose
      clinical weight is much lower. This differs from the sibling cytoplasmic-ARS
      entry Neurodevelopmental_Disorder_with_Microcephaly_Seizures_and_Cortical_Atrophy
      (VARS1), which is NEUROLOGIC because its presentation is essentially
      confined to the CNS; here the CNS findings coexist with a dominant
      pulmonary and hepatic picture.
    evidence:
    - reference: PMID:40044141
      reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Respiratory symptoms, mainly consisting of pulmonary alveolar proteinosis (interstitial lung disease), are extremely common in FARSA‐, FARSB‐, and MARS1‐deficiency (86%–100%)"
      explanation: The respiratory involvement, at the frequency that makes it the chapter-determining organ system.
  icimd_category:
  - classification_value: non_mitochondrial_trna_metabolism
    notes: >-
      FARSB encodes the beta subunit of the CYTOPLASMIC phenylalanyl-tRNA
      synthetase, so the disorder belongs with the non-mitochondrial tRNA
      metabolism disorders, alongside the other cytoplasmic ARS1 deficiencies.
      The mitochondrial counterpart enzyme is FARS2 and is a different disease -
      see `differential_diagnoses`.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic FARSB variants. The individually characterised patient in the
    treatment study carried two different FARSB alleles in trans, a start-loss
    and a missense, which is the compound-heterozygous configuration expected of
    a recessive disease outside a consanguineous kindred.
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFARSB: compound heterozygous FARSB-variants (NM_005687.5): c.3G>T p.Met1? and c.1118G>C p.Gly373Ala (OMIM 609690)"
    explanation: Documents biallelic FARSB variants in trans in an affected individual, with the transcript and both allele descriptions.
genetic:
- name: FARSB
  gene_term:
    preferred_term: FARSB
    term:
      id: hgnc:17800
      label: FARSB
  relationship_type: CAUSATIVE
  notes: >-
    FARSB encodes the beta subunit of cytoplasmic phenylalanyl-tRNA synthetase.
    Biallelic damaging variants reduce, but do not abolish, aminoacylation
    capacity - the characterised patient retained 28% of control FARS activity,
    which is the quantitative statement of why this is a hypomorphic rather than
    a null disease and why residual function can be pushed over a cliff by fever
    or by phenylalanine limitation.

    On the allele list below: it comes from the deep-research report accompanying
    this PR and is deliberately unevidenced except for the first pair. Each of the
    three remaining alleles has a real published source, named in its description
    and in the entry `notes`; none of those papers could be fetched into
    `references_cache/`, and an
    evidence item whose snippet cannot be checked against a committed cache file
    is exactly the pattern CLAUDE.md warns produces a silent CI pass. Ground these
    properly when the papers are cached.
  variants:
  - name: c.3G>T p.Met1?
    description: >-
      Start-loss allele, in trans with c.1118G>C in the patient whose fibroblasts
      give the 28% residual-activity and thermolability measurements cited here.
      This is the one allele pair in this entry that carries a verified quote.
  - name: c.1118G>C p.Gly373Ala
    description: Missense allele, in trans with the start-loss above.
  - name: c.853G>A p.Glu285Lys
    description: >-
      Homozygous founder allele reported in an extended consanguineous Omani
      kindred. Recorded WITHOUT evidence: the reporting paper (PMID:30014610) is
      not in this repository's reference cache, so no quote can be verified
      against it. See `notes`.
  - name: c.767C>T p.Thr256Met
    description: >-
      Missense allele reported compound heterozygous with a frameshift
      (c.1486delCinsAA p.His496LysfsTer14) in the patient showing ~97% reduction
      of FARSB protein and ~66% of FARSA. Recorded without evidence for the same
      reason as above (PMID:29573043 is uncached).
  - name: c.848+1G>A
    description: >-
      Splice-donor allele. Recorded without evidence for the same reason
      (PMID:29979980 is uncached).
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed pathogenicity of the variants with decreased aminoacylation activity in patient-derived fibroblasts to 23% and 21% IARS activity in PIARS and PIARS-2, respectively, 27% LARS activity in PLARS, 28% FARS activity in PFARSB"
    explanation: Functional confirmation that the FARSB genotype produces a partial, quantified loss of phenylalanyl-tRNA synthetase activity in patient cells.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Roughly 10-20 individuals have been reported worldwide, across a small number
    of kindreds and case series. Recorded WITHOUT evidence: Orphanet gives a point
    prevalence of <1/1,000,000 for ORPHA:178506, but this repository's Orphanet

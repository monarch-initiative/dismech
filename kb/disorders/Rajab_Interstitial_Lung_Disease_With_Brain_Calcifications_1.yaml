name: Rajab Interstitial Lung Disease With Brain Calcifications 1
creation_date: "2026-09-06T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: FARSB deficiency (Rajab interstitial lung disease with brain calcifications 1)
  term:
    id: MONDO:0100215
    label: Rajab interstitial lung disease with brain calcifications 1
description: >-
  Rajab interstitial lung disease with brain calcifications 1 (RILDBC1) is an
  autosomal recessive multisystem disorder caused by biallelic variants in FARSB,
  the gene for the beta subunit of CYTOPLASMIC phenylalanyl-tRNA synthetase
  (PheRS, also called FARS1). PheRS is an (alpha-beta)2 heterotetramer built from
  the FARSA and FARSB gene products; it charges phenylalanine onto tRNA-Phe, the
  committed step for incorporating phenylalanine into every cytoplasmic protein.
  The disease therefore belongs to the recessive aminoacyl-tRNA-synthetase (ARS1)
  deficiency family alongside LARS1, MARS1, IARS1 and YARS1.
  Its clinical signature is a triad: early interstitial lung disease,
  intracranial calcification, and growth restriction. The lung phenotype is the
  one that most often brings the child to attention and most often determines
  survival; the cited source characterises it as pulmonary alveolar proteinosis
  presenting radiologically as interstitial lung disease, and reports it in
  86-100% of FARSB-deficient patients. Liver involvement, anemia and
  developmental delay complete the picture. The finer radiological and
  histological detail usually given for this disease - bilateral symmetric
  basal-ganglia calcification with preserved myelination, and cholesterol
  granulomas on lung biopsy - is deliberately NOT asserted here, because no
  reference available to this curation session states it for FARSB; see `notes`,
  which records it as a lead together with the papers to fetch.
  Two features place the disease inside a wider ARS1 pattern rather than making it
  an isolated oddity. First, systematic phenotype comparison across ARS1
  deficiencies puts FARSB with FARSA, IARS1, LARS1, MARS1 and YARS1 in a single
  multisystem cluster defined by growth abnormality, liver disease,
  hypoalbuminemia and interstitial lung disease - which is to say the lung and
  liver phenotype is a property of this branch of the ARS1 family, not of FARSB
  alone. That cluster membership is the source's own clustering result; note
  that the same source's per-symptom sentences for liver disease and for
  hypoalbuminemia both omit FARSB, so neither is asserted here as a FARSB
  frequency (see the Liver Disease phenotype, which records the discrepancy,
  and `notes`). Second, residual aminoacylation in FARSB patient fibroblasts falls
  further when the cells are warmed, the same temperature sensitivity documented
  in LARS1 deficiency, which supplies a mechanism for clinical deterioration
  during febrile illness.
parents:
- hereditary disease
- Inborn Error of Metabolism
- Aminoacyl-tRNA Synthetase Deficiency
synonyms:
- RILDBC1
- FARSB deficiency
- phenylalanyl-tRNA synthetase deficiency
- Rajab syndrome
- brain calcification, Rajab type
- interstitial lung and liver disease due to FARSB deficiency
notes: >-
  Gene and enzyme nomenclature. FARSB encodes the BETA subunit of the cytoplasmic
  phenylalanyl-tRNA synthetase; the alpha subunit is FARSA, and the functional
  enzyme is an (alpha-beta)2 heterotetramer. The cited papers variously call the
  enzyme PheRS, FARS, FARS1 or "phenylalanyl-RS", and abbreviate the gene FARSB
  or FARS-beta; quoted snippets preserve whichever form the source used. The
  MITOCHONDRIAL phenylalanyl-tRNA synthetase is a different, single-subunit
  enzyme (FARS2) causing a different disease, and is not curated here.

  Scope boundary. This entry is the FARSB entity (RILDBC1) only. RILDBC2
  (MONDO has it as a sibling) is caused by FARSA and is clinically near-identical
  because it disables the same heterotetramer; it is a separate entry and is not
  curated here. The MONDO parent, `Rajab interstitial lung disease with brain
  calcifications` (MONDO:0100214), is the grouping over both.

  Evidence base and its limits - read this before extending the entry. This
  entry was curated in a sandbox whose network egress policy returned 403 for
  NCBI E-utilities and for the EBI OLS ontology service. That block is a
  property of THAT sandbox, not of this repository and not of CI: the PR
  reviewer re-ran the same fetches on a CI runner and they succeed there. The
  consequence for the entry is nonetheless real and still stands, because no
  reference could be cached while it was being written.

  Every citation below therefore comes from the pre-existing
  `references_cache/`, which contains no FARSB-specific primary paper. The three
  cited sources are ARS1-family papers that do carry genuine FARSB-specific
  data: a 438-patient cross-ARS1 phenotype and treatment review
  (PMID:40044141), the aminoacylation/thermostability/amino-acid-treatment study
  whose FARSB patient is individually characterised (PMID:34194004), and a tRNA
  therapeutics review summarising the same treated cohort (PMID:39702998).

  The disease-defining primary literature is cited NOWHERE below. Fetch these,
  commit the cache files, and re-ground the entry on them - this is the single
  highest-value piece of follow-up work on this file:
  PMID:29979980 (Xu et al. 2018, Am J Hum Genet - the FARSB gene-disease paper
  and the source of the non-translational-function argument; the reviewer
  reports its cached full text runs to ~61,000 characters);
  PMID:30014610 (Zadjali et al. 2018, Hum Mutat - the Omani founder allele
  c.853G>A p.Glu285Lys); PMID:29573043 (Antonellis et al. 2018 - the
  compound-heterozygous patient with the ~97% FARSB / ~66% FARSA protein
  reduction); PMID:19161147 (Rajab et al. 2009, Am J Med Genet A - the founding
  clinical and linkage description); then Schuch et al. 2021 (Clin Genet) and
  Karimzadeh et al. 2022.

  The specific, named gap this leaves: the brain calcification that gives the
  disease its name has NO FARSB-specific citation. It carries only a cross-ARS1
  CNS-imaging sentence graded INDIRECT. Cholesterol pneumonitis (the
  characteristic lung histology) and cerebral aneurysm are omitted entirely for
  the same reason, as is the variant-level evidence for three of the five
  alleles listed under `genetic`. The PR review quotes verbatim, FARSB-specific
  sentences from PMID:29979980 and PMID:30014610 that would settle all of these
  at once. They are deliberately NOT pasted in here: an evidence snippet whose
  source has no committed `references_cache/` file cannot be checked offline,
  while `just validate-disorders` in CI would silently network-fetch it and
  report it verified - which is precisely the failure mode CLAUDE.md warns about
  under "Re-derive the cited-PMID list immediately before pruning uncited
  caches". Whoever can run `just fetch-reference` should do the fetch and the
  re-grounding together, in one commit, so the quote and its cache file land
  as a unit.

  Term-validation state. Schema validation passes and every evidence snippet
  verifies against the cache. Term validation could not COMPLETE in the curation
  sandbox because OLS was blocked; run offline against the committed cache, the
  CURIEs new to this repository do not resolve. That is an artifact of the
  sandbox: the PR reviewer ran `just validate` with network and reports that
  MONDO:0100215 and hgnc:17800 both resolve with labels matching this file
  exactly, and that GO:0004826, GO:0006432 and CHEBI:17295 resolve too - all
  five are now bound above on the strength of that check rather than a local
  one. What is still outstanding is mechanical: the derived rows for these
  CURIEs in `cache/mondo/terms.csv`, `cache/hgnc/terms.csv`, `cache/go/terms.csv`,
  `cache/chebi/terms.csv` and the relevant `cache/enums/*.csv` are NOT committed,
  because nothing in the sandbox could derive them. Run `just validate-terms` on
  this file then `just normalize-cache`, and commit the rows.

  GeneReviews. Checked, and there is no GeneReviews chapter for FARSB or for
  RILDBC1. The nearby chapter is for FARS2, a different gene and a different
  disease - see `differential_diagnoses`. This is a genuine absence, not a
  skipped baseline; recorded so the search is not repeated.

  Cross-references identified but not bound: OMIM #613658 (phenotype),
  OMIM *609690 (gene), ORPHA:178506, MedGen C3150910, NCBI Gene 10056; FARSB
  maps to 2q36.1. These are NOT in a `mappings:` block because `DiseaseMappings`

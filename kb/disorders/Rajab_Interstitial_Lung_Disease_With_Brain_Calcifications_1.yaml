treatments:
- name: L-Phenylalanine Supplementation
  description: >-
    Supplementation with the cognate amino acid, the rationale being that the
    hypomorphic synthetase is substrate-limited rather than absent, so raising
    phenylalanine availability should recover aminoacylation flux. Patient
    fibroblasts supply the direct rationale: they fail dose-dependently as
    phenylalanine falls. The evidence in patients is early and must not be
    overstated - the reported FARSB patient received 40-100 mg/kg/day and died
    soon after starting, of complications of liver failure that predated
    treatment. The cohort-level reports of improvement pool several ARS1
    genotypes and are not FARSB-specific outcome data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: cognate amino acid supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_mechanisms:
  - target: Translation Failure Under Phenylalanine Limitation
    description: >-
      Raising extracellular phenylalanine is intended to act on the substrate
      limitation that makes translation conditional in these cells.
    evidence:
    - reference: PMID:34194004
      reference_title: Treatment of ARS deficiencies with specific amino acids.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patient fibroblast proliferation was normal at high concentrations, but decreased in a dose-dependent manner at lower concentrations of isoleucine for PIARS and PIARS-2, leucine for PLARS, and phenylalanine for PFARSB"
      explanation: The dose-response that supplies the mechanistic rationale for targeting this node with phenylalanine.
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFARSB and PSARS received L-phenylalanine (40–100 mg/kg/day), and L-serine (85.7–97.5 mg/kg/day), respectively"
    explanation: The administered L-phenylalanine dose range in the reported FARSB patient, which is the dose this entry's description states.
  - reference: PMID:39702998
    reference_title: Transfer RNA and small molecule therapeutics for aminoacyl-tRNA synthetase diseases.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients were subsequently treated with the amino acid (l‐isoleucine, l‐leucine, l‐phenylalanine or l‐serine) cognate to the defective aaRS, and all patients improved over the course of the treatment, with noticeable improvements in growth, head circumference, development, and oxygen dependency"
    explanation: >-
      Reports cohort-level improvement on cognate amino acid supplementation,
      L-phenylalanine being the arm relevant to FARSB. Supports the approach at
      the level of the ARS1 cohort, not of FARSB outcomes specifically.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients tolerated the treatment well"
    explanation: Supports the tolerability of cognate amino acid supplementation across the treated ARS1 cohort.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment did not alleviate the most severe phenotypes"
    explanation: >-
      Cuts against efficacy where it matters most for this disease, whose FARSB
      presentation sits at the severe end. This is the paper's own negative
      conclusion rather than an inference from a single death.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient with FARSB‐deficiency, with a severe phenotype, died relatively soon after starting the treatment due to complications of pre‐treatment liver failure"
    explanation: >-
      The only FARSB-specific treatment outcome reported: the one treated FARSB
      patient died shortly after starting. Note the paper attributes the death
      to liver failure that predated treatment, so this refutes benefit in this
      genotype without attributing harm to the treatment.
- name: Supportive Respiratory Care
  description: >-
    Oxygen supplementation and general supportive care for the interstitial lung

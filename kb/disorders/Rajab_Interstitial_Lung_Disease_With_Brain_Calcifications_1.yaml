    explanation: Documents biallelic FARSB variants in trans in an affected individual, with the transcript and both allele descriptions.
genetic:
- name: FARSB
  gene_term:
    preferred_term: FARSB
    term:
      id: hgnc:17800
      label: FARSB
  relationship_type: CAUSATIVE
  notes: >-
    FARSB encodes the beta subunit of cytoplasmic phenylalanyl-tRNA synthetase.
    Biallelic damaging variants reduce, but do not abolish, aminoacylation
    capacity - the characterised patient retained 28% of control FARS activity,
    which is the quantitative statement of why this is a hypomorphic rather than
    a null disease and why residual function can be pushed over a cliff by fever
    or by phenylalanine limitation.
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed pathogenicity of the variants with decreased aminoacylation activity in patient-derived fibroblasts to 23% and 21% IARS activity in PIARS and PIARS-2, respectively, 27% LARS activity in PLARS, 28% FARS activity in PFARSB"
    explanation: Functional confirmation that the FARSB genotype produces a partial, quantified loss of phenylalanyl-tRNA synthetase activity in patient cells.
pathophysiology:

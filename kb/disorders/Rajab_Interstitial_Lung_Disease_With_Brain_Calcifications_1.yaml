- name: Temperature-Sensitive Collapse of Residual Aminoacylation
  biological_scale: MOLECULAR
  description: >-
    The residual enzyme is thermolabile. Aminoacylation in patient fibroblasts
    does not merely sit low at 37 degrees Celsius; it falls further on warming,
    reaching zero at 40 degrees in the characterised FARSB patient. This is the
    mechanistic account of why these children decompensate during febrile
    illness, when body temperature and translational demand rise together, and it
    is the same behaviour documented in LARS1 deficiency.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Translation Failure Under Phenylalanine Limitation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LARS activity of PLARS decreased to 5%, and FARS activity of"
    explanation: The thermostability measurement itself, showing residual FARS activity falling with temperature in the FARSB patient's fibroblasts.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In some patients with LARS1‐ and FARSB‐deficiency, aminoacylation deficiency in fibroblasts worsened during higher temperatures, which could be reflective of clinical deterioration during infections"
    explanation: States the temperature sensitivity for FARSB specifically and links it to clinical deterioration during infection.
- name: Translation Failure Under Phenylalanine Limitation
  biological_scale: CELLULAR
  description: >-
    With a crippled synthetase, cytoplasmic translation becomes conditional on
    phenylalanine supply. Patient fibroblasts grow normally when phenylalanine is
    plentiful and fail dose-dependently as it falls, whereas control cells do not
    - so the cellular lesion is not a fixed translational deficit but a loss of
    reserve. Tissues with the highest secretory protein throughput and the
    fastest growth are therefore the ones that fail first.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: cytoplasmic translation
    term:
      id: GO:0002181
      label: cytoplasmic translation
    modifier: DECREASED
  downstream:

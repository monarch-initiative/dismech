name: Rajab Interstitial Lung Disease With Brain Calcifications 1
creation_date: "2026-09-06T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: FARSB deficiency (Rajab interstitial lung disease with brain calcifications 1)
  term:
    id: MONDO:0100215
    label: Rajab interstitial lung disease with brain calcifications 1
description: >-
  Rajab interstitial lung disease with brain calcifications 1 (RILDBC1) is an
  autosomal recessive multisystem disorder caused by biallelic variants in FARSB,
  the gene for the beta subunit of CYTOPLASMIC phenylalanyl-tRNA synthetase
  (PheRS, also called FARS1). PheRS is an (alpha-beta)2 heterotetramer built from
  the FARSA and FARSB gene products; it charges phenylalanine onto tRNA-Phe, the
  committed step for incorporating phenylalanine into every cytoplasmic protein.
  The disease therefore belongs to the recessive aminoacyl-tRNA-synthetase (ARS1)
  deficiency family alongside LARS1, MARS1, IARS1 and YARS1.
  Its clinical signature is a triad: early interstitial lung disease,
  intracranial calcification, and growth restriction. The lung phenotype is the
  one that most often brings the child to attention and most often determines
  survival; the cited source characterises it as pulmonary alveolar proteinosis
  presenting radiologically as interstitial lung disease, and reports it in
  86-100% of FARSB-deficient patients. Liver involvement, anemia and
  developmental delay complete the picture. The finer radiological and
  histological detail usually given for this disease - bilateral symmetric
  basal-ganglia calcification with preserved myelination, and cholesterol
  granulomas on lung biopsy - is deliberately NOT asserted here, because no
  reference available to this curation session states it for FARSB; see `notes`,
  which records it as a lead together with the papers to fetch.
  Two features place the disease inside a wider ARS1 pattern rather than making it
  an isolated oddity. First, systematic phenotype comparison across ARS1
  deficiencies puts FARSB with FARSA, IARS1, LARS1, MARS1 and YARS1 in a single
  multisystem cluster defined by growth abnormality, liver disease,
  hypoalbuminemia and interstitial lung disease - which is to say the lung and
  liver phenotype is a property of this branch of the ARS1 family, not of FARSB
  alone. Second, residual aminoacylation in FARSB patient fibroblasts falls
  further when the cells are warmed, the same temperature sensitivity documented
  in LARS1 deficiency, which supplies a mechanism for clinical deterioration
  during febrile illness.
parents:
- hereditary disease
- Inborn Error of Metabolism
- Aminoacyl-tRNA Synthetase Deficiency
synonyms:
- RILDBC1
- FARSB deficiency
- phenylalanyl-tRNA synthetase deficiency
- Rajab syndrome
- brain calcification, Rajab type
- interstitial lung and liver disease due to FARSB deficiency
notes: >-
  Gene and enzyme nomenclature. FARSB encodes the BETA subunit of the cytoplasmic
  phenylalanyl-tRNA synthetase; the alpha subunit is FARSA, and the functional
  enzyme is an (alpha-beta)2 heterotetramer. The cited papers variously call the
  enzyme PheRS, FARS, FARS1 or "phenylalanyl-RS", and abbreviate the gene FARSB
  or FARS-beta; quoted snippets preserve whichever form the source used. The
  MITOCHONDRIAL phenylalanyl-tRNA synthetase is a different, single-subunit
  enzyme (FARS2) causing a different disease, and is not curated here.

  Scope boundary. This entry is the FARSB entity (RILDBC1) only. RILDBC2
  (MONDO has it as a sibling) is caused by FARSA and is clinically near-identical
  because it disables the same heterotetramer; it is a separate entry and is not
  curated here. The MONDO parent, `Rajab interstitial lung disease with brain
  calcifications` (MONDO:0100214), is the grouping over both.

  Evidence base and its limits - read this before extending the entry. This
  curation session ran in a sandbox whose egress policy blocked NCBI E-utilities,
  so `just fetch-reference` could not cache ANY new reference. Every citation
  here therefore comes from the pre-existing `references_cache/`, which contains
  no FARSB-specific primary paper. What is cited instead are three ARS1-family
  papers that do carry genuine FARSB-specific data: a 438-patient cross-ARS1
  phenotype and treatment review (PMID:40044141), the
  aminoacylation/thermostability/amino-acid-treatment study whose FARSB patient
  is individually characterised (PMID:34194004), and a tRNA therapeutics review
  summarising the same treated cohort (PMID:39702998).

  The disease-defining primary literature is consequently CITED NOWHERE below.
  A curator with network access should fetch these first, in roughly this order:
  PMID:29979980 (Xu et al. 2018, Am J Hum Genet - the FARSB gene-disease paper,
  and the source of the non-translational-function argument); PMID:30014610
  (Zadjali et al. 2018, Hum Mutat - the Omani founder allele c.853G>A p.Glu285Lys);
  PMID:29573043 (Antonellis et al. 2018 - the compound-heterozygous patient with
  the 97% FARSB / 66% FARSA protein reduction); PMID:19161147 (Rajab et al. 2009,
  Am J Med Genet A - the founding clinical and linkage description of the two
  consanguineous Omani kindreds); then Schuch et al. 2021 (Clin Genet,
  FARS1-related disorders) and Karimzadeh et al. 2022.

  The practical consequence is a real and specific gap: the brain calcification
  that names the disease is recorded below WITHOUT a FARSB-specific citation,
  because no cached source makes that claim about FARSB. It carries only a
  cross-ARS1 CNS-imaging frequency, graded INDIRECT. The lung histopathology
  (cholesterol pneumonitis) and the variant spectrum are absent for the same
  reason. Those three are the weakest parts of this entry, and they are weak for
  an infrastructural reason rather than because the literature is thin.

  What the deep-research report adds that this entry does not yet assert. The
  `claude_code` run (research/Rajab_..._-deep-research-claude_code.md, 40 web
  searches, 23 citations) identified several well-supported features that are
  deliberately NOT curated below, because the run's own WebFetch was blocked too
  and it could therefore obtain no verbatim quotation to serve as a snippet -
  the report says so itself in its evidence-gap section. They are recorded here
  as leads, not as claims: FARSB loss co-depletes its obligate heterotetramer
  partner FARSA, so the lesion is loss of the whole (alpha-beta)2 holoenzyme
  rather than of one subunit; cholesterol pneumonitis (intra-alveolar and
  interstitial cholesterol granulomas) is the characteristic lung histology; the
  intracranial calcification is bilateral, symmetric, and accompanied by
  PRESERVED myelination, which is what separates it clinically from Aicardi-
  Goutieres syndrome and the leukodystrophies; a vascular and connective-tissue
  branch (cerebral aneurysm, scoliosis, pectus deformity) is reported in a
  subset; and roughly 10-20 patients have been described worldwide in total, so
  no percentage-based phenotype frequency should be attributed to this disease
  on its own denominator. The frequencies that ARE recorded below are explicitly
  cross-ARS1 cohort figures, not RILDBC1 figures.

  Term-validation state, stated exactly. `just validate` passes schema
  validation and all 23 evidence snippets verify against the cache. Term
  validation could not COMPLETE, because the OLS ontology service was blocked;
  run offline against the local cache, exactly two distinct CURIEs fail, both
  merely because they are new to this repository and could not be resolved:
  MONDO:0100215 (the disease term) and hgnc:17800 (FARSB). Every other binding -
  all HP, GO and NCIT terms in this entry - validates offline against the
  committed cache. The two new CURIEs are corroborated by two independent
  in-repository/report sources each (the MONDO-derived `stubs/` record for this
  disease, and the deep-research report) but neither has been machine-verified,
  and they must be re-validated - and their cache rows derived by the normal
  tooling - by the first curator to run this entry with network access.

  Cross-references identified but not bound: OMIM #613658 (phenotype),
  OMIM *609690 (gene), ORPHA:178506, MedGen C3150910, NCBI Gene 10056; FARSB
  maps to 2q36.1.

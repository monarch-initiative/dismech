- name: Alveolar Lipoproteinaceous Accumulation
  biological_scale: TISSUE
  description: >-
    The lung lesion of FARSB deficiency is described as pulmonary alveolar
    proteinosis - accumulation of lipoproteinaceous material in the alveolar
    space - presenting radiologically as interstitial lung disease. It is near
    universal in this branch of the ARS1 family and is the usual cause of death.
    Note the entry does NOT assert a specific surfactant-handling mechanism for
    the accumulation; no cached source establishes one for FARSB, and the step
    from failed translational reserve to alveolar filling is recorded here as
    indirect for that reason.
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Interstitial Lung Disease
    causal_link_type: DIRECT
    description: >-
      The alveolar filling process is what the clinical and radiological
      diagnosis of interstitial lung disease reports on in this disease.

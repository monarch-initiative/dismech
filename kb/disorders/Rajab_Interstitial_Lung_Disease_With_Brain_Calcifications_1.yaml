differential_diagnoses:
- name: FARS2-related disease
  description: >-
    The distinction that matters most for anyone reading or extending this entry.
    FARS2 encodes the MITOCHONDRIAL phenylalanyl-tRNA synthetase, a single-subunit
    enzyme; FARSB encodes the beta subunit of the CYTOPLASMIC heterotetramer. They
    are different genes, different compartments and different diseases, and FARS2
    causes a combined oxidative phosphorylation deficiency / epileptic
    encephalopathy phenotype rather than the lung-and-calcification picture here.
    The only GeneReviews chapter in this neighbourhood is for FARS2, which is a
    live trap: it is not a GeneReviews chapter for this disease.
  distinguishing_features:
  - Mitochondrial rather than cytoplasmic phenylalanyl-tRNA synthetase
  - Epileptic encephalopathy and OXPHOS deficiency rather than interstitial lung disease
- name: Rajab interstitial lung disease with brain calcifications 2 (FARSA)
  description: >-
    Caused by biallelic FARSA variants, the alpha subunit of the same
    heterotetramer, and clinically near-identical because it disables the same
    enzyme. Distinguished by gene, not by phenotype.
  distinguishing_features:
  - Causal gene is FARSA rather than FARSB
- name: Aicardi-Goutieres syndrome and other interferonopathies
  description: >-
    The main non-ARS differential for a child with extensive basal ganglia and
    cortical calcifications and developmental delay; RILDBC1 diverges by lacking
    progressive neurological regression, significant cortical white-matter
    leukodystrophy, or Coats-like retinopathy, while adding interstitial lung
    disease and cirrhosis.
  distinguishing_features:
  - Absence of progressive neurological deterioration, cortical white-matter leukodystrophy, or retinopathy in RILDBC1
  - Presence of interstitial lung disease and cirrhosis in RILDBC1
  evidence:
  - reference: PMID:19161147
    reference_title: "Recessive developmental delay, small stature, microcephaly and brain calcifications with locus on chromosome 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth delay, mild developmental delay, and poor school performance were present in all affected individuals, but progressive deterioration of neurological function was not apparent, nor were there significant cortical whitematter disease or retinopathy."
    explanation: Directly distinguishes RILDBC1 from Aicardi-Goutieres syndrome and Coats plus syndrome by the absence of neurological regression, leukodystrophy, and retinopathy.
- name: Primary familial brain calcification
  description: >-
    Calcification without the interstitial lung disease, liver involvement or
    growth restriction that define this entity.
  distinguishing_features:
  - No interstitial lung disease or hepatic involvement

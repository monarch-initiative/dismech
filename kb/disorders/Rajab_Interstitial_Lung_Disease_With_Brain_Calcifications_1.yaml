inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic FARSB variants. The individually characterised patient in the
    treatment study carried two different FARSB alleles in trans, a start-loss
    and a missense, which is the compound-heterozygous configuration expected of
    a recessive disease outside a consanguineous kindred.
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFARSB: compound heterozygous FARSB-variants (NM_005687.5): c.3G>T p.Met1? and c.1118G>C p.Gly373Ala (OMIM 609690)"
    explanation: Documents biallelic FARSB variants in trans in an affected individual, with the transcript and both allele descriptions.
genetic:
- name: FARSB
  gene_term:
    preferred_term: FARSB
    term:
      id: hgnc:17800
      label: FARSB
  relationship_type: CAUSATIVE
  notes: >-
    FARSB encodes the beta subunit of cytoplasmic phenylalanyl-tRNA synthetase.
    Biallelic damaging variants reduce, but do not abolish, aminoacylation
    capacity - the characterised patient retained 28% of control FARS activity,
    which is the quantitative statement of why this is a hypomorphic rather than
    a null disease and why residual function can be pushed over a cliff by fever
    or by phenylalanine limitation.

    On the allele list below: it comes from the deep-research report accompanying
    this PR and is deliberately unevidenced except for the first pair. Each of the
    three remaining alleles has a real published source, named in its description
    and in the entry `notes`; none of those papers could be fetched into
    `references_cache/` from the sandbox this entry was curated in, and an
    evidence item whose snippet cannot be checked against a committed cache file
    is exactly the pattern CLAUDE.md warns produces a silent CI pass. Ground these
    properly when the papers are cached.
  variants:
  - name: c.3G>T p.Met1?
    description: >-
      Start-loss allele, in trans with c.1118G>C in the patient whose fibroblasts
      give the 28% residual-activity and thermolability measurements cited here.
      This is the one allele pair in this entry that carries a verified quote.
  - name: c.1118G>C p.Gly373Ala
    description: Missense allele, in trans with the start-loss above.
  - name: c.853G>A p.Glu285Lys
    description: >-
      Homozygous founder allele reported in an extended consanguineous Omani
      kindred. Recorded WITHOUT evidence: the reporting paper (PMID:30014610) is
      not in this repository's reference cache and could not be fetched from the
      curation sandbox, so no quote can be verified against it. See `notes`.
  - name: c.767C>T p.Thr256Met
    description: >-
      Missense allele reported compound heterozygous with a frameshift
      (c.1486delCinsAA p.His496LysfsTer14) in the patient showing ~97% reduction
      of FARSB protein and ~66% of FARSA. Recorded without evidence for the same
      reason as above (PMID:29573043 is uncached).
  - name: c.848+1G>A
    description: >-
      Splice-donor allele. Recorded without evidence for the same reason
      (PMID:29979980 is uncached).
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed pathogenicity of the variants with decreased aminoacylation activity in patient-derived fibroblasts to 23% and 21% IARS activity in PIARS and PIARS-2, respectively, 27% LARS activity in PLARS, 28% FARS activity in PFARSB"
    explanation: Functional confirmation that the FARSB genotype produces a partial, quantified loss of phenylalanyl-tRNA synthetase activity in patient cells.

    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFARSB: compound heterozygous FARSB-variants (NM_005687.5): c.3G>T p.Met1? and c.1118G>C p.Gly373Ala (OMIM 609690)"
    explanation: Records the biallelic FARSB genotype that constitutes this node.
- name: Reduced Cytoplasmic Phenylalanyl-tRNA Synthetase Activity
  biological_scale: MOLECULAR
  description: >-
    The heterotetramer retains partial activity: roughly a quarter of control
    aminoacylation in patient fibroblasts. Because the enzyme catalyses the
    committed step that charges phenylalanine onto tRNA-Phe, the deficit is
    upstream of all cytoplasmic protein synthesis rather than of one pathway.
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: phenylalanyl-tRNA synthetase activity
    term:
      id: GO:0004826
      label: phenylalanine-tRNA ligase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: phenylalanyl-tRNA aminoacylation
    term:
      id: GO:0006432
      label: phenylalanyl-tRNA aminoacylation
    modifier: DECREASED
  downstream:
  - target: Temperature-Sensitive Collapse of Residual Aminoacylation
    causal_link_type: DIRECT
  - target: Translation Failure Under Phenylalanine Limitation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34194004
      reference_title: Treatment of ARS deficiencies with specific amino acids.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patient fibroblast proliferation was normal at high concentrations, but decreased in a dose-dependent manner at lower concentrations of isoleucine for PIARS and PIARS-2, leucine for PLARS, and phenylalanine for PFARSB"
      explanation: Shows the reduced-activity enzyme becomes rate-limiting specifically as its cognate amino acid falls, which is the causal step from low activity to failure of cell growth.
  evidence:
  - reference: PMID:39702998
    reference_title: Transfer RNA and small molecule therapeutics for aminoacyl-tRNA synthetase diseases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient‐derived fibroblasts with pathogenic variants in IARS, LARS, the beta‐subunit of phenylalanyl‐tRNA synthetase (FARSB), and SARS all showed reduced aminoacylation activity."
    explanation: Independent restatement that FARSB variants reduce aminoacylation activity in patient cells.
- name: Temperature-Sensitive Collapse of Residual Aminoacylation
  biological_scale: MOLECULAR
  description: >-
    The residual enzyme is thermolabile. Aminoacylation in patient fibroblasts
    does not merely sit low at 37 degrees Celsius; it falls further on warming,
    reaching zero at 40 degrees in the characterised FARSB patient. This is the
    mechanistic account of why these children decompensate during febrile
    illness, when body temperature and translational demand rise together, and it
    is the same behaviour documented in LARS1 deficiency.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Translation Failure Under Phenylalanine Limitation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LARS activity of PLARS decreased to 5%, and FARS activity of PFARSB to 0%"
    explanation: The thermostability measurement itself, showing residual FARS activity falling with temperature in the FARSB patient's fibroblasts.
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In some patients with LARS1‐ and FARSB‐deficiency, aminoacylation deficiency in fibroblasts worsened during higher temperatures, which could be reflective of clinical deterioration during infections"
    explanation: States the temperature sensitivity for FARSB specifically and links it to clinical deterioration during infection.
- name: Translation Failure Under Phenylalanine Limitation
  biological_scale: CELLULAR
  description: >-
    With a crippled synthetase, cytoplasmic translation becomes conditional on
    phenylalanine supply. Patient fibroblasts grow normally when phenylalanine is
    plentiful and fail dose-dependently as it falls, whereas control cells do not
    - so the cellular lesion is not a fixed translational deficit but a loss of
    reserve. Tissues with the highest secretory protein throughput and the
    fastest growth would therefore be expected to fail first. That last
    sentence is an inference from the conditional-reserve result, not a
    finding: none of the cited sources reports tissue tropism directly.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: cytoplasmic translation
    term:
      id: GO:0002181
      label: cytoplasmic translation
    modifier: DECREASED
  downstream:
  - target: Alveolar Lipoproteinaceous Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Somatic Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Liver Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      One of the parallel organ branches. No cited source traces a mechanism
      from translational insufficiency to hepatocellular injury in FARSB
      deficiency, and the frequency of liver disease in this genotype is itself
      disputed within the source (see the Liver Disease phenotype), so the edge
      is typed as having unknown intermediates and carries no evidence.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A parallel organ branch with no established intermediate steps in this
      disease.
  - target: Microcytic Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A parallel organ branch. Anemia is well documented across this ARS1
      cluster but no cited source explains how the translational lesion
      produces it.
  - target: Cerebral Calcification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The weakest branch in this entry and marked as such. Nothing available to
      this curation session explains, or even directly documents, calcification
      in FARSB deficiency; the edge records that the disease's defining CNS
      feature hangs off the same initiating lesion, and nothing more.
  evidence:
  - reference: PMID:34194004
    reference_title: Treatment of ARS deficiencies with specific amino acids.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patient fibroblast proliferation was normal at high concentrations, but decreased in a dose-dependent manner at lower concentrations of isoleucine for PIARS and PIARS-2, leucine for PLARS, and phenylalanine for PFARSB"
    explanation: Demonstrates the conditional, phenylalanine-dependent proliferation defect that defines this node.
- name: Alveolar Lipoproteinaceous Accumulation
  biological_scale: TISSUE
  description: >-
    The lung lesion of FARSB deficiency is described as pulmonary alveolar
    proteinosis - accumulation of lipoproteinaceous material in the alveolar
    space - presenting radiologically as interstitial lung disease. It is near
    universal in this branch of the ARS1 family and is the usual cause of death.
    Note the entry does NOT assert a specific surfactant-handling mechanism for
    the accumulation; no cached source establishes one for FARSB, and the step
    from failed translational reserve to alveolar filling is recorded here as
    indirect for that reason.
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Interstitial Lung Disease
    causal_link_type: DIRECT
    description: >-
      The alveolar filling process is what the clinical and radiological
      diagnosis of interstitial lung disease reports on in this disease.
  - target: Intraalveolar Phospholipid Accumulation
    causal_link_type: DIRECT
    description: >-
      The same lesion seen histologically rather than radiologically; the
      phenotype node is what a lung biopsy reports.
  evidence:
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory symptoms, mainly consisting of pulmonary alveolar proteinosis (interstitial lung disease), are extremely common in FARSA‐, FARSB‐, and MARS1‐deficiency (86%–100%)"
    explanation: Names the lung lesion, its radiological reading, and its frequency in FARSB deficiency specifically.
- name: Impaired Somatic Growth
  biological_scale: ORGANISM
  description: >-
    Growth restriction is one of the three features in the disease's clinical
    triad and is common across the multisystem ARS1 cluster to which FARSB
    belongs.
  mechanism_confidence: ESTABLISHED
  downstream:
  - target: Growth Restriction
    causal_link_type: DIRECT
  - target: Failure to Thrive
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40044141
    reference_title: "Setting the Stage for Treatment of Aminoacyl-tRNA Synthetase (ARS)1-Deficiencies: Phenotypic Characterization and a Review of Treatment Effects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth abnormalities (encompassing failure to thrive and small for gestational age among others) were common in many (AARS1‐, CARS1‐, FARSA‐, FARSB‐, IARS1‐, LARS1‐, MARS1‐, QARS1‐, VARS1‐, WARS1‐ and YARS1‐deficiency; prevalence 50%–100%)"
    explanation: Gives FARSB-specific inclusion in the 50-100% growth-abnormality band of a systematic multi-gene series; the band itself spans eleven genes and is not a FARSB point estimate.

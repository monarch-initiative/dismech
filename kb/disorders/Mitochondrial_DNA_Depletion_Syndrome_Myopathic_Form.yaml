name: Mitochondrial DNA Depletion Syndrome, Myopathic Form
creation_date: "2026-09-29T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome, myopathic form
  term:
    id: MONDO:0012301
    label: mitochondrial DNA depletion syndrome, myopathic form
synonyms:
- MTDPS2
- mitochondrial DNA depletion syndrome 2 (myopathic type)
- mitochondrial DNA depletion syndrome type 2
- mtDNA depletion syndrome, myopathic form
- thymidine kinase 2 deficiency
- TK2 deficiency
- TK2-related mitochondrial DNA maintenance defect, myopathic form
description: >-
  Autosomal recessive mitochondrial DNA (mtDNA) maintenance disorder caused by
  biallelic loss-of-function variants in TK2, which encodes thymidine kinase 2,
  the mitochondrial matrix enzyme that performs the first and rate-limiting
  phosphorylation of the pyrimidine deoxyribonucleosides deoxythymidine and
  deoxycytidine. Post-mitotic cells have no de novo deoxynucleotide synthesis
  inside mitochondria and cannot draw on the cell-cycle-regulated cytosolic
  kinases, so mtDNA replication there depends on this salvage step. Its loss
  leaves the mitochondrial deoxynucleoside triphosphate pool unbalanced and
  depleted of pyrimidines, and mtDNA copy number falls, most severely in
  skeletal muscle; older patients accumulate multiple mtDNA deletions instead of,
  or as well as, depletion. The consequence is a combined deficiency of the
  respiratory-chain complexes that contain mtDNA-encoded subunits, and a
  progressive myopathy. Presentation is a continuum usually divided into three
  forms: an infantile-onset myopathy with hypotonia, motor regression, frequent
  neurological involvement and death within about a year of onset; a
  childhood-onset limb myopathy progressing to loss of ambulation and ventilator
  dependence; and a late-/adult-onset myopathy with facial and limb weakness,
  ptosis and ophthalmoparesis that resembles facioscapulohumeral dystrophy and
  progresses slowly. Creatine kinase is almost always raised, and muscle biopsy
  shows ragged-red and cytochrome c oxidase-negative fibres on a dystrophic
  background. Respiratory muscle failure is the usual cause of death. Oral
  substitution with the TK2 products' precursors deoxycytidine and
  deoxythymidine (dC/dT) is the first treatment to alter the course, established
  in the Tk2 H126N knock-in mouse and then in an expanded-access cohort, and now
  under formal trial.
parents:
- mitochondrial DNA depletion syndrome
- inborn disorder of pyrimidine metabolism
- mitochondrial DNA maintenance defect
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      A progressive myopathy with respiratory muscle involvement dominates every
      form of the disease, so the neuromuscular chapter is the primary placement.
    evidence:
    - reference: PMID:23230576
      reference_title: "TK2-Related Mitochondrial DNA Maintenance Defect, Myopathic Form."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Affected individuals experience progressive muscle weakness leading to respiratory failure."
      explanation: Muscle weakness with respiratory failure is the defining clinical course.
  icimd_category:
  - classification_value: nucleotide_pool_maintenance
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Nucleotide pool
      maintenance" under category "Mitochondrial DNA maintenance and
      replication". TK2 supplies pyrimidine deoxynucleotides to the
      mitochondrial dNTP pool, which is the mechanism the group is defined by.
      The purine-side counterpart of the same group is DGUOK deficiency, curated
      as Mitochondrial DNA Depletion Syndrome 3 (Hepatocerebral Type).
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:22345218
      reference_title: "Adult cases of mitochondrial DNA depletion due to TK2 defect: an expanding spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "typical mitochondrial myopathy with a mosaic pattern of COX-negative and ragged-red fibers, combined mtDNA-dependent respiratory complexes deficiency and mtDNA depletion"
      explanation: >-
        A combined deficiency of the mtDNA-dependent respiratory complexes
        secondary to mtDNA depletion from a nuclear-gene defect places this among
        the primary mitochondrial diseases.

    explanation: Size of the largest assembled natural-history cohort.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TK2 deficiency is a frequent mitochondrial predominantly myopathic disorder that may be under-diagnosed due to its diverse spectrum of clinical presentations."
    explanation: The authors' own statement that ascertainment is incomplete.
- population: Spain
  measure_type: CARRIER_FREQUENCY

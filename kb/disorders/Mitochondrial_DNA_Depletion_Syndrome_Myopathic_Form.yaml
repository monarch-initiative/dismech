    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "generalized muscle weakness predominating on axial and proximal muscles but affecting facial, ocular, and respiratory muscles"
    explanation: Distribution of weakness in adult-onset patients.
- name: Hypotonia
  category: Musculoskeletal
  description: >-
    Generalised hypotonia is one of the two features present in all patients of a
    multi-family series, and is the usual infantile presentation alongside motor
    regression.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Generalized hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:23932787
    reference_title: "Molecular and clinical characterization of the myopathic form of mitochondrial DNA depletion syndrome caused by mutations in the thymidine kinase (TK2) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, hypotonia and proximal muscle weakness are the major phenotypes present in all subjects."
    explanation: Hypotonia in every patient of an 11-subject, 9-family series.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While hypotonia and proximal muscle weakness are common in all of the three clinical forms"
    explanation: Hypotonia is not confined to the infantile form.
- name: Elevated creatine kinase
  category: Laboratory
  description: >-
    Serum creatine kinase was raised in every patient in whom a value was
    available, from 1.3 to 30 times the upper limit of normal. A normal value does
    not exclude the diagnosis: seven patients had transiently normal levels and
    five were reported normal throughout. Myoglobinuria and rhabdomyolysis are rare.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Elevated serum creatine kinase
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase activity
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CK levels, available in 57 out of 92 patients, were elevated in all from 1.3-fold to 30-fold above the upper limit of normal (range 272-6500 U/L)."
    explanation: Frequency and magnitude of the creatine kinase elevation.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "normal in only five: one with infantile-onset myopathy and four with childhood-onset myopathy, indicating that a normal CK does not exclude TK2 deficiency"
    explanation: >-
      Refutes treating a raised creatine kinase as obligatory; the same paper that
      reports near-universal elevation states the exception explicitly.
- name: Loss of ambulation
  category: Musculoskeletal
  description: >-
    Progressive loss of independent walking in the infantile and childhood forms.
    Most infantile-onset patients never walk and virtually all are non-ambulatory
    by four years; about two thirds of childhood-onset patients become
    wheelchair-bound within ten years. Late-onset patients retain the ability to walk.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Loss of ambulation
    term:
      id: HP:0002505
      label: Loss of ambulation
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Global motor function was severely impaired in 50/61 (82% with Karnofsky or Lansky Performance Status <50) who were wheelchair-bound at the last follow-up."
    explanation: Proportion wheelchair-bound at last follow-up.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the infantile-onset/childhood-onset patients, late-onset cases never became wheelchair-bound"
    explanation: The late-onset form is the exception, which is why this is FREQUENT rather than VERY_FREQUENT.
- name: Respiratory insufficiency
  category: Respiratory
  description: >-

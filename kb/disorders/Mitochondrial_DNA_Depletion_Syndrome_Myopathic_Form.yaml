    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had proximal muscle weakness as the first sign of disease or during the clinical course."
    explanation: Establishes both the phenotype and its near-universal frequency.
  - reference: PMID:22345218

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate is available in the sources cited
    here. GeneReviews counts approximately 107 molecularly confirmed individuals
    reported to date; the 2018 multicentre natural-history study assembled 92,
    and a 2024 Spanish study added a further series of 53. The disorder is
    considered under-diagnosed because of the breadth of its presentations.
  evidence:
  - reference: PMID:23230576
    reference_title: "TK2-Related Mitochondrial DNA Maintenance Defect, Myopathic Form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

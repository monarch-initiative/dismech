  notes: >-
    Two founder alleles, p.Lys202del and p.Thr108Met, are enriched in the Spanish
    population relative to gnomAD, which is why Spanish centres contribute a
    disproportionate share of reported patients. No carrier rate is given as a
    frequency in the cited source, only the fold enrichment.

    Muscle shows a dystrophic pattern superimposed on the mitochondrial changes:
    atrophic and necrotic fibres, fibre-size variability with type 1 predominance,
    internal nuclei, and replacement of muscle by fat and connective tissue. This
    combination of dystrophic features with a cytochrome c oxidase defect and
    ragged-red fibres is the histological signature that should prompt TK2 testing.

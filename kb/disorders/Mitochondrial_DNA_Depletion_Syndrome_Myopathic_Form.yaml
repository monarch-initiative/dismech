    weakness. Two thirds of the largest cohort required invasive or non-invasive
    ventilation, rising to nearly 90% of infantile-onset patients, and respiratory
    failure is the leading cause of death. In late-onset disease it may be the
    presenting symptom, as nocturnal dyspnoea.

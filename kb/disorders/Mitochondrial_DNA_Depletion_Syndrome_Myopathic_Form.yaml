animal_models:
  - species: Mouse
    genotype: Tk2 H126N homozygous knock-in
    background: C57BL/6-derived, generated by homologous recombination in embryonic stem cells
    publication: PMID:18467430
    description: >-
      The reference model of the disease, homologous to the human H121N allele.
      Homozygotes are normal at birth, stop gaining weight around postnatal day 10
      and die of a rapidly progressive encephalomyelopathy at 2-3 weeks. It is the
      system in which the mitochondrial dNTP pool imbalance was measured, in which
      both therapies were developed, and whose organ distribution differs
      informatively from the human disease.
    genes:
    - preferred_term: TK2
      term:
        id: hgnc:11831
        label: TK2
    modeled_mechanisms:
    - target: Imbalanced Mitochondrial dNTP Pool
      relationship: RECAPITULATES
      fidelity: HIGH
      model_scale: ORGANISM
      description: >-
        The pool imbalance that is asserted but not measured in patients is
        measured directly here: low dTTP in brain and reduced dTTP and dCTP in
        liver, with mtDNA depletion and respiratory-chain deficits following.
      readouts:
      - name: Tissue dTTP and dCTP concentrations
        target: Imbalanced Mitochondrial dNTP Pool
        direction: DECREASED
        interpretation: >-
          Direct measurement of the precursor shortage that the human entry can
          only infer.
        evidence:
        - reference: PMID:24968719
          reference_title: Deoxypyrimidine monophosphate bypass therapy for thymidine kinase 2 deficiency.
          supports: SUPPORT
          evidence_source: MODEL_ORGANISM
          snippet: "loss of Tk2 activity caused dNTP pool imbalances with low dTTP levels in brain and decreased dTTP and dCTP in liver"
          explanation: The measured pool deficits and their tissue distribution.
      - name: Tissue mtDNA copy number on dCMP/dTMP treatment
        target: Imbalanced Mitochondrial dNTP Pool
        direction: RESTORED
        interpretation: >-
          Supplying the missing precursors raises mtDNA again, which is the
          pharmacological test of the mechanism rather than a correlation.
        evidence:
        - reference: PMID:24968719
          reference_title: Deoxypyrimidine monophosphate bypass therapy for thymidine kinase 2 deficiency.
          supports: SUPPORT
          evidence_source: MODEL_ORGANISM
          snippet: "the compounds raise dTTP concentrations, increase levels of mtDNA, ameliorate defects of mitochondrial respiratory chain enzymes"
          explanation: Restoration of pool, copy number and enzyme activity on treatment.
      evidence:
      - reference: PMID:18467430
        reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "animals showed Tk2 deficiency, unbalanced dNTP pools, mtDNA depletion and defects of respiratory chain enzymes containing mtDNA-encoded subunits"
        explanation: Establishes the model as informative for the pool-imbalance node.
    - target: Combined Respiratory Chain Deficiency
      relationship: PARTIALLY_RECAPITULATES
      fidelity: MODERATE
      model_scale: ORGANISM
      description: >-
        The mouse does develop deficiency of the mtDNA-dependent complexes, but the
        organ distribution is inverted relative to patients: the defect is
        CNS-predominant, and heart and skeletal muscle are largely spared by
        transcriptional compensation.
      limitations: >-
        In the mouse only brain showed significant respiratory-chain deficiency,
        with heart and muscle protected, whereas the human disease is defined by a
        skeletal-muscle respiratory-chain defect with the brain usually spared. A
        muscle-endpoint experiment in this model therefore does not test the
        organ in which the human disease is expressed.
      divergences:
      - divergence_type: SPECIES_MISMATCH
        materiality: QUALIFYING
        description: >-
          Mouse Tk1 down-regulates sharply in the second postnatal week and the
          heart compensates by suppressing MTERF3 to raise mitochondrial
          transcript levels per mtDNA copy. Neither the timing nor the
          compensatory mechanism has a demonstrated human counterpart, and it is
          what spares mouse muscle and heart.
      readouts:
      - name: Brain complex I and complex IV activities
        target: Combined Respiratory Chain Deficiency
        direction: DECREASED
        interpretation: >-
          Quantifies the biochemical defect and, by its tissue restriction, the
          model's divergence from the human organ pattern.
        evidence:
        - reference: PMID:20940150
          reference_title: "Onset and organ specificity of Tk2 deficiency depends on Tk1 down-regulation and transcriptional compensation."
          supports: SUPPORT
          evidence_source: MODEL_ORGANISM
          snippet: "the activity of complex I was 40% and that of complex IV 50% in brain of Tk2-/- versus Tk2+/+ mice"
          explanation: The measured brain enzyme deficits.
      evidence:
      - reference: PMID:20940150
        reference_title: "Onset and organ specificity of Tk2 deficiency depends on Tk1 down-regulation and transcriptional compensation."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "However, only the brain showed significant deficiency of respiratory chain complexes (OXPHOS), protein levels and activities"
        explanation: >-
          Refutes treating this model as a faithful system for the muscle
          respiratory-chain defect that defines the human disease.
    - target: Central Nervous System Involvement
      relationship: RECAPITULATES
      fidelity: MODERATE
      model_scale: ORGANISM
      description: >-
        The mouse develops a frank encephalomyelopathy with anterior-horn vacuolar
        change, which is the strongest available argument that human CNS features
        can be a primary consequence of neuronal mtDNA depletion rather than of
        hypoxia.
      limitations: >-
        In patients CNS involvement is a minority feature (16% overall) and its
        attribution is confounded by respiratory failure, whereas in the mouse it
        is the lethal, defining lesion. The model therefore over-represents the
        importance of the CNS phenotype relative to the human disease.
      readouts:
      - name: Spinal cord anterior horn histopathology
        target: Central Nervous System Involvement
        direction: ALTERED
        interpretation: A structural CNS lesion attributable to Tk2 loss alone, with no respiratory confounder.
        evidence:
        - reference: PMID:18467430
          reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
          supports: SUPPORT
          evidence_source: MODEL_ORGANISM
          snippet: "Histopathology revealed an encephalomyelopathy with prominent vacuolar changes in the anterior horn of the spinal cord."
          explanation: The histological CNS finding.
      evidence:
      - reference: PMID:18467430
        reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The H126N TK2 mouse is the first knock-in animal model of human MDS and demonstrates that the severity of TK2 deficiency in tissues may determine the organ-specific phenotype."
        explanation: >-
          The authors' own framing of the model's value, which is precisely about
          organ specificity.
    evidence:
    - reference: PMID:18467430
      reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous Tk2 mutant (Tk2(-/-)) mice developed rapidly progressive weakness after age 10 days and died between ages 2 and 3 weeks."
      explanation: The model's phenotype and timeline.
    - reference: PMID:20940150
      reference_title: "Onset and organ specificity of Tk2 deficiency depends on Tk1 down-regulation and transcriptional compensation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although normal until postnatal day 8, Tk2-/- mice rapidly develop fatal encephalomyopathy between postnatal days 10 and 13."
      explanation: The narrow window in which the phenotype appears, which is what links it to Tk1 down-regulation.
discussions:
- discussion_id: tk2_mouse_organ_inversion
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The Tk2 H126N knock-in mouse is CNS-predominant and spares skeletal muscle,
    while the human disease is muscle-predominant and usually spares the CNS. Does
    the compensatory mechanism that protects mouse muscle - Tk1 activity in the
    first postnatal week followed by MTERF3 down-regulation raising mitochondrial
    transcripts per mtDNA copy - operate in human muscle, and if so why does human
    muscle nonetheless fail?
  rationale: >-
    This is not a cosmetic species difference. Every therapy in this disease was
    developed in a model whose target organ is not the organ the human disease
    destroys, and the mouse's own authors identified compensation as the reason
    its muscle is spared. If the same compensation is absent or exhausted in human
    muscle, that absence is part of the pathogenesis and a potential therapeutic
    target in its own right; if it is present, the mouse's muscle endpoints
    understate what nucleoside therapy has to overcome. The one human data point
    pointing the same way is the observation that muscle combines low basal TK2
    activity with a high demand for mtDNA-encoded protein, which is a
    vulnerability argument rather than a compensation argument.
  attaches_to:
  - pathophysiology#Post-Mitotic Dependence on Mitochondrial Salvage
  - pathophysiology#Combined Respiratory Chain Deficiency
  - animal_models#Mouse
  proposed_experiments:
  - experiment_id: tk2_human_muscle_compensation
    name: MTERF3 and mitochondrial transcript quantification in patient muscle
    description: >-
      Measure MTERF3 transcript and protein, mitochondrial transcript levels
      normalised to mtDNA copy number, and TK1 activity in archived TK2-deficient
      muscle biopsies across the three clinical forms, against age-matched control
      muscle. The mouse result predicts that a tissue which compensates shows
      raised transcript per copy with suppressed MTERF3; human muscle, which does
      not escape the disease, should not.
    readouts:
    - name: Mitochondrial transcript level per mtDNA copy
      target: pathophysiology#Combined Respiratory Chain Deficiency
      direction: DECREASED
      interpretation: >-
        Absence of the transcriptional compensation seen in mouse heart would
        explain why human muscle is the target organ.
    would_support:
    - pathophysiology#Post-Mitotic Dependence on Mitochondrial Salvage
    supporting_outcome:
    - >-
      Patient muscle shows no rise in mitochondrial transcript per mtDNA copy and
      no MTERF3 suppression, while the respiratory-chain deficit is present -
      establishing that human muscle lacks the compensation that protects the
      mouse.
    refuting_outcome:
    - >-
      Patient muscle shows the same transcriptional compensation as mouse heart
      despite a full respiratory-chain deficit, which would mean compensation is
      not what determines organ tropism and the mouse-human inversion has another
      cause.
- discussion_id: tk2_cns_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    In patients with nervous-system features, how much is primary neuronal mtDNA
    depletion and how much is hypoxic-ischaemic injury secondary to respiratory
    failure?
  rationale: >-
    The natural-history authors raise this explicitly and do not resolve it: CNS
    features cluster in the infantile-onset group, which is also the group with the
    highest ventilatory requirement, so the two candidate causes are confounded by
    design in a retrospective cohort. The answer changes what nucleoside therapy
    should be expected to do for the CNS, and whether CNS-penetrant delivery is
    needed. Nucleoside therapy now alters the respiratory course, which makes a
    prospective separation possible for the first time: patients whose respiratory
    failure is prevented but who still develop CNS disease would settle it.
  attaches_to:
  - pathophysiology#Central Nervous System Involvement
  - phenotypes#Encephalopathy
  - phenotypes#Seizures
- discussion_id: tk2_no_controlled_trial
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the effect size of deoxycytidine and deoxythymidine therapy against a
    concurrent control rather than against historical untreated patients?
  rationale: >-
    Every efficacy claim available rests on open-label expanded access and
    single-arm studies compared against untreated patients assembled
    retrospectively or from the literature. That is a reasonable design for a
    rapidly fatal ultra-rare disease and it is not a reason to withhold the
    therapy, but the magnitude and durability of benefit remain estimated from
    non-concurrent comparators. The November 2025 US approval was granted on that
    basis and so does not close this gap; it sharpens it, because the licensed age
    limit is itself drawn from a subgroup contrast within the same uncontrolled
    data. The pooled analyses did stratify by age at onset and found no significant
    mortality difference in later-onset patients, which leaves open whether
    later-onset disease is genuinely unresponsive or merely slow enough that the
    available follow-up cannot resolve a difference -- the latter would make the
    age cut-off an artefact of study duration rather than of biology. A
    placebo-controlled trial is unlikely now that an approved therapy exists, so
    the realistic substitute is a prespecified comparison against the 92-patient
    natural-history cohort using its own stratification by age at onset, with
    GDF-15 as an objective intermediate endpoint.
  attaches_to:
  - treatments#Deoxycytidine and Deoxythymidine Substitution
  - clinical_trials#NCT06754098
- discussion_id: tk2_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a given biallelic TK2 genotype produces infantile,
    childhood or adult-onset disease, given that neither the variant nor residual
    enzyme activity predicts it?
  rationale: >-
    p.Thr108Met homozygotes span all three clinical forms, twelve variants are
    each associated with more than one form, and residual TK2 activity in patient
    fibroblasts ranges from 1% to 39% without correlating with severity. Something
    other than the TK2 genotype is setting the age at onset - plausibly variation
    in the cytosolic kinases and nucleotide catabolism that modify the same pool,
    or in the compensation the mouse work identified. This is the practical
    obstacle to counselling a newly diagnosed infant's sibling and to stratifying
    a single-arm trial.
  attaches_to:
  - genetic#TK2
  - pathophysiology#TK2 Loss of Function
notes: >-
  Scope. This entry is the myopathic form of mtDNA depletion syndrome, MDS type 2,
  caused by TK2 deficiency (MONDO:0012301, OMIM 609560, causal gene
  RO:0004003 hgnc:11831 TK2 as recorded by MONDO). It is deliberately kept
  distinct from the other MDS family members already in the knowledge base:
  Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type (DGUOK, the purine
  arm of the same salvage pathway),
  SUCLA2-Related_Mitochondrial_DNA_Depletion_Syndrome (the encephalomyopathic
  form), FBXL4-Related_Mitochondrial_DNA_Depletion_Syndrome,
  Mitochondrial_DNA_Depletion_Syndrome_7, Mitochondrial_DNA_Depletion_Syndrome_14B,
  and Mitochondrial_Neurogastrointestinal_Encephalomyopathy (TYMP). The
  MSTO1-Related_Mitochondrial_Myopathy entry already carries a differential
  diagnosis pointing at MONDO:0012301; the reverse pointer is curated here.

  Subtype modelling. The three clinical forms are modelled as has_subtypes rather
  than as separate entries, because they share one gene, one mechanism and one
  therapy, and because the sources treat them explicitly as a continuum ("a
  phenotypic continuum that ranges from severe to mild"). The percentages attached
  to each form come from a single 92-patient retrospective cohort and the authors
  note the late-onset form may be under-represented, so they are the best
  available figures rather than population estimates.

  Conformance. The Combined Respiratory Chain Deficiency node conforms to
  mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, matching
  the four other mtDNA depletion entries in kb/disorders. Modules considered and
  rejected: complex_i_deficiency and complex_iv_assembly_deficiency (both scope
  themselves to biogenesis or repair lesions of a single complex, whereas the
  defect here is a shortage of mtDNA templates producing a combined deficiency of
  every complex carrying mtDNA-encoded subunits); deregulated_cellular_energetics
  (a cancer-hallmark module about the Warburg shift, not monogenic
  respiratory-chain failure); cardiomyopathy_maladaptive_remodeling
  (cardiomyopathy is reported in only two late-onset and one infantile patient in
  the cohort, too peripheral to justify a conformance claim). No module covers
  mtDNA maintenance or the mitochondrial dNTP pool; `rg -il "mtDNA
  maintenance|dNTP|nucleotide salvage|deoxynucleo" kb/modules/` returns only
  fungal_nucleic_acid_antimetabolite and mitochondrial_dysfunction. A dedicated
  mitochondrial dNTP-pool module covering TK2, DGUOK, RRM2B and TYMP would be a
  reasonable follow-up now that four of those diseases are curated.

  Deep-research report is not independent corroboration. The report at
  research/Mitochondrial_DNA_Depletion_Syndrome_Myopathic_Form-deep-research-claude_code.md
  was generated after this entry was curated, and the provider read the entry and
  its reference cache while writing -- its own text says so, describing itself as
  assembled from references "held in the dismech verified reference cache" and its
  ontology identifiers as read from cache/ and "the validated bindings of the
  curated kb/disorders/ entry". Do not read agreement between the report and this
  entry as confirmation; the report is downstream of the entry, not a second source
  for it. Its contribution was to flag PMID:41604077, the KYGEVVI approval record,
  as cached but unused, which it did without quoting the reference ("present in the
  cache but not reproduced here, as I do not hold them verbatim") -- so the approval
  content in the treatments section was read from the reference itself, not from the
  report.

  Treatment identifier decisions. The therapy carries the pharmaceutical names
  doxecitine and doxribtimine and the brand name KYGEVVI, none of which are bound
  here as ontology terms, for three separate reasons. No regimen_term is asserted:
  NCIT has no term for KYGEVVI, MT-1621, or any deoxynucleoside combination
  regimen, and RegimenTerm is reachable only from NCIT:C15697, so there is nothing
  legitimate to bind. NCIT:C1330 "Deoxythymidine" exists but is_a NCIT:C85834
  "Retired Concept 2009" and must not be used; the CHEBI bindings
  (CHEBI:15698 2'-deoxycytidine, CHEBI:17748 thymidine) are the correct chemical
  identity and are retained, with the pharmaceutical names carried in
  preferred_term. NCIT:C420 "Doxecitine" does exist and is a synonym-level match
  for deoxycytidine, but adding it beside the CHEBI term would list the same
  molecule twice, and its NCIT parents (Pyrimidine Antagonist, Chemoprotective
  Agent) describe an antineoplastic role rather than this one. The treatment name
  was also left as the mechanistic "Deoxycytidine and Deoxythymidine Substitution"
  rather than renamed to the brand: it is the target of an attaches_to foreign key,
  and a mechanism name outlives a trade name.

  Evidence grading for PMID:41604077. That reference is a first-approval review, so
  every item from it carries quote_role: REVIEW_SYNTHESIS. Its evidence_source is
  split deliberately: quotes reporting the regulatory action itself (approval date,
  indication, first-approved status, labelled pharmacodynamics) are OTHER, because a
  regulatory decision is not a study; quotes reporting the pooled human mortality
  outcomes behind that decision are HUMAN_CLINICAL, because evidence_source grades
  the study the quoted text describes and those are human cohort analyses.

  Mitochondrial dNTP pools have not been measured in patient tissue in any source
  cited here. The pool imbalance is measured in the Tk2 H126N mouse and asserted
  as mechanism in the human discovery paper, and the Imbalanced Mitochondrial dNTP
  Pool node says so in its own description rather than only here.

  TK2 also phosphorylates pyrimidine nucleoside analogues including zidovudine,
  which is the proposed route to the mitochondrial toxicity of nucleoside-analogue
  antivirals and anticancer drugs. That is a pharmacological consequence of the
  same enzyme rather than part of this disease, so it is recorded here rather than
  curated as a mechanism; a drug-induced mitochondrial toxicity entry or module
  would be where it belongs.

  No ORPHA cache file exists for Orphanet:254875, the Orphanet term MONDO cites
  for this disease; `just fetch-reference ORPHA:254875` reports no source found.
  The prevalence record therefore rests on published case counts rather than an
  Orphanet epidemiology class, and no numeric rate_per_100000 is asserted.

  Counting discipline in the 92-patient cohort. That cohort reports different
  features against different denominators, and two of its numbers do not reconcile
  with each other. The Seizures description records the irreconcilable pair
  (recurrent seizures six of 92 against seizures seven of 39 infantile patients)
  rather than presenting either as settled. Multiple mitochondrial DNA deletions is
  banded over the 38 patients actually assayed for deletions rather than over all 92,
  since a finding requiring a biopsy and a deletion assay cannot be scored in
  patients who had neither; the alternative denominator is stated in that record so
  the choice is visible. Every figure quoted in a description is carried by one of
  the evidence items beside it, which matters here because the cohort's feature
  lists put several counts in one sentence and adjacent features are easy to swap.

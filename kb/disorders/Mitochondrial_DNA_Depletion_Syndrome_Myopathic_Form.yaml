    reference_title: Clinical and Genetic Analysis of Patients With TK2 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two variants, p.Lys202del and p.Thr108Met, exhibited significantly higher prevalence in the Spanish population than that reported in gnomAD database (86-fold and 13-fold, respectively)."
    explanation: Founder-allele enrichment in Spain.
has_subtypes:
- name: Infantile-onset
  display_name: Infantile-onset myopathy with neurological involvement
  description: >-
    Onset in the first year of life with severe congenital myopathy, hypotonia or
    motor regression, severe muscle mtDNA depletion, frequent central nervous
    system involvement and rapid progression to respiratory failure. Almost none
    achieve independent walking, and median post-onset survival is about one year.
  genes:
  - preferred_term: TK2
    term:
      id: hgnc:11831
      label: TK2
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "infantile-onset myopathy (42.4%) with severe mitochondrial DNA (mtDNA) depletion, frequent neurological involvement and rapid progression to early mortality"
    explanation: Defines the infantile-onset form and its share of the cohort.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle weakness was most prominent in the first year of life in the infantile-onset form, with 26 of 32 (81%) never acquiring the ability to walk independently and virtually all (30/32; 94%) non-ambulatory by age 4 years"
    explanation: Motor outcome in the infantile-onset form.
- name: Childhood-onset
  display_name: Childhood-onset limb myopathy
  description: >-
    Onset between one and twelve years with proximal limb weakness, Gowers sign
    and muscle mtDNA depletion, sometimes with multiple deletions. Weakness can
    resemble spinal muscular atrophy type 3. Most lose ambulation within ten
    years of onset and about half require ventilatory support; median post-onset
    survival is at least thirteen years.
  genes:
  - preferred_term: TK2
    term:
      id: hgnc:11831
      label: TK2
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "childhood-onset myopathy (40.2%) with mtDNA depletion, moderate-to-severe progression of generalised weakness and median POS at least 13 years"
    explanation: Defines the childhood-onset form and its survival.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, 19/30 (63%) of childhood-onset patients became wheelchair-bound within 10 years of disease onset"
    explanation: Loss of ambulation in the childhood-onset form.
- name: Late-onset
  display_name: Late-/adult-onset myopathy with multiple mtDNA deletions
  description: >-
    Onset at twelve years or later, often in adulthood, with mild limb weakness,
    marked facial weakness, scapular winging, ptosis and progressive external
    ophthalmoparesis. Multiple mtDNA deletions in muscle are near-universal while
    frank depletion is uncommon. Ambulation is retained but respiratory muscle
    weakness develops in most, and the presentation can be mistaken for
    facioscapulohumeral muscular dystrophy.
  genes:
  - preferred_term: TK2
    term:
      id: hgnc:11831
      label: TK2
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "late-onset myopathy (17.4%) with mild limb weakness at onset and slow progression to respiratory insufficiency with median POS of 23 years"
    explanation: Defines the late-onset form.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen patients (17.4%) in our cohort presented with adult-onset myopathy, which mimicked facioscapulohumeral dystrophy with marked facial weakness, scapular winging or both in seven (43.75%)."
    explanation: The FSHD-like presentation of the late-onset form.
  - reference: PMID:31060578
    reference_title: "Late-onset thymidine kinase 2 deficiency: a review of 18 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases showed multiple mtDNA deletions but mtDNA depletion was present only in two patients."
    explanation: The molecular signature that separates the late-onset form from the earlier forms.
pathophysiology:
- name: TK2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic TK2 variants reduce or abolish thymidine kinase 2, the mitochondrial
    matrix deoxyribonucleoside kinase. Missense, in-frame deletion, splice and
    frameshift alleles are all reported, and residual activity measured in
    patient-derived fibroblasts spans 1-39% of control without tracking clinical
    severity, so the genotype does not by itself predict the form of disease.
    Recombinant work on the two original alleles shows two distinct kinetic
    lesions: I212N is essentially inactive, whereas H121N retains normal substrate
    affinity but loses catalytic efficiency through a raised Km for ATP.
  genes:
  - preferred_term: TK2
    term:
      id: hgnc:11831
      label: TK2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) germline TK2 variants.
  molecular_functions:
  - preferred_term: thymidine kinase activity
    term:
      id: GO:0004797
      label: thymidine kinase activity
    modifier: DECREASED
  - preferred_term: deoxycytidine kinase activity
    term:
      id: GO:0004137
      label: deoxycytidine kinase activity
    modifier: DECREASED
  downstream:
  - target: Mitochondrial Pyrimidine Deoxynucleoside Salvage Failure
    description: >-
      Without TK2 the first and rate-limiting phosphorylation of deoxythymidine and
      deoxycytidine inside mitochondria does not occur.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23932787
      reference_title: "Molecular and clinical characterization of the myopathic form of mitochondrial DNA depletion syndrome caused by mutations in the thymidine kinase (TK2) gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the myopathic form of MDS is mainly caused by mutations in the TK2 gene, which encodes thymidine kinase 2, the first and rate limiting step enzyme in the phosphorylation of pyrimidine nucleosides"
      explanation: Places TK2 at the rate-limiting step of the pathway this node feeds.
  evidence:
  - reference: PMID:11687801
    reference_title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these individuals, the activity of TK2 in muscle mitochondria is reduced to 14-45% of the mean value in healthy control individuals."
    explanation: Direct demonstration of reduced enzyme activity in patient muscle mitochondria.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TK2 activity measured in 11 patient-derived fibroblast cell lines showed residual activity ranging from 1% to 39% relative to healthy controls without correlation with clinical severity"
    explanation: Range of residual activity, and the absence of a correlation with severity.
  - reference: PMID:12493767
    reference_title: Kinetic properties of mutant human thymidine kinase 2 suggest a mechanism for mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The I212N mutant showed less than 1% activity as compared with wild type TK2 with all deoxynucleosides."
    explanation: A near-null allele characterised on recombinant enzyme.
  - reference: PMID:12493767
    reference_title: Kinetic properties of mutant human thymidine kinase 2 suggest a mechanism for mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "markedly increased K(m) values for ATP, leading to decreased enzyme efficiency"
    explanation: The distinct kinetic lesion of the H121N allele.
- name: Mitochondrial Pyrimidine Deoxynucleoside Salvage Failure
  biological_scale: MOLECULAR
  description: >-
    TK2 phosphorylates deoxythymidine, deoxycytidine and deoxyuridine to their
    monophosphates inside the mitochondrial matrix; these are then phosphorylated
    onward to the pyrimidine deoxynucleoside triphosphates used by the mtDNA
    replisome. The inner membrane is impermeable to charged nucleotides and
    mitochondria have no de novo synthesis pathway of their own, so in cells that
    are not dividing this salvage route is the principal supply.
  biological_processes:
  - preferred_term: pyrimidine deoxyribonucleoside salvage
    term:
      id: GO:0043099
      label: pyrimidine deoxyribonucleoside salvage
    modifier: DECREASED
  - preferred_term: deoxyribonucleoside triphosphate biosynthetic process
    term:
      id: GO:0009202
      label: deoxyribonucleoside triphosphate biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Imbalanced Mitochondrial dNTP Pool
    description: >-
      Loss of the pyrimidine arm of mitochondrial salvage leaves the matrix dNTP
      pool short of dTTP and dCTP relative to the purine deoxynucleotides.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24968719
      reference_title: Deoxypyrimidine monophosphate bypass therapy for thymidine kinase 2 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "loss of Tk2 activity caused dNTP pool imbalances with low dTTP levels in brain and decreased dTTP and dCTP in liver"
      explanation: Measured pool imbalance in the knock-in mouse; the human pools have not been measured in the sources cited here.
  evidence:
  - reference: PMID:11687801
    reference_title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human dGK efficiently phosphorylates deoxyguanosine and deoxyadenosine, whereas TK2 phosphorylates deoxythymidine, deoxycytidine and deoxyuridine."
    explanation: The substrate specificity that makes this the pyrimidine arm of mitochondrial salvage.
  - reference: PMID:11687801
    reference_title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In non-replicating cells, where cytosolic dNTP synthesis is down-regulated, mtDNA synthesis depends solely on the mitochondrial salvage pathway enzymes, the deoxyribonucleosides kinases."
    explanation: Why the salvage pathway is not redundant in post-mitotic tissue.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "TK2 phosphorylates the nucleosides deoxycytidine (dC) and deoxythymidine (dT) to generate deoxycytidine monophosphate (dCMP) and deoxythymidine monophosphate (dTMP)."
    explanation: States the reaction; an introduction sentence, not a result of the treatment study.
- name: Imbalanced Mitochondrial dNTP Pool
  biological_scale: MOLECULAR
  description: >-
    mtDNA replication is constitutive rather than cell-cycle-linked and therefore
    needs a continuous, balanced supply of all four deoxynucleoside triphosphates.
    A pool depleted of pyrimidines limits and distorts replication. Direct
    measurement of mitochondrial dNTP pools in patient muscle is not among the
    sources cited here; the imbalance is measured in the knock-in mouse and
    asserted as mechanism in the human discovery paper.
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: DECREASED
  downstream:
  - target: Skeletal Muscle mtDNA Depletion and Multiple Deletions
    description: >-
      An insufficient and unbalanced precursor supply limits mtDNA replication,
      lowering copy number and, over longer periods, generating deletions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11687801
      reference_title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in TK2 represent a new etiology for mitochondrial DNA depletion, underscoring the importance of the mitochondrial dNTP pool in the pathogenesis of mitochondrial depletion."
      explanation: The discovery paper's inference linking pool composition to depletion.
    - reference: PMID:18467430
      reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "animals showed Tk2 deficiency, unbalanced dNTP pools, mtDNA depletion and defects of respiratory chain enzymes containing mtDNA-encoded subunits"
      explanation: The full chain from enzyme loss through pool imbalance to depletion, in the knock-in mouse.
  evidence:
  - reference: PMID:18467430
    reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In contrast to nDNA synthesis, which is linked to cell cycle, mtDNA replication is constitutive and consequently requires a constant supply of deoxynucleoside triphosphates (dNTPs)"
    explanation: Why a constant balanced pool is required; an introduction sentence.
- name: Post-Mitotic Dependence on Mitochondrial Salvage
  biological_scale: CELLULAR
  description: >-
    TK2 is ubiquitously expressed, yet the disease is predominantly a myopathy.
    Two non-exclusive explanations are supported. In proliferating cells the
    cytosolic, cell-cycle-regulated kinases TK1 and dCK, together with de novo
    synthesis, supply enough deoxynucleotide to mask the defect; when TK1 activity
    falls in post-mitotic tissue the TK2 deficiency is unmasked, which in the mouse
    coincides exactly with the onset of mtDNA depletion. Independently, human
    tissue work found muscle to combine low basal TK2 activity with a high demand
    for mtDNA-encoded proteins.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Skeletal Muscle mtDNA Depletion and Multiple Deletions
    description: >-
      The loss of cytosolic compensation is what converts a ubiquitous enzyme
      deficiency into a tissue-restricted failure of mtDNA maintenance.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20940150
      reference_title: "Onset and organ specificity of Tk2 deficiency depends on Tk1 down-regulation and transcriptional compensation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The down-regulation of Tk1 activity unmasks Tk2 deficiency in Tk2-/- mice and correlates with the onset of mtDNA depletion in the brain and the heart."
      explanation: Ties loss of cytosolic compensation to the timing of mtDNA depletion.
  evidence:
  - reference: PMID:12765840
    reference_title: "mtDNA depletion myopathy: elucidation of the tissue specificity in the mitochondrial thymidine kinase (TK2) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that low basal TK2 activity combined with a high requirement for mitochondrial encoded proteins in muscle predispose this tissue to the devastating effect of TK2 deficiency."
    explanation: The human-tissue account of why skeletal muscle is the target organ.
  - reference: PMID:20940150
    reference_title: "Onset and organ specificity of Tk2 deficiency depends on Tk1 down-regulation and transcriptional compensation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, TK2 activity has minor functional significance in proliferating cells due to the overwhelming activity of cell-cycle-regulated cytosolic enzymes involved in the deoxynucleoside triphosphate (dNTP) synthesis"
    explanation: States the cytosolic compensation that spares dividing cells.
- name: Skeletal Muscle mtDNA Depletion and Multiple Deletions
  biological_scale: CELLULAR
  description: >-
    Reduced mtDNA copy number in skeletal muscle is the defining molecular lesion,
    severe in the infantile and childhood forms and much less common in the
    late-onset form, where multiple mtDNA deletions are found in essentially every
    patient instead. Depletion below about 30% of age-matched control was present
    in two thirds of the largest cohort.
  biological_processes:
  - preferred_term: mitochondrial DNA metabolic process
    term:
      id: GO:0032042
      label: mitochondrial DNA metabolic process
    modifier: DECREASED
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  downstream:
  - target: Combined Respiratory Chain Deficiency
    description: >-
      Too few intact mtDNA templates means too little of the 13 mtDNA-encoded
      respiratory-chain subunits, so the complexes containing them cannot be
      assembled in normal amounts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22345218
      reference_title: "Adult cases of mitochondrial DNA depletion due to TK2 defect: an expanding spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "combined mtDNA-dependent respiratory complexes deficiency and mtDNA depletion"
      explanation: The two findings co-occur in patient muscle.
  - target: Depletion of mitochondrial DNA in muscle
    description: The lesion is itself the reported laboratory phenotype.
    causal_link_type: DIRECT
  - target: Multiple mitochondrial DNA deletions
    description: >-
      In older patients the same maintenance failure manifests as accumulated
      deletions rather than, or as well as, reduced copy number.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of mtDNA in muscle were measured in 71 patients and showed significant depletion (<30% residual mtDNA relative to age-matched control subjects) in 47 (66%)."
    explanation: Frequency and threshold of depletion in the largest cohort.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple mtDNA deletions were detected in muscle of 24 patients primarily in late-onset patients: infantile-onset (1/8; 12.5%), childhood-onset (7/14; 50%) and late-onset (16/16; 100%)."
    explanation: The shift from depletion to deletions with later onset.
  - reference: PMID:11687801
    reference_title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identify two mutations in TK2, histidine 90 to asparagine and isoleucine 181 to asparagine, in four individuals who developed devastating myopathy and depletion of muscular mitochondrial DNA in infancy."
    explanation: The original observation linking TK2 variants to muscle mtDNA depletion.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Reduced activity of the respiratory-chain complexes that contain mtDNA-encoded
    subunits. Multiple OXPHOS defects were found in about three quarters of
    patients in whom enzymology was performed, and isolated complex IV deficiency
    in a further small group; a minority of childhood- and late-onset patients had
    normal activities, so normal enzymology does not exclude the diagnosis.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Progressive Skeletal Muscle Fibre Degeneration
    description: >-
      Deficient oxidative ATP production in a high-demand post-mitotic tissue
      drives fibre atrophy and necrosis.
    causal_link_type: DIRECT
  - target: Cytochrome c oxidase-negative muscle fibres
    description: >-
      The mosaic histochemical readout of the same lesion at single-fibre
      resolution.
    causal_link_type: DIRECT
  - target: Ragged-red muscle fibres
    description: Compensatory mitochondrial proliferation in affected fibres.
    causal_link_type: DIRECT
  - target: Decreased activity of mitochondrial complex IV
    description: >-
      Complex IV is the most frequent isolated enzyme deficiency measured in this
      disease, and part of the combined pattern in the rest.
    causal_link_type: DIRECT
  - target: Elevated blood lactate
    description: >-
      Impaired oxidative phosphorylation shifts pyruvate towards lactate. Raised
      lactate alongside raised creatine kinase is a recognised prompt to test TK2.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

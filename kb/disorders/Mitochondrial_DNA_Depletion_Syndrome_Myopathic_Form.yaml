progression:
- phase: Onset
  notes: >-
    Onset spans the whole of life, from birth to 72 years in the largest cohort,
    and the age at onset is the strongest single predictor of course. In the
    late-onset group the mean age at onset was 31 years, and subtle signs
    (for instance slow running) were often present in childhood without prompting
    medical evaluation.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age at disease onset ranged from birth to 72 years of age."
    explanation: Full span of reported onset ages.
  - reference: PMID:31060578
    reference_title: "Late-onset thymidine kinase 2 deficiency: a review of 18 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of onset was 31 years."
    explanation: Mean onset age in the late-onset series.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In retrospect, subtle signs of myopathy were often present in childhood (eg, slow running) but did not prompt medical evaluation until adulthood."
    explanation: Pre-symptomatic signs in the late-onset group.
- phase: Progression of weakness
  notes: >-
    Weakness progresses at rates that differ by an order of magnitude between the
    forms. Time from onset to ventilation or death is a median of 1.67 years in
    infantile onset against 10 years in childhood/late onset.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median time to event is 1.67 (CI 0.11 to 2.33) years for infantile onset and 10.00 (CI 3.50 to 22.00) years for childhood/late onset."
    explanation: Event-free survival, where the event is ventilation or death.
- phase: Survival
  notes: >-
    Median post-onset survival is about one year for infantile onset and at least
    23 years for the childhood- and late-onset groups combined, a difference of
    around twentyfold. Respiratory failure is the cause of death in about a
    quarter of all patients, and in every fatal case of the late-onset series.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median post-onset survival (POS) is 1.0 years (CI 0.58 to 2.33) for the infantile group and at least 23.0 years (CI 10.0 to incomputable) for the childhood-onset/late-onset group."
    explanation: Post-onset survival by clinical form.
  - reference: PMID:31060578
    reference_title: "Late-onset thymidine kinase 2 deficiency: a review of 18 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients had deceased, all of them due to respiratory insufficiency."
    explanation: Cause of death in the late-onset series.
histopathology:
- name: Skeletal muscle biopsy
  description: >-
    Muscle histochemistry was abnormal in every patient in whom it was performed:
    cytochrome c oxidase-deficient fibres with ragged-red fibres in three
    quarters, COX-deficient fibres alone in a further fifth, and isolated
    ragged-red fibres in the remainder. On routine histology there are atrophic
    and necrotic fibres, fibre-size variability with type 1 predominance,
    increased internal nuclei and replacement by fat and connective tissue, so the
    biopsy reads as a dystrophy with a mitochondrial overlay. Respiratory-chain
    enzyme activities were reduced in the great majority of biopsies.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 87.5% of the biopsies, biochemical activities of respiratory chain enzymes were reduced with isolated complex IV deficiency or variable defects of complexes I, III and IV."
    explanation: Proportion of biopsies with reduced respiratory-chain activity, and the pattern.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histochemical data were available in 77% of patients confirming COX deficiency with or without RRFs as morphological hallmarks of TK2 deficiency."
    explanation: The histochemical hallmarks.
genetic:
- name: TK2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TK2
    term:
      id: hgnc:11831
      label: TK2
  features: >-
    Biallelic TK2 variants are the cause of the myopathic form of mtDNA depletion
    syndrome. Pathogenic variants have been found in every exon and no clear
    genotype-phenotype correlation emerges: p.Thr108Met homozygotes in one cohort
    spanned all three clinical forms, and residual enzyme activity in patient
    fibroblasts did not track severity. Two regions are recurrent, the
    substrate-binding site encoded by exon 5 and the active site in exon 8.
  notes: >-
    ClinGen has not published a Gene-Disease Validity assertion for TK2, so no
    gene_disease_validity tier is recorded here; `just clingen-list` returns no
    TK2 assertion as of 2026-09-29.
  case_fractions:
  - population: Spanish late-onset TK2 deficiency cases
    case_fraction_percent: 46.9
    cohort_size: 53
    notes: >-
      Share of Spanish late-onset patients carrying the founder in-frame deletion
      p.Lys202del. This is an allele share within a founder population, not a
      population prevalence.
    evidence:
    - reference: PMID:38544965
      reference_title: Clinical and Genetic Analysis of Patients With TK2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In late-onset cases, 46.9% carried the p.Lys202del variant."
      explanation: Quantifies the p.Lys202del share among Spanish late-onset patients.
    - reference: PMID:38544965
      reference_title: Clinical and Genetic Analysis of Patients With TK2 Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study includes 53 patients harboring biallelic TK2 pathogenic variants, compiling data retrospectively from 7 Spanish centers."
      explanation: Cohort size and composition behind the fraction above.
  evidence:
  - reference: PMID:11687801
    reference_title: Mutant mitochondrial thymidine kinase in mitochondrial DNA depletion myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in TK2 represent a new etiology for mitochondrial DNA depletion"
    explanation: The original gene-disease association.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The substrate binding site (encoded by exon 5) and active site (exon 8) are hotspots for the mutations."
    explanation: Location of the two recurrent regions.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common mutation, p.Thr108Met, was identified in a homozygous state in 13 patients with heterogeneous clinical phenotypes"
    explanation: The commonest allele, and that one genotype spans several phenotypes.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "12 mutations were associated with multiple phenotypes so overall genotype-phenotype correlations based on type of mutation and protein location could not be clearly delineated"
    explanation: >-
      Refutes a usable genotype-phenotype rule in this disease, which matters for
      counselling and for stratifying trials.
diagnosis:
- name: TK2 molecular testing
  description: >-
    Biallelic pathogenic TK2 variants establish the diagnosis. Because the
    late-onset form mimics facioscapulohumeral dystrophy and the childhood form
    mimics spinal muscular atrophy type 3, the natural-history authors recommend
    screening genetically undiagnosed recessive myopathies, including FSHD-like
    cases, for TK2 variants.
  evidence:
  - reference: PMID:23230576
    reference_title: "TK2-Related Mitochondrial DNA Maintenance Defect, Myopathic Form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is confirmed by the identification of biallelic pathogenic variants in TK2 by molecular genetic testing."
    explanation: The confirmatory test.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that genetically undiagnosed patients with autosomal recessive myopathies, including FSHD-like cases, should be screened for TK2 mutations in blood or mitochondrial alterations in muscle biopsies."
    explanation: Who to test, given the mimics.
- name: Muscle mtDNA copy number
  description: >-
    Quantitative mtDNA content in skeletal muscle is the tissue-level criterion.
    GeneReviews sets it at typically below 20% of age- and tissue-matched control
    for an infantile presentation; beyond age two, reduced content or multiple
    deletions with ragged-red and/or COX-deficient fibres suffices. Note that a
    late-onset patient may have normal copy number with deletions only, so a
    normal quantification does not exclude the diagnosis in an adult.
  evidence:
  - reference: PMID:23230576
    reference_title: "TK2-Related Mitochondrial DNA Maintenance Defect, Myopathic Form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "established in a proband with infantile onset of disease with severely reduced (typically <20% of age- and tissue-matched healthy controls) mtDNA content in skeletal muscle"
    explanation: The infantile-onset diagnostic threshold.
  - reference: PMID:23230576
    reference_title: "TK2-Related Mitochondrial DNA Maintenance Defect, Myopathic Form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "established in a proband older than age two years with reduced mtDNA content or multiple mtDNA deletions, ragged red fibers and/or COX-deficient fibers in skeletal muscle"
    explanation: The criterion beyond infancy, which admits deletions in place of depletion.
- name: Muscle magnetic resonance imaging
  description: >-
    A reproducible pattern of selective muscle involvement in late-onset disease,
    worst in gluteus maximus, semitendinosus and sartorius. It is a non-invasive
    adjunct to the biopsy rather than a confirmatory test: the pattern was derived
    from a single eighteen-patient series and has not been compared against the
    other myopathies TK2 deficiency is mistaken for, so it can direct a biopsy and
    a TK2 test but cannot substitute for either.
  diagnosis_term:
    preferred_term: muscle magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:31060578
    reference_title: "Late-onset thymidine kinase 2 deficiency: a review of 18 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified common radiological features in muscle magnetic resonance, where the most severely affected muscles were the gluteus maximus, semitendinosus and sartorius."
    explanation: The selective muscle-involvement pattern on MRI, and its single-series provenance.
- name: Muscle biopsy histochemistry
  description: >-
    Dystrophic features together with a cytochrome c oxidase defect and ragged-red
    fibres is the histological pattern that should raise TK2 deficiency, but it is
    not confirmatory on its own.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "must be supplemented by molecular genetic studies to confirm TK2 deficiency"
    explanation: The histology is suggestive, not diagnostic.
- name: Electromyography
  description: >-
    Myopathic motor unit potentials in about four fifths of patients tested.
    Neurogenic changes occur in a minority, and two patients had a genuine sensory
    axonal neuropathy, so a neurogenic EMG does not exclude the diagnosis.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EMG revealed myopathic changes in 78.6% of patients tested."
    explanation: Proportion with myopathic electrophysiology.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate peripheral nerve involvement in a minority of patients with TK2 deficiency."
    explanation: Peripheral nerve involvement in a minority, which complicates the electrophysiological picture.
- name: Serum GDF-15
  description: >-
    Growth differentiation factor 15 was raised at baseline and fell on treatment
    in every patient tested in the expanded-access programme, and is described as
    a biomarker correlating with therapeutic response rather than as a diagnostic
    test.
  evidence:
  - reference: PMID:35094997
    reference_title: "Advances in Thymidine Kinase 2 Deficiency: Clinical Aspects, Translational Progress, and Emerging Therapies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the early expanded access program, growth differentiation factor 15 (GDF-15) appears to be a useful biomarker that correlates with therapeutic response."
    explanation: The role claimed for GDF-15, which is treatment monitoring rather than diagnosis.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baseline elevated serum growth differentiation factor 15 levels decreased with treatment in all 7 patients tested."
    explanation: The primary observation behind that claim.
differential_diagnoses:
- name: Mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
  disease_term:
    preferred_term: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
    term:
      id: MONDO:0009636
      label: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
  description: >-
    The purine mirror image of this disease, and the closest mechanistic relative
    in the knowledge base. DGUOK encodes deoxyguanosine kinase, the other
    mitochondrial deoxyribonucleoside kinase: between them, dGK and TK2
    phosphorylate all four deoxynucleosides. Loss of either impairs the same
    salvage pathway and produces mtDNA depletion, so the biochemistry is shared
    and the separation is by substrate arm and target organ.
  distinguishing_features:
  - DGUOK phosphorylates the purine deoxynucleosides deoxyguanosine and deoxyadenosine; TK2 phosphorylates the pyrimidines deoxythymidine, deoxycytidine and deoxyuridine.
  - DGUOK deficiency is liver-predominant with cholestatic liver failure, nystagmus and developmental delay; TK2 deficiency is skeletal-muscle-predominant and the liver is spared.
  - In the original TK2 series, liver, brain, heart and skin remained unaffected throughout life, which is the tissue distinction rather than a severity one.
  - Nucleoside substitution is established for TK2 deficiency; for DGUOK deficiency the intervention that changes survival is liver transplantation.
  evidence:
  - reference: PMID:18467430
    reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide pools for mitochondrial DNA maintenance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "TK2 mutations have been associated with severe infantile myopathy, a milder myopathy with later onset and longer survival, rigid spine syndrome and spinal muscular atrophy (SMA)-like motor neuron disease while DGUOK mutations cause hepatocerebral disease"
    explanation: States the organ split between the two deoxyribonucleoside kinase deficiencies.
  - reference: PMID:12765840
    reference_title: "mtDNA depletion myopathy: elucidation of the tissue specificity in the mitochondrial thymidine kinase (TK2) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other tissues such as liver, brain, heart, and skin remain unaffected throughout the patients' life."
    explanation: The organ sparing that separates TK2 from DGUOK deficiency clinically.
- name: Mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
  disease_term:
    preferred_term: mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
    term:
      id: MONDO:0012791
      label: mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
  description: >-
    The encephalomyopathic member of the MDS family, from SUCLA2 (or SUCLG1)
    deficiency. It shares infantile hypotonia, muscle mtDNA depletion and lactate
    elevation with the infantile-onset form of TK2 deficiency.
  distinguishing_features:
  - SUCLA2 encodes a subunit of succinyl-CoA ligase in the TCA cycle, not a deoxyribonucleoside kinase; the mtDNA depletion there is a downstream consequence rather than a precursor shortage.
  - Methylmalonic aciduria with raised C4-dicarboxylic carnitine is the biochemical signature of SUCLA2 deficiency and is absent in TK2 deficiency.
  - SUCLA2 disease is dominated by dystonia, deafness and basal ganglia change; TK2 disease is dominated by limb and respiratory myopathy with cognition typically spared.
  evidence:
  - reference: PMID:23230576
    reference_title: "TK2-Related Mitochondrial DNA Maintenance Defect, Myopathic Form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive function is typically spared."
    explanation: >-
      Cognitive sparing in TK2 deficiency, against the encephalopathic course of the
      SUCLA2 form.
- name: Mitochondrial neurogastrointestinal encephalomyopathy
  disease_term:
    preferred_term: mitochondrial neurogastrointestinal encephalomyopathy
    term:
      id: MONDO:0017575
      label: mitochondrial neurogastrointestinal encephalomyopathy
  description: >-
    The other pyrimidine-pool mtDNA maintenance disorder. TYMP encodes thymidine
    phosphorylase, which catabolises the same nucleosides TK2 phosphorylates, so
    the two diseases sit on opposite sides of one metabolic balance: TK2
    deficiency depletes the pool and MNGIE floods it with thymidine and
    deoxyuridine. Both cause mtDNA depletion, multiple deletions and a
    mitochondrial myopathy with ptosis and ophthalmoparesis.
  distinguishing_features:
  - MNGIE is defined by gastrointestinal dysmotility with cachexia and by leukoencephalopathy on MRI, neither of which features in TK2 deficiency.
  - MNGIE is diagnosed by raised plasma thymidine and deoxyuridine with absent thymidine phosphorylase activity; TK2 deficiency has no such circulating marker.
  - Thymidine phosphorylase is the enzyme that counteracts TK2 by lowering its substrates, so a nucleoside-supplementation strategy would be actively harmful in MNGIE.
  evidence:
  - reference: PMID:20940150
    reference_title: "Onset and organ specificity of Tk2 deficiency depends on Tk1 down-regulation and transcriptional compensation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Strict homeostatic maintenance of the mitochondrial deoxythymidine monophosphate (dTMP) and deoxycytidine monophosphate (dCMP) levels is achieved by counteracting TK2 activity with the catabolic actions of cytosolic thymidine phosphorylase (TP) that decreases the levels of TK2 substrates"
    explanation: >-
      Establishes that TK2 and thymidine phosphorylase are opposed arms of one
      pool, which is why the two diseases are mechanistic mirror images.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A growing number of mitochondrial diseases with mtDNA instability have been linked to mitochondrial deoxynucleotide pool imbalance, including deficiencies of TK2, dGK, RRM2B or TYMP."
    explanation: Places TK2, DGUOK and TYMP deficiencies in one mechanistic class.
- name: MSTO1-related mitochondrial myopathy
  disease_term:
    preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
    term:
      id: MONDO:0044714
      label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
  description: >-
    The nearest laboratory mimic: a myopathy with reduced mtDNA copy number whose
    largest cohort argued it should itself be classified as an mtDNA depletion
    syndrome. The dismech MSTO1 entry already lists this disease as its
    nosological neighbour; this is the reverse pointer.
  distinguishing_features:
  - MSTO1 encodes a cytosolic protein acting on mitochondrial dynamics, not an enzyme of the deoxynucleoside salvage pathway.
  - Cerebellar atrophy with ataxia is core to MSTO1 disease and is not a feature of the myopathic form of TK2 deficiency.
  - MSTO1 muscle shows a dystrophic pattern with normal oxidative histochemistry and normal respiratory-chain activities, whereas COX-deficient and ragged-red fibres with combined respiratory-chain deficiency are the rule in TK2 muscle.
  - Progression in MSTO1 disease is slow or static, whereas TK2 myopathy is relentlessly progressive with respiratory failure.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histochemical data were available in 77% of patients confirming COX deficiency with or without RRFs as morphological hallmarks of TK2 deficiency."
    explanation: >-
      The histochemical hallmark of TK2 muscle, which is what the MSTO1 cohort
      reported as absent in its own patients.
- name: Facioscapulohumeral muscular dystrophy
  disease_term:
    preferred_term: facioscapulohumeral muscular dystrophy
    term:
      id: MONDO:0001347
      label: facioscapulohumeral muscular dystrophy
  description: >-
    The clinical mimic of the adult-onset form. Nearly half of adult-onset TK2
    patients in the largest cohort presented with marked facial weakness, scapular
    winging or both, which is the FSHD phenotype, and the natural-history authors
    recommend screening FSHD-like cases without a molecular diagnosis for TK2
    variants.
  distinguishing_features:
  - FSHD is dominantly inherited (a contracted D4Z4 repeat with a permissive 4qA allele in FSHD1, or an SMCHD1/DNMT3B variant in FSHD2); TK2 deficiency is autosomal recessive.
  - FSHD weakness is characteristically asymmetric and descending; TK2 weakness is generalised with axial and proximal predominance.
  - FSHD muscle does not show COX-negative and ragged-red fibres with mtDNA depletion or multiple deletions.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The adult myopathy shares prominent facial weakness with facioscapulohumeral muscular dystrophy (FSHD)."
    explanation: The basis of the clinical confusion.
- name: Spinal muscular atrophy
  disease_term:
    preferred_term: spinal muscular atrophy
    term:
      id: MONDO:0001516
      label: spinal muscular atrophy
  description: >-
    The clinical mimic across the whole severity range. The natural-history
    authors map infantile TK2 myopathy onto SMA type 1 and severe type 2,
    childhood onset onto milder type 2 and type 3a, and late onset onto types 3b
    and 4, noting that TK2 weakness is more progressive.
  distinguishing_features:
  - SMA is a motor neuron disease from biallelic SMN1 loss with a modifying SMN2 copy number; TK2 deficiency is a primary myopathy.
  - Creatine kinase is raised 1.3 to 30-fold in TK2 deficiency; it is normal or only mildly raised in SMA.
  - Electromyography is myopathic in about four fifths of TK2 patients, against the neurogenic pattern of SMA.
  - Muscle biopsy in TK2 deficiency shows COX-negative and ragged-red fibres with reduced mtDNA copy number; SMA shows grouped fibre-type atrophy without mitochondrial change.
  evidence:
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The range of weakness severity among TK2-deficient patients parallels the spectrum of SMA with infantile-onset TK2 myopathy resembling SMA type 1 and severe type 2, childhood-onset myopathy similar to milder type 2 and 3a SMA, and late-onset myopathy comparable to SMA types 3b and IV, although the weakness is more progressive."
    explanation: The explicit mapping of TK2 forms onto SMA types, and the caveat.
  - reference: PMID:28318037
    reference_title: Deoxycytidine and Deoxythymidine Treatment for Thymidine Kinase 2 Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "childhood-onset myopathy, which resembles spinal muscular atrophy (SMA) type III"
    explanation: An independent statement of the SMA type 3 resemblance.
treatments:
- name: Deoxycytidine and Deoxythymidine Substitution
  description: >-
    Oral deoxycytidine plus deoxythymidine -- given the pharmaceutical names
    doxecitine and doxribtimine and marketed as KYGEVVI -- the
    substrate-enhancement therapy that is the major therapeutic development in
    this disease, and since 3 November 2025 the first approved treatment for TK2
    deficiency in the USA, where the licensed indication is restricted to symptom
    onset on or before age 12. The rationale is that raising the concentration of
    TK2's own substrates lets residual enzyme, and the cytosolic kinases, deliver
    enough pyrimidine deoxynucleotide for mtDNA replication. It was established in
    the Tk2 H126N knock-in mouse, where dC+dT delayed onset, extended lifespan and
    restored mtDNA copy number and respiratory-chain activity, and then given to 16
    patients under expanded access. In that open-label cohort three of eight
    non-ambulatory patients regained walking, four of five discontinued
    feeding-tube use, and one of nine came off mechanical ventilation. Doses are
    300-400 mg/kg/day of each nucleoside, titrated against stool frequency;
    dose-dependent diarrhoea occurred in half the patients and two of a separate
    group of twelve developed reversible transaminase elevation. The approval
    rested on pooled retrospective and single-arm data rather than a randomised
    comparison, and that data set is what draws the age limit: mortality was 4% in
    treated against 57% in untreated patients with onset at or before 12 years, but
    in later-onset patients the difference, 18% against 24%, was not significant. A
    2022 review, written before the filing, still described the supporting trials
    as ongoing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxecitine (deoxycytidine)
      term:
        id: CHEBI:15698
        label: 2'-deoxycytidine
    - preferred_term: doxribtimine (deoxythymidine)
      term:
        id: CHEBI:17748
        label: thymidine
  target_mechanisms:
  - target: Imbalanced Mitochondrial dNTP Pool
    description: >-
      Supplying the substrates in excess is intended to restore the pyrimidine
      arm of the mitochondrial deoxynucleotide pool without replacing the enzyme.
  - target: Skeletal Muscle mtDNA Depletion and Multiple Deletions
    description: >-
      The proximate biochemical endpoint: restored mtDNA copy number, demonstrated
      in the mouse and inferred in patients from motor and biomarker response.
  - target: Respiratory Muscle Failure
    description: >-
      The clinically decisive endpoint. One of nine ventilated patients became able
      to breathe independently on therapy.
  evidence:
  - reference: PMID:28318037
    reference_title: Deoxycytidine and Deoxythymidine Treatment for Thymidine Kinase 2 Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed that dC+dT delayed disease onset, prolonged life span of Tk2-deficient mice and restored mtDNA copy number as well as respiratory chain enzyme activities and levels."
    explanation: The preclinical result that established the nucleoside form of the therapy.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of 8 patients who were nonambulatory at baseline gained the ability to walk on therapy; 4 of 5 patients who required enteric nutrition were able to discontinue feeding tube use; and 1 of 9 patients who required mechanical ventilation became able to breathe independently."
    explanation: The functional gains in the expanded-access cohort.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 5 patients with early onset and severe disease, survival and motor functions were better than historically untreated patients. In 11 childhood and adult onset patients, clinical measures stabilized or improved."
    explanation: >-
      The survival and stabilisation claim, and the comparator: historical controls,
      not a randomised arm.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients are currently maintained on doses between 300 and 400mg/kg/day of each nucleoside or nucleotide."
    explanation: The dose range used.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A side effect observed in 8 of the 16 patients was dose-dependent diarrhea, which did not require withdrawal of treatment."
    explanation: The dose-limiting adverse effect.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 12 other TK2 patients treated with deoxynucleoside, 2 adults developed elevated liver enzymes that normalized following discontinuation of therapy."
    explanation: A second, reversible adverse effect in a separate treated group.
  - reference: PMID:35094997
    reference_title: "Advances in Thymidine Kinase 2 Deficiency: Clinical Aspects, Translational Progress, and Emerging Therapies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This treatment is currently undergoing testing in clinical trials intended to support approval in the US and European Union (EU)."
    explanation: >-
      Regulatory status as of this 2022 review, retained as historical context only.
      It was superseded by the November 2025 approval recorded in the items below,
      and should not be read as the current status.
  - reference: PMID:41604077
    reference_title: "Doxecitine and Doxribtimine: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Doxecitine and doxribtimine received its first approval in the USA on 3 November 2025 for the treatment of TK2d in adults and pediatric patients with an age of symptom onset on or before 12 years"
    explanation: >-
      The approval date and the licensed indication, including the age-at-onset
      restriction. Graded OTHER because the quoted text reports a regulatory action
      rather than a study result.
  - reference: PMID:41604077
    reference_title: "Doxecitine and Doxribtimine: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is the first approved therapy for patients with TK2d."
    explanation: >-
      Establishes that nothing was licensed for this disease before, which is what
      makes the approval the change in therapeutic status rather than an addition.
  - reference: PMID:41604077
    reference_title: "Doxecitine and Doxribtimine: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Administration of doxecitine and doxribtimine facilitates the incorporation of the pyrimidine nucleosides deoxycytidine and deoxythymidine into skeletal muscle mtDNA, thereby promoting restoration of mtDNA copy number"
    explanation: >-
      The pharmacodynamic mechanism as characterized at approval, matching the
      target_mechanisms links on the dNTP pool and mtDNA depletion nodes.
  - reference: PMID:41604077
    reference_title: "Doxecitine and Doxribtimine: First Approval."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pyrimidine nucleos(t)ide therapy significantly decreased mortality in patients with TK2d aged ≤ 12 years at symptom onset, but not in patients aged > 12 years at symptom onset"
    explanation: >-
      The subgroup result behind the licensed age limit: a mortality benefit in
      early-onset disease and none demonstrated in later-onset disease.
  - reference: PMID:41604077
    reference_title: "Doxecitine and Doxribtimine: First Approval."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients aged ≤ 12 years at symptom onset, death occurred in 4% of treated patients and 57% of untreated patients"
    explanation: The mortality figures in the subgroup the approval covers.
  - reference: PMID:41604077
    reference_title: "Doxecitine and Doxribtimine: First Approval."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients aged > 12 years at symptom onset, death occurred in 18% of treated patients and 24% of untreated patients"
    explanation: >-
      The corresponding figures in later-onset disease, where the difference did not
      reach significance.
- name: Deoxycytidine and Deoxythymidine Monophosphate Bypass
  description: >-
    The original nucleotide formulation, dCMP plus dTMP, which was the first
    pharmacological treatment shown to work in the Tk2 knock-in mouse: it raised
    dTTP, increased mtDNA, improved respiratory-chain enzymes and extended median
    lifespan from 13 to 34 days. It has been largely superseded because the
    monophosphates are rapidly catabolised to the nucleosides after
    administration, which is what identified dC and dT as the active agents, and
    most patients were converted to nucleosides in 2015. Adding the deaminase
    inhibitor tetrahydrouridine to shield deoxycytidine from deamination was
    tested and made things worse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Imbalanced Mitochondrial dNTP Pool
    description: >-
      Intended to bypass the missing kinase step entirely by supplying its products
      rather than its substrates.
  evidence:
  - reference: PMID:24968719
    reference_title: Deoxypyrimidine monophosphate bypass therapy for thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the compounds raise dTTP concentrations, increase levels of mtDNA, ameliorate defects of mitochondrial respiratory chain enzymes, and significantly prolong their lifespan (34 days with treatment versus 13 days untreated)"
    explanation: The original bypass result, with the survival figures.
  - reference: PMID:24968719
    reference_title: Deoxypyrimidine monophosphate bypass therapy for thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "dCMP/dTMP supplementation is the first effective pharmacologic treatment for Tk2 deficiency"
    explanation: Its place in the therapeutic history of the disease.
  - reference: PMID:31125140
    reference_title: Deoxynucleoside Therapy for Thymidine Kinase 2-Deficient Myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "we subsequently observed that after administration, dCMP and dTMP are rapidly catabolized to the nucleosides dC and dT, suggesting that nucleosides, rather than nucleotides, are the major active therapeutic agents"
    explanation: Why the nucleotide formulation was superseded by the nucleoside one.
  - reference: PMID:28318037
    reference_title: Deoxycytidine and Deoxythymidine Treatment for Thymidine Kinase 2 Deficiency.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, dCMP+dTMP+THU therapy decreased life span of Tk2-/- animals compared to dCMP+dTMP."
    explanation: >-
      Refutes the deaminase-inhibition strategy: adding tetrahyduridine to protect
      deoxycytidine shortened survival rather than extending it.
- name: AAV-Mediated TK2 Gene Therapy
  description: >-
    Investigational, preclinical only. AAV9 delivery of human TK2 cDNA to the
    knock-in mouse restored Tk2 activity in every tissue tested except kidney,
    delayed onset and extended lifespan; sequential AAV9 then AAV2 dosing let the
    viral dose be lowered while extending survival further, and adding dC+dT on
    top improved liver and kidney mtDNA copy number, growth and lifespan again.
    There is no human evidence.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  delivery_system:
    delivery_platform: VIRAL_VECTOR
    notes: >-
      AAV9 as the primary serotype, with sequential AAV2 re-dosing in the
      dose-sparing arm. Both are reported in the mouse only.
  target_mechanisms:
  - target: TK2 Loss of Function
    description: >-
      Unlike substrate enhancement, gene replacement addresses the enzyme deficit
      itself rather than working around it.
  evidence:
  - reference: PMID:34338329
    reference_title: Synergistic Deoxynucleoside and Gene Therapies for Thymidine Kinase 2 Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AAV9 delivery of human TK2 cDNA to Tk2KI mice efficiently rescued Tk2 activity in all the tissues tested except the kidneys, delayed disease onset, and increased lifespan."
    explanation: The gene-therapy result, including the tissue it failed to reach.
  - reference: PMID:34338329
    reference_title: Synergistic Deoxynucleoside and Gene Therapies for Thymidine Kinase 2 Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "addition of deoxycytidine and deoxythymidine supplementation to AAV9 + AAV2 treated Tk2KI mice dramatically improved mtDNA copy numbers in the liver and kidneys, animal growth, and lifespan"
    explanation: The synergy with nucleoside therapy, which is the paper's central claim.
- name: Respiratory Support and Ventilation
  description: >-
    Non-invasive or invasive ventilation, with chest physiotherapy to maintain
    pulmonary function and reduce infection risk. Two thirds of patients in the
    largest cohort required ventilatory support and respiratory failure is the
    leading cause of death, so this is the intervention that most often determines
    survival in practice.

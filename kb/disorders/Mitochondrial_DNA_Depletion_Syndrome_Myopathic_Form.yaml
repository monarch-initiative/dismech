    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory muscles were severely compromised in 33/51 (65%) patients, who required mechanical ventilation or nocturnal/continuous non-invasive ventilation"
    explanation: Frequency of ventilatory support.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "27.2% (25 of 92) of the patients are known to have died from respiratory failure"

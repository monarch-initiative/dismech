- name: Respiratory Muscle Failure
  biological_scale: ORGANISM
  description: >-
    Weakness of the diaphragm and accessory respiratory muscles produces a
    restrictive ventilatory defect, ventilator dependence and, in most fatal cases,
    death. Two thirds of the largest cohort needed invasive or non-invasive
    ventilation, and just over a quarter of all patients are known to have died of
    respiratory failure. In some late-onset patients nocturnal dyspnoea was the
    first symptom.
  downstream:
  - target: Respiratory insufficiency
    description: The clinical expression of respiratory muscle weakness.
    causal_link_type: DIRECT

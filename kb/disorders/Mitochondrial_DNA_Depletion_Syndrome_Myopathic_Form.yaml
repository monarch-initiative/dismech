phenotypes:
- name: Proximal muscle weakness
  category: Musculoskeletal
  description: >-
    The cardinal feature, present in every patient in the largest cohort either
    at onset or during the course. Weakness is predominantly axial and proximal
    but reaches facial, ocular and respiratory muscles.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
    clinical_course: PROGRESSIVE
  sequelae:
  - target: Loss of ambulation

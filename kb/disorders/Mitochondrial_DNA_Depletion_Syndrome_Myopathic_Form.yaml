- name: Seizures
  category: Neurologic
  description: >-
    Seizures, concentrated in infantile onset, but with counts that the source
    cohort does not reconcile: its whole-cohort paragraph reports recurrent seizures
    in six of 92 patients, while its infantile-onset paragraph reports seizures in
    seven of the 39 infantile patients -- a subgroup count larger than the
    whole-cohort count. The wording differs between the two paragraphs, "recurrent
    seizures" against "seizures", so the most economical reading is that the cohort
    figure counts only recurrent seizures and the infantile figure counts any
    seizure. The two are not presented here as reconciling; six to seven is the
    defensible range. Whether the seizures are a primary consequence of neuronal
    mtDNA depletion or secondary to hypoxic-ischaemic injury is unresolved.

    explanation: Respiratory involvement can be the presenting feature.
- name: Central Nervous System Involvement
  biological_scale: ORGANISM
  description: >-
    A minority of patients have nervous-system disease: seizures, encephalopathy,
    cognitive impairment, sensorineural hearing loss or episodic coma, in about a
    sixth of the largest cohort and a quarter of its infantile-onset group. The
    causal attribution is not settled. TK2 is ubiquitous and the knock-in mouse
    develops a frank encephalomyelopathy with respiratory-chain deficits most
    prominent in the central nervous system, so a primary neuronal mtDNA-depletion
    mechanism is plausible; but the natural-history authors note that restrictive
    lung disease is so frequent in this disease that hypoxic-ischaemic injury
    cannot be excluded in individual patients.

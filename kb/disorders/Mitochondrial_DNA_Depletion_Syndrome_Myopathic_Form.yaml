    evidence_source: HUMAN_CLINICAL
    snippet: "CNS signs are more frequent and severe in the infantile form with 10/39 patients (25.6%) manifesting as encephalopathy, seizures or cognitive impairment"
    explanation: Concentration of CNS involvement in the infantile-onset form.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.

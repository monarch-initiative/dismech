    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nervous system was affected in 15 out of 92 (16%) causing recurrent seizures (six), encephalopathy (seven), cognitive impairment (four), sensorineural hearing loss (three) and episodic coma (one)."
    explanation: Human frequency and composition of nervous-system involvement.
  - reference: PMID:29602790
    reference_title: Retrospective natural history of thymidine kinase 2 deficiency.

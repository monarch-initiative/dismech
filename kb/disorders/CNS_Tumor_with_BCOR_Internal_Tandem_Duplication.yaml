    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CNS HGNET-BCOR entity consisted of relatively compact tumors with a combination of spindle to oval cells."
    explanation: >-
      The 2016 study: compact tumours of spindle to oval cells.

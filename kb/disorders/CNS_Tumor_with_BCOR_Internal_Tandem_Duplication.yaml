- name: CNS Tumor with BCOR or BCORL1 Fusion
  description: >-
    A different and still rarer entity, with fewer than 40 reported cases, in
    which BCOR or BCORL1 is fused to another gene. The gliomas with an
    EP300-BCOR fusion arise in older children, in the cerebral hemispheres,
    and grow by infiltration. The nuclei can stain for BCOR, so the stain does
    not separate the two.
  distinguishing_features:
  - A gene fusion and no duplication on sequencing
  - No perivascular pseudorosettes in the gliomas with an EP300-BCOR fusion
  - A separate methylation cluster in the first three cases described, although a later series found fusion tumours in the class of the duplication
  notes: >-
    No disease term is bound. An OLS search of MONDO for BCOR on 11 November
    2026 returned five terms: MONDO:0858966, which is this entry, and four
    sarcoma terms (MONDO:0958159, MONDO:0958295, MONDO:0958296 and
    MONDO:0958297).

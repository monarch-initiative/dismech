- name: Survival
  description: >-
    The outlook is poor, and the figures are uncertain because the series are
    small and differently selected. A 2020 review of 24 reported cases gave an
    overall survival of 50 per cent after 48 months. A 2025 review states that
    recurrence is frequent and that most patients die of the disease, while
    recording a survivor of more than 14 years. In the largest single series
    all ten children were alive at last follow-up, after a median of two
    years, two of them after 4.5 and 14.2 years. In eight children whose
    tumours fell in the methylation class, none stayed free of events for five
    years after chemotherapy alone, and overall survival at five years was
    53.6 per cent, extended by radiotherapy given after progression; that
    group included tumours with a fusion in place of the duplication. A series
    of 33 tumours with the duplication at any site, ten of them in the brain,
    gave a median overall survival of 3.9 years.

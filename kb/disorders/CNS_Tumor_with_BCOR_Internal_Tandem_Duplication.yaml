name: CNS Tumor with BCOR Internal Tandem Duplication
creation_date: '2026-11-11T03:46:38Z'
description: >-
  CNS tumor with BCOR internal tandem duplication is a rare malignant tumour
  of the brain in young children. It was separated in 2016 from the tumours
  then called primitive neuroectodermal tumours of the central nervous system,
  and the 2021 World Health Organization classification lists it among the
  embryonal tumours. It is defined by the duplication of a short stretch of
  the last exon of the BCOR gene, the same lesion that defines clear cell
  sarcoma of kidney and a soft tissue sarcoma of infancy. Sixty-nine cases had
  been reported by 2025. The median age at diagnosis is about three years, and
  boys and girls are affected equally. The tumour is a single large, sharply
  bounded mass, in the cerebellum in about two fifths of cases and in the
  cerebral hemispheres in most of the rest, and children present with raised
  pressure in the head.

  Under the microscope the tumour is made of uniform oval or spindle cells
  arranged around vessels in the manner of an ependymoma, and the nuclei stain
  strongly for BCOR, a stain that is sensitive but not specific. The
  duplication lies in the part of the BCOR protein that binds PCGF1 to build
  the polycomb complex PRC1.1. In binding experiments it prevents that
  assembly, and in human neural stem cells it releases polycomb target genes
  from repression. Which cell the tumour starts in is not settled.

  There is no standard treatment. Resection, radiotherapy and multi-agent
  chemotherapy are used. The tumour often comes back, and a review of the
  reported cases states that most patients die of it, although survivors of
  more than ten years are recorded.
categories:
- Pediatric Cancer
- Brain Cancer
parents:
- CNS embryonal tumour
synonyms:
- CNS BCOR-ITD
- CNS HGNET-BCOR
- CNS high-grade neuroepithelial tumor with BCOR alteration
- high-grade neuroepithelial tumor with BCOR exon 15 internal tandem duplication
- central nervous system tumor with BCOR internal tandem duplication
notes: >-
  Name. The entry uses the name of the 2021 World Health Organization
  classification and of the NCI Thesaurus (NCIT:C186556). MONDO:0858966
  carries the same name with the gene symbol in lower case, and the term label
  below is copied as MONDO has it. Before 2021 the tumour was called CNS
  high-grade neuroepithelial tumor with BCOR alteration (CNS HGNET-BCOR);
  those names are kept as synonyms.

  Scope. The entry covers the tumour defined by the duplication. Brain tumours
  with a BCOR or BCORL1 gene fusion are a different entity and appear only as
  a differential diagnosis; MONDO has no term for them (an OLS search of MONDO
  for BCOR on 11 November 2026 returned five terms, this one and four sarcoma
  terms). The tumours outside the brain that carry the same duplication are
  curated separately as Clear Cell Sarcoma of Kidney and Sarcoma with BCOR
  Genetic Alterations.

  The methylation class is wider than the entity. Tumours are often assigned
  to this entity by DNA methylation profiling, but the class also takes in
  tumours with a BCOR fusion and no duplication: in one series of eight
  tumours of the class, three of the six that were sequenced had the
  duplication and three had a fusion. Figures from cohorts defined by
  methylation alone are marked as such.

  Exon numbering. Most papers place the duplication in exon 15 of BCOR. The
  2016 paper that defined the entity calls the same exon 16.

  Sources. The evidence is case reports and small series: the largest single
  series has ten patients, and a 2025 review collected 69. No figure here
  comes from a prospective study of this tumour.

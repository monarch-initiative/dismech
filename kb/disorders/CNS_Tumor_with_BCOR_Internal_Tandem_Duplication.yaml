      A 2025 review of the fusion tumours: fewer than 40 cases.
  - reference: PMID:40724977
    reference_title: "CNS Tumor with BCOR/BCORL1 Fusion: A Rare Tumor Entity."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS

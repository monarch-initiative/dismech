- name: Histology and BCOR Immunohistochemistry
  description: >-
    The tumour cells stain for vimentin and CD56, show little or no GFAP and
    no or focal synaptophysin, and stain variably for OLIG2. Strong staining
    of the nuclei for BCOR is found in nearly every case: 47 of 48 tumours
    with a result in the 2025 review, 42 of them diffusely. The stain is not
    specific. Nuclei also stain in brain tumours with a BCOR fusion and in
    most pineoblastomas, and in one small series only one of four
    BCOR-positive high-grade tumours had the duplication. A positive stain is
    therefore a reason to test for the duplication and not a diagnosis.
  diagnosis_term:
    preferred_term: BCOR immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:

genetic:
- name: BCOR
  association: Somatic internal tandem duplication in exon 15
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: BCOR
    term:
      id: hgnc:20893
      label: BCOR
  notes: >-
    The duplication is the defining lesion and, in six of the ten tumours of
    the largest series, the only pathogenic change found. The other four
    carried further changes, among them homozygous deletion of CDKN2A and
    CDKN2B, changes of TERT, and mutations of TP53, BCORL1, EP300, SMARCA2 and
    STAG2. Most tumours have a balanced copy-number profile. Six duplications
    of 89 to 114 base pairs have been described, and in one study every
    duplication lay within 16 codons of the stop codon. No gene-disease
    validity assertion is recorded, because the change is somatic.
  evidence:
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA and RNA sequencing revealed in-frame internal tandem duplications of the BCL6 corepressor (BCOR) in 10/10 (100 %) samples"
    explanation: >-
      The 2016 study: the duplication in all ten tumours sequenced.
  - reference: PMID:31104347
    reference_title: "High-grade neuroepithelial tumor with BCOR exon 15 internal tandem duplication-a comprehensive clinical, radiographic, pathologic, and genomic analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "While BCOR exon 15 internal tandem duplication was the solitary pathogenic alteration identified in six cases, four cases contained additional alterations including CDKN2A/B homozygous deletion, TERT amplification or promoter hotspot mutation, and damaging mutations in TP53, BCORL1, EP300, SMARCA2 and STAG2."
    explanation: >-
      Ten tumours: the duplication alone in six, and further alterations in
      four.
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most tumors from the CNS HGNET-BCOR entity displayed balanced copy-number profiles."
    explanation: >-
      Most tumours had balanced copy-number profiles.
  - reference: PMID:33718245
    reference_title: "Specific and Sensitive Diagnosis of BCOR-ITD in Various Cancers by Digital PCR."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Six different BCOR-ITD in the 3'-part of the coding sequence of exon 15 have been reported ranging from 89 to 114 bp in length."
    explanation: >-
      The introduction of a 2021 methods paper: six different duplications of
      89 to 114 base pairs.

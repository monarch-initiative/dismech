    diagnosis was 3.2 years and the mean 4.7 years, with a range from birth to
    22 years, and the ratio of boys to girls was 1.13 to 1. Most patients are
    younger than five, but teenagers and young adults have been reported. No
    environmental or hereditary risk factor is known.

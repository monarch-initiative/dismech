      explanation: >-
        Binding studies: the duplication would disrupt the assembly of PRC1.1.
- name: Disrupted PRC1.1 Assembly
  description: >-
    BCOR is part of PRC1.1, a variant of polycomb repressive complex 1, and
    the complex is built through the binding of the PUFD domain of BCOR to
    PCGF1. The duplications of the kidney and brain tumours fall in the two
    ends of that domain, which form the binding surface. In binding
    experiments, a BCOR PUFD with a duplication failed to assemble with PCGF1,
    and the authors conclude that losing the ability to build PRC1.1 is the
    event that drives the tumours. Whether the complex is lost or altered in
    the tumour cells themselves has not been shown.
  biological_scale: MOLECULAR

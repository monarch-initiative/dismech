    snippet: "The pathognomonic diagnostic feature is a heterozygous ITD within exon 15 of the BCOR gene. DNA-based detection is generally sufficient to identify BCOR ITDs."
    explanation: >-
      A 2025 review: a heterozygous duplication within exon 15 is the defining
      feature.

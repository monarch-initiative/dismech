- name: Derepression of Polycomb Target Genes
  description: >-
    In human neural stem cells, BCOR with the duplication released genes that
    polycomb complexes keep silent, compared with normal BCOR. The duplication
    gave the human cells no growth advantage, and long-term cultures could not
    be established. In mouse neural stem cells it increased growth, invasion
    and migration, which normal BCOR did not.

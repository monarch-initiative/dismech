- name: Neuroepithelial Tumour Growth
  description: >-
    The tumour is a solid, compact, sharply bounded mass of uniform oval to
    spindle cells with fine chromatin and a rich branching network of
    capillaries. The cells form pseudorosettes around vessels, like those of
    ependymoma, and there is palisading necrosis, but the vessels do not
    proliferate as they do in glioblastoma. The tumour is large when it is
    found: reported diameters run from 3.8 to 10.2 cm.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: tumour cell proliferation

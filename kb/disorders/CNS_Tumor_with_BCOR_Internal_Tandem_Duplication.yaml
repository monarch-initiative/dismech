pathophysiology:
- name: BCOR Internal Tandem Duplication
  description: >-
    A short stretch of the last exon of BCOR is duplicated in tandem and in
    frame, on one allele. The duplication adds 9 to 42 amino acids, most often
    20 to 30, near the end of the BCOR protein. It was found in all ten
    tumours of the defining class that were sequenced in 2016, and it is the
    same duplication as in clear cell sarcoma of kidney. It is a somatic
    change. The tumours express BCOR at high levels, which is why a mechanism
    other than simple loss of BCOR has been proposed. The cell in which the
    duplication arises is not settled: one study argues from gene expression
    for a primitive neuro-glial progenitor, and another from stem cell markers
    for a neuroepithelial stem cell. The cell type bound here is the first of
    these and is an inference.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC

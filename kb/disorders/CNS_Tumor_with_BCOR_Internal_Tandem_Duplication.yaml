- name: Embryonal Tumor with Multilayered Rosettes
  description: >-
    Another embryonal tumour of young children with small cells and structures
    around vessels.
  distinguishing_features:
  - The well-defined zone without nuclei around the vessels, characteristic of the rosette tumour, is usually absent in the BCOR tumour
  disease_term:

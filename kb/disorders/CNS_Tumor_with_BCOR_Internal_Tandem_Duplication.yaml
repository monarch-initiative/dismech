    Removal of the tumour is the first step. Because the tumour is sharply
    bounded, complete removal is often possible: all ten children of the
    largest series had a gross total resection. A review of 24 cases calls it
    necessary for a better outcome. Resection alone does not hold the tumour:
    the one child of that series who had no further treatment had a recurrence
    after four months.

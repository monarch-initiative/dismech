    Does the duplication abolish a function of BCOR, or change it?
  attaches_to:
  - pathophysiology#Disrupted PRC1.1 Assembly
  - pathophysiology#Derepression of Polycomb Target Genes
  rationale: >-
    Two observations pull in different directions. The tumours express the
    altered BCOR at high levels, unlike the tumours in which BCOR is deleted
    or truncated, and the paper that defined the entity read this as a sign of
    a different mechanism. Yet a BCOR fragment with the duplication cannot
    bind PCGF1, which would amount to a loss of PRC1.1. In neural stem cells
    the duplication releases polycomb targets and, in mouse cells only, speeds
    growth. No study has examined the complex in tumour cells, so it is not
    known whether the tumour lacks PRC1.1, has an altered one, or uses the
    abundant altered protein in another way.
  evidence:
  - reference: PMID:26919435
    reference_title: "New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "High expression of altered BCOR transcripts in CNS HGNET-BCOR tumors suggests a different mechanism from BCOR loss-of-function mutations reported in other malignancies, such as medulloblastoma"
    explanation: >-
      The 2016 reading: high expression suggests a mechanism different from
      loss of function.
  - reference: PMID:33920124
    reference_title: "BCOR Internal Tandem Duplication Expression in Neural Stem Cells Promotes Growth, Invasion, and Expression of PRC2 Targets."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to deletion or truncating mutations seen in other tumors, BCOR expression is upregulated in CNS-BCOR ITD, and a distinct oncogenic mechanism has been suggested."
    explanation: >-
      The opening of a 2021 study: BCOR is upregulated in the tumour, in
      contrast to the deletions and truncations of other tumours.
  - reference: PMID:32628469
    reference_title: "Structure and Role of BCOR PUFD in Noncanonical PRC1 Assembly and Disease."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "Binding studies with the BCOR ITD indicate the ITD would disrupt PRC1.1 assembly, suggesting loss of the ability to assemble PRC1.1 is a critical molecular event driving tumorigenesis."
    explanation: >-

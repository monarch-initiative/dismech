    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to CNS tumors with BCOR ITD, embryonal tumor with multilayered rosettes (ETMR) predominantly affects children and demonstrates scant cytoplasm, spindle cells, and ovoid cells forming characteristic perivascular pseudorosettes."
    explanation: >-
      A 2025 review: what the two tumours share.
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL

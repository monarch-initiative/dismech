differential_diagnoses:
- name: Ependymoma
  description: >-
    The pseudorosettes around vessels make the tumour resemble an ependymoma,
    and in the posterior fossa it can be taken for a group A ependymoma. It is
    curated separately as Ependymoma.
  distinguishing_features:
  - GFAP staining of the pseudorosettes in ependymoma, where the BCOR tumour is usually GFAP-negative
  - Strong nuclear BCOR staining in the BCOR tumour
  disease_term:
    preferred_term: ependymoma
    term:
      id: MONDO:0016698
      label: ependymoma
  evidence:
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of perivascular pseudorosettes necessitates careful differentiation from ependymoma. GFAP positivity within pseudorosettes is characteristic of ependymoma, whereas BCOR ITD tumors frequently demonstrate GFAP negativity."
    explanation: >-
      A 2025 review: the pseudorosettes call for distinction from ependymoma,
      and GFAP in them favours ependymoma.
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of H3K27me3 expression in posterior fossa tumors can mimic posterior fossa group A ependymoma, making BCOR immunostaining crucial for accurate classification"
    explanation: >-
      The same review: in the posterior fossa, BCOR staining is needed to
      avoid a diagnosis of group A ependymoma.
  - reference: PMID:29226988
    reference_title: "CNS high-grade neuroepithelial tumor with BCOR internal tandem duplication: a comparison with its counterparts in the kidney and soft tissue."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although these tumors had histologically similar structural patterns and characteristic monotonous nuclei with fine chromatin, CNS HGNET-BCOR exhibited glial cell morphology, ependymoma-like perivascular pseudorosettes and palisading necrosis, whereas these features were not evident in CCSK or URCS/PMMTI."
    explanation: >-
      Six tumours had ependymoma-like perivascular pseudorosettes.
- name: Glioblastoma
  description: >-
    Several tumours were first classified as glioblastoma, mostly those
    without pseudorosettes and with dense, solid growth.
  distinguishing_features:
  - No marked nuclear atypia, no microvascular proliferation and no diffuse infiltration in the BCOR tumour
  - Glial differentiation is hard to show by immunohistochemistry in the BCOR tumour, and its nuclei stain for BCOR
  disease_term:
    preferred_term: glioblastoma
    term:
      id: MONDO:0018177
      label: glioblastoma
  evidence:
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Several cases were initially misclassified as glioblastoma, particularly those lacking perivascular pseudorosettes and demonstrating highly cellular solid growth patterns"
    explanation: >-
      A 2025 review: several cases were first misclassified as glioblastoma.
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to glioblastoma, BCOR ITD tumors typically lack prominent high-grade nuclear atypia, microvascular proliferation, and diffuse infiltration."
    explanation: >-
      The same review: what the BCOR tumour lacks.
  - reference: PMID:31104347
    reference_title: "High-grade neuroepithelial tumor with BCOR exon 15 internal tandem duplication-a comprehensive clinical, radiographic, pathologic, and genomic analysis."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were histologically characterized by predominantly solid growth, glioma-like fibrillarity, perivascular pseudorosettes, and palisading necrosis, but absence of microvascular proliferation."
    explanation: >-
      Ten tumours: palisading necrosis without microvascular proliferation.
- name: Anaplastic Oligodendroglioma
  description: >-
    Some tumours were first diagnosed as anaplastic oligodendroglioma, because
    of their uniform round nuclei with clear halos and their network of fine
    vessels.
  distinguishing_features:
  - Nuclear BCOR staining, with a panel of H3K27M, H3K27me3, GFAP, OLIG2 and S100, separates the two
  disease_term:
    preferred_term: anaplastic oligodendroglioma
    term:
      id: MONDO:0016696
      label: anaplastic oligodendroglioma
  evidence:
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."

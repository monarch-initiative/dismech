    reference_title: "HGNET-BCOR Tumors of the Cerebellum: Clinicopathologic and Molecular Characterization of 3 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologic features included proliferation of uniform spindle to ovoid cells with fine chromatin associated with a rich arborizing capillary network."
    explanation: >-
      Three cerebellar tumours: uniform spindle to ovoid cells with fine
      chromatin and a rich arborizing capillary network.
  - reference: PMID:31104347
    reference_title: "High-grade neuroepithelial tumor with BCOR exon 15 internal tandem duplication-a comprehensive clinical, radiographic, pathologic, and genomic analysis."

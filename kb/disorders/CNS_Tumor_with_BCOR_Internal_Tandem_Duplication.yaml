    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse nuclear positivity was observed in 42 cases (87.5%), and when including five additional cases with focal or weak-to-moderate staining, the overall positivity rate reaches 97.9%."
    explanation: >-
      A 2025 review: diffuse nuclear BCOR staining in 42 of 48 tumours, and
      any staining in 97.9 per cent.

- discussion_id: cns_bcor_treatment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the best treatment after resection, and when should radiotherapy
    be given?
  attaches_to:
  - treatments#Radiotherapy
  - treatments#Multi-Agent Chemotherapy
  rationale: >-
    Reported children have been treated on protocols written for other
    tumours, and no two series used the same one. The one comparison
    available, in eight children, suggests that chemotherapy alone fails and
    that radiotherapy should not be delayed, but the group was defined by
    methylation class and included tumours with a fusion. With 69 cases
    reported in all, the evidence is likely to keep coming from small series.
  evidence:
  - reference: PMID:40916880
    reference_title: "Central nervous system tumors with BCOR internal tandem duplications: a systematic review of clinical, radiological, and pathological features in 69 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to a limited number of reported cases, standardized treatment protocols and definitive prognostic factors remain poorly established."
    explanation: >-
      A 2025 review: standard treatment protocols and prognostic factors are
      not established.
  - reference: PMID:37314948
    reference_title: "Central Nervous System Tumor With BCL6 Corepressor Internal Tandem Duplication: Treatment Course of a Long-term Survivor."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no standard practice regarding the management of this tumor."
    explanation: >-
      A 2023 case report: there is no standard practice.
  - reference: PMID:35982322
    reference_title: "Molecular classification and outcome of children with rare CNS embryonal tumors: results from St. Jude Children's Research Hospital including the multi-center SJYC07 and SJMB03 clinical trials."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given this, we currently recommend treating HGNET-BCOR with RT sooner rather than later after a maximal safe surgical resection and avoid delaying radiation with chemotherapy."
    explanation: >-
      The one recommendation on timing, from eight children.
  - reference: PMID:35982322
    reference_title: "Molecular classification and outcome of children with rare CNS embryonal tumors: results from St. Jude Children's Research Hospital including the multi-center SJYC07 and SJMB03 clinical trials."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA-seq was performed in 6 (75%) samples: the typical BCOR-ITD was observed in 3 samples, KDM2B-NUTM1 fusion with upregulation of BCOR expression was observed in one, and BCOR-EP300 and BCOR-L3MBTL2 transcripts were concomitantly present in the other two"
    explanation: >-

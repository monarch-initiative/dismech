discussions:
- discussion_id: cns_bcor_cell_of_origin
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which cell does the tumour start in, and is it an embryonal tumour or a
    mesenchymal one?
  attaches_to:
  - pathophysiology#BCOR Internal Tandem Duplication
  rationale: >-
    The classification places the tumour among the embryonal tumours, but the
    question was open from the first reports, because the same duplication
    defines sarcomas of the kidney and of soft tissue. One study argues from
    gene expression that the brain tumour comes from a primitive neuro-glial
    progenitor and the sarcomas from mesenchymal progenitors. Another, from
    the stem cell markers of four tumours, proposes a neuroepithelial stem
    cell and doubts that the tumour is truly embryonal. Both arguments are
    indirect, and no experiment has produced the tumour from a defined cell.
    The cell type bound on the first mechanism node follows the first study
    and should be read as provisional.
  evidence:
  - reference: PMID:28704208
    reference_title: "HGNET-BCOR Tumors of the Cerebellum: Clinicopathologic and Molecular Characterization of 3 Cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether CNS HGNET-BCOR should be classified among the category of \"embryonal tumors\" or within the category of \"mesenchymal, nonmeningothelial tumors\" remains to be clarified."
    explanation: >-
      A 2017 report: whether the tumour belongs with the embryonal or the
      mesenchymal tumours remains to be clarified.
  - reference: PMID:34921008
    reference_title: "A Summary of the Inaugural WHO Classification of Pediatric Tumors: Transitioning from the Optical into the Molecular Era."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "molecularly defined CNS neuroblastoma, FOXR2-activated, and CNS tumor with BCOR internal tandem duplication were newly introduced"
    explanation: >-
      The classification introduced it among the other embryonal tumours.
  - reference: PMID:35174661
    reference_title: "Intra- and extra-cranial BCOR-ITD tumours are separate entities within the BCOR-rearranged family."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, these indirect arguments suggest that CNS BCOR‐ITD and BCOR‐ITD sarcomas differ in their cell of origin, with CNS BCOR‐ITD being derived from a primitive neuro‐glial progenitor cell, while BCOR‐ITD sarcomas derive as expected from mesenchymal progenitors."
    explanation: >-
      The argument for a primitive neuro-glial progenitor, which its authors
      call indirect.
  - reference: PMID:38797130
    reference_title: "Clinical, pathological, and molecular features of central nervous system tumors with BCOR internal tandem duplication."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical staining showed diffuse tumor cell expression of BCOR, CD56, CD99, vimentin, and the stem cell markers PAX6, SOX2, CD133 and Nestin, alongside focal positivity for Olig-2, S100, SOX10, Syn and NeuN."
    explanation: >-
      Four tumours expressed the stem cell markers PAX6, SOX2, CD133 and
      nestin.
  - reference: PMID:38797130
    reference_title: "Clinical, pathological, and molecular features of central nervous system tumors with BCOR internal tandem duplication."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their expression of stem cell markers raises the possibility of an origin from neuroepithelial stem cells rather than representing true embryonal neoplasms."
    explanation: >-
      The authors' proposal of an origin from neuroepithelial stem cells.

review_notes: >-
  Identity was checked before curating, against the WP-007 seed row (3.2.01.01,
  GK, OMIM:307030, ORPHA:408). MONDO:0018459 carries the ORPHA:408 equivalence
  and is the exact concept for the isolated form; OMIM:307030 sits on the parent
  MONDO:0010613, which also subsumes the contiguous-gene presentations, so the
  parent is recorded as a broadMatch rather than used as the anchor. GK was
  confirmed as hgnc:4289 at Xp21.2. Complex GKD is curated as a differential
  diagnosis, not a subtype, because its causal lesion is a multigene deletion
  rather than a GK defect.
  Two deliberate omissions. Hypertriglyceridemia (HP:0002155) is NOT curated as
  a phenotype even though every clinical report mentions it, because in this
  disorder it is a property of the assay rather than of the patient: NMR
  measurement in the same individuals is normal and total cholesterol is lower
  than in relatives. It is instead recorded as a biochemical marker whose notes
  say it is spurious, and the artefact and its iatrogenic consequence are
  modelled as explicit pathograph nodes. Second, no frequency band is asserted
  for any phenotype except the obligate hyperglycerolaemia, because the
  published series are small and largely ascertained through lipid clinics,
  which biases the symptomatic fraction downwards; the sources support the
  associations but not the bands.
  Module conformance is claimed on three nodes of
  metabolic_intoxication_decompensation and deliberately withheld from the
  encephalopathy node, whose mechanism in that module is ammonia-driven
  astrocytic injury that this disorder does not have. The amplifier conformance
  is qualified in the node description: only the energy-deficit arm applies, as
  glycerol has not been shown to be toxic and long-term vascular follow-up of
  hyperglycerolaemic patients was negative.

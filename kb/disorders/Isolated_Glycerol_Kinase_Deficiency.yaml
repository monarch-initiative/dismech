      Its screening should be considered only in patients with persistent
      hypertriglyceridemia unresponsive to treatment.
    explanation: Defines the clinical trigger for testing rather than leaving the indication open.
- name: Orthogonal (NMR) lipid measurement
  description: >-
    Re-measuring the lipid profile by a method that does not use glycerol as a

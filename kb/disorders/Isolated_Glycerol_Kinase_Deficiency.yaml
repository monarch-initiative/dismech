      explanation: States the analytical mechanism of the artefact explicitly.
- name: Fasting and Catabolic-Stress Intolerance
  description: >-
    A compensated state is converted into a crisis by anything that raises the
    demand for endogenous glucose: intercurrent infection, prolonged fasting,
    vomiting, or strenuous exercise. This node conforms to the module's
    amplifier step by way of its energy-deficit arm only. The toxic-metabolite
    half of that module node is deliberately NOT asserted here: the metabolite
    that accumulates in this disease is glycerol, and no toxicity of glycerol
    has been demonstrated — long-term vascular follow-up of hyperglycerolaemic
    patients was negative, and adults with lifelong hyperglycerolaemia are
    asymptomatic.
  role: amplifier
  biological_scale: ORGANISM

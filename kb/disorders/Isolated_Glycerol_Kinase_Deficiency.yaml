    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Once endogenous glucose production cannot keep pace, blood glucose falls
      and ketogenesis is driven hard, producing the ketoacidotic biochemical
      picture.
    evidence:
    - reference: PMID:9719371
      reference_title: Clinical heterogeneity and novel mutations in the glycerol kinase gene in three families with isolated glycerol kinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fasting tests in two symptomatic patients of family 1 showed

biochemical:
- name: Plasma glycerol
  presence: Increased
  notes: >-
    The diagnostic analyte. In one dyslipidaemia referral centre, systematic
    glycerol measurement in hypertriglyceridaemic sera identified 13
    hyperglycerolaemic patients out of 314,268 lipid profiles screened.
  readouts:
  - target: Hyperglycerolaemia and Glyceroluria
    relationship: READOUT_OF
    interpretation: >-
      A raised plasma glycerol is the direct measurement of the accumulation
      node and is what distinguishes this disorder from true
      hypertriglyceridaemia.
  evidence:
  - reference: PMID:41047305
    reference_title: Cardiometabolic risk in pseudohypertriglyceridemia resulting from hyperglycerolemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over 314,268 lipid profiles, 11.8% had hypertriglyceridemia, of whom 13
      patients had biological hyperglycerolemia.
    explanation: Quantifies detection of raised plasma glycerol in a large real-world lipid-clinic denominator.
- name: Urinary glycerol
  presence: Increased
  notes: >-
    Glyceroluria is a practical confirmatory test and, together with the absence
    of serum lipaemia, is described as a key diagnostic clue.
  readouts:
  - target: Hyperglycerolaemia and Glyceroluria
    relationship: READOUT_OF
    interpretation: Urinary spillover of unphosphorylated glycerol measures the same accumulation node non-invasively.
  evidence:
  - reference: PMID:40741920
    reference_title: "Pseudohypertriglyceridemia as a clue: clinical and genetic spectrum of glycerol kinase deficiency in three pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary glycerol analysis and the absence of serum lipemia are key
      diagnostic clues.
    explanation: Establishes urinary glycerol as the confirmatory biochemical marker.
- name: Serum triglyceride measured by lipase-based enzymatic assay
  presence: Increased
  notes: >-
    Spuriously raised. This marker is recorded because it is what brings
    patients to attention, not because triglyceride is genuinely elevated —
    orthogonal NMR measurement in the same individuals is normal.
  readouts:
  - target: Pseudohypertriglyceridaemia on Lipase-Based Triglyceride Assay
    relationship: READOUT_OF
    interpretation: >-
      The elevation is method-dependent; a normal NMR triglyceride in the same
      sample identifies the result as an artefact rather than a lipid
      abnormality.
  evidence:
  - reference: PMID:39512433
    reference_title: In vivo glycerol metabolism in patients with glycerol kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to NMR, lipase-based assays overreported triglycerides
    explanation: Establishes the direction of the assay-dependent discrepancy.
- name: Serum total cholesterol
  presence: Decreased
  notes: >-
    Affected men had lower total cholesterol than their unaffected relatives —
    the opposite direction to the lipid disorder they are mistaken for.
  evidence:
  - reference: PMID:39512433
    reference_title: In vivo glycerol metabolism in patients with glycerol kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      men with GKD (n = 5) had significantly lower total cholesterol levels
    explanation: Within-family comparison showing the lipid profile is not that of hypertriglyceridaemia.
- name: Fibroblast glycerol kinase activity
  presence: Decreased
  readouts:
  - target: Glycerol Kinase Loss of Function
    relationship: READOUT_OF
    interpretation: Enzymatic confirmation of the trigger lesion in patient-derived cells.
  evidence:
  - reference: PMID:15303806
    reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The activity of glycerol kinase (GK) in fibroblasts was <10% of reference.
    explanation: Direct enzymatic confirmation of the deficiency in patient cells.
genetic:
- name: Hemizygous GK loss-of-function variants
  gene_term:
    preferred_term: GK
    term:
      id: hgnc:4289

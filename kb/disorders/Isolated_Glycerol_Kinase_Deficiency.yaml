prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The true population prevalence is unknown and is generally regarded as
    underestimated, because the disorder is usually silent in adults and is
    found only when someone thinks to measure glycerol. A 2020 systematic review
    of the isolated form assembled 39 previously published subjects from 15
    articles. Population denominators are not directly comparable to these
    literature counts, so no numeric rate is asserted.
  evidence:
  - reference: PMID:41047305
    reference_title: Cardiometabolic risk in pseudohypertriglyceridemia resulting from hyperglycerolemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperglycerolemia is a rare X-linked inborn error of metabolism whose
      prevalence is currently unknown.
    explanation: Directly supports classifying occurrence qualitatively rather than asserting a rate.
  - reference: PMID:33212314
    reference_title: "Glycerol kinase deficiency in adults: Description of 4 novel cases, systematic review and development of a clinical diagnostic score."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The systematic review retrieved a total of 15 articles involving 39
      subjects with GKD.
    explanation: Gives the literature-case scale that underlies the ULTRA_RARE band.
diagnosis:
- name: Measurement of plasma and urinary glycerol
  description: >-
    Direct measurement of glycerol resolves the question that the lipid panel
    cannot. It is indicated specifically in persistent hypertriglyceridaemia
    that does not respond to treatment, particularly when the serum is not
    lipaemic.
  diagnosis_term:

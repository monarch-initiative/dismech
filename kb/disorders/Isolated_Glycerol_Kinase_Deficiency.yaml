  downstream:
  - target: Loss of Glycerol Entry into Gluconeogenesis and Glycerolipid Synthesis
    causal_link_type: DIRECT
    description: >-
      Phosphorylation of glycerol to glycerol-3-phosphate is the committed entry
      step; without it circulating glycerol cannot be routed into either
      pathway.
    evidence:
    - reference: PMID:39512433
      reference_title: In vivo glycerol metabolism in patients with glycerol kinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Men with GKD could not convert glycerol into glucose or triglycerides,
        which was preserved in the heterozygote carrier.
      explanation: >-
        Isotope-tracer infusion in affected men demonstrates the blocked entry
        into both gluconeogenesis and triglyceride synthesis in vivo, with the
        carrier as an internal control.
  - target: Hyperglycerolaemia and Glyceroluria
    causal_link_type: DIRECT
    description: >-
      Unphosphorylated glycerol accumulates in plasma and is excreted in urine.
    evidence:
    - reference: PMID:9719371
      reference_title: Clinical heterogeneity and novel mutations in the glycerol kinase gene in three families with isolated glycerol kinase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All patients had hyperglycerolaemia and glyceroluria.
      explanation: Establishes the obligate biochemical consequence in every affected individual studied.
- name: Loss of Glycerol Entry into Gluconeogenesis and Glycerolipid Synthesis
  description: >-
    Glycerol-3-phosphate is the shared branch point at which glycerol either
    feeds the gluconeogenic and glycolytic pools or is acylated into
    triglycerides and phospholipids. Blocking its formation removes glycerol
    from both destinations at once. In vivo tracer studies show that affected
    men convert glycerol into neither glucose nor triglyceride, while a
    residual, order-of-magnitude-reduced conversion to lactate persists and has
    been attributed to homologous kinases encoded by other genes.
  role: amplifier
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: Hepatocyte
    term:

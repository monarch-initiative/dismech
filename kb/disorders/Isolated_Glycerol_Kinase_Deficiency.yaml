name: Isolated Glycerol Kinase Deficiency
category: Mendelian
creation_date: "2026-08-19T12:00:00Z"
synonyms:
- Isolated GKD
- Hyperglycerolemia
- Nonsyndromic glycerol kinase deficiency
- GK-related glycerol kinase deficiency
- Isolated inborn glycerol kinase deficiency
description: >-
  Isolated glycerol kinase deficiency is an X-linked recessive inborn error of
  glycerol metabolism caused by hemizygous loss-of-function variants in GK
  (Xp21.2). Glycerol kinase phosphorylates glycerol to glycerol-3-phosphate, the
  committed step through which circulating glycerol enters gluconeogenesis and
  glycerolipid synthesis; when the enzyme is absent, glycerol accumulates in
  plasma and urine and is no longer available as a fuel or a lipid backbone.
  The disorder has two faces that are easy to mistake for two different
  diseases. In infancy and childhood, when glycerol is a proportionally more
  important gluconeogenic substrate, fasting or an intercurrent catabolic stress
  can precipitate a Reye-like crisis of vomiting, hyperketotic hypoglycaemia,
  acidosis and impaired consciousness. In adults the same genotype is typically
  asymptomatic and is discovered only because the hyperglycerolaemia defeats the
  routine lipid panel: lipase-based triglyceride assays quantify glycerol as a
  proxy for triglyceride, so affected men are reported as having severe
  hypertriglyceridaemia that no lipid-lowering drug will correct. This
  pseudohypertriglyceridaemia is an analytical artefact, not lipid disease —
  NMR-based measurement shows normal triglycerides, total cholesterol is if
  anything lower than in relatives, and a long-followed cohort developed no
  premature atherosclerotic cardiovascular disease. Recognising the artefact is
  therefore itself a therapeutic act, because the main iatrogenic harm in the
  adult form is years of ineffective hypolipidaemic treatment. This entry covers
  the isolated form only; complex glycerol kinase deficiency, in which the GK
  locus is lost as part of an Xp21 contiguous-gene deletion together with NR0B1
  (adrenal hypoplasia congenita) and/or DMD, is a mechanistically distinct
  entity and is curated here as a differential diagnosis.

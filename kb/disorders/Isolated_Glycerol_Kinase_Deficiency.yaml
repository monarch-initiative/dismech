    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Men with GKD could not convert glycerol into glucose or triglycerides,
      which was preserved in the heterozygote carrier.
    explanation: Direct in vivo demonstration that both downstream routes are lost.
  - reference: PMID:39512433
    reference_title: In vivo glycerol metabolism in patients with glycerol kinase deficiency.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycolytic metabolism of glycerol to lactate persisted in GKD, but it was
      reduced by a magnitude and, possibly, due to homologous glycerol kinases
      encoded by other genes.
    explanation: >-
      Retained deliberately as a limit on the node: the block is not absolute
      for every downstream route, and the residual route is attributed to
      paralogous enzymes rather than to residual GK.
  downstream:
  - target: Fasting and Catabolic-Stress Intolerance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of one gluconeogenic substrate is silent while glucose supply is
      adequate; it becomes limiting when fasting, exercise or intercurrent
      illness raises the demand for endogenous glucose production.
    evidence:
    - reference: PMID:15303806
      reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tests performed in childhood documented pronounced sensitivity to
        fasting and physical exercise, whereas such tests at 23 and 31 y of age
        were essentially normal but with pronounced ketonaemia.
      explanation: Formal fasting and exercise provocation ties the metabolic block to demand-dependent intolerance.
- name: Hyperglycerolaemia and Glyceroluria
  description: >-
    Glycerol that cannot be phosphorylated accumulates in the circulation and
    spills into the urine. This is the obligate, lifelong biochemical signature
    of the disorder and is present equally in symptomatic children and
    asymptomatic adults; it is not itself known to be injurious, and its
    clinical importance in the adult form is entirely as a measurement
    interferent.
  role: effector
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  biological_processes:

      id: MONDO:0017295
      label: glycerol kinase deficiency, juvenile form
  description: >-
    The symptomatic childhood presentation: episodic, catabolic-stress-triggered
    crises of vomiting with ketoacidosis, a tendency to hypoglycaemia, and
    disturbed consciousness, on a background of constant hyperglycerolaemia and
    glyceroluria. Crises typically remit after puberty.
  evidence:
  - reference: PMID:9719371
    reference_title: Clinical heterogeneity and novel mutations in the glycerol kinase gene in three families with isolated glycerol kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients had gastrointestinal symptoms with ketoacidosis or
      hypoglycaemia or both.
    explanation: Documents the symptomatic childhood crisis phenotype in molecularly confirmed isolated GKD.
- name: Adult GKD
  display_name: Adult glycerol kinase deficiency
  subtype_term:
    preferred_term: glycerol kinase deficiency, adult form
    term:
      id: MONDO:0017296
      label: glycerol kinase deficiency, adult form
  description: >-
    A clinically silent form recognised incidentally, essentially always through
    a persistently and inexplicably raised triglyceride result that does not
    respond to lipid-lowering therapy and is not accompanied by lipaemic serum.
  evidence:
  - reference: PMID:11032329
    reference_title: "Isolated and contiguous glycerol kinase gene disorders: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical and biochemical phenotype of isolated GKD may vary from a
      life-threatening childhood metabolic crisis to asymptomatic adult
      'pseudohypertriglyceridaemia', resulting from hyperglycerolaemia.
    explanation: Establishes the asymptomatic adult form defined by pseudohypertriglyceridaemia.
mechanistic_hypotheses:
- hypothesis_group_id: age_dependent_gluconeogenic_substrate_model
  hypothesis_label: Age-dependent glycerol-as-gluconeogenic-substrate model
  status: CANONICAL
  description: >-
    Symptoms track how much the individual depends on glycerol as a
    gluconeogenic substrate rather than how much residual enzyme activity is
    present. Young children, whose fasting glucose production draws
    proportionally more on glycerol, decompensate under catabolic stress; the
    same individuals become tolerant after puberty despite an unchanged
    genotype and unchanged hyperglycerolaemia. This model accounts for the
    otherwise puzzling observation that genotype does not predict phenotype.
  evidence:
  - reference: PMID:15303806
    reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The greater importance of glycerol as a gluconeogenetic substrate in
      children than in adults may explain the episodes in young patients with
      GKD, often elicited by catabolic stress.
    explanation: States the age-dependent substrate-dependence model directly, from 20-year follow-up of two affected boys.
  - reference: PMID:15303806
    reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After puberty, the boys had no hypoglycaemic symptoms and now report no
      problems with their condition; thus, their phenotype has changed over
      time.
    explanation: Provides the within-individual, genotype-invariant change in phenotype the model predicts.
  - reference: PMID:11032329
    reference_title: "Isolated and contiguous glycerol kinase gene disorders: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical variability in isolated GKD cannot be explained by
      biochemical or by molecular heterogeneity.
    explanation: >-
      Excludes residual-activity and allele identity as the explanation for
      variable severity, which is what motivates a host-context model.
pathophysiology:
- name: Glycerol Kinase Loss of Function
  description: >-
    Hemizygous loss-of-function variants in GK (Xp21.2) — nonsense, frameshift,
    splice-site, missense and partial gene deletions — abolish or severely
    reduce glycerol kinase activity, which is measurable at under 10% of
    reference in patient fibroblasts. Because the gene is X-linked, essentially
    all clinically ascertained patients are hemizygous males and mothers are
    unaffected heterozygotes. No genotype-phenotype correlation has been
    established, so this node is modelled as a single functional lesion rather
    than an allele-graded one.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"

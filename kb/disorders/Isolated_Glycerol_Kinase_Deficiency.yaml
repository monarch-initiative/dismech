- name: Pseudohypertriglyceridaemia on Lipase-Based Triglyceride Assay
  description: >-
    An analytical artefact, not a lipid disorder. Enzymatic triglyceride assays
    liberate glycerol with a lipase and measure it as a proxy for triglyceride;
    in hyperglycerolaemia the pre-existing endogenous glycerol is counted as
    though it were triglyceride-derived. Orthogonal NMR measurement in the same
    patients returns normal triglycerides and, in the same comparison, shows
    that lipase-based assays simultaneously under-report LDL cholesterol. The
    serum is characteristically not lipaemic, which is the bedside clue that the
    number is wrong.
  role: consequence
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:39512433
    reference_title: In vivo glycerol metabolism in patients with glycerol kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to NMR, lipase-based assays overreported triglycerides
    explanation: Establishes the direction of the assay-dependent discrepancy against an orthogonal method.
  - reference: PMID:40741920
    reference_title: "Pseudohypertriglyceridemia as a clue: clinical and genetic spectrum of glycerol kinase deficiency in three pediatric cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all cases, elevated triglyceride levels were unresponsive to therapy,
      and serum samples lacked lipemic appearance.
    explanation: Supports both discriminating features — therapy-resistance and non-lipaemic serum.
  downstream:
  - target: Misdiagnosis as Primary Hypertriglyceridaemia and Ineffective Lipid-Lowering Treatment
    causal_link_type: DIRECT
    description: >-
      A spuriously high triglyceride result in an otherwise well adult is acted
      on as though it were dyslipidaemia.
    evidence:
    - reference: PMID:35292548
      reference_title: Pseudo-hypertriglyceridaemia in glycerol kinase deficiency misdiagnosed and treated as true hypertriglyceridaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinicians are often unaware of this laboratory condition; as a result,
        patients are subjected to aggressive hypolipidaemic drugs and lifestyle
        changes, and these measures turn ineffective to lower triglyceride
        levels.
      explanation: States the causal chain from unrecognised artefact to ineffective treatment.
- name: Misdiagnosis as Primary Hypertriglyceridaemia and Ineffective Lipid-Lowering Treatment
  description: >-
    The dominant morbidity of the adult form is iatrogenic and informational
    rather than metabolic: years of hypolipidaemic drug exposure, dietary
    restriction and cardiovascular alarm directed at a laboratory number that no
    treatment can move. One reported patient was treated for 13 years before the
    correct diagnosis was made. The counterfactual is well documented — once the
    diagnosis is made, lipid-lowering treatment is stopped without adverse
    consequence.
  role: consequence
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:35292548
    reference_title: Pseudo-hypertriglyceridaemia in glycerol kinase deficiency misdiagnosed and treated as true hypertriglyceridaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report, a case of a 50-year-old Nepalese male is presented with an
      apparent hypertriglyceridaemia refractory to various hypolipidaemic drugs
      for the last 13 years until a correct diagnosis of his condition was made.
    explanation: Documents the duration and futility of treatment directed at the artefact in an individual patient.
  - reference: PMID:33212314
    reference_title: "Glycerol kinase deficiency in adults: Description of 4 novel cases, systematic review and development of a clinical diagnostic score."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GKD cases reported a history of high TG levels resistant to lipid-lowering
      therapy.
    explanation: Generalises the therapy-resistant pattern beyond single case reports.

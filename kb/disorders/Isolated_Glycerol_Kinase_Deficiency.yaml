- name: Hyperketotic Hypoglycaemic Decompensation
  description: >-
    The acute crisis: hypoglycaemia with marked ketosis and metabolic acidosis,
    typically with vomiting. Compared with the organic acidaemias and urea-cycle
    disorders that anchor the shared decompensation module, the biochemical
    pattern here is the hypoglycaemia-and-ketoacidosis one rather than the
    hyperammonaemic one, and it is confined to childhood.

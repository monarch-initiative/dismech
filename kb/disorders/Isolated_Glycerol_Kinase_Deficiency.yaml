      label: glycerol catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:33212314
    reference_title: "Glycerol kinase deficiency in adults: Description of 4 novel cases, systematic review and development of a clinical diagnostic score."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycerol kinase deficiency (GKD) is a rare genetic disorder characterized
      by hyperglycerolemia and glyceroluria, which could be misdiagnosed as a
      moderate to severe hypertriglyceridemia (HTG).
    explanation: Establishes hyperglycerolaemia and glyceroluria as the defining biochemical state and names its diagnostic consequence.
  - reference: PMID:41047305

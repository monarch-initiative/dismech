treatments:
- name: Frequent Feeding, Glucose Access and Avoidance of Strenuous Exercise
  description: >-
    Management of the symptomatic childhood form is entirely preventive: keep
    the child out of the catabolic state that unmasks the missing gluconeogenic
    substrate. Frequent meals, ready access to glucose, and avoidance of
    strenuous sport were sufficient for a good long-term outcome in two boys
    followed for around 20 years, whose crises then ceased after puberty.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Fasting and Catabolic-Stress Intolerance
    treatment_effect: BYPASSES
    description: >-
      Supplying exogenous glucose and shortening fasting intervals removes the
      demand for glycerol-derived gluconeogenesis rather than correcting the
      enzyme defect.
    evidence:
    - reference: PMID:15303806
      reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With meals at frequent intervals, access to glucose and avoidance of
        strenuous sports, the prognosis is good for a normal adult life of a
        young child with isolated GKD and symptoms of hypoglycaemia.
      explanation: States the intervention and its outcome in the same sentence, in patients followed for two decades.
  evidence:
  - reference: PMID:15303806
    reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With meals at frequent intervals, access to glucose and avoidance of
      strenuous sports, the prognosis is good for a normal adult life of a young
      child with isolated GKD and symptoms of hypoglycaemia.
    explanation: Primary evidence for the preventive regimen and for the favourable prognosis under it.
- name: Withdrawal of Lipid-Lowering Therapy After Diagnosis
  description: >-
    In the adult form the therapeutic act is subtractive. Once the raised
    triglyceride is recognised as glycerol, hypolipidaemic drugs directed at it
    can be stopped; in a paediatric series all three patients had lipid-lowering
    treatment discontinued after diagnosis without adverse outcome, and a
    long-followed hyperglycerolaemic cohort showed no premature atherosclerotic
    cardiovascular disease attributable to the condition itself. A published
    clinical suspicion score exists specifically to spare these patients
    unwarranted treatment. Ordinary cardiovascular risk factors still require
    routine monitoring.
  treatment_term:
    preferred_term: withdrawal of unwarranted lipid-lowering pharmacotherapy
  target_mechanisms:
  - target: Misdiagnosis as Primary Hypertriglyceridaemia and Ineffective Lipid-Lowering Treatment
    treatment_effect: INHIBITS
    description: >-
      Stopping the drug removes the iatrogenic arm of the disease; nothing is
      done to the underlying enzyme defect or to the hyperglycerolaemia.
    evidence:
    - reference: PMID:40741920
      reference_title: "Pseudohypertriglyceridemia as a clue: clinical and genetic spectrum of glycerol kinase deficiency in three pediatric cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lipid-lowering treatments were discontinued following diagnosis, with no
        adverse outcomes.
      explanation: Documents the deprescribing step and its safety in molecularly confirmed patients.
  evidence:
  - reference: PMID:33212314
    reference_title: "Glycerol kinase deficiency in adults: Description of 4 novel cases, systematic review and development of a clinical diagnostic score."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proposed score would have a broad utility in clinical practice to
      avoid unwarranted lipid lowering treatment in GKD patients.
    explanation: States avoidance of unwarranted lipid-lowering treatment as the explicit clinical goal.
  - reference: PMID:41047305
    reference_title: Cardiometabolic risk in pseudohypertriglyceridemia resulting from hyperglycerolemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The confirmation of hyperglycerolemia can help the clinician reassure the
      patient concerning his CV risk, as no further assessment is required other
      than common CV risk factors monitoring, including body weight increase and
      insulin resistance that may appear over the life course.
    explanation: >-
      Supports withdrawal plus ordinary risk-factor monitoring, and bounds the
      claim: routine cardiovascular risk factors still need following.
differential_diagnoses:
- name: Complex glycerol kinase deficiency (Xp21 contiguous gene deletion syndrome)
  disease_term:
    preferred_term: chromosome Xp21 deletion syndrome
    term:
      id: MONDO:0010399
      label: chromosome Xp21 deletion syndrome
  description: >-
    A deletion at Xp21 that removes GK together with neighbouring genes —
    NR0B1 (adrenal hypoplasia congenita), DMD (Duchenne muscular dystrophy) and
    sometimes IL1RAPL1 (intellectual disability). It shares the
    hyperglycerolaemia but is a different disease: the danger comes from the
    adrenal insufficiency, not from the glycerol.
  distinguishing_features:
  - Salt-wasting adrenal crisis in infancy, usually the first and most dangerous manifestation
  - Raised creatine kinase and a Duchenne muscular dystrophy phenotype
  - Intellectual disability when the deletion extends to IL1RAPL1
  - A multigene Xp21 deletion on microarray or MLPA rather than an intragenic GK variant
  evidence:
  - reference: PMID:23739620
    reference_title: "Complex glycerol kinase deficiency - X-linked contiguous gene syndrome involving congenital adrenal hypoplasia, glycerol kinase deficiency, muscular Duchenne dystrophy and intellectual disability (IL1RAPL gene deletion)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is caused by partial deletion of Xp21, which includes the genes
      responsible for glycerol kinase deficiency, congenital adrenal hypoplasia,
      Duchenne muscular dystrophy and intellectual disability.
    explanation: Defines the contiguous-gene entity that must be separated from isolated GKD.
  - reference: PMID:23739620
    reference_title: "Complex glycerol kinase deficiency - X-linked contiguous gene syndrome involving congenital adrenal hypoplasia, glycerol kinase deficiency, muscular Duchenne dystrophy and intellectual disability (IL1RAPL gene deletion)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Usually the first and most severe are the signs of adrenal hypoplasia,
      which, if not cured, may lead to death in a short time.
    explanation: Establishes why the distinction is urgent rather than taxonomic.
- name: Primary hypertriglyceridaemia
  description: >-
    The condition patients with the adult form are almost always labelled with
    first. True hypertriglyceridaemia gives lipaemic serum, responds at least
    partly to lipid-lowering therapy, and is not accompanied by glyceroluria.
  distinguishing_features:
  - Non-lipaemic serum despite a high reported triglyceride
  - Complete resistance to hypolipidaemic drugs over years of treatment
  - Normal triglyceride when measured by NMR rather than a lipase-based assay
  - Raised plasma and urinary glycerol
  evidence:
  - reference: PMID:35292548
    reference_title: Pseudo-hypertriglyceridaemia in glycerol kinase deficiency misdiagnosed and treated as true hypertriglyceridaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High triglyceride in a serum sample with no apparent visible lipaemia is a
      confusing laboratory condition.
    explanation: Names the discriminating bedside observation that separates the two.
datasets: []
discussions:
- discussion_id: gap_gkd_gluconeogenesis_versus_ketolysis
  prompt: >-
    Are the childhood crises of isolated glycerol kinase deficiency caused by
    failure of glycerol-dependent gluconeogenesis, by a defect in ketolysis, or
    by both?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Fasting and Catabolic-Stress Intolerance
  - pathophysiology#Hyperketotic Hypoglycaemic Decompensation
  rationale: >-
    The pathograph as curated routes the crisis through loss of glycerol as a
    gluconeogenic substrate, but the primary review of the disorder explicitly
    declines to settle that attribution and raises ketolysis as an alternative
    or additional contributor. The distinction matters for management: a
    gluconeogenic-substrate deficit is fully addressed by exogenous glucose,
    whereas a ketolytic defect would predict residual vulnerability despite
    adequate glucose supply. It also bears on why adults with unchanged
    hyperglycerolaemia still show pronounced ketonaemia on fasting while no
    longer becoming hypoglycaemic.
  evidence:
  - reference: PMID:11032329
    reference_title: "Isolated and contiguous glycerol kinase gene disorders: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Isolated GKD patients showed a tendency towards hypoglycaemia with
      hyperketonaemia; whether the clinical symptoms of GKD are caused by
      dysfunction of gluconeogenesis and/or ketolysis needs to be investigated
      further.
    explanation: The review states the open question in its own words.
  - reference: PMID:15303806
    reference_title: "Glycerol kinase deficiency: follow-up during 20 years, genetics, biochemistry and prognosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tests performed in childhood documented pronounced sensitivity to fasting
      and physical exercise, whereas such tests at 23 and 31 y of age were
      essentially normal but with pronounced ketonaemia.
    explanation: >-
      Shows the dissociation the gap is about — ketonaemia persists into
      adulthood after hypoglycaemic sensitivity has resolved.
  proposed_experiments:
  - experiment_id: gkd_paired_tracer_gluconeogenesis_ketolysis
    name: Paired glycerol and ketone tracer study across the pubertal transition
    description: >-
      In hemizygous GK patients studied as children and again as adults, combine
      13C3-glycerol infusion (already validated in this disorder) with a
      13C-labelled beta-hydroxybutyrate infusion during a controlled fast.
      Measure glycerol-to-glucose conversion, whole-body glucose production, and
      ketone body oxidation rate. If gluconeogenic substrate loss alone explains
      the crises, ketone oxidation should be normal at both ages while glucose
      production falls only in childhood.
- discussion_id: interp_gkd_infantile_form_mondo_placement
  prompt: >-
    MONDO places the infantile form of glycerol kinase deficiency
    (MONDO:0017294) under the parent term rather than under isolated GKD, while
    the juvenile and adult forms sit under the isolated term. Should this entry
    carry an infantile subtype?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Hyperketotic Hypoglycaemic Decompensation
  rationale: >-
    MONDO:0017294 is a child of MONDO:0010613 (inborn glycerol kinase
    deficiency) but not of MONDO:0018459 (isolated glycerol kinase deficiency),
    and its definition explicitly folds in patients whose infantile presentation
    is due to complex GKD with adrenal hypoplasia congenita and/or Duchenne
    muscular dystrophy. Adding it as a subtype of this entry would import
    contiguous-gene disease into an entry that is scoped to the isolated form.
  resolution_note: >-
    Only the juvenile (MONDO:0017295) and adult (MONDO:0017296) forms are
    curated as subtypes. Severe infantile presentations of the isolated form are
    covered by the entry description and by the childhood crisis arm of the
    pathograph without borrowing a MONDO term whose scope is wider than this
    entry's.

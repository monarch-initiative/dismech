- name: Encephalopathic Crisis
  description: >-
    The Reye-like clinical presentation of the childhood crisis: vomiting,
    lethargy progressing to disturbed consciousness, and seizures. Seizures are
    not always tied to a documented catabolic state — one reported patient had
    recurrent convulsions as the sole acute manifestation — so the link between

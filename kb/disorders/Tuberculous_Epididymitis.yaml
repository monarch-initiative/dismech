  - reference: PMID:40355825
    reference_title: "Magnetic resonance imaging features of epididymal and/or testicular tuberculosis: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most common local symptom was a painful scrotal mass (85.7%), and

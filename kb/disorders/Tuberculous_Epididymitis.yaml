name: Tuberculous Epididymitis
creation_date: "2026-11-26T02:05:00Z"
description: >-
  Tuberculous epididymitis is tuberculosis of the epididymis, the most
  frequently involved organ of the male genital tract. Mycobacterium
  tuberculosis reaches the epididymis by bloodstream seeding from a primary
  pulmonary infection, or by retrograde canalicular spread from tuberculosis of
  the kidney, urinary tract or prostate, and a latent focus can reactivate
  years later. Caseating granulomatous inflammation begins in the tail of the
  epididymis and presents as a chronic, often painless scrotal swelling. It
  can extend into the testis and scrotal wall, forming abscesses, hydroceles
  and draining scrotal sinuses. Fibrosis and luminal obstruction of the
  epididymis and vas deferens cause obstructive azoospermia and infertility,
  which can persist after cure. Treatment is standard antituberculous
  chemotherapy, with epididymectomy or epididymo-orchiectomy for advanced or
  complicated disease or when malignancy cannot be excluded.
category: Infectious Disease
disease_term:
  preferred_term: tuberculous epididymitis
  term:
    id: MONDO:0001537
    label: tuberculous epididymitis
parents:
- Tuberculosis
- Epididymitis
- Male genital tuberculosis
synonyms:
- epididymal tuberculosis
- tuberculous epididymo-orchitis
- tuberculosis of the epididymis
notes: >-
  The clinical literature on this disease is mostly single-centre
  retrospective case series and case reports; the largest series cited here
  have 34 to 81 patients. Pathogenesis claims (route of spread, latency and
  reactivation, the start of disease in the tail of the epididymis) come from
  narrative reviews rather than from studies designed to establish them, and
  the frequencies quoted vary widely between series. Tuberculous
  epididymo-orchitis is treated here as the same disease, because the testis
  is involved only by direct extension from the epididymis. Seeded from
  `research/Tuberculous_Epididymitis-deep-research-claude_code.md` and
  PubMed searches.
review_notes: >-
  Deliberately lumped. Epididymitis caused by Mycobacterium tuberculosis and
  the much rarer epididymo-orchitis caused by Mycobacterium bovis BCG after
  intravesical BCG therapy for bladder cancer are kept in one entry. The BCG
  cases differ in how the organism arrives (iatrogenic bladder instillation
  rather than a pulmonary focus) and in the patient group, but the cited
  sources describe the same caseating granulomatous lesion, presentation and
  antituberculous treatment, and none reports BCG epididymitis as a distinct
  clinical entity with its own diagnostic or therapeutic pathway. PubMed was
  searched for tuberculous epididymitis, epididymal tuberculosis and BCG
  epididymo-orchitis titles; the BCG literature found was case reports and one
  pooled review of BCG infections, so the BCG route is recorded as an
  environmental exposure rather than as a subtype.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes pulmonary tuberculosis
    and, after bloodstream or urinary spread, genitourinary tuberculosis
    including tuberculous epididymitis.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This subclinical pulmonary infection leads to bacillemia and hematogenous
      implantation of the Tb bacilli in the kidneys, epididymis and the prostate
      amongst various other organs of the body.
    explanation: >-
      Identifies tuberculosis bacilli from a pulmonary infection as the agent
      that implants in the epididymis.
- name: Mycobacterium bovis BCG
  infectious_agent_term:
    preferred_term: Mycobacterium bovis BCG
    term:
      id: NCBITaxon:33892
      label: Mycobacterium tuberculosis variant bovis BCG
  description: >-
    The live attenuated M. bovis strain used for intravesical immunotherapy of
    bladder cancer, which rarely causes epididymo-orchitis after instillation.
  evidence:
  - reference: PMID:33796443
    reference_title: "Tuberculous epididymo-orchitis secondary to Bacillus Calmette-Guérin (BCG) in non-muscular invasive bladder cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      There are very few cases described in which Mycobacterium Bovis produces
      epididymo-orchitis by itself.
    explanation: >-
      A case report of BCG epididymo-orchitis after intravesical therapy,
      noting that M. bovis is a rare cause.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans by airborne droplet nuclei,
    establishes a primary pulmonary infection, and spreads through the
    bloodstream to the kidneys, epididymis and prostate, where foci can remain
    latent for decades before reactivating.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    The infection is acquired by inhaling airborne bacilli. The epididymis is
    then reached from the pulmonary infection through the bloodstream, or
    through the urinary and genital ducts from tuberculosis of the urinary
    tract.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aerosolized Mycobacterium tuberculosis bacilli infect and invade the
      pulmonary alveoli and cause primary pulmonary tuberculosis.
    explanation: >-
      States the airborne pulmonary entry that precedes genital involvement.
- name: Iatrogenic intravesical BCG instillation
  description: >-
    In men treated with intravesical BCG for bladder cancer, the attenuated
    M. bovis strain can reach the genital tract and cause epididymo-orchitis,
    sometimes years after instillation.
  evidence:
  - reference: PMID:25398060
    reference_title: "Bacillus Calmette-Guérin (BCG) infection following intravesical BCG administration as adjunctive therapy for bladder cancer: incidence, risk factors, and outcome in a single-institution series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The longest interval between BCG administration and occurrence of the
      complication (epididymo-orchitis) ever reported was 17 years
    explanation: >-
      A pooled review of BCG infections after intravesical therapy records
      epididymo-orchitis as a complication that can appear long after
      instillation.
prevalence:
- population: Men with genitourinary tuberculosis
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    The epididymis is reported to be involved in about half of patients with
    genitourinary tuberculosis. This is a share of genitourinary TB cases, not
    a population prevalence or incidence, so no rate is asserted. A Spanish
    hospital series found orchiepididymitis in 9.2% of men with
    genitourinary tuberculosis, which shows how much the reported share
    depends on case definition.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The epididymis are the commonest site of involvement in male genital Tb
      and is involved in 48.9% of patients with GUTB, which can be the first or
      the only presenting feature
    explanation: >-
      Reports the share of genitourinary TB patients with epididymal
      involvement.
  - reference: PMID:20350748
    reference_title: "Tuberculous orchiepididymitis during 1978-2003 period: review of 34 cases and role of 16S rRNA amplification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of the 371 male 34 (9.2%) had orchiepididymitis.
    explanation: >-
      A single-hospital series reporting a much lower share of orchiepididymitis
      among men with genitourinary tuberculosis.
environmental:
- name: Intravesical BCG immunotherapy for bladder cancer
  description: >-
    Intravesical instillation of live attenuated M. bovis BCG for superficial
    bladder cancer is a rare iatrogenic cause of granulomatous
    epididymo-orchitis.
  influences_mechanisms:
  - target: Caseating Granulomatous Epididymitis
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      BCG instilled into the bladder can produce epididymo-orchitis; the route
      by which the bacilli reach the epididymis is not established by the
      cited sources.
    evidence:
    - reference: PMID:25398060
      reference_title: "Bacillus Calmette-Guérin (BCG) infection following intravesical BCG administration as adjunctive therapy for bladder cancer: incidence, risk factors, and outcome in a single-institution series and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The longest interval between BCG administration and occurrence of the
        complication (epididymo-orchitis) ever reported was 17 years
      explanation: >-
        Records epididymo-orchitis as a complication of intravesical BCG
        administration.
  evidence:
  - reference: PMID:33796443
    reference_title: "Tuberculous epididymo-orchitis secondary to Bacillus Calmette-Guérin (BCG) in non-muscular invasive bladder cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Intravesical BCG therapy is effective in treating bladder cancer.
      Tuberculous epididymo-orchitis presents as a rare complication.
    explanation: >-
      Identifies tuberculous epididymo-orchitis as a rare complication of
      intravesical BCG therapy.
pathophysiology:
- name: Primary Pulmonary Mycobacterium tuberculosis Infection
  role: trigger
  description: >-
    Inhaled bacilli infect the alveoli and establish a primary, often
    subclinical, pulmonary infection that seeds other organs through the
    bloodstream.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tubercular involvement of the genitourinary organs is almost always
      secondary to pulmonary infection.
    explanation: >-
      Places a pulmonary infection upstream of genitourinary tuberculosis.
  downstream:
  - target: Hematogenous Seeding of the Epididymis
    causal_link_type: DIRECT
    description: >-
      Bacillemia from the pulmonary infection implants bacilli in the
      epididymis.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        This subclinical pulmonary infection leads to bacillemia and
        hematogenous implantation of the Tb bacilli in the kidneys, epididymis
        and the prostate amongst various other organs of the body.
      explanation: >-
        States that bacillemia from the pulmonary infection implants bacilli
        in the epididymis.
  - target: Urinary Tract and Prostatic Tuberculosis
    causal_link_type: DIRECT
    description: >-
      The same bacillemia seeds the kidneys and prostate, giving urinary tract
      and prostatic tuberculosis.
    evidence:
    - reference: PMID:28087922
      reference_title: "Urogenital Tuberculosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Starting with a pulmonary focus, 2 to 20% of patients develop
        urogenital tuberculosis through hematogenous spread to the kidneys,
        prostate, and epididymis
      explanation: >-
        States hematogenous spread from a pulmonary focus to the kidneys and
        prostate.
- name: Hematogenous Seeding of the Epididymis
  description: >-
    Bloodborne bacilli implant in the well-vascularised tail (globus minor) of
    the epididymis, often bilaterally, where the lesions heal over with the
    onset of immunity and enter a latent phase.
  biological_scale: TISSUE
  locations:
  - preferred_term: epididymis
    term:
      id: UBERON:0001301
      label: epididymis
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Initially, the implantation occurs in the more vascular parts such as
      cortex of the kidneys and globus minor of the epididymis, and is
      bilateral.
    explanation: >-
      Places the initial bloodborne implantation in the globus minor of the
      epididymis.
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The epididymis are more frequently involved hematogenously but
      retrograde canalicular spread from infected prostate and urinary system
      has also been described.
    explanation: >-
      Identifies bloodstream seeding as the more frequent route to the
      epididymis.
  - reference: PMID:16006701
    reference_title: "Isolated tuberculous epididymitis: a review of forty cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      Tuberculous epididymitis can be the sole presentation of genitourinary
      tuberculosis.
    explanation: >-
      In 40 men with epididymal tuberculosis and no urinary tract
      involvement, spread from infected urine is unlikely, which is
      consistent with bloodborne seeding; the paper does not test the route.
  downstream:
  - target: Reactivation of a Latent Epididymal Focus
    causal_link_type: DIRECT
    description: >-
      Healed implantation foci enter a latent phase from which they later
      reactivate.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        With the development of immunity, these lesions cicatrize in about 6
        months or so, and a latent phase then ensues.
      explanation: >-
        States that the implantation lesions heal and become latent.
- name: Reactivation of a Latent Epididymal Focus
  description: >-
    A fall in host immunity reactivates a latent epididymal focus, usually a
    single one, after a latent period that can last decades.
  biological_scale: TISSUE
  locations:
  - preferred_term: epididymis
    term:
      id: UBERON:0001301
      label: epididymis
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reactivation of the latent foci results from a decrease in the host
      immunity, usually after a long latent period of about 30 years, ranging
      from 1–46 years
    explanation: >-
      States that latent genitourinary foci reactivate when host immunity
      declines, after a long latent period.
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genital Tb can result from primary reactivation of the latent bacilli
      either in the epididymis or the prostate
    explanation: >-
      Names the epididymis as a site of reactivation of latent bacilli.
  downstream:
  - target: Caseating Granulomatous Epididymitis
    causal_link_type: DIRECT
    description: >-
      Reactivated bacilli drive active caseating granulomatous inflammation,
      starting in the tail of the epididymis.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The disease usually starts in the globus minor, which is commonest site
        for hematogenous spread as well as the first site in retrograde
        canalicular spread, and then spreads to the other parts.
      explanation: >-
        States that active disease starts in the globus minor and spreads
        through the epididymis.
- name: Urinary Tract and Prostatic Tuberculosis
  description: >-
    Tuberculosis of the kidneys, collecting system and prostate, often
    coexisting with epididymal disease, sheds bacilli into urine and the
    genital ducts.
  biological_scale: ORGANISM
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: prostate gland
    term:
      id: UBERON:0002367
      label: prostate gland
  evidence:
  - reference: PMID:20350748
    reference_title: "Tuberculous orchiepididymitis during 1978-2003 period: review of 34 cases and role of 16S rRNA amplification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Associated renal tuberculosis and active disease in extraurological
      organs presented in 64% and 19.2% of cases, respectively.
    explanation: >-
      Reports coexisting renal tuberculosis in most patients with tuberculous
      orchiepididymitis in one hospital series.
  downstream:
  - target: Retrograde Canalicular Spread to the Epididymis
    causal_link_type: DIRECT
    description: >-
      Bacilli from infected urine and prostate pass along the ejaculatory
      ducts and vas deferens to the epididymis.
    evidence:
    - reference: PMID:28087922
      reference_title: "Urogenital Tuberculosis."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        through the descending collecting system to the ureters, bladder, and
        urethra; and through the ejaculatory ducts to the genital organs.
      explanation: >-
        States spread from the urinary tract through the ejaculatory ducts to
        the genital organs.
  - target: Pyuria
    causal_link_type: DIRECT
    description: >-
      Urinary tract tuberculosis produces pyuria, which is found in a minority
      of patients with tuberculous epididymo-orchitis.
    evidence:
    - reference: PMID:31548730
      reference_title: "Urogenital tuberculosis - epidemiology, pathogenesis and clinical features."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        UG-TB can manifest with acute or chronic inflammation of the urinary or
        genital tract
      explanation: >-
        Describes urinary tract inflammation in urogenital tuberculosis;
        pyuria is its urinary sign, so the link to this phenotype is an
        inference.
  - target: Microscopic hematuria
    causal_link_type: DIRECT
    description: >-
      Urinary tract tuberculosis produces microscopic hematuria in some
      patients.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        There may be associated dysuria, hematuria or hemospermia.
      explanation: >-
        Describes hematuria accompanying prostatic tuberculosis; the link to
        microscopic hematuria in epididymal disease is an inference.
- name: Retrograde Canalicular Spread to the Epididymis
  description: >-
    Bacilli travel retrogradely from the infected prostate and urinary tract
    along the vas deferens and reach the tail of the epididymis first.
  biological_scale: TISSUE
  locations:
  - preferred_term: vas deferens
    term:
      id: UBERON:0001000
      label: vas deferens
  evidence:
  - reference: PMID:31934504
    reference_title: "Diagnosis and treatment of epididymal tuberculosis: a review of 47 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Epididymal tuberculosis lesions first appear in the tail of the
      epididymis, owing to its rich blood supply and to retrograde infection
      from the vas deferens.
    explanation: >-
      Attributes the tail-first distribution partly to retrograde infection
      from the vas deferens.
  downstream:
  - target: Caseating Granulomatous Epididymitis
    causal_link_type: DIRECT
    description: >-
      Bacilli arriving by the canalicular route establish granulomatous
      epididymitis in the globus minor.
    evidence:
    - reference: PMID:28540230

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The histopathological examination revealed chronic granulomatous
      inflammation with caseous necrosis in the epididymis tissue.
    explanation: >-
      Reports caseating granulomatous inflammation of the epididymis.
- name: Obstructive azoospermia
  phenotype_term:

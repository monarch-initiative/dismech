  evidence:
  - reference: PMID:31934504
    reference_title: "Diagnosis and treatment of epididymal tuberculosis: a review of 47 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The main symptoms were painless swelling of the scrotum in 21 cases
      (44.7%) and scrotal drop pain in 21 cases (44.7%).
    explanation: >-
      Reports scrotal pain in about half of 47 patients, the other half having
      painless swelling.
- name: Orchitis
  description: >-

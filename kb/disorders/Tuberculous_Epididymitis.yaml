    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 6 patients with tuberculous epididymitis the testes were also
      involved (epididymo-orchitis).
    explanation: >-
      Reports testicular involvement in 6 of 10 sonographically studied
      patients.
- name: Abscess
  description: >-
    Cold abscess of the epididymis or scrotum, a late complication.
  phenotype_term:
    preferred_term: epididymal or scrotal cold abscess
    term:
      id: HP:0025615
      label: Abscess
  evidence:
  - reference: PMID:28540230

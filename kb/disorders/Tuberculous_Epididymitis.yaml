    snippet: >-
      Nonspecific constitutional symptoms of TB such as fever, weight loss,
      fatigue and night sweats are uncommon
    explanation: >-
      The authors' summary of earlier reports that constitutional symptoms
      are uncommon.
progression:
- phase: Hematogenous implantation and latency
  notes: >-
    Bacilli implant in the epididymis during bacillemia from a primary
    pulmonary infection; the lesions heal and a latent phase follows.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      With the development of immunity, these lesions cicatrize in about 6
      months or so, and a latent phase then ensues.
    explanation: >-
      Describes healing of the implantation lesions and the latent phase.
- phase: Reactivation and active epididymitis
  notes: >-
    Reactivation, usually decades later, produces caseating epididymitis that
    starts in the tail of the epididymis and is often confined to the
    epididymis at first.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reactivation of the latent foci results from a decrease in the host
      immunity, usually after a long latent period of about 30 years, ranging
      from 1–46 years
    explanation: >-
      Dates reactivation of latent genitourinary foci.
- phase: Advanced epididymo-orchitis with local complications
  notes: >-
    Delayed diagnosis is common, and by presentation many patients have
    testicular involvement, abscess, hydrocele or scrotal sinuses.
  evidence:
  - reference: PMID:34654377
    reference_title: "Surgical management of tuberculous epididymo-orchitis: a retrospective study of 81 cases with long-term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mean duration between the onset of symptoms and the definite
      diagnosis was 6.42 ± 7.0 months.
    explanation: >-
      Quantifies the delay to diagnosis in 81 patients.
- phase: Obstructive sequelae
  notes: >-
    Fibrosis and scarring of the epididymis and vas cause obstructive
    azoospermia and infertility that may persist after successful treatment.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infertility resulting from the tubercular affliction of the genitalia is
      multifactorial in origin and may persist even after successful
      chemotherapy.
    explanation: >-
      States that infertility can outlast successful chemotherapy.
diagnosis:
- name: Scrotal Ultrasonography
  description: >-
    High-resolution scrotal ultrasound is the first imaging study. Tuberculous
    epididymitis shows an enlarged, heterogeneous epididymis, mainly in the
    tail, with testicular involvement seen as hypoechoic areas or an irregular
    epididymo-testicular margin.
  diagnosis_term:
    preferred_term: scrotal ultrasonography
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:8510282
    reference_title: "Tuberculous epididymitis and epididymo-orchitis: sonographic findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most notable sonographic findings of tuberculous epididymitis were an
      enlarged epididymis, predominantly in the tail portion, and marked
      heterogeneity of the echo texture of the involved epididymis.
    explanation: >-
      Describes the sonographic appearance of tuberculous epididymitis.
- name: Histopathology of Biopsy or Resected Tissue
  description: >-
    Caseating granulomas in a core-needle biopsy, aspirate or surgical specimen
    are the usual basis of diagnosis; urine cultures are often negative.
  diagnosis_term:
    preferred_term: histopathology
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:35605951
    reference_title: "Application of core needle biopsy in the diagnosis of epididymal tuberculosis: a retrospective analysis of 41 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      CNB was useful in diagnosing epididymal TB. Therefore, we recommend using
      CNB as a sample collection tool for diagnosing epididymal TB.
    explanation: >-
      Supports core-needle biopsy for histological diagnosis of epididymal TB.
  - reference: PMID:34654377
    reference_title: "Surgical management of tuberculous epididymo-orchitis: a retrospective study of 81 cases with long-term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Urine acid fast bacilli cultures were available in 16 patients and all
      were negative.
    explanation: >-
      Shows that urine culture often fails to confirm the diagnosis.
- name: Xpert MTB/RIF Assay on Epididymal Tissue
  description: >-
    Nucleic acid amplification of M. tuberculosis DNA in epididymal tissue is
    more sensitive than mycobacterial culture.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:35128582
    reference_title: "Assessing the diagnostic accuracy of the Xpert MTB/RIF assay in detecting epididymal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The diagnostic sensitivity of the Xpert MTB/RIF assay was significantly
      higher than that of the MTB culture test for epididymal TB.
    explanation: >-
      Compares Xpert MTB/RIF with culture in 81 surgical specimens.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard six-month antituberculous chemotherapy, four drugs in the
    intensive phase (isoniazid, rifampicin, pyrazinamide, ethambutol) and
    isoniazid with rifampicin in the continuation phase, is first-line for
    all genital tuberculosis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Epididymitis
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli driving the granulomatous lesion.
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anti-tubercular chemotherapy is the first line of management for all
      forms of genital Tb and a 6 months course is the standard of care.
    explanation: >-
      States the first-line role and standard duration of chemotherapy.
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients are started with four drugs in the first two months ‘the
      intensive phase’ of the regimen (rifampicin, isoniazid, pyrazinamide and
      ethambutol) and are then shifted to two drugs in the ‘continuation phase’
      (rifampicin and isoniazid)
    explanation: >-
      Names the drugs of the intensive and continuation phases.
- name: Epididymectomy or Epididymo-orchiectomy
  description: >-
    Surgical excision of the epididymis, or of the epididymis and testis when
    the testis is involved, combined with chemotherapy before and after
    surgery. Chinese surgical series use it routinely for advanced or
    complicated disease (abscess, sinus, testicular involvement) and when
    a tumour cannot be excluded; a review notes that most patients respond to
    chemotherapy alone and that surgery is now rarely needed for diagnosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: epididymectomy
    term:
      id: NCIT:C51493
      label: Epididymectomy
  target_mechanisms:
  - target: Contiguous Extension to the Testis and Scrotal Wall
    treatment_effect: INHIBITS
    description: >-
      Excision removes the caseous lesion and its extension into the testis
      and scrotal tissues.
  evidence:
  - reference: PMID:34654377
    reference_title: "Surgical management of tuberculous epididymo-orchitis: a retrospective study of 81 cases with long-term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Given TB of the testis is always secondary to infection of the
      epididymis, epididymectomy (33.3%) and epididymo-orchidectomy (64.2%)
      were the main surgical procedure for TBEO in our study.
    explanation: >-
      Reports epididymectomy and epididymo-orchidectomy as the main
      procedures in 81 surgically treated patients.
  - reference: PMID:31934504
    reference_title: "Diagnosis and treatment of epididymal tuberculosis: a review of 47 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      When epididymal tuberculosis manifests bead-like changes, testicular
      involvement, or sinus formation, good results can be achieved with
      definitive epididymal-testicular surgery.
    explanation: >-
      Reports good results of surgery for advanced epididymal tuberculosis.
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most patients with tubercular epididymo-orchitis respond to
      antitubercular therapy but may require open or percutaneous drainage.
    explanation: >-
      A review position that most patients respond to drugs alone, which
      limits surgery to selected cases.
- name: Assisted Reproduction
  description: >-
    Because obstruction is often at several levels and not reconstructable,
    most men with tuberculous obstructive azoospermia need in-vitro
    fertilisation or intracytoplasmic sperm injection, using epididymal or
    testicular sperm.

    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Because of blood testes barrier, testes can only be involved by direct
      extension from the epididymis and isolated testicular involvement with
      normal epididymis should raise concerns for a malignant testicular
      lesion.
    explanation: >-
      States that the testis is involved only by direct extension from the
      epididymis.
  - reference: PMID:31934504
    reference_title: "Diagnosis and treatment of epididymal tuberculosis: a review of 47 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Some lesions invaded the entire epididymis, some showed involvement of
      the testis with adherence to the scrotum to form a cold abscess and some
      showed the formation of ulcerated sinus tracts in the skin.
    explanation: >-
      Describes testicular involvement, cold abscess and cutaneous sinus
      tracts in resected specimens.
  downstream:
  - target: Orchitis
    causal_link_type: DIRECT
    description: >-
      Extension into the testis gives tuberculous epididymo-orchitis.
    evidence:
    - reference: PMID:8510282
      reference_title: "Tuberculous epididymitis and epididymo-orchitis: sonographic findings."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        In 6 patients with tuberculous epididymitis the testes were also
        involved (epididymo-orchitis).
      explanation: >-
        Reports testicular involvement in 6 of 10 patients with tuberculous
        epididymitis.
  - target: Abscess
    causal_link_type: DIRECT
    description: >-
      Liquefied caseous material forms a cold abscess in the epididymis or
      scrotum.
  - target: Draining sinus tract in skin
    causal_link_type: DIRECT
    description: >-
      Caseous lesions adherent to the scrotum ulcerate through the skin as
      discharging sinuses.
  - target: Hydrocele testis
    causal_link_type: DIRECT
    description: >-
      Inflammation reaching the tunica vaginalis produces a reactive hydrocele.
- name: Epididymal and Vasal Obstruction and Fibrosis
  conforms_to: "granuloma_formation#Tissue Containment versus Destruction and Fibrosis"
  description: >-
    Tissue destruction, fibrosis and scarring of the epididymis and vas
    deferens obstruct sperm transport, often bilaterally and at several
    levels, and can persist or worsen after successful chemotherapy.
  biological_scale: TISSUE
  locations:
  - preferred_term: epididymis
    term:
      id: UBERON:0001301
      label: epididymis
  - preferred_term: vas deferens
    term:
      id: UBERON:0001000
      label: vas deferens
  evidence:
  - reference: PMID:31934504
    reference_title: "Diagnosis and treatment of epididymal tuberculosis: a review of 47 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The pathological features of epididymal tuberculosis are extensive
      tissue destruction and fibrosis, eventually leading to destruction of the
      epididymis and surrounding genital tissues and organs and complications
      such as infertility and other serious effects on male reproductive
      system function.
    explanation: >-
      Describes destruction and fibrosis of the epididymis leading to
      infertility.
  downstream:
  - target: Obstructive azoospermia
    causal_link_type: DIRECT
    description: >-
      Obstruction of the epididymis and vas prevents sperm from reaching the
      ejaculate while spermatogenesis is preserved.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In cases with isolated epididymal or vassal involvement, semen
        parameters is suggestive of obstructive azoospermia and reveal
        azoospermia or severe oligospermia with normal volume fructose positive
        ejaculate.
      explanation: >-
        Links epididymal and vasal involvement to obstructive azoospermia.
  - target: Male infertility
    causal_link_type: DIRECT
    description: >-
      Ductal destruction and scarring cause infertility that may persist after
      cure.
    evidence:
    - reference: PMID:28540230
      reference_title: "Genital tuberculosis: current status of diagnosis and management."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Because of its destructive nature and the resultant fibrosis and
        scarring, infertility resulting from tubercular affliction of genitalia
        is multifactorial in origin and may persist even after successful
        chemotherapy
      explanation: >-
        Attributes infertility in genital tuberculosis to destruction,
        fibrosis and scarring.
phenotypes:
- name: Epididymitis
  description: >-
    Chronic swelling of the epididymis, felt as a firm, nodular or beaded
    scrotal mass that is often painless and may be bilateral.
  phenotype_term:
    preferred_term: tuberculous epididymitis (scrotal mass)
    term:
      id: HP:0000031
      label: Epididymitis
  evidence:
  - reference: PMID:28540230
    reference_title: "Genital tuberculosis: current status of diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Eighty percent of patients with tubercular epididymo-orchitis present
      with a scrotal mass, which can be painful in 40–44%
    explanation: >-
      Reports a scrotal mass as the presentation in most patients.
  - reference: PMID:34654377
    reference_title: "Surgical management of tuberculous epididymo-orchitis: a retrospective study of 81 cases with long-term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Scrotal swelling (N = 47, 58.0%) and pain (N = 29, 35.8%) were the most
      common presenting complaint.
    explanation: >-
      Reports scrotal swelling as the commonest presenting complaint in 81
      patients.
- name: Scrotal pain
  phenotype_term:
    preferred_term: Scrotal pain

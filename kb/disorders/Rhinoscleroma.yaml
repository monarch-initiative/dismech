name: Rhinoscleroma
creation_date: "2026-09-25T21:51:11Z"
category: Infectious Disease
description: >-
  Rhinoscleroma is a chronic Klebsiella pneumoniae subsp. rhinoscleromatis
  infection of the upper respiratory tract in which K3-encapsulated bacteria
  persist in macrophages, induce IL-10-dependent Mikulicz-cell maturation and
  plasmacytic granulomatous inflammation, and ultimately produce fibrotic nasal
  and upper-airway stenosis.
disease_term:
  preferred_term: rhinoscleroma
  term:
    id: MONDO:0005945
    label: rhinoscleroma
parents:
- Klebsiella Infectious Disease
synonyms:
- Respiratory scleroma
- Scleroma
notes: >-
  Host susceptibility remains unresolved: PMID:18947330 reported familial
  early-onset cases and consanguinity in a small French retrospective series,
  but no mapped rhinoscleroma gene has been established.
infectious_agent:
- name: Klebsiella rhinoscleromatis
  infectious_agent_term:
    preferred_term: Klebsiella rhinoscleromatis
    term:
      id: NCBITaxon:39831
      label: Klebsiella pneumoniae subsp. rhinoscleromatis
  description: >-
    Human-associated Gram-negative Klebsiella pneumoniae subspecies historically
    named Klebsiella rhinoscleromatis; K3 capsule is a virulence factor in
    experimental rhinoscleroma.
  evidence:
  - reference: PMID:29381692
    reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Rhinoscleroma is a human specific chronic granulomatous infection of the
      nose and upper airways caused by the Gram-negative bacterium Klebsiella
      pneumoniae subsp. rhinoscleromatis.
    explanation: >-
      Identifies K. pneumoniae subsp. rhinoscleromatis as the human bacterial
      agent that causes rhinoscleroma.
transmission:
- name: Prolonged exposure in crowded, low-hygiene endemic settings
  description: >-
    Klebsiella pneumoniae subsp. rhinoscleromatis is essentially restricted to
    humans, and rhinoscleroma behaves as a disease of prolonged exposure rather
    than of a single infecting event. Cases arise in crowded rural areas with
    poor hygiene and low socioeconomic and nutritional status, and in patients
    from endemic regions the probable exposure period runs to years or decades
    before disease.
  notes: >-
    The precise portal of entry into the nasal mucosa is not established by the
    sources cited here, so no inhalational or direct-inoculation route is
    asserted. A PubMed search of "rhinoscleroma transmission" returns exactly
    one paper addressing the mechanism, Krasilnikov 1968 (PMID:5666684), and
    the fetches made for it returned no quotable text, so it is named here
    rather than cited as evidence. Two results of that search are false
    friends: PMID:390072 is a transmission electron microscopy study, and
    PMID:3950479 measures serum immunoglobulin in contacts rather than their
    infection. The 2020 prospective series notes that many of the mechanisms
    of infection remain unknown.
  evidence:
  - reference: PMID:31529285
    reference_title: "A Myriad of Scleroma Presentations: The Usual and Unusual."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is endemic in crowded, rural areas with low socioeconomic and nutritional status."
    explanation: >-
      A 52-patient prospective series names crowding and poor living conditions
      as the setting in which exposure occurs.
  - reference: PMID:29381692
    reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Although considered a rare disease, it is endemic in low-income countries where hygienic conditions are poor."
    explanation: >-
      Ties endemicity to poor hygienic conditions, which is the exposure setting
      rather than a mechanism of spread.
  - reference: PMID:29578083
    reference_title: "Social geography of Rhinoscleroma and qualitatively and quantitatively abnormal cell-mediated immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rhinoscleroma is predominantly reported in rural areas, in the presence of poor socio-economic conditions, which according to many authors would be a co-factor triggering the disease."
    explanation: >-
      Independently reports the same rural, low-income distribution and treats
      those conditions as a contributing factor.
  - reference: PMID:18947330
    reference_title: "Rhinoscleroma: a French national retrospective study of epidemiological and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probable duration of exposure to K. rhinoscleromatis in endemic areas varied widely: 0-28 years."
    explanation: >-
      A national retrospective series reconstructing exposure duration in
      endemic areas, supporting prolonged exposure rather than a discrete
      transmission event.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:29381692
      reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Rhinoscleroma is a human specific chronic granulomatous infection of the
        nose and upper airways caused by the Gram-negative bacterium Klebsiella
        pneumoniae subsp. rhinoscleromatis.
      explanation: >-
        Rhinoscleroma is a bacterial infection of the upper respiratory tract.
stages:
- name: Catarrhal-Atrophic Stage
  description: >-
    Initial rhinoscleroma stage before bulky granulomatous lesions, corresponding
    to the catarrhal-atrophic phase described in the clinical staging sequence.
  evidence:
  - reference: PMID:17359555
    reference_title: Klebsiella rhinoscleromatis of the membranous nasal septum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are three stages of the disease: catarrhal-atrophic, granulomatous
      (also known as hypertrophic) and sclerotic.
    explanation: >-
      Defines the catarrhal-atrophic phase as one of the three recognized
      rhinoscleroma stages.
- name: Granulomatous Hypertrophic Stage
  description: >-
    Proliferative stage with hypertrophic granulomatous masses, Mikulicz cells,
    and dense plasmacytic inflammation.
  evidence:
  - reference: PMID:17359555
    reference_title: Klebsiella rhinoscleromatis of the membranous nasal septum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are three stages of the disease: catarrhal-atrophic, granulomatous
      (also known as hypertrophic) and sclerotic.
    explanation: >-
      Defines the granulomatous, or hypertrophic, phase as one of the three
      recognized rhinoscleroma stages.
- name: Sclerotic Stage
  description: >-
    Late fibrotic stage in which chronic upper-airway lesions heal with scarring,
    stenosis, and nasal or airway deformity.
  evidence:
  - reference: PMID:17359555
    reference_title: Klebsiella rhinoscleromatis of the membranous nasal septum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are three stages of the disease: catarrhal-atrophic, granulomatous
      (also known as hypertrophic) and sclerotic.
    explanation: >-
      Defines the sclerotic phase as one of the three recognized rhinoscleroma
      stages.
pathophysiology:
- name: K3-Encapsulated Klebsiella Upper-Airway Infection
  description: >-
    K. pneumoniae subsp. rhinoscleromatis most often infects the nasal cavity but
    can spread to the nasopharynx, larynx, trachea, and bronchi; rhinoscleroma
    isolates uniformly carry a K3 capsule that contributes to bacterial
    virulence.
  biological_scale: TISSUE
  locations:
  - preferred_term: nasal cavity
    term:
      id: UBERON:0001707
      label: nasal cavity
  - preferred_term: nasopharynx
    term:
      id: UBERON:0001728
      label: nasopharynx
  - preferred_term: larynx
    term:
      id: UBERON:0001737
      label: larynx
  - preferred_term: trachea
    term:
      id: UBERON:0003126
      label: trachea
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  notes: >-
    CT and MRI series data report descending spread into the nasopharynx, larynx,
    trachea, and bronchi while noting that the paranasal sinuses are usually
    spared.
  downstream:
  - target: Macrophage Intracellular Bacterial Persistence
    causal_link_type: DIRECT
    description: >-
      Encapsulated Klebsiella cells are phagocytosed but persist in vacuolated
      macrophages instead of being cleared.
  evidence:
  - reference: PMID:29381692
    reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All K. rhinoscleromatis strains are of K3 serotype, suggesting that CPS can
      be an important driver of rhinoscleroma disease.
    explanation: >-
      Links the shared K3 capsule of rhinoscleroma isolates to capsule
      polysaccharide-driven virulence in the disease model.
  - reference: PMID:19146007
    reference_title: Rhinoscleroma of the sinuses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rhinoscleroma primarily affects the nasal cavity but the nasopharynx
      (18%-43%), larynx (15%-40%), trachea (12%) and bronchi (2% to 7%) can also
      be involved.
    explanation: >-
      Documents the usual nasal site and the less frequent nasopharyngeal,
      laryngeal, tracheal, and bronchial extension sites.
- name: Macrophage Intracellular Bacterial Persistence
  description: >-
    Bacilli survive inside cytoplasmic vacuoles of macrophages, creating the
    foamy Mikulicz cells that mark the granulomatous stage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: IL-10-Dependent Mikulicz Cell Maturation
    causal_link_type: DIRECT
    description: >-
      K. rhinoscleromatis infection induces IL-10, and this cytokine milieu is
      required for atypical inflammatory monocytes to mature into Mikulicz cells.
  evidence:
  - reference: PMID:333340
    reference_title: The role of plasma cells in scleroma. Electron-microscopic study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cytoplasmic vacuolations containing viable and degenerated bacilli forming
      Mikulicz cells
    explanation: >-
      Ultrastructural human pathology demonstrates bacilli within the vacuolated
      Mikulicz macrophages.
- name: IL-10-Dependent Mikulicz Cell Maturation
  description: >-
    K. rhinoscleromatis drives strong IL-10 production; in mice, IL-10 is required
    for bone-marrow-derived inflammatory monocytes to mature into the foamy
    Mikulicz cells characteristic of rhinoscleroma lesions.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: interleukin-10 production
    modifier: INCREASED
    term:
      id: GO:0032613
      label: interleukin-10 production
  downstream:
  - target: Plasmacytic Granulomatous Inflammation
    causal_link_type: DIRECT
    description: >-
      Mikulicz-cell maturation is accompanied by a dense inflammatory
      plasmacytic infiltrate with Russell bodies.
  evidence:
  - reference: PMID:23554169
    reference_title: "A novel murine model of rhinoscleroma identifies Mikulicz cells, the disease signature, as IL-10 dependent derivatives of inflammatory monocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in the absence of IL-10, very few Mikulicz cells were observed, confirming a
      crucial role of IL-10 in the establishment of a proper environment leading
      to the maturation of these atypical monocytes.
    explanation: >-
      IL-10 loss sharply reduces Mikulicz-cell formation in the rhinoscleroma
      mouse model, supporting an IL-10-dependent maturation step.
- name: Plasmacytic Granulomatous Inflammation
  description: >-
    Rhinoscleroma lesions contain Mikulicz histiocytes and a dense plasma-cell
    infiltrate with Russell bodies, forming the hypertrophic granulomatous stage.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fibrotic Upper Airway Stenosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic granulomatous inflammation progresses to a sclerotic fibrotic
      stage, narrowing the upper airway and distorting the nose.
  - target: Nasal Obstruction
    causal_link_type: DIRECT
    description: >-
      Granulomatous intranasal masses obstruct the nasal airway.
  - target: Rhinorrhea
    causal_link_type: DIRECT
    description: >-
      Inflamed intranasal mucosa produces rhinorrhea during upper-airway disease.
  - target: Epistaxis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic inflammatory intranasal lesions can bleed, producing epistaxis.
  evidence:
  - reference: PMID:8784898
    reference_title: "Respiratory scleroma: a clinicopathologic and ultrastructural study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Light microscopy showed a dense plasmacytic infiltrate, Mikulicz histiocytes,
      and Russell bodies within the plasma cells.
    explanation: >-
      Establishes the characteristic plasmacytic and Mikulicz-cell histology of
      respiratory scleroma lesions.
- name: Fibrotic Upper Airway Stenosis
  description: >-
    The sclerotic stage leaves fibrotic stenoses in the nasopharynx, oropharynx,
    larynx, and adjacent upper-airway structures even after infection is treated.
  biological_scale: TISSUE
  downstream:
  - target: Upper Airway Obstruction
    causal_link_type: DIRECT
    description: >-
      Fibrotic luminal stenosis mechanically narrows the upper airway.
  - target: Stridor
    causal_link_type: DIRECT
    description: >-
      Laryngotracheal stenosis mechanically narrows the upper airway and produces
      noisy obstructed breathing.
  - target: Dysphonia
    causal_link_type: DIRECT
    description: >-
      Laryngeal stenosis and scarring can impair phonation and produce dysphonia.
  - target: Dysphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pharyngeal and laryngeal extension can obstruct the upper aerodigestive
      tract and interfere with swallowing.
  evidence:
  - reference: PMID:17086321
    reference_title: "Rhinoscleroma: eight Peruvian cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented airway structural alterations producing nasopharyngeal,
      oropharyngeal and, in one patient, laryngeal stenosis.
    explanation: >-
      Documents stenosing structural airway sequelae in a human rhinoscleroma
      series.

name: Rhinoscleroma
creation_date: "2026-09-25T21:51:11Z"
category: Infectious Disease
description: >-
  Rhinoscleroma is a chronic Klebsiella pneumoniae subsp. rhinoscleromatis
  infection of the upper respiratory tract in which K3-encapsulated bacteria
  persist in macrophages, induce IL-10-dependent Mikulicz-cell maturation and
  plasmacytic granulomatous inflammation, and ultimately produce fibrotic nasal
  and upper-airway stenosis.
disease_term:
  preferred_term: rhinoscleroma
  term:
    id: MONDO:0005945
    label: rhinoscleroma
parents:
- Klebsiella Infectious Disease
synonyms:
- Respiratory scleroma
- Scleroma
infectious_agent:
- name: Klebsiella rhinoscleromatis
  infectious_agent_term:
    preferred_term: Klebsiella rhinoscleromatis
    term:
      id: NCBITaxon:39831
      label: Klebsiella pneumoniae subsp. rhinoscleromatis
  description: >-
    Human-associated Gram-negative Klebsiella pneumoniae subspecies historically
    named Klebsiella rhinoscleromatis; K3 capsule is a virulence factor in
    experimental rhinoscleroma.
  evidence:
  - reference: PMID:29381692
    reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rhinoscleroma is a human specific chronic granulomatous infection of the
      nose and upper airways caused by the Gram-negative bacterium Klebsiella
      pneumoniae subsp. rhinoscleromatis.
    explanation: >-
      Identifies K. pneumoniae subsp. rhinoscleromatis as the human bacterial
      agent that causes rhinoscleroma.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:29381692
      reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rhinoscleroma is a human specific chronic granulomatous infection of the
        nose and upper airways caused by the Gram-negative bacterium Klebsiella
        pneumoniae subsp. rhinoscleromatis.
      explanation: >-
        Rhinoscleroma is a bacterial infection of the upper respiratory tract.
pathophysiology:
- name: K3-Encapsulated Klebsiella Nasal Infection
  description: >-
    K. pneumoniae subsp. rhinoscleromatis infects the nasal cavity and upper
    airways; rhinoscleroma isolates uniformly carry a K3 capsule that contributes
    to bacterial virulence.
  biological_scale: TISSUE
  locations:
  - preferred_term: nasal cavity
    term:
      id: UBERON:0001707
      label: nasal cavity
  downstream:
  - target: Macrophage Intracellular Bacterial Persistence
    causal_link_type: DIRECT
    description: >-
      Encapsulated Klebsiella cells are phagocytosed but persist in vacuolated
      macrophages instead of being cleared.
  evidence:
  - reference: PMID:29381692
    reference_title: "Rhinoscleroma pathogenesis: The type K3 capsule of Klebsiella rhinoscleromatis is a virulence factor not involved in Mikulicz cells formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All K. rhinoscleromatis strains are of K3 serotype, suggesting that CPS can
      be an important driver of rhinoscleroma disease.
    explanation: >-
      Links the shared K3 capsule of rhinoscleroma isolates to capsule
      polysaccharide-driven virulence in the disease model.
- name: Macrophage Intracellular Bacterial Persistence
  description: >-
    Bacilli survive inside cytoplasmic vacuoles of macrophages, creating the
    foamy Mikulicz cells that mark the granulomatous stage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: IL-10-Dependent Mikulicz Cell Maturation
    causal_link_type: DIRECT
    description: >-
      K. rhinoscleromatis infection induces IL-10, and this cytokine milieu is
      required for atypical inflammatory monocytes to mature into Mikulicz cells.
  evidence:
  - reference: PMID:333340
    reference_title: The role of plasma cells in scleroma. Electron-microscopic study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cytoplasmic vacuolations containing viable and degenerated bacilli forming
      Mikulicz cells
    explanation: >-
      Ultrastructural human pathology demonstrates bacilli within the vacuolated
      Mikulicz macrophages.
- name: IL-10-Dependent Mikulicz Cell Maturation
  description: >-
    K. rhinoscleromatis drives strong IL-10 production; in mice, IL-10 is required
    for bone-marrow-derived inflammatory monocytes to mature into the foamy
    Mikulicz cells characteristic of rhinoscleroma lesions.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: interleukin-10 production
    modifier: INCREASED
    term:
      id: GO:0032613
      label: interleukin-10 production
  downstream:
  - target: Plasmacytic Granulomatous Inflammation
    causal_link_type: DIRECT
    description: >-
      Mikulicz-cell maturation is accompanied by a dense inflammatory
      plasmacytic infiltrate with Russell bodies.
  evidence:
  - reference: PMID:23554169
    reference_title: "A novel murine model of rhinoscleroma identifies Mikulicz cells, the disease signature, as IL-10 dependent derivatives of inflammatory monocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      in the absence of IL-10, very few Mikulicz cells were observed, confirming a
      crucial role of IL-10 in the establishment of a proper environment leading
      to the maturation of these atypical monocytes.
    explanation: >-
      IL-10 loss sharply reduces Mikulicz-cell formation in the rhinoscleroma
      mouse model, supporting an IL-10-dependent maturation step.
- name: Plasmacytic Granulomatous Inflammation
  description: >-
    Rhinoscleroma lesions contain Mikulicz histiocytes and a dense plasma-cell
    infiltrate with Russell bodies, forming the hypertrophic granulomatous stage.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fibrotic Upper Airway Stenosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic granulomatous inflammation progresses to a sclerotic fibrotic
      stage, narrowing the upper airway and distorting the nose.
  - target: Nasal Obstruction
    causal_link_type: DIRECT
    description: >-
      Granulomatous intranasal masses obstruct the nasal airway.
  evidence:
  - reference: PMID:8784898
    reference_title: "Respiratory scleroma: a clinicopathologic and ultrastructural study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Light microscopy showed a dense plasmacytic infiltrate, Mikulicz histiocytes,
      and Russell bodies within the plasma cells.
    explanation: >-
      Establishes the characteristic plasmacytic and Mikulicz-cell histology of
      respiratory scleroma lesions.
- name: Fibrotic Upper Airway Stenosis
  description: >-
    The sclerotic stage leaves fibrotic stenoses in the nasopharynx, oropharynx,
    larynx, and adjacent upper-airway structures even after infection is treated.
  biological_scale: TISSUE
  downstream:
  - target: Upper Airway Obstruction
    causal_link_type: DIRECT
    description: >-
      Fibrotic luminal stenosis mechanically narrows the upper airway.
  evidence:
  - reference: PMID:17086321
    reference_title: "Rhinoscleroma: eight Peruvian cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients presented airway structural alterations producing nasopharyngeal,
      oropharyngeal and, in one patient, laryngeal stenosis.
    explanation: >-
      Documents stenosing structural airway sequelae in a human rhinoscleroma
      series.
phenotypes:
- name: Nasal Obstruction
  category: Respiratory
  diagnostic: true
  phenotype_term:
    preferred_term: nasal obstruction
    term:
      id: HP:0001742
      label: Nasal congestion
  evidence:
  - reference: PMID:21410904
    reference_title: "Clinical, radiological and pathological study of 88 cases of typical and complicated scleroma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common complaint is nasal obstruction, other symptoms include;
      rhinorrhea, epistaxis, dysphagia, stridor, and dysphonia.
    explanation: >-
      Identifies nasal obstruction as the most common complaint in a large
      clinical series of scleroma.
- name: Epistaxis
  category: Respiratory
  phenotype_term:
    preferred_term: Epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
  evidence:
  - reference: PMID:21410904
    reference_title: "Clinical, radiological and pathological study of 88 cases of typical and complicated scleroma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common complaint is nasal obstruction, other symptoms include;
      rhinorrhea, epistaxis, dysphagia, stridor, and dysphonia.
    explanation: >-
      Lists epistaxis among the upper-airway symptoms observed in scleroma.
- name: Upper Airway Obstruction
  category: Respiratory
  phenotype_term:
    preferred_term: Upper airway obstruction
    term:
      id: HP:0002781
      label: Upper airway obstruction
  evidence:
  - reference: PMID:17086321
    reference_title: "Rhinoscleroma: eight Peruvian cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all of them presented some degree of upper airway stenosis.
    explanation: >-
      Residual stenosis across the Peruvian case series supports structural
      upper-airway obstruction as a rhinoscleroma sequela.
treatments:
- name: Ciprofloxacin
  description: >-
    Fluoroquinolone antibiotic that penetrates macrophages and has been used for
    multi-week treatment courses against intracellular K. rhinoscleromatis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
  target_mechanisms:
  - target: Macrophage Intracellular Bacterial Persistence
    description: >-
      Prolonged ciprofloxacin treatment targets the intracellular bacterial niche
      because the drug concentrates within macrophages.
  evidence:
  - reference: PMID:17086321
    reference_title: "Rhinoscleroma: eight Peruvian cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ciprofloxacin 500 mg bid for four to 12 weeks was used in seven patients
    explanation: >-
      Reports clinical ciprofloxacin use for rhinoscleroma in the Peruvian case
      series.
- name: Surgical Debridement
  description: >-
    Debridement can be combined with long-term antibiotics for obstructive or
    deforming rhinoscleroma lesions.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical debridement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Plasmacytic Granulomatous Inflammation
    description: >-
      Debulking granulomatous masses can relieve obstruction while antibiotics
      clear the intracellular infection.
  evidence:
  - reference: PMID:17359555
    reference_title: Klebsiella rhinoscleromatis of the membranous nasal septum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, the recommended treatment consists of a combination of surgical
      debridement and long-term antibiotic therapy.
    explanation: >-
      Supports surgical debridement as part of combined management for
      rhinoscleroma.

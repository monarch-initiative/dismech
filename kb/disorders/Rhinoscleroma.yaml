histopathology:
- name: Mikulicz Cells
  description: >-
    Large vacuolated histiocytes containing Klebsiella bacilli are the signature
    macrophages of respiratory scleroma lesions.
  diagnostic: true
  evidence:
  - reference: PMID:8784898
    reference_title: "Respiratory scleroma: a clinicopathologic and ultrastructural study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural study revealed Mikulicz histiocytes, cytoplasmic vacuoles
      containing bacilli, and so-called A and B granules.
    explanation: >-
      Documents bacillus-containing Mikulicz histiocytes in human respiratory
      scleroma tissue.
- name: Russell Body Plasmacytic Infiltrate
  description: >-
    Dense plasma-cell inflammation with intracellular Russell bodies accompanies
    Mikulicz cells in the granulomatous lesions.
  diagnostic: true
  evidence:
  - reference: PMID:8784898
    reference_title: "Respiratory scleroma: a clinicopathologic and ultrastructural study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Light microscopy showed a dense plasmacytic infiltrate, Mikulicz histiocytes,
      and Russell bodies within the plasma cells.
    explanation: >-
      Supports Russell-body-rich plasmacytic inflammation as characteristic
      rhinoscleroma histopathology.
diagnosis:
- name: Biopsy histopathology for Mikulicz cells and Russell bodies
  description: >-
    Biopsy with histopathologic examination can establish rhinoscleroma when the
    classic combination of Mikulicz cells and Russell-body plasma cells is seen.
  diagnosis_term:
    preferred_term: histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:17359555
    reference_title: Klebsiella rhinoscleromatis of the membranous nasal septum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis is made either by positive Klebsiella rhinoscleromatis
      culture or from the classic histological findings of Mikulicz cells and
      transformed plasma cells with Russell bodies.
    explanation: >-
      Supports classic Mikulicz-cell and Russell-body histology as a diagnostic
      route.
- name: Klebsiella rhinoscleromatis biopsy culture
  description: >-
    Culture of biopsy tissue can confirm the causative organism, although culture
    sensitivity is limited and stage-dependent.
  diagnosis_term:
    preferred_term: microbial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:19146007
    reference_title: Rhinoscleroma of the sinuses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of rhinoscleroma was based on histological characteristics and
      presence of Klebsiella rhinoscleromatis on biopsy cultures.
    explanation: >-
      Supports histology plus K. rhinoscleromatis recovery from biopsy cultures
      as a diagnostic basis.
environmental:
- name: Rural poor socioeconomic endemic context
  description: >-
    Endemic rhinoscleroma clusters in rural areas with poor socioeconomic
    conditions, consistent with a crowding and poverty-associated exposure
    context that increases risk of persistent K. rhinoscleromatis infection.
  effect: >-
    Increases risk of K. rhinoscleromatis acquisition or persistence in endemic
    communities.
  evidence:
  - reference: PMID:29578083
    reference_title: Social geography of Rhinoscleroma and qualitatively and quantitatively abnormal cell-mediated immunity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rhinoscleroma is predominantly reported in rural areas, in the presence of
      poor socio-economic conditions, which according to many authors would be a
      co-factor triggering the disease.
    explanation: >-
      Supports poor rural socioeconomic conditions as a recurrent risk context in
      endemic rhinoscleroma regions.
  influences_mechanisms:
  - target: K3-Encapsulated Klebsiella Upper-Airway Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Rural poverty, crowding, poor sanitation, and malnutrition have been
      proposed as cofactors that favor transmission or persistence of the
      organism.
    evidence:
    - reference: PMID:29578083
      reference_title: Social geography of Rhinoscleroma and qualitatively and quantitatively abnormal cell-mediated immunity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Rhinoscleroma is predominantly reported in rural areas, in the presence
        of poor socio-economic conditions, which according to many authors would
        be a co-factor triggering the disease.
      explanation: >-
        Supports rural poor socioeconomic conditions as a recurrent endemic
        context for rhinoscleroma.
  notes: >-
    ECTO searches for socioeconomic, sanitation, crowding, and malnutrition did
    not return a specific term for this poverty-associated transmission context,
    so this factor is left text-bound.
treatments:
- name: Ciprofloxacin
  description: >-
    Fluoroquinolone antibiotic that penetrates macrophages and has been used for
    multi-week treatment courses against intracellular K. rhinoscleromatis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
  target_mechanisms:
  - target: Macrophage Intracellular Bacterial Persistence
    description: >-
      Prolonged ciprofloxacin treatment targets the intracellular bacterial niche
      because the drug concentrates within macrophages.
    evidence:
    - reference: PMID:11244532
      reference_title: A case of rhinoscleroma treated with ciprofloxacin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ciprofloxacin is convenient for oral administration and has few adverse
        effects. It achieves good tissue penetration, is concentrated in
        macrophages and may prove to be useful in the therapy of rhinoscleroma.
      explanation: >-
        Supports macrophage concentration as the rationale for using
        ciprofloxacin against bacteria persisting in Mikulicz macrophages.
  evidence:
  - reference: PMID:17086321
    reference_title: "Rhinoscleroma: eight Peruvian cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ciprofloxacin 500 mg bid for four to 12 weeks was used in seven patients
    explanation: >-
      Reports clinical ciprofloxacin use for rhinoscleroma in the Peruvian case
      series.
- name: Surgical Debridement
  description: >-
    Debridement can be combined with long-term antibiotics for obstructive or
    deforming rhinoscleroma lesions.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: debridement
    term:
      id: NCIT:C51682
      label: Debridement
  target_mechanisms:
  - target: Plasmacytic Granulomatous Inflammation
    description: >-
      Debulking granulomatous masses can relieve obstruction while antibiotics
      clear the intracellular infection.
  evidence:
  - reference: PMID:17359555
    reference_title: Klebsiella rhinoscleromatis of the membranous nasal septum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, the recommended treatment consists of a combination of surgical

diagnosis:
- name: Molecular genetic testing (COL4A3/COL4A4/COL4A5)
  description: >
    Definitive diagnosis is established by identifying a pathogenic variant in
    COL4A3, COL4A4, or COL4A5 on molecular genetic testing in a proband with
    suggestive clinical findings (hematuria, family history, hearing/ocular signs).
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of Alport syndrome is established in a proband with suggestive findings and a pathogenic variant(s) in COL4A3, COL4A4, or COL4A5 identified by molecular genetic testing."
    explanation: >
      GeneReviews establishes molecular genetic testing of the three collagen IV
      genes as the definitive diagnostic modality.
- name: Kidney biopsy with electron microscopy
  description: >
    When genetic testing is unavailable or uninformative, kidney biopsy (or skin
    biopsy in some XLAS individuals) supports the diagnosis; electron microscopy of
    the glomerular basement membrane is the key ultrastructural test, showing
    segmental thinning early and lamellation/basket-weaving as disease progresses.
  diagnosis_term:
    preferred_term: kidney biopsy
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney biopsy, skin biopsy (in some individuals with XLAS), or clinical diagnostic criteria may be used to establish the diagnosis"
    explanation: >
      GeneReviews lists kidney/skin biopsy and clinical criteria as diagnostic
      alternatives when molecular testing is unavailable or uninformative.
  - reference: PMID:39384359
    reference_title: "Pathological diagnosis of Alport syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The earliest electron microscopic finding of AS is segmental thinning of the lamina densa."
    explanation: >
      Human renal-biopsy observation identifying segmental GBM thinning as the
      earliest electron-microscopic diagnostic clue, preceding the lamellation and
      basket-weaving of advanced disease.
- name: Type IV collagen alpha-chain immunostaining
  description: >
    Immunohistochemical staining for type IV collagen alpha chains (notably
    alpha-5(IV)) on kidney or skin biopsy is the most Alport-specific pathology
    test: absent or abnormal alpha-5(IV) staining supports the diagnosis, and the
    staining pattern helps distinguish the inheritance subtype. Skin biopsy is
    diagnostic only via this alpha-5(IV) immunostaining.
  diagnosis_term:
    preferred_term: skin biopsy (for alpha-5(IV) immunostaining)
    term:
      id: NCIT:C51692
      label: Skin Biopsy

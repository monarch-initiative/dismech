    agents/circumstances-to-avoid recommendation.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protection of corneas from minor trauma in those with recurrent corneal erosions."
    explanation: >
      GeneReviews recommends protecting the corneas from minor trauma in patients
      with recurrent corneal erosions.
- name: Loud-Noise Avoidance (Auditory, Agents/Circumstances to Avoid)
  description: >
    Minimize exposure to loud noise to limit additional noise-induced hearing loss

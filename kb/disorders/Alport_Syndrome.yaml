      label: Supportive Care
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Drink adequate fluids as dehydration may accelerate the progression of nephropathy."
    explanation: >
      GeneReviews agents/circumstances-to-avoid guidance that dehydration can

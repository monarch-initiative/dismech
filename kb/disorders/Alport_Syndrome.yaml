    snippet: "Type IV collagen staining elucidates distinct patterns based on AS inheritance"
    explanation: >
      Human renal-pathology reference establishing type IV collagen (alpha-chain)
      immunostaining as an Alport-specific test whose pattern reflects the
      inheritance subtype, complementing electron microscopy.
progression:
- phase: Onset
  age_range: Childhood
  notes: >
    Microscopic hematuria is typically the first clinical manifestation, present
    from early childhood in X-linked males.
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "kidney disease progresses from microhematuria to proteinuria, progressive kidney insufficiency, and end-stage kidney disease (ESKD) in most males with X-linked Alport syndrome (XLAS)"
    explanation: >
      GeneReviews natural-history sequence establishes microhematuria as the first
      kidney manifestation, preceding proteinuria and progressive insufficiency, in
      most males with X-linked Alport syndrome - directly supporting the
      childhood-onset first-manifestation claim (replaces a generic disease-definition
      snippet that did not state onset timing).
- phase: Progression
  age_range: Adolescence-Young Adulthood
  notes: >
    Proteinuria develops, hearing loss becomes apparent, and renal function begins
    to decline. Genotype-dependent: severe COL4A5 mutations lead to ESRD by mean
    age 19.8 years; milder mutations by 25-30 years.
  evidence:
  - reference: PMID:12105244
    reference_title: "Meta-analysis of genotype-phenotype correlation in X-linked Alport syndrome: impact on clinical counselling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      large rearrangements, frame shift, nonsense, and splice donor mutations had
      a
      mean ESRF age of 19.8+/-5.7 years; (2) non-glycine- or 3' glycine-missense
      mutations, in-frame deletions/insertions and splice acceptor mutations had a
      mean
      ESRF age of 25.7+/-7.2 years
    explanation: >
      Provides genotype-specific progression data showing mean ESRD ages for different
      mutation types in X-linked Alport syndrome.
- phase: Advanced
  age_range: Young Adulthood-Adulthood
  notes: >
    End-stage renal disease requiring dialysis or transplantation. Post-transplant
    outcomes are generally excellent.
  evidence:
  - reference: PMID:29854973
    reference_title: "Genotype and Outcome After Kidney Transplantation in Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Patient survival was similar in patients with severe and nonsevere mutations
      (89% vs. 84% at 5 years, 83% vs. 75% at 10, 15, and 20 years
    explanation: >
      Demonstrates good post-transplant patient survival regardless of mutation severity.
discussions:
- discussion_id: gap_alport_female_adas_progression
  prompt: >
    What genetic and non-genetic modifiers predict which heterozygous females with
    X-linked Alport syndrome, and which individuals with autosomal dominant Alport
    syndrome, will progress to end-stage kidney disease, given that their course is
    highly variable and often delayed until later adulthood?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#GBM Structural Deterioration
  rationale: >
    X-linked carrier females and autosomal dominant Alport syndrome show wide,
    poorly predictable variability in renal outcome - many reach ESKD only in later
    adulthood or not at all - so clinicians cannot reliably stratify risk or time
    nephroprotective therapy. Identifying predictive genotype (variant type/position,
    X-inactivation) and non-genetic modifiers would enable risk-adapted surveillance
    and treatment.
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In females with XLAS and individuals with autosomal dominant Alport syndrome (ADAS), ESKD is frequently delayed until later adulthood, SNHL is relatively late in onset, and ocular involvement is rare."
    explanation: >
      GeneReviews documents the delayed, variable course in XLAS females and ADAS,
      underscoring the unmet need for progression predictors.
  proposed_experiments:
  - experiment_id: exp_alport_female_adas_cohort
    name: Prospective modifier cohort in XLAS females and ADAS
    description: >
      Follow a genotyped prospective cohort of heterozygous XLAS females and ADAS
      individuals from the hematuria-only stage, integrating variant type/position,
      X-inactivation, proteinuria trajectory, and candidate modifier loci, to derive
      and validate a model predicting progression to ESKD.
    experiment_type:
      preferred_term: prospective cohort study
- discussion_id: gap_alport_raas_timing
  prompt: >
    Does initiating renin-angiotensin system blockade at the earliest
    (microhematuria-only) stage, before the onset of proteinuria, improve long-term
    kidney outcomes compared with starting at proteinuria onset?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Microscopic Hematuria
  rationale: >
    ACE inhibitors/ARBs delay ESKD in Alport syndrome, and microhematuria precedes
    proteinuria by years, but the optimal threshold for starting therapy - at the
    hematuria-only stage versus at proteinuria onset - is not established, leaving a
    key preventive window uncertain.
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Angiotensin-converting enzyme inhibitor or angiotensin receptor blocker to delay onset of ESKD"
    explanation: >
      GeneReviews endorses RAAS blockade to delay ESKD but does not resolve the
      optimal initiation threshold relative to the microhematuria-to-proteinuria
      transition.
  proposed_experiments:
  - experiment_id: exp_alport_early_raas_rct
    name: Early versus proteinuria-triggered RAAS blockade trial
    description: >
      Randomize children/young adults with genetically confirmed Alport syndrome and
      microhematuria but no proteinuria to early RAAS blockade versus initiation at
      proteinuria onset, with ESKD-free survival and eGFR slope as endpoints, to
      define the optimal treatment window.
    experiment_type:
      preferred_term: randomized controlled trial

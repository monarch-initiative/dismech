- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    Beyond the three classic Mendelian modes, a subset of Alport syndrome shows
    digenic inheritance, with pathogenic variants in two collagen IV genes
    (COL4A3 plus COL4A4, or COL4A5 together with COL4A3/COL4A4). Incomplete
    penetrance and wide phenotypic variability motivated the digenic model.
  evidence:
  - reference: PMID:25575550
    reference_title: "Evidence of digenic inheritance in Alport syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using massively parallel sequencing, we identified 11 patients who had pathogenic
      mutations in two collagen IV genes. ... This pedigree analysis provides evidence
      for digenic inheritance of Alport syndrome.
    explanation: >-
      Segregation analysis across 56 individuals from 11 probands with pathogenic
      mutations in two collagen IV genes provides direct pedigree evidence for digenic
      inheritance, establishing it as an additional genetic model beyond the classic
      Mendelian modes.
pathophysiology:
- name: Defective Type IV Collagen Network
  description: >
    Mutations in COL4A3, COL4A4, or COL4A5 disrupt the alpha3-alpha4-alpha5(IV) collagen
    network, which is the predominant collagen IV isoform in the mature glomerular
    basement
    membrane, cochlea, and lens capsule. The defective network is replaced by the
    embryonic alpha1-alpha1-alpha2(IV) network, which is more susceptible to proteolytic
    degradation and cannot maintain normal structural integrity.
  cell_types:

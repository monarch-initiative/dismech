- accession: geo:GSE281080
  title: Transcriptomic profiling of prolonged-culture iPSC-derived kidney organoids and X-linked Alport syndrome organoid models carrying COL4A5 deep-intronic variants
  description: Kidney organoids serve as an invaluable platform for modeling hereditary renal diseases and developing therapeutic interventions. While various kidney organoid differentiation protocols have been developed, the protocol introduced by Morizane et al. was among the first to generate kidney organoids from induced pluripotent stem cells (iPSCs). By using a modified version of this protocol, we successfully generated kidney organoids in 21 days. Most studies on kidney organoids focus on early stages, typically between days 21 and 29, leaving the gene expression dynamics during prolonged culture less explored.
  organism:

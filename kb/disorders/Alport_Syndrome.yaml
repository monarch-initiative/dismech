- accession: geo:GSE274298
  title: 'SMPDL3b in Podocytes: Decoupling Proteinuria from CKD Progression in Experimental Alport Syndrome'
  description: Alport Syndrome (AS) is a rare genetic disease with impaired production of collagen type IV alpha 3, 4 and 5 chains in the glomerular basement membranes (GBM), which results amongst others in progressive loss of kidney function. In AS, abnormalities in the GBM and associated podocyte detachment may potentially result from the dysregulation of sphingolipid metabolism. Here we investigated whether renal sphingomyelin phosphodiesterase acid-like 3b (SMPDL3b) overexpression modulates the generation of sphingosine-1-phosphate (S1P) and contributes to renal failure in Col4a3 knockout mice, a mouse model of AS.

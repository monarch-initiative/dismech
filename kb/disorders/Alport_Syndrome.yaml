  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in those with deletions of COL4A5 extending into intron 2 of COL4A6, surgical intervention for symptomatic leiomyomas as needed"
    explanation: >
      GeneReviews documents symptomatic leiomyomas in the COL4A5-COL4A6
      contiguous-deletion subtype - the basis for the diffuse-leiomyomatosis

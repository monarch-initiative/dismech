  description: Total RNA was extracted from glomeruli as described above. RNA quality and quantity were determined by the 2100 Bioanalyzer. RT2 Profiler PCR Array (QIAGEN) is the method used for qPCR assay. This technique takes advantage of real-time PCR performance and combines it with the ability of microarrays to detect the expression of many genes related to UPR pathway simultaneously. Total RNA that was purified from glomeruli which were extracted from mutant and wild type kidneys was measured and then converted into first strand cDNA. qPCR was followed by using the instrument-specific and ready-to-use RT2 qPCR Master Mixes and gene specific primer sets.

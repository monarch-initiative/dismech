  - reference: PMID:39384359
    reference_title: "Pathological diagnosis of Alport syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the progression of the disease, glomerular capillary loops become irregularly thick, and segmental or global glomerulosclerosis occurs."
    explanation: >
      Human renal-biopsy pathology observation that secondary segmental (and
      global) glomerulosclerosis develops as Alport syndrome progresses, adding
      human evidence alongside the mouse model.
- category: Renal
  name: GBM Lamellation
  description: >
    Characteristic ultrastructural finding on electron microscopy showing thickening,
    thinning, splitting, and basket-weave lamellation of the glomerular basement membrane.
    This is the hallmark histopathologic feature of Alport syndrome.
  phenotype_term:
    preferred_term: Glomerular basement membrane lamellation
    term:
      id: HP:0030034
      label: Glomerular basement membrane lamellation
  evidence:
  - reference: PMID:34029143
    reference_title: "Synaptopodin deficiency exacerbates kidney disease in a mouse model of Alport syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >
      We used collagen type IV-α5 (Col4a5) mutant mice, which model X-linked AS,
      showing glomerular basement membrane (GBM) abnormalities, eventual foot process
      effacement, and progression to end-stage kidney disease.
    explanation: >
      Mouse model of X-linked Alport syndrome shows GBM abnormalities consistent with
      the lamellation and structural changes seen in human disease.
  - reference: PMID:39384359
    reference_title: "Pathological diagnosis of Alport syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In severe cases, so-called “basket weaving” occurs. The podocytes show various degrees of foot process effacement."
    explanation: >
      Human renal-biopsy pathology observation: as Alport syndrome progresses on
      electron microscopy, GBM irregularity increases with lamellation, splitting,
      and scalloping of the lamina densa, culminating in basket-weave lamellation
      with foot process effacement - the human histopathologic finding this
      phenotype asserts, adding human evidence alongside the mouse model.
- category: Hearing
  name: Sensorineural Hearing Loss
  description: >
    Bilateral high-frequency sensorineural hearing loss, typically developing in late
    childhood to adolescence. More common and severe in X-linked males. Not present
    at birth but progressive, eventually affecting conversational frequencies.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
    clinical_course: PROGRESSIVE

discussions:
- discussion_id: no_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying therapy for KIF5C-related complex cortical
    dysplasia, or is management entirely supportive?
  rationale: >-
    The malformation is established prenatally through disrupted neuronal
    migration, and no treatment targets the kinesin motor defect; published
    management is limited to antiseizure medication and developmental therapy.

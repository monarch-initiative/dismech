    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29048727
      reference_title: "Mutations of KIF5C cause a neurodevelopmental disorder of infantile-onset epilepsy, absent language, and distinctive malformations of cortical development."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "identified a de novo heterozygous mutation in KIF5C (NM_004522.2, c. 709G>A, p.Glu237Lys)"
      explanation: Reports the recurrent de novo p.Glu237Lys variant in an affected individual.
  - name: p.Glu237Val
    description: >-
      Motor-domain missense variant (c.710A>T) in the original family, present in
      the affected children through maternal germline mosaicism; located in the
      microtubule-interacting domain.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:23603762
      reference_title: Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly.
      supports: SUPPORT

name: Complex Cortical Dysplasia With Other Brain Malformations 2
creation_date: "2026-11-03T06:00:00Z"
category: Mendelian
disease_term:
  preferred_term: complex cortical dysplasia with other brain malformations 2
  term:
    id: MONDO:0014116
    label: complex cortical dysplasia with other brain malformations 2
synonyms:
- CDCBM2
- KIF5C complex cortical dysplasia with other brain malformations
- complex cortical dysplasia with other brain malformations caused by mutation in KIF5C
- KIF5C-related neurodevelopmental disorder
description: >-
  A malformation of cortical development caused by de novo heterozygous variants
  in KIF5C, which encodes a neuronal kinesin-1 heavy chain that powers
  ATP-dependent, microtubule-based anterograde transport. Pathogenic variants
  cluster at the motor-domain residue Glu237, abolish the motor's ATPase
  activity and are thought to act by a dominant-negative mechanism; the
  resulting transport failure perturbs neuronal migration during corticogenesis.
  Affected individuals have a distinctive, often frontal-predominant cortical
  dysplasia/dysgyria (with pachygyria), variable microcephaly, infantile-onset
  epilepsy, hypotonia, severe developmental delay with absent language, and
  behavioral problems.

references:
- reference: PMID:29048727
  title: "Mutations of KIF5C cause a neurodevelopmental disorder of infantile-onset epilepsy, absent language, and distinctive malformations of cortical development."

inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The disorder arises from heterozygous KIF5C variants that are typically de
    novo. In the original family the variant was present only in the four
    affected children through maternal germline mosaicism, so recurrence risk is
    raised above the de novo baseline when a parent is a germline mosaic.
  evidence:
  - reference: PMID:23603762
    reference_title: Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as a single germline mosaic mutation in KIF5C, in subjects with MCD"
    explanation: Reports the KIF5C mutation transmitted through maternal germline mosaicism in the index family.

genetic:
- name: KIF5C
  gene_term:
    preferred_term: KIF5C
    term:
      id: hgnc:6325
      label: KIF5C
  variant_origin: GERMLINE
  notes: >-
    De novo heterozygous missense variants in KIF5C, a neuron-enriched kinesin-1
    heavy chain, cause the disorder. The reported variants cluster at motor-domain
    residue Glu237 (five of six reported individuals), act by a proposed
    dominant-negative mechanism, and are typically de novo (with maternal germline
    mosaicism in the index family). ClinGen's Brain Malformations GCEP rates the
    KIF5C-CDCBM2 relationship Moderate (AD), so relationship_type is left unset
    rather than asserting CAUSATIVE, which the schema reserves for Definitive or
    Strong validity.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_c22eb3e1-4a72-480f-a360-20788fe1d9cd-2022-01-25T170000.000Z
    evidence:
    - reference: CGGV:assertion_c22eb3e1-4a72-480f-a360-20788fe1d9cd-2022-01-25T170000.000Z
      reference_title: KIF5C / complex cortical dysplasia with other brain malformations 2 (Moderate)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "KIF5C | HGNC:6325 | complex cortical dysplasia with other brain malformations 2 | MONDO:0014116 | AD | Moderate"
      explanation: ClinGen Brain Malformations GCEP classifies the KIF5C-CDCBM2 relationship as Moderate (autosomal dominant).
  variants:
  - name: p.Glu237Lys
    description: >-
      Recurrent de novo motor-domain missense variant (c.709G>A), reported in
      four of the six published individuals; the most frequent KIF5C allele in

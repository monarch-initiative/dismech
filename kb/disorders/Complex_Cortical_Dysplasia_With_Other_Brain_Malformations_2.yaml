    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "five out of the six identified individuals have mutations affecting amino acid Glu237"
    explanation: Establishes the Glu237 motor-domain mutational hotspot across reported cases.

pathophysiology:
- name: KIF5C Kinesin-1 Motor Loss of Function
  biological_scale: MOLECULAR
  description: >-
    De novo motor-domain missense variants (clustering at Glu237) abolish the
    ATP-dependent microtubule motor activity of the KIF5C kinesin-1 heavy chain.
    The mutant protein still assembles with wild-type chains, so it is thought to
    titrate out the normal isoform and act by a dominant-negative mechanism.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: KIF5C
    term:
      id: hgnc:6325
      label: KIF5C
  molecular_functions:
  - preferred_term: microtubule motor activity
    term:
      id: GO:0003777
      label: microtubule motor activity
    modifier: DECREASED
  downstream:
  - target: Impaired Neuronal Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23603762
    reference_title: Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we found a complete absence of measurable hydrolysis in the case of the mutant protein"
    explanation: A microtubule-dependent ATPase assay shows the mutant KIF5C motor domain has abolished ATP hydrolysis.
  - reference: PMID:23603762
    reference_title: Mutations in TUBG1, DYNC1H1, KIF5C and KIF2A cause malformations of cortical development and microcephaly.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "the mutant KIF5C could titrate out the wild type isoform and act via a dominant negative effect"
    explanation: Proposes the dominant-negative mechanism from the expression and co-assembly data.
- name: Impaired Neuronal Migration
  biological_scale: CELLULAR
  description: >-
    Loss of kinesin-1 motor activity disrupts microtubule-based anterograde
    transport in developing neurons, perturbing the postmitotic neuronal
    migration that builds the cortical plate.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

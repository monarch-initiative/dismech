name: WWOX-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T19:10:00Z"
category: Mendelian
synonyms:
- WOREE syndrome
- WWOX-related epileptic encephalopathy
- Developmental and epileptic encephalopathy 28
- DEE28
- EIEE28
description: >-
  WWOX-related developmental and epileptic encephalopathy (WOREE syndrome, DEE28)
  is an autosomal recessive developmental and epileptic encephalopathy caused by
  biallelic loss-of-function variants in WWOX, which encodes a WW-domain-containing
  oxidoreductase acting as a multi-partner scaffold protein. Seizures begin in the
  first weeks to months of life and are drug-resistant; affected children acquire
  neither language nor independent walking, and mortality in early childhood is
  high. WWOX loss acts through several separable routes - dysregulated Wnt/GSK-3beta
  signalling, failure of oligodendrocyte maturation with CNS hypomyelination, and a
  cortical excitation-inhibition imbalance measured directly in neuronal-deletion
  mice - which converge on network hyperexcitability. Genotype is the dominant
  prognostic axis: biallelic null variants carry significantly lower survival
  probability than genotypes containing a presumed hypomorphic missense allele, and
  the milder allelic disorder SCAR12 sits at the missense end of the same spectrum.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 28
  term:
    id: MONDO:0014533
    label: developmental and epileptic encephalopathy, 28
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both syndromes on the WWOX allelic spectrum - WOREE/DEE28 and SCAR12 - require
    biallelic pathogenic variants. Heterozygous carriers are unaffected, and WWOX is
    not haploinsufficient.
  evidence:
  - reference: PMID:33916893
    reference_title: "Neurological Disorders Associated with WWOX Germline Mutations-A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients harboring pathogenic germline bi-allelic WWOX variants have been described with the rare devastating neurological syndromes autosomal recessive spinocerebellar ataxia 12 (SCAR12) (6 patients) and WWOX-related epileptic encephalopathy (DEE28 or WOREE syndrome) (56 patients)."
    explanation: >-
      States the biallelic requirement and names both disorders on the allelic
      spectrum, with the published case counts.

pathophysiology:
- name: Biallelic WWOX Loss-of-Function Lesion
  biological_scale: MOLECULAR
  description: >-
    Two pathogenic WWOX alleles are present - homozygous or compound heterozygous -
    spanning nonsense, frameshift, splice-site, missense and copy-number variants.
    This node records the lesion only; the genotype class it falls into is modelled
    separately, because that is what the outcome data stratify on.
  evidence:
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two copy-number variations (CNVs) or two single-nucleotide variations (SNVs) were found respectively in four and nine families, with compound heterozygosity for one SNV and one CNV in five families."
    explanation: >-
      Documents the biallelic requirement and the mixed SNV/CNV allele architecture
      in the largest published cohort.
  - reference: PMID:24456803
    reference_title: "The supposed tumor suppressor gene WWOX is mutated in an early lethal microcephaly syndrome with epilepsy, growth retardation and retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous WWOX nonsense mutation, p.Arg54*, in a girl from a consanguineous family with a severe syndrome of growth retardation, microcephaly, epileptic seizures, retinopathy and early death"
    explanation: >-
      The index observation establishing biallelic WWOX loss as the cause of this
      lethal recessive syndrome.
  downstream:
  - target: Loss of WWOX Scaffold Function
    causal_link_type: DIRECT
    description: >-
      Both alleles fail, so no functional WWOX protein is available to its partners.

- name: Loss of WWOX Scaffold Function
  biological_scale: MOLECULAR
  description: >-
    WWOX is a 46 kDa adaptor carrying two N-terminal WW domains and a C-terminal
    short-chain dehydrogenase/reductase domain. The WW domains bind PPxY-motif
    partners, so the protein acts as a hub rather than through a single catalytic
    output - its own substrate is still unknown. Loss of the hub is what propagates
    into the separate signalling arms below.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:39507621
    reference_title: "Case report: Adult patient with WWOX developmental and epileptic encephalopathy: 40 years of observation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This protein contains two N-terminal WW domains (referred to as WW1 and WW2) and a catalytic domain in the C-terminus, which is homologous to short-chain dehydrogenase/reductase (SDR) family proteins, although the substrate of WWOX is currently unknown."
    explanation: >-
      Gives the domain architecture and states explicitly that the catalytic
      substrate is unknown, which is why this node is scoped to scaffold function.
  downstream:
  - target: Wnt/GSK-3beta Signalling Dysregulation
    causal_link_type: DIRECT
    description: >-
      Loss of the WWOX hub releases GSK-3beta from normal restraint.
  - target: Hyal-2/WWOX/Smad4 Complex Failure
    causal_link_type: DIRECT
    description: >-
      WWOX is the bridge subunit of this complex, so its loss prevents assembly.
  - target: Impaired Oligodendrocyte Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuronal WWOX loss lowers myelination-gene transcript levels; the steps between
      the scaffold and that transcriptional change are not established.
  - target: Disrupted Cortical Neuronal Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Developmental malformations follow WWOX loss, but no single signalling arm has
      been shown to account for them.

- name: Wnt/GSK-3beta Signalling Dysregulation
  biological_scale: MOLECULAR
  description: >-
    WWOX loss produces significantly increased activation of glycogen synthase kinase
    3beta across cerebral cortex, hippocampus and cerebellum in Wwox-null mice. This
    arm is separated from the others because it carries its own pharmacological test:
    inhibiting GSK-3beta with lithium abolishes induced seizures in these animals.
  biological_processes:
  - preferred_term: Wnt signaling pathway
    term:
      id: GO:0016055
      label: Wnt signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:32000863
    reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of GSK3β by lithium ion significantly abolishes the onset of PTZ-induced seizure in Wwox-/- mice."
    explanation: >-
      The pharmacological result that makes this a causal arm for seizures rather
      than a correlated biochemical change.
  downstream:
  - target: Neocortical Network Hypersynchrony
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      GSK-3beta inhibition suppresses induced seizures, placing this arm upstream of
      network-level hyperexcitability; the intervening steps are not mapped.

- name: Hyal-2/WWOX/Smad4 Complex Failure
  biological_scale: MOLECULAR
  description: >-
    In a non-canonical TGF-beta route, hyaluronan-bound membrane hyaluronidase Hyal-2
    recruits WWOX and Smad4 into a complex that relocates to the nucleus. WWOX is the
    bridge that binds both partners, so in its absence Smad relocation fails. Curated
    as a distinct arm because it is a transcriptional-signalling defect, not a
    synaptic or myelin one.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:27845895
    reference_title: "Hyaluronan activates Hyal-2/WWOX/Smad4 signaling and causes bubbling cell death when the signaling complex is overexpressed."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In WWOX-deficient cells, HA failed to induce Smad2/3/4 relocation to the nucleus."
    explanation: >-
      The direct loss-of-function measurement for this arm: without WWOX the
      signalling complex does not reach the nucleus.

- name: Impaired Oligodendrocyte Maturation
  biological_scale: CELLULAR
  description: >-
    Oligodendrocyte precursors fail to mature into myelinating oligodendrocytes, with
    a measured fall in myelination-gene transcripts. Kept separate from the
    hypomyelination it produces, because the cellular differentiation failure and the
    tissue-level myelin deficit are distinct measurements.
  cell_types:
  - preferred_term: oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:33914858
    reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A significant decrease in transcript levels of genes involved in myelination was observed in mouse cortex and hippocampus."
    explanation: >-
      The transcriptional measurement upstream of the cellular maturation failure.
  downstream:
  - target: CNS Hypomyelination
    causal_link_type: DIRECT
    description: >-
      Fewer mature oligodendrocytes produce less myelin.

- name: CNS Hypomyelination
  biological_scale: TISSUE
  description: >-
    Reduced myelinated axon content in the central nervous system. Whether this arm
    contributes causally to the seizures, as opposed to running in parallel with
    them, is an open question recorded in the discussions.
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:33914858
    reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wwox-mutant mice exhibited reduced maturation of oligodendrocytes, reduced myelinated axons and impaired axonal conductivity."
    explanation: >-
      Reports the myelin deficit and the conduction consequence in the same
      neuronal-deletion model.
  - reference: PMID:33914858
    reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Brain hyperexcitability and hypomyelination were also revealed in human brain organoids with a WWOX deletion."
    explanation: >-
      Confirms the myelin phenotype at the human gene dose, not only in mouse.
  downstream:
  - target: Impaired Axonal Conductivity
    causal_link_type: DIRECT
    description: >-
      Reduced myelin slows and degrades axonal conduction.

- name: Impaired Axonal Conductivity
  biological_scale: TISSUE
  description: >-
    Axonal conduction is measurably impaired in neuronal Wwox-deletion mice. Recorded
    as its own node because it is the functional consequence of hypomyelination and
    the point at which the myelin arm could in principle act on network behaviour.
  evidence:
  - reference: PMID:33914858
    reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Wwox-mutant mice exhibited reduced maturation of oligodendrocytes, reduced myelinated axons and impaired axonal conductivity."
    explanation: >-
      The conduction measurement itself.

- name: Disrupted Cortical Neuronal Migration
  biological_scale: TISSUE
  description: >-
    A developmental arm separate from the synaptic and myelin arms: Wwox-null mice
    show neuronal disorganisation and heterotopia, incomplete separation of the
    cerebral hemispheres, and defective cerebellar midline fusion.
  biological_processes:
  - preferred_term: hippocampus development
    term:
      id: GO:0021766
      label: hippocampus development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32000863
    reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cerebral malformations, such as microcephaly and incomplete separation of the hemispheres by a partial interhemispheric fissure, neuronal disorganization and heterotopia, and defective cerebellar midline fusion are observed in Wwox-/- mice."
    explanation: >-
      Documents the migration and midline patterning defects that make this a
      developmental rather than purely functional arm.
  downstream:
  - target: Profound Developmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Malformed cortex plausibly contributes to the developmental phenotype, which
      the seizure burden also drives independently.

- name: Increased Excitatory Synaptic Drive
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    Layer II/III pyramidal neurons show elevated excitatory postsynaptic current
    amplitude. Curated separately from the inhibitory change because the two were
    measured separately and move in opposite directions - collapsing them into one
    "E/I imbalance" node would discard which side actually changed.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  evidence:
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In layer II/III pyramidal neurons, Wwox knockout mice demonstrated elevated amplitude of excitatory post-synaptic currents, whereas the frequency and amplitude of inhibitory post-synaptic currents were reduced, as compared to heterozygote and wild-type littermate controls."
    explanation: >-
      Reports the excitatory amplitude increase, against littermate controls.
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
    description: >-
      More excitatory drive shifts the cortical balance toward excitation.

- name: Reduced Inhibitory Synaptic Drive
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    The same layer II/III recordings show reduced frequency and amplitude of
    inhibitory postsynaptic currents - a loss of inhibition running alongside, and
    independent of, the gain in excitation.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  evidence:
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In layer II/III pyramidal neurons, Wwox knockout mice demonstrated elevated amplitude of excitatory post-synaptic currents, whereas the frequency and amplitude of inhibitory post-synaptic currents were reduced, as compared to heterozygote and wild-type littermate controls."
    explanation: >-
      The same recording reports the inhibitory reduction; it is quoted on both nodes
      because it is one measurement supporting two separable claims.
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
    description: >-
      Less inhibitory drive shifts the same balance from the other side.

- name: Intrinsic Neuronal Hyperexcitability
  biological_scale: CELLULAR
  description: >-
    Beyond synaptic drive, the neurons themselves are altered: depolarised resting
    membrane potential, increased action-potential frequency, increased sag current
    and post-inhibitory rebound. This is a membrane-property change, not a synaptic
    one, so it is a third independent contributor rather than part of the E/I node.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  evidence:
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, these neurons were depolarized and demonstrated increased action potential frequency, sag current, and post-inhibitory rebound."
    explanation: >-
      The intrinsic membrane measurements, distinct from the synaptic currents above.
  downstream:
  - target: Neocortical Network Hypersynchrony
    causal_link_type: DIRECT
    description: >-
      More excitable neurons fire more readily into the network.

- name: Cortical Excitation-Inhibition Imbalance
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >-
    The net shift of neocortical circuits toward excitation, produced by the
    independent gain in excitatory drive and loss of inhibitory drive above.
  evidence:
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings suggest WWOX plays an essential role in balancing neocortical excitability and provide insight towards developing therapeutics for those suffering from WWOX disorders."
    explanation: >-
      The authors' own statement of the balance role this node represents.
  downstream:
  - target: Neocortical Network Hypersynchrony
    causal_link_type: DIRECT
    description: >-
      An excitation-shifted cortex supports synchronous bursting.

- name: Neocortical Network Hypersynchrony
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Spontaneous bursting appears in neocortical but not hippocampal slices, is NMDA
    receptor- and gap-junction-dependent, and propagates from layer II/III to layer V
    - so the neocortex, and specifically its superficial layers, is the driver.
  evidence:
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "identified spontaneous bursting activity in the neocortex, a marker of the underlying network hyperexcitability"
    explanation: >-
      The network-level measurement this node records.
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These bursts were NMDAR and gap junction dependent."
    explanation: >-
      Identifies the pharmacological dependencies of the bursting, which constrain
      which mechanisms can be generating it.
  downstream:
  - target: Early-Onset Drug-Resistant Seizures
    causal_link_type: DIRECT
    description: >-
      Hypersynchronous cortical networks generate clinical seizures.

- name: Early-Onset Drug-Resistant Seizures
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Multiple seizure types begin within the first weeks to months of life - most
    often focal seizures, epileptic spasms and tonic seizures - and respond poorly to
    antiseizure medication.
  evidence:
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most frequent being focal (85%), epileptic spasms (77%), and tonic seizures (69%)"
    explanation: >-
      Gives the seizure-type distribution, each patient having multiple types.
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review suggests WOREE syndrome is a very severe epileptic encephalopathy characterized by absence of language development and acquisition of walking, early-onset drug-resistant seizures, ophthalmological involvement, and a high likelihood of premature death."
    explanation: >-
      Establishes early onset and drug resistance as defining features.
  downstream:
  - target: Profound Developmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Continuous early-life seizure burden plausibly compounds the developmental
      phenotype that the malformation arm already produces.

- name: Progressive Cerebral and Optic Atrophy
  biological_scale: TISSUE
  description: >-
    A degenerative arm distinct from the malformation arm: severe frontotemporal,
    hippocampal and optic atrophy with thin corpus callosum and white matter signal
    change on patient MRI, mirrored in mice by optic nerve atrophy, Purkinje cell
    loss and cerebellar granule cell apoptosis.
  biological_processes:
  - preferred_term: regulation of neuron apoptotic process
    term:
      id: GO:0043523
      label: regulation of neuron apoptotic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRIs revealed severe frontotemporal, hippocampal, and optic atrophy, thin corpus callosum, and white matter signal abnormalities."
    explanation: >-
      The human imaging evidence for the degenerative arm.
  - reference: PMID:32000863
    reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Degenerative alterations including severe hypomyelination in the central nervous system, optic nerve atrophy, Purkinje cell loss and granular cell apoptosis in the cerebellum"
    explanation: >-
      The corresponding cellular degeneration in the mouse, which the human MRI
      cannot resolve.

- name: Profound Developmental Impairment
  biological_scale: ORGANISM
  description: >-
    Affected children acquire neither language nor independent walking. Two upstream
    routes converge here - the developmental malformation arm and the seizure burden
    - and the published data do not separate their contributions.
  evidence:
  - reference: PMID:33916893
    reference_title: "Neurological Disorders Associated with WWOX Germline Mutations-A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most common clinical symptoms being severe epileptic encephalopathy and profound global developmental delay"
    explanation: >-
      Names the developmental phenotype as one of the two most common features.

- name: Genotype-Stratified Mortality Risk
  biological_scale: ORGANISM
  description: >-
    Survival tracks genotype class rather than any single clinical feature: biallelic
    null genotypes have significantly lower survival probability than genotypes
    carrying at least one presumed hypomorphic missense allele. This is the entry's
    best-quantified genotype-phenotype claim and the reason the lesion node and the
    genotype class are modelled separately.
  evidence:
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with biallelic null WWOX pathogenic variants have significantly lower survival probability compared to those carrying at least one presumed hypomorphic missense pathogenic variant"
    explanation: >-
      The survival comparison by genotype class, from a formal survival analysis.
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe clinical presentation seems to be associated with null genotypes."
    explanation: >-
      An independent cohort reaching the same genotype-severity conclusion, in
      deliberately hedged language.


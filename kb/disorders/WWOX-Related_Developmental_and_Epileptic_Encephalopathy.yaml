genetic:
- name: WWOX
  gene_term:
    preferred_term: WWOX
    term:
      id: hgnc:12799
      label: WWOX
  relationship_type: CAUSATIVE
  association: >-
    Biallelic germline loss-of-function variants in WWOX cause WOREE syndrome
    (DEE28); the same gene causes the milder allelic disorder SCAR12.
  notes: >-
    WWOX encodes a 46 kDa, 414-amino-acid adaptor with two N-terminal WW domains and
    a C-terminal short-chain dehydrogenase/reductase domain whose substrate is
    unknown, so the protein is curated here as a scaffold rather than by a catalytic
    output. Pathogenic alleles span nonsense, frameshift, splice-site, missense and
    copy-number changes, and compound heterozygosity for one SNV plus one CNV is
    common enough that CNV-capable testing matters diagnostically. Genotype class is
    the dominant prognostic variable: biallelic null genotypes carry significantly
    lower survival probability than genotypes containing a presumed hypomorphic
    missense allele, and missense-predominant genotypes sit at the SCAR12 end of the
    spectrum. Note the deliberate limit of that claim - the cited sources support a
    survival *difference* between genotype classes, and this entry does not assert the
    stronger version sometimes stated in review summaries, that premature death has
    never occurred with a missense-only genotype, because that sentence could not be
    verified against either source abstract.
  evidence:
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two copy-number variations (CNVs) or two single-nucleotide variations (SNVs) were found respectively in four and nine families, with compound heterozygosity for one SNV and one CNV in five families."
    explanation: >-
      Documents the allele architecture, including the SNV/CNV compound genotypes
      that drive the testing recommendation.
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants were located throughout WWOX and comprised both missense and null changes including five copy number variants (four deletions, one duplication)."
    explanation: >-
      Confirms that variants are distributed across the gene rather than clustered in
      a hotspot, and that CNVs are a substantial fraction.
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four missense variations were recurrent: p.(Gln230Pro) was found in four families, p.(Gly137Glu) in three families"
    explanation: >-
      Records the recurrent missense alleles. Note this sits alongside, and does not
      contradict, the statement above that variants are distributed throughout the
      gene - recurrence here reflects a handful of repeated alleles rather than a
      mutational hotspot.

animal_models:
- name: Wwox-null mouse (germline knockout)
  species: Mouse
  genotype: Wwox-/- germline knockout
  publication: PMID:32000863
  description: >-
    Constitutive whole-animal Wwox knockout. Supplies the developmental-malformation
    and neurodegeneration arms of this entry, and the only pharmacological test of a
    druggable node in the pathograph.
  modeled_mechanisms:
  - target: Disrupted Cortical Neuronal Migration
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the malformation arm - heterotopia, disordered neurons, incomplete
      hemispheric separation and defective cerebellar midline fusion.
    limitations: >-
      A constitutive whole-animal null removes WWOX from every expressing cell at
      once, so it cannot separate a neuronal-autonomous migration defect from a
      non-cell-autonomous one; the neuronal conditional model below exists for that
      reason. The malformations are also more severe than the nonspecific imaging
      findings usual in patients.
    readouts:
    - name: Cortical architecture and midline fusion
      target: Disrupted Cortical Neuronal Migration
      direction: ALTERED
      interpretation: >-
        Heterotopia, neuronal disorganisation and defective cerebellar midline fusion.
      evidence:
      - reference: PMID:32000863
        reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cerebral malformations, such as microcephaly and incomplete separation of the hemispheres by a partial interhemispheric fissure, neuronal disorganization and heterotopia, and defective cerebellar midline fusion are observed in Wwox-/- mice."
        explanation: Reports the structural measurements behind this readout.
    evidence:
    - reference: PMID:32000863
      reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report that targeted disruption of Wwox gene in mice causes neurodevelopmental disorders, encompassing abnormal neuronal differentiation and migration in the brain."
      explanation: >-
        Establishes the model as informative for the migration node.
  - target: Wnt/GSK-3beta Signalling Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The only node in this pathograph with a pharmacological intervention attached:
      GSK-3beta activation rises, and inhibiting it with lithium abolishes induced
      seizures.
    limitations: >-
      The rescue was measured against pentylenetetrazol-*induced* seizures, not the
      spontaneous seizures that define the human disease, so it establishes that this
      arm can gate seizure threshold rather than that it drives the clinical epilepsy.
      Lithium is also not a selective GSK-3beta inhibitor.
    readouts:
    - name: GSK-3beta activation in brain
      target: Wnt/GSK-3beta Signalling Dysregulation
      direction: INCREASED
      interpretation: >-
        GSK-3beta activation is significantly increased across cortex, hippocampus and
        cerebellum.
      evidence:
      - reference: PMID:32000863
        reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We determined that a significantly increased activation of glycogen synthase kinase 3β (GSK3β) occurs in Wwox-/- mouse cerebral cortex, hippocampus and cerebellum."
        explanation: The biochemical measurement behind this readout.
    - name: Induced-seizure onset after GSK-3beta inhibition
      target: Wnt/GSK-3beta Signalling Dysregulation
      direction: ABOLISHED
      interpretation: >-
        Lithium abolishes the onset of PTZ-induced seizures in Wwox-null mice.
      evidence:
      - reference: PMID:32000863
        reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Inhibition of GSK3β by lithium ion significantly abolishes the onset of PTZ-induced seizure in Wwox-/- mice."
        explanation: The rescue measurement behind this readout.
    evidence:
    - reference: PMID:32000863
      reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, our findings reveal that the neurodevelopmental and neurodegenerative deficits in Wwox knockout mice strikingly recapitulate the key features of human neuropathies, and that targeting GSK3β with lithium ion ameliorates epilepsy."
      explanation: >-
        The authors' own claim that this model is informative for the human disease
        and for the GSK-3beta arm specifically.
  - target: Progressive Cerebral and Optic Atrophy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies the cellular resolution the human MRI cannot - Purkinje cell loss,
      granule cell apoptosis and optic nerve atrophy.
    limitations: >-
      Mouse degeneration is compressed into the two to three weeks before postnatal
      death, whereas the human atrophy is documented over years, so the time course is
      not comparable even where the endpoints are.
    readouts:
    - name: Cerebellar and optic nerve degeneration
      target: Progressive Cerebral and Optic Atrophy
      direction: INCREASED
      interpretation: >-
        Purkinje cell loss, granule cell apoptosis and optic nerve atrophy.
      evidence:
      - reference: PMID:32000863
        reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Degenerative alterations including severe hypomyelination in the central nervous system, optic nerve atrophy, Purkinje cell loss and granular cell apoptosis in the cerebellum"
        explanation: The histological measurements behind this readout.

- name: Synapsin-Cre neuronal conditional Wwox knockout mouse
  species: Mouse
  genotype: Synapsin I-Cre driven neuronal Wwox deletion
  publication: PMID:33914858
  description: >-
    Deletes Wwox from neurons only. This is the model that isolates the
    neuron-autonomous contribution, and the one that produced the direct
    electrophysiological measurements of excitability in this entry.
  modeled_mechanisms:
  - target: Impaired Oligodendrocyte Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes the striking part of the myelin arm - deleting Wwox from *neurons*
      is sufficient to impair oligodendrocyte maturation, so the myelin defect is
      non-cell-autonomous.
    limitations: >-
      The intermediate signal from neuron to oligodendrocyte is not identified, so the
      link is established as a dependency rather than a mechanism.
    readouts:
    - name: Oligodendrocyte maturation and myelinated axon content
      target: Impaired Oligodendrocyte Maturation
      direction: DECREASED
      interpretation: >-
        Reduced oligodendrocyte maturation and fewer myelinated axons after
        neuron-restricted deletion.
      evidence:
      - reference: PMID:33914858
        reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Wwox-mutant mice exhibited reduced maturation of oligodendrocytes, reduced myelinated axons and impaired axonal conductivity."
        explanation: The cellular and structural measurements behind this readout.
    evidence:
    - reference: PMID:33914858
      reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "specific neuronal deletion of murine Wwox produces phenotypes typical of the Wwox-null mutation leading to brain hyperexcitability, intractable epilepsy, ataxia and postnatal lethality"
      explanation: >-
        Establishes that the neuronal-only deletion reproduces the null phenotype,
        which is what makes this model informative.
  - target: Increased Excitatory Synaptic Drive
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies the direct synaptic measurement for the excitatory side of the
      imbalance.
    limitations: >-
      Recordings are from acute slices at postnatal days 13-17, so they capture an
      early developmental window rather than the established chronic epilepsy, and an
      isolated slice cannot report network behaviour in the intact brain.
    readouts:
    - name: Excitatory postsynaptic current amplitude in layer II/III pyramidal neurons
      target: Increased Excitatory Synaptic Drive
      direction: INCREASED
      interpretation: >-
        EPSC amplitude is elevated relative to heterozygote and wild-type littermates.
      evidence:
      - reference: PMID:34634460
        reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In layer II/III pyramidal neurons, Wwox knockout mice demonstrated elevated amplitude of excitatory post-synaptic currents, whereas the frequency and amplitude of inhibitory post-synaptic currents were reduced, as compared to heterozygote and wild-type littermate controls."
        explanation: The voltage-clamp measurement behind this readout.
  - target: Reduced Inhibitory Synaptic Drive
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies the inhibitory side of the same measurement, which moves in the
      opposite direction and is therefore a separate claim.
    limitations: >-
      Same slice-preparation and developmental-window caveats as the excitatory
      readout; the recordings do not identify which interneuron populations are
      responsible.
    readouts:
    - name: Inhibitory postsynaptic current frequency and amplitude
      target: Reduced Inhibitory Synaptic Drive
      direction: DECREASED
      interpretation: >-
        Both IPSC frequency and amplitude fall relative to littermate controls.
      evidence:
      - reference: PMID:34634460
        reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In layer II/III pyramidal neurons, Wwox knockout mice demonstrated elevated amplitude of excitatory post-synaptic currents, whereas the frequency and amplitude of inhibitory post-synaptic currents were reduced, as compared to heterozygote and wild-type littermate controls."
        explanation: The same recording, quoted for the inhibitory half of the result.
  - target: Neocortical Network Hypersynchrony
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Locates the bursting anatomically - present in neocortical but not hippocampal
      slices - and pharmacologically, as NMDA receptor- and gap-junction-dependent.
    limitations: >-
      This is in vitro network activity in slices, not an in vivo EEG seizure, so it
      is a substrate measurement rather than an ictal recording.
    readouts:
    - name: Spontaneous neocortical bursting
      target: Neocortical Network Hypersynchrony
      direction: INCREASED
      interpretation: >-
        Spontaneous bursting appears in knockout neocortical slices and is absent from
        wild-type controls.
      evidence:
      - reference: PMID:34634460
        reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "identified spontaneous bursting activity in the neocortex, a marker of the underlying network hyperexcitability"
        explanation: The field-potential measurement behind this readout.

- name: AAV9-Synapsin I-WWOX gene replacement in Wwox-null mice
  species: Mouse
  genotype: Wwox-null treated with AAV9-SynI-WWOX by intracerebroventricular injection
  publication: PMID:34747138
  description: >-
    A neonatal gene-replacement experiment rather than a disease model: restoring
    WWOX in neurons alone reverses several arms of the pathograph at once, which is
    the strongest available evidence that they share the same upstream cause.
  modeled_mechanisms:
  - target: Loss of WWOX Scaffold Function
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Neuron-restricted restoration of the missing protein rescues hyperexcitability
      and seizures, myelination deficits, and premature lethality together.
    limitations: >-
      Delivered neonatally into a mouse whose disease has barely begun, whereas
      children are diagnosed after seizure onset; the rescue therefore speaks to
      prevention rather than reversal. Two of the rescued endpoints - hypoglycemia and
      premature lethality at two to four weeks - have no direct counterpart in the
      human course.
    readouts:
    - name: Seizures, myelination and survival after neuronal WWOX restoration
      target: Loss of WWOX Scaffold Function
      direction: RESTORED
      interpretation: >-
        Multiple independent phenotypes revert together after restoring the single
        missing protein in neurons.
      evidence:
      - reference: PMID:34747138
        reference_title: "Neonatal neuronal WWOX gene therapy rescues Wwox null phenotypes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "specific neuronal restoration of WWOX expression rescued brain hyperexcitability and seizures, hypoglycemia, myelination deficits, and the premature lethality and behavioral deficits of Wwox-null mice"
        explanation: The rescue measurements behind this readout.
    evidence:
    - reference: PMID:34747138
      reference_title: "Neonatal neuronal WWOX gene therapy rescues Wwox null phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings provide a proof-of-concept for WWOX gene therapy as a promising approach to curing children with WOREE and SCAR12."
      explanation: >-
        The authors' framing of the experiment as translational proof of concept.

experimental_models:
- name: WWOX-deleted human brain organoid
  experimental_model_type: ORGANOID
  description: >-
    Human brain organoids carrying a WWOX deletion, used here as the human-genetic
    check on two mouse findings.
  modeled_mechanisms:
  - target: CNS Hypomyelination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces both hyperexcitability and hypomyelination at the human gene dose,
      which is what stops the myelin arm resting on mouse data alone.
    limitations: >-
      Organoids lack vasculature, immune cells and long-term maturation, so they
      cannot address the progressive atrophy seen on patient MRI; the reported result
      is also qualitative rather than a quantified myelin measurement.
    readouts:
    - name: Hyperexcitability and myelination in WWOX-deleted organoids
      target: CNS Hypomyelination
      direction: DECREASED
      interpretation: >-
        Hypomyelination, alongside hyperexcitability, in human tissue.
      evidence:
      - reference: PMID:33914858
        reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Brain hyperexcitability and hypomyelination were also revealed in human brain organoids with a WWOX deletion."
        explanation: The organoid measurement behind this readout.
    evidence:
    - reference: PMID:33914858
      reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These findings provide cellular and molecular evidence for myelination defects and hyperexcitability in the WOREE syndrome linked to neuronal function of WWOX."
      explanation: >-
        States the combined mouse-and-organoid conclusion this model contributes to.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Around 56 published WOREE cases and 6 SCAR12 cases as of the 2021 review; the
    largest single cohort aggregates 37 patients from 27 families. No population rate
    has been estimated, so the count is recorded as literature cases rather than
    converted to a rate.
  evidence:
  - reference: PMID:33916893
    reference_title: "Neurological Disorders Associated with WWOX Germline Mutations-A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients harboring pathogenic germline bi-allelic WWOX variants have been described with the rare devastating neurological syndromes autosomal recessive spinocerebellar ataxia 12 (SCAR12) (6 patients) and WWOX-related epileptic encephalopathy (DEE28 or WOREE syndrome) (56 patients)."
    explanation: >-
      The published case counts for both disorders on the allelic spectrum.
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By aggregating our patients with all cases reported in the literature, 37 patients from 27 families with WOREE syndrome are known."
    explanation: >-
      The aggregate cohort size at the time of the largest series.

diagnosis:
- name: Molecular Genetic Testing for Biallelic WWOX Variants
  description: >-
    Diagnosis requires demonstrating two pathogenic WWOX alleles. The testing strategy
    matters more here than in most recessive disorders, because copy-number variants
    account for a large share of alleles and compound SNV-plus-CNV genotypes are
    common - a sequencing-only approach would miss one allele in a substantial
    fraction of families. The original cohort used a combination of dosage,
    array-based and sequencing methods for that reason.
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Different molecular screening approaches were used"
    explanation: >-
      The cohort required several methods rather than one. The full enumeration in the
      source names dosage and array-based approaches alongside sequencing, but it is
      quoted short here because the bracketed abbreviations inside it are stripped
      before snippet matching; the companion evidence item below carries the substance.
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two copy-number variations (CNVs) or two single-nucleotide variations (SNVs) were found respectively in four and nine families, with compound heterozygosity for one SNV and one CNV in five families."
    explanation: >-
      Quantifies why: 9 of 18 families carry at least one CNV, so an SNV-only strategy
      would leave half of them without a complete genotype.

- name: Brain MRI
  description: >-
    Supportive rather than diagnostic. Corpus callosum hypoplasia and progressive
    cerebral atrophy are the usual findings, and the atrophy's progression on serial
    imaging is itself informative about the degenerative arm.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRIs revealed severe frontotemporal, hippocampal, and optic atrophy, thin corpus callosum, and white matter signal abnormalities."
    explanation: >-
      The imaging pattern this modality demonstrates.

- name: Electroencephalography
  description: >-
    EEG characterises the seizure disorder, showing multifocal discharges on a slow
    background with predominance over frontal or temporo-occipital regions.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interictal EEGs demonstrated slow background activity with multifocal discharges, predominantly over frontal or temporo-occipital regions."
    explanation: >-
      The interictal EEG findings.

treatments:
- name: Antiseizure Medication
  description: >-
    Conventional antiseizure medications are the mainstay of symptomatic care but
    control seizures poorly - drug resistance is part of how the syndrome is
    characterised. This entry does not name a preferred agent, because the cited
    cohorts report drug resistance as a class property rather than comparing
    individual drugs.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review suggests WOREE syndrome is a very severe epileptic encephalopathy characterized by absence of language development and acquisition of walking, early-onset drug-resistant seizures, ophthalmological involvement, and a high likelihood of premature death."
    explanation: >-
      Drug resistance is named as a defining feature, which is the honest framing for
      this treatment rather than an efficacy claim.
  - reference: PMID:34747138
    reference_title: "Neonatal neuronal WWOX gene therapy rescues Wwox null phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Response to antiepileptic drugs of these syndromes is very poor, and hence, alternative treatment approaches should be explored and developed."
    explanation: >-
      States the poor response directly, and is the stated rationale for the gene
      therapy programme below.

- name: WWOX Gene Replacement Therapy
  description: >-
    Experimental, preclinical. A single neonatal intracerebroventricular injection of
    an AAV9 vector carrying WWOX under a neuronal Synapsin I promoter rescues
    hyperexcitability, seizures, myelination and survival in Wwox-null mice. No
    peer-reviewed human efficacy data exist; this is curated as a mechanism-matched
    strategy with preclinical support, not as available care.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Loss of WWOX Scaffold Function
    treatment_effect: RESTORES
    description: >-
      Supplies the missing protein to neurons, addressing the pathograph at its root
      rather than at any single downstream arm.
    evidence:
    - reference: PMID:34747138
      reference_title: "Neonatal neuronal WWOX gene therapy rescues Wwox null phenotypes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "specific neuronal restoration of WWOX expression rescued brain hyperexcitability and seizures, hypoglycemia, myelination deficits, and the premature lethality and behavioral deficits of Wwox-null mice"
      explanation: >-
        The rescue result that licenses linking this treatment to the root node.
  evidence:
  - reference: PMID:34747138
    reference_title: "Neonatal neuronal WWOX gene therapy rescues Wwox null phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings provide a proof-of-concept for WWOX gene therapy as a promising approach to curing children with WOREE and SCAR12."
    explanation: >-
      The authors state this as proof of concept, which is the level of claim this
      entry makes.
  notes: >-
    Press coverage during 2026 described a first compassionate-use administration of
    an AAV9-WWOX product to an infant. That report is deliberately not curated as
    evidence here: it has no peer-reviewed publication, so there is no citable source
    and no verifiable outcome data. It is recorded in this note so a future curator
    knows the claim was seen and consciously excluded rather than missed.

- name: Nutritional Support
  description: >-
    Most patients have feeding difficulties and the majority come to depend on a
    feeding tube. This is curated because it is what most affected children actually
    receive, and because unsafe swallowing drives the aspiration risk behind the
    respiratory morbidity recorded above - not because any disease-modifying effect is
    claimed. Scoped to the nutrition rather than to its delivery route: the previous
    name bundled enteral feeding with gastrostomy placement, which are a dietary
    intervention and a procedure respectively, and the modality below describes only
    the former.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:30356099
    reference_title: "The phenotypic spectrum of WWOX-related disorders: 20 additional cases of WOREE syndrome and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Feeding difficulties were observed in most of the patients and 13/19 (70%) required a feeding tube."
    explanation: >-
      Establishes tube dependence as the usual course rather than an exceptional
      intervention.

- name: Genetic Counseling
  description: >-
    Offered to families given autosomal recessive inheritance with unaffected carrier
    parents, including in consanguineous families where recurrence risk is the
    presenting concern.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24456803
    reference_title: "The supposed tumor suppressor gene WWOX is mutated in an early lethal microcephaly syndrome with epilepsy, growth retardation and retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a homozygous WWOX nonsense mutation, p.Arg54*, in a girl from a consanguineous family with a severe syndrome of growth retardation, microcephaly, epileptic seizures, retinopathy and early death"
    explanation: >-
      Establishes the consanguineous recessive setting in which counselling and
      carrier testing apply.

discussions:
- discussion_id: controversy_myelin_versus_synaptic_route_to_seizures
  prompt: >-
    Neuronal WWOX loss produces both hypomyelination and a cortical
    excitation-inhibition imbalance in the same animals. Which of the two actually
    generates the seizures, and is the myelin arm causal or merely concurrent?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#CNS Hypomyelination
  - pathophysiology#Impaired Axonal Conductivity
  - pathophysiology#Cortical Excitation-Inhibition Imbalance
  rationale: >-
    This is not a manufactured gap - the electrophysiology paper states the problem in
    as many words, noting that hypomyelination alone does not necessarily cause
    epilepsy and citing demyelinating conditions that are not epileptic. Both arms are
    present in the same neuronal-deletion mouse and in WWOX-deleted human organoids,
    so co-occurrence is established and precedence is not. The pathograph therefore
    carries them as parallel arms from the scaffold node rather than placing myelin
    upstream of excitability, which would assert exactly the causal claim in dispute.
    It matters therapeutically: a remyelinating strategy and an excitability-directed
    strategy target different arms, and the gene-replacement result cannot separate
    them because restoring WWOX rescues both at once.
  evidence:
  - reference: PMID:34634460
    reference_title: "Altered neocortical oscillations and cellular excitability in an in vitro Wwox knockout mouse model of epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hypomyelination alone does not necessarily cause epilepsy"
    explanation: >-
      The explicit statement that the myelin arm is not sufficient, which is what
      makes this a live disagreement rather than an unexamined assumption.
  - reference: PMID:33914858
    reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These findings provide cellular and molecular evidence for myelination defects and hyperexcitability in the WOREE syndrome linked to neuronal function of WWOX."
    explanation: >-
      Establishes that both arms follow neuronal WWOX loss, but states them as
      co-occurring findings rather than as a causal sequence - which is the whole
      difficulty.
  proposed_experiments:
  - experiment_id: exp_remyelination_without_wwox_restoration
    name: Uncouple myelin repair from WWOX restoration in the conditional mouse
    description: >-
      Treat neuronal Wwox-deletion mice with a promyelinating agent that does not
      restore WWOX, and ask whether seizure burden and neocortical bursting fall while
      excitability measures are held constant. If myelin repair alone suppresses
      seizures, the myelin arm is causal; if bursting persists at restored myelin
      content, the synaptic arm is the seizure driver and myelin is concurrent.

- discussion_id: mismatch_model_lifespan_versus_human_disease_course
  prompt: >-
    Every rodent model of WWOX loss dies within two to four weeks of birth, while the
    human disease runs for years and the longest-followed patient reached 40. What can
    a model that never survives past infancy establish about a progressive disorder?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Cerebral and Optic Atrophy
  - pathophysiology#Genotype-Stratified Mortality Risk
  rationale: >-
    The mismatch is structural rather than a matter of degree. Progressive cerebral
    atrophy in patients is documented over years of serial imaging; the mouse is dead
    before an equivalent interval has elapsed, so the degeneration it shows is
    compressed into a window that cannot be mapped onto the human course. The same
    limit applies to the therapeutic endpoint: the gene-therapy experiment scores
    rescue of premature lethality at two to four weeks, an endpoint whose human
    counterpart - death in early childhood - occurs in only a subset of patients and
    at a very different point in development. The genotype-stratified survival data
    make this sharper still, because the human severity spectrum runs from death in
    infancy to survival into a fifth decade, and no current model spans it. Note this
    is a mismatch in translational reach, not evidence that the models are wrong: the
    same models supply the mechanistic measurements this entry depends on.
  evidence:
  - reference: PMID:33914858
    reference_title: "Neuronal deletion of Wwox, associated with WOREE syndrome, causes epilepsy and myelin defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "specific neuronal deletion of murine Wwox produces phenotypes typical of the Wwox-null mutation leading to brain hyperexcitability, intractable epilepsy, ataxia and postnatal lethality"
    explanation: >-
      Postnatal lethality is a defining feature of the model, and is the constraint
      this mismatch turns on.
  - reference: PMID:39507621
    reference_title: "Case report: Adult patient with WWOX developmental and epileptic encephalopathy: 40 years of observation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report presents for the first time a clinical case of an adult patient with a homozygous likely pathogenic variant (p.Thr12Met) in the WWOX gene, with more than 40 years of follow-up."
    explanation: >-
      The far end of the human survival range, four decades beyond anything the
      rodent models can reach.
  proposed_experiments:
  - experiment_id: exp_inducible_adult_onset_wwox_deletion
    name: Adult-onset inducible Wwox deletion to model the chronic phase
    description: >-
      Use a tamoxifen-inducible neuronal Cre to delete Wwox after the postnatal window
      that kills the constitutive model, then follow atrophy, myelin content and
      seizure burden longitudinally. This would separate the developmental
      contribution from the degenerative one, which the constitutive models
      necessarily conflate, and give the progressive arm a model with a survivable
      time course.

- discussion_id: gap_gsk3b_as_a_druggable_node
  prompt: >-
    Lithium abolishes chemically induced seizures in Wwox-null mice by inhibiting
    GSK-3beta. Does that translate to the spontaneous, drug-resistant seizures of
    WOREE syndrome in children?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Wnt/GSK-3beta Signalling Dysregulation
  rationale: >-
    This is the only node in the pathograph with an existing drug pointed at it, which
    makes the gap worth stating precisely rather than optimistically. Two things
    separate the mouse result from a clinical claim. The rescue was measured against
    pentylenetetrazol-induced seizures - a provoked-threshold assay - whereas the human
    disease is defined by spontaneous, drug-resistant seizures, and a compound can
    raise a chemical seizure threshold without touching established epileptogenic
    networks. Lithium is also not a selective GSK-3beta inhibitor, so the experiment
    licenses "GSK-3beta inhibition raises seizure threshold in this model" rather than
    identifying lithium as the agent. Against that, the target is attractive precisely
    because it is reachable with existing drugs in a disorder where 95% of patients
    fail conventional medication.
  evidence:
  - reference: PMID:32000863
    reference_title: "Wwox deficiency leads to neurodevelopmental and degenerative neuropathies and glycogen synthase kinase 3β-mediated epileptic seizure activity in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of GSK3β by lithium ion significantly abolishes the onset of PTZ-induced seizure in Wwox-/- mice."
    explanation: >-
      The result itself, and the wording - PTZ-induced - is exactly the limit the gap
      turns on.
  - reference: PMID:33916893
    reference_title: "Neurological Disorders Associated with WWOX Germline Mutations-A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Knowledge of the underlying pathophysiology of these syndromes, the range of variants of the WWOX gene and its genotype-phenotype correlations is limited, hampering therapeutic efforts."
    explanation: >-
      States that mechanistic knowledge is the current bottleneck for therapy, which
      is the context that makes a single druggable node significant.
  proposed_experiments:
  - experiment_id: exp_selective_gsk3b_inhibition_spontaneous_seizures
    name: Selective GSK-3beta inhibition against spontaneous seizures
    description: >-
      Treat neuronal Wwox-deletion mice - which have spontaneous seizures, unlike the
      PTZ paradigm - with a selective GSK-3beta inhibitor rather than lithium, and
      score spontaneous seizure frequency on continuous video EEG together with
      neocortical bursting in slices. This tests the target rather than the drug, and
      against the endpoint that matters clinically.

- discussion_id: gap_are_missense_alleles_truly_hypomorphic
  prompt: >-
    Genotype class predicts survival, with missense-containing genotypes faring better
    than biallelic null. Is that because missense alleles retain partial function, or
    because they do something qualitatively different?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Genotype-Stratified Mortality Risk
  - pathophysiology#Loss of WWOX Scaffold Function
  rationale: >-
    The survival difference is the best-quantified genotype-phenotype relationship in
    this disorder, and the word doing the work in the source is "presumed" - the
    hypomorphic status of missense alleles is inferred from the milder outcome rather
    than measured. This matters mechanistically because WWOX is a multi-domain
    scaffold: a missense change in a WW domain could preserve SDR-domain function
    while abolishing one protein interaction, which is not the same thing as uniformly
    reduced dose, and would predict arm-selective rather than globally milder disease.
    No published assay measures residual WWOX function allele by allele, so the
    dose-response model underlying the entire WOREE-to-SCAR12 spectrum rests on
    clinical severity rather than on protein function. It also bears directly on gene
    replacement, whose rationale assumes that adding functional protein back is
    sufficient regardless of which allele is present.
  evidence:
  - reference: PMID:36779245
    reference_title: "WWOX developmental and epileptic encephalopathy: Understanding the epileptology and the mortality risk."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with biallelic null WWOX pathogenic variants have significantly lower survival probability compared to those carrying at least one presumed hypomorphic missense pathogenic variant"
    explanation: >-
      The survival result, and the word "presumed" marking the hypomorphic status as
      an inference rather than a measurement.
  - reference: PMID:33916893
    reference_title: "Neurological Disorders Associated with WWOX Germline Mutations-A Comprehensive Overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, there is a critical need to identify and consolidate all the reported variants in WWOX to distinguish between disease-causing alleles and their associated severity, and benign variants, with the aim of improving diagnosis and increasing therapeutic efforts."
    explanation: >-
      An explicit statement that allele-level severity assignment is unfinished work.
  proposed_experiments:
  - experiment_id: exp_allele_series_residual_function
    name: Residual-function assay across a WWOX missense allele series
    description: >-
      Express each recurrent patient missense allele in a WWOX-null human neuronal
      background and measure, per allele, partner binding through each WW domain, the
      Hyal-2/Smad4 nuclear relocation readout, and rescue of the organoid
      hyperexcitability phenotype. A graded series would support the hypomorph model;
      arm-selective loss - one allele rescuing signalling but not excitability - would
      refute it and predict that genotype classes differ in kind rather than degree.

  description: >
    PARK-LRRK2 is inherited in an autosomal dominant manner with reduced,
    age-dependent penetrance, so many carriers report unaffected parents.
    Reported G2019S penetrance estimates vary widely (24-100%) by ascertainment,
    age, sex, and ethnicity, and are as low as 26% in Ashkenazi Jewish carriers.

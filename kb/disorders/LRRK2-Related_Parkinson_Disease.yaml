progression:
- phase: Onset
  notes: Onset is generally after age 50 years, though early (20s) and late (90s) onset are described.
  evidence:
  - reference: PMID:20301387
    reference_title: "LRRK2-Related Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Onset is generally after age 50 years, although early onset (in the 20s) and late onset (in the 90s) have been described."
    explanation: GeneReviews states the typical age at onset and broad onset range.
notes: >
  PARK-LRRK2 is the most common monogenic Parkinson disease and connects
  monogenic and sporadic disease: common LRRK2 variation modulates sporadic risk,
  and a protective haplotype lowers it. LRRK2 (dardarin) is distinct from GBA1,
  the lysosomal glucocerebrosidase whose variants are the other major genetic
  Parkinson risk factor and act on the same autophagy-lysosomal axis. ClinGen
  curates autosomal dominant LRRK2-related Parkinson disease under the lumped
  MONDO:0005180 (Parkinson disease, AD) assertion rather than MONDO:0011764.

  Management notes from GeneReviews: dopamine-blocking therapies may exacerbate
  parkinsonism and should be avoided, and at least annual dermatologic evaluation
  for melanoma is recommended given the increased melanoma risk.

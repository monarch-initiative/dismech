treatments:
- name: Levodopa (dopaminergic replacement)
  description: >
    Symptomatic dopaminergic replacement, most commonly levodopa combined with
    carbidopa, is the mainstay and is generally effective, as in idiopathic
    Parkinson disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
    - preferred_term: carbidopa
      term:
        id: CHEBI:3395
        label: carbidopa
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: RESTORES
    description: Exogenous levodopa restores central dopamine availability in the dopamine-depleted striatum.
  - target: Parkinsonism
    description: Levodopa replaces deficient dopamine, symptomatically relieving parkinsonism; it does not slow neurodegeneration.
  evidence:
  - reference: PMID:20301387
    reference_title: "LRRK2-Related Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic treatment of the motor features of parkinsonism is the same as for other known causes of Parkinson disease: pharmacologic replacement of dopamine, most commonly accomplished with the precursor of dopamine, levodopa, combined with carbidopa."
    explanation: GeneReviews states levodopa/carbidopa as the standard symptomatic treatment.
- name: Dopamine Agonist Therapy
  description: >
    Dopamine receptor agonists are used as symptomatic dopaminergic therapy for
    motor parkinsonism in PARK-LRRK2.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Dopamine Agonist
      term:
        id: NCIT:C66884
        label: Dopamine Agonist
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: BYPASSES
    description: Directly stimulates postsynaptic striatal dopamine receptors to compensate for presynaptic dopamine loss.
  - target: Parkinsonism
    description: Relieves motor symptoms of parkinsonism.
  evidence:
  - reference: PMID:20301387
    reference_title: "LRRK2-Related Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dopamine receptor agonists may also be used, as well as monoamine oxidase type B inhibitors, amantadine, adenosine receptor A2A antagonists, and/or anticholinergics."
    explanation: GeneReviews includes dopamine receptor agonists among standard symptomatic motor therapies for PARK-LRRK2.
- name: Monoamine Oxidase Type B Inhibitor Therapy
  description: >
    Monoamine oxidase type B (MAO-B) inhibitors are used to reduce central dopamine
    catabolism and treat motor features of PARK-LRRK2.
  notes: >
    NCIT provides no MAO-B-specific inhibitor class narrower than NCIT:C667
    (Monoamine Oxidase Inhibitor), and GeneReviews names the MAO-B inhibitor
    class without specifying individual drugs, so the class-level term is bound
    with a narrower preferred_term.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: monoamine oxidase type B inhibitor
      term:
        id: NCIT:C667
        label: Monoamine Oxidase Inhibitor
  target_mechanisms:
  - target: Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction
    treatment_effect: MODULATES
    description: Inhibits MAO-B-mediated dopamine breakdown to prolong synaptic dopamine signaling in the striatum.
  - target: Parkinsonism
    description: Improves parkinsonian motor symptoms.
  evidence:
  - reference: PMID:20301387
    reference_title: "LRRK2-Related Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dopamine receptor agonists may also be used, as well as monoamine oxidase type B inhibitors, amantadine, adenosine receptor A2A antagonists, and/or anticholinergics."
    explanation: GeneReviews lists MAO-B inhibitors among symptomatic pharmacotherapies for PARK-LRRK2.

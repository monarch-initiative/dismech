treatments:
- name: Levodopa (dopaminergic replacement)
  description: >
    Symptomatic dopaminergic replacement, most commonly levodopa combined with
    carbidopa, is the mainstay and is generally effective, as in idiopathic
    Parkinson disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_mechanisms:
  - target: Parkinsonism
    description: Levodopa replaces deficient dopamine, symptomatically relieving parkinsonism; it does not slow neurodegeneration.
  evidence:
  - reference: PMID:20301387
    reference_title: "LRRK2-Related Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic treatment of the motor features of parkinsonism is the same as for other known causes of Parkinson disease: pharmacologic replacement of dopamine, most commonly accomplished with the precursor of dopamine, levodopa, combined with carbidopa."
    explanation: GeneReviews states levodopa/carbidopa as the standard symptomatic treatment.
- name: LRRK2 kinase inhibitor therapy
  description: >
    Because pathogenic variants act by augmenting kinase activity, LRRK2 kinase
    inhibitors are in clinical development as a targeted, potentially
    disease-modifying approach; not yet established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: LRRK2 Kinase Gain of Function
    description: LRRK2 kinase inhibitors directly counter the disease-driving increase in LRRK2 kinase activity; investigational.
  evidence:
  - reference: PMID:26824392
    reference_title: "Phosphoproteomics reveals that Parkinson's disease kinase LRRK2 regulates a subset of Rab GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This has motivated the development of LRRK2 kinase inhibitors"
    explanation: The kinase-activating mechanism is the rationale for LRRK2 kinase-inhibitor development.
- name: Genetic counseling
  description: Counseling for autosomal dominant inheritance with reduced, age-dependent penetrance.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: >
  PARK-LRRK2 is the most common monogenic Parkinson disease and connects
  monogenic and sporadic disease: common LRRK2 variation modulates sporadic risk,
  and a protective haplotype lowers it. LRRK2 (dardarin) is distinct from GBA1,
  the lysosomal glucocerebrosidase whose variants are the other major genetic
  Parkinson risk factor and act on the same autophagy-lysosomal axis. Conforms to
  the parkinsonism_dopaminergic_degeneration module at the alpha-synuclein and
  nigrostriatal nodes. The deep-research report used to draft this entry mislabeled
  LRRK2 as HGNC:18666 (that CURIE is RNPC3); the correct gene is hgnc:18618,
  verified against HGNC, and several inline PMID citations it gave were unrelated
  papers, so all evidence here was refetched and quoted from the correct sources.

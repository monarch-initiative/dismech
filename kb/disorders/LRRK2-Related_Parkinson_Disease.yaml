    notes: >
      Alpha-synuclein Lewy body pathology is the predominant downstream finding in
      PARK-LRRK2 (especially G2019S), although LRRK2 neuropathology is pleomorphic
      and a subset of cases show pure nigral degeneration or tau pathology without
      Lewy bodies.
    evidence:
    - reference: PMID:32523507
      reference_title: '"LRRK2: Autophagy and Lysosomal Activity".'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "lysosomal activity decreases with age which can potentiate the accumulation of α-synuclein, the pathological hallmark of PD, and subsequently lead to the build-up of Lewy bodies (LBs) observed in this disorder"
      explanation: Review synthesis noting that alpha-synuclein accumulation and Lewy body build-up are the pathological hallmark of Parkinson disease, supporting synucleinopathy placement for the Lewy-body-positive majority of PARK-LRRK2 cases.

genetic:
- name: LRRK2
  gene_term:
    preferred_term: LRRK2
    term:
      id: hgnc:18618
      label: LRRK2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    LRRK2 encodes leucine-rich repeat serine/threonine kinase 2 (dardarin).
    High-penetrance pathogenic variants cluster in the Roc, COR, and kinase
    domains (p.Gly2019Ser, p.Arg1441C/G/H, p.Tyr1699Cys, p.Ile2020Thr,
    p.Asn1437His, p.Ile2012Thr) and act by augmenting kinase activity. No
    loss-of-function or structural mechanism causes typical LRRK2 Parkinson
    disease.
  evidence:
  - reference: PMID:26824392
    reference_title: "Phosphoproteomics reveals that Parkinson's disease kinase LRRK2 regulates a subset of Rab GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "G2019S, the most common amino acid substitution activates the kinase two- to threefold."
    explanation: Establishes the gain-of-function (kinase-activating) mechanism of the most common variant.
  - reference: CGGV:assertion_2728e13a-b95a-4c55-8cba-082260094ecd-2021-05-03T160000.000Z
    reference_title: "LRRK2 / Parkinson disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LRRK2 | HGNC:18618 | Parkinson disease | MONDO:0005180 | AD | Definitive | SOP8 | Parkinson's Disease Gene Curation Expert Panel"
    explanation: >-
      The ClinGen Parkinson's Disease Gene Curation Expert Panel classifies the
      autosomal dominant LRRK2 gene-disease relationship as Definitive against
      the broad Parkinson disease concept (MONDO:0005180) rather than against
      MONDO:0011764.

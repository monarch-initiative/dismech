    snippet: "The relative risk of an individual with both p.G2385R and p.R1628P is about 1.9"
    explanation: Quantifies the East-Asian G2385R/R1628P risk effect.
- name: Protective LRRK2 haplotype (N551K-R1398H-K1423K)
  gene_term:
    preferred_term: LRRK2
    term:
      id: hgnc:18618
      label: LRRK2
  association: Protective
  relationship_type: PROTECTIVE
  variant_origin: GERMLINE
  notes: >
    The p.Asn551Lys-p.Arg1398His-p.Lys1423Lys haplotype, with p.R1398H the likely

genetic:
- name: LRRK2
  gene_term:
    preferred_term: LRRK2
    term:
      id: hgnc:18618
      label: LRRK2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    LRRK2 encodes leucine-rich repeat serine/threonine kinase 2 (dardarin). High-
    penetrance pathogenic variants cluster in the Roc, COR, and kinase domains
    (p.Gly2019Ser, p.Arg1441C/G/H, p.Tyr1699Cys, p.Ile2020Thr, p.Asn1437His,
    p.Ile2012Thr) and act by augmenting kinase activity. No loss-of-function or
    structural mechanism causes typical LRRK2 Parkinson disease.
  evidence:
  - reference: PMID:26824392
    reference_title: "Phosphoproteomics reveals that Parkinson's disease kinase LRRK2 regulates a subset of Rab GTPases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "G2019S, the most common amino acid substitution activates the kinase two- to threefold."
    explanation: Establishes the gain-of-function (kinase-activating) mechanism of the most common variant.
- name: Asian risk variants (G2385R, R1628P)
  gene_term:
    preferred_term: LRRK2
    term:
      id: hgnc:18618
      label: LRRK2
  association: Risk factor
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >
    The p.Gly2385Arg and p.Arg1628Pro variants are lower-penetrance susceptibility
    alleles that roughly double Parkinson disease risk in East Asian populations.
- name: Protective LRRK2 haplotype (N551K-R1398H-K1423K)
  gene_term:
    preferred_term: LRRK2
    term:
      id: hgnc:18618
      label: LRRK2
  association: Protective
  relationship_type: PROTECTIVE
  variant_origin: GERMLINE
  notes: >
    The p.Asn551Lys-p.Arg1398His-p.Lys1423Lys haplotype, with p.R1398H the likely
    functional variant (lower kinase activity), protects against Parkinson disease.
  evidence:
  - reference: PMID:23962496
    reference_title: "Protective effect of LRRK2 p.R1398H on risk of Parkinson's disease is independent of MAPT and SNCA variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a protective p.N551K-R1398H-K1423K haplotype in the leucine-rich repeat kinase 2 (LRRK2) gene was identified, with p.R1398H appearing to be the most likely functional variant"
    explanation: Establishes the protective LRRK2 haplotype and its likely functional variant.
pathophysiology:
- name: LRRK2 Kinase Gain of Function
  biological_scale: MOLECULAR
  description: >
    Heterozygous pathogenic LRRK2 variants augment the intrinsic serine/threonine
    kinase activity of the protein; the most common variant, G2019S, activates the
    kinase two- to threefold. This is the initiating molecular lesion.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Rab GTPase Hyperphosphorylation
    causal_link_type: DIRECT
    description: Hyperactive LRRK2 hyperphosphorylates a subset of Rab GTPases on a conserved switch-II residue.
    evidence:
    - reference: PMID:26824392
      reference_title: "Phosphoproteomics reveals that Parkinson's disease kinase LRRK2 regulates a subset of Rab GTPases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "LRRK2 directly phosphorylates these both in vivo and in vitro on an evolutionary conserved residue in the switch II domain."
      explanation: Directly links LRRK2 kinase activity to Rab GTPase phosphorylation.
- name: Rab GTPase Hyperphosphorylation
  biological_scale: MOLECULAR
  description: >
    Pathogenic-LRRK2-driven phosphorylation of Rab GTPases reduces their affinity
    for regulatory proteins including Rab GDP dissociation inhibitors, dysregulating
    the Rab-controlled membrane-trafficking machinery.
  biological_processes:
  - preferred_term: protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: INCREASED
  downstream:
  - target: Autophagy-Lysosomal Dysfunction
    causal_link_type: DIRECT
    description: Dysregulated Rab-dependent trafficking impairs the autophagy-lysosomal pathway.
    evidence:
    - reference: PMID:26824392
      reference_title: "Phosphoproteomics reveals that Parkinson's disease kinase LRRK2 regulates a subset of Rab GTPases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pathogenic LRRK2 variants mapping to different functional domains increase phosphorylation of Rabs and this strongly decreases their affinity to regulatory proteins including Rab GDP dissociation inhibitors (GDIs)."
      explanation: Establishes the Rab-GDI affinity loss that dysregulates trafficking upstream of autophagy-lysosomal failure.
- name: Autophagy-Lysosomal Dysfunction
  biological_scale: CELLULAR
  description: >
    LRRK2 regulates macroautophagy, chaperone-mediated autophagy, and lysosomal
    activity; pathogenic LRRK2 perturbs this pathway, and declining lysosomal
    activity potentiates accumulation of alpha-synuclein.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  downstream:
  - target: Alpha-Synuclein Aggregation and Lewy Pathology
    causal_link_type: DIRECT
    description: Impaired autophagy-lysosomal clearance permits alpha-synuclein accumulation and Lewy body formation.
    evidence:
    - reference: PMID:32523507
      reference_title: "\\\"LRRK2: Autophagy and Lysosomal Activity\\\"."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "lysosomal activity decreases with age which can potentiate the accumulation of α-synuclein, the pathological hallmark of PD, and subsequently lead to the build-up of Lewy bodies (LBs) observed in this disorder"
      explanation: Links lysosomal-activity decline to alpha-synuclein accumulation and Lewy pathology.
- name: Alpha-Synuclein Aggregation and Lewy Pathology
  biological_scale: CELLULAR
  conforms_to: "parkinsonism_dopaminergic_degeneration#Alpha-Synuclein Aggregation and Lewy Pathology"
  description: >
    Accumulation and aggregation of alpha-synuclein into Lewy bodies is the common
    (though pleomorphic in LRRK2 disease) downstream pathology, shared with
    idiopathic Parkinson disease.
  downstream:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: DIRECT
    description: Alpha-synuclein pathology and the upstream cellular dysfunction drive loss of nigral dopaminergic neurons.
- name: Nigrostriatal Dopaminergic Neurodegeneration
  biological_scale: TISSUE
  conforms_to: "parkinsonism_dopaminergic_degeneration#Nigrostriatal Dopaminergic Neurodegeneration"
  description: >
    Progressive degeneration of substantia nigra pars compacta dopaminergic
    neurons and their striatal projections, the lesion that produces the motor
    syndrome.
  cell_types:
  - preferred_term: substantia nigra dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  downstream:
  - target: Parkinsonism
    causal_link_type: DIRECT
    description: Nigrostriatal dopaminergic loss and striatal dopamine deficiency unbalance the basal ganglia motor circuit, producing parkinsonism.
    evidence:
    - reference: PMID:20301387
      reference_title: "LRRK2-Related Parkinson Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LRRK2-related Parkinson disease (PARK-LRRK2) is characterized by initial motor features of bradykinesia and asymmetric tremor at rest or rigidity."
      explanation: Ties the nigrostriatal lesion to the parkinsonian motor syndrome.

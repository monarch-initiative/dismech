  - reference: PMID:20301387
    reference_title: "LRRK2-Related Parkinson Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with a heterozygous LRRK2 pathogenic variant has a 50% chance of inheriting the LRRK2 pathogenic variant."
    explanation: Recurrence risk for offspring.

name: LRRK2-Related Parkinson Disease
creation_date: "2026-09-03T14:19:34Z"
category: Mendelian
synonyms:
- PARK-LRRK2
- PARK8
- autosomal dominant Parkinson disease 8
- LRRK2 Parkinson disease
- dardarin-associated parkinsonism
- hereditary late-onset Parkinson disease due to LRRK2
description: >
  LRRK2-related Parkinson disease (PARK-LRRK2; autosomal dominant Parkinson
  disease 8) is the most common monogenic form of Parkinson disease. It is caused
  by heterozygous, kinase-activating variants in LRRK2, which encodes the large
  multidomain ROCO protein leucine-rich repeat serine/threonine-protein kinase 2
  (dardarin), with both kinase and GTPase activities. Onset is in adulthood,
  penetrance is reduced, and the clinical picture is typical, levodopa-responsive
  parkinsonism largely indistinguishable from idiopathic Parkinson disease.

  The recurrent pathogenic variants (most commonly p.Gly2019Ser, plus
  p.Arg1441C/G/H, p.Tyr1699Cys, and p.Ile2020Thr) act by augmenting LRRK2 kinase
  activity. Hyperactive LRRK2 hyperphosphorylates a subset of Rab GTPases on a
  conserved switch-II residue, reducing their affinity for regulatory proteins and
  dysregulating membrane trafficking; this converges on autophagy-lysosomal
  dysfunction, impaired alpha-synuclein clearance and Lewy pathology, and
  ultimately nigrostriatal dopaminergic neurodegeneration with striatal dopamine
  deficiency. The disease sits at the intersection of monogenic and sporadic
  Parkinson disease: common LRRK2 variation also modulates sporadic risk, and a
  degradation-lowering N551K-R1398H-K1423K haplotype is protective.

name: Hypobetalipoproteinemia
creation_date: "2026-08-26T16:00:00Z"
category: Mendelian
description: >
  Hypobetalipoproteinemia is a genetically heterogeneous group of inherited
  lipoprotein-metabolism disorders defined by plasma apolipoprotein B (apoB)
  and LDL cholesterol persistently below the 5th percentile. Three
  mechanistically distinct monogenic routes converge on this shared
  biochemical phenotype: APOB truncating variants that limit hepatic and
  intestinal apoB-lipoprotein production (familial hypobetalipoproteinemia 1,
  FHBL1), PCSK9 loss-of-function variants that enhance hepatic LDL-receptor
  recycling and clearance, and ANGPTL3 loss-of-function variants that
  de-repress lipoprotein and endothelial lipase activity, lowering LDL, HDL,
  and triglycerides together (familial hypobetalipoproteinemia 2 / familial
  combined hypolipidemia). Heterozygous FHBL1 is usually asymptomatic or
  associated only with mild hepatic steatosis; homozygous or compound
  heterozygous FHBL1 recapitulates severe fat malabsorption, hepatic
  steatosis, and fat-soluble-vitamin deficiency. PCSK9 and ANGPTL3
  loss-of-function are generally clinically benign and, unlike FHBL1, are not
  associated with hepatic steatosis; both are protective against coronary
  artery disease and are the human-genetics rationale for PCSK9-inhibitor and
  ANGPTL3-inhibitor lipid-lowering biologics.
disease_term:
  preferred_term: hypobetalipoproteinemia
  term:
    id: MONDO:0017774
    label: hypobetalipoproteinemia
synonyms:
- FHBL
- Familial hypobetalipoproteinemia
notes: >-
  This entry models the apoB-dosage/clearance axis of hypobetalipoproteinemia
  and is deliberately distinct from kb/disorders/Abetalipoproteinemia.yaml
  (MTTP, MONDO:0008692), which MONDO also nests as a child of MONDO:0017774
  alongside chylomicron retention disease (SAR1B). Abetalipoproteinemia is a
  recessive defect of apoB-particle *lipidation* by microsomal triglyceride
  transfer protein, acting on structurally normal apoB alleles; this entry
  covers codominant/dominant apoB-*dosage* and apoB-*clearance* defects
  acting directly on APOB, PCSK9, or ANGPTL3. The two are close phenotypic
  mimics in their most severe (biallelic APOB) forms - obligate heterozygous
  parents of an abetalipoproteinemia proband usually have normal lipids,
  while obligate heterozygous parents of a severe FHBL1 proband have
  approximately half-normal apoB-containing lipoproteins, the discriminating
  family-lipid clue between the two. kb/disorders/Familial_Defective_Apolipoprotein_B-100.yaml
  covers the opposite (hyper-) axis of APOB variation: missense substitutions
  in the LDL-receptor-binding region that impair apoB-100 ligand function and
  *raise* LDL cholesterol, the mirror image of the truncating,
  production-limiting APOB alleles curated here.
parents:
- Hypolipoproteinemia
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: PMID:24751931
      reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Several mutations in the apoB, MTP and PCSK9 genes result in low or absent levels of apoB and LDL-C in plasma and cause familial hypobetalipoproteinemia (FHBL) and abetalipoproteinemia (ABL)."
      explanation: Characterizes hypobetalipoproteinemia as a disorder of lipid/lipoprotein metabolism.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:20942659
      reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Familial hypobetalipoproteinemia is an inherited disorder of lipid metabolism defined by very low levels (<5th percentile of age- and sex-specific values) of plasma apolipoprotein B and LDL cholesterol. Familial hypobetalipoproteinemia is genetically heterogeneous."
      explanation: Establishes hypobetalipoproteinemia as a Mendelian, genetically heterogeneous disorder.
has_subtypes:
- name: FHBL1 Heterozygous
  display_name: Heterozygous Familial Hypobetalipoproteinemia 1 (APOB)
  subtype_term:
    preferred_term: familial hypobetalipoproteinemia 1
    term:
      id: MONDO:0014252
      label: familial hypobetalipoproteinemia 1
  description: >-
    Heterozygous carriage of one APOB truncating (nonsense, frameshift, or
    canonical splice-site) allele. Usually identified incidentally through
    low LDL cholesterol on routine lipid panels and is frequently
    asymptomatic biochemically, though hepatic steatosis and mild
    transaminase elevation are the main clinical manifestations because the
    truncated apoB variant is co-produced with the normal allele's product
    and can accumulate in hepatocytes even as less apoB-lipoprotein reaches
    plasma.
  genes:
  - preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  inheritance:
  - name: Semidominant (Codominant)
    inheritance_term:
      preferred_term: Semidominant inheritance
      term:
        id: HP:0032113
        label: Semidominant inheritance
    evidence:
    - reference: PMID:24751931
      reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FHBL is an autosomal codominant disorder characterized by apoB < 5th percentile and LDL-C usually between 20–50 mg/dL"
      explanation: States the codominant (semidominant) mode of inheritance for the FHBL1 biochemical trait.
- name: FHBL1 Homozygous
  display_name: Homozygous or Compound Heterozygous Familial Hypobetalipoproteinemia 1 (APOB)
  subtype_term:
    preferred_term: familial hypobetalipoproteinemia 1
    term:
      id: MONDO:0014252
      label: familial hypobetalipoproteinemia 1
  description: >-
    Two APOB truncating alleles (homozygous or compound heterozygous),
    producing a severe phenotype that closely mimics abetalipoproteinemia:
    very low or absent apoB-containing lipoproteins, gastrointestinal and
    neurologic dysfunction, fat-soluble-vitamin deficiency, hepatomegaly, and
    steatorrhea. GeneReviews classifies the biallelic-caused disease itself
    as autosomal recessive, distinct from the codominant biochemical trait
    seen in single-allele carriers.
  genes:
  - preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:33983694
      reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "APOB-related familial hypobetalipoproteinemia (APOB-FHBL) caused by homozygous (or compound heterozygous) pathogenic variants in APOB is inherited in an autosomal recessive manner."
      explanation: GeneReviews states the autosomal recessive pattern for the biallelic (severe) disease.
- name: PCSK9 Loss of Function
  display_name: PCSK9 Loss-of-Function Hypobetalipoproteinemia
  description: >-
    Heterozygous PCSK9 nonsense or loss-of-function missense variants reduce
    or abolish PCSK9-mediated degradation of the hepatic LDL receptor,
    increasing receptor recycling and hepatic LDL clearance. Unlike FHBL1,
    this is a clearance-enhancement rather than a production-limiting
    mechanism, is not associated with hepatic steatosis or fat
    malabsorption, and is clinically benign and cardioprotective; it is the
    human-genetics basis for PCSK9-inhibitor therapy.
  genes:
  - preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  inheritance:
  - name: Autosomal Dominant (Gene-Dosage)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:16554528
      reference_title: "Sequence variations in PCSK9, low LDL, and protection against coronary heart disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the 3363 black subjects examined, 2.6 percent had nonsense mutations in PCSK9; these mutations were associated with a 28 percent reduction in mean LDL cholesterol"
      explanation: A single heterozygous PCSK9 nonsense allele is sufficient to measurably lower LDL cholesterol, consistent with dominant/gene-dosage transmission.
- name: ANGPTL3 Deficiency
  display_name: ANGPTL3-Related Familial Combined Hypolipidemia (FHBL2)
  subtype_term:
    preferred_term: familial hypobetalipoproteinemia 2
    term:
      id: MONDO:0011505
      label: familial hypobetalipoproteinemia 2
  description: >-
    Biallelic ANGPTL3 loss-of-function variants abolish ANGPTL3-mediated
    inhibition of lipoprotein lipase and endothelial lipase, increasing
    catabolism of triglyceride-rich lipoproteins. Because ANGPTL3 normally
    restrains clearance of VLDL, LDL, and HDL alike, its complete loss
    produces a combined hypolipidemia affecting all three lipoprotein
    classes rather than a selective LDL/apoB defect, distinguishing it from
    FHBL1 and PCSK9 loss of function. GeneReviews reports the syndrome as
    clinically silent - "not associated with any pathologic signs or
    symptoms" - and, like PCSK9 loss of function, it is not associated with
    hepatic steatosis. It is the mechanistic basis for ANGPTL3-inhibitor
    (evinacumab) therapy.
  genes:
  - preferred_term: ANGPTL3
    term:
      id: hgnc:491
      label: ANGPTL3
  inheritance:
  - name: Autosomal Recessive (Codominant for LDL/Triglycerides)
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:37471510
      reference_title: "Familial Combined Hypolipidemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Familial combined hypolipidemia is inherited in an autosomal recessive manner."
      explanation: GeneReviews states the autosomal recessive pattern for the full clinical/biallelic syndrome.
    - reference: PMID:20942659
      reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Family members who were heterozygous for either mutation had plasma levels of LDL cholesterol and triglycerides that were intermediate between the levels in persons with neither mutation and those with both mutations, findings consistent with a codominant mode of inheritance for the LDL cholesterol and triglyceride phenotypes."
      explanation: >-
        Shows the LDL-cholesterol and triglyceride traits are codominant
        (gene-dosage dependent) even though the full combined-hypolipidemia
        syndrome is formally classified as autosomal recessive.
    - reference: PMID:20942659
      reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, the level of HDL cholesterol appears to segregate as a recessive trait."
      explanation: >-
        Documents that the HDL-cholesterol reduction specifically follows a
        strictly recessive pattern, unlike the codominant LDL/triglyceride
        traits - a within-family dissociation of inheritance mode by trait.

biochemical:
- name: LDL cholesterol and apoB
  context: Plasma
  presence: DECREASED
  notes: >-
    Below the 5th percentile for age and sex across all subtypes. In
    biallelic (severe) FHBL1, a proposed severe threshold of LDL-C and/or
    apoB below 15 mg/dL (typically apoB below 5 mg/dL) has been used to
    define homozygous-disease eligibility, with rare exceptions of a milder
    biochemical phenotype; excessively truncated apoB species may be
    undetectable in plasma altogether.
  evidence:
  - reference: PMID:38710625
    reference_title: "Current Diagnosis and Management of Familial Hypobetalipoproteinemia 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We searched PubMed for HoFHBL1 cases with genetic diagnosis and found that HoFHBL1 patients had LDL-C ＜15 mg/dL and/or apoB ＜15 mg/dL (typically apoB ＜5 mg/dL), except for two cases with a mild phenotype"
    explanation: Reports the proposed severe biochemical thresholds for homozygous FHBL1.
genetic:
- name: APOB truncating variants
  gene_term:

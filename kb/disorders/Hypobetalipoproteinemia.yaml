pathophysiology:
- name: APOB Truncating Variant
  description: >-
    A nonsense, frameshift, or canonical splice-site variant in APOB
    truncates the apoB open reading frame, producing a shortened apoB
    protein (apoB-XX nomenclature, denoting the percentage of full-length
    apoB translated) instead of full-length apoB-100/apoB-48. Over 60
    distinct truncating APOB mutations, ranging from apoB-2 to apoB-89, have
    been reported as causes of FHBL1.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: APOB
    term:
      id: hgnc:603
      label: APOB
  genetic_context:
    gene:
      preferred_term: APOB
      term:
        id: hgnc:603
        label: APOB
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      A truncating allele produces less protein and/or a protein that
      assembles and secretes lipoprotein particles less efficiently than
      full-length apoB - a straightforward loss-of-function call, in
      contrast to the partial, conformational loss-of-function of the
      ligand-binding-region missense alleles curated in
      Familial_Defective_Apolipoprotein_B-100.yaml.
  evidence:
  - reference: PMID:24751931
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Over 60 mutations producing truncations in the apoB gene ranging from apoB2 to apoB-89 have been identified as causes of FHBL"
    explanation: Documents the range of truncating APOB alleles causing FHBL1.
  downstream:
  - target: Impaired Hepatic and Intestinal ApoB-Lipoprotein Assembly and Secretion
    description: Truncated apoB is produced in reduced quantity and is secreted far less efficiently than the predicted 50% gene-dosage share.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24751931
      reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although there is one normal allele in heterozygous FHBL, plasma apoB-100 levels are approximately 24% of normal rather than the predicted 50%"
      explanation: Stable-isotope kinetic data show heterozygous truncating alleles disproportionately reduce apoB output below the simple gene-dosage expectation.
- name: Impaired Hepatic and Intestinal ApoB-Lipoprotein Assembly and Secretion
  description: >-
    Truncated apoB reduces the pool of apoB-lipoprotein particles available
    for hepatic VLDL and intestinal chylomicron assembly and secretion, a
    production-limited mechanism distinct from the lipidation defect of
    abetalipoproteinemia. Kinetic studies attribute the disproportionately
    low heterozygous apoB levels to markedly reduced VLDL apoB-100 secretion,
    decreased LDL apoB-100 production, increased VLDL catabolism, and
    extremely low secretion of the truncated species itself.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: very-low-density lipoprotein particle assembly
    term:
      id: GO:0034379
      label: very-low-density lipoprotein particle assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:24751931
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these lower than expected levels result from a 74% lower secretion rate of VLDL apoB-100 from the liver, decreased production of LDL apoB-100, increased catabolism of VLDL and extremely low secretion of the truncated apoB"
    explanation: Kinetic evidence directly establishes the reduced hepatic secretion mechanism.
  downstream:
  - target: Reduced Circulating ApoB-Containing Lipoprotein Concentration
    description: Fewer apoB-lipoprotein particles are secreted into plasma.
    causal_link_type: DIRECT
  - target: Hepatic Triglyceride Retention
    description: >-
      Reduced hepatic apoB secretion decreases triglyceride export from the
      liver in VLDL, producing hepatic steatosis even as less apoB-lipoprotein
      reaches plasma.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24751931
      reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This decreased secretion of apoB from the liver results in decreased triglyceride export from the liver, which in turn leads to the development of fatty liver"
      explanation: States the direct causal step from reduced apoB secretion to hepatic triglyceride retention and fatty liver.
- name: Hepatic Triglyceride Retention
  description: >-
    Reduced hepatic VLDL export retains triglyceride within hepatocytes,
    producing hepatic steatosis that can progress to steatohepatitis,
    fibrosis, and rarely cirrhosis or hepatocellular carcinoma, even in
    heterozygous carriers. This hepatic-storage consequence is
    characteristic of the APOB production-limited route and is not seen with
    the PCSK9 or ANGPTL3 clearance-enhanced routes.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: lipid storage
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  evidence:
  - reference: PMID:24751931
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 32 subjects with FHBL, average hepatic fat content measured by MR spectroscopy was 14.8% + 12.0% compared to 5.2% + 5.9%, respectively, for 33 normolipidemic controls"
    explanation: Directly measures increased hepatic fat content in FHBL subjects compared to matched controls.
  downstream:
  - target: Hepatic steatosis
    description: Hepatocyte triglyceride retention is observed as hepatic steatosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33983694
      reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Individuals with a heterozygous, typically truncating pathogenic variant in APOB are usually asymptomatic with mild liver dysfunction and hepatic steatosis."
      explanation: GeneReviews states hepatic steatosis as the characteristic manifestation of heterozygous FHBL1.
  - target: Cirrhosis
    description: >-
      Chronic hepatic triglyceride accumulation can progress to
      steatohepatitis and, rarely, cirrhosis or hepatocellular carcinoma,
      even in individuals with only a heterozygous truncating allele.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic hepatocyte lipid accumulation and steatohepatitis
    evidence:
    - reference: PMID:24751931
      reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Steatohepatitis, cirrhosis and hepatocellular carcinoma have all been described in subjects with truncated apoBs"
      explanation: Documents progression to cirrhosis and hepatocellular carcinoma in truncated-apoB carriers.
- name: PCSK9 Loss-of-Function Variant
  description: >-
    A PCSK9 nonsense or loss-of-function missense variant reduces or
    abolishes secreted PCSK9 activity. First identified through sequencing
    of PCSK9 in subjects with low plasma LDL specifically to test whether
    loss-of-function variants would have the mirror-image effect of the
    gain-of-function PCSK9 variants that cause autosomal dominant
    hypercholesterolemia (kb/disorders/Autosomal_Dominant_Hypercholesterolemia_3.yaml).
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: PCSK9
    term:
      id: hgnc:20001
      label: PCSK9
  genetic_context:
    gene:
      preferred_term: PCSK9
      term:
        id: hgnc:20001
        label: PCSK9
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      The mirror-image lesion class to the gain-of-function PCSK9 missense
      variants that cause autosomal dominant hypercholesterolemia type 3
      (ADH3): here, nonsense or loss-of-function missense variants reduce or
      abolish PCSK9 protease activity rather than enhancing it.
  evidence:
  - reference: PMID:15654334
    reference_title: "Low LDL cholesterol in individuals of African descent resulting from frequent nonsense mutations in PCSK9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To test whether loss-of-function mutations in PCSK9 have the opposite effect, we sequenced the coding region of PCSK9 in 128 subjects (50% African American) with low plasma levels of LDL and found two nonsense mutations (Y142X and C679X)"
    explanation: The discovery study explicitly frames these as loss-of-function variants, the mirror image of the known gain-of-function hypercholesterolemia alleles.
  downstream:
  - target: Reduced PCSK9-Mediated LDL Receptor Degradation
    description: Loss of PCSK9 function removes the normal restraint on hepatic LDL receptor turnover.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24751931
      reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Loss of function mutations in the PCSK9 gene prevent the PCSK9-mediated degradation of the LDL receptor and thus increase uptake of LDL by the liver"
      explanation: States the direct causal mechanism linking PCSK9 loss of function to reduced LDL receptor degradation.
- name: Reduced PCSK9-Mediated LDL Receptor Degradation
  description: >-
    PCSK9 normally binds the hepatic LDL receptor and directs it toward
    lysosomal degradation after endocytosis rather than recycling it to the
    cell surface. Loss-of-function PCSK9 variants remove this restraint, so
    more LDL receptor recycles back to the hepatocyte surface. This is the
    exact mechanistic node that PCSK9-inhibitor biologics (evolocumab,
    alirocumab) pharmacologically reproduce to lower LDL cholesterol in
    hypercholesterolemia.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: low-density lipoprotein particle receptor catabolic process
    term:
      id: GO:0032802
      label: low-density lipoprotein particle receptor catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:24751931
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PCSK9 is a secreted serine protease that enhances the degradation of the LDL-receptor. Loss of function mutations in the PCSK9 gene prevent the PCSK9-mediated degradation of the LDL receptor and thus increase uptake of LDL by the liver, a process leading to a 30 to 70% reduction in plasma LDL-C levels"
    explanation: States both the normal PCSK9 mechanism and the quantitative effect of its loss on plasma LDL cholesterol.
  downstream:
  - target: Increased Hepatic LDL Receptor Density
    description: Reduced receptor degradation increases steady-state hepatic LDL receptor abundance available for uptake.
    causal_link_type: DIRECT
- name: Increased Hepatic LDL Receptor Density
  description: >-
    More LDL receptor is available at the hepatocyte surface for
    receptor-mediated uptake of circulating LDL, increasing hepatic
    clearance of apoB-containing lipoproteins from plasma.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

- name: ANGPTL3 Loss-of-Function Variant
  description: >-
    Biallelic ANGPTL3 loss-of-function variants (compound heterozygous or
    homozygous nonsense/frameshift alleles) abolish secreted ANGPTL3
    activity. Discovered by whole-exome sequencing of two siblings with
    combined hypolipidemia not linked to APOB.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: ANGPTL3
    term:
      id: hgnc:491
      label: ANGPTL3
  genetic_context:
    gene:
      preferred_term: ANGPTL3
      term:
        id: hgnc:491
        label: ANGPTL3
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Nonsense and frameshift alleles that abolish secreted ANGPTL3 protein;
      the LDL-cholesterol and triglyceride phenotypes are gene-dosage
      dependent (codominant) while the HDL-cholesterol phenotype requires
      biallelic loss (recessive), a within-locus dissociation of inheritance
      mode by trait.
  evidence:
  - reference: PMID:20942659
    reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These two participants were compound heterozygotes for two distinct nonsense mutations in ANGPTL3 (encoding the angiopoietin-like 3 protein)."
    explanation: The discovery study identifies the causal ANGPTL3 nonsense mutations by exome sequencing.
  downstream:
  - target: Loss of ANGPTL3-Mediated Lipase Inhibition
    description: Loss of ANGPTL3 removes its normal inhibitory restraint on lipoprotein lipase and endothelial lipase.
    causal_link_type: DIRECT
- name: Loss of ANGPTL3-Mediated Lipase Inhibition
  description: >-
    ANGPTL3 normally inhibits lipoprotein lipase and endothelial lipase, the
    key enzymes that hydrolyze circulating triglyceride-rich lipoproteins
    and HDL, respectively. Loss of ANGPTL3 function increases the activity
    of both enzymes. This is the established mechanism for the triglyceride
    and HDL-cholesterol reductions; the mechanism by which ANGPTL3
    deficiency also lowers LDL cholesterol is less well resolved (see
    mechanism_confidence below).
  role: mediator
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: lipoprotein lipase activity
    term:
      id: GO:0004465
      label: lipoprotein lipase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:20942659
    reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The activities of lipoprotein lipase and endothelial lipase, key enzymes in the metabolism of circulating triglycerides and HDL cholesterol, respectively, are elevated in Angptl3-knockout mice"
    explanation: Mouse knockout data establish elevated lipase activity as the mechanism for the triglyceride/HDL phenotypes.
  - reference: PMID:20942659
    reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The mechanism by which deficiency of ANGPTL3 lowers LDL cholesterol remains to be determined."
    explanation: >-
      The authors explicitly state that the LPL/EL-inhibition mechanism
      explains the triglyceride and HDL-cholesterol phenotypes but not the
      LDL-cholesterol phenotype, hence PROVISIONAL confidence and PARTIAL
      support for extending this node's mechanism to the LDL branch.
  downstream:
  - target: Enhanced Catabolism of Triglyceride-Rich Lipoproteins
    description: Increased lipase activity accelerates lipolytic catabolism of VLDL and HDL; the LDL branch is less mechanistically resolved.
    causal_link_type: DIRECT
- name: Enhanced Catabolism of Triglyceride-Rich Lipoproteins
  description: >-
    Unrestrained lipoprotein lipase and endothelial lipase activity
    accelerates catabolism of triglyceride-rich lipoproteins and HDL,
    lowering triglycerides and HDL cholesterol together with LDL cholesterol
    rather than selectively lowering apoB-containing particles as in the
    APOB and PCSK9 routes. Carriers of ANGPTL3 loss-of-function variants
    additionally show decreased VLDL apoB production and increased LDL
    fractional catabolism, indicating ANGPTL3 also acts directly on hepatic
    lipoprotein secretion and clearance independent of its role inhibiting
    circulating lipases.
  role: mediator
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: triglyceride catabolic process
    term:
      id: GO:0019433
      label: triglyceride catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:20942659
    reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carriers of ANGPTL3 nonsense mutations had decreased rates of VLDL apolipoprotein B production and increased fractional catabolic rates for LDL apolipoprotein B"
    explanation: Physiological kinetic studies in carriers directly support both reduced VLDL production and increased LDL catabolism.
  downstream:
  - target: Reduced Circulating ApoB-Containing Lipoprotein Concentration
    description: Accelerated catabolism of VLDL and LDL, together with reduced VLDL apoB production, reduces circulating apoB-lipoprotein concentration.
    causal_link_type: DIRECT
  - target: Decreased HDL cholesterol concentration
    description: >-
      Endothelial lipase activation also accelerates HDL catabolism,
      distinguishing this route from the LDL-selective APOB and PCSK9
      routes. Unlike the LDL/triglyceride traits, this HDL effect segregates
      as a strictly recessive trait requiring biallelic ANGPTL3 loss.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20942659
      reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "compound heterozygotes had a very low level of HDL cholesterol (mean, 18 mg per deciliter"
      explanation: Quantifies the HDL-cholesterol reduction specific to biallelic (compound heterozygous) carriers.
  - target: Protection Against Coronary Artery Disease
    description: >-
      Lifelong reduction of all three major apoB/lipid fractions by ANGPTL3
      deficiency is associated with reduced coronary atherosclerotic burden
      and lower odds of coronary artery disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - sustained reduction of circulating LDL cholesterol and triglycerides
    evidence:
    - reference: PMID:28385496
      reference_title: "ANGPTL3 Deficiency and Protection Against Coronary Artery Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 3 individuals with complete ANGPTL3 deficiency showed no evidence of coronary atherosclerotic plaque."
      explanation: Direct imaging evidence of absent coronary atherosclerosis in complete ANGPTL3 deficiency.
    - reference: PMID:28385496
      reference_title: "ANGPTL3 Deficiency and Protection Against Coronary Artery Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Carrier status was associated with a 34% reduction in odds of CAD (odds ratio: 0.66; 95% confidence interval: 0.44 to 0.98; p = 0.04)."
      explanation: Population-level genetic association between heterozygous ANGPTL3 loss-of-function carrier status and reduced CAD odds.
- name: Protection Against Coronary Artery Disease
  description: >-
    A shared downstream consequence of the PCSK9 and ANGPTL3
    clearance-enhanced routes: lifelong, moderate reduction of circulating
    LDL cholesterol (and, for ANGPTL3, triglycerides) from birth is
    associated with substantially reduced coronary heart disease risk,
    providing the human-genetics validation for PCSK9-inhibitor and
    ANGPTL3-inhibitor drug development.
  role: outcome
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:16554528
    reference_title: "Sequence variations in PCSK9, low LDL, and protection against coronary heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data indicate that moderate lifelong reduction in the plasma level of LDL cholesterol is associated with a substantial reduction in the incidence of coronary events, even in populations with a high prevalence of non-lipid-related cardiovascular risk factors."
    explanation: States the general principle that lifelong LDL reduction from PCSK9 loss of function substantially reduces coronary events.
- name: Reduced Circulating ApoB-Containing Lipoprotein Concentration
  description: >-
    The convergent biochemical phenotype: plasma apoB and LDL cholesterol
    persistently below the 5th percentile, reached by three mechanistically
    distinct routes (reduced hepatic/intestinal apoB production, enhanced
    hepatic LDL-receptor-mediated clearance, or enhanced lipolytic
    catabolism of triglyceride-rich lipoproteins).
  role: central_effector
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:32039990
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia: liver disease and cardiovascular disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Several mutations in the apolipoprotein (apo) B, proprotein convertase subtilisin kexin 9 (PCSK9) and microsomal triglyceride transfer protein genes result in low or absent levels of apoB and LDL cholesterol (LDL-C) in plasma which cause familial hypobetalipoproteinemia (FHBL) and abetalipoproteinemia (ABL)."
    explanation: States the shared convergent biochemical phenotype across the causal genes covered in this entry.
  downstream:
  - target: Decreased LDL cholesterol concentration
    description: Reduced apoB-lipoprotein particle number is measured as decreased LDL cholesterol.
    causal_link_type: DIRECT
  - target: Hypocholesterolemia
    description: Reduced apoB-lipoprotein particle number lowers total cholesterol.
    causal_link_type: DIRECT
  - target: Impaired Intestinal Lipid Absorption
    description: >-
      When severe (homozygous/compound heterozygous FHBL1), reduced
      intestinal chylomicron secretion impairs dietary fat absorption. This
      branch does not occur in heterozygous FHBL1 or in the PCSK9/ANGPTL3
      clearance-enhanced routes.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - failure of intestinal chylomicron export in severe FHBL1
    evidence:
    - reference: PMID:20942659
      reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Persons with hypobetalipoproteinemia may also have fat malabsorption due to impaired incorporation of dietary fats into chylomicrons in the absorptive cells of the intestine."
      explanation: States the intestinal fat-malabsorption branch specific to the apoB production-limited route.
- name: Impaired Intestinal Lipid Absorption
  description: >-
    In the severe (homozygous or compound heterozygous FHBL1) form,
    insufficient intestinal chylomicron secretion impairs absorption and
    transport of dietary lipid, causing steatorrhea and fat-soluble-vitamin
    malabsorption. This branch is not seen in heterozygous FHBL1 or in the
    PCSK9/ANGPTL3 clearance-enhanced routes, which do not affect intestinal
    chylomicron assembly.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:

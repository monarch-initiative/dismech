      snippet: "we sequenced the coding region of PCSK9 in 128 subjects (50% African American) with low plasma levels of LDL and found two nonsense mutations (Y142X and C679X)"
      explanation: Identifies the two founding PCSK9 loss-of-function nonsense variants.

review_notes: >-
  Created 2026-08 in response to issue #9548 (CURATE_ROOT_WITH_SUBTYPES).
  Models the apoB-dosage/clearance axis of hypobetalipoproteinemia across
  three mechanistically distinct genetic causes (APOB, PCSK9, ANGPTL3),
  deliberately distinguished from the MTTP-lipidation mechanism of
  Abetalipoproteinemia.yaml and from the ligand-gain-of-function mechanism of
  Familial_Defective_Apolipoprotein_B-100.yaml. PCSK9-inhibitor and
  ANGPTL3-inhibitor treatments are curated as the therapeutic validation of
  this entry's human-genetics rationale rather than as treatments for
  hypobetalipoproteinemia itself, which is generally benign in its PCSK9 and
  ANGPTL3 forms. The ANGPTL3-to-LDL-cholesterol mechanism is explicitly
  marked PROVISIONAL, since Musunuru et al. (PMID:20942659) state the
  LPL/endothelial-lipase mechanism explains the triglyceride/HDL phenotypes
  but not the LDL phenotype, whose mechanism "remains to be determined."

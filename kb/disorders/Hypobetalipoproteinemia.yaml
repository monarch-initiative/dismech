  variants:
  - name: APOB truncating variants (apoB-2 to apoB-89)
    description: >
      Over 60 distinct truncating (nonsense, frameshift, splice-site)
      variants have been reported, named by the percent length of
      full-length apoB-100 translated (e.g., apoB-67 is the amino-terminal

      explanation: Documents the size and nomenclature of the truncating APOB allelic series.
  - name: p.(Arg490Trp) (c.1468C>T) missense founder variant
    description: >
      A rare missense variant (rather than a truncation) in APOB exon 11,
      also historically numbered p.(Arg463Trp). Identified as a founder
      allele accounting for approximately 71% of FHBL probands in a
      Lebanese cohort, with the same mutant haplotype shared across
      unrelated families, and separately reported in families of Italian,
      Canadian, Spanish, and Dutch origin.
    gene:
      preferred_term: APOB
      term:
        id: hgnc:603
        label: APOB
    clinical_significance: PATHOGENIC
    type: missense_variant
    evidence:
    - reference: PMID:34564380
      reference_title: "Identification of a Variant in APOB Gene as a Major Cause of Hypobetalipoproteinemia in Lebanese Families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we found that 71% of the recruited probands and their affected relatives were heterozygous for the p.(Arg490Trp) variant in the APOB gene"
      explanation: Reports the founder-allele frequency and segregation with FHBL in the Lebanese cohort.
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of biallelic APOB-related familial hypobetalipoproteinemia (APOB-FHBL) or heterozygous APOB-FHBL is established in a proband with either biallelic or a heterozygous pathogenic variant(s), respectively, in APOB identified by molecular genetic testing"
    explanation: GeneReviews states the molecular diagnostic criterion for both allelic states.
- name: PNPLA3 hepatic-fibrosis modifier
  gene_term:
    preferred_term: PNPLA3
    term:
      id: hgnc:18590
      label: PNPLA3
  association: Modifier of liver-disease severity/progression in APOB-FHBL1, not independently causative of hypobetalipoproteinemia
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    PNPLA3 I148M is a common MASLD risk variant, independent of the APOB
    truncating/missense alleles that cause FHBL1 itself. Co-occurrence of a
    PNPLA3 risk variant with a causal APOB variant has been reported to
    promote progression to fibrosis or cirrhosis, offering a candidate
    explanation for the variable hepatic severity among carriers of the
    same APOB allele. Curated as a liver-disease modifier, not as a second
    causal gene for the hypobetalipoproteinemia biochemical phenotype.
  evidence:
  - reference: PMID:41473260
    reference_title: "Current and Emerging Issues in Familial Hypobetalipoproteinemia-related Steatotic Liver Diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PNPLA3 and TM6SF2 have been extensively validated as risk factors for MASLD,89,90 and the TM6SF2 E167K and PNPLA3 I148M variants can promote the profibrotic phenotype of hepatic stellate cells.91,92 Cases have been reported with combined APOB and PNPLA3 variants leading to fibrosis or cirrhosis,93"
    explanation: Reports PNPLA3 I148M as a validated modifier that can promote fibrosis progression when co-occurring with a causal APOB variant.
- name: PCSK9 loss-of-function variants
  gene_term:

      evidence_source: OTHER
      snippet: "Individuals with biallelic APOB-related familial hypobetalipoproteinemia (APOB-FHBL) may present from infancy through to adulthood with a range of clinical symptoms including deficiency of fat-soluble vitamins and gastrointestinal and neurologic dysfunction."
      explanation: GeneReviews links intestinal dysfunction to fat-soluble-vitamin deficiency and downstream neurologic disease.
- name: Reduced Fat-Soluble Vitamin Bioavailability
  description: >-
    Impaired absorption and lipoprotein transport reduce the bioavailability
    of vitamins A, D, E, and K in severe (biallelic) FHBL1, mirroring the
    vitamin deficiency of abetalipoproteinemia and driving the same
    downstream retinal, neurologic, and coagulation complications when
    untreated.

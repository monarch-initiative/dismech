    injury of abetalipoproteinemia.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."

animal_models:
- name: Apob-38.9 heterozygous mouse (FHBL1 model)
  species: Mouse
  genotype: >-
    Apob-38.9 heterozygous (Apobec-1(-/-)/Apob(38.9/+) or Apob(38.9/100)),
    producing only apoB-38.9 and apoB-100
  publication: PMID:13130124
  modeled_mechanisms:
  - target: Impaired Hepatic and Intestinal ApoB-Lipoprotein Assembly and Secretion
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Apob-38.9 heterozygous mice reproduce the disproportionate (well
      beyond the 50% gene-dosage expectation) reduction in hepatic apoB-100
      secretion documented in human heterozygous FHBL1, and localize the
      defect in vivo and in primary hepatocytes to a secretion step rather
      than reduced synthesis from the intact allele.
    readouts:
    - name: Hepatic apoB-100 secretion rate
      target: Impaired Hepatic and Intestinal ApoB-Lipoprotein Assembly and Secretion
      direction: DECREASED
      interpretation: >-
        An 80% in vivo reduction in apoB-100 secretion, far exceeding the
        50% expected from simple gene dosage, mirrors the disproportionate
        (70-80%) reduction measured in human heterozygous FHBL1 and
        localizes the defect to hepatocyte secretion efficiency rather than
        synthesis.
      evidence:
      - reference: PMID:13130124
        reference_title: "Hepatic secretion of apoB-100 is impaired in hypobetalipoproteinemic mice with an apoB-38.9-specifying allele."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Rates of secretion were reduced by 80%, rather than the expected 50%, in both Apobec-1(-/-)/Apob(38.9/+) and Apob(38.9/100) mice compared with those of the respective Apobec-1(-/-)/Apob(+/+) and Apob(100/100) control mice."
        explanation: Directly reports the quantitative, genuinely murine in vivo hepatic apoB-100 secretion-rate readout in this model.
    evidence:
    - reference: PMID:13130124
      reference_title: "Hepatic secretion of apoB-100 is impaired in hypobetalipoproteinemic mice with an apoB-38.9-specifying allele."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Continuous labeling and pulse-chase experiments in primary hepatocyte cultures revealed that rates of apoB-100 synthesis by Apobec-1(-/-)/Apob(38.9/+) and Apob(38.9/100) hepatocytes were reduced to the expected 50% of those of the respective controls, but the efficiency of secretion of apoB-100 was significantly lower in apoB-38.9 heterozygous hepatocytes."
      explanation: Localizes the mouse-model defect specifically to hepatocyte secretion efficiency rather than synthesis, supporting use of this model for the secretion node.
  evidence:
  - reference: PMID:13130124
    reference_title: "Hepatic secretion of apoB-100 is impaired in hypobetalipoproteinemic mice with an apoB-38.9-specifying allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lipoprotein kinetics studies have shown that production rates of apoB-100 are reduced by 70-80% in heterozygous FHBL humans, instead of the expected 50%."
    explanation: >-
      The paper's own background statement establishes the human phenotype
      (70-80% reduction, not 50%) that motivated developing this mouse
      model - cited here as HUMAN_CLINICAL, distinct from the model's own
      MODEL_ORGANISM readout above.
treatments:
- name: Low-fat diet with fat-soluble vitamin supplementation
  description: >-
    For biallelic (severe) FHBL1, a low-fat diet (<30% of total calories)
    with adequate caloric intake plus high-dose oral vitamin A, D, E, and K
    supplementation, mirroring management of abetalipoproteinemia. No
    treatment is typically required for heterozygous FHBL1, PCSK9
    loss-of-function, or ANGPTL3 deficiency.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired Intestinal Lipid Absorption
    treatment_effect: MODULATES
    description: A low-fat diet reduces the dietary lipid burden on the impaired intestinal chylomicron-export pathway in biallelic FHBL1.
    evidence:
    - reference: PMID:33983694
      reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "low-fat diet (<30% of total calories) while ensuring adequate caloric intake; high-dose oral fat-soluble vitamin supplementation (vitamin E: 100-300 IU/kg/day; vitamin A: 100-400 IU/kg/day; vitamin D: 800-1200 IU/day; vitamin K: 5-35 mg/week)"
      explanation: GeneReviews specifies the dietary and vitamin management regimen for biallelic APOB-FHBL.
  - target: Reduced Fat-Soluble Vitamin Bioavailability
    treatment_effect: MODULATES
    description: High-dose oral fat-soluble vitamin supplementation increases vitamin availability despite persistent intestinal malabsorption.
    evidence:
    - reference: PMID:33983694
      reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "high-dose oral fat-soluble vitamin supplementation may ameliorate or prevent clinical features of APOB-FHBL"
      explanation: GeneReviews supports vitamin replacement as ameliorating or preventing clinical features.
  notes: >-
    Vitamin A dosing needs pregnancy-specific adjustment: women who are
    pregnant or planning to become pregnant should reduce their vitamin A
    supplement dose by 50%, with close monitoring of serum vitamin A
    throughout pregnancy, because vitamin A excess can be harmful to the
    developing fetus while vitamin A itself remains essential and should
    not be discontinued.
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Individuals with heterozygous APOB-FHBL: no treatment typically required."
    explanation: GeneReviews states that heterozygous FHBL1 generally requires no treatment, in contrast to the biallelic form.
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "reduce their vitamin A supplement dose by 50%"
    explanation: GeneReviews specifies the pregnancy-specific vitamin A dose adjustment for biallelic FHBL1.
- name: Liver transplantation
  description: >-
    Considered for biallelic (severe) FHBL1 patients who progress to
    end-stage liver disease from chronic hepatic triglyceride retention and
    steatohepatitis.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Cirrhosis
    treatment_effect: BYPASSES
    description: >-
      Transplantation replaces the failing liver rather than correcting the
      underlying APOB-lipoprotein secretion defect, which persists in
      extrahepatic tissue.
    evidence:
    - reference: PMID:33983694
      reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "liver transplantation may be considered for those with end-stage liver disease"
      explanation: GeneReviews lists liver transplantation as a management option for end-stage liver disease in biallelic APOB-FHBL.
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "liver transplantation may be considered for those with end-stage liver disease"
    explanation: GeneReviews lists liver transplantation as a management option for end-stage liver disease in biallelic APOB-FHBL.
- name: Multisystem surveillance for biallelic FHBL1
  description: >-
    Longitudinal follow-up in biallelic (severe) FHBL1 assesses growth,
    gastrointestinal symptoms, lipid profile, liver function, fat-soluble
    vitamins, coagulation, and other chemistries, alongside periodic
    ophthalmologic, neurologic, hepatic imaging, and bone-density
    evaluation, mirroring the surveillance schedule used for
    abetalipoproteinemia.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "laboratory studies to include lipid profile, liver function tests, vitamin levels, INR, calcium, phosphorus, uric acid, CBC, vitamin B12, folate and TSH every 1-2 years"
    explanation: GeneReviews specifies the biochemical surveillance schedule for biallelic APOB-FHBL.
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ophthalmology evaluation and neurologic examination every 6-12 months after age 10 years; hepatic ultrasound and bone mineral densitometry studies every 3-5 years after age 10 years"
    explanation: GeneReviews specifies the periodic specialist and imaging surveillance schedule for biallelic APOB-FHBL.
- name: Hepatic surveillance for heterozygous FHBL1
  description: >-
    Periodic liver function testing and hepatic ultrasound because
    heterozygous FHBL1 carries a real, if usually mild, risk of hepatic
    steatosis progressing to steatohepatitis, fibrosis, or rarely cirrhosis
    and hepatocellular carcinoma.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24751931
    reference_title: "Hypobetalipoproteinemia and abetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The recent reports of cirrhosis and hepatocellular carcinoma associated with FHBL suggest that liver enzymes should be monitored in subjects with FHBL and if elevated, hepatic imaging be considered"
    explanation: The review recommends liver-enzyme monitoring and imaging surveillance for FHBL carriers.
- name: Genetic counseling and family evaluation
  description: >-
    Counseling addresses the autosomal recessive recurrence risk for the
    severe biallelic FHBL1 and ANGPTL3-deficiency forms, carrier testing,
    and evaluation of at-risk relatives when a familial variant is known.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being heterozygous for APOB-FHBL and having laboratory findings and (rarely) clinical features, and a 25% chance of being unaffected and not a heterozygote."
    explanation: GeneReviews provides the autosomal-recessive recurrence-risk framework for biallelic APOB-FHBL.
- name: Evolocumab
  description: >-
    Fully human monoclonal antibody against PCSK9. Not a treatment for
    hypobetalipoproteinemia itself - PCSK9 loss-of-function hypobetalipoproteinemia
    is clinically benign and requires no treatment - but a pharmacological
    reproduction of the exact PCSK9-loss-of-function mechanism curated in
    this entry, developed and used to lower LDL cholesterol in
    hypercholesterolemic patients (see
    kb/disorders/Autosomal_Dominant_Hypercholesterolemia_3.yaml). Included
    here as the therapeutic validation of this entry's human-genetics
    rationale.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: evolocumab
      term:
        id: NCIT:C174672
        label: Evolocumab
  target_mechanisms:
  - target: Reduced PCSK9-Mediated LDL Receptor Degradation
    treatment_effect: ACTIVATES
    description: >-
      Evolocumab neutralizes circulating PCSK9, pharmacologically
      reproducing the reduced-LDL-receptor-degradation state that PCSK9
      loss-of-function variants produce genetically, increasing hepatic LDL
      clearance.
    evidence:
    - reference: PMID:28304224
      reference_title: "Evolocumab and Clinical Outcomes in Patients with Cardiovascular Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Evolocumab is a monoclonal antibody that inhibits proprotein convertase subtilisin-kexin type 9 (PCSK9) and lowers low-density lipoprotein (LDL) cholesterol levels by approximately 60%."
      explanation: States the drug's molecular target and quantitative effect on LDL cholesterol.
  evidence:
  - reference: PMID:16554528
    reference_title: "Sequence variations in PCSK9, low LDL, and protection against coronary heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate lifelong reduction in the plasma level of LDL cholesterol is associated with a substantial reduction in the incidence of coronary events"
    explanation: This entry's own human-genetics finding is the rationale cited for developing PCSK9-inhibitor therapy.
- name: Evinacumab
  description: >-
    Monoclonal antibody against ANGPTL3. Not a treatment for
    hypobetalipoproteinemia itself - ANGPTL3 deficiency is clinically silent
    and requires no treatment - but a pharmacological reproduction of this
    entry's ANGPTL3-loss-of-function mechanism, developed and approved to
    lower LDL cholesterol in homozygous familial hypercholesterolemia, where
    it lowers LDL cholesterol by an LDL-receptor-independent route.
    Included here as the therapeutic validation of this entry's
    human-genetics rationale.
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: evinacumab
      term:
        id: NCIT:C169973
        label: Evinacumab
  target_mechanisms:
  - target: Loss of ANGPTL3-Mediated Lipase Inhibition
    treatment_effect: ACTIVATES
    description: >-
      Evinacumab neutralizes circulating ANGPTL3, pharmacologically
      reproducing the loss-of-ANGPTL3-inhibition state that biallelic
      ANGPTL3 loss-of-function variants produce genetically, de-repressing
      lipoprotein and endothelial lipase and lowering LDL, HDL, and
      triglycerides.
    evidence:
    - reference: PMID:32813947
      reference_title: "Evinacumab for Homozygous Familial Hypercholesterolemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Loss-of-function variants in the gene encoding angiopoietin-like 3 (ANGPTL3) are associated with hypolipidemia and protection against atherosclerotic cardiovascular disease. Evinacumab, a monoclonal antibody against ANGPTL3, has shown potential benefit in patients with homozygous familial hypercholesterolemia."
      explanation: The pivotal trial's own background statement explicitly frames evinacumab as reproducing the ANGPTL3 loss-of-function state curated in this entry.
  evidence:
  - reference: PMID:32813947
    reference_title: "Evinacumab for Homozygous Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 24, patients in the evinacumab group had a relative reduction from baseline in the LDL cholesterol level of 47.1%, as compared with an increase of 1.9% in the placebo group"
    explanation: Quantifies evinacumab's LDL-lowering effect in a randomized trial, the clinical validation of the mechanism curated in this entry.
diagnosis:
- name: Plasma lipid and apoB measurement
  diagnosis_term:
    preferred_term: blood chemistry measurement
    term:
      id: NCIT:C47868
      label: Blood Chemistry Measurement
  description: >-
    Fasting lipid profile and apoB establish the biochemical phenotype
    (apoB and LDL cholesterol below the 5th percentile) and should prompt
    molecular testing. For homozygous/compound heterozygous (severe) FHBL1,
    a proposed severe threshold of LDL-C and/or apoB below 15 mg/dL
    (typically apoB below 5 mg/dL) has been used to define eligibility for
    homozygous-disease-specific management, with rare exceptions of a
    milder biochemical phenotype.
  results: >-
    Absent or extremely low LDL cholesterol and apoB supports severe
    (biallelic) FHBL1 but does not by itself distinguish it from
    abetalipoproteinemia; molecular testing and family lipid profiles are
    required for that distinction.
  evidence:
  - reference: PMID:38710625
    reference_title: "Current Diagnosis and Management of Familial Hypobetalipoproteinemia 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We searched PubMed for HoFHBL1 cases with genetic diagnosis and found that HoFHBL1 patients had LDL-C ＜15 mg/dL and/or apoB ＜15 mg/dL (typically apoB ＜5 mg/dL), except for two cases with a mild phenotype"
    explanation: A 2024 expert review reports the proposed severe biochemical thresholds for homozygous FHBL1 diagnosis, derived from a systematic literature search of genetically confirmed cases.
- name: APOB molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: APOB
        term:
          id: hgnc:603
          label: APOB
  description: >-
    Identification of a heterozygous (mild/incidental) or biallelic
    (severe) pathogenic APOB variant confirms APOB-related familial
    hypobetalipoproteinemia in a patient with the compatible biochemical
    phenotype.
  results: A heterozygous or biallelic pathogenic APOB variant establishes the molecular diagnosis, respectively of heterozygous or biallelic (severe) FHBL1.
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of biallelic APOB-related familial hypobetalipoproteinemia (APOB-FHBL) or heterozygous APOB-FHBL is established in a proband with either biallelic or a heterozygous pathogenic variant(s), respectively, in APOB identified by molecular genetic testing"
    explanation: GeneReviews states the molecular diagnostic criterion for both allelic states.
- name: Peripheral blood smear morphology
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    A peripheral blood smear can demonstrate acanthocytosis, a supportive
    clue in biallelic (severe) FHBL1, as in abetalipoproteinemia, though it
    cannot by itself distinguish the two.
  results: Acanthocytosis supports a severe hypobetalipoproteinemia diagnosis but is not a substitute for molecular confirmation.
  evidence:
  - reference: PMID:33983694
    reference_title: "APOB-Related Familial Hypobetalipoproteinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Acanthocytosis, elevated liver enzymes, and hyperbilirubinemia may also be found."
    explanation: GeneReviews lists acanthocytosis among the findings supporting a biallelic APOB-FHBL diagnosis.
differential_diagnoses:
- name: Abetalipoproteinemia
  description: >-
    The closest phenotypic mimic of severe (biallelic) FHBL1: MTTP-related
    abetalipoproteinemia produces a very similar clinical and biochemical
    picture (fat malabsorption, hepatic steatosis, fat-soluble-vitamin
    deficiency, acanthocytosis) but arises from a distinct mechanism -
    impaired apoB-particle *lipidation* by microsomal triglyceride transfer
    protein acting on structurally normal apoB alleles, rather than a defect
    in apoB dosage or clearance.
  disease_term:
    preferred_term: abetalipoproteinemia
    term:
      id: MONDO:0008692
      label: abetalipoproteinemia
  distinguishing_features:
  - Biallelic pathogenic APOB variants establish severe FHBL1; biallelic pathogenic MTTP variants establish abetalipoproteinemia.
  - Obligate heterozygous parents of a severe FHBL1 proband have approximately half-normal apoB-containing lipoproteins, whereas obligate heterozygous parents of an abetalipoproteinemia proband usually have normal lipids - the key family-lipid discriminator.
  evidence:
  - reference: PMID:24288038
    reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mutations either in both alleles of the MTP (alias MTTP) gene encoding microsomal triglyceride transfer protein (MTP) or both alleles of the APOB gene itself in the case of ABL and HHBL, respectively."
    explanation: The review distinguishes the two phenocopies by their causal genes.
  - reference: PMID:24288038
    reference_title: "Abetalipoproteinemia and homozygous hypobetalipoproteinemia: a framework for diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Obligate heterozygote parents of ABL patients usually have normal lipids"
    explanation: Supplies the family-lipid discriminator between the two mimics.
discussions:
- discussion_id: gap_fhbl_non_apob_locus
  prompt: >-
    Beyond APOB, PCSK9, and ANGPTL3, what is the causal gene for the
    hypobetalipoproteinemia families linked to a chromosome 3p21
    susceptibility locus, and for the additional families linked to neither
    APOB nor 3p21?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Circulating ApoB-Containing Lipoprotein Concentration
  rationale: >-
    This entry curates three molecularly resolved causal genes, but the
    literature independently documents at least one additional linked locus
    (chromosome 3p21) and further families with hypobetalipoproteinemia
    linked to neither APOB nor that locus, whose causal gene(s) remain
    unidentified. Unlike heterozygous APOB-FHBL1, the chromosome 3p21-linked
    form does not have increased liver fat, so it is not simply a phenocopy
    of the production-limited APOB route and may represent a fourth distinct
    mechanism.
  evidence:
  - reference: PMID:15818469
    reference_title: "Familial hypobetalipoproteinemia: genetics and metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Three genetic forms exist: (i) premature stop codon specifying mutations of APOB; (ii) FHBL linked to a susceptibility locus on the chromosome 3p21; and (iii) FHBL linked neither to APOB nor to the chromosome 3p21."
    explanation: States that molecularly uncharacterized non-APOB FHBL loci exist independent of the genes curated in this entry.
  - reference: PMID:15818469
    reference_title: "Familial hypobetalipoproteinemia: genetics and metabolism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Liver fat in the chromosome 3p21-linked FHBL is normal."
    explanation: Shows the 3p21-linked form does not share the hepatic steatosis mechanism curated for the APOB route, arguing it is mechanistically distinct rather than a minor variant.
  - reference: PMID:20942659
    reference_title: "Exome sequencing, ANGPTL3 mutations, and familial combined hypolipidemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant lod scores were not found for regions on chromosomes 3 and 10 previously reported to be associated with familial hypobetalipoproteinemia,6,7 nor for any other regions in the genome."
    explanation: Independently corroborates that FHBL families exist that map to loci other than APOB, PCSK9, or ANGPTL3.
  proposed_experiments:
  - experiment_id: fhbl_3p21_positional_cloning
    name: Positional cloning / whole-genome sequencing of chromosome 3p21-linked FHBL families
    description: >-
      Apply whole-genome or long-read sequencing to pedigrees with linkage to
      chromosome 3p21 (and to families linked to neither APOB nor 3p21) to
      identify the causal gene(s) and determine whether they act by a
      production-limiting, clearance-enhancing, or novel mechanism.

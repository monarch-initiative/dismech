    evidence_source: OTHER
    snippet: "progressive loss of deep tendon reflexes, vibratory sense, and proprioception; muscle pain or weakness; dysarthria; ataxia; tremors"
    explanation: >-
      GeneReviews describes the component signs of a peripheral neuropathy
      pattern (areflexia, sensory loss, weakness) without using the term
      "peripheral neuropathy" itself, hence PARTIAL.
- name: Decreased triglyceride level
  category: Biochemical
  subtype: ANGPTL3 Deficiency
  description: Triglycerides are markedly reduced together with LDL and HDL cholesterol in ANGPTL3 deficiency.
  phenotype_term:
    preferred_term: Hypotriglyceridemia
    term:
      id: HP:0012153
      label: Hypotriglyceridemia
  evidence:
  - reference: PMID:37471510
    reference_title: "Familial Combined Hypolipidemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The lipid profile is one of hypocholesterolemia with low plasma low-density lipoprotein (LDL) cholesterol, low plasma high-density lipoprotein (HDL) cholesterol, low plasma triglycerides, and low plasma apolipoprotein (apo) B and apo A-I levels."

diagnosis:
- name: Clinical Evaluation of Classic Ectodermal Triad
  diagnosis_term:
    preferred_term: Physical Examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >-
    Clinical diagnosis after infancy based on physical examination recognizing
    the classic triad of hypotrichosis (sparse scalp and body hair),
    hypohidrosis (reduced sweating with heat intolerance or unexplained febrile
    episodes), and hypodontia or oligodontia with conical teeth.
  results: >-
    Identification of sparse hair, dry skin with deficient sweating, and
    congenital absence of multiple teeth with conical crown morphology on
    clinical and dental examination.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic HED can be diagnosed after infancy based on physical features in
      most affected individuals.
    explanation: >-
      GeneReviews states that classic HED is diagnosed clinically after infancy
      by physical examination.
- name: Molecular Genetic Testing of EDARADD
  diagnosis_term:
    preferred_term: Molecular Genetic Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Multigene ectodermal dysplasia panel sequencing (including EDA, EDAR,
    EDARADD, and WNT10A) or whole-exome sequencing to identify biallelic or
    heterozygous pathogenic variants in EDARADD. Molecular testing is essential
    for definitive diagnosis because EDARADD-related HED is clinically
    indistinguishable from EDA- and EDAR-related HED.
  results: >-
    Identification of biallelic pathogenic variants in EDARADD (confirming
    autosomal recessive ECTD11B) or a heterozygous dominant-negative EDARADD
    pathogenic variant in a male or female (confirming autosomal dominant
    ECTD11A).
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous EDA pathogenic variant in an affected male
      or biallelic EDAR, EDARADD, or WNT10A pathogenic variants in an affected
      male or female confirms the diagnosis. The diagnosis of mild HED is
      established in a female by identification of a heterozygous EDA, EDAR,
      EDARADD, or WNT10A pathogenic variant. The diagnosis of mild HED is
      established in a male by identification of a heterozygous EDAR, EDARADD,
      or WNT10A pathogenic variant.
    explanation: >-
      GeneReviews establishes molecular genetic testing of EDARADD (biallelic
      or heterozygous in males and females) as the confirmatory diagnostic
      standard.
differential_diagnoses:
- name: X-Linked Hypohidrotic Ectodermal Dysplasia (EDA-Related)
  disease_term:
    preferred_term: X-linked hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0010585
      label: X-linked hypohidrotic ectodermal dysplasia
  description: >-
    The most common genetic form of hypohidrotic ectodermal dysplasia (58%–85%
    of cases), caused by hemizygous or heterozygous pathogenic variants in EDA.
    Clinically indistinguishable from autosomal recessive EDARADD-related HED in
    affected males.
  distinguishing_features:
  - X-linked inheritance with full expression in hemizygous males and variable or mild mosaic features in heterozygous female carriers, whereas autosomal recessive EDARADD-related HED affects males and females with equal severity
  - Pathogenic variants in EDA rather than EDARADD on molecular genetic testing
  evidence:
  - reference: PMID:16435307
    reference_title: "Mutations in EDAR account for one-quarter of non-ED1-related hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-linked form of the disease, caused by mutations in the ED1 gene,
      represents the majority of HED cases. Autosomal-dominant and -recessive
      forms occur occasionally and result from mutations in at least two genes:
      EDAR and EDARADD. These different forms are phenotypically
      indistinguishable.
    explanation: >-
      Confirms that X-linked EDA (ED1)-related HED is phenotypically
      indistinguishable from EDAR- and EDARADD-related HED and requires genetic
      testing and inheritance analysis for differentiation.
- name: EDAR-Related Hypohidrotic Ectodermal Dysplasia
  disease_term:
    preferred_term: EDAR-related hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0016535
      label: hypohidrotic ectodermal dysplasia
  description: >-
    Autosomal recessive (HED2, OMIM 224900) or autosomal dominant (OMIM 129490)
    hypohidrotic ectodermal dysplasia caused by pathogenic variants in EDAR,
    which encodes the transmembrane ectodysplasin A receptor immediately
    upstream of EDARADD. Accounts for 6.5%–16% of all HED cases (~25% of
    non-EDA HED) and is clinically indistinguishable from EDARADD-related HED.
  distinguishing_features:
  - Pathogenic variants in EDAR rather than EDARADD on molecular genetic testing; no clinical differences distinguish EDAR- from EDARADD-related HED
  evidence:
  - reference: PMID:16435307
    reference_title: "Mutations in EDAR account for one-quarter of non-ED1-related hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-linked form of the disease, caused by mutations in the ED1 gene,
      represents the majority of HED cases. Autosomal-dominant and -recessive
      forms occur occasionally and result from mutations in at least two genes:
      EDAR and EDARADD. These different forms are phenotypically
      indistinguishable.
    explanation: >-
      Demonstrates that EDAR- and EDARADD-related HED are phenotypically
      indistinguishable and differentiated by molecular genetic testing.
  - reference: PMID:20979233
    reference_title: "Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no clinical differences between patients carrying EDA1, EDAR, or
      EDARADD mutations could be identified, patients harboring WNT10A
      mutations displayed distinctive clinical features (marked dental
      phenotype, no facial dysmorphism), helping to decide which gene should be
      first investigated in HED/EDA.
    explanation: >-
      Confirms that patients with EDAR and EDARADD mutations cannot be
      separated clinically.
- name: WNT10A-Related Ectodermal Dysplasia (Odonto-Onycho-Dermal Dysplasia)
  disease_term:
    preferred_term: odonto-onycho-dermal dysplasia
    term:
      id: MONDO:0009773
      label: odonto-onycho-dermal dysplasia
  description: >-
    Autosomal recessive or autosomal dominant ectodermal dysplasia caused by
    pathogenic variants in WNT10A, accounting for 8.8%–16% of HED cohorts and
    presenting with severe oligodontia, hypohidrosis, and hypotrichosis.
  distinguishing_features:
  - Marked dental phenotype (severe oligodontia of permanent dentition) with absence of classic HED craniofacial dysmorphism (frontal bossing, depressed nasal bridge)
  - Frequent nail dysplasia and palmoplantar keratoderma (odonto-onycho-dermal dysplasia spectrum)
  - Pathogenic variants in WNT10A on molecular genetic testing
  evidence:
  - reference: PMID:20979233
    reference_title: "Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no clinical differences between patients carrying EDA1, EDAR, or
      EDARADD mutations could be identified, patients harboring WNT10A
      mutations displayed distinctive clinical features (marked dental
      phenotype, no facial dysmorphism), helping to decide which gene should be
      first investigated in HED/EDA.
    explanation: >-
      Demonstrates that WNT10A-related HED displays a distinctive marked dental
      phenotype without classic HED facial dysmorphism, distinguishing it from
      EDARADD-related HED.
treatments:
- name: Environmental Thermoregulation
  description: >-
    Access to an adequate water supply and cool environments (air conditioning,
    cooling vests, wet garments, and misting sprays) during hot weather and
    avoidance of extreme heat exposure to prevent hyperthermic episodes.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Hypohidrosis
    term:
      id: HP:0000966
      label: Hypohidrosis
  - preferred_term: Heat intolerance
    term:
      id: HP:0002046
      label: Heat intolerance
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Access to an adequate water supply and a cool environment during hot
      weather.
    explanation: >-
      GeneReviews management recommendation for preventing hyperthermia in
      patients with HED.
- name: Dental Rehabilitation
  description: >-
    Staged multidisciplinary dental care beginning in early childhood,
    including bonding of conical teeth, orthodontics, removable dental
    prostheses replaced approximately every 2.5 years during craniofacial
    growth, mandibular and adult dental implants, oral lubrication, and
    fluoride treatment to prevent dental caries.
  treatment_term:
    preferred_term: Dental Procedure
    term:
      id: NCIT:C38052
      label: Dental Procedure
  target_phenotypes:
  - preferred_term: Hypodontia
    term:
      id: HP:0000668
      label: Hypodontia
  - preferred_term: Conical tooth
    term:
      id: HP:0000698
      label: Conical tooth
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early dental treatment; bonding of conical teeth; orthodontics as
      necessary; dental implants in the anterior portion of the mandibular arch
      in older children; replacement of dental prostheses as needed, often
      every 2.5 years; dental implants in adults; dietary counseling for
      individuals with chewing and swallowing difficulties; therapeutics to
      maintain oral lubrication and control caries; fluoride treatment to
      prevent caries.
    explanation: >-
      GeneReviews outlines comprehensive staged dental rehabilitation, oral
      lubrication, and fluoride caries prevention for hypodontia and conical
      teeth in HED.
- name: Supportive Care for Xerosis and Mucosal Dryness
  description: >-
    Emollient skin care products and avoidance of irritants to manage dry skin
    and eczematous dermatitis, alongside ambient air humidification, otolaryngologic
    removal of nasal and aural concretions with suction or forceps as needed,
    lubricating eye drops, and management of recurrent respiratory infections.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Dry skin
    term:
      id: HP:0000958
      label: Dry skin
  - preferred_term: Keratoconjunctivitis sicca
    term:
      id: HP:0001097
      label: Keratoconjunctivitis sicca
  - preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skin care products for eczema and exposures that exacerbate dry skin.
    explanation: >-
      GeneReviews recommends targeted dermatologic care for xerosis and eczema
      in HED.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nasal and aural concretions may be removed with suction devices or
      forceps as needed by an otolaryngologist. Prevention of nasal concretions
      through humidification of ambient air is helpful. Lubrication eye drops.
    explanation: >-
      GeneReviews recommends otolaryngologic removal of nasal/aural
      concretions, ambient humidification, and lubricating eye drops for
      mucosal dryness and keratoconjunctivitis sicca in HED.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of recurrent respiratory infections and asthma per primary care provider with referral to allergist and/or pulmonologist as needed.
    explanation: >-
      GeneReviews recommends standard management of sinus and respiratory
      infections resulting from mucosal dryness and seromucous gland hypoplasia.
- name: Genetic Counseling
  description: >-
    Genetic counseling to clarify autosomal recessive (25% sibling recurrence
    risk, 50% carrier risk, 25% unaffected non-carrier probability when both
    parents are heterozygous) versus autosomal dominant (50% offspring
    transmission risk) inheritance, guide molecular cascade testing of at-risk
    relatives to prevent infantile hyperthermia, and enable prenatal or
    preimplantation genetic testing once the familial EDARADD pathogenic
    variant(s) have been identified.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a pathogenic variant,
      each sib of an affected individual has at conception a 25% chance of
      being affected, a 50% chance of being heterozygous, and a 25% chance of
      inheriting neither of the familial pathogenic variants.
    explanation: >-
      Defines sibling recurrence risks for autosomal recessive EDARADD-related
      HED during genetic counseling.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with autosomal dominant HED has a 50% chance
      of inheriting the EDAR, EDARADD, or WNT10A pathogenic variant. Once the
      EDA, EDAR, EDARADD, or WNT10A pathogenic variant(s) have been identified
      in an affected family member, prenatal and preimplantation genetic testing
      for HED are possible.
    explanation: >-
      Establishes the 50% offspring transmission risk for autosomal dominant
      EDARADD-related HED and the availability of prenatal and preimplantation
      genetic testing once the familial variant is known.

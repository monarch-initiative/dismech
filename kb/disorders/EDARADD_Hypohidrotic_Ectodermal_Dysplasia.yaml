pathophysiology:
- name: Disrupted EDA-EDAR-EDARADD-NF-κB Signaling
  conforms_to: "eda_edar_nfkb_ectodermal_appendage#EDA-EDAR-EDARADD Canonical NF-kappaB Signaling Failure"
  description: >-
    EDARADD is the intracellular death domain adaptor protein that bridges the
    EDAR receptor to downstream NF-κB signaling. Upon EDA-A1 ligand binding to
    EDAR, the receptor's intracellular death domain recruits EDARADD, which in
    turn interacts with the TAB2/TRAF6/TAK1 complex to activate the IKK complex
    and NF-κB transcription factors. Pathogenic EDARADD variants impair EDAR
    death domain binding and/or abolish or reduce TRAF6 recruitment, preventing
    NF-κB-dependent transcriptional programs required for ectodermal appendage
    initiation and morphogenesis.

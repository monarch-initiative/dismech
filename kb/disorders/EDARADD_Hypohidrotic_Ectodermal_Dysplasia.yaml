notes: >-
  Isoform numbering convention: EDARADD encodes two alternatively spliced
  isoforms that differ by 10 N-terminal amino acids—isoform A (205 amino acids;
  used by Bal et al. 2007 [PMID:17354266]) and isoform B (215 amino acids; used
  by Asano et al. 2021 [PMID:34219261]). Consequently, the autosomal recessive
  missense variant is designated p.Glu142Lys in isoform A and p.Glu152Lys
  (p.E152K) in isoform B, and the prototype autosomal dominant variant is
  designated c.335T>G (p.Leu112Arg) in isoform A and p.Leu122Arg (p.L122R) in
  isoform B; the additional dominant variants p.Asp120Tyr (p.D120Y) and
  p.Asp123Asn (p.D123N) characterized by Asano et al. 2021 follow isoform B
  numbering. Therapeutic scope note: prenatal intra-amniotic recombinant Fc-EDA1
  protein replacement (ER004 / edinacimig), which rescues ectodermal appendage
  development in X-linked EDA-deficient HED by supplying exogenous ligand to
  wild-type EDAR, acts upstream of EDARADD and cannot bypass a downstream
  intracellular EDARADD adaptor defect. MONDO disease_term and subtype bindings:
  MONDO divides EDARADD-related hypohidrotic ectodermal dysplasia by inheritance
  mode into MONDO:0013983 (ectodermal dysplasia 11B, hypohidrotic/hair/tooth
  type, autosomal recessive; OMIM:614941) and MONDO:0013982 (ectodermal
  dysplasia 11A, hypohidrotic/hair/tooth type, autosomal dominant; OMIM:614940)
  without a single gene-specific parent term uniting both inheritance forms;
  this entry retains MONDO:0013983 as the top-level disease_term and binds the
  AR and AD has_subtypes entries to MONDO:0013983 and MONDO:0013982,
  respectively. Phenotype curation note: Nail Dystrophy (HP:0008404) was
  intentionally removed from earlier versions because nails are normal or only
  mildly affected in classic EDARADD-related HED, and the previously attached
  PMID:38840186 sentence described generic ectodermal dysplasia background
  rather than EDARADD-specific clinical findings.

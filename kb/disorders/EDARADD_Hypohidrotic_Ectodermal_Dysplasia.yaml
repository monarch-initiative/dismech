diagnosis:
- name: Clinical Diagnosis After Infancy
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Clinical suspicion is raised after infancy when affected individuals
    present with the classic triad of hypotrichosis (sparse scalp and body
    hair), hypohidrosis (deficient sweating and episodes of hyperthermia), and
    hypodontia (missing and conical teeth).
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic HED can be diagnosed after infancy based on physical features in
      most affected individuals.
    explanation: >-
      GeneReviews establishes recognition of the classic clinical triad after
      infancy as the primary clinical diagnostic approach.
- name: Molecular Genetic Testing of EDARADD
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Definitive diagnosis requires molecular genetic testing (multigene
    ectodermal dysplasia panel or sequencing of EDA, EDAR, EDARADD, and WNT10A)
    identifying biallelic (or dominant-negative heterozygous) pathogenic
    variants in EDARADD, because EDARADD-related HED is clinically
    indistinguishable from EDA- and EDAR-related forms.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of a hemizygous EDA pathogenic variant in an affected male
      or biallelic EDAR, EDARADD, or WNT10A pathogenic variants in an affected
      male or female confirms the diagnosis.
    explanation: >-
      GeneReviews confirms that molecular identification of pathogenic variants
      in EDARADD distinguishes this genetic subtype from EDA, EDAR, and WNT10A
      forms.
  - reference: PMID:38840186
    reference_title: "Novel homozygous frameshift insertion variant in the last exon of the EDARADD causing hypohidrotic ectodermal dysplasia in two siblings: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After thorough examination and patient history evaluation, targeted
      next-generation sequencing analysis yielded the novel homozygous insertion
      variant c.322_323insCGGGC p.(Arg108ProfsTer7) in EDARADD.
    explanation: >-
      Demonstrates the clinical utility of targeted next-generation sequencing
      to establish a definitive molecular diagnosis of EDARADD-related HED.
differential_diagnoses:
- name: X-Linked Hypohidrotic Ectodermal Dysplasia
  disease_term:
    preferred_term: X-linked hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0010585
      label: X-linked hypohidrotic ectodermal dysplasia
  description: >-
    Caused by hemizygous or heterozygous variants in EDA; accounts for the
    majority of HED cases and is clinically indistinguishable from
    EDARADD-related HED in affected males, though female carriers may show mild
    or patchy ectodermal features and pedigree analysis shows X-linked
    inheritance.
  distinguishing_features:
  - X-linked inheritance pattern and mild mosaic manifestations in female carriers
  - Pathogenic variant in EDA rather than EDARADD on molecular genetic testing
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDA-related HED is inherited in an X-linked manner. EDAR-, EDARADD-, and
      WNT10A-related HED are inherited in an autosomal recessive or an
      autosomal dominant manner.
    explanation: >-
      GeneReviews notes that X-linked EDA-related HED and autosomal
      EDAR/EDARADD/WNT10A forms share the core HED phenotype and are separated
      by inheritance pattern and molecular testing.
- name: EDAR- and WNT10A-Related Hypohidrotic Ectodermal Dysplasia
  disease_term:
    preferred_term: hypohidrotic ectodermal dysplasia
    term:
      id: MONDO:0016535
      label: hypohidrotic ectodermal dysplasia
  description: >-
    Autosomal recessive and dominant forms of HED caused by pathogenic variants
    in EDAR or WNT10A produce an identical or closely overlapping ectodermal
    triad and require molecular genetic testing for differentiation.
  distinguishing_features:
  - Pathogenic variants in EDAR or WNT10A identified on multigene panel testing
  evidence:
  - reference: PMID:20979233
    reference_title: "Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no clinical differences between patients carrying EDA1, EDAR, or
      EDARADD mutations could be identified, patients harboring WNT10A mutations
      displayed distinctive clinical features (marked dental phenotype, no
      facial dysmorphism), helping to decide which gene should be first
      investigated in HED/EDA.
    explanation: >-
      Cluzeau et al. demonstrate that EDA, EDAR, and EDARADD mutations produce
      clinically indistinguishable phenotypes while WNT10A cases show a marked
      dental phenotype without facial dysmorphism.
- name: IKBKG-Related Immunodeficiency With or Without Ectodermal Dysplasia
  disease_term:
    preferred_term: IKBKG-related immunodeficiency with or without ectodermal dysplasia
    term:
      id: MONDO:0100162
      label: IKBKG-related immunodeficiency with or without ectodermal dysplasia
  description: >-
    Hypomorphic X-linked mutations in IKBKG (NEMO), a downstream component of
    the IKK complex in the NF-κB pathway, cause hypohidrotic ectodermal
    dysplasia accompanied by severe humoral and cellular immunodeficiency
    (HED-ID).
  distinguishing_features:
  - Severe recurrent bacterial and opportunistic infections with dysgammaglobulinemia
  - Hemizygous hypomorphic mutation in IKBKG (NEMO) with X-linked inheritance
  evidence:
  - reference: PMID:11047757
    reference_title: "A novel X-linked disorder of immune deficiency and hypohidrotic ectodermal dysplasia is allelic to incontinentia pigmenti and due to mutations in IKK-gamma (NEMO)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have studied males from four families with HED and immunodeficiency
      (HED-ID), in which the disorder segregates as an X-linked recessive
      trait. Affected males manifest dysgammaglobulinemia and, despite therapy,
      have significant morbidity and mortality from recurrent infections.
    explanation: >-
      Distinguishes IKBKG-related HED with immunodeficiency (HED-ID) from
      isolated HED forms such as EDARADD-related HED.
animal_models:
- name: Mouse crinkled (Edaradd) mutant
  species: Mouse (Mus musculus)
  genotype: Edaradd (crinkled, cr) mutant
  genes:
  - preferred_term: EDARADD
    term:
      id: hgnc:14341
      label: EDARADD
  background: Spontaneous and transgenic mouse lines at the crinkled locus
  description: >-
    The mouse crinkled (cr) mutant carries a deletion disrupting Edaradd and
    exhibits a hypohidrotic ectodermal dysplasia phenotype—including absent
    sweat glands, sparse hair coat, and abnormal tooth morphology—identical to
    that of Eda (Tabby) and Edar (downless) mutant mice.
  evidence:
  - reference: PMID:11780064
    reference_title: "Gene defect in ectodermal dysplasia implicates a death domain adapter in development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we report the identification of a death domain adapter encoded by the
      mouse crinkled locus. The crinkled mutant has an hypohidrotic ectodermal
      dysplasia phenotype identical to that of the edar (downless) and eda
      (Tabby) mutants.
    explanation: >-
      Establishes the mouse crinkled mutant as the canonical animal model of
      EDARADD deficiency and confirms phenotypic identity with Eda and Edar
      mutants.

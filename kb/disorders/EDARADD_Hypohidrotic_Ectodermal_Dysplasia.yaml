  evidence:
  - reference: PMID:11780064
    reference_title: "Gene defect in ectodermal dysplasia implicates a death domain adapter in development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This adapter, which we have called Edaradd (for Edar-associated death
      domain), interacts with the death domain of Edar and links the receptor to
      downstream signalling pathways.
    explanation: >-
      Establishes that EDARADD is the death domain adaptor linking EDAR to
      downstream signaling pathways.
  - reference: PMID:17354266
    reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated that the p.Leu112Arg mutation completely abrogated NF-kB
      activation, whereas the p.Glu142Lys retained the ability to significantly
      activate the NF-kB pathway.
    explanation: >-
      Functional reporter assays showing complete loss of NF-κB activation by
      the dominant p.Leu112Arg (isoform A) variant and partial hypomorphic
      activity of the recessive p.Glu142Lys (isoform A) variant.
  - reference: PMID:34219261
    reference_title: "Characterization of EDARADD gene mutations responsible for hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additional co-immunoprecipitation assays revealed that p.D120Y-,
      p.L122R-, and p.D123N-mutant EDARADD markedly prevented the interaction
      between EDAR and wild-type EDARADD, which further indicated a dominant
      negative effect by these mutations. Finally, we found that p.D120Y-,
      p.L122R-, and p.D123N-mutant EDARADD completely lost the ability to bind
      with TRAF6, while p.E152K-mutant EDARADD showed a mild reduction in the
      affinity.
    explanation: >-
      Elucidates the molecular mechanism of dominant-negative EDARADD variants:
      p.D120Y, p.L122R, and p.D123N prevent the interaction between EDAR and
      wild-type EDARADD and completely lose TRAF6 binding, whereas recessive
      p.E152K shows a mild reduction in TRAF6 affinity.

genetic:
- name: EDARADD Biallelic Loss-of-Function Variants
  subtype: AR
  association: Pathogenic Variants
  gene_term:
    preferred_term: EDARADD
    term:
      id: hgnc:14341
      label: EDARADD
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:38840186
      reference_title: "Novel homozygous frameshift insertion variant in the last exon of the EDARADD causing hypohidrotic ectodermal dysplasia in two siblings: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In this report, we present two siblings exhibiting classical HED
        symptoms and a novel insertion variant of the EDARADD gene, which leads
        to a frameshift introducing a stop codon. Both brothers inherited such
        mutation from their parents, who were heterozygous carriers of the same
        variant.
      explanation: >-
        Establishes autosomal recessive inheritance of EDARADD-related HED from
        unaffected heterozygous carrier parents.
  features: >-
    Biallelic loss-of-function variants in the C-terminal death domain of
    EDARADD (chromosome 1q42.3-q43) cause autosomal recessive hypohidrotic
    ectodermal dysplasia (ECTD11B, OMIM 614941, HED3). Because EDARADD has two
    alternatively spliced isoforms differing by 10 N-terminal amino acids
    (205-amino-acid isoform A and 215-amino-acid isoform B), the original
    recessive missense variant is numbered p.Glu142Lys in isoform A (Bal et al.
    2007) and p.Glu152Lys (p.E152K) in isoform B (Asano et al. 2021); it shows
    a mild reduction in TRAF6 binding affinity while retaining significant
    ability to activate the NF-κB pathway and therefore causes disease only in
    the homozygous state. Homozygous truncating variants in the last exon, such
    as c.322_323insCGGGC p.(Arg108ProfsTer7), also cause classic autosomal
    recessive HED. Across all HED cohorts, EDARADD pathogenic variants account
    for ~1%–2% of cases.
  variants:
  - name: p.Glu142Lys (p.E152K)
    description: >-
      Recessively inherited missense substitution in the C-terminal death domain
      of EDARADD (numbered p.Glu142Lys in the 205-amino-acid isoform A used by
      Bal et al. 2007, and p.Glu152Lys [p.E152K] in the 215-amino-acid isoform B
      used by Asano et al. 2021) that causes a mild reduction in TRAF6 binding
      affinity and reduced NF-κB activation while retaining significant residual
      NF-κB pathway activity, causing classic autosomal recessive hypohidrotic
      ectodermal dysplasia (ECTD11B) when homozygous.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:11780064
      reference_title: "Gene defect in ectodermal dysplasia implicates a death domain adapter in development."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We also identify a missense mutation in its human orthologue, EDARADD,
        that is present in a family affected with hypohidrotic ectodermal
        dysplasia.
      explanation: >-
        Original report identifying the human EDARADD missense mutation in a
        family affected with hypohidrotic ectodermal dysplasia.
    - reference: PMID:17354266
      reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrated that the p.Leu112Arg mutation completely abrogated
        NF-kB activation, whereas the p.Glu142Lys retained the ability to
        significantly activate the NF-kB pathway.
      explanation: >-
        Demonstrates that the recessive p.Glu142Lys (isoform A) variant is a
        hypomorphic allele that retains significant NF-κB activation in vitro,
        explaining why heterozygous carriers are unaffected.
    - reference: PMID:34219261
      reference_title: "Characterization of EDARADD gene mutations responsible for hypohidrotic ectodermal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In this study, we performed detailed in vitro analyses in order to
        characterize three dominantly inherited missense mutations, p.D120Y,
        p.L122R, and p.D123N, and one recessively inherited missense mutation,
        p.E152K, in the EDARADD gene. Nuclear factor (NF)-κB reporter assays
        demonstrated that all the mutant EDARADD showed reduction in activation
        of NF-κB.
      explanation: >-
        Confirms in isoform B numbering (p.E152K = isoform A p.Glu142Lys) that
        the recessively inherited missense variant reduces NF-κB activation.
    - reference: PMID:34219261
      reference_title: "Characterization of EDARADD gene mutations responsible for hypohidrotic ectodermal dysplasia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, we found that p.D120Y-, p.L122R-, and p.D123N-mutant EDARADD
        completely lost the ability to bind with TRAF6, while p.E152K-mutant
        EDARADD showed a mild reduction in the affinity.
      explanation: >-
        Demonstrates that the recessive p.E152K mutant shows only a mild
        reduction in TRAF6 binding affinity compared with the complete loss seen
        in dominant mutants.
  - name: c.402-407del (p.Thr135-Val136del)
    description: >-
      Homozygous 6-bp in-frame deletion in the death domain of EDARADD
      identified in a patient born to consanguineous parents that impairs the
      EDAR-EDARADD interaction and severely inhibits canonical NF-κB activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:20222921
      reference_title: "Mutations in EDARADD account for a small proportion of hypohidrotic ectodermal dysplasia cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified one EDARADD 6-bp homozygous in-frame deletion
        (c.402-407del, p.Thr135-Val136del) in a patient born to consanguineous
        parents. Functional studies showed that the p.Thr135-Val136del impaired
        the EDAR-EDARADD interaction and then severely inhibited NF-kappaB
        activity.
      explanation: >-
        Identifies the homozygous c.402-407del (p.Thr135-Val136del) in-frame
        deletion in autosomal recessive EDARADD-related HED and demonstrates
        loss of EDAR-EDARADD binding and NF-κB activation.
  - name: c.322_323insCGGGC (p.Arg108ProfsTer7)
    description: >-
      Homozygous 5-bp frameshift insertion in the last exon of EDARADD
      identified in two siblings from a family with heterozygous carrier parents
      presenting with classic autosomal recessive hypohidrotic ectodermal
      dysplasia.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38840186
      reference_title: "Novel homozygous frameshift insertion variant in the last exon of the EDARADD causing hypohidrotic ectodermal dysplasia in two siblings: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After thorough examination and patient history evaluation, targeted
        next-generation sequencing analysis yielded the novel homozygous
        insertion variant c.322_323insCGGGC p.(Arg108ProfsTer7) in EDARADD. The
        mutation has not been reported to date in the literature.
      explanation: >-
        Identifies the homozygous c.322_323insCGGGC p.(Arg108ProfsTer7)
        frameshift insertion variant in autosomal recessive EDARADD-related HED.
  case_fractions:
  - population: All hypohidrotic ectodermal dysplasia cases
    case_fraction_low: 0.0
    case_fraction_high: 2.0
    notes: >-
      In a 61-patient French HED cohort (PMID:20979233), EDA, EDAR, WNT10A, and
      EDARADD together explained 92% (56/61) of cases, with EDA accounting for
      58% and WNT10A and EDAR 16% each (leaving ~2% by subtraction for
      EDARADD). In a 261-family Russian HED cohort with 183 genetically solved
      probands (PMID:41645317), 0% (0/183) carried pathogenic EDARADD variants.
    evidence:
    - reference: PMID:20979233
      reference_title: "Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic ectodermal dysplasia cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These four genes accounted for 92% (56/61 patients) of HED/EDA cases:
        (1) the EDA1 gene was the most common disease-causing gene (58% of
        cases), (2)WNT10A and EDAR were each responsible for 16% of cases.
      explanation: >-
        Establishes that EDARADD accounts for the remaining ~2% of HED cases
        among the 92% solved by the four core genes.
    - reference: PMID:41645317
      reference_title: "Mutational spectrum of EDA, EDAR, EDARADD, and WNT10A genes in the largest cohort of Russian patients with hypohidrotic ectodermal dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pathogenic or likely pathogenic variants were identified in 183 probands
        (70.1%). The distribution of mutated genes was as follows: EDA (n = 155,
        84.7%), WNT10A (n = 16, 8.8%), and EDAR (n = 12, 6.5%). No apparent
        pathogenic mutations were detected in EDARADD.
      explanation: >-
        Documents a 0% (0/183) EDARADD case fraction among genetically solved
        probands in a 261-family Russian HED cohort.
  evidence:
  - reference: PMID:11780064
    reference_title: "Gene defect in ectodermal dysplasia implicates a death domain adapter in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identify a missense mutation in its human orthologue, EDARADD,

inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function variants in EDARADD cause autosomal recessive
    hypohidrotic ectodermal dysplasia (ECTD11B), the primary form represented
    by MONDO:0013983.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDA-related HED is inherited in an X-linked manner. EDAR-, EDARADD-, and
      WNT10A-related HED are inherited in an autosomal recessive or an
      autosomal dominant manner.
    explanation: >-
      GeneReviews confirms that pathogenic variants in EDARADD cause autosomal
      recessive or autosomal dominant HED.
  - reference: PMID:17354266
    reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, mutations in a recently identified gene, EDARADD, encoding
      EDAR-associated death domain (EDARADD) have been shown to cause autosomal
      recessive EDA.
    explanation: >-
      Confirms autosomal recessive inheritance of EDARADD-related ectodermal
      dysplasia.
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous missense variants in the death domain of EDARADD (such as
    p.Leu112Arg, p.Asp120Tyr, and p.Asp123Asn) act through a dominant-negative
    mechanism to cause autosomal dominant hypohidrotic ectodermal dysplasia
    (ECTD11A).
  evidence:
  - reference: PMID:17354266
    reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a large Moroccan family with an autosomal dominant EDA. We
      mapped the disease gene to chromosome 1q42.2-q43, and identified a novel
      missense mutation in the EDARADD gene (c.335T>G, p.Leu112Arg). Thus, the
      EDARADD gene accounts for both recessive and dominant EDA.
    explanation: >-
      Demonstrates that EDARADD mutations also cause autosomal dominant
      hypohidrotic ectodermal dysplasia.
prevalence:
- population: Global and cohort studies of hypohidrotic ectodermal dysplasia
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    EDARADD is the rarest of the four major HED genes (EDA, EDAR, WNT10A, and
    EDARADD). In a cohort of 28 HED patients lacking EDA and EDAR mutations,
    only 1 patient (3.6%) carried a pathogenic EDARADD variant; in a 61-patient
    HED cohort, EDARADD was the least frequent of the four core genes; in an
    Egyptian ED cohort, EDARADD accounted for 10% of molecularly solved cases;
    and in a 183-patient Russian HED cohort, 0 patients had EDARADD mutations.
  evidence:
  - reference: PMID:20222921
    reference_title: "Mutations in EDARADD account for a small proportion of hypohidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study demonstrates that EDARADD mutations are not a frequent cause of
      HED, while mutations in TRAF6, TAB2 and TAK1 may not be implicated in
      this disease.
    explanation: >-
      Cohort screening of 28 non-EDA/EDAR HED probands identified only one
      homozygous EDARADD mutation, confirming its rarity.
  - reference: PMID:34573371
    reference_title: "Gene Mutations of the Three Ectodysplasin Pathway Key Players (EDA, EDAR, and EDARADD) Account for More than 60% of Egyptian Ectodermal Dysplasia: A Report of Seven Novel Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDA is the most common gene contributing to 85% of the identified Egyptian
      ED genetic spectrum, followed by EDARADD (10%) and EDAR (5%).
    explanation: >-
      Documents that EDARADD variants accounted for 10% of solved ectodermal
      dysplasia families in an Egyptian cohort.
  - reference: PMID:41645317
    reference_title: "Mutational spectrum of EDA, EDAR, EDARADD, and WNT10A genes in the largest cohort of Russian patients with hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No apparent pathogenic mutations were detected in EDARADD.
    explanation: >-
      In a cohort of 183 Russian HED probands, no pathogenic EDARADD variants
      were found, underscoring the very low prevalence of EDARADD-related HED.
progression:
- phase: Infancy
  age_range: 0-2 years
  notes: >-
    Presents in infancy with thin, slow-growing scalp hair, dry skin, and
    episodes of unexplained hyperthermia in warm environments due to deficient
    sweating, followed by delayed eruption of sparse, conical teeth.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic HED can be diagnosed after infancy based on physical features in
      most affected individuals.
    explanation: >-
      GeneReviews describes the early clinical presentation and timing of
      recognition around infancy.
- phase: Childhood to Adulthood
  age_range: 2 years to adulthood
  notes: >-
    Physical growth and psychomotor development are otherwise normal; survival
    and long-term prognosis are favorable once environmental thermoregulation
    and dental rehabilitation are established.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical growth and psychomotor development are otherwise within normal
      limits.
    explanation: >-
      GeneReviews confirms normal physical growth and neurodevelopment in HED
      outside ectodermal appendage defects and heat-related risks.
genetic:
- name: EDARADD Loss-of-Function Variants
  association: Pathogenic Variants
  gene_term:
    preferred_term: EDARADD
    term:
      id: hgnc:14341
      label: EDARADD
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  features: >-
    Biallelic loss-of-function mutations in EDARADD cause HED3 (ECTD11B).
    EDARADD encodes a death domain-containing adaptor protein that interacts
    with the intracellular death domain of EDAR and recruits TRAF6 to activate
    the NF-κB pathway. Most reported mutations are missense or small indel
    variants affecting the C-terminal death domain. Recessive variants
    typically retain partial NF-κB activation or truncate the death domain,
    whereas dominant EDARADD variants (causing ECTD11A) completely abolish
    TRAF6 binding and act via a dominant-negative mechanism.
  variants:
  - name: p.Glu142Lys (p.E142K)
    description: >-
      Recessive missense variant in the death domain of EDARADD. The first
      EDARADD mutation identified in a human HED family. Retains partial
      ability to activate NF-κB and reduced TRAF6 binding affinity, consistent
      with autosomal recessive inheritance.
    evidence:
    - reference: PMID:17354266
      reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We demonstrated that the p.Leu112Arg mutation completely abrogated
        NF-kB activation, whereas the p.Glu142Lys retained the ability to
        significantly activate the NF-kB pathway.
      explanation: >-
        Demonstrates that the recessive p.Glu142Lys mutation retains partial
        NF-κB signaling activity.
  - name: p.Thr135_Val136del
    description: >-
      Recessive in-frame deletion of two residues (c.402_407del) in the death
      domain. Identified in a consanguineous family. Impairs the EDAR-EDARADD
      interaction and severely inhibits NF-κB activity.
    evidence:
    - reference: PMID:20222921
      reference_title: "Mutations in EDARADD account for a small proportion of hypohidrotic ectodermal dysplasia cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified one EDARADD 6-bp homozygous in-frame deletion
        (c.402-407del, p.Thr135-Val136del) in a patient born to
        consanguineous parents.
      explanation: >-
        Identifies the homozygous in-frame deletion p.Thr135_Val136del in an
        autosomal recessive HED patient.
  - name: p.Arg108ProfsTer7
    description: >-
      Recessive homozygous frameshift insertion (c.322_323insCGGGC) in the
      last exon of EDARADD, introducing a premature stop codon in the death
      domain. Identified in two consanguineous siblings with classical HED.
    evidence:
    - reference: PMID:38840186
      reference_title: "Novel homozygous frameshift insertion variant in the last exon of the EDARADD causing hypohidrotic ectodermal dysplasia in two siblings: case report and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        targeted next-generation sequencing analysis yielded the novel
        homozygous insertion variant c.322_323insCGGGC p.(Arg108ProfsTer7)
        in EDARADD.
      explanation: >-
        Identifies the homozygous frameshift insertion p.Arg108ProfsTer7 in two
        affected siblings.
  - name: p.Leu112Arg (p.L112R)
    description: >-
      Autosomal dominant missense variant (c.335T>G) in the death domain of
      EDARADD that completely abolishes NF-κB activation and TRAF6 binding,
      acting via a dominant-negative mechanism.
    evidence:
    - reference: PMID:17354266
      reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We mapped the disease gene to chromosome 1q42.2-q43, and identified a
        novel missense mutation in the EDARADD gene (c.335T>G, p.Leu112Arg).
      explanation: >-
        Identifies p.Leu112Arg as a dominant EDARADD mutation in a large
        Moroccan family.
  evidence:
  - reference: PMID:11780064
    reference_title: "Gene defect in ectodermal dysplasia implicates a death domain adapter in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identify a missense mutation in its human orthologue, EDARADD,
      that is present in a family affected with hypohidrotic ectodermal
      dysplasia.
    explanation: >-
      Headon et al. identified the first human EDARADD mutation in an HED
      family.
  - reference: PMID:17354266
    reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrated that the p.Leu112Arg mutation completely abrogated
      NF-kB activation, whereas the p.Glu142Lys retained the ability to
      significantly activate the NF-kB pathway.
    explanation: >-
      Bal et al. showed that dominant and recessive EDARADD mutations have
      different functional consequences on NF-κB activation.
  - reference: PMID:20222921
    reference_title: "Mutations in EDARADD account for a small proportion of hypohidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified one EDARADD 6-bp homozygous in-frame deletion
      (c.402-407del, p.Thr135-Val136del) in a patient born to
      consanguineous parents.
    explanation: >-
      Chassaing et al. identified an in-frame deletion in EDARADD that

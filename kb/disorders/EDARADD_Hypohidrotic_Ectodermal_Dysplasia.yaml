name: EDARADD-Related Hypohidrotic Ectodermal Dysplasia
creation_date: "2026-04-24T00:00:00Z"
description: >-
  EDARADD-related hypohidrotic ectodermal dysplasia is an ultra-rare congenital
  ectodermal dysplasia caused by biallelic loss-of-function (autosomal recessive
  ECTD11B, OMIM 614941, HED3) or heterozygous dominant-negative (autosomal
  dominant ECTD11A, OMIM 614940) pathogenic variants in EDARADD, which encodes
  the intracellular death domain adaptor protein that couples the ectodysplasin A
  receptor (EDAR) to TRAF6/TAB2/TAK1-mediated canonical NF-κB activation during
  embryonic ectodermal placode morphogenesis. Disruption of EDARADD-dependent
  NF-κB signaling impairs the development of eccrine sweat glands, hair
  follicles, and teeth, producing the classic triad of hypohidrosis or
  anhidrosis with heat intolerance, hypotrichosis (sparse scalp and body hair),
  and hypodontia with conical teeth, clinically indistinguishable
  from EDA- and EDAR-related hypohidrotic ectodermal dysplasia.
category: Mendelian
parents:
- Ectodermal Dysplasia
synonyms:
- HED3
- ECTD11B
- ECTD11A
- EDARADD-related HED
- autosomal recessive hypohidrotic ectodermal dysplasia
- autosomal dominant hypohidrotic ectodermal dysplasia
- ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
- ectodermal dysplasia 11A, hypohidrotic/hair/tooth type, autosomal dominant

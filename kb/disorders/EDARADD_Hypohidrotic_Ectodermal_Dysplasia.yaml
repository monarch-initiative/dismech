has_subtypes:
- name: AR
  display_name: Autosomal Recessive EDARADD-Related HED (ECTD11B, OMIM 614941)
  description: >-
    Classic autosomal recessive subtype (ECTD11B, OMIM 614941, MONDO:0013983,
    HED3) caused by biallelic loss-of-function variants in EDARADD, such as
    homozygous c.424G>A (p.Glu142Lys in the 205-amino-acid isoform A;
    p.Glu152Lys in the 215-amino-acid isoform B), homozygous c.402-407del
    (p.Thr135-Val136del), or homozygous c.322_323insCGGGC (p.Arg108ProfsTer7).
    Affects males and females with equal severity and produces the full classic
    HED triad of hypohidrosis, sparse hair, and hypodontia with conical teeth.
  subtype_term:
    preferred_term: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
    term:
      id: MONDO:0013983
      label: ectodermal dysplasia 11B, hypohidrotic/hair/tooth type, autosomal recessive
- name: AD
  display_name: Autosomal Dominant EDARADD-Related HED (ECTD11A, OMIM 614940)
  description: >-
    Autosomal dominant subtype (ECTD11A, OMIM 614940, MONDO:0013982) caused by
    heterozygous missense variants in the C-terminal death domain of EDARADD,
    including c.335T>G (p.Leu112Arg in isoform A; c.365T>G, p.Leu122Arg in
    isoform B), c.358G>T (p.Asp120Tyr in isoform B), and c.367G>A (p.Asp123Asn
    in isoform B). Mutant proteins lose affinity for TRAF6 while retaining
    self-association with wild-type EDARADD, exerting a dominant-negative effect
    on canonical NF-κB activation.
  subtype_term:
    preferred_term: ectodermal dysplasia 11A, hypohidrotic/hair/tooth type, autosomal dominant
    term:
      id: MONDO:0013982
      label: ectodermal dysplasia 11A, hypohidrotic/hair/tooth type, autosomal dominant
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function variants in EDARADD (such as homozygous
    c.424G>A [p.Glu142Lys in isoform A / p.Glu152Lys in isoform B], homozygous
    in-frame deletion c.402-407del [p.Thr135-Val136del], or homozygous
    frameshift c.322_323insCGGGC [p.Arg108ProfsTer7]) cause classic autosomal
    recessive hypohidrotic ectodermal dysplasia (ECTD11B, OMIM 614941),
    affecting males and females with equal severity. When both parents are known
    heterozygous carriers, each sibling of an affected individual has at
    conception a 25% chance of being affected, a 50% chance of being an
    asymptomatic heterozygote, and a 25% chance of inheriting neither familial
    pathogenic variant.
  evidence:
  - reference: PMID:11780064
    reference_title: "Gene defect in ectodermal dysplasia implicates a death domain adapter in development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identify a missense mutation in its human orthologue, EDARADD,
      that is present in a family affected with hypohidrotic ectodermal
      dysplasia.
    explanation: >-
      Original identification of a homozygous EDARADD death domain missense
      mutation in a consanguineous family segregating autosomal recessive
      hypohidrotic ectodermal dysplasia.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EDA-related HED is inherited in an X-linked manner. EDAR-, EDARADD-, and
      WNT10A-related HED are inherited in an autosomal recessive or an
      autosomal dominant manner.
    explanation: >-
      GeneReviews confirms autosomal recessive inheritance as a primary mode of
      inheritance for EDARADD-related HED.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a pathogenic variant,
      each sib of an affected individual has at conception a 25% chance of
      being affected, a 50% chance of being heterozygous, and a 25% chance of
      inheriting neither of the familial pathogenic variants.
    explanation: >-
      Documents standard autosomal recessive sibling recurrence risks (25%
      affected, 50% heterozygous carrier, 25% unaffected non-carrier) for
      families with biallelic EDARADD pathogenic variants.
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous missense variants in the death domain of EDARADD—which encodes
    two alternatively spliced isoforms differing by 10 N-terminal amino acids
    (205-amino-acid isoform A and 215-amino-acid isoform B)—including c.335T>G
    (p.Leu112Arg in isoform A, corresponding to c.365T>G, p.Leu122Arg in
    isoform B), c.358G>T (p.Asp120Tyr in isoform B, residue 110 in isoform A),
    and c.367G>A (p.Asp123Asn in isoform B, residue 113 in isoform A), cause
    autosomal dominant hypohidrotic ectodermal dysplasia (ECTD11A, OMIM 614940)
    through a dominant-negative mechanism that impairs TRAF6 recruitment and
    suppresses wild-type EDARADD-mediated NF-κB activation. Each child of an
    individual with autosomal dominant EDARADD-related HED has a 50% chance of
    inheriting the pathogenic variant.
  evidence:
  - reference: PMID:17354266
    reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a large Moroccan family with an autosomal dominant EDA.
      We mapped the disease gene to chromosome 1q42.2-q43, and identified a
      novel missense mutation in the EDARADD gene (c.335T>G, p.Leu112Arg).
      Thus, the EDARADD gene accounts for both recessive and dominant EDA.
    explanation: >-
      Establishes autosomal dominant inheritance of EDARADD-related
      hypohidrotic ectodermal dysplasia in a multi-generation family carrying
      heterozygous c.335T>G (p.Leu112Arg in isoform A).
  - reference: PMID:34219261
    reference_title: "Characterization of EDARADD gene mutations responsible for hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we performed detailed in vitro analyses in order to
      characterize three dominantly inherited missense mutations, p.D120Y,
      p.L122R, and p.D123N, and one recessively inherited missense mutation,
      p.E152K, in the EDARADD gene. Nuclear factor (NF)-κB reporter assays
      demonstrated that all the mutant EDARADD showed reduction in activation
      of NF-κB. Importantly, p.D120Y-, p.L122R-, and p.D123N-mutant EDARADD
      slightly reduced the NF-κB activity induced by wild-type EDARADD in a
      dominant negative manner.
    explanation: >-
      Confirms that heterozygous EDARADD death domain variants (numbered in the
      215-amino-acid isoform B, where p.L122R corresponds to isoform A
      p.Leu112Arg) are dominantly inherited and act via a dominant-negative
      effect on NF-κB signaling.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with autosomal dominant HED has a 50% chance
      of inheriting the EDAR, EDARADD, or WNT10A pathogenic variant.
    explanation: >-
      Documents the 50% offspring transmission risk for autosomal dominant
      EDARADD-related HED.
prevalence:
- population: Hypohidrotic ectodermal dysplasia patient cohorts
  notes: >-
    EDARADD-related HED is the rarest of the four core HED genetic forms: in a
    French screen of 28 EDA/EDAR-negative HED families (PMID:20222921), only 1
    carried a causative EDARADD mutation; in a 61-patient French HED cohort
    (PMID:20979233), the four core genes accounted for 92% (56/61) of cases
    (EDA 58%, WNT10A 16%, EDAR 16%, leaving ~2% for EDARADD); and in a
    261-family Russian HED cohort with 183 genetically solved probands
    (PMID:41645317), 0 of 183 carried pathogenic EDARADD variants.
  evidence:
  - reference: PMID:20222921
    reference_title: "Mutations in EDARADD account for a small proportion of hypohidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified one EDARADD 6-bp homozygous in-frame deletion
      (c.402-407del, p.Thr135-Val136del) in a patient born to consanguineous
      parents. Functional studies showed that the p.Thr135-Val136del impaired
      the EDAR-EDARADD interaction and then severely inhibited NF-kappaB
      activity. In the remaining 27 patients, we failed to find causative
      mutations in EDARADD, or in TRAF6, TAB2 or TAK1.
    explanation: >-
      Demonstrates that EDARADD mutations account for only 1 of 28
      EDA/EDAR-negative HED probands screened.
  - reference: PMID:20979233
    reference_title: "Only four genes (EDA1, EDAR, EDARADD, and WNT10A) account for 90% of hypohidrotic/anhidrotic ectodermal dysplasia cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These four genes accounted for 92% (56/61 patients) of HED/EDA cases: (1)
      the EDA1 gene was the most common disease-causing gene (58% of cases),
      (2)WNT10A and EDAR were each responsible for 16% of cases.
    explanation: >-
      Shows that across the 92% (56/61) of HED cases solved by the four core
      genes (EDA1 58%, WNT10A 16%, EDAR 16%), EDARADD accounts for the
      remaining ~2% of cases.
  - reference: PMID:41645317
    reference_title: "Mutational spectrum of EDA, EDAR, EDARADD, and WNT10A genes in the largest cohort of Russian patients with hypohidrotic ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic or likely pathogenic variants were identified in 183 probands
      (70.1%). The distribution of mutated genes was as follows: EDA (n = 155,
      84.7%), WNT10A (n = 16, 8.8%), and EDAR (n = 12, 6.5%). No apparent
      pathogenic mutations were detected in EDARADD.
    explanation: >-
      Confirms the extreme rarity of EDARADD-related HED, with 0 of 183
      genetically solved HED probands carrying pathogenic EDARADD variants in a
      261-family cohort.
progression:
- phase: Infancy
  age_range: 0-1 years
  notes: >-
    Cardinal features of classic hypohidrotic ectodermal dysplasia become
    obvious during childhood. Deficient sweating causes recurrent episodes of
    hyperthermia until the affected individual or family acquires experience
    with environmental modifications to control body temperature.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The cardinal features of classic HED become obvious during childhood.
    explanation: >-
      Documents childhood clinical recognition of the cardinal HED triad.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sweating, although present, is greatly deficient, leading to episodes of
      hyperthermia until the affected individual or family acquires experience
      with environmental modifications to control temperature.
    explanation: >-
      Documents early-life hyperthermia episodes due to deficient sweating
      prior to implementation of environmental cooling measures.
- phase: Childhood to Adulthood
  age_range: 1-18+ years
  notes: >-
    Physical growth and psychomotor development are otherwise within normal
    limits, while missing and conical teeth require staged dental rehabilitation
    from early childhood through adulthood, including bonding of conical teeth,
    orthodontics, removable prostheses replaced approximately every 2.5 years
    during growth, and dental implants in older children and adults.
  evidence:
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical growth and psychomotor development are otherwise within normal
      limits.
    explanation: >-
      Confirms normal physical growth and psychomotor development throughout
      childhood and adulthood in HED.
  - reference: PMID:20301291
    reference_title: "Hypohidrotic Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early dental treatment; bonding of conical teeth; orthodontics as
      necessary; dental implants in the anterior portion of the mandibular arch
      in older children; replacement of dental prostheses as needed, often
      every 2.5 years; dental implants in adults;
    explanation: >-
      Documents the longitudinal dental rehabilitation trajectory from early
      childhood through adulthood.
pathophysiology:
- name: Disrupted EDA-EDAR-EDARADD-NF-κB Signaling
  conforms_to: "eda_edar_nfkb_ectodermal_appendage#EDA-EDAR-EDARADD Canonical NF-kappaB Signaling Failure"
  description: >-
    EDARADD encodes the intracellular death domain adaptor protein—expressed as
    two alternatively spliced isoforms differing by 10 N-terminal amino acids
    (205-amino-acid isoform A and 215-amino-acid isoform B)—that self-associates
    and interacts via its C-terminal death domain with the cytoplasmic death
    domain of the ectodysplasin A receptor (EDAR), linking ligand-bound EDAR to
    TRAF6, TAB2, and TAK1 to activate the IKK complex and canonical NF-κB
    transcription in embryonic surface ectoderm. Biallelic loss-of-function
    variants (such as c.424G>A [p.Glu142Lys in isoform A / p.Glu152Lys in
    isoform B], which impairs EDAR interaction while retaining partial NF-κB
    activity, c.402-407del [p.Thr135-Val136del], or frameshift insertions in the
    death domain) and heterozygous dominant-negative death domain missense
    variants (c.335T>G [p.Leu112Arg in isoform A / c.365T>G, p.Leu122Arg in
    isoform B], c.358G>T [p.Asp120Tyr in isoform B], and c.367G>A [p.Asp123Asn
    in isoform B], which abolish TRAF6 binding and suppress wild-type EDARADD
    signaling) abrogate downstream canonical NF-κB activation required for
    ectodermal placode induction and morphogenesis of eccrine sweat glands, hair
    follicles, and teeth.

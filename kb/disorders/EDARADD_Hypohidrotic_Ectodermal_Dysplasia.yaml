- name: EDARADD Heterozygous Dominant-Negative Variants
  subtype: AD
  association: Pathogenic Variants
  gene_term:
    preferred_term: EDARADD
    term:
      id: hgnc:14341
      label: EDARADD
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:17354266
      reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report a large Moroccan family with an autosomal dominant EDA.
        We mapped the disease gene to chromosome 1q42.2-q43, and identified a
        novel missense mutation in the EDARADD gene (c.335T>G, p.Leu112Arg).
        Thus, the EDARADD gene accounts for both recessive and dominant EDA.
      explanation: >-
        Establishes autosomal dominant EDARADD-related HED (ECTD11A) caused by
        a heterozygous death-domain missense mutation.
  features: >-
    Heterozygous missense variants clustering in a narrow region of the
    C-terminal death domain of EDARADD cause autosomal dominant hypohidrotic
    ectodermal dysplasia (ECTD11A, OMIM 614940). Due to a 10-amino-acid
    N-terminal offset between EDARADD isoform A (205 aa; used by Bal et al.
    2007) and isoform B (215 aa; used by Asano et al. 2021), the prototype
    dominant variant is reported as c.335T>G (p.Leu112Arg) in isoform A and as
    p.Leu122Arg (p.L122R) in isoform B, alongside the adjacent isoform B
    dominantly inherited missense variants p.Asp120Tyr (p.D120Y) and
    p.Asp123Asn (p.D123N). All three dominant-negative mutants markedly prevent
    the interaction between EDAR and wild-type EDARADD, completely lose the
    ability to bind TRAF6, and suppress NF-κB activation induced by wild-type
    EDARADD.
  variants:
  - name: c.335T>G (p.Leu112Arg / p.L122R)
    description: >-
      Heterozygous missense variant in the death domain of EDARADD—reported as
      c.335T>G (p.Leu112Arg) in the 205-amino-acid isoform A (Bal et al. 2007)
      and as p.Leu122Arg (p.L122R) in the 215-amino-acid isoform B (Asano et al.
      2021)—that completely abrogates NF-κB activation, loses the ability to
      bind TRAF6, prevents the interaction between EDAR and wild-type EDARADD,
      and causes autosomal dominant hypohidrotic ectodermal dysplasia (ECTD11A)
      via a dominant-negative mechanism.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:17354266
      reference_title: "Autosomal dominant anhidrotic ectodermal dysplasias at the EDARADD locus."
      supports: SUPPORT

name: EDARADD-Related Hypohidrotic Ectodermal Dysplasia
creation_date: "2026-04-24T00:00:00Z"
description: >-
  EDARADD-related hypohidrotic ectodermal dysplasia (HED3, ECTD11B) is an
  autosomal recessive disorder caused by biallelic loss-of-function mutations
  in EDARADD, which encodes the EDAR-associated death domain adaptor protein.
  Heterozygous dominant-negative variants in EDARADD also cause an autosomal
  dominant form (ECTD11A). EDARADD is an essential intracellular signal
  transducer that links the ectodysplasin receptor EDAR to downstream NF-κB
  activation via the TAB2/TRAF6/TAK1 complex. Loss of EDARADD function blocks
  EDA-EDAR-NF-κB signaling required for ectodermal appendage morphogenesis,
  producing the classic triad of hypohidrosis, hypotrichosis, and hypodontia.
  EDARADD mutations account for a small proportion of HED cases; the X-linked
  form (EDA mutations) is by far the most common, followed by EDAR and WNT10A
  mutations.

- name: Mitotic Spindle Disorganization and Cytokinesis Failure
  biological_scale: CELLULAR
  conforms_to: "neural_progenitor_centrosome_spindle_dysfunction#Centrosome and Mitotic Spindle Perturbation"
  description: >-
    Without CKAP2L at the spindle poles, dividing cells assemble disorganized,
    multipolar, and shortened mitotic spindles. The downstream mitotic
    consequences are twofold: chromosome missegregation (including chromosome
    bridges between separating daughter nuclei in the mouse knockdown model)
    and outright cytokinesis failure producing multinucleated cells. This is the
    conserved centrosome/spindle perturbation node of the neural-progenitor
    module, instantiated here by a spindle-pole-associated MAP rather than by a
    centriole-duplication or microtubule-severing lesion.

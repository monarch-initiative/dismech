pathophysiology:
- name: CKAP2L Loss of Function and Mitotic Spindle Dysfunction
  description: >
    CKAP2L (cytoskeleton-associated protein 2-like) is the human homolog of the
    mouse Radmis gene (radial fiber and mitotic spindle) and localizes to the
    mitotic spindle poles, where it is required for orderly cell division of
    neural progenitors. Biallelic loss-of-function mutations abolish CKAP2L at
    the spindle poles in dividing cells, producing an increased number of
    disorganized, multipolar spindle configurations and defects in chromosome
    segregation.
  cell_types:
  - preferred_term: Radial glial cell (neural progenitor)
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: Mitotic spindle organization
    term:
      id: GO:0007052
      label: mitotic spindle organization
    modifier: DECREASED
  - preferred_term: Chromosome segregation
    term:
      id: GO:0007059
      label: chromosome segregation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The function of this protein was unknown until it was rediscovered in mice as Radmis (radial fiber and mitotic spindle) and shown to play a pivotal role in cell division of neural progenitors."
    explanation: Identifies CKAP2L/Radmis as a mitotic-spindle protein essential for neural-progenitor cell division.
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "dividing LCLs established from the individuals homozygous for the c.571dupA mutation did not show CKAP2L at the spindle poles."
    explanation: Patient-derived cells demonstrate loss of CKAP2L spindle-pole localization.
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed an increase in the number of disorganized spindle microtubules owing to multipolar configurations and defects in chromosome segregation."
    explanation: Patient cells show multipolar spindles and chromosome-segregation defects, the cellular phenotype of CKAP2L loss.
  downstream:
  - target: Impaired Neural Progenitor Proliferation and Microcephaly
    description: >
      Loss of CKAP2L spindle-pole function and defective chromosome segregation
      in dividing neural progenitors reduce the progenitor pool driving cortical
      and somatic growth.
    causal_link_type: DIRECT
- name: Impaired Neural Progenitor Proliferation and Microcephaly
  description: >
    Defective mitotic-spindle function and abnormal chromosome segregation in
    proliferating neural progenitors compromise the symmetric/asymmetric
    divisions that expand and differentiate the progenitor pool during
    corticogenesis. The resulting reduction in progenitor output underlies the
    congenital microcephaly and contributes to the pre- and postnatal growth
    failure and neurodevelopmental impairment seen in Filippi syndrome.
  cell_types:
  - preferred_term: Neural stem/progenitor cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: Cell division
    term:
      id: GO:0051301
      label: cell division
    modifier: DECREASED
  evidence:
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings show that loss-of-function mutations in CKAP2L are a major cause of Filippi syndrome."
    explanation: Ties CKAP2L loss of function to the Filippi syndrome phenotype, of which microcephaly is a core feature.

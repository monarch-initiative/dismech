genetic:
- name: CKAP2L Biallelic Loss-of-Function Mutations
  gene_term:
    preferred_term: CKAP2L
    term:
      id: hgnc:26877
      label: CKAP2L
  association: Causative
  relationship_type: CAUSATIVE
  notes: >
    Biallelic (typically homozygous frameshift) loss-of-function mutations in
    CKAP2L, encoding cytoskeleton-associated protein 2-like (the human homolog
    of the mouse Radmis gene), are the major cause of Filippi syndrome. The
    index Sardinian family carried a homozygous frameshift, c.571dupA
    (p.Ile191Asnfs*6). Additional homozygous frameshift variants
    (e.g., c.554_555del, c.981_982del, c.1463_1467del) have been reported in
    subsequent families.
  evidence:
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in CKAP2L, encoding the protein cytoskeleton-associated protein 2-like (CKAP2L)"
    explanation: Identifies CKAP2L as the causative gene for Filippi syndrome.
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings show that loss-of-function mutations in CKAP2L are a major cause of Filippi syndrome."
    explanation: Establishes loss-of-function CKAP2L mutations as the major cause of Filippi syndrome.
  - reference: PMID:38738944
    reference_title: "Filippi syndrome: Three new families suggest that urinary system abnormalities may belong to clinical spectrum of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients had homozygous frameshift variants of the CKAP2L gene"
    explanation: Confirms recurrent homozygous frameshift CKAP2L variants in additional families.

      label: chromosome segregation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25439729
    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we observed an increase in the number of disorganized spindle microtubules owing to multipolar configurations and defects in chromosome segregation."
    explanation: Documents multipolar spindles and chromosome-segregation defects in cultured cells from affected individuals as the cellular consequence of CKAP2L loss.
  downstream:
  - target: Neural Progenitor Division Failure
- name: Neural Progenitor Division Failure
  description: >-
    CKAP2L/Radmis plays a pivotal role in the cell division of neural
    progenitors. Disorganized spindles and defective chromosome segregation
    impair the proliferative division of neural progenitor cells during
    corticogenesis, reducing the final complement of cortical neurons and
    producing congenital microcephaly. A parallel proposed role for CKAP2L in
    regulating apoptosis has been invoked to explain the syndactyly, though this
    limb component is less well established than the neural mechanism.
  cell_types:
  - preferred_term: Neural progenitor cell
    term:
      id: CL:0000047
      label: neural stem cell

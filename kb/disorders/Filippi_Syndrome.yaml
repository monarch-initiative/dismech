discussions:
- discussion_id: gap_filippi_genotype_phenotype
  prompt: >-
    What is the genotype-phenotype correlation in Filippi syndrome, and how
    should CKAP2L-related disease be distinguished from Filippi-like overlapping
    craniodigital phenotypes that lack confirmed CKAP2L variants? Most reported
    variants are truncating loss-of-function alleles, but a missense allele and
    a broadening phenotypic spectrum (dental, skeletal, cardiovascular,
    genitourinary, and additional neurologic features) have been described,
    largely in small case reports and some consanguineous or
    molecularly-unconfirmed families.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neural Progenitor Division Failure
  - genetic#CKAP2L
  rationale: >-
    The 2026 systematic review explicitly concludes that the full clinical and
    genetic spectrum remains poorly defined, that Filippi-like overlapping
    phenotypes complicate diagnosis, and that further studies are needed to
    delineate genotype-phenotype correlation and standardize treatment
    guidelines. Because many older reports lacked molecular confirmation or
    involved consanguineous families in whom blended phenotypes from additional
    variants cannot be excluded, the boundaries of CKAP2L-related disease and
    the mechanistic contribution of specific variant classes (truncating vs.
    the reported missense allele, and possible gain-of-function effects
    suggested by mouse Radmis overexpression studies) are unresolved.

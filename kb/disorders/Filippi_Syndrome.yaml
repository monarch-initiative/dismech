inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Autosomal-recessive inheritance caused by biallelic (typically homozygous
    frameshift) loss-of-function mutations in CKAP2L. Reported families are
    frequently consanguineous, and affected individuals carry homozygous or
    compound-heterozygous CKAP2L variants.
  evidence:

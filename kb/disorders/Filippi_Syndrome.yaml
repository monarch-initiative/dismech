- name: Neural Progenitor Division Failure
  biological_scale: CELLULAR
  conforms_to: "neural_progenitor_centrosome_spindle_dysfunction#Abnormal Progenitor Division and Fate Choice"
  description: >-
    CKAP2L/radmis is enriched in neural stem/progenitor cells and, in the
    embryonic and perinatal brain, decorates both the bipolar mitotic spindle
    and the radial (basal) fiber of dividing radial glia — the two structures
    that set division geometry and daughter-cell fate during corticogenesis.
    Perturbing radmis dosage in vivo shifts progenitors out of cycle: forced
    expression reduced progenitor proliferation, increased cell-cycle exit,
    depleted the Tbr2-positive basal progenitor population, and shrank the
    embryonic subventricular zone. Loss of function disorganizes the same
    spindle. Both directions converge on failure of the normal
    proliferative/neurogenic division balance.

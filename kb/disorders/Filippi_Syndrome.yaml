    reference_title: "Mutations in CKAP2L, the human homolog of the mouse Radmis gene, cause Filippi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Filippi syndrome is a rare, presumably autosomal-recessive disorder characterized by microcephaly, pre- and postnatal growth failure, syndactyly, and distinctive facial features"
    explanation: Establishes the presumed autosomal-recessive mode of inheritance for Filippi syndrome.
  - reference: PMID:38738944
    reference_title: "Filippi syndrome: Three new families suggest that urinary system abnormalities may belong to clinical spectrum of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three patients had homozygous frameshift variants of the CKAP2L gene"
    explanation: Homozygous frameshift CKAP2L variants in three families support recessive loss-of-function inheritance.

prevalence:
- population: Worldwide (published case reports and series)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A PRISMA systematic review searching PubMed, Embase, and Web of Science
    from inception to June 2025 recovered only 43 reported patients across 22
    studies, and that count includes clinically diagnosed and Filippi-like
    overlapping phenotypes as well as molecularly confirmed CKAP2L cases. No
    population-based prevalence estimate exists.
  evidence:

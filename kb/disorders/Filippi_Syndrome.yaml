name: Filippi Syndrome
disease_term:
  preferred_term: Filippi syndrome
  term:
    id: MONDO:0010092
    label: Filippi syndrome
creation_date: "2026-07-12T07:27:01Z"
category: Mendelian
description: >-
  Filippi syndrome (craniodigital syndrome; OMIM 272440) is an ultra-rare
  autosomal recessive multiple-congenital-anomaly disorder caused by biallelic
  loss-of-function variants in CKAP2L, which encodes cytoskeleton-associated
  protein 2-like. The clinical core is craniodigital: cutaneous syndactyly of
  the fingers and toes, microcephaly, pre- and postnatal growth failure, a
  distinctive facies (broad nasal bridge, underdeveloped alae nasi,
  micrognathia), and variable intellectual disability. CKAP2L is the human
  ortholog of mouse Radmis (radial fiber and mitotic spindle), a
  microtubule-associated protein enriched in neural stem/progenitor cells that
  localizes to the mitotic spindle, spindle poles, centrosome, and the radial
  fibers of dividing radial glia. Patient cells lose CKAP2L from the spindle
  poles and show multipolar, disorganized spindles with chromosome
  missegregation, placing the disorder in the neural-progenitor
  centrosome-spindle family of microcephalies. A 2026 knockout-mouse and
  cell-biology study extended CKAP2L's role to negative regulation of primary
  cilium length and proposed reclassifying Filippi syndrome as a
  "centrosomopathy" with concurrent proliferation and ciliary defects; the same
  study found that Ckap2l-null mice do not reproduce the human developmental
  phenotype, which is curated here as an explicit human/model mismatch rather
  than smoothed over. Management is supportive and symptom-directed.
synonyms:
- type 1 syndactyly-microcephaly-intellectual disability syndrome
- craniodigital syndrome
- Scott craniodigital syndrome
- FLPIS
parents:

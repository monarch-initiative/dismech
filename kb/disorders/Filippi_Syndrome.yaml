    reference_title: "Clinical and Genetic Spectrum of Filippi Syndrome: A Systematic Review of Published Case Reports and Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two studies comprising 43 reported patients were included."
    explanation: >-
      Gives the total published case count underpinning the ultra-rare
      classification.
pathophysiology:
- name: Biallelic CKAP2L Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in CKAP2L — most commonly homozygous
    frameshift alleles, with rarer canonical splice-site, start-codon, and (in
    one family) missense alleles in trans — abolish or destabilize
    cytoskeleton-associated protein 2-like. CKAP2L is a bona fide
    microtubule-associated protein that localizes to microtubule-based
    organelles: the centrosome, the mitotic spindle and its poles, and the
    ciliary basal body. In lymphoblastoid cell lines from individuals
    homozygous for the founding c.571dupA allele, CKAP2L is no longer detectable
    at the spindle poles, establishing loss of function at the level of protein
    localization rather than a dominant-negative or gain-of-function mechanism.
